": "$90^{\\circ}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "As the object is placed symmetrically, $\\mathrm{n}=\\left(\\frac{360^{\\circ}}{\\theta}-1\\right) \\Rightarrow 3=\\left(\\frac{360^{\\circ}}{\\theta}-1\\right) \\Rightarrow \\theta=90^{\\circ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261bc0279619d9d8a2ef1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "If a ray of light in denser medium strikes a rarer medium at angle of incidence $i$, the angles of reflection and refraction are $r$ and $r^{\\prime}$ respectively. If the reflected and refracted rays are at right angles to each other, the critical angle for the given pair of media is", "image": null}, "options": [{"id": "dsfKV", "text": "$\\sin ^{-1}\\left(\\tan r^{\\prime}\\right)$", "image": null, "isCorrect": false}, {"id": "KimWo", "text": "$\\tan ^{-1}(\\sin \\mathrm{i})$", "image": null, "isCorrect": true}, {"id": "XmTkc", "text": "$\\sin ^{-1}(\\tan r)$", "image": null, "isCorrect": false}, {"id": "uDfEX", "text": "$\\cot ^{-1}(\\tan \\mathrm{i})$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/_a3WSwRHk01mI-XN-iqJyaUkH8siPcr9X9IymVmzF88.original.fullsize.png\"><br>\nAccording to Snell's Law,\n$\\begin{array}{ll} \n& \\frac{\\sin i}{\\sin r}=\\frac{1}{n} \\\\\n& \\text { But } i=r, \\\\\n\\therefore \\quad & \\frac{\\sin r}{\\sin r^{\\prime}}=\\frac{1}{n} \\\\\n& \\text { From figure } r^{\\prime}+r+90=180^{\\circ} \\\\\n\\therefore \\quad & r^{\\prime}=180^{\\circ}-90^{\\circ}-r=90^{\\circ}-r \\\\\n\\therefore \\quad & \\Rightarrow \\frac{\\sin r}{\\sin \\left(90^{\\circ}-r\\right)}=\\frac{1}{n} \\\\\n& \\frac{\\sin r}{\\cos r}=\\frac{1}{n}\n\\end{array}$\n$\\therefore \\quad \\tan \\mathrm{r}=\\frac{1}{\\mathrm{n}}$\nCritical angle is given by $\\sin i_c=\\frac{1}{n}$\n$\\begin{array}{ll}\n\\therefore & \\tan r=\\sin i_c \\\\\n\\therefore & i_c=\\sin ^{-1}(\\tan r)\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ecf0279619d9d8a1774", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}], "question": {"text": "The angle made by incident ray of light with the reflecting surface is called", "image": null}, "options": [{"id": "mZyE3", "text": "Glancing angle", "image": null, "isCorrect": true}, {"id": "2kEJg", "text": "Angle of incidence", "image": null, "isCorrect": false}, {"id": "0pU72", "text": "Angle of deviation", "image": null, "isCorrect": false}, {"id": "rd32T", "text": "Angle or refraction", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/332693.JPG\" style=\"width: 255px; height: 205px;\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e3c0279619d9d8a12ce", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "A pulse of a wave train travels along a stretched string and reaches the fixed end of the string. It will be reflected back with", "image": null}, "options": [{"id": "YKf29", "text": "a phase change of $180^{\\circ}$ with velocity reversed", "image": null, "isCorrect": false}, {"id": "YvKvN", "text": "the same phase as the incident pulse with no reversal of velocity", "image": null, "isCorrect": false}, {"id": "TUQx5", "text": "a phase change of $180^{\\circ}$ with no reversal of velocity", "image": null, "isCorrect": true}, {"id": "ZgD3Q", "text": "the same phase as the incident pulse but with velocity reversed", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A pulse of a wave train when travels along a stretched string and reaches the fixed end of the string, then it will be reflected back to the same medium and the reflected ray suffers a phase change of $\\pi$ with the incident wave but wave velocity after reflection does not change.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a263250279619d9d8a3c5c", "title": "Mirror Formula, Reflection in Spherical Mirror", "totalQuestions": 4, "questions": [{"_id": "6a44d3688c30a4553e1be36c", "type": "singleCorrect", "question": {"text": "If a parallel beam of light is incident on spherical mirrors then after reflection they pass through focal point. If F is the focal length and R is the radius of curvature of mirror then", "image": null}, "options": [{"id": "MfVQu", "label": "A", "text": "$R = F$", "isCorrect": false, "image": null}, {"id": "SuVZM", "label": "B", "text": "$R = 2F$", "isCorrect": true, "image": null}, {"id": "oxaWa", "label": "C", "text": "$R = F/2$", "isCorrect": false, "image": null}, {"id": "3ilGo", "label": "D", "text": "$R = F/4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a spherical mirror, the focal length $F$ is defined as the distance from the pole of the mirror to the principal focus.<br><br>For paraxial rays (rays close to the principal axis), the relationship between the focal length $F$ and the radius of curvature $R$ is given by $F = \\dfrac{R}{2}$.<br><br>Rearranging this relation, we get $R = 2F$.<br><br>Answer: $R = 2F$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba6bf9280d7f9932b40", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The image of an object approaching a convex mirror of radius of curvature 20 m along its optical axis is observed to move from $25 / 3 \\mathrm{~m}$ to $50 / 7 \\mathrm{~m}$ in 30 second. The speed of the object in $\\mathrm{km} / \\mathrm{hr}$ is", "image": null}, "options": [{"id": "BH95e", "text": "5", "image": null, "isCorrect": false}, {"id": "RurIg", "text": "2.5", "image": null, "isCorrect": false}, {"id": "Uv7HP", "text": "4", "image": null, "isCorrect": false}, {"id": "p1JF1", "text": "3", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For a convex mirror, the focal length is $f = \\dfrac{R}{2} = \\dfrac{20}{2} = +10 \\text{ m}$.<br><br>Using the mirror formula, $\\dfrac{1}{v} + \\dfrac{1}{u} = \\dfrac{1}{f}$<br><br>For the first position of the image, $v_1 = \\dfrac{25}{3} \\text{ m}$:<br><br>$\\dfrac{1}{u_1} = \\dfrac{1}{10} - \\dfrac{3}{25} = \\dfrac{5 - 6}{50} = -\\dfrac{1}{50}$<br><br>$u_1 = -50 \\text{ m}$<br><br>For the second position of the image, $v_2 = \\dfrac{50}{7} \\text{ m}$:<br><br>$\\dfrac{1}{u_2} = \\dfrac{1}{10} - \\dfrac{7}{50} = \\dfrac{5 - 7}{50} = -\\dfrac{2}{50} = -\\dfrac{1}{25}$<br><br>$u_2 = -25 \\text{ m}$<br><br>The distance moved by the object is $\\Delta u = |-25 - (-50)| = 25 \\text{ m}$.<br><br>The speed of the object is $v_{obj} = \\dfrac{\\Delta u}{\\Delta t} = \\dfrac{25}{30} = \\dfrac{5}{6} \\text{ m/s}$.<br><br>Converting the speed to km/hr:<br><br>$v_{obj} = \\dfrac{5}{6} \\times \\dfrac{18}{5} = 3 \\text{ km/hr}$<br><br>Answer: 3", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213350aee93fa0796d6fa", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "A concave mirror of focal length ' $f$ ' produces an image ' $n$ ' time the size of the object. If the image is real, then the distance of the object from the mirror is", "image": null}, "options": [{"id": "llRiX", "text": "$(\\mathrm{n}-1) \\mathrm{f}$", "image": null, "isCorrect": false}, {"id": "D7A6f", "text": "$\\left(\\dfrac{n-1}{n}\\right) \\mathrm{f}$", "image": null, "isCorrect": false}, {"id": "LiIsS", "text": "$\\left(\\dfrac{\\mathrm{n}+1}{\\mathrm{n}}\\right) \\mathrm{f}$", "image": null, "isCorrect": true}, {"id": "qX64O", "text": "$(\\mathrm{n}+1) \\mathrm{f}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a concave mirror, the focal length is taken as $-f$ and the object distance as $-u$ (where $f$ and $u$ are positive distances).<br><br>Since the image is real, it is inverted, so the magnification $m$ is negative. Thus, $m = -n$.<br><br>The magnification formula in terms of focal length and object distance is given by:<br><br>$m = \\dfrac{f}{f - u}$<br><br>Applying the sign convention:<br><br>$-n = \\dfrac{-f}{-f - (-u)}$<br><br>$-n = \\dfrac{-f}{-f + u}$<br><br>$-n(-f + u) = -f$<br><br>$nf - nu = -f$<br><br>$nu = nf + f$<br><br>$nu = (n + 1)f$<br><br>$u = \\left(\\dfrac{n + 1}{n}\\right)f$<br><br>The distance of the object from the mirror is $\\left(\\dfrac{n + 1}{n}\\right)f$.<br><br>Answer: $\\left(\\dfrac{\\mathrm{n}+1}{\\mathrm{n}}\\right) \\mathrm{f}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f670279619d9d8a1c30", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}], "question": {"text": "In the case of spherical mirrors, the images formed on the side of the object and images formed on the opposite side are respectively", "image": null}, "options": [{"id": "NEv6W", "text": "virtual and real.", "image": null, "isCorrect": false}, {"id": "wVa5N", "text": "Virtual and vintual.", "image": null, "isCorrect": false}, {"id": "NgKBC", "text": "real and real.", "image": null, "isCorrect": false}, {"id": "iVmmU", "text": "real and virtual.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Thoery question", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a263240279619d9d8a3c56", "title": "Critical angle and total internal reflection", "totalQuestions": 19, "questions": [{"_id": "6abb889f15a9fc0fc8c1456c", "type": "singleCorrect", "question": {"text": "The minimum refractive index of the material of a right-angled isosceles prism as shown in the following figure is<br><img style=\"width: 300px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/may/watermarked_images/19_may_shift_2__q48_d1_v2.png\" />", "image": null}, "options": [{"id": "lXOII", "label": "A", "text": "$1$", "isCorrect": false, "image": null}, {"id": "doXeb", "label": "B", "text": "$\\sqrt{2}$", "isCorrect": true, "image": null}, {"id": "sXEa8", "label": "C", "text": "$\\sqrt{3}$", "isCorrect": false, "image": null}, {"id": "nWVQE", "label": "D", "text": "$1.5$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "From the given figure, the light ray X is incident normally on the face PQ of the right-angled isosceles prism.<br><br>It passes undeviated through face PQ and strikes the face PR.<br><br>From the geometry of the prism, the normal to the face PR makes an angle of $45^\\circ$ with the horizontal. Thus, the angle of incidence at the face PR is $i = 45^\\circ$.<br><br>The diagram shows the ray undergoing total internal reflection at the face PR to emerge as ray Y.<br><br>For total internal reflection to occur, the angle of incidence must be greater than or equal to the critical angle $C$.<br><br>$i \\ge C$<br><br>$\\sin 45^\\circ \\ge \\sin C$<br><br>Using the relation $\\sin C = \\dfrac{1}{\\mu}$, where $\\mu$ is the refractive index of the material of the prism:<br><br>$\\dfrac{1}{\\sqrt{2}} \\ge \\dfrac{1}{\\mu}$<br><br>$\\mu \\ge \\sqrt{2}$<br><br>The minimum refractive index required for this phenomenon is $\\sqrt{2}$.<br><br>Answer: $\\sqrt{2}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883d15a9fc0fc8c141d4", "type": "singleCorrect", "question": {"text": "A ray of light takes time '$t$' to travel a distance '$d$' in air and it travels a distance '$4d$', in time '$T$' in a certain medium. If $T = 8t$, the critical angle for the pair of media is<br>$\\left[\\sin\\left(\\dfrac{\\pi}{6}\\right) = 0.5, \\sin\\left(\\dfrac{\\pi}{4}\\right) = \\dfrac{1}{\\sqrt{2}}, \\sin\\left(\\dfrac{\\pi}{3}\\right) = \\dfrac{\\sqrt{3}}{2}, \\sin\\left(\\dfrac{\\pi}{2}\\right) = 1\\right]$", "image": null}, "options": [{"id": "Us2qi", "label": "A", "text": "$\\dfrac{\\pi^c}{2}$", "isCorrect": false, "image": null}, {"id": "5ZQXu", "label": "B", "text": "$\\dfrac{\\pi^c}{3}$", "isCorrect": false, "image": null}, {"id": "fTxTM", "label": "C", "text": "$\\dfrac{\\pi^c}{4}$", "isCorrect": false, "image": null}, {"id": "OuaxV", "label": "D", "text": "$\\dfrac{\\pi^c}{6}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Speed of light in air is $c = \\dfrac{d}{t}$<br><br>Speed of light in the medium is $v = \\dfrac{4d}{T}$<br><br>Given $T = 8t$, we get $v = \\dfrac{4d}{8t} = \\dfrac{d}{2t} = \\dfrac{c}{2}$<br><br>The refractive index of the medium is $\\mu = \\dfrac{c}{v} = 2$<br><br>The critical angle $\\theta_c$ is given by $\\sin \\theta_c = \\dfrac{1}{\\mu} = \\dfrac{1}{2}$<br><br>Therefore, $\\theta_c = \\dfrac{\\pi^c}{6}$<br><br>Answer: $\\dfrac{\\pi^c}{6}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3068c30a4553e1bdf56", "type": "singleCorrect", "question": {"text": "Light travels a distance 'x' in time '$t_0$' in air and '$4x$' in time '$t_1$' in another denser medium. The critical angle for this medium is", "image": null}, "options": [{"id": "6Vn8n", "label": "A", "text": "$\\sin^{-1}\\left(\\dfrac{t_1}{t_0}\\right)$", "isCorrect": false, "image": null}, {"id": "sEON3", "label": "B", "text": "$\\sin^{-1}\\left(\\dfrac{4t_0}{t_1}\\right)$", "isCorrect": true, "image": null}, {"id": "9oAB9", "label": "C", "text": "$\\sin^{-1}\\left(\\dfrac{4t_1}{t_0}\\right)$", "isCorrect": false, "image": null}, {"id": "4S9ZL", "label": "D", "text": "$\\sin^{-1}\\left(\\dfrac{t_0}{4t_1}\\right)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Speed of light in air is given by $v_1 = \\dfrac{x}{t_0}$<br><br>Speed of light in the denser medium is given by $v_2 = \\dfrac{4x}{t_1}$<br><br>The refractive index of the denser medium with respect to air is $\\mu = \\dfrac{v_1}{v_2}$<br><br>The critical angle $\\theta_c$ for the medium is given by $\\sin \\theta_c = \\dfrac{1}{\\mu} = \\dfrac{v_2}{v_1}$<br><br>Substituting the values of $v_1$ and $v_2$:<br><br>$\\sin \\theta_c = \\dfrac{\\dfrac{4x}{t_1}}{\\dfrac{x}{t_0}} = \\dfrac{4t_0}{t_1}$<br><br>$\\theta_c = \\sin^{-1}\\left(\\dfrac{4t_0}{t_1}\\right)$<br><br>Answer: $\\sin^{-1}\\left(\\dfrac{4t_0}{t_1}\\right)$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b47bf9280d7f99327c5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The phenomenon, which is not due to total internal reflection is", "image": null}, "options": [{"id": "kfEud", "text": "mirage on hot summer days.", "image": null, "isCorrect": false}, {"id": "0G6lV", "text": "brilliance of diamond.", "image": null, "isCorrect": false}, {"id": "J0mBX", "text": "difference between apparent and real depth of a pond.", "image": null, "isCorrect": true}, {"id": "oD07u", "text": "working of optical fibre.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Mirage on hot summer days, the brilliance of a diamond, and the working of an optical fibre are all phenomena based on total internal reflection.<br><br>The difference between the apparent and real depth of a pond is due to the refraction of light at the water-air interface, not total internal reflection.<br><br>Answer: difference between apparent and real depth of a pond.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214080aee93fa0796dd73", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "For a ray of light, the critical angle is minimum, when it travels from", "image": null}, "options": [{"id": "47h6S", "text": "glass to air", "image": null, "isCorrect": true}, {"id": "nkpA5", "text": "air to glass", "image": null, "isCorrect": false}, {"id": "dTDuz", "text": "glass to water", "image": null, "isCorrect": false}, {"id": "QPpAL", "text": "water to glass", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The critical angle $\\theta_c$ is defined when light travels from an optically denser medium to an optically rarer medium. Thus, the options \"air to glass\" and \"water to glass\" are incorrect as light travels from rarer to denser medium in these cases.<br><br>The formula for the critical angle is given by $\\sin \\theta_c = \\dfrac{\\mu_R}{\\mu_D}$, where $\\mu_R$ is the refractive index of the rarer medium and $\\mu_D$ is the refractive index of the denser medium.<br><br>For the critical angle to be minimum, the ratio $\\dfrac{\\mu_R}{\\mu_D}$ must be minimum.<br><br>For glass to air: $\\sin \\theta_c = \\dfrac{\\mu_a}{\\mu_g} = \\dfrac{1}{1.5} = 0.67$<br><br>For glass to water: $\\sin \\theta_c = \\dfrac{\\mu_w}{\\mu_g} = \\dfrac{1.33}{1.5} = 0.89$<br><br>Since $0.67 < 0.89$, the critical angle is minimum when light travels from glass to air.<br><br>Answer: glass to air", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213f20aee93fa0796dcc6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "Critical angle of light passing from glass to air is minimum for wavelength of", "image": null}, "options": [{"id": "pZBh4", "text": "red colour", "image": null, "isCorrect": false}, {"id": "PW7o1", "text": "yellow colour", "image": null, "isCorrect": false}, {"id": "h29Pd", "text": "green colour", "image": null, "isCorrect": false}, {"id": "N6uYU", "text": "blue colour", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The critical angle $\\theta_c$ is given by $\\sin \\theta_c = \\dfrac{1}{\\mu}$.<br><br>For the critical angle to be minimum, the refractive index $\\mu$ must be maximum.<br><br>According to Cauchy's relation, the refractive index depends on the wavelength $\\lambda$ as $\\mu = A + \\dfrac{B}{\\lambda^2}$. Thus, $\\mu$ is inversely related to $\\lambda$.<br><br>For $\\mu$ to be maximum, the wavelength $\\lambda$ must be minimum.<br><br>Among the given colors, blue light has the minimum wavelength.<br><br>Therefore, the critical angle is minimum for blue color.<br><br>Answer: blue colour", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e30aee93fa0796dc4d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "For a light ray to undergo total internal reflection ( $\\mathrm{i}=$ angle of incidence, $\\mathrm{i}_{\\mathrm{c}}=$ critical angle )", "image": null}, "options": [{"id": "yPEBx", "text": "light travels from denser to rarer medium and $\\mathrm{i} \\lt \\mathrm{i}_{\\mathrm{c}}$.", "image": null, "isCorrect": false}, {"id": "JSWcz", "text": "light travels from rarer to denser medium and $\\mathrm{i} \\lt \\mathrm{i}_{\\mathrm{c}}$.", "image": null, "isCorrect": false}, {"id": "pdoIA", "text": "light travels from denser to rarer medium and $\\mathrm{i}\\gt\\mathrm{i}_{\\mathrm{c}}$.", "image": null, "isCorrect": true}, {"id": "zqgXu", "text": "light travels from rarer to denser medium and $\\mathrm{i}\\gt\\mathrm{i}_{\\mathrm{c}}$.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For total internal reflection to occur, two conditions must be satisfied:<br><br>1. The light ray must travel from an optically denser medium to an optically rarer medium.<br><br>2. The angle of incidence $i$ in the denser medium must be greater than the critical angle $i_c$ for the given pair of media, i.e., $i \\gt i_c$.<br><br>Answer: light travels from denser to rarer medium and $\\mathrm{i}\\gt\\mathrm{i}_{\\mathrm{c}}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792135b0aee93fa0796d826", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "White light is incident on the interface of glass and air as shown in figure. If green light is just totally internally reflected, then reflected rays inside the glass contain\r\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/FI6JzEAvXxivsA20G6IS-tqKLiyGCXEX-CtQAL7ye7w.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "UaQVl", "text": "yellow, orange, red", "image": null, "isCorrect": false}, {"id": "BhlTs", "text": "violet, indigo, blue", "image": null, "isCorrect": true}, {"id": "PgJGE", "text": "green, yellow, orange", "image": null, "isCorrect": false}, {"id": "VX01G", "text": "all colours except green", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The critical angle $C$ for a medium is given by the relation $\\sin C = \\dfrac{1}{\\mu}$, where $\\mu$ is the refractive index of the medium.<br><br>According to Cauchy's equation, the refractive index $\\mu$ depends on the wavelength $\\lambda$ of light as $\\mu = A + \\dfrac{B}{\\lambda^2}$. Thus, $\\mu$ decreases as $\\lambda$ increases.<br><br>The order of wavelengths for the visible spectrum is:<br>$\\lambda_V < \\lambda_I < \\lambda_B < \\lambda_G < \\lambda_Y < \\lambda_O < \\lambda_R$<br><br>Consequently, the refractive indices follow the reverse order:<br>$\\mu_V > \\mu_I > \\mu_B > \\mu_G > \\mu_Y > \\mu_O > \\mu_R$<br><br>Since $\\sin C = \\dfrac{1}{\\mu}$, the critical angles for the respective colors will be in the order:<br>$C_V < C_I < C_B < C_G < C_Y < C_O < C_R$<br><br>The problem states that green light is just totally internally reflected, which means the angle of incidence $i$ is exactly equal to the critical angle for green light ($i = C_G$).<br><br>For total internal reflection to occur for a specific color, the angle of incidence $i$ must be greater than its critical angle ($i > C$).<br><br>Since $i = C_G$, we have:<br>$i > C_V$<br>$i > C_I$<br>$i > C_B$<br><br>Therefore, violet, indigo, and blue light will undergo total internal reflection and will be present in the reflected rays inside the glass. The colors yellow, orange, and red have critical angles greater than $i$, so they will be refracted into the air.<br><br>Answer: violet, indigo, blue", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2626a0279619d9d8a3457", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "The angle of deviation produced by a thin prism when placed in air is ' $\\delta_1$ ' and that when immersed in water is ' $\\delta_2$ '. The refractive index of glass and water are $\\frac{3}{2}$ and $\\frac{4}{3}$ respectively. The ratio $\\delta_1: \\delta_2$ is", "image": null}, "options": [{"id": "yPI6L", "text": "$1: 2$", "image": null, "isCorrect": false}, {"id": "Zpdat", "text": "$2: 1$", "image": null, "isCorrect": false}, {"id": "qavH1", "text": "$1: 4$", "image": null, "isCorrect": false}, {"id": "wBovI", "text": "$4: 1$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For thin prism, $\\delta=(\\mu-\\mathrm{i}) \\mathrm{A}$\nGiven, $\\mu_1=\\frac{\\mu_{\\text {glass }}}{\\mu_{\\text {air }}}=\\frac{3}{2}$ and $\\frac{\\mu_{\\text {water }}}{\\mu_{\\text {air }}}=\\frac{4}{3}$\n$$\n\\begin{array}{ll}\n\\therefore & \\mu_2=\\frac{\\mu_{\\text {glass }}}{\\mu_{\\text {water }}}=\\frac{\\frac{3}{2}}{\\frac{4}{3}}=\\frac{9}{8} \\\\\n\\therefore & \\frac{\\delta_1}{\\delta_2}=\\frac{\\mu_1-1}{\\mu_2-1}=\\frac{\\frac{3}{2}-1}{\\frac{9}{8}-1} \\\\\n\\therefore & \\frac{\\delta_1}{\\delta_2}=4\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261810279619d9d8a2d1c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "The speed of light in two media $c_1$ and $c_2$ are $1.5 \\times 10^8 \\mathrm{~m} / \\mathrm{s}$ and $2 \\times 10^8 \\mathrm{~m} / \\mathrm{s}$ respectively. If the light undergoes total internal reflection, the critical angle between the two media is", "image": null}, "options": [{"id": "ixxfY", "text": "$\\sin ^{-1}\\left(\\frac{2}{3}\\right)$", "image": null, "isCorrect": false}, {"id": "yioyH", "text": "$\\sin ^{-1}\\left(\\frac{4}{3}\\right)$", "image": null, "isCorrect": false}, {"id": "0Riw8", "text": "$\\sin ^{-1}\\left(\\frac{3}{2}\\right)$", "image": null, "isCorrect": false}, {"id": "HDmL4", "text": "$\\sin ^{-1}\\left(\\frac{3}{4}\\right)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The refractive index of the medium is defined as, $\\mu_m=\\frac{c}{c_m}$, i.e., $c_m$ is the speed of light in medium and $c$ is the speed of light in vaccum.\nSince, $c_1<c_2$ so, $\\mu_1>\\mu_2$ and medium 2 is the rarerer medium.\nAccording to snells law,\n$\\mu_m \\sin \\theta_m=\\mu \\sin \\theta=$ constant\nAt critical angle, the angle of incidence in denser medium is $\\theta_{\\mathrm{C}}$ critical and angle of refraction in rarerer medium is $\\theta=\\frac{\\pi}{2}$.\nTherefore,\n$\\begin{aligned} & \\mu_1 \\sin \\theta_{1 C}=\\mu_2 \\sin \\left(\\frac{\\pi}{2}\\right) \\\\ & \\Rightarrow \\sin \\theta_{1 \\mathrm{C}}=\\left(\\frac{\\mu_2}{\\mu_1}\\right)=\\left(\\frac{c_1}{c_2}\\right)=\\frac{1.5 \\times 10^8 \\mathrm{~m} / \\mathrm{s}}{2 \\times 10^8 \\mathrm{~m} / \\mathrm{s}}=\\frac{3}{4} \\\\ & \\Rightarrow \\theta_{1 \\mathrm{C}}=\\sin ^{-1}\\left(\\frac{3}{4}\\right)\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261730279619d9d8a2ca8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "For a light ray to undergo total internal reflection, light must travel from ( $i$ = angle of incidence,$i_C=$ critical angle $)$", "image": null}, "options": [{"id": "DJ1tK", "text": "rarer to denser medium and $i<i_c$", "image": null, "isCorrect": false}, {"id": "FOWqQ", "text": "denser to rarer medium and $i<i_c$", "image": null, "isCorrect": false}, {"id": "KRfAC", "text": "denser to rarer medium and $i>i_c$", "image": null, "isCorrect": true}, {"id": "TXFBy", "text": "rarer to denser medium and $i>i_c$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Condition of total internal reflection: The conditions to be satisfied for total internal reflection are as follows -\n1) Light must travel from a denser to a rarer medium.\n2) The angle of incidence $i$ must be greater than the critical angle $i_C$ the two media.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261620279619d9d8a2c1c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "For occurring total internal reflection, which one of the following is correct statement?\n$\\text { (i = angle incidence, } \\mathrm{i}_{\\mathrm{C}}=\\text { critical angle). }$", "image": null}, "options": [{"id": "otoB5", "text": "Ray travels from denser medium to rarer medium and $\\mathrm{i}>\\mathrm{i}_{\\mathrm{C}}$.", "image": null, "isCorrect": true}, {"id": "OtrB6", "text": "Ray travels from rarer medium to denser medium and $\\mathrm{i} < \\mathrm{i}_{\\mathrm{C}}$.", "image": null, "isCorrect": false}, {"id": "oxMba", "text": "Ray travels from rarer medium to denser medium and $\\mathrm{i} < \\mathrm{i}_{\\mathrm{C}}$.", "image": null, "isCorrect": false}, {"id": "zuyIL", "text": "Ray travels from denser medium to rarer medium and $\\mathrm{i} < \\mathrm{i}_{\\mathrm{C}}$.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Concept based.", "image": null}, "videoSolution" 5d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2605d0279619d9d8a23e3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "The refractive index of glass is 1.5 and that of water is 1.33 . The critical angle for a ray of light going from glass to water is", "image": null}, "options": [{"id": "H4CkC", "text": "$\\sin ^{-1}\\left(\\frac{4}{7}\\right)$", "image": null, "isCorrect": false}, {"id": "8vftz", "text": "$\\sin ^{-1}\\left(\\frac{5}{8}\\right)$", "image": null, "isCorrect": false}, {"id": "vGfJZ", "text": "$\\sin ^{-1}\\left(\\frac{8}{9}\\right)$", "image": null, "isCorrect": true}, {"id": "SVwBE", "text": "$\\sin ^{-1}\\left(\\frac{2}{3}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mu_{\\mathrm{g}}=1.5=\\frac{3}{2} \\quad \\mu_{\\mathrm{w}}=1.33=\\frac{4}{3} \\\\ & \\therefore{ }_{\\mathrm{w}} \\mu_{\\mathrm{g}}=\\frac{\\mu_{\\mathrm{g}}}{\\mu_{\\mathrm{w}}}=\\frac{3}{2} \\times \\frac{3}{4}=\\frac{9}{8} \\\\ & \\sin C=\\frac{1}{{ }_w \\mu_{\\mathrm{g}}}=\\frac{8}{9} \\\\ & \\therefore \\mathrm{C}=\\sin ^{-1}\\left(\\frac{8}{9}\\right)\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260120279 i mathvariant=\"normal\">n</mi><mi>θ</mi></mrow><mrow><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi>r</mi></mrow></mfrac></math>  <br/><math><mo>⇒</mo><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi>r</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi>θ</mi></mrow><mrow><mi>μ</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mrow><mrow><mn>1</mn></mrow><mo>/</mo><mrow><mi>μ</mi></mrow></mrow></mrow><mrow><mi>μ</mi></mrow></mfrac></math> [from Eq. (i)] <br/><math><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi>r</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mi>μ</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math>  <br/><math><mi>r</mi><mo>=</mo><msup><mrow><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mi>μ</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e520279619d9d8a1380", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "Advantage of optical fibre is", "image": null}, "options": [{"id": "tmmri", "text": "high band width and EM interference", "image": null, "isCorrect": false}, {"id": "pXlcO", "text": "low band width and EM interference", "image": null, "isCorrect": false}, {"id": "MvrIu", "text": "high band width low transmission capacity and no EM interference", "image": null, "isCorrect": false}, {"id": "eluW5", "text": "high band width, high data transmission capacity and no EM interference", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Few advantages of optical fibres are that the number of signals carried by optical fibres is much more than that carried by the Cu wire or radio waves. Optical fibres are practically free from electromagnetic interference and problem of cross talks whereas ordinary cables and microwave links suffer a lot from it.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "65a263240279619d9d8a3c57", "title": "Refraction of light from plane surface", "totalQuestions": 70, "questions": [{"_id": "6abb88cb15a9fc0fc8c14710", "type": "singleCorrect", "question": {"text": "A beam of light is travelling from region I to region IV. The refractive indices in regions I, II, III and IV are $n$, $\\dfrac{n}{2}$, $\\dfrac{n}{3}$ and $\\dfrac{n}{4}$ respectively. The angle of incidence for which the beam just misses entering region IV is [$\\sin 90^\\circ = 1$]<br><br><img style=\"width: 400px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/may/watermarked_images/20_may_shift_1__q18_d1.png\" />", "image": null}, "options": [{"id": "iDqTH", "label": "A", "text": "$\\sin^{-1}(1)$", "isCorrect": false, "image": null}, {"id": "ByKry", "label": "B", "text": "$\\sin^{-1}\\left(\\dfrac{1}{2}\\right)$", "isCorrect": false, "image": null}, {"id": "LRoPV", "label": "C", "text": "$\\sin^{-1}\\left(\\dfrac{1}{3}\\right)$", "isCorrect": false, "image": null}, {"id": "ZsUdP", "label": "D", "text": "$\\sin^{-1}\\left(\\dfrac{1}{4}\\right)$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "According to Snell's law for multiple parallel interfaces, the product of the refractive index and the sine of the angle made with the normal remains constant across all regions:<br><br>$n_1 \\sin \\theta_1 = n_2 \\sin \\theta_2 = n_3 \\sin \\theta_3 = n_4 \\sin \\theta_4$<br><br>For the beam to just miss entering region IV, it must undergo total internal reflection at the boundary between region III and region IV. This means the angle of refraction in region IV is $90^\\circ$.<br><br>Equating the terms for region I and region IV, we get:<br><br>$n_1 \\sin \\theta_1 = n_4 \\sin 90^\\circ$<br><br>Given that $n_1 = n$, $\\theta_1 = \\theta$, and $n_4 = \\dfrac{n}{4}$:<br><br>$n \\sin \\theta = \\dfrac{n}{4} \\times 1$<br><br>$\\sin \\theta = \\dfrac{1}{4}$<br><br>$\\theta = \\sin^{-1}\\left(\\dfrac{1}{4}\\right)$<br><br>Answer: $\\sin^{-1}\\left(\\dfrac{1}{4}\\right)$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889c15a9fc0fc8c14551", "type": "singleCorrect", "question": {"text": "A ray of light is incident at a glass-water interface at an angle $(i_1)$, it emerges finally parallel to the surface of water, then the value of the refractive index of glass $(\\mu_g)$ is $\\{\\mu_w = \\text{refractive index of water} = 4/3, \\sin(90)^\\circ = 1, \\cos(90)^\\circ = 0\\}$<br><img style=\"width: 400px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/may/watermarked_images/19_may_shift_2__q21_d1.png\" />", "image": null}, "options": [{"id": "qNCqP", "label": "A", "text": "$1$", "isCorrect": false, "image": null}, {"id": "Y48Wg", "label": "B", "text": "$\\dfrac{4}{3}$", "isCorrect": false, "image": null}, {"id": "qc31j", "label": "C", "text": "$\\dfrac{1}{\\sin(i)}$", "isCorrect": true, "image": null}, {"id": "fHbXX", "label": "D", "text": "$\\dfrac{4\\sin(i)}{3}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Applying Snell's law at the glass-water interface:<br><br>$\\mu_g \\sin(i_1) = \\mu_w \\sin(r)$<br><br>Applying Snell's law at the water-air interface:<br><br>$\\mu_w \\sin(i_2) = \\mu_a \\sin(90^\\circ)$<br><br>Since the interfaces are parallel, the alternate interior angles are equal, giving $r = i_2$.<br><br>Equating the expressions:<br><br>$\\mu_g \\sin(i_1) = \\mu_w \\sin(i_2) = \\mu_a \\sin(90^\\circ)$<br><br>Substituting $\\mu_a = 1$ and $\\sin(90^\\circ) = 1$:<br><br>$\\mu_g \\sin(i_1) = 1 \\times 1 = 1$<br><br>$\\mu_g = \\dfrac{1}{\\sin(i_1)}$<br><br>Taking $i_1$ as $i$ to match the given options, we get $\\mu_g = \\dfrac{1}{\\sin(i)}$.<br><br>Answer: $\\dfrac{1}{\\sin(i)}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884e15a9fc0fc8c14273", "type": "singleCorrect", "question": {"text": "For the same angle of incidence, the angles of refraction in media A, B, C and D are $50^\\circ$, $40^\\circ$, $30^\\circ$ and $20^\\circ$ respectively. The speed of light is minimum in medium", "image": null}, "options": [{"id": "y2neP", "label": "A", "text": "A", "isCorrect": false, "image": null}, {"id": "PVRHS", "label": "B", "text": "B", "isCorrect": false, "image": null}, {"id": "7aCGh", "label": "C", "text": "C", "isCorrect": false, "image": null}, {"id": "55wdH", "label": "D", "text": "D", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "According to Snell's law, $\\mu = \\dfrac{\\sin i}{\\sin r}$<br><br>The refractive index is also given by $\\mu = \\dfrac{c}{v}$<br><br>Equating the two expressions, we get $\\dfrac{c}{v} = \\dfrac{\\sin i}{\\sin r}$<br><br>$v = c \\dfrac{\\sin r}{\\sin i}$<br><br>For a given angle of incidence $i$, the speed of light $v$ is directly proportional to $\\sin r$.<br><br>Since the sine function is increasing in the interval $(0^\\circ, 90^\\circ)$, the minimum value of $r$ will result in the minimum speed of light.<br><br>The minimum angle of refraction is $20^\\circ$, which corresponds to medium D.<br><br>Therefore, the speed of light is minimum in medium D.<br><br>Answer: D", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888b15a9fc0fc8c144ae", "type": "singleCorrect", "question": {"text": "How much water should be filled in a container of height $21$ cm, so that it appears half filled to the observer when viewed from the top of the container? ($\\mu = 4/3$)", "image": null}, "options": [{"id": "hDvW7", "label": "A", "text": "$8$ cm", "isCorrect": false, "image": null}, {"id": "fSOzy", "label": "B", "text": "$10.5$ cm", "isCorrect": false, "image": null}, {"id": "410PM", "label": "C", "text": "$12$ cm", "isCorrect": true, "image": null}, {"id": "QU95H", "label": "D", "text": "$14$ cm", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the total height of the container be $H = 21$ cm and the height of the water filled be $h$.<br><br>The height of the empty part of the container is $H - h$.<br><br>The apparent depth of the water when viewed from the top is $h_{app} = \\dfrac{h}{\\mu}$.<br><br>For the container to appear half filled, the apparent depth of the water must be equal to the height of the empty part.<br><br>$h_{app} = H - h$<br><br>$\\dfrac{h}{\\mu} = 21 - h$<br><br>Given $\\mu = \\dfrac{4}{3}$,<br><br>$\\dfrac{3h}{4} = 21 - h$<br><br>$\\dfrac{3h}{4} + h = 21$<br><br>$\\dfrac{7h}{4} = 21$<br><br>$h = 12$ cm.<br><br>Answer: $12$ cm", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885b15a9fc0fc8c142eb", "type": "singleCorrect", "question": {"text": "Three immiscible transparent liquids with refractive indices $\\dfrac{3}{2}$, $\\dfrac{4}{3}$ and $\\dfrac{6}{5}$ are arranged one above the other. The depths of the liquids are 3 cm, 4 cm and 6 cm respectively. The apparent depth of the vessel is", "image": null}, "options": [{"id": "uyCBf", "label": "A", "text": "$10$ cm", "isCorrect": true, "image": null}, {"id": "pNtqd", "label": "B", "text": "$9$ cm", "isCorrect": false, "image": null}, {"id": "jziT7", "label": "C", "text": "$8$ cm", "isCorrect": false, "image": null}, {"id": "WbP2p", "label": "D", "text": "$7$ cm", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The apparent depth of a vessel containing multiple immiscible liquids is given by the sum of the apparent depths of individual liquid layers.<br><br>$D_{app} = \\dfrac{d_1}{\\mu_1} + \\dfrac{d_2}{\\mu_2} + \\dfrac{d_3}{\\mu_3}$<br><br>Substituting the given values:<br><br>$D_{app} = \\dfrac{3}{\\dfrac{3}{2}} + \\dfrac{4}{\\dfrac{4}{3}} + \\dfrac{6}{\\dfrac{6}{5}}$<br><br>$D_{app} = \\left(3 \\times \\dfrac{2}{3}\\right) + \\left(4 \\times \\dfrac{3}{4}\\right) + \\left(6 \\times \\dfrac{5}{6}\\right)$<br><br>$D_{app} = 2 + 3 + 5 = 10$ cm<br><br>Answer: $10$ cm", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f88c30a4553e1bdec1", "type": "singleCorrect", "question": {"text": "A glass slab of thickness $6.0$ cm is placed on the piece of paper on which an inkdot is marked. By how much distance would an inkdot appear to be raised? The velocity of light in glass is $2 \\times 10^8 \\text{ ms}^{-1}$ and that in air is $3 \\times 10^8 \\text{ ms}^{-1}$.", "image": null}, "options": [{"id": "2s7FS", "label": "A", "text": "$2.0$ cm", "isCorrect": true, "image": null}, {"id": "FM9eE", "label": "B", "text": "$3.0$ cm", "isCorrect": false, "image": null}, {"id": "w8BM4", "label": "C", "text": "$4.0$ cm", "isCorrect": false, "image": null}, {"id": "JcIau", "label": "D", "text": "$5.0$ cm", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The refractive index of glass is given by $\\mu = \\dfrac{c}{v_g}$<br><br>$\\mu = \\dfrac{3 \\times 10^8}{2 \\times 10^8} = 1.5 = \\dfrac{3}{2}$<br><br>The apparent shift of the inkdot is given by the formula $\\Delta x = t \\left(1 - \\dfrac{1}{\\mu}\\right)$<br><br>Substituting the given values:<br><br>$\\Delta x = 6.0 \\left(1 - \\dfrac{2}{3}\\right)$<br><br>$\\Delta x = 6.0 \\times \\dfrac{1}{3} = 2.0 \\text{ cm}$<br><br>The inkdot appears to be raised by $2.0 \\text{ cm}$.<br><br>Answer: $2.0$ cm", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d08c30a4553e1bdd15", "type": "singleCorrect", "question": {"text": "A ray of light passes from the vacuum into a medium of refractive index 'n'. If the angle of incidence is twice the angle of refraction, then the angle of incidence in terms of refractive index is", "image": null}, "options": [{"id": "cdM5o", "label": "A", "text": "$\\sin^{-1}\\left(\\dfrac{n}{2}\\right)$", "isCorrect": false, "image": null}, {"id": "szePD", "label": "B", "text": "$2\\cos^{-1}\\left(\\dfrac{n}{2}\\right)$", "isCorrect": true, "image": null}, {"id": "kvArB", "label": "C", "text": "$2\\sin^{-1}\\left(\\dfrac{n}{2}\\right)$", "isCorrect": false, "image": null}, {"id": "cz3J2", "label": "D", "text": "$\\cos^{-1}\\left(\\dfrac{n}{2}\\right)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the angle of incidence be $i$ and the angle of refraction be $r$.<br><br>Given that the angle of incidence is twice the angle of refraction:<br><br>$i = 2r$<br><br>According to Snell's law:<br><br>$\\sin(i) = n \\sin(r)$<br><br>Substituting $i = 2r$ into the equation:<br><br>$\\sin(2r) = n \\sin(r)$<br><br>Using the double angle formula $\\sin(2r) = 2 \\sin(r) \\cos(r)$:<br><br>$2 \\sin(r) \\cos(r) = n \\sin(r)$<br><br>Assuming $r \\neq 0$, dividing both sides by $\\sin(r)$ gives:<br><br>$2 \\cos(r) = n$<br><br>$\\cos(r) = \\dfrac{n}{2}$<br><br>$r = \\cos^{-1}\\left(\\dfrac{n}{2}\\right)$<br><br>Since the angle of incidence is $i = 2r$, we get:<br><br>$i = 2\\cos^{-1}\\left(\\dfrac{n}{2}\\right)$<br><br>Answer: $2\\cos^{-1}\\left(\\dfrac{n}{2}\\right)$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2dd8c30a4553e1bdd9e", "type": "singleCorrect", "question": {"text": "In the phenomenon of refraction of light for the same angle of incidence", "image": null}, "options": [{"id": "EQLtM", "label": "A", "text": "angle of refraction is same for different colours.", "isCorrect": false, "image": null}, {"id": "QXW1Q", "label": "B", "text": "angle of refraction is different for different colours.", "isCorrect": true, "image": null}, {"id": "WO4Rp", "label": "C", "text": "angle of refraction does not depend upon the colour of the light used.", "isCorrect": false, "image": null}, {"id": "j6xu6", "label": "D", "text": "angle of refraction depends on critical angle.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Snell's law, $\\dfrac{\\sin i}{\\sin r} = \\mu$, where $\\mu$ is the refractive index of the medium.<br><br>The refractive index of a medium depends on the wavelength of light according to Cauchy's relation $\\mu = A + \\dfrac{B}{\\lambda^2}$.<br><br>Since different colours of light have different wavelengths, the refractive index $\\mu$ is different for different colours.<br><br>Therefore, for a given angle of incidence $i$, the angle of refraction $r$ will be different for different colours.<br><br>Answer: angle of refraction is different for different colours.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3148c30a4553e1bdfef", "type": "singleCorrect", "question": {"text": "A ray of light travels from air to water to glass and again from glass to air. Refractive index of water with respect to air is 'x', glass with respect to water is 'y' and air with respect to glass is 'z'. Which one of the following is correct?", "image": null}, "options": [{"id": "8v79d", "label": "A", "text": "$xy = z$", "isCorrect": false, "image": null}, {"id": "4Adzq", "label": "B", "text": "$xyz = 1$", "isCorrect": true, "image": null}, {"id": "9qlx1", "label": "C", "text": "$xz = y$", "isCorrect": false, "image": null}, {"id": "EkKWr", "label": "D", "text": "$yz = x$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the absolute refractive indices of air, water, and glass be $n_a$, $n_w$, and $n_g$ respectively.<br><br>Refractive index of water with respect to air is $x = \\dfrac{n_w}{n_a}$<br><br>Refractive index of glass with respect to water is $y = \\dfrac{n_g}{n_w}$<br><br>Refractive index of air with respect to glass is $z = \\dfrac{n_a}{n_g}$<br><br>Multiplying the three equations, we get:<br><br>$x y z = \\dfrac{n_w}{n_a} \\times \\dfrac{n_g}{n_w} \\times \\dfrac{n_a}{n_g}$<br><br>$x y z = 1$<br><br>Answer: $xyz = 1$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf9bf9280d7f9932e22", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Three immiscible transparent liquids with refractive indices $3 / 2,4 / 3$ and $6 / 5$ are arranged one above the other in a container. The depths of the liquids are $3 \\mathrm{~cm}, 4 \\mathrm{~cm}$ and 6 cm respectively. The apparent depth of the vessel is", "image": null}, "options": [{"id": "cSlf1", "text": "4 cm", "image": null, "isCorrect": false}, {"id": "UTB9i", "text": "6 cm", "image": null, "isCorrect": false}, {"id": "poIFC", "text": "8 cm", "image": null, "isCorrect": false}, {"id": "blyrz", "text": "10 cm", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The apparent depth of a combination of immiscible liquids is given by the sum of the apparent depths of individual layers.<br><br>$d_{app} = \\dfrac{d_1}{\\mu_1} + \\dfrac{d_2}{\\mu_2} + \\dfrac{d_3}{\\mu_3}$<br><br>Substituting the given values:<br><br>$d_{app} = \\dfrac{3}{3/2} + \\dfrac{4}{4/3} + \\dfrac{6}{6/5}$<br><br>$d_{app} = \\left(3 \\times \\dfrac{2}{3}\\right) + \\left(4 \\times \\dfrac{3}{4}\\right) + \\left(6 \\times \\dfrac{5}{6}\\right)$<br><br>$d_{app} = 2 + 3 + 5 = 10 \\text{ cm}$<br><br>Answer: 10 cm", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bc8bf9280d7f9932c5d", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A monochromatic ray of light is incident normally on a thin prism of refracting angle A . The ray is deviated through an angle $(1.15)^{\\circ}$ in passing through the prism. The ray reflected internally from the second face emerges from the first face making an angle of $(6.3)^{\\circ}$ with the incident ray. The refractive index of the prism is", "image": null}, "options": [{"id": "PKNlS", "text": "1.625", "image": null, "isCorrect": false}, {"id": "3s4C8", "text": "1.575", "image": null, "isCorrect": true}, {"id": "JBdTC", "text": "1.525", "image": null, "isCorrect": false}, {"id": "7ia7t", "text": "1.515", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the refracting angle of the thin prism be $A$ and its refractive index be $\\mu$.<br><br>Since the monochromatic ray is incident normally on the first face, the angle of incidence is $i_1 = 0^{\\circ}$, and the angle of refraction is $r_1 = 0^{\\circ}$.<br>The ray strikes the second face at an angle of incidence $r_2 = A$.<br>For the ray passing through the prism, the angle of emergence $e$ is given by Snell's law:<br>$\\sin e = \\mu \\sin A$<br>For a thin prism, angles are small, so $e \\approx \\mu A$.<br>The deviation $\\delta$ of the emergent ray is:<br>$\\delta = e - A = (\\mu - 1)A$<br>Given that $\\delta = 1.15^{\\circ}$, we have:<br>$(\\mu - 1)A = 1.15^{\\circ}$  ... (1)<br><br>Now, consider the ray that is internally reflected from the second face.<br>The angle of incidence at the second face is $A$, so the angle of reflection is also $A$.<br>The reflected ray makes an angle of $2A$ with the normal to the first face (which is the direction of the incident ray).<br>This ray now strikes the first face from inside the prism at an angle of incidence $2A$.<br>Let the new angle of emergence be $e'$. Using Snell's law at the first face:<br>$\\sin e' = \\mu \\sin(2A)$<br>For small angles, $e' \\approx \\mu(2A) = 2\\mu A$.<br>This emergent ray makes an angle $e'$ with the normal to the first face. Since the incident ray is along the normal, the angle between the emergent ray and the incident ray is $e'$.<br>Given that this angle is $6.3^{\\circ}$, we have:<br>$2\\mu A = 6.3^{\\circ}$<br>$\\mu A = 3.15^{\\circ}$  ... (2)<br><br>Substituting $\\mu A = 3.15^{\\circ}$ into equation (1):<br>$\\mu A - A = 1.15^{\\circ}$<br>$3.15^{\\circ} - A = 1.15^{\\circ}$<br>$A = 2.0^{\\circ}$<br><br>Now, substituting the value of $A$ back into equation (2):<br>$\\mu (2.0^{\\circ}) = 3.15^{\\circ}$<br>$\\mu = \\dfrac{3.15}{2.0} = 1.575$<br><br>Answer: 1.575", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bb8bf9280d7f9932bd5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A glass cube of length 21 cm has a small air bubble trapped inside. When viewed normally from one face, its apparent distance is 8 cm. When viewed normally from the opposite face, its apparent distance is 6 cm.\nThe refractive index of the glass and the actual distance of the air bubble from the first surface respectively are:", "image": null}, "options": [{"id": "8jFXT", "text": "$1.5,12 \\mathrm{~cm}$", "image": null, "isCorrect": true}, {"id": "IqkBe", "text": "$1.55,14 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "2u5J0", "text": "$1.6,11 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "CRiD8", "text": "$1.5,9 \\mathrm{~cm}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the actual distance of the air bubble from the first surface be $x$.<br><br>The actual distance from the opposite face is $21 - x$.<br><br>The apparent depth is given by the formula:<br><br>$\\text{Apparent depth} = \\dfrac{\\text{Actual depth}}{\\mu}$<br><br>When viewed from the first face:<br><br>$8 = \\dfrac{x}{\\mu} \\Rightarrow x = 8\\mu$<br><br>When viewed from the opposite face:<br><br>$6 = \\dfrac{21 - x}{\\mu} \\Rightarrow 21 - x = 6\\mu$<br><br>Adding the two equations:<br><br>$x + 21 - x = 8\\mu + 6\\mu$<br><br>$21 = 14\\mu$<br><br>$\\mu = \\dfrac{21}{14} = 1.5$<br><br>Substituting the value of $\\mu$ in the first equation:<br><br>$x = 8 \\times 1.5 = 12 \\text{ cm}$<br><br>The refractive index of the glass is $1.5$ and the actual distance from the first surface is $12 \\text{ cm}$.<br><br>Answer: $1.5,12 \\mathrm{~cm}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b85bf9280d7f99329fd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A ray of light is incident on first face of an equilateral glass prism at an angle of incidence ' $i$ '. The emergent ray just grazes along the adjacent face. The refractive index of the the prism is $\\sqrt{2}$. The value of angle of incidence at first face is $\\left(\\sin 45^{\\circ}=\\frac{1}{\\sqrt{2}}, \\sin 90^{\\circ}=1\\right)$", "image": null}, "options": [{"id": "P5WYy", "text": "$\\sin ^{-1}\\left(\\sqrt{2} \\sin 15^{\\circ}\\right)$", "image": null, "isCorrect": true}, {"id": "5VIgA", "text": "$\\sin ^{-1}\\left(\\frac{\\sin 30^{\\circ}}{\\sqrt{2}}\\right)$", "image": null, "isCorrect": false}, {"id": "eq0EE", "text": "$\\cos ^{-1}\\left(\\sqrt{2} \\sin 20^{\\circ}\\right)$", "image": null, "isCorrect": false}, {"id": "rK65y", "text": "$\\tan ^{-1} \\sqrt{2 \\sin 15^0}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For an equilateral prism, the angle of the prism is $A = 60^{\\circ}$.<br><br>At the second face, the emergent ray just grazes the surface, so the angle of emergence is $e = 90^{\\circ}$.<br><br>Using Snell's law at the second face:<br><br>$\\mu \\sin r_2 = \\sin e$<br><br>$\\sqrt{2} \\sin r_2 = \\sin 90^{\\circ} = 1$<br><br>$\\sin r_2 = \\dfrac{1}{\\sqrt{2}}$<br><br>$r_2 = 45^{\\circ}$<br><br>Using the relation for the angle of the prism:<br><br>$r_1 + r_2 = A$<br><br>$r_1 + 45^{\\circ} = 60^{\\circ}$<br><br>$r_1 = 15^{\\circ}$<br><br>Using Snell's law at the first face:<br><br>$\\sin i = \\mu \\sin r_1$<br><br>$\\sin i = \\sqrt{2} \\sin 15^{\\circ}$<br><br>$i = \\sin^{-1}\\left(\\sqrt{2} \\sin 15^{\\circ}\\right)$<br><br>Answer: $\\sin ^{-1}\\left(\\sqrt{2} \\sin 15^{\\circ}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b52bf9280d7f9932835", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A ray of light travelling through rarer medium is incident at a very small angle 'i' on a glass slab and after refraction its velocity is reduced by $20 \\%$. The angle of deviation is", "image": null}, "options": [{"id": "oocvC", "text": "$\\frac{\\mathrm{i}}{5}$", "image": null, "isCorrect": true}, {"id": "jOo83", "text": "$\\frac{\\mathrm{i}}{8}$", "image": null, "isCorrect": false}, {"id": "caUhN", "text": "$\\frac{\\mathrm{i}}{4}$", "image": null, "isCorrect": false}, {"id": "O37hY", "text": "$\\frac{\\mathrm{i}}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the velocity of light in the rarer medium be $v_1$.<br><br>Since the velocity of light is reduced by $20\\%$ after refraction, the velocity in the glass slab is:<br><br>$v_2 = v_1 - 0.20 v_1 = 0.80 v_1$<br><br>The refractive index of the glass slab with respect to the rarer medium is:<br><br>$\\mu = \\dfrac{v_1}{v_2} = \\dfrac{v_1}{0.80 v_1} = \\dfrac{10}{8} = \\dfrac{5}{4}$<br><br>According to Snell's law, $\\mu = \\dfrac{\\sin i}{\\sin r}$. For very small angles of incidence and refraction, $\\sin i \\approx i$ and $\\sin r \\approx r$.<br><br>$\\mu = \\dfrac{i}{r} \\Rightarrow r = \\dfrac{i}{\\mu}$<br><br>The angle of deviation $\\delta$ is given by:<br><br>$\\delta = i - r$<br><br>Substituting $r = \\dfrac{i}{\\mu}$:<br><br>$\\delta = i - \\dfrac{i}{\\mu} = i \\left(1 - \\dfrac{1}{\\mu}\\right)$<br><br>Substituting $\\mu = \\dfrac{5}{4}$:<br><br>$\\delta = i \\left(1 - \\dfrac{4}{5}\\right) = i \\left(\\dfrac{1}{5}\\right) = \\dfrac{i}{5}$<br><br>Answer: $\\frac{\\mathrm{i}}{5}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214420aee93fa0796df38", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "A plane mirror is placed at the bottom of a tank containing a liquid of refractive index ' $\\mu$ ', ' p ' is a small object at a height ' $h$ ' above the mirror. An observer ' $O$ ' vertically above ' $p$ ' outside the liquid sees ' $p$ ' and the image in a mirror. The apparent distance between these two will be\r\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/hZPjOTd6vQMuCCMWPSHDzxgUVrqVOaZowPwTbWmF01g.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "UPfR7", "text": "$2 \\mu \\mathrm{~h}$", "image": null, "isCorrect": false}, {"id": "yesXs", "text": "$\\frac{2 h}{\\mu}$", "image": null, "isCorrect": true}, {"id": "bjMYk", "text": "$\\frac{2 \\mathrm{~h}}{(\\mu-1)}$", "image": null, "isCorrect": false}, {"id": "JV6HD", "text": "$\\mathrm{h}\\left(1+\\frac{1}{\\mu}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the free surface of the liquid be at a distance $x$ above the object $P$.<br><br>The real depth of the object $P$ from the liquid surface is $x$.<br>The apparent depth of the object $P$ as seen by the observer $O$ outside the liquid is:<br>$d_1 = \\dfrac{x}{\\mu}$<br><br>The plane mirror is placed at the bottom of the tank, which is at a distance $h$ below the object $P$. Thus, the depth of the mirror from the liquid surface is $x + h$.<br>The image of $P$ formed by the plane mirror will be at a distance $h$ behind the mirror.<br>Therefore, the real depth of this image from the liquid surface is:<br>Real depth of image = $(x + h) + h = x + 2h$<br><br>The apparent depth of the image as seen by the observer $O$ is:<br>$d_2 = \\dfrac{x + 2h}{\\mu}$<br><br>The apparent distance between the object $P$ and its image as seen by the observer is the difference between their apparent depths:<br>Apparent distance = $d_2 - d_1$<br>Apparent distance = $\\dfrac{x + 2h}{\\mu} - \\dfrac{x}{\\mu}$<br>Apparent distance = $\\dfrac{2h}{\\mu}$<br><br>Answer: $\\frac{2 h}{\\mu}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792143f0aee93fa0796df23", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "A ray of light travelling through a rarer medium is incident at very small angle ' $i$ ' on a glass slab and after refraction its velocity is reduced by $25 \\%$. The angle of deviation is", "image": null}, "options": [{"id": "LDoYg", "text": "$\\frac{3 \\mathrm{i}}{4}$", "image": null, "isCorrect": false}, {"id": "kYXmX", "text": "$\\frac{\\mathrm{i}}{4}$", "image": null, "isCorrect": true}, {"id": "DWIQg", "text": "$\\frac{\\mathrm{i}}{3}$", "image": null, "isCorrect": false}, {"id": "JJ5Le", "text": "$\\frac{4 \\mathrm{i}}{3}$.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the velocity of light in the rarer medium be $v_1$.<br><br>The velocity of light in the glass slab is reduced by $25\\%$, so $v_2 = v_1 - 0.25 v_1 = \\dfrac{3}{4} v_1$.<br><br>The refractive index of the glass slab with respect to the rarer medium is $\\mu = \\dfrac{v_1}{v_2} = \\dfrac{v_1}{\\dfrac{3}{4} v_1} = \\dfrac{4}{3}$.<br><br>From Snell's law for small angles of incidence and refraction, we have $i = \\mu r$.<br><br>$r = \\dfrac{i}{\\mu} = \\dfrac{i}{\\dfrac{4}{3}} = \\dfrac{3i}{4}$<br><br>The angle of deviation $\\delta$ is given by $\\delta = i - r$.<br><br>$\\delta = i - \\dfrac{3i}{4} = \\dfrac{i}{4}$<br><br>Answer: $\\frac{\\mathrm{i}}{4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214310aee93fa0796deb5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "A glass slab of thickness 4.8 cm is placed on the piece of paper on which an ink dot is marked. By how much distance would an ink dot appear to be raised?\r\n$($ The refractive index of glass $=1.5)$", "image": null}, "
