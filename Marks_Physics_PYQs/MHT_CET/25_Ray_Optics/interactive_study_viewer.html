options": [{"id": "x57Wf", "text": "1.6 cm", "image": null, "isCorrect": true}, {"id": "vguar", "text": "2.4 cm", "image": null, "isCorrect": false}, {"id": "qbPV6", "text": "3.2 cm", "image": null, "isCorrect": false}, {"id": "43baB", "text": "4.8 cm", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The apparent shift (or the distance by which the ink dot appears to be raised) is given by the formula:<br><br>$\\Delta t = t \\left(1 - \\dfrac{1}{\\mu}\\right)$<br><br>where $t$ is the real thickness of the glass slab and $\\mu$ is the refractive index of the glass.<br><br>Given:<br>$t = 4.8$ cm<br>$\\mu = 1.5 = \\dfrac{3}{2}$<br><br>Substituting the values into the formula:<br><br>$\\Delta t = 4.8 \\left(1 - \\dfrac{1}{1.5}\\right)$<br><br>$\\Delta t = 4.8 \\left(1 - \\dfrac{2}{3}\\right)$<br><br>$\\Delta t = 4.8 \\times \\dfrac{1}{3}$<br><br>$\\Delta t = 1.6$ cm<br><br>Answer: 1.6 cm", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792142d0aee93fa0796de92", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "The angle of incidence is found to be twice the angle of refraction when ray of light passes from vacuum into a medium of refractive index ' $\\mu$ '. The angle of incidence will be", "image": null}, "options": [{"id": "m829I", "text": "$\\cos ^{-1}\\left(\\frac{\\mu}{2}\\right)$", "image": null, "isCorrect": false}, {"id": "hwyOh", "text": "$2 \\cos ^{-1}\\left(\\frac{\\mu}{2}\\right)$", "image": null, "isCorrect": true}, {"id": "9nSbB", "text": "$\\sin ^{-1}\\left(\\frac{\\mu}{2}\\right)$", "image": null, "isCorrect": false}, {"id": "ofgpP", "text": "$\\quad 2 \\sin ^{-1}\\left(\\frac{\\mu}{2}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the angle of incidence be $i$ and the angle of refraction be $r$.<br><br>Given $i = 2r$.<br><br>According to Snell's law:<br><br>$\\dfrac{\\sin i}{\\sin r} = \\mu$<br><br>Substituting $i = 2r$:<br><br>$\\dfrac{\\sin(2r)}{\\sin r} = \\mu$<br><br>$\\dfrac{2 \\sin r \\cos r}{\\sin r} = \\mu$<br><br>$2 \\cos r = \\mu$<br><br>$\\cos r = \\dfrac{\\mu}{2}$<br><br>$r = \\cos^{-1}\\left(\\dfrac{\\mu}{2}\\right)$<br><br>The angle of incidence is $i = 2r$:<br><br>$i = 2 \\cos^{-1}\\left(\\dfrac{\\mu}{2}\\right)$<br><br>Answer: $2 \\cos ^{-1}\\left(\\frac{\\mu}{2}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792142c0aee93fa0796de8d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "Optical path of a particular ray of light has travelled a distance of 3 cm in flint glass is same as that on travelling a distance ' $x$ ' cm through another medium. The value of ' $x$ ' is [refractive index of flint glass $=1.6$, refractive index of another medium $=1.25$ ]", "image": null}, "options": [{"id": "2WZxE", "text": "3.84 cm", "image": null, "isCorrect": true}, {"id": "LYDQu", "text": "2.84 cm", "image": null, "isCorrect": false}, {"id": "aLsIl", "text": "1.84 cm", "image": null, "isCorrect": false}, {"id": "erZtA", "text": "4.84 cm", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Optical path is defined as the product of the refractive index of the medium and the distance travelled in it.<br><br>Optical path in flint glass $= \\mu_1 d_1$<br><br>Optical path in the other medium $= \\mu_2 d_2$<br><br>Given that the optical paths are equal:<br><br>$\\mu_1 d_1 = \\mu_2 d_2$<br><br>Substituting the given values:<br><br>$1.6 \\times 3 = 1.25 \\times x$<br><br>$4.8 = 1.25 x$<br><br>$x = \\dfrac{4.8}{1.25} = 3.84$ cm<br><br>Answer: 3.84 cm", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213f60aee93fa0796dce2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "A vessel is filled with two different liquids which do not mix. One is 40 cm deep and has refractive index 1.6 and other is 30 cm deep and has refractive index 1.5. The apparent depth of vessel when viewed normally is", "image": null}, "options": [{"id": "HrLkV", "text": "37.5 cm", "image": null, "isCorrect": false}, {"id": "TZfxT", "text": "50 cm", "image": null, "isCorrect": false}, {"id": "cvaz6", "text": "45 cm", "image": null, "isCorrect": true}, {"id": "Rxzng", "text": "40 cm", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The apparent depth of a vessel containing multiple immiscible liquids is the sum of the apparent depths of the individual liquid layers.<br><br>The formula for total apparent depth is:<br><br>$d_{app} = \\dfrac{d_1}{\\mu_1} + \\dfrac{d_2}{\\mu_2}$<br><br>Substituting the given values:<br><br>$d_{app} = \\dfrac{40}{1.6} + \\dfrac{30}{1.5}$<br><br>$d_{app} = 25 + 20 = 45 \\text{ cm}$<br><br>Answer: 45 cm", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e50aee93fa0796dc5e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "When the same monochromatic ray of light travels through glass slab and through water, the number of waves in glass slab of thickness 5 cm is same as in water column of height 6 cm . If refractive index of glass is 1.56 , then refractive index of water is", "image": null}, "options": [{"id": "NxFHD", "text": "1.28", "image": null, "isCorrect": false}, {"id": "5SsXg", "text": "1.29", "image": null, "isCorrect": false}, {"id": "0GWMf", "text": "1.30", "image": null, "isCorrect": true}, {"id": "3tGfe", "text": "1.32", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The number of waves in a medium of thickness $t$ is given by $N = \\dfrac{t}{\\lambda_m}$, where $\\lambda_m$ is the wavelength of light in that medium.<br><br>Since $\\lambda_m = \\dfrac{\\lambda}{\\mu}$, where $\\lambda$ is the wavelength in vacuum and $\\mu$ is the refractive index, we can write $N = \\dfrac{t \\mu}{\\lambda}$.<br><br>Given that the number of waves in the glass slab is equal to the number of waves in the water column, we have:<br><br>$N_g = N_w$<br><br>$\\dfrac{t_g \\mu_g}{\\lambda} = \\dfrac{t_w \\mu_w}{\\lambda}$<br><br>$t_g \\mu_g = t_w \\mu_w$<br><br>Substituting the given values ($t_g = 5$ cm, $\\mu_g = 1.56$, $t_w = 6$ cm):<br><br>$5 \\times 1.56 = 6 \\times \\mu_w$<br><br>$7.8 = 6 \\mu_w$<br><br>$\\mu_w = \\dfrac{7.8}{6} = 1.30$<br><br>Answer: 1.30", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e00aee93fa0796dc3b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "An ink mark is made on a piece of paper. A glass slab of thickness 't' is placed on it. The ink mark appears to be raised up through a distance ' $x$ ' when viewed at nearly normal incidence. If the refractive index of material of glass slab is ' $\\mu$ ' then thickness of glass slab ' $t$ ' is given by", "image": null}, "options": [{"id": "gLP48", "text": "$\\frac{(\\mu-1)}{\\mu \\mathrm{x}}$.", "image": null, "isCorrect": false}, {"id": "GqSVg", "text": "$\\frac{\\mu x}{(\\mu-1)}$", "image": null, "isCorrect": true}, {"id": "GsoNu", "text": "$\\frac{(\\mu-1) x}{\\mu}$", "image": null, "isCorrect": false}, {"id": "XV4lU", "text": "$\\frac{\\mu}{(\\mu-1) x}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The apparent shift $x$ produced by a glass slab of thickness $t$ and refractive index $\\mu$ when viewed at nearly normal incidence is given by the formula:<br><br>$x = t \\left(1 - \\dfrac{1}{\\mu}\\right)$<br><br>$x = t \\left(\\dfrac{\\mu - 1}{\\mu}\\right)$<br><br>Rearranging the formula to solve for the thickness $t$ of the glass slab, we get:<br><br>$t = \\dfrac{\\mu x}{\\mu - 1}$<br><br>Answer: $\\frac{\\mu x}{(\\mu-1)}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213960aee93fa0796d9f0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "Velocity of light in diamond is $\\left(\\dfrac{5}{12}\\right)^{\\text {th }}$ times that in air. Velocity of light in water is $\\left(\\dfrac{3}{4}\\right)^{\\text {th }}$ times that in air. The angle of incidence of ray of light travelling from water to diamond is (angle of refraction $\\left.(r)=30^{\\circ}\\right)\\left\\lceil\\right.$ Given $\\left.\\rightarrow \\sin 30^{\\circ}=\\dfrac{1}{2}\\right\\rceil$", "image": null}, "options": [{"id": "LGfpF", "text": "$\\sin ^{-1}(9 / 10)$", "image": null, "isCorrect": true}, {"id": "O5xkZ", "text": "$\\sin ^{-1}(3 / 4)$", "image": null, "isCorrect": false}, {"id": "tCrXG", "text": "$\\sin ^{-1}(5 / 12)$", "image": null, "isCorrect": false}, {"id": "GNP9V", "text": "$\\sin ^{-1}(9 / 5)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Velocity of light in diamond, $v_d = \\dfrac{5}{12} c$<br><br>Refractive index of diamond, $\\mu_d = \\dfrac{c}{v_d} = \\dfrac{12}{5}$<br><br>Velocity of light in water, $v_w = \\dfrac{3}{4} c$<br><br>Refractive index of water, $\\mu_w = \\dfrac{c}{v_w} = \\dfrac{4}{3}$<br><br>Applying Snell's law for light travelling from water to diamond:<br><br>$\\mu_w \\sin i = \\mu_d \\sin r$<br><br>$\\dfrac{4}{3} \\sin i = \\dfrac{12}{5} \\sin 30^{\\circ}$<br><br>$\\dfrac{4}{3} \\sin i = \\dfrac{12}{5} \\times \\dfrac{1}{2}$<br><br>$\\dfrac{4}{3} \\sin i = \\dfrac{6}{5}$<br><br>$\\sin i = \\dfrac{6}{5} \\times \\dfrac{3}{4} = \\dfrac{9}{10}$<br><br>$i = \\sin^{-1}\\left(\\dfrac{9}{10}\\right)$<br><br>Answer: $\\sin ^{-1}(9 / 10)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213940aee93fa0796d9e6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "Three immiscible transparent liquids with uniform refractive indices $\\dfrac{3}{2}, \\dfrac{4}{3}$ and $\\dfrac{6}{5}$ are arranged one on top of another. The depths of the liquids are 3 cm 4 cm and 6 cm respectively. The apparent depth of the vessel is", "image": null}, "options": [{"id": "dVOTn", "text": "10 cm", "image": null, "isCorrect": true}, {"id": "PqYpQ", "text": "9 cm", "image": null, "isCorrect": false}, {"id": "AxNHz", "text": "8 cm", "image": null, "isCorrect": false}, {"id": "iM3LI", "text": "7 cm", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The apparent depth of a vessel containing multiple immiscible liquids is given by the sum of the apparent depths of the individual liquid layers.<br><br>Apparent depth $D_{app} = \\dfrac{d_1}{\\mu_1} + \\dfrac{d_2}{\\mu_2} + \\dfrac{d_3}{\\mu_3}$<br><br>Substituting the given values:<br><br>$D_{app} = \\dfrac{3}{\\dfrac{3}{2}} + \\dfrac{4}{\\dfrac{4}{3}} + \\dfrac{6}{\\dfrac{6}{5}}$<br><br>$D_{app} = \\left(3 \\times \\dfrac{2}{3}\\right) + \\left(4 \\times \\dfrac{3}{4}\\right) + \\left(6 \\times \\dfrac{5}{6}\\right)$<br><br>$D_{app} = 2 + 3 + 5 = 10$ cm<br><br>Answer: 10 cm", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213830aee93fa0796d95d", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "Some water is filled in a container of height $30 \\text{ cm}$. If the apparent depth of the water is half the actual height of the container when viewed from the top, the height upto which water should be filled in it, is $\\left[\\text{Refractive index of water} = \\dfrac{4}{3}\\right]$", "image": null}, "options": [{"id": "VI3xr", "text": "15 cm", "image": null, "isCorrect": false}, {"id": "x5bn0", "text": "18 cm", "image": null, "isCorrect": false}, {"id": "QLFu8", "text": "20 cm", "image": null, "isCorrect": true}, {"id": "WJLdL", "text": "24 cm", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the height of the water filled in the container be $h$.<br><br>The refractive index of water is $\\mu = \\dfrac{4}{3}$.<br><br>The apparent depth of the water is given by $h_{app} = \\dfrac{h}{\\mu}$.<br><br>According to the given condition, the apparent depth is half the actual height of the container.<br><br>Actual height of the container $= 30 \\text{ cm}$.<br><br>Therefore, $h_{app} = \\dfrac{30}{2} = 15 \\text{ cm}$.<br><br>Equating the two expressions for apparent depth:<br><br>$\\dfrac{h}{4/3} = 15$<br><br>$h = 15 \\times \\dfrac{4}{3} = 20 \\text{ cm}$<br><br>Answer: 20 cm", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792136f0aee93fa0796d8c4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "A ray of light is incident normally on a glass slab to thickness 5 cm and refractive index 1.6. The time taken to travel by a ray from source of light to surface of slab is same as to travel through glass slab. The distance of source from the surface is", "image": null}, "options": [{"id": "YTTzX", "text": "5 cm", "image": null, "isCorrect": false}, {"id": "TwH8e", "text": "8 cm", "image": null, "isCorrect": true}, {"id": "CX0CK", "text": "12 cm", "image": null, "isCorrect": false}, {"id": "ATwYy", "text": "24 cm", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the distance of the source from the surface be $x$.<br><br>The speed of light in air is $c$ and in the glass slab is $v = \\dfrac{c}{\\mu}$.<br><br>Time taken by light to travel from the source to the surface is $t_1 = \\dfrac{x}{c}$.<br><br>Time taken by light to travel through the glass slab is $t_2 = \\dfrac{d}{v} = \\dfrac{\\mu d}{c}$.<br><br>Given that $t_1 = t_2$, we have:<br><br>$\\dfrac{x}{c} = \\dfrac{\\mu d}{c}$<br><br>$x = \\mu d$<br><br>Substituting the given values, $\\mu = 1.6$ and $d = 5$ cm:<br><br>$x = 1.6 \\times 5 = 8$ cm.<br><br>Answer: 8 cm", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2627a0279619d9d8a34dc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "When a monochromatic ray of light is passed through an equilateral glass prism, it is found that the refracted ray in glass is parallel to the base of the prism. If ' $i$ ' and ' $e$ ' denote the angles of incidence and emergence respectively, then", "image": null}, "options": [{"id": "O4rz7", "text": "$i>e$", "image": null, "isCorrect": false}, {"id": "dTze1", "text": "$i < e$", "image": null, "isCorrect": false}, {"id": "M6aoP", "text": "$i=e$", "image": null, "isCorrect": true}, {"id": "AaMlq", "text": "$i+e=90^{\\circ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Std.11|Ch-9|Subtopic-9.8", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262420279619d9d8a3312", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "A spherical surface of radius of curvature ' $R$ ' separates air from glass of refractive index 1.5. The centre of curvature is in the glass. A point object $P$ placed in air forms a real image $Q$ in the glass. The line $P Q$ cuts the surface at point ' $O$ ' and $\\mathrm{PO}=\\mathrm{OQ}=\\mathrm{x}$. Hence the distance ' $\\mathrm{x}$ ' is equal to", "image": null}, "options": [{"id": "FLu5l", "text": "$1.5 \\mathrm{R}$", "image": null, "isCorrect": false}, {"id": "QtcWE", "text": "$2 \\mathrm{R}$", "image": null, "isCorrect": false}, {"id": "7p0XA", "text": "$3 \\mathrm{R}$", "image": null, "isCorrect": false}, {"id": "28ciM", "text": "$5 \\mathrm{R}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given: $\\mathrm{u}=-\\mathrm{x}, \\mathrm{v}=+\\mathrm{x}$\nWe know,\n$$\n\\begin{aligned}\n& \\frac{\\mathrm{n}_2}{\\mathrm{v}}-\\frac{\\mathrm{n}_1}{\\mathrm{u}}=\\frac{\\mathrm{n}_2-\\mathrm{n}_1}{\\mathrm{R}} \\\\\n& \\Rightarrow \\frac{1.5}{\\mathrm{x}}+\\frac{1}{\\mathrm{x}}=\\frac{0.5}{\\mathrm{R}} \\\\\n& \\frac{2.5}{\\mathrm{x}}=\\frac{0.5}{\\mathrm{R}} \\\\\n\\therefore \\quad & \\mathrm{x}=5 \\mathrm{R}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262300279619d9d8a3281", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "An ink mark is made on a piece of paper on which a glass slab of thickness ' $t$ ' is placed. The ink mark appears to be raised up through a distance ' $x$ ' when viewed at nearly normal incidence. If the refractive index of the material of glass slab is ' $\\mu$ ' then the thickness of glass slab is given by", "image": null}, "options": [{"id": "T4qhs", "text": "$\\frac{\\mu \\mathrm{x}}{\\mu-1}$", "image": null, "isCorrect": true}, {"id": "CnnSe", "text": "$\\frac{(\\mu-1)}{\\mu}$", "image": null, "isCorrect": false}, {"id": "aUOP9", "text": "$\\frac{\\mu-1}{\\mu \\mathrm{x}}$", "image": null, "isCorrect": false}, {"id": "iRJsx", "text": "$\\frac{\\mu}{(\\mu-1) x}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here, the normal shift is $\\mathrm{x}$ The formula for the normal shift is\n$$\n\\begin{aligned}\nx & =t\\left(1-\\frac{1}{\\mu}\\right) \\\\\nt & =\\frac{x}{\\left(1-\\frac{1}{\\mu}\\right)} \\\\\nx & =t\\left(1-\\frac{1}{\\mu}\\right) \\\\\nt & =\\frac{x}{\\left(1-\\frac{1}{\\mu}\\right)} \\\\\n\\therefore \\quad t & =\\frac{x \\mu}{(\\mu-1)}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261d10279619d9d8a2f92", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "A double convex air bubble in water behaves as", "image": null}, "options": [{"id": "9aSHQ", "text": "convergent lens", "image": null, "isCorrect": false}, {"id": "DRlH2", "text": "divergent lens", "image": null, "isCorrect": true}, {"id": "7pQkX", "text": "plane slab", "image": null, "isCorrect": false}, {"id": "xFgBE", "text": "concave mirror", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mu_{\\text {water }}=1.33 \\text { and } \\mu_{\\text {air }}=1$\nAs air is optically rarer, $\\mu_{\\text {air }} < \\mu_{\\text {glass, }}$, converging nature of the convex lens changes to diverging.\nThus it behaves as divergent lens.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261bf0279619d9d8a2f04", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "A transparent glass cube of length $24 \\mathrm{~cm}$ has a small air bubble trapped inside. When seen normally through one surface from air outside, its apparent distance is $10 \\mathrm{~cm}$ from the surface. When seen normally from opposite surface, its apparent distance is $6 \\mathrm{~cm}$. The distance of the air bubble from first surface is", "image": null}, "options": [{"id": "Fh3sd", "text": "$15 \\mathrm{~cm}$", "image": null, "isCorrect": true}, {"id": "zsgXM", "text": "$14 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "denWh", "text": "$12 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "daQG5", "text": "$8 \\mathrm{~cm}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given: Length of cube $=12 \\mathrm{~cm}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/joXJAzg-af-rfpkFI9SauIHt6oIHefWlUdrrTq_Wn3g.original.fullsize.png\"><br>\n$\\begin{array}{ll} & \\mu=\\frac{\\text { Real depth }}{\\text { Apparent depth }}=\\frac{l_1}{\\mathrm{~h}_1}=\\frac{24-l_1}{\\mathrm{~h}_2} \\\\ & \\text { putting } \\mathrm{h}_1=10 \\mathrm{~cm} \\text { and } \\mathrm{h}_2=6 \\mathrm{~cm} \\text { into (i), we get } \\\\ & \\frac{l_1}{10}=\\frac{24-l_1}{6} \\\\ & 6 l_1=240-10 l_1 \\\\ & 16 l_1=240 \\\\ \\therefore \\quad & l_1=15 \\mathrm{~cm}\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2619a0279619d9d8a2ddd", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "A beam of white light is partially reflected and partially refracted from a surface. The angle between the reflected and refracted light is $90^{\\circ}$. The angle of refraction is $30^{\\circ}$. The angle of incidence must be", "image": null}, "options": [{"id": "H2E2a", "text": "$70^{\\circ}$", "image": null, "isCorrect": false}, {"id": "d6K0H", "text": "$60^{\\circ}$", "image": null, "isCorrect": true}, {"id": "quWh8", "text": "$55^{\\circ}$", "image": null, "isCorrect": false}, {"id": "6ppCa", "text": "$58^{\\circ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Consider the following figure:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/qoxTL6cZl1imywyxk6gL04Uv5D2Kz1vKZR-HrUCM6_0.original.fullsize.png\"><br>\nTake angle of incidence $i$, angle of reflection $r$ and angle of refraction\n$r_{\\mathrm{F}}=30^{\\circ}$\nGiven from geometry:\n$\\begin{aligned}\n& r+r_{\\mathrm{F}}+90^{\\circ}=180^{\\circ} \\\\\n& \\Rightarrow r=90^{\\circ}-r_{\\mathrm{F}}\n\\end{aligned}$\nSince, angle of incidence is equal to the angle of reflection:\n$\\therefore i=r=90^{\\circ}-r_F=90^{\\circ}-30^{\\circ}=60^{\\circ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261990279619d9d8a2dd9", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "The ratio of the total energy of the $2^{\\text {nd }}$ orbit electron for the hydrogen atom $\\left({ }_1 H^1\\right)$ to that of helium ion $\\left(H_e^{+}\\right)\\left[\\left({ }_2^4 \\mathrm{He}\\right)\\right]$ is", "image": null}, "options": [{"id": "4Q23I", "text": "4", "image": null, "isCorrect": false}, {"id": "xWgPE", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "60jO8", "text": "2", "image": null, "isCorrect": false}, {"id": "JfCrk", "text": "$\\frac{1}{4}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Total energy of an electron in a Hydrogen like atom is given by,\n$E=-13.6 \\frac{Z^2}{n^2}$\n$\\frac{E_H}{E_{H e}}=\\left(\\frac{1}{2}\\right)^2\\left(\\frac{2}{2}\\right)^2=\\frac{1}{4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261980279619d9d8a2dd5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "A bubble in a glass slab (refractive index1.5) when viewed from one side appears at $5 \\mathrm{~cm}$ and at $2 \\mathrm{~cm}$ from other side then thickness of the slab is", "image": null}, "options": [{"id": "tsFwq", "text": "2.5 cm", "image": null, "isCorrect": false}, {"id": "SnQBs", "text": "3 cm", "image": null, "isCorrect": false}, {"id": "ON3Tl", "text": "10.5 cm", "image": null, "isCorrect": true}, {"id": "6Xqlm", "text": "3.75 cm", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the thickness of the glass slab is $t$ and distance of the bubble from one side is $x$.\n$\\begin{aligned}\n& \\therefore \\frac{x}{\\mu}=5 \\mathrm{~cm} \\quad---(1) \\\\\n& \\therefore \\frac{t-x}{\\mu}=2 \\mathrm{~cm} \\quad--(2)\n\\end{aligned}$\nBy solving equation (1) and (2), we get,\n$t=7 \\mu \\mathrm{cm}=10.5 \\mathrm{~cm}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261710279619d9d8a2c97", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "A monochromatic ray of light travels through glass slab and water column. The number of waves in glass slab of thickness $4 \\mathrm{~cm}$ is same as in water column of height $5 \\mathrm{~cm}$. If refractive index of glass is $\\frac{5}{3}$ then refractive index of water is", "image": null}, "options": [{"id": "vO01S", "text": "$\\frac{4}{3}$", "image": null, "isCorrect": true}, {"id": "d0ZHg", "text": "$\\frac{5}{4}$", "image": null, "isCorrect": false}, {"id": "UdRIP", "text": "$\\frac{6}{5}$", "image": null, "isCorrect": false}, {"id": "XITjm", "text": "$\\frac{3}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given thickness of glass slab $=4 \\mathrm{~cm}$ and height of water column $=5 \\mathrm{~cm}$\nand refractive index of glass $\\mu_g=\\frac{5}{3}$\nAs number of waves is equal in both the glass and water medium, then according to their height and thickness, we can write\n$\\begin{aligned} & \\frac{\\mu_w}{\\mu_g}=\\frac{v_g}{v_w}=\\frac{\\frac{\\text { thickness of glass }}{\\text { time }}}{\\frac{\\text { height of water column }}{\\text { time }}} \\\\ & \\Rightarrow \\frac{\\mu_w}{\\mu_g}=\\frac{4}{5} \\\\ & \\Rightarrow \\mu_w=\\frac{4}{5} \\times\\left(\\frac{5}{3}\\right)=\\frac{4}{3}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2616f0279619d9d8a2c8c", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "Rays from a point source of light situated at height $h$ below the liquid surface having refractive index $\\mu$, forms a circular patch of light of radius $r$ on the surface. The area of the patch is", "image": null}, "options": [{"id": "6Sc00", "text": "$\\frac{\\pi}{h\\left(\\mu^2-1\\right)}$", "image": null, "isCorrect": false}, {"id": "ulOHh", "text": "$\\frac{\\pi h}{\\left(\\mu^2-1\\right)}$", "image": null, "isCorrect": false}, {"id": "4d6xR", "text": "$\\frac{\\pi h^2}{\\left(\\mu^2-1\\right)}$", "image": null, "isCorrect": true}, {"id": "IlkkP", "text": "$\\frac{\\pi h^2}{\\sqrt{\\left(\\mu^2-1\\right)}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Consider the figure as shown below:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/5tISKqrPCZx-EwbiPuD1Yaa2H5KQ2UhQA8US_ufwhQM.original.fullsize.png\">\nArea of the light patch $=\\pi r^2$\nWe know the patch forms due to total internal reflection. Light rays from source $S$ are incident at the edge of the circular path at critical angle $\\theta_{\\mathrm{C}}$ (as shown at points $\\mathrm{P}$ and $\\mathrm{Q}$ ), the refracted ray exits at angle $\\frac{\\pi}{2}$ w.r.t. the normal.\nUsing Snell's Law\n$$\n\\begin{aligned}\n& \\therefore \\mu\\left(\\sin \\theta_C\\right)=1\\left(\\sin \\left(\\frac{\\pi}{2}\\right)\\right) \\\\\n& \\Rightarrow \\sin \\theta_C=\\frac{1}{\\mu}=\\frac{r}{\\sqrt{h^2+r^2}} \\\\\n& \\Rightarrow r^2=\\frac{\\left(h^2+r^2\\right)}{\\mu^2} \\\\\n& \\Rightarrow r^2=\\frac{h^2}{\\left(\\mu^2-1\\right)}\n\\end{aligned}\n$$\n$\\therefore$ Area of the patch $=\\left(\\frac{\\pi h^2}{\\mu^2-1}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2615d0279619d9d8a2bf8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "A ray of light is incident normally on a glass slab of thickness $5 \\mathrm{~cm}$ and refractive index 1.6. The time taken to travel by a ray from source to surface of slab is same as to travel through glass slab. The distance of source from the surface is", "image": null}, "options": [{"id": "ZAE6s", "text": "12 cm", "image": null, "isCorrect": false}, {"id": "Qv4f4", "text": "24 cm", "image": null, "isCorrect": false}, {"id": "RXc45", "text": "5 cm", "image": null, "isCorrect": false}, {"id": "4X43y", "text": "8 cm", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Speed of light in a maternal of index $\\mu$ is $\\left(\\frac{C}{\\mu}\\right)$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/8M63EWS_itXoYxEoT4VI3wS8gRtT-yv-xL4XtsG2mIU.original.fullsize.png\"><br>\nGiven: $\\mathrm{t}_{\\mathrm{SA}}=\\mathrm{t}_{\\mathrm{SB}}$\n$\\begin{aligned}\n& \\mathrm{t}_{\\mathrm{SA}}=\\frac{\\mathrm{d}}{\\mathrm{c}}=\\frac{1}{\\left(\\frac{\\mathrm{C}}{\\mu}\\right)} \\\\\n& \\Rightarrow \\mathrm{d}=\\mu \\mathrm{l}=1.6 \\times 5 \\mathrm{~cm}=8 \\mathrm{~cm}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2614c0279619d9d8a2b68", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "The thickness of a plate having refractive index $\\mu$ which will produce a change in optical path equal to half the wavelength $\\lambda$ of the light passing through it is", "image": null}, "options": [{"id": "O44BX", "text": "$\\frac{\\lambda}{4(\\mu-1)}$", "image": null, "isCorrect": false}, {"id": "HKVjb", "text": "$\\frac{\\lambda}{(\\mu-1)}$", "image": null, "isCorrect": false}, {"id": "o40Kb", "text": "$\\frac{3 \\lambda}{4(\\mu-1)}$", "image": null, "isCorrect": false}, {"id": "JerpC", "text": "$\\frac{\\lambda}{2(\\mu-1)}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let, $t=$ thickness of plate\nGiven, optical path difference $=(\\mu-1) t=\\lambda / 2$\n$\\Rightarrow t=\\frac{\\lambda}{2(\\mu-1)}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2613b0279619d9d8a2ae0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "If ${ }_{\\mathrm{i}} \\mu_{\\mathrm{j}}$ represents refractive index when ray goes from medium $\\mathrm{i}$ to medium $\\mathrm{j}$, then the product ${ }_2 \\mu_1 \\mathrm{x}_3 \\mu_2 \\mathrm{x}_4 \\mu_3$ is equal to", "image": null}, "options": [{"id": "CP1KN", "text": "$\\frac{1}{{ }_3 \\mu_2}$", "image": null, "isCorrect": false}, {"id": "xWpjl", "text": "${ }_3 \\mu_2$", "image": null, "isCorrect": false}, {"id": "IX1nl", "text": "$\\frac{1}{{ }_4 \\mu_1}$", "image": null, "isCorrect": true}, {"id": "NaqZv", "text": "${ }_4 \\mu_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "So, ${ }_2 \\mu_1 \\times{ }_3 \\mu_2 \\times{ }_4 \\mu_3=\\frac{\\mu_1}{\\mu_2} \\times \\frac{\\mu_2}{\\mu_3} \\times \\frac{\\mu_3}{\\mu_4}=\\frac{\\mu_1}{\\mu_4}={ }_4 \\mu_1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261270279619d9d8a2a3a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "The critical angle is $\\theta$ for a light going from medium $P$ to medium Q. If speed of light in medium $\\mathrm{P}$ is $\\mathrm{V}_{\\mathrm{P}}$ then speed of light in medium $\\mathrm{Q}$ is", "image": null}, "options": [{"id": "9TZkg", "text": "$\\frac{\\mathrm{V}_{\\mathrm{p}}}{\\sin \\theta}$", "image": null, "isCorrect": true}, {"id": "IzcuC", "text": "$\\mathrm{V}_{\\mathrm{p}} \\tan \\theta$", "image": null, "isCorrect": false}, {"id": "DgS5a", "text": "$\\frac{\\sin \\theta}{V_p}$", "image": null, "isCorrect": false}, {"id": "R4FGh", "text": "$\\mathrm{V}_{\\mathrm{P}} \\sin \\theta$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For total internal reflection for critical incidence angle $\\theta$ the angle of refraction is $\\frac{\\pi}{2}$.\nUsing Snell's law:\n$\\mathrm{n}_{\\mathrm{A}} \\sin \\theta=\\mathrm{n}_{\\mathrm{B}} \\sin \\left(\\frac{\\pi}{2}\\right)$, where, $\\mathrm{n}_{\\mathrm{A}}=$ refractive index of medium $\\mathrm{A}$ and $n_B=$ refractive index of medium $B$\nand $\\mathrm{n}_{\\mathrm{B}}=$ refractive index of medium $\\mathrm{B}$\n$\\frac{n_A}{n_B}=\\frac{1}{\\sin \\theta}$\nWe define refractive index in terms of velocity of light as follows:\n$\\begin{aligned} & \\frac{\\mathrm{n}_{\\mathrm{A}}}{\\mathrm{n}_{\\mathrm{B}}}=\\frac{\\left.\\mathrm{V}_{\\mathrm{B}} \\text { (velocity in medium } \\mathrm{B}\\right)}{\\left.\\mathrm{V}_{\\mathrm{A}} \\text { (velocity in medium } \\mathrm{A}\\right)} \\\\ & \\therefore \\frac{\\mathrm{V}_{\\mathrm{A}}}{\\mathrm{V}_{\\mathrm{B}}}=\\frac{1}{\\sin \\theta} \\\\ & \\mathrm{V}_{\\mathrm{B}}=\\frac{\\mathrm{V}_{\\mathrm{A}}}{\\sin \\theta}=\\frac{\\mathrm{V}}{\\sin \\theta}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260de0279619d9d8a27f6", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}], "question": {"text": "To a bird in air, a fish in water appears to be at $30 \\mathrm{~cm}$ from the surface. If refractive index of water with respect to air is $\\frac{4}{3}$, the real distance of bird from the surface is", "image": null}, "options": [{"id": "XeCBS", "text": "$60 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "jmspP", "text": "$30 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "t2F9a", "text": "$40 \\mathrm{~cm}$", "image": null, "isCorrect": true}, {"id": "nt2ck", "text": "$50 \\mathrm{~cm}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The correct option is (C).\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/7sjur0pem9diaSVHG53NuMaleBa2Rh0FL9e4zW2Rm_0.original.fullsize.png\">\nConsider the labeled figure. The fish appears at an apparent depth h๘ while the real depth is $h$.\nIn triangle $\\mathrm{OPF}: \\tan (\\mathrm{i})=\\frac{\\mathrm{P}}{\\mathrm{h}} \\simeq \\sin (\\mathrm{i})$\nIn triangle OPA: $\\tan (\\mathrm{r})=\\frac{\\mathrm{P}}{\\mathrm{h}^{\\prime}} \\simeq \\sin (\\mathrm{r})$\nFor small angles $\\theta, \\operatorname{tam} \\theta \\simeq \\sin \\theta$ can be taken.\nUsing smell's law of refraction: $1 \\times \\sin (\\mathrm{r})=\\mu \\times \\sin (\\mathrm{i})$\nInserting expressions for $\\sin (\\mathrm{i})$ and $\\sin (\\mathrm{r}) 1 \\times \\frac{\\mathrm{P}}{\\mathrm{h}^{\\prime}}=\\mu \\times \\frac{\\mathrm{P}}{\\mathrm{h}}$\n$\\mathrm{h}=\\mu \\mathrm{h}^{\\prime}$\nGiven, $\\mathrm{h}^{\\prime}=30 \\mathrm{~cm}$ and $\\mu=\\frac{4}{3}$, therefore real depth $\\mathrm{h}=40 \\mathrm{~cm}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260cb0279619d9d8a275a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "A monochromatic ray of light travels through glass slab and water column. The number of waves in glass slab of thickness 4 $\\mathrm{cm}$ is the same as in water column of height $5 \\mathrm{~cm}$. If refractive index of glass is $\\frac{5}{3}$, then refractive index of water is", "image": null}, "options": [{"id": "5OdX7", "text": "1.33", "image": null, "isCorrect": true}, {"id": "1wm9e", "text": "1.30", "image": null, "isCorrect": false}, {"id": "mleBZ", "text": "1.25", "image": null, "isCorrect": false}, {"id": "WDuey", "text": "1.10", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If the number of waves in $\\mathrm{N}$, then the wavelength in water is $\\frac{5}{\\mathrm{~N}} \\mathrm{~cm}$ and wavelength in glass is $\\frac{4}{\\mathrm{~N}} \\mathrm{~cm}$.\n$\\begin{aligned}\n& \\lambda_{\\mathrm{w}}=\\frac{5}{\\mathrm{~N}}, \\quad \\lambda_{\\mathrm{g}}=\\frac{4}{\\mathrm{n}} \\\\\n& { }_{\\mathrm{w}} \\mu_{\\mathrm{g}}=\\frac{\\lambda_{\\mathrm{w}}}{\\lambda_{\\mathrm{g}}}=\\frac{5}{4} \\\\\n& \\frac{\\mu_{\\mathrm{g}}}{\\mu_{\\mathrm{w}}}=\\frac{5}{4} \\\\\n& \\mu_{\\mathrm{w}}=\\frac{4}{5} \\mu_{\\mathrm{g}}=\\frac{4}{5} \\times \\frac{5}{3}=\\frac{4}{3}=1.33\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260ca0279619d9d8a2754", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "White light consists of wavelengths range from $480 \\mathrm{~nm}$ to $672 \\mathrm{~nm}$. What will be the wavelength range when white light is passed through glass of refractive index 1.6?", "image": null}, "options": [{"id": "ZVccm", "text": "$420 \\mathrm{~nm}-672 \\mathrm{~nm}$", "image": null, "isCorrect": false}, {"id": "wjz9g", "text": "$300 \\mathrm{~nm}-480 \\mathrm{~nm}$", "image": null, "isCorrect": false}, {"id": "GInys", "text": "$300 \\mathrm{~nm}-420 \\mathrm{~nm}$", "image": null, "isCorrect": true}, {"id": "16DYF", "text": "$300 \\mathrm{~nm}-672 \\mathrm{~nm}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If wavelengths in air are $480 \\mathrm{~nm}$ and $672 \\mathrm{~nm}$, then wavelengths in a medium of refractive index 1.6 will be $\\frac{480}{1.6}=300 \\mathrm{~nm}$ and $\\frac{672}{1.6}=420 \\mathrm{~nm}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260ad0279619d9d8a2670", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "A ray of light travels from air to water to glass and again from glass to air. Refractive index of water w.r.t. air is ' $\\mathrm{X}$ ', glass w.r.t. water is ' $Y$ and air w.r.t. glass is ' $\\mathrm{Z}$ '. Which one of the following is correct?", "image": null}, "options": [{"id": "57SDm", "text": "$Y Z=X$", "image": null, "isCorrect": false}, {"id": "WiBWt", "text": "$X Y Z=1$", "image": null, "isCorrect": true}, {"id": "tpwES", "text": "$X Y=Z$", "image": null, "isCorrect": false}, {"id": "TRgKL", "text": "$X Z=Y$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & X=\\frac{v_a}{v_w}, Y=\\frac{v_w}{v_g}, Z=\\frac{v_g}{v_a} \\\\ & \\therefore X Y Z=1\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2607d0279619d9d8a24ec", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "The critical angle for light going from medium ' $\\mathrm{x}$ ' to medium ' $Y$ ' is $\\theta$. The speed of light in medium ' $\\mathrm{x}$ ' is ' $\\mathrm{V}_{\\mathrm{x}}$ '. The speed of light in medium ' $\\mathrm{Y}$ ' is", "image": null}, "options": [{"id": "xQc1X", "text": "$\\mathrm{V}_{\\mathrm{x}} \\sin \\theta$", "image": null, "isCorrect": false}, {"id": "kRmZA", "text": "$\\mathrm{V}_{\\mathrm{x}} \\tan \\theta$", "image": null, "isCorrect": false}, {"id": "8cCF6", "text": "$\\frac{\\mathrm{V}_{\\mathrm{x}}}{\\tan \\theta}$", "image": null, "isCorrect": false}, {"id": "9VFzG", "text": "$\\frac{\\mathrm{V}_{\\mathrm{x}}}{\\sin \\theta}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Refractive index of ' $x$ ' w.r.t. ' $y$ ' is\n$$\n\\mathrm{y}_{\\mathrm{x}}=\\frac{1}{\\sin \\theta}\n$$\nAlso ${ }_y n_x=\\frac{V_y}{V_x}=\\frac{1}{\\sin \\theta}$\n$$\n\\therefore \\mathrm{V}_{\\mathrm{y}}=\\frac{\\mathrm{V}_{\\mathrm{x}}}{\\sin \\theta}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2606e0279619d9d8a246b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "The critical angle for light going from medium A into medium B is $\\theta$. The speed of light in the medium $A$ is $V_A$. What is the speed of light in the medium B?", "image": null}, "options": [{"id": "oe27d", "text": "$\\mathrm{V}_{\\mathrm{A}} \\sin \\theta$", "image": null, "isCorrect": false}, {"id": "DUhnM", "text": "$\\mathrm{V}_{\\mathrm{A}} \\tan \\theta$", "image": null, "isCorrect": false}, {"id": "jDWDt", "text": "$\\frac{\\mathrm{V}_{\\mathrm{A}}}{\\tan \\theta}$", "image": null, "isCorrect": false}, {"id": "FWbyi", "text": "$\\frac{\\mathrm{V}_{\\mathrm{A}}}{\\sin \\theta}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "${ }_{\\mathrm{B}} \\mu_{\\mathrm{A}}=\\frac{\\mathrm{V}_{\\mathrm{B}}}{\\mathrm{V}_{\\mathrm{A}}}=\\frac{1}{\\sin \\theta}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260490279619d9d8a233f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "A glass cube of length $24 \\mathrm{~cm}$ has a small air bubble trapped inside. When viewed normally from one face it is $10 \\mathrm{~cm}$ below the surface. When viewed normally from the opposite face, its apparent distance is $6 \\mathrm{~cm}$. The refractive index of glass is", "image": null}, "options": [{"id": "rpFG5", "text": "1.50", "image": null, "isCorrect": true}, {"id": "BXZqM", "text": "1.40", "image": null, "isCorrect": false}, {"id": "rU6x8", "text": "1.45", "image": null, "isCorrect": false}, {"id": "qZ0UL", "text": "1.55", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $\\mathrm{x}$ be the real depth from first surface\n$$\n10=\\frac{\\mathrm{x}}{\\mu}\n$$\nWhen viewed from opposite face\n$$\n6=\\frac{24-x}{\\mu}\n$$\nBy solving, $\\mu=1.5$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260360279619d9d8a22a6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "A ray of light travels from a denser medium to a rarer medium. The reflected and the refracted rays are perpendicular to each other. If ' $\\mathrm{r}$ ' and ' $\\mathrm{r}_1$ ' are the angle of reflection and refraction respectively and ' $\\mathrm{C}$ ' is the critical angle, then the angle of incidence is", "image": null}, "options": [{"id": "lrVIA", "text": "$\\cot ^{-1}(\\sin \\mathrm{C})$", "image": null, "isCorrect": false}, {"id": "MbJai", "text": "$\\tan ^{-1}(\\sin C)$", "image": null, "isCorrect": true}, {"id": "FFODG", "text": "$\\sin ^{-1}(\\tan C)$", "image": null, "isCorrect": false}, {"id": "Bn008", "text": "$\\cos ^{-1}(\\tan C)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since reflected and refracted rays are perpendicular to each other,\n$$\n\\begin{aligned}\n& r+r_1=90^{\\circ} \\\\\n& \\therefore r_1=90^{\\circ}-r\n\\end{aligned}\n$$\nRefractive index of the denser medium\n$$\n\\begin{aligned}\n& \\mu=\\frac{\\sin r_1}{\\sin r}=\\frac{\\sin \\left(90^{\\circ}-r\\right)}{\\sin r}=\\frac{\\cos r}{\\sin r}=\\cot r \\\\\n& \\text { Also, } \\mu=\\frac{1}{\\sin C} \\quad \\therefore \\frac{1}{\\sin C}=\\cot r \\\\\n& \\text { or } \\sin C=\\tan r=\\tan i \\\\\n& \\therefore i=\\tan ^{-1}(\\sin C)\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ffe0279619d9d8a20e3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "A light of wavelength ${ }^{\\prime} \\lambda_{1}{ }^{\\prime}$ and velocity $\\mathrm{C}_{1}$ travels from the first medium of\nrefractive index ' $\\mu_{1}$ ' into the second medium of refractive index ' $\\mu_{2}$ '. The\nwavelength and velocity of light in the second medium is $^{\\prime} \\lambda_{2}^{\\prime}$ and $\\mathrm{C}_{2}$ respectively.\nThe refractive index of second medium with respect to first medium is given by", "image": null}, "options": [{"id": "K9FZH", "text": "$\\frac{c_{2}}{c_{1}}$", "image": null, "isCorrect": false}, {"id": "JRHUZ", "text": "$\\frac{\\mu_{2}}{\\mu_{1}}$", "image": null, "isCorrect": true}, {"id": "Gn3l7", "text": "$\\frac{\\mu_{1}}{\\mu_{2}}$", "image": null, "isCorrect": false}, {"id": "UNUu8", "text": "$\\frac{\\lambda_{2}}{\\lambda_{1}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ffd0279619d9d8a20d7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "A light travels through water in the beaker. The height of water column is 'h'.\nRefractive index of water is ' $\\mu_{\\mathrm{w}}^{\\prime}$. If $\\mathrm{C}$ is velocity of light in air, the time taken by\nlight to travel through water will be", "image": null}, "options": [{"id": "TUxgm", "text": "$\\frac{\\mu_{\\mathrm{w}} \\mathrm{h}}{\\mathrm{C}}$", "image": null, "isCorrect": true}, {"id": "QpccT", "text": "$\\mathrm{h} \\mu_{\\mathrm{w}} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "Dgc1m", "text": "$\\frac{\\mathrm{hC}}{\\mu_{\\mathrm{w}}}$", "image": null, "isCorrect": false}, {"id": "Iv0P5", "text": "$\\frac{\\mathrm{h}}{\\mu_{\\mathrm{w}} \\mathrm{C}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Velocity $=\\frac{\\text { distance }}{\\text { time }}$\n$\\therefore$ time $=\\frac{\\text { distance }}{\\text { velocity }}=\\frac{\\mathrm{h}}{\\mathrm{c}} \\mu_{\\mathrm{w}}$\n$\\therefore \\mu_{\\mathrm{w}}=\\frac{\\mathrm{c}}{\\mathrm{v}} \\quad \\therefore \\mathrm{v}=\\frac{\\mathrm{c}}{\\mu_{\\mathrm{w}}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fec0279619d9d8a2054", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "The Brewster's angle for the glass-air interface is $(54 \\cdot 74)^{\\circ} .$ If a ray of light passing\nfrom air to glass strikes at an angle of incidence $45^{\\circ}$, then the angle of refraction is\n$\\left[\\tan (54 \\cdot 74)^{\\circ}=\\sqrt{2}, \\quad \\sin 45^{\\circ}=\\frac{1}{\\sqrt{2}}\\right]$", "image": null}, "options": [{"id": "dqFcf", "text": "$\\sin ^{-1}(0 \\cdot 5)$", "image": null, "isCorrect": true}, {"id": "dYuac", "text": "$\\sin ^{-1}(1)$", "image": null, "isCorrect": false}, {"id": "DD53a", "text": "$\\sin ^{-1}(\\sqrt{2})$", "image": null, "isCorrect": false}, {"id": "bYFgb", "text": "$\\sin ^{-1}\\left(\\frac{1}{\\sqrt{2}}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(D)\n$\\mathrm{n}=\\tan 54.74=\\sqrt{2}$\n$\\sqrt{2}=\\frac{\\sin \\mathrm{i}}{\\sin \\mathrm{r}}=\\frac{\\sin 45^{\\circ}}{\\sin \\mathrm{r}}$\n$\\therefore \\sin \\mathrm{i}=\\frac{\\sin 45^{\\circ}}{\\sqrt{2}}=\\frac{1}{\\sqrt{2} \\cdot \\sqrt{2}}=\\frac{1}{2}=0.5$\n$\\therefore \\mathrm{r}=\\sin ^{-1}(0.5)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fd70279619d9d8a1fb0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "The refraction of light ray takes place from air to water, water to glass and again\nglass to air. The ray emerges parallel to incident ray. The correct relation is\n$\\left[\\mathrm{n}_{\\mathrm{a}}, \\mathrm{n}_{\\mathrm{w}}, \\mathrm{n}_{\\mathrm{g}}\\right.$ represent refractive indices of air, water and glass respectively.", "image": null}, "options": [{"id": "Iu50E", "text": "$\\mathrm{g}^{\\mathrm{n}}_{\\mathrm{w}}=\\frac{\\mathrm{a}^{\\mathrm{n}} \\mathrm{g}}{\\mathrm{a}^{\\mathrm{n}} \\mathrm{w}}$", "image": null, "isCorrect": false}, {"id": "WATfo", "text": "$\\mathrm{g}^{\\mathrm{n}} \\mathrm{w}=\\mathrm{a}^{\\mathrm{n}} \\mathrm{g} \\times \\mathrm{a}^{\\mathrm{n}} \\mathrm{w}$", "image": null, "isCorrect": false}, {"id": "bEFLR", "text": "$\\mathrm{w}^{\\mathrm{n}} \\mathrm{g}=\\frac{\\mathrm{a}^{\\mathrm{n}} \\mathrm{w}}{\\mathrm{a}^{\\mathrm{n}} \\mathrm{g}}$", "image": null, "isCorrect": false}, {"id": "70cw6", "text": "$\\mathrm{w}^{\\mathrm{n}} \\mathrm{g}=\\frac{\\mathrm{a}^{\\mathrm{n}} \\mathrm{g}}{\\mathrm{a}^{\\mathrm{n}} \\mathrm{w}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "(A)\nTheory question", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fd70279619d9d8a1fa9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "A concave mirror of focal length 'f $_{1}$ ' is placed at a distance 'd' from a convex lens of\nfocal length 'f 2 '. A parallel beam of light coming from infinity parallel to principal\naxis falls on the convex lens and then after refraction falls on the concave mirror.\nIf it is to retrace the path, the distance 'd' should be", "image": null}, "options": [{"id": "oZq87", "text": "$\\mathrm{f}_{1}+\\mathrm{f}_{2}$", "image": null, "isCorrect": false}, {"id": "yGHPS", "text": "$-\\mathrm{f}_{1}+\\mathrm{f}_{2}$", "image": null, "isCorrect": false}, {"id": "qV3hY", "text": "$2 \\mathrm{f}_{1}+\\mathrm{f}_{2}$", "image": null, "isCorrect": true}, {"id": "gPE01", "text": "$2 \\mathrm{f}_{1}-\\mathrm{f}_{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(A)\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/QR-kkpaT6viKdiIvdcux5HlpI5IdDWB2FEy_ldrYg1s.original.fullsize.png\"><br>\nThe convex lens will form image at its focus, i.e. at a distance $f_{2}$ from it. If this image falls on the centre of curvature of the concave mirror, the rays falling on it will be normal to the mirror and retrace their path.\nHence $d=2 f_{1}+f_{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fc70279619d9d8a1f2b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "Refractive index of the medium is ' $\\mu$ ' and wavelength is $\\lambda$, then which of th wing proportionality relation is correct?", "image": null}, "options": [{"id": "8KedP", "text": "$\\mu \\propto \\frac{1}{\\lambda^{2}}$", "image": null, "isCorrect": false}, {"id": "JmWDO", "text": "$\\mu \\propto \\lambda^{2}$", "image": null, "isCorrect": false}, {"id": "kKIVz", "text": "$\\mu \\propto \\frac{1}{\\lambda}$", "image": null, "isCorrect": true}, {"id": "6umZT", "text": "$\\mu \\propto \\lambda$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(A)\n$\\mu=\\frac{c}{v}=\\frac{v \\lambda_{0}}{v \\lambda} \\quad \\therefore \\mu \\propto \\frac{1}{\\lambda}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fc60279619d9d8a1f22", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "A ray of light travelling through glass of refractive index $\\sqrt{2}$, is incident on glass - air boundary at an angle of incidence $45^{\\circ}$. If refractive index of air is 1 , then the angle of refraction will be $\\left[\\sin 45^{\\circ}=\\frac{1}{\\sqrt{2}}, \\quad \\sin 90^{\\circ}=1\\right]$", "image": null}, "options": [{"id": "31ODs", "text": "$30^{\\circ}$", "image": null, "isCorrect": false}, {"id": "cIby4", "text": "$90^{\\circ}$", "image": null, "isCorrect": true}, {"id": "FfT1Z", "text": "$60^{\\circ}$", "image": null, "isCorrect": false}, {"id": "1Nq7c", "text": "$45^{\\circ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(C)\n$\\mu=\\sqrt{2} \\mathrm{i}=45^{\\circ}$\n$\\mu_{i} \\sin i=\\mu_{r} \\sin r$\n$\\Rightarrow \\sqrt{2} \\sin 45^{\\circ}=\\sin \\mathrm{r}$\n$\\therefore \\quad \\mathrm{r}=90^{\\circ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f8f0279619d9d8a1d74", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "Let ${ }^{\\prime} \\mu_{1}{ }^{\\prime}$ and ${ }^{\\prime} \\mu_{2}{ }^{\\prime}$ be the refractive indices of two media. ' $\\mathrm{v}_{1}{ }^{\\prime}$ and ' $\\mathrm{v}_{2}$ ' are the\nvelocities of light in the media respectively.\nWhich one of the following relations is TRUE?", "image": null}, "options": [{"id": "OFhtz", "text": "$\\mu_{1} \\mathrm{v}_{1}=\\mu_{2} \\mathrm{v}_{2}$", "image": null, "isCorrect": true}, {"id": "uyPYu", "text": "$\\mu_{2} \\mathrm{v}_{1}=\\mu_{1} \\mathrm{v}_{2}$", "image": null, "isCorrect": false}, {"id": "G4vcY", "text": "$\\mu_{1} \\mathrm{v}_{1}^{2}=\\mu_{2} \\mathrm{v}_{2}^{2}$", "image": null, "isCorrect": false}, {"id": "RRpIn", "text": "$\\mu_{2}^{2} \\mathrm{v}_{1}=\\mu_{1}^{2} \\mathrm{v}_{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mu_{1}=\\frac{c}{v_{1}} \\quad \\mu_{2}=\\frac{c}{v_{2}}$\n$\\therefore \\quad \\mu_{1} v_{1}=\\mu_{2} v_{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f8e0279619d9d8a1d6c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "An object is immersed in a fluid of refractive index ' $\\mu$ '. In order that the object\nbecomes invisible when observed from outside, it should", "image": null}, "options": [{"id": "MqceB", "text": "have refractive index equal to one.", "image": null, "isCorrect": false}, {"id": "YQ5mw", "text": "have refractive index same as surrounding fluid, that is ' $\\mu$ '", "image": null, "isCorrect": true}, {"id": "rOpXh", "text": "absorb all light falling on it.", "image": null, "isCorrect": false}, {"id": "pcmQk", "text": "behave as a perfect reflector.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f6a0279619d9d8a1c4b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}], "question": {"text": "When light enters glass from vacuum then the wavelength of light", "image": null}, "options": [{"id": "mUf82", "text": "remains constant.", "image": null, "isCorrect": false}, {"id": "FrEqm", "text": "becomes zero.", "image": null, "isCorrect": false}, {"id": "KmzWm", "text": "decreases.", "image": null, "isCorrect": true}, {"id": "Xe1lK", "text": "increases.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When a light enters glass form vacuum, then the wavelnght of light decrease.\nThis is because the speed of light in glass in less than that in the vacuum.\nFrom Snell's law the refractive index in a medium is given by.\n$\\mu=\\frac{c}{v}$\nThe glass is of higher refractive index than vaccum, so speed of light decrease and as teh speed of light is drectly proportional to the wavelenght ( $c \\equiv v \\lambda$ ), So the wavelenght also be decrease.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f650279619d9d8a1c22", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c9446
