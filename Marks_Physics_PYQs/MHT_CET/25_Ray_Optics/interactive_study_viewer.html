.51</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi>δ</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mo>⋅</mo><mi>A</mi></math>  <br/><math><msup><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mo>=</mo><mfenced separators=\"|\"><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></mfenced><msup><mrow><mn>3</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math>  <br/><math><mi>n</mi><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>=</mo><mn>1.33</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f0b0279619d9d8a1954", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}], "question": {"text": "The critical angle for light going from medium ‘x’ to medium ‘y’ is <math><mi>'</mi><msup><mrow><mi>θ</mi></mrow><mrow><mi>'</mi></mrow></msup></math> . The speed of light in medium ‘x’ is <math><mi>'</mi><msubsup><mrow><mi>v</mi></mrow><mrow><mi>x</mi></mrow><mrow><mi>'</mi></mrow></msubsup></math> . The speed of light in medium ‘y’ is", "image": null}, "options": [{"id": "cIAhq", "text": "<math><mfrac><mrow><msub><mrow><mi>v</mi></mrow><mrow><mi>x</mi></mrow></msub></mrow><mrow><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi>θ</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "7kUp0", "text": "<math><msub><mrow><mi>v</mi></mrow><mrow><mi>x</mi></mrow></msub><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi>θ</mi></math>", "image": null, "isCorrect": false}, {"id": "fG3BJ", "text": "<math><msub><mrow><mi>v</mi></mrow><mrow><mi>x</mi></mrow></msub><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi>θ</mi></math>", "image": null, "isCorrect": false}, {"id": "NT6hU", "text": "<math><mfrac><mrow><msub><mrow><mi>v</mi></mrow><mrow><mi>x</mi></mrow></msub></mrow><mrow><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi>θ</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The critical angle is that angle on incidence in the denser medium for which the angle of refraction in rarer medium is <math><msup><mrow><mn>90</mn></mrow><mrow><mi>o</mi></mrow></msup><mo>,</mo><mi>i</mi><mo>.</mo><mi>e</mi><mo>.</mo></math>  <br/><math><mfrac><mrow><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi>θ</mi></mrow><mrow><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><msup><mrow><mn>90</mn></mrow><mrow><mi>o</mi></mrow></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi>μ</mi></mrow><mrow><mi>y</mi></mrow></msub></mrow><mrow><msub><mrow><mi>μ</mi></mrow><mrow><mi>x</mi></mrow></msub></mrow></mfrac></math>  <br/><math><mo>⇒</mo><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi>θ</mi><mo>=</mo><mfrac><mrow><msub><mrow><mi>μ</mi></mrow><mrow><mi>y</mi></mrow></msub></mrow><mrow><msub><mrow><mi>μ</mi></mrow><mrow><mi>x</mi></mrow></msub></mrow></mfrac></math> …. (i) <br/>Where, <math><mi>μ</mi><mo>=</mo></math> refractive index of medium. <br/><math><mi>A</mi><mi>l</mi><mi>s</mi><mi>o</mi><mo>,</mo><mi></mi><mi>μ</mi><mo>=</mo><mi></mi><mfrac><mrow><mi>s</mi><mi>p</mi><mi>e</mi><mi>e</mi><mi>d</mi><mi></mi><mi>o</mi><mi>f</mi><mi></mi><mi>l</mi><mi>i</mi><mi>g</mi><mi>h</mi><mi>t</mi><mi></mi><mi>i</mi><mi>n</mi><mi></mi><mi>v</mi><mi>a</mi><mi>c</mi><mi>u</mi><mi>u</mi><mi>m</mi></mrow><mrow><mi>s</mi><mi>p</mi><mi>e</mi><mi>e</mi><mi>d</mi><mi></mi><mi>o</mi><mi>f</mi><mi></mi><mi>l</mi><mi>i</mi><mi>g</mi><mi>h</mi><mi>t</mi><mi></mi><mi>i</mi><mi>n</mi><mi></mi><mi>m</mi><mi>e</mi><mi>d</mi><mi>i</mi><mi>u</mi><mi>m</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>c</mi></mrow><mrow><mi>v</mi></mrow></mfrac></math> … (ii) <br/>Form Eqs. (i) and (ii), we get <br/><math><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi>θ</mi><mfrac><mrow><mi>c</mi></mrow><mrow><msub><mrow><mi>v</mi></mrow><mrow><mi>y</mi></mrow></msub></mrow></mfrac><mo>×</mo><mfrac><mrow><msub><mrow><mi>v</mi></mrow><mrow><mi>x</mi></mrow></msub></mrow><mrow><mi>c</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi>v</mi></mrow><mrow><mi>x</mi></mrow></msub></mrow><mrow><msub><mrow><mi>v</mi></mrow><mrow><mi>y</mi></mrow></msub></mrow></mfrac><mo>⇒</mo><msub><mrow><mi>v</mi></mrow><mrow><mi>y</mi></mrow></msub><mo>=</mo><mfrac><mrow><msub><mrow><mi>v</mi></mrow><mrow><mi>x</mi></mrow></msub></mrow><mrow><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi>θ</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f080279619d9d8a193b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}], "question": {"text": "When light enters glass from vacuum, then the wavelength of light", "image": null}, "options": [{"id": "jTmTZ", "text": "Decrease", "image": null, "isCorrect": true}, {"id": "rpos3", "text": "Become zero", "image": null, "isCorrect": false}, {"id": "4ROZk", "text": "Remains same", "image": null, "isCorrect": false}, {"id": "1vZcD", "text": "Increases", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When a light enters glass from vacuum, then the wavelength of light decreases. <br/>This is because the speed of light in glass is less than that in the vacuum. <br/>From Snell’s law, the refractive index in a medium is given by <br/><math><mi>μ</mi><mo>=</mo><mfrac><mrow><mi>c</mi></mrow><mrow><mi>v</mi></mrow></mfrac></math>  <br/>The glass is of higher refractive index than vacuum, so speed of light decreases and as the speed of light is directly proportional to the wavelength <math><mfenced separators=\"|\"><mrow><mi>c</mi><mo>=</mo><mi>v</mi><mi>λ</mi></mrow></mfenced></math> , so, the wavelength also be decreases.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ef50279619d9d8a18a2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}], "question": {"text": "The refractive index of the material of crystal is 1.68 and that of castor oil is 1.2. When a ray of light passes from oil to glass, its velocity will change by factor", "image": null}, "options": [{"id": "bbUbE", "text": "<math><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "vrqUh", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "cAR43", "text": "<math><mfrac><mrow><mn>5</mn></mrow><mrow><mn>6</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "tnUh0", "text": "<math><mfrac><mrow><mn>5</mn></mrow><mrow><mn>7</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "We know, refractive index of crystal w. r. t. oil, <br/><math><msub><mrow><mi>μ</mi></mrow><mrow><mi>c</mi><mi>o</mi></mrow></msub><mo>=</mo><mfrac><mrow><msub><mrow><mi>μ</mi></mrow><mrow><mi>c</mi></mrow></msub></mrow><mrow><msub><mrow><mi>μ</mi></mrow><mrow><mi>o</mi></mrow></msub></mrow></mfrac><mo>=</mo><mi></mi><mfrac><mrow><mi>s</mi><mi>p</mi><mi>e</mi><mi>e</mi><mi>d</mi><mi></mi><mi>o</mi><mi>f</mi><mi>l</mi><mi>i</mi><mi>g</mi><mi>h</mi><mi>t</mi><mi></mi><mi>i</mi><mi>n</mi><mi></mi><mi>o</mi><mi>i</mi><mi>l</mi></mrow><mrow><mi>s</mi><mi>p</mi><mi>e</mi><mi>e</mi><mi>d</mi><mi></mi><mi>o</mi><mi>f</mi><mi></mi><mi>l</mi><mi>i</mi><mi>g</mi><mi>h</mi><mi>t</mi><mi></mi><mi>i</mi><mi>n</mi><mi></mi><mi>c</mi><mi>r</mi><mi>y</mi><mi>s</mi><mi>t</mi><mi>a</mi><mi>l</mi></mrow></mfrac></math>  <br/>Where, <math><msub><mrow><mi>μ</mi></mrow><mrow><mi>c</mi></mrow></msub></math> = absolute refractive index of crystal w. r. t. vacuum. <br/>and <math><msub><mrow><mi>μ</mi></mrow><mrow><mn>0</mn></mrow></msub></math> = absolute refractive index of oil w. r. t. vacuum. <br/><math><msub><mrow><mi>μ</mi></mrow><mrow><mi>c</mi><mi>o</mi></mrow></msub><mo>=</mo><mfrac><mrow><mn>1.68</mn></mrow><mrow><mn>1.2</mn></mrow></mfrac><mfrac><mrow><mn>7</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>s</mi><mi>p</mi><mi>e</mi><mi>e</mi><mi>d</mi><mi></mi><mi>i</mi><mi>n</mi><mi></mi><mi>o</mi><mi>i</mi><mi>l</mi></mrow><mrow><mi>s</mi><mi>p</mi><mi>e</mi><mi>e</mi><mi>d</mi><mi></mi><mi>i</mi><mi>n</mi><mi></mi><mi>c</mi><mi>r</mi><mi>y</mi><mi>s</mi><mi>t</mi><mi>a</mi><mi>l</mi></mrow></mfrac></math>  <br/>Fractional change in velocity, <br/>when light travel from oil to crystal <br/><math><mo>=</mo><mfrac><mrow><mi>s</mi><mi>p</mi><mi>e</mi><mi>e</mi><mi>d</mi><mi></mi><mi>i</mi><mi>n</mi><mi></mi><mi>c</mi><mi>r</mi><mi>y</mi><mi>s</mi><mi>t</mi><mi>a</mi><mi>l</mi></mrow><mrow><mi>s</mi><mi>p</mi><mi>e</mi><mi>e</mi><mi>d</mi><mi></mi><mi>i</mi><mi>n</mi><mi></mi><mi>o</mi><mi>i</mi><mi>l</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>7</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ed10279619d9d8a1783", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}], "question": {"text": "A ray of light is incident normally on a glass slab of thickness <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#160;</mo><mi>cm</mi></math> and refractive index <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>6</mn></math>. The time taken to travel by a ray from source to surface of the slab is the same as to travel through c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "MHT CET 2017"}], "question": {"text": "When the same monochromatic ray of light travels through glass slab and through water, the number of waves in glass slab of thickness 6 cm is same as in water column of height 7 cm. If refractive index of glass is 1.5 then refractive index of water is", "image": null}, "options": [{"id": "TE45Y", "text": "1.258", "image": null, "isCorrect": false}, {"id": "Nlqzx", "text": "1.269", "image": null, "isCorrect": false}, {"id": "68jaO", "text": "1.286", "image": null, "isCorrect": true}, {"id": "xMTuP", "text": "1.310", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No. of waves in glass slab = No. of waves in water column<br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>μ</mi></mrow><mrow><mi>g</mi></mrow></msub><mo>.</mo><msub><mrow><mi>h</mi></mrow><mrow><mi>g</mi></mrow></msub><mo>=</mo><msub><mrow><mi>μ</mi></mrow><mrow><mi>w</mi></mrow></msub><mi>&nbsp;</mi><mo>.</mo><mi>&nbsp;</mi><msub><mrow><mi>h</mi></mrow><mrow><mi>w</mi></mrow></msub></math><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>μ</mi></mrow><mrow><mi>w</mi></mrow></msub><mo>=</mo><mfrac><mrow><msub><mrow><mi>μ</mi></mrow><mrow><mi>g</mi></mrow></msub><mi>&nbsp;</mi><mo>.</mo><mi>&nbsp;</mi><msub><mrow><mi>h</mi></mrow><mrow><mi>g</mi></mrow></msub></mrow><mrow><msub><mrow><mi>h</mi></mrow><mrow><mi>w</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1.5</mn><mo>×</mo><mn>6</mn></mrow><mrow><mn>7</mn></mrow></mfrac></math><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>μ</mi></mrow><mrow><mi>w</mi></mrow></msub><mo>=</mo><mfrac><mrow><mn>9</mn></mrow><mrow><mn>7</mn></mrow></mfrac><mo>=</mo><mn>1.286</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f62", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "MHT CET 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ead0279619d9d8a1661", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}], "question": {"text": "A ray of light travelling through rarer medium is incident at very small angle <math><msup><mrow><mi>i</mi></mrow></msup></math>&nbsp;on a glass slab and after refraction its velocity is reduced by <math><mn>20</mn><mi>%</mi><mo>.</mo></math> The angle of deviation is", "image": null}, "options": [{"id": "zFxyc", "text": "<math><mfrac><mrow><mi>i</mi></mrow><mrow><mn>8</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "dmZ4G", "text": "<math><mfrac><mrow><mi>i</mi></mrow><mrow><mn>5</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "n7IAG", "text": "<math><mfrac><mrow><mi>i</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "Yy4Kc", "text": "<math><mfrac><mrow><mn>4</mn><mi>i</mi></mrow><mrow><mn>5</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As at interface, velocity of light reduces by <math><mn>20</mn><mi>%</mi></math> of C<br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>δ</mi><mo>=</mo><mn>20</mn><mi>%</mi><mi>&nbsp;</mi><mi>i</mi><mo>=</mo><mfrac><mrow><mn>20</mn></mrow><mrow><mn>100</mn></mrow></mfrac><mo>×</mo><mi>i</mi><mo>=</mo><mfrac><mrow><mi>i</mi></mrow><mrow><mn>5</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e870279619d9d8a152c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "A glass slab of thickness $4 \\mathrm{~cm}$ contains the same numbers of waves as $5 \\mathrm{~cm}$ of water when both are traversed by the same monochromatic ray of light. The refractive index of water is $4 / 3$, what is that for glass?", "image": null}, "options": [{"id": "zjBwQ", "text": "$5 / 3$", "image": null, "isCorrect": true}, {"id": "jn90h", "text": "$5 / 4$", "image": null, "isCorrect": false}, {"id": "u3xA6", "text": "$16 / 15$", "image": null, "isCorrect": false}, {"id": "8qi3l", "text": "$3 / 2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$a n_{g}={ }_{a} n_{w} \\times{ }_{a} n_{g}$\n$$\n\\begin{array}{l}\na n_{g}=\\frac{4}{3} \\times \\frac{\\lambda_{w}}{\\lambda_{g}} \\\\\na^{n_{g}}=\\frac{4}{3} \\times \\frac{5}{4} \\\\\na^{n_{g}}=\\frac{5}{3}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e750279619d9d8a1495", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "A glass slab of thickness $t$ and refractive index $\\mu$. Calculate the time taken by light to travel this thickness.", "image": null}, "options": [{"id": "wJ3Qm", "text": "$t \\mu c$", "image": null, "isCorrect": false}, {"id": "8LxTD", "text": "$\\frac{t c}{\\mu}$", "image": null, "isCorrect": false}, {"id": "z8Fb4", "text": "$\\frac{t}{\\mu c}$", "image": null, "isCorrect": false}, {"id": "Kmq86", "text": "$\\frac{\\mu t}{c}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Time taken by light ray to pass through glass slab $=\\frac{\\mu t}{c}$\nwhere $\\quad t=$ geometrical path $\\mu t=$ optical path", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e610279619d9d8a13f4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "If angle of incidence is twice the angle of refraction in a medium of refractive index $\\mu$, then angle of incidence is", "image": null}, "options": [{"id": "UxfdN", "text": "$2 \\cos ^{-1} \\frac{\\mu}{2}$", "image": null, "isCorrect": true}, {"id": "embJr", "text": "$2 \\sin ^{-1} \\frac{\\mu}{2}$", "image": null, "isCorrect": false}, {"id": "EZNOH", "text": "$2 \\cos ^{-1} \\mu$", "image": null, "isCorrect": false}, {"id": "Bs8bh", "text": "$2 \\sin ^{-1} \\mu$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Snell's law Refractive index, $\\mu=\\frac{\\sin i}{\\sin r}$\nGiven $i=2 r$\n$\\therefore$\n$$\n\\mu=\\frac{\\sin 2 r}{\\sin r}\n$$\nor $\\mu=\\frac{2 \\sin r \\cos r}{\\sin r}$\nor $\\quad \\cos ^{-1} \\frac{\\mu}{2}=r$\n$$\ni=2 \\cos ^{-1} \\frac{\\mu}{2}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "65a263240279619d9d8a3c59", "title": "Lens Formula, Refraction of light from curved surface", "totalQuestions": 53, "questions": [{"_id": "6abb88cd15a9fc0fc8c1471c", "type": "singleCorrect", "question": {"text": "The focal length of a glass convex lens in air is $f_a$ and that in water is $f_w$. The refractive index from air to glass is $\\dfrac{3}{2}$ and that from air to water is $\\dfrac{4}{3}$. The ratio $f_a:f_w$ is", "image": null}, "options": [{"id": "Kgwgf", "label": "A", "text": "$1:2$", "isCorrect": false, "image": null}, {"id": "A4kdH", "label": "B", "text": "$1:3$", "isCorrect": false, "image": null}, {"id": "7d5kr", "label": "C", "text": "$1:4$", "isCorrect": true, "image": null}, {"id": "NNO72", "label": "D", "text": "$1:8$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using the Lens Maker's formula for the lens in air:<br><br>$\\dfrac{1}{f_a} = (\\mu_g - 1)\\left(\\dfrac{1}{R_1} - \\dfrac{1}{R_2}\\right)$<br><br>Substituting $\\mu_g = \\dfrac{3}{2}$:<br><br>$\\dfrac{1}{f_a} = \\left(\\dfrac{3}{2} - 1\\right)\\left(\\dfrac{1}{R_1} - \\dfrac{1}{R_2}\\right) = \\dfrac{1}{2}\\left(\\dfrac{1}{R_1} - \\dfrac{1}{R_2}\\right)$<br><br>For the lens in water, the relative refractive index is $\\dfrac{\\mu_g}{\\mu_w}$:<br><br>$\\dfrac{1}{f_w} = \\left(\\dfrac{\\mu_g}{\\mu_w} - 1\\right)\\left(\\dfrac{1}{R_1} - \\dfrac{1}{R_2}\\right)$<br><br>Substituting $\\mu_g = \\dfrac{3}{2}$ and $\\mu_w = \\dfrac{4}{3}$:<br><br>$\\dfrac{1}{f_w} = \\left(\\dfrac{3/2}{4/3} - 1\\right)\\left(\\dfrac{1}{R_1} - \\dfrac{1}{R_2}\\right) = \\left(\\dfrac{9}{8} - 1\\right)\\left(\\dfrac{1}{R_1} - \\dfrac{1}{R_2}\\right) = \\dfrac{1}{8}\\left(\\dfrac{1}{R_1} - \\dfrac{1}{R_2}\\right)$<br><br>Dividing the equation for $f_w$ by the equation for $f_a$:<br><br>$\\dfrac{f_w}{f_a} = \\dfrac{1/2}{1/8} = 4$<br><br>$\\Rightarrow \\dfrac{f_a}{f_w} = \\dfrac{1}{4}$<br><br>The ratio $f_a : f_w$ is $1 : 4$.<br><br>Answer: $1:4$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883b15a9fc0fc8c141c0", "type": "singleCorrect", "question": {"text": "The radii of curvature of both the surfaces of a convex lens are equal. One of the surfaces is made plane by grinding. The new focal length and power of the lens, respectively, are", "image": null}, "options": [{"id": "7Geav", "label": "A", "text": "$\\dfrac{f}{2}$ and $2P$", "isCorrect": false, "image": null}, {"id": "cRyVS", "label": "B", "text": "$\\sqrt{2} f$ and $\\dfrac{P}{\\sqrt{2}}$", "isCorrect": false, "image": null}, {"id": "uC68W", "label": "C", "text": "$2f$ and $\\dfrac{P}{2}$", "isCorrect": true, "image": null}, {"id": "aWdm7", "label": "D", "text": "$f$ and $P$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For the initial equiconvex lens, the radii of curvature are $R_1 = R$ and $R_2 = -R$.<br><br>Using the lens maker's formula, the initial focal length $f$ is given by<br><br>$\\dfrac{1}{f} = (\\mu - 1) \\left( \\dfrac{1}{R_1} - \\dfrac{1}{R_2} \\right) = (\\mu - 1) \\left( \\dfrac{1}{R} - \\dfrac{1}{-R} \\right) = \\dfrac{2(\\mu - 1)}{R}$<br><br>The initial power is $P = \\dfrac{1}{f} = \\dfrac{2(\\mu - 1)}{R}$.<br><br>When one surface is made plane by grinding, its radius of curvature becomes infinity. Let the new radii be $R_1' = R$ and $R_2' = \\infty$.<br><br>The new focal length $f'$ is<br><br>$\\dfrac{1}{f'} = (\\mu - 1) \\left( \\dfrac{1}{R} - \\dfrac{1}{\\infty} \\right) = \\dfrac{\\mu - 1}{R}$<br><br>Comparing the two equations, we get<br><br>$\\dfrac{1}{f'} = \\dfrac{1}{2} \\left( \\dfrac{2(\\mu - 1)}{R} \\right) = \\dfrac{1}{2f}$<br><br>$\\Rightarrow f' = 2f$<br><br>The new power $P'$ is<br><br>$P' = \\dfrac{1}{f'} = \\dfrac{1}{2f} = \\dfrac{P}{2}$<br><br>Answer: $2f$ and $\\dfrac{P}{2}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884c15a9fc0fc8c1425a", "type": "singleCorrect", "question": {"text": "A biconvex lens has radius of curvature of both the surfaces same as $\\dfrac{1}{6}$ cm. If this lens is replaced by another convex lens having different radii of curvature on both sides without change in lens power then possible combination of $R_1$ and $R_2$ is ($R_1 \\neq R_2$)", "image": null}, "options": [{"id": "IeaZC", "label": "A", "text": "$1/3$ cm and $1/5$ cm", "isCorrect": false, "image": null}, {"id": "wBiGb", "label": "B", "text": "$1/5$ cm and $1/7$ cm", "isCorrect": true, "image": null}, {"id": "A2Qg7", "label": "C", "text": "$1/3$ cm and $1/7$ cm", "isCorrect": false, "image": null}, {"id": "POA2L", "label": "D", "text": "$1/6$ cm and $1/9$ cm", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using the Lens Maker's formula, the power of a lens is given by:<br><br>$P = (\\mu - 1) \\left( \\dfrac{1}{R_1} - \\dfrac{1}{R_2} \\right)$<br><br>For the initial biconvex lens, $R_1 = \\dfrac{1}{6}$ cm and $R_2 = -\\dfrac{1}{6}$ cm. Substituting these values:<br><br>$P = (\\mu - 1) (6 - (-6)) = 12(\\mu - 1)$<br><br>For the new biconvex lens, the power remains the same. Let its radii of curvature be $R_1'$ and $R_2'$ (where $R_1'$ is positive and $R_2'$ is negative). Let their magnitudes be $r_1$ and $r_2$.<br><br>$P' = (\\mu - 1) \\left( \\dfrac{1}{r_1} + \\dfrac{1}{r_2} \\right)$<br><br>Equating the powers $P = P'$:<br><br>$\\dfrac{1}{r_1} + \\dfrac{1}{r_2} = 12$<br><br>Checking the given options for the sum of the reciprocals of the radii:<br><br>For $1/3$ cm and $1/5$ cm: $3 + 5 = 8 \\neq 12$<br><br>For $1/5$ cm and $1/7$ cm: $5 + 7 = 12$<br><br>For $1/3$ cm and $1/7$ cm: $3 + 7 = 10 \\neq 12$<br><br>For $1/6$ cm and $1/9$ cm: $6 + 9 = 15 \\neq 12$<br><br>The combination of $1/5$ cm and $1/7$ cm satisfies the condition.<br><br>Answer: $1/5$ cm and $1/7$ cm", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88ad15a9fc0fc8c145f9", "type": "singleCorrect", "question": {"text": "An achromatic convergent doublet of two lenses in contact has a power of $+2D$. The convex lens has power $+5D$. What is the ratio of the dispersive powers of the convergent and divergent lenses?", "image": null}, "options": [{"id": "QqwGS", "label": "A", "text": "$2:5$", "isCorrect": false, "image": null}, {"id": "qLAHh", "label": "B", "text": "$3:5$", "isCorrect": true, "image": null}, {"id": "Q6hP7", "label": "C", "text": "$5:2$", "isCorrect": false, "image": null}, {"id": "QDOyJ", "label": "D", "text": "$5:3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Power of the combination, $P = +2D$<br><br>Power of the convex (convergent) lens, $P_1 = +5D$<br><br>Power of the divergent lens, $P_2 = P - P_1 = 2 - 5 = -3D$<br><br>For an achromatic doublet, the condition is $\\dfrac{\\omega_1}{f_1} + \\dfrac{\\omega_2}{f_2} = 0$<br><br>Since $P = \\dfrac{1}{f}$, we have $\\omega_1 P_1 + \\omega_2 P_2 = 0$<br><br>Substituting the values of $P_1$ and $P_2$:<br><br>$\\omega_1 (5) + \\omega_2 (-3) = 0$<br><br>$5 \\omega_1 = 3 \\omega_2$<br><br>$\\dfrac{\\omega_1}{\\omega_2} = \\dfrac{3}{5}$<br><br>The ratio of the dispersive powers is $3:5$.<br><br>Answer: $3:5$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887d15a9fc0fc8c14432", "type": "singleCorrect", "question": {"text": "The combined focal length is $F$ when a convex lens of focal length $F_1$ and concave lens of focal length $F_2$ is combined. The combination of these lenses will behave like a concave lens, if", "image": null}, "options": [{"id": "9HNR0", "label": "A", "text": "$F_1 > F_2$", "isCorrect": true, "image": null}, {"id": "qft7w", "label": "B", "text": "$F_1 < F_2$", "isCorrect": false, "image": null}, {"id": "NpnlB", "label": "C", "text": "$F_1 = F_2$", "isCorrect": false, "image": null}, {"id": "eH2kM", "label": "D", "text": "$F \\leq F_2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The power of the convex lens is $P_1 = \\dfrac{1}{F_1}$<br><br>The power of the concave lens is $P_2 = -\\dfrac{1}{F_2}$<br><br>The power of the combined lens system is given by $P = P_1 + P_2$<br><br>$P = \\dfrac{1}{F_1} - \\dfrac{1}{F_2}$<br><br>For the combination to behave as a concave lens, its effective power must be negative ($P < 0$).<br><br>$\\dfrac{1}{F_1} - \\dfrac{1}{F_2} < 0$<br><br>$\\dfrac{1}{F_1} < \\dfrac{1}{F_2}$<br><br>$F_1 > F_2$<br><br>Answer: $F_1 > F_2$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88bb15a9fc0fc8c14678", "type": "singleCorrect", "question": {"text": "A convex lens of focal length $F$ produces a real image $'n'$ times the size of the object. The image distance is", "image": null}, "options": [{"id": "RQvXw", "label": "A", "text": "$\\dfrac{F}{(n+1)}$", "isCorrect": false, "image": null}, {"id": "5w8AT", "label": "B", "text": "$\\dfrac{F}{(n-1)}$", "isCorrect": false, "image": null}, {"id": "td2qt", "label": "C", "text": "$F(n - 1)$", "isCorrect": false, "image": null}, {"id": "BxyNA", "label": "D", "text": "$F(n + 1)$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For a real image formed by a convex lens, the magnification $m$ is negative. Thus, $m = -n$.<br><br>The magnification is also given by $m = \\dfrac{v}{u}$, which implies $\\dfrac{v}{u} = -n \\Rightarrow u = -\\dfrac{v}{n}$.<br><br>Using the thin lens formula:<br><br>$\\dfrac{1}{v} - \\dfrac{1}{u} = \\dfrac{1}{f}$<br><br>Substituting $u = -\\dfrac{v}{n}$ and $f = F$:<br><br>$\\dfrac{1}{v} - \\left(-\\dfrac{n}{v}\\right) = \\dfrac{1}{F}$<br><br>$\\dfrac{1 + n}{v} = \\dfrac{1}{F}$<br><br>$v = F(n + 1)$<br><br>Answer: $F(n + 1)$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb882b15a9fc0fc8c1412a", "type": "singleCorrect", "question": {"text": "A bi-convex lens is formed with two thin plano-convex lenses as shown in the figure. Refractive index of the first lens is $1.5$ and that of second is $1.2$. Both the curved surfaces are of the same radius of curvature $R = 14$ cm. For an object distance of $40$ cm, the image distance will be<br><img style=\"width: 200px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/may/watermarked_images/12_may_shift_1__q8_d1_v2.png\" />", "image": null}, "options": [{"id": "3mRS4", "label": "A", "text": "$280.0$ cm", "isCorrect": false, "image": null}, {"id": "EMZgW", "label": "B", "text": "$13.3$ cm", "isCorrect": false, "image": null}, {"id": "rlJuV", "label": "C", "text": "$21.5$ cm", "isCorrect": false, "image": null}, {"id": "Yvdb6", "label": "D", "text": "$40.0$ cm", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The given bi-convex lens can be considered as a combination of two plano-convex lenses placed in contact with their flat surfaces facing each other.<br><br>For the first plano-convex lens (left):<br>Refractive index, $n_1 = 1.5$<br>Radius of curvature of the first surface, $R_1 = +14$ cm<br>Radius of curvature of the second surface, $R_2 = \\infty$<br>Using the lens maker's formula, its focal length $f_1$ is:<br>$\\dfrac{1}{f_1} = (n_1 - 1) \\left( \\dfrac{1}{R_1} - \\dfrac{1}{R_2} \\right)$<br>$\\dfrac{1}{f_1} = (1.5 - 1) \\left( \\dfrac{1}{14} - \\dfrac{1}{\\infty} \\right) = \\dfrac{0.5}{14} = \\dfrac{1}{28} \\text{ cm}^{-1}$<br><br>For the second plano-convex lens (right):<br>Refractive index, $n_2 = 1.2$<br>Radius of curvature of the first surface, $R_1 = \\infty$<br>Radius of curvature of the second surface, $R_2 = -14$ cm<br>Its focal length $f_2$ is:<br>$\\dfrac{1}{f_2} = (n_2 - 1) \\left( \\dfrac{1}{R_1} - \\dfrac{1}{R_2} \\right)$<br>$\\dfrac{1}{f_2} = (1.2 - 1) \\left( \\dfrac{1}{\\infty} - \\dfrac{1}{-14} \\right) = \\dfrac{0.2}{14} = \\dfrac{1}{70} \\text{ cm}^{-1}$<br><br>The equivalent focal length $F$ of the combination is given by:<br>$\\dfrac{1}{F} = \\dfrac{1}{f_1} + \\dfrac{1}{f_2}$<br>$\\dfrac{1}{F} = \\dfrac{1}{28} + \\dfrac{1}{70} = \\dfrac{5 + 2}{140} = \\dfrac{7}{140} = \\dfrac{1}{20} \\text{ cm}^{-1}$<br>$\\Rightarrow F = +20$ cm<br><br>Given the object distance $u = -40$ cm, we use the lens formula to find the image distance $v$:<br>$\\dfrac{1}{v} - \\dfrac{1}{u} = \\dfrac{1}{F}$<br>$\\dfrac{1}{v} - \\dfrac{1}{-40} = \\dfrac{1}{20}$<br>$\\dfrac{1}{v} + \\dfrac{1}{40} = \\dfrac{1}{20}$<br>$\\dfrac{1}{v} = \\dfrac{1}{20} - \\dfrac{1}{40} = \\dfrac{2 - 1}{40} = \\dfrac{1}{40}$<br>$\\Rightarrow v = +40.0$ cm<br><br>Answer: $40.0$ cm", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ea8c30a4553e1bde2b", "type": "singleCorrect", "question": {"text": "Refractive index of a glass convex lens is $1.5$. The radius of curvature of each of the two surfaces of the lens is 40 cm. The ratio of the power of the lens when immersed in a liquid of refractive index $1.25$ to that when placed in air is", "image": null}, "options": [{"id": "QFxtq", "label": "A", "text": "$2:3$", "isCorrect": false, "image": null}, {"id": "CiNDj", "label": "B", "text": "$2:5$", "isCorrect": true, "image": null}, {"id": "FentL", "label": "C", "text": "$3:4$", "isCorrect": false, "image": null}, {"id": "qbVyZ", "label": "D", "text": "$5:2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The power of a lens is given by the lens maker's formula:<br><br>$P = \\dfrac{1}{f} = (\\mu_{rel} - 1)\\left(\\dfrac{1}{R_1} - \\dfrac{1}{R_2}\\right)$<br><br>When the lens is placed in air, the relative refractive index is $\\mu_{rel} = \\dfrac{\\mu_g}{\\mu_a} = \\dfrac{1.5}{1} = 1.5$.<br><br>The power in air is:<br><br>$P_a = (1.5 - 1)\\left(\\dfrac{1}{R_1} - \\dfrac{1}{R_2}\\right) = 0.5\\left(\\dfrac{1}{R_1} - \\dfrac{1}{R_2}\\right)$<br><br>When the lens is immersed in the liquid, the relative refractive index is $\\mu_{rel} = \\dfrac{\\mu_g}{\\mu_l} = \\dfrac{1.5}{1.25} = 1.2$.<br><br>The power in the liquid is:<br><br>$P_l = (1.2 - 1)\\left(\\dfrac{1}{R_1} - \\dfrac{1}{R_2}\\right) = 0.2\\left(\\dfrac{1}{R_1} - \\dfrac{1}{R_2}\\right)$<br><br>Taking the ratio of the power of the lens in the liquid to that in air, we get:<br><br>$\\dfrac{P_l}{P_a} = \\dfrac{0.2}{0.5} = \\dfrac{2}{5}$<br><br>Thus, the required ratio is $2:5$.<br><br>Answer: $2:5$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3218c30a4553e1be07f", "type": "singleCorrect", "question": {"text": "A simple microscope is a combination of two lenses in contact. Their powers are $+20\\text{D}$ and $-4\\text{D}$. The distance of distinct vision is $25\\ \\text{cm}$. When seen through the microscope, the size of the image of an object $3\\ \\text{mm}$ high is", "image": null}, "options": [{"id": "3BBFv", "label": "A", "text": "$1.8\\ \\text{cm}$", "isCorrect": false, "image": null}, {"id": "9PyqB", "label": "B", "text": "$1.5\\ \\text{cm}$", "isCorrect": true, "image": null}, {"id": "sTZeW", "label": "C", "text": "$1.2\\ \\text{cm}$", "isCorrect": false, "image": null}, {"id": "kSMGZ", "label": "D", "text": "$0.6\\ \\text{cm}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The equivalent power of the lens combination is given by the sum of their individual powers:<br><br>$P = P_1 + P_2 = +20\\text{ D} - 4\\text{ D} = +16\\text{ D}$<br><br>The focal length of the combination is:<br><br>$f = \\dfrac{1}{P} = \\dfrac{1}{16}\\text{ m} = \\dfrac{100}{16}\\text{ cm} = 6.25\\text{ cm}$<br><br>For a simple microscope, when the image is formed at the least distance of distinct vision ($D = 25\\text{ cm}$), the linear magnification $m$ is given by:<br><br>$m = 1 + \\dfrac{D}{f}$<br><br>Substituting the values:<br><br>$m = 1 + \\dfrac{25}{6.25} = 1 + 4 = 5$<br><br>The size of the image $h_i$ is the magnification times the size of the object $h_o$:<br><br>$h_i = m \\times h_o = 5 \\times 3\\text{ mm} = 15\\text{ mm}$<br><br>Converting to centimeters:<br><br>$h_i = 1.5\\text{ cm}$<br><br>Answer: $1.5\\ \\text{cm}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c08c30a4553e1bdc69", "type": "singleCorrect", "question": {"text": "A lens of refractive index '$\\mu$' has focal length '$f$'. When the lens is immersed in a liquid of refractive index '$\\mu_0$', its focal length becomes '$f_0$'. Then '$f_0$' is given by", "image": null}, "options": [{"id": "d06sK", "label": "A", "text": "$\\dfrac{(\\mu_0-\\mu)f}{\\mu(\\mu_0-1)}$", "isCorrect": false, "image": null}, {"id": "rT6ml", "label": "B", "text": "$\\dfrac{\\mu(\\mu_0-1)f}{(\\mu_0-\\mu)}$", "isCorrect": false, "image": null}, {"id": "P6AoI", "label": "C", "text": "$\\dfrac{(\\mu-\\mu_0)f}{\\mu_0(\\mu-1)}$", "isCorrect": false, "image": null}, {"id": "gjtOF", "label": "D", "text": "$\\dfrac{\\mu_0(\\mu-1)f}{(\\mu-\\mu_0)}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Using the lens maker's formula for the lens in air:<br><br>$\\dfrac{1}{f} = (\\mu - 1) \\left( \\dfrac{1}{R_1} - \\dfrac{1}{R_2} \\right)$<br><br>When the lens is immersed in a liquid of refractive index $\\mu_0$, the relative refractive index of the lens becomes $\\dfrac{\\mu}{\\mu_0}$. The focal length $f_0$ in the liquid is given by:<br><br>$\\dfrac{1}{f_0} = \\left( \\dfrac{\\mu}{\\mu_0} - 1 \\right) \\left( \\dfrac{1}{R_1} - \\dfrac{1}{R_2} \\right)$<br><br>$\\dfrac{1}{f_0} = \\left( \\dfrac{\\mu - \\mu_0}{\\mu_0} \\right) \\left( \\dfrac{1}{R_1} - \\dfrac{1}{R_2} \\right)$<br><br>Dividing the first equation by the second equation:<br><br>$\\dfrac{f_0}{f} = \\dfrac{\\mu - 1}{\\dfrac{\\mu - \\mu_0}{\\mu_0}}$<br><br>$\\dfrac{f_0}{f} = \\dfrac{\\mu_0(\\mu - 1)}{\\mu - \\mu_0}$<br><br>$f_0 = \\dfrac{\\mu_0(\\mu - 1)f}{\\mu - \\mu_0}$<br><br>Answer: $\\dfrac{\\mu_0(\\mu-1)f}{(\\mu-\\mu_0)}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2cf8c30a4553e1bdd09", "type": "singleCorrect", "question": {"text": "A convex lens having refractive index 1.6 has focal length 12 cm, when it is in air. The focal length of that lens when placed in water is (refractive index of water = 1.28)", "image": null}, "options": [{"id": "bt5m3", "label": "A", "text": "$655\\ \\text{mm}$", "isCorrect": false, "image": null}, {"id": "qbcCd", "label": "B", "text": "$288\\ \\text{mm}$", "isCorrect": true, "image": null}, {"id": "TB39s", "label": "C", "text": "$555\\ \\text{mm}$", "isCorrect": false, "image": null}, {"id": "aMoYJ", "label": "D", "text": "$355\\ \\text{mm}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using the Lens Maker's formula for the lens in air:<br><br>$\\dfrac{1}{f_a} = (\\mu_g - 1) \\left( \\dfrac{1}{R_1} - \\dfrac{1}{R_2} \\right)$<br><br>$\\dfrac{1}{12} = (1.6 - 1) \\left( \\dfrac{1}{R_1} - \\dfrac{1}{R_2} \\right)$<br><br>$\\dfrac{1}{12} = 0.6 \\left( \\dfrac{1}{R_1} - \\dfrac{1}{R_2} \\right)$<br><br>Using the Lens Maker's formula for the lens in water:<br><br>$\\dfrac{1}{f_w} = \\left( \\dfrac{\\mu_g}{\\mu_w} - 1 \\right) \\left( \\dfrac{1}{R_1} - \\dfrac{1}{R_2} \\right)$<br><br>$\\dfrac{1}{f_w} = \\left( \\dfrac{1.6}{1.28} - 1 \\right) \\left( \\dfrac{1}{R_1} - \\dfrac{1}{R_2} \\right)$<br><br>$\\dfrac{1}{f_w} = (1.25 - 1) \\left( \\dfrac{1}{R_1} - \\dfrac{1}{R_2} \\right)$<br><br>$\\dfrac{1}{f_w} = 0.25 \\left( \\dfrac{1}{R_1} - \\dfrac{1}{R_2} \\right)$<br><br>Dividing the two equations:<br><br>$\\dfrac{f_w}{f_a} = \\dfrac{0.6}{0.25}$<br><br>$f_w = 12 \\times 2.4 = 28.8\\ \\text{cm}$<br><br>$f_w = 288\\ \\text{mm}$<br><br>Answer: $288\\ \\text{mm}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3158c30a4553e1bdffa", "type": "singleCorrect", "question": {"text": "An equiconvex lens of focal length F is cut in to two equal parts along the vertical axis. The focal length of each part will be", "image": null}, "options": [{"id": "XcwxD", "label": "A", "text": "$4F$", "isCorrect": false, "image": null}, {"id": "tEUVH", "label": "B", "text": "$\\dfrac{F}{2}$", "isCorrect": false, "image": null}, {"id": "gU5iI", "label": "C", "text": "$2F$", "isCorrect": true, "image": null}, {"id": "qBSVf", "label": "D", "text": "$F$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using the lens maker's formula for the initial equiconvex lens:<br><br>$\\dfrac{1}{F} = (\\mu - 1) \\left(\\dfrac{1}{R} - \\dfrac{1}{-R}\\right) = \\dfrac{2(\\mu - 1)}{R}$<br><br>When the lens is cut into two equal parts along the vertical axis, each part becomes a plano-convex lens with radii of curvature $R$ and $\\infty$.<br><br>The focal length $F'$ of each part is given by:<br><br>$\\dfrac{1}{F'} = (\\mu - 1) \\left(\\dfrac{1}{R} - \\dfrac{1}{\\infty}\\right) = \\dfrac{\\mu - 1}{R}$<br><br>Comparing the two equations:<br><br>$\\dfrac{1}{F'} = \\dfrac{1}{2} \\left( \\dfrac{2(\\mu - 1)}{R} \\right) = \\dfrac{1}{2F}$<br><br>$F' = 2F$<br><br>Answer: $2F$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2988c30a4553e1bdabc", "type": "singleCorrect", "question": {"text": "When a beam of white light is allowed to pass through convex lens parallel to principle axis, the different colors of light converge at different point on the principle axis after refraction. This is called", "image": null}, "options": [{"id": "PQvz0", "label": "A", "text": "scattering", "isCorrect": false, "image": null}, {"id": "JUhvn", "label": "B", "text": "chromatic aberration", "isCorrect": true, "image": null}, {"id": "YggOK", "label": "C", "text": "spherical aberration", "isCorrect": false, "image": null}, {"id": "qDl9y", "label": "D", "text": "polarisation", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The refractive index of the material of a lens varies with the wavelength of light. According to Cauchy's formula, the refractive index is different for different colors of white light.<br><br>The focal length of a lens is given by the lens maker's formula: $\\dfrac{1}{f} = (\\mu - 1)\\left(\\dfrac{1}{R_1} - \\dfrac{1}{R_2}\\right)$.<br><br>Since $\\mu$ is different for different colors, the focal length $f$ will also be different for different colors. As a result, when a beam of white light passes through a convex lens parallel to the principal axis, the different colors converge at different points on the principal axis.<br><br>This inability of a lens to focus all colors of light at a single point is known as chromatic aberration.<br><br>Answer: chromatic aberration", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be7bf9280d7f9932d76", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Convex lens of focal length $1 / 3 \\mathrm{~m}$ forms a real, inverted image twice in size of the object. The distance of the object from the lens is", "image": null}, "options": [{"id": "TSMOT", "text": "0.5 m", "image": null, "isCorrect": true}, {"id": "t5kPD", "text": "0.166 m", "image": null, "isCorrect": false}, {"id": "W3W2C", "text": "0.33 m", "image": null, "isCorrect": false}, {"id": "eOjaL", "text": "1.0 m", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $f = \\dfrac{1}{3}$ m.<br><br>Since the image is real and inverted, magnification $m = -2$.<br><br>Using the formula for magnification of a lens, $m = \\dfrac{v}{u}$, we get $v = -2u$.<br><br>Using the lens formula, $\\dfrac{1}{v} - \\dfrac{1}{u} = \\dfrac{1}{f}$.<br><br>Substituting the values:<br><br>$\\dfrac{1}{-2u} - \\dfrac{1}{u} = \\dfrac{1}{1/3}$<br><br>$\\dfrac{-3}{2u} = 3$<br><br>$2u = -1 \\Rightarrow u = -0.5$ m.<br><br>The distance of the object from the lens is $0.5$ m.<br><br>Answer: 0.5 m", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bd7bf9280d7f9932ce6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Refractive index of a glass convex lens is $1.5$. The radius of curvature of each of the two surfaces of the lens is 40 cm . The ratio of the power of the lens when immersed in a liquid of refractive index 1.25 to that when placed in air is", "image": null}, "options": [{"id": "TkPUy", "text": "2:3", "image": null, "isCorrect": false}, {"id": "rVNfe", "text": "3:2", "image": null, "isCorrect": false}, {"id": "gN5pb", "text": "2:5", "image": null, "isCorrect": true}, {"id": "CrszO", "text": "5:2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using the lens maker's formula, the power of a lens is given by $P = \\dfrac{1}{f} = (\\mu_{rel} - 1) \\left( \\dfrac{1}{R_1} - \\dfrac{1}{R_2} \\right)$.<br><br>Power of the lens in air is $P_a = (\\mu_g - 1) \\left( \\dfrac{1}{R_1} - \\dfrac{1}{R_2} \\right)$.<br><br>Power of the lens in liquid is $P_l = \\left( \\dfrac{\\mu_g}{\\mu_l} - 1 \\right) \\left( \\dfrac{1}{R_1} - \\dfrac{1}{R_2} \\right)$.<br><br>Taking the ratio of the power in liquid to the power in air:<br><br>$\\dfrac{P_l}{P_a} = \\dfrac{\\dfrac{\\mu_g}{\\mu_l} - 1}{\\mu_g - 1}$<br><br>Given $\\mu_g = 1.5$ and $\\mu_l = 1.25$.<br><br>$\\dfrac{P_l}{P_a} = \\dfrac{\\dfrac{1.5}{1.25} - 1}{1.5 - 1}$<br><br>$\\dfrac{P_l}{P_a} = \\dfrac{1.2 - 1}{0.5} = \\dfrac{0.2}{0.5} = \\dfrac{2}{5}$<br><br>The ratio is $2:5$.<br><br>Answer: 2:5", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b93bf9280d7f9932a89", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A convex lens of refractive index 1.5 has power 3D. It is placed in a liquid of refractive index 2 . The new power of the lens is", "image": null}, "options": [{"id": "NxE5P", "text": "$3D$", "image": null, "isCorrect": false}, {"id": "FcXbd", "text": "$0.75 \\mathrm{D}$", "image": null, "isCorrect": false}, {"id": "47ifo", "text": "$-1.5 \\mathrm{D}$", "image": null, "isCorrect": true}, {"id": "0yMMc", "text": "$2D$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using the lens maker's formula in air:<br><br>$P_a = (\\mu_g - 1) \\left( \\dfrac{1}{R_1} - \\dfrac{1}{R_2} \\right)$<br><br>$3 = (1.5 - 1) \\left( \\dfrac{1}{R_1} - \\dfrac{1}{R_2} \\right)$<br><br>$\\left( \\dfrac{1}{R_1} - \\dfrac{1}{R_2} \\right) = \\dfrac{3}{0.5} = 6$<br><br>When the lens is placed in a liquid, the new power $P_l$ is given by:<br><br>$P_l = \\left( \\dfrac{\\mu_g}{\\mu_l} - 1 \\right) \\left( \\dfrac{1}{R_1} - \\dfrac{1}{R_2} \\right)$<br><br>Substituting the given values $\\mu_g = 1.5$ and $\\mu_l = 2$:<br><br>$P_l = \\left( \\dfrac{1.5}{2} - 1 \\right) \\times 6$<br><br>$P_l = (0.75 - 1) \\times 6$<br><br>$P_l = -0.25 \\times 6 = -1.5 \\mathrm{D}$<br><br>Answer: $-1.5 \\mathrm{D}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b77bf9280d7f993297c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A concave lens (refractive index $=1.5$) has both surfaces of same radius of curvature $R$. If it is immersed in a liquid of refractive index $1.75$ it will act as a", "image": null}, "options": [{"id": "R30dn", "text": "concave lens of focal length (3.5) R", "image": null, "isCorrect": false}, {"id": "7IGW7", "text": "concave lens of focal length 2 R", "image": null, "isCorrect": false}, {"id": "TEBJh", "text": "convex lens of focal length (3.5) R", "image": null, "isCorrect": true}, {"id": "Btz9O", "text": "convex lens of focal length 2 R", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using the lens maker's formula:<br><br>$\\dfrac{1}{f} = \\left( \\dfrac{\\mu_g}{\\mu_l} - 1 \\right) \\left( \\dfrac{1}{R_1} - \\dfrac{1}{R_2} \\right)$<br><br>For an equiconcave lens, $R_1 = -R$ and $R_2 = +R$.<br><br>Given $\\mu_g = 1.5$ and $\\mu_l = 1.75$.<br><br>$\\dfrac{1}{f} = \\left( \\dfrac{1.5}{1.75} - 1 \\right) \\left( \\dfrac{1}{-R} - \\dfrac{1}{R} \\right)$<br><br>$\\dfrac{1}{f} = \\left( \\dfrac{6}{7} - 1 \\right) \\left( -\\dfrac{2}{R} \\right)$<br><br>$\\dfrac{1}{f} = \\left( -\\dfrac{1}{7} \\right) \\left( -\\dfrac{2}{R} \\right) = \\dfrac{2}{7R}$<br><br>$f = \\dfrac{7R}{2} = +3.5 R$<br><br>Since the focal length is positive, the lens acts as a convex lens of focal length $3.5 R$.<br><br>Answer: convex lens of focal length (3.5) R", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b65bf9280d7f99328d1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Two thin plano-convex lenses of the same material having $R_1, R_2$ as the radii of their curved surfaces are kept coaxially together. Their power is proportional to", "image": null}, "options": [{"id": "FC6VT", "text": "$\\mathrm{R}_1+\\mathrm{R}_2$", "image": null, "isCorrect": false}, {"id": "Ff6MX", "text": "$\\mathrm{R}_1-\\mathrm{R}_2$", "image": null, "isCorrect": false}, {"id": "kYsWM", "text": "$\\frac{\\mathrm{R}_1 \\mathrm{R}_2}{\\mathrm{R}_1+\\mathrm{R}_2}$", "image": null, "isCorrect": false}, {"id": "m7N9D", "text": "$\\frac{\\mathrm{R}_1+\\mathrm{R}_2}{\\mathrm{R}_1 \\mathrm{R}_2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For a plano-convex lens, the focal length $f$ is given by the lens maker's formula:<br><br>$\\dfrac{1}{f} = (\\mu - 1)\\left(\\dfrac{1}{R} - \\dfrac{1}{\\infty}\\right) = \\dfrac{\\mu - 1}{R}$<br><br>The power of a lens is $P = \\dfrac{1}{f}$.<br><br>For the first lens, $P_1 = \\dfrac{\\mu - 1}{R_1}$<br><br>For the second lens, $P_2 = \\dfrac{\\mu - 1}{R_2}$<br><br>When two thin lenses are kept coaxially together, the equivalent power is the sum of their individual powers:<br><br>$P = P_1 + P_2 = \\dfrac{\\mu - 1}{R_1} + \\dfrac{\\mu - 1}{R_2}$<br><br>$P = (\\mu - 1)\\left(\\dfrac{1}{R_1} + \\dfrac{1}{R_2}\\right) = (\\mu - 1)\\left(\\dfrac{R_1 + R_2}{R_1 R_2}\\right)$<br><br>Since both lenses are made of the same material, $\\mu$ is constant. Thus, the equivalent power is proportional to $\\dfrac{R_1 + R_2}{R_1 R_2}$.<br><br>Answer: $\\frac{\\mathrm{R}_1+\\mathrm{R}_2}{\\mathrm{R}_1 \\mathrm{R}_2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b56bf9280d7f9932853", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A plano convex lens fits exactly in to a plano concave lens. Their plane surfaces are parallel to each other. Lenses are made up of different materials of refractive indices ' $n_1$ ' $n_2$ ' and ' $R$ ' is the radius of curvature of the curved surface of lenses. Focal length of the combination is", "image": null}, "options": [{"id": "fKBPR", "text": "$\\frac{\\mathrm{R}}{\\mathrm{n}_1+\\mathrm{n}_2}$", "image": null, "isCorrect": false}, {"id": "qUfgq", "text": "$\\frac{2 \\mathrm{R}}{\\mathrm{n}_1-\\mathrm{n}_2}$", "image": null, "isCorrect": false}, {"id": "K6b8s", "text": "$\\frac{\\mathrm{R}}{2\\left(\\mathrm{n}_1-\\mathrm{n}_2\\right)}$", "image": null, "isCorrect": false}, {"id": "YiMPH", "text": "$\\frac{\\mathrm{R}}{\\mathrm{n}_1-\\mathrm{n}_2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For the plano-convex lens, the focal length $f_1$ is given by the lens maker's formula:<br><br>$\\dfrac{1}{f_1} = (n_1 - 1)\\left(\\dfrac{1}{R} - \\dfrac{1}{\\infty}\\right) = \\dfrac{n_1 - 1}{R}$<br><br>For the plano-concave lens, since it fits exactly into the plano-convex lens, its curved surface has the same radius of curvature $R$ but is concave in nature. Its focal length $f_2$ is given by:<br><br>$\\dfrac{1}{f_2} = (n_2 - 1)\\left(-\\dfrac{1}{R} - \\dfrac{1}{\\infty}\\right) = -\\dfrac{n_2 - 1}{R}$<br><br>When the lenses are placed in contact, the equivalent focal length $F$ of the combination is:<br><br>$\\dfrac{1}{F} = \\dfrac{1}{f_1} + \\dfrac{1}{f_2}$<br><br>$\\dfrac{1}{F} = \\dfrac{n_1 - 1}{R} - \\dfrac{n_2 - 1}{R}$<br><br>$\\dfrac{1}{F} = \\dfrac{n_1 - 1 - n_2 + 1}{R} = \\dfrac{n_1 - n_2}{R}$<br><br>$F = \\dfrac{R}{n_1 - n_2}$<br><br>Answer: $\\frac{\\mathrm{R}}{\\mathrm{n}_1-\\mathrm{n}_2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b35bf9280d7f993271e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "An achromatic convergent doublet of two lenses in contact has a power +2 D . The convex lens has power +5 D . The ratio of the dispersive powers of the convergent and divergent lenses is (in magnitude)", "image": null}, "options": [{"id": "z20WJ", "text": "$3: 5$", "image": null, "isCorrect": true}, {"id": "sFacC", "text": "$2: 5$", "image": null, "isCorrect": false}, {"id": "AqxxO", "text": "$4: 5$", "image": null, "isCorrect": false}, {"id": "sEU5s", "text": "$5: 6$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The power of the achromatic doublet is given by $P = P_1 + P_2$.<br><br>Given $P = +2\\text{ D}$ and the power of the convex (convergent) lens $P_1 = +5\\text{ D}$.<br><br>Substituting the values:<br><br>$+2 = +5 + P_2$<br><br>$P_2 = -3\\text{ D}$<br><br>For an achromatic doublet, the condition for no chromatic aberration is:<br><br>$\\dfrac{\\omega_1}{f_1} + \\dfrac{\\omega_2}{f_2} = 0$<br><br>Since power $P = \\dfrac{1}{f}$, this can be written as:<br><br>$\\omega_1 P_1 + \\omega_2 P_2 = 0$<br><br>$\\omega_1 (5) + \\omega_2 (-3) = 0$<br><br>$5 \\omega_1 = 3 \\omega_2$<br><br>$\\dfrac{\\omega_1}{\\omega_2} = \\dfrac{3}{5}$<br><br>The ratio of the dispersive powers of the convergent and divergent lenses is $3:5$.<br><br>Answer: $3: 5$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b09bf9280d7f99325d5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A convex lens of focal length $\\frac{1}{3} \\mathrm{~m}$ forms a real, inverted image twice the size of the object. The distance of the object from the lens is", "image": null}, "options": [{"id": "ebgjC", "text": "0.5 m", "image": null, "isCorrect": true}, {"id": "1pnGx", "text": "0.166 m", "image": null, "isCorrect": false}, {"id": "4cLJh", "text": "0.33 m", "image": null, "isCorrect": false}, {"id": "cjAr7", "text": "1 m", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given focal length of the convex lens, $f = +\\dfrac{1}{3}$ m.<br><br>Since the image is real, inverted, and twice the size of the object, the magnification is $m = -2$.<br><br>For a lens, magnification is given by $m = \\dfrac{v}{u}$.<br><br>$\\dfrac{v}{u} = -2 \\Rightarrow v = -2u$<br><br>Using the lens formula:<br><br>$\\dfrac{1}{f} = \\dfrac{1}{v} - \\dfrac{1}{u}$<br><br>Substituting the values of $f$ and $v$:<br><br>$\\dfrac{1}{1/3} = \\dfrac{1}{-2u} - \\dfrac{1}{u}$<br><br>$3 = \\dfrac{-1 - 2}{2u}$<br><br>$3 = \\dfrac{-3}{2u}$<br><br>$2u = -1 \\Rightarrow u = -0.5$ m<br><br>The distance of the object from the lens is $0.5$ m.<br><br>Answer: 0.5 m", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792143f0aee93fa0796df22", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "An optician makes spectacles having a combination of a convex lens of focal length 40 cm in contact with a concave lens of focal length 25 cm . The power of this combination of lenses in dioptre is", "image": null}, "options": [{"id": "z4kTM", "text": "-6.67", "image": null, "isCorrect": false}, {"id": "zk3VT", "text": "-1.5", "image": null, "isCorrect": true}, {"id": "6KWqL", "text": "+6.67", "image": null, "isCorrect": false}, {"id": "vM7ER", "text": "+1.5", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Focal length of the convex lens, $f_1 = +40 \\text{ cm} = +0.4 \\text{ m}$<br><br>Focal length of the concave lens, $f_2 = -25 \\text{ cm} = -0.25 \\text{ m}$<br><br>Power of the convex lens, $P_1 = \\dfrac{1}{f_1} = \\dfrac{1}{0.4} = +2.5 \\text{ D}$<br><br>Power of the concave lens, $P_2 = \\dfrac{1}{f_2} = \\dfrac{1}{-0.25} = -4.0 \\text{ D}$<br><br>Power of the combination of lenses is given by $P = P_1 + P_2$<br><br>$P = +2.5 - 4.0 = -1.5 \\text{ D}$<br><br>Answer: -1.5", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213cd0aee93fa0796dba4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "A convex lens of focal length 40 cm is in contact with a concave lens of focal length 25 cm . The power of combination is", "image": null}, "options": [{"id": "CMrK4", "text": "$\\quad-1.5 \\mathrm{D}$", "image": null, "isCorrect": true}, {"id": "VeVtt", "text": "-6.5 D", "image": null, "isCorrect": false}, {"id": "HN49v", "text": "$\\quad+6.5 \\mathrm{D}$", "image": null, "isCorrect": false}, {"id": "ChgM1", "text": "+1.5 D", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Focal length of the convex lens, $f_1 = +40 \\text{ cm} = +0.4 \\text{ m}$<br><br>Power of the convex lens, $P_1 = \\dfrac{1}{f_1} = \\dfrac{1}{0.4} = +2.5 \\text{ D}$<br><br>Focal length of the concave lens, $f_2 = -25 \\text{ cm} = -0.25 \\text{ m}$<br><br>Power of the concave lens, $P_2 = \\dfrac{1}{f_2} = \\dfrac{1}{-0.25} = -4.0 \\text{ D}$<br><br>Power of the combination, $P = P_1 + P_2$<br><br>$P = +2.5 \\text{ D} - 4.0 \\text{ D} = -1.5 \\text{ D}$<br><br>Answer: $\\quad-1.5 \\mathrm{D}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213a70aee93fa0796da77", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "Concave and convex lenses are placed touching each other. The ratio of magnitudes of their power is $2: 3$. The focal length of the system is 30 cm . The focal lengths of individual lens are", "image": null}, "options": [{"id": "nrgat", "text": "$5 \\mathrm{~cm},-10 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "vblnd", "text": "$10 \\mathrm{~cm},-15 \\mathrm{~cm}$", "image": null, "isCorrect": true}, {"id": "aNW0u", "text": "$10 \\mathrm{~cm},-20 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "YGOtf", "text": "$20 \\mathrm{~cm},-30 \\mathrm{~cm}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the power of the concave lens be $P_1$ and the power of the convex lens be $P_2$.<br><br>Since the focal length of the combination is positive ($F = 30 \\text{ cm}$), the net power of the system is positive. This implies that the convex lens has a greater magnitude of power than the concave lens.<br><br>Given the ratio of magnitudes of their power is $2:3$, we have:<br><br>$|P_1| : |P_2| = 2 : 3$<br><br>Let $P_1 = -2x$ and $P_2 = 3x$, where $x > 0$.<br><br>The net power of the combination is:<br><br>$P = P_1 + P_2 = -2x + 3x = x$<br><br>The focal length of the system is $F = 30 \\text{ cm} = \\dfrac{30}{100} \\text{ m}$.<br><br>The net power $P$ is given by:<br><br>$P = \\dfrac{1}{F} = \\dfrac{100}{30} = \\dfrac{10}{3} \\text{ D}$<br><br>Equating the two expressions for $P$:<br><br>$x = \\dfrac{10}{3} \\text{ D}$<br><br>Substituting the value of $x$ to find the individual powers:<br><br>$P_1 = -2 \\left(\\dfrac{10}{3}\\right) = -\\dfrac{20}{3} \\text{ D}$<br><br>$P_2 = 3 \\left(\\dfrac{10}{3}\\right) = 10 \\text{ D}$<br><br>The focal lengths of the individual lenses are:<br><br>$f_1 = \\dfrac{100}{P_1} = \\dfrac{100}{-\\dfrac{20}{3}} = -15 \\text{ cm}$<br><br>$f_2 = \\dfrac{100}{P_2} = \\dfrac{100}{10} = 10 \\text{ cm}$<br><br>The focal lengths of the individual lenses are $10 \\text{ cm}$ and $-15 \\text{ cm}$.<br><br>Answer: $10 \\mathrm{~cm},-15 \\mathrm{~cm}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213970aee93fa0796d9fa", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "A point object kept at P in front of a transparent sphere of radius 'R' has its image formed by the first refracting surface at Q such that PO = QO. The refractive index of the material of the sphere is 3. The distance PO is equal to<br><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/m3OU6m0HmgZZCIxCMGjUS6ftDkLd7h4ciJx88s8Ob_I.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "Cr9zz", "text": "$\\dfrac{\\mathrm{R}}{2}$", "image": null, "isCorrect": false}, {"id": "zPz7V", "text": "5 R", "image": null, "isCorrect": false}, {"id": "prfYj", "text": "6 R", "image": null, "isCorrect": false}, {"id": "OrCPJ", "text": "2R", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For refraction at a single spherical surface, the formula is given by:<br><br>$\\dfrac{\\mu_2}{v} - \\dfrac{\\mu_1}{u} = \\dfrac{\\mu_2 - \\mu_1}{R}$<br><br>Applying the Cartesian sign convention:<br>Object distance, $u = -PO$<br>Image distance, $v = +OQ = +PO$ (since it is given that $PO = QO$)<br>Radius of curvature of the first surface, $R = +R$<br>Refractive index of the surrounding medium (air), $\\mu_1 = 1$<br>Refractive index of the sphere, $\\mu_2 = 3$<br><br>Substituting these values into the formula, we get:<br><br>$\\dfrac{3}{PO} - \\dfrac{1}{-PO} = \\dfrac{3 - 1}{R}$<br><br>$\\dfrac{3}{PO} + \\dfrac{1}{PO} = \\dfrac{2}{R}$<br><br>$\\dfrac{4}{PO} = \\dfrac{2}{R}$<br><br>$PO = 2R$<br><br>Answer: 2R", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213800aee93fa0796d949", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "A convex lens of refractive index $\\dfrac{3}{2}$ has a power 2.5. If it is placed in a liquid of refractive index 2 , the new power of the lens is", "image": null}, "options": [{"id": "WtmFS", "text": "2.5 D", "image": null, "isCorrect": false}, {"id": "ia1ls", "text": "$\\quad-2.5 \\mathrm{D}$", "image": null, "isCorrect": false}, {"id": "6O74s", "text": "1.25 D", "image": null, "isCorrect": false}, {"id": "rXvrY", "text": "-1.25 D", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The power of a lens in air is given by the Lens Maker's formula:<br><br>$P_a = \\dfrac{1}{f_a} = \\left( \\mu_g - 1 \\right) \\left( \\dfrac{1}{R_1} - \\dfrac{1}{R_2} \\right)$<br><br>Given $P_a = 2.5 \\mathrm{D}$ and $\\mu_g = \\dfrac{3}{2}$:<br><br>$2.5 = \\left( \\dfrac{3}{2} - 1 \\right) \\left( \\dfrac{1}{R_1} - \\dfrac{1}{R_2} \\right)$<br><br>$2.5 = \\dfrac{1}{2} \\left( \\dfrac{1}{R_1} - \\dfrac{1}{R_2} \\right)$<br><br>$\\left( \\dfrac{1}{R_1} - \\dfrac{1}{R_2} \\right) = 5$<br><br>When the lens is placed in a liquid of refractive index $\\mu_l = 2$, its new power $P_l$ is given by:<br><br>$P_l = \\dfrac{1}{f_l} = \\left( \\dfrac{\\mu_g}{\\mu_l} - 1 \\right) \\left( \\dfrac{1}{R_1} - \\dfrac{1}{R_2} \\right)$<br><br>Substituting the known values:<br><br>$P_l = \\left( \\dfrac{1.5}{2} - 1 \\right) \\times 5$<br><br>$P_l = \\left( \\dfrac{3}{4} - 1 \\right) \\times 5$<br><br>$P_l = -\\dfrac{1}{4} \\times 5 = -1.25 \\mathrm{D}$<br><br>Answer: -1.25 D", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792135d0aee93fa0796d83a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "A convex lens of focal length ' $f$ ' produces a real image whose size is ' $n$ ' times the size of an object. The distance of the object from the lens is", "image": null}, "options": [{"id": "9Iyfk", "text": "$\\dfrac{\\mathrm{n}+1}{\\mathrm{nf}}$", "image": null, "isCorrect": false}, {"id": "IOjsJ", "text": "$\\mathrm{f}\\left(1-\\dfrac{1}{\\mathrm{n}}\\right)$", "image": null, "isCorrect": false}, {"id": "AMX4g", "text": "$\\dfrac{\\mathrm{nf}}{\\mathrm{n}+1}$", "image": null, "isCorrect": false}, {"id": "WQY83", "text": "$\\mathrm{f}\\left(1+\\dfrac{1}{\\mathrm{n}}\\right)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For a real image produced by a convex lens, the magnification is $m = -n$.<br><br>The magnification formula in terms of focal length $f$ and object coordinate $u$ is given by:<br><br>$m = \\dfrac{f}{f+u}$<br><br>Substituting $m = -n$:<br><br>$-n = \\dfrac{f}{f+u}$<br><br>$-nf - nu = f$<br><br>$-nu = f(n+1)$<br><br>$u = -f\\left(\\dfrac{n+1}{n}\\right) = -f\\left(1+\\dfrac{1}{n}\\right)$<br><br>The distance of the object from the lens is the magnitude of $u$:<br><br>$|u| = f\\left(1+\\dfrac{1}{n}\\right)$<br><br>Answer: $\\mathrm{f}\\left(1
