br>$\\mu = \\dfrac{\\sin\\left(30^{\\circ} + \\dfrac{\\delta_m}{2}\\right)}{\\dfrac{1}{2}}$<br><br>$\\mu = 2 \\sin\\left(30^{\\circ} + \\dfrac{\\delta_m}{2}\\right)$<br><br>Answer: $2 \\sin \\left(30+\\frac{\\delta m}{2}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ba0aee93fa0796db0d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "A ray of light is incident on a medium of refractive index ' $\\mu$ ' at an angle of incidence ' $i$ ': On refraction in the medium ' $\\delta$ ' is the angle of deviation. Then", "image": null}, "options": [{"id": "e1prb", "text": "$\\dfrac{1}{\\mu}=\\cos \\delta-\\dfrac{\\sin \\delta}{\\tan i}$", "image": null, "isCorrect": true}, {"id": "dDW4Y", "text": "$\\dfrac{1}{\\mu}=\\sin \\delta-\\dfrac{\\cos \\delta}{\\tan i}$", "image": null, "isCorrect": false}, {"id": "eQe0q", "text": "$\\dfrac{1}{\\mu}=\\cos \\delta-\\sin \\delta \\cdot \\tan i$", "image": null, "isCorrect": false}, {"id": "58ofO", "text": "$\\dfrac{1}{\\mu}=\\sin \\delta-\\cos \\delta \\cdot \\tan i$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "By Snell's law, we have $\\sin i = \\mu \\sin r$, which gives $\\dfrac{1}{\\mu} = \\dfrac{\\sin r}{\\sin i}$.<br><br>The angle of deviation is $\\delta = i - r$, which implies $r = i - \\delta$.<br><br>Substituting this into the expression for $\\dfrac{1}{\\mu}$:<br><br>$\\dfrac{1}{\\mu} = \\dfrac{\\sin(i - \\delta)}{\\sin i}$<br><br>Expanding the numerator using the identity $\\sin(A - B) = \\sin A \\cos B - \\cos A \\sin B$:<br><br>$\\dfrac{1}{\\mu} = \\dfrac{\\sin i \\cos \\delta - \\cos i \\sin \\delta}{\\sin i}$<br><br>Dividing each term by $\\sin i$:<br><br>$\\dfrac{1}{\\mu} = \\cos \\delta - \\cot i \\sin \\delta$<br><br>$\\dfrac{1}{\\mu} = \\cos \\delta - \\dfrac{\\sin \\delta}{\\tan i}$<br><br>Answer: $\\dfrac{1}{\\mu}=\\cos \\delta-\\dfrac{\\sin \\delta}{\\tan i}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792136d0aee93fa0796d8b3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "In an equilateral prism the ray undergoes minimum deviation when it is incident at an angle of $50^{\\circ}$. The angle of minimum deviation is", "image": null}, "options": [{"id": "34prY", "text": "$50^{\\circ}$", "image": null, "isCorrect": false}, {"id": "4R3Pq", "text": "$40^{\\circ}$", "image": null, "isCorrect": true}, {"id": "FjZ9r", "text": "$25^{\\circ}$", "image": null, "isCorrect": false}, {"id": "o0m6a", "text": "$20^{\\circ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For an equilateral prism, the angle of the prism is $A = 60^{\\circ}$.<br><br>At the position of minimum deviation, the angle of incidence $i$ is equal to the angle of emergence $e$.<br><br>The relation between the angle of deviation $\\delta$, angle of incidence $i$, angle of emergence $e$, and angle of prism $A$ is given by:<br><br>$\\delta = i + e - A$<br><br>For minimum deviation, $\\delta = \\delta_m$ and $i = e$. Thus,<br><br>$\\delta_m = 2i - A$<br><br>Given that the angle of incidence $i = 50^{\\circ}$, substituting the values we get:<br><br>$\\delta_m = 2(50^{\\circ}) - 60^{\\circ}$<br><br>$\\delta_m = 100^{\\circ} - 60^{\\circ} = 40^{\\circ}$<br><br>Answer: $40^{\\circ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213490aee93fa0796d798", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "A ray of light is incident at $60^{\\circ}$ on one face of a prism of angle $30^{\\circ}$ and the emergent ray makes $30^{\\circ}$ with the incident ray. The refractive index of the prism is $\\left(\\sin 30^{\\circ}=0 \\cdot 5, \\sin 60^{\\circ}=\\sqrt{3} / 2\\right)$", "image": null}, "options": [{"id": "SHvT6", "text": "1.732", "image": null, "isCorrect": true}, {"id": "ky7DZ", "text": "1.414", "image": null, "isCorrect": false}, {"id": "XLo4s", "text": "1.5", "image": null, "isCorrect": false}, {"id": "ta4VR", "text": "1.33", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given angle of incidence $i = 60^{\\circ}$<br><br>Angle of prism $A = 30^{\\circ}$<br><br>Angle of deviation $\\delta = 30^{\\circ}$<br><br>Using the relation for a prism, $\\delta = i + e - A$<br><br>$30^{\\circ} = 60^{\\circ} + e - 30^{\\circ}$<br><br>$e = 0^{\\circ}$<br><br>Since the angle of emergence is zero, the ray emerges normally from the second face, which means $r_2 = 0^{\\circ}$.<br><br>Using the relation $r_1 + r_2 = A$<br><br>$r_1 + 0^{\\circ} = 30^{\\circ}$<br><br>$r_1 = 30^{\\circ}$<br><br>Applying Snell's law at the first face:<br><br>$\\mu = \\dfrac{\\sin i}{\\sin r_1} = \\dfrac{\\sin 60^{\\circ}}{\\sin 30^{\\circ}}$<br><br>$\\mu = \\dfrac{\\sqrt{3}/2}{1/2} = \\sqrt{3} = 1.732$<br><br>Answer: 1.732", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262530279619d9d8a339d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "A ray of light passes through an equilateral prism such that the angle of incidence (i) is equal to angle of emergence (e). The angle of emergence is equal to $\\left(\\frac{3}{4}\\right)^{\\text {th }}$ the angle of prism. The angle of deviation is", "image": null}, "options": [{"id": "2oYa2", "text": "$20^{\\circ}$", "image": null, "isCorrect": false}, {"id": "JbYeH", "text": "$30^{\\circ}$", "image": null, "isCorrect": true}, {"id": "GRXOy", "text": "$39^{\\circ}$", "image": null, "isCorrect": false}, {"id": "caGnf", "text": "$45^{\\circ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\therefore \\quad \\mathrm{i}=\\mathrm{e}=60^{\\circ} \\times \\frac{3}{4}=45^{\\circ} \\quad \\ldots(\\because$ prism is equilateral $)$\nAngle of Deviation: $\\delta=\\mathrm{i}+\\mathrm{e}-\\mathrm{A}$ $\\delta=45^{\\circ}+45^{\\circ}-60^{\\circ}=30^{\\circ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262450279619d9d8a332a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "Array of light is incident at an angle of incidence ' $i$ ' on one surface of a prism of small angle $\\mathrm{A}$ and emerges normally from the other surface. If the refractive index of the material of the prism is ' $\\mu$ ', then the angle of incidence is equal to", "image": null}, "options": [{"id": "zg35c", "text": "$\\frac{\\mathrm{A}}{2 \\mu}$", "image": null, "isCorrect": false}, {"id": "0Xbdi", "text": "$\\frac{\\mathrm{A} \\mu}{2}$", "image": null, "isCorrect": false}, {"id": "UM7ee", "text": "$\\mathrm{A} \\mu$", "image": null, "isCorrect": true}, {"id": "TmSrP", "text": "$\\frac{\\mathrm{A}}{\\mu}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given: $\\mathrm{e}=0$\n$$\n\\therefore \\quad r_2=0, A=r_1\n$$\nSince ' $\\mathrm{i}$ ' is small, Snell's law of refraction can be modified to,\n$$\n\\begin{aligned}\n& \\mu=\\frac{i}{r_1} \\\\\n\\therefore \\quad & i=\\mu r_1=\\mu A\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2622d0279619d9d8a3266", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "A glass prism deviates the red and violet rays through $9^{\\circ}$ and $11^{\\circ}$ respectively. A second prism of equal angle deviates them through $11^{\\circ}$ and $13^{\\circ}$ respectively. The ratio of dispersive power of second nrism to first prism is", "image": null}, "options": [{"id": "GfRj7", "text": "$5: 6$", "image": null, "isCorrect": true}, {"id": "rgF88", "text": "$6: 5$", "image": null, "isCorrect": false}, {"id": "VcFQl", "text": "$9: 13$", "image": null, "isCorrect": false}, {"id": "wgMBC", "text": "$13: 9$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\therefore \\quad$ Dispersive Power of Prism:\n$$\n\\begin{aligned}\n& \\omega=\\frac{\\delta_v-\\delta_r}{\\delta_y} \\\\\n& \\delta_y=\\frac{\\delta_v+\\delta_r}{2}=\\frac{11+9}{2}\n\\end{aligned}\n$$\n$\\therefore \\quad$ For first Prism,\n$$\n\\begin{aligned}\n\\omega_1 & =\\frac{2(11-9)}{11+9} \\\\\n& =\\frac{1}{5}\n\\end{aligned}\n$$\n\nFor Second Prism:\n$$\n\\begin{aligned}\n\\omega_2 & =\\frac{2(13-11)}{13+11} \\\\\n& =\\frac{1}{6}\n\\end{aligned}\n$$\n\nRatio:\n$$\n\\frac{\\omega_2}{\\omega_1}=\\frac{\\frac{1}{6}}{\\frac{1}{5}}=\\frac{5}{6}\n$$\n$\\therefore \\quad$ The ratio is $5: 6$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261f90279619d9d8a30cb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "The prism has refracting angle ' $\\mathrm{A}$ '. The second refracting surface of the prism is silvered. Light ray falling on first refracting surface with angle of incidence ' $2 \\mathrm{~A}$ ', reaches the second surface and returns back through the same path due to reflection at the silvered surface. The refractive index of the material of the prism is", "image": null}, "options": [{"id": "8jWiy", "text": "$\\frac{1}{2} \\sin \\mathrm{A}$", "image": null, "isCorrect": false}, {"id": "VbzNk", "text": "$\\frac{1}{2} \\cos \\mathrm{A}$", "image": null, "isCorrect": false}, {"id": "W657n", "text": "$2 \\sin A$", "image": null, "isCorrect": false}, {"id": "d4E3q", "text": "$2 \\cos A$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Normal incidence at silvered surface\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/znf2whKq2sisj2zuIbVj8s3FeIdCuV-NaqhqBR54z9s.original.fullsize.png\"><br>\n$\\therefore \\quad \\mu=\\frac{\\sin \\mathrm{i}}{\\sin \\mathrm{r}}=\\frac{\\sin 2 \\mathrm{~A}}{\\sin \\mathrm{A}}=\\frac{2 \\sin \\mathrm{A} \\cos \\mathrm{A}}{\\sin \\mathrm{A}}=2 \\cos \\mathrm{A}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261d00279619d9d8a2f8d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "Which of the following is NOT involved in the formation of secondary rainbow?", "image": null}, "options": [{"id": "y9Zqd", "text": "Refraction", "image": null, "isCorrect": false}, {"id": "BVYTu", "text": "Angular dispersion", "image": null, "isCorrect": false}, {"id": "yIX6c", "text": "Interference", "image": null, "isCorrect": true}, {"id": "knlj3", "text": "Total internal reflection", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Std. $11 \\mid$ Ch- 9 | Subtopic-9.9", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261030279619d9d8a291b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "The refracting angle of a glass prism is $30^{\\circ}$. A ray is incident on one of the faces and is perpendicular to it. The angle of deviation $\\delta$ between the incident ray and that leaves the prism is\n(Refractive index of glass $=1.5)\\left(\\sin \\left(30^{\\circ}\\right)=0.5, \\sin (48.6)=0.75\\right)$", "image": null}, "options": [{"id": "QCv8W", "text": "$17^{\\circ}$", "image": null, "isCorrect": false}, {"id": "nlXta", "text": "$12.6^{\\circ}$", "image": null, "isCorrect": false}, {"id": "QHfWy", "text": "$16^{\\circ}$", "image": null, "isCorrect": false}, {"id": "p6xcB", "text": "$18.6^{\\circ}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given, $A=30^{\\circ}, \\mu=1.5$ and $i_1=0^{\\circ}$\nSince, $i_0$, therefore, $r_1$ is also equal to $0^{\\circ}$\nFurther, since, $r_1+r_2=A$\n$\\therefore r_2=A=30^{\\circ}$\nUsing Snell's Law, $\\mu=\\frac{\\sin i_2}{\\sin r_2}$\n$\\Rightarrow 1.5=\\frac{\\sin i_2}{\\sin 30^{\\circ}}$\nor $i_2=1.5 \\sin 30^{\\circ}=1.5 \\times \\frac{1}{2}=0.75$\nor $i_2=1.5 \\sin 30^{\\circ}=1.5 \\times \\frac{1}{2}=0.75$\nNow, the deviation,\n$\\delta=\\left(i_1+i_2\\right)-A=(0+48.6)-30=18.6^{\\circ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260f10279619d9d8a2889", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}], "question": {"text": "The refractive index of material of glass is $\\sqrt{3}$. If the angle of minimum deviation is equal to the angle of prism, the angle of prism is\n$\\left(\\cos 30^{\\circ}=\\frac{\\sqrt{3}}{2}=\\sin 60^{\\circ}, \\sin 30^{\\circ}=\\frac{1}{2}=\\cos 60^{\\circ}\\right)$", "image": null}, "options": [{"id": "urHyX", "text": "$45^{\\circ}$", "image": null, "isCorrect": false}, {"id": "kOEjt", "text": "$60^{\\circ}$", "image": null, "isCorrect": true}, {"id": "gW0nR", "text": "$30^{\\circ}$", "image": null, "isCorrect": false}, {"id": "SMlVz", "text": "$50^{\\circ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, $\\mu=\\sqrt{3}$ and $\\frac{\\sin \\left(60^{\\circ}\\right)}{\\sin \\left(30^{\\circ}\\right)}=\\sqrt{3}$\nWhen light passes through a prism of refracting angle A, it suffers minimum deviation $\\delta$ given by\n$\\mu=\\frac{\\sin \\left(\\frac{\\mathrm{A}+\\delta}{2}\\right)}{\\sin \\left(\\frac{\\mathrm{A}}{2}\\right)} \\Rightarrow \\sqrt{3}=\\frac{\\sin \\left(\\frac{\\mathrm{A}+\\delta}{2}\\right)}{\\sin \\left(\\frac{\\mathrm{A}}{2}\\right)}$\n$\\therefore \\frac{\\mathrm{A}}{2}=30^{\\circ}$ and $\\frac{\\mathrm{A}+\\delta}{2}=60^{\\circ}$ are the solutions\n$\\therefore A=60^{\\circ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260c90279619d9d8a274c", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "A ray of light is incident on one face of an equilateral glass prism having refractive index $\\sqrt{2}$. It produces the emergent ray which just grazes along the adjacent face. The value of angle of incidence is", "image": null}, "options": [{"id": "rYOpW", "text": "$\\sin ^{-1}\\left(\\frac{1}{\\sqrt{2}} \\sin 15^{\\circ}\\right)$", "image": null, "isCorrect": false}, {"id": "Flclt", "text": "$\\sin ^{-1}\\left(\\sqrt{2} \\sin 30^{\\circ}\\right)$", "image": null, "isCorrect": false}, {"id": "HUOj8", "text": "$\\sin ^{-1}\\left(\\frac{1}{\\sqrt{2}} \\sin 45^{\\circ}\\right)$", "image": null, "isCorrect": false}, {"id": "aEpXk", "text": "$\\sin ^{-1}\\left(\\sqrt{2} \\sin 15^{\\circ}\\right)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The emergent ray just grazes the second face.\nHence angle of emergence, $\\mathrm{e}=90^{\\circ}$\n$\\begin{aligned} & \\mu=\\frac{\\sin \\mathrm{e}}{\\sin r_2}=\\frac{\\sin 90^{\\circ}}{\\sin r_2}=\\frac{1}{\\sin r_2} \\\\ & \\therefore \\frac{1}{\\sin r_2}=\\sqrt{2} \\text { or } \\sin r_2=\\frac{1}{\\sqrt{2}}\\end{aligned}$\n$\\begin{aligned} & \\therefore \\mathrm{r}_2=45^{\\circ} ; \\mathrm{A}=\\mathrm{r}_1+\\mathrm{r}_2 \\\\ & \\therefore \\mathrm{r}_1=\\mathrm{A}-\\mathrm{r}_2=60-45=15^{\\circ}\\end{aligned}$\nAlso, $\\frac{\\sin i}{\\sin r_1}=\\mu$\n$\\begin{aligned} & \\therefore \\sin \\mathrm{i}=\\mu \\sin \\mathrm{r}_1=\\sqrt{2} \\sin 15^{\\circ} \\\\ & \\therefore \\mathrm{i}=\\sin ^{-1}\\left(\\sqrt{2} \\sin 15^{\\circ}\\right)\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260480279619d9d8a233b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "A ray of light is incident at an angle ' $\\mathrm{i}$ ' on one face of thin prism. The ray emerges normally from the other face. Refractive index of the glass prism is ' $n$ ' and angle of prism is ' $A$ '. The value of ' $i$ ' is", "image": null}, "options": [{"id": "fQfmA", "text": "An", "image": null, "isCorrect": true}, {"id": "m2DmL", "text": "$\\mathrm{An}^2$", "image": null, "isCorrect": false}, {"id": "MtCtu", "text": "$\\frac{\\mathrm{A}}{\\mathrm{n}}$", "image": null, "isCorrect": false}, {"id": "s9B5w", "text": "$\\frac{\\mathrm{A}}{\\mathrm{n}^2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/ztvRPJw8CTI3rsi1csb2gWJ4vrbIWYLR00aLJ5tiWaI.original.fullsize.png\"><br>\nFrom the figure, $A=r$\n$$\n\\mathrm{n}=\\frac{\\sin \\mathrm{i}}{\\sin \\mathrm{r}}=\\frac{\\sin \\mathrm{i}}{\\sin \\mathrm{A}}\n$$\nFor small angles, $\\mathrm{n}=\\frac{\\mathrm{i}}{\\mathrm{A}}$\n$$\n\\therefore \\mathrm{i}=\\mathrm{An}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25feb0279619d9d8a2048", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "A ray of light is incident at an angle 'i' on one face of a thin angled prism. The ray emerges normally from the other face. Refractive index of the glass prism is 'n' and\nangle of prism is ' $A^{\\prime}$. The value of ' $\\mathrm{i}^{\\prime}$ is", "image": null}, "options": [{"id": "YeVaR", "text": "$\\mathrm{An}^{2}$", "image": null, "isCorrect": false}, {"id": "r9kNX", "text": "$\\mathrm{~A}^{2} \\mathrm{n}$", "image": null, "isCorrect": false}, {"id": "2I6HB", "text": "$\\mathrm{An}$", "image": null, "isCorrect": true}, {"id": "lYVeE", "text": "$\\frac{1}{\\mathrm{An}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(A)\nFor a prism $\\quad \\mathrm{A}=\\mathrm{r}_{1}+\\mathrm{r}_{2}$\nhere $\\quad r_{2}=0 \\quad \\therefore \\quad A=r_{1}$\nRefractive index $\\mathrm{n}=\\frac{\\sin \\mathrm{i}}{\\sin \\mathrm{r}_{1}}=\\frac{\\mathrm{i}}{\\mathrm{r}_{1}}=\\frac{\\mathrm{i}}{\\mathrm{A}}$\n$\\therefore \\mathrm{i}=\\mathrm{An}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fdb0279619d9d8a1fcb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "A prism having refractive index $\\sqrt{2}$ and refracting angle $30^{\\circ}$ has one of the\nrefracting surfaces silvered. The beam of light incident on the other refracting\nsurface will retrace its path, if angle of incidence is $\\left[\\sin \\frac{\\pi}{6}=0 \\cdot 5\\right]$", "image": null}, "options": [{"id": "4FMU7", "text": "$\\sin ^{-1}\\left(\\frac{3}{4}\\right)$", "image": null, "isCorrect": false}, {"id": "mxw56", "text": "$\\sin ^{-1}\\left(\\frac{1}{2}\\right)$", "image": null, "isCorrect": false}, {"id": "xCKxh", "text": "$\\sin ^{-1}\\left(\\frac{\\sqrt{3}}{2}\\right)$", "image": null, "isCorrect": false}, {"id": "Bs3eh", "text": "$\\sin ^{-1}\\left(\\frac{1}{\\sqrt{2}}\\right)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "(D)\n$A=r_{1}+r_{2}$ but $r_{2}=0$ since is incident normally on the second surface.\n$\\therefore \\mathrm{r}_{1}=\\mathrm{A}=30^{\\circ}$\n$n=\\frac{\\sin i}{\\sin r}$\n$\\therefore \\sqrt{2}=\\frac{\\sin \\mathrm{i}}{\\sin 30^{\\circ}}$\n$\\therefore \\sin \\mathrm{i}=\\sqrt{2} \\sin 30^{\\circ}=\\sqrt{2} \\times \\frac{1}{2}=\\frac{1}{\\sqrt{2}}$\n$\\therefore \\mathrm{i}=\\sin ^{-1}\\left(\\frac{1}{\\sqrt{2}}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fb30279619d9d8a1e8e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "A ray of light is incident at an angle ' $\\mathrm{i}$ ' on one face of prism of small angle 'A' and emerges normally from the other surface. ' $\\mu$ ' is the refractive index of the material of the prism. The angle of incidence is", "image": null}, "options": [{"id": "fm8xN", "text": "$A \\mu$", "image": null, "isCorrect": true}, {"id": "3p9Mm", "text": "$\\frac{A}{2 \\mu}$", "image": null, "isCorrect": false}, {"id": "8FTvP", "text": "$\\frac{A \\mu}{2}$", "image": null, "isCorrect": false}, {"id": "LGGc1", "text": "$\\mu$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For small angled prism $\\delta_{m}=(\\mu-1) A$\nAgain $\\quad i+e=A+\\delta_{m}=\\mu A-A$\nHere $\\quad e=0 \\quad \\therefore i=A+\\delta_{m}=A+\\mu A-A=\\mu A$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f9f0279619d9d8a1df2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "A ray of light passes through equilateral prism such that the angle of incidence is equal to angle of emergence and each of these angles is equal to $\\left(\\frac{3}{4}\\right)^{\\mathrm{th}}$ the angle of prism. The angle of deviation is", "image": null}, "options": [{"id": "r8zS9", "text": "$35^{\\circ}$", "image": null, "isCorrect": false}, {"id": "ahgJx", "text": "$40^{\\circ}$", "image": null, "isCorrect": false}, {"id": "2SGw2", "text": "$20^{\\circ}$", "image": null, "isCorrect": false}, {"id": "tu9ZH", "text": "$30^{\\circ}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "No Solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f7a0279619d9d8a1ccf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}], "question": {"text": "A ray of light is incident at an angle of incidence 'i' on one surface of a thin prism of\nsmall angle 'A'. The ray emerges normally from the opposite surface. If the refractive\nindex of the material of the prism is ' $\\mu$ ', the angle of incidence 'i' is nearly equal to", "image": null}, "options": [{"id": "IcRPJ", "text": "$\\underline{A}$", "image": null, "isCorrect": false}, {"id": "LoDrr", "text": "$\\frac{\\mu A}{2}$", "image": null, "isCorrect": false}, {"id": "aX6FN", "text": "$\\mu A$", "image": null, "isCorrect": true}, {"id": "fW10F", "text": "$\\frac{A}{2 \\mu}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mu=\\frac{\\sin \\mathrm{i}}{\\sin \\mathrm{r}}=\\frac{\\mathrm{i}}{\\mathrm{r}_{1}} \\quad$ if angles are small.\n$A=r_{1}+r_{2}=r_{1}$\nsince $r_{2}=0$ since the ray emerges normally.\n$\\therefore \\mu=\\frac{i}{A} \\quad$ or $\\quad i=\\mu A$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f1e0279619d9d8a19eb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}], "question": {"text": "A thin prism $\\mathrm{P}_{1}$ with angle $4^{\\circ}$ and made from glass of refractive index $1 \\cdot 54$ is\ncombined with another thin prism $\\mathrm{P}_{2}$ made from glass of refractive index $1 \\cdot 72$ to\nproduce dispersion without deviation. The angle of prism for $\\mathrm{P}_{2}$ is", "image": null}, "options": [{"id": "9KvbO", "text": "$4^{\\circ}$", "image": null, "isCorrect": false}, {"id": "LI3b1", "text": "$5 \\cdot 33^{\\circ}$", "image": null, "isCorrect": false}, {"id": "ToMRu", "text": "$2 \\cdot 6^{\\circ}$", "image": null, "isCorrect": false}, {"id": "bFDnD", "text": "$3^{\\circ}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For thin prism the angle of deviation $\\delta=\\mathrm{A}(\\mathrm{n}-1)$\n$\\therefore \\delta_{1}=\\delta_{2} \\quad$ for no deviation\n$\\therefore A_{1}\\left(n_{1}-1\\right)=A_{2}\\left(n_{2}-1\\right)$\n$4(1.54-1)=\\mathrm{A}_{2}(1.72-1)$\n$\\therefore 4 \\times 0.54=\\mathrm{A}_{2} \\times 0.72$\n$\\mathrm{A}_{2}=\\frac{4 \\times 0.54}{0.72}=3^{\\circ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 8, "topicId": "65a263240279619d9d8a3c58", "title": "Optical Instruments", "totalQuestions": 35, "questions": [{"_id": "6abb889c15a9fc0fc8c14552", "type": "singleCorrect", "question": {"text": "An observer looks at a distant tree of height $10$ m with a telescope of magnifying power of $20$. To the observer, the tree appears", "image": null}, "options": [{"id": "aJh6o", "label": "A", "text": "$10$ times taller.", "isCorrect": false, "image": null}, {"id": "lC37v", "label": "B", "text": "$10$ times nearer.", "isCorrect": false, "image": null}, {"id": "bCKXK", "label": "C", "text": "$20$ times nearer.", "isCorrect": true, "image": null}, {"id": "1OLsO", "label": "D", "text": "$20$ times taller.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The magnifying power of a telescope is defined as the ratio of the angle subtended by the image at the eye to the angle subtended by the object at the unaided eye.<br><br>$m = \\dfrac{\\beta}{\\alpha} = 20$<br><br>This means the angle subtended by the image is $20$ times the angle subtended by the actual object. For a distant object, the angular size is inversely proportional to its distance from the observer ($\\theta \\approx \\dfrac{h}{d}$). <br><br>Since the telescope increases the angular size by a factor of $20$ without changing the actual linear height of the tree, the brain interprets this increased angular size as the object being at $\\dfrac{1}{20}$th of its original distance. <br><br>Therefore, the tree appears $20$ times nearer to the observer.<br><br>Answer: $20$ times nearer.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c28c30a4553e1bdc7c", "type": "singleCorrect", "question": {"text": "In telescopes for a given wavelength, the objectives with large aperture are used for", "image": null}, "options": [{"id": "I506g", "label": "A", "text": "greater resolution.", "isCorrect": true, "image": null}, {"id": "GnH0b", "label": "B", "text": "reducing lens aberration.", "isCorrect": false, "image": null}, {"id": "5IKxu", "label": "C", "text": "greater magnification.", "isCorrect": false, "image": null}, {"id": "jowMg", "label": "D", "text": "ease of manufacture.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The resolving power of a telescope is given by the formula $\\dfrac{D}{1.22 \\lambda}$, where $D$ is the diameter of the objective lens (aperture) and $\\lambda$ is the wavelength of the light.<br><br>For a given wavelength $\\lambda$, the resolving power is directly proportional to the aperture $D$.<br><br>Therefore, objectives with a large aperture are used to achieve greater resolution.<br><br>Answer: greater resolution.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d32f8c30a4553e1be114", "type": "singleCorrect", "question": {"text": "A simple microscope is used to see the object first in blue light and then in red light. Due to the change from blue to red light, what is the effect on its magnifying power?", "image": null}, "options": [{"id": "yVmed", "label": "A", "text": "decreases", "isCorrect": true, "image": null}, {"id": "aS99h", "label": "B", "text": "increases", "isCorrect": false, "image": null}, {"id": "WAt0O", "label": "C", "text": "remains constant", "isCorrect": false, "image": null}, {"id": "sscL5", "label": "D", "text": "first increase and then decreases", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The magnifying power of a simple microscope is given by $M = 1 + \\dfrac{D}{f}$ or $M = \\dfrac{D}{f}$.<br><br>The focal length of a lens is related to the refractive index by the lens maker's formula: $\\dfrac{1}{f} = (\\mu - 1)\\left(\\dfrac{1}{R_1} - \\dfrac{1}{R_2}\\right)$.<br><br>According to Cauchy's relation, the refractive index decreases with an increase in wavelength: $\\mu = A + \\dfrac{B}{\\lambda^2}$.<br><br>Since the wavelength of red light is greater than that of blue light ($\\lambda_{\\text{red}} > \\lambda_{\\text{blue}}$), the refractive index for red light is less than that for blue light ($\\mu_{\\text{red}} < \\mu_{\\text{blue}}$).<br><br>Consequently, the focal length of the lens is greater for red light ($f_{\\text{red}} > f_{\\text{blue}}$).<br><br>Since magnifying power is inversely proportional to focal length, the magnifying power decreases when the light is changed from blue to red ($M_{\\text{red}} < M_{\\text{blue}}$).<br><br>Answer: decreases", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b18c30a4553e1bdbd0", "type": "singleCorrect", "question": {"text": "For large magnifying power of a telescope", "image": null}, "options": [{"id": "U6Twb", "label": "A", "text": "object must be large", "isCorrect": false, "image": null}, {"id": "FfyzK", "label": "B", "text": "focal length of objective is large", "isCorrect": true, "image": null}, {"id": "3ixfp", "label": "C", "text": "focal length of eyepiece is large", "isCorrect": false, "image": null}, {"id": "W4Mk6", "label": "D", "text": "focal length of objective and eyepiece must be large", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The magnifying power of an astronomical telescope in normal adjustment is given by $M = \\dfrac{f_o}{f_e}$, where $f_o$ is the focal length of the objective lens and $f_e$ is the focal length of the eyepiece.<br><br>For a large magnifying power, the focal length of the objective ($f_o$) must be large and the focal length of the eyepiece ($f_e$) must be small.<br><br>Answer: focal length of objective is large", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf9bf9280d7f9932e29", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Resolving power of a telescope can be increased by increasing", "image": null}, "options": [{"id": "echBj", "text": "the diameter of eyepiece.", "image": null, "isCorrect": false}, {"id": "6U8HM", "text": "the wavelength of light.", "image": null, "isCorrect": false}, {"id": "2fQGA", "text": "the focal length of eye-piece.", "image": null, "isCorrect": false}, {"id": "LjedO", "text": "the diameter of the objective.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The resolving power of a telescope is given by the formula:<br><br>$\\text{Resolving Power} = \\dfrac{D}{1.22 \\lambda}$<br><br>where $D$ is the diameter of the objective lens and $\\lambda$ is the wavelength of light used.<br><br>From the formula, the resolving power is directly proportional to the diameter of the objective lens ($D$) and inversely proportional to the wavelength of light ($\\lambda$).<br><br>Therefore, the resolving power can be increased by increasing the diameter of the objective.<br><br>Answer: the diameter of the objective.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b23bf9280d7f993269a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The length of the compound microscope is 15 cm . The magnifying power for relaxed eye is 25 . If the focal length of eye lens is 6 cm then the object distance for objective lens will be", "image": null}, "options": [{"id": "e2eNh", "text": "1.3 cm", "image": null, "isCorrect": false}, {"id": "l8UnD", "text": "1.5 cm", "image": null, "isCorrect": true}, {"id": "wIHSY", "text": "1.7 cm", "image": null, "isCorrect": false}, {"id": "ksMN4", "text": "1.9 cm", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a compound microscope in normal adjustment (relaxed eye), the length of the microscope tube is given by:<br><br>$L = v_o + f_e$<br><br>Substituting the given values $L = 15$ cm and $f_e = 6$ cm:<br><br>$15 = v_o + 6$<br><br>$v_o = 9$ cm<br><br>The magnifying power of a compound microscope for a relaxed eye is given by:<br><br>$M = \\dfrac{v_o}{u_o} \\times \\dfrac{D}{f_e}$<br><br>where $D$ is the least distance of distinct vision ($D = 25$ cm). Substituting the known values:<br><br>$25 = \\dfrac{9}{u_o} \\times \\dfrac{25}{6}$<br><br>$1 = \\dfrac{9}{6 u_o}$<br><br>$u_o = \\dfrac{9}{6} = 1.5$ cm<br><br>Answer: 1.5 cm", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d10aee93fa0796dbc3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "In compound microscope, the focal length and the aperture of the objective used is respectively", "image": null}, "options": [{"id": "qtn9e", "text": "large and large", "image": null, "isCorrect": false}, {"id": "r1Nwt", "text": "small and small.", "image": null, "isCorrect": true}, {"id": "rwYSk", "text": "large and small.", "image": null, "isCorrect": false}, {"id": "kBIlq", "text": "small and large.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In a compound microscope, the objective lens is placed very close to the object.<br><br>To achieve high magnification, the focal length of the objective lens must be very small, since the magnification produced by the objective is inversely proportional to its focal length.<br><br>The aperture of the objective lens is also kept small to minimize spherical and chromatic aberrations, and because the object is very small and placed close to the lens, a large aperture is not required to gather sufficient light.<br><br>Thus, both the focal length and the aperture of the objective lens are small.<br><br>Answer: small and small.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213be0aee93fa0796db2e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "Simple microscope is used to see the object first in blue light and then a red light. Due to the change from blue to red light, its magnifying power", "image": null}, "options": [{"id": "NbjJR", "text": "decreases", "image": null, "isCorrect": true}, {"id": "5IOtA", "text": "increases", "image": null, "isCorrect": false}, {"id": "mToK7", "text": "remains same", "image": null, "isCorrect": false}, {"id": "2XX5Z", "text": "first increases and then decreases", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Magnifying power of a simple microscope is given by $M = 1 + \\dfrac{D}{f}$ or $M = \\dfrac{D}{f}$.<br><br>From Cauchy's formula, the refractive index $\\mu$ is inversely related to the wavelength $\\lambda$ as $\\mu = A + \\dfrac{B}{\\lambda^2}$.<br><br>Since the wavelength of red light is greater than that of blue light ($\\lambda_r > \\lambda_b$), the refractive index for red light is less than that for blue light ($\\mu_r < \\mu_b$).<br><br>According to the lens maker's formula, $\\dfrac{1}{f} = (\\mu - 1) \\left( \\dfrac{1}{R_1} - \\dfrac{1}{R_2} \\right)$, which implies $f \\propto \\dfrac{1}{\\mu - 1}$.<br><br>Therefore, the focal length of the lens for red light is greater than that for blue light ($f_r > f_b$).<br><br>Since magnifying power is inversely proportional to the focal length, $M_r < M_b$.<br><br>Thus, the magnifying power decreases when the light is changed from blue to red.<br><br>Answer: decreases", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ab0aee93fa0796da96", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "An astronomical telescope has a large aperture to", "image": null}, "options": [{"id": "TccIk", "text": "have high resolution.", "image": null, "isCorrect": true}, {"id": "HiBg6", "text": "have low dispersion.", "image": null, "isCorrect": false}, {"id": "Wpev3", "text": "increase the span of observation.", "image": null, "isCorrect": false}, {"id": "ChcUa", "text": "have large wavelength.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The resolving power of a telescope is given by the formula $RP = \\dfrac{D}{1.22 \\lambda}$, where $D$ is the diameter (aperture) of the objective lens and $\\lambda$ is the wavelength of light.<br><br>From this relation, the resolving power is directly proportional to the aperture $D$. Therefore, an astronomical telescope is designed with a large aperture to increase its resolving power, which allows it to have high resolution and distinguish between closely spaced objects.<br><br>Answer: have high resolution.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792136f0aee93fa0796d8c6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "Focal length of objective of an astronomical telescope is 1.5 m . Under normal adjustment, length of telescope is 1.56 m . Focal length of the eyepiece is", "image": null}, "options": [{"id": "bSQPZ", "text": "0.06 m", "image": null, "isCorrect": true}, {"id": "WGYXV", "text": "1.04 m", "image": null, "isCorrect": false}, {"id": "t0Ipu", "text": "2.34 m", "image": null, "isCorrect": false}, {"id": "loQJp", "text": "3.06 m", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For an astronomical telescope in normal adjustment, the length of the telescope tube is given by $L = f_o + f_e$.<br><br>Given $f_o = 1.5$ m and $L = 1.56$ m.<br><br>Substituting the values, we get $1.56 = 1.5 + f_e$.<br><br>$f_e = 1.56 - 1.5 = 0.06$ m.<br><br>The focal length of the eyepiece is $0.06$ m.<br><br>Answer: 0.06 m", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792136e0aee93fa0796d8c0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "A person is observing a bacteria through a compound microscope. For better analysis and to improve the resolving power he should", "image": null}, "options": [{"id": "Oydu4", "text": "increase the wavelength of light.", "image": null, "isCorrect": false}, {"id": "u85Df", "text": "increase the refractive index of the medium between the object and objective lens.", "image": null, "isCorrect": true}, {"id": "xroLT", "text": "decrease the focal length of the eye-piece.", "image": null, "isCorrect": false}, {"id": "RLCdb", "text": "decrease the diameter of the objective lens.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The resolving power of a compound microscope is given by:<br><br>$\\text{Resolving Power} = \\dfrac{2 \\mu \\sin \\theta}{\\lambda}$<br><br>where $\\mu$ is the refractive index of the medium between the object and the objective lens, $\\theta$ is the semi-vertical angle of the cone of light entering the objective, and $\\lambda$ is the wavelength of light.<br><br>To improve the resolving power, one must either decrease the wavelength of light $\\lambda$, increase the refractive index of the medium $\\mu$, or increase the diameter of the objective lens to increase $\\theta$.<br><br>Therefore, increasing the refractive index of the medium between the object and the objective lens improves the resolving power.<br><br>Answer: increase the refractive index of the medium between the object and objective lens.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213370aee93fa0796d70a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "Two points separated by a distance of 0.1 mm can just be seen in microscope when light of wavelength $6000 Å$ is used. If the light of wavelength $4800 Å$ is used, the limit of resolution will become", "image": null}, "options": [{"id": "mzNNO", "text": "0.8 mm", "image": null, "isCorrect": false}, {"id": "FASqB", "text": "0.12 mm", "image": null, "isCorrect": false}, {"id": "o2KxT", "text": "0.10 mm", "image": null, "isCorrect": false}, {"id": "rxFfA", "text": "0.08 mm .", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The limit of resolution of a microscope is given by $\\Delta d = \\dfrac{1.22 \\lambda}{2 \\mu \\sin \\theta}$<br><br>$\\Delta d \\propto \\lambda$<br><br>$\\dfrac{\\Delta d_1}{\\Delta d_2} = \\dfrac{\\lambda_1}{\\lambda_2}$<br><br>$\\dfrac{0.1}{\\Delta d_2} = \\dfrac{6000}{4800}$<br><br>$\\Delta d_2 = 0.1 \\times \\dfrac{4800}{6000} = 0.08 \\text{ mm}$<br><br>Answer: 0.08 mm .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213250aee93fa0796d67f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "The telescopes, for a given wavelength, the objectives with large aperture are used for", "image": null}, "options": [{"id": "ILg86", "text": "greater magnification.", "image": null, "isCorrect": false}, {"id": "oo0Kw", "text": "greater resolution.", "image": null, "isCorrect": true}, {"id": "lUnil", "text": "reducing lens aberration.", "image": null, "isCorrect": false}, {"id": "iYbW5", "text": "ease of manufacture.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The resolving power of a telescope is given by the formula $R = \\dfrac{D}{1.22 \\lambda}$, where $D$ is the diameter (aperture) of the objective lens and $\\lambda$ is the wavelength of light.<br><br>From this relation, it is clear that the resolving power is directly proportional to the aperture of the objective lens. Therefore, for a given wavelength, an objective with a large aperture is used to achieve greater resolution.<br><br>Additionally, a larger aperture collects more light, which helps in observing faint astronomical objects, but among the given choices, greater resolution is the primary optical advantage.<br><br>Answer: greater resolution.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261cf0279619d9d8a2f84", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "A person is observing a bacteria through a compound microscope. For better observation and to improve its resolving power he should", "image": null}, "options": [{"id": "hWQTz", "text": "increase the wavelength of light.", "image": null, "isCorrect": false}, {"id": "8zP9f", "text": "increase the refractive index of the medium between the object and objective léns.", "image": null, "isCorrect": true}, {"id": "VQdZw", "text": "decrease the focal length of the eyepiece.", "image": null, "isCorrect": false}, {"id": "SUALN", "text": "decrease the diameter of the objective lens.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Resolving Power $\\mathrm{R}=\\frac{\\text { N.A }}{0.61 \\lambda}$\n$\\text { N.A }=2 \\mathrm{n} \\sin \\alpha$\n$\\therefore \\quad$ By increasing the refractive index of the medium between the subject and the objective lens, the resolving power can be increased.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2613e0279619d9d8a2af5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "When final image is formed at D.D.V from eye, the magnifying power of microscope is ( $f$ is the focal length of the lens)", "image": null}, "options": [{"id": "B3H6K", "text": "$1+\\frac{f}{D}$", "image": null, "isCorrect": false}, {"id": "pe9RA", "text": "$1+\\frac{D}{f}$", "image": null, "isCorrect": true}, {"id": "dIWZl", "text": "$\\frac{D}{f}$", "image": null, "isCorrect": false}, {"id": "skTUe", "text": "$1-\\frac{D}{f}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Consider the diagram below:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/rjZWI7LeKOFOxx-XrSVJGDxY-0gtji2SeZtgFa1hlqw.original.fullsize.png\">\nGiven, $v=(-D)$,\nUsing mirror formula: $\\frac{1}{v}-\\frac{1}{u}=\\frac{1}{f}$\n$\\begin{aligned} & \\Rightarrow \\frac{1}{(-D)}-\\frac{1}{u}=\\frac{1}{f} \\\\ & \\Rightarrow \\frac{1}{u}=-\\left(\\frac{f+D}{f D}\\right)\\end{aligned}$\nNow, magnification can be easily calculated as:\n$\\therefore m=\\frac{v}{u}=\\frac{(-D)(f+D)}{(-f D)}=\\left(1+\\frac{D}{f}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261190279619d9d8a29c9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}], "question": {"text": "The intermediate image formed by an objective lens of a compound microscope is", "image": null}, "options": [{"id": "pQeSA", "text": "virtual and diminished", "image": null, "isCorrect": false}, {"id": "CcZpo", "text": "real and magnified", "image": null, "isCorrect": true}, {"id": "xqUdk", "text": "virtual and magnified", "image": null, "isCorrect": false}, {"id": "a7X6G", "text": "real and diminished", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "See the ray diagram of image formation using the compound microscope given below:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/vYa7KF2xRhkqqGKOfVo05euiSF_4mXmxSWtZBMwyFZU.original.fullsize.png\">\nThe objective lens $O_1$ forms an image $A^{\\prime} B^{\\prime}$ which is real, inverted as well as magnified.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261040279619d9d8a2921", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "A compound microscope produces a magnification of 24 . The focal length of the eyepiece is $5 \\mathrm{~cm}$. The final image is formed at the least distance of distinct vision. The magnification produced by the objective is", "image": null}, "options": [{"id": "t1y1S", "text": "4", "image": null, "isCorrect": true}, {"id": "qvZTJ", "text": "5", "image": null, "isCorrect": false}, {"id": "0KVvU", "text": "6", "image": null, "isCorrect": false}, {"id": "RKidr", "text": "7", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a compound microscope, $M=m_o \\times m_e$ and since the final image is formed at $D=25 \\mathrm{~cm}$,\n$\\begin{aligned} & M=m_o\\left(1+\\frac{D}{f_e}\\right) \\\\ & \\therefore m_o=\\frac{M}{1+\\frac{D}{f_e}}=\\frac{24}{1+\\frac{25}{5}} \\\\ & \\therefore m_e=\\frac{24}{1+5}=4\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260ef0279619d9d8a2877", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}], "question": {"text": "In a compound microscope, let ' $u_0$ ' and ' $v_0$ ' be the object distance and image distance respectively. The objective of focal length ' $f_0$ ' magnifies a tiny object into a real, inverted image. The linear magnification of the objective is", "image": null}, "options": [{"id": "07nu4", "text": "$\\frac{f_0+u_0}{u_0 f_0}$", "image": null, "isCorrect": false}, {"id": "le7RC", "text": "$\\frac{f_0}{f_0+u_0}$", "image": null, "isCorrect": true}, {"id": "KyuDM", "text": "$\\frac{u_0}{u_0 f_0+1}$", "image": null, "isCorrect": false}, {"id": "L1pLf", "text": "$\\frac{u_0 f_0}{f_0+u_0}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using lens formula:\n$\\frac{1}{v}-\\frac{1}{u}=\\frac{1}{f}$\nAnd definition of magnification,\n$m=\\frac{v}{u}$\nMultiply lens formula with $u$,\n$\\left(\\frac{u}{v}\\right)-1=\\frac{u}{f}$\n$\\left(\\frac{1}{m}\\right)-1=\\frac{u}{f}$\n$m=\\frac{f}{(u+f)}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260a60279619d9d8a2635", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "The magnifying power of a refracting type of astronomical telescope is ' $\\mathrm{m}$ '. If focal length of eyepiece is doubled then the magnifying power will become", "image": null}, "options": [{"id": "HrY6R", "text": "$\\mathrm{m}$", "image": null, "isCorrect": false}, {"id": "TInUg", "text": "$2 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "RHb4P", "text": "$\\frac{\\mathrm{m}}{2}$", "image": null, "isCorrect": true}, {"id": "ZcuHT", "text": "$\\frac{\\mathrm{m}}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Magnifying power, $m=\\frac{f_o}{f_e}$\nIf $\\mathrm{f}_{\\mathrm{e}}$ is doubled, the magnifying power will become $\\frac{\\mathrm{m}}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260130279619d9d8a2189", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}], "question": {"text": "To obtain a magnified image at distance of distinct vision (DDV) using a simple microscope, the object should be placed", "image": null}, "options": [{"id": "BurP0", "text": "between the principal focus and optical centre of the lens.", "image": null, "isCorrect": true}, {"id": "EC5kt", "text": "at the principal focus.", "image": null, "isCorrect": false}, {"id": "kOaHa", "text": "slightly beyond the principal focus.", "image": null, "isCorrect": false}, {"id": "4inMt", "text": "at the distance of distinct vision.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fec0279619d9d8a204e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "An object is clearly seen through an astronomical telescope of length $50 \\mathrm{~cm}$. The\nfocal lengths of its objective and eyepiece respectively, can be", "image": null}, "options": [{"id": "bw6sV", "text": "$5 \\mathrm{~cm}$ and $45 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "Oz6IR", "text": "$45 \\mathrm{~cm}$ and $-5 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "eoFT2", "text": "$-45 \\mathrm{~cm}$ and $-5 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "oBRm7", "text": "$45 \\mathrm{~cm}$ and $5 \\mathrm{~cm}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "(A)\n$\\ell=f_{0}+f_{e} ; \\quad f_{0}$ and $f_{0}$ are positive.\nMagnifying power $=\\frac{f_{0}}{f_{e}}>1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fea0279619d9d8a2044", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "By increasing the aperture of the objective lens, wavelength of light, focal length\nof the objective lens and the resolving power of an astronomical telescope\nrespectively", "image": null}, "options": [{"id": "AjCAk", "text": "is not affected, increases, decreases.", "image": null, "isCorrect": false}, {"id": "g3oyl", "text": "increases, decreases, is not affected.", "image": null, "isCorrect": true}, {"id": "9sIjl", "text": "decreases, increases, is not affected.", "image": null, "isCorrect": false}, {"id": "5Qrcc", "text": "is not affected, decreases, increases.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(A)\nResolving power of the telescope $\\quad \\mathrm{RP}=\\frac{\\mathrm{a}}{1.22 \\lambda}$\nwhere a is the diameter (aperture) of the objective lens.\n$\\Longrightarrow \\quad \\mathrm{RP} \\propto \\mathrm{a}$\nThus the aperture of the objective lens is made so large so as to increase the resolving power of the telescope.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fc60279619d9d8a1f25", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "There are four convex lenses $\\mathrm{L}_{1}, \\mathrm{~L}_{2}, \\mathrm{~L}_{3}$ and $\\mathrm{L}_{4}$ of focal length $2,4,6$ and $8 \\mathrm{~cm}$ respectively. Two of these lenses form a telescope of length $10 \\mathrm{~cm}$ and magnifying power 4 . The objective and eye lenses are respectively", "image": null}, "options": [{"id": "8t0JT", "text": "L1, L2", "image": null, "isCorrect": false}, {"id": "xQbar", "text": "L1, L4", "image": null, "isCorrect": false}, {"id": "FewkQ", "text": "L2, L3", "image": null, "isCorrect": false}, {"id": "hcdNU", "text": "L4, L1", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "(C)\n$\\begin{array}{l}\n\\mathrm{f}_{0}+\\mathrm{f}_{\\mathrm{e}}=10 \\\\\n\\frac{\\mathrm{f}_{0}}{\\mathrm{f}_{\\mathrm{e}}}=4 \\quad \\therefore \\mathrm{f}_{0}=4 \\mathrm{f}_{\\mathrm{e}} \\\\\n5 \\mathrm{f}_{\\mathrm{e}}=10 \\quad \\therefore \\mathrm{f}_{\\mathrm{e}}=2 \\quad \\mathrm{f}_{0}=8\n\\end{array}$\nSo, $\\mathrm{L}_{1}$ and $\\mathrm{L}_{4}$ were used", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fc30279619d9d8a1f0c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "When wavelength of light used in optical instruments $\\mathrm{A}$ and $\\mathrm{B}$ are $4500 Å$ and $6000 Å$ respectively, the ratio of resolving power of $A$ to $B$ will be", "image": null}, "options": [{"id": "d96Xk", "text": "16:9", "image": null, "isCorrect": false}, {"id": "G39TI", "text": "7:1", "image": null, "isCorrect": false}, {"id": "L3Be5", "text": "9:16", "image": null, "isCorrect": false}, {"id": "4JVl9", "text": "4:3", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "(D)\nResolving power of an optical instrument $\\propto \\frac{1}{\\lambda}$\n$\\frac{\\text { Resolving power at } \\lambda_{1}}{\\text { Resolving power at } \\lambda_{2}}=\\frac{\\lambda_{1}}{\\lambda_{2}}$\n$\\left[\\right.$ Limit of resolution $\\left.\\propto \\frac{1}{\\text { resolving power }}\\right]$\n$\\therefore$ Ratio of resolving power $=\\frac{5000}{4000}=\\frac{5}{4}=5: 4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d
