+\\dfrac{1}{\\mathrm{n}}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213470aee93fa0796d786", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "A convex lens of focal length ' $f$ ' $m$ forms a real, inverted image twice in size of the object. The object distance from the lens in metre is", "image": null}, "options": [{"id": "fL6jG", "text": "0.5 f", "image": null, "isCorrect": false}, {"id": "TDrHW", "text": "0.66 f", "image": null, "isCorrect": false}, {"id": "nv9P9", "text": "f", "image": null, "isCorrect": false}, {"id": "qRiwH", "text": "1.5 f", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For a real and inverted image, the magnification $m$ is negative. Given that the image is twice the size of the object, $m = -2$.<br><br>Using the formula for magnification:<br>$m = \\dfrac{v}{u} = -2 \\Rightarrow v = -2u$<br><br>Using the lens formula:<br>$\\dfrac{1}{v} - \\dfrac{1}{u} = \\dfrac{1}{f}$<br><br>Substituting $v = -2u$ into the lens formula:<br>$\\dfrac{1}{-2u} - \\dfrac{1}{u} = \\dfrac{1}{f}$<br><br>$\\dfrac{-1 - 2}{2u} = \\dfrac{1}{f}$<br><br>$\\dfrac{-3}{2u} = \\dfrac{1}{f}$<br><br>$u = -1.5f$<br><br>The object distance from the lens is the magnitude of $u$, which is $1.5f$.<br><br>Answer: 1.5 f", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213350aee93fa0796d6fd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "The focal length of combination of lenses formed with lenses having power of +2.50 D and -3.75 D , will be", "image": null}, "options": [{"id": "UUzo0", "text": "-20 cm", "image": null, "isCorrect": false}, {"id": "wnPlv", "text": "-40 cm", "image": null, "isCorrect": false}, {"id": "pqaas", "text": "-60 cm", "image": null, "isCorrect": false}, {"id": "oDCBr", "text": "-80 cm", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The power of the combination of lenses is given by the sum of their individual powers.<br><br>$P = P_1 + P_2$<br><br>Substituting the given values:<br><br>$P = +2.50 - 3.75 = -1.25$ D<br><br>The focal length $f$ of the combination is the reciprocal of the total power.<br><br>$f = \\dfrac{1}{P}$<br><br>$f = \\dfrac{1}{-1.25}$ m<br><br>$f = -0.8$ m<br><br>Converting to centimeters:<br><br>$f = -0.8 \\times 100 = -80$ cm<br><br>Answer: -80 cm", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262780279619d9d8a34c9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "Refractive index of a glass convex lens is 1.5 . The radius of curvature of each of the two surfaces of the lens is $20 \\mathrm{~cm}$. The ratio of the power of the lens when immersed in a liquid of refractive index 1.25 to that when placed in air is", "image": null}, "options": [{"id": "iQUkp", "text": "$2:3$", "image": null, "isCorrect": false}, {"id": "ZcXPy", "text": "$2:5$", "image": null, "isCorrect": true}, {"id": "LRD0u", "text": "$3:5$", "image": null, "isCorrect": false}, {"id": "xzjya", "text": "$5:2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given data: $\\mu_{\\mathrm{g}}=1.5, \\mathrm{R}_1=\\mathrm{R}_2=20 \\mathrm{~cm}, \\mu_l=1.25$\n$\\begin{aligned}\n\\mathrm{P}_1=\\left(\\frac{\\mu_{\\mathrm{g}}}{\\mu_{\\mathrm{a}}}-1\\right)\\left(\\frac{1}{\\mathrm{R}_1}-\\frac{1}{\\mathrm{R}_2}\\right) & =(1.5-1)\\left(\\frac{1}{\\mathrm{R}_1}-\\frac{1}{\\mathrm{R}_2}\\right) \\\\\n\\therefore \\quad \\mathrm{P}_2=\\left(\\frac{\\mu_{\\mathrm{g}}}{\\mu_l}-1\\right)\\left(\\frac{1}{\\mathrm{R}_1}-\\frac{1}{\\mathrm{R}_2}\\right) & =\\left(\\frac{1.5}{1.25}-1\\right)\\left(\\frac{1}{\\mathrm{R}_1}-\\frac{1}{\\mathrm{R}_2}\\right) \\\\\n& =(1.2-1)\\left(\\frac{1}{\\mathrm{R}_1}-\\frac{1}{\\mathrm{R}_2}\\right)\n\\end{aligned}$\nTaking ratio,\n$\\frac{\\mathrm{P}_2}{\\mathrm{P}_1}=\\frac{1.2-1}{1.5-1}=\\frac{2}{5}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262670279619d9d8a343d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "A combination of two thin lenses in contact have power $+10 \\mathrm{D}$. The power reduces to $+6 \\mathrm{D}$ when the lenses are $0.25 \\mathrm{~m}$ apart. The power of individual lens is", "image": null}, "options": [{"id": "HhDPV", "text": "$5 \\mathrm{D}, 5 \\mathrm{D}$", "image": null, "isCorrect": false}, {"id": "6f1Kq", "text": "$6 \\mathrm{D}, 4 \\mathrm{D}$", "image": null, "isCorrect": false}, {"id": "UJsGC", "text": "$7 \\mathrm{D}, 3 \\mathrm{D}$", "image": null, "isCorrect": false}, {"id": "Bqzaf", "text": "$8 \\mathrm{D}, 2 \\mathrm{D}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "When in contact, the equivalent power of two thin lenses is,\n$$\n\\mathrm{P}_1+\\mathrm{P}_2=10\n$$\nWhen the lenses are separated by $0.25 \\mathrm{~m}$, $\\mathrm{P}_1+\\mathrm{P}_2-0.25 \\mathrm{P}_1 \\mathrm{P}_2=6$\n$$\n\\begin{array}{ll}\n\\therefore & 0.25 \\mathrm{P}_1 \\mathrm{P}_2=4 \\\\\n\\therefore & \\mathrm{P}_1 \\mathrm{P}_2=16 \\\\\n& \\mathrm{P}_1-\\mathrm{P}_2=\\sqrt{\\left(\\mathrm{P}_1+\\mathrm{P}_2\\right)^2+4 \\mathrm{P}_1 \\mathrm{P}_2} \\\\\n\\therefore & \\mathrm{P}_1-\\mathrm{P}_2=\\sqrt{36}=6...(i)\n\\end{array}\n$$\nAdding equations (i) and (ii), we get,\n$$\n\\begin{aligned}\n\\mathrm{P}_1 & =8 \\mathrm{D} \\\\\n\\therefore \\quad \\mathrm{P}_2 & =10-8=2 \\mathrm{D}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262570279619d9d8a33be", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "The radii of curvature of both the surfaces of a convex lens of focal length ' $f$ ' and focal power ' $\\mathrm{P}$ ' are equal. One of the surfaces is made plane by grinding. The new focal length and focal power of the lens is", "image": null}, "options": [{"id": "7WRpz", "text": "$\\frac{2}{3} \\mathrm{f}, \\frac{2}{3} \\mathrm{P}$", "image": null, "isCorrect": false}, {"id": "T2yFG", "text": "$\\sqrt{\\frac{2}{\\mathrm{f}}}, \\sqrt{\\frac{\\mathrm{P}}{2}}$", "image": null, "isCorrect": false}, {"id": "P7BVM", "text": "$\\frac{\\mathrm{f}}{2}, 2 \\mathrm{P}$", "image": null, "isCorrect": false}, {"id": "CaiaQ", "text": "$2 \\mathrm{f}, \\frac{\\mathrm{P}}{2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "From Lens maker's formula,\n$\\frac{1}{\\mathrm{f}}=(\\mu-1)\\left(\\frac{1}{\\mathrm{R}_1}-\\frac{1}{\\mathrm{R}_2}\\right)$\nAs the radius of both the surfaces is the same,\n$\\frac{1}{\\mathrm{f}}=(\\mu-1)\\left(\\frac{1}{\\mathrm{R}}+\\frac{1}{\\mathrm{R}}\\right)$\n$\\frac{1}{\\mathrm{f}}=\\frac{2}{\\mathrm{R}}(\\mu-1)$\nWhen one surface is plane, $R_1=R, R_2=\\infty$\n$\\therefore \\quad \\frac{1}{\\mathrm{f}^{\\prime}}=(\\mu-1)\\left(\\frac{1}{\\mathrm{R}}-\\frac{1}{\\infty}\\right)$\n$\\frac{1}{\\mathrm{f}^{\\prime}}=\\frac{1}{\\mathrm{R}}(\\mu-1)$\n$\\therefore \\quad \\frac{\\mathrm{f}^{\\prime}}{\\mathrm{f}}=2$\n$\\mathrm{f}^{\\prime}=2 \\mathrm{f}$\n$P=\\frac{1}{f} \\quad$ and $\\quad P^{\\prime}=\\frac{1}{f^{\\prime}}$\n$\\frac{\\mathrm{P}^{\\prime}}{\\mathrm{P}}=\\frac{\\mathrm{f}}{\\mathrm{f}^{\\prime}}=\\frac{1}{2}$\n$\\mathrm{P}^{\\prime}=\\frac{\\mathrm{P}}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2621b0279619d9d8a31da", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "Converging or diverging ability of a lens or mirror is called", "image": null}, "options": [{"id": "OOfit", "text": "focal power", "image": null, "isCorrect": true}, {"id": "fnPbq", "text": "focal length", "image": null, "isCorrect": false}, {"id": "dKiQE", "text": "magnifying power", "image": null, "isCorrect": false}, {"id": "giy7S", "text": "linear magnification", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\begin{array}{|l|l|l|} \\hline Std.11 & Ch-9 & Subtopic-9.4 \\\\ \\hline \\end{array}", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2620d0279619d9d8a3168", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "A double convex lens of focal length ' $F$ ' is cut into two equal parts along the vertical axis. The focal length of each part will be", "image": null}, "options": [{"id": "qvwqd", "text": "$2 \\mathrm{~F}$", "image": null, "isCorrect": true}, {"id": "tAcs8", "text": "F", "image": null, "isCorrect": false}, {"id": "pdGPy", "text": "$\\frac{\\mathrm{F}}{2}$", "image": null, "isCorrect": false}, {"id": "LCaaG", "text": "$4 \\mathrm{~F}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For bifocal convex lens\n$\\frac{1}{f}=(\\mu-1)\\left(\\frac{1}{R_1}+\\frac{1}{R_2}\\right)$\n$=\\frac{(\\mu-1) \\times 2}{R} \\quad \\ldots .\\left(R_1=R_2=R\\right)$\nFor plane surface $\\mathrm{R}_2=\\infty$\nFor half plane-convex lens\n$\\begin{aligned}\n& \\frac{1}{\\mathrm{f}^{\\prime}}=(\\mu-1) \\frac{1}{\\mathrm{R}} \\\\\n& \\frac{1 / \\mathrm{f}}{1 / \\mathrm{f}^{\\prime}}=\\frac{(\\mu-1)}{\\mathrm{R}} \\times 2 \\times \\frac{\\mathrm{R}}{\\mu-1}=2 \\\\\n& \\frac{\\mathrm{f}^{\\prime}}{\\mathrm{f}}=2 \\\\\n& \\mathrm{f}^{\\prime}=2 \\mathrm{f}\n\\end{aligned}$\nAs focal length is $F, f^{\\prime}=2 F$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261f60279619d9d8a30b3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "The size of the real image produced by a convex lens of focal length $\\mathrm{F}$ is ' $\\mathrm{m}$ ' times the size of the object. The image distance from the lens is", "image": null}, "options": [{"id": "ehRet", "text": "$\\frac{F}{(m-1)}$", "image": null, "isCorrect": false}, {"id": "R6bXZ", "text": "$\\frac{(m-1)}{F}$", "image": null, "isCorrect": false}, {"id": "i1CLv", "text": "$\\mathrm{F}(\\mathrm{m}+1)$", "image": null, "isCorrect": true}, {"id": "Bolr2", "text": "$\\mathrm{F}(\\mathrm{m}-1)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From lens formula, $\\frac{1}{\\mathrm{v}}-\\frac{1}{\\mathrm{u}}=\\frac{1}{\\mathrm{~F}}$\n\nFor a convex lens, $\\mathrm{u}$ is negative, $\\mathrm{v}$ and $\\mathrm{F}$ are positive.\n$$\n\\begin{aligned}\n& \\therefore \\quad \\frac{1}{\\mathrm{v}}-\\frac{1}{-\\mathrm{u}}=\\frac{1}{\\mathrm{~F}} \\\\\n& \\therefore \\quad \\frac{1}{\\mathrm{v}}=\\frac{1}{\\mathrm{~F}}-\\frac{1}{\\mathrm{u}}\n\\end{aligned}\n$$\n\nMultiplying by $\\mathrm{v}$,\n$$\n\\begin{aligned}\n1 & =\\frac{\\mathrm{v}}{\\mathrm{F}}-\\frac{\\mathrm{v}}{\\mathrm{u}} \\\\\n\\therefore \\quad 1 & =\\frac{\\mathrm{v}}{\\mathrm{F}}-\\mathrm{m} \\quad \\ldots\\left(\\because \\frac{\\mathrm{v}}{\\mathrm{u}}=\\mathrm{m}\\right) \\\\\n\\therefore \\quad \\frac{\\mathrm{v}}{\\mathrm{F}} & =1+\\mathrm{m} \\\\\n\\therefore \\quad \\mathrm{v} & =\\mathrm{F}(1+\\mathrm{m})\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261e60279619d9d8a303a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "Two lenses of power $-15 \\mathrm{D}$ and $+5 \\mathrm{D}$ are in contact with each other. The focal length of the combination is", "image": null}, "options": [{"id": "s7vfZ", "text": "$-0.1 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "GM4Vg", "text": "$-10 \\mathrm{~cm}$", "image": null, "isCorrect": true}, {"id": "P4xCr", "text": "$-20 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "VuIuo", "text": "$+10 \\mathrm{~cm}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$P=\\frac{1}{f}$\nFor combination of lenses,\n$\\mathrm{P}=\\mathrm{P}_1+\\mathrm{P}_2$\nGiven: $P_1=-15 \\mathrm{D}$ and $P_2=+5 F$\n$\\begin{array}{ll}\n\\therefore \\quad & P=-10 D \\\\\n& \\Rightarrow f=-\\frac{1}{10} \\mathrm{~m} \\\\\n\\therefore \\quad & f=-10 \\mathrm{~cm}\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261820279619d9d8a2d24", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "The minimum distance between an object and its real image formed by a convex lens of focal length $f$ is", "image": null}, "options": [{"id": "V9oQD", "text": "$2.5 f$", "image": null, "isCorrect": false}, {"id": "0s4vs", "text": "$2 f$", "image": null, "isCorrect": false}, {"id": "ydm2t", "text": "$1.5 f$", "image": null, "isCorrect": false}, {"id": "Y9Ffj", "text": "$4 f$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "We know:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/vZ0kdW38HPK2wEsE5uYlzBXUHl35c4b0epW-Y5vUZag.original.fullsize.png\">\nLet the seperation between object and image by $x$,\n$$\nx=u-v\n$$\nUsing equation (1), on rewriting,\n$$\n\\begin{aligned}\n& x=u-\\frac{x f}{u} \\\\\n& \\Rightarrow x=\\frac{u^2}{(u+f)}---(1)\n\\end{aligned}\n$$\nwe first take log of equation (1)\n$$\n\\Rightarrow \\ln (x)=2 \\ln (u)-\\ln (u+f)\n$$\nSubsequently, to minimize $x$ w.r.t. $u$, take the derivative of $x$ w.r.t. $u$ :\n$$\n\\begin{aligned}\n& \\Rightarrow \\frac{1}{x} \\frac{d x}{d u}=\\frac{2}{u}-\\frac{1}{(u+f)} \\\\\n& \\Rightarrow \\frac{d x}{d u}=\\frac{x(u+2 f)}{u(u+f)}---(2)\n\\end{aligned}\n$$\nCondition for minimum $x$ requires, $\\frac{d x}{d u}=0$ and $\\frac{d^2 x}{\\partial u^2}<0$\n$$\n\\Rightarrow \\frac{d x}{d u}=\\frac{x(u+2 f)}{u(u+f)}=0\n$$\nSo, $x=0$ \\{is the trivial solution $\\}$ and the real solution occurs for $u=-2 f=-R$. Lets check the minimum value using equation (1),\n$$\n\\Rightarrow x_{\\min }=\\frac{u^2}{(u+f)}=\\frac{(-2 f)^2}{(-2 f+f)}=4 f\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2614f0279619d9d8a2b81", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "A convex lens is dipped in a liquid whose refractive index is equal to refractive index of lens material. Then its focal length will", "image": null}, "options": [{"id": "JE7PM", "text": "become infinite", "image": null, "isCorrect": true}, {"id": "lrdwh", "text": "remain same", "image": null, "isCorrect": false}, {"id": "CPg9E", "text": "decrease", "image": null, "isCorrect": false}, {"id": "0sPAv", "text": "become zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given that refractive of liquid is equal to refractive index of lens.\n$\\Rightarrow n_{\\text {lens }}=n_{\\text {liquid }}$\nLet the focal length be $f$.\nFrom lens makers formula, we get $\\frac{1}{f}=\\frac{\\left(n_{\\text {lens }}-n_{\\text {liquid }}\\right)}{n_{\\text {liquid }}}\\left(\\frac{1}{R_1}-\\frac{1}{R_2}\\right)$\nHere, $n_{\\{\\text {lens }\\}}-n_{\\{\\text {liquid }\\}}=0$\nTherefore, the focal length will be infinite.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2614e0279619d9d8a2b7b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "A convex lens A of focal length $20 \\mathrm{~cm}$ and a concave lens B of focal length $56 \\mathrm{~cm}$ are kept along the same axis with the distance $d$ between them. If a parallel beam of light falling on A leaves B as a parallel beam, then the magnitude of distance $d$ (in $\\mathrm{cm}$ ) is", "image": null}, "options": [{"id": "ogpjw", "text": "25", "image": null, "isCorrect": false}, {"id": "lrdw4", "text": "36", "image": null, "isCorrect": true}, {"id": "CcsmC", "text": "30", "image": null, "isCorrect": false}, {"id": "klWtN", "text": "50", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$d=f_1+f_2$\nBy using the formula\n$\\frac{1}{f_1}+\\frac{1}{f_2}-\\frac{d}{f_1 f_2}=\\frac{1}{f}$\nFor the emergent beam to parallel\n$\\begin{aligned}\n& P=0 \\text { or } f=\\propto \\\\\n& \\Rightarrow \\frac{1}{20 \\mathrm{~cm}}+\\frac{1}{(-56 \\mathrm{~cm})}-\\frac{d}{20 \\mathrm{~cm}(-56 \\mathrm{~cm})}=0 \\\\\n& \\therefore d=20 \\mathrm{~cm}+(-56 \\mathrm{~cm})=-36 \\mathrm{~cm}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261260279619d9d8a2a31", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "A double convex lens made of glass has both radii of curvature of magnitude $20 \\mathrm{~cm}$. Incident light rays parallel to the axis of the lens will converge to a point at a distance ' $L$ ' from the common pole P. The value of L is [Refractive index of glass $=1.5$ ]", "image": null}, "options": [{"id": "MQTv7", "text": "$10 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "6iiDq", "text": "$40 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "uZa7V", "text": "$\\frac{20}{3} \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "qhLxh", "text": "$20 \\mathrm{~cm}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/Wphgz_R-dnqruvv63nhglirHjFXBaCfc7EmOxgp-Xxg.original.fullsize.png\">\nLens maker formula: $\\frac{1}{\\mathrm{f}}=(\\mu-1)\\left(\\frac{1}{\\mathrm{R}_1}-\\frac{1}{\\mathrm{R}_2}\\right)$\nIf incidence ray has direction left to right \\&\n$\\left|R_1\\right|=\\left|R_2\\right|=20 \\mathrm{~cm}=\\mathrm{R}, \\mu=1.5$, then\n$\\begin{aligned} & \\frac{I}{f}=(\\mu-1)\\left(\\frac{1}{R}-\\frac{1}{(-R)}\\right)=\\frac{2(\\mu-1)}{R} \\\\ & =\\frac{2(1.5-1)}{20 \\mathrm{~cm}} \\\\ & \\Rightarrow f=20 \\mathrm{~cm}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261140279619d9d8a29a4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}], "question": {"text": "A glass convex lens is of refractive index 1.55 with both faces of same radius of curvature. What is the radius of curvature required if focal length is to be $20 \\mathrm{~cm}$ ?", "image": null}, "options": [{"id": "76dTt", "text": "$21 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "Nklcn", "text": "$18 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "Yis9j", "text": "$20 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "hjnr6", "text": "$22 \\mathrm{~cm}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Using the Lens maker's formula,\n$\\begin{aligned} & f_1=(\\mu-1)\\left(\\frac{1}{R_1}-\\frac{1}{R_2}\\right) \\\\ & \\text { Here, } f=20 \\mathrm{~cm}, \\mu 1.55, R_1=R, R_2=-R \\\\ & \\Rightarrow \\frac{1}{20}=(1.55-1)\\left(\\frac{1}{R}-\\frac{1}{(-R)}\\right) \\\\ & \\Rightarrow \\frac{1}{20}=0.55 \\times \\frac{2}{R} \\\\ & \\Rightarrow R=1.1 \\times 20=22 \\mathrm{~cm}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260db0279619d9d8a27dd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}], "question": {"text": "Two thin lenses have a combined power of $+9 D$. When they are separated by a distance of $20 \\mathrm{~cm}$, then their equivalent power becomes $+\\frac{27}{5}$ D. Their individual power (in diopter) is respectively", "image": null}, "options": [{"id": "vVjQu", "text": "2,7", "image": null, "isCorrect": false}, {"id": "63B1X", "text": "1,8", "image": null, "isCorrect": false}, {"id": "uHc4N", "text": "4,8", "image": null, "isCorrect": false}, {"id": "TnpuV", "text": "3,6", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The correct option is (D).\nGiven, combined power of the lenses:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/4nwU_9Rt8GttHg6uUU73_o7zTI1vGh6oJCm2FBOj9j8.original.fullsize.png\">\nOn solving equation (1) and (2),\n$P_1=3 D$ and $P_2=6 D$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260b80279619d9d8a26c2", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "A plano-convex lens of refractive index ( $\\mu_1$ ' fits exactly into a plano-concave lens of refractive index $\\mu_2$. Their plane surfaces are parallel to each other. ' $R$ ' is the radius of curvature of the curved surface of the lenses. The focal length of the combination is", "image": null}, "options": [{"id": "pvmUR", "text": "$\\frac{\\mathrm{R}}{\\mu_1-\\mu_2}$", "image": null, "isCorrect": true}, {"id": "1YFNi", "text": "$\\frac{R}{2\\left(\\mu_1+\\mu_2\\right)}$", "image": null, "isCorrect": false}, {"id": "Xojz8", "text": "$\\frac{2 R}{\\mu_1-\\mu_2}$", "image": null, "isCorrect": false}, {"id": "9AhVs", "text": "$\\frac{R}{2\\left(\\mu_1-\\mu_2\\right)}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\frac{1}{\\mathrm{f}_1}=\\left(\\mu_1-1\\right)\\left(\\frac{1}{\\mathrm{R}_1}-\\frac{1}{\\mathrm{R}_2}\\right)=\\frac{\\left(\\mu_1-1\\right)}{\\mathrm{R}} \\\\ & \\frac{1}{\\mathrm{f}_2}=\\left(\\mu_2-1\\right)\\left(\\frac{1}{\\mathrm{R}_1}-\\frac{1}{\\mathrm{R}_2}\\right)=\\frac{\\left(\\mu_2-1\\right)}{-\\mathrm{R}} \\\\ & \\frac{1}{\\mathrm{f}}=\\frac{1}{\\mathrm{f}_1}+\\frac{1}{\\mathrm{f}_2}=\\frac{\\mu_1-1}{\\mathrm{R}}-\\frac{\\mu_2-1}{\\mathrm{R}}=\\frac{1}{\\mathrm{R}}\\left[\\mu_1-1-\\mu_2+1\\right]=\\frac{\\mu_1-\\mu_2}{\\mathrm{R}} \\\\ & \\mathrm{f}=\\frac{\\mathrm{R}}{\\mu_1-\\mu_2}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260910279619d9d8a258c", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "The radii of curvature of both the surface of a convex lens of focal length ' $\\mathrm{f}$ ' and focal power ' $\\mathrm{P}$ ' are equal. One of the surfaces is made plane by grinding. The new focal length and focal power of the lens is respectively", "image": null}, "options": [{"id": "blj2H", "text": "$\\frac{1}{2} \\mathrm{f}, 2 \\mathrm{P}$", "image": null, "isCorrect": false}, {"id": "2yNY0", "text": "$2 \\mathrm{f}, \\frac{\\mathrm{P}}{2}$", "image": null, "isCorrect": true}, {"id": "kXEUi", "text": "$\\sqrt{\\frac{2}{f}}, \\sqrt{\\frac{P}{2}}$", "image": null, "isCorrect": false}, {"id": "XtXc5", "text": "$\\frac{2 \\mathrm{f}}{3}, \\frac{2}{3} \\mathrm{P}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{P}=\\frac{1}{\\mathrm{f}}=(\\mu-1)\\left(\\frac{1}{\\mathrm{R}}+\\frac{1}{\\mathrm{R}}\\right)=(\\mu-1) \\frac{2}{\\mathrm{R}} \\\\ & \\mathrm{P}^{\\prime}=\\frac{1}{\\mathrm{f}^{\\prime}}=(\\mu-1) \\frac{1}{\\mathrm{R}} \\\\ & \\therefore \\mathrm{P}^{\\prime}=\\frac{\\mathrm{P}}{2} \\text { and } \\mathrm{f}^{\\prime}=2 \\mathrm{f}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260820279619d9d8a250e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "An object is located on a wall, its image of equal size is to be obtained on a parallel wall with the help of a convex lens. The lens in placed at a distance ' $\\mathrm{d}$ ' in front of the second wall. The required focal length of the lens is", "image": null}, "options": [{"id": "5ZBXM", "text": "less than $\\frac{\\mathrm{d}}{4}$", "image": null, "isCorrect": false}, {"id": "qiWS9", "text": "more than $\\frac{\\mathrm{d}}{4}$ but less than $\\frac{\\mathrm{d}}{2}$", "image": null, "isCorrect": false}, {"id": "DlP2e", "text": "only $\\frac{\\mathrm{d}}{4}$", "image": null, "isCorrect": false}, {"id": "KLE9R", "text": "only $\\frac{d}{2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Size of the image is equal to the size of the object. Hence image distance will be equal to object distance. Also if object distance $u$ $=2 \\mathrm{f}$, Image distance will be $2 \\mathrm{f}$.\n$$\n\\begin{aligned}\n& \\therefore \\mathrm{u}=\\mathrm{v}=\\mathrm{d}=2 \\mathrm{f} \\\\\n& \\therefore \\mathrm{u}+\\mathrm{v}=2 \\mathrm{~d}=4 \\mathrm{f} \\\\\n& \\therefore \\mathrm{f}=\\frac{\\mathrm{d}}{2}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2606a0279619d9d8a2452", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "A biconvex lens $\\left(\\mathrm{R}_1=\\mathrm{R}_2=30\\right)$ has focal length equal to the focal length of concave mirror. The radius of curvature of concave mirror is\n[Refractive index of material of lens $=1.6]$", "image": null}, "options": [{"id": "JNWsw", "text": "30 cm", "image": null, "isCorrect": false}, {"id": "Htmf4", "text": "40 cm", "image": null, "isCorrect": false}, {"id": "g4XK4", "text": "50 cm", "image": null, "isCorrect": true}, {"id": "t327i", "text": "20 cm", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a biconvex lens\n$$\n\\begin{aligned}\n& \\frac{1}{\\mathrm{f}}=(\\mu-1)\\left(\\frac{1}{\\mathrm{R}_1}-\\frac{1}{\\mathrm{R}_2}\\right) \\\\\n& =(1.6-1)\\left(\\frac{1}{30}+\\frac{1}{30}\\right) \\\\\n& =0.6 \\times \\frac{2}{30}=\\frac{1.2}{30} \\\\\n& \\mathrm{f}=\\frac{30}{1.2}=25 \\mathrm{~cm}\n\\end{aligned}\n$$\nRadius of concave mirror $=2 \\mathrm{f}=50 \\mathrm{~cm}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2605c0279619d9d8a23d8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "A convex lens is dipped in a liquid whose refractive index is equal to refractive index of lens material. Then its focal length will", "image": null}, "options": [{"id": "JI9qK", "text": "increase", "image": null, "isCorrect": false}, {"id": "Db8en", "text": "remain unchanged", "image": null, "isCorrect": false}, {"id": "NF7h6", "text": "become infinite", "image": null, "isCorrect": true}, {"id": "xqWAP", "text": "become zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a lens $\\frac{1}{\\mathrm{f}}=\\left(\\mu^{\\prime}-1\\right)\\left(\\frac{1}{\\mathrm{R}_1}-\\frac{1}{\\mathrm{R}_2}\\right)$\nWhere $\\mu^{\\prime}=\\frac{\\mu_{\\mathrm{g}}}{\\mu_{\\ell}}=1$\n$$\n\\therefore \\frac{1}{\\mathrm{f}}=0 \\text { or } \\mathrm{f}=\\infty\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260490279619d9d8a2345", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "A particle executes linear S.H.M. along the principal axis of a convex lens of focal length $8 \\mathrm{~cm}$. The mean position of oscillation is at $14 \\mathrm{~cm}$ from the lens with amplitude $1 \\mathrm{~cm}$. The amplitude of oscillating image of the particle is nearly", "image": null}, "options": [{"id": "wCAUx", "text": "$3 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "6JOyo", "text": "$5 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "2dZ0g", "text": "$2 \\mathrm{~cm}$", "image": null, "isCorrect": true}, {"id": "HfV6U", "text": "$4 \\mathrm{~cm}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{f}=8 \\mathrm{~cm}$, when the particle is at mean position, $\\mathrm{u}=-14 \\mathrm{~cm}$\n$$\n\\begin{aligned}\n& \\frac{1}{\\mathrm{~V}}=\\frac{1}{\\mathrm{f}}+\\frac{1}{\\mathrm{u}}=\\frac{1}{8}-\\frac{1}{14}=\\frac{3}{56} \\\\\n& \\therefore \\mathrm{V}=\\frac{56}{3} \\approx 19 \\mathrm{~cm}\n\\end{aligned}\n$$\nWhen the particle is at one of the extreme positions its distance from the lens is $14+1=15 \\mathrm{~cm}$\n$$\n\\therefore \\mathrm{u}=-15 \\mathrm{~cm}\n$$\nAgain, $\\frac{1}{\\mathrm{~V}}=\\frac{1}{\\mathrm{f}}+\\frac{1}{\\mathrm{u}}=\\frac{1}{8}-\\frac{1}{15}=\\frac{7}{120}$\n$$\n\\therefore \\mathrm{v}=\\frac{120}{7} \\approx 17 \\mathrm{~cm}\n$$\nAmplitude of the image $=19-17=2 \\mathrm{~cm}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260340279619d9d8a229b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "A convex lens of focal length ' $\\mathrm{f}$ ' produces a real image ' $n$ ' time the size of the object. The image distance is", "image": null}, "options": [{"id": "UD8J7", "text": "$\\mathrm{f}(\\mathrm{n}+1)$", "image": null, "isCorrect": true}, {"id": "Dp3sO", "text": "$f(n-1)$", "image": null, "isCorrect": false}, {"id": "lUxZD", "text": "$\\frac{\\mathrm{f}}{(\\mathrm{N}+1)}$", "image": null, "isCorrect": false}, {"id": "Wa2qF", "text": "$\\frac{\\mathrm{f}}{(\\mathrm{N}-\\mathrm{l})}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The image is real and hence inverted.\n$$\n\\therefore \\frac{\\mathrm{v}}{\\mathrm{u}}=-\\mathrm{n} \\text { or } \\mathrm{u}=-\\frac{\\mathrm{v}}{\\mathrm{n}}\n$$\nBy lens equation, $\\frac{1}{\\mathrm{v}}-\\frac{1}{\\mathrm{u}}=\\frac{1}{\\mathrm{f}}$\n$$\n\\begin{aligned}\n& \\frac{1}{v}+\\frac{n}{v}=\\frac{1}{f} \\\\\n& v=f(1+n)\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260230279619d9d8a220e", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "Inside a vessel filled with liquid a converging lens is placed as shown in figure. The lens has focal length $15 \\mathrm{~cm}$ when in air and has refractive index $\\frac{3}{2}$. If the liquid has refractive index $\\frac{9}{5}$, the focal length of lens in liquid is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/iCsgF77xftimEsbza5dlSYOr8uMp8pK9rE43ZeFgg7E.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "EkYTQ", "text": "$15 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "dzIOX", "text": "$-60 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "uGlJ7", "text": "$90 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "rkfOk", "text": "$-45 \\mathrm{~cm}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/xAyjGL78-KCQ9VbO2Lcv2KFfeuE9WAOTv-evE5gtz9o.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260230279619d9d8a220c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "A convex lens $\\mathrm{T}$ is used to form an image whose size is one fourth that of size of object. Then the object distance is", "image": null}, "options": [{"id": "prRDQ", "text": "$2\\mathrm{f}$", "image": null, "isCorrect": false}, {"id": "VfyIN", "text": "$5 \\mathrm{f}$", "image": null, "isCorrect": true}, {"id": "78JmJ", "text": "$4 \\mathrm{f}$", "image": null, "isCorrect": false}, {"id": "MQVTF", "text": "$3 \\mathrm{f}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Magnification, $\\mathrm{m}=-\\frac{1}{4}$\n(Since the image is real and inverted, it is taken as negative)\n$$\n\\begin{aligned}\n& \\therefore \\mathrm{m}=\\frac{\\mathrm{v}}{\\mathrm{u}}=-\\frac{1}{4} \\\\\n& \\mathrm{v}=-\\frac{\\mathrm{u}}{4}\n\\end{aligned}\n$$\nLens formula, $\\frac{1}{\\mathrm{v}}-\\frac{1}{\\mathrm{u}}=\\frac{1}{\\mathrm{f}}$\n$$\n\\begin{aligned}\n& -\\frac{4}{u}-\\frac{1}{u}=\\frac{1}{f} \\\\\n& u=-5 f\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f8d0279619d9d8a1d69", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "A convex lens of focal length 'F' produces a real image 'n' times the size of the\nobject. The image distance is", "image": null}, "options": [{"id": "JUy1i", "text": "$\\mathrm{F}(\\mathrm{n}+1)$", "image": null, "isCorrect": true}, {"id": "vVyYF", "text": "$\\mathrm{F}(\\mathrm{n}-1)$", "image": null, "isCorrect": false}, {"id": "vMMvg", "text": "$\\frac{\\mathrm{F}}{(\\mathrm{n}+1)}$", "image": null, "isCorrect": false}, {"id": "tf4A0", "text": "$\\frac{\\mathrm{F}}{(\\mathrm{n}-1)}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\frac{v}{u}=(-n) \\quad \\therefore v=(-u n)$\n$\\therefore \\quad \\frac{1}{F}=\\frac{1}{v}-\\frac{1}{u}$\n$\\frac{v}{F}=1-\\frac{v}{u}=1+n$\n$\\therefore v=F(1+n)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ee70279619d9d8a1833", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}], "question": {"text": "The equi-convex lens has a focal length ‘ <math><mi>f</mi></math> ’. If the lens is cut along the line perpendicular to principal axis and passing through the pole, what will be the focal length of any half part?", "image": null}, "options": [{"id": "eNa3N", "text": "<math><mfrac><mrow><mi>f</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "WeSVQ", "text": "<math><mn>2</mn><mi>f</mi></math>", "image": null, "isCorrect": true}, {"id": "Ha1HZ", "text": "<math><mfrac><mrow><mn>3</mn><mi>f</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "Mx5lB", "text": "<math><mi>f</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/94c9cf64-2dec-45f4-b754-58539aac4f0b.png\"> <br/><math><mfrac><mrow><mn>1</mn></mrow><mrow><mi>f</mi></mrow></mfrac><mo>=</mo><mfenced separators=\"|\"><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>2</mn></mrow><mrow><mi>R</mi></mrow></mfrac></mrow></mfenced></math>  <br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/240a2306-fcc3-4e28-9018-fd40b8edcb14.png\"> <br/><math><mo>&#8658;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>f</mi><mi>'</mi></mrow></mfrac><mo>=</mo><mfenced separators=\"|\"><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mi>R</mi></mrow></mfrac></mrow></mfenced></math>  <br/><math><mo>∴</mo><msup><mrow><mi>f</mi></mrow><mrow><mi>'</mi></mrow></msup><mo>=</mo><mn>2</mn><mi>f</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "65a263250279619d9d8a3c5a", "title": "Combination of Lens and Mirrors", "totalQuestions": 5, "questions": [{"_id": "679213210aee93fa0796d65e", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "Two thin lenses have a combined power of +9 D. When they are separated by a distance of 20 cm , their equivalent power becomes $+\\dfrac{27}{5} \\mathrm{D}$. The power of both the lenses in dioptre are respectively", "image": null}, "options": [{"id": "cQ65d", "text": "4,5", "image": null, "isCorrect": false}, {"id": "O5msU", "text": "3,6", "image": null, "isCorrect": true}, {"id": "HxEzi", "text": "2,7", "image": null, "isCorrect": false}, {"id": "hcF0J", "text": "1,8", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the powers of the two lenses be $P_1$ and $P_2$.<br><br>When the lenses are in contact, their combined power is given by:<br>$P_1 + P_2 = 9$<br><br>When they are separated by a distance $d = 20 \\text{ cm} = 0.2 \\text{ m}$, the equivalent power is given by:<br>$P_{eq} = P_1 + P_2 - d P_1 P_2$<br><br>Substituting the given values:<br>$\\dfrac{27}{5} = 9 - 0.2 P_1 P_2$<br><br>$\\dfrac{1}{5} P_1 P_2 = 9 - \\dfrac{27}{5}$<br><br>$\\dfrac{1}{5} P_1 P_2 = \\dfrac{18}{5}$<br><br>$P_1 P_2 = 18$<br><br>We have $P_1 + P_2 = 9$ and $P_1 P_2 = 18$. These are the sum and product of the roots of the quadratic equation:<br>$x^2 - 9x + 18 = 0$<br><br>$(x - 3)(x - 6) = 0$<br><br>Thus, the powers of the lenses are $3 \\text{ D}$ and $6 \\text{ D}$.<br><br>Answer: 3,6", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261ac0279619d9d8a2e6f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "The rays of different colours fail to converge at a point after passing through a thick converging lens. This defect is called", "image": null}, "options": [{"id": "NkIUe", "text": "spherical aberration", "image": null, "isCorrect": false}, {"id": "60U2u", "text": "distortion", "image": null, "isCorrect": false}, {"id": "RbC0t", "text": "coma", "image": null, "isCorrect": false}, {"id": "1M4qY", "text": "chromatic aberration", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Std.11|CH-9|Subtopic-9.10", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260010279619d9d8a20f9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "The figure shows equiconvex lens of focal length ' $\\mathrm{f}$ '. If the lens is cut along $\\mathrm{AB}$, the\nfocal length of each half will be\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/w-dAz8d0QmGbTabH7NPuwcMiHtUyl3CQ_LAXJh4vru0.original.fullsize.png\"><br><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/w-dAz8d0QmGbTabH7NPuwcMiHtUyl3CQ_LAXJh4vru0.original.fullsize.png\">", "image": null}, "options": [{"id": "SqlQ1", "text": "$2 \\mathrm{f}$", "image": null, "isCorrect": true}, {"id": "mN9KG", "text": "$\\mathrm{f}$", "image": null, "isCorrect": false}, {"id": "sKccU", "text": "$3 \\mathrm{f}$", "image": null, "isCorrect": false}, {"id": "VlWHz", "text": "$4 \\mathrm{f}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f420279619d9d8a1b08", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}], "question": {"text": "A biconvex lens $\\left(\\mathrm{R}_{1}=\\mathrm{R}_{2}=20 \\mathrm{~cm}\\right)$ has focal length equal to focal length of\nconcave mirror. The radius of curvature of concave mirror is\n[R.I. of glass lens $=1 \\cdot 5$ ]", "image": null}, "options": [{"id": "ZZijk", "text": "$-40 \\mathrm{~cm}$", "image": null, "isCorrect": true}, {"id": "DKWMh", "text": "$-20 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "afF3n", "text": "$40 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "GLuW0", "text": "$20 \\mathrm{~cm}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{array}{l}\n\\frac{1}{f}=(n-1)\\left(\\frac{1}{R_{1}}-\\frac{1}{R_{2}}\\right) \\\\\nn=1.5, R_{1}=20 \\mathrm{~cm}, R_{2}=-20 \\mathrm{~cm} \\\\\n\\therefore f=20 \\mathrm{~cm}\n\\end{array}\n$$\nfor a concave mirror, $R=2 f$ and it is negative.\n$$\n\\therefore R=-40 \\mathrm{~cm}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f0b0279619d9d8a1951", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}], "question": {"text": "A convex lens of focal length ‘f’ is placed in contact with a concave lens of the same focal length. The equivalent focal length of the combination is", "image": null}, "options": [{"id": "CyNAo", "text": "<math><mi>f</mi></math>", "image": null, "isCorrect": false}, {"id": "o085x", "text": "Infinity", "image": null, "isCorrect": true}, {"id": "T79RD", "text": "<math><mfrac><mrow><mi>f</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "ehaES", "text": "Zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, focal length of convex lens, <math><msub><mrow><mi>f</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mi>f</mi></math>  <br/>and focal length of concave lens, <math><msub><mrow><mi>f</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mo>-</mo><mi>f</mi></math> . <br/>The focal length of combination, when two lenses are in contact is given by <br/><math><mfrac><mrow><mn>1</mn></mrow><mrow><mi>f</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>f</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>f</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math>  <br/>Substituting given value in Eq. (i). We get <br/><math><mo>⇒</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>f</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>f</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>f</mi></mrow></mfrac><mo>=</mo><mn>0</mn><mo>⇒</mo><mi>f</mi><mo>=</mo><mi>∞</mi></math>  <br/>Hence, the equivalent focal length of the combination is infinity.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 7, "topicId": "65a263250279619d9d8a3c5b", "title": "Prism and Dispersion of Light", "totalQuestions": 28, "questions": [{"_id": "6abb886e15a9fc0fc8c143a6", "type": "singleCorrect", "question": {"text": "An equilateral prism deviates a ray through $45^\\circ$ for the two angles of incidence differing by $20^\\circ$. One of the angle of incidence is", "image": null}, "options": [{"id": "5yZwM", "label": "A", "text": "$62.5^\\circ$", "isCorrect": true, "image": null}, {"id": "5o97n", "label": "B", "text": "$32.5^\\circ$", "isCorrect": false, "image": null}, {"id": "qPqRm", "label": "C", "text": "$52.5^\\circ$", "isCorrect": false, "image": null}, {"id": "sWwpO", "label": "D", "text": "$22.5^\\circ$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a prism, the angle of deviation $\\delta$ is given by the relation:<br><br>$\\delta = i + e - A$<br><br>where $i$ is the angle of incidence, $e$ is the angle of emergence, and $A$ is the angle of the prism.<br><br>For a given deviation, the two possible angles of incidence correspond to $i$ and $e$. Let these be $i_1$ and $i_2$.<br><br>Given that the prism is equilateral, $A = 60^\\circ$. The deviation is $\\delta = 45^\\circ$.<br><br>Substituting these values, we get:<br><br>$i_1 + i_2 = 45^\\circ + 60^\\circ = 105^\\circ$<br><br>It is also given that the two angles of incidence differ by $20^\\circ$:<br><br>$i_1 - i_2 = 20^\\circ$<br><br>Adding the two equations:<br><br>$2i_1 = 125^\\circ \\Rightarrow i_1 = 62.5^\\circ$<br><br>Subtracting the two equations:<br><br>$2i_2 = 85^\\circ \\Rightarrow i_2 = 42.5^\\circ$<br><br>Thus, one of the angles of incidence is $62.5^\\circ$.<br><br>Answer: $62.5^\\circ$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a78c30a4553e1bdb61", "type": "singleCorrect", "question": {"text": "A thin glass prism has refractive index $1.5$. The correct relation between the angle of minimum deviation $(\\delta m)$ and angle of refraction $(r)$ is", "image": null}, "options": [{"id": "WkBAW", "label": "A", "text": "$\\delta m = \\dfrac{r}{2}$", "isCorrect": false, "image": null}, {"id": "0RAhX", "label": "B", "text": "$\\delta m = 2r$", "isCorrect": false, "image": null}, {"id": "Mc631", "label": "C", "text": "$\\delta m = r$", "isCorrect": true, "image": null}, {"id": "uEJZJ", "label": "D", "text": "$\\delta m = \\dfrac{3r}{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a thin prism, the angle of minimum deviation is given by $\\delta_m = (\\mu - 1)A$.<br><br>At the position of minimum deviation, the angle of refraction $r$ inside the prism is $r = \\dfrac{A}{2}$, which gives $A = 2r$.<br><br>Given the refractive index $\\mu = 1.5$.<br><br>Substituting the values into the deviation formula, we get:<br><br>$\\delta_m = (1.5 - 1)(2r)$<br><br>$\\delta_m = 0.5 \\times 2r$<br><br>$\\delta_m = r$<br><br>Answer: $\\delta m = r$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d34c8c30a4553e1be245", "type": "singleCorrect", "question": {"text": "The prism has refracting angle A. The second refracting surface of the prism is silvered. Light ray falling on first refracting surface with angle of incidence $2A$, reaches the second surface and returns back through same path due to reflection at the silvered surface. The refractive index of the material of prism is", "image": null}, "options": [{"id": "IvOGP", "label": "A", "text": "$2 \\sin A$", "isCorrect": false, "image": null}, {"id": "gAMWi", "label": "B", "text": "$2 \\cos A$", "isCorrect": true, "image": null}, {"id": "VjRgy", "label": "C", "text": "$\\dfrac{1}{2} \\sin A$", "isCorrect": false, "image": null}, {"id": "4sQzg", "label": "D", "text": "$\\dfrac{1}{2} \\cos A$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a prism, the angle of the prism is given by $A = r_1 + r_2$.<br><br>Since the light ray retraces its path after reflection from the silvered second surface, it must strike the second surface normally. Thus, the angle of incidence at the second surface is $r_2 = 0$.<br><br>Substituting $r_2 = 0$ into the prism formula gives $r_1 = A$.<br><br>Applying Snell's law at the first refracting surface:<br><br>$\\sin i = \\mu \\sin r_1$<br><br>Given the angle of incidence $i = 2A$, we have:<br><br>$\\sin(2A) = \\mu \\sin A$<br><br>Using the trigonometric identity $\\sin(2A) = 2 \\sin A \\cos A$:<br><br>$2 \\sin A \\cos A = \\mu \\sin A$<br><br>$\\mu = 2 \\cos A$<br><br>Answer: $2 \\cos A$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d33e8c30a4553e1be1af", "type": "singleCorrect", "question": {"text": "A ray of light incident on one face of an equilateral glass prism having refractive index $\\sqrt{2}$, produces the emergent ray which just grazes along the adjacent face. The value of angle of incidence is $(\\sin 90^\\circ = 1)$<br>$\\left(\\sin 30^\\circ = \\dfrac{1}{2}\\right)\\left(\\sin 45^\\circ = \\dfrac{1}{\\sqrt{2}}\\right)$", "image": null}, "options": [{"id": "4W1YD", "label": "A", "text": "$\\sin^{-1}\\left(\\sqrt{2}\\sin 15^\\circ\\right)$", "isCorrect": true, "image": null}, {"id": "fAttW", "label": "B", "text": "$\\sin^{-1}\\left(\\dfrac{1}{\\sqrt{2}}\\sin 15^\\circ\\right)$", "isCorrect": false, "image": null}, {"id": "JVg2Q", "label": "C", "text": "$\\sin^{-1}\\left(\\sqrt{2}\\sin 30^\\circ\\right)$", "isCorrect": false, "image": null}, {"id": "TtfRV", "label": "D", "text": "$\\sin^{-1}\\left(\\dfrac{1}{\\sqrt{2}}\\sin 45^\\circ\\right)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For an equilateral prism, the angle of the prism is $A = 60^\\circ$.<br><br>The emergent ray grazes the adjacent face, so the angle of emergence is $e = 90^\\circ$.<br><br>Applying Snell's law at the second face:<br><br>$\\mu \\sin r_2 = 1 \\cdot \\sin e$<br><br>$\\sqrt{2} \\sin r_2 = \\sin 90^\\circ = 1$<br><br>$\\sin r_2 = \\dfrac{1}{\\sqrt{2}}$<br><br>$r_2 = 45^\\circ$<br><br>Using the relation for the angle of the prism $A = r_1 + r_2$:<br><br>$r_1 + 45^\\circ = 60^\\circ$<br><br>$r_1 = 15^\\circ$<br><br>Applying Snell's law at the first face:<br><br>$1 \\cdot \\sin i = \\mu \\sin r_1$<br><br>$\\sin i = \\sqrt{2} \\sin 15^\\circ$<br><br>$i = \\sin^{-1}\\left(\\sqrt{2} \\sin 15^\\circ\\right)$<br><br>Answer: $\\sin^{-1}\\left(\\sqrt{2}\\sin 15^\\circ\\right)$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2df8c30a4553e1bddb9", "type": "singleCorrect", "question": {"text": "The angle of minimum deviation produced by a thin prism in air is $\\delta_1$. What will be the minimum deviation ($\\delta_2$) if the prism is immersed in liquid ?<br>$\\left[ {}^a n_g = \\dfrac{3}{2}, \\ {}^a n_\\ell = \\dfrac{1}{3} \\right]$", "image": null}, "options": [{"id": "gvFtD", "label": "A", "text": "$\\delta_2 = 3\\,\\delta_1$", "isCorrect": false, "image": null}, {"id": "YoDWA", "label": "B", "text": "$\\delta_2 = 5\\,\\delta_1$", "isCorrect": false, "image": null}, {"id": "0L4Ja", "label": "C", "text": "$\\delta_2 = 7\\,\\delta_1$", "isCorrect": true, "image": null}, {"id": "v5EGb", "label": "D", "text": "$\\delta_2 = 9\\,\\delta_1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a thin prism, the angle of minimum deviation is given by $\\delta = (n_{rel} - 1)A$, where $n_{rel}$ is the refractive index of the prism relative to the surrounding medium and $A$ is the angle of the prism.<br><br>When the prism is in air, the deviation $\\delta_1$ is:<br>$\\delta_1 = ({}^a n_g - 1)A$<br>Substituting ${}^a n_g = \\dfrac{3}{2}$:<br>$\\delta_1 = \\left(\\dfrac{3}{2} - 1\\right)A = \\dfrac{A}{2}$<br><br>When the prism is immersed in the liquid, the relative refractive index of the glass with respect to the liquid is:<br>${}^\\ell n_g = \\dfrac{{}^a n_g}{{}^a n_\\ell} = \\dfrac{\\dfrac{3}{2}}{\\dfrac{1}{3}} = \\dfrac{9}{2}$<br><br>The new deviation $\\delta_2$ in the liquid is:<br>$\\delta_2 = ({}^\\ell n_g - 1)A$<br>$\\delta_2 = \\left(\\dfrac{9}{2} - 1\\right)A = \\dfrac{7A}{2}$<br><br>Taking the ratio of $\\delta_2$ to $\\delta_1$:<br>$\\dfrac{\\delta_2}{\\delta_1} = \\dfrac{\\dfrac{7A}{2}}{\\dfrac{A}{2}} = 7$<br><br>$\\delta_2 = 7\\delta_1$<br><br>Answer: $\\delta_2 = 7\\,\\delta_1$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d35d8c30a4553e1be2f0", "type": "singleCorrect", "question": {"text": "A thin prism in air produces the angle of minimum deviation $\\delta$. If the prism is immersed in water, the angle of minimum deviation for the same ray is (refractive index of water is $4/3$ and that of glass prism is $3/2$)", "image": null}, "options": [{"id": "DTvIc", "label": "A", "text": "$\\delta$", "isCorrect": false, "image": null}, {"id": "TyXc8", "label": "B", "text": "$\\dfrac{\\delta}{2}$", "isCorrect": false, "image": null}, {"id": "wS2MR", "label": "C", "text": "$\\dfrac{\\delta}{4}$", "isCorrect": true, "image": null}, {"id": "Kv0vt", "label": "D", "text": "$2\\delta$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The deviation produced by a thin prism in air is given by $\\delta = (\\mu_g - 1)A$.<br><br>Substituting $\\mu_g = \\dfrac{3}{2}$, we get $\\delta = \\left(\\dfrac{3}{2} - 1\\right)A = \\dfrac{A}{2}$.<br><br>When the prism is immersed in water, the relative refractive index of glass with respect to water is $\\mu_{gw} = \\dfrac{\\mu_g}{\\mu_w} = \\dfrac{3/2}{4/3} = \\dfrac{9}{8}$.<br><br>The new angle of minimum deviation is $\\delta' = (\\mu_{gw} - 1)A$.<br><br>Substituting $\\mu_{gw} = \\dfrac{9}{8}$, we get $\\delta' = \\left(\\dfrac{9}{8} - 1\\right)A = \\dfrac{A}{8}$.<br><br>Comparing the two deviations, $\\dfrac{\\delta'}{\\delta} = \\dfrac{A/8}{A/2} = \\dfrac{1}{4}$.<br><br>Thus, $\\delta' = \\dfrac{\\delta}{4}$.<br><br>Answer: $\\dfrac{\\delta}{4}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871afcbf9280d7f9932556", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "For a thin prism, $\\delta_1$ is the angle of deviation produced, when prism is placed in air. When the prism is immersed in water, the angle of deviation produced is $\\delta_2$. Given \\({ }_{\\mathrm{a}} \\mu_{\\mathrm{g}}=\\frac{3}{2}\\) and \\({ }_{\\mathrm{a}} \\mu_{\\mathrm{w}}=\\frac{4}{3}\\). The ratio $\\delta_2: \\delta_1$ is", "image": null}, "options": [{"id": "6rwU8", "text": "$1: 2$", "image": null, "isCorrect": false}, {"id": "4GGiS", "text": "$1: 4$", "image": null, "isCorrect": true}, {"id": "j8CNf", "text": "$1: 8$", "image": null, "isCorrect": false}, {"id": "U4584", "text": "$4: 1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The angle of deviation for a thin prism is given by $\\delta = (\\mu - 1)A$, where $\\mu$ is the refractive index of the prism relative to the surrounding medium.<br><br>When the prism is in air, the deviation is:<br>$\\delta_1 = ({}_{\\mathrm{a}}\\mu_{\\mathrm{g}} - 1)A$<br>$\\delta_1 = \\left(\\dfrac{3}{2} - 1\\right)A = \\dfrac{A}{2}$<br><br>When the prism is immersed in water, the refractive index of glass relative to water is:<br>${}_{\\mathrm{w}}\\mu_{\\mathrm{g}} = \\dfrac{{}_{\\mathrm{a}}\\mu_{\\mathrm{g}}}{{}_{\\mathrm{a}}\\mu_{\\mathrm{w}}} = \\dfrac{3/2}{4/3} = \\dfrac{9}{8}$<br><br>The deviation in water is:<br>$\\delta_2 = ({}_{\\mathrm{w}}\\mu_{\\mathrm{g}} - 1)A$<br>$\\delta_2 = \\left(\\dfrac{9}{8} - 1\\right)A = \\dfrac{A}{8}$<br><br>The ratio of the deviations is:<br>$\\dfrac{\\delta_2}{\\delta_1} = \\dfrac{A/8}{A/2} = \\dfrac{1}{4}$<br><br>Thus, $\\delta_2 : \\delta_1 = 1 : 4$.<br><br>Answer: $1: 4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792141d0aee93fa0796de14", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "The angle of minimum deviation produced by a thin prism in air is $\\delta_1$. If it is immersed in water the angle of minimum deviation is\r\n$\\left[\\mathrm{a}_{\\mathrm{g}}=\\frac{3}{2}, \\mathrm{a}_{\\mathrm{w}}=\\frac{4}{3}\\right]$", "image": null}, "options": [{"id": "mloPv", "text": "$2 \\delta_1$", "image": null, "isCorrect": false}, {"id": "yxx94", "text": "$\\frac{\\delta_1}{2}$", "image": null, "isCorrect": false}, {"id": "p2QP7", "text": "$\\frac{\\delta_1}{3}$", "image": null, "isCorrect": false}, {"id": "RJo7X", "text": "$\\frac{\\delta_1}{4}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For a thin prism, the angle of minimum deviation is given by $\\delta = (\\mu - 1)A$, where $\\mu$ is the refractive index of the prism relative to the surrounding medium and $A$ is the angle of the prism.<br><br>In air, the deviation is:<br><br>$\\delta_1 = (\\mu_g - 1)A = \\left(\\dfrac{3}{2} - 1\\right)A = \\dfrac{A}{2}$<br><br>When the prism is immersed in water, the refractive index of glass relative to water is:<br><br>$\\mu_{gw} = \\dfrac{\\mu_g}{\\mu_w} = \\dfrac{3/2}{4/3} = \\dfrac{9}{8}$<br><br>The deviation in water is:<br><br>$\\delta_2 = (\\mu_{gw} - 1)A = \\left(\\dfrac{9}{8} - 1\\right)A = \\dfrac{A}{8}$<br><br>Taking the ratio of $\\delta_2$ to $\\delta_1$:<br><br>$\\dfrac{\\delta_2}{\\delta_1} = \\dfrac{A/8}{A/2} = \\dfrac{1}{4}$<br><br>$\\delta_2 = \\dfrac{\\delta_1}{4}$<br><br>Answer: $\\frac{\\delta_1}{4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792141c0aee93fa0796de10", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "A glass prism ' $A$ ' deviates the red and blue rays through $10^{\\circ}$ and $12^{\\circ}$ respectively. A second prism ' B ' deviates them through $8^{\\circ}$ and $10^{\\circ}$ respectively. The ratio of their dispersive powers is (A to B)", "image": null}, "options": [{"id": "cBGVL", "text": "9:13", "image": null, "isCorrect": false}, {"id": "CjVRC", "text": "$4: 5$", "image": null, "isCorrect": false}, {"id": "YF31R", "text": "$9: 11$", "image": null, "isCorrect": true}, {"id": "wJkHx", "text": "$8: 9$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The dispersive power of a prism is given by $\\omega = \\dfrac{\\delta_b - \\delta_r}{\\delta_y}$<br><br>The mean deviation $\\delta_y$ is the average of the deviations of the blue and red rays: $\\delta_y = \\dfrac{\\delta_b + \\delta_r}{2}$<br><br>For prism A:<br>$\\delta_b = 12^{\\circ}$, $\\delta_r = 10^{\\circ}$<br>$\\delta_{yA} = \\dfrac{12^{\\circ} + 10^{\\circ}}{2} = 11^{\\circ}$<br>$\\omega_A = \\dfrac{12^{\\circ} - 10^{\\circ}}{11^{\\circ}} = \\dfrac{2}{11}$<br><br>For prism B:<br>$\\delta_b = 10^{\\circ}$, $\\delta_r = 8^{\\circ}$<br>$\\delta_{yB} = \\dfrac{10^{\\circ} + 8^{\\circ}}{2} = 9^{\\circ}$<br>$\\omega_B = \\dfrac{10^{\\circ} - 8^{\\circ}}{9^{\\circ}} = \\dfrac{2}{9}$<br><br>The ratio of their dispersive powers is:<br>$\\dfrac{\\omega_A}{\\omega_B} = \\dfrac{\\dfrac{2}{11}}{\\dfrac{2}{9}} = \\dfrac{9}{11}$<br><br>Answer: $9: 11$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214070aee93fa0796dd69", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "For a symmetric (equilateral) prism, the prism formula can be written as", "image": null}, "options": [{"id": "wbiwE", "text": "$2 \\sin \\left(30+\\frac{\\delta m}{2}\\right)$", "image": null, "isCorrect": true}, {"id": "AcRaS", "text": "$\\frac{2}{\\sqrt{3}} \\sin \\left(30+\\frac{\\delta \\mathrm{m}}{2}\\right)$", "image": null, "isCorrect": false}, {"id": "qsFjP", "text": "$2 \\sin \\left(60+\\frac{\\delta \\mathrm{m}}{2}\\right)$", "image": null, "isCorrect": false}, {"id": "39zdm", "text": "$\\frac{2}{\\sqrt{3}} \\sin \\left(60+\\frac{\\delta \\mathrm{m}}{2}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The refractive index of the material of a prism is given by the prism formula:<br><br>$\\mu = \\dfrac{\\sin\\left(\\dfrac{A + \\delta_m}{2}\\right)}{\\sin\\left(\\dfrac{A}{2}\\right)}$<br><br>For a symmetric (equilateral) prism, the angle of the prism is $A = 60^{\\circ}$.<br><br>Substituting $A = 60^{\\circ}$ in the formula:<br><br>$\\mu = \\dfrac{\\sin\\left(\\dfrac{60^{\\circ} + \\delta_m}{2}\\right)}{\\sin\\left(\\dfrac{60^{\\circ}}{2}\\right)}$<br><br>$\\mu = \\dfrac{\\sin\\left(30^{\\circ} + \\dfrac{\\delta_m}{2}\\right)}{\\sin(30^{\\circ})}$<br><br>Since $\\sin(30^{\\circ}) = \\dfrac{1}{2}$, we get:<br><
