syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3068c30a4553e1bdf5b", "type": "singleCorrect", "question": {"text": "A body of mass 'm' attached at the end of a string is just completing the loop in a vertical circle. The apparent weight of the body at the lowest point in its path is<br>($g$ = gravitational acceleration)", "image": null}, "options": [{"id": "LAf77", "label": "A", "text": "$6\\,mg$", "isCorrect": true, "image": null}, {"id": "aUBSM", "label": "B", "text": "$3\\,mg$", "isCorrect": false, "image": null}, {"id": "DoLzX", "label": "C", "text": "$1\\,mg$", "isCorrect": false, "image": null}, {"id": "4waQX", "label": "D", "text": "zero", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a body to just complete a vertical circle, the tension in the string at the highest point is zero.<br><br>$T_H + mg = \\dfrac{m v_H^2}{r} \\Rightarrow v_H = \\sqrt{gr}$<br><br>By conservation of mechanical energy between the highest and lowest points:<br><br>$\\dfrac{1}{2} m v_L^2 = \\dfrac{1}{2} m v_H^2 + mg(2r)$<br><br>$v_L^2 = v_H^2 + 4gr = gr + 4gr = 5gr$<br><br>At the lowest point, the net force towards the center provides the centripetal acceleration:<br><br>$T_L - mg = \\dfrac{m v_L^2}{r}$<br><br>$T_L = mg + \\dfrac{m(5gr)}{r} = mg + 5mg = 6mg$<br><br>The apparent weight of the body is equal to the tension in the string at that point, which is $6mg$.<br><br>Answer: $6\\,mg$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2dd8c30a4553e1bdda1", "type": "singleCorrect", "question": {"text": "A bucket containing water is revolved in vertical circle of radius r. To prevent the water from falling down, the period of revolution required is ($g$ = gravitational acceleration)", "image": null}, "options": [{"id": "khmkx", "label": "A", "text": "$2\\pi\\sqrt{\\dfrac{g}{r}}$", "isCorrect": false, "image": null}, {"id": "AuBGv", "label": "B", "text": "$2\\pi\\sqrt{\\dfrac{r}{g}}$", "isCorrect": true, "image": null}, {"id": "A6rQz", "label": "C", "text": "$2\\pi\\sqrt{rg}$", "isCorrect": false, "image": null}, {"id": "VzQVs", "label": "D", "text": "$\\dfrac{\\sqrt{rg}}{2\\pi}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "At the highest point of the vertical circle, the forces acting on the water are its weight $mg$ downwards and the normal reaction $N$ from the bucket downwards.<br><br>The necessary centripetal force is provided by these forces:<br><br>$mg + N = \\dfrac{mv^2}{r}$<br><br>To prevent the water from falling down, the normal reaction must be greater than or equal to zero ($N \\ge 0$). The minimum speed $v$ is obtained when $N = 0$:<br><br>$mg = \\dfrac{mv^2}{r} \\Rightarrow v = \\sqrt{rg}$<br><br>The angular velocity $\\omega$ corresponding to this minimum speed is:<br><br>$\\omega = \\dfrac{v}{r} = \\sqrt{\\dfrac{g}{r}}$<br><br>The maximum period of revolution $T$ required to prevent the water from falling is:<br><br>$T = \\dfrac{2\\pi}{\\omega} = 2\\pi\\sqrt{\\dfrac{r}{g}}$<br><br>Answer: $2\\pi\\sqrt{\\dfrac{r}{g}}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf7bf9280d7f9932e13", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A stone of mass ' m ' kg is tied to a string of length ' L ' m and moved in a vertical circle of radius 49 cm in a vertical plane. If it completes 30 revolutions per minute, the tension in the string when it is at the lowermost point is nearly\n[Take $\\pi^2=10$ and acceleration due to gravity, $g=10 \\mathrm{~m} / \\mathrm{s}^2$ ]", "image": null}, "options": [{"id": "G9IAV", "text": "$(90 \\mathrm{~m}) \\mathrm{N}$", "image": null, "isCorrect": false}, {"id": "h85RY", "text": "$(60 \\mathrm{~m}) \\mathrm{N}$", "image": null, "isCorrect": false}, {"id": "VdHZl", "text": "$(45 \\mathrm{~m}) \\mathrm{N}$", "image": null, "isCorrect": false}, {"id": "GUa2a", "text": "$(15 \\mathrm{~m}) \\mathrm{N}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Frequency of revolution, $n = 30 \\text{ rpm} = \\dfrac{30}{60} \\text{ rev/s} = 0.5 \\text{ Hz}$<br><br>Angular velocity, $\\omega = 2\\pi n = 2\\pi \\times 0.5 = \\pi \\text{ rad/s}$<br><br>Radius of the vertical circle, $r = 49 \\text{ cm} = 0.49 \\text{ m}$<br><br>The tension in the string at the lowermost point of the vertical circle is given by:<br><br>$T = mg + mr\\omega^2$<br><br>Substituting the given values ($g = 10 \\text{ m/s}^2$ and $\\pi^2 = 10$):<br><br>$T = m(10) + m(0.49)(\\pi^2)$<br><br>$T = 10m + m(0.49)(10)$<br><br>$T = 10m + 4.9m = 14.9m \\text{ N}$<br><br>Therefore, the tension is nearly $15m \\text{ N}$.<br><br>Answer: $(15 \\mathrm{~m}) \\mathrm{N}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba5bf9280d7f9932b32", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A point mass ' $m$ ' attached at one end of a massless, inextensible string of length ' $\\ell$ ' performs a vertical circular motion and the string rotates in vertical plane, as shown in the diagram. The increase in the centripetal acceleration of the point mass when it moves from point $A$ to point C is\n[ $\\mathrm{g}=$ acceleration due to gravity.]\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/evjtqGmmQxvu2ioIjHtwt8fbT0_ma2px_jo5MrC-B_8.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "nFDe1", "text": "$3 g$", "image": null, "isCorrect": false}, {"id": "3zzMa", "text": "$2 g$", "image": null, "isCorrect": true}, {"id": "OFeke", "text": "$g$", "image": null, "isCorrect": false}, {"id": "T0sT2", "text": "$\\frac{\\mathrm{g}}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the velocity of the point mass at the highest point A be $v_A$ and at the horizontal point C be $v_C$.<br><br>By the principle of conservation of mechanical energy between points A and C (taking the horizontal level of C as the reference for zero potential energy):<br><br>Total Energy at A = Total Energy at C<br><br>$\\dfrac{1}{2} m v_A^2 + mg\\ell = \\dfrac{1}{2} m v_C^2$<br><br>Rearranging the above equation, we get:<br><br>$v_C^2 - v_A^2 = 2g\\ell$<br><br>The centripetal acceleration of a particle moving in a circle of radius $\\ell$ with velocity $v$ is given by $a_c = \\dfrac{v^2}{\\ell}$.<br><br>The increase in centripetal acceleration when the mass moves from A to C is:<br><br>$\\Delta a_c = a_{cC} - a_{cA} = \\dfrac{v_C^2}{\\ell} - \\dfrac{v_A^2}{\\ell}$<br><br>$\\Delta a_c = \\dfrac{v_C^2 - v_A^2}{\\ell}$<br><br>Substituting $v_C^2 - v_A^2 = 2g\\ell$ into the equation:<br><br>$\\Delta a_c = \\dfrac{2g\\ell}{\\ell} = 2g$<br><br>Answer: $2 g$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b54bf9280d7f9932842", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A simple pendulum oscillates with an angular amplitude $\\theta$. If the maximum tension in the string is 4 times the minimum tension then the value of $\\theta$ is", "image": null}, "options": [{"id": "cXb6J", "text": "$\\cos ^{-1}(0.75)$", "image": null, "isCorrect": false}, {"id": "pjPkr", "text": "$\\cos ^{-1}(0.5)$", "image": null, "isCorrect": true}, {"id": "Kv9V0", "text": "$\\sin ^{-1}(0.5)$", "image": null, "isCorrect": false}, {"id": "yKarJ", "text": "$\\sin ^{-1}(0.75)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the mass of the bob be $m$ and the length of the pendulum be $l$.<br><br>The tension in the string at an angle $\\alpha$ with the vertical is given by:<br><br>$T = mg \\cos \\alpha + \\dfrac{mv^2}{l}$<br><br>By conservation of energy, the velocity $v$ at angle $\\alpha$ is:<br><br>$\\dfrac{1}{2} mv^2 = mgl (\\cos \\alpha - \\cos \\theta)$<br><br>$\\dfrac{mv^2}{l} = 2mg (\\cos \\alpha - \\cos \\theta)$<br><br>Substituting this in the tension equation, we get:<br><br>$T = mg \\cos \\alpha + 2mg (\\cos \\alpha - \\cos \\theta) = mg (3 \\cos \\alpha - 2 \\cos \\theta)$<br><br>The maximum tension occurs at the lowest point ($\\alpha = 0$):<br><br>$T_{max} = mg (3 - 2 \\cos \\theta)$<br><br>The minimum tension occurs at the extreme position ($\\alpha = \\theta$):<br><br>$T_{min} = mg (3 \\cos \\theta - 2 \\cos \\theta) = mg \\cos \\theta$<br><br>Given that $T_{max} = 4 T_{min}$:<br><br>$mg (3 - 2 \\cos \\theta) = 4 mg \\cos \\theta$<br><br>$3 - 2 \\cos \\theta = 4 \\cos \\theta$<br><br>$6 \\cos \\theta = 3$<br><br>$\\cos \\theta = 0.5$<br><br>$\\theta = \\cos^{-1}(0.5)$<br><br>Answer: $\\cos ^{-1}(0.5)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b0cbf9280d7f99325ec", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A weightless thread can bear tension up to 3.7 kg wt. A stone of mass 500 gram is tied to it and revolved in circular path of radius 4 m in vertical plane. Maximum angular velocity of the stone will be (acceleration due to gravity, $g=10 \\mathrm{~m} / \\mathrm{s}^2$ )", "image": null}, "options": [{"id": "JOhDC", "text": "$16 \\mathrm{rad} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "piWTM", "text": "$4 \\mathrm{rad} / \\mathrm{s}$", "image": null, "isCorrect": true}, {"id": "IV0bK", "text": "$2 \\mathrm{rad} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "puHGz", "text": "$8 \\mathrm{rad} / \\mathrm{s}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Maximum tension in a vertical circle occurs at the lowest point of the path.<br><br>$T_{\\text{max}} = m\\omega^2 r + mg$<br><br>Given $T_{\\text{max}} = 3.7 \\text{ kg wt} = 3.7 \\times 10 = 37 \\text{ N}$, $m = 500 \\text{ g} = 0.5 \\text{ kg}$, $r = 4 \\text{ m}$, and $g = 10 \\text{ m/s}^2$.<br><br>Substituting the values into the equation:<br><br>$37 = 0.5 \\times \\omega^2 \\times 4 + 0.5 \\times 10$<br><br>$37 = 2\\omega^2 + 5$<br><br>$2\\omega^2 = 32$<br><br>$\\omega^2 = 16$<br><br>$\\omega = 4 \\text{ rad/s}$<br><br>Answer: $4 \\mathrm{rad} / \\mathrm{s}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871af9bf9280d7f9932540", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A stone of mass 1 kg tied to a light inextensible string of length $\\mathrm{L}=\\frac{5}{3} \\mathrm{~m}$ is rotating in a circular path of radius L in a vertical plane. If the ratio of maximum tension in the string to the minimum tension in the string is 3 , the speed of the stone at the highest point of the circle is ( $\\mathrm{g}=$ acceleration due to gravity)", "image": null}, "options": [{"id": "oWbSx", "text": "$\\sqrt{\\mathrm{gL}}$", "image": null, "isCorrect": false}, {"id": "XrOVk", "text": "2 $\\sqrt{\\mathrm{gL}}$", "image": null, "isCorrect": true}, {"id": "f1wN6", "text": "4 $\\sqrt{\\mathrm{gL}}$", "image": null, "isCorrect": false}, {"id": "C6RuE", "text": "8 $\\sqrt{\\mathrm{gL}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $v_H$ and $v_L$ be the speeds of the stone at the highest and lowest points of the vertical circle, respectively.<br><br>The tension at the highest point (minimum tension) is given by:<br>$T_{min} = \\dfrac{m v_H^2}{L} - mg$<br><br>The tension at the lowest point (maximum tension) is given by:<br>$T_{max} = \\dfrac{m v_L^2}{L} + mg$<br><br>By the principle of conservation of mechanical energy between the highest and lowest points:<br>$\\dfrac{1}{2} m v_L^2 = \\dfrac{1}{2} m v_H^2 + mg(2L)$<br>$v_L^2 = v_H^2 + 4gL$<br><br>Substituting $v_L^2$ into the expression for $T_{max}$:<br>$T_{max} = \\dfrac{m(v_H^2 + 4gL)}{L} + mg = \\dfrac{m v_H^2}{L} + 5mg$<br><br>We are given that the ratio of maximum tension to minimum tension is 3:<br>$\\dfrac{T_{max}}{T_{min}} = 3$<br><br>$\\dfrac{\\dfrac{m v_H^2}{L} + 5mg}{\\dfrac{m v_H^2}{L} - mg} = 3$<br><br>$\\dfrac{m v_H^2}{L} + 5mg = 3\\left(\\dfrac{m v_H^2}{L} - mg\\right)$<br><br>$\\dfrac{m v_H^2}{L} + 5mg = 3\\dfrac{m v_H^2}{L} - 3mg$<br><br>$2\\dfrac{m v_H^2}{L} = 8mg$<br><br>$\\dfrac{v_H^2}{L} = 4g$<br><br>$v_H^2 = 4gL$<br><br>$v_H = 2\\sqrt{gL}$<br><br>Answer: 2 $\\sqrt{\\mathrm{gL}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213820aee93fa0796d958", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "A body moves along a circular path of radius 15 cm . It starts from a point on the circular path and reaches the end of diameter in 3 second. The angular speed of the body in rad $/ \\mathrm{s}$ is", "image": null}, "options": [{"id": "6lRxe", "text": "$\\dfrac{\\pi}{2}$", "image": null, "isCorrect": false}, {"id": "sHWNr", "text": "$\\dfrac{\\pi}{3}$", "image": null, "isCorrect": true}, {"id": "MpbcX", "text": "$\\dfrac{\\pi}{4}$", "image": null, "isCorrect": false}, {"id": "Pilje", "text": "$\\dfrac{\\pi}{5}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The body moves from a point on the circular path to the end of the diameter, which means it covers a semicircular path.<br><br>The angular displacement $\\theta$ for a semicircle is $\\pi$ radians.<br><br>The time taken $t$ is $3$ seconds.<br><br>The angular speed $\\omega$ is given by:<br><br>$\\omega = \\dfrac{\\theta}{t}$<br><br>$\\omega = \\dfrac{\\pi}{3}$ rad/s<br><br>Answer: $\\dfrac{\\pi}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792131f0aee93fa0796d652", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "A particle at rest starts moving with a constant angular acceleration of $4 \\mathrm{rad} / \\mathrm{s}^2$ in a circular path. The time at which magnitudes of its centripetal acceleration and tangential acceleration will be equal, is (in second)", "image": null}, "options": [{"id": "yU1MJ", "text": "$\\dfrac{1}{4}$", "image": null, "isCorrect": false}, {"id": "PKgLZ", "text": "$\\dfrac{1}{3}$", "image": null, "isCorrect": false}, {"id": "2CCnT", "text": "$\\dfrac{1}{2}$", "image": null, "isCorrect": true}, {"id": "E99PY", "text": "$\\dfrac{2}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Initial angular velocity, $\\omega_0 = 0$<br><br>Angular acceleration, $\\alpha = 4$<br><br>Angular velocity at time $t$, $\\omega = \\omega_0 + \\alpha t = 4t$<br><br>Tangential acceleration, $a_t = r\\alpha$<br><br>Centripetal acceleration, $a_c = \\omega^2 r$<br><br>Given $a_c = a_t$<br><br>$\\omega^2 r = r\\alpha$<br><br>$\\omega^2 = \\alpha$<br><br>$(4t)^2 = 4$<br><br>$16t^2 = 4$<br><br>$t^2 = \\dfrac{1}{4}$<br><br>$t = \\dfrac{1}{2}$<br><br>Answer: $\\dfrac{1}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261720279619d9d8a2ca1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "A string of $L$ is fixed at one end and carries a mass $M$ at the other end. The string makes $\\frac{\\pi}{2}$ revolutions per second around the vertical axis through the fixed end as shown in the figure, then the tension in the string is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/zZRzA68H5xvGj460fq0X31Max0A90bOz1QrJfGh4J14.original.fullsize.png\">", "image": null}, "options": [{"id": "fMB1I", "text": "$2 M L$", "image": null, "isCorrect": false}, {"id": "y1230", "text": "$M L$", "image": null, "isCorrect": false}, {"id": "Ndjy2", "text": "$16 M L$", "image": null, "isCorrect": true}, {"id": "6EDhy", "text": "$4 M L$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given: $\\omega=\\frac{2}{\\pi}$ rev.per sec\n$\\Rightarrow \\omega=2 \\pi \\frac{2}{\\pi} \\mathrm{rad} / \\mathrm{s}=4 \\mathrm{rad} / \\mathrm{s}$\nThe horizontal force balance reads:\n$T \\sin \\theta=M R \\omega^2$\nFrom figure $R=L \\sin \\theta$\n$\\Rightarrow T=M L \\omega^2$\nOn introducing, $\\omega=4 \\mathrm{rad} / \\mathrm{s}$\n$\\Rightarrow T=M L(4)^2=16 \\mathrm{ML}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2615e0279619d9d8a2c02", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "A string of length ' $L$ ' fixed at one end carries a mass ' $m$ ' at the other end. The string makes $\\frac{3}{\\pi}$ r.p.s. around the vertical axis through fixed end. The tension in the string is", "image": null}, "options": [{"id": "uucOH", "text": "72 mL", "image": null, "isCorrect": false}, {"id": "NMvru", "text": "18 mL", "image": null, "isCorrect": false}, {"id": "sB4cb", "text": "9 mL", "image": null, "isCorrect": false}, {"id": "WMBps", "text": "36 mL", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Consider the free body diagram\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/n2nDIlDcvH9YACKzDueWttfgWWP2x4joTl1PKGdBc08.original.fullsize.png\"><br>\nOn considering horizontal force balance:\n$\\mathrm{T} \\sin \\theta=\\mathrm{m} \\omega^2 \\mathrm{R}$\nUsing the geometry, $\\mathrm{R}=\\mathrm{L} \\sin \\theta$\n$\\therefore \\mathrm{T}=\\left(\\mathrm{m} \\omega^2 \\mathrm{~L}\\right)$\nGiven, $\\omega=\\left(\\frac{3}{\\pi}\\right)$ r.p.s. $=\\left(\\frac{3}{\\pi}\\right)(2 \\pi) \\mathrm{rad} / \\mathrm{s}=6 \\mathrm{rad} / \\mathrm{s}$\n$\\therefore \\mathrm{T}=36 \\mathrm{~mL}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261020279619d9d8a2910", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "A weightless string can support a tension up to $30 \\mathrm{~N}$. A stone of mass $0.5 \\mathrm{~kg}$ is tied to its one end and is revolved in a circular path of radius $2 \\mathrm{~m}$ in a vertical plane. Then the maximum angular velocity of the stone will be (acceleration due to gravity $g=10 \\mathrm{~m} / \\mathrm{s}^2$ )", "image": null}, "options": [{"id": "f8a74", "text": "$10 \\mathrm{rad} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "steej", "text": "$\\sqrt{60} \\mathrm{rad} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "BZ7nN", "text": "$\\sqrt{30} \\mathrm{rad} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "jcgI9", "text": "$5 \\mathrm{rad} / \\mathrm{s}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Considering force balance:\n$\\begin{aligned} & T_{\\max }=m \\omega_{\\max }^2 r+m g \\\\ & \\Rightarrow \\frac{T_{\\text {max }}}{m}=\\omega_{\\max }^2 r+g \\\\ & \\Rightarrow \\frac{30 \\mathrm{~N}}{0.5 \\mathrm{~kg}}-10 \\mathrm{~m} / \\mathrm{s}^2=\\omega_{\\max }^2 r \\\\ & \\Rightarrow \\omega_{\\max }=\\sqrt{\\frac{50}{2}}=5 \\mathrm{rad} / \\mathrm{s}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2600e0279619d9d8a2163", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}], "question": {"text": "A simple pendulum has length $2 \\mathrm{~m}$ and a bob of mass 100 gram. It is whirled in a horizontal plane. If the string breaks under a tension of $10 \\mathrm{~N}$, the angle made by the string with vertical is $\\left(\\mathrm{g}=10 \\mathrm{~m} / \\mathrm{s}^{2}\\right)$", "image": null}, "options": [{"id": "oTaG3", "text": "$\\cos ^{-1}(0 \\cdot 4)$", "image": null, "isCorrect": false}, {"id": "b4QHb", "text": "$\\cos ^{-1}(0 \\cdot 1)$", "image": null, "isCorrect": true}, {"id": "PurZW", "text": "$\\cos ^{-1}(0 \\cdot 05)$", "image": null, "isCorrect": false}, {"id": "uNu97", "text": "$\\cos ^{-1}(0 \\cdot 2)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A simple pendulum has a length of $2 \\mathrm{~m}$ and a bob of mass of $100\\mathrm{~grams}$. It is whirled in a horizontal plane. If the string breaks under a tension of $10 \\mathrm{~N}$, the angle made by the string with vertical is $\\cos ^{-1}(0.1)$.\n$\\left(g=10 \\mathrm{~m} / \\mathrm{s}^{2}\\right)$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/7x1r2ghe2Z8ZfzA_9c9P_f2SocNailvluu4iGW_QUxI.original.fullsize.png\"><br>\n$\\mathrm{L}=2 \\mathrm{~m}$\n$\\mathrm{~m}=\\frac{100}{1000}=0.1 \\mathrm{~kg}$\n$\\operatorname{Tcos} \\Phi=m g$\n$\\operatorname{Tsin} \\Phi=\\frac{m v^{2}}{R}$\n$\\cos \\Phi=\\frac{m g}{T}=\\frac{0.1 \\times 10}{10}=0.1$\n$\\therefore \\Phi=\\cos ^{-1}(0.1)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260010279619d9d8a20f6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "A rod of length 'L' is hung from its one end and a mass 'm' is attached to its free\nend. What tangential velocity must be imparted to 'm', so that it reaches the top of\nthe vertical circle? (g = acceleration due to gravity)", "image": null}, "options": [{"id": "vevui", "text": "$4 \\sqrt{\\mathrm{gL}}$", "image": null, "isCorrect": false}, {"id": "nlBfR", "text": "$2 \\sqrt{\\mathrm{gL}}$", "image": null, "isCorrect": true}, {"id": "oqs8N", "text": "$5 \\sqrt{\\mathrm{gL}}$", "image": null, "isCorrect": false}, {"id": "yqCKJ", "text": "$3 \\sqrt{\\mathrm{gL}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$2 \\sqrt{g L}$\n$h=2 L$\n$\\frac{1}{2} \\mathrm{mv}^{2}=\\mathrm{mg} 2 \\mathrm{L}$\n$v_{2}=4 g L$\n$v=2 \\sqrt{g L}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/VULKwaqe_ecg9_GP2RKf6ZYVUgIjVP6qBCi8h-AuwtQ.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
