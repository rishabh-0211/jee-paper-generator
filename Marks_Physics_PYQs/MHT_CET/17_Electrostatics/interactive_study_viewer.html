mathrm{q})}{\\mathrm{r}}\n$$\n\nGiven: Potential energy of system $=0$\n$$\n\\begin{aligned}\n\\therefore \\quad & \\mathrm{U}_1+\\mathrm{U}_2+\\mathrm{U}_3=0 \\\\\n& \\frac{\\mathrm{Kq}(2 \\mathrm{q})}{\\mathrm{r}}+\\frac{\\mathrm{KqQ}}{\\mathrm{r}}+\\frac{\\mathrm{KQ}(2 \\mathrm{q})}{\\mathrm{r}}=0 \\\\\n& 2 \\mathrm{q}+\\mathrm{Q}+2 \\mathrm{Q}=0 \\\\\n& 3 \\mathrm{Q}=-2 \\mathrm{q} \\\\\n& \\mathrm{Q}=\\frac{-2}{3} \\mathrm{q}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261f60279619d9d8a30b5", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "Potential difference between the points $\\mathrm{P}$ and $\\mathrm{Q}$ is nearly\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/r0AyCs21dLLA1aqY_MH2scVPsnGyItRZEXnciYrXt58.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "CaaGv", "text": "$6 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "YYzSu", "text": "$8 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "UG4Tm", "text": "$17 \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "BqigX", "text": "$21 \\mathrm{~V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As, the resistors across each branch are in series.\n$$\n\\begin{aligned}\n& \\mathrm{R}_1=6+3=9 \\Omega \\\\\n& \\mathrm{R}_2=8+4=12 \\Omega\n\\end{aligned}\n$$\n\nAccording to $\\mathrm{KCL}$, the current (i) will get divided inte two parts $\\mathrm{I}_1$ and $\\mathrm{I}_2$\n$$\n\\mathrm{I}_1=\\frac{\\mathrm{R}_2}{\\left(\\mathrm{R}_1+\\mathrm{R}_2^{\\prime}\\right) \\mathrm{i}}=\\frac{12}{9+12} \\times 5=2.86 \\mathrm{~A}\n$$\n\nPotential difference between $\\mathrm{P}$ and $\\mathrm{Q}$ is $\\mathrm{V}=\\mathrm{I}_1 \\mathrm{R}=2,86 \\times 6=17.14 \\mathrm{~V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261f60279619d9d8a30b2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "Two charges of equal magnitude ' $q$ ' are placed in air at a distance ' $2 r$ ' apart and third charge ' $-2 \\mathrm{q}$ ' is placed at mid point. The potential energy of the system is $\\left(\\varepsilon_0=\\right.$ permittivity of free space)", "image": null}, "options": [{"id": "IUP9h", "text": "$-\\frac{\\mathrm{q}^2}{8 \\pi \\varepsilon_0 \\mathrm{r}}$", "image": null, "isCorrect": false}, {"id": "MMLAz", "text": "$-\\frac{3 q^2}{8 \\pi \\varepsilon_0 r}$", "image": null, "isCorrect": false}, {"id": "ENfcc", "text": "$-\\frac{5 q^2}{8 \\pi \\varepsilon_0 r}$", "image": null, "isCorrect": false}, {"id": "TKnZ5", "text": "$-\\frac{7 q^2}{8 \\pi \\varepsilon_0 r}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Potential energy of ' $n$ ' point charges,\n$$\n\\mathrm{U}=\\frac{1}{4 \\pi \\varepsilon_0} \\sum_{\\text {all pairs }} \\frac{\\mathrm{q}_{\\mathrm{j}} \\mathrm{q}_{\\mathrm{k}}}{\\mathrm{r}_{\\mathrm{jk}}}\n$$\n\nFor 3 point charges,\n$$\n\\begin{aligned}\n& U=-\\frac{q(2 q)}{4 \\pi \\varepsilon_0 r}-\\frac{q(2 q)}{4 \\pi \\varepsilon_0 r}+\\frac{q(q)}{4 \\pi \\varepsilon_0(2 r)} \\\\\n& U=-\\frac{2 q^2}{4 \\pi \\varepsilon_0 r}-\\frac{2 q^2}{4 \\pi \\varepsilon_0 r}+\\frac{q^2}{4 \\pi \\varepsilon_0(2 r)} \\\\\n& U=-\\frac{4 q^2}{8 \\pi \\varepsilon_0 r}-\\frac{4 q^2}{8 \\pi \\varepsilon_0 r}+\\frac{q^2}{8 \\pi \\varepsilon_0 r} \\\\\n& U=-\\frac{7 q^2}{8 \\pi \\varepsilon_0 r}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261e30279619d9d8a3020", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "Assume that an electric field $\\mathrm{E}=30 \\mathrm{x}^2 \\mathrm{i}$ exists in space. If ' $\\mathrm{V}_0$ ' is the potential at the origin and ' $\\mathrm{V}_{\\mathrm{A}}$ is the potential at $\\mathrm{x}=2 \\mathrm{~m}$, then the potential difference $\\left(\\mathrm{V}_{\\mathrm{A}}-\\mathrm{V}_0\\right)$ is", "image": null}, "options": [{"id": "fVneZ", "text": "$-80 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "zJ9c2", "text": "$-120 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "H86e1", "text": "$80 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "W9DRR", "text": "$120 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & d V=\\vec{E} \\cdot d x \\\\ & \\int_{V_0}^{V_A} d V=-\\int_0^2 30 x^2 d x \\\\ & V_A-V_0=-\\left[10 x^3\\right]_0^2=-80 J\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261e10279619d9d8a3010", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "If a capacitor of capacity $900 \\mu \\mathrm{F}$ is charged to $100 \\mathrm{~V}$ and its total energy is transferred to a capacitor of capacity $100 \\mu \\mathrm{F}$, then its potential will be", "image": null}, "options": [{"id": "RgIQa", "text": "$30 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "s1ElW", "text": "$200 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "CLHWO", "text": "$300 \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "zx6ZB", "text": "$400 \\mathrm{~V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the unknown potential be $\\mathrm{V}_{\\mathrm{u}}$\nEnergy of a capacitor $=\\frac{1}{2} \\mathrm{CV}^2$\n$\\begin{array}{ll} \n& \\Rightarrow \\frac{1}{2} C_1 V_1^2=\\frac{1}{2} C_2\\left(V_u\\right)^2 \\\\\n& \\frac{1}{2} \\times 900 \\times 10^{-6} \\times(100)^2=\\frac{1}{2} \\times 100 \\times 10^{-6} \\times\\left(V_u\\right)^2 \\\\\n& \\left(V_u\\right)^2=9 \\times 100^2 \\\\\n\\therefore \\quad & V_u=300 \\mathrm{~V}\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261bb0279619d9d8a2ee6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "When a charge of $3 \\mathrm{C}$ is placed in uniform electric field, it experiences a force of $3000 \\mathrm{~N}$. Within this field, potential difference between two points separated by a distance of $1 \\mathrm{~cm}$ is", "image": null}, "options": [{"id": "paYef", "text": "$10 \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "rs5Ak", "text": "$90 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "AmsY2", "text": "$1000 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "UmLlr", "text": "$3000 \\mathrm{~V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Electric force, $F=q E$ and potential difference, $\\mathrm{V}=\\mathrm{Ed}$\n$\\therefore \\quad \\mathrm{V}=\\frac{\\mathrm{Fd}}{\\mathrm{q}}=\\frac{3000 \\times 10^{-2}}{3}=10 \\mathrm{~V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261950279619d9d8a2db8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "Three charges $Q,+q$ and $+q$ are placed at the vertices of right-angle triangle as shown. The net electrostatic energy of the configuration is zero. The value of $Q$ is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/Dr8jqm9ycKeAX9xRO6dp3YIja34fR7lJSeRkf-FGU2I.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "Zc2AR", "text": "$-2 q$", "image": null, "isCorrect": false}, {"id": "KpmEB", "text": "$-\\frac{q}{1+\\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "8IeNd", "text": "$+q$", "image": null, "isCorrect": false}, {"id": "qv3XT", "text": "$\\frac{-\\sqrt{2} q}{\\sqrt{2}+1}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The potential energy of the system can be written pair-wise as follows:\n$\\begin{aligned}\n& U=\\frac{k Q q}{l}+\\frac{k q q}{l}+\\frac{k Q q}{\\sqrt{2} l}=0 \\\\\n& Q=-\\frac{\\sqrt{2} q}{\\sqrt{2}+1}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261620279619d9d8a2c21", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "Assume that an electric field $E=20 x^2 \\hat{i}$ exists in space. If $V_0$ is the potential at the origin and $V_A$ is the potential at $x=3 \\mathrm{~m}$ then, the potential difference $V_A-V_0$ in volts is", "image": null}, "options": [{"id": "As8aR", "text": "-80", "image": null, "isCorrect": false}, {"id": "gFIjQ", "text": "-220", "image": null, "isCorrect": false}, {"id": "YOmFK", "text": "-180", "image": null, "isCorrect": true}, {"id": "Rnu6l", "text": "-120", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Concept: electric field is defined as,\n$(-\\overrightarrow{\\mathrm{E}} \\cdot \\overrightarrow{\\mathrm{d} l})=\\mathrm{d} V$\nGiven $\\vec{E}=20 x^2 \\hat{i}$ and $\\overrightarrow{\\mathrm{d} l}=\\mathrm{d} x \\hat{i}$\n$\\therefore\\left(-20 x^2 \\mathrm{~d} x\\right)=\\mathrm{d} V$\nIntegrating between, $x=0$ to $3 \\mathrm{~m}$\n$\\begin{aligned}\n& -\\int_0^3 20 x^2 \\mathrm{~d} x=\\int_{V_0}^{V_A} \\mathrm{~d} V \\\\\n& \\Rightarrow\\left(V_A-V_0\\right)=(-20) \\times\\left.\\left(\\frac{x^3}{3}\\right)\\right|_0 ^3 \\mathrm{~V}=(-180) \\mathrm{V}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261020279619d9d8a290f", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "Four electric charges $+q,+q,-q$ and $-q$ are placed in order at the corners of a square of side $2 r$. The electric potential at a point midway between the two negative charges is", "image": null}, "options": [{"id": "24yzl", "text": "$\\frac{1}{4 \\pi \\varepsilon_0} \\frac{2 q}{r}[1-\\sqrt{5}]$", "image": null, "isCorrect": false}, {"id": "x2XSI", "text": "$\\frac{1}{4 \\pi \\varepsilon_0} \\frac{2 q}{r}\\left[\\frac{1}{\\sqrt{5}}+1\\right]$", "image": null, "isCorrect": false}, {"id": "W50NM", "text": "$\\frac{1}{4 \\pi \\varepsilon_0} \\frac{2 q}{r}\\left[\\frac{1}{\\sqrt{5}}-1\\right]$", "image": null, "isCorrect": true}, {"id": "5le3Q", "text": "Zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Consider the following figure:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/LDrdNuEXF7vnfmnMsd6C4U3YkNHcldtabVxuLlHwv9s.original.fullsize.png\">\n$D P=P C=r$ and $A P=B P=\\sqrt{A D^2+D P^2}=\\sqrt{r^2+(2 r)^2}=\\sqrt{5} r$\nPotential at $P$ is $V_P=\\frac{1}{4 \\pi \\varepsilon_0}\\left[\\frac{q}{A P}+\\frac{-q}{C P}+\\frac{-q}{D P}+\\frac{q}{B P}\\right]$\n$\\Rightarrow V_A=\\frac{1}{4 \\pi \\varepsilon_0} V_A\\left[\\frac{-q}{r}+\\frac{+q}{r \\sqrt{5}}+\\frac{+q}{r \\sqrt{5 L}}+\\frac{-q}{r}\\right]=\\frac{1}{4 \\pi \\varepsilon_0} \\frac{2 q}{r}\\left(\\frac{1}{\\sqrt{5}}-1\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260ef0279619d9d8a2878", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}], "question": {"text": "Consider the following statement about electric field intensity and electric potential.\nA. The electric field intensity due to a charged spherical shell is inversely proportional to square of its radius.\nB. The electric potential due to a point charge is inversely proportional to the distance between charge and the point.", "image": null}, "options": [{"id": "bINtF", "text": "Both A and B are incorrect", "image": null, "isCorrect": false}, {"id": "kjfB2", "text": "Only B is correct", "image": null, "isCorrect": true}, {"id": "hWQz9", "text": "Only A is correct", "image": null, "isCorrect": false}, {"id": "7czU9", "text": "Both A and B are correct", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Only B is true. As for statement A, it is not mentioned whether the point in outside or inside the shell, further statement A is true only for the point on the surface of the spherical shell.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260db0279619d9d8a27db", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}], "question": {"text": "Three isolated metal spheres A, B, C have radius R, 2R, 3R respectively, and the same charge, $Q . U_A, U_B$ and $U_C$ be the energy density just outside the surface of the spheres. The relation between $\\mathrm{U}_{\\mathrm{A},} \\mathrm{U}_{\\mathrm{B}}$ and $\\mathrm{U}_{\\mathrm{C}}$ is", "image": null}, "options": [{"id": "g4NYU", "text": "$\\mathrm{U}_{\\mathrm{A}}>\\mathrm{U}_{\\mathrm{B}}<\\mathrm{U}_{\\mathrm{C}}$", "image": null, "isCorrect": false}, {"id": "XK1xg", "text": "$\\mathrm{U}_{\\mathrm{A}}>\\mathrm{U}_{\\mathrm{B}}>\\mathrm{U}_{\\mathrm{C}}$", "image": null, "isCorrect": true}, {"id": "RI18J", "text": "$\\mathrm{U}_{\\mathrm{A}}<\\mathrm{U}_{\\mathrm{B}}<\\mathrm{U}_{\\mathrm{C}}$", "image": null, "isCorrect": false}, {"id": "83Ayn", "text": "$\\mathrm{U}_{\\mathrm{A}}<\\mathrm{U}_{\\mathrm{B}}>\\mathrm{U}_{\\mathrm{C}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The correct option is (B).\nConcept: Energy density in the free space is given by, $\\mathrm{U}=\\frac{1}{2} \\varepsilon_0 \\mathrm{E}^2$\nThe electric field for an isolated sphere is $E=\\frac{Q}{2 \\pi \\varepsilon_0 r^2}$\nTherefore, Energy density $U \\propto \\frac{1}{\\mathrm{r}^4}$\nAnd, $\\mathrm{U}_{\\mathrm{A}}>\\mathrm{U}_{\\mathrm{B}}>\\mathrm{U}_{\\mathrm{C}}$ is the correct trend.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260ca0279619d9d8a2753", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "Four electric charges $+\\mathrm{q},+\\mathrm{q},-\\mathrm{q}$ and $-\\mathrm{q}$ are placed in order at the corners of a square of side $2 \\mathrm{~L}$. The electric potential at point midway between the two positive charges is", "image": null}, "options": [{"id": "2xZrC", "text": "$\\frac{1}{4 \\pi \\epsilon_0} \\frac{2 \\mathrm{q}}{\\mathrm{L}}(1-\\sqrt{5})$", "image": null, "isCorrect": false}, {"id": "x5jVO", "text": "zero", "image": null, "isCorrect": false}, {"id": "GtPVJ", "text": "$\\frac{1}{4 \\pi \\epsilon_0} \\frac{2 \\mathrm{q}}{\\mathrm{L}}\\left(1+\\frac{1}{\\sqrt{5}}\\right)$", "image": null, "isCorrect": false}, {"id": "Rgnny", "text": "$\\frac{1}{4 \\pi \\in_0} \\frac{2 \\mathrm{q}}{\\mathrm{L}}\\left(1-\\frac{1}{\\sqrt{5}}\\right)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/5wF8PPJLpVONO47MyOZj9eNRC8VaplA5ZP5NskOWv8I.original.fullsize.png\"><br>\n$\\begin{aligned}\n& \\mathrm{DP}=\\sqrt{5} \\mathrm{~L}=\\mathrm{CP} \\\\\n& \\mathrm{AP}=\\mathrm{BP}=\\mathrm{L}\n\\end{aligned}$\nPotential at point $\\mathrm{P}$ due to the four charges\n$\\begin{aligned}\n& \\mathrm{V}=\\frac{1}{4 \\pi \\varepsilon_0}\\left(\\frac{\\mathrm{q}}{\\mathrm{L}}+\\frac{\\mathrm{q}}{\\mathrm{L}}-\\frac{\\mathrm{q}}{\\sqrt{5} \\mathrm{~L}}-\\frac{\\mathrm{q}}{\\sqrt{5} \\mathrm{~L}}\\right) \\\\\n& =\\frac{1}{4 \\pi \\varepsilon_0}\\left(\\frac{2 \\mathrm{q}}{\\mathrm{L}}-\\frac{2 \\mathrm{q}}{\\sqrt{5} \\mathrm{~L}}\\right) \\\\\n& =\\frac{1}{4 \\pi \\varepsilon_0} \\cdot \\frac{2 \\mathrm{q}}{\\mathrm{L}}\\left(1-\\frac{1}{\\sqrt{5}}\\right)\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260ba0279619d9d8a26d2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "Three charges $-\\mathrm{q}, \\mathrm{Q}$ and $-\\mathrm{q}$ are placed at equal distances on a straight line. If the total potential energy of the system of three charges is zero, then the ratio $\\frac{\\mathrm{Q}}{\\mathrm{q}}$ is", "image": null}, "options": [{"id": "ZYlQ3", "text": "1 : 2", "image": null, "isCorrect": false}, {"id": "O6Gy7", "text": "1 : 1", "image": null, "isCorrect": false}, {"id": "0RQvF", "text": "1 : 4", "image": null, "isCorrect": true}, {"id": "ZsBgm", "text": "1 : 3", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/IpQknyOuvbdxhhoSasamm-mbb4slOvbOQ52HTiILJSo.original.fullsize.png\"><br>\nPotential energy of the system is zero.\n$$\n\\begin{aligned}\n& \\therefore \\frac{1}{4 \\pi \\varepsilon_0}\\left(\\frac{-\\mathrm{q} \\cdot \\mathrm{Q}}{\\mathrm{x}}+\\frac{-\\mathrm{q} \\cdot \\mathrm{Q}}{\\mathrm{x}}+\\frac{(-\\mathrm{q})(-\\mathrm{q})}{2 \\mathrm{x}}\\right)=0 \\\\\n& \\therefore-2 \\mathrm{qQ}+\\frac{\\mathrm{q}^2}{2}=0 \\\\\n& \\therefore 2 \\mathrm{Q}=\\frac{\\mathrm{q}}{2} \\text { or } \\frac{\\mathrm{Q}}{\\mathrm{q}}=\\frac{1}{4}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260a50279619d9d8a2631", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "In hydrogen atom an electron revolves around a proton (in nucleus) at a distance ' $r$ ' $m$. the intensity of electric field due to the proton at distance ' $r$ ' is $5 \\times 10^{11} \\mathrm{NC}^{-1}$, the magnitude of force between the electron and proton is [charge on electron $=1.6 \\times 10^{-19} \\mathrm{C}$ ]", "image": null}, "options": [{"id": "7hOcn", "text": "$4 \\times 10^8 \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "QrC5t", "text": "$8 \\times 10^8 \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "8Fr8P", "text": "$4 \\times 10^{-8} \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "N1twB", "text": "$8 \\times 10^{-8} \\mathrm{~N}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & F=q E=1.6 \\times 10^{-19} \\times 5 \\times 10^{11} \\\\ & =8 \\times 10^{-8} \\mathrm{~N}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260a30279619d9d8a2620", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "A charged spherical conductor has radius ' $r$ '. The potential difference between its surface and a point at a distance ' $3 r$ ' from the center is ' $\\mathrm{V}$ ' The electric intensity at a distance ' $3 \\mathrm{r}$ ' from the centre of the conductor is", "image": null}, "options": [{"id": "qMbbP", "text": "$\\frac{\\mathrm{V}}{8 \\mathrm{r}}$", "image": null, "isCorrect": false}, {"id": "hBNAI", "text": "$\\frac{\\mathrm{V}}{2 \\mathrm{r}}$", "image": null, "isCorrect": false}, {"id": "JmxEG", "text": "$\\frac{\\mathrm{V}}{4 \\mathrm{r}}$", "image": null, "isCorrect": false}, {"id": "eZicb", "text": "$\\frac{\\mathrm{V}}{6 \\mathrm{r}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{V}=\\frac{\\mathrm{q}}{4 \\pi \\varepsilon_0 \\mathrm{r}}\\left[1-\\frac{1}{3}\\right]=\\frac{2}{3} \\cdot \\frac{\\mathrm{q}}{4 \\pi \\varepsilon_0 \\mathrm{r}} \\\\ & \\mathrm{E}=\\frac{\\mathrm{q}}{4 \\pi \\varepsilon_0} \\frac{1}{(3 \\mathrm{r})^2}=\\frac{\\mathrm{q}}{4 \\pi \\varepsilon_0} \\cdot \\frac{1}{9 \\mathrm{r}^2} \\\\ & \\frac{\\mathrm{E}}{\\mathrm{V}}=\\frac{1}{6 \\mathrm{r}} \\\\ & \\therefore \\mathrm{E}=\\frac{\\mathrm{V}}{6 \\mathrm{r}}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260930279619d9d8a259e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "Let $\\mathrm{A}, \\mathrm{B}$ and $\\mathrm{C}$ be the three points in a uniform electric field $(\\overrightarrow{\\mathrm{E}})$ as shown. The electric potential is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/JnrpAwphAvJhUovjP9rS25YPWudXblyWUjqKYM12qKE.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "8GyLq", "text": "maximum at point C", "image": null, "isCorrect": false}, {"id": "mPadx", "text": "maximum at point A", "image": null, "isCorrect": false}, {"id": "KF8wm", "text": "maximum at point B", "image": null, "isCorrect": true}, {"id": "USV0t", "text": "same at all points A,B and C", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The electric potential decreases in the direction of the field. Hence potential is maximum at $\\mathrm{B}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2607f0279619d9d8a24fa", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "Two spherical conductors of radii $4 \\mathrm{~cm}$ and $5 \\mathrm{~cm}$ are charged to the same potential. If ' $\\sigma_1$ ' and ' $\\sigma_2$ ' be the respective value of the surface density of charge on the two conductors then the ratio $\\sigma_1: \\sigma_2$ is", "image": null}, "options": [{"id": "18hL5", "text": "5:4", "image": null, "isCorrect": true}, {"id": "zBxvp", "text": "3:2", "image": null, "isCorrect": false}, {"id": "rsxjT", "text": "4:3", "image": null, "isCorrect": false}, {"id": "s2NER", "text": "2:1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Spheres are at the same potential\n$$\n\\begin{aligned}\n& \\therefore \\mathrm{V}=\\frac{1}{4 \\pi \\varepsilon_0} \\cdot \\frac{\\mathrm{q}_1}{\\mathrm{r}_1}=\\frac{1}{4 \\pi \\varepsilon_0} \\cdot \\frac{\\mathrm{q}_2}{\\mathrm{r}_2} \\\\\n& \\therefore \\frac{\\mathrm{q}_1}{\\mathrm{q}_2}=\\frac{\\mathrm{r}_1}{\\mathrm{r}_2} \\\\\n& \\sigma_1=\\frac{\\mathrm{q}_1}{4 \\pi \\mathrm{r}_1^2}, \\sigma_2=\\frac{\\mathrm{q}_2}{4 \\pi \\mathrm{r}_2^2} \\\\\n& \\therefore \\frac{\\sigma_1}{\\sigma_2}=\\frac{\\mathrm{q}_1}{\\mathrm{q}_2} \\cdot \\frac{\\mathrm{r}_2^2}{\\mathrm{r}_1^2}=\\frac{\\mathrm{r}_1}{\\mathrm{r}_2} \\cdot \\frac{\\mathrm{r}_2^2}{\\mathrm{r}_1^2}=\\frac{\\mathrm{r}_2}{\\mathrm{r}_1}=\\frac{5}{4}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2607e0279619d9d8a24f3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "Two particles A and B having same mass have charge $+q$ and $+4 \\mathrm{q}$ respectively. When they are allowed to fall from rest through same electric potential difference, of ratio of their speeds ' $V_A$ ' to ' $V_B$ ' will become", "image": null}, "options": [{"id": "8pkkO", "text": "1:2", "image": null, "isCorrect": true}, {"id": "AlwDo", "text": "2:1", "image": null, "isCorrect": false}, {"id": "8KzUb", "text": "1:4", "image": null, "isCorrect": false}, {"id": "mdxoG", "text": "4:1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If $\\mathrm{V}$ is the potential difference then\n$$\n\\begin{aligned}\n& \\frac{1}{2} \\mathrm{~m} v_{\\mathrm{A}}^2=\\mathrm{qV} \\\\\n& \\text { and } \\frac{1}{2} \\mathrm{~m} v_{\\mathrm{B}}^2=4 \\mathrm{qV} \\\\\n& \\therefore \\frac{v_{\\mathrm{A}}^2}{v_{\\mathrm{B}}^2}=\\frac{1}{4} \\\\\n& \\therefore \\frac{v_{\\mathrm{A}}}{v_{\\mathrm{B}}}=\\frac{1}{2}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260590279619d9d8a23c5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "A hollow metal sphere has a radius ' $r$ '. The potential difference between a point on its surface and at a point at a distance ' $3 r$ ' from its center is ' $\\mathrm{V}$ '. The electric intensity at the distance ' $3 \\mathrm{r}$ ' from the center of the sphere will be", "image": null}, "options": [{"id": "W44Xs", "text": "$\\frac{\\mathrm{V}}{3 \\mathrm{r}}$", "image": null, "isCorrect": false}, {"id": "zGIwM", "text": "$3 \\mathrm{Vr}$", "image": null, "isCorrect": false}, {"id": "wPKlE", "text": "$\\frac{\\mathrm{V}}{\\mathrm{r}}$", "image": null, "isCorrect": false}, {"id": "xlXdP", "text": "$\\frac{\\mathrm{V}}{6 \\mathrm{r}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let the charge on the sphere is Q.\n$$\n\\begin{aligned}\n& \\mathrm{V}=\\frac{\\mathrm{kQ}}{\\mathrm{r}}-\\frac{\\mathrm{kQ}}{3 \\mathrm{r}}=\\frac{2 \\mathrm{kQ}}{3 \\mathrm{r}} \\\\\n& \\Rightarrow \\mathrm{kQ}=\\frac{3 \\mathrm{Vr}}{2} \\\\\n& \\mathrm{E}=\\frac{\\mathrm{kQ}}{(3 \\mathrm{r})^2}=\\frac{1}{(3 \\mathrm{r})^2} \\cdot \\frac{3 \\mathrm{Vr}}{2}=\\frac{\\mathrm{V}}{6 \\mathrm{r}}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260380279619d9d8a22bb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "A uniformly charge half ring of a radius ' $R$ ' has linear charge density ' $\\sigma$ '. The electric potential at the centre of the half ring is $\\left(\\epsilon_0=\\right.$ permittivity of free space)", "image": null}, "options": [{"id": "3IyF0", "text": "$\\frac{\\sigma}{6 \\epsilon_0}$", "image": null, "isCorrect": false}, {"id": "9n7iR", "text": "$\\frac{\\sigma}{2 \\epsilon_0}$", "image": null, "isCorrect": false}, {"id": "HA0kk", "text": "$\\frac{\\sigma}{\\epsilon_0}$", "image": null, "isCorrect": false}, {"id": "QlDjO", "text": "$\\frac{\\sigma}{4 \\epsilon_0}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "If $\\mathrm{q}$ is charge on the ring, then the potential at the centre is given by\n$$\n\\mathrm{V}=\\frac{1}{4 \\pi \\varepsilon_0} \\cdot \\frac{\\mathrm{q}}{\\mathrm{R}}\n$$\nBut $\\mathrm{q}=\\sigma \\times \\pi \\mathrm{R}$\n$$\n\\therefore \\mathrm{V}=\\frac{1}{4 \\pi \\varepsilon_0} \\cdot \\frac{\\sigma \\pi \\mathrm{R}}{\\mathrm{R}}=\\frac{\\sigma}{4 \\varepsilon_0}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260250279619d9d8a221b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "A hollow charged metal sphere has radius ' $R$ '. If the potential difference between its surface and a point at a distance ' $5 \\mathrm{R}$ ' from the centre is V, then magnitude of electric field Intensity at a distance ' $5 \\mathrm{R}$ ' from the centre of sphere is", "image": null}, "options": [{"id": "Bz36w", "text": "$\\frac{\\mathrm{V}}{2 \\mathrm{R}}$", "image": null, "isCorrect": false}, {"id": "mBVOz", "text": "$\\frac{\\mathrm{V}}{20 \\mathrm{R}}$", "image": null, "isCorrect": true}, {"id": "V6B2K", "text": "$10 \\mathrm{VR}$", "image": null, "isCorrect": false}, {"id": "AWfe2", "text": "$20 \\mathrm{VR}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{V}=\\frac{1}{4 \\pi \\in_0} \\frac{\\mathrm{q}}{\\mathrm{R}}-\\frac{1}{4 \\pi \\in_0} \\frac{\\mathrm{q}}{5 \\mathrm{R}} \\\\ & =\\frac{1}{4 \\pi \\in_0} \\frac{\\mathrm{q}}{\\mathrm{R}}\\left(1-\\frac{1}{5}\\right) \\\\ & =\\frac{1}{4 \\pi \\in_0} \\frac{\\mathrm{q}}{\\mathrm{R}}\\left(\\frac{4}{5}\\right) \\\\ & \\mathrm{E}=\\frac{1}{4 \\pi \\varepsilon_0} \\frac{\\mathrm{q}}{(5 \\mathrm{R})^2} \\\\ & \\therefore \\frac{\\mathrm{E}}{\\mathrm{V}}=\\frac{1}{20 \\mathrm{R}} \\text { or } \\mathrm{E}=\\frac{\\mathrm{V}}{20 \\mathrm{R}}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e880279619d9d8a1530", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "Three particles, each having a charge of $10 \\mu \\mathrm{C}$ are placed at the corners of an equilateral triangle of side 10 cm. The electrostatic potential energy of the system is $\\left(\\right.$ Given $\\left.\\frac{1}{4 \\pi \\varepsilon_{0}}=9 \\times 10^{9} \\mathrm{~N}-\\mathrm{m}^{2} \\mathrm{C}^{2}\\right)$", "image": null}, "options": [{"id": "jvern", "text": "Zero", "image": null, "isCorrect": false}, {"id": "FA7wD", "text": "$\\infty$", "image": null, "isCorrect": false}, {"id": "1FHHW", "text": "$27 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "6m7QC", "text": "$100 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a pair of charges\n$$\n\\begin{array}{c}\nU=\\frac{1}{4 \\pi \\varepsilon_{0}} \\frac{q_{1} q_{2}}{r} \\\\\nU_{\\text {system }}=\\frac{1}{4 \\pi \\varepsilon_{0}}\\left[\\frac{10 \\times 10^{-6} \\times 10 \\times 10^{-6}}{10 / 100}\\right. \\\\\n+\\frac{10 \\times 10^{-6} \\times 10 \\times 10^{-6}}{10 / 100} \\\\\n\\left.+\\frac{10 \\times 10^{-6} \\times 10 \\times 10^{-6}}{10 / 100}\\right] \\\\\n=3 \\times 9 \\times 10^{9} \\times \\frac{100 \\times 10^{-12} \\times 100}{10} \\\\\n=27 \\mathrm{~J}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e3e0279619d9d8a12db", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "Potentiometer measures the potential difference more accurately than a voltmeter because", "image": null}, "options": [{"id": "LrCJo", "text": "it has a wire of high resistance", "image": null, "isCorrect": false}, {"id": "XYKGi", "text": "it has a wire of low resistance", "image": null, "isCorrect": false}, {"id": "UDb9J", "text": "it does not draw current from external circuit", "image": null, "isCorrect": true}, {"id": "TLtOx", "text": "it draws a heavy current from external circuit", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When we measure the emf of a cell by the potentiometer then no current flows in the circuit in zero-deflection condition ie, cell is in open circuit. Thus, in this condition the actual value of a cell is found. In this way, potentiometer is equivalent to an ideal voltmeter of infinite resistance.\n\nNote The emf in the potentiometer is measured by null method in which zero deflection position is found on the wire.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "65a263270279619d9d8a3c71", "title": "Electric Dipole", "totalQuestions": 22, "questions": [{"_id": "6abb88cd15a9fc0fc8c14721", "type": "singleCorrect", "question": {"text": "Polar molecules are those in which", "image": null}, "options": [{"id": "EKe6R", "label": "A", "text": "they have symmetric shape.", "isCorrect": false, "image": null}, {"id": "DaOlw", "label": "B", "text": "centre of mass of positive charges does not coincide with centre of mass of negative charges.", "isCorrect": true, "image": null}, {"id": "VqLoK", "label": "C", "text": "they have no permanent dipole moments.", "isCorrect": false, "image": null}, {"id": "qFfjQ", "label": "D", "text": "centre of mass of positive charges coincide with centre of mass of negative charges.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In polar molecules, the centre of mass of positive charges (protons) does not coincide with the centre of mass of negative charges (electrons). This separation of charges results in a net permanent electric dipole moment.<br><br>If the centres of mass of positive and negative charges coincide, the molecule is non-polar and has zero permanent dipole moment. Symmetric molecules are generally non-polar.<br><br>Answer: centre of mass of positive charges does not coincide with centre of mass of negative charges.", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889e15a9fc0fc8c14564", "type": "singleCorrect", "question": {"text": "A dipole of electric dipole moment $\\vec{P}$ is placed in an electric field of strength $\\vec{E}$. The angle between $\\vec{P}$ and $\\vec{E}$ for which the potential energy of the electric dipole is maximum, is", "image": null}, "options": [{"id": "jYKE4", "label": "A", "text": "$\\cos^{-1}(1)$", "isCorrect": false, "image": null}, {"id": "0mVqB", "label": "B", "text": "$\\cos^{-1}(-1)$", "isCorrect": true, "image": null}, {"id": "o53Ie", "label": "C", "text": "$\\sin^{-1}(1)$", "isCorrect": false, "image": null}, {"id": "gTHb1", "label": "D", "text": "$\\sin^{-1}(-1)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The potential energy $U$ of an electric dipole in a uniform electric field is given by<br><br>$U = -\\vec{P} \\cdot \\vec{E} = -PE \\cos \\theta$<br><br>where $\\theta$ is the angle between the dipole moment $\\vec{P}$ and the electric field $\\vec{E}$.<br><br>For the potential energy to be maximum, the value of $\\cos \\theta$ must be minimum.<br><br>The minimum value of $\\cos \\theta$ is $-1$.<br><br>$\\cos \\theta = -1$<br><br>$\\theta = \\cos^{-1}(-1)$<br><br>This corresponds to an angle of $180^{\\circ}$, which is the position of unstable equilibrium.<br><br>Answer: $\\cos^{-1}(-1)$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a48c30a4553e1bdb3d", "type": "singleCorrect", "question": {"text": "Select the 'WRONG' statement about polar molecules.", "image": null}, "options": [{"id": "fDjqx", "label": "A", "text": "A molecule in which centre of mass of positive charges does not coincide with the centre of mass of negative charges is a polar molecule.", "isCorrect": false, "image": null}, {"id": "NzhbA", "label": "B", "text": "They have permanent dipole moment.", "isCorrect": false, "image": null}, {"id": "96PCS", "label": "C", "text": "They act as tiny electric dipoles.", "isCorrect": false, "image": null}, {"id": "HWPPr", "label": "D", "text": "They have symmetrical shape.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "A polar molecule is one in which the centre of mass of positive charges does not coincide with the centre of mass of negative charges.<br><br>Because of this separation of charges, polar molecules possess a permanent electric dipole moment and act as tiny electric dipoles.<br><br>For a molecule to be polar, its individual bond dipoles must not cancel each other out, which typically requires an asymmetrical shape. Symmetrical molecules generally have a net zero dipole moment and are non-polar.<br><br>Therefore, the statement that polar molecules have a symmetrical shape is incorrect.<br><br>Answer: They have symmetrical shape.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f78c30a4553e1bdeb9", "type": "singleCorrect", "question": {"text": "Two electric dipoles of moment $P$ and $8P$ are placed in opposite directions on a line at a distance of $24$ cm. The electric field will be zero at the point between the dipoles whose distance from the dipole of moment $P$ will be $x_1$. When $8P$ is replaced by $27P$ keeping all other quantities the same, the distance $x_1$ now becomes $x_2$. The difference $|x_2 - x_1|$ is ( All the distances are measured from the centers of the dipole.)", "image": null}, "options": [{"id": "qpVKc", "label": "A", "text": "$2$ cm", "isCorrect": true, "image": null}, {"id": "Slzaz", "label": "B", "text": "$4$ cm", "isCorrect": false, "image": null}, {"id": "ddq8P", "label": "C", "text": "$6$ cm", "isCorrect": false, "image": null}, {"id": "oPVw1", "label": "D", "text": "$8$ cm", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the distance of the null point from the dipole of moment $P$ be $x$. The distance from the second dipole is $24 - x$.<br><br>The electric field due to a short dipole on its axis at a distance $r$ is given by $E = \\dfrac{2kP}{r^3}$.<br><br>For the net electric field to be zero, the magnitudes of the electric fields due to both dipoles must be equal.<br><br>Case 1: Dipoles are $P$ and $8P$<br>$\\dfrac{2kP}{x_1^3} = \\dfrac{2k(8P)}{(24 - x_1)^3}$<br><br>Taking the cube root on both sides:<br>$\\dfrac{1}{x_1} = \\dfrac{2}{24 - x_1}$<br><br>$24 - x_1 = 2x_1 \\Rightarrow 3x_1 = 24 \\Rightarrow x_1 = 8$ cm<br><br>Case 2: Dipole $8P$ is replaced by $27P$<br>$\\dfrac{2kP}{x_2^3} = \\dfrac{2k(27P)}{(24 - x_2)^3}$<br><br>Taking the cube root on both sides:<br>$\\dfrac{1}{x_2} = \\dfrac{3}{24 - x_2}$<br><br>$24 - x_2 = 3x_2 \\Rightarrow 4x_2 = 24 \\Rightarrow x_2 = 6$ cm<br><br>The difference is $|x_2 - x_1| = |6 - 8| = 2$ cm.<br><br>Answer: $2$ cm", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3248c30a4553e1be09a", "type": "singleCorrect", "question": {"text": "When a dipole placed parallel to electric field is rotating through $\\pi^c$, the work done is W. The work done in rotating the dipole through $\\left(\\dfrac{\\pi}{3}\\right)^c$ is<br>($\\cos 0^\\circ = 1$, $\\cos 60^\\circ = \\dfrac{1}{2}$, $\\cos 180^\\circ = -1$)", "image": null}, "options": [{"id": "cULin", "label": "A", "text": "$\\dfrac{W}{4}$", "isCorrect": true, "image": null}, {"id": "nkgJU", "label": "B", "text": "$\\dfrac{W}{2}$", "isCorrect": false, "image": null}, {"id": "VbgjO", "label": "C", "text": "$W$", "isCorrect": false, "image": null}, {"id": "e2DYh", "label": "D", "text": "$2W$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Work done in rotating a dipole in a uniform electric field from angle $\\theta_1$ to $\\theta_2$ is given by $W = pE(\\cos\\theta_1 - \\cos\\theta_2)$.<br><br>Initially, the dipole is parallel to the electric field, so $\\theta_1 = 0$.<br><br>When rotated through $\\pi$, $\\theta_2 = \\pi$.<br><br>$W = pE(\\cos 0 - \\cos \\pi) = pE(1 - (-1)) = 2pE$<br><br>$\\Rightarrow pE = \\dfrac{W}{2}$<br><br>When rotated through $\\dfrac{\\pi}{3}$, $\\theta_2 = \\dfrac{\\pi}{3}$.<br><br>$W' = pE\\left(\\cos 0 - \\cos \\dfrac{\\pi}{3}\\right) = pE\\left(1 - \\dfrac{1}{2}\\right) = \\dfrac{pE}{2}$<br><br>Substituting $pE = \\dfrac{W}{2}$, we get:<br><br>$W' = \\dfrac{1}{2} \\left(\\dfrac{W}{2}\\right) = \\dfrac{W}{4}$<br><br>Answer: $\\dfrac{W}{4}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c28c30a4553e1bdc7f", "type": "singleCorrect", "question": {"text": "Select the WRONG statement about polar molecules.", "image": null}, "options": [{"id": "mSMoL", "label": "A", "text": "Polar molecules have permanent dipole moment.", "isCorrect": false, "image": null}, {"id": "xdlDk", "label": "B", "text": "A molecule in which centre of mass of positive charges does not coincide with the centre of mass of negative charges is a polar molecule.", "isCorrect": false, "image": null}, {"id": "IJ6Gg", "label": "C", "text": "Polar molecules have symmetrical shape.", "isCorrect": true, "image": null}, {"id": "DfwLW", "label": "D", "text": "Polar molecules act as tiny electric dipoles.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In a polar molecule, the centre of mass of positive charges does not coincide with the centre of mass of negative charges. This separation of charges results in a permanent electric dipole moment, causing the molecule to act as a tiny electric dipole.<br><br>Because the charge distribution is uneven, polar molecules generally have an asymmetrical shape. Symmetrical molecules (like $\\text{CO}_2$ or $\\text{CH}_4$) have their centres of positive and negative charges coinciding, resulting in a net zero dipole moment, making them non-polar.<br><br>Therefore, the statement that polar molecules have a symmetrical shape is incorrect.<br><br>Answer: Polar molecules have symmetrical shape.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c08c30a4553e1bdc6a", "type": "singleCorrect", "question": {"text": "An electric dipole of length $3\\text{cm}$ is placed with its axis making an angle of $60^\\circ$ with a uniform electric field of $5 \\times 10^4$ N/C. It experiences a torque of $9\\sqrt{3}$ Nm. The magnitude of charge on the dipole is $(\\sin 60^\\circ = \\dfrac{\\sqrt{3}}{2})$", "image": null}, "options": [{"id": "05rrh", "label": "A", "text": "$0.6 \\times 10^{-2}$ C", "isCorrect": false, "image": null}, {"id": "HIfy8", "label": "B", "text": "$1.2 \\times 10^{-2}$ C", "isCorrect": true, "image": null}, {"id": "y13qk", "label": "C", "text": "$1.8 \\times 10^{-2}$ C", "isCorrect": false, "image": null}, {"id": "CmpW6", "label": "D", "text": "$2.4 \\times 10^{-2}$ C", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The torque experienced by an electric dipole in a uniform electric field is given by $\\tau = pE \\sin\\theta$<br><br>Since the dipole moment is $p = q \\times d$, where $d$ is the length of the dipole, the equation becomes:<br><br>$\\tau = q \\times d \\times E \\sin\\theta$<br><br>Given $\\tau = 9\\sqrt{3}$ Nm, $d = 3 \\times 10^{-2}$ m, $E = 5 \\times 10^4$ N/C, and $\\theta = 60^\\circ$. Substituting these values:<br><br>$9\\sqrt{3} = q \\times (3 \\times 10^{-2}) \\times (5 \\times 10^4) \\times \\sin 60^\\circ$<br><br>$9\\sqrt{3} = q \\times 1500 \\times \\dfrac{\\sqrt{3}}{2}$<br><br>$18 = 1500 q$<br><br>$q = \\dfrac{18}{1500} = 1.2 \\times 10^{-2}$ C<br><br>Answer: $1.2 \\times 10^{-2}$ C", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2cf8c30a4553e1bdd0c", "type": "singleCorrect", "question": {"text": "An electric dipole of length $0.5\\ \\mu\\text{m}$ is placed with its axis making an angle of $30^\\circ$ with uniform electric field $10^4\\ \\text{V/m}$. If it experiences a torque of $5 \\times 10^{-9}\\ \\text{Nm}$, the magnitude of the charge on the dipole is ($\\sin 30^\\circ = 0.5$)", "image": null}, "options": [{"id": "u8pQr", "label": "A", "text": "$1\\ \\mu\\text{C}$", "isCorrect": false, "image": null}, {"id": "cuxAo", "label": "B", "text": "$1.5\\ \\mu\\text{C}$", "isCorrect": false, "image": null}, {"id": "pzloM", "label": "C", "text": "$2\\ \\mu\\text{C}$", "isCorrect": true, "image": null}, {"id": "FCmQT", "label": "D", "text": "$2.5\\ \\mu\\text{C}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The torque experienced by an electric dipole in a uniform electric field is given by<br><br>$\\tau = pE \\sin\\theta$<br><br>where $p = qd$ is the dipole moment, $q$ is the magnitude of the charge, and $d$ is the length of the dipole.<br><br>Substituting $p$ in the torque equation gives<br><br>$\\tau = q d E \\sin\\theta$<br><br>Rearranging for $q$ yields<br><br>$q = \\dfrac{\\tau}{d E \\sin\\theta}$<br><br>Substituting the given values $\\tau = 5 \\times 10^{-9}\\ \\text{Nm}$, $d = 0.5 \\times 10^{-6}\\ \\text{m}$, $E = 10^4\\ \\text{V/m}$, and $\\theta = 30^\\circ$:<br><br>$q = \\dfrac{5 \\times 10^{-9}}{0.5 \\times 10^{-6} \\times 10^4 \\times \\sin 30^\\circ}$<br><br>$q = \\dfrac{5 \\times 10^{-9}}{0.5 \\times 10^{-2} \\times 0.5}$<br><br>$q = \\dfrac{5 \\times 10^{-9}}{0.25 \\times 10^{-2}}$<br><br>$q = 20 \\times 10^{-7}\\ \\text{C}$<br><br>$q = 2 \\times 10^{-6}\\ \\text{C} = 2\\ \\mu\\text{C}$<br><br>Answer: $2\\ \\mu\\text{C}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf7bf9280d7f9932e0f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "An electric dipole of length 2 cm is placed with its axis making an angle of $60^{\\circ}$ to a uniform electric field of $10^{+5} \\mathrm{~N} / \\mathrm{C}$. If it experiences a torque of $9 \\sqrt{3} \\mathrm{Nm}$, the magnitude of the charge on the dipole is $\\left(\\sin 60^{\\circ}=\\frac{\\sqrt{3}}{2}\\right)$", "image": null}, "options": [{"id": "a3e74", "text": "$7 \\times 10^{-3} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "qribF", "text": "$8 \\times 10^{-3} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "Q59a6", "text": "$9 \\times 10^{-3} \\mathrm{C}$", "image": null, "isCorrect": true}, {"id": "P1dy5", "text": "$\\frac{9}{2} \\times 10^{-3} \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The torque acting on an electric dipole in a uniform electric field is given by:<br><br>$\\tau = pE \\sin\\theta$<br><br>Since the dipole moment is $p = q(2l)$, the equation becomes:<br><br>$\\tau = q(2l)E \\sin\\theta$<br><br>Given values are:<br>$\\tau = 9\\sqrt{3} \\text{ Nm}$<br>$2l = 2 \\text{ cm} = 2 \\times 10^{-2} \\text{ m}$<br>$E = 10^5 \\text{ N/C}$<br>$\\theta = 60^{\\circ}$<br><br>Substituting these values into the formula:<br><br>$9\\sqrt{3} = q \\times (2 \\times 10^{-2}) \\times 10^5 \\times \\sin 60^{\\circ}$<br><br>$9\\sqrt{3} = q \\times 2 \\times 10^3 \\times \\dfrac{\\sqrt{3}}{2}$<br><br>$9\\sqrt{3} = q \\times 10^3 \\times \\sqrt{3}$<br><br>$q = \\dfrac{9\\sqrt{3}}{10^3 \\sqrt{3}}$<br><br>$q = 9 \\times 10^{-3} \\text{ C}$<br><br>Answer: $9 \\times 10^{-3} \\mathrm{C}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b97bf9280d7f9932aa6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Out of the following molecules the one which represents the polar molecule is\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/Uv7L2fRhuDpK0Sj3z5xa9ssSgHgWFRoSBj13SFbpVyE.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "mR7QL", "text": "(d)", "image": null, "isCorrect": false}, {"id": "xs7IJ", "text": "(a)", "image": null, "isCorrect": true}, {"id": "i8WVI", "text": "(c)", "image": null, "isCorrect": false}, {"id": "kVQdt", "text": "(b)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let us analyze the polarity of each given molecule:<br><br>Molecule (a) represents water ($H_2O$). It has a bent structure due to the presence of two lone pairs on the central oxygen atom. Because oxygen is more electronegative than hydrogen, the O-H bonds are polar. The vector sum of these bond dipoles is non-zero, resulting in a net dipole moment. Thus, $H_2O$ is a polar molecule.<br><br>Molecule (b) represents nitrogen ($N_2$). It is a homonuclear diatomic molecule. Since both atoms have the same electronegativity, the bond is nonpolar, making the molecule nonpolar.<br><br>Molecule (c) represents carbon dioxide ($CO_2$). It has a linear geometry. Although the C=O bonds are polar due to the electronegativity difference between carbon and oxygen, the two bond dipoles are equal in magnitude and opposite in direction. They cancel each other out, resulting in a net zero dipole moment. Thus, $CO_2$ is a nonpolar molecule.<br><br>Molecule (d) represents hydrogen ($H_2$). Like nitrogen, it is a homonuclear diatomic molecule with zero electronegativity difference, making it nonpolar.<br><br>Therefore, only molecule (a) is polar.<br><br>Answer: (a)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b46bf9280d7f99327bf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "An electric dipole having each charge of magnitude $2 \\mu \\mathrm{C}$ is placed in an electric field of intensity $8 \\times 10^{+4} \\mathrm{~N} / \\mathrm{C}$. If the maximum torque acting on the dipole is $4 \\times 10^{-3} \\mathrm{~N}-\\mathrm{m}$, the length of the dipole is", "image": null}, "options": [{"id": "gJtQf", "text": "10 mm", "image": null, "isCorrect": false}, {"id": "csD3t", "text": "25 mm", "image": null, "isCorrect": true}, {"id": "wltg4", "text": "15 mm", "image": null, "isCorrect": false}, {"id": "SDRVz", "text": "20 mm", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The maximum torque acting on an electric dipole in a uniform electric field is given by<br><br>$\\tau_{\\text{max}} = pE$<br><br>where $p$ is the electric dipole moment and $E$ is the electric field intensity.<br><br>The dipole moment is $p = q \\times 2l$, where $q$ is the magnitude of the charge and $2l$ is the length of the dipole.<br><br>Substituting $p$ in the torque equation:<br><br>$\\tau_{\\text{max}} = (q \\times 2l)E$<br><br>Rearranging for the length of the dipole $2l$:<br><br>$2l = \\dfrac{\\tau_{\\text{max}}}{qE}$<br><br>Given values are:<br>$\\tau_{\\text{max}} = 4 \\times 10^{-3} \\text{ N-m}$<br>$q = 2 \\mu\\text{C} = 2 \\times 10^{-6} \\text{ C}$<br>$E = 8 \\times 10^4 \\text{ N/C}$<br><br>Substituting these values:<br><br>$2l = \\dfrac{4 \\times 10^{-3}}{2 \\times 10^{-6} \\times 8 \\times 10^4}$<br><br>$2l = \\dfrac{4 \\times 10^{-3}}{16 \\times 10^{-2}}$<br><br>$2l = 0.25 \\times 10^{-1} \\text{ m}$<br><br>$2l = 0.025 \\text{ m}$<br><br>Converting to millimeters:<br><br>$2l = 0.025 \\times 1000 \\text{ mm} = 25 \\text{ mm}$<br><br>Answer: 25 mm", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871afebf9280d7f9932569", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "An electric dipole of dipole moment ' $p$ ' is aligned parallel to a uniform electric field ' $E$ '. The energy required to rotate the dipole by $90^{\\circ}$ is $\\left[\\begin{array}{ll}\\sin 0^{\\circ}=0, & \\sin 90^{\\circ}=1 \\\\ \\cos 0^{\\circ}=1, & \\cos 90^{\\circ}=0\\end{array}\\right]$", "image": null}, "options": [{"id": "B8Ezy", "text": "pE", "image": null, "isCorrect": true}, {"id": "SesOw", "text": "$\\mathrm{pE}^2$", "image": null, "isCorrect": false}, {"id": "mcuZt", "text": "$\\mathrm{p}^2 \\mathrm{E}$", "image": null, "isCorrect": false}, {"id": "KGWxt", "text": "infinity", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The work done in rotating an electric dipole in a uniform electric field from an initial angle $\\theta_1$ to a final angle $\\theta_2$ is given by:<br><br>$W = pE(\\cos\\theta_1 - \\cos\\theta_2)$<br><br>Initially, the dipole is aligned parallel to the electric field, so $\\theta_1 = 0^{\\circ}$.<br><br>The dipole is rotated by $90^{\\circ}$, so the final angle is $\\theta_2 = 90^{\\circ}$.<br><br>Substituting the values into the formula:<br><br>$W = pE(\\cos 0^{\\circ} - \\cos 90^{\\circ})$<br><br>Using the given values $\\cos 0^{\\circ} = 1$ and $\\cos 90^{\\circ} = 0$:<br><br>$W = pE(1 - 0) = pE$<br><br>The energy required is $pE$.<br><br>Answer: pE", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213f20aee93fa0796dcc3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "An electric dipole will have minimum potential energy when it subtends an angle\r\n$\\left[\\begin{array}{l}\r\n\\cos 0^{\\circ}=1 \\\\\r\n\\sin 0^{\\circ}=0\r\n\\end{array}\\right]\\left[\\begin{array}{l}\r\n\\cos 90^{\\circ}=0 \\\\\r\n\\cos \\pi=-1\r\n\\end{array}\\right]$", "image": null}, "options": [{"id": "PZ9P0", "text": "$\\pi$ with direction of field.", "image": null, "isCorrect": false}, {"id": "oaiJ9", "text": "$\\frac{\\pi}{2}$ with direction of field.", "image": null, "isCorrect": false}, {"id": "OCJhG", "text": "$\\frac{3 \\pi}{2}$ with direction of field.", "image": null, "isCorrect": false}, {"id": "6prne", "text": "zero with direction of field.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The potential energy of an electric dipole in a uniform electric field is given by $U = -\\vec{p} \\cdot \\vec{E} = -pE \\cos \\theta$, where $\\theta$ is the angle between the dipole moment and the electric field.<br><br>For the potential energy to be minimum, the value of $\\cos \\theta$ must be maximum.<br><br>The maximum value of $\\cos \\theta$ is $1$, which occurs when $\\theta = 0$.<br><br>Thus, the dipole will have minimum potential energy when it subtends an angle of zero with the direction of the electric field.<br><br>Answer: zero with direction of field.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792134c0aee93fa0796d7ae", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "An electric dipole of moment $\\vec{P}$ is lying along a uniform electric field $\\overrightarrow{\\mathrm{E}}$. The work done in rotating the dipole through $\\dfrac{\\pi^c}{3}$ is $\\left[\\sin 30^{\\circ}=\\cos 60^{\\circ}=0 \\cdot 5, \\cos 30^{\\circ}=\\sin 60^{\\circ}=\\sqrt{3} / 2\\right]$", "image": null}, "options": [{"id": "Ycch0", "text": "3 pE", "image": null, "isCorrect": false}, {"id": "b8rqQ", "text": "$\\sqrt{2} \\mathrm{pE}$", "image": null, "isCorrect": false}, {"id": "ve3FY", "text": "pE", "image": null, "isCorrect": false}, {"id": "thCDA", "text": "$\\dfrac{\\mathrm{pE}}{2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The work done in rotating an electric dipole in a uniform electric field is equal to the change in its potential energy.<br><br>$W = U_f - U_i = -pE \\cos\\theta_2 - (-pE \\cos\\theta_1)$<br><br>$W = pE (\\cos\\theta_1 - \\cos\\theta_2)$<br><br>Initially, the dipole is lying along the electric field, so $\\theta_1 = 0^{\\circ}$.<br><br>The dipole is rotated through an angle of $\\dfrac{\\pi}{3}$, so $\\theta_2 = 60^{\\circ}$.<br><br>Substituting the values:<br><br>$W = pE (\\cos 0^{\\circ} - \\cos 60^{\\circ})$<br><br>$W = pE \\left(1 - \\dfrac{1}{2}\\right)$<br><br>$W = \\dfrac{pE}{2}$<br><br>Answer: $\\dfrac{\\mathrm{pE}}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2627d0279619d9d8a34ee", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "If $\\mathrm{E}_{\\mathrm{a}}$ and $\\mathrm{E}_{\\mathrm{q}}$ represent the electric field intensity due to a short dipole at a point on its axial line and on the equatorial line at the same distance ' $r$ ' from the centre of the dipole, then", "image": null}, "options": [{"id": "g2j2l", "text": "$\\mathrm{E}_{\\mathrm{a}}=\\mathrm{E}_{\\mathrm{q}}$", "image": null, "isCorrect": false}, {"id": "aRzMo", "text": "$\\mathrm{E}_{\\mathrm{a}}=\\frac{1}{2} \\mathrm{E}_{\\mathrm{q}}$", "image": null, "isCorrect": false}, {"id": "q8Zl2", "text": "$\\mathrm{E}_{\\mathrm{a}}=\\frac{1}{\\sqrt{2}} \\mathrm{E}_{\\mathrm{q}}$", "image": null, "isCorrect": false}, {"id": "0IEnY", "text": "$\\mathrm{E}_{\\mathrm{a}}=\\mathrm{2E}_{\\mathrm{q}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Std.11|Ch-10|Subtopic-10.9", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262540279619d9d8a33a4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "The work done in rotating a dipole placed parallel to the electric field through $180^{\\circ}$ is 'w'. So the work done in rotating it through $60^{\\circ}$ is $\\left(\\cos 0^{\\circ}=1, \\cos 60^{\\circ}=\\frac{1}{2}, \\cos 180^{\\circ}=-1\\right)$", "image": null}, "options": [{"id": "KK7AA", "text": "$4 \\mathrm{w}$", "image": null, "isCorrect": false}, {"id": "01zA1", "text": "$3 \\mathrm{w}$", "image": null, "isCorrect": false}, {"id": "X1Uxx", "text": "$\\frac{\\mathrm{w}}{2}$", "image": null, "isCorrect": false}, {"id": "HWeTr", "text": "$\\frac{\\mathrm{w}}{4}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Work done $\\mathrm{W}=\\mathrm{p} E\\left[\\cos \\theta_0-\\cos \\theta\\right]$ Given, $\\mathrm{W}=\\mathrm{pE}\\left(1-\\cos 180^{\\circ}\\right)$\n$\\therefore \\quad \\mathrm{W}=\\mathrm{pE}\\left(1-\\cos 180^{\\circ}\\right)$\n$\\begin{aligned} & \\mathrm{W}=\\mathrm{pE}(1-(-1)) \\\\ & \\mathrm{W}=2 \\mathrm{pE} \\\\ & \\mathrm{pE}=\\frac{1}{2} \\mathrm{~W}\\end{aligned}$\n$\\therefore \\quad$ When $\\theta=60^{\\circ}$\n$\\begin{aligned} & \\mathrm{W}^{\\prime}=\\mathrm{pE}\\left(1-\\cos 60^{\\circ}\\right) \\\\ & \\mathrm{W}^{\\prime}=\\mathrm{pE}\\left(1-\\frac{1}{2}\\right) \\\\ & \\mathrm{W}^{\\prime}=\\frac{1}{2} \\mathrm{pE} \\\\ & \\mathrm{W}^{\\prime}=\\frac{1}{2} \\times \\frac{1}{2} \\mathrm{~W} \\\\ & \\mathrm{~W}^{\\prime}=\\frac{1}{4} \\mathrm{~W}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261ce0279619d9d8a2f7f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "An electric dipole consisting of two opposite charges of $2 \\times 10^{-6} \\mathrm{C}$ separated by a distance of $3 \\mathrm{~cm}$ placed in an electric field of $2 \\times 10^5 \\mathrm{~N} / \\mathrm{C}$ then the maximum torque acting on dipole is", "image": null}, "options": [{"id": "FHuAq", "text": "$12 \\times 10^{-1} \\mathrm{~N}-\\mathrm{m}$", "image": null, "isCorrect": false}, {"id": "F2Jxe", "text": "$24 \\times 10^{-3} \\mathrm{~N}-\\mathrm{m}$", "image": null, "isCorrect": false}, {"id": "BZaIA", "text": "$12 \\times 10^{-3} \\mathrm{~N}-\\mathrm{m}$", "image": null, "isCorrect": true}, {"id": "8Ue8L", "text": "$24 \\times 10^{-1} \\mathrm{~N}-\\mathrm{m}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\text { Dipole moment } \\mathrm{p}=\\mathrm{q} \\times 2 \\mathrm{l}=2 \\times 10^{-6} \\times 3 \\times 10^{-2} \\\\ & =6 \\times 10^{-8} \\mathrm{Cm} \\\\ & \\therefore \\quad \\tau_{\\max }=\\rho E \\sin \\theta=\\mathrm{pEsin} 90^{\\circ} \\\\ & =6 \\times 10^{-8} \\times 2 \\times 10^5 \\times 1 \\\\ & =12 \\times 10^{-3} \\mathrm{Nm}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261380279619d9d8a2ac5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "An electric dipole is as shown in figure The electric potential at point $\\mathrm{P}$ due to the dipole is $\\left[\\epsilon_0=\\right.$ permittivity of free space]\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/1F8aqgQZRvt-RsVJBH0inj9E-HPKrz2FXpbIBxpBuKk.original.fullsize.png\">", "image": null}, "options": [{"id": "Ti4lQ", "text": "$\\frac{a q}{2 \\pi \\epsilon_0\\left(x^2+a^2\\right)}$", "image": null, "isCorrect": false}, {"id": "TY399", "text": "$\\frac{2 a q}{2 \\pi \\epsilon_0\\left(x^2-a^2\\right)}$", "image": null, "isCorrect": false}, {"id": "CVFiD", "text": "$\\frac{2 a q}{2 \\pi \\epsilon_0\\left(x^2+a^2\\right)}$", "image": null, "isCorrect": false}, {"id": "jlhVs", "text": "$\\frac{\\mathrm{aq}}{2 \\pi \\epsilon_0\\left(\\mathrm{x}^2-\\mathrm{a}^2\\right)}$", "image":
