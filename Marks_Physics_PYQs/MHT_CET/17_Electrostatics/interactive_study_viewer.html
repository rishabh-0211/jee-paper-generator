id": "l8dEP", "text": "$\\frac{\\mathrm{qd}}{\\mathrm{Vm}}$", "image": null, "isCorrect": false}, {"id": "2vKFC", "text": "$\\frac{\\mathrm{qV}}{\\mathrm{dm}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Electric field between the plates is $\\mathrm{E}=\\left(\\frac{\\mathrm{V}}{\\mathrm{d}}\\right)$\nForce on the change can be written as\n$\\begin{aligned}\n& \\mathrm{F}=\\frac{\\mathrm{qV}}{\\mathrm{d}} \\\\\n& \\therefore \\text { Acceleration }=\\frac{\\mathrm{F}}{\\mathrm{m}}=\\left(\\frac{\\mathrm{qV}}{\\mathrm{md}}\\right)\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261170279619d9d8a29bb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}], "question": {"text": "Identify the WRONG statement in the case of electric field lines.", "image": null}, "options": [{"id": "1I8GT", "text": "They do not intersect each other.", "image": null, "isCorrect": false}, {"id": "yZ4Q6", "text": "They do not pass through a conductor.", "image": null, "isCorrect": false}, {"id": "lW3Hj", "text": "They start from a positive charge and end on a negative charge", "image": null, "isCorrect": false}, {"id": "KsENO", "text": "They do not pass through an insulator.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Conceptual question. Field lines can pass through an insulator.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260ef0279619d9d8a287a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}], "question": {"text": "An electron of mass ' $m_e$ ' and a proton of mass ' $m_p$ ' are kept in a uniform electric field. The ratio of the acceleration of electron $\\left(a_e\\right)$ to the acceleration of proton $\\left(a_p\\right)$ is", "image": null}, "options": [{"id": "pWdJs", "text": "$\\frac{\\mathrm{m}_{\\mathrm{e}}}{\\mathrm{m}_{\\mathrm{p}}}$", "image": null, "isCorrect": false}, {"id": "86vSb", "text": "$\\frac{\\mathrm{m}_{\\mathrm{p}}}{\\mathrm{m}_{\\mathrm{e}}}$", "image": null, "isCorrect": true}, {"id": "TYIpx", "text": "one", "image": null, "isCorrect": false}, {"id": "hUyTn", "text": "infinity", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Electrostatic force, $\\mathrm{F}_{\\mathrm{E}}=\\mathrm{eE}$ (for both the particles)\nThe acceleration of electron, $a_e=\\frac{F_E}{M_e}$ and\nAcceleration of proton $a_p=\\frac{F_E}{M_e}$\n$\\therefore \\frac{\\mathrm{a}_{\\mathrm{e}}}{\\mathrm{a}_{\\mathrm{p}}}=\\frac{\\mathrm{M}_{\\mathrm{p}}}{\\mathrm{M}_{\\mathrm{e}}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260a60279619d9d8a2639", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "Two charge metallic spheres are joined by a very thin metal wire. If the radius of the larger sphere is four times that of the smaller sphere, the electric field near the larger sphere is", "image": null}, "options": [{"id": "972bH", "text": "twice that near the smaller sphere", "image": null, "isCorrect": false}, {"id": "BEC3X", "text": "quarter of that near the smaller sphere", "image": null, "isCorrect": true}, {"id": "CedIp", "text": "same as that near the smaller sphere", "image": null, "isCorrect": false}, {"id": "V1bqR", "text": "half of that near smaller sphere", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since the spheres are joined by a metal wire, their potentials will be same.\nLet the radius of the smaller sphere be $r_1$ and the radius of the larger sphere be $r_2=4 r_1$ the $\\mathrm{v}=\\frac{1}{4 \\pi \\varepsilon_0} \\cdot \\frac{\\mathrm{q}_1}{\\mathrm{r}_1}=\\frac{1}{4 \\pi \\varepsilon_0} \\cdot \\frac{\\mathrm{q}_2}{\\mathrm{r}_2}$\n$$\n\\therefore \\frac{\\mathrm{q}_2}{\\mathrm{q}_1}=\\frac{\\mathrm{r}_2}{\\mathrm{r}_1}\n$$\nThe electric field near the surface of spheres are given by\n$$\n\\begin{aligned}\n& \\mathrm{E}_1=\\frac{1}{4 \\pi \\varepsilon_0} \\cdot \\frac{\\mathrm{q}_1}{\\mathrm{r}_1^2} \\text { and } \\mathrm{E}_2=\\frac{1}{4 \\pi \\varepsilon_0} \\cdot \\frac{\\mathrm{q}_2}{\\mathrm{r}_2^2} \\\\\n& \\therefore \\frac{\\mathrm{E}_2}{\\mathrm{E}_1}=\\frac{\\mathrm{q}_2}{\\mathrm{q}_1} \\cdot \\frac{\\mathrm{r}_1^2}{\\mathrm{r}_2^2}=\\frac{\\mathrm{r}_2}{\\mathrm{r}_1} \\cdot \\frac{\\mathrm{r}_1^2}{\\mathrm{r}_2^2}=\\frac{\\mathrm{r}_1}{\\mathrm{r}_2}=\\frac{1}{4}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260940279619d9d8a25a1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "The electric field intensity on the surface of a charged solid sphere of radius ' $r$ ' and volume charge density' $\\rho$ ' is given by", "image": null}, "options": [{"id": "yON3n", "text": "zero", "image": null, "isCorrect": false}, {"id": "RV3Nd", "text": "$\\frac{\\rho r}{3 \\varepsilon_0}$", "image": null, "isCorrect": true}, {"id": "KvA30", "text": "$\\frac{1}{4 \\pi \\epsilon_0} \\frac{\\rho}{\\mathrm{r}}$", "image": null, "isCorrect": false}, {"id": "VuAP4", "text": "$\\frac{5 \\rho r}{6 \\epsilon_0}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The electric field intensity on the surface is given by\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/MS7UHMHhzBZuIwfekEwGqJpFOnSuDXkKKd41TgBf_8M.original.fullsize.png\"><br>\nBut $q=\\frac{4}{3} \\pi r^3 \\rho$\nPutting this value of q in Eq. (1) and simplifying we get\n$$\nE=\\frac{\\rho r}{3 \\varepsilon_0}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2607d0279619d9d8a24e9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "An electron of mass ' $m$ ' and charge ' $q$ ' is accelerated from rest in a uniform electric field of strength ' $E$ '. The velocity acquired by the electron when it travels a distance ' $L$ ' is", "image": null}, "options": [{"id": "ATH4n", "text": "$\\sqrt{\\frac{2 q E}{m L}}$", "image": null, "isCorrect": false}, {"id": "I0Zzb", "text": "$\\sqrt{\\frac{2 E m}{q L}}$", "image": null, "isCorrect": false}, {"id": "mi45v", "text": "$\\sqrt{\\frac{2 \\mathrm{qEL}}{\\mathrm{m}}}$", "image": null, "isCorrect": true}, {"id": "IZYsw", "text": "$\\sqrt{\\frac{\\mathrm{qE}}{\\mathrm{mL}}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Force on the electron $\\mathrm{F}=\\mathrm{qE}$\nWork done by the force $\\mathrm{W}=\\mathrm{qEL}$\nWork done is equal to gain in kinetic energy\n$$\n\\begin{aligned}\n& \\therefore \\frac{1}{2} \\mathrm{mv}^2=\\mathrm{qEL} \\\\\n& \\therefore \\mathrm{v}=\\sqrt{\\frac{2 \\mathrm{qEL}}{\\mathrm{m}}}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260250279619d9d8a221d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "A uniformly charged semicircular arc of radius ' $r$ ' has linear charge density $(\\lambda)$. What is the electric field at its centre?\n( $\\epsilon_0=$ permittivity of free space)", "image": null}, "options": [{"id": "MelXQ", "text": "$\\frac{\\lambda}{2 \\pi \\in_0 r}$", "image": null, "isCorrect": true}, {"id": "ns5oy", "text": "$\\frac{2 \\pi \\epsilon_0}{\\lambda}$", "image": null, "isCorrect": false}, {"id": "HFFlS", "text": "$\\frac{\\lambda}{4 \\epsilon_0}$", "image": null, "isCorrect": false}, {"id": "YtBmr", "text": "$\\frac{2 \\epsilon_0}{\\lambda}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Electric field due to a circular arc at its center,\n$\\mathrm{E}=\\frac{2 \\mathrm{k} \\lambda}{\\mathrm{r}} \\sin \\alpha$, where $\\alpha$ is the angle which arc subtends at its center\nFor semicircle, $\\alpha=90^{\\circ}$\nHence, $E=\\frac{\\lambda}{2 \\pi \\epsilon_0 r}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fea0279619d9d8a2042", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "van de Graaff generator produces", "image": null}, "options": [{"id": "NM5Oj", "text": "low voltage and low current.", "image": null, "isCorrect": false}, {"id": "Cuh4y", "text": "high voltage and high current.", "image": null, "isCorrect": false}, {"id": "Kt0Me", "text": "high voltage and low current.", "image": null, "isCorrect": true}, {"id": "ka4rJ", "text": "low voltage and high current.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(D)\nTheory question", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fb40279619d9d8a1e96", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "Surface density of charge on a charged conducting sphere of radius 'R' in terms of electric intensity 'E' at a distance 'r' in free space is $\\left(\\mathrm{r}>\\mathrm{R}, \\mathrm{E}_{0}=\\right.$ permittivity of free space $)$", "image": null}, "options": [{"id": "ljjoy", "text": "$_{1} \\in_{0} E \\frac{R}{r}$", "image": null, "isCorrect": false}, {"id": "HRVg1", "text": "$v^{2} \\in_{0} E\\left(\\frac{r}{R}\\right)^{2}$", "image": null, "isCorrect": true}, {"id": "K8Hg3", "text": "$x_{3} \\in_{0} E \\frac{r}{R}$", "image": null, "isCorrect": false}, {"id": "VBKbN", "text": "$x^{4} \\in_{0} E\\left(\\frac{R}{r}\\right)^{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$E=\\frac{1}{4 \\pi \\varepsilon_{0}} \\frac{Q}{r^{2}}=\\frac{1}{4 \\pi \\varepsilon_{0}} \\frac{4 \\pi R^{2} \\sigma}{r^{2}}=\\frac{\\sigma R^{2}}{\\varepsilon_{0} r^{2}}$\n$\\therefore \\sigma=E \\varepsilon_{0}\\left(\\frac{r}{R}\\right)^{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f310279619d9d8a1a80", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}], "question": {"text": "A metal sphere of radius 'R' cm is charged with $4 \\pi \\mu \\mathrm{C}$ situated in air. If ' $\\sigma$ ' is surface density of charge , 'E' is electric intensity at a distance 'r' from the centre of sphere then 'r' is $\\left(\\epsilon_{0}=\\right.$ permittivity of free space)", "image": null}, "options": [{"id": "YYial", "text": "$\\mathrm{R} \\sqrt{\\frac{\\epsilon_{0} \\mathrm{E}}{\\sigma}}$", "image": null, "isCorrect": false}, {"id": "JFriN", "text": "$\\mathrm{R} \\sqrt{\\frac{\\sigma}{\\epsilon_{0} \\mathrm{E}}}$", "image": null, "isCorrect": true}, {"id": "4szgN", "text": "$\\sqrt{\\frac{\\epsilon_{0} \\mathrm{E}}{\\mathrm{R} \\sigma}}$", "image": null, "isCorrect": false}, {"id": "ANbcj", "text": "$\\sqrt{\\frac{\\mathrm{R} \\sigma}{\\epsilon_{0} \\mathrm{E}}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{E}=\\frac{1}{4 \\pi \\epsilon_{0}} \\cdot \\frac{\\mathrm{q}}{\\mathrm{r}^{2}} ; \\quad \\sigma=\\frac{\\mathrm{q}}{4 \\pi \\mathrm{R}^{2}}$\n$\\therefore \\mathrm{q}=4 \\pi \\mathrm{R}^{2} \\sigma$\n$\\therefore \\mathrm{E}=\\frac{1}{4 \\pi \\epsilon_{0}} \\cdot \\frac{4 \\pi \\mathrm{R}^{2} \\sigma}{\\mathrm{r}^{2}}$\n$\\therefore r^{2}=\\frac{R^{2} \\sigma}{\\epsilon_{0} E} \\quad \\therefore r=R \\sqrt{\\frac{\\sigma}{\\epsilon_{0} E}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ef70279619d9d8a18b4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}], "question": {"text": "A charged conductor produces an electric field of intensity <math><mfrac><mrow><msup><mrow><mn>10</mn></mrow><mrow><mn>3</mn></mrow></msup><mi>V</mi></mrow><mrow><mi>m</mi></mrow></mfrac></math> just outside its surface in vacuum. Then, it produces the electric field of intensity E just outside its surface, when it is placed in a medium of dielectric constant 4. The value of E will be", "image": null}, "options": [{"id": "B203V", "text": "400 V/m", "image": null, "isCorrect": false}, {"id": "Vns59", "text": "450 V/m", "image": null, "isCorrect": false}, {"id": "8s4Vv", "text": "250 V/m", "image": null, "isCorrect": true}, {"id": "WMNI4", "text": "150 V/m", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, electric field produced by charged conductor in vacuum, <br/><math><msub><mrow><mi>E</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mfrac><mrow><msup><mrow><mn>10</mn></mrow><mrow><mn>3</mn></mrow></msup><mi>V</mi></mrow><mrow><mi>m</mi></mrow></mfrac></math>  <br/>Electric field produced by charged conductor, when it is placed in medium of dielectrics <math><mfenced separators=\"|\"><mrow><mi>K</mi><mo>=</mo><mn>4</mn></mrow></mfenced><mi>E</mi><mo>=</mo><mfrac><mrow><msub><mrow><mi>E</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mi>K</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><msup><mrow><mn>10</mn></mrow><mrow><mn>3</mn></mrow></msup></mrow><mrow><mn>4</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>250</mn><mi>V</mi></mrow><mrow><mi>m</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ed20279619d9d8a178e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}], "question": {"text": "The expression for electric field intensity at a point outside uniformly charged thin plane sheet is (<math><br> <mi>d</mi><br></math><br> is the distance of point from plane sheet)", "image": null}, "options": [{"id": "nuf8R", "text": "independent of <math> <mi>d</mi> </math>", "image": null, "isCorrect": true}, {"id": "0BuD8", "text": "directly proportional to <math><msqrt><mi>d</mi></msqrt><mi>&nbsp;</mi></math>", "image": null, "isCorrect": false}, {"id": "vqd3F", "text": "directly proportional to <math> <mi>d</mi> </math>", "image": null, "isCorrect": false}, {"id": "EQZFH", "text": "directly proportional to <math><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mi>d</mi></msqrt></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Electric field intensity outside sheet is <math> <mrow> <mfrac> <mi>σ</mi> <mrow> <mn>2</mn><msub> <mi>ε</mi> <mn>0</mn> </msub> </mrow> </mfrac> </mrow> </math><br />So it is independent of <math> <mi>d</mi> </math><br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e750279619d9d8a149a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "The electric intensity outside a charged sphere of radius $R$ at a distance $r(r>R)$ is", "image": null}, "options": [{"id": "WaG4E", "text": "$\\frac{\\sigma R^{2}}{\\varepsilon_{0} r^{2}}$", "image": null, "isCorrect": true}, {"id": "igs3X", "text": "$\\frac{\\sigma r^{2}}{\\varepsilon_{0} R^{2}}$", "image": null, "isCorrect": false}, {"id": "9SX7j", "text": "$\\frac{\\sigma r}{\\varepsilon_{0} R}$", "image": null, "isCorrect": false}, {"id": "YQQCC", "text": "$\\frac{\\sigma R}{\\varepsilon_{0} r}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The electric intensity outside a charged sphere,\n$$\nE=\\frac{\\sigma R^{2}}{\\varepsilon_{0} r^{2}}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e610279619d9d8a13f1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "If the linear charge density of a cylinder is $4 \\mu \\mathrm{Cm}^{-1}$ then electric field intensity at point $3.6 \\mathrm{~cm}$ from axis is", "image": null}, "options": [{"id": "AWFl1", "text": "$4 \\times 10^{5} \\mathrm{NC}^{-1}$", "image": null, "isCorrect": false}, {"id": "9PuCz", "text": "$2 \\times 10^{6} \\mathrm{NC}^{-1}$", "image": null, "isCorrect": true}, {"id": "Smr6o", "text": "$8 \\times 10^{7} \\mathrm{NC}^{-1}$", "image": null, "isCorrect": false}, {"id": "9VKUO", "text": "$12 \\times 10^{7} \\mathrm{NC}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a charged cylinder\n$$\n\\begin{aligned}\nE &=\\frac{\\lambda}{2 \\pi \\varepsilon_{0} r}=\\frac{4 \\times 10^{-6} \\times 18 \\times 10^{9}}{3.6 \\times 10^{-2}} \\\\\n&=2 \\times 10^{6} \\mathrm{NC}^{-1}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a263270279619d9d8a3c6f", "title": "Electric Potential and Potential Energy", "totalQuestions": 83, "questions": [{"_id": "6abb88ca15a9fc0fc8c14704", "type": "singleCorrect", "question": {"text": "Three equal $(+q)$ charges are placed in air at the vertices of equilateral triangle. If the side of equilateral triangle is $l$, the net potential energy of the system is $\\left[K = \\dfrac{1}{4\\pi\\epsilon_0}\\right]$", "image": null}, "options": [{"id": "wtU8P", "label": "A", "text": "$\\dfrac{kq^2}{l}$", "isCorrect": false, "image": null}, {"id": "VQp9X", "label": "B", "text": "$\\dfrac{2kq^2}{l}$", "isCorrect": false, "image": null}, {"id": "Yd3xm", "label": "C", "text": "$\\dfrac{3kq^2}{l}$", "isCorrect": true, "image": null}, {"id": "DTjyd", "label": "D", "text": "$\\dfrac{4kq^2}{l}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The potential energy of a system of point charges is the sum of the potential energies of all pairs of charges.<br><br>For three charges $q_1, q_2, q_3$ placed at the vertices of a triangle, the total potential energy $U$ is given by:<br><br>$U = U_{12} + U_{23} + U_{31}$<br><br>Given $q_1 = q_2 = q_3 = +q$ and the distance between any two charges is $l$.<br><br>$U = \\dfrac{k q \\cdot q}{l} + \\dfrac{k q \\cdot q}{l} + \\dfrac{k q \\cdot q}{l}$<br><br>$U = \\dfrac{3kq^2}{l}$<br><br>Answer: $\\dfrac{3kq^2}{l}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889c15a9fc0fc8c14553", "type": "singleCorrect", "question": {"text": "Two spheres A and B of radius $a$ and $b$ respectively are at the same electric potential. The ratio of the surface charge densities of A to that of B is", "image": null}, "options": [{"id": "kofgN", "label": "A", "text": "$\\dfrac{a^2}{b^2}$", "isCorrect": false, "image": null}, {"id": "ZIEvj", "label": "B", "text": "$\\dfrac{b^2}{a^2}$", "isCorrect": false, "image": null}, {"id": "Yme2R", "label": "C", "text": "$\\dfrac{b}{a}$", "isCorrect": true, "image": null}, {"id": "WE58g", "label": "D", "text": "$\\dfrac{a}{b}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The electric potential of a sphere of radius $R$ and charge $Q$ is given by $V = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{Q}{R}$.<br><br>Substituting the charge in terms of surface charge density $Q = \\sigma (4\\pi R^2)$, we get $V = \\dfrac{\\sigma R}{\\epsilon_0}$.<br><br>Since both spheres A and B are at the same electric potential, $V_A = V_B$.<br><br>$\\dfrac{\\sigma_A a}{\\epsilon_0} = \\dfrac{\\sigma_B b}{\\epsilon_0}$<br><br>$\\sigma_A a = \\sigma_B b$<br><br>$\\dfrac{\\sigma_A}{\\sigma_B} = \\dfrac{b}{a}$<br><br>Answer: $\\dfrac{b}{a}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883d15a9fc0fc8c141d7", "type": "singleCorrect", "question": {"text": "A semicircular arc of radius '$R$' is charged uniformly and has charge per unit length as $\\lambda$. The electric potential $V$ at the centre of curvature is [$\\varepsilon_0$ = permittivity of vacuum]", "image": null}, "options": [{"id": "he1zO", "label": "A", "text": "$\\dfrac{\\lambda}{4\\varepsilon_0}$", "isCorrect": true, "image": null}, {"id": "ZBR5E", "label": "B", "text": "$\\dfrac{\\lambda}{2\\varepsilon_0}$", "isCorrect": false, "image": null}, {"id": "Dhfsg", "label": "C", "text": "$\\dfrac{\\lambda}{8\\varepsilon_0}$", "isCorrect": false, "image": null}, {"id": "lrfDN", "label": "D", "text": "$\\dfrac{\\lambda}{\\varepsilon_0}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Consider a small element of length $dl$ on the semicircular arc. The charge on this element is $dq = \\lambda dl$.<br><br>The electric potential at the centre of curvature due to this small element is given by:<br><br>$dV = \\dfrac{1}{4\\pi\\varepsilon_0} \\dfrac{dq}{R} = \\dfrac{1}{4\\pi\\varepsilon_0} \\dfrac{\\lambda dl}{R}$<br><br>Integrating this expression over the entire length of the semicircular arc to find the total potential at the centre:<br><br>$V = \\int dV = \\int \\dfrac{1}{4\\pi\\varepsilon_0} \\dfrac{\\lambda dl}{R}$<br><br>Since $\\lambda$, $R$, and $\\varepsilon_0$ are constants, they can be taken out of the integral:<br><br>$V = \\dfrac{\\lambda}{4\\pi\\varepsilon_0 R} \\int dl$<br><br>The total length of the semicircular arc is $\\int dl = \\pi R$.<br><br>Substituting this into the equation for $V$:<br><br>$V = \\dfrac{\\lambda}{4\\pi\\varepsilon_0 R} (\\pi R) = \\dfrac{\\lambda}{4\\varepsilon_0}$<br><br>Answer: $\\dfrac{\\lambda}{4\\varepsilon_0}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885015a9fc0fc8c14280", "type": "singleCorrect", "question": {"text": "Two concentric spheres kept in air have radii $R$ and $r$. They have similar charge and equal surface charge density $\\sigma$. The electric potential at their common centre is ($\\epsilon_0$ = permittivity of free space)", "image": null}, "options": [{"id": "sjHwq", "label": "A", "text": "$\\dfrac{\\sigma(R+r)}{\\epsilon_0}$", "isCorrect": true, "image": null}, {"id": "nLub9", "label": "B", "text": "$\\dfrac{\\sigma(R-r)}{\\epsilon_0}$", "isCorrect": false, "image": null}, {"id": "m3ATg", "label": "C", "text": "$\\dfrac{\\sigma(R+r)}{2\\epsilon_0}$", "isCorrect": false, "image": null}, {"id": "nNRgh", "label": "D", "text": "$\\dfrac{\\sigma(R+r)}{4\\epsilon_0}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The electric potential at the centre of a charged spherical shell of radius $R$ and surface charge density $\\sigma$ is given by $V = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{Q}{R}$.<br><br>Since the charge on the shell is $Q = 4\\pi R^2 \\sigma$, the potential becomes $V = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{4\\pi R^2 \\sigma}{R} = \\dfrac{\\sigma R}{\\epsilon_0}$.<br><br>For two concentric spheres of radii $R$ and $r$ having the same surface charge density $\\sigma$, the total potential at their common centre is the sum of the potentials due to each individual sphere.<br><br>$V_{total} = V_R + V_r$<br><br>$V_{total} = \\dfrac{\\sigma R}{\\epsilon_0} + \\dfrac{\\sigma r}{\\epsilon_0} = \\dfrac{\\sigma(R+r)}{\\epsilon_0}$<br><br>Answer: $\\dfrac{\\sigma(R+r)}{\\epsilon_0}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88ae15a9fc0fc8c14601", "type": "singleCorrect", "question": {"text": "A large insulated sphere of radius $r$, charged with $Q$ C is placed in contact with a small insulated uncharged sphere of radius $r_1$ and is then separated. The charge on the smaller sphere will now be", "image": null}, "options": [{"id": "pVXyJ", "label": "A", "text": "$Q(r + r_1)$", "isCorrect": false, "image": null}, {"id": "86ken", "label": "B", "text": "$Q(r - r_1)$", "isCorrect": false, "image": null}, {"id": "gMrEP", "label": "C", "text": "$\\dfrac{Q}{(r + r_1)}$", "isCorrect": false, "image": null}, {"id": "OZKpi", "label": "D", "text": "$\\dfrac{Qr_1}{(r + r_1)}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "When the two conducting spheres are placed in contact, charge flows until their potentials become equal.<br><br>Let the final charge on the larger sphere of radius $r$ be $Q_1$ and on the smaller sphere of radius $r_1$ be $Q_2$.<br><br>By conservation of charge:<br>$Q_1 + Q_2 = Q$<br><br>Equating the final potentials of the two spheres:<br>$\\dfrac{k Q_1}{r} = \\dfrac{k Q_2}{r_1}$<br><br>$\\Rightarrow Q_1 = Q_2 \\dfrac{r}{r_1}$<br><br>Substituting $Q_1$ into the charge conservation equation:<br>$Q_2 \\dfrac{r}{r_1} + Q_2 = Q$<br><br>$Q_2 \\left( \\dfrac{r + r_1}{r_1} \\right) = Q$<br><br>$Q_2 = \\dfrac{Q r_1}{r + r_1}$<br><br>Answer: $\\dfrac{Qr_1}{(r + r_1)}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88ac15a9fc0fc8c145e7", "type": "singleCorrect", "question": {"text": "A charge $10\\ \\mu C$ exists at the centre of a square. The work done in moving a $2\\ \\mu C$ point charge from corner A to corner B of a square ABCD is<br><img style=\"width: 400px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/may/watermarked_images/15_may_shift_1__q21_d1.png\" />", "image": null}, "options": [{"id": "jzvOD", "label": "A", "text": "zero", "isCorrect": true, "image": null}, {"id": "UUf4S", "label": "B", "text": "$5\\ \\text{J}$", "isCorrect": false, "image": null}, {"id": "lqzkR", "label": "C", "text": "$2\\ \\text{J}$", "isCorrect": false, "image": null}, {"id": "8phYx", "label": "D", "text": "$20\\ \\text{J}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the side length of the square be $a$. The distance from the centre of the square to any of its corners is $r = \\dfrac{a}{\\sqrt{2}}$.<br><br>The electric potential at corner A due to the $10\\ \\mu\\text{C}$ charge at the centre is:<br>$V_A = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{10\\ \\mu\\text{C}}{r}$<br><br>Similarly, the electric potential at corner B due to the central charge is:<br>$V_B = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{10\\ \\mu\\text{C}}{r}$<br><br>Since the distances from the centre to corners A and B are equal, the potentials at these corners are equal, i.e., $V_A = V_B$.<br><br>The work done by an external agent in moving a charge $q = 2\\ \\mu\\text{C}$ from corner A to corner B is given by:<br>$W = q(V_B - V_A)$<br><br>Since $V_A = V_B$, the potential difference is zero.<br><br>Therefore, $W = 2\\ \\mu\\text{C} \\times 0 = 0$.<br><br>Answer: zero", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888d15a9fc0fc8c144c6", "type": "singleCorrect", "question": {"text": "Two charges of equal magnitude '$q$' are placed in air at a distance '$2a$' apart and third charge $-2q$ is placed at mid-point. The potential energy of the system is ($\\epsilon_0$ = permittivity of free space)", "image": null}, "options": [{"id": "T4lGK", "label": "A", "text": "$-\\dfrac{q^2}{8\\pi \\epsilon_0 a}$", "isCorrect": false, "image": null}, {"id": "YDcnd", "label": "B", "text": "$-\\dfrac{3q^2}{8\\pi \\epsilon_0 a}$", "isCorrect": false, "image": null}, {"id": "ryxAW", "label": "C", "text": "$-\\dfrac{5q^2}{8\\pi \\epsilon_0 a}$", "isCorrect": false, "image": null}, {"id": "zX3qQ", "label": "D", "text": "$-\\dfrac{7q^2}{8\\pi \\epsilon_0 a}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The potential energy of a system of charges is given by the sum of the potential energies of all pairs of charges.<br><br>$U = \\dfrac{1}{4\\pi\\epsilon_0} \\left( \\dfrac{q_1 q_2}{r_{12}} + \\dfrac{q_1 q_3}{r_{13}} + \\dfrac{q_2 q_3}{r_{23}} \\right)$<br><br>Given $q_1 = q$, $q_2 = q$, and $q_3 = -2q$.<br><br>The distances are $r_{12} = 2a$, $r_{13} = a$, and $r_{23} = a$.<br><br>Substituting these values:<br><br>$U = \\dfrac{1}{4\\pi\\epsilon_0} \\left( \\dfrac{q \\cdot q}{2a} + \\dfrac{q \\cdot (-2q)}{a} + \\dfrac{q \\cdot (-2q)}{a} \\right)$<br><br>$U = \\dfrac{1}{4\\pi\\epsilon_0} \\left( \\dfrac{q^2}{2a} - \\dfrac{2q^2}{a} - \\dfrac{2q^2}{a} \\right)$<br><br>$U = \\dfrac{1}{4\\pi\\epsilon_0} \\left( \\dfrac{q^2}{2a} - \\dfrac{4q^2}{a} \\right)$<br><br>$U = \\dfrac{1}{4\\pi\\epsilon_0} \\left( \\dfrac{q^2 - 8q^2}{2a} \\right)$<br><br>$U = -\\dfrac{7q^2}{8\\pi\\epsilon_0 a}$<br><br>Answer: $-\\dfrac{7q^2}{8\\pi \\epsilon_0 a}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885d15a9fc0fc8c14302", "type": "singleCorrect", "question": {"text": "Three point charges $+q, -2q$ and $-2q$ are placed at the vertices of an equilateral triangle of side a. The work done by some external force to increase their separation to '$2a$' will be $\\left(K = \\dfrac{1}{4\\pi \\varepsilon_0}\\right)$", "image": null}, "options": [{"id": "bMM9T", "label": "A", "text": "$\\dfrac{2q^2 K}{a}$", "isCorrect": false, "image": null}, {"id": "skQqA", "label": "B", "text": "$\\dfrac{q^2 K}{2a}$", "isCorrect": false, "image": null}, {"id": "7U3Uy", "label": "C", "text": "$\\dfrac{qK}{a^2}$", "isCorrect": false, "image": null}, {"id": "N00dE", "label": "D", "text": "zero", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The initial potential energy of the system of charges $+q$, $-2q$, and $-2q$ is<br><br>$U_i = \\dfrac{K}{a} [(q)(-2q) + (q)(-2q) + (-2q)(-2q)]$<br><br>$U_i = \\dfrac{K}{a} [-2q^2 - 2q^2 + 4q^2] = 0$<br><br>The final potential energy of the system when the separation is increased to $2a$ is<br><br>$U_f = \\dfrac{K}{2a} [(q)(-2q) + (q)(-2q) + (-2q)(-2q)]$<br><br>$U_f = \\dfrac{K}{2a} [-2q^2 - 2q^2 + 4q^2] = 0$<br><br>The work done by the external force is<br><br>$W = U_f - U_i = 0 - 0 = 0$<br><br>Answer: zero", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885d15a9fc0fc8c14301", "type": "singleCorrect", "question": {"text": "If $100$ J of work has to be done in moving an electric charge of $4$ C from a place, where potential is $-10$ V to another place where potential is V volt. The value of V is", "image": null}, "options": [{"id": "N3Dbs", "label": "A", "text": "$5$ V", "isCorrect": false, "image": null}, {"id": "lqmCa", "label": "B", "text": "$10$ V", "isCorrect": false, "image": null}, {"id": "dXhW6", "label": "C", "text": "$25$ V", "isCorrect": false, "image": null}, {"id": "JY50m", "label": "D", "text": "$15$ V", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The work done in moving a charge $q$ from an initial potential $V_i$ to a final potential $V_f$ is given by:<br><br>$W = q(V_f - V_i)$<br><br>Given:<br>$W = 100$ J<br>$q = 4$ C<br>$V_i = -10$ V<br>$V_f = V$<br><br>Substituting the given values into the formula:<br><br>$100 = 4(V - (-10))$<br><br>$100 = 4(V + 10)$<br><br>$\\dfrac{100}{4} = V + 10$<br><br>$25 = V + 10$<br><br>$V = 25 - 10 = 15$ V<br><br>Answer: $15$ V", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb882d15a9fc0fc8c14142", "type": "singleCorrect", "question": {"text": "The equal charges (say 'q') are placed at a distance of $4r$ and a third charge $(-2q)$ is placed at a mid-point. The potential energy of the system is ($\\epsilon_0=$ permittivity of free space)", "image": null}, "options": [{"id": "8RcGw", "label": "A", "text": "$\\dfrac{-9q^2}{8\\pi\\epsilon_0 r}$", "isCorrect": false, "image": null}, {"id": "DF1Y7", "label": "B", "text": "$\\dfrac{9q^2}{8\\pi\\epsilon_0 r}$", "isCorrect": false, "image": null}, {"id": "zUOoH", "label": "C", "text": "$\\dfrac{-7q^2}{16\\pi\\epsilon_0 r}$", "isCorrect": true, "image": null}, {"id": "9kPmp", "label": "D", "text": "$\\dfrac{7q^2}{16\\pi\\epsilon_0 r}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The potential energy of a system of three charges is given by the sum of the potential energies of all pairs:<br><br>$U = \\dfrac{1}{4\\pi\\epsilon_0} \\left[ \\dfrac{q_1 q_2}{r_{12}} + \\dfrac{q_1 q_3}{r_{13}} + \\dfrac{q_2 q_3}{r_{23}} \\right]$<br><br>Given $q_1 = q$, $q_2 = q$, and $q_3 = -2q$.<br><br>The distance between $q_1$ and $q_2$ is $r_{12} = 4r$.<br><br>The third charge $q_3$ is placed at the mid-point, so the distance from $q_3$ to each of the other charges is $r_{13} = 2r$ and $r_{23} = 2r$.<br><br>Substituting these values into the potential energy formula:<br><br>$U = \\dfrac{1}{4\\pi\\epsilon_0} \\left[ \\dfrac{q \\cdot q}{4r} + \\dfrac{q \\cdot (-2q)}{2r} + \\dfrac{q \\cdot (-2q)}{2r} \\right]$<br><br>$U = \\dfrac{1}{4\\pi\\epsilon_0} \\left[ \\dfrac{q^2}{4r} - \\dfrac{2q^2}{2r} - \\dfrac{2q^2}{2r} \\right]$<br><br>$U = \\dfrac{1}{4\\pi\\epsilon_0} \\left[ \\dfrac{q^2}{4r} - \\dfrac{q^2}{r} - \\dfrac{q^2}{r} \\right]$<br><br>$U = \\dfrac{1}{4\\pi\\epsilon_0} \\left[ \\dfrac{q^2}{4r} - \\dfrac{2q^2}{r} \\right]$<br><br>$U = \\dfrac{1}{4\\pi\\epsilon_0} \\left[ \\dfrac{q^2 - 8q^2}{4r} \\right]$<br><br>$U = \\dfrac{-7q^2}{16\\pi\\epsilon_0 r}$<br><br>Answer: $\\dfrac{-7q^2}{16\\pi\\epsilon_0 r}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a88c30a4553e1bdb65", "type": "singleCorrect", "question": {"text": "If charge $+q$ is taken from one point to another over an equipotential surface, then", "image": null}, "options": [{"id": "RpKEk", "label": "A", "text": "work done on the charge continuously increases.", "isCorrect": false, "image": null}, {"id": "he3s8", "label": "B", "text": "work is done by the charge.", "isCorrect": false, "image": null}, {"id": "Zg2Db", "label": "C", "text": "work done on the charge is constant.", "isCorrect": false, "image": null}, {"id": "ESlxw", "label": "D", "text": "no work is done.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The work done in moving a charge $q$ from point $A$ to point $B$ is given by $W = q(V_B - V_A)$.<br><br>For an equipotential surface, the electric potential at all points is the same, which means $V_A = V_B$.<br><br>Therefore, the potential difference $\\Delta V = V_B - V_A = 0$.<br><br>Substituting this into the work equation gives $W = q \\times 0 = 0$.<br><br>Hence, no work is done in moving a charge over an equipotential surface.<br><br>Answer: no work is done.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a58c30a4553e1bdb49", "type": "singleCorrect", "question": {"text": "A charge $Q$ is placed at each corner of a cube of side $r$. The potential at the centre of the cube is ($\\epsilon_0$ = permittivity of free space)", "image": null}, "options": [{"id": "MMthl", "label": "A", "text": "$\\dfrac{4Q}{\\pi\\epsilon_0 r\\sqrt{3}}$", "isCorrect": true, "image": null}, {"id": "xM9K1", "label": "B", "text": "$\\dfrac{8Q}{\\pi\\epsilon_0 r\\sqrt{3}}$", "isCorrect": false, "image": null}, {"id": "4i8tq", "label": "C", "text": "$\\dfrac{16Q}{3\\pi\\epsilon_0 r}$", "isCorrect": false, "image": null}, {"id": "TB0kV", "label": "D", "text": "$\\dfrac{32Q}{\\pi\\epsilon_0 r\\sqrt{3}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The length of the body diagonal of a cube of side $r$ is $r\\sqrt{3}$.<br><br>The distance from the centre of the cube to any corner is half of the body diagonal, which is $d = \\dfrac{r\\sqrt{3}}{2}$.<br><br>The electric potential at the centre due to a single charge $Q$ at one corner is $V_1 = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{Q}{d}$.<br><br>Since there are $8$ identical charges at the $8$ corners, the total potential at the centre is $V = 8 V_1$.<br><br>Substituting the value of $d$:<br><br>$V = 8 \\times \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{Q}{\\dfrac{r\\sqrt{3}}{2}}$<br><br>$V = \\dfrac{16Q}{4\\pi\\epsilon_0 r\\sqrt{3}}$<br><br>$V = \\dfrac{4Q}{\\pi\\epsilon_0 r\\sqrt{3}}$<br><br>Answer: $\\dfrac{4Q}{\\pi\\epsilon_0 r\\sqrt{3}}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d34f8c30a4553e1be25c", "type": "singleCorrect", "question": {"text": "Four electric charges $+q$ , $+q$ , $-q$ , and $-q$ are placed in order at the corners of a square of side '$2r$'. The electric potential at a point midway between the two negative charges is", "image": null}, "options": [{"id": "KmCNk", "label": "A", "text": "$\\dfrac{1}{4\\pi\\epsilon_0}\\,\\dfrac{2q}{r}\\left[\\dfrac{1}{\\sqrt{5}} - 1\\right]$", "isCorrect": true, "image": null}, {"id": "WQ3co", "label": "B", "text": "$\\dfrac{1}{4\\pi\\epsilon_0}\\,\\dfrac{q}{r}\\left[\\dfrac{1}{\\sqrt{5}} + 1\\right]$", "isCorrect": false, "image": null}, {"id": "RCJv6", "label": "C", "text": "$\\dfrac{1}{4\\pi\\epsilon_0}\\,\\dfrac{2q}{r}\\left[1 - \\sqrt{5}\\right]$", "isCorrect": false, "image": null}, {"id": "niiRY", "label": "D", "text": "$\\dfrac{1}{4\\pi\\epsilon_0}\\,\\dfrac{q}{r}\\left[1 + \\sqrt{5}\\right]$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the corners of the square be A, B, C, and D in order, with charges $+q$, $+q$, $-q$, and $-q$ respectively.<br><br>The side length of the square is $2r$.<br><br>Let P be the midpoint of the side CD, which connects the two negative charges.<br><br>The distance of P from the charges at C and D is:<br><br>$r_C = r_D = r$<br><br>The distance of P from the charges at A and B can be found using the Pythagorean theorem:<br><br>$r_A = r_B = \\sqrt{r^2 + (2r)^2} = \\sqrt{5}r$<br><br>The total electric potential at P is the algebraic sum of the potentials due to all four charges:<br><br>$V = V_A + V_B + V_C + V_D$<br><br>$V = \\dfrac{1}{4\\pi\\epsilon_0} \\left( \\dfrac{q}{\\sqrt{5}r} + \\dfrac{q}{\\sqrt{5}r} - \\dfrac{q}{r} - \\dfrac{q}{r} \\right)$<br><br>$V = \\dfrac{1}{4\\pi\\epsilon_0} \\left( \\dfrac{2q}{\\sqrt{5}r} - \\dfrac{2q}{r} \\right)$<br><br>$V = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{2q}{r} \\left[ \\dfrac{1}{\\sqrt{5}} - 1 \\right]$<br><br>Answer: $\\dfrac{1}{4\\pi\\epsilon_0}\\,\\dfrac{2q}{r}\\left[\\dfrac{1}{\\sqrt{5}} - 1\\right]$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3088c30a4553e1bdf6d", "type": "singleCorrect", "question": {"text": "Two equal positive charges each of value 'q' are placed at points A and B, where $AB = 3x$. A third charge $-3q$ is placed at point C at a distance $x$ from A on AB. The potential energy of the system is nearly ($\\epsilon_0$ = permittivity of free space)", "image": null}, "options": [{"id": "C7wbj", "label": "A", "text": "$\\dfrac{q^2}{4\\pi\\epsilon_0 x}$", "isCorrect": false, "image": null}, {"id": "qiyka", "label": "B", "text": "$\\dfrac{-2q^2}{4\\pi\\epsilon_0 x}$", "isCorrect": false, "image": null}, {"id": "GIFkK", "label": "C", "text": "$\\dfrac{3q^2}{4\\pi\\epsilon_0 x}$", "isCorrect": false, "image": null}, {"id": "1ZhrR", "label": "D", "text": "$\\dfrac{-4q^2}{4\\pi\\epsilon_0 x}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The potential energy of the system is the sum of the potential energies of all pairs of charges.<br><br>$U = U_{AB} + U_{BC} + U_{CA}$<br><br>$U = \\dfrac{1}{4\\pi\\epsilon_0} \\left( \\dfrac{q_A q_B}{r_{AB}} + \\dfrac{q_B q_C}{r_{BC}} + \\dfrac{q_C q_A}{r_{CA}} \\right)$<br><br>Given $q_A = q$, $q_B = q$, and $q_C = -3q$.<br><br>The distances between the charges are:<br><br>$r_{AB} = 3x$<br><br>$r_{CA} = x$<br><br>$r_{BC} = 3x - x = 2x$<br><br>Substituting these values into the potential energy expression:<br><br>$U = \\dfrac{1}{4\\pi\\epsilon_0} \\left( \\dfrac{q \\cdot q}{3x} + \\dfrac{q \\cdot (-3q)}{2x} + \\dfrac{(-3q) \\cdot q}{x} \\right)$<br><br>$U = \\dfrac{q^2}{4\\pi\\epsilon_0 x} \\left( \\dfrac{1}{3} - \\dfrac{3}{2} - 3 \\right)$<br><br>$U = \\dfrac{q^2}{4\\pi\\epsilon_0 x} \\left( \\dfrac{2 - 9 - 18}{6} \\right)$<br><br>$U = \\dfrac{-25}{6} \\left( \\dfrac{q^2}{4\\pi\\epsilon_0 x} \\right)$<br><br>$U \\approx -4.167 \\left( \\dfrac{q^2}{4\\pi\\epsilon_0 x} \\right)$<br><br>Therefore, the potential energy of the system is nearly $\\dfrac{-4q^2}{4\\pi\\epsilon_0 x}$.<br><br>Answer: $\\dfrac{-4q^2}{4\\pi\\epsilon_0 x}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3068c30a4553e1bdf57", "type": "singleCorrect", "question": {"text": "A particle of mass 'm' and charge 'q', initially at rest, is accelerated by a uniform electric field 'E' through a distance 'D' and is then allowed to approach a fixed static charge 'Q' of the same sign. The distance of the closest approach of the charge q is<br>[ $\\epsilon_0$ = permittivity of free space ]", "image": null}, "options": [{"id": "z6VC7", "label": "A", "text": "$Q / 4\\pi\\epsilon_0 D$", "isCorrect": false, "image": null}, {"id": "Vezss", "label": "B", "text": "$Q / 4\\pi\\epsilon_0 ED$", "isCorrect": true, "image": null}, {"id": "5yazw", "label": "C", "text": "$Q / 2\\pi\\epsilon_0 D^2$", "isCorrect": false, "image": null}, {"id": "cPgTa", "label": "D", "text": "$Q / 4\\pi\\epsilon_0 E$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Work done by the uniform electric field on the particle is $W = qED$.<br><br>By work-energy theorem, the kinetic energy gained by the particle is $K = qED$.<br><br>At the distance of closest approach $r$, the entire kinetic energy is converted into electrostatic potential energy.<br><br>The electrostatic potential energy of the system is $U = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{qQ}{r}$.<br><br>Equating kinetic energy and potential energy:<br><br>$qED = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{qQ}{r}$<br><br>$r = \\dfrac{Q}{4\\pi\\epsilon_0 ED}$<br><br>Answer: $Q / 4\\pi\\epsilon_0 ED$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2fb8c30a4553e1bdee7", "type": "singleCorrect", "question": {"text": "'$n$' small spherical drops of the same size which are charged to 'V' volt each coalesce to form a single big drop. The potential of a big drop is", "image": null}, "options": [{"id": "c1u7F", "label": "A", "text": "$nV$", "isCorrect": false, "image": null}, {"id": "onYdE", "label": "B", "text": "$\\dfrac{V}{n}$", "isCorrect": false, "image": null}, {"id": "7oXUD", "label": "C", "text": "$\\left(n^{\\frac{1}{3}}\\right)V$", "isCorrect": false, "image": null}, {"id": "7oyjQ", "label": "D", "text": "$\\left(n^{\\frac{2}{3}}\\right)V$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let the radius of each small drop be $r$ and its charge be $q$.<br><br>The potential of each small drop is $V = \\dfrac{1}{4\\pi\\epsilon_0}\\dfrac{q}{r}$.<br><br>When $n$ such drops coalesce, the total charge of the big drop is $Q = nq$.<br><br>The volume is conserved, so the volume of the big drop is equal to the sum of the volumes of the $n$ small drops.<br><br>$\\dfrac{4}{3}\\pi R^3 = n \\left(\\dfrac{4}{3}\\pi r^3\\right)$<br><br>$R^3 = n r^3$<br><br>$R = n^{\\frac{1}{3}} r$<br><br>The potential of the single big drop is:<br><br>$V' = \\dfrac{1}{4\\pi\\epsilon_0}\\dfrac{Q}{R}$<br><br>$V' = \\dfrac{1}{4\\pi\\epsilon_0}\\dfrac{nq}{n^{\\frac{1}{3}} r}$<br><br>$V' = n^{1 - \\frac{1}{3}} \\left(\\dfrac{1}{4\\pi\\epsilon_0}\\dfrac{q}{r}\\right)$<br><br>$V' = n^{\\frac{2}{3}} V$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ec8c30a4553e1bde43", "type": "singleCorrect", "question": {"text": "Three point charges Q, $+2q$ and $+q$ are placed at the vertices of a right-angled isosceles triangle of length $\\sqrt{2}a$ as shown in figure. The net electrostatic potential energy of the configuration is zero, if Q is equal to<br><img style=\"width: 230px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/17_april_shift_2__q33_d1.png\" />", "image": null}, "options": [{"id": "FXq5N", "label": "A", "text": "$-\\dfrac{1}{2\\sqrt{3}}q$", "isCorrect": false, "image": null}, {"id": "Si7sJ", "label": "B", "text": "$-\\dfrac{\\sqrt{2}}{3}q$", "isCorrect": true, "image": null}, {"id": "6SUx4", "label": "C", "text": "$-\\dfrac{\\sqrt{3}}{2}q$", "isCorrect": false, "image": null}, {"id": "j7XCq", "label": "D", "text": "$-\\sqrt{\\dfrac{2}{3}}\\,q$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The net electrostatic potential energy of a system of three charges is given by the sum of the potential energies of all pairs of charges.<br><br>Let the charges be $q_1 = Q$, $q_2 = 2q$, and $q_3 = q$.<br><br>From the given right-angled isosceles triangle, the distances between the charges are:<br>Distance between $Q$ and $2q$, $r_{12} = \\sqrt{2}a$<br>Distance between $Q$ and $q$, $r_{13} = \\sqrt{2}a$<br>Distance between $2q$ and $q$ (hypotenuse), $r_{23} = \\sqrt{(\\sqrt{2}a)^2 + (\\sqrt{2}a)^2} = \\sqrt{2a^2 + 2a^2} = \\sqrt{4a^2} = 2a$<br><br>The net potential energy $U$ is:<br>$U = \\dfrac{1}{4\\pi\\epsilon_0} \\left( \\dfrac{q_1 q_2}{r_{12}} + \\dfrac{q_1 q_3}{r_{13}} + \\dfrac{q_2 q_3}{r_{23}} \\right)$<br><br>Substituting the values:<br>$U = \\dfrac{1}{4\\pi\\epsilon_0} \\left( \\dfrac{Q(2q)}{\\sqrt{2}a} + \\dfrac{Q(q)}{\\sqrt{2}a} + \\dfrac{(2q)(q)}{2a} \\right)$<br><br>Given that the net electrostatic potential energy is zero ($U = 0$):<br>$\\dfrac{2qQ}{\\sqrt{2}a} + \\dfrac{qQ}{\\sqrt{2}a} + \\dfrac{2q^2}{2a} = 0$<br><br>Dividing the equation by $\\dfrac{q}{a}$:<br>$\\dfrac{2Q}{\\sqrt{2}} + \\dfrac{Q}{\\sqrt{2}} + q = 0$<br><br>$\\dfrac{3Q}{\\sqrt{2}} + q = 0$<br><br>$\\dfrac{3Q}{\\sqrt{2}} = -q$<br><br>$Q = -\\dfrac{\\sqrt{2}}{3}q$<br><br>Answer: $-\\dfrac{\\sqrt{2}}{3}q$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3408c30a4553e1be1c6", "type": "singleCorrect", "question": {"text": "Three point charges +q, +2q and +Q are placed at the vertices of an equilateral triangle. If the potential energy of the system of three charges is zero, the value of Q in terms of q is", "image": null}, "options": [{"id": "L6HkY", "label": "A", "text": "$-\\dfrac{q}{3}$", "isCorrect": false, "image": null}, {"id": "uO6cQ", "label": "B", "text": "$\\dfrac{-2q}{3}$", "isCorrect": true, "image": null}, {"id": "j5ABb", "label": "C", "text": "$\\dfrac{q}{2}$", "isCorrect": false, "image": null}, {"id": "td9RP", "label": "D", "text": "$\\dfrac{3q}{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the side length of the equilateral triangle be $a$.<br><br>The total potential energy of the system of three charges is the sum of the potential energies of all pairs of charges:<br><br>$U = \\dfrac{1}{4\\pi\\epsilon_0} \\left( \\dfrac{q \\cdot 2q}{a} + \\dfrac{2q \\cdot Q}{a} + \\dfrac{Q \\cdot q}{a} \\right)$<br><br>Given that the potential energy of the system is zero, $U = 0$.<br><br>$\\dfrac{1}{4\\pi\\epsilon_0 a} (2q^2 + 2qQ + qQ) = 0$<br><br>$2q^2 + 3qQ = 0$<br><br>$q(2q + 3Q) = 0$<br><br>Since $q \\neq 0$, we have:<br><br>$2q + 3Q = 0$<br><br>$Q = -\\dfrac{2q}{3}$<br><br>Answer: $\\dfrac{-2q}{3}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2cf8c30a4553e1bdd0a", "type": "singleCorrect", "question": {"text": "Two charges $q_1$ and $q_2$ are separated by a distance of 30cm. A third charge $q_3$ initially at point C is shown in figure, is moved along the circular path of radius 40 cm from C to D. If the difference in potential energy due to movement of $q_3$ from C to D is $q_3 k/4\\pi\\varepsilon_0$, the value of K is ($\\varepsilon_0$ = permittivity of free space)<br><img style=\"width: 250px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/15_april_shift_2__q20_d1.png\" />", "image": null}, "options": [{"id": "8Cuen", "label": "A", "text": "$8q_2$", "isCorrect": true, "image": null}, {"id": "qNcVM", "label": "B", "text": "$8q_1$", "isCorrect": false, "image": null}, {"id": "sUukK", "label": "C", "text": "$6q_2$", "isCorrect": false, "image": null}, {"id": "Mv67y", "label": "D", "text": "$6q_1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The initial potential energy of the system when charge $q_3$ is at point C is given by:<br><br>$U_C = \\dfrac{1}{4\\pi\\varepsilon_0} \\left( \\dfrac{q_1 q_3}{AC} + \\dfrac{q_2 q_3}{BC} \\right)$<br><br>From the given figure, $AC = 40\\text{ cm} = 0.4\\text{ m}$ and $AB = 30\\text{ cm} = 0.3\\text{ m}$.<br>In the right-angled triangle ABC, the distance BC is:<br>$BC = \\sqrt{AB^2 + AC^2} = \\sqrt{(0.3)^2 + (0.4)^2} = 0.5\\text{ m}$<br><br>So, $U_C = \\dfrac{q_3}{4\\pi\\varepsilon_0} \\left( \\dfrac{q_1}{0.4} + \\dfrac{q_2}{0.5} \\right)$<br><br>When $q_3$ is moved to point D along the circular path centered at A, the distance AD is equal to the radius of the path:<br>$AD = AC = 40\\text{ cm} = 0.4\\text{ m}$<br><br>The distance BD is:<br>$BD = AD - AB = 0.4\\text{ m} - 0.3\\text{ m} = 0.1\\text{ m}$<br><br>The final potential energy of the system when $q_3$ is at point D is:<br><br>$U_D = \\dfrac{1}{4\\pi\\varepsilon_0} \\left( \\dfrac{q_1 q_3}{AD} + \\dfrac{q_2 q_3}{BD} \\right) = \\dfrac{q_3}{4\\pi\\varepsilon_0} \\left( \\dfrac{q_1}{0.4} + \\dfrac{q_2}{0.1} \\right)$<br><br>The difference in potential energy is:<br><br>$\\Delta U = U_D - U_C = \\dfrac{q_3}{4\\pi\\varepsilon_0} \\left( \\dfrac{q_1}{0.4} + \\dfrac{q_2}{0.1} - \\dfrac{q_1}{0.4} - \\dfrac{q_2}{0.5} \\right)$<br><br>$\\Delta U = \\dfrac{q_3}{4\\pi\\varepsilon_0} \\left( \\dfrac{q_2}{0.1} - \\dfrac{q_2}{0.5} \\right)$<br><br>$\\Delta U = \\dfrac{q_3 q_2}{4\\pi\\varepsilon_0} \\left( 10 - 2 \\right) = \\dfrac{q_3 (8q_2)}{4\\pi\\varepsilon_0}$<br><br>We are given that the difference in potential energy is $\\dfrac{q_3 k}{4\\pi\\varepsilon_0}$.<br><br>Comparing the two expressions, we get:<br>$k = 8q_2$<br><br>Answer: $8q_2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3328c30a4553e1be139", "type": "singleCorrect", "question": {"text": "Two point charges $q_1 = 6\\ \\mu\\text{C}$ and $q_2 = 4\\ \\mu\\text{C}$ are kept at points A and B in air where distance $AB = 10$ cm. What is the increase in potential energy of the system when $q_2$ is moved towards $q_1$, by 2 cm ? $\\left(\\dfrac{1}{4\\pi\\epsilon_0} = 9 \\times 10^9\\ \\text{SI units}\\right)$", "image": null}, "options": [{"id": "1tbee", "label": "A", "text": "$21.6$ J", "isCorrect": false, "image": null}, {"id": "KOf6K", "label": "B", "text": "$216$ J", "isCorrect": false, "image": null}, {"id": "EUiyy", "label": "C", "text": "$0.54$ J", "isCorrect": true, "image": null}, {"id": "HVFrx", "label": "D", "text": "$54$ J", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Initial potential energy of the system is given by $U_i = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q_1 q_2}{r_i}$<br><br>Final potential energy of the system is given by $U_f = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q_1 q_2}{r_f}$<br><br>Increase in potential energy $\\Delta U = U_f - U_i = \\dfrac{q_1 q_2}{4\\pi\\epsilon_0} \\left( \\dfrac{1}{r_f} - \\dfrac{1}{r_i} \\right)$<br><br>Substituting the given values:<br>$q_1 = 6 \\times 10^{-6}\\ \\text{C}$<br>$q_2 = 4 \\times 10^{-6}\\ \\text{C}$<br>$r_i = 10\\ \\text{cm} = 0.1\\ \\text{m}$<br>$r_f = 10 - 2 = 8\\ \\text{cm} = 0.08\\ \\text{m}$<br><br>$\\Delta U = 9 \\times 10^9 \\times 6 \\times 10^{-6} \\times 4 \\times 10^{-6} \\left( \\dfrac{1}{0.08} - \\dfrac{1}{0.1} \\right)$<br><br>$\\Delta U = 216 \\times 10^{-3} \\times (12.5 - 10)$<br><br>$\\Delta U = 0.216 \\times 2.5 = 0.54\\ \\text{J}$<br><br>Answer: $0.54$ J", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2988c30a4553e1bdaba", "type": "singleCorrect", "question": {"text": "The electric potential at the center of two concentric half rings of radii $R_1$ and $R_2$, having same linear charge density $\\lambda$ is ($\\epsilon_0$ = permittivity of free space)<br><img style=\"width: 400px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/13_april_shift_2__q28_d1.png\" />", "image": null}, "options": [{"id": "7OK0d", "label": "A", "text": "$2\\lambda / \\epsilon_0$", "isCorrect": false, "image": null}, {"id": "ryO1L", "label": "B", "text": "$\\lambda / 2\\epsilon_0$", "isCorrect": true, "image": null}, {"id": "GLA9T", "label": "C", "text": "$\\lambda / 4\\epsilon_0$", "isCorrect": false, "image": null}, {"id": "cydMm", "label": "D", "text": "$\\lambda / \\epsilon_0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The electric potential $V$ at the center of a uniformly charged circular arc of radius $R$ and total charge $Q$ is given by:<br><br>$V = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{Q}{R}$<br><br>For a half ring with linear charge density $\\lambda$, the length of the arc is $\\pi R$. Therefore, the total charge on the half ring is:<br><br>$Q = \\lambda (\\pi R)$<br><br>Substituting this into the potential formula, the potential at the center due to one half ring is:<br><br>$V = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{\\lambda \\pi R}{R} = \\dfrac{\\lambda}{4\\epsilon_0}$<br><br>Notice that the potential at the center of a half ring depends only on the linear charge density $\\lambda$ and is independent of its radius $R$.<br><br>Since electric potential is a scalar quantity, the total potential at the center $O$ due to the two concentric half rings is the algebraic sum of their individual potentials:<br><br>$V_{net} = V_1 + V_2$<br><br>$V_{net} = \\dfrac{\\lambda}{4\\epsilon_0} + \\dfrac{\\lambda}{4\\epsilon_0} = \\dfrac{\\lambda}{2\\epsilon_0}$<br><br>Answer: $\\lambda / 2\\epsilon_0$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2958c30a4553e1bdaa0", "type": "singleCorrect", "question": {"text": "Two isolated metallic spheres of radii $R$ and $2R$ are charged such that both have the same charge density $\\sigma$. The spheres are then connected by a thin conducting wire. If the new charge density of the larger sphere is $\\sigma_1$. The ratio $\\sigma_1$ to $\\sigma$ is", "image": null}, "options": [{"id": "9ogRZ", "label": "A", "text": "$9:4$", "isCorrect": false, "image": null}, {"id": "Jes9a", "label": "B", "text": "$4:3$", "isCorrect": false, "image": null}, {"id": "NsDuC", "label": "C", "text": "$5:3$", "isCorrect": false, "image": null}, {"id": "0C30i", "label": "D", "text": "$5:6$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let the initial charge on the smaller sphere be $Q_1$ and on the larger sphere be $Q_2$.<br><br>$Q_1 = \\sigma(4\\pi R^2)$<br><br>$Q_2 = \\sigma(4\\pi(2R)^2) = 16\\pi R^2\\sigma$<br><br>The total charge of the system is $Q = Q_1 + Q_2 = 20\\pi R^2\\sigma$.<br><br>When the spheres are connected by a conducting wire, charge flows until their potentials become equal. Let the new charges on the smaller and larger spheres be $q_1$ and $q_2$ respectively.<br><br>Equating the potentials:<br><br>$\\dfrac{1}{4\\pi\\epsilon_0}\\dfrac{q_1}{R} = \\dfrac{1}{4\\pi\\epsilon_0}\\dfrac{q_2}{2R}$<br><br>$q_2 = 2q_1$<br><br>By conservation of charge, $q_1 + q_2 = Q$.<br><br>$q_1 + 2q_1 = 20\\pi R^2\\sigma$<br><br>$3q_1 = 20\\pi R^2\\sigma$<br><br>$q_1 = \\dfrac{20\\pi R^2\\sigma}{3}$<br><br>The new charge on the larger sphere is $q_2 = 2q_1 = \\dfrac{40\\pi R^2\\sigma}{3}$.<br><br>The new charge density of the larger sphere is $\\sigma_1 = \\dfrac{q_2}{4\\pi(2R)^2}$.<br><br>$\\sigma_1 = \\dfrac{\\dfrac{40\\pi R^2\\sigma}{3}}{16\\pi R^2} = \\dfrac{40}{48}\\sigma = \\dfrac{5}{6}\\sigma$<br><br>Therefore, the ratio $\\dfrac{\\sigma_1}{\\sigma}$ is $\\dfrac{5}{6}$.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b58c30a4553e1bdbfb", "type": "singleCorrect", "question": {"text": "Which of the following statements is NOT TRUE?<br>a. Work done to move a charge on an equipotential surface is not zero.<br>b. Equipotential surfaces are the surfaces where the potential is constant.<br>c. Equipotential surfaces for a uniform electric field are parallel and equidistant from each other.<br>d. Electric field is always perpendicular to an equipotential surface.", "image": null}, "options": [{"id": "iRQvh", "label": "A", "text": "c", "isCorrect": false, "image": null}, {"id": "7KVJt", "label": "B", "text": "a", "isCorrect": true, "image": null}, {"id": "I72o5", "label": "C", "text": "d", "isCorrect": false, "image": null}, {"id": "CYT2v", "label": "D", "text": "b", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The work done in moving a charge $q$ from point A to point B is given by $W = q(V_B - V_A)$.<br><br>For an equipotential surface, the potential is constant everywhere, which means $V_A = V_B$.<br><br>Substituting this into the work equation gives $W = q(0) = 0$.<br><br>Statement a claims that the work done to move a charge on an equipotential surface is not zero, which is incorrect.<br><br>Statements b, c, and d describe standard properties of equipotential surfaces and electric fields, and are all true.<br><br>Answer: a", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b58c30a4553e1bdbf4", "type": "singleCorrect", "question": {"text": "Two metal sphere of radius $R$ and $3R$ have same surface charge density $\\sigma$. If they are brought in contact and then separated, the surface charge density on smaller and bigger sphere becomes $\\sigma_1$ and $\\sigma_2$, respectively. The ratio $\\dfrac{\\sigma_1}{\\sigma_2}$ is.", "image": null}, "options": [{"id": "fhqQc", "label": "A", "text": "$\\dfrac{1}{9}$", "isCorrect": false, "image": null}, {"id": "1G2OS", "label": "B", "text": "$9$", "isCorrect": false, "image": null}, {"id": "cnjj3", "label": "C", "text": "$\\dfrac{1}{3}$", "isCorrect": false, "image": null}, {"id": "wbFW7", "label": "D", "text": "$3$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "When the two metal spheres are brought in contact and separated, they acquire the same electric potential.<br><br>Let the final surface charge densities be $\\sigma_1$ and $\\sigma_2$.<br><br>The potential of a conducting sphere of radius $r$ and surface charge density $\\sigma'$ is given by $V = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q}{r} = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{\\sigma' (4\\pi r^2)}{r} = \\dfrac{\\sigma' r}{\\epsilon_0}$<br><br>Equating the final potentials of the two spheres:<br><br>$V_1 = V_2$<br><br>$\\dfrac{\\sigma_1 R}{\\epsilon_0} = \\dfrac{\\sigma_2 (3R)}{\\epsilon_0}$<br><br>$\\sigma_1 R = 3 \\sigma_2 R$<br><br>$\\dfrac{\\sigma_1}{\\sigma_2} = 3$<br><br>Answer: $3$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b18c30a4553e1bdbce", "type": "singleCorrect", "question": {"text": "Following figure indicates the electric potential V as a function through 4 regions on x-axis. Which of the following is correct for the electric field E in these regions?<br><img style=\"width: 400px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/11_april_shift_1__q4_d1.png\" />", "image": null}, "options": [{"id": "zKmMQ", "label": "A", "text": "$E_1 < E_2 < E_3 < E_4$", "isCorrect": false, "image": null}, {"id": "CQBbZ", "label": "B", "text": "$E_2 = E_4$ and $E_1 < E_2$", "isCorrect": false, "image": null}, {"id": "8V1kk", "label": "C", "text": "$E_1 = E_3$ and $E_2 < E_4$", "isCorrec
