etic force experienced by the electron, $\\mathrm{F}=\\mathrm{qvB} \\sin \\theta$\n\nAs electron is projected along the axis, $\\theta=0$ $\\therefore \\quad \\mathrm{F}=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261bf0279619d9d8a2f0a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "The charges $2 \\mathrm{q},-\\mathrm{q},-\\mathrm{q}$ are located at the vertices of an equilateral triangle. At the circumference of the triangle", "image": null}, "options": [{"id": "25slL", "text": "the field is zero but potential is not zero.", "image": null, "isCorrect": false}, {"id": "nurWB", "text": "the field is non-zero but the potential is zero.", "image": null, "isCorrect": true}, {"id": "FLIK7", "text": "both, field and potential are zero.", "image": null, "isCorrect": false}, {"id": "b6F5U", "text": "both, field and potential are non-zero.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From charge configuration, at the centre electric field is non-zero.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/NclPcKESPwrp47S3X5ghNK5M9PxzO0sBSAlhPOKZSHE.original.fullsize.png\"><br>\nPotential at the centre due to $2 \\mathrm{q}$ charge $\\mathrm{V}_{2 \\mathrm{q}}=\\frac{2 \\mathrm{q}}{\\mathrm{r}}$ and potential due to $-\\mathrm{q}$ charge $\\mathrm{V}_{-\\mathrm{q}}=-\\frac{\\mathrm{q}}{\\mathrm{r}} \\quad(\\mathrm{r}=$ distance of centre point $)$\n$\\therefore \\quad$ total potential $\\mathrm{V}=\\mathrm{V}_{2 \\mathrm{q}}+\\mathrm{V}_{-\\mathrm{q}}+\\mathrm{V}_{-\\mathrm{q}}=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261990279619d9d8a2dd8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "Three charges $q, Q$ and $+4 q$ are placed in a straight line of length $d$ at points at distances $0, \\frac{d}{2}$ and d respectively. In order to make the net force on $q$ to be zero, the value of $Q$ should be", "image": null}, "options": [{"id": "yjJtY", "text": "$-2 q$", "image": null, "isCorrect": false}, {"id": "0mh6i", "text": "$\\frac{-q}{2}$", "image": null, "isCorrect": false}, {"id": "ijzwb", "text": "$-q$", "image": null, "isCorrect": true}, {"id": "3LwG0", "text": "$\\frac{-3}{2} q$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Consider the diagram below:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/kyLxW9b4NJSPgnkIxYerqkKN28EfXaJA2w-NOnHChTA.original.fullsize.png\"><br>\nTo make net force on $q$ is zero, charge $Q$ should be negative.\n$\\begin{aligned}\n& \\therefore \\frac{k q Q}{\\left(\\frac{d}{2}\\right)^2}+\\frac{k q(4 q)}{d^2}=0 \\\\\n& \\Rightarrow Q=-q\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261820279619d9d8a2d21", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "Three equal charges $q_1, q_2$ and $q_3$ are placed on the three corners of a square of side $a$. If the force between $q_1$ and $q_2$ is $F_{12}$ and that between $q_1$ and $q_3$ is $F_{13}$, then the ratio of magnitudes $\\left(\\frac{F_{12}}{F_{13}}\\right)$ is", "image": null}, "options": [{"id": "OndBK", "text": "$\\frac{1}{\\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "2lVOM", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "djOI3", "text": "2", "image": null, "isCorrect": true}, {"id": "qqLGS", "text": "$\\sqrt{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Suppose the side of square is $a$. Then the diagonal is equal to $\\sqrt{2} a$\n$\\begin{aligned} & \\therefore F_{12}=\\frac{1}{4 \\pi \\varepsilon_0} \\frac{q_1 q_2}{a^2} \\\\ & \\text { and } F_{13}=\\frac{1}{4 \\pi \\varepsilon_0} \\frac{q_1 q_3}{(\\sqrt{2} a)^2}\\end{aligned}$\nWe know, $q_1=q_2=q_3=q$\nSo, $\\frac{F_{12}}{F_{13}}=\\frac{2 q_2}{q_3}=2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261710279619d9d8a2c9d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "Two-point charges $+Q$ and $+q$ repel each other with a force of $100 \\mathrm{~N}$. Keeping the distance between them unchanged, if $Q$ is increased by $10 \\%$ and $q$ is decreased by $q$ the force of repulsion between them will.", "image": null}, "options": [{"id": "QQ2Dw", "text": "decrease by $10 \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "G4wrx", "text": "decrease by $1 \\mathrm{~N}$", "image": null, "isCorrect": true}, {"id": "T2mPi", "text": "increase by $10 \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "YKfxs", "text": "remain same", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, $100 \\mathrm{~N}=\\frac{k Q q}{r^2}$ and $F=\\frac{k(1.1 Q)(0.9 q)}{r^2}$\nTaking the ratio of above two equations:\n$F=99$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2615e0279619d9d8a2bfc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "There are two metallic spheres of same radii but one is solid and other is hollow then", "image": null}, "options": [{"id": "S5zGd", "text": "they can be charged equally (maximum).", "image": null, "isCorrect": true}, {"id": "Salwl", "text": "solid sphere can be given more charge.", "image": null, "isCorrect": false}, {"id": "DSLaw", "text": "hollow sphere can be given more charge.", "image": null, "isCorrect": false}, {"id": "621u9", "text": "solid sphere can be charged double to hollow sphere.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Concept: Changes reside on the outer surface due to mutual repulsion, therefore, both metallic spheres (solid or hollow) can be charged equally.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2613b0279619d9d8a2ae3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "Two small identical metal balls are equally charged and placed at a fixed distance away from each other. They experience the electrostatic force ' $F$ ' A similar uncharged ball after touching one of them is placed at the middle point between the two balls. The force experienced by this ball is", "image": null}, "options": [{"id": "CYQhJ", "text": "$\\frac{F}{2}$", "image": null, "isCorrect": false}, {"id": "Et549", "text": "F", "image": null, "isCorrect": true}, {"id": "Skima", "text": "$4 \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "RpT8D", "text": "$2 \\mathrm{~F}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The force between equally charged identical balls is:\n$\\mathrm{F}=\\frac{\\mathrm{kQ}^2}{\\mathrm{r}^2}$\nWhen a similar uncharged ball, touches one of them. This ball aquires a charge $\\frac{\\mathrm{Q}}{2}$ and the ball being touched looses $\\frac{\\mathrm{Q}}{2}$.\nNow, the force experienced by the third ball is given by,\n$\\mathrm{F}_{\\text {net }}=\\mathrm{F}_1-\\mathrm{F}_2$\nwhere, $\\mathrm{F}_1=\\frac{\\mathrm{kQ}^2 / 2}{\\left(\\frac{\\mathrm{r}}{2}\\right)^2}=\\frac{2 \\mathrm{kQ}^2}{\\mathrm{r}^2}$ is the repulsion from the first ball\nand $\\mathrm{F}_2=\\frac{\\mathrm{k}\\left(\\frac{\\mathrm{Q}}{2}\\right)^2}{\\left(\\frac{\\mathrm{r}}{2}\\right)^2}=\\frac{\\mathrm{kQ}^2}{\\mathrm{r}^2}$ is the repulsion from the second ball.\n$\\therefore \\mathrm{F}_{\\text {net }}=\\mathrm{F}_1-\\mathrm{F}_2=\\frac{2 \\mathrm{kQ}^2}{\\mathrm{r}^2}-\\frac{\\mathrm{kQ}^2}{\\mathrm{r}^2}=\\mathrm{F}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2613a0279619d9d8a2ad4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "A spherical conductor of diameter $6 \\mathrm{~mm}$ is kept in uniform electric field of intensity $2 \\times 10^7 \\mathrm{~N} / \\mathrm{C}$. The maximum charge on the conductor is\n$\\left[\\frac{1}{4 \\pi \\varepsilon_0}=9 \\times 10^9\\right.$ SI units $]$", "image": null}, "options": [{"id": "TRueZ", "text": "$0.2 \\mu C$", "image": null, "isCorrect": false}, {"id": "GmD7Z", "text": "$2 \\mu C$", "image": null, "isCorrect": false}, {"id": "RVmn1", "text": "$20 \\mu C$", "image": null, "isCorrect": false}, {"id": "4xAte", "text": "$0.02 \\mu C$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Maximum charge on the conductor is:\n$\\begin{aligned} & Q_{\\text {max }}=4 \\pi \\varepsilon_0 R^2 E \\\\ & Q_{\\text {max }}=\\frac{1}{\\left(9 \\times \\frac{10^9 \\mathrm{Nm}^2}{C}\\right)}\\left(3 \\times 10^{-3}\\right)^2\\left(2 \\times 10^7 \\frac{\\mathrm{N}}{\\mathrm{C}}\\right) \\\\ & =2 \\times 10^{-8}=0.02 \\mu \\mathrm{C}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260df0279619d9d8a27fa", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}], "question": {"text": "Two point charges $q_1$ and $q_2$ are ' $l$ ' distance apart. If one of the charges is doubled and the distance between them is halved, the magnitude of force becomes $n$ times, where $n$ is", "image": null}, "options": [{"id": "Gb2Uu", "text": "$8$", "image": null, "isCorrect": true}, {"id": "1tbKw", "text": "$1$", "image": null, "isCorrect": false}, {"id": "1RDv8", "text": "$2$", "image": null, "isCorrect": false}, {"id": "gTtoO", "text": "$16$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The correct option is (A)\nConcept: Functional dependence of Coulombic Force on charges $\\left(q_1, q_2\\right)$ separated with distance $l$ is given by\n$F \\propto \\frac{q_1 q_2}{l^2}$\nTherefore, if one of the charges is doubled and the distance between them is halved, the magnitude of new force\n$F_{\\text {new }} \\propto\\left\\{\\frac{2 q_1 q_2}{\\left(\\frac{l}{2}\\right)^2}\\right\\}$\nSo, $F_{\\text {new }}=8 F$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260cd0279619d9d8a276c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "Three charges each of $+1 \\mu \\mathrm{C}$ are placed at the corners of an equilateral triangle. If the repulsive force between any two charges is $\\mathrm{F}$, then the net force on either charge will be", "image": null}, "options": [{"id": "VRlmE", "text": "$2 \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "0OnRy", "text": "$3 \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "vM4So", "text": "$\\sqrt{2} \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "p8Br6", "text": "$\\sqrt{3} \\mathrm{~F}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/AbRBWW2nD4hsDAi_y-plh-MjRBil1oGeb9YIahbvE5g.original.fullsize.png\"><br>\nThe force on any charge due to each of the other two charges has magnitude $\\mathrm{F}$.\nThe angle between the two forces is $60^{\\circ}$.\nHence the resultant force is given by\n$R=\\sqrt{F^2+F^2+2 F^2 \\cos 60^{\\circ}}=\\sqrt{3} F$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260b90279619d9d8a26cd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "Two positive ions, each carrying a charge ' $\\mathrm{q}$ ' are separated by a distance ' $\\mathrm{d}$ '. If ' $\\mathrm{F}$ ' is the force of repulsion between the ions, the number of electrons from each ion will be $(\\mathrm{e}=$ charge on electron, $\\varepsilon_0=$ permittivity of free space)", "image": null}, "options": [{"id": "2Q8RL", "text": "$\\sqrt{\\frac{4 \\pi \\varepsilon_0 \\mathrm{~d}^2}{\\mathrm{e}^2}}$", "image": null, "isCorrect": false}, {"id": "IuDiZ", "text": "$\\sqrt{\\frac{4 \\pi \\varepsilon_0 \\mathrm{Fd}}{\\mathrm{e}^2}}$", "image": null, "isCorrect": false}, {"id": "kidZG", "text": "$\\sqrt{\\frac{4 \\pi \\varepsilon_0 \\mathrm{Fd}}{\\mathrm{e}}}$", "image": null, "isCorrect": false}, {"id": "mXvXJ", "text": "$\\sqrt{\\frac{4 \\pi \\varepsilon_0 \\mathrm{Fd}^2}{\\mathrm{e}^2}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{F}=\\frac{1}{4 \\pi \\varepsilon_0} \\cdot \\frac{\\mathrm{q}^2}{\\mathrm{~d}^2}=\\frac{1}{4 \\pi \\varepsilon_0} \\cdot \\frac{(\\mathrm{ne})^2}{\\mathrm{~d}^2}=\\frac{1}{4 \\pi \\varepsilon_0} \\cdot \\frac{\\mathrm{n}^2 \\mathrm{e}^2}{\\mathrm{~d}^2} \\\\ & \\therefore \\mathrm{n}=\\sqrt{\\frac{4 \\pi \\varepsilon_0 \\mathrm{Fd}^2}{\\mathrm{e}^2}}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260b70279619d9d8a26bb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "Two, point charges $+3 \\mu \\mathrm{C}$ and $+8 \\mu \\mathrm{C}$ repel each other with a force of $40 \\mathrm{~N}$. If a charge of $-5 \\mu \\mathrm{C}$ is added to each of them, then force between them will become", "image": null}, "options": [{"id": "ZIpvx", "text": "$-10 \\mathrm{~N}$", "image": null, "isCorrect": true}, {"id": "OiNvQ", "text": "$10 \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "vAaFf", "text": "$20 \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "YY9sB", "text": "$-20 \\mathrm{~N}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\mathrm{q}_1=3 \\mu \\mathrm{C} \\text { and } \\mathrm{q}_2=8 \\mu \\mathrm{C}\n$$\nWhen third charge $q_3=-5 \\mu \\mathrm{C}$ is added to each, then new charges on $\\mathrm{q}_1$ and $\\mathrm{q}_2$ will be\n$$\n\\mathrm{q}_1=3-5=-2 \\mu \\mathrm{C}\n$$\nand $\\mathrm{q}_2=8-5=3 \\mu \\mathrm{C}$\nNow,\nCase I: $40=\\frac{1}{4 \\pi \\varepsilon_0} \\cdot \\frac{3 \\times 8}{r^2}$\nCase II: $F=\\frac{1}{4 \\pi \\varepsilon_0} \\times \\frac{(-2 \\times 3)}{r^2}$\n$$\n\\begin{aligned}\n& \\therefore \\frac{F}{40}=\\frac{-2 \\times 3}{3 \\times 8} \\\\\n& \\Rightarrow F=-10 \\mathrm{~N}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2606e0279619d9d8a2472", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "A point charge $Q$ is placed at the center of the line joining two equal point charges $+q$ and $+q$. The value of $Q$ if the system of the charges is equilibrium, is", "image": null}, "options": [{"id": "TLtXB", "text": "$\\frac{-q}{2}$", "image": null, "isCorrect": false}, {"id": "BqSng", "text": "$-\\frac{\\mathrm{q}}{4}$", "image": null, "isCorrect": true}, {"id": "SkUWV", "text": "$\\frac{+\\mathrm{q}}{4}$", "image": null, "isCorrect": false}, {"id": "cPcpI", "text": "$\\frac{+\\mathrm{q}}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The forces on charge $Q$ due to the other two charges will be equal and opposite and hence it will be in equilibrium. Force on $+\\mathrm{q}$ due to the other two charges should also be equal and opposite. Their magnitudes will be equal if\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/EO5iK3YUZYpGv58Hu9kbnF08w1M_atNDgIngCme40pY.original.fullsize.png\"><br>\n$$\n\\begin{aligned}\n& \\frac{1}{4 \\pi \\varepsilon_0} \\cdot \\frac{\\mathrm{q}^2}{\\mathrm{r}^2}=\\frac{1}{4 \\pi \\varepsilon_0} \\cdot \\frac{\\mathrm{qQ}}{\\left(\\frac{\\mathrm{r}}{2}\\right)^2}=\\frac{1}{4 \\pi \\varepsilon_0} \\cdot \\frac{4 \\mathrm{qQ}}{\\mathrm{r}^2} \\\\\n& \\therefore \\mathrm{q}=4 \\mathrm{Q} \\text { or } \\mathrm{Q}=\\frac{\\mathrm{q}}{4}\n\\end{aligned}\n$$\n$\\mathrm{Q}$ must be negative, hence $\\mathrm{Q}=-\\frac{\\mathrm{q}}{4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2605a0279619d9d8a23cc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "When a piece of polythene is rubbed with wool, a negative charge of $4 \\times 10^{-7} \\mathrm{C}$ is developed on the polythene. The number of electrons transferred wool to polythene is $\\left[\\mathrm{e}=1.6 \\times 10^{-19} \\mathrm{C}\\right]$", "image": null}, "options": [{"id": "cHR6A", "text": "$1.5 \\times 10^{12}$", "image": null, "isCorrect": false}, {"id": "z4ilm", "text": "$3.5 \\times 10^{13}$", "image": null, "isCorrect": false}, {"id": "xoGnY", "text": "$2.5 \\times 10^{13}$", "image": null, "isCorrect": false}, {"id": "AvN9g", "text": "$2.5 \\times 10^{12}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{q}=4 \\times 10^{-7} \\\\ & \\mathrm{q}=\\mathrm{Ne} \\\\ & \\mathrm{N}=\\frac{\\mathrm{q}}{\\mathrm{e}}=\\frac{4 \\times 10^{-7}}{1.6 \\times 10^{-19}}=2.5 \\times 10^{12}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260470279619d9d8a2334", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "' $F$ ' is the force between the two identical charged particles placed at a distance ' $\\mathrm{Y}$ ' from each other. If the distance between the charges is reduced to half the previous distance, then force between them becomes", "image": null}, "options": [{"id": "GkkE0", "text": "$\\frac{F}{4}$", "image": null, "isCorrect": false}, {"id": "ktNHV", "text": "$4 \\mathrm{~F}$", "image": null, "isCorrect": true}, {"id": "VHF90", "text": "$2 \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "1rzwa", "text": "$\\frac{\\mathrm{F}}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\mathrm{F}=\\frac{1}{4 \\pi \\varepsilon_0} \\cdot \\frac{\\mathrm{q}^2}{\\mathrm{r}^2} \\\\\n& \\therefore \\frac{\\mathrm{F}_2}{\\mathrm{~F}_1}=\\left(\\frac{\\mathrm{r}_1}{\\mathrm{r}_2}\\right)^2=(2)^2=4 \\\\\n& \\therefore \\mathrm{F}_2=4 \\mathrm{~F}_1\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260120279619d9d8a2180", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}], "question": {"text": "Choose the correct relation between polarisation 'P' and electric susceptibility $^{4} \\chi_{e}{ }^{\\prime}$  of dielectric material. $(\\mathrm{E}=$ electric field $)$", "image": null}, "options": [{"id": "4bWV7", "text": "$\\mathrm{P}=\\frac{\\chi_{\\mathrm{e}}}{\\mathrm{E}^{2}}$", "image": null, "isCorrect": false}, {"id": "ITKBI", "text": "$\\mathrm{P}=\\frac{\\chi_{\\mathrm{e}}}{\\mathrm{E}}$", "image": null, "isCorrect": false}, {"id": "0CTfd", "text": "$\\mathrm{P}=\\chi_{\\mathrm{e}} \\mathrm{E}$", "image": null, "isCorrect": true}, {"id": "wvnJG", "text": "$\\mathrm{P}=\\chi_{\\mathrm{e}}^{2} \\mathrm{E}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a263270279619d9d8a3c70", "title": "Electric Field and Electric Field Lines", "totalQuestions": 37, "questions": [{"_id": "6abb88ce15a9fc0fc8c14722", "type": "singleCorrect", "question": {"text": "An electric charge of magnitude '$2e$' and mass '$2m$' is moving in an electric field 'E'. The acceleration imparted to the charge is", "image": null}, "options": [{"id": "PTjLf", "label": "A", "text": "$\\dfrac{2eE}{m}$", "isCorrect": false, "image": null}, {"id": "PEY3W", "label": "B", "text": "$\\dfrac{eE}{m}$", "isCorrect": true, "image": null}, {"id": "VKrfj", "label": "C", "text": "$\\dfrac{eE}{2m}$", "isCorrect": false, "image": null}, {"id": "Znwnl", "label": "D", "text": "$\\dfrac{me}{2E}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The force experienced by a charge in an electric field is given by $F = qE$<br><br>Substituting the given charge $q = 2e$, we get $F = 2eE$<br><br>According to Newton's second law, the acceleration is $a = \\dfrac{F}{M}$<br><br>Substituting the given mass $M = 2m$, we get $a = \\dfrac{2eE}{2m} = \\dfrac{eE}{m}$<br><br>Answer: $\\dfrac{eE}{m}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886c15a9fc0fc8c14391", "type": "singleCorrect", "question": {"text": "The electric field intensity at a point near and outside the surface of a charged conductor of any shape is $E_1$. The electric field intensity due to a uniformly charged infinite thin plane sheet having the same surface charge density is $E_2$. The relation between $E_1$ and $E_2$ is", "image": null}, "options": [{"id": "h70Yw", "label": "A", "text": "$2E_1 = E_2$", "isCorrect": false, "image": null}, {"id": "fUrQI", "label": "B", "text": "$E_1 = E_2$", "isCorrect": false, "image": null}, {"id": "3J7x1", "label": "C", "text": "$E_1 = 2E_2$", "isCorrect": true, "image": null}, {"id": "U3CmV", "label": "D", "text": "$E_1 = 4E_2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The electric field intensity at a point near and outside the surface of a charged conductor having surface charge density $\\sigma$ is given by:<br><br>$E_1 = \\dfrac{\\sigma}{\\varepsilon_0}$<br><br>The electric field intensity due to a uniformly charged infinite thin plane sheet having the same surface charge density $\\sigma$ is given by:<br><br>$E_2 = \\dfrac{\\sigma}{2\\varepsilon_0}$<br><br>Comparing the two expressions, we get:<br><br>$E_1 = 2 \\left( \\dfrac{\\sigma}{2\\varepsilon_0} \\right)$<br><br>$E_1 = 2E_2$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886c15a9fc0fc8c1438f", "type": "singleCorrect", "question": {"text": "An infinite line charge produces a field of $9 \\times 10^8$ N/C at a distance of $2$ cm. The linear charge density is<br>$\\left(\\dfrac{1}{4\\pi\\varepsilon_0} = 9 \\times 10^9 \\text{ SI unit}\\right)$", "image": null}, "options": [{"id": "3EJHT", "label": "A", "text": "$10^{-3}$ C/m", "isCorrect": true, "image": null}, {"id": "iZBqN", "label": "B", "text": "$2 \\times 10^{-3}$ C/m", "isCorrect": false, "image": null}, {"id": "7PkFD", "label": "C", "text": "$4 \\times 10^{-3}$ C/m", "isCorrect": false, "image": null}, {"id": "uLZuj", "label": "D", "text": "$10^{-2}$ C/m", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The electric field due to an infinite line charge is given by $E = \\dfrac{\\lambda}{2\\pi\\varepsilon_0 r} = \\dfrac{2k\\lambda}{r}$<br><br>Given $E = 9 \\times 10^8$ N/C, $r = 2$ cm $= 2 \\times 10^{-2}$ m, and $k = \\dfrac{1}{4\\pi\\varepsilon_0} = 9 \\times 10^9$ N m$^2$/C$^2$<br><br>Substituting the values:<br><br>$9 \\times 10^8 = \\dfrac{2 \\times 9 \\times 10^9 \\times \\lambda}{2 \\times 10^{-2}}$<br><br>$9 \\times 10^8 = 9 \\times 10^{11} \\times \\lambda$<br><br>$\\lambda = \\dfrac{9 \\times 10^8}{9 \\times 10^{11}} = 10^{-3}$ C/m<br><br>Answer: $10^{-3}$ C/m", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888d15a9fc0fc8c144c5", "type": "singleCorrect", "question": {"text": "Three charges $2q$, $-q$ and $-q$ are located at the vertices of an equilateral triangle. At the centre of the triangle", "image": null}, "options": [{"id": "BIndl", "label": "A", "text": "the field is zero but potential is not zero", "isCorrect": false, "image": null}, {"id": "ZmoEp", "label": "B", "text": "the field is not zero but potential is zero", "isCorrect": true, "image": null}, {"id": "UNLbu", "label": "C", "text": "both field and potential are zero", "isCorrect": false, "image": null}, {"id": "bQafH", "label": "D", "text": "both field and potential are not zero", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the distance from each vertex to the centre of the equilateral triangle be $r$.<br><br>The electric potential at the centre is the scalar sum of the potentials due to the individual charges:<br><br>$V = \\dfrac{1}{4\\pi\\epsilon_0} \\left( \\dfrac{2q}{r} - \\dfrac{q}{r} - \\dfrac{q}{r} \\right) = 0$<br><br>The electric field at the centre is the vector sum of the fields due to the individual charges. The field due to the charge $2q$ is directed away from it, while the fields due to the two $-q$ charges are directed towards them.<br><br>The resultant of the electric fields due to the two $-q$ charges is non-zero and points in the same direction as the field due to the $2q$ charge. Thus, the net electric field at the centre is non-zero.<br><br>Therefore, the field is not zero but the potential is zero.<br><br>Answer: the field is not zero but potential is zero", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88bd15a9fc0fc8c1468b", "type": "singleCorrect", "question": {"text": "A spherical conductor of diameter $3$ mm is kept in a uniform electric field of intensity $4 \\times 10^7$ N/C. The maximum charge on the conductor is $\\left(\\dfrac{1}{4\\pi\\epsilon_0} = 9 \\times 10^9\\,SI\\,units\\right)$", "image": null}, "options": [{"id": "aiA1F", "label": "A", "text": "$2 \\times 10^{-8}\\,C$", "isCorrect": false, "image": null}, {"id": "essvP", "label": "B", "text": "$10^{-8}\\,C$", "isCorrect": true, "image": null}, {"id": "HxyGY", "label": "C", "text": "$4 \\times 10^{-8}\\,C$", "isCorrect": false, "image": null}, {"id": "vuQwJ", "label": "D", "text": "$3 \\times 10^{-8}\\,C$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The maximum electric field on the surface of a spherical conductor is given by:<br><br>$E = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{Q}{R^2}$<br><br>Where:<br>$E = 4 \\times 10^7$ N/C<br>$R = \\dfrac{D}{2} = \\dfrac{3}{2}$ mm $= 1.5 \\times 10^{-3}$ m<br>$\\dfrac{1}{4\\pi\\epsilon_0} = 9 \\times 10^9$ N m$^2$/C$^2$<br><br>Rearranging the formula to solve for the maximum charge $Q$:<br><br>$Q = E \\times 4\\pi\\epsilon_0 R^2$<br><br>Substituting the given values:<br><br>$Q = \\dfrac{4 \\times 10^7 \\times (1.5 \\times 10^{-3})^2}{9 \\times 10^9}$<br><br>$Q = \\dfrac{4 \\times 10^7 \\times 2.25 \\times 10^{-6}}{9 \\times 10^9}$<br><br>$Q = \\dfrac{9 \\times 10^1}{9 \\times 10^9}$<br><br>$Q = 10^{-8}$ C<br><br>Answer: $10^{-8}\\,C$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3088c30a4553e1bdf6e", "type": "singleCorrect", "question": {"text": "An uniformly charged thin spherical shell of radius 'R' has uniform surface charge density '$\\sigma$'. It is made of two hemispherical identical shells held together by pressing them with force 'F' as shown. F is proportional to<br>[$\\epsilon_0$ = permittivity of free space]<br><img style=\"width: 200px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/18_april_shift_2__q32_d1.png\" />", "image": null}, "options": [{"id": "1Sty3", "label": "A", "text": "$\\dfrac{1}{\\epsilon_0}\\,\\dfrac{\\sigma^2}{R^2}$", "isCorrect": false, "image": null}, {"id": "1w7VK", "label": "B", "text": "$\\dfrac{1}{\\epsilon_0}\\,\\dfrac{\\sigma^2}{R}$", "isCorrect": false, "image": null}, {"id": "kEkAa", "label": "C", "text": "$\\dfrac{1}{\\epsilon_0}\\,\\sigma^2 R^2$", "isCorrect": true, "image": null}, {"id": "QH1hY", "label": "D", "text": "$\\dfrac{1}{\\epsilon_0}\\,\\sigma^2 R$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The electrostatic pressure $P$ on the surface of a uniformly charged thin spherical shell is given by:<br><br>$P = \\dfrac{\\sigma^2}{2\\epsilon_0}$<br><br>Consider a small area element $dA$ on the surface of one of the hemispheres. The outward electrostatic force on this element is:<br><br>$dF = P dA = \\dfrac{\\sigma^2}{2\\epsilon_0} dA$<br><br>By symmetry, the net force on the hemisphere will be directed along the axis perpendicular to its circular base. The component of the force along this axis is:<br><br>$dF_{\\perp} = dF \\cos\\theta = P dA \\cos\\theta$<br><br>where $\\theta$ is the angle between the radially outward normal and the axis of symmetry.<br><br>Integrating this over the entire surface of the hemisphere gives the total repulsive force:<br><br>$F_{rep} = \\int P dA \\cos\\theta = P \\int dA \\cos\\theta$<br><br>The term $\\int dA \\cos\\theta$ represents the projected area of the hemisphere onto the plane of its base, which is simply the area of a circle of radius $R$:<br><br>$\\int dA \\cos\\theta = \\pi R^2$<br><br>Substituting this back, we get the net repulsive force:<br><br>$F_{rep} = \\left(\\dfrac{\\sigma^2}{2\\epsilon_0}\\right) (\\pi R^2) = \\dfrac{\\pi \\sigma^2 R^2}{2\\epsilon_0}$<br><br>To hold the two hemispheres together, the external applied force $F$ must balance this electrostatic repulsion:<br><br>$F = \\dfrac{\\pi \\sigma^2 R^2}{2\\epsilon_0}$<br><br>From this expression, it is clear that the force $F$ is proportional to $\\dfrac{\\sigma^2 R^2}{\\epsilon_0}$.<br><br>Answer: $\\dfrac{1}{\\epsilon_0}\\,\\sigma^2 R^2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3228c30a4553e1be084", "type": "singleCorrect", "question": {"text": "The point charges $+q$, $-q$, $-q$, $+q$, $+Q$ and $-q$ are placed at the vertices of a regular hexagon ABCDEF as shown in the figure.<br><img style=\"width: 200px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/17_april_shift_1__q10_d1.png\" /><br>The electric field at the centre of the hexagon 'O' due to the five charges at A, B, C, D and F is thrice the electric field at centre 'O' due to charge $+Q$ at E alone. The value of Q is", "image": null}, "options": [{"id": "IxZAN", "label": "A", "text": "$\\dfrac{q}{3}$", "isCorrect": true, "image": null}, {"id": "WRhHi", "label": "B", "text": "$\\dfrac{q}{4}$", "isCorrect": false, "image": null}, {"id": "3D1dK", "label": "C", "text": "$3q$", "isCorrect": false, "image": null}, {"id": "aYkI3", "label": "D", "text": "$4q$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the distance from each vertex of the regular hexagon to its center O be $r$.<br><br>The electric field at the center O due to a point charge $q$ at a distance $r$ has a magnitude $E = \\dfrac{1}{4\\pi\\epsilon_0}\\dfrac{q}{r^2}$.<br><br>In the regular hexagon ABCDEF, the pairs of diametrically opposite vertices are (A, D), (B, E), and (C, F).<br><br>The charges at A and D are both $+q$. The electric fields produced by these two charges at the center O are equal in magnitude and opposite in direction, thus they cancel each other out.<br><br>The charges at C and F are both $-q$. The electric fields produced by these two charges at O are equal in magnitude and opposite in direction (pointing towards C and F respectively), thus they also cancel each other out.<br><br>Therefore, the net electric field at the center O due to the five charges at A, B, C, D, and F is solely the electric field produced by the charge $-q$ at B.<br><br>The magnitude of this field is $E_1 = \\dfrac{1}{4\\pi\\epsilon_0}\\dfrac{q}{r^2}$.<br><br>The electric field at O due to the charge $+Q$ at E alone has a magnitude $E_2 = \\dfrac{1}{4\\pi\\epsilon_0}\\dfrac{Q}{r^2}$.<br><br>According to the given condition, $E_1 = 3E_2$.<br><br>$\\dfrac{1}{4\\pi\\epsilon_0}\\dfrac{q}{r^2} = 3 \\left(\\dfrac{1}{4\\pi\\epsilon_0}\\dfrac{Q}{r^2}\\right)$<br><br>$q = 3Q$<br><br>$Q = \\dfrac{q}{3}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bd6bf9280d7f9932ce3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The point charges $+\\mathrm{q},-\\mathrm{q},-\\mathrm{q},+\\mathrm{q},+\\mathrm{Q}$ and -q are placed at the vertices of a regular hexagon ABCDEF as shown in figure. The electric field at the centre of hexagon ' $O$ ' due to the five charges at $A, B, C, D$ and $F$ is twice the electric field at centre ' $O$ ' due to charge $+Q$ at $E$ alone. The value of Q is\n\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/PzLp7abYLIYBIQdhikmUDozuZvxuaqRJzaPSk9odaTo.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "tYcN3", "text": "$\\frac{q}{2}$", "image": null, "isCorrect": true}, {"id": "GvAX6", "text": "q", "image": null, "isCorrect": false}, {"id": "Rud1H", "text": "$2 q$", "image": null, "isCorrect": false}, {"id": "a5mTf", "text": "$4 q$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $r$ be the distance from the centre $O$ to each vertex of the regular hexagon.<br><br>The electric field at the centre $O$ due to a charge $q_i$ at a distance $r$ has a magnitude $E_i = \\dfrac{1}{4\\pi\\epsilon_0}\\dfrac{|q_i|}{r^2}$.<br><br>In the regular hexagon, the diagonals $AD$, $BE$, and $CF$ pass through the centre $O$. We can analyze the electric field by looking at opposite pairs of vertices:<br><br>1. Charges at $A$ and $D$ are both $+q$. The electric field at $O$ due to $A$ points towards $D$, and the electric field due to $D$ points towards $A$. Since they have the same magnitude, they cancel each other out: $\\vec{E}_A + \\vec{E}_D = 0$.<br><br>2. Charges at $C$ and $F$ are both $-q$. The electric field at $O$ due to $C$ points towards $C$, and the electric field due to $F$ points towards $F$. Since they have the same magnitude, they also cancel each other out: $\\vec{E}_C + \\vec{E}_F = 0$.<br><br>Thus, the net electric field at $O$ due to the five charges at $A, B, C, D,$ and $F$ is simply the electric field due to the charge at $B$.<br><br>The charge at $B$ is $-q$. The electric field $\\vec{E}_B$ at $O$ points towards $B$ and has a magnitude:<br>$E_{5} = E_B = \\dfrac{1}{4\\pi\\epsilon_0}\\dfrac{q}{r^2}$<br><br>The charge at $E$ is $+Q$. The electric field $\\vec{E}_E$ at $O$ due to this charge alone points away from $E$ (which is also towards $B$) and has a magnitude:<br>$E_E = \\dfrac{1}{4\\pi\\epsilon_0}\\dfrac{Q}{r^2}$<br><br>According to the given condition, the electric field due to the five charges is twice the electric field due to the charge at $E$ alone:<br>$E_{5} = 2E_E$<br><br>Substituting the magnitudes:<br>$\\dfrac{1}{4\\pi\\epsilon_0}\\dfrac{q}{r^2} = 2 \\left( \\dfrac{1}{4\\pi\\epsilon_0}\\dfrac{Q}{r^2} \\right)$<br><br>$q = 2Q$<br><br>$Q = \\dfrac{q}{2}$<br><br>Answer: $\\frac{q}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bc8bf9280d7f9932c56", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Out of the following statements which is NOT the characteristics of electric lines of force?", "image": null}, "options": [{"id": "ATj5o", "text": "Electric lines of force originate from a positively charged object and end on negatively charged object.", "image": null, "isCorrect": false}, {"id": "NmqCM", "text": "The electric lines of force do not intersect each other.", "image": null, "isCorrect": false}, {"id": "hpWYZ", "text": "The electric lines of force pass through the conductor.", "image": null, "isCorrect": true}, {"id": "YZTeV", "text": "The electric lines of force are crowded in a region where electric intensity is large.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Electric lines of force originate from a positive charge and terminate on a negative charge.<br><br>Two electric lines of force never intersect each other because if they did, there would be two directions of the electric field at the point of intersection, which is impossible.<br><br>The density of electric lines of force is directly proportional to the magnitude of the electric field intensity. Hence, they are crowded in a region where the electric intensity is large.<br><br>Electric lines of force do not pass through a conductor because the electric field inside a conductor in electrostatic equilibrium is zero. Therefore, the statement that electric lines of force pass through the conductor is incorrect.<br><br>Answer: The electric lines of force pass through the conductor.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b22bf9280d7f993268d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A conducting sphere of radius ' $R$ ' is given a charge ' $Q$ ' uniformly. The electric field and the electric potential at the centre of the sphere are respectively [ $\\epsilon_0=$ permittivity of free space]", "image": null}, "options": [{"id": "5xJAU", "text": "zero and $\\frac{Q}{4 \\pi \\epsilon_0 R}$", "image": null, "isCorrect": true}, {"id": "D0qP0", "text": "$\\frac{Q}{4 \\pi \\epsilon_0 R^2}$ and zero", "image": null, "isCorrect": false}, {"id": "9GigT", "text": "$\\frac{Q}{4 \\pi \\epsilon_0 R}$ and $\\frac{Q}{4 \\pi \\epsilon_0 R^2}$", "image": null, "isCorrect": false}, {"id": "OEsTy", "text": "zero and zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a conducting sphere, the given charge $Q$ resides entirely on its outer surface.<br><br>The electric field inside a conductor is zero everywhere. Therefore, the electric field at the centre of the sphere is zero.<br><br>The electric potential inside a conducting sphere is constant and is equal to the potential at its surface. Therefore, the electric potential at the centre is $V = \\dfrac{Q}{4 \\pi \\epsilon_0 R}$.<br><br>Answer: zero and $\\frac{Q}{4 \\pi \\epsilon_0 R}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b0cbf9280d7f99325f5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A charged particle of mass ' m ' and charge ' q ' is at rest. It is accelerated in a uniform electric field of intensity ' $E$ ' for time ' $t$ '. The kinetic energy of the particles after time $t$ is", "image": null}, "options": [{"id": "jLUE5", "text": "$\\frac{E q m}{2 t}$", "image": null, "isCorrect": false}, {"id": "iMBQy", "text": "$\\frac{E^2 q^2 t^2}{2 m}$", "image": null, "isCorrect": true}, {"id": "XMtMm", "text": "$\\frac{2 \\mathrm{E}^2 \\mathrm{t}^2}{\\mathrm{mq}^2}$", "image": null, "isCorrect": false}, {"id": "LL0sw", "text": "$\\frac{\\mathrm{Eqt}}{\\mathrm{m}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Force acting on the charged particle is $F = qE$<br><br>Acceleration of the particle is $a = \\dfrac{F}{m} = \\dfrac{qE}{m}$<br><br>Since the particle starts from rest, its velocity after time $t$ is $v = u + at = 0 + \\left(\\dfrac{qE}{m}\\right)t = \\dfrac{qEt}{m}$<br><br>The kinetic energy of the particle is $K = \\dfrac{1}{2}mv^2$<br><br>$K = \\dfrac{1}{2}m \\left(\\dfrac{qEt}{m}\\right)^2 = \\dfrac{E^2 q^2 t^2}{2m}$<br><br>Answer: $\\frac{E^2 q^2 t^2}{2 m}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792142b0aee93fa0796de89", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "Two point charges $+8 q$ and $-2 q$ are located at $x=0$ and $x=\\mathrm{L}$ respectively. The location of a point on the $x$-axis from the origin, at which the net electric field due to these two point charges is zero is", "image": null}, "options": [{"id": "cnwLA", "text": "$\\frac{\\mathrm{L}}{4}$", "image": null, "isCorrect": false}, {"id": "dJPv4", "text": "4 L", "image": null, "isCorrect": false}, {"id": "ps38H", "text": "8 L", "image": null, "isCorrect": false}, {"id": "IB9Wj", "text": "2 L", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let the point where the net electric field is zero be at a distance $x$ from the origin on the $x$-axis.<br><br>Since the charges are of opposite signs, the neutral point must lie outside the region between the charges and closer to the charge with the smaller magnitude ($-2q$). Thus, the point lies at $x > \\mathrm{L}$.<br><br>Equating the magnitudes of the electric fields due to both charges at this point:<br><br>$\\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{8q}{x^2} = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{2q}{(x-\\mathrm{L})^2}$<br><br>$\\dfrac{4}{x^2} = \\dfrac{1}{(x-\\mathrm{L})^2}$<br><br>Taking the square root on both sides:<br><br>$\\dfrac{2}{x} = \\dfrac{1}{x-\\mathrm{L}}$<br><br>$2(x - \\mathrm{L}) = x$<br><br>$2x - 2\\mathrm{L} = x$<br><br>$x = 2\\mathrm{L}$<br><br>Answer: 2 L", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213f50aee93fa0796dcda", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "The point charges $+q,-q,-q,+q,+Q$ and $-q$ are placed at the vertices of a regular hexagon ABCDEF as shown in figure. The electric field at the centre of hexagon ' $O$ ' due to the five charges at $\\mathrm{A}, \\mathrm{B}, \\mathrm{C}, \\mathrm{D}$ and F is thrice the electric field at centre ' O ' due to charge +Q at E alone. The value of Q is\r\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/qTff8_sbjVMaJSsAeD49XqrCErEA68zcev7ZvCLYjzw.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "BF7QH", "text": "$\\frac{+q}{3}$", "image": null, "isCorrect": true}, {"id": "zx6sU", "text": "$\\frac{\\mathrm{qq}}{5}$", "image": null, "isCorrect": false}, {"id": "2NvMm", "text": "$\\frac{+q}{6}$", "image": null, "isCorrect": false}, {"id": "40wy0", "text": "$+6 q$.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the side length of the regular hexagon be $r$. The distance from each vertex to the centre $O$ is $r$.<br><br>The electric field at the centre $O$ due to a point charge $q$ at a distance $r$ has a magnitude $E = \\dfrac{1}{4\\pi\\epsilon_0}\\dfrac{q}{r^2}$.<br><br>In the given regular hexagon, the diametrically opposite pairs of vertices are $(A, D)$, $(C, F)$, and $(B, E)$.<br><br>1. For the pair $(A, D)$:<br>The charge at $A$ is $+q$ and the charge at $D$ is $+q$. Since both charges are equal and of the same sign, their electric fields at the centre $O$ are equal in magnitude and opposite in direction. Thus, they cancel each other out: $\\vec{E}_A + \\vec{E}_D = 0$.<br><br>2. For the pair $(C, F)$:<br>The charge at $C$ is $-q$ and the charge at $F$ is $-q$. Similarly, their electric fields at the centre $O$ are equal in magnitude and opposite in direction, so they also cancel each other out: $\\vec{E}_C + \\vec{E}_F = 0$.<br><br>3. Total electric field due to the five charges ($A, B, C, D, F$):<br>The net electric field at $O$ due to these five charges is simply the electric field due to the charge at $B$ alone, because the contributions from $A, D, C,$ and $F$ sum to zero.<br>$\\vec{E}_5 = \\vec{E}_A + \\vec{E}_B + \\vec{E}_C + \\vec{E}_D + \\vec{E}_F = \\vec{E}_B$<br>Since the charge at $B$ is $-q$, the electric field $\\vec{E}_B$ is directed towards $B$ with magnitude $E_5 = \\dfrac{1}{4\\pi\\epsilon_0}\\dfrac{q}{r^2}$.<br><br>4. Electric field due to charge at $E$ alone:<br>The charge at $E$ is $+Q$. Its electric field $\\vec{E}_E$ at $O$ is directed away from $E$. Since $E$ is diametrically opposite to $B$, the direction away from $E$ is towards $B$.<br>The magnitude is $E_E = \\dfrac{1}{4\\pi\\epsilon_0}\\dfrac{Q}{r^2}$.<br><br>According to the given condition, the electric field due to the five charges is thrice the electric field due to the charge at $E$ alone:<br>$E_5 = 3E_E$<br><br>Substituting the magnitudes:<br>$\\dfrac{1}{4\\pi\\epsilon_0}\\dfrac{q}{r^2} = 3 \\left( \\dfrac{1}{4\\pi\\epsilon_0}\\dfrac{Q}{r^2} \\right)$<br><br>$q = 3Q \\implies Q = \\dfrac{+q}{3}$<br><br>Answer: $\\frac{+q}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213f30aee93fa0796dcd1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "A sphere ' $A$ ' of radius ' $R$ ' has a charge ' $Q$ ' on it. The field at point $B$ outside the sphere is ' $E$ '. Now another sphere of radius ' $2 R$ ' having a charge ' $-2 Q$ ' is placed at $B$. The total field at the point midway between A and B due to both the spheres is (Assume the distance between A and B is large compared to their radii)", "image": null}, "options": [{"id": "Yy2hK", "text": "E", "image": null, "isCorrect": false}, {"id": "uZ09T", "text": "3 E", "image": null, "isCorrect": false}, {"id": "OJLWg", "text": "12 E", "image": null, "isCorrect": true}, {"id": "xTLJl", "text": "15 E", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the distance between the center of sphere A and point B be $d$.<br><br>The electric field at point B due to sphere A is given by:<br><br>$E = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{Q}{d^2}$<br><br>Let M be the point midway between A and B. The distance of M from both A and B is $\\dfrac{d}{2}$.<br><br>The electric field at M due to sphere A (charge $Q$) is:<br><br>$E_A = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{Q}{\\left(\\dfrac{d}{2}\\right)^2} = 4 \\left( \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{Q}{d^2} \\right) = 4E$<br><br>Since $Q$ is positive, this field is directed away from A, i.e., towards B.<br><br>The electric field at M due to the sphere at B (charge $-2Q$) is:<br><br>$E_B = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{|-2Q|}{\\left(\\dfrac{d}{2}\\right)^2} = 8 \\left( \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{Q}{d^2} \\right) = 8E$<br><br>Since the charge at B is negative, this field is directed towards B.<br><br>As both fields are in the same direction, the total electric field at the midpoint is the sum of their magnitudes:<br><br>$E_{total} = E_A + E_B = 4E + 8E = 12E$<br><br>Answer: 12 E", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213460aee93fa0796d782", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Three charges $2 \\mathrm{q},-\\mathrm{q}$ and -q are located at the vertices of an equilateral triangle. At the centre of the triangle", "image": null}, "options": [{"id": "mO5AV", "text": "the field is zero but potential is non-zero.", "image": null, "isCorrect": false}, {"id": "qNoI4", "text": "the field is non-zero but potential is zero.", "image": null, "isCorrect": true}, {"id": "0tUL4", "text": "both field and potential are zero.", "image": null, "isCorrect": false}, {"id": "8ipZS", "text": "both field and potential are non-zero.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the distance from the centroid to each vertex of the equilateral triangle be $r$.<br><br>The electric potential at the centre is the scalar sum of the potentials due to the individual charges:<br><br>$V = \\dfrac{1}{4\\pi\\epsilon_0} \\left( \\dfrac{2q}{r} + \\dfrac{-q}{r} + \\dfrac{-q}{r} \\right) = 0$<br><br>The electric field at the centre is the vector sum of the fields due to the three charges. The field due to the charge $2q$ is directed away from it, while the fields due to the two $-q$ charges are directed towards them.<br><br>The resultant of the fields due to the two $-q$ charges (each of magnitude $E_1 = \\dfrac{1}{4\\pi\\epsilon_0}\\dfrac{q}{r^2}$) at an angle of $120^{\\circ}$ is $E_{1}$ directed away from the $2q$ charge.<br><br>The field due to the $2q$ charge is $E_2 = \\dfrac{1}{4\\pi\\epsilon_0}\\dfrac{2q}{r^2}$, also directed away from the $2q$ charge.<br><br>Since these fields are in the same direction, they add up to give a net non-zero electric field.<br><br>Thus, the field is non-zero but the potential is zero.<br><br>Answer: the field is non-zero but potential is zero.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213340aee93fa0796d6f3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "Which of the following statement is correct?", "image": null}, "options": [{"id": "AZzxg", "text": "Electric lines of force originate from a -vely charged object and terminate on a +vely charged object.", "image": null, "isCorrect": false}, {"id": "A4e1a", "text": "The electric line of force do not pass through an insulator but can pass through a conductor.", "image": null, "isCorrect": false}, {"id": "5YE3E", "text": "The electric line of force do not intersect each other.", "image": null, "isCorrect": true}, {"id": "DdlwS", "text": "Electric intensity is small in' a region where the lines of force are crowded.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Electric lines of force originate from a positively charged object and terminate on a negatively charged object.<br><br>Electric lines of force can pass through an insulator but do not pass through a conductor under electrostatic conditions.<br><br>Electric lines of force never intersect each other because if they did, there would be two directions of the electric field at the point of intersection, which is not possible.<br><br>Electric intensity is large in a region where the lines of force are crowded.<br><br>Answer: The electric line of force do not intersect each other.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262770279619d9d8a34c1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "A charge $17.7 \\times 10^{-4} \\mathrm{C}$ is distributed uniformly over a large sheet of area $200 \\mathrm{~m}^2$. The electric field intensity at a distance $20 \\mathrm{~cm}$ from it in air will be $\\left[\\varepsilon_0=8.85 \\times 10^{-12} \\mathrm{C}^2 / \\mathrm{Nm}^2\\right]$", "image": null}, "options": [{"id": "M7CLU", "text": "$5 \\times 10^5 \\mathrm{~N} / \\mathrm{C}$", "image": null, "isCorrect": true}, {"id": "6HCOy", "text": "$6 \\times 10^5 \\mathrm{~N} / \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "H6624", "text": "$7 \\times 10^5 \\mathrm{~N} / \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "jSW41", "text": "$8 \\times 10^5 \\mathrm{~N} / \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The surface charge density is given by, $\\sigma=\\frac{\\mathrm{q}}{\\mathrm{A}}=\\frac{17.7 \\times 10^{-4}}{200}=8.85 \\times 10^{-6} \\mathrm{C}_{\\mathrm{m}} \\mathrm{m}^2$ The electric field intensity at a distance of $20 \\mathrm{~cm}$ in air is,\n$\\mathrm{E}=\\frac{\\sigma}{2 \\varepsilon_0}=\\frac{8.85 \\times 10^{-6}}{2 \\times 8.85 \\times 10^{-12}}=5 \\times 10^5 \\mathrm{~N} / \\mathrm{C}$\nHence, option (A).", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262670279619d9d8a3443", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "A uniformly charged semicircular arc of radius ' $r$ ' has linear charge density ' $\\lambda$ '. The electric field at its centre is $\\left(\\varepsilon_0=\\right.$ permittivity of free space)", "image": null}, "options": [{"id": "mYMQw", "text": "$\\frac{\\lambda}{4 \\varepsilon_0}$", "image": null, "isCorrect": false}, {"id": "A1K7m", "text": "$\\frac{2 \\varepsilon_0}{\\lambda}$", "image": null, "isCorrect": false}, {"id": "tH0Ie", "text": "$\\frac{\\lambda}{4 \\varepsilon_0 r}$", "image": null, "isCorrect": true}, {"id": "UIfcd", "text": "$\\frac{2 \\pi \\varepsilon_0}{\\lambda}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n\\lambda & =\\frac{\\mathrm{q}}{l} \\\\\n\\therefore \\quad \\mathrm{q} & =\\lambda \\times l=\\lambda \\times \\pi \\mathrm{r}\n\\end{aligned}\n$$\n$\\therefore \\quad$ The electric field at its centre is,\n$$\n\\begin{aligned}\n& \\mathrm{E}=\\frac{\\mathrm{q}}{4 \\pi \\varepsilon_0 \\mathrm{r}^2}=\\frac{\\lambda \\pi \\mathrm{r}}{4 \\pi \\varepsilon_0 \\mathrm{r}^2} \\\\\n\\therefore \\quad & \\mathrm{E}=\\frac{\\lambda}{4 \\varepsilon_0 \\mathrm{r}}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262660279619d9d8a343a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "The electric field intensity on the surface of a solid charged sphere of radius ' $r$ ' and volume charge density ' $\\rho$ ' is ( $\\varepsilon_0=$ permittivity of free space $)$", "image": null}, "options": [{"id": "LAPa2", "text": "$\\frac{\\rho r}{3 \\varepsilon_0}$", "image": null, "isCorrect": true}, {"id": "73ZMr", "text": "$\\frac{\\rho}{4 \\pi \\varepsilon_0 r}$", "image": null, "isCorrect": false}, {"id": "73CXQ", "text": "zero", "image": null, "isCorrect": false}, {"id": "5dYvo", "text": "$\\frac{5 \\rho \\mathrm{r}}{6 \\varepsilon_0}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Gauss' theorem,\n$$\n\\phi=\\mathrm{E} \\cdot \\mathrm{A}=\\frac{\\mathrm{q}_{\\mathrm{enc}}}{\\varepsilon_0}\n$$\n\nBut, $\\mathrm{q}_{\\text {enc }}=\\rho \\times$ volume\n$$\n\\therefore \\quad \\mathrm{q}_{\\mathrm{enc}}=\\rho\\left(\\frac{4}{3} \\pi \\mathrm{r}^3\\right)\n$$\n\nAnd area is $A=4 \\pi r^2$\n$$\n\\begin{aligned}\n& \\therefore \\quad \\mathrm{E}\\left(4 \\pi \\mathrm{r}^2\\right)=\\frac{\\rho\\left(\\frac{4}{3} \\pi \\mathrm{r}^3\\right)}{\\varepsilon_0} \\\\\n& \\therefore \\quad \\mathrm{E}=\\frac{\\rho \\mathrm{r}}{3 \\varepsilon_0}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262430279619d9d8a3321", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "If the magnitude of intensity of electric field at a distance ' $\\mathrm{r}_1$ ' on an axial line and at a distance ' $r_2$ ' on an equatorial line due to a given short dipole are equal, then $r_1: r_2$, is", "image": null}, "options": [{"id": "Ev9KX", "text": "$\\sqrt[3]{2}: 1$", "image": null, "isCorrect": true}, {"id": "VprC0", "text": "$\\sqrt{2}: 1$", "image": null, "isCorrect": false}, {"id": "uC0CZ", "text": "$1: 2$", "image": null, "isCorrect": false}, {"id": "ftddh", "text": "$1: \\sqrt[3]{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & E_{\\text {axial }}=E_{\\text {equatorial }} \\Rightarrow k \\frac{2 p}{r_1^3}=\\frac{k p}{r_2^3} \\\\ & \\Rightarrow \\frac{r_1}{r_2}=\\frac{2^{1 / 3}}{1}=\\sqrt[3]{2}: 1\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262410279619d9d8a3310", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "Which of the following statements is 'WRONG' for the conductors?", "image": null}, "options": [{"id": "DnHu9", "text": "In static situation, the interior of conductor can have no charge.", "image": null, "isCorrect": false}, {"id": "8ix4M", "text": "The net electrostatic field is zero in the interior of a conductor.", "image": null, "isCorrect": false}, {"id": "XGfju", "text": "The electrostatic field just outside the surface of charged conductor must be tangential to the surface at any point", "image": null, "isCorrect": true}, {"id": "r4Ska", "text": "The electrostatic potential is constant within and on the surface of a conductor.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The electric field just outside the surface of the conductor is perpendicular to the surface which is a property of conductors in electrostatic equilibrium.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261f50279619d9d8a30ab", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "Two positively charged identical spheres separated by a distance 'd' exert some force (F) on each other when they are kept in air. If both the spheres are immersed in a liquid of dielectric constant 5 , the force experienced by each is (All other parameters are unchanged.)", "image": null}, "options": [{"id": "NkN87", "text": "$5 \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "Bv6gY", "text": "$\\frac{F}{3}$", "image": null, "isCorrect": false}, {"id": "9mtzA", "text": "$\\frac{F}{4}$", "image": null, "isCorrect": false}, {"id": "gN2QW", "text": "$\\frac{F}{5}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The ratio of force when the medium is changed will be:\n$$\n\\frac{\\mathrm{F}_1}{\\mathrm{~F}_2}=\\frac{1}{\\mathrm{k}}\n$$\n\nHere, $\\mathrm{k}=5$,\nTherefore, the force experience by each will be $\\frac{F}{5}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261ad0279619d9d8a2e76", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "A solid metallic sphere has a charge $+3 Q$. Concentric with this sphere is a conducting spherical shell having charge $-\\mathrm{Q}$. The radius of the sphere is ' $A$ ' and that of the spherical shell is ' $\\mathrm{B}$ '. $(\\mathrm{B}>\\mathrm{A})$. The electric field at a distance ' $R$ ' ( $A < R < B)$ from the centre is ( $\\varepsilon_0=$ permittivity of vacuum)", "image": null}, "options": [{"id": "Okq05", "text": "$\\frac{\\mathrm{Q}}{2 \\pi \\varepsilon_0 \\mathrm{R}}$", "image": null, "isCorrect": false}, {"id": "ES8nb", "text": "$\\frac{\\mathrm{3Q}}{2 \\pi \\varepsilon_0 \\mathrm{R}}$", "image": null, "isCorrect": false}, {"id": "fTlax", "text": "$\\frac{\\mathrm{3Q}}{4 \\pi \\varepsilon_0 \\mathrm{R^2}}$", "image": null, "isCorrect": true}, {"id": "1p5Md", "text": "$\\frac{\\mathrm{4Q}}{2 \\pi \\varepsilon_0 \\mathrm{R^2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\therefore \\quad & \\text { Using } \\mathrm{E}=\\frac{1}{4 \\pi \\varepsilon_0} \\frac{\\mathrm{q}}{\\mathrm{r}^2}, \\text { we get } \\\\ & \\mathrm{E}=\\frac{1}{4 \\pi \\varepsilon_0} \\frac{(3 \\mathrm{Q})}{\\mathrm{R}^2}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261610279619d9d8a2c19", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "Two parallel plates separated by ' $\\mathrm{d}$ ' $\\mathrm{mm}$ are kept at potential difference of ' $V$ ' volt. A particle of mass ' $m$ ' and charge ' $q$ ' enters in it with some velocity. The acceleration of the particle will be", "image": null}, "options": [{"id": "duRnH", "text": "$\\frac{\\mathrm{q}}{\\mathrm{dm} \\mathrm{V}}$", "image": null, "isCorrect": false}, {"id": "jAVOG", "text": "$\\frac{\\mathrm{qm}}{\\mathrm{Vd}}$", "image": null, "isCorrect": false}, {"
