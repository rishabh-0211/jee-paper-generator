t": true, "image": null}, {"id": "Oue4e", "label": "D", "text": "$E_1 > E_2 > E_3 > E_4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The relation between electric field $E$ and electric potential $V$ is given by $E = -\\dfrac{dV}{dx}$.<br><br>The magnitude of the electric field is equal to the magnitude of the slope of the $V-x$ graph.<br><br>In regions 1 and 3, the potential $V$ is constant. Therefore, the slope is zero, which means $E_1 = 0$ and $E_3 = 0$. Thus, $E_1 = E_3$.<br><br>In region 2, the magnitude of the electric field is $E_2 = \\left| \\dfrac{\\Delta V}{\\Delta x} \\right| = \\dfrac{V_C - V_B}{x_C - x_B}$.<br><br>In region 4, the magnitude of the electric field is $E_4 = \\left| \\dfrac{\\Delta V}{\\Delta x} \\right| = \\dfrac{V_D - V_E}{x_E - x_D} = \\dfrac{V_C - 0}{x_E - x_D}$.<br><br>From the given graph, the horizontal widths of regions 2 and 4 are equal, i.e., $x_C - x_B = x_E - x_D$.<br><br>Since $V_B > 0$, the change in potential in region 4 ($V_C$) is greater than the change in potential in region 2 ($V_C - V_B$).<br><br>Therefore, the slope in region 4 is steeper than in region 2, which implies $E_4 > E_2$.<br><br>Combining these observations, we get $E_1 = E_3$ and $E_2 < E_4$.<br><br>Answer: $E_1 = E_3$ and $E_2 < E_4$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be7bf9280d7f9932d79", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Two conducting spheres of radii ' $r_1$ ' and ' $r_2$ ' are equally charged. The ratio of their potentials is (potential of $r_1$ to potential $r_2$ )", "image": null}, "options": [{"id": "KKKbc", "text": "$\\frac{r_2}{r_1}$", "image": null, "isCorrect": true}, {"id": "yXCpv", "text": "$\\frac{r_1^2}{r_2^2}$", "image": null, "isCorrect": false}, {"id": "rMzK4", "text": "$\\frac{r_2^2}{r_1^2}$", "image": null, "isCorrect": false}, {"id": "YXwOe", "text": "$\\frac{r_1}{r_2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the charge on both the conducting spheres be $q$.<br><br>The electric potential of a conducting sphere of radius $r$ having charge $q$ is given by $V = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q}{r}$.<br><br>For the first sphere of radius $r_1$, the potential is $V_1 = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q}{r_1}$.<br><br>For the second sphere of radius $r_2$, the potential is $V_2 = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q}{r_2}$.<br><br>Taking the ratio of their potentials, we get:<br><br>$\\dfrac{V_1}{V_2} = \\dfrac{\\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q}{r_1}}{\\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q}{r_2}} = \\dfrac{r_2}{r_1}$<br><br>Answer: $\\frac{r_2}{r_1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bc9bf9280d7f9932c60", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Charges of $2 \\mu \\mathrm{C}$ and $-3 \\mu \\mathrm{C}$ are placed at two points $A$ and $B$ separated by distance of 1 m . The distance of the point from $A$ where net potential is zero is", "image": null}, "options": [{"id": "1Ctg2", "text": "0.667 m", "image": null, "isCorrect": false}, {"id": "Vkpii", "text": "0.5 m", "image": null, "isCorrect": false}, {"id": "vloPc", "text": "0.4 m", "image": null, "isCorrect": true}, {"id": "Iwhy6", "text": "0.6 m", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the point where the net potential is zero be at a distance $x$ from $A$ between $A$ and $B$.<br><br>The distance of this point from $B$ will be $1 - x$.<br><br>The net potential at this point is zero, so $V_A + V_B = 0$.<br><br>$\\dfrac{1}{4\\pi\\epsilon_0} \\left( \\dfrac{q_A}{x} + \\dfrac{q_B}{1-x} \\right) = 0$<br><br>$\\dfrac{2 \\times 10^{-6}}{x} - \\dfrac{3 \\times 10^{-6}}{1-x} = 0$<br><br>$\\dfrac{2}{x} = \\dfrac{3}{1-x}$<br><br>$2(1-x) = 3x$<br><br>$2 - 2x = 3x$<br><br>$5x = 2$<br><br>$x = 0.4 \\text{ m}$<br><br>Answer: 0.4 m", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bb6bf9280d7f9932bc6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Assuming the drops to be spherical, 27 identical drops of mercury are charged simultaneously to the same potential of 20 volt . If all the charged drops are made to combine to form one big drop, then potential of big drop will be", "image": null}, "options": [{"id": "ja1IE", "text": "90 V", "image": null, "isCorrect": false}, {"id": "BuqLo", "text": "180 V", "image": null, "isCorrect": true}, {"id": "N3yCy", "text": "270 V", "image": null, "isCorrect": false}, {"id": "FMEvM", "text": "360 V", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $r$ be the radius and $q$ be the charge of each small drop.<br><br>The potential of each small drop is $V = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q}{r} = 20$ V.<br><br>When $27$ drops combine to form a big drop of radius $R$, the total volume remains conserved.<br><br>$\\dfrac{4}{3}\\pi R^3 = 27 \\times \\dfrac{4}{3}\\pi r^3$<br><br>$R = 3r$<br><br>The total charge on the big drop is $Q = 27q$.<br><br>The potential of the big drop is $V' = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{Q}{R}$.<br><br>Substituting the values of $Q$ and $R$:<br><br>$V' = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{27q}{3r} = 9 \\left( \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q}{r} \\right) = 9V$<br><br>$V' = 9 \\times 20 = 180$ V.<br><br>Answer: 180 V", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba7bf9280d7f9932b4a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "'n' identical small spherical drops of water, each of radius 'r' and charged to the same potential ' $v$ ' are combined to form a big drop. The potential of a big drop is", "image": null}, "options": [{"id": "C35qb", "text": "nv", "image": null, "isCorrect": false}, {"id": "vvbzW", "text": "$\\mathrm{n} \\sqrt{\\mathrm{v}}$", "image": null, "isCorrect": false}, {"id": "dLbVN", "text": "$\\mathrm{n}^{1 / 3}\\mathrm{~v}$", "image": null, "isCorrect": false}, {"id": "ggeve", "text": "$\\mathrm{n}^{2 / 3}\\mathrm{~v}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let the radius of each small drop be $r$ and its charge be $q$.<br><br>The potential of each small drop is $v = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q}{r}$.<br><br>When $n$ such drops combine to form a big drop, the total volume remains conserved. Let the radius of the big drop be $R$.<br><br>$\\dfrac{4}{3}\\pi R^3 = n \\times \\dfrac{4}{3}\\pi r^3$<br><br>$R = n^{1/3} r$<br><br>The total charge on the big drop is $Q = nq$.<br><br>The potential of the big drop is $V = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{Q}{R}$.<br><br>Substituting the values of $Q$ and $R$:<br><br>$V = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{nq}{n^{1/3} r} = n^{2/3} \\left( \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q}{r} \\right) = n^{2/3} v$<br><br>Answer: $\\mathrm{n}^{2 / 3}\\mathrm{~v}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba5bf9280d7f9932b35", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Three charges Q, (-2q) and (-2q) are placed at the vertices of an isosceles right angled triangle as shown in figure. The net electrostatic potential energy is zero if Q is equal to\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/YjSA041Tsc69ZTM-0uJSFA1OpbxN5QEv8XIbcqjcykM.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "8JtBh", "text": "$\\sqrt{2} \\mathrm{q}$", "image": null, "isCorrect": false}, {"id": "WyZqM", "text": "$\\frac{q}{2}$", "image": null, "isCorrect": false}, {"id": "pRfFU", "text": "$\\frac{\\mathrm{q}}{\\sqrt{2}}$", "image": null, "isCorrect": true}, {"id": "aFmOj", "text": "$\\frac{q}{2 \\sqrt{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The total electrostatic potential energy $U$ of the system of three charges is the sum of the potential energies of all pairs of charges.<br><br>From the given figure, the charges are $Q$, $-2q$, and $-2q$. The distance between $Q$ and each $-2q$ charge is $l$. The distance between the two $-2q$ charges is the hypotenuse of the right-angled triangle, which is $\\sqrt{l^2 + l^2} = \\sqrt{2}l$.<br><br>The net electrostatic potential energy is given by:<br>$U = \\dfrac{1}{4\\pi\\epsilon_0} \\left[ \\dfrac{Q(-2q)}{l} + \\dfrac{Q(-2q)}{l} + \\dfrac{(-2q)(-2q)}{\\sqrt{2}l} \\right]$<br><br>Given that the net electrostatic potential energy is zero ($U = 0$):<br>$\\dfrac{1}{4\\pi\\epsilon_0 l} \\left[ -2qQ - 2qQ + \\dfrac{4q^2}{\\sqrt{2}} \\right] = 0$<br><br>$-4qQ + \\dfrac{4q^2}{\\sqrt{2}} = 0$<br><br>$-4qQ + 2\\sqrt{2}q^2 = 0$<br><br>$4qQ = 2\\sqrt{2}q^2$<br><br>$Q = \\dfrac{2\\sqrt{2}q^2}{4q}$<br><br>$Q = \\dfrac{q}{\\sqrt{2}}$<br><br>Answer: $\\frac{\\mathrm{q}}{\\sqrt{2}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b95bf9280d7f9932a96", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Two point charges $+10 \\mu \\mathrm{C}$ and $4 \\mu \\mathrm{C}$ are placed 10 cm apart in air. The work required to be done to bring them 2 cm closer is\n$\\left(\\frac{1}{4 \\pi \\epsilon_0}=9 \\times 10^9 \\text { SI units }\\right)$", "image": null}, "options": [{"id": "UVhCK", "text": "$0.65 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "9Bd0z", "text": "$0.9 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "vw5iC", "text": "$1.2 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "vAxkM", "text": "$2.3 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The initial potential energy of the system is given by:<br><br>$U_1 = \\dfrac{1}{4 \\pi \\epsilon_0} \\dfrac{q_1 q_2}{r_1}$<br><br>The final potential energy of the system when the charges are brought 2 cm closer is:<br><br>$U_2 = \\dfrac{1}{4 \\pi \\epsilon_0} \\dfrac{q_1 q_2}{r_2}$<br><br>The work done to bring the charges closer is equal to the change in potential energy:<br><br>$W = U_2 - U_1 = \\dfrac{q_1 q_2}{4 \\pi \\epsilon_0} \\left( \\dfrac{1}{r_2} - \\dfrac{1}{r_1} \\right)$<br><br>Given values:<br>$q_1 = 10 \\mu\\text{C} = 10 \\times 10^{-6} \\text{ C}$<br>$q_2 = 4 \\mu\\text{C} = 4 \\times 10^{-6} \\text{ C}$<br>$r_1 = 10 \\text{ cm} = 0.1 \\text{ m}$<br>$r_2 = 10 \\text{ cm} - 2 \\text{ cm} = 8 \\text{ cm} = 0.08 \\text{ m}$<br>$\\dfrac{1}{4 \\pi \\epsilon_0} = 9 \\times 10^9 \\text{ N m}^2/\\text{C}^2$<br><br>Substituting these values into the work equation:<br><br>$W = 9 \\times 10^9 \\times 10 \\times 10^{-6} \\times 4 \\times 10^{-6} \\left( \\dfrac{1}{0.08} - \\dfrac{1}{0.1} \\right)$<br><br>$W = 360 \\times 10^{-3} \\times (12.5 - 10)$<br><br>$W = 0.36 \\times 2.5 = 0.9 \\text{ J}$<br><br>Answer: $0.9 \\mathrm{~J}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b84bf9280d7f99329f4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A regular hexagon of side 6 cm has a charge of $2 \\mu \\mathrm{C}$ at each of its vertices, what is the potential at the centre of the hexagon?\n$\\left[\\frac{1}{4 \\pi \\epsilon_0}=9 \\times 10^9 \\text { SI unit }\\right]$", "image": null}, "options": [{"id": "1rMft", "text": "$1.5 \\times 10^5 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "UKKfG", "text": "$1.8 \\times 10^6 \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "m4t20", "text": "$2.4 \\times 10^5 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "DB2hV", "text": "$3.2 \\times 10^6 \\mathrm{~V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The distance of the centre from each vertex of a regular hexagon is equal to the side of the hexagon, so $r = 6 \\text{ cm} = 6 \\times 10^{-2} \\text{ m}$.<br><br>Charge at each vertex, $q = 2 \\mu\\text{C} = 2 \\times 10^{-6} \\text{ C}$.<br><br>The total electric potential at the centre is the sum of the potentials due to all 6 charges:<br><br>$V = 6 \\times \\dfrac{1}{4 \\pi \\epsilon_0} \\dfrac{q}{r}$<br><br>Substituting the given values:<br><br>$V = 6 \\times \\dfrac{9 \\times 10^9 \\times 2 \\times 10^{-6}}{6 \\times 10^{-2}}$<br><br>$V = 18 \\times 10^5 \\text{ V}$<br><br>$V = 1.8 \\times 10^6 \\text{ V}$<br><br>Answer: $1.8 \\times 10^6 \\mathrm{~V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b73bf9280d7f993295b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Three charges each of magnitude $3 \\mu \\mathrm{C}$, are placed on the vertices of an equilateral triangle of side 6 cm . The net potential energy of the system will be nearly $\\left[\\frac{1}{4 \\pi \\epsilon_0}=9 \\times 10^9\\right.$ SI unit $]$", "image": null}, "options": [{"id": "Mp2vp", "text": "$1.4 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "OOfdC", "text": "$2.7 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "DnwWs", "text": "$4.1 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "1LiJH", "text": "$8.2 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The potential energy of a system of three charges is given by:<br><br>$U = \\dfrac{1}{4\\pi\\epsilon_0} \\left( \\dfrac{q_1 q_2}{r_{12}} + \\dfrac{q_2 q_3}{r_{23}} + \\dfrac{q_3 q_1}{r_{31}} \\right)$<br><br>Since all three charges are equal ($q_1 = q_2 = q_3 = q$) and placed at the vertices of an equilateral triangle ($r_{12} = r_{23} = r_{31} = r$), the expression simplifies to:<br><br>$U = 3 \\times \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q^2}{r}$<br><br>Given:<br>$q = 3 \\mu\\mathrm{C} = 3 \\times 10^{-6} \\mathrm{~C}$<br>$r = 6 \\mathrm{~cm} = 6 \\times 10^{-2} \\mathrm{~m}$<br>$\\dfrac{1}{4\\pi\\epsilon_0} = 9 \\times 10^9 \\mathrm{~N\\cdot m^2/C^2}$<br><br>Substituting the values:<br><br>$U = 3 \\times 9 \\times 10^9 \\times \\dfrac{(3 \\times 10^{-6})^2}{6 \\times 10^{-2}}$<br><br>$U = 27 \\times 10^9 \\times \\dfrac{9 \\times 10^{-12}}{6 \\times 10^{-2}}$<br><br>$U = 27 \\times 10^9 \\times 1.5 \\times 10^{-10}$<br><br>$U = 40.5 \\times 10^{-1} = 4.05 \\mathrm{~J}$<br><br>The net potential energy of the system is nearly $4.1 \\mathrm{~J}$.<br><br>Answer: $4.1 \\mathrm{~J}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b45bf9280d7f99327b8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The electric charges ' +2 q', ' +2 q', ' -2 q' and ' -2 q' are placed at the corners of square of side ' 2 L ' as shown in figure. The electric potential at point ' $A$ ', midway between the two charges ' $+2 q$ ' and ' $+2 q$ ' is ( $\\epsilon_0=$ permittivity of free space)\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/ewWF6pVa9xwHE7_1g7R9ve9oVgA8cHpf3mx3Qp62owI.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "x9FKM", "text": "$\\frac{1}{4 \\pi \\epsilon_0}\\left(\\frac{2 q}{L}\\right)\\left[1+\\frac{1}{\\sqrt{5}}\\right]$", "image": null, "isCorrect": false}, {"id": "vgr0v", "text": "$\\frac{\\mathrm{q}}{\\pi \\epsilon_0 \\mathrm{~L}}\\left[1-\\frac{1}{\\sqrt{5}}\\right]$", "image": null, "isCorrect": true}, {"id": "ttis8", "text": "$\\frac{\\mathrm{q}}{\\pi \\epsilon_0 \\mathrm{~L}}\\left[1+\\frac{1}{\\sqrt{5}}\\right]$", "image": null, "isCorrect": false}, {"id": "HZ4Ke", "text": "$\\frac{1}{4 \\pi \\epsilon_0}\\left(\\frac{2 q}{L}\\right)\\left[1-\\frac{1}{\\sqrt{5}}\\right]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the side of the square be $2L$.<br>Point A is the midpoint of the side connecting the two $+2q$ charges. Therefore, the distance of point A from each of the $+2q$ charges is $L$.<br><br>The distance of point A from each of the $-2q$ charges can be found using the Pythagorean theorem. The horizontal distance is $2L$ (the side of the square) and the vertical distance is $L$.<br>Distance $= \\sqrt{(2L)^2 + L^2} = \\sqrt{4L^2 + L^2} = \\sqrt{5L^2} = \\sqrt{5}L$<br><br>The total electric potential at point A is the algebraic sum of the potentials due to all four charges:<br>$V_A = V_{+2q} + V_{+2q} + V_{-2q} + V_{-2q}$<br><br>$V_A = \\dfrac{1}{4\\pi\\epsilon_0} \\left( \\dfrac{2q}{L} + \\dfrac{2q}{L} + \\dfrac{-2q}{\\sqrt{5}L} + \\dfrac{-2q}{\\sqrt{5}L} \\right)$<br><br>$V_A = \\dfrac{1}{4\\pi\\epsilon_0} \\left( \\dfrac{4q}{L} - \\dfrac{4q}{\\sqrt{5}L} \\right)$<br><br>$V_A = \\dfrac{4q}{4\\pi\\epsilon_0 L} \\left[ 1 - \\dfrac{1}{\\sqrt{5}} \\right]$<br><br>$V_A = \\dfrac{q}{\\pi\\epsilon_0 L} \\left[ 1 - \\dfrac{1}{\\sqrt{5}} \\right]$<br><br>Answer: $\\frac{\\mathrm{q}}{\\pi \\epsilon_0 \\mathrm{~L}}\\left[1-\\frac{1}{\\sqrt{5}}\\right]$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b36bf9280d7f993272a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Three concentric charged metallic spherical sheets A, B and C have radii $\\mathrm{a}, \\mathrm{b}, \\mathrm{c}$ potentials $\\mathrm{V}_{\\mathrm{A}}, \\mathrm{V}_{\\mathrm{B}}, \\mathrm{V}_{\\mathrm{C}}$ and charge densities $+\\sigma,-\\sigma$ and $+\\sigma$ respectively. The value of potential $V_A$ is ( $\\epsilon_0=$ permittivity of free space)", "image": null}, "options": [{"id": "isQLT", "text": "$\\frac{\\sigma}{\\epsilon_0}(a+b+c)$", "image": null, "isCorrect": false}, {"id": "7x1aP", "text": "$\\frac{\\sigma}{\\epsilon_0}(-a+b-c)$", "image": null, "isCorrect": false}, {"id": "Kovvz", "text": "$\\frac{\\sigma}{\\epsilon_0}(a-b+c)$", "image": null, "isCorrect": true}, {"id": "gaECF", "text": "$\\frac{\\sigma}{3 \\epsilon_0}(a+b+c)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The charges on the three concentric spherical sheets A, B, and C are given by the product of their surface charge densities and surface areas:<br><br>$q_A = \\sigma(4\\pi a^2)$<br><br>$q_B = -\\sigma(4\\pi b^2)$<br><br>$q_C = \\sigma(4\\pi c^2)$<br><br>The potential at the surface of the innermost sphere A is the algebraic sum of the potentials due to its own charge and the charges on the outer spheres B and C. Since sphere A lies inside spheres B and C, the potential at A due to B and C is the same as the potential on their respective surfaces.<br><br>$V_A = \\dfrac{1}{4\\pi\\epsilon_0} \\left( \\dfrac{q_A}{a} + \\dfrac{q_B}{b} + \\dfrac{q_C}{c} \\right)$<br><br>Substituting the values of $q_A$, $q_B$, and $q_C$ into the equation:<br><br>$V_A = \\dfrac{1}{4\\pi\\epsilon_0} \\left( \\dfrac{\\sigma(4\\pi a^2)}{a} - \\dfrac{\\sigma(4\\pi b^2)}{b} + \\dfrac{\\sigma(4\\pi c^2)}{c} \\right)$<br><br>$V_A = \\dfrac{1}{4\\pi\\epsilon_0} (4\\pi\\sigma a - 4\\pi\\sigma b + 4\\pi\\sigma c)$<br><br>$V_A = \\dfrac{\\sigma}{\\epsilon_0} (a - b + c)$<br><br>Answer: $\\frac{\\sigma}{\\epsilon_0}(a-b+c)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b23bf9280d7f9932697", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "' n ' small spherical drops of same size which are charged to ' V ' volt each coalesce to form a single big drop. The potential of the big drop is", "image": null}, "options": [{"id": "Srlr3", "text": "$\\frac{\\mathrm{v}}{\\mathrm{n}}$", "image": null, "isCorrect": false}, {"id": "mjZRj", "text": "$\\mathrm{n} \\cdot \\mathrm{V}$", "image": null, "isCorrect": false}, {"id": "Ru9E4", "text": "$\\mathrm{n}^{1 / 3} \\cdot \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "nlkwr", "text": "$\\mathrm{n}^{2 / 3} . \\mathrm{V}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $r$ be the radius and $q$ be the charge of each small drop.<br><br>The potential of each small drop is $V = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q}{r}$.<br><br>When $n$ small drops coalesce to form a single big drop of radius $R$, the total volume remains conserved.<br><br>$\\dfrac{4}{3}\\pi R^3 = n \\times \\dfrac{4}{3}\\pi r^3$<br><br>$R = n^{1/3} r$<br><br>The total charge on the big drop is $Q = nq$.<br><br>The potential of the big drop is $V' = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{Q}{R}$.<br><br>Substituting the values of $Q$ and $R$:<br><br>$V' = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{nq}{n^{1/3} r}$<br><br>$V' = n^{2/3} \\left( \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q}{r} \\right)$<br><br>$V' = n^{2/3} V$<br><br>Answer: $\\mathrm{n}^{2 / 3} . \\mathrm{V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b21bf9280d7f9932682", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Three point charges $+Q+2 Q$ and $q$ are placed at the vertices of an equilateral triangle. The value of charge q in terms of Q , so that electrical potential energy of the system is zero, is given by", "image": null}, "options": [{"id": "2dIhL", "text": "$\\mathrm{q}=\\frac{1}{3} \\mathrm{Q}$", "image": null, "isCorrect": false}, {"id": "XvUzS", "text": "$\\mathrm{q}=\\frac{2}{3} \\mathrm{Q}$", "image": null, "isCorrect": false}, {"id": "qeqBu", "text": "$\\mathrm{q}=-\\frac{2}{3} \\mathrm{Q}$", "image": null, "isCorrect": true}, {"id": "MQv8M", "text": "$\\mathrm{q}=-\\frac{3}{2} \\mathrm{Q}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the side length of the equilateral triangle be $a$.<br><br>The electrical potential energy of the system of three charges is given by:<br><br>$U = \\dfrac{1}{4\\pi\\epsilon_0} \\left( \\dfrac{q_1 q_2}{a} + \\dfrac{q_2 q_3}{a} + \\dfrac{q_3 q_1}{a} \\right)$<br><br>Given that the electrical potential energy of the system is zero, $U = 0$.<br><br>$\\dfrac{1}{4\\pi\\epsilon_0 a} ( (Q)(2Q) + (2Q)(q) + (q)(Q) ) = 0$<br><br>$2Q^2 + 2Qq + Qq = 0$<br><br>$2Q^2 + 3Qq = 0$<br><br>$3Qq = -2Q^2$<br><br>$q = -\\dfrac{2}{3}Q$<br><br>Answer: $\\mathrm{q}=-\\frac{2}{3} \\mathrm{Q}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b0abf9280d7f99325dd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The electric potential ' $V$ ' is given as a function of distance ' $x$ ' (metre) by $V=\\left(4 x^2+8 x-3\\right) V$. The value of electric field at $x=0.5 \\mathrm{~m}$, in $\\mathrm{V} / \\mathrm{m}$ is", "image": null}, "options": [{"id": "chC0y", "text": "$-16$", "image": null, "isCorrect": false}, {"id": "wD8Hb", "text": "$-12$", "image": null, "isCorrect": true}, {"id": "YMMFy", "text": "$0$", "image": null, "isCorrect": false}, {"id": "xIl1h", "text": "$+12$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The relation between electric field $E$ and electric potential $V$ is given by $E = -\\dfrac{dV}{dx}$.<br><br>Given $V = 4x^2 + 8x - 3$.<br><br>Differentiating with respect to $x$:<br><br>$\\dfrac{dV}{dx} = \\dfrac{d}{dx}(4x^2 + 8x - 3) = 8x + 8$<br><br>The electric field is $E = -(8x + 8)$.<br><br>At $x = 0.5 \\text{ m}$, substituting the value of $x$:<br><br>$E = -[8(0.5) + 8] = -(4 + 8) = -12 \\text{ V/m}$.<br><br>Answer: $-12$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871af9bf9280d7f993253f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Let ' $W$ ' joule be the work done to move an electric charge ' $q$ ' coulomb from a place $A$, where potential is -5 volt to another place $B$ where potential is ' $V$ ' volt. The value of ' $V$ ' is", "image": null}, "options": [{"id": "Ecdxi", "text": "$\\mathrm{Wq}-5$", "image": null, "isCorrect": false}, {"id": "lOrMz", "text": "$\\frac{q}{w}+5$", "image": null, "isCorrect": false}, {"id": "lGsIH", "text": "$w-\\frac{5}{q}$", "image": null, "isCorrect": false}, {"id": "e7pPe", "text": "$\\frac{w}{q}-5$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The work done $W$ in moving a charge $q$ from a point $A$ with potential $V_A$ to a point $B$ with potential $V_B$ is given by:<br><br>$W = q(V_B - V_A)$<br><br>Given $V_A = -5$ V and $V_B = V$, substituting these values gives:<br><br>$W = q(V - (-5))$<br><br>$W = q(V + 5)$<br><br>$V + 5 = \\dfrac{W}{q}$<br><br>$V = \\dfrac{W}{q} - 5$<br><br>Answer: $\\frac{w}{q}-5$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214440aee93fa0796df47", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "' $n$ ' small drops of same size are charged to 'V' volt each. If they coalesce to form a single large drop, then its potential will be", "image": null}, "options": [{"id": "M52vL", "text": "$\\mathrm{Vn}^{\\frac{1}{3}}$", "image": null, "isCorrect": false}, {"id": "rOtOS", "text": "$\\mathrm{Vn}^{\\frac{2}{3}}$", "image": null, "isCorrect": true}, {"id": "x657N", "text": "$V \\cdot n$", "image": null, "isCorrect": false}, {"id": "MDrot", "text": "$\\mathrm{Vn}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $r$ be the radius and $q$ be the charge of each small drop.<br><br>The potential of each small drop is $V = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q}{r}$.<br><br>When $n$ small drops coalesce to form a single large drop, the total charge is $Q = nq$.<br><br>The volume remains conserved, so $\\dfrac{4}{3}\\pi R^3 = n \\times \\dfrac{4}{3}\\pi r^3$, which gives $R = n^{1/3}r$.<br><br>The potential of the large drop is $V' = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{Q}{R}$.<br><br>Substituting the values of $Q$ and $R$, we get $V' = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{nq}{n^{1/3}r} = n^{2/3} \\left( \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q}{r} \\right) = V n^{2/3}$.<br><br>Answer: $\\mathrm{Vn}^{\\frac{2}{3}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792141a0aee93fa0796de00", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "Charges of $2 \\mu \\mathrm{C}$ and $-3 \\mu \\mathrm{C}$ are placed at two points A and B separated by 1 m . The distance of the point from A , where net potential is zero, is\r\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/ja7WcLsz2wMiG4kfzMDPl6zo0tbwiTZx6FaxQ7V5qxc.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "oiPPH", "text": "0.7 m", "image": null, "isCorrect": false}, {"id": "vSQO3", "text": "0.5 m", "image": null, "isCorrect": false}, {"id": "4v35r", "text": "0.4 m", "image": null, "isCorrect": true}, {"id": "83FMM", "text": "0.6 m", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the point where the net electric potential is zero be at a distance $x$ from point A, between A and B.<br><br>The distance of this point from point B will be $(1 - x)$ m.<br><br>The net potential at this point is the sum of the potentials due to the charges at A and B. For the net potential to be zero:<br><br>$V = V_A + V_B = 0$<br><br>$\\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q_1}{x} + \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q_2}{1 - x} = 0$<br><br>Substituting the given values $q_1 = 2 \\mu\\text{C}$ and $q_2 = -3 \\mu\\text{C}$:<br><br>$\\dfrac{2 \\times 10^{-6}}{x} + \\dfrac{-3 \\times 10^{-6}}{1 - x} = 0$<br><br>$\\dfrac{2}{x} = \\dfrac{3}{1 - x}$<br><br>Cross-multiplying, we get:<br><br>$2(1 - x) = 3x$<br><br>$2 - 2x = 3x$<br><br>$5x = 2$<br><br>$x = \\dfrac{2}{5} = 0.4 \\text{ m}$<br><br>Thus, the distance of the point from A where the net potential is zero is $0.4 \\text{ m}$.<br><br>Answer: 0.4 m", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214080aee93fa0796dd6c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "If a unit positive charge is shifted from a region of low potential to a region of high potential, then the electric potential energy of the system", "image": null}, "options": [{"id": "hrMF3", "text": "increases.", "image": null, "isCorrect": true}, {"id": "uQ2x6", "text": "decreases.", "image": null, "isCorrect": false}, {"id": "N0fwO", "text": "does not change.", "image": null, "isCorrect": false}, {"id": "b8kW8", "text": "is zero.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The electric potential energy $U$ of a charge $q$ at a point with electric potential $V$ is given by $U = qV$.<br><br>For a unit positive charge, $q = +1$, so the potential energy is directly proportional to the electric potential ($U = V$).<br><br>When the charge is shifted from a region of low potential ($V_1$) to a region of high potential ($V_2$), we have $V_2 > V_1$.<br><br>Therefore, the final potential energy $U_2$ is greater than the initial potential energy $U_1$.<br><br>Hence, the electric potential energy of the system increases.<br><br>Answer: increases.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d20aee93fa0796dbc8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "The electric potential at a point on the axis of an electric dipole is proportional to $[\\mathrm{r}=$ distance between centre of the electric dipole and the point]", "image": null}, "options": [{"id": "INtlM", "text": "$\\dfrac{1}{r}$", "image": null, "isCorrect": false}, {"id": "9R9sW", "text": "$\\dfrac{1}{\\mathrm{r}^2}$", "image": null, "isCorrect": true}, {"id": "OBTp4", "text": "r", "image": null, "isCorrect": false}, {"id": "QwgK8", "text": "$\\dfrac{1}{r^3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The electric potential $V$ at a point on the axis of an electric dipole at a distance $r$ from its centre is given by<br><br>$V = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{p}{r^2 - a^2}$<br><br>For a short dipole where $r \\gg a$, the potential becomes<br><br>$V \\approx \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{p}{r^2}$<br><br>Therefore, the electric potential is proportional to $\\dfrac{1}{r^2}$.<br><br>Answer: $\\dfrac{1}{\\mathrm{r}^2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213cf0aee93fa0796dbb1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "Two point charges $\\mathrm{q}_1=6 \\mu \\mathrm{C}$ and $\\mathrm{q}_2=4 \\mu \\mathrm{C}$ are kept at points A and B in air where $\\mathrm{AB}=10 \\mathrm{~cm}$. What is the increase in potential energy of the system when $\\mathrm{q}_2$ is moved towards $\\mathrm{q}_1$ by 2 cm ?\r\n$\\left(\\dfrac{1}{4 \\pi \\varepsilon_0}=9 \\times 10^9 \\text { SI units }\\right)$", "image": null}, "options": [{"id": "zAvC9", "text": "0.27 J", "image": null, "isCorrect": false}, {"id": "kdv02", "text": "$\\quad 0.54 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "izILH", "text": "0.81 J", "image": null, "isCorrect": false}, {"id": "aUPBf", "text": "54 J", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Initial potential energy of the system is given by $U_i = \\dfrac{1}{4 \\pi \\varepsilon_0} \\dfrac{q_1 q_2}{r_i}$<br><br>Final potential energy of the system is given by $U_f = \\dfrac{1}{4 \\pi \\varepsilon_0} \\dfrac{q_1 q_2}{r_f}$<br><br>Increase in potential energy is $\\Delta U = U_f - U_i = \\dfrac{q_1 q_2}{4 \\pi \\varepsilon_0} \\left( \\dfrac{1}{r_f} - \\dfrac{1}{r_i} \\right)$<br><br>Given $q_1 = 6 \\times 10^{-6} \\text{ C}$, $q_2 = 4 \\times 10^{-6} \\text{ C}$, $r_i = 10 \\text{ cm} = 0.1 \\text{ m}$, $r_f = 10 - 2 = 8 \\text{ cm} = 0.08 \\text{ m}$<br><br>Substituting the values:<br><br>$\\Delta U = 9 \\times 10^9 \\times 6 \\times 10^{-6} \\times 4 \\times 10^{-6} \\left( \\dfrac{1}{0.08} - \\dfrac{1}{0.1} \\right)$<br><br>$\\Delta U = 216 \\times 10^{-3} \\times (12.5 - 10)$<br><br>$\\Delta U = 0.216 \\times 2.5 = 0.54 \\text{ J}$<br><br>Answer: $\\quad 0.54 \\mathrm{~J}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213cc0aee93fa0796db9d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "If a unit charge is taken from one point to another point over an equipotential surface, then", "image": null}, "options": [{"id": "AzdwA", "text": "work is done on the charge.", "image": null, "isCorrect": false}, {"id": "qvn9P", "text": "work is done by the charge.", "image": null, "isCorrect": false}, {"id": "HHcOr", "text": "work done on the charge is constantly increasing.", "image": null, "isCorrect": false}, {"id": "GG3zt", "text": "work done to move a charge is zero.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The work done $W$ in moving a charge $q$ from one point to another is given by $W = q \\Delta V$, where $\\Delta V$ is the potential difference between the two points.<br><br>By definition, an equipotential surface has the same electric potential at all points. Therefore, the potential difference between any two points on the surface is zero ($\\Delta V = 0$).<br><br>Substituting this into the work formula gives $W = q(0) = 0$.<br><br>Hence, the work done to move a charge over an equipotential surface is zero.<br><br>Answer: work done to move a charge is zero.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213bb0aee93fa0796db15", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "Four electric charges $+q,+q,-q$ and $-q$ are placed in order at the corners of a square of side 2 L . The electric potential at point midway between the two positive charges is", "image": null}, "options": [{"id": "1H5as", "text": "$\\dfrac{1}{4 \\pi \\mathrm{E}_0} \\dfrac{2 \\mathrm{q}}{\\mathrm{L}}\\left(1+\\dfrac{1}{\\sqrt{5}}\\right)$", "image": null, "isCorrect": false}, {"id": "VYFzX", "text": "$\\dfrac{1}{4 \\pi \\mathrm{E}_0} \\dfrac{2 \\mathrm{q}}{\\mathrm{L}}\\left(1-\\dfrac{1}{\\sqrt{5}}\\right)$", "image": null, "isCorrect": true}, {"id": "Fzrc1", "text": "$\\dfrac{1}{4 \\pi \\mathrm{E}_0} \\dfrac{2 \\mathrm{q}}{\\mathrm{L}}(1-\\sqrt{5})$", "image": null, "isCorrect": false}, {"id": "xKJ5x", "text": "$\\dfrac{1}{4 \\pi \\mathrm{E}_0} \\dfrac{2 \\mathrm{q}}{\\mathrm{L}}(1+\\sqrt{5})$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the corners of the square be A, B, C, and D in order, with charges $+q, +q, -q$, and $-q$ respectively.<br><br>The side length of the square is $2L$.<br><br>Let M be the midpoint of the side AB connecting the two positive charges.<br><br>The distance of M from the charges at A and B is $L$.<br><br>The distance of M from the charges at C and D can be calculated using the Pythagorean theorem:<br><br>$MC = MD = \\sqrt{L^2 + (2L)^2} = \\sqrt{5}L$<br><br>The total electric potential at M is the scalar sum of the potentials due to each of the four charges:<br><br>$V = V_A + V_B + V_C + V_D$<br><br>$V = \\dfrac{1}{4 \\pi \\epsilon_0} \\left( \\dfrac{q}{L} + \\dfrac{q}{L} - \\dfrac{q}{\\sqrt{5}L} - \\dfrac{q}{\\sqrt{5}L} \\right)$<br><br>$V = \\dfrac{1}{4 \\pi \\epsilon_0} \\left( \\dfrac{2q}{L} - \\dfrac{2q}{\\sqrt{5}L} \\right)$<br><br>$V = \\dfrac{1}{4 \\pi \\epsilon_0} \\dfrac{2q}{L} \\left( 1 - \\dfrac{1}{\\sqrt{5}} \\right)$<br><br>Answer: $\\dfrac{1}{4 \\pi \\mathrm{E}_0} \\dfrac{2 \\mathrm{q}}{\\mathrm{L}}\\left(1-\\dfrac{1}{\\sqrt{5}}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213a70aee93fa0796da7b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "The van de Graaff Generator is not based on", "image": null}, "options": [{"id": "OKgx5", "text": "the phenomenon of Corona Discharge.", "image": null, "isCorrect": false}, {"id": "brj2C", "text": "the application of electric field and magnetic field which are perpendicular to each other.", "image": null, "isCorrect": true}, {"id": "JRNFC", "text": "the property that charge given to a hollow conductor is transferred to its outer surface and distributed uniformly over it.", "image": null, "isCorrect": false}, {"id": "IZXle", "text": "the fact that a charge is continuously supplied to an isolated metallic conductor, the potential of the conductor goes on increasing.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The van de Graaff generator is an electrostatic machine used to generate very high voltages. It operates on the following principles:<br><br>1. Corona discharge (action of sharp points), which is used to spray charge onto the moving belt.<br><br>2. The property that any charge given to a hollow conductor resides entirely on its outer surface, allowing the accumulation of large amounts of charge.<br><br>3. As charge is continuously supplied to the isolated metallic shell, its potential keeps increasing until breakdown occurs.<br><br>The application of mutually perpendicular electric and magnetic fields is the working principle of a cyclotron, not a van de Graaff generator.<br><br>Answer: the application of electric field and magnetic field which are perpendicular to each other.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213840aee93fa0796d962", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "An electron of mass ' $m$ ' and charge ' $q$ ' is accelerated from rest in a uniform electric field of intensity ' $E$ '. The velocity acquired by it as it travels a distance ' $l$ ' is ' $v$ '. The ratio $\\dfrac{\\mathrm{q}}{\\mathrm{m}}$ in terms of $\\mathrm{E}, l$ and v is", "image": null}, "options": [{"id": "EyBe4", "text": "$\\dfrac{\\mathrm{v}^2}{2 \\mathrm{E} l}$", "image": null, "isCorrect": true}, {"id": "LV2iD", "text": "$\\dfrac{\\mathrm{v}^2 l}{2 \\mathrm{E}}$", "image": null, "isCorrect": false}, {"id": "a7WtV", "text": "$\\dfrac{2 \\mathrm{E}}{\\mathrm{v}^2 l}$", "image": null, "isCorrect": false}, {"id": "ePszI", "text": "$\\dfrac{\\mathrm{v}^2 l}{\\mathrm{E}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Force experienced by the electron in the uniform electric field is given by $F = qE$.<br><br>Acceleration of the electron is $a = \\dfrac{F}{m} = \\dfrac{qE}{m}$.<br><br>Using the equation of motion $v^2 = u^2 + 2al$ and substituting $u = 0$ since the electron starts from rest, we get:<br><br>$v^2 = 2 \\left( \\dfrac{qE}{m} \\right) l$<br><br>Rearranging the terms to find the ratio $\\dfrac{q}{m}$:<br><br>$\\dfrac{q}{m} = \\dfrac{v^2}{2El}$<br><br>Answer: $\\dfrac{\\mathrm{v}^2}{2 \\mathrm{E} l}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213820aee93fa0796d955", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "If a $10 \\mu \\mathrm{C}$ charge exists at the centre of a square, the work done in moving a $2 \\mu \\mathrm{C}$ point charge from corner $A$ to corner $B$ of a square ABCD is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/ukdqZyeaz-kcB67nHPxu77txYN0vvflP6lwcSTX6X_s.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "qhK79", "text": "Zeró", "image": null, "isCorrect": true}, {"id": "ZYLOE", "text": "2", "image": null, "isCorrect": false}, {"id": "0G0WQ", "text": "5", "image": null, "isCorrect": false}, {"id": "1cnlf", "text": "20", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the side length of the square ABCD be $a$.<br><br>The distance from the centre of the square to any of its corners is $r = \\dfrac{a}{\\sqrt{2}}$.<br><br>The electric potential at corner A due to the $10 \\mu\\text{C}$ charge at the centre is:<br><br>$V_A = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{10 \\mu\\text{C}}{r}$<br><br>Similarly, the electric potential at corner B due to the charge at the centre is:<br><br>$V_B = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{10 \\mu\\text{C}}{r}$<br><br>Since the distances are equal, the potentials at corners A and B are equal, i.e., $V_A = V_B$.<br><br>The work done in moving a $2 \\mu\\text{C}$ charge from corner A to corner B is given by:<br><br>$W = q(V_B - V_A)$<br><br>Substituting $V_A = V_B$, we get:<br><br>$W = 2 \\mu\\text{C} \\times 0 = 0$<br><br>Therefore, the work done is zero.<br><br>Answer: Zeró", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213720aee93fa0796d8d9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "A metallic sphere ' A ' isolated from ground is charged to $+50 \\mu \\mathrm{C}$. This sphere is brought in contact with other isolated metallic sphere ' $B$ ' of half the radius of sphere ' A '. Then the charge on the two isolated spheres $\\mathrm{A} \\& \\mathrm{~B}$ are in the ratio", "image": null}, "options": [{"id": "FepBe", "text": "$1: 2$", "image": null, "isCorrect": false}, {"id": "gmMyK", "text": "$2: 1$", "image": null, "isCorrect": true}, {"id": "vuu6C", "text": "$4: 1$", "image": null, "isCorrect": false}, {"id": "wFmqt", "text": "$1: 1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the radius of sphere A be $R_A$ and the radius of sphere B be $R_B$.<br><br>Given $R_B = \\dfrac{R_A}{2}$.<br><br>When the two metallic spheres are brought in contact, charge flows until their potentials become equal.<br><br>$V_A = V_B$<br><br>$\\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{Q_A}{R_A} = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{Q_B}{R_B}$<br><br>$\\dfrac{Q_A}{Q_B} = \\dfrac{R_A}{R_B}$<br><br>Substituting $R_B = \\dfrac{R_A}{2}$, we get:<br><br>$\\dfrac{Q_A}{Q_B} = \\dfrac{R_A}{R_A / 2} = \\dfrac{2}{1}$<br><br>The ratio of charges on spheres A and B is $2:1$.<br><br>Answer: $2: 1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792136d0aee93fa0796d8b7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "The electric potential at the centre of two concentric half rings of radii $R_1$ and $R_2$, having same linear charge density ' $\\lambda$ ' is ( $\\varepsilon_0=$ permittivity of free space $)$\r\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/y2Eg74Esi9yFOYrJjDb4t7VKxDk9W1Ckr0geXUbJpsw.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "XII1g", "text": "$\\dfrac{2 \\lambda}{\\varepsilon_0}$", "image": null, "isCorrect": false}, {"id": "Xig7A", "text": "$\\dfrac{\\lambda}{2 \\varepsilon_0}$", "image": null, "isCorrect": true}, {"id": "ELysv", "text": "$\\dfrac{\\lambda}{4 \\varepsilon_0}$", "image": null, "isCorrect": false}, {"id": "T0HJC", "text": "$\\dfrac{\\lambda}{\\varepsilon_0}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The electric potential $V$ at the center of a circular arc of radius $R$ with a uniform linear charge density $\\lambda$ is given by integrating the potential due to an infinitesimal charge element $dq$ over the arc.<br><br>We know that $dq = \\lambda dl = \\lambda R d\\theta$.<br><br>The potential due to this element at the center is:<br>$dV = \\dfrac{1}{4\\pi\\varepsilon_0} \\dfrac{dq}{R} = \\dfrac{1}{4\\pi\\varepsilon_0} \\dfrac{\\lambda R d\\theta}{R} = \\dfrac{\\lambda}{4\\pi\\varepsilon_0} d\\theta$<br><br>For a half ring, the angle $\\theta$ varies from $0$ to $\\pi$. Integrating this, we get the potential due to one half ring:<br>$V = \\int_0^\\pi \\dfrac{\\lambda}{4\\pi\\varepsilon_0} d\\theta = \\dfrac{\\lambda}{4\\pi\\varepsilon_0} [\\theta]_0^\\pi = \\dfrac{\\lambda \\pi}{4\\pi\\varepsilon_0} = \\dfrac{\\lambda}{4\\varepsilon_0}$<br><br>The problem states that there are two concentric half rings of radii $R_1$ and $R_2$, and both have the same linear charge density $\\lambda$. The total electric potential at the common center is the scalar sum of the potentials due to each half ring.<br><br>$V_{net} = V_1 + V_2$<br><br>$V_{net} = \\dfrac{\\lambda}{4\\varepsilon_0} + \\dfrac{\\lambda}{4\\varepsilon_0} = \\dfrac{2\\lambda}{4\\varepsilon_0} = \\dfrac{\\lambda}{2\\varepsilon_0}$<br><br>Answer: $\\dfrac{\\lambda}{2 \\varepsilon_0}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792135c0aee93fa0796d832", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "Two charged particles having charges ' $+q$ ' and ' $-q$ ' and each having mass ' $m$ ' are held at rest while their separation is ' $r$ '. The speed of the particles when their separation is ' $\\frac{r}{2}$ ', will be ( $\\varepsilon_0 =$ permittivity of free space )", "image": null}, "options": [{"id": "cWN9K", "text": "$\\dfrac{\\mathrm{q}}{4 \\pi \\varepsilon_0 \\mathrm{mr}}$", "image": null, "isCorrect": false}, {"id": "WvgUg", "text": "$\\dfrac{\\mathrm{q}}{2 \\pi \\varepsilon_0 \\mathrm{mr}}$", "image": null, "isCorrect": false}, {"id": "KBdYw", "text": "$\\dfrac{\\mathrm{q}}{\\sqrt{4 \\pi \\varepsilon_0 \\mathrm{mr}}}$", "image": null, "isCorrect": true}, {"id": "ZmK2K", "text": "$\\dfrac{\\mathrm{q}^2}{4 \\pi \\varepsilon_0 \\mathrm{mr}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "By the principle of conservation of mechanical energy, the total initial energy of the system is equal to the total final energy.<br><br>Initial kinetic energy, $K_i = 0$<br><br>Initial potential energy, $U_i = -\\dfrac{q^2}{4\\pi\\varepsilon_0 r}$<br><br>Let $v$ be the speed of each particle when their separation is $\\dfrac{r}{2}$. Since both particles have the same mass and start from rest, they will have the same speed.<br><br>Final kinetic energy, $K_f = \\dfrac{1}{2}mv^2 + \\dfrac{1}{2}mv^2 = mv^2$<br><br>Final potential energy, $U_f = -\\dfrac{q^2}{4\\pi\\varepsilon_0 \\left(\\dfrac{r}{2}\\right)} = -\\dfrac{2q^2}{4\\pi\\varepsilon_0 r}$<br><br>Equating initial and final mechanical energies:<br><br>$K_i + U_i = K_f + U_f$<br><br>$0 - \\dfrac{q^2}{4\\pi\\varepsilon_0 r} = mv^2 - \\dfrac{2q^2}{4\\pi\\varepsilon_0 r}$<br><br>$mv^2 = \\dfrac{2q^2}{4\\pi\\varepsilon_0 r} - \\dfrac{q^2}{4\\pi\\varepsilon_0 r}$<br><br>$mv^2 = \\dfrac{q^2}{4\\pi\\varepsilon_0 r}$<br><br>$v^2 = \\dfrac{q^2}{4\\pi\\varepsilon_0 mr}$<br><br>$v = \\dfrac{q}{\\sqrt{4\\pi\\varepsilon_0 mr}}$<br><br>Answer: $\\dfrac{\\mathrm{q}}{\\sqrt{4 \\pi \\varepsilon_0 \\mathrm{mr}}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213590aee93fa0796d816", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "A regular hexagon of side 10 cm has a charge $1 \\mu \\mathrm{C}$ at each of its vertices. The potential at the centre of hexagon is $\\left[\\dfrac{1}{4 \\pi \\varepsilon_0}=9 \\times 10^9\\right.$ SI unit $]$", "image": null}, "options": [{"id": "bpjPX", "text": "$1.8 \\times 10^5$ volt", "image": null, "isCorrect": false}, {"id": "jrrIR", "text": "$3.6 \\times 10^5$ volt", "image": null, "isCorrect": false}, {"id": "XaqmC", "text": "$5.4 \\times 10^5$ volt", "image": null, "isCorrect": true}, {"id": "8o3jH", "text": "$7.2 \\times 10^5$ volt", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The distance of the centre of a regular hexagon from each vertex is equal to the side length of the hexagon.<br><br>$r = 10 \\text{ cm} = 0.1 \\text{ m}$<br><br>Charge at each vertex, $q = 1 \\mu\\text{C} = 10^{-6} \\text{ C}$<br><br>Total potential at the centre is the sum of potentials due to all 6 charges.<br><br>$V = 6 \\times \\dfrac{1}{4 \\pi \\varepsilon_0} \\dfrac{q}{r}$<br><br>$V = 6 \\times 9 \\times 10^9 \\times \\dfrac{10^{-6}}{0.1}$<br><br>$V = 54 \\times 10^4 = 5.4 \\times 10^5 \\text{ V}$<br><br>Answer: $5.4 \\times 10^5$ volt", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213380aee93fa0796d713", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "Four point charges each $+q$ is placed on the circumference of a circle of diameter 2 d in such a way that they form a square. The potential at the centre is proportional to", "image": null}, "options": [{"id": "WYRzm", "text": "$\\dfrac{\\mathrm{q}^2}{\\mathrm{~d}^2}$", "image": null, "isCorrect": false}, {"id": "gefcZ", "text": "$\\dfrac{q}{d}$", "image": null, "isCorrect": true}, {"id": "S9Q0X", "text": "$\\dfrac{d}{q}$", "image": null, "isCorrect": false}, {"id": "drQ4I", "text": "$\\dfrac{\\mathrm{d}^2}{\\mathrm{q}^2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The diameter of the circle is given as $2d$, so the radius of the circle is $r = \\dfrac{2d}{2} = d$.<br><br>The electric potential at the centre of the circle due to a single charge $+q$ on the circumference is $V_1 = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q}{d}$.<br><br>Since electric potential is a scalar quantity, the total potential at the centre due to all four charges is the algebraic sum of their individual potentials.<br><br>$V = 4 \\times V_1 = 4 \\times \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q}{d} = \\dfrac{1}{\\pi\\epsilon_0} \\dfrac{q}{d}$<br><br>Thus, the potential at the centre is proportional to $\\dfrac{q}{d}$.<br><br>Answer: $\\dfrac{q}{d}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213220aee93fa0796d66d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "Three charges are placed at the vertices of an equilateral triangle as shown in the figure. For what value of charge ' $Q$ ', the electrostatic potential energy of the system is zero?\n<img width=200px src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/86Ke3hBwEPSDIykNHaUlvV-BQYvruXNL1J5_L62T7yI.original.fullsize.png\"/>", "image": null}, "options": [{"id": "V0EBv", "text": "$-q$", "image": null, "isCorrect": false}, {"id": "huck4", "text": "$\\dfrac{\\mathrm{q}}{2}$", "image": null, "isCorrect": false}, {"id": "Mvdop", "text": "$-2 q$", "image": null, "isCorrect": false}, {"id": "umfAu", "text": "$-\\dfrac{\\mathrm{q}}{2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The electrostatic potential energy of a system of three charges is given by:<br><br>$U = \\dfrac{1}{4\\pi\\epsilon_0} \\left( \\dfrac{q_1 q_2}{r_{12}} + \\dfrac{q_2 q_3}{r_{23}} + \\dfrac{q_3 q_1}{r_{31}} \\right)$<br><br>Given $q_1 = q$, $q_2 = q$, $q_3 = Q$ and the side length of the equilateral triangle is $r_{12} = r_{23} = r_{31} = a$.<br><br>Substituting the values, we get:<br><br>$U = \\dfrac{1}{4\\pi\\epsilon_0 a} (q \\cdot q + q \\cdot Q + Q \\cdot q)$<br><br>$U = \\dfrac{1}{4\\pi\\epsilon_0 a} (q^2 + 2qQ)$<br><br>Since the electrostatic potential energy of the system is zero, $U = 0$:<br><br>$q^2 + 2qQ = 0$<br><br>$q(q + 2Q) = 0$<br><br>Assuming $q \\neq 0$, we have:<br><br>$q + 2Q = 0 \\Rightarrow Q = -\\dfrac{q}{2}$<br><br>Answer: $-\\dfrac{\\mathrm{q}}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213200aee93fa0796d659", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "90 J of work is done to move an electric charge of magnitude 3 C from a place A , where potential is -10 V to another place B , where potential is ' $\\mathrm{V}_1$ ' volt. The value of $\\mathrm{V}_1$ is", "image": null}, "options": [{"id": "gDgJ7", "text": "10 V", "image": null, "isCorrect": false}, {"id": "DVRVH", "text": "20 V", "image": null, "isCorrect": true}, {"id": "iADPd", "text": "30 V", "image": null, "isCorrect": false}, {"id": "6z4Cj", "text": "-40 V", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The work done in moving a charge $q$ from point A to point B is given by $W = q(V_B - V_A)$.<br><br>Given $W = 90$ J, $q = 3$ C, $V_A = -10$ V, and $V_B = V_1$.<br><br>Substituting the values in the formula:<br><br>$90 = 3(V_1 - (-10))$<br><br>$90 = 3(V_1 + 10)$<br><br>$30 = V_1 + 10$<br><br>$V_1 = 20$ V<br><br>Answer: 20 V", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2623f0279619d9d8a32fd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "Two cells $\\mathrm{E}_1$ and $\\mathrm{E}_2$ having equal $\\mathrm{EMF}$ ' $\\mathrm{E}$ ' and internal resistances $r_1$ and $r_2\\left(r_1>r_2\\right)$ respectively are connected in series. This combination is connected to an external resistance ' $R$ '. It is observed that the potential difference across the cell $E_1$ becomes zero. The value of ' $R$ ' will be", "image": null}, "options": [{"id": "IxRZ5", "text": "$r_1-r_2$", "image": null, "isCorrect": true}, {"id": "DBEEy", "text": "$\\mathrm{r}_1+\\mathrm{r}_2$", "image": null, "isCorrect": false}, {"id": "TpRFk", "text": "$\\frac{\\mathrm{r}_1-\\mathrm{r}_2}{2}$", "image": null, "isCorrect": false}, {"id": "r5YcL", "text": "$\\frac{r_1+r_2}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The total current in the circuit is\n$$\nI=\\frac{2 E}{r_1+r_2+R}\n$$\n....(Given cells are in series, $\\mathrm{E}+\\mathrm{E}=2 \\mathrm{E}$ )\nNow the potential drop across the first cell is\n$$\n\\begin{array}{ll} \n& \\mathrm{V}_1=\\mathrm{E}-\\mathrm{Ir}_1=0 \\\\\n\\therefore \\quad & \\mathrm{E}-\\left(\\frac{2 \\mathrm{E}}{\\mathrm{r}_1+\\mathrm{r}_2+\\mathrm{R}}\\right) \\times \\mathrm{r}_1=0 \\\\\n& \\frac{2 \\mathrm{E}}{\\mathrm{r}_1+\\mathrm{r}_2+\\mathrm{R}}=\\frac{\\mathrm{E}}{\\mathrm{r}_1} \\Rightarrow 2 \\mathrm{r}_1=\\mathrm{r}_1+\\mathrm{r}_2+\\mathrm{R} \\\\\n\\therefore \\quad & \\mathrm{R}=\\mathrm{r}_1-\\mathrm{r}_2\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262310279619d9d8a328e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "Three point charges $+Q,+2 q$ and $+q$ are placed at the vertices of a right angled isosceles triangle. The net electrostatic potential energy of the configuration is zero, if $\\mathrm{Q}$ is equal to\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/QkHfmiO4-ZDBtG7u7dHBGrj3M1-ojDNyy3fFjl0UnME.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "XWt5Q", "text": "$-\\frac{\\sqrt{2}}{3} q$", "image": null, "isCorrect": true}, {"id": "YjsUr", "text": "$+\\frac{\\sqrt{2}}{3} \\mathrm{q}$", "image": null, "isCorrect": false}, {"id": "SMdn6", "text": "$-\\frac{3}{\\sqrt{2}} \\mathrm{q}$", "image": null, "isCorrect": false}, {"id": "HNOlt", "text": "$+\\frac{3}{\\sqrt{2}} \\mathrm{q}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Net electrostatic potential energy of the system is,\n$$\n\\begin{aligned}\n& \\mathrm{U}=\\frac{1}{4 \\pi \\varepsilon_0}\\left(\\frac{\\mathrm{Qq}}{\\mathrm{a}}+\\frac{2 \\mathrm{Qq}}{\\mathrm{a}}+\\frac{2 \\mathrm{qq}}{\\sqrt{2} \\mathrm{a}}\\right)=0 \\\\\n\\mathrm{Q} & +2 \\mathrm{Q}+\\frac{2 \\mathrm{q}}{\\sqrt{2}}=0 \\\\\n3 \\mathrm{Q} & +\\sqrt{2} \\mathrm{q}=0 \\\\\n\\therefore \\quad & \\mathrm{Q}=\\frac{-\\sqrt{2} \\mathrm{q}}{3}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262300279619d9d8a3285", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "Two point charges ' $q 1$ ' and 'q2' are separated by a distance ' $\\mathrm{d}$ '. What is the increase in potential energy of the system when ' $q 2$ ' is moved towards ' $q 1$ ' by a distance ' $x$ '?\n$$\n(\\mathrm{x} < \\mathrm{d})\\left(\\frac{1}{4 \\pi \\varepsilon_0}=\\mathrm{K}, \\text { constant }\\right)\n$$", "image": null}, "options": [{"id": "qKKut", "text": "$-\\frac{\\mathrm{Kq}_1 \\mathrm{q}_2 \\mathrm{x}}{\\mathrm{d}(\\mathrm{d}-\\mathrm{x})}$", "image": null, "isCorrect": true}, {"id": "zXOkK", "text": "$-\\frac{\\mathrm{Kq}_1 \\mathrm{q}_2}{\\mathrm{~d}(\\mathrm{~d}-\\mathrm{x})}$", "image": null, "isCorrect": false}, {"id": "a6D1e", "text": "$\\frac{\\mathrm{Kq}_1 \\mathrm{q}_{2 x}}{\\left(\\mathrm{~d}^2-\\mathrm{x}^2\\right)}$", "image": null, "isCorrect": false}, {"id": "OVboo", "text": "$\\frac{\\mathrm{Kq}_1 \\mathrm{q}_2 \\mathrm{x}}{\\left(\\mathrm{d}^2-\\mathrm{x}^2\\right)}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The potential energy between two charges is given as $U=\\frac{k q_1 q_2}{r}$\n\nInitial potential energy is $\\mathrm{U}_{\\mathrm{f}}=\\frac{\\mathrm{kq}_1 \\mathrm{q}_2}{\\mathrm{r}}$\nWhen charge $q_2$ moves towards the $q_1$ the separation between the charges becomes $\\mathrm{d}-\\mathrm{x}$\n\nThe final potential energy is $\\mathrm{U}_{\\mathrm{f}}=\\frac{\\mathrm{kq}_1 \\mathrm{q}_2}{(\\mathrm{~d}-\\mathrm{x})}$\nThe increase in potential energy is\n$$\n\\begin{array}{ll}\n\\therefore & \\Delta U=U_f-U_f \\\\\n\\therefore & \\Delta U=\\frac{k q_1 q_2}{d}-\\frac{k q_1 q_2}{(d-x)} \\\\\n\\therefore & \\Delta U=k q_1 q_2\\left(\\frac{1}{d}-\\frac{1}{d-x}\\right) \\\\\n\\therefore & \\Delta U=\\frac{-k q_1 q_2 x}{d(d-x)}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2620b0279619d9d8a315a", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "Potential difference between the points $P$ and Q is nearly\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/hxOcnAAQ8SD4_GPdweapxJJsnD9GH4O3CYx_YZP_1Vo.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "Jqq27", "text": "$17 \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "NBSOV", "text": "$14 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "AmcQ8", "text": "$12 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "sgjw1", "text": "$8 \\mathrm{~V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let total current be denoted as I. The given circuit is a Wheatstone bridge.\n$\\begin{aligned}\n& \\Rightarrow R_1=6+3=9 \\Omega . \\\\\n& \\Rightarrow R_2=8+4=12 \\Omega\n\\end{aligned}$\nAccording to $\\mathrm{KCL}$, the current will get divided into two parts $I_1$ and $I_2$\n$\\therefore \\quad \\mathrm{I}_1=\\frac{\\mathrm{R}_2 \\mathrm{I}}{\\left(\\mathrm{R}_1+\\mathrm{R}_2\\right)}$\nSubstituting the values,\n$\\begin{aligned}\n& I_1=\\frac{12}{9+12} \\times 5 \\\\\n& I_1=2.85 \\mathrm{~A}\n\\end{aligned}$\nPotential difference between $P$ and $Q$ is\n$\\begin{aligned}\n& V=I_1 R \\\\\n& V=2.85 \\times 6 \\\\\n& V=17 V\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261f90279619d9d8a30cd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "Three point charges $+\\mathrm{q},+2 \\mathrm{q}$ and $+\\mathrm{Q}$ are placed at the three vertices of an equilateral triangle. If the potential energy of the system of three charges is zero, the value of $Q$ in terms of $q$ is", "image": null}, "options": [{"id": "iMSFH", "text": "$\\mathrm{Q}=-\\frac{2 \\mathrm{q}}{3}$", "image": null, "isCorrect": true}, {"id": "3VeuC", "text": "$\\mathrm{Q}=-\\frac{1}{3} \\mathrm{q}$", "image": null, "isCorrect": false}, {"id": "7hHaF", "text": "$\\mathrm{Q}=\\frac{3 \\mathrm{q}}{2}$", "image": null, "isCorrect": false}, {"id": "6SP5N", "text": "$\\mathrm{Q}=\\frac{\\mathrm{q}}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Potential energy due to $+\\mathrm{q}$ and $+2 \\mathrm{q}$,\n$$\nU_1=\\frac{K q(2 q)}{r}\n$$\n$\\therefore \\quad$ Potential energy due to $+\\mathrm{q}$ and $+\\mathrm{Q}$,\n$$\n\\mathrm{U}_2=\\frac{\\mathrm{KqQ}}{\\mathrm{r}}\n$$\n$\\therefore \\quad$ Potential energy due to $+\\mathrm{Q}$ and $+2 \\mathrm{q}$,\n$$\n\\mathrm{U}_3=\\frac{\\mathrm{KQ}(2 \\
