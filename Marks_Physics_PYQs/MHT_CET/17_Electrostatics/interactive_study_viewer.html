 null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{V}_{-\\mathrm{q}}=\\frac{1}{4 \\pi \\varepsilon_0} \\frac{(-\\mathrm{q})}{(\\mathrm{x}+\\mathrm{a})} \\\\ & \\mathrm{V}_{+\\mathrm{q}}=\\frac{1}{4 \\pi \\varepsilon_0} \\frac{(+\\mathrm{q})}{(\\mathrm{x}-\\mathrm{a})} \\\\ & \\therefore \\mathrm{V}_{\\mathrm{d}}=\\frac{1}{4 \\pi \\varepsilon_0} \\mathrm{q} \\frac{((\\mathrm{x}+\\mathrm{a})-(\\mathrm{x}-\\mathrm{a}))}{\\left(\\mathrm{x}^2-\\mathrm{a}^2\\right)}=\\frac{1}{2 \\pi \\varepsilon_0} \\frac{(\\mathrm{aq})}{\\left(\\mathrm{x}^2-\\mathrm{a}^2\\right)}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261270279619d9d8a2a3e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "An electric dipole of moment $\\overrightarrow{\\mathrm{p}}$. is lying along a uniform electric field $\\overrightarrow{\\mathrm{E}} \\cdot$ The work done in rotating the dipole through $90^{\\circ}$ is\n$\\left[\\sin 0^{\\circ}=\\cos 90^{\\circ}=0, \\cos 0^{\\circ}=\\sin 90^{\\circ}=1\\right]$", "image": null}, "options": [{"id": "YczoU", "text": "$\\mathrm{pE}$", "image": null, "isCorrect": true}, {"id": "tPtNG", "text": "$\\sqrt{2} \\mathrm{pE}$", "image": null, "isCorrect": false}, {"id": "sXI3Q", "text": "$\\mathrm{pE} / 2$", "image": null, "isCorrect": false}, {"id": "9NW1o", "text": "$3 p \\mathrm{p}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Work done $=\\Delta \\mathrm{pE}$\n$\\begin{aligned} & \\mathrm{pE}=-\\overrightarrow{\\mathrm{p}} \\overrightarrow{\\mathrm{E}} \\\\ & \\mathrm{pE}_{\\mathrm{f}}=0 \\\\ & \\mathrm{pE}_{\\mathrm{i}}=-\\mathrm{pE} \\\\ & \\Delta \\mathrm{pE}=\\mathrm{pE}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260390279619d9d8a22be", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "An electric dipole having dipole moment $\\mathrm{P}=\\mathrm{q} \\times 2 \\ell$ is placed in a uniform electric field ' $E$ '. The dipole moment is along the direction of the field. The force acting on it and its potential energy are respectively", "image": null}, "options": [{"id": "vTI00", "text": "$\\mathrm{qE}$ and minimum", "image": null, "isCorrect": false}, {"id": "hx0Sy", "text": "$\\mathrm{qE}$ and maximum", "image": null, "isCorrect": false}, {"id": "ZZT76", "text": "$2 \\mathrm{qE}$ and minimum", "image": null, "isCorrect": false}, {"id": "M7UNL", "text": "zero and minimum", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "A dipole has two equal and opposite charges. In a uniform electric field, the two charges will experience equal and opposite force, hence net force will be zero. The potential energy of an electric dipole is minimum in its stable equilibrium position $\\left(\\theta=0^{\\circ}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f1d0279619d9d8a19e2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}], "question": {"text": "The earth's atmosphere is divided into different layers. Out of these layers,\nionosphere consists of", "image": null}, "options": [{"id": "4wlZZ", "text": "only positive ions.", "image": null, "isCorrect": false}, {"id": "hD3pM", "text": "only neutral particles.", "image": null, "isCorrect": false}, {"id": "LQNea", "text": "only electrons.", "image": null, "isCorrect": false}, {"id": "mOEWD", "text": "electrons and positive ions.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "electron and positive ions", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f090279619d9d8a1947", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}], "question": {"text": "Which of the following molecules is a polar molecule?", "image": null}, "options": [{"id": "YyhSx", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/7079f8dc-f5ee-4140-84fe-301c03f5b875.png\">", "image": null, "isCorrect": false}, {"id": "rGnR6", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/859bbf78-9f52-4397-bf0e-8db68b66b44b.png\" style=\"width: 130px; height: 72px;\" />", "image": null, "isCorrect": false}, {"id": "d4sw0", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/02ec9530-df3e-4b39-b9f1-f12af84efade.png\">", "image": null, "isCorrect": false}, {"id": "roi26", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/2d1a3989-b505-4ed0-a3ca-471798368626.png\">", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "A polar molecular is a molecular containing polar bonds, where the sum of all the bonds dipole moment is not zero. <br/>In case of <math><msub><mrow><mi>H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi>O</mi></math> , the bonds are inclined at an angle, so the net dipole moment is non-zero. Hence, <math><msub><mrow><mi>H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi>O</mi></math> is a polar molecule while in all other cases the dipole moment are balanced, so the net moment is zero.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "65a263270279619d9d8a3c6e", "title": "Electric Flux and Gauss Law", "totalQuestions": 36, "questions": [{"_id": "6abb887d15a9fc0fc8c14433", "type": "singleCorrect", "question": {"text": "The electric flux entering and leaving an enclosed surface are $\\Phi_1$ and $\\Phi_2$ respectively. The electric charge inside the surface will be ($\\varepsilon_0$ = permittivity of vacuum)", "image": null}, "options": [{"id": "f1UPX", "label": "A", "text": "$\\dfrac{\\phi_2 - \\phi_1}{\\varepsilon_0}$", "isCorrect": false, "image": null}, {"id": "Wh0th", "label": "B", "text": "$\\dfrac{\\phi_1 + \\phi_2}{\\varepsilon_0}$", "isCorrect": false, "image": null}, {"id": "6FAYz", "label": "C", "text": "$\\varepsilon_0(\\phi_1 - \\phi_2)$", "isCorrect": false, "image": null}, {"id": "tcvc0", "label": "D", "text": "$\\varepsilon_0(\\phi_2 - \\phi_1)$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "According to Gauss's law, the net electric flux through a closed surface is equal to the net charge enclosed divided by $\\varepsilon_0$.<br><br>Net electric flux $\\Phi_{net} = \\Phi_{leaving} - \\Phi_{entering}$<br><br>Given that the flux entering is $\\phi_1$ and the flux leaving is $\\phi_2$.<br><br>$\\Phi_{net} = \\phi_2 - \\phi_1$<br><br>From Gauss's law, $\\Phi_{net} = \\dfrac{q_{enclosed}}{\\varepsilon_0}$<br><br>$\\phi_2 - \\phi_1 = \\dfrac{q_{enclosed}}{\\varepsilon_0}$<br><br>$q_{enclosed} = \\varepsilon_0(\\phi_2 - \\phi_1)$<br><br>Answer: $\\varepsilon_0(\\phi_2 - \\phi_1)$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3338c30a4553e1be13a", "type": "singleCorrect", "question": {"text": "The electric field in the region is $\\vec{E} = a\\hat{i} + b\\hat{j}$ where 'a' and 'b' are constants. The net electric flux passing through a square area of side 'l' parallel to Y-Z plane is", "image": null}, "options": [{"id": "hnhEF", "label": "A", "text": "$al$", "isCorrect": false, "image": null}, {"id": "jyXs8", "label": "B", "text": "$al^4$", "isCorrect": false, "image": null}, {"id": "VfVXq", "label": "C", "text": "$al^6$", "isCorrect": false, "image": null}, {"id": "uwlcw", "label": "D", "text": "$al^2$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The electric field is given as $\\vec{E} = a\\hat{i} + b\\hat{j}$.<br><br>The square area of side $l$ is parallel to the Y-Z plane. The area vector is perpendicular to the Y-Z plane, which is along the X-axis.<br><br>Therefore, the area vector is $\\vec{A} = l^2\\hat{i}$.<br><br>The electric flux $\\Phi$ passing through the area is given by the dot product of the electric field and the area vector:<br><br>$\\Phi = \\vec{E} \\cdot \\vec{A}$<br><br>$\\Phi = (a\\hat{i} + b\\hat{j}) \\cdot (l^2\\hat{i})$<br><br>$\\Phi = al^2$<br><br>Answer: $al^2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2de8c30a4553e1bddac", "type": "singleCorrect", "question": {"text": "For a uniformly charged plane sheet, the variation of electric field (E) with distance (d) is correctly shown graphically in graph<br><img style=\"width: 600px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/14_april_shift_2__q32_d1.png\" />", "image": null}, "options": [{"id": "xvfLh", "label": "A", "text": "A", "isCorrect": false, "image": null}, {"id": "BA2Ew", "label": "B", "text": "B", "isCorrect": false, "image": null}, {"id": "tUpPT", "label": "C", "text": "C", "isCorrect": true, "image": null}, {"id": "su0KS", "label": "D", "text": "D", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The electric field due to a uniformly charged infinite plane sheet is given by the formula:<br><br>$E = \\dfrac{\\sigma}{2\\epsilon_0}$<br><br>where $\\sigma$ is the surface charge density and $\\epsilon_0$ is the permittivity of free space.<br><br>From the formula, it is clear that the electric field $E$ is independent of the distance $d$ from the sheet. Therefore, the electric field remains constant as the distance varies.<br><br>Graphically, this is represented by a straight horizontal line parallel to the distance axis ($d$-axis). Graph (C) correctly shows this constant relationship.<br><br>Answer: C", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3178c30a4553e1be010", "type": "singleCorrect", "question": {"text": "The number of lines of force originating from a point charge of $2 \\times 8.85 \\times 10^{-9}$ C in a medium of dielectric constant $10$ is ($\\epsilon_0 = 8.85 \\times 10^{-12}$ SI unit)", "image": null}, "options": [{"id": "nUi3x", "label": "A", "text": "$100$", "isCorrect": false, "image": null}, {"id": "KTTMI", "label": "B", "text": "$200$", "isCorrect": true, "image": null}, {"id": "zmFpT", "label": "C", "text": "$400$", "isCorrect": false, "image": null}, {"id": "1G9IZ", "label": "D", "text": "$2000$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The number of lines of force originating from a charge $q$ in a medium of dielectric constant $K$ is given by Gauss's Law as $\\Phi = \\dfrac{q}{K \\epsilon_0}$.<br><br>Given:<br>$q = 2 \\times 8.85 \\times 10^{-9}$ C<br>$K = 10$<br>$\\epsilon_0 = 8.85 \\times 10^{-12}$ SI unit<br><br>Substituting the values:<br>$\\Phi = \\dfrac{2 \\times 8.85 \\times 10^{-9}}{10 \\times 8.85 \\times 10^{-12}}$<br><br>$\\Phi = \\dfrac{2 \\times 10^{-9}}{10^{-11}}$<br><br>$\\Phi = 200$<br><br>Answer: $200$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36c8c30a4553e1be392", "type": "singleCorrect", "question": {"text": "A charge 'Q' C is placed at the centre of a cube. The electric flux through two opposite faces of the cube is<br>($\\epsilon_0$ = permittivity of free space)", "image": null}, "options": [{"id": "ukJve", "label": "A", "text": "$\\dfrac{Q}{6\\epsilon_0}$", "isCorrect": false, "image": null}, {"id": "tn1Dd", "label": "B", "text": "$\\dfrac{Q}{3\\epsilon_0}$", "isCorrect": true, "image": null}, {"id": "HZDfJ", "label": "C", "text": "$\\dfrac{Q}{\\epsilon_0}$", "isCorrect": false, "image": null}, {"id": "YYX45", "label": "D", "text": "$\\dfrac{Q}{2\\epsilon_0}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Gauss's law, the total electric flux through the cube is $\\Phi_{total} = \\dfrac{Q}{\\epsilon_0}$<br><br>Since the charge is placed at the centre of the cube, the flux is symmetrically distributed across all six faces.<br><br>The electric flux through a single face is $\\Phi_{1} = \\dfrac{Q}{6\\epsilon_0}$<br><br>The electric flux through two opposite faces is $\\Phi_{2} = 2 \\times \\dfrac{Q}{6\\epsilon_0} = \\dfrac{Q}{3\\epsilon_0}$<br><br>Answer: $\\dfrac{Q}{3\\epsilon_0}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d35e8c30a4553e1be2fc", "type": "singleCorrect", "question": {"text": "If the radius of the spherical Gaussian surface is increased then the electric flux due to a point charge enclosed by the surface", "image": null}, "options": [{"id": "zoJ5x", "label": "A", "text": "increases", "isCorrect": false, "image": null}, {"id": "CoHZt", "label": "B", "text": "remains unchanged", "isCorrect": true, "image": null}, {"id": "R2PrS", "label": "C", "text": "is zero", "isCorrect": false, "image": null}, {"id": "sxzH7", "label": "D", "text": "decreases", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Gauss's law, the total electric flux through a closed surface is given by $\\Phi = \\dfrac{q_{enclosed}}{\\epsilon_0}$.<br><br>The electric flux depends only on the net charge enclosed by the surface and is independent of the size or shape of the Gaussian surface.<br><br>When the radius of the spherical Gaussian surface is increased, the charge enclosed by it remains the same.<br><br>Therefore, the electric flux remains unchanged.<br><br>Answer: remains unchanged", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf9bf9280d7f9932e28", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A charge is uniformly distributed on the surface of a spherical rubber balloon. As it is blown up, the total electric flux coming out of the surface", "image": null}, "options": [{"id": "mnmm1", "text": "decreases", "image": null, "isCorrect": false}, {"id": "uViQg", "text": "increases", "image": null, "isCorrect": false}, {"id": "odGgX", "text": "remains unchanged", "image": null, "isCorrect": true}, {"id": "EBy5S", "text": "becomes zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Gauss's law, the total electric flux through a closed surface is given by $\\Phi = \\dfrac{q_{enclosed}}{\\varepsilon_0}$.<br><br>As the spherical rubber balloon is blown up, its radius increases, but the total charge $q$ distributed on its surface remains constant.<br><br>Since the enclosed charge does not change, the total electric flux coming out of the surface remains unchanged.<br><br>Answer: remains unchanged", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf6bf9280d7f9932e09", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The electric flux through the surface\n\n<img width=300px src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/I99C2YEPXGKxLwlxB9WG5dpSkMv7KEf96WnivJVroc4.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "t8f1q", "text": "in figure (c) is the largest", "image": null, "isCorrect": false}, {"id": "DZCxd", "text": "in figure (b) is same as figure (c) but is smaller than figure (d)", "image": null, "isCorrect": false}, {"id": "H0EdZ", "text": "is the same for all the figures", "image": null, "isCorrect": true}, {"id": "4tJs6", "text": "in figure (d) is the least", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Gauss's law, the total electric flux $\\Phi$ through any closed surface is equal to the net charge enclosed by the surface divided by the permittivity of free space $\\varepsilon_0$.<br><br>Mathematically, $\\Phi = \\dfrac{q_{\\text{enclosed}}}{\\varepsilon_0}$<br><br>This implies that the electric flux through a closed surface depends only on the magnitude of the net charge enclosed within it and is completely independent of the shape or size of the surface.<br><br>In all the given figures (a), (b), (c), and (d), the closed surfaces enclose the same amount of charge, which is $+q$.<br><br>Therefore, the electric flux through all the surfaces will be the same, equal to $\\dfrac{q}{\\varepsilon_0}$.<br><br>Answer: is the same for all the figures", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b83bf9280d7f99329f0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The electric field intensity near a conducting surface having uniform surface charge density ' $\\sigma$ ' is given by ( $\\epsilon_0=$ permittivity of free space)", "image": null}, "options": [{"id": "Uqz0f", "text": "$\\frac{\\sigma}{\\epsilon_0}$ and is parallel to the surface", "image": null, "isCorrect": false}, {"id": "XK4bH", "text": "$\\frac{2 \\sigma}{\\epsilon_0}$ and is parallel to the surface", "image": null, "isCorrect": false}, {"id": "KQY52", "text": "$\\frac{\\sigma}{\\epsilon_0}$ and is normal to the surface", "image": null, "isCorrect": true}, {"id": "D2mMv", "text": "$\\frac{2 \\sigma}{\\epsilon_0}$ and is normal to the surface", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "By Gauss's law, the electric field intensity just outside a charged conducting surface is given by $E = \\dfrac{\\sigma}{\\epsilon_0}$.<br><br>In electrostatics, the electric field must be perpendicular to the surface of a conductor. If there were a component parallel to the surface, it would exert a force on the free charges and cause them to move, which violates the condition of electrostatic equilibrium.<br><br>Thus, the electric field is $\\dfrac{\\sigma}{\\epsilon_0}$ and is normal to the surface.<br><br>Answer: $\\frac{\\sigma}{\\epsilon_0}$ and is normal to the surface", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b77bf9280d7f9932980", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A charge $Q \\mu C$ is placed at the centre of a cube. The flux through two opposite faces of the cube is ( $\\epsilon_0=$ permittivity of free space)", "image": null}, "options": [{"id": "EISIZ", "text": "$\\frac{\\mathrm{Q}}{6 \\in_0}$", "image": null, "isCorrect": false}, {"id": "TEz02", "text": "$\\frac{\\mathrm{Q}}{3 \\epsilon_0}$", "image": null, "isCorrect": true}, {"id": "CB98E", "text": "$\\frac{\\mathrm{Q}}{\\epsilon_0}$", "image": null, "isCorrect": false}, {"id": "Tf22n", "text": "$\\frac{\\mathrm{Q}}{2 \\epsilon_0}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Total flux through the cube is given by Gauss's law as $\\Phi_{total} = \\dfrac{Q}{\\epsilon_0}$.<br><br>Since the charge is placed at the centre of the cube, the flux is distributed symmetrically across all six faces.<br><br>Flux through one face is $\\Phi_{1} = \\dfrac{Q}{6\\epsilon_0}$.<br><br>Flux through two opposite faces is $\\Phi_{2} = 2 \\times \\Phi_{1} = 2 \\times \\dfrac{Q}{6\\epsilon_0} = \\dfrac{Q}{3\\epsilon_0}$.<br><br>Answer: $\\frac{\\mathrm{Q}}{3 \\epsilon_0}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b64bf9280d7f99328c8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Five charges $2 \\mu \\mathrm{C},-3 \\mu \\mathrm{C}, 4 \\mu \\mathrm{C},-4 \\mu \\mathrm{C}$ and $-1 \\mu \\mathrm{C}$ are enclosed by the Gaussian surface of radius 2 m . The magnitude of the net outward flux through the Gaussian surface is (in $\\mu \\mathrm{V}-\\mathrm{m}$ ) $\\left[\\epsilon_0=\\right.$ permittivity of free space $]$", "image": null}, "options": [{"id": "UqfO0", "text": "$\\frac{2}{\\epsilon_0}$", "image": null, "isCorrect": true}, {"id": "kE1NK", "text": "zero", "image": null, "isCorrect": false}, {"id": "A2EZ4", "text": "$\\frac{3}{\\epsilon_0}$", "image": null, "isCorrect": false}, {"id": "RnprV", "text": "$\\frac{5}{\\epsilon_0}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Gauss's law, the net electric flux through a closed surface is given by $\\Phi = \\dfrac{q_{\\text{net}}}{\\epsilon_0}$.<br><br>The net charge enclosed by the Gaussian surface is the algebraic sum of all the charges inside it:<br><br>$q_{\\text{net}} = q_1 + q_2 + q_3 + q_4 + q_5$<br><br>Substituting the given values:<br><br>$q_{\\text{net}} = 2 \\mu\\mathrm{C} - 3 \\mu\\mathrm{C} + 4 \\mu\\mathrm{C} - 4 \\mu\\mathrm{C} - 1 \\mu\\mathrm{C}$<br><br>$q_{\\text{net}} = -2 \\mu\\mathrm{C}$<br><br>The magnitude of the net outward flux is:<br><br>$|\\Phi| = \\dfrac{|q_{\\text{net}}|}{\\epsilon_0} = \\dfrac{2 \\mu\\mathrm{C}}{\\epsilon_0}$<br><br>Thus, the magnitude of the flux in $\\mu\\mathrm{V}-\\mathrm{m}$ is $\\dfrac{2}{\\epsilon_0}$.<br><br>Answer: $\\frac{2}{\\epsilon_0}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b54bf9280d7f9932849", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The electric field intensity on the surface of a solid charged sphere of radius $r$ and volume charge density $\\sigma$ is ( $\\epsilon_0=$ permittivity of free space)", "image": null}, "options": [{"id": "W5iv8", "text": "zero", "image": null, "isCorrect": false}, {"id": "VeTVt", "text": "$\\frac{5 \\sigma r}{6 \\epsilon_0}$", "image": null, "isCorrect": false}, {"id": "lcCOO", "text": "$\\frac{1}{4 \\pi \\epsilon_0} \\frac{\\sigma}{r}$", "image": null, "isCorrect": false}, {"id": "x2WOZ", "text": "$\\frac{\\sigma r}{3 \\epsilon_0}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let the total charge on the solid sphere be $q$.<br><br>The volume of the sphere is $V = \\dfrac{4}{3} \\pi r^3$.<br><br>Since the volume charge density is given as $\\sigma$, the total charge is $q = \\sigma V = \\dfrac{4}{3} \\pi r^3 \\sigma$.<br><br>By Gauss's law, the electric field intensity on the surface of the sphere is given by $\\oint \\vec{E} \\cdot d\\vec{s} = \\dfrac{q}{\\epsilon_0}$.<br><br>$E (4 \\pi r^2) = \\dfrac{\\dfrac{4}{3} \\pi r^3 \\sigma}{\\epsilon_0}$<br><br>$E = \\dfrac{\\sigma r}{3 \\epsilon_0}$<br><br>Answer: $\\frac{\\sigma r}{3 \\epsilon_0}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b36bf9280d7f9932724", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A hollow cylinder has a charge ' $q$ ' coulomb at its centre. If ' $\\phi$ ' is the electric flux in unit of V-m associated with the curved surface C, the flux linked with the plane surface 'A' in unit of V-m will be\n$\\left[\\epsilon_0=\\right.$ permittivity of free space $]$\n\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/mkTZmQeOJ-MCYix6e-4pFsGJYrZvv9EBBStXGMeuP6Q.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "0ZZv2", "text": "$\\phi / 3$", "image": null, "isCorrect": false}, {"id": "OFATe", "text": "$\\left(\\frac{\\mathrm{q}}{\\epsilon_0}-\\phi\\right)$", "image": null, "isCorrect": false}, {"id": "We8KL", "text": "$\\frac{1}{2}\\left(\\frac{q}{\\epsilon_0}-\\phi\\right)$", "image": null, "isCorrect": true}, {"id": "V5PX5", "text": "$\\frac{q}{2 \\epsilon_0}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Gauss's law, the total electric flux through a closed surface enclosing a charge $q$ is given by:<br><br>$\\Phi_{\\text{total}} = \\dfrac{q}{\\epsilon_0}$<br><br>For the given hollow cylinder, the total flux is the sum of the flux through its three surfaces: the two plane circular surfaces (A and B) and the curved surface (C).<br><br>$\\Phi_{\\text{total}} = \\Phi_A + \\Phi_B + \\Phi_C$<br><br>Since the charge $q$ is placed exactly at the centre of the cylinder, the setup is symmetric with respect to the two plane surfaces A and B. Therefore, the flux through surface A is equal to the flux through surface B:<br><br>$\\Phi_A = \\Phi_B$<br><br>We are given that the flux through the curved surface C is $\\phi$:<br><br>$\\Phi_C = \\phi$<br><br>Substituting these into the total flux equation, we get:<br><br>$2\\Phi_A + \\phi = \\dfrac{q}{\\epsilon_0}$<br><br>$2\\Phi_A = \\dfrac{q}{\\epsilon_0} - \\phi$<br><br>$\\Phi_A = \\dfrac{1}{2}\\left(\\dfrac{q}{\\epsilon_0} - \\phi\\right)$<br><br>Answer: $\\frac{1}{2}\\left(\\frac{q}{\\epsilon_0}-\\phi\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b21bf9280d7f9932686", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A hollow cylinder has a charge of ' $q$ ' $C$ at its centre. If $\\phi$ is the electric flux associated with the curved surface B, the flux linked with the plane surface $A$ will be\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/x6MVfYgdz-D7sso6Bb3RvH966PAMmWCyITKYHhtDRCg.original.fullsize_2.png\">", "image": null}, "options": [{"id": "22bcO", "text": "$\\frac{\\phi}{3}$", "image": null, "isCorrect": false}, {"id": "4OzbE", "text": "$\\frac{\\mathrm{q}}{\\epsilon_0}-\\phi$", "image": null, "isCorrect": false}, {"id": "8OBl2", "text": "$\\frac{q}{3 \\epsilon_0}$", "image": null, "isCorrect": false}, {"id": "TCbkX", "text": "$\\frac{1}{2}\\left(\\frac{q}{\\epsilon_0}-\\phi\\right)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Gauss's Law, the total electric flux through a closed surface enclosing a charge $q$ is given by:<br><br>$\\Phi_{\\text{total}} = \\dfrac{q}{\\epsilon_0}$<br><br>The total flux through the hollow cylinder is the sum of the fluxes through its three surfaces: the two plane surfaces A and C, and the curved surface B.<br><br>$\\Phi_{\\text{total}} = \\Phi_A + \\Phi_B + \\Phi_C$<br><br>Since the charge $q$ is placed exactly at the centre of the cylinder, the setup is symmetric with respect to the two plane ends. Therefore, the flux linked with surface A is equal to the flux linked with surface C:<br><br>$\\Phi_A = \\Phi_C$<br><br>We are given that the flux associated with the curved surface B is $\\phi$, so $\\Phi_B = \\phi$. Substituting these into the total flux equation, we get:<br><br>$\\Phi_A + \\phi + \\Phi_A = \\dfrac{q}{\\epsilon_0}$<br><br>$2\\Phi_A + \\phi = \\dfrac{q}{\\epsilon_0}$<br><br>$2\\Phi_A = \\dfrac{q}{\\epsilon_0} - \\phi$<br><br>$\\Phi_A = \\dfrac{1}{2}\\left(\\dfrac{q}{\\epsilon_0} - \\phi\\right)$<br><br>Answer: $\\frac{1}{2}\\left(\\frac{q}{\\epsilon_0}-\\phi\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b0bbf9280d7f99325e6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A uniformly charged conducting sphere of diameter 3.5 cm has a surface charge density of $20 \\mu \\mathrm{C} \\mathrm{m}^{-2}$. The total electric flux leaving the surface of the sphere is nearly\n[permittivity of free space, $\\epsilon_0=8.85 \\times 10^{-12} \\mathrm{SI}$ unit]", "image": null}, "options": [{"id": "rBgDu", "text": "\\(7 \\times 10^2 \\mathrm{~N} \\cdot \\mathrm{~m}^2 / \\mathrm{C}\\)", "image": null, "isCorrect": false}, {"id": "l45Yy", "text": "\\(7.0 \\times 10^3 \\mathrm{~N} \\cdot \\mathrm{~m}^2 / \\mathrm{C}\\)", "image": null, "isCorrect": false}, {"id": "EWFtT", "text": "\\(8.7 \\times 10^2 \\mathrm{~N} \\cdot \\mathrm{~m}^2 / \\mathrm{C}\\)", "image": null, "isCorrect": false}, {"id": "FQE1D", "text": "\\(8.7 \\times 10^3 \\mathrm{~N} \\cdot \\mathrm{~m}^2 / \\mathrm{C}\\)", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Radius of the sphere, $r = \\dfrac{3.5}{2} \\text{ cm} = 1.75 \\times 10^{-2} \\text{ m}$<br><br>Surface area, $A = 4\\pi r^2 = 4 \\times \\dfrac{22}{7} \\times (1.75 \\times 10^{-2})^2 = 3.85 \\times 10^{-3} \\text{ m}^2$<br><br>Total charge, $q = \\sigma A = 20 \\times 10^{-6} \\times 3.85 \\times 10^{-3} = 7.7 \\times 10^{-8} \\text{ C}$<br><br>By Gauss's law, the total flux leaving the surface is<br><br>$\\phi = \\dfrac{q}{\\epsilon_0} = \\dfrac{7.7 \\times 10^{-8}}{8.85 \\times 10^{-12}} = 8.7 \\times 10^{3} \\text{ N m}^2 \\text{ C}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214400aee93fa0796df2c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "A hollow cylinder has charge ' $q$ ' $C$ at its centre. If ' $\\phi$ ' is the electric flux associated with the curved surface B , the flux linked with the plane surface A will be\r\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/TAsv1sqzglJZ-ECHnJ2QL9FkdRCnOCUB0WMhDH1_2Gs.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "Azowy", "text": "$\\frac{1}{2}\\left(\\frac{q}{\\varepsilon_0}-\\phi\\right)$", "image": null, "isCorrect": true}, {"id": "VNazg", "text": "$\\frac{q}{2 \\varepsilon_0}$", "image": null, "isCorrect": false}, {"id": "674Wa", "text": "$\\frac{\\phi}{3}$", "image": null, "isCorrect": false}, {"id": "q9drR", "text": "$\\frac{q}{\\varepsilon_0}-\\phi$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Gauss's law, the total electric flux through a closed surface enclosing a charge $q$ is given by:<br><br>$\\Phi_{\\text{total}} = \\dfrac{q}{\\varepsilon_0}$<br><br>The closed cylinder consists of three surfaces: two plane circular surfaces (A and C) and one curved surface (B). The total flux is the sum of the fluxes through these three surfaces:<br><br>$\\Phi_{\\text{total}} = \\Phi_A + \\Phi_B + \\Phi_C$<br><br>Since the charge $q$ is placed exactly at the centre of the cylinder, the arrangement is symmetric with respect to the two plane surfaces. Therefore, the electric flux through surface A is equal to the electric flux through surface C:<br><br>$\\Phi_A = \\Phi_C$<br><br>We are given that the flux associated with the curved surface B is $\\phi$:<br><br>$\\Phi_B = \\phi$<br><br>Substituting these values into the total flux equation, we get:<br><br>$\\dfrac{q}{\\varepsilon_0} = \\Phi_A + \\phi + \\Phi_A$<br><br>$\\dfrac{q}{\\varepsilon_0} = 2\\Phi_A + \\phi$<br><br>Solving for the flux linked with the plane surface A ($\\Phi_A$):<br><br>$2\\Phi_A = \\dfrac{q}{\\varepsilon_0} - \\phi$<br><br>$\\Phi_A = \\dfrac{1}{2}\\left(\\dfrac{q}{\\varepsilon_0} - \\phi\\right)$<br><br>Answer: $\\frac{1}{2}\\left(\\frac{q}{\\varepsilon_0}-\\phi\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792140a0aee93fa0796dd7f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "Consider a long uniformly charged cylinder having constant volume charge density ' $\\lambda$ ' and radius ' $R$ '. A Gaussian surface is in the form of a cylinder of radius ' $r$ ' such that vertical axis of both the cylinders coincide. For a point inside the cylinder $(r \\lt R)$, electric field is directly proportional to", "image": null}, "options": [{"id": "NvLPm", "text": "$\\mathrm{r}^{-1}$", "image": null, "isCorrect": false}, {"id": "D8YEY", "text": "r", "image": null, "isCorrect": true}, {"id": "oLbsK", "text": "$\\mathrm{r}^2$", "image": null, "isCorrect": false}, {"id": "XDdgv", "text": "$\\mathrm{r}^{-2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the volume charge density of the cylinder be $\\lambda$.<br><br>Consider a Gaussian cylinder of radius $r$ and length $L$ coaxial with the charged cylinder, where $r < R$.<br><br>The charge enclosed by the Gaussian surface is:<br>$q_{\\text{enclosed}} = \\text{Volume} \\times \\text{Volume charge density} = (\\pi r^2 L) \\lambda$<br><br>According to Gauss's law:<br>$\\oint \\vec{E} \\cdot d\\vec{A} = \\dfrac{q_{\\text{enclosed}}}{\\epsilon_0}$<br><br>The electric flux through the curved surface of the Gaussian cylinder is:<br>$E (2\\pi r L) = \\dfrac{\\lambda \\pi r^2 L}{\\epsilon_0}$<br><br>$E = \\dfrac{\\lambda r}{2\\epsilon_0}$<br><br>Therefore, the electric field $E$ inside the cylinder is directly proportional to $r$.<br><br>Answer: r", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213a70aee93fa0796da7d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "The electric flux over a sphere of radius ' $r$ ' is ' $\\phi$ '. If the radius of the sphere is doubled without changing the charge, the flux will be", "image": null}, "options": [{"id": "x1M5M", "text": "$4 \\phi$", "image": null, "isCorrect": false}, {"id": "0fjhj", "text": "$2 \\phi$", "image": null, "isCorrect": false}, {"id": "HZzul", "text": "$\\phi$", "image": null, "isCorrect": true}, {"id": "ywAIP", "text": "$\\dfrac{\\phi}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Gauss's law, the total electric flux through a closed surface is given by $\\phi = \\dfrac{q_{enclosed}}{\\epsilon_0}$.<br><br>The electric flux depends only on the net charge enclosed by the surface and is independent of the shape or size of the surface.<br><br>Since the charge enclosed remains unchanged when the radius of the sphere is doubled, the electric flux will remain the same, i.e., $\\phi$.<br><br>Answer: $\\phi$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213960aee93fa0796d9f5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "If the electric flux entering and leaving an enclosed surface is $\\phi_1$ and $\\phi_2$ then charge enclosed in the surface is ( $\\varepsilon_0=$ permittivity of free space)", "image": null}, "options": [{"id": "xZiaD", "text": "$\\dfrac{\\phi_2-\\phi_1}{\\varepsilon_0}$", "image": null, "isCorrect": false}, {"id": "ozgds", "text": "$\\dfrac{\\phi_2+\\phi_1}{\\varepsilon_0}$", "image": null, "isCorrect": false}, {"id": "c3GT8", "text": "$\\dfrac{\\phi_1-\\phi_2}{\\varepsilon_0}$", "image": null, "isCorrect": false}, {"id": "NNNMP", "text": "$\\varepsilon_0\\left(\\phi_2-\\phi_1\\right)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Gauss's law, the net electric flux through a closed surface is equal to the net charge enclosed divided by the permittivity of free space $\\varepsilon_0$.<br><br>Net flux $\\phi_{net} = \\phi_{leaving} - \\phi_{entering}$<br><br>Given that the flux entering is $\\phi_1$ and the flux leaving is $\\phi_2$.<br><br>$\\phi_{net} = \\phi_2 - \\phi_1$<br><br>By Gauss's law, $\\phi_{net} = \\dfrac{q_{enclosed}}{\\varepsilon_0}$<br><br>$\\phi_2 - \\phi_1 = \\dfrac{q_{enclosed}}{\\varepsilon_0}$<br><br>$q_{enclosed} = \\varepsilon_0 (\\phi_2 - \\phi_1)$<br><br>Answer: $\\varepsilon_0\\left(\\phi_2-\\phi_1\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213830aee93fa0796d95c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "If the electric flux entering and leaving an enclosed surface are $\\phi_1$ and $\\phi_2$ respectively, the electric charge inside the surface will be", "image": null}, "options": [{"id": "pGaEP", "text": "$\\dfrac{\\phi_2-\\phi_1}{\\varepsilon_0}$", "image": null, "isCorrect": false}, {"id": "KWtYn", "text": "$\\dfrac{\\phi_1+\\phi_2}{\\varepsilon_0}$", "image": null, "isCorrect": false}, {"id": "6Poth", "text": "$\\varepsilon_0\\left(\\phi_1-\\phi_2\\right)$", "image": null, "isCorrect": false}, {"id": "eEFbP", "text": "$\\varepsilon_0\\left(\\phi_2-\\phi_1\\right)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "By convention, the electric flux entering a closed surface is considered negative, and the flux leaving the surface is considered positive.<br><br>Given that the flux entering is $\\phi_1$ and the flux leaving is $\\phi_2$, the net electric flux through the enclosed surface is:<br><br>$\\Phi_{net} = \\phi_2 - \\phi_1$<br><br>According to Gauss's law, the net electric flux through a closed surface is equal to the net charge enclosed divided by the permittivity of free space $\\varepsilon_0$:<br><br>$\\Phi_{net} = \\dfrac{q_{enclosed}}{\\varepsilon_0}$<br><br>Substituting the value of net flux:<br><br>$\\phi_2 - \\phi_1 = \\dfrac{q_{enclosed}}{\\varepsilon_0}$<br><br>$q_{enclosed} = \\varepsilon_0(\\phi_2 - \\phi_1)$<br><br>Answer: $\\varepsilon_0\\left(\\phi_2-\\phi_1\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213800aee93fa0796d943", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "A spherical rubber balloon carries a charge, uniformly distributed over the surface. As the balloon is blown up and increases in size, the total electric flux coming out the surface", "image": null}, "options": [{"id": "0STCH", "text": "becomes zero", "image": null, "isCorrect": false}, {"id": "AKTih", "text": "decreases", "image": null, "isCorrect": false}, {"id": "5xZZq", "text": "increases", "image": null, "isCorrect": false}, {"id": "zKqXE", "text": "remains unchanged", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Gauss's law, the total electric flux through a closed surface is given by $\\Phi = \\dfrac{q_{enclosed}}{\\varepsilon_0}$.<br><br>As the balloon is blown up, the total charge $q$ on its surface remains constant.<br><br>Since the enclosed charge does not change, the total electric flux coming out of the surface remains unchanged.<br><br>Answer: remains unchanged", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792137f0aee93fa0796d93f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "Two surfaces $A$ and $B$ are enclosing the charges as shown below. The total normal electric induction (T.N.E.I) through the surfaces A and B are respectively.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/irdB-mnVbGw-YoK1S-8EoXILFzuOHRF_o1fnP0PGLrA.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "Tfm9u", "text": "$+2 q$ and $+2 q$", "image": null, "isCorrect": false}, {"id": "g5hCg", "text": "$+q$ and $+3 q$", "image": null, "isCorrect": false}, {"id": "PdfVF", "text": "$+q$ and $+2 q$", "image": null, "isCorrect": true}, {"id": "jNbI7", "text": "$+2 q$ and $+3 q$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Gauss's law, the total normal electric induction (T.N.E.I) over a closed surface is equal to the net charge enclosed by the surface.<br><br>For surface A, the enclosed charges are $+2q$ and $-q$.<br>Net charge enclosed by surface A $= +2q - q = +q$.<br>Therefore, T.N.E.I through surface A is $+q$.<br><br>For surface B, the enclosed charges are $+3q$ and $-q$.<br>Net charge enclosed by surface B $= +3q - q = +2q$.<br>Therefore, T.N.E.I through surface B is $+2q$.<br><br>Hence, the T.N.E.I through surfaces A and B are $+q$ and $+2q$ respectively.<br><br>Answer: $+q$ and $+2 q$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213240aee93fa0796d67b", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "The electrostatic potential inside a charged spherical ball is given by $V=a r^2+\\mathrm{b}$ where ' r ' is the distance from its centre and ' $a$ ' and ' $b$ ' are constants. The volume charge density of the ball is $\\left[\\varepsilon_0=\\right.$ permittivity of free space]", "image": null}, "options": [{"id": "bW2g1", "text": "$-24 \\pi \\mathrm{a} \\varepsilon_0 \\mathrm{r}$", "image": null, "isCorrect": false}, {"id": "o3T8Z", "text": "$-6 \\mathrm{a} \\varepsilon_0 \\mathrm{r}$", "image": null, "isCorrect": false}, {"id": "fB2RL", "text": "$-24 \\pi \\mathrm{a} \\varepsilon_0$", "image": null, "isCorrect": false}, {"id": "Kdwiw", "text": "$-6 a \\varepsilon_0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The relation between electrostatic potential and volume charge density is given by Poisson's equation:<br><br>$\\nabla^2 V = -\\dfrac{\\rho}{\\varepsilon_0}$<br><br>In spherical coordinates, for a potential depending only on $r$, the Laplacian is:<br><br>$\\nabla^2 V = \\dfrac{1}{r^2} \\dfrac{d}{dr} \\left( r^2 \\dfrac{dV}{dr} \\right)$<br><br>Given $V = a r^2 + b$, we find the first derivative:<br><br>$\\dfrac{dV}{dr} = 2ar$<br><br>Substituting this into the Laplacian:<br><br>$\\nabla^2 V = \\dfrac{1}{r^2} \\dfrac{d}{dr} (r^2 \\cdot 2ar) = \\dfrac{1}{r^2} \\dfrac{d}{dr} (2ar^3)$<br><br>$\\nabla^2 V = \\dfrac{1}{r^2} (6ar^2) = 6a$<br><br>Using Poisson's equation:<br><br>$6a = -\\dfrac{\\rho}{\\varepsilon_0}$<br><br>$\\rho = -6a\\varepsilon_0$<br><br>Answer: $-6 a \\varepsilon_0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213230aee93fa0796d674", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "A uniformly charged conducting sphere of diameter 14 cm has surface charge density of $40 \\mu \\mathrm{Cm}^{-2}$. The total electric flux leaving the surface of the sphere is nearly (Permittivity of free space $=8.85 \\times 10^{-12}$ SI unit )", "image": null}, "options": [{"id": "nbDba", "text": "40 kV·m", "image": null, "isCorrect": false}, {"id": "GHQgB", "text": "140 kV·m", "image": null, "isCorrect": false}, {"id": "Wbsx1", "text": "240 kV·m", "image": null, "isCorrect": false}, {"id": "AU9xK", "text": "280 kV·m", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Radius of the sphere, $R = \\dfrac{14}{2} \\text{ cm} = 0.07 \\text{ m}$<br><br>Surface area of the sphere, $A = 4 \\pi R^2 = 4 \\times \\dfrac{22}{7} \\times (0.07)^2 = 0.0616 \\text{ m}^2$<br><br>Total charge on the sphere, $q = \\sigma A = 40 \\times 10^{-6} \\times 0.0616 = 2.464 \\times 10^{-6} \\text{ C}$<br><br>According to Gauss's law, the total electric flux leaving the surface is:<br><br>$\\Phi = \\dfrac{q}{\\varepsilon_0} = \\dfrac{2.464 \\times 10^{-6}}{8.85 \\times 10^{-12}}$<br><br>$\\Phi \\approx 2.78 \\times 10^5 \\text{ V m} = 278 \\text{ kV m}$<br><br>The closest value is $280 \\text{ kV m}$.<br><br>Answer: 280 kV·m", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261810279619d9d8a2d1d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "If the radius of the spherical Gaussian surface is increased then the electric flux due to a point charge enclosed by the surface", "image": null}, "options": [{"id": "nHHEr", "text": "remains unchanged", "image": null, "isCorrect": true}, {"id": "CyFaJ", "text": "zero", "image": null, "isCorrect": false}, {"id": "G2jNH", "text": "increases", "image": null, "isCorrect": false}, {"id": "FWsc0", "text": "decreases", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Flux depends on the charge enclosed. Therefore, size of the Gaussian sphere would not affect the net flux.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261280279619d9d8a2a49", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "A spherical rubber balloon carries a charge, uniformly distributed over the surface. As the balloon is blown up and increases in size, the total electric flux coming out of the surface", "image": null}, "options": [{"id": "Ohd9M", "text": "Becomes zero", "image": null, "isCorrect": false}, {"id": "ODk7y", "text": "Increases", "image": null, "isCorrect": false}, {"id": "1gZvN", "text": "Decreases", "image": null, "isCorrect": false}, {"id": "ssONG", "text": "Remains unchanged", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Total electric flux through the surface $=\\frac{\\mathrm{q}}{\\varepsilon_0}$.\nAs charge remains unchanged when size of balloon increases, electric flux through the surface remains unchanged.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261280279619d9d8a2a43", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "A charge Q is enclosed by a Gaussian surface of radius $R$. If the radius is doubled then the outward electric flux will", "image": null}, "options": [{"id": "jCoA3", "text": "be reduced to half", "image": null, "isCorrect": false}, {"id": "3Ivrp", "text": "be doubled", "image": null, "isCorrect": false}, {"id": "PD7RJ", "text": "remain the same", "image": null, "isCorrect": true}, {"id": "f3pI4", "text": "increase four times", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We know from Gauss's law that the electric flux through any closed spherical surface is given by\n$\\phi=\\frac{\\mathrm{q}_{\\text {enclosed. }}}{\\varepsilon_0}$\nSo electric flux is independent of the radius of the closed surface and only depends on the charge enclosed.\nTherefore if the radius of Gaussian spherical surface is doubled then there will be no effect on flux and the outward electric flux will remain the same.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261030279619d9d8a291c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "The electric flux linked with the closed surface in $\\mathrm{Nm}^2 \\mathrm{C}^{-1}$ is\n$\\left(\\varepsilon_0=8.85 \\times 10^{-12} \\mathrm{C}^2 \\mathrm{~N}^{-1} \\mathrm{~m}^{-2}\\right)$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/GaeAfvZsNWNGRt9ZGFMhip7rO2MJDLd0CQrjMWgv8kI.original.fullsize.png\">", "image": null}, "options": [{"id": "Dt9li", "text": "$10^{12}$", "image": null, "isCorrect": true}, {"id": "1CmQV", "text": "$8.85 \\times 10^{-13}$", "image": null, "isCorrect": false}, {"id": "FcDRm", "text": "$10^{10}$", "image": null, "isCorrect": false}, {"id": "OwB6B", "text": "$10^{11}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Electric flux, $\\phi=\\frac{q}{\\varepsilon_0}$\nwhere $q=$ total charge enclosed by closed surface\n$q=(2.35+5+2-0.5) C$\n$q=(2.35+5+2-0.5) \\mathrm{C}$\n$\\phi=\\frac{q}{\\varepsilon_0}=\\frac{8.85 \\mathrm{C}}{8.85 \\times 10^{-12} \\mathrm{C}^2 \\mathrm{~N}^{-1} \\mathrm{~m}^{-2}}=10^{12} \\mathrm{Nm}^2 / \\mathrm{C}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261020279619d9d8a2911", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "A charge $Q \\mathrm{C}$ is placed at the center of a cube. If $\\varepsilon_0$ is the permittivity of vacuum then the flux through one face and two opposite faces of the cube is respectively", "image": null}, "options": [{"id": "cPLpF", "text": "$\\frac{Q}{6 \\epsilon_0}, \\frac{Q}{3 \\epsilon_0}$", "image": null, "isCorrect": true}, {"id": "ICKrG", "text": "$\\frac{Q}{3 \\epsilon_0}, \\frac{Q}{2 \\epsilon_0}$", "image": null, "isCorrect": false}, {"id": "MFOYp", "text": "$\\frac{Q}{12 \\epsilon_0}, \\frac{Q}{6 \\epsilon_0}$", "image": null, "isCorrect": false}, {"id": "JNwMi", "text": "$\\frac{Q}{\\epsilon_0}, \\frac{Q}{2 \\epsilon_0}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A charge $Q \\mathrm{C}$ is placed at the center of a cube.\nTotal flux radiated $=\\frac{Q}{\\varepsilon_0}$\n$\\therefore$ from one face would be $\\frac{Q}{6 \\varepsilon_0}$ due to the six-fold symmetry of the cube.\nAnd from two opposite faces, it would be $\\frac{Q}{3 \\varepsilon_0}$ due to three-fold symmetry.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260dc0279619d9d8a27e0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}], "question": {"text": "A hollow cylinder has a charge $q$ coulomb within it. If $\\phi$ is the electric flux associated with the surface $B$, the flux linked with the plane surface A will be\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/bK2MjvG0YKpVfCePzrARxXWanLePNw_l3G_BoXOwwYE.original.fullsize.png\">", "image": null}, "options": [{"id": "wzBjW", "text": "$\\frac{\\phi}{2}$", "image": null, "isCorrect": false}, {"id": "ymIG2", "text": "$\\frac{\\phi}{\\epsilon_0}-\\phi$", "image": null, "isCorrect": false}, {"id": "5e9Ot", "text": "$\\frac{1}{2}\\left(\\frac{\\mathrm{q}}{\\epsilon_0}-\\phi\\right)$", "image": null, "isCorrect": true}, {"id": "xc2HK", "text": "$\\frac{q}{2 \\epsilon_0}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The correct option is (C).\nConcept: Gauss Law: Net flux through an enclosing surface is proportional to the charge inside, or $\\phi_{\\mathrm{T}}=\\frac{\\mathrm{q}}{\\varepsilon_0}$, where $\\mathrm{q}$ is the charge inside, $\\varepsilon_0$ the free permitivity of the space and $\\phi_{\\mathrm{T}}$ is the total flux\nThe flux associated with the lateral surface B is $\\phi$. Due to symmetry of the system, the flux associated with surface A should be the same as surface $\\mathrm{C}$. Let the flux associated with the surface A be $\\phi_0$.\nTherefore, the total flux is $\\phi_0+\\phi+\\phi_0=\\frac{q}{\\varepsilon_0}$\nSo, the flux associated with the surface $A$ is $\\phi_0=\\frac{1}{2}\\left(\\frac{q}{\\epsilon_0}-\\phi\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260330279619d9d8a2292", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "A spherical conducting shell of inner radius ' $r_1$ ' and outer radius ' $r_2$ ' has a charge ' $Q$ '. A charge $-q$ is placed at the center of the shell. The surface charge density on the inner and outer surface of the shell will be\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/s4HqHRIoJ9iJ65Ai0o_0fKyjRglqjLNeVKSiBYyz2FY.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "ZEvwU", "text": "$\\frac{\\mathrm{q}}{4 \\pi \\mathrm{r}_1^2}$ and $\\frac{\\mathrm{Q}-\\mathrm{q}}{4 \\pi \\mathrm{r}_2^2}$", "image": null, "isCorrect": true}, {"id": "5491Y", "text": "$\\frac{\\mathrm{q}}{4 \\pi \\mathrm{r}_1^2}$ and $\\frac{\\mathrm{Q}}{4 \\pi \\mathrm{r}_2^2}$", "image": null, "isCorrect": false}, {"id": "HX5kM", "text": "$\\frac{-\\mathrm{q}}{4 \\pi \\mathrm{r}_1^2}$ and $\\frac{\\mathrm{Q}+\\mathrm{q}}{4 \\pi \\mathrm{r}_2^2}$", "image": null, "isCorrect": false}, {"id": "K6rpX", "text": "zero and $\\frac{\\mathrm{Q}-\\mathrm{q}}{4 \\pi \\mathrm{r}_2^2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Due to charge $-q$ at the center of the shell, a charge $q$ will be induced on the inner surface and $-q$ on the outer surface. The charge on outer surface will become $Q-q$. Hence surface charge densities will be $\\frac{\\mathrm{q}}{4 \\pi \\mathrm{r}_1^2}$ and $\\frac{\\mathrm{Q}-\\mathrm{q}}{4 \\pi \\mathrm{r}_2^2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ffc0279619d9d8a20d4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "A charge 'Q' $\\mu$ C is placed at the centre of a cube. The flux through one face and two\nopposite faces of the cube is respectively", "image": null}, "options": [{"id": "KY3Nc", "text": "$\\frac{\\mathrm{Q}}{6 \\epsilon_{0}} \\mu \\mathrm{Vm}, \\quad \\frac{\\mathrm{Q}}{3 \\epsilon_{0}} \\mu \\mathrm{Vm}$", "image": null, "isCorrect": true}, {"id": "q30su", "text": "$\\frac{\\mathrm{Q}}{12 \\epsilon_{0}} \\mu \\mathrm{Vm}, \\quad \\frac{\\mathrm{Q}}{\\epsilon_{0}} \\mu \\mathrm{Vm}$", "image": null, "isCorrect": false}, {"id": "vOD4N", "text": "$\\frac{\\mathrm{Q}}{6 \\epsilon_{0}} \\mu \\mathrm{Vm}, \\quad \\frac{\\mathrm{Q}}{2 \\epsilon_{0}} \\mu \\mathrm{Vm}$", "image": null, "isCorrect": false}, {"id": "dIohZ", "text": "$\\frac{\\mathrm{Q}}{12 \\epsilon_{0}} \\mu \\mathrm{Vm}, \\quad \\frac{\\mathrm{Q}}{3 \\epsilon_{0}} \\mu \\mathrm{Vm}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "By using Gauss's Law.\nIt is given as\n$\\Phi=\\oint \\vec{E} \\cdot d \\vec{s}=\\frac{q}{\\epsilon_{0}}$\nNow, the flux passing through all the six surfaces would be\n$\\Phi=6 \\phi=\\frac{q}{\\epsilon_{0}}$\nAnd the flux passing through each surface would be\n$\\phi=\\frac{q}{6 \\in_{0}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fd70279619d9d8a1fac", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "If the radius of the spherical Gaussian surface is increased then the electric flux\ndue to a pooint charge enclosed by the surface", "image": null}, "options": [{"id": "1ls4p", "text": "decreases.", "image": null, "isCorrect": false}, {"id": "Y6F2d", "text": "remains unchanged.", "image": null, "isCorrect": true}, {"id": "QNYZS", "text": "increases.", "image": null, "isCorrect": false}, {"id": "iyGi1", "text": "is zero.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(A)\nFlux depends on the charge enclosed.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fc50279619d9d8a1f1d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "A spherical rubber balloon carries a charge, uniformly distributed over the size, the total electric flux wrface. As the balloon coming out of the surface", "image": null}, "options": [{"id": "cfI1d", "text": "decreases.", "image": null, "isCorrect": false}, {"id": "2eB1f", "text": "remains unchanged.", "image": null, "isCorrect": true}, {"id": "m03xT", "text": "increases.", "image": null, "isCorrect": false}, {"id": "AmtzP", "text": "becomes zero.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "remains unchanged", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f690279619d9d8a1c3f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}], "question": {"text": "An air filled parallel plate capacitor has a uniform electric field 'E' in the space between the plates. If the distance between the plates is 'd' and area of each plate is ' $A^{\\prime}$, the energy stored in the capacitor is $\\left(\\epsilon_{0}=\\right.$ permittivity of free space)", "image": null}, "options": [{"id": "YQL4y", "text": "$\\frac{1}{2} \\in_{0} \\mathrm{E}^{2} \\mathrm{Ad}$", "image": null, "isCorrect": true}, {"id": "wI9Tk", "text": "$\\mathrm{E}^{2} \\frac{\\mathrm{Ad}}{\\epsilon_{0}}$", "image": null, "isCorrect": false}, {"id": "cVBj1", "text": "$\\frac{1}{2} \\in_{0} \\mathrm{E}^{2}$", "image": null, "isCorrect": false}, {"id": "a8iFF", "text": "$\\mathrm{E}_{0} \\mathrm{E} \\mathrm{Ad}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Energy per unit volume in an electric field is\n$U=\\frac{1}{2} \\epsilon_{\\mathrm{o}} E^{2}$\nVolume of the space between the plates is $=\\mathrm{Ad}$\n$\\therefore$ Energy stored in the electric field $=\\frac{1}{2} \\epsilon_{0} E^{2} \\mathrm{Ad}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e3d0279619d9d8a12d8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "A standing wave having 3 nodes and 2 antinodes is formed between two atoms having a distance $1.21 Å$ Å between them. The wavelength of the standing wave is", "image": null}, "options": [{"id": "80rKl", "text": "$1.21 Å$", "image": null, "isCorrect": true}, {"id": "efK0R", "text": "$1.42 Å$", "image": null, "isCorrect": false}, {"id": "xLfcu", "text": "$6.05 Å$", "image": null, "isCorrect": false}, {"id": "17hs9", "text": "$3.63 Å$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Key Idea The given standing wave has 2 segments.\n\nThe given standing wave is shown in the figure.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/P2GZk5iDdg41rwZGa8RRUdBUlumqPHhyicWeCw5uNo4.original.fullsize.png\"><br>\nAs length of one loop or segment is $\\frac{\\lambda}{2}$, so length of 2 segments is $2\\left(\\frac{\\lambda}{2}\\right)$. $\\therefore \\quad 2 \\frac{\\lambda}{2}=1.21 Å$\n$\\Rightarrow \\quad \\lambda=1.21 Å$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
