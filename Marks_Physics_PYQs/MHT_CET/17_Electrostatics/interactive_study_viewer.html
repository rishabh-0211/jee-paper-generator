  <script>
    const data = {"index": 17, "chapterId": "61c089968f11857e2cc22ac4", "chapter": "Electrostatics", "exam": "MHT CET", "subject": "Physics", "totalTopics": 5, "totalQuestions": 228, "downloadTime": "2026-10-08 20:34:53", "topics": [{"index": 1, "topicId": "65a263270279619d9d8a3c72", "title": "Electric Charge and Coulomb's law", "totalQuestions": 50, "questions": [{"_id": "6abb889a15a9fc0fc8c14543", "type": "singleCorrect", "question": {"text": "Three concentric metallic spherical shells of radii $R$, $3R$ and $9R$ are given charges $Q_1$, $Q_2$ and $Q_3$, respectively. It is found that surface charge densities on the outer surfaces of the shells are equal. Then the ratio of charges given to shells $Q_1 : Q_2 : Q_3$, is (Neglect the induction effects)", "image": null}, "options": [{"id": "p3R2c", "label": "A", "text": "$1 : 4 : 16$", "isCorrect": false, "image": null}, {"id": "V6akl", "label": "B", "text": "$1 : 3 : 9$", "isCorrect": false, "image": null}, {"id": "ZLBNK", "label": "C", "text": "$\\dfrac{1}{3} : 3 : 27$", "isCorrect": true, "image": null}, {"id": "usU3J", "label": "D", "text": "$1 : \\dfrac{1}{3} : 9$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the uniform surface charge density on the outer surfaces of the shells be $\\sigma$.<br><br>The surface area of a sphere of radius $r$ is given by $A = 4\\pi r^2$.<br><br>The surface areas of the three given concentric shells are:<br><br>$A_1 = 4\\pi R^2$<br><br>$A_2 = 4\\pi (3R)^2 = 36\\pi R^2$<br><br>$A_3 = 4\\pi (9R)^2 = 324\\pi R^2$<br><br>Since induction effects are to be neglected, the charge given to each shell is assumed to reside entirely on its own outer surface.<br><br>The charge on each shell can be calculated as $Q = \\sigma A$.<br><br>$Q_1 = \\sigma A_1 = \\sigma (4\\pi R^2)$<br><br>$Q_2 = \\sigma A_2 = \\sigma (36\\pi R^2)$<br><br>$Q_3 = \\sigma A_3 = \\sigma (324\\pi R^2)$<br><br>The ratio of the charges is:<br><br>$Q_1 : Q_2 : Q_3 = 4\\pi R^2 \\sigma : 36\\pi R^2 \\sigma : 324\\pi R^2 \\sigma$<br><br>$Q_1 : Q_2 : Q_3 = 1 : 9 : 81$<br><br>Comparing this with the given options, we can rewrite the ratio by dividing each term by $3$:<br><br>$Q_1 : Q_2 : Q_3 = \\dfrac{1}{3} : \\dfrac{9}{3} : \\dfrac{81}{3} = \\dfrac{1}{3} : 3 : 27$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883b15a9fc0fc8c141c1", "type": "singleCorrect", "question": {"text": "Two charged particles each having a charge '$+q$' and mass 'm' are kept at a distance 'd'. If they are in equilibrium under the gravitational force and the electric force between them, then the ratio $\\dfrac{q}{m}$ (specific charge) of each particle is ($G$- Universal gravitation constant, $\\varepsilon_0$ = permittivity of free space)", "image": null}, "options": [{"id": "Tuu6C", "label": "A", "text": "$G/4\\pi\\varepsilon_0$", "isCorrect": false, "image": null}, {"id": "LUPrw", "label": "B", "text": "$4\\pi\\varepsilon_0 G$", "isCorrect": false, "image": null}, {"id": "JIk9e", "label": "C", "text": "$\\sqrt{4\\pi\\varepsilon_0 G}$", "isCorrect": true, "image": null}, {"id": "dttFs", "label": "D", "text": "$\\sqrt{\\dfrac{4\\pi\\varepsilon_0}{G}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For the particles to be in equilibrium, the repulsive electrostatic force between them must be balanced by the attractive gravitational force.<br><br>The electrostatic force is given by Coulomb's law:<br><br>$F_e = \\dfrac{1}{4\\pi\\varepsilon_0} \\dfrac{q^2}{d^2}$<br><br>The gravitational force is given by Newton's law of gravitation:<br><br>$F_g = G \\dfrac{m^2}{d^2}$<br><br>Equating the magnitudes of the two forces:<br><br>$\\dfrac{1}{4\\pi\\varepsilon_0} \\dfrac{q^2}{d^2} = G \\dfrac{m^2}{d^2}$<br><br>Canceling $d^2$ from both sides and rearranging the terms:<br><br>$\\dfrac{q^2}{m^2} = 4\\pi\\varepsilon_0 G$<br><br>Taking the square root on both sides gives the specific charge:<br><br>$\\dfrac{q}{m} = \\sqrt{4\\pi\\varepsilon_0 G}$<br><br>Answer: $\\sqrt{4\\pi\\varepsilon_0 G}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884d15a9fc0fc8c1426c", "type": "singleCorrect", "question": {"text": "Two point charges placed at a certain distance $r$ in air exert force $F$ on each other. Then the distance $r_1$ at which these charges will exert the same force in a medium of dielectric constant $K$ is", "image": null}, "options": [{"id": "T3qib", "label": "A", "text": "$r$", "isCorrect": false, "image": null}, {"id": "lACLM", "label": "B", "text": "$\\dfrac{r}{K}$", "isCorrect": false, "image": null}, {"id": "jtcAa", "label": "C", "text": "$\\dfrac{r}{\\sqrt{K}}$", "isCorrect": true, "image": null}, {"id": "JPuYO", "label": "D", "text": "$r\\sqrt{K}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Force between two point charges in air is given by<br><br>$F = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q_1 q_2}{r^2}$<br><br>Force between the same charges in a medium of dielectric constant $K$ at a distance $r_1$ is<br><br>$F' = \\dfrac{1}{4\\pi\\epsilon_0 K} \\dfrac{q_1 q_2}{r_1^2}$<br><br>Given that $F = F'$<br><br>$\\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q_1 q_2}{r^2} = \\dfrac{1}{4\\pi\\epsilon_0 K} \\dfrac{q_1 q_2}{r_1^2}$<br><br>$\\dfrac{1}{r^2} = \\dfrac{1}{K r_1^2}$<br><br>$r_1^2 = \\dfrac{r^2}{K}$<br><br>$r_1 = \\dfrac{r}{\\sqrt{K}}$<br><br>Answer: $\\dfrac{r}{\\sqrt{K}}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88ae15a9fc0fc8c145fa", "type": "singleCorrect", "question": {"text": "Two charged identical metal spheres A and B repel each other with a force $3 \\times 10^{-5}$ N. Another identical uncharged sphere C is touched with A and then placed at the mid-point between A and B. Net force on C is $x \\times 10^{-5}$ N. The value of $x$ is", "image": null}, "options": [{"id": "eFBUY", "label": "A", "text": "$1$", "isCorrect": false, "image": null}, {"id": "YuBwi", "label": "B", "text": "$2$", "isCorrect": false, "image": null}, {"id": "UmHz6", "label": "C", "text": "$1.5$", "isCorrect": false, "image": null}, {"id": "F6W2R", "label": "D", "text": "$3$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let the initial charge on spheres A and B be $q$ and the distance between them be $r$.<br><br>Initial force of repulsion between A and B is $F = \\dfrac{k q^2}{r^2} = 3 \\times 10^{-5}$ N.<br><br>When identical uncharged sphere C touches A, the charge is shared equally.<br><br>Charge on A becomes $q_A = \\dfrac{q}{2}$.<br><br>Charge on C becomes $q_C = \\dfrac{q}{2}$.<br><br>Charge on B remains $q_B = q$.<br><br>Sphere C is placed at the midpoint between A and B, so the distance of C from both A and B is $\\dfrac{r}{2}$.<br><br>Force on C due to A is $F_{CA} = \\dfrac{k q_A q_C}{\\left(\\dfrac{r}{2}\\right)^2} = \\dfrac{k \\left(\\dfrac{q}{2}\\right) \\left(\\dfrac{q}{2}\\right)}{\\dfrac{r^2}{4}} = \\dfrac{k q^2}{r^2} = F$.<br><br>Force on C due to B is $F_{CB} = \\dfrac{k q_B q_C}{\\left(\\dfrac{r}{2}\\right)^2} = \\dfrac{k (q) \\left(\\dfrac{q}{2}\\right)}{\\dfrac{r^2}{4}} = \\dfrac{2 k q^2}{r^2} = 2F$.<br><br>Since A and B have the same sign of charge, the forces $F_{CA}$ and $F_{CB}$ act in opposite directions.<br><br>Net force on C is $F_{net} = F_{CB} - F_{CA} = 2F - F = F$.<br><br>Therefore, $F_{net} = 3 \\times 10^{-5}$ N.<br><br>Comparing with $x \\times 10^{-5}$ N, we get $x = 3$.<br><br>Answer: $3$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886f15a9fc0fc8c143a7", "type": "singleCorrect", "question": {"text": "Two particles of charges $q_1 = 8q$ and $q_2 = -2q$ are placed as shown in figure. At what point away from $q_2$ on x-axis can a proton be placed placed so that it is in equilibrium?<br><img style=\"width: 400px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/may/watermarked_images/14_may_shift_2__q45_d1.png\" />", "image": null}, "options": [{"id": "9kTat", "label": "A", "text": "$x = 2L$", "isCorrect": true, "image": null}, {"id": "hbbCd", "label": "B", "text": "$x = 2.5L$", "isCorrect": false, "image": null}, {"id": "NAOw5", "label": "C", "text": "$x = 3L$", "isCorrect": false, "image": null}, {"id": "yoFag", "label": "D", "text": "$x = L$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the proton be placed at a coordinate $x$ on the x-axis.<br><br>For the proton to be in equilibrium, the net electric field at its position must be zero.<br><br>Since $q_1$ and $q_2$ have opposite signs, the equilibrium point must lie outside the region between the two charges. Furthermore, since $|q_1| > |q_2|$, the point must be closer to $q_2$, which means it lies to the right of $q_2$ ($x > L$).<br><br>Equating the magnitudes of the electric fields produced by $q_1$ and $q_2$ at position $x$:<br><br>$\\dfrac{k|q_1|}{x^2} = \\dfrac{k|q_2|}{(x - L)^2}$<br><br>Substituting the given values $q_1 = 8q$ and $q_2 = -2q$:<br><br>$\\dfrac{k(8q)}{x^2} = \\dfrac{k(2q)}{(x - L)^2}$<br><br>$\\dfrac{4}{x^2} = \\dfrac{1}{(x - L)^2}$<br><br>Taking the square root of both sides (since $x > L$, both $x$ and $x-L$ are positive):<br><br>$\\dfrac{2}{x} = \\dfrac{1}{x - L}$<br><br>$2(x - L) = x$<br><br>$2x - 2L = x$<br><br>$x = 2L$<br><br>Thus, the proton should be placed at $x = 2L$.<br><br>Answer: $x = 2L$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888b15a9fc0fc8c144af", "type": "singleCorrect", "question": {"text": "Charge $q_2$ of mass '$m$' revolves around a stationary charge $q_1$ in a circular orbit of radius '$r$'. The orbital periodic time of $q_2$ would be $\\left(k = \\dfrac{1}{4\\pi\\epsilon_0}\\right)$", "image": null}, "options": [{"id": "DUrql", "label": "A", "text": "$\\left[\\dfrac{4\\pi^2 m r^3}{k q_1 q_2}\\right]^{\\dfrac{1}{2}}$", "isCorrect": true, "image": null}, {"id": "uf75x", "label": "B", "text": "$\\left[\\dfrac{k q_1 q_2}{4\\pi^2 m r^3}\\right]^{\\dfrac{1}{2}}$", "isCorrect": false, "image": null}, {"id": "Ik2Zk", "label": "C", "text": "$\\left[\\dfrac{4\\pi^2 m r^4}{k q_1 q_2}\\right]^{\\dfrac{1}{2}}$", "isCorrect": false, "image": null}, {"id": "gT8Mc", "label": "D", "text": "$\\left[\\dfrac{4\\pi^2 m r^2}{k q_1 q_2}\\right]^{\\dfrac{1}{2}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The electrostatic force of attraction between the two charges provides the necessary centripetal force for the circular motion of charge $q_2$.<br><br>Electrostatic force $F_e = \\dfrac{k q_1 q_2}{r^2}$<br><br>Centripetal force $F_c = m \\omega^2 r = m \\left(\\dfrac{2\\pi}{T}\\right)^2 r$<br><br>Equating the two forces:<br><br>$\\dfrac{k q_1 q_2}{r^2} = \\dfrac{4\\pi^2 m r}{T^2}$<br><br>Rearranging the terms to solve for $T^2$:<br><br>$T^2 = \\dfrac{4\\pi^2 m r^3}{k q_1 q_2}$<br><br>Taking the square root on both sides:<br><br>$T = \\left[\\dfrac{4\\pi^2 m r^3}{k q_1 q_2}\\right]^{\\dfrac{1}{2}}$<br><br>Answer: $\\left[\\dfrac{4\\pi^2 m r^3}{k q_1 q_2}\\right]^{\\dfrac{1}{2}}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885b15a9fc0fc8c142ec", "type": "singleCorrect", "question": {"text": "Two point charges, $+2C$ and $+6C$ repel each other with a force of $12$N. If a charge of $(-4C)$ is given to each of these charges, the force now is", "image": null}, "options": [{"id": "qfsLb", "label": "A", "text": "$4$N, repulsive", "isCorrect": false, "image": null}, {"id": "Mb5Xu", "label": "B", "text": "$4$N, attractive", "isCorrect": true, "image": null}, {"id": "Ds4dS", "label": "C", "text": "$12$N, attractive", "isCorrect": false, "image": null}, {"id": "J4PTx", "label": "D", "text": "$8$N, repulsive", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Initial charges are $q_1 = +2$ C and $q_2 = +6$ C.<br><br>Initial force is $F = \\dfrac{k q_1 q_2}{r^2} = \\dfrac{k (2)(6)}{r^2} = \\dfrac{12k}{r^2}$.<br><br>Given $F = 12$ N, we get $\\dfrac{12k}{r^2} = 12 \\Rightarrow \\dfrac{k}{r^2} = 1$.<br><br>When a charge of $-4$ C is added to each, the new charges become:<br><br>$q_1' = +2 - 4 = -2$ C<br><br>$q_2' = +6 - 4 = +2$ C<br><br>The new force is $F' = \\dfrac{k |q_1'| |q_2'|}{r^2} = \\dfrac{k (2)(2)}{r^2} = 4 \\left(\\dfrac{k}{r^2}\\right)$.<br><br>Substituting $\\dfrac{k}{r^2} = 1$, we get $F' = 4$ N.<br><br>Since the new charges are of opposite signs ($-2$ C and $+2$ C), the force is attractive.<br><br>Answer: $4$N, attractive", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb882b15a9fc0fc8c1412b", "type": "singleCorrect", "question": {"text": "A charge $q$ is placed at the centre of the line joining two equal charges $Q$. The system of the three charges will be in equilibrium if $q$ is equal to", "image": null}, "options": [{"id": "jr3CD", "label": "A", "text": "$\\dfrac{-Q}{2}$", "isCorrect": false, "image": null}, {"id": "W3gVa", "label": "B", "text": "$\\dfrac{-Q}{4}$", "isCorrect": true, "image": null}, {"id": "bOn1l", "label": "C", "text": "$\\dfrac{Q}{4}$", "isCorrect": false, "image": null}, {"id": "QVwrw", "label": "D", "text": "$\\dfrac{Q}{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the two equal charges $Q$ be placed at positions $x = -a$ and $x = a$.<br><br>The charge $q$ is placed at the centre, $x = 0$.<br><br>For the system to be in equilibrium, the net force on each charge must be zero.<br><br>The force on the central charge $q$ is zero due to symmetry, as it experiences equal and opposite forces from the two $Q$ charges.<br><br>For the charge $Q$ at $x = a$ to be in equilibrium, the sum of the forces exerted by the other charge $Q$ (at $x = -a$) and the charge $q$ (at $x = 0$) must be zero.<br><br>The distance between the two $Q$ charges is $2a$, and the distance between $Q$ and $q$ is $a$.<br><br>Equating the net force on $Q$ to zero:<br><br>$\\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{Q^2}{(2a)^2} + \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{Q q}{a^2} = 0$<br><br>$\\dfrac{Q^2}{4a^2} + \\dfrac{Q q}{a^2} = 0$<br><br>$\\dfrac{Q}{4} + q = 0$<br><br>$q = \\dfrac{-Q}{4}$<br><br>Answer: $\\dfrac{-Q}{4}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a38c30a4553e1bdb39", "type": "singleCorrect", "question": {"text": "Two point charges placed in air separated by distance $R$ exert a force $F$ on each other. Now the space between those charges is filled with dielectric constant $K$. At distance $R_1$ between the charges, the same force is exerted as $F$. Then", "image": null}, "options": [{"id": "A2SoZ", "label": "A", "text": "$R_1 = \\sqrt{K}R$", "isCorrect": false, "image": null}, {"id": "2XXew", "label": "B", "text": "$R_1 = R$", "isCorrect": false, "image": null}, {"id": "44JLn", "label": "C", "text": "$R_1 = \\dfrac{R}{K}$", "isCorrect": false, "image": null}, {"id": "SD2iC", "label": "D", "text": "$R_1 = \\dfrac{R}{\\sqrt{K}}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Force between two point charges in air separated by distance $R$ is given by:<br><br>$F = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q_1 q_2}{R^2}$<br><br>When the space is filled with a dielectric of constant $K$, the force at distance $R_1$ is:<br><br>$F' = \\dfrac{1}{4\\pi\\epsilon_0 K} \\dfrac{q_1 q_2}{R_1^2}$<br><br>Given that the force remains the same, $F = F'$:<br><br>$\\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q_1 q_2}{R^2} = \\dfrac{1}{4\\pi\\epsilon_0 K} \\dfrac{q_1 q_2}{R_1^2}$<br><br>$\\dfrac{1}{R^2} = \\dfrac{1}{K R_1^2}$<br><br>$R_1^2 = \\dfrac{R^2}{K}$<br><br>$R_1 = \\dfrac{R}{\\sqrt{K}}$<br><br>Answer: $R_1 = \\dfrac{R}{\\sqrt{K}}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d34d8c30a4553e1be246", "type": "singleCorrect", "question": {"text": "Two point charges $q_1$ and $q_2$ are '$l$' distance apart. If one of the charges is doubled and the distance between them is halved. The magnitude of the force becomes 'n' times, where 'n' is", "image": null}, "options": [{"id": "TNhcd", "label": "A", "text": "$2$", "isCorrect": false, "image": null}, {"id": "4wxS4", "label": "B", "text": "$4$", "isCorrect": false, "image": null}, {"id": "4BFea", "label": "C", "text": "$8$", "isCorrect": true, "image": null}, {"id": "QY6Ls", "label": "D", "text": "$16$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Initial force between the charges is given by Coulomb's law:<br><br>$F = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q_1 q_2}{l^2}$<br><br>When one of the charges is doubled, let $q_1' = 2q_1$ and $q_2' = q_2$.<br><br>When the distance between them is halved, let $l' = \\dfrac{l}{2}$.<br><br>The new force is:<br><br>$F' = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q_1' q_2'}{l'^2}$<br><br>$F' = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{2q_1 q_2}{\\left(\\dfrac{l}{2}\\right)^2}$<br><br>$F' = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{2q_1 q_2}{\\dfrac{l^2}{4}}$<br><br>$F' = 8 \\left( \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q_1 q_2}{l^2} \\right)$<br><br>$F' = 8F$<br><br>Thus, the magnitude of the force becomes $8$ times the initial force, so $n = 8$.<br><br>Answer: $8$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ea8c30a4553e1bde2c", "type": "singleCorrect", "question": {"text": "Two equal point charges exert a force F on each other when they are placed distance 'd' apart in air. When they are placed distance 'D' apart in a medium of dielectric constant K, they exert the same force. The distance D is equal to", "image": null}, "options": [{"id": "EQ9OV", "label": "A", "text": "$\\dfrac{d}{\\sqrt{K}}$", "isCorrect": true, "image": null}, {"id": "JO8X4", "label": "B", "text": "$d\\sqrt{K}$", "isCorrect": false, "image": null}, {"id": "lSgvO", "label": "C", "text": "$d^2 K$", "isCorrect": false, "image": null}, {"id": "lTa9u", "label": "D", "text": "$\\dfrac{K}{d^2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The electrostatic force between two point charges in air is given by<br><br>$F = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q^2}{d^2}$<br><br>When the charges are placed in a medium of dielectric constant $K$ at a distance $D$, the force is<br><br>$F' = \\dfrac{1}{4\\pi\\epsilon_0 K} \\dfrac{q^2}{D^2}$<br><br>Given that the forces are equal, $F = F'$:<br><br>$\\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q^2}{d^2} = \\dfrac{1}{4\\pi\\epsilon_0 K} \\dfrac{q^2}{D^2}$<br><br>$\\dfrac{1}{d^2} = \\dfrac{1}{K D^2}$<br><br>$D^2 = \\dfrac{d^2}{K}$<br><br>$D = \\dfrac{d}{\\sqrt{K}}$<br><br>Answer: $\\dfrac{d}{\\sqrt{K}}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d33e8c30a4553e1be1b0", "type": "singleCorrect", "question": {"text": "Two point charges +e and +4e are kept at a distance 'd' units apart. Third point charge +q is placed between the two charges at a distance 'x' units from charge +e so as to be in equilibrium. The value of 'x' is", "image": null}, "options": [{"id": "Fegn8", "label": "A", "text": "$\\dfrac{d}{3}$ units", "isCorrect": true, "image": null}, {"id": "h3sxc", "label": "B", "text": "$\\dfrac{d}{2}$ units", "isCorrect": false, "image": null}, {"id": "gr8GL", "label": "C", "text": "$\\dfrac{2d}{5}$ units", "isCorrect": false, "image": null}, {"id": "5lsdC", "label": "D", "text": "$\\dfrac{3d}{4}$ units", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the charges $+e$ and $+4e$ be placed at a distance $d$ apart.<br><br>The third charge $+q$ is placed at a distance $x$ from $+e$. The distance of $+q$ from $+4e$ is $(d - x)$.<br><br>For the charge $+q$ to be in equilibrium, the net force acting on it must be zero. The force exerted by $+e$ must be equal in magnitude and opposite in direction to the force exerted by $+4e$.<br><br>$\\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{e \\cdot q}{x^2} = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{4e \\cdot q}{(d - x)^2}$<br><br>$\\dfrac{1}{x^2} = \\dfrac{4}{(d - x)^2}$<br><br>Taking the square root on both sides:<br><br>$\\dfrac{1}{x} = \\dfrac{2}{d - x}$<br><br>$d - x = 2x$<br><br>$3x = d$<br><br>$x = \\dfrac{d}{3}$<br><br>Answer: $\\dfrac{d}{3}$ units", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d08c30a4553e1bdd17", "type": "singleCorrect", "question": {"text": "Two spherical hollow spheres of radii '$R_1$' and '$R_2$' are charged with same charge. Let '$\\sigma_1$' and '$\\sigma_2$' are their respective charge densities, then the ratio $\\sigma_1$ to $\\sigma_2$ is", "image": null}, "options": [{"id": "11U1C", "label": "A", "text": "$R_1 : R_2$", "isCorrect": false, "image": null}, {"id": "us0NX", "label": "B", "text": "$R_2 : R_1$", "isCorrect": false, "image": null}, {"id": "955mo", "label": "C", "text": "$R_2^2 : R_1^2$", "isCorrect": true, "image": null}, {"id": "iuIxs", "label": "D", "text": "$R_1^2 : R_2^2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the charge on both the hollow spheres be $Q$.<br><br>The surface charge density $\\sigma$ of a sphere of radius $R$ is given by $\\sigma = \\dfrac{Q}{4\\pi R^2}$.<br><br>For the first sphere of radius $R_1$, the charge density is $\\sigma_1 = \\dfrac{Q}{4\\pi R_1^2}$.<br><br>For the second sphere of radius $R_2$, the charge density is $\\sigma_2 = \\dfrac{Q}{4\\pi R_2^2}$.<br><br>Taking the ratio of their charge densities:<br><br>$\\dfrac{\\sigma_1}{\\sigma_2} = \\dfrac{\\dfrac{Q}{4\\pi R_1^2}}{\\dfrac{Q}{4\\pi R_2^2}} = \\dfrac{R_2^2}{R_1^2}$<br><br>Thus, the ratio $\\sigma_1 : \\sigma_2$ is $R_2^2 : R_1^2$.<br><br>Answer: $R_2^2 : R_1^2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2dc8c30a4553e1bdd99", "type": "singleCorrect", "question": {"text": "A point charge 'Q' is placed at the centre of the line joining two equal charges '+q' and '+q'. The value of 'Q' when the system is in equilibrium is", "image": null}, "options": [{"id": "sA1eu", "label": "A", "text": "$\\dfrac{+q}{4}$", "isCorrect": false, "image": null}, {"id": "LDSIV", "label": "B", "text": "$\\dfrac{+q}{2}$", "isCorrect": false, "image": null}, {"id": "eSflQ", "label": "C", "text": "$\\dfrac{-q}{2}$", "isCorrect": false, "image": null}, {"id": "rBn9G", "label": "D", "text": "$\\dfrac{-q}{4}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let the two equal charges $+q$ be placed at a distance $r$ from each other.<br><br>The charge $Q$ is placed at the centre, so its distance from each $+q$ charge is $\\dfrac{r}{2}$.<br><br>For the system to be in equilibrium, the net force on each charge must be zero.<br><br>The net force on the central charge $Q$ is zero for any value of $Q$ due to symmetry.<br><br>For the charge $+q$ to be in equilibrium, the force exerted by the other $+q$ charge must be equal and opposite to the force exerted by $Q$.<br><br>The force on $+q$ due to the other $+q$ is $F_1 = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q^2}{r^2}$.<br><br>The force on $+q$ due to $Q$ is $F_2 = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{qQ}{(\\dfrac{r}{2})^2} = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{4qQ}{r^2}$.<br><br>Equating the sum of forces to zero:<br><br>$F_1 + F_2 = 0$<br><br>$\\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q^2}{r^2} + \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{4qQ}{r^2} = 0$<br><br>$q^2 + 4qQ = 0$<br><br>$Q = \\dfrac{-q}{4}$<br><br>Answer: $\\dfrac{-q}{4}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2978c30a4553e1bdab7", "type": "singleCorrect", "question": {"text": "If two charges $q_1$ and $q_2$ are separated with distance 'd' and placed in a medium of dielectric constant $K$. What will be the equivalent distance between charges in air for the same electrostatic force?", "image": null}, "options": [{"id": "YiLr6", "label": "A", "text": "$d[k]^{1/2}$", "isCorrect": true, "image": null}, {"id": "NFwRQ", "label": "B", "text": "$k[d]^{1/2}$", "isCorrect": false, "image": null}, {"id": "v95LQ", "label": "C", "text": "$1.5 d[k]^{1/2}$", "isCorrect": false, "image": null}, {"id": "3zxRH", "label": "D", "text": "$2d[k]^{1/2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Force between charges in a medium of dielectric constant $K$ is given by $F = \\dfrac{1}{4\\pi\\epsilon_0 K} \\dfrac{q_1 q_2}{d^2}$.<br><br>Force between charges in air at an equivalent distance $d'$ is given by $F' = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q_1 q_2}{d'^2}$.<br><br>For the same electrostatic force, $F = F'$.<br><br>$\\dfrac{1}{4\\pi\\epsilon_0 K} \\dfrac{q_1 q_2}{d^2} = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q_1 q_2}{d'^2}$<br><br>$\\dfrac{1}{K d^2} = \\dfrac{1}{d'^2}$<br><br>$d'^2 = K d^2$<br><br>$d' = d \\sqrt{K} = d[K]^{1/2}$<br><br>Answer: $d[k]^{1/2}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b28c30a4553e1bdbd5", "type": "singleCorrect", "question": {"text": "Three charges $q$, $Q$ and $+4q$ are placed in a straight line of length $d$ at points at distance $0$, $\\dfrac{d}{3}$, $\\dfrac{2d}{3}$ respectively. In order to make the net force on $q$ be zero, the value of $Q$ should be", "image": null}, "options": [{"id": "ylTNJ", "label": "A", "text": "$\\dfrac{-q}{2}$", "isCorrect": false, "image": null}, {"id": "HhbIV", "label": "B", "text": "$\\dfrac{-3q}{2}$", "isCorrect": false, "image": null}, {"id": "r0dmq", "label": "C", "text": "$\\dfrac{-4q}{3}$", "isCorrect": false, "image": null}, {"id": "x1vrS", "label": "D", "text": "$\\dfrac{-4q}{9}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The charges $q$, $Q$, and $+4q$ are placed along a straight line of length $d$. To satisfy the total length $d$ and the given intervals, their positions are $x = 0$, $x = \\dfrac{d}{3}$, and $x = d$ respectively.<br><br>The distance between $q$ and $Q$ is $\\dfrac{d}{3}$, and the distance between $q$ and $+4q$ is $d$.<br><br>The net force on the charge $q$ at $x = 0$ is the sum of the electrostatic forces exerted by $Q$ and $+4q$.<br><br>The force on $q$ due to $Q$ is:<br><br>$F_1 = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{qQ}{\\left(\\dfrac{d}{3}\\right)^2} = \\dfrac{9qQ}{4\\pi\\epsilon_0 d^2}$<br><br>The force on $q$ due to $+4q$ is:<br><br>$F_2 = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q(4q)}{d^2} = \\dfrac{4q^2}{4\\pi\\epsilon_0 d^2}$<br><br>For the net force on $q$ to be zero:<br><br>$F_1 + F_2 = 0$<br><br>$\\dfrac{9qQ}{4\\pi\\epsilon_0 d^2} + \\dfrac{4q^2}{4\\pi\\epsilon_0 d^2} = 0$<br><br>Dividing by the common terms yields:<br><br>$9Q + 4q = 0$<br><br>$Q = \\dfrac{-4q}{9}$<br><br>Answer: $\\dfrac{-4q}{9}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bebbf9280d7f9932d9e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Two-point charges +2 C and +6 C separated by distance ' r ' repel each other with a force of 18 N . If negative charge of 4 C is added to each of these charges, then the force experienced by them is", "image": null}, "options": [{"id": "Wd2mb", "text": "6 N (attractive)", "image": null, "isCorrect": true}, {"id": "ODNoi", "text": "12 N (attractive)", "image": null, "isCorrect": false}, {"id": "5gWXl", "text": "6 N (repulsive)", "image": null, "isCorrect": false}, {"id": "JboLn", "text": "12 N (repulsive)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Initial charges are $q_1 = +2$ C and $q_2 = +6$ C.<br><br>Initial force is $F_1 = \\dfrac{k q_1 q_2}{r^2} = \\dfrac{k(2)(6)}{r^2} = \\dfrac{12k}{r^2} = 18$ N.<br><br>This gives $\\dfrac{k}{r^2} = \\dfrac{18}{12} = 1.5$.<br><br>When a charge of $-4$ C is added to each, the new charges become:<br><br>$q_1' = +2 - 4 = -2$ C<br><br>$q_2' = +6 - 4 = +2$ C<br><br>The magnitude of the new force is $F_2 = \\dfrac{k |q_1'| |q_2'|}{r^2} = \\dfrac{k(2)(2)}{r^2} = 4 \\left(\\dfrac{k}{r^2}\\right)$.<br><br>Substituting the value of $\\dfrac{k}{r^2}$, we get $F_2 = 4 \\times 1.5 = 6$ N.<br><br>Since the new charges have opposite signs ($-2$ C and $+2$ C), the force between them is attractive.<br><br>Answer: 6 N (attractive)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bb9bf9280d7f9932bdd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Two equally charged small balls placed at a fixed distance experience a force 'F'. A similar uncharged ball after touching one of them is placed at the middle point between the two balls. the force experienced by this ball is", "image": null}, "options": [{"id": "LIQNt", "text": "$\\frac{F}{2}$", "image": null, "isCorrect": false}, {"id": "pco7j", "text": "F", "image": null, "isCorrect": true}, {"id": "SlXNd", "text": "2F", "image": null, "isCorrect": false}, {"id": "y2dS3", "text": "4F", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the initial charges on the two balls be $q$ and the distance between them be $r$.<br><br>Initial force between the balls is $F = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q^2}{r^2}$.<br><br>When a similar uncharged ball touches one of the balls, the charge is shared equally. The charge on the touched ball becomes $\\dfrac{q}{2}$ and the charge on the new ball becomes $\\dfrac{q}{2}$. The charge on the other original ball remains $q$.<br><br>The new ball is placed at the midpoint, so its distance from both balls is $\\dfrac{r}{2}$.<br><br>Force on the new ball due to the first ball (charge $\\dfrac{q}{2}$) is $F_1 = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{(\\dfrac{q}{2})(\\dfrac{q}{2})}{(\\dfrac{r}{2})^2} = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q^2}{r^2} = F$.<br><br>Force on the new ball due to the second ball (charge $q$) is $F_2 = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q(\\dfrac{q}{2})}{(\\dfrac{r}{2})^2} = 2 \\left( \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q^2}{r^2} \\right) = 2F$.<br><br>Since these two forces act in opposite directions, the net force on the new ball is $F_{net} = F_2 - F_1 = 2F - F = F$.<br><br>Answer: F", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba7bf9280d7f9932b44", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Two point charges $\\mathrm{q}_1$ and $\\mathrm{q}_2$ are '$l$' distance apart. If one of the charges is doubled and distance between them is halved. The magnitude of force becomes n times, where n is", "image": null}, "options": [{"id": "vJMuV", "text": "1", "image": null, "isCorrect": false}, {"id": "Oukn2", "text": "2", "image": null, "isCorrect": false}, {"id": "H57Vk", "text": "8", "image": null, "isCorrect": true}, {"id": "I7Mas", "text": "16", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Initial force between the charges is given by Coulomb's law:<br><br>$F = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q_1 q_2}{l^2}$<br><br>When one of the charges is doubled ($q_1' = 2q_1$) and the distance is halved ($l' = l/2$), the new force is:<br><br>$F' = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q_1' q_2'}{l'^2}$<br><br>$F' = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{(2q_1) q_2}{(l/2)^2}$<br><br>$F' = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{2q_1 q_2}{l^2/4}$<br><br>$F' = 8 \\left( \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q_1 q_2}{l^2} \\right)$<br><br>$F' = 8F$<br><br>Therefore, the magnitude of the force becomes $8$ times, so $n = 8$.<br><br>Answer: 8", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b93bf9280d7f9932a87", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Three charges ' +3 q ' , ' Q ' and ' +q ' are placed in a straight line of length ' $\\ell$ ' at points at distances $0, \\frac{\\ell}{2}$ and $\\ell$ respectively. The value of $Q$ in order to have the net force on $+q$ to be zero, $Q=x q$. The value of $x$ is", "image": null}, "options": [{"id": "t5TIL", "text": "$-\\frac{1}{4}$", "image": null, "isCorrect": false}, {"id": "xRqug", "text": "$\\frac{-3}{4}$", "image": null, "isCorrect": true}, {"id": "fhzCB", "text": "$-3$", "image": null, "isCorrect": false}, {"id": "1U0At", "text": "$4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The charges are placed at distances $0$, $\\dfrac{\\ell}{2}$, and $\\ell$.<br><br>Charge at $x = 0$ is $+3q$.<br>Charge at $x = \\dfrac{\\ell}{2}$ is $Q$.<br>Charge at $x = \\ell$ is $+q$.<br><br>The net force on the charge $+q$ placed at $x = \\ell$ is the sum of the forces due to the other two charges.<br><br>Force due to $+3q$ on $+q$ is:<br>$F_1 = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{(3q)(q)}{\\ell^2}$<br><br>Force due to $Q$ on $+q$ is:<br>$F_2 = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{(Q)(q)}{\\left(\\dfrac{\\ell}{2}\\right)^2} = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{4Qq}{\\ell^2}$<br><br>For the net force on $+q$ to be zero, $F_1 + F_2 = 0$.<br><br>$\\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{3q^2}{\\ell^2} + \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{4Qq}{\\ell^2} = 0$<br><br>$3q^2 + 4Qq = 0$<br><br>Since $q \\neq 0$, dividing by $q$ gives:<br>$3q + 4Q = 0$<br><br>$Q = -\\dfrac{3}{4}q$<br><br>Given $Q = xq$, we get $x = -\\dfrac{3}{4}$.<br><br>Answer: $\\frac{-3}{4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b87bf9280d7f9932a16", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Three equal charges are placed on the three corners of a square as shown below. If the magnitude of force between ' $\\mathrm{q}_1$ ' and ' $\\mathrm{q}_2$ ' is ' $\\mathrm{F}_{12}$ ' and that between ' $\\mathrm{q}_1{ }^{\\prime}$ and ' $\\mathrm{q}_3{ }^{\\prime}$ is $\\mathrm{F}_{13}$, then the ratio of $\\mathrm{F}_{13}$ to $\\mathrm{F}_{12}$ is\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/JjUn2kzTqNrmDZR3RcbJoxaivbTTSyK2IlrPuFqiDos.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "l8Yyd", "text": "$\\frac{1}{\\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "8B0Qv", "text": "$\\sqrt{2}$", "image": null, "isCorrect": false}, {"id": "FoslM", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": true}, {"id": "ksjm7", "text": "$2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From the given figure, the charges $q_1$ and $q_2$ are placed at adjacent corners of the square. The distance between them is $a$.<br><br>The magnitude of the electrostatic force between $q_1$ and $q_2$ is given by Coulomb's law:<br>$F_{12} = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q_1 q_2}{a^2} = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q^2}{a^2}$<br><br>The charges $q_1$ and $q_3$ are placed at diagonally opposite corners of the square. The distance between them is the length of the diagonal, which is $\\sqrt{a^2 + a^2} = \\sqrt{2}a$.<br><br>The magnitude of the electrostatic force between $q_1$ and $q_3$ is:<br>$F_{13} = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q_1 q_3}{(\\sqrt{2}a)^2} = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q^2}{2a^2}$<br><br>Taking the ratio of $F_{13}$ to $F_{12}$, we get:<br>$\\dfrac{F_{13}}{F_{12}} = \\dfrac{\\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q^2}{2a^2}}{\\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q^2}{a^2}} = \\dfrac{1}{2}$<br><br>Answer: $\\frac{1}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871afcbf9280d7f993255b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Two charges $\\mathrm{q}_1=+6 \\mathrm{q}$ and $\\mathrm{q}_2=-3 \\mathrm{q}$ are placed as shown in figure. A proton is placed on x -axis away from $\\mathrm{q}_2$. To remain proton in equilibrium, the distance between $\\mathrm{q}_1$ and proton is\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/4yyjkd-58f_JNAEZbWeQIbnp6C7THIlJLrr0_uF5wqA.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "Iqb0M", "text": "$\\left(\\frac{\\sqrt{2}}{\\sqrt{2}-1}\\right) \\mathrm{L}$", "image": null, "isCorrect": true}, {"id": "8fu5L", "text": "2 L", "image": null, "isCorrect": false}, {"id": "43dtX", "text": "$\\frac{L}{2}$", "image": null, "isCorrect": false}, {"id": "ncmBs", "text": "$\\left(\\frac{\\sqrt{2}}{\\sqrt{2}+1}\\right) \\mathrm{L}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the proton be placed at a distance $x$ from $q_1$ on the x-axis, to the right of $q_2$.<br><br>The distance of the proton from $q_2$ is $(x - L)$.<br><br>For the proton to be in equilibrium, the net electric force on it must be zero. The repulsive force due to $q_1$ must balance the attractive force due to $q_2$.<br><br>Equating the magnitudes of the forces:<br><br>$\\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{|q_1| e}{x^2} = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{|q_2| e}{(x-L)^2}$<br><br>Substituting $q_1 = 6q$ and $|q_2| = 3q$:<br><br>$\\dfrac{6q}{x^2} = \\dfrac{3q}{(x-L)^2}$<br><br>$\\dfrac{2}{x^2} = \\dfrac{1}{(x-L)^2}$<br><br>Taking the square root of both sides (since $x > L$):<br><br>$\\dfrac{\\sqrt{2}}{x} = \\dfrac{1}{x-L}$<br><br>$\\sqrt{2}(x-L) = x$<br><br>$\\sqrt{2}x - \\sqrt{2}L = x$<br><br>$x(\\sqrt{2} - 1) = \\sqrt{2}L$<br><br>$x = \\left(\\dfrac{\\sqrt{2}}{\\sqrt{2}-1}\\right) L$<br><br>Answer: $\\left(\\frac{\\sqrt{2}}{\\sqrt{2}-1}\\right) \\mathrm{L}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792141c0aee93fa0796de0c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "Two point charges $+q_1$ and $q_2$ repel each other with a force of $100 \\mathrm{~N} \\cdot \\mathrm{q}_1$ is increased by $10 \\%$ and $\\mathrm{q}_2$ is decreased by $10 \\%$. If they are kept at their original positions the change in the force of repulsion between them is", "image": null}, "options": [{"id": "z0FdW", "text": "decreased by 10 N", "image": null, "isCorrect": false}, {"id": "qterN", "text": "increased by 10 N", "image": null, "isCorrect": false}, {"id": "uJFxt", "text": "increased by 1 N", "image": null, "isCorrect": false}, {"id": "sQJJQ", "text": "decreased by 1 N", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The initial force of repulsion between the charges is given by Coulomb's law:<br><br>$F = \\dfrac{k q_1 q_2}{r^2} = 100 \\text{ N}$<br><br>When $q_1$ is increased by $10\\%$, the new charge is $q_1' = q_1 + 0.1 q_1 = 1.1 q_1$.<br><br>When $q_2$ is decreased by $10\\%$, the new charge is $q_2' = q_2 - 0.1 q_2 = 0.9 q_2$.<br><br>The new force of repulsion is:<br><br>$F' = \\dfrac{k q_1' q_2'}{r^2} = \\dfrac{k (1.1 q_1) (0.9 q_2)}{r^2}$<br><br>$F' = 1.1 \\times 0.9 \\times \\dfrac{k q_1 q_2}{r^2}$<br><br>$F' = 0.99 \\times F$<br><br>Substituting the value of $F = 100 \\text{ N}$:<br><br>$F' = 0.99 \\times 100 = 99 \\text{ N}$<br><br>The change in force is $100 \\text{ N} - 99 \\text{ N} = 1 \\text{ N}$.<br><br>Thus, the force of repulsion is decreased by $1 \\text{ N}$.<br><br>Answer: decreased by 1 N", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792140a0aee93fa0796dd7d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "Two point charges +8 q and -2 q are located at $\\mathrm{X}=0$ (origin) and $\\mathrm{X}=\\mathrm{L}$ respectively. The net electric field due to these two charges is zero at point P on X -axis. The location of point P from the origin is", "image": null}, "options": [{"id": "t5PzQ", "text": "$\\frac{\\mathrm{L}}{4}$", "image": null, "isCorrect": false}, {"id": "S2Fd6", "text": "2 L", "image": null, "isCorrect": true}, {"id": "erWGR", "text": "4 L", "image": null, "isCorrect": false}, {"id": "5ByS9", "text": "8 L", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the point P be at a distance $x$ from the origin on the X-axis.<br><br>Since the charges have opposite signs, the neutral point will lie outside the region between them, closer to the charge with the smaller magnitude ($-2q$). Thus, $x > L$.<br><br>The electric field at P due to $+8q$ is $E_1 = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{8q}{x^2}$<br><br>The electric field at P due to $-2q$ is $E_2 = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{2q}{(x-L)^2}$<br><br>For the net electric field to be zero, $E_1 = E_2$:<br><br>$\\dfrac{8q}{x^2} = \\dfrac{2q}{(x-L)^2}$<br><br>$\\dfrac{4}{x^2} = \\dfrac{1}{(x-L)^2}$<br><br>Taking the square root of both sides:<br><br>$\\dfrac{2}{x} = \\dfrac{1}{x-L}$<br><br>$2x - 2L = x$<br><br>$x = 2L$<br><br>The location of point P from the origin is $2L$.<br><br>Answer: 2 L", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213f20aee93fa0796dcc8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "A particle ' $A$ ' has charge ' $+q$ ' and a particle ' $B$ '. has charge ' $+4 q$ '. Each has same mass ' m '. When they are allowed to fall from rest through the same potential, the ratio of their speeds will become (particle A to particle B)", "image": null}, "options": [{"id": "y9qke", "text": "$2: 1$", "image": null, "isCorrect": false}, {"id": "zrL80", "text": "$1: 2$", "image": null, "isCorrect": true}, {"id": "zyAda", "text": "$1: 4$", "image": null, "isCorrect": false}, {"id": "8NaVK", "text": "$4: 1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The kinetic energy gained by a charged particle of charge $q$ and mass $m$ falling from rest through a potential difference $V$ is given by $K = qV$.<br><br>Since $K = \\dfrac{1}{2}mv^2$, we have $\\dfrac{1}{2}mv^2 = qV \\Rightarrow v = \\sqrt{\\dfrac{2qV}{m}}$.<br><br>For particle A with charge $q$ and mass $m$:<br><br>$v_A = \\sqrt{\\dfrac{2qV}{m}}$<br><br>For particle B with charge $4q$ and mass $m$:<br><br>$v_B = \\sqrt{\\dfrac{2(4q)V}{m}} = 2\\sqrt{\\dfrac{2qV}{m}}$<br><br>The ratio of their speeds is:<br><br>$\\dfrac{v_A}{v_B} = \\dfrac{\\sqrt{\\dfrac{2qV}{m}}}{2\\sqrt{\\dfrac{2qV}{m}}} = \\dfrac{1}{2}$<br><br>Thus, the ratio is $1:2$.<br><br>Answer: $1: 2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e20aee93fa0796dc49", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "Charges $3 \\mathrm{Q}, \\mathrm{q}$ and Q are placed along x -axis at positions $\\mathrm{x}=0, \\mathrm{x}=\\frac{1}{3}$ and $\\mathrm{x}=1$ respectively. When the force on charge Q is zero, the value of $q$ is", "image": null}, "options": [{"id": "VtPjk", "text": "$\\frac{\\mathrm{Q}}{3}$", "image": null, "isCorrect": false}, {"id": "khXMw", "text": "$-\\frac{\\mathrm{Q}}{3}$.", "image": null, "isCorrect": false}, {"id": "4eXyx", "text": "$\\frac{4}{3} \\mathrm{Q}$", "image": null, "isCorrect": false}, {"id": "JwPAy", "text": "$-\\frac{4}{3} \\mathrm{Q}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The force on charge $Q$ placed at $x=1$ is due to the charges $3Q$ at $x=0$ and $q$ at $x=\\dfrac{1}{3}$.<br><br>The distance of $Q$ from $3Q$ is $r_1 = 1 - 0 = 1$.<br><br>The distance of $Q$ from $q$ is $r_2 = 1 - \\dfrac{1}{3} = \\dfrac{2}{3}$.<br><br>The net force on $Q$ is zero, so the sum of the forces exerted by $3Q$ and $q$ on $Q$ must be zero.<br><br>$F_{net} = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{(3Q)(Q)}{(1)^2} + \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{(q)(Q)}{\\left(\\dfrac{2}{3}\\right)^2} = 0$<br><br>$3Q + \\dfrac{q}{\\dfrac{4}{9}} = 0$<br><br>$3Q + \\dfrac{9q}{4} = 0$<br><br>$\\dfrac{9q}{4} = -3Q$<br><br>$q = -\\dfrac{12Q}{9} = -\\dfrac{4}{3}Q$<br><br>Answer: $-\\frac{4}{3} \\mathrm{Q}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213df0aee93fa0796dc2f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "A small particle carrying a negative charge of $1.6 \\times 10^{-19} \\mathrm{C}$ is suspended in equilibrium between two horizontal metal plates 8 cm apart having a potential difference of 980 V across them. The mass of the particle is $\\left[\\mathrm{g}=9.8 \\mathrm{~m} / \\mathrm{s}^2\\right]$", "image": null}, "options": [{"id": "f3sxt", "text": "$2 \\times 10^{-16} \\mathrm{~kg}$", "image": null, "isCorrect": true}, {"id": "qzm3M", "text": "$2.2 \\times 10^{-16} \\mathrm{~kg}$", "image": null, "isCorrect": false}, {"id": "29Mf6", "text": "$20 \\times 10^{-16} \\mathrm{~kg}$", "image": null, "isCorrect": false}, {"id": "lvtjV", "text": "$4 \\times 10^{-16} \\mathrm{~kg}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For equilibrium of the particle, the downward gravitational force must be balanced by the upward electric force.<br><br>$mg = qE$<br><br>The electric field $E$ between the plates is given by $E = \\dfrac{V}{d}$.<br><br>$mg = q\\dfrac{V}{d}$<br><br>$m = \\dfrac{qV}{gd}$<br><br>Substituting the given values:<br><br>$m = \\dfrac{1.6 \\times 10^{-19} \\times 980}{9.8 \\times 0.08}$<br><br>$m = \\dfrac{1.6 \\times 10^{-19} \\times 100}{0.08}$<br><br>$m = \\dfrac{1.6 \\times 10^{-17}}{0.08}$<br><br>$m = 20 \\times 10^{-17} = 2 \\times 10^{-16} \\mathrm{kg}$<br><br>Answer: $2 \\times 10^{-16} \\mathrm{~kg}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d00aee93fa0796dbba", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "Two point charges $(A$ and $B)+4 q$ and $-4 q$ are placed along a line separated by a distance ' $r$ '. Force acting between them is F. If $25 \\%$ of charge from point A is transferred to that at\r\npoint $B$, the force between the charges now becomes", "image": null}, "options": [{"id": "wtR6v", "text": "$\\dfrac{3}{4} \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "PC5k2", "text": "$\\dfrac{4}{3} \\cdot \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "Wyt4U", "text": "$\\dfrac{9}{16} \\mathrm{~F}$", "image": null, "isCorrect": true}, {"id": "s4Jil", "text": "$\\dfrac{16}{9} \\mathrm{~F}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Initial charges are $q_A = +4q$ and $q_B = -4q$.<br><br>Initial force between the charges is given by Coulomb's law:<br><br>$F = \\dfrac{k (4q)(4q)}{r^2} = \\dfrac{16kq^2}{r^2}$<br><br>When $25\\%$ of the charge from A is transferred to B, the amount of charge transferred is:<br><br>$\\Delta q = \\dfrac{25}{100} \\times (+4q) = +q$<br><br>New charge at A:<br><br>$q_A' = +4q - q = +3q$<br><br>New charge at B:<br><br>$q_B' = -4q + q = -3q$<br><br>New force between the charges is:<br><br>$F' = \\dfrac{k (3q)(3q)}{r^2} = \\dfrac{9kq^2}{r^2}$<br><br>Taking the ratio of the new force to the initial force:<br><br>$\\dfrac{F'}{F} = \\dfrac{\\dfrac{9kq^2}{r^2}}{\\dfrac{16kq^2}{r^2}} = \\dfrac{9}{16}$<br><br>$F' = \\dfrac{9}{16}F$<br><br>Answer: $\\dfrac{9}{16} \\mathrm{~F}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213be0aee93fa0796db2b", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "Two point charges $+10\\text{ q}$ and $-4\\text{ q}$ are located at pt.A ($x = 0$) and pt.B ($x = L$) respectively. What is the location of a point on the x-axis at which the net electric field due to these two point charges is zero?", "image": null}, "options": [{"id": "Iup0j", "text": "$r = \\dfrac{\\sqrt{2}\\mathrm{L}}{\\sqrt{5} - \\sqrt{2}}$ right to pt.B", "image": null, "isCorrect": true}, {"id": "Zzhtr", "text": "$r = \\dfrac{\\sqrt{2}\\mathrm{L}}{\\sqrt{5} - \\sqrt{2}}$ left to pt.A", "image": null, "isCorrect": false}, {"id": "0myPk", "text": "$r = \\dfrac{\\sqrt{2}\\mathrm{L}}{\\sqrt{5} + \\sqrt{2}}$ right to pt.B", "image": null, "isCorrect": false}, {"id": "M5A3G", "text": "$r = \\dfrac{\\sqrt{2}\\mathrm{L}}{\\sqrt{5} + \\sqrt{2}}$ left to pt.A", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the null point be at a distance $r$ to the right of point B.<br><br>The electric field due to $+10\\text{ q}$ at A ($x=0$) and $-4\\text{ q}$ at B ($x=L$) must be equal in magnitude and opposite in direction.<br><br>Since the charges have opposite signs, the null point lies outside the region between them. It must be closer to the charge with the smaller magnitude ($-4\\text{ q}$). Thus, the null point is to the right of B.<br><br>Equating the magnitudes of the electric fields at this point:<br><br>$\\dfrac{k(10\\text{q})}{(L+r)^2} = \\dfrac{k(4\\text{q})}{r^2}$<br><br>$\\dfrac{5}{(L+r)^2} = \\dfrac{2}{r^2}$<br><br>Taking the square root of both sides:<br><br>$\\dfrac{\\sqrt{5}}{L+r} = \\dfrac{\\sqrt{2}}{r}$<br><br>$\\sqrt{5}r = \\sqrt{2}L + \\sqrt{2}r$<br><br>$r(\\sqrt{5} - \\sqrt{2}) = \\sqrt{2}L$<br><br>$r = \\dfrac{\\sqrt{2}L}{\\sqrt{5} - \\sqrt{2}}$<br><br>The point is at a distance $r$ to the right of point B.<br><br>Answer: $r = \\dfrac{\\sqrt{2}\\mathrm{L}}{\\sqrt{5} - \\sqrt{2}}$ right to pt.B", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792135e0aee93fa0796d83f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "A charge $+Q$ is placed at each of the diagonally opposite corners of a square. A charge -q is placed at each of the other diagonally opposite corners as shown. If the net electrical force on $+Q$ is zero, then $\\dfrac{+Q}{-q}$ is equal to\r\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/mxKZbyTypsQ8XPmPXLmeQ9DBtok7ns5B8fJRQkOgtm8.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "1A6lk", "text": "+1", "image": null, "isCorrect": false}, {"id": "VNMXd", "text": "$-2 \\sqrt{2}$", "image": null, "isCorrect": true}, {"id": "BgSNH", "text": "$+2 \\sqrt{2}$", "image": null, "isCorrect": false}, {"id": "WuUjG", "text": "$\\dfrac{+1}{\\sqrt{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the side length of the square be $a$. We analyze the forces acting on the charge $+Q$ placed at one of the corners (say, the top-left corner).<br><br>The forces acting on this $+Q$ charge are due to:<br>1. Two $-q$ charges located at adjacent corners (distance $a$).<br>2. One $+Q$ charge located at the diagonally opposite corner (distance $a\\sqrt{2}$).<br><br>The force exerted by each $-q$ charge is attractive and directed along the sides of the square. The magnitude of each force is:<br>$F_1 = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{Qq}{a^2}$<br><br>Since these two forces are perpendicular to each other, their resultant $F_{12}$ is directed along the diagonal towards the center of the square. Its magnitude is:<br>$F_{12} = \\sqrt{F_1^2 + F_1^2} = \\sqrt{2} F_1 = \\sqrt{2} \\left( \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{Qq}{a^2} \\right)$<br><br>The force exerted by the diagonally opposite $+Q$ charge is repulsive and directed along the diagonal away from the center of the square. Its magnitude is:<br>$F_3 = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{Q^2}{(a\\sqrt{2})^2} = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{Q^2}{2a^2}$<br><br>For the net electrical force on the $+Q$ charge to be zero, the attractive resultant force $F_{12}$ must perfectly balance the repulsive force $F_3$:<br>$F_{12} = F_3$<br><br>Substituting the magnitudes:<br>$\\sqrt{2} \\left( \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{Qq}{a^2} \\right) = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{Q^2}{2a^2}$<br><br>Canceling common terms on both sides, we get:<br>$\\sqrt{2} q = \\dfrac{Q}{2}$<br><br>$\\Rightarrow Q = 2\\sqrt{2} q$<br><br>The question asks for the ratio $\\dfrac{+Q}{-q}$. Substituting $Q = 2\\sqrt{2} q$ into the ratio:<br>$\\dfrac{+Q}{-q} = \\dfrac{+(2\\sqrt{2} q)}{-q} = -2\\sqrt{2}$<br><br>Answer: $-2 \\sqrt{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213460aee93fa0796d780", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Two equal point charges ' $q$ ' each exert a force ' $F$ ' on each other, when they are placed distance ' $x$ ' apart in air. When the same charges are placed distance ' $y$ ' apart in a medium of dielectric constant ' k ', they exert the same force. The ratio of distance ' $y$ ' to ' $x$ ' is equal to", "image": null}, "options": [{"id": "Zw91Y", "text": "$\\dfrac{1}{\\sqrt{\\mathrm{k}}}$", "image": null, "isCorrect": true}, {"id": "iD9m5", "text": "$\\sqrt{\\mathrm{k}}$", "image": null, "isCorrect": false}, {"id": "PjNcv", "text": "$\\dfrac{\\sqrt{\\mathrm{k}}}{2}$", "image": null, "isCorrect": false}, {"id": "1yVoF", "text": "$\\dfrac{2}{\\sqrt{\\mathrm{k}}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Force between two point charges in air is given by<br><br>$F = \\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q^2}{x^2}$<br><br>Force between the same charges in a medium of dielectric constant $k$ is given by<br><br>$F' = \\dfrac{1}{4\\pi\\epsilon_0 k} \\dfrac{q^2}{y^2}$<br><br>Given that $F = F'$, we have<br><br>$\\dfrac{1}{4\\pi\\epsilon_0} \\dfrac{q^2}{x^2} = \\dfrac{1}{4\\pi\\epsilon_0 k} \\dfrac{q^2}{y^2}$<br><br>$\\dfrac{1}{x^2} = \\dfrac{1}{k y^2}$<br><br>$y^2 = \\dfrac{x^2}{k}$<br><br>$y = \\dfrac{x}{\\sqrt{k}}$<br><br>$\\dfrac{y}{x} = \\dfrac{1}{\\sqrt{k}}$<br><br>Answer: $\\dfrac{1}{\\sqrt{\\mathrm{k}}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262690279619d9d8a3450", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "A conducting sphere of radius $0.1 \\mathrm{~m}$ has uniform charge dénsity $1.8 \\mu \\mathrm{C} / \\mathrm{m}^2$ on its surface. The electric field in free space at radial distance $0.2 \\mathrm{~m}$ from $\\alpha$ point on the surface is ( $\\varepsilon_0=$ permittivity of free space)", "image": null}, "options": [{"id": "5HIbK", "text": "$\\frac{6 \\times 10^{-6}}{\\varepsilon_0} \\mathrm{Vm}^{-1}$", "image": null, "isCorrect": false}, {"id": "9wqU2", "text": "$\\frac{6 \\times 10^{-8}}{\\varepsilon_0} \\mathrm{Vm}^{-1}$", "image": null, "isCorrect": false}, {"id": "RuQRi", "text": "$\\frac{2 \\times 10^{-7}}{\\varepsilon_0} \\mathrm{Vm}^{-1}$", "image": null, "isCorrect": true}, {"id": "NsYVM", "text": "$\\frac{1 \\times 10^{-7}}{\\varepsilon_0} \\mathrm{Vm}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\mathrm{q} & =\\sigma \\mathrm{A}=\\sigma \\pi \\mathrm{r}^2 \\\\ \\mathrm{E} & =\\frac{1}{4 \\pi \\varepsilon_0} \\times \\frac{\\mathrm{q}}{\\mathrm{d}^2}=\\frac{1}{4 \\pi \\varepsilon_0} \\times \\frac{\\sigma \\pi \\mathrm{r}^2}{\\mathrm{~d}^2} \\\\ & =\\frac{1}{4 \\pi \\varepsilon_0} \\times \\frac{1.8 \\times 10^{-6} \\times \\pi \\times 10^{-2}}{4 \\times 10^{-2}} \\\\ \\therefore \\quad \\mathrm{E} & =\\frac{1.125 \\times 10^{-7}}{\\varepsilon_0} \\approx \\frac{2 \\times 10^{-7}}{\\varepsilon_0} \\mathrm{Vm}^{-1}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262550279619d9d8a33ae", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "In the electric field due to a charge ' $Q$ ', a charge ' $q$ ' moves from point A to B. The work done is ( $\\varepsilon_0=$ permittivity of vacuum)\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/sUcu3Ipuukx_Kb5bw_dxP40Q028QOSaHkWaE2P5UL_8.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "4r4pj", "text": "$\\frac{1}{4 \\pi \\varepsilon_0} \\frac{\\mathrm{Qq}}{\\mathbf{r}^2}$", "image": null, "isCorrect": false}, {"id": "Jc767", "text": "$\\frac{1}{4 \\pi \\varepsilon_0} \\frac{\\mathrm{Qq}}{\\mathrm{r}} \\times \\frac{\\pi}{6}$", "image": null, "isCorrect": false}, {"id": "TyLDQ", "text": "$\\frac{1}{4 \\pi \\varepsilon_0} \\frac{\\mathrm{Qq}}{\\mathrm{r}}$", "image": null, "isCorrect": false}, {"id": "euGEn", "text": "Zero", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The points A and B are equipotential surfaces as both are at the same distance from the charge Q. Therefore, the work done is zero.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262440279619d9d8a3324", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "Three charges each of value $+q$ are placed at the corners of an isosceles triangle $\\mathrm{ABC}$ of sides $\\mathrm{AB}$ and $\\mathrm{AC}$ each equal to $2 \\mathrm{a}$. The mid points of $A B$ and $A C$ are $D$ and $E$ respectively. The work done in taking a charge $\\mathrm{Q}$ from $\\mathrm{D}$ to $\\mathrm{E}$ is $\\left(\\varepsilon_0=\\right.$ permittivity of free space)", "image": null}, "options": [{"id": "9LdXg", "text": "Zero", "image": null, "isCorrect": true}, {"id": "zim0L", "text": "$\\frac{3 \\mathrm{qQ}}{4 \\pi \\varepsilon_0 \\mathrm{a}}$", "image": null, "isCorrect": false}, {"id": "ulEdP", "text": "$\\frac{\\mathrm{qQ}}{8 \\pi \\varepsilon_0 \\mathrm{a}}$", "image": null, "isCorrect": false}, {"id": "mi7x9", "text": "$\\frac{3 \\mathrm{qQ}}{8 \\pi \\varepsilon_0 \\mathrm{a}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\text { Given } A B=A C=2 a \\\\\n& V_D=V_E \\quad(\\because D \\text { and } E \\text { are mid-points })\n\\end{aligned}\n$$\n$\\therefore \\quad$ The work done in taking a charge $\\mathrm{q}$ from $\\mathrm{D}$ to $\\mathrm{E}$ is\n$$\n\\begin{array}{rlrl} \n& W=q \\Delta V=q\\left(V_D-V_E\\right) \\\\\n\\therefore \\quad & W=0 & \\text { (Equipotential surfaces) }\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261f90279619d9d8a30d0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "An electron is projected along the axis of circular conductor carrying current I. Electron will experience", "image": null}, "options": [{"id": "zBJbV", "text": "no force.", "image": null, "isCorrect": true}, {"id": "vChdn", "text": "a force along the axis.", "image": null, "isCorrect": false}, {"id": "Z8wNu", "text": "a force at angle $30^{\\circ}$ with the axis.", "image": null, "isCorrect": false}, {"id": "hGlrj", "text": "a force perpendicular to axis.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The magn
