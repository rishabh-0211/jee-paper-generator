5d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fee0279619d9d8a205f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "An A.C. circuit contains resistance of $12 \\Omega$ and inductive reactance $5 \\Omega$. The phase\nangle between current and potential difference will be", "image": null}, "options": [{"id": "0FFdv", "text": "$\\cos ^{-1}\\left(\\frac{12}{13}\\right)$", "image": null, "isCorrect": true}, {"id": "6isTy", "text": "$\\sin ^{-1}\\left(\\frac{12}{13}\\right)$", "image": null, "isCorrect": false}, {"id": "4Czpx", "text": "$\\cos ^{-1}\\left(\\frac{5}{12}\\right)$", "image": null, "isCorrect": false}, {"id": "Xaqss", "text": "$\\sin ^{-1}\\left(\\frac{5}{12}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(B)\n$\\mathrm{R}=12 \\Omega, \\mathrm{X}=5 \\Omega$\n$\\therefore \\mathrm{Z}=\\sqrt{\\mathrm{R}^{2}+\\mathrm{X}^{2}}=\\sqrt{144+25}=13 \\Omega$\n$\\cos \\theta=\\frac{\\mathrm{R}}{\\mathrm{z}}=\\frac{12}{13}$\n$\\therefore \\theta=\\cos ^{-1} \\frac{12}{13}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fd50279619d9d8a1fa1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "An alternating current of frequency $50 \\mathrm{~Hz}$ has the peak value as $14 \\cdot 14 \\mathrm{~A}$. The time\ntaken by the alternating current in reaching from zero to maximum value and r.m.s. value of current will be respectively", "image": null}, "options": [{"id": "qRba3", "text": "$0.025 \\mathrm{~s}, 5 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "Mk8qG", "text": "$0 \\cdot 005 \\mathrm{~s}, 5 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "1EH80", "text": "$0 \\cdot 005 \\mathrm{~s}, 10 \\mathrm{~A}$", "image": null, "isCorrect": true}, {"id": "F2EIq", "text": "$0 \\cdot 025 \\mathrm{~s}, 10 \\mathrm{~A}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(D)\n$\\mathrm{f}=50 \\mathrm{~Hz}, \\mathrm{~T}=\\frac{1}{50} \\mathrm{~s}=0.02 \\mathrm{~s}$\nTime taken to reach from zero to maximum value is\n$\\begin{array}{l}\nt=\\frac{T}{4}=\\frac{0.02}{4}=0.005 \\mathrm{~s} \\\\\nI_{m s}=\\frac{I_{0}}{\\sqrt{2}}=\\frac{14.14}{1.414}=10 \\mathrm{~A}\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fc80279619d9d8a1f31", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "A circular coil of radius 'R' has a resistance of $40 \\Omega$. Figure shows two points 'P' and 'Q' on the circumference separated by a distance $\\frac{\\pi \\mathrm{R}}{2}$, which are connected to a $16 \\mathrm{~V}$ battery with internal resistance of $0.5 \\Omega$. What is the value of current 'I' flowing through the circuit?\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/Fb_2YZ7ZwEkI0SiShnr57n4GfNCCXbyeU03aib0jyKU.original.fullsize.png\">", "image": null}, "options": [{"id": "1BAF2", "text": "1A", "image": null, "isCorrect": false}, {"id": "q9Boe", "text": "0.5A", "image": null, "isCorrect": false}, {"id": "LKkhG", "text": "3A", "image": null, "isCorrect": false}, {"id": "fTznb", "text": "2A", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The total resistance between points $\\mathrm{P}$ and $\\mathrm{Q}$.\n$\\begin{array}{l}\n\\mathrm{RPQ}=(30 \\| 10+0.5) \\\\\n=\\frac{30 \\times 10}{30+10}+0.5=8 \\Omega\n\\end{array}$\nThe current flowing through the circuit,\n$\\begin{array}{l}\nV=I R_{P Q} \\\\\n\\Rightarrow I=\\frac{V}{R_{P Q}}\n\\end{array}$\nwhere, $V$ is the voltage of source.\n$\\therefore \\mathrm{I}=\\frac{16 \\mathrm{~V}}{8 \\Omega}=2 \\mathrm{~A}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fa10279619d9d8a1e01", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "Alternating current of peak value $\\left(\\frac{2}{\\pi}\\right)$ A flows through the primary coil of transformer. The coefficient of mutual inductance between primary and secondary coil is $1 \\mathrm{H}$. The peak e.m.f. induced in secondary coil is (Frequency of a.c. $=50 \\mathrm{~Hz}$ )", "image": null}, "options": [{"id": "X1v6g", "text": "$400 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "qOHaL", "text": "$200 \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "cKqnT", "text": "$300 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "UpM2L", "text": "$100 \\mathrm{~V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given \\(: \\mathrm{I}_{0}=\\frac{2}{\\pi}\\) ampere \\(v=50 \\mathrm{~Hz} \\mathrm{~L}=1 \\mathrm{H}\\)\nThus \\(w=2 \\pi v=2 \\pi(50)=100 \\pi\\)\nAlternating current flowing through the coil is given by \\(I=I_{0} \\sin w t\\) \nDifferentiating it wr.t. time we get \\(\\frac{\\mathrm{dI}}{\\mathrm{dt}}=\\mathrm{I}_{0} \\mathrm{w} \\cos w \\mathrm{t}\\) \\(\\left.\\therefore \\frac{\\mathrm{dI}}{\\mathrm{dt}}\\right|_{\\max }=\\mathrm{I}_{0} \\mathrm{~W}=\\frac{2}{\\pi} \\times 100 \\pi=200\\) ampere per second\nPeak e.m.f induced \\(\\mathcal{E}=\\mathrm{L} \\frac{\\mathrm{dI}}{\\mathrm{dt}}\\)\n\\(\\Longrightarrow \\mathcal{E}=1 \\times 200=200 \\mathrm{~V}\\", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f9d0279619d9d8a1de6", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "An alternating e.m.f. is given by e $=e_{0}$ sin wt. In what time the e.m.f. will have half its maximum value, if 'e' starts from zero? (T = Time period) $\\left(\\sin 30^{\\circ}=\\cos 60^{\\circ}=0 \\cdot 5, \\quad \\cos 30^{\\circ}=\\sin 60^{\\circ}=\\frac{\\sqrt{3}}{2}\\right)$", "image": null}, "options": [{"id": "25T8E", "text": "$\\frac{T}{12}$", "image": null, "isCorrect": true}, {"id": "xedxd", "text": "$\\frac{T}{16}$", "image": null, "isCorrect": false}, {"id": "DdXVo", "text": "$\\frac{T}{8}$", "image": null, "isCorrect": false}, {"id": "CdHMz", "text": "$\\frac{T}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\(\\frac{E_{0}}{2}=E_{0} \\sin \\left(\\frac{2 \\pi t}{T}\\right) \\therefore \\frac{1}{2}=\\frac{\\sin (\\pi)}{6}=\\frac{\\sin (2 \\pi t)}{T}\\)\n\\(\\therefore \\frac{2 \\pi t}{T}=\\frac{\\pi}{6} \\therefore T=\\frac{T}{12}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f790279619d9d8a1cc7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}], "question": {"text": "In a capactive circuit, the reactance of capacitor at frequency 'f' is ' $\\mathrm{X}_{\\mathrm{c}}{ }^{\\prime}$. What will be\nits reactance at frequency $4 \\mathrm{f} ?$", "image": null}, "options": [{"id": "OSrQp", "text": "$\\frac{\\mathrm{X}_{\\mathrm{C}}}{2}$", "image": null, "isCorrect": false}, {"id": "xeDfV", "text": "$\\frac{X_{C}}{4}$", "image": null, "isCorrect": true}, {"id": "mwphf", "text": "$\\frac{\\mathrm{X}_{\\mathrm{C}}}{8}$", "image": null, "isCorrect": false}, {"id": "gMAOm", "text": "$X_{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Capacitive reactance $\\mathrm{X}_{\\mathrm{c}}=\\frac{1}{2 \\pi \\mathrm{fC}}$\n$\\begin{array}{l}\n\\therefore \\frac{\\mathrm{X}_{\\mathrm{C}}^{\\prime}}{\\mathrm{X}_{\\mathrm{c}}}=\\frac{\\mathrm{f}}{\\mathrm{f}^{\\prime}}=\\frac{1}{4} \\\\\n\\therefore \\mathrm{X}_{\\mathrm{c}}^{\\prime}=\\frac{\\mathrm{X}_{\\mathrm{c}}}{4}\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f0c0279619d9d8a195b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}], "question": {"text": "An alternating voltage is given by <math><mi></mi><mi>E</mi><mo>=</mo><mn>100</mn><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mi>ω</mi><mo>+</mo><mfrac><mrow><mi>π</mi></mrow><mrow><mn>6</mn></mrow></mfrac></mrow></mfenced></mrow></mrow><mi>V</mi></math> . The voltage will be maximum for the first time when is (T = periodic time)", "image": null}, "options": [{"id": "c0QAV", "text": "<math><mfrac><mrow><mi>T</mi></mrow><mrow><mn>12</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "u7v8d", "text": ure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e980279619d9d8a15b8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "Power consumed in an AC circuit becomes zero if", "image": null}, "options": [{"id": "v11LW", "text": "inductance and resistance are both high", "image": null, "isCorrect": false}, {"id": "firDK", "text": "inductance and resistance are both low", "image": null, "isCorrect": false}, {"id": "wyoCH", "text": "inductance very high and resistance negligible", "image": null, "isCorrect": true}, {"id": "LYKrZ", "text": "inductance low and resistance high", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The power consumption in an AC circuit is zero when circuit contains only inductance or capacitance. So, for the given option when inductance is very high and resistance is negligible, then power consumed is zero.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e980279619d9d8a15b6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "Alternating voltage", "image": null}, "options": [{"id": "oeRd4", "text": "is independent of time", "image": null, "isCorrect": false}, {"id": "Dnp0Q", "text": "varies directly with time", "image": null, "isCorrect": false}, {"id": "rrTJq", "text": "varies inversely with time", "image": null, "isCorrect": false}, {"id": "VaemW", "text": "varies sinusoidaly with time", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Alternating voltage varies sinusoidaly with time.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e980279619d9d8a15b4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "The frequency of AC mains in India is", "image": null}, "options": [{"id": "zrwNt", "text": "$110 \\mathrm{Cs}^{-1}$", "image": null, "isCorrect": false}, {"id": "xmX8U", "text": "$50 \\mathrm{Cs}^{-1}$", "image": null, "isCorrect": true}, {"id": "qcVrf", "text": "$60 \\mathrm{Cs}^{-1}$", "image": null, "isCorrect": false}, {"id": "J4a3H", "text": "$120 \\mathrm{Cs}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Frequency of AC mains in India is $50 \\mathrm{C} / \\mathrm{s}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e980279619d9d8a15b3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "A choke coil is used as resistance in", "image": null}, "options": [{"id": "eMOVA", "text": "AC circuits", "image": null, "isCorrect": true}, {"id": "1wFP8", "text": "DC circuits", "image": null, "isCorrect": false}, {"id": "1KGpK", "text": "half wave rectifier circuits", "image": null, "isCorrect": false}, {"id": "7WGrb", "text": "Both in AC and DC circuits", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A choke coil is used as resistance in AC circuits.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e980279619d9d8a15b2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "In AC circuits choke is preferred to resistors because", "image": null}, "options": [{"id": "sybQs", "text": "choke coil is cheap", "image": null, "isCorrect": false}, {"id": "2iOaD", "text": "voltage increases", "image": null, "isCorrect": false}, {"id": "RRGP7", "text": "energy is not wasted", "image": null, "isCorrect": true}, {"id": "SDr6x", "text": "current increases", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In AC circuits choke coil is used to control current is without loss of energy.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e970279619d9d8a15af", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "AC measuring instruments measures", "image": null}, "options": [{"id": "wjcqf", "text": "peak value", "image": null, "isCorrect": false}, {"id": "3K7SP", "text": "rms value", "image": null, "isCorrect": true}, {"id": "lMR1A", "text": "any value", "image": null, "isCorrect": false}, {"id": "aHHKd", "text": "average value", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "AC measuring instrument (AC ammeter and voltemeter) always measures rms value.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e760279619d9d8a14a3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "Average power in the $L-C-R$ circuit depends upon", "image": null}, "options": [{"id": "XqAXj", "text": "current", "image": null, "isCorrect": false}, {"id": "8VTHm", "text": "phase difference only", "image": null, "isCorrect": false}, {"id": "AfnCc", "text": "emf", "image": null, "isCorrect": false}, {"id": "0NiZf", "text": "current, emf and phase difference", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The average power of $L-C-R$ circuit\n$$\nP_{\\text {av }}=V_{\\text {rms }} \\cdot i_{\\mathrm{rms}} \\cos \\phi\n$$\nHence, the average power depends upon current, emf and phase difference.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e650279619d9d8a1417", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "An alternating volta ge $E=200 \\sqrt{2} \\sin (100 t)$ is connected to 1 microfarad capacitor through AC ammeter. The reading of ammeter shall be", "image": null}, "options": [{"id": "JIPao", "text": "$10 \\mathrm{~mA}$", "image": null, "isCorrect": false}, {"id": "GVLxY", "text": "$20 \\mathrm{~mA}$", "image": null, "isCorrect": true}, {"id": "x38WB", "text": "$40 \\mathrm{~mA}$", "image": null, "isCorrect": false}, {"id": "dT3ob", "text": "$80 \\mathrm{~mA}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Reading of ammeter $=I_{\\mathrm{rms}}=\\frac{V_{\\mathrm{rms}}}{X_{C}}=\\frac{V_{0} \\omega C}{\\sqrt{2}}$\n$$\n\\begin{array}{l}\n=\\frac{200 \\sqrt{2} \\times 100 \\times\\left(1 \\times 10^{-6}\\right)}{\\sqrt{2}}=2 \\times 10^{-2} \\mathrm{~A} \\\\\n=20 \\mathrm{~mA}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e650279619d9d8a1414", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "In an AC circuit, the instantaneous values of emf and current are $e=200 \\sin 314 t$ volt and $I=\\sin \\left(314 t+\\frac{\\pi}{3}\\right)$ amp. The average power\nconsumed in watt is", "image": null}, "options": [{"id": "DGgrY", "text": "200", "image": null, "isCorrect": false}, {"id": "1rjGT", "text": "100", "image": null, "isCorrect": false}, {"id": "QG7qi", "text": "50", "image": null, "isCorrect": true}, {"id": "6Dw3T", "text": "25", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$V_{\\mathrm{rms}}=\\frac{200}{\\sqrt{2}}, I_{\\mathrm{rms}}=\\frac{1}{\\sqrt{2}}$\n$\\therefore \\quad P=V_{\\mathrm{rms}} I_{\\mathrm{rms}} \\cos \\phi$\n$$\n=\\frac{200}{\\sqrt{2}} \\frac{1}{\\sqrt{2}} \\cos \\frac{\\pi}{3}=50 \\mathrm{~W}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e4f0279619d9d8a1367", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "In an AC circuit the emf $(e)$ and the current (i) at any instant are given respectively by\n$$\n\\begin{array}{l}\ne=E_{0} \\sin \\omega t \\\\\ni=I_{0} \\sin (\\omega t-\\phi)\n\\end{array}\n$$\nThe average power in the circuit over one cycle of AC is", "image": null}, "options": [{"id": "u4HGd", "text": "$\\frac{E_{0} I_{0}}{2}$", "image": null, "isCorrect": false}, {"id": "K8uFF", "text": "$\\frac{E_{0} I_{0}}{2} \\sin \\phi$", "image": null, "isCorrect": false}, {"id": "jgCuQ", "text": "$\\frac{E_{0} I_{0}}{2} \\cos \\phi$", "image": null, "isCorrect": true}, {"id": "5UR11", "text": "$E_{0} I_{0}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Power $=$ rate of work done in one complete cycle.\nOr\n$$\nP_{\\mathrm{av}}=\\frac{W}{T}\n$$\nOr\n$$\nP_{\\mathrm{av}}=\\frac{\\left(E_{0} I_{0} \\cos \\phi\\right) T / 2}{T}\n$$\nor\n$$\nP_{\\mathrm{av}}=\\frac{E_{0} I_{0} \\cos \\phi}{2}\n$$\nwhere $\\cos \\phi$ is called the power factor of an $\\mathrm{AC}$ circuit.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a263290279619d9d8a3c85", "title": "AC Circuits", "totalQuestions": 182, "questions": [{"_id": "6abb88cb15a9fc0fc8c14711", "type": "singleCorrect", "question": {"text": "A resistor of $200\\,\\Omega$, an inductor of self inductance $\\left(\\dfrac{2}{\\pi^2}\\right)$ H and a capacitor of unknown capacity are connected in series to an a.c. source of $100$ V and $50$ Hz. When the current and voltage are in phase the capacitance and the power dissipated is", "image": null}, "options": [{"id": "k6BeA", "label": "A", "text": "$2\\times 10^{-5}$ F, $25$ W", "isCorrect": false, "image": null}, {"id": "Hugv9", "label": "B", "text": "$4\\times 10^{-5}$ F, $100$ W", "isCorrect": false, "image": null}, {"id": "OCzew", "label": "C", "text": "$5\\times 10^{-5}$ F, $50$ W", "isCorrect": true, "image": null}, {"id": "LR6eL", "label": "D", "text": "$3\\times 10^{-5}$ F, $200$ W", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $R = 200\\,\\Omega$, $L = \\dfrac{2}{\\pi^2}$ H, $V_{rms} = 100$ V, and $f = 50$ Hz.<br><br>Since the current and voltage are in phase, the circuit is in resonance. At resonance, the inductive reactance equals the capacitive reactance ($X_L = X_C$).<br><br>$\\omega L = \\dfrac{1}{\\omega C}$<br><br>$C = \\dfrac{1}{\\omega^2 L} = \\dfrac{1}{(2\\pi f)^2 L}$<br><br>Substituting the given values:<br><br>$C = \\dfrac{1}{(2\\pi \\times 50)^2 \\times \\left(\\dfrac{2}{\\pi^2}\\right)} = \\dfrac{1}{10000\\pi^2 \\times \\dfrac{2}{\\pi^2}} = \\dfrac{1}{20000} = 5 \\times 10^{-5}$ F<br><br>At resonance, the total impedance of the circuit is purely resistive, so $Z = R = 200\\,\\Omega$.<br><br>The power dissipated is given by:<br><br>$P = \\dfrac{V_{rms}^2}{R} = \\dfrac{(100)^2}{200} = \\dfrac{10000}{200} = 50$ W<br><br>Answer: $5\\times 10^{-5}$ F, $50$ W", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889f15a9fc0fc8c1456e", "type": "singleCorrect", "question": {"text": "A $40$ $\\mu$F capacitor is charged to $10$ volts of potential. The battery is disconnected, and a pure $100$ mH coil is connected across the capacitor so that LC oscillations are set up. Then, the maximum current in the coil is:", "image": null}, "options": [{"id": "FPFti", "label": "A", "text": "$0.25$ A", "isCorrect": false, "image": null}, {"id": "hL7Oz", "label": "B", "text": "$0.10$ A", "isCorrect": false, "image": null}, {"id": "xxW9m", "label": "C", "text": "$0.30$ A", "isCorrect": false, "image": null}, {"id": "6n3lq", "label": "D", "text": "$0.20$ A", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The maximum energy stored in the capacitor is equal to the maximum energy stored in the inductor during LC oscillations.<br><br>$\\dfrac{1}{2} C V^2 = \\dfrac{1}{2} L I_{max}^2$<br><br>$I_{max} = V \\sqrt{\\dfrac{C}{L}}$<br><br>Substituting the given values:<br><br>$I_{max} = 10 \\sqrt{\\dfrac{40 \\times 10^{-6}}{100 \\times 10^{-3}}}$<br><br>$I_{max} = 10 \\sqrt{\\dfrac{40 \\times 10^{-6}}{0.1}}$<br><br>$I_{max} = 10 \\sqrt{400 \\times 10^{-6}}$<br><br>$I_{max} = 10 \\times 20 \\times 10^{-3}$<br><br>$I_{max} = 0.20 \\text{ A}$<br><br>Answer: $0.20$ A", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889d15a9fc0fc8c1455a", "type": "singleCorrect", "question": {"text": "To reduce the resonant frequency in an L-C-R series circuit with a generator,", "image": null}, "options": [{"id": "3GBgv", "label": "A", "text": "the iron core of the inductor should be removed and the value of the capacitor is kept constant.", "isCorrect": false, "image": null}, {"id": "R9tZB", "label": "B", "text": "the dielectric in the capacitor should be removed and the value of the inductor is kept constant.", "isCorrect": false, "image": null}, {"id": "o4zlP", "label": "C", "text": "the generator frequency should be reduced.", "isCorrect": false, "image": null}, {"id": "7ZrIr", "label": "D", "text": "another capacitor should be added in parallel to the first capacitor and the value of the inductor is kept constant.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The resonant frequency of an L-C-R series circuit is given by $f_r = \\dfrac{1}{2\\pi\\sqrt{LC}}$.<br><br>To reduce the resonant frequency $f_r$, the value of the inductance $L$ or the capacitance $C$ must be increased.<br><br>Removing the iron core of the inductor decreases its inductance $L$, which would increase $f_r$.<br><br>Removing the dielectric in the capacitor decreases its capacitance $C$, which would also increase $f_r$.<br><br>The resonant frequency is a characteristic of the circuit components and is independent of the generator frequency.<br><br>Adding another capacitor in parallel to the first capacitor increases the equivalent capacitance of the circuit ($C_{eq} = C_1 + C_2$). An increase in $C$ results in a decrease in the resonant frequency $f_r$.<br><br>Answer: another capacitor should be added in parallel to the first capacitor and the value of the inductor is kept constant.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883f15a9fc0fc8c141e4", "type": "singleCorrect", "question": {"text": "In a discharging series L-C-R circuit, $C = 2 \\text{ }\\mu\\text{F}$, $L = 1 \\text{ mH}$ and $R = 10 \\text{ }\\Omega$. The ratio of the energies stored in the inductor and in the capacitor, when the maximum current flows in the circuit, is", "image": null}, "options": [{"id": "v9MMO", "label": "A", "text": "$2:1$", "isCorrect": false, "image": null}, {"id": "JdTm4", "label": "B", "text": "$3:1$", "isCorrect": false, "image": null}, {"id": "ixvvd", "label": "C", "text": "$3:2$", "isCorrect": false, "image": null}, {"id": "wUD8t", "label": "D", "text": "$5:1$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For a discharging series L-C-R circuit, the voltage equation is given by:<br><br>$L \\dfrac{di}{dt} + iR + \\dfrac{q}{C} = 0$<br><br>When the current $i$ is maximum, its rate of change is zero, so $\\dfrac{di}{dt} = 0$. Substituting this into the equation gives:<br><br>$iR + \\dfrac{q}{C} = 0 \\Rightarrow q = -iRC$<br><br>The energy stored in the inductor is:<br><br>$U_L = \\dfrac{1}{2}Li^2$<br><br>The energy stored in the capacitor is:<br><br>$U_C = \\dfrac{q^2}{2C} = \\dfrac{(-iRC)^2}{2C} = \\dfrac{1}{2}CR^2i^2$<br><br>The ratio of the energy stored in the inductor to that in the capacitor is:<br><br>$\\dfrac{U_L}{U_C} = \\dfrac{\\dfrac{1}{2}Li^2}{\\dfrac{1}{2}CR^2i^2} = \\dfrac{L}{CR^2}$<br><br>Given the values:<br>$L = 1 \\text{ mH} = 10^{-3} \\text{ H}$<br>$C = 2 \\text{ }\\mu\\text{F} = 2 \\times 10^{-6} \\text{ F}$<br>$R = 10 \\text{ }\\Omega$<br><br>Substituting these values into the ratio:<br><br>$\\dfrac{U_L}{U_C} = \\dfrac{10^{-3}}{2 \\times 10^{-6} \\times (10)^2} = \\dfrac{10^{-3}}{2 \\times 10^{-4}} = \\dfrac{10}{2} = 5$<br><br>Thus, the ratio of the energies is $5:1$.<br><br>Answer: $5:1$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883f15a9fc0fc8c141e3", "type": "singleCorrect", "question": {"text": "An inductor of inductance $L$ and a resistor of resistance $R$ are joined in series and connected to an a.c. source of frequency $\\omega$. The power dissipated in the circuit is", "image": null}, "options": [{"id": "FEubj", "label": "A", "text": "$\\dfrac{(R^2 + \\omega^2 L^2)}{V}$", "isCorrect": false, "image": null}, {"id": "eUMgS", "label": "B", "text": "$\\dfrac{V}{(R^2 + \\omega^2 L^2)}$", "isCorrect": false, "image": null}, {"id": "cv6LM", "label": "C", "text": "$\\dfrac{V^2 R}{(R^2 + \\omega^2 L^2)}$", "isCorrect": true, "image": null}, {"id": "ripcA", "label": "D", "text": "$\\sqrt{\\dfrac{R^2 + \\omega^2 L^2}{V^2}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The impedance of the series LR circuit is given by $Z = \\sqrt{R^2 + \\omega^2 L^2}$.<br><br>The rms current flowing through the circuit is $I = \\dfrac{V}{Z} = \\dfrac{V}{\\sqrt{R^2 + \\omega^2 L^2}}$.<br><br>The average power dissipated in the circuit is only due to the resistor, which is given by $P = I^2 R$.<br><br>Substituting the value of $I$, we get:<br><br>$P = \\left( \\dfrac{V}{\\sqrt{R^2 + \\omega^2 L^2}} \\right)^2 R = \\dfrac{V^2 R}{R^2 + \\omega^2 L^2}$.<br><br>Answer: $\\dfrac{V^2 R}{(R^2 + \\omega^2 L^2)}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884f15a9fc0fc8c1427c", "type": "singleCorrect", "question": {"text": "Same current is flowing in two AC circuits. First contains only inductance and second contains only capacitance. If frequency of AC is increased for both, the current will", "image": null}, "options": [{"id": "boHSy", "label": "A", "text": "increase in first circuit and decrease in second", "isCorrect": false, "image": null}, {"id": "mvi87", "label": "B", "text": "increase in both circuits", "isCorrect": false, "image": null}, {"id": "hRSrS", "label": "C", "text": "decrease in both circuits", "isCorrect": false, "image": null}, {"id": "92vlI", "label": "D", "text": "decrease in first circuit and increase in second", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For an AC circuit containing only inductance, the inductive reactance is $X_L = \\omega L = 2\\pi f L$.<br><br>The current in the inductive circuit is $I_L = \\dfrac{V}{X_L} = \\dfrac{V}{2\\pi f L}$.<br><br>When the frequency $f$ is increased, $X_L$ increases, so the current $I_L$ decreases.<br><br>For an AC circuit containing only capacitance, the capacitive reactance is $X_C = \\dfrac{1}{\\omega C} = \\dfrac{1}{2\\pi f C}$.<br><br>The current in the capacitive circuit is $I_C = \\dfrac{V}{X_C} = V(2\\pi f C)$.<br><br>When the frequency $f$ is increased, $X_C$ decreases, so the current $I_C$ increases.<br><br>Thus, the current decreases in the first circuit and increases in the second circuit.<br><br>Answer: decrease in first circuit and increase in second", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88ac15a9fc0fc8c145ee", "type": "singleCorrect", "question": {"text": "The natural frequency of L-C circuit is $125000$ Hz. Then the capacitor C is replaced by another capacitor with a dielectric medium of dielectric constant K. Now the frequency decreases by $25$ KHz. The value of K is", "image": null}, "options": [{"id": "ohPoN", "label": "A", "text": "$3.0$", "isCorrect": false, "image": null}, {"id": "AN1bN", "label": "B", "text": "$2.1$", "isCorrect": false, "image": null}, {"id": "e3BNS", "label": "C", "text": "$1.56$", "isCorrect": true, "image": null}, {"id": "EqVA9", "label": "D", "text": "$1.7$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The natural frequency of an L-C circuit is given by $f = \\dfrac{1}{2\\pi\\sqrt{LC}}$.<br><br>Initially, $f_1 = 125000$ Hz.<br><br>When the capacitor is replaced by one with a dielectric medium of dielectric constant $K$, the new capacitance is $C' = KC$.<br><br>The new frequency is $f_2 = \\dfrac{1}{2\\pi\\sqrt{L(KC)}} = \\dfrac{f_1}{\\sqrt{K}}$.<br><br>Given that the frequency decreases by $25$ kHz, $f_2 = 125000 - 25000 = 100000$ Hz.<br><br>Substituting the values, $100000 = \\dfrac{125000}{\\sqrt{K}}$.<br><br>$\\sqrt{K} = \\dfrac{125000}{100000} = \\dfrac{5}{4} = 1.25$<br><br>$K = (1.25)^2 = 1.5625 \\approx 1.56$<br><br>Answer: $1.56$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88ac15a9fc0fc8c145ed", "type": "singleCorrect", "question": {"text": "Which one of the following graph represents the correct variation of inductive reactance ($X_L$) with angular frequency ($\\omega$)?<br><img style=\"width: 400px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/may/watermarked_images/15_may_shift_1__q27_d1.png\" />", "image": null}, "options": [{"id": "e9NTu", "label": "A", "text": "A", "isCorrect": false, "image": null}, {"id": "6ADb3", "label": "B", "text": "B", "isCorrect": true, "image": null}, {"id": "3k5St", "label": "C", "text": "C", "isCorrect": false, "image": null}, {"id": "jpfDh", "label": "D", "text": "D", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The inductive reactance $X_L$ of an inductor is given by the formula:<br><br>$X_L = \\omega L$<br><br>where $\\omega$ is the angular frequency and $L$ is the inductance.<br><br>This equation is of the form $y = mx$, which represents a straight line passing through the origin with a positive slope (since $L > 0$).<br><br>Looking at the given graphs, graph (B) correctly shows a straight line passing through the origin, representing the direct proportionality between $X_L$ and $\\omega$.<br><br>Answer: B", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886d15a9fc0fc8c1439c", "type": "singleCorrect", "question": {"text": "An arc lamp requires a direct current of $10$ A at $90$ V to function. If it is connected to $220$ V (rms), $50$ Hz a.c. supply, the series inductor needed for it to work is nearly", "image": null}, "options": [{"id": "KEAM2", "label": "A", "text": "$\\dfrac{1}{\\pi}$ H", "isCorrect": false, "image": null}, {"id": "RYYk2", "label": "B", "text": "$\\dfrac{1}{5\\pi}$ H", "isCorrect": true, "image": null}, {"id": "AMLzn", "label": "C", "text": "$\\dfrac{1}{2\\pi}$ H", "isCorrect": false, "image": null}, {"id": "QYV2B", "label": "D", "text": "$\\dfrac{1}{4\\pi}$ H", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Resistance of the arc lamp, $R = \\dfrac{V}{I} = \\dfrac{90}{10} = 9\\ \\Omega$<br><br>In the AC circuit, the required rms current is $I_{rms} = 10$ A.<br><br>The impedance of the circuit is $Z = \\dfrac{V_{rms}}{I_{rms}} = \\dfrac{220}{10} = 22\\ \\Omega$<br><br>The impedance of an LR circuit is given by $Z = \\sqrt{R^2 + X_L^2}$<br><br>Substituting the values, $22 = \\sqrt{9^2 + X_L^2}$<br><br>$X_L^2 = 22^2 - 9^2 = 484 - 81 = 403$<br><br>$X_L = \\sqrt{403} \\approx 20\\ \\Omega$<br><br>The inductive reactance is $X_L = \\omega L = 2\\pi f L$<br><br>$20 = 2\\pi \\times 50 \\times L = 100\\pi L$<br><br>$L = \\dfrac{20}{100\\pi} = \\dfrac{1}{5\\pi}$ H<br><br>Answer: $\\dfrac{1}{5\\pi}$ H", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886d15a9fc0fc8c1439a", "type": "singleCorrect", "question": {"text": "A $10\\ \\mu$F capacitor is charged to $25$ V of potential. The battery is then disconnected and a pure $100$ mH coil is connected across the capacitor so that L-C oscillations are set up. The maximum current in the coil is", "image": null}, "options": [{"id": "4HFwx", "label": "A", "text": "$0.25$ A", "isCorrect": true, "image": null}, {"id": "P5daT", "label": "B", "text": "$0.01$ A", "isCorrect": false, "image": null}, {"id": "5Oz2u", "label": "C", "text": "$2.5$ A", "isCorrect": false, "image": null}, {"id": "NPdmy", "label": "D", "text": "$1.6$ A", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "By the principle of conservation of energy, the maximum energy stored in the capacitor is equal to the maximum energy stored in the inductor during L-C oscillations.<br><br>$\\dfrac{1}{2}CV^2 = \\dfrac{1}{2}LI_{max}^2$<br><br>$I_{max} = V \\sqrt{\\dfrac{C}{L}}$<br><br>Substituting the given values $V = 25$ V, $C = 10 \\times 10^{-6}$ F, and $L = 100 \\times 10^{-3}$ H:<br><br>$I_{max} = 25 \\sqrt{\\dfrac{10 \\times 10^{-6}}{100 \\times 10^{-3}}}$<br><br>$I_{max} = 25 \\sqrt{10^{-4}}$<br><br>$I_{max} = 25 \\times 10^{-2} = 0.25$ A<br><br>Answer: $0.25$ A", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887c15a9fc0fc8c14429", "type": "singleCorrect", "question": {"text": "A coil of self inductance $L$ is connected in series with a bulb B and an a.c. source. Brightness of the bulb decreases when", "image": null}, "options": [{"id": "WdXyX", "label": "A", "text": "frequency of a.c. source is decreased", "isCorrect": false, "image": null}, {"id": "VT192", "label": "B", "text": "number of turns in the coil is reduced", "isCorrect": false, "image": null}, {"id": "tLVMd", "label": "C", "text": "an iron rod is inserted in the coil", "isCorrect": true, "image": null}, {"id": "i5DLB", "label": "D", "text": "a capacitance of reactance $X_c$ is included in the same circuit", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The brightness of the bulb depends on the current flowing through it. The current in the AC circuit is given by $I = \\dfrac{V}{Z}$, where the impedance $Z = \\sqrt{R^2 + X_L^2}$ and $X_L = \\omega L = 2\\pi f L$.<br><br>To decrease the brightness of the bulb, the current $I$ must decrease, which requires the impedance $Z$ to increase.<br><br>When an iron rod is inserted into the coil, the magnetic permeability of the core increases, which increases the self-inductance $L$ of the coil. An increase in $L$ leads to an increase in the inductive reactance $X_L$ and the total impedance $Z$. As a result, the current $I$ decreases, and the brightness of the bulb decreases.<br><br>Answer: an iron rod is inserted in the coil", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888e15a9fc0fc8c144d1", "type": "singleCorrect", "question": {"text": "An inductance of negligible resistance, whose reactance is $120$ $\\Omega$ at $200$ Hz is connected to a $240$ V, $60$ Hz Power line. The current in the inductor is", "image": null}, "options": [{"id": "qwoTr", "label": "A", "text": "$6.66$ A", "isCorrect": true, "image": null}, {"id": "cmZQV", "label": "B", "text": "$6.60$ A", "isCorrect": false, "image": null}, {"id": "bGNPe", "label": "C", "text": "$5.45$ A", "isCorrect": false, "image": null}, {"id": "Wr8cG", "label": "D", "text": "$54.5$ A", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The inductive reactance is given by $X_L = 2 \\pi f L$.<br><br>Since $X_L \\propto f$, the reactance at $60$ Hz is<br><br>$X_{L2} = X_{L1} \\times \\dfrac{f_2}{f_1} = 120 \\times \\dfrac{60}{200} = 36$ $\\Omega$<br><br>The current in the inductor is<br><br>$I = \\dfrac{V}{X_{L2}} = \\dfrac{240}{36} = \\dfrac{20}{3} = 6.66$ A<br><br>Answer: $6.66$ A", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888e15a9fc0fc8c144cf", "type": "singleCorrect", "question": {"text": "An alternating voltage $V = 200\\sqrt{2} \\sin(100t)$ volt is connected to a $1$ $\\mu$F capacitor through an a.c. ammeter. The reading of the ammeter will be", "image": null}, "options": [{"id": "7lKQN", "label": "A", "text": "$10$ mA", "isCorrect": false, "image": null}, {"id": "0l4aE", "label": "B", "text": "$20$ mA", "isCorrect": true, "image": null}, {"id": "cr4wd", "label": "C", "text": "$40$ mA", "isCorrect": false, "image": null}, {"id": "cRrQL", "label": "D", "text": "$80$ mA", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given alternating voltage is $V = 200\\sqrt{2} \\sin(100t)$ V.<br><br>Comparing this with the standard equation $V = V_0 \\sin(\\omega t)$, we get:<br>Peak voltage, $V_0 = 200\\sqrt{2}$ V<br>Angular frequency, $\\omega = 100$ rad/s<br><br>The rms voltage is given by:<br>$V_{rms} = \\dfrac{V_0}{\\sqrt{2}} = \\dfrac{200\\sqrt{2}}{\\sqrt{2}} = 200$ V<br><br>The capacitive reactance $X_C$ is:<br>$X_C = \\dfrac{1}{\\omega C} = \\dfrac{1}{100 \\times 10^{-6}} = 10^4 \\ \\Omega$<br><br>The reading of an a.c. ammeter is the rms value of the current. Thus, the rms current $I_{rms}$ is:<br>$I_{rms} = \\dfrac{V_{rms}}{X_C} = \\dfrac{200}{10^4} = 20 \\times 10^{-3}$ A<br><br>$I_{rms} = 20$ mA<br><br>Answer: $20$ mA", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885f15a9fc0fc8c1430e", "type": "singleCorrect", "question": {"text": "For series LCR circuit, the current is observed to lead the applied voltage. An additional capacitor $C_1$ when joined with capacitor C, makes the power factor of the circuit unity. The capacitor $C_1$ must be connected in", "image": null}, "options": [{"id": "xJ7Yx", "label": "A", "text": "series with C and has magnitude $\\dfrac{C}{(\\omega^2 LC - 1)}$", "isCorrect": false, "image": null}, {"id": "AgK1I", "label": "B", "text": "series with C and has magnitude $\\dfrac{(1 - \\omega^2 LC)}{\\omega^2 L}$", "isCorrect": false, "image": null}, {"id": "ZBy8l", "label": "C", "text": "parallel with C and has magnitude $\\dfrac{(1 - \\omega^2 LC)}{\\omega^2 L}$", "isCorrect": true, "image": null}, {"id": "FpynA", "label": "D", "text": "parallel with C and has magnitude $\\dfrac{C}{(\\omega^2 LC - 1)}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Since the current leads the applied voltage, the circuit is capacitive, which means $X_C > X_L$.<br><br>$\\dfrac{1}{\\omega C} > \\omega L \\Rightarrow C < \\dfrac{1}{\\omega^2 L}$<br><br>To make the power factor unity, the circuit must be in resonance. The new equivalent capacitance $C_{eq}$ must satisfy $X_{C_{eq}} = X_L$.<br><br>$\\dfrac{1}{\\omega C_{eq}} = \\omega L \\Rightarrow C_{eq} = \\dfrac{1}{\\omega^2 L}$<br><br>Since $C_{eq} > C$, the equivalent capacitance must be increased. Therefore, the additional capacitor $C_1$ must be connected in parallel with $C$.<br><br>$C_{eq} = C + C_1$<br><br>$C_1 = C_{eq} - C = \\dfrac{1}{\\omega^2 L} - C = \\dfrac{1 - \\omega^2 LC}{\\omega^2 L}$<br><br>Answer: parallel with C and has magnitude $\\dfrac{(1 - \\omega^2 LC)}{\\omega^2 L}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885e15a9fc0fc8c1430d", "type": "singleCorrect", "question": {"text": "What is the value of inductance L for which the current is maximum in series LCR circuit with $C = 10$ $\\mu$F and $\\omega = 1000$/s ?", "image": null}, "options": [{"id": "N3WEh", "label": "A", "text": "$100$ mH", "isCorrect": true, "image": null}, {"id": "gr2MB", "label": "B", "text": "$1$ mH", "isCorrect": false, "image": null}, {"id": "QG18D", "label": "C", "text": "$10$ mH", "isCorrect": false, "image": null}, {"id": "x6RYL", "label": "D", "text": "$1000$ mH", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In a series LCR circuit, the current is maximum at resonance.<br><br>At resonance, the inductive reactance is equal to the capacitive reactance:<br><br>$\\omega L = \\dfrac{1}{\\omega C}$<br><br>$L = \\dfrac{1}{\\omega^2 C}$<br><br>Substituting the given values, $\\omega = 1000 \\text{ s}^{-1}$ and $C = 10 \\mu\\text{F} = 10 \\times 10^{-6} \\text{ F}$:<br><br>$L = \\dfrac{1}{(1000)^2 \\times 10 \\times 10^{-6}}$<br><br>$L = \\dfrac{1}{10^6 \\times 10^{-5}}$<br><br>$L = \\dfrac{1}{10} \\text{ H}$<br><br>$L = 0.1 \\text{ H} = 100 \\text{ mH}$<br><br>Answer: $100$ mH", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885e15a9fc0fc8c1430c", "type": "singleCorrect", "question": {"text": "In an LCR series circuit, a. c. voltage source is connected in series. When L is removed from the circuit, the phase difference between the voltage and the current is $\\pi/3$. If instead C is removed, the phase difference is again $\\pi/3$. The power factor of the circuit is $\\left(\\tan \\dfrac{\\pi}{3} = \\sqrt{3}\\right)$", "image": null}, "options": [{"id": "zqGtD", "label": "A", "text": "$0.5$", "isCorrect": false, "image": null}, {"id": "OhT1n", "label": "B", "text": "$\\dfrac{1}{\\sqrt{2}}$", "isCorrect": false, "image": null}, {"id": "WhECk", "label": "C", "text": "$1$", "isCorrect": true, "image": null}, {"id": "0e3jQ", "label": "D", "text": "$\\dfrac{\\sqrt{3}}{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "When L is removed, the circuit becomes an RC circuit. The phase difference $\\phi_1$ is given by:<br><br>$\\tan \\phi_1 = \\dfrac{X_C}{R}$<br><br>Given $\\phi_1 = \\dfrac{\\pi}{3}$, we have $\\dfrac{X_C}{R} = \\tan \\dfrac{\\pi}{3} = \\sqrt{3} \\Rightarrow X_C = R\\sqrt{3}$<br><br>When C is removed, the circuit becomes an RL circuit. The phase difference $\\phi_2$ is given by:<br><br>$\\tan \\phi_2 = \\dfrac{X_L}{R}$<br><br>Given $\\phi_2 = \\dfrac{\\pi}{3}$, we have $\\dfrac{X_L}{R} = \\tan \\dfrac{\\pi}{3} = \\sqrt{3} \\Rightarrow X_L = R\\sqrt{3}$<br><br>For the LCR series circuit, the net reactance is $X = X_L - X_C$.<br><br>Since $X_L = X_C = R\\sqrt{3}$, we get $X = 0$.<br><br>The impedance of the circuit is $Z = \\sqrt{R^2 + (X_L - X_C)^2} = R$.<br><br>The power factor of the LCR circuit is $\\cos \\phi = \\dfrac{R}{Z} = \\dfrac{R}{R} = 1$.<br><br>Answer: $1$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88bf15a9fc0fc8c14698", "type": "singleCorrect", "question": {"text": "An inductor of self inductance $1$H connected in series with a resistor of $100\\,\\pi\\,\\Omega$ and an a.c. supply of $100\\,\\pi$V, $50$ Hz. Maximum current flowing in the circuit in ampere is", "image": null}, "options": [{"id": "AYlyq", "label": "A", "text": "$0.5$", "isCorrect": false, "image": null}, {"id": "t6oax", "label": "B", "text": "$1$", "isCorrect": true, "image": null}, {"id": "Z0F69", "label": "C", "text": "$1.5$", "isCorrect": false, "image": null}, {"id": "L82gq", "label": "D", "text": "$2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The inductive reactance is given by $X_L = \\omega L = 2\\pi f L$.<br><br>Substituting the given values:<br><br>$X_L = 2\\pi \\times 50 \\times 1 = 100\\pi\\,\\Omega$<br><br>The impedance of the series LR circuit is:<br><br>$Z = \\sqrt{R^2 + X_L^2}$<br><br>$Z = \\sqrt{(100\\pi)^2 + (100\\pi)^2} = 100\\pi\\sqrt{2}\\,\\Omega$<br><br>The rms current in the circuit is:<br><br>$I_{rms} = \\dfrac{V_{rms}}{Z} = \\dfrac{100\\pi}{100\\pi\\sqrt{2}} = \\dfrac{1}{\\sqrt{2}}$ A<br><br>The maximum (peak) current is:<br><br>$I_0 = I_{rms}\\sqrt{2} = \\dfrac{1}{\\sqrt{2}} \\times \\sqrt{2} = 1$ A<br><br>Answer: $1$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88be15a9fc0fc8c1468e", "type": "singleCorrect", "question": {"text": "In the given circuit, r.m.s. value of current through the resistor $R$ is<br><img style=\"width: 350px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/may/watermarked_images/12_may_shift_2__q38_d1.png\" />", "image": null}, "options": [{"id": "5TckM", "label": "A", "text": "$20$ A", "isCorrect": false, "image": null}, {"id": "5GhWY", "label": "B", "text": "$2$ A", "isCorrect": true, "image": null}, {"id": "s4RYR", "label": "C", "text": "$0.5$ A", "isCorrect": false, "image": null}, {"id": "7faYe", "label": "D", "text": "$2\\sqrt{2}$ A", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given parameters of the series RLC circuit are:<br>$X_L = 200 \\, \\Omega$<br>$X_C = 100 \\, \\Omega$<br>$R = 100 \\, \\Omega$<br>$V_{rms} = 200\\sqrt{2} \\, \\text{V}$<br><br>The total impedance $Z$ of the series circuit is given by:<br>$Z = \\sqrt{R^2 + (X_L - X_C)^2}$<br><br>Substituting the given values:<br>$Z = \\sqrt{100^2 + (200 - 100)^2}$<br>$Z = \\sqrt{100^2 + 100^2}$<br>$Z = 100\\sqrt{2} \\, \\Omega$<br><br>The r.m.s. current $I_{rms}$ in the circuit is:<br>$I_{rms} = \\dfrac{V_{rms}}{Z}$<br><br>$I_{rms} = \\dfrac{200\\sqrt{2}}{100\\sqrt{2}} = 2 \\, \\text{A}$<br><br>Since the components are in series, the current through the resistor $R$ is the same as the total current in the circuit, which is $2 \\, \\text{A}$.<br><br>Answer: $2$ A", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb882f15a9fc0fc8c1414e", "type": "singleCorrect", "question": {"text": "An e.m.f. $e=E_0\\cos\\omega t$ is applied to a circuit containing L, C and R in series where $X_L=4R$ and $X_C=R$. The average power dissipated in the circuit is", "image": null}, "options": [{"id": "xyr1z", "label": "A", "text": "$\\dfrac{E_0^2}{20R}$", "isCorrect": true, "image": null}, {"id": "km4WY", "label": "B", "text": "$\\dfrac{E_0^2}{10R}$", "isCorrect": false, "image": null}, {"id": "Tzcsv", "label": "C", "text": "$\\dfrac{E_0^2}{5R}$", "isCorrect": false, "image": null}, {"id": "xhr7i", "label": "D", "text": "$\\dfrac{E_0^2}{2R}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The impedance of the series LCR circuit is given by $Z = \\sqrt{R^2 + (X_L - X_C)^2}$<br><br>Substituting $X_L = 4R$ and $X_C = R$:<br><br>$Z = \\sqrt{R^2 + (4R - R)^2} = \\sqrt{R^2 + 9R^2} = \\sqrt{10}R$<br><br>The average power dissipated in the circuit is given by $P_{avg} = I_{rms}^2 R$<br><br>Since $I_{rms} = \\dfrac{E_{rms}}{Z} = \\dfrac{E_0}{\\sqrt{2}Z}$, we have:<br><br>$P_{avg} = \\left(\\dfrac{E_0}{\\sqrt{2}Z}\\right)^2 R = \\dfrac{E_0^2}{2Z^2} R$<br><br>Substituting $Z^2 = 10R^2$:<br><br>$P_{avg} = \\dfrac{E_0^2}{2(10R^2)} R = \\dfrac{E_0^2}{20R}$<br><br>Answer: $\\dfrac{E_0^2}{20R}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb882e15a9fc0fc8c1414d", "type": "singleCorrect", "question": {"text": "In a series LCR circuit, the inductance $L=20$ mH, capacitor $C=2\\,\\mu$F and resistance $R=100$ ohm. The frequency at which resonance occurs is", "image": null}, "options": [{"id": "wbmeg", "label": "A", "text": "$\\dfrac{(10)^2}{2\\pi}$", "isCorrect": false, "image": null}, {"id": "wpkOH", "label": "B", "text": "$\\dfrac{(10)^3}{3\\pi}$", "isCorrect": false, "image": null}, {"id": "rSHXP", "label": "C", "text": "$\\dfrac{(10)^4}{4\\pi}$", "isCorrect": true, "image": null}, {"id": "2taYB", "label": "D", "text": "$\\dfrac{10}{\\pi}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The resonant frequency of a series LCR circuit is given by $f = \\dfrac{1}{2\\pi \\sqrt{LC}}$.<br><br>Substituting the given values $L = 20 \\times 10^{-3}$ H and $C = 2 \\times 10^{-6}$ F:<br><br>$f = \\dfrac{1}{2\\pi \\sqrt{20 \\times 10^{-3} \\times 2 \\times 10^{-6}}}$<br><br>$f = \\dfrac{1}{2\\pi \\sqrt{40 \\times 10^{-9}}}$<br><br>$f = \\dfrac{1}{2\\pi \\sqrt{4 \\times 10^{-8}}}$<br><br>$f = \\dfrac{1}{2\\pi \\times 2 \\times 10^{-4}}$<br><br>$f = \\dfrac{10^4}{4\\pi}$ Hz.<br><br>Answer: $\\dfrac{(10)^4}{4\\pi}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a78c30a4553e1bdb64", "type": "singleCorrect", "question": {"text": "In an LCR series circuit an alternating voltage source of frequency $F$ is connected. The current leads the voltage by $45^\\circ$. The value of $L$ is", "image": null}, "options": [{"id": "44a92", "label": "A", "text": "$\\dfrac{1 + 2\\pi FCR}{2\\pi FC}$", "isCorrect": false, "image": null}, {"id": "91CFV", "label": "B", "text": "$\\dfrac{1 + 2\\pi FCR}{4\\pi^2 F^2C}$", "isCorrect": false, "image": null}, {"id": "BLtSl", "label": "C", "text": "$\\dfrac{1 - 2\\pi FCR}{4\\pi^2 F^2C}$", "isCorrect": true, "image": null}, {"id": "qlOIf", "label": "D", "text": "$\\dfrac{1 + 2\\pi FR}{4\\pi^2 F^2C}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In an LCR series circuit, the phase difference $\\phi$ between the voltage and current when the current leads the voltage is given by $\\tan \\phi = \\dfrac{X_C - X_L}{R}$.<br><br>Given that the current leads the voltage by $45^\\circ$, we have $\\phi = 45^\\circ$.<br><br>$\\tan 45^\\circ = \\dfrac{X_C - X_L}{R}$<br><br>$1 = \\dfrac{\\dfrac{1}{2\\pi FC} - 2\\pi FL}{R}$<br><br>$R = \\dfrac{1}{2\\pi FC} - 2\\pi FL$<br><br>$2\\pi FL = \\dfrac{1}{2\\pi FC} - R$<br><br>$2\\pi FL = \\dfrac{1 - 2\\pi FCR}{2\\pi FC}$<br><br>$L = \\dfrac{1 - 2\\pi FCR}{4\\pi^2 F^2C}$<br><br>Answer: $\\dfrac{1 - 2\\pi FCR}{4\\pi^2 F^2C}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a78c30a4553e1bdb5a", "type": "singleCorrect", "question": {"text": "Given below are the two circuits, choose the correct option.<br><img style=\"width: 400px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/19_april_shift_2__q38_d1_v2.png\" />", "image": null}, "options": [{"id": "kUjG6", "label": "A", "text": "At resonance, current in (B) is less than that in (A)", "isCorrect": false, "image": null}, {"id": "UIkug", "label": "B", "text": "The r.m.s. current in (B) can be larger than that in (A)", "isCorrect": false, "image": null}, {"id": "Pozpd", "label": "C", "text": "The r.m.s. current in (A) is always equal to that in (B)", "isCorrect": false, "image": null}, {"id": "wXtvj", "label": "D", "text": "The r.m.s. current in (B) can never be larger than that in (A)", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For circuit (A), the impedance is purely resistive:<br><br>$Z_A = R = 30\\ \\Omega$<br><br>The r.m.s. current in circuit (A) is:<br><br>$I_A = \\dfrac{V_{rms}}{Z_A} = \\dfrac{V_{rms}}{R}$<br><br>For circuit (B), which is a series LCR circuit, the impedance is given by:<br><br>$Z_B = \\sqrt{R^2 + (X_L - X_C)^2}$<br><br>Since the square of any real number is non-negative, $(X_L - X_C)^2 \\ge 0$. Therefore, the impedance of circuit (B) will always be greater than or equal to the resistance $R$:<br><br>$Z_B \\ge R$<br><br>$Z_B \\ge Z_A$<br><br>The r.m.s. current in circuit (B) is:<br><br>$I_B = \\dfrac{V_{rms}}{Z_B}$<br><br>Since $V_{rms}$ is the same for both circuits ($210\\text{ V}$) and $Z_B \\ge Z_A$, it follows that:<br><br>$I_B \\le I_A$<br><br>At resonance, $X_L = X_C$, which gives $Z_B = R$ and $I_B = I_A$. For all other conditions, $Z_B > R$ and $I_B < I_A$.<br><br>Thus, the r.m.s. current in (B) can never be larger than that in (A).<br><br>Answer: The r.m.s. current in (B) can never be larger than that in (A)", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a68c30a4553e1bdb55", "type": "singleCorrect", "question": {"text": "In a L-R circuit of 4 mH inductance and $3\\ \\Omega$ resistance, e.m.f. $E = \\cos(1000t)$ V is applied. The amplitude of current is", "image": null}, "options": [{"id": "G7O9h", "label": "A", "text": "$1.6$ A", "isCorrect": false, "image": null}, {"id": "Pn1S3", "label": "B", "text": "$1$ A", "isCorrect": false, "image": null}, {"id": "pTlwv", "label": "C", "text": "$0.2$ A", "isCorrect": true, "image": null}, {"id": "3TQtY", "label": "D", "text": "$0.4$ A", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $L = 4 \\times 10^{-3}$ H, $R = 3\\ \\Omega$, and $E = \\cos(1000t)$ V.<br><br>The peak voltage is $E_0 = 1$ V and the angular frequency is $\\omega = 1000$ rad/s.<br><br>The inductive reactance is $X_L = \\omega L = 1000 \\times 4 \\times 10^{-3} = 4\\ \\Omega$.<br><br>The impedance of the L-R circuit is $Z = \\sqrt{R^2 + X_L^2} = \\sqrt{3^2 + 4^2} = 5\\ \\Omega$.<br><br>The amplitude of the current is $I_0 = \\dfrac{E_0}{Z} = \\dfrac{1}{5} = 0.2$ A.<br><br>Answer: $0.2$ A", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3508c30a4553e1be268", "type": "singleCorrect", "question": {"text": "In a series LCR circuit, the voltage across R is $100$ V, $R = 1\\,\\text{K}\\,\\Omega$ and $C = 2\\,\\mu\\text{F}$. The angular frequency $\\omega$ is $200$ rad s$^{-1}$. At resonance, the voltage across '$L$' is", "image": null}, "options": [{"id": "p1pmM", "label": "A", "text": "$150$ V", "isCorrect": false, "image": null}, {"id": "ryGw3", "label": "B", "text": "$200$ V", "isCorrect": false, "image": null}, {"id": "Gjj84", "label": "C", "text": "$250$ V", "isCorrect": true, "image": null}, {"id": "JxQC4", "label": "D", "text": "$300$ V", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The current in the series LCR circuit is given by $I = \\dfrac{V_R}{R}$.<br><br>Substituting the given values:<br><br>$I = \\dfrac{100}{1000} = 0.1$ A<br><br>The capacitive reactance is $X_C = \\dfrac{1}{\\omega C}$.<br><br>$X_C = \\dfrac{1}{200 \\times 2 \\times 10^{-6}} = \\dfrac{10^6}{400} = 2500 \\, \\Omega$<br><br>The voltage across the capacitor is $V_C = I X_C$.<br><br>$V_C = 0.1 \\times 2500 = 250$ V<br><br>At resonance, the inductive reactance equals the capacitive reactance ($X_L = X_C$), so the voltage across the inductor equals the voltage across the capacitor.<br><br>$V_L = V_C = 250$ V<br><br>Answer: $250$ V", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3508c30a4553e1be267", "type": "singleCorrect", "question": {"text": "Which graph shows the correct variation of r.m.s. current '$i$' with frequency '$f$' of a.c. in case of series resonant circuit ?<br><img style=\"width: 500px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/19_april_shift_1__q43_d1.png\" />", "image": null}, "options": [{"id": "bzooK", "label": "A", "text": "$(R)$", "isCorrect": false, "image": null}, {"id": "cfsLf", "label": "B", "text": "$(P)$", "isCorrect": true, "image": null}, {"id": "taMiT", "label": "C", "text": "$(S)$", "isCorrect": false, "image": null}, {"id": "gInQm", "label": "D", "text": "$(Q)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In a series LCR circuit, the impedance is given by:<br><br>$Z = \\sqrt{R^2 + \\left(X_L - X_C\\right)^2} = \\sqrt{R^2 + \\left(2\\pi f L - \\dfrac{1}{2\\pi f C}\\right)^2}$<br><br>The r.m.s. current is:<br><br>$i = \\dfrac{V_{\\text{rms}}}{Z}$<br><br>At the resonant frequency $f_r = \\dfrac{1}{2\\pi\\sqrt{LC}}$, the inductive reactance equals the capacitive reactance ($X_L = X_C$). At this point, the impedance $Z$ is minimum ($Z = R$) and the current $i$ is maximum.<br><br>For frequencies $f < f_r$, $Z$ is large and $i$ is small. As $f$ increases towards $f_r$, $Z$ decreases and $i$ increases.<br>For frequencies $f > f_r$, $Z$ increases again and $i$ decreases.<br><br>Thus, the graph of current $i$ versus frequency $f$ is a bell-shaped curve with a peak at the resonant frequency. Graph (P) correctly represents this variation.<br><br>Answer: $(P)$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3508c30a4553e1be266", "type": "singleCorrect", "question": {"text": "When an inductance '$L$' and resistor '$R$' are connected in series to $25$V, $50$ Hz supply, a current of $0.5$ A flows in the circuit. The current lags behind in phase from applied voltage by $\\left(\\dfrac{\\pi}{3}\\right)$ radian. The value of R is $\\left(\\cos 60^\\circ = \\dfrac{1}{2}\\right)$", "image": null}, "options": [{"id": "Cztqe", "label": "A", "text": "$20\\,\\Omega$", "isCorrect": false, "image": null}, {"id": "oV2iW", "label": "B", "text": "$25\\,\\Omega$", "isCorrect": true, "image": null}, {"id": "a5aVL", "label": "C", "text": "$40\\,\\Omega$", "isCorrect": false, "image": null}, {"id": "2hxHE", "label": "D", "text": "$50\\,\\Omega$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The impedance of the LR series circuit is given by:<br><br>$Z = \\dfrac{V}{I}$<br><br>Substituting the given values:<br><br>$Z = \\dfrac{25}{0.5} = 50 \\, \\Omega$<br><br>The power factor of the circuit is related to the resistance and impedance by:<br><br>$\\cos \\phi = \\dfrac{R}{Z}$<br><br>Given that the current lags the voltage by $\\phi = \\dfrac{\\pi}{3}$ radian ($60^\\circ$):<br><br>$R = Z \\cos \\phi$<br><br>$R = 50 \\times \\cos 60^\\circ$<br><br>$R = 50 \\times \\dfrac{1}{2} = 25 \\, \\Omega$<br><br>Answer: $25\\,\\Omega$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d77
