athrm{i}}$ Lidi\nOn solving for $I=\\left[\\frac{\\mathrm{c}\\left(\\mathrm{v}_1^2-\\mathrm{v}_2^2\\right)^{1 / 2}}{\\mathrm{~L}}\\right]$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260cc0279619d9d8a2766", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "In series LCR circuit, at resonance the peak value of current will be $\\left[E_0\\right.$ is peak emf, $R$ is resistance, $\\omega L$ is inductive reactance, and $1 / \\omega \\mathrm{C}$ is capacitive reactance]", "image": null}, "options": [{"id": "5bu9O", "text": "$\\frac{E_0}{R}$", "image": null, "isCorrect": true}, {"id": "KIfff", "text": "$\\frac{E_0}{\\sqrt{2} R}$", "image": null, "isCorrect": false}, {"id": "2xboP", "text": "$\\frac{E_0}{\\sqrt{R^2+\\left(\\omega L-\\frac{1}{\\omega C}\\right)^2}}$", "image": null, "isCorrect": false}, {"id": "5geY9", "text": "$\\frac{E_0}{\\sqrt{2} \\sqrt{R^2+\\left(\\omega L-\\frac{1}{\\omega C}\\right)^2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "At resonance, the net reactance of the circuit is zero and the impedance is equal to the resistance.\n$\\therefore \\mathrm{I}_0=\\frac{\\mathrm{E}_0}{\\mathrm{R}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260ba0279619d9d8a26d5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "A circuit containing resistance $\\mathrm{R}_1$, inductance $\\mathrm{L}_1$ and capacitance $\\mathrm{C}_1$ connected in series resonates at the same frequency ' $\\mathrm{f}_{\\mathrm{r}}$ ' as another circuit containing $\\mathrm{R}_2, \\mathrm{~L}_2$ and $\\mathrm{C}_2$ in series. If two circuits are connected in series, then the new frequency at resonance is", "image": null}, "options": [{"id": "lxHNn", "text": "$\\frac{3}{4} f_r$", "image": null, "isCorrect": false}, {"id": "eker0", "text": "$\\frac{3}{2} f_r$", "image": null, "isCorrect": false}, {"id": "i2E8F", "text": "$2 \\mathrm{f}_{\\mathrm{r}}$", "image": null, "isCorrect": false}, {"id": "QJg3N", "text": "$\\mathrm{f}_{\\mathrm{r}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "When $\\mathrm{R}_1, \\mathrm{~L}_1$ and $\\mathrm{C}_1$ are connected in series the resonant (angular) frequency is given by\n$$\n\\omega_{\\mathrm{r}}=\\frac{1}{\\sqrt{\\mathrm{L}_1 \\cdot \\mathrm{C}_1}}\n$$\nAlso, when $\\mathrm{R}_2, \\mathrm{~L}_2, \\mathrm{C}_2$ are connected in series\nThen $\\omega_{\\mathrm{r}}=\\frac{1}{\\sqrt{\\mathrm{L}_2 \\cdot \\mathrm{C}_2}}$\nBy (1) and (2): $\\mathrm{L}_1 \\mathrm{C}_1=\\mathrm{L}_2 \\mathrm{C}_2$\nIf the two circuits are connected in series then the equivalent inductance is given by $\\mathrm{L}=\\mathrm{L}_1+\\mathrm{L}_2$ and the equivalent capacitance is given by\n$$\n\\begin{aligned}\n& \\mathrm{C}=\\frac{\\mathrm{C}_1 \\mathrm{C}_2}{\\mathrm{C}_1+\\mathrm{C}_2} \\\\\n& \\therefore \\mathrm{LC}=\\left(\\mathrm{L}_1+\\mathrm{L}_2\\right) \\cdot \\frac{\\mathrm{C}_1 \\mathrm{C}_2}{\\mathrm{C}_1+\\mathrm{C}_2} \\\\\n& =\\frac{\\mathrm{L}_1 \\mathrm{C}_1 \\mathrm{C}_2+\\mathrm{L}_2 \\mathrm{C}_1 \\mathrm{C}_2}{\\mathrm{C}_1+\\mathrm{C}_2}\\left[\\because \\mathrm{L}_1 \\mathrm{C}_1=\\mathrm{L}_2 \\mathrm{C}_2\\right] \\\\\n& =\\frac{\\mathrm{L}_2 \\mathrm{C}_2\\left(\\mathrm{C}_2+\\mathrm{C}_1\\right)}{\\mathrm{C}_1+\\mathrm{C}_2}=\\mathrm{L}_2 \\mathrm{C}_2 \\\\\n& \\therefore \\omega=\\frac{1}{\\sqrt{\\mathrm{L}_2 \\mathrm{C}_2}}=\\omega_{\\mathrm{r}}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260b50279619d9d8a26ad", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "A series $\\mathrm{L}-\\mathrm{C}-\\mathrm{R}$ circuit containing a resistance of $120 \\Omega$ has angular frequency $4 \\times 10^5 \\mathrm{rad} \\mathrm{s}^{-1}$. At resonance the voltage across resistance and inductor are $60 \\mathrm{~V}$ and $40 \\mathrm{~V}$ respectively, then the value of inductance will be", "image": null}, "options": [{"id": "MhmWi", "text": "$0.2 \\mathrm{mH}$", "image": null, "isCorrect": true}, {"id": "L6ffV", "text": "$0.4 \\mathrm{mH}$", "image": null, "isCorrect": false}, {"id": "R4eq5", "text": "$0.8 \\mathrm{mH}$", "image": null, "isCorrect": false}, {"id": "rcqRQ", "text": "$0.6 \\mathrm{mH}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "At resonance, the impedance of the circuit is equal to resistance\n$$\n\\therefore \\mathrm{I}=\\frac{\\mathrm{V}_{\\mathrm{R}}}{\\mathrm{R}}=\\frac{60}{120}=0.5 \\mathrm{~A}\n$$\nInductive reactance, $X_L=\\frac{V_L}{I}=\\frac{40}{0.5}=80 \\Omega$\n$$\n\\begin{aligned}\n& \\mathrm{X}_{\\mathrm{L}}=\\omega \\mathrm{L} \\\\\n& \\therefore \\mathrm{L}=\\frac{\\mathrm{X}_{\\mathrm{L}}}{\\omega}=\\frac{80}{4 \\times 10^5}=20 \\times 10^{-5} \\mathrm{H} \\\\\n& =0.2 \\mathrm{mH}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260a50279619d9d8a262d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "In an LCR series a.c. circuit, the voltage across each of the components $\\mathrm{L}, \\mathrm{C}$ and $\\mathrm{R}$ is $60 \\mathrm{~V}$. The voltage across the $\\mathrm{LC}$ combination is", "image": null}, "options": [{"id": "Z07YY", "text": "$120 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "IXsvp", "text": "$60 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "Jw8el", "text": "$\\text { zero }$", "image": null, "isCorrect": true}, {"id": "7Y6Ej", "text": "$\\frac{60}{\\sqrt{3}} \\mathrm{~V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The voltage across $L$ and $C$ has phase difference of $\\pi$ $\\mathrm{X}=\\mathrm{X}_{\\mathrm{L}}-\\mathrm{X}_{\\mathrm{c}}=60-60=0$\nHence the resultant voltage across the combination is zero.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260a50279619d9d8a262b", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "For series LCR circuit, which one of the following is a CORRECT statement?", "image": null}, "options": [{"id": "vFKKj", "text": "Potential difference across $\\mathrm{R}$ and that across capacitor have phase difference of $\\frac{\\pi}{2}$", "image": null, "isCorrect": true}, {"id": "MI7ey", "text": "Applied e.m.f. and potential difference across resistance ' $R$ ' are in the same phase", "image": null, "isCorrect": false}, {"id": "CPRC6", "text": "Applied e.m.f. and potential difference across inductor coil has phase difference of $\\frac{\\pi}{2}$", "image": null, "isCorrect": false}, {"id": "QI8Jg", "text": "Potential difference across capacitor and that across inductor have phase difference of $\\frac{\\pi}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/vCAj_4GZwPLaAqt4t_h2eRSL0joEiGFt8tNMLNPr2C4.original.fullsize.png\"><br>\n(A) is correct.\n(B) is wrong. There is phase difference $\\phi$ between the applied emf e and $\\mathrm{e}_{\\mathrm{R}}$\n(C) is wrong. There is phase difference of $\\left(\\frac{\\pi}{2}-\\phi\\right)$ between $\\mathrm{e}$ and $\\mathrm{e}_{\\mathrm{L}}$\n(D) is wrong. There is a phase difference of $\\pi$ between $\\mathrm{e}_{\\mathrm{C}}$ and $\\mathrm{e}_{\\mathrm{L}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260940279619d9d8a25a5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "Which graph shows the correct variation of r.m.s. current ' $\\mathrm{I}$ ' with frequency ' $\\mathrm{f}$ ' of a.c. in case of (LCR) series resonance circuit?\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/O6Rc1j50oirwKY0SurjofDHbeg4tDDNDxL_Lh-RJqCE.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "2Vs4G", "text": "Q", "image": null, "isCorrect": false}, {"id": "ENmFG", "text": "P", "image": null, "isCorrect": false}, {"id": "A9fhK", "text": "R", "image": null, "isCorrect": false}, {"id": "ls7B7", "text": "S", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In series, $\\mathrm{Z}=\\sqrt{\\left(2 \\pi \\mathrm{fL}-\\frac{1}{2 \\pi \\mathrm{fC}}\\right)^2+\\mathrm{R}^2}$\nCurrent, $I=\\frac{\\mathrm{V}}{\\sqrt{\\left(2 \\pi \\mathrm{fL}-\\frac{1}{2 \\pi \\mathrm{fC}}\\right)^2+\\mathrm{R}^2}}$\nAs frequency increases, current first increases and then decreases. Current is maximum at resonance when $\\mathrm{X}_{\\mathrm{L}}=\\mathrm{X}_{\\mathrm{C}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260910279619d9d8a258a", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "In the part of an a.c. circuit as shown, the resistance $\\mathrm{R}=0.2$ $\\Omega$. At a certain instant $\\left(\\mathrm{V}_{\\mathrm{A}}-\\mathrm{V}_{\\mathrm{B}}\\right)=0.5 \\mathrm{~V}, \\mathrm{I}=0.5 \\mathrm{~A}$ and $\\frac{\\Delta \\mathrm{I}}{\\Delta \\mathrm{t}}=8 \\mathrm{~A} / \\mathrm{s}$. The inductance of the coil is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/aqd3NVnGbxZ2xVExDCG4iS2zKZ8liVs6dtnOgr5joHI.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "Sz8m7", "text": "$0.04 \\mathrm{H}$", "image": null, "isCorrect": false}, {"id": "6NUwI", "text": "$0.02 \\mathrm{H}$", "image": null, "isCorrect": false}, {"id": "DpJ1c", "text": "$0.08 \\mathrm{H}$", "image": null, "isCorrect": false}, {"id": "0wyNE", "text": "$0.05 \\mathrm{H}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In the part of an a.c. circuit\n$$\n\\begin{aligned}\n& V_A-V_B=L \\frac{d I}{d t}+I R \\\\\n& 0.5=8 L+0.5 \\times 0.2 \\\\\n& \\therefore 8 L=0.4 \\\\\n& \\therefore L=\\frac{0.4}{8}=0.05 \\mathrm{H}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260900279619d9d8a2584", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "In the circuit shown in the figure, a.c. source gives voltage $\\mathrm{V}=20 \\cos (2000 \\mathrm{t})$. Impedance and r.m.s current respectively will be\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/mkBpCgQDvVwsU3FG-YUl7KFnqa0w2KKtIqKWuQj7xpk.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "RXUQQ", "text": "$10 \\Omega, \\sqrt{2} \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "yuZ5u", "text": "$5 \\Omega, 2 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "JcAJr", "text": "$15 \\Omega, \\frac{2 \\sqrt{2}}{3} \\mathrm{~A}$", "image": null, "isCorrect": true}, {"id": "k52e4", "text": "$5 \\Omega, 1 \\mathrm{~A}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\mathrm{V}=20 \\cos 2000 \\mathrm{t} \\therefore \\omega=2000 \\mathrm{rad} / \\mathrm{s} \\\\\n& \\mathrm{X}_{\\mathrm{L}}=\\omega \\mathrm{L}=2000 \\times 5 \\times 10^{-3}=10 \\Omega \\\\\n& \\mathrm{X}_{\\mathrm{C}}=\\frac{1}{\\omega \\mathrm{C}}=\\frac{1}{2000 \\times 50 \\times 10^{-6}}=10 \\Omega \\\\\n& \\therefore \\mathrm{X}_{\\mathrm{L}}=\\mathrm{X}_{\\mathrm{C}} \\text { which gives resonance. } \\\\\n& \\mathrm{Z}=\\mathrm{R}=10 \\Omega+5 \\Omega=15 \\Omega\n\\end{aligned}\n$$\nThe peak current, $\\mathrm{I}_0=\\frac{\\mathrm{V}_0}{\\mathrm{R}}=\\frac{20}{15}=\\frac{4}{3} \\mathrm{~A}$ R.M.S. current, $I_{r m s}=\\frac{I_0}{\\sqrt{2}}=\\frac{2 \\sqrt{2}}{3} \\mathrm{~A}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260830279619d9d8a2518", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "A capacitor of capacity ' $\\mathrm{C}$ ' is charged to a potential ' $\\mathrm{V}$ '. It is connected in parallel to an inductor of inductance ' $L$ '. The maximum current that will flow in the circuit is", "image": null}, "options": [{"id": "lvmhX", "text": "$V \\sqrt{\\frac{L}{C}}$", "image": null, "isCorrect": false}, {"id": "vZsvH", "text": "$\\mathrm{V} \\sqrt{\\mathrm{LC}}$", "image": null, "isCorrect": false}, {"id": "jwlGm", "text": "$\\mathrm{V} \\sqrt{\\frac{\\mathrm{C}}{\\mathrm{L}}}$", "image": null, "isCorrect": true}, {"id": "q2mLD", "text": "$\\frac{\\mathrm{VC}^2}{\\mathrm{~L}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The charge oscillates according to the equations\n$$\n\\begin{aligned}\n& \\mathrm{q}=\\mathrm{q}_0 \\cos \\omega \\mathrm{t} \\\\\n& \\mathrm{i}=-\\frac{\\mathrm{dq}}{\\mathrm{dt}}=\\omega \\mathrm{q}_0 \\sin \\omega \\mathrm{t}=\\mathrm{i}_0 \\sin \\omega \\mathrm{t} \\\\\n& \\text { where } \\mathrm{i}_0=\\omega \\mathrm{q}_0, \\omega=\\frac{1}{\\sqrt{\\mathrm{LC}}}, \\mathrm{q}_0=C V \\\\\n& \\therefore \\mathrm{i}_0=\\frac{1}{\\sqrt{\\mathrm{LC}}} \\cdot \\mathrm{CV}=\\mathrm{V} \\sqrt{\\frac{\\mathrm{C}}{\\mathrm{L}}}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2606e0279619d9d8a2470", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "An a.c. source of angular frequency ' $\\omega$ ' is fed across a resistor ' $\\mathrm{R}$ ' and a capacitor ' $\\mathrm{C}$ ' in series. The current registered is I. If now the frequency of source is changed to $\\frac{\\omega}{3}$ (but maintaining the same voltage), the current in the circuit is found to be halved. The ratio of reactance to resistance at the original frequency ' $\\omega$ ' will be", "image": null}, "options": [{"id": "3GYBr", "text": "$\\sqrt{\\frac{2}{5}}$", "image": null, "isCorrect": false}, {"id": "31QkT", "text": "$\\sqrt{\\frac{1}{5}}$", "image": null, "isCorrect": false}, {"id": "DagtU", "text": "$\\sqrt{\\frac{4}{5}}$", "image": null, "isCorrect": false}, {"id": "72V5E", "text": "$\\sqrt{\\frac{3}{5}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\text { Initial current } I=\\frac{V}{Z}, \\text { Final current } I^{\\prime}=\\frac{V}{Z^{\\prime}} \\\\ & \\frac{1}{2}=\\frac{I^{\\prime}}{I}=\\frac{Z}{Z^{\\prime}} \\quad \\therefore \\frac{Z}{Z^{\\prime}}=\\frac{1}{2} \\\\ & \\therefore \\frac{Z^2}{Z^{\\prime 2}}=\\frac{1}{4} \\quad \\therefore \\frac{R^2+X_c^2}{R^2+X_c^{\\prime 2}}=\\frac{1}{4} \\\\ & \\therefore 4 R^2+4 X_c^2=R^2+X_c^{\\prime 2} \\\\ & \\therefore 3 R^2=X_c^{\\prime 2}-4 X_c^2 \\quad \\ldots .(1) \\\\ & X_c=\\frac{1}{\\omega C}, X^{\\prime}=\\frac{3}{\\omega C} \\quad \\therefore X^{\\prime}=3 X_c \\\\ & \\text { Putting this value of } X^{\\prime} \\text { in }(1) \\text { we get } \\\\ & 3 R^2=9 X_c^2-4 X_c^2=5 X_c^2 \\\\ & \\therefore \\frac{X_c^2}{R^2}=\\frac{3}{5}=0.6 \\\\ & \\therefore \\frac{X_c}{R}=\\sqrt{\\frac{3}{5}}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2606d0279619d9d8a2467", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "In a.c. circuit, a resistance $R=40 \\Omega$ and an inductance ' $L$ ' are connected in series. If the phase angle between voltage and current is $45^{\\circ}$, then the value of the inductive reactance is $\\left(\\tan 45^{\\circ}=1\\right)$", "image": null}, "options": [{"id": "DcnlO", "text": "$50 \\Omega$", "image": null, "isCorrect": false}, {"id": "oNJ69", "text": "$40 \\Omega$", "image": null, "isCorrect": true}, {"id": "9gtCV", "text": "$10 \\Omega$", "image": null, "isCorrect": false}, {"id": "FREtz", "text": "$20 \\Omega$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\tan \\phi=\\tan 45^{\\circ}=\\frac{\\mathrm{X}_{\\mathrm{L}}}{\\mathrm{R}} \\\\ & \\mathrm{X}_{\\mathrm{I}}=\\mathrm{R}=40 \\Omega\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2605d0279619d9d8a23e5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "In LCR series resonant circuit, at resonance, voltage across ' $\\mathrm{L}$ ' and ' $C$ ' will cancel each other because they are", "image": null}, "options": [{"id": "VQUab", "text": "$90^{\\circ}$ out of phase", "image": null, "isCorrect": false}, {"id": "Ot8fU", "text": "$90^{\\circ}$ in phase", "image": null, "isCorrect": false}, {"id": "9OakI", "text": "$180^{\\circ}$ in phase", "image": null, "isCorrect": false}, {"id": "66YUL", "text": "$180^{\\circ}$ out of phase", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In LCR series resonant circuit, at resonance, voltage across ' $\\mathrm{L}$ ' and ' $\\mathrm{C}$ ' will cancel each other because they are $180^{\\circ}$ out of phase.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2604b0279619d9d8a2351", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "A series combination of resistor ' $\\mathrm{R}$ ' and capacitor ' $\\mathrm{C}$ ' is connected to an a.c. source of angular frequency ' $\\omega$ '. Keeping the voltage same, if the frequency is changed to $\\frac{\\omega}{3}$ the current becomes half of the original current. Then the ratio of capacitive reactance and resistance at the former frequency is", "image": null}, "options": [{"id": "sYomo", "text": "$\\sqrt{0.6}$", "image": null, "isCorrect": true}, {"id": "U82A4", "text": "$\\sqrt{6}$", "image": null, "isCorrect": false}, {"id": "0xkEO", "text": "$\\sqrt{3}$", "image": null, "isCorrect": false}, {"id": "1zW2a", "text": "$\\sqrt{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Initial current $\\mathrm{I}=\\frac{\\mathrm{V}}{\\mathrm{Z}}$ and Final current $\\mathrm{I}^{\\prime}=\\frac{\\mathrm{V}}{\\mathrm{Z}^{\\prime}}$\n$$\n\\because \\mathrm{I}^{\\prime}=\\frac{\\mathrm{I}}{2}\n$$\n$$\nZ^{\\prime}=2 Z\n$$\n$$\n\\frac{\\mathrm{R}^2+\\mathrm{X}_{\\mathrm{c}}^2}{\\mathrm{R}^2+\\mathrm{X}_{\\mathrm{c}}^{\\prime 2}}=\\frac{1}{4}\n$$\n$$\n4 R^2+4 X_c^2=R^2+X_c^2\n$$\n\n\n$$\n\\begin{aligned}\n& 3 R^2=X_c^{\\prime 2}-4 X_c^2 \\\\\n& X_c=\\frac{1}{\\omega C}, \\quad X_c^{\\prime}=\\frac{3}{\\omega C} \\\\\n& X_c{ }^{\\prime}=3 X_c\n\\end{aligned}\n$$\nFrom (1)\n$$\n3 R^2=9 X_c^2-4 X_c^2=5 X_c^2\n$$\n$$\n\\frac{\\mathrm{X}_{\\mathrm{c}}^2}{\\mathrm{R}^2}=\\frac{3}{5}=0.6\n$$\n$$\n\\frac{\\mathrm{X}_{\\mathrm{c}}}{\\mathrm{R}}=\\sqrt{0.6}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2604b0279619d9d8a2350", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "In the graphical representation of e.m.f. ' $e$ ' and current ' $i$ ' versus ' $\\omega \\mathrm{t}$ ' for an a.c. circuit, both emf and current reach zero, minimum and maximum value at the same time. The circuit element connected to the source will be", "image": null}, "options": [{"id": "9h6xP", "text": "pure capacitor", "image": null, "isCorrect": false}, {"id": "gTOhh", "text": "combination of capacitor and inductor", "image": null, "isCorrect": false}, {"id": "mc66m", "text": "pure resistor", "image": null, "isCorrect": true}, {"id": "0uMMU", "text": "pure inductor", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since the current and emf are in phase the circuit is purely resistive.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260350279619d9d8a229e", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "An inductor coil takes current $8 \\mathrm{~A}$ when connected to a $100 \\mathrm{~V}$ and $50 \\mathrm{~Hz} \\mathrm{AC}$ source. A pure resistor under the same condition takes current of $10 \\mathrm{~A}$. If inductor coil and resistor are connected in series to a $100 \\mathrm{~V}$ and $40 \\mathrm{~Hz}$ AC supply, then the current in the series combination of above resistor and inductor is", "image": null}, "options": [{"id": "lhiko", "text": "$\\frac{10}{\\sqrt{3}} \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "zcTVG", "text": "$\\frac{5}{\\sqrt{2}} \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "6sQcr", "text": "$10 \\sqrt{2} \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "rgsnF", "text": "$5 \\sqrt{2} \\mathrm{~A}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Inductive reactance when $100 \\mathrm{~V}, 50 \\mathrm{~Hz}$ source is connected is given by\n$$\n\\mathrm{X}_{\\mathrm{L}}=\\frac{\\mathrm{V}}{\\mathrm{I}}=\\frac{100}{8}=12.5 \\Omega\n$$\nResistance $\\mathrm{R}=\\frac{\\mathrm{V}}{1}=\\frac{100}{10}=10 \\Omega$\nInductive reactance at new frequency of $40 \\mathrm{~Hz}$\n$$\n\\begin{aligned}\n& \\frac{\\mathrm{X}_{\\mathrm{L}}^{\\prime}}{\\mathrm{X}_{\\mathrm{L}}}=\\frac{2 \\pi \\mathrm{f}^{\\prime} \\mathrm{L}}{2 \\pi \\mathrm{fL}}=\\frac{40}{50}=\\frac{4}{5} \\\\\n& \\mathrm{X}_{\\mathrm{L}}^{\\prime}=\\frac{4}{5} \\mathrm{X}_{\\mathrm{L}}=\\frac{4}{5} \\times 12.5=10 \\Omega\n\\end{aligned}\n$$\nWhen they are connected in series the impedance will be given by\n$$\n\\begin{aligned}\n& Z=\\sqrt{R^2+X_L^{\\prime 2}}=\\sqrt{(10)^2+(10)^2}=10 \\sqrt{2} A \\\\\n& I=\\frac{V}{Z}=\\frac{100}{10 \\sqrt{2}}=5 \\sqrt{2} \\mathrm{~A}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260240279619d9d8a2216", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "An inductive coil has a resistance of $100 \\Omega$. When an a.c. signal of frequency $1000 \\mathrm{~Hz}$ is applied to the coil the voltage leads the current by $45^{\\circ}$. The inductance of the coil is", "image": null}, "options": [{"id": "iuTNF", "text": "$\\frac{0.25}{2 \\pi} \\mathrm{H}$", "image": null, "isCorrect": false}, {"id": "mlZso", "text": "$\\frac{0.05}{\\pi} \\mathrm{H}$", "image": null, "isCorrect": true}, {"id": "DnvE7", "text": "$\\frac{0.25}{\\pi} \\mathrm{H}$", "image": null, "isCorrect": false}, {"id": "DiQPU", "text": "$\\frac{0.5}{\\pi} \\mathrm{H}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\tan \\phi=\\tan 45^{\\circ}=\\frac{\\mathrm{X}_{\\mathrm{L}}}{\\mathrm{R}}\n$$\nor $\\mathrm{X}_{\\mathrm{L}}=\\mathrm{R}$\n$$\n2 \\pi \\mathrm{fL}=\\mathrm{R}\n$$\nOr $L=\\frac{\\mathrm{R}}{2 \\pi \\mathrm{f}}=\\frac{100}{2 \\pi \\times 1000}=\\frac{0.05}{\\pi} \\mathrm{H}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260220279619d9d8a2202", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "A series LCR circuit with resistance $R=500 \\mathrm{ohm}$ is connected to an a.c. source of $250 \\mathrm{~V}$. When only the capacitance is removed, the current lags behind the voltage by $60^{\\circ}$. When only the inductance is removed, the current leads the voltage by $60^{\\circ}$. The impedance of the circuit is", "image": null}, "options": [{"id": "26DGD", "text": "$\\frac{500}{\\sqrt{3}} \\Omega$", "image": null, "isCorrect": false}, {"id": "T4cCG", "text": "$500 \\sqrt{3} \\Omega$", "image": null, "isCorrect": false}, {"id": "UE7J9", "text": "$250 \\Omega$", "image": null, "isCorrect": false}, {"id": "Z7odp", "text": "$500 \\Omega$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "When capacitance is removed\n$$\n\\begin{aligned}\n& \\tan \\phi=\\tan 60^{\\circ}=\\frac{X_L}{R} \\\\\n& \\therefore \\frac{X_L}{R}=\\sqrt{3} \\text { or } X_L=R \\sqrt{3}\n\\end{aligned}\n$$\nWhen inductance is removed,\n$$\n\\begin{aligned}\n& \\frac{X_C}{R}=\\tan 60^{\\circ}=\\sqrt{3} \\\\\n& \\therefore X_C=R \\sqrt{3} \\\\\n& \\therefore X_C=X_L\n\\end{aligned}\n$$\nImpedance, $\\mathrm{Z}=\\sqrt{\\mathrm{R}^2+\\left(\\mathrm{X}_{\\mathrm{L}}=\\mathrm{X}_{\\mathrm{C}}\\right)^2}=\\mathrm{R}=500 \\Omega$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2600f0279619d9d8a216e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}], "question": {"text": "When a capacitor is connected in series LR circuit, the alternating current flowing in the circuit", "image": null}, "options": [{"id": "VxriE", "text": "increases.", "image": null, "isCorrect": true}, {"id": "SP4f3", "text": "decreases.", "image": null, "isCorrect": false}, {"id": "Duwha", "text": "remains constant.", "image": null, "isCorrect": false}, {"id": "8fGu2", "text": "is zero.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$z=\\sqrt{{R^{2}+\\left(X_{L}-X_{C}\\right)^{2}}}$\nWith capacitor the value of $z$ decreases. So, current increases.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260000279619d9d8a20f3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "An e.m.f. $\\mathrm{E}=\\mathrm{E}_{0} \\sin \\omega \\mathrm{t}$ is applied to a circuit containing 'L' and 'R' in series.\nIf $X_{L}=R$, then the power dissipated in the circuit is", "image": null}, "options": [{"id": "AirCW", "text": "$\\frac{\\mathrm{E}_{0}^{2}}{4 \\mathrm{R}}$", "image": null, "isCorrect": false}, {"id": "XlLTK", "text": "$\\frac{\\mathrm{E}_{0}}{2 \\mathrm{R}}$", "image": null, "isCorrect": false}, {"id": "0XO44", "text": "$\\frac{\\mathrm{E}_{0}}{4 \\mathrm{R}}$", "image": null, "isCorrect": false}, {"id": "DMmn9", "text": "$\\frac{\\mathrm{E}_{0}^{2}}{2 \\mathrm{R}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\mathrm{E}=\\mathrm{E}_{0} \\sin \\omega \\mathrm{t}$\n$P=\\frac{E_{0}}{\\sqrt{2}} \\times \\frac{I_{0}}{\\sqrt{2}} \\cos \\theta$\n$=\\frac{E_{0}}{\\sqrt{2}} \\times \\frac{E_{0}}{\\sqrt{2} Z} \\times \\frac{R}{Z}$\n$=\\frac{E_{0}^{2} R}{2 Z^{2}} \\quad \\quad Z^{2}=R^{2}+\\omega L^{2}=2 R^{2}$\n$=\\frac{E_{0}^{2} R}{4 R^{2}}=\\frac{E_{0}^{2}}{4 R}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/_qyOqHu0zyFvfOKJCaBngEfnS5kfMl6_rMu6sUvGuac.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fb50279619d9d8a1ea1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "An alternating e.m.f. of $0 \\cdot 2 \\mathrm{~V}$ is applied across an LCR series circuit having $\\mathrm{R}=4 \\Omega, \\mathrm{C}=$ $80 \\mu \\mathrm{F}$ and $\\mathrm{L}=200 \\mathrm{mH}$. At resonance the voltage drop across the inductor is", "image": null}, "options": [{"id": "3u8JW", "text": "1V", "image": null, "isCorrect": false}, {"id": "zMqpv", "text": "2.5V", "image": null, "isCorrect": true}, {"id": "xat2t", "text": "3.5V", "image": null, "isCorrect": false}, {"id": "Z5JV7", "text": "10V", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "At resonance $\\mathrm{X}_{\\mathrm{L}}=\\mathrm{X}_{\\mathrm{C}}$\n$\\therefore$ Current $=\\frac{0.2}{R}=\\frac{0.2}{4}=\\frac{0.1}{2}=0.05 \\mathrm{~A}$\nNow, $\\mathrm{X}_{\\mathrm{L}}=\\omega \\mathrm{L}=2 \\pi \\mathrm{f} \\mathrm{L}$\n$$\n\\begin{aligned}\n\\mathrm{f} &=\\frac{1}{2 \\pi \\sqrt{\\mathrm{LC}}} \\\\\n\\therefore \\quad \\mathrm{X}_{\\mathrm{L}} &=\\frac{2 \\pi \\mathrm{L}}{2 \\pi \\sqrt{\\mathrm{LC}}}=\\sqrt{\\frac{\\mathrm{L}}{\\mathrm{C}}} \\\\\n\\mathrm{X}_{\\mathrm{L}} &=\\sqrt{\\frac{200 \\times 10^{-3}}{80 \\times 10^{-6}}}=\\frac{10^{2}}{2}=50 \\Omega \\\\\n\\therefore \\quad \\mathrm{V}_{\\mathrm{L}} &=\\mathrm{i} \\times \\mathrm{L}=0.05 \\times 50=2.5 \\mathrm{~V}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f8e0279619d9d8a1d6b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "In LCR circuit the inductance is changed from L to $9 \\mathrm{~L}$. For same resonant\nfrequency the capacitance should be changed from $\\mathrm{C}$ to", "image": null}, "options": [{"id": "BcMgo", "text": "$9 \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "o7zZ9", "text": "$3 \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "V3Xdc", "text": "$\\frac{C}{9}$", "image": null, "isCorrect": true}, {"id": "rZ8Cz", "text": "$\\frac{C}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\omega=\\frac{1}{\\sqrt{\\mathrm{L}_{1} \\mathrm{C}_{1}}}=\\frac{1}{\\sqrt{\\mathrm{L}_{2} \\mathrm{C}_{2}}}$\n$\\therefore \\quad \\mathrm{L}_{1} \\mathrm{C}_{1}=\\mathrm{L}_{2} \\mathrm{C}_{2}$\n$\\quad \\mathrm{C}_{2}=\\frac{\\mathrm{L}_{1} \\mathrm{C}_{1}}{\\mathrm{~L}_{2}}=\\frac{\\mathrm{L}}{9 \\mathrm{~L}} \\times \\mathrm{C}=\\frac{\\mathrm{C}}{9}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f890279619d9d8a1d49", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "A series LCR circuit has $\\mathrm{R}=200 \\Omega, \\mathrm{L}=663 \\mathrm{mH}$ and $\\mathrm{C}=26 \\cdot 5 \\mu \\mathrm{F}$. The applied\nalternating voltage has an amplitude of $50 \\mathrm{~V}$ and a frequency of $60 \\mathrm{~Hz}$ so that\n$\\mathrm{X}_{\\mathrm{L}}=250 \\Omega$ and $\\mathrm{Xc}=100 \\Omega$. The peak current is", "image": null}, "options": [{"id": "65Vib", "text": "$0.33 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "Vatsr", "text": "$0 \\cdot 20 \\mathrm{~A}$", "image": null, "isCorrect": true}, {"id": "bypsY", "text": "$0.50 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "SjgTX", "text": "$0 \\cdot 25 \\mathrm{~A}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{R}=200 \\Omega \\quad \\mathrm{L}=663 \\mathrm{mH} \\quad \\mathrm{C}=26.5 \\mu \\mathrm{F}$\n$\\mathrm{V}_{0}=50 \\mathrm{~V}, \\mathrm{f}=60 \\mathrm{~Hz}$\n$\\math variant=\"normal\">m</mi><mi mathvariant=\"normal\">s</mi></mrow></msub></mrow><mrow><mi>Z</mi></mrow></mfrac><mo>.</mo><mfrac><mrow><mi>R</mi></mrow><mrow><mi>Z</mi></mrow></mfrac></math><br /><math><mo>=</mo><mfrac><mrow><mn>220</mn><mo>&#215;</mo><mn>220</mn><mo>&#215;</mo><mn>18</mn></mrow><mrow><mn>33</mn><mo>&#215;</mo><mn>33</mn></mrow></mfrac></math><br /><math><mo>=</mo><mfrac><mrow><mn>20</mn><mo>&#215;</mo><mn>20</mn><mo>&#215;</mo><mn>18</mn></mrow><mrow><mn>3</mn><mo>&#215;</mo><mn>3</mn></mrow></mfrac></math><br /><math><mo>=</mo><mn>20</mn><mo>&#215;</mo><mn>20</mn><mo>&#215;</mo><mn>2</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>800</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">W</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f62", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "MHT CET 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e9a0279619d9d8a15c3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "Inductive reactance of a coil is expressed in", "image": null}, "options": [{"id": "YsctN", "text": "ampere", "image": null, "isCorrect": false}, {"id": "u0YtI", "text": "ohm", "image": null, "isCorrect": true}, {"id": "wcQZR", "text": "volt", "image": null, "isCorrect": false}, {"id": "oLBJB", "text": "weber", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Inductive reactance or capacitive reactance are the impedance of an AC circuit which can be expressed in ohms.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e990279619d9d8a15bf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "The power factor is an $L-C-R$ circuit at resonance is", "image": null}, "options": [{"id": "CY27r", "text": "zero", "image": null, "isCorrect": false}, {"id": "EEBdQ", "text": "1", "image": null, "isCorrect": true}, {"id": "Qakiq", "text": "$0.8$", "image": null, "isCorrect": false}, {"id": "7870C", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "At resonance, $L-C-R$ circuit behaves as purely resistive circuit for purely resistive circuit power factor $=1$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e990279619d9d8a15be", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "If the conductance and capacitance are both doubled in $L-C$ - $R$ circuit, the resonant frequency of the circuit will", "image": null}, "options": [{"id": "IoEym", "text": "decrease to one-half the original value", "image": null, "isCorrect": true}, {"id": "9LDZt", "text": "decrease to one-fourth the original value", "image": null, "isCorrect": false}, {"id": "1dv5a", "text": "increase to twice the original value", "image": null, "isCorrect": false}, {"id": "kEU0D", "text": "decrease to twice the original value", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The resonant frequency\n$$\nv_{0}=\\frac{1}{2 \\pi \\sqrt{L C}} \\Rightarrow v_{0} \\propto \\frac{1}{\\sqrt{L C}}\n$$\nIf conductance and capacitance both are doubled, then\n$$\nv_{0}=\\frac{1}{2}\\left(\\frac{1}{2 \\pi} \\sqrt{L C}\\right)\n$$\nSo, the resonant frequency will decrease to one-half of the original value.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e990279619d9d8a15bd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "The resonant frequency of an $L-C$ circuit is", "image": null}, "options": [{"id": "va66K", "text": "$\\frac{1}{2 \\pi \\sqrt{L C}}$", "image": null, "isCorrect": true}, {"id": "raFG6", "text": "$\\frac{1}{2 \\pi} \\sqrt{\\frac{L}{C}}$", "image": null, "isCorrect": false}, {"id": "uaALl", "text": "$\\frac{1}{2 \\pi} \\sqrt{\\frac{L}{C}}$", "image": null, "isCorrect": false}, {"id": "SSdWQ", "text": "$\\frac{1}{2 \\pi} \\sqrt{\\frac{C}{L}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Resonant frequency (or natural frequency) of an $L-C$ circuit is given as\n$$\nv_{0}=\\left(\\frac{1}{2 \\pi \\sqrt{L C}}\\right)\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e990279619d9d8a15bb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "A lamp is connected is series with a capacitor and an AC source, what happens if the capacity of the capacitor is reduced?", "image": null}, "options": [{"id": "FT6yR", "text": "The lamp shines more brightly", "image": null, "isCorrect": false}, {"id": "DEnmi", "text": "The lamp shines less brightly", "image": null, "isCorrect": true}, {"id": "gGu12", "text": "There is no change in the brightness of the lamp", "image": null, "isCorrect": false}, {"id": "kJKhT", "text": "Brightness may increase or decrease depending on the frequency of the AC", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The lamp shines less brightly because, when capacity of the capaictor is reduced, the capacitive reactance $\\left(X_{C}=\\frac{1}{\\omega C}\\right)$ increases and hence, the current through the lamp decreases.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e990279619d9d8a15ba", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "In a purely inductive circuit, the current is", "image": null}, "options": [{"id": "izGXw", "text": "in phase with the voltage", "image": null, "isCorrect": false}, {"id": "LmNfa", "text": "out of phase with the voltage", "image": null, "isCorrect": false}, {"id": "xgrvk", "text": "leads the voltage by $\\pi / 2$", "image": null, "isCorrect": false}, {"id": "wI7eB", "text": "lags behind the voltage by $\\pi / 2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In a purely inductive circuit (an AC circuit containing inductance only) the current lags behind the voltage by $\\frac{\\pi}{2}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/CGma-_s076Ry3cNJYY-qsldiNysmgcSz-KgM5BEu1U8.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e890279619d9d8a153b", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "In a $L R$ circuit of $3 \\mathrm{mH}$ inductance and $4 \\Omega$ resistance, $\\operatorname{emf} E=4 \\cos 1000 t$ volt is applied. The amplitude of current is", "image": null}, "options": [{"id": "8ceKZ", "text": "$0.8 Å$", "image": null, "isCorrect": true}, {"id": "yPw3F", "text": "$\\frac{4}{7} Å$", "image": null, "isCorrect": false}, {"id": "KQqVr", "text": "$1.0 Å$", "image": null, "isCorrect": false}, {"id": "qpuvf", "text": "$\\frac{4}{\\sqrt{7}} Å$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$E=E_{0} \\cos \\omega t$\nGiven $E=4 \\cos 1000 t$\nFrom Eqs. (i) and (ii), we get\nPeak value of emf, $E_{0}=4 \\mathrm{~V}$\nAugular fiequency, $\\omega=1000 \\mathrm{~Hz}$\nNow pcak valuc of currcnt is\n$$\n\\begin{aligned}\ni_{0} &=\\frac{E_{0}}{Z}=\\frac{E_{0}}{\\sqrt{R^{2}+X_{L}^{2}}} \\\\\n&=\\frac{E_{0}}{\\sqrt{R^{2}+\\omega^{2} L^{2}}}\n\\end{aligned}\n$$\nPutting $E_{0}=4 \\mathrm{~V}, R=4 \\Omega$,\n$$\n\\begin{array}{l}\n\\omega=1000 \\mathrm{~Hz}, \\\\\nL=3 \\mathrm{mH}=3 \\times 10^{-3} \\mathrm{H}\n\\end{array}\n$$\nwe get $i_{0}=0.8 \\mathrm{~A}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e890279619d9d8a153a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "In $L-C-R$ circuit power factor at resonance is", "image": null}, "options": [{"id": "lZzJ5", "text": "less than one", "image": null, "isCorrect": false}, {"id": "4tX6r", "text": "greater than one", "image": null, "isCorrect": false}, {"id": "WZ6bm", "text": "unity", "image": null, "isCorrect": true}, {"id": "okZDj", "text": "Can't predicted", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In $L$ -C- $R$ circuit power factor at resonance in unity.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e650279619d9d8a1413", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "Same current is flowing in two alternating circuits. The first circuit contains only inductance and the other contains only a capacitor. If the frequency of the emf of $\\mathrm{AC}$ is increased, the effecton the value of the current will be", "image": null}, "options": [{"id": "Dq96S", "text": "increases in the first circuit and decreases in the other", "image": null, "isCorrect": false}, {"id": "u6mZu", "text": "increases in both the circuits", "image": null, "isCorrect": false}, {"id": "L01ZO", "text": "decreases in both the circuits", "image": null, "isCorrect": false}, {"id": "JUJtZ", "text": "decreases in the first circuit and increases in the other", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$I_{L}=\\frac{V}{X_{L}}$ and $I_{C}=\\frac{V}{X_{C}}$\nie, $I_{L} \\propto \\frac{1}{\\omega}$ and $I_{C} \\propto \\omega$\n$\\therefore$ with increase in $\\omega, I_{L}$ decreases while $I_{C}$ increases.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e4c0279619d9d8a1352", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "What is the value of inductance $L$ for which the current is a maximum in a series $L C R$ circuit with $C=10 \\mu \\mathrm{F}$ and $\\omega=1000 \\mathrm{~s}^{-1}$ ?", "image": null}, "options": [{"id": "K3Pbv", "text": "$100 \\mathrm{mH}$", "image": null, "isCorrect": true}, {"id": "Ge2XN", "text": "$1 \\mathrm{mH}$", "image": null, "isCorrect": false}, {"id": "6lQFo", "text": "Cannot be calculated unless $R$ is known", "image": null, "isCorrect": false}, {"id": "qyavt", "text": "$10 \\mathrm{mH}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Current in $L C R$ series circuit,\n$i=\\frac{V}{\\sqrt{R^{2}+\\left(X_{L}-X_{C}\\right)^{2}}}$\nwhere $V$ is rms value of current, $R$ is resistance, $X_{L}$ is inductive reactance and $X_{C}$ is capacitive reactance.\n\nFor current to be maximum, denominator should be minimum which can be done, if\n$$\nX_{L}=X_{C}\n$$\nThis happens in resonance state of the circuit ie,\n$$\n\\omega L=\\frac{1}{\\omega C}\n$$\nor $\\quad L=\\frac{1}{\\omega^{2} C}$ ...(i)\n$\\begin{aligned} \\text { Given, } \\omega &=1000 \\mathrm{~s}^{-1}, C=10 \\mu \\mathrm{F} \\\\ &=10 \\times 10^{-6} \\mathrm{~F} \\\\ \\text { Hence, } L &=\\frac{1}{(1000)^{2} \\times 10 \\times 10^{-6}} \\\\ &=0.1 \\mathrm{H} \\\\ &=100 \\mathrm{mH} \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e3f0279619d9d8a12e3", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "An electron is travelling along the $x$ -direction. It encounters a magnetic field in the $y$ -direction. Its subsequent motion will be", "image": null}, "options": [{"id": "Fs9F3", "text": "straight line along the $x$ -direction", "image": null, "isCorrect": false}, {"id": "xTjrp", "text": "a circle in the $x z$ -plane", "image": null, "isCorrect": false}, {"id": "LNoxx", "text": "a circle in the $y z$ -plane", "image": null, "isCorrect": false}, {"id": "QlcPl", "text": "a circle in the $x y$ -plane", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "If a particle carrying charge $q$ and moving with velocity $v$ through a point in magnetic field experiences a deflecting force $F$, then magnetic field $\\overrightarrow{\\mathbf{B}}$ is given by\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/bmt_gSVKI5CI7uSh1ZMggZTfcDT7LB8CBmZ9Hn89Erc.original.fullsize.png\"><br>\nHere,\n$$\n\\begin{array}{l}\n\\overrightarrow{\\mathbf{F}}=q \\overrightarrow{\\mathbf{v}} \\times \\overrightarrow{\\mathbf{B}} \\\\\n\\overrightarrow{\\mathbf{v}}=v_{x} \\hat{\\mathbf{i}} \\text { and }\n\\end{array}\n$$\n$$\n\\overrightarrow{\\mathbf{B}}=B_{y} \\hat{\\mathbf{j}}\n$$\n$\\therefore$\n$$\n\\overrightarrow{\\mathbf{F}}=e v_{x} B_{y}(\\hat{\\mathbf{i}} \\times \\hat{\\mathbf{j}})=e v_{x} B_{y} \\hat{\\mathbf{k}}\n$$\nHence, subsequent motion of the charged particle will be a circle in the $x y$ -plane.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a263290279619d9d8a3c88", "title": "Quality and Power Factor", "totalQuestions": 17, "questions": [{"_id": "6abb888e15a9fc0fc8c144d0", "type": "singleCorrect", "question": {"text": "In an a.c. circuit, if the power factor changes from $0.5$ to $0.25$ then the increase in impedance is", "image": null}, "options": [{"id": "j57l7", "label": "A", "text": "twice", "isCorrect": true, "image": null}, {"id": "19gmV", "label": "B", "text": "half", "isCorrect": false, "image": null}, {"id": "xm7hX", "label": "C", "text": "four times", "isCorrect": false, "image": null}, {"id": "UlLu0", "label": "D", "text": "eight times", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The power factor of an a.c. circuit is given by $\\cos \\phi = \\dfrac{R}{Z}$<br><br>Rearranging for impedance, we get $Z = \\dfrac{R}{\\cos \\phi}$<br><br>For the initial state, the power factor is $\\cos \\phi_1 = 0.5$<br><br>$Z_1 = \\dfrac{R}{0.5} = 2R$<br><br>For the final state, the power factor is $\\cos \\phi_2 = 0.25$<br><br>$Z_2 = \\dfrac{R}{0.25} = 4R$<br><br>Taking the ratio of the final and initial impedance:<br><br>$\\dfrac{Z_2}{Z_1} = \\dfrac{4R}{2R} = 2$<br><br>$Z_2 = 2Z_1$<br><br>Thus, the impedance becomes twice its initial value.<br><br>Answer: twice", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d35e8c30a4553e1be2fd", "type": "singleCorrect", "question": {"text": "In an a.c. circuit containing L, C and R in series, the ratio of apparent power to the true power is<br>(Z= impedance of the circuit and R= resistance )", "image": null}, "options": [{"id": "bMtyb", "label": "A", "text": "$RZ$", "isCorrect": false, "image": null}, {"id": "3m98x", "label": "B", "text": "$\\cos \\phi$", "isCorrect": false, "image": null}, {"id": "rKC0R", "label": "C", "text": "$\\cot \\phi$", "isCorrect": false, "image": null}, {"id": "SmdWh", "label": "D", "text": "$\\dfrac{Z}{R}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Apparent power is given by $P_{app} = V_{rms} I_{rms}$<br><br>True power is given by $P_{true} = V_{rms} I_{rms} \\cos \\phi$<br><br>The ratio of apparent power to true power is $\\dfrac{P_{app}}{P_{true}} = \\dfrac{V_{rms} I_{rms}}{V_{rms} I_{rms} \\cos \\phi} = \\dfrac{1}{\\cos \\phi}$<br><br>In a series LCR circuit, the power factor is $\\cos \\phi = \\dfrac{R}{Z}$<br><br>Substituting this value, the ratio becomes $\\dfrac{Z}{R}$<br><br>Answer: $\\dfrac{Z}{R}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bd7bf9280d7f9932cef", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "In an a.c. circuit containing $L, C, R$ in series the ratio of true power to apparent power is\n( $\\mathrm{Z}=$ impedance of the circuit and R is the resistance)", "image": null}, "options": [{"id": "T4Xkk", "text": "$\\frac{\\mathrm{Z}}{\\mathrm{R}}$", "image": null, "isCorrect": false}, {"id": "wdMT1", "text": "$\\tan \\phi$", "image": null, "isCorrect": false}, {"id": "BFwOn", "text": "$\\cot \\phi$", "image": null, "isCorrect": false}, {"id": "5l5Vy", "text": "$\\frac{\\mathrm{R}}{\\mathrm{Z}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "True power in an a.c. circuit is given by $P = V_{\\text{rms}} I_{\\text{rms}} \\cos \\phi$.<br><br>Apparent power is given by $P_{\\text{app}} = V_{\\text{rms}} I_{\\text{rms}}$.<br><br>The ratio of true power to apparent power is $\\dfrac{P}{P_{\\text{app}}} = \\cos \\phi$.<br><br>In a series LCR circuit, from the impedance triangle, the power factor is $\\cos \\phi = \\dfrac{R}{Z}$.<br><br>Thus, the ratio is $\\dfrac{R}{Z}$.<br><br>Answer: $\\frac{\\mathrm{R}}{\\mathrm{Z}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba7bf9280d7f9932b46", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "In LCR series circuit, when ' $L$ ' is removed from the circuit, the phase difference between voltage and current in the circuit is $\\frac{\\pi}{3}$. If ' $C$ ' is removed from the circuit instead of $L$ then phase difference is again $\\frac{\\pi}{3}$. The power factor of the circuit is $\\left(\\tan 60^{\\circ}=\\sqrt{3}\\right)$", "image": null}, "options": [{"id": "CVISG", "text": "$\\frac{\\sqrt{3}}{2}$", "image": null, "isCorrect": false}, {"id": "LPpF8", "text": "$\\sqrt{2}$", "image": null, "isCorrect": false}, {"id": "vvFvi", "text": "$\\frac{1}{\\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "3pVCo", "text": "1", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "When $L$ is removed, the circuit becomes an RC circuit. The phase difference is $\\phi = \\dfrac{\\pi}{3}$.<br><br>$\\tan \\phi = \\dfrac{X_C}{R} \\Rightarrow \\tan \\dfrac{\\pi}{3} = \\dfrac{X_C}{R} \\Rightarrow X_C = \\sqrt{3}R$<br><br>When $C$ is removed, the circuit becomes an RL circuit. The phase difference is again $\\phi = \\dfrac{\\pi}{3}$.<br><br>$\\tan \\phi = \\dfrac{X_L}{R} \\Rightarrow \\tan \\dfrac{\\pi}{3} = \\dfrac{X_L}{R} \\Rightarrow X_L = \\sqrt{3}R$<br><br>For the LCR series circuit, the net reactance is $X_L - X_C$.<br><br>Since $X_L = X_C = \\sqrt{3}R$, the net reactance is zero. The circuit is in resonance.<br><br>The impedance of the circuit is $Z = \\sqrt{R^2 + (X_L - X_C)^2} = R$.<br><br>The power factor of the circuit is $\\cos \\phi = \\dfrac{R}{Z} = \\dfrac{R}{R} = 1$.<br><br>Answer: 1", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba6bf9280d7f9932b3f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The power factor of a CR circuit is $\\frac{1}{\\sqrt{2}}$, If the frequency of a. c. signal is halved, then the power factor of the circuit will become", "image": null}, "options": [{"id": "SbTEf", "text": "$\\frac{1}{\\sqrt{3}}$", "image": null, "isCorrect": false}, {"id": "naPrl", "text": "$\\frac{1}{\\sqrt{5}}$", "image": null, "isCorrect": true}, {"id": "XdhNu", "text": "$\\frac{1}{\\sqrt{7}}$", "image": null, "isCorrect": false}, {"id": "r52zi", "text": "$\\frac{1}{\\sqrt{11}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The power factor of a CR circuit is given by $\\cos \\phi = \\dfrac{R}{Z} = \\dfrac{R}{\\sqrt{R^2 + X_C^2}}$.<br><br>Given that the initial power factor is $\\dfrac{1}{\\sqrt{2}}$, we have:<br><br>$\\dfrac{R}{\\sqrt{R^2 + X_C^2}} = \\dfrac{1}{\\sqrt{2}}$<br><br>Squaring both sides, we get:<br><br>$\\dfrac{R^2}{R^2 + X_C^2} = \\dfrac{1}{2}$<br><br>$2R^2 = R^2 + X_C^2 \\Rightarrow R = X_C$<br><br>The capacitive reactance is $X_C = \\dfrac{1}{2\\pi f C}$.<br><br>When the frequency $f$ is halved, the new frequency is $f' = \\dfrac{f}{2}$. The new capacitive reactance becomes:<br><br>$X_C' = \\dfrac{1}{2\\pi \\left(\\dfrac{f}{2}\\right) C} = 2X_C$<br><br>Since $X_C = R$, we have $X_C' = 2R$.<br><br>The new impedance of the circuit is:<br><br>$Z' = \\sqrt{R^2 + (X_C')^2} = \\sqrt{R^2 + (2R)^2} = \\sqrt{5R^2} = \\sqrt{5}R$<br><br>The new power factor is:<br><br>$\\cos \\phi' = \\dfrac{R}{Z'} = \\dfrac{R}{\\sqrt{5}R} = \\dfrac{1}{\\sqrt{5}}$<br><br>Answer: $\\frac{1}{\\sqrt{5}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b97bf9280d7f9932aa8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If the power factor changes from 0.5 to 0.25 because impedance changes from $Z_1$ to $Z_2$ then $Z_1=x Z_2$. The value of $x$ is (Resistance remains constant)", "image": null}, "options": [{"id": "P9nq3", "text": "$0.1$", "image": null, "isCorrect": false}, {"id": "NrdfB", "text": "$0.5$", "image": null, "isCorrect": true}, {"id": "HHCOX", "text": "$0.7$", "image": null, "isCorrect": false}, {"id": "4i7La", "text": "$0.4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The power factor of an AC circuit is given by $\\cos \\phi = \\dfrac{R}{Z}$<br><br>For the first case, $\\cos \\phi_1 = 0.5$<br><br>$\\dfrac{R}{Z_1} = 0.5 \\Rightarrow Z_1 = \\dfrac{R}{0.5} = 2R$<br><br>For the second case, $\\cos \\phi_2 = 0.25$<br><br>$\\dfrac{R}{Z_2} = 0.25 \\Rightarrow Z_2 = \\dfrac{R}{0.25} = 4R$<br><br>Given $Z_1 = x Z_2$<br><br>$2R = x(4R)$<br><br>$x = \\dfrac{2}{4} = 0.5$<br><br>Answer: $0.5$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b74bf9280d7f993295e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "In an a.c. circuit containing $L, C$ and $R$ in series, the ratio of apparent power to the true power is (Z and R are the impedance and resistance respectively, $\\phi=$ phase angle)", "image": null}, "options": [{"id": "73qtj", "text": "$\\cot \\phi$", "image": null, "isCorrect": false}, {"id": "qTft6", "text": "$\\cos \\phi$", "image": null, "isCorrect": false}, {"id": "ypW02", "text": "RZ", "image": null, "isCorrect": false}, {"id": "c40pc", "text": "$\\frac{\\mathrm{Z}}{\\mathrm{R}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The apparent power in an a.c. circuit is given by $P_{app} = V_{rms} I_{rms}$<br><br>The true power is given by $P_{true} = V_{rms} I_{rms} \\cos \\phi$<br><br>The ratio of apparent power to true power is:<br><br>$\\dfrac{P_{app}}{P_{true}} = \\dfrac{V_{rms} I_{rms}}{V_{rms} I_{rms} \\cos \\phi} = \\dfrac{1}{\\cos \\phi}$<br><br>In a series LCR circuit, the power factor is $\\cos \\phi = \\dfrac{R}{Z}$<br><br>Substituting this value, we get:<br><br>$\\dfrac{P_{app}}{P_{true}} = \\dfrac{1}{\\left(\\dfrac{R}{Z}\\right)} = \\dfrac{Z}{R}$<br><br>Answer: $\\frac{\\mathrm{Z}}{\\mathrm{R}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b67bf9280d7f99328e1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "When alternating current of frequency $50 \\text{ Hz}$ is passed through L-R series circuit, the power factor is $\\frac{\\sqrt{3}}{2}$ and $R=50 \\Omega$, then the value of $L$ is\n$\\left[\\cos \\frac{\\pi}{6}=\\frac{\\sqrt{3}}{2}, \\quad \\sin \\frac{\\pi}{6}=\\frac{1}{2}, \\quad \\tan \\frac{\\pi}{6}=\\frac{1}{\\sqrt{3}}\\right]$", "image": null}, "options": [{"id": "2sF8n", "text": "$\\frac{1}{2} \\pi$", "image": null, "isCorrect": false}, {"id": "JAKwz", "text": "$\\frac{\\sqrt{3}}{2} \\pi$", "image": null, "isCorrect": false}, {"id": "tygmG", "text": "$\\frac{1}{2 \\sqrt{3} \\pi}$", "image": null, "isCorrect": true}, {"id": "uy4qL", "text": "$\\frac{1}{\\sqrt{3} \\pi}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The power factor is given by $\\cos \\phi = \\dfrac{\\sqrt{3}}{2}$<br><br>$\\Rightarrow \\phi = \\dfrac{\\pi}{6}$<br><br>In an L-R series circuit, the phase angle is related to the reactance and resistance by $\\tan \\phi = \\dfrac{X_L}{R}$<br><br>$\\tan \\left(\\dfrac{\\pi}{6}\\right) = \\dfrac{X_L}{50}$<br><br>$\\dfrac{1}{\\sqrt{3}} = \\dfrac{X_L}{50}$<br><br>$X_L = \\dfrac{50}{\\sqrt{3}}$<br><br>Since the inductive reactance is $X_L = 2 \\pi f L$, substituting the given values yields:<br><br>$2 \\pi (50) L = \\dfrac{50}{\\sqrt{3}}$<br><br>$100 \\pi L = \\dfrac{50}{\\sqrt{3}}$<br><br>$L = \\dfrac{50}{100 \\sqrt{3} \\pi}$<br><br>$L = \\dfrac{1}{2 \\sqrt{3} \\pi} \\text{ H}$<br><br>Answer: $\\frac{1}{2 \\sqrt{3} \\pi}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b55bf9280d7f9932850", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "In an electrical circuit ' R ', ' L ', ' C ' and an a.c. voltage source are all connected in series. When ' $L$ ' is removed from the circuit, the phase difference between the voltage and the current in the circuit is $\\frac{\\pi}{3}$. If instead 'C' is removed from the circuit, the phase difference is again $\\frac{\\pi}{3}$. The power factor of the circuit is $\\left(\\tan \\frac{\\pi}{3}=\\sqrt{3}\\right)$", "image": null}, "options": [{"id": "BQLV9", "text": "$\\frac{\\sqrt{3}}{2}$", "image": null, "isCorrect": false}, {"id": "PZE4c", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "9Etjw", "text": "$\\frac{1}{\\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "zmxPr", "text": "$1$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "When $L$ is removed, the circuit becomes an $RC$ series circuit. The phase difference is $\\phi_1 = \\dfrac{\\pi}{3}$.<br><br>$\\tan \\phi_1 = \\dfrac{X_C}{R} \\Rightarrow \\dfrac{X_C}{R} = \\tan \\dfrac{\\pi}{3} = \\sqrt{3} \\Rightarrow X_C = \\sqrt{3} R$<br><br>When $C$ is removed, the circuit becomes an $RL$ series circuit. The phase difference is $\\phi_2 = \\dfrac{\\pi}{3}$.<br><br>$\\tan \\phi_2 = \\dfrac{X_L}{R} \\Rightarrow \\dfrac{X_L}{R} = \\tan \\dfrac{\\pi}{3} = \\sqrt{3} \\Rightarrow X_L = \\sqrt{3} R$<br><br>For the $LCR$ series circuit, the net reactance is $X_L - X_C$.<br><br>Since $X_L = X_C = \\sqrt{3} R$, the net reactance is zero.<br><br>The impedance of the circuit is $Z = \\sqrt{R^2 + (X_L - X_C)^2} = \\sqrt{R^2 + 0} = R$.<br><br>The power factor of the circuit is $\\cos \\phi = \\dfrac{R}{Z} = \\dfrac{R}{R} = 1$.<br><br>Answer: $1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b11bf9280d7f9932602", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "An a.c. source is applied to a series LR circuit with $X_L=3 R$ and power factor is $X_1$. Now a capacitor with $X_C=R$ is added in series to LR circuit and the power factor is $X_2$. The ratio $X_1$ to $X_2$ is", "image": null}, "options": [{"id": "7lZpD", "text": "$1: 2$", "image": null, "isCorrect": false}, {"id": "CKHiS", "text": "$2: 1$", "image": null, "isCorrect": false}, {"id": "Z146L", "text": "$1: \\sqrt{2}$", "image": null, "isCorrect": true}, {"id": "hC1Ty", "text": "$\\sqrt{2}: 1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the series LR circuit, the impedance is $Z_1 = \\sqrt{R^2 + X_L^2}$.<br><br>Given $X_L = 3R$, we have $Z_1 = \\sqrt{R^2 + (3R)^2} = \\sqrt{10}R$.<br><br>The power factor $X_1 = \\dfrac{R}{Z_1} = \\dfrac{R}{\\sqrt{10}R} = \\dfrac{1}{\\sqrt{10}}$.<br><br>When a capacitor with $X_C = R$ is added in series, the new impedance is $Z_2 = \\sqrt{R^2 + (X_L - X_C)^2}$.<br><br>Substituting the values, $Z_2 = \\sqrt{R^2 + (3R - R)^2} = \\sqrt{R^2 + 4R^2} = \\sqrt{
