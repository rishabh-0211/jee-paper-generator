, "isCorrect": true}], "correctValue": null, "solution": {"text": "A transformer is based on the principle of mutual inductance.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e990279619d9d8a15bc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "A transformer is a device which converts", "image": null}, "options": [{"id": "SzobB", "text": "low voltage at low current into high voltage at high current", "image": null, "isCorrect": false}, {"id": "rIEY4", "text": "high voltage at low current into low voltage at high current", "image": null, "isCorrect": true}, {"id": "FA9X7", "text": "high voltage at high current into low voltage at low current", "image": null, "isCorrect": false}, {"id": "z4MwT", "text": "electrical power into mechanical power", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Transformer is a device used to convert high alternating voltage at low current into low alternating voltage at high current and vice-versa.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e980279619d9d8a15b5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "A transformer works on", "image": null}, "options": [{"id": "GZcU0", "text": "DC only", "image": null, "isCorrect": false}, {"id": "tiVvy", "text": "AC only", "image": null, "isCorrect": true}, {"id": "NbLMi", "text": "Both AC and DC", "image": null, "isCorrect": false}, {"id": "dnfhx", "text": "high voltage only", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A transformer works on AC only an never on DC.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e970279619d9d8a15b1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "In a step-down transformer, the number of turns in", "image": null}, "options": [{"id": "6QAFY", "text": "primary are less", "image": null, "isCorrect": false}, {"id": "iJABj", "text": "primary are more", "image": null, "isCorrect": true}, {"id": "iOgM5", "text": "primary and secondary are equal", "image": null, "isCorrect": false}, {"id": "BW2H7", "text": "secondary are infinite", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In a step-down transformer, the number of turns of the primary coil are more than the number of turns of the secondary.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e4d0279619d9d8a1356", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "A transformer is used to light a $100 \\mathrm{~W}$ and $110 \\mathrm{~V}$ lamp from a $220 \\mathrm{~V}$ mains. If the main current is $0.5 \\mathrm{~A}$, the efficiency of the transformer is approximately", "image": null}, "options": [{"id": "tehDu", "text": "$30 \\%$", "image": null, "isCorrect": false}, {"id": "m9yRU", "text": "$50 \\%$", "image": null, "isCorrect": false}, {"id": "YzPBy", "text": "$90 \\%$", "image": null, "isCorrect": true}, {"id": "hxW14", "text": "$10 \\%$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The efficiency of transformer $=\\frac{\\text { Energy obtained from the secondary coil }}{\\text { Energy given to the primary coil }}$\nOr $\\eta=\\frac{\\text { Output power }}{\\text { Input power }}$\nor\n$$\n\\eta=\\frac{V_{s} I_{s}}{V_{p} I_{p}}\n$$\nGiven, $\\quad V_{s} I_{s}=100 \\mathrm{~W}, V_{p}=220 \\mathrm{~V}, I_{p}=0.5 \\mathrm{~A}$\n$$\n\\text { Hence, } \\quad \\eta=\\frac{100}{220 \\times 0.5}=0.90=90 \\%\n$$\nNote The efficiency of an ideal transformer is 1 (or $100 \\%$ ). But in practice due to loss in energy, the efficiency of transformer is always less than 1 (or less than $100 \\%$ ).", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "65a263290279619d9d8a3c89", "title": "Parallel AC Circuits", "totalQuestions": 7, "questions": [{"_id": "65a260e00279619d9d8a2802", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}], "question": {"text": "With an alternating voltage source of frequency ' $\\mathrm{f}$ ', inductor ' $\\mathrm{L}$ ', capacitor ' $\\mathrm{C}$ ' and resistance ' $\\mathrm{R}$ ' are connected in series. The voltage leads the currently by $45^{\\circ}$. The value of ' $L$ ' is ( $\\left.\\tan 45^{\\circ}=1\\right)$", "image": null}, "options": [{"id": "oG5Ir", "text": "$\\left(\\frac{4 \\pi^2 f^2 C}{1+2 \\pi f C R}\\right)$", "image": null, "isCorrect": false}, {"id": "tRjhM", "text": "$\\left(\\frac{1+2 \\pi \\mathrm{fCR}}{4 \\pi^2 \\mathrm{f}^2 \\mathrm{C}}\\right)$", "image": null, "isCorrect": true}, {"id": "uMJxB", "text": "$\\left(\\frac{1-2 \\pi \\mathrm{fCR}}{4 \\pi^2 \\mathrm{f}^2 \\mathrm{C}}\\right)$", "image": null, "isCorrect": false}, {"id": "xQpQ0", "text": "$\\left(\\frac{4 \\pi^2 f^2 C}{1-2 \\pi f C R}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The correct option is (B).\nConcept: Consider the following Phasor diagram for a series LCR circuit:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/P7dmNLbTtO4Szn5eugrApIL_z_eVmU_8GxbiZuU_1Ys.original.fullsize.png\">\nIf the voltage leads the current by an angle $\\theta=45^{\\circ}$ then,\n$\\begin{aligned} & \\tan (\\theta)=\\frac{\\left(X_L-X_C\\right)}{R}=\\tan \\left(45^{\\circ}\\right) \\\\ & X_L-X_C=R\\end{aligned}$\nIntroducing, inductive reactance $X_L=2 \\pi \\mathrm{fL}$, capacitive reactance\n$X_C=\\frac{1}{2 \\pi f C}$ and resistor $R$\n$2 \\pi f L-\\frac{1}{2 \\pi f C}=R$\nOn re-writing, $L=\\left(\\frac{1}{2 \\pi f C}+R\\right)\\left(\\frac{1}{2 \\pi f}\\right)$ or $\\left(\\frac{1+2 \\pi f C R}{4 \\pi^2 f^2 C}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260c90279619d9d8a274d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "A rejector circuit is the resonant circuit in which", "image": null}, "options": [{"id": "0IhzM", "text": "$\\mathrm{L}-\\mathrm{C}-\\mathrm{R}$ are connected in parallel.", "image": null, "isCorrect": true}, {"id": "Wk0yI", "text": "$\\mathrm{L}-\\mathrm{C}-\\mathrm{R}$ are connected series.", "image": null, "isCorrect": false}, {"id": "xAHpz", "text": "$\\mathrm{C}-\\mathrm{R}$ are connected in series.", "image": null, "isCorrect": false}, {"id": "Gxns0", "text": "$\\mathrm{L}-\\mathrm{R}$ are connected in series.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A rejector circuit is the resonant circuit in which $\\mathrm{L}-\\mathrm{C}-\\mathrm{R}$ are connected in parallel.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2607f0279619d9d8a24f5", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "For the circuit shown below, instantaneous current through inductor ' $\\mathrm{L}$ ' and capacitor ' $\\mathrm{C}$ ' is respectively.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/DIr2nqh4UT0nJbX_XYTYwuG1wlRESdoEZgnRV2rp6i8.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "ba9Sc", "text": "$\\frac{-\\mathrm{e}_0}{\\omega \\mathrm{L}} \\cos \\omega \\mathrm{t} ; \\mathrm{e}_0 \\omega \\mathrm{c} \\cos \\omega \\mathrm{t}$", "image": null, "isCorrect": true}, {"id": "d63ya", "text": "$\\frac{-\\mathrm{e}_0}{\\omega \\mathrm{L}} \\sin \\omega \\mathrm{t} ; \\frac{\\mathrm{e}_0}{\\omega \\mathrm{C}} \\cos \\omega \\mathrm{t}$", "image": null, "isCorrect": false}, {"id": "3ckhs", "text": "$\\frac{\\mathrm{e}_0 \\mathrm{C}}{\\mathrm{L}} \\cos \\omega \\mathrm{t} ; \\frac{\\mathrm{e}_0 \\mathrm{~L}}{\\mathrm{C}} \\sin \\omega \\mathrm{t}$", "image": null, "isCorrect": false}, {"id": "hB6tt", "text": "$\\frac{-\\mathrm{e}_0 \\mathrm{C}}{\\mathrm{L}} \\sin \\omega \\mathrm{t} ; \\frac{\\mathrm{e}_0 \\mathrm{~L}}{\\mathrm{C}} \\cos \\omega \\mathrm{t}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The current through the inductor lags the applied emf by $\\frac{\\pi}{2}$ and the current through the capacitor leads the current by $\\frac{\\pi}{2}$\n$$\n\\begin{aligned}\n& \\therefore \\mathrm{i}_{\\mathrm{L}}=\\frac{\\mathrm{e}_0}{\\omega \\mathrm{L}} \\sin \\left(\\omega \\mathrm{t}-\\frac{\\pi}{2}\\right)=-\\frac{\\mathrm{e}_0}{\\omega \\mathrm{L}} \\cos \\omega \\mathrm{t} \\\\\n& \\text { and } \\mathrm{i}_{\\mathrm{c}}=\\mathrm{e}_0 \\omega \\mathrm{C} \\sin \\left(\\omega \\mathrm{t}+\\frac{\\pi}{2}\\right)=\\mathrm{e}_0 \\omega \\mathrm{C} \\cos \\omega \\mathrm{t}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2606d0279619d9d8a2465", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "The frequency of the output signal of an LC oscillator circuit is ' $F$ ' $\\mathrm{Hz}$ with a capacitance of $0.1 \\mu \\mathrm{F}$. If the value of the capacitor is increased to $0.2 \\mu \\mathrm{F}$, then the frequency of the output signal will be", "image": null}, "options": [{"id": "xgRiG", "text": "$\\frac{F}{\\sqrt{2}} \\mathrm{~Hz}$", "image": null, "isCorrect": true}, {"id": "r5ZuM", "text": "$\\frac{F}{\\sqrt{3}} \\mathrm{~Hz}$", "image": null, "isCorrect": false}, {"id": "Ibzix", "text": "$\\frac{F}{2} \\mathrm{~Hz}$", "image": null, "isCorrect": false}, {"id": "5VHcc", "text": "$2 F \\mathrm{~Hz}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The frequency of LC oscillation is given by\n$$\n\\begin{aligned}\n& F=\\frac{1}{2 \\pi \\sqrt{\\mathrm{LC}}} \\\\\n& \\therefore \\frac{F_2}{F_1}=\\sqrt{\\frac{C_1}{C_2}}=\\sqrt{\\frac{0.1}{0.2}}=\\frac{1}{\\sqrt{2}} \\\\\n& \\therefore F_2=\\frac{F_1}{\\sqrt{2}}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f1a0279619d9d8a19ca", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}], "question": {"text": "A parallel combination of pure inductor and capacitor is connected across a source of alternating e.m.f. 'e'. The currents flowing through an inductor and capacitor are\n$i_{L}$ and $i_{C}$ respectively. In this parallel resonant circuit, the condition for currents $i$,\n$i_{L}$ and $i_{C}$ is ( $i=$ net $\\mathrm{r}$.m.s. current in the circuit)", "image": null}, "options": [{"id": "AlIKf", "text": "$i \\doteq 0, i_{L}=i_{C} \\neq 0$", "image": null, "isCorrect": true}, {"id": "fofNp", "text": "$i \\neq 0, i_{L}=i_{C}=0$", "image": null, "isCorrect": false}, {"id": "AOxuk", "text": "$i \\doteq i_{L}=i_{C}$", "image": null, "isCorrect": false}, {"id": "GG1v1", "text": "$i \\doteq 0, i_{L} \\neq i_{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In parallel resonant circuit, the capacitive and inductive reactance are equal, hence currents are equal but $180^{\\circ}$ out of phase with each other. The net current is zero. $\\therefore \\mathrm{i}=0, \\mathrm{i}_{2}=\\mathrm{i}_{\\mathrm{c}} \\neq 0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ec00279619d9d8a16fa", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f62", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "MHT CET 2017"}], "question": {"text": "Out of the following graphs, which graph shows the correct relation (graphical representation) for LC Parallel resonant circuit?", "image": null}, "options": [{"id": "uibSj", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/hnjudpmauvrtacuqdrasanaosndavbqmknoyuvapedrwhncypj.jpeg\" />", "image": null, "isCorrect": false}, {"id": "vG0RV", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/iptycepekaxbobvwfvkhlsffamgnqiychzidbzonisjoecobww.jpeg\" />", "image": null, "isCorrect": false}, {"id": "oU6mk", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/vdxjrrfonydnajtndrcvslwfyytlfsumxrewyswmaxyfeubijz.jpeg\" />", "image": null, "isCorrect": false}, {"id": "xi3R1", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/xznietafmypcrskywgnujueiewpluowycdqcvohsubqjemvuhu.jpeg\" />", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "At parallel resonance, current is minimum.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f62", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "MHT CET 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ead0279619d9d8a1665", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}], "question": {"text": "The LC parallel resonant circuit", "image": null}, "options": [{"id": "4jU6N", "text": "has a very high impedance", "image": null, "isCorrect": true}, {"id": "xBKQK", "text": "has a very high current", "image": null, "isCorrect": false}, {"id": "HL320", "text": "acts as resistance of very low value", "image": null, "isCorrect": false}, {"id": "LGrTQ", "text": "has zero impedance", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "LC parallel resonant circuit has a very high impedance.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
