sJ8W05Yj1Mb_j1R0lVE.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "3YcJT", "text": "$\\frac{1}{4 \\pi \\sqrt{\\mathrm{LC}}}$", "image": null, "isCorrect": false}, {"id": "NWinF", "text": "$\\frac{1}{2 \\pi \\sqrt{\\mathrm{LC}}}$", "image": null, "isCorrect": false}, {"id": "dkMeP", "text": "$\\frac{1}{\\pi \\sqrt{\\mathrm{LC}}}$", "image": null, "isCorrect": true}, {"id": "Buqjg", "text": "$\\frac{2}{\\pi \\sqrt{\\mathrm{LC}}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From the given circuit diagram, the two inductors of inductance $L$ are connected in parallel. Their equivalent inductance $L_{eq}$ is:<br><br>$L_{eq} = \\dfrac{L \\times L}{L + L} = \\dfrac{L}{2}$<br><br>The two capacitors of capacitance $C$ are connected in series. Their equivalent capacitance $C_{eq}$ is:<br><br>$C_{eq} = \\dfrac{C \\times C}{C + C} = \\dfrac{C}{2}$<br><br>The resonant frequency $f$ of the series $L-C$ circuit is given by:<br><br>$f = \\dfrac{1}{2\\pi \\sqrt{L_{eq} C_{eq}}}$<br><br>Substituting the values of $L_{eq}$ and $C_{eq}$:<br><br>$f = \\dfrac{1}{2\\pi \\sqrt{\\left(\\dfrac{L}{2}\\right) \\left(\\dfrac{C}{2}\\right)}}$<br><br>$f = \\dfrac{1}{2\\pi \\sqrt{\\dfrac{LC}{4}}}$<br><br>$f = \\dfrac{1}{2\\pi \\left(\\dfrac{\\sqrt{LC}}{2}\\right)}$<br><br>$f = \\dfrac{1}{\\pi \\sqrt{LC}}$<br><br>Answer: $\\frac{1}{\\pi \\sqrt{\\mathrm{LC}}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bcbbf9280d7f9932c77", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "In a discharging series LCR circuit $\\mathrm{C}=2 \\mu \\mathrm{F}, \\mathrm{~L}=5 \\mathrm{mH}$ and $\\mathrm{R}=5 \\Omega$. The ratio of energy stored in the inductor to that in capacitor, when maximum current flows through the circuit is", "image": null}, "options": [{"id": "Ut24d", "text": "200:1", "image": null, "isCorrect": false}, {"id": "Upa7B", "text": "100:1", "image": null, "isCorrect": true}, {"id": "Gp08K", "text": "300:1", "image": null, "isCorrect": false}, {"id": "KnuFB", "text": "500:1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a discharging series LCR circuit, the voltage equation is given by:<br><br>$L \\dfrac{dI}{dt} + I R + \\dfrac{q}{C} = 0$<br><br>When the maximum current flows through the circuit, the rate of change of current is zero, i.e., $\\dfrac{dI}{dt} = 0$. Substituting this into the equation, we get:<br><br>$I R + \\dfrac{q}{C} = 0 \\Rightarrow q = -I R C$<br><br>The energy stored in the inductor is:<br><br>$U_L = \\dfrac{1}{2} L I^2$<br><br>The energy stored in the capacitor is:<br><br>$U_C = \\dfrac{q^2}{2C}$<br><br>Substituting $q = -I R C$ into the expression for $U_C$:<br><br>$U_C = \\dfrac{(-I R C)^2}{2C} = \\dfrac{1}{2} I^2 R^2 C$<br><br>The ratio of the energy stored in the inductor to that in the capacitor is:<br><br>$\\dfrac{U_L}{U_C} = \\dfrac{\\dfrac{1}{2} L I^2}{\\dfrac{1}{2} I^2 R^2 C} = \\dfrac{L}{R^2 C}$<br><br>Given values are $L = 5 \\times 10^{-3} \\text{ H}$, $R = 5 \\, \\Omega$, and $C = 2 \\times 10^{-6} \\text{ F}$. Substituting these values:<br><br>$\\dfrac{U_L}{U_C} = \\dfrac{5 \\times 10^{-3}}{(5)^2 \\times 2 \\times 10^{-6}}$<br><br>$\\dfrac{U_L}{U_C} = \\dfrac{5 \\times 10^{-3}}{25 \\times 2 \\times 10^{-6}} = \\dfrac{5 \\times 10^{-3}}{50 \\times 10^{-6}}$<br><br>$\\dfrac{U_L}{U_C} = \\dfrac{5000 \\times 10^{-6}}{50 \\times 10^{-6}} = 100$<br><br>Thus, the ratio is $100:1$.<br><br>Answer: 100:1", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bc8bf9280d7f9932c59", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A resistor of $50 \\Omega$, inductor of self inductance $\\left(\\frac{2}{\\pi^2}\\right) \\mathrm{H}$ and a capacitor of unknown capacity are connected in series to an a.c. source of $100 \\mathrm{~V}, 50$ Hz supply. When the voltage and current are in phase, the value of capacitance is", "image": null}, "options": [{"id": "wlD8J", "text": "$10 \\mu \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "JDREI", "text": "$20 \\mu \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "ofiTO", "text": "$40 \\mu \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "nfRAC", "text": "$50 \\mu \\mathrm{~F}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given that the voltage and current are in phase, the circuit is in resonance.<br><br>At resonance, the inductive reactance is equal to the capacitive reactance:<br><br>$X_L = X_C$<br><br>$\\omega L = \\dfrac{1}{\\omega C}$<br><br>$C = \\dfrac{1}{\\omega^2 L}$<br><br>Substituting $\\omega = 2\\pi f$:<br><br>$C = \\dfrac{1}{(2\\pi f)^2 L}$<br><br>Given $f = 50$ Hz and $L = \\dfrac{2}{\\pi^2}$ H:<br><br>$C = \\dfrac{1}{(2\\pi \\times 50)^2 \\times \\left(\\dfrac{2}{\\pi^2}\\right)}$<br><br>$C = \\dfrac{1}{10000\\pi^2 \\times \\dfrac{2}{\\pi^2}}$<br><br>$C = \\dfrac{1}{20000}$ F<br><br>$C = 50 \\times 10^{-6}$ F = $50 \\mu$F<br><br>Answer: $50 \\mu \\mathrm{~F}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bb9bf9280d7f9932bde", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "An a.c. source of frequency ' $f$ ' is connected to a circuit containing an inductance ' $L$ ' and resistance ' $R$ ' in series. The impedance of this circuit is", "image": null}, "options": [{"id": "Pb9hH", "text": "$\\sqrt{\\mathrm{R}^2+2 \\pi \\mathrm{fL}^2}$", "image": null, "isCorrect": false}, {"id": "XH7d4", "text": "$\\sqrt{R^2+L^2}$", "image": null, "isCorrect": false}, {"id": "W3YJf", "text": "$\\mathrm{R}+2 \\pi \\mathrm{fL}$", "image": null, "isCorrect": false}, {"id": "K4mLB", "text": "$\\sqrt{R^2+4 \\pi^2 f^2 L^2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The impedance $Z$ of a series LR circuit is given by the formula:<br><br>$Z = \\sqrt{R^2 + X_L^2}$<br><br>where $X_L$ is the inductive reactance. The inductive reactance is related to the frequency $f$ and inductance $L$ by:<br><br>$X_L = \\omega L = 2 \\pi f L$<br><br>Substituting the value of $X_L$ into the impedance equation, we get:<br><br>$Z = \\sqrt{R^2 + (2 \\pi f L)^2}$<br><br>$Z = \\sqrt{R^2 + 4 \\pi^2 f^2 L^2}$<br><br>Answer: $\\sqrt{R^2+4 \\pi^2 f^2 L^2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bb4bf9280d7f9932bb9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "In an $L R$ circuit, the value of $L$ is $\\left(\\frac{0.3}{\\pi}\\right)$ henry and the value of $R$ is $40 \\Omega$, If in the circuit, an alternating e.m.f of 230 V at 50 cycles per second is connected, the impedance of the circuit and current will be respectively", "image": null}, "options": [{"id": "p9iTv", "text": "$12.5 \\Omega, 9.2 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "JcZ4m", "text": "$46.4 \\Omega, 6.4 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "xk7PL", "text": "$23.2 \\Omega, 5 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "u7OOg", "text": "$50 \\Omega, 4.6 \\mathrm{~A}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The inductive reactance is given by $X_L = 2 \\pi f L$<br><br>Substituting the given values:<br><br>$X_L = 2 \\pi \\times 50 \\times \\dfrac{0.3}{\\pi} = 30 \\, \\Omega$<br><br>The impedance of the $L R$ circuit is $Z = \\sqrt{R^2 + X_L^2}$<br><br>$Z = \\sqrt{40^2 + 30^2} = \\sqrt{1600 + 900} = \\sqrt{2500} = 50 \\, \\Omega$<br><br>The current in the circuit is $I = \\dfrac{V}{Z}$<br><br>$I = \\dfrac{230}{50} = 4.6 \\, \\text{A}$<br><br>Answer: $50 \\Omega, 4.6 \\mathrm{~A}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b87bf9280d7f9932a15", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Figure shows the combination of inductances and capacitances. Resonant frequency of the L - C circuit is\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/RKa230ISXzB8oLMhaJGvg_zH1qM3MHXAkevjaSxIsOQ.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "eIykH", "text": "$\\frac{1}{2 \\pi \\sqrt{\\mathrm{LC}}}$", "image": null, "isCorrect": false}, {"id": "yjqZ1", "text": "$\\frac{1}{3 \\pi \\sqrt{\\mathrm{LC}}}$", "image": null, "isCorrect": false}, {"id": "bX1H2", "text": "$\\frac{1}{4 \\pi \\sqrt{\\mathrm{LC}}}$", "image": null, "isCorrect": false}, {"id": "pv3XB", "text": "$\\frac{1}{6 \\pi \\sqrt{\\mathrm{LC}}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "From the given circuit diagram, the inductors $L$ and $2L$ are connected in series. Their equivalent inductance is:<br><br>$L_{eq} = L + 2L = 3L$<br><br>The capacitors $C$ and $2C$ are connected in parallel. Their equivalent capacitance is:<br><br>$C_{eq} = C + 2C = 3C$<br><br>The equivalent inductor and the equivalent capacitor are connected in parallel to the a.c. source, forming an $L-C$ resonant circuit. The resonant frequency of this circuit is given by:<br><br>$f = \\dfrac{1}{2\\pi\\sqrt{L_{eq}C_{eq}}}$<br><br>Substituting the values of $L_{eq}$ and $C_{eq}$:<br><br>$f = \\dfrac{1}{2\\pi\\sqrt{(3L)(3C)}}$<br><br>$f = \\dfrac{1}{2\\pi\\sqrt{9LC}}$<br><br>$f = \\dfrac{1}{6\\pi\\sqrt{LC}}$<br><br>Answer: $\\frac{1}{6 \\pi \\sqrt{\\mathrm{LC}}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b86bf9280d7f9932a09", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "In an a.c. circuit with pure capacitance 'C' and a.c. source $\\mathrm{E}=\\mathrm{E}_0 \\sin \\omega \\mathrm{t}$, the equation of instantaneous current is given by", "image": null}, "options": [{"id": "OCPYs", "text": "$I=E_0 \\omega c \\sin (\\omega t)$", "image": null, "isCorrect": false}, {"id": "NaiQn", "text": "$I=E_0 \\omega c \\sin \\left(\\omega t+\\frac{\\pi}{2}\\right)$", "image": null, "isCorrect": true}, {"id": "bahVv", "text": "$I=\\frac{E_0}{\\omega c} \\sin (\\omega t)$", "image": null, "isCorrect": false}, {"id": "gWh4x", "text": "$I=\\frac{E_0}{\\omega c} \\sin \\left(\\omega t+\\frac{\\pi}{2}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The instantaneous voltage across the capacitor is given by $E = E_0 \\sin \\omega t$.<br><br>The charge on the capacitor at any instant is $q = CE = CE_0 \\sin \\omega t$.<br><br>The instantaneous current $I$ is the rate of flow of charge, given by $I = \\dfrac{dq}{dt}$.<br><br>Substituting the value of $q$, we get:<br><br>$I = \\dfrac{d}{dt} (CE_0 \\sin \\omega t)$<br><br>$I = CE_0 \\omega \\cos \\omega t$<br><br>Using the trigonometric identity $\\cos \\theta = \\sin\\left(\\theta + \\dfrac{\\pi}{2}\\right)$, the equation becomes:<br><br>$I = E_0 \\omega C \\sin\\left(\\omega t + \\dfrac{\\pi}{2}\\right)$<br><br>Answer: $I=E_0 \\omega c \\sin \\left(\\omega t+\\frac{\\pi}{2}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b78bf9280d7f9932988", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "When a capacitor is connected in series with an LR circuit, the alternating current flowing in the circuit", "image": null}, "options": [{"id": "wwyfr", "text": "remains constant", "image": null, "isCorrect": false}, {"id": "BNocx", "text": "may increase or decrease", "image": null, "isCorrect": true}, {"id": "1WttX", "text": "decreases", "image": null, "isCorrect": false}, {"id": "fCWnZ", "text": "is zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The initial impedance of the LR circuit is given by $Z_1 = \\sqrt{R^2 + X_L^2}$.<br><br>When a capacitor is connected in series, the circuit becomes an LCR series circuit. The new impedance is given by $Z_2 = \\sqrt{R^2 + (X_L - X_C)^2}$.<br><br>The alternating current in the circuit is $I = \\dfrac{V}{Z}$.<br><br>If $X_C < 2X_L$, then $(X_L - X_C)^2 < X_L^2$. This implies $Z_2 < Z_1$, so the current increases.<br><br>If $X_C > 2X_L$, then $(X_L - X_C)^2 > X_L^2$. This implies $Z_2 > Z_1$, so the current decreases.<br><br>Therefore, depending on the value of the capacitive reactance $X_C$, the current may increase or decrease.<br><br>Answer: may increase or decrease", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b68bf9280d7f99328e9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "An a.c. e.m.f. of peak value 230 V and frequency 50 Hz is connected to a circuit with $\\mathrm{R}=11.5 \\Omega, \\mathrm{~L}=2.5 \\mathrm{H}$ and a capacitor all in series. The value of capacitance is ' $C$ ' for the current in the circuit to be maximum. The value of ' $C$ ' and maximum current are respectively ( $\\pi^2=10$ )", "image": null}, "options": [{"id": "4A7PU", "text": "$4 \\mu \\mathrm{~F}, \\quad 20 \\mathrm{~A}$", "image": null, "isCorrect": true}, {"id": "v2bia", "text": "$5 \\mu \\mathrm{~F}, \\quad 10 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "98olZ", "text": "$2 \\mu \\mathrm{~F}, \\quad 20 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "Xto4x", "text": "$8 \\mu \\mathrm{~F}, 12 \\mathrm{~A}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the current in an LCR series circuit to be maximum, the circuit must be in resonance.<br><br>At resonance, the inductive reactance equals the capacitive reactance:<br><br>$X_L = X_C$<br><br>$\\omega L = \\dfrac{1}{\\omega C}$<br><br>$C = \\dfrac{1}{\\omega^2 L} = \\dfrac{1}{4 \\pi^2 f^2 L}$<br><br>Substituting the given values ($f = 50$ Hz, $\\pi^2 = 10$, $L = 2.5$ H):<br><br>$C = \\dfrac{1}{4 \\times 10 \\times (50)^2 \\times 2.5}$<br><br>$C = \\dfrac{1}{40 \\times 2500 \\times 2.5} = \\dfrac{1}{250000}$<br><br>$C = 4 \\times 10^{-6} \\text{ F} = 4 \\mu\\text{F}$<br><br>At resonance, the impedance of the circuit is minimum and equal to the resistance ($Z = R$).<br><br>The maximum current (peak current) is given by:<br><br>$I_0 = \\dfrac{V_0}{R}$<br><br>$I_0 = \\dfrac{230}{11.5} = 20 \\text{ A}$<br><br>Answer: $4 \\mu \\mathrm{~F}, \\quad 20 \\mathrm{~A}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b54bf9280d7f9932841", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "An alternating e.m.f. having voltage $V=V_0 \\sin \\omega t$ is applied to a series L-C-R circuit. Given : $\\left|X_L-X_C\\right|=R$. The r.m.s. value of potential difference across capacitor will be", "image": null}, "options": [{"id": "fs2Jn", "text": "$V_0 R \\omega C$", "image": null, "isCorrect": false}, {"id": "dfv3s", "text": "$\\frac{V_0}{R \\omega C}$", "image": null, "isCorrect": false}, {"id": "RcRhM", "text": "$\\frac{V_0}{2 R \\omega C}$", "image": null, "isCorrect": true}, {"id": "lMryo", "text": "$\\frac{V_0}{\\sqrt{2} R \\omega C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The impedance of the series L-C-R circuit is given by $Z = \\sqrt{R^2 + (X_L - X_C)^2}$.<br><br>Given $|X_L - X_C| = R$, we get $Z = \\sqrt{R^2 + R^2} = \\sqrt{2}R$.<br><br>The r.m.s. value of the applied voltage is $V_{rms} = \\dfrac{V_0}{\\sqrt{2}}$.<br><br>The r.m.s. current in the circuit is $I_{rms} = \\dfrac{V_{rms}}{Z} = \\dfrac{V_0 / \\sqrt{2}}{\\sqrt{2}R} = \\dfrac{V_0}{2R}$.<br><br>The r.m.s. potential difference across the capacitor is $V_{C(rms)} = I_{rms} X_C$.<br><br>Since $X_C = \\dfrac{1}{\\omega C}$, we have $V_{C(rms)} = \\dfrac{V_0}{2R} \\times \\dfrac{1}{\\omega C} = \\dfrac{V_0}{2R\\omega C}$.<br><br>Answer: $\\frac{V_0}{2 R \\omega C}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b44bf9280d7f99327a9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If maximum energy is stored in a capacitor at $\\mathrm{t}=0$ then the time after which, current in the circuit will be maximum is\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/IbxhEzbLUBiCrkoGjjx_AAiMREuZpBVENgFmnC8lp5c.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "bq8OZ", "text": "$\\pi \\times 10^{-3} \\mathrm{~s}$", "image": null, "isCorrect": false}, {"id": "uLtcF", "text": "$2 \\pi \\times 10^{-3} \\mathrm{~s}$", "image": null, "isCorrect": false}, {"id": "ac0zd", "text": "$2 \\pi \\times 10^{-4} s$", "image": null, "isCorrect": true}, {"id": "KNCwO", "text": "$\\pi \\times 10^{-4} \\mathrm{~s}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The time period of oscillation in an LC circuit is $T = 2\\pi\\sqrt{LC}$.<br><br>At $t = 0$, the energy in the capacitor is maximum, so the current is zero. The current becomes maximum when the energy is completely transferred to the inductor, which happens at one-fourth of the time period, i.e., $t = \\dfrac{T}{4}$.<br><br>Given:<br>$L = 16 \\text{ mH} = 16 \\times 10^{-3} \\text{ H}$<br>$C = 10 \\mu\\text{F} = 10 \\times 10^{-6} \\text{ F}$<br><br>Substituting the values to find $T$:<br>$T = 2\\pi\\sqrt{16 \\times 10^{-3} \\times 10 \\times 10^{-6}}$<br>$T = 2\\pi\\sqrt{16 \\times 10^{-8}}$<br>$T = 2\\pi \\times 4 \\times 10^{-4} = 8\\pi \\times 10^{-4} \\text{ s}$<br><br>The required time is:<br>$t = \\dfrac{T}{4} = \\dfrac{8\\pi \\times 10^{-4}}{4} = 2\\pi \\times 10^{-4} \\text{ s}$<br><br>Answer: $2 \\pi \\times 10^{-4} s$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b42bf9280d7f993279b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "In series LCR resonant circuit, $R=800 \\Omega, C=2 \\mu F$ and voltage across resistance is 200 V . The angular frequency is $250 \\mathrm{rad} / \\mathrm{s}$. At resonance, the voltage across the inductance is", "image": null}, "options": [{"id": "1ikbE", "text": "400 V", "image": null, "isCorrect": false}, {"id": "OYi7T", "text": "250 V", "image": null, "isCorrect": false}, {"id": "QqkB5", "text": "1000 V", "image": null, "isCorrect": false}, {"id": "jsDss", "text": "500 V", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In a series LCR circuit, the current $I$ is given by the voltage across the resistor divided by its resistance:<br><br>$I = \\dfrac{V_R}{R} = \\dfrac{200}{800} = 0.25 \\text{ A}$<br><br>At resonance, the inductive reactance equals the capacitive reactance ($X_L = X_C$), which means the voltage across the inductance equals the voltage across the capacitance ($V_L = V_C$).<br><br>The capacitive reactance is:<br><br>$X_C = \\dfrac{1}{\\omega C} = \\dfrac{1}{250 \\times 2 \\times 10^{-6}} = \\dfrac{10^6}{500} = 2000 \\, \\Omega$<br><br>The voltage across the inductance is:<br><br>$V_L = V_C = I X_C = 0.25 \\times 2000 = 500 \\text{ V}$<br><br>Answer: 500 V", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b33bf9280d7f993270e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "An a.c. e.m.f. of peak value $=230 \\mathrm{~V}$ and frequency 50 Hz is connected to a circuit with $\\mathrm{R}=11.5 \\Omega, \\mathrm{~L}=2.5 \\mathrm{H}$ and a capacitor all in series. The value of capacitance is ' C ' for the current in the circuit to be maximum. The value of C and maximum current are respectively ( $\\pi^2=10$ )", "image": null}, "options": [{"id": "WC1dI", "text": "$2 \\mu \\mathrm{F}, 10 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "tHJmY", "text": "$4 \\mu \\mathrm{F}, 20 \\mathrm{~A}$", "image": null, "isCorrect": true}, {"id": "v6EBz", "text": "$6 \\mu \\mathrm{F}, 10 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "1rjEr", "text": "$8 \\mu \\mathrm{F}, 20 \\mathrm{~A}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the current in an LCR series circuit to be maximum, the circuit must be in resonance.<br><br>At resonance, the inductive reactance equals the capacitive reactance:<br><br>$X_L = X_C$<br><br>$\\omega L = \\dfrac{1}{\\omega C}$<br><br>$C = \\dfrac{1}{\\omega^2 L} = \\dfrac{1}{4 \\pi^2 f^2 L}$<br><br>Substituting the given values ($f = 50 \\text{ Hz}$, $L = 2.5 \\text{ H}$, $\\pi^2 = 10$):<br><br>$C = \\dfrac{1}{4 \\times 10 \\times (50)^2 \\times 2.5}$<br><br>$C = \\dfrac{1}{40 \\times 2500 \\times 2.5} = \\dfrac{1}{250000} = 4 \\times 10^{-6} \\text{ F} = 4 \\mu\\text{F}$<br><br>At resonance, the impedance of the circuit is minimum and equal to the resistance $R$.<br><br>The maximum current (peak current) is given by:<br><br>$I_0 = \\dfrac{V_0}{R}$<br><br>$I_0 = \\dfrac{230}{11.5} = 20 \\text{ A}$<br><br>Answer: $4 \\mu \\mathrm{F}, 20 \\mathrm{~A}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b31bf9280d7f9932701", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The reading of the ammeter in the following circuit is\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/iV1xuSZ-2jSUMrELk6D47UfKtCaJnkGOY-0TgSCKAAQ.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "1QPKr", "text": "3 A", "image": null, "isCorrect": false}, {"id": "QZQ7v", "text": "6 A", "image": null, "isCorrect": true}, {"id": "XEQKB", "text": "12 A", "image": null, "isCorrect": false}, {"id": "v1QUy", "text": "9 A", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In the given series LCR circuit, the total voltage $V$ is related to the voltages across the individual components by the equation:<br><br>$V = \\sqrt{V_R^2 + (V_L - V_C)^2}$<br><br>From the circuit diagram, we are given:<br>Voltage across the inductor, $V_L = 100 \\text{ V}$<br>Voltage across the capacitor, $V_C = 100 \\text{ V}$<br>Source voltage, $V = 300 \\text{ V}$<br>Resistance, $R = 50 \\ \\Omega$<br><br>Since $V_L = V_C = 100 \\text{ V}$, the circuit is in a state of resonance. Substituting these values into the voltage equation:<br><br>$300 = \\sqrt{V_R^2 + (100 - 100)^2}$<br><br>$300 = \\sqrt{V_R^2 + 0}$<br><br>$V_R = 300 \\text{ V}$<br><br>The current in the circuit (which is the reading of the ammeter) is given by Ohm's law for the resistor:<br><br>$I = \\dfrac{V_R}{R}$<br><br>$I = \\dfrac{300}{50} = 6 \\text{ A}$<br><br>Answer: 6 A", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b21bf9280d7f993267f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A $20 \\Omega$ resistance, 10 mH inductance coil and $15 \\mu \\mathrm{~F}$ capacitor are joined in series. When a suitable frequency alternating current source is joined to this combination, the circuit resonates. If the resistance is made $\\frac{1}{3} \\mathrm{rd}$, the resonant frequency", "image": null}, "options": [{"id": "94EXV", "text": "remains unchanged.", "image": null, "isCorrect": true}, {"id": "5xXOF", "text": "is doubled.", "image": null, "isCorrect": false}, {"id": "gqrjD", "text": "is quadrupled.", "image": null, "isCorrect": false}, {"id": "sVmqr", "text": "is halved.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The resonant frequency of a series LCR circuit is given by $f = \\dfrac{1}{2\\pi\\sqrt{LC}}$.<br><br>The formula shows that the resonant frequency depends only on the inductance $L$ and the capacitance $C$, and is independent of the resistance $R$ of the circuit.<br><br>Therefore, if the resistance is made $\\dfrac{1}{3}$rd of its original value, the resonant frequency remains unchanged.<br><br>Answer: remains unchanged.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214420aee93fa0796df39", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "A light bulb connected in series with a capacitor and an a.c. source is glowing with a certain brightness. On reducing the capacity of capacitance and frequency of source, the brightness of the lamp (respectively)", "image": null}, "options": [{"id": "JOpZl", "text": "is reduced, is increased", "image": null, "isCorrect": false}, {"id": "X1gZp", "text": "is reduced, is reduced", "image": null, "isCorrect": true}, {"id": "m9lTx", "text": "is increased, is reduced", "image": null, "isCorrect": false}, {"id": "HJjYU", "text": "is increased, is increased", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The brightness of the bulb depends on the current $I$ flowing through it.<br><br>The current in the series RC circuit is given by $I = \\dfrac{V}{Z}$, where the impedance is $Z = \\sqrt{R^2 + X_C^2}$ and the capacitive reactance is $X_C = \\dfrac{1}{2\\pi f C}$.<br><br>When the capacitance $C$ is reduced, the capacitive reactance $X_C$ increases. This increases the impedance $Z$, which in turn decreases the current $I$. Hence, the brightness of the bulb is reduced.<br><br>Similarly, when the frequency $f$ of the AC source is reduced, the capacitive reactance $X_C$ increases. This again increases the impedance $Z$ and decreases the current $I$. Hence, the brightness of the bulb is reduced.<br><br>Therefore, in both cases, the brightness of the lamp is reduced.<br><br>Answer: is reduced, is reduced", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214400aee93fa0796df2a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "In a series LCR circuit, if ' $V$ ' is the effective value of the applied voltage, $V_R$ is the voltage across ' $R$ ', ' $\\mathrm{V}_{\\mathrm{L}}$ ' and ' $\\mathrm{V}_{\\mathrm{C}}$ ' are the effective voltages across ' L ' and ' C ' respectively then", "image": null}, "options": [{"id": "leJEV", "text": "$\\mathrm{V}=\\mathrm{V}_{\\mathrm{R}}+\\mathrm{V}_{\\mathrm{L}}+\\mathrm{V}_{\\mathrm{C}}$", "image": null, "isCorrect": false}, {"id": "PN2UN", "text": "$\\mathrm{V}^2=\\mathrm{V}_{\\mathrm{R}}^2+\\mathrm{V}_{\\mathrm{L}}^2+\\mathrm{V}_{\\mathrm{C}}^2$", "image": null, "isCorrect": false}, {"id": "6G44j", "text": "$\\mathrm{V}^2=\\mathrm{V}_{\\mathrm{R}}^2+\\left(\\mathrm{V}_{\\mathrm{L}}-\\mathrm{V}_{\\mathrm{C}}\\right)^2$", "image": null, "isCorrect": true}, {"id": "T1pLy", "text": "$\\mathrm{V}^2=\\mathrm{V}_{\\mathrm{L}}^2+\\left(\\mathrm{V}_{\\mathrm{R}}-\\mathrm{V}_{\\mathrm{C}}\\right)^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In a series LCR circuit, the current $I$ is the same through all components.<br><br>The voltage across the resistor $V_R$ is in phase with the current.<br><br>The voltage across the inductor $V_L$ leads the current by $90^\\circ$.<br><br>The voltage across the capacitor $V_C$ lags the current by $90^\\circ$.<br><br>Thus, $V_L$ and $V_C$ are $180^\\circ$ out of phase, and their resultant is $(V_L - V_C)$.<br><br>Since $V_R$ and $(V_L - V_C)$ are perpendicular to each other, the effective applied voltage $V$ is given by the phasor sum:<br><br>$V = \\sqrt{V_R^2 + (V_L - V_C)^2}$<br><br>Squaring both sides, we get:<br><br>$V^2 = V_R^2 + (V_L - V_C)^2$<br><br>Answer: $\\mathrm{V}^2=\\mathrm{V}_{\\mathrm{R}}^2+\\left(\\mathrm{V}_{\\mathrm{L}}-\\mathrm{V}_{\\mathrm{C}}\\right)^2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792143f0aee93fa0796df25", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "An inductance of 2 mH , a condenser of $20 \\mu \\mathrm{~F}$ and a resistance of $50 \\Omega$ are connected in series to an a.c. source. The reactance of inductor and condenser are same. The reactance of either of them will be", "image": null}, "options": [{"id": "vdX6Q", "text": "$100 \\Omega$", "image": null, "isCorrect": false}, {"id": "z1heb", "text": "$50 \\Omega$", "image": null, "isCorrect": false}, {"id": "PYYde", "text": "$40 \\Omega$", "image": null, "isCorrect": false}, {"id": "jnMmK", "text": "$10 \\Omega$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given $L = 2 \\times 10^{-3} \\text{ H}$, $C = 20 \\times 10^{-6} \\text{ F}$, and $R = 50 \\Omega$.<br><br>Since the reactance of the inductor and condenser are the same, the circuit is in resonance.<br><br>$X_L = X_C$<br><br>$\\omega L = \\dfrac{1}{\\omega C}$<br><br>$\\omega = \\dfrac{1}{\\sqrt{LC}}$<br><br>Substituting the given values:<br><br>$\\omega = \\dfrac{1}{\\sqrt{2 \\times 10^{-3} \\times 20 \\times 10^{-6}}} = \\dfrac{1}{\\sqrt{4 \\times 10^{-8}}} = \\dfrac{1}{2 \\times 10^{-4}} = 5000 \\text{ rad/s}$<br><br>The reactance of the inductor is:<br><br>$X_L = \\omega L = 5000 \\times 2 \\times 10^{-3} = 10 \\Omega$<br><br>Similarly, the reactance of the condenser is $X_C = 10 \\Omega$.<br><br>Answer: $10 \\Omega$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792141c0aee93fa0796de0e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "Which one of the following graph represent correctly the variation of impedance (Z) of a series LCR circuit with the frequency ( $v$ ) of applied a.c.?\r\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/DsIKqwikRxohrUnQuQdfZq5TIxwxDH_-K0hRHYkMpUI.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "TV0bT", "text": "A", "image": null, "isCorrect": false}, {"id": "tS5Xu", "text": "B", "image": null, "isCorrect": true}, {"id": "MIo9P", "text": "C", "image": null, "isCorrect": false}, {"id": "ovtec", "text": "D", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The impedance $Z$ of a series LCR circuit is given by:<br><br>$Z = \\sqrt{R^2 + (X_L - X_C)^2}$<br><br>Substituting $X_L = 2\\pi\\nu L$ and $X_C = \\dfrac{1}{2\\pi\\nu C}$, we get:<br><br>$Z = \\sqrt{R^2 + \\left(2\\pi\\nu L - \\dfrac{1}{2\\pi\\nu C}\\right)^2}$<br><br>From this expression, we can observe the following:<br>1. At very low frequencies ($\\nu \\rightarrow 0$), the capacitive reactance $X_C \\rightarrow \\infty$, which makes $Z \\rightarrow \\infty$.<br>2. At very high frequencies ($\\nu \\rightarrow \\infty$), the inductive reactance $X_L \\rightarrow \\infty$, which makes $Z \\rightarrow \\infty$.<br>3. At the resonant frequency $\\nu_r = \\dfrac{1}{2\\pi\\sqrt{LC}}$, $X_L = X_C$, so the impedance is minimum and equal to the resistance ($Z = R$).<br><br>Therefore, the graph of $Z$ versus $\\nu$ starts from a high value, decreases smoothly to a minimum value $R$ at resonance, and then increases again. Graph (B) correctly represents this variation.<br><br>Answer: B", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792140a0aee93fa0796dd7e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "A series $L-C-R$ circuit containing a resistance ' $R$ ' has angular frequency ' $\\omega$ '. At resonance the voltage across resistance and inductor are ' $\\mathrm{V}_{\\mathrm{R}}$ ' and ' $\\mathrm{V}_{\\mathrm{L}}$ ' respectively, then value of capacitance will be", "image": null}, "options": [{"id": "Bimyy", "text": "$\\frac{V_R}{V_L \\omega R}$", "image": null, "isCorrect": true}, {"id": "vRnz6", "text": "$\\frac{V_L}{V_R R \\omega^2}$", "image": null, "isCorrect": false}, {"id": "gtkvc", "text": "$\\frac{V_R}{V_L R \\omega^2}$", "image": null, "isCorrect": false}, {"id": "7WqJZ", "text": "$\\frac{V_L R}{V_R \\omega}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "At resonance, the voltage across the inductor is equal to the voltage across the capacitor.<br><br>$V_L = V_C$<br><br>The voltage across the capacitor is given by $V_C = I X_C = \\dfrac{I}{\\omega C}$.<br><br>The voltage across the resistor is $V_R = I R$, which gives $I = \\dfrac{V_R}{R}$.<br><br>Substituting the value of $I$ into the equation for $V_L$, we get:<br><br>$V_L = \\dfrac{V_R}{R \\omega C}$<br><br>Rearranging the equation to solve for $C$, we obtain:<br><br>$C = \\dfrac{V_R}{V_L \\omega R}$<br><br>Answer: $\\frac{V_R}{V_L \\omega R}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214060aee93fa0796dd60", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "When a coil is connected to a d.c. source of e.m.f. 12 volt, then the current of 4 A flows in it. If the same coil is connected to a 12 volt, 50 Hz a.c. source, then the current flowing in it is 2.4 A . Then self-inductance of the coil will be", "image": null}, "options": [{"id": "eO2qS", "text": "48 H", "image": null, "isCorrect": false}, {"id": "KWl1T", "text": "12 H", "image": null, "isCorrect": false}, {"id": "7kkcZ", "text": "$\\frac{4}{\\pi} \\times 10^{-2} \\mathrm{H}$", "image": null, "isCorrect": true}, {"id": "KTBGm", "text": "$\\frac{8}{\\pi} \\times 10^{-2} \\mathrm{H}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a d.c. source, the coil acts as a pure resistor.<br><br>$R = \\dfrac{V_{dc}}{I_{dc}} = \\dfrac{12}{4} = 3 \\, \\Omega$<br><br>For an a.c. source, the coil acts as an LR circuit with impedance $Z$.<br><br>$Z = \\dfrac{V_{ac}}{I_{ac}} = \\dfrac{12}{2.4} = 5 \\, \\Omega$<br><br>The impedance is given by $Z = \\sqrt{R^2 + X_L^2}$<br><br>$5 = \\sqrt{3^2 + X_L^2}$<br><br>$X_L = \\sqrt{5^2 - 3^2} = 4 \\, \\Omega$<br><br>The inductive reactance is $X_L = 2\\pi f L$<br><br>$4 = 2\\pi \\times 50 \\times L$<br><br>$L = \\dfrac{4}{100\\pi} = \\dfrac{4}{\\pi} \\times 10^{-2} \\, \\text{H}$<br><br>Answer: $\\frac{4}{\\pi} \\times 10^{-2} \\mathrm{H}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213f20aee93fa0796dcc9", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "When 100 V d.c. is applied across a solenoid, a current of 1 A flows in it. When 100 a.c. is applied across it, the current drops to 0.5 A . If the frequency is 50 Hz , the impedance and inductance is", "image": null}, "options": [{"id": "KQyTT", "text": "$200 \\Omega, \\sqrt{3} / \\pi \\mathrm{H}$", "image": null, "isCorrect": true}, {"id": "hE4U6", "text": "$100 \\Omega, \\sqrt{3} \\mathrm{H}$", "image": null, "isCorrect": false}, {"id": "BRVIm", "text": "$200 \\Omega, 1 \\mathrm{H}$", "image": null, "isCorrect": false}, {"id": "B2sg0", "text": "$100 \\Omega, 1 \\mathrm{H}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For d.c. circuit, the resistance of the solenoid is given by:<br><br>$R = \\dfrac{V_{dc}}{I_{dc}} = \\dfrac{100}{1} = 100 \\, \\Omega$<br><br>For a.c. circuit, the impedance of the solenoid is given by:<br><br>$Z = \\dfrac{V_{ac}}{I_{ac}} = \\dfrac{100}{0.5} = 200 \\, \\Omega$<br><br>The impedance is related to resistance and inductive reactance by:<br><br>$Z = \\sqrt{R^2 + X_L^2}$<br><br>$200 = \\sqrt{100^2 + X_L^2}$<br><br>$X_L^2 = 200^2 - 100^2 = 30000$<br><br>$X_L = 100\\sqrt{3} \\, \\Omega$<br><br>The inductive reactance is $X_L = 2\\pi f L$.<br><br>$100\\sqrt{3} = 2\\pi \\times 50 \\times L$<br><br>$100\\sqrt{3} = 100\\pi L$<br><br>$L = \\dfrac{\\sqrt{3}}{\\pi} \\, \\text{H}$<br><br>Answer: $200 \\Omega, \\sqrt{3} / \\pi \\mathrm{H}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e30aee93fa0796dc4e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "With gradual increase in frequency of an a.c. supply, the impedance of an LCR series circuit", "image": null}, "options": [{"id": "ts0jn", "text": "increases.", "image": null, "isCorrect": false}, {"id": "zOQi9", "text": "decreases.", "image": null, "isCorrect": false}, {"id": "1hmeL", "text": "remains constant", "image": null, "isCorrect": false}, {"id": "Yl7Od", "text": "first decreases, becomes minimum and then increases.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The impedance of an LCR series circuit is given by $Z = \\sqrt{R^2 + (X_L - X_C)^2}$, where $X_L = 2\\pi f L$ and $X_C = \\dfrac{1}{2\\pi f C}$.<br><br>At low frequencies, $X_C$ is very large and $X_L$ is very small, making the impedance $Z$ large.<br><br>As the frequency $f$ increases, $X_L$ increases and $X_C$ decreases. The term $(X_L - X_C)^2$ decreases, causing the impedance $Z$ to decrease.<br><br>At the resonant frequency $f_r = \\dfrac{1}{2\\pi\\sqrt{LC}}$, $X_L = X_C$, and the impedance becomes minimum, $Z = R$.<br><br>As the frequency increases beyond the resonant frequency, $X_L$ becomes greater than $X_C$, and the term $(X_L - X_C)^2$ increases, causing the impedance $Z$ to increase.<br><br>Thus, with a gradual increase in frequency, the impedance first decreases, becomes minimum, and then increases.<br><br>Answer: first decreases, becomes minimum and then increases.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e10aee93fa0796dc42", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "With an alternating voltage source frequency ' f ', inductor ' $L$ ', capacitor ' $C$ ' and resistance ' $R$ ' are connected in series. The voltage leads the current by $45^{\\circ}$. The value of ' $L$ ' is $\\left(\\tan 45^{\\circ}=1\\right)$", "image": null}, "options": [{"id": "ptyMU", "text": "$\\left(\\frac{1+2 \\pi \\mathrm{fCR}}{4 \\pi^2 \\mathrm{f}^2 \\mathrm{C}}\\right)$", "image": null, "isCorrect": true}, {"id": "tTSnj", "text": "$\\left(\\frac{1-2 \\pi \\mathrm{fCR}}{4 \\pi^2 \\mathrm{f}^2 \\mathrm{C}}\\right)$", "image": null, "isCorrect": false}, {"id": "AyqSp", "text": "$\\left(\\frac{4 \\pi^2 \\mathrm{f}^2 \\mathrm{C}}{1+2 \\pi \\mathrm{fCR}}\\right)$", "image": null, "isCorrect": false}, {"id": "KkZrp", "text": "$\\left(\\frac{4 \\pi^2 \\mathrm{f}^2 \\mathrm{C}}{1-2 \\pi \\mathrm{fCR}}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In a series LCR circuit, the phase angle $\\phi$ by which the voltage leads the current is given by:<br><br>$\\tan \\phi = \\dfrac{X_L - X_C}{R}$<br><br>Given that the voltage leads the current by $45^{\\circ}$, we have $\\phi = 45^{\\circ}$.<br><br>$\\tan 45^{\\circ} = \\dfrac{X_L - X_C}{R}$<br><br>Since $\\tan 45^{\\circ} = 1$, we get:<br><br>$1 = \\dfrac{X_L - X_C}{R}$<br><br>$X_L - X_C = R$<br><br>Substituting $X_L = 2\\pi f L$ and $X_C = \\dfrac{1}{2\\pi f C}$:<br><br>$2\\pi f L - \\dfrac{1}{2\\pi f C} = R$<br><br>$2\\pi f L = R + \\dfrac{1}{2\\pi f C}$<br><br>$2\\pi f L = \\dfrac{2\\pi f C R + 1}{2\\pi f C}$<br><br>$L = \\dfrac{1 + 2\\pi f C R}{4\\pi^2 f^2 C}$<br><br>Answer: $\\left(\\frac{1+2 \\pi \\mathrm{fCR}}{4 \\pi^2 \\mathrm{f}^2 \\mathrm{C}}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213df0aee93fa0796dc33", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "An inductance of $\\frac{300}{\\pi} \\mathrm{mH}$, a capacitance of $\\frac{1}{\\pi} \\mathrm{mF}$ and a resistance of $20 \\Omega$ are connected in series with an a.c. source of $240 \\mathrm{~V}, 50 \\mathrm{~Hz}$. The phase angle of the circuit is", "image": null}, "options": [{"id": "Zh9xt", "text": "$\\tan ^{-1}(0)$", "image": null, "isCorrect": false}, {"id": "6okNy", "text": "$\\tan ^{-1}\\left(\\frac{1}{\\sqrt{3}}\\right)$", "image": null, "isCorrect": false}, {"id": "t3oGi", "text": "$\\tan ^{-1}(1)$", "image": null, "isCorrect": true}, {"id": "hhkqx", "text": "$\\tan ^{-1}(\\sqrt{3})$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given:<br>$L = \\dfrac{300}{\\pi} \\text{ mH} = \\dfrac{0.3}{\\pi} \\text{ H}$<br>$C = \\dfrac{1}{\\pi} \\text{ mF} = \\dfrac{10^{-3}}{\\pi} \\text{ F}$<br>$R = 20 \\Omega$<br>$f = 50 \\text{ Hz}$<br><br>Inductive reactance $X_L$ is given by:<br>$X_L = 2\\pi f L = 2\\pi \\times 50 \\times \\dfrac{0.3}{\\pi} = 30 \\Omega$<br><br>Capacitive reactance $X_C$ is given by:<br>$X_C = \\dfrac{1}{2\\pi f C} = \\dfrac{1}{2\\pi \\times 50 \\times \\dfrac{10^{-3}}{\\pi}} = \\dfrac{1}{0.1} = 10 \\Omega$<br><br>The phase angle $\\phi$ of the circuit is given by:<br>$\\tan \\phi = \\dfrac{X_L - X_C}{R}$<br><br>Substituting the values:<br>$\\tan \\phi = \\dfrac{30 - 10}{20} = \\dfrac{20}{20} = 1$<br><br>$\\phi = \\tan^{-1}(1)$<br><br>Answer: $\\tan ^{-1}(1)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d10aee93fa0796dbc2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "For the series LCR circuit, $R=\\dfrac{X_L}{2}=2 X_c$. The impedance of the circuit and the phase difference between V and I will be", "image": null}, "options": [{"id": "PZ8GL", "text": "$\\dfrac{\\sqrt{5}}{2} \\mathrm{R}, \\tan ^{-1}\\left(\\dfrac{1}{2}\\right)$", "image": null, "isCorrect": false}, {"id": "x7hRj", "text": "$\\dfrac{\\sqrt{13}}{2} R, \\tan ^{-1}\\left(\\dfrac{3}{2}\\right)$", "image": null, "isCorrect": true}, {"id": "YlofP", "text": "$\\sqrt{5} R, \\tan ^{-1}(1)$", "image": null, "isCorrect": false}, {"id": "y7Bzl", "text": "$\\sqrt{13} \\mathrm{R}, \\tan ^{-1}(2)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $R = \\dfrac{X_L}{2} = 2 X_C$<br><br>$X_L = 2R$<br><br>$X_C = \\dfrac{R}{2}$<br><br>The impedance of the series LCR circuit is given by $Z = \\sqrt{R^2 + (X_L - X_C)^2}$<br><br>Substituting the values of $X_L$ and $X_C$:<br><br>$Z = \\sqrt{R^2 + \\left(2R - \\dfrac{R}{2}\\right)^2}$<br><br>$Z = \\sqrt{R^2 + \\left(\\dfrac{3R}{2}\\right)^2} = \\sqrt{R^2 + \\dfrac{9R^2}{4}} = \\dfrac{\\sqrt{13}}{2} R$<br><br>The phase difference $\\phi$ is given by $\\tan \\phi = \\dfrac{X_L - X_C}{R}$<br><br>$\\tan \\phi = \\dfrac{2R - \\dfrac{R}{2}}{R} = \\dfrac{3}{2}$<br><br>$\\phi = \\tan^{-1}\\left(\\dfrac{3}{2}\\right)$<br><br>Answer: $\\dfrac{\\sqrt{13}}{2} R, \\tan ^{-1}\\left(\\dfrac{3}{2}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213cf0aee93fa0796dbb0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "In series LCR circuit, 'R' represents resistance of electric bulb. If the frequency of a.c. supply is doubled, in order to keep the brightness of the bulb unchanged, the value of inductance ' L ' and capacitance ' C ' should be", "image": null}, "options": [{"id": "xPJxP", "text": "both doubled.", "image": null, "isCorrect": false}, {"id": "40JTq", "text": "made four times.", "image": null, "isCorrect": false}, {"id": "tR2S5", "text": "made eight times.", "image": null, "isCorrect": false}, {"id": "1aNV1", "text": "both halved simultaneously.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The brightness of the bulb depends on the power dissipated across its resistance $R$, which is given by $P = I^2 R$.<br><br>For the brightness to remain unchanged, the current $I$ in the circuit must remain constant.<br><br>The current in a series LCR circuit is given by:<br><br>$I = \\dfrac{V}{Z} = \\dfrac{V}{\\sqrt{R^2 + \\left(\\omega L - \\dfrac{1}{\\omega C}\\right)^2}}$<br><br>For $I$ to remain unchanged when the frequency $\\omega$ is doubled ($\\omega' = 2\\omega$), the inductive reactance $X_L$ and capacitive reactance $X_C$ must individually remain unchanged.<br><br>For inductive reactance:<br><br>$\\omega' L' = \\omega L$<br><br>$(2\\omega) L' = \\omega L \\Rightarrow L' = \\dfrac{L}{2}$<br><br>For capacitive reactance:<br><br>$\\dfrac{1}{\\omega' C'} = \\dfrac{1}{\\omega C}$<br><br>$\\dfrac{1}{(2\\omega) C'} = \\dfrac{1}{\\omega C} \\Rightarrow C' = \\dfrac{C}{2}$<br><br>Thus, both inductance $L$ and capacitance $C$ should be halved simultaneously.<br><br>Answer: both halved simultaneously.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213cc0aee93fa0796db99", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "An a.c. voltage source $\\mathrm{V}=\\mathrm{V}_0 \\sin \\omega \\mathrm{t}$. is connected across resistance ' R ' and capacitance ' $C$ ' in series. It is given that $R=\\dfrac{1}{\\omega \\mathrm{c}}$ and the peak current is $\\mathrm{I}_0$. If the angular frequency of the voltage source is changed to $\\left(\\dfrac{\\omega}{\\sqrt{3}}\\right)$, then the new peak current in the circuit is", "image": null}, "options": [{"id": "5nn8r", "text": "$\\dfrac{\\mathrm{I}_0}{2}$", "image": null, "isCorrect": false}, {"id": "sYjZY", "text": "$\\dfrac{\\mathrm{I}_0}{\\sqrt{2}}$", "image": null, "isCorrect": true}, {"id": "Ynb3D", "text": "$\\sqrt{2} \\mathrm{I}_0$", "image": null, "isCorrect": false}, {"id": "GaDFG", "text": "$\\sqrt{3} \\mathrm{I}_0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The initial impedance of the circuit is given by $Z_1 = \\sqrt{R^2 + X_C^2}$.<br><br>Given $X_C = \\dfrac{1}{\\omega C} = R$, we get $Z_1 = \\sqrt{R^2 + R^2} = \\sqrt{2}R$.<br><br>The initial peak current is $I_0 = \\dfrac{V_0}{Z_1} = \\dfrac{V_0}{\\sqrt{2}R}$.<br><br>When the angular frequency is changed to $\\omega' = \\dfrac{\\omega}{\\sqrt{3}}$, the new capacitive reactance becomes $X_C' = \\dfrac{1}{\\omega' C} = \\dfrac{\\sqrt{3}}{\\omega C} = \\sqrt{3}R$.<br><br>The new impedance of the circuit is $Z_2 = \\sqrt{R^2 + (X_C')^2} = \\sqrt{R^2 + (\\sqrt{3}R)^2} = \\sqrt{4R^2} = 2R$.<br><br>The new peak current is $I_0' = \\dfrac{V_0}{Z_2} = \\dfrac{V_0}{2R}$.<br><br>Substituting $V_0 = \\sqrt{2} R I_0$ from the initial case, we get:<br><br>$I_0' = \\dfrac{\\sqrt{2} R I_0}{2R} = \\dfrac{I_0}{\\sqrt{2}}$<br><br>Answer: $\\dfrac{\\mathrm{I}_0}{\\sqrt{2}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213bf0aee93fa0796db32", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "The current in LR circuit if reduced to half. What will be the energy stored in it?", "image": null}, "options": [{"id": "zNbB1", "text": "4 times", "image": null, "isCorrect": false}, {"id": "TZhGv", "text": "2 times", "image": null, "isCorrect": false}, {"id": "A1qK3", "text": "half times", "image": null, "isCorrect": false}, {"id": "p8syu", "text": "$\\left(\\dfrac{1}{4}\\right)^{\\text {th }}$ times", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The energy stored in an inductor in an LR circuit is given by $U = \\dfrac{1}{2} L I^2$.<br><br>When the current is reduced to half, the new current is $I' = \\dfrac{I}{2}$.<br><br>The new energy stored becomes:<br><br>$U' = \\dfrac{1}{2} L (I')^2$<br><br>$U' = \\dfrac{1}{2} L \\left(\\dfrac{I}{2}\\right)^2$<br><br>$U' = \\dfrac{1}{4} \\left(\\dfrac{1}{2} L I^2\\right)$<br><br>$U' = \\dfrac{1}{4} U$<br><br>Thus, the energy stored becomes $\\left(\\dfrac{1}{4}\\right)^{\\text{th}}$ times the original energy.<br><br>Answer: $\\left(\\dfrac{1}{4}\\right)^{\\text {th }}$ times", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213bf0aee93fa0796db2f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "The inductive reactance of a coil is ' R ' $\\Omega$. If inductance of a coil is tripled and frequency of a.c supply is also tripled, then new inductive reactance will be", "image": null}, "options": [{"id": "XvuP1", "text": "$\\dfrac{\\mathrm{R}}{9}$", "image": null, "isCorrect": false}, {"id": "cjXqi", "text": "$\\dfrac{\\mathrm{R}}{3}$", "image": null, "isCorrect": false}, {"id": "y8CB2", "text": "3 R", "image": null, "isCorrect": false}, {"id": "u0hSJ", "text": "9 R", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Inductive reactance is given by $X_L = \\omega L = 2 \\pi f L$<br><br>Initially, $X_L = R$<br><br>When inductance is tripled, $L' = 3L$<br><br>When frequency is tripled, $f' = 3f$<br><br>New inductive reactance $X_L' = 2 \\pi f' L' = 2 \\pi (3f) (3L) = 9 (2 \\pi f L)$<br><br>$X_L' = 9 X_L = 9R$<br><br>Answer: 9 R", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213bc0aee93fa0796db1b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "A series resonant circuit consists of inductor ' $L$ ' of negligible resistance and a capacitor ' C ' which produces resonant frequency ' f '. If L is changed to 3 L and ' C ' is changed to 6 C , the resonant frequency will become.", "image": null}, "options": [{"id": "jFYzr", "text": "$\\dfrac{\\mathrm{f}}{6}$", "image": null, "isCorrect": false}, {"id": "tULNL", "text": "$\\dfrac{\\mathrm{f}}{3}$", "image": null, "isCorrect": false}, {"id": "CUOIo", "text": "$\\dfrac{\\mathrm{f}}{2 \\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "PwJpU", "text": "$\\dfrac{\\mathrm{f}}{3 \\sqrt{2}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The resonant frequency of a series L-C circuit is given by:<br><br>$f = \\dfrac{1}{2\\pi\\sqrt{LC}}$<br><br>When the inductance is changed to $L' = 3L$ and capacitance is changed to $C' = 6C$, the new resonant frequency $f'$ becomes:<br><br>$f' = \\dfrac{1}{2\\pi\\sqrt{L'C'}}$<br><br>$f' = \\dfrac{1}{2\\pi\\sqrt{(3L)(6C)}}$<br><br>$f' = \\dfrac{1}{2\\pi\\sqrt{18LC}}$<br><br>$f' = \\dfrac{1}{3\\sqrt{2}} \\left( \\dfrac{1}{2\\pi\\sqrt{LC}} \\right)$<br><br>$f' = \\dfrac{f}{3\\sqrt{2}}$<br><br>Answer: $\\dfrac{\\mathrm{f}}{3 \\sqrt{2}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213aa0aee93fa0796da8f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "When a capacitor is connected in a series LR circuit to achieve resonance, the alternating current flowing in the circuit", "image": null}, "options": [{"id": "C5igN", "text": "is zero.", "image": null, "isCorrect": false}, {"id": "M9059", "text": "remains constant.", "image": null, "isCorrect": false}, {"id": "tu98c", "text": "increases.", "image": null, "isCorrect": true}, {"id": "Rytpr", "text": "decreases.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The initial impedance of the series LR circuit is given by $Z_1 = \\sqrt{R^2 + X_L^2}$.<br><br>When a capacitor is connected in series to achieve resonance, the capacitive reactance becomes equal to the inductive reactance, i.e., $X_C = X_L$.<br><br>The new impedance of the circuit is $Z_2 = \\sqrt{R^2 + (X_L - X_C)^2} = R$.<br><br>Since $R < \\sqrt{R^2 + X_L^2}$, the impedance of the circuit decreases ($Z_2 < Z_1$).<br><br>The alternating current in the circuit is given by $I = \\dfrac{V}{Z}$.<br><br>As the impedance decreases, the current flowing in the circuit increases.<br><br>Answer: increases.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213970aee93fa0796d9f8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "In the given circuit diagram, in the steady state the current through the battery and the charge on the capacitor respectively are\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/EsD73js-2RP2Y9k-Cylu_YQCGdxQhVlGdb713udjtOs.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "6DXlL", "text": "2 A and $3 \\mu \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "BzMl4", "text": "$\\dfrac{6}{11} \\mathrm{~A}$ and $\\dfrac{12}{7} \\mu \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "TFKvi", "text": "11 A and $3 \\mu \\mathrm{C}$", "image": null, "isCorrect": true}, {"id": "6D9ap", "text": "zero ampere and $3 \\mu \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In the steady state, the capacitor acts as an open circuit, so no current flows through the branch containing the capacitor and the $4\\ \\Omega$ resistor.<br><br>The current from the battery flows only through the $1\\ \\Omega$, $2\\ \\Omega$, and $3\\ \\Omega$ resistors. These three resistors are connected in parallel across the $6\\ \\mathrm{V}$ battery.<br><br>The equivalent resistance $R_{eq}$ of this parallel combination is given by:<br>$\\dfrac{1}{R_{eq}} = \\dfrac{1}{1} + \\dfrac{1}{2} + \\dfrac{1}{3} = \\dfrac{6 + 3 + 2}{6} = \\dfrac{11}{6}\\ \\Omega^{-1}$<br><br>Thus, $R_{eq} = \\dfrac{6}{11}\\ \\Omega$.<br><br>The steady state current $I$ through the battery is:<br>$I = \\dfrac{V}{R_{eq}} = \\dfrac{6}{6/11} = 11\\ \\mathrm{A}$<br><br>Since the capacitor branch is connected in parallel with the battery, the potential difference across this entire branch is $6\\ \\mathrm{V}$. As the steady state current through this branch is zero, the potential drop across the $4\\ \\Omega$ resistor is zero.<br><br>Therefore, the potential difference across the capacitor is equal to the battery voltage, which is $6\\ \\mathrm{V}$.<br><br>The charge $Q$ on the capacitor is:<br>$Q = C \\times V = 0.5\\ \\mu\\mathrm{F} \\times 6\\ \\mathrm{V} = 3\\ \\mu\\mathrm{C}$<br><br>Answer: 11 A and $3 \\mu \\mathrm{C}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213960aee93fa0796d9f1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "When a capacitor is connected in a series LR circuit such that the circuit resonates, the alternating current flowing in the circuit", "image": null}, "options": [{"id": "JoklW", "text": "is zero", "image": null, "isCorrect": false}, {"id": "zvdt4", "text": "increases", "image": null, "isCorrect": true}, {"id": "iGwtu", "text": "decreases", "image": null, "isCorrect": false}, {"id": "HxO23", "text": "remains constant", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Initially, for the series LR circuit, the impedance is given by $Z_1 = \\sqrt{R^2 + X_L^2}$.<br><br>The alternating current flowing in the circuit is $I_1 = \\dfrac{V}{Z_1} = \\dfrac{V}{\\sqrt{R^2 + X_L^2}}$.<br><br>When a capacitor is connected in series such that the circuit resonates, the inductive reactance equals the capacitive reactance ($X_L = X_C$).<br><br>The new impedance of the circuit becomes $Z_2 = \\sqrt{R^2 + (X_L - X_C)^2} = R$.<br><br>Since $Z_2 < Z_1$, the impedance of the circuit decreases.<br><br>Therefore, the new current $I_2 = \\dfrac{V}{R}$ is greater than $I_1$, meaning the alternating current flowing in the circuit increases.<br><br>Answer: increases", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213940aee93fa0796d9e0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "LC series resonant circuit produces resonant frequency ' f '. If. ' L ' is tripled and ' C ' is increased by 3C, the resonant frequency will be", "image": null}, "options": [{"id": "brOLe", "text": "$\\dfrac{\\mathrm{f}}{3}$", "image": null, "isCorrect": false}, {"id": "X3jCD", "text": "$\\dfrac{\\mathrm{f}}{2 \\sqrt{3}}$", "image": null, "isCorrect": true}, {"id": "j1TVd", "text": "6 f", "image": null, "isCorrect": false}, {"id": "Bk012", "text": "$\\dfrac{\\mathrm{f}}{2 \\sqrt{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The resonant frequency of an LC series circuit is given by:<br><br>$f = \\dfrac{1}{2\\pi\\sqrt{LC}}$<br><br>Given that the inductance is tripled, the new inductance is:<br><br>$L' = 3L$<br><br>The capacitance is increased by $3C$, so the new capacitance is:<br><br>$C' = C + 3C = 4C$<br><br>The new resonant frequency $f'$ is:<br><br>$f' = \\dfrac{1}{2\\pi\\sqrt{L'C'}}$<br><br>Substituting the values of $L'$ and $C'$:<br><br>$f' = \\dfrac{1}{2\\pi\\sqrt{(3L)(4C)}}$<br><br>$f' = \\dfrac{1}{2\\pi\\sqrt{12LC}}$<br><br>$f' = \\dfrac{1}{2\\sqrt{3}} \\left(\\dfrac{1}{2\\pi\\sqrt{LC}}\\right)$<br><br>$f' = \\dfrac{f}{2\\sqrt{3}}$<br><br>Answer: $\\dfrac{\\mathrm{f}}{2 \\sqrt{3}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213840aee93fa0796d965", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "In series LCR resonant circuit; the capacitance is changed from C to 3 C . To obtain the same resonant frequency, the inductance should be changed from $L$ to", "image": null}, "options": [{"id": "cumS8", "text": "$\\dfrac{\\mathrm{L}}{3}$", "image": null, "isCorrect": true}, {"id": "xlYTp", "text": "$\\dfrac{\\mathrm{L}}{2}$", "image": null, "isCorrect": false}, {"id": "JvM5Y", "text": "$\\dfrac{\\mathrm{L}}{\\sqrt{3}}$", "image": null, "isCorrect": false}, {"id": "xykXo", "text": "3 L", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The resonant frequency of a series LCR circuit is given by $f = \\dfrac{1}{2\\pi\\sqrt{LC}}$.<br><br>For the resonant frequency to remain the same, the product of inductance and capacitance must remain constant.<br><br>$L_1 C_1 = L_2 C_2$<br><br>Given $L_1 = L$, $C_1 = C$, and $C_2 = 3C$.<br><br>$L \\times C = L_2 \\times 3C$<br><br>$L_2 = \\dfrac{L}{3}$<br><br>Answer: $\\dfrac{\\mathrm{L}}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213700aee93fa0796d8c9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "An inductor of inductance $2 \\mu \\mathrm{H}$ is connected in series with a resistance, a variable capacitor and an a.c. source of frequency 5 kHz . The value of capacitance for which maximum current is drawn into the circuit is $\\dfrac{1}{\\mathrm{x}} \\mathrm{F}$, where the value of\r\n' $x$ ' is (Take $\\pi^2=10$ )", "image": null}, "options": [{"id": "c8lPV", "text": "500", "image": null, "isCorrect": false}, {"id": "SoUoC", "text": "1000", "image": null, "isCorrect": false}, {"id": "kFmpP", "text": "2000", "image": null, "isCorrect": true}, {"id": "X84sS", "text": "4000", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For maximum current in an LCR series circuit, the circuit must be in resonance.<br><br>At resonance, the inductive reactance equals the capacitive reactance:<br><br>$\\omega L = \\dfrac{1}{\\omega C}$<br><br>$C = \\dfrac{1}{\\omega^2 L} = \\dfrac{1}{(2\\pi f)^2 L}$<br><br>Given $f = 5 \\times 10^3 \\text{ Hz}$ and $L = 2 \\times 10^{-6} \\text{ H}$:<br><br>$C = \\dfrac{1}{(2\\pi \\times 5 \\times 10^3)^2 \\times 2 \\times 10^{-6}}$<br><br>$C = \\dfrac{1}{10^8 \\pi^2 \\times 2 \\times 10^{-6}}$<br><br>Using $\\pi^2 = 10$, we get:<br><br>$C = \\dfrac{1}{10^8 \\times 10 \\times 2 \\times 10^{-6}} = \\dfrac{1}{2 \\times 10^3} = \\dfrac{1}{2000} \\text{ F}$<br><br>Comparing with $C = \\dfrac{1}{x} \\text{ F}$, we get $x = 2000$.<br><br>Answer: 2000", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792136e0aee93fa0796d8bd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "In LCR series circuit if the frequency is increased, the impedance of the circuit", "image": null}, "options": [{"id": "AwgcD", "text": "increases", "image": null, "isCorrect": false}, {"id": "ePEck", "text": "decreases", "image": null, "isCorrect": false}, {"id": "VPKSt", "text": "either increases or decreases", "image": null, "isCorrect": false}, {"id": "kCI6L", "text": "first decreases then become minimum and then increases.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The impedance of an LCR series circuit is given by $Z = \\sqrt{R^2 + \\left(\\omega L - \\dfrac{1}{\\omeg
