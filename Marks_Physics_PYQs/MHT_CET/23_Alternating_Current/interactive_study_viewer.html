a C}\\right)^2}$, where $\\omega = 2\\pi f$.<br><br>At low frequencies, the capacitive reactance $X_C = \\dfrac{1}{\\omega C}$ is very large and the inductive reactance $X_L = \\omega L$ is very small. As the frequency $f$ increases, $X_C$ decreases and $X_L$ increases, which causes the net reactance $(X_L - X_C)$ to decrease in magnitude. Consequently, the impedance $Z$ decreases.<br><br>At the resonant frequency $f_r = \\dfrac{1}{2\\pi\\sqrt{LC}}$, $X_L = X_C$, making the net reactance zero. At this point, the impedance becomes minimum and is equal to the resistance $R$ ($Z = R$).<br><br>If the frequency is increased further beyond resonance, $X_L$ becomes greater than $X_C$. The net reactance $(X_L - X_C)$ increases in magnitude, which causes the impedance $Z$ to increase.<br><br>Therefore, as the frequency is increased, the impedance first decreases, becomes minimum, and then increases.<br><br>Answer: first decreases then become minimum and then increases.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792136c0aee93fa0796d8ae", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "For the given figure, choose the correct option.\r\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/oA94qwXSzYaggGHlPKY550jzIS218Y25MNk92L5mfT4.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "OWmkk", "text": "The r.m.s. current in circuit (B)\r\ncan never be greater than that in circuit (A)", "image": null, "isCorrect": true}, {"id": "BAS5U", "text": "The r.m.s. current in circuit (A)\r\nis always equal to that in circuit (B)", "image": null, "isCorrect": false}, {"id": "Ombk5", "text": "The r.m.s. current in circuit (B)\r\ncan be greater than in circuit (A)", "image": null, "isCorrect": false}, {"id": "NIqoT", "text": "At resonance, current in (B)\r\nis less than that in circuit (A)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For circuit (A), which is a purely resistive circuit, the impedance is:<br><br>$Z_A = R = 40\\ \\Omega$<br><br>The r.m.s. current in circuit (A) is:<br><br>$I_A = \\dfrac{V_{rms}}{Z_A} = \\dfrac{V_{rms}}{R}$<br><br>For circuit (B), which is a series LCR circuit, the impedance is given by:<br><br>$Z_B = \\sqrt{R^2 + (X_L - X_C)^2}$<br><br>The r.m.s. current in circuit (B) is:<br><br>$I_B = \\dfrac{V_{rms}}{Z_B} = \\dfrac{V_{rms}}{\\sqrt{R^2 + (X_L - X_C)^2}}$<br><br>Since the square of any real number is non-negative, $(X_L - X_C)^2 \\ge 0$. This implies that the impedance of circuit (B) is always greater than or equal to the resistance $R$:<br><br>$Z_B \\ge R$<br><br>Therefore, the current in circuit (B) will always be less than or equal to the current in circuit (A):<br><br>$I_B \\le I_A$<br><br>The equality holds only at resonance (when $X_L = X_C$). Thus, the r.m.s. current in circuit (B) can never be greater than that in circuit (A).<br><br>Answer: The r.m.s. current in circuit (B)\r\ncan never be greater than that in circuit (A)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792135b0aee93fa0796d828", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "A series LCR circuit containing a resistance 'R' has angular frequency ' $\\omega$ '. At resonance the voltage across resistance and inductor are ' $\\mathrm{V}_{\\mathrm{R}}$ ' and ' $\\mathrm{V}_{\\mathrm{L}}$ ' respectively, then value of inductance 'L' will be", "image": null}, "options": [{"id": "dmC8g", "text": "$\\dfrac{V_R R}{V_L \\omega}$", "image": null, "isCorrect": false}, {"id": "goyfr", "text": "$\\dfrac{V_L}{V_R R \\omega}$", "image": null, "isCorrect": false}, {"id": "wyUZ8", "text": "$\\dfrac{V_R \\omega}{V_L R}$", "image": null, "isCorrect": false}, {"id": "Rlrz4", "text": "$\\dfrac{\\mathrm{V}_{\\mathrm{L}} \\mathrm{R}}{\\mathrm{V}_{\\mathrm{R}}(\\omega)}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In a series LCR circuit, the same current $I$ flows through all the components.<br><br>The voltage across the resistance is given by $V_R = I R$, which gives $I = \\dfrac{V_R}{R}$.<br><br>The voltage across the inductor is given by $V_L = I X_L = I \\omega L$.<br><br>Substituting the value of $I$ in the expression for $V_L$, we get:<br><br>$V_L = \\left(\\dfrac{V_R}{R}\\right) \\omega L$<br><br>Rearranging the above equation to solve for $L$, we get:<br><br>$L = \\dfrac{V_L R}{V_R \\omega}$<br><br>Answer: $\\dfrac{\\mathrm{V}_{\\mathrm{L}} \\mathrm{R}}{\\mathrm{V}_{\\mathrm{R}}(\\omega)}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213590aee93fa0796d819", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "When 80 volt d.c. is applied across a solenoid, a current of 0.8 A flows in it. When 80 volt a.c. is applied across the same solenoid, the current becomes 0.4 A . If the frequency of a.c. source is 50 Hz , the impedance and inductance of the solenoid is nearly", "image": null}, "options": [{"id": "dM47Y", "text": "$200 \\Omega, 0.55 \\mathrm{H}$", "image": null, "isCorrect": true}, {"id": "YRRuJ", "text": "$100 \\Omega, 0.8 \\mathrm{H}$", "image": null, "isCorrect": false}, {"id": "Acqhw", "text": "$300 \\Omega, 1.2 \\mathrm{H}$", "image": null, "isCorrect": false}, {"id": "9RKMH", "text": "$200 \\Omega, 1.5 \\mathrm{H}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For d.c. circuit, the frequency is zero, so the inductive reactance is zero. The resistance of the solenoid is given by:<br><br>$R = \\dfrac{V_{dc}}{I_{dc}} = \\dfrac{80}{0.8} = 100 \\, \\Omega$<br><br>For a.c. circuit, the impedance of the solenoid is given by:<br><br>$Z = \\dfrac{V_{ac}}{I_{ac}} = \\dfrac{80}{0.4} = 200 \\, \\Omega$<br><br>The impedance of the solenoid is related to its resistance and inductive reactance by:<br><br>$Z = \\sqrt{R^2 + X_L^2}$<br><br>$200 = \\sqrt{100^2 + X_L^2}$<br><br>$X_L^2 = 200^2 - 100^2 = 30000$<br><br>$X_L = 100\\sqrt{3} \\, \\Omega$<br><br>The inductive reactance is also given by $X_L = 2\\pi f L$. Substituting the given values:<br><br>$100\\sqrt{3} = 2\\pi(50)L$<br><br>$100\\sqrt{3} = 100\\pi L$<br><br>$L = \\dfrac{\\sqrt{3}}{\\pi} \\approx \\dfrac{1.732}{3.14} \\approx 0.55 \\, \\text{H}$<br><br>Answer: $200 \\Omega, 0.55 \\mathrm{H}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792134a0aee93fa0796d7a2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "An inductance coil has a resistance of $80 \\Omega$. When on AC signal of frequency 480 Hz is applied to the coil, the voltage leads the current by $45^{\\circ}$. The inductance of the coil in henry is $\\left[\\sin 45^{\\circ}=\\cos 45^{\\circ}=1 / \\sqrt{2}\\right]$", "image": null}, "options": [{"id": "e20Tr", "text": "$\\dfrac{1}{24 \\pi}$", "image": null, "isCorrect": false}, {"id": "22fvK", "text": "$\\dfrac{\\pi}{20}$", "image": null, "isCorrect": false}, {"id": "Ahvmj", "text": "$\\dfrac{\\pi}{40}$", "image": null, "isCorrect": false}, {"id": "0QG6R", "text": "$\\dfrac{1}{12 \\pi}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given $R = 80 \\Omega$, $f = 480 \\text{ Hz}$, and phase angle $\\phi = 45^{\\circ}$.<br><br>In an RL circuit, the phase angle $\\phi$ is given by $\\tan \\phi = \\dfrac{X_L}{R} = \\dfrac{\\omega L}{R}$.<br><br>Substituting the given values:<br><br>$\\tan 45^{\\circ} = \\dfrac{2 \\pi f L}{R}$<br><br>$1 = \\dfrac{2 \\pi \\times 480 \\times L}{80}$<br><br>$80 = 960 \\pi L$<br><br>$L = \\dfrac{80}{960 \\pi} = \\dfrac{1}{12 \\pi} \\text{ H}$<br><br>Answer: $\\dfrac{1}{12 \\pi}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213460aee93fa0796d781", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "An alternating voltage $v=200 \\sqrt{2} \\sin (100 t)$ is connected to a $1 \\mu \\mathrm{~F}$ capacitor through an a. c. ammeter. The reading of the ammeter shall be", "image": null}, "options": [{"id": "xN8t3", "text": "10 mA", "image": null, "isCorrect": false}, {"id": "QXxPY", "text": "20 mA", "image": null, "isCorrect": true}, {"id": "PLWeL", "text": "40 mA", "image": null, "isCorrect": false}, {"id": "AOOnx", "text": "80 mA", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given alternating voltage is $v = 200 \\sqrt{2} \\sin(100 t)$.<br><br>Comparing with the standard equation $v = V_0 \\sin(\\omega t)$, we get:<br><br>Peak voltage, $V_0 = 200 \\sqrt{2}$ V<br><br>Angular frequency, $\\omega = 100$ rad/s<br><br>The RMS voltage is given by:<br><br>$V_{\\text{rms}} = \\dfrac{V_0}{\\sqrt{2}} = \\dfrac{200 \\sqrt{2}}{\\sqrt{2}} = 200$ V<br><br>The capacitive reactance is:<br><br>$X_C = \\dfrac{1}{\\omega C} = \\dfrac{1}{100 \\times 10^{-6}} = 10^4 \\, \\Omega$<br><br>The reading of an a.c. ammeter is the RMS value of the current, which is:<br><br>$I_{\\text{rms}} = \\dfrac{V_{\\text{rms}}}{X_C} = \\dfrac{200}{10^4} = 2 \\times 10^{-2}$ A<br><br>$I_{\\text{rms}} = 20$ mA<br><br>Answer: 20 mA", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213330aee93fa0796d6ef", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "$\\mathrm{L}=2 \\mathrm{H}, \\mathrm{C}=5 \\mathrm{mF}$ and $\\mathrm{R}=12 \\Omega$ are connected in series to an a.c. generator of frequency 50 Hz . Then", "image": null}, "options": [{"id": "lmUud", "text": "at resonance, impedance of the circuit is zero.", "image": null, "isCorrect": false}, {"id": "qKlE8", "text": "at resonance, impedance of the circuit is $12 \\Omega$.", "image": null, "isCorrect": true}, {"id": "msf9R", "text": "the resonant frequency of the circuit is $1 / 2 \\pi$.", "image": null, "isCorrect": false}, {"id": "qqfpK", "text": "the inductive reactance is less than the capacitive reactance.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The impedance of a series LCR circuit is given by $Z = \\sqrt{R^2 + (X_L - X_C)^2}$.<br><br>At resonance, the inductive reactance $X_L$ and capacitive reactance $X_C$ are equal, meaning $X_L = X_C$.<br><br>Substituting this into the impedance formula gives $Z = \\sqrt{R^2 + 0} = R$.<br><br>Given $R = 12 \\Omega$, the impedance of the circuit at resonance is $12 \\Omega$.<br><br>To verify the other options:<br><br>The resonant frequency is $f_r = \\dfrac{1}{2\\pi\\sqrt{LC}} = \\dfrac{1}{2\\pi\\sqrt{2 \\times 5 \\times 10^{-3}}} = \\dfrac{1}{2\\pi\\sqrt{10^{-2}}} = \\dfrac{5}{\\pi} \\text{ Hz}$.<br><br>At the given frequency $f = 50 \\text{ Hz}$, the reactances are:<br><br>$X_L = 2\\pi f L = 2\\pi(50)(2) = 200\\pi \\Omega$<br><br>$X_C = \\dfrac{1}{2\\pi f C} = \\dfrac{1}{2\\pi(50)(5 \\times 10^{-3})} = \\dfrac{2}{\\pi} \\Omega$<br><br>Clearly, $X_L > X_C$, so the inductive reactance is greater than the capacitive reactance.<br><br>Answer: at resonance, impedance of the circuit is $12 \\Omega$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213240aee93fa0796d67c", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "In the given circuit, when $\\mathrm{S}_1$ is closed, the capacitor gets fully charged. Now $\\mathrm{S}_1$ is open and $\\mathrm{S}_2$ is closed. Then\r\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/RGnuft13k4-o6X2aEfCmyDhuvNRIz2ftdXXWfkrNG7I.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "wuK1l", "text": "there is no exchange of energy between L and C .", "image": null, "isCorrect": false}, {"id": "vYy8g", "text": "the current in the circuit is in the same direction.", "image": null, "isCorrect": false}, {"id": "zJfKs", "text": "the instantaneous current in the circuit may be $\\mathrm{V}\\left(\\sqrt{\\dfrac{\\mathrm{C}}{\\mathrm{L}}}\\right)$.", "image": null, "isCorrect": true}, {"id": "cxMhl", "text": "the energy stored in the circuit is purely in the form of magnetic energy.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When switch $\\mathrm{S}_1$ is closed and $\\mathrm{S}_2$ is open, the capacitor $\\mathrm{C}$ is connected in series with the battery $\\mathrm{V}$ and resistor $\\mathrm{R}$.<br><br>In the steady state, the capacitor is fully charged and acts as an open circuit. The current in the circuit becomes zero.<br><br>The potential difference across the capacitor is equal to the battery voltage $\\mathrm{V}$.<br><br>The initial energy stored in the capacitor is purely electrical, given by $U_E = \\dfrac{1}{2}\\mathrm{C}\\mathrm{V}^2$.<br><br>When $\\mathrm{S}_1$ is opened and $\\mathrm{S}_2$ is closed, the battery and resistor are disconnected. The capacitor $\\mathrm{C}$ and inductor $\\mathrm{L}$ form a closed $\\mathrm{LC}$ circuit.<br><br>The circuit will undergo $\\mathrm{LC}$ oscillations where energy continuously exchanges between the electric field of the capacitor and the magnetic field of the inductor.<br><br>By the principle of conservation of energy, the maximum magnetic energy stored in the inductor is equal to the initial electrical energy stored in the capacitor:<br><br>$\\dfrac{1}{2}\\mathrm{L}I_{\\text{max}}^2 = \\dfrac{1}{2}\\mathrm{C}\\mathrm{V}^2$<br><br>$I_{\\text{max}}^2 = \\dfrac{\\mathrm{C}}{\\mathrm{L}}\\mathrm{V}^2$<br><br>$I_{\\text{max}} = \\mathrm{V}\\sqrt{\\dfrac{\\mathrm{C}}{\\mathrm{L}}}$<br><br>The instantaneous current $i$ in the $\\mathrm{LC}$ circuit oscillates sinusoidally, so its value varies between $-I_{\\text{max}}$ and $+I_{\\text{max}}$.<br><br>Therefore, the instantaneous current may be equal to its maximum value, $\\mathrm{V}\\sqrt{\\dfrac{\\mathrm{C}}{\\mathrm{L}}}$.<br><br>Answer: the instantaneous current in the circuit may be $\\mathrm{V}\\left(\\sqrt{\\dfrac{\\mathrm{C}}{\\mathrm{L}}}\\right)$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262670279619d9d8a343e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "The reciprocal of the total effective resistance of LCR a.c. circuit is called", "image": null}, "options": [{"id": "PuqE3", "text": "impedance", "image": null, "isCorrect": false}, {"id": "hULvG", "text": "admittance", "image": null, "isCorrect": true}, {"id": "7UPWn", "text": "resistance", "image": null, "isCorrect": false}, {"id": "qPSyI", "text": "inductive and capacitive reactance", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Std.12 $\\mid$ Ch-13 $\\mid$ Subtopic-13.5", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262640279619d9d8a3429", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "An alternating voltage is applied to a series LCR circuit. If the current leads the voltage by $45^{\\circ}$, then $\\left(\\tan 45^{\\circ}=1\\right)$", "image": null}, "options": [{"id": "Hhl1p", "text": "$X_L=X_C-R$", "image": null, "isCorrect": false}, {"id": "XBEWc", "text": "$X_L=X_C+R$", "image": null, "isCorrect": true}, {"id": "ZD1h7", "text": "$X_C=\\sqrt{X_L^2+R^2}$", "image": null, "isCorrect": false}, {"id": "QlZCG", "text": "$\\mathrm{X}_{\\mathrm{L}}=\\sqrt{\\mathrm{X}_{\\mathrm{C}}^2+\\mathrm{R}^2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The phase between the voltage and the current is given as\n$$\n\\begin{array}{ll} \n& \\tan \\phi=\\frac{X_L-X_C}{R} \\\\\n\\therefore \\quad & \\tan 45^{\\circ}=\\frac{X_L-X_C}{R} \\\\\n\\therefore \\quad & 1=\\frac{X_L-X_C}{R} \\\\\n\\therefore \\quad & R=X_L-X_C \\\\\n\\therefore \\quad & X_L=X_C+R\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262550279619d9d8a33ac", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "In a $\\mathrm{L}-\\mathrm{R}$ circuit, the inductive reactance is equal to the resistance ' $R$ ' in the circuit. An emf $\\mathrm{E}=\\mathrm{E}_0 \\cos \\omega \\mathrm{t}$ is applied to the circuit. The power consumed in the circuit is", "image": null}, "options": [{"id": "Esyj3", "text": "$\\frac{\\mathrm{E}_0^2}{\\sqrt{2} \\mathrm{R}}$", "image": null, "isCorrect": false}, {"id": "IXFLE", "text": "$\\frac{E_0^2}{4 R}$", "image": null, "isCorrect": true}, {"id": "A4QSt", "text": "$\\frac{\\mathrm{E}_0^2}{2 \\mathrm{R}}$", "image": null, "isCorrect": false}, {"id": "4wA3X", "text": "$\\frac{\\mathrm{E}_0^2}{8 \\mathrm{R}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{P}=\\mathrm{E}_{\\mathrm{rms}} \\mathrm{I}_{\\mathrm{rms}} \\cos \\phi$\n$\\cos \\phi=\\frac{R}{Z}$\nAlso, $I_{\\text {rms }}=\\frac{E_{\\text {rms }}}{Z}=\\frac{E_0}{Z \\sqrt{2}}$\n$\\therefore \\quad P=\\frac{E_0}{\\sqrt{2}} \\times \\frac{E_0}{Z \\sqrt{2}} \\times \\frac{R}{Z}$\n$=\\frac{E_0^2 R}{2 Z^2}$\nGiven $X_L=R$\n$\\therefore \\quad \\mathrm{Z}=\\sqrt{\\mathrm{R}^2+\\mathrm{R}^2}$\n$=\\sqrt{2} \\mathrm{R}$\n$\\therefore \\quad P=\\frac{E_0^2}{4 R}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262430279619d9d8a331f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "With increase in frequency of a.c. supply, the impedance of an $\\mathrm{L}-\\mathrm{C}$-R series circuit", "image": null}, "options": [{"id": "mlJDQ", "text": "remains constant.", "image": null, "isCorrect": false}, {"id": "1DwmV", "text": "increases.", "image": null, "isCorrect": false}, {"id": "SU6vl", "text": "decreases.", "image": null, "isCorrect": false}, {"id": "k5fkw", "text": "decreases at first, becomes minimum and then increases.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "We know\n$\\mathrm{X}_{\\mathrm{L}}=\\mathrm{L} \\omega$ and $\\mathrm{X}_{\\mathrm{C}}=\\frac{1}{\\mathrm{C} \\omega}$\n$\\Rightarrow$ When the frequency increases, $X_{\\mathrm{L}}^{\\prime}$ increases and $X_c$ decreases.\n$\\therefore \\quad$ The impédance of an LCR series circuit decreases at first, becomes minimum and then increases.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262430279619d9d8a331d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "In an oscillating LC circuit, the maximum charge on the capacitor is 'Q'. 'When the energy is stored equally between the electric and magnetic fields, the charge on the capacitor becomes", "image": null}, "options": [{"id": "v14Wg", "text": "$\\frac{\\mathrm{Q}}{4}$", "image": null, "isCorrect": false}, {"id": "JkZoi", "text": "$\\frac{\\mathrm{Q}}{2}$", "image": null, "isCorrect": false}, {"id": "QnopO", "text": "$\\frac{\\mathrm{Q}}{\\sqrt{2}}$", "image": null, "isCorrect": true}, {"id": "b6L83", "text": "$\\frac{\\mathrm{Q}}{\\sqrt{3}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Maximum energy stored in a capacitor,\n$$\n\\mathrm{E}_1=\\frac{\\mathrm{Q}^2}{2 \\mathrm{C}}\n$$\nWhen energy is stored equally between the electric and magnetic fields, then energy in the capacitor is $\\mathrm{E}_2=\\frac{1}{2} \\mathrm{E}_1$\nIf $\\mathrm{Q}^{\\prime}$ is the charge on the capacitor in this case, then $\\mathrm{E}_2=\\frac{\\mathrm{Q}^{\\prime 2}}{2 \\mathrm{C}}$.\n$$\n\\begin{aligned}\n\\therefore \\quad & \\frac{\\mathrm{Q}^{\\prime 2}}{2 \\mathrm{C}}=\\frac{1}{2} \\frac{\\mathrm{Q}^2}{2 \\mathrm{C}} \\\\\n& \\mathrm{Q}^{\\prime}=\\frac{\\mathrm{Q}}{\\sqrt{2}} .\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262090279619d9d8a3149", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "In a series LCR circuit, $\\mathrm{C}=2 \\mu \\mathrm{F}, \\mathrm{L}=1 \\mathrm{mH}$ and $\\mathrm{R}=10 \\Omega$. The ratio of the energies stored in the inductor and the capacitor, when the maximum current flows in the circuit, is", "image": null}, "options": [{"id": "olzjg", "text": "$5: 1$", "image": null, "isCorrect": true}, {"id": "O9DMt", "text": "$3: 2$", "image": null, "isCorrect": false}, {"id": "Ot6mW", "text": "$1: 2$", "image": null, "isCorrect": false}, {"id": "XmeHP", "text": "$1: 5$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In resonance condition (current is maximum),\n$\\therefore \\quad \\mathrm{X}_{\\mathrm{c}}=\\mathrm{X}_{\\mathrm{L}}$\n$\\therefore \\quad$ The ratio of energies in the inductor and capacitor is:\n$\\begin{aligned}\n& \\frac{\\mathrm{U}_{\\mathrm{L}}}{\\mathrm{U}_{\\mathrm{C}}}=\\frac{\\mathrm{LI}^2}{\\mathrm{CV}^2}=\\frac{\\mathrm{L}}{\\mathrm{CR}^2} \\quad \\ldots\\left(\\because \\frac{\\mathrm{I}}{\\mathrm{V}}=\\frac{1}{\\mathrm{R}}\\right) \\\\\n& \\frac{\\mathrm{U}_{\\mathrm{L}}}{\\mathrm{U}_{\\mathrm{C}}}=\\frac{10^{-3}}{2 \\times 10^{-6} \\times 10^2} \\\\\n& \\frac{\\mathrm{U}_{\\mathrm{L}}}{\\mathrm{U}_{\\mathrm{C}}}=\\frac{5}{1}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262080279619d9d8a313e", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "The a.c. source is connected to series LCR circuit. If voltage across $\\mathrm{R}$ is $40 \\mathrm{~V}$, that across $\\mathrm{L}$ is $80 \\mathrm{~V}$ and that across $\\mathrm{C}$ is $40 \\mathrm{~V}$, then the e.m.f. 'e' of a.c. source is", "image": null}, "options": [{"id": "zzRgl", "text": "$40 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "zfupF", "text": "$40 \\sqrt{2} \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "ozxlr", "text": "$80 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "LNajf", "text": "$160 \\mathrm{~V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The emf across the AC source is given as:\n$\\begin{aligned}\n\\mathrm{e} & =\\sqrt{\\left(\\mathrm{V}_{\\mathrm{K}}\\right)^2+\\left(\\mathrm{V}_{\\mathrm{c}}-\\mathrm{V}_{\\mathrm{L}}\\right)^2}=\\sqrt{(40)^2+(80-40)^2} \\\\\n\\mathrm{e} & =\\sqrt{3200} \\\\\n\\therefore \\quad \\mathrm{e} & =40 \\sqrt{2} \\mathrm{~V}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261f60279619d9d8a30b7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "In series LCR circuit, the voltage across the inductance and the capacitance are not", "image": null}, "options": [{"id": "1mN4N", "text": "out of phase with the voltage across the resistance by $90^{\\circ}$.", "image": null, "isCorrect": false}, {"id": "welw8", "text": "equal in magnitude at resonance.", "image": null, "isCorrect": false}, {"id": "mCnQC", "text": "out of phase with each other by $180^{\\circ}$.", "image": null, "isCorrect": false}, {"id": "7Z6n3", "text": "in phase with the source voltage.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In an LCR circuit, the inductor (L) and capacitor (C) introduce phase shifts in the current compared to the source voltage due to their reactive properties. The inductor causes a phase shift of +90 degrees, leading the voltage, while the capacitor causes a phase shift of -90 degrees, lagging the voltage. Thus, voltage across $\\mathrm{L}$ and $\\mathrm{C}$ are not in phase with the source voltage.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261f50279619d9d8a30a9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "With the gradual increase in frequency of an a. c. source, the impedance of an LCR series circuit", "image": null}, "options": [{"id": "5YQlb", "text": "first decreases, becomes minimum and then increases.", "image": null, "isCorrect": true}, {"id": "t06zW", "text": "increases.", "image": null, "isCorrect": false}, {"id": "o9D7a", "text": "decreases.", "image": null, "isCorrect": false}, {"id": "HUPi8", "text": "remains constant.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "With increase in frequency current increases initially, becomes maximum and then decreases with further increase in frequency.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261e40279619d9d8a3029", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "In the circuit given below, the current through inductor is $0.9 \\mathrm{~A}$ and through the capacitor is $0.6 \\mathrm{~A}$. The current drawn from the a.c. source is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/hx-VrQgl-du8_3HyJCrTeL5RZp7LGlRUuLoeFmgx7vI.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "HzTnJ", "text": "$1.5 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "ssZrx", "text": "$0.9 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "qYSxQ", "text": "$0.6 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "dHiiN", "text": "$0.3 \\mathrm{~A}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "As the currents in an inductor and capacitor are out of phase by $180^{\\circ}$, we can write Current through the capacitor $\\mathrm{I}_{\\mathrm{C}}=0.9 \\mathrm{~A}$ Current through the inductor $\\mathrm{I}_{\\mathrm{L}}=-(0.6 \\mathrm{~A})$\n$\\begin{aligned}\n\\therefore \\quad \\text { Total current drawn from the source } & =\\mathrm{I}_{\\mathrm{C}}+\\mathrm{I}_{\\mathrm{L}} \\\\\n& =0.9-0.6 \\\\\n& =0.3 \\mathrm{~A}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261bc0279619d9d8a2eec", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "An alternating voltage of frequency ' $\\omega$ ' is induced in electric circuit consisting of an inductance ' $\\mathrm{L}$ ' and capacitance ' $\\mathrm{C}$ ', connected in parallel. Then across the inductance coil", "image": null}, "options": [{"id": "sxxHs", "text": "current is maximum when $\\omega^2=\\frac{1}{\\text { LC }}$", "image": null, "isCorrect": false}, {"id": "ZSIa2", "text": "current is zero", "image": null, "isCorrect": false}, {"id": "SBQLa", "text": "voltage is minimum when $\\omega^2=\\frac{1}{\\text { LC }}$", "image": null, "isCorrect": false}, {"id": "TC7tM", "text": "voltage is maximum when $\\omega^2=\\frac{1}{\\text { LC }}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In a parallel LC circuit\nat $\\omega^2=\\frac{1}{\\mathrm{LC}}$, the current is minimum.\nAs current and voltage are out of phase by $90^{\\circ}$, the voltage would be maximum.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261bb0279619d9d8a2ee4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "An e.m.f. $E=4 \\cos (1000 t)$ volt is applied to an LR circuit of inductance $3 \\mathrm{mH}$ and resistance $4 \\Omega$. The maximum current in the circuit is", "image": null}, "options": [{"id": "40oSF", "text": "$\\frac{4}{\\sqrt{7}} \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "jcUqc", "text": "$1.0 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "rKWlb", "text": "$\\frac{4}{7} \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "0FtY0", "text": "$0.8 \\mathrm{~A}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For LR circuit,\n$Z=\\sqrt{R^2+(\\omega L)^2}$\nComparing equation $E=4 \\cos (1000 t)$ with standard equation, $\\mathrm{E}=\\mathrm{E}_0 \\cos \\omega \\mathrm{t}$, we get $\\omega=1000$ units and $E_0=4 \\mathrm{~V}$\n$\\begin{aligned}\n\\therefore \\quad Z & =\\sqrt{16+\\left(1000 \\times 3^2 \\times 10^{-6}\\right)} \\\\\n& Z=\\sqrt{16+9}=5 \\Omega \\\\\n\\therefore \\quad & I=\\frac{E_0}{Z}=\\frac{4}{5}=0.8 \\mathrm{~A}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261ad0279619d9d8a2e79", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "In an $\\mathrm{AC}$ circuit, the current is $i=5 \\sin \\left(100 t-\\frac{\\pi}{2}\\right) \\mathrm{A}$ and voltage is $e=200 \\sin (100 t)$ volt. Power consumption in the circuit is $\\left(\\cos 90^{\\circ}=0\\right)$", "image": null}, "options": [{"id": "msLoH", "text": "$200\\ W$", "image": null, "isCorrect": false}, {"id": "dAZvl", "text": "$0\\ W$", "image": null, "isCorrect": true}, {"id": "Pk4Y7", "text": "$40\\ W$", "image": null, "isCorrect": false}, {"id": "Yp8PQ", "text": "$1000\\ W$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\mathrm{P} & =\\mathrm{I}_{\\mathrm{rms}} \\mathrm{V}_{\\mathrm{rms}} \\cos \\phi \\\\ \\phi & =90^{\\circ} \\\\ \\therefore \\quad \\mathrm{P} & =0 \\quad\\left(\\because \\cos 90^{\\circ}=0\\right)\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261990279619d9d8a2dd7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "An AC voltage source of variable angular frequency $\\omega$ and fixed amplitude $V_0$ is connected in series with a capacitance $C$ and an electric bulb of resistance $R$ (inductance zero). When $\\omega$ is increased", "image": null}, "options": [{"id": "Kow0K", "text": "Total impedance of the circuit increase.", "image": null, "isCorrect": false}, {"id": "MmOH6", "text": "The bulb glows brighter.", "image": null, "isCorrect": true}, {"id": "Ohr8s", "text": "The bulb glows dimmer.", "image": null, "isCorrect": false}, {"id": "Mbrxx", "text": "Total impedance of the circuit is unchanged.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Potential difference across bulb,\n$V=I R=\\frac{V_0 R}{\\sqrt{R^2+\\left(\\frac{1}{\\omega C}\\right)^2}}$\nWhen $\\omega$ is increased, potential across the bulb as well as brightness increases.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261940279619d9d8a2db5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "A resistor $R$, an inductor $L$ and a capacitor $C$ are connected in series to an oscillator of frequency $N$. If the resonance frequency is $N_R$, then the current lags behind voltage, when", "image": null}, "options": [{"id": "GUU5w", "text": "$N=N_R$", "image": null, "isCorrect": false}, {"id": "vIILE", "text": "$N=0$", "image": null, "isCorrect": false}, {"id": "QZkg8", "text": "$N < N_R$", "image": null, "isCorrect": false}, {"id": "ni4Ng", "text": "$N>N_R$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Current lags behind the voltage,\n$\\begin{aligned}\n& X_L>X_C \\\\\n& \\Rightarrow \\omega L>\\frac{1}{\\omega C} \\\\\n& \\Rightarrow \\omega>\\frac{1}{\\sqrt{L C}} \\\\\n& \\Rightarrow N>N_R\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261820279619d9d8a2d26", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "A coil having an inductance of $\\frac{1}{\\pi} H$ is connected in series with a resistance of $300 \\Omega$. If A.C. source $(20 \\mathrm{~V}-200 \\mathrm{~Hz})$ is connected across the combination, the phase angle between voltage and current is", "image": null}, "options": [{"id": "VVCLK", "text": "$\\tan ^{-1}\\left(\\frac{4}{5}\\right)$", "image": null, "isCorrect": false}, {"id": "HOTQz", "text": "$\\tan ^{-1}\\left(\\frac{4}{3}\\right)$", "image": null, "isCorrect": true}, {"id": "jDVvM", "text": "$\\tan ^{-1}\\left(\\frac{5}{4}\\right)$", "image": null, "isCorrect": false}, {"id": "CQTMy", "text": "$\\tan ^{-1}\\left(\\frac{3}{4}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For LR circuit:\nPhase angle $\\tan \\phi=\\frac{\\omega L}{R}=\\frac{2 \\pi \\times 200}{300} \\times \\frac{1}{\\pi}=\\frac{4}{3}$\n$\\therefore \\phi=\\tan ^{-1} \\frac{4}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261720279619d9d8a2c9f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "When a capacitor is connected in series LR circuit, the alternating current flowing in the circuit.", "image": null}, "options": [{"id": "cDIrk", "text": "remains constant.", "image": null, "isCorrect": false}, {"id": "7mitI", "text": "increases.", "image": null, "isCorrect": true}, {"id": "r1LwD", "text": "increases.", "image": null, "isCorrect": false}, {"id": "nZLPD", "text": "decreases.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Impedance of series LR circuit\n$Z=\\sqrt{R^2+X_L^2}$\nWhen a capacitor is also connected in circuit, Then impedance\n$Z_L=\\sqrt{R^2+\\left(X_L-X_C\\right)^2}$\nClearly impedance of circuit decreases $\\left(Z_2<Z_1\\right)$, so the value of current\n$I=\\frac{V}{Z} \\propto \\frac{1}{Z}$ in the circuit increases.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261700279619d9d8a2c93", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "Same current is flowing in two alternating circuits. The first circuit contains only inductor and the other contains only a capacitor. If the frequency of the alternating e.m.f. is increased, the values of current will", "image": null}, "options": [{"id": "9EbSV", "text": "decrease in first circuit and increase in the other.", "image": null, "isCorrect": true}, {"id": "5Tgyf", "text": "increase in first circuit and decrease in the other.", "image": null, "isCorrect": false}, {"id": "a4tBd", "text": "increase in both circuits.", "image": null, "isCorrect": false}, {"id": "Zt7oh", "text": "decrease in both circuits.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For inductor,\n$$\nI \\propto \\frac{1}{X_L} \\propto \\frac{1}{f}\n$$\nHence, as frequency increases, current decreases.\nFor capacitor,\n$I \\propto \\frac{1}{X_C} \\propto f$\nHence, as frequency increases, current increases.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2615e0279619d9d8a2c01", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "In the circuit shown, the AC source has voltage $\\mathrm{V}=20 \\cos (\\omega \\mathrm{t})$ volt with $\\omega=2000 \\mathrm{rad} / \\mathrm{s}$. The magnitude of amplitude current will be nearly\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/Tz7lshanMddyxSfZ9geDIvHiU9Or7vA4UEHwWTAuHPs.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "xx8D6", "text": "$\\sqrt{5} \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "hnWbN", "text": "3.3 A", "image": null, "isCorrect": true}, {"id": "H6O9l", "text": "2 A", "image": null, "isCorrect": false}, {"id": "0shYY", "text": "$\\frac{2}{\\sqrt{5}} \\mathrm{~A}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Current through the circuit is given by\n$i=\\frac{V_0}{\\sqrt{R^2+\\left(X_C-X_L\\right)^2}}$ where $X_L=\\omega L$ and $X C=\\frac{1}{\\omega C}$.\nGiven: $\\mathrm{V}_0=20 \\mathrm{~V},=6 \\Omega, \\mathrm{L}=5 \\times 10^{-3} \\mathrm{H}, \\omega=2000 \\frac{\\mathrm{rad}}{\\mathrm{s}}$ and $\\mathrm{C}=50 \\times 10^{-6} \\mathrm{~F}$\n$\\begin{aligned}\n& \\therefore \\mathrm{X}_{\\mathrm{C}}=\\frac{1}{50 \\times 10^{-6} \\times 2000} \\Omega 10 \\Omega \\text { and } \\mathrm{X}_{\\mathrm{L}}=2000 \\times 5 \\times 10^{-3} \\Omega=10 \\Omega \\\\\n& \\because \\mathrm{X}_{\\mathrm{C}}=\\mathrm{X}_{\\mathrm{L}}\n\\end{aligned}$\nThe current is simply: $\\mathrm{I}=\\frac{\\mathrm{v}_0}{\\mathrm{R}}$\n$\\therefore \\mathrm{i}=\\frac{20}{6} \\mathrm{~A}=3.3 \\mathrm{~A}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2615d0279619d9d8a2bf9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "A $10 \\Omega$ resistance, $5 \\mathrm{mH}$ coil and $10 \\mu \\mathrm{F}$ capacitor are joined in series. When alternating current source of suitable frequency is joined to this combination, the circuit resonates. If the resistance is halved, the resonant frequency is", "image": null}, "options": [{"id": "oafoB", "text": "quadrupled.", "image": null, "isCorrect": false}, {"id": "SvWBV", "text": "halved.", "image": null, "isCorrect": false}, {"id": "mcaFF", "text": "doubled.", "image": null, "isCorrect": false}, {"id": "fXC8F", "text": "remains unchanged.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Concept based.\nAt resonance, in LCR circuit inductive and capacitive reactance are equal:\n$\\begin{aligned}\n& X_L=X_C \\\\\n& \\Rightarrow 2 \\pi \\mathrm{fL}=\\frac{1}{2 \\pi \\mathrm{fC}} \\\\\n& \\Rightarrow \\mathrm{f}^2=\\left(\\frac{1}{4 \\pi^2 \\mathrm{LC}}\\right)\n\\end{aligned}$\nThe resonant frequency is independent of the resistance.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2614d0279619d9d8a2b71", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "In series $L-C-R$ circuit, the capacitance is changed from $C$ to $2 C$. To obtain the same resonance frequency the inductance should be changed from $L$ to", "image": null}, "options": [{"id": "yXzmr", "text": "$2 L$", "image": null, "isCorrect": false}, {"id": "ofzAb", "text": "$4 L$", "image": null, "isCorrect": false}, {"id": "O5v1C", "text": "$\\frac{L}{2}$", "image": null, "isCorrect": true}, {"id": "nn2LS", "text": "$L$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Resonant frequency, $f=\\frac{1}{2 \\pi \\sqrt{L C}}$\nAs the frequency is unchanged so $f=f^{\\prime}$\n$\\begin{aligned}\n& \\therefore L C=L^{\\prime} C^{\\prime}=L^{\\prime}(2 C) \\\\\n& \\therefore L^{\\prime}=\\frac{L}{2}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2614d0279619d9d8a2b70", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "Resistor of $2 \\Omega$, inductor of $100 \\mu \\mathrm{H}$ and capacitor of $400 \\mathrm{pF}$ are connected in series across an a.c. source of $e_{r m s}=0.1$ volt.\nAt resonance, voltage drop across inductor is", "image": null}, "options": [{"id": "FYBBK", "text": "20V", "image": null, "isCorrect": false}, {"id": "BIs9o", "text": "25 V", "image": null, "isCorrect": true}, {"id": "a44mH", "text": "2.5 V", "image": null, "isCorrect": false}, {"id": "tXpkb", "text": "250 V", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We know, at resonance $X_C=X_L$\n$\\Rightarrow \\omega L=\\frac{1}{\\omega C} \\Rightarrow \\omega=\\left(\\frac{1}{\\sqrt{L C}}\\right)$\nThe potential drop across inductor is\n$V_L=i X_L=i \\sqrt{\\frac{L}{C}}$\n$\\because$ LCR circuit in series and at resonance\n$i=\\frac{V}{R}=\\frac{0.1}{2} \\mathrm{~A}=0.05 \\mathrm{~A}$\nNow, $V_L=0.05 \\sqrt{\\left(\\frac{100 \\times 10^{-6}}{400 \\times 10^{-12}}\\right)} \\mathrm{V}=2.5 \\times 10^{-2} \\times 10^3 \\mathrm{~V}=25 \\mathrm{~V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2613b0279619d9d8a2adf", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "A one microfarad condenser is charged to $50 \\mathrm{~V}$. The charging battery is then disconnected and a $10 \\mathrm{mH}$ coli is connected across the capacitor so that LC oscillations occur. What is the maximum current in the coil? Assume that the circuit contains no resistance.", "image": null}, "options": [{"id": "xXeHZ", "text": "$0.75 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "IFrRc", "text": "$0.25 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "q0GL9", "text": "$0.50 \\mathrm{~A}$", "image": null, "isCorrect": true}, {"id": "Q3oWd", "text": "$1.00 \\mathrm{~A}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/Fy7jwXFnbjK8R295ZsQP70Y19KCBvYFAqU1Yi-GIPy4.original.fullsize.png\">\n$\\begin{aligned} & \\frac{\\mathrm{q}}{\\mathrm{C}}=-\\mathrm{L} \\frac{\\mathrm{di}}{\\mathrm{dt}}=(-\\mathrm{L}) \\frac{\\mathrm{dq}}{\\mathrm{dt}}=\\frac{\\mathrm{di}}{\\mathrm{dq}} \\Rightarrow \\int_{\\mathrm{Q}_0}^0 \\mathrm{qdq}=(-\\mathrm{LC}) \\int_0^{\\mathrm{i}} \\max \\mathrm{idi} \\\\ & \\left.\\Rightarrow \\frac{\\mathrm{q}^2}{2}\\right|_{\\mathrm{Q}_0} ^0=\\left.(-\\mathrm{LC}) \\frac{\\mathrm{i}^2}{2}\\right|_0 ^{\\mathrm{i}^{\\mathrm{max}}} \\Rightarrow 0-\\mathrm{Q}_0^2=(-\\mathrm{LC})\\left(\\mathrm{i}_{\\max }{ }^2\\right) \\\\ & \\Rightarrow \\mathrm{i}_{\\max }=\\frac{\\mathrm{Q}_0}{\\sqrt{\\mathrm{LC}}}=\\frac{\\mathrm{CV}}{\\sqrt{\\mathrm{LC}}}=50 \\sqrt{\\frac{1 \\times 10^{-6} \\mathrm{~F}}{10 \\times 10^{-3} \\mathrm{H}}} \\\\ & =50 \\times 10^{-2} \\mathrm{~A} \\\\ & \\Rightarrow \\mathrm{i}=0.5 \\mathrm{~A}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261380279619d9d8a2ac6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "At resonance, the value of current in a series L-C-R- (Symbols have their usual meanings.)", "image": null}, "options": [{"id": "fujrv", "text": "$\\frac{\\mathrm{e}_0}{\\mathrm{R}}$", "image": null, "isCorrect": true}, {"id": "FQwZV", "text": "$\\frac{\\mathrm{e}_0}{\\sqrt{\\mathrm{r}^2+\\omega^2 \\mathrm{C}^2}}$", "image": null, "isCorrect": false}, {"id": "9Uk18", "text": "$\\mathrm{e}_0\\left[\\mathrm{R}^2+\\left(\\omega \\mathrm{L}+\\frac{1}{\\omega \\mathrm{C}}\\right)^2\\right]$", "image": null, "isCorrect": false}, {"id": "N8MmV", "text": "$\\frac{\\mathrm{e}_0}{\\sqrt{\\mathrm{R}^2+\\omega^2 \\mathrm{~L}^2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "At resonance,\n$\\omega \\mathrm{L}=\\frac{1}{\\omega \\mathrm{C}}$\nSo,\n$\\mathrm{i}=\\frac{\\mathrm{e}_0}{\\sqrt{\\mathrm{R}^2+\\left(\\omega \\mathrm{L}-\\frac{1}{\\omega \\mathrm{C}}\\right)^2}}=\\frac{\\mathrm{e}_0}{\\sqrt{\\mathrm{R}^2}}=\\frac{\\mathrm{e}_0}{\\mathrm{R}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261290279619d9d8a2a4d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "The resonant frequency of a series LCR circuit is ' $\\mathrm{f}_R$ '. The circuit is connected to a sinusoidally alternating e.m.f. of frequency ' $2 \\mathrm{f}_{\\mathrm{R}}$ '. The inductive reactance becomes. ' $\\mathrm{X}_{\\mathrm{L}_1}$ ' and capacitive reactance becomes ' $\\mathrm{X}_{\\mathrm{C}_1}$ ' after changing the frequency. ' $\\mathrm{X}_{C_1}$ ' is equal to", "image": null}, "options": [{"id": "CUIAp", "text": "$2 \\mathrm{X}_{\\mathrm{L}_1}$", "image": null, "isCorrect": false}, {"id": "ObtLO", "text": "$\\frac{1}{4} \\mathrm{X}_{\\mathrm{L}_1}$", "image": null, "isCorrect": true}, {"id": "JRsUm", "text": "$\\frac{1}{2} \\mathrm{X}_{\\mathrm{L}_1}$", "image": null, "isCorrect": false}, {"id": "FT64v", "text": "$\\mathrm{x}_{\\mathrm{L}_1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$X_C=\\frac{1}{\\omega^2}$ and $X_L=(\\omega L)$\nWe know, $\\omega=2 \\pi f \\Rightarrow f \\propto \\omega$ if $f$ is doubled\n$\\therefore \\mathrm{X}_{\\mathrm{C}_1}=\\frac{\\mathrm{X}_{\\mathrm{C}}}{2}$ and $\\mathrm{X}_{\\mathrm{L}_1}=2 \\mathrm{X}_{\\mathrm{L}}$\nWe know, $\\mathrm{X}_{\\mathrm{C}}=\\mathrm{X}_{\\mathrm{L}}$\n$\\Rightarrow 2 \\mathrm{X}_{\\mathrm{C}_1}=\\frac{\\mathrm{XL}_1}{2} \\Rightarrow\\left(\\mathrm{X}_{\\mathrm{C}_1}=\\frac{\\mathrm{X}_{\\mathrm{L}_1}}{4}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261280279619d9d8a2a46", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "A battery connected to a capacity $20 \\mu \\mathrm{F}$ is charged to a potential of $35 \\mathrm{~V}$. The battery is disconnected. A pure inductor coil of $200 \\mathrm{mH}$ is connected across the capacitor so that LC oscillations are set up.The maximum current in the coil is", "image": null}, "options": [{"id": "Mpe5l", "text": "$0.025 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "CaDVm", "text": "$0.25 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "TS8Hz", "text": "$0.035 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "RMf8i", "text": "0.35 A", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Capacitance, $\\mathrm{C}=20 \\mu \\mathrm{F}$\nVoltage applied to capacitor, $\\mathrm{V}=35$ volts\nInductance connected to the capacitor, $\\mathrm{L}=200 \\mathrm{mH}$\nTo find: The maximum current in the inducting coil.\nThe charge stored in the capacitor is given by:\n$\\mathrm{Q}_0=\\mathrm{CV}$\nThe maximum current flowing in the series LC circuit is:\n$I_{\\text {max }}=Q_{\\text {ow }}$\nThe frequency of a series LC circuit is given by:\n$\\omega=\\frac{1}{\\sqrt{\\mathrm{LC}}}$\nSubstitute the values in equation of maximum current.\n$\\begin{aligned} & \\Rightarrow I_{\\max }=(\\mathrm{CV}) \\times \\frac{1}{\\sqrt{\\mathrm{LC}}}=\\sqrt{\\frac{\\mathrm{C}}{\\mathrm{L}}} \\mathrm{V} \\\\ & \\therefore \\mathrm{I}_{\\max }=\\sqrt{\\frac{20 \\times 10^{-6}}{200 \\times 10^{-3}}} \\times 35=0.35 \\mathrm{~A}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261180279619d9d8a29bf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}], "question": {"text": "An inductance coil has a resistance of $100 \\Omega$. When are a.c. signal of frequency $100 \\mathrm{Hzis}$ applied to the coil, the voltage leads the current by $45^{\\circ}$. The inductance of the coil in henry is $\\left[\\sin 45^{\\circ}=\\cos 45^{\\circ}=\\frac{1}{\\sqrt{2}}\\right]$", "image": null}, "options": [{"id": "ajbdv", "text": "$\\frac{1}{\\pi}$", "image": null, "isCorrect": false}, {"id": "NDvJF", "text": "$\\frac{5}{2 \\pi}$", "image": null, "isCorrect": false}, {"id": "j6Lsa", "text": "$\\frac{2}{\\pi}$", "image": null, "isCorrect": false}, {"id": "nct9H", "text": "$\\frac{1}{2 \\pi}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The phase angle in an LR circuit is given by, since $\\phi=45^{\\circ}$,\n$\\tan \\phi=\\frac{X_L}{X_R}=1$\nResistance of inductive coil $X_L=X_R=100 \\Omega$\nThus, inductance of coil $L=\\frac{X_L}{2 \\pi f}$\n$\\therefore L=\\frac{100}{2 \\pi \\times 100 \\mathrm{~s}^{-1}}=\\frac{1}{2 \\pi} \\mathrm{H}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261150279619d9d8a29ad", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}], "question": {"text": "A circuit of negligible resistance has an inductor of $0.16 \\mathrm{H}$ and capacitor of $25 \\mu \\mathrm{F}$ connected in series with an alternating voltage source. The resonating frequency of the circuit is", "image": null}, "options": [{"id": "coRvc", "text": "$\\frac{150}{\\pi}$", "image": null, "isCorrect": false}, {"id": "bE7mE", "text": "$\\frac{200}{\\pi}$", "image": null, "isCorrect": false}, {"id": "1G7dL", "text": "$\\frac{250}{\\pi}$", "image": null, "isCorrect": true}, {"id": "g1h2z", "text": "$\\frac{400}{\\pi}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "At resonance inductive and capacitive reactance's are equal:\n$\\begin{aligned} & X_C=\\omega C=X_L=\\frac{1}{\\omega L} \\\\ & \\Rightarrow \\omega=\\frac{1}{\\sqrt{L C}}=2 \\pi f\\end{aligned}$\nGiven, $L=0.16 \\mathrm{H} \\& C=25 \\times 10^{-6} \\mathrm{~F}$\n$\\begin{aligned} & \\Rightarrow \\omega=\\frac{1}{\\sqrt{4 \\times 10^{-6}}} \\mathrm{~s}^{-1}=\\frac{1000}{2} \\mathrm{~s}^{-1}=2 \\pi f \\\\ & \\Rightarrow f=\\left(\\frac{250}{\\pi}\\right) \\mathrm{sec}^{-1}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261040279619d9d8a2924", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "In series LCR circuit, the voltage across $L, C$ and $R$ is $50 \\mathrm{~V}, 20 \\mathrm{~V}$ and $40 \\mathrm{~V}$ respectively. The a.c. voltage applied across the combination of LCR is", "image": null}, "options": [{"id": "DZimL", "text": "$10 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "SlrHp", "text": "$110 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "MyAAg", "text": "$70 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "q1XMu", "text": "$50 \\mathrm{~V}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The ac voltage across the LCR is given by:\n$V_{r m s}=\\sqrt{V_R^2+\\left(V_L-V_C\\right)^2}=\\sqrt{40^2+(50-20)^2}=50 \\mathrm{~V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261030279619d9d8a2916", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "In series L-C-R circuit $C=2 \\mu \\mathrm{F}, L=1 \\mathrm{mH}$ and $R=10 \\Omega$. What is the ratio of energies stored in the inductor and the capacitor, when the maximum current flows in the circuit?", "image": null}, "options": [{"id": "hA5uZ", "text": "$1: 8$", "image": null, "isCorrect": false}, {"id": "UZqal", "text": "$5: 1$", "image": null, "isCorrect": false}, {"id": "uQh04", "text": "$1: 5$", "image": null, "isCorrect": true}, {"id": "8RgXB", "text": "$8: 1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "At maximum current condition, system is at resonance condition.\n$\\therefore X_C=X_L$\n$\\Rightarrow \\frac{U_C}{U_L}=\\frac{\\frac{1}{2} C V^2}{\\frac{1}{2} L i^2}=\\frac{C i^2 R^2}{L i^2}$\n$\\Rightarrow \\frac{U_C}{U_L}=\\frac{2 \\times 10^{-6}}{10^{-3}} \\times 100$\nHence, we get\n$\\frac{U_C}{U_L}=\\frac{2}{10}=\\frac{1}{5}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260f00279619d9d8a2882", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}], "question": {"text": "In LC parallel resonance circuit, choose the wrong statement", "image": null}, "options": [{"id": "g633D", "text": "Resonance occurs when inductive and capacitive reactance is same.", "image": null, "isCorrect": false}, {"id": "jZ33T", "text": "At resonance, current is minimum.", "image": null, "isCorrect": false}, {"id": "2FsKy", "text": "At resonance, impedance is maximum.", "image": null, "isCorrect": false}, {"id": "6XmqF", "text": "At resonance, resonant frequency $=\\sqrt{\\mathrm{LC}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Concept based.\nResonance occurs when inductive and capacitive reactance is same.\n$\\begin{aligned} & X_C=X_L \\\\ & \\Rightarrow \\omega L=\\frac{1}{\\omega C} \\\\ & \\Rightarrow \\omega=\\frac{1}{\\sqrt{L C}} \\\\ & \\therefore f=\\frac{1}{2 \\pi \\sqrt{L C}}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260f00279619d9d8a2880", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}], "question": {"text": "In an LCR series circuit, if the angular frequency is gradually in creased then match the following columns\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/PK-aWZ8abv8rMj4jwDQwBZKgR8AS1hrxpzbS1crdNZk.original.fullsize.png\">", "image": null}, "options": [{"id": "zXo0T", "text": "$(\\mathrm{A})-(\\mathrm{iv}),(\\mathrm{B})-(\\mathrm{i}),(\\mathrm{C})-(\\mathrm{ii}),(\\mathrm{D})-(\\mathrm{iii})$", "image": null, "isCorrect": true}, {"id": "QHW5S", "text": "(A) - (i), (B) - (iii), (C) - (iv), (D) - (ii)", "image": null, "isCorrect": false}, {"id": "kAYgP", "text": "$(\\mathrm{A})-(\\mathrm{ii}),(\\mathrm{B})-(\\mathrm{iii}),(\\mathrm{C})-(\\mathrm{i}),(\\mathrm{D})-(\\mathrm{iv})$", "image": null, "isCorrect": false}, {"id": "oAMcV", "text": "$(A)-(i),(B)-(i v),(C)-(i i),(D)-(i i i)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{X}_{\\mathrm{C}}=\\frac{1}{\\omega \\mathrm{C}}, \\text { so } \\mathrm{X}_{\\mathrm{C}} \\propto \\frac{1}{\\omega} \\\\ & \\therefore(\\mathrm{A})-(\\mathrm{iv}) \\\\ & \\mathrm{X}_{\\mathrm{L}}=\\omega \\mathrm{L}, \\text { so } \\mathrm{X}_{\\mathrm{L}} \\propto \\omega \\\\ & \\therefore(\\mathrm{B})-(\\mathrm{i})\\end{aligned}$\nAnd $\\mathrm{R}$ is not a function of $\\omega$\n$\\therefore(\\mathrm{C})-(\\mathrm{ii})$\nImpedence $\\mathrm{Z}$ is the minimum at resonance frequency.\n$\\therefore(\\mathrm{D})-(\\mathrm{iii})$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260ef0279619d9d8a287b", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}], "question": {"text": "When a.c. source is connected across a pure capacitor, the correct phase relation between current $\\left(\\mathrm{i}_{\\mathrm{c}}\\right)$ and voltage $\\left(\\mathrm{e}_{\\mathrm{c}}\\right)$ is shown in figure\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/aGQ_JAT0ycf-J-mzqcZqdffb0pFaR86M8RjQ0LNiGRA.original.fullsize.png\">", "image": null}, "options": [{"id": "2QAs6", "text": "(B)", "image": null, "isCorrect": true}, {"id": "nO0cr", "text": "(C)", "image": null, "isCorrect": false}, {"id": "p7Lpo", "text": "(D)", "image": null, "isCorrect": false}, {"id": "lhD4p", "text": "(A)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Conceptual question. The current leads the voltage by $\\frac{\\pi}{2}$ radians.\nAc voltage source, $\\mathrm{V}=\\mathrm{V}_0 \\sin (\\omega \\mathrm{t})$\nCharge at a given moment on the capacitor, $\\mathrm{q}=\\mathrm{CV}$\nThe current through the circuit: $\\frac{\\mathrm{dq}}{\\mathrm{dt}}=\\left(\\omega \\mathrm{CV}_0\\right)=\\cos (\\omega \\mathrm{t})$\nAs cos leads the $\\sin$ function by $\\frac{\\pi}{2}$ radians.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260e00279619d9d8a2804", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}], "question": {"text": "In LCR series resonance circuit, choose the wrong statement.", "image": null}, "options": [{"id": "mS5m4", "text": "At resonance, impedance is minimum.", "image": null, "isCorrect": false}, {"id": "x0CdS", "text": "At resonance, circuit is purely inductive", "image": null, "isCorrect": true}, {"id": "iKAWB", "text": "At resonance current has a maximum value.", "image": null, "isCorrect": false}, {"id": "uEJQ5", "text": "Resonance occurs at $X_L=X_C$.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Concept: In LCR series circuits, resonance occurs when the value of inductive and capacitive reactances have equal magnitude but have a phase difference of $180^{\\circ}$. Thus, they cancel each other. The circuit is purely resistive at resonance.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260da0279619d9d8a27d6", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}], "question": {"text": "A condenser of capacity ' $\\mathrm{C}$ ' is charged to a potential difference of ' $\\mathrm{V}_1$ '. The plates of the condenser are then connected to an ideal inductor of inductance ' $L$ '. The current through an inductor |when the potential difference across the condenser reduces to ' $\\mathrm{V}$ ' is", "image": null}, "options": [{"id": "caDZU", "text": "$\\frac{\\mathrm{C}\\left(\\mathrm{V}_1^2-\\mathrm{V}_2^2\\right)}{\\mathrm{L}}$", "image": null, "isCorrect": false}, {"id": "yV9PE", "text": "$\\frac{\\mathrm{C}\\left(\\mathrm{V}_1^2+\\mathrm{V}_2^2\\right)}{\\mathrm{L}}$", "image": null, "isCorrect": false}, {"id": "JU0xK", "text": "$\\left[\\frac{\\mathrm{C}\\left(\\mathrm{V}_1^2-\\mathrm{V}_2^2\\right)^{\\frac{1}{2}}}{\\mathrm{~L}}\\right]$", "image": null, "isCorrect": true}, {"id": "xX2zE", "text": "$\\left[\\frac{\\mathrm{C}\\left(\\mathrm{V}_1-\\mathrm{V}_2\\right)^{\\frac{1}{2}}}{\\mathrm{~L}}\\right]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The correct option is (C).\nConcept: For the LC circuit the potential drop across the circuit can be written as: $\\frac{\\mathrm{q}}{\\mathrm{C}}+\\mathrm{L} \\frac{\\mathrm{di}}{\\mathrm{dt}}=0$\nOn rewriting, $\\frac{\\mathrm{q}}{\\mathrm{C}}+\\mathrm{L}\\left(\\frac{\\mathrm{dq}}{\\mathrm{dt}}\\right) \\frac{\\mathrm{di}}{\\mathrm{dt}}=0$\nTherefore, $\\frac{\\mathrm{q}}{\\mathrm{C}}+\\mathrm{Li} \\frac{\\mathrm{di}}{\\mathrm{dq}}=0$\nOn integrating, $\\int_{\\mathrm{cv}_1}^{\\mathrm{cv}_2} \\frac{\\mathrm{q}}{\\mathrm{c}} \\mathrm{dq}=-\\int_0^{\\m
