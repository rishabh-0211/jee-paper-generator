5}R$.<br><br>The new power factor $X_2 = \\dfrac{R}{Z_2} = \\dfrac{R}{\\sqrt{5}R} = \\dfrac{1}{\\sqrt{5}}$.<br><br>The ratio $\\dfrac{X_1}{X_2} = \\dfrac{\\dfrac{1}{\\sqrt{10}}}{\\dfrac{1}{\\sqrt{5}}} = \\dfrac{\\sqrt{5}}{\\sqrt{10}} = \\dfrac{1}{\\sqrt{2}}$.<br><br>Thus, the ratio $X_1 : X_2$ is $1 : \\sqrt{2}$.<br><br>Answer: $1: \\sqrt{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871afabf9280d7f9932545", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A series LCR circuit is connected to an a.c. source of $230 \\mathrm{~V}, 50 \\mathrm{~Hz}$. The circuit contains resistance of $80 \\Omega$ an inductor having inductive reactance $70 \\Omega$ and a capacitor of capacitive reactance $130 \\Omega$. The power factor of the circuit is $x$. The value of $x$ is", "image": null}, "options": [{"id": "AbKyO", "text": "$0.4$", "image": null, "isCorrect": false}, {"id": "bhaqA", "text": "$0.8$", "image": null, "isCorrect": true}, {"id": "4vGdL", "text": "$0.6$", "image": null, "isCorrect": false}, {"id": "oOkXx", "text": "$0.9$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $R = 80 \\Omega$, $X_L = 70 \\Omega$, and $X_C = 130 \\Omega$.<br><br>The impedance of the series LCR circuit is given by:<br><br>$Z = \\sqrt{R^2 + (X_C - X_L)^2}$<br><br>Substituting the given values:<br><br>$Z = \\sqrt{80^2 + (130 - 70)^2}$<br><br>$Z = \\sqrt{80^2 + 60^2}$<br><br>$Z = \\sqrt{6400 + 3600} = \\sqrt{10000} = 100 \\Omega$<br><br>The power factor of the circuit is:<br><br>$\\cos \\phi = \\dfrac{R}{Z}$<br><br>$\\cos \\phi = \\dfrac{80}{100} = 0.8$<br><br>Thus, the value of $x$ is $0.8$.<br><br>Answer: $0.8$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262770279619d9d8a34be", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "The power factor of an R-L circuit is $\\frac{1}{\\sqrt{2}}$. If the frequency of $\\mathrm{AC}$ is doubled the power factor will now be", "image": null}, "options": [{"id": "W6kpw", "text": "$\\frac{1}{\\sqrt{3}}$", "image": null, "isCorrect": false}, {"id": "Jj1Fy", "text": "$\\frac{1}{\\sqrt{5}}$", "image": null, "isCorrect": true}, {"id": "Y1JMt", "text": "$\\frac{1}{\\sqrt{7}}$", "image": null, "isCorrect": false}, {"id": "IZ7lh", "text": "$\\frac{1}{\\sqrt{11}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The power factor of an R-L circuit is given as,\n$\\begin{aligned}\n& \\quad \\cos \\phi=\\frac{\\mathrm{R}}{\\sqrt{\\mathrm{R}^2+\\mathrm{X}_{\\mathrm{L}}{ }^2}} \\\\\n& \\therefore \\quad \\frac{\\mathrm{R}}{\\sqrt{\\mathrm{R}^2+\\mathrm{X}_{\\mathrm{L}}{ }^2}}=\\frac{1}{\\sqrt{2}} \\\\\n& \\therefore \\quad \\frac{1}{\\sqrt{1+\\left(\\frac{\\mathrm{X}_{\\mathrm{L}}}{\\mathrm{R}}\\right)^2}}=\\frac{1}{\\sqrt{2}} \\\\\n& \\therefore \\quad \\frac{1}{\\sqrt{1+\\left(\\frac{\\omega \\mathrm{L}}{\\mathrm{R}}\\right)^2}}=\\frac{1}{\\sqrt{2}} \\\\\n& \\therefore \\quad\\left(\\frac{\\omega \\mathrm{L}}{\\mathrm{R}}\\right)^2+1=2 \\\\\n& \\therefore \\quad \\frac{\\omega \\mathrm{L}}{\\mathrm{R}}=1\n\\end{aligned}$\nSo, when the AC frequency is doubled,\n$\\begin{aligned}\n\\frac{\\omega \\mathrm{L}}{\\mathrm{R}} & =2 \\\\\n\\therefore \\quad \\cos \\phi & =\\frac{1}{\\sqrt{1+\\left(\\frac{\\omega \\mathrm{L}}{\\mathrm{R}}\\right)^2}}=\\frac{1}{\\sqrt{1+(2)^2}} \\\\\n\\therefore \\quad \\cos \\phi & =\\frac{1}{\\sqrt{5}}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262660279619d9d8a3439", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "For a purely inductive or a purely capacitive circuit, the power factor is", "image": null}, "options": [{"id": "04FxB", "text": "zero", "image": null, "isCorrect": true}, {"id": "Dg3Mq", "text": "0.5", "image": null, "isCorrect": false}, {"id": "6hyxV", "text": "1", "image": null, "isCorrect": false}, {"id": "cCKzS", "text": "$\\infty$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\begin{array}{|l|l|l|} \\hline Std.12 & Ch-13 & Subtopic-13.6 \\end{array}", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261d10279619d9d8a2f96", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "In a series LR circuit, $X_L=R$, power factor is $P_1$. If a capacitor of capacitance $C$ with $X_C=X_L$ is added to the circuit the power factor becomes $P_2$. The ratio of $P_1$ to $P_2$ will be", "image": null}, "options": [{"id": "dtJOk", "text": "$1: 3$", "image": null, "isCorrect": false}, {"id": "8BY6v", "text": "$1: \\sqrt{2}$", "image": null, "isCorrect": true}, {"id": "5Ppoc", "text": "$1: 1$", "image": null, "isCorrect": false}, {"id": "XvRwu", "text": "$1: 2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{array}{ll} & \\text { Power factor }=\\frac{\\mathrm{R}}{\\sqrt{\\mathrm{R}^2+\\mathrm{X}_{\\mathrm{L}}^2}} \\\\ & \\text { Given: } \\mathrm{X}_{\\mathrm{L}}=\\mathrm{R} \\\\ \\therefore \\quad & \\mathrm{P}_1=\\frac{\\mathrm{R}}{\\sqrt{2 \\mathrm{R}^2}}=\\frac{1}{\\sqrt{2}}\\end{array}$\nWhen $\\mathrm{C}$ is connected, the circuit becomes a series LCR circuit.\n$\\begin{array}{ll}\n\\therefore & \\text { Power factor }=\\frac{\\mathrm{R}}{\\sqrt{\\mathrm{R}^2+\\left(\\mathrm{X}_{\\mathrm{L}}-\\mathrm{X}_{\\mathrm{C}}\\right)^2}} \\\\\n& \\text { Given: } \\mathrm{X}_{\\mathrm{C}}=\\mathrm{X}_{\\mathrm{L}} \\\\\n\\therefore & \\mathrm{P}_2=\\frac{\\mathrm{R}}{\\sqrt{\\mathrm{R}^2}}=1 \\\\\n\\therefore & \\mathrm{P}_1: \\mathrm{P}_2=1: \\sqrt{2}\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261cf0279619d9d8a2f86", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "In the circuit shown the ratio of quality factor and the bandwidth is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/mE827hpmB3Ve6gvxhZx2l38__xgE9aFMg1_F8dpZKJc.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "fPIUz", "text": "$10 \\mathrm{~s}$", "image": null, "isCorrect": true}, {"id": "Msun5", "text": "$8 \\mathrm{~s}$", "image": null, "isCorrect": false}, {"id": "iIMwk", "text": "$6 \\mathrm{~s}$", "image": null, "isCorrect": false}, {"id": "1gTG0", "text": "$4 \\mathrm{~s}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\text { Bandwidth }=2 \\Delta \\omega=\\frac{\\mathrm{R}}{\\mathrm{L}} \\\\ & \\text { Q factor }=\\frac{1}{\\mathrm{R}} \\sqrt{\\frac{\\mathrm{L}}{\\mathrm{C}}} \\\\ & \\frac{\\mathrm{Q} \\text { factor }}{\\text { Band width }}=\\frac{\\frac{1}{\\mathrm{R}} \\sqrt{\\frac{\\mathrm{L}}{\\mathrm{C}}}}{\\frac{\\mathrm{R}}{\\mathrm{L}}}=\\frac{1}{\\mathrm{R}^2} \\frac{\\mathrm{L}^{3 / 2}}{\\sqrt{\\mathrm{C}}} \\\\ & \\frac{\\mathrm{Q}_{\\text {pacs; }}}{\\text { Bandwidth }}=\\frac{3 \\sqrt{3}}{100 \\sqrt{27 \\times 10^{-6}}}=\\frac{3 \\sqrt{3}}{100 \\times 3 \\sqrt{3} \\times 10^{-3}}=10 \\mathrm{~s}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e990279619d9d8a15c0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "If the power factor in a circuit is unity, then the impedance of the circuit is", "image": null}, "options": [{"id": "4GsTs", "text": "inductive", "image": null, "isCorrect": false}, {"id": "Fsa7P", "text": "capacitive", "image": null, "isCorrect": false}, {"id": "dl1Ca", "text": "partially inductive and partially capacitive", "image": null, "isCorrect": false}, {"id": "2SNdB", "text": "resistive", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "When the power factor is unity, then the impedance of the circuit is resistive.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e970279619d9d8a15b0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "The $Q$ -factor of a resonant circuit is equal to", "image": null}, "options": [{"id": "syacT", "text": "$\\frac{1}{L} \\sqrt{\\frac{R}{C}}$", "image": null, "isCorrect": false}, {"id": "wlfqx", "text": "$\\frac{1}{R} \\sqrt{\\frac{L}{C}}$", "image": null, "isCorrect": true}, {"id": "x7IZ4", "text": "$\\frac{1}{R L} \\sqrt{C}$", "image": null, "isCorrect": false}, {"id": "2ybHl", "text": "$\\frac{1}{C} \\sqrt{\\frac{R}{L}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The quality factor (Q-factor) of a resonant circuit\n$$\nQ=\\frac{\\omega_{0} L}{R}\n$$\nAt resonance, $\\omega_{0}=\\frac{1}{\\sqrt{L C}}$\n$$\nQ=\\frac{1}{\\sqrt{L} C} \\cdot \\frac{L}{R}=\\frac{1}{R} \\sqrt{\\frac{L}{C}}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "65a263290279619d9d8a3c86", "title": "Transformers", "totalQuestions": 42, "questions": [{"_id": "6abb883f15a9fc0fc8c141e1", "type": "singleCorrect", "question": {"text": "A transformer having an efficiency 80% is working on $200 \\text{ V}$ and $4 \\text{ kW}$ power supply. If the current in the secondary coil is $5 \\text{ A}$, the voltage across the secondary coil and the current in the primary coil, respectively, are", "image": null}, "options": [{"id": "804z6", "label": "A", "text": "$10 \\text{ A}, 600 \\text{ V}$", "isCorrect": false, "image": null}, {"id": "GxhZk", "label": "B", "text": "$20 \\text{ A}, 640 \\text{ V}$", "isCorrect": true, "image": null}, {"id": "RHyzN", "label": "C", "text": "$25 \\text{ A}, 680 \\text{ V}$", "isCorrect": false, "image": null}, {"id": "P0bf7", "label": "D", "text": "$40 \\text{ A}, 700 \\text{ V}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given input power $P_p = 4 \\text{ kW} = 4000 \\text{ W}$ and primary voltage $V_p = 200 \\text{ V}$.<br><br>The current in the primary coil is $I_p = \\dfrac{P_p}{V_p} = \\dfrac{4000}{200} = 20 \\text{ A}$.<br><br>The efficiency of the transformer is $\\eta = \\dfrac{P_s}{P_p} = \\dfrac{V_s I_s}{P_p}$.<br><br>Substituting the given values, $0.8 = \\dfrac{V_s \\times 5}{4000}$.<br><br>$V_s = \\dfrac{0.8 \\times 4000}{5} = \\dfrac{3200}{5} = 640 \\text{ V}$.<br><br>The current in the primary coil is $20 \\text{ A}$ and the voltage across the secondary coil is $640 \\text{ V}$.<br><br>Answer: $20 \\text{ A}, 640 \\text{ V}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88ac15a9fc0fc8c145ec", "type": "singleCorrect", "question": {"text": "If a transformer of an amplifier has output impedance $8000\\ \\Omega$ and the speaker has input impedance of $8\\ \\Omega$, the primary and secondary turns of this transformer connected between the output of amplifier and to loudspeaker should have the ratio", "image": null}, "options": [{"id": "cuUGD", "label": "A", "text": "$1000:1$", "isCorrect": false, "image": null}, {"id": "NbVIl", "label": "B", "text": "$100:1$", "isCorrect": false, "image": null}, {"id": "RiNtt", "label": "C", "text": "$1:32$", "isCorrect": false, "image": null}, {"id": "BfbB4", "label": "D", "text": "$32:1$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For a transformer used for impedance matching, the relationship between the primary impedance $Z_p$, secondary impedance $Z_s$, primary turns $N_p$, and secondary turns $N_s$ is given by:<br><br>$\\dfrac{Z_p}{Z_s} = \\left(\\dfrac{N_p}{N_s}\\right)^2$<br><br>Given:<br>$Z_p = 8000\\ \\Omega$<br>$Z_s = 8\\ \\Omega$<br><br>Substituting the values into the formula:<br><br>$\\left(\\dfrac{N_p}{N_s}\\right)^2 = \\dfrac{8000}{8} = 1000$<br><br>$\\dfrac{N_p}{N_s} = \\sqrt{1000} \\approx 31.62$<br><br>The closest integer ratio among the given options is $32:1$.<br><br>Answer: $32:1$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886d15a9fc0fc8c14398", "type": "singleCorrect", "question": {"text": "A current of $5$ A is flowing at $220$ V in the primary coil of a transformer. If the voltage produced in the secondary coil is $2200$ V and $50\\%$ of power is lost, then the current in secondary will be", "image": null}, "options": [{"id": "sAxOJ", "label": "A", "text": "$2.5$ A", "isCorrect": false, "image": null}, {"id": "qa8BD", "label": "B", "text": "$5$ A", "isCorrect": false, "image": null}, {"id": "4JTJu", "label": "C", "text": "$0.25$ A", "isCorrect": true, "image": null}, {"id": "8hgLM", "label": "D", "text": "$0.5$ A", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Input power in the primary coil is given by $P_p = V_p I_p$<br><br>Substituting the given values, $P_p = 220 \\times 5 = 1100$ W<br><br>Since $50\\%$ of the power is lost, the power available across the secondary coil is $50\\%$ of the input power.<br><br>Output power $P_s = 0.5 \\times 1100 = 550$ W<br><br>The output power is also given by $P_s = V_s I_s$<br><br>Substituting the known values, $550 = 2200 \\times I_s$<br><br>$I_s = \\dfrac{550}{2200} = 0.25$ A<br><br>Answer: $0.25$ A", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888f15a9fc0fc8c144d8", "type": "singleCorrect", "question": {"text": "A step down transformer has $50$ turns on secondary and $1000$ turns on primary winding. If a transformer is connected to $220$ V and $1$ A a.c. source, what is the output current of the transformer?", "image": null}, "options": [{"id": "4bUWs", "label": "A", "text": "$\\dfrac{1}{20}$ A", "isCorrect": false, "image": null}, {"id": "iyg9R", "label": "B", "text": "$20$ A", "isCorrect": true, "image": null}, {"id": "xGONq", "label": "C", "text": "$100$ A", "isCorrect": false, "image": null}, {"id": "vzTAW", "label": "D", "text": "$2$ A", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For an ideal transformer, the relation between primary and secondary currents and the number of turns is given by:<br><br>$\\dfrac{I_s}{I_p} = \\dfrac{N_p}{N_s}$<br><br>Substituting the given values:<br><br>$I_s = I_p \\times \\dfrac{N_p}{N_s}$<br><br>$I_s = 1 \\times \\dfrac{1000}{50}$<br><br>$I_s = 20$ A<br><br>Answer: $20$ A", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885e15a9fc0fc8c1430b", "type": "singleCorrect", "question": {"text": "A transformer having efficiency $90\\%$ is working on $200$ V and $3$ KW power supply. If the current in the secondary coil is $6$A, the voltage across the secondary coil and the current in the primary coil, respectively, are", "image": null}, "options": [{"id": "pYfc9", "label": "A", "text": "$300$ V, $15$ A", "isCorrect": false, "image": null}, {"id": "4wVwc", "label": "B", "text": "$450$ V, $15$ A", "isCorrect": true, "image": null}, {"id": "AE3Tx", "label": "C", "text": "$450$ V, $13.5$ A", "isCorrect": false, "image": null}, {"id": "7l64D", "label": "D", "text": "$600$ V, $15$ A", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Input power $P_{in} = V_p I_p$<br><br>$3000 = 200 \\times I_p$<br><br>$I_p = 15$ A<br><br>Efficiency $\\eta = \\dfrac{P_{out}}{P_{in}}$<br><br>$0.9 = \\dfrac{V_s I_s}{3000}$<br><br>$V_s \\times 6 = 2700$<br><br>$V_s = 450$ V<br><br>The voltage across the secondary coil is $450$ V and the current in the primary coil is $15$ A.<br><br>Answer: $450$ V, $15$ A", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a68c30a4553e1bdb52", "type": "singleCorrect", "question": {"text": "A current of 4 A is flowing at 230 V in the primary coil of a transformer. If the voltage produced in the secondary coil is 2300 V and 40 % of power is lost, then the current in the secondary will be", "image": null}, "options": [{"id": "JlEmQ", "label": "A", "text": "$0.24$ A", "isCorrect": true, "image": null}, {"id": "akblJ", "label": "B", "text": "$0.2$ A", "isCorrect": false, "image": null}, {"id": "SKtA5", "label": "C", "text": "$0.12$ A", "isCorrect": false, "image": null}, {"id": "TJJIF", "label": "D", "text": "$0.4$ A", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Power in primary coil, $P_p = V_p I_p$<br><br>$P_p = 230 \\times 4 = 920$ W<br><br>Since $40\\%$ of power is lost, the efficiency of the transformer is $\\eta = 60\\%$.<br><br>Power in secondary coil, $P_s = \\eta P_p$<br><br>$P_s = 0.60 \\times 920 = 552$ W<br><br>Using $P_s = V_s I_s$<br><br>$552 = 2300 \\times I_s$<br><br>$I_s = \\dfrac{552}{2300} = 0.24$ A<br><br>Answer: $0.24$ A", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c38c30a4553e1bdc87", "type": "singleCorrect", "question": {"text": "A transformer has 120 turns in the primary coil and carries 5A current. Input power is one kilowatt. To have 560 V output, the number of turns in secondary coil will be", "image": null}, "options": [{"id": "eJWU2", "label": "A", "text": "$168$", "isCorrect": false, "image": null}, {"id": "0YjAK", "label": "B", "text": "$200$", "isCorrect": false, "image": null}, {"id": "vO6Ji", "label": "C", "text": "$336$", "isCorrect": true, "image": null}, {"id": "frGoO", "label": "D", "text": "$400$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Input power is given by $P_{in} = V_p I_p$<br><br>$1000 = V_p \\times 5$<br><br>$V_p = 200$ V<br><br>Using the transformer ratio formula:<br><br>$\\dfrac{V_s}{V_p} = \\dfrac{N_s}{N_p}$<br><br>$\\dfrac{560}{200} = \\dfrac{N_s}{120}$<br><br>$N_s = \\dfrac{560 \\times 120}{200}$<br><br>$N_s = 336$<br><br>Answer: $336$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d08c30a4553e1bdd19", "type": "singleCorrect", "question": {"text": "Alternating current of peak value $\\left(\\dfrac{2}{\\pi}\\right)$ A flows through the primary coil of a transformer. The coefficient of mutual inductance between primary and secondary coils is 1H. The peak value of induced e.m.f. in the secondary coil is<br>(Frequency of a.c. = 50 Hz)", "image": null}, "options": [{"id": "lbysQ", "label": "A", "text": "$100\\text{V}$", "isCorrect": false, "image": null}, {"id": "s4O43", "label": "B", "text": "$300\\text{V}$", "isCorrect": false, "image": null}, {"id": "NCrlL", "label": "C", "text": "$200\\text{V}$", "isCorrect": true, "image": null}, {"id": "xS0xu", "label": "D", "text": "$400\\text{V}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The current in the primary coil is $I = I_0 \\sin(\\omega t)$.<br><br>The induced e.m.f. in the secondary coil is given by $e = -M \\dfrac{dI}{dt}$.<br><br>$e = -M \\dfrac{d}{dt} (I_0 \\sin(\\omega t)) = -M I_0 \\omega \\cos(\\omega t)$<br><br>The peak value of the induced e.m.f. is $e_0 = M I_0 \\omega$.<br><br>Given $M = 1$ H, $I_0 = \\dfrac{2}{\\pi}$ A, and $f = 50$ Hz.<br><br>The angular frequency is $\\omega = 2\\pi f = 2\\pi \\times 50 = 100\\pi$ rad/s.<br><br>Substituting the values, we get:<br><br>$e_0 = 1 \\times \\left(\\dfrac{2}{\\pi}\\right) \\times 100\\pi = 200$ V.<br><br>Answer: $200\\text{V}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3308c30a4553e1be123", "type": "singleCorrect", "question": {"text": "A step down transformer has turns ratio 20:1. If 8V are applied across $0.4\\ \\Omega$ secondary then the primary current will be", "image": null}, "options": [{"id": "z3THF", "label": "A", "text": "$0.5$ A", "isCorrect": false, "image": null}, {"id": "XJ68v", "label": "B", "text": "$1$ A", "isCorrect": true, "image": null}, {"id": "8ICUL", "label": "C", "text": "$2$ A", "isCorrect": false, "image": null}, {"id": "Lvwsq", "label": "D", "text": "$4$ A", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given turns ratio $\\dfrac{N_p}{N_s} = 20$<br><br>Secondary voltage $V_s = 8$ V<br><br>Secondary resistance $R_s = 0.4\\ \\Omega$<br><br>Secondary current $I_s = \\dfrac{V_s}{R_s} = \\dfrac{8}{0.4} = 20$ A<br><br>For an ideal transformer, $\\dfrac{I_p}{I_s} = \\dfrac{N_s}{N_p}$<br><br>$I_p = I_s \\times \\dfrac{N_s}{N_p} = 20 \\times \\dfrac{1}{20} = 1$ A<br><br>Answer: $1$ A", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d35b8c30a4553e1be2e3", "type": "singleCorrect", "question": {"text": "An ideal transformer converts $220$V a.c. to $3.3$ KV a.c. to transmit a power of $4.4$ KW. If primary coil has $600$ turns then alternating current in the secondary coil is", "image": null}, "options": [{"id": "PQPzZ", "label": "A", "text": "$\\dfrac{4}{3}$ A", "isCorrect": true, "image": null}, {"id": "lYTr8", "label": "B", "text": "$\\dfrac{3}{4}$ A", "isCorrect": false, "image": null}, {"id": "Uryc7", "label": "C", "text": "$\\dfrac{1}{3}$ A", "isCorrect": false, "image": null}, {"id": "bkXBa", "label": "D", "text": "$\\dfrac{2}{3}$ A", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For an ideal transformer, the input power is equal to the output power.<br><br>$P_{out} = P_{in} = 4.4 \\text{ kW} = 4400 \\text{ W}$<br><br>The output power is given by $P_{out} = V_s I_s$<br><br>$4400 = 3300 \\times I_s$<br><br>$I_s = \\dfrac{4400}{3300} = \\dfrac{4}{3} \\text{ A}$<br><br>Answer: $\\dfrac{4}{3}$ A", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d35b8c30a4553e1be2e2", "type": "singleCorrect", "question": {"text": "Alternating current of peak value $\\left(\\dfrac{2}{\\pi}\\right)$ A flows through the primary coil of a transformer. The coefficient of mutual inductance between primary and secondary coils is $1$ H. The peak em.f. induced in secondary coil is (Frequency of a. c. is $50$ Hz)", "image": null}, "options": [{"id": "K9lXP", "label": "A", "text": "$25$ V", "isCorrect": false, "image": null}, {"id": "A6Pnw", "label": "B", "text": "$50$ V", "isCorrect": false, "image": null}, {"id": "1kxQ2", "label": "C", "text": "$100$ V", "isCorrect": false, "image": null}, {"id": "H7kmu", "label": "D", "text": "$200$ V", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The alternating current in the primary coil is given by $I_p = I_0 \\sin(\\omega t)$, where $I_0$ is the peak current and $\\omega = 2\\pi f$.<br><br>The induced e.m.f. in the secondary coil is given by Faraday's law of induction:<br><br>$e_s = -M \\dfrac{dI_p}{dt}$<br><br>$e_s = -M \\dfrac{d}{dt} (I_0 \\sin(\\omega t))$<br><br>$e_s = -M I_0 \\omega \\cos(\\omega t)$<br><br>The peak e.m.f. induced in the secondary coil is the maximum value of $e_s$, which is:<br><br>$E_0 = M I_0 \\omega$<br><br>Given values are:<br><br>$M = 1$ H<br><br>$I_0 = \\dfrac{2}{\\pi}$ A<br><br>$f = 50$ Hz $\\Rightarrow \\omega = 2\\pi \\times 50 = 100\\pi$ rad/s<br><br>Substituting these values into the equation for peak e.m.f.:<br><br>$E_0 = 1 \\times \\left(\\dfrac{2}{\\pi}\\right) \\times 100\\pi$<br><br>$E_0 = 200$ V<br><br>Answer: $200$ V", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bebbf9280d7f9932d9c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "An 80 W lamp is connected to the secondary of a step-down transformer, where primary is connected to ac mains of 220 V . Assuming the transformer to be ideal, the current in the primary winding is nearly", "image": null}, "options": [{"id": "cT6JD", "text": "0.36 A", "image": null, "isCorrect": true}, {"id": "qjR0t", "text": "3.6 A", "image": null, "isCorrect": false}, {"id": "VXVlO", "text": "2.8 A", "image": null, "isCorrect": false}, {"id": "pUpkj", "text": "0.28 A", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For an ideal transformer, the input power is equal to the output power.<br><br>$P_p = P_s$<br><br>$V_p I_p = P_s$<br><br>Substituting $P_s = 80$ W and $V_p = 220$ V:<br><br>$220 I_p = 80$<br><br>$I_p = \\dfrac{80}{220} = \\dfrac{4}{11} \\approx 0.36$ A<br><br>Answer: 0.36 A", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b87bf9280d7f9932a0f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A current of 5 A is flowing at 220 V in a primary coil of a transformer. If the voltage produced in the secondary coil is 2200 V and $50 \\%$ of power is lost, then the current in the secondary coil will be", "image": null}, "options": [{"id": "1Ya8r", "text": "2.5 A", "image": null, "isCorrect": false}, {"id": "26YsG", "text": "5 A", "image": null, "isCorrect": false}, {"id": "jGxOD", "text": "0.25 A", "image": null, "isCorrect": true}, {"id": "j7j5j", "text": "0.025 A", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Input power in the primary coil is given by $P_p = V_p I_p$<br><br>Substituting the given values:<br><br>$P_p = 220 \\times 5 = 1100$ W<br><br>Since $50\\%$ of power is lost, the efficiency of the transformer is $\\eta = 50\\% = 0.5$<br><br>Output power in the secondary coil is $P_s = \\eta P_p$<br><br>$P_s = 0.5 \\times 1100 = 550$ W<br><br>The output power is also given by $P_s = V_s I_s$<br><br>$550 = 2200 \\times I_s$<br><br>$I_s = \\dfrac{550}{2200} = 0.25$ A<br><br>Answer: 0.25 A", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b35bf9280d7f9932721", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "An ideal transformer converts 220 a.c. to 3.3 kV a.c. to transmit a power of 4.4 kW . If primary coil has 600 turns then alternating current in secondary coil is", "image": null}, "options": [{"id": "OeEJJ", "text": "$\\frac{5}{3} \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "yIHGj", "text": "$\\frac{1}{4} \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "G5n2X", "text": "$\\frac{4}{3} \\mathrm{~A}$", "image": null, "isCorrect": true}, {"id": "QTHPy", "text": "$\\frac{2}{3} \\mathrm{~A}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For an ideal transformer, the output power is equal to the input power.<br><br>Given:<br>Output power, $P = 4.4 \\text{ kW} = 4400 \\text{ W}$<br>Secondary voltage, $V_s = 3.3 \\text{ kV} = 3300 \\text{ V}$<br><br>The power transmitted by the secondary coil is given by:<br>$P = V_s I_s$<br><br>Substituting the given values:<br>$4400 = 3300 \\times I_s$<br><br>$I_s = \\dfrac{4400}{3300} = \\dfrac{4}{3} \\text{ A}$<br><br>Answer: $\\frac{4}{3} \\mathrm{~A}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214430aee93fa0796df44", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "If a transformer of an audio amplifier has output impedance $8000 \\Omega$ and the speaker has input impedance $8 \\Omega$, the primary and secondary turns of this transformer connected between the output of amplifier and to loudspeaker should have the ratio", "image": null}, "options": [{"id": "7nkvV", "text": "$1000: 1$", "image": null, "isCorrect": false}, {"id": "aHNRd", "text": "$100: 1$", "image": null, "isCorrect": false}, {"id": "P5i4o", "text": "$1: 32$", "image": null, "isCorrect": false}, {"id": "GVUNB", "text": "$32: 1$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For impedance matching in a transformer, the relationship between the primary impedance $Z_p$, secondary impedance $Z_s$, primary turns $N_p$, and secondary turns $N_s$ is given by:<br><br>$\\dfrac{Z_p}{Z_s} = \\left(\\dfrac{N_p}{N_s}\\right)^2$<br><br>Given $Z_p = 8000 \\Omega$ and $Z_s = 8 \\Omega$:<br><br>$\\left(\\dfrac{N_p}{N_s}\\right)^2 = \\dfrac{8000}{8} = 1000$<br><br>$\\dfrac{N_p}{N_s} = \\sqrt{1000} \\approx 31.62$<br><br>The closest integer ratio given in the options is $32:1$.<br><br>Answer: $32: 1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214190aee93fa0796ddf4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "The core used in transformers are laminated to", "image": null}, "options": [{"id": "30TAb", "text": "increase the magnetic field.", "image": null, "isCorrect": false}, {"id": "f2upt", "text": "increase the level of the magnetic saturation of the core.", "image": null, "isCorrect": false}, {"id": "SdRW8", "text": "reduce the residual magnetism in the core.", "image": null, "isCorrect": false}, {"id": "m4hMv", "text": "reduce eddy current losses in the core.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The core of a transformer is laminated to minimize eddy current losses. When the magnetic flux linked with the core changes, it induces eddy currents within the core material. These currents cause energy loss in the form of heat. By using a laminated core consisting of thin sheets insulated from each other, the resistance of the path for eddy currents is significantly increased, which reduces the magnitude of the eddy currents and thereby minimizes the power loss.<br><br>Answer: reduce eddy current losses in the core.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213f40aee93fa0796dcd7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "The number of turns in the primary of a transformer are 1000 and in secondary 3000 . If 80 V a.c. is applied to the primary, the potential difference per turn of the secondary coil is", "image": null}, "options": [{"id": "NWOzt", "text": "0.02 V", "image": null, "isCorrect": false}, {"id": "gEVqd", "text": "0.04 V", "image": null, "isCorrect": false}, {"id": "GGhqe", "text": "0.08 V", "image": null, "isCorrect": true}, {"id": "ws9wc", "text": "0.16 V", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $N_p = 1000$, $N_s = 3000$, and $V_p = 80$ V.<br><br>For an ideal transformer, the potential difference per turn is the same for both the primary and secondary coils.<br><br>$\\dfrac{V_s}{N_s} = \\dfrac{V_p}{N_p}$<br><br>Substituting the given values:<br><br>$\\dfrac{V_s}{N_s} = \\dfrac{80}{1000}$<br><br>$\\dfrac{V_s}{N_s} = 0.08$ V<br><br>Answer: 0.08 V", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213cd0aee93fa0796db9f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "A transformer has 120 turns in the primary coil and carries 5 A current. Input power is one kilowatt. To have 560 V output, the number of turns in secondary coil will be", "image": null}, "options": [{"id": "GHz1F", "text": "168", "image": null, "isCorrect": false}, {"id": "N9Um2", "text": "200", "image": null, "isCorrect": false}, {"id": "qwsro", "text": "336", "image": null, "isCorrect": true}, {"id": "CTMFa", "text": "400", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Input power is given by $P_{in} = V_p I_p$<br><br>$1000 = V_p \\times 5$<br><br>$V_p = 200$ V<br><br>Using the transformer ratio formula:<br><br>$\\dfrac{V_s}{V_p} = \\dfrac{N_s}{N_p}$<br><br>$\\dfrac{560}{200} = \\dfrac{N_s}{120}$<br><br>$N_s = \\dfrac{560 \\times 120}{200}$<br><br>$N_s = 336$<br><br>Answer: 336", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792135a0aee93fa0796d822", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "A transformer is used to set up an alternating e.m.f. of 220 V to 4.4 kV to transmit 6.6 kW of power. The primary coil has 1000 turns. The current rating of the secondary coil is (Transformer is ideal)", "image": null}, "options": [{"id": "HyWEE", "text": "0.8 A", "image": null, "isCorrect": false}, {"id": "JZOXJ", "text": "1.2 A", "image": null, "isCorrect": false}, {"id": "j54qs", "text": "1.5 A", "image": null, "isCorrect": true}, {"id": "3SYCy", "text": "1.8 A", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given:<br>Power transmitted, $P = 6.6 \\text{ kW} = 6600 \\text{ W}$<br>Secondary voltage, $V_s = 4.4 \\text{ kV} = 4400 \\text{ V}$<br><br>For an ideal transformer, the power in the secondary coil is equal to the total power transmitted.<br><br>$P = V_s I_s$<br><br>$6600 = 4400 \\times I_s$<br><br>$I_s = \\dfrac{6600}{4400} = 1.5 \\text{ A}$<br><br>Answer: 1.5 A", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792134a0aee93fa0796d79e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "A transformer having efficiency $90 \\%$ is working on 200 V and 3 kw power supply. If the current in the secondary coil is 6 A , the voltage across the secondary coil and the current in the primary coil are respectively", "image": null}, "options": [{"id": "03faw", "text": "$300 \\mathrm{~V}, 15 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "G9cs9", "text": "$450 \\mathrm{~V}, 15 \\mathrm{~A}$", "image": null, "isCorrect": true}, {"id": "BMj2p", "text": "$450 \\mathrm{~V}, 13 \\cdot 5 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "fXfYg", "text": "$600 \\mathrm{~V}, 15 \\mathrm{~A}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Input power $P_{in} = 3000$ W<br><br>Primary voltage $V_p = 200$ V<br><br>Using $P_{in} = V_p I_p$:<br><br>$3000 = 200 \\times I_p \\Rightarrow I_p = 15$ A<br><br>Efficiency $\\eta = \\dfrac{P_{out}}{P_{in}} = 0.9$<br><br>Output power $P_{out} = 0.9 \\times 3000 = 2700$ W<br><br>Using $P_{out} = V_s I_s$ with $I_s = 6$ A:<br><br>$2700 = V_s \\times 6 \\Rightarrow V_s = 450$ V<br><br>The voltage across the secondary coil is $450$ V and the current in the primary coil is $15$ A.<br><br>Answer: $450 \\mathrm{~V}, 15 \\mathrm{~A}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213370aee93fa0796d70e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "The core used in transformer and other electromagnetic devices is laminated to", "image": null}, "options": [{"id": "JooZm", "text": "increase the magnetic field.", "image": null, "isCorrect": false}, {"id": "nF1J3", "text": "increase the level of magnetic saturation of the core.", "image": null, "isCorrect": false}, {"id": "dF3nA", "text": "reduce the residual magnetism in the core.", "image": null, "isCorrect": false}, {"id": "OBBPo", "text": "reduce eddy current.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The core of a transformer and other electromagnetic devices is laminated to reduce eddy current losses. Lamination involves using thin sheets of magnetic material separated by an insulating layer. This structure significantly increases the electrical resistance in the path of the induced eddy currents, thereby decreasing their magnitude and minimizing the energy dissipated as heat.<br><br>Answer: reduce eddy current.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262690279619d9d8a344e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "The alternating e.m.f. induced in the secondary coil of a transformer is mainly due to", "image": null}, "options": [{"id": "gkTYs", "text": "varying electric field", "image": null, "isCorrect": false}, {"id": "aorjy", "text": "varying magnetic field", "image": null, "isCorrect": true}, {"id": "Ble5J", "text": "the iron core", "image": null, "isCorrect": false}, {"id": "h4WEP", "text": "heat produced in the coil", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The secondary coil experiences an emf as a result of the changing magnetic field. Therefore, a changing magnetic field is primarily responsible for the transformer voltage that is induced in a transformer's secondary coil.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262520279619d9d8a3395", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "The numbers of turns in the primary and the secondary of a transformer are 1000 and 3000 respectively. If $80 \\mathrm{~V}$ a.c. is applied to the primary coil of the transformer, then the potential difference per turn of the secondary coil would be", "image": null}, "options": [{"id": "KGVry", "text": "$240 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "ejtOL", "text": "$2400 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "Xpaol", "text": "$0.24 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "uI43I", "text": "$0.08 \\mathrm{~V}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\frac{E_p}{E_s}=\\frac{N_p}{N_s}$\n$\\frac{80}{E_{\\mathrm{s}}}=\\frac{1000}{3000}$\n$E_s=240 \\mathrm{~V}$\n$\\therefore \\quad E_{\\mathrm{s}}$ per turn $=\\frac{240}{3000}=0.08 \\mathrm{~V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262420279619d9d8a3319", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "A transformer has 20 turns in the primary and 100 turns in the secondary coil. An ac voltage of $\\mathrm{V}_{\\text {in }}=600 \\sin 314 \\mathrm{t}$ is applied to primary terminal of transformer. Then maximum value of secondary output voltage obtained in volt is", "image": null}, "options": [{"id": "3UN43", "text": "600", "image": null, "isCorrect": false}, {"id": "RklPs", "text": "300", "image": null, "isCorrect": false}, {"id": "NyzZn", "text": "3000", "image": null, "isCorrect": true}, {"id": "vyYhS", "text": "6000", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We know,\n$$\n\\frac{V_s}{V_p}=\\frac{N_s}{N_p}\n$$\n$\\therefore \\quad$ The maximum value of secondary output voltage is:\n$$\n\\begin{aligned}\nV_s & =\\frac{N_s}{N_p} \\times V_p=\\frac{100}{20} \\times 600 \\\\\nV_s & =3000 V\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261960279619d9d8a2dc3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "A transformer having efficiency of $90 \\%$ is working on $200 \\mathrm{~V}$ and $3 \\mathrm{~kW}$ power supply. If the current is the secondary coil is $6 \\mathrm{~A}$, the voltage across the secondary coil and the current in the primary coil respectively are", "image": null}, "options": [{"id": "PFlr9", "text": "450 V , 12 A", "image": null, "isCorrect": false}, {"id": "CbsZj", "text": "600 V , 15 A", "image": null, "isCorrect": false}, {"id": "YPZfJ", "text": "300 V , 15 V", "image": null, "isCorrect": false}, {"id": "n1Rbk", "text": "450 V , 15 A", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Primary current, $I_{\\mathrm{P}}=\\frac{P}{V}=\\frac{3000}{200}=15 \\mathrm{~A}$\nOutput power $=90 \\%$ of $3000 \\mathrm{~W}=2700 \\mathrm{~W}$\nTherefore, voltage across the secondary coil, $V_{\\mathrm{s}}=\\frac{2700}{6}=450 \\mathrm{~V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261710279619d9d8a2c9a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "The primary and secondary voltage of an ideal step-down transformer is $200 \\mathrm{~V}$ and $25 \\mathrm{~V}$ respectively. The secondary is connected to a device, which draws a current of $2 \\mathrm{~A}$. The current in the primary is", "image": null}, "options": [{"id": "WiIAd", "text": "$25 \\mathrm{~mA}$", "image": null, "isCorrect": false}, {"id": "cgRY1", "text": "$42 \\mathrm{~mA}$", "image": null, "isCorrect": false}, {"id": "uvEmV", "text": "$160 \\mathrm{~mA}$", "image": null, "isCorrect": false}, {"id": "XMskZ", "text": "$250 \\mathrm{~mA}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For a lossless transformer, with primary coil $\\left(I_P, V_P\\right)$ and secondary coil $\\left(I_S, V_S\\right)$, there has to be conservation of energy per unit time:\n$\\begin{aligned} & I_P V_P=I_S V_S \\\\ & \\Rightarrow \\frac{I_P}{I_S}=\\frac{V_S}{V_P} \\\\ & \\therefore \\frac{I_P}{2}=\\frac{25}{500} \\\\ & \\therefore I_P=\\frac{1}{4} \\mathrm{~A}=250 \\mathrm{~mA}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2615f0279619d9d8a2c07", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "A transformer works on the principle of", "image": null}, "options": [{"id": "0WrV3", "text": "magnetic effect of electric current", "image": null, "isCorrect": false}, {"id": "Wwuci", "text": "self-induction", "image": null, "isCorrect": false}, {"id": "anyHT", "text": "heat transfer", "image": null, "isCorrect": false}, {"id": "YJfG9", "text": "mutual induction", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Concept based. Transformer has two coils which have coupled flux. And the flux coupling is \"mutual\".", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2614f0279619d9d8a2b85", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "A current of $5 \\mathrm{~A}$ is flowing at $220 \\mathrm{~V}$ in the primary coil of transformer. If the voltage produced in the secondary coil is $2200 \\mathrm{~V}$ and $50 \\%$ of power is lost, then the current in secondary will be", "image": null}, "options": [{"id": "zwA43", "text": "2.5 A", "image": null, "isCorrect": false}, {"id": "yipOc", "text": "0.5 A", "image": null, "isCorrect": false}, {"id": "TkWtU", "text": "0.25 A", "image": null, "isCorrect": true}, {"id": "ExreA", "text": "5 A", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $I$ be the current flowing through secondary coil.\nCurrent on primary (input) coil $i=5 \\mathrm{~A}$\nVoltage in primary coil $V=220 \\mathrm{~V}$\nVoltage in secondary coil $V^{\\prime}=2200 \\mathrm{~V}$\nConsidering only $50 \\%$ power is transmitted:\n$\\begin{aligned}\n& 0.5(\\mathrm{Vi})=V^{\\prime} I \\\\\n& \\therefore 0.5 \\times 220 \\times 5=2200 \\times I \\\\\n& \\Rightarrow I=0.25 \\mathrm{~A}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261150279619d9d8a29ac", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}], "question": {"text": "A step-down transformer has $N_{\\mathrm{S}}$ to $N_{\\mathrm{p}}$ ratio of $20: 1$. If $8 \\mathrm{~V}$ are developed across $0.4 \\Omega$ secondary, the primary current will be", "image": null}, "options": [{"id": "uIMJj", "text": "$1 \\mathrm{~A}$", "image": null, "isCorrect": true}, {"id": "NnMAA", "text": "$0.5 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "wzsie", "text": "$4 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "SALBz", "text": "$2 \\mathrm{~A}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a step-down transformer:\n$\\frac{N_{\\mathrm{P}}}{N_{\\mathrm{S}}}=\\frac{20}{1}=\\frac{V_p}{V_{\\mathrm{s}}}=\\frac{I_s}{I_p}$\n$\\begin{aligned} & \\therefore I_s=\\frac{8 \\mathrm{~V}}{0.4 \\mathrm{~A}}=20 \\mathrm{~A} \\\\ & \\Rightarrow I_p=I_s \\times \\frac{1}{20}=1 \\mathrm{~A}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261030279619d9d8a291d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "An ideal transformer is used to set up an alternating e.m.f. of $220 \\mathrm{~V}$ to $4.4 \\mathrm{kV}$ to transmit $6.6 \\mathrm{~kW}$ of power. The primary coil has 100 turns. What is current rating of secondary?", "image": null}, "options": [{"id": "jzbKk", "text": "$1.0 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "UdxEl", "text": "0.75 A", "image": null, "isCorrect": false}, {"id": "7cI6V", "text": "$2.5 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "gZQkN", "text": "$1.5 \\mathrm{~A}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & P_0=V_s i_s \\\\ & 6.6=4.4 \\times i_s \\Rightarrow i_s=1.5 \\mathrm{~A}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260900279619d9d8a2587", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "A step-up transformer operates on $220 \\mathrm{~V}$ and supplies current of $2 \\mathrm{~A}$. The ratio of primary and secondary windings is $1: 20$. The current in the primary is", "image": null}, "options": [{"id": "eUfeI", "text": "$5 A$", "image": null, "isCorrect": false}, {"id": "DjjA2", "text": "$2 A$", "image": null, "isCorrect": false}, {"id": "nzIJX", "text": "$40 A$", "image": null, "isCorrect": true}, {"id": "sMdw6", "text": "$20 A$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\frac{N_{\\mathrm{s}}}{N_p}=20=\\frac{I_p}{I_s} \\\\ & \\therefore I_p=20 I_S \\\\ & =20 \\times 2=40 \\mathrm{~A}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260820279619d9d8a2510", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "A step down transformer is used to reduce the main supply from ' $V_1$ ' volt to ' $V_2$ ' volt. The primary coil draws a current ' $I_1$ ' A and the secondary coil draws ' $I_2$ ' A. $\\left(I_1 < I_2\\right)$. The ratio of input power to output power is", "image": null}, "options": [{"id": "r549s", "text": "$\\frac{\\mathrm{V}_1 \\mathrm{~V}_2}{\\mathrm{I}_1 \\mathrm{I}_2}$", "image": null, "isCorrect": false}, {"id": "TmmVM", "text": "$\\frac{\\mathrm{I}_1 \\mathrm{~V}_1}{\\mathrm{I}_2 \\mathrm{~V}_2}$", "image": null, "isCorrect": true}, {"id": "yXmfw", "text": "$\\frac{\\mathrm{I}_1 \\mathrm{I}_2}{\\mathrm{~V}_1 \\mathrm{~V}_2}$", "image": null, "isCorrect": false}, {"id": "HchHx", "text": "$\\frac{\\mathrm{V}_1 \\mathrm{I}_2}{\\mathrm{~V}_2 \\mathrm{I}_1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\text { Input power }=\\mathrm{I}_1 \\mathrm{~V}_1 \\\\ & \\text { Output power }=\\mathrm{I}_2 \\mathrm{~V}_2\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260800279619d9d8a2502", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "A step-down transformer has turns ratio 20: 1 . If $8 \\mathrm{~V}$ is applied across 0.4 ohm secondary coil, then the primary current will", "image": null}, "options": [{"id": "UfeZi", "text": "2 A", "image": null, "isCorrect": false}, {"id": "jhbWs", "text": "1 A", "image": null, "isCorrect": true}, {"id": "olG00", "text": "0.5 A", "image": null, "isCorrect": false}, {"id": "Xzj0J", "text": "4 A", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{V}_{\\mathrm{s}}=8 \\mathrm{~V}, \\mathrm{R}_{\\mathrm{s}}=0.4 \\Omega \\\\ & \\mathrm{I}_{\\mathrm{s}}=\\frac{\\mathrm{V}_{\\mathrm{s}}}{\\mathrm{R}_{\\mathrm{s}}}=\\frac{8}{0.4}=20 \\mathrm{~A} \\\\ & \\frac{\\mathrm{I}_{\\mathrm{p}}}{\\mathrm{I}_{\\mathrm{s}}}=\\frac{\\mathrm{N}_{\\mathrm{s}}}{\\mathrm{N}_{\\mathrm{p}}}=\\frac{1}{20} \\\\ & \\therefore \\mathrm{I}_{\\mathrm{p}}=\\frac{\\mathrm{I}_{\\mathrm{s}}}{20}=\\frac{20}{20}=1 \\mathrm{~A}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2605b0279619d9d8a23d0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "In a step up transformer, which one of the following statements is correct?", "image": null}, "options": [{"id": "jl5AH", "text": "Number of turns in the secondary coil is less than in primary coil", "image": null, "isCorrect": false}, {"id": "XxOxe", "text": "Voltage in secondary coil is less than in primary coil", "image": null, "isCorrect": false}, {"id": "kiQks", "text": "Current in the primary coil is more than current in the secondary coil", "image": null, "isCorrect": true}, {"id": "YiWRz", "text": "Current in the primary coil is equal to current in the secondary coil", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In a step-up transformer, the current in the secondary is less than the current in the primary.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260220279619d9d8a2204", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "In an ideal step-down transformer, out of the following quantities, which quantity increases in the secondary coil?", "image": null}, "options": [{"id": "vuHe6", "text": "Power", "image": null, "isCorrect": false}, {"id": "klIql", "text": "Voltage", "image": null, "isCorrect": false}, {"id": "PCV42", "text": "Current", "image": null, "isCorrect": true}, {"id": "KEj5S", "text": "Frequency", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For an ideal transformer,\n$$\n\\frac{\\mathrm{V}_{\\mathrm{s}}}{\\mathrm{V}_{\\mathrm{p}}}=\\frac{\\mathrm{I}_{\\mathrm{p}}}{\\mathrm{I}_{\\mathrm{s}}}\n$$\nHence, if $\\mathrm{V}_{\\mathrm{s}} < \\mathrm{V}_{\\mathrm{p}}$ then $\\mathrm{I}_{\\mathrm{p}} < \\mathrm{I}_{\\mathrm{s}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fc50279619d9d8a1f1e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "A step-up transformer has 300 turns of primary winding and 450 turns of secondary winding. A primary is connected to 150 volt and the current flowing through it is $9 \\mathrm{~A}$. The current and voltage in the secondary are", "image": null}, "options": [{"id": "N7BkG", "text": "$13.5 \\mathrm{~A}, 225 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "5rpvD", "text": "$13.5 \\mathrm{~A}, \\quad 100 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "dUpqi", "text": "$4.5 \\mathrm{~A}, \\quad 100 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "if2PC", "text": "$6.0 \\mathrm{~A}, \\quad 225 \\mathrm{~V}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$6.0 A, 225 V$\nGiven that, number of turns in primary winding, $N_{p}=300$\nNumber of turns in secondary winding, $N_{S}=450$\nPrimary voltage, $\\mathrm{V}_{\\mathrm{p}}=150 \\mathrm{~V}$\nPrimary current, $I_{p}=9 \\mathrm{~A}$\nFor step-up transformer,\n$\\begin{array}{l}\n\\frac{V_{S}}{V_{P}}=\\frac{N_{S}}{N_{P}} \\\\\n\\frac{V_{S}}{150}=\\frac{450}{300} \\\\\n\\Rightarrow V_{S}=\\frac{450}{300} \\times 150 \\\\\n\\Rightarrow V_{S}=225 \\mathrm{~V}\n\\end{array}$\n$\\begin{array}{l}\n\\text { Again, } \\mathrm{V}_{\\mathrm{p}} \\mathrm{I}_{\\mathrm{p}}=\\mathrm{V}_{\\mathrm{s}} \\mathrm{I}_{\\mathrm{S}} \\\\\n150 \\times 9=225 \\times \\mathrm{I}_{\\mathrm{S}} \\\\\n\\mathrm{I}_{\\mathrm{s}}=\\frac{1350}{225}=6.0 \\mathrm{~A}\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ed00279619d9d8a177d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}], "question": {"text": "An ideal transformer converts <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>220</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> AC to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3<
