45c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3508c30a4553e1be265", "type": "singleCorrect", "question": {"text": "In the circuit shown charge q varies with time t as $q = t^2 - 5$, where q is in coulomb and t is in second. At time $t = 3$ second, voltage $V_{AB}$ in volt will be<br><img style=\"width: 350px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/19_april_shift_1__q41_d1.png\" />", "image": null}, "options": [{"id": "fTVJe", "label": "A", "text": "$8$", "isCorrect": false, "image": null}, {"id": "Seiwo", "label": "B", "text": "$12$", "isCorrect": false, "image": null}, {"id": "vmeJZ", "label": "C", "text": "$14$", "isCorrect": true, "image": null}, {"id": "y9TNg", "label": "D", "text": "$18$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given charge on the capacitor, $q = t^2 - 5$.<br><br>The current $i$ in the circuit is the rate of flow of charge:<br>$i = \\dfrac{dq}{dt} = \\dfrac{d}{dt}(t^2 - 5) = 2t$<br><br>The rate of change of current is:<br>$\\dfrac{di}{dt} = \\dfrac{d}{dt}(2t) = 2 \\text{ A/s}$<br><br>At time $t = 3 \\text{ s}$:<br>Charge, $q = (3)^2 - 5 = 4 \\text{ C}$<br>Current, $i = 2(3) = 6 \\text{ A}$<br>Rate of change of current, $\\dfrac{di}{dt} = 2 \\text{ A/s}$<br><br>Applying Kirchhoff's Voltage Law from point A to point B:<br>$V_A - V_C - V_L - V_R = V_B$<br>$V_A - \\dfrac{q}{C} - L\\dfrac{di}{dt} - iR = V_B$<br>$V_A - V_B = \\dfrac{q}{C} + L\\dfrac{di}{dt} + iR$<br><br>Substituting the given values ($C = 4 \\text{ F}$, $L = 0.5 \\text{ H}$, $R = 2 \\ \\Omega$):<br>$V_{AB} = \\dfrac{4}{4} + 0.5(2) + 6(2)$<br>$V_{AB} = 1 + 1 + 12 = 14 \\text{ V}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3098c30a4553e1bdf77", "type": "singleCorrect", "question": {"text": "In series LCR circuit $R = 10\\,\\Omega$ and impedance is $30\\,\\Omega$. An r.m.s. voltage $210$ V, is applied across the circuit. The true power consumed in AC circuit is", "image": null}, "options": [{"id": "e55zh", "label": "A", "text": "$360$ W", "isCorrect": false, "image": null}, {"id": "YLedw", "label": "B", "text": "$420$ W", "isCorrect": false, "image": null}, {"id": "iX8sD", "label": "C", "text": "$490$ W", "isCorrect": true, "image": null}, {"id": "WS9yL", "label": "D", "text": "$600$ W", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $R = 10 \\, \\Omega$, $Z = 30 \\, \\Omega$, and $V_{\\text{rms}} = 210$ V.<br><br>The rms current in the circuit is given by:<br><br>$I_{\\text{rms}} = \\dfrac{V_{\\text{rms}}}{Z} = \\dfrac{210}{30} = 7$ A<br><br>The true power consumed in the AC circuit is:<br><br>$P = I_{\\text{rms}}^2 R$<br><br>Substituting the values:<br><br>$P = (7)^2 \\times 10 = 49 \\times 10 = 490$ W<br><br>Answer: $490$ W", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2fc8c30a4553e1bdee9", "type": "singleCorrect", "question": {"text": "For a series LCR circuit inductive reactance $X_L$ is equal to resistance $R$ and also equal to twice the capacitive reactance $X_C$. The impedance of the circuit and the phase difference between voltage V and current i are respectively", "image": null}, "options": [{"id": "OeKzn", "label": "A", "text": "$\\sqrt{5}R,\\ \\tan^{-1}\\left(\\dfrac{1}{2}\\right)$", "isCorrect": false, "image": null}, {"id": "fsGBi", "label": "B", "text": "$\\sqrt{5}R,\\ \\tan^{-1}(2)$", "isCorrect": false, "image": null}, {"id": "iPBxV", "label": "C", "text": "$\\dfrac{\\sqrt{5}R}{2},\\ \\tan^{-1}\\left(\\dfrac{1}{2}\\right)$", "isCorrect": true, "image": null}, {"id": "Yr5A8", "label": "D", "text": "$\\dfrac{\\sqrt{5}R}{2},\\ \\tan^{-1}(2)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $X_L = R$ and $X_L = 2X_C$.<br><br>This gives $X_C = \\dfrac{R}{2}$.<br><br>The impedance of the series LCR circuit is given by $Z = \\sqrt{R^2 + (X_L - X_C)^2}$.<br><br>Substituting the values:<br><br>$Z = \\sqrt{R^2 + \\left(R - \\dfrac{R}{2}\\right)^2} = \\sqrt{R^2 + \\dfrac{R^2}{4}} = \\dfrac{\\sqrt{5}R}{2}$.<br><br>The phase difference $\\phi$ between voltage and current is given by $\\tan \\phi = \\dfrac{X_L - X_C}{R}$.<br><br>$\\tan \\phi = \\dfrac{R - \\dfrac{R}{2}}{R} = \\dfrac{1}{2}$.<br><br>$\\phi = \\tan^{-1}\\left(\\dfrac{1}{2}\\right)$.<br><br>Answer: $\\dfrac{\\sqrt{5}R}{2},\\ \\tan^{-1}\\left(\\dfrac{1}{2}\\right)$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2fb8c30a4553e1bdee8", "type": "singleCorrect", "question": {"text": "An alternating voltage $e = 150\\sqrt{2}\\sin 100t$ volt is applied to a capacitor of capacity $2\\ \\mu\\text{F}$. The root mean square value of current in the circuit is", "image": null}, "options": [{"id": "M5Arr", "label": "A", "text": "$300$ mA", "isCorrect": false, "image": null}, {"id": "iixkK", "label": "B", "text": "$150$ mA", "isCorrect": false, "image": null}, {"id": "Nh8ZE", "label": "C", "text": "$30$ mA", "isCorrect": true, "image": null}, {"id": "oDTzv", "label": "D", "text": "$15$ mA", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given alternating voltage $e = 150\\sqrt{2}\\sin(100t)$ V.<br><br>Comparing with the standard equation $e = E_0\\sin(\\omega t)$, we get:<br><br>Peak voltage $E_0 = 150\\sqrt{2}$ V<br><br>Angular frequency $\\omega = 100$ rad/s<br><br>The root mean square voltage is:<br><br>$E_{\\text{rms}} = \\dfrac{E_0}{\\sqrt{2}} = \\dfrac{150\\sqrt{2}}{\\sqrt{2}} = 150$ V<br><br>The capacitive reactance is:<br><br>$X_C = \\dfrac{1}{\\omega C} = \\dfrac{1}{100 \\times 2 \\times 10^{-6}} = 5000\\ \\Omega$<br><br>The root mean square current in the circuit is:<br><br>$I_{\\text{rms}} = \\dfrac{E_{\\text{rms}}}{X_C} = \\dfrac{150}{5000} = 0.03$ A<br><br>$I_{\\text{rms}} = 30$ mA<br><br>Answer: $30$ mA", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2fa8c30a4553e1bded8", "type": "singleCorrect", "question": {"text": "In an LCR circuit at resonance, the a.c. source current is<br>A) maximum in a series LCR circuit only.<br>B) maximum in a parallel LCR circuit only.<br>C) maximum in both series and parallel LCR circuits.<br>D) minimum in both series and parallel LCR circuits.<br>The correct answer is", "image": null}, "options": [{"id": "0wtLB", "label": "A", "text": "B", "isCorrect": false, "image": null}, {"id": "40iht", "label": "B", "text": "D", "isCorrect": false, "image": null}, {"id": "4B9ig", "label": "C", "text": "C", "isCorrect": false, "image": null}, {"id": "ECjGM", "label": "D", "text": "A", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "In a series LCR circuit, the impedance is given by $Z = \\sqrt{R^2 + (X_L - X_C)^2}$.<br><br>At resonance, $X_L = X_C$, which makes the impedance minimum ($Z = R$).<br><br>Since $I = \\dfrac{V}{Z}$, the current is maximum in a series LCR circuit at resonance.<br><br>In a parallel LCR circuit, the admittance is given by $Y = \\sqrt{\\left(\\dfrac{1}{R}\\right)^2 + \\left(\\dfrac{1}{X_C} - \\dfrac{1}{X_L}\\right)^2}$.<br><br>At resonance, $X_L = X_C$, which makes the admittance minimum ($Y = \\dfrac{1}{R}$) and the impedance maximum.<br><br>Since $I = V Y$, the current is minimum in a parallel LCR circuit at resonance.<br><br>Thus, the a.c. source current is maximum in a series LCR circuit only.<br><br>Answer: A", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ed8c30a4553e1bde4e", "type": "singleCorrect", "question": {"text": "A series combination of resistor 'R' and capacitor 'C' is connected to an a.c. source of angular frequency '$\\omega$'. Keeping the voltage same, if the frequency is changed to $\\left(\\dfrac{\\omega}{3}\\right)$ the current becomes half of the original current. Then the ratio of capacitive reactance and resistance is", "image": null}, "options": [{"id": "y64UI", "label": "A", "text": "$\\sqrt{6}$", "isCorrect": false, "image": null}, {"id": "dmYgv", "label": "B", "text": "$\\sqrt{0.3}$", "isCorrect": false, "image": null}, {"id": "N2Crp", "label": "C", "text": "$\\sqrt{3}$", "isCorrect": false, "image": null}, {"id": "C62g5", "label": "D", "text": "$\\sqrt{0.6}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Initial current $I_1 = \\dfrac{V}{\\sqrt{R^2 + X_C^2}}$ where $X_C = \\dfrac{1}{\\omega C}$<br><br>When frequency is changed to $\\dfrac{\\omega}{3}$, the new capacitive reactance becomes $X_C' = \\dfrac{1}{(\\omega/3)C} = 3X_C$<br><br>New current $I_2 = \\dfrac{V}{\\sqrt{R^2 + (3X_C)^2}} = \\dfrac{V}{\\sqrt{R^2 + 9X_C^2}}$<br><br>Given $I_2 = \\dfrac{I_1}{2}$<br><br>$\\dfrac{V}{\\sqrt{R^2 + 9X_C^2}} = \\dfrac{1}{2} \\dfrac{V}{\\sqrt{R^2 + X_C^2}}$<br><br>Squaring both sides:<br><br>$R^2 + 9X_C^2 = 4(R^2 + X_C^2)$<br><br>$R^2 + 9X_C^2 = 4R^2 + 4X_C^2$<br><br>$5X_C^2 = 3R^2$<br><br>$\\dfrac{X_C^2}{R^2} = \\dfrac{3}{5} = 0.6$<br><br>$\\dfrac{X_C}{R} = \\sqrt{0.6}$<br><br>Answer: $\\sqrt{0.6}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ed8c30a4553e1bde4d", "type": "singleCorrect", "question": {"text": "In the series LCR circuit shown in figure the impedance is<br><img style=\"width: 300px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/17_april_shift_2__q43_d1.png\" />", "image": null}, "options": [{"id": "Gohmo", "label": "A", "text": "$300\\,\\Omega$", "isCorrect": false, "image": null}, {"id": "Ymyzm", "label": "B", "text": "$500\\,\\Omega$", "isCorrect": true, "image": null}, {"id": "4JX2h", "label": "C", "text": "$700\\,\\Omega$", "isCorrect": false, "image": null}, {"id": "mKaWd", "label": "D", "text": "$900\\,\\Omega$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given parameters from the circuit:<br>Resistance, $R = 300\\ \\Omega$<br>Inductance, $L = 1\\text{ H}$<br>Capacitance, $C = 20\\ \\mu\\text{F} = 20 \\times 10^{-6}\\text{ F}$<br>Frequency of the AC source, $f = \\dfrac{50}{\\pi}\\text{ Hz}$<br><br>The angular frequency $\\omega$ is given by:<br>$\\omega = 2\\pi f = 2\\pi \\left(\\dfrac{50}{\\pi}\\right) = 100\\text{ rad/s}$<br><br>Inductive reactance, $X_L$:<br>$X_L = \\omega L = 100 \\times 1 = 100\\ \\Omega$<br><br>Capacitive reactance, $X_C$:<br>$X_C = \\dfrac{1}{\\omega C} = \\dfrac{1}{100 \\times 20 \\times 10^{-6}} = \\dfrac{1}{2 \\times 10^{-3}} = 500\\ \\Omega$<br><br>The impedance $Z$ of the series LCR circuit is:<br>$Z = \\sqrt{R^2 + (X_C - X_L)^2}$<br><br>Substituting the values:<br>$Z = \\sqrt{300^2 + (500 - 100)^2}$<br>$Z = \\sqrt{300^2 + 400^2}$<br>$Z = \\sqrt{90000 + 160000}$<br>$Z = \\sqrt{250000} = 500\\ \\Omega$<br><br>Answer: $500\\,\\Omega$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ed8c30a4553e1bde4c", "type": "singleCorrect", "question": {"text": "In an LCR series circuit, the potential difference across the terminals of the inductor, capacitor and resistor is 60 V, 30 V and 40 V respectively. Then supply voltage will be equal to", "image": null}, "options": [{"id": "MfUNk", "label": "A", "text": "$10$ V", "isCorrect": false, "image": null}, {"id": "5e45O", "label": "B", "text": "$50$ V", "isCorrect": true, "image": null}, {"id": "hpeFG", "label": "C", "text": "$70$ V", "isCorrect": false, "image": null}, {"id": "p8G8Y", "label": "D", "text": "$130$ V", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given:<br><br>$V_L = 60$ V<br><br>$V_C = 30$ V<br><br>$V_R = 40$ V<br><br>The supply voltage $V$ in an LCR series circuit is given by the phasor sum of the voltages:<br><br>$V = \\sqrt{V_R^2 + (V_L - V_C)^2}$<br><br>Substituting the given values:<br><br>$V = \\sqrt{40^2 + (60 - 30)^2}$<br><br>$V = \\sqrt{40^2 + 30^2}$<br><br>$V = \\sqrt{1600 + 900}$<br><br>$V = \\sqrt{2500} = 50$ V", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3258c30a4553e1be0a6", "type": "singleCorrect", "question": {"text": "An a.c. source is applied to a series LR circuit with $X_L = 3R$ and power factor is $X_1$. Now a capacitor with $X_c = R$ is added in series to LR circuit and power factor is $X_2$. The ratio $X_1$ to $X_2$ is", "image": null}, "options": [{"id": "D1pCn", "label": "A", "text": "$2 : 1$", "isCorrect": false, "image": null}, {"id": "WMb1Y", "label": "B", "text": "$1 : 2$", "isCorrect": false, "image": null}, {"id": "1tInF", "label": "C", "text": "$\\sqrt{2} : 1$", "isCorrect": false, "image": null}, {"id": "fei6L", "label": "D", "text": "$1 : \\sqrt{2}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For the series LR circuit, the impedance is $Z_1 = \\sqrt{R^2 + X_L^2}$.<br><br>Given $X_L = 3R$, $Z_1 = \\sqrt{R^2 + (3R)^2} = \\sqrt{10}R$.<br><br>The power factor $X_1 = \\dfrac{R}{Z_1} = \\dfrac{R}{\\sqrt{10}R} = \\dfrac{1}{\\sqrt{10}}$.<br><br>When a capacitor with $X_C = R$ is added in series, the new impedance is $Z_2 = \\sqrt{R^2 + (X_L - X_C)^2}$.<br><br>Substituting the values, $Z_2 = \\sqrt{R^2 + (3R - R)^2} = \\sqrt{R^2 + 4R^2} = \\sqrt{5}R$.<br><br>The new power factor $X_2 = \\dfrac{R}{Z_2} = \\dfrac{R}{\\sqrt{5}R} = \\dfrac{1}{\\sqrt{5}}$.<br><br>The ratio $\\dfrac{X_1}{X_2} = \\dfrac{1/\\sqrt{10}}{1/\\sqrt{5}} = \\dfrac{\\sqrt{5}}{\\sqrt{10}} = \\dfrac{1}{\\sqrt{2}}$.<br><br>Thus, $X_1 : X_2 = 1 : \\sqrt{2}$.<br><br>Answer: $1 : \\sqrt{2}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3258c30a4553e1be0a4", "type": "singleCorrect", "question": {"text": "In an a.c. circuit, a resistance R is connected in series with an inductance 'L'. If phase angle between voltage and current is $45^\\circ$, the value of inductive reactance will be<br>($\\sin 45^\\circ = \\dfrac{1}{\\sqrt{2}} = \\cos 45^\\circ$)", "image": null}, "options": [{"id": "WS8sb", "label": "A", "text": "$2R$", "isCorrect": false, "image": null}, {"id": "xrgCn", "label": "B", "text": "$R$", "isCorrect": true, "image": null}, {"id": "3P1cw", "label": "C", "text": "$\\sqrt{2}R$", "isCorrect": false, "image": null}, {"id": "fNWYu", "label": "D", "text": "$\\dfrac{1}{\\sqrt{2}}R$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In a series RL circuit, the phase angle $\\phi$ between the voltage and the current is given by the relation:<br><br>$\\tan \\phi = \\dfrac{X_L}{R}$<br><br>Given that the phase angle $\\phi = 45^\\circ$:<br><br>$\\tan 45^\\circ = \\dfrac{X_L}{R}$<br><br>Since $\\tan 45^\\circ = 1$:<br><br>$1 = \\dfrac{X_L}{R}$<br><br>$X_L = R$<br><br>The inductive reactance is equal to the resistance $R$.<br><br>Answer: $R$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3418c30a4553e1be1d2", "type": "singleCorrect", "question": {"text": "In LCR circuit, at a particular angular frequency the capacitive reactance and inductive reactance is same. If the angular frequency is doubled, the ratio of the reactance of the capacitor to that of the inductor will be", "image": null}, "options": [{"id": "0ostJ", "label": "A", "text": "$\\dfrac{1}{4}$", "isCorrect": true, "image": null}, {"id": "xmhpp", "label": "B", "text": "$\\dfrac{1}{2}$", "isCorrect": false, "image": null}, {"id": "J65he", "label": "C", "text": "$1$", "isCorrect": false, "image": null}, {"id": "R6mTV", "label": "D", "text": "$4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the initial angular frequency be $\\omega_0$.<br><br>At $\\omega_0$, the capacitive reactance $X_C$ and inductive reactance $X_L$ are equal:<br><br>$X_C = X_L \\Rightarrow \\dfrac{1}{\\omega_0 C} = \\omega_0 L$<br><br>When the angular frequency is doubled, the new angular frequency is $\\omega = 2\\omega_0$.<br><br>The new capacitive reactance is:<br><br>$X_C' = \\dfrac{1}{\\omega C} = \\dfrac{1}{2\\omega_0 C} = \\dfrac{X_C}{2}$<br><br>The new inductive reactance is:<br><br>$X_L' = \\omega L = 2\\omega_0 L = 2X_L$<br><br>The ratio of the new capacitive reactance to the new inductive reactance is:<br><br>$\\dfrac{X_C'}{X_L'} = \\dfrac{\\dfrac{X_C}{2}}{2X_L} = \\dfrac{1}{4} \\left(\\dfrac{X_C}{X_L}\\right)$<br><br>Since $X_C = X_L$, the ratio becomes $\\dfrac{1}{4}$.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3418c30a4553e1be1d1", "type": "singleCorrect", "question": {"text": "In an a.c. circuit with pure capacitance 'C' and a.c. source $E = E_0\\sin\\omega t$, the equation of instantaneous current is given by", "image": null}, "options": [{"id": "fPF62", "label": "A", "text": "$I = E_0\\,\\omega C \\cdot \\sin(\\omega t)$", "isCorrect": false, "image": null}, {"id": "sl9Pu", "label": "B", "text": "$I = E_0\\omega C\\sin\\left(\\omega t + \\dfrac{\\pi}{2}\\right)$", "isCorrect": true, "image": null}, {"id": "AP0Ej", "label": "C", "text": "$I = \\dfrac{E_0}{\\omega C}\\sin(\\omega t)$", "isCorrect": false, "image": null}, {"id": "M96Gk", "label": "D", "text": "$I = \\dfrac{E_0}{\\omega C}\\sin\\left(\\omega t + \\dfrac{\\pi}{2}\\right)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The instantaneous voltage across the capacitor is given by $E = E_0\\sin\\omega t$.<br><br>The charge on the capacitor at any instant is $q = CE = CE_0\\sin\\omega t$.<br><br>The instantaneous current $I$ is the rate of flow of charge, given by $I = \\dfrac{dq}{dt}$.<br><br>Differentiating $q$ with respect to $t$, we get:<br><br>$I = \\dfrac{d}{dt}(CE_0\\sin\\omega t) = E_0\\omega C\\cos\\omega t$<br><br>Using the trigonometric identity $\\cos\\theta = \\sin\\left(\\theta + \\dfrac{\\pi}{2}\\right)$, the current can be written as:<br><br>$I = E_0\\omega C\\sin\\left(\\omega t + \\dfrac{\\pi}{2}\\right)$<br><br>Answer: $I = E_0\\omega C\\sin\\left(\\omega t + \\dfrac{\\pi}{2}\\right)$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c38c30a4553e1bdc8c", "type": "singleCorrect", "question": {"text": "The resistor '$R$' inductance '$L$' and capacitance '$C$' are connected in series with an a.c. source. When 'L' is removed from the circuit, the phase difference between voltage and current in the circuit is $\\dfrac{\\pi}{3}$. If instead, C is removed from the circuit, the phase difference is again $\\dfrac{\\pi}{3}$. The power factor of the circuit is", "image": null}, "options": [{"id": "yIDEp", "label": "A", "text": "$\\dfrac{\\sqrt{3}}{2}$", "isCorrect": false, "image": null}, {"id": "KSnmg", "label": "B", "text": "$\\dfrac{1}{2}$", "isCorrect": false, "image": null}, {"id": "EYBwK", "label": "C", "text": "$\\dfrac{1}{\\sqrt{2}}$", "isCorrect": false, "image": null}, {"id": "bT8Li", "label": "D", "text": "$1$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "When $L$ is removed, the circuit becomes an $RC$ circuit. The phase difference is $\\phi = \\dfrac{\\pi}{3}$.<br><br>$\\tan \\phi = \\dfrac{X_C}{R} \\Rightarrow \\tan\\left(\\dfrac{\\pi}{3}\\right) = \\dfrac{X_C}{R} \\Rightarrow X_C = R\\sqrt{3}$<br><br>When $C$ is removed, the circuit becomes an $RL$ circuit. The phase difference is again $\\phi = \\dfrac{\\pi}{3}$.<br><br>$\\tan \\phi = \\dfrac{X_L}{R} \\Rightarrow \\tan\\left(\\dfrac{\\pi}{3}\\right) = \\dfrac{X_L}{R} \\Rightarrow X_L = R\\sqrt{3}$<br><br>In the series $RLC$ circuit, the net reactance is $X = X_L - X_C$.<br><br>Since $X_L = X_C = R\\sqrt{3}$, we have $X = 0$.<br><br>The impedance of the circuit is $Z = \\sqrt{R^2 + (X_L - X_C)^2} = R$.<br><br>The power factor of the circuit is $\\cos \\phi = \\dfrac{R}{Z} = \\dfrac{R}{R} = 1$.<br><br>Answer: $1$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c38c30a4553e1bdc8b", "type": "singleCorrect", "question": {"text": "The LC series resonant circuit produces a resonant frequency '$f$'. If L is tripled and 'C' is increased by 3C, the resonant frequency will be", "image": null}, "options": [{"id": "AYote", "label": "A", "text": "$\\dfrac{f}{3}$", "isCorrect": false, "image": null}, {"id": "bpTwK", "label": "B", "text": "$\\dfrac{f}{2\\sqrt{3}}$", "isCorrect": true, "image": null}, {"id": "Cazvv", "label": "C", "text": "$6f$", "isCorrect": false, "image": null}, {"id": "EjmTl", "label": "D", "text": "$\\dfrac{f}{3\\sqrt{2}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The resonant frequency of an LC series circuit is given by $f = \\dfrac{1}{2\\pi\\sqrt{LC}}$.<br><br>Given that the inductance $L$ is tripled, the new inductance is $L' = 3L$.<br><br>The capacitance $C$ is increased by $3C$, so the new capacitance is $C' = C + 3C = 4C$.<br><br>The new resonant frequency $f'$ is given by:<br><br>$f' = \\dfrac{1}{2\\pi\\sqrt{L'C'}}$<br><br>Substituting the values of $L'$ and $C'$:<br><br>$f' = \\dfrac{1}{2\\pi\\sqrt{(3L)(4C)}} = \\dfrac{1}{2\\pi\\sqrt{12LC}}$<br><br>$f' = \\dfrac{1}{2\\sqrt{3}} \\left( \\dfrac{1}{2\\pi\\sqrt{LC}} \\right)$<br><br>$f' = \\dfrac{f}{2\\sqrt{3}}$<br><br>Answer: $\\dfrac{f}{2\\sqrt{3}}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c38c30a4553e1bdc8a", "type": "singleCorrect", "question": {"text": "In LCR series circuit at resonance", "image": null}, "options": [{"id": "Tec4n", "label": "A", "text": "the current is minimum.", "isCorrect": false, "image": null}, {"id": "FZFLJ", "label": "B", "text": "the impedance is maximum.", "isCorrect": false, "image": null}, {"id": "6OM1l", "label": "C", "text": "the current leads the voltage by $\\dfrac{\\pi}{2}$", "isCorrect": false, "image": null}, {"id": "Z4RX4", "label": "D", "text": "the current and voltage are in phase.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "In an LCR series circuit, the impedance is given by $Z = \\sqrt{R^2 + (X_L - X_C)^2}$.<br><br>At resonance, the inductive reactance is equal to the capacitive reactance, i.e., $X_L = X_C$.<br><br>Substituting this in the impedance formula, we get $Z = R$. This is the minimum possible impedance, which results in maximum current.<br><br>The phase difference $\\phi$ between the voltage and current is given by $\\tan \\phi = \\dfrac{X_L - X_C}{R}$.<br><br>Since $X_L = X_C$, $\\tan \\phi = 0 \\Rightarrow \\phi = 0$.<br><br>Thus, the current and voltage are in phase.<br><br>Answer: the current and voltage are in phase.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d08c30a4553e1bdd14", "type": "singleCorrect", "question": {"text": "Series LCR circuit containing an a.c. source of 100V has a inductor and a capacitor of reactance $24\\ \\Omega$ and $16\\ \\Omega$ respectively. If a resistance of $6\\ \\Omega$ is connected in series, then the potential difference across the series combination of inductor and capacitor only is", "image": null}, "options": [{"id": "3FKxN", "label": "A", "text": "$80\\text{V}$", "isCorrect": true, "image": null}, {"id": "Mva7W", "label": "B", "text": "$8\\text{V}$", "isCorrect": false, "image": null}, {"id": "pbpOf", "label": "C", "text": "$40\\text{V}$", "isCorrect": false, "image": null}, {"id": "0kVsy", "label": "D", "text": "$20\\text{V}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $V = 100\\text{V}$, $X_L = 24\\ \\Omega$, $X_C = 16\\ \\Omega$, and $R = 6\\ \\Omega$.<br><br>The net reactance of the circuit is $X = X_L - X_C = 24 - 16 = 8\\ \\Omega$.<br><br>The impedance of the series LCR circuit is given by $Z = \\sqrt{R^2 + (X_L - X_C)^2}$.<br><br>Substituting the values, $Z = \\sqrt{6^2 + 8^2} = \\sqrt{36 + 64} = 10\\ \\Omega$.<br><br>The rms current in the circuit is $I = \\dfrac{V}{Z} = \\dfrac{100}{10} = 10\\text{A}$.<br><br>The potential difference across the series combination of the inductor and capacitor is $V_{LC} = I \\times |X_L - X_C|$.<br><br>$V_{LC} = 10 \\times 8 = 80\\text{V}$.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d08c30a4553e1bdd12", "type": "singleCorrect", "question": {"text": "An inductor of inductance $2\\ \\mu\\text{H}$ is connected in series with a resistance, a variable capacitor and an a.c. source of 10 kHz. The value of capacitance for which maximum current is drawn in to the circuit is $\\dfrac{1}{x}\\ \\text{F}$, where the value of x is (Take $\\pi^2 = 10$)", "image": null}, "options": [{"id": "GzWNy", "label": "A", "text": "$8000$", "isCorrect": true, "image": null}, {"id": "RPRZj", "label": "B", "text": "$600$", "isCorrect": false, "image": null}, {"id": "cJnwb", "label": "C", "text": "$400$", "isCorrect": false, "image": null}, {"id": "zzwZ3", "label": "D", "text": "$1600$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Maximum current is drawn in a series LCR circuit at resonance.<br><br>At resonance, the inductive reactance equals the capacitive reactance, so $\\omega L = \\dfrac{1}{\\omega C}$.<br><br>$C = \\dfrac{1}{\\omega^2 L} = \\dfrac{1}{(2\\pi f)^2 L}$<br><br>Given $L = 2\\ \\mu\\text{H} = 2 \\times 10^{-6}\\ \\text{H}$ and $f = 10\\ \\text{kHz} = 10^4\\ \\text{Hz}$.<br><br>$C = \\dfrac{1}{4\\pi^2 f^2 L}$<br><br>Substituting the values and using $\\pi^2 = 10$:<br><br>$C = \\dfrac{1}{4 \\times 10 \\times (10^4)^2 \\times 2 \\times 10^{-6}}$<br><br>$C = \\dfrac{1}{40 \\times 10^8 \\times 2 \\times 10^{-6}}$<br><br>$C = \\dfrac{1}{80 \\times 10^2} = \\dfrac{1}{8000}\\ \\text{F}$<br><br>Comparing with $C = \\dfrac{1}{x}\\ \\text{F}$, we get $x = 8000$.<br><br>Answer: $8000$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3328c30a4553e1be12f", "type": "singleCorrect", "question": {"text": "When a capacitor is connected in series LR circuit, the alternating current flowing in the circuit", "image": null}, "options": [{"id": "Mm1fW", "label": "A", "text": "increases", "isCorrect": true, "image": null}, {"id": "klla4", "label": "B", "text": "decreases", "isCorrect": false, "image": null}, {"id": "3gOEY", "label": "C", "text": "remains constant", "isCorrect": false, "image": null}, {"id": "Ziwpx", "label": "D", "text": "is zero", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The impedance of a series LR circuit is given by $Z_1 = \\sqrt{R^2 + X_L^2}$.<br><br>When a capacitor is connected in series with the LR circuit, it becomes an LCR circuit. The new impedance is given by $Z_2 = \\sqrt{R^2 + (X_L - X_C)^2}$.<br><br>The net reactance of the circuit changes from $X_L$ to $|X_L - X_C|$. Since the capacitive reactance $X_C$ opposes the inductive reactance $X_L$, the net reactance generally decreases.<br><br>As a result, the overall impedance of the circuit decreases ($Z_2 < Z_1$).<br><br>Since the alternating current is inversely proportional to the impedance ($I = \\dfrac{V}{Z}$), a decrease in impedance leads to an increase in the current flowing through the circuit.<br><br>Answer: increases", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3318c30a4553e1be125", "type": "singleCorrect", "question": {"text": "With gradual increase in frequency of an a.c. supply, the impedance of an LCR series circuit", "image": null}, "options": [{"id": "cWASh", "label": "A", "text": "increases", "isCorrect": false, "image": null}, {"id": "hLvub", "label": "B", "text": "decreases", "isCorrect": false, "image": null}, {"id": "u0j6a", "label": "C", "text": "remains constant", "isCorrect": false, "image": null}, {"id": "OtzLi", "label": "D", "text": "first decreases, becomes minimum and then increases", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The impedance of an LCR series circuit is given by $Z = \\sqrt{R^2 + (X_L - X_C)^2}$<br><br>where $X_L = 2\\pi f L$ and $X_C = \\dfrac{1}{2\\pi f C}$.<br><br>At low frequencies, $X_C > X_L$, so the impedance is high.<br><br>As the frequency $f$ increases, $X_C$ decreases and $X_L$ increases, which reduces the magnitude of $(X_L - X_C)$. Thus, the impedance decreases.<br><br>At the resonant frequency $f = \\dfrac{1}{2\\pi\\sqrt{LC}}$, $X_L = X_C$, and the impedance becomes minimum, $Z = R$.<br><br>With a further increase in frequency, $X_L > X_C$, and the magnitude of $(X_L - X_C)$ increases, causing the impedance to increase.<br><br>Therefore, the impedance first decreases, becomes minimum, and then increases.<br><br>Answer: first decreases, becomes minimum and then increases", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2df8c30a4553e1bddba", "type": "singleCorrect", "question": {"text": "An electric lamp connected in series with a capacitor and an a.c source is glowing with certain brightness. On reducing the frequency of source the brightness of the lamp", "image": null}, "options": [{"id": "yaXIu", "label": "A", "text": "is increased", "isCorrect": false, "image": null}, {"id": "v8w2N", "label": "B", "text": "is reduced", "isCorrect": true, "image": null}, {"id": "YH3eP", "label": "C", "text": "remain the same", "isCorrect": false, "image": null}, {"id": "X5GqM", "label": "D", "text": "becomes zero", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The impedance of the series RC circuit is given by $Z = \\sqrt{R^2 + X_C^2}$, where $X_C = \\dfrac{1}{2\\pi f C}$.<br><br>When the frequency $f$ of the AC source is reduced, the capacitive reactance $X_C$ increases.<br><br>As a result, the total impedance $Z$ of the circuit increases.<br><br>The current in the circuit is $I = \\dfrac{V}{Z}$. Since $Z$ increases, the current $I$ decreases.<br><br>The brightness of the lamp is proportional to the power dissipated, $P = I^2 R$. With a decrease in current, the power dissipated decreases, and hence the brightness of the lamp is reduced.<br><br>Answer: is reduced", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2dd8c30a4553e1bdd9c", "type": "singleCorrect", "question": {"text": "A series resonant circuit consists of an inductor 'L' and capacitor 'C' which produces resonant frequency 'f'. If 'L' is increased by '2L' and 'C' is changed to '9C' the resonant frequency will be", "image": null}, "options": [{"id": "qPw8A", "label": "A", "text": "$\\dfrac{f}{3}$", "isCorrect": false, "image": null}, {"id": "rvhZ3", "label": "B", "text": "$\\dfrac{f}{2}$", "isCorrect": false, "image": null}, {"id": "MhyUc", "label": "C", "text": "$\\dfrac{f}{2\\sqrt{2}}$", "isCorrect": false, "image": null}, {"id": "PGwa5", "label": "D", "text": "$\\dfrac{f}{3\\sqrt{3}}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The resonant frequency of a series L-C circuit is given by:<br><br>$f = \\dfrac{1}{2\\pi\\sqrt{LC}}$<br><br>Given that the inductance is increased by $2L$, the new inductance is:<br><br>$L' = L + 2L = 3L$<br><br>The capacitance is changed to $9C$, so the new capacitance is:<br><br>$C' = 9C$<br><br>The new resonant frequency $f'$ is:<br><br>$f' = \\dfrac{1}{2\\pi\\sqrt{L'C'}}$<br><br>Substituting the values of $L'$ and $C'$:<br><br>$f' = \\dfrac{1}{2\\pi\\sqrt{(3L)(9C)}}$<br><br>$f' = \\dfrac{1}{2\\pi\\sqrt{27LC}}$<br><br>$f' = \\dfrac{1}{3\\sqrt{3}} \\left( \\dfrac{1}{2\\pi\\sqrt{LC}} \\right)$<br><br>$f' = \\dfrac{f}{3\\sqrt{3}}$<br><br>Answer: $\\dfrac{f}{3\\sqrt{3}}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2db8c30a4553e1bdd8d", "type": "singleCorrect", "question": {"text": "In an LCR series circuit, at resonance,", "image": null}, "options": [{"id": "zqZUJ", "label": "A", "text": "the impedance is maximum", "isCorrect": false, "image": null}, {"id": "TYIsp", "label": "B", "text": "the current is minimum", "isCorrect": false, "image": null}, {"id": "XwYNm", "label": "C", "text": "the current leads the voltage by $\\dfrac{\\pi}{2}$", "isCorrect": false, "image": null}, {"id": "Dt1iR", "label": "D", "text": "the current and voltage are in phase", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "In an LCR series circuit, the impedance is given by $Z = \\sqrt{R^2 + (X_L - X_C)^2}$.<br><br>At resonance, the inductive reactance is equal to the capacitive reactance, i.e., $X_L = X_C$.<br><br>Substituting this in the impedance formula, we get $Z = R$, which is the minimum impedance.<br><br>The phase difference $\\phi$ between the voltage and current is given by $\\tan \\phi = \\dfrac{X_L - X_C}{R}$.<br><br>Since $X_L = X_C$, $\\tan \\phi = 0 \\Rightarrow \\phi = 0$.<br><br>Therefore, the current and voltage are in phase.<br><br>Answer: the current and voltage are in phase", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3178c30a4553e1be014", "type": "singleCorrect", "question": {"text": "A series LCR circuit is connected to an a.c. source of $220$ V, $50$ Hz. The circuit contains a resistance $R = 80\\,\\Omega$, an inductor of inductive reactance $70\\,\\Omega$ and capacitor of capacitive reactance $130\\,\\Omega$. The power factor of the circuit is $\\dfrac{x}{10}$. The value of x is", "image": null}, "options": [{"id": "QoVIV", "label": "A", "text": "$8$", "isCorrect": true, "image": null}, {"id": "Vj3IQ", "label": "B", "text": "$6$", "isCorrect": false, "image": null}, {"id": "NE6U0", "label": "C", "text": "$4$", "isCorrect": false, "image": null}, {"id": "hvEu4", "label": "D", "text": "$7$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The impedance of the series LCR circuit is given by<br><br>$Z = \\sqrt{R^2 + (X_C - X_L)^2}$<br><br>Substituting the given values:<br><br>$Z = \\sqrt{80^2 + (130 - 70)^2}$<br><br>$Z = \\sqrt{80^2 + 60^2}$<br><br>$Z = \\sqrt{6400 + 3600} = \\sqrt{10000} = 100\\,\\Omega$<br><br>The power factor of the circuit is<br><br>$\\cos \\phi = \\dfrac{R}{Z}$<br><br>$\\cos \\phi = \\dfrac{80}{100} = \\dfrac{8}{10}$<br><br>Comparing this with $\\dfrac{x}{10}$, we get $x = 8$.<br><br>Answer: $8$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2988c30a4553e1bdab9", "type": "singleCorrect", "question": {"text": "In the circuit shown, the ratio of the quality factor and the band width is<br>(Given: band width = R/L)<br><img style=\"width: 300px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/13_april_shift_2__q27_d1_v2.png\" />", "image": null}, "options": [{"id": "EGin1", "label": "A", "text": "$\\sqrt{\\dfrac{1}{LC}}\\dfrac{L^2}{R^2}$", "isCorrect": true, "image": null}, {"id": "yg3GO", "label": "B", "text": "$\\sqrt{\\dfrac{1}{LC}}$", "isCorrect": false, "image": null}, {"id": "uiUSO", "label": "C", "text": "$\\sqrt{\\dfrac{1}{LC}}\\dfrac{L}{R}$", "isCorrect": false, "image": null}, {"id": "ZE3vw", "label": "D", "text": "$\\sqrt{\\dfrac{1}{LC}}\\dfrac{R}{L}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The quality factor $Q$ of a series LCR circuit is given by:<br><br>$Q = \\dfrac{\\omega_0 L}{R}$<br><br>where $\\omega_0$ is the resonant angular frequency, $\\omega_0 = \\sqrt{\\dfrac{1}{LC}}$.<br><br>The bandwidth is given as $\\Delta \\omega = \\dfrac{R}{L}$.<br><br>The ratio of the quality factor to the bandwidth is:<br><br>$\\text{Ratio} = \\dfrac{Q}{\\Delta \\omega} = \\dfrac{\\dfrac{\\omega_0 L}{R}}{\\dfrac{R}{L}} = \\omega_0 \\dfrac{L^2}{R^2}$<br><br>Substituting $\\omega_0 = \\sqrt{\\dfrac{1}{LC}}$, we get:<br><br>$\\text{Ratio} = \\sqrt{\\dfrac{1}{LC}} \\dfrac{L^2}{R^2}$<br><br>Answer: $\\sqrt{\\dfrac{1}{LC}}\\dfrac{L^2}{R^2}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2978c30a4553e1bdab4", "type": "singleCorrect", "question": {"text": "An inductor of $0.5$ mH, a capacitor of $20$ $\\mu$F and resistance $20\\,\\Omega$ are connected in series with a $220$ V ac source. If the current is in phase with the emf, the amplitude of current of the circuit is $[x]^{1/2}$ A. The value of $x$ is", "image": null}, "options": [{"id": "53g6c", "label": "A", "text": "$61$", "isCorrect": false, "image": null}, {"id": "mnZg5", "label": "B", "text": "$121$", "isCorrect": false, "image": null}, {"id": "dOgIc", "label": "C", "text": "$242$", "isCorrect": true, "image": null}, {"id": "3Xq1H", "label": "D", "text": "$442$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Since the current is in phase with the emf, the circuit is in resonance.<br><br>At resonance, the impedance of the circuit is equal to its resistance.<br><br>$Z = R = 20\\,\\Omega$<br><br>The rms current in the circuit is given by:<br><br>$I_{rms} = \\dfrac{V_{rms}}{Z} = \\dfrac{220}{20} = 11$ A<br><br>The amplitude (peak value) of the current is:<br><br>$I_{0} = \\sqrt{2} I_{rms} = 11\\sqrt{2} = \\sqrt{242}$ A<br><br>Given that the amplitude of the current is $\\sqrt{x}$ A, we have:<br><br>$\\sqrt{x} = \\sqrt{242} \\Rightarrow x = 242$<br><br>Answer: $242$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2958c30a4553e1bdaa1", "type": "singleCorrect", "question": {"text": "In a series LR circuit with $X_L = R$. Power factor is $P_1$. If a capacitor of capacitance $C$ with $X_c = X_L$ is added to the circuit the power factor becomes $P_2$. The ratio of $P_1$ to $P_2$ will be :", "image": null}, "options": [{"id": "iEtnY", "label": "A", "text": "$1:3$", "isCorrect": false, "image": null}, {"id": "YVhjL", "label": "B", "text": "$1:\\sqrt{2}$", "isCorrect": true, "image": null}, {"id": "97qiX", "label": "C", "text": "$1:1$", "isCorrect": false, "image": null}, {"id": "6Uv0m", "label": "D", "text": "$1:2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For the initial series LR circuit, the impedance is $Z_1 = \\sqrt{R^2 + X_L^2}$.<br><br>Given $X_L = R$, we have $Z_1 = \\sqrt{R^2 + R^2} = \\sqrt{2}R$.<br><br>The power factor $P_1 = \\dfrac{R}{Z_1} = \\dfrac{R}{\\sqrt{2}R} = \\dfrac{1}{\\sqrt{2}}$.<br><br>When a capacitor with $X_C = X_L$ is added in series, the new impedance is $Z_2 = \\sqrt{R^2 + (X_L - X_C)^2}$.<br><br>Since $X_C = X_L$, the circuit is in resonance and $Z_2 = R$.<br><br>The new power factor $P_2 = \\dfrac{R}{Z_2} = \\dfrac{R}{R} = 1$.<br><br>The ratio of $P_1$ to $P_2$ is $\\dfrac{P_1}{P_2} = \\dfrac{1/\\sqrt{2}}{1} = \\dfrac{1}{\\sqrt{2}}$.<br><br>Thus, $P_1 : P_2 = 1 : \\sqrt{2}$.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36c8c30a4553e1be398", "type": "singleCorrect", "question": {"text": "In series LCR circuit C = 2 uF, L=1 mH and R= 10 $\\Omega$. What is the ratio of energies stored in the capacitor and inductor when maximum current flows through circuit?", "image": null}, "options": [{"id": "jlWEN", "label": "A", "text": "$0.1 : 1$", "isCorrect": false, "image": null}, {"id": "LpCIU", "label": "B", "text": "$0.4 : 1$", "isCorrect": false, "image": null}, {"id": "QCEfd", "label": "C", "text": "$0.2 : 1$", "isCorrect": true, "image": null}, {"id": "Z74rS", "label": "D", "text": "$0.8 : 1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a series LCR circuit undergoing free oscillations, the voltage equation is given by:<br><br>$V_L + V_R + V_C = 0$<br><br>$L \\dfrac{di}{dt} + iR + V_C = 0$<br><br>When the current $i$ in the circuit is maximum, its rate of change is zero, i.e., $\\dfrac{di}{dt} = 0$.<br><br>Substituting this into the voltage equation, we get:<br><br>$0 + i_{max}R + V_C = 0 \\Rightarrow V_C = -i_{max}R$<br><br>The energy stored in the capacitor at this instant is:<br><br>$U_C = \\dfrac{1}{2} C V_C^2 = \\dfrac{1}{2} C (i_{max}R)^2$<br><br>The energy stored in the inductor at the same instant is:<br><br>$U_L = \\dfrac{1}{2} L i_{max}^2$<br><br>The ratio of the energy stored in the capacitor to that in the inductor is:<br><br>$\\dfrac{U_C}{U_L} = \\dfrac{\\dfrac{1}{2} C i_{max}^2 R^2}{\\dfrac{1}{2} L i_{max}^2} = \\dfrac{CR^2}{L}$<br><br>Given values are:<br><br>$C = 2 \\times 10^{-6} \\text{ F}$<br><br>$R = 10 \\Omega$<br><br>$L = 10^{-3} \\text{ H}$<br><br>Substituting the given values into the ratio:<br><br>$\\dfrac{U_C}{U_L} = \\dfrac{2 \\times 10^{-6} \\times (10)^2}{10^{-3}}$<br><br>$\\dfrac{U_C}{U_L} = \\dfrac{2 \\times 10^{-4}}{10^{-3}} = 0.2$<br><br>Thus, the ratio of energies is $0.2 : 1$.<br><br>Answer: $0.2 : 1$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36c8c30a4553e1be394", "type": "singleCorrect", "question": {"text": "In series LCR resonant circuit, R=800 $\\Omega$, C = 2 $\\mu$F and voltage across resistance is 200 V. The angular frequency is 250 rad/s. At resonance the voltage across the capacitance is", "image": null}, "options": [{"id": "LNzjD", "label": "A", "text": "$250$ V", "isCorrect": false, "image": null}, {"id": "KxYoJ", "label": "B", "text": "$500$ V", "isCorrect": true, "image": null}, {"id": "U4WmI", "label": "C", "text": "$1000$ V", "isCorrect": false, "image": null}, {"id": "unETV", "label": "D", "text": "$750$ V", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "At resonance, the current in the circuit is determined by the resistance and the voltage across it.<br><br>$I = \\dfrac{V_R}{R}$<br><br>Substituting the given values:<br><br>$I = \\dfrac{200}{800} = 0.25$ A<br><br>The capacitive reactance is given by:<br><br>$X_C = \\dfrac{1}{\\omega C}$<br><br>Substituting the given values:<br><br>$X_C = \\dfrac{1}{250 \\times 2 \\times 10^{-6}} = \\dfrac{10^6}{500} = 2000 \\, \\Omega$<br><br>The voltage across the capacitance is:<br><br>$V_C = I X_C$<br><br>$V_C = 0.25 \\times 2000 = 500$ V<br><br>Answer: $500$ V", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36a8c30a4553e1be380", "type": "singleCorrect", "question": {"text": "A resistor of 100 $\\Omega$, inductor of self inductance $\\left(\\dfrac{4}{\\pi^2}\\right)$ H and a capacitor of unknown capacity are connected in series to an a.c. source of 200 V and 50 Hz. When the current and voltage are in phase, the value of capacity is", "image": null}, "options": [{"id": "gfEqz", "label": "A", "text": "$40 \\ \\mu F$", "isCorrect": false, "image": null}, {"id": "V0e3u", "label": "B", "text": "$50 \\ \\mu F$", "isCorrect": false, "image": null}, {"id": "5WccP", "label": "C", "text": "$20 \\ \\mu F$", "isCorrect": false, "image": null}, {"id": "pm3db", "label": "D", "text": "$25 \\ \\mu F$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "When current and voltage are in phase, the circuit is in resonance.<br><br>$X_L = X_C$<br><br>$\\omega L = \\dfrac{1}{\\omega C}$<br><br>$C = \\dfrac{1}{\\omega^2 L}$<br><br>Given $f = 50$ Hz, $\\omega = 2\\pi f = 100\\pi$ rad/s and $L = \\dfrac{4}{\\pi^2}$ H.<br><br>Substituting the values:<br><br>$C = \\dfrac{1}{(100\\pi)^2 \\times \\left(\\dfrac{4}{\\pi^2}\\right)}$<br><br>$C = \\dfrac{1}{10000\\pi^2 \\times \\dfrac{4}{\\pi^2}}$<br><br>$C = \\dfrac{1}{40000}$ F<br><br>$C = 25 \\times 10^{-6}$ F $= 25 \\ \\mu F$<br><br>Answer: $25 \\ \\mu F$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d35e8c30a4553e1be2fe", "type": "singleCorrect", "question": {"text": "A light bulb connected in series with a capacitor and an a.c.source is glowing with certain brightness. On reducing the value of capacitance and frequency respectively, the brightness of the bulb", "image": null}, "options": [{"id": "EllFW", "label": "A", "text": "is reduced, is reduced", "isCorrect": true, "image": null}, {"id": "uoyAy", "label": "B", "text": "is more, is more", "isCorrect": false, "image": null}, {"id": "GlE4H", "label": "C", "text": "is more, is reduced", "isCorrect": false, "image": null}, {"id": "rMb8k", "label": "D", "text": "is reduced, is more", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The brightness of the bulb depends on the current flowing through it, which is given by $I = \\dfrac{V}{Z}$.<br><br>The impedance of the series RC circuit is $Z = \\sqrt{R^2 + X_C^2}$, where $X_C = \\dfrac{1}{2\\pi f C}$.<br><br>When the capacitance $C$ is reduced, the capacitive reactance $X_C$ increases. This increases the total impedance $Z$ of the circuit, which in turn reduces the current $I$. Consequently, the brightness of the bulb is reduced.<br><br>Similarly, when the frequency $f$ of the AC source is reduced, the capacitive reactance $X_C$ increases. This again increases the impedance $Z$ and reduces the current $I$. Thus, the brightness of the bulb is reduced.<br><br>Therefore, in both cases, the brightness of the bulb is reduced.<br><br>Answer: is reduced, is reduced", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d35b8c30a4553e1be2e4", "type": "singleCorrect", "question": {"text": "In series LCR circuit, resistance is $18\\ \\Omega$ and impedance $33\\ \\Omega$. An r.m.s. Voltage of $220$ V is applied across the circuit. The true power consumed in a c. circuit is", "image": null}, "options": [{"id": "77FGd", "label": "A", "text": "$400$ W", "isCorrect": false, "image": null}, {"id": "Li2cG", "label": "B", "text": "$600$ W", "isCorrect": false, "image": null}, {"id": "zmF3V", "label": "C", "text": "$200$ W", "isCorrect": false, "image": null}, {"id": "uwak5", "label": "D", "text": "$800$ W", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The true power consumed in an AC circuit is given by the formula:<br><br>$P = I_{rms}^2 R$<br><br>The rms current in the circuit is:<br><br>$I_{rms} = \\dfrac{V_{rms}}{Z}$<br><br>Substituting the given values $V_{rms} = 220$ V and $Z = 33\\ \\Omega$:<br><br>$I_{rms} = \\dfrac{220}{33} = \\dfrac{20}{3}$ A<br><br>Now, substituting $I_{rms}$ and $R = 18\\ \\Omega$ into the power formula:<br><br>$P = \\left(\\dfrac{20}{3}\\right)^2 \\times 18$<br><br>$P = \\dfrac{400}{9} \\times 18$<br><br>$P = 800$ W<br><br>Answer: $800$ W", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b58c30a4553e1bdbf6", "type": "singleCorrect", "question": {"text": "An inductor of reactance $100$ $\\Omega$, a capacitor of reactance $50$ $\\Omega$, and a resistor of resistance $50$ $\\Omega$ are connected in series with an AC source of $10$ V, $50$ Hz. Average power dissipated by the circuit is ____", "image": null}, "options": [{"id": "HmO5u", "label": "A", "text": "$1$ W", "isCorrect": true, "image": null}, {"id": "duvha", "label": "B", "text": "$2$ W", "isCorrect": false, "image": null}, {"id": "dyrui", "label": "C", "text": "$3$ W", "isCorrect": false, "image": null}, {"id": "Ayh4a", "label": "D", "text": "$4$ W", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $X_L = 100$ $\\Omega$, $X_C = 50$ $\\Omega$, and $R = 50$ $\\Omega$.<br><br>The impedance of the series LCR circuit is given by:<br><br>$Z = \\sqrt{R^2 + (X_L - X_C)^2}$<br><br>$Z = \\sqrt{50^2 + (100 - 50)^2} = \\sqrt{50^2 + 50^2} = 50\\sqrt{2}$ $\\Omega$<br><br>The RMS current in the circuit is:<br><br>$I_{rms} = \\dfrac{V_{rms}}{Z} = \\dfrac{10}{50\\sqrt{2}} = \\dfrac{1}{5\\sqrt{2}}$ A<br><br>The average power dissipated in the circuit is:<br><br>$P_{avg} = I_{rms}^2 R$<br><br>$P_{avg} = \\left(\\dfrac{1}{5\\sqrt{2}}\\right)^2 \\times 50 = \\dfrac{1}{50} \\times 50 = 1$ W<br><br>Answer: $1$ W", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b48c30a4553e1bdbed", "type": "singleCorrect", "question": {"text": "In the circuit shown below, the ac source has voltage $V = 30 \\cos(\\omega t)$ volt with $\\omega = 2000$ rad/s. What will be the amplitude of the current?<br><img style=\"width: 300px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/11_april_shift_1__q35_d1.png\" />", "image": null}, "options": [{"id": "eUpkY", "label": "A", "text": "$\\sqrt{5}$ A", "isCorrect": false, "image": null}, {"id": "oGZ6b", "label": "B", "text": "$\\dfrac{3}{\\sqrt{5}}$ A", "isCorrect": false, "image": null}, {"id": "cwGL2", "label": "C", "text": "$3$ A", "isCorrect": true, "image": null}, {"id": "a8gge", "label": "D", "text": "$3.3$ A", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "From the given circuit, the parameters are:<br>Amplitude of voltage, $V_m = 30$ V<br>Angular frequency, $\\omega = 2000$ rad/s<br>Total resistance, $R = 6 + 4 = 10\\ \\Omega$<br>Inductance, $L = 5 \\times 10^{-3}$ H<br>Capacitance, $C = 50 \\times 10^{-6}$ F<br><br>The inductive reactance is:<br>$X_L = \\omega L = 2000 \\times 5 \\times 10^{-3} = 10\\ \\Omega$<br><br>The capacitive reactance is:<br>$X_C = \\dfrac{1}{\\omega C} = \\dfrac{1}{2000 \\times 50 \\times 10^{-6}} = 10\\ \\Omega$<br><br>The total impedance of the circuit is:<br>$Z = \\sqrt{R^2 + (X_L - X_C)^2}$<br><br>Substituting the values:<br>$Z = \\sqrt{10^2 + (10 - 10)^2} = 10\\ \\Omega$<br><br>The amplitude of the current is:<br>$I_m = \\dfrac{V_m}{Z} = \\dfrac{30}{10} = 3$ A<br><br>Answer: $3$ A", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf9bf9280d7f9932e26", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "An inductor of $\\left(\\frac{100}{\\pi}\\right) \\mathrm{mH}$, capacitor of capacitance $\\left(\\frac{10^{-3}}{2 \\pi}\\right) \\mathrm{F}$ and resistance of $10 \\Omega$ are connected in series with an AC voltage source of $110 \\mathrm{~V}, 50 \\mathrm{~Hz}$ supply. The tangent of the phase angle ' $\\phi$ ' between voltage and current is", "image": null}, "options": [{"id": "2iMuG", "text": "4", "image": null, "isCorrect": false}, {"id": "4vENR", "text": "3", "image": null, "isCorrect": false}, {"id": "zGh99", "text": "2", "image": null, "isCorrect": false}, {"id": "6PDBa", "text": "1", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The inductive reactance $X_L$ is given by:<br><br>$X_L = 2\\pi f L = 2\\pi \\times 50 \\times \\dfrac{100 \\times 10^{-3}}{\\pi} = 10 \\ \\Omega$<br><br>The capacitive reactance $X_C$ is given by:<br><br>$X_C = \\dfrac{1}{2\\pi f C} = \\dfrac{1}{2\\pi \\times 50 \\times \\dfrac{10^{-3}}{2\\pi}} = \\dfrac{1}{50 \\times 10^{-3}} = 20 \\ \\Omega$<br><br>The tangent of the phase angle $\\phi$ between voltage and current is:<br><br>$\\tan \\phi = \\dfrac{|X_L - X_C|}{R}$<br><br>Substituting the values:<br><br>$\\tan \\phi = \\dfrac{|10 - 20|}{10} = \\dfrac{10}{10} = 1$<br><br>Answer: 1", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf6bf9280d7f9932e0b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The value of alternating e.m.f. (E) in the given circuit is\n\n\n<img width=300px src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/QWwcDkf8o4Y9W4FqO0RcIWtLx0aBN4Kx4gUuVApJdKc.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "QRgfr", "text": "30 V", "image": null, "isCorrect": false}, {"id": "c6xpm", "text": "60 V", "image": null, "isCorrect": false}, {"id": "VfzWp", "text": "50 V", "image": null, "isCorrect": true}, {"id": "FqOeQ", "text": "110 V", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From the given circuit diagram, the voltages across the inductor, capacitor, and resistor are:<br>$V_L = 20\\text{ V}$<br>$V_C = 50\\text{ V}$<br>$V_R = 40\\text{ V}$<br><br>In a series LCR circuit, the total alternating e.m.f. $E$ is given by the phasor sum of the individual voltages:<br>$E = \\sqrt{V_R^2 + (V_L - V_C)^2}$<br><br>Substituting the given values:<br>$E = \\sqrt{40^2 + (20 - 50)^2}$<br>$E = \\sqrt{40^2 + (-30)^2}$<br>$E = \\sqrt{1600 + 900}$<br>$E = \\sqrt{2500}$<br>$E = 50\\text{ V}$<br><br>Answer: 50 V", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf6bf9280d7f9932e08", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "In an LC circuit, angular frequency at resonance is $\\omega$. The new angular frequency when inductance is made four times and capacitance is made eight times is", "image": null}, "options": [{"id": "2MyZu", "text": "$\\frac{\\omega}{2 \\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "nuUQB", "text": "$\\frac{\\omega}{4 \\sqrt{2}}$", "image": null, "isCorrect": true}, {"id": "OiBW2", "text": "$\\frac{\\omega}{4}$", "image": null, "isCorrect": false}, {"id": "f3GSR", "text": "$\\frac{\\omega}{\\sqrt{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The angular frequency of an LC circuit at resonance is given by<br><br>$\\omega = \\dfrac{1}{\\sqrt{LC}}$<br><br>When inductance is made four times and capacitance is made eight times, the new inductance is $L' = 4L$ and the new capacitance is $C' = 8C$.<br><br>The new angular frequency is<br><br>$\\omega' = \\dfrac{1}{\\sqrt{L'C'}} = \\dfrac{1}{\\sqrt{(4L)(8C)}}$<br><br>$\\omega' = \\dfrac{1}{\\sqrt{32LC}} = \\dfrac{1}{4\\sqrt{2}\\sqrt{LC}}$<br><br>$\\omega' = \\dfrac{\\omega}{4\\sqrt{2}}$<br><br>Answer: $\\frac{\\omega}{4 \\sqrt{2}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bebbf9280d7f9932da3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A resistor of $100 \\Omega$, inductor of self inductance $\\left(\\frac{4}{\\pi^2}\\right) \\mathrm{H}$ and a capacitor of unknown capacitance are connected in series to an a.c. source of $200 \\mathrm{~V}, 50 \\mathrm{~Hz}$ supply. When the current and voltage are in phase, the capacitance and the power dissipated is respectively", "image": null}, "options": [{"id": "zXtj0", "text": "$2.5 \\times 10^{-5} \\mathrm{~F}, 400 \\mathrm{~W}$", "image": null, "isCorrect": true}, {"id": "i88wZ", "text": "$2 \\times 10^{-5} \\mathrm{~F}, 200 \\mathrm{~W}$", "image": null, "isCorrect": false}, {"id": "mxBlV", "text": "$3 \\times 10^{-5} \\mathrm{~F}, 300 \\mathrm{~W}$", "image": null, "isCorrect": false}, {"id": "YyZ5w", "text": "$4 \\times 10^{-5} \\mathrm{~F}, 400 \\mathrm{~W}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given:<br>$R = 100 \\Omega$<br>$L = \\dfrac{4}{\\pi^2} \\mathrm{H}$<br>$V = 200 \\mathrm{V}$<br>$f = 50 \\mathrm{Hz}$<br><br>Since the current and voltage are in phase, the circuit is in resonance.<br>At resonance, the inductive reactance equals the capacitive reactance ($X_L = X_C$).<br><br>$\\omega L = \\dfrac{1}{\\omega C}$<br><br>$C = \\dfrac{1}{\\omega^2 L}$<br><br>Angular frequency $\\omega = 2\\pi f = 2\\pi \\times 50 = 100\\pi \\mathrm{\\,rad/s}$<br><br>Substituting the values:<br>$C = \\dfrac{1}{(100\\pi)^2 \\times \\dfrac{4}{\\pi^2}}$<br><br>$C = \\dfrac{1}{10000\\pi^2 \\times \\dfrac{4}{\\pi^2}} = \\dfrac{1}{40000} = 2.5 \\times 10^{-5} \\mathrm{\\,F}$<br><br>At resonance, the impedance of the circuit is purely resistive, so $Z = R = 100 \\Omega$.<br><br>The power dissipated is given by:<br>$P = \\dfrac{V^2}{R}$<br><br>$P = \\dfrac{(200)^2}{100} = \\dfrac{40000}{100} = 400 \\mathrm{\\,W}$<br><br>Answer: $2.5 \\times 10^{-5} \\mathrm{~F}, 400 \\mathrm{~W}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be9bf9280d7f9932d8d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "In an LC circuit, angular frequency at resonance is ' $\\omega$ '. What will be the new angular frequency when inductor's inductance is made two times and capacitor's capacitance is made four times?", "image": null}, "options": [{"id": "FvCsk", "text": "$\\frac{\\omega}{2 \\sqrt{2}}$", "image": null, "isCorrect": true}, {"id": "412xz", "text": "$\\frac{\\omega}{\\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "6oYGD", "text": "$2 \\omega$", "image": null, "isCorrect": false}, {"id": "uTAlU", "text": "$\\frac{2 \\omega}{\\sqrt{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The angular frequency of an LC circuit at resonance is given by:<br><br>$\\omega = \\dfrac{1}{\\sqrt{LC}}$<br><br>When the inductance is made two times and capacitance is made four times, the new inductance is $L' = 2L$ and the new capacitance is $C' = 4C$.<br><br>The new angular frequency is:<br><br>$\\omega' = \\dfrac{1}{\\sqrt{L'C'}}$<br><br>$\\omega' = \\dfrac{1}{\\sqrt{(2L)(4C)}}$<br><br>$\\omega' = \\dfrac{1}{\\sqrt{8LC}}$<br><br>$\\omega' = \\dfrac{1}{2\\sqrt{2}\\sqrt{LC}}$<br><br>$\\omega' = \\dfrac{\\omega}{2\\sqrt{2}}$<br><br>Answer: $\\frac{\\omega}{2 \\sqrt{2}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bd6bf9280d7f9932ce4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The frequency at resonance for the circuit is\n\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/7qK_lVu_tZkP_qJxXSlSTfN5
