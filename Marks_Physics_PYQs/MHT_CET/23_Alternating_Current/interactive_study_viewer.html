944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "In LCR resonant circuit, the current and voltage have phase difference", "image": null}, "options": [{"id": "7ADp4", "text": "$\\frac{\\pi}{4}$", "image": null, "isCorrect": false}, {"id": "uUQsS", "text": "$\\frac{\\pi}{2}$", "image": null, "isCorrect": false}, {"id": "B1OMM", "text": "$-\\frac{\\pi}{2}$", "image": null, "isCorrect": false}, {"id": "oFYlg", "text": "zero", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In a series LCR circuit, the phase difference $\\phi$ between the voltage and the current is given by $\\tan \\phi = \\dfrac{X_L - X_C}{R}$.<br><br>At resonance, the inductive reactance is equal to the capacitive reactance, i.e., $X_L = X_C$.<br><br>Substituting this condition, we get $\\tan \\phi = 0$.<br><br>This implies $\\phi = 0$.<br><br>Thus, the current and voltage are in phase, and the phase difference is zero.<br><br>Answer: zero", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213b90aee93fa0796db07", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "An e.m.f. $E=E_0 \\cos \\omega t$ is applied to the L-R circuit. The inductive reactance is equal to the resistance ' $R$ ' of the 'circuit. The power consumed in the circuit is", "image": null}, "options": [{"id": "DW6kU", "text": "$\\dfrac{\\mathrm{E}_0^2}{\\sqrt{2} \\mathrm{R}}$", "image": null, "isCorrect": false}, {"id": "M4zeX", "text": "$\\dfrac{\\mathrm{E}_0^2}{2 \\mathrm{R}}$", "image": null, "isCorrect": false}, {"id": "PmovJ", "text": "$\\dfrac{\\mathrm{E}_0^2}{4 \\mathrm{R}}$", "image": null, "isCorrect": true}, {"id": "0A34b", "text": "$\\dfrac{\\mathrm{E}_0^2}{\\mathrm{R}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $E = E_0 \\cos \\omega t$ and $X_L = R$.<br><br>The impedance of the L-R circuit is given by $Z = \\sqrt{R^2 + X_L^2}$.<br><br>Substituting $X_L = R$, we get $Z = \\sqrt{R^2 + R^2} = \\sqrt{2}R$.<br><br>The rms voltage is $E_{rms} = \\dfrac{E_0}{\\sqrt{2}}$.<br><br>The rms current in the circuit is $I_{rms} = \\dfrac{E_{rms}}{Z} = \\dfrac{E_0 / \\sqrt{2}}{\\sqrt{2}R} = \\dfrac{E_0}{2R}$.<br><br>The power consumed in the circuit is $P = I_{rms}^2 R$.<br><br>$P = \\left(\\dfrac{E_0}{2R}\\right)^2 R = \\dfrac{E_0^2}{4R^2} R = \\dfrac{E_0^2}{4R}$.<br><br>Answer: $\\dfrac{\\mathrm{E}_0^2}{4 \\mathrm{R}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213a90aee93fa0796da8b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "An e.m.f. $E=E_0 \\cos \\omega t$ is applied to circuit containing $L$ and $R$ in series. If $X_L=2 R$, then the power dissipated in the circuit is", "image": null}, "options": [{"id": "PS3Yk", "text": "$\\dfrac{E_o{ }^2}{12 R}$", "image": null, "isCorrect": false}, {"id": "PTUlU", "text": "$\\dfrac{\\mathrm{E}_0{ }^2}{10 \\mathrm{R}}$", "image": null, "isCorrect": true}, {"id": "ompmO", "text": "$\\dfrac{\\mathrm{E}_0{ }^2}{8 \\mathrm{R}}$", "image": null, "isCorrect": false}, {"id": "nYs0C", "text": "$\\dfrac{E_0{ }^2}{6 R}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The impedance of the series LR circuit is given by $Z = \\sqrt{R^2 + X_L^2}$.<br><br>Given $X_L = 2R$, we have $Z = \\sqrt{R^2 + (2R)^2} = \\sqrt{5}R$.<br><br>The rms voltage is $E_{rms} = \\dfrac{E_0}{\\sqrt{2}}$.<br><br>The rms current in the circuit is $I_{rms} = \\dfrac{E_{rms}}{Z} = \\dfrac{E_0}{\\sqrt{2} \\sqrt{5} R} = \\dfrac{E_0}{\\sqrt{10} R}$.<br><br>The power dissipated in the circuit is $P = I_{rms}^2 R$.<br><br>Substituting the value of $I_{rms}$, we get $P = \\left( \\dfrac{E_0}{\\sqrt{10} R} \\right)^2 R = \\dfrac{E_0^2}{10 R^2} R = \\dfrac{E_0^2}{10 R}$.<br><br>Answer: $\\dfrac{\\mathrm{E}_0{ }^2}{10 \\mathrm{R}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213930aee93fa0796d9d8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "Average power associated with an ideal inductor and ideal capacitor over a complete cycle of a.c. is respectively", "image": null}, "options": [{"id": "SsDfM", "text": "zero, one", "image": null, "isCorrect": false}, {"id": "mO84z", "text": "one, zero", "image": null, "isCorrect": false}, {"id": "Te95d", "text": "zero, zero", "image": null, "isCorrect": true}, {"id": "e7S0s", "text": "one, one", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Average power in an a.c. circuit is given by $P_{avg} = V_{rms} I_{rms} \\cos \\phi$, where $\\phi$ is the phase difference between voltage and current.<br><br>For an ideal inductor, the phase difference between voltage and current is $\\dfrac{\\pi}{2}$. Therefore, $\\cos \\phi = \\cos \\left(\\dfrac{\\pi}{2}\\right) = 0$, which gives $P_{avg} = 0$.<br><br>For an ideal capacitor, the phase difference between voltage and current is also $\\dfrac{\\pi}{2}$. Therefore, $\\cos \\phi = \\cos \\left(\\dfrac{\\pi}{2}\\right) = 0$, which gives $P_{avg} = 0$.<br><br>Thus, the average power associated with both an ideal inductor and an ideal capacitor over a complete cycle is zero.<br><br>Answer: zero, zero", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792137f0aee93fa0796d940", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "An alternating current is given by $I=100 \\sin (50 \\pi t)$. How many times will the current become zero in one second?", "image": null}, "options": [{"id": "zce6g", "text": "50 times", "image": null, "isCorrect": true}, {"id": "VD6EX", "text": "25 times", "image": null, "isCorrect": false}, {"id": "jOCmp", "text": "40 times", "image": null, "isCorrect": false}, {"id": "3qhKb", "text": "100 times", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given equation of the alternating current is $I = 100 \\sin(50 \\pi t)$.<br><br>Comparing this with the standard equation $I = I_0 \\sin(\\omega t)$, we get:<br><br>$\\omega = 50 \\pi$<br><br>$2 \\pi f = 50 \\pi$<br><br>$f = 25 \\text{ Hz}$<br><br>The frequency of the current is $25 \\text{ Hz}$, which means it completes $25$ cycles in one second.<br><br>In one complete cycle, an alternating current becomes zero twice.<br><br>Therefore, the number of times the current becomes zero in one second is $2 \\times 25 = 50$.<br><br>Answer: 50 times", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792135e0aee93fa0796d840", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "A 42 mH inductor is connected to $200 \\mathrm{~V}, 50 \\mathrm{~Hz}$ a.c. supply. The r.m.s. value of current in the circuit will be nearly [ Take $\\pi=\\dfrac{22}{7}$ ]", "image": null}, "options": [{"id": "gOYL5", "text": "$15.15 \\mathrm{~A}$", "image": null, "isCorrect": true}, {"id": "8mZmP", "text": "$9.15 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "Zqg3A", "text": "8.15 A", "image": null, "isCorrect": false}, {"id": "AY3aR", "text": "6.15 A", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $L = 42 \\times 10^{-3} \\text{ H}$, $V_{\\text{rms}} = 200 \\text{ V}$, and $f = 50 \\text{ Hz}$.<br><br>The inductive reactance is given by:<br><br>$X_L = 2 \\pi f L$<br><br>Substituting the given values:<br><br>$X_L = 2 \\times \\dfrac{22}{7} \\times 50 \\times 42 \\times 10^{-3}$<br><br>$X_L = 100 \\times \\dfrac{22}{7} \\times 42 \\times 10^{-3}$<br><br>$X_L = 100 \\times 22 \\times 6 \\times 10^{-3} = 13.2 \\text{ } \\Omega$<br><br>The r.m.s. value of current in the circuit is:<br><br>$I_{\\text{rms}} = \\dfrac{V_{\\text{rms}}}{X_L}$<br><br>$I_{\\text{rms}} = \\dfrac{200}{13.2} = \\dfrac{2000}{132} = \\dfrac{500}{33} \\approx 15.15 \\text{ A}$<br><br>Answer: $15.15 \\mathrm{~A}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213490aee93fa0796d796", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "In an AC circuit $E = 200 \\sin(50t)$ volt and $I = 100 \\sin\\left(50t + \\dfrac{\\pi}{3}\\right)$ mA. The power dissipated in the circuit is<br>Given:<br> $\\sin 30^\\circ = \\cos 60^\\circ = 0.5$<br> $\\sin 60^\\circ = \\cos 30^\\circ = \\dfrac{\\sqrt{3}}{2}$", "image": null}, "options": [{"id": "JXZOS", "text": "20 watt", "image": null, "isCorrect": false}, {"id": "ZpMdG", "text": "15 watt", "image": null, "isCorrect": false}, {"id": "hAAWY", "text": "10 watt", "image": null, "isCorrect": false}, {"id": "tzXKe", "text": "5 watt", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given voltage, $E = 200 \\sin(50t)$ V<br><br>Given current, $I = 100 \\sin\\left(50t + \\dfrac{\\pi}{3}\\right)$ mA<br><br>Peak voltage, $E_0 = 200$ V<br><br>Peak current, $I_0 = 100$ mA $= 0.1$ A<br><br>Phase difference between voltage and current, $\\phi = \\dfrac{\\pi}{3} = 60^\\circ$<br><br>The average power dissipated in an AC circuit is given by:<br><br>$P = E_{rms} I_{rms} \\cos \\phi = \\dfrac{E_0 I_0}{2} \\cos \\phi$<br><br>Substituting the values:<br><br>$P = \\dfrac{200 \\times 0.1}{2} \\times \\cos 60^\\circ$<br><br>$P = 10 \\times 0.5 = 5$ W<br><br>Answer: 5 watt", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213350aee93fa0796d6fe", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "The current flowing in a coil is 3 A and the power consumed is 108 W . If the a.c. source is of $120 \\mathrm{~V}, 50 \\mathrm{~Hz}$, the resistance in the circuit is", "image": null}, "options": [{"id": "sq8wB", "text": "$24 \\Omega$", "image": null, "isCorrect": false}, {"id": "euonz", "text": "$36 \\Omega$", "image": null, "isCorrect": false}, {"id": "k6Q24", "text": "$12 \\Omega$", "image": null, "isCorrect": true}, {"id": "UuMKC", "text": "$6 \\Omega$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The power consumed in an AC circuit is due to the resistance only and is given by $P = I_{rms}^2 R$.<br><br>Substituting the given values:<br><br>$108 = (3)^2 \\times R$<br><br>$108 = 9 R$<br><br>$R = \\dfrac{108}{9} = 12 \\Omega$<br><br>Answer: $12 \\Omega$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213220aee93fa0796d667", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "In an A.C. circuit, the potential difference ' $V$ ' and current 'I' are given respectively by $\\mathrm{V}=100 \\sin (100 \\mathrm{t}) \\mathrm{V}, \\mathrm{I}=100 \\sin \\left(100 \\mathrm{t}+\\dfrac{\\pi}{3}\\right) \\mathrm{mA}$\r\nThe power dissipated in the circuit will be [Given $\\rightarrow \\cos \\dfrac{\\pi}{3}=\\dfrac{1}{2}$ ]", "image": null}, "options": [{"id": "hmj8J", "text": "$10^4 \\mathrm{~W}$", "image": null, "isCorrect": false}, {"id": "zL5Tf", "text": "10 W", "image": null, "isCorrect": false}, {"id": "6kvH7", "text": "2.5 W", "image": null, "isCorrect": true}, {"id": "2qOYo", "text": "5 W", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given:<br>$V = 100 \\sin(100t)$ V<br>$I = 100 \\sin\\left(100t + \\dfrac{\\pi}{3}\\right)$ mA<br><br>Peak voltage, $V_0 = 100$ V<br>Peak current, $I_0 = 100$ mA $= 0.1$ A<br>Phase difference, $\\phi = \\dfrac{\\pi}{3}$<br><br>Average power dissipated in the circuit is given by:<br>$P = V_{rms} I_{rms} \\cos \\phi$<br>$P = \\dfrac{V_0}{\\sqrt{2}} \\dfrac{I_0}{\\sqrt{2}} \\cos \\phi$<br>$P = \\dfrac{V_0 I_0}{2} \\cos \\phi$<br><br>Substituting the values:<br>$P = \\dfrac{100 \\times 0.1}{2} \\cos\\left(\\dfrac{\\pi}{3}\\right)$<br>$P = \\dfrac{10}{2} \\times \\dfrac{1}{2}$<br>$P = 2.5$ W<br><br>Answer: 2.5 W", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213200aee93fa0796d658", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "In an a.c. circuit $I=100 \\sin 200 \\pi t$. The time required for the current to achieve its peak value will be", "image": null}, "options": [{"id": "zuv78", "text": "$\\dfrac{1}{100} \\mathrm{~s}$", "image": null, "isCorrect": false}, {"id": "LT64T", "text": "$\\dfrac{1}{200} \\mathrm{~s}$", "image": null, "isCorrect": false}, {"id": "adJdz", "text": "$\\dfrac{1}{300} \\mathrm{~s}$", "image": null, "isCorrect": false}, {"id": "W2oed", "text": "$\\dfrac{1}{400} \\mathrm{~s}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given equation of alternating current is $I = 100 \\sin(200 \\pi t)$.<br><br>For the current to achieve its peak value, $I = I_0 = 100$.<br><br>$100 = 100 \\sin(200 \\pi t)$<br><br>$\\sin(200 \\pi t) = 1$<br><br>The current achieves its peak value for the first time when the phase is $\\dfrac{\\pi}{2}$.<br><br>$200 \\pi t = \\dfrac{\\pi}{2}$<br><br>$t = \\dfrac{1}{400} \\mathrm{~s}$<br><br>Answer: $\\dfrac{1}{400} \\mathrm{~s}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2627c0279619d9d8a34e9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "What will be the phase difference between virtual voltage and virtual current when current in the circuit is wattless?", "image": null}, "options": [{"id": "qbT0i", "text": "$60^ \\circ$", "image": null, "isCorrect": false}, {"id": "fW0MG", "text": "$45^ \\circ$", "image": null, "isCorrect": false}, {"id": "SWu7v", "text": "$90^ \\circ$", "image": null, "isCorrect": true}, {"id": "rZE21", "text": "$180^ \\circ$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When current in the circuit is wattless, $\\cos \\phi=0$\n$\\therefore \\quad$ Phase difference is:\n$\\phi=90^{\\circ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2627b0279619d9d8a34de", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "An alternating voltage $E=200 \\sqrt{2} \\sin (100 t)$ volt is connected to a $1 \\mu \\mathrm{f}$ capacitor through an a.c. ammeter. The reading of the ammeter shall", "image": null}, "options": [{"id": "yuYHh", "text": "$10 \\mathrm{~mA}$", "image": null, "isCorrect": false}, {"id": "kEGyV", "text": "$20 \\mathrm{~mA}$", "image": null, "isCorrect": true}, {"id": "QmR2X", "text": "$40 \\mathrm{~mA}$", "image": null, "isCorrect": false}, {"id": "aSIuz", "text": "$80 \\mathrm{~Ma}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{V}_{\\mathrm{rms}}=\\frac{\\mathrm{I}_{\\mathrm{rms}}}{\\mathrm{X}_{\\mathrm{C}}} \\\\ \\therefore \\quad \\mathrm{I}_{\\mathrm{ms}} & =\\frac{\\mathrm{V}_{\\mathrm{o}} \\omega \\mathrm{C}}{\\sqrt{2}}=\\frac{200 \\sqrt{2} \\times 100 \\times 1 \\times 10^{-6}}{\\sqrt{2}}=20 \\mathrm{~mA}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262550279619d9d8a33b0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "A group of lamps having total power rating of $1000 \\mathrm{~W}$ is supplied by an $\\mathrm{AC}$ voltage of $\\mathrm{E}=200$ $\\sin \\left(310 t+60^{\\circ}\\right)$, the r.m.s. value of current flowing through the circuit is", "image": null}, "options": [{"id": "jTfcP", "text": "$10 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "juf2H", "text": "$5 \\sqrt{2} \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "GePvo", "text": "$20 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "XxOfs", "text": "$10 \\sqrt{2} \\mathrm{~A}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Power:\n$\\mathrm{P}=\\frac{1}{2} \\mathrm{~V}_0 \\mathrm{I}_0 \\cos \\phi$\n$\\therefore \\quad 1000=\\frac{1}{2} \\times 200 \\times \\mathrm{I}_0 \\cos 60^{\\circ}$\n$\\mathrm{I}_0=20 \\mathrm{~A}$\n$\\therefore \\quad \\mathrm{I}_{\\mathrm{mms}}=\\frac{20}{\\sqrt{2}}$\n$\\mathrm{I}_{\\mathrm{rms}}=10 \\sqrt{2} \\mathrm{~A}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262520279619d9d8a3398", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "At a particular angular frequency, the reactance of capacitor and that of inductor is same. If the angular frequency is doubled, the ratio of the reactance of the capacitor to that of the inductor will be", "image": null}, "options": [{"id": "P7Pro", "text": "$\\frac{1}{4}$", "image": null, "isCorrect": true}, {"id": "plItg", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "Nm3bW", "text": "2", "image": null, "isCorrect": false}, {"id": "VlQKZ", "text": "4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We know,\n$X_L=\\omega L$                            ....(i)\n$\\Rightarrow X_L \\propto \\omega$\nSimilarly,\n$\\mathrm{X}_{\\mathrm{C}}=\\frac{1}{\\omega}$\nGiven $X_L^1=2 X_L$    $\\ldots .(\\because \\omega=2 \\omega)$\n$X_C^1=\\frac{X_c}{2}$\n$\\therefore \\quad \\frac{\\mathrm{X}_{\\mathrm{C}}^1}{\\mathrm{X}_{\\mathrm{L}}^1}=\\frac{\\frac{\\mathrm{X}_{\\mathrm{C}}}{2}}{2 \\mathrm{X}_{\\mathrm{L}}}=\\frac{1}{4}$\n                                                                                        ....(from (i))", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262440279619d9d8a3322", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "In an a.c. circuit the instantaneous current and emf are represented as $I=I_0, \\sin [\\omega t-\\pi / 6]$ and $\\mathrm{E}=\\mathrm{E}_0 \\sin [\\omega \\mathrm{t}+\\pi / 3]$ respectively. The voltage leads the current by", "image": null}, "options": [{"id": "sJ5O5", "text": "$\\frac{\\pi}{2}$", "image": null, "isCorrect": true}, {"id": "UqvQy", "text": "$\\frac{\\pi}{4}$", "image": null, "isCorrect": false}, {"id": "tLl4j", "text": "$\\frac{\\pi}{3}$", "image": null, "isCorrect": false}, {"id": "kKykH", "text": "$\\frac{\\pi}{6}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $\\phi_1=\\frac{\\pi}{6}$ and $\\phi_2=\\frac{\\pi}{3}$\n$$\n\\therefore \\quad \\Delta \\phi=\\frac{\\pi}{3}-\\left(\\frac{-\\pi}{6}\\right)=\\frac{\\pi}{2}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262320279619d9d8a328f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "Resistor of $2 \\Omega$, inductor of $100 \\mu \\mathrm{H}$ and capacitor of $400 \\mathrm{pF}$ are connected in series across a source of $\\mathrm{e}_{\\mathrm{rms}}=0.1$ Volt. At resonance, voltage drop across inductor is", "image": null}, "options": [{"id": "gUpbU", "text": "$25 \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "aLvbD", "text": "$2.5 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "zlgss", "text": "$250 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "PVW0Z", "text": "$20 \\mathrm{~V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "At resonance condition,\n$$\n\\mathrm{X}_{\\mathrm{C}}=\\mathrm{X}_{\\mathrm{L}}\n$$\n\nThe impedance is given as:\n$$\n\\begin{aligned}\n& \\mathrm{Z}=\\sqrt{\\mathrm{R}^2+\\left(\\mathrm{X}_{\\mathrm{L}}-\\mathrm{X}_{\\mathrm{C}}\\right)^2} \\\\\n& \\mathrm{Z}=\\mathrm{R}=2 \\Omega \\\\\n& \\mathrm{I}_{\\mathrm{rms}}=\\frac{\\mathrm{e}_{\\mathrm{mms}}}{\\mathrm{R}} \\\\\n& \\mathrm{I}_{\\mathrm{rms}}=\\frac{0.1}{2}=0.05 \\mathrm{~A} \\\\\n& \\omega=\\frac{1}{\\sqrt{\\mathrm{LC}}}=\\frac{1}{\\sqrt{10^{-4} \\times 4 \\times 10^{-10}}} \\\\\n& \\omega=5 \\times 10^6\n\\end{aligned}\n$$\n$\\therefore \\quad$ The voltage-drop across the inductor is,\n$$\n\\begin{aligned}\n& \\mathrm{V}=\\mathrm{I}_{\\mathrm{rms}} \\times \\mathrm{X}_{\\mathrm{L}}=\\mathrm{I}_{\\mathrm{rms}} \\times \\mathrm{L} \\omega \\\\\n& \\mathrm{V}=0.05 \\times 10^{-4} \\times 5 \\times 10^6 \\\\\n& \\mathrm{~V}=25 \\mathrm{~V}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262310279619d9d8a3288", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "An a.c. source of $15 \\mathrm{~V}, 50 \\mathrm{~Hz}$ is connected across an inductor (L) and resistance (R) in series R.M.S. current of $0.5 \\mathrm{~A}$ flows in the circuit. The phase difference between applied voltage and current is $\\left(\\frac{\\pi}{3}\\right)$ radian. The value of resistance $(R)$ is $\\left(\\tan 60^{\\circ}=\\sqrt{3}\\right)$", "image": null}, "options": [{"id": "uU69G", "text": "$10 \\Omega$", "image": null, "isCorrect": false}, {"id": "xFvrq", "text": "$12 \\Omega$", "image": null, "isCorrect": false}, {"id": "BeAPs", "text": "$15 \\Omega$", "image": null, "isCorrect": true}, {"id": "2U29A", "text": "$20 \\Omega$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given data: $\\mathrm{E}=15 \\mathrm{~V}, \\mathrm{f}=50 \\mathrm{~Hz}, \\mathrm{I}=0.5 \\mathrm{~A}$, $\\phi=\\frac{\\pi}{3} \\mathrm{rad}$\n\nImpedance is given as $Z=\\frac{E}{I}=\\frac{15}{0.5}=30 \\Omega$\n$$\n\\begin{aligned}\n& \\tan \\phi=\\frac{\\mathrm{X}_{\\mathrm{L}}}{\\mathrm{R}} \\\\\n& \\tan \\frac{\\pi}{3}=\\frac{\\mathrm{X}_{\\mathrm{L}}}{\\mathrm{R}} \\\\\n& \\sqrt{3}=\\frac{\\mathrm{X}_{\\mathrm{L}}}{\\mathrm{R}} \\\\\n& \\therefore \\quad \\mathrm{X}_{\\mathrm{L}}=\\sqrt{3} \\mathrm{R}\n\\end{aligned}\n$$\n\nThe formula for impedance is\n$$\n\\begin{array}{rl}\nZ & =\\sqrt{R^2+X_L^2} \\\\\nZ & =\\sqrt{R^2+(\\sqrt{3} R)^2} \\\\\nZ & =\\sqrt{4 R^2} \\\\\n2 & R=Z \\\\\n\\therefore \\quad R & =\\frac{Z}{2}=\\frac{30}{2}=15 \\Omega\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2622f0279619d9d8a327c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "When an inductor ' $L$ ' and a resistor ' $R$ ' in series are connected across a $15 \\mathrm{~V}, 50 \\mathrm{~Hz}$ a.c. supply, a current of $0.3 \\mathrm{~A}$ flows in the circuit. The current differs in phase from applied voltage by $\\left(\\frac{\\pi}{3}\\right)^c$. The value of ' $R$ ' is\n$$\n\\left(\\sin \\frac{\\pi}{6}=\\cos \\frac{\\pi}{3}=\\frac{1}{2}, \\sin \\frac{\\pi}{3}=\\cos \\frac{\\pi}{6}=\\frac{\\sqrt{3}}{2}\\right)\n$$", "image": null}, "options": [{"id": "CY22i", "text": "$10 \\Omega$", "image": null, "isCorrect": false}, {"id": "CHliE", "text": "$15 \\Omega$", "image": null, "isCorrect": false}, {"id": "WAdsF", "text": "$20 \\Omega$", "image": null, "isCorrect": false}, {"id": "kRUBB", "text": "$25 \\Omega$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{array}{ll} & \\text { Given: } E_v=15 \\mathrm{~V}, \\mathrm{f}=50 \\mathrm{~Hz}, \\mathrm{I}=0.3 \\mathrm{~A}, \\\\ & \\phi=\\frac{\\pi}{3} \\mathrm{rad} \\\\ & \\text { Impedance } Z=\\frac{\\mathrm{E}_{\\mathrm{v}}}{\\mathrm{I}}=\\frac{15}{0.2}=50 \\Omega \\\\ & \\tan \\phi=\\frac{\\mathrm{X}_{\\mathrm{L}}}{\\mathrm{R}} \\\\ & \\tan \\frac{\\pi}{3}=\\frac{\\mathrm{X}_{\\mathrm{L}}}{\\mathrm{R}} \\\\ & \\sqrt{3}=\\frac{\\mathrm{X}_{\\mathrm{L}}}{\\mathrm{R}} \\\\ & \\mathrm{X}_{\\mathrm{L}}=\\sqrt{3} \\mathrm{R} \\\\ & \\mathrm{Impedance} Z=\\sqrt{\\mathrm{R}^2+\\mathrm{X}_{\\mathrm{L}}^2} \\\\ & \\mathrm{Z}=\\sqrt{\\mathrm{R}^2+(\\sqrt{3} \\mathrm{R})^2} \\\\ & \\mathrm{Z}=\\sqrt{4 \\mathrm{R}^2} \\\\ 2 \\mathrm{R}=\\mathrm{Z} & \\mathrm{R}=\\frac{\\mathrm{Z}}{2}=\\frac{50}{2}=25 \\Omega \\\\ \\therefore \\quad & \\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2621f0279619d9d8a31fb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "Two inductors of $60 \\mathrm{mH}$ each are joined in parallel. The current passing through this combination is $2.2 \\mathrm{~A}$. The energy stored in this combination of inductors in joule is", "image": null}, "options": [{"id": "FZkVM", "text": "$0.0333$", "image": null, "isCorrect": false}, {"id": "PES7N", "text": "$0.0667$", "image": null, "isCorrect": false}, {"id": "WQfos", "text": "$0.0726$", "image": null, "isCorrect": true}, {"id": "vq8al", "text": "$0.0984$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\mathrm{L}_1=\\mathrm{L}_2=\\mathrm{L}=60 \\mathrm{mH}\n$$\nWhen two inductors are connected in parallel, their equivalent inductance is given by,\n$$\n\\begin{aligned}\n& \\frac{1}{\\mathrm{~L}_{\\text {eq }}}=\\frac{1}{\\mathrm{~L}_1}+\\frac{1}{\\mathrm{~L}_2} \\\\\n& \\therefore \\quad \\mathrm{L}_{\\mathrm{eq}}=\\frac{\\mathrm{L}}{2}=30 \\mathrm{mH} \\\\\n& \\mathrm{u}_{\\mathrm{B}}=\\frac{1}{2} \\mathrm{~L}_{\\mathrm{eq}} \\mathrm{I}^2 \\\\\n& \\therefore \\quad \\mathrm{u}_{\\mathrm{B}}=\\frac{1}{2} \\times 30 \\times 10^{-3} \\times 2.2 \\times 2.2 \\\\\n& \\therefore \\quad \\mathrm{u}_{\\mathrm{B}}=0.0726 \\mathrm{~J} \\\\\n&\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2621f0279619d9d8a31f6", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "An inductor of $0.5 \\mathrm{mH}$, a capacitor of $20 \\mu \\mathrm{F}$ and a resistance of $20 \\Omega$ are connected in series with a $220 \\mathrm{~V}$ a.c. source. If the current is in phase with the e.m.f. the maximum current in the circuit is $\\sqrt{x} A$. The value of ' $x$ ' is", "image": null}, "options": [{"id": "vGNLc", "text": "$44$", "image": null, "isCorrect": false}, {"id": "YYAGQ", "text": "$82$", "image": null, "isCorrect": false}, {"id": "7bYAq", "text": "$146$", "image": null, "isCorrect": false}, {"id": "GGkIV", "text": "$242$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "When current is in phase with voltage, we have\n$$\n\\begin{aligned}\n& \\mathrm{Z}=\\mathrm{R}=20 \\Omega \\\\\n& \\mathrm{e}_0=\\sqrt{2} \\mathrm{e}_{\\mathrm{rms}}=220 \\sqrt{2} \\mathrm{~V} \\\\\n& \\mathrm{i}_0=\\frac{\\mathrm{e}_0}{\\mathrm{Z}}=\\frac{220 \\sqrt{2}}{20}=11 \\sqrt{2} \\mathrm{~A} \\\\\n& \\mathrm{i}_0=\\sqrt{242} \\mathrm{~A}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2621d0279619d9d8a31e8", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "In the given circuit, r.m.s. value of current through the resistor $\\mathrm{R}$ is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/6VZp1gJQAcoHmzfD4hLc_X9mA4lSY5pWH1xmtXZJHgQ.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "X9Xa2", "text": "$2 \\mathrm{~A}$", "image": null, "isCorrect": true}, {"id": "0bUCQ", "text": "$0.5 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "rgMqx", "text": "$20\\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "rgB1r", "text": "$2 \\sqrt{2} \\mathrm{~A}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\mathrm{Z} & =\\sqrt{\\mathrm{R}^2+\\left(\\mathrm{X}_{\\mathrm{L}}-\\mathrm{X}_{\\mathrm{C}}\\right)^2} \\\\ \\mathrm{Z} & =\\sqrt{100^2+100^2} \\\\ \\mathrm{Z} & =100 \\sqrt{2} \\Omega \\\\ \\mathrm{i}_{\\mathrm{rms}} & =\\frac{\\mathrm{V}_{\\mathrm{rms}}}{\\mathrm{Z}} \\\\ \\therefore \\quad \\mathrm{i}_{\\mathrm{rms}} & =\\frac{200 \\sqrt{2}}{100 \\sqrt{2}} \\\\ \\mathrm{i}_{\\mathrm{rms}} & =2 \\mathrm{~A}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2620d0279619d9d8a3166", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "The a.c. source of e.m.f. with instantaneous value ' $e$ ' is given by $e=200 \\sin (50 t)$ volt. The r.m.s. value of current in a circuit of resistance $50 \\Omega$ is", "image": null}, "options": [{"id": "7Ij16", "text": "$0.2828 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "iwacW", "text": "$2.828 \\mathrm{~A}$", "image": null, "isCorrect": true}, {"id": "dNahO", "text": "$28.28 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "CdGfV", "text": "$282.8 \\mathrm{~A}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\therefore \\quad$ e.m.f e $=200 \\sin (50 \\mathrm{t}) \\mathrm{V}$\n$\\therefore \\quad$ Current is given by:\n$\\mathrm{I}_{\\mathrm{o}}=\\frac{\\mathrm{e}_{\\mathrm{o}}}{\\mathrm{R}}=\\frac{200}{50}=4 \\mathrm{~A}$ .....(from (i))\n$\\therefore \\quad$ R.M.S value of current:\n$I_{\\mathrm{r} . \\mathrm{ms}}=\\frac{\\mathrm{I}_{\\circ}}{\\sqrt{2}}=\\frac{4}{\\sqrt{2}}=2.828 \\mathrm{~A}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261e30279619d9d8a301d", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "The capacitive reactance of a capacitor ' $\\mathrm{C}$ ' is $\\mathrm{X} \\Omega$. Both, the frequency of a.c. supply and capacitance of the above capacitor are doubled. The new capacitive reactance will be", "image": null}, "options": [{"id": "JQJgC", "text": "$\\frac{X}{4} \\Omega$", "image": null, "isCorrect": true}, {"id": "Ou73t", "text": "$\\frac{\\mathrm{X}}{2} \\Omega$", "image": null, "isCorrect": false}, {"id": "EOYMS", "text": "$2 \\mathrm{X} \\Omega$", "image": null, "isCorrect": false}, {"id": "Rdfz7", "text": "$4 \\mathrm{X} \\Omega$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, $\\mathrm{X}_{\\mathrm{C}}=\\mathrm{X} \\Omega$\n$\\Rightarrow \\frac{1}{2 \\pi \\mathrm{fC}}=\\mathrm{X} \\Omega$\nNew Capacitance $\\mathrm{C}=2 \\mathrm{C}$ and new frequency\n$\\mathrm{f}^{\\prime}=2 \\mathrm{f}$\n$\\begin{aligned}\n\\therefore \\quad \\text { New capacitive reactance } \\mathrm{X}_{\\mathrm{C}}^{\\prime} & =\\frac{1}{2 \\pi(2 \\mathrm{f})(2 \\mathrm{C})} \\\\\n& =\\frac{1}{(2 \\pi)(4 \\mathrm{fC})} \\\\\n& =\\frac{1}{4} \\mathrm{X}_{\\mathrm{C}} \\\\\n& =\\frac{\\mathrm{X}}{4} \\Omega\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261e10279619d9d8a3012", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "With an alternating voltage source of frequency ' $\\mathrm{f}$ ', inductor ' $\\mathrm{L}$ ', capacitor ' $\\mathrm{C}$ ' and resistance ' $R$ ' are connected in series. The voltage leads the current by $45^{\\circ}$. The value of ' $L$ ' is $\\left(\\tan 45^{\\circ}=1\\right)$", "image": null}, "options": [{"id": "xfl2i", "text": "$\\left(\\frac{1+2 \\pi f \\mathrm{CR}}{4 \\pi^2 \\mathrm{f}^2 \\mathrm{C}}\\right)$", "image": null, "isCorrect": true}, {"id": "jNAfw", "text": "$\\left(\\frac{1-2 \\pi \\mathrm{fCR}}{4 \\pi^2 \\mathrm{f}^2 \\mathrm{C}}\\right)$", "image": null, "isCorrect": false}, {"id": "sbdb9", "text": "$\\left(\\frac{4 \\pi^2 \\mathrm{f}^2 \\mathrm{C}}{1+2 \\pi \\mathrm{fCR}}\\right)$", "image": null, "isCorrect": false}, {"id": "aRbCL", "text": "$\\left(\\frac{4 \\pi^2 \\mathrm{f}^2 \\mathrm{C}}{1-2 \\pi \\mathrm{fCR}}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\quad \\tan \\phi=\\frac{X_L-X_C}{R} \\\\ & \\Rightarrow \\tan 45^{\\circ}=\\left[\\frac{2 \\pi \\mathrm{fL}-\\frac{1}{2 \\pi \\mathrm{fC}}}{R}\\right] \\quad \\ldots .\\left(\\because \\phi=45^{\\circ}\\right) \\\\ & \\quad R=\\frac{(2 \\pi \\mathrm{f})^2 \\mathrm{LC}-1}{2 \\pi \\mathrm{fC}} \\\\ & \\therefore \\quad L=\\frac{2 \\pi \\mathrm{fCR}+1}{4 \\pi^2 \\mathrm{f}^2 \\mathrm{C}}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261cf0279619d9d8a2f85", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "The inductive reactance of a coil is ' $\\mathrm{X}_{\\mathrm{L}}$ '. If the inductance of a coil is tripled and frequency of a.c. supply, is doubled, then the new inductive reactance will be", "image": null}, "options": [{"id": "ReUk2", "text": "$\\frac{2}{3} X_L$", "image": null, "isCorrect": false}, {"id": "IgECo", "text": "$\\frac{3}{2} X_L$", "image": null, "isCorrect": false}, {"id": "PTg1O", "text": "$\\frac{1}{6} X_L$", "image": null, "isCorrect": false}, {"id": "eXIcR", "text": "$6 X_L$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\mathrm{X}_{\\mathrm{L}} & =\\omega \\mathrm{L}=2 \\pi \\mathrm{fL} \\\\ \\mathrm{f}_{\\text {new }} & =2 \\mathrm{f} \\text { and } \\mathrm{L}_{\\text {new }}=3 \\mathrm{~L} \\\\ \\therefore \\quad \\mathrm{X}_{\\mathrm{L}}^{\\prime} & =2 \\pi(2 \\mathrm{f}) 3 \\mathrm{~L} \\\\ & =6 \\times 2 \\pi \\mathrm{fL}=6 \\mathrm{X}_{\\mathrm{L}}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261bc0279619d9d8a2eee", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "The reactance of capacitor at $50 \\mathrm{~Hz}$ is $5 \\Omega$. If the frequency is increased to $100 \\mathrm{~Hz}$, the new reactance is", "image": null}, "options": [{"id": "moIwZ", "text": "$5 \\Omega$", "image": null, "isCorrect": false}, {"id": "sywg3", "text": "$2.5 \\Omega$", "image": null, "isCorrect": false}, {"id": "Iy91y", "text": "$10 \\Omega$", "image": null, "isCorrect": true}, {"id": "r3co5", "text": "$125 \\Omega$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n\\mathrm{X}_{\\mathrm{C}} & =\\frac{1}{2 \\pi \\mathrm{fc}} \\\\\n\\therefore \\quad \\mathrm{C} & =\\frac{1}{2 \\pi \\mathrm{f}(5)} \\quad \\ldots .\\left(\\because \\mathrm{X}_{\\mathrm{C}}=5 \\Omega\\right)\n\\end{aligned}$\nNew reactance,\n$\\mathrm{X}_{\\mathrm{C}}^{\\prime}=\\frac{1}{2 \\pi \\mathrm{f}^{\\prime} \\mathrm{C}}=\\frac{1}{2 \\pi(2 \\mathrm{f}) \\mathrm{C}}=\\frac{\\mathrm{X}_{\\mathrm{C}}}{2}=\\frac{1}{2} \\times 5=2.5 \\Omega$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261a90279619d9d8a2e56", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "A capacitor, an inductor and an electric bulb are connected in series to an a.c. supply of variable frequency. As the frequency of the supply is increased gradually, then the electric bulb is found to", "image": null}, "options": [{"id": "aS0H4", "text": "increase in brightness.", "image": null, "isCorrect": false}, {"id": "weXOl", "text": "decrease in brightness.", "image": null, "isCorrect": false}, {"id": "sFDeo", "text": "increase, reach a maximum and then decrease in brightness", "image": null, "isCorrect": true}, {"id": "TvRaz", "text": "show no change in brightness.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given circuit acts like a series LCR circuit\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/8bTxvqsjTyHzGz17nV1hBuJgZqlehZLeUGwxJrZaKgM.original.fullsize.png\"><br>\n$I=\\frac{V}{Z}=\\frac{V}{\\sqrt{R_2+\\left(\\omega L-\\frac{1}{\\omega C}\\right)^2}}$\nFrom the above formula, when $\\omega=0$, $\\mathrm{I}=$ maximum\nWhen $\\omega$ is increased, I starts to decrease and when $\\omega=\\frac{1}{\\sqrt{\\mathrm{LC}}}$ the current will be zero. This cycle will repeat going forward. So brightness will increase, reach a maximum and then decrease.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261870279619d9d8a2d4a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "The resistance offered by the inductor $\\left(X_L\\right)$ in an ac circuit is", "image": null}, "options": [{"id": "tvtSK", "text": "inversely proportional to inductance and directly proportional to the frequency of alternating current", "image": null, "isCorrect": false}, {"id": "vJZ30", "text": "inversely proportional to inductance and frequency of the alternating current", "image": null, "isCorrect": false}, {"id": "VlFyT", "text": "directly proportional to inductance and frequency of alternating current", "image": null, "isCorrect": true}, {"id": "Z4jB3", "text": "inversely proportional to frequency of alternating current and directly proportional to inductance.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The expression for inductive reactance is:\n$$\nX_{\\mathrm{L}}=2 \\pi f L\n$$\nTherefore, $X_{\\mathrm{L}} \\propto L$ and $X_{\\mathrm{L}} \\propto f$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261850279619d9d8a2d3a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "A capacitor $50 \\mu$ Fis connected to a.c. source $e=220 \\sin (50 t)(e$ in volt ,$t$ in second). The value of peak current is", "image": null}, "options": [{"id": "MWlvS", "text": "$\\frac{0.55}{\\sqrt{2}} A$", "image": null, "isCorrect": true}, {"id": "9XR4k", "text": "$\\sqrt{2}$", "image": null, "isCorrect": false}, {"id": "7fmUK", "text": "$\\frac{\\sqrt{2}}{0.55} A$", "image": null, "isCorrect": false}, {"id": "j39yq", "text": "$0.55 \\mathrm{~A}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Power source $V=220 \\sin 50 t$\n$\\therefore$ Peak voltage $V_0=220$ volt\nSo, rms voltage $\\quad V_{\\mathrm{rms}}=\\frac{V_0}{\\sqrt{2}}=\\frac{220}{\\sqrt{2}}$ volt\nAlso $\\omega=50$\n$\\therefore$ capacitive reactance $X_C=\\frac{1}{\\omega C}=\\frac{1}{50 \\times 50 \\times 10^{-6}}=400 \\Omega$\nvalue of rmscurrent $I_{r m s}=\\frac{V_{r m s}}{X_C}=\\frac{220}{\\sqrt{2} \\times 400}=\\frac{0.55}{\\sqrt{2}}$ ampere", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261710279619d9d8a2c96", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "An alternating e.m.f. is given as $e=e_0 \\sin \\omega t$. In what time, the e.m.f. will have half its maximum value if $e$ starts from zero?\n$\\left(T=\\right.$ time period, $\\left.\\sin 30^{\\circ}=\\cos 60^{\\circ}=0.5\\right)$", "image": null}, "options": [{"id": "6SqQZ", "text": "$\\frac{T}{12}$", "image": null, "isCorrect": true}, {"id": "PvLip", "text": "$\\frac{T}{8}$", "image": null, "isCorrect": false}, {"id": "s3fmW", "text": "$\\frac{T}{16}$", "image": null, "isCorrect": false}, {"id": "4SZdt", "text": "$\\frac{T}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $t^{\\prime}$ be the time when emf is half the maximum value\n$\\begin{aligned} & \\therefore \\frac{e_0}{2}=e_0 \\sin \\left(\\omega t^{\\prime}\\right) \\\\ & \\Rightarrow \\frac{1}{2}=\\sin \\left(\\omega t^{\\prime}\\right) \\\\ & \\Rightarrow \\omega t^{\\prime}=\\left(\\frac{\\pi}{6}\\right) \\\\ & \\Rightarrow\\left(\\frac{2 \\pi}{T}\\right) t^{\\prime}=\\frac{\\pi}{6} \\\\ & \\Rightarrow t^{\\prime}=\\frac{T}{12}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2616f0279619d9d8a2c87", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "The coil of inductance $0.25 \\mathrm{mH}$ has a reactance of $330 \\Omega$, when connected to an a.c. source. The frequency of a.c. source is (Take $\\left.\\pi=\\frac{22}{7}\\right)$", "image": null}, "options": [{"id": "JySJt", "text": "$210 \\mathrm{kHz}$", "image": null, "isCorrect": true}, {"id": "AsCu0", "text": "$105 \\mathrm{kHz}$", "image": null, "isCorrect": false}, {"id": "6QmT6", "text": "$420 \\mathrm{kHz}$", "image": null, "isCorrect": false}, {"id": "8rLb0", "text": "$330 \\mathrm{kHz}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We know inductive reactance is given by $X_L=2 \\pi f L$, where $f$ is the frequency of the source and $L$ the inductance of the coil.\n$f=\\frac{X_L}{2 \\pi L}$\nGiven, $L=0.25 \\mathrm{mH}$ and $C=330 \\Omega$,\n$f=\\frac{330 \\Omega}{2 \\pi(0.25 \\mathrm{mH})}=210 \\mathrm{kHz}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261610279619d9d8a2c14", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "The frequency for which a $5 \\mu \\mathrm{F}$ capacitor has a reactance of $\\frac{1}{1000} \\Omega$ is given by", "image": null}, "options": [{"id": "o8ZiM", "text": "$\\frac{1}{1000} \\mathrm{~Hz}$", "image": null, "isCorrect": false}, {"id": "46EDk", "text": "$1000 \\mathrm{~Hz}$", "image": null, "isCorrect": false}, {"id": "j76TE", "text": "$\\frac{100}{\\pi} \\mathrm{MHz}$", "image": null, "isCorrect": true}, {"id": "QOwUz", "text": "$\\frac{1000}{\\pi} \\mathrm{Hz}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Concept: reactance of capacitor is\n$X_c=\\frac{1}{\\omega c}=\\frac{1}{2 \\pi f C}$\nGiven $X_c=10^{-3} \\Omega, C=5 \\times 10^{-6} \\mathrm{~F}$\n$\\begin{aligned}\n& \\therefore 10^{-3} \\Omega=\\frac{1}{2 \\pi \\mathrm{f}\\left(5 \\times 10^{-6}\\right)} \\\\\n& \\Rightarrow \\mathrm{f}=\\frac{1}{10 \\pi \\times 10^{-9}} \\mathrm{~Hz}=\\frac{10^8}{\\pi} \\mathrm{Hz}=\\frac{100}{\\pi} \\mathrm{MHz}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2614d0279619d9d8a2b75", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "An alternating voltage of $22 \\mathrm{~V}$ is applied across an inductance coil of reactance $11 \\Omega$. If the inductance of the coil is $0.07 \\mathrm{H}$, the frequency of alternating voltage is", "image": null}, "options": [{"id": "ravUf", "text": "$25 \\mathrm{~Hz}$", "image": null, "isCorrect": true}, {"id": "iDnSC", "text": "$40 \\mathrm{~Hz}$", "image": null, "isCorrect": false}, {"id": "u7mtX", "text": "$50 \\mathrm{~Hz}$", "image": null, "isCorrect": false}, {"id": "UsUlO", "text": "$20 \\mathrm{~Hz}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The inductive reactance is\n$\\begin{aligned}\n& X_L=\\omega L \\\\\n& \\omega=2 \\pi f \\\\\n& \\therefore 2 \\pi f L=X_L \\\\\n& \\Rightarrow f=\\frac{X_L}{2 \\pi L}=\\frac{11}{2 \\pi(0.07)} \\mathrm{Hz}=25 \\mathrm{~Hz}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2613d0279619d9d8a2aee", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "In an a. c. circuit the instantaneous current and e.m.f. are represented as $i=i_o \\sin \\left(\\omega t-\\frac{\\pi}{6}\\right)$ and $E=E_o \\sin \\left(\\omega t+\\frac{\\pi}{3}\\right)$ respectively. The voltage leads the current by", "image": null}, "options": [{"id": "KsctK", "text": "$\\frac{\\pi}{2}$", "image": null, "isCorrect": true}, {"id": "anNMx", "text": "$\\frac{\\pi}{4}$", "image": null, "isCorrect": false}, {"id": "LYGyY", "text": "$\\frac{\\pi}{3}$", "image": null, "isCorrect": false}, {"id": "S26bP", "text": "$\\frac{\\pi}{6}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The phase of the current $=-\\frac{\\pi}{6}$\nThe phase of voltage $=+\\frac{\\pi}{3}$\nHence the voltage leads current by phase angle\n$\\phi=\\left(\\frac{\\pi}{6}\\right)-\\left(-\\frac{\\pi}{3}\\right)=\\frac{\\pi}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261290279619d9d8a2a4c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "The average value of a.c. voltage is given by $\\mathrm{V}=\\mathrm{V}_{\\mathrm{m}} \\sin (\\omega \\mathrm{t})$ over time interval $t=0$ to $=\\frac{\\pi}{\\omega}$ is", "image": null}, "options": [{"id": "Xyq3e", "text": "$\\frac{\\mathrm{v}_{\\mathrm{m}}}{\\pi}$", "image": null, "isCorrect": false}, {"id": "bkHub", "text": "$0$", "image": null, "isCorrect": false}, {"id": "f3BM2", "text": "$\\mathrm{V}_{\\mathrm{m}}$", "image": null, "isCorrect": false}, {"id": "taJHO", "text": "$\\frac{2 \\mathrm{~V}_{\\mathrm{m}}}{\\pi}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "What is the average value of ac voltage $\\mathrm{V}=\\mathrm{V}_0 \\sin \\omega \\mathrm{t}$ over the\ntime interval $t=0$ to $t=\\frac{\\pi}{\\omega}$\n$\\begin{aligned} & \\mathrm{V}_{\\mathrm{av}}=\\frac{\\int_0^{\\frac{\\pi}{\\omega}} \\mathrm{Vdt}}{\\int_0^{\\frac{\\pi}{\\omega}} \\mathrm{dt}}=\\frac{\\int_0^{\\frac{\\pi}{\\omega}} \\mathrm{V}_0 \\sin \\omega t \\mathrm{dt}}{[\\mathrm{t}]_0^{\\pi / \\omega}} \\\\ & =\\frac{\\mathrm{V}_0\\left\\{-\\frac{\\cos \\omega \\mathrm{t}}{\\omega}\\right\\}_0^\\omega}{\\omega} \\\\ & =-\\frac{\\mathrm{V}_0}{\\pi}[\\cos \\pi-\\cos 0]\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261130279619d9d8a299d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}], "question": {"text": "The instantaneous values of current and voltage in an AC circuit are given by $I=6 \\sin \\left(100 \\pi t+\\frac{\\pi}{4}\\right)$ and $V=5 \\sin \\left(100 \\pi t-\\frac{\\pi}{4}\\right)$, then", "image": null}, "options": [{"id": "0Gqdi", "text": "voltage leads the current by $45^{\\circ}$", "image": null, "isCorrect": false}, {"id": "4yZl3", "text": "current leads the voltage by $45^{\\circ}$", "image": null, "isCorrect": false}, {"id": "AOZPH", "text": "voltage leads the current by $90^{\\circ}$", "image": null, "isCorrect": false}, {"id": "2KOzT", "text": "current leads the voltage by $90^{\\circ}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The phase difference between instantaneous value of $I$ and $V$ is\n$\\Delta \\phi=\\frac{\\pi}{4}-\\left(-\\frac{\\pi}{4}\\right)=\\frac{\\pi}{2}$\nHence, the current leads voltage by $90^{\\circ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261040279619d9d8a2925", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "When a.c. source is connected across a pure resistor, the correct phase relation between current $\\left(i_R\\right)$ and voltage $\\left(e_R\\right)$ is shown in figure\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/DEiW0BjPEBq1MApCDm6cjo7ThWDN4kQe5AWDmVcFGOY.original.fullsize.png\">", "image": null}, "options": [{"id": "tD68q", "text": "(B)", "image": null, "isCorrect": false}, {"id": "E0M56", "text": "(D)", "image": null, "isCorrect": false}, {"id": "gZxsg", "text": "(A)", "image": null, "isCorrect": true}, {"id": "tMseM", "text": "(C)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a pure resistor current and voltages are in phase.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260c90279619d9d8a274b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "An alternating e.m.f. is $\\mathrm{e}=\\mathrm{e}_0 \\sin \\omega \\mathrm{t}$. In what time the e.m.f. will have half its maximum value, if ' $\\mathrm{e}$ ' starts from zero? ( $\\mathrm{T}=$ time period)", "image": null}, "options": [{"id": "z2zm7", "text": "$\\frac{\\mathrm{T}}{12}$", "image": null, "isCorrect": true}, {"id": "rDudq", "text": "$\\frac{T}{16}$", "image": null, "isCorrect": false}, {"id": "PtCP9", "text": "$\\frac{T}{4}$", "image": null, "isCorrect": false}, {"id": "49W8t", "text": "$\\frac{T}{8}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{e}=\\mathrm{e}_0 \\sin \\omega \\mathrm{t}$\nIf $\\mathrm{e}=\\frac{\\mathrm{e}_0}{2}$ then $\\frac{\\mathrm{e}_0}{2}=\\mathrm{e}_0 \\sin \\omega \\mathrm{t}$\n$\\begin{aligned} & \\sin \\omega \\mathrm{t}=\\frac{1}{2} \\\\ & \\omega \\mathrm{t}=30^{\\circ}=\\frac{\\pi}{6} \\mathrm{rad} \\\\ & \\frac{2 \\pi}{\\mathrm{T}} \\cdot \\mathrm{t}=\\frac{\\pi}{6} \\\\ & \\mathrm{t}=\\frac{\\mathrm{T}}{12}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260a40279619d9d8a2624", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "If we increase the frequency of an a.c. supply, then inductive reactance", "image": null}, "options": [{"id": "YoAGc", "text": "increased directly with the square of frequency", "image": null, "isCorrect": false}, {"id": "RE1qv", "text": "increases as it directly proportional to frequency", "image": null, "isCorrect": true}, {"id": "Ch8U3", "text": "decreases inversely with the square of frequency", "image": null, "isCorrect": false}, {"id": "HW0iL", "text": "decreases as it is inversely proportional to the frequency", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Inductive reactance $\\mathrm{X}_{\\mathrm{L}}=2 \\pi \\mathrm{fL}$ $\\therefore \\mathrm{X}_{\\mathrm{L}} \\propto \\mathrm{f}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260950279619d9d8a25ae", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "The peak value of an alternating emf ' $\\mathrm{e}$ ' given by $\\mathrm{e}=\\mathrm{e}_0 \\cos \\omega \\mathrm{t}$ is 10 volt and its frequency is $50 \\mathrm{~Hz}$. At time $\\mathrm{t}=\\frac{1}{600} \\mathrm{~s}$, the instantaneous e.m.f is", "image": null}, "options": [{"id": "d1Dfk", "text": "10 V", "image": null, "isCorrect": false}, {"id": "ebdY2", "text": "$\\frac{10}{\\sqrt{3}} \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "Fop7C", "text": "5 V", "image": null, "isCorrect": false}, {"id": "yw47Y", "text": "$5 \\sqrt{3} \\mathrm{~V}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{e}=\\mathrm{e}_0 \\cos \\omega \\mathrm{t}=10 \\cos 2 \\pi \\mathrm{ft} \\\\ & \\mathrm{f}=50 \\mathrm{~Hz}, \\mathrm{t}=\\frac{1}{600} \\mathrm{~s} \\\\ & \\therefore \\mathrm{e}=10 \\cos 100 \\pi \\times \\frac{1}{600}=10 \\cos \\frac{\\pi}{6}=5 \\sqrt{3} \\mathrm{~V}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260810279619d9d8a250c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "A parallel plate capacitor having plates of radius $6 \\mathrm{~cm}$ has capacitance $100 \\mathrm{pF}$. It is connected to $230 \\mathrm{~V}$ a.c. supply with angular frequency $300 \\mathrm{rad} / \\mathrm{s}$. the r.m.s. value of current is", "image": null}, "options": [{"id": "IGeSy", "text": "$6.9 \\times 10^{-6} \\mathrm{~A}$", "image": null, "isCorrect": true}, {"id": "krxmD", "text": "$2.3 \\times 10^{-5} \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "uFxmZ", "text": "$6.9 \\times 10^{-5} \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "BXC9O", "text": "$6.9 \\times 10^{-7} \\mathrm{~A}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{i}=\\frac{\\mathrm{V}}{\\mathrm{X}_{\\mathrm{C}}}=\\mathrm{V} \\omega \\mathrm{C} \\\\ & =230 \\times 300 \\times 100 \\times 10^{-12} Å \\\\ & =6.9 \\times 10^{-6} Å\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2605e0279619d9d8a23eb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "The instantaneous value of an alternating current is given by $\\mathrm{I}=50 \\sin (100 \\pi \\mathrm{t})$. It will achieve a value of $25 \\mathrm{~A}$ after a time interval of $\\left(\\sin 30^{\\circ}=0.5\\right)$", "image": null}, "options": [{"id": "tizBu", "text": "$\\frac{1}{300} \\mathrm{~S}$", "image": null, "isCorrect": false}, {"id": "dddSp", "text": "$\\frac{1}{100} \\mathrm{~S}$", "image": null, "isCorrect": false}, {"id": "MlnrR", "text": "$\\frac{1}{200} \\mathrm{~S}$", "image": null, "isCorrect": false}, {"id": "yPZzQ", "text": "$\\frac{1}{600} \\mathrm{~S}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{i}=50 \\sin 100 \\pi \\mathrm{t} \\\\ & \\therefore 25=50 \\sin 100 \\pi \\mathrm{t} \\\\ & \\frac{25}{50}=\\sin 100 \\pi \\mathrm{t} \\\\ & \\frac{1}{2}=\\sin 100 \\pi \\mathrm{t} \\\\ & 100 \\pi \\mathrm{t}=\\frac{\\pi}{6} \\\\ & \\therefore \\mathrm{t}=\\frac{1}{600} \\mathrm{~S}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260590279619d9d8a23c0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "The inductive reactance of coil is $\\mathrm{R}$. If the inductance of a coil is doubled and frequency of a.c. supply is also doubled then then new inductive reactance will", "image": null}, "options": [{"id": "gkPtg", "text": "$2 R$", "image": null, "isCorrect": false}, {"id": "PqQ7v", "text": "$8 R$", "image": null, "isCorrect": false}, {"id": "BJH1W", "text": "$\\frac{\\mathrm{R}}{2}$", "image": null, "isCorrect": false}, {"id": "Sf14c", "text": "$4 R$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Inductive reactance $=\\mathrm{R}=2 \\pi \\mathrm{fL}$\nIf $\\mathrm{L}$ and $\\mathrm{f}$ both are doubled, the inductive reactance will become $4 R$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2604a0279619d9d8a234a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "An alternating voltage is represented by $\\mathrm{V}=80 \\sin (100 \\pi \\mathrm{t})$ $\\cos (100 \\pi \\mathrm{t})$ volt. The peak voltage is", "image": null}, "options": [{"id": "CVtMk", "text": "$20 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "LulNs", "text": "$40 \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "3Mock", "text": "$30 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "eO1Jq", "text": "$50 \\mathrm{~V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\mathrm{V}=80 \\sin (100 \\pi \\mathrm{t}) \\cos (100 \\pi \\mathrm{t})=40 \\sin 200 \\pi \\mathrm{t}\n$$\nAmplitude or the peak value of the voltage $=40 \\mathrm{~V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260340279619d9d8a2296", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "When a d.c voltage of $200 \\mathrm{~V}$ is applied to a coil of self-inductance $\\left(\\frac{2 \\sqrt{3}}{\\pi}\\right) \\mathrm{H}$, a current of 1A flows through it. But by replacing d.c. source with a.c. source of $200 \\mathrm{~V}$, the current in the coil is reduced to $0.5 \\mathrm{~A}$. Then the frequency of a.c. supply is", "image": null}, "options": [{"id": "SBa2T", "text": "$100 \\mathrm{~Hz}$", "image": null, "isCorrect": false}, {"id": "w01e4", "text": "$60 \\mathrm{~Hz}$", "image": null, "isCorrect": false}, {"id": "aXr8d", "text": "$75 \\mathrm{~Hz}$", "image": null, "isCorrect": false}, {"id": "QGCcM", "text": "$50 \\mathrm{~Hz}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "When a d.c. voltage is applied\n$$\n\\mathrm{R}=\\frac{\\mathrm{V}}{1}=\\frac{200}{1}=200 \\Omega\n$$\nWhen a.c. voltage is applied\n$$\n\\begin{aligned}\n& \\mathrm{Z}=\\frac{\\mathrm{V}}{1}=\\frac{200}{0.5}=400 \\Omega \\\\\n& \\mathrm{Z}^2=\\mathrm{R}^2+\\mathrm{X}_{\\mathrm{L}}^2 \\\\\n& (400)^2=(200)^2+\\mathrm{X}_{\\mathrm{L}}^2 \\\\\n& \\mathrm{X}_{\\mathrm{L}}=200 \\sqrt{3} \\Omega \\\\\n& 2 \\pi \\mathrm{fL}=2 \\pi \\mathrm{f} \\times \\frac{2 \\sqrt{3}}{\\pi}=200 \\sqrt{3} \\\\\n& \\mathrm{f}=50 \\mathrm{~Hz}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "61
