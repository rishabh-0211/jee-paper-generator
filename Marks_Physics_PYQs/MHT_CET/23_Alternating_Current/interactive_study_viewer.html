  <script>
    const data = {"index": 23, "chapterId": "61c08988a89942e12e757293", "chapter": "Alternating Current", "exam": "MHT CET", "subject": "Physics", "totalTopics": 5, "totalQuestions": 355, "downloadTime": "2026-10-08 20:35:18", "topics": [{"index": 1, "topicId": "65a263290279619d9d8a3c87", "title": "Alternating Current, Voltage and Power", "totalQuestions": 107, "questions": [{"_id": "6abb88cf15a9fc0fc8c1472b", "type": "singleCorrect", "question": {"text": "The correct phasor diagram for an a.c. circuit containing only pure capacitor.<br><br><img style=\"width: 400px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/may/watermarked_images/20_may_shift_1__q45_d1.png\" />", "image": null}, "options": [{"id": "hQ8UC", "label": "A", "text": "(3)", "isCorrect": false, "image": null}, {"id": "GfHq2", "label": "B", "text": "(2)", "isCorrect": true, "image": null}, {"id": "13aDl", "label": "C", "text": "(1)", "isCorrect": false, "image": null}, {"id": "cPVF7", "label": "D", "text": "(4)", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In an AC circuit containing only a pure capacitor, the alternating current leads the alternating voltage by a phase angle of $\\dfrac{\\pi}{2}$ ($90^{\\circ}$).<br><br>In a phasor diagram, the phase angle is conventionally measured in the counter-clockwise direction. <br><br>Looking at the given diagrams:<br>$\\bullet$ In diagram (1), voltage $e$ leads current $i$ by $90^{\\circ}$, which represents a pure inductive circuit.<br>$\\bullet$ In diagram (2), current $i$ leads voltage $e$ by $90^{\\circ}$ (since $e$ is $90^{\\circ}$ clockwise from $i$), which correctly represents a pure capacitive circuit.<br>$\\bullet$ In diagram (3), $e$ and $i$ are in phase, representing a pure resistive circuit.<br>$\\bullet$ In diagram (4), $i$ leads $e$ by an acute angle, representing an RC series circuit.<br><br>Therefore, diagram (2) is the correct phasor diagram for a pure capacitor.<br><br>Answer: (2)", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889c15a9fc0fc8c14558", "type": "singleCorrect", "question": {"text": "The output of step-down transformer is measured to be $36$ V when connected to $6$ W light bulb. The value of peak current is", "image": null}, "options": [{"id": "BN1IO", "label": "A", "text": "$\\dfrac{1}{\\sqrt{2}} A$", "isCorrect": false, "image": null}, {"id": "gvRmX", "label": "B", "text": "$\\dfrac{1}{2\\sqrt{2}} A$", "isCorrect": false, "image": null}, {"id": "CQZvi", "label": "C", "text": "$\\dfrac{1}{3\\sqrt{2}} A$", "isCorrect": true, "image": null}, {"id": "mGScr", "label": "D", "text": "$\\dfrac{1}{4\\sqrt{2}} A$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The measured voltage of an AC source is its RMS value. Thus, $V_{rms} = 36$ V.<br><br>The power of the light bulb is $P = 6$ W.<br><br>Using the relation $P = V_{rms} I_{rms}$, the RMS current is:<br><br>$I_{rms} = \\dfrac{P}{V_{rms}} = \\dfrac{6}{36} = \\dfrac{1}{6}$ A<br><br>The peak current $I_{0}$ is related to the RMS current by $I_{0} = \\sqrt{2} I_{rms}$.<br><br>$I_{0} = \\sqrt{2} \\times \\dfrac{1}{6} = \\dfrac{\\sqrt{2}}{6} = \\dfrac{1}{3\\sqrt{2}}$ A<br><br>Answer: $\\dfrac{1}{3\\sqrt{2}} A$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883f15a9fc0fc8c141e2", "type": "singleCorrect", "question": {"text": "An alternating voltage is given by $V = V_0 \\sin\\left(\\omega t + \\dfrac{\\pi}{4}\\right)$. The time when the voltage is maximum for the first time is<br>($T$ = periodic time of the alternating voltage, $\\cos 0^\\circ = \\sin 90^\\circ = 1$)", "image": null}, "options": [{"id": "7tZ75", "label": "A", "text": "$\\dfrac{T}{4}$", "isCorrect": false, "image": null}, {"id": "XdNYU", "label": "B", "text": "$\\dfrac{T}{6}$", "isCorrect": false, "image": null}, {"id": "zJGmq", "label": "C", "text": "$\\dfrac{T}{8}$", "isCorrect": true, "image": null}, {"id": "YSuCU", "label": "D", "text": "$\\dfrac{T}{12}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given alternating voltage is $V = V_0 \\sin\\left(\\omega t + \\dfrac{\\pi}{4}\\right)$.<br><br>The voltage is maximum when the sine term is equal to $1$. For the first maximum, the phase angle must be $\\dfrac{\\pi}{2}$.<br><br>$\\omega t + \\dfrac{\\pi}{4} = \\dfrac{\\pi}{2}$<br><br>$\\omega t = \\dfrac{\\pi}{2} - \\dfrac{\\pi}{4} = \\dfrac{\\pi}{4}$<br><br>Substituting $\\omega = \\dfrac{2\\pi}{T}$:<br><br>$\\dfrac{2\\pi}{T} t = \\dfrac{\\pi}{4}$<br><br>$t = \\dfrac{T}{8}$<br><br>Answer: $\\dfrac{T}{8}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884f15a9fc0fc8c1427d", "type": "singleCorrect", "question": {"text": "An AC source is $120$ V - $60$ Hz. The value of voltage after $\\dfrac{1}{720}$ s from start will be $\\left(\\sin 30^\\circ = \\dfrac{1}{2}\\right)$", "image": null}, "options": [{"id": "lOlI7", "label": "A", "text": "$20.2\\,V$", "isCorrect": false, "image": null}, {"id": "3xMwt", "label": "B", "text": "$42.4\\,V$", "isCorrect": false, "image": null}, {"id": "B7ISx", "label": "C", "text": "$84.8\\,V$", "isCorrect": true, "image": null}, {"id": "4wehT", "label": "D", "text": "$106.9\\,V$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $V_{rms} = 120$ V and $f = 60$ Hz.<br><br>Peak voltage $V_0 = V_{rms} \\sqrt{2} = 120 \\sqrt{2}$ V.<br><br>Angular frequency $\\omega = 2 \\pi f = 2 \\pi \\times 60 = 120 \\pi$ rad/s.<br><br>The instantaneous voltage is given by $V = V_0 \\sin(\\omega t)$.<br><br>Substituting $t = \\dfrac{1}{720}$ s:<br><br>$V = 120 \\sqrt{2} \\sin\\left(120 \\pi \\times \\dfrac{1}{720}\\right)$<br><br>$V = 120 \\sqrt{2} \\sin\\left(\\dfrac{\\pi}{6}\\right)$<br><br>$V = 120 \\sqrt{2} \\times \\dfrac{1}{2} = 60 \\sqrt{2}$ V.<br><br>Using $\\sqrt{2} \\approx 1.414$:<br><br>$V = 60 \\times 1.414 = 84.84$ V.<br><br>Answer: $84.8\\,V$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884f15a9fc0fc8c1427b", "type": "singleCorrect", "question": {"text": "An alternating voltage $V = 200\\sqrt{2}\\sin(100t)$ volt is connected to $1\\,\\mu F$ capacitor through ammeter (AC). The reading of ammeter is (in mA)", "image": null}, "options": [{"id": "8o4Sf", "label": "A", "text": "$5$", "isCorrect": false, "image": null}, {"id": "LiWB3", "label": "B", "text": "$10$", "isCorrect": false, "image": null}, {"id": "1pFAC", "label": "C", "text": "$15$", "isCorrect": false, "image": null}, {"id": "VxkVI", "label": "D", "text": "$20$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given alternating voltage $V = 200\\sqrt{2}\\sin(100t)$ V.<br><br>The peak voltage $V_{0} = 200\\sqrt{2}$ V and angular frequency $\\omega = 100$ rad/s.<br><br>The RMS voltage is $V_{rms} = \\dfrac{V_{0}}{\\sqrt{2}} = \\dfrac{200\\sqrt{2}}{\\sqrt{2}} = 200$ V.<br><br>The capacitive reactance is $X_{C} = \\dfrac{1}{\\omega C} = \\dfrac{1}{100 \\times 10^{-6}} = 10^{4} \\, \\Omega$.<br><br>The reading of the AC ammeter is the RMS current, given by $I_{rms} = \\dfrac{V_{rms}}{X_{C}}$.<br><br>$I_{rms} = \\dfrac{200}{10^{4}} = 20 \\times 10^{-3}$ A = $20$ mA.<br><br>Answer: $20$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88ac15a9fc0fc8c145ef", "type": "singleCorrect", "question": {"text": "An alternating voltage $V = 200\\sqrt{2}\\sin(100t)$ volt is connected to $1\\ \\mu F$ capacitor through a.c. ammeter. The reading of ammeter is", "image": null}, "options": [{"id": "IETGX", "label": "A", "text": "$5\\ \\text{mA}$", "isCorrect": false, "image": null}, {"id": "Eswpm", "label": "B", "text": "$10\\ \\text{mA}$", "isCorrect": false, "image": null}, {"id": "NfUH8", "label": "C", "text": "$15\\ \\text{mA}$", "isCorrect": false, "image": null}, {"id": "UjBb0", "label": "D", "text": "$20\\ \\text{mA}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given alternating voltage is $V = 200\\sqrt{2}\\sin(100t)$.<br><br>Comparing with the standard equation $V = V_0\\sin(\\omega t)$, we get:<br><br>Peak voltage, $V_0 = 200\\sqrt{2}\\ \\text{V}$<br><br>Angular frequency, $\\omega = 100\\ \\text{rad/s}$<br><br>The rms voltage is $V_{rms} = \\dfrac{V_0}{\\sqrt{2}} = \\dfrac{200\\sqrt{2}}{\\sqrt{2}} = 200\\ \\text{V}$.<br><br>The capacitive reactance is $X_C = \\dfrac{1}{\\omega C} = \\dfrac{1}{100 \\times 10^{-6}} = 10^4\\ \\Omega$.<br><br>The reading of the a.c. ammeter is the rms current, which is given by:<br><br>$I_{rms} = \\dfrac{V_{rms}}{X_C} = \\dfrac{200}{10^4} = 2 \\times 10^{-2}\\ \\text{A}$<br><br>$I_{rms} = 20\\ \\text{mA}$<br><br>Answer: $20\\ \\text{mA}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886d15a9fc0fc8c1439b", "type": "singleCorrect", "question": {"text": "An alternating voltage is $E = 100\\sin\\left(\\omega t + \\dfrac{\\pi}{6}\\right)$ V. The voltage will be maximum for the first time when t is<br>$\\left(\\sin\\dfrac{\\pi}{2} = 1\\right)$ (T = Periodic time)", "image": null}, "options": [{"id": "Y9QRc", "label": "A", "text": "$\\dfrac{T}{12}$", "isCorrect": false, "image": null}, {"id": "4Ncu8", "label": "B", "text": "$\\dfrac{T}{2}$", "isCorrect": false, "image": null}, {"id": "WZWj1", "label": "C", "text": "$\\dfrac{T}{6}$", "isCorrect": true, "image": null}, {"id": "49Eos", "label": "D", "text": "$\\dfrac{T}{3}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given alternating voltage is $E = 100\\sin\\left(\\omega t + \\dfrac{\\pi}{6}\\right)$.<br><br>The voltage will be maximum when $\\sin\\left(\\omega t + \\dfrac{\\pi}{6}\\right) = 1$.<br><br>For the first maximum, the phase angle must be $\\dfrac{\\pi}{2}$.<br><br>$\\omega t + \\dfrac{\\pi}{6} = \\dfrac{\\pi}{2}$<br><br>$\\omega t = \\dfrac{\\pi}{2} - \\dfrac{\\pi}{6} = \\dfrac{\\pi}{3}$<br><br>Substituting $\\omega = \\dfrac{2\\pi}{T}$:<br><br>$\\dfrac{2\\pi}{T} t = \\dfrac{\\pi}{3}$<br><br>$t = \\dfrac{T}{6}$<br><br>Answer: $\\dfrac{T}{6}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887c15a9fc0fc8c14428", "type": "singleCorrect", "question": {"text": "In an a.c. circuit, if the frequency is doubled, what happens to the capacitive reactance ($X_c$) and the current ($I$)?", "image": null}, "options": [{"id": "HJr1P", "label": "A", "text": "$X_c$ is halved and $I$ is doubled", "isCorrect": true, "image": null}, {"id": "1PRcg", "label": "B", "text": "$X_c$ is doubled, $I$ is halved", "isCorrect": false, "image": null}, {"id": "PBu4j", "label": "C", "text": "Both $X_c$ and $I$ are halved", "isCorrect": false, "image": null}, {"id": "LmSFb", "label": "D", "text": "Both $X_c$ and $I$ are doubled", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The capacitive reactance is given by $X_c = \\dfrac{1}{\\omega C} = \\dfrac{1}{2\\pi f C}$.<br><br>When the frequency $f$ is doubled, the new capacitive reactance becomes $X_c' = \\dfrac{1}{2\\pi (2f) C} = \\dfrac{X_c}{2}$. Thus, the capacitive reactance is halved.<br><br>The current in the circuit is given by $I = \\dfrac{V}{X_c}$.<br><br>With the new capacitive reactance, the new current is $I' = \\dfrac{V}{X_c'} = \\dfrac{V}{\\dfrac{X_c}{2}} = 2 \\left(\\dfrac{V}{X_c}\\right) = 2I$.<br><br>Therefore, the current is doubled.<br><br>Answer: $X_c$ is halved and $I$ is doubled", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887c15a9fc0fc8c14427", "type": "singleCorrect", "question": {"text": "A resistance of $20\\,\\Omega$ is connected to a source of alternating potential $V = 220\\sin(100\\pi t)$. The time taken by current to change from its peak value to r.m.s. value is $\\left(\\sin\\dfrac{\\pi}{4} = \\dfrac{1}{\\sqrt{2}}\\right)$", "image": null}, "options": [{"id": "o1R5J", "label": "A", "text": "$0.2$ s", "isCorrect": false, "image": null}, {"id": "2zmeM", "label": "B", "text": "$0.25$ s", "isCorrect": false, "image": null}, {"id": "fpIVb", "label": "C", "text": "$25 \\times 10^{-3}$ s", "isCorrect": false, "image": null}, {"id": "10MuL", "label": "D", "text": "$2.5 \\times 10^{-3}$ s", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The alternating current in the purely resistive circuit is given by $I = I_0 \\sin(100\\pi t)$.<br><br>The angular frequency is $\\omega = 100\\pi$ rad/s.<br><br>The time period of the alternating current is $T = \\dfrac{2\\pi}{\\omega} = \\dfrac{2\\pi}{100\\pi} = \\dfrac{1}{50}$ s.<br><br>The time taken by the current to change from its peak value $I_0$ to its r.m.s. value $\\dfrac{I_0}{\\sqrt{2}}$ is equivalent to the time taken for the phase to change by $\\dfrac{\\pi}{4}$.<br><br>$\\Delta t = \\dfrac{T}{8} = \\dfrac{1}{8 \\times 50} = \\dfrac{1}{400}$ s.<br><br>$\\Delta t = 2.5 \\times 10^{-3}$ s.<br><br>Answer: $2.5 \\times 10^{-3}$ s", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88bd15a9fc0fc8c1468a", "type": "singleCorrect", "question": {"text": "A capacitor of $10\\,\\mu F$ has reactance $2 \\times 10^{-3}\\,\\Omega$. The corresponding frequency is", "image": null}, "options": [{"id": "LWUP6", "label": "A", "text": "$\\dfrac{25}{\\pi}\\,MHz$", "isCorrect": true, "image": null}, {"id": "7w1k2", "label": "B", "text": "$\\dfrac{25}{\\pi}\\,Hz$", "isCorrect": false, "image": null}, {"id": "d0Sbp", "label": "C", "text": "$2.5$ MHz", "isCorrect": false, "image": null}, {"id": "SXhyO", "label": "D", "text": "$\\dfrac{2.5}{\\pi}\\,MHz$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The capacitive reactance is given by $X_C = \\dfrac{1}{2 \\pi f C}$.<br><br>Rearranging for frequency $f$:<br><br>$f = \\dfrac{1}{2 \\pi X_C C}$<br><br>Substituting the given values $X_C = 2 \\times 10^{-3}\\,\\Omega$ and $C = 10\\,\\mu F = 10^{-5}\\,F$:<br><br>$f = \\dfrac{1}{2 \\pi \\times (2 \\times 10^{-3}) \\times 10^{-5}}$<br><br>$f = \\dfrac{1}{4 \\pi \\times 10^{-8}}$<br><br>$f = \\dfrac{10^8}{4 \\pi}$<br><br>$f = \\dfrac{25 \\times 10^6}{\\pi}\\,Hz$<br><br>$f = \\dfrac{25}{\\pi}\\,MHz$<br><br>Answer: $\\dfrac{25}{\\pi}\\,MHz$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3098c30a4553e1bdf79", "type": "singleCorrect", "question": {"text": "When a.c. source is connected across a pure capacitor, the correct phase relation between current and emf is shown in figure.<br><img style=\"width: 500px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/18_april_shift_2__q43_d1.png\" />", "image": null}, "options": [{"id": "7x7xf", "label": "A", "text": "(C)", "isCorrect": false, "image": null}, {"id": "M1SNu", "label": "B", "text": "(A)", "isCorrect": false, "image": null}, {"id": "WFUuG", "label": "C", "text": "(B)", "isCorrect": true, "image": null}, {"id": "0cVCV", "label": "D", "text": "(D)", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In an AC circuit containing a pure capacitor, the alternating current leads the alternating emf by a phase angle of $\\dfrac{\\pi}{2}$ or $90^{\\circ}$.<br><br>Mathematically, if the emf is given by $e_c = E_0 \\sin(\\omega t)$, the current is given by $I_c = I_0 \\sin\\left(\\omega t + \\dfrac{\\pi}{2}\\right)$.<br><br>In a phasor diagram, the phasor representing the current $I_c$ must be rotated counterclockwise by $90^{\\circ}$ relative to the phasor representing the emf $e_c$.<br><br>Analyzing the given figures:<br>(A) $I_c$ and $e_c$ are in phase (represents a pure resistor).<br>(B) $I_c$ leads $e_c$ by $90^{\\circ}$ (represents a pure capacitor).<br>(C) $I_c$ lags $e_c$ by $90^{\\circ}$ (represents a pure inductor).<br>(D) $I_c$ and $e_c$ are out of phase by $180^{\\circ}$.<br><br>Therefore, figure (B) correctly shows the phase relation for a pure capacitor.<br><br>Answer: (B)", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3418c30a4553e1be1d0", "type": "singleCorrect", "question": {"text": "In a series LCR circuit alternating e.m.f. and current are given by the equations $V = V_0\\sin(\\omega t)$ and $I = I_0\\sin\\left(\\omega t + \\dfrac{\\pi}{3}\\right)$ respectively. The average power dissipated in the circuit over one cycle of a.c. is $(\\cos 60^\\circ = 0.5)$", "image": null}, "options": [{"id": "6iE9d", "label": "A", "text": "zero", "isCorrect": false, "image": null}, {"id": "LTStn", "label": "B", "text": "$\\dfrac{V_0 I_0}{2}$", "isCorrect": false, "image": null}, {"id": "uFPgL", "label": "C", "text": "$\\dfrac{\\sqrt{3}}{2}V_0 I_0$", "isCorrect": false, "image": null}, {"id": "sF7dj", "label": "D", "text": "$\\dfrac{V_0 I_0}{4}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The given equations for alternating e.m.f. and current are:<br><br>$V = V_0 \\sin(\\omega t)$<br><br>$I = I_0 \\sin\\left(\\omega t + \\dfrac{\\pi}{3}\\right)$<br><br>The phase difference between the voltage and current is $\\phi = \\dfrac{\\pi}{3} = 60^\\circ$.<br><br>The average power dissipated in an a.c. circuit over one cycle is given by:<br><br>$P_{avg} = V_{rms} I_{rms} \\cos \\phi$<br><br>Substituting $V_{rms} = \\dfrac{V_0}{\\sqrt{2}}$ and $I_{rms} = \\dfrac{I_0}{\\sqrt{2}}$:<br><br>$P_{avg} = \\left(\\dfrac{V_0}{\\sqrt{2}}\\right) \\left(\\dfrac{I_0}{\\sqrt{2}}\\right) \\cos 60^\\circ$<br><br>Since $\\cos 60^\\circ = \\dfrac{1}{2}$:<br><br>$P_{avg} = \\dfrac{V_0 I_0}{2} \\times \\dfrac{1}{2} = \\dfrac{V_0 I_0}{4}$<br><br>Answer: $\\dfrac{V_0 I_0}{4}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3318c30a4553e1be124", "type": "singleCorrect", "question": {"text": "An alternating e.m.f. is given by $e = e_0 \\sin\\omega t$. In what time the e.m.f. will have half its maximum value, if 'e' Starts from zero?", "image": null}, "options": [{"id": "BOLc9", "label": "A", "text": "$\\dfrac{\\text{T}}{4}$", "isCorrect": false, "image": null}, {"id": "3SJXZ", "label": "B", "text": "$\\dfrac{\\text{T}}{8}$", "isCorrect": false, "image": null}, {"id": "aeJsD", "label": "C", "text": "$\\dfrac{\\text{T}}{12}$", "isCorrect": true, "image": null}, {"id": "PO0NT", "label": "D", "text": "$\\dfrac{\\text{T}}{16}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given alternating e.m.f. is $e = e_0 \\sin\\omega t$.<br><br>The maximum value of e.m.f. is $e_0$.<br><br>We need to find the time $t$ when $e = \\dfrac{e_0}{2}$.<br><br>Substituting $e = \\dfrac{e_0}{2}$ in the given equation:<br><br>$\\dfrac{e_0}{2} = e_0 \\sin\\omega t$<br><br>$\\sin\\omega t = \\dfrac{1}{2}$<br><br>The smallest positive value for $\\omega t$ is $\\dfrac{\\pi}{6}$.<br><br>$\\omega t = \\dfrac{\\pi}{6}$<br><br>Substituting $\\omega = \\dfrac{2\\pi}{T}$:<br><br>$\\dfrac{2\\pi}{T} t = \\dfrac{\\pi}{6}$<br><br>$t = \\dfrac{T}{12}$<br><br>Answer: $\\dfrac{\\text{T}}{12}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3178c30a4553e1be011", "type": "singleCorrect", "question": {"text": "Determine the frequency for which a $10\\,\\mu\\text{F}$ capacitor has a reactance of $2 \\times 10^{-3}\\,\\Omega$.", "image": null}, "options": [{"id": "sUquE", "label": "A", "text": "$\\dfrac{25}{\\pi}$ MHz", "isCorrect": true, "image": null}, {"id": "BJFwE", "label": "B", "text": "$\\dfrac{20}{\\pi}$ MHz", "isCorrect": false, "image": null}, {"id": "JjI6k", "label": "C", "text": "$2 \\times 10^{-3}$ MHz", "isCorrect": false, "image": null}, {"id": "ENFcL", "label": "D", "text": "$10\\pi$ MHz", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The capacitive reactance is given by the formula:<br><br>$X_C = \\dfrac{1}{2\\pi f C}$<br><br>Rearranging for frequency $f$:<br><br>$f = \\dfrac{1}{2\\pi X_C C}$<br><br>Substituting the given values $X_C = 2 \\times 10^{-3} \\, \\Omega$ and $C = 10 \\, \\mu\\text{F} = 10 \\times 10^{-6} \\, \\text{F}$:<br><br>$f = \\dfrac{1}{2\\pi \\times (2 \\times 10^{-3}) \\times (10 \\times 10^{-6})}$<br><br>$f = \\dfrac{1}{4\\pi \\times 10^{-8}}$<br><br>$f = \\dfrac{10^8}{4\\pi}$<br><br>$f = \\dfrac{100 \\times 10^6}{4\\pi}$<br><br>$f = \\dfrac{25}{\\pi} \\times 10^6 \\, \\text{Hz}$<br><br>$f = \\dfrac{25}{\\pi} \\, \\text{MHz}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3168c30a4553e1be004", "type": "singleCorrect", "question": {"text": "A coil has inductive reactance $3$ H. The ratio of its reactance when it is first connected to an a.c. source and then to d.c. source is", "image": null}, "options": [{"id": "59K08", "label": "A", "text": "zero", "isCorrect": false, "image": null}, {"id": "DvOmD", "label": "B", "text": "$3$", "isCorrect": false, "image": null}, {"id": "W3goo", "label": "C", "text": "infinite", "isCorrect": true, "image": null}, {"id": "foNo2", "label": "D", "text": "$1.5$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The inductive reactance of a coil is given by $X_L = \\omega L = 2\\pi f L$, where $f$ is the frequency of the source.<br><br>For an a.c. source, the frequency $f > 0$, so the inductive reactance $X_{L(ac)}$ has a finite non-zero value.<br><br>For a d.c. source, the frequency $f = 0$, so the inductive reactance $X_{L(dc)} = 0$.<br><br>The ratio of the reactance when connected to an a.c. source to that when connected to a d.c. source is:<br><br>$\\text{Ratio} = \\dfrac{X_{L(ac)}}{X_{L(dc)}} = \\dfrac{\\omega L}{0} = \\infty$<br><br>Thus, the ratio is infinite.<br><br>Answer: infinite", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36b8c30a4553e1be38d", "type": "singleCorrect", "question": {"text": "An alternating e.m.f. is given by $e = e_0 \\sin \\omega t$. In what time the e.m.f. will have half its maximum value, if 'e' starts from zero? ($\\sin 30^\\circ = 0.5$)", "image": null}, "options": [{"id": "SKy27", "label": "A", "text": "$\\dfrac{T}{4}$", "isCorrect": false, "image": null}, {"id": "eYBKO", "label": "B", "text": "$\\dfrac{T}{8}$", "isCorrect": false, "image": null}, {"id": "T9KdY", "label": "C", "text": "$\\dfrac{T}{12}$", "isCorrect": true, "image": null}, {"id": "PNWjl", "label": "D", "text": "$\\dfrac{T}{16}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $e = e_0 \\sin \\omega t$<br><br>The maximum value of e.m.f. is $e_0$. The time $t$ when the e.m.f. reaches half of its maximum value is given by $e = \\dfrac{e_0}{2}$.<br><br>Substituting $e = \\dfrac{e_0}{2}$ in the given equation:<br><br>$\\dfrac{e_0}{2} = e_0 \\sin \\omega t$<br><br>$\\sin \\omega t = \\dfrac{1}{2}$<br><br>$\\omega t = \\dfrac{\\pi}{6}$<br><br>Substituting $\\omega = \\dfrac{2\\pi}{T}$:<br><br>$\\dfrac{2\\pi}{T} t = \\dfrac{\\pi}{6}$<br><br>$t = \\dfrac{T}{12}$<br><br>Answer: $\\dfrac{T}{12}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b58c30a4553e1bdbf3", "type": "singleCorrect", "question": {"text": "In an AC circuit $E = 50 \\sin(500 t)$, $I = 600 \\sin\\left(500 t + \\dfrac{\\pi}{3}\\right) mA$. What is the power dissipated in the circuit? [$\\cos 60^\\circ = 0.5$]", "image": null}, "options": [{"id": "7BAFi", "label": "A", "text": "$10$ W", "isCorrect": false, "image": null}, {"id": "s3Hh6", "label": "B", "text": "$75$ W", "isCorrect": false, "image": null}, {"id": "E26Bb", "label": "C", "text": "$7.5$ W", "isCorrect": true, "image": null}, {"id": "NwBGI", "label": "D", "text": "$50$ W", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The average power dissipated in an AC circuit is given by $P = E_{rms} I_{rms} \\cos \\phi$.<br><br>From the given equations, the peak voltage is $E_0 = 50$ V and the peak current is $I_0 = 600$ mA $= 0.6$ A.<br><br>The phase difference between the voltage and current is $\\phi = \\dfrac{\\pi}{3} = 60^\\circ$.<br><br>Using the relations $E_{rms} = \\dfrac{E_0}{\\sqrt{2}}$ and $I_{rms} = \\dfrac{I_0}{\\sqrt{2}}$, the power is:<br><br>$P = \\dfrac{E_0 I_0}{2} \\cos \\phi$<br><br>Substituting the values:<br><br>$P = \\dfrac{50 \\times 0.6}{2} \\cos 60^\\circ$<br><br>$P = \\dfrac{30}{2} \\times 0.5 = 15 \\times 0.5 = 7.5$ W", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be7bf9280d7f9932d78", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "An a.c. circuit contains resistance of $12 \\Omega$ and inductor of inductive reactance $5 \\Omega$. The phase angle between current and potential difference will be", "image": null}, "options": [{"id": "fMKWc", "text": "$\\cos ^{-1}\\left(\\frac{12}{13}\\right)$", "image": null, "isCorrect": true}, {"id": "bMlKN", "text": "$\\sin ^{-1}\\left(\\frac{12}{13}\\right)$", "image": null, "isCorrect": false}, {"id": "EqJmC", "text": "$\\cos ^{-1}\\left(\\frac{5}{12}\\right)$", "image": null, "isCorrect": false}, {"id": "ka64M", "text": "$\\sin ^{-1}\\left(\\frac{5}{12}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given:<br>Resistance $R = 12 \\Omega$<br>Inductive reactance $X_L = 5 \\Omega$<br><br>The impedance of the circuit is given by:<br>$Z = \\sqrt{R^2 + X_L^2}$<br>$Z = \\sqrt{12^2 + 5^2} = \\sqrt{144 + 25} = \\sqrt{169} = 13 \\Omega$<br><br>The phase angle $\\phi$ between the current and the potential difference is given by the power factor formula:<br>$\\cos \\phi = \\dfrac{R}{Z}$<br>$\\cos \\phi = \\dfrac{12}{13}$<br><br>$\\phi = \\cos^{-1}\\left(\\dfrac{12}{13}\\right)$<br><br>Answer: $\\cos ^{-1}\\left(\\frac{12}{13}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bdabf9280d7f9932d09", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "In series LCR circuit R $=18 \\Omega$ and impedance is $30 \\Omega$. An rms voltage 210 V is applied across the circuit. The true power consumed in AC circuit is nearly", "image": null}, "options": [{"id": "Ua6As", "text": "210 W", "image": null, "isCorrect": false}, {"id": "F5tPK", "text": "400 W", "image": null, "isCorrect": false}, {"id": "SgEmR", "text": "800 W", "image": null, "isCorrect": false}, {"id": "q37Nj", "text": "900 W", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given $V_{rms} = 210$ V, $R = 18 \\Omega$, and $Z = 30 \\Omega$.<br><br>The rms current in the circuit is:<br><br>$I_{rms} = \\dfrac{V_{rms}}{Z} = \\dfrac{210}{30} = 7$ A<br><br>The true power consumed in the AC circuit is given by:<br><br>$P = I_{rms}^2 R$<br><br>$P = (7)^2 \\times 18 = 49 \\times 18 = 882$ W<br><br>The calculated true power is $882$ W, which is nearly $900$ W.<br><br>Answer: 900 W", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bc9bf9280d7f9932c6a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "L, C and R are connected in series to an a. c. source. Which one of the following is true?\nPhase relation between current and voltage is such that", "image": null}, "options": [{"id": "ZsQ4U", "text": "both are out of phase with each other in 'R'.", "image": null, "isCorrect": false}, {"id": "oQ09F", "text": "both are in phase in 'L' and out of phase in 'C'.", "image": null, "isCorrect": false}, {"id": "LVgP5", "text": "both are out of phase in ' $L$ ' and in phase in ' $C$ '.", "image": null, "isCorrect": false}, {"id": "spNLZ", "text": "both are out of phase in both 'C' and 'L'.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In an AC circuit containing a pure resistor (R), the alternating current and voltage are in phase.<br><br>In an AC circuit containing a pure inductor (L), the alternating voltage leads the current by a phase angle of $\\dfrac{\\pi}{2}$. Thus, they are out of phase.<br><br>In an AC circuit containing a pure capacitor (C), the alternating current leads the voltage by a phase angle of $\\dfrac{\\pi}{2}$. Thus, they are also out of phase.<br><br>Therefore, current and voltage are out of phase in both 'C' and 'L'.<br><br>Answer: both are out of phase in both 'C' and 'L'.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bb7bf9280d7f9932bcd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "In an a.c. circuit, a resistance ' $R$ ' is connected in series with an inductance ' $L$ '. If phase angle between voltage and current is $45^{\\circ}$, the value of inductive reactance will be $\\left(\\tan 45^{\\circ}=1\\right)$", "image": null}, "options": [{"id": "sIpYj", "text": "R", "image": null, "isCorrect": true}, {"id": "vp4jO", "text": "$\\frac{\\mathrm{R}}{2}$", "image": null, "isCorrect": false}, {"id": "UGYSt", "text": "$\\frac{\\mathrm{R}}{4}$", "image": null, "isCorrect": false}, {"id": "6etmT", "text": "$\\frac{\\mathrm{R}}{\\sqrt{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In an a.c. circuit with resistance $R$ and inductance $L$ in series, the phase angle $\\phi$ between voltage and current is given by:<br><br>$\\tan \\phi = \\dfrac{X_L}{R}$<br><br>Given that $\\phi = 45^{\\circ}$ and $\\tan 45^{\\circ} = 1$:<br><br>$1 = \\dfrac{X_L}{R}$<br><br>$X_L = R$<br><br>The value of inductive reactance is $R$.<br><br>Answer: R", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba4bf9280d7f9932b2e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "An a. c. voltage is applied to pure inductor. The current in the inductor", "image": null}, "options": [{"id": "mbesj", "text": "leads the voltage by $\\left(\\frac{\\pi}{4}\\right)^{\\mathrm{c}}$", "image": null, "isCorrect": false}, {"id": "ki5v6", "text": "leads the voltage by $(\\pi / 2)^c$", "image": null, "isCorrect": false}, {"id": "Qdi3f", "text": "lags behind the voltage by $\\left(\\frac{\\pi}{2}\\right)^c$", "image": null, "isCorrect": true}, {"id": "dgwxR", "text": "lags behind the voltage by $\\left(\\frac{3 \\pi}{4}\\right)^{\\mathrm{c}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the applied alternating voltage across the pure inductor be $V = V_0 \\sin(\\omega t)$.<br><br>The induced emf in the inductor is given by $e = -L \\dfrac{dI}{dt}$.<br><br>According to Kirchhoff's loop rule, $V + e = 0$, which gives $V = L \\dfrac{dI}{dt}$.<br><br>$\\dfrac{dI}{dt} = \\dfrac{V_0}{L} \\sin(\\omega t)$<br><br>Integrating both sides with respect to time $t$, we get:<br><br>$I = \\int \\dfrac{V_0}{L} \\sin(\\omega t) dt = -\\dfrac{V_0}{\\omega L} \\cos(\\omega t)$<br><br>Using the trigonometric identity $-\\cos(\\theta) = \\sin(\\theta - \\dfrac{\\pi}{2})$, the current can be written as:<br><br>$I = I_0 \\sin(\\omega t - \\dfrac{\\pi}{2})$<br><br>where $I_0 = \\dfrac{V_0}{\\omega L}$ is the peak current.<br><br>Comparing the phase of the current with the phase of the voltage, it is clear that the current lags behind the voltage by a phase angle of $\\dfrac{\\pi}{2}$ radians.<br><br>Answer: lags behind the voltage by $\\left(\\frac{\\pi}{2}\\right)^c$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba3bf9280d7f9932b1d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The reactance of a capacitor is $\\mathrm{X}_{\\mathrm{c}}$. If the frequency and the capacitance are doubled, then the new reactance will be", "image": null}, "options": [{"id": "qRbdo", "text": "$\\frac{X_C}{2}$", "image": null, "isCorrect": false}, {"id": "OmbPP", "text": "$\\mathrm{X}_{\\mathrm{c}}$", "image": null, "isCorrect": false}, {"id": "u2YkT", "text": "$\\frac{X_C}{4}$", "image": null, "isCorrect": true}, {"id": "PWUPL", "text": "$2 \\mathrm{X}_{\\mathrm{c}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The reactance of a capacitor is given by the formula:<br><br>$X_C = \\dfrac{1}{2\\pi f C}$<br><br>When the frequency and capacitance are doubled, the new frequency is $f' = 2f$ and the new capacitance is $C' = 2C$.<br><br>The new reactance $X_C'$ is:<br><br>$X_C' = \\dfrac{1}{2\\pi f' C'}$<br><br>$X_C' = \\dfrac{1}{2\\pi (2f) (2C)}$<br><br>$X_C' = \\dfrac{1}{4} \\left( \\dfrac{1}{2\\pi f C} \\right)$<br><br>$X_C' = \\dfrac{X_C}{4}$<br><br>Answer: $\\frac{X_C}{4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b98bf9280d7f9932aaf", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Same current is flowing in two different a.c. circuits. First circuit contains only inductance and second contains only capacitance. If the frequency of a.c. is increased in both circuits, the current will", "image": null}, "options": [{"id": "1Lmyo", "text": "increase in the first circuit and decrease in second.", "image": null, "isCorrect": false}, {"id": "IPFuE", "text": "increase in both circuits.", "image": null, "isCorrect": false}, {"id": "WcAly", "text": "decrease in both circuits.", "image": null, "isCorrect": false}, {"id": "mRA6B", "text": "decrease in first circuit and increase in second.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For a purely inductive circuit, the inductive reactance is given by $X_L = 2\\pi f L$.<br><br>The current in the inductive circuit is $I_L = \\dfrac{V}{X_L} = \\dfrac{V}{2\\pi f L}$.<br><br>When the frequency $f$ is increased, $X_L$ increases, which causes the current $I_L$ to decrease.<br><br>For a purely capacitive circuit, the capacitive reactance is given by $X_C = \\dfrac{1}{2\\pi f C}$.<br><br>The current in the capacitive circuit is $I_C = \\dfrac{V}{X_C} = V(2\\pi f C)$.<br><br>When the frequency $f$ is increased, $X_C$ decreases, which causes the current $I_C$ to increase.<br><br>Therefore, the current will decrease in the first circuit and increase in the second circuit.<br><br>Answer: decrease in first circuit and increase in second.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b85bf9280d7f9932a01", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "An a. c. source is connected across a pure inductor. Which one of the following figures shows the correct phase relation between the current and e.m.f.?\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/M2x0gUGyR3iVUPggwVgc2DVbB4b_q3CcnR36DV1wguY.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "2grnn", "text": "(D)", "image": null, "isCorrect": false}, {"id": "qbJZ0", "text": "(B)", "image": null, "isCorrect": true}, {"id": "TT9aI", "text": "(A)", "image": null, "isCorrect": false}, {"id": "jAJ6B", "text": "(A)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In a purely inductive AC circuit, the alternating current lags behind the alternating e.m.f. by a phase angle of $\\dfrac{\\pi}{2}$ rad or $90^\\circ$.<br><br>In a phasor diagram, phasors are assumed to rotate in the counter-clockwise direction. Therefore, a lagging phasor is drawn clockwise relative to the reference phasor.<br><br>If the e.m.f. $e_L$ is represented by a phasor pointing to the right (positive x-axis), the current $i_L$ must be represented by a phasor pointing downwards (negative y-axis) to show a $90^\\circ$ lag.<br><br>Figure (B) correctly depicts this phase relationship, with $i_L$ pointing downwards and $e_L$ pointing to the right.<br><br>Answer: (B)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b78bf9280d7f9932984", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A coil has inductance 2 H . The ratio of its reactance when it is connected first to an a.c. source and then to a d.c. source is", "image": null}, "options": [{"id": "KpBPc", "text": "$-1$", "image": null, "isCorrect": false}, {"id": "45Ayg", "text": "zero", "image": null, "isCorrect": false}, {"id": "xGF62", "text": "$\\infty$", "image": null, "isCorrect": true}, {"id": "UYlMw", "text": "$+1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The reactance of an inductor is given by $X_L = \\omega L = 2 \\pi f L$.<br><br>For an a.c. source, the frequency $f \\neq 0$, so the reactance is $X_{L(\\text{a.c.})} = 2 \\pi f L$.<br><br>For a d.c. source, the frequency $f = 0$, so the reactance is $X_{L(\\text{d.c.})} = 0$.<br><br>The ratio of the reactance when connected to an a.c. source to that when connected to a d.c. source is<br><br>$\\dfrac{X_{L(\\text{a.c.})}}{X_{L(\\text{d.c.})}} = \\dfrac{2 \\pi f L}{0} = \\infty$<br><br>Answer: $\\infty$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b77bf9280d7f993297f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "An alternating e.m.f. is given by $e=e_0 \\sin \\omega t$. In how much time the e.m.f. will have half its maximum value, if e starts from zero ?\n$\\left(\\mathrm{T}=\\text { time period, } \\sin 30^{\\circ}=\\frac{1}{2}\\right)$", "image": null}, "options": [{"id": "M1TVx", "text": "$\\frac{T}{8}$", "image": null, "isCorrect": false}, {"id": "CHntP", "text": "$\\frac{\\mathrm{T}}{4}$", "image": null, "isCorrect": false}, {"id": "sobRX", "text": "$\\frac{\\mathrm{T}}{12}$", "image": null, "isCorrect": true}, {"id": "PXfPM", "text": "$\\frac{\\mathrm{T}}{16}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $e = e_0 \\sin \\omega t$<br><br>The maximum value of e.m.f. is $e_0$. We need to find the time $t$ when $e = \\dfrac{e_0}{2}$.<br><br>Substituting $e = \\dfrac{e_0}{2}$ in the given equation:<br><br>$\\dfrac{e_0}{2} = e_0 \\sin \\omega t$<br><br>$\\sin \\omega t = \\dfrac{1}{2}$<br><br>The smallest positive angle for which sine is $\\dfrac{1}{2}$ is $\\dfrac{\\pi}{6}$.<br><br>$\\omega t = \\dfrac{\\pi}{6}$<br><br>Since $\\omega = \\dfrac{2\\pi}{T}$, we have:<br><br>$\\dfrac{2\\pi}{T} t = \\dfrac{\\pi}{6}$<br><br>$t = \\dfrac{T}{12}$<br><br>Answer: $\\frac{\\mathrm{T}}{12}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b53bf9280d7f993283e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "An ideal inductor of $\\left(\\frac{1}{\\pi}\\right) \\mathrm{H}$ is connected in series with a $300 \\Omega$ resistor.\nIf a $20 \\mathrm{~V}, 200 \\mathrm{~Hz}$ alternating source is connected across the combination, the phase difference between the voltage and current is", "image": null}, "options": [{"id": "d7Blw", "text": "$\\tan ^{-1}\\left(\\frac{3}{4}\\right)$", "image": null, "isCorrect": false}, {"id": "YF0ys", "text": "$\\tan ^{-1}\\left(\\frac{4}{3}\\right)$", "image": null, "isCorrect": true}, {"id": "9zszB", "text": "$\\tan ^{-1}\\left(\\frac{5}{4}\\right)$", "image": null, "isCorrect": false}, {"id": "MgRAE", "text": "$\\tan ^{-1}\\left(\\frac{4}{5}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $L = \\dfrac{1}{\\pi} \\text{ H}$, $R = 300 \\ \\Omega$, and $f = 200 \\text{ Hz}$.<br><br>The inductive reactance is given by $X_L = 2\\pi f L$.<br><br>Substituting the given values:<br><br>$X_L = 2\\pi \\times 200 \\times \\dfrac{1}{\\pi} = 400 \\ \\Omega$<br><br>The phase difference $\\phi$ between the voltage and current in an LR series circuit is given by:<br><br>$\\tan \\phi = \\dfrac{X_L}{R}$<br><br>$\\tan \\phi = \\dfrac{400}{300} = \\dfrac{4}{3}$<br><br>$\\phi = \\tan^{-1}\\left(\\dfrac{4}{3}\\right)$<br><br>Answer: $\\tan ^{-1}\\left(\\frac{4}{3}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b44bf9280d7f99327ac", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "In LCR series circuit, $\\mathrm{R}=18 \\Omega$ and impedance $33 \\Omega$. An r.m.s. voltage of 220 V is applied across the circuit. The true power consumed in a.c. circuit is", "image": null}, "options": [{"id": "DuLSz", "text": "400 W", "image": null, "isCorrect": false}, {"id": "Ay8o1", "text": "600 W", "image": null, "isCorrect": false}, {"id": "yP4Xt", "text": "800 W", "image": null, "isCorrect": true}, {"id": "vOB8U", "text": "900 W", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The true power consumed in an a.c. circuit is given by the formula:<br><br>$P = V_{\\text{rms}} I_{\\text{rms}} \\cos \\phi$<br><br>We know that $I_{\\text{rms}} = \\dfrac{V_{\\text{rms}}}{Z}$ and the power factor $\\cos \\phi = \\dfrac{R}{Z}$. Substituting these into the power equation gives:<br><br>$P = V_{\\text{rms}} \\left( \\dfrac{V_{\\text{rms}}}{Z} \\right) \\left( \\dfrac{R}{Z} \\right) = \\dfrac{V_{\\text{rms}}^2 R}{Z^2}$<br><br>Given $V_{\\text{rms}} = 220 \\text{ V}$, $R = 18 \\, \\Omega$, and $Z = 33 \\, \\Omega$, we get:<br><br>$P = \\dfrac{(220)^2 \\times 18}{(33)^2}$<br><br>$P = \\left( \\dfrac{220}{33} \\right)^2 \\times 18$<br><br>$P = \\left( \\dfrac{20}{3} \\right)^2 \\times 18$<br><br>$P = \\dfrac{400}{9} \\times 18$<br><br>$P = 400 \\times 2 = 800 \\text{ W}$<br><br>Answer: 800 W", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b34bf9280d7f9932716", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "An e.m.f. $\\mathrm{e}=\\mathrm{E}_0 \\cos \\omega \\mathrm{t}$ is applied to a circuit containing $\\mathrm{L}, \\mathrm{C}$ and R in series where $X_L=3 R$ and $X_C=R$. The average power dissipated in the circuit is", "image": null}, "options": [{"id": "svoTa", "text": "$\\frac{E_0^2}{5 R}$", "image": null, "isCorrect": false}, {"id": "OSoAW", "text": "$\\frac{E_0^2}{10 R}$", "image": null, "isCorrect": true}, {"id": "b3M8R", "text": "$\\frac{E_0^2}{15 R}$", "image": null, "isCorrect": false}, {"id": "8K3I8", "text": "$\\frac{E_0^2}{20 R}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The impedance of the LCR series circuit is given by<br><br>$Z = \\sqrt{R^2 + (X_L - X_C)^2}$<br><br>Substituting $X_L = 3R$ and $X_C = R$:<br><br>$Z = \\sqrt{R^2 + (3R - R)^2} = \\sqrt{R^2 + 4R^2} = \\sqrt{5}R$<br><br>The average power dissipated in the circuit is<br><br>$P_{avg} = E_{rms} I_{rms} \\cos \\phi$<br><br>Since $E_{rms} = \\dfrac{E_0}{\\sqrt{2}}$, $I_{rms} = \\dfrac{E_{rms}}{Z}$, and $\\cos \\phi = \\dfrac{R}{Z}$:<br><br>$P_{avg} = \\left(\\dfrac{E_0}{\\sqrt{2}}\\right) \\left(\\dfrac{E_0}{\\sqrt{2}Z}\\right) \\left(\\dfrac{R}{Z}\\right) = \\dfrac{E_0^2 R}{2Z^2}$<br><br>Substituting $Z = \\sqrt{5}R$:<br><br>$P_{avg} = \\dfrac{E_0^2 R}{2(5R^2)} = \\dfrac{E_0^2}{10R}$<br><br>Answer: $\\frac{E_0^2}{10 R}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b23bf9280d7f9932695", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A resistance of $200 \\Omega$ and an inductor of $\\frac{1}{2 \\pi} \\mathrm{H}$ are connected in series to a.c. voltage of 40 V and 100 Hz frequency. The phase angle between the voltage and current is", "image": null}, "options": [{"id": "ZMcP7", "text": "$\\tan ^{-1}(1 / 5)$", "image": null, "isCorrect": false}, {"id": "hIWnK", "text": "$\\tan ^{-1}(1 / 4)$", "image": null, "isCorrect": false}, {"id": "2PXe2", "text": "$\\tan ^{-1}(1 / 3)$", "image": null, "isCorrect": false}, {"id": "yfB9G", "text": "$\\tan ^{-1}(0.5)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given $R = 200 \\, \\Omega$, $L = \\dfrac{1}{2\\pi} \\, \\text{H}$, and $f = 100 \\, \\text{Hz}$.<br><br>The inductive reactance $X_L$ is given by:<br><br>$X_L = 2\\pi f L$<br><br>Substituting the given values:<br><br>$X_L = 2\\pi \\times 100 \\times \\dfrac{1}{2\\pi} = 100 \\, \\Omega$<br><br>The phase angle $\\phi$ between the voltage and current in a series RL circuit is given by:<br><br>$\\tan \\phi = \\dfrac{X_L}{R}$<br><br>Substituting the values of $X_L$ and $R$:<br><br>$\\tan \\phi = \\dfrac{100}{200} = 0.5$<br><br>$\\phi = \\tan^{-1}(0.5)$<br><br>Answer: $\\tan ^{-1}(0.5)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b0cbf9280d7f99325f4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "In an $L-R$ circuit, the inductive reactance is equal to $\\sqrt{3}$ times the resistance ' $R$ ' of the circuit. An e.m.f. $E=E_0 \\sin (\\omega t)$ is applied to the circuit. The power consumed in the circuit is", "image": null}, "options": [{"id": "NA2Ys", "text": "$\\frac{E_0^2}{4 R}$", "image": null, "isCorrect": false}, {"id": "sJmsy", "text": "$\\frac{E_0^2}{6 R}$", "image": null, "isCorrect": false}, {"id": "8tywX", "text": "$\\frac{E_0^2}{8 R}$", "image": null, "isCorrect": true}, {"id": "p7mFA", "text": "$\\frac{E_0^2}{12 R}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $X_L = \\sqrt{3} R$.<br><br>The impedance of the $L-R$ circuit is given by:<br><br>$Z = \\sqrt{R^2 + X_L^2} = \\sqrt{R^2 + (\\sqrt{3}R)^2} = \\sqrt{4R^2} = 2R$<br><br>The rms current in the circuit is:<br><br>$I_{rms} = \\dfrac{E_{rms}}{Z} = \\dfrac{E_0 / \\sqrt{2}}{2R} = \\dfrac{E_0}{2\\sqrt{2}R}$<br><br>The power consumed in the circuit is:<br><br>$P = I_{rms}^2 R = \\left( \\dfrac{E_0}{2\\sqrt{2}R} \\right)^2 R = \\dfrac{E_0^2}{8R^2} R = \\dfrac{E_0^2}{8R}$<br><br>Answer: $\\frac{E_0^2}{8 R}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b0abf9280d7f99325e2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A coil of resistance $450 \\Omega$ and self - inductance 1.5 henry is connected to an a.c. source of frequency $\\frac{150}{\\pi} \\mathrm{~Hz}$. The phase difference between voltage and current is", "image": null}, "options": [{"id": "snCei", "text": "$\\tan ^{-1}(0.5)$", "image": null, "isCorrect": false}, {"id": "QOQdO", "text": "$\\tan ^{-1}(1)$", "image": null, "isCorrect": true}, {"id": "vXPbw", "text": "$\\tan ^{-1}(1.5)$", "image": null, "isCorrect": false}, {"id": "zKNOy", "text": "$\\tan ^{-1}(2.0)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $R = 450 \\Omega$, $L = 1.5 \\text{ H}$, and $f = \\dfrac{150}{\\pi} \\text{ Hz}$.<br><br>The angular frequency is given by:<br><br>$\\omega = 2\\pi f = 2\\pi \\times \\dfrac{150}{\\pi} = 300 \\text{ rad/s}$<br><br>The inductive reactance is:<br><br>$X_L = \\omega L = 300 \\times 1.5 = 450 \\Omega$<br><br>The phase difference $\\phi$ between voltage and current in an LR circuit is given by:<br><br>$\\tan \\phi = \\dfrac{X_L}{R}$<br><br>$\\tan \\phi = \\dfrac{450}{450} = 1$<br><br>$\\phi = \\tan^{-1}(1)$<br><br>Answer: $\\tan ^{-1}(1)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871afebf9280d7f993256c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The instantaneous value of current in an a.c. circuit is $I=3 \\sin$ $\\left(50 \\pi t+\\frac{\\pi}{4}\\right) \\mathrm{A}$. The current will be maximum for the first time at", "image": null}, "options": [{"id": "BFClX", "text": "$\\frac{1}{50} \\mathrm{~s}$", "image": null, "isCorrect": false}, {"id": "fPHMN", "text": "$\\frac{1}{100} \\mathrm{~s}$", "image": null, "isCorrect": false}, {"id": "omIaO", "text": "$\\frac{1}{200} \\mathrm{~s}$", "image": null, "isCorrect": true}, {"id": "OaA7F", "text": "$\\frac{1}{600} \\mathrm{~s}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given equation of alternating current is $I = 3 \\sin \\left(50 \\pi t + \\dfrac{\\pi}{4}\\right)$.<br><br>The current is maximum when $\\sin \\left(50 \\pi t + \\dfrac{\\pi}{4}\\right) = 1$.<br><br>For the current to be maximum for the first time, the phase angle must be $\\dfrac{\\pi}{2}$.<br><br>$50 \\pi t + \\dfrac{\\pi}{4} = \\dfrac{\\pi}{2}$<br><br>$50 \\pi t = \\dfrac{\\pi}{2} - \\dfrac{\\pi}{4}$<br><br>$50 \\pi t = \\dfrac{\\pi}{4}$<br><br>$t = \\dfrac{1}{200} \\text{ s}$<br><br>Answer: $\\frac{1}{200} \\mathrm{~s}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871afdbf9280d7f9932564", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "An alternating voltage $\\mathrm{E}=100 \\sqrt{2} \\sin (50 \\mathrm{t})$ is connected to a $2 \\mu \\mathrm{F}$ capacitor through an a.c. ammeter. The ammeter reading will be", "image": null}, "options": [{"id": "8J5WF", "text": "10 mA", "image": null, "isCorrect": true}, {"id": "gJppb", "text": "5 mA", "image": null, "isCorrect": false}, {"id": "DLrmP", "text": "20 mA", "image": null, "isCorrect": false}, {"id": "xtcFG", "text": "30 mA", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given equation of alternating voltage is $E = 100 \\sqrt{2} \\sin(50 t)$.<br><br>Comparing this with the standard equation $E = E_0 \\sin(\\omega t)$, we get:<br>$E_0 = 100 \\sqrt{2}$ V<br>$\\omega = 50$ rad/s<br><br>The RMS voltage is:<br>$E_{rms} = \\dfrac{E_0}{\\sqrt{2}} = \\dfrac{100 \\sqrt{2}}{\\sqrt{2}} = 100$ V<br><br>The capacitive reactance is:<br>$X_C = \\dfrac{1}{\\omega C} = \\dfrac{1}{50 \\times 2 \\times 10^{-6}} = \\dfrac{1}{10^{-4}} = 10^4 \\, \\Omega$<br><br>An a.c. ammeter measures the RMS value of the current. The RMS current is:<br>$I_{rms} = \\dfrac{E_{rms}}{X_C} = \\dfrac{100}{10^4} = 10^{-2}$ A<br><br>$I_{rms} = 10 \\times 10^{-3}$ A $= 10$ mA<br><br>Answer: 10 mA", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214310aee93fa0796deb2", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "The alternating voltage is given by $\\mathrm{v}=\\mathrm{v}_0 \\sin \\left(\\omega \\mathrm{t}+\\frac{\\pi}{3}\\right)$ when will be the voltage maximum for first time?", "image": null}, "options": [{"id": "jyjeI", "text": "$\\frac{\\mathrm{T}}{6}$", "image": null, "isCorrect": false}, {"id": "wEnu2", "text": "$\\frac{\\mathrm{T}}{3}$", "image": null, "isCorrect": false}, {"id": "68jg4", "text": "$\\frac{T}{2}$", "image": null, "isCorrect": false}, {"id": "zjp9F", "text": "$\\frac{\\mathrm{T}}{12}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given alternating voltage is $v = v_0 \\sin \\left(\\omega t + \\dfrac{\\pi}{3}\\right)$.<br><br>The voltage is maximum when $\\sin \\left(\\omega t + \\dfrac{\\pi}{3}\\right) = 1$.<br><br>For the first maximum, the phase angle must be $\\dfrac{\\pi}{2}$.<br><br>$\\omega t + \\dfrac{\\pi}{3} = \\dfrac{\\pi}{2}$<br><br>$\\omega t = \\dfrac{\\pi}{2} - \\dfrac{\\pi}{3} = \\dfrac{\\pi}{6}$<br><br>Substituting $\\omega = \\dfrac{2\\pi}{T}$:<br><br>$\\dfrac{2\\pi}{T} t = \\dfrac{\\pi}{6}$<br><br>$t = \\dfrac{T}{12}$<br><br>Answer: $\\frac{\\mathrm{T}}{12}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214300aee93fa0796deab", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "An electric lamp connected in series with a capacitor and an a.c. source is glowing with certain brightness. On increasing the value of capacitance the brightness of the lamp", "image": null}, "options": [{"id": "XFq26", "text": "is increased.", "image": null, "isCorrect": true}, {"id": "swJzQ", "text": "is decreased.", "image": null, "isCorrect": false}, {"id": "veI4U", "text": "remains the same.", "image": null, "isCorrect": false}, {"id": "JP34f", "text": "becomes zero.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The impedance of the series circuit containing a lamp of resistance $R$ and a capacitor of capacitance $C$ is given by $Z = \\sqrt{R^2 + X_C^2}$, where $X_C = \\dfrac{1}{\\omega C}$.<br><br>When the capacitance $C$ is increased, the capacitive reactance $X_C$ decreases.<br><br>As a result, the total impedance $Z$ of the circuit decreases.<br><br>The current in the circuit is given by $I = \\dfrac{V}{Z}$. Since $Z$ decreases, the current $I$ increases.<br><br>The brightness of the lamp is proportional to the power dissipated, $P = I^2 R$. Since the current increases, the power dissipated increases, and thus the brightness of the lamp is increased.<br><br>Answer: is increased.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792142f0aee93fa0796dea3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "In LCR series circuit, an alternating e.m.f. 'e' and current ' $i$ ' are given by equations $\\mathrm{e}=160 \\sin (100 \\mathrm{t})$ Volt and $\\mathrm{i}=250 \\sin \\left(100 \\mathrm{t}+\\frac{\\pi}{3}\\right) \\mathrm{mA}$.\r\nThe average power dissipated in the circuit is", "image": null}, "options": [{"id": "ZcDyU", "text": "$\\quad 2.5 \\mathrm{~W}$", "image": null, "isCorrect": false}, {"id": "UNAB0", "text": "4.0 W", "image": null, "isCorrect": false}, {"id": "ogXMg", "text": "10 W", "image": null, "isCorrect": true}, {"id": "ojGRy", "text": "100 W", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given equations for alternating e.m.f. and current are:<br><br>$e = 160 \\sin(100t)$<br><br>$i = 250 \\sin\\left(100t + \\dfrac{\\pi}{3}\\right)$<br><br>Comparing these with the standard equations $e = e_0 \\sin(\\omega t)$ and $i = i_0 \\sin(\\omega t + \\phi)$, we get:<br><br>Peak e.m.f., $e_0 = 160$ V<br><br>Peak current, $i_0 = 250$ mA $= 250 \\times 10^{-3}$ A $= 0.25$ A<br><br>Phase difference, $\\phi = \\dfrac{\\pi}{3}$<br><br>The average power dissipated in an AC circuit is given by:<br><br>$P_{avg} = e_{rms} i_{rms} \\cos(\\phi) = \\dfrac{e_0 i_0}{2} \\cos(\\phi)$<br><br>Substituting the values:<br><br>$P_{avg} = \\dfrac{160 \\times 0.25}{2} \\cos\\left(\\dfrac{\\pi}{3}\\right)$<br><br>$P_{avg} = \\dfrac{40}{2} \\times \\dfrac{1}{2}$<br><br>$P_{avg} = 10$ W<br><br>Answer: 10 W", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214070aee93fa0796dd67", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "In an a.c. circuit, the reactance of a coil is $\\sqrt{3}$ times its resistance. The phase difference between the voltage across the coil to the current through the coil will be", "image": null}, "options": [{"id": "LT4fq", "text": "$\\tan ^{-1}(0)$", "image": null, "isCorrect": false}, {"id": "eSA5W", "text": "$\\tan ^{-1} \\frac{1}{\\sqrt{3}}$", "image": null, "isCorrect": false}, {"id": "W5O2H", "text": "$\\tan ^{-1}(1)$", "image": null, "isCorrect": false}, {"id": "J1Plw", "text": "$\\tan ^{-1}(\\sqrt{3})$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $R$ be the resistance and $X_L$ be the reactance of the coil.<br><br>Given that $X_L = \\sqrt{3} R$.<br><br>The phase difference $\\phi$ between the voltage across the coil and the current through the coil is given by:<br><br>$\\tan \\phi = \\dfrac{X_L}{R}$<br><br>Substituting the value of $X_L$:<br><br>$\\tan \\phi = \\dfrac{\\sqrt{3} R}{R} = \\sqrt{3}$<br><br>$\\phi = \\tan^{-1}(\\sqrt{3})$<br><br>Answer: $\\tan ^{-1}(\\sqrt{3})$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213f60aee93fa0796dce3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c
