sible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c18c30a4553e1bdc73", "type": "singleCorrect", "question": {"text": "In an external environment of temperature ($T$) kelvin, a sphere at temperature ($3T$) kelvin has cooling rate $R_1$. When the temperature of that sphere falls to ($2T$) kelvin, the cooling rate $R_2$ of the sphere will become", "image": null}, "options": [{"id": "zbPXA", "label": "A", "text": "$\\dfrac{15}{16}R_1$", "isCorrect": false, "image": null}, {"id": "nTWo6", "label": "B", "text": "$\\dfrac{11}{16}R_1$", "isCorrect": false, "image": null}, {"id": "CQpkm", "label": "C", "text": "$\\dfrac{7}{16}R_1$", "isCorrect": false, "image": null}, {"id": "EJIsG", "label": "D", "text": "$\\dfrac{3}{16}R_1$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "According to Stefan-Boltzmann law, the rate of cooling of a body is given by $R = \\dfrac{dT}{dt} = \\dfrac{\\sigma e A}{ms} (T_{body}^4 - T_{surr}^4)$.<br><br>Let $k = \\dfrac{\\sigma e A}{ms}$.<br><br>For the first case, the temperature of the sphere is $3T$ and the surroundings is $T$.<br><br>$R_1 = k((3T)^4 - T^4) = k(81T^4 - T^4) = 80kT^4$<br><br>For the second case, the temperature of the sphere falls to $2T$.<br><br>$R_2 = k((2T)^4 - T^4) = k(16T^4 - T^4) = 15kT^4$<br><br>Taking the ratio of $R_2$ to $R_1$:<br><br>$\\dfrac{R_2}{R_1} = \\dfrac{15kT^4}{80kT^4} = \\dfrac{15}{80} = \\dfrac{3}{16}$<br><br>$R_2 = \\dfrac{3}{16}R_1$<br><br>Answer: $\\dfrac{3}{16}R_1$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c18c30a4553e1bdc71", "type": "singleCorrect", "question": {"text": "'$x$' joule of heat is incident on a body. Out of it, the total heat reflected and transmitted by it is '$y$' joule. The absorption coefficient of the body is", "image": null}, "options": [{"id": "2DDGY", "label": "A", "text": "$\\dfrac{x}{y}$", "isCorrect": false, "image": null}, {"id": "KjuYM", "label": "B", "text": "$\\dfrac{x-y}{x}$", "isCorrect": true, "image": null}, {"id": "sx0s8", "label": "C", "text": "$\\dfrac{y}{x-y}$", "isCorrect": false, "image": null}, {"id": "k7RYu", "label": "D", "text": "$\\dfrac{x}{y-x}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Total heat incident on the body is $Q = x$.<br><br>Total heat reflected and transmitted by the body is $Q_r + Q_t = y$.<br><br>From the conservation of energy, the total heat absorbed by the body is $Q_a = Q - (Q_r + Q_t) = x - y$.<br><br>The absorption coefficient is defined as the ratio of the heat absorbed to the total heat incident on the body.<br><br>$a = \\dfrac{Q_a}{Q} = \\dfrac{x - y}{x}$<br><br>Answer: $\\dfrac{x-y}{x}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ce8c30a4553e1bdd00", "type": "singleCorrect", "question": {"text": "A bowl filled with very hot water cools from $98^\\circ\\text{C}$ to $86^\\circ\\text{C}$ in 2 minutes when the room temperature is $22^\\circ\\text{C}$. How long it will take to cool from $75^\\circ\\text{C}$ to $69^\\circ\\text{C}$ ?", "image": null}, "options": [{"id": "kDJD6", "label": "A", "text": "$0.5$ minute", "isCorrect": false, "image": null}, {"id": "6hlhf", "label": "B", "text": "$1.4$ minute", "isCorrect": true, "image": null}, {"id": "xBZRg", "label": "C", "text": "$1$ minute", "isCorrect": false, "image": null}, {"id": "QRY5u", "label": "D", "text": "$2$ minute", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using Newton's law of cooling:<br><br>$\\dfrac{T_1 - T_2}{t} = K \\left( \\dfrac{T_1 + T_2}{2} - T_0 \\right)$<br><br>For the first case:<br><br>$\\dfrac{98 - 86}{2} = K \\left( \\dfrac{98 + 86}{2} - 22 \\right)$<br><br>$6 = K (92 - 22)$<br><br>$6 = 70K \\Rightarrow K = \\dfrac{3}{35}$<br><br>For the second case:<br><br>$\\dfrac{75 - 69}{t} = K \\left( \\dfrac{75 + 69}{2} - 22 \\right)$<br><br>$\\dfrac{6}{t} = K (72 - 22)$<br><br>$\\dfrac{6}{t} = 50K$<br><br>Substituting the value of $K$:<br><br>$\\dfrac{6}{t} = 50 \\times \\dfrac{3}{35}$<br><br>$\\dfrac{6}{t} = \\dfrac{30}{7}$<br><br>$t = \\dfrac{42}{30} = 1.4 \\text{ minutes}$<br><br>Answer: $1.4$ minute", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3318c30a4553e1be12a", "type": "singleCorrect", "question": {"text": "The energy spectrum of a black body exhibits a maximum around a wavelength '$\\lambda$'. The temperature of the black body is now changed such that the energy is maximum around a wavelength $2\\lambda/3$. The power radiated by the black body will now increase by a factor", "image": null}, "options": [{"id": "AVkz8", "label": "A", "text": "$\\dfrac{9}{4}$", "isCorrect": false, "image": null}, {"id": "ofzAM", "label": "B", "text": "$\\dfrac{81}{16}$", "isCorrect": true, "image": null}, {"id": "nkXjy", "label": "C", "text": "$\\dfrac{3}{2}$", "isCorrect": false, "image": null}, {"id": "6x7vP", "label": "D", "text": "$\\dfrac{27}{8}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Wien's displacement law:<br><br>$\\lambda_{m} T = b \\Rightarrow T \\propto \\dfrac{1}{\\lambda_{m}}$<br><br>Given $\\lambda_{1} = \\lambda$ and $\\lambda_{2} = \\dfrac{2\\lambda}{3}$.<br><br>$\\dfrac{T_{2}}{T_{1}} = \\dfrac{\\lambda_{1}}{\\lambda_{2}} = \\dfrac{\\lambda}{\\dfrac{2\\lambda}{3}} = \\dfrac{3}{2}$<br><br>According to Stefan-Boltzmann law, the power radiated by a black body is given by:<br><br>$P = \\sigma A T^{4} \\Rightarrow P \\propto T^{4}$<br><br>The ratio of final power to initial power is:<br><br>$\\dfrac{P_{2}}{P_{1}} = \\left(\\dfrac{T_{2}}{T_{1}}\\right)^{4} = \\left(\\dfrac{3}{2}\\right)^{4} = \\dfrac{81}{16}$<br><br>The power radiated increases by a factor of $\\dfrac{81}{16}$.<br><br>Answer: $\\dfrac{81}{16}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3318c30a4553e1be129", "type": "singleCorrect", "question": {"text": "A black rectangular surface of area 'A' emits energy 'E' per second at $27^\\circ$C. If length and breadth is reduced to half of its initial value and temperature is raised to $327^\\circ$C then energy emitted per second becomes", "image": null}, "options": [{"id": "Cygob", "label": "A", "text": "$2E$", "isCorrect": false, "image": null}, {"id": "tbVHX", "label": "B", "text": "$4E$", "isCorrect": true, "image": null}, {"id": "auMOn", "label": "C", "text": "$8E$", "isCorrect": false, "image": null}, {"id": "a8QL3", "label": "D", "text": "$16E$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Initial temperature $T_1 = 27^{\\circ}\\text{C} = 300\\text{ K}$<br><br>Initial area $A_1 = A$<br><br>Energy emitted per second $E = \\sigma A T_1^4 = \\sigma A (300)^4$<br><br>When length and breadth are reduced to half, the new area $A_2 = \\dfrac{L}{2} \\times \\dfrac{B}{2} = \\dfrac{A}{4}$<br><br>New temperature $T_2 = 327^{\\circ}\\text{C} = 600\\text{ K}$<br><br>New energy emitted per second $E' = \\sigma A_2 T_2^4$<br><br>$E' = \\sigma \\left(\\dfrac{A}{4}\\right) (600)^4$<br><br>$E' = \\sigma \\left(\\dfrac{A}{4}\\right) (2 \\times 300)^4$<br><br>$E' = \\sigma \\left(\\dfrac{A}{4}\\right) \\times 16 \\times (300)^4$<br><br>$E' = 4 \\sigma A (300)^4 = 4E$<br><br>Answer: $4E$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2dd8c30a4553e1bdda5", "type": "singleCorrect", "question": {"text": "A black rectangular surface of area A emits energy E per second at $127^\\circ$C. If length and breadth is reduced to half of initial value and temperature is raised to $527^\\circ$C then energy emitted becomes", "image": null}, "options": [{"id": "ogdoG", "label": "A", "text": "$E$", "isCorrect": false, "image": null}, {"id": "K9GRT", "label": "B", "text": "$2E$", "isCorrect": false, "image": null}, {"id": "tkOn6", "label": "C", "text": "$4E$", "isCorrect": true, "image": null}, {"id": "Pk4UU", "label": "D", "text": "$8E$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using Stefan-Boltzmann law, the energy emitted per second by a black body is given by $E = \\sigma A T^4$.<br><br>Initial temperature $T_1 = 127^\\circ\\text{C} = 400\\text{ K}$<br>Initial area $A_1 = A$<br>Initial energy emitted $E_1 = \\sigma A (400)^4 = E$<br><br>Final temperature $T_2 = 527^\\circ\\text{C} = 800\\text{ K}$<br>Since length and breadth are reduced to half, the new area $A_2 = \\dfrac{L}{2} \\times \\dfrac{B}{2} = \\dfrac{A}{4}$<br><br>Final energy emitted $E_2 = \\sigma A_2 T_2^4$<br><br>$E_2 = \\sigma \\left(\\dfrac{A}{4}\\right) (800)^4$<br><br>$E_2 = \\dfrac{1}{4} \\times 16 \\times \\sigma A (400)^4$<br><br>$E_2 = 4 \\sigma A (400)^4 = 4E$<br><br>Answer: $4E$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2db8c30a4553e1bdd8f", "type": "singleCorrect", "question": {"text": "The energy spectrum of a black body exhibits a maximum around a wavelength $\\lambda$. The temperature of a black body is now changed such that the energy is maximum at wavelength $2\\lambda/3$. The power radiated by the black body will now increase by a factor of", "image": null}, "options": [{"id": "2OmHj", "label": "A", "text": "$\\dfrac{256}{81}$", "isCorrect": false, "image": null}, {"id": "4SeIB", "label": "B", "text": "$\\dfrac{81}{16}$", "isCorrect": true, "image": null}, {"id": "Yr2QV", "label": "C", "text": "$\\dfrac{162}{41}$", "isCorrect": false, "image": null}, {"id": "sqaVw", "label": "D", "text": "$\\dfrac{16}{81}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using Wien's displacement law, $\\lambda_{m} T = b$<br><br>$\\lambda_{1} T_{1} = \\lambda_{2} T_{2}$<br><br>$\\lambda T_{1} = \\left(\\dfrac{2\\lambda}{3}\\right) T_{2}$<br><br>$T_{2} = \\dfrac{3}{2} T_{1}$<br><br>According to Stefan-Boltzmann law, the power radiated by a black body is $P = \\sigma A T^{4}$<br><br>$P \\propto T^{4}$<br><br>$\\dfrac{P_{2}}{P_{1}} = \\left(\\dfrac{T_{2}}{T_{1}}\\right)^{4}$<br><br>$\\dfrac{P_{2}}{P_{1}} = \\left(\\dfrac{3}{2}\\right)^{4} = \\dfrac{81}{16}$<br><br>Answer: $\\dfrac{81}{16}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3168c30a4553e1be009", "type": "singleCorrect", "question": {"text": "An ordinary body cools from $4\\theta$ to $3\\theta$ in 't' minutes. The temperature of the body after next 't' minutes is (Assume Newton's law of cooling and room temperature as $\\theta$)", "image": null}, "options": [{"id": "DzscR", "label": "A", "text": "$\\dfrac{2\\theta}{3}$", "isCorrect": false, "image": null}, {"id": "9Aljv", "label": "B", "text": "$\\dfrac{7\\theta}{3}$", "isCorrect": true, "image": null}, {"id": "vom45", "label": "C", "text": "$\\dfrac{5\\theta}{3}$", "isCorrect": false, "image": null}, {"id": "7BrFr", "label": "D", "text": "$\\dfrac{8\\theta}{3}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Newton's law of cooling, the temperature $T$ at time $t$ is given by:<br><br>$T - T_s = (T_i - T_s)e^{-kt}$<br><br>where $T_s$ is the surrounding temperature and $T_i$ is the initial temperature.<br><br>For the first $t$ minutes, $T_i = 4\\theta$, $T = 3\\theta$, and $T_s = \\theta$:<br><br>$3\\theta - \\theta = (4\\theta - \\theta)e^{-kt}$<br><br>$2\\theta = 3\\theta e^{-kt} \\Rightarrow e^{-kt} = \\dfrac{2}{3}$<br><br>For the next $t$ minutes, the initial temperature is $3\\theta$. Let the final temperature be $T'$:<br><br>$T' - \\theta = (3\\theta - \\theta)e^{-kt}$<br><br>$T' - \\theta = 2\\theta \\left(\\dfrac{2}{3}\\right) = \\dfrac{4\\theta}{3}$<br><br>$T' = \\theta + \\dfrac{4\\theta}{3} = \\dfrac{7\\theta}{3}$<br><br>Answer: $\\dfrac{7\\theta}{3}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3168c30a4553e1be007", "type": "singleCorrect", "question": {"text": "A black disc has a radius 'R' and wavelength corresponding to the maximum intensity is '$\\lambda$'. The emissive power (E) for the different radii and maximum wavelengths is directly proportional to", "image": null}, "options": [{"id": "Fd3Ca", "label": "A", "text": "$R, \\lambda$", "isCorrect": false, "image": null}, {"id": "TcZac", "label": "B", "text": "$R^2, \\lambda^{-4}$", "isCorrect": true, "image": null}, {"id": "czsY8", "label": "C", "text": "$R^2, \\lambda^{-2}$", "isCorrect": false, "image": null}, {"id": "OYArX", "label": "D", "text": "$R^2, \\lambda$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The total emissive power of a black body is given by the Stefan-Boltzmann law:<br><br>$E = A \\sigma T^4$<br><br>For a disc of radius $R$, the surface area $A \\propto R^2$. Therefore, the emissive power is proportional to:<br><br>$E \\propto R^2 T^4$<br><br>According to Wien's displacement law, the wavelength corresponding to maximum intensity $\\lambda$ is related to the absolute temperature $T$ as:<br><br>$\\lambda T = b$<br><br>$T \\propto \\lambda^{-1}$<br><br>Substituting this into the proportionality for $E$, we get:<br><br>$E \\propto R^2 (\\lambda^{-1})^4$<br><br>$E \\propto R^2 \\lambda^{-4}$<br><br>Answer: $R^2, \\lambda^{-4}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3168c30a4553e1be006", "type": "singleCorrect", "question": {"text": "About black body radiation, which one of the following is a WRONG statement?", "image": null}, "options": [{"id": "7IH4w", "label": "A", "text": "For all wavelengths, power radiated is same", "isCorrect": true, "image": null}, {"id": "ekQzc", "label": "B", "text": "For shorter wavelengths, radiated power is more", "isCorrect": false, "image": null}, {"id": "k3dhQ", "label": "C", "text": "for longer wavelengths, radiated power is less", "isCorrect": false, "image": null}, {"id": "FOLvv", "label": "D", "text": "All wavelengths are emitted by the black body", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to the spectral distribution of black body radiation (Planck's law), a black body emits radiation of all possible wavelengths, but the energy is not uniformly distributed among them. <br><br>The spectral emissive power ($E_{\\lambda}$) first increases with an increase in wavelength, reaches a maximum value at a specific wavelength ($\\lambda_{m}$), and then decreases for longer wavelengths. <br><br>Therefore, the statement \"For all wavelengths, power radiated is same\" is completely incorrect.<br><br>Answer: For all wavelengths, power radiated is same", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2998c30a4553e1bdacc", "type": "singleCorrect", "question": {"text": "What will be the ratio of rate of radiation of metal sphere at two different temperatures $T_1 = 527^\\circ$C and $T_2 = 127^\\circ$C", "image": null}, "options": [{"id": "Usxh9", "label": "A", "text": "$4:1$", "isCorrect": false, "image": null}, {"id": "gv7Aa", "label": "B", "text": "$16:1$", "isCorrect": true, "image": null}, {"id": "zPYzU", "label": "C", "text": "$8:1$", "isCorrect": false, "image": null}, {"id": "Lj85B", "label": "D", "text": "$64:1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The temperatures in Kelvin are given by:<br><br>$T_1 = 527 + 273 = 800 \\text{ K}$<br><br>$T_2 = 127 + 273 = 400 \\text{ K}$<br><br>According to the Stefan-Boltzmann law, the rate of radiation $E$ is proportional to the fourth power of the absolute temperature $T$:<br><br>$E \\propto T^4$<br><br>Taking the ratio of the rates of radiation at the two temperatures:<br><br>$\\dfrac{E_1}{E_2} = \\left(\\dfrac{T_1}{T_2}\\right)^4$<br><br>$\\dfrac{E_1}{E_2} = \\left(\\dfrac{800}{400}\\right)^4$<br><br>$\\dfrac{E_1}{E_2} = 2^4 = 16$<br><br>The ratio is $16:1$.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36c8c30a4553e1be390", "type": "singleCorrect", "question": {"text": "Rate of radiation by a black body is 'R' at temperature 'T'. Another body has same area but emissivity is 0.2 and temperature 3T. Its rate of radiation is", "image": null}, "options": [{"id": "AlmIP", "label": "A", "text": "$R$", "isCorrect": false, "image": null}, {"id": "GEubU", "label": "B", "text": "$2R$", "isCorrect": false, "image": null}, {"id": "YlXqp", "label": "C", "text": "$16.2R$", "isCorrect": true, "image": null}, {"id": "9ISo2", "label": "D", "text": "$0.2R$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Rate of radiation for a black body is given by Stefan-Boltzmann law:<br><br>$R = \\sigma A T^4$<br><br>For the second body, the rate of radiation is:<br><br>$R' = e \\sigma A (T')^4$<br><br>Given $e = 0.2$ and $T' = 3T$, substituting these values:<br><br>$R' = 0.2 \\times \\sigma A (3T)^4$<br><br>$R' = 0.2 \\times 81 \\times \\sigma A T^4$<br><br>$R' = 16.2 R$<br><br>Answer: $16.2R$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3698c30a4553e1be377", "type": "singleCorrect", "question": {"text": "A black rectangular surface of area A emits energy E per unit time at $27^\\circ$ C. If length and breadth is reduced to $\\left(\\dfrac{1}{4}\\right)^{th}$ of initial value and temperature is raised to $327^\\circ$ C, then energy emitted per unit time becomes", "image": null}, "options": [{"id": "e5Jki", "label": "A", "text": "$E$", "isCorrect": true, "image": null}, {"id": "KMdlD", "label": "B", "text": "$2E$", "isCorrect": false, "image": null}, {"id": "anzo7", "label": "C", "text": "$\\dfrac{E}{2}$", "isCorrect": false, "image": null}, {"id": "NTWoa", "label": "D", "text": "$\\dfrac{E}{4}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Stefan-Boltzmann law, the energy emitted per unit time by a black body is given by $E = \\sigma A T^4$.<br><br>Initial temperature $T_1 = 27^{\\circ}\\text{C} = 300\\text{ K}$ and initial area $A_1 = A$.<br><br>Initial energy emitted per unit time is $E_1 = E = \\sigma A (300)^4$.<br><br>Final temperature $T_2 = 327^{\\circ}\\text{C} = 600\\text{ K}$.<br><br>Since length and breadth are reduced to $\\dfrac{1}{4}$ of their initial values, the new area is $A_2 = \\dfrac{L}{4} \\times \\dfrac{B}{4} = \\dfrac{A}{16}$.<br><br>Final energy emitted per unit time is $E_2 = \\sigma A_2 T_2^4$.<br><br>Taking the ratio of $E_2$ to $E_1$:<br><br>$\\dfrac{E_2}{E_1} = \\dfrac{A_2}{A_1} \\left(\\dfrac{T_2}{T_1}\\right)^4$<br><br>$\\dfrac{E_2}{E} = \\dfrac{1}{16} \\left(\\dfrac{600}{300}\\right)^4$<br><br>$\\dfrac{E_2}{E} = \\dfrac{1}{16} \\times 2^4 = 1$<br><br>$E_2 = E$<br><br>Answer: $E$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d35e8c30a4553e1be300", "type": "singleCorrect", "question": {"text": "A body cools in $7$ minutes from $60^\\circ$C to $40^\\circ$C. What time (in minutes) does it take to cool from $40^\\circ$C to $28^\\circ$C, if its surrounding temperature is $10^\\circ$C ? (Newton's law of cooling holds good)", "image": null}, "options": [{"id": "7b8CW", "label": "A", "text": "$3.5$", "isCorrect": false, "image": null}, {"id": "KqsTh", "label": "B", "text": "$10$", "isCorrect": false, "image": null}, {"id": "q9EPx", "label": "C", "text": "$11$", "isCorrect": false, "image": null}, {"id": "0j143", "label": "D", "text": "$7$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Using Newton's law of cooling:<br><br>$\\ln\\left(\\dfrac{T_1 - T_0}{T_2 - T_0}\\right) = kt$<br><br>For the first interval, the body cools from $60^\\circ$C to $40^\\circ$C in $7$ minutes with surrounding temperature $T_0 = 10^\\circ$C:<br><br>$\\ln\\left(\\dfrac{60 - 10}{40 - 10}\\right) = k(7)$<br><br>$\\ln\\left(\\dfrac{50}{30}\\right) = 7k$<br><br>$\\ln\\left(\\dfrac{5}{3}\\right) = 7k$<br><br>For the second interval, the body cools from $40^\\circ$C to $28^\\circ$C in time $t$:<br><br>$\\ln\\left(\\dfrac{40 - 10}{28 - 10}\\right) = kt$<br><br>$\\ln\\left(\\dfrac{30}{18}\\right) = kt$<br><br>$\\ln\\left(\\dfrac{5}{3}\\right) = kt$<br><br>Comparing the two equations, we get:<br><br>$kt = 7k \\Rightarrow t = 7$ minutes.<br><br>Answer: $7$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b58c30a4553e1bdbf5", "type": "singleCorrect", "question": {"text": "A wire of length $L$ and diameter $d$ is used in a bulb. The temperature of wire is $T$ and power radiated by the wire is $P$. Its emissivity is ($\\sigma$ = Stefan's constant) (Assume that emissivity of wire material is same at all wavelength)", "image": null}, "options": [{"id": "QBRyi", "label": "A", "text": "$\\dfrac{P}{\\sigma T^4 \\pi d L}$", "isCorrect": true, "image": null}, {"id": "9xVBU", "label": "B", "text": "$\\dfrac{P}{\\sigma T^2 \\pi d L}$", "isCorrect": false, "image": null}, {"id": "21zYY", "label": "C", "text": "$\\dfrac{P}{\\sigma T^2 \\pi d^2 L^2}$", "isCorrect": false, "image": null}, {"id": "Tomzz", "label": "D", "text": "$\\dfrac{P^2}{\\sigma T^4 \\pi d L}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Stefan-Boltzmann law, the power radiated by a body is given by $P = e \\sigma A T^4$.<br><br>For a cylindrical wire of length $L$ and diameter $d$, the radiating surface area is $A = \\pi d L$.<br><br>Substituting the area into the power equation gives $P = e \\sigma (\\pi d L) T^4$.<br><br>Rearranging for emissivity $e$, we get $e = \\dfrac{P}{\\sigma T^4 \\pi d L}$.<br><br>Answer: $\\dfrac{P}{\\sigma T^4 \\pi d L}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b38c30a4553e1bdbdd", "type": "singleCorrect", "question": {"text": "The energy spectrum of a black body exhibits a maximum of wavelength $\\lambda_0$. The temperature of the black body is now changed such that the energy is maximum at wavelength $\\dfrac{3\\lambda_0}{2}$. The ratio of power radiated by the black body will be", "image": null}, "options": [{"id": "yxcIa", "label": "A", "text": "$\\dfrac{16}{9}$", "isCorrect": false, "image": null}, {"id": "8foeQ", "label": "B", "text": "$\\dfrac{16}{81}$", "isCorrect": true, "image": null}, {"id": "zhcUz", "label": "C", "text": "$\\dfrac{64}{27}$", "isCorrect": false, "image": null}, {"id": "20ekq", "label": "D", "text": "$\\dfrac{4}{3}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using Wien's displacement law, $\\lambda_{m} T = \\text{constant}$<br><br>$\\lambda_1 T_1 = \\lambda_2 T_2$<br><br>$\\lambda_0 T_1 = \\dfrac{3\\lambda_0}{2} T_2$<br><br>$\\dfrac{T_2}{T_1} = \\dfrac{2}{3}$<br><br>According to Stefan-Boltzmann law, the power radiated by a black body is $P \\propto T^4$<br><br>$\\dfrac{P_2}{P_1} = \\left(\\dfrac{T_2}{T_1}\\right)^4$<br><br>$\\dfrac{P_2}{P_1} = \\left(\\dfrac{2}{3}\\right)^4 = \\dfrac{16}{81}$<br><br>Answer: $\\dfrac{16}{81}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf9bf9280d7f9932e2c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The outer surface of star in the form of a sphere radiates heat as a black body at temperature ' $T$ '. The total radiant energy per unit area, normal to the direction of incidence, received at a distance ' R ' from the centre of a star of radius ' r ' is ( $\\mathrm{R}>\\mathrm{r}$ ) ( $\\sigma=$ Stefan's constant)", "image": null}, "options": [{"id": "stGXI", "text": "$\\frac{\\sigma r^2 \\mathrm{~T}^4}{\\mathrm{R}^2}$", "image": null, "isCorrect": true}, {"id": "IVJOk", "text": "$\\frac{\\sigma r^2 T^4}{4 \\pi R^2}$", "image": null, "isCorrect": false}, {"id": "rJBFj", "text": "$\\frac{\\sigma \\mathrm{r}^2 \\mathrm{~T}^4}{\\mathrm{R}^4}$", "image": null, "isCorrect": false}, {"id": "PuN3M", "text": "$\\frac{4 \\pi \\sigma r^2 T^4}{R^2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Stefan-Boltzmann law, the total energy radiated per unit time (power) by a star of radius $r$ acting as a black body at temperature $T$ is given by:<br><br>$P = \\sigma A T^4 = \\sigma (4 \\pi r^2) T^4$<br><br>This radiated energy spreads out uniformly in all directions. At a distance $R$ from the centre of the star, the energy is distributed over a spherical surface of radius $R$, which has an area of $4 \\pi R^2$.<br><br>The radiant energy received per unit area per unit time (intensity) normal to the direction of incidence is:<br><br>$I = \\dfrac{P}{4 \\pi R^2}$<br><br>Substituting the value of $P$, we get:<br><br>$I = \\dfrac{\\sigma (4 \\pi r^2) T^4}{4 \\pi R^2}$<br><br>$I = \\dfrac{\\sigma r^2 T^4}{R^2}$<br><br>Answer: $\\frac{\\sigma r^2 \\mathrm{~T}^4}{\\mathrm{R}^2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf7bf9280d7f9932e17", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A black body has maximum wavelength ' $\\lambda_{\\mathrm{m}}$ ' at temperature 2000 K . Its maximum wavelength at 3000 K will be", "image": null}, "options": [{"id": "dk4xO", "text": "$\\frac{3}{2} \\lambda_{\\mathrm{m}}$", "image": null, "isCorrect": false}, {"id": "5MycJ", "text": "$\\frac{16}{81} \\lambda_{\\mathrm{m}}$", "image": null, "isCorrect": false}, {"id": "L4KeO", "text": "$\\frac{81}{16} \\lambda_m$", "image": null, "isCorrect": false}, {"id": "7kbip", "text": "$\\frac{2}{3} \\lambda_{\\mathrm{m}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Wien's displacement law, the product of the wavelength corresponding to maximum spectral emissive power and the absolute temperature is constant.<br><br>$\\lambda_{\\mathrm{m}} T = \\text{constant}$<br><br>$\\lambda_{\\mathrm{m}1} T_1 = \\lambda_{\\mathrm{m}2} T_2$<br><br>Given $T_1 = 2000 \\text{ K}$, $\\lambda_{\\mathrm{m}1} = \\lambda_{\\mathrm{m}}$, and $T_2 = 3000 \\text{ K}$.<br><br>$\\lambda_{\\mathrm{m}} \\times 2000 = \\lambda_{\\mathrm{m}2} \\times 3000$<br><br>$\\lambda_{\\mathrm{m}2} = \\dfrac{2000}{3000} \\lambda_{\\mathrm{m}}$<br><br>$\\lambda_{\\mathrm{m}2} = \\dfrac{2}{3} \\lambda_{\\mathrm{m}}$<br><br>Answer: $\\frac{2}{3} \\lambda_{\\mathrm{m}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bd9bf9280d7f9932cfe", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A black sphere has radius R whose rate of radiation is E at temperature T. If radius is made R/2 and temperature 3T, the rate of radiation will be", "image": null}, "options": [{"id": "Wxn4L", "text": "$\\frac{3 \\mathrm{E}}{2}$", "image": null, "isCorrect": false}, {"id": "olRCm", "text": "$\\frac{27 E}{8}$", "image": null, "isCorrect": false}, {"id": "z5wBO", "text": "$\\frac{81 \\mathrm{E}}{4}$", "image": null, "isCorrect": true}, {"id": "IkzVo", "text": "$\\frac{9 E}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Stefan-Boltzmann law, the rate of radiation $E$ is given by $E = \\sigma A T^4 = \\sigma (4\\pi R^2) T^4$.<br><br>For the first case, $E = \\sigma (4\\pi R^2) T^4$.<br><br>For the second case, the new radius is $R' = \\dfrac{R}{2}$ and the new temperature is $T' = 3T$.<br><br>The new rate of radiation $E'$ is given by $E' = \\sigma (4\\pi R'^2) T'^4$.<br><br>Substituting the values, we get $E' = \\sigma \\left(4\\pi \\left(\\dfrac{R}{2}\\right)^2\\right) (3T)^4$.<br><br>$E' = \\sigma \\left(4\\pi \\dfrac{R^2}{4}\\right) (81T^4)$.<br><br>$E' = \\dfrac{81}{4} \\sigma (4\\pi R^2) T^4$.<br><br>$E' = \\dfrac{81E}{4}$.<br><br>Answer: $\\frac{81 \\mathrm{E}}{4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bd6bf9280d7f9932ce0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Two spherical black bodies have radii ' $r_1$ ' and ' $r_2$ '. Their surface temperatures are ' $\\mathrm{T}_1$ ' and ' $\\mathrm{T}_2$ '. If they radiate same power, then $\\frac{\\mathrm{r}_2}{\\mathrm{r}_1}$ is", "image": null}, "options": [{"id": "61mIv", "text": "$\\frac{\\mathrm{T}_2}{\\mathrm{~T}_1}$", "image": null, "isCorrect": false}, {"id": "vfhot", "text": "$\\frac{\\mathrm{T}_1}{\\mathrm{~T}_2}$", "image": null, "isCorrect": false}, {"id": "dl4WR", "text": "$\\left(\\frac{\\mathrm{T}_2}{\\mathrm{~T}_1}\\right)^2$", "image": null, "isCorrect": false}, {"id": "Xd3SH", "text": "$\\left(\\frac{\\mathrm{T}_1}{\\mathrm{~T}_2}\\right)^2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Stefan-Boltzmann law, the power radiated by a black body is given by $P = \\sigma A T^4$.<br><br>For a spherical black body, the surface area is $A = 4\\pi r^2$.<br><br>Therefore, the radiated power is $P = \\sigma (4\\pi r^2) T^4$.<br><br>Given that both black bodies radiate the same power, $P_1 = P_2$.<br><br>$\\sigma (4\\pi r_1^2) T_1^4 = \\sigma (4\\pi r_2^2) T_2^4$<br><br>$r_1^2 T_1^4 = r_2^2 T_2^4$<br><br>$\\dfrac{r_2^2}{r_1^2} = \\dfrac{T_1^4}{T_2^4}$<br><br>Taking the square root on both sides:<br><br>$\\dfrac{r_2}{r_1} = \\left(\\dfrac{T_1}{T_2}\\right)^2$<br><br>Answer: $\\left(\\frac{\\mathrm{T}_1}{\\mathrm{~T}_2}\\right)^2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bc8bf9280d7f9932c5c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Two black spheres P & Q have radii in the ratio $4: 3$. The wavelength of maximum intensity of radiation are in the ratio $4: 5$ respectively. The ratio of radiated power by P to Q is", "image": null}, "options": [{"id": "KCSCZ", "text": "$\\frac{625}{144}$", "image": null, "isCorrect": true}, {"id": "PVqNh", "text": "$\\frac{125}{81}$", "image": null, "isCorrect": false}, {"id": "cmPvu", "text": "$\\frac{25}{9}$", "image": null, "isCorrect": false}, {"id": "6e3j5", "text": "$\\frac{5}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Wien's displacement law, $\\lambda_{\\text{max}} T = \\text{constant}$.<br><br>$\\dfrac{T_P}{T_Q} = \\dfrac{\\lambda_Q}{\\lambda_P} = \\dfrac{5}{4}$<br><br>According to Stefan-Boltzmann law, the radiated power is given by $P = \\sigma A T^4 = \\sigma (4\\pi r^2) T^4$.<br><br>$\\dfrac{P_P}{P_Q} = \\left(\\dfrac{r_P}{r_Q}\\right)^2 \\left(\\dfrac{T_P}{T_Q}\\right)^4$<br><br>$\\dfrac{P_P}{P_Q} = \\left(\\dfrac{4}{3}\\right)^2 \\left(\\dfrac{5}{4}\\right)^4$<br><br>$\\dfrac{P_P}{P_Q} = \\dfrac{16}{9} \\times \\dfrac{625}{256}$<br><br>$\\dfrac{P_P}{P_Q} = \\dfrac{625}{144}$<br><br>Answer: $\\frac{625}{144}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bb9bf9280d7f9932bdf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A black body emits radiation of maximum intensity at wavelength ' $\\lambda$ ' at temperature T K. Its corresponding wavelength at temperature $1.5 \\mathrm{~T} \\mathrm{~K}$ will be", "image": null}, "options": [{"id": "4odwe", "text": "$\\frac{2 \\lambda}{3}$", "image": null, "isCorrect": true}, {"id": "ryLsn", "text": "$\\frac{4 \\lambda}{3}$", "image": null, "isCorrect": false}, {"id": "TCQnU", "text": "$\\frac{16 \\lambda}{81}$", "image": null, "isCorrect": false}, {"id": "4XUuZ", "text": "$\\frac{81 \\lambda}{16}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Wien's displacement law, the wavelength corresponding to maximum intensity of emission is inversely proportional to the absolute temperature of the black body.<br><br>$\\lambda_{m} T = \\text{constant}$<br><br>$\\lambda_{1} T_{1} = \\lambda_{2} T_{2}$<br><br>Given $\\lambda_{1} = \\lambda$, $T_{1} = T$, and $T_{2} = 1.5 T = \\dfrac{3}{2} T$.<br><br>$\\lambda \\times T = \\lambda_{2} \\times \\dfrac{3}{2} T$<br><br>$\\lambda_{2} = \\dfrac{2 \\lambda}{3}$<br><br>Answer: $\\frac{2 \\lambda}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba5bf9280d7f9932b33", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A body cools from $80^{\\circ} \\mathrm{C}$ to $50^{\\circ} \\mathrm{C}$ in 5 min . In the next time of ' $t$ ' min, the body continues to cool from $50^{\\circ} \\mathrm{C}$ to $30^{\\circ} \\mathrm{C}$. The total time taken by the body to cool from $80^{\\circ} \\mathrm{C}$ to $30^{\\circ} \\mathrm{C}$ is\n[The temperature of the surroundings is $20^{\\circ} \\mathrm{C}$.]", "image": null}, "options": [{"id": "pc7tE", "text": "7.5 min", "image": null, "isCorrect": false}, {"id": "sGm8D", "text": "10 min", "image": null, "isCorrect": false}, {"id": "FjGos", "text": "12.5 min", "image": null, "isCorrect": true}, {"id": "RgJ2j", "text": "15.0 min", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Newton's law of cooling,<br><br>$\\dfrac{T_1 - T_2}{t} = K \\left( \\dfrac{T_1 + T_2}{2} - T_0 \\right)$<br><br>For the first interval, the body cools from $80^{\\circ} \\mathrm{C}$ to $50^{\\circ} \\mathrm{C}$ in $5$ min:<br><br>$\\dfrac{80 - 50}{5} = K \\left( \\dfrac{80 + 50}{2} - 20 \\right)$<br><br>$\\dfrac{30}{5} = K (65 - 20)$<br><br>$6 = 45 K \\Rightarrow K = \\dfrac{6}{45} = \\dfrac{2}{15} \\text{ min}^{-1}$<br><br>For the second interval, the body cools from $50^{\\circ} \\mathrm{C}$ to $30^{\\circ} \\mathrm{C}$ in $t$ min:<br><br>$\\dfrac{50 - 30}{t} = K \\left( \\dfrac{50 + 30}{2} - 20 \\right)$<br><br>$\\dfrac{20}{t} = K (40 - 20)$<br><br>$\\dfrac{20}{t} = 20 K \\Rightarrow \\dfrac{1}{t} = K$<br><br>Substituting the value of $K$:<br><br>$\\dfrac{1}{t} = \\dfrac{2}{15} \\Rightarrow t = 7.5 \\text{ min}$<br><br>The total time taken by the body to cool from $80^{\\circ} \\mathrm{C}$ to $30^{\\circ} \\mathrm{C}$ is:<br><br>Total time $= 5 + 7.5 = 12.5 \\text{ min}$<br><br>Answer: 12.5 min", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba3bf9280d7f9932b1b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A rectangular black body of temperature $127^{\\circ} \\mathrm{C}$ has surface area $4 \\mathrm{~cm} \\times 2 \\mathrm{~cm}$ and rate of radiation is E . If its temperature is increased by $400^{\\circ} \\mathrm{C}$ and surface area is reduced to half of the initial value then the rate of radiation is", "image": null}, "options": [{"id": "DOaGg", "text": "8E", "image": null, "isCorrect": true}, {"id": "tzjHE", "text": "E", "image": null, "isCorrect": false}, {"id": "HktuH", "text": "2E", "image": null, "isCorrect": false}, {"id": "mZHow", "text": "16E", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Stefan-Boltzmann law, the rate of radiation is given by $E = \\sigma A T^4$.<br><br>Initial temperature $T_1 = 127^{\\circ} \\mathrm{C} = 127 + 273 = 400 \\mathrm{~K}$<br><br>Initial area $A_1 = 4 \\mathrm{~cm} \\times 2 \\mathrm{~cm} = 8 \\mathrm{~cm}^2$<br><br>Initial rate of radiation $E_1 = \\sigma A_1 T_1^4 = E$<br><br>The temperature is increased by $400^{\\circ} \\mathrm{C}$, so the new temperature is:<br><br>$T_2 = 127^{\\circ} \\mathrm{C} + 400^{\\circ} \\mathrm{C} = 527^{\\circ} \\mathrm{C} = 527 + 273 = 800 \\mathrm{~K} = 2T_1$<br><br>The surface area is reduced to half, so the new area is:<br><br>$A_2 = \\dfrac{A_1}{2}$<br><br>The new rate of radiation $E_2$ is:<br><br>$E_2 = \\sigma A_2 T_2^4$<br><br>$E_2 = \\sigma \\left(\\dfrac{A_1}{2}\\right) (2T_1)^4$<br><br>$E_2 = \\sigma \\left(\\dfrac{A_1}{2}\\right) \\times 16 T_1^4$<br><br>$E_2 = 8 \\sigma A_1 T_1^4$<br><br>$E_2 = 8E$<br><br>Answer: 8E", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b88bf9280d7f9932a1e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Two spherical black bodies have radii ' $R_1$ ' and ' $R_2$ '. Their surface temperatures are $T_1 K$ and $T_2 K$ respectively. If they radiate the same power, the ratio $\\frac{\\mathrm{R}_1}{\\mathrm{R}_2}$ is", "image": null}, "options": [{"id": "9vl1f", "text": "$\\left(\\frac{\\mathrm{T}_1}{\\mathrm{~T}_2}\\right)^4$", "image": null, "isCorrect": false}, {"id": "GOPtw", "text": "$\\left(\\frac{\\mathrm{T}_1}{\\mathrm{~T}_2}\\right)^2$", "image": null, "isCorrect": false}, {"id": "1cf2o", "text": "$\\left(\\frac{\\mathrm{T}_2}{\\mathrm{~T}_1}\\right)^4$", "image": null, "isCorrect": false}, {"id": "wHmtP", "text": "$\\left(\\frac{\\mathrm{T}_2}{\\mathrm{~T}_1}\\right)^2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Stefan-Boltzmann law, the power radiated by a spherical black body is given by<br><br>$P = \\sigma A T^4 = \\sigma (4\\pi R^2) T^4$<br><br>Since both bodies radiate the same power, $P_1 = P_2$<br><br>$\\sigma (4\\pi R_1^2) T_1^4 = \\sigma (4\\pi R_2^2) T_2^4$<br><br>$R_1^2 T_1^4 = R_2^2 T_2^4$<br><br>$\\left(\\dfrac{R_1}{R_2}\\right)^2 = \\left(\\dfrac{T_2}{T_1}\\right)^4$<br><br>$\\dfrac{R_1}{R_2} = \\left(\\dfrac{T_2}{T_1}\\right)^2$<br><br>Answer: $\\left(\\frac{\\mathrm{T}_2}{\\mathrm{~T}_1}\\right)^2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b78bf9280d7f9932986", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Two bodies A and B at temperatures ' $\\mathrm{T}_1{ }^{\\prime} \\mathrm{K}$ and ' $\\mathrm{T}_2{ }^{\\prime} \\mathrm{K}$ respectively have the same dimensions. Their emissivities are in the ratio $16: 1$. At $\\mathrm{T}_1=\\mathrm{x} \\mathrm{T}_2$, they radiate the same amount of heat per unit area per unit time. The value of $x$ is", "image": null}, "options": [{"id": "qR5FI", "text": "$8$", "image": null, "isCorrect": false}, {"id": "LzYzJ", "text": "$4$", "image": null, "isCorrect": false}, {"id": "APgFC", "text": "$2$", "image": null, "isCorrect": false}, {"id": "qGdTz", "text": "$0.5$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Stefan-Boltzmann law, the amount of heat radiated per unit area per unit time is given by $E = e \\sigma T^4$.<br><br>For body A, $E_1 = e_1 \\sigma T_1^4$<br><br>For body B, $E_2 = e_2 \\sigma T_2^4$<br><br>Given that $E_1 = E_2$, we have:<br><br>$e_1 \\sigma T_1^4 = e_2 \\sigma T_2^4$<br><br>$\\dfrac{e_1}{e_2} = \\left(\\dfrac{T_2}{T_1}\\right)^4$<br><br>We are given $\\dfrac{e_1}{e_2} = \\dfrac{16}{1}$ and $T_1 = x T_2$, which means $\\dfrac{T_2}{T_1} = \\dfrac{1}{x}$.<br><br>Substituting these values:<br><br>$16 = \\left(\\dfrac{1}{x}\\right)^4$<br><br>$x^4 = \\dfrac{1}{16}$<br><br>$x = \\dfrac{1}{2} = 0.5$<br><br>Answer: $0.5$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b77bf9280d7f9932982", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Black bodies $A$ and $B$ radiate maximum energy with wavelength difference $4 \\mu \\mathrm{~m}$. The absolute temperature of body $A$ is 3 times that of B. The wavelength at which body B radiates maximum energy is", "image": null}, "options": [{"id": "xx1iN", "text": "$4 \\mu \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "mL8EB", "text": "$6 \\mu \\mathrm{~m}$", "image": null, "isCorrect": true}, {"id": "plL0E", "text": "$2 \\mu \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "PIyyp", "text": "$8 \\mu \\mathrm{~m}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Wien's displacement law, $\\lambda_{\\text{max}} T = \\text{constant}$.<br><br>$\\lambda_A T_A = \\lambda_B T_B$<br><br>Given that $T_A = 3 T_B$, we have:<br><br>$\\lambda_A (3 T_B) = \\lambda_B T_B$<br><br>$\\lambda_B = 3 \\lambda_A$<br><br>Since $\\lambda_B > \\lambda_A$, the given wavelength difference is:<br><br>$\\lambda_B - \\lambda_A = 4 \\mu \\mathrm{m}$<br><br>Substituting $\\lambda_A = \\dfrac{\\lambda_B}{3}$:<br><br>$\\lambda_B - \\dfrac{\\lambda_B}{3} = 4 \\mu \\mathrm{m}$<br><br>$\\dfrac{2 \\lambda_B}{3} = 4 \\mu \\mathrm{m}$<br><br>$\\lambda_B = 6 \\mu \\mathrm{m}$<br><br>Answer: $6 \\mu \\mathrm{~m}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b66bf9280d7f99328d6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If 120 J of thermal energy is incident on area $3 \\mathrm{~m}^2$, the amount of heat transmitted is 12 J, coefficient of absorption is $0.6$, then the amount of heat reflected is", "image": null}, "options": [{"id": "aM6tS", "text": "24 J", "image": null, "isCorrect": false}, {"id": "EcmI9", "text": "30 J", "image": null, "isCorrect": false}, {"id": "wllCR", "text": "36 J", "image": null, "isCorrect": true}, {"id": "j4kP1", "text": "40 J", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given:<br>Total incident energy, $Q = 120$ J<br>Amount of heat transmitted, $Q_t = 12$ J<br>Coefficient of absorption, $a = 0.6$<br><br>The amount of heat absorbed is given by:<br>$Q_a = a \\times Q$<br>$Q_a = 0.6 \\times 120 = 72$ J<br><br>According to the conservation of energy, the total incident heat is the sum of absorbed, reflected, and transmitted heat:<br>$Q = Q_a + Q_r + Q_t$<br><br>Substituting the values:<br>$120 = 72 + Q_r + 12$<br>$120 = 84 + Q_r$<br>$Q_r = 120 - 84 = 36$ J<br><br>The amount of heat reflected is 36 J.<br><br>Answer: 36 J", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b54bf9280d7f9932848", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If a black body at 400 K surrounded by atmosphere at 300 K has rate of cooling ' $\\mathrm{R}_0$ ', the same body at 900 K , surrounded by same atmosphere, will have rate of cooling nearly", "image": null}, "options": [{"id": "i6OKV", "text": "$4 R_0$", "image": null, "isCorrect": false}, {"id": "WvKRf", "text": "$16 \\mathrm{R}_0$", "image": null, "isCorrect": false}, {"id": "WnEGc", "text": "$36 \\mathrm{R}_0$", "image": null, "isCorrect": true}, {"id": "arOcZ", "text": "$\\frac{81 \\mathrm{R}_0}{16}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the Stefan-Boltzmann law, the rate of cooling of a black body is directly proportional to the difference between the fourth powers of the absolute temperature of the body and its surroundings.<br><br>The rate of cooling is given by:<br>$R \\propto (T^4 - T_0^4)$<br><br>For the first case, $T = 400$ K and $T_0 = 300$ K:<br>$R_0 \\propto (400^4 - 300^4)$<br>$R_0 \\propto 100^4 (4^4 - 3^4)$<br>$R_0 \\propto 100^4 (256 - 81)$<br>$R_0 \\propto 175 \\times 100^4$<br><br>For the second case, $T = 900$ K and $T_0 = 300$ K:<br>$R \\propto (900^4 - 300^4)$<br>$R \\propto 100^4 (9^4 - 3^4)$<br>$R \\propto 100^4 (6561 - 81)$<br>$R \\propto 6480 \\times 100^4$<br><br>Taking the ratio of the two rates of cooling:<br>$\\dfrac{R}{R_0} = \\dfrac{6480}{175}$<br><br>$\\dfrac{R}{R_0} = 37.02$<br><br>To find the nearest value among the given options, we can approximate $175 \\approx 180$:<br>$\\dfrac{R}{R_0} \\approx \\dfrac{6480}{180} = 36$<br><br>Therefore, the rate of cooling will be nearly $36 R_0$.<br><br>Answer: $36 \\mathrm{R}_0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b53bf9280d7f993283f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Hot water cools from $80^{\\circ} \\mathrm{C}$ to $60^{\\circ} \\mathrm{C}$ in 1 minutes. In cooling from $60^{\\circ} \\mathrm{C}$ to $50^{\\circ} \\mathrm{C}$ it will take (room temperature $=30^{\\circ} \\mathrm{C}$ )", "image": null}, "options": [{"id": "ZcYJF", "text": "48 s", "image": null, "isCorrect": true}, {"id": "zUZEF", "text": "42 s", "image": null, "isCorrect": false}, {"id": "CMbbu", "text": "50 s", "image": null, "isCorrect": false}, {"id": "RrXD6", "text": "45 s", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Newton's law of cooling,<br><br>$\\dfrac{T_1 - T_2}{t} = K \\left( \\dfrac{T_1 + T_2}{2} - T_0 \\right)$<br><br>For the first case, $T_1 = 80^{\\circ} \\mathrm{C}$, $T_2 = 60^{\\circ} \\mathrm{C}$, $t = 1 \\text{ min} = 60 \\text{ s}$, and $T_0 = 30^{\\circ} \\mathrm{C}$:<br><br>$\\dfrac{80 - 60}{60} = K \\left( \\dfrac{80 + 60}{2} - 30 \\right)$<br><br>$\\dfrac{20}{60} = K (70 - 30)$<br><br>$\\dfrac{1}{3} = 40 K \\Rightarrow K = \\dfrac{1}{120} \\text{ s}^{-1}$<br><br>For the second case, $T_1 = 60^{\\circ} \\mathrm{C}$, $T_2 = 50^{\\circ} \\mathrm{C}$, and $T_0 = 30^{\\circ} \\mathrm{C}$:<br><br>$\\dfrac{60 - 50}{t} = K \\left( \\dfrac{60 + 50}{2} - 30 \\right)$<br><br>$\\dfrac{10}{t} = K (55 - 30)$<br><br>$\\dfrac{10}{t} = 25 K$<br><br>Substituting the value of $K$:<br><br>$\\dfrac{10}{t} = 25 \\times \\dfrac{1}{120}$<br><br>$t = \\dfrac{10 \\times 120}{25}$<br><br>$t = \\dfrac{1200}{25} = 48 \\text{ s}$<br><br>Answer: 48 s", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b42bf9280d7f9932798", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A rectangular plate of surface area A emits energy E per second at $27^{\\circ} \\mathrm{C}$. If length and breadth are reduced to half of initial value and temperature is raised to $327^{\\circ} \\mathrm{C}$ then energy emitted per second becomes", "image": null}, "options": [{"id": "sTSdE", "text": "2 E", "image": null, "isCorrect": false}, {"id": "IPdPm", "text": "4 E", "image": null, "isCorrect": true}, {"id": "5Q8Yn", "text": "E", "image": null, "isCorrect": false}, {"id": "MgOcw", "text": "8 E", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Stefan-Boltzmann law, the energy emitted per second is given by $E = \\sigma e A T^4$.<br><br>Initial temperature $T_1 = 27^{\\circ}\\mathrm{C} = 300\\text{ K}$.<br><br>Initial area $A_1 = A$.<br><br>Initial energy emitted per second $E_1 = E \\propto A_1 T_1^4$.<br><br>Final temperature $T_2 = 327^{\\circ}\\mathrm{C} = 600\\text{ K}$.<br><br>Since length and breadth are reduced to half, the new area $A_2 = \\dfrac{L}{2} \\times \\dfrac{B}{2} = \\dfrac{A}{4}$.<br><br>Final energy emitted per second $E_2 \\propto A_2 T_2^4$.<br><br>Taking the ratio of $E_2$ to $E_1$:<br><br>$\\dfrac{E_2}{E_1} = \\left(\\dfrac{A_2}{A_1}\\right) \\left(\\dfrac{T_2}{T_1}\\right)^4$<br><br>$\\dfrac{E_2}{E} = \\left(\\dfrac{A/4}{A}\\right) \\left(\\dfrac{600}{300}\\right)^4$<br><br>$\\dfrac{E_2}{E} = \\dfrac{1}{4} \\times (2)^4 = \\dfrac{16}{4} = 4$<br><br>$E_2 = 4E$<br><br>Answer: 4 E", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b33bf9280d7f9932712", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A metal sphere cools at a rate of $1.5^{\\circ} \\mathrm{C} / \\mathrm{min}$ when its temperature is $80^{\\circ} \\mathrm{C}$. When the temperature of the sphere is $40^{\\circ} \\mathrm{C}$, its rate of cooling is $0.3^{\\circ} \\mathrm{C} / \\mathrm{min}$. The temperature of the surrounding $\\left(\\theta_0\\right)$ is", "image": null}, "options": [{"id": "suj80", "text": "$30^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": true}, {"id": "lJOEg", "text": "$35^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "Yh9B8", "text": "$25^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "7nW5S", "text": "$27^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Newton's law of cooling, the rate of cooling is given by $R = k(\\theta - \\theta_0)$.<br><br>For the first case:<br>$1.5 = k(80 - \\theta_0)$<br><br>For the second case:<br>$0.3 = k(40 - \\theta_0)$<br><br>Dividing the first equation by the second equation:<br>$\\dfrac{1.5}{0.3} = \\dfrac{80 - \\theta_0}{40 - \\theta_0}$<br><br>$5 = \\dfrac{80 - \\theta_0}{40 - \\theta_0}$<br><br>$200 - 5\\theta_0 = 80 - \\theta_0$<br><br>$4\\theta_0 = 120$<br><br>$\\theta_0 = 30^{\\circ} \\mathrm{C}$<br><br>Answer: $30^{\\circ} \\mathrm{C}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b33bf9280d7f993270d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The following graph represents the radiant power versus wavelength of the black body. The area under the curve represents\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/bgd4gVHEuIBZooD4x20jvWH4j4JcW2dt5jS0bcfBwoc.original.fullsize_2.png\"><br>", "image": null}, "options": [{"id": "vjCTx", "text": "the maximum wavelength emitted by the object.", "image": null, "isCorrect": false}, {"id": "SuDyS", "text": "the minimum wavelength emitted by the object.", "image": null, "isCorrect": false}, {"id": "yZeE9", "text": "the total energy emitted per unit time by the black body at some particular wavelength", "image": null, "isCorrect": false}, {"id": "xVnby", "text": "the total energy emitted per unit time per unit area by the black body at all wavelengths.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given graph plots the spectral emissive power ($E_{\\lambda}$) on the y-axis against the wavelength ($\\lambda$) on the x-axis for a black body at different temperatures.<br><br>The area under the $E_{\\lambda}$ versus $\\lambda$ curve is given by the integral $\\int_{0}^{\\infty} E_{\\lambda} d\\lambda$.<br><br>This integral represents the total emissive power ($E$) of the black body. By definition, the total emissive power is the total radiant energy emitted per unit time per unit surface area of the black body across all possible wavelengths.<br><br>Therefore, the area under the curve represents the total energy emitted per unit time per unit area by the black body at all wavelengths.<br><br>Answer: the total energy emitted per unit time per unit area by the black body at all wavelengths.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b20bf9280d7f993267c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A body cools from $60^{\\circ} \\mathrm{C}$ to $40^{\\circ} \\mathrm{C}$ in 6 minutes. After next 6 minutes its temperature will be (Temperature of the surroundings is $10^{\\circ} \\mathrm{C}$ )", "image": null}, "options": [{"id": "9p5Ey", "text": "$24^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "qu7iy", "text": "$28^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": true}, {"id": "CJVC5", "text": "$18^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "0haef", "text": "$32^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Newton's law of cooling:<br><br>$\\dfrac{\\theta_1 - \\theta_2}{t} = K \\left( \\dfrac{\\theta_1 + \\theta_2}{2} - \\theta_0 \\right)$<br><br>For the first 6 minutes:<br><br>$\\dfrac{60 - 40}{6} = K \\left( \\dfrac{60 + 40}{2} - 10 \\right)$<br><br>$\\dfrac{20}{6} = K (50 - 10)$<br><br>$\\dfrac{10}{3} = 40 K \\Rightarrow K = \\dfrac{1}{12}$<br><br>For the next 6 minutes, let the final temperature be $\\theta$:<br><br>$\\dfrac{40 - \\theta}{6} = K \\left( \\dfrac{40 + \\theta}{2} - 10 \\right)$<br><br>Substituting $K = \\dfrac{1}{12}$:<br><br>$\\dfrac{40 - \\theta}{6} = \\dfrac{1}{12} \\left( \\dfrac{20 + \\theta}{2} \\right)$<br><br>$\\dfrac{40 - \\theta}{6} = \\dfrac{20 + \\theta}{24}$<br><br>$4(40 - \\theta) = 20 + \\theta$<br><br>$160 - 4\\theta = 20 + \\theta$<br><br>$5\\theta = 140$<br><br>$\\theta = 28^{\\circ} \\mathrm{C}$<br><br>Answer: $28^{\\circ} \\mathrm{C}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b1ebf9280d7f993266b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "For a perfectly black body, coefficient of emission is", "image": null}, "options": [{"id": "1PWgB", "text": "zero.", "image": null, "isCorrect": false}, {"id": "dCe2o", "text": "unity.", "image": null, "isCorrect": true}, {"id": "AfP7i", "text": "less than one (non-zero).", "image": null, "isCorrect": false}, {"id": "LT2CY", "text": "infinity.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The coefficient of emission (or emissivity) $e$ of a body is defined as the ratio of its emissive power $E$ to the emissive power $E_b$ of a perfectly black body at the same temperature, so $e = \\dfrac{E}{E_b}$.<br><br>For a perfectly black body, $E = E_b$, which gives $e = 1$.<br><br>Therefore, the coefficient of emission for a perfectly black body is unity.<br><br>Answer: unity.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b0cbf9280d7f99325f1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The co-efficient of absorption and the coefficient of reflection of a thin uniform plate are 0.77 and 0.17 respectively. If 250 kcal of heat is incident on the surface of the plate, the quantity of heat transmitted is", "image": null}, "options": [{"id": "MLAQZ", "text": "7 kcal", "image": null, "isCorrect": false}, {"id": "uJLsM", "text": "12 kcal", "image": null, "isCorrect": false}, {"id": "y8FbN", "text": "15 kcal", "image": null, "isCorrect": true}, {"id": "lWQjU", "text": "22 kcal", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $a$, $r$, and $t$ be the coefficients of absorption, reflection, and transmission respectively.<br><br>We know that $a + r + t = 1$<br><br>Substituting the given values:<br><br>$0.77 + 0.17 + t = 1$<br><br>$0.94 + t = 1$<br><br>$t = 0.06$<br><br>The quantity of heat transmitted is given by $Q_t = t \\times Q$<br><br>$Q_t = 0.06 \\times 250 = 15$ kcal<br><br>Answer: 15 kcal", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871afabf9280d7f9932544", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Black sphere of radius R radiates power P at certain temperature T . If the temperature is doubled, the radius gets doubled. Now the power radiated would be", "image": null}, "options": [{"id": "U2NRY", "text": "4 P", "image": null, "isCorrect": false}, {"id": "JJfeh", "text": "8 P", "image": null, "isCorrect": false}, {"id": "NuhfM", "text": "16 P", "image": null, "isCorrect": false}, {"id": "hsjgf", "text": "64 P", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Stefan-Boltzmann law, the power radiated by a black body is given by $P = \\sigma A T^4$.<br><br>For a sphere of radius $R$, the surface area is $A = 4 \\pi R^2$.<br><br>Thus, $P = \\sigma (4 \\pi R^2) T^4$, which implies $P \\propto R^2 T^4$.<br><br>When the temperature is doubled ($T' = 2T$) and the radius is doubled ($R' = 2R$), the new power radiated is:<br><br>$P' \\propto (2R)^2 (2T)^4$<br><br>$P' \\propto 4R^2 \\times 16T^4$<br><br>$P' \\propto 64 R^2 T^4$<br><br>Therefore, $P' = 64 P$.<br><br>Answer: 64 P", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792142f0aee93fa0796dea1", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "A bucket full of hot water is kept in a room. If it cools from $75^{\\circ} \\mathrm{C}$ to $70^{\\circ} \\mathrm{C}$ in $\\mathrm{t}_1$ minutes, from $70^{\\circ} \\mathrm{C}$ to $65^{\\circ} \\mathrm{C}$ in $\\mathrm{t}_2$ minutes and $65^{\\circ} \\mathrm{C}$ to $60^{\\circ} \\mathrm{C}$ in $\\mathrm{t}_3$ minutes, then", "image": null}, "options": [{"id": "3Xmvc", "text": "$\\mathrm{t}_1 \\lt \\mathrm{t}_2 \\lt \\mathrm{t}_3$", "image": null, "isCorrect": true}, {"id": "uToyA", "text": "$t_1 \\gt t_2 \\gt t_3$", "image": null, "isCorrect": false}, {"id": "HY6NR", "text": "$t_1=t_2=t_3$", "image": null, "isCorrect": false}, {"id": "0mLBR", "text": "$\\mathrm{t}_1 \\lt \\mathrm{t}_2=\\mathrm{t}_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Newton's law of cooling, the rate of cooling of a body is directly proportional to the temperature difference between the body and its surroundings.<br><br>$\\dfrac{dT}{dt} = -k(T - T_0)$<br><br>As the temperature of the water decreases, the average temperature difference $(T - T_0)$ between the water and the surroundings also decreases.<br><br>Consequently, the rate of cooling decreases, meaning it takes progressively more time to cool through the same temperature interval of $5^{\\circ} \\mathrm{C}$.<br><br>Therefore, the time taken for successive equal temperature drops will increase.<br><br>$\\mathrm{t}_1 \\lt \\mathrm{t}_2 \\lt \\mathrm{t}_3$<br><br>Answer: $\\mathrm{t}_1 \\lt \\mathrm{t}_2 \\lt \\mathrm{t}_3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792142e0aee93fa0796de9b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "The power radiated by a black body is P and it radiates maximum energy around the wavelength $\\lambda_0$. Now the temperature of the black body is changed so that it radiates maximum energy around wavelength $\\left(\\frac{\\lambda_0}{2}\\right)$. The power radiated by it will now increase by a factor of", "image": null}, "options": [{"id": "CWlUB", "text": "2", "image": null, "isCorrec
