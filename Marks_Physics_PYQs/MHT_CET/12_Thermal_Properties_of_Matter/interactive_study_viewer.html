ortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "The coefficient of thermal conductivity of a rod depends on its", "image": null}, "options": [{"id": "NbGl9", "text": "area of cross-section.", "image": null, "isCorrect": false}, {"id": "xAHhV", "text": "material of the rod.", "image": null, "isCorrect": true}, {"id": "e5eGC", "text": "length.", "image": null, "isCorrect": false}, {"id": "3M2Sr", "text": "mass.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Thermal conductivity is a material property.\nIt does not depend on the area of cross-section, length and mass of the rod.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2613c0279619d9d8a2ae6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "A cylindrical metallic rod in thermal contact with two reservoirs of heat at its two end conduct an amount of heat ' $Q_1$ ' in time ' $t$ ' the metallic rod is melted and the material is formed into a rod of length four times the length of original rod. The amount of heat conducted by the new rod when placed in thermal contact with the same two reservoirs in time $t$ is ' $Q_2$ '. Then $\\frac{Q_1}{Q_2}$ is", "image": null}, "options": [{"id": "OtJ62", "text": "$16$", "image": null, "isCorrect": true}, {"id": "mwU2H", "text": "$\\frac{1}{16}$", "image": null, "isCorrect": false}, {"id": "JfvSt", "text": "$\\frac{1}{4}$", "image": null, "isCorrect": false}, {"id": "q0aRB", "text": "$4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The heat conduction rate is given by:\n$\\frac{Q}{t}=\\frac{k A\\left(T_1-T_2\\right)}{l}$\nConsidering volume conservation:\n$\\begin{aligned} & A_1 l_1=A_2 l_2 \\\\ & A_1 l_1=A_2\\left(4 l_1\\right) \\\\ & \\Rightarrow A_2=\\frac{A_1}{4} \\\\ & \\frac{Q_2}{t}=\\frac{k\\left(\\frac{A_1}{4}\\right)\\left(T_1-T_2\\right)}{4 l_1}=\\frac{1}{16} \\frac{k A_1\\left(T_1-T_2\\right)}{l_1}=\\frac{1}{16} \\frac{Q_1}{t} \\\\ & \\Rightarrow Q_2=\\frac{1}{16} Q_1\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261040279619d9d8a291e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "The ratio of thermal conductivity of two rods $\\mathrm{A}$ and $\\mathrm{B}$ with the same area of cross-section is $3: 2$. If the thermal resistance of two rods is the same, then the ratio of length of rod A to length of rod B is", "image": null}, "options": [{"id": "ziDdk", "text": "$3: 2$", "image": null, "isCorrect": true}, {"id": "OsxvA", "text": "$2: 3$", "image": null, "isCorrect": false}, {"id": "VqdGu", "text": "$5: 1$", "image": null, "isCorrect": false}, {"id": "RJuDE", "text": "$1: 5$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $A_1=A_2$ and $\\frac{K_1}{K_2}=\\frac{3}{2}$\nIf thermal resistance is equal\n$R_1=R_2 \\Rightarrow \\frac{l_1}{K_1 A_1}=\\frac{l_2}{K_2 A_2} \\Rightarrow \\frac{l_1}{l_2}=\\frac{K_1}{K_2}=\\frac{3}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260b50279619d9d8a26ab", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "A cylindrical rod has temperature ' $\\mathrm{T}_1$ ' and ' $\\mathrm{T}_2$ ' at its ends. The rate of flow of heat is ' $\\mathrm{Q}_1$ ' $\\mathrm{cal} \\mathrm{s}^{-1}$. If length and radius of the rod are doubled keeping temperature constant, then the rate of flow of heat ' $Q_2$ ' will be", "image": null}, "options": [{"id": "42mF7", "text": "$\\mathrm{Q}_2=\\frac{\\mathrm{Q}_1}{2}$", "image": null, "isCorrect": false}, {"id": "uKcUi", "text": "$\\mathrm{Q}_2=\\frac{\\mathrm{Q}_1}{4}$", "image": null, "isCorrect": false}, {"id": "vlR9k", "text": "$\\mathrm{Q}_2=4 \\mathrm{Q}_1$", "image": null, "isCorrect": false}, {"id": "RVrkt", "text": "$\\mathrm{Q}_2=2 \\mathrm{Q}_1$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{Q}_1=\\frac{\\mathrm{kA}\\left(\\mathrm{T}_1-\\mathrm{T}_2\\right)}{\\mathrm{L}_1}=\\frac{\\mathrm{k} \\pi \\mathrm{r}_1^2\\left(\\mathrm{~T}_1-\\mathrm{T}_2\\right)}{\\mathrm{L}_1} \\\\ & \\mathrm{Q}_2=\\frac{\\mathrm{k} \\pi \\mathrm{r}_2^2\\left(\\mathrm{~T}_1-\\mathrm{T}_2\\right)}{\\mathrm{L}_2} \\\\ & \\frac{\\mathrm{Q}_2}{\\mathrm{Q}_1}=\\frac{\\mathrm{r}_2^2}{\\mathrm{r}_1^2} \\cdot \\frac{\\mathrm{L}_1}{\\mathrm{~L}_2}=(2)^2 \\cdot \\frac{1}{2}=2 \\\\ & \\therefore \\mathrm{Q}_2=2 \\mathrm{Q}_1\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260930279619d9d8a259f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "The temperature difference between two sides of an iron plate, $1.8 \\mathrm{~cm}$ thick is $9^{\\circ} \\mathrm{C}$. Heat is transmitted through the plate $10 \\mathrm{k} \\mathrm{cal} / \\mathrm{s} . \\mathrm{m}^2$ at steady state. The thermal conductivity of iron is", "image": null}, "options": [{"id": "d9tFQ", "text": "$0.02 \\frac{\\mathrm{kcal}}{\\mathrm{ms}^{\\circ} \\mathrm{C}}$", "image": null, "isCorrect": true}, {"id": "fLhyU", "text": "$0.04 \\frac{\\mathrm{kcal}}{\\mathrm{ms}^{\\circ} \\mathrm{C}}$", "image": null, "isCorrect": false}, {"id": "AKjlq", "text": "$0.05 \\frac{\\mathrm{kcal}}{\\mathrm{ms}^{\\circ} \\mathrm{C}}$", "image": null, "isCorrect": false}, {"id": "PE2Ad", "text": "$0.004 \\frac{\\mathrm{kcal}}{\\mathrm{ms}^{\\circ} \\mathrm{C}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\frac{\\mathrm{Q}}{\\mathrm{At}}=\\frac{\\mathrm{k} \\Delta \\theta}{\\mathrm{d}} \\\\ & \\therefore 10=\\mathrm{k} \\times \\frac{9}{1.8 \\times 10^2} \\\\ & \\therefore \\mathrm{k}=\\frac{18 \\times 10^{-2}}{9}=2 \\times 10^{-2} \\mathrm{kcal} / \\mathrm{ms}^{\\circ} \\mathrm{C}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260810279619d9d8a250a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "The rate of flow of heat through a copper rod with temperature difference $28^{\\circ} \\mathrm{C}$ is $1400 \\mathrm{cal} \\mathrm{s}^{-1}$. The thermal resistance of copper rod will be", "image": null}, "options": [{"id": "LbiXJ", "text": "$0.05 \\frac{{ }^{\\circ} \\mathrm{Cs}}{\\mathrm{cal}}$", "image": null, "isCorrect": false}, {"id": "pvwA2", "text": "$0.02 \\frac{{ }^{\\circ} \\mathrm{Cs}}{\\mathrm{cal}}$", "image": null, "isCorrect": true}, {"id": "QXVYv", "text": "$5 \\frac{{ }^{\\circ} \\mathrm{Cs}}{\\mathrm{cal}}$", "image": null, "isCorrect": false}, {"id": "QvhuW", "text": "$2 \\frac{{ }^{\\circ} \\mathrm{Cs}}{\\mathrm{cal}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Thermal resistance $=\\frac{\\text { Temp.difference }}{\\text { Thermalcurrent }}=\\frac{28}{1400}=0.02{ }^{\\circ} \\mathrm{Cs} / \\mathrm{cal}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2606b0279619d9d8a2453", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "A cylindrical rod is having temperatures $\\theta_1$ and $\\theta_2$ at its ends. The rate of heat flow is ' $\\mathrm{Q}$ ' $\\mathrm{J} \\mathrm{s}{ }^{-1}$. All the linear dimensions of the rod are doubled by keeping the temperatures constant. What is the new rate of flow of heat?", "image": null}, "options": [{"id": "n2o4G", "text": "$\\frac{Q}{2}$", "image": null, "isCorrect": false}, {"id": "vl0W9", "text": "$\\frac{Q}{4}$", "image": null, "isCorrect": false}, {"id": "EfsHb", "text": "$2 Q$", "image": null, "isCorrect": true}, {"id": "d3Ogj", "text": "$\\frac{3 Q}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\mathrm{Q}=\\frac{\\mathrm{kA} \\Delta \\theta}{\\ell}\n$$\nIf the radius of the cylindrical rod is doubled, then its area of cross-section will become four times.\n$$\n\\begin{aligned}\n& \\therefore \\mathrm{A}_2=4 \\mathrm{~A}_1 \\\\\n& \\text { Also, } \\ell_2=2 \\ell_1 \\\\\n& \\therefore \\frac{\\mathrm{Q}^{\\prime}}{\\mathrm{Q}}=\\frac{\\mathrm{A}_2}{\\mathrm{~A}_1} \\cdot \\frac{\\mathrm{d}_1}{\\mathrm{~d}_2}=4 \\times \\frac{1}{2}=2 \\\\\n& \\therefore \\mathrm{Q}^{\\prime}=2 \\mathrm{Q}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2605d0279619d9d8a23e1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "Two rods of same length and material are joined end to end. They transfer heat in 8 second. When they are joined in parallel they transfer same amount of heat in same conditions in time", "image": null}, "options": [{"id": "HVmjB", "text": "3 s", "image": null, "isCorrect": false}, {"id": "FCYYH", "text": "2 s", "image": null, "isCorrect": true}, {"id": "krVSa", "text": "1 s", "image": null, "isCorrect": false}, {"id": "uVdIS", "text": "4 s", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $R$ be the thermal resistance of each rod when connected in series, the total resistance will be $\\mathrm{R}_{\\mathrm{s}}=2 \\mathrm{R}$\nWhey they are connected in parallel, the effective resistance will be\n$$\n\\begin{aligned}\n& \\mathrm{R}_{\\mathrm{p}}=\\frac{\\mathrm{R}}{2} \\\\\n& \\therefore \\frac{\\mathrm{R}_{\\mathrm{p}}}{\\mathrm{R}_{\\mathrm{s}}}=\\frac{1}{4}\n\\end{aligned}\n$$\nIn parallel combination, the resistance becomes one-fourth and hence time will also become one-fourth.\n$\\therefore$ Time taken $\\frac{8}{4}=2 \\mathrm{~s}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2604b0279619d9d8a234f", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "The temperature difference between two sides of metal plate, $3 \\mathrm{~cm}$ thick is $15^{\\circ} \\mathrm{C}$. Heat is transmitted through plate at the rate of $900 \\mathrm{kcal}$ per minute per $\\mathrm{m}^2$ at steady state. The thermal conductivity of metal is", "image": null}, "options": [{"id": "Iygnm", "text": "$1.8 \\times 10^{-2} \\frac{\\mathrm{kcal}}{\\mathrm{ms}^{\\circ} \\mathrm{C}}$", "image": null, "isCorrect": false}, {"id": "NZX6e", "text": "$4.5 \\times 10^{-2} \\frac{\\mathrm{kcal}}{\\mathrm{ms}^{\\circ} \\mathrm{C}}$", "image": null, "isCorrect": false}, {"id": "RkhP1", "text": "$3 \\times 10^{-2} \\frac{\\mathrm{kcal}}{\\mathrm{ms}^{\\circ} \\mathrm{C}}$", "image": null, "isCorrect": true}, {"id": "AQC0L", "text": "$6 \\times 10^{-2} \\frac{\\mathrm{kcal}}{\\mathrm{ms}^{\\circ} \\mathrm{C}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\frac{\\mathrm{Q}}{\\mathrm{t}}=\\frac{\\mathrm{kA} \\Delta \\theta}{\\mathrm{d}} \\\\\n& \\therefore \\mathrm{k}=\\frac{\\mathrm{Q}}{\\mathrm{tA}} \\cdot \\frac{\\mathrm{d}}{\\Delta \\theta} \\\\\n& \\frac{\\mathrm{Q}}{\\mathrm{tA}}=900 \\mathrm{kcal} \\text { per minute per } \\mathrm{m}^2=\\frac{900}{60}=15 \\mathrm{kcal} / \\mathrm{s} \\cdot \\mathrm{m}^2 \\\\\n& \\mathrm{~d}=3 \\mathrm{~cm}=3 \\times 10^{-2} \\mathrm{~m}, \\Delta \\theta=15^{\\circ} \\mathrm{C} \\\\\n& \\therefore \\mathrm{k}=\\frac{15 \\times 3 \\times 10^{-2}}{15}=3 \\times 10^{-2} \\mathrm{kcal} / \\mathrm{s} \\cdot \\mathrm{m} .{ }^{\\circ} \\mathrm{C}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["defa  may decreases", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If the temperature of cold junction decreases then neutral temperature remains same.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e760279619d9d8a149e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "For a thermocouple, the inversion temperature is $600^{\\circ} \\mathrm{C}$ and the neutral temperature is $320^{\\circ} \\mathrm{C}$. Find the temperature of the cold junction?", "image": null}, "options": [{"id": "4UoLq", "text": "$40^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": true}, {"id": "oUieh", "text": "$20^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "gBTac", "text": "$80^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "YJWGQ", "text": "$60^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Neutral temperature $\\quad T_{n}=\\frac{T_{c}+T_{i}}{2}$\n$$\n\\begin{aligned}\n320^{\\circ} &=\\frac{T_{c}+600^{\\circ}}{2} \\\\\n640^{\\circ} &=T_{c}+600^{\\circ} \\\\\nT_{c} &=40^{\\circ} \\mathrm{C}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e600279619d9d8a13ee", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "The temperature at which thermoemf is zero is", "image": null}, "options": [{"id": "MbYxD", "text": "temperature of inversion", "image": null, "isCorrect": true}, {"id": "jMIol", "text": "temperature of cold junction", "image": null, "isCorrect": false}, {"id": "xK8qA", "text": "neutral temperature", "image": null, "isCorrect": false}, {"id": "6Gm8c", "text": "None of the above", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a given thermocouple the temperature of the hot junction at which thermo emf becomes zero is called the temperature of inversion.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e520279619d9d8a137f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "If the temperature of cold junction of thermocouple is lowered, then the neutral temperature", "image": null}, "options": [{"id": "9GCSo", "text": "increases", "image": null, "isCorrect": false}, {"id": "QcEel", "text": "approaches inversion temperature", "image": null, "isCorrect": false}, {"id": "NBuB9", "text": "decreases", "image": null, "isCorrect": false}, {"id": "mH89m", "text": "remains the same", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Neutral temperature is independent of temperature of cold junction.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e3c0279619d9d8a12cd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "In an adiabatic change, the pressure and temperature of a monoatomic gas are related with relation $p \\propto T^{C}$, where $C$ is equal to", "image": null}, "options": [{"id": "9Zw4D", "text": "$\\frac{5}{4}$", "image": null, "isCorrect": false}, {"id": "rfs7h", "text": "$\\frac{5}{3}$", "image": null, "isCorrect": false}, {"id": "1Dchq", "text": "$\\frac{5}{2}$", "image": null, "isCorrect": true}, {"id": "xfqni", "text": "$\\frac{3}{5}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Key Idea Poisson's equation for adiabatic process is given by\n$$\np V^{\\gamma}=\\text { constant. }\n$$\nFor adiabatic process, Poisson's equation is given by\n$$\np V^{\\gamma}=\\text { constant }\n$$\nIdeal gas relation is\n$$\n\\begin{aligned}\n& p V &=R T \\\\\n\\Rightarrow & V &=\\frac{R T}{p}\n\\end{aligned}\n$$\nFrom Eqs. (i) and (ii), we get\n$$\np\\left(\\frac{R T}{p}\\right)^{\\gamma}=\\text { constant }\n$$\n$$\n\\Rightarrow \\quad \\frac{T^{\\gamma}}{p^{\\gamma-1}}=\\text { constant }\n$$\nwhere $\\gamma$ is ratio of specific heats of the gas\nGiven, $\\quad p \\propto T^{C} \\quad$... (iv)\nOn comparing with Eq. (iii), we have\n$$\nC=\\frac{\\gamma}{\\gamma-1}\n$$\nFor a monoatomic gas $\\gamma=\\frac{5}{3}$\nWe have\n$$\nC=\\frac{\\frac{5}{3}}{\\frac{5}{3}-1}=\\frac{5}{2}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "65a263240279619d9d8a3c51", "title": "Convection", "totalQuestions": 2, "questions": [{"_id": "65a262520279619d9d8a3397", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "Which one of the following is based on convection?", "image": null}, "options": [{"id": "uuOga", "text": "Heating of a copper utensil", "image": null, "isCorrect": false}, {"id": "tHjXp", "text": "Heating a room by heater", "image": null, "isCorrect": true}, {"id": "eUDLk", "text": "Heating of Iron rod", "image": null, "isCorrect": false}, {"id": "NheOS", "text": "Heat transferred from sun to earth", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Std. $11 \\mid$ Ch-7 $\\mid$ Subtopic-7.9", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e3d0279619d9d8a12d3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "A boat at anchor is rocked by waves whose crests are $100 \\mathrm{~m}$ apart and velocity is $25 \\mathrm{~m} / \\mathrm{s}$. The boat bounces up once in every", "image": null}, "options": [{"id": "wTxP8", "text": "$2500 \\mathrm{~s}$", "image": null, "isCorrect": false}, {"id": "1ffUS", "text": "$75 \\mathrm{~s}$", "image": null, "isCorrect": false}, {"id": "DklDJ", "text": "$4 \\mathrm{~s}$", "image": null, "isCorrect": true}, {"id": "Ys16e", "text": "$0.25 \\mathrm{~s}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Key Idea The distance between the two consecutive crests in transverse wave motion is called wavelength. The boat bounces up, ie, it travels from crest to the consecutive crest along wave motion. Wavelength $=$ distance between two consecutive crests ie,\n$$\n\\lambda=100 \\mathrm{~m}\n$$\nVelocity of wave $=25 \\mathrm{~m} / \\mathrm{s}$ Hence, time in one bounce of boat\n$$\nt=\\frac{\\lambda}{v}=\\frac{100}{25}=4 \\mathrm{~s}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "65a263240279619d9d8a3c50", "title": "Radiation", "totalQuestions": 138, "questions": [{"_id": "6abb88cf15a9fc0fc8c1472a", "type": "singleCorrect", "question": {"text": "Temperature of two stars are in the ratio $3:2$. If wavelength of maximum intensity of first star is $4200\\,\\text{Å}$, the corresponding wavelength for second star is", "image": null}, "options": [{"id": "Y3tJW", "label": "A", "text": "$2100\\,\\text{Å}$", "isCorrect": false, "image": null}, {"id": "piwFH", "label": "B", "text": "$3000\\,\\text{Å}$", "isCorrect": false, "image": null}, {"id": "uFYkJ", "label": "C", "text": "$6300\\,\\text{Å}$", "isCorrect": true, "image": null}, {"id": "1nlNn", "label": "D", "text": "$7000\\,\\text{Å}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Wien's displacement law, the wavelength corresponding to maximum intensity is inversely proportional to the absolute temperature.<br><br>$\\lambda_{m} \\propto \\dfrac{1}{T}$<br><br>$\\lambda_{m1} T_1 = \\lambda_{m2} T_2$<br><br>Given $\\dfrac{T_1}{T_2} = \\dfrac{3}{2}$ and $\\lambda_{m1} = 4200\\,\\text{\\AA}$<br><br>$\\lambda_{m2} = \\lambda_{m1} \\times \\dfrac{T_1}{T_2}$<br><br>$\\lambda_{m2} = 4200 \\times \\dfrac{3}{2} = 6300\\,\\text{\\AA}$<br><br>Answer: $6300\\,\\text{Å}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88cd15a9fc0fc8c14720", "type": "singleCorrect", "question": {"text": "Identify the INCORRECT statement about the black body radiation", "image": null}, "options": [{"id": "cikWB", "label": "A", "text": "Intensity is same for all wavelengths.", "isCorrect": true, "image": null}, {"id": "mtYW1", "label": "B", "text": "Intensity is maximum for a particular wavelength.", "isCorrect": false, "image": null}, {"id": "UovCf", "label": "C", "text": "Intensity is less for longer wavelengths.", "isCorrect": false, "image": null}, {"id": "klElZ", "label": "D", "text": "A black body emits all wavelengths.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The spectral distribution curve of a black body shows that it emits radiation of all possible wavelengths.<br><br>The intensity of emitted radiation is not uniform for all wavelengths. It increases with wavelength, reaches a maximum value at a specific wavelength ($\\lambda_m$), and then decreases for longer wavelengths.<br><br>Therefore, statements (2), (3), and (4) are correct statements regarding black body radiation.<br><br>Statement (1) claims that intensity is the same for all wavelengths, which contradicts the experimental spectral distribution curve and is therefore the incorrect statement.", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88cb15a9fc0fc8c1470f", "type": "singleCorrect", "question": {"text": "Two bodies 'X' and 'Y' at temperatures $T_1$ K and $T_2$ K respectively have the same dimensions. Their emissivities $e_1$ and $e_2$ are in the ratio of $1:6$. If their emissive powers are same, the relation between their temperatures is", "image": null}, "options": [{"id": "AwUif", "label": "A", "text": "$T_1:T_2 = 4^{1/4}:1$", "isCorrect": false, "image": null}, {"id": "j0fOy", "label": "B", "text": "$T_1:T_2 = 5^{1/4}:1$", "isCorrect": false, "image": null}, {"id": "GVBaF", "label": "C", "text": "$T_1:T_2 = 6^{1/4}:1$", "isCorrect": true, "image": null}, {"id": "nV62l", "label": "D", "text": "$T_1:T_2 = 7^{1/4}:1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The emissive power of a body is given by the Stefan-Boltzmann law:<br><br>$E = e \\sigma T^4$<br><br>Given that the emissive powers of bodies X and Y are the same:<br><br>$E_1 = E_2$<br><br>$e_1 \\sigma T_1^4 = e_2 \\sigma T_2^4$<br><br>$\\dfrac{T_1^4}{T_2^4} = \\dfrac{e_2}{e_1}$<br><br>The ratio of their emissivities is given as $e_1 : e_2 = 1 : 6$, which means $\\dfrac{e_2}{e_1} = 6$. Substituting this value:<br><br>$\\dfrac{T_1^4}{T_2^4} = 6$<br><br>$\\dfrac{T_1}{T_2} = 6^{1/4}$<br><br>$T_1 : T_2 = 6^{1/4} : 1$<br><br>Answer: $T_1:T_2 = 6^{1/4}:1$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889a15a9fc0fc8c14545", "type": "singleCorrect", "question": {"text": "The power radiated by a black body is $P$ and it radiates maximum energy at wavelength $\\lambda_o$. If the temperature of the black body is now changed so that it radiates maximum energy at wavelength $0.75\\lambda_o$, the power radiated by it becomes $nP$. The value $n$ is", "image": null}, "options": [{"id": "7xK8X", "label": "A", "text": "$4/3$", "isCorrect": false, "image": null}, {"id": "Ovc6J", "label": "B", "text": "$256/81$", "isCorrect": true, "image": null}, {"id": "FzMLO", "label": "C", "text": "$81/256$", "isCorrect": false, "image": null}, {"id": "uQmlb", "label": "D", "text": "$3/4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Wien's displacement law, the wavelength corresponding to maximum spectral emissive power is inversely proportional to the absolute temperature of the black body.<br><br>$\\lambda_m T = b$<br><br>$\\Rightarrow T \\propto \\dfrac{1}{\\lambda_m}$<br><br>Let the initial temperature be $T_1$ and the final temperature be $T_2$.<br><br>$\\dfrac{T_2}{T_1} = \\dfrac{\\lambda_o}{0.75\\lambda_o} = \\dfrac{1}{3/4} = \\dfrac{4}{3}$<br><br>According to the Stefan-Boltzmann law, the power radiated by a black body is proportional to the fourth power of its absolute temperature.<br><br>$P \\propto T^4$<br><br>Taking the ratio of the final power to the initial power:<br><br>$\\dfrac{P_2}{P_1} = \\left(\\dfrac{T_2}{T_1}\\right)^4$<br><br>Substituting the given values $P_1 = P$ and $P_2 = nP$:<br><br>$\\dfrac{nP}{P} = \\left(\\dfrac{4}{3}\\right)^4$<br><br>$n = \\dfrac{256}{81}$<br><br>Answer: $256/81$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883c15a9fc0fc8c141cb", "type": "singleCorrect", "question": {"text": "A perfectly black body radiates power at temperature $T_1$K. If it is to radiate 16 times this power, its temperature should be increased by", "image": null}, "options": [{"id": "GOonp", "label": "A", "text": "$(16T_1)K$", "isCorrect": false, "image": null}, {"id": "8mhEY", "label": "B", "text": "$(4T_1)K$", "isCorrect": false, "image": null}, {"id": "Y8Oqf", "label": "C", "text": "$(2T_1)K$", "isCorrect": false, "image": null}, {"id": "XxIBN", "label": "D", "text": "$(T_1)K$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "According to the Stefan-Boltzmann law, the power radiated by a perfectly black body is given by $P = \\sigma A T^4$.<br><br>Let the initial power be $P_1$ at temperature $T_1$.<br><br>$P_1 = \\sigma A T_1^4$<br><br>Let the final temperature be $T_2$ for power $P_2 = 16 P_1$.<br><br>$P_2 = \\sigma A T_2^4$<br><br>Substituting $P_2 = 16 P_1$, we get:<br><br>$16 \\sigma A T_1^4 = \\sigma A T_2^4$<br><br>$T_2^4 = 16 T_1^4$<br><br>$T_2 = 2 T_1$<br><br>The increase in temperature is $\\Delta T = T_2 - T_1 = 2 T_1 - T_1 = T_1$.<br><br>Therefore, the temperature should be increased by $T_1$ K.<br><br>Answer: $(T_1)K$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88aa15a9fc0fc8c145da", "type": "singleCorrect", "question": {"text": "The temperature of a black body is increased by $50\\%$ then the percentage increase of radiation is nearly", "image": null}, "options": [{"id": "3YK13", "label": "A", "text": "$100\\%$", "isCorrect": false, "image": null}, {"id": "tRqk6", "label": "B", "text": "$25\\%$", "isCorrect": false, "image": null}, {"id": "UyRz0", "label": "C", "text": "$400\\%$", "isCorrect": true, "image": null}, {"id": "1Lswp", "label": "D", "text": "$500\\%$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Stefan-Boltzmann law, the energy radiated by a black body per unit time is given by $E = \\sigma T^4$.<br><br>Let the initial temperature be $T_1 = T$.<br><br>The final temperature is $T_2 = T + 0.5T = 1.5T$.<br><br>The initial radiation is $E_1 = \\sigma T^4$.<br><br>The final radiation is $E_2 = \\sigma (1.5T)^4 = 5.0625 \\sigma T^4$.<br><br>The percentage increase in radiation is $\\dfrac{E_2 - E_1}{E_1} \\times 100\\%$.<br><br>Substituting the values, we get $\\dfrac{5.0625 \\sigma T^4 - \\sigma T^4}{\\sigma T^4} \\times 100\\% = 4.0625 \\times 100\\% = 406.25\\%$.<br><br>The percentage increase is nearly $400\\%$.<br><br>Answer: $400\\%$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886b15a9fc0fc8c14383", "type": "singleCorrect", "question": {"text": "The power radiated by a black body is P and it radiates maximum energy at wavelength $\\lambda_0$. If the temperature of the black body is now changed so that it radiates maximum energy at wavelength $\\dfrac{3\\lambda_0}{4}$, the power radiated by it becomes nP. The value of n is", "image": null}, "options": [{"id": "xSdMY", "label": "A", "text": "$\\dfrac{256}{81}$", "isCorrect": true, "image": null}, {"id": "50CEw", "label": "B", "text": "$\\dfrac{4}{3}$", "isCorrect": false, "image": null}, {"id": "0A4xv", "label": "C", "text": "$\\dfrac{3}{4}$", "isCorrect": false, "image": null}, {"id": "UU1JN", "label": "D", "text": "$\\dfrac{81}{256}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Wien's displacement law, the wavelength corresponding to maximum emission is inversely proportional to the absolute temperature of the black body:<br><br>$\\lambda_{m} T = b \\Rightarrow T \\propto \\dfrac{1}{\\lambda_{m}}$<br><br>Given the initial wavelength $\\lambda_{1} = \\lambda_{0}$ and final wavelength $\\lambda_{2} = \\dfrac{3\\lambda_{0}}{4}$, the ratio of temperatures is:<br><br>$\\dfrac{T_{2}}{T_{1}} = \\dfrac{\\lambda_{1}}{\\lambda_{2}} = \\dfrac{\\lambda_{0}}{\\dfrac{3\\lambda_{0}}{4}} = \\dfrac{4}{3}$<br><br>According to the Stefan-Boltzmann law, the power radiated by a black body is proportional to the fourth power of its absolute temperature:<br><br>$P \\propto T^{4}$<br><br>The ratio of the new power to the initial power is:<br><br>$\\dfrac{P_{2}}{P_{1}} = \\left(\\dfrac{T_{2}}{T_{1}}\\right)^{4} = \\left(\\dfrac{4}{3}\\right)^{4} = \\dfrac{256}{81}$<br><br>Since $P_{1} = P$ and $P_{2} = nP$, we get:<br><br>$n = \\dfrac{256}{81}$<br><br>Answer: $\\dfrac{256}{81}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887b15a9fc0fc8c14419", "type": "singleCorrect", "question": {"text": "The wavelength of maximum intensity of radiation emitted by a star is $289.8$ nm. The radiation intensity of the star is (Stefan's constant = $5.67 \\times 10^{-8}$ SI unit, Wein's constant $2898\\,\\mu\\text{mk}$)", "image": null}, "options": [{"id": "ATdsJ", "label": "A", "text": "$5.67 \\times 10^{8}\\,W/m^2$", "isCorrect": true, "image": null}, {"id": "9TOkd", "label": "B", "text": "$5.67 \\times 10^{-12}\\,W/m^2$", "isCorrect": false, "image": null}, {"id": "8p6tD", "label": "C", "text": "$10.67 \\times 10^{7}\\,W/m^2$", "isCorrect": false, "image": null}, {"id": "55YAH", "label": "D", "text": "$10.67 \\times 10^{11}\\,W/m^2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using Wien's displacement law:<br><br>$\\lambda_m T = b$<br><br>$T = \\dfrac{2898 \\times 10^{-6}}{289.8 \\times 10^{-9}} = 10^4$ K <br><br>According to Stefan-Boltzmann law, the radiation intensity is:<br><br>$I = \\sigma T^4$<br><br>$I = 5.67 \\times 10^{-8} \\times (10^4)^4$<br><br>$I = 5.67 \\times 10^{-8} \\times 10^{16}$<br><br>$I = 5.67 \\times 10^8$ W/m$^2$<br><br>Answer: $5.67 \\times 10^{8}\\,W/m^2$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887a15a9fc0fc8c14418", "type": "singleCorrect", "question": {"text": "At $273^\\circ\\text{C}$, the emissive power of a perfectly black body is $R$. The value at $0^\\circ\\text{C}$ is", "image": null}, "options": [{"id": "p6JHe", "label": "A", "text": "$\\dfrac{R}{4}$", "isCorrect": false, "image": null}, {"id": "d93t2", "label": "B", "text": "$\\dfrac{R}{16}$", "isCorrect": true, "image": null}, {"id": "yno7K", "label": "C", "text": "$\\dfrac{R}{2}$", "isCorrect": false, "image": null}, {"id": "12fFe", "label": "D", "text": "$\\dfrac{R}{8}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Stefan-Boltzmann law, the emissive power of a perfectly black body is directly proportional to the fourth power of its absolute temperature.<br><br>$E \\propto T^4$<br><br>Given temperatures in Kelvin:<br><br>$T_1 = 273^\\circ\\text{C} = 273 + 273 = 546\\text{ K}$<br><br>$T_2 = 0^\\circ\\text{C} = 0 + 273 = 273\\text{ K}$<br><br>Taking the ratio of emissive powers:<br><br>$\\dfrac{E_2}{E_1} = \\left(\\dfrac{T_2}{T_1}\\right)^4$<br><br>$\\dfrac{E_2}{R} = \\left(\\dfrac{273}{546}\\right)^4$<br><br>$\\dfrac{E_2}{R} = \\left(\\dfrac{1}{2}\\right)^4 = \\dfrac{1}{16}$<br><br>$E_2 = \\dfrac{R}{16}$<br><br>Answer: $\\dfrac{R}{16}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888c15a9fc0fc8c144b9", "type": "singleCorrect", "question": {"text": "If $150$ J of energy is incident on area $2 \\text{m}^2$ and amount of heat reflected is $15$ J, coefficient of absorption is $0.6$ the amount of energy transmitted is", "image": null}, "options": [{"id": "1zXJE", "label": "A", "text": "$50$ J", "isCorrect": false, "image": null}, {"id": "fzMEk", "label": "B", "text": "$45$ J", "isCorrect": true, "image": null}, {"id": "eYDpb", "label": "C", "text": "$40$ J", "isCorrect": false, "image": null}, {"id": "GXBwd", "label": "D", "text": "$30$ J", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given incident energy, $Q = 150$ J<br><br>Reflected energy, $Q_r = 15$ J<br><br>Coefficient of absorption, $a = 0.6$<br><br>The absorbed energy $Q_a$ is given by:<br><br>$Q_a = a \\times Q$<br><br>$Q_a = 0.6 \\times 150 = 90$ J<br><br>According to the conservation of energy, the total incident energy is the sum of reflected, absorbed, and transmitted energy:<br><br>$Q = Q_r + Q_a + Q_t$<br><br>$150 = 15 + 90 + Q_t$<br><br>$150 = 105 + Q_t$<br><br>$Q_t = 150 - 105 = 45$ J<br><br>Answer: $45$ J", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888c15a9fc0fc8c144b8", "type": "singleCorrect", "question": {"text": "The radiation emitted by a star A is $10000$ times that of the sun. If surface temperature of sun and star A are $6000$ K and $2000$ K respectively, the ratio of radii of star A and sun is", "image": null}, "options": [{"id": "nXbjG", "label": "A", "text": "$1200 : 1$", "isCorrect": false, "image": null}, {"id": "nIjZg", "label": "B", "text": "$900 : 1$", "isCorrect": true, "image": null}, {"id": "qvhUW", "label": "C", "text": "$600 : 1$", "isCorrect": false, "image": null}, {"id": "0sl7S", "label": "D", "text": "$300 : 1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Stefan-Boltzmann law, the power radiated by a star is given by $P = \\sigma A T^4 = \\sigma (4 \\pi R^2) T^4$.<br><br>This implies $P \\propto R^2 T^4$, or $R \\propto \\dfrac{\\sqrt{P}}{T^2}$.<br><br>The ratio of the radii of star A and the sun is given by:<br><br>$\\dfrac{R_A}{R_S} = \\sqrt{\\dfrac{P_A}{P_S}} \\left(\\dfrac{T_S}{T_A}\\right)^2$<br><br>Given $P_A = 10000 P_S$, $T_S = 6000$ K, and $T_A = 2000$ K.<br><br>Substituting the given values:<br><br>$\\dfrac{R_A}{R_S} = \\sqrt{10000} \\times \\left(\\dfrac{6000}{2000}\\right)^2$<br><br>$\\dfrac{R_A}{R_S} = 100 \\times (3)^2 = 100 \\times 9 = 900$<br><br>The ratio of radii of star A and sun is $900 : 1$.<br><br>Answer: $900 : 1$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888a15a9fc0fc8c144ac", "type": "singleCorrect", "question": {"text": "Two hot bodies $B_1$ and $B_2$ have temperature $100^\\circ\\text{C}$ and $80^\\circ\\text{C}$ respectively at $t = 0$. The temperature of the surroundings is $40^\\circ\\text{C}$. The ratio of the respective rates of cooling $R_1$ and $R_2$ of these two bodies at $t=0$ will be", "image": null}, "options": [{"id": "NfHxH", "label": "A", "text": "$R_1 : R_2 = 3 : 2$", "isCorrect": true, "image": null}, {"id": "F9hzG", "label": "B", "text": "$R_1 : R_2 = 5 : 4$", "isCorrect": false, "image": null}, {"id": "wgtp2", "label": "C", "text": "$R_1 : R_2 = 2 : 3$", "isCorrect": false, "image": null}, {"id": "Lw3pM", "label": "D", "text": "$R_1 : R_2 = 4 : 5$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Newton's law of cooling, the rate of cooling of a body is directly proportional to the temperature difference between the body and its surroundings, assuming other conditions are identical.<br><br>$R = \\dfrac{dT}{dt} \\propto (T - T_0)$<br><br>For body $B_1$, the temperature is $T_1 = 100^\\circ\\text{C}$ and the surrounding temperature is $T_0 = 40^\\circ\\text{C}$.<br><br>$R_1 \\propto (100 - 40) = 60$<br><br>For body $B_2$, the temperature is $T_2 = 80^\\circ\\text{C}$ and the surrounding temperature is $T_0 = 40^\\circ\\text{C}$.<br><br>$R_2 \\propto (80 - 40) = 40$<br><br>Taking the ratio of the rates of cooling:<br><br>$\\dfrac{R_1}{R_2} = \\dfrac{60}{40} = \\dfrac{3}{2}$<br><br>Therefore, $R_1 : R_2 = 3 : 2$.<br><br>Answer: $R_1 : R_2 = 3 : 2$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885c15a9fc0fc8c142f5", "type": "singleCorrect", "question": {"text": "Heat energy is incident on the surface at the rate of $1000$ J/min. If coefficient of absorption is $0.8$ and coefficient of reflection is $0.1$ then heat energy transmitted by the surface in 5 minute is", "image": null}, "options": [{"id": "LKBif", "label": "A", "text": "$100$ J", "isCorrect": false, "image": null}, {"id": "H78nz", "label": "B", "text": "$500$ J", "isCorrect": true, "image": null}, {"id": "XL2uw", "label": "C", "text": "$700$ J", "isCorrect": false, "image": null}, {"id": "MKhwU", "label": "D", "text": "$900$ J", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the coefficient of transmission be $t_r$.<br><br>From the relation $a + r + t_r = 1$, where $a$ is the coefficient of absorption and $r$ is the coefficient of reflection:<br><br>$0.8 + 0.1 + t_r = 1$<br><br>$t_r = 0.1$<br><br>Total incident heat energy in $5$ minutes is $Q = 1000 \\times 5 = 5000$ J.<br><br>Heat energy transmitted by the surface is $Q_t = t_r \\times Q$<br><br>$Q_t = 0.1 \\times 5000 = 500$ J.<br><br>Answer: $500$ J", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885c15a9fc0fc8c142f4", "type": "singleCorrect", "question": {"text": "The total radiant energy per unit area normal to the direction of incidence, received at a distance R from the centre of a star of radius r, whose outer surface radiates as a black body at a temperature 'T' K is ($\\sigma$ = Stefan's constant)", "image": null}, "options": [{"id": "JR1iQ", "label": "A", "text": "$\\dfrac{\\sigma r^2 T^4}{R^2}$", "isCorrect": true, "image": null}, {"id": "R26dg", "label": "B", "text": "$\\dfrac{\\sigma r^2 T^4}{4\\pi R^2}$", "isCorrect": false, "image": null}, {"id": "2Pmb4", "label": "C", "text": "$\\dfrac{\\sigma r^4 T^4}{R^4}$", "isCorrect": false, "image": null}, {"id": "uTbha", "label": "D", "text": "$\\dfrac{4\\pi \\sigma r^2 T^4}{R^2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Total power radiated by the star is given by Stefan's law:<br><br>$P = \\sigma A T^4 = \\sigma (4 \\pi r^2) T^4$<br><br>This energy spreads uniformly over a spherical surface of radius $R$. The surface area at distance $R$ is $4 \\pi R^2$.<br><br>The radiant energy received per unit area per unit time (intensity) at distance $R$ is:<br><br>$I = \\dfrac{P}{4 \\pi R^2}$<br><br>$I = \\dfrac{\\sigma (4 \\pi r^2) T^4}{4 \\pi R^2}$<br><br>$I = \\dfrac{\\sigma r^2 T^4}{R^2}$<br><br>Answer: $\\dfrac{\\sigma r^2 T^4}{R^2}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88ba15a9fc0fc8c1466a", "type": "singleCorrect", "question": {"text": "A rectangular black body of temperature $27^\\circ C$ has surface area $6$ cm $\\times 3$ cm and rate of radiation $E$. If its temperature is increased by $300^\\circ C$ and its linear dimensions are reduced to $\\left(\\dfrac{1}{3}\\right)^{rd}$ of their initial value then the rate of radiation is", "image": null}, "options": [{"id": "ADb4y", "label": "A", "text": "$\\dfrac{8}{9} E$", "isCorrect": false, "image": null}, {"id": "1Qer2", "label": "B", "text": "$\\dfrac{16}{9} E$", "isCorrect": true, "image": null}, {"id": "lTm0d", "label": "C", "text": "$\\dfrac{4}{9} E$", "isCorrect": false, "image": null}, {"id": "fE97Y", "label": "D", "text": "$\\dfrac{32}{9} E$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Stefan-Boltzmann law, the rate of radiation is $E = \\sigma A T^4$.<br><br>Initial temperature, $T_1 = 27^\\circ\\text{C} = 27 + 273 = 300\\text{ K}$.<br><br>The temperature is increased by $300^\\circ\\text{C}$, so final temperature $T_2 = 27^\\circ\\text{C} + 300^\\circ\\text{C} = 327^\\circ\\text{C} = 327 + 273 = 600\\text{ K}$.<br><br>Initial area is $A_1$. Since linear dimensions are reduced to one-third, the new area is $A_2 = \\dfrac{1}{3} \\times \\dfrac{1}{3} A_1 = \\dfrac{A_1}{9}$.<br><br>Taking the ratio of the final rate of radiation to the initial rate:<br><br>$\\dfrac{E_2}{E_1} = \\dfrac{A_2}{A_1} \\times \\left(\\dfrac{T_2}{T_1}\\right)^4$<br><br>$\\dfrac{E_2}{E} = \\dfrac{A_1 / 9}{A_1} \\times \\left(\\dfrac{600}{300}\\right)^4$<br><br>$\\dfrac{E_2}{E} = \\dfrac{1}{9} \\times (2)^4$<br><br>$\\dfrac{E_2}{E} = \\dfrac{16}{9}$<br><br>$E_2 = \\dfrac{16}{9}E$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb882c15a9fc0fc8c14133", "type": "singleCorrect", "question": {"text": "Three spheres, P, Q and R, having radii $4$ m, $5$ m and $6$ m respectively, are coated with lamp black on their outer surfaces. The wavelengths corresponding to maximum intensity (radiated) are $400$ nm, $500$ nm and $600$ nm respectively. If the powers radiated by them are $P_P$, $P_Q$ and $P_R$ respectively, then $P_P : P_Q : P_R$ is", "image": null}, "options": [{"id": "0fNFe", "label": "A", "text": "$\\dfrac{1}{4}:\\dfrac{1}{5}:\\dfrac{1}{6}$", "isCorrect": false, "image": null}, {"id": "kL2MT", "label": "B", "text": "$\\dfrac{1}{16}:\\dfrac{1}{25}:\\dfrac{1}{36}$", "isCorrect": true, "image": null}, {"id": "3DPAp", "label": "C", "text": "$\\dfrac{1}{64}:\\dfrac{1}{125}:\\dfrac{1}{216}$", "isCorrect": false, "image": null}, {"id": "D3d5E", "label": "D", "text": "$\\dfrac{1}{256}:\\dfrac{1}{625}:\\dfrac{1}{1296}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Wien's displacement law, $\\lambda_{m} T = b$<br><br>$T = \\dfrac{b}{\\lambda_{m}}$<br><br>According to Stefan-Boltzmann law, the power radiated by a black body is given by $P = \\sigma A T^4$<br><br>Substituting $A = 4 \\pi r^2$ and $T = \\dfrac{b}{\\lambda_{m}}$:<br><br>$P = \\sigma (4 \\pi r^2) \\left(\\dfrac{b}{\\lambda_{m}}\\right)^4$<br><br>$P \\propto \\dfrac{r^2}{\\lambda_{m}^4}$<br><br>For sphere P: $P_P \\propto \\dfrac{4^2}{(400)^4} \\propto \\dfrac{16}{256 \\times 10^8} \\propto \\dfrac{1}{16}$<br><br>For sphere Q: $P_Q \\propto \\dfrac{5^2}{(500)^4} \\propto \\dfrac{25}{625 \\times 10^8} \\propto \\dfrac{1}{25}$<br><br>For sphere R: $P_R \\propto \\dfrac{6^2}{(600)^4} \\propto \\dfrac{36}{1296 \\times 10^8} \\propto \\dfrac{1}{36}$<br><br>Therefore, $P_P : P_Q : P_R = \\dfrac{1}{16} : \\dfrac{1}{25} : \\dfrac{1}{36}$<br><br>Answer: $\\dfrac{1}{16}:\\dfrac{1}{25}:\\dfrac{1}{36}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a78c30a4553e1bdb5e", "type": "singleCorrect", "question": {"text": "Two stars A and B radiate maximum energy at wavelength $3.9 \\times 10^{-7}$ m and $5.2 \\times 10^{-7}$ m respectively. The ratio of the temperature of star A to that of star B will be", "image": null}, "options": [{"id": "I1kKQ", "label": "A", "text": "$2 : 3$", "isCorrect": false, "image": null}, {"id": "ffPMl", "label": "B", "text": "$3 : 2$", "isCorrect": false, "image": null}, {"id": "3O1Uq", "label": "C", "text": "$3 : 4$", "isCorrect": false, "image": null}, {"id": "Mqj90", "label": "D", "text": "$4 : 3$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Using Wien's displacement law, $\\lambda_{m} T = b$ (constant).<br><br>Therefore, $\\lambda_{A} T_{A} = \\lambda_{B} T_{B}$<br><br>$\\dfrac{T_{A}}{T_{B}} = \\dfrac{\\lambda_{B}}{\\lambda_{A}}$<br><br>Substituting the given values:<br><br>$\\dfrac{T_{A}}{T_{B}} = \\dfrac{5.2 \\times 10^{-7}}{3.9 \\times 10^{-7}}$<br><br>$\\dfrac{T_{A}}{T_{B}} = \\dfrac{52}{39} = \\dfrac{4}{3}$<br><br>The ratio of the temperature of star A to that of star B is $4 : 3$.<br><br>Answer: $4 : 3$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a58c30a4553e1bdb48", "type": "singleCorrect", "question": {"text": "A sphere having temperature 600 K is losing heat due to radiation. At this temperature its rate of cooling is $R$. The rate of cooling of this sphere at 400 K is $\\dfrac{x}{243}$. The value of $x$ is (Temperature of surrounding is 300 K)", "image": null}, "options": [{"id": "NyRVz", "label": "A", "text": "$50R$", "isCorrect": false, "image": null}, {"id": "xKjUX", "label": "B", "text": "$45R$", "isCorrect": false, "image": null}, {"id": "hZzPI", "label": "C", "text": "$40R$", "isCorrect": false, "image": null}, {"id": "7IrbF", "label": "D", "text": "$35R$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The rate of cooling of a body is given by Stefan-Boltzmann law:<br><br>$R = \\dfrac{dT}{dt} = \\dfrac{e \\sigma A}{ms} (T^4 - T_0^4)$<br><br>This implies $R \\propto (T^4 - T_0^4)$.<br><br>For the first case, $T_1 = 600$ K and $T_0 = 300$ K:<br><br>$R_1 = k (600^4 - 300^4) = R$<br><br>For the second case, $T_2 = 400$ K and $T_0 = 300$ K:<br><br>$R_2 = k (400^4 - 300^4) = \\dfrac{x}{243}$<br><br>Taking the ratio of $R_2$ to $R_1$:<br><br>$\\dfrac{R_2}{R_1} = \\dfrac{400^4 - 300^4}{600^4 - 300^4}$<br><br>$\\dfrac{R_2}{R} = \\dfrac{4^4 - 3^4}{6^4 - 3^4}$<br><br>$\\dfrac{R_2}{R} = \\dfrac{256 - 81}{1296 - 81}$<br><br>$\\dfrac{R_2}{R} = \\dfrac{175}{1215}$<br><br>Dividing the numerator and denominator by $5$:<br><br>$\\dfrac{R_2}{R} = \\dfrac{35}{243}$<br><br>$R_2 = \\dfrac{35R}{243}$<br><br>Comparing this with the given rate of cooling $\\dfrac{x}{243}$, we get:<br><br>$x = 35R$<br><br>Answer: $35R$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a48c30a4553e1bdb3f", "type": "singleCorrect", "question": {"text": "A black body is at temperature of 5780 K. The energy of radiation emitted by the body at wavelength 300 nm is $U_1$, at wavelength 500 nm is $U_2$ and that at 900 nm is $U_3$ respectively. Wien's constant $b = 2.89 \\times 10^6\\ \\text{nmK}$. This shows that", "image": null}, "options": [{"id": "bcO8u", "label": "A", "text": "$U_1 < U_2 < U_3$", "isCorrect": false, "image": null}, {"id": "7DD3K", "label": "B", "text": "$U_1 > U_2 > U_3$", "isCorrect": false, "image": null}, {"id": "mHe7z", "label": "C", "text": "$U_1 < U_2 > U_3$", "isCorrect": true, "image": null}, {"id": "q1BEQ", "label": "D", "text": "$U_1 > U_2 < U_3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using Wien's displacement law, $\\lambda_m T = b$.<br><br>Substituting the given values:<br><br>$\\lambda_m = \\dfrac{2.89 \\times 10^6}{5780} = 500 \\text{ nm}$<br><br>The maximum energy of radiation is emitted at $\\lambda_m = 500 \\text{ nm}$.<br><br>Since $U_2$ corresponds to the energy at $500 \\text{ nm}$, it is the maximum energy.<br><br>Therefore, $U_2 > U_1$ and $U_2 > U_3$.<br><br>This gives $U_1 < U_2 > U_3$.<br><br>Answer: $U_1 < U_2 > U_3$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d34d8c30a4553e1be24e", "type": "singleCorrect", "question": {"text": "A sphere is at temperature $600$ K. In an external environment of $200$ K, its cooling rate is R. When the temperature of the sphere falls to $400$ K then cooling rate R' will become", "image": null}, "options": [{"id": "5BKQD", "label": "A", "text": "$\\dfrac{16}{3}R$", "isCorrect": false, "image": null}, {"id": "0zfqu", "label": "B", "text": "$\\dfrac{16}{9}R$", "isCorrect": false, "image": null}, {"id": "kK6Nr", "label": "C", "text": "$\\dfrac{9}{16}R$", "isCorrect": false, "image": null}, {"id": "nd88v", "label": "D", "text": "$\\dfrac{3}{16}R$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "According to the Stefan-Boltzmann law, the rate of cooling of a body is given by $R = \\dfrac{dT}{dt} = \\dfrac{e \\sigma A}{ms}(T^4 - T_0^4)$.<br><br>For the first case, $T = 600$ K and $T_0 = 200$ K.<br><br>$R \\propto (600^4 - 200^4)$<br><br>$R \\propto 200^4(3^4 - 1^4) = 200^4(81 - 1) = 80 \\times 200^4$<br><br>For the second case, $T = 400$ K and $T_0 = 200$ K.<br><br>$R' \\propto (400^4 - 200^4)$<br><br>$R' \\propto 200^4(2^4 - 1^4) = 200^4(16 - 1) = 15 \\times 200^4$<br><br>Taking the ratio of the two rates:<br><br>$\\dfrac{R'}{R} = \\dfrac{15 \\times 200^4}{80 \\times 200^4} = \\dfrac{15}{80} = \\dfrac{3}{16}$<br><br>$R' = \\dfrac{3}{16}R$<br><br>Answer: $\\dfrac{3}{16}R$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30a8c30a4553e1bdf80", "type": "singleCorrect", "question": {"text": "Out of the following, which statement is NOT true about black body radiation ?", "image": null}, "options": [{"id": "pJCaH", "label": "A", "text": "Intensity is more for shorter wavelengths ($\\lambda$).", "isCorrect": false, "image": null}, {"id": "MiTMe", "label": "B", "text": "Intensity is same for all wavelengths ($\\lambda$).", "isCorrect": true, "image": null}, {"id": "pE1Lq", "label": "C", "text": "Intensity is less for longer wavelengths ($\\lambda$).", "isCorrect": false, "image": null}, {"id": "tGK8O", "label": "D", "text": "A black body emits all wavelengths ($\\lambda$).", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "A black body emits radiation of all wavelengths, forming a continuous spectrum.<br><br>According to Planck's law of black body radiation, the intensity of emitted radiation is not uniform across all wavelengths. The intensity increases with an increase in wavelength, reaches a maximum value at a specific wavelength (which depends on the temperature of the body), and then decreases for longer wavelengths.<br><br>Therefore, the statement that the intensity is the same for all wavelengths is incorrect.<br><br>Answer: Intensity is same for all wavelengths ($\\lambda$).", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f98c30a4553e1bdecd", "type": "singleCorrect", "question": {"text": "When $170$ J of energy is incident on a surface of a body, $17$ J of energy is reflected by it. If the coefficient of absorption is $0.7$, then the amount of energy transmitted will be", "image": null}, "options": [{"id": "B9qSP", "label": "A", "text": "$3.4$ J", "isCorrect": false, "image": null}, {"id": "6U8wk", "label": "B", "text": "$11.9$ J", "isCorrect": false, "image": null}, {"id": "BgAa7", "label": "C", "text": "$34.0$ J", "isCorrect": true, "image": null}, {"id": "IfosH", "label": "D", "text": "$119.0$ J", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Coefficient of reflection, $r = \\dfrac{Q_r}{Q} = \\dfrac{17}{170} = 0.1$<br><br>Coefficient of transmission, $t = 1 - (a + r) = 1 - (0.7 + 0.1) = 0.2$<br><br>Transmitted energy, $Q_t = t Q = 0.2 \\times 170 = 34$ J<br><br>Answer: $34.0$ J", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f88c30a4553e1bdec5", "type": "singleCorrect", "question": {"text": "A black body is at temperature $827^\\circ\\text{C}$. The rate at which it emits energy is proportional to", "image": null}, "options": [{"id": "1XSMo", "label": "A", "text": "$(827)^4$", "isCorrect": false, "image": null}, {"id": "SXQEY", "label": "B", "text": "$(827)^2$", "isCorrect": false, "image": null}, {"id": "ue0Hc", "label": "C", "text": "$(1100)^4$", "isCorrect": true, "image": null}, {"id": "sAZJ5", "label": "D", "text": "$(1100)^2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to the Stefan-Boltzmann law, the rate at which a black body emits energy is directly proportional to the fourth power of its absolute temperature.<br><br>$E \\propto T^4$<br><br>The given temperature is $t = 827^\\circ\\text{C}$.<br><br>Converting this to absolute temperature in Kelvin:<br><br>$T = 827 + 273 = 1100 \\text{ K}$<br><br>Therefore, the rate of energy emission is proportional to $(1100)^4$.<br><br>Answer: $(1100)^4$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2eb8c30a4553e1bde35", "type": "singleCorrect", "question": {"text": "A black body radiates maximum energy at wavelength '$\\lambda$' at temperature $T_1$ and its emissive power is E. When the temperature of the body is changed to $T_2$, it radiates maximum energy at wavelength $\\dfrac{2\\lambda}{3}$, then the emissive power will become", "image": null}, "options": [{"id": "RKVBw", "label": "A", "text": "$\\dfrac{99}{16}\\,E$", "isCorrect": false, "image": null}, {"id": "nXQXE", "label": "B", "text": "$\\dfrac{81}{16}\\,E$", "isCorrect": true, "image": null}, {"id": "YTyFs", "label": "C", "text": "$\\dfrac{63}{16}\\,E$", "isCorrect": false, "image": null}, {"id": "0WMZW", "label": "D", "text": "$\\dfrac{45}{16}\\,E$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Wien's displacement law, $\\lambda_{max} T = \\text{constant}$.<br><br>$\\lambda T_1 = \\dfrac{2\\lambda}{3} T_2$<br><br>$T_2 = \\dfrac{3}{2} T_1$<br><br>According to Stefan-Boltzmann law, the emissive power $E$ is proportional to the fourth power of absolute temperature, $E \\propto T^4$.<br><br>$\\dfrac{E_2}{E_1} = \\left(\\dfrac{T_2}{T_1}\\right)^4$<br><br>$\\dfrac{E_2}{E} = \\left(\\dfrac{3}{2}\\right)^4 = \\dfrac{81}{16}$<br><br>$E_2 = \\dfrac{81}{16} E$<br><br>Answer: $\\dfrac{81}{16}\\,E$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ea8c30a4553e1bde29", "type": "singleCorrect", "question": {"text": "A body cools from a temperature $3\\theta$ to $2\\theta$ in 10 minute. The room temperature is $\\theta$. The temperature of the body at the end of the next 10 minute is '$x$'. Assuming that Newton's law of cooling is applicable, the value of '$x$' will be", "image": null}, "options": [{"id": "gVqol", "label": "A", "text": "$\\dfrac{9}{5}\\theta$", "isCorrect": false, "image": null}, {"id": "skAGL", "label": "B", "text": "$\\dfrac{7}{4}\\theta$", "isCorrect": false, "image": null}, {"id": "le5Gu", "label": "C", "text": "$\\dfrac{3}{2}\\theta$", "isCorrect": true, "image": null}, {"id": "9snZG", "label": "D", "text": "$\\dfrac{4}{3}\\theta$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Newton's law of cooling, the temperature $T$ of a body at time $t$ is given by:<br><br>$T - T_0 = (T_i - T_0)e^{-kt}$<br><br>where $T_0$ is the surrounding temperature and $T_i$ is the initial temperature.<br><br>For the first 10 minutes, $T_i = 3\\theta$, $T = 2\\theta$, and $T_0 = \\theta$:<br><br>$2\\theta - \\theta = (3\\theta - \\theta)e^{-10k}$<br><br>$\\theta = 2\\theta e^{-10k}$<br><br>$e^{-10k} = \\dfrac{1}{2}$<br><br>For the next 10 minutes, the new initial temperature is $T_i = 2\\theta$ and the final temperature is $x$:<br><br>$x - \\theta = (2\\theta - \\theta)e^{-10k}$<br><br>$x - \\theta = \\theta \\left(\\dfrac{1}{2}\\right)$<br><br>$x = \\theta + \\dfrac{\\theta}{2} = \\dfrac{3}{2}\\theta$<br><br>Answer: $\\dfrac{3}{2}\\theta$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3228c30a4553e1be08b", "type": "singleCorrect", "question": {"text": "Two spherical black bodies of radii $R_1$ and $R_2$ having surface temperature $T_1$ and $T_2$ respectively, radiate the same power. The ratio of $R_1$ to $R_2$ will be", "image": null}, "options": [{"id": "o10bN", "label": "A", "text": "$\\left(\\dfrac{T_1}{T_2}\\right)^2$", "isCorrect": false, "image": null}, {"id": "ZqLPB", "label": "B", "text": "$\\left(\\dfrac{T_1}{T_2}\\right)^4$", "isCorrect": false, "image": null}, {"id": "au7rz", "label": "C", "text": "$\\left(\\dfrac{T_2}{T_1}\\right)^2$", "isCorrect": true, "image": null}, {"id": "3f4W2", "label": "D", "text": "$\\left(\\dfrac{T_2}{T_1}\\right)^4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to the Stefan-Boltzmann law, the power radiated by a spherical black body is given by $P = \\sigma A T^4 = \\sigma (4 \\pi R^2) T^4$.<br><br>Given that both black bodies radiate the same power, $P_1 = P_2$.<br><br>$\\sigma (4 \\pi R_1^2) T_1^4 = \\sigma (4 \\pi R_2^2) T_2^4$<br><br>$R_1^2 T_1^4 = R_2^2 T_2^4$<br><br>$\\dfrac{R_1^2}{R_2^2} = \\dfrac{T_2^4}{T_1^4}$<br><br>$\\dfrac{R_1}{R_2} = \\left(\\dfrac{T_2}{T_1}\\right)^2$<br><br>Answer: $\\left(\\dfrac{T_2}{T_1}\\right)^2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d33f8c30a4553e1be1b7", "type": "singleCorrect", "question": {"text": "A black body emits radiation of maximum intensity of wavelength '$\\lambda$' at temperature 'T' K. Its corresponding wavelength at temperature $(2.5T)$ K will be", "image": null}, "options": [{"id": "Prpea", "label": "A", "text": "$\\dfrac{2\\lambda}{3}$", "isCorrect": false, "image": null}, {"id": "Gf9qD", "label": "B", "text": "$\\dfrac{2\\lambda}{5}$", "isCorrect": true, "image": null}, {"id": "Wo5iu", "label": "C", "text": "$\\dfrac{4\\lambda}{5}$", "isCorrect": false, "image": null}, {"id": "MaC21", "label": "D", "text": "$\\dfrac{16\\lambda}{81}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Wien's displacement law, the product of the wavelength corresponding to maximum intensity of emission and the absolute temperature of the black body is a constant.<br><br>$\\lambda_{m} T = \\text{constant}$<br><br>$\\lambda_{1} T_{1} = \\lambda_{2} T_{2}$<br><br>Given $\\lambda_{1} = \\lambda$, $T_{1} = T$, and $T_{2} = 2.5 T = \\dfrac{5}{2} T$.<br><br>$\\lambda \\times T = \\lambda_{2} \\times \\left(\\dfrac{5}{2} T\\right)$<br><br>$\\lambda_{2} = \\dfrac{2\\lambda}{5}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVi
