t": false}, {"id": "wVrz8", "text": "8", "image": null, "isCorrect": false}, {"id": "hqkiP", "text": "16", "image": null, "isCorrect": true}, {"id": "nT4T1", "text": "32", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Wien's displacement law, $\\lambda_{max} T = \\text{constant}$.<br><br>$\\lambda_0 T_1 = \\left(\\dfrac{\\lambda_0}{2}\\right) T_2$<br><br>$T_2 = 2T_1$<br><br>According to Stefan-Boltzmann law, the power radiated by a black body is given by $P \\propto T^4$.<br><br>$\\dfrac{P_2}{P_1} = \\left(\\dfrac{T_2}{T_1}\\right)^4$<br><br>$\\dfrac{P_2}{P_1} = (2)^4 = 16$<br><br>$P_2 = 16 P_1$<br><br>The power radiated increases by a factor of $16$.<br><br>Answer: 16", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213df0aee93fa0796dc30", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "Two spheres $\\mathrm{S}_1$ and $\\mathrm{S}_2$ have same radii but temperatures $T_1$ and $T_2$ respectively. Their emissive power is same and emissivity in the ratio 1:4. Then the ratio $T_1: T_2$ is", "image": null}, "options": [{"id": "bOIDY", "text": "$2: 1$", "image": null, "isCorrect": false}, {"id": "02T8N", "text": "$\\sqrt{2}: 1$", "image": null, "isCorrect": true}, {"id": "eelUo", "text": "$1: \\sqrt{2}$", "image": null, "isCorrect": false}, {"id": "9yRGJ", "text": "$1: 2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Stefan-Boltzmann law, the emissive power of a body is given by $E = e \\sigma T^4$.<br><br>Given that the emissive powers of the two spheres are equal, $E_1 = E_2$.<br><br>Therefore, $e_1 \\sigma T_1^4 = e_2 \\sigma T_2^4$.<br><br>Rearranging the terms, we get $\\dfrac{T_1^4}{T_2^4} = \\dfrac{e_2}{e_1}$.<br><br>Given the ratio of emissivities $e_1 : e_2 = 1 : 4$, we have $\\dfrac{e_2}{e_1} = 4$.<br><br>Substituting this value, $\\left(\\dfrac{T_1}{T_2}\\right)^4 = 4$.<br><br>Taking the fourth root on both sides, $\\dfrac{T_1}{T_2} = (4)^{1/4} = (2^2)^{1/4} = 2^{1/2} = \\sqrt{2}$.<br><br>Thus, the ratio $T_1 : T_2 = \\sqrt{2} : 1$.<br><br>Answer: $\\sqrt{2}: 1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d10aee93fa0796dbc0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "An ordinary body cools from ' $4 \\theta$ ' to ' $3 \\theta$ ' in ' t ' minutes. The temperature of that body after next 't' minutes is (Assume Newton's law of cooling and room temperature is $\\theta$ )", "image": null}, "options": [{"id": "SDyl9", "text": "$\\dfrac{9 \\theta}{4}$", "image": null, "isCorrect": false}, {"id": "FstrR", "text": "$\\dfrac{2 \\theta}{5}$", "image": null, "isCorrect": false}, {"id": "BuZix", "text": "$\\dfrac{5 \\theta}{3}$", "image": null, "isCorrect": false}, {"id": "6jgCc", "text": "$\\dfrac{7 \\theta}{3}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Newton's law of cooling, the temperature $T$ of a body at time $t$ is given by:<br><br>$T - T_0 = (T_i - T_0) e^{-Kt}$<br><br>where $T_0$ is the surrounding temperature and $T_i$ is the initial temperature.<br><br>For the first $t$ minutes, the body cools from $4\\theta$ to $3\\theta$ with $T_0 = \\theta$:<br><br>$3\\theta - \\theta = (4\\theta - \\theta) e^{-Kt}$<br><br>$2\\theta = 3\\theta e^{-Kt}$<br><br>$e^{-Kt} = \\dfrac{2}{3}$<br><br>Let $T'$ be the temperature after the next $t$ minutes. The initial temperature for this interval is $3\\theta$:<br><br>$T' - \\theta = (3\\theta - \\theta) e^{-Kt}$<br><br>$T' - \\theta = 2\\theta \\left(\\dfrac{2}{3}\\right)$<br><br>$T' - \\theta = \\dfrac{4\\theta}{3}$<br><br>$T' = \\theta + \\dfrac{4\\theta}{3} = \\dfrac{7\\theta}{3}$<br><br>Answer: $\\dfrac{7 \\theta}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213cf0aee93fa0796dbb4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "Rate of radiation by a black body is 'R' at temperature 'T'. Another body has same area but emissivity is 0.2 and temperature 3 T . Its rate of radiation is", "image": null}, "options": [{"id": "VhEGF", "text": "$\\quad(162) \\mathrm{R}$", "image": null, "isCorrect": false}, {"id": "YElhE", "text": "$\\quad(81) \\mathrm{R}$", "image": null, "isCorrect": false}, {"id": "P4en4", "text": "$\\quad(16.2) \\mathrm{R}$", "image": null, "isCorrect": true}, {"id": "ZuUyy", "text": "$(8.1) \\mathrm{R}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Stefan-Boltzmann law, the rate of radiation by a black body is given by $R = \\sigma A T^4$.<br><br>For the second body, the rate of radiation is $R' = e \\sigma A (T')^4$.<br><br>Given $e = 0.2$ and $T' = 3T$, we have:<br><br>$R' = 0.2 \\times \\sigma A (3T)^4$<br><br>$R' = 0.2 \\times 81 \\times \\sigma A T^4$<br><br>$R' = 16.2 R$<br><br>Answer: $\\quad(16.2) \\mathrm{R}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213cc0aee93fa0796db9a", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "The black discs $x, y$ and $z$ have radii $1 \\mathrm{~m}, 2 \\mathrm{~m}$ and 3 m respectively. The wavelengths corresponding to maximum intensity are $200 \\mathrm{~nm}, 300 \\mathrm{~nm}$ and 400 nm respectively. The relation between emissive power $\\mathrm{E}_{\\mathrm{x}}, \\mathrm{E}_{\\mathrm{y}}$ and $\\mathrm{E}_{\\mathrm{z}}$ is", "image": null}, "options": [{"id": "qv2XY", "text": "$\\mathrm{E}_{\\mathrm{x}}\\gt\\mathrm{E}_{\\mathrm{y}}\\gt\\mathrm{E}_{\\mathrm{z}}$", "image": null, "isCorrect": true}, {"id": "tmGRL", "text": "$\\mathrm{E}_{\\mathrm{x}} \\lt \\mathrm{E}_{\\mathrm{y}} \\lt \\mathrm{E}_{\\mathrm{z}}$.", "image": null, "isCorrect": false}, {"id": "Az1p4", "text": "$\\quad \\mathrm{E}_{\\mathrm{x}}=\\mathrm{E}_{\\mathrm{y}}=\\mathrm{E}_{\\mathrm{z}}$", "image": null, "isCorrect": false}, {"id": "lXY2M", "text": "$\\mathrm{E}_{\\mathrm{y}}\\gt\\mathrm{E}_{\\mathrm{x}} \\lt \\mathrm{E}_z$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Wien's displacement law, $\\lambda_{m} T = b$, which gives $T \\propto \\dfrac{1}{\\lambda_{m}}$.<br><br>Given $\\lambda_{x} = 200 \\text{ nm}$, $\\lambda_{y} = 300 \\text{ nm}$, and $\\lambda_{z} = 400 \\text{ nm}$, we have $\\lambda_{x} < \\lambda_{y} < \\lambda_{z}$.<br><br>Therefore, the temperatures of the discs follow the order $T_{x} > T_{y} > T_{z}$.<br><br>According to the Stefan-Boltzmann law, the emissive power (energy radiated per unit area per unit time) of a black body is given by $E = \\sigma T^{4}$.<br><br>Since $T_{x} > T_{y} > T_{z}$, it directly follows that $E_{x} > E_{y} > E_{z}$.<br><br>Answer: $\\mathrm{E}_{\\mathrm{x}}\\gt\\mathrm{E}_{\\mathrm{y}}\\gt\\mathrm{E}_{\\mathrm{z}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213bb0aee93fa0796db11", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "Ordinary bodies $P$ and $Q$ radiate maximum energy with wavelength difference $3 \\mu \\mathrm{~m}$. The absolute temperature of body P is four times that of $Q$. The wavelength at which body $Q$ radiates maximum energy is", "image": null}, "options": [{"id": "3DVQX", "text": "$2 \\mu \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "nKg6n", "text": "$4 \\mu \\mathrm{~m}$", "image": null, "isCorrect": true}, {"id": "fpQ3j", "text": "$6 \\mu \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "t95Cd", "text": "$8 \\mu \\mathrm{~m}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Wien's displacement law, $\\lambda_{m} T = b$ (constant).<br><br>For bodies P and Q, we have $\\lambda_{P} T_{P} = \\lambda_{Q} T_{Q}$.<br><br>Given that $T_{P} = 4 T_{Q}$, substituting this gives $\\lambda_{P} (4 T_{Q}) = \\lambda_{Q} T_{Q}$, which simplifies to $\\lambda_{Q} = 4 \\lambda_{P}$.<br><br>The difference in wavelengths is given as $3 \\mu \\mathrm{m}$. Since $\\lambda_{Q} > \\lambda_{P}$, we have $\\lambda_{Q} - \\lambda_{P} = 3 \\mu \\mathrm{m}$.<br><br>Substituting $\\lambda_{P} = \\dfrac{\\lambda_{Q}}{4}$ into the equation gives $\\lambda_{Q} - \\dfrac{\\lambda_{Q}}{4} = 3 \\mu \\mathrm{m}$.<br><br>$\\dfrac{3 \\lambda_{Q}}{4} = 3 \\mu \\mathrm{m}$<br><br>$\\lambda_{Q} = 4 \\mu \\mathrm{m}$<br><br>Answer: $4 \\mu \\mathrm{~m}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213b90aee93fa0796db09", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "A black sphere has radius $R$ whose rate of radiation is E at temperature T . If radius is made half and temperature 4 T , the rate of radiation will be", "image": null}, "options": [{"id": "dPAkE", "text": "64 E", "image": null, "isCorrect": true}, {"id": "h2COi", "text": "32 E", "image": null, "isCorrect": false}, {"id": "4m5It", "text": "16 E", "image": null, "isCorrect": false}, {"id": "Nbebc", "text": "8 E", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Stefan-Boltzmann law, the rate of radiation of a black body is given by $E = \\sigma A T^4$.<br><br>For a sphere of radius $R$, the surface area is $A = 4 \\pi R^2$.<br><br>Thus, $E = \\sigma (4 \\pi R^2) T^4$.<br><br>When the radius is made half ($R' = \\dfrac{R}{2}$) and temperature is made $4T$ ($T' = 4T$), the new rate of radiation $E'$ is given by:<br><br>$E' = \\sigma (4 \\pi (R')^2) (T')^4$<br><br>$E' = \\sigma \\left(4 \\pi \\left(\\dfrac{R}{2}\\right)^2\\right) (4T)^4$<br><br>$E' = \\sigma \\left(4 \\pi \\dfrac{R^2}{4}\\right) (256 T^4)$<br><br>$E' = 64 \\left(\\sigma (4 \\pi R^2) T^4\\right)$<br><br>$E' = 64 E$<br><br>Answer: 64 E", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213aa0aee93fa0796da92", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "The temperature of a liquid falls from 365 K to 359 K in 3 minutes. The time during which temperature of this liquid falls from 342 K to 338 K is [Let the room temperature be 296 K ]", "image": null}, "options": [{"id": "YzPHp", "text": "6 min", "image": null, "isCorrect": false}, {"id": "NaOGp", "text": "4 min", "image": null, "isCorrect": false}, {"id": "0Bkpb", "text": "3 min", "image": null, "isCorrect": true}, {"id": "BcDyf", "text": "2 min", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Newton's law of cooling, the rate of cooling is proportional to the temperature difference between the average temperature of the body and the surroundings:<br><br>$\\dfrac{T_1 - T_2}{t} = k\\left(\\dfrac{T_1 + T_2}{2} - T_0\\right)$<br><br>For the first case, the temperature falls from $365$ K to $359$ K in $3$ minutes:<br><br>$\\dfrac{365 - 359}{3} = k\\left(\\dfrac{365 + 359}{2} - 296\\right)$<br><br>$\\dfrac{6}{3} = k(362 - 296)$<br><br>$2 = 66k \\Rightarrow k = \\dfrac{1}{33}$ min$^{-1}$<br><br>For the second case, the temperature falls from $342$ K to $338$ K in time $t$:<br><br>$\\dfrac{342 - 338}{t} = k\\left(\\dfrac{342 + 338}{2} - 296\\right)$<br><br>$\\dfrac{4}{t} = k(340 - 296)$<br><br>$\\dfrac{4}{t} = 44k$<br><br>Substituting the value of $k$:<br><br>$\\dfrac{4}{t} = 44 \\times \\dfrac{1}{33}$<br><br>$\\dfrac{4}{t} = \\dfrac{4}{3}$<br><br>$t = 3$ min<br><br>Answer: 3 min", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213aa0aee93fa0796da8d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "A' black body radiates power ' $P$ ' and maximum energy is radiated by it at a wavelength $\\lambda_0$. The temperature of the black body is now so changed that it radiates maximum energy at the wavelength $\\dfrac{\\lambda_0}{4}$. The power radiated by it at new temperature is", "image": null}, "options": [{"id": "9nDMb", "text": "64 P", "image": null, "isCorrect": false}, {"id": "qEDqx", "text": "256 P", "image": null, "isCorrect": true}, {"id": "vsqYk", "text": "4 P", "image": null, "isCorrect": false}, {"id": "gghcf", "text": "16 P", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Wien's displacement law, $\\lambda_{m} T = b$<br><br>$\\lambda_{0} T_{1} = \\dfrac{\\lambda_{0}}{4} T_{2}$<br><br>$T_{2} = 4 T_{1}$<br><br>According to Stefan-Boltzmann law, the power radiated by a black body is $P = \\sigma A T^{4}$<br><br>$P \\propto T^{4}$<br><br>$P' = \\sigma A T_{2}^{4} = \\sigma A (4 T_{1})^{4}$<br><br>$P' = 256 \\sigma A T_{1}^{4} = 256 P$<br><br>Answer: 256 P", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213930aee93fa0796d9de", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "Three identical metal spheres (of same surface area) have red, black and white colors and they are heated up to same temperature. They are allowed to cool. Arrange them from maximum rate of cooling to minimum rate of cooling", "image": null}, "options": [{"id": "DD6U0", "text": "white, red, black,", "image": null, "isCorrect": false}, {"id": "93Equ", "text": "red, black, white", "image": null, "isCorrect": false}, {"id": "aKw0f", "text": "red, white, black", "image": null, "isCorrect": false}, {"id": "9SYrU", "text": "black, red, white", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Kirchhoff's law of radiation, good absorbers are good emitters.<br><br>The absorbing power of a black surface is maximum, followed by a colored surface (red), and minimum for a white surface. Therefore, their emissivities follow the order: $e_{black} > e_{red} > e_{white}$.<br><br>From the Stefan-Boltzmann law, the rate of cooling of a body is directly proportional to its emissivity $e$ (since the area, mass, specific heat, and temperature difference are the same for all three spheres).<br><br>Hence, the rate of cooling will be maximum for the black sphere, intermediate for the red sphere, and minimum for the white sphere. The correct order from maximum to minimum rate of cooling is black, red, white.<br><br>Answer: black, red, white", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792137f0aee93fa0796d941", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "Two bodies A and B at temperatures \\(T_1\\) K and \\(T_2\\) K respectively have the same dimensions. Their emissivities are in the ratio of \\(1: 3\\). If they radiate the same amount of heat per unit area per unit time, then the relation between their temperatures is given by", "image": null}, "options": [{"id": "i3tar", "text": "$\\dfrac{T_1}{T_2}=\\dfrac{3^{\\frac{1}{4}}}{1}$", "image": null, "isCorrect": true}, {"id": "lfY6l", "text": "$\\dfrac{T_1}{\\mathrm{~T}_2}=\\dfrac{1}{3}$", "image": null, "isCorrect": false}, {"id": "XlHl4", "text": "$\\dfrac{T_1}{T_2}=\\dfrac{81}{1}$", "image": null, "isCorrect": false}, {"id": "DrSWA", "text": "$\\dfrac{T_1}{T_2}=\\dfrac{9^{\\frac{1}{4}}}{1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Stefan-Boltzmann law, the heat radiated per unit area per unit time is given by $E = e \\sigma T^4$.<br><br>Given that both bodies radiate the same amount of heat per unit area per unit time, we have:<br><br>$E_1 = E_2$<br><br>$e_1 \\sigma T_1^4 = e_2 \\sigma T_2^4$<br><br>$\\dfrac{T_1^4}{T_2^4} = \\dfrac{e_2}{e_1}$<br><br>Given the ratio of emissivities is $e_1 : e_2 = 1 : 3$, we substitute this into the equation:<br><br>$\\dfrac{T_1^4}{T_2^4} = \\dfrac{3}{1}$<br><br>Taking the fourth root on both sides:<br><br>$\\dfrac{T_1}{T_2} = \\dfrac{3^{\\dfrac{1}{4}}}{1}$<br><br>Answer: $\\dfrac{T_1}{T_2}=\\dfrac{3^{\\frac{1}{4}}}{1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213710aee93fa0796d8d5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "A sphere is at temperature 600 K . In an external environment of 200 K , its cooling rate is ' $R$ '. When the temperature of the sphere falls to 400 K , then cooling rate ' $R$ ' will become", "image": null}, "options": [{"id": "5MvDj", "text": "$\\dfrac{3}{16} \\mathrm{R}$", "image": null, "isCorrect": true}, {"id": "KhWWh", "text": "$\\dfrac{9}{16} R$", "image": null, "isCorrect": false}, {"id": "mfsgx", "text": "$\\dfrac{16}{9} \\mathrm{R}$", "image": null, "isCorrect": false}, {"id": "ZHBmP", "text": "$\\dfrac{16}{3} \\mathrm{R}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the Stefan-Boltzmann law, the cooling rate $R$ (rate of fall of temperature) of a body is given by:<br><br>$R = \\dfrac{dT}{dt} = \\dfrac{\\sigma e A}{ms} (T^4 - T_0^4)$<br><br>This implies that $R \\propto (T^4 - T_0^4)$.<br><br>For the first case, the temperature of the sphere is $T = 600$ K and the surrounding temperature is $T_0 = 200$ K:<br><br>$R \\propto (600^4 - 200^4)$<br><br>$R \\propto 200^4(3^4 - 1^4) = 200^4(81 - 1) = 80 \\times 200^4$<br><br>For the second case, the temperature of the sphere falls to $T' = 400$ K:<br><br>$R' \\propto (400^4 - 200^4)$<br><br>$R' \\propto 200^4(2^4 - 1^4) = 200^4(16 - 1) = 15 \\times 200^4$<br><br>Taking the ratio of the new cooling rate $R'$ to the initial cooling rate $R$:<br><br>$\\dfrac{R'}{R} = \\dfrac{15 \\times 200^4}{80 \\times 200^4} = \\dfrac{15}{80} = \\dfrac{3}{16}$<br><br>$R' = \\dfrac{3}{16} R$<br><br>Answer: $\\dfrac{3}{16} \\mathrm{R}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792134b0aee93fa0796d7ac", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Two spherical black bodies of radii ' $R_1$ ' and ' $\\mathrm{R}_2$ ' and with surface temperature ' $\\mathrm{T}_1$ ' and ' $\\mathrm{T}_2$ ' respectively radiate the same power. The ratio of ' $R_1$ ' to ' $R_2$ ' will be", "image": null}, "options": [{"id": "wXwci", "text": "$\\left(\\dfrac{T_2}{T_1}\\right)^4$", "image": null, "isCorrect": false}, {"id": "gDJaD", "text": "$\\left(\\dfrac{T_2}{T_1}\\right)^2$", "image": null, "isCorrect": true}, {"id": "r1uh1", "text": "$\\left(\\dfrac{T_1}{T_2}\\right)^4$", "image": null, "isCorrect": false}, {"id": "c9KrI", "text": "$\\left(\\dfrac{T_1}{T_2}\\right)^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Stefan-Boltzmann law, the power radiated by a spherical black body is given by $P = \\sigma A T^4 = \\sigma (4 \\pi R^2) T^4$.<br><br>Given that both bodies radiate the same power, $P_1 = P_2$.<br><br>$\\sigma (4 \\pi R_1^2) T_1^4 = \\sigma (4 \\pi R_2^2) T_2^4$<br><br>$R_1^2 T_1^4 = R_2^2 T_2^4$<br><br>$\\dfrac{R_1^2}{R_2^2} = \\dfrac{T_2^4}{T_1^4}$<br><br>Taking the square root of both sides:<br><br>$\\dfrac{R_1}{R_2} = \\left(\\dfrac{T_2}{T_1}\\right)^2$<br><br>Answer: $\\left(\\dfrac{T_2}{T_1}\\right)^2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213490aee93fa0796d799", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Given that ' $x$ ' joule of heat is incident on a body. Out of that, total heat reflected and transmitted is ' $y$ ' joule. The absorption coefficient of body is-", "image": null}, "options": [{"id": "0KTen", "text": "$\\dfrac{x}{y}$", "image": null, "isCorrect": false}, {"id": "EaZrE", "text": "$\\dfrac{y}{x}$", "image": null, "isCorrect": false}, {"id": "SqU56", "text": "$\\dfrac{x-y}{x}$", "image": null, "isCorrect": true}, {"id": "fiGvj", "text": "$\\dfrac{y-x}{x}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Total heat incident on the body is $Q = x$.<br><br>Total heat reflected and transmitted is $Q_r + Q_t = y$.<br><br>According to the law of conservation of energy, the total incident heat is the sum of absorbed, reflected, and transmitted heat:<br><br>$Q = Q_a + Q_r + Q_t$<br><br>Substituting the given values:<br><br>$x = Q_a + y$<br><br>The heat absorbed by the body is $Q_a = x - y$.<br><br>The absorption coefficient $a$ is the ratio of the heat absorbed to the total incident heat:<br><br>$a = \\dfrac{Q_a}{Q} = \\dfrac{x - y}{x}$<br><br>Answer: $\\dfrac{x-y}{x}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213240aee93fa0796d677", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "The frequency ' $v_m$ ' corresponding to which the energy emitted by a black body is maximum may vary with the temperature ' $T$ ' of the body as shown by the curves ' $A$ ', ' $B$ ', ' $C$ ' and ' $D$ ' in the figure. Which one of these represents the correct variation?\r\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/4oKeFS_iLaAZHhxoHhbjp_z1IQ_keSEb6uiEXB644hM.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "dEBsm", "text": "straight line D", "image": null, "isCorrect": false}, {"id": "JuSl7", "text": "curve C", "image": null, "isCorrect": false}, {"id": "y5wT3", "text": "straight line B", "image": null, "isCorrect": true}, {"id": "8f6Kl", "text": "curve $A$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Wien's displacement law, the wavelength $\\lambda_m$ corresponding to the maximum spectral emissive power of a black body is inversely proportional to its absolute temperature $T$:<br><br>$\\lambda_m T = b$ (where $b$ is Wien's constant)<br><br>We know that the frequency $\\nu_m$ is related to the wavelength $\\lambda_m$ by the speed of light $c$:<br><br>$\\nu_m = \\dfrac{c}{\\lambda_m}$<br><br>Substituting $\\lambda_m = \\dfrac{b}{T}$ into the above equation, we get:<br><br>$\\nu_m = \\dfrac{c}{\\left(\\dfrac{b}{T}\\right)} = \\left(\\dfrac{c}{b}\\right) T$<br><br>This shows that the frequency $\\nu_m$ corresponding to maximum emission is directly proportional to the absolute temperature $T$ ($\\nu_m \\propto T$).<br><br>The graph of a directly proportional relationship is a straight line passing through the origin. In the given figure, straight line B represents this correct variation.<br><br>Answer: straight line B", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262670279619d9d8a343b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "A body is said to be opaque to the radiation if (a, $r$ and $t$ are coefficient of absorption, reflection and transmission respectively)", "image": null}, "options": [{"id": "mWXn1", "text": "$\\mathrm{t}=0$ and $\\mathrm{a}+\\mathrm{r}=1$", "image": null, "isCorrect": true}, {"id": "dUCBl", "text": "$\\mathrm{a}=\\mathrm{r}=\\mathrm{t}$", "image": null, "isCorrect": false}, {"id": "JJcS3", "text": "$t \\neq 0$", "image": null, "isCorrect": false}, {"id": "uyQ0n", "text": "$\\mathrm{a}=0, \\mathrm{r}=1, \\mathrm{t}=1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Opaque body does not transmit any radiation directly,\n$$\n\\begin{array}{ll}\n\\therefore & \\mathrm{t}=0 \\\\\n\\therefore & \\mathrm{a}+\\mathrm{r}=1\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262400279619d9d8a3301", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "A black body at temperature $127^{\\circ} \\mathrm{C}$ radiates heat at the rate of $5 \\mathrm{cal} / \\mathrm{cm}^2 \\mathrm{~s}$. At a temperature $927^{\\circ} \\mathrm{C}$, its rate of emission in units of $\\mathrm{cal} / \\mathrm{cm}^2 \\mathrm{~s}$ will be", "image": null}, "options": [{"id": "hNXli", "text": "405", "image": null, "isCorrect": true}, {"id": "2PP12", "text": "35", "image": null, "isCorrect": false}, {"id": "vHHnA", "text": "45", "image": null, "isCorrect": false}, {"id": "5Mb7z", "text": "350", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From Stefan - Boltzmann's Law\n$$\n\\begin{aligned}\n& \\mathrm{E}=\\sigma \\mathrm{T}^4 \\\\\n& \\Rightarrow \\mathrm{E} \\propto \\mathrm{T}^4\n\\end{aligned}\n$$\n$\\begin{aligned} \\therefore \\quad \\frac{\\mathrm{E}_1}{\\mathrm{E}_2} & =\\left(\\frac{\\mathrm{T}_1}{\\mathrm{~T}_2}\\right)^4=\\left(\\frac{400}{1200}\\right)^4 \\\\ \\frac{\\mathrm{E}_1}{\\mathrm{E}_2} & =\\frac{1}{81} \\\\ \\mathrm{E}_2 & =81 \\times \\mathrm{E}_1 \\\\ & =81 \\times 5 \\\\ & =405 \\mathrm{cal} / \\mathrm{cm}^2 \\mathrm{~s}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2622e0279619d9d8a3272", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "A black body radiates maximum energy at wavelength ' $\\lambda$ ' and its emissive power is ' $E$ '. Now due to a change in temperature of that body, it radiates maximum energy at wavelength $\\frac{\\lambda}{3}$. At that temperature emissive power is", "image": null}, "options": [{"id": "2bbyJ", "text": "$16: 1$", "image": null, "isCorrect": false}, {"id": "Lp3xT", "text": "$256: 1$", "image": null, "isCorrect": false}, {"id": "cNFg5", "text": "$81: 1$", "image": null, "isCorrect": true}, {"id": "PW1Ut", "text": "$128: 1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\therefore \\quad$ Emissive power of black body is, From Wien's Law:\n$$\n\\begin{aligned}\n\\mathrm{E} & =\\sigma \\mathrm{T}^4 \\\\\n\\lambda & =\\frac{\\mathrm{b}}{\\mathrm{T}} \\\\\n\\therefore \\quad \\mathrm{E} & =\\frac{\\sigma \\mathrm{b}^4}{\\lambda^4} \\\\\n\\therefore \\quad \\frac{\\mathrm{E}_2}{\\mathrm{E}_1} & =\\frac{\\lambda_1^4}{\\lambda_2^4}=\\frac{\\lambda^4}{\\left(\\frac{\\lambda}{3}\\right)^4}=\\frac{81}{1}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262200279619d9d8a3200", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "About black body radiation, which of the following is the wrong statement?", "image": null}, "options": [{"id": "UCf0w", "text": "For all wavelengths, intensity is same.", "image": null, "isCorrect": true}, {"id": "cgYnI", "text": "For shorter wavelengths, intensity is more.", "image": null, "isCorrect": false}, {"id": "WSskv", "text": "For longer wavelengths, intensity is less.", "image": null, "isCorrect": false}, {"id": "9tP8d", "text": "All wavelengths are emitted by a black body.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\begin{array}{|l|l|l|} \\hline Std.12 & Ch-3 & Subtopic-3.14 \\\\ \\hline \\end{array}", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2621e0279619d9d8a31ef", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "A black sphere has radius ' $R$ ' whose rate of radiation is ' $\\mathrm{E}$ ' at temperature ' $\\mathrm{T}$ '. If radius is made $R / 3$ and temperature ' $3 \\mathrm{~T}$ ', the rate of radiation will be", "image": null}, "options": [{"id": "YR8lO", "text": "$\\mathrm{E}$", "image": null, "isCorrect": false}, {"id": "pOqGN", "text": "$3 \\mathrm{E}$", "image": null, "isCorrect": false}, {"id": "tn8hc", "text": "$6 \\mathrm{E}$", "image": null, "isCorrect": false}, {"id": "0bYvB", "text": "$9 \\mathrm{E}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{array}{ll} & \\mathrm{E}=\\mathrm{eA} \\sigma \\mathrm{T}^4 \\\\ & \\text { But for sphere, } A=4 \\pi \\mathrm{R}^2 \\\\ \\therefore \\quad & \\mathrm{E}=\\mathrm{e}\\left(4 \\pi \\mathrm{R}^2\\right) \\sigma \\mathrm{T}^4 \\\\ \\therefore \\quad & \\frac{\\mathrm{E}_1}{\\mathrm{E}_2}=\\frac{\\mathrm{R}_1^2 \\mathrm{~T}_1^4}{\\mathrm{R}_2^2 \\mathrm{~T}_2^4} \\\\ \\therefore \\quad & \\frac{\\mathrm{E}}{\\mathrm{E}_2}=\\frac{\\mathrm{R}^2 \\mathrm{~T}^4}{\\left(\\frac{\\mathrm{R}}{3}\\right)^2(3 \\mathrm{~T})^4} \\\\ \\therefore \\quad & \\mathrm{E}_2=9 \\mathrm{E}\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262080279619d9d8a3142", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "Two bodies A and B at temperatures ' $\\mathrm{T}_1$ ' $\\mathrm{K}$ and ' $\\mathrm{T}_2$ ' $\\mathrm{K}$ respectively have the same dimensions. Their emissivities are in the ratio $1: 3$. If they radiate the same amount of heat per unit area per unit time, then the ratio of their temperatures $\\left(T_1: T_2\\right)$ is", "image": null}, "options": [{"id": "HsxQi", "text": "$1: 3$", "image": null, "isCorrect": false}, {"id": "ScPeY", "text": "$3^{1 / 4}: 1$", "image": null, "isCorrect": true}, {"id": "V2A4t", "text": "$9^{1 / 4}: 1$", "image": null, "isCorrect": false}, {"id": "Gl18g", "text": "$81: 1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From Stefan - Boltzmann's law\n$\\frac{\\mathrm{dQ}}{\\mathrm{dt}}=\\mathrm{e}\\left(\\sigma \\mathrm{AT}^4\\right)$\nGiven $\\mathrm{A}$ and $\\frac{\\mathrm{dQ}}{\\mathrm{dt}}$ are same for both the bodies\n$\\begin{gathered}\n\\Rightarrow \\mathrm{e}_1 \\mathrm{~T}_1^4=\\mathrm{e}_2 \\mathrm{~T}_2^4 \\\\\n\\therefore \\quad\\left(\\frac{\\mathrm{T}_1}{\\mathrm{~T}_2}\\right)^4=\\frac{\\mathrm{e}_2}{\\mathrm{e}_1}=\\frac{3}{1} \\\\\n\\Rightarrow \\frac{\\mathrm{T}_1}{\\mathrm{~T}_2}=\\frac{\\sqrt[4]{3}}{1}=\\frac{3^{\\frac{1}{4}}}{1}\n\\end{gathered}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261f60279619d9d8a30b8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "If the temperature of a hot body is increased by $50 \\%$, then the increase in the quantity of emitted heat radiation will be approximately", "image": null}, "options": [{"id": "03a34", "text": "$125 \\%$", "image": null, "isCorrect": false}, {"id": "tTcjh", "text": "$200 \\%$", "image": null, "isCorrect": false}, {"id": "6mZ4L", "text": "$300\\%$", "image": null, "isCorrect": false}, {"id": "ZxZ0O", "text": "$400 \\%$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\text { Given: } \\mathrm{T}_2=\\mathrm{T}_1+\\frac{50}{100} \\mathrm{~T}_1 \\\\ & \\mathrm{~T}_2=1.5 \\mathrm{~T}_1\\end{aligned}$\nAccording to Stefan's law,\n$$\n\\frac{\\mathrm{Q}}{\\mathrm{At}}=\\sigma \\mathrm{T}^4\n$$\n\nPercentage change in radiation is,\n$$\n\\begin{aligned}\n& \\Delta \\mathrm{E} \\%=\\frac{\\mathrm{T}_2^4-\\mathrm{T}_1^4}{\\mathrm{~T}_1^4} \\times 100 \\\\\n& \\Delta \\mathrm{E} \\%=\\frac{(1.5)^4 \\mathrm{~T}_1^4-\\mathrm{T}_1^4}{\\mathrm{~T}_1^4} \\times 100 \\\\\n& \\Delta \\mathrm{E} \\% \\approx 400 \\%\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261f40279619d9d8a30a4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "Two spherical black bodies of radii ' $r_1$ ' and ' $r_2$ ' at temperature ' $T_1$ ' and ' $T_2$ ' respectively radiate power in the ratio $1: 2$ Then $r_1: r_2$ is", "image": null}, "options": [{"id": "yaLwa", "text": "$\\frac{1}{2}\\left(\\frac{\\mathrm{T}_2}{\\mathrm{~T}_1}\\right)^4$", "image": null, "isCorrect": false}, {"id": "CVeR3", "text": "$\\frac{1}{\\sqrt{2}}\\left(\\frac{\\mathrm{T}_2}{\\mathrm{~T}_1}\\right)^2$", "image": null, "isCorrect": true}, {"id": "IUnRk", "text": "$2\\left(\\frac{\\mathrm{T}_1}{\\mathrm{~T}_2}\\right)^4$", "image": null, "isCorrect": false}, {"id": "8AVOw", "text": "$2\\left(\\frac{\\mathrm{T}_1}{\\mathrm{~T}_2}\\right)^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Power Radiated by black body, $\\mathrm{P}=\\sigma \\mathrm{AT}^4$\n$\\therefore \\quad$ For first black body:\n$$\n\\mathrm{P}_1=\\sigma 4 \\pi \\mathrm{r}_1^2 \\mathrm{~T}_1^4\n$$\n$\\therefore \\quad$ For second black body:\n$$\n\\mathrm{P}_2=\\sigma 4 \\pi \\mathrm{r}_2{ }^2 \\mathrm{~T}_2{ }^4\n$$\n$\\therefore \\quad$ The ratio will be:\n$$\n\\begin{aligned}\n& \\frac{\\mathrm{P}_1}{\\mathrm{P}_2}=\\frac{\\sigma 4 \\pi \\mathrm{r}_1^2 \\mathrm{~T}_1^4}{\\sigma 4 \\pi \\mathrm{r}_2^2 \\mathrm{~T}_2^4} \\\\\n& \\frac{1}{2}=\\frac{\\mathrm{r}_1^2 \\mathrm{~T}_1^4}{\\mathrm{r}_2^2 \\mathrm{~T}_2^4} \\\\\n& \\frac{\\mathrm{r}_1^2}{\\mathrm{r}_2^2}=\\frac{1}{2} \\frac{\\mathrm{T}_2^4}{\\mathrm{~T}_1^4} \\\\\n& \\frac{\\mathrm{r}_1}{\\mathrm{r}_2}=\\frac{1}{\\sqrt{2}}\\left(\\frac{\\mathrm{T}_2}{\\mathrm{~T}_1}\\right)^2\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261d20279619d9d8a2f9b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "A black body radiates maximum energy at wavelength ' $\\lambda$ ' and its emissive power is $E$. Now due to change in temperature of that body, it radiates maximum energy at wavelength $\\frac{2 \\lambda}{3}$. At that temperature emissive power is", "image": null}, "options": [{"id": "vIeu4", "text": "$\\frac{51 \\mathrm{E}}{8}$", "image": null, "isCorrect": false}, {"id": "4z7s8", "text": "$\\frac{81 \\mathrm{E}}{16}$", "image": null, "isCorrect": true}, {"id": "ORzxS", "text": "$\\frac{61 \\mathrm{E}}{27}$", "image": null, "isCorrect": false}, {"id": "GbHFm", "text": "$\\frac{71 \\mathrm{E}}{19}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From Wien's Displacement law,\n$\\lambda_{\\max }=\\frac{\\mathrm{b}}{\\mathrm{T}} \\Rightarrow \\mathrm{T}=\\frac{\\mathrm{b}}{\\lambda_{\\max }}$\nFrom Stefan-Boltzmann law\n$\\mathrm{E}=\\sigma \\mathrm{T}^4=\\sigma\\left(\\frac{\\mathrm{b}}{\\lambda_{\\max }}\\right)^4$\nLet the new emissive power be $\\mathrm{E}^{\\prime}$.\n$\\begin{aligned}\n\\therefore \\quad E^{\\prime} & =\\sigma\\left(\\frac{b}{\\frac{2 \\lambda_{\\max }}{3}}\\right)^4 \\\\\n\\mathrm{E}^{\\prime} & =\\frac{81}{16} \\mathrm{E}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2619a0279619d9d8a2de3", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "Heat energy is incident on the surface at the rate of $1000 \\mathrm{~J} / \\mathrm{min}$. If coefficient of absorption is 0.8 and coefficient of reflection is 0.1 , then heat energy transmitted by the surface in 5 minute is", "image": null}, "options": [{"id": "AlCPM", "text": "700 J", "image": null, "isCorrect": false}, {"id": "UT3el", "text": "500 J", "image": null, "isCorrect": true}, {"id": "wMN7S", "text": "100 J", "image": null, "isCorrect": false}, {"id": "Lh7Xk", "text": "900 J", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Considering energy conservation:\nCoe. of transmission +Coe. of absorption +Coe. of reflection $=1$\nTherefore, Coefficient of transmission $=1-0.8-0.1=0.1$\nIt means $10 \\%$ of incident energy will be transmitted.\nHence transmitted energy in $5 \\mathrm{~min}$\n$=1000 \\times 0.1 \\times 5=500 \\mathrm{~J}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261830279619d9d8a2d30", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "Three discs $x, y$ and $z$ having radii $2 \\mathrm{~m}, 2 \\mathrm{~m}$ and $6 \\mathrm{~m}$ respectively are coated on outer surfaces. The wavelength corresponding to maximum are power radiated by them respectively then", "image": null}, "options": [{"id": "rM6u0", "text": "$P_y$ is maximum", "image": null, "isCorrect": true}, {"id": "nQT8Z", "text": "$P_{\\mathrm{z}}$ is maximum", "image": null, "isCorrect": false}, {"id": "P6rJ7", "text": "$P_x=P_y=P_z$", "image": null, "isCorrect": false}, {"id": "ygXlF", "text": "$P_x$ is maximum", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As we know that from Wien's displacement law $T \\propto \\frac{1}{\\lambda_{\\max }}$\nFrom Stefan's Law, the emitted power is proportional to temperature raised to power four and directly poroportional to the surface area of the blackbody:\n$P \\propto A T^4$\nSo, $P \\propto \\frac{A}{\\lambda_{\\max }^4}$ where $A=4 \\pi r^2$ is the surface area of the body with spherical shape of radius $r$.\nTherefore,\n$P_x: P_y: P_z=\\frac{2^2}{3^4}: \\frac{2^2}{4^4}: \\frac{6^2}{5^4}=\\frac{4}{81}: \\frac{4}{16}: \\frac{36}{625}=\\frac{32}{648}: \\frac{156}{624}: \\frac{36}{625}$\n$\\Rightarrow P_y>P_x>P_z$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261720279619d9d8a2ca0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "About black body radiation, which one of the following is the WRONG statement?", "image": null}, "options": [{"id": "2TPTw", "text": "All wavelengths are emitted by a black body", "image": null, "isCorrect": false}, {"id": "iShEL", "text": "For longer wavelengths, intensity is less.", "image": null, "isCorrect": false}, {"id": "ZnRr0", "text": "For shorter wavelengths, intensity is more.", "image": null, "isCorrect": false}, {"id": "BukcD", "text": "For all wavelengths, intensity is the same.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Concept-based.\nA blackbody is an idealized emitter that has a continuous emission spectrum and a variation of intensity w.r.t wavelength is observed.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261600279619d9d8a2c12", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "Two bodies A and B radiate maximum energy with wavelength difference $4 \\mu \\mathrm{m}$. The absolute temperature of body $\\mathrm{A}$ is 3 times that of $\\mathrm{B}$. The wavelength at which body B radiates maximum energy is:", "image": null}, "options": [{"id": "Wkr18", "text": "$2 \\mu m$", "image": null, "isCorrect": false}, {"id": "jBrvq", "text": "$4 \\mu m$", "image": null, "isCorrect": false}, {"id": "zmVZa", "text": "$6 \\mu m$", "image": null, "isCorrect": true}, {"id": "hQdWj", "text": "$12 \\mu m$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Concept: According to the Wiens displacement law:\n$\\lambda_m T=\\text { Constant, }$\nGiven $\\left(\\lambda_{m B}-\\lambda_{m A}\\right)=4 \\mu \\mathrm{m} \\quad---(1)$\n$T_A=3 T_B \\quad---(2)$\nNow, using Wens law\n$T_A=\\lambda_{m B} T_B \\quad---(3)$\n$\\mathrm{Eq}^{\\mathrm{n}}$ (2) divided by $\\mathrm{Eq}^{\\mathrm{n}}$ (3)\n$\\begin{aligned}\n& \\frac{1}{\\lambda_{m A}}=\\frac{3}{\\lambda_{m B}} \\\\\n& \\Rightarrow \\frac{\\lambda_{m B}}{\\lambda_{m A}}=3 \\\\\n& \\Rightarrow \\frac{\\left(\\lambda_{m B}-\\lambda_{m A}\\right)}{\\lambda_{m A}}=2 \\\\\n& \\Rightarrow \\lambda_{m A}=\\frac{1}{2}\\left(\\lambda_{m B}-\\lambda_{m A}\\right)\n\\end{aligned}$\nNow, using eq ${ }^{\\mathrm{n}} 1$\n$\\begin{aligned}\n& \\lambda_{m A}=\\frac{1}{2}(4 \\mu \\mathrm{m})=2 \\mu \\mathrm{m} \\\\\n& \\therefore \\lambda_{m B}=4 \\mu+\\lambda_{m A}=6 \\mu \\mathrm{m}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2615e0279619d9d8a2bfd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "A star (P) behaves like a perfectly black body emitting radiant energy at temperature ' $\\mathrm{T}$ '. Another star (Q) also behaves like perfectly black body emitting radiant energy at temperature ' $\\mathrm{T} / 4$ ' and has radius eight times the radius of star $(\\mathrm{P})$. The ratio of radiant energy emitted by $(\\mathrm{P})$ to that by $(\\mathrm{Q})$ is", "image": null}, "options": [{"id": "e5HMS", "text": "1:8", "image": null, "isCorrect": false}, {"id": "0j5vR", "text": "1:1", "image": null, "isCorrect": true}, {"id": "wWBHT", "text": "4:1", "image": null, "isCorrect": false}, {"id": "G8s2z", "text": "1:4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Concept: According to the Stefan-Boltzmann law energy radiated per unit area (j)\n$\\mathrm{j}=\\sigma \\mathrm{T}^4$\nWhere $\\sigma$ is the proportionality constant and $\\mathrm{T}$ is temperature radiant energy $E=j A$, where $A$ is the surface black body.\nGiven,\nFor $(\\mathrm{a})$ blackbody $\\mathrm{P}$, radius $=\\mathrm{R}$ and temperature $=\\mathrm{T}$\n(b) blackbody $\\mathrm{Q}$, radius $=8 \\mathrm{R}$ and temperature $=\\frac{\\mathrm{T}}{4}$\n$\\therefore \\frac{E_{\\mathrm{P}}}{\\mathrm{E}_{\\mathrm{Q}}}=\\frac{\\sigma \\mathrm{T}^4 4 \\pi \\mathrm{R}^2}{\\sigma\\left(\\frac{\\mathrm{T}}{4}\\right)^4 4 \\pi(8 \\mathrm{R})^2}=\\frac{4^4}{8^2}=\\frac{(8)^2}{8^2}=1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2614f0279619d9d8a2b84", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "Three black discs $x, y, z$ have radii $1 \\mathrm{~m}, 2 \\mathrm{~m}$ and $3 \\mathrm{~m}$ respectively. The wavelength corresponding to maximum intensity are $200 \\mathrm{~nm}$, $300 \\mathrm{~nm}$ and $400 \\mathrm{~nm}$ respectively. The relation between emissive power $E_x, E_y$ and $E_z$ is", "image": null}, "options": [{"id": "QLtWr", "text": "$E_x$ is maximum", "image": null, "isCorrect": true}, {"id": "1ghLN", "text": "$E_y$ is maximum", "image": null, "isCorrect": false}, {"id": "tKB8a", "text": "$E_z$ is maximum", "image": null, "isCorrect": false}, {"id": "9eYlk", "text": "$E_x=E_y=E_z$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the Stefan's Law:\n$\\begin{aligned}\n& E=\\frac{\\sigma A T^4}{A} \\\\\n& \\Rightarrow E \\propto T^4\n\\end{aligned}$\nAccording to the Wein's Law:\n$\\begin{aligned}\n& T=\\frac{k}{\\lambda_m} \\\\\n& \\therefore E \\propto \\frac{A}{\\lambda^4} \\\\\n& E_x: E_y: E_z=\\frac{1}{\\lambda_x^4}: \\frac{1}{\\lambda^4}: \\frac{1}{\\lambda^4}=\\frac{1}{200^4}: \\frac{1}{300^4}: \\frac{1}{400^4}\n\\end{aligned}$\nThe relation between emissive power $E_x, E_y$ and $E_z$ is as follows:\n$E x>E y>E z$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2614c0279619d9d8a2b6a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "At $273^{\\circ} \\mathrm{C}$, the emissive power of a perfectly black body is $R$. It emissive power at $0^{\\circ} \\mathrm{Cis}$", "image": null}, "options": [{"id": "Q9E9p", "text": "$\\frac{R}{4}$", "image": null, "isCorrect": false}, {"id": "OXzmP", "text": "$\\frac{R}{8}$", "image": null, "isCorrect": false}, {"id": "tkWoA", "text": "$\\frac{R}{16}$", "image": null, "isCorrect": true}, {"id": "d1dIr", "text": "$\\frac{R}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From Stefan's law, the total radiant energy emitted per second per unit surface area of a black body is proportional to the fourth power of the absolute temperature $(T)$ of the body $E=\\sigma T^4$\nGiven, $T_1=273^{\\circ} \\mathrm{C}=273+273 \\mathrm{~K}=564 \\mathrm{~K}$\n$T_2=0^0 \\mathrm{C}=273 \\mathrm{~K}$\n$\\begin{aligned}\n& \\therefore \\frac{E_1}{E_2}=\\frac{T_1^4}{T_2^4} \\\\\n& \\Rightarrow E_2=\\frac{T_2^4}{T_1^4} E_1=\\frac{(273)^4}{(564)^4} R=\\frac{R}{16}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2613b0279619d9d8a2add", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "Two solid spheres of radii $R_1$ and $R_2$ made of same material and have similar surfaces. The spheres are raised to the same temperature and then allowed to cool under identical conditions. Assuming spheres to be perfect conductors of heat, then the ratio of initial rates of cooling are", "image": null}, "options": [{"id": "CxjrV", "text": "$\\begin{array}{r}R_1^2 \\\\ \\hline R_2^2\\end{array}$", "image": null, "isCorrect": true}, {"id": "gzRxY", "text": "$\\frac{R_1^4}{R_2^4}$", "image": null, "isCorrect": false}, {"id": "2HdmB", "text": "$\\frac{R_2^3}{R_1^3}$", "image": null, "isCorrect": false}, {"id": "axE4h", "text": "$\\frac{R_2}{R_1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Stefan's law, we know that: $Q=\\sigma A T^4 \\times e$ where, area of sphere, $A=4 \\pi R^2$.\nHere, temperature, thermal conductivity and emissivity of material are same.\nSo, we get the relation:\n$Q \\propto R^2$\nInitial rate of cooling is given as:\n$\\frac{Q_1}{Q_2}=\\frac{R_1^2}{R_2^2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261280279619d9d8a2a42", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "A black sphere has radius ' $R$ ' whose rate of radiation is ' $E$ ' at temperature ' $T$ '. if radius is made ' $\\frac{R}{3}$ 'and temperature ' $3 T$ ', the rate of radiation will be", "image": null}, "options": [{"id": "teGGE", "text": "$3 E$", "image": null, "isCorrect": false}, {"id": "b9DvQ", "text": "$16 \\mathrm{E}$", "image": null, "isCorrect": false}, {"id": "7EQiv", "text": "E", "image": null, "isCorrect": false}, {"id": "61DmP", "text": "$9 \\mathrm{E}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "A black sphere has radius ' $\\mathrm{R}$ ' whose rate of radiation is ' $\\mathrm{E}$ ' at temperature ' $\\mathrm{E}$ ' ' $\\mathrm{T}$ '. If radius is made $\\frac{\\mathrm{R}}{3}$ and temperature ' $3 \\mathrm{~T}$ ', the rate of radiation will be $9 \\mathrm{E}$\n$\\mathrm{E}_1=\\sigma \\times \\pi \\mathrm{R}_1^2 \\times \\mathrm{T}_1^4$\n$\\begin{aligned} & \\mathrm{E}_2=\\sigma \\times \\pi \\mathrm{R}_2^2 \\times \\mathrm{T}_2^4 \\\\ & \\therefore \\frac{\\mathrm{E}_2}{\\mathrm{E}_1}=\\left(\\frac{\\mathrm{R}_2}{\\mathrm{R}_1}\\right)^2\\left(\\frac{\\mathrm{T}_2}{\\mathrm{~T}_1}\\right)^4=\\left(\\frac{1}{3}\\right)^2(3)^4=9 \\\\ & \\therefore \\mathrm{E}_2=9 \\mathrm{E}_1=9 \\mathrm{E}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261180279619d9d8a29c0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}], "question": {"text": "The radiation energy density per unit wavelength at temperature $T$ is maximum at a wavelength $\\lambda_0$. At temperature $2 T$, it will have a maximum at a wavelength", "image": null}, "options": [{"id": "GrMXT", "text": "$\\frac{\\lambda_0}{4}$", "image": null, "isCorrect": false}, {"id": "Sx959", "text": "$2 \\lambda_0$", "image": null, "isCorrect": false}, {"id": "sHk0N", "text": "$4 \\lambda_0$", "image": null, "isCorrect": false}, {"id": "Fwo41", "text": "$\\frac{\\lambda_0}{2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Wien's displacement law, $\\lambda_m T=$ constant.\n$\\begin{aligned} & \\therefore \\lambda_{\\mathrm{m}} \\times T=\\lambda^{\\prime} \\times T^{\\prime} \\\\ & \\Rightarrow \\lambda_0 T=\\lambda^{\\prime} \\times 2 T \\\\ & \\Rightarrow \\lambda^{\\prime}=\\frac{\\lambda_0}{2}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261170279619d9d8a29b6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}], "question": {"text": "An object is cooled from $75^{\\circ} \\mathrm{C}$ to $65^{\\circ} \\mathrm{Cin} 2 \\mathrm{~min}$. The time, it takes to cool from $55^{\\circ} \\mathrm{C}$ to $45^{\\circ} \\mathrm{Cis}$ [The temperature of surrounding is $30^{\\circ} \\mathrm{C}$ ]", "image": null}, "options": [{"id": "G7HrV", "text": "$9 \\mathrm{~min}$", "image": null, "isCorrect": false}, {"id": "Mz68O", "text": "$10 \\mathrm{~min}$", "image": null, "isCorrect": false}, {"id": "iDPpy", "text": "$4 \\mathrm{~min}$", "image": null, "isCorrect": true}, {"id": "K0Tjx", "text": "$8 \\mathrm{~min}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Taking the newton's law of cooling in average form:\n$\\frac{\\Delta Q}{\\Delta t}=-K\\left(T_{a v g}-T_0\\right)$, where $T_{a v}=\\frac{T_1+T_2}{2}, K$ is the thermal conductivity.\nUsing, $\\Delta Q=m C_P \\Delta T$ the heat and heat capacity relation:\n$\\Rightarrow \\frac{m C_P \\Delta T}{\\Delta t}=-K\\left(T_{a v g}-T_0\\right)$\nCase (1) Given soup cools from $75^{\\circ} \\mathrm{C}$ to $65^{\\circ} \\mathrm{C}$ in 2 minutes when the room temperature is $30^{\\circ} \\mathrm{C}$ :\n$\\Rightarrow \\frac{m C_P \\times 10^{\\circ} \\mathrm{C}}{2 \\min }=-K\\left\\{\\frac{(75+65)^{\\circ} \\mathrm{C}}{2}-30^{\\circ} \\mathrm{C}\\right\\}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/f5319iHQvFLJVBa1eua2-52N0JuIysFhGdsrvmESIZU.original.fullsize.png\">\nCase (2) Let the soup cools from cool from $55^{\\circ} \\mathrm{C}$ to $45^{\\circ} \\mathrm{C}$ int minutes when the room temperature is $30^{\\circ} \\mathrm{C}$ :\n$\\Rightarrow \\frac{m C_P \\times 10^{\\circ} \\mathrm{C}}{\\Delta t}=-K\\left\\{\\frac{(55+45)^{\\circ} \\mathrm{C}}{2}-30^{\\circ} \\mathrm{C}\\right\\}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/ih6J7yS3x-a6maKHA4zqVcvLZJDjU-1azKKuOXGrjRs.original.fullsize.png\">\nOn taking the ratio of equation (2) \\& (1):\n$\\frac{10}{(\\Delta t) 5}=\\frac{20}{40}$\n$\\Rightarrow \\Delta t=4 \\mathrm{~min}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261160279619d9d8a29b2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}], "question": {"text": "If the temperature of back body is doubled, the frequency at which the spectral intensity becomes maximum, will be", "image": null}, "options": [{"id": "2bcfX", "text": "unchanged", "image": null, "isCorrect": false}, {"id": "C5RPi", "text": "four times", "image": null, "isCorrect": false}, {"id": "wo8QJ", "text": "doubled", "image": null, "isCorrect": true}, {"id": "ShWnN", "text": "halved", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the Wein's displacement law:\n$\\lambda_m \\propto \\frac{1}{T}$\nAnd the relation between wavelength and frequency is:\n$\\begin{aligned} & \\lambda \\propto \\frac{1}{f} \\\\ & \\Rightarrow f \\propto T\\end{aligned}$\nThus, if $T$ is doubled, the frequency at which the spectral intensity becomes maximum $f$ is also doubled.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260f10279619d9d8a288a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}], "question": {"text": "For a perfectly black body, the graph is plotted between the frequency of radiation with maximum intensity $\\left(v_{\\mathrm{m}}\\right)$ and the absolute temperature ' $\\mathrm{T}$ '. Out of the following which is the correct graph?\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/WbFkMHUu4zo09KVtZeGDHG7es9Hp5V9kNPjY2J6JWPk.original.fullsize.png\">", "image": null}, "options": [{"id": "fNpe1", "text": "C", "image": null, "isCorrect": false}, {"id": "9NZHx", "text": "A", "image": null, "isCorrect": false}, {"id": "CkHW7", "text": "D", "image": null, "isCorrect": false}, {"id": "wLQHz", "text": "B", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Wein's displacement law $\\lambda_{\\mathrm{m}} \\mathrm{T}=\\mathrm{b}=$ Wein constant\nIf $v_m$ is the frequency corresponding to wavelength $\\lambda_m$, then\n$\\left(\\frac{\\mathrm{c}}{\\mathrm{u}_{\\mathrm{m}}}\\right) \\mathrm{T}=\\mathrm{b}$\nor $\\mathrm{u}_{\\mathrm{m}}=\\frac{\\mathrm{c}}{\\mathrm{b}} \\mathrm{T}$, i.e.,\n$\\mathrm{u}_{\\mathrm{m}} \\propto \\mathrm{T}$\n$\\therefore v_{\\mathrm{m}}$ graph is linear w.r.t. temperature and the straingth line shown by line $\\mathrm{B}$. Thus, option (D) is true.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260db0279619d9d8a27df", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}], "question": {"text": "Two spheres ' $\\mathrm{S}_1$ ' and ' $\\mathrm{S}_2$ ' have same radii but temperatures are ' $\\mathrm{T}_1$ ' and ' $\\mathrm{T}_2$ ' respectively. Their emissive power is same and emissivity is in the ratio $1: 4$. Then the ratio ' $\\mathrm{T}_1$ ' to ' $\\mathrm{T}_2$ ' is", "image": null}, "options": [{"id": "4rp82", "text": "$1: \\sqrt{2}$", "image": null, "isCorrect": false}, {"id": "OeOPz", "text": "$1: 2$", "image": null, "isCorrect": false}, {"id": "m52Cz", "text": "$2: 1$", "image": null, "isCorrect": false}, {"id": "rKfRC", "text": "$\\sqrt{2}: 1$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The correct option is (D).\nConcept:\nEmissivity(e)\n$=\\frac{(\\text { rate of radiation emitted thourgh a unit area of material) }}{\\text { (rate of radiation emitted through a unit area of blackbody) }}$\nStefan-Boltzmann law states that the amount of radiation emitted by a black body per unit area $\\varepsilon$ is directly proportional to the fourth power of the temperature $\\mathrm{T}$.\n$\\varepsilon=\\sigma \\mathrm{T}^4$, where $\\sigma$ is the Stefan coefficient.\nTherefore, $\\varepsilon_1=\\mathrm{e}_1 \\sigma \\mathrm{T}_1^4$ and $\\varepsilon_2=\\mathrm{e}_2 \\sigma \\mathrm{T}_2^4$.\nIt is given that emmisive power of the both spheres of equal radius is the same.\nSo, $\\mathrm{e}_1 \\sigma \\mathrm{T}_1^4=\\mathrm{e}_2 \\sigma \\mathrm{T}_2^4$.\n$\\frac{\\mathrm{T}_1}{\\mathrm{~T}_2}=\\left(\\frac{\\mathrm{e}_2}{\\mathrm{e}_1}\\right)^{1 / 4}=\\left(\\frac{4}{1}\\right)^{1 / 4}$\n$\\frac{T_1}{T_2}=\\frac{\\sqrt{2}}{1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260ca0279619d9d8a2755", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "A metal sphere cools at the rate of $1.5^{\\circ} \\mathrm{C} / \\mathrm{min}$ when its temperature is $80^{\\circ} \\mathrm{C}$. At what rate will it cool when its temperature falls to $50^{\\circ} \\mathrm{C}$. [Temperature of surrounding is $30^{\\circ} \\mathrm{C}$ ]", "image": null}, "options": [{"id": "YsPb6", "text": "$0.9^{\\circ} \\mathrm{C} / \\mathrm{min}$", "image": null, "isCorrect": false}, {"id": "ENytA", "text": "$0.6^{\\circ} \\mathrm{C} / \\mathrm{min}$", "image": null, "isCorrect": true}, {"id": "p0Cp1", "text": "$1.5^{\\circ} \\mathrm{C} / \\mathrm{min}$", "image": null, "isCorrect": false}, {"id": "qEV0g", "text": "$1.2^{\\circ} \\mathrm{C} / \\mathrm{min}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When temperature is $80^{\\circ} \\mathrm{C}$, by Newton's law of cooling, we have\n$1.5=\\mathrm{k}\\left(\\frac{80+30}{2}-30\\right)=\\mathrm{k}(55-30)=25 \\mathrm{~K}$\nWhen temperature is $50^{\\circ} \\mathrm{C}$, let $\\mathrm{r}$ be the rate of cooling.\nThen\n$\\begin{aligned}\n& \\mathrm{r}=\\mathrm{k}\\left(\\frac{50+30}{2}-30\\right)=\\mathrm{k}(40-30)=10 \\mathrm{~K} \\\\\n& \\therefore \\frac{\\mathrm{r}}{1.5}=\\frac{10}{25} \\\\\n& \\mathrm{r}=0.6^{\\circ} \\mathrm{C} / \\mathrm{min}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260ca0279619d9d8a2751", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "Assume that for solar radiation, surface temperature of the sum is $6000 \\mathrm{~K}$. If Wien's constant ' $\\mathrm{b}$ ' is $2.897 \\times 10^{-3} \\mathrm{~m}-\\mathrm{K}$, the value of maximum wavelength will be", "image": null}, "options": [{"id": "e1LQm", "text": "$4828 Å$", "image": null, "isCorrect": true}, {"id": "p3TNp", "text": "$3648 Å$", "image": null, "isCorrect": false}, {"id": "WCsq9", "text": "$6400 Å$", "image": null, "isCorrect": false}, {"id": "WjAQi", "text": "$0.18 Å$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{T}=6000 \\mathrm{~K}, \\mathrm{~b}=2.897 \\times 10^{-3} \\mathrm{~m}-\\mathrm{K}$\nBy Wien's law, $\\lambda \\mathrm{T}=\\mathrm{b}$\n$\\begin{aligned}\n& \\lambda=\\frac{2.897 \\times 10^{-3}}{6000} \\\\\n& =4.828 \\times 10^{-7} \\mathrm{~m}=4828 Å\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260a30279619d9d8a261b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "The temperature of a black body is increased by $50 \\%$, then the percentage increase in the rate of radiation by the body is approximated", "image": null}, "options": [{"id": "lAMLw", "text": "$50 \\%$", "image": null, "isCorrect": false}, {"id": "TlUfW", "text": "$100 \\%$", "image": null, "isCorrect": false}, {"id": "e7DV2", "text": "$400 \\%$", "image": null, "isCorrect": true}, {"id": "8GzOm", "text": "$150 \\%$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Rate of radiation $\\mathrm{R} \\propto \\mathrm{T}^4$\n$$\n\\begin{aligned}\n& \\therefore \\frac{\\mathrm{R}_2}{\\mathrm{R}_1}=\\left(\\frac{\\mathrm{T}_2}{\\mathrm{~T}_1}\\right)^4=(1.5)^4 \\approx 5 \\\\\n& \\therefore \\mathrm{R}_2=5 \\mathrm{R}_1\n\\end{aligned}\n$$\nPercentage increase $=\\left(\\frac{\\mathrm{R}_2-\\mathrm{R}_1}{\\mathrm{R}_1}\\right) \\times 100=400 \\%$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260a20279619d9d8a2617", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "For a perfectly black body, coefficient of emission is", "i
