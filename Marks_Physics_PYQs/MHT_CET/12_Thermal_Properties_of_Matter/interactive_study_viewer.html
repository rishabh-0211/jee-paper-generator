mage": null}, "options": [{"id": "C8xmf", "text": "zero", "image": null, "isCorrect": false}, {"id": "AlHuN", "text": "infinity", "image": null, "isCorrect": false}, {"id": "MeDjq", "text": "unity", "image": null, "isCorrect": true}, {"id": "fip0d", "text": "less than one (non-zero)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><strong>Perfect black body absorption and emission</strong></p><p>A perfectly black body absorbs all incident radiation regardless of wavelength, giving it an absorption coefficient $a = 1$.</p><p>Kirchhoff's law establishes that emissivity equals absorptivity at a given wavelength and temperature: $e = a$.</p><p>Since $a = 1$, the emissivity must also be unity: $e = 1$.</p><p>A perfectly black body is therefore both a perfect absorber and perfect emitter of radiation.</p><p>The correct choice is $\\boxed{B}$.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260810279619d9d8a2506", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "The emissive power of sphere of area $0.04 \\mathrm{~m}^2$ is $0.7 \\mathrm{kcal} \\mathrm{s}^{-1} \\mathrm{~m}^{-2}$. The amount of heat radiated in 20 second is", "image": null}, "options": [{"id": "VZU92", "text": "$2.8 \\mathrm{kcal} \\mathrm{s}^{-1} \\mathrm{~m}^{-2}$", "image": null, "isCorrect": false}, {"id": "0m5Rl", "text": "$0.28 \\mathrm{kcal} \\mathrm{s}^{-1} \\mathrm{~m}^{-2}$", "image": null, "isCorrect": false}, {"id": "65UXe", "text": "$5.6 \\mathrm{kcal} \\mathrm{s}^{-1} \\mathrm{~m}^{-2}$", "image": null, "isCorrect": false}, {"id": "5cZhQ", "text": "$0.56 \\mathrm{kcal} \\mathrm{s}^{-1} \\mathrm{~m}^{-2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Emissive power $E=\\frac{Q}{A t}$\n$$\n\\therefore Q=E A t=0.7 \\times 0.04 \\times 20=0.56 \\mathrm{kcal} \\mathrm{s}^{-1} \\mathrm{~m}^{-2}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2606f0279619d9d8a2477", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "If the temperature of the sun is doubled, the rate of energy received by the earth will be increased by a factor", "image": null}, "options": [{"id": "qW6br", "text": "8", "image": null, "isCorrect": false}, {"id": "Jj0Vq", "text": "2", "image": null, "isCorrect": false}, {"id": "y7jAT", "text": "4", "image": null, "isCorrect": false}, {"id": "KtzAW", "text": "16", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Rate of energy emission $R \\propto T^4$\n$$\n\\therefore \\frac{R_2}{R_1}=(2)^4=16\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2604b0279619d9d8a2353", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "A black rectangular surface of area ' $a$ ' emits energy ' $E$ ' per second at $27^{\\circ} \\mathrm{C}$. If length and breadth is reduced to $\\left(\\frac{1}{3}\\right)^{\\text {rd }}$ of initial value and temperature is raised to $327^{\\circ} \\mathrm{C}$ then energy emitted per second becomes", "image": null}, "options": [{"id": "Au6yb", "text": "$\\frac{16 \\mathrm{E}}{9}$", "image": null, "isCorrect": true}, {"id": "6z6Ie", "text": "$\\frac{8 \\mathrm{E}}{9}$", "image": null, "isCorrect": false}, {"id": "XWlEe", "text": "$\\frac{4 \\mathrm{E}}{9}$", "image": null, "isCorrect": false}, {"id": "iaJTO", "text": "$\\frac{E}{9}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\mathrm{E}=\\mathrm{e} \\sigma \\mathrm{AT}^4 \\text { and } \\mathrm{A}=\\ell \\mathrm{b}\n$$\n$$\n\\frac{E^{\\prime}}{E}=\\frac{A^{\\prime}(327+273)^4}{A(27+273)^4}\n$$\n$$\n\\frac{E^{\\prime}}{E}=\\frac{1}{9}\\left(\\frac{600}{300}\\right)^4\n$$\n$$\n\\begin{aligned}\n& \\therefore \\mathrm{E}^{\\prime}=\\frac{1}{9} \\times(2)^4 \\times \\mathrm{E} \\\\\n& \\Rightarrow \\mathrm{E}^{\\prime}=\\frac{16 \\mathrm{E}}{9}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260490279619d9d8a2343", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "A black body has maximum wavelength ' $\\lambda_{\\mathrm{m}}$ ' at temperature $2000 \\mathrm{~K}$. Its corresponding wavelength at temperature $3000 \\mathrm{~K}$ will be", "image": null}, "options": [{"id": "ZAvtd", "text": "$\\frac{4 \\lambda_m}{9}$", "image": null, "isCorrect": false}, {"id": "Z8eEB", "text": "$\\frac{2 \\lambda_m}{3}$", "image": null, "isCorrect": true}, {"id": "gOikK", "text": "$\\frac{3 \\lambda_{\\mathrm{m}}}{2}$", "image": null, "isCorrect": false}, {"id": "depd0", "text": "$\\frac{9}{4} \\lambda_m$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "By Wien's displacement law, $\\lambda \\mathrm{T}=$ constant\n$$\n\\begin{aligned}\n& \\therefore \\lambda \\propto \\frac{1}{\\mathrm{~T}} \\\\\n& \\frac{\\lambda_2}{\\lambda_1}=\\frac{\\mathrm{T}_1}{\\mathrm{~T}_2}=\\frac{2000}{3000}=\\frac{2}{3} \\\\\n& \\lambda_2=\\frac{2}{3} \\lambda_1\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260370279619d9d8a22ae", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "A perfectly black body emits a radiation at temperature ' $\\mathrm{T}_1$ ' $\\mathrm{K}$. If it is to radiate at 16 times this power, its temperature ' $\\mathrm{T}_2$ ' $\\mathrm{K}$ should be", "image": null}, "options": [{"id": "7FS96", "text": "$8 \\mathrm{~T}_1$", "image": null, "isCorrect": false}, {"id": "cWm1J", "text": "$4 \\mathrm{~T}_1$", "image": null, "isCorrect": false}, {"id": "9V8Hr", "text": "$2 \\mathrm{~T}_1$", "image": null, "isCorrect": true}, {"id": "sZVmD", "text": "$16 \\mathrm{~T}_1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\frac{\\mathrm{P}_2}{\\mathrm{P}_1}=\\left(\\frac{\\mathrm{T}_2}{\\mathrm{~T}_1}\\right)^4 \\\\\n& \\therefore 16=\\left(\\frac{\\mathrm{T}_2}{\\mathrm{~T}_1}\\right)^4 \\\\\n& \\therefore \\frac{\\mathrm{T}_2}{\\mathrm{~T}_1}=2\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260260279619d9d8a222a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "Two stars ' $\\mathrm{P}$ ' and ' $\\mathrm{Q}$ ' emit yellow and blue light respectively. The relation between their temperatures $\\left(\\mathrm{T}_{\\mathrm{P}}\\right.$ and $\\left.\\mathrm{T}_{\\mathrm{Q}}\\right)$ is", "image": null}, "options": [{"id": "bZ8iC", "text": "$\\mathrm{T}_{\\mathrm{P}}=\\mathrm{T}_{\\mathrm{Q}}$", "image": null, "isCorrect": false}, {"id": "h9aLk", "text": "$\\mathrm{T}_{\\mathrm{P}}=\\frac{\\mathrm{T}_{\\mathrm{Q}}}{2}$", "image": null, "isCorrect": false}, {"id": "rfE1b", "text": "$\\mathrm{T}_{\\mathrm{P}}>\\mathrm{T}_{\\mathrm{Q}}$", "image": null, "isCorrect": false}, {"id": "u7JGG", "text": "$\\mathrm{T}_{\\mathrm{P}} < \\mathrm{T}_{\\mathrm{Q}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to wien's law, $\\lambda T=$ constant\n$$\n\\therefore \\mathrm{T} \\propto \\frac{1}{\\lambda}\n$$\nwavelength of blue light is less that than of yellow light.\nHence, temperature of $\\mathrm{Q}$ is greater than temperature of $\\mathrm{P}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260250279619d9d8a221c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "A black rectangular surface of area ' $A$ ' emits energy ' $E$ ' per second at $27^{\\circ} \\mathrm{C}$. If length and breadth is reduced to $(1 / 3)^{\\text {rd }}$ of its initial value and temperature is raised to $327^{\\circ} \\mathrm{C}$ then energy emitted per second becomes", "image": null}, "options": [{"id": "iBe7K", "text": "$\\frac{20 \\mathrm{E}}{9}$", "image": null, "isCorrect": false}, {"id": "K9B3c", "text": "$\\frac{8 E}{9}$", "image": null, "isCorrect": false}, {"id": "Cx6wi", "text": "$\\frac{16 \\mathrm{E}}{9}$", "image": null, "isCorrect": true}, {"id": "REe9S", "text": "$\\frac{4 \\mathrm{E}}{9}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{E}=\\sigma \\mathrm{AT}^4 \\\\ & \\mathrm{E}^{\\prime}=\\sigma \\mathrm{A}^{\\prime} \\mathrm{T}^{\\prime 4} \\\\ & \\mathrm{~A}=\\mathrm{L} \\times \\mathrm{B} \\\\ & \\mathrm{A}^{\\prime}=\\frac{\\mathrm{L}}{3} \\times \\frac{\\mathrm{B}}{3}=\\frac{\\mathrm{A}}{9} \\\\ & \\mathrm{~T}=27^{\\circ} \\mathrm{C}=300 \\mathrm{~K} \\\\ & \\mathrm{~T}^{\\prime}=327^{\\circ} \\mathrm{C}=600 \\mathrm{~K} \\\\ & \\frac{\\mathrm{E}^{\\prime}}{\\mathrm{E}}=\\frac{\\mathrm{A}^{\\prime}}{\\mathrm{A}}\\left(\\frac{\\mathrm{T}^{\\prime}}{\\mathrm{T}}\\right)^4=\\frac{1}{9}(2)^4 \\\\ & \\therefore \\mathrm{E}^{\\prime}=\\frac{16 \\mathrm{E}}{9}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260100279619d9d8a216f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}], "question": {"text": "A black body radiates maximum energy at wavelength $^{\\prime} \\lambda^{\\prime}$ and its emissive power is ${ }^{\\prime} \\mathrm{E}^{\\prime}$. Now, due to change in temperature of that body, it radiates maximum energy at wavelength $\\frac{2 \\lambda}{3}$. At that temperature, emissive power is", "image": null}, "options": [{"id": "jMMXE", "text": "$\\frac{27 \\mathrm{E}}{16}$", "image": null, "isCorrect": false}, {"id": "pTePc", "text": "$\\frac{81 \\mathrm{E}}{16}$", "image": null, "isCorrect": true}, {"id": "DoAt9", "text": "$\\frac{91 \\mathrm{E}}{16}$", "image": null, "isCorrect": false}, {"id": "yKjYi", "text": "$\\frac{54 \\mathrm{E}}{16}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\lambda_{\\max } \\mathrm{T}_{1}=\\lambda_{2 \\max } \\mathrm{T}_{2} \\quad \\quad \\mathrm{E}=\\sigma \\mathrm{A} \\mathrm{T}_{1}^{4}$\n$\\mathrm{T}_{2}=\\frac{\\lambda_{1} \\mathrm{~T}_{1}}{\\lambda_{2}}$\n$\\frac{E_{2}}{E_{1}}=\\frac{T_{2}^{4}}{T_{1}^{4}}$\n$\\therefore \\mathrm{E}_{2}=\\mathrm{E}_{1} \\times \\frac{\\lambda_{1}^{4} \\mathrm{~T}_{1}^{4}}{\\lambda_{2}^{4}} \\times \\frac{1}{\\mathrm{~T}_{1}^{4}}=\\mathrm{E} \\times \\frac{\\lambda_{1}^{4}}{\\frac{16}{81} \\lambda_{1}^{4}}=\\frac{81}{16} \\mathrm{E}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260010279619d9d8a20fc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "Three black discs ' $\\mathrm{x}^{\\prime}$, $^{\\prime} \\mathrm{y}^{\\prime},{ }^{\\prime} \\mathrm{z}^{\\prime}$ have radii $1 \\mathrm{~m}, 2 \\mathrm{~m}$ and $3 \\mathrm{~m}$ respectively. The\nwavelengths corresponding to maximum intensity are 200,300 and $400 \\mathrm{~nm}$\nrespectively. The relation between emissive powers 'Ex', 'Ey' and 'Ez' is", "image": null} mathrm{m}$\n$2 \\lambda_{1}=4 \\mu \\mathrm{m} \\quad \\therefore \\quad \\lambda_{2}=6 \\mu \\mathrm{m}$\n$\\lambda_{1}=2 \\mu \\mathrm{m} \\quad$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f1f0279619d9d8a19ee", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}], "question": {"text": "Two spheres ' $\\mathrm{S}_{1}$ ' and ' $\\mathrm{S}_{2}$ ' have same radii but temperatures $\\mathrm{T}_{1}$ and $\\mathrm{T}_{2}$ respectively.\nTheir emissive power is same and emissivity is in the ratio $1: 4$. Then the ratio of $\\mathrm{T}_{1}$\nto $\\mathrm{T}_{2}$ is", "image": null}, "options": [{"id": "eXXL4", "text": "$\\sqrt{2}: 1$", "image": null, "isCorrect": true}, {"id": "4SOtT", "text": "$1: 2$", "image": null, "isCorrect": false}, {"id": "8L5a9", "text": "$2: 1$", "image": null, "isCorrect": false}, {"id": "pWE49", "text": "$1: \\sqrt{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Emissive power $P=\\sigma \\mathrm{e} T^{4}$\n$$\n\\begin{array}{l}\n\\therefore \\sigma e_{1} T_{1}^{4}=\\sigma e_{2} T_{2}^{4} \\\\\n\\frac{T_{1}^{4}}{T_{2}^{4}}=\\frac{e_{2}}{e_{1}}=4 \\\\\n\\therefore \\frac{T_{1}}{T_{2}}=\\sqrt{2}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f0c0279619d9d8a1958", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}], "question": {"text": "The maximum wavelength of radiation emitted by a star is 289.8 nm. Then intensity of radiation for the star is (Given : Stefan’s constant = <math><mn>5.67</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>8</mn></mrow></msup><mi>W</mi><msup><mrow><mi>m</mi></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup><msup><mrow><mi>K</mi></mrow><mrow><mo>-</mo><mn>4</mn></mrow></msup></math> , Wien’s constant, <math><mi>b</mi><mo>=</mo><mn>2898</mn><mi>μ</mi><mi>m</mi><mi>K</mi><mo>)</mo></math>", "image": null}, "options": [{"id": "sM0qz", "text": "<math><mn>5.67</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>12</mn></mrow></msup><mi>W</mi><msup><mrow><mi>m</mi></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "MjHt0", "text": "<math><mn>10.67</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>14</mn></mrow></msup><mi>W</mi><msup><mrow><mi>m</mi></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "y6DuM", "text": "<math><mn>5.67</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>8</mn></mrow></msup><mi>W</mi><msup><mrow><mi>m</mi></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "VtTUM", "text": "<math><mn>10.67</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>7</mn></mrow></msup><mi>W</mi><msup><mrow><mi>m</mi></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, maximum wavelength, <br/><math><msub><mrow><mi>λ</mi></mrow><mrow><mi>m</mi></mrow></msub><mo>=</mo><mn>289.8</mn><mi>n</mi><mi>m</mi><mo>=</mo><mn>28.98</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>9</mn></mrow></msup><mi>m</mi></math>  <br/><math><mo>=</mo><mn>2898</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>10</mn></mrow></msup><mi>m</mi></math>  <br/>Stefan’s constant, <math><mi>σ</mi><mo>=</mo><mn>5.67</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>8</mn></mrow></msup><mi>W</mi><msup><mrow><mi>m</mi></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup><msup><mrow><mi>K</mi></mrow><mrow><mo>-</mo><mn>4</mn></mrow></msup></math>  <br/>Wien’s constant, b = 2898 <math><mi>μ</mi><mi>m</mi><mi>k</mi></math> = 2898 <math><mi></mi><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup><mi>m</mi><mi>K</mi></math>  <br/>According to Wien’s displacement law, the maximum wavelength is given by <br/><math><msub><mrow><mi>λ</mi></mrow><mrow><mi>m</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>b</mi></mrow><mrow><mi>T</mi></mrow></mfrac><mo>⇒</mo><mi>T</mi><mo>=</mo><mfrac><mrow><mi>b</mi></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mi>m</mi></mrow></msub></mrow></mfrac></math> …. (i) <br/>Substituting given values in Eq. (i), we get <br/><math><mi>T</mi><mo>=</mo><mfrac><mrow><mn>2898</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup></mrow><mrow><mn>2898</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>10</mn></mrow></msup></mrow></mfrac><mo>=</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>4</mn></mrow></msup><mi>K</mi></math> …. (ii) <br/>According to Stefan’s law the energy radiated from a source is given by <br/><math><mi>E</mi><mo>=</mo><mi>σ</mi><mi>A</mi><mi>e</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup></math> …. (iii) <br/>Where, A = area of source <br/>e = emissivity (value between 0 to 1) <br/>The intensity of radiations emitted is equal to energy radiated from a given surface area, i.e., <br/><math><mi>l</mi><mo>=</mo><mfrac><mrow><mi>E</mi></mrow><mrow><mi>A</mi></mrow></mfrac><mo>=</mo><mi>σ</mi><mi>e</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup></math> [From Eq.(iii)] <br/>As e is very small , so <br/><math><mi>l</mi><mo>=</mo><mi>σ</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup></math>  <br/>Substituting the value of T from Eq.(ii) in Eq.(iv), we get <br/><math><mi>l</mi><mo>=</mo><mi>σ</mi><msup><mrow><mfenced separators=\"|\"><mrow><mn>10</mn></mrow></mfenced></mrow><mrow><mn>4</mn></mrow></msup><mo>=</mo><mn>5.67</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>8</mn></mrow></msup><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>16</mn></mrow></msup></math>  <br/><math><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mo>∵</mo><mi>σ</mi><mo>=</mo><mn>5.67</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>8</mn></mrow></msup><mfenced separators=\"|\"><mrow><mi>g</mi><mi>i</mi><mi>v</mi><mi>e</mi><mi>n</mi></mrow></mfenced></mrow></mfenced></math>  <br/><math><mo>=</mo><mn>5.67</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>8</mn></mrow></msup><mi>W</mi><msup><mrow><mi>m</mi></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ebd0279619d9d8a16e7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f62", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": h><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><msup><mrow><mi>E</mi></mrow><mrow><mi>′</mi></mrow></msup></mrow><mrow><mi>E</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>9</mn></mrow></mfrac><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>600</mn></mrow><mrow><mn>300</mn></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>4</mn></mrow></msup></math><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><msup><mrow><mi>E</mi></mrow><mrow><mi>′</mi></mrow></msup><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>9</mn></mrow></mfrac><mo>×</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>2</mn></mrow></mfenced></mrow><mrow><mn>4</mn></mrow></msup><mo>×</mo><mi>E</mi></math><br /><math><msup><mrow><mi>E</mi></mrow><mrow><mi>′</mi></mrow></msup><mo>=</mo><mfrac><mrow><mn>16</mn><mi>E</mi></mrow><mrow><mn>9</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e870279619d9d8a152b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "The tourmaline crystal", "image": null}, "options": [{"id": "2muSO", "text": "absorbs ordinary light and transmits extra ordinary", "image": null, "isCorrect": true}, {"id": "Jgm0J", "text": "absorbs extra ordinary light and transmits ordinary light", "image": null, "isCorrect": false}, {"id": "Grg8G", "text": "both absorbs ordinary and extra ordinary light", "image": null, "isCorrect": false}, {"id": "KfpXx", "text": "both transmits ordinary light and extra ordinary light", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The tourmaline crystal absorbs ordinary light and transmits extra ordinary.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e870279619d9d8a152a", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "A black body at a temperature of $227^{\\circ} \\mathrm{C}$ radiates heat energy at the rate $5 \\mathrm{cal} / \\mathrm{cm}^{2}-\\mathrm{s} .$ At a temperature of $727^{\\circ} \\mathrm{C}$, the rate of heat radiated per unit area in $\\mathrm{cal} / \\mathrm{cm}^{2}$ will be", "image": null}, "options": [{"id": "c2959", "text": "80", "image": null, "isCorrect": true}, {"id": "LqQxs", "text": "160", "image": null, "isCorrect": false}, {"id": "q2u6B", "text": "250", "image": null, "isCorrect": false}, {"id": "nISe4", "text": "500", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\frac{E_{2}}{E_{1}}=\\left(\\frac{T_{2}}{T_{1}}\\right)^{4}$\n$$\n\\begin{array}{l}\n\\frac{E_{2}}{E_{1}}=\\left(\\frac{273+727}{273+227}\\right)^{4} \\\\\n\\frac{E_{2}}{5}=\\frac{(1000)^{4}}{(500)^{4}}=16 \\\\\nE_{2}=80 \\mathrm{cal} / \\mathrm{cm}^{2}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e870279619d9d8a1529", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "We consider the radiation emitted by the human body, which of the following statements is true?", "image": null}, "options": [{"id": "wnONe", "text": "The radiation is emitted only during the day.", "image": null, "isCorrect": false}, {"id": "UzN4i", "text": "The radiation is emitted during the summers and absorbed during the winters.", "image": null, "isCorrect": false}, {"id": "Q3x5V", "text": "The radiation emitted lies in the ultraviulet region and hence is not visible.", "image": null, "isCorrect": false}, {"id": "5mEWl", "text": "The radiation emitted is in the infrared region.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Every body at all times, at all temperatures emits radiation. The radiation emitted by the human body is in the infrared region.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e750279619d9d8a1494", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "For an opaque body coefficient of transmission is", "image": null}, "options": [{"id": "IudNn", "text": "zero", "image": null, "isCorrect": true}, {"id": "Rao2s", "text": "1", "image": null, "isCorrect": false}, {"id": "ETura", "text": "$0.5$", "image": null, "isCorrect": false}, {"id": "lWx8U", "text": "$\\infty$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "An opaque body doesnot transmits any radiation hence transmission of coefficient of an opaque body is zero.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e740279619d9d8a1493", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "The sphere of radii $8 \\mathrm{~cm}$ and $2 \\mathrm{~cm}$ are cooling. Their temperatures are $127^{\\circ} \\mathrm{C}$ and $527^{\\circ} \\mathrm{C}$ respectively. Find the ratio of energy radiated by them in the same time", "image": null}, "options": [{"id": "8UfM1", "text": "$0.06$", "image": null, "isCorrect": false}, {"id": "l9DX4", "text": "$0.5$", "image": null, "isCorrect": false}, {"id": "WkovG", "text": "1", "image": null, "isCorrect": true}, {"id": "kQda7", "text": "2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Total energy radiated from a body\nOr\n$$\n\\begin{array}{l}\nQ=A \\varepsilon \\sigma T^{4} t \\\\\n\\frac{Q}{t} \\propto A T^{4}\n\\end{array}\n$$\n$$\n\\frac{Q}{t} \\propto r^{2} T^{4} \\quad\\left(\\because A=4 \\pi r^{2}\\right)\n$$\n$$\n\\begin{aligned}\n\\frac{Q_{1}}{Q_{2}} &=\\left(\\frac{r_{1}}{r_{2}}\\right)^{2}\\left(\\frac{T_{1}}{T_{2}}\\right)^{4} \\\\\n&=\\left(\\frac{8}{2}\\right)^{2}\\left[\\frac{273+127}{273+527}\\right]^{4}=1\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e640279619d9d8a140f", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "If $150 \\mathrm{~J}$ of energy is incident on area $2 \\mathrm{~m}^{2}$. If $Q_{r}=15 \\mathrm{~J}$, coefficient of absorption is $0.6$, then amount of energy transmitted is", "image": null}, "options": [{"id": "uAD6u", "text": "$50 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "E7KqB", "text": "$45 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "bmpMf", "text": "$40 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "5ne2s", "text": "$30 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When thermal radiations (Q) fall on a body, they are partly reflected, partly absorbed and partly transmitted.\n$$\nQ=Q_{a}+Q_{r}+Q_{t}\n$$\nand $\\quad \\frac{Q_{a}}{Q}+\\frac{Q_{r}}{Q}+\\frac{Q_{t}}{Q}=a+r+t=1$\n$$\n\\Rightarrow \\quad \\frac{15}{150}+0.6+x=1\n$$\nor $0.1+0.6+x=1$\nor $x=0.3$\nTransmitting power, $t=\\frac{Q_{t}}{Q}$\nor $0.3=\\frac{Q_{t}}{150}$\n$$\n\\Rightarrow \\quad Q_{t}=45 \\mathrm{~J}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e640279619d9d8a140c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "The unit of Wien's constant $b$ is", "image": null}, "options": [{"id": "CUMTY", "text": "$\\mathrm{Wm}^{-2} \\mathrm{~K}^{-4}$", "image": null, "isCorrect": false}, {"id": "6jWDr", "text": "$\\mathrm{m}^{-1} \\mathrm{~K}^{-1}$", "image": null, "isCorrect": false}, {"id": "ly89o", "text": "$\\mathrm{Wm}^{2}$", "image": null, "isCorrect": false}, {"id": "aB2Ul", "text": "$\\mathrm{m}-\\mathrm{K}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Wien's law the product of wavelength corresponding to maximum intensity of radiation and temperature of body (in Kelvin) is constant ie, $\\lambda_{m} T=b=$ constant\nwhere $b$ is Wien's constant and has value $2.89 \\times 10^{-3} \\mathrm{~m}-\\mathrm{K}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e520279619d9d8a137e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "Absorption coefficient of an open window is", "image": null}, "options": [{"id": "TTUPY", "text": "zero", "image": null, "isCorrect": false}, {"id": "E09v4", "text": "$0.5$", "image": null, "isCorrect": false}, {"id": "eGLyq", "text": "1", "image": null, "isCorrect": true}, {"id": "1ZxLa", "text": "$0.25$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Open window behaves like a perfectly black body.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e520279619d9d8a137d", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "Which of the following statements is true/correct?", "image": null}, "options": [{"id": "jcUbq", "text": "During clear nights, the temperature rises steadily upward near the ground level", "image": null, "isCorrect": false}, {"id": "IHYuc", "text": "Newton's law of cooling, an approximate form of Stefan's law, is valid only for natural convection", "image": null, "isCorrect": true}, {"id": "hU5sL", "text": "The total energy emitted by a black body per unit time per unit area is proportional to the square of its temperature in the Kelvin scale", "image": null, "isCorrect": false}, {"id": "TeGMT", "text": "Two spheres of the same material have radii $1 \\mathrm{~m}$ and $4 \\mathrm{~m}$ and temperatures $4000 \\mathrm{~K}$ and $2000 \\mathrm{~K}$ respectively. The energy radiated per second by the first sphere is greater than that radiated per second by the second sphere", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "During clear nights object on surface of earth radiate out heat and temperature falls. Hence option (a) is wrong. The total energy radiated by a body per unit time per unit area $E \\propto T^{4}$. Hence option (c) is\nwrong. Energy radiated per second is given by\n$\\begin{aligned} \\frac{Q}{t} &=P A \\varepsilon \\sigma T^{4} \\\\ \\Rightarrow \\quad \\frac{P_{1}}{P_{2}} &=\\frac{A_{1}}{A_{2}}\\left(\\frac{T_{1}}{T_{2}}\\right)^{4}=\\left(\\frac{\\pi}{r_{2}}\\right)^{2} \\cdot\\left(\\frac{T_{1}}{T_{2}}\\right)^{4} \\\\ &=\\left(\\frac{1}{4}\\right)^{2}\\left(\\frac{4000}{200}\\right)=\\frac{1}{1} \\end{aligned}$\n$\\because P_{1}=P_{2}$, hence option (d) is wrong. Newton's law is an approximate from of Stefan's law of radiation and works well for natural convection. Hence option (b) is correct.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e3c0279619d9d8a12d0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "Two plane mirrors are perpendicular to each other. A ray after suffering reflection from the two mirrors will be", "image": null}, "options": [{"id": "R4d7M", "text": "perpendicular to the original ray", "image": null, "isCorrect": false}, {"id": "xo9OX", "text": "parallel to the original ray", "image": null, "isCorrect": true}, {"id": "ccSUX", "text": "parallel to the first mirror", "image": null, "isCorrect": false}, {"id": "ljGke", "text": "at $45^{\\circ}$ to the original ray", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here, angular deviation\n$$\n\\begin{aligned}\n\\delta &=2 \\pi-2 \\theta \\\\\n&=2 \\pi-2 \\times \\frac{\\pi}{2}=\\pi\n\\end{aligned}\n$$\nHence, final emergent ray is parallel to incident ray.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
