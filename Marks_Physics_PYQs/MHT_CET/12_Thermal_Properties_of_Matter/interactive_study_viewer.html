 "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b45bf9280d7f99327b6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A centigrade and Fahrenheit thermometer are dipped in boiling water. The water temperature is lowered until the Fahrenheit temperature observed is $140^{\\circ} \\mathrm{F}$. At that time the temperature registered by the centigrade thermometer is", "image": null}, "options": [{"id": "7MN7C", "text": "$80^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "vywwq", "text": "$60^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": true}, {"id": "JlvTX", "text": "$40^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "6VsY4", "text": "$20^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The relation between Celsius and Fahrenheit scales is given by:<br><br>$\\dfrac{C}{5} = \\dfrac{F - 32}{9}$<br><br>Substituting $F = 140$:<br><br>$\\dfrac{C}{5} = \\dfrac{140 - 32}{9}$<br><br>$\\dfrac{C}{5} = \\dfrac{108}{9}$<br><br>$\\dfrac{C}{5} = 12$<br><br>$C = 60^{\\circ} \\mathrm{C}$<br><br>Answer: $60^{\\circ} \\mathrm{C}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262770279619d9d8a34c4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "A metal rod cools at the rate of $4{ }^{\\circ} \\mathrm{C} / \\mathrm{min}$ when its temperature is $90^{\\circ} \\mathrm{C}$ and the rate of $1{ }^{\\circ} \\mathrm{C} / \\mathrm{min}$ when its temperature is $30^{\\circ} \\mathrm{C}$. The temperature of the surrounding is", "image": null}, "options": [{"id": "SBkGh", "text": "$20^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "fqa65", "text": "$15^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "aiD6m", "text": "$10^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": true}, {"id": "SLWLg", "text": "$5^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Newton's law of cooling,\n$\\begin{array}{ll} \n& \\frac{\\mathrm{R}_1}{\\mathrm{R}_2}=\\frac{\\theta_1-\\theta_0}{\\theta_2-\\theta_0} \\\\\n\\therefore \\quad & \\frac{4}{1}=\\frac{90-\\theta_0}{30-\\theta_0} \\\\\n\\therefore \\quad & 120-90=4 \\theta_0-\\theta_0 \\\\\n\\therefore \\quad & 3 \\theta_0=30\n\\end{array}$\n$\\therefore \\quad$ Temperature of the surroundings is,\n$\\theta_0=10^{\\circ} \\mathrm{C}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262640279619d9d8a3428", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "A sphere and a cube, both of copper have equal volumes and are black. They are allowed to cool at same temperature and in same atmosphere. The ratio of their rate of loss of heat will be", "image": null}, "options": [{"id": "AIFe6", "text": "$1: 1$", "image": null, "isCorrect": false}, {"id": "5reZf", "text": "$\\left(\\frac{\\pi}{6}\\right)^{\\frac{2}{3}}$", "image": null, "isCorrect": false}, {"id": "Vx8F1", "text": "$\\left(\\frac{\\pi}{6}\\right)^{\\frac{1}{3}}$", "image": null, "isCorrect": true}, {"id": "bEvnf", "text": "$\\frac{4 \\pi}{3}: 1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Volumes of the cube and the sphere are equal\n$$\n\\begin{array}{ll}\n\\therefore & \\mathrm{a}^3=\\frac{4}{3} \\pi \\mathrm{r}^3 \\\\\n\\therefore & \\mathrm{a}=\\left(\\frac{4}{3} \\pi \\mathrm{r}^3\\right)^{\\frac{1}{3}}\n\\end{array}\n$$\n\nRate of loss of radiation is proportional to the surface area of the object.\n$$\n\\begin{aligned}\n& \\therefore \\quad \\frac{Q_{\\text {sphere }}}{Q_{\\text {cube }}}=\\frac{4 \\pi \\mathrm{r}^2}{6 \\mathrm{a}^2} \\\\\n& \\therefore \\quad \\frac{\\mathrm{Q}_{\\text {sphere }}}{\\mathrm{Q}_{\\text {cube }}}=\\frac{4 \\pi \\mathrm{r}^2}{6\\left(\\frac{4}{3} \\pi \\mathrm{r}^3\\right)^{\\frac{2}{3}}} \\\\\n& \\therefore \\quad \\frac{\\mathrm{Q}_{\\text {sphere }}}{\\mathrm{Q}_{\\text {cube }}}=\\left(\\frac{\\pi}{6}\\right)^{\\left(\\frac{1}{3}\\right)}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262430279619d9d8a331c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "The temperature gradient in a rod of length $75 \\mathrm{~cm}$ is $40^{\\circ} \\mathrm{C} / \\mathrm{m}$. If the temperature of cooler end of the rod is $10^{\\circ} \\mathrm{C}$, then the temperature of hotter end is", "image": null}, "options": [{"id": "Q1J5e", "text": "$50^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "WGyXZ", "text": "$40^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": true}, {"id": "KYGHy", "text": "$35^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "eTBR6", "text": "$25^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We know\n$$\n\\begin{aligned}\n& \\mathrm{T}_{\\mathrm{g}}=\\frac{\\mathrm{T}_1-\\mathrm{T}_2}{\\mathrm{x}} \\\\\n& \\Rightarrow \\frac{\\mathrm{T}_1-10}{0 \\cdot 75}=40\n\\end{aligned}\n$$\n$\\therefore \\quad$ Temperature of the hotter end is:\n$$\n\\begin{aligned}\n& \\mathrm{T}_1=(40 \\times 0.75)+10 \\\\\n& \\mathrm{~T}_1=40^{\\circ} \\mathrm{C}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2621e0279619d9d8a31ee", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "A composite slab consists of two materials having coefficient of thermal conductivity $K$ and $2 \\mathrm{~K}$, thickness $\\mathrm{x}$ and $4 \\mathrm{x}$ respectively. The temperature of the two outer surfaces of a composite slab are $\\mathrm{T}_2$ and $\\mathrm{T}_1\\left(\\mathrm{~T}_2>\\mathrm{T}_1\\right)$. The rate of heat transfer through the slab in a steady state is $\\left[\\frac{\\mathrm{A}\\left(\\mathrm{T}_2-\\mathrm{T}_1\\right) \\mathrm{K}}{\\mathrm{x}}\\right] \\cdot \\mathrm{f}$ where ' $\\mathrm{f}$ ' is equal to", "image": null}, "options": [{"id": "RxruS", "text": "$1$", "image": null, "isCorrect": false}, {"id": "82k0U", "text": "$\\frac{2}{3}$", "image": null, "isCorrect": false}, {"id": "HkgBS", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "bWBMW", "text": "$\\frac{1}{3}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\begin{array}{ll} \n& \\mathrm{R}_{\\mathrm{eq}}=\\mathrm{R}_1+\\mathrm{R}_2 \\\\\n\\because & \\mathrm{R}_1=\\frac{\\mathrm{x}}{\\mathrm{KA}}, \\mathrm{R}_2=\\frac{4 \\mathrm{x}}{2 \\mathrm{KA}} \\\\\n\\therefore & \\mathrm{R}_{\\mathrm{eq}}=\\frac{\\mathrm{x}}{\\mathrm{KA}}+\\frac{2 \\mathrm{x}}{\\mathrm{KA}}=\\frac{3 \\mathrm{x}}{\\mathrm{KA}}\n\\end{array}\n$$\nRate of heat transfer of composite slab is given by,\n$$\n\\begin{aligned}\n& \\quad \\frac{\\mathrm{dQ}}{\\mathrm{dt}}=\\frac{\\mathrm{T}_2-\\mathrm{T}_1}{\\mathrm{R}_{e \\mathrm{q}}}=\\frac{\\mathrm{KA}\\left(\\mathrm{T}_2-\\mathrm{T}_1\\right)}{3 \\mathrm{x}} \\\\\n& \\therefore \\quad \\mathrm{f}=\\frac{1}{3}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261bc0279619d9d8a2ef0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "The pressure exerted by an ideal gas at a particular temperature is directly proportional to", "image": null}, "options": [{"id": "8CD2q", "text": "the mean speed of the gas molecules.", "image": null, "isCorrect": false}, {"id": "zvZnq", "text": "mean of the square of the speed of the gas molecules.", "image": null, "isCorrect": true}, {"id": "PQqF6", "text": "the square of the mean speed of the gas molecules.", "image": null, "isCorrect": false}, {"id": "eS02I", "text": "the root mean square speed of the gas molecules.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The options given look very similar. Read the options carefully before choosing the right answer.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2604f0279619d9d8a2372", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "Find the value of $-197^{\\circ} \\mathrm{C}$ temperature in Kelvin.", "image": null}, "options": [{"id": "unlWL", "text": "$47 \\mathrm{~K}$", "image": null, "isCorrect": false}, {"id": "fxxjg", "text": "$76 \\mathrm{~K}$", "image": null, "isCorrect": true}, {"id": "WNIWD", "text": "$470 \\mathrm{~K}$", "image": null, "isCorrect": false}, {"id": "yWRx7", "text": "$760 \\mathrm{~K}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\mathrm{T}_{(\\mathrm{K})}=\\mathrm{T}\\left({ }^{\\circ} \\mathrm{C}\\right)+273 \\\\\n& =-197^{\\circ} \\mathrm{C}+273 \\\\\n& =76 \\mathrm{~K}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2604a0279619d9d8a2347", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "Find the value of $-197^{\\circ} \\mathrm{C}$ temperature in Kelvin.", "image": null}, "options": [{"id": "acrxN", "text": "$47 \\mathrm{~K}$", "image": null, "isCorrect": false}, {"id": "D1mNo", "text": "$76 \\mathrm{~K}$", "image": null, "isCorrect": true}, {"id": "581gs", "text": "$470 \\mathrm{~K}$", "image": null, "isCorrect": false}, {"id": "fsiH9", "text": "$760 \\mathrm{~K}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\text { Temperature in kelvin, } \\mathrm{T}=\\mathrm{C}+273=-197+273=76 \\mathrm{~K}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260370279619d9d8a22b1", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "On an imaginary linear scale of temperature (called ' $\\mathrm{W}$ ' scale) the freezing and boiling points of water are $39^{\\circ} \\mathrm{W}$ and $239^{\\circ} \\mathrm{W}$ respectively. The temperature on the new scale corresponding to $39^{\\circ} \\mathrm{C}$ temperature on Celsius scale will be", "image": null}, "options": [{"id": "UxeVY", "text": "$139^{\\circ} \\mathrm{W}$", "image": null, "isCorrect": false}, {"id": "kqf9I", "text": "$78^{\\circ} \\mathrm{W}$", "image": null, "isCorrect": false}, {"id": "akRjK", "text": "$117^{\\circ} \\mathrm{W}$", "image": null, "isCorrect": true}, {"id": "IX2S1", "text": "$200^{\\circ} \\mathrm{W}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In Celsius scale the freezing and boiling point are $0^{\\circ} \\mathrm{C}$ and $100^{\\circ} \\mathrm{C}$. In the given imaginary scale the freezing and boiling points are $39^{\\circ} \\mathrm{W}$ and $239^{\\circ} \\mathrm{W}$. Hence, we can write\n$$\n\\frac{\\mathrm{C}-0}{100}=\\frac{\\mathrm{W}-39}{200}\n$$\nFor $\\mathrm{C}=39^{\\circ}, \\frac{39}{100}=\\frac{\\mathrm{W}-39}{200}$\nSolving, $\\mathrm{W}=117$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a263240279619d9d8a3c52", "title": "Thermal Expansion", "totalQuestions": 40, "questions": [{"_id": "6abb884c15a9fc0fc8c14261", "type": "singleCorrect", "question": {"text": "A sheet of solid material having area $A$ and coefficient of linear expansion $\\alpha$. The mass of sheet is $m$ and specific heat capacity is $s$. If $dQ$ is the amount of heat given to the sheet then change in its area is", "image": null}, "options": [{"id": "Iuyi3", "label": "A", "text": "$\\dfrac{A(2\\alpha)ms}{\\Delta Q}$", "isCorrect": false, "image": null}, {"id": "ESvr5", "label": "B", "text": "$\\dfrac{A(2\\alpha)\\Delta Q}{ms}$", "isCorrect": true, "image": null}, {"id": "ZjbtS", "label": "C", "text": "$\\dfrac{A\\alpha \\Delta Q}{ms}$", "isCorrect": false, "image": null}, {"id": "xnTKz", "label": "D", "text": "$\\dfrac{A\\alpha ms}{\\Delta Q}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The heat supplied to the sheet is given by the relation:<br><br>$\\Delta Q = ms \\Delta T$<br><br>$\\Delta T = \\dfrac{\\Delta Q}{ms}$<br><br>The change in area of the sheet due to thermal expansion is:<br><br>$\\Delta A = A \\beta \\Delta T$<br><br>For an isotropic material, the coefficient of superficial expansion is $\\beta = 2\\alpha$.<br><br>Substituting the values of $\\beta$ and $\\Delta T$, we get:<br><br>$\\Delta A = A(2\\alpha) \\left( \\dfrac{\\Delta Q}{ms} \\right)$<br><br>$\\Delta A = \\dfrac{A(2\\alpha)\\Delta Q}{ms}$<br><br>Answer: $\\dfrac{A(2\\alpha)\\Delta Q}{ms}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88ae15a9fc0fc8c145ff", "type": "singleCorrect", "question": {"text": "An iron tyre is to be fitted on to a wooden wheel $1.0$ m in diameter. The diameter of the tyre is $6$ mm smaller than that of the wheel. The tyre should be heated so that its temperature increases by a minimum of<br>(coefficient of volume expansion of iron = $3.6 \\times 10^{-5}/^\\circ$C)", "image": null}, "options": [{"id": "cDSHD", "label": "A", "text": "$167^\\circ$C", "isCorrect": false, "image": null}, {"id": "OsObw", "label": "B", "text": "$334^\\circ$C", "isCorrect": false, "image": null}, {"id": "IQnt8", "label": "C", "text": "$500^\\circ$C", "isCorrect": true, "image": null}, {"id": "kLQvy", "label": "D", "text": "$1000^\\circ$C", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given the diameter of the wooden wheel, $D = 1.0$ m.<br><br>The required increase in the diameter of the iron tyre to fit the wheel is $\\Delta D = 6$ mm $= 6 \\times 10^{-3}$ m.<br><br>The coefficient of volume expansion of iron is $\\gamma = 3.6 \\times 10^{-5} /^\\circ$C.<br><br>The coefficient of linear expansion is $\\alpha = \\dfrac{\\gamma}{3} = \\dfrac{3.6 \\times 10^{-5}}{3} = 1.2 \\times 10^{-5} /^\\circ$C.<br><br>Using the relation for linear expansion:<br><br>$\\Delta D = D \\alpha \\Delta T$<br><br>Substituting the given values (approximating the initial diameter of the tyre as $1.0$ m):<br><br>$6 \\times 10^{-3} = 1.0 \\times 1.2 \\times 10^{-5} \\times \\Delta T$<br><br>$\\Delta T = \\dfrac{6 \\times 10^{-3}}{1.2 \\times 10^{-5}}$<br><br>$\\Delta T = \\dfrac{600}{1.2} = 500^\\circ$C<br><br>Answer: $500^\\circ$C", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886f15a9fc0fc8c143aa", "type": "singleCorrect", "question": {"text": "A metal rod (A) of length $20$ cm expands by $0.075$ cm when its temperature changes from $0^\\circ$C to $100^\\circ$C. Another metal rod (B) of different metal of same length expands by $0.045$ cm for same temperature change. A third rod of same length is composed of 2 parts, one of metal A and another of metal B. For same temperature change, this rod expands by $0.060$ cm. The portion made of metal A has the length", "image": null}, "options": [{"id": "YIAjA", "label": "A", "text": "$12$ cm", "isCorrect": false, "image": null}, {"id": "Lvcnt", "label": "B", "text": "$10$ cm", "isCorrect": true, "image": null}, {"id": "CMOnX", "label": "C", "text": "$15$ cm", "isCorrect": false, "image": null}, {"id": "Q0nDb", "label": "D", "text": "$18$ cm", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the length of the portion made of metal A be $x$ cm. The length of the portion made of metal B will be $(20 - x)$ cm.<br><br>For rod A of length $20$ cm, the expansion is $\\Delta L_A = \\alpha_A \\times 20 \\times \\Delta T = 0.075$ cm.<br><br>For rod B of length $20$ cm, the expansion is $\\Delta L_B = \\alpha_B \\times 20 \\times \\Delta T = 0.045$ cm.<br><br>For the composite rod, the total expansion is the sum of the expansions of its individual parts:<br><br>$\\Delta L = \\alpha_A x \\Delta T + \\alpha_B (20 - x) \\Delta T = 0.060$ cm.<br><br>Substituting $\\alpha_A \\Delta T = \\dfrac{0.075}{20}$ and $\\alpha_B \\Delta T = \\dfrac{0.045}{20}$:<br><br>$x \\left( \\dfrac{0.075}{20} \\right) + (20 - x) \\left( \\dfrac{0.045}{20} \\right) = 0.060$<br><br>Multiplying the entire equation by $20$:<br><br>$0.075 x + 0.045 (20 - x) = 1.2$<br><br>$0.075 x + 0.9 - 0.045 x = 1.2$<br><br>$0.030 x = 0.3$<br><br>$x = 10$ cm.<br><br>Answer: $10$ cm", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887e15a9fc0fc8c14436", "type": "singleCorrect", "question": {"text": "The coefficient of volume expansion of mercury is $18 \\times 10^{-5}/^\\circ\\text{C}$. A thermometer bulb has volume $10^{-6}\\,\\text{m}^3$ and cross-section of stem is $0.004\\,\\text{cm}^2$. Assuming bulb is filled with mercury at $0^\\circ\\text{C}$ then the mercury column at $100^\\circ\\text{C}$ is", "image": null}, "options": [{"id": "JlM3N", "label": "A", "text": "$18.8$ mm", "isCorrect": false, "image": null}, {"id": "mByxL", "label": "B", "text": "$9.2$ mm", "isCorrect": false, "image": null}, {"id": "ftCA5", "label": "C", "text": "$7.4$ cm", "isCorrect": false, "image": null}, {"id": "dGm4I", "label": "D", "text": "$4.5$ cm", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The increase in the volume of mercury when the temperature is raised from $0^\\circ\\text{C}$ to $100^\\circ\\text{C}$ is given by<br><br>$\\Delta V = V_0 \\gamma \\Delta T$<br><br>Substituting the given values:<br><br>$\\Delta V = 10^{-6} \\times 18 \\times 10^{-5} \\times 100$<br><br>$\\Delta V = 18 \\times 10^{-9} \\text{ m}^3$<br><br>This increased volume of mercury will rise in the stem of the thermometer. Let the length of the mercury column in the stem be $L$. The volume of this column is equal to the increase in volume of the mercury.<br><br>$\\Delta V = A \\times L$<br><br>Given the cross-sectional area of the stem $A = 0.004 \\text{ cm}^2 = 4 \\times 10^{-7} \\text{ m}^2$, we have:<br><br>$L = \\dfrac{\\Delta V}{A}$<br><br>$L = \\dfrac{18 \\times 10^{-9}}{4 \\times 10^{-7}}$<br><br>$L = 4.5 \\times 10^{-2} \\text{ m}$<br><br>$L = 4.5 \\text{ cm}$<br><br>Answer: $4.5$ cm", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88bd15a9fc0fc8c1468c", "type": "singleCorrect", "question": {"text": "What is the change in volume of an iron sphere of volume $400$ cm$^3$, when it is heated from $0^\\circ C$ to $50^\\circ C$ ? ($\\alpha_{iron} = 12 \\times 10^{-6}/{}^\\circ C$)", "image": null}, "options": [{"id": "X7uh4", "label": "A", "text": "$0.36\\,cm^3$", "isCorrect": false, "image": null}, {"id": "gRur8", "label": "B", "text": "$0.18\\,cm^3$", "isCorrect": false, "image": null}, {"id": "hkNJY", "label": "C", "text": "$0.72\\,cm^3$", "isCorrect": true, "image": null}, {"id": "E6PxA", "label": "D", "text": "$0.54\\,cm^3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given initial volume $V_0 = 400 \\text{ cm}^3$<br><br>Change in temperature $\\Delta T = 50^\\circ \\text{C} - 0^\\circ \\text{C} = 50^\\circ \\text{C}$<br><br>Coefficient of linear expansion $\\alpha = 12 \\times 10^{-6} / ^\\circ \\text{C}$<br><br>Coefficient of volume expansion $\\gamma = 3\\alpha = 3 \\times 12 \\times 10^{-6} = 36 \\times 10^{-6} / ^\\circ \\text{C}$<br><br>The change in volume is given by $\\Delta V = V_0 \\gamma \\Delta T$<br><br>Substituting the values:<br><br>$\\Delta V = 400 \\times 36 \\times 10^{-6} \\times 50$<br><br>$\\Delta V = 20000 \\times 36 \\times 10^{-6}$<br><br>$\\Delta V = 0.72 \\text{ cm}^3$<br><br>Answer: $0.72\\,cm^3$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bfbbf9280d7f9932e37", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The length of steel rod is 5 cm longer than the copper rod at all temperatures. The length of the steel and copper rod is respectively (Coefficient of linear expansion for steel and copper is respectively $1.1 \\times 10^{-5} /{ }^{\\circ} \\mathrm{C}$ and $1.7 \\times 10^{-5} /{ }^{\\circ} \\mathrm{C}$ )", "image": null}, "options": [{"id": "jiMDZ", "text": "nearly 15 cm and 10 cm", "image": null, "isCorrect": false}, {"id": "02EU9", "text": "nearly 14 cm and 9 cm", "image": null, "isCorrect": true}, {"id": "7Fs2v", "text": "nearly 12 cm and 7 cm", "image": null, "isCorrect": false}, {"id": "oCObN", "text": "nearly 13 cm and 8 cm", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $L_s$ and $L_c$ be the lengths of the steel and copper rods respectively.<br><br>Given that the difference in their lengths is constant at all temperatures:<br><br>$L_s - L_c = 5$<br><br>For the difference in length to remain constant, the change in length for both rods must be equal for any given temperature change $\\Delta T$.<br><br>$\\Delta L_s = \\Delta L_c$<br><br>$L_s \\alpha_s \\Delta T = L_c \\alpha_c \\Delta T$<br><br>$L_s \\alpha_s = L_c \\alpha_c$<br><br>Substituting the given values of the coefficients of linear expansion:<br><br>$L_s (1.1 \\times 10^{-5}) = L_c (1.7 \\times 10^{-5})$<br><br>$11 L_s = 17 L_c$<br><br>Substituting $L_s = L_c + 5$ into the equation:<br><br>$11 (L_c + 5) = 17 L_c$<br><br>$11 L_c + 55 = 17 L_c$<br><br>$6 L_c = 55$<br><br>$L_c = \\dfrac{55}{6} \\approx 9.17$ cm<br><br>The length of the steel rod is:<br><br>$L_s = L_c + 5 = 9.17 + 5 = 14.17$ cm<br><br>The lengths are nearly 14 cm and 9 cm.<br><br>Answer: nearly 14 cm and 9 cm", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be6bf9280d7f9932d72", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A liquid having coefficient of cubical expansion ' $\\gamma$ ' is kept in a copper vessel having coefficient of linear expansion $\\frac{\\gamma}{3}$. If heat is supplied to the vessel, the original level of the liquid in the vessel will", "image": null}, "options": [{"id": "iKxKE", "text": "remain almost the same.", "image": null, "isCorrect": true}, {"id": "usZLa", "text": "increase.", "image": null, "isCorrect": false}, {"id": "tVn6n", "text": "decrease", "image": null, "isCorrect": false}, {"id": "KMYaQ", "text": "may increase or decrease.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Coefficient of cubical expansion of the liquid, $\\gamma_{L} = \\gamma$<br><br>Coefficient of linear expansion of the copper vessel, $\\alpha = \\dfrac{\\gamma}{3}$<br><br>Coefficient of cubical expansion of the copper vessel, $\\gamma_{V} = 3\\alpha = 3 \\times \\dfrac{\\gamma}{3} = \\gamma$<br><br>The apparent coefficient of cubical expansion of the liquid is given by:<br><br>$\\gamma_{app} = \\gamma_{L} - \\gamma_{V}$<br><br>$\\gamma_{app} = \\gamma - \\gamma = 0$<br><br>Since the apparent expansion of the liquid is zero, the volume of the liquid increases by the exact same amount as the capacity of the vessel. Therefore, the original level of the liquid in the vessel will remain almost the same.<br><br>Answer: remain almost the same.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bc9bf9280d7f9932c61", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The difference in length between two rods $A$ and $B$ is 60 cm at all temperatures. If $\\propto_A=18 \\times 10^{-6} /{ }^{\\circ} \\mathrm{C}$ and $\\propto_B=27 \\times 10^{-6} /{ }^{\\circ} \\mathrm{C}$, then the length of $\\operatorname{rod} A$ and $\\operatorname{rod} B$ at $0^{\\circ} C$ is respectively", "image": null}, "options": [{"id": "RR912", "text": "$\\ell_{\\mathrm{A}}=120 \\mathrm{~cm}, \\ell_{\\mathrm{B}}=60 \\mathrm{~cm}$.", "image": null, "isCorrect": false}, {"id": "6xOnP", "text": "$\\ell_{\\mathrm{A}}=180 \\mathrm{~cm}, \\ell_{\\mathrm{B}}=120 \\mathrm{~cm}$.", "image": null, "isCorrect": true}, {"id": "rD8Qk", "text": "$\\ell_{\\mathrm{A}}=240 \\mathrm{~cm}, \\ell_{\\mathrm{B}}=180 \\mathrm{~cm}$.", "image": null, "isCorrect": false}, {"id": "Au1UG", "text": "$\\ell_{\\mathrm{A}}=270 \\mathrm{~cm}, \\ell_{\\mathrm{B}}=210 \\mathrm{~cm}$.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the lengths of rod A and rod B at $0^{\\circ} \\mathrm{C}$ be $L_A$ and $L_B$ respectively.<br><br>Since the difference in length between the two rods is constant at all temperatures, the change in length for both rods must be equal for any given temperature change $\\Delta T$.<br><br>$\\Delta L_A = \\Delta L_B$<br><br>$L_A \\alpha_A \\Delta T = L_B \\alpha_B \\Delta T$<br><br>$L_A \\alpha_A = L_B \\alpha_B$<br><br>$L_A (18 \\times 10^{-6}) = L_B (27 \\times 10^{-6})$<br><br>$18 L_A = 27 L_B$<br><br>$2 L_A = 3 L_B \\Rightarrow L_A = \\dfrac{3}{2} L_B$<br><br>Given that the difference in length is $60 \\mathrm{~cm}$ and $L_A > L_B$:<br><br>$L_A - L_B = 60$<br><br>Substituting $L_A = \\dfrac{3}{2} L_B$:<br><br>$\\dfrac{3}{2} L_B - L_B = 60$<br><br>$\\dfrac{1}{2} L_B = 60 \\Rightarrow L_B = 120 \\mathrm{~cm}$<br><br>Therefore, $L_A = 120 + 60 = 180 \\mathrm{~cm}$.<br><br>Answer: $\\ell_{\\mathrm{A}}=180 \\mathrm{~cm}, \\ell_{\\mathrm{B}}=120 \\mathrm{~cm}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bb7bf9280d7f9932bcb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The volume of a metal sphere increases by $0.33 \\%$ when its temperature is raised by $50^{\\circ} \\mathrm{C}$. The coefficient of linear expansion of the metal is", "image": null}, "options": [{"id": "Y2yY6", "text": "$2.2 \\times 10^{-5} /{ }^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": true}, {"id": "qgqR6", "text": "$6.6 \\times 10^{-5} /{ }^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "yx6Qe", "text": "$13.2 \\times 10^{-5} /{ }^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "1d6Dl", "text": "$19.8 \\times 10^{-5} /{ }^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The fractional change in volume is given by $\\dfrac{\\Delta V}{V} = 0.33 \\% = 3.3 \\times 10^{-3}$<br><br>The change in temperature is $\\Delta T = 50^{\\circ} \\mathrm{C}$<br><br>The coefficient of volume expansion $\\gamma$ is given by $\\gamma = \\dfrac{\\Delta V}{V \\Delta T}$<br><br>Substituting the given values, $\\gamma = \\dfrac{3.3 \\times 10^{-3}}{50} = 6.6 \\times 10^{-5} /^{\\circ} \\mathrm{C}$<br><br>The relation between the coefficient of linear expansion $\\alpha$ and the coefficient of volume expansion $\\gamma$ is $\\gamma = 3\\alpha$<br><br>$\\alpha = \\dfrac{\\gamma}{3} = \\dfrac{6.6 \\times 10^{-5}}{3} = 2.2 \\times 10^{-5} /^{\\circ} \\mathrm{C}$<br><br>Answer: $2.2 \\times 10^{-5} /{ }^{\\circ} \\mathrm{C}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b88bf9280d7f9932a1f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A thermometer bulb has volume $10^{-6} \\mathrm{~m}^3$ and cross-section of the stem is $0.002 \\mathrm{~cm}^2$. The bulb is filled with mercury at $0^{\\circ} \\mathrm{C}$. If the thermometer reads temperature as $100^{\\circ} \\mathrm{C}$, then the length of mercury column is (coefficient of cubical expansion of mercury $=18 \\times 10^{-5} /{ }^{\\circ} \\mathrm{C}$ )", "image": null}, "options": [{"id": "QBzB5", "text": "90 cm", "image": null, "isCorrect": false}, {"id": "ZCXTn", "text": "9 cm", "image": null, "isCorrect": true}, {"id": "vZ2pW", "text": "9 mm", "image": null, "isCorrect": false}, {"id": "Prjzv", "text": "0.9 mm", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The initial volume of mercury in the bulb is $V_0 = 10^{-6} \\mathrm{~m}^3 = 1 \\mathrm{~cm}^3$.<br><br>The change in temperature is $\\Delta T = 100^{\\circ} \\mathrm{C} - 0^{\\circ} \\mathrm{C} = 100^{\\circ} \\mathrm{C}$.<br><br>The increase in the volume of mercury is given by:<br><br>$\\Delta V = V_0 \\gamma \\Delta T$<br><br>$\\Delta V = 1 \\mathrm{~cm}^3 \\times 18 \\times 10^{-5} /^{\\circ} \\mathrm{C} \\times 100^{\\circ} \\mathrm{C}$<br><br>$\\Delta V = 18 \\times 10^{-3} \\mathrm{~cm}^3$<br><br>This increase in volume corresponds to the volume of the mercury column in the stem. If $L$ is the length of the mercury column and $A$ is the cross-sectional area of the stem, then:<br><br>$\\Delta V = A \\times L$<br><br>Given $A = 0.002 \\mathrm{~cm}^2 = 2 \\times 10^{-3} \\mathrm{~cm}^2$, we can find $L$ as:<br><br>$L = \\dfrac{\\Delta V}{A}$<br><br>$L = \\dfrac{18 \\times 10^{-3} \\mathrm{~cm}^3}{2 \\times 10^{-3} \\mathrm{~cm}^2}$<br><br>$L = 9 \\mathrm{~cm}$<br><br>Answer: 9 cm", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b65bf9280d7f99328cf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The temperature of a body on Kelvin scale is ' x ' K . When it is measured by a Fahrenheit thermometer, it is found to be ' x ' ${ }^{\\circ} \\mathrm{F}$. The value of ' x ' is (nearly)", "image": null}, "options": [{"id": "9Fr0A", "text": "$40$", "image": null, "isCorrect": false}, {"id": "DGwZh", "text": "$313$", "image": null, "isCorrect": false}, {"id": "BVM69", "text": "$574$", "image": null, "isCorrect": true}, {"id": "UGHuj", "text": "$301$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The relation between the Fahrenheit and Kelvin temperature scales is given by:<br><br>$\\dfrac{F - 32}{180} = \\dfrac{K - 273.15}{100}$<br><br>$\\dfrac{F - 32}{9} = \\dfrac{K - 273.15}{5}$<br><br>Given that the temperature has the same numerical value on both scales, we substitute $F = x$ and $K = x$:<br><br>$\\dfrac{x - 32}{9} = \\dfrac{x - 273.15}{5}$<br><br>$5(x - 32) = 9(x - 273.15)$<br><br>$5x - 160 = 9x - 2458.35$<br><br>$4x = 2458.35 - 160$<br><br>$4x = 2298.35$<br><br>$x = \\dfrac{2298.35}{4} = 574.5875$<br><br>The value of $x$ is nearly $574$.<br><br>Answer: $574$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871afcbf9280d7f9932553", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Two rods of different materials have lengths ' $\\ell_1$ ' and ' $\\ell_2$ ' whose coefficient of linear expansions are ' $\\alpha_1$ ' and ' $\\alpha_2$ ' respectively. If the difference between the two lengths is independent of temperature then", "image": null}, "options": [{"id": "OgdqR", "text": "$\\alpha_1^2 \\ell_1=\\alpha_2^2 \\ell_2$", "image": null, "isCorrect": false}, {"id": "SH5vy", "text": "$\\frac{\\ell_1}{\\ell_2}=\\frac{\\alpha_2}{\\alpha_1}$", "image": null, "isCorrect": true}, {"id": "QPzpu", "text": "$\\frac{\\ell_1}{\\ell_2}=\\frac{\\alpha_1}{\\alpha_2}$", "image": null, "isCorrect": false}, {"id": "7HoqK", "text": "$\\ell_1^2 \\alpha_2=\\ell_2^2 \\alpha_1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the initial lengths of the two rods be $\\ell_1$ and $\\ell_2$ at temperature $T$.<br><br>When the temperature is increased by $\\Delta T$, the new lengths are:<br>$\\ell_1' = \\ell_1(1 + \\alpha_1 \\Delta T)$<br>$\\ell_2' = \\ell_2(1 + \\alpha_2 \\Delta T)$<br><br>The difference between their lengths at the new temperature is:<br>$\\ell_1' - \\ell_2' = \\ell_1(1 + \\alpha_1 \\Delta T) - \\ell_2(1 + \\alpha_2 \\Delta T)$<br>$\\ell_1' - \\ell_2' = (\\ell_1 - \\ell_2) + (\\ell_1 \\alpha_1 - \\ell_2 \\alpha_2)\\Delta T$<br><br>For the difference in lengths to be independent of temperature, the change in difference must be zero. Thus, the coefficient of $\\Delta T$ must be zero:<br>$\\ell_1 \\alpha_1 - \\ell_2 \\alpha_2 = 0$<br>$\\ell_1 \\alpha_1 = \\ell_2 \\alpha_2$<br>$\\dfrac{\\ell_1}{\\ell_2} = \\dfrac{\\alpha_2}{\\alpha_1}$<br><br>Answer: $\\frac{\\ell_1}{\\ell_2}=\\frac{\\alpha_2}{\\alpha_1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214420aee93fa0796df3d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "At certain temperature, rod A and $\\operatorname{rod} \\mathrm{B}$ of different materials have lengths $L_A$ and $L_B$ respectively. Their co-efficients of linear expansion are $\\alpha_A$ and $\\alpha_B$ respectively. It is observed that the difference between their lengths remain constant at all temperatures. The ratio $L_A / L_B$ is given by", "image": null}, "options": [{"id": "AsY3W", "text": "$\\frac{\\alpha_A}{\\alpha_B}$", "image": null, "isCorrect": false}, {"id": "aoIFm", "text": "$\\frac{\\alpha_B}{\\alpha_A}$", "image": null, "isCorrect": true}, {"id": "eHJow", "text": "$\\frac{\\alpha_A+\\alpha_B}{\\alpha_A}$", "image": null, "isCorrect": false}, {"id": "iAaHj", "text": "$\\frac{\\alpha_A+\\alpha_B}{\\alpha_B}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the initial lengths of rod A and rod B be $L_A$ and $L_B$ respectively.<br><br>When the temperature is increased by $\\Delta T$, the new lengths are:<br>$L_A' = L_A(1 + \\alpha_A \\Delta T)$<br>$L_B' = L_B(1 + \\alpha_B \\Delta T)$<br><br>Since the difference between their lengths remains constant at all temperatures:<br>$L_A' - L_B' = L_A - L_B$<br><br>Substituting the expressions for $L_A'$ and $L_B'$:<br>$L_A(1 + \\alpha_A \\Delta T) - L_B(1 + \\alpha_B \\Delta T) = L_A - L_B$<br><br>$L_A + L_A \\alpha_A \\Delta T - L_B - L_B \\alpha_B \\Delta T = L_A - L_B$<br><br>$L_A \\alpha_A \\Delta T - L_B \\alpha_B \\Delta T = 0$<br><br>$L_A \\alpha_A = L_B \\alpha_B$<br><br>$\\dfrac{L_A}{L_B} = \\dfrac{\\alpha_B}{\\alpha_A}$<br><br>Answer: $\\frac{\\alpha_B}{\\alpha_A}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792141a0aee93fa0796ddfd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "A cylindrical rod is having temperatures $\\theta_1$ and $\\theta_2$ at its ends. The rate of heat flow is $\\mathrm{Q} / \\mathrm{S}$. All the linear dimensions of the rod are doubled by keeping the temperature constant. The new rate of flow of heat is", "image": null}, "options": [{"id": "43HUt", "text": "4Q", "image": null, "isCorrect": false}, {"id": "yUcJ7", "text": "2 Q", "image": null, "isCorrect": true}, {"id": "nw2yh", "text": "$\\frac{\\mathrm{Q}}{2}$", "image": null, "isCorrect": false}, {"id": "xwOsx", "text": "$\\quad \\frac{\\mathrm{Q}}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The rate of heat flow through a cylindrical rod is given by Fourier's law of heat conduction:<br><br>$H = \\dfrac{KA(\\theta_1 - \\theta_2)}{L}$<br><br>For a cylindrical rod of radius $r$, the cross-sectional area is $A = \\pi r^2$. Thus, the initial rate of heat flow is:<br><br>$Q = \\dfrac{K(\\pi r^2)(\\theta_1 - \\theta_2)}{L}$<br><br>When all linear dimensions of the rod are doubled, the new length becomes $L' = 2L$ and the new radius becomes $r' = 2r$. The new cross-sectional area is:<br><br>$A' = \\pi (2r)^2 = 4\\pi r^2 = 4A$<br><br>The new rate of heat flow $H'$ is:<br><br>$H' = \\dfrac{K(4\\pi r^2)(\\theta_1 - \\theta_2)}{2L}$<br><br>$H' = 2 \\left[ \\dfrac{K(\\pi r^2)(\\theta_1 - \\theta_2)}{L} \\right]$<br><br>$H' = 2Q$<br><br>Answer: 2 Q", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792140a0aee93fa0796dd82", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "A sheet of steel is 40 cm long and 5 cm broad at $0^{\\circ} \\mathrm{C}$. The surface area of the sheet increases by $1.4 \\mathrm{~cm}^2$ at $100^{\\circ} \\mathrm{C}$. Coefficient of linear expansion of steel is", "image": null}, "options": [{"id": "RUBjc", "text": "$1.9 \\times 10^{-5} /{ }^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "38bjq", "text": "$2.4 \\times 10^{-5} /^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "L4KDt", "text": "$3.5 \\times 10^{-5} /{ }^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": true}, {"id": "o5Dfg", "text": "$7 \\times 10^{-5} /{ }^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Initial area of the steel sheet $A = 40 \\times 5 = 200 \\text{ cm}^2$<br><br>Change in area $\\Delta A = 1.4 \\text{ cm}^2$<br><br>Change in temperature $\\Delta T = 100^{\\circ}\\text{C} - 0^{\\circ}\\text{C} = 100^{\\circ}\\text{C}$<br><br>The coefficient of superficial expansion $\\beta$ is given by:<br><br>$\\beta = \\dfrac{\\Delta A}{A \\Delta T}$<br><br>$\\beta = \\dfrac{1.4}{200 \\times 100} = \\dfrac{1.4}{20000} = 7 \\times 10^{-5} /^{\\circ}\\text{C}$<br><br>The coefficient of linear expansion $\\alpha$ is related to $\\beta$ by $\\alpha = \\dfrac{\\beta}{2}$.<br><br>$\\alpha = \\dfrac{7 \\times 10^{-5}}{2} = 3.5 \\times 10^{-5} /^{\\circ}\\text{C}$<br><br>Answer: $3.5 \\times 10^{-5} /{ }^{\\circ} \\mathrm{C}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213f60aee93fa0796dce8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "A metal rod having coefficient of linear expansion $2 \\times 10^{-5} /{ }^{\\circ} \\mathrm{C}$ is 0.75 m long at $45^{\\circ} \\mathrm{C}$. When the temperature rises to $65^{\\circ} \\mathrm{C}$, the increase in length of the rod will be", "image": null}, "options": [{"id": "p86je", "text": "3.0 mm", "image": null, "isCorrect": false}, {"id": "ElikA", "text": "0.75 mm", "image": null, "isCorrect": false}, {"id": "1mgeP", "text": "0.30 mm", "image": null, "isCorrect": true}, {"id": "HJxK1", "text": "0.15 mm", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given:<br>Initial length, $L_1 = 0.75 \\text{ m}$<br>Coefficient of linear expansion, $\\alpha = 2 \\times 10^{-5} /{ }^{\\circ}\\text{C}$<br>Change in temperature, $\\Delta T = 65^{\\circ}\\text{C} - 45^{\\circ}\\text{C} = 20^{\\circ}\\text{C}$<br><br>The increase in length is given by the formula:<br>$\\Delta L = L_1 \\alpha \\Delta T$<br><br>Substituting the values:<br>$\\Delta L = 0.75 \\times 2 \\times 10^{-5} \\times 20$<br>$\\Delta L = 30 \\times 10^{-5} \\text{ m}$<br>$\\Delta L = 3 \\times 10^{-4} \\text{ m}$<br><br>Converting to millimeters ($1 \\text{ m} = 1000 \\text{ mm}$):<br>$\\Delta L = 3 \\times 10^{-4} \\times 10^3 \\text{ mm} = 0.30 \\text{ mm}$<br><br>Answer: 0.30 mm", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e40aee93fa0796dc56", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "Rails of material of steel are laid with gaps to allow for thermal expansion. Each track is 10 m long, when laid at temperature $17^{\\circ} \\mathrm{C}$. The maximum temperature that can be reached is $45^{\\circ} \\mathrm{C}$. The gap to be kept between the two segments of railway track is\r\n$\\left(\\alpha_{\\text {stect }}=1.3 \\times 10^{-5} /{ }^{\\circ} \\mathrm{C}\\right)$", "image": null}, "options": [{"id": "OF2dA", "text": "1.68 mm", "image": null, "isCorrect": false}, {"id": "t9D9E", "text": "3.64 mm", "image": null, "isCorrect": true}, {"id": "v0N0C", "text": "2.06 mm", "image": null, "isCorrect": false}, {"id": "w4I9V", "text": "4.32 mm", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Initial length of the track, $L = 10$ m<br><br>Change in temperature, $\\Delta T = 45^{\\circ}\\text{C} - 17^{\\circ}\\text{C} = 28^{\\circ}\\text{C}$<br><br>Coefficient of linear expansion, $\\alpha = 1.3 \\times 10^{-5} /^{\\circ}\\text{C}$<br><br>The gap to be kept between two segments is equal to the maximum thermal expansion of one track to prevent bending.<br><br>$\\Delta L = L \\alpha \\Delta T$<br><br>$\\Delta L = 10 \\times 1.3 \\times 10^{-5} \\times 28$<br><br>$\\Delta L = 364 \\times 10^{-5}$ m<br><br>$\\Delta L = 3.64 \\times 10^{-3}$ m<br><br>$\\Delta L = 3.64$ mm<br><br>Answer: 3.64 mm", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213950aee93fa0796d9ef", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "At certain temperature, $\\operatorname{rod} \\mathrm{A}$ and $\\operatorname{rod} \\mathrm{B}$ of different materials have lengths $L_A$ and $L_B$ respectively: Their coefficients of linear expansion are $\\alpha_A$ and $\\alpha_B$ respectively. It is observed that the difference between their length's remains constant at all temperatures. The ratio $\\mathrm{L}_{\\mathrm{A}}: \\mathrm{L}_{\\mathrm{B}}$ is given by", "image": null}, "options": [{"id": "CAxJF", "text": "$\\dfrac{\\alpha_A}{\\alpha_B}$", "image": null, "isCorrect": false}, {"id": "xOgi1", "text": "$\\dfrac{\\alpha_B}{\\alpha_A}$", "image": null, "isCorrect": true}, {"id": "5ygVO", "text": "$\\dfrac{\\alpha_A+\\alpha_B}{\\alpha_A}$", "image": null, "isCorrect": false}, {"id": "2IUyl", "text": "$\\dfrac{\\alpha_A+\\alpha_B}{\\alpha_B}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the initial lengths of rod A and rod B be $L_A$ and $L_B$ respectively at a given temperature.<br><br>When the temperature is changed by $\\Delta T$, the new lengths are:<br><br>$L_A' = L_A(1 + \\alpha_A \\Delta T)$<br><br>$L_B' = L_B(1 + \\alpha_B \\Delta T)$<br><br>Given that the difference between their lengths remains constant at all temperatures:<br><br>$L_A' - L_B' = L_A - L_B$<br><br>$L_A(1 + \\alpha_A \\Delta T) - L_B(1 + \\alpha_B \\Delta T) = L_A - L_B$<br><br>$L_A + L_A \\alpha_A \\Delta T - L_B - L_B \\alpha_B \\Delta T = L_A - L_B$<br><br>$L_A \\alpha_A \\Delta T = L_B \\alpha_B \\Delta T$<br><br>$L_A \\alpha_A = L_B \\alpha_B$<br><br>$\\dfrac{L_A}{L_B} = \\dfrac{\\alpha_B}{\\alpha_A}$<br><br>Answer: $\\dfrac{\\alpha_B}{\\alpha_A}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792135c0aee93fa0796d830", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "Two rods, one of copper $(. \\mathrm{Cu})$ and the other of iron ( Fe ) having initial lengths $\\mathrm{L}_1$ and $\\mathrm{L}_2$ respectively are connected together to form a single rod of length $L_1+L_2$. The coefficient of linear expansion of Cu and Fe are $\\alpha_c$ and $\\alpha_i$ respectively. If the length of each rod increases by the same amount when their temperatures are raised by $t^{\\circ} \\mathrm{C}$, then ratio of $\\dfrac{L_1-L_2}{L_1+L_2}$ will be", "image": null}, "options": [{"id": "ZiEJq", "text": "$\\dfrac{\\alpha_i}{\\alpha_c+\\alpha_i}$", "image": null, "isCorrect": false}, {"id": "nt4sF", "text": "$\\dfrac{\\alpha_c}{\\alpha_c+\\alpha_i}$.", "image": null, "isCorrect": false}, {"id": "o6l3G", "text": "$\\dfrac{\\alpha_i-\\alpha_c}{\\alpha_c+\\alpha_i}$", "image": null, "isCorrect": true}, {"id": "yJH4U", "text": "$\\dfrac{\\alpha_c-\\alpha_i}{\\alpha_c+\\alpha_i}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The increase in length of the copper rod is given by $\\Delta L_1 = L_1 \\alpha_c t$.<br><br>The increase in length of the iron rod is given by $\\Delta L_2 = L_2 \\alpha_i t$.<br><br>Given that the length of each rod increases by the same amount, we have $\\Delta L_1 = \\Delta L_2$.<br><br>$L_1 \\alpha_c t = L_2 \\alpha_i t$<br><br>$L_1 \\alpha_c = L_2 \\alpha_i$<br><br>$\\dfrac{L_1}{L_2} = \\dfrac{\\alpha_i}{\\alpha_c}$<br><br>Applying componendo and dividendo, we get:<br><br>$\\dfrac{L_1 - L_2}{L_1 + L_2} = \\dfrac{\\alpha_i - \\alpha_c}{\\alpha_i + \\alpha_c}$<br><br>Answer: $\\dfrac{\\alpha_i-\\alpha_c}{\\alpha_c+\\alpha_i}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213480aee93fa0796d792", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Two rods, one of aluminium and the other of steel, having initial lengths ' $\\mathrm{L}_1$ ' and ' $\\mathrm{L}_2$ ' are connected together to form a single rod of length $\\left(\\mathrm{L}_1+\\mathrm{L}_2\\right)$. The coefficients of linear expansion of aluminium and steel are ' $\\alpha_1$ ' and ' $\\alpha_2$ ' respectively. If the length of each rod increases by the same amount, when their temperatures are raised by ${ }^{\\prime} t^{\\circ} \\mathrm{C}$, then the ratio $\\dfrac{\\mathrm{L}_1}{\\mathrm{~L}_1+\\mathrm{L}_2}$ will be", "image": null}, "options": [{"id": "YcZCu", "text": "$\\dfrac{\\alpha_2}{\\alpha_1}$", "image": null, "isCorrect": false}, {"id": "uHvY9", "text": "$\\dfrac{\\alpha_1}{\\alpha_2}$", "image": null, "isCorrect": false}, {"id": "PAAuH", "text": "$\\dfrac{\\alpha_2}{(\\alpha_1+\\alpha_2)}$", "image": null, "isCorrect": true}, {"id": "orJnl", "text": "$\\dfrac{\\alpha_1}{(\\alpha_1+\\alpha_2)}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The increase in length of the aluminium rod is $\\Delta L_1 = L_1 \\alpha_1 t$<br><br>The increase in length of the steel rod is $\\Delta L_2 = L_2 \\alpha_2 t$<br><br>Given that both rods increase in length by the same amount:<br><br>$\\Delta L_1 = \\Delta L_2$<br><br>$L_1 \\alpha_1 t = L_2 \\alpha_2 t$<br><br>$L_1 \\alpha_1 = L_2 \\alpha_2$<br><br>$\\dfrac{L_2}{L_1} = \\dfrac{\\alpha_1}{\\alpha_2}$<br><br>Adding $1$ to both sides:<br><br>$\\dfrac{L_2}{L_1} + 1 = \\dfrac{\\alpha_1}{\\alpha_2} + 1$<br><br>$\\dfrac{L_1 + L_2}{L_1} = \\dfrac{\\alpha_1 + \\alpha_2}{\\alpha_2}$<br><br>Taking the reciprocal of both sides:<br><br>$\\dfrac{L_1}{L_1 + L_2} = \\dfrac{\\alpha_2}{\\alpha_1 + \\alpha_2}$<br><br>Answer: $\\dfrac{\\alpha_2}{(\\alpha_1+\\alpha_2)}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213220aee93fa0796d669", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "Railway track is made of steel segments separated by small gaps to allow for linear expansion. The segment of track is 10 m long when laid at temperature $17^{\\circ} \\mathrm{C}$. The maximum temperature that can be reached is $45^{\\circ} \\mathrm{C}$. Increase in length of the segment of railway track is ' $x$ ' $\\times 10^{-5} \\mathrm{~m}$. The value of ' $x$ ' is $\\left(\\alpha_{\\text{steel }}=\\right.$ $\\left.1.2 \\times 10^{-5} /{ }^{\\circ} \\mathrm{C}\\right)$", "image": null}, "options": [{"id": "C9nXI", "text": "168", "image": null, "isCorrect": false}, {"id": "kolFS", "text": "204", "image": null, "isCorrect": false}, {"id": "h5nBN", "text": "336", "image": null, "isCorrect": true}, {"id": "tgXDu", "text": "530", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The increase in length of the steel segment is given by the formula for linear expansion:<br><br>$\\Delta L = L_0 \\alpha \\Delta T$<br><br>Substituting the given values:<br><br>$\\Delta L = 10 \\times 1.2 \\times 10^{-5} \\times (45 - 17)$<br><br>$\\Delta L = 12 \\times 10^{-5} \\times 28$<br><br>$\\Delta L = 336 \\times 10^{-5} \\text{ m}$<br><br>Comparing this with the given increase in length $x \\times 10^{-5} \\text{ m}$, we get:<br><br>$x = 336$<br><br>Answer: 336", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262320279619d9d8a3292", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "A monoatomic ideal gas initially at temperature ' $\\mathrm{T}_1$ ' is enclosed in a cylinder fitted with massless, frictionless piston. By releasing the piston suddenly the gas is allowed to expand to adiabatically to a temperature ' $\\mathrm{T}_2$ '. If ' $\\mathrm{L}_1$ ' and ' $\\mathrm{L}_2$ ' are the lengths of the gas columns before and after expansion respectively, then $\\frac{T_2}{T_1}$ is", "image": null}, "options": [{"id": "sh8Mu", "text": "$\\frac{\\mathrm{L}_1}{\\mathrm{~L}_2}$", "image": null, "isCorrect": false}, {"id": "apN14", "text": "$\\frac{\\mathrm{L}_2}{\\mathrm{~L}_1}$", "image": null, "isCorrect": false}, {"id": "L1Pxb", "text": "$\\left(\\frac{L_1}{L_2}\\right)^{2 / 3}$", "image": null, "isCorrect": true}, {"id": "wkH0m", "text": "$\\left(\\frac{\\mathrm{L}_2}{\\mathrm{~L}_1}\\right)^{2 / 3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For an adiabatic process\n$$\n\\begin{aligned}\n& \\mathrm{T}_1 \\mathrm{~V}_1^{\\gamma-1}=\\mathrm{T}_2 \\mathrm{~V}_2^{\\gamma-1} \\\\\n\\therefore \\quad & \\frac{\\mathrm{T}_2}{\\mathrm{~T}_1}=\\left(\\frac{\\mathrm{V}_1}{\\mathrm{~V}_2}\\right)^{\\gamma-1}\n\\end{aligned}\n$$\n\nFor a monoatomic gas, $r=\\frac{5}{3}$\n$$\n\\begin{aligned}\n& \\Rightarrow \\gamma-1=\\frac{5}{3}-1=\\frac{2}{3} \\\\\n& \\mathrm{~V}_1=\\mathrm{AL}_1 \\text { and } \\mathrm{V}_2=\\mathrm{AL}_2 \\\\\n\\therefore \\quad & \\frac{\\mathrm{T}_2}{\\mathrm{~T}_1}=\\left[\\frac{\\mathrm{AL}_1}{\\mathrm{AL}_2}\\right]^{2 / 3}=\\left[\\frac{\\mathrm{L}_1}{\\mathrm{~L}_2}\\right]^{2 / 3} \\\\\n& \\gamma-1=\\frac{2}{3}\n\\end{aligned}\n$$\n\nFor an adiabatic process,\n$$\n\\begin{aligned}\n& \\frac{\\mathrm{T}_2}{\\mathrm{~T}_1}=\\left(\\frac{\\mathrm{V}_1}{\\mathrm{~V}_2}\\right)^{\\gamma-1}=\\left(\\frac{\\mathrm{V}_1}{\\mathrm{~V}_2}\\right)^{\\frac{2}{3}} \\\\\n\\mathrm{~V} & \\propto \\mathrm{L} \\\\\n\\therefore \\quad \\frac{\\mathrm{T}_2}{\\mathrm{~T}_1} & =\\left(\\frac{\\mathrm{L}_1}{\\mathrm{~L}_2}\\right)^{\\frac{2}{3}}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262310279619d9d8a328a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "The volume of a metal block increases by $0.225 \\%$ when its temperature is increased by $30^{\\circ} \\mathrm{C}$. Hence coefficient of linear expansion of the material of metal block is", "image": null}, "options": [{"id": "XRG5M", "text": "$7.5 \\times 10^{-5} /{ }^{\\circ} \\mathrm{C}$.", "image": null, "isCorrect": false}, {"id": "tquQH", "text": "$6.75 \\times 10^{-5} /{ }^{\\circ} \\mathrm{C}$.", "image": null, "isCorrect": false}, {"id": "8cEuu", "text": "$2.5 \\times 10^{-5} /{ }^{\\circ} \\mathrm{C}$.", "image": null, "isCorrect": true}, {"id": "UsRQn", "text": "$1.5 \\times 10^{-5} /{ }^{\\circ} \\mathrm{C}$.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The increase in volume is $\\frac{\\Delta V}{V} \\times 100=0.225$ Change in temperature is $\\Delta \\mathrm{T}=30^{\\circ} \\mathrm{C}$ We know, $\\gamma=3 \\alpha$\n$\\therefore \\quad$ The change in volume is $\\Delta \\mathrm{V}=\\mathrm{V} \\gamma \\Delta \\mathrm{T}$\n$$\n\\begin{array}{ll}\n\\therefore & \\frac{\\Delta V}{\\mathrm{~V}} \\times 100=3 \\alpha \\Delta \\mathrm{T} \\times 100 \\\\\n\\therefore & 0.225=3 \\alpha \\times 30 \\times 100 \\\\\n\\therefore & \\alpha=\\frac{0.225}{3 \\times 30 \\times 100} \\\\\n\\therefore & \\alpha=2.5 \\times 10^{-5} /{ }^{\\circ} \\mathrm{C}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2620c0279619d9d8a315e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "The difference in length between two rods $\\mathrm{A}$ and $\\mathrm{B}$ is $60 \\mathrm{~cm}$ at all temperatures. If $\\alpha_{\\mathrm{A}}=18 \\times 10^{-6} /{ }^{\\circ} \\mathrm{C}$ and $\\beta_{\\mathrm{B}}=27 \\times 10^{-6} /{ }^{\\circ} \\mathrm{C}$, the lengths of the two rods are", "image": null}, "options": [{"id": "Kzm5y", "text": "$l_{\\mathrm{A}}=200 \\mathrm{~cm}, l_{\\mathrm{B}}=140 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "3Gr5p", "text": "$l_{\\mathrm{A}}=180 \\mathrm{~cm}, l_{\\mathrm{B}}=120 \\mathrm{~cm}$", "image": null, "isCorrect": true}, {"id": "wnkd6", "text": "$l_{\\mathrm{A}}=160 \\mathrm{~cm}, l_{\\mathrm{B}}=100 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "bJH2m", "text": "$l_{\\mathrm{A}}=120 \\mathrm{~cm}, l_{\\mathrm{B}}=60 \\mathrm{~cm}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given: $\\Delta l=60 \\mathrm{~cm}, \\alpha_{\\mathrm{A}}=18 \\times 10^{-6} /{ }^{\\circ} \\mathrm{C}$,\n$\\alpha_{\\mathrm{B}}=27 \\times 10^{-6} /{ }^{\\circ} \\mathrm{C}$\n$\\Delta l$ is constant at all temperatures.\nWe know $\\Delta l=l \\alpha \\Delta \\mathrm{t}$\nLet the length of the rods at a temperature $0^{\\circ} \\mathrm{C}$ be $l_{\\mathrm{A}}$ and, $l_{\\mathrm{B}}$\n$\\therefore \\quad$ At temperature $\\mathrm{t}^{\\circ} \\mathrm{C}$\n$\\begin{array}{ll} \n& l_{\\mathrm{A}} a_{\\mathrm{A}} \\mathrm{t}_{\\mathrm{A}}=l_{\\mathrm{B}} a_{\\mathrm{B}} \\mathrm{t}_{\\mathrm{B}} \\\\\n& l_{\\mathrm{A}}(18) \\times 10^{-6}=l_{\\mathrm{B}}(27) \\times 10^{-6}.. (i) \\\\\n& \\Delta l=l_{\\mathrm{A}}-l_{\\mathrm{B}} \\\\\n\\Delta l & =\\frac{3}{2} l_{\\mathrm{B}}-l_{\\mathrm{B}} ..  from (i)\\\\\n& \\Delta l=\\frac{1}{2} l_{\\mathrm{B}} \\\\\n\\therefore \\quad & l_{\\mathrm{B}}=2 \\Delta l \\\\\n\\therefore \\quad & l_{\\mathrm{B}}=2 \\times 60=120 \\mathrm{~cm} \\\\\n\\therefore \\quad & l_{\\mathrm{A}}=\\frac{3}{2} \\times 120=180 \\mathrm{~cm}\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261f60279619d9d8a30b1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "The rate of flow of heat through a metal rod with temperature difference $40^{\\circ} \\mathrm{C}$ is $1600 \\mathrm{cal} / \\mathrm{s}$. The thermal resistance of metal rod in ${ }^{\\circ} \\mathrm{C} \\mathrm{s} / \\mathrm{cal}$ is", "image": null}, "options": [{"id": "ECC5p", "text": "$0.025$", "image": null, "isCorrect": true}, {"id": "lWsT2", "text": "$0.25$", "image": null, "isCorrect": false}, {"id": "HsJum", "text": "$2.5$", "image": null, "isCorrect": false}, {"id": "iy9zR", "text": "$40$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given: rate of flow of heat (conduction rate)\n$$\n\\mathrm{P}_{\\text {cond }}=1600 \\mathrm{cal} / \\mathrm{s}\n$$\n\nThermal resistance,\n$$\n\\begin{aligned}\n& \\mathrm{R}_{\\mathrm{T}}=\\frac{\\Delta \\mathrm{T}}{\\mathrm{P}_{\\text {cond }}} \\\\\n& \\mathrm{R}_{\\mathrm{T}}=\\frac{40}{1600} \\\\\n& \\mathrm{R}_{\\mathrm{T}}=0.025^{\\circ} \\mathrm{Cs} / \\mathrm{cal}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261e30279619d9d8a301f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "A metal rod $2 \\mathrm{~m}$ long increases in length by $1.6 \\mathrm{~mm}$, when heated from $0^{\\circ} \\mathrm{C}$ to $60^{\\circ} \\mathrm{C}$. The coefficient of linear expansion of metal rod is", "image": null}, "options": [{"id": "nYT9n", "text": "$1.33 \\times 10^{-5} /{ }^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": true}, {"id": "gjPaS", "text": "$1.66 \\times 10^{-5} /{ }^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "7xKXX", "text": "$1.33 \\times 10^{-3} /{ }^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "JUX4w", "text": "$1.66 \\times 10^{-3} /{ }^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We know,\nCoefficient of Linear expansion $\\alpha=\\frac{\\mathrm{L}_2-\\mathrm{L}_1}{\\mathrm{~L}_1 \\Delta \\mathrm{T}}... (i)$\nGiven: $\\Delta \\mathrm{T}=60-0=60^{\\circ} \\mathrm{C}$\n$\\mathrm{L}_1=2 \\mathrm{~m}$ and $\\mathrm{L}_2=2.0016$\nSubstituting the given values into (i),\n$\\alpha=\\frac{.0016}{120}=1.33 \\times 10^{-5} /{ }^{\\circ} \\mathrm{C}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261bd0279619d9d8a2efa", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "The side of a copper cube is $1 \\mathrm{~m}$ at $0^{\\circ} \\mathrm{C}$. What will be the change in its volume, when it is heated to $100^{\\circ} \\mathrm{C}$ ? $\\left[\\alpha_{\\text {copper }}=18 \\times 10^{-6} /{ }^{\\circ} \\mathrm{C}\\right]$", "image": null}, "options": [{"id": "A8P0t", "text": "$45 \\times 10^{-4} \\mathrm{~m}^3$", "image": null, "isCorrect": false}, {"id": "i4ExB", "text": "$54 \\times 10^{-4} \\mathrm{~m}^3$", "image": null, "isCorrect": true}, {"id": "7yhYr", "text": "$34 \\times 10^{-4} \\mathrm{~m}^3$", "image": null, "isCorrect": false}, {"id": "lKFoN", "text": "$64 \\times 10^{-4} \\mathrm{~m}^3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In volumetric expansion for a cube, Change in volume $\\Delta \\mathrm{V}=\\mathrm{V} 3 \\alpha \\Delta \\mathrm{T}$\n$\\begin{aligned}\n& \\Delta V=3 \\times 18 \\times 10^{-6} \\times 100 \\\\\n& \\Delta V=54 \\times 10^{-4} \\mathrm{~m}^3\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261bb0279619d9d8a2ee7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "A soap bubble of radius ' $R$ ' is blown. After heating a solution, a second bubble of radius ' $2 \\mathrm{R}$ ' is blown. The work required to blow the $2^{\\text {nd }}$ bubble in comparison to that required for the $1^{\\text {st }}$ bubble is", "image": null}, "options": [{"id": "yHVqr", "text": "exactly double.", "image": null, "isCorrect": false}, {"id": "ewndN", "text": "slightly more than 4 times.", "image": null, "isCorrect": false}, {"id": "3UsBl", "text": "slightly less than 4 times.", "image": null, "isCorrect": true}, {"id": "eCWGt", "text": "slightly less than double.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n\\mathrm{W}_1 & =8 \\pi \\mathrm{R}^2 \\mathrm{~T}_1 \\\\\n\\mathrm{~W}_2 & =8 \\pi(2 \\mathrm{R})^2 \\mathrm{~T}_2=32 \\pi \\mathrm{R}^2 \\mathrm{~T}_2 \\\\\n\\therefore \\quad \\frac{\\mathrm{W}_1}{\\mathrm{~W}_2} & =\\frac{\\mathrm{T}_1}{4 \\mathrm{~T}_2}\n\\end{aligned}$\nWhen $\\mathrm{T}_1=\\mathrm{T}_2, \\mathrm{~W}_2=4 \\mathrm{~W}_1$\nBut as work is done, temperature increases and surface tension decreases.\n$\\therefore \\quad \\mathrm{W}_2 < 4 \\mathrm{~W}_1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261ab0279619d9d8a2e66", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "Two uniform brass rods A and B of length ' $l$ ' and ' $2 l$ ' and their radii ' $2 \\mathrm{r}$ ' and ' $\\mathrm{r}$ ' respectively are heated to same temperature. The ratio of the increase in the volume of $\\operatorname{rod} \\mathrm{A}$ to that of $\\operatorname{rod} \\mathrm{B}$ is", "image": null}, "options": [{"id": "9hSyo", "text": "$1:1$", "image": null, "isCorrect": false}, {"id": "lH2sp", "text": "$1:2$", "image": null, "isCorrect": false}, {"id": "a3jfZ", "t
