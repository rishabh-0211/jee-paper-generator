ext": "$2:1$", "image": null, "isCorrect": true}, {"id": "ZCGbC", "text": "$1:4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the original temperature be $0^{\\circ} \\mathrm{C}$\nVolume of $\\mathrm{A}=\\mathrm{V}_1=l \\times \\pi(2 \\mathrm{r})^2$\nAfter heating, volume of A will become\n$\\begin{aligned}\n& \\mathrm{V}_1^{\\prime}=\\mathrm{V}_1(1+\\gamma \\Delta \\mathrm{T}) \\\\\n& \\frac{\\left(\\mathrm{V}_1^{\\prime}-\\mathrm{V}_1\\right)}{\\mathrm{V}_1}=\\gamma \\Delta \\mathrm{T} \\Rightarrow \\mathrm{V}_1^{\\prime}-\\mathrm{V}_1 \\propto \\mathrm{V}_1\n\\end{aligned}$\nSimilarly for rod B,\n$\\begin{aligned}\n& \\frac{\\left(\\mathrm{V}_2^{\\prime}-\\mathrm{V}_2\\right)}{\\mathrm{V}_2}=\\gamma \\Delta \\mathrm{T} \\Rightarrow \\mathrm{V}_2^{\\prime}-\\mathrm{V}_2 \\propto \\mathrm{V}_2 \\\\\n\\therefore \\quad & \\frac{\\Delta \\mathrm{V}_1}{\\Delta \\mathrm{V}_2}=\\frac{l(2 \\mathrm{r})^2}{2 l \\mathrm{r}^2}=\\frac{2}{1}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261960279619d9d8a2dbf", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "The volume of a metal sphere increases by $0.30 \\%$, when its temperature is raised by $50^{\\circ} \\mathrm{C}$. The coefficient of linear expansion of the metal is", "image": null}, "options": [{"id": "xZpo3", "text": "$6 \\times 10^{-5 /{ }^{\\circ}} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "2ETTI", "text": "$3 \\times 10^{-5 /{ }^{\\circ} \\mathrm{C}}$", "image": null, "isCorrect": false}, {"id": "T8mt3", "text": "$2 \\times 10^{-5 /{ }^{\\circ} \\mathrm{C}}$", "image": null, "isCorrect": true}, {"id": "pgv8N", "text": "$12 \\times 10^{-5 /{ }^{\\circ}} \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Coefficient of linear expansion $\\alpha$ is about one third of the coefficient of volume expansion:\n$\\begin{aligned}\n& \\therefore \\frac{\\Delta V}{V}=(3 \\alpha) \\Delta T \\\\\n& \\Rightarrow 0.003=3 \\alpha\\left(50^{\\circ} \\mathrm{C}\\right) \\\\\n& \\Rightarrow \\alpha=2 \\times 10^{-5} /{ }^{\\circ} \\mathrm{C}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2612b0279619d9d8a2a5d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "What is change in volume of an iron sphere of volume $500 \\mathrm{~cm}^3$, when it is heated from $0^{\\circ} \\mathrm{C}$ to $\\left(\\alpha_{\\text {Iron }}=12 \\times 10^{-6 /{ }^{\\circ}} \\mathrm{C}\\right)$ ?", "image": null}, "options": [{"id": "DUHGH", "text": "$1.8 \\mathrm{~cm}^3$", "image": null, "isCorrect": true}, {"id": "RBSE8", "text": "$2 \\mathrm{~cm}^3$", "image": null, "isCorrect": false}, {"id": "D6JEe", "text": "$1.4 \\mathrm{~cm}^2$", "image": null, "isCorrect": false}, {"id": "Wf9X4", "text": "$3 \\mathrm{~cm}^3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\frac{\\text { Change in Vol. }}{\\text { Original Vol. }}=\\text { Coe. of vol. expansion } \\times \\text { temp change } \\\\ & \\Rightarrow \\Delta V=V \\times\\left(3 \\alpha_{\\text {Iron }}\\right) \\times(\\Delta T) \\\\ & \\Rightarrow \\Delta V=500 \\mathrm{~cm}^3 \\times\\left[3 \\times\\left(12 \\times 10^{-6 /{ }^{\\circ}} \\mathrm{C}\\right)\\right] \\times\\left(100^{\\circ} \\mathrm{C}\\right) \\\\ & \\Delta V=500 \\times 3.6 \\times 10^{-3} \\mathrm{~cm}^3=1.8 \\mathrm{~cm}^3\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260f30279619d9d8a289d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}], "question": {"text": "A clock with iron pendulum keeps correct time at $15^{\\circ} \\mathrm{C}$. If the room temperature is $20^{\\circ} \\mathrm{C}$, the error in second per day will be nearly (coefficient of linear expansion of iron is $\\alpha=1.2 \\times 10^{-5} /{ }^{\\circ} \\mathrm{C}$ )", "image": null}, "options": [{"id": "CUn7t", "text": "$3.1 \\mathrm{~s}$", "image": null, "isCorrect": false}, {"id": "SoA5Y", "text": "$1.3 \\mathrm{~s}$", "image": null, "isCorrect": false}, {"id": "BdXMr", "text": "$6.2 \\mathrm{~s}$", "image": null, "isCorrect": false}, {"id": "rP4sm", "text": "$2.6 \\mathrm{~s}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Time period of the pendulum is, $T=2 \\pi \\sqrt{\\frac{l}{g}}$\n$\\therefore \\Delta T=\\frac{2 \\pi}{\\sqrt{g}} \\times \\frac{\\Delta l}{2 \\sqrt{l}}$\nWe know, $\\frac{\\Delta l}{l}=\\alpha \\Delta \\theta$ the change in length due to thermal expansion.\n$\\therefore \\frac{\\Delta T}{T}=\\frac{1}{2} \\frac{\\Delta l}{l}=\\frac{1}{2} \\alpha \\Delta \\theta$\nGiven, $\\quad \\alpha=1.2 \\times 10^{-5} /{ }^{\\circ} \\mathrm{C}, \\quad g=9.8 \\mathrm{~m} / \\mathrm{s}, \\quad T=86,400 \\mathrm{~s} \\quad$ and $\\Delta T=\\alpha \\Delta \\theta T \\approx 2.6 \\mathrm{sec}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260e00279619d9d8a2803", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}], "question": {"text": "The coefficient of linear expansion of brass and steel rods are $\\alpha_1$ and $\\alpha_2$ respectively. Lengths of brass and steel rods are $l_1$ and $l_2$ respectively. If $\\left(l_2-l_1\\right)$ is maintained same at all temperatures, which one of the following relations is correct?", "image": null}, "options": [{"id": "0Tqf8", "text": "$\\alpha_1 l_2=\\alpha_2 l_1$", "image": null, "isCorrect": false}, {"id": "NtjE0", "text": "$\\alpha_1^2 l_2=\\alpha_2^2 l_1$", "image": null, "isCorrect": false}, {"id": "xKoKJ", "text": "$\\alpha_{12} l_2^2=\\alpha_2 l_1^2$", "image": null, "isCorrect": false}, {"id": "qNy0Q", "text": "$l_1 \\alpha_1=l_2 \\alpha_2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The correct option is (D).\nConcept: Length of a metalic rod at a given temperature is given by,\n$l=l_0(1+\\alpha \\Delta T)$\nwhere, $l_0$ is the initial length, $\\alpha$ the coefficient of linear expansion and $\\Delta T$ the temperature change.\nAt any given temperature the lengths of the brass and steel rods can be written as, $l_b=l_1\\left(1+\\alpha_1 \\Delta T\\right)$ and $l_s=l_2\\left(1+\\alpha_2 \\Delta T\\right)$ respectively.\nTherefore, at difference of length is given by,\n$\\begin{aligned} & l_b-l_s=l_1\\left(1+\\alpha_1 \\Delta T\\right)-l_2\\left(1+\\alpha_2 \\Delta T\\right) \\\\ & \\Rightarrow l_b-l_s=\\left(l_1-l_2\\right)+\\left(\\alpha_1 l_1-l_2 \\alpha_2\\right) \\Delta T\\end{aligned}$\nSince, $l_b-l_{\\mathrm{s}}=l_1-l_2$ as the difference of length remains constant.\nTherefore, $\\left(\\alpha_1 l_1-l_2 \\alpha_2\\right)=0$\nSo, $\\alpha_1 l_1=l_2 \\alpha_2$ is the answer.\nSince, $l_b-l_s=l_1-l_2$ as the difference of length remains constant.\nTherefore, $\\left(\\alpha_1 l_1-l_2 \\alpha_2\\right)=0$ So, $\\alpha_1 l_1=l_2 \\alpha_2$ is the answer.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260a20279619d9d8a2619", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "Two rods of different metals have coefficients of linear expansion ' $\\alpha_1$ ' and ' $\\alpha_2$ ' respectively. Their respective lengths are ' $L_1$ ' and ' $L_2$ '. At all temperatures $\\left(L_2-L_1\\right)$ is same. The correct relation is", "image": null}, "options": [{"id": "xT3Nm", "text": "$\\mathrm{L}_1 \\alpha_1^2=\\mathrm{L}_2 \\alpha_2^2$", "image": null, "isCorrect": false}, {"id": "VHGEW", "text": "$\\mathrm{~L}_1^2 \\alpha_1^2=\\mathrm{L}_2^2 \\alpha_2^2$", "image": null, "isCorrect": false}, {"id": "WFROB", "text": "$\\mathrm{~L}_1 \\alpha_2=\\mathrm{L}_2 \\alpha_1$", "image": null, "isCorrect": false}, {"id": "hb21W", "text": "$\\mathrm{~L}_1 \\alpha_1=\\mathrm{L}_2 \\alpha_2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For same change in temperature the change in length is same for both the rods.\nChange in length $\\Delta \\mathrm{L}=\\mathrm{L} \\alpha \\Delta \\mathrm{T}$\n$$\n\\therefore \\mathrm{L}_1 \\alpha_1 \\Delta \\mathrm{T}=\\mathrm{L}_2 \\alpha_2 \\Delta \\mathrm{T}\n$$\nOr $\\mathrm{L}_1 \\alpha_1=\\mathrm{L}_2 \\alpha_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f8e0279619d9d8a1d70", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "A steel wire of length 'L' and area of cross-section 'A' is suspended from rigid\nsupport. If ' $\\mathrm{Y}^{\\prime}$ is the Young's modulus of material of the wire and ' $\\alpha$ ' is the coefficient of linear expansion, then the increase in tension when temperature\nfalls by $t^{\\circ} \\mathrm{C}$ is", "image": null}, "options": [{"id": "hX525", "text": "$\\frac{\\mathrm{YA}}{\\alpha \\mathrm{t}}$", "image": null, "isCorrect": false}, {"id": "vlvUI", "text": "$\\mathrm{YA} \\alpha \\mathrm{t}$", "image": null, "isCorrect": true}, {"id": "22vJl", "text": "$\\mathrm{Y} \\alpha \\mathrm{t}$", "image": null, "isCorrect": false}, {"id": "vvhw3", "text": "$\\frac{\\mathrm{L} \\alpha \\mathrm{t}}{\\mathrm{Y}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $\\mathrm{F}$ be tension developed in the wire.\n$\\therefore \\quad \\mathrm{Y}=\\frac{\\mathrm{F} / \\mathrm{A}}{\\Delta \\mathrm{L} / \\mathrm{L}}$\nAs $\\Delta \\mathrm{L}=\\mathrm{La} \\Delta \\mathrm{T}$\n$\\therefore \\quad \\mathrm{Y}=\\frac{\\mathrm{F}}{\\mathrm{Aa} \\Delta \\mathrm{T}}$ or $\\quad \\mathrm{F}=\\mathrm{Y} \\mathrm{Aa} \\Delta \\mathrm{T}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f7c0279619d9d8a1cd9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}], "question": {"text": "A metal rod of length $\\mathrm{L}$ and cross-sectional area $\\mathrm{A}$ is heated through $\\mathrm{T}^{\\circ} \\mathrm{C}$. What is the force required to prevent the expansion of the rod lengthwise?\n(Y= Young's modulus of material of the rod, $\\alpha=$ coefficient of linear expansion of\nthe rod.)", "image": null}, "options": [{"id": "DG3dR", "text": "$\\mathrm{YA} \\alpha / \\mathrm{T}(1+\\alpha \\mathrm{T})$", "image": null, "isCorrect": false}, {"id": "fv7ac", "text": "$\\mathrm{YA} \\alpha \\mathrm{T} /(1-\\alpha \\mathrm{T})$", "image": null, "isCorrect": false}, {"id": "CmB4z", "text": "$\\mathrm{YA} \\alpha \\mathrm{T} /(1+\\alpha \\mathrm{T})$", "image": null, "isCorrect": true}, {"id": "MsDIL", "text": "$\\mathrm{YA} \\alpha /(1-\\alpha \\mathrm{T})$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The increase in length due to heating is given by\n$\\mathrm{L}=\\mathrm{L}_{0}(1+\\alpha \\mathrm{T}) \\quad$ or $\\quad \\mathrm{L}-\\mathrm{L}_{0}=\\Delta \\mathrm{L}=\\mathrm{L}_{0} \\alpha \\mathrm{T}$\nTo compress the rod by $\\Delta \\mathrm{L}$, the force required is given by\n$\\mathrm{F}=\\frac{\\mathrm{YA} \\Delta \\mathrm{L}}{\\mathrm{L}}$\nSubstituting the value of $\\mathrm{L}$ and $\\Delta \\mathrm{L}$ we get\n$\\mathrm{F}=\\frac{\\mathrm{YA} \\times \\mathrm{L}_{0} \\alpha \\mathrm{T}}{\\mathrm{L}_{\\mathrm{o}}(1+\\alpha \\mathrm{T})}=\\frac{\\mathrm{YA} \\alpha \\mathrm{T}}{1+\\alpha \\mathrm{T}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f580279619d9d8a1bb5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "A metal rod of Young's modulus 'Y' and coefficient of linear expansion ' $\\propto^{\\prime}$ has its\ntemperature raised by ' $\\Delta \\theta^{\\prime} .$ The linear stress to prevent the expansion of rod is\n(L and $\\ell$ is original length of rod and expansion respectively)", "image": null}, "options": [{"id": "Qo4eA", "text": "$\\mathrm{Y} \\frac{\\mathrm{L}}{\\ell}$", "image": null, "isCorrect": false}, {"id": "hcNBd", "text": "$\\frac{Y \\propto}{\\Delta \\theta}$", "image": null, "isCorrect": false}, {"id": "UhNrz", "text": "$\\mathrm{Y} \\propto \\Delta \\theta$", "image": null, "isCorrect": true}, {"id": "Q3kVl", "text": "$\\mathrm{Y}\\left(\\frac{\\ell}{\\mathrm{L}}\\right)^{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For thermal expansion\n$\\Delta \\mathrm{L}=\\mathrm{L} \\Delta \\theta$\nIf rod is compress by $\\Delta \\mathrm{L}$ then\n$\\begin{aligned}\n\\Delta \\mathrm{L}=& \\frac{\\mathrm{FL}}{\\mathrm{AY}} \\\\\n\\therefore \\frac{\\mathrm{FL}}{\\mathrm{AY}} &=\\mathrm{L} \\propto \\Delta \\theta \\quad \\therefore \\frac{\\mathrm{F}}{\\mathrm{A}}=\\mathrm{Y} \\propto \\Delta \\theta\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f440279619d9d8a1b16", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}], "question": {"text": "A metal rod of cross-sectional area $3 \\times 10^{-6} \\mathrm{~m}^{2}$ is suspended vertically from one\nend has a length $0 \\cdot 4 \\mathrm{~m}$ at $100^{\\circ} \\mathrm{C}$. Now the rod is cooled upto $0^{\\circ} \\mathrm{C}$, but prevented\nfrom contracting by attaching a mass ' $\\mathrm{m}$ ' at the lower end. The value of ' $\\mathrm{m}$ ' is\n$\\left(\\mathrm{Y}=10^{11} \\mathrm{~N} / \\mathrm{m}^{2}\\right.$, coefficient of linear expansion $\\left.=10^{-5} / \\mathrm{K}, \\mathrm{g}=10 \\mathrm{~m} / \\mathrm{s}^{2}\\right)$", "image": null}, "options": [{"id": "0e4Le", "text": "$40 \\mathrm{~kg}$", "image": null, "isCorrect": false}, {"id": "LUVd2", "text": "$20 \\mathrm{~kg}$", "image": null, "isCorrect": false}, {"id": "CgJbd", "text": "$30 \\mathrm{~kg}$", "image": null, "isCorrect": true}, {"id": "GTl9w", "text": "$10 \\mathrm{~kg}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\Delta \\mathrm{L}=\\mathrm{L} \\propto \\Delta \\mathrm{T}=\\frac{\\mathrm{FL}}{\\mathrm{AY}}$\n$\\therefore \\mathrm{F}=\\mathrm{AY} \\propto \\Delta \\mathrm{T}$\n$\\therefore \\mathrm{Mg}=\\mathrm{AY} \\propto \\Delta \\mathrm{T}$\n$\\mathrm{M}=\\frac{\\mathrm{AY} \\propto \\Delta \\mathrm{T}}{\\mathrm{g}}=\\frac{3 \\times 10^{-6} \\times 10^{11} \\times 10^{-5} \\times 100}{10}=30 \\mathrm{~kg}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ee50279619d9d8a1826", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}], "question": {"text": "A clock pendulum having coefficient of linear expansion, <math><mrow><mrow><mi>α</mi><mo>=</mo><mn>9</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>7</mn></mrow></msup></mrow><mo>/</mo><mrow><mmultiscripts><mrow><mi>C</mi></mrow><mprescripts></mprescripts><mrow><mi></mi></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></mmultiscripts></mrow></mrow></math> has a period of <math><mn>0.5</mn><mi></mi><mi mathvariant=\"normal\">s</mi></math> <em>at</em> <math><msup><mrow><mn>20</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mi mathvariant=\"normal\">C</mi><mo>.</mo></math> If the clock is used in a climate where the temperature is <math><msup><mrow><mn>30</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mi mathvariant=\"normal\">C</mi><mo>,</mo></math> <em>how much time does the clock lose in each oscillation?</em> <math><mfenced separators=\"|\"><mrow><mi>g</mi><mo>=</mo><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">t</mi></mrow></mfenced></math>", "image": null}, "options": [{"id": "vGMgU", "text": "<math><mn>2.5</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>7</mn></mrow></msup><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "wYQFi", "text": "<math><mn>5</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>7</mn></mrow></msup><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "e2amG", "text": "<math><mn>1.125</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "3XtHb", "text": "<math><mn>2.25</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math><mo>∵</mo><mfrac><mrow><mi>d</mi><mi>T</mi></mrow><mrow><mi>T</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>∙</mo><mfenced separators=\"|\"><mrow><mi>α</mi><mo>∝</mo><mi mathvariant=\"normal\">d</mi><mi>T</mi></mrow></mfenced></math>  <br/><math><mi>d</mi><mi>T</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced><mfenced separators=\"|\"><mrow><mn>9</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>7</mn></mrow></msup></mrow></mfenced><mfenced separators=\"|\"><mrow><mn>10</mn></mrow></mfenced></math>  <br/><math><mi>d</mi><mi>T</mi><mo>=</mo><mn>2.25</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e730279619d9d8a148a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "With an increase in temperature, surface tension of liquid (except molten copper and cadmium)", "image": null}, "options": [{"id": "gD99Z", "text": "increases", "image": null, "isCorrect": false}, {"id": "AHfs6", "text": "remain same", "image": null, "isCorrect": false}, {"id": "fbzsc", "text": "decreases", "image": null, "isCorrect": true}, {"id": "TXtoO", "text": "first decreases then increases", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The surface tension of liquid decreases with rise of temperature. The surface tension of liquid is zero at its boiling point and it vanishes at critical temperature. $\\quad$ At $\\quad$ critical $\\quad$ temperature intermolecular forces for liquid and gases becomes equal and liquid can expand without any restriction. For small temperature differences, the variation in surface tension with temperature is linear and is given by relation\n$$\nT_{t}=T_{0}(1-\\alpha t)\n$$\nwhere $T_{t}, T_{0}$ are the surface tension at $t^{\\circ} \\mathrm{C}$ and $0^{\\circ} \\mathrm{C}$ respectively and $\\alpha$ is the temperature coefficient of surface tension.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a263240279619d9d8a3c54", "title": "Calorimetry", "totalQuestions": 10, "questions": [{"_id": "6abb88cc15a9fc0fc8c14712", "type": "singleCorrect", "question": {"text": "$540$ gram of ice at $0^\\circ$C is mixed with $540$ gram of water at $90^\\circ$C. The final temperature of the mixture will be [Latent heat of fusion of water = 80 cal/g]", "image": null}, "options": [{"id": "yQpdf", "label": "A", "text": "$10^\\circ$C", "isCorrect": false, "image": null}, {"id": "eV7zA", "label": "B", "text": "$15^\\circ$C", "isCorrect": false, "image": null}, {"id": "F2sjK", "label": "C", "text": "$5^\\circ$C", "isCorrect": true, "image": null}, {"id": "0kuzW", "label": "D", "text": "$30^\\circ$C", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The heat required to completely melt the ice at $0^{\\circ}\\text{C}$ is $Q_1 = m_i L$.<br><br>$Q_1 = 540 \\times 80 = 43200 \\text{ cal}$<br><br>The maximum heat released by the hot water if it cools down to $0^{\\circ}\\text{C}$ is $Q_2 = m_w s \\Delta T$.<br><br>$Q_2 = 540 \\times 1 \\times (90 - 0) = 48600 \\text{ cal}$<br><br>Since $Q_2 > Q_1$, all the ice will melt and the final temperature $T$ of the mixture will be greater than $0^{\\circ}\\text{C}$.<br><br>According to the principle of calorimetry, the heat gained by the ice equals the heat lost by the water.<br><br>$m_i L + m_i s (T - 0) = m_w s (90 - T)$<br><br>$540 \\times 80 + 540 \\times 1 \\times T = 540 \\times 1 \\times (90 - T)$<br><br>Dividing both sides by $540$:<br><br>$80 + T = 90 - T$<br><br>$2T = 10$<br><br>$T = 5^{\\circ}\\text{C}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a78c30a4553e1bdb5b", "type": "singleCorrect", "question": {"text": "A piece of metal of 850 K is dropped into 1 kg of water at 300 K. If equilibrium temperature of water is 350 K then the heat capacity of the metal expressed in $\\dfrac{J}{K}$ is $\\left(\\text{Sp. heat of water} = 1\\ \\dfrac{\\text{cal}}{\\text{g}^\\circ\\text{C}}\\right)$", "image": null}, "options": [{"id": "kaxf1", "label": "A", "text": "$420$", "isCorrect": true, "image": null}, {"id": "AIFPj", "label": "B", "text": "$240$", "isCorrect": false, "image": null}, {"id": "OVo5J", "label": "C", "text": "$100$", "isCorrect": false, "image": null}, {"id": "X8CjK", "label": "D", "text": "$24$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to the principle of calorimetry, heat lost by the metal is equal to the heat gained by the water.<br><br>Heat gained by water is $Q = m_w s_w \\Delta T_w$<br><br>Given mass of water $m_w = 1\\text{ kg} = 1000\\text{ g}$<br><br>Specific heat of water $s_w = 1\\text{ cal/g}^\\circ\\text{C} = 4.2\\text{ J/g}^\\circ\\text{C}$<br><br>Change in temperature of water $\\Delta T_w = 350 - 300 = 50\\text{ K}$<br><br>$Q = 1000 \\times 4.2 \\times 50 = 210000\\text{ J}$<br><br>Heat lost by the metal is $Q = C \\Delta T_m$<br><br>Change in temperature of the metal $\\Delta T_m = 850 - 350 = 500\\text{ K}$<br><br>Equating the heat lost to the heat gained:<br><br>$C \\times 500 = 210000$<br><br>$C = \\dfrac{210000}{500} = 420\\text{ J/K}$<br><br>Answer: $420$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3068c30a4553e1bdf54", "type": "singleCorrect", "question": {"text": "$15$ g of ice at $0^\\circ\\text{C}$ is added to a vessel containing water at $40^\\circ\\text{C}$. The mass of water and water equivalent of the vessel is $60$ g. Assuming that negligible heat is taken from the surroundings, the final temperature of the mixture will be<br>[ $L_{\\text{ice}} = 80\\,\\text{cal/g}$ , $S_{\\text{water}} = 1\\,\\text{cal/g}$ ]", "image": null}, "options": [{"id": "XI2XJ", "label": "A", "text": "$30^\\circ\\text{C}$", "isCorrect": false, "image": null}, {"id": "wwSTV", "label": "B", "text": "$22^\\circ\\text{C}$", "isCorrect": false, "image": null}, {"id": "Cn7YQ", "label": "C", "text": "$16^\\circ\\text{C}$", "isCorrect": true, "image": null}, {"id": "o8UMu", "label": "D", "text": "$10^\\circ\\text{C}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the final temperature of the mixture be $T^\\circ\\text{C}$.<br><br>According to the principle of calorimetry, heat lost by the water and vessel equals the heat gained by the ice.<br><br>Heat lost by water and vessel = $m_{\\text{water}} S_{\\text{water}} (40 - T)$<br><br>Heat gained by ice = $m_{\\text{ice}} L_{\\text{ice}} + m_{\\text{ice}} S_{\\text{water}} (T - 0)$<br><br>Equating the two:<br><br>$60 \\times 1 \\times (40 - T) = 15 \\times 80 + 15 \\times 1 \\times T$<br><br>$2400 - 60T = 1200 + 15T$<br><br>$75T = 1200$<br><br>$T = \\dfrac{1200}{75} = 16^\\circ\\text{C}$<br><br>Answer: $16^\\circ\\text{C}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bd8bf9280d7f9932cf1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A calorimeter contains 10 g of water at $20^{\\circ} \\mathrm{C}$. The temperature fall to $15^{\\circ} \\mathrm{C}$ in 10 min . When calorimeter contains 20 g of water at $20^{\\circ} \\mathrm{C}$, it takes 15 min . for the temperature to become $15^{\\circ} \\mathrm{C}$. The water equivalent at the calorimeter is", "image": null}, "options": [{"id": "fOt3S", "text": "50 g", "image": null, "isCorrect": false}, {"id": "Ep4fR", "text": "25 g", "image": null, "isCorrect": false}, {"id": "rQXGl", "text": "10 g", "image": null, "isCorrect": true}, {"id": "bx3Go", "text": "5 g", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $W$ be the water equivalent of the calorimeter.<br><br>According to Newton's law of cooling, the rate of heat loss depends only on the temperature difference between the body and the surroundings. Since the temperature falls from $20^{\\circ} \\mathrm{C}$ to $15^{\\circ} \\mathrm{C}$ in both cases, the average rate of heat loss is the same.<br><br>Heat lost in the first case:<br>$Q_1 = (m_1 + W) c \\Delta \\theta = (10 + W) c (20 - 15) = 5(10 + W) c$<br><br>Rate of heat loss in the first case:<br>$R_1 = \\dfrac{Q_1}{t_1} = \\dfrac{5(10 + W) c}{10} = \\dfrac{(10 + W) c}{2}$<br><br>Heat lost in the second case:<br>$Q_2 = (m_2 + W) c \\Delta \\theta = (20 + W) c (20 - 15) = 5(20 + W) c$<br><br>Rate of heat loss in the second case:<br>$R_2 = \\dfrac{Q_2}{t_2} = \\dfrac{5(20 + W) c}{15} = \\dfrac{(20 + W) c}{3}$<br><br>Equating the rates of heat loss ($R_1 = R_2$):<br>$\\dfrac{(10 + W) c}{2} = \\dfrac{(20 + W) c}{3}$<br><br>$3(10 + W) = 2(20 + W)$<br><br>$30 + 3W = 40 + 2W$<br><br>$W = 10 \\text{ g}$<br><br>Answer: 10 g", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b95bf9280d7f9932a9c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A stationary object at $4^{\\circ} \\mathrm{C}$ and weighing 3.5 kg falls from a height of 2000 m on snow mountain at $0^{\\circ} \\mathrm{C}$. If the temperature of the object just before hitting the snow is $0^{\\circ} \\mathrm{C}$ and the object comes to rest immediately then the quantity of ice that melts is\n(Acceleration due to gravity $=10 \\mathrm{~m} / \\mathrm{s}^2$, Latent heat of ice $\\left.=3.5 \\times 10^5 \\mathrm{~J} / \\mathrm{kg}\\right)$", "image": null}, "options": [{"id": "c7LwG", "text": "2 gram", "image": null, "isCorrect": false}, {"id": "v1NuU", "text": "20 gram", "image": null, "isCorrect": false}, {"id": "7Q9DD", "text": "200 gram", "image": null, "isCorrect": true}, {"id": "Xv9BR", "text": "2 kg", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The potential energy of the object at a height $h$ is converted into kinetic energy just before it hits the snow. Upon impact, this kinetic energy is entirely converted into heat energy which melts the ice.<br><br>The potential energy of the object is given by:<br>$E = mgh$<br><br>Substituting the given values:<br>$E = 3.5 \\times 10 \\times 2000 = 70000 \\text{ J}$<br><br>Since the object's temperature just before hitting the snow is $0^{\\circ}\\text{C}$, it does not release any additional heat due to a change in its own temperature. The heat $Q$ produced upon impact is equal to the mechanical energy lost:<br>$Q = 70000 \\text{ J}$<br><br>Let $M$ be the mass of the ice that melts. The heat required to melt the ice is:<br>$Q = M \\times L$<br><br>Substituting the values of $Q$ and the latent heat of ice $L$:<br>$70000 = M \\times 3.5 \\times 10^5$<br><br>$M = \\dfrac{70000}{3.5 \\times 10^5} = \\dfrac{7 \\times 10^4}{35 \\times 10^4} = \\dfrac{1}{5} \\text{ kg}$<br><br>Converting the mass into grams:<br>$M = 0.2 \\text{ kg} = 200 \\text{ g}$<br><br>Answer: 200 gram", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213820aee93fa0796d952", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "A lead bullet moving with velocity ' $v$ ' strikes a wall and stops. If $50 \\%$ of its energy is converted into heat, then the increase in temperature is ( $\\mathrm{s}=$ specific heat of lead)", "image": null}, "options": [{"id": "p6EUa", "text": "$\\dfrac{v^2 s}{2 J}$", "image": null, "isCorrect": false}, {"id": "7i7eN", "text": "$\\dfrac{\\mathrm{v}^2}{4 \\mathrm{~sJ}}$", "image": null, "isCorrect": true}, {"id": "ugpx4", "text": "$\\dfrac{\\mathrm{v}^2 \\mathrm{~s}}{\\mathrm{~J}}$", "image": null, "isCorrect": false}, {"id": "yAjeJ", "text": "$\\dfrac{2 \\mathrm{v}^2}{\\mathrm{~Js}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The initial kinetic energy of the bullet is given by $K = \\dfrac{1}{2}mv^2$.<br><br>Since $50\\%$ of its kinetic energy is converted into heat, the mechanical energy converted into heat is:<br><br>$W = \\dfrac{50}{100} \\times \\dfrac{1}{2}mv^2 = \\dfrac{1}{4}mv^2$<br><br>The heat energy required to raise the temperature of the bullet by $\\Delta T$ is $Q = ms\\Delta T$.<br><br>Using the mechanical equivalent of heat $W = JQ$, we get:<br><br>$\\dfrac{1}{4}mv^2 = J(ms\\Delta T)$<br><br>$\\Delta T = \\dfrac{v^2}{4sJ}$<br><br>Answer: $\\dfrac{\\mathrm{v}^2}{4 \\mathrm{~sJ}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792136f0aee93fa0796d8c1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "Two rods of same length & material transfer a given amount of heat in 12 s when they are joined end to end. But when they are joined length wise parallel to each other they will transfer same amount of heat in same condition in time", "image": null}, "options": [{"id": "f46JF", "text": "24 s", "image": null, "isCorrect": false}, {"id": "k02mJ", "text": "3 s", "image": null, "isCorrect": true}, {"id": "FSX8Z", "text": "1.5 s", "image": null, "isCorrect": false}, {"id": "9U2rI", "text": "48 s", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the thermal resistance of each rod be $R$.<br><br>When the rods are joined end to end (in series), the equivalent thermal resistance is $R_s = R + R = 2R$.<br><br>The time taken to transfer a given amount of heat $Q$ under a temperature difference $\\Delta T$ is given by $t_s = \\dfrac{Q \\cdot R_s}{\\Delta T} = \\dfrac{Q(2R)}{\\Delta T} = 12$ s.<br><br>When the rods are joined lengthwise parallel to each other, the equivalent thermal resistance is $R_p = \\dfrac{R \\cdot R}{R + R} = \\dfrac{R}{2}$.<br><br>The time taken to transfer the same amount of heat $Q$ under the same conditions is $t_p = \\dfrac{Q \\cdot R_p}{\\Delta T} = \\dfrac{Q(R/2)}{\\Delta T}$.<br><br>Taking the ratio of the times:<br><br>$\\dfrac{t_p}{t_s} = \\dfrac{R_p}{R_s} = \\dfrac{R/2}{2R} = \\dfrac{1}{4}$<br><br>$t_p = \\dfrac{t_s}{4} = \\dfrac{12}{4} = 3$ s.<br><br>Answer: 3 s", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792135b0aee93fa0796d823", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "A monoatomic gas is heated at constant pressure. The percentage of total heat used for doing external work is", "image": null}, "options": [{"id": "jNYI2", "text": "$30 \\%$", "image": null, "isCorrect": false}, {"id": "BBvzw", "text": "$40 \\%$", "image": null, "isCorrect": true}, {"id": "TNbgh", "text": "$50 \\%$", "image": null, "isCorrect": false}, {"id": "Bii01", "text": "$60 \\%$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a monoatomic gas, the molar heat capacity at constant pressure is $C_P = \\dfrac{5}{2}R$.<br><br>The total heat supplied at constant pressure is $\\Delta Q = nC_P\\Delta T = \\dfrac{5}{2}nR\\Delta T$.<br><br>The external work done by the gas is $\\Delta W = P\\Delta V = nR\\Delta T$.<br><br>The fraction of total heat used for doing external work is $\\dfrac{\\Delta W}{\\Delta Q} = \\dfrac{nR\\Delta T}{\\dfrac{5}{2}nR\\Delta T} = \\dfrac{2}{5}$.<br><br>Percentage of heat used for external work $= \\dfrac{2}{5} \\times 100\\% = 40\\%$.<br><br>Answer: $40 \\%$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262680279619d9d8a3444", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "A sphere, a cube and a thin circular plate all made of same material and having the same mass are heated to same temperature of $200^{\\circ} \\mathrm{C}$. When these are left in a room.", "image": null}, "options": [{"id": "DnYBg", "text": "the sphere reaches room temperature fast", "image": null, "isCorrect": false}, {"id": "8L3Ep", "text": "the cube reaches room temperature fast", "image": null, "isCorrect": false}, {"id": "fV14O", "text": "the circular plate reaches room temperature fast", "image": null, "isCorrect": true}, {"id": "uwuqR", "text": "all will reach the room temperature simultaneously", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\rho=\\frac{M}{V} \\text {; }\n$$\n\nGiven: three objects are' of same materials $\\rho$ is same. Also, $\\mathrm{M}=$ same,\n$\\therefore \\quad$ volume of objects is samé.\nFor constant volume, amongst the given objects surface area of the plate is maximum.\nHence according to Stefan's law $\\frac{\\mathrm{dQ}}{\\mathrm{dt}} \\propto \\mathrm{AT}^4$\nAs $A_{\\text {plate }}$ is maximum, the plate will cool fastest and reaches room temeperature fast.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261870279619d9d8a2d4b", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "$22 \\mathrm{~g}$ of carbon dioxide at $27^{\\circ} \\mathrm{C}$ is mixed in closed container with $16 \\mathrm{~g}$ of oxygen at $37^{\\circ} \\mathrm{C}$. If both gases are considered as ideal gases, then the temperature of the mixture is nearly", "image": null}, "options": [{"id": "Eyeqx", "text": "$22.2^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "D5gEm", "text": "$33.5^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "snsTs", "text": "$31.5^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": true}, {"id": "Oibxb", "text": "$28.5^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $T^{\\circ} \\mathrm{C}$ be the temperature of the mixture.\nheat given by $\\mathrm{O}_2=$ heat absorbed by $\\mathrm{CO}_2$\n$\\begin{aligned} & \\Rightarrow \\mu_1 C_{V_1} \\Delta T=\\mu_2 C_{V_2} \\Delta T \\\\ & \\Rightarrow \\frac{22}{44}(3 R)(T-27)=\\frac{16}{32}\\left(\\frac{5}{2} R\\right)(37-T) \\\\ & \\Rightarrow 3(T-27)=\\frac{5}{2}(37-T) \\\\ & \\Rightarrow 6 T-162=185-5 T \\\\ & \\Rightarrow 11 T=347 \\\\ & \\Rightarrow T=31.5 \\circ \\mathrm{C}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "65a263240279619d9d8a3c4f", "title": "Conduction", "totalQuestions": 31, "questions": [{"_id": "6abb885b15a9fc0fc8c142e9", "type": "singleCorrect", "question": {"text": "Two rods A and B are of equal lengths. Their ends are kept between the same temperatures and their area cross-sections are $A_1$ and $A_2$, thermal conductivities are $K_1$ and $K_2$. The rate of heat transmission in the two rods will be equal if", "image": null}, "options": [{"id": "dUhHA", "label": "A", "text": "$K_1 A_2 = K_2 A_1$", "isCorrect": false, "image": null}, {"id": "XmmqJ", "label": "B", "text": "$K_1 A_1 = K_2 A_2$", "isCorrect": true, "image": null}, {"id": "p9CqN", "label": "C", "text": "$K_1 A_1^2 = K_2 A_2^2$", "isCorrect": false, "image": null}, {"id": "AQBBo", "label": "D", "text": "$K_1 = K_2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The rate of heat transmission through a rod is given by $H = \\dfrac{K A \\Delta T}{L}$, where $K$ is the thermal conductivity, $A$ is the area of cross-section, $\\Delta T$ is the temperature difference, and $L$ is the length of the rod.<br><br>For rod A, the rate of heat transmission is $H_1 = \\dfrac{K_1 A_1 \\Delta T}{L}$.<br><br>For rod B, the rate of heat transmission is $H_2 = \\dfrac{K_2 A_2 \\Delta T}{L}$.<br><br>Given that the rate of heat transmission is equal for both rods, $H_1 = H_2$.<br><br>$\\dfrac{K_1 A_1 \\Delta T}{L} = \\dfrac{K_2 A_2 \\Delta T}{L}$<br><br>Since the lengths and temperature differences are the same, they cancel out, giving $K_1 A_1 = K_2 A_2$.<br><br>Answer: $K_1 A_1 = K_2 A_2$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb882a15a9fc0fc8c14128", "type": "singleCorrect", "question": {"text": "Three rods made of the same material and the same cross-sectional areas have been joined as shown in the figure. Each rod is of the same length. The temperature of the junction is<br><img style=\"width: 300px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/may/watermarked_images/12_may_shift_1__q6_d1.png\" />", "image": null}, "options": [{"id": "1wMbp", "label": "A", "text": "$60^\\circ\\text{C}$", "isCorrect": true, "image": null}, {"id": "6YeZV", "label": "B", "text": "$45^\\circ\\text{C}$", "isCorrect": false, "image": null}, {"id": "Va3ZK", "label": "C", "text": "$30^\\circ\\text{C}$", "isCorrect": false, "image": null}, {"id": "748up", "label": "D", "text": "$20^\\circ\\text{C}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the temperature of the junction be $T$.<br><br>In steady state, the net heat current at the junction is zero. Let $R$ be the thermal resistance of each rod. Since all three rods have the same material, length, and cross-sectional area, their thermal resistances are equal ($R = \\dfrac{L}{kA}$).<br><br>Applying the principle of continuity of heat flow at the junction:<br><br>$\\dfrac{T - 0}{R} + \\dfrac{T - 90}{R} + \\dfrac{T - 90}{R} = 0$<br><br>Multiplying by $R$ on both sides, we get:<br><br>$T + (T - 90) + (T - 90) = 0$<br><br>$3T - 180 = 0$<br><br>$3T = 180$<br><br>$T = 60^\\circ\\text{C}$<br><br>Answer: $60^\\circ\\text{C}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d34c8c30a4553e1be243", "type": "singleCorrect", "question": {"text": "Two rods of same length, radius and material transfer a given amount of heat in 't' second when they are joined as shown in fig (1). But when they are joined as shown in fig (2) then they will transfer same heat in same condition in time<br><img style=\"width: 300px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/19_april_shift_1__q7_d1.png\" />", "image": null}, "options": [{"id": "z2nKJ", "label": "A", "text": "$2t$", "isCorrect": false, "image": null}, {"id": "8NXl7", "label": "B", "text": "$3t$", "isCorrect": false, "image": null}, {"id": "1WAts", "label": "C", "text": "$4t$", "isCorrect": true, "image": null}, {"id": "CqPGk", "label": "D", "text": "$6t$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the thermal resistance of each rod be $R$.<br><br>In figure (1), the two rods are connected in parallel. The equivalent thermal resistance is:<br>$R_p = \\dfrac{R \\times R}{R + R} = \\dfrac{R}{2}$<br><br>The amount of heat transferred in time $t$ is:<br>$Q = \\dfrac{\\Delta T}{R_p} t = \\dfrac{2 \\Delta T}{R} t$<br><br>In figure (2), the two rods are connected in series. The equivalent thermal resistance is:<br>$R_s = R + R = 2R$<br><br>Let the time taken to transfer the same amount of heat $Q$ under the same temperature difference $\\Delta T$ be $t'$. Then:<br>$Q = \\dfrac{\\Delta T}{R_s} t' = \\dfrac{\\Delta T}{2R} t'$<br><br>Equating the two expressions for $Q$:<br>$\\dfrac{2 \\Delta T}{R} t = \\dfrac{\\Delta T}{2R} t'$<br><br>$2t = \\dfrac{t'}{2}$<br><br>$t' = 4t$<br><br>Answer: $4t$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3218c30a4553e1be081", "type": "singleCorrect", "question": {"text": "The ratio of thermal conductivity of two rods of different materials is $4:3$. The two rods have same area of cross-section and same thermal resistance. The lengths of rods are in the ratio", "image": null}, "options": [{"id": "z45PX", "label": "A", "text": "$5 : 4$", "isCorrect": false, "image": null}, {"id": "uqjZN", "label": "B", "text": "$4 : 3$", "isCorrect": true, "image": null}, {"id": "3BrBz", "label": "C", "text": "$1 : 5$", "isCorrect": false, "image": null}, {"id": "p7vgG", "label": "D", "text": "$7 : 1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Thermal resistance is given by $R = \\dfrac{L}{KA}$.<br><br>Given that the thermal resistances are equal ($R_1 = R_2$) and the areas of cross-section are equal ($A_1 = A_2$), we have:<br><br>$\\dfrac{L_1}{K_1 A} = \\dfrac{L_2}{K_2 A}$<br><br>$\\dfrac{L_1}{L_2} = \\dfrac{K_1}{K_2}$<br><br>Given the ratio of thermal conductivities $K_1 : K_2 = 4 : 3$, we get:<br><br>$\\dfrac{L_1}{L_2} = \\dfrac{4}{3}$<br><br>The lengths of the rods are in the ratio $4 : 3$.<br><br>Answer: $4 : 3$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d33e8c30a4553e1be1ad", "type": "singleCorrect", "question": {"text": "In a composite slab there are two materials having coefficients of thermal conductivity K and 2K, thickness x and 4x repectively. The temperature of the two outer surfaces of a composite slab are $T_2$ and $T_1$ $(T_2 > T_1)$. $T_2$ is on side K and $T_1$ is on side 2K. The rate of heat transfer through the slab in a steady state is $\\left[\\dfrac{A(T_2 - T_1)K}{x}\\right] \\cdot f$, where f is equal to", "image": null}, "options": [{"id": "GDxZ4", "label": "A", "text": "$1$", "isCorrect": false, "image": null}, {"id": "gVci9", "label": "B", "text": "$\\dfrac{1}{2}$", "isCorrect": false, "image": null}, {"id": "uMLs8", "label": "C", "text": "$\\dfrac{2}{3}$", "isCorrect": false, "image": null}, {"id": "rqdjD", "label": "D", "text": "$\\dfrac{1}{3}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The thermal resistance of a slab is given by $R = \\dfrac{L}{KA}$, where $L$ is the thickness, $K$ is the thermal conductivity, and $A$ is the area of cross-section.<br><br>For the first material, the thermal resistance is $R_1 = \\dfrac{x}{KA}$.<br><br>For the second material, the thermal resistance is $R_2 = \\dfrac{4x}{2KA} = \\dfrac{2x}{KA}$.<br><br>Since the two materials form a composite slab in series, the equivalent thermal resistance is:<br><br>$R_{eq} = R_1 + R_2 = \\dfrac{x}{KA} + \\dfrac{2x}{KA} = \\dfrac{3x}{KA}$<br><br>The rate of heat transfer through the slab in a steady state is given by:<br><br>$H = \\dfrac{T_2 - T_1}{R_{eq}} = \\dfrac{T_2 - T_1}{\\dfrac{3x}{KA}} = \\dfrac{KA(T_2 - T_1)}{3x}$<br><br>This can be rewritten as:<br><br>$H = \\left[\\dfrac{A(T_2 - T_1)K}{x}\\right] \\cdot \\dfrac{1}{3}$<br><br>Comparing this with the given expression $H = \\left[\\dfrac{A(T_2 - T_1)K}{x}\\right] \\cdot f$, we get:<br><br>$f = \\dfrac{1}{3}$<br><br>Answer: $\\dfrac{1}{3}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c08c30a4553e1bdc67", "type": "singleCorrect", "question": {"text": "Consider two rods 1 and 2 of same length. They have different specific heats $(C_1, C_2)$, thermal conductivities $(K_1, K_2)$ and area of cross-section $(A_1, A_2)$ respectively. Both the rods have temperatures $(T_1, T_2)$ at their ends. If their rate of loss of heat due to conduction is equal, then", "image": null}, "options": [{"id": "bW53O", "label": "A", "text": "$A_1 K_2 = A_2 K_1$", "isCorrect": false, "image": null}, {"id": "UjfUs", "label": "B", "text": "$A_1 K_1 = A_2 K_2$", "isCorrect": true, "image": null}, {"id": "fHpMV", "label": "C", "text": "$\\dfrac{A_1 K_1}{C_1} = \\dfrac{A_2 K_2}{C_2}$", "isCorrect": false, "image": null}, {"id": "DUVkW", "label": "D", "text": "$\\dfrac{A_1 K_2}{C_1} = \\dfrac{A_2 K_1}{C_2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The rate of heat flow (or rate of loss of heat due to conduction) through a rod is given by Fourier's law of heat conduction:<br><br>$\\dfrac{dQ}{dt} = \\dfrac{KA(T_1 - T_2)}{L}$<br><br>For the first rod, the rate of heat flow is:<br><br>$\\left(\\dfrac{dQ}{dt}\\right)_1 = \\dfrac{K_1 A_1 (T_1 - T_2)}{L}$<br><br>For the second rod, the rate of heat flow is:<br><br>$\\left(\\dfrac{dQ}{dt}\\right)_2 = \\dfrac{K_2 A_2 (T_1 - T_2)}{L}$<br><br>It is given that the rate of loss of heat due to conduction is equal for both rods. Equating the two rates:<br><br>$\\dfrac{K_1 A_1 (T_1 - T_2)}{L} = \\dfrac{K_2 A_2 (T_1 - T_2)}{L}$<br><br>Since the length $L$ and the temperature difference $(T_1 - T_2)$ are the same for both rods, they cancel out from both sides:<br><br>$K_1 A_1 = K_2 A_2$<br><br>Specific heat is not involved in the steady-state rate of heat conduction.<br><br>Answer: $A_1 K_1 = A_2 K_2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3338c30a4553e1be13b", "type": "singleCorrect", "question": {"text": "Rate of flow of heat through a cylindrical rod is '$H_1$'. The temperature at the ends of the rod are $T_1$ and $T_2$. If all the dimensions of the rod become double and the temperature difference remains the same and if the rate of flow of heat becomes '$H_2$' then $H_2 =$", "image": null}, "options": [{"id": "GxHcE", "label": "A", "text": "$\\dfrac{\\text{H}_1}{2}$", "isCorrect": false, "image": null}, {"id": "cbIJC", "label": "B", "text": "$4\\text{H}_1$", "isCorrect": false, "image": null}, {"id": "1JwQZ", "label": "C", "text": "$2\\text{H}_1$", "isCorrect": true, "image": null}, {"id": "lDn4i", "label": "D", "text": "$\\dfrac{\\text{H}_1}{4}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The rate of flow of heat through a rod is given by $H = \\dfrac{KA(T_1 - T_2)}{L}$<br><br>For a cylindrical rod of radius $r$ and length $L$, the area of cross-section is $A = \\pi r^2$.<br><br>Initial rate of heat flow is $H_1 = \\dfrac{K \\pi r^2 (T_1 - T_2)}{L}$<br><br>When all dimensions are doubled, the new radius is $r' = 2r$ and the new length is $L' = 2L$.<br><br>The new rate of heat flow is $H_2 = \\dfrac{K \\pi (2r)^2 (T_1 - T_2)}{2L}$<br><br>$H_2 = \\dfrac{4 K \\pi r^2 (T_1 - T_2)}{2L}$<br><br>$H_2 = 2 \\left( \\dfrac{K \\pi r^2 (T_1 - T_2)}{L} \\right)$<br><br>$H_2 = 2H_1$<br><br>Answer: $2\\text{H}_1$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2de8c30a4553e1bdda9", "type": "singleCorrect", "question": {"text": "The ratio of the thermal conductivity of two rods of different materials is 6:5. The two rods of same area of cross section and same thermal resistance will have the length in the ratio", "image": null}, "options": [{"id": "86Bra", "label": "A", "text": "$5 : 6$", "isCorrect": false, "image": null}, {"id": "pxFPJ", "label": "B", "text": "$6 : 5$", "isCorrect": true, "image": null}, {"id": "663fJ", "label": "C", "text": "$1 : 3$", "isCorrect": false, "image": null}, {"id": "aUIE0", "label": "D", "text": "$3 : 1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Thermal resistance of a rod is given by $R = \\dfrac{L}{KA}$<br><br>Given that both rods have the same thermal resistance ($R_1 = R_2$) and the same area of cross-section ($A_1 = A_2 = A$), we can write:<br><br>$\\dfrac{L_1}{K_1 A} = \\dfrac{L_2}{K_2 A}$<br><br>$\\dfrac{L_1}{L_2} = \\dfrac{K_1}{K_2}$<br><br>The ratio of thermal conductivities is given as $\\dfrac{K_1}{K_2} = \\dfrac{6}{5}$<br><br>Therefore, $\\dfrac{L_1}{L_2} = \\dfrac{6}{5}$<br><br>The lengths of the rods are in the ratio $6 : 5$.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2998c30a4553e1bdac5", "type": "singleCorrect", "question": {"text": "The coefficient of thermal conductivity of a metal rod depends on its", "image": null}, "options": [{"id": "Io4F0", "label": "A", "text": "area of cross section", "isCorrect": false, "image": null}, {"id": "WcgSM", "label": "B", "text": "mass", "isCorrect": false, "image": null}, {"id": "p6jht", "label": "C", "text": "material of the rod", "isCorrect": true, "image": null}, {"id": "58YUZ", "label": "D", "text": "length used", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The coefficient of thermal conductivity is an intrinsic property of a material. It depends only on the nature of the material and its temperature, and is independent of the dimensions of the rod such as length, area of cross-section, or mass.<br><br>Answer: material of the rod", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b58c30a4553e1bdbf7", "type": "singleCorrect", "question": {"text": "Three identical heat conducting rods are connected in series as shown in the figure. The rods on the side have thermal conductivity $2K$ while that in the middle has thermal conductivity $K$. The left end of the combination is maintained at temperature $3T$ and the right end at $T$. The rods are thermally insulated from outside. In steady state, temperature at the left junction is $T_1$ and that at the right junctions is $T_2$. The ratio $T_1/T_2$ is<br><img style=\"width: 300px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/11_april_shift_1__q45_d1.png\" />", "image": null}, "options": [{"id": "rIT7s", "label": "A", "text": "$\\dfrac{3}{2}$", "isCorrect": false, "image": null}, {"id": "ZSRT0", "label": "B", "text": "$\\dfrac{4}{3}$", "isCorrect": false, "image": null}, {"id": "m0uXj", "label": "C", "text": "$\\dfrac{5}{3}$", "isCorrect": true, "image": null}, {"id": "tGP6m", "label": "D", "text": "$\\dfrac{4}{5}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the length of each rod be $L$ and the area of cross-section be $A$.<br><br>In steady state, the rate of heat flow is the same through all three rods:<br><br>$\\dfrac{dQ}{dt} = \\dfrac{2KA(3T - T_1)}{L} = \\dfrac{KA(T_1 - T_2)}{L} = \\dfrac{2KA(T_2 - T)}{L}$<br><br>Cancelling $\\dfrac{KA}{L}$ from all terms, we get:<br><br>$2(3T - T_1) = T_1 - T_2 = 2(T_2 - T)$<br><br>From the first and third parts of the equality:<br><br>$2(3T - T_1) = 2(T_2 - T)$<br><br>$3T - T_1 = T_2 - T$<br><br>$T_1 + T_2 = 4T \\quad \\dots (1)$<br><br>From the second and third parts of the equality:<br><br>$T_1 - T_2 = 2(T_2 - T)$<br><br>$T_1 - 3T_2 = -2T \\quad \\dots (2)$<br><br>Subtracting equation (2) from equation (1):<br><br>$(T_1 + T_2) - (T_1 - 3T_2) = 4T - (-2T)$<br><br>$4T_2 = 6T \\Rightarrow T_2 = \\dfrac{3T}{2}$<br><br>Substituting $T_2$ in equation (1):<br><br>$T_1 + \\dfrac{3T}{2} = 4T \\Rightarrow T_1 = \\dfrac{5T}{2}$<br><br>The required ratio is:<br><br>$\\dfrac{T_1}{T_2} = \\dfrac{\\dfrac{5T}{2}}{\\dfrac{3T}{2}} = \\dfrac{5}{3}$<br><br>Answer: $\\dfrac{5}{3}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b76bf9280d7f9932972", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The two ends of a rod of length ' x ' and uniform cross-sectional area ' A ' are kept at temperatures ' $T_1$ ' and ' $T_2$ ' respectively ( $T_1>T_2$ ). If the rate of heat transfer is ' $Q / t$ ', through the rod in steady state, then the coefficient of thermal conductivity ' K ' is", "image": null}, "options": [{"id": "jTW8S", "text": "$\\frac{\\mathrm{AQ}}{\\operatorname{tx}\\left(\\mathrm{T}_1-\\mathrm{T}_2\\right)}$", "image": null, "isCorrect": false}, {"id": "N4lJt", "text": "$\\frac{x Q}{t A\\left(T_1-T_2\\right)}$", "image": null, "isCorrect": true}, {"id": "hJuu1", "text": "$\\frac{\\mathrm{xAQ}}{\\mathrm{t}\\left(\\mathrm{T}_1-\\mathrm{T}_2\\right)}$", "image": null, "isCorrect": false}, {"id": "quWxq", "text": "$\\frac{\\mathrm{Q}}{\\operatorname{txA}\\left(\\mathrm{T}_1-\\mathrm{T}_2\\right)}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The rate of heat transfer through a rod in steady state is given by Fourier's law of heat conduction:<br><br>$\\dfrac{Q}{t} = \\dfrac{K A (T_1 - T_2)}{x}$<br><br>where $Q/t$ is the rate of heat transfer, $K$ is the coefficient of thermal conductivity, $A$ is the cross-sectional area, $T_1 - T_2$ is the temperature difference, and $x$ is the length of the rod.<br><br>Rearranging the formula to solve for $K$:<br><br>$K = \\dfrac{x Q}{t A (T_1 - T_2)}$<br><br>Answer: $\\frac{x Q}{t A\\left(T_1-T_2\\right)}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b0bbf9280d7f99325e4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A composite slab consists of two materials having coefficients of thermal conductivity K and 2 K , thickness x and 4 x respectively. The temperatures of two outer surfaces of a composite slab are $T_2$ and $T_1$ respectively ( $\\mathrm{T}_2>\\mathrm{T}_1$ ). The rate of heat transfer through the slab in a steady state is $\\left[\\frac{A\\left(T_2-T_1\\right) K}{x}\\right] f$, where $f$ is equal to", "image": null}, "options": [{"id": "9caB1", "text": "$1$", "image": null, "isCorrect": false}, {"id": "RHJBp", "text": "$\\frac{2}{3}$", "image": null, "isCorrect": false}, {"id": "OIlo6", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "0LWh7", "text": "$\\frac{1}{3}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The thermal resistance of a slab is given by $R = \\dfrac{L}{KA}$.<br><br>For the first material, the thermal resistance is $R_1 = \\dfrac{x}{KA}$.<br><br>For the second material, the thermal resistance is $R_2 = \\dfrac{4x}{2KA} = \\dfrac{2x}{KA}$.<br><br>Since the slabs are connected in series, the equivalent thermal resistance is $R_{eq} = R_1 + R_2$.<br><br>$R_{eq} = \\dfrac{x}{KA} + \\dfrac{2x}{KA} = \\dfrac{3x}{KA}$<br><br>The rate of heat transfer in steady state is $H = \\dfrac{T_2 - T_1}{R_{eq}}$.<br><br>$H = \\dfrac{T_2 - T_1}{\\dfrac{3x}{KA}} = \\left[ \\dfrac{A(T_2 - T_1)K}{x} \\right] \\dfrac{1}{3}$<br><br>Comparing this with the given expression $H = \\left[ \\dfrac{A(T_2 - T_1)K}{x} \\right] f$, we get $f = \\dfrac{1}{3}$.<br><br>Answer: $\\frac{1}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213330aee93fa0796d6ec", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "Rate of flow of heat through a cylindrical rod is ' $\\mathrm{H}_1$ '. The temperature at the ends of the rod are ' $T_1$ ' and ' $T_2$ '. If all the dimensions of the rod become double and the temperature difference remains the same, the rate of flow of heat becomes ' $\\mathrm{H}_2$ '. Then", "image": null}, "options": [{"id": "DC42F", "text": "$\\mathrm{H}_2=4 \\mathrm{H}_1$", "image": null, "isCorrect": false}, {"id": "X9jzr", "text": "$\\mathrm{H}_2=2 \\mathrm{H}_1$", "image": null, "isCorrect": true}, {"id": "JPhqy", "text": "$\\mathrm{H}_2=\\dfrac{\\mathrm{H}_1}{2}$", "image": null, "isCorrect": false}, {"id": "yHmT9", "text": "$\\mathrm{H}_2=\\dfrac{\\mathrm{H}_1}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The rate of flow of heat through a rod is given by $H = \\dfrac{KA(T_1 - T_2)}{L}$<br><br>For a cylindrical rod, the area of cross-section is $A = \\pi r^2$<br><br>Therefore, the initial rate of flow of heat is $H_1 = \\dfrac{K(\\pi r^2)(T_1 - T_2)}{L}$<br><br>When all dimensions of the rod are doubled, the new radius is $r' = 2r$ and the new length is $L' = 2L$<br><br>The new area of cross-section becomes $A' = \\pi (2r)^2 = 4\\pi r^2 = 4A$<br><br>The new rate of flow of heat is $H_2 = \\dfrac{K(4A)(T_1 - T_2)}{2L}$<br><br>$H_2 = 2 \\left( \\dfrac{KA(T_1 - T_2)}{L} \\right)$<br><br>$H_2 = 2H_1$<br><br>Answer: $\\mathrm{H}_2=2 \\mathrm{H}_1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261730279619d9d8a2cac", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "Two metal slabs of same cross-sectional area have thicknesses $d_1$ and ; and thermal conductivities $K_1$ and $K_2$ respectively, are connected in series. The free ends of the two slabs are kept at temperatures $T_1$ and $T_2\\left(T_1>T_2\\right)$. The temperature $T$ of their common junction is", "image": null}, "options": [{"id": "AKaHe", "text": "$\\frac{K_1 T_1 d_2+K_2 T_2 d_1}{K_1 d_2+K_2 d_1}$", "image": null, "isCorrect": true}, {"id": "U5c8z", "text": "$\\frac{K_1 T_1+K_2 T_2}{K_1+K_2}$", "image": null, "isCorrect": false}, {"id": "D3FlT", "text": "$\\frac{K_1 T_1+K_2 T_2}{T_1+T_2}$", "image": null, "isCorrect": false}, {"id": "oRePK", "text": "$\\frac{K_1 T_1 d_1+K_2 T_2 d_2}{K_1 d_2+K_2 d_1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Heat current, $\\dot{Q}_1=\\frac{K_1\\left(T_1-T\\right) A}{d_1}$\nFor second slab,\nHeat current, $\\dot{Q}_2=\\frac{K_2\\left(T-T_2\\right) A}{d_2}$\nAs slabs are in series same heat current flows through them\n$\\dot{Q}_1=\\dot{Q}_2$\n$\\therefore \\frac{K_1\\left(T_1-T\\right) A}{d_1}=\\frac{K_2\\left(T-T_2\\right) A}{d_2}$\nTherefore, temperature $T$ of their common junction is\n$T=\\frac{K_1 T_1 d_2+K_2 T_2 d_1}{K_2 d_1+K_1 d_2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261600279619d9d8a2c10", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "Two metal rods $\\mathrm{P}$ and $\\mathrm{Q}$ have same length and same temperature difference between their ends. Their thermal conductivities are $K_1$ and $K_2$, also cross-sectional areas $A_1$ and $A_2$ respectively. If the rate of flow of heat through rod $Q$ is three times that in rod $P$, then", "image": null}, "options": [{"id": "jZRzD", "text": "$\\mathrm{K}_1 \\mathrm{~A}_1=3 \\mathrm{~K}_2 \\mathrm{~A}_2$", "image": null, "isCorrect": false}, {"id": "kAtUq", "text": "$3 \\mathrm{~K}_1 \\mathrm{~A}_1=\\mathrm{K}_2 \\mathrm{~A}_2$", "image": null, "isCorrect": true}, {"id": "qou3a", "text": "$3 \\mathrm{~K}_1 \\mathrm{~A}_1=2 \\mathrm{~K}_2 \\mathrm{~A}_2$", "image": null, "isCorrect": false}, {"id": "mbv1p", "text": "$2 \\mathrm{~K}_1 \\mathrm{~A}_1=3 \\mathrm{~K}_2 \\mathrm{~A}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Concept: the rate of heat flow through the rod is given by\n$\\dot{\\mathrm{Q}}=\\frac{\\mathrm{KA} \\Delta \\theta}{\\mathrm{l}}$\nWhere $\\mathrm{K}$ is the conductivity, $\\Delta \\mathrm{Q}$ is the temperature difference across, $\\mathrm{A}$ is the area of cross-section and 1 is the length of the rod.\n$\\begin{aligned}\n& \\therefore(\\dot{\\mathrm{Q}})_{\\mathrm{Q}}=(\\dot{\\mathrm{Q}})_{\\mathrm{P}} \\\\\n& \\Rightarrow \\frac{\\mathrm{K}_2 \\mathrm{~A}_2}{\\mathrm{l}}=\\frac{3 \\mathrm{~K}_1 \\mathrm{~A}_1}{\\mathrm{l}} \\\\\n& \\Rightarrow \\mathrm{K}_2 \\mathrm{~A}_2=3 \\mathrm{~K}_1 \\mathrm{~A}_1\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2614a0279619d9d8a2b5d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "sh
