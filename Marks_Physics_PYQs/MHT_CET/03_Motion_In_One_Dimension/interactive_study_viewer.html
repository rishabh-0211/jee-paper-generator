r>Since the ball is a conductor, this induced EMF generates eddy currents within the metallic ball.<br><br>According to Lenz's law, these eddy currents oppose the motion that causes them, creating an upward magnetic retarding force.<br><br>As a result, the net downward acceleration of the metallic ball becomes less than the acceleration due to gravity $g$.<br><br>The insulating ball is a non-conductor, so no eddy currents are induced in it. It falls with the full acceleration $g$.<br><br>Because the insulating ball has a greater downward acceleration, it will reach the Earth's surface earlier than the metallic ball.<br><br>Answer: Insulating ball will reach the earth's surface earlier than the metal ball.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262570279619d9d8a33ba", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "A small steel ball is dropped from a height of $1.5 \\mathrm{~m}$ into a glycerine jar. The ball reaches the bottom of the jar 1.5 second after it was dropped. If the retardation is $2.66 \\mathrm{~m} / \\mathrm{s}^2$, the height of the glycerine in the jar is about (acceleration due to gravity $g=9.8 \\mathrm{~m} / \\mathrm{s}^2$ )", "image": null}, "options": [{"id": "xOlMP", "text": "$7.0 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "BPiAI", "text": "$7.5 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "G4HfP", "text": "$5.5 \\mathrm{~m}$", "image": null, "isCorrect": true}, {"id": "OjiJa", "text": "$3.2 \\mathrm{~m}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The velocity of the ball after it has been dropped from height till it reaches the glycerine surface is\n$\\mathrm{v}_{\\mathrm{i}}^2=0+2 \\mathrm{gh} \\quad \\quad \\ldots .\\left(\\because \\mathrm{v}^2-\\mathrm{u}^2=2 \\mathrm{gh}\\right)$\n$v_i^2=2 \\times 9.8 \\times 1.5$\n$v_i^2=29.4$\nThe velocity of the ball after it enters glycerine is $v_f^2=v_i^2-2 g h$\n$0=29.4-(2 \\times 2.66 \\times h)$\n$\\therefore \\quad \\mathrm{h}=\\frac{29.4}{2 \\times 2.66}=5.5 \\mathrm{~m}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262310279619d9d8a3289", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "A ball is projected vertically upwards from ground. It reaches a height ' $h$ ' in time $t_1$, continues its motion and then takes a time $t_2$ to reach ground. The height $h$ in terms of $g, t_1$ and $t_2$ is $(g=$ acceleration due to gravity)", "image": null}, "options": [{"id": "bLYlP", "text": "$\\frac{1}{2} \\frac{\\mathrm{gt}_1}{\\mathrm{t}_2}$", "image": null, "isCorrect": false}, {"id": "LMr4g", "text": "$\\frac{1}{2} \\mathrm{gt}_1 \\mathrm{t}_2$", "image": null, "isCorrect": true}, {"id": "jqEWn", "text": "$\\mathrm{g} \\mathrm{t}_1 \\mathrm{t}_2$", "image": null, "isCorrect": false}, {"id": "JAB1k", "text": "$2 \\mathrm{gt}_1 \\mathrm{t}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We know,\n$$\n\\mathrm{S}=\\mathrm{ut}+\\frac{1}{2} \\mathrm{at}^2\n$$\n\nThe total time required for the ball to go up and reach the ground is $t=t_1+t_2$, and the total displacement is zero.\n$$\n\\begin{aligned}\n& \\therefore \\quad 0=\\mathrm{u}\\left(\\mathrm{t}_1+\\mathrm{t}_2\\right)+\\frac{1}{2} \\mathrm{~g}\\left(\\mathrm{t}_1+\\mathrm{t}_2\\right)^2 \\\\\n& \\therefore \\quad \\mathrm{u}=\\frac{1}{2} \\mathrm{~g}\\left(\\mathrm{t}_1+\\mathrm{t}_2\\right)\n\\end{aligned}\n$$\n\nThe displacement in time $t_1$ is\n$$\n\\begin{aligned}\n\\mathrm{h} & =\\frac{1}{2} \\mathrm{~g}\\left(\\mathrm{t}_1+\\mathrm{t}_2\\right) \\mathrm{t}_1-\\frac{1}{2} \\mathrm{gt}_1^2 \\\\\n\\mathrm{~h} & =\\frac{1}{2} \\mathrm{gt}_1\\left(\\mathrm{t}_1+\\mathrm{t}_2-\\mathrm{t}_1\\right) \\\\\n\\therefore \\quad \\mathrm{h} & =\\frac{1}{2} \\mathrm{gt}_1 \\mathrm{t}_2\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262070279619d9d8a313c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "A ball kept at $20 \\mathrm{~m}$ height falls freely in vertically downward direction and hits the ground. The coefficient of restitution is $0.4$. Velocity of the ball first rebound is $\\left[\\mathrm{g}=10 \\mathrm{~ms}^{-2}\\right]$", "image": null}, "options": [{"id": "4oqFd", "text": "$4 \\mathrm{~ms}^{-1}$", "image": null, "isCorrect": false}, {"id": "DOJw6", "text": "$8 \\mathrm{~ms}^{-1}$", "image": null, "isCorrect": true}, {"id": "kTDoQ", "text": "$12 \\mathrm{~ms}^{-1}$", "image": null, "isCorrect": false}, {"id": "zyUn8", "text": "$16 \\mathrm{~ms}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\nv^2 & =0+2 g h \\quad \\ldots\\left(\\because v^2-u^2=2 g h\\right) \\\\\n& v^2=2 \\times 10 \\times 20=400 \\\\\n& v=20 \\mathrm{~m} / \\mathrm{s} \\\\\n& \\mathrm{e}=\\frac{\\mathrm{u}}{\\mathrm{v}}\n\\end{aligned}$\n$\\therefore \\quad$ The velocity of the body after the first rebound is\n$\\begin{aligned}\n& u=0.4 \\times 20 \\\\\n& u=8 \\mathrm{~m} / \\mathrm{s}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261d00279619d9d8a2f89", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "A body is released from the top of a tower ' $\\mathrm{H}$ ' metre high. It takes $t$ second to reach the ground. The height of the body $\\frac{t}{2}$ second after release is", "image": null}, "options": [{"id": "L5IHd", "text": "$\\frac{\\mathrm{H}}{2}$ metre from ground", "image": null, "isCorrect": false}, {"id": "L2iRe", "text": "$\\frac{\\mathrm{H}}{4}$ metre from ground", "image": null, "isCorrect": false}, {"id": "MwkBV", "text": "$3 \\frac{\\mathrm{H}}{4}$ metre from ground", "image": null, "isCorrect": true}, {"id": "QheaM", "text": "$\\frac{\\mathrm{H}}{6}$ metre from ground", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the body be at $\\mathrm{x}$ from the top after $\\frac{\\mathrm{t}}{2} \\mathrm{~s}$.\n$\\begin{aligned}\n\\therefore \\quad \\mathrm{x} & =\\frac{1}{2} \\mathrm{~g} \\frac{\\mathrm{t}^2}{4}=\\frac{\\mathrm{gt}^2}{8}.... (i) \\\\\n\\mathrm{H} & =\\frac{1}{2} \\mathrm{gt}^2 .... (ii)\n\\end{aligned}$\nEliminating $\\mathrm{t}$ from (i) and (ii), we get $\\frac{8 \\mathrm{x}}{\\mathrm{g}}=\\frac{2 \\mathrm{H}}{\\mathrm{g}} \\Rightarrow \\mathrm{x}=\\frac{\\mathrm{H}}{4}$\n$\\therefore \\quad$ Height of the body from the ground $=\\mathrm{H}-\\frac{\\mathrm{H}}{4}=\\frac{3 \\mathrm{H}}{4}$ metres", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260590279619d9d8a23c4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "A body at rest falls through a height ' $h$ ' with velocity ' $\\mathrm{V}$ '. If it has to fall down further for its velocity to become three times, the distance travelled in that interval is", "image": null}, "options": [{"id": "VxgEZ", "text": "8 h", "image": null, "isCorrect": true}, {"id": "23map", "text": "6 h", "image": null, "isCorrect": false}, {"id": "kl8nL", "text": "4 h", "image": null, "isCorrect": false}, {"id": "ZGmBX", "text": "12 h", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The body acquired velocity $\\mathrm{V}$ when it falls through a height $\\mathrm{h}$, starting from rest.\n$$\n\\begin{aligned}\n& \\therefore \\mathrm{V}^2=2 \\mathrm{gh} \\\\\n& \\therefore \\mathrm{h}=\\frac{\\mathrm{V}^2}{2 \\mathrm{~g}}\n\\end{aligned}\n$$\nIf it falls further and attains velocity $3 \\mathrm{~V}$ and if the total height through which it falls is h', then\n$$\n\\begin{aligned}\n& \\left(3 \\mathrm{~V}^2\\right)=2 \\mathrm{gh}^{\\prime} \\\\\n& \\therefore 9 \\mathrm{~V}^2=2 \\mathrm{gh}^{\\prime} \\\\\n& \\therefore \\mathrm{h}^{\\prime}=\\frac{9 \\mathrm{~V}^2}{2 \\mathrm{~g}}=9 \\mathrm{~h} \\\\\n& \\therefore \\mathrm{h}^{\\prime}-\\mathrm{h}=9 \\mathrm{~h}-\\mathrm{h}=8 \\mathrm{~h}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fda0279619d9d8a1fc7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "A lift of mass 'm' is ascending with an acceleration 'a' (a $ < \\mathrm{g}$ ). The tension in the\ncable of the lift is\n(g= acceleration due to gravity)", "image": null}, "options": [{"id": "D15m6", "text": "$\\mathrm{m}(\\mathrm{g}-\\mathrm{a})$", "image": null, "isCorrect": false}, {"id": "SCfaH", "text": "$\\mathrm{m}(\\mathrm{g}+\\mathrm{a})$", "image": null, "isCorrect": true}, {"id": "DJMQS", "text": "$\\mathrm{m}(2 \\mathrm{~g}+\\mathrm{a})$", "image": null, "isCorrect": false}, {"id": "gJyUy", "text": "$\\mathrm{m}(\\mathrm{a}-\\mathrm{g})$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "m(g+a)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f320279619d9d8a1a86", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}], "question": {"text": "Five objects of different masses are simultaneously released vertically downwards from height 'h' (in air). Which physical quantity associated with the objects will\nchange at the instant they strike the ground ? (Neglect the air resistance.)", "image": null}, "options": [{"id": "gULM8", "text": "Momentum", "image": null, "isCorrect": true}, {"id": "lXrXR", "text": "Time", "image": null, "isCorrect": false}, {"id": "gxgGo", "text": "Acceleration", "image": null, "isCorrect": false}, {"id": "CWqdJ", "text": "Velocity", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "6792165c0aee93fa0796e18f", "title": "Graphs of motion in one dimension", "totalQuestions": 5, "questions": [{"_id": "6a44d2988c30a4553e1bdabd", "type": "singleCorrect", "question": {"text": "The velocity time graph of a body moving in a straight line is shown in a figure. The ratio of displacement to distance travelled by the body in time $0$ to $10$ s is<br><img style=\"width: 400px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/13_april_shift_2__q31_d1.png\" />", "image": null}, "options": [{"id": "VPrTk", "label": "A", "text": "$1:1$", "isCorrect": false, "image": null}, {"id": "mab5J", "label": "B", "text": "$1:4$", "isCorrect": false, "image": null}, {"id": "xfdDw", "label": "C", "text": "$1:2$", "isCorrect": false, "image": null}, {"id": "CGONx", "label": "D", "text": "$1:3$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Displacement is the algebraic sum of the areas under the velocity-time graph, and distance is the sum of their absolute values.<br><br>Calculating the areas for each time interval:<br>Area for $0$ to $2$ s: $A_1 = 8 \\times 2 = 16$ m<br>Area for $2$ to $4$ s: $A_2 = -4 \\times 2 = -8$ m<br>Area for $4$ to $8$ s: $A_3 = 4 \\times 4 = 16$ m<br>Area for $8$ to $10$ s: $A_4 = -4 \\times 2 = -8$ m<br><br>Total displacement $= A_1 + A_2 + A_3 + A_4 = 16 - 8 + 16 - 8 = 16$ m<br><br>Total distance $= |A_1| + |A_2| + |A_3| + |A_4| = 16 + 8 + 16 + 8 = 48$ m<br><br>Ratio of displacement to distance $= \\dfrac{16}{48} = \\dfrac{1}{3}$<br><br>Thus, the required ratio is $1:3$.<br><br>Answer: $1:3$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e40aee93fa0796dc5b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "For the velocity-time graph shown in the figure below, the distance covered by the body in last two second of its motion is ' $\\mathrm{S}_1$ '. What is the ratio of ' $S_1$ ' to the total distance covered by it\r\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/uuW-ddp9PTeGPo6oxHRfa837gavlTQAGPQAy6XyPHLM.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "9ghCH", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "vCQxK", "text": "$\\frac{1}{4}$", "image": null, "isCorrect": true}, {"id": "wyWSK", "text": "$\\frac{1}{3}$", "image": null, "isCorrect": false}, {"id": "Bq5ll", "text": "$\\frac{2}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From the given velocity-time graph, the motion starts at $t = 1$ s and ends at $t = 7$ s.<br><br>The distance covered in the last two seconds ($t = 5$ s to $t = 7$ s) is given by the area of $\\triangle CDE$:<br><br>$S_1 = \\dfrac{1}{2} \\times \\text{base} \\times \\text{height} = \\dfrac{1}{2} \\times (7 - 5) \\times 10 = 10$ m<br><br>The total distance covered is the area of the trapezium $ABCD$:<br><br>$S_{\\text{total}} = \\dfrac{1}{2} \\times (AD + BC) \\times \\text{height}$<br><br>$S_{\\text{total}} = \\dfrac{1}{2} \\times ((7 - 1) + (5 - 3)) \\times 10$<br><br>$S_{\\text{total}} = \\dfrac{1}{2} \\times (6 + 2) \\times 10 = 40$ m<br><br>The required ratio is:<br><br>$\\dfrac{S_1}{S_{\\text{total}}} = \\dfrac{10}{40} = \\dfrac{1}{4}$<br><br>Answer: $\\frac{1}{4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213a60aee93fa0796da6e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "The following figures show the variation of displacement with time of a particular object.\r\n(a)<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/rhg_8iY4E5DGxGG6xntc5griKEcZYmkWk_M8PyvXd_c.original.fullsize.png\"/><br/>(b)<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/6VFaXSY46QtQIqShoPNykavkjgUmwvF-INCFuBsDeIQ.original.fullsize.png\"/><br/>(c)<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/uyhQGzJakRrFoEr2yMq9-O3zZssd7AkRn6rpmxNMXJo.original.fullsize.png\"/><br/>(d)<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/ilRFSJNEwOpw7d8Y_hmZXmNjvYlzXxHZeygsvSn1zQc.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "9l5Bf", "text": "Figure (a) and (b) show object at rest and object moving with uniform velocity in positive $x$ direction respectively.", "image": null, "isCorrect": true}, {"id": "5g67z", "text": "Figure (b) and (c) show object at rest and object moving with uniform velocity in negative $x$ direction respectively.", "image": null, "isCorrect": false}, {"id": "BnEBs", "text": "Figure (c) and (d) show object at rest and object moving with uniform velocity in negative $x$ direction respectively.", "image": null, "isCorrect": false}, {"id": "C1uGl", "text": "Figure (a) and (b) show object at rest.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In a displacement-time ($X-t$) graph, the slope of the curve represents the velocity of the object, since $v = \\dfrac{dX}{dt}$.<br><br>For figure (a), the displacement $X$ is constant over time. The slope of the graph is zero, which means the velocity is zero. Therefore, the object is at rest.<br><br>For figure (b), the displacement $X$ increases linearly with time $t$. The graph is a straight line with a positive constant slope. This indicates that the object is moving with a uniform (constant) velocity in the positive $x$-direction.<br><br>For figure (c), the graph is a straight line with a negative constant slope, indicating uniform velocity in the negative $x$-direction.<br><br>For figure (d), the slope alternates between positive and negative constant values, indicating oscillatory motion with constant speed.<br><br>Thus, figure (a) shows an object at rest, and figure (b) shows an object moving with uniform velocity in the positive $x$-direction.<br><br>Answer: Figure (a) and (b) show object at rest and object moving with uniform velocity in positive $x$ direction respectively.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213980aee93fa0796da00", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "A velocity - time graph of a body is shown below. The distance covered by the body from 6 second to 9 second is\n<img width=300px src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/e5xw16ezoGH9oM_-_8gN6s2Cp6yOTkbixu_cUxX-j2A.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "h19I3", "text": "22.5 m", "image": null, "isCorrect": false}, {"id": "qDeHH", "text": "60.0 m", "image": null, "isCorrect": false}, {"id": "nrLyv", "text": "82.5 m", "image": null, "isCorrect": true}, {"id": "776Lm", "text": "120.0 m", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From the given velocity-time graph, the velocity at $t = 6$ s is $20$ m/s and at $t = 10$ s is $40$ m/s.<br><br>The acceleration in this interval is constant and is given by the slope of the graph:<br><br>$a = \\dfrac{40 - 20}{10 - 6} = 5 \\text{ m/s}^2$<br><br>The velocity at $t = 9$ s is:<br><br>$v = u + at = 20 + 5(9 - 6) = 35$ m/s<br><br>The distance covered from $t = 6$ s to $t = 9$ s is the area under the $v-t$ graph in this time interval, which forms a trapezium:<br><br>$\\text{Distance} = \\dfrac{1}{2} \\times (\\text{sum of parallel sides}) \\times \\text{height}$<br><br>$\\text{Distance} = \\dfrac{1}{2} \\times (20 + 35) \\times (9 - 6)$<br><br>$\\text{Distance} = \\dfrac{1}{2} \\times 55 \\times 3 = 82.5$ m<br><br>Answer: 82.5 m", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213240aee93fa0796d675", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "The acceleration of a moving body can be found from", "image": null}, "options": [{"id": "kzraA", "text": "area under velocity - time graph.", "image": null, "isCorrect": false}, {"id": "BP1Xe", "text": "area under distance - time graph.", "image": null, "isCorrect": false}, {"id": "WbpJ4", "text": "slope of the velocity - time graph.", "image": null, "isCorrect": true}, {"id": "gb9R2", "text": "slope of the distance - time graph.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Acceleration is defined as the rate of change of velocity with respect to time, which is mathematically given by $a = \\dfrac{dv}{dt}$.<br><br>In a velocity-time graph, the slope of the curve at any point is equal to $\\dfrac{dv}{dt}$.<br><br>Therefore, the acceleration of a moving body can be found from the slope of the velocity-time graph.<br><br>Answer: slope of the velocity - time graph.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
