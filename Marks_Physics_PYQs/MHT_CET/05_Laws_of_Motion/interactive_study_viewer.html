    const data = {"index": 5, "chapterId": "61c089a30f62a0d239520145", "chapter": "Laws of Motion", "exam": "MHT CET", "subject": "Physics", "totalTopics": 5, "totalQuestions": 101, "downloadTime": "2026-10-08 20:33:45", "topics": [{"index": 1, "topicId": "65a2632a0279619d9d8a3c94", "title": "Newton's laws of motion", "totalQuestions": 27, "questions": [{"_id": "6abb88bc15a9fc0fc8c1467e", "type": "singleCorrect", "question": {"text": "A block of mass $1$ kg is kept on ice surface. When velocity of $4$ m/s is given to it, it stops by friction in $5$ second. The coefficient of friction is (acceleration due to gravity, $g = 10$ m/s$^2$)", "image": null}, "options": [{"id": "OARVt", "label": "A", "text": "$0.02$", "isCorrect": false, "image": null}, {"id": "iDqwB", "label": "B", "text": "$0.04$", "isCorrect": false, "image": null}, {"id": "A4s0i", "label": "C", "text": "$0.08$", "isCorrect": true, "image": null}, {"id": "PtIbh", "label": "D", "text": "$0.09$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using the first equation of motion:<br><br>$v = u + at$<br><br>Substituting the given values $u = 4 \\text{ m/s}$, $v = 0 \\text{ m/s}$, and $t = 5 \\text{ s}$:<br><br>$0 = 4 + a(5)$<br><br>$a = -0.8 \\text{ m/s}^2$<br><br>The retardation is provided by the kinetic friction. Equating the frictional force to mass times acceleration:<br><br>$\\mu mg = m|a|$<br><br>$\\mu = \\dfrac{|a|}{g}$<br><br>Substituting $g = 10 \\text{ m/s}^2$:<br><br>$\\mu = \\dfrac{0.8}{10} = 0.08$<br><br>Answer: $0.08$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a58c30a4553e1bdb4a", "type": "singleCorrect", "question": {"text": "Three blocks of different masses connected with inextensible string are pulled by a force $F$ on a frictionless surface as shown in the figure. The ratio of tensions $T_1$ to $T_2$ is<br><img style=\"width: 400px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/19_april_shift_2__q22_d1.png\" />", "image": null}, "options": [{"id": "i5VaG", "label": "A", "text": "$1 : 5$", "isCorrect": false, "image": null}, {"id": "ngMZE", "label": "B", "text": "$5 : 1$", "isCorrect": true, "image": null}, {"id": "8xQ5w", "label": "C", "text": "$10 : 1$", "isCorrect": false, "image": null}, {"id": "SRvqT", "label": "D", "text": "$1 : 10$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the common acceleration of the system be $a$.<br><br>Total mass of the system, $M = 2\\text{ kg} + 8\\text{ kg} + 12\\text{ kg} = 22\\text{ kg}$.<br><br>The acceleration is given by $a = \\dfrac{F}{22}$.<br><br>The tension $T_1$ is responsible for pulling the blocks of mass $2\\text{ kg}$ and $8\\text{ kg}$ together.<br><br>Equation of motion for this combined mass is:<br>$T_1 = (2 + 8)a = 10a$<br><br>The tension $T_2$ is responsible for pulling only the block of mass $2\\text{ kg}$.<br><br>Equation of motion for the $2\\text{ kg}$ block is:<br>$T_2 = 2a$<br><br>The ratio of the tensions is:<br>$\\dfrac{T_1}{T_2} = \\dfrac{10a}{2a} = \\dfrac{5}{1}$<br><br>Therefore, $T_1 : T_2 = 5 : 1$.<br><br>Answer: $5 : 1$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f78c30a4553e1bdeba", "type": "singleCorrect", "question": {"text": "Which of the following person is in an inertial frame of reference?", "image": null}, "options": [{"id": "qeQZC", "label": "A", "text": "A pilot in an aeroplane which is taking off.", "isCorrect": false, "image": null}, {"id": "d0ERr", "label": "B", "text": "A driver driving a bus which is moving with constant velocity.", "isCorrect": true, "image": null}, {"id": "KvY89", "label": "C", "text": "A child revolving in a merry - go - round.", "isCorrect": false, "image": null}, {"id": "PzwBa", "label": "D", "text": "A man in a train which is slowing down to stop.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "An inertial frame of reference is a frame that is non-accelerating. It is either at rest or moving with a constant velocity.<br><br>An aeroplane taking off has a net forward acceleration, making it a non-inertial frame.<br><br>A child revolving in a merry-go-round undergoes circular motion and experiences centripetal acceleration, making it a non-inertial frame.<br><br>A train slowing down is decelerating, meaning it has a non-zero acceleration, making it a non-inertial frame.<br><br>A bus moving with constant velocity has zero acceleration. Therefore, the driver in the bus is in an inertial frame of reference.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e98c30a4553e1bde26", "type": "singleCorrect", "question": {"text": "An inextensible string passing over a smooth pulley connects two blocks of masses $m_1$ and $m_2$ ($m_2 > m_1$) vertically. If the acceleration of the system is $\\left(\\dfrac{g}{n}\\right)$, then the ratio of masses $\\left(\\dfrac{m_2}{m_1}\\right)$ is", "image": null}, "options": [{"id": "KitWl", "label": "A", "text": "$\\dfrac{n}{n+1}$", "isCorrect": false, "image": null}, {"id": "Iv1vw", "label": "B", "text": "$\\dfrac{n}{n-1}$", "isCorrect": false, "image": null}, {"id": "woy8E", "label": "C", "text": "$\\dfrac{n+1}{n-1}$", "isCorrect": true, "image": null}, {"id": "1VeJ8", "label": "D", "text": "$\\dfrac{n+1}{n}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For an Atwood machine with masses $m_1$ and $m_2$ ($m_2 > m_1$), the acceleration $a$ is given by:<br><br>$a = \\dfrac{m_2 - m_1}{m_2 + m_1}g$<br><br>Given that $a = \\dfrac{g}{n}$, we can write:<br><br>$\\dfrac{m_2 - m_1}{m_2 + m_1}g = \\dfrac{g}{n}$<br><br>$\\dfrac{m_2 - m_1}{m_2 + m_1} = \\dfrac{1}{n}$<br><br>Dividing the numerator and denominator of the left side by $m_1$:<br><br>$\\dfrac{\\dfrac{m_2}{m_1} - 1}{\\dfrac{m_2}{m_1} + 1} = \\dfrac{1}{n}$<br><br>Cross-multiplying yields:<br><br>$n\\left(\\dfrac{m_2}{m_1} - 1\\right) = \\dfrac{m_2}{m_1} + 1$<br><br>$n\\dfrac{m_2}{m_1} - n = \\dfrac{m_2}{m_1} + 1$<br><br>$\\dfrac{m_2}{m_1}(n - 1) = n + 1$<br><br>$\\dfrac{m_2}{m_1} = \\dfrac{n + 1}{n - 1}$<br><br>Answer: $\\dfrac{n+1}{n-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3218c30a4553e1be07e", "type": "singleCorrect", "question": {"text": "A block of mass M is lying on a horizontal frictionless surface. One end of the uniform rope of half the mass of the block is fixed to the block which is pulled in the horizontal direction by applying a force F at the other end. The tension in the middle of the rope will be", "image": null}, "options": [{"id": "eOZ56", "label": "A", "text": "$\\dfrac{F}{3}$", "isCorrect": false, "image": null}, {"id": "D7eoO", "label": "B", "text": "$\\dfrac{3F}{4}$", "isCorrect": false, "image": null}, {"id": "igng9", "label": "C", "text": "$\\dfrac{4F}{5}$", "isCorrect": false, "image": null}, {"id": "y1vjX", "label": "D", "text": "$\\dfrac{5F}{6}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Mass of the block = $M$<br><br>Mass of the rope = $\\dfrac{M}{2}$<br><br>Total mass of the system = $M + \\dfrac{M}{2} = \\dfrac{3M}{2}$<br><br>Acceleration of the system $a = \\dfrac{F}{\\dfrac{3M}{2}} = \\dfrac{2F}{3M}$<br><br>The tension in the middle of the rope accelerates the block and the rear half of the rope.<br><br>Mass behind the middle point $m' = M + \\dfrac{1}{2}\\left(\\dfrac{M}{2}\\right) = M + \\dfrac{M}{4} = \\dfrac{5M}{4}$<br><br>Tension at the middle of the rope $T = m' a = \\left(\\dfrac{5M}{4}\\right)\\left(\\dfrac{2F}{3M}\\right) = \\dfrac{5F}{6}$<br><br>Answer: $\\dfrac{5F}{6}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bfabf9280d7f9932e35", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A ball is dropped on the floor from a height of 20 m . It rebounds to a height of 5 m . Ball remains in contact with floor for 1 s . The average acceleration during contact is\n(acceleration due to gravity $=10 \\mathrm{~m} / \\mathrm{s}^2$ )", "image": null}, "options": [{"id": "Ga4oG", "text": "$30 \\mathrm{~m} / \\mathrm{s}^2$", "image": null, "isCorrect": true}, {"id": "Eshz4", "text": "$20 \\mathrm{~m} / \\mathrm{s}^2$", "image": null, "isCorrect": false}, {"id": "qQdjB", "text": "$40 \\mathrm{~m} / \\mathrm{s}^2$", "image": null, "isCorrect": false}, {"id": "mKmFo", "text": "$35 \\mathrm{~m} / \\mathrm{s}^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Velocity of the ball just before hitting the floor is given by $v_1 = \\sqrt{2gh_1}$.<br><br>Substituting the given values, $v_1 = \\sqrt{2 \\times 10 \\times 20} = 20 \\text{ m/s}$ (downwards).<br><br>Velocity of the ball just after rebounding is given by $v_2 = \\sqrt{2gh_2}$.<br><br>Substituting the values, $v_2 = \\sqrt{2 \\times 10 \\times 5} = 10 \\text{ m/s}$ (upwards).<br><br>Taking the upward direction as positive, the change in velocity is $\\Delta v = v_2 - (-v_1) = 10 - (-20) = 30 \\text{ m/s}$.<br><br>The average acceleration during contact is $a = \\dfrac{\\Delta v}{\\Delta t}$.<br><br>Substituting $\\Delta t = 1 \\text{ s}$, we get $a = \\dfrac{30}{1} = 30 \\text{ m/s}^2$.<br><br>Answer: $30 \\mathrm{~m} / \\mathrm{s}^2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be8bf9280d7f9932d80", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "In the arrangement shown in the figure, the mass ' m ' will ascend with an acceleration (consider pully and rope are massless) ( $g=$ acceleration due to gravity)\n\n<img width=200px src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/2IwwkXQOkrEmkexi68u6Phvr8nnEH4OHITaQsdWEOiw.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "yyMEo", "text": "$\\frac{g}{5}$", "image": null, "isCorrect": true}, {"id": "bQYb3", "text": "zero", "image": null, "isCorrect": false}, {"id": "22UVA", "text": "g", "image": null, "isCorrect": false}, {"id": "ByC82", "text": "2g", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $T$ be the tension in the string and $a$ be the acceleration of the system.<br><br>The heavier mass $\\dfrac{3}{2}m$ moves downwards and the lighter mass $m$ moves upwards.<br><br>Writing the equations of motion for both masses:<br><br>For mass $m$ (moving upwards):<br>$T - mg = ma$<br><br>For mass $\\dfrac{3}{2}m$ (moving downwards):<br>$\\dfrac{3}{2}mg - T = \\dfrac{3}{2}ma$<br><br>Adding the two equations, we get:<br>$\\dfrac{3}{2}mg - mg = ma + \\dfrac{3}{2}ma$<br><br>$\\dfrac{1}{2}mg = \\dfrac{5}{2}ma$<br><br>$a = \\dfrac{g}{5}$<br><br>Therefore, the mass $m$ will ascend with an acceleration of $\\dfrac{g}{5}$.<br><br>Answer: $\\frac{g}{5}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba4bf9280d7f9932b2c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A machine gun fires a bullet of mass 35 gram with a speed of $600 \\mathrm{~m} / \\mathrm{s}$. The person holding the gum can extract a maximum force of 147 N on it. The number of bullets that can be fired from the gun per second is", "image": null}, "options": [{"id": "h8Xsw", "text": "3", "image": null, "isCorrect": false}, {"id": "CpBKl", "text": "5", "image": null, "isCorrect": false}, {"id": "mdQ8m", "text": "7", "image": null, "isCorrect": true}, {"id": "JYdVY", "text": "9", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, mass of a bullet, $m = 35 \\text{ g} = 35 \\times 10^{-3} \\text{ kg}$<br><br>Speed of the bullet, $v = 600 \\text{ m/s}$<br><br>Maximum force exerted by the person, $F = 147 \\text{ N}$<br><br>Let $n$ be the number of bullets fired per second.<br><br>The force exerted by the gun is equal to the rate of change of momentum of the bullets.<br><br>$F = n \\times m \\times v$<br><br>$147 = n \\times (35 \\times 10^{-3}) \\times 600$<br><br>$147 = n \\times 21$<br><br>$n = \\dfrac{147}{21} = 7$<br><br>The number of bullets that can be fired per second is $7$.<br><br>Answer: 7", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b74bf9280d7f9932966", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A constant force acts on two different masses independently and produces accelerations $A_1$ and $A_2$. When the same force acts on their combined mass, the acceleration produced is", "image": null}, "options": [{"id": "kIjRN", "text": "$A_1-A_2$", "image": null, "isCorrect": false}, {"id": "MyUAS", "text": "$A_1+A_2$", "image": null, "isCorrect": false}, {"id": "tC71b", "text": "$\\frac{A_1 A_2}{A_1+A_2}$", "image": null, "isCorrect": true}, {"id": "qJu9S", "text": "$\\sqrt{\\mathrm{A}_1^2+\\mathrm{A}_2^2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the constant force be $F$.<br><br>When the force acts on the first mass $m_1$, the acceleration is $A_1$.<br><br>$F = m_1 A_1 \\Rightarrow m_1 = \\dfrac{F}{A_1}$<br><br>When the force acts on the second mass $m_2$, the acceleration is $A_2$.<br><br>$F = m_2 A_2 \\Rightarrow m_2 = \\dfrac{F}{A_2}$<br><br>When the same force acts on the combined mass $M = m_1 + m_2$, the acceleration is $A$.<br><br>$A = \\dfrac{F}{m_1 + m_2}$<br><br>Substituting the values of $m_1$ and $m_2$:<br><br>$A = \\dfrac{F}{\\dfrac{F}{A_1} + \\dfrac{F}{A_2}}$<br><br>$A = \\dfrac{F}{F \\left( \\dfrac{1}{A_1} + \\dfrac{1}{A_2} \\right)}$<br><br>$A = \\dfrac{1}{\\dfrac{A_1 + A_2}{A_1 A_2}}$<br><br>$A = \\dfrac{A_1 A_2}{A_1 + A_2}$<br><br>Answer: $\\frac{A_1 A_2}{A_1+A_2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b53bf9280d7f993283b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A conveyor belt is moving with constant velocity (V). Sand is being dropped on the belt at the rate of $\\mathrm{M} \\mathrm{~kg} / \\mathrm{s}$. The force necessary to keep the belt moving with a constant velocity $\\mathrm{V} \\mathrm{m} / \\mathrm{s}$ will be", "image": null}, "options": [{"id": "yJzg4", "text": "$\\frac{\\mathrm{MV}}{2} \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "F4QIl", "text": "2 MV N", "image": null, "isCorrect": false}, {"id": "zNRxg", "text": "Zero N", "image": null, "isCorrect": false}, {"id": "3te2j", "text": "MV N", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Newton's second law of motion, the force applied is equal to the rate of change of momentum.<br><br>$F = \\dfrac{dp}{dt} = \\dfrac{d(mv)}{dt}$<br><br>Since the velocity of the conveyor belt is constant, $v = V$ and $\\dfrac{dv}{dt} = 0$.<br><br>$F = v\\dfrac{dm}{dt} + m\\dfrac{dv}{dt} = V\\dfrac{dm}{dt}$<br><br>Given that sand is dropped at the rate of $M \\text{ kg/s}$, we have $\\dfrac{dm}{dt} = M$.<br><br>$F = V \\times M = MV \\text{ N}$<br><br>Answer: MV N", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b44bf9280d7f99327ad", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A child stands on a weighing machine inside a lift. When the lift is going down with acceleration $\\frac{g}{3}$, the machine shows a reading 20 N. When the lift goes upwards with acceleration $\\frac{g}{3}$, the reading would be ( $\\mathrm{g}=$ gravitational acceleration)", "image": null}, "options": [{"id": "ILtsZ", "text": "40 N", "image": null, "isCorrect": true}, {"id": "C9cFP", "text": "30 N", "image": null, "isCorrect": false}, {"id": "rWrpk", "text": "20 N", "image": null, "isCorrect": false}, {"id": "eAZFN", "text": "50 N", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $m$ be the mass of the child.<br><br>When the lift is going down with acceleration $a = \\dfrac{g}{3}$, the apparent weight is given by $W_1 = m(g - a)$.<br><br>$W_1 = m\\left(g - \\dfrac{g}{3}\\right) = \\dfrac{2mg}{3}$<br><br>Given $W_1 = 20$ N, we have:<br><br>$\\dfrac{2mg}{3} = 20 \\Rightarrow mg = 30$ N<br><br>When the lift is going upwards with acceleration $a = \\dfrac{g}{3}$, the apparent weight is given by $W_2 = m(g + a)$.<br><br>$W_2 = m\\left(g + \\dfrac{g}{3}\\right) = \\dfrac{4mg}{3}$<br><br>Substituting $mg = 30$ N:<br><br>$W_2 = \\dfrac{4}{3} \\times 30 = 40$ N<br><br>Answer: 40 N", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b34bf9280d7f9932714", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A force acting on a body of mass 5 Kg is $(4 \\hat{\\mathrm{i}}-2 \\hat{\\mathrm{j}}+3 \\hat{\\mathrm{k}}) \\mathrm{N}$. If the body is initially at rest then the magnitude of its velocity at the end of 10 second in $\\mathrm{m} / \\mathrm{s}$ will be", "image": null}, "options": [{"id": "ECnT2", "text": "$3 \\sqrt{35}$", "image": null, "isCorrect": false}, {"id": "DvrNG", "text": "$2 \\sqrt{29}$", "image": null, "isCorrect": true}, {"id": "UNiEp", "text": "$\\sqrt{19}$", "image": null, "isCorrect": false}, {"id": "KrleU", "text": "$3 \\sqrt{23}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given:<br>$\\vec{F} = 4\\hat{i} - 2\\hat{j} + 3\\hat{k}$ N<br>$m = 5$ kg<br>$t = 10$ s<br>$\\vec{u} = 0$<br><br>Acceleration $\\vec{a} = \\dfrac{\\vec{F}}{m} = \\dfrac{4\\hat{i} - 2\\hat{j} + 3\\hat{k}}{5}$<br><br>Velocity after $10$ s is given by $\\vec{v} = \\vec{u} + \\vec{a}t$<br><br>$\\vec{v} = 0 + \\left(\\dfrac{4\\hat{i} - 2\\hat{j} + 3\\hat{k}}{5}\\right) \\times 10$<br><br>$\\vec{v} = 2(4\\hat{i} - 2\\hat{j} + 3\\hat{k}) = 8\\hat{i} - 4\\hat{j} + 6\\hat{k}$<br><br>Magnitude of velocity is $|\\vec{v}| = \\sqrt{8^2 + (-4)^2 + 6^2}$<br><br>$|\\vec{v}| = \\sqrt{64 + 16 + 36} = \\sqrt{116} = 2\\sqrt{29}$ m/s<br><br>Answer: $2 \\sqrt{29}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b1fbf9280d7f993266d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which one of the following person is in an inertial frame of reference?", "image": null}, "options": [{"id": "hBEaD", "text": "A person (man) in a train which is slowing down to stop.", "image": null, "isCorrect": false}, {"id": "bPewY", "text": "A person (child) revolving in a merry-go-round.", "image": null, "isCorrect": false}, {"id": "zWvcR", "text": "A person (driver) in a bus which is moving with constant velocity.", "image": null, "isCorrect": true}, {"id": "xposv", "text": "A person (pilot) in an aeroplane which is taking off.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "An inertial frame of reference is a frame that is either at rest or moving with a constant velocity, meaning it has zero acceleration.<br><br>A train slowing down to stop is decelerating, so it is a non-inertial frame.<br><br>A merry-go-round involves circular motion, which has centripetal acceleration, making it a non-inertial frame.<br><br>An aeroplane taking off is accelerating, so it is a non-inertial frame.<br><br>A bus moving with constant velocity has zero acceleration, so it represents an inertial frame of reference.<br><br>Answer: A person (driver) in a bus which is moving with constant velocity.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ce0aee93fa0796dbaa", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "Which one of the following is 'NOT' a contact force?", "image": null}, "options": [{"id": "7gk37", "text": "Force of friction.", "image": null, "isCorrect": false}, {"id": "7ad4T", "text": "Normal reaction.", "image": null, "isCorrect": false}, {"id": "T6Szi", "text": "Gravitational force.", "image": null, "isCorrect": true}, {"id": "i2LlE", "text": "Viscous force.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Contact forces are those forces which act between two bodies when they are in physical contact with each other.<br><br>Force of friction, normal reaction, and viscous force require physical contact between the interacting bodies or layers.<br><br>Gravitational force acts between two masses separated by a distance without any physical contact. It is a non-contact force.<br><br>Answer: Gravitational force.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213840aee93fa0796d964", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "The ratio of weight of a man in a stationery lift and weight when the lift is moving downward with a uniform acceleration ' $a$ ' is $3: 2$. Then the value of ' $a$ ' is", "image": null}, "options": [{"id": "yCJcM", "text": "$\\dfrac{3}{2} \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "wpFQG", "text": "$\\dfrac{\\mathrm{g}}{3}$", "image": null, "isCorrect": true}, {"id": "9S2Io", "text": "$\\dfrac{2}{3} \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "ALuM4", "text": "g", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Weight of the man in a stationary lift is $W_1 = mg$.<br><br>Apparent weight of the man in a lift moving downward with uniform acceleration $a$ is $W_2 = m(g - a)$.<br><br>Given that the ratio of the weights is $3:2$, we have:<br><br>$\\dfrac{W_1}{W_2} = \\dfrac{3}{2}$<br><br>$\\dfrac{mg}{m(g - a)} = \\dfrac{3}{2}$<br><br>$2g = 3(g - a)$<br><br>$2g = 3g - 3a$<br><br>$3a = g$<br><br>$a = \\dfrac{g}{3}$<br><br>Answer: $\\dfrac{\\mathrm{g}}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792136d0aee93fa0796d8b8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "Which of the following person is in an inertial frame of reference?", "image": null}, "options": [{"id": "Ygi8T", "text": "A pilot in an aeroplane which is taking off.", "image": null, "isCorrect": false}, {"id": "GxdxS", "text": "A child revolving in a merry-go-round.", "image": null, "isCorrect": false}, {"id": "Q3shc", "text": "A driver in a bus which is moving with constant velocity.", "image": null, "isCorrect": true}, {"id": "6wsSt", "text": "A man in a train which is slowing down to stop.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "An inertial frame of reference is a frame that is either at rest or moving with a constant velocity, meaning its acceleration is zero.<br><br>A pilot in an aeroplane taking off experiences acceleration, making it a non-inertial frame.<br><br>A child revolving in a merry-go-round experiences centripetal acceleration, making it a non-inertial frame.<br><br>A driver in a bus moving with constant velocity has zero acceleration, making it an inertial frame.<br><br>A man in a train slowing down experiences deceleration, making it a non-inertial frame.<br><br>Answer: A driver in a bus which is moving with constant velocity.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792134b0aee93fa0796d7aa", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Two blocks of masses 6 kg and 4 kg are placed in contact with each other on a smooth surface as shown. If a force of 5 N is applied on a heavier block, the force on the lighter block is\r\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/6dm5LZYHQxoqr04qbzeZpEBa1l3iHVLZ_TUO21QV24s.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "idl6w", "text": "5 N", "image": null, "isCorrect": false}, {"id": "c3b71", "text": "4 N", "image": null, "isCorrect": false}, {"id": "nRaAC", "text": "2 N", "image": null, "isCorrect": true}, {"id": "7OGmk", "text": "1 N", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the masses of the blocks be $m_1 = 6\\text{ kg}$ and $m_2 = 4\\text{ kg}$.<br><br>The total mass of the system is $M = m_1 + m_2 = 6 + 4 = 10\\text{ kg}$.<br><br>Since the surface is smooth, the common acceleration of the system is given by:<br><br>$a = \\dfrac{F}{M} = \\dfrac{5}{10} = 0.5\\text{ m/s}^2$<br><br>The force on the lighter block is the contact force exerted by the heavier block. Let this force be $N$.<br><br>Applying Newton's second law to the lighter block ($m_2$):<br><br>$N = m_2 \\times a$<br><br>$N = 4 \\times 0.5 = 2\\text{ N}$<br><br>Answer: 2 N", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213200aee93fa0796d65c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "Two identical blocks each of mass ' $M$ ' attached to the ends of a massless inextensible string which passes over a pulley with a fixed axis as shown below. A small mass ' $m$ ' is now placed on the block B. The acceleration with which the two blocks move together is\n[ $\\mathrm{g}=$ gravitational acceleration]\n<img width=170px src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/uoYarMPlN1fhTZTyR6zJ8yum0Xbqfs6FMOGO6N9lLuQ.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "ZZW8n", "text": "$\\dfrac{\\mathrm{mg}}{2 \\mathrm{M}+\\mathrm{m}}$", "image": null, "isCorrect": true}, {"id": "TCrOs", "text": "$\\dfrac{\\mathrm{Mg}}{\\mathrm{M}+2 \\mathrm{~m}}$", "image": null, "isCorrect": false}, {"id": "dHB0O", "text": "$\\dfrac{\\mathrm{Mg}}{2 \\mathrm{M}+\\mathrm{m}}$", "image": null, "isCorrect": false}, {"id": "Cop1E", "text": "$\\dfrac{m g}{M+2 m}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $T$ be the tension in the string and $a$ be the common acceleration of the system.<br><br>The total mass on the right side is $M + m$ and it moves downwards. The equation of motion is:<br>$(M + m)g - T = (M + m)a$<br><br>The total mass on the left side is $M$ and it moves upwards. The equation of motion is:<br>$T - Mg = Ma$<br><br>Adding the two equations, we get:<br>$(M + m)g - Mg = (M + m)a + Ma$<br><br>$mg = (2M + m)a$<br><br>$a = \\dfrac{mg}{2M + m}$<br><br>Answer: $\\dfrac{\\mathrm{mg}}{2 \\mathrm{M}+\\mathrm{m}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261170279619d9d8a29bc", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}], "question": {"text": "$10^{23}$ molecules of a gas, each having a mass of $3 \\times 10^{-27} \\mathrm{~kg}$ strike per second per sq.cm of a rigid wall at an angle of $60^{\\circ}$ with the normal and rebound with a velocity of $500 \\mathrm{~m} / \\mathrm{s}$. The pressure exerted by the gas molecules on the wall is", "image": null}, "options": [{"id": "8STpk", "text": "$2000 \\mathrm{~N} / \\mathrm{m}^2$", "image": null, "isCorrect": false}, {"id": "rR63q", "text": "$500 \\mathrm{~N} / \\mathrm{m}^2$", "image": null, "isCorrect": false}, {"id": "PMRLU", "text": "$1000 \\mathrm{~N} / \\mathrm{m}^2$", "image": null, "isCorrect": false}, {"id": "DovCp", "text": "$1500 \\mathrm{~N} / \\mathrm{m}^2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to the Newton's second law of motion:\n$\\begin{aligned} & \\text { Pressure exerted on the wall }=\\frac{\\text { Rate of change of mometum } \\times \\text { no. of molecules }}{\\text { Area }} \\\\ & \\Rightarrow P=\\frac{\\left(2 m V \\cos 60^{\\circ}\\right) \\times N}{A}=\\frac{2 \\times 3 \\times 10^{-27} \\times 5 \\times 10^{-2} \\times \\cos 60^{\\circ} \\times 10^{23}}{10^{-4}} \\\\ & \\therefore P=1500 \\mathrm{~N} / \\mathrm{m}^2\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260810279619d9d8a2509", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "Force is applied to a body of mass $2 \\mathrm{~kg}$ at rest on a frictionless horizontal surface as shown in the force against time $(\\mathrm{F}-\\mathrm{t})$ graph. The speed of the body after 1 second is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/yvGnFAz2Zobo1YOM1gVR9gy-oQKqs7Y_6sIVFuy4xms.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "c4DGt", "text": "$7.5 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": true}, {"id": "I3iNY", "text": "$12.5 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "2td6S", "text": "$10 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "fKmYg", "text": "$15 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Area under the F-t graph gives change in momentum. Since the body is initially at rest, it gives the momentum of the body after 1 second.\n$$\n\\begin{aligned}\n& \\text { Area }=10 \\times 0.5+20 \\times 0.5=5+10=15 \\mathrm{~N}-\\mathrm{s} \\\\\n& \\therefore \\mathrm{mV}=15 \\mathrm{~N}-\\mathrm{s} \\\\\n& \\mathrm{V}=\\frac{15}{\\mathrm{~m}}=\\frac{15}{2}=7.5 \\mathrm{~m} / \\mathrm{s}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2605c0279619d9d8a23dd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "Three bodies P, Q and R have masses ' $\\mathrm{m}$ ' $\\mathrm{kg}$, ' $2 \\mathrm{~m}$ ' $\\mathrm{kg}$ and ' $3 \\mathrm{~m}$ ' $\\mathrm{kg}$ respectively. If all the bodies have equal kinetic energy, then greater momentum will be for body/bodies.", "image": null}, "options": [{"id": "36wHN", "text": "Q", "image": null, "isCorrect": false}, {"id": "bMLgK", "text": "R", "image": null, "isCorrect": true}, {"id": "85Jw8", "text": "P and Q", "image": null, "isCorrect": false}, {"id": "sahPg", "text": "P", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Kinetic energy $\\mathrm{k}=\\frac{\\mathrm{p}^2}{2 \\mathrm{~m}}$ where $\\mathrm{p}$ is the momentum\n$$\n\\therefore \\mathrm{p}^2=2 \\mathrm{mk} \\text { or } \\mathrm{p}=\\sqrt{2 \\mathrm{mk}}\n$$\n$\\therefore \\mathrm{p} \\propto \\sqrt{\\mathrm{m}}$\nHence body having greater mass will have greater momentum.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f660279619d9d8a1c2c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}], "question": {"text": "A body initially at rest is acted upon by a constant force (F) for time (t). The kinetic energy at time $\\mathrm{t}$ is", "image": null}, "options": [{"id": "dOUsX", "text": "$\\frac{\\mathrm{F}^{2} \\mathrm{t}^{2}}{\\mathrm{~m}}$", "image": null, "isCorrect": false}, {"id": "QYkSP", "text": "$\\left(\\frac{\\mathrm{Ft}}{\\mathrm{m}}\\right)^{2}$", "image": null, "isCorrect": false}, {"id": "IrdvR", "text": "$\\frac{\\mathrm{Ft}}{2 \\mathrm{~m}}$", "image": null, "isCorrect": false}, {"id": "9YLvY", "text": "$\\frac{\\mathrm{F}^{2} \\mathrm{t}^{2}}{2 \\mathrm{~m}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "acceleration $\\mathrm{a}=\\frac{\\mathrm{F}}{\\mathrm{m}}$\nAt time t, velocity $\\mathrm{v}=\\mathrm{at}=\\frac{\\mathrm{Ft}}{\\mathrm{m}}$\nKinetic energy $=\\frac{1}{2} \\mathrm{mv}^{2}$\n$=\\frac{1}{2} \\mathrm{~m} \\frac{\\mathrm{F}^{2} \\mathrm{t}^{2}}{\\mathrm{~m}^{2}}=\\frac{1}{2} \\frac{\\mathrm{F}^{2} \\mathrm{t}^{2}}{\\mathrm{~m}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f560279619d9d8a1ba7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "A Diwali cracker releases 25 gram gas per second, with a speed of $400 \\mathrm{~ms}^{-1}$ after\nexplosion. The force exerted by gas on the cracker is", "image": null}, "options": [{"id": "8Cwyk", "text": "100 dyne", "image": null, "isCorrect": false}, {"id": "O2nm7", "text": "16 newton", "image": null, "isCorrect": false}, {"id": "AqfO9", "text": "10 newton", "image": null, "isCorrect": true}, {"id": "XbTsi", "text": "10,000 dyne", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{F}=$ rate of change of momentum\n$=25 \\times 10^{-3} \\mathrm{~kg} / \\mathrm{s} \\times 400 \\mathrm{~m} / \\mathrm{s}$ $=10 \\mathrm{~N}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ebe0279619d9d8a16e9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f62", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "MHT CET 2017"}], "question": {"text": "An elevator of mass <math> <mi>m</mi> </math>&nbsp;is connected to a rope which pulls the elevator up with a maximum acceleration equal to <math> <mi>a</mi> </math>. If the maximum bearable tension in the rope is <math> <mi>T</mi> </math>, then for a safe journey the minimum diameter of the rope is [<math> <mi>g</mi> </math> = acceleration due to gravity]", "image": null}, "options": [{"id": "c8j8c", "text": "<math><m w></msup></mrow></mfrac></math> <br/> <math><mo>∴</mo><mi> </mi><mi> </mi><mi>T</mi><mo>=</mo><mfrac><mrow><mi>m</mi><mfenced separators=\"|\"><mrow><mi>g</mi><mo>+</mo><mi>a</mi></mrow></mfenced></mrow><mrow><mi>π</mi><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>m</mi><mfenced separators=\"|\"><mrow><mi>g</mi><mo>+</mo><mi>a</mi></mrow></mfenced></mrow><mrow><mi>π</mi><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>d</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math> <br/> <math><mo>∴</mo><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi>T</mi><mo>=</mo><mfrac><mrow><mn>4</mn><mi>m</mi><mfenced separators=\"|\"><mrow><mi>g</mi><mo>+</mo><mi>a</mi></mrow></mfenced></mrow><mrow><mi>π</mi><msup><mrow><mi>d</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math> <br/> <math><mo>∴</mo><mi> </mi><mi> </mi><mi> </mi><msup><mrow><mi>d</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mi> </mi><mfrac><mrow><mn>4</mn><mi>m</mi><mfenced separators=\"|\"><mrow><mi>g</mi><mo>+</mo><mi>a</mi></mrow></mfenced></mrow><mrow><mi>π</mi><mi>T</mi></mrow></mfrac></math> <br/> <math><mo>∴</mo><mi> </mi><mi> </mi><mi> </mi><mi>d</mi><mo>=</mo><msup><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>4</mn><mi>m</mi><mfenced separators=\"|\"><mrow><mi>g</mi><mo>+</mo><mi>a</mi></mrow></mfenced></mrow><mrow><mi>π</mi><mi>T</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f62", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "MHT CET 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e9c0279619d9d8a15d9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "If a ship of mass $4 \\times 10^{7} \\mathrm{~kg}$ initially at rest is pulled by a force of $5 \\times 10^{4} \\mathrm{~N}$ through a distance of $4 \\mathrm{~m}$, then the speed of the ship will be (resistance due to water is negligible)", "image": null}, "options": [{"id": "Qompn", "text": "$5 \\mathrm{~ms}^{-1}$", "image": null, "isCorrect": false}, {"id": "LMKRR", "text": "$1.5 \\mathrm{~ms}^{-1}$", "image": null, "isCorrect": false}, {"id": "mCSfY", "text": "$60 \\mathrm{~ms}^{-1}$", "image": null, "isCorrect": false}, {"id": "M2HMT", "text": "$0.1 \\mathrm{~ms}^{-1}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Using, $F=m a$\n$$\n\\begin{aligned}\n5 \\times 10^{4} &=4 \\times 10^{7} \\times a \\\\\n\\Rightarrow \\quad & a=\\frac{5 \\times 10^{4}}{4 \\times 10^{7}}=\\frac{5}{4} \\times 10^{-3} \\mathrm{~ms}^{-2}\n\\end{aligned}\n$$\nGiven, $s=4 \\mathrm{~m}, 4=0 \\quad \\therefore v^{2}=u^{2}+2$ as\nor\n$$\n\\begin{aligned}\n&=0+2 \\times \\frac{5}{4} \\times 4 \\times 10^{-3} \\\\\nv^{2} &=10^{-2}\n\\end{aligned}\n$$\nor\n$$\nv=0.1 \\mathrm{~ms}^{-1}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e9b0279619d9d8a15ce", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "A mass of $1 \\mathrm{~kg}$ is suspended by a string $A$. Another string $C$ is connected to its lower end as shown in figure. If a sudden jerk is given to $C$, then", "image": null}, "options": [{"id": "SApwk", "text": "the mass will start rotating", "image": null, "isCorrect": false}, {"id": "A08nC", "text": "the portion $A B$ of the string will break", "image": null, "isCorrect": false}, {"id": "366Nb", "text": "the portion $B C$ of the string will break", "image": null, "isCorrect": true}, {"id": "3xT2r", "text": "None of the string will break", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When a sudden jerk is given to $C$, an impulsive tension exceeding the breaking tension develops in $C$ first, which breaks before this impulse can reach $A$ as a wave through block.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e9b0279619d9d8a15cd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "A body of mass $2 \\mathrm{~kg}$ collides with a wall with a speed of $100 \\mathrm{~ms}^{-1}$ and rebounds with the same speed. If the time of contact is $1 / 50 \\mathrm{~s}$, the force exerted on the wall is", "image": null}, "options": [{"id": "74G4g", "text": "$8 \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "dYAMz", "text": "$2 \\times 10^{4} \\mathrm{~N}$", "image": null, "isCorrect": true}, {"id": "bc63t", "text": "$4 \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "hReh4", "text": "$10^{4} \\mathrm{~N}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We know that, $F=\\frac{d p}{d t}=\\frac{m d v}{d t}=\\frac{m \\times 2 v}{1 / 50}$\n$=\\frac{2 \\times 2 \\times 100}{1 / 50}=2 \\times 10^{4} \\mathrm{~N}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a2632a0279619d9d8a3c92", "title": "Equilibrium of Forces", "totalQuestions": 15, "questions": [{"_id": "6a44d34c8c30a4553e1be240", "type": "singleCorrect", "question": {"text": "The weight of man in lift moving in upward direction with an acceleration 'a' is $660$ N. When the lift moves in the downward direction with the same acceleration, his weight is found to be $380$ N. The real weight of the man when the lift is at rest is", "image": null}, "options": [{"id": "vjiJb", "label": "A", "text": "$400$ N", "isCorrect": false, "image": null}, {"id": "uSeU1", "label": "B", "text": "$460$ N", "isCorrect": false, "image": null}, {"id": "KDY0U", "label": "C", "text": "$520$ N", "isCorrect": true, "image": null}, {"id": "olL0G", "label": "D", "text": "$640$ N", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the mass of the man be $m$ and the acceleration of the lift be $a$.<br><br>When the lift moves upwards with acceleration $a$, the apparent weight is given by:<br><br>$W_1 = m(g + a) = 660$<br><br>When the lift moves downwards with acceleration $a$, the apparent weight is given by:<br><br>$W_2 = m(g - a) = 380$<br><br>Adding the two equations, we get:<br><br>$m(g + a) + m(g - a) = 660 + 380$<br><br>$2mg = 1040$<br><br>$mg = 520$ N<br><br>The real weight of the man when the lift is at rest is $mg = 520$ N.<br><br>Answer: $520$ N", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bdabf9280d7f9932d01", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A mass ' $M$ ' is suspended by a rope from a rigid support at point ' $P$ ' as shown in figure. Another rope is tied at end 'Q' and pulled horizontally with a force ' $F$ '. If the rope makes an angle ' $\\theta$ ' with vertical then the tension in the string ' PQ ' is\n\n<img width=250px src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/FUNWomNBp6T4Hc4v58Jq-hwutVW1EoUCK7V1LCKRm8E.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "zyY9f", "text": "$F \\sin \\theta$", "image": null, "isCorrect": false}, {"id": "DbJ8j", "text": "$\\frac{F}{\\sin \\theta}$", "image": null, "isCorrect": true}, {"id": "nk4r0", "text": "$F \\cos \\theta$", "image": null, "isCorrect": false}, {"id": "HgvNB", "text": "$\\frac{F}{\\cos \\theta}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Consider the equilibrium of point Q. The forces acting at point Q are:<br>1. Tension $T$ in the string PQ, acting at an angle $\\theta$ with the vertical.<br>2. Horizontal force $F$ pulling to the right.<br>3. Downward force due to the suspended mass $M$, which is $Mg$.<br><br>Resolving the tension $T$ into horizontal and vertical components:<br>Horizontal component of tension = $T \\sin \\theta$ (acting towards the left)<br>Vertical component of tension = $T \\cos \\theta$ (acting upwards)<br><br>For the system to be in equilibrium, the net force in the horizontal direction must be zero. Therefore, the horizontal component of the tension must balance the applied horizontal force $F$:<br>$T \\sin \\theta = F$<br><br>Rearranging the equation to solve for $T$, we get:<br>$T = \\dfrac{F}{\\sin \\theta}$<br><br>Answer: $\\frac{F}{\\sin \\theta}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b87bf9280d7f9932a17", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Two bodies of mass 10 kg and 5 kg are moving in concentric circular orbits of radii ' R ' and ' r ' respectively such that their periods are same. The ratio between their centripetal acceleration is", "image": null}, "options": [{"id": "xPUQG", "text": "$\\mathrm{R} / \\mathrm{r}$", "image": null, "isCorrect": true}, {"id": "8Nkuy", "text": "$\\mathrm{r} / \\mathrm{R}$", "image": null, "isCorrect": false}, {"id": "ieExL", "text": "$\\mathrm{R}^2 / \\mathrm{r}^2$", "image": null, "isCorrect": false}, {"id": "hhiYP", "text": "$\\mathrm{r}^2 / \\mathrm{R}^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The centripetal acceleration of a body moving in a circular orbit of radius $r$ with angular velocity $\\omega$ is given by $a = r\\omega^2$.<br><br>Since the time periods of both bodies are the same ($T_1 = T_2 = T$), their angular velocities are also the same, as $\\omega = \\dfrac{2\\pi}{T}$.<br><br>For the first body of mass $10$ kg in an orbit of radius $R$, the centripetal acceleration is $a_1 = R\\omega^2$.<br><br>For the second body of mass $5$ kg in an orbit of radius $r$, the centripetal acceleration is $a_2 = r\\omega^2$.<br><br>The ratio of their centripetal accelerations is:<br><br>$\\dfrac{a_1}{a_2} = \\dfrac{R\\omega^2}{r\\omega^2} = \\dfrac{R}{r}$<br><br>Answer: $\\mathrm{R} / \\mathrm{r}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b84bf9280d7f99329f6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The weight of man in a stationary lift is $\\mathrm{w}_1$ and when it is moving downwards with uniform acceleration ' $a$ ' is $w_2$. If the ratio $\\mathrm{w}_1: \\mathrm{w}_2=4: 3$, then the value of ' a ' is ( $\\mathrm{g}=$ acceleration due to gravity)", "image": null}, "options": [{"id": "9zaqb", "text": "$\\frac{g}{3}$", "image": null, "isCorrect": false}, {"id": "7Bo67", "text": "$\\frac{g}{4}$", "image": null, "isCorrect": true}, {"id": "wIx0y", "text": "$\\frac{3}{4} \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "dHJE9", "text": "$\\frac{4}{g}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The weight of the man in a stationary lift is $w_1 = mg$.<br><br>The apparent weight of the man when the lift is moving downwards with uniform acceleration $a$ is $w_2 = m(g - a)$.<br><br>Given that $\\dfrac{w_1}{w_2} = \\dfrac{4}{3}$.<br><br>Substituting the values, we get $\\dfrac{mg}{m(g - a)} = \\dfrac{4}{3}$.<br><br>$\\dfrac{g}{g - a} = \\dfrac{4}{3}$<br><br>$3g = 4g - 4a$<br><br>$4a = g$<br><br>$a = \\dfrac{g}{4}$<br><br>Answer: $\\frac{g}{4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b83bf9280d7f99329f3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The figure shows two masses ' m ' and ' M ' connected by a light string that passes through a small hole 'O' at the centre of the table. Mass ' m ' is moved round in a horizontal circle with 'O' as the centre. The frequency with which ' m ' should be revolved so that ' M ' remains stationary is\n(g = gravitational acceleration)\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/fvMU_5Pv6QaSdAcMOMwSHwTyt6YPj8HmNB6p06XqvG0.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "J5ytz", "text": "$\\frac{1}{\\pi} \\sqrt{\\frac{\\mathrm{ML}}{\\mathrm{mg}}}$", "image": null, "isCorrect": false}, {"id": "zbC8s", "text": "$\\frac{1}{2 \\pi} \\sqrt{\\frac{\\mathrm{Mg}}{\\mathrm{mL}}}$", "image": null, "isCorrect": true}, {"id": "9X0qN", "text": "$\\frac{1}{\\pi} \\sqrt{\\frac{\\mathrm{Mg}}{\\mathrm{mL}}}$", "image": null, "isCorrect": false}, {"id": "r1cmd", "text": "$\\frac{1}{2 \\pi} \\sqrt{\\frac{\\mathrm{ML}}{\\mathrm{mg}}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the mass $M$ to remain stationary, the tension $T$ in the string must balance its weight:<br><br>$T = Mg$<br><br>For the mass $m$ revolving in a horizontal circle of radius $L$, the necessary centripetal force is provided by the tension $T$ in the string. If $\\omega$ is the angular velocity of mass $m$, then:<br><br>$T = m \\omega^2 L$<br><br>Equating the two expressions for tension, we get:<br><br>$Mg = m \\omega^2 L$<br><br>Since angular velocity $\\omega = 2 \\pi f$, where $f$ is the frequency of revolution, we can substitute this into the equation:<br><br>$Mg = m (2 \\pi f)^2 L$<br><br>$Mg = 4 \\pi^2 m f^2 L$<br><br>Solving for $f^2$:<br><br>$f^2 = \\dfrac{Mg}{4 \\pi^2 mL}$<br><br>Taking the square root on both sides, we get the frequency:<br><br>$f = \\dfrac{1}{2 \\pi} \\sqrt{\\dfrac{Mg}{mL}}$<br><br>Answer: $\\frac{1}{2 \\pi} \\sqrt{\\frac{\\mathrm{Mg}}{\\mathrm{mL}}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214080aee93fa0796dd6e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "The pulleys and strings shown in figure are smooth and of negligible mass. For the system to remain in equilibrium, angle $\\theta$ should be\r\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/gciv6csMpxmIEMjjyQOMIB8axbpEYKx_RyahzP-6HwM.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "VpxWD", "text": "$\\quad \\cos ^{-1}(1)$", "image": null, "isCorrect": false}, {"id": "L8oKg", "text": "$\\quad \\cos ^{-1}\\left(\\frac{\\sqrt{3}}{2}\\right)$", "image": null, "isCorrect": false}, {"id": "SnLsB", "text": "$\\cos ^{-1}\\left(\\frac{1}{2}\\right)$", "image": null, "isCorrect": false}, {"id": "Ubsst", "text": "$\\quad \\cos ^{-1}\\left(\\frac{1}{\\sqrt{2}}\\right)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $T$ be the tension in the string.<br><br>For the hanging masses $M$ to be in equilibrium, the tension in the string must balance their weight.<br><br>$T = Mg$<br><br>For the central mass $\\sqrt{2}M$ to be in equilibrium, the net vertical force must be zero. The upward components of the tension from both sides of the string balance the downward weight of the central mass.<br><br>From the given figure, the angle between the upward vertical and the string is $\\theta$. By symmetry, the string on the other side also makes an angle $\\theta$ with the vertical.<br><br>The total upward force is $2T \\cos\\theta$.<br><br>Equating the upward force to the downward weight of the central mass:<br><br>$2T \\cos\\theta = \\sqrt{2}Mg$<br><br>Substituting $T = Mg$ into the equation:<br><br>$2(Mg) \\cos\\theta = \\sqrt{2}Mg$<br><br>$2 \\cos\\theta = \\sqrt{2}$<br><br>$\\cos\\theta = \\dfrac{\\sqrt{2}}{2} = \\dfrac{1}{\\sqrt{2}}$<br><br>$\\theta = \\cos^{-1}\\left(\\dfrac{1}{\\sqrt{2}}\\right)$<br><br>Answer: $\\quad \\cos ^{-1}\\left(\\frac{1}{\\sqrt{2}}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213360aee93fa0796d700", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "The mass of the lift is 200 kg , when it ascends with an acceleration of $4 \\mathrm{~m} / \\mathrm{s}^2$ then the tension in the cable supporting the lift will be [Given: Acceleration due to gravity $\\left.g=10 \\mathrm{~m} / \\mathrm{s}^2\\right]$", "image": null}, "options": [{"id": "eZkEL", "text": "800 N", "image": null, "isCorrect": false}, {"id": "w6ssU", "text": "2800 N", "image": null, "isCorrect": true}, {"id": "x0sWt", "text": "4200 N", "image": null, "isCorrect": false}, {"id": "8dB8p", "text": "2000 N", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $T$ be the tension in the cable supporting the lift.<br><br>The forces acting on the lift are the tension $T$ upwards and the weight $mg$ downwards.<br><br>Using Newton's second law of motion for the lift moving upwards with acceleration $a$:<br><br>$T - mg = ma$<br><br>$T = m(g + a)$<br><br>Substituting the given values $m = 200 \\mathrm{~kg}$, $g = 10 \\mathrm{~m/s}^2$, and $a = 4 \\mathrm{~m/s}^2$:<br><br>$T = 200(10 + 4)$<br><br>$T = 200 \\times 14$<br><br>$T = 2800 \\mathrm{~N}$<br><br>Answer: 2800 N", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262080279619d9d8a3143", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "In a conical pendulum the bob of mass ' $\\mathrm{m}$ ' moves in a horizontal circle of radius ' $r$ ' with uniform speed ' $V$ '. The string of length ' $L$ ' describes a cone of semi vertical angle ' $\\theta$ '. The centripetal force acting on the bob is ( $\\mathrm{g}=$ acceleration due to gravity)", "image": null}, "options": [{"id": "GyGoJ", "text": "$\\frac{\\mathrm{mgr}}{\\sqrt{\\mathrm{L}^2-\\mathrm{r}^2}}$", "image": null, "isCorrect": true}, {"id": "CQGd8", "text": "$\\frac{\\mathrm{mgr}}{\\left(\\mathrm{L}^2-\\mathrm{r}^2\\right)}$", "image": null, "isCorrect": false}, {"id": "fRiMQ", "text": "$\\frac{\\sqrt{\\mathrm{L}^2-\\mathrm{r}^2}}{\\mathrm{mgL}}$", "image": null, "isCorrect": false}, {"id": "JWtkH", "text": "$\\frac{\\mathrm{mgL}}{\\sqrt{\\mathrm{L}^2-\\mathrm{r}^2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{T} \\cos \\theta=\\mathrm{mg} \\\\ & \\sin \\theta=\\frac{\\mathrm{r}}{\\mathrm{L}} \\\\ & \\cos \\theta=\\frac{\\sqrt{\\mathrm{L}^2-\\mathrm{r}^2}}{\\mathrm{~L}}\\end{aligned}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/ybF9q_h7rU_ViP3rnRiUmih3kwbbEiHMZ2C5QLoFp34.original.fullsize.png\"><br>\n$\\begin{aligned} \\therefore \\quad \\mathrm{T} & =\\frac{\\mathrm{mg}}{\\cos \\theta}=\\frac{\\mathrm{mgL}}{\\sqrt{\\mathrm{L}^2-\\mathrm{r}^2}} \\\\ \\mathrm{mr} \\omega^2 & =\\mathrm{T} \\sin \\theta \\\\ \\frac{\\mathrm{T} \\times \\mathrm{r}}{\\mathrm{L}} & =\\mathrm{m}^2 ...(\\sin \\theta= \\frac{r}{L}) \\\\ \\omega^2 & =\\frac{\\mathrm{g}}{\\sqrt{\\mathrm{L}^2-\\mathrm{r}^2}}\\end{aligned}$\n$\\therefore \\quad$ The centripetal force is\n$\\mathrm{F}=\\frac{\\mathrm{mgr}}{\\sqrt{\\mathrm{L}^2-\\mathrm{r}^2}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260380279619d9d8a22b8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "The weight of a man in a lift moving upwards with an acceleration ' $a$ ' is $620 \\mathrm{~N}$. When the lift moves downwards with the same acceleration, his weight is found to be $340 \\mathrm{~N}$. The real weight of the man is", "image": null}, "options": [{"id": "AvzHB", "text": "$620 \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "5TS30", "text": "$680 \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "HHex6", "text": "$380 \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "XtoYd", "text": "$480 \\mathrm{~N}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\mathrm{m}(\\mathrm{g}+\\mathrm{a})=620 \\mathrm{~N} \\\\\n& \\mathrm{~m}(\\mathrm{~g}-\\mathrm{a})=340 \\mathrm{n} \\\\\n& \\Rightarrow \\frac{\\mathrm{g}+\\mathrm{a}}{\\mathrm{g}-\\mathrm{a}}=\\frac{620}{340} \\\\\n& \\mathrm{a}=\\frac{7}{24} \\mathrm{~g}\n\\end{aligned}\n$$\nHence, from eq.(i) actual weight\n$$\n\\mathrm{mg}=480 \\mathrm{~N}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f090279619d9d8a1940", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}], "question": {"text": "An aircraft is moving with uniform velocity 150 m/s in the space. If all forces acting on it are balanced, then it will", "image": null}, "options": [{"id": "tAVXE", "text": "Keep moving with same velocity", "image": null, "isCorrect": true}, {"id": "e0rBd", "text": "Remain floating at its place", "image": null, "isCorrect": false}, {"id": "u8xvA", "text": "Escape in space", "image": null, "isCorrect": false}, {"id": "tknuK", "text": "Fall down on earth", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As all the forces acting on the aircraft are balanced, so the net force on it will be zero, i.e., no external force act on it. Thus, the aircraft will keep moving with the same velocity of 150 m/s in the space.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e9c0279619d9d8a15d5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "An elevator is moving vertically up with an acceleration $a$ the force exerted on the floor by a passenger of mass $m$ is", "image": null}, "options": [{"id": "Pr5i0", "text": "$m g$", "image": null, "isCorrect": false}, {"id": "oNUyk", "text": "$m a$", "image": null, "isCorrect": false}, {"id": "euUKz", "text": "$m g-m a$", "image": null, "isCorrect": false}, {"id": "yYFeQ", "text": "$m g+m a$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$R=m(g+a)=m g+m a$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e9c0279619d9d8a15d4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "The minimum acceleration with which a fireman can slide down a rope of breaking strength two-third of his weight is", "image": null}, "options": [{"id": "yDt39", "text": "zero", "image": null, "isCorrect": false}, {"id": "pYDU4", "text": "$\\frac{g}{3}$", "image": null, "isCorrect": true}, {"id": "T9MOx", "text": "$3 \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "tq78Y", "text": "$g$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If fireman slides down with some acceleration then its apparent weight decreases. For critical condition rope can bear only $\\frac{2}{3}$ of the fireman's weight. Let $a$ is the minimum acceleration then,\nTension in the rope $=m(g-a)=$ Breaking strength\n$$\n\\begin{array}{ll}\n\\Rightarrow & m(g-a)=\\frac{2}{3} m g \\\\\n\\Rightarrow &=g-\\frac{2 g}{3}=\\frac{g}{3}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e9b0279619d9d8a15d0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "A plumb bob is hanging from the ceiling of car. If the car move with acceleration $a$, the angle made by the string with the vertical is", "image": null}, "options": [{"id": "xTi6r", "text": "$\\tan ^{-1}\\left(\\frac{a}{g}\\right)$", "image": null, "isCorrect": true}, {"id": "TU9bD", "text": "$\\tan ^{-1}\\left(\\frac{g}{a}\\right)$", "image": null, "isCorrect": false}, {"id": "j7djv", "text": "$\\cos ^{-1}\\left(\\frac{g}{a}\\right)$", "image": null, "isCorrect": false}, {"id": "YCFRi", "text": "$\\cos ^{-1}\\left(\\frac{a}{g}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When car moves towards right with acceleration $a$ then due to Pseudo force the bob will tilt in backward direction making an angle $\\theta$ with vertical.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/lkvv74DXpXuUnuOKSPRxAZVlk8y5QFZw7YKrF_FxgbU.original.fullsize.png\"><br>\\\n$$\\theta=\\tan ^{-1}\\left(\\frac{a}{g}\\right)$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e9b0279619d9d8a15cc", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "Two blocks $A$ and $B$ each of $20 \\mathrm{~kg}$ lying on a frictionless table are connected by a light string. The system is pulled horizontally with an acceleration of $2 \\mathrm{~ms}^{-2}$ by a force $F$ on $B$. The tension in the string will be", "image": null}, "options": [{"id": "PrsIf", "text": "$10 \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "uKWyQ", "text": "$40 \\mathrm{~N}$", "image": null, "isCorrect": true}, {"id": "1ShKf", "text": "$100 \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "Sfh1Z", "text": "$120 \\mathrm{~N}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given situation can be shown as\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/-8EnUKRvORS9I5WMMh0w_DYraqyebAqy0nJfSQSK620.original.fullsize.png\"><br>\n$\\text { The tension } T=M_{A} \\times a$\nhere,\n$\\begin{aligned}\nM_{A} &=20 \\mathrm{~kg} \\text { and } a=2 \\mathrm{~ms}^{-2} \\\\\nT &=20 \\times 2=40 \\mathrm{~N}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn"
