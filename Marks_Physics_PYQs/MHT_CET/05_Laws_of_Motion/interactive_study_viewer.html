ext": "A car is driven on the banked road of radius of curvature $20 \\mathrm{~m}$ with maximum safe speed. In order to increase its safety speed by $10 \\%$, the increase in the radius of curvature will be\n[Angle of banking and friction is unchanged in both the cases.]", "image": null}, "options": [{"id": "DQzES", "text": "4.2 m", "image": null, "isCorrect": true}, {"id": "kFEgG", "text": "6.1 m", "image": null, "isCorrect": false}, {"id": "OrY1L", "text": "24.2 m", "image": null, "isCorrect": false}, {"id": "rtQnF", "text": "12.1 m", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For road safety on a banked road, the velocity of the car has following scaling relation with respect to the curvature:\n$v^2 \\propto R$\nSo,\n$v^2=C R---(1)$\nwhere $C$ is a constant that involves the banking angle and friction.\nIf the new velocity is $v^{\\prime}=1.1 v$ as $10 \\%$ higher speed, then\n$v^{\\prime 2}=C R^{\\prime}---(2)$\nwhere, $R^{\\prime}$ is the new radius of curvature due to safely.\nNow, take the ratio of equation (1) and (2)\n$\\begin{aligned}\n& \\left(\\frac{v^{\\prime}}{v}\\right)^2=\\frac{R^{\\prime}}{R} \\\\\n& \\Rightarrow(1.1)^2=\\frac{R^{\\prime}}{R} \\\\\n& \\Rightarrow \\frac{(1.1)^2-1}{1}=\\frac{R^{\\prime}-R}{R}\n\\end{aligned}$\n$\\begin{aligned} & \\Rightarrow \\frac{0.21}{1}=\\frac{\\left(R^{\\prime}-R\\right)}{R} \\\\ & \\Rightarrow\\left(R^{\\prime}-R\\right)=0.21 R=0.21 \\times 20 \\mathrm{~m}=4.2 \\mathrm{~m}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261390279619d9d8a2acd", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "A road is 10 metre wide. Its radius of curvature is 50 metre. The outer edge is above the inner edge by a distance of 1.5 metre. This road is most suited for the velocity $\\left[\\mathrm{g}=9.8 \\mathrm{~m} / \\mathrm{s}^2\\right.$ ]", "image": null}, "options": [{"id": "i701F", "text": "$2.5 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "gTURC", "text": "$6.5 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "WzVYK", "text": "$4.5 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "FA36X", "text": "$8.5 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Consider the free body diagram below:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/aCFQVkWRrVymf9qonAALAunRq4_MmW03d3X0_H85ew4.original.fullsize.png\">\nBy taking vertical and horizontal force balance:\n$\\mathrm{N} \\sin \\alpha=\\mathrm{mv}^2 / \\mathrm{R} \\& \\mathrm{~N} \\cos \\alpha=\\mathrm{mg}$\nThe banking angle of the road can be written as: $\\tan \\alpha=\\frac{\\mathrm{v}^2}{\\mathrm{Rg}}=\\frac{\\mathrm{h}}{\\mathrm{w}}$\n$\\therefore \\mathrm{v}=\\sqrt{\\frac{\\mathrm{Rgh}}{\\mathrm{w}}}=\\sqrt{\\frac{50 \\mathrm{~m} \\times 1.5 \\mathrm{~m} \\times 9.8 \\mathrm{~m} / \\mathrm{s}^2}{10 \\mathrm{~m}}}=8.57 \\mathrm{~m} / \\mathrm{s}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261290279619d9d8a2a4f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "When the bob of mass ' $m$ ' moves in a horizontal circle of radius ' $r$ ' with uniform speed ' $v$ ' having length of string ' $L$ ' describes a cone of semi vertical angle ' $q$ ' the centripetal force acting on the bob is given by\n[g = acceleration due to gravity.]", "image": null}, "options": [{"id": "687Pv", "text": "$\\frac{\\mathrm{mgL}}{\\sqrt{\\mathrm{L}^2-\\mathrm{r}^2}}$", "image": null, "isCorrect": false}, {"id": "ieErW", "text": "$\\frac{\\sqrt{\\mathrm{L}^2-\\mathrm{r}^2}}{\\mathrm{mgL}}$", "image": null, "isCorrect": false}, {"id": "NolF8", "text": "$\\frac{\\operatorname{mgr}}{\\sqrt{\\mathrm{L}^2-\\mathrm{r}^2}}$", "image": null, "isCorrect": true}, {"id": "JOCjC", "text": "$\\frac{\\mathrm{mgr}}{\\mathrm{L}^2-\\mathrm{r}^2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Consider the figure below:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/eoQTYHszDWniDbRshMS_YU0ar1hQ1oEjq2PGM97KnbY.original.fullsize.png\">\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/MxFjDA1BYK3YKvw5M-1ChXdLES2zl7V9UTKmuBnaaDk.original.fullsize.png\">\nOn taking the ratio of equation (1) and (2):\nCentripetal force $=\\mathrm{mg} \\tan \\theta$\nFrom geometry, $\\tan \\theta=\\frac{\\mathrm{r}}{\\sqrt{\\mathrm{L}^2-\\mathrm{r}^2}}$\n$\\therefore$ Centripetal force $=\\frac{\\mathrm{mgr}}{\\sqrt{\\mathrm{L}^2-\\mathrm{r}^2}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260de0279619d9d8a27f2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}], "question": {"text": "A van is moving with a speed of $108 \\mathrm{~km} / \\mathrm{hr}$ on a level road where the coefficient of friction between the tyres and the road is 0.5 . For the safe driving of the van, the minimum radius of curvature of the road shall be\n(Acceleration due to gravity, $g=10 \\mathrm{~m} / \\mathrm{s}^2$ )", "image": null}, "options": [{"id": "63vly", "text": "$40 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "lL55M", "text": "$180 \\mathrm{~m}$", "image": null, "isCorrect": true}, {"id": "LzMq9", "text": "$120 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "Qg5Nn", "text": "$80 \\mathrm{~m}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The correct option is (B).\nConcept: For safe driving, the centripetal force must be less than limiting friction otherwise the vehicle will skid away from the road.\nMathematically it can be written as\n$\\frac{\\mathrm{mv}}{\\mathrm{r}} \\leq \\mu \\mathrm{mg}$\nwhere $m$ is the mass, $v$ is the velocity, $\\mu$ is the coefficient of friction and $g$ is the acceleration due to gravity.\nOn plugging the values given in the question,\n$r_{\\min }=\\frac{v^2}{\\mu g}=\\frac{30^2}{0.5 \\times 10}=180 \\mathrm{~m}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2606b0279619d9d8a2459", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "A bob of a simple pendulum of mass ' $\\mathrm{m}$ ' is displaced through $90^{\\circ}$ from mean position and released. When the bob is at lowest position, the tension in the string is", "image": null}, "options": [{"id": "WCkyO", "text": "4mg", "image": null, "isCorrect": false}, {"id": "wsa9T", "text": "2mg", "image": null, "isCorrect": false}, {"id": "8J7zf", "text": "mg", "image": null, "isCorrect": false}, {"id": "wGK2Z", "text": "3mg", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "When it is displaced through $90^{\\circ}$ from mean position, it is at a height ' $r$ ' and has potential energy mgr. At the lowest position this potential energy is converted into kinetic energy.\n$$\n\\begin{aligned}\n& \\therefore \\frac{1}{2} \\mathrm{mv}^2=\\mathrm{mgr} \\\\\n& \\therefore \\mathrm{mv}^2=\\mathrm{mgr}\n\\end{aligned}\n$$\nAt the lowest position the tension in the string\n$$\n\\mathrm{T}=\\mathrm{mg}+\\frac{\\mathrm{mv}^2}{\\mathrm{r}}=\\mathrm{mg}+2 \\mathrm{mg}=3 \\mathrm{mg}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2605b0279619d9d8a23d3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "The angel of banking ' $\\theta$ ' for a meter gauge railway line is $\\theta=\\tan ^{-1}\\left(\\frac{1}{20}\\right)$. What is the elevation of the outer rail above the inner rail?", "image": null}, "options": [{"id": "vetYf", "text": "20 cm", "image": null, "isCorrect": false}, {"id": "1KVy1", "text": "10 cm", "image": null, "isCorrect": false}, {"id": "QJNah", "text": "0.2 cm", "image": null, "isCorrect": false}, {"id": "oRdrF", "text": "5 cm", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/S9HA24S7byqsFj9eV3tJpH5Kiy9cgZUCw2q7tm9lRT4.original.fullsize.png\"><br>\n$\\begin{aligned} & \\tan \\theta=\\frac{1}{20}=\\frac{\\mathrm{h}}{1} \\\\ & \\therefore \\mathrm{h}=\\frac{1}{20} \\mathrm{~m}=0.05=5 \\mathrm{~cm}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260490279619d9d8a233e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "A particle moves in a circular orbit of radius ' $r$ ' under a central attractive force, $\\mathrm{F}=-\\frac{\\mathrm{k}}{\\mathrm{r}}$, where $\\mathrm{k}$ is a constant. The periodic time of tis motion is", "image": null}, "options": [{"id": "JVqXa", "text": "$\\mathrm{r}^{\\frac{1}{2}}$", "image": null, "isCorrect": false}, {"id": "evG7Q", "text": "$\\mathrm{r}^{\\frac{2}{3}}$", "image": null, "isCorrect": false}, {"id": "3yTas", "text": "$\\mathrm{r}$", "image": null, "isCorrect": true}, {"id": "w0uzc", "text": "$\\mathrm{r}^{\\frac{3}{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\operatorname{mr} \\omega^2=\\frac{\\mathrm{k}}{\\mathrm{r}}\n$$\n$$\n\\omega^2=\\frac{\\mathrm{k}}{\\mathrm{mr}}\n$$\n$$\n\\omega^2 \\propto \\frac{1}{r^2}\n$$\n$\\omega \\propto \\frac{1}{\\mathrm{r}}$\n$$\n\\therefore \\mathrm{T} \\propto \\mathrm{r}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fb00279619d9d8a1e7c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "In non - uniform circular motion, the ratio of tangential to radial acceleration is $(\\mathrm{r}=$ radius, $\\propto=$ angular acceleration, $\\mathrm{V}=$ linear velocity)", "image": null}, "options": [{"id": "ZKBFI", "text": "$\\frac{r \\propto}{V}$", "image": null, "isCorrect": false}, {"id": "P9fak", "text": "$\\frac{\\mathrm{V}^{2}}{\\boldsymbol{r} \\alpha}$", "image": null, "isCorrect": false}, {"id": "V2CxC", "text": "$\\frac{r^{2} \\alpha}{V^{2}}$", "image": null, "isCorrect": true}, {"id": "dALw5", "text": "$\\frac{r \\propto^{2}}{\\mathrm{~V}^{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Tangential acceleration $=a=\\alpha r$\nRadial acceleration $=\\frac{\\mathrm{V}^{2}}{\\mathrm{r}}$\n$\\therefore(1) \\div(2) \\quad \\frac{\\alpha r \\times r}{V^{2}}=\\frac{\\alpha r^{2}}{V^{2}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f8c0279619d9d8a1d62", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "A train has to negotiate a curve of radius 'r' $\\mathrm{m}$, the distance between the rails is\n${ }^{\\prime}{ }^{\\prime} \\mathrm{m}$ and outer rail is raised above inner rail by distance of ' $\\mathrm{h}^{\\prime} \\mathrm{m}$. If the angle of\nbanking is small, the safety speed limit on this banked road is", "image": null}, "options": [{"id": "edJvG", "text": "$\\sqrt{\\operatorname{rg}\\left(\\frac{h}{\\ell}\\right)}$", "image": null, "isCorrect": true}, {"id": "eqSgA", "text": "$\\operatorname{rg} \\frac{h}{\\ell}$", "image": null, "isCorrect": false}, {"id": "rfuF9", "text": "$\\frac{\\left(\\frac{h}{\\ell}\\right)^{2}}{r g}$", "image": null, "isCorrect": false}, {"id": "wW3lD", "text": "$\\left(\\operatorname{rg} \\frac{h}{\\ell}\\right)^{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\frac{\\mathrm{mv}^{2}}{\\mathrm{r}}=\\mu \\mathrm{R}=\\mu \\mathrm{mg}$\n$\\mathrm{v}^{2}=\\mu \\mathrm{gr}$\n$\\mathrm{v}=\\sqrt{\\mu \\mathrm{gr}}=\\sqrt{\\tan \\theta \\mathrm{gr}}=\\sqrt{\\sin \\theta \\mathrm{g} \\mathrm{r}}$$[$ For small angle of $\\theta]$\n$=\\sqrt{\\mathrm{gr} \\frac{\\mathrm{h}}{\\ell}}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/8sqLnDMYjVQzIxmZxpU39e_AqpzamTIqWnKxlf9bgwI.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f1d0279619d9d8a19df", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}], "question": {"text": "A heavy mass is attached at one end of a thin wire and whirled in a vertical circle. The chances of breaking the wire are maximum when", "image": null}, "options": [{"id": "SGDfC", "text": "the wire is horizontal.", "image": null, "isCorrect": false}, {"id": "vA6Co", "text": "the mass is at the lowest point of the circle.", "image": null, "isCorrect": true}, {"id": "ik1IV", "text": "the wire makes an angle of $60^{\\circ}$ with the horizontal.", "image": null, "isCorrect": false}, {"id": "pCO2O", "text": "the mass is at the highest point of the circle.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When the mass is at the lowest point.\nExplanation $\\Rightarrow$ The Force acting on the Particles will be maximum in case of the Vertical circle when the Force acting will be in the direction of its tension force of string.\nWhen this situation arises then,\nTension $(\\mathrm{T})=\\frac{\\mathrm{mv}^{2}}{\\mathrm{r}}$\n$\\therefore$ Force will be maximum at this position and there will likely be more chances to break.\nThis case will be there when the mass is at the lowest position.\n$\\therefore$ Option (b). is correct.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f1a0279619d9d8a19cc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}], "question": {"text": "A ball of mass 'm' is attached to the free end of an inextensible string of length ' $\\ell$ '.\nLet 'T' be the tension in the string. The ball is moving in horizontal circular path\nabout the vertical axis. The angular velocity of the ball at any particular instant will\nbe", "image": null}, "options": [{"id": "gbuwI", "text": "$\\sqrt{\\frac{\\mathrm{T}}{\\mathrm{m} \\ell}}$", "image": null, "isCorrect": true}, {"id": "TPuUG", "text": "$\\sqrt{\\frac{\\mathrm{T} \\ell}{\\mathrm{m}}}$", "image": null, "isCorrect": false}, {"id": "wBCyv", "text": "$\\sqrt{\\frac{\\mathrm{m} \\ell}{\\mathrm{T}}}$", "image": null, "isCorrect": false}, {"id": "xjeGJ", "text": "$\\sqrt{\\frac{\\mathrm{Tm}}{\\ell}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A ball of mass ' $m$ ' is attached to the free end of an inextensible string of length 'I'. Let 'T' be the tension in the string. The ball is moving in horizontal circular path about the vertical axis. The angular velocity of the ball at any particular instant will be $\\sqrt{\\frac{T}{m l}}$.\nExplanation:\n$$\n\\begin{array}{l}\n\\mathrm{T}=\\mathrm{ml} \\omega^{2} \\\\\n\\therefore \\omega=\\sqrt{\\frac{T}{m l}}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ee00279619d9d8a1802", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}], "question": {"text": "A stone of mass <math><mn>1</mn><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi></math> is tied to a string <math><mn>2</mn><mi mathvariant=\"normal\">m</mi></math> long and is rotated at a constant speed of <math><mn>40</mn><mi mathvariant=\"normal\"></mi><msup><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> in a vertical circle. The ratio of the tension at the top and the bottom is [Take <math><mi mathvariant=\"normal\">g</mi><mo>=</mo><mn>10</mn><mi mathvariant=\"normal\"></mi><msup><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></math> ]", "image": null}, "options": [{"id": "rz7BV", "text": "<math><mfrac><mrow><mn>81</mn></mrow><mrow><mn>79</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "5VzJ2", "text": "<math><mfrac><mrow><mn>79</mn></mrow><mrow><mn>81</mn></mrow></mfrac></math>", "image": null, "isCorrect": </msup></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "iLu65", "text": "<math> <mrow> <mfrac> <mrow> <mi>α</mi><msup> <mi>r</mi> <mn>2</mn> </msup> </mrow> <mrow> <msup> <mi>u</mi> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "VM3G4", "text": "<math><mfrac><mrow><msup><mrow><mi>u</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>α</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Tangential acceleration <math> <mrow> <mo>=</mo><mi>α</mi><mi>r</mi></mrow> </math><br />Radial acceleration <math> <mrow> <mo>=</mo><mfrac> <mrow> <msup> <mi>u</mi> <mn>2</mn> </msup> </mrow> <mi>r</mi> </mfrac></mrow></math><br />Ratio <math> <mrow> <mo>=</mo><mfrac> <mrow> <mi>α</mi><mi>r</mi></mrow> <mrow> <msup> <mi>u</mi> <mn>2</mn> </msup> <mo>/</mo><mi>r</mi></mrow> </mfrac> <mo>=</mo><mfrac> <mrow> <mi>α</mi><msup> <mi>r</mi> <mn>2</mn> </msup> </mrow> <mrow> <msup> <mi>u</mi> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </math><br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e840279619d9d8a1514", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "A ball of mass $0.25 \\mathrm{~kg}$ attached to the end of a string of length $1.96 \\mathrm{~m}$ is moving in a horizontal circle. The string will break if the tension is more than $25 \\mathrm{~N}$. What is the maximum speed with which ball can be moved?", "image": null}, "options": [{"id": "gE7mT", "text": "$14 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": true}, {"id": "aRTdo", "text": "$3 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "SB3lK", "text": "$3.92 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "N4Zib", "text": "$5 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Tension of string $T=\\frac{m v^{2}}{r}$\n$$\n25=\\frac{0.25 \\times v^{2}}{1.96}\n$$\n$$\nv=14 \\mathrm{~m} / \\mathrm{s}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e840279619d9d8a1512", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "A car of mass $1500 \\mathrm{~kg}$ is moving with a speed of $12.5 \\mathrm{~m} / \\mathrm{s}$ on a circular path of radius $20 \\mathrm{~m}$ on a level road. What should be the coefficient of friction between the car and the road, so that the car does not slip?", "image": null}, "options": [{"id": "xSDyB", "text": "$0.2$", "image": null, "isCorrect": false}, {"id": "9668p", "text": "$0.4$", "image": null, "isCorrect": false}, {"id": "pPFF1", "text": "$0.6$", "image": null, "isCorrect": false}, {"id": "I0mZ7", "text": "$0.8$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In this case centripetal force provides by friction\n$\\therefore$\n$$\n\\frac{m v^{2}}{r}=\\mu m g\n$$\ni. $e$,\n$$\n\\mu=\\frac{v^{2}}{r g}\n$$\n$$\n\\mu=\\frac{12.5 \\times 12.5}{20 \\times 9.8}=0.8\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e720279619d9d8a147e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "When a disc is rotating with angular velocity $\\omega$, a particle situated at a distance of $4 \\mathrm{~cm}$ just begins to slip. If the angular velocity is doubled, at what distance will the particle start to slip?", "image": null}, "options": [{"id": "oen8W", "text": "$1 \\mathrm{~cm}$", "image": null, "isCorrect": true}, {"id": "ESyCh", "text": "$2 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "V3mFs", "text": "$3 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "7BjXn", "text": "$4 \\mathrm{~cm}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Angular velocity $=\\omega$ Centripetal force $F=m r \\omega^{2}$\nor $\\quad r \\propto \\frac{1}{\\omega^{2}}$\n$\\therefore$\n$$\n\\frac{r_{1}}{r_{2}}=\\frac{\\omega_{2}^{2}}{\\omega_{1}^{2}}\n$$\nor\n$$\n\\frac{4}{r_{2}}=\\frac{4 \\omega^{2}}{\\omega^{2}}\n$$\nor $r_{2}=1 \\mathrm{~cm}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e520279619d9d8a137c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "The driver of a car travelling at velocity $v$ suddenly see a broad wall in front of him at a distance $d$. He should", "image": null}, "options": [{"id": "9z7jb", "text": "brake sharply", "image": null, "isCorrect": true}, {"id": "98s6j", "text": "turn sharply", "image": null, "isCorrect": false}, {"id": "ynyCe", "text": "Both (a) and (b)", "image": null, "isCorrect": false}, {"id": "TZoXK", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When driver applies brakes and the car covers distance $x$ before coming to rest, under the effect of retarding force $F$.\nThen\n$$\n\\begin{aligned}\n\\frac{1}{2} m v^{2} &=F x \\\\\nx &=\\frac{m v^{2}}{2 F}\n\\end{aligned}\n$$\nor\nBut when he takes turn, then\n$$\n\\begin{aligned}\n\\frac{m v^{2}}{r} &=F \\\\\nr &=\\frac{m v^{2}}{F}\n\\end{aligned}\n$$\nIt is clear that $x=\\frac{r}{2}$\nie, by the same retarding force the car can be stopped in a less distance if the driver apply brakes. This retarding force is actually a friction force.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e510279619d9d8a1376", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "When a ceiling fan is switched off, its angular velocity falls to half while it makes 36 rotations. How many more rotations will it make before coming to rest?", "image": null}, "options": [{"id": "QQNow", "text": "24", "image": null, "isCorrect": false}, {"id": "xkTgN", "text": "36", "image": null, "isCorrect": false}, {"id": "iVNLv", "text": "18", "image": null, "isCorrect": false}, {"id": "LQy0f", "text": "12", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "From third equation of angular motion,\n$$\n\\begin{array}{l}\n\\quad \\omega^{2}=\\omega_{0}^{2}-2 \\alpha \\theta \\\\\n{\\left[\\text { Here, } \\omega=\\frac{\\omega_{0}}{2}, \\theta=36 \\times 2 \\pi\\right]} \\\\\n\\therefore\\left(\\frac{\\omega_{0}}{2}\\right)^{2}=\\omega_{0}^{2}-2 \\alpha \\times 36 \\times 2 \\pi \\\\\n\\text { or } \\quad 4 \\times 36 \\pi \\alpha=\\omega_{0}^{2}-\\frac{\\omega_{0}^{2}}{4}\n\\end{array}\n$$\nor\n$$\n4 \\times 36 \\pi \\alpha=\\frac{3 \\omega_{0}^{2}}{4}\n$$\nor $\\alpha=\\frac{\\omega_{0}^{2}}{16 \\times 12 \\pi}$ ...(i)\nAccording to question again applying the third equation of angular motion\n$$\n\\omega^{2}=\\omega_{0}^{2}-2 \\alpha \\theta\n$$\n[Here, $\\omega=0$ ]\n$$\n0=\\left(\\frac{\\omega_{0}}{2}\\right)^{2}-2 \\times \\frac{\\omega_{0}^{2} \\cdot \\theta}{16 \\times 12 \\pi}\n$$\nor $\\theta=24 \\pi \\quad$ or $\\quad \\theta=12 \\times 2 \\pi$\n$\\begin{array}{lc}\\text { But } & 2 \\pi=1 \\text { cycle } \\\\ \\text { So, } & \\theta=12 \\text { cycle }\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e4e0279619d9d8a1360", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "A roller coaster is designed such that riders experience \"weightlessness\" as they go round the top of a hill whose radius of curvature is $20 \\mathrm{~m}$. The speed of the car at the top of the hill is between", "image": null}, "options": [{"id": "JRpVo", "text": "$14 \\mathrm{~m} / \\mathrm{s}$ and $15 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": true}, {"id": "MEYB6", "text": "$15 \\mathrm{~m} / \\mathrm{s}$ and $16 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "qzBig", "text": "$16 \\mathrm{~m} / \\mathrm{s}$ and $17 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "jAuJk", "text": "$13 \\mathrm{~m} / \\mathrm{s}$ and $14 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Balancing the forces, we get\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/WNwxHuPqDbYPcC8IhiNEp2cgfiySi_lIqmvLfBh_-jQ.original.fullsize.png\"><br>\n$$\nM g-N=M \\frac{v^{2}}{R}\n$$\nFor weightlessness, $N=0$\n$\\therefore$\n$$\n\\frac{M v^{2}}{R}=M g\n$$\nwhere $R$ is the radius of curvature and $v$ is the speed of car. Therefore,\n$$\nv=\\sqrt{\\mathrm{Rg}}\n$$\nPutting the values, $R=20 \\mathrm{~m}, g=10.0 \\mathrm{~m} / \\mathrm{s}^{2}$\nSo, $\\quad v=\\sqrt{20 \\times 10.0}=14.14 \\mathrm{~m} / \\mathrm{s}^{2}$\nThus, the speed of the car at the top of the hill is\n$$\n\\text { between } 14 \\mathrm{~m} / \\mathrm{s} \\text { and } 15 \\mathrm{~m} / \\mathrm{s} \\text { . }\n$$\nNote : The roller coaster is a popular amusement ride developed for amusement parks and modern theme parks.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e400279619d9d8a12ea", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "In a radioactive material the activity at time $t_{1}$ is $R_{1}$ and at a later time $t_{2}$, it is $R_{2}$. If the decay constant of the material is $\\lambda$, then", "image": null}, "options": [{"id": "QPmGw", "text": "$R_{1}=R_{2} e^{-\\lambda\\left(t_{1}-t_{2}\\right)}$", "image": null, "isCorrect": true}, {"id": "cfczf", "text": "$R_{1}=R_{2} e^{\\lambda\\left(t_{1}-t_{2}\\right)}$", "image": null, "isCorrect": false}, {"id": "mGAGg", "text": "$R_{1}=R_{2}\\left(t_{2} / t_{1}\\right)$", "image": null, "isCorrect": false}, {"id": "33NuC", "text": "$R_{1}=R_{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The decay rate $R$ of a radioactive material is the number of decays per second. From radioactive decay law.\n$$\n-\\frac{d N}{d t} \\propto N \\quad \\text { or }-\\frac{d N}{d t}=\\lambda N\n$$\nThus, $\\quad R=-\\frac{d N}{d t}$\nOr $R=\\lambda N \\quad$ or $\\quad R=\\lambda N_{0} e^{-\\lambda t} \\ldots$..(i)\nwhere $R_{0}=\\lambda N_{0}$ is the activity of the radioactive material at time $t=0$. At time $t_{1}, \\quad R_{1}=R_{0} e^{-\\lambda t_{1}}$\nAt time $t_{2}, \\quad R_{2}=R_{0} e^{-\\lambda t_{2}}$\nDividing Eq. (ii) by (iii), we have\nor\n$$\n\\begin{array}{l}\n\\frac{R_{1}}{R_{2}}=\\frac{e^{-\\lambda t_{1}}}{e^{-\\lambda t_{2}}}=e^{-\\lambda\\left(t_{1}-t_{2}\\right)} \\\\\nR_{1}=R_{2} e^{-\\lambda\\left(t_{1}-t_{2}\\right)}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
