: "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e650279619d9d8a1410", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "If an electron is revolving around the hydrogen nucleus at a distance of $0.1 \\mathrm{~nm}$, what should be its speed?", "image": null}, "options": [{"id": "gUm3s", "text": "$2.188 \\times 10^{6} \\mathrm{~ms}^{-1}$", "image": null, "isCorrect": false}, {"id": "TGFIM", "text": "$1.094 \\times 10^{6} \\mathrm{~ms}^{-1}$", "image": null, "isCorrect": false}, {"id": "w1iZx", "text": "$4.376 \\times 10^{6} \\mathrm{~ms}^{-1}$", "image": null, "isCorrect": false}, {"id": "yPFdR", "text": "$1.59 \\times 10^{6} \\mathrm{~ms}^{-1}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Electrostatic force $=$ centripetal force\n$$\n\\frac{1}{4 \\pi \\varepsilon_{0}} \\frac{Z e^{2}}{r^{2}}=\\frac{m v^{2}}{r}\n$$\n$\\therefore \\quad v=\\sqrt{\\left(\\frac{1}{4 \\pi \\varepsilon_{0}} \\frac{Z e^{2}}{m r}\\right)}$\n$=\\sqrt{\\frac{9 \\times 10^{9} \\times 1 \\times\\left(1.6 \\times 10^{-19}\\right)^{2}}{\\left(9.1 \\times 10^{-31}\\right) \\times\\left(0.1 \\times 10^{-9}\\right)}}=1.59 \\times 10^{6} \\mathrm{~ms}$\n$-1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a2632a0279619d9d8a3c93", "title": "Spring force", "totalQuestions": 17, "questions": [{"_id": "6abb888c15a9fc0fc8c144bd", "type": "singleCorrect", "question": {"text": "A spring has length $l$ and force constant $k$. It is cut into 2 springs of length $l_1$ and $l_2$ such that $l_1 = nl_2$ ($n$=an integer). The force constant of the spring of length $l_2$ is $\\left(k \\propto \\dfrac{1}{l}\\right)$", "image": null}, "options": [{"id": "XByw5", "label": "A", "text": "$k(n+1)$", "isCorrect": true, "image": null}, {"id": "94SLy", "label": "B", "text": "$(n+1)\\dfrac{k}{n}$", "isCorrect": false, "image": null}, {"id": "KqSSQ", "label": "C", "text": "$k$", "isCorrect": false, "image": null}, {"id": "LyfXX", "label": "D", "text": "$\\dfrac{k}{(n+1)}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $l_1 = n l_2$ and the total length of the spring is $l = l_1 + l_2$.<br><br>Substituting $l_1$, we get $l = n l_2 + l_2 = (n+1) l_2$.<br><br>The force constant of a spring is inversely proportional to its length, which means $k \\propto \\dfrac{1}{l}$ or $k l = \\text{constant}$.<br><br>Let $k_2$ be the force constant of the spring of length $l_2$.<br><br>$k_2 l_2 = k l$<br><br>$k_2 = \\dfrac{k l}{l_2}$<br><br>Substituting $l = (n+1) l_2$, we get:<br><br>$k_2 = \\dfrac{k (n+1) l_2}{l_2} = k(n+1)$<br><br>Answer: $k(n+1)$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b18c30a4553e1bdbcc", "type": "singleCorrect", "question": {"text": "Two massless springs of spring constants $K_1$ and $K_2$ are connected one after the other forming a single chain, suspended vertically and a certain mass is attached to the free end. If $x_1$ and $x_2$ are their respective extensions and 'F' is their stretching force, the total extension produced is", "image": null}, "options": [{"id": "FFxSN", "label": "A", "text": "$F(K_1 + K_2)$", "isCorrect": false, "image": null}, {"id": "7zBma", "label": "B", "text": "$F(1/K_1 - 1/K_2)$", "isCorrect": false, "image": null}, {"id": "nOyNs", "label": "C", "text": "$F(K_1 - K_2)$", "isCorrect": false, "image": null}, {"id": "qpZ8c", "label": "D", "text": "$F(1/K_1 + 1/K_2)$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "When springs are connected in series, the same stretching force $F$ acts on each spring.<br><br>The extension in the first spring is $x_1 = \\dfrac{F}{K_1}$<br><br>The extension in the second spring is $x_2 = \\dfrac{F}{K_2}$<br><br>The total extension produced is $x = x_1 + x_2$<br><br>$x = \\dfrac{F}{K_1} + \\dfrac{F}{K_2} = F\\left(\\dfrac{1}{K_1} + \\dfrac{1}{K_2}\\right)$<br><br>Answer: $F(1/K_1 + 1/K_2)$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b65bf9280d7f99328d4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A body of mass 100 gram is tied to a spring of spring constant $8 \\mathrm{~N} / \\mathrm{m}$, while the other end of a spring is fixed. If the body moves in a circular path on smooth horizontal surface with constant angular speed $8 \\mathrm{rad} / \\mathrm{s}$ then the ratio of extension in the spring to its natured length will be", "image": null}, "options": [{"id": "qTnS8", "text": "1:1", "image": null, "isCorrect": false}, {"id": "j1IRn", "text": "8:1", "image": null, "isCorrect": false}, {"id": "zFyun", "text": "2:1", "image": null, "isCorrect": false}, {"id": "IbEyP", "text": "$4: 1$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let the natural length of the spring be $L$ and the extension in the spring be $x$.<br><br>The radius of the circular path is $r = L + x$.<br><br>The centripetal force required for circular motion is provided by the restoring force of the spring.<br><br>$m \\omega^2 r = kx$<br><br>$m \\omega^2 (L + x) = kx$<br><br>Given $m = 100 \\text{ g} = 0.1 \\text{ kg}$, $k = 8 \\text{ N/m}$, and $\\omega = 8 \\text{ rad/s}$. Substituting these values:<br><br>$0.1 \\times (8)^2 \\times (L + x) = 8x$<br><br>$0.1 \\times 64 \\times (L + x) = 8x$<br><br>$6.4(L + x) = 8x$<br><br>$6.4L + 6.4x = 8x$<br><br>$8x - 6.4x = 6.4L$<br><br>$1.6x = 6.4L$<br><br>$\\dfrac{x}{L} = \\dfrac{6.4}{1.6} = 4$<br><br>The ratio of extension in the spring to its natural length is $4:1$.<br><br>Answer: $4: 1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792141e0aee93fa0796de20", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "A spring has length $L$ and force constant K . It is cut into two springs of length $L_1$ and $L_2$ such that $\\mathrm{L}_1=\\mathrm{NL}_2$ ( N is an integer). The force constant of spring of length $L_1$ is", "image": null}, "options": [{"id": "Jcit4", "text": "$(\\mathrm{N}+1) \\mathrm{K}$", "image": null, "isCorrect": false}, {"id": "A7Pqm", "text": "$\\frac{\\mathrm{K}}{\\mathrm{N}}(1+\\mathrm{N})$", "image": null, "isCorrect": true}, {"id": "MC2Vb", "text": "K", "image": null, "isCorrect": false}, {"id": "mGq2O", "text": "$\\frac{\\mathrm{K}}{\\mathrm{N}+1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The force constant of a spring is inversely proportional to its length, so $K \\propto \\dfrac{1}{L}$.<br><br>Let the original length of the spring be $L = L_1 + L_2$.<br><br>Given $L_1 = N L_2$, we have $L_2 = \\dfrac{L_1}{N}$.<br><br>Substituting this into the equation for $L$, we get $L = L_1 + \\dfrac{L_1}{N} = L_1 \\left(\\dfrac{N+1}{N}\\right)$.<br><br>Since $K_1 L_1 = K L$, the force constant of the spring of length $L_1$ is $K_1 = K \\dfrac{L}{L_1}$.<br><br>Substituting the value of $L$, we get $K_1 = K \\dfrac{L_1 \\left(\\dfrac{N+1}{N}\\right)}{L_1} = \\dfrac{K}{N}(1+N)$.<br><br>Answer: $\\frac{\\mathrm{K}}{\\mathrm{N}}(1+\\mathrm{N})$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262790279619d9d8a34cf", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "A light spring is suspended with mass $m_1$ at its lower end and its upper end fixed to a rigid support. The mass is pulled down a short distance and then released. The period of oscillation is $\\mathrm{T}$ second. When a mass $\\mathrm{m}_2$ is added to $m_1$ and the system is made to oscillate, the period is found to be $\\frac{3}{2} \\mathrm{~T}$. The ratio $\\mathrm{m}_1: \\mathrm{m}_2$ is", "image": null}, "options": [{"id": "HpoUP", "text": "$2:3$", "image": null, "isCorrect": false}, {"id": "rK2WN", "text": "$3:4$", "image": null, "isCorrect": false}, {"id": "IzIgT", "text": "$4:5$", "image": null, "isCorrect": true}, {"id": "mLLtA", "text": "$5:6$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The time period is $T \\propto \\sqrt{\\mathrm{m}}$\n$\\begin{array}{ll}\n\\therefore & \\frac{\\mathrm{T}}{3}=\\frac{\\sqrt{\\mathrm{m}_1}}{\\sqrt{\\mathrm{m}_1+\\mathrm{m}_2}} \\\\\n\\therefore & \\frac{2}{3}=\\frac{\\sqrt{\\mathrm{m}_1}}{\\sqrt{\\mathrm{m}_1+\\mathrm{m}_2}} \\\\\n\\therefore \\quad & \\frac{4}{9}=\\frac{\\mathrm{m}_1}{\\mathrm{~m}_1+\\mathrm{m}_2} \\\\\n\\therefore \\quad & 4 \\mathrm{~m}_1+4 \\mathrm{~m}_2=9 \\mathrm{~m}_1 \\\\\n\\therefore \\quad & 5 \\mathrm{~m}_1=4 \\mathrm{~m}_2 \\\\\n\\therefore \\quad & \\frac{\\mathrm{m}_1}{\\mathrm{~m}_2}=\\frac{4}{5}\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262770279619d9d8a34c0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "A uniform circular disc of mass $12 \\mathrm{~kg}$ is held by two identical springs. When the disc is slightly pressed down and released, it executes S.H.M. of period 2 second. The force constant of each spring is (nearly) (Take $\\pi^2=10$ )\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/GRGZ5B94_0l5ITLNhLoVGoLiMYBxE71sJDP267dI8zc.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "oDpKv", "text": "$230 \\mathrm{Nm}^{-1}$", "image": null, "isCorrect": false}, {"id": "O4zxF", "text": "$120 \\mathrm{Nm}^{-1}$", "image": null, "isCorrect": false}, {"id": "0Ve4v", "text": "$60 \\mathrm{Nm}^{-1}$", "image": null, "isCorrect": true}, {"id": "mwv4I", "text": "$30 \\mathrm{Nm}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The two springs are connected in parallel. So, the effective spring constant is, $\\mathrm{k}_{\\mathrm{eff}}=2 \\mathrm{k}$\nTime period of the spring system is,\n$\\begin{aligned}\n& \\mathrm{T}=2 \\pi \\sqrt{\\frac{\\mathrm{m}}{2 \\mathrm{k}}} \\\\\n\\therefore \\quad \\mathrm{T}^2 & =4 \\pi^2 \\times \\frac{\\mathrm{m}}{2 \\mathrm{k}} \\\\\n\\therefore \\quad \\mathrm{k} & =4 \\pi^2 \\times \\frac{\\mathrm{m}}{2 \\mathrm{~T}^2}=4 \\times 10 \\times \\frac{12}{2 \\times 4}=60 \\mathrm{~N} / \\mathrm{m}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262570279619d9d8a33bd", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "A spring balance is attached to the ceiling of a lift. A man hangs his bag on the spring and the spring balance reads $49 \\mathrm{~N}$, when the lift is stationary. If the lift moves downward with an acceleration of $5 \\mathrm{~m} / \\mathrm{s}^2$, the reading of the spring balance will be $\\left(\\mathrm{g}=9.8 \\mathrm{~m} / \\mathrm{s}^2\\right)$", "image": null}, "options": [{"id": "31lJq", "text": "$15 \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "EUDNf", "text": "$24 \\mathrm{~N}$", "image": null, "isCorrect": true}, {"id": "fuVMD", "text": "$49 \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "IfbKS", "text": "$74 \\mathrm{~N}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For downward accelration of the lift, \n$\\mathrm{Mg}\\mathrm{T}=\\mathrm{ma}$\n$\\therefore \\quad \\mathrm{T}=\\mathrm{m}(\\mathrm{g}-\\mathrm{a})$ ....(i)\n$\\mathrm{W}=\\mathrm{mg}$\n$\\therefore \\quad \\mathrm{m}=\\frac{\\mathrm{W}}{\\mathrm{g}}=\\frac{49}{9.8}$            ....(ii)\nPut (ii) into (i)\n$\\mathrm{T}=\\frac{49}{9.8}(9.8-5)$\n$=5(4.8)=24 \\mathrm{~N}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262550279619d9d8a33a9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "A simple spring has length ' $l$ ' and force constant ' $\\mathrm{K}$ ', It is cut in to two springs of length ' $l_1$ ' and ' $l_2$ ' such that $l_1=\\mathrm{n} l_2$ ( $\\mathrm{n}$ is an integer). The force constant of spring of length ' $l_1$ ' is", "image": null}, "options": [{"id": "Jujy3", "text": "$\\mathrm{K}(1+\\mathrm{n})$", "image": null, "isCorrect": false}, {"id": "tHMRf", "text": "$\\frac{\\mathrm{K}(\\mathrm{n}+1)}{\\mathrm{n}}$", "image": null, "isCorrect": true}, {"id": "4xco1", "text": "$\\mathrm{K}$", "image": null, "isCorrect": false}, {"id": "EUU0t", "text": "$\\frac{\\mathrm{K}}{(\\mathrm{n}+1)}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given\n$l_1=\\mathrm{n} l_2$\n$\\therefore \\quad \\mathrm{k}_2=\\mathrm{nk}_1$\nBefore cutting, the springs are connected in series, so\n$\\therefore \\quad \\frac{1}{\\mathrm{k}}=\\frac{1}{\\mathrm{k}_1}+\\frac{1}{\\mathrm{k}_2}$\n$\\frac{1}{\\mathrm{~K}}=\\frac{1}{\\mathrm{k}_1}+\\frac{1}{\\mathrm{nk}_1}$\n$\\frac{1}{\\mathrm{~K}}=\\frac{\\mathrm{n}+1}{\\mathrm{nk}_1}$\n$\\therefore \\quad k_1-\\frac{K(n+1)}{n}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262540279619d9d8a33a3", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "A mass ' $M$ ' is suspended from a light spring. An additional mass $\\mathrm{M}_1$ added extends the spring further by a distance ' $\\mathrm{x}$ '. Now the combined mass will oscillate on the spring with period $\\mathrm{T}=$", "image": null}, "options": [{"id": "ZJe7d", "text": "$2 \\pi\\left[\\left(\\frac{M_1 g}{x\\left(M+M_1\\right)}\\right)\\right]^{\\frac{1}{2}}$", "image": null, "isCorrect": false}, {"id": "0olcM", "text": "$2 \\pi\\left[\\frac{\\left(\\mathrm{M}+\\mathrm{M}_1\\right) \\mathrm{x}}{\\mathrm{M}_1 \\mathrm{~g}}\\right]^{\\frac{1}{2}}$", "image": null, "isCorrect": true}, {"id": "DqfWZ", "text": "$\\left(\\frac{\\pi}{2}\\right)\\left[\\left(\\frac{M_1 g}{x\\left(M+M_1\\right)}\\right)\\right]^{\\frac{1}{2}}$", "image": null, "isCorrect": false}, {"id": "G7ibk", "text": "$2 \\pi\\left[\\frac{\\left(\\mathrm{M}+\\mathrm{M}_1\\right) \\mathrm{x}}{\\mathrm{M}_1 \\mathrm{~g}}\\right]^{\\frac{1}{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Time period $T=2 \\pi \\sqrt{\\frac{\\mathrm{m}}{\\mathrm{k}}}$\nHere, $k x=M_1 g$\n$\\therefore \\quad \\mathrm{K}=\\frac{\\mathrm{M}_1 \\mathrm{~g}}{\\mathrm{x}}$\n$\\therefore \\quad$ Combined mass: $\\mathrm{M}+\\mathrm{M}_1$\n$\\therefore \\quad \\mathrm{T}=2 \\pi \\sqrt{\\frac{\\mathrm{x}\\left(\\mathrm{M}+\\mathrm{M}_1\\right)}{\\mathrm{M}_1 \\mathrm{~g}}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262200279619d9d8a31ff", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "Four massless springs whose force constants are $2 \\mathrm{~K}, 2 \\mathrm{~K}, \\mathrm{~K}$ and $2 \\mathrm{~K}$ respectively are attached to a mass $\\mathrm{M}$ kept on a frictionless plane as shown in figure, If mass $M$ is displaced in horizontal direction then frequency of oscillating system is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/G_DnZD4yd3A7YqwlevqoMmWzCKvYR4FSMfGHzxiolag.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "tP0LI", "text": "$\\frac{1}{2 \\pi} \\sqrt{\\frac{\\mathrm{K}}{4 \\mathrm{M}}}$", "image": null, "isCorrect": false}, {"id": "TvYS7", "text": "$\\frac{1}{2 \\pi} \\sqrt{\\frac{4 \\mathrm{~K}}{\\mathrm{M}}}$", "image": null, "isCorrect": true}, {"id": "q8U8Z", "text": "$\\frac{1}{2 \\pi} \\sqrt{\\frac{\\mathrm{K}}{7 \\mathrm{M}}}$", "image": null, "isCorrect": false}, {"id": "joFQr", "text": "$\\frac{1}{2 \\pi} \\sqrt{\\frac{7 \\mathrm{~K}}{\\mathrm{M}}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "On the right hand side of the block, springs are connected in parallel\n$\\therefore \\quad$ Their effective spring constant is given by\n$$\n\\begin{aligned}\n& \\mathrm{K}_1=\\mathrm{K}+2 \\mathrm{~K} \\\\\n& \\mathrm{~K}_1=3 \\mathrm{~K}\n\\end{aligned}\n$$\nOn the left hand side of the block, springs are connected in series.\n$\\therefore \\quad$ Their effective spring constant is given by,\n$$\n\\begin{aligned}\n& \\frac{1}{\\mathrm{~K}_2}=\\frac{1}{2 \\mathrm{~K}}+\\frac{1}{2 \\mathrm{~K}} \\\\\n\\therefore \\quad \\mathrm{K}_2 & =\\mathrm{K}\n\\end{aligned}\n$$\n$\\therefore \\quad$ Effective spring constant of the system is given by,\n$$\n\\begin{aligned}\n& \\mathrm{K}_{\\mathrm{E}}=3 \\mathrm{~K}+\\mathrm{K}=4 \\mathrm{~K} \\\\\n\\therefore \\quad \\omega & =\\sqrt{\\frac{\\mathrm{K}_{\\mathrm{E}}}{\\mathrm{M}}}=\\sqrt{\\frac{4 \\mathrm{~K}}{\\mathrm{M}}} \\\\\n\\therefore \\quad \\mathrm{f} & =\\frac{\\omega}{2 \\pi}=\\frac{1}{2 \\pi} \\sqrt{\\frac{4 \\mathrm{~K}}{\\mathrm{M}}}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261f90279619d9d8a30cf", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "The bob of a simple pendulum of length ' $L$ ' has a mass ' $m$ ' and charge ' $q$ '. The pendulum is suspended between the plates of a charged parallel plate capacitor. The direction of electric field is shown in figure. The period of oscillations of the simple pendulum is (acceleration due to gravity $g>q E / m$ )\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/KiWXrwOsPE00MR9efIgBidCdjsbUrDDoa3RT1JfxyaA.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "p3OOF", "text": "$2 \\pi \\sqrt{\\frac{\\mathrm{L}}{\\mathrm{g}}}$", "image": null, "isCorrect": false}, {"id": "uS7tB", "text": "$2 \\pi\\left[\\frac{\\mathrm{L}}{\\frac{\\mathrm{qE}}{\\mathrm{m}}-\\mathrm{g}}\\right]^{\\frac{1}{2}}$", "image": null, "isCorrect": false}, {"id": "Z6Zxz", "text": "$2 \\pi\\left[\\frac{\\mathrm{L}}{\\mathrm{g}-\\frac{\\mathrm{qE}}{\\mathrm{m}}}\\right]^{\\frac{1}{2}}$", "image": null, "isCorrect": true}, {"id": "Uy0uL", "text": "$2 \\pi\\left[\\frac{\\mathrm{L}}{\\mathrm{g}+\\frac{\\mathrm{qE}}{\\mathrm{m}}}\\right]^{\\frac{1}{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Electric force, $\\mathrm{F}_{\\text {electric }}=\\mathrm{qE}$\nThe effective force,\n$$\n\\begin{aligned}\n& \\mathrm{mg}_{\\text {eff }}=\\mathrm{mg}-\\mathrm{F}_{\\text {electric }} \\\\\n& \\mathrm{g}_{\\text {eff }}=\\mathrm{g}-\\frac{\\mathrm{qE}}{\\mathrm{m}}\n\\end{aligned}\n$$\n\nThe period of oscillation for a simple pendulum,\n$$\n\\mathrm{T}=2 \\pi \\sqrt{\\frac{\\mathrm{L}}{\\mathrm{g}}}\n$$\n\nTime period when pendulum is suspended between the plates,\n$$\n\\begin{aligned}\n& \\mathrm{T}=2 \\pi \\sqrt{\\frac{\\mathrm{L}}{\\mathrm{g}_{\\text {eff }}}} \\\\\n& \\mathrm{T}=2 \\pi\\left[\\frac{\\mathrm{L}}{\\mathrm{g}-\\frac{\\mathrm{qE}}{\\mathrm{m}}}\\right]^{\\frac{1}{2}}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261d00279619d9d8a2f8c", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "A body of mass 200 gram is tied to a spring of spring constant $12.5 \\mathrm{~N} / \\mathrm{m}$, while other end of spring is fixed at point ' $\\mathrm{O}$ '. If the body moves about ' $\\mathrm{O}$ ' in a circular path on a smooth horizontal surface with constant angular speed $5 \\mathrm{rad} / \\mathrm{s}$ then the ratio of extension in the spring to its natural length will be\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/5gBU7kcUVLIQ8kzJ_HqtI03Q4Gfvdvf8Aanj1eh9v0w.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "hGGfH", "text": "$1: 2$", "image": null, "isCorrect": false}, {"id": "nsRn5", "text": "$1:1$", "image": null, "isCorrect": false}, {"id": "CGj7Y", "text": "$2:3$", "image": null, "isCorrect": true}, {"id": "s1IBj", "text": "$2:5$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the normal length be $\\mathrm{L}$ and the extension be $\\mathrm{x}$.\n$\\therefore \\quad$ Restoring Force $=$ Centripetal Force\n$\\begin{aligned}\n& \\mathrm{kx}=\\mathrm{m}(\\mathrm{L}+\\mathrm{x}) \\omega^2 \\\\\n& 12.5 \\mathrm{x}=0.2(\\mathrm{~L}+\\mathrm{x}) 25 \\quad \\ldots(\\because \\omega=5 \\mathrm{rad} / \\mathrm{s})\n\\end{aligned}$\n$\\begin{aligned} & 12.5 x=5(L+x) \\\\ & 7.5 x=5 L \\\\ \\therefore \\quad & \\frac{x}{L}=\\frac{5}{7.5}=\\frac{2}{3}=2: 3\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261840279619d9d8a2d36", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "Two massless springs of spring constant $K_1$ and $K_2$ are connected one after the other forming a single chain, suspended vertically and certain mass is attached to the free end. If $e_1$ and $e_2$ are their respective extensions and $f$ is their stretching force, the total extension produced is", "image": null}, "options": [{"id": "b3Pu6", "text": "$f\\left(K_1-K_2\\right)$", "image": null, "isCorrect": false}, {"id": "RYuA7", "text": "$f\\left(\frac{1}{K_1}-\\frac{1}{K_2}\\right)$", "image": null, "isCorrect": false}, {"id": "gxlCj", "text": "$f\\left(K_1+K_2\\right)$", "image": null, "isCorrect": false}, {"id": "0Vs0i", "text": "$f\\left(\\frac{1}{K_1}+\\frac{1}{K_2}\\right)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The total restoring force is related to extension as follows:\r\n$f=-K x \\quad---(1)$\r\nThe extension in the springs are related to the restoring force as follows:\r\n$f=-K_1 e_1---(2)$\r\nand\r\n$f=-K_2 e_2---(3)$\r\nThe total extension of the springs is:\r\n$x=e_1+e_2---(4)$\r\nUsing equation (1),(2) and (3)\r\n$\\begin{aligned} & \\Rightarrow\\left(-\\frac{f}{K}\\right)=\\left(-\\frac{f}{K_1}\\right)+\\left(-\\frac{f}{K_2}\\right) \\\\ & \\Rightarrow \\frac{1}{K}=\\left(\\frac{1}{K_1}+\\frac{1}{K_2}\\right)---(5)\\end{aligned}$\r\nThe total extension using equation (4) and (5)is given by,\r\n$x=\\frac{f}{K}=f\\left(\\frac{1}{K_1}+\\frac{1}{K_2}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261700279619d9d8a2c91", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "A spring has length $l$ and force constant $K$. If is cut into two springs of length $l_1$ and $l_2$ such that, $l_1=n l_2(n$ is integer). The force constant of the spring of length $l_2$ is", "image": null}, "options": [{"id": "pAvX8", "text": "$\\frac{(n+1) K}{n}$", "image": null, "isCorrect": false}, {"id": "LOo8f", "text": "$K$", "image": null, "isCorrect": false}, {"id": "YJRBh", "text": "$\\frac{K}{(n+1)}$", "image": null, "isCorrect": false}, {"id": "Nn3x3", "text": "$K(1+n)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "If $l$ is cut into $l_1$ and $l_2$, such that\n$l_1+l_2=l$, where, $n l_2=l_1$\n$\\therefore l_2=\\frac{l}{n+1}$\nAs we know from the elasticity relation $K=\\frac{E A}{l}$, where $E$ is Young's modulus, $A$ area of cross-section and $l$ is the length of the spring.\n$\\therefore K_2=\\frac{E A}{l_2}=\\frac{(n+1) E A}{l}=(n+1) K$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260910279619d9d8a258e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "A spring balance is attached to the ceiling of a lift. A man hangs his bag on the spring and the spring balance reads $49 \\mathrm{~N}$, when the lift is stationary. If the lift moves downward with an acceleration of $5 \\mathrm{~m} / \\mathrm{s}^2$, the reading of the spring balance will be", "image": null}, "options": [{"id": "ooUim", "text": "74 N", "image": null, "isCorrect": false}, {"id": "j9wDG", "text": "15 N", "image": null, "isCorrect": false}, {"id": "V3r9C", "text": "24 N", "image": null, "isCorrect": true}, {"id": "oDPJR", "text": "49 N", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{W}=49 \\mathrm{~N} \\\\ & \\therefore \\mathrm{m}=\\frac{\\mathrm{W}}{\\mathrm{g}}=\\frac{49}{9.8}=5 \\mathrm{~kg} \\\\ & \\mathrm{~W}^{\\prime}=\\mathrm{W}-\\mathrm{ma}=49-5 \\times 5=49-25 \\\\ & =24 \\mathrm{~N}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fd60279619d9d8a1fa7", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "When a mass ' $\\mathrm{m}$ ' is suspended from a spring of length ' $\\ell^{\\prime}$, the length of the spring\nbecomes ' $\\mathrm{L}^{\\prime}$. The mass is pulled down by a distance ' $\\mathrm{d}$ ' and released. If the equation of motion of the mass is $\\frac{d^{2} x}{d t^{2}}+\\mathrm{P}^{2} x=0$, then $\\mathrm{P}$ is equal to\n$(\\mathrm{g}=$ acceleration due to gravity $)$", "image": null}, "options": [{"id": "CYmBZ", "text": "$\\frac{\\mathrm{L}-\\ell}{\\mathrm{g}}$", "image": null, "isCorrect": false}, {"id": "ye1ko", "text": "$\\frac{\\mathrm{g}}{\\mathrm{L}-\\ell}$", "image": null, "isCorrect": false}, {"id": "ck0Tp", "text": "$\\sqrt{\\frac{\\mathrm{g}}{\\mathrm{L}-\\ell}}$", "image": null, "isCorrect": true}, {"id": "EoFDC", "text": "$\\sqrt{\\frac{\\mathrm{L}-\\ell}{\\mathrm{g}}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "INTIAL LENGTH $=l$\nFINAL LENGTH=L.\nNET DISTANCE/LENGTH\nPULLED $=L-l$\n$\\therefore T I M E P E R I O D=2 \\pi \\sqrt{\\frac{L-\\ell}{g}}$ allo, $P=\\frac{2 \\pi}{T .}$\n$\\begin{aligned} \\therefore P=& \\frac{g}{L-l} . \\\\ &(\\text { option }-3) . \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e850279619d9d8a151c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "Two springs have spring constant $k_{A}$ and $k_{B}$ and $k_{A}>k_{B}$. The work required to stretch them by same extension will be", "image": null}, "options": [{"id": "CIVCJ", "text": "more in spring $A$", "image": null, "isCorrect": true}, {"id": "uOlCr", "text": "more in spring $B$", "image": null, "isCorrect": false}, {"id": "NqLQU", "text": "equal in both", "image": null, "isCorrect": false}, {"id": "SFGKi", "text": "nothing can be said", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Work done in stretching $(\\mathrm{W})=$ stiffness of spring\n$\\because$\n$$\nk_{A}>k_{B}, W_{A}>W_{B}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "65a2632a0279619d9d8a3c95", "title": "Frictional force", "totalQuestions": 13, "questions": [{"_id": "6abb883c15a9fc0fc8c141c5", "type": "singleCorrect", "question": {"text": "On a dry curved (banked) road, with banking angle of zero, the maximum safe speed for a moving vehicle is '$v$'. After heavy rain, the maximum safe speed for the same road was reduced by 60%. The ratio of the coefficient of friction for the dry road to that of the wet road is", "image": null}, "options": [{"id": "uCLY1", "label": "A", "text": "$25:9$", "isCorrect": false, "image": null}, {"id": "cvc1Z", "label": "B", "text": "$24:5$", "isCorrect": false, "image": null}, {"id": "Kaqx2", "label": "C", "text": "$24:9$", "isCorrect": false, "image": null}, {"id": "vz6WT", "label": "D", "text": "$25:4$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The maximum safe speed on a curved road with zero banking angle is given by $v = \\sqrt{\\mu r g}$, where $\\mu$ is the coefficient of friction, $r$ is the radius of the curve, and $g$ is the acceleration due to gravity.<br><br>For the dry road, the maximum safe speed is $v$, so the coefficient of friction $\\mu_d$ is:<br><br>$\\mu_d = \\dfrac{v^2}{rg}$<br><br>After heavy rain, the maximum safe speed is reduced by $60\\%$. The new maximum safe speed $v'$ on the wet road is:<br><br>$v' = v - 0.60v = 0.40v$<br><br>The coefficient of friction for the wet road $\\mu_w$ is:<br><br>$\\mu_w = \\dfrac{v'^2}{rg} = \\dfrac{(0.40v)^2}{rg} = \\dfrac{0.16v^2}{rg}$<br><br>The ratio of the coefficient of friction for the dry road to that of the wet road is:<br><br>$\\dfrac{\\mu_d}{\\mu_w} = \\dfrac{\\dfrac{v^2}{rg}}{\\dfrac{0.16v^2}{rg}}$<br><br>$\\dfrac{\\mu_d}{\\mu_w} = \\dfrac{1}{0.16} = \\dfrac{100}{16} = \\dfrac{25}{4}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b96bf9280d7f9932aa2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A motor cyclist has to rotate in horizontal circles inside the cylindrical wall of inner radius ' R ' metre. If the coefficient of friction between the wall and the tyres is ' $\\mu_{\\mathrm{s}}$ ', then the minimum speed required is ( $\\mathrm{g}=$ acceleration due to gravity)", "image": null}, "options": [{"id": "YcJVt", "text": "$\\sqrt{\\mu_{\\mathrm{s}} \\mathrm{Rg}}$", "image": null, "isCorrect": false}, {"id": "OxayK", "text": "$\\sqrt{\\frac{\\mathrm{Rg}}{\\mu_{\\mathrm{s}}}}$", "image": null, "isCorrect": true}, {"id": "u6r2q", "text": "$\\sqrt{\\frac{\\mu_{\\mathrm{s}}}{\\mathrm{Rg}}}$", "image": null, "isCorrect": false}, {"id": "iA7OF", "text": "$\\sqrt{\\frac{\\mathrm{R}^2 \\mathrm{~g}}{\\mu_{\\mathrm{s}}}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a motorcyclist moving in a horizontal circle inside a cylindrical wall, the normal reaction $N$ provides the necessary centripetal force.<br><br>$N = \\dfrac{mv^2}{R}$<br><br>The frictional force $f$ acts upwards to balance the weight $mg$ of the motorcyclist.<br><br>$f = mg$<br><br>To prevent sliding down, the frictional force must be less than or equal to the maximum static friction.<br><br>$f \\le \\mu_s N$<br><br>$mg \\le \\mu_s \\left( \\dfrac{mv^2}{R} \\right)$<br><br>$v^2 \\ge \\dfrac{Rg}{\\mu_s}$<br><br>The minimum speed required is given by:<br><br>$v_{\\text{min}} = \\sqrt{\\dfrac{Rg}{\\mu_s}}$<br><br>Answer: $\\sqrt{\\frac{\\mathrm{Rg}}{\\mu_{\\mathrm{s}}}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262650279619d9d8a3430", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "On dry road, the maximum speed of a vehicle along a circular path is ' $\\mathrm{V}$ '. When the road becomes wet, maximum speed becomes $\\frac{V}{2}$. If coefficient of friction of dry road is ' $\\mu$ ' then that of wet road is", "image": null}, "options": [{"id": "d3gJj", "text": "$\\frac{2 \\mu}{3}$", "image": null, "isCorrect": false}, {"id": "0D2nb", "text": "$\\frac{\\mu}{4}$", "image": null, "isCorrect": true}, {"id": "TAytq", "text": "$\\frac{\\mu}{3}$", "image": null, "isCorrect": false}, {"id": "pnOvB", "text": "$\\frac{3 \\mu}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The equation for maximum velocity is $\\mathrm{V}=\\sqrt{\\mu \\mathrm{rg}}$\n\nWhen the road becomes wet the equation becomes\n$$\n\\frac{\\mathrm{V}}{2}=\\sqrt{\\mu^{\\prime} \\mathrm{rg}}\n$$\n\nDividing equation (i) with equation (ii),\n$$\n\\begin{aligned}\n& \\frac{\\mathrm{V}}{\\mathrm{V}} \\\\\n& =\\frac{\\sqrt{\\mu \\mathrm{rg}}}{\\sqrt{\\mu^{\\prime} \\mathrm{rg}}} \\\\\n\\therefore \\quad 2 & =\\frac{\\sqrt{\\mu}}{\\sqrt{\\mu^{\\prime}}} \\\\\n\\therefore \\quad \\mu^{\\prime} & =\\frac{\\mu}{4}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260100279619d9d8a2171", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}], "question": {"text": "A body is moving along the horizontal surface with a velocity of $4 \\mathrm{~m} / \\mathrm{s}$. If the coefficient of kinetic friction is $0.2$, the distance travelled by body before coming to rest is $\\left(\\mathrm{g}=10 \\mathrm{~m} / \\mathrm{s}^{2}\\right)$", "image": null}, "options": [{"id": "stWap", "text": "$8 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "uzfRk", "text": "$16 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "QMMrd", "text": "$4 \\mathrm{~m}$", "image": null, "isCorrect": true}, {"id": "dT3N2", "text": "$6 \\mathrm{~m}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$f=\\mu \\mathrm{mg}$.\n$\\therefore a=-f / m=-\\frac{\\mu m g}{m}=-\\mu g=-(0.2) 10=-2$\n$v^{2}=u^{2}+2 a s$\n$s=4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25feb0279619d9d8a204a", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "A child starts running from rest along a circular track of radius ' $\\mathrm{r}^{\\prime}$ ' with constant\ntangential acceleration 'a'. After time 't' he feels that slipping of shoes on the\nground has started. The coefficient of friction between shoes and the ground is\n$[\\mathrm{g}=$ acceleration due to gravity $]$", "image": null}, "options": [{"id": "OYkUc", "text": "$\\frac{\\left[a^{2} t^{2}+a^{4} r^{4}\\right]}{r g}$", "image": null, "isCorrect": false}, {"id": "tOump", "text": "$\\frac{\\left[a^{4} t^{4}+a^{2} r^{2}\\right]}{r g}$", "image": null, "isCorrect": false}, {"id": "KqmlC", "text": "$\\frac{\\left[a^{4} t^{4}+a^{2} r^{2}\\right]^{\\frac{1}{2}}}{g r}$", "image": null, "isCorrect": true}, {"id": "gt3vP", "text": "$\\frac{\\left[a^{4} t^{4}-a^{2} r^{2}\\right]^{\\frac{1}{2}}}{r g}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(D)\nAfter time t, velocity $\\mathrm{V}=$ at\n$\\therefore$ radial acceleration $a_{\\mathrm{r}}=\\frac{V^{2}}{r}=\\frac{a^{2} t^{2}}{r}$\nTotal acceleration $=\\sqrt{\\frac{a^{4} t^{4}}{r^{2}}+a^{2}}$\n$\\therefore \\mu g=\\sqrt{\\frac{a^{4} t^{4}+a^{2} r^{2}}{r^{2}}}$\n$\\therefore \\mu=\\frac{\\left[a^{4} t^{4}+a^{2} r^{2}\\right]^{\\frac{1}{2}}}{g r}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fdc0279619d9d8a1fd0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "A motorcyclist rides in a horizontal circle about central vertical axis inside a\ncylindrical chamber of radius 'r'. If the coefficient of friction between the tyres and\nthe inner surface of chamber is ' $\\mu$ ', the minimum speed of motorcyclist to prevent\nhim from skidding is $\\left({ }^{\\prime} \\mathrm{g}^{\\prime}=\\right.$ acceleration due to gravity $)$", "image": null}, "options": [{"id": "EY5JH", "text": "$\\sqrt{\\frac{\\mu g}{r}}$", "image": null, "isCorrect": false}, {"id": "b3Zuj", "text": "$\\sqrt{\\frac{r \\mu}{g}}$", "image": null, "isCorrect": false}, {"id": "MiLMv", "text": "$\\sqrt{\\frac{g}{r \\mu}}$", "image": null, "isCorrect": false}, {"id": "mLyhZ", "text": "$\\sqrt{\\frac{r g}{\\mu}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "A motorcyclist rides in a horizontal circle about central vertical axis inside a cylindrical chamber of radius ' \\(r\\) '. If the coefficient of friction between the tyres and the inner surface of chamber is ' \\(\\mu\\) ', the minimum speed of motorcyclist to prevent him from skidding is \\(\\sqrt{\\frac{r g}{\\mu}}\\).", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fc90279619d9d8a1f3a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "A block of mass 'M' is moving on rough horizontal surface with momentum 'P'. The coefficient of friction between the block and surface is ' $\\mu$ '. The distance covered by block before it stops is $[\\mathrm{g}=$ acceleration due to gravity $]$", "image": null}, "options": [{"id": "no1LP", "text": "$\\frac{2 \\mu \\mathrm{Mg}}{\\mathrm{P}}$", "image": null, "isCorrect": false}, {"id": "gRHKk", "text": "$\\frac{\\mathrm{P}}{2 \\mu \\mathrm{Mg}}$", "image": null, "isCorrect": false}, {"id": "qlaIN", "text": "$\\frac{\\mathrm{P}^{2}}{2 \\mu \\mathrm{M}^{2} \\mathrm{~g}}$", "image": null, "isCorrect": true}, {"id": "I1mgA", "text": "$\\frac{2 \\mu \\mathrm{M}^{2} \\mathrm{~g}}{\\mathrm{P}^{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using kinematic relation,\n$v^{2}=u^{2}-2 a s$\nThe momentum pis given by\n$\\begin{array}{l}\np=M u \\\\\nu=\\frac{P}{M}\n\\end{array}$\nand acceleration is given as\n$a=\\mu g$\nSubstituting values in Eq. (i), we get\n$\\begin{array}{l}\n0=\\mathrm{u} 2-2 \\mathrm{as}(\\because f \\in \\text { alvelocity }, v=0) \\\\\n0=\\left(\\frac{\\mathrm{p}}{\\mathrm{M}}\\right)^{2}-2 \\mu \\mathrm{gs} \\\\\n\\left(\\frac{\\mathrm{p}}{\\mathrm{M}}\\right)^{2}=2 \\mu \\mathrm{gs} \\\\\n\\Rightarrow \\mathrm{s}=\\frac{\\mathrm{p}^{2}}{2 \\mathrm{M}^{2} \\mu \\mathrm{g}}\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fa10279619d9d8a1e05", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "A block of mass $m$ is moving on a rough horizontal surface. The coefficient of kinetic friction between block and surface is $\\mu_{k}$, The net force exerted by the surface on the block is $\\quad(\\mathrm{g}=$ acceleration due to gravity $)$", "image": null}, "options": [{"id": "Edtfz", "text": "$\\operatorname{mg}\\left(1+\\mu_{\\mathrm{k}}\\right)^{1 / 2}$", "image": null, "isCorrect": false}, {"id": "PVPo3", "text": "$\\left[\\mathrm{mg}\\left(1+\\mu_{\\mathrm{k}}\\right)\\right]^{1 / 2}$", "image": null, "isCorrect": false}, {"id": "2xzsH", "text": "$\\mathrm{mg}\\left(1+\\mu_{\\mathrm{k}}^{2}\\right)$", "image": null, "isCorrect": false}, {"id": "RrQvV", "text": "$\\mathrm{mg}\\left(1+\\mu_{\\mathrm{k}}^{2}\\right)^{1 / 2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given that:\nIf body of mass \\(m\\) moving with rough horizontal surface Kinetic fiction = u\n\\(\\begin{aligned} F_{\\text {net }} &=\\sqrt{f_{1}^{2}+f_{3}{ }^{2}} \\\\ &=\\sqrt{\\left(m g^{2}\\right)^{2}+(l m g)^{2}} \\end{aligned}\\)\n\\(F=m g \\sqrt{1+\\mu^{2}}=\\) option \\(A\\) is correct", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f2f0279619d9d8a1a74", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}], "question": {"text": "A block of mass $4 \\mathrm{~kg}$ is placed on a horizontal surface having coefficients of static\nand kinetic friction as $0 \\cdot 5$ and $0 \\cdot 4$ respectively. If a force, parallel to horizontal\nsurface of $4 \\mathrm{~N}$ is applied to the body, then the force of friction acting on the body will\nbe $\\left[\\mathrm{g}=10 \\mathrm{~m} / \\mathrm{s}^{2}\\right]$", "image": null}, "options": [{"id": "cWPbU", "text": "$16 \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "zaPji", "text": "$20 \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "4xU20", "text": "$8 \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "r77sX", "text": "$4 \\mathrm{~N}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "No Solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e9c0279619d9d8a15d7", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "A body weighing $20 \\mathrm{~kg}$ just slides down a rough inclined plane that rises 5 in 12 . The coefficient of friction is", "image": null}, "options": [{"id": "8tVHJ", "text": "$0.46$", "image": null, "isCorrect": true}, {"id": "6pi91", "text": "$4.6$", "image": null, "isCorrect": false}, {"id": "msNrj", "text": "$0.52$", "image": null, "isCorrect": false}, {"id": "y4vIR", "text": "$0.12$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given situation can be shown as\nAs the plane rises 5 in 12\n$$\n\\therefore \\quad \\sin \\theta=\\frac{5}{12}\n$$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/oDX0K96EQW7XdE3F37DLs1ltpJc1z-tmy7fOUEGTbJs.original.fullsize.png\"><br>\nand $\\cos \\theta=\\sqrt{1-\\sin ^{2} \\theta}=\\sqrt{1+\\left(\\frac{5}{12}\\right)^{2}}$\n$$\n=\\frac{\\sqrt{119}}{12}\n$$\nSo, the coefficient of friction,\n$$\n\\mu=\\tan \\theta=\\frac{\\sin \\theta}{\\cos \\theta}=\\frac{5}{12} \\times \\frac{12}{\\sqrt{119}}=\\frac{5}{\\sqrt{119}}=0.46\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e9c0279619d9d8a15d3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "A body takes $\\mathrm{n}$ times as much time to slide down a $45^{\\circ}$ rough incline as it takes to slide down a smooth $45^{\\circ}$ incline. The coefficient of friction between the body and the incline will be", "image": null}, "options": [{"id": "I8rSI", "text": "$\\frac{1}{1-n^{2}}$", "image": null, "isCorrect": false}, {"id": "sMCYu", "text": "$1-\\frac{1}{n^{2}}$", "image": null, "isCorrect": true}, {"id": "8wswb", "text": "$\\sqrt{\\frac{1}{1-n^{2}}}$", "image": null, "isCorrect": false}, {"id": "io5Rk", "text": "$\\sqrt{1-\\frac{1}{n^{2}}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The coefficient of friction,\nHere,\n$$\n\\begin{aligned}\n\\mu &=\\tan \\theta\\left(1-\\frac{1}{n^{2}}\\right) \\\\\n\\theta &=45^{\\circ}\n\\end{aligned}\n$$\n$\\therefore$\n$$\n\\mu=\\tan 45^{\\circ}\\left(1-\\frac{1}{n^{2}}\\right)=1-\\frac{1}{n^{2}}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e9c0279619d9d8a15d2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "A body is projected up along a rough inclined plane of inclination $45^{\\circ}$. The coefficient of friction is $0.5$. Then the retardation of the block is", "image": null}, "options": [{"id": "u5CZB", "text": "$\\frac{g}{2 \\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "oB5h0", "text": "$\\frac{g}{2}$", "image": null, "isCorrect": false}, {"id": "7ER0b", "text": "$\\frac{3 g}{2 \\sqrt{2}}$", "image": null, "isCorrect": true}, {"id": "FW2rR", "text": "$\\frac{g}{\\sqrt{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Retardation \n\\begin{aligned}\n&=g(\\sin \\theta+\\mu \\cos \\theta) \\\\\n&=g\\left(\\frac{1}{\\sqrt{2}}+0.5 \\frac{1}{\\sqrt{2}}\\right) \\\\\n&=\\frac{g}{\\sqrt{2}}(1+0.5) \\\\\n&=\\frac{1.5 g}{\\sqrt{2}}=\\frac{3 g}{2 \\sqrt{2}}\n\\end{aligned}", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e9b0279619d9d8a15d1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "A weight $W$ can be just supported on a rough inclined place by a force $F$ either acting along the plane or horizontally. If $\\theta$ is the angle of friction, then $\\mathrm{F} / \\mathrm{W}$ is", "image": null}, "options": [{"id": "hws9U", "text": "$\\tan \\theta$", "image": null, "isCorrect": true}, {"id": "DNiHS", "text": "$\\sec \\theta$", "image": null, "isCorrect": false}, {"id": "iaN4D", "text": "$\\sin \\theta$", "image": null, "isCorrect": false}, {"id": "1SuSf", "text": "$\\cos \\theta$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Angle of friction, is the angle which the resultant of limiting friction and normal reaction makes with the normal reaction.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/Lc0PC58SQXOX8XUCHJbtAhb9JMWP0Prk3DApB81armQ.original.fullsize.png\"><br>\n$\\therefore$\n$$\n\\tan \\theta=\\frac{F}{R}\n$$\nOr\n$$\n\\frac{F}{W}=\\tan \\theta\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "65a2632a0279619d9d8a3c91", "title": "Non-uniform Circular Motion", "totalQuestions": 29, "questions": [{"_id": "6a44d3068c30a4553e1bdf59", "type": "singleCorrect", "question": {"text": "A stone of mass $40$ g is tied to a light inextensible string of length $50$ cm and whirled in a vertical circle at the rate of $30$ revolutions per minute. The tension in the string when it is at the lowest point of the circle is<br>(Take gravitational acceleration, $g = 10\\,\\text{m/s}^2$ and $\\pi^2 = 10$)", "image": null}, "options": [{"id": "XZBqC", "label": "A", "text": "$0.4$ N", "isCorrect": false, "image": null}, {"id": "HKSIk", "label": "B", "text": "$0.5$ N", "isCorrect": false, "image": null}, {"id": "YKsOM", "label": "C", "text": "$0.6$ N", "isCorrect": true, "image": null}, {"id": "F64Qh", "label": "D", "text": "$0.7$ N", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Mass of the stone, $m = 40$ g $= 0.04$ kg<br><br>Length of the string, $r = 50$ cm $= 0.5$ m<br><br>Frequency of revolution, $f = 30$ rev/min $= \\dfrac{30}{60}$ rev/s $= 0.5$ rev/s<br><br>Angular velocity, $\\omega = 2\\pi f = 2\\pi \\times 0.5 = \\pi$ rad/s<br><br>At the lowest point of the vertical circle, the net force towards the center provides the necessary centripetal force. The forces acting on the stone are tension $T$ upwards and weight $mg$ downwards.<br><br>$T - mg = m\\omega^2 r$<br><br>$T = m(g + \\omega^2 r)$<br><br>Substituting the given values and using $\\pi^2 = 10$:<br><br>$T = 0.04(10 + \\pi^2 \\times 0.5)$<br><br>$T = 0.04(10 + 10 \\times 0.5)$<br><br>$T = 0.04(10 + 5)$<br><br>$T = 0.04 \\times 15 = 0.6$ N", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2dc8c30a4553e1bdd95", "type": "singleCorrect", "question": {"text": "A car of mass m is crossing the convex bridge of radius of curvature R with speed V. At the highest point the thrust is ($g$ = gravitational acceleration)", "image": null}, "options": [{"id": "EwRg2", "label": "A", "text": "$mg$", "isCorrect": false, "image": null}, {"id": "zn1mE", "label": "B", "text": "$\\dfrac{mv^2}{R}$", "isCorrect": false, "image": null}, {"id": "XzRfr", "label": "C", "text": "$mg - \\dfrac{mv^2}{R}$", "isCorrect": true, "image": null}, {"id": "Dc5st", "label": "D", "text": "$mg + \\dfrac{mv^2}{R}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "At the highest point of the convex bridge, the forces acting on the car are its weight $mg$ acting downwards and the normal reaction $N$ acting upwards.<br><br>The net force towards the center of the circular path provides the necessary centripetal force.<br><br>$mg - N = \\dfrac{mv^2}{R}$<br><br>$N = mg - \\dfrac{mv^2}{R}$<br><br>The thrust exerted by the car on the bridge is equal in magnitude to the normal reaction $N$.<br><br>Answer: $mg - \\dfrac{mv^2}{R}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b95bf9280d7f9932a9d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A particle describes a horizontal circle on smooth inner surface of a cone as shown in figure. If the height of the circle above the vertex is 10 cm . The speed of the particle is\n(g, acceleration due to gravity $=10 \\mathrm{~m} / \\mathrm{s}^2$ )\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/eNqZuAbdU8YwQZk_3lf6qilHkwaMN5U6ByivClr6aLQ.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "5Q3do", "text": "$2 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "EwpMj", "text": "$1.5 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "py43u", "text": "$1 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": true}, {"id": "0A8go", "text": "$0.5 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $\\theta$ be the angle made by the slant surface of the cone with the horizontal.<br><br>The normal reaction $N$ exerted by the smooth inner surface on the particle is perpendicular to the surface. Thus, $N$ makes an angle $\\theta$ with the vertical.<br><br>Balancing the forces in the vertical direction:<br><br>$N \\cos \\theta = mg$<br><br>The horizontal component of the normal reaction provides the necessary centripetal force for the circular motion:<br><br>$N \\sin \\theta = \\dfrac{mv^2}{r}$<br><br>Dividing the two equations, we get:<br><br>$\\tan \\theta = \\dfrac{v^2}{rg}$<br><br>From the geometry of the cone, the radius $r$ of the circular path and its height $h$ above the vertex are related by:<br><br>$\\tan \\theta = \\dfrac{h}{r} \\Rightarrow r \\tan \\theta = h$<br><br>Substituting this into the velocity equation:<br><br>$v^2 = rg \\tan \\theta = hg$<br><br>Given $h = 10 \\text{ cm} = 0.1 \\text{ m}$ and $g = 10 \\text{ m/s}^2$:<br><br>$v = \\sqrt{0.1 \\times 10} = \\sqrt{1} = 1 \\text{ m/s}$<br><br>Answer: $1 \\mathrm{~m} / \\mathrm{s}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b86bf9280d7f9932a0a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Radius of curved road is ' R ', width of road is ' b '. The outer edge of road is raised by ' $h$ ' with respect to inner edge so that a car with velocity ' $V$ ' can pass safe over it, then value of ' $h$ ' is ( $g=$ acceleration due to gravity)", "image": null}, "options": [{"id": "KXN1c", "text": "$\\frac{V^2 b}{R g}$", "image": null, "isCorrect": true}, {"id": "78XqQ", "text": "$\\frac{\\mathrm{V}}{\\mathrm{Rgb}}$", "image": null, "isCorrect": false}, {"id": "ltSnb", "text": "$\\frac{V^2 R}{g}$", "image": null, "isCorrect": false}, {"id": "z6Nlt", "text": "$\\frac{V^2 b}{g}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a vehicle to safely negotiate a curved road of radius $R$ at velocity $V$, the road must be banked at an angle $\\theta$ given by:<br><br>$\\tan \\theta = \\dfrac{V^2}{R g}$<br><br>From the geometry of the banked road, if $h$ is the height of the outer edge and $b$ is the width of the road, we have:<br><br>$\\sin \\theta = \\dfrac{h}{b}$<br><br>For small angles of banking, $\\sin \\theta \\approx \\tan \\theta$. Therefore:<br><br>$\\dfrac{h}{b} = \\dfrac{V^2}{R g}$<br><br>$h = \\dfrac{V^2 b}{R g}$<br><br>Answer: $\\frac{V^2 b}{R g}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b73bf9280d7f9932959", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A car is driven on the banked road of radius of curvature 20 m with maximum safe speed. In order to increase its safety speed by $20 \\%$, without changing the angle of banking, the increase in the radius of curvature will be\n[Assume friction is same on the road]", "image": null}, "options": [{"id": "X0zSP", "text": "28.8 m", "image": null, "isCorrect": false}, {"id": "HW3fU", "text": "$14.4 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "T8GfM", "text": "8.8 m", "image": null, "isCorrect": true}, {"id": "D22d9", "text": "$4.8 \\mathrm{~m}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The maximum safe speed on a banked road is given by $v = \\sqrt{rg \\left( \\dfrac{\\mu_s + \\tan \\theta}{1 - \\mu_s \\tan \\theta} \\right)}$.<br><br>Since the angle of banking $\\theta$ and the coefficient of friction $\\mu_s$ remain constant, $v \\propto \\sqrt{r}$, which implies $r \\propto v^2$.<br><br>Given the initial radius of curvature $r_1 = 20$ m and the new speed $v_2 = v_1 + 0.20 v_1 = 1.2 v_1$.<br><br>Using the proportionality relation, $\\dfrac{r_2}{r_1} = \\left( \\dfrac{v_2}{v_1} \\right)^2$.<br><br>$\\dfrac{r_2}{20} = (1.2)^2 = 1.44$<br><br>$r_2 = 20 \\times 1.44 = 28.8$ m.<br><br>The increase in the radius of curvature is $\\Delta r = r_2 - r_1 = 28.8 - 20 = 8.8$ m.<br><br>Answer: 8.8 m", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b64bf9280d7f99328c2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A vehicle is moving with uniform speed along 3 different shaped roads as horizontal, concave and convex. The surface of road on which, the normal reaction on vehicle is maximum is", "image": null}, "options": [{"id": "9sxu4", "text": "convex", "image": null, "isCorrect": false}, {"id": "za59j", "text": "concave", "image": null, "isCorrect": true}, {"id": "M1fd5", "text": "horizontal", "image": null, "isCorrect": false}, {"id": "3lgAI", "text": "same on all the 3 surface", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $m$ be the mass of the vehicle and $v$ be its uniform speed.<br><br>For a horizontal road, the normal reaction $N$ balances the weight of the vehicle:<br>$N_{\\text{horizontal}} = mg$<br><br>For a convex road, the centripetal force is directed downwards towards the center of curvature:<br>$mg - N_{\\text{convex}} = \\dfrac{mv^2}{r} \\Rightarrow N_{\\text{convex}} = mg - \\dfrac{mv^2}{r}$<br><br>For a concave road, the centripetal force is directed upwards towards the center of curvature:<br>$N_{\\text{concave}} - mg = \\dfrac{mv^2}{r} \\Rightarrow N_{\\text{concave}} = mg + \\dfrac{mv^2}{r}$<br><br>Comparing the normal reactions, we get $N_{\\text{concave}} > N_{\\text{horizontal}} > N_{\\text{convex}}$.<br><br>Thus, the normal reaction is maximum on the concave road.<br><br>Answer: concave", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2627a0279619d9d8a34dd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "A solid oylinder and a solid sphere having same mass and same radius roll down on the same inclined plane. The fatio of the acceleration of the cylinder ' $\\mathrm{a}_{\\mathrm{c}}$ ' to that of sphere ' $\\mathrm{a}_{\\mathrm{s}}$ ' is", "image": null}, "options": [{"id": "ozTOc", "text": "$\\frac {11}{15}$", "image": null, "isCorrect": false}, {"id": "8saNc", "text": "$\\frac {13}{14}$", "image": null, "isCorrect": false}, {"id": "Ri6K8", "text": "$\\frac {15}{14}$", "image": null, "isCorrect": false}, {"id": "j3z3h", "text": "$\\frac {14}{15}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For sphere: M.I. $\\mathrm{I}_{\\mathrm{S}}=\\frac{2}{5} \\dot{\\mathrm{MR}}^2$\nFor cylinder: M.I. $\\mathrm{I}_{\\mathrm{C}}=\\frac{1}{2} \\mathrm{MR}^2$\nAcceleration: $\\mathrm{a}=\\frac{\\mathrm{g} \\sin \\theta}{1+\\frac{\\mathrm{I}}{\\mathrm{MR}^2}}$\n$\\begin{aligned}\n& \\therefore \\quad \\frac{\\mathrm{a}_{\\mathrm{c}}}{\\mathrm{a}_{\\mathrm{s}}}=\\frac{1+\\frac{\\mathrm{I}_{\\mathrm{s}}}{\\mathrm{MR}^2}}{1+\\frac{\\mathrm{I}_{\\mathrm{C}}}{\\mathrm{MR}^2}}=\\frac{\\mathrm{MR}^2+\\mathrm{I}_{\\mathrm{s}}}{\\mathrm{MR}^2+\\mathrm{I}_{\\mathrm{c}}}=\\frac{\\mathrm{MR}^2+\\frac{2}{5} \\mathrm{MR}^2}{\\mathrm{MR}^2+\\frac{1}{2} \\mathrm{MR}^2} \\\\\n& \\therefore \\quad \\frac{\\mathrm{a}_{\\mathrm{c}}}{\\mathrm{a}_{\\mathrm{s}}}=\\frac{7}{5} \\times \\frac{2}{3}=\\frac{14}{15}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2621a0279619d9d8a31d2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "A railway track is banked for a speed ' $v$ ' by elevating outer rail by a height ' $h$ ' above the inner rail. The distance between two rails is ' $\\mathrm{d}$ ' then the radius of curvature of track is ( $\\mathrm{g}=$ gravitational acceleration)", "image": null}, "options": [{"id": "qPtve", "text": "$\\frac{\\mathrm{v}^2 \\mathrm{~d}}{\\text { gh }}$", "image": null, "isCorrect": true}, {"id": "S0br9", "text": "$\\frac{2 \\mathrm{v}^2}{\\mathrm{gdh}}$", "image": null, "isCorrect": false}, {"id": "mieQE", "text": "$\\frac{g d}{2 v^2 h}$", "image": null, "isCorrect": false}, {"id": "2JStk", "text": "$\\frac{v^2}{2 g h d}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/B31ONDuBvBnz7siNJJ-Rz-rFe6KzsvSveA0mMGX6MIY.original.fullsize.png\"><br>\n\nFrom figure,\n$$\n\\begin{array}{ll} \n& \\tan \\theta=\\frac{\\mathrm{h}}{\\mathrm{d}} \\\\\n\\therefore \\quad & \\frac{\\mathrm{v}^2}{\\mathrm{rg}}=\\frac{\\mathrm{h}}{\\mathrm{d}} \\quad \\ldots .\\left(\\because \\tan \\theta=\\frac{\\mathrm{v}^2}{\\mathrm{rg}}\\right) \\\\\n\\therefore \\quad & \\mathrm{r}=\\frac{\\mathrm{v}^2 \\mathrm{~d}}{\\mathrm{gh}}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261ad0279619d9d8a2e72", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "A solid sphere rolls without slipping on an inclined plane at an angle $\\theta$. The ratio of total kinetic energy to its rotational kinetic energy is", "image": null}, "options": [{"id": "sXlIw", "text": "$\\frac{7}{2}$", "image": null, "isCorrect": true}, {"id": "fL5nm", "text": "$\\frac{5}{2}$", "image": null, "isCorrect": false}, {"id": "0liiR", "text": "$\\frac{7}{3}$", "image": null, "isCorrect": false}, {"id": "7STqg", "text": "$\\frac{5}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Moment of Inertia of a solid sphere, $I=\\frac{2}{5} \\mathrm{MR}^2$\nSince there is no slipping,\n$\\mathrm{v}=\\mathrm{R} \\omega$\n$\\therefore \\quad$ Rotational kinetic energy $\\mathrm{E}_{\\mathrm{Tot}}=\\frac{1}{2} \\mathrm{I} \\omega^2$\n$\\begin{aligned}\n& =\\frac{1}{2} \\times \\frac{2}{5} \\times \\mathrm{M} \\times \\mathrm{R}^2 \\times \\omega^2 \\\\\n& =\\frac{\\mathrm{MR}^2 \\omega^2}{5} \\\\\n& =\\frac{\\mathrm{MV}^2}{5}... (i)\n\\end{aligned}$\nTotal kinetic energy\n$\\begin{aligned}\n\\mathrm{E}_{\\mathrm{K}} & =\\frac{1}{2} \\mathrm{I}^2+\\frac{1}{2} \\mathrm{MV}^2 \\\\\n& =\\frac{\\mathrm{MV}^2}{5}+\\frac{\\mathrm{MV}^2}{2} \\\\\n& =\\frac{7 \\mathrm{MV}^2}{10}... (ii)\n\\end{aligned}$\nDividing (ii) by (i), we get,\n$\\frac{\\mathrm{E}_{\\mathrm{K}}}{\\mathrm{E}_{\\mathrm{me}}}=\\frac{\\left(\\frac{7 \\mathrm{MV}^2}{10}\\right)}{\\left(\\frac{\\mathrm{MV}^2}{5}\\right)}=\\frac{7}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2614c0279619d9d8a2b6d", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"t
