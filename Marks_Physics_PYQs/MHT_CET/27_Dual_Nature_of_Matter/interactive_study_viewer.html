"syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2615c0279619d9d8a2bf0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "According to de-Broglie hypothesis if an electron of mass ' $\\mathrm{m}$ ' is accelerated by potential difference ' $\\mathrm{V}$ ' then associated wavelength is ' $\\lambda$ '. When a proton of mass ' $M$ ' is accelerated through potential difference ' $9 \\mathrm{~V}$ ' then the wavelength associated with it is", "image": null}, "options": [{"id": "QvFYq", "text": "$\\frac{\\lambda}{3} \\sqrt{\\frac{M}{m}}$", "image": null, "isCorrect": false}, {"id": "nIW1T", "text": "$\\frac{\\lambda}{3} \\sqrt{\\frac{\\mathrm{m}}{\\mathrm{M}}}$", "image": null, "isCorrect": true}, {"id": "f4CWV", "text": "$\\frac{\\lambda}{6} \\sqrt{\\frac{m}{M}}$", "image": null, "isCorrect": false}, {"id": "AS5Gg", "text": "$\\frac{\\lambda}{6} \\sqrt{\\frac{M}{m}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Do Broglie relation\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/oXvQJV_UhwC0HS06mRnvo9pAoxo6xJSUhaHUp8yVTO4.original.fullsize.png\"><br>\nEnergy conservation,<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/3LUJ3O-zWFlFpEHivY99vuGtpJ4_CDXMuaVKHmhKSfU.original.fullsize.png\"><br>\nEnergy vs momentum relation<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/6cBmWJ_DvPjV8JivHaeByHXe8Q03bpp1BMolQhGHKIg.original.fullsize.png\"><br>\nUsing equation (1), (2) and (3)\n$\\begin{aligned}\n& \\lambda=\\frac{h}{p}=\\frac{h}{\\sqrt{2 K m}} \\\\\n& \\lambda=\\frac{h}{\\sqrt{2 q V m}}\n\\end{aligned}$\nNow, for proton of mass $M$ that is accelerated through $9 \\mathrm{~V}$, the de-broglie wavelength can be written as,\n$\\begin{aligned}\n& \\lambda_p=\\frac{h}{\\sqrt{2 q(9 V) M}} \\\\\n& \\therefore \\frac{\\lambda}{\\lambda_p}=3 \\sqrt{\\frac{M}{m}} \\\\\n& \\Rightarrow \\lambda_p=\\frac{\\lambda}{3} \\sqrt{\\frac{m}{M}}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2614b0279619d9d8a2b67", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "Electrons of mass $m$ with de-Broglie wavelength $\\lambda$ fall on the target. The cut-off wavelength $\\lambda_0$ is equal to [ $h=$ Planck's constant, $C=$ velocity of light $]$", "image": null}, "options": [{"id": "FnDbW", "text": "$\\frac{2 m c \\lambda^2}{h}$", "image": null, "isCorrect": true}, {"id": "RX6Nq", "text": "$\\frac{m c \\lambda}{h}$", "image": null, "isCorrect": false}, {"id": "yreLC", "text": "$\\frac{2 h}{m c \\lambda^2}$", "image": null, "isCorrect": false}, {"id": "sYYXS", "text": "$\\frac{2 m c \\lambda}{h}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using de-Broglie equation $\\lambda=\\frac{h}{p}$ where $p=\\sqrt{2 m E}$\n$\\Rightarrow \\lambda=\\frac{h}{\\sqrt{2 m E}}$\nEnergy of the X-ray emitted $E=\\frac{h c}{\\lambda_0}$\n$\\therefore \\lambda=\\frac{h}{\\sqrt{2 m \\times \\frac{h c}{\\lambda_0}}} \\Rightarrow \\lambda_0=\\frac{2 m c \\lambda^2}{h}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2614b0279619d9d8a2b66", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "If the potential difference used to accelerate electrons is doubled, by what factor does the de-Broglie wavelength associated with the electrons change?", "image": null}, "options": [{"id": "ia5Q2", "text": "Wavelength is increased to $\\sqrt{2}$ times.", "image": null, "isCorrect": false}, {"id": "iFTWu", "text": "Wavelength is decreased to $\\sqrt{2}$ times.", "image": null, "isCorrect": false}, {"id": "gERfv", "text": "Wavelength is decreased to $\\frac{1}{\\sqrt{2}}$ times.", "image": null, "isCorrect": true}, {"id": "5Td0O", "text": "Wavelength is increased to $\\frac{1}{\\sqrt{2}}$ times.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "De Broglie wavelength,\n$\\lambda=\\frac{h}{\\sqrt{2 m q V}} \\propto \\frac{1}{\\sqrt{V}}$\nIf the potential difference $V$ is doubled, the de Broglie wavelength is decreased to $\\frac{1}{\\sqrt{2}}$ times.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2612a0279619d9d8a2a53", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "An electron of mass ' $m$ ' and a photon have same energy $E$. The ratio of the de-Broglie wavelengths associated with them is (c = velocity of light in air)", "image": null}, "options": [{"id": "942iR", "text": "$\\left[\\frac{\\mathrm{E}}{2 \\mathrm{M}}\\right]^{\\frac{1}{2}}$", "image": null, "isCorrect": false}, {"id": "lV8jj", "text": "$\\frac{1}{\\mathrm{c}}\\left[\\frac{\\mathrm{E}}{2 \\mathrm{~m}}\\right]^{\\frac{1}{2}}$", "image": null, "isCorrect": true}, {"id": "X8vDD", "text": "$\\mathrm{c}(2 \\mathrm{mE})^{\\frac{1}{2}}$", "image": null, "isCorrect": false}, {"id": "Ei7aH", "text": "$\\frac{1}{\\mathrm{c}}\\left[\\frac{2 \\mathrm{~m}}{\\mathrm{E}}\\right]^{\\frac{1}{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "De-broglie wavelength\nFor an electron, $\\lambda_{\\mathrm{e}}=\\frac{\\mathrm{h}}{\\sqrt{2 \\mathrm{mE}}}$\nFor photon, $\\mathrm{E}=\\mathrm{pc} \\Rightarrow \\lambda_{\\text {Photon }}=\\frac{\\mathrm{hc}}{\\mathrm{E}}$\n$\\Rightarrow \\frac{\\lambda_{\\mathrm{e}}}{\\lambda_{\\text {photon }}}=\\frac{\\mathrm{h}}{\\sqrt{2 \\mathrm{mE}}} \\times \\frac{\\mathrm{E}}{\\mathrm{hc}}=\\left(\\frac{\\mathrm{E}}{2 \\mathrm{~m}}\\right)^{1 / 2} \\frac{1}{\\mathrm{c}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261150279619d9d8a29ab", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}], "question": {"text": "The de-Broglie wavelength of an electron moving in the $n^{\\text {th }}$ Bohr orbit of radius $r$ is", "image": null}, "options": [{"id": "1dKCY", "text": "$\\frac{n r}{2 \\pi}$", "image": null, "isCorrect": false}, {"id": "L69Q4", "text": "$\\frac{2 \\pi r}{n}$", "image": null, "isCorrect": true}, {"id": "YyIhN", "text": "$\\frac{n r}{\\pi}$", "image": null, "isCorrect": false}, {"id": "TpBEt", "text": "$n \\pi r$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The de Broglie wavelength of an electron is given by\n$\\lambda=\\frac{h}{m v}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/FFaLhczKJ7oivx7marGzWU2fDeCVB7cY95hLGF0iSRA.original.fullsize.png\">\nTaking the ratio of equation (1) and (2),\n$\\frac{h}{\\lambda}=\\frac{n h}{2 \\pi r}$\n$\\Rightarrow \\lambda=\\frac{2 \\pi r}{n}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261030279619d9d8a2917", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "When an electron in a hydrogen atom jumps from the third excited state to the ground state, the de-Broglie wavelength associated with the electron becomes", "image": null}, "options": [{"id": "HH06V", "text": "$\\frac{1}{32}$", "image": null, "isCorrect": false}, {"id": "ABNHe", "text": "$\\frac{1}{4}$", "image": null, "isCorrect": true}, {"id": "mzzjf", "text": "$\\frac{1}{8}$", "image": null, "isCorrect": false}, {"id": "BQEZt", "text": "$\\frac{1}{16}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The De Broglie wavelength is $\\lambda=\\frac{h}{p}$, where $h=$ Planck's constant and $p=$ momentum of the electron. Also, momentum $p=m v$ and kinetic energy $E_K=\\frac{1}{2} m v^2$ From the above equation, we can relate momentum $p$ and kinetic energy $E_K$ as, $p=\\sqrt{2 m E_K}$\nNow the ratio of wavelength of hydrogen atom when the atom jumps from third excited state to ground state viz $(n=4$ to $n=1$ )\n$\\frac{\\lambda_1}{\\lambda_2}=\\frac{\\frac{h}{p_1}}{\\frac{h}{p_2}}=\\frac{p_2}{p_1}=\\sqrt{\\frac{E_{K 2}}{E_{K 1}}}-\\cdots(1)$\nAlso, we know $E_{K n}=\\frac{-13.6 Z^2}{n^2}$\nUsing equation (1),\n$\\frac{\\lambda_1}{\\lambda_2}=\\frac{\\sqrt{1^2}}{\\sqrt{4^2}}$\nSo, the ratio of the wavelength of ground state $\\{n=1\\}$ to $3^{\\text {rd }}$ excited state $\\{n=4\\}$ is $\\frac{1}{4}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260b90279619d9d8a26c9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "De-Broglie wavelength associated with an electron accelerated through a potential difference ' $\\mathrm{V}$ ' is ' $\\lambda$ '. When the accelerating potential is increased to ' $4 \\mathrm{~V}$ ', de-Broglie wavelength.", "image": null}, "options": [{"id": "g2nSi", "text": "reduces to half", "image": null, "isCorrect": true}, {"id": "QTzCh", "text": "remains the same", "image": null, "isCorrect": false}, {"id": "BUsJp", "text": "reduces to $(1 / 4)^{\\text {th }}$", "image": null, "isCorrect": false}, {"id": "YPS5R", "text": "increases by $25 \\%$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "De-Broglie wavelength, $\\lambda=\\frac{1.228}{\\sqrt{V}}(\\mathrm{~nm})$\nIf $\\mathrm{V}$ is increased to $4 \\mathrm{~V}$, then $\\lambda$ will become $\\frac{1}{\\sqrt{4}}$ times or $\\frac{1}{2}$ times.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260a40279619d9d8a2625", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "An electron of mass ' $m$ ' and a photon have same energy ' $E$ '. The ratio of de-Broglie wavelength of electron to the wavelength of photon is $(\\mathrm{c}=$ velocity of light $)$", "image": null}, "options": [{"id": "2OTAd", "text": "$c \\sqrt{\\frac{E}{m}}$", "image": null, "isCorrect": false}, {"id": "cUyXU", "text": "$\\frac{1}{c} \\sqrt{\\frac{2 m}{E}}$", "image": null, "isCorrect": false}, {"id": "MlWjw", "text": "$\\frac{1}{c} \\sqrt{\\frac{E}{2 m}}$", "image": null, "isCorrect": true}, {"id": "tAfz1", "text": "$c \\sqrt{\\frac{m}{E}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If $\\mathrm{E}$ is the kinetic energy of the electron, then\n$$\n\\begin{aligned}\n& \\mathrm{E}=\\frac{\\mathrm{p}^2}{2 \\mathrm{~m}}(\\mathrm{p}=\\text { momentum }) \\\\\n& \\therefore \\mathrm{p}=\\sqrt{2 \\mathrm{mE}} \\\\\n& \\therefore \\text { de Broglie wavelength of electron } \\\\\n& \\lambda_{\\mathrm{e}}=\\frac{1}{\\sqrt{2 \\mathrm{mE}}} \\\\\n& \\text { Energy of photon, } \\mathrm{E}=\\frac{\\mathrm{hc}}{\\lambda} \\therefore \\lambda_{\\mathrm{p}}=\\frac{\\mathrm{hc}}{\\mathrm{E}} \\\\\n& \\therefore \\frac{\\lambda_{\\mathrm{e}}}{\\lambda_{\\mathrm{p}}}=\\frac{\\mathrm{h}}{\\sqrt{2 \\mathrm{mE}}} \\times \\frac{\\mathrm{E}}{\\mathrm{hc}}=\\frac{1}{\\mathrm{c}} \\sqrt{\\frac{\\mathrm{E}}{2 \\mathrm{~m}}}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260930279619d9d8a25a0", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "A photon has wavelength $3 \\mathrm{~nm}$, then its momentum and energy respectively will be\n$$\n\\left[\\mathrm{h}=6.63 \\times 10^{-34} \\mathrm{Js}, \\mathrm{c}=\\text { velocity of light }=3 \\times 10^8 \\mathrm{~m} / \\mathrm{s}\\right]\n$$", "image": null}, "options": [{"id": "LrjtT", "text": "$2.21 \\times 10^{-43} \\mathrm{~kg} \\mathrm{~ms}^{-1} ; 6.63 \\times 10^{-34} \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "4owJ8", "text": "$2.21 \\times 10^{-34} \\mathrm{~kg} \\mathrm{~ms}^{-1} ; 6.63 \\times 10^{-25} \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "w7cS4", "text": "$2.21 \\times 10^{-25} \\mathrm{~kg} \\mathrm{~ms}^{-1} ; 6.63 \\times 10^{-17} \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "pH59a", "text": "$2.21 \\times 10^{-16} \\mathrm{~kg} \\mathrm{~ms}^{-1} ; 6.63 \\times 10^{-19} \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Momentum, $\\mathrm{p}=\\frac{\\mathrm{h}}{\\lambda}=\\frac{6.63 \\times 10^{-34}}{3 \\times 10^{-9}}=2.21 \\times 10^{-25} \\mathrm{~kg} \\mathrm{~ms}^{-1}$\nEnergy, $\\mathrm{E}=\\frac{\\mathrm{hc}}{\\lambda}=\\mathrm{pc}=2.21 \\times 10^{-25} \\times 3 \\times 10^8=6.63 \\times 10^{-17} \\mathrm{~J}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2606b0279619d9d8a2454", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "Kinetic energy of a proton is equal to energy ' $E$ ' of a photon. Let ' $\\lambda_1$ ' be the de-Broglie wavelength of proton and ' $\\lambda_2$ ' is the wavelength of photon. If $\\frac{\\lambda_1}{\\lambda_2} \\propto \\mathrm{E}^{\\mathrm{n}}$, then the value of ' $n$ ' is", "image": null}, "options": [{"id": "5ddFN", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": true}, {"id": "5929p", "text": "$\\frac{1}{4}$", "image": null, "isCorrect": false}, {"id": "dtnkt", "text": "2", "image": null, "isCorrect": false}, {"id": "balTL", "text": "4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If $E$ is the kinetic energy of the proton, then $E=\\frac{p^2}{2 m}$ where $p$ is the momentum and $m$ is the mass of proton\n$$\n\\therefore \\mathrm{p}=\\sqrt{2 \\mathrm{mE}} \\quad \\therefore \\lambda_1=\\frac{\\mathrm{h}}{\\mathrm{p}}=\\frac{\\mathrm{h}}{\\sqrt{2 \\mathrm{mE}}}\n$$\nFor photon, $\\mathrm{E}=\\frac{\\mathrm{hc}}{\\lambda_2} \\therefore \\lambda_2=\\frac{\\mathrm{hc}}{\\mathrm{E}}$\n$$\n\\begin{aligned}\n& \\therefore \\frac{\\lambda_1}{\\lambda_2}=\\frac{\\mathrm{h}}{\\sqrt{2 \\mathrm{mE}}} \\cdot \\frac{\\mathrm{E}}{\\mathrm{hc}}=\\frac{1}{\\mathrm{c}} \\sqrt{\\frac{\\mathrm{E}}{2 \\mathrm{~m}}} \\\\\n& \\therefore \\frac{\\lambda_1}{\\lambda_2} \\propto \\mathrm{E}^{1 / 2} \\quad \\therefore \\mathrm{n}=\\frac{1}{2}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2605a0279619d9d8a23cd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "A proton and alpha particle are accelerated through the same potential difference. The ratio of the de-Broglie wavelength of proton to that of alpha will be (mass of alpha particle is four times mass of proton.)", "image": null}, "options": [{"id": "G0bzV", "text": "$1: 2$", "image": null, "isCorrect": false}, {"id": "z6SB1", "text": "$2 \\sqrt{2}: 1$", "image": null, "isCorrect": true}, {"id": "lJzpA", "text": "$1: 1$", "image": null, "isCorrect": false}, {"id": "sjTT1", "text": "$2: 1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "De-Broglie wavelength is given by\n$$\n\\lambda=\\frac{\\mathrm{h}}{\\sqrt{2 \\mathrm{mqV}}}\n$$\nIf $\\lambda_1$ and $\\lambda_2$ are de-Broglie wavelengths of proton and alpha particle then\n$$\n\\frac{\\lambda_1}{\\lambda_2}=\\sqrt{\\frac{\\mathrm{m}_2 \\mathrm{q}_2}{\\mathrm{~m}_1 \\mathrm{q}_1}}=\\sqrt{4 \\times 2}=\\sqrt{8}=2 \\sqrt{2}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260390279619d9d8a22c0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "When a photosensitive surface is irradiated by light of wavelength ' $\\lambda_1$ ' and ' $\\lambda_2$ ', maximum kinetic energies of emitted photoelectrons are ' $E_1$ ' and ' $E_2$ ' respectively. The work function of photosensitive surface is", "image": null}, "options": [{"id": "wW3N1", "text": "$\\frac{\\left(\\lambda_1 E_1-\\lambda_2 E_2\\right)}{\\left(\\lambda_2-\\lambda_1\\right)}$", "image": null, "isCorrect": true}, {"id": "YhatB", "text": "$\\frac{\\left(\\lambda_1 E_1+\\lambda_2 E_2\\right)}{\\left(\\lambda_2-\\lambda_1\\right)}$", "image": null, "isCorrect": false}, {"id": "q55Xc", "text": "$\\frac{\\left(\\lambda_1 E_2-\\lambda_2 E_1\\right)}{\\left(\\lambda_2-\\lambda_1\\right)}$", "image": null, "isCorrect": false}, {"id": "3cuxl", "text": "$\\frac{\\left(\\lambda_1 E_2+\\lambda_2 E_1\\right)}{\\left(\\lambda_2-\\lambda_1\\right)}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\mathrm{E}_1=\\frac{\\mathrm{hc}}{\\lambda_1}-\\mathrm{W} \\\\\n& \\mathrm{E}_2=\\frac{\\mathrm{hc}}{\\lambda_2}-\\mathrm{W} \\\\\n& \\mathrm{E}_1 \\lambda_1+\\mathrm{W} \\lambda_1=\\mathrm{E}_2 \\lambda_2+\\mathrm{W} \\lambda_2 \\\\\n& \\mathrm{~W}=\\frac{\\mathrm{E}_1 \\lambda_1-\\mathrm{E}_2 \\lambda_2}{\\lambda_2-\\lambda_1}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260260279619d9d8a2228", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "What is the additional energy that should be supplied to a moving electron to reduce its de Broglie wavelength from $1 \\mathrm{~nm}$ to $0.5 \\mathrm{~nm}$ ?", "image": null}, "options": [{"id": "AClWP", "text": "Four times its initial energy", "image": null, "isCorrect": false}, {"id": "UcXj2", "text": "Five times its initial energy", "image": null, "isCorrect": false}, {"id": "ZisUp", "text": "Two times its initial energy", "image": null, "isCorrect": false}, {"id": "9RJK3", "text": "Three times its initial energy", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "De Broglie wavelength, $\\lambda=\\frac{\\mathrm{h}}{\\mathrm{mv}}=\\frac{\\mathrm{h}}{\\sqrt{2 \\mathrm{mE}}}$\n$$\n\\Rightarrow \\mathrm{E}=\\frac{\\mathrm{h}^2}{2 \\mathrm{~m} \\lambda^2}\n$$\nIf $\\lambda$ is halved, then kinetic energy becomes 4 times or increased by three times.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260210279619d9d8a2201", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "The P.E. ' $U$ ' of a moving particle of mass ' $m$ ' varies with ' $\\mathrm{x}$ ' is shown in the figure. The de-Broglie wavelength of the particle in the regions $0 \\leq x \\leq 1$ and $x>1$ are $\\lambda_1$ and $\\lambda_2$ respectively. If the total energy of the particle is ' $\\mathrm{nE}$ ', then the ratio $\\lambda_1 / \\lambda_2$ is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/SsSIoKaTutJamyirX1_mVc22IJs8FFwSK_WbLvX9rN8.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "J3VfV", "text": "$\\sqrt{\\frac{n^2}{n-1}}$", "image": null, "isCorrect": false}, {"id": "qquUw", "text": "$\\sqrt{\\frac{n-1}{n}}$", "image": null, "isCorrect": false}, {"id": "Wsyrl", "text": "$\\sqrt{\\frac{n}{n-1}}$", "image": null, "isCorrect": true}, {"id": "yiaFq", "text": "$\\sqrt{\\frac{n(n-1)}{n}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In the region $0 \\leq x \\leq 1$, the potential energy of the particle is $E$. Total energy is $\\mathrm{nE}$.\nHence, kinetic energy, $\\mathrm{K}=\\mathrm{nE}-\\mathrm{E}=(\\mathrm{n}-1) \\mathrm{E}$\nIts momentum, $\\mathrm{p}_1=\\sqrt{2 \\mathrm{mK}}=\\sqrt{2 \\mathrm{~m}(\\mathrm{n}-1) \\mathrm{E}}$\n$$\n\\therefore \\lambda_1=\\frac{\\mathrm{h}}{\\mathrm{p}_1}=\\frac{\\mathrm{h}}{\\sqrt{2 \\mathrm{~m}(\\mathrm{n}-1) \\mathrm{E}}}\n$$\nIn the region $\\mathrm{x}>1, \\mathrm{PE}$ is zero\nHence, total is kinetic energy.\n$$\n\\begin{aligned}\n& \\therefore \\mathrm{K}=\\mathrm{nE} \\\\\n& \\therefore \\lambda_2=\\frac{\\mathrm{h}}{\\mathrm{p}_2}=\\frac{\\mathrm{h}}{\\sqrt{2 \\mathrm{mnE}}} \\\\\n& \\therefore \\frac{\\lambda_1}{\\lambda_2}=\\sqrt{\\frac{\\mathrm{n}}{\\mathrm{n}-1}}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fb40279619d9d8a1e9b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "When a photon enters glass from air, which one of the following quantity does $\\underline{\\text { NOT }}$ change?", "image": null}, "options": [{"id": "94F8u", "text": "VeloCity", "image": null, "isCorrect": false}, {"id": "ilMwR", "text": "Energy", "image": null, "isCorrect": true}, {"id": "sR4tb", "text": "Momentum", "image": null, "isCorrect": false}, {"id": "5NZVQ", "text": "Wavelength", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\(x=A \\sin \\omega t, \\quad,=\\frac{d x}{d t}=\\omega A \\cos \\omega t\\)\n\\(T \\cdot E=P \\cdot E+K \\cdot E, P_{0} E=\\frac{1}{2} k x^{2}, K \\cdot E =\\frac{1}{2} m v^{2}\\)\nT. \\(E=\\frac{1}{2} \\times k \\times A^{2} \\sin ^{2} \\omega t+\\frac{1}{2} m \\omega^{2} A^{2} \\cos ^{2} \\omega t \\quad, \\omega=\\sqrt{\\frac{R}{m}}, k mv^{2}\\)\nT. \\(E=\\frac{1}{2} m \\omega^{2} A^{2} \\sin ^{2} \\omega t+\\frac{1 m \\omega^{2} A^{2} c c^{2} \\omega t}{2} \\Rightarrow \\frac{m \\omega^{2} A^{2}}{2}=\\frac{2 m \\pi^{2} A^{2}}{T^{2}}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f8e0279619d9d8a1d6d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "How much energy is imparted to an electron so that its de-Broglie wavelength\nreduces from $10^{-10} \\mathrm{~m}$ to $0 \\cdot 5 \\times 10^{-10} \\mathrm{~m} ?(\\mathrm{E}=$ energy of electron $)$", "image": null}, "options": [{"id": "4l137", "text": "$4 \\mathrm{E}$", "image": null, "isCorrect": false}, {"id": "ae9y2", "text": "$2 \\mathrm{E}$", "image": null, "isCorrect": false}, {"id": "PBJPb", "text": "$3 \\mathrm{E}$", "image": null, "isCorrect": true}, {"id": "pbp1a", "text": "$\\mathrm{E}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\lambda=\\frac{\\mathrm{h}}{\\sqrt{2 \\mathrm{mE}}}$\n$\\frac{\\lambda_{1}}{\\lambda_{2}}=\\sqrt{\\frac{\\mathrm{E}_{2}}{\\mathrm{E}_{1}}} \\Rightarrow \\frac{1 \\times 10^{-9}}{0.5 \\times 10^{-9}}=\\sqrt{\\frac{\\mathrm{E}_{2}}{\\mathrm{E}_{1}}}$\n$\\therefore 2=\\sqrt{\\frac{\\mathrm{E}_{2}}{\\mathrm{E}_{1}}} \\quad \\therefore \\frac{\\mathrm{E}_{2}}{\\mathrm{E}_{1}}=4$\n$\\therefore \\mathrm{E}_{2}=4 \\mathrm{E}_{1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f690279619d9d8a1c42", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}], "question": {"text": "An electron and photon are accelerated through the same potential difference. The ratio of the de-Broglie wavelength $\\lambda_{\\mathrm{p}}$ to $\\lambda_{\\mathrm{e}}$ is $\\left[\\mathrm{m}_{\\mathrm{e}}=\\right.$ mass of electron, $\\mathrm{m}_{\\mathrm{p}}=$ mass of proton $]$", "image": null}, "options": [{"id": "co7Hs", "text": "$\\left(\\frac{m_{p}}{m_{e}}\\right)^{\\frac{1}{2}}$", "image": null, "isCorrect": false}, {"id": "1EWQf", "text": "$\\left(\\frac{m_{e}}{m_{p}}\\right)^{\\frac{1}{2}}$", "image": null, "isCorrect": true}, {"id": "yIFET", "text": "$\\left(\\frac{m_{e}}{m_{p}}\\right)$", "image": null, "isCorrect": false}, {"id": "aYzMl", "text": "$\\left(\\frac{m p}{m}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Both will have same kinetic energy $\\mathrm{k}$. Momentum of electron $\\quad P_{\\mathrm{e}}=\\sqrt{2 \\mathrm{~m}_{\\mathrm{e}} \\mathrm{k}}$ Momentum of proton $P_{p}=\\sqrt{2 m_{p} k}$\n$\\begin{array}{l}\n\\lambda_{p}=\\frac{h}{p_{p}}, \\lambda_{e}=\\frac{h}{p_{e}} \\\\\n\\therefore \\frac{\\lambda_{p}}{\\lambda_{e}}=\\frac{P_{e}}{P_{p}}=\\frac{\\sqrt{m_{e}}}{\\sqrt{m_{p}}}=\\left(\\frac{m_{e}}{m_{p}}\\right)^{\\frac{1}{2}}\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f550279619d9d8a1ba0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "Photons of wavelength $\\lambda$ ' are incident on the cathode of a photocell. Electrons are\nemitted from the cathode surface. The de-Broglie wavelength of the emitted\nelectrons is (work function is negligible)\n$(\\mathrm{c}=$ velocity of light, $\\quad \\mathrm{h}=$ Planck's constant, $\\quad \\mathrm{m}=$ mass of electron $)$", "image": null}, "options": [{"id": "5eJ15", "text": "$\\sqrt{\\frac{\\mathrm{mc}}{2 \\mathrm{~h} \\lambda}}$", "image": null, "isCorrect": false}, {"id": "u6HcU", "text": "$\\sqrt{\\frac{\\mathrm{h} \\lambda}{2 \\mathrm{mc}}}$", "image": null, "isCorrect": true}, {"id": "Fj5fY", "text": "$\\sqrt{\\frac{2 \\mathrm{~h} \\lambda}{\\mathrm{mc}}}$", "image": null, "isCorrect": false}, {"id": "Q2nCN", "text": "$\\sqrt{\\frac{\\mathrm{mh}}{\\lambda \\mathrm{c}}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Work function is negligible\n$\\begin{array}{l}\n\\therefore \\frac{1}{2} \\mathrm{mV}^{2}=\\frac{\\mathrm{hc}}{\\lambda} \\\\\n\\therefore \\frac{1}{2} \\frac{\\mathrm{m}^{2} \\mathrm{~V}^{2}}{\\mathrm{~m}}=\\frac{\\mathrm{hc}}{\\lambda} \\\\\n\\therefore \\mathrm{m}^{2} \\mathrm{~V}^{2}=\\frac{2 \\mathrm{mhC}}{\\lambda} \\\\\n\\therefore \\mathrm{mV}=\\sqrt{\\frac{2 \\mathrm{mhc}}{\\lambda}}\n\\end{array}$\n$\\begin{aligned}\n\\text { de Broglie wavelength } &=\\frac{\\mathrm{h}}{\\mathrm{mV}} \\\\\n&=\\mathrm{h} \\sqrt{\\frac{\\lambda}{2 \\mathrm{mhC}}}=\\sqrt{\\frac{\\mathrm{h} \\lambda}{2 \\mathrm{mC}}}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f540279619d9d8a1b94", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "If the potential difference used to accelerate electrons is doubled, by what factor does the de-Broglie wavelength associated with the electrons change?", "image": null}, "options": [{"id": "CbSCS", "text": "Wavelength is decreased to $\\frac{1}{3}$ times.", "image": null, "isCorrect": false}, {"id": "a2YFd", "text": "Wavelength is increased to $\\frac{1}{2}$ times.", "image": null, "isCorrect": false}, {"id": "uVvCq", "text": "Wavelength is increased to $\\frac{1}{\\sqrt{2}}$ times.", "image": null, "isCorrect": false}, {"id": "oTjZ4", "text": "Wavelength is decreased to $\\frac{1}{\\sqrt{2}}$ times.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The de Broglie wavelength is given by\n$\\lambda(\\text { in } \\mathrm{nm})=\\frac{1.23}{\\sqrt{V}}$\nHence it becomes $\\frac{1}{\\sqrt{2}}$ times", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f450279619d9d8a1b1c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}], "question": {"text": "If the kinetic energy of a particle is increased to 16 times its previous value, the\npercentage change in the de-Broglie wavelength of the particle is", "image": null}, "options": [{"id": "Xcl2u", "text": "75", "image": null, "isCorrect": true}, {"id": "isBzP", "text": "25", "image": null, "isCorrect": false}, {"id": "zTrOr", "text": "50", "image": null, "isCorrect": false}, {"id": "quStI", "text": "5", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Kinetic energy $k=\\frac{p^{2}}{2 m}$ where $p$ is momentum\n$$\n\\therefore \\frac{\\mathrm{k}_{2}}{\\mathrm{k}_{1}}=\\frac{\\mathrm{P}_{2}^{2}}{\\mathrm{P}_{1}^{2}} \\quad \\therefore \\frac{\\mathrm{P}_{2}}{\\mathrm{P}_{1}}=\\sqrt{\\frac{\\mathrm{k}_{2}}{\\mathrm{k}_{1}}}=\\sqrt{16}=4\n$$\nde Broglie wavelength $\\lambda=\\frac{\\mathrm{h}}{\\mathrm{P}}$\n$$\n\\therefore \\frac{\\lambda_{2}}{\\lambda_{1}}=\\frac{P_{1}}{P_{2}}=\\frac{1}{4} \\quad \\therefore \\lambda_{2}=\\frac{\\lambda_{1}}{4} \\quad \\therefore \\lambda_{1}-\\lambda_{2}=\\frac{3}{4} \\lambda_{1}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ed30279619d9d8a1798", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}], "question": {"text": "The kinetic energy of an electron having de-Broglie wavelength <math><mi>λ</mi></math>&nbsp;is ( <math><mi>h</mi><mo>=</mo></math> Planck's constant, <math><mi>m</mi><mo>=</mo></math> mass of electron)", "image": null}, "options": [{"id": "AgBOF", "text": "<math><mfrac><mrow><mi>h</mi></mrow><mrow><mn>2</mn><mi>m</mi><mi>λ</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "w9dcM", "text": "<math><mfrac><mrow><msup><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><mi>m</mi><msup><mrow><mi>λ</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "k9Pco", "text": "<math><mfrac><mrow><msup><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><msup><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>λ</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "zXwMi", "text": "<math><mfrac><mrow><msup><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><msup><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>λ</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <mi>λ</mi><mo>=</mo><mfrac> <mi>h</mi> <mrow> <msqrt> <mrow> <mn>2</mn><mi>m</mi><mi>K</mi><mo>.</mo><mi>E</mi></mrow> </msqrt></mrow></mfrac></mrow></math><br /><math> <mrow> <msup> <mi>λ</mi> <mn>2</mn> </msup> <mo>=</mo><mfrac> <mrow> <msup> <mi>h</mi> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn><mi>m</mi><mrow><mo>(</mo> <mrow> <mi>K</mi><mo>.</mo><mi>E</mi></mrow> <mo>)</mo></mrow></mrow> </mfrac></mrow></math><br /><math> <mrow> <mrow><mo>(</mo> <mrow> <mi>K</mi><mo>.</mo><mi>E</mi></mrow> <mo>)</mo></mrow><mo>=</mo><mfrac> <mrow> <msup> <mi>h</mi> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn><mi>m</mi><msup> <mi>λ</mi> <mn>2</mn> </msup></mrow></mfrac></mrow></math><br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ed00279619d9d8a1779", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}], "question": {"text": "If an electron and a proton have the same de-Broglie wavelength, then the kinetic energy of the electron is", "image": null}, "options": [{"id": "nVgcd", "text": "Zero", "image": null, "isCorrect": false}, {"id": "VBFRJ", "text": "Less than that of a proton", "image": null, "isCorrect": false}, {"id": "v4S5H", "text": "More than that of a proton", "image": null, "isCorrect": true}, {"id": "Htq5a", "text": "Equal to  that of a proton", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, <math><mi>&lambda;</mi><mo>=</mo><mfrac><mrow><mi>h</mi></mrow><mrow><mi>m</mi><mi>v</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>h</mi></mrow><mrow><msqrt><mn>2</mn><mi>m</mi><mi>K</mi><mi>E</mi></msqrt></mrow></mfrac></math><br /><math><mo>&rArr;</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>K</mi><mi>E</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><mi>m</mi><msup><mrow><mi>&lambda;</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math><br />As <math><mi>&lambda;</mi></math> is same for both electron and photon<br />So, <math><mi>K</mi><mi>E</mi><mo>&prop;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>m</mi></mrow></mfrac></math><br />Hence, kinetic energy will be maximum for particle with lesser mass, <math><mi>i</mi><mi>e</mi><mo>,</mo></math> electron.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ec00279619d9d8a16fb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f62", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "MHT CET 2017"}], "question": {"text": "According to de-Broglie hypothesis, the wavelength associated with moving electron of mass m is <math><msubsup><mrow><mi>λ</mi></mrow><mrow><mi>e</mi></mrow></msubsup></math>. Using mass energy relation and Planck's quantum theory, the wavelength associated with photon is <math><msubsup><mrow><mi>λ</mi></mrow><mrow><mi>p</mi></mrow></msubsup><mo>.</mo></math> If the energy <math><mo>(</mo><mi>E</mi><mo>)</mo></math> of electron and photon is same then relation between<math><msup><mrow><mi>&nbsp;</mi></mrow></msup><msubsup><mrow><mi>λ</mi></mrow><mrow><mi>e</mi></mrow></msubsup></math>&nbsp;and <math><msubsup><mrow><mi>λ</mi></mrow><mrow><mi>p</mi></mrow></msubsup></math>&nbsp;is", "image": null}, "options": [{"id": "A1fiT", "text": "<math><mi mathvariant=\"normal\"> </mi><msub><mrow><mi>λ</mi></mrow><mrow><mi>p</mi></mrow></msub><mi> </mi><mi>α</mi><mi> </mi><msub><mrow><mi>λ</mi></mrow><mrow><mi>e</mi></mrow></msub></math>", "image": null, "isCorrect": true}, {"id": "dJpVJ", "text": "<math><mi> </mi><msub><mrow><mi>λ</mi></mrow><mrow><mi>p</mi></mrow></msub><mi> </mi><mi>α</mi><mi> </mi><msubsup><mrow><mi>λ</mi></mrow><mrow><mi>e</mi></mrow><mrow><mn>2</mn></mrow></msubsup></math>", "image": null, "isCorrect": false}, {"id": "6lfG7", "text": "<math><msub><mrow><mi>λ</mi></mrow><mrow><mi>p</mi></mrow></msub><mi> </mi><mi>α</mi><msqrt><msub><mrow><mi>λ</mi></mrow><mrow><mi>e</mi></mrow></msub></msqrt></math>", "image": null, "isCorrect": false}, {"id": "zDQIR", "text": "<math><mi> </mi><msub><mrow><mi>λ</mi></mrow><mrow><mi>p</mi></mrow></msub><mi> </mi><mi>α</mi><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mi>e</mi></mrow></msub></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For photon:  <math><mi>E</mi><mo>=</mo><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mi>p</mi></mrow></msub></mrow></mfrac></math> <br/> <math><mo>∴</mo><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><msub><mrow><mi>λ</mi></mrow><mrow><mi>p</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mi>E</mi></mrow></mfrac></math>             ..........(i)<br/>For electron: <math><mi> </mi><mi>E</mi><mo>=</mo><mi>m</mi><msup><mrow><mi>c</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mi>p</mi><mi>c</mi></math> <br/> <math><mo>∴</mo><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi>p</mi><mo>=</mo><mfrac><mrow><mi>E</mi></mrow><mrow><mi>C</mi></mrow></mfrac></math> <br/> <math><msub><mrow><mi>λ</mi></mrow><mrow><mi>e</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>h</mi></mrow><mrow><mi>p</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mi>E</mi></mrow></mfrac></math>             ........(ii)<br/>By Equations. (i) and (ii),<br/> <math><msub><mrow><mi>λ</mi></mrow><mrow><mi>p</mi></mrow></msub><mi> </mi><mo>∝</mo><mi> </mi><msub><mrow><mi>λ</mi></mrow><mrow><mi>e</mi></mrow></msub></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f62", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "MHT CET 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25eac0279619d9d8a165c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}], "question": {"text": "An electron of mass <math><msup><mrow><mi>m</mi></mrow></msup></math>&nbsp;has de-Broglie wavelength <math><msup><mrow><mi>&nbsp;</mi></mrow></msup><msup><mrow><mi>λ</mi></mrow></msup></math>&nbsp;when accelerated through potential difference <math><msup><mrow><mi>V</mi></mrow></msup></math>. When proton of mass <math><msup><mrow><mi>M</mi></mrow></msup></math>, is accelerated through potential difference <math><mn>9</mn><msup><mrow><mi>V</mi></mrow></msup></math>, the de-Broglie wavelength associated with it will be (Assume that wavelength is determined at low voltage)", "image": null}, "options": [{"id": "0VKBd", "text": "<math><mfrac><mrow><mi>λ</mi></mrow><mrow><mn>3</mn></mrow></mfrac><msqrt><mfrac><mrow><mi>M</mi></mrow><mrow><mi>m</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "3UQS5", "text": "<math><mfrac><mrow><mi>λ</mi></mrow><mrow><mn>3</mn></mrow></mfrac><mo>.</mo><mfrac><mrow><mi>M</mi></mrow><mrow><mi>m</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "nw2vJ", "text": "<math><mfrac><mrow><mi>λ</mi></mrow><mrow><mn>3</mn></mrow></mfrac><msqrt><mfrac><mrow><mi>m</mi></mrow><mrow><mi>M</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "kFg9h", "text": "<math><mfrac><mrow><mi>λ</mi></mrow><mrow><mn>3</mn></mrow></mfrac><mo>.</mo><mfrac><mrow><mi>m</mi></mrow><mrow><mi>M</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When electron or any charged particle is accelerated through potential difference V, then kinetic energy gained is given by <math><mi>E</mi><mo>=</mo><mi>e</mi><mi>V</mi></math> ...... (i)<br /><math><mi>E</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>m</mi><msubsup><mrow><mi>v</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>=</mo><mfrac><mrow><msup><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><mi>m</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><msup><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><mi>m</mi><mo>.</mo><msup><mrow><mi>&#955;</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math> ...... (ii)<br /><math><mo>&#8756;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>e</mi><mi>V</mi><mo>=</mo><mfrac><mrow><msup><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><mi>m</mi><mo>.</mo><msup><mrow><mi>&#955;</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mi>&#160;</mi><mo>&#8658;</mo><mi>&#955;</mi><mo>=</mo><mfrac><mrow><mi>h</mi></mrow><mrow><msqrt><mn>2</mn><mi>m</mi><mi>e</mi><mi>V</mi></msqrt></mrow></mfrac></math> ....... (iii)<br />When proton of mas <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> is accelerated through a potential difference of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mi>V</mi></math>, then the de - Broglie wavelength obtained is<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>&#955;</mi><mi>&#8242;</mi></msup><mo>=</mo><mfrac><mi>h</mi><msqrt><mn>2</mn><mi>M</mi><mi>&#160;</mi><mi>e</mi><mfenced><mrow><mn>9</mn><mi>V</mi></mrow></mfenced></msqrt></mfrac><mo>=</mo><mfrac><mi>h</mi><mrow><mn>3</mn><mo>&#215;</mo><msqrt><mn>2</mn><mi>M</mi><mi>e</mi><mi>V</mi></msqrt></mrow></mfrac><mo>&#215;</mo><mfrac><msqrt><mi>m</mi></msqrt><msqrt><mi>m</mi></msqrt></mfrac></math><br /><math><mo>&#8756;</mo><mi>&#160;</mi><msup><mrow><mi>&#955;</mi></mrow><mrow><mi>&#8242;</mi></mrow></msup><mo>=</mo><mfrac><mrow><mi>&#955;</mi></mrow><mrow><mn>3</mn></mrow></mfrac><mo>.</mo><msqrt><mfrac><mrow><mi>m</mi></mrow><mrow><mi>M</mi></mrow></mfrac></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e890279619d9d8a153d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "When the kinetic energy of an electron is increased the wavelength of the associated wave will", "image": null}, "options": [{"id": "M9WWi", "text": "increase", "image": null, "isCorrect": false}, {"id": "qw1zv", "text": "decrease", "image": null, "isCorrect": true}, {"id": "VhWCI", "text": "wavelength does not depends upon kinetic energy", "image": null, "isCorrect": false}, {"id": "2kFAX", "text": "None of the above", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\lambda=\\frac{h}{\\rho}=\\frac{h}{\\sqrt{2 m E}}$\n$\\therefore \\quad \\lambda=\\frac{1}{\\sqrt{E}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e770279619d9d8a14a8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "The de-Broglie wavelength of an electron in the ground state of the hydrogen atom is", "image": null}, "options": [{"id": "TtJ33", "text": "$\\pi r^{2}$", "image": null, "isCorrect": false}, {"id": "2Rjly", "text": "$2 \\pi r$", "image": null, "isCorrect": true}, {"id": "D43sb", "text": "$\\pi r$", "image": null, "isCorrect": false}, {"id": "raVzS", "text": "$\\sqrt{2 \\pi r}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Bohr's theory\n$$\n\\begin{aligned}\nm v r &=\\frac{n h}{2 \\pi} \\\\\n2 \\pi r &=\\frac{n h}{m v} \\\\\n2 \\pi r &=n \\lambda\n\\end{aligned}\n$$\nFor $\\quad n=1, \\lambda=2 \\pi r$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e3f0279619d9d8a12e4", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "If coil is open then $L$ and $R$ become", "image": null}, "options": [{"id": "MiimT", "text": "$\\infty, 0$", "image": null, "isCorrect": false}, {"id": "zSAd5", "text": "$0, \\infty$", "image": null, "isCorrect": true}, {"id": "TndG0", "text": "$\\infty, \\infty$", "image": null, "isCorrect": false}, {"id": "Alxq5", "text": "0,0", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When coil is open, there is no current in it, hence no flux is associated with it, ie, $\\phi=0$.\nAlso, we know that flux linked with the coil is directly proportional to the current in the coil, ie, $\\quad \\phi \\propto i$\nor\n$$\n\\phi=L i\n$$\nwhere $L$ is proportionality constant known as self-inductance.\n$\\therefore$\n$$\nL=\\frac{\\phi}{i}=0\n$$\nAgain since $i=0$, hence, $R=\\infty$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a263260279619d9d8a3c65", "title": "Photoelectric Effect", "totalQuestions": 165, "questions": [{"_id": "6abb88cf15a9fc0fc8c1472d", "type": "singleCorrect", "question": {"text": "Light of incident frequency three times the threshold frequency is incident on a photo sensitive material. If the incident frequency is made $\\left(\\dfrac{1}{3}\\right)^{rd}$ and intensity is doubled then photoelectric current will", "image": null}, "options": [{"id": "J7JUV", "label": "A", "text": "be zero", "isCorrect": true, "image": null}, {"id": "mSCs9", "label": "B", "text": "be halved", "isCorrect": false, "image": null}, {"id": "q2nRF", "label": "C", "text": "be increased", "isCorrect": false, "image": null}, {"id": "ejPE9", "label": "D", "text": "be decreased", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Initial frequency of incident light, $\\nu_1 = 3\\nu_0$, where $\\nu_0$ is the threshold frequency.<br><br>New frequency of incident light, $\\nu_2 = \\dfrac{1}{3}\\nu_1 = \\dfrac{1}{3}(3\\nu_0) = \\nu_0$.<br><br>Since the new incident frequency is exactly equal to the threshold frequency, the maximum kinetic energy of the emitted photoelectrons is zero ($K_{max} = h\\nu_2 - h\\nu_0 = 0$).<br><br>As the photoelectrons have zero kinetic energy, they do not move towards the collector plate. Therefore, the photoelectric current will be zero, regardless of the increase in intensity.<br><br>Answer: be zero", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88cc15a9fc0fc8c1471a", "type": "singleCorrect", "question": {"text": "The wavelength '$\\lambda$' of photon and the de-Broglie wavelength of an electron have same value. The ratio of kinetic energy of electron to the energy of a photon is (m=mass of electron, h = Planck's constant, c = velocity of light)", "image": null}, "options": [{"id": "AvHl2", "label": "A", "text": "$\\dfrac{h}{2\\lambda mc}$", "isCorrect": true, "image": null}, {"id": "f2PAn", "label": "B", "text": "$\\dfrac{h\\lambda}{2mc}$", "isCorrect": false, "image": null}, {"id": "Tus8i", "label": "C", "text": "$\\dfrac{2c}{hm\\lambda}$", "isCorrect": false, "image": null}, {"id": "XwB4W", "label": "D", "text": "$\\dfrac{m\\lambda}{2hc}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Energy of the photon is given by $E_p = \\dfrac{hc}{\\lambda}$<br><br>For the electron, the de-Broglie wavelength is $\\lambda = \\dfrac{h}{p} \\Rightarrow p = \\dfrac{h}{\\lambda}$<br><br>Kinetic energy of the electron is $E_e = \\dfrac{p^2}{2m} = \\dfrac{h^2}{2m\\lambda^2}$<br><br>The ratio of the kinetic energy of the electron to the energy of the photon is:<br><br>$\\dfrac{E_e}{E_p} = \\dfrac{\\dfrac{h^2}{2m\\lambda^2}}{\\dfrac{hc}{\\lambda}}$<br><br>$\\dfrac{E_e}{E_p} = \\dfrac{h}{2mc\\lambda}$<br><br>Answer: $\\dfrac{h}{2\\lambda mc}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889e15a9fc0fc8c14567", "type": "singleCorrect", "question": {"text": "When a metallic surface is illuminated with radiation of wavelength $\\lambda$, the stopping potential is $V$. If the surface is now illuminated with a radiation of wavelength $4\\lambda$, the stopping potential $\\left(\\dfrac{V}{8}\\right)$. The threshold wavelength for the surface is", "image": null}, "options": [{"id": "CAKPi", "label": "A", "text": "$\\lambda$", "isCorrect": false, "image": null}, {"id": "X6O2U", "label": "B", "text": "$3\\lambda$", "isCorrect": false, "image": null}, {"id": "GqQAp", "label": "C", "text": "$5\\lambda$", "isCorrect": false, "image": null}, {"id": "AZ5g0", "label": "D", "text": "$7\\lambda$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Using Einstein's photoelectric equation:<br><br>$eV = \\dfrac{hc}{\\lambda} - \\dfrac{hc}{\\lambda_0}$<br><br>For the first case:<br><br>$eV = \\dfrac{hc}{\\lambda} - \\dfrac{hc}{\\lambda_0}$<br><br>For the second case:<br><br>$\\dfrac{eV}{8} = \\dfrac{hc}{4\\lambda} - \\dfrac{hc}{\\lambda_0}$<br><br>Multiplying the second equation by $8$ gives:<br><br>$eV = \\dfrac{2hc}{\\lambda} - \\dfrac{8hc}{\\lambda_0}$<br><br>Equating the two expressions for $eV$:<br><br>$\\dfrac{hc}{\\lambda} - \\dfrac{hc}{\\lambda_0} = \\dfrac{2hc}{\\lambda} - \\dfrac{8hc}{\\lambda_0}$<br><br>Rearranging the terms:<br><br>$\\dfrac{8hc}{\\lambda_0} - \\dfrac{hc}{\\lambda_0} = \\dfrac{2hc}{\\lambda} - \\dfrac{hc}{\\lambda}$<br><br>$\\dfrac{7hc}{\\lambda_0} = \\dfrac{hc}{\\lambda}$<br><br>$\\lambda_0 = 7\\lambda$<br><br>Answer: $7\\lambda$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889d15a9fc0fc8c1455b", "type": "singleCorrect", "question": {"text": "Radiation of wavelength $\\lambda$, is incident on a photocell. The fastest emitted electron has speed $v$. If the wavelength is changed to $\\dfrac{3\\lambda}{4}$, the speed of the fastest electron will be", "image": null}, "options": [{"id": "gkdjo", "label": "A", "text": "greater than $v\\left(\\dfrac{4}{3}\\right)^{1/2}$", "isCorrect": true, "image": null}, {"id": "OrneD", "label": "B", "text": "less than $v\\left(\\dfrac{4}{3}\\right)^{1/2}$", "isCorrect": false, "image": null}, {"id": "Zc4UM", "label": "C", "text": "equal to $v\\left(\\dfrac{4}{3}\\right)^{1/2}$", "isCorrect": false, "image": null}, {"id": "VoDxK", "label": "D", "text": "equal to $v\\left(\\dfrac{3}{4}\\right)^{1/2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using Einstein's photoelectric equation:<br><br>$\\dfrac{1}{2}mv^2 = \\dfrac{hc}{\\lambda} - \\phi$<br><br>When the wavelength is changed to $\\dfrac{3\\lambda}{4}$, the new maximum kinetic energy is:<br><br>$\\dfrac{1}{2}mv'^2 = \\dfrac{hc}{\\dfrac{3\\lambda}{4}} - \\phi = \\dfrac{4hc}{3\\lambda} - \\phi$<br><br>Substituting $\\dfrac{hc}{\\lambda} = \\dfrac{1}{2}mv^2 + \\phi$ into the above equation:<br><br>$\\dfrac{1}{2}mv'^2 = \\dfrac{4}{3}\\left(\\dfrac{1}{2}mv^2 + \\phi\\right) - \\phi$<br><br>$\\dfrac{1}{2}mv'^2 = \\dfrac{4}{3}\\left(\\dfrac{1}{2}mv^2\\right) + \\dfrac{\\phi}{3}$<br><br>Since the work function $\\phi > 0$, it follows that:<br><br>$\\dfrac{1}{2}mv'^2 > \\dfrac{4}{3}\\left(\\dfrac{1}{2}mv^2\\right)$<br><br>$v'^2 > \\dfrac{4}{3}v^2$<br><br>$v' > v\\left(\\dfrac{4}{3}\\right)^{1/2}$<br><br>Answer: greater than $v\\left(\\dfrac{4}{3}\\right)^{1/2}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883f15a9fc0fc8c141e6", "type": "singleCorrect", "question": {"text": "In an experiment on photoelectric effect, the stopping potential $V_0$ is plotted against the frequency $\\nu$ of the incident light. Considering $e$ as the electronic charge, the work function of the photoelectric surface is given by<br><img style=\"width: 400px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/may/watermarked_images/19_may_shift_1__q46_d1.png\" />", "image": null}, "options": [{"id": "horf9", "label": "A", "text": "$OA$ in eV", "isCorrect": false, "image": null}, {"id": "IFuwg", "label": "B", "text": "$OB$ in volt", "isCorrect": false, "image": null}, {"id": "Zaezz", "label": "C", "text": "multiplication of $(OB)$ and $(e)$ in joules", "isCorrect": true, "image": null}, {"id": "mtt2Y", "label": "D", "text": "The slope of the line AB", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation:<br><br>$h\\nu = \\Phi + eV_0$<br><br>Rearranging the equation for stopping potential $V_0$:<br><br>$V_0 = \\left(\\dfrac{h}{e}\\right)\\nu - \\dfrac{\\Phi}{e}$<br><br>This represents the equation of a straight line $y = mx + c$, where the y-axis represents $V_0$ and the x-axis represents $\\nu$.<br><br>Comparing the equations, the y-intercept is $c = -\\dfrac{\\Phi}{e}$.<br><br>From the given graph, the line intersects the negative y-axis at B, so the y-intercept is $-OB$.<br><br>Equating the intercepts:<br><br>$-OB = -\\dfrac{\\Phi}{e}$<br><br>$\\Phi = e \\times (OB)$<br><br>Since $OB$ has the unit of potential (volts) and $e$ is the electronic charge (coulombs), their product gives the work function $\\Phi$ in joules.<br><br>Thus, the work function is given by the multiplication of $(OB)$ and $(e)$ in joules.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884f15a9fc0fc8c1427e", "type": "singleCorrect", "question": {"text": "When a certain metal surface is illuminated with a light of wavelength $\\lambda$, the stopping potential is $V$. When the same surface is illuminated by light of wavelength $2\\lambda$, the stopping potential is $\\left(\\dfrac{V}{3}\\right)$. The threshold wavelength for the surface is", "image": null}, "options": [{"id": "7boDi", "label": "A", "text": "$\\dfrac{8\\lambda}{3}$", "isCorrect": false, "image": null}, {"id": "6lDTh", "label": "B", "text": "$\\dfrac{4\\lambda}{3}$", "isCorrect": false, "image": null}, {"id": "mTLR7", "label": "C", "text": "$4\\lambda$", "isCorrect": true, "image": null}, {"id": "zTNK5", "label": "D", "text": "$6\\lambda$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using Einstein's photoelectric equation:<br><br>$eV = \\dfrac{hc}{\\lambda} - \\dfrac{hc}{\\lambda_0}$<br><br>For the first case:<br><br>$eV = \\dfrac{hc}{\\lambda} - \\dfrac{hc}{\\lambda_0}$<br><br>For the second case:<br><br>$\\dfrac{eV}{3} = \\dfrac{hc}{2\\lambda} - \\dfrac{hc}{\\lambda_0}$<br><br>Multiplying the second equation by $3$ gives:<br><br>$eV = \\dfrac{3hc}{2\\lambda} - \\dfrac{3hc}{\\lambda_0}$<br><br>Equating the two expressions for $eV$:<br><br>$\\dfrac{hc}{\\lambda} - \\dfrac{hc}{\\lambda_0} = \\dfrac{3hc}{2\\lambda} - \\dfrac{3hc}{\\lambda_0}$<br><br>Dividing by $hc$ and rearranging the terms:<br><br>$\\dfrac{3}{\\lambda_0} - \\dfrac{1}{\\lambda_0} = \\dfrac{3}{2\\lambda} - \\dfrac{1}{\\lambda}$<br><br>$\\dfrac{2}{\\lambda_0} = \\dfrac{1}{2\\lambda}$<br><br>$\\lambda_0 = 4\\lambda$<br><br>Answer: $4\\lambda$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884d15a9fc0fc8c14266", "type": "singleCorrect", "question": {"text": "The number of photons per second emitted by the source of monochromatic light of wavelength $600$ nm, when it delivers the power of $3.3 \\times 10^{-3}$ W will be<br>(Planck's constant $= 6.6 \\times 10^{-34}$ Js, $c = 3 \\times 10^8$ m/s)", "image": null}, "options": [{"id": "iP6cZ", "label": "A", "text": "$10^{17}$", "isCorrect": false, "image": null}, {"id": "hg9Hb", "label": "B", "text": "$10^{16}$", "isCorrect": true, "image": null}, {"id": "e1B7k", "label": "C", "text": "$10^{15}$", "isCorrect": false, "image": null}, {"id": "ntUqW", "label": "D", "text": "$10^{18}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Power $P = \\dfrac{nhc}{\\lambda}$ where $n$ is the number of photons emitted per second.<br><br>$n = \\dfrac{P\\lambda}{hc}$<br><br>Substituting the given values:<br><br>$n = \\dfrac{3.3 \\times 10^{-3} \\times 600 \\times 10^{-9}}{6.6 \\times 10^{-34} \\times 3 \\times 10^8}$<br><br>$n = \\dfrac{19.8 \\times 10^{-10}}{19.8 \\times 10^{-26}}$<br><br>$n = 10^{16}$<br><br>Answer: $10^{16}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88ac15a9fc0fc8c145f0", "type": "singleCorrect", "question": {"text": "Light of wavelength $\\lambda$ strikes a photoelectric surface and electrons are ejected with an energy $E$. If $E$ is to be increased to exactly twice its original value, the wavelength changes to $\\lambda_1$ where", "image": null}, "options": [{"id": "H0qPV", "label": "A", "text": "$\\lambda_1 < \\dfrac{\\lambda}{2}$", "isCorrect": false, "image": null}, {"id": "u89Vz", "label": "B", "text": "$\\lambda_1 > \\lambda$", "isCorrect": false, "image": null}, {"id": "tVP2I", "label": "C", "text": "$\\lambda_1 > \\dfrac{\\lambda}{2} < \\lambda$", "isCorrect": true, "image": null}, {"id": "uRDZX", "label": "D", "text": "$\\lambda_1 = \\dfrac{\\lambda}{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation:<br><br>$E = \\dfrac{hc}{\\lambda} - \\phi$<br><br>When the maximum kinetic energy is doubled, the new wavelength is $\\lambda_1$:<br><br>$2E = \\dfrac{hc}{\\lambda_1} - \\phi$<br><br>Substituting the value of $E$ from the first equation into the second:<br><br>$2\\left(\\dfrac{hc}{\\lambda} - \\phi\\right) = \\dfrac{hc}{\\lambda_1} - \\phi$<br><br>$\\dfrac{2hc}{\\lambda} - 2\\phi = \\dfrac{hc}{\\lambda_1} - \\phi$<br><br>$\\dfrac{hc}{\\lambda_1} = \\dfrac{2hc}{\\lambda} - \\phi$<br><br>Since the work function $\\phi > 0$, we have:<br><br>$\\dfrac{hc}{\\lambda_1} < \\dfrac{2hc}{\\lambda} \\Rightarrow \\lambda_1 > \\dfrac{\\lambda}{2}$<br><br>Also, since the initial kinetic energy $E > 0$, we know that $\\dfrac{hc}{\\lambda} > \\phi$. We can rewrite the equation for $\\lambda_1$ as:<br><br>$\\dfrac{hc}{\\lambda_1} = \\dfrac{hc}{\\lambda} + \\left(\\dfrac{hc}{\\lambda} - \\phi\\right)$<br><br>Since $\\left(\\dfrac{hc}{\\lambda} - \\phi\\right) > 0$, it follows that:<br><br>$\\dfrac{hc}{\\lambda_1} > \\dfrac{hc}{\\lambda} \\Rightarrow \\lambda_1 < \\lambda$<br><br>Combining both inequalities, we get:<br><br>$\\dfrac{\\lambda}{2} < \\lambda_1 < \\lambda$<br><br>Answer: $\\lambda_1 > \\dfrac{\\lambda}{2} < \\lambda$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886e15a9fc0fc8c1439e", "type": "singleCorrect", "question": {"text": "When photons of energy $h\\nu$ fall on a metal plate of work function $W_0$, photoelectrons of maximum kinetic energy K are ejected. If the frequency of radiation is doubled, the maximum kinetic energy of ejected photoelectrons will be", "image": null}, "options": [{"id": "coNUF", "label": "A", "text": "$K + W_0$", "isCorrect": false, "image": null}, {"id": "qSOZP", "label": "B", "text": "$K + h\\nu$", "isCorrect": true, "image": null}, {"id": "JhpYf", "label": "C", "text": "$K$", "isCorrect": false, "image": null}, {"id": "cqWEB", "label": "D", "text": "$2K$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using Einstein's photoelectric equation for the initial state:<br><br>$K = h\\nu - W_0$<br><br>When the frequency of radiation is doubled, the new energy of the incident photons becomes $2h\\nu$. Let the new maximum kinetic energy be $K'$.<br><br>$K' = 2h\\nu - W_0$<br><br>This can be rewritten as:<br><br>$K' = h\\nu + (h\\nu - W_0)$<br><br>Substituting $h\\nu - W_0 = K$ into the equation:<br><br>$K' = h\\nu + K$<br><br>Answer: $K + h\\nu$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886d15a9fc0fc8c1439d", "type": "singleCorrect", "question": {"text": "Energy of the incident photon on the metal surface is $3W$ and then $5W$, where $W$ is the work function of that metal. The ratio of velocities of emitted photoelectrons is", "image": null}, "options": [{"id": "o3BY9", "label": "A", "text": "$1:4$", "isCorrect": false, "image": null}, {"id": "Ujxk3", "label": "B", "text": "$1:2$", "isCorrect": false, "image": null}, {"id": "2KJW2", "label": "C", "text": "$1:\\sqrt{2}$", "isCorrect": true, "image": null}, {"id": "ESPDX", "label": "D", "text": "$1:1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using Einstein's photoelectric equation, the maximum kinetic energy of emitted photoelectrons is given by $K = E - W$, where $E$ is the energy of the incident photon and $W$ is the work function.<br><br>For the first case, $E_1 = 3W$:<br>$K_1 = 3W - W = 2W$<br><br>For the second case, $E_2 = 5W$:<br>$K_2 = 5W - W = 4W$<br><br>Since kinetic energy $K = \\dfrac{1}{2}mv^2$, the velocity is proportional to the square root of kinetic energy, $v \\propto \\sqrt{K}$.<br><br>The ratio of velocities is:<br>$\\dfrac{v_1}{v_2} = \\sqrt{\\dfrac{K_1}{K_2}} = \\sqrt{\\dfrac{2W}{4W}} = \\sqrt{\\dfrac{1}{2}} = 1:\\sqrt{2}$<br><br>Answer: $1:\\sqrt{2}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888e15a9fc0fc8c144d3", "type": "singleCorrect", "question": {"text": "The energy of a photon is equal to the kinetic energy of a proton. If $\\lambda_1$ is the de-Broglie wavelength of a proton, $\\lambda_2$ is the wavelength associated with the photon and if the energy of the photon is $E$ then $(\\lambda_1/\\lambda_2)$ is proportional to", "image": null}, "options": [{"id": "mD3B1", "label": "A", "text": "$E^4$", "isCorrect": false, "image": null}, {"id": "MnQ2H", "label": "B", "text": "$\\sqrt{E}$", "isCorrect": true, "image": null}, {"id": "oC1nI", "label": "C", "text": "$E^2$", "isCorrect": false, "image": null}, {"id": "J7iFr", "label": "D", "text": "$E$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Energy of the photon is given by $E = \\dfrac{hc}{\\lambda_2}$<br><br>$\\lambda_2 = \\dfrac{hc}{E}$<br><br>Kinetic energy of the proton is $E = \\dfrac{p^2}{2m}$<br><br>Momentum of the proton is $p = \\sqrt{2mE}$<br><br>de-Broglie wavelength of the proton is $\\lambda_1 = \\dfrac{h}{p} = \\dfrac{h}{\\sqrt{2mE}}$<br><br>Taking the ratio of the wavelengths:<br><br>$\\dfrac{\\lambda_1}{\\lambda_2} = \\dfrac{\\dfrac{h}{\\sqrt{2mE}}}{\\dfrac{hc}{E}} = \\dfrac{1}{c\\sqrt{2m}} \\sqrt{E}$<br><br>Therefore, $\\dfrac{\\lambda_1}{\\lambda_2} \\propto \\sqrt{E}$<br><br>Answer: $\\sqrt{E}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888e15a9fc0fc8c144d2", "type": "singleCorrect", "question": {"text": "A point source of light is used in a photoelectric effect. If the source is moved farther from the emitting metal, then the stopping potential", "image": null}, "options": [{"id": "mRChj", "label": "A", "text": "will increase", "isCorrect": false, "image": null}, {"id": "MLkdx", "label": "B", "text": "will decrease", "isCorrect": false, "image": null}, {"id": "fKy3J", "label": "C", "text"
