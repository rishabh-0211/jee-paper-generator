br>Since $h$ and $e$ are universal constants, the slope is independent of the nature of the material and its work function.<br><br>Therefore, the slope is the same for both materials, and their ratio is $1:1$.<br><br>Answer: $1: 1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b75bf9280d7f9932969", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Photoelectric emission takes place from a certain metal at threshold frequency $v$. If the radiation of frequency $4 v$ is incident on the metal plate, the maximum velocity of the emitted photoelectrons will be ( $\\mathrm{m}=$ mass of photoelectron, $\\mathrm{h}=$ Planck's constant)", "image": null}, "options": [{"id": "gYVw1", "text": "$\\sqrt{\\frac{6 \\mathrm{~h} v}{\\mathrm{~m}}}$", "image": null, "isCorrect": true}, {"id": "bBBC5", "text": "$\\sqrt{\\frac{3 \\mathrm{~h} v}{\\mathrm{~m}}}$", "image": null, "isCorrect": false}, {"id": "h5t4x", "text": "$\\sqrt{\\frac{\\mathrm{h} v}{\\mathrm{~m}}}$", "image": null, "isCorrect": false}, {"id": "Osl9m", "text": "$\\sqrt{\\frac{5 \\mathrm{~h} v}{\\mathrm{~m}}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation:<br><br>$K_{\\max} = h \\nu_{incident} - h \\nu_{threshold}$<br><br>Given incident frequency is $4v$ and threshold frequency is $v$, we have:<br><br>$K_{\\max} = h(4v) - h(v) = 3hv$<br><br>The maximum kinetic energy is also given by:<br><br>$K_{\\max} = \\dfrac{1}{2} m V_{\\max}^2$<br><br>Equating the two expressions:<br><br>$\\dfrac{1}{2} m V_{\\max}^2 = 3hv$<br><br>$V_{\\max}^2 = \\dfrac{6hv}{m}$<br><br>$V_{\\max} = \\sqrt{\\dfrac{6hv}{m}}$<br><br>Answer: $\\sqrt{\\frac{6 \\mathrm{~h} v}{\\mathrm{~m}}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b68bf9280d7f99328eb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "From photoelectric effect experiment, select the correct statement.", "image": null}, "options": [{"id": "B8yVX", "text": "Photoelectric effect can be explained using wave theory of light.", "image": null, "isCorrect": false}, {"id": "IG54n", "text": "The maximum kinetic energy of a photoelectron depends on the intensity of incident light.", "image": null, "isCorrect": false}, {"id": "Ri4gy", "text": "The stopping potential depends only on the work function of the metal.", "image": null, "isCorrect": false}, {"id": "rgW2Z", "text": "The saturation current increases as the intensity of incident light increases.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to the experimental observations of the photoelectric effect:<br><br>The photoelectric effect cannot be explained by the wave theory of light; it requires the quantum (particle) nature of light.<br><br>The maximum kinetic energy of emitted photoelectrons depends on the frequency of the incident light and the nature of the material, but is independent of the intensity of incident light.<br><br>The stopping potential depends on both the frequency of the incident light and the work function of the metal, as given by Einstein's photoelectric equation $eV_0 = h\\nu - \\Phi$.<br><br>The number of photoelectrons emitted per second is directly proportional to the intensity of the incident light. Therefore, the saturation photoelectric current increases as the intensity of incident light increases.<br><br>Answer: The saturation current increases as the intensity of incident light increases.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b66bf9280d7f99328de", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "When a photosensitive metal surface is illuminated with radiation of wavelength ' $\\lambda_1$ ', the stopping potential is ' $\\mathrm{V}_1$ ' . If the same surface is illuminated with radiation of wavelength ' $3 \\lambda_1$ ', the stopping potential is $\\frac{\\mathrm{V}_1}{6}$. The threshold wavelength for the photosensitive metal surface is", "image": null}, "options": [{"id": "LjEln", "text": "$\\frac{3}{2} \\lambda_1$", "image": null, "isCorrect": false}, {"id": "9PA9z", "text": "$2 \\lambda_1$", "image": null, "isCorrect": false}, {"id": "GREjN", "text": "$5 \\lambda_1$", "image": null, "isCorrect": true}, {"id": "2LaWF", "text": "$6 \\lambda_1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using Einstein's photoelectric equation:<br><br>$eV_s = \\dfrac{hc}{\\lambda} - \\dfrac{hc}{\\lambda_0}$<br><br>For the first case:<br><br>$eV_1 = \\dfrac{hc}{\\lambda_1} - \\dfrac{hc}{\\lambda_0}$<br><br>For the second case:<br><br>$\\dfrac{eV_1}{6} = \\dfrac{hc}{3\\lambda_1} - \\dfrac{hc}{\\lambda_0}$<br><br>Multiplying the second equation by $6$:<br><br>$eV_1 = \\dfrac{6hc}{3\\lambda_1} - \\dfrac{6hc}{\\lambda_0} = \\dfrac{2hc}{\\lambda_1} - \\dfrac{6hc}{\\lambda_0}$<br><br>Equating the two expressions for $eV_1$:<br><br>$\\dfrac{hc}{\\lambda_1} - \\dfrac{hc}{\\lambda_0} = \\dfrac{2hc}{\\lambda_1} - \\dfrac{6hc}{\\lambda_0}$<br><br>Dividing throughout by $hc$:<br><br>$\\dfrac{1}{\\lambda_1} - \\dfrac{1}{\\lambda_0} = \\dfrac{2}{\\lambda_1} - \\dfrac{6}{\\lambda_0}$<br><br>Rearranging the terms:<br><br>$\\dfrac{6}{\\lambda_0} - \\dfrac{1}{\\lambda_0} = \\dfrac{2}{\\lambda_1} - \\dfrac{1}{\\lambda_1}$<br><br>$\\dfrac{5}{\\lambda_0} = \\dfrac{1}{\\lambda_1}$<br><br>$\\lambda_0 = 5\\lambda_1$<br><br>Answer: $5 \\lambda_1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b56bf9280d7f993285a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "When a light of wavelength $\\lambda$ falls on the emitter of a photocell, maximum speed of emitted photoelectrons is $V$. If the incident wavelength is changed to $2 \\lambda / 3$, maximum speed of emitted photoelectrons will be (assuming negligible work function)", "image": null}, "options": [{"id": "8xYEv", "text": "$\\sqrt{3} V$", "image": null, "isCorrect": false}, {"id": "6H9l9", "text": "$\\frac{V}{2}$", "image": null, "isCorrect": false}, {"id": "UWeYh", "text": "$V$", "image": null, "isCorrect": false}, {"id": "vvMT6", "text": "$\\sqrt{\\frac{3}{2}} V$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation:<br><br>$K_{\\max} = \\dfrac{hc}{\\lambda} - \\Phi$<br><br>Since the work function $\\Phi$ is negligible, $\\Phi = 0$.<br><br>$\\dfrac{1}{2} m V^2 = \\dfrac{hc}{\\lambda}$<br><br>When the incident wavelength is changed to $\\lambda' = \\dfrac{2\\lambda}{3}$, the new maximum kinetic energy is:<br><br>$\\dfrac{1}{2} m (V')^2 = \\dfrac{hc}{\\lambda'} = \\dfrac{hc}{\\dfrac{2\\lambda}{3}}$<br><br>$\\dfrac{1}{2} m (V')^2 = \\dfrac{3}{2} \\left( \\dfrac{hc}{\\lambda} \\right)$<br><br>Substituting the value of $\\dfrac{hc}{\\lambda}$:<br><br>$\\dfrac{1}{2} m (V')^2 = \\dfrac{3}{2} \\left( \\dfrac{1}{2} m V^2 \\right)$<br><br>$(V')^2 = \\dfrac{3}{2} V^2$<br><br>$V' = \\sqrt{\\dfrac{3}{2}} V$<br><br>Answer: $\\sqrt{\\frac{3}{2}} V$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b53bf9280d7f9932839", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "When photons of energies twice and thrice the work function of a metal are incident on the metal surface one after other, the maximum velocities of the photoelectrons emitted in the two cases are $V_1$ and $V_2$ respectively. The ratio $V_1: V_2$ is", "image": null}, "options": [{"id": "2V1Ys", "text": "$\\sqrt{3}: \\sqrt{2}$", "image": null, "isCorrect": false}, {"id": "uUDGh", "text": "$\\sqrt{2}: 1$", "image": null, "isCorrect": false}, {"id": "H4llx", "text": "$\\sqrt{3}: 1$", "image": null, "isCorrect": false}, {"id": "7INJ6", "text": "$1: \\sqrt{2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation, the maximum kinetic energy of emitted photoelectrons is given by $K_{max} = E - \\Phi$, where $E$ is the energy of the incident photon and $\\Phi$ is the work function of the metal.<br><br>For the first case, the incident energy is $E_1 = 2\\Phi$.<br><br>$K_1 = 2\\Phi - \\Phi = \\Phi$<br><br>For the second case, the incident energy is $E_2 = 3\\Phi$.<br><br>$K_2 = 3\\Phi - \\Phi = 2\\Phi$<br><br>The maximum kinetic energy is related to the maximum velocity by $K = \\dfrac{1}{2} m V^2$.<br><br>Taking the ratio of the kinetic energies in the two cases:<br><br>$\\dfrac{K_1}{K_2} = \\dfrac{\\dfrac{1}{2} m V_1^2}{\\dfrac{1}{2} m V_2^2} = \\dfrac{\\Phi}{2\\Phi}$<br><br>$\\dfrac{V_1^2}{V_2^2} = \\dfrac{1}{2}$<br><br>Taking the square root of both sides:<br><br>$\\dfrac{V_1}{V_2} = \\dfrac{1}{\\sqrt{2}}$<br><br>The ratio $V_1 : V_2$ is $1 : \\sqrt{2}$.<br><br>Answer: $1: \\sqrt{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b45bf9280d7f99327b7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Photoelectric emission is observed from a metallic surface for frequencies $v_1$ and $v_2$ of the incident light rays ( $v_1>v_2$ ). If the maximum values of kinetic energy of the photoelectrons emitted in the two cases are in the ratio of $1: \\mathrm{k}$, then the threshold frequency of metallic surface is", "image": null}, "options": [{"id": "7X8w4", "text": "$\\frac{\\mathrm{k} v_2-v_1}{\\mathrm{k}-1}$", "image": null, "isCorrect": false}, {"id": "NUXTg", "text": "$\\frac{v_2-v_1}{\\mathrm{k}}$", "image": null, "isCorrect": false}, {"id": "ITtfN", "text": "$\\frac{v_1-v_2}{\\mathrm{k}-1}$", "image": null, "isCorrect": false}, {"id": "hEGbC", "text": "$\\frac{\\mathrm{k} v_1-v_2}{\\mathrm{k}-1}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation, the maximum kinetic energy of emitted photoelectrons is given by:<br><br>$K_{\\max} = h v - h v_0$<br><br>where $v$ is the frequency of incident light and $v_0$ is the threshold frequency.<br><br>For the first case with frequency $v_1$:<br><br>$K_1 = h(v_1 - v_0)$<br><br>For the second case with frequency $v_2$:<br><br>$K_2 = h(v_2 - v_0)$<br><br>Given that the ratio of maximum kinetic energies in the two cases is $1 : \\mathrm{k}$:<br><br>$\\dfrac{K_1}{K_2} = \\dfrac{1}{\\mathrm{k}}$<br><br>$\\Rightarrow \\mathrm{k} K_1 = K_2$<br><br>Substituting the expressions for $K_1$ and $K_2$:<br><br>$\\mathrm{k} h(v_1 - v_0) = h(v_2 - v_0)$<br><br>$\\mathrm{k} v_1 - \\mathrm{k} v_0 = v_2 - v_0$<br><br>$v_0 - \\mathrm{k} v_0 = v_2 - \\mathrm{k} v_1$<br><br>$v_0(1 - \\mathrm{k}) = v_2 - \\mathrm{k} v_1$<br><br>$v_0 = \\dfrac{v_2 - \\mathrm{k} v_1}{1 - \\mathrm{k}}$<br><br>Multiplying the numerator and the denominator by $-1$, we get:<br><br>$v_0 = \\dfrac{\\mathrm{k} v_1 - v_2}{\\mathrm{k} - 1}$<br><br>Answer: $\\frac{\\mathrm{k} v_1-v_2}{\\mathrm{k}-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b36bf9280d7f993272b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "On a photosensitive material, when frequency of incident radiation is increased by $20 \\%$, maximum kinetic energy of emitted photoelectrons increases from 0.4 eV to 0.7 eV . The work function of the material is", "image": null}, "options": [{"id": "dnEmb", "text": "$3.5 \\mathrm{eV}$", "image": null, "isCorrect": false}, {"id": "kjCFr", "text": "1.1 eV", "image": null, "isCorrect": true}, {"id": "JOCwA", "text": "0.48 eV", "image": null, "isCorrect": false}, {"id": "tSbP4", "text": "0.22 eV", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation, the maximum kinetic energy is given by $K_{\\max} = h\\nu - \\Phi$, where $\\Phi$ is the work function.<br><br>For the initial case:<br>$h\\nu = \\Phi + 0.4$<br><br>When the frequency is increased by $20\\%$, the new frequency is $\\nu' = 1.2\\nu$. The new maximum kinetic energy is $0.7 \\text{ eV}$.<br>$h(1.2\\nu) = \\Phi + 0.7$<br><br>Substituting $h\\nu = \\Phi + 0.4$ into the second equation:<br>$1.2(\\Phi + 0.4) = \\Phi + 0.7$<br><br>$1.2\\Phi + 0.48 = \\Phi + 0.7$<br><br>$1.2\\Phi - \\Phi = 0.7 - 0.48$<br><br>$0.2\\Phi = 0.22$<br><br>$\\Phi = \\dfrac{0.22}{0.2} = 1.1 \\text{ eV}$<br><br>Answer: 1.1 eV", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b21bf9280d7f993267d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A parallel beam of light is incident normally on a plane surface absorbing 50\\% of the light and reflecting the rest. If the incident beam carries 90 W of power, the force exerted by it on the surface is $\\left(\\mathrm{C}=\\right.$ velocity of light in air $\\left.=3 \\times 10^8 \\mathrm{~m} / \\mathrm{s}\\right)$", "image": null}, "options": [{"id": "OCfKe", "text": "$4.5 \\times 10^{-7} \\mathrm{~N}$", "image": null, "isCorrect": true}, {"id": "rt1vA", "text": "$1.5 \\times 10^{-7} \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "sN68d", "text": "$3 \\times 10^{-7} \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "zjKgC", "text": "$9 \\times 10^{-7} \\mathrm{~N}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The momentum incident per second on the surface is given by $\\dfrac{P}{c}$, where $P$ is the incident power and $c$ is the speed of light.<br><br>The surface absorbs $50\\%$ of the light and reflects the remaining $50\\%$.<br><br>The force exerted by the absorbed portion of the light is:<br><br>$F_{a} = \\dfrac{0.5 P}{c}$<br><br>The force exerted by the reflected portion of the light is:<br><br>$F_{r} = \\dfrac{2 \\times 0.5 P}{c} = \\dfrac{P}{c}$<br><br>The total force exerted on the surface is the sum of these two forces:<br><br>$F = F_{a} + F_{r} = \\dfrac{0.5 P}{c} + \\dfrac{P}{c} = \\dfrac{1.5 P}{c}$<br><br>Substituting $P = 90$ W and $c = 3 \\times 10^8$ m/s:<br><br>$F = \\dfrac{1.5 \\times 90}{3 \\times 10^8}$<br><br>$F = \\dfrac{135}{3 \\times 10^8}$<br><br>$F = 45 \\times 10^{-8}$ N<br><br>$F = 4.5 \\times 10^{-7}$ N<br><br>Answer: $4.5 \\times 10^{-7} \\mathrm{~N}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b20bf9280d7f9932674", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Light of wavelength ' $\\lambda$ ' falls on a metal having work function $\\frac{\\mathrm{hc}}{\\lambda_0}$. Photoelectric effect will take place only if ( $\\lambda_0$ is the threshold wavelength)", "image": null}, "options": [{"id": "yQY2H", "text": "$\\lambda \\geqslant \\lambda_0$", "image": null, "isCorrect": false}, {"id": "YbvQX", "text": "$\\lambda \\geqslant 2 \\lambda_0$", "image": null, "isCorrect": false}, {"id": "HLn6t", "text": "$\\lambda < \\lambda_0$", "image": null, "isCorrect": true}, {"id": "1jWRH", "text": "$\\lambda=4 \\lambda_0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For photoelectric emission to take place, the energy of the incident photon must be greater than or equal to the work function of the metal.<br><br>$E \\ge \\Phi$<br><br>$\\dfrac{hc}{\\lambda} \\ge \\dfrac{hc}{\\lambda_0}$<br><br>$\\lambda \\le \\lambda_0$<br><br>From the given options, the condition is satisfied by $\\lambda < \\lambda_0$.<br><br>Answer: $\\lambda < \\lambda_0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b11bf9280d7f9932604", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The maximum velocity of the photoelectrons emitted by a metal surface is $9 \\times 10^5 \\mathrm{~m} / \\mathrm{s}$. The value of ratio of charge (e) to mass (m) of the photoelectron is $1.8 \\times 10^{11} \\mathrm{C} / \\mathrm{kg}$. The value of stopping potential in volt is", "image": null}, "options": [{"id": "Zrt0Q", "text": "$2.00$", "image": null, "isCorrect": false}, {"id": "ZIzU2", "text": "$2.25$", "image": null, "isCorrect": true}, {"id": "EXxdD", "text": "$2.50$", "image": null, "isCorrect": false}, {"id": "OYKqp", "text": "$3.00$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The relation between maximum kinetic energy and stopping potential is given by:<br><br>$e V_0 = \\dfrac{1}{2} m v_{\\max}^2$<br><br>Rearranging for stopping potential $V_0$, we get:<br><br>$V_0 = \\dfrac{v_{\\max}^2}{2 \\left(\\dfrac{e}{m}\\right)}$<br><br>Substituting the given values $v_{\\max} = 9 \\times 10^5 \\mathrm{~m/s}$ and $\\dfrac{e}{m} = 1.8 \\times 10^{11} \\mathrm{~C/kg}$:<br><br>$V_0 = \\dfrac{(9 \\times 10^5)^2}{2 \\times 1.8 \\times 10^{11}}$<br><br>$V_0 = \\dfrac{81 \\times 10^{10}}{3.6 \\times 10^{11}}$<br><br>$V_0 = \\dfrac{8.1 \\times 10^{11}}{3.6 \\times 10^{11}}$<br><br>$V_0 = \\dfrac{8.1}{3.6} = 2.25 \\mathrm{~V}$<br><br>Answer: $2.25$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871afebf9280d7f993256a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "In a photoelectric experiment, if the intensity of incident light is doubled and the frequency is kept slightly greater than threshold frequency, then the saturation photoelectric current", "image": null}, "options": [{"id": "hDPA5", "text": "remains constant", "image": null, "isCorrect": false}, {"id": "LBFQk", "text": "is halved", "image": null, "isCorrect": false}, {"id": "9EyC2", "text": "is doubled", "image": null, "isCorrect": true}, {"id": "NHvGU", "text": "becomes four times", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In the photoelectric effect, the saturation photoelectric current is directly proportional to the intensity of the incident light, provided the frequency of the incident light is greater than the threshold frequency.<br><br>When the intensity of the incident light is doubled, the number of photons striking the metal surface per unit time is doubled. This results in the emission of twice the number of photoelectrons per unit time.<br><br>Therefore, the saturation photoelectric current is doubled.<br><br>Answer: is doubled", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871afdbf9280d7f993255f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Light of wavelength $\\lambda$ strikes a photoelectric surface and electrons are ejected with energy E . If E is to be increased to twice the original value, the wavelength changes to $\\lambda_1$", "image": null}, "options": [{"id": "Y4X9Y", "text": "$\\lambda_1 < \\lambda / 2$", "image": null, "isCorrect": false}, {"id": "GBx7F", "text": "$\\lambda_1=\\lambda$", "image": null, "isCorrect": false}, {"id": "HBBDr", "text": "$\\lambda_1>\\lambda / 2$", "image": null, "isCorrect": true}, {"id": "VzNQ0", "text": "$\\lambda_1=\\lambda / 2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation, the maximum kinetic energy $E$ of the ejected electrons is given by:<br><br>$E = \\dfrac{hc}{\\lambda} - W$<br><br>where $W$ is the work function of the material.<br><br>When the energy is increased to $2E$, the new wavelength is $\\lambda_1$:<br><br>$2E = \\dfrac{hc}{\\lambda_1} - W$<br><br>From the first equation, we can write $E = \\dfrac{hc}{\\lambda} - W$. Substituting this into the second equation gives:<br><br>$2\\left(\\dfrac{hc}{\\lambda} - W\\right) = \\dfrac{hc}{\\lambda_1} - W$<br><br>$\\dfrac{2hc}{\\lambda} - 2W = \\dfrac{hc}{\\lambda_1} - W$<br><br>$\\dfrac{hc}{\\lambda_1} = \\dfrac{2hc}{\\lambda} - W$<br><br>Dividing both sides by $hc$ yields:<br><br>$\\dfrac{1}{\\lambda_1} = \\dfrac{2}{\\lambda} - \\dfrac{W}{hc}$<br><br>Since the work function $W$ is a positive quantity ($W > 0$), we have:<br><br>$\\dfrac{1}{\\lambda_1} < \\dfrac{2}{\\lambda}$<br><br>Taking the reciprocal of both sides (since both sides are positive) gives:<br><br>$\\lambda_1 > \\dfrac{\\lambda}{2}$<br><br>Answer: $\\lambda_1>\\lambda / 2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214420aee93fa0796df3b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "A point source of light is used in a photoelectric effect. If the source is removed farther from the emitting metal, then the stopping potential will", "image": null}, "options": [{"id": "IdZXT", "text": "increase.", "image": null, "isCorrect": false}, {"id": "cnuEL", "text": "decrease.", "image": null, "isCorrect": false}, {"id": "H3ZkB", "text": "remain constant.", "image": null, "isCorrect": true}, {"id": "7yYlI", "text": "either increase or decrease.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation, the maximum kinetic energy of emitted photoelectrons is given by $K_{\\max} = h\\nu - \\Phi$, where $h\\nu$ is the energy of the incident photon and $\\Phi$ is the work function of the metal.<br><br>The stopping potential $V_0$ is related to the maximum kinetic energy by $eV_0 = K_{\\max}$. Thus, $V_0$ depends only on the frequency of the incident light and the nature of the material.<br><br>When the point source of light is moved farther from the emitting metal, the intensity of the incident light decreases (since intensity $I \\propto \\dfrac{1}{r^2}$). However, the frequency of the incident light remains unchanged.<br><br>Since the stopping potential is independent of the intensity of incident light, it will remain constant.<br><br>Answer: remain constant.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792142d0aee93fa0796de94", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "The figure shows the variation of photocurrent with anode potential for four different radiations. Let $\\mathrm{I}_{\\mathrm{a}}, \\mathrm{I}_{\\mathrm{b}}, \\mathrm{I}_{\\mathrm{c}}$ and $\\mathrm{I}_{\\mathrm{d}}$ be the intensities for the curves a, b, c and d respectively $\\left[f_a, f_b, f_c\\right.$ and $f_d$ are frequencies respectively]\r\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/si_rwpKKahY-sp1znE3woTAM-mTfVZHb2in2F1UACC8.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "01WuL", "text": "$f_a=f_b \\gt f_c \\gt f_d$ and $I_a=I_b \\gt I_c \\gt I_d$", "image": null, "isCorrect": false}, {"id": "Gj52L", "text": "$\\mathrm{f}_{\\mathrm{a}} \\lt \\mathrm{f}_{\\mathrm{b}} \\gt \\mathrm{f}_{\\mathrm{c}}=\\mathrm{f}_{\\mathrm{d}}$ and $\\mathrm{I}_{\\mathrm{a}}=\\mathrm{I}_{\\mathrm{b}}\\gt\\mathrm{I}_{\\mathrm{c}}^{\\prime} \\gt \\mathrm{I}_{\\mathrm{d}}$", "image": null, "isCorrect": false}, {"id": "EG8gZ", "text": "$\\mathrm{f}_{\\mathrm{a}}=\\mathrm{f}_{\\mathrm{b}}=\\mathrm{f}_{\\mathrm{c}}=\\mathrm{f}_{\\mathrm{d}}$ and $\\mathrm{I}_{\\mathrm{a}} \\lt \\mathrm{I}_{\\mathrm{b}} \\lt \\mathrm{I}_{\\mathrm{c}} \\lt \\mathrm{I}_{\\mathrm{d}}$", "image": null, "isCorrect": true}, {"id": "nO1hs", "text": "$f_a \\gt f_b \\gt f_c \\gt f_d$ and $I_a=I_b=I_c=I_d$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From the given graph, all four curves (a, b, c, and d) meet at the same point on the retarding potential axis. This indicates that they all have the same stopping potential ($V_0$).<br><br>The stopping potential depends on the frequency of the incident radiation. Since the stopping potential is the same for all curves, the frequencies of the incident radiations must be equal. Therefore, $f_a = f_b = f_c = f_d$.<br><br>The saturation photocurrent is represented by the maximum constant value of the current on the accelerating potential axis. From the graph, the saturation currents are in the order of the curves d, c, b, and a as $I_d > I_c > I_b > I_a$.<br><br>Since the saturation photocurrent is directly proportional to the intensity of the incident radiation, the intensities must follow the same order. Therefore, $I_a < I_b < I_c < I_d$.<br><br>Answer: $\\mathrm{f}_{\\mathrm{a}}=\\mathrm{f}_{\\mathrm{b}}=\\mathrm{f}_{\\mathrm{c}}=\\mathrm{f}_{\\mathrm{d}}$ and $\\mathrm{I}_{\\mathrm{a}} \\lt \\mathrm{I}_{\\mathrm{b}} \\lt \\mathrm{I}_{\\mathrm{c}} \\lt \\mathrm{I}_{\\mathrm{d}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792141e0aee93fa0796de1b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "The stopping potential as a function of frequency of incident radiation is plotted for two different photoelectric surfaces A and B. The graph shows that the work function of A is\r\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/CNUaPuRtqWulUyyyzZqdSM_xGBVpuV_ky_N-XMESRxQ.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "c2eau", "text": "greater than that of B.", "image": null, "isCorrect": false}, {"id": "iCWWn", "text": "smaller than that of B.", "image": null, "isCorrect": true}, {"id": "7zFpf", "text": "same as that of B.", "image": null, "isCorrect": false}, {"id": "uUeAN", "text": "that no comparison can be made from the graphs.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation, the stopping potential $V_0$ is related to the frequency $\\nu$ of incident radiation by:<br><br>$eV_0 = h\\nu - \\Phi$<br><br>where $\\Phi$ is the work function of the material.<br><br>Rearranging the equation, we get:<br><br>$V_0 = \\left(\\dfrac{h}{e}\\right)\\nu - \\dfrac{\\Phi}{e}$<br><br>This is the equation of a straight line. The intercept on the frequency axis (where $V_0 = 0$) represents the threshold frequency $\\nu_0$. At this point:<br><br>$0 = h\\nu_0 - \\Phi \\Rightarrow \\Phi = h\\nu_0$<br><br>From the given graph, the threshold frequency for surface A ($\\nu_{0A}$) is smaller than the threshold frequency for surface B ($\\nu_{0B}$), i.e., $\\nu_{0A} < \\nu_{0B}$.<br><br>Since the work function is directly proportional to the threshold frequency ($\\Phi \\propto \\nu_0$), we have:<br><br>$\\Phi_A < \\Phi_B$<br><br>Thus, the work function of A is smaller than that of B.<br><br>Answer: smaller than that of B.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792141b0aee93fa0796de08", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "When a certain metallic surface is illuminated with monochromatic light wavelength $\\lambda$, the stopping potential for photoelectric current is $4 V_0$. When the same surface is illuminated with light of wavelength $3 \\lambda$, the stopping potential is $\\mathrm{V}_0$. The threshold wavelength for this surface for photoelectric effect is", "image": null}, "options": [{"id": "KjYFb", "text": "$9 \\lambda$", "image": null, "isCorrect": true}, {"id": "PFea8", "text": "$\\frac{\\lambda}{9}$", "image": null, "isCorrect": false}, {"id": "xuL7y", "text": "$3 \\lambda$", "image": null, "isCorrect": false}, {"id": "7zt7d", "text": "$\\frac{\\lambda}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation:<br><br>$eV_s = \\dfrac{hc}{\\lambda} - \\dfrac{hc}{\\lambda_0}$<br><br>For the first case:<br><br>$4eV_0 = \\dfrac{hc}{\\lambda} - \\dfrac{hc}{\\lambda_0}$<br><br>For the second case:<br><br>$eV_0 = \\dfrac{hc}{3\\lambda} - \\dfrac{hc}{\\lambda_0}$<br><br>Multiplying the second equation by $4$ and equating with the first equation:<br><br>$\\dfrac{hc}{\\lambda} - \\dfrac{hc}{\\lambda_0} = 4 \\left( \\dfrac{hc}{3\\lambda} - \\dfrac{hc}{\\lambda_0} \\right)$<br><br>Dividing by $hc$ on both sides:<br><br>$\\dfrac{1}{\\lambda} - \\dfrac{1}{\\lambda_0} = \\dfrac{4}{3\\lambda} - \\dfrac{4}{\\lambda_0}$<br><br>Rearranging the terms:<br><br>$\\dfrac{4}{\\lambda_0} - \\dfrac{1}{\\lambda_0} = \\dfrac{4}{3\\lambda} - \\dfrac{1}{\\lambda}$<br><br>$\\dfrac{3}{\\lambda_0} = \\dfrac{1}{3\\lambda}$<br><br>$\\lambda_0 = 9\\lambda$<br><br>Answer: $9 \\lambda$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214070aee93fa0796dd6b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "Two photons having energies twice and thrice the work function of metal are incident one after another on the metal surface. Then the ratio of maximum velocities of the photoelectrons emitted in the two cases is respectively", "image": null}, "options": [{"id": "e4Cxx", "text": "$\\sqrt{3}: 3$", "image": null, "isCorrect": false}, {"id": "8ZFUV", "text": "$\\sqrt{2}: \\sqrt{3}$", "image": null, "isCorrect": false}, {"id": "gyY5o", "text": "$1: \\sqrt{2}$", "image": null, "isCorrect": true}, {"id": "Sjapz", "text": "$\\sqrt{3}: 1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the work function of the metal be $\\Phi$.<br><br>The energy of the first photon is $E_1 = 2\\Phi$ and the energy of the second photon is $E_2 = 3\\Phi$.<br><br>According to Einstein's photoelectric equation, the maximum kinetic energy is given by $K_{max} = E - \\Phi$.<br><br>For the first photon:<br>$K_{max1} = 2\\Phi - \\Phi = \\Phi$<br><br>For the second photon:<br>$K_{max2} = 3\\Phi - \\Phi = 2\\Phi$<br><br>The maximum kinetic energy is related to the maximum velocity by $K_{max} = \\dfrac{1}{2} m v_{max}^2$.<br><br>Taking the ratio of the kinetic energies:<br>$\\dfrac{K_{max1}}{K_{max2}} = \\dfrac{\\dfrac{1}{2} m v_{max1}^2}{\\dfrac{1}{2} m v_{max2}^2} = \\dfrac{\\Phi}{2\\Phi}$<br><br>$\\dfrac{v_{max1}^2}{v_{max2}^2} = \\dfrac{1}{2}$<br><br>$\\dfrac{v_{max1}}{v_{max2}} = \\dfrac{1}{\\sqrt{2}}$<br><br>The ratio of maximum velocities is $1 : \\sqrt{2}$.<br><br>Answer: $1: \\sqrt{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213f60aee93fa0796dce7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "A photoelectric surface is illuminated successively by monochromatic light of Wavelength $\\lambda$ and $(\\lambda / 3)$. If the maximum kinetic energy of the emitted photoelectrons in the second case is 4 times that in the first case, the work function of the surface of the material is ( $\\mathrm{h}=$ Planck's constant, $\\mathrm{c}=$ speed of light $)$", "image": null}, "options": [{"id": "6jvXL", "text": "$\\frac{\\mathrm{hc}}{\\lambda}$", "image": null, "isCorrect": false}, {"id": "BMpDQ", "text": "$\\frac{\\mathrm{hc}}{2 \\lambda}$", "image": null, "isCorrect": false}, {"id": "DWVqa", "text": "$\\frac{\\mathrm{hc}}{3 \\lambda}$", "image": null, "isCorrect": true}, {"id": "jDmf6", "text": "$\\frac{3 \\mathrm{hc}}{\\lambda}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation, the maximum kinetic energy of emitted photoelectrons is given by $K = \\dfrac{hc}{\\lambda} - \\Phi$, where $\\Phi$ is the work function of the material.<br><br>For the first case, the maximum kinetic energy is:<br><br>$K_1 = \\dfrac{hc}{\\lambda} - \\Phi$<br><br>For the second case, the wavelength is $\\lambda/3$, so the maximum kinetic energy is:<br><br>$K_2 = \\dfrac{hc}{\\lambda/3} - \\Phi = \\dfrac{3hc}{\\lambda} - \\Phi$<br><br>It is given that $K_2 = 4K_1$. Substituting the expressions for $K_1$ and $K_2$, we get:<br><br>$\\dfrac{3hc}{\\lambda} - \\Phi = 4\\left(\\dfrac{hc}{\\lambda} - \\Phi\\right)$<br><br>$\\dfrac{3hc}{\\lambda} - \\Phi = \\dfrac{4hc}{\\lambda} - 4\\Phi$<br><br>$4\\Phi - \\Phi = \\dfrac{4hc}{\\lambda} - \\dfrac{3hc}{\\lambda}$<br><br>$3\\Phi = \\dfrac{hc}{\\lambda}$<br><br>$\\Phi = \\dfrac{hc}{3\\lambda}$<br><br>Answer: $\\frac{\\mathrm{hc}}{3 \\lambda}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213f20aee93fa0796dcc5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "In case of photoelectric effect, the graph of measured stopping potential $\\left(\\mathrm{V}_0\\right)$ against frequency ' $v$ ' of incident light is a straight line. The slope of this line multiplied by the charge of electron (e) gives", "image": null}, "options": [{"id": "LclUa", "text": "the work function of the metal.", "image": null, "isCorrect": false}, {"id": "wxclg", "text": "the Planck's constant.", "image": null, "isCorrect": true}, {"id": "DrIi5", "text": "the maximum kinetic energy of the ejected electrons.", "image": null, "isCorrect": false}, {"id": "x9fec", "text": "the threshold frequency for photoejection from the metal.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation,<br><br>$eV_0 = h\\nu - \\Phi$<br><br>where $V_0$ is the stopping potential, $\\nu$ is the frequency of incident light, $h$ is Planck's constant, $e$ is the charge of an electron, and $\\Phi$ is the work function.<br><br>Rearranging the equation, we get<br><br>$V_0 = \\left(\\dfrac{h}{e}\\right)\\nu - \\dfrac{\\Phi}{e}$<br><br>Comparing this with the equation of a straight line $y = mx + c$, the slope $m$ of the graph of $V_0$ versus $\\nu$ is<br><br>$m = \\dfrac{h}{e}$<br><br>Multiplying the slope by the charge of an electron $e$, we get<br><br>$m \\times e = \\left(\\dfrac{h}{e}\\right) \\times e = h$<br><br>This gives $h$, which is Planck's constant.<br><br>Answer: the Planck's constant.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e20aee93fa0796dc46", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "If the frequency of incident radiation (v) is increased, keeping other factors constant, the stopping potential ($v \\gt v_0$, threshold frequency)", "image": null}, "options": [{"id": "z53XW", "text": "increases", "image": null, "isCorrect": true}, {"id": "c7kiV", "text": "decreases", "image": null, "isCorrect": false}, {"id": "4cqYx", "text": "remains constant", "image": null, "isCorrect": false}, {"id": "0mqQk", "text": "suddenly becomes zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation, the maximum kinetic energy of emitted photoelectrons is given by:<br><br>$K_{\\text{max}} = h v - h v_0$<br><br>The maximum kinetic energy is also related to the stopping potential $V_s$ by the equation:<br><br>$K_{\\text{max}} = e V_s$<br><br>Equating the two expressions, we get:<br><br>$e V_s = h v - h v_0$<br><br>$V_s = \\dfrac{h}{e} v - \\dfrac{h}{e} v_0$<br><br>From this relation, it is clear that the stopping potential $V_s$ is directly proportional to the frequency of the incident radiation $v$. Therefore, if the frequency of incident radiation is increased, the stopping potential increases.<br><br>Answer: increases", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d20aee93fa0796dbc5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "When a photosensitive surface is irradiated by lights of wavelengths ' $\\lambda_1$ ' and ' $\\lambda_2$ ', kinetic energies of the emitted photoelectrons is ' $E_1$ ' and ' $E_2$ ' respectively. The work function of the photosensitive surface is", "image": null}, "options": [{"id": "46pgc", "text": "$\\dfrac{\\left(E_2 \\lambda_2-E_1 \\lambda_1\\right)}{\\left(\\lambda_2-\\lambda_1\\right)}$", "image": null, "isCorrect": false}, {"id": "jJjJW", "text": "$\\dfrac{\\left(E_1 \\lambda_1+E_2 \\lambda_2\\right)}{\\left(\\lambda_2-\\lambda_1\\right)}$", "image": null, "isCorrect": false}, {"id": "6Dg4x", "text": "$\\dfrac{\\left(E_1 \\lambda_1-E_2 \\lambda_2\\right)}{\\left(\\lambda_2-\\lambda_1\\right)}$", "image": null, "isCorrect": true}, {"id": "e1DEV", "text": "$\\dfrac{\\left(E_2 \\lambda_2+E_1 \\lambda_1\\right)}{\\left(\\lambda_1-\\lambda_2\\right)}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation:<br><br>$E_1 = \\dfrac{hc}{\\lambda_1} - W$<br><br>$E_2 = \\dfrac{hc}{\\lambda_2} - W$<br><br>Multiplying the first equation by $\\lambda_1$ and the second by $\\lambda_2$:<br><br>$E_1 \\lambda_1 = hc - W \\lambda_1$<br><br>$E_2 \\lambda_2 = hc - W \\lambda_2$<br><br>Subtracting the second equation from the first:<br><br>$E_1 \\lambda_1 - E_2 \\lambda_2 = W \\lambda_2 - W \\lambda_1$<br><br>$E_1 \\lambda_1 - E_2 \\lambda_2 = W (\\lambda_2 - \\lambda_1)$<br><br>$W = \\dfrac{E_1 \\lambda_1 - E_2 \\lambda_2}{\\lambda_2 - \\lambda_1}$<br><br>Answer: $\\dfrac{\\left(E_1 \\lambda_1-E_2 \\lambda_2\\right)}{\\left(\\lambda_2-\\lambda_1\\right)}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ce0aee93fa0796dba6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "A photoelectric surface is illuminated successively by monochromatic light of 'wavelength ' $\\lambda$ ' and $\\left(\\dfrac{\\lambda}{2}\\right)$. If the maximum kinetic energy of the emitted photoelectrons in the first case is one-fourth that in the second case, the work function of the surface of the material is ( $\\mathrm{c}=$ speed of light, $\\mathrm{h}=$ Planck's constant $)$", "image": null}, "options": [{"id": "vl89U", "text": "$\\dfrac{2 \\mathrm{hc}}{\\lambda}$", "image": null, "isCorrect": false}, {"id": "QEgee", "text": "$\\dfrac{\\mathrm{hc}}{\\lambda}$", "image": null, "isCorrect": false}, {"id": "roUUB", "text": "$\\dfrac{2 \\mathrm{hc}}{3 \\lambda}$", "image": null, "isCorrect": true}, {"id": "DM5DF", "text": "$\\dfrac{\\mathrm{hc}}{3 \\lambda}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation, the maximum kinetic energy of emitted photoelectrons is given by $K = \\dfrac{hc}{\\lambda} - \\phi$, where $\\phi$ is the work function of the material.<br><br>For the first case with wavelength $\\lambda$:<br>$K_1 = \\dfrac{hc}{\\lambda} - \\phi$<br><br>For the second case with wavelength $\\dfrac{\\lambda}{2}$:<br>$K_2 = \\dfrac{hc}{\\left(\\dfrac{\\lambda}{2}\\right)} - \\phi = \\dfrac{2hc}{\\lambda} - \\phi$<br><br>Given that $K_1 = \\dfrac{1}{4} K_2$, we have $4K_1 = K_2$.<br><br>Substituting the expressions for $K_1$ and $K_2$:<br>$4 \\left( \\dfrac{hc}{\\lambda} - \\phi \\right) = \\dfrac{2hc}{\\lambda} - \\phi$<br><br>$\\dfrac{4hc}{\\lambda} - 4\\phi = \\dfrac{2hc}{\\lambda} - \\phi$<br><br>$\\dfrac{4hc}{\\lambda} - \\dfrac{2hc}{\\lambda} = 4\\phi - \\phi$<br><br>$\\dfrac{2hc}{\\lambda} = 3\\phi$<br><br>$\\phi = \\dfrac{2hc}{3\\lambda}$<br><br>Answer: $\\dfrac{2 \\mathrm{hc}}{3 \\lambda}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213bb0aee93fa0796db13", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "In photoelectric effect, for incident light above the threshold frequency, the saturation photocurrent", "image": null}, "options": [{"id": "oRQBe", "text": "decreases with increase in frequency of incident photon.", "image": null, "isCorrect": false}, {"id": "RfmO1", "text": "increases with increase in frequency of incident photon.", "image": null, "isCorrect": false}, {"id": "URpCu", "text": "does not depend on the frequency of photon but depends only on the intensity of incident light.", "image": null, "isCorrect": true}, {"id": "nlVo1", "text": "depends both on intensity and frequency of incident radiation.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In the photoelectric effect, the saturation photocurrent is determined by the total number of photoelectrons emitted per second from the photosensitive surface.<br><br>According to the laws of photoelectric emission, for incident light above the threshold frequency, the number of photoelectrons emitted per second is directly proportional to the intensity of the incident light (which corresponds to the number of incident photons per unit area per unit time).<br><br>The frequency of the incident light determines the maximum kinetic energy of the emitted photoelectrons and the stopping potential, but it does not affect the number of photoelectrons emitted per second.<br><br>Therefore, the saturation photocurrent does not depend on the frequency of the incident photon but depends only on the intensity of the incident light.<br><br>Answer: does not depend on the frequency of photon but depends only on the intensity of incident light.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213a70aee93fa0796da78", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "The figure shows the variation of photocurrent with anode potential for four different radiations. Let $f_a, f_b, f_c$ and $f_d$ be the frequencies for the curves $a, b, c$ and $d$ respectively\r\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/vd8Az0YicY2ZM0GilqqA_6ziu9mB5w9IQcKKD4OT044.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "rI22P", "text": "$f_a \\gt f_b \\gt f_c \\gt f_d$", "image": null, "isCorrect": false}, {"id": "YBx3Z", "text": "$\\mathrm{f}_{\\mathrm{a}} \\lt \\mathrm{f}_{\\mathrm{b}} \\lt \\mathrm{f}_{\\mathrm{c}} \\lt \\mathrm{f}_{\\mathrm{d}}$", "image": null, "isCorrect": true}, {"id": "KabDV", "text": "$\\mathrm{f}_{\\mathrm{a}}\\gt\\mathrm{f}_{\\mathrm{b}} \\lt \\mathrm{f}_{\\mathrm{c}}=\\mathrm{f}_{\\mathrm{d}}$", "image": null, "isCorrect": false}, {"id": "euf68", "text": "$\\mathrm{f}_{\\mathrm{a}}=\\mathrm{f}_{\\mathrm{b}} \\gt \\mathrm{f}_{\\mathrm{c}} \\gt \\mathrm{f}_{\\mathrm{d}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From Einstein's photoelectric equation, $eV_0 = hf - \\Phi$, where $V_0$ is the stopping potential, $f$ is the frequency of incident radiation, and $\\Phi$ is the work function of the material.<br><br>This relation shows that the magnitude of the stopping potential increases with an increase in the frequency of the incident radiation.<br><br>From the given graph, the magnitudes of the stopping potentials for curves $a, b, c$, and $d$ are in the order:<br><br>$|-V_0^1| < |-V_0^2| < |-V_0^3| < |-V_0^4|$<br><br>Thus, the stopping potentials follow the order $(V_0)_a < (V_0)_b < (V_0)_c < (V_0)_d$.<br><br>Consequently, the frequencies of the corresponding radiations must follow the same order:<br><br>$f_a < f_b < f_c < f_d$.<br><br>Answer: $\\mathrm{f}_{\\mathrm{a}} \\lt \\mathrm{f}_{\\mathrm{b}} \\lt \\mathrm{f}_{\\mathrm{c}} \\lt \\mathrm{f}_{\\mathrm{d}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213a60aee93fa0796da72", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "Using Einstein's photoelectric equation, the graph between kinetic energy of emitted photoelectrons and the frequency of incident radiation is shown correctly by graph\r\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/3z7RLCoF9k7MrRSy9cl41j5pLJ9DSXCYtXabRfk1rTE.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "CEEBd", "text": "1", "image": null, "isCorrect": true}, {"id": "oXVrk", "text": "2", "image": null, "isCorrect": false}, {"id": "NdXQW", "text": "3", "image": null, "isCorrect": false}, {"id": "MagiF", "text": "4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation, the maximum kinetic energy ($E$) of emitted photoelectrons is given by:<br><br>$E = h\\nu - \\Phi$<br><br>where $h$ is Planck's constant, $\\nu$ is the frequency of incident radiation, and $\\Phi$ is the work function of the material.<br><br>Comparing this equation with the standard equation of a straight line, $y = mx + c$, we get:<br>$y = E$<br>$x = \\nu$<br>Slope, $m = h$ (which is positive)<br>y-intercept, $c = -\\Phi$ (which is negative)<br><br>The x-intercept (where $E = 0$) is at $\\nu = \\dfrac{\\Phi}{h} = \\nu_0$, which is the threshold frequency. For frequencies $\\nu < \\nu_0$, no photoelectric emission takes place, so the kinetic energy is zero. <br><br>Thus, the graph between $E$ and $\\nu$ is a straight line with a positive slope that starts from a positive value on the $\\nu$-axis (x-axis). This is correctly represented by graph (1).<br><br>Answer: 1", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213980aee93fa0796da01", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "Two identical photocathodes receive light of frequencies ' $\\mathrm{n}_1$ ' and ' $\\mathrm{n}_2$ '. If the velocities of the emitted photoelectrons of mass ' $m$ ' are ' $V_1$ ' and ' $\\mathrm{V}_2$ ' respectively, then ( $\\mathrm{h}=$ Planck's constant )", "image": null}, "options": [{"id": "eaJ7J", "text": "$\\mathrm{V}_1+\\mathrm{V}_2=\\left[\\dfrac{2 \\mathrm{~h}}{\\mathrm{~m}}\\left(\\mathrm{n}_1+\\mathrm{n}_2\\right)\\right]^{1 / 2}$", "image": null, "isCorrect": false}, {"id": "g0uEW", "text": "$\\mathrm{V}_1-\\mathrm{V}_2=\\left[\\dfrac{2 \\mathrm{~h}}{\\mathrm{~m}}\\left(\\mathrm{n}_1-\\mathrm{n}_2\\right)\\right]^{1 / 2}$", "image": null, "isCorrect": false}, {"id": "NijtG", "text": "$\\mathrm{V}_1^2+\\mathrm{V}_2^2=\\dfrac{2 \\mathrm{~h}}{\\mathrm{~m}}\\left(\\mathrm{n}_1+\\mathrm{n}_2\\right)$", "image": null, "isCorrect": false}, {"id": "ZmoBY", "text": "$\\mathrm{V}_1^2-\\mathrm{V}_2^2=\\dfrac{2 \\mathrm{~h}}{\\mathrm{~m}}\\left(\\mathrm{n}_1-\\mathrm{n}_2\\right)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation, the maximum kinetic energy of emitted photoelectrons is given by:<br><br>$\\dfrac{1}{2} m V^2 = h n - \\Phi$<br><br>where $n$ is the frequency of incident light and $\\Phi$ is the work function of the material.<br><br>For the first photocathode:<br><br>$\\dfrac{1}{2} m V_1^2 = h n_1 - \\Phi$<br><br>For the second identical photocathode (same work function $\\Phi$):<br><br>$\\dfrac{1}{2} m V_2^2 = h n_2 - \\Phi$<br><br>Subtracting the second equation from the first, we get:<br><br>$\\dfrac{1}{2} m V_1^2 - \\dfrac{1}{2} m V_2^2 = h n_1 - \\Phi - (h n_2 - \\Phi)$<br><br>$\\dfrac{1}{2} m (V_1^2 - V_2^2) = h (n_1 - n_2)$<br><br>$V_1^2 - V_2^2 = \\dfrac{2h}{m} (n_1 - n_2)$<br><br>Answer: $\\mathrm{V}_1^2-\\mathrm{V}_2^2=\\dfrac{2 \\mathrm{~h}}{\\mathrm{~m}}\\left(\\mathrm{n}_1-\\mathrm{n}_2\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213850aee93fa0796d96f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "A photosensitive metallic surface has work function $\\phi$. If photon of energy $3 \\phi$ falls on the surface, the electron comes out with a maximum velocity of $6 \\times 10^6 \\mathrm{~m} / \\mathrm{s}$. When the photon energy is increased to $9 \\phi$, then maximum velocity of photoelectrons will be", "image": null}, "options": [{"id": "zdzac", "text": "$12 \\times 10^6, \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": true}, {"id": "nCrB8", "text": "$6 \\times 10^6 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "Pv9ki", "text": "$3 \\times 10^6 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "FwBpP", "text": "$24 \\times 10^6 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation:<br><br>$K_{\\max} = E - \\phi$<br><br>For the first case, the incident photon energy is $E_1 = 3 \\phi$. The maximum kinetic energy is:<br><br>$\\dfrac{1}{2} m v_1^2 = 3 \\phi - \\phi = 2 \\phi$<br><br>For the second case, the incident photon energy is $E_2 = 9 \\phi$. The maximum kinetic energy is:<br><br>$\\dfrac{1}{2} m v_2^2 = 9 \\phi - \\phi = 8 \\phi$<br><br>Taking the ratio of the kinetic energies in the two cases:<br><br>$\\dfrac{\\dfrac{1}{2} m v_2^2}{\\dfrac{1}{2} m v_1^2} = \\dfrac{8 \\phi}{2 \\phi}$<br><br>$\\dfrac{v_2^2}{v_1^2} = 4$<br><br>$v_2 = 2 v_1$<br><br>Given $v_1 = 6 \\times 10^6 \\mathrm{~m/s}$, substituting this value gives:<br><br>$v_2 = 2 \\times 6 \\times 10^6 \\mathrm{~m/s} = 12 \\times 10^6 \\mathrm{~m/s}$<br><br>Answer: $12 \\times 10^6, \\mathrm{~m} / \\mathrm{s}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213720aee93fa0796d8da", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "For a photosensitive material, work function is ' $\\mathrm{W}_0$ ' and stopping potential is ' V '. The wavelength of incident radiation is ($\\mathrm{h}=$ Planck's constant, $c=$ velocity of light, $e=$ electronic charge)", "image": null}, "options": [{"id": "0BqnN", "text": "$\\dfrac{\\mathrm{h}^2 \\mathrm{c}^2}{\\mathrm{~W}_0+\\mathrm{eV}}$", "image": null, "isCorrect": false}, {"id": "85ZvC", "text": "$\\dfrac{\\mathrm{hc}}{\\mathrm{W}_0}$", "image": null, "isCorrect": false}, {"id": "tgvfH", "text": "$\\dfrac{\\mathrm{hcV}}{\\mathrm{W}_0}$", "image": null, "isCorrect": false}, {"id": "FPKT3", "text": "$\\dfrac{\\mathrm{hc}}{\\mathrm{W}_0+\\mathrm{eV}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation, the energy of the incident radiation is the sum of the work function and the maximum kinetic energy of the emitted photoelectrons.<br><br>$E = W_0 + K_{\\max}$<br><br>The maximum kinetic energy is related to the stopping potential $V$ by $K_{\\max} = eV$.<br><br>The energy of the incident radiation in terms of wavelength $\\lambda$ is $E = \\dfrac{hc}{\\lambda}$.<br><br>Substituting these values into the photoelectric equation, we get:<br><br>$\\dfrac{hc}{\\lambda} = W_0 + eV$<br><br>Rearranging the equation to solve for the wavelength $\\lambda$:<br><br>$\\lambda = \\dfrac{hc}{W_0 + eV}$<br><br>Answer: $\\dfrac{\\mathrm{hc}}{\\mathrm{W}_0+\\mathrm{eV}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213710aee93fa0796d8d2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "The threshold frequency of a metal is ' $F_0$ '. When light of frequency $2 \\mathrm{~F}_0$ is incident on the metal plate, the maximum velocity of photoelectron is ' $\\mathrm{V}_1$ ' When the frequency of incident radiation is increased to ' $5 \\mathrm{~F}_0$ ', the maximum velocity of photoelectrons emitted is ' $\\mathrm{V}_2$ '. The ratio of $\\mathrm{V}_1$ to $\\mathrm{V}_2$ is", "image": null}, "options": [{"id": "HS3Bo", "text": "$\\dfrac{1}{8}$", "image": null, "isCorrect": false}, {"id": "1jJ62", "text": "$\\dfrac{1}{16}$", "image": null, "isCorrect": false}, {"id": "m8tqf", "text": "$\\dfrac{1}{4}$", "image": null, "isCorrect": false}, {"id": "ksBBN", "text": "$\\dfrac{1}{2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation:<br><br>$\\dfrac{1}{2}mv^2 = hf - hF_0$<br><br>For the first case, $f = 2F_0$:<br><br>$\\dfrac{1}{2}mV_1^2 = h(2F_0) - hF_0 = hF_0$<br><br>For the second case, $f = 5F_0$:<br><br>$\\dfrac{1}{2}mV_2^2 = h(5F_0) - hF_0 = 4hF_0$<br><br>Dividing the two equations:<br><br>$\\dfrac{V_1^2}{V_2^2} = \\dfrac{hF_0}{4hF_0} = \\dfrac{1}{4}$<br><br>Taking the square root:<br><br>$\\dfrac{V_1}{V_2} = \\dfrac{1}{2}$<br><br>Answer: $\\dfrac{1}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792135d0aee93fa0796d837", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "The frequency of incident light falling on a photosensitive material is doubled, the K.E. of the emitted photoelectrons will be", "image": null}, "options": [{"id": "oBK0f", "text": "unchanged.", "image": null, "isCorrect": false}, {"id": "C15HD", "text": "two times its initial value.", "image": null, "isCorrect": false}, {"id": "rldRN", "text": "more than two times its initial value.", "image": null, "isCorrect": true}, {"id": "2HWvd", "text": "less than two times its initial value.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation, the maximum kinetic energy of emitted photoelectrons is given by<br><br>$K_{1} = h\\nu - W$<br><br>where $h\\nu$ is the energy of the incident light and $W$ is the work function of the material.<br><br>When the frequency of incident light is doubled, the new kinetic energy becomes<br><br>$K_{2} = h(2\\nu) - W$<br><br>$K_{2} = 2h\\nu - W$<br><br>Substituting $h\\nu = K_{1} + W$ into the equation for $K_{2}$:<br><br>$K_{2} = 2(K_{1} + W) - W$<br><br>$K_{2} = 2K_{1} + W$<br><br>Since the work function $W$ is a positive quantity ($W > 0$), we get<br><br>$K_{2} > 2K_{1}$<br><br>Thus, the kinetic energy of the emitted photoelectrons will be more than two times its initial value.<br><br>Answer: more than two times its initial value.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792135c0aee93fa0796d82d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "The graph of stopping potential ' $\\mathrm{V}_{\\mathrm{s}}$ ' against frequency ' $v$ ' of incident radiation is plotted for two different metals ' X ' and ' Y ' as shown in graph. ' $\\phi_{\\mathrm{x}}$ ' and ' $\\phi_{\\mathrm{y}}$ ' are work functions of ' x ' and ' $Y$ ', respectively then\r\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/jAPPi-VVdyA-0mjkMltF-rsSDHxmF8W6sXmDbjGtF1o.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "631Rt", "text": "$\\phi_x=\\phi_y$", "image": null, "isCorrect": false}, {"id": "wwfi5", "text": "$\\phi_x \\lt \\phi_y$", "image": null, "isCorrect": true}, {"id": "cDmjx", "text": "$\\phi_x\\gt\\phi_y$", "image": null, "isCorrect": false}, {"id": "4n8yE", "text": "$\\phi_x=\\phi_y=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation, the stopping potential $V_s$ is related to the frequency $\\nu$ of incident radiation by:<br><br>$eV_s = h\\nu - \\phi$<br><br>$V_s = \\dfrac{h}{e}\\nu - \\dfrac{\\phi}{e}$<br><br>The x-intercept of the $V_s$ versus $\\nu$ graph represents the threshold frequency $\\nu_0$, which occurs when $V_s = 0$. Thus, $\\nu_0 = \\dfrac{\\phi}{h}$, or $\\phi = h\\nu_0$.<br><br>From the given graph, the threshold frequency for metal Y ($\\nu_0'$) is greater than the threshold frequency for metal X ($\\nu_0$).<br><br>Since $\\nu_0 < \\nu_0'$, it follows that $h\\nu_0 < h\\nu_0'$.<br><br>Therefore, the work function of metal X is less than the work function of metal Y, i.e., $\\phi_x < \\phi_y$.<br><br>Answer: $\\phi_x \\lt \\phi_y$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213490aee93fa0796d79b", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "When photons of energy hv fall on a photosensitive surface of work function $E_0$, photoelectrons of maximum energy $k$ are emitted. If the frequency of radiation is doubled the maximum kinetic energy will be equal to ( $\\mathrm{h}=$ Planck's constant)", "image": null}, "options": [{"id": "ohhK8", "text": "k", "image": null, "isCorrect": false}, {"id": "3vhOE", "text": "2 k", "image": null, "isCorrect": false}, {"id": "W1FtU", "text": "$\\mathrm{k}+\\mathrm{E}_0$", "image": null, "isCorrect": false}, {"id": "ofI8o", "text": "$\\mathrm{k}+\\mathrm{h} v$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Using Einstein's photoelectric equation for the initial case:<br><br>$k = h\\nu - E_0$<br><br>When the frequency is doubled, the new energy of the incident photons is $2h\\nu$. The new maximum kinetic energy $k'$ is given by:<br><br>$k' = 2h\\nu - E_0$<br><br>This can be rewritten as:<br><br>$k' = h\\nu + (h\\nu - E_0)$<br><br>Substituting $h\\nu - E_0 = k$ into the equation:<br><br>$k' = h\\nu + k$<br><br>Answer: $\\mathrm{k}+\\mathrm{h} v$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213380aee93fa0796d715", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "The stopping potential for a photelectric emission process is 10 V . The maximum kinetic energy of the electrons ejected in the process is [Charge on electron $\\mathrm{e}=1.6 \\times 10^{-19} \\mathrm{C}$ ]", "image": null}, "options": [{"id": "u1dyU", "text": "$3.2 \\times 10^{-19} \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "X2d7W", "text": "$1.6 \\times 10^{-19} \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "0Z9oT", "text": "$1.6 \\times 10^{-18} \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "d1vay", "text": "0 J", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The maximum kinetic energy of the ejected electrons is related to the stopping potential by the equation:<br><br>$K_{\\text{max}} = e V_0$<br><br>Given $V_0 = 10 \\text{ V}$ and $e = 1.6 \\times 10^{-19} \\text{ C}$, substituting these values:<br><br>$K_{\\text{max}} = (1.6 \\times 10^{-19} \\text{ C}) \\times 10 \\text{ V}$<br><br>$K_{\\text{max}} = 1.6 \\times 10^{-18} \\text{ J}$<br><br>Answer: $1.6 \\times 10^{-18} \\mathrm{~J}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213330aee93fa0796d6e8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "The number of photoelectrons emitted for light of frequency $v$ (higher than the threshold frequency $\\left(v_0\\right)$ is proportional to", "image": null}, "options": [{"id": "khRZe", "text": "threshold frequency $\\left(v_0\\right)$", "image": null, "isCorrect": false}, {"id": "PNZzT", "text": "intensity of light (I)", "image": null, "isCorrect": true}, {"id": "VWveW", "text": "frequency of light ( v )", "image": null, "isCorrect": false}, {"id": "reTYv", "text": "work function $\\left(\\phi_0\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the laws of photoelectric effect, the number of photoelectrons emitted per second from a metallic surface is directly proportional to the intensity of the incident light, provided the frequency of the incident light is greater than the threshold frequency.<br><br>The intensity of light corresponds to the number of photons striking the surface per unit area per unit time. An increase in intensity increases the number of incident photons, which in turn increases the number of emitted photoelectrons.<br><br>The frequency of the incident light affects the maximum kinetic energy of the emitted photoelectrons, not their number.<br><br>Therefore, the number of photoelectrons emitted is proportional to the intensity of light.<br><br>Answer: intensity of light (I)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213250aee93fa0796d67e", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "The work function of metal ' $A$ ' and ' $B$ ' are in the ratio $1: 2$. If light of frequency ' $f$ ' and ' $2 f$ ' is incident on surface ' $A$ ' and ' $B$ ' respectively, then the ratio of kinetic energies of emitted photo electrons is", "image": null}, "options": [{"id": "DTVir", "text": "$1: 1$", "image": null, "isCorrect": false}, {"id": "GOJI4", "text": "$1: 2$", "image": null, "isCorrect": true}, {"id": "tMuAG", "text": "$1: 3$", "image": null, "isCorrect": false}, {"id": "cm7JO", "text": "$1: 4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the work function of metal A be $\\phi_A = \\phi$ and that of metal B be $\\phi_B = 2\\phi$.<br><br>According to Einstein's photoelectric equation, the maximum kinetic energy of emitted photoelectrons is given by $K = hf - \\phi$.<br><br>For metal A, the incident frequency is $f$, so the kinetic energy is $K_A = hf - \\phi$.<br><br>For metal B, the incident frequency is $2f$, so the kinetic energy is $K_B = h(2f) - 2\\phi = 2(hf - \\phi)$.<br><br>The ratio of their kinetic energies is $\\dfrac{K_A}{K_B} = \\dfrac{hf - \\phi}{2(hf - \\phi)} = \\dfrac{1}{2}$.<br><br>Answer: $1: 2$", "image": null}, "videoSolution": null, "syllab
