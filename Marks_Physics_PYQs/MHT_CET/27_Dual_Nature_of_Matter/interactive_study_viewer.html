: "will remain constant", "isCorrect": true, "image": null}, {"id": "S4Sfl", "label": "D", "text": "will either increase or decrease", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation, the maximum kinetic energy of emitted photoelectrons is given by $K_{\\max} = h\\nu - \\Phi$, where $h\\nu$ is the energy of the incident photons and $\\Phi$ is the work function of the metal.<br><br>The stopping potential $V_s$ is related to the maximum kinetic energy by $eV_s = K_{\\max}$, which gives $V_s = \\dfrac{h\\nu - \\Phi}{e}$.<br><br>When the point source of light is moved farther from the emitting metal, the intensity of light falling on the metal decreases since intensity is inversely proportional to the square of the distance ($I \\propto \\dfrac{1}{r^2}$).<br><br>However, the frequency $\\nu$ of the incident light remains unchanged. Since the stopping potential depends only on the frequency of the incident light and the nature of the material, it is independent of the intensity of light.<br><br>Therefore, the stopping potential will remain constant.<br><br>Answer: will remain constant", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885f15a9fc0fc8c14310", "type": "singleCorrect", "question": {"text": "A parallel beam of light is incident normally on a plane surface absorbing $40\\%$ of light and reflecting the rest. If the incident beam carries $60$ W of power the force exerted by it on the surface is (C = velocity of light = $3 \\times 10^8$ m/s )", "image": null}, "options": [{"id": "RzF7r", "label": "A", "text": "$3.2 \\times 10^{-8}$ N", "isCorrect": false, "image": null}, {"id": "VFaBO", "label": "B", "text": "$3.2 \\times 10^{-7}$ N", "isCorrect": true, "image": null}, {"id": "cKodR", "label": "C", "text": "$5.12 \\times 10^{-7}$ N", "isCorrect": false, "image": null}, {"id": "OV7Dx", "label": "D", "text": "$5.12 \\times 10^{-8}$ N", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The force exerted by a light beam on a surface is given by the rate of change of momentum.<br><br>Let the incident power be $P$. The momentum incident per second is $\\dfrac{P}{c}$.<br><br>Since the surface absorbs $40\\%$ of the light and reflects the remaining $60\\%$, the reflection coefficient is $r = 0.6$.<br><br>The total force exerted on the surface is the sum of the force due to absorption and the force due to reflection:<br><br>$F = \\dfrac{P}{c}(1 + r)$<br><br>Substituting the given values $P = 60$ W, $c = 3 \\times 10^8$ m/s, and $r = 0.6$:<br><br>$F = \\dfrac{60}{3 \\times 10^8} (1 + 0.6)$<br><br>$F = 20 \\times 10^{-8} \\times 1.6$<br><br>$F = 32 \\times 10^{-8}$ N<br><br>$F = 3.2 \\times 10^{-7}$ N<br><br>Answer: $3.2 \\times 10^{-7}$ N", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885f15a9fc0fc8c1430f", "type": "singleCorrect", "question": {"text": "The frequency of the incident light falling on a photosensitive metal plate is doubled, the kinetic energy of the emitted photoelectrons is", "image": null}, "options": [{"id": "yG9vr", "label": "A", "text": "double the earlier value", "isCorrect": false, "image": null}, {"id": "7XUgF", "label": "B", "text": "unchanged", "isCorrect": false, "image": null}, {"id": "cQacz", "label": "C", "text": "more than double", "isCorrect": true, "image": null}, {"id": "jzB0I", "label": "D", "text": "less than double", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation, the maximum kinetic energy of emitted photoelectrons is given by<br><br>$K_{1} = h\\nu - \\Phi$<br><br>where $h$ is Planck's constant, $\\nu$ is the frequency of incident light, and $\\Phi$ is the work function of the metal.<br><br>When the frequency is doubled, the new maximum kinetic energy $K_{2}$ becomes<br><br>$K_{2} = h(2\\nu) - \\Phi$<br><br>$K_{2} = 2h\\nu - \\Phi$<br><br>Substituting $h\\nu = K_{1} + \\Phi$ into the equation, we get<br><br>$K_{2} = 2(K_{1} + \\Phi) - \\Phi$<br><br>$K_{2} = 2K_{1} + \\Phi$<br><br>Since the work function $\\Phi$ is a positive quantity, $K_{2} > 2K_{1}$.<br><br>Thus, the kinetic energy of the emitted photoelectrons is more than double the earlier value.<br><br>Answer: more than double", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88bc15a9fc0fc8c1467b", "type": "singleCorrect", "question": {"text": "An electromagnetic wave of wavelength $\\lambda$ is incident on a photosensitive surface of negligible work function. If the photoelectrons emitted from this surface have de-Broglie wavelength $\\lambda_1$, then", "image": null}, "options": [{"id": "FtP7A", "label": "A", "text": "$\\lambda \\propto \\lambda_1$", "isCorrect": false, "image": null}, {"id": "USXl9", "label": "B", "text": "$\\lambda \\propto \\lambda_1^2$", "isCorrect": true, "image": null}, {"id": "HEpcc", "label": "C", "text": "$\\lambda \\propto \\lambda_1^4$", "isCorrect": false, "image": null}, {"id": "gWqnH", "label": "D", "text": "$\\lambda \\propto \\lambda_1^6$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Energy of the incident photon is $E = \\dfrac{hc}{\\lambda}$.<br><br>Since the work function is negligible, the kinetic energy of the emitted photoelectron is $K = E = \\dfrac{hc}{\\lambda}$.<br><br>The de-Broglie wavelength of the photoelectron is given by $\\lambda_1 = \\dfrac{h}{p} = \\dfrac{h}{\\sqrt{2mK}}$.<br><br>Substituting the value of $K$, we get $\\lambda_1 = \\dfrac{h}{\\sqrt{2m \\left( \\dfrac{hc}{\\lambda} \\right)}}$.<br><br>Squaring both sides, $\\lambda_1^2 = \\dfrac{h^2 \\lambda}{2mhc} = \\dfrac{h \\lambda}{2mc}$.<br><br>Therefore, $\\lambda \\propto \\lambda_1^2$.<br><br>Answer: $\\lambda \\propto \\lambda_1^2$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb882f15a9fc0fc8c14151", "type": "singleCorrect", "question": {"text": "A photon of energy $10$ units ejects a photo-electron from a metal surface whose work function is $\\Phi_0$. If an electron(e) having maximum kinetic energy enters into a uniform magnetic field of induction(B) in a direction perpendicular to the field and describes a circular path of radius R, then radius R is {$m=$mass of electron}", "image": null}, "options": [{"id": "PvJN9", "label": "A", "text": "$R=\\dfrac{\\sqrt{2m(15-\\Phi_0)}}{eB}$", "isCorrect": false, "image": null}, {"id": "R4yVd", "label": "B", "text": "$R=\\dfrac{\\sqrt{m(10-\\Phi_0)}}{eB}$", "isCorrect": false, "image": null}, {"id": "0YlII", "label": "C", "text": "$R=\\dfrac{\\sqrt{2m(10-\\Phi_0)}}{eB}$", "isCorrect": true, "image": null}, {"id": "Kg9km", "label": "D", "text": "$R=\\dfrac{\\sqrt{2m(10-\\Phi_0)}}{5eB}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation, the maximum kinetic energy of the ejected photoelectron is given by<br><br>$K_{\\text{max}} = E - \\Phi_0$<br><br>Substituting the given photon energy $E = 10$ units, we get<br><br>$K_{\\text{max}} = 10 - \\Phi_0$<br><br>When an electron enters a uniform magnetic field perpendicular to its velocity, it moves in a circular path. The radius $R$ of this path is given by<br><br>$R = \\dfrac{mv}{eB}$<br><br>The momentum $p = mv$ can be written in terms of kinetic energy as $p = \\sqrt{2mK_{\\text{max}}}$. Substituting this into the radius formula gives<br><br>$R = \\dfrac{\\sqrt{2mK_{\\text{max}}}}{eB}$<br><br>Substituting the value of $K_{\\text{max}}$, we obtain<br><br>$R = \\dfrac{\\sqrt{2m(10 - \\Phi_0)}}{eB}$<br><br>Answer: $R=\\dfrac{\\sqrt{2m(10-\\Phi_0)}}{eB}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3508c30a4553e1be269", "type": "singleCorrect", "question": {"text": "Two identical photocathodes receive light of frequencies $n_1$ and $n_2$. If the velocities of the emitted photoelectrons of mass m are $V_1$ and $V_2$ respectively, then ($h$ = Planck's constant)", "image": null}, "options": [{"id": "3nxWP", "label": "A", "text": "$V_1 + V_2 = \\left[\\dfrac{2h}{m}(n_1 + n_2)\\right]^{\\frac{1}{2}}$", "isCorrect": false, "image": null}, {"id": "mnzoz", "label": "B", "text": "$V_1 - V_2 = \\left[\\dfrac{2h}{m}(n_1 - n_2)\\right]^{\\frac{1}{2}}$", "isCorrect": false, "image": null}, {"id": "5ZCTs", "label": "C", "text": "$V_1^2 + V_2^2 = \\dfrac{2h}{m}(n_1 + n_2)$", "isCorrect": false, "image": null}, {"id": "mq5fW", "label": "D", "text": "$V_1^2 - V_2^2 = \\dfrac{2h}{m}(n_1 - n_2)$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Using Einstein's photoelectric equation, the maximum kinetic energy of the emitted photoelectrons is given by $K = hn - W$, where $W$ is the work function of the material.<br><br>For the first case:<br>$\\dfrac{1}{2} m V_1^2 = h n_1 - W$<br><br>For the second case:<br>$\\dfrac{1}{2} m V_2^2 = h n_2 - W$<br><br>Subtracting the second equation from the first, we get:<br>$\\dfrac{1}{2} m V_1^2 - \\dfrac{1}{2} m V_2^2 = h n_1 - W - (h n_2 - W)$<br><br>$\\dfrac{1}{2} m (V_1^2 - V_2^2) = h(n_1 - n_2)$<br><br>$V_1^2 - V_2^2 = \\dfrac{2h}{m}(n_1 - n_2)$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3098c30a4553e1bdf7b", "type": "singleCorrect", "question": {"text": "When light of wavelength '$\\lambda$' is incident on a photosensitive surface, the stopping potential is 'V'. When a light of wavelength $1.5\\lambda$ is incident on the same surface, the stopping potential is '$\\dfrac{V}{4}$'. Threshold wavelength for the surface is", "image": null}, "options": [{"id": "9tczR", "label": "A", "text": "$\\dfrac{6}{5}\\lambda$", "isCorrect": false, "image": null}, {"id": "AztP7", "label": "B", "text": "$\\dfrac{7.5}{4}\\lambda$", "isCorrect": false, "image": null}, {"id": "uPDxQ", "label": "C", "text": "$\\dfrac{7.5}{9}\\lambda$", "isCorrect": false, "image": null}, {"id": "B781I", "label": "D", "text": "$\\dfrac{9}{5}\\lambda$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Using Einstein's photoelectric equation:<br><br>$eV = \\dfrac{hc}{\\lambda} - \\dfrac{hc}{\\lambda_0}$<br><br>For the second case:<br><br>$e\\left(\\dfrac{V}{4}\\right) = \\dfrac{hc}{1.5\\lambda} - \\dfrac{hc}{\\lambda_0}$<br><br>Multiplying the second equation by $4$ gives:<br><br>$eV = \\dfrac{4hc}{1.5\\lambda} - \\dfrac{4hc}{\\lambda_0} = \\dfrac{8hc}{3\\lambda} - \\dfrac{4hc}{\\lambda_0}$<br><br>Equating the two expressions for $eV$:<br><br>$\\dfrac{hc}{\\lambda} - \\dfrac{hc}{\\lambda_0} = \\dfrac{8hc}{3\\lambda} - \\dfrac{4hc}{\\lambda_0}$<br><br>Dividing by $hc$ and rearranging the terms:<br><br>$\\dfrac{4}{\\lambda_0} - \\dfrac{1}{\\lambda_0} = \\dfrac{8}{3\\lambda} - \\dfrac{1}{\\lambda}$<br><br>$\\dfrac{3}{\\lambda_0} = \\dfrac{5}{3\\lambda}$<br><br>$\\lambda_0 = \\dfrac{9}{5}\\lambda$<br><br>Answer: $\\dfrac{9}{5}\\lambda$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2fb8c30a4553e1bdee0", "type": "singleCorrect", "question": {"text": "A photoelectric surface is illuminated successively by monochromatic light of wavelength $\\lambda$ and $(\\lambda/3)$. If the maximum kinetic energy of the emitted photo electrons in the second case is $4$ times that in the first case, the work function of the surface of the material is ($h$ = Planck's constant, $c$ = speed of light)", "image": null}, "options": [{"id": "MLDFo", "label": "A", "text": "$\\dfrac{3hc}{\\lambda}$", "isCorrect": false, "image": null}, {"id": "fFXKh", "label": "B", "text": "$\\dfrac{hc}{3\\lambda}$", "isCorrect": true, "image": null}, {"id": "z1XqY", "label": "C", "text": "$\\dfrac{hc}{2\\lambda}$", "isCorrect": false, "image": null}, {"id": "oP0Os", "label": "D", "text": "$\\dfrac{hc}{\\lambda}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using Einstein's photoelectric equation, the maximum kinetic energy of emitted photoelectrons is given by $K = \\dfrac{hc}{\\lambda} - \\phi$, where $\\phi$ is the work function of the material.<br><br>For the first case with wavelength $\\lambda$:<br>$K_1 = \\dfrac{hc}{\\lambda} - \\phi$<br><br>For the second case with wavelength $\\dfrac{\\lambda}{3}$:<br>$K_2 = \\dfrac{hc}{\\dfrac{\\lambda}{3}} - \\phi = \\dfrac{3hc}{\\lambda} - \\phi$<br><br>It is given that the maximum kinetic energy in the second case is $4$ times that in the first case:<br>$K_2 = 4K_1$<br><br>Substituting the expressions for $K_1$ and $K_2$:<br>$\\dfrac{3hc}{\\lambda} - \\phi = 4\\left(\\dfrac{hc}{\\lambda} - \\phi\\right)$<br><br>$\\dfrac{3hc}{\\lambda} - \\phi = \\dfrac{4hc}{\\lambda} - 4\\phi$<br><br>$4\\phi - \\phi = \\dfrac{4hc}{\\lambda} - \\dfrac{3hc}{\\lambda}$<br><br>$3\\phi = \\dfrac{hc}{\\lambda}$<br><br>$\\phi = \\dfrac{hc}{3\\lambda}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2fa8c30a4553e1bdedd", "type": "singleCorrect", "question": {"text": "According to Einstein's photoelectric equation, the graph of the kinetic energy of the emitted photoelectrons versus the frequency of incident radiation gives a straight line whose slope", "image": null}, "options": [{"id": "SgDig", "label": "A", "text": "depends on the intensity of incident radiation.", "isCorrect": false, "image": null}, {"id": "KZkSZ", "label": "B", "text": "depends on the nature of the metal used.", "isCorrect": false, "image": null}, {"id": "PFGbA", "label": "C", "text": "is the same for all metals and independent of the intensity of radiation.", "isCorrect": true, "image": null}, {"id": "awAw4", "label": "D", "text": "depends on both the intensity of incident radiation and the nature of metal used.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation, the maximum kinetic energy of emitted photoelectrons is given by<br><br>$K_{\\text{max}} = h\\nu - \\Phi$<br><br>where $h$ is Planck's constant, $\\nu$ is the frequency of incident radiation, and $\\Phi$ is the work function of the metal.<br><br>Comparing this with the equation of a straight line $y = mx + c$, we get the slope $m = h$.<br><br>Since Planck's constant $h$ is a universal constant, the slope of the graph is the same for all metals and is completely independent of the intensity of the incident radiation.<br><br>Answer: is the same for all metals and independent of the intensity of radiation.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ed8c30a4553e1bde50", "type": "singleCorrect", "question": {"text": "The maximum kinetic energies of photoelectrons emitted are $K_1$ and $K_2$ when light of wavelength $\\lambda_1$ and $\\lambda_2$ respectively are incident on a metallic surface. If $\\lambda_1 = 3\\lambda_2$ then", "image": null}, "options": [{"id": "hgZkJ", "label": "A", "text": "$K_1 = \\dfrac{K_2}{3}$", "isCorrect": false, "image": null}, {"id": "6rwZY", "label": "B", "text": "$K_1 < \\dfrac{K_2}{3}$", "isCorrect": true, "image": null}, {"id": "7k5nT", "label": "C", "text": "$K_1 = 3K_2$", "isCorrect": false, "image": null}, {"id": "N04N7", "label": "D", "text": "$K_1 = \\dfrac{2}{3}K_2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation, the maximum kinetic energy of emitted photoelectrons is given by $K = \\dfrac{hc}{\\lambda} - \\Phi$, where $\\Phi$ is the work function of the metal.<br><br>For wavelength $\\lambda_1$:<br><br>$K_1 = \\dfrac{hc}{\\lambda_1} - \\Phi$<br><br>For wavelength $\\lambda_2$:<br><br>$K_2 = \\dfrac{hc}{\\lambda_2} - \\Phi$<br><br>Given $\\lambda_1 = 3\\lambda_2$, substituting this in the first equation gives:<br><br>$K_1 = \\dfrac{hc}{3\\lambda_2} - \\Phi$<br><br>Multiplying the equation by $3$ yields:<br><br>$3K_1 = \\dfrac{hc}{\\lambda_2} - 3\\Phi$<br><br>From the second equation, substituting $\\dfrac{hc}{\\lambda_2} = K_2 + \\Phi$ into the above relation:<br><br>$3K_1 = (K_2 + \\Phi) - 3\\Phi$<br><br>$3K_1 = K_2 - 2\\Phi$<br><br>Since the work function $\\Phi > 0$, it follows that:<br><br>$3K_1 < K_2$<br><br>$K_1 < \\dfrac{K_2}{3}$<br><br>Answer: $K_1 < \\dfrac{K_2}{3}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3258c30a4553e1be0a7", "type": "singleCorrect", "question": {"text": "In case of photoelectric emission from certain metal, the cutoff frequency is $\\nu$. If the radiation of frequency $3\\nu$ is incident on the metal plate, the maximum possible velocity of the emitted electrons will be ($m$ = mass of electron, $h$ = Planck's constant)", "image": null}, "options": [{"id": "Slw8D", "label": "A", "text": "$\\sqrt{\\dfrac{h\\nu}{2m}}$", "isCorrect": false, "image": null}, {"id": "3SW7m", "label": "B", "text": "$\\sqrt{\\dfrac{h\\nu}{m}}$", "isCorrect": false, "image": null}, {"id": "rN5H3", "label": "C", "text": "$2\\left(\\sqrt{\\dfrac{h\\nu}{m}}\\right)$", "isCorrect": true, "image": null}, {"id": "IWIyi", "label": "D", "text": "$\\sqrt{\\dfrac{2h\\nu}{m}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation:<br><br>$K_{\\text{max}} = h\\nu_{\\text{incident}} - h\\nu_{\\text{cutoff}}$<br><br>Given $\\nu_{\\text{incident}} = 3\\nu$ and $\\nu_{\\text{cutoff}} = \\nu$:<br><br>$\\dfrac{1}{2}mv_{\\text{max}}^2 = h(3\\nu) - h\\nu$<br><br>$\\dfrac{1}{2}mv_{\\text{max}}^2 = 2h\\nu$<br><br>$v_{\\text{max}}^2 = \\dfrac{4h\\nu}{m}$<br><br>$v_{\\text{max}} = 2\\sqrt{\\dfrac{h\\nu}{m}}$<br><br>Answer: $2\\left(\\sqrt{\\dfrac{h\\nu}{m}}\\right)$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3418c30a4553e1be1d3", "type": "singleCorrect", "question": {"text": "In photoelectric effect, keeping the frequency of incident radiation and accelerating potential fixed, if the intensity of incident light is increased,", "image": null}, "options": [{"id": "lQXnM", "label": "A", "text": "the photoelectric current increases.", "isCorrect": true, "image": null}, {"id": "AA6Ja", "label": "B", "text": "the kinetic energy of emitted photoelectrons increases.", "isCorrect": false, "image": null}, {"id": "gNPHZ", "label": "C", "text": "photoelectric current decreases.", "isCorrect": false, "image": null}, {"id": "DLzcd", "label": "D", "text": "kinetic energy of emitted photoelectrons decreases.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In the photoelectric effect, the intensity of incident light is directly proportional to the number of photons incident per unit area per unit time.<br><br>Increasing the intensity of the incident light increases the number of photons striking the metal surface per second.<br><br>Since the frequency of the incident radiation is kept fixed, the energy of each individual photon ($E = h\\nu$) remains constant. Therefore, the maximum kinetic energy of the emitted photoelectrons ($K_{max} = h\\nu - \\Phi$) does not change.<br><br>However, a larger number of incident photons results in a larger number of photoelectrons being emitted per second.<br><br>This increase in the rate of emission of photoelectrons leads to an increase in the photoelectric current.<br><br>Answer: the photoelectric current increases.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c38c30a4553e1bdc8e", "type": "singleCorrect", "question": {"text": "Photoelectric emission is observed from a metallic surface for frequencies $\\nu_1$ and $\\nu_2$ of the incident light rays ($\\nu_1 > \\nu_2$). If the ratio of maximum value of kinetic energy of the photoelectron emitted in first case to that in second case 3 : K, then the threshold frequency of the metallic surface is", "image": null}, "options": [{"id": "4TFIt", "label": "A", "text": "$\\dfrac{K\\nu_1 - \\nu_2}{K-1}$", "isCorrect": false, "image": null}, {"id": "wINCL", "label": "B", "text": "$\\dfrac{K-1}{K\\nu_1 - \\nu_2}$", "isCorrect": false, "image": null}, {"id": "T3PkS", "label": "C", "text": "$\\dfrac{K-3}{K\\nu_1 - 3\\nu_2}$", "isCorrect": false, "image": null}, {"id": "MhdsR", "label": "D", "text": "$\\dfrac{K\\nu_1 - 3\\nu_2}{K-3}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Using Einstein's photoelectric equation, the maximum kinetic energy of emitted photoelectrons is given by $K_{max} = h\\nu - h\\nu_0$, where $\\nu_0$ is the threshold frequency.<br><br>For the first case:<br>$K_1 = h\\nu_1 - h\\nu_0$<br><br>For the second case:<br>$K_2 = h\\nu_2 - h\\nu_0$<br><br>Given the ratio of maximum kinetic energies is $3 : K$:<br>$\\dfrac{K_1}{K_2} = \\dfrac{3}{K}$<br><br>Substituting the expressions for $K_1$ and $K_2$:<br>$\\dfrac{h\\nu_1 - h\\nu_0}{h\\nu_2 - h\\nu_0} = \\dfrac{3}{K}$<br><br>Canceling $h$ and cross-multiplying:<br>$K(\\nu_1 - \\nu_0) = 3(\\nu_2 - \\nu_0)$<br><br>$K\\nu_1 - K\\nu_0 = 3\\nu_2 - 3\\nu_0$<br><br>Rearranging to solve for $\\nu_0$:<br>$3\\nu_0 - K\\nu_0 = 3\\nu_2 - K\\nu_1$<br><br>$\\nu_0(3 - K) = 3\\nu_2 - K\\nu_1$<br><br>$\\nu_0 = \\dfrac{K\\nu_1 - 3\\nu_2}{K - 3}$<br><br>Answer: $\\dfrac{K\\nu_1 - 3\\nu_2}{K-3}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d08c30a4553e1bdd16", "type": "singleCorrect", "question": {"text": "When a light of wavelength '$\\lambda$' falls on the emitter of a photosensitive surface, maximum speed of emitted photoelectrons is 'V'. If the incident wavelength is changed to '$2\\lambda/3$', maximum speed of emitted photoelectrons will be", "image": null}, "options": [{"id": "q7oJI", "label": "A", "text": "less than $V(1.5)^{\\frac{1}{2}}$", "isCorrect": false, "image": null}, {"id": "qZvog", "label": "B", "text": "greater than $V(1.5)^{\\frac{1}{2}}$", "isCorrect": true, "image": null}, {"id": "EvbHu", "label": "C", "text": "less than $V$", "isCorrect": false, "image": null}, {"id": "ycyUN", "label": "D", "text": "less than $\\dfrac{V}{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation, the maximum kinetic energy of emitted photoelectrons is given by<br><br>$\\dfrac{1}{2}mV^2 = \\dfrac{hc}{\\lambda} - \\phi$<br><br>When the incident wavelength is changed to $\\dfrac{2\\lambda}{3}$, the new maximum kinetic energy is<br><br>$\\dfrac{1}{2}mV'^2 = \\dfrac{hc}{\\dfrac{2\\lambda}{3}} - \\phi = \\dfrac{3hc}{2\\lambda} - \\phi$<br><br>Substituting $\\dfrac{hc}{\\lambda} = \\dfrac{1}{2}mV^2 + \\phi$ into the above equation, we get<br><br>$\\dfrac{1}{2}mV'^2 = \\dfrac{3}{2}\\left(\\dfrac{1}{2}mV^2 + \\phi\\right) - \\phi$<br><br>$\\dfrac{1}{2}mV'^2 = \\dfrac{3}{2}\\left(\\dfrac{1}{2}mV^2\\right) + \\dfrac{\\phi}{2}$<br><br>Since the work function $\\phi > 0$, it follows that<br><br>$\\dfrac{1}{2}mV'^2 > \\dfrac{3}{2}\\left(\\dfrac{1}{2}mV^2\\right)$<br><br>$V'^2 > 1.5 V^2$<br><br>$V' > V(1.5)^{\\dfrac{1}{2}}$<br><br>Thus, the maximum speed of emitted photoelectrons will be greater than $V(1.5)^{\\dfrac{1}{2}}$.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2cf8c30a4553e1bdd0b", "type": "singleCorrect", "question": {"text": "A photoemissive substance is illuminated with a radiation of wavelength $\\lambda_i$ so that it releases electrons with de-Broglie wavelength $\\lambda_e$. The longest wavelength of radiation that can emit photoelectron is $\\lambda_0$. Expression for de-Broglie wavelength is (m = mass of electron, h = Planck's constant, C = Speed of light)", "image": null}, "options": [{"id": "Wjc0Z", "label": "A", "text": "$(\\text{h}\\lambda_i/2\\text{mc})^{\\frac{1}{2}}$", "isCorrect": false, "image": null}, {"id": "DYp8W", "label": "B", "text": "$(\\text{h}\\lambda_0/2\\text{mc})^{\\frac{1}{2}}$", "isCorrect": false, "image": null}, {"id": "e2Yhy", "label": "C", "text": "$[\\text{h}/2\\text{mc}(\\dfrac{1}{\\lambda_i} - \\dfrac{1}{\\lambda_0})]^{\\frac{1}{2}}$", "isCorrect": true, "image": null}, {"id": "2cC1G", "label": "D", "text": "$[\\text{h}/[2\\text{mc}(\\dfrac{1}{\\lambda_i} - \\dfrac{1}{\\lambda_0})]^{\\frac{1}{2}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using Einstein's photoelectric equation, the maximum kinetic energy of the emitted photoelectron is given by:<br><br>$K_{\\text{max}} = \\dfrac{hc}{\\lambda_i} - \\dfrac{hc}{\\lambda_0} = hc \\left( \\dfrac{1}{\\lambda_i} - \\dfrac{1}{\\lambda_0} \\right)$<br><br>The de-Broglie wavelength of the emitted electron is:<br><br>$\\lambda_e = \\dfrac{h}{p} = \\dfrac{h}{\\sqrt{2mK_{\\text{max}}}}$<br><br>Substituting the value of $K_{\\text{max}}$:<br><br>$\\lambda_e = \\dfrac{h}{\\sqrt{2mhc \\left( \\dfrac{1}{\\lambda_i} - \\dfrac{1}{\\lambda_0} \\right)}}$<br><br>$\\lambda_e = \\sqrt{\\dfrac{h^2}{2mhc \\left( \\dfrac{1}{\\lambda_i} - \\dfrac{1}{\\lambda_0} \\right)}}$<br><br>$\\lambda_e = \\left[ \\dfrac{h}{2mc \\left( \\dfrac{1}{\\lambda_i} - \\dfrac{1}{\\lambda_0} \\right)} \\right]^{\\dfrac{1}{2}}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3328c30a4553e1be136", "type": "singleCorrect", "question": {"text": "For a photosensitive material, work function is '$W_0$' and stopping potential is 'V'. The wavelength of the incident radiation is (h=Planck's constant, c = velocity of light, e = electronic charge)", "image": null}, "options": [{"id": "nhKxh", "label": "A", "text": "$\\dfrac{\\text{hc}}{(\\text{W}_0 - \\text{eV})}$", "isCorrect": false, "image": null}, {"id": "r8Nyu", "label": "B", "text": "$\\dfrac{\\text{hc}}{(\\text{W}_0 + \\text{eV})}$", "isCorrect": true, "image": null}, {"id": "I0AXM", "label": "C", "text": "$\\text{hc}(\\text{W}_0 - \\text{eV})$", "isCorrect": false, "image": null}, {"id": "hYmP9", "label": "D", "text": "$\\text{hc}(\\text{W}_0 + \\text{eV})$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation:<br><br>$E = W_0 + K_{\\text{max}}$<br><br>where $E$ is the energy of the incident radiation, $W_0$ is the work function, and $K_{\\text{max}}$ is the maximum kinetic energy of the emitted photoelectrons.<br><br>The maximum kinetic energy is related to the stopping potential $V$ by:<br><br>$K_{\\text{max}} = eV$<br><br>The energy of the incident radiation is given by:<br><br>$E = \\dfrac{hc}{\\lambda}$<br><br>Equating the expressions for $E$:<br><br>$\\dfrac{hc}{\\lambda} = W_0 + eV$<br><br>Solving for $\\lambda$:<br><br>$\\lambda = \\dfrac{hc}{W_0 + eV}$<br><br>Answer: $\\dfrac{\\text{hc}}{(\\text{W}_0 + \\text{eV})}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3328c30a4553e1be134", "type": "singleCorrect", "question": {"text": "Using Einstein's photoelectric equation, the graphical representation between the kinetic energy (E) of emitted Photoelectrons and the frequency of incident radiation ($\\nu$) is show correctly in figure<br><img style=\"width: 600px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/15_april_shift_1__q36_d1.png\" />", "image": null}, "options": [{"id": "ToW6b", "label": "A", "text": "A", "isCorrect": false, "image": null}, {"id": "tmEBF", "label": "B", "text": "B", "isCorrect": false, "image": null}, {"id": "BDu8K", "label": "C", "text": "C", "isCorrect": true, "image": null}, {"id": "IzvDv", "label": "D", "text": "D", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation, the maximum kinetic energy ($E$) of emitted photoelectrons is given by:<br><br>$E = h\\nu - \\Phi$<br><br>where $h$ is Planck's constant, $\\nu$ is the frequency of incident radiation, and $\\Phi$ is the work function of the metal.<br><br>Comparing this equation with the equation of a straight line, $y = mx + c$, we get:<br>$y = E$<br>$x = \\nu$<br>Slope, $m = h$ (which is positive)<br>$y$-intercept, $c = -\\Phi$ (which is negative)<br><br>The $x$-intercept (where $E = 0$) is $\\nu = \\dfrac{\\Phi}{h} = \\nu_0$, which is the threshold frequency. For frequencies $\\nu < \\nu_0$, no photoelectric emission takes place, so the kinetic energy is zero. For $\\nu > \\nu_0$, the kinetic energy increases linearly with frequency.<br><br>Graph (C) correctly shows a straight line with a positive slope and a positive intercept on the frequency axis ($\\nu$-axis), representing the threshold frequency $\\nu_0$.<br><br>Answer: C", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2de8c30a4553e1bddab", "type": "singleCorrect", "question": {"text": "When a metallic surface is illuminated with a radiation of wavelength '$\\lambda$', the stopping potential is 'V'. If the same surface is illuminated with radiation of wavelength $6\\lambda$, the stopping potential is $\\left(\\dfrac{V}{12}\\right)$. The threshold wavelength for the surface is", "image": null}, "options": [{"id": "sB7mM", "label": "A", "text": "$5\\lambda$", "isCorrect": false, "image": null}, {"id": "yrRyb", "label": "B", "text": "$10\\lambda$", "isCorrect": false, "image": null}, {"id": "48LZK", "label": "C", "text": "$11\\lambda$", "isCorrect": true, "image": null}, {"id": "g5BfD", "label": "D", "text": "$12\\lambda$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using Einstein's photoelectric equation, $eV = \\dfrac{hc}{\\lambda} - \\dfrac{hc}{\\lambda_0}$<br><br>For the first case:<br><br>$eV = \\dfrac{hc}{\\lambda} - \\dfrac{hc}{\\lambda_0}$<br><br>For the second case:<br><br>$\\dfrac{eV}{12} = \\dfrac{hc}{6\\lambda} - \\dfrac{hc}{\\lambda_0}$<br><br>Multiplying the second equation by $12$ gives:<br><br>$eV = \\dfrac{2hc}{\\lambda} - \\dfrac{12hc}{\\lambda_0}$<br><br>Equating the two expressions for $eV$:<br><br>$\\dfrac{hc}{\\lambda} - \\dfrac{hc}{\\lambda_0} = \\dfrac{2hc}{\\lambda} - \\dfrac{12hc}{\\lambda_0}$<br><br>$\\dfrac{11hc}{\\lambda_0} = \\dfrac{hc}{\\lambda}$<br><br>$\\lambda_0 = 11\\lambda$<br><br>Answer: $11\\lambda$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2dd8c30a4553e1bdda0", "type": "singleCorrect", "question": {"text": "In photoelectric effect experiment, if the frequency of incident radiation ($v$) is increased, keeping all other factors constant, the stopping potential, ( $v > v_0$) ($v_0$ = threshold frequency)", "image": null}, "options": [{"id": "FWujS", "label": "A", "text": "decreases", "isCorrect": false, "image": null}, {"id": "9ps0K", "label": "B", "text": "remains the same", "isCorrect": false, "image": null}, {"id": "Veba9", "label": "C", "text": "increases", "isCorrect": true, "image": null}, {"id": "VtMu5", "label": "D", "text": "becomes zero", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation, the maximum kinetic energy of emitted photoelectrons is given by:<br><br>$K_{\\max} = h v - \\Phi$<br><br>where $h$ is Planck's constant, $v$ is the frequency of incident radiation, and $\\Phi$ is the work function of the material.<br><br>The stopping potential $V_0$ is related to the maximum kinetic energy by:<br><br>$e V_0 = K_{\\max}$<br><br>Substituting this into the photoelectric equation gives:<br><br>$e V_0 = h v - \\Phi$<br><br>$V_0 = \\dfrac{h}{e} v - \\dfrac{\\Phi}{e}$<br><br>From this linear relationship, it is evident that the stopping potential $V_0$ increases as the frequency of incident radiation $v$ increases.<br><br>Answer: increases", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3178c30a4553e1be00c", "type": "singleCorrect", "question": {"text": "Light of wavelength '$\\lambda$' which is less than threshold wavelength is incident on a photosensitive material. If incident wavelength is decreased so that emitted photoelectrons are moving with some velocity then stopping potential", "image": null}, "options": [{"id": "R0EJe", "label": "A", "text": "becomes half", "isCorrect": false, "image": null}, {"id": "NeXLD", "label": "B", "text": "increases", "isCorrect": true, "image": null}, {"id": "XxM1o", "label": "C", "text": "decreases", "isCorrect": false, "image": null}, {"id": "402Bj", "label": "D", "text": "is zero", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation, the maximum kinetic energy of emitted photoelectrons is given by<br><br>$K_{\\max} = \\dfrac{hc}{\\lambda} - \\Phi$<br><br>where $\\lambda$ is the incident wavelength and $\\Phi$ is the work function of the material.<br><br>The stopping potential $V_s$ is related to the maximum kinetic energy by<br><br>$eV_s = K_{\\max} = \\dfrac{hc}{\\lambda} - \\Phi$<br><br>When the incident wavelength $\\lambda$ is decreased, the term $\\dfrac{hc}{\\lambda}$ increases. Since the work function $\\Phi$ remains constant for a given material, the maximum kinetic energy $K_{\\max}$ of the photoelectrons increases.<br><br>Consequently, the stopping potential $V_s$ also increases.<br><br>Answer: increases", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2968c30a4553e1bdaac", "type": "singleCorrect", "question": {"text": "The threshold frequency of metal is $f_0$. When the light of frequency $2f_0$ is incident on the metal plate, the maximum velocity of photoelectron is $v_1$. When the frequency of incident radiation is increased to $5f_0$ the maximum velocity of photoelectrons emitted is $v_2$. The ratio $v_1$ to $v_2$ is", "image": null}, "options": [{"id": "emnf3", "label": "A", "text": "$1:2$", "isCorrect": true, "image": null}, {"id": "SA1Ou", "label": "B", "text": "$1:8$", "isCorrect": false, "image": null}, {"id": "dLAup", "label": "C", "text": "$1:16$", "isCorrect": false, "image": null}, {"id": "a0lvB", "label": "D", "text": "$1:4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using Einstein's photoelectric equation:<br><br>$K_{\\max} = hf - hf_0$<br><br>For incident frequency $2f_0$:<br><br>$\\dfrac{1}{2}mv_1^2 = h(2f_0) - hf_0 = hf_0$<br><br>For incident frequency $5f_0$:<br><br>$\\dfrac{1}{2}mv_2^2 = h(5f_0) - hf_0 = 4hf_0$<br><br>Taking the ratio of the two equations:<br><br>$\\dfrac{v_1^2}{v_2^2} = \\dfrac{hf_0}{4hf_0} = \\dfrac{1}{4}$<br><br>$\\dfrac{v_1}{v_2} = \\dfrac{1}{2}$<br><br>Answer: $1:2$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3698c30a4553e1be374", "type": "singleCorrect", "question": {"text": "Energy of the incident photons on the photosensitive metal surface is 3W and then 5W where 'W' is the work function of that metal. The ratio of velocities of the emitted photoelectrons is", "image": null}, "options": [{"id": "dbOMM", "label": "A", "text": "$1 : 1$", "isCorrect": false, "image": null}, {"id": "Trk3J", "label": "B", "text": "$1 : \\sqrt{2}$", "isCorrect": true, "image": null}, {"id": "oTHGI", "label": "C", "text": "$1 : 2$", "isCorrect": false, "image": null}, {"id": "pDkRT", "label": "D", "text": "$1 : 4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using Einstein's photoelectric equation, the maximum kinetic energy of the emitted photoelectrons is given by $K = E - W$, where $E$ is the energy of the incident photons and $W$ is the work function of the metal.<br><br>For the first case, the energy of the incident photons is $E_1 = 3W$.<br>The maximum kinetic energy is $K_1 = 3W - W = 2W$.<br><br>For the second case, the energy of the incident photons is $E_2 = 5W$.<br>The maximum kinetic energy is $K_2 = 5W - W = 4W$.<br><br>The kinetic energy is related to the velocity by $K = \\dfrac{1}{2}mv^2$, which implies $v \\propto \\sqrt{K}$.<br><br>The ratio of the velocities of the emitted photoelectrons is:<br>$\\dfrac{v_1}{v_2} = \\sqrt{\\dfrac{K_1}{K_2}} = \\sqrt{\\dfrac{2W}{4W}} = \\sqrt{\\dfrac{1}{2}} = \\dfrac{1}{\\sqrt{2}}$<br><br>The ratio is $1 : \\sqrt{2}$.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3698c30a4553e1be373", "type": "singleCorrect", "question": {"text": "Which one of the four graphs showing lines P, Q, R and S between maximum kinetic energy (E) and intensity of incident radiation (I) is correct?<br><img style=\"width: 200px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/13_april_shift_1__q11_d1.png\" />", "image": null}, "options": [{"id": "YNqaL", "label": "A", "text": "P", "isCorrect": true, "image": null}, {"id": "1PoUW", "label": "B", "text": "Q", "isCorrect": false, "image": null}, {"id": "oIiBm", "label": "C", "text": "R", "isCorrect": false, "image": null}, {"id": "SVWz0", "label": "D", "text": "S", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation, the maximum kinetic energy of emitted photoelectrons is given by:<br><br>$E = h\\nu - \\Phi$<br><br>where $h$ is Planck's constant, $\\nu$ is the frequency of incident radiation, and $\\Phi$ is the work function of the material.<br><br>From this equation, it is clear that the maximum kinetic energy ($E$) depends only on the frequency of the incident radiation and the nature of the material. It is completely independent of the intensity ($I$) of the incident radiation, provided the frequency is above the threshold frequency.<br><br>Therefore, the graph between maximum kinetic energy ($E$) and intensity ($I$) will be a straight horizontal line parallel to the intensity axis. Line P correctly represents this behavior.<br><br>Answer: P", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d35a8c30a4553e1be2da", "type": "singleCorrect", "question": {"text": "Photoelectrons are emitted from two similar metal plates when wavelengths $\\lambda_1$ and $\\lambda_2$ are incident on them ($\\lambda_1 = 1.5\\lambda_2$). If maximum kinetic energy of emitted photoelectrons is $E_1$ and $E_2$ respectively then", "image": null}, "options": [{"id": "2VUhb", "label": "A", "text": "$E_1 < 2E_2/3$", "isCorrect": true, "image": null}, {"id": "0cegV", "label": "B", "text": "$E_1 = 2E_2/3$", "isCorrect": false, "image": null}, {"id": "Gw2Wo", "label": "C", "text": "$E_1 = E_2/3$", "isCorrect": false, "image": null}, {"id": "lRi4N", "label": "D", "text": "$E_1 = 2E_2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using Einstein's photoelectric equation:<br><br>$E_1 = \\dfrac{hc}{\\lambda_1} - \\phi$<br><br>$E_2 = \\dfrac{hc}{\\lambda_2} - \\phi$<br><br>Given $\\lambda_1 = 1.5\\lambda_2 = \\dfrac{3}{2}\\lambda_2$, we can write:<br><br>$E_1 = \\dfrac{2hc}{3\\lambda_2} - \\phi$<br><br>From the second equation, $\\dfrac{hc}{\\lambda_2} = E_2 + \\phi$. Substituting this into the equation for $E_1$:<br><br>$E_1 = \\dfrac{2}{3}(E_2 + \\phi) - \\phi$<br><br>$E_1 = \\dfrac{2}{3}E_2 - \\dfrac{1}{3}\\phi$<br><br>Since the work function $\\phi > 0$, it follows that:<br><br>$E_1 < \\dfrac{2}{3}E_2$<br><br>Answer: $E_1 < 2E_2/3$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b28c30a4553e1bdbdc", "type": "singleCorrect", "question": {"text": "Photoelectric emission is observed from a metallic surface for frequencies $v_1$ and $v_2$ of the incident light rays ($v_1 > v_2$). If the maximum values of kinetic energy of the photoelectrons emitted in the two cases are in the ratio of $k : 1$, then what is the threshold frequency of the metallic surface?", "image": null}, "options": [{"id": "v7cR1", "label": "A", "text": "$\\dfrac{v_1 - v_2}{k}$", "isCorrect": false, "image": null}, {"id": "Ul9XU", "label": "B", "text": "$\\dfrac{v_1 - v_2}{k - 1}$", "isCorrect": false, "image": null}, {"id": "uEKMe", "label": "C", "text": "$\\dfrac{kv_1 - v_2}{k - 1}$", "isCorrect": false, "image": null}, {"id": "Af2k7", "label": "D", "text": "$\\dfrac{kv_2 - v_1}{k - 1}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Using Einstein's photoelectric equation, the maximum kinetic energy of photoelectrons is given by $K = h(v - v_0)$, where $v_0$ is the threshold frequency.<br><br>For frequency $v_1$, $K_1 = h(v_1 - v_0)$<br><br>For frequency $v_2$, $K_2 = h(v_2 - v_0)$<br><br>Given that the ratio of maximum kinetic energies is $k : 1$, we have:<br><br>$\\dfrac{K_1}{K_2} = \\dfrac{h(v_1 - v_0)}{h(v_2 - v_0)} = k$<br><br>$\\dfrac{v_1 - v_0}{v_2 - v_0} = k$<br><br>$v_1 - v_0 = k(v_2 - v_0)$<br><br>$v_1 - v_0 = kv_2 - kv_0$<br><br>$kv_0 - v_0 = kv_2 - v_1$<br><br>$v_0(k - 1) = kv_2 - v_1$<br><br>$v_0 = \\dfrac{kv_2 - v_1}{k - 1}$<br><br>Answer: $\\dfrac{kv_2 - v_1}{k - 1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b18c30a4553e1bdbcf", "type": "singleCorrect", "question": {"text": "A photon and an electron have equal energy E. The ratio of $\\lambda$(electron) to $\\lambda$(photon) is proportional to", "image": null}, "options": [{"id": "ICjUZ", "label": "A", "text": "$1 : \\sqrt{E}$", "isCorrect": false, "image": null}, {"id": "nMTB4", "label": "B", "text": "$\\sqrt{E} : 1$", "isCorrect": true, "image": null}, {"id": "B195I", "label": "C", "text": "$1 : E$", "isCorrect": false, "image": null}, {"id": "i5sf5", "label": "D", "text": "$1 : E^2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a photon of energy $E$, the wavelength is given by $\\lambda_{photon} = \\dfrac{hc}{E}$.<br><br>For an electron of kinetic energy $E$, the momentum is $p = \\sqrt{2mE}$. The de Broglie wavelength of the electron is $\\lambda_{electron} = \\dfrac{h}{p} = \\dfrac{h}{\\sqrt{2mE}}$.<br><br>Taking the ratio of the wavelength of the electron to that of the photon, we get:<br><br>$\\dfrac{\\lambda_{electron}}{\\lambda_{photon}} = \\dfrac{\\dfrac{h}{\\sqrt{2mE}}}{\\dfrac{hc}{E}} = \\dfrac{h}{\\sqrt{2mE}} \\times \\dfrac{E}{hc} = \\dfrac{\\sqrt{E}}{c\\sqrt{2m}}$<br><br>Since $h$, $c$, and $m$ are constants, the ratio is directly proportional to $\\sqrt{E}$.<br><br>$\\dfrac{\\lambda_{electron}}{\\lambda_{photon}} \\propto \\sqrt{E}$<br><br>Thus, the ratio is proportional to $\\sqrt{E} : 1$.<br><br>Answer: $\\sqrt{E} : 1$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bfabf9280d7f9932e33", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Energy of the incident photons on the metal surface is initially 4 W and then 6 W where W is the work function of that metal. The ratio of velocities of emitted photoelectrons is", "image": null}, "options": [{"id": "Vp7Ib", "text": "$\\sqrt{3}: \\sqrt{5}$", "image": null, "isCorrect": true}, {"id": "nliWf", "text": "$1: 2$", "image": null, "isCorrect": false}, {"id": "BrKG1", "text": "$2: 3$", "image": null, "isCorrect": false}, {"id": "C5k9h", "text": "$\\sqrt{2}: \\sqrt{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation, the maximum kinetic energy of emitted photoelectrons is given by $K = E - W$, where $E$ is the energy of incident photons and $W$ is the work function.<br><br>For the first case, $E_1 = 4W$.<br><br>$K_1 = 4W - W = 3W$<br><br>For the second case, $E_2 = 6W$.<br><br>$K_2 = 6W - W = 5W$<br><br>Since kinetic energy $K = \\dfrac{1}{2}mv^2$, the velocity $v$ is proportional to $\\sqrt{K}$.<br><br>The ratio of velocities is $\\dfrac{v_1}{v_2} = \\sqrt{\\dfrac{K_1}{K_2}} = \\sqrt{\\dfrac{3W}{5W}} = \\dfrac{\\sqrt{3}}{\\sqrt{5}}$.<br><br>Thus, the ratio is $\\sqrt{3} : \\sqrt{5}$.<br><br>Answer: $\\sqrt{3}: \\sqrt{5}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf7bf9280d7f9932e14", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A photosensitive surface has work function $\\phi$. If photon of energy $3 \\phi$ falls on this surface, the electron comes out with maximum velocity of $4 \\times 10^6 \\mathrm{~m} / \\mathrm{s}$. When photon energy is increased to $7 \\phi$ then maximum velocity of photoelectron will be", "image": null}, "options": [{"id": "Pi8M4", "text": "$4 \\sqrt{3} \\times 10^6 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": true}, {"id": "Uq0ux", "text": "$2 \\sqrt{3} \\times 10^6 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "BqsCy", "text": "$4 \\sqrt{3} \\times 10^3 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "lMp8d", "text": "$2 \\sqrt{3} \\times 10^3 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation:<br><br>$K_{\\max} = E - \\phi$<br><br>For the first case, $E_1 = 3 \\phi$:<br><br>$\\dfrac{1}{2} m v_1^2 = 3 \\phi - \\phi = 2 \\phi$<br><br>For the second case, $E_2 = 7 \\phi$:<br><br>$\\dfrac{1}{2} m v_2^2 = 7 \\phi - \\phi = 6 \\phi$<br><br>Taking the ratio of the two equations:<br><br>$\\dfrac{v_2^2}{v_1^2} = \\dfrac{6 \\phi}{2 \\phi} = 3$<br><br>$v_2 = \\sqrt{3} v_1$<br><br>Substituting $v_1 = 4 \\times 10^6 \\mathrm{m/s}$:<br><br>$v_2 = 4 \\sqrt{3} \\times 10^6 \\mathrm{m/s}$<br><br>Answer: $4 \\sqrt{3} \\times 10^6 \\mathrm{~m} / \\mathrm{s}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be7bf9280d7f9932d7d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The work functions of Caesium (Cs), Potassium (K) and sodium (Na) are $2.14 \\mathrm{eV}, 2.30 \\mathrm{eV}$, and 2.75 eV respectively. If incident electromagnetic radiation has an incident energy of 2.41 eV , which of these photosensitive surfaces may emit photoelectrons?", "image": null}, "options": [{"id": "GMnBt", "text": "Both K and Cs", "image": null, "isCorrect": true}, {"id": "Fx5cl", "text": "Na only", "image": null, "isCorrect": false}, {"id": "Hqno3", "text": "K only", "image": null, "isCorrect": false}, {"id": "ia4o5", "text": "Both Cs and Na", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For photoelectric emission to take place, the energy of the incident electromagnetic radiation must be greater than or equal to the work function of the photosensitive surface ($E \\ge \\Phi$).<br><br>Given incident energy $E = 2.41 \\text{ eV}$.<br><br>Work function of Caesium (Cs) $\\Phi_{\\text{Cs}} = 2.14 \\text{ eV}$. Since $2.41 \\text{ eV} > 2.14 \\text{ eV}$, photoelectric emission will occur.<br><br>Work function of Potassium (K) $\\Phi_{\\text{K}} = 2.30 \\text{ eV}$. Since $2.41 \\text{ eV} > 2.30 \\text{ eV}$, photoelectric emission will occur.<br><br>Work function of Sodium (Na) $\\Phi_{\\text{Na}} = 2.75 \\text{ eV}$. Since $2.41 \\text{ eV} < 2.75 \\text{ eV}$, photoelectric emission will not occur.<br><br>Therefore, both K and Cs surfaces will emit photoelectrons.<br><br>Answer: Both K and Cs", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bdabf9280d7f9932d05", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The graph shows the variation of photocurrent with anode potential for four different radiations. Let $I_a, I_b, I_c$ and $I_d$ are intensities and $f_a, f_b, f_c$ and $f_d$ be the frequencies for the curves $a, b, c$ and $d$ respectively, then\n\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/avP6uSMiTbnuLgBSf8C1Gjyjz_OscoerhSv3eN7CrbI.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "qxOrP", "text": "$\\mathrm{f}_{\\mathrm{b}}>\\mathrm{f}_{\\mathrm{a}}, \\mathrm{f}_{\\mathrm{b}}=\\mathrm{f}_{\\mathrm{c}}, \\mathrm{I}_{\\mathrm{c}}=\\mathrm{I}_{\\mathrm{d}}$", "image": null, "isCorrect": true}, {"id": "eAYci", "text": "$\\mathrm{f}_{\\mathrm{b}}=\\mathrm{f}_{\\mathrm{a}}, \\mathrm{f}_{\\mathrm{b}}>\\mathrm{f}_{\\mathrm{c}}, \\mathrm{I}_{\\mathrm{c}}>\\mathrm{I}_{\\mathrm{d}}$", "image": null, "isCorrect": false}, {"id": "TVBVZ", "text": "$\\mathrm{f}_{\\mathrm{b}} < \\mathrm{f}_{\\mathrm{a}}, \\mathrm{f}_{\\mathrm{b}} < \\mathrm{f}_{\\mathrm{c}}, \\mathrm{I}_{\\mathrm{c}} < \\mathrm{I}_{\\mathrm{d}}$", "image": null, "isCorrect": false}, {"id": "0kSqZ", "text": "$\\mathrm{f}_{\\mathrm{b}} \\leqslant \\mathrm{f}_{\\mathrm{a}}, \\mathrm{f}_{\\mathrm{b}}>\\mathrm{f}_{\\mathrm{c}}, \\mathrm{I}_{\\mathrm{c}}=\\mathrm{I}_{\\mathrm{d}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The saturation photocurrent (the maximum constant value of current) depends on the intensity of the incident light. From the given graph, curves $c$ and $d$ reach the same saturation current level. This implies that the intensities of radiations $c$ and $d$ are equal, so $I_c = I_d$.<br><br>The stopping potential is the negative potential on the x-axis where the photocurrent becomes zero. The magnitude of the stopping potential is directly proportional to the frequency of the incident light ($eV_0 = hf - \\Phi$). A more negative stopping potential corresponds to a higher frequency.<br><br>Observing the x-intercepts of the curves:<br>Curve $a$ has the least negative stopping potential, meaning it has the lowest frequency $f_a$.<br>Curves $b$ and $c$ originate from the same point on the negative x-axis, indicating they have the same stopping potential. Therefore, their frequencies are equal, giving $f_b = f_c$.<br>Since the stopping potential of curve $b$ is more negative than that of curve $a$, its frequency is higher, so $f_b > f_a$.<br><br>Combining these observations, we get the relations: $f_b > f_a$, $f_b = f_c$, and $I_c = I_d$.<br><br>Answer: $\\mathrm{f}_{\\mathrm{b}}>\\mathrm{f}_{\\mathrm{a}}, \\mathrm{f}_{\\mathrm{b}}=\\mathrm{f}_{\\mathrm{c}}, \\mathrm{I}_{\\mathrm{c}}=\\mathrm{I}_{\\mathrm{d}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bc6bf9280d7f9932c4a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Light of incident frequency 3 times the threshold frequency is incident on a photosensitive material. If the incident frequency is made $\\left(\\frac{1}{4}\\right)^{\\text {th }}$ and intensity is tripled then the photoelectric current will", "image": null}, "options": [{"id": "26yct", "text": "increase", "image": null, "isCorrect": false}, {"id": "3wa5w", "text": "decrease", "image": null, "isCorrect": false}, {"id": "F8vvs", "text": "be $\\left(\\frac{1}{3}\\right)^{\\text {rd }}$", "image": null, "isCorrect": false}, {"id": "01325", "text": "be zero", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Initial incident frequency, $\\nu_1 = 3\\nu_0$, where $\\nu_0$ is the threshold frequency.<br><br>New incident frequency, $\\nu_2 = \\dfrac{1}{4}\\nu_1 = \\dfrac{1}{4}(3\\nu_0) = 0.75\\nu_0$.<br><br>Since the new incident frequency is less than the threshold frequency ($\\nu_2 < \\nu_0$), no photoelectric emission will take place.<br><br>Therefore, the photoelectric current will be zero, irrespective of the intensity of the incident light.<br><br>Answer: be zero", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bb5bf9280d7f9932bbd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If the frequency of incident light in a photoelectric experiment is doubled, then stopping potential will", "image": null}, "options": [{"id": "bkkPx", "text": "be doubled.", "image": null, "isCorrect": false}, {"id": "wA4ET", "text": "be halved.", "image": null, "isCorrect": false}, {"id": "GFyjB", "text": "become more than double.", "image": null, "isCorrect": true}, {"id": "saIzN", "text": "become less than double.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation, the stopping potential $V_1$ for an incident light of frequency $\\nu$ is given by<br><br>$e V_1 = h \\nu - \\Phi$<br><br>where $\\Phi$ is the work function of the metal.<br><br>When the frequency is doubled, the new stopping potential $V_2$ is given by<br><br>$e V_2 = h (2\\nu) - \\Phi$<br><br>$e V_2 = 2h\\nu - \\Phi$<br><br>Substituting $h\\nu = e V_1 + \\Phi$ into the equation, we get<br><br>$e V_2 = 2(e V_1 + \\Phi) - \\Phi$<br><br>$e V_2 = 2e V_1 + \\Phi$<br><br>$V_2 = 2V_1 + \\dfrac{\\Phi}{e}$<br><br>Since the work function $\\Phi$ is positive, $V_2 > 2V_1$.<br><br>Thus, the stopping potential becomes more than double.<br><br>Answer: become more than double.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba7bf9280d7f9932b4b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Sodium and copper have work functions $2.3 \\mathrm{~eV}$ and $4.5 \\mathrm{~eV}$ respectively. The ratio of threshold wavelength of sodium to that of copper is nearest to", "image": null}, "options": [{"id": "S4F3J", "text": "$1: 4$", "image": null, "isCorrect": false}, {"id": "hWFKN", "text": "$4 : 1$", "image": null, "isCorrect": false}, {"id": "vLyrm", "text": "$1 : 2$", "image": null, "isCorrect": false}, {"id": "pORJ4", "text": "$2: 1$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The work function $\\Phi$ and threshold wavelength $\\lambda_0$ are related by the equation:<br><br>$\\Phi = \\dfrac{hc}{\\lambda_0}$<br><br>This implies that the threshold wavelength is inversely proportional to the work function:<br><br>$\\lambda_0 \\propto \\dfrac{1}{\\Phi}$<br><br>The ratio of the threshold wavelength of sodium to that of copper is:<br><br>$\\dfrac{\\lambda_{0, Na}}{\\lambda_{0, Cu}} = \\dfrac{\\Phi_{Cu}}{\\Phi_{Na}}$<br><br>Substituting the given values:<br><br>$\\dfrac{\\lambda_{0, Na}}{\\lambda_{0, Cu}} = \\dfrac{4.5}{2.3} \\approx 1.96$<br><br>This value is nearest to $2$, so the ratio is approximately $2 : 1$.<br><br>Answer: $2: 1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba5bf9280d7f9932b31", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "When a metal surface is illuminated by light of wavelength $\\lambda_1$ and $\\lambda_2$, the maximum velocities of photoelectrons ejected are V and 2 V respectively. The work function of the metal is ( $h=$ Planck's constant, $c=$ velocity of light, $\\left.\\lambda_1>\\lambda_2\\right)$", "image": null}, "options": [{"id": "QOK8d", "text": "$\\frac{\\mathrm{hc}}{2 \\lambda_1 \\lambda_2}\\left(\\lambda_1-\\lambda_2\\right)$", "image": null, "isCorrect": false}, {"id": "x0UaM", "text": "$\\frac{\\mathrm{hc}}{\\lambda_1 \\lambda_2}\\left(\\lambda_1-\\lambda_2\\right)$", "image": null, "isCorrect": false}, {"id": "CV59X", "text": "$\\frac{\\mathrm{hc}}{\\lambda_1 \\lambda_2}\\left(\\lambda_1+\\lambda_2\\right)$", "image": null, "isCorrect": false}, {"id": "vcQxZ", "text": "$\\frac{\\mathrm{hc}}{3 \\lambda_1 \\lambda_2}\\left(4 \\lambda_2-\\lambda_1\\right)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation:<br><br>$K_{\\max} = \\dfrac{hc}{\\lambda} - \\Phi$<br><br>For wavelength $\\lambda_1$, the maximum kinetic energy is $\\dfrac{1}{2}mV^2$:<br><br>$\\dfrac{1}{2}mV^2 = \\dfrac{hc}{\\lambda_1} - \\Phi$<br><br>For wavelength $\\lambda_2$, the maximum kinetic energy is $\\dfrac{1}{2}m(2V)^2 = 4 \\left(\\dfrac{1}{2}mV^2\\right)$:<br><br>$4 \\left(\\dfrac{1}{2}mV^2\\right) = \\dfrac{hc}{\\lambda_2} - \\Phi$<br><br>Substituting the value of $\\dfrac{1}{2}mV^2$ from the first equation into the second equation:<br><br>$4 \\left( \\dfrac{hc}{\\lambda_1} - \\Phi \\right) = \\dfrac{hc}{\\lambda_2} - \\Phi$<br><br>$\\dfrac{4hc}{\\lambda_1} - 4\\Phi = \\dfrac{hc}{\\lambda_2} - \\Phi$<br><br>$3\\Phi = \\dfrac{4hc}{\\lambda_1} - \\dfrac{hc}{\\lambda_2}$<br><br>$3\\Phi = hc \\left( \\dfrac{4\\lambda_2 - \\lambda_1}{\\lambda_1 \\lambda_2} \\right)$<br><br>$\\Phi = \\dfrac{hc}{3 \\lambda_1 \\lambda_2} (4\\lambda_2 - \\lambda_1)$<br><br>Answer: $\\frac{\\mathrm{hc}}{3 \\lambda_1 \\lambda_2}\\left(4 \\lambda_2-\\lambda_1\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b95bf9280d7f9932a9a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Graph shows variation of stopping potential with frequency of incident radiation on a metal plate. The value of Planck's constant is [$\\mathrm{e}=$ charge on photoelectron]\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/c91cOp4tf8k3FF6cUxMMyaTR1uH-5JYRefJ5wI6qA7s.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "MO7zE", "text": "$\\frac{e\\left(V_2-V_1\\right)}{\\nu_1 \\nu_2}$", "image": null, "isCorrect": false}, {"id": "qwCbX", "text": "$\\frac{e V_1 V_2}{\\left(\\nu_2-\\nu_1\\right)}$", "image": null, "isCorrect": false}, {"id": "sSMsG", "text": "$\\frac{e\\left(V_2-V_1\\right)}{\\left(\\nu_2-\\nu_1\\right)}$", "image": null, "isCorrect": true}, {"id": "gugOI", "text": "$\\frac{e\\left(V_1 V_2\\right)}{\\nu_1 \\nu_2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation:<br><br>$eV = h\\nu - \\Phi$<br><br>where $V$ is the stopping potential, $\\nu$ is the frequency of incident radiation, $h$ is Planck's constant, and $\\Phi$ is the work function of the metal.<br><br>From the given graph, we have two points $(\\nu_1, V_1)$ and $(\\nu_2, V_2)$. Substituting these into the equation, we get:<br><br>$eV_1 = h\\nu_1 - \\Phi$<br><br>$eV_2 = h\\nu_2 - \\Phi$<br><br>Subtracting the first equation from the second, we obtain:<br><br>$eV_2 - eV_1 = h\\nu_2 - h\\nu_1$<br><br>$e(V_2 - V_1) = h(\\nu_2 - \\nu_1)$<br><br>Rearranging for Planck's constant $h$, we get:<br><br>$h = \\dfrac{e(V_2 - V_1)}{\\nu_2 - \\nu_1}$<br><br>Answer: $\\frac{e\\left(V_2-V_1\\right)}{\\left(\\nu_2-\\nu_1\\right)}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b84bf9280d7f99329f5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "For two different photosensitive materials having work function $\\phi$ and $2 \\phi$ respectively, are illuminated with light of sufficient energy to emit electrons. If the graph of stopping potential versus frequency is drawn, for these two different photosensitive materials, the ratio of slope of graph for these two materials is", "image": null}, "options": [{"id": "bGqYy", "text": "$1: 1$", "image": null, "isCorrect": true}, {"id": "g6Dls", "text": "$1: 2$", "image": null, "isCorrect": false}, {"id": "aZHAF", "text": "$1: 4$", "image": null, "isCorrect": false}, {"id": "2WqDA", "text": "$4: 1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation,<br><br>$eV_s = h\\nu - \\phi$<br><br>$V_s = \\dfrac{h}{e}\\nu - \\dfrac{\\phi}{e}$<br><br>Comparing this with the equation of a straight line $y = mx + c$, the slope of the stopping potential $V_s$ versus frequency $\\nu$ graph is given by $m = \\dfrac{h}{e}$.<br><
