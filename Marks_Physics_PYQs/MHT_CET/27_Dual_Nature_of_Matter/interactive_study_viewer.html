usCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213210aee93fa0796d663", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "When a metallic surface is illuminated with a radiation of wavelength ' $\\lambda$ ', the stopping potential is ' $V$ '. If' the same surface is illuminated with radiation of wavelength ' $3 \\lambda$ ', the stopping potential is \" $\\left(\\dfrac{\\mathrm{V}}{6}\\right)$ '. The threshold wavelength for the surface is", "image": null}, "options": [{"id": "WdG4J", "text": "$3 \\lambda$", "image": null, "isCorrect": false}, {"id": "fzQmW", "text": "$4 \\lambda$", "image": null, "isCorrect": false}, {"id": "uAtwq", "text": "$5 \\lambda$", "image": null, "isCorrect": true}, {"id": "8WfSY", "text": "$6 \\lambda$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using Einstein's photoelectric equation:<br><br>$eV = \\dfrac{hc}{\\lambda} - \\dfrac{hc}{\\lambda_0}$<br><br>For the first case:<br><br>$eV = \\dfrac{hc}{\\lambda} - \\dfrac{hc}{\\lambda_0}$<br><br>For the second case:<br><br>$\\dfrac{eV}{6} = \\dfrac{hc}{3\\lambda} - \\dfrac{hc}{\\lambda_0}$<br><br>Multiplying the second equation by $6$:<br><br>$eV = \\dfrac{2hc}{\\lambda} - \\dfrac{6hc}{\\lambda_0}$<br><br>Equating the two expressions for $eV$:<br><br>$\\dfrac{hc}{\\lambda} - \\dfrac{hc}{\\lambda_0} = \\dfrac{2hc}{\\lambda} - \\dfrac{6hc}{\\lambda_0}$<br><br>Rearranging the terms:<br><br>$\\dfrac{6hc}{\\lambda_0} - \\dfrac{hc}{\\lambda_0} = \\dfrac{2hc}{\\lambda} - \\dfrac{hc}{\\lambda}$<br><br>$\\dfrac{5hc}{\\lambda_0} = \\dfrac{hc}{\\lambda}$<br><br>$\\lambda_0 = 5\\lambda$<br><br>Answer: $5 \\lambda$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262540279619d9d8a33a5", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "An excited hydrogen atom emits a photon of wavelength ' $\\lambda$ ' in returning to ground state. The quantum number ' $n$ ' of the excited state is ( $\\mathrm{R}=$ Rydberg's constant)", "image": null}, "options": [{"id": "nU0zM", "text": "$\\sqrt{\\lambda \\cdot R(\\lambda R-1)}$", "image": null, "isCorrect": false}, {"id": "sS2kE", "text": "$\\sqrt{\\frac{\\lambda \\mathrm{R}}{(\\lambda \\mathrm{R}-1)}}$", "image": null, "isCorrect": true}, {"id": "p4FAF", "text": "$\\sqrt{\\frac{(\\lambda \\mathrm{R}-1)}{\\lambda \\mathrm{R}}}$", "image": null, "isCorrect": false}, {"id": "kcmG6", "text": "$\\sqrt{\\frac{1}{\\lambda \\mathrm{R}(\\lambda \\mathrm{R}-1)}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using Rydberg's formula\n$\\frac{1}{\\lambda}=\\mathrm{R}\\left[\\frac{1}{1^2}-\\frac{1}{\\mathrm{n}^2}\\right] \\quad \\ldots(\\because \\mathrm{m}=1)$\n$\\therefore \\quad \\frac{\\mathrm{n}^2-1}{\\mathrm{n}^2}=\\frac{1}{\\lambda \\mathrm{R}} \\Rightarrow 1-\\frac{1}{\\mathrm{n}^2}=\\frac{1}{\\lambda \\mathrm{R}} \\Rightarrow \\frac{\\lambda \\mathrm{R}-1}{\\lambda \\mathrm{R}}=\\frac{1}{\\mathrm{n}^2}$\n$\\therefore \\quad \\mathrm{n}=\\sqrt{\\frac{\\lambda \\mathrm{R}}{\\lambda \\mathrm{R}-1}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262530279619d9d8a33a0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "When radiations of wavelength ' $\\lambda$ ' is incident on a metallic surface the stopping potential required is 4.8 volt. If same surface is illuminated with radiations of double the wavelength, then required stopping potential becomes 1.6 volt. Then the value of threshold wavelength for the surface is", "image": null}, "options": [{"id": "IQ0gx", "text": "$2 \\lambda$", "image": null, "isCorrect": false}, {"id": "x27D3", "text": "$4 \\lambda$", "image": null, "isCorrect": false}, {"id": "6jJvc", "text": "$6 \\lambda$", "image": null, "isCorrect": true}, {"id": "9DaYr", "text": "$8 \\lambda$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We know, $\\mathrm{V}=\\frac{\\mathrm{hc}}{\\lambda}-\\phi_0$\n$\\Rightarrow 4.8=\\frac{\\mathrm{hc}}{\\lambda}-\\phi$   ....(i)\nGiven $\\lambda=2 \\lambda$\n$\\Rightarrow 1.6=\\frac{h c}{2 \\lambda}-\\phi$                 ....(ii)\n$\\therefore \\quad$ Dividing (i) by (ii),\n$3\\left(\\frac{\\mathrm{hc}}{2 \\lambda}-\\phi\\right)=\\frac{\\mathrm{hc}}{\\lambda}-\\phi$\n$3 \\frac{\\mathrm{hc}}{2 \\lambda}-3 \\phi=\\left(\\frac{\\mathrm{hc}}{\\lambda}-\\phi\\right)$\n$\\frac{\\mathrm{hc}}{2 \\lambda}=2 \\phi$\n$\\therefore \\quad$ Threshold wavelength is $4 \\lambda$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262440279619d9d8a3325", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "Light of frequency 1.5 times the threshold frequency is incident on photosensitive material. If the frequency is halved and intensity is doubled, the photocurrent becomes", "image": null}, "options": [{"id": "tOTFv", "text": "quadrupled", "image": null, "isCorrect": false}, {"id": "eJkbD", "text": "double", "image": null, "isCorrect": false}, {"id": "qjgih", "text": "half", "image": null, "isCorrect": false}, {"id": "xC65e", "text": "zero", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "\\begin{array}{|l|l|l|} \\hline Std.12 & Ch-5 & Subtopic-3.14 \\\\ \\hline \\end{array}", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262400279619d9d8a3308", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "When a light of wavelength $300 \\mathrm{~nm}$ fall on a photoelectric emitter, photo electrons are emitted. For another emitter light of wavelength $600 \\mathrm{~nm}$ is just sufficient for liberating photoelectrons. The ratio of the work function of the two emitters is", "image": null}, "options": [{"id": "PyhVc", "text": "$1: 2$", "image": null, "isCorrect": false}, {"id": "4Hth4", "text": "$2: 1$", "image": null, "isCorrect": true}, {"id": "SG2v2", "text": "$4: 1$", "image": null, "isCorrect": false}, {"id": "DMcUO", "text": "$1: 4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Work function $\\phi_0=\\frac{\\mathrm{hc}}{\\lambda_0}$\n$$\n\\begin{aligned}\n\\therefore \\quad \\phi_0 & \\propto \\frac{1}{\\lambda_0} \\\\\n\\frac{\\phi_{0_1}}{\\phi_{0_2}} & =\\frac{\\lambda_{0_2}}{\\lambda_{0_1}}=\\frac{600}{300}=\\frac{2}{1}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2621e0279619d9d8a31f3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "When light of wavelength $\\lambda$ is incident on a photosensitive surface the stopping potential is ' $\\mathrm{V}$ '. When light of wavelength $3 \\lambda$ is incident on same surface the stopping potential is $\\frac{\\mathrm{V}}{6}$. Then the threshold wavelength for the surface is", "image": null}, "options": [{"id": "mcRTR", "text": "$2 \\lambda$", "image": null, "isCorrect": false}, {"id": "NsC8U", "text": "$3 \\lambda$", "image": null, "isCorrect": false}, {"id": "06XtD", "text": "$4 \\lambda$", "image": null, "isCorrect": false}, {"id": "ngktA", "text": "$5 \\lambda$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\lambda_1=\\lambda,\\left(\\mathrm{V}_0\\right)_1=\\mathrm{V} \\\\\n& \\lambda_2=3 \\lambda,\\left(\\mathrm{V}_0\\right)_2=\\frac{\\mathrm{V}}{6}\n\\end{aligned}\n$$\nPhoto electric equation is given by $\\mathrm{eV}_0=\\mathrm{hc}\\left(\\frac{1}{\\lambda}-\\frac{1}{\\lambda_0}\\right)....(i)$\nIn first case,\n$$\n\\mathrm{eV}=\\mathrm{hc}\\left(\\frac{1}{\\lambda}-\\frac{1}{\\lambda_0}\\right)\n$$\nFor second case,\n$$\n\\frac{\\mathrm{eV}}{6}=\\mathrm{hc}\\left(\\frac{1}{3 \\lambda}-\\frac{1}{\\lambda_0}\\right).....(ii)\n$$\nDividing equation (i) by equation (ii),\n$$\n\\begin{aligned}\n6 & =\\frac{\\frac{1}{\\lambda}-\\frac{1}{\\lambda_0}}{\\frac{1}{3 \\lambda}-\\frac{1}{\\lambda_0}}=\\frac{3 \\lambda_0-\\lambda}{\\lambda_0-3 \\lambda} \\\\\n\\therefore \\quad \\lambda_0 & =5 \\lambda\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2621c0279619d9d8a31dc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "Radiations of two photons having energies twice and five times the work function of metal are incident successively on metal surface. The ratio of the maximum velocity of photo electrons emitted in the two cases will be", "image": null}, "options": [{"id": "cmw9W", "text": "$1: 1$", "image": null, "isCorrect": false}, {"id": "hqLSN", "text": "$1: 2$", "image": null, "isCorrect": false}, {"id": "1wnQl", "text": "$1: 3$", "image": null, "isCorrect": false}, {"id": "MFuX4", "text": "$1: 4$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\frac{K_1 E_{\\max }}{K \\cdot E_{\\operatorname{man} 2}}=\\frac{E_1-\\phi_0}{E_2-\\phi_0}=\\frac{2 \\phi_0-\\phi_0}{5 \\phi_0-\\phi_a} \\\\ & \\therefore \\quad \\frac{K \\cdot E_{\\max }}{K \\cdot E_{\\max 2}}=\\frac{1}{4} \\\\ & \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2620c0279619d9d8a3164", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "A metal surface of work function $1.13 \\mathrm{eV}$ is irradiated with light of wavelength $310 \\mathrm{~nm}$. The retarding potential required to stop the escape of photoelectrons is [Take $\\frac{\\mathrm{hc}}{}=1240 \\times 10^{-9} \\mathrm{SI}$ units]", "image": null}, "options": [{"id": "sN9eE", "text": "$1 \\cdot 13 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "YHgzC", "text": "$2.87 \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "IzOtO", "text": "$3.97 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "GbIzs", "text": "$4.23 \\mathrm{~V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Energy of incident light:\n$\\begin{aligned}\nE & =\\frac{h c}{\\mathrm{e} \\lambda} \\\\\n& =\\frac{1240 \\times 10^{-9}}{310 \\times 10^{-9}} \\\\\n& =4 \\mathrm{ev}\n\\end{aligned}$\nStopping potential $\\mathrm{V}_0=\\frac{\\mathrm{hc}}{\\mathrm{e} \\lambda}-\\frac{\\phi_0}{\\mathrm{e}}$\n$\\mathrm{V}_0=4-1.13=2.87 \\mathrm{~V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2620b0279619d9d8a3156", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "When a metallic surface is illuminated with radiation of wavelength ' $\\lambda$ ', the stopping potential is ' $\\mathrm{V}$ '. If the same surface is illuminated with radiation of wavelength ' $2 \\lambda$ ', the stopping potential is ' $\\left(\\frac{\\mathrm{v}}{4}\\right)$,. The threshold wavelength for the metallic surface is", "image": null}, "options": [{"id": "ZxSRM", "text": "$\\frac{5}{2} \\lambda$", "image": null, "isCorrect": false}, {"id": "Jy3Z5", "text": "$3 \\lambda$", "image": null, "isCorrect": true}, {"id": "MUM7B", "text": "$4 \\lambda$", "image": null, "isCorrect": false}, {"id": "wUj6j", "text": "$5 \\lambda$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For stopping potential $\\mathrm{V}, \\mathrm{eV}=\\frac{\\mathrm{hc}}{\\lambda}-\\frac{\\mathrm{hc}}{\\lambda_0}$\nFor stopping potential $\\frac{\\mathrm{V}}{4}, \\frac{\\mathrm{eV}}{4}=\\frac{\\mathrm{hc}}{2 \\lambda}-\\frac{\\mathrm{hc}}{\\lambda_0}$ \nTaking the ratio, we get\n$\\begin{aligned}\n& \\quad 4=\\frac{\\left(\\frac{1}{\\lambda}-\\frac{1}{\\lambda_0}\\right)}{\\frac{1}{2 \\lambda}-\\frac{1}{\\lambda_0}} \\\\\n& 4\\left(\\frac{1}{2 \\lambda}-\\frac{1}{\\lambda_0}\\right)=\\frac{1}{\\lambda}-\\frac{1}{\\lambda_0} \\\\\n& \\left(\\frac{2}{\\lambda}-\\frac{4}{\\lambda_0}\\right)=\\frac{1}{\\lambda}-\\frac{1}{\\lambda_0} \\\\\n& \\left(\\frac{2}{\\lambda}-\\frac{1}{\\lambda}\\right)=\\frac{1}{\\lambda_0}+\\frac{4}{\\lambda_0} \\\\\n& \\quad\\left(\\frac{1}{\\lambda}\\right)=\\frac{3}{\\lambda_0} \\\\\n& \\therefore \\quad \\lambda_0=3 \\lambda\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261f40279619d9d8a30a6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "The maximum kinetic energies of photoelectrons emitted are $K_1$ and $K_2$ when lights of wavelengths $\\lambda_1$ and $\\lambda_2$ are incident on a metallic surface. If $\\lambda_1=3 \\lambda_2$ then", "image": null}, "options": [{"id": "lIusM", "text": "$\\mathrm{K}_1=\\frac{\\mathrm{K}_2}{3}$", "image": null, "isCorrect": false}, {"id": "X0alz", "text": "$\\mathrm{K}_1 < \\frac{\\mathrm{K}_2}{3}$", "image": null, "isCorrect": true}, {"id": "yzUWt", "text": "$\\mathrm{K}_1=3 \\mathrm{~K}_2$", "image": null, "isCorrect": false}, {"id": "OcGwP", "text": "$3 \\mathrm{~K}_1=2 \\mathrm{~K}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Kinetic energy of the photoelectrons\n$$\n\\mathrm{K}=\\frac{\\mathrm{hc}}{\\lambda}-\\phi\n$$\n$\\therefore \\quad$ For wavelength $\\lambda_1$,\n$$\n\\mathrm{K}_1=\\frac{\\mathrm{hc}}{\\lambda_1}-\\phi\n$$\n$\\therefore \\quad$ For wavelength $\\lambda_1$,\n$$\n\\mathrm{K}_2=\\frac{\\mathrm{hc}}{\\lambda_2}-\\phi\n$$\n\nSubtracting equation (i) from equation (ii),\n$$\n\\begin{aligned}\n& \\mathrm{K}_2-\\mathrm{K}_1=\\frac{\\mathrm{hc}}{\\lambda_2}-\\phi-\\frac{\\mathrm{hc}}{\\lambda_1}+\\phi \\\\\n& \\mathrm{K}_2-\\mathrm{K}_1=\\frac{\\mathrm{hc}}{\\lambda_2}-\\frac{\\mathrm{hc}}{3 \\lambda_2} \\\\\n& \\mathrm{~K}_2-\\mathrm{K}_1=\\frac{2}{3} \\frac{\\mathrm{hc}}{\\lambda_2} \\\\\n& \\frac{\\mathrm{hc}}{\\lambda_2}=\\frac{3}{2}\\left(\\mathrm{~K}_2-\\mathrm{K}_1\\right)\n\\end{aligned}\n$$\n\nSubstituting equation (iii) in equation (ii),\n$$\n\\begin{aligned}\n& \\mathrm{K}_2=\\frac{3}{2}\\left(\\mathrm{~K}_2-\\mathrm{K}_1\\right)-\\phi \\\\\n& 2 \\mathrm{~K}_2=3 \\mathrm{~K}_2-3 \\mathrm{~K}_1-2 \\phi \\\\\n& \\mathrm{K}_2-3 \\mathrm{~K}_1=2 \\phi \\\\\n& \\mathrm{As}, \\phi>0 \\\\\n& \\mathrm{~K}_2-3 \\mathrm{~K}_1>0 \\\\\n& \\mathrm{~K}_1 < \\frac{\\mathrm{K}_2}{3}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261e50279619d9d8a3033", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "The maximum kinetic energy of the photoelectrons varies", "image": null}, "options": [{"id": "wt4Tp", "text": "inversely with the intensity of incident radiation and is independent of its frequency.", "image": null, "isCorrect": false}, {"id": "boFZ0", "text": "inversely with the frequency of incident radiation and is independent on its intensity.", "image": null, "isCorrect": false}, {"id": "EUPXw", "text": "linearly with the frequency of incident radiation and depends on its intensity", "image": null, "isCorrect": false}, {"id": "jZ2R7", "text": "linearly with the frequency of incident radiation and is independent of its intensity.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Std.12 | Ch-14 | Subtopic-14.2", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261d00279619d9d8a2f8f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "Maximum kinetic energy of photon is ' $E$ ' when wavelength of incident radiation is ' $\\lambda$ '. If wavelength of incident radiations is reduced to $\\frac{\\lambda}{3}$ then energy of photon becomes four times. Then work function of the metal is", "image": null}, "options": [{"id": "Kc9yu", "text": "$\\frac{3 \\mathrm{hc}}{\\lambda}$", "image": null, "isCorrect": false}, {"id": "cGzKe", "text": "$\\frac{\\mathrm{hc}}{3 \\lambda}$", "image": null, "isCorrect": true}, {"id": "KmUhI", "text": "$\\frac{\\mathrm{hc}}{\\lambda}$", "image": null, "isCorrect": false}, {"id": "tP8ho", "text": "$\\frac{\\mathrm{hc}}{2 \\lambda}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{E}=\\frac{\\mathrm{hc}}{\\lambda}-\\phi_0$.... (i)\nGiven: $\\lambda=\\frac{\\lambda}{3}$ and $\\mathrm{E}=4 \\mathrm{E}$\n$\\begin{aligned}\n4 \\mathrm{E} & =\\frac{\\mathrm{hc}}{\\lambda / 3}-\\phi_0 .... (ii)\\\\\n& =\\frac{3 \\mathrm{hc}}{\\lambda}-\\phi_0 \\\\\n4\\left(\\frac{\\mathrm{hc}}{\\lambda}-\\phi_0\\right) & =\\frac{3 \\mathrm{hc}}{\\lambda}-\\phi_0 ....(From (i))\n\\\\\n\\frac{4 h \\mathrm{c}}{\\lambda}-4 \\phi_0 & =\\frac{3 \\mathrm{hc}}{\\lambda}-\\phi_0 \\\\\n\\frac{h \\mathrm{c}}{\\lambda} & =3 \\phi_0 \\\\\n\\phi_0 & =\\frac{\\mathrm{hc}}{3 \\lambda}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261be0279619d9d8a2f02", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "When a certain metal surface is illuminated with light of frequency $v$, the stopping potential for photoelectric current is $\\mathrm{V}_0$. When the same surface is illuminated by light of frequency $\\frac{v}{2}$, the stopping potential is $\\frac{\\mathrm{V}_0}{4}$, the threshold frequency of photoelectric emission is", "image": null}, "options": [{"id": "1aaNi", "text": "$\\frac{v}{6}$", "image": null, "isCorrect": false}, {"id": "zsiL8", "text": "$\\frac{v}{3}$", "image": null, "isCorrect": true}, {"id": "mofXW", "text": "$\\frac{2 v}{3}$", "image": null, "isCorrect": false}, {"id": "9tO7e", "text": "$\\frac{4 v}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n& \\mathrm{eV}_0=h v-h v_0 ... (i)\\\\ \n& \\frac{\\mathrm{eV}_0}{4}=\\frac{h v}{2}-h v_0 ... (ii)\n\\end{aligned}$\nDividing equation (i) by equation (ii),\n$\\begin{array}{ll} \n& 4=\\frac{v-v_0}{\\frac{v}{2}-v_0} \\\\\n\\therefore & 2 v-4 v_0=v-v_0 \\\\\n\\therefore & 3 v_0=v \\\\\n\\therefore & v_0=\\frac{v}{3}\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261bd0279619d9d8a2ef3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "When photons of energies twice and thrice the work function of a metal are incident on the metal surface one after other, the maximum velocities of the photoelectrons emitted in the two cases are $v_1$ and $v_2$ respectively. The ratio $v_1: v_2$ is", "image": null}, "options": [{"id": "mBmXW", "text": "$\\sqrt{2}: 1$", "image": null, "isCorrect": false}, {"id": "mcfCN", "text": "$\\sqrt{3}: 1$", "image": null, "isCorrect": false}, {"id": "oGvcI", "text": "$\\sqrt{3}: \\sqrt{2}$", "image": null, "isCorrect": false}, {"id": "zW0Yo", "text": "$1: \\sqrt{2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{array}{ll} & \\mathrm{K} \\cdot \\mathrm{E}_{\\max }=\\mathrm{h} v-\\phi_0 \\\\ & \\text { Given, } \\\\ & \\mathrm{E}_1=2 \\phi_0 \\text { and } \\mathrm{E}_2=3 \\phi_0 \\\\ \\Rightarrow & \\mathrm{K} \\cdot \\mathrm{E}_1=2 \\phi_0-\\phi_0=\\phi_0 \\\\ \\Rightarrow & \\mathrm{K} \\cdot \\mathrm{E}_2=3 \\phi_0-\\phi_0=2 \\phi_0 \\\\ & \\text { but, } \\mathrm{K} \\cdot \\mathrm{E}_1=\\frac{1}{2} \\mathrm{mv}_1^2 \\text { and } \\mathrm{K} \\cdot \\mathrm{E}_2=\\frac{1}{2} \\mathrm{mv}_2^2 \\\\ \\therefore \\quad & \\frac{\\mathrm{K} \\cdot \\mathrm{E}_1}{\\mathrm{~K} \\cdot \\mathrm{E}_2}=\\frac{\\mathrm{v}_1^2}{\\mathrm{v}_2^2}=\\frac{1}{2} \\\\ \\therefore \\quad & \\frac{\\mathrm{v}_1}{\\mathrm{v}_2}=\\frac{1}{\\sqrt{2}}\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261970279619d9d8a2dca", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "In photoelectric effect, the kinetic energy of electron emitted from the metal surface depends upon", "image": null}, "options": [{"id": "m08Or", "text": "intensity of incident light", "image": null, "isCorrect": false}, {"id": "fYWez", "text": "both intensity and velocity of incident light", "image": null, "isCorrect": false}, {"id": "HHWXl", "text": "frequency of incident light", "image": null, "isCorrect": true}, {"id": "APCQd", "text": "velocity of incident light", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In photoelectric effect, the kinetic energy of electron emitted from the metal surface depends upon frequency of incident light.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261710279619d9d8a2c9b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "Threshold frequency for a metal is $15 \\times 10^{14} \\mathrm{~Hz}$. The light of wavelength $6000 \\AA$ falls on the metal surface. Then photoelectrons\n[velocity of light in air, $c=3 \\times 10^8 \\mathrm{~m} / \\mathrm{s}$ ]", "image": null}, "options": [{"id": "Bab47", "text": "come out with zero velocity.", "image": null, "isCorrect": false}, {"id": "kvzqN", "text": "come out with velocity $3 \\times 10^6 \\mathrm{~m} / \\mathrm{sa}$", "image": null, "isCorrect": false}, {"id": "jIcAy", "text": "will not be emitted", "image": null, "isCorrect": true}, {"id": "MyTM9", "text": "are emitted with velocity $c$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Frequency of light of wavelength $\\lambda=6000 \\mathrm{~A}^0$ is\n$f=\\frac{c}{\\lambda}=\\frac{3 \\times 10^8}{6000 \\times 10^{-10}} \\mathrm{~Hz}=5 \\times 10^{14} \\mathrm{~Hz}$\nwhich is less than the given threshold frequency. Hence, no photoelectric emission takes place.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261700279619d9d8a2c94", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "The maximum velocity of the photoelectron emitted by the metal surface is $v$, charge and mass of the photoelectron are denoted by $e$ and $m$ respectively. The stopping potential in volt is", "image": null}, "options": [{"id": "y0aga", "text": "$\\frac{v^2 e}{m}$", "image": null, "isCorrect": false}, {"id": "pojVE", "text": "$\\frac{v^2 m}{2 e}$", "image": null, "isCorrect": true}, {"id": "ZYBA5", "text": "$\\frac{v^2 m}{e}$", "image": null, "isCorrect": false}, {"id": "W0BEm", "text": "$\\frac{v^2 e}{2 m}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have, potential energy to stop the fastest moving electrons is equal to the kinetic energy:\n$\\frac{1}{2} m v^2=e V$\n$V$ is the stopping potential\n$\\therefore V=\\frac{v^2 m}{2 e}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261620279619d9d8a2c1d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "Photoelectric emission takes place from a certain metal at threshold frequency ' $v$ '. If the radiation of frequency ' $2 v$ ' is incident on the metal plate, the maximum velocity of the emitted photoelectron will be ( $\\mathrm{m}=$ mass of electron, $\\mathrm{h}$ = Planck's constant)", "image": null}, "options": [{"id": "fE6w8", "text": "$\\sqrt{\\frac{2 \\mathrm{hv}}{\\mathrm{m}}}$", "image": null, "isCorrect": true}, {"id": "8Jxbq", "text": "$\\sqrt{\\frac{\\mathrm{hv}}{2 \\mathrm{~m}}}$", "image": null, "isCorrect": false}, {"id": "6fcBw", "text": "$\\sqrt{\\frac{\\mathrm{hv}}{3 \\mathrm{~m}}}$", "image": null, "isCorrect": false}, {"id": "Vknsh", "text": "$\\sqrt{\\frac{\\mathrm{hv}}{\\mathrm{m}}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Einstein's photo electric equation\nConcept: The maximum kinetic energy of photoelectron is written:\n$\\frac{1}{2} \\mathrm{mv}_{\\mathrm{m}}^2 \\leq \\mathrm{hv}-\\theta$\nThe threshold frequency is given by\n$\\mathrm{hv}_{\\mathrm{c}}=\\theta$\nGiven, $\\mathrm{v}_{\\mathrm{c}}=\\mathrm{v}$, now for radiation with frequency $2 \\mathrm{v}$\n$\\begin{aligned}\n& \\frac{1}{2} \\mathrm{mv}_{\\mathrm{m}}^2 \\leq \\mathrm{h}(2 \\mathrm{v}-\\mathrm{h}(\\mathrm{v})) \\\\\n& \\Rightarrow \\mathrm{v}_{\\mathrm{m}} \\sqrt{\\frac{2 \\mathrm{hv}}{\\mathrm{m}}}\n\\end{aligned}$\nOption (A) is correct.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2614f0279619d9d8a2b88", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "In a photoelectric emission experiment, the stopping potential for a given metal is $V$ volt, when radiation of wavelength $\\lambda$ is used. If radiation of wavelength $2 \\lambda$ is used with the same metal, then the stopping potential (in volt) will be\n$\\text { [ } c \\text { = velocity of light, } e=\\text { charge on electron, } h=\\text { Planck's constant }]$", "image": null}, "options": [{"id": "nWi8R", "text": "$V-\\frac{h c}{2 e \\lambda}$", "image": null, "isCorrect": true}, {"id": "PWZL9", "text": "$V+\\frac{h c}{2 e \\lambda}$", "image": null, "isCorrect": false}, {"id": "mGazl", "text": "$\\frac{V}{2}$", "image": null, "isCorrect": false}, {"id": "LLcXR", "text": "$2 V$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Einstein's equation of photo-electric effect:\n$e V=\\frac{h c}{\\lambda}-\\Phi---(1)$\nwhere, stopping potential is $V, \\lambda$ the incident wavelength and $\\Phi$ the work-function of the metal.\n\nNow, if the incident wavelength is switched to $2 \\lambda$, the stopping potential can be written as\n$e V^{\\prime}=\\frac{h c}{2 \\lambda}-\\Phi---(2)$\nOn subtracting equation (1) and (2), and subsequently rearranging:\n$V^{\\prime}=V-\\frac{h c}{2 \\lambda e}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2613a0279619d9d8a2ad9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "Energy of photon whose frequency is $10^{12} \\mathrm{MHz}$ is\n[Planck's constant, $\\mathrm{h}=6.63 \\times 10^{-34} \\mathrm{Js}, \\mathrm{e}=1.6 \\times 10^{-19} \\mathrm{C}$ ]", "image": null}, "options": [{"id": "JyDVI", "text": "$4.14 \\times 10^3 \\mathrm{keV}$", "image": null, "isCorrect": false}, {"id": "iXcdT", "text": "$4.14 \\times 10^2 \\mathrm{eV}$", "image": null, "isCorrect": false}, {"id": "l1lK0", "text": "$4.14 \\times 10^3 \\mathrm{MeV}$", "image": null, "isCorrect": false}, {"id": "18jui", "text": "$4.14 \\times 10^3 \\mathrm{eV}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Using plank energy quanta vs frequency relation:\n$E(e V)=\\frac{h v}{e}=\\frac{6.63 \\times 10^{-34} \\times 10^{12} \\times 10^6}{1.6 \\times 10^{-19}}=4.14 \\times 10^3 \\mathrm{eV}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2613a0279619d9d8a2ad3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "The work functions for metals A, B and C are $1.92 \\mathrm{eV}, 2.0 \\mathrm{eV}$ and $5 \\mathrm{eV}$ respectively the metal (s) which will emit photoelectrons for incident radiation of wavelength $4100 \\mathrm{~A}$ is /are $\\left[\\mathrm{h}=6.63 \\times 10^{-19} \\mathrm{~J}, \\mathrm{e}=1.6 \\times 10^{-19} \\mathrm{C}, \\mathrm{c}=3 \\times 10^8 \\mathrm{~m} / \\mathrm{s}\\right]$", "image": null}, "options": [{"id": "IDrVl", "text": "Only C", "image": null, "isCorrect": false}, {"id": "uxnlE", "text": "B and C", "image": null, "isCorrect": false}, {"id": "ZXk48", "text": "Only A", "image": null, "isCorrect": false}, {"id": "0md9B", "text": "$A$ and $B$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Energy of electron with an associated wavelength of $4100 \\AA$ is:\n$\\Rightarrow \\frac{\\mathrm{hc}}{\\lambda}=4.845 \\times 10^{-19} \\mathrm{~J}=3.024 \\mathrm{eV}$\nThis incident electron would emit photon from metal whose work potential is less than its energy.\nThus, it would emit photons from metals A and B.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261260279619d9d8a2a32", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "When a certain metal surface is illuminated with light of frequency $v$, the stopping potential for the photoelectric current is $V_s$. When the same surface is illuminated by a light of frequency $\\frac{v}{2}$, the stopping potential is $V_s / 4$. The threshold frequency of photoelectric emission is", "image": null}, "options": [{"id": "jp8IH", "text": "$\\frac{4 v}{3}$", "image": null, "isCorrect": false}, {"id": "JuDeY", "text": "$\\frac{5 v}{3}$", "image": null, "isCorrect": false}, {"id": "iQubS", "text": "$\\frac{v}{3}$", "image": null, "isCorrect": true}, {"id": "rPXeb", "text": "$\\frac{v}{5}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Stopping potential is the energy required to stop the moving electrons after photoelectric emission. Hence it must be equal to the maximum kinetic energy of the emitted electron.\nIncident energy $=$ Threshold energy + Kinetic energy\nGiven:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/mcDILDqisyA32xNsD4mMgIF1pCaPjA-JlvLEJNRCtbU.original.fullsize.png\">\nMultiply equation (2) by 4 and substract equation (1) from it to obtain:\n$$\nv_0=\\frac{v}{3}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261150279619d9d8a29a7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}], "question": {"text": "In photoelectric experiment the stopping potential was measured to be $V_1$ and $V_2$ volt with incident light of wavelength $\\lambda$ and $\\frac{\\lambda}{2}$ respectively the value of $V_2$ is [ $(\\phi=$ work function, $e=$ electronic charge $]$", "image": null}, "options": [{"id": "0UyuM", "text": "$V_1+\\frac{2 \\phi}{e}$", "image": null, "isCorrect": false}, {"id": "jRGSk", "text": "$2 V_1+\\frac{\\phi}{e}$", "image": null, "isCorrect": true}, {"id": "owBpl", "text": "$2 V_1-\\frac{\\phi}{e}$", "image": null, "isCorrect": false}, {"id": "wLxEx", "text": "$V_1-\\frac{2 \\phi}{e}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Einstein's' photoelectric equation dictates:\n$e V=\\frac{h c}{\\lambda}-\\phi$\nFor incident wavelength $\\lambda$ :\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/5c5b80eSwrtUxWcIIhjJPIHmso8QkwFC4YG7eFTG7hE.original.fullsize.png\">\nFor incident wavelength $\\frac{\\lambda}{2}$ :\n$\\frac{h c}{\\lambda / 2}=\\phi+e V_2$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/-50Un08UtxI-m6nX-02HPF6G72hDjlrofnpi1hot7-Y.original.fullsize.png\">\nOn subtracting equation (2) and (1)\n$\\begin{aligned} & \\frac{2}{1}=\\frac{\\phi+e V_2}{\\phi+e V_1} \\\\ & \\Rightarrow 2 \\phi+2 e V_1=\\phi-e V_2 \\\\ & \\Rightarrow V_2=\\frac{\\phi}{e}+2 V_1\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261020279619d9d8a2915", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "In the case of photoelectric emission from a certain metal, the cutoff frequency is $v$. If radiation of frequency $2 v$ is incident on the metal plate, the maximum possible velocity of the emitted electrons will be ( $m=$ mass of electron)", "image": null}, "options": [{"id": "T9x9P", "text": "$2 \\sqrt{\\frac{h v}{m}}$", "image": null, "isCorrect": false}, {"id": "G8qfy", "text": "$\\sqrt{\\frac{h v}{2 m}}$", "image": null, "isCorrect": false}, {"id": "2hCAQ", "text": "$\\sqrt{\\frac{2 h v}{m}}$", "image": null, "isCorrect": true}, {"id": "37nL1", "text": "$\\sqrt{\\frac{h v}{m}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$K \\cdot E .=E-\\phi$\n$\\frac{1}{2} m v_{\\max }^2=h(2 v)-h v$\n$v_{\\max }=\\sqrt{\\frac{2 h v}{m}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260f30279619d9d8a289a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}], "question": {"text": "Light of two different frequencies whose photons have energies $1.3 \\mathrm{eV}$ and $2.8 \\mathrm{eV}$ respectively, successfully illuminate a metallic surface whose work function is $0.8 \\mathrm{eV}$. The ratio of maximum speeds of emitted electrons will be", "image": null}, "options": [{"id": "7dlAt", "text": "$1: 4$", "image": null, "isCorrect": false}, {"id": "G7zGU", "text": "$1: 2$", "image": null, "isCorrect": true}, {"id": "0v3IL", "text": "$1: 3$", "image": null, "isCorrect": false}, {"id": "KfhTD", "text": "1:5", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For maximum speed of the photo electrons, $\\frac{1}{2} m v^2=E_{\\mathrm{P}}-\\phi$ where $\\phi=0.8 \\mathrm{eV}$ is the work function of the metal. Energy of photon $E_1=1.3 \\mathrm{eV}$\n$$\n\\therefore \\frac{1}{2} m v_1^2=1.3-0.8 \\mathrm{eV}\n$$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/vTrGptbyJqvpSWSxPvBD0zTTJ0aQFL4bc952lhOVhgc.original.fullsize.png\">\nRatio of maximum speeds of the electrons can obtained by taking ratio of equation (1) and (2),\n$\\therefore \\frac{v_1^2}{v_2^2}=\\frac{0.5}{2}=\\frac{1}{4}$\nOr, $\\frac{v_1}{v_2}=\\frac{1}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260f20279619d9d8a2895", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}], "question": {"text": "Following graph shown the variation of stopping potential corresponding to the frequency of incident radiation $(v)$ for a given metal. The correct variation is shown in graph [ $v_0=$ threshold frequency]\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/4g-izUxkIBB-jlQwV6Vml0vQbN8gwixopBcyojfVs0s.original.fullsize.png\">", "image": null}, "options": [{"id": "dYRsh", "text": "(C)", "image": null, "isCorrect": false}, {"id": "LgLRO", "text": "(B)", "image": null, "isCorrect": false}, {"id": "9CfNk", "text": "(A)", "image": null, "isCorrect": true}, {"id": "egVtt", "text": "(D)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Concept: Stopping potential $V$ is related to the maximum kinetic energy $K_{\\max }$ of the photoelectrons, via Einstien's photo-electric effect relation:\n$e V=K_{\\max }=h v-h v_0$\nTherefore,\n$V=\\left(\\frac{h}{e}\\right) v-\\left(\\frac{h}{e}\\right) v_0$\nTherefore, $V$ vs $v$ is straighline with positive slope and at $v=v_0$ the stopping potential is zero.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260e00279619d9d8a2805", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}], "question": {"text": "A photon of energy ' $E$ ' ejects photoelectrons from a metal surface whose work function is $W_0$. If this electron enters into a uniform magnetic field with induction ' $B$ ' in a direction perpendicular to the field and describes a circular path of radius ' $r$ ', then the radius is given by", "image": null}, "options": [{"id": "D2IHA", "text": "$\\sqrt{\\frac{2 e\\left(E-W_0\\right)}{m B}}$", "image": null, "isCorrect": false}, {"id": "2JQeZ", "text": "$\\frac{\\sqrt{2\\left(E-W_0\\right) m}}{e B}$", "image": null, "isCorrect": true}, {"id": "3cUdo", "text": "$\\sqrt{\\frac{2 m\\left(E-W_0\\right)}{m B}}$", "image": null, "isCorrect": false}, {"id": "B3xrj", "text": "$\\sqrt{2 m\\left(E-W_0\\right) e B}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Concept: Photoelectric effect and the motion of charge in a direction perpendicular to the magnetic field`\nThe maximum kinetic energy $K=\\frac{m v^2}{2}$ of a photo-electron is given by,'\n$K=E-W_0$\nwhere, $E$ is the energy of incident photon and $W_0$ is the work function of the metal.\nTherefore, the velocity of the photoelectron is: $v=\\sqrt{\\frac{2\\left(E-W_0\\right)}{m}}$\nThe photoelectron undergoes uniform circular motion as its velocity is perpendicular to the magnetic field. On balancing magnetic force on moving charge with centrifugal force:\n$q v B=\\frac{m v^2}{r}$\nTherefore, $r=\\frac{m v}{B q}=\\frac{\\sqrt{2\\left(E-W_0\\right) m}}{e B}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260dc0279619d9d8a27e7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}], "question": {"text": "A photoelectric surface is illuminated successively by monochromatic light of wavelength ' $(\\lambda)$ ' and ' $\\left(\\frac{\\lambda}{2}\\right)$. If the maximum kinetic energy of the emitted photoelectrons in the first case is one-third that in the second case, the work function of the surface of the material is ( $\\mathrm{c}=$ speed of light, $\\mathrm{h}=$ Planck's constant.)", "image": null}, "options": [{"id": "X9fKF", "text": "$\\frac{2 \\mathrm{hc}}{\\lambda}$", "image": null, "isCorrect": false}, {"id": "dHgDT", "text": "$\\frac{\\mathrm{hc}}{2 \\lambda}$", "image": null, "isCorrect": true}, {"id": "R44wT", "text": "$\\frac{\\text { hc }}{\\lambda}$", "image": null, "isCorrect": false}, {"id": "RjZXB", "text": "$\\frac{\\text { hc }}{3 \\lambda}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The correct option is (B).\nConcept: Einstien's Photoelectric effect theory\nThe maximum kinetic energy $\\mathrm{K}$ of the photoelectric electrons is related to the incident wavelength $\\lambda$ and work function $\\phi$ of the metal as follows:\n$\\mathrm{K}=\\frac{\\mathrm{hc}}{\\lambda}-\\phi$\nFor the incident wavelength $\\lambda$, the equation is $\\mathrm{K}=\\frac{\\mathrm{hc}}{\\lambda}-\\phi$\nAnd for the incident wavelength $\\frac{\\lambda}{2}$, the equation is $3 K=\\frac{\\mathrm{hc}}{\\frac{\\lambda}{2}}-\\phi$\nTaking the ratio of two equations:\n$\\frac{1}{3}=\\frac{\\left(\\frac{\\mathrm{hc}}{\\lambda}-\\phi\\right)}{\\left(\\frac{\\mathrm{hc}}{\\frac{\\lambda}{2}}-\\phi\\right)}$\nOn solving, we get $\\phi=\\frac{\\mathrm{hc}}{2 \\lambda}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260cd0279619d9d8a276e", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "In a photoelectric experiment, a graph of maximum kinetic energy $\\left(\\mathrm{KE}_{\\max }\\right)$ against the frequency of incident radiation $(v)$ is plotted. If $\\mathrm{A}$ and $\\mathrm{B}$ are the intercepts on the $\\mathrm{X}$ and $\\mathrm{Y}$ axis respectively the Planck's constant is given by", "image": null}, "options": [{"id": "J1wRr", "text": "A+B", "image": null, "isCorrect": false}, {"id": "INAIO", "text": "$\\frac{\\mathrm{B}}{\\mathrm{A}}$", "image": null, "isCorrect": true}, {"id": "ERNpK", "text": "$A \\times B$", "image": null, "isCorrect": false}, {"id": "8pEpx", "text": "$\\frac{\\mathrm{A}}{\\mathrm{B}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/oOCfC8aK4lNtMENFhSJu6CXDaYqJlYgak1iiPCem2bo.original.fullsize.png\"><br>\nKinetic energy is given by\n$\\text { (K.E.) })_{\\max }=h v-h v_0$\n$\\text { Comparing }\\mathrm{y}=\\mathrm{mx}+\\mathrm{c}$\nWe get $\\mathrm{x}$-intercept when\n$\\text { (K.E. })_{\\max }=0 \\text {, i.e., } \\mathrm{h} v-\\mathrm{h} v_0=0$\nOr $v=v_0=\\mathrm{A}$\nWe get y-intercept when $v=0$\n$\\therefore(\\text { K.E. })_{\\max }=-\\mathrm{h} v_0=\\mathrm{B}$\n$\\therefore\\left|\\frac{\\mathrm{B}}{\\mathrm{A}}\\right|=\\frac{\\mathrm{h} \\mathrm{v}_0}{\\mathrm{v}_0}=\\mathrm{h}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260cb0279619d9d8a275c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "A light of wavelength ' $\\lambda$ ' and intensity ' $I$ ' falls on photosensitive material. If ' $\\mathrm{N}$ ' photo electrons are emitted, each with kinetic energy ' $E$ ', then", "image": null}, "options": [{"id": "l7mdi", "text": "$E \\propto I, N \\propto \\lambda$", "image": null, "isCorrect": false}, {"id": "93LKH", "text": "$\\mathrm{E} \\propto \\mathrm{I}, \\mathrm{N} \\propto \\mathrm{I}$", "image": null, "isCorrect": false}, {"id": "iSoQb", "text": "$\\mathrm{E} \\propto \\mathrm{I}, \\mathrm{N} \\propto \\frac{1}{\\lambda}$", "image": null, "isCorrect": false}, {"id": "jEWLl", "text": "$\\mathrm{E} \\propto \\frac{1}{\\lambda}, \\mathrm{N} \\propto \\mathrm{I}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Intensity is proportional to the number of photons, since each photon interacts with one electron, the number of electron $\\mathrm{N} \\propto \\mathrm{I}$. Energy of photon is $\\frac{h c}{\\lambda}$, hence it is inversely proportional to the wavelength.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260ba0279619d9d8a26d0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "In photoelectric effect, the photocurrent", "image": null}, "options": [{"id": "ic5T9", "text": "does not depend on the frequency of photon but depends on intensity of incident light", "image": null, "isCorrect": true}, {"id": "YhagX", "text": "decreases with Increase in frequency of incident photon.", "image": null, "isCorrect": false}, {"id": "L3yh5", "text": "increases with increase in frequency of incident photon.", "image": null, "isCorrect": false}, {"id": "fZEmG", "text": "depends on intensity of incident radiation and its frequency.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In photoelectric effect, the photocurrent does not depend on the frequency of photon but depends on intensity of incident light.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260ae0279619d9d8a2677", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "When wavelength of incident radiation on the metal surface is reduced from ' $\\lambda_1$ ' to ' $\\lambda_2$ ' the kinetic energy of emitted photoelectrons is tripled. The work function of metal $[\\mathrm{h}=$ Plank 's constant, c = velocity of light]", "image": null}, "options": [{"id": "AKwO5", "text": "$\\frac{\\mathrm{hc}}{2}\\left[\\frac{3 \\lambda_1-\\lambda_2}{\\lambda_1 \\lambda_2}\\right]$", "image": null, "isCorrect": false}, {"id": "jgd6P", "text": "$\\frac{\\mathrm{hc}}{2}\\left[\\frac{3 \\lambda_2-\\lambda_1}{\\lambda_1 \\lambda_2}\\right]$", "image": null, "isCorrect": true}, {"id": "NDEne", "text": "$\\operatorname{hc}\\left[\\frac{3 \\lambda_1-\\lambda_2}{\\lambda_1 \\lambda_2}\\right]$", "image": null, "isCorrect": false}, {"id": "ItvVA", "text": "$\\operatorname{hc}\\left[\\frac{3 \\lambda_2-\\lambda_1}{\\lambda_1 \\lambda_2}\\right]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $\\mathrm{K}$ represent kinetic energy\n$$\n\\begin{aligned}\n& \\therefore \\mathrm{K}_1=\\frac{\\mathrm{hc}}{\\lambda_1}-\\mathrm{W}_0 \\\\\n& \\text { and } \\mathrm{K}_2=\\frac{\\mathrm{hc}}{\\lambda_2}-\\mathrm{W}_0 \\\\\n& \\mathrm{~K}_2=3 \\mathrm{~K}_1 \\\\\n& \\therefore \\frac{\\mathrm{hc}}{\\lambda_2}-\\mathrm{W}_0=3 \\frac{\\mathrm{hc}}{\\lambda_1}-3 \\mathrm{~W}_0 \\\\\n& \\therefore 2 \\mathrm{~W}_0=\\frac{3 \\mathrm{hc}}{\\lambda_1}-\\frac{\\mathrm{hc}}{\\lambda_2} \\\\\n& \\therefore \\mathrm{W}_0=\\frac{\\mathrm{hc}}{2}\\left(\\frac{3 \\lambda_2-\\lambda_1}{\\lambda_1 \\lambda_2}\\right)\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260950279619d9d8a25aa", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "In photoelectric experiment keeping the frequency of incident radiation and accelerating potential fixed, if the intensity of incident light is increase,", "image": null}, "options": [{"id": "V5a7x", "text": "photoelectric current decreases", "
