ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ef50279619d9d8a18a1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}], "question": {"text": "The stopping potential of the photoelectrons, from a photo cell is", "image": null}, "options": [{"id": "BQz54", "text": "Directly proportional to intensity of incident light", "image": null, "isCorrect": false}, {"id": "iHJaW", "text": "Directly proportional to frequency of incident light", "image": null, "isCorrect": true}, {"id": "Rg3E7", "text": "Inversely proportional to frequency of incident light", "image": null, "isCorrect": false}, {"id": "XTJoQ", "text": "Inversely proportional to intensity of incident light", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The stopping potential of photoelectrons is potential needed to stop the electrons from reaching the collector depends only on the frequency of incident radiation. It is directly proportional to it. <br/>This is because, more the frequency of incident light, more will be the energy of the photons incident photons. (E = <math><mi>h</mi><mi>v</mi></math> ) <br/>Thus, more will be the energy (kinetic) acquired the electrons. <br/>More the kinetic energy of emitted electrons, higher is the potential needed to stop them (stopping potential).", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ed30279619d9d8a1796", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}], "question": {"text": "Following graphs show the variation of stopping potential corresponding to the frequency of incident radiation <math><mfenced separators=\"|\"><mrow><mn>f</mn></mrow></mfenced></math> for a given metal. The correct variation is shown in graph ( <math><msub><mrow><mn>f</mn></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo></math> Threshold frequency)<br /><br><br /><br><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/copy_same.PNG\" style=\"width: 500px; height: 122px;\" />", "image": null}, "options": [{"id": "qyIqO", "text": "(1)", "image": null, "isCorrect": true}, {"id": "pcrNn", "text": "(2)", "image": null, "isCorrect": false}, {"id": "4VycU", "text": "(3)", "image": null, "isCorrect": false}, {"id": "LJgSy", "text": "(4)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/home.PNG\" style=\"width: 145px; height: 146px;\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ed20279619d9d8a178c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}], "question": {"text": "In a Photoelectric effect experiment, frequency of incident radiation is increased by keeping other factors constant <math><mfenced separators=\"|\"><mrow><mi>f</mi><mo>&gt;</mo><msub><mrow><mi>f</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfenced></math> .The stopping potential", "image": null}, "options": [{"id": "cYpck", "text": "decreases", "image": null, "isCorrect": false}, {"id": "j4mZN", "text": "increases", "image": null, "isCorrect": true}, {"id": "MKcps", "text": "becomes zero", "image": null, "isCorrect": false}, {"id": "Ax4GL", "text": "first decreases and then increases", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <mi>e</mi><msub> <mi>V</mi> <mn>0</mn> </msub> <mo>=</mo><mi>h</mi><mi>υ</mi><mo>−</mo><mi>h</mi><msub> <mi>υ</mi> <mn>0</mn> </msub> <mo>.</mo></mrow> </math><br /><math> <mrow> <mi>e</mi><msub> <mi>V</mi> <mn>0</mn> </msub> <mo>=</mo><mi>h</mi><mrow><mo>(</mo> <mrow> <mi>υ</mi><mo>−</mo><msub> <mi>υ</mi> <mn>0</mn> </msub> </mrow> <mo>)</mo></mrow><mo>.</mo></mrow> </math><br /><math> <mrow> <mi>e</mi><msub> <mi>V</mi> <mn>0</mn> </msub> <mo>=</mo><mfrac> <mi>h</mi> <mi>e</mi> </mfrac> <mrow><mo>(</mo> <mrow> <mi>υ</mi><mo>−</mo><msub> <mi>υ</mi> <mn>0</mn> </msub> </mrow> <mo>)</mo></mrow><mo>.</mo></mrow> </math><br />Stopping potential increases with frequency of incident radiation.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ec00279619d9d8a16f9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f62", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "MHT CET 2017"}], "question": {"text": "On a photosensitive material, when the frequency of incident radiation is increased by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>%</mo></math>, the kinetic energy of emitted photoelectrons increases from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>4</mn><mo>&nbsp;</mo><mi>eV</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>9</mn><mo>&nbsp;</mo><mi>eV</mi></math>. The work function of the surface is", "image": null}, "options": [{"id": "CkmsZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi>eV</mi></math>", "image": null, "isCorrect": false}, {"id": "W7uKS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>267</mn><mo>&#160;</mo><mi>eV</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 83px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "t3XUx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>4</mn><mo>&#160;</mo><mi>eV</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 49px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "MyHcS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>8</mn><mo>&#160;</mo><mi>eV</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 108px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi>h</mi><mi>v</mi><mo>=</mo><mn>0.4</mn><mo>+</mo><msub><mrow><mi>W</mi></mrow><mrow><mn>0</mn></mrow></msub></math> ....... (i)<br /><math><mn>1.3</mn><mi>&nbsp;</mi><mi>h</mi><mi>v</mi><mo>=</mo><mn>0.9</mn><mo>+</mo><msub><mrow><mi>W</mi></mrow><mrow><mn>0</mn></mrow></msub></math> ....... (ii)<br />(ii) - 1.3 (i) gives<br /><math><mn>0.3</mn><mi>&nbsp;</mi><msub><mrow><mi>W</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mn>0.9</mn><mo>-</mo><mn>1.3</mn><mi>&nbsp;</mi><mo>(</mo><mn>0.4</mn><mo>)</mo></math><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>W</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>0.38</mn></mrow><mrow><mn>0.3</mn></mrow></mfrac><mo>=</mo><mn>1.267</mn><mi>&nbsp;eV</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f62", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "MHT CET 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ebd0279619d9d8a16e2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f62", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "MHT CET 2017"}], "question": {"text": "An electron in a hydrogen atom jumps from second Bohr orbit to ground state and the energy difference of the two states is radiated in the form of photons. These are then allowed to fall on a metal surface having a work-function equal to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>4.2</mtext><mo>&nbsp;</mo><mi>eV</mi></math>, then the stopping potential is [Energy of electron in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">n</mi><mi>th</mi></msup></math> orbit <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mfrac><mrow><mn>13</mn><mo>.6</mo></mrow><msup><mi mathvariant=\"normal\">n</mi><mn>2</mn></msup></mfrac><mo>&nbsp;</mo><mi>eV</mi></math>]", "image": null}, "options": [{"id": "HIbuh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">V</mi></math>", "image": null, "isCorrect": false}, {"id": "ZyWWX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">V</mi></math>", "image": null, "isCorrect": false}, {"id": "8uuIz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>", "image": null, "isCorrect": true}, {"id": "oCuwG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">V</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">E</mi><mo>=</mo><mfrac><mrow><mn>13</mn><mo>.6</mo></mrow><mn>1</mn></mfrac><mo>-</mo><mfrac><mrow><mn>13</mn><mo>.6</mo></mrow><msup><mn>2</mn><mn>2</mn></msup></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">E</mi><mo>=</mo><mn>13</mn><mo>.6</mo><mfenced close=\"]\" open=\"[\" separators=\"|\"><mfrac><mrow><mn>4</mn><mo>-</mo><mn>1</mn></mrow><mn>4</mn></mfrac></mfenced><mo>=</mo><mn>13</mn><mo>.6</mo><mo>&#215;</mo><mfrac><mn>3</mn><mn>4</mn></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">E</mi><mo>=</mo><mn>10</mn><mo>.2</mo><mo>&#160;</mo><mi mathvariant=\"normal\">e</mi><mn>V</mn><mi mathvariant=\"normal\">&#160;</mi><mfenced separators=\"|\"><mrow><mo>=</mo><mi>h&#957;</mi></mrow></mfenced></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">i</mi><mo>.</mo><mi mathvariant=\"normal\">e</mi><mo>.</mo><mi mathvariant=\"normal\">&#160;</mi><mi>h&#957;</mi><mo>=</mo><mn>10</mn><mo>.2</mo><mi>eV</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h&#957;</mi><mo>=</mo><msub><mi mathvariant=\"normal\">&#981;</mi><mn>0</mn></msub><mo>+</mo><msub><mi>eV</mi><mi mathvariant=\"normal\">s</mi></msub></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>10</mn><mo>.2</mo><mi mathvariant=\"normal\">&#160;</mi><mi>eV</mi><mo>=</mo><mn>4</mn><mo>.2</mo><mi mathvariant=\"normal\">&#160;</mi><mi>eV</mi><mo>+</mo><msub><mi>eV</mi><mi mathvariant=\"normal\">s</mi></msub></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>6</mn><mi mathvariant=\"normal\">&#160;</mi><mi>eV</mi><mo>=</mo><msub><mi>eV</mi><mi mathvariant=\"normal\">s</mi></msub></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><mi mathvariant=\"normal\">&#160;</mi><msub><mi mathvariant=\"normal\">V</mi><mi mathvariant=\"normal\">s</mi></msub><mo>=</mo><mn>6</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f62", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "MHT CET 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25eae0279619d9d8a166c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}], "question": {"text": "When light of wavelength <math><msup><mrow><mi>λ</mi></mrow></msup></math>&nbsp;is incident on photosensitive surface, the stopping potential is <math><msup><mrow><mi>V</mi></mrow></msup></math>. When light of wavelength <math><mn>3</mn><mi>λ</mi></math>&nbsp;is incident on same surface, the stopping potential is <math><mfrac><mrow><msup><mrow><mi>V</mi></mrow></msup></mrow><mrow><mn>6</mn></mrow></mfrac><mo>.</mo></math> Threshold wavelength for the surface is", "image": null}, "options": [{"id": "51BlZ", "text": "<math><mn>2</mn><mi>λ</mi></math>", "image": null, "isCorrect": false}, {"id": "yj7yY", "text": "<math><mn>3</mn><mi>λ</mi></math>", "image": null, "isCorrect": false}, {"id": "Z6128", "text": "<math><mn>4</mn><mi>λ</mi></math>", "image": null, "isCorrect": false}, {"id": "YUiiC", "text": "<math><mn>5</mn><mi>λ</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Using <math><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mi>λ</mi></mrow></mfrac><mo>-</mo><mi>ϕ</mi><mo>=</mo><mi>e</mi><mi>V</mi></math><br />When, wavelength <math><mi>λ</mi></math> is incident on metallic surface, the sopping potential required to stop most energetic electron is <math><mi>V</mi></math> and when wavelength increases to <math><mn>3</mn><mi>λ</mi></math> , stopping potential required as <math><mfrac><mrow><mi>V</mi></mrow><mrow><mn>6</mn></mrow></mfrac></math><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mi>λ</mi></mrow></mfrac><mo>=</mo><mi>e</mi><mi>V</mi><mo>+</mo><mi>ϕ</mi></math> ..... (i)<br />And <math><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mn>3</mn><mi>λ</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>e</mi><mi>V</mi></mrow><mrow><mn>6</mn></mrow></mfrac><mo>+</mo><mi>ϕ</mi></math> .... (ii)<br />Thus equation (ii) can be rewritten as <math><mfrac><mrow><mn>2</mn><mi>h</mi><mi>c</mi></mrow><mrow><mi>λ</mi></mrow></mfrac><mo>=</mo><mi>e</mi><mi>V</mi><mo>+</mo><mn>6</mn><mi>ϕ</mi></math> ..... (iii)<br />Subtracting equation (i) from (iii) we get<br /><math><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mi>λ</mi></mrow></mfrac><mo>=</mo><mn>5</mn><mi>ϕ</mi></math> and <math><mi>ϕ</mi><mo>=</mo><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac></math><br />Thus <math><msub><mrow><mi>λ</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mn>5</mn><mi>λ</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ead0279619d9d8a1660", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}], "question": {"text": "Light of wavelength <math><msup><mrow><mi>λ</mi></mrow></msup></math>&nbsp;which is less than threshold wavelength is incident on a photosensitive material. If incident wavelength is decreased so that emitted photoelectrons are moving with same velocity then stopping potential will", "image": null}, "options": [{"id": "V3V9A", "text": "increase", "image": null, "isCorrect": true}, {"id": "AHoTH", "text": "decrease", "image": null, "isCorrect": false}, {"id": "Jlxei", "text": "be zero", "image": null, "isCorrect": false}, {"id": "GGfdi", "text": "become exactly half", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to photoelectric equation<br /><math><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mi>λ</mi></mrow></mfrac><mo>-</mo><mi>ϕ</mi><mo>=</mo><mi mathvariant=\"normal\">E</mi></math> where <math><mi>E</mi><mo>=</mo><mfrac><mrow><msup><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><mi>m</mi></mrow></mfrac><mo>(</mo><mi>K</mi><mo>.</mo><mi>E</mi><mo>)</mo></math><br />If E is constant <math><mo>⇒</mo><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">n</mi><mi>&nbsp;</mi><mfrac><mrow><mn>1</mn></mrow><mrow><mi>λ</mi></mrow></mfrac><mo>∝</mo><mi>ϕ</mi><mi>&nbsp;</mi></math><br />If we decrease the wavelength <math><mi>λ</mi></math> , then stopping potential <math><mi>ϕ</mi></math> will increase such that <math><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mi>λ</mi></mrow></mfrac><mo>-</mo><mi>ϕ</mi><mo>=</mo></math> constant", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e630279619d9d8a1403", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "In photoelectric effect if the intensity of light is doubled, then maximum kinetic energy of photoelectrons will become", "image": null}, "options": [{"id": "kluL7", "text": "double", "image": null, "isCorrect": false}, {"id": "DES2Z", "text": "half", "image": null, "isCorrect": false}, {"id": "k2ZCE", "text": "four times", "image": null, "isCorrect": false}, {"id": "gOvkB", "text": "no change", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$K_{\\max }$ of photoelectrons doesnot depend upon intensity of incident light.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e510279619d9d8a1377", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "Which of the following is not the property of the photons?", "image": null}, "options": [{"id": "dLqfc", "text": "Momentum", "image": null, "isCorrect": false}, {"id": "48mGu", "text": "Energy", "image": null, "isCorrect": false}, {"id": "a9knm", "text": "Charge", "image": null, "isCorrect": true}, {"id": "nKCcv", "text": "Velocity", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A photon is a particle which has zero charge and zero mass and is denoted by $\\gamma$. The energy of photon is $E=h v$\nHere, $\\mathrm{v}=$ frequency and $h=$ Planck's constant. The momentum of the photon is $h / \\mathrm{v}$ and its velocity is the velocity of light $(c)$. So, the charge is not the property of photons.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e3f0279619d9d8a12e5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "In a circuit, the current lags behind the voltage by a phase difference of $\\pi / 2$, the circuit will contain which of the following ?", "image": null}, "options": [{"id": "rBUd4", "text": "Only $R$", "image": null, "isCorrect": false}, {"id": "uNXIc", "text": "Only C", "image": null, "isCorrect": false}, {"id": "KtZWW", "text": "$R$ and $C$", "image": null, "isCorrect": false}, {"id": "RFetP", "text": "Only $L$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "When a circuit contains inductance only, then the current lags behind the voltage by the phase difference of $\\frac{\\pi}{2}$ or $90^{\\circ}$.\nWhile in a purely capacitive circuit, the current leads the voltage by a phase angle of $\\frac{\\pi}{2}$ or $90^{\\circ}$. In a purely resistive circuit current is in phase with the applied voltage.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e3e0279619d9d8a12dd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "In bringing an electron towards another electron, the electrostatic potential energy of the system", "image": null}, "options": [{"id": "Lkysu", "text": "decreases", "image": null, "isCorrect": false}, {"id": "8iLsx", "text": "increases", "image": null, "isCorrect": true}, {"id": "BEBbB", "text": "remains same", "image": null, "isCorrect": false}, {"id": "DVcIJ", "text": "becomes zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The electron has negative charge. When an electron is approaching towards another electron, then due to same negative charge repulsive force is produced between them. So, to bring them closer a work is done against this repulsive force. This work is stored in the form of electrostatic potential energy. Thus, electrostatic potential energy of system increases.\nAlternative Electrostatic potential energy of system of two electrons\n$$\nU=\\frac{1}{4 \\pi \\varepsilon_{0}} \\frac{(-e)(-e)}{r}=\\frac{1}{4 \\pi \\varepsilon_{0}} \\frac{e^{2}}{r}\n$$\nThus, as $r$ decreases, potential energy $U$ increases.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e3d0279619d9d8a12d5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "Which one of the following processes depends on gravity?", "image": null}, "options": [{"id": "W6O1e", "text": "Conduction", "image": null, "isCorrect": false}, {"id": "0QngG", "text": "Convection", "image": null, "isCorrect": true}, {"id": "ISnkc", "text": "Radiation", "image": null, "isCorrect": false}, {"id": "6vGe6", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Conduction is the process of transmission of heat in a body from the hotter part to the colder part without any bodily movement of constituent atoms or molecules of the body.\n(b) In convection, the heated lighter particles move upwards and colder heavier particles move downwards to their place. This depends on weight and hence, on gravity.\n(c) Radiation is the process of transmission of heat from the body to another body through electromagnetic waves even through vacuum, irrespective of their temperatures. Hence, (b) is correct.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
