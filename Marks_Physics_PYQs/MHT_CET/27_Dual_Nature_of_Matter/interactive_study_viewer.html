hold frequency }=2 \\times 10^{15} \\mathrm{~Hz} \\\\ & \\therefore \\text { Work function, } \\mathrm{W}_0=\\mathrm{h} v_0 \\\\ & =6.63 \\times 10^{-34} \\times 2 \\times 10^{15} \\\\ & =13.26 \\times 10^{-19} \\mathrm{~J} \\\\ & =\\frac{13.26 \\times 10^{-19}}{1.6 \\times 10^{-19}} \\mathrm{eV}=8.3 \\mathrm{eV} \\\\ & \\mathrm{KE} \\text { of electrons }=\\mathrm{h} v-\\mathrm{W}_0 \\\\ & =10-8.3=1.7 \\mathrm{eV}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260810279619d9d8a250b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "The light of wavelength ' $\\lambda$ ' is incident on the surface of metal of work function $\\phi$ and emits the electron, The maximum velocity of electron emitted is [ $\\mathrm{m}=$ mass of electron and $\\mathrm{h}=$ Planck's constant, $c=$ velocity of light]", "image": null}, "options": [{"id": "eMjvg", "text": "$\\left[\\frac{2(\\mathrm{hc}-\\lambda)^{\\frac{1}{2}}}{\\mathrm{~m} \\lambda}\\right]$", "image": null, "isCorrect": false}, {"id": "GTdku", "text": "$\\left[\\frac{2(\\mathrm{hc}-\\phi) \\lambda}{\\mathrm{mc}}\\right]$", "image": null, "isCorrect": false}, {"id": "9CpJV", "text": "$\\left[\\frac{2(\\mathrm{hc}-\\lambda)}{\\mathrm{m} \\lambda}\\right]$", "image": null, "isCorrect": false}, {"id": "vqULw", "text": "$\\left[\\frac{2(\\mathrm{hc}-\\lambda \\phi)}{\\mathrm{m} \\lambda}\\right]^{\\frac{1}{2}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "We have $\\frac{1}{2} \\mathrm{mv}_{\\max }^2=\\frac{\\mathrm{hc}}{\\lambda}-\\phi=\\frac{\\mathrm{hc}-\\phi \\lambda}{\\lambda}$\n$$\n\\begin{aligned}\n& \\therefore \\mathrm{V}_{\\max }^2=\\frac{2(\\mathrm{hc}-\\phi \\lambda)}{\\mathrm{m} \\lambda} \\\\\n& \\therefore \\mathrm{V}_{\\max }=\\sqrt{\\frac{2(\\mathrm{hc}-\\phi \\lambda)}{\\mathrm{m} \\lambda}}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2607e0279619d9d8a24ef", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "When a photon enters glass from air, which one of the following quantities does not change?", "image": null}, "options": [{"id": "Q82Hs", "text": "Energy", "image": null, "isCorrect": true}, {"id": "vpCdz", "text": "Velocity", "image": null, "isCorrect": false}, {"id": "6O5Ag", "text": "Wavelength", "image": null, "isCorrect": false}, {"id": "Q8rEq", "text": "Momentum", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Energy of the photon is given by\n$$\n\\mathrm{E}=\\mathrm{h} v\n$$\nThe frequency of photon does not change hence the energy does not change.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260700279619d9d8a247f", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "When a light of wavelength ' $\\lambda$ ' falls on the emitter of a photocells, maximum speed of emitted photoelectrons is ' $\\mathrm{V}$. If the incident wavelength is changed to $\\frac{2 \\lambda}{3}$, maximum speed of emitted photoelectrons will be", "image": null}, "options": [{"id": "8GcQ1", "text": "less than $(1.5)^{1 / 2} \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "vXX2F", "text": "$\\sqrt{\\mathrm{V}}$", "image": null, "isCorrect": false}, {"id": "v0U1U", "text": "greater than $(1.5)^{1 / 2} \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "pT5cB", "text": "V", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n(\\mathrm{K} . \\mathrm{E} .)_1=\\frac{\\mathrm{hc}}{\\lambda_1}-\\mathrm{W}_0\n$$\nMultiplying by $3 / 2$\n$$\n\\begin{aligned}\n& \\frac{3}{2}(\\mathrm{~K} . \\mathrm{E} .)_1=\\frac{3}{2} \\frac{\\mathrm{hc}}{\\lambda_1}-\\frac{3}{2} \\mathrm{~W}_0 ...(1)\\\\\n& (\\mathrm{~K} . \\mathrm{E} .)_2=\\frac{\\mathrm{hc}}{\\lambda_2}-\\mathrm{W}_0 \\\\\n& (\\mathrm{~K} . \\mathrm{E} .)_2=\\frac{3}{2} \\frac{\\mathrm{hc}}{\\lambda_1}-\\mathrm{W}_0  ...(2)\n\\end{aligned}\n$$\nBy equation (1) and (2)\n$$\n\\begin{aligned}\n& (\\mathrm{K} \\cdot \\mathrm{E} \\cdot)_2=\\frac{3}{2}(\\mathrm{~K} \\cdot \\mathrm{E} \\cdot)_1+\\frac{1}{2} \\mathrm{~W}_0 \\\\\n& \\text { or } \\frac{1}{2} \\mathrm{mv}_2^2>\\frac{3}{2}\\left(\\frac{1}{2} \\mathrm{mv}_1^2\\right) \\\\\n& \\therefore \\mathrm{v}_2^2>\\frac{3}{2} \\mathrm{v}_1^2 \\\\\n& \\therefore \\mathrm{v}_2>(1.5)^{1 / 2} \\mathrm{v}_1\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260580279619d9d8a23be", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "Photoemission from metal surface take place for frequencies ' $v 1$ ' and ' $v_2$ ' of incident rays. If ratio of maximum kinetic energy of photoelectrons is $1: \\mathrm{K}$ then threshold frequency of metallic surface is", "image": null}, "options": [{"id": "QOYVW", "text": "$\\frac{\\mathrm{K} v_2-v_1}{\\mathrm{~K}-1}$", "image": null, "isCorrect": false}, {"id": "UnYse", "text": "$\\frac{v_1-v_2}{\\mathrm{~K}-1}$", "image": null, "isCorrect": false}, {"id": "nOeTJ", "text": "$\\frac{v_2-v_1}{\\mathrm{~K}}$", "image": null, "isCorrect": false}, {"id": "7HCAb", "text": "$\\frac{\\mathrm{K} v_1-v_2}{\\mathrm{~K}-1}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/lBauGtqltrS0uPIm5rr825Ar1u5QRhFbwKQNl8bu8EA.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2604a0279619d9d8a234c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "Light of frequency two times the threshold frequency is incident on photosensitive material. If the incident frequency is made $\\left(\\frac{1}{3}\\right)^{\\mathrm{rd}}$ and intensity is doubled, then the photoelectric current will", "image": null}, "options": [{"id": "KssLg", "text": "increase", "image": null, "isCorrect": false}, {"id": "u3XyX", "text": "decrease", "image": null, "isCorrect": false}, {"id": "53NP0", "text": "be zero", "image": null, "isCorrect": true}, {"id": "xV5bh", "text": "be halved", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Initial frequency $v=2 v_0$\nFinal frequency $v^{\\prime}=\\frac{2 v_0}{3}$\n$v^{\\prime}$ is less than the threshold frequency $v_0$\nHence no photoelectrons will be emitted, and photoelectric current will be zero.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260470279619d9d8a2331", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "On a photosensitive surface, if the intensity of incident radiation is increased, the stopping potential", "image": null}, "options": [{"id": "RgQDg", "text": "first increases and then decreases", "image": null, "isCorrect": false}, {"id": "mOIuV", "text": "increases", "image": null, "isCorrect": false}, {"id": "zUNBC", "text": "decreases", "image": null, "isCorrect": false}, {"id": "utaE2", "text": "remains unchanged", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Stopping potential does not depend on the intensity of light.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260360279619d9d8a22ab", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "When light of wavelength ' $\\lambda$ ' is incident on a photosensitive surface, photons of power ' $\\mathrm{P}$ ' are emitted. The number of photon ' $\\mathrm{n}$ ' emitted in time ' $\\mathrm{t}$ ' is $\\mathrm{h}$ = Planck's constant, $\\mathrm{c}=$ velocity of light in vacuum]", "image": null}, "options": [{"id": "cs2cc", "text": "$\\frac{\\mathrm{hc}}{\\mathrm{P} \\lambda \\mathrm{t}}$", "image": null, "isCorrect": false}, {"id": "ppiv2", "text": "$\\frac{\\mathrm{P} \\lambda}{\\mathrm{htc}}$", "image": null, "isCorrect": false}, {"id": "8kJDE", "text": "$\\frac{\\mathrm{P} \\lambda \\mathrm{t}}{\\mathrm{hc}}$", "image": null, "isCorrect": true}, {"id": "UEaFe", "text": "$\\frac{\\mathrm{hP}}{\\lambda \\mathrm{tc}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Power, $\\mathrm{P}=\\frac{\\text { Energy }}{\\mathrm{t}}=\\frac{\\mathrm{nhc}}{\\lambda \\mathrm{t}}$\n$$\n\\therefore \\mathrm{n}=\\frac{\\mathrm{p} \\lambda \\mathrm{t}}{\\mathrm{hc}}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260220279619d9d8a220a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "Photoelectrons are emitted when photons of energy $4.2 \\mathrm{eV}$ are incident on a photosensitive metallic sphere of radius $10 \\mathrm{~cm}$ and work function $2.4 \\mathrm{eV}$. The number of photoelectrons emitted before the emission is stopped is\n$$\n\\left[\\frac{1}{4 \\pi \\epsilon_0}=9 \\times 10^9 \\text { SI unit; } \\mathrm{e}=1.6 \\times 10^{-19} \\mathrm{C}\\right]\n$$", "image": null}, "options": [{"id": "THztC", "text": "$1.25 \\times 10^6$", "image": null, "isCorrect": false}, {"id": "RDC26", "text": "$1.25 \\times 10^8$", "image": null, "isCorrect": true}, {"id": "R8a2H", "text": "$1.25 \\times 10^2$", "image": null, "isCorrect": false}, {"id": "dzT0W", "text": "$1.25 \\times 10^4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\mathrm{h} v=4.2 \\mathrm{eV}, \\phi=2.4 \\mathrm{eV},(\\mathrm{KE})_{\\max }=4.2-2.4=1.8 \\mathrm{eV}\n$$\nThe electrons will not be able to escape from the surface when its potential becomes $1.8 \\mathrm{~V}$.\n$$\n\\begin{aligned}\n& \\mathrm{V}=\\frac{1}{4 \\pi \\epsilon_0} \\frac{\\mathrm{q}}{\\mathrm{r}} \\\\\n& 1.8=9 \\times 10^9 \\times \\frac{\\mathrm{q}}{0.1} \\\\\n& \\mathrm{q}=2 \\times 10^{-11} \\mathrm{C}\n\\end{aligned}\n$$\nThe number of photoelectrons emitted before the emission is stopped is,\n$$\n\\mathrm{n}=\\frac{\\mathrm{q}}{\\mathrm{e}}=\\frac{2 \\times 10^{-11}}{1.6 \\times 10^{-19}}=1.25 \\times 10^8\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260120279619d9d8a2187", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}], "question": {"text": "Two incident radiations having energies two times and ten times of the work function of a metal surface, produce photoelectric effect. The ratio of maximum velocities of emitted photo electrons respectively is", "image": null}, "options": [{"id": "samDm", "text": "$3: 2$", "image": null, "isCorrect": false}, {"id": "5snza", "text": "$1: 3$", "image": null, "isCorrect": true}, {"id": "bh0D1", "text": "$2: 3$", "image": null, "isCorrect": false}, {"id": "WOZvV", "text": "$1: 2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\frac{1}{2} m v_{1}^{2}=2 \\phi_{0}-\\phi_{0}$\n$\\frac{1}{2} m v_{2}^{2}=10 \\phi_{0}-\\phi_{0}$\n$\\frac{v_{1}^{2}}{v_{2}^{2}}=\\frac{1}{9}$\n$\\therefore \\frac{v_{1}}{v_{2}}=\\frac{1}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260110279619d9d8a217f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}], "question": {"text": "Photoelectrons are emitted from a photosensitive surface for the light of wavelengths $\\lambda_{1}=360 \\mathrm{~nm}$ and $\\lambda_{2}=600 \\mathrm{~nm} .$ What is the ratio of work functions\nfor lights of wavelength ${ }^{\\prime} \\lambda_{1}{ }^{\\prime}$ to $\\lambda_{2}{ }^{\\prime}$?", "image": null}, "options": [{"id": "dqxO1", "text": "$6: 1$", "image": null, "isCorrect": false}, {"id": "DZQM7", "text": "$1: 6$", "image": null, "isCorrect": false}, {"id": "TcDvs", "text": "$5: 3$", "image": null, "isCorrect": true}, {"id": "HBe1s", "text": "$3: 5$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\frac{h c}{\\lambda_{1}}-\\phi_{1}=\\mathrm{KE} \\quad \\quad \\lambda_{1}=360 \\mathrm{~nm}=360 \\times 10^{-9} \\mathrm{~m}$\n$\\frac{\\mathrm{hc}}{\\lambda_{2}}-\\phi_{2}=\\mathrm{KE} \\quad \\quad\\lambda_{2}=600 \\mathrm{~nm}=600 \\times 10^{-9} \\mathrm{~m}$\n$\\frac{h c}{\\lambda_{1}}=\\phi_{1} \\quad \\quad \\phi \\propto \\frac{1}{\\lambda}$\n$\\therefore \\frac{\\phi_{1}}{\\phi_{2}}=\\frac{\\lambda_{2}}{\\lambda_{1}}=\\frac{600}{360}=\\frac{10}{6}=\\frac{5}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260000279619d9d8a20f2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "Which one of the following four graphs showing lines $\\mathrm{P}, \\mathrm{Q}, \\mathrm{R}$ and $\\mathrm{S}$ between\nmaximum kinetic energy (E) and intensity of incident light (I) is correct?\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/0_fDptXe6mKDhdWzhcTmSKRwedobkuZB9XmRVZeuyj4.original.fullsize.png\">", "image": null}, "options": [{"id": "4UMxN", "text": "S", "image": null, "isCorrect": false}, {"id": "CzPpf", "text": "R", "image": null, "isCorrect": false}, {"id": "21m8h", "text": "Q", "image": null, "isCorrect": false}, {"id": "bD8Oj", "text": "P", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\mathrm{KE}$ does not depend on intensity of incident light.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fff0279619d9d8a20e9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "A photon of wavelength 3315 Ã… falls on a photocathode and an electron of energy\n$3 \\times 10^{-19} \\mathrm{~J}$ is ejected. The threshold wavelength of photon is [Planck's constant (h)\n$=6.63 \\times 10^{-34} \\mathrm{~J}-\\mathrm{s}$, velocity of light $\\left.(\\mathrm{c})=3 \\times 10^{8} \\mathrm{~m} / \\mathrm{s}\\right]$", "image": null}, "options": [{"id": "VduTi", "text": "$6630 Å$", "image": null, "isCorrect": true}, {"id": "VWAEe", "text": "$3315 Å$", "image": null, "isCorrect": false}, {"id": "HcwpS", "text": "$5000 Å$", "image": null, "isCorrect": false}, {"id": "odxHF", "text": "$1130 Å$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\phi_{0}=\\frac{h c}{\\lambda}-E$\n$=\\frac{6.63 \\times 10^{-34} \\times 3 \\times 10^{8}}{3315 \\times 10^{-10}}-3 \\times 10^{-19}=(6-3) \\times 10^{-19}=3 \\times 10^{-19}$\n$\\lambda_{0}=\\frac{\\mathrm{hc}}{\\phi_{0}}=\\frac{6.63 \\times 10^{-34} \\times 3 \\times 10^{8}}{3 \\times 10^{-19}} \\approx 6630 ~Å$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fee0279619d9d8a2065", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "The graph of stopping potential $\\left(\\mathrm{V}_{s}\\right)$ against frequency $(v)$ of incident radiation is\nplotted for two different metals 'P' and 'Q' as shown in the graph. $\\phi_{\\mathrm{p}}$ and $\\phi_{\\mathrm{q}}$ are work functions of $\\mathrm{P}$ and $\\mathrm{Q}$ respectively, then\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/VD6XPJlNXl8YrckNg_Sp79rQ60MebxCNenpjtEWYImw.original.fullsize.png\">", "image": null}, "options": [{"id": "fhPSr", "text": "$\\phi_{\\mathrm{P}}=\\phi_{\\mathrm{Q}}$", "image": null, "isCorrect": false}, {"id": "N4rFz", "text": "$v_{0}^{\\prime} < v_{0}$", "image": null, "isCorrect": false}, {"id": "1lMti", "text": "$\\phi_{\\mathrm{P}} < \\phi_{\\mathrm{Q}}$", "image": null, "isCorrect": true}, {"id": "9bmzN", "text": "$\\phi_{\\mathrm{P}}>\\phi_{\\mathrm{Q}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(B)\n$\\phi=\\mathrm{hv}_{\\mathrm{o}} \\quad \\therefore \\phi \\propto \\mathrm{v}_{\\mathrm{o}}$\n$v_{\\mathrm{o}} < v_{\\mathrm{o}}^{\\prime} \\quad \\therefore \\phi_{\\mathrm{p}} < \\phi_{\\mathrm{Q}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fea0279619d9d8a2045", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "If the maximum kinetic energy of emitted electrons in photoelectric effect is $3 \\cdot 2 \\times 10^{-19} \\mathrm{~J}$ and the work function for metal is $6 \\cdot 63 \\times 10^{-19} \\mathrm{~J}$, then stopping\npotential and threshold wavelength respectively are\n[Planck's constant $\\left.\\mathrm{h}=6.63 \\times 10^{-34} \\mathrm{~J} . \\mathrm{s}\\right]$\n[Velocity of light $\\left.\\mathrm{c}=3 \\times 10^{8} \\frac{\\mathrm{m}}{\\mathrm{s}}\\right]$\n$\\left[\\right.$ charge on electron $\\left.=1 \\cdot 6 \\times 10^{-19} \\mathrm{C}\\right]$", "image": null}, "options": [{"id": "XNMjA", "text": "$3 \\mathrm{~V}, 4000 Å$", "image": null, "isCorrect": false}, {"id": "dpofi", "text": "$4 \\mathrm{~V}, 6000 Å$", "image": null, "isCorrect": false}, {"id": "bGHgL", "text": "$1 \\mathrm{~V}, 1000 Å$", "image": null, "isCorrect": false}, {"id": "8zSvB", "text": "$2 \\mathrm{~V}, 3000 Å$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "(D)\n$\\begin{array}{l}\n(\\mathrm{k} \\cdot \\mathrm{E})_{\\max }=\\mathrm{eV}_{\\mathrm{s}}=3.2 \\times 10^{-19} \\mathrm{~J} \\\\\n\\therefore \\mathrm{V}_{\\mathrm{s}}=\\frac{3.2 \\times 10^{-19}}{1.6 \\times 10^{-19}}=2 \\mathrm{~V}\n\\end{array}$\nIn the given options, only option (D) has $\\mathrm{V}_{\\mathrm{s}}=2 \\mathrm{~V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fdb0279619d9d8a1fc9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "The threshold wavelengths for photoelectric emission from two metals $\\mathrm{A}$ and $\\mathrm{B}$\nare $400 \\mathrm{~nm}$ and $800 \\mathrm{~nm}$ respectively. The ratio of their work functions, $\\phi_{A}$ to $\\phi$ ?\nis", "image": null}, "options": [{"id": "noIem", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "bkCGI", "text": "4", "image": null, "isCorrect": false}, {"id": "NKa3X", "text": "$\\frac{1}{4}$", "image": null, "isCorrect": false}, {"id": "wQS6w", "text": "2", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "(D)\nwork function $\\phi=\\frac{h c}{\\lambda_{0}}$\n$\\therefore \\frac{\\phi_{B}}{\\phi_{A}}=\\frac{\\lambda_{B}}{\\lambda_{A}}=\\frac{800}{400}=2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fdb0279619d9d8a1fc8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "The variation of stopping potential for metals A, B, $C$ and D with frequency of\nincident radiation is as shown in the figure. For which metal, stopping potential is\nhigher for lower values of threshold frequency $\\left(v_{o}\\right)$ ?\n[The frequency of incident radiation, ' $v^{\\prime}$ is same.]\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/CooVkQ6zP54g-vAU2kxw2cs0K26gsIELDYIEpDCUEHE.original.fullsize.png\">", "image": null}, "options": [{"id": "mkWSD", "text": "C", "image": null, "isCorrect": false}, {"id": "GHjOt", "text": "$\\mathrm{D}$", "image": null, "isCorrect": false}, {"id": "yMlmO", "text": "$\\mathrm{A}$", "image": null, "isCorrect": true}, {"id": "ha9Ne", "text": "B", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(B)\nThe electrons will have greater kinetic energy for the metal which have smaller threshold frequency (and hence work function). Hence stopping potential will be higher for them. Hence metal A will have higher stopping potential.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fc40279619d9d8a1f14", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "The graph of kinetic energy against the frequency $(\\mathrm{V})$ of incident light is as shown in the figure. The slope of the graph and intercept on $X$ axis respectively are\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/y0lptVQKuKQmueU1SJ1IbVE1P993BcsUdmFNZn4Rf6I.original.fullsize.png\">", "image": null}, "options": [{"id": "b4FW1", "text": "Planck's constant, threshold frequency", "image": null, "isCorrect": true}, {"id": "NaebF", "text": "work function, maximum K.E", "image": null, "isCorrect": false}, {"id": "pugLM", "text": "maximum K.E, threshold frequency", "image": null, "isCorrect": false}, {"id": "LPTCQ", "text": "Planck's constant, work function", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(A)\n$\\mathrm{KE}=\\mathrm{h} v-\\phi_{0}$\n$y=m x-c$\n$\\therefore \\mathrm{m}=\\mathrm{h}, \\mathrm{c}=\\phi_{0}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fc30279619d9d8a1f0f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "The light of wavelength $\\lambda^{\\prime}$ incident on the surface of metal having work function $\\phi$ emits the electrons. The maximum velocity of electrons emitted is $(c=$ velocity of light, h=Planck's constant, m=mass of electron $)$", "image": null}, "options": [{"id": "JnM2h", "text": "$\\left[\\frac{2(\\mathrm{~h} \\mathrm{C}-\\phi)}{\\mathrm{m} \\lambda}\\right]$", "image": null, "isCorrect": false}, {"id": "SRTQi", "text": "$\\left[\\frac{2(\\mathrm{~h} \\mathrm{c}-\\lambda \\phi)}{\\mathfrak{m \\lambda}}\\right]^{\\frac{1}{2}}$", "image": null, "isCorrect": true}, {"id": "BwsPP", "text": "$\\left[\\frac{2(h \\mathrm{C}-\\lambda)}{m \\lambda}\\right]^{\\frac{1}{2}}$", "image": null, "isCorrect": false}, {"id": "0fdFJ", "text": "$\\left[\\frac{2(\\mathrm{~h} \\mathrm{v}-\\phi) \\lambda}{\\mathrm{mC}}\\right]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(C)\n$\\mathrm{hv}-\\phi=\\mathrm{E}_{\\max }=\\frac{1}{2} \\mathrm{mv}^{2}$\n$\\frac{\\mathrm{hc}}{\\lambda}-\\phi=\\frac{1}{2} \\mathrm{mv}^{2}$\n$\\mathrm{v}^{2}=2 \\frac{(\\mathrm{hc}-\\lambda \\phi)}{\\lambda \\mathrm{m}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fb40279619d9d8a1e9a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "The maximum velocity of the photoelectron emitted by the metal surface is 'V'. Charge and mass of the photoelectron is denoted by 'e' and 'm' respectivley. The stopping potential in volt is", "image": null}, "options": [{"id": "BVWls", "text": "$\\frac{V^{2}}{\\left(\\frac{m}{e}\\right)}$", "image": null, "isCorrect": false}, {"id": "p4ITd", "text": "$\\frac{\\mathrm{V}^{2}}{2\\left(\\frac{\\mathrm{e}}{\\mathrm{m}}\\right)}$", "image": null, "isCorrect": true}, {"id": "Qeo7L", "text": "$\\frac{V^{2}}{\\left(\\frac{e}{m}\\right)}$", "image": null, "isCorrect": false}, {"id": "yEclJ", "text": "$\\frac{\\mathrm{V}^{2}}{2\\left(\\frac{\\mathrm{m}}{\\mathrm{e}}\\right)}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\frac{1}{2} \\mathrm{mv}^{2}=\\mathrm{eV}_{\\mathrm{s}}$\n$\\therefore \\mathrm{V}_{\\mathrm{s}}=\\frac{1}{2}\\left(\\frac{\\mathrm{m}}{\\mathrm{e}}\\right) \\mathrm{v}^{2}=\\frac{\\mathrm{v}^{2}}{2\\left(\\frac{\\mathrm{e}}{\\mathrm{m}}\\right)}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25faf0279619d9d8a1e74", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "Energy of the incident photon on the metal surface is ' $3 \\mathrm{~W}$ ' and then ' $5 \\mathrm{~W}$ ', where 'W' is the work function for that metal. The ratio of velocities of emitted photoelectrons is", "image": null}, "options": [{"id": "Wkjzv", "text": "$1: \\sqrt{2}$", "image": null, "isCorrect": true}, {"id": "Bxvr6", "text": "$1: 1$", "image": null, "isCorrect": false}, {"id": "k7oyo", "text": "$1: 2$", "image": null, "isCorrect": false}, {"id": "oAhB4", "text": "$1: 4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\frac{1}{2} m v_{1}^{2}=3 W-W=2 W \\\\\n& \\frac{1}{2} m v_{2}^{2}=5 W-W=4 W \\\\\n& \\frac{v_{1}^{2}}{v_{2}^{2}}=\\frac{1}{2} \\\\\n\\therefore & \\frac{v_{1}}{v_{2}}=\\frac{1}{\\sqrt{2}}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f9d0279619d9d8a1de3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "Light of incident frequency 2 times the threshold frequency is incident on a photosensitive material. If the incident frequency is made $\\left(\\frac{1}{3}\\right)^{\\text {rd }}$ and intensity is doubled then the photoelectric current will", "image": null}, "options": [{"id": "tCynR", "text": "decrease.", "image": null, "isCorrect": false}, {"id": "LT1qe", "text": "increase.", "image": null, "isCorrect": false}, {"id": "wEuQk", "text": "be halved.", "image": null, "isCorrect": false}, {"id": "PtTLS", "text": "be zero.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "No Solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f9c0279619d9d8a1ddf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "When a photosensitive surface is irradiated by lights of wavelengths $\\lambda_{1}$ and $\\lambda_{2}$, kinetic energies of emitted photoelectrons are $\\mathrm{E}_{1}$ and $\\mathrm{E}_{2}$ respectively. The work function of the photosensitive surface is", "image": null}, "options": [{"id": "ABMMV", "text": "$\\frac{\\lambda_{2} E_{2}-\\lambda_{1} E_{1}}{\\lambda_{2}-\\lambda_{1}}$", "image": null, "isCorrect": false}, {"id": "84chm", "text": "$\\frac{\\lambda_{1} E_{1}+\\lambda_{2} E_{2}}{\\lambda_{2}+\\lambda_{1}}$", "image": null, "isCorrect": false}, {"id": "mr4pL", "text": "$\\frac{\\lambda_{1} E_{1}-\\lambda_{2} E_{2}}{\\lambda_{2}-\\lambda_{1}}$", "image": null, "isCorrect": true}, {"id": "hNcD0", "text": "$\\frac{\\lambda_{2} E_{1}+\\lambda_{2} E_{2}}{\\lambda_{2}-\\lambda_{1}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using photoclutic effect\n\\(\\frac{h c_{1}}{\\lambda_{1}}=\\phi+k_{1}-(D)\\) ...(i)\nand \\(\\frac{h_{1}}{r_{2}}=\\phi k k_{2}\\)  ...(ii)\nform (i) and (i)\n\\(\\frac{\\frac{h n_{1}}{\\lambda_{1}}}{\\frac{h_{2}}{\\lambda_{2}}}=\\frac{\\min (\\eta) \\text { an }}{\\phi+k_{1}}\\)\n\\(\\Rightarrow \\frac{1}{d_{1}} \\times \\frac{d_{2}}{1}=\\frac{\\phi+k_{1}}{\\phi+k_{2}}\\)\n\\(\\Rightarrow \\frac{d_{2}}{n_{1}}=\\frac{\\phi+4}{\\phi+b_{2}}\\)\n\\(\\Rightarrow \\lambda_{2} \\phi+k_{2} d_{2}=\\lambda_{1} \\phi+d_{1} k_{1}\\)\n\\(\\Rightarrow d_{2} \\phi-\\lambda_{1} \\phi=\\lambda_{1} k_{1}-k_{2} d_{2}\\) \n\\(\\therefore=\\frac{d_{1} k_{1}-k_{2} d_{2}}{d_{2}-d_{1}}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f8c0279619d9d8a1d5c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "In experiment of photoelectric effect, the stopping potential for a given metal is\n${ }^{\\prime} \\mathrm{V}_{0}{ }^{\\prime}$ volt, when radiation of wavelength ${ }^{\\prime} \\lambda_{0}{ }^{\\prime}$ is used. If radiation of wavelength ${ }^{\\prime} 2 \\lambda_{0}{ }^{\\prime}$\nis used for the same metal, then the stopping potential (in volt) will be $[\\mathrm{e}=$ charge\non electron, $\\mathrm{c}=$ speed of light, $\\mathrm{h}=$ Planck's constant.]", "image": null}, "options": [{"id": "mchKo", "text": "$\\mathrm{V}_{0}+\\frac{\\mathrm{hc}}{2 \\mathrm{e} \\lambda_{0}}$", "image": null, "isCorrect": false}, {"id": "Fum0A", "text": "$\\mathrm{~V}_{0}-\\frac{\\mathrm{hc}}{2 \\mathrm{e} \\lambda_{0}}$", "image": null, "isCorrect": true}, {"id": "kybgS", "text": "$\\frac{V_{0}}{2}$", "image": null, "isCorrect": false}, {"id": "LpVXj", "text": "$2 \\mathrm{~V}_{0}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$h v-\\omega_{0}=e V_{0}$\n$\\frac{h c}{\\lambda_{0}}-\\omega_{0}=e V_{0}$\n$\\frac{h c}{2 \\lambda_{0}}-\\omega_{0}=e V_{s}$\n$=\\frac{h c}{\\lambda_{0}}\\left[1-\\frac{1}{2}\\right]=e\\left(V_{0}-V_{s}\\right)=e V_{0}-e V_{s}$\n$V_{s}=V_{0}-\\frac{h c}{2 \\lambda_{0} e}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f8a0279619d9d8a1d4b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "If the frequency of incident radiation is kept constant and the experiment is\nrepeated by using incident light of different intensities, then stopping potential\n$\\left(\\mathrm{V}_{\\mathrm{s}}\\right)$", "image": null}, "options": [{"id": "9QdML", "text": "increases with increase in intensity.", "image": null, "isCorrect": false}, {"id": "KNdKI", "text": "decreases with increase in intensity.", "image": null, "isCorrect": false}, {"id": "N87EN", "text": "depends upon current.", "image": null, "isCorrect is independent of the intensity of light.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f790279619d9d8a1cbf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}], "question": {"text": "When light of wavelength ' $\\lambda$ ' is incident on photosensitive surface, photons of power\n'P' are emitted. The number of photons (n) emitted in 't' second is\n(h= Planck's constant, $\\mathrm{c}=$ velocity of light in vacuum)", "image": null}, "options": [{"id": "mtId6", "text": "$\\frac{h \\mathrm{C}}{\\mathrm{P} \\lambda t}$", "image": null, "isCorrect": false}, {"id": "H1kS0", "text": "$\\frac{P \\lambda t}{h_{C}}$", "image": null, "isCorrect": true}, {"id": "qJsiZ", "text": "$\\frac{\\mathrm{P} \\lambda}{\\operatorname{htc}}$", "image": null, "isCorrect": false}, {"id": "bb3pM", "text": "$\\frac{h \\mathrm{P}}{\\lambda t \\mathbf{C}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Energy of each photon $=\\frac{h c}{\\lambda}$\nIf $n$ photons are emitted in time $t$ then the energy emitted in time $t$ is $\\frac{\\text { nhc }}{\\lambda}$\n$\\begin{aligned} \\text { Power P } &=\\text { Energy emitted per second } \\\\ &=\\frac{\\mathrm{nhc}}{\\lambda \\mathrm{t}} \\\\ \\therefore \\mathrm{n} &=\\frac{\\mathrm{P} \\lambda \\mathrm{t}}{\\mathrm{hc}} \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f690279619d9d8a1c45", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}], "question": {"text": "A metal surface having work function ' $\\mathrm{w}_{0}{ }^{\\prime}$ emits photoelectrons when photons of energy 'E' are incident on it. The electron enters the uniform magnetic field (B) in perpendicular direction and moves in circular path of radius 'r'. Then 'r' is equal to (m and e be the mass and charge of electron respectively).", "image": null}, "options": [{"id": "cVEYj", "text": "$\\frac{\\sqrt{m\\left(E-W_{0}\\right)}}{e B}$", "image": null, "isCorrect": false}, {"id": "d6XZ1", "text": "$\\frac{m\\left(\\mathrm{E}-\\mathrm{W}_{\\mathrm{O}}\\right)}{\\mathrm{eB}}$", "image": null, "isCorrect": false}, {"id": "uuVVG", "text": "$\\frac{\\sqrt{2 m\\left(E-W_{0}\\right)}}{\\mathbf{e B}}$", "image": null, "isCorrect": true}, {"id": "tReij", "text": "$\\frac{2 m\\left(E-w_{0}\\right)}{e B}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Kinetic energy of the electron $\\mathrm{K}=\\mathrm{E}-\\omega_{0}$\nMomentum $P=\\sqrt{2 m k}=\\sqrt{2 m\\left(E-\\omega_{\\mathrm{o}}\\right)}$\nRadius of the circular path $r=\\frac{P}{e B}=\\frac{\\sqrt{2 m\\left(E-\\omega_{0}\\right)}}{e B}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f660279619d9d8a1c2b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}], "question": {"text": "Using Einstein's photoelectric equation, the graph between the K-E.(E) of photoelectrons emitted and the frequency of incident radiation ( $\\mathrm{v}$ ) is shown correctly in figure\n(A)\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/S-DAX9XfK9YgrvhgULdrMm1zWMr8SWKjoSxLMg1ABXs.original.fullsize.png\"><br>\n(B)<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/jGVQIZywZM2lohNCYOwlKIQYeYj8dzleUmMgusBkzWk.original.fullsize.png\"><br>\n(C)<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/nCVGUJcUqpj_VIFHy8Jf9mbCF7mNGNGlyMUYujYztOs.original.fullsize.png\"><br>\n(D)<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/WS_vh9mQqI45EO9khedD9RnvFwJU85Xu97IuSs6qJpU.original.fullsize.png\">", "image": null}, "options": [{"id": "A03d9", "text": "(C)", "image": null, "isCorrect": false}, {"id": "49AOE", "text": "(A)", "image": null, "isCorrect": true}, {"id": "hPpCF", "text": "(D)", "image": null, "isCorrect": false}, {"id": "fGKAn", "text": "(B)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Theory question", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f550279619d9d8a1ba2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "When the work function of a metal increases, maximum kinetic energy of emitted\nphotoelectrons", "image": null}, "options": [{"id": "08B3Q", "text": "first decreases and then increases.", "image": null, "isCorrect": false}, {"id": "VFkkG", "text": "increases.", "image": null, "isCorrect": false}, {"id": "tXHvS", "text": "remains same.", "image": null, "isCorrect": false}, {"id": "9MIvm", "text": "decreases.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "(K.E.) $_{\\max }=h v-w_{0}$\nHence if $w_{0}$ increase (K.E.) $_{\\max }$\nDecreases", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f430279619d9d8a1b11", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}], "question": {"text": "Threshold frequency for a metal is $15 \\times 10^{14} \\mathrm{~Hz}$. The light of wavelength $6000 Å$\nfalls on the metal surface. Which one of the following statements is correct?\n[velocity of light, $\\left.\\mathrm{c}=3 \\times 10^{8} \\mathrm{~m} / \\mathrm{s}\\right]$", "image": null}, "options": [{"id": "7TbHW", "text": "photoelectrons are emitted with velocity c.", "image": null, "isCorrect": false}, {"id": "5hBiq", "text": "photoelectrons come out with velocity $3 \\times 10^{6} \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "0cpSG", "text": "photoelectrons come out with zero velocity.", "image": null, "isCorrect": false}, {"id": "HfaBd", "text": "photoelectrons will not be emitted.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\nv_{0} &=15 \\times 10^{14} \\mathrm{~Hz} \\\\\n\\therefore \\lambda_{0}=\\frac{C}{v} &=\\frac{3 \\times 10^{8}}{15 \\times 10^{14}} \\\\\n&=2 \\times 10^{-7} \\mathrm{~m} \\\\\n&=2000 Å \\\\\n\\lambda &=6000 Å\n\\end{aligned}\n$$\nSince $\\lambda>\\lambda_{0}$, photo electrons will not be emitted", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f300279619d9d8a1a78", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}], "question": {"text": "If the frequency of incident light falling on a metallic surface is doubled, maximum kinetic energy of emitted photoelectrons", "image": null}, "options": [{"id": "uLqKC", "text": "increases to slightly more than double.", "image": null, "isCorrect": true}, {"id": "bvOnJ", "text": "remains the same.", "image": null, "isCorrect": false}, {"id": "7Dd6h", "text": "becomes twice.", "image": null, "isCorrect": false}, {"id": "LjKQq", "text": "decreases to slightly more than double.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f1e0279619d9d8a19e6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}], "question": {"text": "If intensity of incident radiation in a photocell is increased, the stopping potential", "image": null}, "options": [{"id": "h5IR3", "text": "first increases and then decreases.", "image": null, "isCorrect": false}, {"id": "SN0fp", "text": "remains unchanged.", "image": null, "isCorrect": true}, {"id": "2PkWM", "text": "decreases.", "image": null, "isCorrect": false}, {"id": "6iA9U", "text": "increases.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The stopping potential does not depend on the intensity of incident light.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f1a0279619d9d8a19cd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}], "question": {"text": "The maximum velocity of the photoelectron emitted by the metal surface is 'v'. Charge and mass of the photoelectron is denoted by 'e' and 'm' respectively. The\nstopping potential in volt is", "image": null}, "options": [{"id": "vqomx", "text": "$\\frac{v^{2}}{\\left(\\frac{m}{e}\\right)}$", "image": null, "isCorrect": false}, {"id": "ash58", "text": "$\\frac{v^{2}}{\\left(\\frac{e}{m}\\right)}$", "image": null, "isCorrect": false}, {"id": "knMZS", "text": "$\\frac{v^{2}}{2\\left(\\frac{m}{e}\\right)}$", "image": null, "isCorrect": false}, {"id": "Iv8EP", "text": "$\\frac{v^{2}}{2\\left(\\frac{e}{m}\\right)}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\frac{1}{2} m v^{2}=e v$\n$v=\\frac{m v^{2}}{2 e}=\\frac{v^{2}}{2\\left(\\frac{e}{m}\\right)}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ee60279619d9d8a1832", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}], "question": {"text": "The maximum velocity of the photoelectron emitted by the metal surface is ‘ <math><mi>V</mi></math> ’. Charge and mass of the photoelectron is denoted by ‘ <math><mi>e</mi></math> ’ and ‘ <math><mi>m</mi></math> ’ respectively. The stopping potential in volt is", "image" ><mi>o</mi></mrow></msub></math> …(2) <br/><math><mfenced separators=\"|\"><mrow><mn>2</mn></mrow></mfenced><mo>-</mo><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced></math>  <br/><math><mi>K</mi><mi mathvariant=\"normal\">'</mi><mo>-</mo><mi>K</mi><mo>=</mo><mi>h</mi><mi>v</mi></math>  <br/><math><mo>&#8658;</mo><msup><mrow><mi>K</mi></mrow><mrow><mi>'</mi></mrow></msup><mo>=</mo><mi mathvariant=\"normal\">K</mi><mo>+</mo><mi>h</mi><mi>v</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f060279619d9d8a192e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}], "question": {"text": "A metal surface is illuminated by light of given intensity and frequency to cause photoemission. If the intensity of illumination is reduced to one fourth of its original value then the maximum KE of the emitted photoelectrons would be", "image": null}, "options": [{"id": "UqAyd", "text": "Twice the original value", "image": null, "isCorrect": false}, {"id": "dgWnX", "text": "Four times the original value", "image": null, "isCorrect": false}, {"id": "sLP7x", "text": "One fourth of the original value", "image": null, "isCorrect": false}, {"id": "6Qyyc", "text": "Unchanged", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The maximum kinetic energy of photoelectrons is given by <math><mi>K</mi><msub><mrow><mi>E</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi m /mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "mikEw", "text": "<math><mn>4</mn><mi>λ</mi></math>", "image": null, "isCorrect": true}, {"id": "i7Ozo", "text": "<math><mn>6</mn><mi>λ</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given for a metal, wavelength of light used = <math><mi>λ</mi><mi></mi></math> stopping potential =V <br/>If <math><msub><mrow><mi>λ</mi></mrow><mrow><mn>0</mn></mrow></msub></math> be the threshold wavelength, then maximum kinetic energy of emitted electrons <br/><math><msub><mrow><mi>K</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">x</mi></mrow></msub><mo>=</mo><mi>h</mi><mi>c</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mi>λ</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac></mrow></mfenced></math> …(i) <br/>Again, wavelength of used light <br/><math><msup><mrow><mi>λ</mi></mrow><mrow><mi>'</mi></mrow></msup><mo>=</mo><mn>2</mn><mi>λ</mi></math>  <br/>Stopping potential, V’ <math><mo>=</mo><mfrac><mrow><mi>V</mi></mrow><mrow><mn>3</mn></mrow></mfrac></math>  <br/>then <math><msub><mrow><mi>K</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">x</mi></mrow></msub><mo>=</mo><mi>h</mi><mi>c</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mi>λ</mi></mrow></mfrac><mo>,</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac></mrow></mfenced></math>  <br/><math><mo>⇒</mo><mi>e</mi><msup><mrow><mi>V</mi></mrow><mrow><mi>'</mi></mrow></msup><mi>h</mi><mi>c</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><mi>λ</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>0</mn></mrow><
