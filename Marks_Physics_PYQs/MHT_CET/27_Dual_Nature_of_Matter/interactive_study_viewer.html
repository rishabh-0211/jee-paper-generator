l": "B", "text": "is proportional to momentum", "isCorrect": false, "image": null}, {"id": "ryxtB", "label": "C", "text": "is inversely proportional to momentum", "isCorrect": true, "image": null}, {"id": "yHOxz", "label": "D", "text": "does not depend on momentum", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The de-Broglie wavelength $\\lambda$ of a moving particle is given by the relation:<br><br>$\\lambda = \\dfrac{h}{p}$<br><br>where $h$ is Planck's constant and $p$ is the momentum of the particle.<br><br>Since $h$ is a constant, we have:<br><br>$\\lambda \\propto \\dfrac{1}{p}$<br><br>Thus, the de-Broglie wavelength is inversely proportional to the momentum of the particle.", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88bc15a9fc0fc8c1467f", "type": "singleCorrect", "question": {"text": "The ratio of de-Broglie wavelengths of molecules of hydrogen and helium which are at temperatures $27^\\circ C$ and $127^\\circ C$ respectively is ($m_{He} = 2m_{H_2}$)", "image": null}, "options": [{"id": "pI1cv", "label": "A", "text": "$\\sqrt{\\dfrac{2}{1}}$", "isCorrect": false, "image": null}, {"id": "KHaPg", "label": "B", "text": "$\\sqrt{\\dfrac{8}{3}}$", "isCorrect": true, "image": null}, {"id": "e79TW", "label": "C", "text": "$\\sqrt{\\dfrac{2}{3}}$", "isCorrect": false, "image": null}, {"id": "V6TQ3", "label": "D", "text": "$\\sqrt{\\dfrac{6}{7}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The de-Broglie wavelength of a gas molecule is given by $\\lambda = \\dfrac{h}{\\sqrt{3mkT}}$.<br><br>Thus, $\\lambda \\propto \\dfrac{1}{\\sqrt{mT}}$.<br><br>For hydrogen and helium molecules, the ratio of their de-Broglie wavelengths is:<br><br>$\\dfrac{\\lambda_{H_2}}{\\lambda_{He}} = \\sqrt{\\dfrac{m_{He} T_{He}}{m_{H_2} T_{H_2}}}$<br><br>Given $m_{He} = 2m_{H_2}$, $T_{H_2} = 27^\\circ C = 300$ K, and $T_{He} = 127^\\circ C = 400$ K.<br><br>Substituting these values:<br><br>$\\dfrac{\\lambda_{H_2}}{\\lambda_{He}} = \\sqrt{\\dfrac{2m_{H_2} \\times 400}{m_{H_2} \\times 300}} = \\sqrt{\\dfrac{8}{3}}$<br><br>Answer: $\\sqrt{\\dfrac{8}{3}}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a58c30a4553e1bdb47", "type": "singleCorrect", "question": {"text": "The ratio of de-Broglie wavelength of an $\\alpha$-particle and proton accelerated from rest by the same potential is $\\dfrac{1}{\\sqrt{m}}$. The value of $m$ is", "image": null}, "options": [{"id": "V2mjR", "label": "A", "text": "$2$", "isCorrect": false, "image": null}, {"id": "QeazX", "label": "B", "text": "$8$", "isCorrect": true, "image": null}, {"id": "AfTLf", "label": "C", "text": "$4$", "isCorrect": false, "image": null}, {"id": "GC7Ap", "label": "D", "text": "$5$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The de-Broglie wavelength of a particle accelerated through a potential difference $V$ is given by $\\lambda = \\dfrac{h}{\\sqrt{2m_0 qV}}$, where $m_0$ is the mass and $q$ is the charge of the particle.<br><br>For a proton: mass $m_p$, charge $q_p = e$.<br><br>For an $\\alpha$-particle: mass $m_\\alpha = 4m_p$, charge $q_\\alpha = 2e$.<br><br>The ratio of their de-Broglie wavelengths is:<br><br>$\\dfrac{\\lambda_\\alpha}{\\lambda_p} = \\sqrt{\\dfrac{m_p q_p}{m_\\alpha q_\\alpha}}$<br><br>Substituting the values:<br><br>$\\dfrac{\\lambda_\\alpha}{\\lambda_p} = \\sqrt{\\dfrac{m_p \\times e}{4m_p \\times 2e}} = \\sqrt{\\dfrac{1}{8}} = \\dfrac{1}{\\sqrt{8}}$<br><br>Given that the ratio is $\\dfrac{1}{\\sqrt{m}}$, comparing the two expressions gives $m = 8$.<br><br>Answer: $8$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3508c30a4553e1be26a", "type": "singleCorrect", "question": {"text": "The proton and $\\alpha$ - particle are accelerated through same potential difference. Then the ratio of the de-Broglie wavelength of proton and $\\alpha$ - particle is (mass of $\\alpha$-particle is $4$ times mass of proton, charge of $\\alpha$-particle is $2$ times charge of proton)", "image": null}, "options": [{"id": "CyMTT", "label": "A", "text": "$3\\sqrt{3}$", "isCorrect": false, "image": null}, {"id": "oRdyA", "label": "B", "text": "$3\\sqrt{2}$", "isCorrect": false, "image": null}, {"id": "LN3xh", "label": "C", "text": "$2\\sqrt{3}$", "isCorrect": false, "image": null}, {"id": "r6qaC", "label": "D", "text": "$2\\sqrt{2}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The de-Broglie wavelength of a particle accelerated through a potential difference $V$ is given by:<br><br>$\\lambda = \\dfrac{h}{\\sqrt{2mqV}}$<br><br>For a proton:<br><br>$\\lambda_p = \\dfrac{h}{\\sqrt{2m_p q_p V}}$<br><br>For an $\\alpha$-particle:<br><br>$\\lambda_\\alpha = \\dfrac{h}{\\sqrt{2m_\\alpha q_\\alpha V}}$<br><br>The ratio of their de-Broglie wavelengths is:<br><br>$\\dfrac{\\lambda_p}{\\lambda_\\alpha} = \\sqrt{\\dfrac{m_\\alpha q_\\alpha}{m_p q_p}}$<br><br>Given $m_\\alpha = 4m_p$ and $q_\\alpha = 2q_p$, substituting these values:<br><br>$\\dfrac{\\lambda_p}{\\lambda_\\alpha} = \\sqrt{\\dfrac{4m_p \\times 2q_p}{m_p q_p}} = \\sqrt{8} = 2\\sqrt{2}$<br><br>Answer: $2\\sqrt{2}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ed8c30a4553e1bde4f", "type": "singleCorrect", "question": {"text": "The de Broglie wavelength of the electron in the ground state is $\\lambda_1$ and that in the $n = 3$ level is $\\lambda_3$ then $\\lambda_3$ is given by", "image": null}, "options": [{"id": "kXl2w", "label": "A", "text": "$\\dfrac{\\lambda_1}{3}$", "isCorrect": false, "image": null}, {"id": "9Y1sj", "label": "B", "text": "$\\dfrac{\\lambda_1}{2}$", "isCorrect": false, "image": null}, {"id": "kvIa9", "label": "C", "text": "$2\\lambda_1$", "isCorrect": false, "image": null}, {"id": "Em717", "label": "D", "text": "$3\\lambda_1$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "According to Bohr's quantization condition:<br><br>$mvr = \\dfrac{nh}{2\\pi}$<br><br>The de Broglie wavelength of an electron is given by $\\lambda = \\dfrac{h}{mv}$.<br><br>Substituting $mv = \\dfrac{h}{\\lambda}$ into the quantization condition, we get:<br><br>$2\\pi r = n\\lambda \\Rightarrow \\lambda = \\dfrac{2\\pi r}{n}$<br><br>In a hydrogen-like atom, the radius of the $n$-th orbit is proportional to $n^2$, so $r_n = r_1 n^2$.<br><br>Therefore, the de Broglie wavelength in the $n$-th orbit is:<br><br>$\\lambda_n = \\dfrac{2\\pi (r_1 n^2)}{n} = n(2\\pi r_1)$<br><br>For the ground state ($n=1$), $\\lambda_1 = 2\\pi r_1$.<br><br>For the $n=3$ level, the de Broglie wavelength is:<br><br>$\\lambda_3 = 3(2\\pi r_1) = 3\\lambda_1$<br><br>Answer: $3\\lambda_1$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3258c30a4553e1be0a8", "type": "singleCorrect", "question": {"text": "If the kinetic energy of a particle is increased to 16 times, the percentage change in the de Broglie wavelength of a particle is", "image": null}, "options": [{"id": "rfWLa", "label": "A", "text": "$40\\ \\%$", "isCorrect": false, "image": null}, {"id": "NTrsE", "label": "B", "text": "$60\\ \\%$", "isCorrect": false, "image": null}, {"id": "AQcTd", "label": "C", "text": "$75\\ \\%$", "isCorrect": true, "image": null}, {"id": "msjeF", "label": "D", "text": "$80\\ \\%$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The de Broglie wavelength of a particle is given by $\\lambda = \\dfrac{h}{\\sqrt{2mK}}$, where $K$ is the kinetic energy.<br><br>Let the initial kinetic energy be $K_1 = K$ and the initial wavelength be $\\lambda_1 = \\lambda$.<br><br>The final kinetic energy is given as $K_2 = 16K$.<br><br>The final wavelength is $\\lambda_2 = \\dfrac{h}{\\sqrt{2m(16K)}} = \\dfrac{1}{4} \\dfrac{h}{\\sqrt{2mK}} = \\dfrac{\\lambda}{4}$.<br><br>The percentage change in the de Broglie wavelength is $\\dfrac{\\lambda_2 - \\lambda_1}{\\lambda_1} \\times 100\\%$.<br><br>Substituting the values, we get $\\dfrac{\\dfrac{\\lambda}{4} - \\lambda}{\\lambda} \\times 100\\% = -\\dfrac{3}{4} \\times 100\\% = -75\\%$.<br><br>The magnitude of the percentage change is $75\\%$.<br><br>Answer: $75\\ \\%$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3418c30a4553e1be1d4", "type": "singleCorrect", "question": {"text": "The ratio of the accelerating potentials required to accelerate (i) an $\\alpha$-particle and (ii) a proton to have the same de Broglie wavelength associated with them is<br>(mass of $\\alpha$ - particle = $6.4 \\times 10^{-27}$ kg, mass of proton = $1.6 \\times 10^{-27}$ kg)", "image": null}, "options": [{"id": "NChEQ", "label": "A", "text": "$1 : 8$", "isCorrect": true, "image": null}, {"id": "xJsRI", "label": "B", "text": "$1 : 4$", "isCorrect": false, "image": null}, {"id": "yGmCS", "label": "C", "text": "$8 : 1$", "isCorrect": false, "image": null}, {"id": "PI7vR", "label": "D", "text": "$4 : 1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The de Broglie wavelength is given by $\\lambda = \\dfrac{h}{\\sqrt{2mqV}}$.<br><br>Since the de Broglie wavelengths are the same, $\\lambda_{\\alpha} = \\lambda_{p}$.<br><br>$\\dfrac{h}{\\sqrt{2m_{\\alpha}q_{\\alpha}V_{\\alpha}}} = \\dfrac{h}{\\sqrt{2m_{p}q_{p}V_{p}}}$<br><br>$m_{\\alpha}q_{\\alpha}V_{\\alpha} = m_{p}q_{p}V_{p}$<br><br>$\\dfrac{V_{\\alpha}}{V_{p}} = \\dfrac{m_{p}q_{p}}{m_{\\alpha}q_{\\alpha}}$<br><br>Given $m_{\\alpha} = 6.4 \\times 10^{-27}$ kg and $m_{p} = 1.6 \\times 10^{-27}$ kg, we have $m_{\\alpha} = 4m_{p}$.<br><br>The charge of an $\\alpha$-particle is twice that of a proton, so $q_{\\alpha} = 2q_{p}$.<br><br>$\\dfrac{V_{\\alpha}}{V_{p}} = \\dfrac{m_{p} \\times q_{p}}{4m_{p} \\times 2q_{p}} = \\dfrac{1}{8}$<br><br>The ratio is $1 : 8$.<br><br>Answer: $1 : 8$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c38c30a4553e1bdc8d", "type": "singleCorrect", "question": {"text": "The kinetic energy of a free electron increases to 3 times the previous K.E. The ratio of new de-Broglie wavelength to previous de-Broglie wavelength is", "image": null}, "options": [{"id": "sjLFs", "label": "A", "text": "$\\dfrac{1}{\\sqrt{3}}$", "isCorrect": true, "image": null}, {"id": "rW9Hb", "label": "B", "text": "$\\dfrac{1}{3}$", "isCorrect": false, "image": null}, {"id": "cZ0qA", "label": "C", "text": "$3$", "isCorrect": false, "image": null}, {"id": "HDJwq", "label": "D", "text": "$\\sqrt{3}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The de-Broglie wavelength of an electron is given by $\\lambda = \\dfrac{h}{p} = \\dfrac{h}{\\sqrt{2mK}}$<br><br>where $K$ is the kinetic energy of the electron.<br><br>From the relation, $\\lambda \\propto \\dfrac{1}{\\sqrt{K}}$<br><br>Given that the new kinetic energy $K_2 = 3K_1$.<br><br>The ratio of the new de-Broglie wavelength to the previous de-Broglie wavelength is<br><br>$\\dfrac{\\lambda_2}{\\lambda_1} = \\sqrt{\\dfrac{K_1}{K_2}}$<br><br>$\\dfrac{\\lambda_2}{\\lambda_1} = \\sqrt{\\dfrac{K_1}{3K_1}} = \\dfrac{1}{\\sqrt{3}}$<br><br>Answer: $\\dfrac{1}{\\sqrt{3}}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2958c30a4553e1bdaa3", "type": "singleCorrect", "question": {"text": "An electron accelerated through a potential difference $V_1$ has a de-Broglie wavelength of $\\lambda$. When the potential is changed to $V_2$, its de-Broglie wavelength increases to $2\\lambda$. The value of $(V_1/V_2)$ is equal to", "image": null}, "options": [{"id": "z3M0N", "label": "A", "text": "$3:1$", "isCorrect": false, "image": null}, {"id": "2vLTX", "label": "B", "text": "$9:4$", "isCorrect": false, "image": null}, {"id": "pZBa1", "label": "C", "text": "$3:2$", "isCorrect": false, "image": null}, {"id": "0zTce", "label": "D", "text": "$4:1$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The de-Broglie wavelength of an electron accelerated through a potential difference $V$ is given by $\\lambda = \\dfrac{h}{\\sqrt{2meV}}$.<br><br>This implies $\\lambda \\propto \\dfrac{1}{\\sqrt{V}}$, or $V \\propto \\dfrac{1}{\\lambda^2}$.<br><br>For the first case, $V_1 \\propto \\dfrac{1}{\\lambda^2}$.<br><br>For the second case, $V_2 \\propto \\dfrac{1}{(2\\lambda)^2} = \\dfrac{1}{4\\lambda^2}$.<br><br>Taking the ratio of the two potentials:<br><br>$\\dfrac{V_1}{V_2} = \\dfrac{\\dfrac{1}{\\lambda^2}}{\\dfrac{1}{4\\lambda^2}} = 4$<br><br>Thus, $\\dfrac{V_1}{V_2} = 4:1$.<br><br>Answer: $4:1$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d35a8c30a4553e1be2d3", "type": "singleCorrect", "question": {"text": "According to de-Broglie hypothesis, the ratio of the wave-length of a photon and that of an electron having same energy 'E' is (m = mass of electron, c = velocity of light)", "image": null}, "options": [{"id": "ZMvlw", "label": "A", "text": "$\\dfrac{1}{C}\\sqrt{\\dfrac{E}{2m}}$", "isCorrect": false, "image": null}, {"id": "qoAL3", "label": "B", "text": "$C\\sqrt{\\dfrac{E}{2m}}$", "isCorrect": false, "image": null}, {"id": "WQ1Eu", "label": "C", "text": "$C\\sqrt{\\dfrac{2m}{E}}$", "isCorrect": true, "image": null}, {"id": "nIB2w", "label": "D", "text": "$\\sqrt{\\dfrac{2mC}{E}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a photon of energy $E$, the wavelength $\\lambda_p$ is given by:<br><br>$\\lambda_p = \\dfrac{hc}{E}$<br><br>For an electron of kinetic energy $E$, the momentum $p$ is given by $p = \\sqrt{2mE}$.<br><br>According to the de-Broglie hypothesis, the wavelength $\\lambda_e$ of the electron is:<br><br>$\\lambda_e = \\dfrac{h}{p} = \\dfrac{h}{\\sqrt{2mE}}$<br><br>The ratio of the wavelength of the photon to that of the electron is:<br><br>$\\dfrac{\\lambda_p}{\\lambda_e} = \\dfrac{\\dfrac{hc}{E}}{\\dfrac{h}{\\sqrt{2mE}}} = \\dfrac{hc}{E} \\times \\dfrac{\\sqrt{2mE}}{h} = c\\sqrt{\\dfrac{2mE}{E^2}} = c\\sqrt{\\dfrac{2m}{E}}$<br><br>Answer: $C\\sqrt{\\dfrac{2m}{E}}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871beabf9280d7f9932d99", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $E_p$ and $E_e$ represent kinetic energy of photon and electron respectively. If de-Broglie wavelength $\\lambda_p$ of a photon is twice the de-Broglie wavelength $\\lambda_e$ of electron, then $E_e / E_p$ is (Speed of electron $=\\frac{\\mathrm{C}}{100}$, where 'C' is the velocity of light)", "image": null}, "options": [{"id": "dU0xV", "text": "$1 \\times 10^{-2}$", "image": null, "isCorrect": true}, {"id": "RDRfo", "text": "$2 \\times 10^{-2}$", "image": null, "isCorrect": false}, {"id": "JslMG", "text": "$4 \\times 10^{-2}$", "image": null, "isCorrect": false}, {"id": "spNqg", "text": "$8 \\times 10^{-2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The kinetic energy of an electron is given by:<br><br>$E_e = \\dfrac{1}{2}mv^2 = \\dfrac{1}{2}(mv)v$<br><br>Using the de-Broglie wavelength relation for the electron, $\\lambda_e = \\dfrac{h}{mv}$, we can write $mv = \\dfrac{h}{\\lambda_e}$. Substituting this into the kinetic energy equation:<br><br>$E_e = \\dfrac{1}{2}\\left(\\dfrac{h}{\\lambda_e}\\right)v = \\dfrac{hv}{2\\lambda_e}$<br><br>The energy of a photon is given by:<br><br>$E_p = \\dfrac{hc}{\\lambda_p}$<br><br>Taking the ratio of the kinetic energy of the electron to the energy of the photon:<br><br>$\\dfrac{E_e}{E_p} = \\dfrac{\\dfrac{hv}{2\\lambda_e}}{\\dfrac{hc}{\\lambda_p}} = \\dfrac{v}{2c} \\times \\dfrac{\\lambda_p}{\\lambda_e}$<br><br>We are given that the de-Broglie wavelength of the photon is twice that of the electron ($\\lambda_p = 2\\lambda_e$) and the speed of the electron is $v = \\dfrac{c}{100}$. Substituting these values into the ratio:<br><br>$\\dfrac{E_e}{E_p} = \\dfrac{\\dfrac{c}{100}}{2c} \\times \\dfrac{2\\lambda_e}{\\lambda_e}$<br><br>$\\dfrac{E_e}{E_p} = \\dfrac{1}{200} \\times 2 = \\dfrac{1}{100} = 1 \\times 10^{-2}$<br><br>Answer: $1 \\times 10^{-2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bd7bf9280d7f9932cea", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Let $E_e$ and $E_p$ represents kinetic energy of electron and photon respectively. If de-Broglie wavelength of a photon is twice the de-Broglie wavelength of an electron then $E_p / E_e$ is (speed of electron $=C / 100$ where $C$ is the velocity of light)", "image": null}, "options": [{"id": "WlF0E", "text": "10", "image": null, "isCorrect": false}, {"id": "zejNS", "text": "$10^2$", "image": null, "isCorrect": true}, {"id": "8sJGK", "text": "$10^3$", "image": null, "isCorrect": false}, {"id": "Cqvp2", "text": "$10^4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a photon, the energy is given by $E_p = \\dfrac{hc}{\\lambda_p}$.<br><br>For an electron, the kinetic energy is $E_e = \\dfrac{1}{2}mv^2$ and its de-Broglie wavelength is $\\lambda_e = \\dfrac{h}{mv}$.<br><br>Given that the de-Broglie wavelength of the photon is twice that of the electron:<br>$\\lambda_p = 2\\lambda_e$<br><br>Substituting $\\lambda_e$ into the equation for $E_p$:<br>$E_p = \\dfrac{hc}{2\\lambda_e} = \\dfrac{hc}{2\\left(\\dfrac{h}{mv}\\right)} = \\dfrac{mvc}{2}$<br><br>Now, taking the ratio of the energy of the photon to the kinetic energy of the electron:<br>$\\dfrac{E_p}{E_e} = \\dfrac{\\dfrac{mvc}{2}}{\\dfrac{1}{2}mv^2} = \\dfrac{c}{v}$<br><br>We are given that the speed of the electron is $v = \\dfrac{c}{100}$.<br><br>Therefore, the ratio is:<br>$\\dfrac{E_p}{E_e} = \\dfrac{c}{\\dfrac{c}{100}} = 100 = 10^2$<br><br>Answer: $10^2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bc8bf9280d7f9932c5e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The wavelength ' $\\lambda$ ' of a photon and the de-Broglie wavelength of an electron have same value. the ratio of kinetic energy of the electron to the energy of a photon is\n( $\\mathrm{m}=$ mass of electron, $\\mathrm{c}=$ velocity of light, $\\mathrm{h}=$ Planck's constant)", "image": null}, "options": [{"id": "FdeUe", "text": "$\\frac{2 \\lambda m c}{h}$", "image": null, "isCorrect": false}, {"id": "M6MGJ", "text": "$\\frac{\\lambda \\mathrm{mc}}{\\mathrm{h}}$", "image": null, "isCorrect": false}, {"id": "Rai5B", "text": "$\\frac{h}{2 \\lambda m c}$", "image": null, "isCorrect": true}, {"id": "3lmaV", "text": "$\\frac{\\mathrm{h}}{\\lambda \\mathrm{mc}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The energy of a photon of wavelength $\\lambda$ is given by:<br><br>$E_p = \\dfrac{hc}{\\lambda}$<br><br>The de-Broglie wavelength of an electron is given by $\\lambda = \\dfrac{h}{p}$, which gives the momentum of the electron as:<br><br>$p = \\dfrac{h}{\\lambda}$<br><br>The kinetic energy of the electron is:<br><br>$E_e = \\dfrac{p^2}{2m} = \\dfrac{h^2}{2m\\lambda^2}$<br><br>The ratio of the kinetic energy of the electron to the energy of the photon is:<br><br>$\\dfrac{E_e}{E_p} = \\dfrac{\\dfrac{h^2}{2m\\lambda^2}}{\\dfrac{hc}{\\lambda}} = \\dfrac{h^2}{2m\\lambda^2} \\times \\dfrac{\\lambda}{hc} = \\dfrac{h}{2\\lambda mc}$<br><br>Answer: $\\frac{h}{2 \\lambda m c}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bb7bf9280d7f9932bd3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "An electron of mass ' m ' and charge ' e ' initially at rest gets accelerated by a constant electric field ' $E$ '. The rate of change of de-Broglie wavelength of the electron at time ' $t$ ' is (Ignore relativistic effect) ( $\\mathrm{h}=$ Planck's constant)", "image": null}, "options": [{"id": "DBLO9", "text": "$-\\frac{\\mathrm{h}}{\\mathrm{eEt}^2}$", "image": null, "isCorrect": true}, {"id": "B80Cd", "text": "$-\\frac{\\mathrm{eEt}}{\\mathrm{h}}$", "image": null, "isCorrect": false}, {"id": "kjyw4", "text": "$\\frac{-\\mathrm{mh}}{\\mathrm{eEt}^2}$", "image": null, "isCorrect": false}, {"id": "oHMTH", "text": "$-\\frac{\\mathrm{h}}{\\mathrm{eE}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Force on the electron is $F = eE$<br><br>Acceleration of the electron is $a = \\dfrac{F}{m} = \\dfrac{eE}{m}$<br><br>Velocity of the electron at time $t$ is $v = u + at = 0 + \\left(\\dfrac{eE}{m}\\right)t = \\dfrac{eEt}{m}$<br><br>Momentum of the electron is $p = mv = m \\left(\\dfrac{eEt}{m}\\right) = eEt$<br><br>The de-Broglie wavelength is given by $\\lambda = \\dfrac{h}{p} = \\dfrac{h}{eEt}$<br><br>The rate of change of de-Broglie wavelength is $\\dfrac{d\\lambda}{dt} = \\dfrac{d}{dt}\\left(\\dfrac{h}{eEt}\\right) = -\\dfrac{h}{eEt^2}$<br><br>Answer: $-\\frac{\\mathrm{h}}{\\mathrm{eEt}^2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b98bf9280d7f9932ab1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Electron beam when accelerated by a voltage of 10 kV , has a de-Broglie wavelength ' $\\lambda$ '. If the voltage is increased to 20 kV then the de-Broglie wavelength associated with the electron beam would be", "image": null}, "options": [{"id": "JHHbi", "text": "$4 \\lambda$", "image": null, "isCorrect": false}, {"id": "O7M0e", "text": "$2 \\lambda$", "image": null, "isCorrect": false}, {"id": "cjnW6", "text": "$\\frac{\\lambda}{2}$", "image": null, "isCorrect": false}, {"id": "TqdXq", "text": "$\\frac{\\lambda}{\\sqrt{2}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The de-Broglie wavelength of an electron accelerated by a potential difference $V$ is given by $\\lambda = \\dfrac{h}{\\sqrt{2meV}}$.<br><br>This implies $\\lambda \\propto \\dfrac{1}{\\sqrt{V}}$.<br><br>Taking the ratio of wavelengths for two different voltages:<br><br>$\\dfrac{\\lambda_2}{\\lambda_1} = \\sqrt{\\dfrac{V_1}{V_2}}$<br><br>Substituting $V_1 = 10 \\text{ kV}$, $V_2 = 20 \\text{ kV}$, and $\\lambda_1 = \\lambda$:<br><br>$\\dfrac{\\lambda_2}{\\lambda} = \\sqrt{\\dfrac{10}{20}} = \\dfrac{1}{\\sqrt{2}}$<br><br>$\\lambda_2 = \\dfrac{\\lambda}{\\sqrt{2}}$<br><br>Answer: $\\frac{\\lambda}{\\sqrt{2}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b86bf9280d7f9932a08", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The energy that should be added to an electron to reduce its de-Broglie wavelength from $\\lambda$ to $\\frac{\\lambda}{2}$ is n times the initial energy. The value of ' n ' is", "image": null}, "options": [{"id": "1GnMn", "text": "4", "image": null, "isCorrect": false}, {"id": "caLfG", "text": "3", "image": null, "isCorrect": true}, {"id": "SqTgr", "text": "2", "image": null, "isCorrect": false}, {"id": "97qaL", "text": "1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The de-Broglie wavelength of an electron is given by $\\lambda = \\dfrac{h}{\\sqrt{2mE}}$, where $E$ is the kinetic energy.<br><br>Squaring both sides, we get $E = \\dfrac{h^2}{2m\\lambda^2}$.<br><br>Let the initial energy be $E_1 = \\dfrac{h^2}{2m\\lambda^2}$.<br><br>When the wavelength is reduced to $\\dfrac{\\lambda}{2}$, the final energy becomes $E_2 = \\dfrac{h^2}{2m\\left(\\dfrac{\\lambda}{2}\\right)^2} = 4 \\dfrac{h^2}{2m\\lambda^2} = 4E_1$.<br><br>The energy that should be added is $\\Delta E = E_2 - E_1 = 4E_1 - E_1 = 3E_1$.<br><br>Given that the added energy is $n$ times the initial energy, we have $nE_1 = 3E_1$.<br><br>Thus, $n = 3$.<br><br>Answer: 3", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b75bf9280d7f993296d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The de-Broglie wavelength of a neutron at $27^{\\circ} \\mathrm{C}$ is ' $\\lambda_0$ '. What will be its wavelength at $927^{\\circ} \\mathrm{C}$ ?", "image": null}, "options": [{"id": "f827S", "text": "$\\frac{\\lambda_0}{4}$", "image": null, "isCorrect": false}, {"id": "fjUbS", "text": "$\\frac{\\lambda_0}{3}$", "image": null, "isCorrect": false}, {"id": "kaNd4", "text": "$\\frac{\\lambda_0}{2}$", "image": null, "isCorrect": true}, {"id": "w1e6F", "text": "$\\frac{3 \\lambda_0}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The de-Broglie wavelength of a particle in thermal equilibrium at temperature $T$ is given by $\\lambda = \\dfrac{h}{\\sqrt{2mE}}$.<br><br>Since the kinetic energy $E = \\dfrac{3}{2}kT$, we get $\\lambda = \\dfrac{h}{\\sqrt{3mkT}}$.<br><br>Thus, $\\lambda \\propto \\dfrac{1}{\\sqrt{T}}$.<br><br>Given $T_1 = 27^{\\circ} \\mathrm{C} = 300 \\mathrm{K}$ and $T_2 = 927^{\\circ} \\mathrm{C} = 1200 \\mathrm{K}$.<br><br>$\\dfrac{\\lambda_2}{\\lambda_1} = \\sqrt{\\dfrac{T_1}{T_2}}$<br><br>$\\dfrac{\\lambda_2}{\\lambda_0} = \\sqrt{\\dfrac{300}{1200}} = \\sqrt{\\dfrac{1}{4}} = \\dfrac{1}{2}$<br><br>$\\lambda_2 = \\dfrac{\\lambda_0}{2}$<br><br>Answer: $\\frac{\\lambda_0}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b45bf9280d7f99327b3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The de-Broglie wavelength $(\\lambda)$ of a particle starting from rest", "image": null}, "options": [{"id": "8JCNB", "text": "is inversely proportional to impulse.", "image": null, "isCorrect": true}, {"id": "dc1dA", "text": "does not depend on impulse.", "image": null, "isCorrect": false}, {"id": "FgFLa", "text": "is proportional to mass.", "image": null, "isCorrect": false}, {"id": "69Bon", "text": "is proportional to impulse.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Impulse is defined as the change in momentum of a particle.<br><br>$J = \\Delta p = p_f - p_i$<br><br>Since the particle starts from rest, its initial momentum $p_i = 0$.<br><br>$J = p_f = p$<br><br>The de-Broglie wavelength is given by:<br><br>$\\lambda = \\dfrac{h}{p}$<br><br>Substituting $p = J$, we get:<br><br>$\\lambda = \\dfrac{h}{J}$<br><br>$\\lambda \\propto \\dfrac{1}{J}$<br><br>Therefore, the de-Broglie wavelength is inversely proportional to impulse.<br><br>Answer: is inversely proportional to impulse.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b37bf9280d7f9932730", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A light of wavelength $\\lambda$ is incident on a photosensitive surface of negligible work function. The photoelectrons emitted from the surface have de-Broglie wavelength $\\lambda_1$. Then ratio $\\lambda: \\lambda_1^2$ is ( $\\mathrm{h}=$ Planck's constant, $\\mathrm{c}=$ velocity of light, $\\mathrm{m}=$ mass of electron)", "image": null}, "options": [{"id": "FHAw1", "text": "$4 \\mathrm{mc}: \\mathrm{h}$", "image": null, "isCorrect": false}, {"id": "LWMAE", "text": "$2 c: h$", "image": null, "isCorrect": false}, {"id": "Jou9P", "text": "$2 \\mathrm{mc}: \\mathrm{h}$", "image": null, "isCorrect": true}, {"id": "oyjg4", "text": "$2 \\mathrm{mh}: \\mathrm{c}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Einstein's photoelectric equation, the maximum kinetic energy of the emitted photoelectron is given by $K = \\dfrac{hc}{\\lambda} - \\Phi$.<br><br>Since the work function $\\Phi$ is negligible, $K = \\dfrac{hc}{\\lambda}$.<br><br>The de-Broglie wavelength of the emitted photoelectron is $\\lambda_1 = \\dfrac{h}{p} = \\dfrac{h}{\\sqrt{2mK}}$.<br><br>Squaring both sides, we get $\\lambda_1^2 = \\dfrac{h^2}{2mK}$.<br><br>Substituting $K = \\dfrac{hc}{\\lambda}$, we obtain $\\lambda_1^2 = \\dfrac{h^2}{2m \\left(\\dfrac{hc}{\\lambda}\\right)} = \\dfrac{h \\lambda}{2mc}$.<br><br>Rearranging the terms to find the ratio $\\lambda : \\lambda_1^2$, we get $\\dfrac{\\lambda}{\\lambda_1^2} = \\dfrac{2mc}{h}$.<br><br>Thus, the ratio is $2mc : h$.<br><br>Answer: $2 \\mathrm{mc}: \\mathrm{h}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b0bbf9280d7f99325eb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "An electron accelerated by a potential difference 'V' has de-Broglie wavelength ' $\\lambda$ '. If the electron is accelerated by a potential difference ' 9 V ', its de-Broglie wavelength will be", "image": null}, "options": [{"id": "ws8zu", "text": "$\\frac{\\lambda}{4.5}$", "image": null, "isCorrect": false}, {"id": "aIvN2", "text": "$\\frac{\\lambda}{3}$", "image": null, "isCorrect": true}, {"id": "VRbp2", "text": "$\\frac{\\lambda}{2}$", "image": null, "isCorrect": false}, {"id": "G5uiT", "text": "$\\lambda$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The de-Broglie wavelength of an electron accelerated by a potential difference $V$ is given by<br><br>$\\lambda = \\dfrac{h}{\\sqrt{2meV}}$<br><br>This implies that $\\lambda \\propto \\dfrac{1}{\\sqrt{V}}$<br><br>For the first case, the wavelength is $\\lambda$ at potential $V$.<br><br>For the second case, let the wavelength be $\\lambda'$ at potential $9V$.<br><br>Taking the ratio of the two wavelengths:<br><br>$\\dfrac{\\lambda'}{\\lambda} = \\sqrt{\\dfrac{V}{9V}}$<br><br>$\\dfrac{\\lambda'}{\\lambda} = \\dfrac{1}{3}$<br><br>$\\lambda' = \\dfrac{\\lambda}{3}$<br><br>Answer: $\\frac{\\lambda}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792143f0aee93fa0796df24", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "Kinetic energy of a proton is equal to energy $E$ of a photon. Let ' $\\lambda_1$ ' be the de-Broglie wavelength of proton and ' $\\lambda_2$ ' be the wavelength of photon. If $\\left(\\frac{\\lambda_1}{\\lambda_2}\\right) \\propto \\mathrm{E}^{\\mathrm{n}}$ then the value of ' $n$ ' is", "image": null}, "options": [{"id": "GPcWW", "text": "1", "image": null, "isCorrect": false}, {"id": "q9tBO", "text": "2", "image": null, "isCorrect": false}, {"id": "LE6tj", "text": "5", "image": null, "isCorrect": false}, {"id": "9IRwR", "text": "0.5", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let the kinetic energy of the proton be $K$. We are given $K = E$.<br><br>The de-Broglie wavelength of the proton is given by:<br>$\\lambda_1 = \\dfrac{h}{p} = \\dfrac{h}{\\sqrt{2mK}} = \\dfrac{h}{\\sqrt{2mE}}$<br><br>The energy of the photon is given by:<br>$E = \\dfrac{hc}{\\lambda_2} \\Rightarrow \\lambda_2 = \\dfrac{hc}{E}$<br><br>Taking the ratio of $\\lambda_1$ to $\\lambda_2$:<br>$\\dfrac{\\lambda_1}{\\lambda_2} = \\dfrac{\\dfrac{h}{\\sqrt{2mE}}}{\\dfrac{hc}{E}} = \\dfrac{h}{\\sqrt{2mE}} \\times \\dfrac{E}{hc} = \\dfrac{1}{c\\sqrt{2m}} E^{1/2}$<br><br>Since $c$ and $m$ are constants, we have:<br>$\\dfrac{\\lambda_1}{\\lambda_2} \\propto E^{1/2}$<br><br>Comparing this with $\\dfrac{\\lambda_1}{\\lambda_2} \\propto E^n$, we get $n = 0.5$.<br><br>Answer: 0.5", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792142c0aee93fa0796de8a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "When an electron orbiting in hydrogen atom in its ground state jumps to higher excited state, the de-Broglie wavelength associated with it", "image": null}, "options": [{"id": "jNWrk", "text": "will become zero.", "image": null, "isCorrect": false}, {"id": "PiKcm", "text": "will remain same.", "image": null, "isCorrect": false}, {"id": "uTzg7", "text": "will decrease.", "image": null, "isCorrect": false}, {"id": "S1GeU", "text": "will increase.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The de-Broglie wavelength of an electron is given by $\\lambda = \\dfrac{h}{mv}$.<br><br>In a hydrogen atom, the velocity of an electron in the $n$-th orbit is inversely proportional to the principal quantum number $n$, i.e., $v \\propto \\dfrac{1}{n}$.<br><br>Therefore, the de-Broglie wavelength $\\lambda \\propto n$.<br><br>When the electron jumps from the ground state to a higher excited state, the principal quantum number $n$ increases. Consequently, the de-Broglie wavelength associated with the electron will increase.<br><br>Answer: will increase.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214090aee93fa0796dd75", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "Electrons are accelerated through a potential difference of 16 kV . If the potential difference is increased to 64 kV , then de-Broglie wavelength associated with electron will", "image": null}, "options": [{"id": "MfCDz", "text": "remain same.", "image": null, "isCorrect": false}, {"id": "osF0l", "text": "becomes half.", "image": null, "isCorrect": true}, {"id": "6q3l4", "text": "becomes four time.", "image": null, "isCorrect": false}, {"id": "ihmdW", "text": "becomes quarter.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The de-Broglie wavelength of an electron accelerated through a potential difference $V$ is given by<br><br>$\\lambda = \\dfrac{h}{\\sqrt{2meV}}$<br><br>This implies $\\lambda \\propto \\dfrac{1}{\\sqrt{V}}$<br><br>Given $V_1 = 16$ kV and $V_2 = 64$ kV.<br><br>$\\dfrac{\\lambda_2}{\\lambda_1} = \\sqrt{\\dfrac{V_1}{V_2}} = \\sqrt{\\dfrac{16}{64}} = \\sqrt{\\dfrac{1}{4}} = \\dfrac{1}{2}$<br><br>$\\lambda_2 = \\dfrac{\\lambda_1}{2}$<br><br>The de-Broglie wavelength becomes half.<br><br>Answer: becomes half.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e40aee93fa0796dc57", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "If the potential difference used to accelerate electrons is doubled, by what factor does the deBroglie wavelength $(\\lambda)$ associated with the electrons change?", "image": null}, "options": [{"id": "79NYM", "text": "$\\lambda$ is increased to $\\sqrt{2}$ times.", "image": null, "isCorrect": false}, {"id": "5E5iX", "text": "$\\lambda$ is increased to $\\frac{1}{\\sqrt{2}}$ times.", "image": null, "isCorrect": false}, {"id": "8Rgmh", "text": "$\\lambda$ is decreased to $\\frac{1}{\\sqrt{2}}$ times.", "image": null, "isCorrect": true}, {"id": "BIO8g", "text": "$\\lambda$ is decreased to $\\sqrt{2}$ times.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The de Broglie wavelength of an electron accelerated by a potential difference $V$ is given by $\\lambda = \\dfrac{h}{\\sqrt{2meV}}$.<br><br>When the potential difference is doubled, $V' = 2V$.<br><br>The new de Broglie wavelength is $\\lambda' = \\dfrac{h}{\\sqrt{2me(2V)}} = \\dfrac{1}{\\sqrt{2}} \\dfrac{h}{\\sqrt{2meV}} = \\dfrac{\\lambda}{\\sqrt{2}}$.<br><br>Thus, the wavelength is decreased to $\\dfrac{1}{\\sqrt{2}}$ times its original value.<br><br>Answer: $\\lambda$ is decreased to $\\frac{1}{\\sqrt{2}}$ times.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ce0aee93fa0796dba8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "Radius of first orbit in H -atom is ' $\\mathrm{a}_0$ ' Then, de-Broglie wavelength of electron in the third orbit is", "image": null}, "options": [{"id": "zE4lb", "text": "$3 \\pi \\mathrm{a}_0$", "image": null, "isCorrect": false}, {"id": "ZGKF6", "text": "$6 \\pi \\mathrm{a}_0$", "image": null, "isCorrect": true}, {"id": "RjCVB", "text": "$9 \\pi \\mathrm{a}_0$", "image": null, "isCorrect": false}, {"id": "HV3Bt", "text": "$12 \\pi \\mathrm{a}_0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The radius of the $n$-th orbit of a hydrogen atom is given by $r_n = n^2 a_0$.<br><br>For the third orbit ($n = 3$), the radius is $r_3 = 3^2 a_0 = 9 a_0$.<br><br>According to Bohr's postulate of angular momentum quantization, $mvr = \\dfrac{nh}{2\\pi}$.<br><br>The de-Broglie wavelength of an electron is $\\lambda = \\dfrac{h}{mv}$.<br><br>Substituting $mv = \\dfrac{h}{\\lambda}$ into Bohr's postulate, we get $2\\pi r = n\\lambda$.<br><br>For the third orbit ($n = 3$), $2\\pi r_3 = 3\\lambda$.<br><br>$\\lambda = \\dfrac{2\\pi (9 a_0)}{3} = 6\\pi a_0$.<br><br>Answer: $6 \\pi \\mathrm{a}_0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213be0aee93fa0796db2c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "If the potential difference used to accelerate electrons is increased four times, by what factor does the de-Broglie wavelength associated with the electrons change?", "image": null}, "options": [{"id": "VtpX6", "text": "Wavelength increased two times", "image": null, "isCorrect": false}, {"id": "SsHGJ", "text": "Wavelength decreased to half", "image": null, "isCorrect": true}, {"id": "MH8Gs", "text": "Wavelength increased four times", "image": null, "isCorrect": false}, {"id": "HG2j1", "text": "Wavelength remains the same", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The de-Broglie wavelength of an electron accelerated through a potential difference $V$ is given by $\\lambda = \\dfrac{h}{\\sqrt{2meV}}$.<br><br>When the potential difference is increased four times, the new potential difference is $V' = 4V$.<br><br>The new de-Broglie wavelength is $\\lambda' = \\dfrac{h}{\\sqrt{2me(4V)}} = \\dfrac{1}{2} \\dfrac{h}{\\sqrt{2meV}} = \\dfrac{\\lambda}{2}$.<br><br>Thus, the wavelength is decreased to half.<br><br>Answer: Wavelength decreased to half", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213820aee93fa0796d959", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "The kinetic energy of an electron is increased by $200\\%$, then the de-Broglie wavelength associated with it changes by a factor of", "image": null}, "options": [{"id": "G6tgH", "text": "$\\dfrac{1}{3}$", "image": null, "isCorrect": false}, {"id": "FSG41", "text": "$\\dfrac{1}{\\sqrt{3}}$", "image": null, "isCorrect": true}, {"id": "UACz0", "text": "3", "image": null, "isCorrect": false}, {"id": "OFFin", "text": "$\\sqrt{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the initial kinetic energy be $K_1 = K$<br><br>Since the kinetic energy is increased by $200\\%$, the final kinetic energy is $K_2 = K + \\dfrac{200}{100}K = 3K$<br><br>The de-Broglie wavelength is given by $\\lambda = \\dfrac{h}{\\sqrt{2mK}}$<br><br>This implies $\\lambda \\propto \\dfrac{1}{\\sqrt{K}}$<br><br>$\\dfrac{\\lambda_2}{\\lambda_1} = \\sqrt{\\dfrac{K_1}{K_2}} = \\sqrt{\\dfrac{K}{3K}} = \\dfrac{1}{\\sqrt{3}}$<br><br>The de-Broglie wavelength changes by a factor of $\\dfrac{1}{\\sqrt{3}}$<br><br>Answer: $\\dfrac{1}{\\sqrt{3}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792135e0aee93fa0796d83c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "When the electron orbiting in hydrogen atom in its ground state moves to the third excited state, the de-Broglie wavelength associated with it", "image": null}, "options": [{"id": "kXRHh", "text": "becomes zero.", "image": null, "isCorrect": false}, {"id": "vIRSm", "text": "remains unchanged.", "image": null, "isCorrect": false}, {"id": "bQtQh", "text": "will decrease.", "image": null, "isCorrect": false}, {"id": "TPSct", "text": "will increase.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Bohr's quantization condition, the angular momentum of an electron in the $n$-th orbit is $mvr = \\dfrac{nh}{2\\pi}$.<br><br>The de-Broglie wavelength is given by $\\lambda = \\dfrac{h}{mv}$.<br><br>Substituting $mv$ from the first equation, we get $\\lambda = \\dfrac{2\\pi r}{n}$.<br><br>For a hydrogen atom, the radius of the $n$-th orbit is proportional to the square of the principal quantum number, $r \\propto n^2$.<br><br>Therefore, $\\lambda \\propto \\dfrac{n^2}{n} \\Rightarrow \\lambda \\propto n$.<br><br>When the electron moves from the ground state ($n=1$) to the third excited state ($n=4$), the principal quantum number $n$ increases.<br><br>Hence, the de-Broglie wavelength associated with the electron will increase.<br><br>Answer: will increase.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213470aee93fa0796d787", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "The ratio of the wavelength of a photon of energy ' $E$ ' to that of the electron of same energy is ( $\\mathrm{m}=$ mass of an electron, $\\mathrm{c}=$ speed of light, $\\mathrm{h}=$ Planck's constant)", "image": null}, "options": [{"id": "c5AAe", "text": "$\\sqrt{\\dfrac{\\mathrm{m}}{\\mathrm{cE}}}$", "image": null, "isCorrect": false}, {"id": "d3ncK", "text": "$\\sqrt{\\dfrac{2 \\mathrm{~m}}{\\mathrm{cE}}}$", "image": null, "isCorrect": false}, {"id": "rTbME", "text": "$\\mathrm{c} \\sqrt{\\dfrac{\\mathrm{m}}{\\mathrm{E}}}$", "image": null, "isCorrect": false}, {"id": "Vhoz8", "text": "$\\mathrm{c} \\sqrt{\\dfrac{2 \\mathrm{~m}}{\\mathrm{E}}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The wavelength of a photon of energy $E$ is given by $\\lambda_p = \\dfrac{hc}{E}$<br><br>The de Broglie wavelength of an electron of kinetic energy $E$ is given by $\\lambda_e = \\dfrac{h}{\\sqrt{2mE}}$<br><br>The ratio of their wavelengths is:<br><br>$\\dfrac{\\lambda_p}{\\lambda_e} = \\dfrac{\\dfrac{hc}{E}}{\\dfrac{h}{\\sqrt{2mE}}}$<br><br>$\\dfrac{\\lambda_p}{\\lambda_e} = \\dfrac{hc}{E} \\times \\dfrac{\\sqrt{2mE}}{h} = c \\sqrt{\\dfrac{2m}{E}}$<br><br>Answer: $\\mathrm{c} \\sqrt{\\dfrac{2 \\mathrm{~m}}{\\mathrm{E}}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2627a0279619d9d8a34d7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "When radiation of wavelength ' $\\lambda$ ' is incident on a metallic surface, the stopping potential is $4.8 \\mathrm{~V}$. If the surface is illuminated with radiation of double the wavelength then the stopping potential becomes $1.6 \\mathrm{~V}$.' The threshold wavelength for the surface is", "image": null}, "options": [{"id": "pWxtt", "text": "$2 \\lambda$", "image": null, "isCorrect": false}, {"id": "kR149", "text": "$4 \\lambda$", "image": null, "isCorrect": true}, {"id": "3wVZu", "text": "$6 \\lambda$", "image": null, "isCorrect": false}, {"id": "kyHFm", "text": "$8 \\lambda$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Stopping potential:\n$\\begin{aligned}\n& \\mathrm{eV}_0=\\mathrm{h} v-\\phi_0 \\\\\n& \\mathrm{eV}_0=\\frac{\\mathrm{hc}}{\\lambda}-\\phi_0\n\\end{aligned}$\nFor first case: $\\mathrm{e}(4.8)=\\frac{\\mathrm{hc}}{\\lambda}-\\phi_0... (i)$\nFor Second case: $e(1.6)=\\frac{h c}{2 \\lambda}-\\phi_0... (ii)$\nDividing equation (i) by equation (ii),\n$\\begin{aligned}\n& 3\\left(\\frac{\\mathrm{hc}}{2 \\lambda}-\\phi_0\\right)=\\frac{\\mathrm{hc}}{\\lambda}-\\phi_0 \\\\\n\\therefore \\quad & \\frac{3 \\mathrm{hc}}{2 \\lambda}-3 \\phi_0=\\frac{\\mathrm{hc}}{\\lambda}-\\phi_0 \\\\\n& \\frac{\\mathrm{hc}}{2 \\lambda}=2 \\phi_0 \\\\\n& \\frac{\\mathrm{hc}}{4 \\lambda}=\\phi_0\n\\end{aligned}$\n$\\therefore \\quad$ Threshold wavelength is $4 \\lambda$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262670279619d9d8a343f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "If the radius of the first Bohr orbit is ' $r$ ' then the de-Broglie wavelength of the electron in the $4^{\\text {th }}$ orbit will be", "image": null}, "options": [{"id": "AjsNX", "text": "$4 \\pi r$", "image": null, "isCorrect": false}, {"id": "ek56H", "text": "$6 \\pi r$", "image": null, "isCorrect": false}, {"id": "mspS6", "text": "$8 \\pi r$", "image": null, "isCorrect": true}, {"id": "BMRk5", "text": "$\\frac{\\pi \\mathrm{r}}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Bohr's second postulate, $\\frac{\\mathrm{nh}}{2 \\pi}=\\mathrm{mvr}_{\\mathrm{n}}$\n$\\therefore \\quad$ de-Broglie wavelength, $\\lambda_{\\mathrm{n}}=\\frac{\\mathrm{h}}{\\mathrm{mv}}=\\frac{2 \\pi \\mathrm{r}_{\\mathrm{n}}}{\\mathrm{n}}$ \nAlso, $r_n \\propto n^2$\n$\\therefore \\quad$ The de-Broglie wavelength of the electron in the $4^{\\text {th }}$ orbit is:\n$$\n\\begin{aligned}\n\\quad \\lambda_4 & =\\frac{2 \\pi r_4}{4}=\\frac{2 \\pi \\times(16 r)}{4} \\\\\n\\therefore \\quad \\lambda_4 & =8 \\pi \\mathrm{r}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262660279619d9d8a3438", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "The de-Broglie wavelength $(\\lambda)$ of a particle is related to its kinetic energy $(\\mathrm{E})$ as", "image": null}, "options": [{"id": "4yJpt", "text": "$\\lambda \\propto \\mathrm{E}$", "image": null, "isCorrect": false}, {"id": "GOsUG", "text": "$\\lambda \\propto \\mathrm{E}^{-1}$", "image": null, "isCorrect": false}, {"id": "mH0kM", "text": "$\\lambda \\propto \\mathrm{E}^{\\frac{1}{2}}$", "image": null, "isCorrect": false}, {"id": "XJlhg", "text": "$\\lambda \\propto \\mathrm{E}^{-\\frac{1}{2}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "De-Broglie wavelength, $\\lambda=\\frac{\\mathrm{h}}{\\sqrt{2 \\mathrm{mE}}}$ $\\therefore \\quad \\lambda \\propto \\mathrm{E}^{-\\frac{1}{2}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262530279619d9d8a339a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "Dual nature of light is exhibited by", "image": null}, "options": [{"id": "hC84W", "text": "diffraction as well as photoelectric effect", "image": null, "isCorrect": false}, {"id": "1Hg8P", "text": "diffraction as well as reflection", "image": null, "isCorrect": false}, {"id": "ifoX0", "text": "refraction as well as interference", "image": null, "isCorrect": true}, {"id": "t4Yib", "text": "photoelectric effect", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The dual nature of light is exhibited by diffraction, where light displays wave-like behavior by bending around obstacles. In photoelectric effect, particle-like behaviour is seen. When light strikes a metallic surface, electrons are released.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2622f0279619d9d8a327d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "When an electron is accelerated through a potential ' $\\mathrm{V}$ ', the de-Broglie wavelength associated with it is ' $4 \\lambda$ '. When the accelerating potential is increased to $4 \\mathrm{~V}$, its wavelength will be", "image": null}, "options": [{"id": "IESPh", "text": "$\\frac{\\lambda}{4}$", "image": null, "isCorrect": false}, {"id": "1mgHT", "text": "$\\frac{\\lambda}{2}$", "image": null, "isCorrect": true}, {"id": "KYAWo", "text": "$\\lambda$", "image": null, "isCorrect": false}, {"id": "t98dA", "text": "$2 \\lambda$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\text { We know } \\lambda=\\frac{\\mathrm{h}}{\\sqrt{2 \\mathrm{meV}}} \\\\ & \\Rightarrow \\lambda \\propto \\frac{1}{\\sqrt{\\mathrm{v}}}\\end{aligned}$\n$\\begin{array}{ll} & \\text { Given } \\mathrm{V}=4 \\mathrm{~V} \\\\ \\therefore \\quad & \\lambda \\propto \\frac{1}{\\sqrt{4 \\mathrm{~V}}}=\\frac{4}{2 \\sqrt{\\mathrm{V}}} \\\\ \\therefore \\quad & \\lambda \\text { reduces to } \\frac{\\lambda}{2}\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2622f0279619d9d8a327a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "Graph shows the variation of de-Broglie wavelength $(\\lambda)$ versus $\\frac{1}{\\sqrt{V}}$ where ' $V$ ' is the accelerating potential for four particles A, B, C, $\\mathrm{D}$ carrying same charge but of masses $\\mathrm{m}_1, \\mathrm{~m}_2$, $\\mathrm{m}_3, \\mathrm{~m}_4$. Which on represents a particle of largest mass?\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/M_u0T_vFBmcWyB138ZDROa7eu1euXAohztCXycWxstk.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "VD8Dl", "text": "$\\mathrm{m}_1$", "image": null, "isCorrect": true}, {"id": "Sg4vO", "text": "$\\mathrm{m}_2$", "image": null, "isCorrect": false}, {"id": "iYSH8", "text": "$\\mathrm{m}_3$", "image": null, "isCorrect": false}, {"id": "Bcz6R", "text": "$\\mathrm{m}_4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "de Broglie wayelength $\\lambda=\\frac{\\mathrm{h}}{\\mathrm{p}}$\n$\\therefore \\quad \\lambda=\\frac{\\mathrm{h}}{\\sqrt{2 \\mathrm{mqv}}}$\n$\\therefore \\quad \\lambda \\sqrt{\\mathrm{v}}=\\frac{\\mathrm{h}}{\\sqrt{2 \\mathrm{mq}}} \\Rightarrow \\frac{\\lambda}{\\left(\\frac{1}{\\sqrt{\\mathrm{v}}}\\right)}=\\frac{1}{\\sqrt{2 \\mathrm{mq}}}$\n$\\therefore \\quad$ Slope of the graph $=\\frac{1}{\\sqrt{2 \\mathrm{mq}}}$\nThe slope will be maximum for minimum mass.\n$\\therefore \\quad \\mathrm{m}_4$ is minimum and $\\mathrm{m}_1$ will be minimum.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2621f0279619d9d8a31f7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "The wavelength of radiation emitted is ' $\\lambda_0$ ' when an electron jumps from the second excited state to the first excited state of hydrogen atom. If the electron jumps from the third excited state to the second orbit of the hydrogen atom, the wavelength of the radiation emitted will be $\\frac{20}{x} \\lambda_0$. The value of $x$ is", "image": null}, "options": [{"id": "rOEAU", "text": "$3$", "image": null, "isCorrect": false}, {"id": "wPnLb", "text": "$9$", "image": null, "isCorrect": false}, {"id": "Da2SZ", "text": "$13$", "image": null, "isCorrect": false}, {"id": "BK2u1", "text": "$27$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Rydberg's formula, $\\frac{1}{\\lambda}=\\mathrm{R}\\left(\\frac{1}{\\mathrm{n}_1^2}-\\frac{1}{\\mathrm{n}_2^2}\\right)$\nWhen electron jumps from $2^{\\text {nd }}$ exited state to first exited state, $\\mathrm{n}_2=3, \\mathrm{n}_1=2, \\lambda=\\lambda_0$, we get\n$$\n\\frac{1}{\\lambda_0}=\\mathrm{R}\\left(\\frac{1}{2^2}-\\frac{1}{3^2}\\right)\n$$\nWhen electron jumps from $3^{\\text {rd }}$ exited state to $2^{\\text {nd }}$ orbit,\n$\\mathrm{n}_2=4, \\mathrm{n}_1=2$, we get\n$$\n\\frac{1}{\\lambda}=\\mathrm{R}\\left(\\frac{1}{4^2}-\\frac{1}{2^2}\\right)\n$$\n$$\n\\begin{aligned}\n\\therefore \\quad \\frac{\\lambda}{\\lambda_0} & =\\frac{\\mathrm{R}\\left(\\frac{1}{2^2}-\\frac{1}{3^2}\\right)}{\\mathrm{R}\\left(\\frac{1}{2^2}-\\frac{1}{4^2}\\right)} \\\\\n& =\\frac{5}{36} \\times \\frac{16}{3}=\\frac{20}{27}\n\\end{aligned}\n$$\n$$\n\\begin{aligned}\n& \\therefore \\quad \\lambda=\\frac{20}{27} \\lambda_0 \\\\\n& \\Rightarrow \\mathrm{x}=27\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261e50279619d9d8a302d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "If the potential difference used to accelerate electrons is doubled, by what factor does the de-Broglie wavelength associated with electrons change?", "image": null}, "options": [{"id": "f3RWB", "text": "Wavelength in increased to $\\frac{1}{\\sqrt{2}}$ times.", "image": null, "isCorrect": false}, {"id": "ILMso", "text": "Wavelength in increased to $\\frac{1}{2}$ times.", "image": null, "isCorrect": false}, {"id": "EeBpf", "text": "Wavelength in decreased to $\\frac{1}{\\sqrt{2}}$ times.", "image": null, "isCorrect": true}, {"id": "FoLfd", "text": "Wavelength in decreased to $\\frac{1}{2}$ times.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From $\\lambda=\\frac{\\mathrm{h}}{\\sqrt{2 \\mathrm{mqV}}}$,\n$\\lambda \\propto \\frac{1}{\\sqrt{V}}$\nIf potential difference is doubled, $\\lambda \\propto \\frac{1}{\\sqrt{2 \\mathrm{~V}}}$\n$\\therefore \\quad \\lambda$ is decreased by $\\frac{1}{\\sqrt{2}}$ times.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261cd0279619d9d8a2f76", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "An electron accelerated through a potential difference ' $V_1$ ' has a de-Broglie wavelength ' $\\lambda$ '. When the potential is changed to ' $\\mathrm{V}_2$ ' its de-Broglie wavelength increases by $50 \\%$. The value of $\\left(\\frac{\\mathrm{V}_1}{\\mathrm{~V}_2}\\right)$ is", "image": null}, "options": [{"id": "jXzeQ", "text": "3:1", "image": null, "isCorrect": false}, {"id": "61E2x", "text": "9:4", "image": null, "isCorrect": true}, {"id": "8jOgY", "text": "3:2", "image": null, "isCorrect": false}, {"id": "Ssejr", "text": "4:1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For electron, de Broglie wavelength, $\\lambda=\\frac{1.228}{\\sqrt{\\mathrm{V}}}$ Given: $\\lambda_2=\\lambda_1+0.5 \\lambda_1=1.5 \\lambda_1$\n$\\begin{aligned}\n& \\therefore \\quad \\frac{\\lambda_2}{\\lambda_1}=\\sqrt{\\frac{V_1}{V_2}} \\\\\n& \\quad \\Rightarrow \\frac{V_1}{V_2}=\\left(\\frac{\\lambda_2}{\\lambda_1}\\right)^2=\\left(\\frac{1.5 \\lambda_1}{\\lambda_1}\\right)^2=\\left(\\frac{3}{2}\\right)^2=\\frac{9}{4}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261980279619d9d8a2dd1", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "Graph shows the variation of de-Broglie wavelength $\\lambda$ versus $\\frac{1}{\\sqrt{V}}$ where $V$ is the accelerating potential for four particles, P, Q, R, S carrying same charge but of mass $m_1, m_2, m_3, m_4$. Which one represents a particle of smaller mass?\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/IFYKDklxddBmgQzGHaKlKJrQxGQbz-2t7i0zoJaBjeI.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "EAZUa", "text": "$m_4$", "image": null, "isCorrect": true}, {"id": "2JDdG", "text": "$m_1$", "image": null, "isCorrect": false}, {"id": "rfBXi", "text": "$m_3$", "image": null, "isCorrect": false}, {"id": "qmSZB", "text": "$m_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "De-broglie wavelength,\n$\\lambda=\\frac{h}{p}$\nKinetic energy :\n$\\begin{aligned}\n& K=\\frac{p^2}{2 m}=q V \\\\\n& \\lambda=\\frac{h}{\\sqrt{2 m q V}}\n\\end{aligned}$\nSlope of straight line\n$\\tan \\theta=\\frac{h}{\\sqrt{2 m q}}$\nHence, more is slope of line, less is the mass.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261840279619d9d8a2d39", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "If the kinetic energy of a free electron doubles, its de-Broglie wavelength $\\lambda$ changes by a factor", "image": null}, "options": [{"id": "IdIYh", "text": "$2$", "image": null, "isCorrect": false}, {"id": "fGwGf", "text": "$\\frac{1}{\\sqrt{2}}$", "image": null, "isCorrect": true}, {"id": "EQ6bJ", "text": "$\\sqrt{2}$", "image": null, "isCorrect": false}, {"id": "WxQrp", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\lambda=\\frac{h}{p}=\\frac{h}{\\sqrt{2(K) m}}$\nThus, when kinetic energy $K$ is doubled, the wavelength is changes by a factor of $\\frac{1}{\\sqrt{2}}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261700279619d9d8a2c95", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "The kinetic energy of an electron is tripled, then the de-Broglie wavelength associated with it, will change by a factor", "image": null}, "options": [{"id": "uKuvH", "text": "$\\frac{1}{3}$", "image": null, "isCorrect": false}, {"id": "AelI3", "text": "$3$", "image": null, "isCorrect": false}, {"id": "t9Y8k", "text": "$\\sqrt{3}$", "image": null, "isCorrect": true}, {"id": "uNzkx", "text": "$\\frac{1}{\\sqrt{3}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Relation between kinetic energy and momentum is as follows:\n$P=\\frac{1}{\\sqrt{2 m K}}$\nIf kinetic energy is tripled, the new momentum is given by,\n$P^{\\prime}=\\frac{1}{\\sqrt{2 m(3 K)}}=\\frac{P}{\\sqrt{3}}$\nde-Broglie wavelength of an electron is the following ratio: $\\lambda=\\frac{h}{P}$\nTherefore, on tripling the kinetic energy the wavelength will change to: $\\lambda^{\\prime}=\\frac{h}{P^{\\prime}}=\\sqrt{3}\\left(\\frac{h}{P}\\right)=\\sqrt{3} \\lambda$", "image": null}, "videoSolution": null,
