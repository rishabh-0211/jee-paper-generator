a2634f0279619d9d8a3e0b", "title": "Multiplication of Vectors", "totalQuestions": 33, "questions": [{"_id": "6abb889a15a9fc0fc8c1453e", "type": "singleCorrect", "question": {"text": "A vector $\\vec{A}$ of magnitude $7\\sqrt{2}$ unit, another vector $\\vec{B}$ of magnitude $14$ unit are inclined at an angle of $60^\\circ$. The magnitude of the scalar product $(\\vec{A} \\cdot \\vec{B})$ is $\\left[\\cos(60)^\\circ = \\dfrac{1}{2}\\right]$", "image": null}, "options": [{"id": "5Dot7", "label": "A", "text": "$49\\sqrt{2}$", "isCorrect": true, "image": null}, {"id": "Pb82V", "label": "B", "text": "$7\\sqrt{2}$", "isCorrect": false, "image": null}, {"id": "HrmCv", "label": "C", "text": "$14\\sqrt{2}$", "isCorrect": false, "image": null}, {"id": "wMgAg", "label": "D", "text": "$9\\sqrt{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given, $|\\vec{A}| = 7\\sqrt{2}$ unit<br><br>$|\\vec{B}| = 14$ unit<br><br>Angle between the vectors, $\\theta = 60^\\circ$<br><br>The scalar product of two vectors is given by $\\vec{A} \\cdot \\vec{B} = |\\vec{A}| |\\vec{B}| \\cos\\theta$<br><br>Substituting the given values:<br><br>$\\vec{A} \\cdot \\vec{B} = (7\\sqrt{2})(14) \\cos(60^\\circ)$<br><br>$\\vec{A} \\cdot \\vec{B} = 98\\sqrt{2} \\times \\dfrac{1}{2}$<br><br>$\\vec{A} \\cdot \\vec{B} = 49\\sqrt{2}$<br><br>Answer: $49\\sqrt{2}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883a15a9fc0fc8c141ba", "type": "singleCorrect", "question": {"text": "In a vector $\\vec{p}$, 'x' and 'y' components have magnitudes 2 units and 5 units respectively. A vector $\\vec{q}$, along negative Y axis has magnitude of 3 units. Then $\\vec{p} \\cdot \\vec{q}$ is", "image": null}, "options": [{"id": "beH44", "label": "A", "text": "$-6$", "isCorrect": false, "image": null}, {"id": "I3bTT", "label": "B", "text": "$-9$", "isCorrect": false, "image": null}, {"id": "Q2Spa", "label": "C", "text": "$-10$", "isCorrect": false, "image": null}, {"id": "IErab", "label": "D", "text": "$-15$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given $\\vec{p} = 2\\hat{i} + 5\\hat{j}$<br><br>Given $\\vec{q} = -3\\hat{j}$<br><br>$\\vec{p} \\cdot \\vec{q} = (2\\hat{i} + 5\\hat{j}) \\cdot (-3\\hat{j})$<br><br>$\\vec{p} \\cdot \\vec{q} = (2 \\times 0) + (5 \\times -3) = -15$<br><br>Answer: $-15$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884d15a9fc0fc8c14267", "type": "singleCorrect", "question": {"text": "The angle made by a vector $\\vec{B} = 3\\hat{i} + 2\\hat{j} + 4\\hat{k}$ with Y axis is", "image": null}, "options": [{"id": "rfFgE", "label": "A", "text": "$\\cos^{-1}\\left(\\dfrac{4}{\\sqrt{11}}\\right)$", "isCorrect": false, "image": null}, {"id": "Q0zW1", "label": "B", "text": "$\\cos^{-1}\\left(\\dfrac{3}{\\sqrt{17}}\\right)$", "isCorrect": false, "image": null}, {"id": "p32Tq", "label": "C", "text": "$\\cos^{-1}\\left(\\dfrac{2}{\\sqrt{29}}\\right)$", "isCorrect": true, "image": null}, {"id": "iMTaG", "label": "D", "text": "$\\cos^{-1}\\left(\\dfrac{5}{\\sqrt{23}}\\right)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given vector is $\\vec{B} = 3\\hat{i} + 2\\hat{j} + 4\\hat{k}$<br><br>The magnitude of the vector is $|\\vec{B}| = \\sqrt{3^2 + 2^2 + 4^2} = \\sqrt{9 + 4 + 16} = \\sqrt{29}$<br><br>The unit vector along the Y-axis is $\\hat{j}$<br><br>The angle $\\theta$ made by the vector with the Y-axis is given by $\\cos\\theta = \\dfrac{\\vec{B} \\cdot \\hat{j}}{|\\vec{B}||\\hat{j}|}$<br><br>$\\cos\\theta = \\dfrac{2}{\\sqrt{29}}$<br><br>$\\theta = \\cos^{-1}\\left(\\dfrac{2}{\\sqrt{29}}\\right)$<br><br>Answer: $\\cos^{-1}\\left(\\dfrac{2}{\\sqrt{29}}\\right)$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88ae15a9fc0fc8c145fc", "type": "singleCorrect", "question": {"text": "If $|\\vec{A} \\times \\vec{B}| = \\sqrt{3}(\\vec{A} \\cdot \\vec{B})$ then the value of $|\\vec{A} + \\vec{B}|$ is ($\\tan 60^\\circ = \\sqrt{3}$, $\\cos 60^\\circ = \\dfrac{1}{2}$)", "image": null}, "options": [{"id": "Cr4OD", "label": "A", "text": "$\\left[A^2 + B^2 + \\dfrac{AB}{\\sqrt{3}}\\right]^{\\frac{1}{2}}$", "isCorrect": false, "image": null}, {"id": "HgxUA", "label": "B", "text": "$A + B$", "isCorrect": false, "image": null}, {"id": "xcN6R", "label": "C", "text": "$(A^2 + B^2 + \\sqrt{3}AB)^{\\frac{1}{2}}$", "isCorrect": false, "image": null}, {"id": "O4Zjg", "label": "D", "text": "$(A^2 + B^2 + AB)^{\\frac{1}{2}}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given $|\\vec{A} \\times \\vec{B}| = \\sqrt{3}(\\vec{A} \\cdot \\vec{B})$<br><br>$AB \\sin \\theta = \\sqrt{3} AB \\cos \\theta$<br><br>$\\tan \\theta = \\sqrt{3}$<br><br>$\\theta = 60^\\circ$<br><br>The magnitude of the resultant vector is given by:<br><br>$|\\vec{A} + \\vec{B}| = \\sqrt{A^2 + B^2 + 2AB \\cos \\theta}$<br><br>Substituting $\\theta = 60^\\circ$ and $\\cos 60^\\circ = \\dfrac{1}{2}$:<br><br>$|\\vec{A} + \\vec{B}| = \\sqrt{A^2 + B^2 + 2AB \\left(\\dfrac{1}{2}\\right)}$<br><br>$|\\vec{A} + \\vec{B}| = (A^2 + B^2 + AB)^{\\dfrac{1}{2}}$<br><br>Answer: $(A^2 + B^2 + AB)^{\\frac{1}{2}}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888a15a9fc0fc8c144a8", "type": "singleCorrect", "question": {"text": "The vector $\\vec{P} = a\\hat{i} + a\\hat{j} + 3\\hat{k}$ and $\\vec{Q} = a\\hat{i} - 2\\hat{j} - \\hat{k}$ are perpendicular to each other. Then positive value of '$a$' is", "image": null}, "options": [{"id": "jnQRG", "label": "A", "text": "$3$", "isCorrect": true, "image": null}, {"id": "TC0tP", "label": "B", "text": "$4$", "isCorrect": false, "image": null}, {"id": "YECzE", "label": "C", "text": "$9$", "isCorrect": false, "image": null}, {"id": "XH4G7", "label": "D", "text": "$13$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Since the vectors $\\vec{P}$ and $\\vec{Q}$ are perpendicular to each other, their dot product is zero.<br><br>$\\vec{P} \\cdot \\vec{Q} = 0$<br><br>$(a\\hat{i} + a\\hat{j} + 3\\hat{k}) \\cdot (a\\hat{i} - 2\\hat{j} - \\hat{k}) = 0$<br><br>$a^2 - 2a - 3 = 0$<br><br>$(a - 3)(a + 1) = 0$<br><br>$a = 3$ or $a = -1$<br><br>The positive value of $a$ is $3$.<br><br>Answer: $3$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb882a15a9fc0fc8c14124", "type": "singleCorrect", "question": {"text": "If $\\vec{A}=5\\hat{i}+2\\hat{j}$ and $\\vec{B}=a\\hat{i}+3\\hat{j}$ are perpendicular to each other, the value of 'a' is", "image": null}, "options": [{"id": "jtwh4", "label": "A", "text": "$\\dfrac{-6}{5}$", "isCorrect": true, "image": null}, {"id": "wlUjH", "label": "B", "text": "$\\dfrac{6}{5}$", "isCorrect": false, "image": null}, {"id": "rJUzH", "label": "C", "text": "$\\dfrac{4}{5}$", "isCorrect": false, "image": null}, {"id": "aEqHq", "label": "D", "text": "$\\dfrac{-4}{5}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For two vectors to be perpendicular, their dot product must be zero.<br><br>$\\vec{A} \\cdot \\vec{B} = 0$<br><br>$(5\\hat{i} + 2\\hat{j}) \\cdot (a\\hat{i} + 3\\hat{j}) = 0$<br><br>$5a + 2(3) = 0$<br><br>$5a + 6 = 0$<br><br>$a = \\dfrac{-6}{5}$<br><br>Answer: $\\dfrac{-6}{5}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a38c30a4553e1bdb36", "type": "singleCorrect", "question": {"text": "If two vectors $\\vec{A} = 4\\hat{i} + n\\hat{j} + 2\\hat{k}$ and $\\vec{B} = 2\\hat{i} + 2\\hat{j} - \\hat{k}$ are mutually perpendicular to each other then value of 'n' is", "image": null}, "options": [{"id": "jeHoI", "label": "A", "text": "$+3$", "isCorrect": false, "image": null}, {"id": "nq1ld", "label": "B", "text": "$+1$", "isCorrect": false, "image": null}, {"id": "NwKGO", "label": "C", "text": "$-3$", "isCorrect": true, "image": null}, {"id": "dhCjQ", "label": "D", "text": "$-1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For two vectors to be mutually perpendicular, their dot product must be zero.<br><br>$\\vec{A} \\cdot \\vec{B} = 0$<br><br>$(4\\hat{i} + n\\hat{j} + 2\\hat{k}) \\cdot (2\\hat{i} + 2\\hat{j} - \\hat{k}) = 0$<br><br>$(4)(2) + (n)(2) + (2)(-1) = 0$<br><br>$8 + 2n - 2 = 0$<br><br>$2n + 6 = 0$<br><br>$n = -3$<br><br>Answer: $-3$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d34c8c30a4553e1be23e", "type": "singleCorrect", "question": {"text": "The area of parallelogram formed by vectors $\\vec{P} = 2\\hat{i} - \\hat{j} + 5\\hat{k}$ and $\\vec{Q} = 3\\hat{i} - 2\\hat{j} + 4\\hat{k}$ is", "image": null}, "options": [{"id": "crlpo", "label": "A", "text": "$\\sqrt{72}$", "isCorrect": false, "image": null}, {"id": "gsDuN", "label": "B", "text": "$\\sqrt{86}$", "isCorrect": true, "image": null}, {"id": "aUhVB", "label": "C", "text": "$\\sqrt{104}$", "isCorrect": false, "image": null}, {"id": "u13xc", "label": "D", "text": "$\\sqrt{240}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The area of the parallelogram formed by vectors $\\vec{P}$ and $\\vec{Q}$ is given by $|\\vec{P} \\times \\vec{Q}|$.<br><br>$\\vec{P} \\times \\vec{Q} = \\begin{vmatrix} \\hat{i} & \\hat{j} & \\hat{k} \\\\ 2 & -1 & 5 \\\\ 3 & -2 & 4 \\end{vmatrix}$<br><br>$= \\hat{i}((-1)(4) - (5)(-2)) - \\hat{j}((2)(4) - (5)(3)) + \\hat{k}((2)(-2) - (-1)(3))$<br><br>$= \\hat{i}(-4 + 10) - \\hat{j}(8 - 15) + \\hat{k}(-4 + 3)$<br><br>$= 6\\hat{i} + 7\\hat{j} - \\hat{k}$<br><br>The magnitude of the cross product is:<br><br>$|\\vec{P} \\times \\vec{Q}| = \\sqrt{6^2 + 7^2 + (-1)^2}$<br><br>$= \\sqrt{36 + 49 + 1} = \\sqrt{86}$<br><br>Answer: $\\sqrt{86}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f78c30a4553e1bdebb", "type": "singleCorrect", "question": {"text": "For two vectors $\\vec{P}$ and $\\vec{Q}$, $\\vec{P} \\cdot \\vec{Q} = |\\vec{P} \\times \\vec{Q}|$<br>The magnitude of $\\vec{R} = \\vec{P} + \\vec{Q}$ is ($\\cos 45^\\circ = \\dfrac{1}{\\sqrt{2}}$) ?", "image": null}, "options": [{"id": "wvfKQ", "label": "A", "text": "$\\sqrt{P^2 + Q^2}$", "isCorrect": false, "image": null}, {"id": "mEIoA", "label": "B", "text": "$\\dfrac{\\sqrt{P^2 + Q^2}}{\\sqrt{2}}$", "isCorrect": false, "image": null}, {"id": "V4BdE", "label": "C", "text": "$\\sqrt{P^2 + Q^2 + \\dfrac{PQ}{\\sqrt{2}}}$", "isCorrect": false, "image": null}, {"id": "Ig2qH", "label": "D", "text": "$\\sqrt{P^2 + Q^2 + \\sqrt{2}\\,PQ}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given $\\vec{P} \\cdot \\vec{Q} = |\\vec{P} \\times \\vec{Q}|$<br><br>$PQ \\cos \\theta = PQ \\sin \\theta$<br><br>$\\tan \\theta = 1 \\Rightarrow \\theta = 45^\\circ$<br><br>The magnitude of the resultant vector $\\vec{R} = \\vec{P} + \\vec{Q}$ is given by:<br><br>$|\\vec{R}| = \\sqrt{P^2 + Q^2 + 2PQ \\cos \\theta}$<br><br>Substituting $\\theta = 45^\\circ$:<br><br>$|\\vec{R}| = \\sqrt{P^2 + Q^2 + 2PQ \\cos 45^\\circ}$<br><br>$|\\vec{R}| = \\sqrt{P^2 + Q^2 + 2PQ \\left(\\dfrac{1}{\\sqrt{2}}\\right)}$<br><br>$|\\vec{R}| = \\sqrt{P^2 + Q^2 + \\sqrt{2}PQ}$<br><br>Answer: $\\sqrt{P^2 + Q^2 + \\sqrt{2}\\,PQ}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ce8c30a4553e1bdcfa", "type": "singleCorrect", "question": {"text": "Vectors $a\\hat{i} + b\\hat{j} + \\hat{k}$ and $2\\hat{i} - 3\\hat{j} + 4\\hat{k}$ are perpendicular to each other when $3a + 2b = 7$, the ratio of a to b is $x/2$. The value of x is", "image": null}, "options": [{"id": "ZQHy3", "label": "A", "text": "$4$", "isCorrect": false, "image": null}, {"id": "YZx7j", "label": "B", "text": "$1$", "isCorrect": true, "image": null}, {"id": "0rS5m", "label": "C", "text": "$8$", "isCorrect": false, "image": null}, {"id": "eDrSB", "label": "D", "text": "$3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the given vectors be $\\vec{p} = a\\hat{i} + b\\hat{j} + \\hat{k}$ and $\\vec{q} = 2\\hat{i} - 3\\hat{j} + 4\\hat{k}$.<br><br>Since the vectors are perpendicular, their dot product is zero:<br><br>$\\vec{p} \\cdot \\vec{q} = 0$<br><br>$2a - 3b + 4 = 0$<br><br>$2a - 3b = -4$<br><br>We are given another equation:<br><br>$3a + 2b = 7$<br><br>Solving the two equations simultaneously, multiply the first by $2$ and the second by $3$:<br><br>$4a - 6b = -8$<br><br>$9a + 6b = 21$<br><br>Adding both equations:<br><br>$13a = 13 \\Rightarrow a = 1$<br><br>Substituting $a = 1$ in $3a + 2b = 7$:<br><br>$3(1) + 2b = 7 \\Rightarrow 2b = 4 \\Rightarrow b = 2$<br><br>The ratio of $a$ to $b$ is $\\dfrac{a}{b} = \\dfrac{1}{2}$.<br><br>Given that the ratio is $\\dfrac{x}{2}$, we have:<br><br>$\\dfrac{x}{2} = \\dfrac{1}{2} \\Rightarrow x = 1$<br><br>Answer: $1$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2998c30a4553e1bdac4", "type": "singleCorrect", "question": {"text": "Calculate the values of $a$ and $b$ if vectors $a\\hat{i} + b\\hat{j} = \\hat{n}$ and $(\\hat{i} + \\hat{j})$ are perpendicular to each other", "image": null}, "options": [{"id": "GGs8g", "label": "A", "text": "$\\dfrac{1}{2}, \\dfrac{1}{2}$", "isCorrect": false, "image": null}, {"id": "NnPvq", "label": "B", "text": "$0, 0$", "isCorrect": false, "image": null}, {"id": "3i6rm", "label": "C", "text": "$\\sqrt{2}, -\\dfrac{1}{\\sqrt{2}}$", "isCorrect": false, "image": null}, {"id": "FkbA3", "label": "D", "text": "$\\left(\\dfrac{1}{\\sqrt{2}}\\right), \\left(-\\dfrac{1}{\\sqrt{2}}\\right)$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given $\\vec{v}_1 = a\\hat{i} + b\\hat{j} = \\hat{n}$ and $\\vec{v}_2 = \\hat{i} + \\hat{j}$.<br><br>Since $\\vec{v}_1$ is a unit vector, its magnitude is $1$.<br><br>$a^2 + b^2 = 1$<br><br>Since $\\vec{v}_1$ and $\\vec{v}_2$ are perpendicular, their dot product is zero.<br><br>$(a\\hat{i} + b\\hat{j}) \\cdot (\\hat{i} + \\hat{j}) = 0$<br><br>$a + b = 0 \\Rightarrow b = -a$<br><br>Substituting $b = -a$ in the magnitude equation:<br><br>$a^2 + (-a)^2 = 1$<br><br>$2a^2 = 1 \\Rightarrow a = \\pm \\dfrac{1}{\\sqrt{2}}$<br><br>For $a = \\dfrac{1}{\\sqrt{2}}$, $b = -\\dfrac{1}{\\sqrt{2}}$.<br><br>Answer: $\\left(\\dfrac{1}{\\sqrt{2}}\\right), \\left(-\\dfrac{1}{\\sqrt{2}}\\right)$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36b8c30a4553e1be38c", "type": "singleCorrect", "question": {"text": "The vector sum of the two forces $\\vec{A}$ and $\\vec{B}$ is perpendicular to their vector difference. Hence forces $\\vec{A}$ and $\\vec{B}$ are", "image": null}, "options": [{"id": "ZyynK", "label": "A", "text": "perpendicular to each other", "isCorrect": false, "image": null}, {"id": "lXEm5", "label": "B", "text": "unequal in magnitude", "isCorrect": false, "image": null}, {"id": "YgOgP", "label": "C", "text": "parallel to each other", "isCorrect": false, "image": null}, {"id": "7gHqr", "label": "D", "text": "equal in magnitude", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given that the vector sum is perpendicular to the vector difference.<br><br>$(\\vec{A} + \\vec{B}) \\cdot (\\vec{A} - \\vec{B}) = 0$<br><br>$\\vec{A} \\cdot \\vec{A} - \\vec{A} \\cdot \\vec{B} + \\vec{B} \\cdot \\vec{A} - \\vec{B} \\cdot \\vec{B} = 0$<br><br>Since $\\vec{A} \\cdot \\vec{B} = \\vec{B} \\cdot \\vec{A}$, we get:<br><br>$|\\vec{A}|^2 - |\\vec{B}|^2 = 0$<br><br>$|\\vec{A}| = |\\vec{B}|$<br><br>Thus, the forces $\\vec{A}$ and $\\vec{B}$ are equal in magnitude.<br><br>Answer: equal in magnitude", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d35d8c30a4553e1be2f3", "type": "singleCorrect", "question": {"text": "The vectors $(\\vec{A} + \\vec{B})$ and $(\\vec{A} - \\vec{B})$ are perpendicular to each other. This is possible under the condition", "image": null}, "options": [{"id": "qq7rX", "label": "A", "text": "$|\\vec{A}| = |\\vec{B}|$", "isCorrect": true, "image": null}, {"id": "05PEt", "label": "B", "text": "$\\vec{A} \\cdot \\vec{B} = 0$", "isCorrect": false, "image": null}, {"id": "Ctb9p", "label": "C", "text": "$\\vec{A} \\times \\vec{B} = 0$", "isCorrect": false, "image": null}, {"id": "C3Kh1", "label": "D", "text": "$\\vec{A} \\cdot \\vec{B} = 1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Two vectors are perpendicular if their dot product is zero.<br><br>$(\\vec{A} + \\vec{B}) \\cdot (\\vec{A} - \\vec{B}) = 0$<br><br>$\\vec{A} \\cdot \\vec{A} - \\vec{A} \\cdot \\vec{B} + \\vec{B} \\cdot \\vec{A} - \\vec{B} \\cdot \\vec{B} = 0$<br><br>Since $\\vec{A} \\cdot \\vec{B} = \\vec{B} \\cdot \\vec{A}$, the equation simplifies to:<br><br>$|\\vec{A}|^2 - |\\vec{B}|^2 = 0$<br><br>$|\\vec{A}| = |\\vec{B}|$<br><br>Answer: $|\\vec{A}| = |\\vec{B}|$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf8bf9280d7f9932e21", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Two vectors $a \\hat{i}+b \\hat{j}+\\hat{k}$ and $2 \\hat{i}-3 \\hat{j}+4 \\hat{k}$ are perpendicular to each other. When $3 a+2 b=7$, the ratio of $a$ to $b$ is $\\frac{x}{2}$. The value of $x$ is", "image": null}, "options": [{"id": "x0F55", "text": "zero", "image": null, "isCorrect": false}, {"id": "zl5jN", "text": "2", "image": null, "isCorrect": false}, {"id": "6CM6q", "text": "1", "image": null, "isCorrect": true}, {"id": "SVxIt", "text": "4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given vectors are $\\vec{p} = a \\hat{i} + b \\hat{j} + \\hat{k}$ and $\\vec{q} = 2 \\hat{i} - 3 \\hat{j} + 4 \\hat{k}$.<br><br>Since the vectors are perpendicular to each other, their dot product is zero.<br><br>$\\vec{p} \\cdot \\vec{q} = 0$<br><br>$2a - 3b + 4 = 0$<br><br>$2a - 3b = -4$<br><br>We are also given the equation:<br><br>$3a + 2b = 7$<br><br>Multiplying the first equation by $2$ and the second equation by $3$, we get:<br><br>$4a - 6b = -8$<br><br>$9a + 6b = 21$<br><br>Adding these two equations gives:<br><br>$13a = 13 \\Rightarrow a = 1$<br><br>Substituting $a = 1$ into $3a + 2b = 7$ gives:<br><br>$3(1) + 2b = 7 \\Rightarrow 2b = 4 \\Rightarrow b = 2$<br><br>The ratio of $a$ to $b$ is:<br><br>$\\dfrac{a}{b} = \\dfrac{1}{2}$<br><br>It is given that the ratio is $\\dfrac{x}{2}$.<br><br>$\\dfrac{x}{2} = \\dfrac{1}{2} \\Rightarrow x = 1$<br><br>Answer: 1", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871beabf9280d7f9932d98", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\vec{a}=\\hat{i}+\\hat{j}+2 \\hat{k}$ and $\\vec{b}=3 \\hat{i}+2 \\hat{j}-\\hat{k}$, the magnitude of $[(\\vec{a}+3 \\vec{b}) \\cdot(2 \\vec{a}-\\vec{b})]$ is", "image": null}, "options": [{"id": "lX5O8", "text": "15", "image": null, "isCorrect": true}, {"id": "ZGIto", "text": "-13", "image": null, "isCorrect": false}, {"id": "HzgI6", "text": "13", "image": null, "isCorrect": false}, {"id": "LlzaN", "text": "-15", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\vec{a} + 3\\vec{b} = (\\hat{i} + \\hat{j} + 2\\hat{k}) + 3(3\\hat{i} + 2\\hat{j} - \\hat{k}) = 10\\hat{i} + 7\\hat{j} - \\hat{k}$<br><br>$2\\vec{a} - \\vec{b} = (2\\hat{i} + 2\\hat{j} + 4\\hat{k}) - (3\\hat{i} + 2\\hat{j} - \\hat{k}) = -\\hat{i} + 0\\hat{j} + 5\\hat{k}$<br><br>$(\\vec{a} + 3\\vec{b}) \\cdot (2\\vec{a} - \\vec{b}) = (10)(-1) + (7)(0) + (-1)(5) = -10 + 0 - 5 = -15$<br><br>The magnitude of a scalar is its absolute value.<br><br>$\\left|(\\vec{a} + 3\\vec{b}) \\cdot (2\\vec{a} - \\vec{b})\\right| = |-15| = 15$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bd8bf9280d7f9932cf6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The vector sum of two forces $\\overrightarrow{\\mathrm{A}}$ and $\\overrightarrow{\\mathrm{B}}$ is perpendicular to their vector difference. Hence forces $\\vec{A}$ and $\\vec{B}$ are", "image": null}, "options": [{"id": "g2YrL", "text": "perpendicular to each other.", "image": null, "isCorrect": false}, {"id": "CeD61", "text": "parallel to each other.", "image": null, "isCorrect": false}, {"id": "V2cGV", "text": "unequal in magnitude.", "image": null, "isCorrect": false}, {"id": "XzMr7", "text": "equal in magnitude.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given that the vector sum of the two forces is perpendicular to their vector difference.<br><br>Therefore, the dot product of their sum and difference must be zero:<br><br>$(\\overrightarrow{A} + \\overrightarrow{B}) \\cdot (\\overrightarrow{A} - \\overrightarrow{B}) = 0$<br><br>Expanding the dot product, we get:<br><br>$\\overrightarrow{A} \\cdot \\overrightarrow{A} - \\overrightarrow{A} \\cdot \\overrightarrow{B} + \\overrightarrow{B} \\cdot \\overrightarrow{A} - \\overrightarrow{B} \\cdot \\overrightarrow{B} = 0$<br><br>Since the dot product is commutative ($\\overrightarrow{A} \\cdot \\overrightarrow{B} = \\overrightarrow{B} \\cdot \\overrightarrow{A}$), the middle terms cancel out:<br><br>$|\\overrightarrow{A}|^2 - |\\overrightarrow{B}|^2 = 0$<br><br>$|\\overrightarrow{A}|^2 = |\\overrightarrow{B}|^2$<br><br>$|\\overrightarrow{A}| = |\\overrightarrow{B}|$<br><br>Hence, the forces $\\overrightarrow{A}$ and $\\overrightarrow{B}$ are equal in magnitude.<br><br>Answer: equal in magnitude.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bc7bf9280d7f9932c50", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "$\\begin{aligned} & \\text { If }|\\vec{a}|=\\sqrt{26},|\\vec{b}|=7 \\\\ & |\\vec{a} \\times \\vec{b}|=35 \\text {, find } \\vec{a} \\cdot \\vec{b}\\end{aligned}$", "image": null}, "options": [{"id": "0YLm7", "text": "4", "image": null, "isCorrect": false}, {"id": "EpAWk", "text": "5", "image": null, "isCorrect": false}, {"id": "vcyNl", "text": "6", "image": null, "isCorrect": false}, {"id": "cMnXW", "text": "7", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Using Lagrange's identity:<br><br>$|\\vec{a} \\times \\vec{b}|^2 + (\\vec{a} \\cdot \\vec{b})^2 = |\\vec{a}|^2 |\\vec{b}|^2$<br><br>Substituting the given values:<br><br>$(35)^2 + (\\vec{a} \\cdot \\vec{b})^2 = (\\sqrt{26})^2 (7)^2$<br><br>$1225 + (\\vec{a} \\cdot \\vec{b})^2 = 26 \\times 49$<br><br>$1225 + (\\vec{a} \\cdot \\vec{b})^2 = 1274$<br><br>$(\\vec{a} \\cdot \\vec{b})^2 = 1274 - 1225$<br><br>$(\\vec{a} \\cdot \\vec{b})^2 = 49$<br><br>$\\vec{a} \\cdot \\vec{b} = 7$<br><br>Answer: 7", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba3bf9280d7f9932b23", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Vector $\\vec{A}$ of magnitude $5 \\sqrt{3}$ units, another vector $\\vec{B}$ of magnitude of 10 units are inclined to each other at an angle of $30^{\\circ}$. The magnitude of vector product of the two vectors is $\\left[\\sin 30^{\\circ}=\\frac{1}{2}\\right]$", "image": null}, "options": [{"id": "AOrpK", "text": "$5 \\sqrt{3}$ units", "image": null, "isCorrect": false}, {"id": "rjiGN", "text": "10 units", "image": null, "isCorrect": false}, {"id": "pSQma", "text": "$25 \\sqrt{3}$ units", "image": null, "isCorrect": true}, {"id": "Ybkb0", "text": "75 units", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The magnitude of the vector product of two vectors $\\vec{A}$ and $\\vec{B}$ is given by $|\\vec{A} \\times \\vec{B}| = |\\vec{A}| |\\vec{B}| \\sin \\theta$.<br><br>Substituting the given values:<br><br>$|\\vec{A} \\times \\vec{B}| = (5 \\sqrt{3})(10) \\sin 30^{\\circ}$<br><br>$|\\vec{A} \\times \\vec{B}| = 50 \\sqrt{3} \\times \\dfrac{1}{2}$<br><br>$|\\vec{A} \\times \\vec{B}| = 25 \\sqrt{3}$ units.<br><br>Answer: $25 \\sqrt{3}$ units", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b88bf9280d7f9932a1b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\vec{P}=b \\hat{i}+6 \\hat{j}+\\hat{k}$ and $\\vec{Q}=\\hat{i}-a \\hat{j}+4 \\hat{k}$ are perpendicular to each other, also $3 b-a=5$. The value of $a$ and $b$ is", "image": null}, "options": [{"id": "8LBQW", "text": "$a=2, b=1$", "image": null, "isCorrect": false}, {"id": "CKjYV", "text": "$a=1, b=2$", "image": null, "isCorrect": true}, {"id": "xtq76", "text": "$a=2, b=3$", "image": null, "isCorrect": false}, {"id": "ZEXtU", "text": "$a=4, b=3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since the vectors $\\vec{P}$ and $\\vec{Q}$ are perpendicular to each other, their dot product is zero.<br><br>$\\vec{P} \\cdot \\vec{Q} = 0$<br><br>$(b \\hat{i} + 6 \\hat{j} + \\hat{k}) \\cdot (\\hat{i} - a \\hat{j} + 4 \\hat{k}) = 0$<br><br>$b(1) + 6(-a) + 1(4) = 0$<br><br>$b - 6a + 4 = 0$<br><br>It is given that $3b - a = 5$, which gives $a = 3b - 5$.<br><br>Substituting the value of $a$ in the dot product equation:<br><br>$b - 6(3b - 5) + 4 = 0$<br><br>$b - 18b + 30 + 4 = 0$<br><br>$-17b + 34 = 0$<br><br>$17b = 34$<br><br>$b = 2$<br><br>Substituting $b = 2$ in $a = 3b - 5$:<br><br>$a = 3(2) - 5 = 1$<br><br>Thus, $a = 1$ and $b = 2$.<br><br>Answer: $a=1, b=2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b74bf9280d7f993295d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Given $\\vec{A}=(2 \\hat{i}-3 \\hat{j}+\\hat{k}), \\vec{B}=(3 \\hat{i}+\\hat{j}-2 \\hat{k})$ and $\\vec{C}=(3 \\hat{i}+2 \\hat{j}+\\hat{k})$. $(\\vec{A}+\\vec{B}) \\cdot \\vec{C}$ will be", "image": null}, "options": [{"id": "9l0k5", "text": "$10$", "image": null, "isCorrect": true}, {"id": "xeKJM", "text": "$12$", "image": null, "isCorrect": false}, {"id": "rQWhB", "text": "$18$", "image": null, "isCorrect": false}, {"id": "3PcW6", "text": "$20$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\vec{A} + \\vec{B} = (2\\hat{i} - 3\\hat{j} + \\hat{k}) + (3\\hat{i} + \\hat{j} - 2\\hat{k}) = 5\\hat{i} - 2\\hat{j} - \\hat{k}$<br><br>$(\\vec{A} + \\vec{B}) \\cdot \\vec{C} = (5\\hat{i} - 2\\hat{j} - \\hat{k}) \\cdot (3\\hat{i} + 2\\hat{j} + \\hat{k})$<br><br>$= (5)(3) + (-2)(2) + (-1)(1)$<br><br>$= 15 - 4 - 1 = 10$<br><br>Answer: $10$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b66bf9280d7f99328da", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If force $\\vec{F}=-3 \\hat{i}+\\hat{j}+5 \\hat{k}$ acts at $\\vec{r}=7 \\hat{i}+3 \\hat{j}+\\hat{k}$ then the torque acting about the origin is", "image": null}, "options": [{"id": "TwIVO", "text": "$(14 \\hat{\\mathrm{i}}-38 \\hat{\\mathrm{j}}+16 \\hat{\\mathrm{k}})$", "image": null, "isCorrect": true}, {"id": "MXVwI", "text": "$(-14 \\hat{\\mathrm{i}}+34 \\hat{\\mathrm{j}}-16 \\hat{\\mathrm{k}})$", "image": null, "isCorrect": false}, {"id": "ZIN9g", "text": "$(21 \\hat{i}+4 \\hat{j}+4 \\hat{k})$", "image": null, "isCorrect": false}, {"id": "5tk6w", "text": "$(4 \\hat{\\mathrm{i}}+4 \\hat{\\mathrm{j}}+6 \\hat{\\mathrm{k}})$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The torque $\\vec{\\tau}$ acting about the origin is given by the cross product of the position vector $\\vec{r}$ and the force vector $\\vec{F}$.<br><br>$\\vec{\\tau} = \\vec{r} \\times \\vec{F}$<br><br>Substituting the given vectors:<br><br>$\\vec{\\tau} = (7\\hat{i} + 3\\hat{j} + \\hat{k}) \\times (-3\\hat{i} + \\hat{j} + 5\\hat{k})$<br><br>Using the determinant method for cross product:<br><br>$\\vec{\\tau} = \\begin{vmatrix} \\hat{i} & \\hat{j} & \\hat{k} \\\\ 7 & 3 & 1 \\\\ -3 & 1 & 5 \\end{vmatrix}$<br><br>$\\vec{\\tau} = \\hat{i}(3 \\times 5 - 1 \\times 1) - \\hat{j}(7 \\times 5 - 1 \\times (-3)) + \\hat{k}(7 \\times 1 - 3 \\times (-3))$<br><br>$\\vec{\\tau} = \\hat{i}(15 - 1) - \\hat{j}(35 + 3) + \\hat{k}(7 + 9)$<br><br>$\\vec{\\tau} = 14\\hat{i} - 38\\hat{j} + 16\\hat{k}$<br><br>Answer: $(14 \\hat{\\mathrm{i}}-38 \\hat{\\mathrm{j}}+16 \\hat{\\mathrm{k}})$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b43bf9280d7f993279f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The three vectors $\\vec{A}=3 \\hat{i}-2 \\hat{j}+\\hat{k}, \\vec{B}=\\hat{i}-3 \\hat{j}+5 \\hat{k}$ and $\\vec{C}=2 \\hat{i}-\\hat{j}+4 \\hat{k}$ will form", "image": null}, "options": [{"id": "RDgaf", "text": "isosceles triangle.", "image": null, "isCorrect": false}, {"id": "n1l9z", "text": "equilateral triangle.", "image": null, "isCorrect": false}, {"id": "Z5gU6", "text": "no triangle.", "image": null, "isCorrect": true}, {"id": "UKNkF", "text": "right angled triangle.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Three vectors form a triangle only if one of them is the sum or difference of the other two, so that the three vectors can be placed along the sides of the triangle.<br><br>$\\vec{A} + \\vec{C} = 5\\hat{i} - 3\\hat{j} + 5\\hat{k} \\ne \\vec{B}$<br><br>$\\vec{B} + \\vec{C} = 3\\hat{i} - 4\\hat{j} + 9\\hat{k} \\ne \\vec{A}$<br><br>$\\vec{A} - \\vec{C} = \\hat{i} - \\hat{j} - 3\\hat{k} \\ne \\pm \\vec{B}$<br><br>In fact, the three vectors are not even coplanar:<br><br>$[\\vec{A}\\ \\vec{B}\\ \\vec{C}] = \\begin{vmatrix} 3 & -2 & 1 \\\\ 1 & -3 & 5 \\\\ 2 & -1 & 4 \\end{vmatrix} = 3(-12 + 5) + 2(4 - 10) + 1(-1 + 6) = -21 - 12 + 5 = -28 \\ne 0$<br><br>Although $|\\vec{A}|^2 + |\\vec{C}|^2 = 14 + 21 = 35 = |\\vec{B}|^2$, the vectors cannot be joined end to end to close a triangle.<br><br>Therefore, the three vectors form no triangle.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b20bf9280d7f9932679", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\vec{A}=\\hat{i}+\\hat{j}+3 \\hat{k}, \\vec{B}=-\\hat{i}+\\hat{j}+4 \\hat{k}$ and $\\vec{C}=2 \\hat{i}-2 \\hat{j}-8 \\hat{k}$, then the angle between the vectors $\\vec{P}=\\vec{A}+\\vec{B}+\\vec{C}$ and $\\vec{Q}=(\\vec{A} \\times \\vec{B})$ is (in degree)", "image": null}, "options": [{"id": "BNj8b", "text": "$0^0$", "image": null, "isCorrect": false}, {"id": "1blJU", "text": "$45^{\\circ}$", "image": null, "isCorrect": false}, {"id": "orVXi", "text": "$90^{\\circ}$", "image": null, "isCorrect": true}, {"id": "9sBWG", "text": "$60^{\\circ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given vectors are:<br>$\\vec{A} = \\hat{i} + \\hat{j} + 3\\hat{k}$<br>$\\vec{B} = -\\hat{i} + \\hat{j} + 4\\hat{k}$<br>$\\vec{C} = 2\\hat{i} - 2\\hat{j} - 8\\hat{k}$<br><br>Calculating $\\vec{P} = \\vec{A} + \\vec{B} + \\vec{C}$:<br>$\\vec{P} = (1 - 1 + 2)\\hat{i} + (1 + 1 - 2)\\hat{j} + (3 + 4 - 8)\\hat{k}$<br>$\\vec{P} = 2\\hat{i} - \\hat{k}$<br><br>Calculating $\\vec{Q} = \\vec{A} \\times \\vec{B}$:<br>$\\vec{Q} = \\begin{vmatrix} \\hat{i} & \\hat{j} & \\hat{k} \\\\ 1 & 1 & 3 \\\\ -1 & 1 & 4 \\end{vmatrix}$<br>$\\vec{Q} = \\hat{i}(4 - 3) - \\hat{j}(4 - (-3)) + \\hat{k}(1 - (-1))$<br>$\\vec{Q} = \\hat{i} - 7\\hat{j} + 2\\hat{k}$<br><br>To find the angle between $\\vec{P}$ and $\\vec{Q}$, we calculate their dot product:<br>$\\vec{P} \\cdot \\vec{Q} = (2\\hat{i} - \\hat{k}) \\cdot (\\hat{i} - 7\\hat{j} + 2\\hat{k})$<br>$\\vec{P} \\cdot \\vec{Q} = (2)(1) + (0)(-7) + (-1)(2)$<br>$\\vec{P} \\cdot \\vec{Q} = 2 - 2 = 0$<br><br>Since the dot product is zero, the vectors $\\vec{P}$ and $\\vec{Q}$ are perpendicular to each other. Therefore, the angle between them is $90^{\\circ}$.<br><br>Answer: $90^{\\circ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b09bf9280d7f99325d4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The resultant of two vectors $\\vec{A}$ and $\\vec{B}$ is $\\vec{C}$. If the magnitude of $\\vec{B}$ is doubled, the new resultant vector becomes perpendicular to $\\vec{A}$, then the magnitude of $\\overrightarrow{\\mathrm{C}}$ is", "image": null}, "options": [{"id": "PtJPQ", "text": "$4 B$", "image": null, "isCorrect": false}, {"id": "EOoMu", "text": "3 B", "image": null, "isCorrect": false}, {"id": "rSI1P", "text": "B", "image": null, "isCorrect": true}, {"id": "c4G0K", "text": "2 B", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the angle between $\\vec{A}$ and $\\vec{B}$ be $\\theta$.<br><br>The resultant of $\\vec{A}$ and $\\vec{B}$ is $\\vec{C} = \\vec{A} + \\vec{B}$.<br><br>The square of the magnitude of $\\vec{C}$ is given by $C^2 = A^2 + B^2 + 2AB \\cos\\theta$.<br><br>When the magnitude of $\\vec{B}$ is doubled, the new resultant is $\\vec{R} = \\vec{A} + 2\\vec{B}$.<br><br>Since $\\vec{R}$ is perpendicular to $\\vec{A}$, their dot product is zero:<br><br>$\\vec{R} \\cdot \\vec{A} = 0$<br><br>$(\\vec{A} + 2\\vec{B}) \\cdot \\vec{A} = 0$<br><br>$A^2 + 2\\vec{A} \\cdot \\vec{B} = 0$<br><br>$A^2 + 2AB \\cos\\theta = 0$<br><br>$2AB \\cos\\theta = -A^2$<br><br>Substituting this value in the equation for $C^2$:<br><br>$C^2 = A^2 + B^2 - A^2$<br><br>$C^2 = B^2$<br><br>$C = B$<br><br>Answer: B", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ffd0279619d9d8a20db", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "$\\quad$ Let $\\overrightarrow{\\mathrm{P}}=\\hat{\\mathrm{I}} \\mathrm{P} \\sin \\theta-\\hat{\\mathrm{P}} \\cos \\theta$, be any vector. Another vector $\\overrightarrow{\\mathrm{Q}}$ which is perpendicular\nto $\\overrightarrow{\\mathrm{P}}$ is", "image": null}, "options": [{"id": "k6WgP", "text": "$(\\hat{\\mathrm{I}} \\mathrm{Q} \\sin \\theta+\\hat{\\mathrm{j}} \\mathrm{Q} \\cos \\theta)$", "image": null, "isCorrect": false}, {"id": "aT6JG", "text": "$(\\hat{\\mathrm{I}} \\mathrm{Q} \\cos \\theta+\\hat{\\mathrm{j}} \\mathrm{Q} \\sin \\theta)$", "image": null, "isCorrect": true}, {"id": "cYnMK", "text": "$(\\hat{\\mathrm{I}} \\mathrm{Q} \\cos \\theta-\\hat{\\mathrm{j}} \\mathrm{Q} \\sin \\theta)$", "image": null, "isCorrect": false}, {"id": "jSZ8o", "text": "$(\\hat{\\mathrm{l}} \\mathrm{P} \\sin \\theta+\\hat{\\mathrm{j}} \\mathrm{P} \\cos \\theta)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\vec{P}=P \\sin \\theta \\hat{i}-P \\cos \\theta \\hat{j}$\nalso, $\\vec{Q}=Q \\cos \\theta\\hat{i}+Q \\sin \\theta\\hat{j}$\n$\\therefore \\vec{P} .\\vec{Q}=(P \\sin \\theta \\hat{i}-P \\cos \\theta \\hat{j}) \\cdot(Q \\cos \\theta \\hat{i}+Qsin\\theta \\hat{j})$\n$=P Q \\sin \\theta \\cos \\theta-P \\cos \\theta- Q\\sin \\theta$\n$=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f400279619d9d8a1afb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}], "question": {"text": "$\\vec{A}$ and $\\vec{B}$ are two non-zero vectors inclined at an angle ' $\\theta^{\\prime} .$ Ã¢ and $\\hat{b}$ are unit vectors\nalong $\\vec{A}$ and $\\vec{B}$ respectively. The component of $\\vec{A}$ in the direction of $\\vec{B}$ is", "image": null}, "options": [{"id" LP", "text": "$\\overrightarrow{\\mathrm{C}}$", "image": null, "isCorrect": false}, {"id": "mUItz", "text": "$\\overrightarrow{\\mathrm{B}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f190279619d9d8a19c6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}], "question": {"text": "Figure shows three forces $\\overrightarrow{\\mathrm{F}}_{1}, \\overrightarrow{\\mathrm{F}}_{2}$ and $\\overrightarrow{\\mathrm{F}}_{3}$ acting along the sides of an equilateral\ntriangle. If the total torque acting at point ' 0 ' (centre of the triangle) is zero then the\nmagnitude of $\\overrightarrow{\\mathrm{F}}_{3}$ is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/jOp1BPQRMiufhLhlvm5_78L_cUWaubYPj6rCvQ_2Jiw.original.fullsize.png\">", "image": null}, "options": [{"id": "Eoj9Z", "text": "$\\frac{\\mathrm{F}_{1}-\\mathrm{F}_{2}}{2}$", "image": null, "isCorrect": false}, {"id": "4XZiC", "text": "$\\mathrm{~F}_{1}-\\mathrm{F}_{2}$", "image": null, "isCorrect": false}, {"id": "us8fS", "text": "$\\mathrm{~F}_{1}+\\mathrm{F}_{2}$", "image": null, "isCorrect": true}, {"id": "JJNhT", "text": "$\\frac{\\mathrm{F}_{1}}{\\mathrm{~F}_{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The perpendicular distance of point $\\mathrm{O}$ from the sides $\\mathrm{AB}$ or $\\mathrm{BC}$ or $\\mathrm{AC}$ will be same (say r). Torque will be zero if total moment of force about point $\\mathrm{O}$ is zero Hence\n$$\n\\mathrm{rF}_{1}+\\mathrm{rF}_{2}-\\mathrm{rF}_{3}=0\n$$\n$$\n\\mathrm{F}_{3}=\\mathrm{F}_{1}+\\mathrm{F}_{2}=(4+2) \\mathrm{N}-6 \\mathrm{~N}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f190279619d9d8a19c5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}], "question": {"text": "The unit vector $(a \\hat{\\imath}+b \\hat{j})$ is perpendicular to $(\\hat{\\imath}+\\hat{\\jmath})$. The value of $^{\\prime} b^{\\prime}$ is", "image": null}, "options": [{"id": "aUHsv", "text": "$+\\frac{1}{\\sqrt{3}}$", "image": null, "isCorrect": false}, {"id": "XEKM2", "text": "$-\\frac{1}{\\sqrt{3}}$", "image": null, "isCorrect": false}, {"id": "7BCRu", "text": "$+\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "YGCWl", "text": "$-\\frac{1}{\\sqrt{2}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\begin{array}{l}\n\\hat{\\mathrm{n}}=a \\hat{\\mathrm{i}}+b \\hat{\\mathrm{j}} \\\\\n\\overrightarrow{\\mathrm{r}}=\\hat{\\mathrm{i}}+\\hat{\\mathrm{j}}\n\\end{array}\n$$\nIf $\\hat{n}$ is perpendicular to the vector $\\vec{r}=\\hat{i}+\\hat{j}$\n$\\hat{n} \\cdot \\vec{r}=0$\n$a+b=0$\n$b=-a . \\ldots . .(1)$\nThe magnitude of unity vector is $1 .$\n$\\sqrt{a^{2}+b^{2}}=1$ $\\sqrt{a^{2}+a^{2}}=\\sqrt{2} a=1($ from equation 1) $a=\\frac{1}{\\sqrt{2}}$\n$a=\\frac{1}{\\sqrt{2}}$\nand from equation (1), we get\n$b=-\\frac{1}{\\sqrt{2}}$\nThe correct option is D.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ee40279619d9d8a181f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}], "question": {"text": "The resultant <math><mover accent=\"true\"><mrow><mi>R</mi></mrow><mo>→</mo></mover></math> of <math><mover accent=\"true\"><mrow><mi>P</mi></mrow><mo>→</mo></mover></math> and <math><mover accent=\"true\"><mrow><mi>Q</mi></mrow><mo>→</mo></mover></math> is perpendicular to <math><mover accent=\"true\"><mrow><mi>P</mi></mrow><mo>→</mo></mover><mo>.</mo></math> Also <math><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mover accent=\"true\"><mrow><mi>P</mi></mrow><mo>→</mo></mover></mrow></mfenced><mo>=</mo><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mover accent=\"true\"><mrow><mi>R</mi></mrow><mo>→</mo></mover></mrow></mfenced><mo>.</mo></math> The angle between <math><mover accent=\"true\"><mrow><mi>P</mi></mrow><mo>→</mo></mover></math> and <math><mover accent=\"true\"><mrow><mi>Q</mi></mrow><mo>→</mo></mover></math> is <math><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><msup><mrow><mn>45</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mo>=</mo><mn>1</mn></mrow></mrow></mrow></mfenced></math>", "image": null}, "options": [{"id": "NxPBW", "text": "<math><mfrac><mrow><mn>5</mn><mi>π</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "y4xhW", "text": "<math><mfrac><mrow><mn>7</mn><mi>π</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "u0mEm", "text": "<math><mfrac><mrow><mi>π</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "Pc6QT", "text": "<math><mfrac><mrow><mn>3</mn><mi>π</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><msup><mrow><mn>90</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></mrow></mrow><mo>=</mo><mfrac><mrow><mi>Q</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi>θ</mi></mrow><mrow><mi>P</mi><mo>+</mo><mi>Q</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mi>θ</mi></mrow></mfrac><mo>&#8658;</mo><mi>P</mi><mo>+</mo><mi>Q</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mi>θ</mi><mo>=</mo><mn>0</mn></math>  <br/><math><mo>&#8658;</mo><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mi>θ</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mi>P</mi></mrow><mrow><mi>Q</mi></mrow></mfrac><mo> </mo></math> …(1) <br/><math><mo>∵</mo><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msup><mrow><mi>P</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>Q</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>2</mn><mi>P</mi><mi>Q</mi><mo> </mo><mo> </mo><mo> </mo><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></math>  <br/><math><mo>∵</mo><mi>P</mi><mo>=</mo><mi>R</mi></math>  <br/><math><mo>∴</mo><mfrac><mrow><mo>-</mo><mi>P</mi></mrow><mrow><mi>Q</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mi>θ</mi></mrow></mfrac></math> …(2) <br/>From (1) &amp; (2) <br/><math><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mi>θ</mi><mo>=</mo><mo>±</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac></math>  <br/><math><mo>∴</mo><mi>θ</mi><mo>=</mo><mfrac><mrow><mn>3</mn><mi>π</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f0c0279619d9d8a195f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}], "question": {"text": "P and Q are two non-zero vectors inclined to each other at an angle <math><mi>'</mi><msup><mrow><mi>θ</mi></mrow><mrow><mi>'</mi></mrow></msup><mo>.</mo></math> ‘p’ and ‘q’ are unit vectors along P and Q respectively. The component of Q in the direction of Q will be", "image": null}, "options": [{"id": "U2Pcb", "text": "<math><mi>P</mi><mo>.</mo><mi>Q</mi></math>", "image": null, "isCorrect": true}, {"id": "pmR3Q", "text": "<math><mfrac><mrow><mi>P</mi><mo>×</mo><mi>Q</mi></mrow><mrow><mi>P</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "sFIe2", "text": "<math><mfrac><mrow><mi>P</mi><mo>.</mo><mi>Q</mi></mrow><mrow><mi>Q</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "EiOPa", "text": "<math><mi>p</mi><mo>.</mo><mi>q</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let two vectors P and Q are represented by graph as below <br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/976e6f60-b0f0-4bb5-a430-766c7ebe9994.png\"> <br/>Here, <math><msub><mrow><mi>Q</mi></mrow><mrow><mi>p</mi></mrow></msub></math> is a vector in the direction of P. <br/>Then, from the right angle triangle, we get <br/><math><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mi>θ</mi><mo>=</mo><mfrac><mrow><msub><mrow><mi>Q</mi></mrow><mrow><mi>p</mi></mrow></msub></mrow><mrow><mi>Q</mi></mrow></mfrac></math> ….(i) <br/><math><mo>⇒</mo><msub><mrow><mi>Q</mi></mrow><mrow><mi>p</mi></mrow></msub><mo>=</mo><mi>Q</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mi>θ</mi></math>  <br/>Also, <math><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mi>θ</mi><mo>=</mo><mfrac><mrow><mi>P</mi><mo>.</mo><mi>Q</mi></mrow><mrow><mi>P</mi><mi>Q</mi></mrow></mfrac><mo>⇒</mo><mfrac><mrow><msub><mrow><mi>Q</mi></mrow><mrow><mi>p</mi></mrow></msub></mrow><mrow><mi>Q</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>P</mi><mo>.</mo><mi>Q</mi></mrow><mrow><mi>P</mi><mi>Q</mi></mrow></mfrac></math>  <br/><math><mo>⇒</mo><msub><mrow><mi>Q</mi></mrow><mrow><mi>p</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>P</mi><mo>.</mo><mi>Q</mi></mrow><mrow><mi>P</mi></mrow></mfrac></math> ….(ii) <br/>As given that, P is the unit vector along P, then <br/><math><mover accent=\"true\"><mrow><mi>P</mi></mrow><mo>^</mo></mover><mo>=</mo><mfrac><mrow><mi>P</mi></mrow><mrow><mi>P</mi></mrow></mfrac></math> …(iii) <br/>Putting the value of P from Eq.(iii) to Eq.(ii), we get <br/><math><msub><mrow><mi>Q</mi></mrow><mrow><mi>p</mi></mrow></msub><mo>=</mo><mi>P</mi><mo>.</mo><mi>Q</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f070279619d9d8a1930", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}], "question": {"text": "A force <math><mfenced separators=\"|\"><mrow><mi>F</mi></mrow></mfenced><mo>=</mo><mi>i</mi><mo>-</mo><mn>5</mn><mover accent=\"true\"><mrow><mi>i</mi></mrow><mo>^</mo></mover><mo>-</mo><mn>7</mn><mover accent=\"true\"><mrow><mi>j</mi></mrow><mo>^</mo></mover><mo>+</mo><mn>3</mn><mover accent=\"true\"><mrow><mi>k</mi></mrow><mo>^</mo></mover></math> acting on a particle causes a displacement <math><mfenced separators=\"|\"><mrow><mi>s</mi></mrow></mfenced><mo>=</mo><mn>3</mn><mover accent=\"true\"><mrow><mi>i</mi></mrow><mo>^</mo></mover><mo>+</mo><mn>2</mn><mover accent=\"true\"><mrow><mi>j</mi></mrow><mo>^</mo></mover><mo>+</mo><mi>a</mi><mi>k</mi></math> in its own direction. If the work done is 14 J, then the value of ‘a’ is", "image": null}, "options": [{"id": "yJDV1", "text": "0", "image": null, "isCorrect": false}, {"id": "MjXSe", "text": "5", "image": null, "isCorrect": true}, {"id": "s2wVv", "text": "15", "image": null, "isCorrect": false}, {"id": "Or54a", "text": "1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, <math><mi>F</mi><mo>=</mo><mo>-</mo><mn>5</mn><mover accent=\"true\"><mrow><mi>i</mi></mrow><mo>^</mo></mover><mo>-</mo><mn>7</mn><mover accent=\"true\"><mrow><mi>j</mi></mrow><mo>^</mo></mover><mo>+</mo><mn>3</mn><mover accent=\"true\"><mrow><mi>k</mi></mrow><mo>^</mo></mover><mo>,</mo></math>  <br/><math><mi>s</mi><mo>=</mo><mn>3</mn><mi>i</mi><mo>-</mo><mn>2</mn><mover accent=\"true\"><mrow><mi>j</mi></mrow><mo>^</mo></mover><mo>+</mo><mi>a</mi><mover accent=\"true\"><mrow><mi>k</mi></mrow><mo>^</mo></mover></math>  <br/>And <math><mi>W</mi><mo>=</mo><mi>F</mi><mo>.</mo><mi>s</mi></math> …. (i) <br/>Substituting above values in Eq. (i), we get <br/><math><mn>14</mn><mo>=</mo><mfenced separators=\"|\"><mrow><mo>-</mo><mn>5</mn><mover accent=\"true\"><mrow><mi>i</mi></mrow><mo>^</mo></mover><mo>-</mo><mn>7</mn><mover accent=\"true\"><mrow><mi>j</mi></mrow><mo>^</mo></mover><mo>+</mo><mn>3</mn><mover accent=\"true\"><mrow><mi>k</mi></mrow><mo>^</mo></mover></mrow></mfenced><mo>.</mo><mfenced separators=\"|\"><mrow><mn>3</mn><mover accent=\"true\"><mrow><mi>i</mi></mrow><mo>^</mo></mover><mo>-</mo><mn>2</mn><mover accent=\"true\"><mrow><mi>j</mi></mrow><mo>^</mo></mover><mo>+</mo><mi>a</mi><mover accent=\"true\"><mrow><mi>k</mi></mrow><mo>^</mo></mover></mrow></mfenced></math>  <br/><math><mo>⇒</mo><mn>14</mn><mo>=</mo><mo>-</mo><mn>15</mn><mo>+</mo><mn>14</mn><mo>+</mo><mn>3</mn><mi>a</mi></math>  <br/><math><mo>⇒</mo><mi>a</mi><mo>=</mo><mfrac><mrow><mn>15</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>=</mo><mn>5</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ef70279619d9d8a18b1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}], "question": {"text": "The vectors <strong>(A + B)</strong> and <strong>(A – B)</strong> are at right angles to each other. This is possible under the condition", "image": null}, "options": [{"id": "74ywg", "text": "<math><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi>A</mi></mrow></mfenced><mo>=</mo><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi>B</mi></mrow></mfenced></math>", "image": null, "isCorrect": true}, {"id": "LFjx8", "text": "<math><mi>A</mi><mo>.</mo><mi>B</mi><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "10Lr0", "text": "<math><mi>A</mi><mo>.</mo><mi>B</mi><mo>=</mo><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "1uS7N", "text": "<math><mi>A</mi><mo>×</mo><mi>B</mi><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Vectors <strong>(A + B</strong>) and <strong>(A – B)</strong> are at right angle to each other, therefore <br/><math><mfenced separators=\"|\"><mrow><mi>A</mi><mo>+</mo><mi>B</mi></mrow></mfenced><mo>.</mo><mfenced separators=\"|\"><mrow><mi>A</mi><mo>-</mo><mi>B</mi></mrow></mfenced><mo>=</mo><mn>0</mn></math>  <br/><math><mi>A</mi><mo>.</mo><mi>A</mi><mo>+</mo><mi>B</mi><mo>.</mo><mi>A</mi><mo>-</mo><mi>A</mi><mo>.</mo><mi>B</mi><mo>-</mo><mi>B</mi><mo>.</mo><mi>B</mi><mo>=</mo><mn>0</mn></math>  <br/><math><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi>A</mi></mrow></mfenced><mo>+</mo><mi>B</mi><mi>A</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mi>θ</mi><mo>-</mo><mi>A</mi><mi>B</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mi>θ</mi><mo>-</mo><msup><mrow><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi>B</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>0</mn></math>  <br/><math><msup><mrow><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi>A</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msup><mrow><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi>B</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></math>  <br/>Hence, <math><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi>A</mi></mrow></mfenced><mo>=</mo><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi>B</mi></mrow></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "65a2634f0279619d9d8a3e0a", "title": "Errors of Measurement", "totalQuestions": 39, "questions": [{"_id": "6abb889a15a9fc0fc8c1453d", "type": "singleCorrect", "question": {"text": "A wire has mass $(0.4 \\pm 0.002)$ g, radius $(0.6 \\pm 0.006)$ mm and length $(8 \\pm 0.04)$ cm. The percentage error in the measurement of its density is", "image": null}, "options": [{"id": "huVFs", "label": "A", "text": "$2\\%$", "isCorrect": false, "image": null}, {"id": "9JODi", "label": "B", "text": "$2.55\\%$", "isCorrect": false, "image": null}, {"id": "HPEpn", "label": "C", "text": "$3\\%$", "isCorrect": true, "image": null}, {"id": "Ik28b", "label": "D", "text": "$3.55\\%$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The density of the wire is given by $\\rho = \\dfrac{m}{V} = \\dfrac{m}{\\pi r^2 l}$<br><br>The maximum percentage error in density is<br><br>$\\dfrac{\\Delta \\rho}{\\rho} \\times 100 = \\left( \\dfrac{\\Delta m}{m} + 2 \\dfrac{\\Delta r}{r} + \\dfrac{\\Delta l}{l} \\right) \\times 100$<br><br>Substituting the given values:<br><br>$\\dfrac{\\Delta m}{m} \\times 100 = \\dfrac{0.002}{0.4} \\times 100 = 0.5\\%$<br><br>$\\dfrac{\\Delta r}{r} \\times 100 = \\dfrac{0.006}{0.6} \\times 100 = 1\\%$<br><br>$\\dfrac{\\Delta l}{l} \\times 100 = \\dfrac{0.04}{8} \\times 100 = 0.5\\%$<br><br>Therefore, the percentage error in density is<br><br>$\\dfrac{\\Delta \\rho}{\\rho} \\times 100 = 0.5\\% + 2(1\\%) + 0.5\\% = 3\\%$<br><br>Answer: $3\\%$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888a15a9fc0fc8c144a7", "type": "singleCorrect", "question": {"text": "The resistance of a conductor is $R = V/I$ where voltage $V = 100 \\pm 5$ V and current $I = 10 \\pm 0.2$ A. The error in the calculation of $R$ is", "image": null}, "options": [{"id": "aT8sl", "label": "A", "text": "$5\\%$", "isCorrect": false, "image": null}, {"id": "s0eWo", "label": "B", "text": "$7\\%$", "isCorrect": true, "image": null}, {"id": "iPh6j", "label": "C", "text": "$5.2\\%$", "isCorrect": false, "image": null}, {"id": "OkoVB", "label": "D", "text": "$2.5\\%$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $V = 100 \\pm 5$ V and $I = 10 \\pm 0.2$ A.<br><br>The percentage error in voltage $V$ is $\\dfrac{\\Delta V}{V} \\times 100 = \\dfrac{5}{100} \\times 100 = 5\\%$.<br><br>The percentage error in current $I$ is $\\dfrac{\\Delta I}{I} \\times 100 = \\dfrac{0.2}{10} \\times 100 = 2\\%$.<br><br>The resistance is given by $R = \\dfrac{V}{I}$.<br><br>The maximum percentage error in $R$ is the sum of the percentage errors in $V$ and $I$.<br><br>$\\dfrac{\\Delta R}{R} \\times 100 = \\left( \\dfrac{\\Delta V}{V} + \\dfrac{\\Delta I}{I} \\right) \\times 100 = 5\\% + 2\\% = 7\\%$.<br><br>Answer: $7\\%$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885f15a9fc0fc8c14316", "type": "singleCorrect", "question": {"text": "The percentage error in the measurement of mass and speed are $2\\%$ and $3\\%$ respectively. The maximum error in the estimation of kinetic energy is", "image": null}, "options": [{"id": "dDMu4", "label": "A", "text": "$11$ %", "isCorrect": false, "image": null}, {"id": "PdFkL", "label": "B", "text": "$8$ %", "isCorrect": true, "image": null}, {"id": "9CeyM", "label": "C", "text": "$5$ %", "isCorrect": false, "image": null}, {"id": "zMGUI", "label": "D", "text": "$1$ %", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The kinetic energy is given by the formula $K = \\dfrac{1}{2}mv^2$<br><br>The maximum percentage error in kinetic energy is given by<br><br>$\\dfrac{\\Delta K}{K} \\times 100 = \\dfrac{\\Delta m}{m} \\times 100 + 2 \\left( \\dfrac{\\Delta v}{v} \\times 100 \\right)$<br><br>Given that the percentage error in mass is $\\dfrac{\\Delta m}{m} \\times 100 = 2\\%$ and the percentage error in speed is $\\dfrac{\\Delta v}{v} \\times 100 = 3\\%$<br><br>Substituting these values, we get<br><br>$\\dfrac{\\Delta K}{K} \\times 100 = 2\\% + 2(3\\%) = 2\\% + 6\\% = 8\\%$<br><br>The maximum error in the estimation of kinetic energy is $8\\%$.<br><br>Answer: $8$ %", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88be15a9fc0fc8c1468f", "type": "singleCorrect", "question": {"text": "A quantity $Q$ is formulated $X^{-2}Y^{+\\frac{3}{2}}Z^{-\\frac{2}{5}}$. $X$, $Y$ and $Z$ are independent parameters which have fractional errors of $0.1$, $0.2$ and $0.5$ respectively in measurement. The maximum fractional error of $Q$ is", "image": null}, "options": [{"id": "ZLPEK", "label": "A", "text": "$0.6$", "isCorrect": false, "image": null}, {"id": "HnPVu", "label": "B", "text": "$0.7$", "isCorrect": true, "image": null}, {"id": "F695J", "label": "C", "text": "$0.8$", "isCorrect": false, "image": null}, {"id": "FeQ5n", "label": "D", "text": "$0.1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $Q = X^{-2}Y^{\\dfrac{3}{2}}Z^{-\\dfrac{2}{5}}$<br><br>The maximum fractional error in $Q$ is given by the sum of the absolute values of the powers multiplied by the fractional errors of the respective quantities:<br><br>$\\dfrac{\\Delta Q}{Q} = |-2|\\dfrac{\\Delta X}{X} + \\left|\\dfrac{3}{2}\\right|\\dfrac{\\Delta Y}{Y} + \\left|-\\dfrac{2}{5}\\right|\\dfrac{\\Delta Z}{Z}$<br><br>Substituting the given fractional errors $\\dfrac{\\Delta X}{X} = 0.1$, $\\dfrac{\\Delta Y}{Y} = 0.2$, and $\\dfrac{\\Delta Z}{Z} = 0.5$:<br><br>$\\dfrac{\\Delta Q}{Q} = 2(0.1) + \\dfrac{3}{2}(0.2) + \\dfrac{2}{5}(0.5)$<br><br>$\\dfrac{\\Delta Q}{Q} = 0.2 + 0.3 + 0.2 = 0.7$<br><br>Answer: $0.7$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a68c30a4553e1bdb54", "type": "singleCorrect", "question": {"text": "A physical quantity $x$ is related as $x = \\sqrt{a}\\ b^2 c^3 d^{-4}$. Relative errors in the quantities $a$, $b$, $c$ and $d$ are 2%, 1%, 3% and 4% respectively. Relative error in $x$ will be", "image": null}, "options": [{"id": "cQdqg", "label": "A", "text": "30%", "isCorrect": false, "image": null}, {"id": "a6SA7", "label": "B", "text": "28%", "isCorrect": true, "image": null}, {"id": "QOP84", "label": "C", "text": "24%", "isCorrect": false, "image": null}, {"id": "qu5gI", "label": "D", "text": "18%", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $x = a^{1/2} b^2 c^3 d^{-4}$<br><br>The maximum relative percentage error in $x$ is given by<br><br>$\\dfrac{\\Delta x}{x} \\times 100 = \\dfrac{1}{2} \\left(\\dfrac{\\Delta a}{a} \\times 100\\right) + 2 \\left(\\dfrac{\\Delta b}{b} \\times 100\\right) + 3 \\left(\\dfrac{\\Delta c}{c} \\times 100\\right) + 4 \\left(\\dfrac{\\Delta d}{d} \\times 100\\right)$<br><br>Substituting the given percentage errors:<br><br>$\\dfrac{\\Delta x}{x} \\times 100 = \\dfrac{1}{2}(2\\%) + 2(1\\%) + 3(3\\%) + 4(4\\%)$<br><br>$\\dfrac{\\Delta x}{x} \\times 100 = 1\\% + 2\\% + 9\\% + 16\\% = 28\\%$<br><br>Answer: 28%", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d34c8c30a4553e1be23d", "type": "singleCorrect", "question": {"text": "The percentage error in the measurement of mass of a body and its speed are $0.73\\%$ and $1.84\\%$ respectively. The percentage error in the measurement of its momentum and kinetic energy are respectively", "image": null}, "options": [{"id": "x0eDO", "label": "A", "text": "$2.57\\%$ , $2.75\\%$", "isCorrect": false, "image": null}, {"id": "0H430", "label": "B", "text": "$2.57\\%$ , $4.41\\%$", "isCorrect": true, "image": null}, {"id": "ZwlPo", "label": "C", "text": "$1.46\\%$ , $1.84\\%$", "isCorrect": false, "image": null}, {"id": "9oVyy", "label": "D", "text": "$1.84\\%$ , $3.70\\%$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given percentage error in mass, $\\dfrac{\\Delta m}{m} \\times 100 = 0.73\\%$<br><br>Given percentage error in speed, $\\dfrac{\\Delta v}{v} \\times 100 = 1.84\\%$<br><br>Momentum is given by $p = mv$<br><b
