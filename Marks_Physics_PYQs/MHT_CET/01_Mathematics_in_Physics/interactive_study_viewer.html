rect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A unit vector in the direction of resultant vector of $\\vec{A}=-2 \\hat{i}+3 \\hat{j}+\\hat{k}$ and $\\vec{B}=\\hat{i}+2 \\hat{j}-4 \\hat{k}$ is", "image": null}, "options": [{"id": "eHMUR", "text": "$\\frac{-3 \\hat{\\mathrm{i}}+\\hat{\\mathrm{j}}+5 \\hat{\\mathrm{k}}}{\\sqrt{35}}$", "image": null, "isCorrect": false}, {"id": "xMzP3", "text": "$\\frac{\\hat{i}+2 \\hat{j}-4 \\hat{k}}{\\sqrt{35}}$", "image": null, "isCorrect": false}, {"id": "Bjls5", "text": "$\\frac{-2 \\hat{\\mathrm{i}}+3 \\hat{\\mathrm{j}}+\\hat{\\mathrm{k}}}{\\sqrt{35}}$", "image": null, "isCorrect": false}, {"id": "FNC5d", "text": "$\\frac{-\\hat{\\mathrm{i}}+5 \\hat{\\mathrm{j}}-3 \\hat{\\mathrm{k}}}{\\sqrt{35}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The resultant vector $\\vec{R}$ is given by the sum of vectors $\\vec{A}$ and $\\vec{B}$.<br><br>$\\vec{R} = \\vec{A} + \\vec{B}$<br><br>$\\vec{R} = (-2\\hat{i} + 3\\hat{j} + \\hat{k}) + (\\hat{i} + 2\\hat{j} - 4\\hat{k})$<br><br>$\\vec{R} = -\\hat{i} + 5\\hat{j} - 3\\hat{k}$<br><br>The magnitude of the resultant vector is:<br><br>$|\\vec{R}| = \\sqrt{(-1)^2 + (5)^2 + (-3)^2}$<br><br>$|\\vec{R}| = \\sqrt{1 + 25 + 9} = \\sqrt{35}$<br><br>The unit vector in the direction of the resultant vector is:<br><br>$\\hat{R} = \\dfrac{\\vec{R}}{|\\vec{R}|} = \\dfrac{-\\hat{i} + 5\\hat{j} - 3\\hat{k}}{\\sqrt{35}}$<br><br>Answer: $\\frac{-\\hat{\\mathrm{i}}+5 \\hat{\\mathrm{j}}-3 \\hat{\\mathrm{k}}}{\\sqrt{35}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fd80279619d9d8a1fb2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "If a unit vector is represented as $\\overrightarrow{\\mathrm{u}}=0 \\cdot 4 \\hat{\\imath}+0 \\cdot 7 \\hat{\\jmath}+\\mathrm{c} \\hat{k}$, then the value of ' $\\mathrm{c}$ ' is", "image": null}, "options": [{"id": "2fH8X", "text": "$\\sqrt{0 \\cdot 11}$", "image": null, "isCorrect": false}, {"id": "Hkpwr", "text": "$\\sqrt{0 \\cdot 25}$", "image": null, "isCorrect": false}, {"id": "VP3QU", "text": "$\\sqrt{0 \\cdot 65}$", "image": null, "isCorrect": false}, {"id": "cDO2O", "text": "$\\sqrt{0 \\cdot 35}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "(D)\n$\\sqrt{0.4^{2}+0.7^{2}+c^{2}}=1$\nThus, $\\mathrm{c}^{2}=1-0.65=0.35$, or $\\mathrm{c}=\\sqrt{0.35}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ed10279619d9d8a1787", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}], "question": {"text": "A unit vector is represented as <math><mo>(</mo><mn>0.8</mn><mover accent=\"true\"><mrow><mi>i</mi></mrow><mo>^</mo></mover><mo>+</mo><mi>b</mi><mover accent=\"true\"><mrow><mi>j</mi></mrow><mo>^</mo></mover><mo>+</mo><mn>0.4</mn><mover accent=\"true\"><mrow><mi>k</mi></mrow><mo>^</mo></mover><mo>)</mo></math>. Hence the value of 'b' must be", "image": null}, "options": [{"id": "6ooQA", "text": "0.4", "image": null, "isCorrect": false}, {"id": "rOfFC", "text": "<math><msqrt><mn>0.6</mn></msqrt></math>", "image": null, "isCorrect": false}, {"id": "W3TvQ", "text": "0.2", "image": null, "isCorrect": false}, {"id": "euvyI", "text": "<math><msqrt><mn>0.2</mn></msqrt></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math> <mrow> <msqrt> <mrow> <msup> <mrow> <mrow><mo>(</mo> <mrow> <mn>0.8</mn></mrow> <mo>)</mo></mrow></mrow> <mn>2</mn> </msup> <mo>+</mo><msup> <mrow> <mrow><mo>(</mo> <mi>b</mi> <mo>)</mo></mrow></mrow> <mn>2</mn> </msup> <mo>+</mo><msup> <mrow> <mrow><mo>(</mo> <mrow> <mn>0.4</mn></mrow> <mo>)</mo></mrow></mrow> <mn>2</mn> </msup> </mrow> </msqrt> <mo>=</mo><mn>1</mn></mrow> </math><br /><math> <mrow> <msqrt> <mrow> <mn>0.64</mn><mo>+</mo><msup> <mi>b</mi> <mn>2</mn> </msup> <mo>+</mo><mn>0.16</mn></mrow> </msqrt> <mo>=</mo><mn>1</mn></mrow> </math><br /><math> <mrow> <msqrt> <mrow> <mn>0.80</mn><mo>+</mo><msup> <mi>b</mi> <mn>2</mn> </msup> </mrow> </msqrt> <mo>=</mo><mn>1</mn></mrow> </math><br /><math> <mrow> <mn>0.80</mn><mo>+</mo><msup> <mi>b</mi> <mn>2</mn> </msup> <mo>=</mo><mn>1</mn></mrow> </math><br /><math> <mrow> <msup> <mi>b</mi> <mn>2</mn> </msup> <mo>=</mo><mn>0.2</mn></mrow> </math><br /><math> <mrow> <mi>b</mi><mo>=</mo><msqrt> <mrow> <mn>0.2</mn></mrow> </msqrt></mrow></math><br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a2634e0279619d9d8a3e08", "title": "Addition and Subtraction of Vectors", "totalQuestions": 34, "questions": [{"_id": "6abb88cb15a9fc0fc8c1470e", "type": "singleCorrect", "question": {"text": "Let $\\vec{P} = \\hat{i}+\\hat{j}+\\hat{k}$ and $\\vec{Q} = -\\hat{i}-\\hat{j}-\\hat{k}$. The angle between $(\\vec{P}-\\vec{Q})$ and $\\vec{P}$ is", "image": null}, "options": [{"id": "oPgiB", "label": "A", "text": "$90^\\circ$", "isCorrect": false, "image": null}, {"id": "WQBcp", "label": "B", "text": "$30^\\circ$", "isCorrect": false, "image": null}, {"id": "toz2L", "label": "C", "text": "$60^\\circ$", "isCorrect": false, "image": null}, {"id": "xXRzJ", "label": "D", "text": "$0^\\circ$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given $\\vec{P} = \\hat{i}+\\hat{j}+\\hat{k}$ and $\\vec{Q} = -\\hat{i}-\\hat{j}-\\hat{k}$.<br><br>We can write $\\vec{Q} = -(\\hat{i}+\\hat{j}+\\hat{k}) = -\\vec{P}$.<br><br>Now, calculate $(\\vec{P}-\\vec{Q})$:<br><br>$\\vec{P}-\\vec{Q} = \\vec{P} - (-\\vec{P}) = 2\\vec{P}$<br><br>Since $(\\vec{P}-\\vec{Q})$ is a positive scalar multiple of $\\vec{P}$, both vectors are in the same direction.<br><br>Therefore, the angle between $(\\vec{P}-\\vec{Q})$ and $\\vec{P}$ is $0^\\circ$.<br><br>Answer: $0^\\circ$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886f15a9fc0fc8c143ac", "type": "singleCorrect", "question": {"text": "The resultant $\\vec{R}$ of $\\vec{P}$ and $\\vec{Q}$ is perpendicular to $\\vec{P}$. Also $|\\vec{P}| = |\\vec{R}|$. The angle between $\\vec{P}$ and $\\vec{Q}$ is<br>($\\tan 45^\\circ = 1$)", "image": null}, "options": [{"id": "ldgUf", "label": "A", "text": "$\\dfrac{\\pi}{4}$", "isCorrect": false, "image": null}, {"id": "CuXHF", "label": "B", "text": "$\\dfrac{3\\pi}{4}$", "isCorrect": true, "image": null}, {"id": "2kzIs", "label": "C", "text": "$\\dfrac{5\\pi}{4}$", "isCorrect": false, "image": null}, {"id": "xRo4M", "label": "D", "text": "$\\dfrac{7\\pi}{4}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $\\vec{R} = \\vec{P} + \\vec{Q}$ and $\\vec{R}$ is perpendicular to $\\vec{P}$.<br><br>$\\vec{R} \\cdot \\vec{P} = 0$<br><br>$(\\vec{P} + \\vec{Q}) \\cdot \\vec{P} = 0$<br><br>$P^2 + PQ \\cos\\theta = 0$<br><br>$Q \\cos\\theta = -P$<br><br>Also given $|\\vec{R}| = |\\vec{P}|$, which implies $R^2 = P^2$.<br><br>$P^2 + Q^2 + 2PQ \\cos\\theta = P^2$<br><br>$Q^2 + 2PQ \\cos\\theta = 0$<br><br>Substituting $Q \\cos\\theta = -P$ into the above equation:<br><br>$Q^2 + 2P(-P) = 0$<br><br>$Q^2 = 2P^2 \\Rightarrow Q = \\sqrt{2}P$<br><br>Substituting $Q = \\sqrt{2}P$ in $Q \\cos\\theta = -P$:<br><br>$\\sqrt{2}P \\cos\\theta = -P$<br><br>$\\cos\\theta = -\\dfrac{1}{\\sqrt{2}}$<br><br>$\\theta = \\dfrac{3\\pi}{4}$<br><br>Answer: $\\dfrac{3\\pi}{4}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887e15a9fc0fc8c14438", "type": "singleCorrect", "question": {"text": "A vector $\\vec{A}$ has magnitude $6$ units is added to vector $\\vec{B}$ which is along $x$-axis. The resultant of $\\vec{A}$ and $\\vec{B}$ is along $y$-axis. If the magnitude of the resultant of $\\vec{A}$ and $\\vec{B}$ is $3$ times that of $\\vec{B}$ then the magnitude of $\\vec{B}$ is", "image": null}, "options": [{"id": "SI2B6", "label": "A", "text": "$3$", "isCorrect": false, "image": null}, {"id": "sWo0y", "label": "B", "text": "$\\sqrt{3.6}$", "isCorrect": true, "image": null}, {"id": "j3xfu", "label": "C", "text": "$6$", "isCorrect": false, "image": null}, {"id": "7sfp9", "label": "D", "text": "$4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $\\vec{B} = B\\hat{i}$, where $B$ is the magnitude of $\\vec{B}$.<br><br>The resultant vector is $\\vec{R} = \\vec{A} + \\vec{B}$.<br><br>Since $\\vec{R}$ is along the y-axis and its magnitude is $3$ times that of $\\vec{B}$, we can write $\\vec{R} = 3B\\hat{j}$.<br><br>From the vector addition, we obtain $\\vec{A} = \\vec{R} - \\vec{B}$.<br><br>Substituting the vectors gives $\\vec{A} = 3B\\hat{j} - B\\hat{i}$.<br><br>The magnitude of $\\vec{A}$ is $|\\vec{A}| = \\sqrt{(-B)^2 + (3B)^2} = \\sqrt{B^2 + 9B^2} = B\\sqrt{10}$.<br><br>Given that the magnitude of $\\vec{A}$ is $6$, we equate them:<br><br>$B\\sqrt{10} = 6$<br><br>Squaring both sides gives:<br><br>$10B^2 = 36$<br><br>$B^2 = 3.6$<br><br>$B = \\sqrt{3.6}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88bb15a9fc0fc8c14676", "type": "singleCorrect", "question": {"text": "The resultant of two vectors $\\vec{A}$ and $\\vec{B}$ is $\\vec{C}$. If the magnitude of $\\vec{B}$ is doubled, the new resultant vector becomes perpendicular to $\\vec{A}$. Then the magnitude of $\\vec{C}$ is", "image": null}, "options": [{"id": "A2f8s", "label": "A", "text": "$B$", "isCorrect": true, "image": null}, {"id": "dYfXw", "label": "B", "text": "$2B$", "isCorrect": false, "image": null}, {"id": "NKREg", "label": "C", "text": "$3B$", "isCorrect": false, "image": null}, {"id": "XX5w3", "label": "D", "text": "$4B$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given that the resultant of $\\vec{A}$ and $\\vec{B}$ is $\\vec{C}$, we have:<br><br>$\\vec{C} = \\vec{A} + \\vec{B}$<br><br>The magnitude of $\\vec{C}$ is given by:<br><br>$C^2 = A^2 + B^2 + 2AB \\cos \\theta$<br><br>When the magnitude of $\\vec{B}$ is doubled, the new resultant vector is $\\vec{R} = \\vec{A} + 2\\vec{B}$.<br><br>It is given that $\\vec{R}$ is perpendicular to $\\vec{A}$, so their dot product must be zero:<br><br>$\\vec{R} \\cdot \\vec{A} = 0$<br><br>$(\\vec{A} + 2\\vec{B}) \\cdot \\vec{A} = 0$<br><br>$A^2 + 2\\vec{A} \\cdot \\vec{B} = 0$<br><br>$A^2 + 2AB \\cos \\theta = 0$<br><br>$2AB \\cos \\theta = -A^2$<br><br>Substituting this value into the equation for $C^2$:<br><br>$C^2 = A^2 + B^2 + (-A^2)$<br><br>$C^2 = B^2$<br><br>$C = B$<br><br>Answer: $B$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2bf8c30a4553e1bdc62", "type": "singleCorrect", "question": {"text": "Resultant of two vectors $\\vec{P}$ and $\\vec{Q}$ is of magnitude A. If $\\vec{Q}$ is reversed, then the resultant is of magnitude B. The value of $A^2 + B^2$ is", "image": null}, "options": [{"id": "D6Vdg", "label": "A", "text": "$P^2 + Q^2$", "isCorrect": false, "image": null}, {"id": "eurND", "label": "B", "text": "$P^2 - Q^2$", "isCorrect": false, "image": null}, {"id": "C8vOn", "label": "C", "text": "$2(P^2 + Q^2)$", "isCorrect": true, "image": null}, {"id": "lSbG4", "label": "D", "text": "$2(P^2 - Q^2)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the angle between vectors $\\vec{P}$ and $\\vec{Q}$ be $\\theta$.<br><br>The magnitude of the resultant of $\\vec{P}$ and $\\vec{Q}$ is $A$.<br><br>$A^2 = P^2 + Q^2 + 2PQ \\cos\\theta$<br><br>When $\\vec{Q}$ is reversed, the angle between $\\vec{P}$ and $-\\vec{Q}$ becomes $180^\\circ - \\theta$.<br><br>The magnitude of the new resultant is $B$.<br><br>$B^2 = P^2 + Q^2 + 2PQ \\cos(180^\\circ - \\theta)$<br><br>$B^2 = P^2 + Q^2 - 2PQ \\cos\\theta$<br><br>Adding the two equations, we get:<br><br>$A^2 + B^2 = (P^2 + Q^2 + 2PQ \\cos\\theta) + (P^2 + Q^2 - 2PQ \\cos\\theta)$<br><br>$A^2 + B^2 = 2(P^2 + Q^2)$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3308c30a4553e1be11b", "type": "singleCorrect", "question": {"text": "Let $\\vec{P} = \\hat{i} + \\hat{j} + \\hat{k}$ and $\\vec{Q} = -(\\hat{i} + \\hat{j} + \\hat{k})$. The angle between $(\\vec{P} - \\vec{Q})$ and $\\vec{P}$ is", "image": null}, "options": [{"id": "QJ2k6", "label": "A", "text": "$90^\\circ$", "isCorrect": false, "image": null}, {"id": "KmoVf", "label": "B", "text": "$60^\\circ$", "isCorrect": false, "image": null}, {"id": "mEn4b", "label": "C", "text": "$0^\\circ$", "isCorrect": true, "image": null}, {"id": "5KEmJ", "label": "D", "text": "$30^\\circ$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $\\vec{P} = \\hat{i} + \\hat{j} + \\hat{k}$ and $\\vec{Q} = -(\\hat{i} + \\hat{j} + \\hat{k})$.<br><br>We can write $\\vec{Q} = -\\vec{P}$.<br><br>Calculating the vector $(\\vec{P} - \\vec{Q})$:<br><br>$\\vec{P} - \\vec{Q} = \\vec{P} - (-\\vec{P}) = 2\\vec{P}$<br><br>Since $(\\vec{P} - \\vec{Q})$ is a positive scalar multiple of $\\vec{P}$, the two vectors are parallel and point in the same direction.<br><br>Therefore, the angle between $(\\vec{P} - \\vec{Q})$ and $\\vec{P}$ is $0^\\circ$.<br><br>Answer: $0^\\circ$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2dc8c30a4553e1bdd98", "type": "singleCorrect", "question": {"text": "Let $\\vec{A}$ and $\\vec{B}$ are two non-zero vectors of different magnitude. Which one of the following is the correct equation ?", "image": null}, "options": [{"id": "2DgBl", "label": "A", "text": "$\\vec{A} \\cdot \\vec{B} = -\\vec{B} \\cdot \\vec{A}$", "isCorrect": false, "image": null}, {"id": "yYXTU", "label": "B", "text": "$\\vec{A} \\times \\vec{B} = \\vec{B} \\times \\vec{A}$", "isCorrect": false, "image": null}, {"id": "bHP6e", "label": "C", "text": "$\\vec{A} + \\vec{B} = \\vec{B} + \\vec{A}$", "isCorrect": true, "image": null}, {"id": "y5vPp", "label": "D", "text": "$\\vec{A} - \\vec{B} = \\vec{B} - \\vec{A}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Vector addition follows the commutative law, which means the order of addition does not change the result.<br><br>$\\vec{A} + \\vec{B} = \\vec{B} + \\vec{A}$<br><br>The dot product is commutative, so $\\vec{A} \\cdot \\vec{B} = \\vec{B} \\cdot \\vec{A}$.<br><br>The cross product is anti-commutative, so $\\vec{A} \\times \\vec{B} = -\\vec{B} \\times \\vec{A}$.<br><br>Vector subtraction is not commutative, so $\\vec{A} - \\vec{B} = -(\\vec{B} - \\vec{A})$.<br><br>Answer: $\\vec{A} + \\vec{B} = \\vec{B} + \\vec{A}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3158c30a4553e1bdff8", "type": "singleCorrect", "question": {"text": "A vector $\\vec{A}$ when added to the sum of the vectors $(\\hat{i} - 2\\hat{j} + 2\\hat{k})$ and $(-2\\hat{i} + \\hat{j} - \\hat{k})$ gives a unit vector along Y axis. The magnitude of vector $\\vec{A}$ is", "image": null}, "options": [{"id": "VAJL7", "label": "A", "text": "$\\sqrt{3}$", "isCorrect": false, "image": null}, {"id": "OsI8j", "label": "B", "text": "$\\sqrt{6}$", "isCorrect": true, "image": null}, {"id": "YBQzs", "label": "C", "text": "$\\sqrt{8}$", "isCorrect": false, "image": null}, {"id": "7dyDk", "label": "D", "text": "$\\sqrt{10}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the given vectors be $\\vec{V}_1 = \\hat{i} - 2\\hat{j} + 2\\hat{k}$ and $\\vec{V}_2 = -2\\hat{i} + \\hat{j} - \\hat{k}$.<br><br>The sum of these vectors is $\\vec{V}_1 + \\vec{V}_2 = -\\hat{i} - \\hat{j} + \\hat{k}$.<br><br>According to the given condition, $\\vec{A} + (\\vec{V}_1 + \\vec{V}_2) = \\hat{j}$.<br><br>Substituting the sum, we get $\\vec{A} + (-\\hat{i} - \\hat{j} + \\hat{k}) = \\hat{j}$.<br><br>$\\vec{A} = \\hat{j} - (-\\hat{i} - \\hat{j} + \\hat{k}) = \\hat{i} + 2\\hat{j} - \\hat{k}$.<br><br>The magnitude of vector $\\vec{A}$ is $|\\vec{A}| = \\sqrt{1^2 + 2^2 + (-1)^2} = \\sqrt{6}$.<br><br>Answer: $\\sqrt{6}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b32bf9280d7f9932706", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Three vectors are expressed as $\\vec{a}=4 \\hat{i}-\\hat{j}, \\vec{b}=-3 \\hat{i}+2 \\hat{j}$ and $\\vec{c}=-\\hat{k}$. The unit vector along the direction of sum of these vectors is", "image": null}, "options": [{"id": "J0N5p", "text": "$\\frac{\\hat{\\mathrm{i}}+\\hat{\\mathrm{j}}-\\widehat{\\mathrm{k}}}{\\sqrt{3}}$", "image": null, "isCorrect": true}, {"id": "215ln", "text": "$\\frac{1}{3}(\\hat{\\mathrm{i}}-\\hat{\\mathrm{j}}+\\hat{\\mathrm{k}})$", "image": null, "isCorrect": false}, {"id": "DBSu4", "text": "$\\frac{1}{\\sqrt{2}}(\\hat{\\mathrm{i}}-\\hat{\\mathrm{j}}+\\hat{\\mathrm{k}})$", "image": null, "isCorrect": false}, {"id": "z3IB6", "text": "$\\frac{1}{\\sqrt{2}}(\\hat{\\mathrm{i}}+\\hat{\\mathrm{j}}+\\hat{\\mathrm{k}})$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $\\vec{R}$ be the sum of the given vectors.<br><br>$\\vec{R} = \\vec{a} + \\vec{b} + \\vec{c}$<br><br>$\\vec{R} = (4\\hat{i} - \\hat{j}) + (-3\\hat{i} + 2\\hat{j}) + (-\\hat{k})$<br><br>$\\vec{R} = \\hat{i} + \\hat{j} - \\hat{k}$<br><br>The magnitude of the sum vector is:<br><br>$|\\vec{R}| = \\sqrt{(1)^2 + (1)^2 + (-1)^2} = \\sqrt{3}$<br><br>The unit vector along the direction of the sum is:<br><br>$\\hat{R} = \\dfrac{\\vec{R}}{|\\vec{R}|} = \\dfrac{\\hat{i} + \\hat{j} - \\hat{k}}{\\sqrt{3}}$<br><br>Answer: $\\frac{\\hat{\\mathrm{i}}+\\hat{\\mathrm{j}}-\\widehat{\\mathrm{k}}}{\\sqrt{3}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260120279619d9d8a2186", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}], "question": {"text": "A mass $2 \\sqrt{3} \\mathrm{~kg}$ is acted upon by two forces which are inclined to each other at $60^{\\circ}$ and each of magnitude $1 \\mathrm{~N}$. The acceleration of that mass in SI system is $\\left[\\sin 30^{\\circ}=\\cos 60^{\\circ}=0.5\\right]$", "image": null}, "options": [{"id": "SnLcg", "text": "$0.7 \\mathrm{~m} / \\mathrm{s}^{2}$", "image": null, "isCorrect": false}, {"id": "vnKxS", "text": "$0.3 \\mathrm{~m} / \\mathrm{s}^{2}$", "image": null, "isCorrect": false}, {"id": "fqM0N", "text": "$0.9 \\mathrm{~m} / \\mathrm{s}^{2}$", "image": null, "isCorrect": false}, {"id": "Fg1sp", "text": "$0.5 \\mathrm{~m} / \\mathrm{s}^{2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$F_{n e t}=\\sqrt{F_{1}^{2}+F_{2}^{2}+2 F_{1} F_{2} \\cos \\theta}$\n$=\\sqrt{1+1+2 \\cos 60}$\n$=\\sqrt{3}$\nNow,\n$a=\\mathrm{F} / \\mathrm{m}=\\sqrt{3} / 2 \\sqrt 3=0.5 \\mathrm{~m} / \\mathrm{s}^{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2600f0279619d9d8a2169", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}], "question": {"text": "A vector $\\vec{A}$ having magnitude 6 units is added to vector $\\overrightarrow{\\mathrm{B}}$, which is along $\\mathrm{x}$ -axis. The resultant of $\\vec{A}$ and $\\vec{B}$ is along $Y$ axis. If the magnitude of the resultant of $\\vec{A}$ and $\\vec{B}$ is three times that of $\\vec{B}$ then magnitude of $\\vec{B}$ is", "image": null}, "options": [{"id": "cWAsD", "text": "$\\sqrt{1 \\cdot 8}$", "image": null, "isCorrect": false}, {"id": "0LQ76", "text": "$\\sqrt{2 \\cdot 4}$", "image": null, "isCorrect": false}, {"id": "DGuHY", "text": "$\\sqrt{3 \\cdot 6}$", "image": null, "isCorrect": true}, {"id": "7RqEA", "text": "$\\sqrt{1 \\cdot 2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$[R]=[L],[P]=[L],[Q]=[L]$\nAlso, $\\left[\\frac{P^{2}-Q^{2}}{2}\\right]=\\left[L^{2}\\right]$\n$\\Rightarrow \\pi R\\left[\\frac{P^{2}-Q^{2}}{2}\\right]=\\left[L^{3}\\right]=[x]=[$ volume $]$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260010279619d9d8a20fb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "The magnitude of the sum of the two vectors $\\overrightarrow{\\mathrm{A}}$ and $\\overrightarrow{\\mathrm{B}}$ is equal to the magnitude of\nthe difference of two vectors $\\overrightarrow{\\mathrm{A}}$ and $\\overrightarrow{\\mathrm{B}}$. The angle between $\\overrightarrow{\\mathrm{A}}$ and $\\overrightarrow{\\mathrm{B}}$ is", "image": null}, "options": [{"id": "JLRE3", "text": "$30^{\\circ}$", "image": null, "isCorrect": false}, {"id": "5ZyzZ", "text": "$45^{\\circ}$", "image": null, "isCorrect": false}, {"id": "pVwJt", "text": "$90^{\\circ}$", "image": null, "isCorrect": true}, {"id": "PePQ9", "text": "$180^{\\circ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the two vectors be $\\vec{A}$ and $\\vec{B}$ with magnitudes $A$ and $B$ respectively. Then magnitude of their sum is given by:\n$|\\vec{A}+\\vec{B}|=\\sqrt{A^{2}+B^{2}+2 A B \\cos \\theta} \\rightarrow(1)(\\theta=$ angle between the vectors $)$\nMagnitude of their difference is given by:\n$|\\overrightarrow{\\mathrm{A}}-\\overrightarrow{\\mathrm{B}}|=\\sqrt{\\mathrm{A}^{2}+\\mathrm{B}^{2}-2 \\mathrm{AB} \\cos \\theta} \\rightarrow(2)$\nAs $|\\vec{A}+\\vec{B}|=|\\vec{A}-\\vec{B}|$\n$\\Rightarrow \\mathrm{A}^{2}+\\mathrm{B}^{2}+2 \\mathrm{AB} \\cos \\theta=\\mathrm{A}^{2}+\\mathrm{B}^{2}-2 \\mathrm{AB} \\cos \\theta$\n$\\Rightarrow 4 \\mathrm{AB} \\cos \\theta=0$ or $\\cos \\theta=0$\n$\\Rightarrow \\theta=90^{\\circ}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fec0279619d9d8a2051", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "The angle subtended by the vector $\\vec{A}=4 \\hat{\\imath}+3 \\hat{\\jmath}+12 \\hat{k}$ with the $\\mathrm{x}$ -axis is", "image": null}, "options": [{"id": "h4wQf", "text": "$\\sin ^{-1}\\left(\\frac{4}{13}\\right)$", "image": null, "isCorrect": false}, {"id": "ns7FA", "text": "$\\cos ^{-1}\\left(\\frac{3}{13}\\right)$", "image": null, "isCorrect": false}, {"id": "WYCxN", "text": "$\\cos ^{-1}\\left(\\frac{4}{13}\\right)$", "image": null, "isCorrect": true}, {"id": "tgrEp", "text": "$\\sin ^{-1}\\left(\\frac{3}{13}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\vec{A}=4 i+3 j+12 k$\n$p=i$\n$\\cos \\theta \\frac{\\mid \\vec{A} \\cdot \\vec{B}}{|A||B|} \\Rightarrow \\frac{4}{\\sqrt{16+9+144} \\times 1}$\n$\\theta \\begin{aligned} \\Rightarrow \\cos ^{\\prime} 1 / 13 & \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fec0279619d9d8a2050", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "What is the angle between resultant of $\\overrightarrow{\\mathrm{A}}+\\overrightarrow{\\mathrm{B}}$ and $\\overrightarrow{\\mathrm{A}} \\times \\overrightarrow{\\mathrm{B}}$ ?", "image": null}, "options": [{"id": "XPmEW", "text": "$\\pi \\mathrm{rad}$", "image": null, "isCorrect": false}, {"id": "C09Ge", "text": "$0^{\\circ}$", "image": null, "isCorrect": false}, {"id": "jxh8d", "text": "$\\frac{\\pi}{2} \\mathrm{rad}$", "image": null, "isCorrect": true}, {"id": "UOF0z", "text": "$\\frac{\\pi}{4} \\mathrm{rad}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given,\nTwo vectors A and B.\nA and B are two vectors. So, their sum A + B lies in the same plane where A and B lie (Since they are non -parallel so they define a plane and the cross product between them is not zero.)\n$\\mathrm{A} \\times \\mathrm{B}=|\\mathrm{A}||\\mathrm{B}| \\sin \\alpha \\mathrm{n}$, where $\\alpha$ is the angle between $\\mathrm{A} \\& \\mathrm{~B}$ and $\\mathrm{n}$ is the unit vector perpendicular to the plane containing A \\& B. So, the angle between $(\\mathrm{A}+\\mathrm{B})$ and $(\\mathrm{A} \\times \\mathrm{B})$ is $90^{\\circ}$.\nMathematically,\n$|\\mathrm{A}+\\mathrm{B} \\| \\mathrm{A} \\times \\mathrm{B}| \\cos \\alpha=(\\mathrm{A}+\\mathrm{B}) \\cdot(\\mathrm{A} \\times \\mathrm{B})$\n$=A \\cdot(A \\times B)+B \\cdot(A \\times B)$\n$=B \\cdot(A \\times A)+A \\cdot(B \\times B)$\n$=0+0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fdb0279619d9d8a1fcc", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "The resultant of two vectors $\\overrightarrow{\\mathrm{P}}$ and $\\overrightarrow{\\mathrm{Q}}$ is $\\overrightarrow{\\mathrm{R}}$. When the direction of $\\overrightarrow{\\mathrm{Q}}$ is reversed, the\nresultant is given by $\\overrightarrow{\\mathrm{S}}$. Which one of the following is true for vectors $\\overrightarrow{\\mathrm{R}}$ and $\\overrightarrow{\\mathrm{S}}$ ?", "image": null}, "options": [{"id": "sgsKX", "text": "$\\mathrm{R}^{2}-\\mathrm{S}^{2}=\\left(\\mathrm{P}^{2}+\\mathrm{Q}^{2}\\right)$", "image": null, "isCorrect": false}, {"id": "SYSkL", "text": "$\\mathrm{R}^{2}-\\mathrm{S}^{2}=2(\\overrightarrow{\\mathrm{P}} \\cdot \\overrightarrow{\\mathrm{Q}})$", "image": null, "isCorrect": false}, {"id": "uMfqu", "text": "$\\mathrm{R}^{2}+\\mathrm{S}^{2}=4(\\overrightarrow{\\mathrm{P}} \\cdot \\overrightarrow{\\mathrm{Q}})$", "image": null, "isCorrect": false}, {"id": "1fB7s", "text": "$\\mathrm{R}^{2}+\\mathrm{S}^{2}=2\\left(\\mathrm{P}^{2}+\\mathrm{Q}^{2}\\right)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "(B)\nGiven,\n$P+Q=R$\nAfter reversing direction of $R$, we gel\n$\\begin{array}{l}\nr=-P-Q \\\\\nS=-P-Q\n\\end{array}$\nSo let angle between $P$ and $Q$ be $Q$\nSo resurtants.\n$\\begin{array}{l}\nR^{2}=p^{2}+Q^{2}+2 P Q \\cos \\theta...(1) \\\\ \ns^{2}=p^{2}+Q^{2}-2 P Q \\cos \\theta \\quad...(2) \\\n\\end{array}$\nAdthing equation (1) and (2)\n$R^{2}+S^{2}=2\\left(P^{2}+Q^{2}\\right)$\nSo, the corvect answer is $R^{2}+s^{2}=2\\left(p^{2}+Q^{2}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fc90279619d9d8a1f3b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "The resultant of two vectors $\\vec{A}$ and $\\vec{B}$ is $\\vec{C}$. If the magnitude of $\\vec{B}$ is doubled, the new resultant vector becomes perpendicular to $\\overrightarrow{\\mathrm{A}}$. Then the magnitude of $\\overrightarrow{\\mathrm{C}}$ is", "image": null}, "options": [{"id": "6EsGQ", "text": "3B", "image": null, "isCorrect": false}, {"id": "pyhgd", "text": "2B", "image": null, "isCorrect": true}, {"id": "0COtJ", "text": "B", "image": null, "isCorrect": false}, {"id": "RcwMd", "text": "4B", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the question, $A+B=C \\ldots . .(0)$\nAlso, when $B$ is doubled, $C$ becomes\nperpendicular to $A$. Let the new magnitude of $C$\nbe $C^{\\prime}$\nThat means $A . C^{\\prime}=0\\left(A C^{\\prime} \\cos 90=0\\right)$\n$>(A)(A+2 B)=0 \\ldots \\ldots .(1)$\n$>\\left(A^{\\wedge} 2+2 A B\\right)=0$\n$>|A|=-2 A B$\nTo find the magnitude of $C$, square eq. (0)\n$>(A+B)^{\\wedge} 2=|C|$\n$>|A|+|B|+2 A B$\nbut $2 A B=-|A| .$ from $(1)$\nwhich means $|C|=|B|$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fc70279619d9d8a1f2e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "The x, y components of vector $\\overrightarrow{\\mathrm{P}}$ have magnitudes 1 and 3 and the $\\mathrm{x}, \\mathrm{y}$ components of resultant of $\\overrightarrow{\\mathrm{P}}$ and $\\overrightarrow{\\mathrm{Q}}$ have magnitudes 5 and 6 respectively. What is the magnitude of $\\overrightarrow{\\mathrm{Q}}$ ?", "image": null}, "options": [{"id": "ebSSK", "text": "4", "image": null, "isCorrect": false}, {"id": "ZuO15", "text": "5", "image": null, "isCorrect": true}, {"id": "K6zje", "text": "3", "image": null, "isCorrect": false}, {"id": "r3E67", "text": "2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "AS, $\\quad \\vec{P}=1 \\hat{i}+3 \\hat{j}-(i)$\nAnd, $\\vec{p}+\\vec{Q}=5 \\hat{i}+6 \\hat{j}-(i i)$\n$\\therefore \\vec{Q}=4 \\hat{i}+3 \\hat{j}$\n$\\begin{aligned} \\therefore|\\vec{Q}|=\\sqrt{4^{2}+3^{2}}=\\sqrt{16+9} &=\\sqrt{25} \\\\ &=5 \\end{aligned}$\noption-2 correct", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fb50279619d9d8a1ea2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "Two vectors of same magnitude have a resultant equal to either of the two vectos. The angle between two vectors is", "image": null}, "options": [{"id": "J4NHB", "text": "$\\operatorname{cos}^{-1}(-0 \\cdot 3)$", "image": null, "isCorrect": false}, {"id": "SSKRO", "text": "$\\cos ^{-1}(-0-6)$", "image": null, "isCorrect": false}, {"id": "GgVha", "text": "$\\operatorname{cos}^{-1}(-0 \\cdot 4)$", "image": null, "isCorrect": false}, {"id": "U5ddj", "text": "$\\operatorname{cos}^{-1}(-0 \\cdot 5)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "This is an important result to remember. Two vectors at 120 degree produce a vector equal to their magnitude. Let their magnitude be a,\n$$\n\\begin{array}{l}\n\\text { Resultant }=a=\\sqrt{\\left(a^{2}+a^{2}+2 \\times a \\times a \\times \\cos \\theta\\right)}=a \\sqrt{(2+2 \\cos \\theta)} \\Rightarrow \\cos \\theta=-\\frac{1}{2} \\\\\n\\Rightarrow \\theta=120^{0}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fb10279619d9d8a1e83", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "A body of mass $2 \\mathrm{~kg}$ is acted upon by two forces each of magnitude $1 \\mathrm{~N}$ and inclined at $60^{\\circ}$ with each other. The acceleration of the body in $\\frac{\\mathrm{m}}{\\mathrm{s}}$ is $\\left[\\cos 60^{\\circ}=0.5\\right]$", "image": null}, "options": [{"id": "eNTgQ", "text": "$\\sqrt{0.35}$", "image": null, "isCorrect": false}, {"id": "dsjUT", "text": "$\\sqrt{0.65}$", "image": null, "isCorrect": false}, {"id": "aROIh", "text": "$\\sqrt{0.75}$", "image": null, "isCorrect": true}, {"id": "sDlju", "text": "$\\sqrt{0.20}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let us apply the parallelogram law of vectors to find the resultant of the forces.\n$\\mathrm{F}_{\\text {net }}=\\sqrt{\\mathrm{F}_{1}^{2}+\\mathrm{F}_{2}^{2}+2 \\times \\mathrm{F}_{1} \\mathrm{~F}_{2} \\cos \\theta}$\nGiven: $\\mathrm{F}_{1}=1, \\mathrm{~F}_{2}=1$ and $\\theta=60^{\\circ}$\nSo, $\\mathrm{F}_{\\text {net }}=\\sqrt{(1)^{2}+(1)^{2}+2 \\times 1 \\times 1 \\times \\cos 60^{0}}=\\sqrt{1+1+2 \\times 1 / 2}=\\sqrt{3} \\mathrm{~N}$\nNow\n$\\mathrm{F}=\\mathrm{ma}$\nor, $a=\\frac{F}{m}=\\frac{\\sqrt{3}}{2} m / s^{2}$\nThus, the net acceleration of the body is $\\frac{\\sqrt{3}}{2} \\mathrm{~m} / \\mathrm{s}^{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fa10279619d9d8a1e08", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "If $\\overrightarrow{\\mathrm{A}}=a_{1} \\hat{\\imath}+a_{2} \\hat{\\jmath}$ and $\\overrightarrow{\\mathrm{B}}=b_{1} \\hat{\\imath}+b_{2} \\hat{\\jmath}$ are perpendicular to each other then", "image": null}, "options": [{"id": "ALC21", "text": "$\\frac{\\mathrm{b}_{2}}{\\mathrm{a}_{1}}=-\\frac{\\mathrm{a}_{2}}{\\mathrm{~b}_{1}}$", "image": null, "isCorrect": false}, {"id": "HJ82e", "text": "$\\frac{\\mathrm{a}_{1}}{\\mathrm{~b}_{2}}=+\\frac{\\mathrm{a}_{2}}{\\mathrm{~b}_{1}}$", "image": null, "isCorrect": false}, {"id": "0NkYr", "text": "$\\frac{\\mathrm{b}_{2}}{\\mathrm{a}_{1}}=+\\frac{\\mathrm{a}_{2}}{\\mathrm{~b}_{1}}$", "image": null, "isCorrect": false}, {"id": "MsTAn", "text": "$\\frac{a_{1}}{b_{2}}=-\\frac{\\mathrm{a}_{2}}{\\mathrm{~b}_{1}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "No Solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f8b0279619d9d8a1d54", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "For any two vectors $\\vec{A}$ and $\\vec{B}$ if $\\vec{A} \\cdot \\vec{B}=|\\vec{A} \\times \\vec{B}|$, the magnitude of\n$(\\vec{A}+\\vec{B})$ is $\\left(\\tan \\frac{\\pi}{4}=1, \\cos \\frac{\\pi}{4}=\\frac{1}{\\sqrt{2}}\\right)$", "image": null}, "options": [{"id": "uS1rd", "text": "$\\sqrt{A^{2}+B^{2}+\\sqrt{2} A B}$", "image": null, "isCorrect": true}, {"id": "vkzsx", "text": "$\\sqrt{A^{2}+B^{2}+\\frac{A B}{\\sqrt{2}}}$", "image": null, "isCorrect": false}, {"id": "sPb7Q", "text": "$A+B$", "image": null, "isCorrect": false}, {"id": "G21PQ", "text": "$\\sqrt{A^{2}+B^{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From the given condition,\n$\\mathrm{AB} \\cos \\theta=\\mathrm{AB} \\sin \\theta$\nSo, $\\theta=45^{\\circ}$\nMagnitude of $\\mathrm{A}+\\mathrm{B}$ will be,\n$|\\mathrm{A}+\\mathrm{B}|=\\sqrt{\\mathrm{A}^{2}+\\mathrm{B}^{2}+2 \\mathrm{AB} \\cos 45^{\\circ}}$\n$=\\sqrt{A^{2}+B^{2}+2 A B \\times \\frac{1}{\\sqrt{2}}}$\n$=\\sqrt{A^{2}+B^{2}+\\sqrt{2} A B}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f8b0279619d9d8a1d53", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "If a vector \\(A=2 i+2 j+3 k\\) and \\(B=3 i+6 j+n k\\) are perpendicular to each other, then the value of \\(n\\) is", "image": null}, "options": [{"id": "HYjwy", "text": "$0 \\cdot 5$", "image": null, "isCorrect": true}, {"id": "PyqaN", "text": "$-0 \\cdot 5$", "image": null, "isCorrect": false}, {"id": "k8JxW", "text": "1", "image": null, "isCorrect": false}, {"id": "rXzfn", "text": "$-1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If two vectors are perpendicular, then the dot product is zero.\n\\(\\begin{aligned}\n&A=2 i+2 j+3 k \\\\\n&B=3 i+6 j+n k \\\\\n&A \\cdot B=0=>6+12+3 n=0 \\\\\n&\\Rightarrow>18=-3 n \\\\\n&\\Rightarrow n=-6\n\\end{aligned}\\)\nHence the value of \\(n\\) is \\(-6\\).", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f780279619d9d8a1cbe", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}], "question": {"text": "Two unit vectors ' $\\hat{a}_{1}$ 'and ' $\\hat{a}_{2}$ ' are inclined to each other at an angle ' $\\theta$ '.\nIf $\\left|\\hat{a}_{1}-\\hat{a}_{2}\\right|=\\sqrt{3}$, then the value of $\\left(\\hat{a}_{1}-\\hat{a}_{2}\\right) \\cdot\\left(2 \\hat{a}_{1}-\\hat{a}_{2}\\right)$ is", "image": null}, "options": [{"id": "fTPtM", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "tMnlw", "text": "2", "image": null, "isCorrect": false}, {"id": "YxgdM", "text": "1", "image": null, "isCorrect": false}, {"id": "3mg4J", "text": "$\\frac{3}{2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\left|\\hat{a}_{1}-\\hat{a}_{2}\\right|=\\sqrt{3} \\rightarrow(1)$\n$\\left|\\hat{a}_{1}\\right|=\\left|\\hat{a}_{2}\\right|=1$\n$\\hat{a}_{1}^{2}+\\hat{a}_{2}^{2}-2 \\hat{a}_{1} \\hat{a}_{2} \\cos \\theta=3 \\quad$ squaring (1)\n$1+1-2 \\cos \\theta=3 \\quad=\\left(\\hat{a}_{1}-\\hat{a}_{2}\\right) \\cdot\\left(2 \\hat{a}_{1}-\\hat{a}_{2}\\right)$\n$\\cos \\theta=-1 / 2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f770279619d9d8a1cb6", "type": "singleCorrect", "level": 1, "questionLabels": [], "pre
