r>Percentage error in momentum is $\\dfrac{\\Delta p}{p} \\times 100 = \\dfrac{\\Delta m}{m} \\times 100 + \\dfrac{\\Delta v}{v} \\times 100$<br><br>$\\dfrac{\\Delta p}{p} \\times 100 = 0.73\\% + 1.84\\% = 2.57\\%$<br><br>Kinetic energy is given by $K = \\dfrac{1}{2}mv^2$<br><br>Percentage error in kinetic energy is $\\dfrac{\\Delta K}{K} \\times 100 = \\dfrac{\\Delta m}{m} \\times 100 + 2\\dfrac{\\Delta v}{v} \\times 100$<br><br>$\\dfrac{\\Delta K}{K} \\times 100 = 0.73\\% + 2(1.84\\%) = 0.73\\% + 3.68\\% = 4.41\\%$<br><br>Answer: $2.57\\%$ , $4.41\\%$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3058c30a4553e1bdf50", "type": "singleCorrect", "question": {"text": "A cuboid has volume $V = l \\times l \\times \\sqrt{l}$, where $l$ is the length of one side. When the length $l$ is measured by a meter scale of least count $1\\,\\text{mm}$, the relative percentage error in the measurement of its volume is $6.25\\%$. Then the relative percentage error in measurement of its length and the value of the length $l$ is", "image": null}, "options": [{"id": "el5ro", "label": "A", "text": "$2\\%$ and $2$ cm", "isCorrect": false, "image": null}, {"id": "awr9g", "label": "B", "text": "$2.5\\%$ and $4$ cm", "isCorrect": true, "image": null}, {"id": "5ITTJ", "label": "C", "text": "$1.8\\%$ and $3.6$ cm", "isCorrect": false, "image": null}, {"id": "v8Dhz", "label": "D", "text": "$1\\%$ and $3$ cm", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $V = l \\times l \\times \\sqrt{l} = l^{5/2}$<br><br>The relative percentage error in volume is given by:<br><br>$\\dfrac{\\Delta V}{V} \\times 100 = \\dfrac{5}{2} \\left( \\dfrac{\\Delta l}{l} \\times 100 \\right)$<br><br>Substituting the given percentage error in volume:<br><br>$6.25 = \\dfrac{5}{2} \\left( \\dfrac{\\Delta l}{l} \\times 100 \\right)$<br><br>$\\dfrac{\\Delta l}{l} \\times 100 = \\dfrac{6.25 \\times 2}{5} = 2.5\\%$<br><br>The relative percentage error in the measurement of length is $2.5\\%$.<br><br>The least count of the meter scale is $\\Delta l = 1 \\text{ mm} = 0.1 \\text{ cm}$.<br><br>Using the percentage error in length:<br><br>$\\dfrac{0.1}{l} \\times 100 = 2.5$<br><br>$\\dfrac{10}{l} = 2.5$<br><br>$l = \\dfrac{10}{2.5} = 4 \\text{ cm}$<br><br>Answer: $2.5\\%$ and $4$ cm", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e98c30a4553e1bde23", "type": "singleCorrect", "question": {"text": "The maximum error in the measurement of the density and mass of the uniform cube are 8% and 2% respectively. Hence, the maximum error in the measurement of length will be", "image": null}, "options": [{"id": "A7Zbf", "label": "A", "text": "$2\\%$", "isCorrect": true, "image": null}, {"id": "lLdgX", "label": "B", "text": "$4\\%$", "isCorrect": false, "image": null}, {"id": "SD9Gk", "label": "C", "text": "$6\\%$", "isCorrect": false, "image": null}, {"id": "cWOpp", "label": "D", "text": "$8\\%$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The density of a uniform cube is given by the formula:<br><br>$\\rho = \\dfrac{M}{V} = \\dfrac{M}{L^3}$<br><br>The maximum percentage error in the measurement of density is given by the sum of the percentage errors of the individual measured quantities:<br><br>$\\dfrac{\\Delta \\rho}{\\rho} \\times 100 = \\dfrac{\\Delta M}{M} \\times 100 + 3 \\left(\\dfrac{\\Delta L}{L} \\times 100\\right)$<br><br>Given that the maximum percentage error in density is $8\\%$ and the maximum percentage error in mass is $2\\%$, substituting these values yields:<br><br>$8\\% = 2\\% + 3 \\left(\\dfrac{\\Delta L}{L} \\times 100\\right)$<br><br>$3 \\left(\\dfrac{\\Delta L}{L} \\times 100\\right) = 8\\% - 2\\% = 6\\%$<br><br>$\\dfrac{\\Delta L}{L} \\times 100 = 2\\%$<br><br>Therefore, the maximum error in the measurement of length is $2\\%$.<br><br>Answer: $2\\%$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3218c30a4553e1be07b", "type": "singleCorrect", "question": {"text": "If two resistors of resistances have values $R_1 = (350 \\pm 3)\\ \\Omega$ and $R_2 = (140 \\pm 4)\\ \\Omega$. The percentage error for the sum and difference of $R_1$ and $R_2$ are respectively", "image": null}, "options": [{"id": "y8nvA", "label": "A", "text": "$1.43\\%$ , $3.33\\%$", "isCorrect": true, "image": null}, {"id": "05p2k", "label": "B", "text": "$7\\%$ , $1\\%$", "isCorrect": false, "image": null}, {"id": "DDZYE", "label": "C", "text": "$1\\%$ , $7\\%$", "isCorrect": false, "image": null}, {"id": "kUrz7", "label": "D", "text": "$3.33\\%$ , $1.43\\%$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $R_1 = (350 \\pm 3)\\ \\Omega$ and $R_2 = (140 \\pm 4)\\ \\Omega$.<br><br>For the sum of resistances:<br>$R_s = R_1 + R_2 = 350 + 140 = 490\\ \\Omega$<br>The absolute error in the sum is the sum of absolute errors:<br>$\\Delta R_s = \\Delta R_1 + \\Delta R_2 = 3 + 4 = 7\\ \\Omega$<br>Percentage error in sum = $\\dfrac{\\Delta R_s}{R_s} \\times 100 = \\dfrac{7}{490} \\times 100 = \\dfrac{100}{70} \\approx 1.43\\%$<br><br>For the difference of resistances:<br>$R_d = R_1 - R_2 = 350 - 140 = 210\\ \\Omega$<br>The absolute error in the difference is also the sum of absolute errors:<br>$\\Delta R_d = \\Delta R_1 + \\Delta R_2 = 3 + 4 = 7\\ \\Omega$<br>Percentage error in difference = $\\dfrac{\\Delta R_d}{R_d} \\times 100 = \\dfrac{7}{210} \\times 100 = \\dfrac{100}{30} \\approx 3.33\\%$<br><br>The percentage errors are $1.43\\%$ and $3.33\\%$ respectively.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d33d8c30a4553e1be1a7", "type": "singleCorrect", "question": {"text": "A force 'F' is applied on a square plate of side 'L'. If the percentage error in determining 'L' is 3% and that in 'F' is 2% then the percentage error in determining the pressure is", "image": null}, "options": [{"id": "TUQhF", "label": "A", "text": "$5\\%$", "isCorrect": false, "image": null}, {"id": "PULNG", "label": "B", "text": "$6\\%$", "isCorrect": false, "image": null}, {"id": "wKcSG", "label": "C", "text": "$7\\%$", "isCorrect": false, "image": null}, {"id": "JEK6v", "label": "D", "text": "$8\\%$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Pressure is given by $P = \\dfrac{F}{A}$<br><br>For a square plate of side $L$, the area is $A = L^2$<br><br>Therefore, $P = \\dfrac{F}{L^2}$<br><br>The maximum percentage error in pressure is given by $\\dfrac{\\Delta P}{P} \\times 100 = \\dfrac{\\Delta F}{F} \\times 100 + 2 \\left( \\dfrac{\\Delta L}{L} \\times 100 \\right)$<br><br>Given $\\dfrac{\\Delta F}{F} \\times 100 = 2\\%$ and $\\dfrac{\\Delta L}{L} \\times 100 = 3\\%$<br><br>Substituting the values, we get $\\dfrac{\\Delta P}{P} \\times 100 = 2\\% + 2(3\\%) = 8\\%$<br><br>Answer: $8\\%$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2bf8c30a4553e1bdc61", "type": "singleCorrect", "question": {"text": "Mass and volume of a body are found to be $(6.00 \\pm 0.03)$ kg and $(2.00 \\pm 0.02)$ $\\text{m}^3$ respectively. Then the density of a body is", "image": null}, "options": [{"id": "RCbP0", "label": "A", "text": "$(3.00 \\pm 0.010)$ $\\text{kg/m}^3$", "isCorrect": false, "image": null}, {"id": "ejqzL", "label": "B", "text": "$(3.00 \\pm 0.015)$ $\\text{kg/m}^3$", "isCorrect": false, "image": null}, {"id": "vHDp5", "label": "C", "text": "$(3.00 \\pm 0.020)$ $\\text{kg/m}^3$", "isCorrect": false, "image": null}, {"id": "kzQY3", "label": "D", "text": "$(3.00 \\pm 0.045)$ $\\text{kg/m}^3$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Density $\\rho = \\dfrac{M}{V}$<br><br>$\\rho = \\dfrac{6.00}{2.00} = 3.00 \\text{ kg/m}^3$<br><br>The maximum fractional error in density is given by<br><br>$\\dfrac{\\Delta \\rho}{\\rho} = \\dfrac{\\Delta M}{M} + \\dfrac{\\Delta V}{V}$<br><br>$\\dfrac{\\Delta \\rho}{3.00} = \\dfrac{0.03}{6.00} + \\dfrac{0.02}{2.00}$<br><br>$\\dfrac{\\Delta \\rho}{3.00} = 0.005 + 0.010 = 0.015$<br><br>$\\Delta \\rho = 3.00 \\times 0.015 = 0.045 \\text{ kg/m}^3$<br><br>Thus, the density of the body is $(3.00 \\pm 0.045) \\text{ kg/m}^3$.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d18c30a4553e1bdd24", "type": "singleCorrect", "question": {"text": "The error in the measurement of length and mass of a cube is 3% and 4% respectively. The error in the measurement of its density will be", "image": null}, "options": [{"id": "LHcFh", "label": "A", "text": "$13\\ \\%$", "isCorrect": true, "image": null}, {"id": "W4aOY", "label": "B", "text": "$6\\ \\%$", "isCorrect": false, "image": null}, {"id": "69X7S", "label": "C", "text": "$9\\ \\%$", "isCorrect": false, "image": null}, {"id": "cDFKN", "label": "D", "text": "$15\\ \\%$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Density of a cube is given by $\\rho = \\dfrac{M}{V} = \\dfrac{M}{L^3}$<br><br>The maximum percentage error in density is<br><br>$\\dfrac{\\Delta \\rho}{\\rho} \\times 100 = \\dfrac{\\Delta M}{M} \\times 100 + 3 \\left( \\dfrac{\\Delta L}{L} \\times 100 \\right)$<br><br>Given $\\dfrac{\\Delta M}{M} \\times 100 = 4\\%$ and $\\dfrac{\\Delta L}{L} \\times 100 = 3\\%$<br><br>$\\dfrac{\\Delta \\rho}{\\rho} \\times 100 = 4\\% + 3(3\\%) = 4\\% + 9\\% = 13\\%$<br><br>Answer: $13\\ \\%$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3328c30a4553e1be137", "type": "singleCorrect", "question": {"text": "A wire has mass $(0.3 \\pm 0.003)$ gram, radius $(0.5 \\pm 0.005)$ cm and length $(6 \\pm 0.06)$ cm. The maximum percentage error in the measurement of density is", "image": null}, "options": [{"id": "6ZI0d", "label": "A", "text": "$2\\,\\%$", "isCorrect": false, "image": null}, {"id": "jN4uR", "label": "B", "text": "$3\\,\\%$", "isCorrect": false, "image": null}, {"id": "tUqTi", "label": "C", "text": "$4\\,\\%$", "isCorrect": true, "image": null}, {"id": "AtPiC", "label": "D", "text": "$5\\,\\%$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Density of the wire is given by $\\rho = \\dfrac{m}{\\pi r^2 l}$<br><br>The maximum percentage error in density is<br><br>$\\dfrac{\\Delta \\rho}{\\rho} \\times 100 = \\left( \\dfrac{\\Delta m}{m} + 2 \\dfrac{\\Delta r}{r} + \\dfrac{\\Delta l}{l} \\right) \\times 100$<br><br>Substituting the given values:<br><br>$\\dfrac{\\Delta \\rho}{\\rho} \\times 100 = \\left( \\dfrac{0.003}{0.3} + 2 \\times \\dfrac{0.005}{0.5} + \\dfrac{0.06}{6} \\right) \\times 100$<br><br>$\\dfrac{\\Delta \\rho}{\\rho} \\times 100 = (0.01 + 2 \\times 0.01 + 0.01) \\times 100$<br><br>$\\dfrac{\\Delta \\rho}{\\rho} \\times 100 = 0.04 \\times 100 = 4\\,\\%$<br><br>Answer: $4\\,\\%$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2dc8c30a4553e1bdd94", "type": "singleCorrect", "question": {"text": "A wire has mass $(0.3 \\pm 0.003)$ gram, radius $(0.5 \\pm 0.005)$ mm and length $(6 \\pm 0.06)$ cm. The maximum error in the measurement of density is", "image": null}, "options": [{"id": "hzH43", "label": "A", "text": "$4\\%$", "isCorrect": true, "image": null}, {"id": "m3Xxa", "label": "B", "text": "$3\\%$", "isCorrect": false, "image": null}, {"id": "BBW7O", "label": "C", "text": "$2\\%$", "isCorrect": false, "image": null}, {"id": "e2Uyc", "label": "D", "text": "$5\\%$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Density of the wire is given by $\\rho = \\dfrac{m}{\\pi r^2 l}$<br><br>The maximum percentage error in density is<br><br>$\\dfrac{\\Delta \\rho}{\\rho} \\times 100 = \\left( \\dfrac{\\Delta m}{m} + 2 \\dfrac{\\Delta r}{r} + \\dfrac{\\Delta l}{l} \\right) \\times 100$<br><br>Given values are:<br><br>$\\dfrac{\\Delta m}{m} \\times 100 = \\dfrac{0.003}{0.3} \\times 100 = 1\\%$<br><br>$\\dfrac{\\Delta r}{r} \\times 100 = \\dfrac{0.005}{0.5} \\times 100 = 1\\%$<br><br>$\\dfrac{\\Delta l}{l} \\times 100 = \\dfrac{0.06}{6} \\times 100 = 1\\%$<br><br>Substituting these values, we get:<br><br>$\\dfrac{\\Delta \\rho}{\\rho} \\times 100 = 1\\% + 2(1\\%) + 1\\% = 4\\%$<br><br>Answer: $4\\%$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3178c30a4553e1be012", "type": "singleCorrect", "question": {"text": "The length of rod is measured by meter scale having least count $0.1$ cm and diameter is measured by vernier callipers having least count $0.01$ cm. Length of rod is $5.0$ cm and radius $2.0$ cm. The percentage error in the calculated value of the volume is", "image": null}, "options": [{"id": "LzgyA", "label": "A", "text": "$1\\%$", "isCorrect": false, "image": null}, {"id": "4Z4DR", "label": "B", "text": "$2.5\\%$", "isCorrect": true, "image": null}, {"id": "xxi9q", "label": "C", "text": "$5\\%$", "isCorrect": false, "image": null}, {"id": "aIzBf", "label": "D", "text": "$7\\%$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The volume of the cylindrical rod is given by $V = \\dfrac{\\pi D^2 L}{4}$, where $D$ is the diameter and $L$ is the length.<br><br>The percentage error in the volume is given by:<br>$\\dfrac{\\Delta V}{V} \\times 100 = \\left( 2\\dfrac{\\Delta D}{D} + \\dfrac{\\Delta L}{L} \\right) \\times 100$<br><br>Given that the diameter is measured by vernier callipers, the measured quantity is $D$.<br>Radius $r = 2.0$ cm $\\Rightarrow$ Diameter $D = 4.0$ cm<br>Least count of vernier callipers, $\\Delta D = 0.01$ cm<br>Length $L = 5.0$ cm<br>Least count of meter scale, $\\Delta L = 0.1$ cm<br><br>Substituting the values into the percentage error formula:<br>$\\dfrac{\\Delta V}{V} \\times 100 = \\left( 2 \\times \\dfrac{0.01}{4.0} + \\dfrac{0.1}{5.0} \\right) \\times 100$<br><br>$\\dfrac{\\Delta V}{V} \\times 100 = \\left( \\dfrac{0.02}{4.0} + \\dfrac{0.1}{5.0} \\right) \\times 100$<br><br>$\\dfrac{\\Delta V}{V} \\times 100 = \\left( \\dfrac{1}{200} + \\dfrac{1}{50} \\right) \\times 100$<br><br>$\\dfrac{\\Delta V}{V} \\times 100 = \\dfrac{100}{200} + \\dfrac{100}{50} = 0.5 + 2 = 2.5\\%$<br><br>Answer: $2.5\\%$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29a8c30a4553e1bdacf", "type": "singleCorrect", "question": {"text": "The length of a cylinder is measured with a meter rod having least count $0.1$ cm. Its diameter is measured with vernier calipers having least count $0.01$ cm. Length of cylinder is $8.0$ cm and radius is $4.0$ cm. Find the percentage error in the calculated value of the volume.", "image": null}, "options": [{"id": "3pu1W", "label": "A", "text": "$1.25\\%$", "isCorrect": false, "image": null}, {"id": "peY9x", "label": "B", "text": "$1.75\\%$", "isCorrect": false, "image": null}, {"id": "5Y179", "label": "C", "text": "$1.5\\%$", "isCorrect": true, "image": null}, {"id": "WdPv0", "label": "D", "text": "$2.75\\%$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The volume of a cylinder is given by $V = \\pi R^2 L$.<br><br>Since the diameter $D$ is measured, we can write the volume in terms of diameter as $V = \\dfrac{\\pi D^2 L}{4}$.<br><br>The maximum percentage error in the volume is given by:<br>$\\dfrac{\\Delta V}{V} \\times 100 = \\left( 2 \\dfrac{\\Delta D}{D} + \\dfrac{\\Delta L}{L} \\right) \\times 100$<br><br>Given values:<br>Length of the cylinder, $L = 8.0$ cm<br>Least count of meter rod, $\\Delta L = 0.1$ cm<br>Radius of the cylinder, $R = 4.0$ cm $\\Rightarrow$ Diameter, $D = 2R = 8.0$ cm<br>Least count of vernier calipers, $\\Delta D = 0.01$ cm<br><br>Substituting these values into the percentage error formula:<br>$\\dfrac{\\Delta V}{V} \\times 100 = \\left( 2 \\times \\dfrac{0.01}{8.0} + \\dfrac{0.1}{8.0} \\right) \\times 100$<br><br>$\\dfrac{\\Delta V}{V} \\times 100 = \\left( \\dfrac{0.02}{8.0} + \\dfrac{0.1}{8.0} \\right) \\times 100$<br><br>$\\dfrac{\\Delta V}{V} \\times 100 = \\left( \\dfrac{0.12}{8.0} \\right) \\times 100$<br><br>$\\dfrac{\\Delta V}{V} \\times 100 = \\dfrac{12}{8.0} = 1.5\\%$<br><br>Answer: $1.5\\%$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36c8c30a4553e1be395", "type": "singleCorrect", "question": {"text": "The period of oscillation of a simple pendulum is $T = 2\\pi (L/g)^{1/2}$. Measured value of 'L' is 10 cm known to 1 mm accuracy and time for 100 oscillations is 50 second, using a watch of 1 second resolution. The percentage error in the measurement of 'g' is", "image": null}, "options": [{"id": "A8LbY", "label": "A", "text": "$2\\%$", "isCorrect": false, "image": null}, {"id": "nUdg6", "label": "B", "text": "$4\\%$", "isCorrect": false, "image": null}, {"id": "3BNcP", "label": "C", "text": "$5\\%$", "isCorrect": true, "image": null}, {"id": "4DGAb", "label": "D", "text": "$8\\%$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The formula for the time period of a simple pendulum is given by $T = 2\\pi \\sqrt{\\dfrac{L}{g}}$.<br><br>Squaring both sides and rearranging for $g$, we get:<br><br>$g = \\dfrac{4\\pi^2 L}{T^2}$<br><br>The maximum percentage error in the measurement of $g$ is:<br><br>$\\dfrac{\\Delta g}{g} \\times 100 = \\left( \\dfrac{\\Delta L}{L} + 2 \\dfrac{\\Delta T}{T} \\right) \\times 100$<br><br>Given the measured value of length $L = 10 \\text{ cm}$ and accuracy $\\Delta L = 1 \\text{ mm} = 0.1 \\text{ cm}$.<br><br>The percentage error in length is:<br><br>$\\dfrac{\\Delta L}{L} \\times 100 = \\dfrac{0.1}{10} \\times 100 = 1\\%$<br><br>The time for $100$ oscillations is $t = 50 \\text{ s}$ and the resolution of the watch is $\\Delta t = 1 \\text{ s}$.<br><br>Since $T = \\dfrac{t}{n}$, the relative error in $T$ is the same as the relative error in $t$:<br><br>$\\dfrac{\\Delta T}{T} = \\dfrac{\\Delta t}{t} = \\dfrac{1}{50}$<br><br>The percentage error in time period is:<br><br>$\\dfrac{\\Delta T}{T} \\times 100 = \\dfrac{1}{50} \\times 100 = 2\\%$<br><br>Substituting these values into the error equation for $g$:<br><br>$\\dfrac{\\Delta g}{g} \\times 100 = 1\\% + 2(2\\%) = 1\\% + 4\\% = 5\\%$<br><br>Answer: $5\\%$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d35e8c30a4553e1be301", "type": "singleCorrect", "question": {"text": "A quantity P is related as $X^{-2}Y^{-3/2}Z^{2/5}$ where X,Y,Z are independent parameters which have fractional errors of $0.1, 0.2$ and $0.5$ respectively in measurement. The maximum fractional error in P is", "image": null}, "options": [{"id": "4c7Oh", "label": "A", "text": "$0.7$", "isCorrect": true, "image": null}, {"id": "8oJOK", "label": "B", "text": "$0.1$", "isCorrect": false, "image": null}, {"id": "B8kJ1", "label": "C", "text": "$0.8$", "isCorrect": false, "image": null}, {"id": "W22zs", "label": "D", "text": "$0.6$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $P = X^{-2}Y^{-3/2}Z^{2/5}$<br><br>The maximum fractional error in $P$ is given by<br><br>$\\dfrac{\\Delta P}{P} = |-2|\\dfrac{\\Delta X}{X} + \\left|-\\dfrac{3}{2}\\right|\\dfrac{\\Delta Y}{Y} + \\left|\\dfrac{2}{5}\\right|\\dfrac{\\Delta Z}{Z}$<br><br>Substituting the given fractional errors $\\dfrac{\\Delta X}{X} = 0.1$, $\\dfrac{\\Delta Y}{Y} = 0.2$, and $\\dfrac{\\Delta Z}{Z} = 0.5$:<br><br>$\\dfrac{\\Delta P}{P} = 2(0.1) + \\dfrac{3}{2}(0.2) + \\dfrac{2}{5}(0.5)$<br><br>$\\dfrac{\\Delta P}{P} = 0.2 + 0.3 + 0.2 = 0.7$<br><br>Answer: $0.7$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b38c30a4553e1bdbde", "type": "singleCorrect", "question": {"text": "The period of oscillation of a simple pendulum is given by $T = 2\\pi \\sqrt{\\dfrac{l}{g}}$ where $l$ is about $80$ cm and is known to have $0.1$ cm accuracy. The period is about $1.5$ s. The time of $50$ oscillations is measured by a stop watch of least count $0.1$ s. The percentage error in $g$ is nearly", "image": null}, "options": [{"id": "Hdk46", "label": "A", "text": "$0.8$", "isCorrect": false, "image": null}, {"id": "ZgLyF", "label": "B", "text": "$0.4$", "isCorrect": true, "image": null}, {"id": "L3FjB", "label": "C", "text": "$0.1$", "isCorrect": false, "image": null}, {"id": "1RnTK", "label": "D", "text": "$1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The formula for the time period of a simple pendulum is $T = 2\\pi \\sqrt{\\dfrac{l}{g}}$.<br><br>Rearranging for $g$, we get:<br><br>$g = \\dfrac{4\\pi^2 l}{T^2}$<br><br>The percentage error in $g$ is given by:<br><br>$\\dfrac{\\Delta g}{g} \\times 100 = \\left( \\dfrac{\\Delta l}{l} + 2 \\dfrac{\\Delta T}{T} \\right) \\times 100$<br><br>Given values are:<br><br>$l = 80$ cm, $\\Delta l = 0.1$ cm<br><br>The time for $50$ oscillations is $t = 50 \\times 1.5 = 75$ s.<br><br>The error in measuring the total time is the least count of the stopwatch, so $\\Delta t = 0.1$ s.<br><br>Since $T = \\dfrac{t}{50}$, the relative error in $T$ is the same as the relative error in $t$:<br><br>$\\dfrac{\\Delta T}{T} = \\dfrac{\\Delta t}{t} = \\dfrac{0.1}{75}$<br><br>Substituting these values into the error equation:<br><br>$\\dfrac{\\Delta g}{g} \\times 100 = \\left( \\dfrac{0.1}{80} + 2 \\times \\dfrac{0.1}{75} \\right) \\times 100$<br><br>$\\dfrac{\\Delta g}{g} \\times 100 = \\left( \\dfrac{1}{800} + \\dfrac{2}{750} \\right) \\times 100$<br><br>$\\dfrac{\\Delta g}{g} \\times 100 = \\dfrac{100}{800} + \\dfrac{200}{750} = 0.125 + 0.2667 = 0.3917$<br><br>The percentage error in $g$ is nearly $0.4\\%$.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf8bf9280d7f9932e1f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A physical quantity ' X ' is related to four measurable quantities ' a ', ' b ', ' c ' and ' d ' as $\\mathrm{X}=\\mathrm{a}^2 \\mathrm{~b}^3 \\mathrm{c}^{5 / 2} \\mathrm{~d}^{-2}$. The percentage error in the measurement of ' $a$ ', ' $b$ ', ' $c$ ' and ' $d$ ' are $1 \\%, 2 \\%, 2 \\%$ and $4 \\%$ respectively. The percentage error in measurement of quantity ' X ' is", "image": null}, "options": [{"id": "yrDBA", "text": "$15 \\%$", "image": null, "isCorrect": false}, {"id": "bTzIM", "text": "$17 \\%$", "image": null, "isCorrect": false}, {"id": "yrWuZ", "text": "$21 \\%$", "image": null, "isCorrect": true}, {"id": "aEnRq", "text": "$23 \\%$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $X = a^2 b^3 c^{5/2} d^{-2}$<br><br>The maximum percentage error in $X$ is given by<br><br>$\\dfrac{\\Delta X}{X} \\times 100 = 2 \\left(\\dfrac{\\Delta a}{a} \\times 100\\right) + 3 \\left(\\dfrac{\\Delta b}{b} \\times 100\\right) + \\dfrac{5}{2} \\left(\\dfrac{\\Delta c}{c} \\times 100\\right) + 2 \\left(\\dfrac{\\Delta d}{d} \\times 100\\right)$<br><br>Substituting the given values:<br><br>$\\dfrac{\\Delta X}{X} \\times 100 = 2(1\\%) + 3(2\\%) + \\dfrac{5}{2}(2\\%) + 2(4\\%)$<br><br>$\\dfrac{\\Delta X}{X} \\times 100 = 2\\% + 6\\% + 5\\% + 8\\% = 21\\%$<br><br>Answer: $21 \\%$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be9bf9280d7f9932d8c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If the maximum percentage error in the measurement of distance (h) and time ( t ) are ' $e_1$ ' and ' $e_2$ ' respectively, the percentage error in the measurement of acceleration of gravity ( g ) is [use $\\mathrm{h}=\\frac{1}{2} \\mathrm{gt}^2$ ]", "image": null}, "options": [{"id": "2Bbtu", "text": "$e_1+2 e_2$", "image": null, "isCorrect": true}, {"id": "KYTFa", "text": "$e_1+e_2$", "image": null, "isCorrect": false}, {"id": "rmQmO", "text": "$e_1-2 e_2$", "image": null, "isCorrect": false}, {"id": "Ccb3b", "text": "$e_2-e_1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given the relation $h = \\dfrac{1}{2} g t^2$<br><br>Rearranging for $g$, we get $g = \\dfrac{2h}{t^2}$<br><br>The maximum percentage error in $g$ is given by the sum of the percentage error in $h$ and twice the percentage error in $t$.<br><br>$\\dfrac{\\Delta g}{g} \\times 100 = \\dfrac{\\Delta h}{h} \\times 100 + 2 \\left( \\dfrac{\\Delta t}{t} \\times 100 \\right)$<br><br>Substituting the given percentage errors for $h$ and $t$ as $e_1$ and $e_2$ respectively:<br><br>Percentage error in $g = e_1 + 2e_2$<br><br>Answer: $e_1+2 e_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bdbbf9280d7f9932d0b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "In an experiment four quantities $p, q, r$ and $s$ are measured with percentage $3 \\%, 2 \\%, 3 \\%$ and $1 \\%$ respectively. Quantity ' A ' is calculated as follows $\\mathrm{A}=\\frac{\\mathrm{pq}^2}{\\mathrm{r}^2 \\mathrm{~s}^4}$, the percentage error in ' A ' is", "image": null}, "options": [{"id": "3m1ji", "text": "$17 \\%$", "image": null, "isCorrect": true}, {"id": "8B3G0", "text": "$12 \\%$", "image": null, "isCorrect": false}, {"id": "IGP1q", "text": "$18 \\%$", "image": null, "isCorrect": false}, {"id": "xDrkW", "text": "$19 \\%$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given the relation for quantity $A$:<br><br>$A = \\dfrac{p q^2}{r^2 s^4}$<br><br>The maximum percentage error in $A$ is given by the sum of the percentage errors of the individual quantities multiplied by their respective powers:<br><br>$\\dfrac{\\Delta A}{A} \\times 100 = \\left( \\dfrac{\\Delta p}{p} \\times 100 \\right) + 2 \\left( \\dfrac{\\Delta q}{q} \\times 100 \\right) + 2 \\left( \\dfrac{\\Delta r}{r} \\times 100 \\right) + 4 \\left( \\dfrac{\\Delta s}{s} \\times 100 \\right)$<br><br>Substituting the given percentage errors for $p, q, r,$ and $s$ ($3\\%, 2\\%, 3\\%,$ and $1\\%$ respectively):<br><br>$\\dfrac{\\Delta A}{A} \\times 100 = 3\\% + 2(2\\%) + 2(3\\%) + 4(1\\%)$<br><br>$\\dfrac{\\Delta A}{A} \\times 100 = 3\\% + 4\\% + 6\\% + 4\\%$<br><br>$\\dfrac{\\Delta A}{A} \\times 100 = 17\\%$<br><br>Answer: $17 \\%$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bcabf9280d7f9932c6c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The error in the measurement of length and mass of a cube is $3 \\%$ and $4 \\%$ respectively. The error in the measurement of density will be", "image": null}, "options": [{"id": "FYtec", "text": "$6 \\%$", "image": null, "isCorrect": false}, {"id": "dGxOp", "text": "$13 \\%$", "image": null, "isCorrect": true}, {"id": "JRFSR", "text": "$9 \\%$", "image": null, "isCorrect": false}, {"id": "rHGDE", "text": "$15 \\%$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Density of a cube is given by $\\rho = \\dfrac{M}{V} = \\dfrac{M}{L^3}$<br><br>The maximum percentage error in density is:<br><br>$\\dfrac{\\Delta \\rho}{\\rho} \\times 100 = \\dfrac{\\Delta M}{M} \\times 100 + 3 \\left( \\dfrac{\\Delta L}{L} \\times 100 \\right)$<br><br>Given $\\dfrac{\\Delta M}{M} \\times 100 = 4\\%$ and $\\dfrac{\\Delta L}{L} \\times 100 = 3\\%$<br><br>$\\dfrac{\\Delta \\rho}{\\rho} \\times 100 = 4\\% + 3(3\\%) = 4\\% + 9\\% = 13\\%$<br><br>Answer: $13 \\%$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bb3bf9280d7f9932bb1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A force $F$ is applied on a square plate of side $L$. If the percentage error in determining F is $3 \\%$ and that in L is $2 \\%$, then the percentage error in determining the pressure is", "image": null}, "options": [{"id": "aEBsc", "text": "$7 \\%$", "image": null, "isCorrect": true}, {"id": "hko7M", "text": "$5 \\%$", "image": null, "isCorrect": false}, {"id": "n0CZ7", "text": "$3 \\%$", "image": null, "isCorrect": false}, {"id": "5I4pz", "text": "$2 \\%$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Pressure is given by $P = \\dfrac{F}{A}$<br><br>For a square plate of side $L$, area $A = L^2$<br><br>Therefore, $P = \\dfrac{F}{L^2}$<br><br>The maximum percentage error in pressure is given by:<br><br>$\\dfrac{\\Delta P}{P} \\times 100 = \\dfrac{\\Delta F}{F} \\times 100 + 2 \\left( \\dfrac{\\Delta L}{L} \\times 100 \\right)$<br><br>Given that $\\dfrac{\\Delta F}{F} \\times 100 = 3\\%$ and $\\dfrac{\\Delta L}{L} \\times 100 = 2\\%$<br><br>$\\dfrac{\\Delta P}{P} \\times 100 = 3\\% + 2(2\\%) = 3\\% + 4\\% = 7\\%$<br><br>Answer: $7 \\%$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba3bf9280d7f9932b1f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A wire has a mass $0.3 \\pm 0.003$ gram, radius $0.5 \\pm 0.005 \\mathrm{~mm}$ and length $6 \\pm 0.06 \\mathrm{~cm}$. The maximum percentage error in the measurement of its density is", "image": null}, "options": [{"id": "Uw9xz", "text": "$2 \\%$", "image": null, "isCorrect": false}, {"id": "B0FJZ", "text": "$5 \\%$", "image": null, "isCorrect": false}, {"id": "kmteR", "text": "$4 \\%$", "image": null, "isCorrect": true}, {"id": "ksRmV", "text": "$3 \\%$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Density of the wire is given by $\\rho = \\dfrac{M}{V} = \\dfrac{M}{\\pi r^2 L}$<br><br>The maximum percentage error in density is<br><br>$\\dfrac{\\Delta \\rho}{\\rho} \\times 100 = \\left( \\dfrac{\\Delta M}{M} + 2 \\dfrac{\\Delta r}{r} + \\dfrac{\\Delta L}{L} \\right) \\times 100$<br><br>Given values are:<br><br>$M = 0.3 \\text{ g}, \\Delta M = 0.003 \\text{ g}$<br><br>$r = 0.5 \\text{ mm}, \\Delta r = 0.005 \\text{ mm}$<br><br>$L = 6 \\text{ cm}, \\Delta L = 0.06 \\text{ cm}$<br><br>Substituting the values:<br><br>$\\dfrac{\\Delta \\rho}{\\rho} \\times 100 = \\left( \\dfrac{0.003}{0.3} + 2 \\times \\dfrac{0.005}{0.5} + \\dfrac{0.06}{6} \\right) \\times 100$<br><br>$\\dfrac{\\Delta \\rho}{\\rho} \\times 100 = (0.01 + 2 \\times 0.01 + 0.01) \\times 100$<br><br>$\\dfrac{\\Delta \\rho}{\\rho} \\times 100 = (0.01 + 0.02 + 0.01) \\times 100 = 4 \\%$<br><br>Answer: $4 \\%$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b93bf9280d7f9932a86", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The pressure on a square plate is measured by measuring the force acting on the plate and length of the sides of the plate. The maximum error in the measurement of force and length are respectively $4 \\%$ and $2 \\%$, the percentage error in the measurement of pressure is", "image": null}, "options": [{"id": "F2Jz5", "text": "1%", "image": null, "isCorrect": false}, {"id": "rAlE1", "text": "2%", "image": null, "isCorrect": false}, {"id": "BnRzS", "text": "6%", "image": null, "isCorrect": false}, {"id": "RphiN", "text": "8%", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Pressure is given by $P = \\dfrac{F}{A}$<br><br>For a square plate, area $A = L^2$, so $P = \\dfrac{F}{L^2}$<br><br>The maximum percentage error in pressure is given by $\\dfrac{\\Delta P}{P} \\times 100 = \\dfrac{\\Delta F}{F} \\times 100 + 2 \\dfrac{\\Delta L}{L} \\times 100$<br><br>Given $\\dfrac{\\Delta F}{F} \\times 100 = 4\\%$ and $\\dfrac{\\Delta L}{L} \\times 100 = 2\\%$<br><br>$\\dfrac{\\Delta P}{P} \\times 100 = 4\\% + 2(2\\%) = 4\\% + 4\\% = 8\\%$<br><br>Answer: 8%", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b86bf9280d7f9932a07", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following comes under the category of random errors?", "image": null}, "options": [{"id": "GJoOX", "text": "Improper calibration of thermometer", "image": null, "isCorrect": false}, {"id": "1tXUR", "text": "Zero error of $1 \\mu \\mathrm{V}$ in voltmeter", "image": null, "isCorrect": false}, {"id": "w7wgi", "text": "Student measures $22^{\\circ}$, where as the correct angle is $20^{\\circ}$", "image": null, "isCorrect": false}, {"id": "Jfu8e", "text": "Errors resulting from the fluctuations in electric power supply", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Random errors are those errors which occur irregularly and are unpredictable in magnitude and direction. They arise due to random and unpredictable fluctuations in experimental conditions.<br><br>Improper calibration of a thermometer and zero error in a voltmeter are instrumental errors, which fall under the category of systematic errors.<br><br>A student measuring an incorrect angle is a personal error, which is also a type of systematic or gross error.<br><br>Errors resulting from fluctuations in the electric power supply are unpredictable and occur irregularly, thus they come under the category of random errors.<br><br>Answer: Errors resulting from the fluctuations in electric power supply", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b73bf9280d7f9932958", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The percentage error in the measurement of mass and speed of a particular body is $3 \\%$ and $4 \\%$ respectively. The percentage error in the measurement of kinetic energy is", "image": null}, "options": [{"id": "IT7lV", "text": "9 %", "image": null, "isCorrect": false}, {"id": "K7dr5", "text": "$10 \\%$", "image": null, "isCorrect": false}, {"id": "JD7L0", "text": "$11 \\%$", "image": null, "isCorrect": true}, {"id": "GY09v", "text": "$12 \\%$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Kinetic energy is given by $K = \\dfrac{1}{2} m v^2$<br><br>The percentage error in kinetic energy is given by<br><br>$\\dfrac{\\Delta K}{K} \\times 100 = \\dfrac{\\Delta m}{m} \\times 100 + 2 \\left( \\dfrac{\\Delta v}{v} \\times 100 \\right)$<br><br>Given $\\dfrac{\\Delta m}{m} \\times 100 = 3\\%$ and $\\dfrac{\\Delta v}{v} \\times 100 = 4\\%$<br><br>$\\dfrac{\\Delta K}{K} \\times 100 = 3\\% + 2 \\times 4\\% = 11\\%$<br><br>Answer: $11 \\%$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b67bf9280d7f99328e5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The period of oscillating simple pendulum is $T=2 \\pi \\sqrt{\\frac{\\ell}{g}}$ where length ' $\\ell$ ' is 100 cm with error 1 mm. Period is 2 second. The time of 100 oscillations is measured by a stopwatch of least count 0.1 s. The percentage error in gravitational acceleration ' g ' is", "image": null}, "options": [{"id": "FPyAN", "text": "$0.2 \\%$", "image": null, "isCorrect": true}, {"id": "6mEvC", "text": "$0.1$ %", "image": null, "isCorrect": false}, {"id": "vMWyM", "text": "$1 \\%$", "image": null, "isCorrect": false}, {"id": "ryTSO", "text": "2 %", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The formula for the time period of a simple pendulum is given by:<br><br>$T = 2 \\pi \\sqrt{\\dfrac{\\ell}{g}}$<br><br>Squaring both sides and rearranging for $g$, we get:<br><br>$g = \\dfrac{4 \\pi^2 \\ell}{T^2}$<br><br>The percentage error in $g$ is given by the sum of the percentage error in $\\ell$ and twice the percentage error in $T$:<br><br>$\\dfrac{\\Delta g}{g} \\times 100 = \\dfrac{\\Delta \\ell}{\\ell} \\times 100 + 2 \\dfrac{\\Delta T}{T} \\times 100$<br><br>Given $\\ell = 100 \\text{ cm} = 1000 \\text{ mm}$ and $\\Delta \\ell = 1 \\text{ mm}$, the percentage error in length is:<br><br>$\\dfrac{\\Delta \\ell}{\\ell} \\times 100 = \\dfrac{1}{1000} \\times 100 = 0.1 \\%$<br><br>The time period $T = 2 \\text{ s}$. The total time for $100$ oscillations is $t = 100 \\times 2 = 200 \\text{ s}$.<br><br>The error in measuring the total time is the least count of the stopwatch, $\\Delta t = 0.1 \\text{ s}$.<br><br>Since $T = \\dfrac{t}{100}$, the relative error in $T$ is the same as the relative error in $t$:<br><br>$\\dfrac{\\Delta T}{T} = \\dfrac{\\Delta t}{t} = \\dfrac{0.1}{200}$<br><br>The contribution of the time period to the percentage error in $g$ is:<br><br>$2 \\dfrac{\\Delta T}{T} \\times 100 = 2 \\times \\dfrac{0.1}{200} \\times 100 = 0.1 \\%$<br><br>Therefore, the total percentage error in $g$ is:<br><br>$\\dfrac{\\Delta g}{g} \\times 100 = 0.1 \\% + 0.1 \\% = 0.2 \\%$<br><br>Answer: $0.2 \\%$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b51bf9280d7f993282c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Error in the measurement of radius of the sphere is $2 \\%$. The error in the calculated value of its volume is", "image": null}, "options": [{"id": "NwpKD", "text": "3 %", "image": null, "isCorrect": false}, {"id": "F5EXf", "text": "$2 \\%$", "image": null, "isCorrect": false}, {"id": "8fjeq", "text": "6 %", "image": null, "isCorrect": true}, {"id": "hIh2P", "text": "9 %", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The volume of a sphere is given by $V = \\dfrac{4}{3} \\pi r^3$<br><br>The percentage error in the volume is given by $\\dfrac{\\Delta V}{V} \\times 100 = 3 \\left( \\dfrac{\\Delta r}{r} \\times 100 \\right)$<br><br>Given that the percentage error in the radius is $\\dfrac{\\Delta r}{r} \\times 100 = 2 \\%$<br><br>Therefore, the percentage error in the volume is $3 \\times 2 \\% = 6 \\%$<br><br>Answer: 6 %", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b42bf9280d7f993279a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A physical quantity $A$ can be determined by measuring parameters $B$, $C, D$ and $E$ using the relation $A=\\frac{B^\\alpha C^\\beta}{D^\\gamma E^\\delta}$. If the maximum errors in the measurement are b %, c %, d % and e % then maximum error in the value of $A$ is", "image": null}, "options": [{"id": "CJCBy", "text": "$(\\alpha \\mathrm{b}+\\beta \\mathrm{c}-\\gamma \\mathrm{d}-\\delta \\mathrm{e}) \\%$", "image": null, "isCorrect": false}, {"id": "cC6aY", "text": "$(b+c-d-e) \\%$", "image": null, "isCorrect": false}, {"id": "eIVfO", "text": "$(\\alpha \\mathrm{b}+\\beta \\mathrm{c}+\\gamma \\mathrm{d}+\\delta \\mathrm{e}) \\%$", "image": null, "isCorrect": true}, {"id": "4qRR9", "text": "$(b+c+d+e) \\%$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $A = \\dfrac{B^\\alpha C^\\beta}{D^\\gamma E^\\delta}$<br><br>Taking natural logarithm on both sides:<br><br>$\\ln A = \\alpha \\ln B + \\beta \\ln C - \\gamma \\ln D - \\delta \\ln E$<br><br>Differentiating to find the maximum fractional error, we add the absolute values of the individual fractional errors:<br><br>$\\dfrac{\\Delta A}{A} = \\alpha \\dfrac{\\Delta B}{B} + \\beta \\dfrac{\\Delta C}{C} + \\gamma \\dfrac{\\Delta D}{D} + \\delta \\dfrac{\\Delta E}{E}$<br><br>Multiplying by $100$ to get the percentage error:<br><br>$\\dfrac{\\Delta A}{A} \\times 100 = \\alpha \\left(\\dfrac{\\Delta B}{B} \\times 100\\right) + \\beta \\left(\\dfrac{\\Delta C}{C} \\times 100\\right) + \\gamma \\left(\\dfrac{\\Delta D}{D} \\times 100\\right) + \\delta \\left(\\dfrac{\\Delta E}{E} \\times 100\\right)$<br><br>Substituting the given percentage errors $b\\%, c\\%, d\\%, e\\%$:<br><br>Maximum percentage error in $A = (\\alpha b + \\beta c + \\gamma d + \\delta e)\\%$<br><br>Answer: $(\\alpha \\mathrm{b}+\\beta \\mathrm{c}+\\gamma \\mathrm{d}+\\delta \\mathrm{e}) \\%$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b32bf9280d7f9932703", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The density of a cube is measured by measuring its mass and length of its sides. The % error in the measurement of mass and length are 5 % and $6 \\%$ respectively. The percentage error in the measurement of density is", "image": null}, "options": [{"id": "Xaxu5", "text": "$21 \\%$", "image": null, "isCorrect": false}, {"id": "6oMvb", "text": "23 %", "image": null, "isCorrect": true}, {"id": "nhN6j", "text": "$25 \\%$", "image": null, "isCorrect": false}, {"id": "2NyeS", "text": "27 %", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Density of a cube is given by $\\rho = \\dfrac{m}{V} = \\dfrac{m}{L^3}$<br><br>The maximum percentage error in the measurement of density is given by<br><br>$\\dfrac{\\Delta \\rho}{\\rho} \\times 100 = \\dfrac{\\Delta m}{m} \\times 100 + 3 \\left( \\dfrac{\\Delta L}{L} \\times 100 \\right)$<br><br>Given that $\\dfrac{\\Delta m}{m} \\times 100 = 5\\%$ and $\\dfrac{\\Delta L}{L} \\times 100 = 6\\%$<br><br>Substituting the values, we get<br><br>$\\dfrac{\\Delta \\rho}{\\rho} \\times 100 = 5\\% + 3(6\\%)$<br><br>$\\dfrac{\\Delta \\rho}{\\rho} \\times 100 = 5\\% + 18\\% = 23\\%$<br><br>Answer: 23 %", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b1fbf9280d7f9932673", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A student measures time for 20 oscillations of a simple pendulum as $30 \\mathrm{~s}, 32 \\mathrm{~s}, 35 \\mathrm{~s}$ and 35 s . If the minimum division in the measuring clock is $1 s$, then correct mean time (in second) is", "image": null}, "options": [{"id": "Yul8m", "text": "$(33 \\pm 2)$", "image": null, "isCorrect": true}, {"id": "0KXa2", "text": "$(32 \\pm 3)$", "image": null, "isCorrect": false}, {"id": "lduuD", "text": "$(33 \\pm 3)$", "image": null, "isCorrect": false}, {"id": "oCLu3", "text": "$(32 \\pm 2)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given measurements are $t_{1} = 30 \\text{ s}$, $t_{2} = 32 \\text{ s}$, $t_{3} = 35 \\text{ s}$, and $t_{4} = 35 \\text{ s}$.<br><br>The mean time $t_{m}$ is given by:<br>$t_{m} = \\dfrac{t_{1} + t_{2} + t_{3} + t_{4}}{4}$<br><br>$t_{m} = \\dfrac{30 + 32 + 35 + 35}{4} = \\dfrac{132}{4} = 33 \\text{ s}$<br><br>The absolute errors in each measurement are:<br>$\\Delta t_{1} = |t_{m} - t_{1}| = |33 - 30| = 3 \\text{ s}$<br>$\\Delta t_{2} = |t_{m} - t_{2}| = |33 - 32| = 1 \\text{ s}$<br>$\\Delta t_{3} = |t_{m} - t_{3}| = |33 - 35| = 2 \\text{ s}$<br>$\\Delta t_{4} = |t_{m} - t_{4}| = |33 - 35| = 2 \\text{ s}$<br><br>The mean absolute error $\\Delta t_{m}$ is:<br>$\\Delta t_{m} = \\dfrac{\\Delta t_{1} + \\Delta t_{2} + \\Delta t_{3} + \\Delta t_{4}}{4}$<br><br>$\\Delta t_{m} = \\dfrac{3 + 1 + 2 + 2}{4} = \\dfrac{8}{4} = 2 \\text{ s}$<br><br>Since the mean absolute error ($2 \\text{ s}$) is greater than the least count of the measuring clock ($1 \\text{ s}$), the error in the measurement is taken as $2 \\text{ s}$.<br><br>Therefore, the correct mean time is $(t_{m} \\pm \\Delta t_{m}) = (33 \\pm 2) \\text{ s}$.<br><br>Answer: $(33 \\pm 2)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b0abf9280d7f99325da", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The initial and final temperatures of water as recorded by an observer are $(38.6 \\pm 0.2)^{\\circ} \\mathrm{C}$ and $(82.3 \\pm 0.3)^{\\circ} \\mathrm{C}$. The rise in temperature with proper error limits is", "image": null}, "options": [{"id": "cWlCn", "text": "$(43.7 \\pm 0.2)^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "Fp2xp", "text": "$(43.7 \\pm 0.3)^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "iB94y", "text": "$(43.7 \\pm 0.1)^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "43Cxf", "text": "$(43.7 \\pm 0.5)^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Initial temperature $T_1 = (38.6 \\pm 0.2)^{\\circ} \\mathrm{C}$<br><br>Final temperature $T_2 = (82.3 \\pm 0.3)^{\\circ} \\mathrm{C}$<br><br>Rise in temperature $T = T_2 - T_1$<br><br>$T = 82.3 - 38.6 = 43.7^{\\circ} \\mathrm{C}$<br><br>The maximum permissible error in the difference of two quantities is the sum of their absolute errors.<br><br>Error $\\Delta T = \\Delta T_1 + \\Delta T_2$<br><br>$\\Delta T = 0.2 + 0.3 = 0.5^{\\circ} \\mathrm{C}$<br><br>The rise in temperature is $(43.7 \\pm 0.5)^{\\circ} \\mathrm{C}$<br><br>Answer: $(43.7 \\pm 0.5)^{\\circ} \\mathrm{C}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871af9bf9280d7f993253e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The formula for the physical quantity is $\\mathrm{P}=\\frac{\\mathrm{x}^3 \\mathrm{y}}{\\mathrm{z}^2}$ and the percentage error in the determination of physical quantities $x, y, z$ are $0.6 \\%, 3 \\%$ and $1.3 \\%$ respectively. The percentage error in the measurement of $P$ is", "image": null}, "options": [{"id": "cUCMP", "text": "$2.2 ~\\%$", "image": null, "isCorrect": false}, {"i  "65a25ed30279619d9d8a1795", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}], "question": {"text": "Let <math><mi>x</mi><mo>=</mo><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>c</mi></mrow></mfrac></mrow></mfenced><mi>&nbsp;</mi></math>be the physical quantity. If the percentage error in the measurement of physical quantities <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>b</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>c</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math> percent respectively then percentage error in the measurement of <math><mi>x</mi></math> is", "image": null}, "options": [{"id": "gVjUC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>%</mo></math>", "image": null, "isCorrect": false}, {"id": "4MmM3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>14</mn><mo>%</mo></math>", "image": null, "isCorrect": true}, {"id": "sZIra", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>21</mn><mo>%</mo></math>", "image": null, "isCorrect": false}, {"id": "0V8G8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>28</mn><mo>%</mo></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <mfrac> <mrow> <mi>Δ</mi><mi>x</mi></mrow> <mi>x</mi> </mfrac> <mo>=</mo><mn>2</mn><mfrac> <mrow> <mi>Δ</mi><mi>a</mi></mrow> <mi>a</mi> </mfrac> <mo>+</mo><mn>2</mn><mfrac> <mrow> <mi>Δ</mi><mi>b</mi></mrow> <mi>b</mi> </mfrac> <mo>+</mo><mfrac> <mrow> <mi>Δ</mi><mi>c</mi></mrow> <mi>c</mi> </mfrac></mrow></math><br /><math> <mrow> <mfrac> <mrow> <mi>Δ</mi><mi>x</mi></mrow> <mi>y</mi> </mfrac> <mo>=</mo><mn>2</mn><mo>×</mo><mn>2</mn><mo>+</mo><mn>2</mn><mo>×</mo><mn>3</mn><mo>+</mo><mn>4</mn></mrow> </math><br /><math> <mrow> <mo>=</mo><mn>4</mn><mo>+</mo><mn>6</mn><mo>+</mo><mn>4</mn></mrow> </math><br /><math> <mrow> <mfrac> <mrow> <mi>Δ</mi><mi>x</mi></mrow> <mi>x</mi> </mfrac> <mo>=</mo><mn>14</mn><mi>%</mi></mrow> </math><br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
