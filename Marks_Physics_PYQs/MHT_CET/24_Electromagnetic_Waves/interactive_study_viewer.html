 $\\Phi_E$:<br><br>$I_d = \\varepsilon_0 \\dfrac{d}{dt} \\left( \\dfrac{q}{2\\varepsilon_0} \\right) = \\dfrac{1}{2} \\dfrac{dq}{dt}$<br><br>Since the capacitor is being charged by a constant current $I$, the rate of change of charge is $\\dfrac{dq}{dt} = I$.<br><br>Therefore, the displacement current through the given area is:<br><br>$I_d = \\dfrac{I}{2}$<br><br>Answer: $\\frac{\\mathrm{I}}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2623f0279619d9d8a32fc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "Select the 'WRONG' statement out of the following.", "image": null}, "options": [{"id": "LtRQr", "text": "Electromagnetic waves do not require any medium for their propagation.", "image": null, "isCorrect": false}, {"id": "wepGu", "text": "Electromagnetic waves can travel through vacuum waves speed of light", "image": null, "isCorrect": false}, {"id": "XuH3f", "text": "Material medium is necessary for propagation of electromagnetic waves.", "image": null, "isCorrect": true}, {"id": "Up14T", "text": "Electromagnetic waves are transverse in nature.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Electromagnetic waves can propagate through vacuum. This can be clearly understood from Maxwell's equations for EM waves. Selfsustaining electric and magnetic fields enable waves to travel through empty space.", "im ation between the speed of the wave in the medium, the angle of incidence and the angle of refraction is given by the formula:\n$\\begin{aligned}\n& \\frac{\\mathrm{v}_2}{\\mathrm{v}_1}=\\frac{\\sin \\mathrm{r}}{\\sin \\mathrm{i}} \\\\\n& \\frac{\\mathrm{v}_2}{\\mathrm{v}_1}=\\frac{\\sin 30^{\\circ}}{\\sin 45^{\\circ}} \\\\\n& \\frac{\\mathrm{v}_2}{\\mathrm{v}_1}=\\frac{1}{\\sqrt{2}}\n\\end{aligned}$\n$\\begin{aligned} & \\mathrm{v}_2=\\frac{\\mathrm{v}_1}{\\sqrt{2}} \\\\ & \\mathrm{v}_2=\\frac{3 \\times 10^8}{\\sqrt{2}} \\\\ & \\mathrm{v}_2=2.1 \\times 10^8 \\mathrm{~m} / \\mathrm{s}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2614e0279619d9d8a2b7e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "If $\\varepsilon_0$ and $\\varepsilon$ represent the permittivity of free space and absolute permittivity of a medium then the relative permittivity of the medium is", "image": null}, "options": [{"id": "ZYnjp", "text": "$\\frac{\\varepsilon^2}{\\varepsilon_0}$", "image": null, "isCorrect": false}, {"id": "qy6RI", "text": "$\\frac{\\varepsilon_0}{\\varepsilon}$", "image": null, "isCorrect": false}, {"id": "whJlv", "text": "$\\varepsilon \\varepsilon_0$", "image": null, "isCorrect": false}, {"id": "Q2MzJ", "text": "$\\frac{\\varepsilon}{\\varepsilon_0}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The absolu     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
