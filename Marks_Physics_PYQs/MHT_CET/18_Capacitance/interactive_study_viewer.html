C$ , $2CV^2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ec8c30a4553e1bde41", "type": "singleCorrect", "question": {"text": "Three identical capacitors connected in series have net capacitance '$x$'. Then they are connected in parallel. The ratio of energy stored in series configuration to that in parallel configuration is (if both configurations are connected to the same source)", "image": null}, "options": [{"id": "03GMq", "label": "A", "text": "$1:3$", "isCorrect": false, "image": null}, {"id": "NlaXp", "label": "B", "text": "$3:1$", "isCorrect": false, "image": null}, {"id": "uF3NT", "label": "C", "text": "$1:9$", "isCorrect": true, "image": null}, {"id": "HQibi", "label": "D", "text": "$9:1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the capacitance of each identical capacitor be $C$.<br><br>In series configuration, the equivalent capacitance is $C_s = \\dfrac{C}{3}$.<br><br>In parallel configuration, the equivalent capacitance is $C_p = 3C$.<br><br>The energy stored in a capacitor configuration connected to a voltage source $V$ is given by $U = \\dfrac{1}{2} C_{eq} V^2$.<br><br>For the series configuration, the energy stored is $U_s = \\dfrac{1}{2} C_s V^2 = \\dfrac{1}{2} \\left(\\dfrac{C}{3}\\right) V^2$.<br><br>For the parallel configuration, the energy stored is $U_p = \\dfrac{1}{2} C_p V^2 = \\dfrac{1}{2} (3C) V^2$.<br><br>The ratio of energy stored in series to that in parallel is:<br><br>$\\dfrac{U_s}{U_p} = \\dfrac{\\dfrac{1}{2} \\left(\\dfrac{C}{3}\\right) V^2}{\\dfrac{1}{2} (3C) V^2} = \\dfrac{\\dfrac{C}{3}}{3C} = \\dfrac{1}{9}$<br><br>Thus, the required ratio is $1:9$.<br><br>Answer: $1:9$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3408c30a4553e1be1c5", "type": "singleCorrect", "question": {"text": "If the equivalent capacitance between points A and B of the combination of capacitors shown in figure, is 6C, the capacitor $C^1$ is<br><img style=\"width: 300px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/16_april_shift_2__q31_d1.png\" />", "image": null}, "options": [{"id": "ujkT3", "label": "A", "text": "$9C$", "isCorrect": false, "image": null}, {"id": "ivJe5", "label": "B", "text": "$15C$", "isCorrect": false, "image": null}, {"id": "I16SB", "label": "C", "text": "$18C$", "isCorrect": true, "image": null}, {"id": "OIezF", "label": "D", "text": "$24C$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The capacitors $2C$, $3C$, and $4C$ are connected in parallel. Their equivalent capacitance is:<br>$C_p = 2C + 3C + 4C = 9C$<br><br>This combination is in series with $C^1$. The total equivalent capacitance between A and B is $6C$.<br><br>Using the formula for series combination:<br>$\\dfrac{1}{C_{eq}} = \\dfrac{1}{C_p} + \\dfrac{1}{C^1}$<br><br>$\\dfrac{1}{6C} = \\dfrac{1}{9C} + \\dfrac{1}{C^1}$<br><br>$\\dfrac{1}{C^1} = \\dfrac{1}{6C} - \\dfrac{1}{9C}$<br><br>$\\dfrac{1}{C^1} = \\dfrac{3 - 2}{18C} = \\dfrac{1}{18C}$<br><br>$C^1 = 18C$<br><br>Answer: $18C$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c28c30a4553e1bdc81", "type": "singleCorrect", "question": {"text": "Three capacitors $C_1$, $C_2$ and $C_3$ are connected to voltage source V as shown in figure. The voltage across $C_3$ will be<br><img style=\"width: 400px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/16_april_shift_1__q33_d1.png\" />", "image": null}, "options": [{"id": "e4nnN", "label": "A", "text": "$\\dfrac{C_3 V}{(C_1+C_2+C_3)}$", "isCorrect": false, "image": null}, {"id": "iLSu3", "label": "B", "text": "$\\dfrac{(C_1+C_2)V}{C_3}$", "isCorrect": false, "image": null}, {"id": "2VQAv", "label": "C", "text": "$\\dfrac{(C_2+C_3)V}{C_1+C_2}$", "isCorrect": false, "image": null}, {"id": "GVEv3", "label": "D", "text": "$\\dfrac{(C_1+C_2)V}{(C_1+C_2+C_3)}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "From the given circuit diagram, capacitors $C_1$ and $C_2$ are connected in parallel.<br><br>Their equivalent capacitance is $C_{12} = C_1 + C_2$.<br><br>This equivalent capacitor $C_{12}$ is connected in series with capacitor $C_3$.<br><br>In a series combination, the charge $Q$ on each capacitor is the same. The total equivalent capacitance of the circuit is:<br><br>$C_{eq} = \\dfrac{C_{12} C_3}{C_{12} + C_3} = \\dfrac{(C_1 + C_2)C_3}{C_1 + C_2 + C_3}$<br><br>The total charge supplied by the voltage source is:<br><br>$Q = C_{eq} V = \\dfrac{(C_1 + C_2)C_3 V}{C_1 + C_2 + C_3}$<br><br>The voltage across $C_3$ is given by:<br><br>$V_3 = \\dfrac{Q}{C_3} = \\dfrac{1}{C_3} \\times \\dfrac{(C_1 + C_2)C_3 V}{C_1 + C_2 + C_3} = \\dfrac{(C_1 + C_2)V}{C_1 + C_2 + C_3}$<br><br>Answer: $\\dfrac{(C_1+C_2)V}{(C_1+C_2+C_3)}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c28c30a4553e1bdc80", "type": "singleCorrect", "question": {"text": "Two capacitors, $C_1$ and $C_2$ have their capacitances in the ratio 1:2. $V_s$ and $V_p$ are the potential differences applied across the series and parallel combination of $C_1$ and $C_2$ respectively, so that the energy stored in the two cases becomes same. The ratio $V_s$ to $V_p$ is", "image": null}, "options": [{"id": "YpMaB", "label": "A", "text": "$\\sqrt{2} : 3$", "isCorrect": false, "image": null}, {"id": "9BhvW", "label": "B", "text": "$3 : \\sqrt{2}$", "isCorrect": true, "image": null}, {"id": "e4S3O", "label": "C", "text": "$2 : \\sqrt{3}$", "isCorrect": false, "image": null}, {"id": "zSy4j", "label": "D", "text": "$\\sqrt{3} : 2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $C_1 = C$ and $C_2 = 2C$.<br><br>Equivalent capacitance in series combination:<br>$C_s = \\dfrac{C_1 C_2}{C_1 + C_2} = \\dfrac{C \\times 2C}{C + 2C} = \\dfrac{2C}{3}$<br><br>Equivalent capacitance in parallel combination:<br>$C_p = C_1 + C_2 = C + 2C = 3C$<br><br>Energy stored in series combination:<br>$U_s = \\dfrac{1}{2} C_s V_s^2 = \\dfrac{1}{2} \\left(\\dfrac{2C}{3}\\right) V_s^2$<br><br>Energy stored in parallel combination:<br>$U_p = \\dfrac{1}{2} C_p V_p^2 = \\dfrac{1}{2} (3C) V_p^2$<br><br>Given that $U_s = U_p$:<br>$\\dfrac{1}{2} \\left(\\dfrac{2C}{3}\\right) V_s^2 = \\dfrac{1}{2} (3C) V_p^2$<br><br>$\\dfrac{2}{3} V_s^2 = 3 V_p^2$<br><br>$\\dfrac{V_s^2}{V_p^2} = \\dfrac{9}{2}$<br><br>$\\dfrac{V_s}{V_p} = \\dfrac{3}{\\sqrt{2}}$<br><br>The ratio $V_s : V_p$ is $3 : \\sqrt{2}$.<br><br>Answer: $3 : \\sqrt{2}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3308c30a4553e1be120", "type": "singleCorrect", "question": {"text": "Two condensers of capacities, '2C' and 'C' are joined in parallel and charged upto potential 'V'. The battery is then disconnected and condenser of capacity 'C' is filled completely with a medium of dielectric constant 'K'. The potential difference across the capacitors in the second case is", "image": null}, "options": [{"id": "JdL8q", "label": "A", "text": "$\\dfrac{3\\text{V}}{(\\text{K}+2)}$", "isCorrect": true, "image": null}, {"id": "jnXqf", "label": "B", "text": "$\\dfrac{\\text{V}}{(\\text{K}+2)}$", "isCorrect": false, "image": null}, {"id": "k3IMW", "label": "C", "text": "$\\dfrac{5\\text{V}}{(\\text{K}+2)}$", "isCorrect": false, "image": null}, {"id": "S6BoT", "label": "D", "text": "$\\dfrac{2\\text{V}}{(\\text{K}+2)}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Initial equivalent capacitance of the parallel combination is $C_{eq} = 2C + C = 3C$.<br><br>Total charge stored in the capacitors when charged to potential $V$ is $Q = C_{eq}V = 3CV$.<br><br>When the battery is disconnected, the total charge $Q$ remains conserved.<br><br>The capacitor of capacity $C$ is filled with a dielectric of constant $K$, so its new capacitance becomes $KC$.<br><br>The new equivalent capacitance of the parallel combination is $C'_{eq} = 2C + KC = C(K + 2)$.<br><br>The new potential difference $V'$ across the capacitors is given by $V' = \\dfrac{Q}{C'_{eq}}$.<br><br>Substituting the values, $V' = \\dfrac{3CV}{C(K + 2)} = \\dfrac{3V}{K + 2}$.<br><br>Answer: $\\dfrac{3\\text{V}}{(\\text{K}+2)}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2de8c30a4553e1bdda8", "type": "singleCorrect", "question": {"text": "Capacitors of capacities $C_1$ and $C_2$ are connected in series. If the combination is connected to a supply of V volt then the potential difference across capacitor $C_2$ is", "image": null}, "options": [{"id": "FA8pV", "label": "A", "text": "$\\dfrac{C_1 + C_2}{C_1 V}$", "isCorrect": false, "image": null}, {"id": "blmrD", "label": "B", "text": "$\\dfrac{C_1 V}{C_1 + C_2}$", "isCorrect": true, "image": null}, {"id": "74xuq", "label": "C", "text": "$\\dfrac{C_1 + C_2}{C_2 V}$", "isCorrect": false, "image": null}, {"id": "21Czc", "label": "D", "text": "$\\dfrac{C_2 V}{C_1 + C_2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In series combination, the equivalent capacitance is $C_{eq} = \\dfrac{C_1 C_2}{C_1 + C_2}$.<br><br>The charge on each capacitor is the same and is given by $Q = C_{eq} V = \\left( \\dfrac{C_1 C_2}{C_1 + C_2} \\right) V$.<br><br>The potential difference across capacitor $C_2$ is $V_2 = \\dfrac{Q}{C_2}$.<br><br>Substituting the value of $Q$, we get $V_2 = \\dfrac{C_1 V}{C_1 + C_2}$.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3168c30a4553e1be00b", "type": "singleCorrect", "question": {"text": "The potential difference that must be applied across the parallel and series combination of three identical capacitors such that the energy stored in them becomes the same. The ratio of potential difference in parallel to series combination is", "image": null}, "options": [{"id": "TKtNC", "label": "A", "text": "$1:3$", "isCorrect": true, "image": null}, {"id": "c1wiL", "label": "B", "text": "$3:1$", "isCorrect": false, "image": null}, {"id": "RniT7", "label": "C", "text": "$9:1$", "isCorrect": false, "image": null}, {"id": "nlyS7", "label": "D", "text": "$1:9$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the capacitance of each identical capacitor be $C$.<br><br>For the parallel combination, the equivalent capacitance is $C_p = 3C$.<br><br>The energy stored in the parallel combination when a potential difference $V_p$ is applied is $U_p = \\dfrac{1}{2}C_p V_p^2 = \\dfrac{1}{2}(3C)V_p^2$.<br><br>For the series combination, the equivalent capacitance is $C_s = \\dfrac{C}{3}$.<br><br>The energy stored in the series combination when a potential difference $V_s$ is applied is $U_s = \\dfrac{1}{2}C_s V_s^2 = \\dfrac{1}{2}\\left(\\dfrac{C}{3}\\right)V_s^2$.<br><br>Given that the energy stored in both combinations is the same, $U_p = U_s$.<br><br>$\\dfrac{1}{2}(3C)V_p^2 = \\dfrac{1}{2}\\left(\\dfrac{C}{3}\\right)V_s^2$<br><br>$3V_p^2 = \\dfrac{V_s^2}{3}$<br><br>$\\dfrac{V_p^2}{V_s^2} = \\dfrac{1}{9}$<br><br>$\\dfrac{V_p}{V_s} = \\dfrac{1}{3}$<br><br>The ratio of potential difference in parallel to series combination is $1:3$.<br><br>Answer: $1:3$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3158c30a4553e1be000", "type": "singleCorrect", "question": {"text": "Four capacitors are connected to a battery as shown in figure. The ratio of charges on capacitors $C_2$ and $C_4$ is<br><img style=\"width: 320px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/14_april_shift_1__q28_d1.png\" />", "image": null}, "options": [{"id": "Vq0Pp", "label": "A", "text": "$\\dfrac{1}{14}$", "isCorrect": false, "image": null}, {"id": "emFWm", "label": "B", "text": "$\\dfrac{3}{22}$", "isCorrect": true, "image": null}, {"id": "882zc", "label": "C", "text": "$\\dfrac{2}{9}$", "isCorrect": false, "image": null}, {"id": "iS63x", "label": "D", "text": "$\\dfrac{4}{13}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "From the given circuit diagram, capacitors $C_1$, $C_2$, and $C_3$ are connected in series. This series combination is connected in parallel with capacitor $C_4$ across the battery of voltage $V$.<br><br>The equivalent capacitance $C_s$ of the series branch containing $C_1$, $C_2$, and $C_3$ is given by:<br><br>$\\dfrac{1}{C_s} = \\dfrac{1}{C_1} + \\dfrac{1}{C_2} + \\dfrac{1}{C_3}$<br><br>Substituting the given values:<br><br>$\\dfrac{1}{C_s} = \\dfrac{1}{1C} + \\dfrac{1}{2C} + \\dfrac{1}{3C} = \\dfrac{6 + 3 + 2}{6C} = \\dfrac{11}{6C}$<br><br>$C_s = \\dfrac{6C}{11}$<br><br>Since $C_1$, $C_2$, and $C_3$ are in series, the charge on each of them is the same and is equal to the total charge on this series branch. The voltage across this branch is $V$.<br><br>Charge on $C_2$, $Q_2 = C_s \\times V = \\dfrac{6CV}{11}$<br><br>Capacitor $C_4$ is connected directly across the battery, so the voltage across it is also $V$.<br><br>Charge on $C_4$, $Q_4 = C_4 \\times V = 4CV$<br><br>The ratio of charges on $C_2$ and $C_4$ is:<br><br>$\\dfrac{Q_2}{Q_4} = \\dfrac{\\dfrac{6CV}{11}}{4CV} = \\dfrac{6}{11 \\times 4} = \\dfrac{6}{44} = \\dfrac{3}{22}$<br><br>Answer: $\\dfrac{3}{22}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36a8c30a4553e1be37e", "type": "singleCorrect", "question": {"text": "Two identical parallel plate air capacitors are connected in series to a battery of e.m.f. 'V'. If one of the capacitor is inserted in liquid of dielectric constant 'K' then potential difference of the other capacitor will become", "image": null}, "options": [{"id": "8aGAt", "label": "A", "text": "$\\dfrac{KV}{K+1}$", "isCorrect": true, "image": null}, {"id": "Rap1X", "label": "B", "text": "$\\dfrac{KV}{K-1}$", "isCorrect": false, "image": null}, {"id": "gSRcv", "label": "C", "text": "$\\dfrac{K+1}{KV}$", "isCorrect": false, "image": null}, {"id": "bAFlN", "label": "D", "text": "$\\dfrac{K-1}{KV}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the capacitance of each identical parallel plate air capacitor be $C$.<br><br>When one capacitor is inserted in a liquid of dielectric constant $K$, its capacitance becomes $C_1 = KC$. The capacitance of the other capacitor remains $C_2 = C$.<br><br>Since the two capacitors are connected in series across the battery of e.m.f. $V$, the equivalent capacitance of the circuit is $C_{eq} = \\dfrac{C_1 C_2}{C_1 + C_2} = \\dfrac{KC \\cdot C}{KC + C} = \\dfrac{KC}{K+1}$.<br><br>The total charge supplied by the battery is $Q = C_{eq}V = \\dfrac{KCV}{K+1}$.<br><br>In a series combination, the charge on each capacitor is the same. The potential difference across the other capacitor (which remains in air) is $V' = \\dfrac{Q}{C_2}$.<br><br>Substituting the value of $Q$, we get $V' = \\dfrac{\\dfrac{KCV}{K+1}}{C} = \\dfrac{KV}{K+1}$.<br><br>Answer: $\\dfrac{KV}{K+1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3688c30a4553e1be36f", "type": "singleCorrect", "question": {"text": "A condenser of capacity $C_1$ is charged to potential $V_1$ and then disconnected. Uncharged capacitor of capacity $C_2$ is connected in parallel with $C_1$. The resultant potential $V_2$ is", "image": null}, "options": [{"id": "rVUXF", "label": "A", "text": "$\\dfrac{C_1 V_1}{C_2}$", "isCorrect": false, "image": null}, {"id": "zjztI", "label": "B", "text": "$\\dfrac{C_1 V_1}{C_1 + C_2}$", "isCorrect": true, "image": null}, {"id": "Ys0gT", "label": "C", "text": "$\\dfrac{C_2 V_1}{C_1}$", "isCorrect": false, "image": null}, {"id": "FAh6P", "label": "D", "text": "$\\dfrac{C_2 V_1}{C_1 + C_2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Initial charge on the first capacitor is $Q = C_1 V_1$<br><br>Initial charge on the second capacitor is zero.<br><br>When connected in parallel, the total charge remains conserved and the equivalent capacitance is $C_{eq} = C_1 + C_2$<br><br>The resultant potential $V_2$ is given by $V_2 = \\dfrac{\\text{Total Charge}}{\\text{Total Capacitance}}$<br><br>$V_2 = \\dfrac{C_1 V_1}{C_1 + C_2}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d35c8c30a4553e1be2ee", "type": "singleCorrect", "question": {"text": "Initially, 'n' identical capacitors are joined in parallel, are charged to potential 'V'. Now they are separated and joined in series. Then", "image": null}, "options": [{"id": "tCeL3", "label": "A", "text": "potential difference and total energy of the combination remain the same", "isCorrect": false, "image": null}, {"id": "OLMQn", "label": "B", "text": "potential difference remains the same and energy increases 'n' times", "isCorrect": false, "image": null}, {"id": "QgQJJ", "label": "C", "text": "potential difference becomes 'nv' and energy remains the same", "isCorrect": true, "image": null}, {"id": "XzbjL", "label": "D", "text": "potential difference is 'nv' and energy increases 'n' times.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Initial capacitance of each capacitor is $C$.<br><br>In parallel combination, the potential difference across each capacitor is $V$.<br><br>Charge on each capacitor, $q = CV$.<br><br>Total initial energy, $U_i = n \\times \\dfrac{1}{2}CV^2$.<br><br>When the capacitors are separated and connected in series, the charge on each capacitor remains $q = CV$.<br><br>The potential difference across the series combination is the sum of individual potential differences.<br><br>$V_f = V + V + \\dots \\text{n times} = nV$.<br><br>Equivalent capacitance in series, $C_s = \\dfrac{C}{n}$.<br><br>Total final energy, $U_f = \\dfrac{1}{2}C_s V_f^2 = \\dfrac{1}{2} \\left(\\dfrac{C}{n}\\right) (nV)^2 = n \\times \\dfrac{1}{2}CV^2$.<br><br>Thus, $U_f = U_i$.<br><br>The potential difference becomes $nV$ and the total energy remains the same.<br><br>Answer: potential difference becomes 'nv' and energy remains the same", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf8bf9280d7f9932e19", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The potential difference across the $4 \\mu \\mathrm{~F}$ capacitor connected in series with the battery in the following circuit is\n\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/eWOHU2K1hH6tqjPptE1S6mFRuR1kgf3Mh1D405366AE.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "XNDEG", "text": "3.4 V", "image": null, "isCorrect": false}, {"id": "ECcoP", "text": "4.6 V", "image": null, "isCorrect": false}, {"id": "OQEtG", "text": "5.4 V", "image": null, "isCorrect": true}, {"id": "Sqzhg", "text": "6.2 V", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The equivalent capacitance of the parallel combination of $2 \\mu\\text{F}$ and $4 \\mu\\text{F}$ capacitors is:<br><br>$C_p = 2 \\mu\\text{F} + 4 \\mu\\text{F} = 6 \\mu\\text{F}$<br><br>This equivalent capacitor $C_p$ is in series with the $4 \\mu\\text{F}$ capacitor (let's call it $C_1$).<br><br>In a series combination, the potential difference across a capacitor is inversely proportional to its capacitance. The potential difference $V_1$ across $C_1$ is given by the voltage divider rule:<br><br>$V_1 = V \\left( \\dfrac{C_p}{C_1 + C_p} \\right)$<br><br>Substituting the given values:<br><br>$V_1 = 9 \\times \\left( \\dfrac{6}{4 + 6} \\right)$<br><br>$V_1 = 9 \\times \\dfrac{6}{10}$<br><br>$V_1 = 5.4 \\text{ V}$<br><br>Answer: 5.4 V", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bd7bf9280d7f9932ce9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Five capacitors, each of capacitance 'C' are connected as shown in the figure. The ratio of equivalent capacitance between $P$ and $R$ and the equivalent capacitance between $P$ and $Q$ is\n\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/9d9ca3a2-af23-4f98-a588-730537af4e03.png\"><br>", "image": null}, "options": [{"id": "jZx4Q", "text": "1:4", "image": null, "isCorrect": false}, {"id": "XFX5f", "text": "2:3", "image": null, "isCorrect": true}, {"id": "Nz829", "text": "3:1", "image": null, "isCorrect": false}, {"id": "O7hZr", "text": "5:2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given circuit is a closed loop of five identical capacitors, each of capacitance $C$, forming a pentagon.<br><br>To find the equivalent capacitance between points $P$ and $R$ ($C_{PR}$):<br>The circuit consists of two parallel branches between $P$ and $R$.<br>Branch 1 (path $P \\rightarrow Q \\rightarrow R$) has two capacitors in series. Its equivalent capacitance is $C_1 = \\dfrac{C}{2}$.<br>Branch 2 (path $P \\rightarrow T \\rightarrow S \\rightarrow R$) has three capacitors in series. Its equivalent capacitance is $C_2 = \\dfrac{C}{3}$.<br>Therefore, $C_{PR} = C_1 + C_2 = \\dfrac{C}{2} + \\dfrac{C}{3} = \\dfrac{5C}{6}$.<br><br>To find the equivalent capacitance between points $P$ and $Q$ ($C_{PQ}$):<br>The circuit consists of two parallel branches between $P$ and $Q$.<br>Branch 1 (direct path $P \\rightarrow Q$) has one capacitor. Its capacitance is $C_3 = C$.<br>Branch 2 (path $P \\rightarrow T \\rightarrow S \\rightarrow R \\rightarrow Q$) has four capacitors in series. Its equivalent capacitance is $C_4 = \\dfrac{C}{4}$.<br>Therefore, $C_{PQ} = C_3 + C_4 = C + \\dfrac{C}{4} = \\dfrac{5C}{4}$.<br><br>The ratio of $C_{PR}$ to $C_{PQ}$ is:<br>$\\dfrac{C_{PR}}{C_{PQ}} = \\dfrac{\\dfrac{5C}{6}}{\\dfrac{5C}{4}} = \\dfrac{5}{6} \\times \\dfrac{4}{5} = \\dfrac{4}{6} = \\dfrac{2}{3}$.<br><br>Answer: 2:3", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bb4bf9280d7f9932bb8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Seven capacitors each of capacitance $2 \\mu \\mathrm{~F}$ are to be connected in a configuration to obtain an effective capacitance $\\left(\\frac{10}{11}\\right) \\mu \\mathrm{F}$. The combination is", "image": null}, "options": [{"id": "hqNEh", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/BYXRYOoR9pwC_CrG5T_HUDujwCky4pFvor6eyWgs498.original.fullsize.png\"><br>", "image": null, "isCorrect": true}, {"id": "ZVVzd", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/z1IbtuTx0Bf5iGT_pCp3HhrlPONJ5o5byuVUsQsE2PY.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "E8RnS", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/cmdrGX89tS2Bjd3YJdjfh-FTZwobLOindjBVmfzMcoo.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "Cwb3m", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/u347uOprliWpXTATj3Df3PwW7rP23LwDYDVbBBJz2xM.original.fullsize.png\"><br>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $n$ capacitors be connected in parallel and the remaining $m$ capacitors be connected in series with this parallel combination.<br><br>The total number of capacitors is given by:<br>$n + m = 7$<br><br>The equivalent capacitance of $n$ capacitors in parallel is:<br>$C_p = nC$<br><br>The equivalent capacitance $C_{eq}$ of the entire circuit (the parallel group in series with $m$ individual capacitors) is given by:<br>$\\dfrac{1}{C_{eq}} = \\dfrac{1}{C_p} + \\dfrac{m}{C} = \\dfrac{1}{nC} + \\dfrac{m}{C}$<br><br>Given $C = 2 \\mu\\text{F}$ and $C_{eq} = \\dfrac{10}{11} \\mu\\text{F}$, substituting these values we get:<br>$\\dfrac{11}{10} = \\dfrac{1}{2n} + \\dfrac{m}{2}$<br><br>$\\dfrac{11}{10} = \\dfrac{1 + mn}{2n}$<br><br>$22n = 10(1 + mn)$<br><br>$11n = 5(1 + mn)$<br><br>Substituting $m = 7 - n$ into the equation:<br>$11n = 5(1 + n(7 - n))$<br><br>$11n = 5 + 35n - 5n^2$<br><br>$5n^2 - 24n - 5 = 0$<br><br>Factorizing the quadratic equation:<br>$5n^2 - 25n + n - 5 = 0$<br><br>$5n(n - 5) + 1(n - 5) = 0$<br><br>$(5n + 1)(n - 5) = 0$<br><br>Since the number of capacitors $n$ must be a positive integer, we have $n = 5$.<br><br>Therefore, $m = 7 - 5 = 2$.<br><br>The required configuration consists of 5 capacitors in parallel and 2 capacitors in series with them. This corresponds to the first circuit diagram.<br><br>Answer: <img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/BYXRYOoR9pwC_CrG5T_HUDujwCky4pFvor6eyWgs498.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba4bf9280d7f9932b2b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Five capacitors, each of capacity 'C' are connected as shown in the figure. The resultant capacity between A & B is $14 \\mu \\mathrm{~F}$. The capacity of each capacitor is\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/tODP7UTIU4ExKwq7pqAteGIWhKNxw7Pny7Eu29eLi8g.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "xvIgq", "text": "$2 \\mu F$", "image": null, "isCorrect": false}, {"id": "INGhS", "text": "$3.5 \\mu \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "QoBkQ", "text": "$4 \\mu F$", "image": null, "isCorrect": true}, {"id": "XFz3h", "text": "$2.8 \\mu \\mathrm{~F}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From the given circuit diagram, the capacitors are arranged in two parallel branches between points A and B.<br><br>In the upper branch, three capacitors, each of capacitance $C$, are connected in parallel.<br>Equivalent capacitance of the upper branch, $C_1 = C + C + C = 3C$.<br><br>In the lower branch, two capacitors, each of capacitance $C$, are connected in series.<br>Equivalent capacitance of the lower branch, $C_2 = \\dfrac{C \\times C}{C + C} = \\dfrac{C}{2} = 0.5C$.<br><br>Since the upper and lower branches are connected in parallel, the total equivalent capacitance between A and B is:<br>$C_{AB} = C_1 + C_2 = 3C + 0.5C = 3.5C$<br><br>Given that the resultant capacity $C_{AB} = 14 \\mu\\text{F}$:<br>$3.5C = 14$<br>$C = \\dfrac{14}{3.5} = 4 \\mu\\text{F}$<br><br>Answer: $4 \\mu F$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b94bf9280d7f9932a90", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Two capacitors of $100 \\mu \\mathrm{~F}$ and $50 \\mu \\mathrm{~F}$ are connected in parallel. If the potential difference across $100 \\mu \\mathrm{~F}$ is 20 V and across $50 \\mu \\mathrm{~F}$ is 40 V , then the common potential of the parallel combination will be (same polarities of the capacitor connected together)", "image": null}, "options": [{"id": "IBA1V", "text": "20 V", "image": null, "isCorrect": false}, {"id": "F98od", "text": "60 V", "image": null, "isCorrect": false}, {"id": "0x7BP", "text": "$\\frac{3}{80} \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "kfoHB", "text": "$\\frac{80}{3} \\mathrm{~V}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "When two capacitors are connected in parallel with the same polarities connected together, the common potential $V$ is given by the ratio of total charge to total capacitance.<br><br>$V = \\dfrac{C_1 V_1 + C_2 V_2}{C_1 + C_2}$<br><br>Given:<br>$C_1 = 100 \\mu\\text{F}$, $V_1 = 20 \\text{ V}$<br>$C_2 = 50 \\mu\\text{F}$, $V_2 = 40 \\text{ V}$<br><br>Substituting the values into the formula:<br><br>$V = \\dfrac{100 \\times 20 + 50 \\times 40}{100 + 50}$<br><br>$V = \\dfrac{2000 + 2000}{150}$<br><br>$V = \\dfrac{4000}{150}$<br><br>$V = \\dfrac{80}{3} \\text{ V}$<br><br>Answer: $\\frac{80}{3} \\mathrm{~V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b74bf9280d7f9932964", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Initially n identical capacitors are joined in parallel and are charged to potential V. Now they are separated and joined in series. Then", "image": null}, "options": [{"id": "eNxli", "text": "potential difference and total energy of the combination remain the same.", "image": null, "isCorrect": false}, {"id": "xBfQT", "text": "potential difference remains the same and energy increases $n$ times.", "image": null, "isCorrect": false}, {"id": "xFV6t", "text": "potential difference becomes nV and energy remains the same.", "image": null, "isCorrect": true}, {"id": "nb2mk", "text": "potential difference is nV and energy increases n times.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the capacitance of each capacitor be $C$.<br><br>When $n$ identical capacitors are connected in parallel and charged to a potential $V$, the charge on each capacitor is $q = CV$.<br><br>The total initial energy of the combination is the sum of the energies of individual capacitors:<br>$U_i = n \\times \\dfrac{1}{2}CV^2$<br><br>When the capacitors are separated, the charge $q$ on each capacitor remains conserved. When they are connected in series, the total potential difference across the combination is the sum of the potential differences across each capacitor:<br>$V_f = V + V + \\dots + V = nV$<br><br>The equivalent capacitance of the series combination is $C_{eq} = \\dfrac{C}{n}$.<br><br>The total final energy of the combination is:<br>$U_f = \\dfrac{1}{2}C_{eq}V_f^2 = \\dfrac{1}{2}\\left(\\dfrac{C}{n}\\right)(nV)^2 = \\dfrac{1}{2}nCV^2$<br><br>Thus, $U_f = U_i$. The potential difference becomes $nV$ and the total energy remains the same.<br><br>Answer: potential difference becomes nV and energy remains the same.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b67bf9280d7f99328e0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Three capacitors each of capacitance 'C' and breakdown voltage 'V' are connected in series. The capacitance and breakdown voltage of the series combination will be respectively", "image": null}, "options": [{"id": "0SFvF", "text": "$3 \\mathrm{C}, 3 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "BkiZ4", "text": "$\\frac{c}{3}, \\frac{v}{3}$", "image": null, "isCorrect": false}, {"id": "HPrFx", "text": "$3 \\mathrm{C}, \\frac{\\mathrm{V}}{3}$", "image": null, "isCorrect": false}, {"id": "CanPk", "text": "$\\frac{\\mathrm{c}}{3}, 3 \\mathrm{~V}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For three capacitors connected in series, the equivalent capacitance $C_{eq}$ is given by:<br><br>$\\dfrac{1}{C_{eq}} = \\dfrac{1}{C} + \\dfrac{1}{C} + \\dfrac{1}{C} = \\dfrac{3}{C}$<br><br>$C_{eq} = \\dfrac{C}{3}$<br><br>In a series combination of identical capacitors, the total voltage is divided equally among all the capacitors. Thus, the maximum voltage the combination can withstand before any capacitor breaks down is the sum of their individual breakdown voltages.<br><br>$V_{eq} = V + V + V = 3V$<br><br>The capacitance and breakdown voltage of the series combination are $\\dfrac{C}{3}$ and $3V$ respectively.<br><br>Answer: $\\frac{\\mathrm{c}}{3}, 3 \\mathrm{~V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b44bf9280d7f99327ae", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The equivalent capacitance between plates 'A' and 'B' (A-area of each plate, d-separation between plates) ( $\\epsilon_0$ - permittivity of free space) is\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/1jIX3T3PxY6zxSdOooLRd1jXra8oyTT0mX-BUdJbuuE.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "gsp1Z", "text": "$\\frac{A \\in_0}{d}$", "image": null, "isCorrect": false}, {"id": "ELaAM", "text": "$\\frac{2 \\mathrm{~A} \\epsilon_0}{\\mathrm{~d}}$", "image": null, "isCorrect": false}, {"id": "7aq5f", "text": "$\\frac{4 \\mathrm{~A} \\in_0}{\\mathrm{~d}}$", "image": null, "isCorrect": true}, {"id": "M6TU2", "text": "$\\frac{8 \\mathrm{~A} \\in_0}{\\mathrm{~d}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given capacitor can be considered as two parts connected in parallel: the left half and the right half.<br><br>For the left half, the capacitor $C_1$ has a plate area of $A/2$, a separation distance of $d$, and is filled with a dielectric of constant $K_1 = 4$.<br>Its capacitance is given by:<br>$C_1 = \\dfrac{K_1 \\epsilon_0 (A/2)}{d} = \\dfrac{4 \\epsilon_0 A}{2d} = \\dfrac{2 \\epsilon_0 A}{d}$<br><br>The right half consists of two capacitors, $C_2$ and $C_3$, connected in series.<br>Capacitor $C_2$ has an area of $A/2$, a separation of $d/2$, and a dielectric constant $K_2 = 3$.<br>$C_2 = \\dfrac{K_2 \\epsilon_0 (A/2)}{d/2} = \\dfrac{3 \\epsilon_0 A}{d}$<br><br>Capacitor $C_3$ has an area of $A/2$, a separation of $d/2$, and a dielectric constant $K_3 = 6$.<br>$C_3 = \\dfrac{K_3 \\epsilon_0 (A/2)}{d/2} = \\dfrac{6 \\epsilon_0 A}{d}$<br><br>The equivalent capacitance of the right half ($C_{right}$) is the series combination of $C_2$ and $C_3$:<br>$C_{right} = \\dfrac{C_2 C_3}{C_2 + C_3} = \\dfrac{\\left(\\dfrac{3 \\epsilon_0 A}{d}\\right) \\left(\\dfrac{6 \\epsilon_0 A}{d}\\right)}{\\dfrac{3 \\epsilon_0 A}{d} + \\dfrac{6 \\epsilon_0 A}{d}} = \\dfrac{18}{9} \\dfrac{\\epsilon_0 A}{d} = \\dfrac{2 \\epsilon_0 A}{d}$<br><br>The total equivalent capacitance $C_{eq}$ between plates A and B is the parallel combination of the left and right halves:<br>$C_{eq} = C_1 + C_{right} = \\dfrac{2 \\epsilon_0 A}{d} + \\dfrac{2 \\epsilon_0 A}{d} = \\dfrac{4 \\epsilon_0 A}{d}$<br><br>Answer: $\\frac{4 \\mathrm{~A} \\in_0}{\\mathrm{~d}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214190aee93fa0796ddf9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "In the circuit shown in the following figure, the potential difference cross $3 \\mu \\mathrm{~F}$ capacitor is\r\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/UB0LPRbC3iLVbGSUKR2Z4jhbj4Q_Dvq3U8toSFGJDzY.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "yzvdb", "text": "4 V", "image": null, "isCorrect": false}, {"id": "SXRxW", "text": "6 V", "image": null, "isCorrect": false}, {"id": "3ZKPz", "text": "10 V", "image": null, "isCorrect": true}, {"id": "9DRTQ", "text": "16 V", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given circuit consists of a single loop with two batteries and two capacitors connected in series.<br><br>From the circuit diagram, the batteries are connected with opposing polarities. The net voltage in the circuit is:<br><br>$V_{\\text{net}} = 20 - 4 = 16 \\text{ V}$<br><br>For capacitors in series, the potential difference across a capacitor is inversely proportional to its capacitance. The potential difference $V_1$ across the $C_1 = 3 \\mu\\text{F}$ capacitor is:<br><br>$V_1 = V_{\\text{net}} \\times \\dfrac{C_2}{C_1 + C_2}$<br><br>Substituting the given values, $C_1 = 3 \\mu\\text{F}$ and $C_2 = 5 \\mu\\text{F}$:<br><br>$V_1 = 16 \\times \\dfrac{5}{3 + 5}$<br><br>$V_1 = 16 \\times \\dfrac{5}{8} = 10 \\text{ V}$<br><br>Answer: 10 V", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e10aee93fa0796dc43", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "When three capacitors of equal capacities are connected in parallel and one of the same capacity, capacitor is connected in series with the combination. The resultant capacity is $4.5 \\mu \\mathrm{~F}$. The capacity of each capacitor is", "image": null}, "options": [{"id": "weM23", "text": "$\\quad 5 \\cdot \\mu \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "u89Yy", "text": "$6 \\mu \\mathrm{~F}$", "image": null, "isCorrect": true}, {"id": "7vbDR", "text": "$7 \\mu \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "b2lSQ", "text": "$8 \\mu \\mathrm{~F}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the capacity of each capacitor be $C$.<br><br>When three capacitors are connected in parallel, their equivalent capacity is $C_p = C + C + C = 3C$.<br><br>When a fourth capacitor of capacity $C$ is connected in series with this combination, the resultant capacity $C_{eq}$ is given by:<br><br>$\\dfrac{1}{C_{eq}} = \\dfrac{1}{C_p} + \\dfrac{1}{C}$<br><br>$\\dfrac{1}{C_{eq}} = \\dfrac{1}{3C} + \\dfrac{1}{C} = \\dfrac{4}{3C}$<br><br>$C_{eq} = \\dfrac{3C}{4}$<br><br>Given that $C_{eq} = 4.5 \\mu \\mathrm{F}$, we have:<br><br>$\\dfrac{3C}{4} = 4.5$<br><br>$3C = 18$<br><br>$C = 6 \\mu \\mathrm{F}$<br><br>Answer: $6 \\mu \\mathrm{~F}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213b90aee93fa0796db06", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "Seven capacitors each of capacitance $2 \\mu \\mathrm{~F}$ are connected in a configuration to obtain an effective capacitance $\\dfrac{6}{13} \\mu \\mathrm{~F}$. The combination which will achieve this will have", "image": null}, "options": [{"id": "xiunn", "text": "5 capacitors in parallel and then 2 capacitors series.", "image": null, "isCorrect": false}, {"id": "KuGXJ", "text": "4 capacitors in parallel and then 3 capacitors series.", "image": null, "isCorrect": false}, {"id": "OeIJc", "text": "3 capacitors in parallel and then 4 capacitors in series.", "image": null, "isCorrect": true}, {"id": "LUEAj", "text": "2 capacitors in parallel and then 5 capacitors in series.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $n$ capacitors be connected in parallel and the remaining $7-n$ capacitors be connected in series with this parallel combination.<br><br>The equivalent capacitance of the $n$ capacitors in parallel is:<br>$C_p = nC$<br><br>The equivalent capacitance $C_{eq}$ of the entire circuit is given by:<br>$\\dfrac{1}{C_{eq}} = \\dfrac{1}{C_p} + \\dfrac{7-n}{C}$<br><br>$\\dfrac{1}{C_{eq}} = \\dfrac{1}{nC} + \\dfrac{7-n}{C} = \\dfrac{1 + 7n - n^2}{nC}$<br><br>Given $C_{eq} = \\dfrac{6}{13} \\mu\\mathrm{F}$ and $C = 2 \\mu\\mathrm{F}$, we substitute these values:<br>$\\dfrac{13}{6} = \\dfrac{1 + 7n - n^2}{2n}$<br><br>Cross-multiplying yields:<br>$26n = 6(1 + 7n - n^2)$<br><br>$26n = 6 + 42n - 6n^2$<br><br>$6n^2 - 16n - 6 = 0$<br><br>Dividing by 2:<br>$3n^2 - 8n - 3 = 0$<br><br>Factoring the quadratic equation:<br>$3n^2 - 9n + n - 3 = 0$<br><br>$3n(n - 3) + 1(n - 3) = 0$<br><br>$(3n + 1)(n - 3) = 0$<br><br>Since $n$ must be a positive integer, $n = 3$.<br><br>Therefore, 3 capacitors are in parallel and the remaining 4 capacitors are in series with this combination.<br><br>Answer: 3 capacitors in parallel and then 4 capacitors in series.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262780279619d9d8a34cc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "Two condensers one of capacity $\\frac{C}{2}$ and other capacity $\\mathrm{C}$ are connected to a battery of voltage $\\mathrm{V}$ as shown. The work done in charging fully both the condensers is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/Cak4c9tdK-OtvNivtBpSoqjEOOU_wfjsdQje2Dp8c4s.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "9T2zT", "text": "$\\frac{1}{2} \\mathrm{CV}^2$", "image": null, "isCorrect": false}, {"id": "Y2CYc", "text": "$\\frac{3}{4} \\mathrm{CV}^2$", "image": null, "isCorrect": true}, {"id": "olUi3", "text": "$\\frac{3}{2} \\mathrm{CV}^2$", "image": null, "isCorrect": false}, {"id": "vLIrr", "text": "$2 \\mathrm{CV}^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The two condensers are in parallel. Their equivalent capacitance is $\\mathrm{C}_{\\mathrm{e}}=\\mathrm{C}+\\frac{\\mathrm{C}}{2}=\\frac{3 \\mathrm{C}}{2}$\nThe formula for work done is\n$\\begin{aligned}\n& \\mathrm{W}=\\frac{1}{2} \\mathrm{C}_{\\mathrm{e}} \\mathrm{V}^2 \\\\\n& \\mathrm{~W}=\\frac{1}{2}\\left(\\frac{3 \\mathrm{C}}{2}\\right) \\mathrm{V}^2 \\\\\n& \\mathrm{~W}=\\frac{3}{4} \\mathrm{CV}^2\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262660279619d9d8a3435", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "Which of the following combination of 7 identical capacitors each of $2 \\mu \\mathrm{F}$ gives a capacitance of $\\frac{10}{11} \\mu \\mathrm{F}$ ?", "image": null}, "options": [{"id": "tsybG", "text": "5 in parallel and 2 in series", "image": null, "isCorrect": true}, {"id": "9ke6e", "text": "4 in parallel and 3 in series", "image": null, "isCorrect": false}, {"id": "5mOu0", "text": "3 in parallel and 4 in series", "image": null, "isCorrect": false}, {"id": "UFpoq", "text": "2 in parallel and 5 in series", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For $\\mathrm{n}$ identical capacitors connected in series, the equivalent capacitance is, $\\mathrm{C}_{\\mathrm{s}}=\\frac{\\mathrm{C}}{\\mathrm{n}}$\n\nSimilarly, for $\\mathrm{m}$ identical capacitors connected parallel to each other, the equivalent capacitance is, $\\mathrm{C}_{\\mathrm{p}}=\\mathrm{mC}$\n\nAssuming the two combinations are connected in series, the net capacitance,\n$\\begin{aligned} \\frac{1}{\\mathrm{C}_{\\text {net }}} & =\\frac{1}{\\mathrm{mC}}+\\frac{\\mathrm{n}}{\\mathrm{C}}=\\frac{11}{10} \\mu \\mathrm{F} \\quad \\ldots\\left(\\because \\mathrm{C}_{\\text {net }}=\\frac{10}{11} \\mu \\mathrm{F}\\right) \\\\ \\therefore \\quad \\text { for } \\mathrm{C} & =2 \\mu \\mathrm{F}, \\\\ \\frac{11 \\times 2}{10} & =\\frac{1}{\\mathrm{~m}}+\\mathrm{n}\\end{aligned}$\n$\\therefore \\quad \\frac{1}{\\mathrm{~m}}+\\mathrm{n}=\\frac{11}{5}...(i)$\n\nSubstituting the values for $\\mathrm{m}$ and $\\mathrm{n}$ in equation (i) from each option, the correct answer can be found to be (A).", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262560279619d9d8a33b8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "In the given figure, the equivalent capacitance between points $A$ and $B$ is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/cf6DJsUYTRlkU145bBwzm2F5gZy3nEGMTRdwhc_cvqo.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "UGU9Q", "text": "$1.5 \\mathrm{C}$", "image": null, "isCorrect": true}, {"id": "VaCem", "text": "$2 \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "IOqWa", "text": "$3 \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "f1I0v", "text": "$6 \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Both parts have capacitors in parallel. The equivalent capacitor for each part is $\\mathrm{C}_{\\mathrm{eq}}=\\mathrm{C}+\\mathrm{C}+\\mathrm{C}=3 \\mathrm{C}$\nThere are two $3 \\mathrm{C}$ capacitances in series\n$\\therefore \\quad \\frac{1}{\\mathrm{C}_{\\mathrm{AB}}}=\\frac{1}{3 \\mathrm{C}}+\\frac{1}{3 \\mathrm{C}}$\n$\\frac{1}{C_{A B}}=\\frac{2}{3 C}$\n$\\therefore \\quad \\mathrm{C}_{\\mathrm{AB}}=1.5 \\mathrm{C}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2621a0279619d9d8a31d3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "In the given capacitive network the resultant capacitance between point \n$\\mathrm{A}$ and $\\mathrm{B}$ is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/Jn4S5aTl7HSA_UTUjquBw8rmjlOMXnnW_uMT5q14TK4.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "f8dHY", "text": "$8 \\mu \\mathrm{F}$", "image": null, "isCorrect": false}, {"id": "vmXaQ", "text": "$4 \\mu \\mathrm{F}$", "image": null, "isCorrect": true}, {"id": "zjn0u", "text": "$2 \\mu \\mathrm{F}$", "image": null, "isCorrect": false}, {"id": "ndMr6", "text": "$16 \\mu \\mathrm{F}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In the given circuit, $\\mathrm{C}_3$ and $\\mathrm{C}_4$ are in series and\n$$\n\\begin{aligned}\n\\mathrm{C}_3 & =\\mathrm{C}_4=8 \\mu \\mathrm{F} \\\\\n\\therefore \\quad \\frac{1}{\\mathrm{C}_5} & =\\frac{1}{\\mathrm{C}_3}+\\frac{1}{\\mathrm{C}_4}\n\\end{aligned}\n$$\n$$\n\\begin{aligned}\n\\therefore \\quad \\mathrm{C}_{\\mathrm{s}} & =\\frac{\\mathrm{C}_3^2}{2 \\mathrm{C}_3} \\\\\n\\mathrm{C}_{\\mathrm{s}} & =\\frac{\\mathrm{C}_3}{2} \\\\\n\\therefore \\quad \\mathrm{C}_{\\mathrm{S}} & =4 \\mu \\mathrm{F}\n\\end{aligned}\n$$\n$\\mathrm{C}_5$ and $\\mathrm{C}_6$ are in parallel and $\\mathrm{C}_5=\\mathrm{C}_6=4 \\mu \\mathrm{F}$\n$$\n\\begin{aligned}\n\\mathrm{C}_P & =\\mathrm{C}_5+\\mathrm{C}_6 \\\\\n\\therefore \\quad \\mathrm{C}_{\\mathrm{P}} & =8 \\mu \\mathrm{F}\n\\end{aligned}\n$$\n$\\therefore \\quad$ Equivalent circuit is as shown in figure.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/gRRU4oXSKBwQcWHxvDUSFUKZOlnMgctA5RAcIMrvaNU.original.fullsize.png\"><br>\n\nNow, $C_2$ and $C_P$ are in series and their combination in parallel with $\\mathrm{C}_5$\n$$\n\\begin{aligned}\n\\therefore \\quad C_E & =\\frac{C_2 C_P}{C_2 C_P}+C_5 \\\\\n& C_E=\\frac{(8)(8)}{16}+4 \\\\\n\\therefore \\quad C_E & =8 \\mu \\mathrm{F}\n\\end{aligned}\n$$\nNow, $C_1$ and $C_E$ are in series,\n$$\n\\begin{aligned}\n& \\therefore \\quad \\mathrm{C}=\\frac{\\mathrm{C}_1 \\mathrm{C}_{\\mathrm{E}}}{\\mathrm{C}_1+\\mathrm{C}_{\\mathrm{E}}} \\\\\n& \\therefore \\quad \\mathrm{C}=\\frac{(8)(8)}{16} \\\\\n& \\therefore \\quad \\mathrm{C}=4 \\mu \\mathrm{F}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2620b0279619d9d8a3157", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "Three identical capacitors of capacitance ' $\\mathrm{C}$ ' each are connected in series and this connection is connected in parallel with one more such identical capacitor. Then the capacitance of whole combination is", "image": null}, "options": [{"id": "HWaeH", "text": "$3 \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "LYvkr", "text": "$2 \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "A5MkR", "text": "$\\frac{4}{3} \\mathrm{C}$", "image": null, "isCorrect": true}, {"id": "kCmJx", "text": "$\\frac{3}{4} C$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The equivalent capacitance of three capacitances connected in series is\n$\\begin{aligned}\n& \\frac{1}{\\mathrm{C}_{\\text {eq }}}=\\frac{1}{\\mathrm{C}}+\\frac{1}{\\mathrm{C}}+\\frac{1}{\\mathrm{C}} \\\\\n& \\frac{1}{\\mathrm{C}_{\\text {eq }}}=\\frac{3}{\\mathrm{C}} \\\\\n& \\mathrm{C}_{\\text {eq }}=\\frac{\\mathrm{C}}{3}\n\\end{aligned}$\nThis capacitance is connected in parallel with another capacitance.\n$\\begin{aligned}\n& \\Rightarrow C_{\\text {tatal }}=\\frac{C}{3}+C \\\\\n& C_{\\text {teal }}=\\frac{4 C}{3}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261fa0279619d9d8a30d1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "Two identical capacitors have the same capacitance ' $\\mathrm{C}$ '. One of them is charged to a potential $V_1$ and the other to $V_2$. The negative ends of the capacitors are connected together. When the positive ends are also connected, the decrease in energy of the combined system is", "image": null}, "options": [{"id": "lzb3u", "text": "$\\frac{1}{4} \\mathrm{C}\\left(\\mathrm{V}_1^2-\\mathrm{V}_2^2\\right)$", "image": null, "isCorrect": false}, {"id": "Q1WkD", "text": "$\\frac{1}{4} C\\left(V_1^2+V_2^2\\right)$", "image": null, "isCorrect": false}, {"id": "1YWze", "text": "$\\frac{1}{4} C\\left(V_1-V_2\\right)^2$", "image": null, "isCorrect": true}, {"id": "TlhFW", "text": "$\\frac{1}{4} \\mathrm{C}\\left(\\mathrm{V}_1+\\mathrm{V}_2\\right)^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Initial energy of the combined system\n$$\n\\mathrm{U}_1=\\frac{1}{2} \\mathrm{CV}_1^2+\\frac{1}{2} \\mathrm{CV}_2^2=\\frac{\\mathrm{C}}{2}\\left(\\mathrm{~V}_1^2+\\mathrm{V}_2^2\\right)\n$$\n\nOn joining the two condensers in parallel, common potential,\n$$\n\\mathrm{V}=\\frac{\\mathrm{V}_1+\\mathrm{V}_2}{2}\n$$\n$\\therefore \\quad$ Final energy of the combined system:\n$$\n\\mathrm{U}_2 \\equiv \\frac{1}{2}(\\mathrm{C}+\\mathrm{C})\\left(\\frac{\\mathrm{V}_1+\\mathrm{V}_2}{2}\\right)^2 \\text {. }\n$$\n$\\therefore \\quad$ - Decrease in energy will be:\n$$\n\\begin{aligned}\n\\Delta \\mathrm{U} & =\\mathrm{U}_{\\mathrm{L}}-\\mathrm{U}_2 \\\\\n& =\\frac{\\mathrm{C}}{2}\\left(\\mathrm{~V}_1^2+\\mathrm{V}_2^2\\right)-\\frac{1}{2}(\\mathrm{C}+\\mathrm{C})\\left(\\frac{\\mathrm{V}_1+\\mathrm{V}_2}{2}\\right)^2 \\\\\n& =\\frac{1}{4} \\mathrm{C}\\left(\\mathrm{V}_1-\\mathrm{V}_2\\right)^2\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261bf0279619d9d8a2f08", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "A parallel combination of two capacitors of capacities ' $2 \\mathrm{C}$ ' and ' $\\mathrm{C}$ ' is connected across $5 \\mathrm{~V}$ battery. When they are fully charged, the charges and energies stored in them be ' $\\mathrm{Q}_1$ ', ' $\\mathrm{Q}_2$ ' and ' $\\mathrm{E}_1$ ', ' $\\mathrm{E}_2$ ' respectively. Then $\\frac{\\mathrm{E}_1-\\mathrm{E}_2}{\\mathrm{Q}_1-\\mathrm{Q}_2}$ in $\\mathrm{J} / \\mathrm{C}$ is (capacity is in Farad, charge in Coulomb and energy in $J$ )", "image": null}, "options": [{"id": "uxaNv", "text": "$\\frac{5}{4}$", "image": null, "isCorrect": false}, {"id": "ARGpa", "text": "$\\frac{4}{5}$", "image": null, "isCorrect": false}, {"id": "OGon6", "text": "$\\frac{5}{2}$", "image": null, "isCorrect": true}, {"id": "IRyAc", "text": "$\\frac{2}{5}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/GvoB-OgSHKSX_cWlBEzNiy9ic7dxdigtep3JcegGsLI.original.fullsize.png\"><br>\nWe know, $\\mathrm{Q}=\\mathrm{C} . \\mathrm{V}$\n$\\therefore \\quad \\mathrm{Q}_1=10 \\mathrm{C} \\text { and } \\mathrm{Q}_2=5 \\mathrm{C}$\nEnergy stored, $\\mathrm{E}=\\frac{1}{2} \\mathrm{CV}^2$\n$\\begin{aligned}\n\\therefore \\quad \\mathrm{E}_1=\\frac{1}{2} \\mathrm{C}_1 \\mathrm{~V}^2 & =\\frac{1}{2} \\times 2 \\mathrm{C} \\times 25 \\\\\n& =25 \\mathrm{~J}\n\\end{aligned}$\nSimilarly, $\\mathrm{E}_2=\\frac{1}{2} \\mathrm{C}_2 \\mathrm{~V}^2=\\frac{1}{2} \\times \\mathrm{C} \\times 25$ $=12.5 \\mathrm{~J}$\n$\\therefore \\quad \\frac{\\mathrm{E}_1-\\mathrm{E}_2}{\\mathrm{Q}_1-\\mathrm{Q}_2}=\\frac{12.5}{5}=\\frac{5}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261ac0279619d9d8a2e70", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "The ratio of potential difference that must be applied across parallel and series combination of two capacitors $\\mathrm{C}_1$ and $\\mathrm{C}_2$ with their capacitance in the ratio $1: 2$ so that energy stored in these two cases becomes same is", "image": null}, "options": [{"id": "zpNNa", "text": "$3:\\sqrt {2}$", "image": null, "isCorrect": false}, {"id": "zOvuI", "text": "$\\sqrt {2}:3$", "image": null, "isCorrect": true}, {"id": "tYd3K", "text": "$2:9$", "image": null, "isCorrect": false}, {"id": "6fc9C", "text": "$9:2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given: $\\mathrm{C}_1: \\mathrm{C}_2=1: 2$\n$\\begin{aligned}\n\\therefore \\quad \\mathrm{C}_2 & =2 \\mathrm{C}_1 \\\\\n\\mathrm{C}_{\\mathrm{P}} & =\\mathrm{C}_1+\\mathrm{C}_2=\\mathrm{C}_1+2 \\mathrm{C}_1=3 \\mathrm{C}_1 \\\\\n\\mathrm{C}_{\\mathrm{S}} & =\\frac{\\mathrm{C}_1 \\mathrm{C}_2}{\\mathrm{C}_1+\\mathrm{C}_2}=\\frac{2 \\mathrm{C}_1^2}{3 \\mathrm{C}_1}=\\frac{2}{3} \\mathrm{C}_1\n\\end{aligned}$\nLet $V_P$ and $V_S$ be the potentials applied across the parallel and series combinations respectively, then using $\\mathrm{E}=\\frac{1}{2} \\mathrm{CV}^2$ we can write,\n$\\begin{aligned}\n& \\frac{1}{2} \\mathrm{C}_{\\mathrm{P}} \\mathrm{V}_{\\mathrm{P}}^2=\\frac{1}{2} \\mathrm{C}_{\\mathrm{S}} \\mathrm{V}_{\\mathrm{s}}^2 \\\\\n\\therefore \\quad & \\frac{\\mathrm{V}_{\\mathrm{P}}^2}{\\mathrm{~V}_{\\mathrm{S}}^2}=\\frac{\\mathrm{C}_{\\mathrm{S}}}{\\mathrm{C}_{\\mathrm{P}}} \\\\\n& \\frac{\\mathrm{V}_{\\mathrm{P}}}{\\mathrm{V}_{\\mathrm{S}}}=\\sqrt{\\frac{\\frac{2}{3} \\mathrm{C}_1}{3 \\mathrm{C}_1}}=\\frac{\\sqrt{2}}{3}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261960279619d9d8a2dc6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "Initially $n$ identical capacitors are joined in parallel and are charged to potential $V$. Now they are separated and joined in series. Then", "image": null}, "options": [{"id": "FPDeS", "text": "Potential difference becomes $n V$ and energy remains the same.", "image": null, "isCorrect": true}, {"id": "xfnGW", "text": "potential difference is $n V$ and energy increases $n$ times", "image": null, "isCorrect": false}, {"id": "JD10C", "text": "potential difference total energy of combination remains same", "image": null, "isCorrect": false}, {"id": "x9G9I", "text": "potential difference remains the same and the energy increases $n$ times.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Charge will not flow and potential difference across each capacitor will be $V$. Hence, total potential difference across the series combination will be $n V$.\nTotal energy will remain same as charge is not flowing.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261740279619d9d8a2caf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "The equivalent capacitance between points $\\mathrm{A}$ and $\\mathrm{B}$ as shown in figure is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/TKcu1JT7SffGk9hnZ9Gmo9WvRFzjzWYAlB6U-8ab4b8.original.fullsize.png\">", "image": null}, "options": [{"id": "gg7mu", "text": "$\\frac{4}{3} C$", "image": null, "isCorrect": false}, {"id": "rudSS", "text": "$2 C$", "image": null, "isCorrect": true}, {"id": "Y6izL", "text": "$5 C$", "image": null, "isCorrect": false}, {"id": "VToV5", "text": "$\\frac{3}{2} C$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Equivalent circuit, uing potential at $\\mathrm{P}$ is same as at $\\mathrm{A}$ and potential at $R$ is same as at $B$.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/XmlB5lRy5eExwjJ2zZQJNekFN_UJFl3CS1FAJkgg6_o.original.fullsize.png\">\nThis is equivalent to following:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/PbD_uPbzoVPMAPYyw4_2agtNNUk6wRV7s8_fteebozY.original.fullsize.png\">\nTherefore, the equivalent capacitance across AB is given by,\n$$\n\\Rightarrow C_{A B}=C+\\frac{C}{2}+\\frac{C}{2}=2 C\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261610279619d9d8a2c15", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "If the equivalent capacitance between $\\mathrm{A}$ and $\\mathrm{B}$ of the combination of capacitors shown in figure is $3 \\mathrm{C}$, the capacitor $\\mathrm{C}^{\\prime}$ 'is equal to\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/8lMpt9MlwjHbZX2oYQusr_i4dS4rw86Jul103Z-3_f0.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "7XEUd", "text": "5C", "image": null, "isCorrect": false}, {"id": "EFPvB", "text": "4C", "image": null, "isCorrect": false}, {"id": "gJl8M", "text": "7C", "image": null, "isCorrect": false}, {"id": "yz9f6", "text": "6C", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Consider figure below.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/Zwv68CTtUe63pwXxTQLOPgmnMczBeTr3qu3mkZcOSZ4.original.fullsize.png\"><br>\nEquivalent capacitance between AP is:\n$\\mathrm{C}_{\\mathrm{AP}}=3(2 \\mathrm{C})$\nAs capacitors are connected parallel, the equivalent capacitance of AB is:\n$\\frac{1}{\\mathrm{C}_{\\mathrm{AB}}}=\\frac{1}{\\mathrm{C}^{\\prime}}+\\frac{1}{6 \\mathrm{C}}=\\frac{6 \\mathrm{C}+\\mathrm{C}^{\\prime}}{6 \\mathrm{CC}^{\\prime}}$\nWe know $\\mathrm{C}_{\\mathrm{AB}}=3 \\mathrm{C}$,\n$\\begin{aligned}\n& \\Rightarrow C_{A B}=\\frac{6 C^{\\prime}}{6 C+C^{\\prime}}=3 C \\\\\n& \\Rightarrow 2 C^{\\prime}=6 C+C^{\\prime} \\\\\n& \\Rightarrow C^{\\prime}=6 C\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261560279619d9d8a2bba", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "Two identical parallel plate air capacitors are connected in series to a battery of emf ' $\\mathrm{V}$ '. If one of the capacitor is inserted in liquid of dielectric constant ' $\\mathrm{K}$ ' then, potential difference of the other capacitor will become", "image": null}, "options": [{"id": "MFxKt", "text": "$\\frac{\\mathrm{K}-1}{\\mathrm{KV}}$", "image": null, "isCorrect": false}, {"id": "0Mhg7", "text": "$\\frac{\\mathrm{K}+1}{\\mathrm{KV}}$", "image": null, "isCorrect": false}, {"id": "8t16c", "text": "$\\left(\\frac{\\mathrm{KV}}{\\mathrm{K}+1}\\right)$", "image": null, "isCorrect": true}, {"id": "M8iws", "text": "$\\frac{\\mathrm{KV}}{\\mathrm{K}-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the capacitance of capacitors are C initially.\nSo, afterward $\\mathrm{C}_1=\\mathrm{KC}$ and $\\mathrm{C}_2=\\mathrm{C}$\np.d. across capacitor $\\mathrm{C}_2$ is\n$\\mathrm{V}_2=\\frac{\\mathrm{C}_1 \\mathrm{~V}}{\\mathrm{C}_1+\\mathrm{C}_2}=\\frac{\\mathrm{KCV}}{\\mathrm{C}+\\mathrm{KC}}=\\frac{\\mathrm{KV}}{\\mathrm{K}+1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2614a0279619d9d8a2b5e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "The network of six capacitors is as shown in figure. The equivalent capacitance between $\\mathrm{A}$ and $\\mathrm{B}$ is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/9PdtSlPl1orJKUF_U_KNT933stBvZnYtb4jMMN0J-ZI.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "n75bL", "text": "$\\frac{2 C}{3}$", "image": null, "isCorrect": false}, {"id": "6aVGp", "text": "$\\frac{4 C}{3}$", "image": null, "isCorrect": false}, {"id": "3XUuZ", "text": "2C", "image": null, "isCorrect": false}, {"id": "cP9Hh", "text": "3C", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Consider the following diagram with nodes Q having same potential due to the symmetry of the circuit:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/QtS3pKjh5PPd6jAv_bk7IjE1kp8TCSTcJMBYnZlATCI.original.fullsize.png\"><br>\nTaking the similar nodes together the equivalent diagram can be drawn as:<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/nbeT_bjq7RD9vOXcXo2Pn183YTbqPSglqZuUhYnIF2Q.original.fullsize.png\"><br>\nTherefore,\nthe eqiuvalent capacitance between $\\mathrm{AQ}=3 C+2 C+C=6 C$\nthe equivalent capacitance between $\\mathrm{QB}=3 C+2 C+C=6 C$\nNow, for equivalent capacitance between $A B$\n$\\begin{aligned}\n& \\frac{1}{C_{\\mathrm{AB}}}=\\frac{1}{6 C}+\\frac{1}{6 C}=\\frac{1}{3 C} \\\\\n& \\therefore C_{\\mathrm{AB}}=3 C\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategor
