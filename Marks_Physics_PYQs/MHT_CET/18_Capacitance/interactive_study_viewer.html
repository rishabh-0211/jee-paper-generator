y": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261390279619d9d8a2acf", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "A parallel combination of three condensers of capacities ' $2 \\mathrm{C}$, ' $\\mathrm{C}$ ' and ' $\\mathrm{C} / 2$ ' is connected\nAcross $10 \\mathrm{~V}$ battery. All the condensers are fully charged to charges ' $\\mathrm{Q}_1$ ', ' $\\mathrm{Q}_2$ ' and ' $\\mathrm{Q}$ 3' respectively. The ratio $\\mathrm{Q}_1: \\mathrm{Q}_2: \\mathrm{Q}_3$ is", "image": null}, "options": [{"id": "yQk8g", "text": "$4: 1: 2$", "image": null, "isCorrect": false}, {"id": "7TMd4", "text": "$1: 4: 2$", "image": null, "isCorrect": false}, {"id": "HRnw5", "text": "$1: 2: 4$", "image": null, "isCorrect": false}, {"id": "g7jqM", "text": "$4: 2: 1$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In parallel combination the potential drop across each capacitor is same.\n$\\begin{aligned} & \\therefore \\Delta V=\\frac{Q_1}{C_1}=\\frac{Q_2}{C_2}=\\frac{Q_3}{C_3} \\\\ & \\Rightarrow \\Delta V=\\frac{Q_1}{2 C}=\\frac{Q_2}{C}=\\frac{Q_3}{(C / 2)} \\\\ & \\Rightarrow(C \\Delta V)=\\frac{Q_1}{2}=\\frac{Q_2}{1}=\\frac{Q_3}{1 / 2} \\\\ & \\therefore Q_1=2 \\times(C \\Delta V), Q_2=1 \\times(C \\Delta V) \\text { and } Q_3=\\frac{1}{2} \\times(C \\Delta V) \\\\ & \\therefore Q_1: Q_2: Q_3=2: 1: 0.5 \\\\ & \\Rightarrow Q_1: Q_2: Q_2=4: 2: 1\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261130279619d9d8a299c", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}], "question": {"text": "The network of four capacitors is connected to a battery as shown in the figure. The ratio of charges on capacitors $C_2$ and $C_4$ is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/834sdmEHojUfYkzt1YrR29ZzD8puW-OvbZX7sS8ov8s.original.fullsize.png\">", "image": null}, "options": [{"id": "Jahd2", "text": "$\\frac{4}{17}$", "image": null, "isCorrect": false}, {"id": "AvsRZ", "text": "$\\frac{5}{21}$", "image": null, "isCorrect": false}, {"id": "lPdyh", "text": "$\\frac{3}{22}$", "image": null, "isCorrect": true}, {"id": "oegzQ", "text": "$\\frac{1}{16}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Equivalent capacitance for three capacitors $C_1, C_2$ and $C_3$ in series is given by\n$\\begin{aligned} & \\frac{1}{C_{e q}}=\\frac{1}{C_1}+\\frac{1}{C_2}+\\frac{1}{C_3}=\\frac{C_2 C_3+C_3 C_1+C_1 C_2}{C_1 C_2 C_3} \\\\ & \\Rightarrow C_{e q}=\\frac{C_1 C_2 C_3}{C_1 C_2+C_2 C_3+C_3 C_1} \\\\ & \\Rightarrow C_{e q}=\\frac{\\mathrm{C}(2 \\mathrm{C})(3 \\mathrm{C})}{(3 \\mathrm{C})(2 \\mathrm{C})+(2 \\mathrm{C})+(3 \\mathrm{C}) \\mathrm{C}}=\\frac{6}{11} \\mathrm{C} \\\\ & \\Rightarrow \\text { Charge on capacitors }\\left(C_1, C_2 \\& C_3\\right) \\text { in series } \\\\ & =C_{e q} V=\\frac{6}{11} C V\\end{aligned}$\n$=C_{e q} V=\\frac{6}{11} C V$\nCharge on capacitor $C_4=C_4 V=4 C V$\n$\\frac{\\text { Charge on } C_2}{\\text { Charge on } C_4}=\\frac{\\left(\\frac{6 C}{11}\\right) V}{(4 C) V} \\times \\frac{1}{4}=\\frac{3}{22}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260ee0279619d9d8a2875", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}], "question": {"text": "A capacitor is made of a flat plate of area ' $A$ ' and the second plate has staircase like structure. Width of each stair is ' $a$ ' and its height is ' $b$ '. The capacity of the capacitor is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/MkBhBNa37vvsQa-5bckHrN6-ThnRBmwPpcQBcgMewtY.original.fullsize.png\">", "image": null}, "options": [{"id": "zPjxE", "text": "$\\frac{\\epsilon_0 \\mathrm{~A}}{4 \\mathrm{~d}}\\left[\\frac{\\mathrm{b}+2 \\mathrm{~d}}{\\mathrm{~b}}\\right]$", "image": null, "isCorrect": false}, {"id": "YPHc2", "text": "$\\frac{\\epsilon_0^A}{4 d}\\left[\\frac{b+2 d}{d+b}\\right]$", "image": null, "isCorrect": false}, {"id": "1lmoG", "text": "$\\in_0 A\\left[\\frac{2 d+b}{d-b}\\right]$", "image": null, "isCorrect": false}, {"id": "a032W", "text": "$\\frac{\\epsilon_0^A}{2 d}\\left[\\frac{2 d+b}{d+b}\\right]$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Above capacitor can be considered as parallel combination of two capacitors of different width $\\mathrm{d}$ and $\\mathrm{b}+\\mathrm{a}$ with each have cross-section $\\frac{\\mathrm{A}}{2}$.\n$C=C_1+C_2=\\frac{\\varepsilon_0\\left(\\frac{A}{2}\\right)}{d}+\\frac{\\varepsilon_0\\left(\\frac{A}{2}\\right)}{d+b}=\\frac{\\varepsilon_0 A}{2 d}\\left\\{\\frac{2 d+b}{(d+b)}\\right\\}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260dd0279619d9d8a27ed", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}], "question": {"text": "Four identical condensers are connected in parallel and then in series. The ratio of equivalent capacitance in series to that in parallel combination is", "image": null}, "options": [{"id": "srUN6", "text": "$1: 4$", "image": null, "isCorrect": false}, {"id": "DXyEd", "text": "$4: 1$", "image": null, "isCorrect": false}, {"id": "NIe5C", "text": "$16: 1$", "image": null, "isCorrect": false}, {"id": "TisFf", "text": "$1: 16$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The correct option is (D).\nConcept: The potential drop across condensers in parallel is the same. The net potential drop across condensers in series should add up and the charge on each plate of condensers is the same in series.\nSuppose Q charge is on each condenser. For identical condensers of each capacitance $\\mathrm{C}$ in parallel combination: $V=\\frac{\\mathrm{Q}}{\\mathrm{C}}=\\frac{4 \\mathrm{Q}}{\\mathrm{C}_{\\|}}$\nSo, $\\mathrm{C}_{\\|}=4 \\mathrm{C}$\nSuppose Q charge is on each condenser, then the net potential drop across the circuit with resistors in series is,\n$\\mathrm{V}=\\frac{\\mathrm{Q}}{\\mathrm{C}_{\\mathrm{S}}}=\\frac{\\mathrm{Q}}{\\mathrm{C}}+\\frac{\\mathrm{Q}}{\\mathrm{C}}+\\frac{\\mathrm{Q}}{\\mathrm{C}}+\\frac{\\mathrm{Q}}{\\mathrm{C}}$.\nSo, $\\mathrm{C}_{\\mathrm{s}}=\\frac{\\mathrm{c}}{4}$.\nThe ratio of equivalent capacitance in series to that in parallel combination is $\\frac{\\mathrm{C}_{\\mathrm{s}}}{\\mathrm{C}_{\\|}}=\\frac{\\mathrm{C}}{4} \\times \\frac{1}{4 \\mathrm{C}}=\\frac{1}{16}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260c80279619d9d8a2742", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "Capacitors of capacities $\\mathrm{C}_1, \\mathrm{C}_2$ and $\\mathrm{C}_3$ are connected in series. If the combination is connected to a supply of ' $\\mathrm{V}$ ' volt, then potential difference across capacitor ' $\\mathrm{C}_1$ ' is", "image": null}, "options": [{"id": "K6jHz", "text": "$\\frac{\\mathrm{C}_2 \\mathrm{C}_3+\\mathrm{C}_1 \\mathrm{C}_3+\\mathrm{C}_1 \\mathrm{C}_2}{\\mathrm{C}_1 \\mathrm{C}_2 \\mathrm{~V}}$", "image": null, "isCorrect": false}, {"id": "aLVpf", "text": "$\\frac{\\mathrm{C}_2 \\mathrm{C}_3+\\mathrm{C}_1 \\mathrm{C}_3+\\mathrm{C}_1 \\mathrm{C}_2}{\\mathrm{C}_1 \\mathrm{C}_2 \\mathrm{C}_3 \\mathrm{~V}}$", "image": null, "isCorrect": false}, {"id": "HeQeP", "text": "$\\frac{\\mathrm{C}_2 \\mathrm{C}_3 \\mathrm{~V}}{\\mathrm{C}_2 \\mathrm{C}_3+\\mathrm{C}_1 \\mathrm{C}_3+\\mathrm{C}_1 \\mathrm{C}_2}$", "image": null, "isCorrect": true}, {"id": "xOaas", "text": "$\\frac{\\mathrm{C}_1 \\mathrm{C}_2 \\mathrm{C}_3 \\mathrm{~V}}{\\mathrm{C}_2 \\mathrm{C}_3+\\mathrm{C}_1 \\mathrm{C}_3+\\mathrm{C}_1 \\mathrm{C}_2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In series combination, the equivalent capacitance $\\mathrm{C}$ is given by\n$\\begin{aligned} & \\frac{1}{\\mathrm{C}}=\\frac{1}{\\mathrm{C}_1}+\\frac{1}{\\mathrm{C}_2}+\\frac{1}{\\mathrm{C}_3} \\\\ & \\therefore \\frac{1}{\\mathrm{C}}=\\frac{\\mathrm{C}_2 \\mathrm{C}_3+\\mathrm{C}_1 \\mathrm{C}_3+\\mathrm{C}_1 \\mathrm{C}_2}{\\mathrm{C}_1 \\mathrm{C}_2 \\mathrm{C}_3}\\end{aligned}$\n$\\therefore \\mathrm{C}=\\frac{\\mathrm{C}_1 \\mathrm{C}_2 \\mathrm{C}_3}{\\mathrm{C}_2 \\mathrm{C}_3+\\mathrm{C}_1 \\mathrm{C}_3+\\mathrm{C}_1 \\mathrm{C}_2}$\nCharge $\\mathrm{Q}$ stored by the combination is given by\n$\\mathrm{Q}=\\mathrm{CV}=\\frac{\\mathrm{C}_1 \\mathrm{C}_2 \\mathrm{C}_3 \\mathrm{~V}}{\\mathrm{C}_2 \\mathrm{C}_3+\\mathrm{C}_1 \\mathrm{C}_3+\\mathrm{C}_1 \\mathrm{C}_2}$\nCharge on each capacitor is same. Hence potential difference\nCharge on each capacitor is same. Hence potential difference\nacross $C_1$ is $V_1=\\frac{Q}{C_1}=\\frac{C_2 C_3 V}{C_2 C_3+C_1 C_3+C_1 C_2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2606e0279619d9d8a246f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "In the given figure potential at point ' $\\mathrm{A}$ ' is 900 volt and point ' $\\mathrm{B}$ ' is earthed. What will be the potential at point ' $\\mathrm{P}$ '?\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/tBzBW42BwUGioD76B_1KotBPTxcaXEWNiM_RRSFrwik.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "CBx5q", "text": "$900 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "SJWFJ", "text": "$100 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "A6c6T", "text": "$300 \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "7APFk", "text": "$600 \\mathrm{~V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Capacitors $\\mathrm{C}_2$ an $\\mathrm{C}_3$ are in parallel. Hence their equivalent capacitance\n$\\mathrm{C}_4=\\mathrm{C}_2+\\mathrm{C}_3=8+4=12 \\mu \\mathrm{F}$\n$\\mathrm{C}_4$ and $\\mathrm{C}_1$ are in series.\nTheir equivalent capacitance $\\mathrm{C}=\\frac{12 \\times 6}{12+6}=\\frac{72}{18}=4 \\mu \\mathrm{F}$\nCharge stored by the combination $\\mathrm{q}=\\mathrm{CV}=4 \\times 900=3600 \\mu \\mathrm{C}$\nIn the series combination, charge in same on each capacitor.\n$\\therefore$ Change on $\\mathrm{C}_1=3600 \\mu \\mathrm{C}$\nP.D. across $\\mathrm{C}_1$ is $\\mathrm{V}_1=\\frac{\\mathrm{q}}{\\mathrm{C}_1}=\\frac{3600}{6}=600 \\mathrm{~V}$\n$$\n\\begin{aligned}\n& \\therefore \\mathrm{V}_{\\mathrm{A}}-\\mathrm{V}_{\\mathrm{P}}=600 \\quad \\therefore 900-\\mathrm{V}_{\\mathrm{P}}=600 \\\\\n& \\therefore \\mathrm{V}_{\\mathrm{P}}=300 \\mathrm{~V}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260460279619d9d8a232c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "The resultant capacity between points $\\mathrm{A}$ and $\\mathrm{B}$ in the given circuit is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/UsUU674QAHz-X3NKzB1TYiey6HwS_Yf_0kiz9CgCE4E.original.fullsize.png\"><br><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/ItNBYm3ZW4ttYsMPvSUEpIN2ExMjBrfO3eTcv2eN9cI.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "ylrNa", "text": "$\\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "GX0ZQ", "text": "$\\frac{\\mathrm{C}}{3}$", "image": null, "isCorrect": false}, {"id": "iGYSq", "text": "$3 \\mathrm{C}$", "image": null, "isCorrect": true}, {"id": "xaA3q", "text": "$2 \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/25c74B6eI_tUEFk0Z-j_sDloJ2ux-jg1vgJeGWPtPdQ.original.fullsize.png\"><br>\n$\\mathrm{C}_1$ and $\\mathrm{C}_2$ are in parallel, their equivalent capacitance $\\mathrm{C}_7=2 \\mathrm{C}$ $\\mathrm{C}_7$ and $\\mathrm{C}_3$ are in series, their equivalent capacitance is $\\mathrm{C}_8=\\mathrm{C}$ $\\mathrm{C}_8$ and $\\mathrm{C}_4$ are in parallel, their equivalent capacitance is $\\mathrm{C}_9=2 \\mathrm{C}$ $\\mathrm{C}_9$ and $\\mathrm{C}_5$ are in series, their equivalent capacitance $\\mathrm{C}_{10}=\\mathrm{C}$ $\\mathrm{C}_{10}$ and $\\mathrm{C}_6$ are in parallel, their equivalent capacitance is $3 \\mathrm{C}$ Hence equivalent capacitance between $\\mathrm{A}$ and $\\mathrm{B}$ is $3 \\mathrm{C}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260210279619d9d8a21fc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "In the arrangement of the capacitors as shown in figure, each capacitor is of $6 \\mu \\mathrm{F}$, then equivalent capacity between points $\\mathrm{A}$ and $B$ is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/uth57q6jxmX8ddcEy3adsUaM1wa1j5_daw9AfITPk90.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "8AOme", "text": "$12 \\mu \\mathrm{F}$", "image": null, "isCorrect": false}, {"id": "vqeUq", "text": "$6 \\mu \\mathrm{F}$", "image": null, "isCorrect": false}, {"id": "Y0Rtr", "text": "$4 \\mu \\mathrm{F}$", "image": null, "isCorrect": false}, {"id": "dVwNT", "text": "$10 \\mu \\mathrm{F}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\mathrm{C}_1$ and $\\mathrm{C}_3$ are in parallel.\nHence their equivalent capacitance $\\mathrm{C}_5=2 \\times 6=12 \\mu \\mathrm{F}$\n$\\mathrm{C}_5$ and $\\mathrm{C}_2$ in series. Hence their equivalent capacitance $\\mathrm{C}_6$ is given by\n$$\n\\frac{1}{\\mathrm{C}_6}=\\frac{1}{12}+\\frac{1}{6}=\\frac{3}{12}=\\frac{1}{4}\n$$\n$\\therefore \\mathrm{C}_6$ and $\\mathrm{C}_4$ are in parallel.\nHence their equivalent capacitance is $\\mathrm{C}=4+6=10 \\mu \\mathrm{F}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ffc0279619d9d8a20cf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "What is the capacitance between the points 'P' and 'Q' in the combination of\ncapacitors shown in figure?\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/_f9uaqpUA2RgFMxZ5auLjMufbm-xItubXnzyKr5KbKs.original.fullsize.png\">", "image": null}, "options": [{"id": "TP4nD", "text": "$1 \\mu \\mathrm{F}$", "image": null, "isCorrect": true}, {"id": "IHoe2", "text": "$9 \\mu \\mathrm{F}$", "image": null, "isCorrect": false}, {"id": "oOzcn", "text": "$2 \\mu \\mathrm{F}$", "image": null, "isCorrect": false}, {"id": "LWYYd", "text": "$7 \\mu \\mathrm{F}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\therefore C=1 \\mu \\mathrm{F}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/a6CC8GmUaJV7Zwtg7BJ2ODXWeAWjBmRCVRMiuJMP7fE.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fe90279619d9d8a203b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "Two capacitors of capacities $2 \\mu \\mathrm{F}$ and $4 \\mu \\mathrm{F}$ are connected in parallel. A third\ncapacitor of $6 \\mu \\mathrm{F}$ capacity is connected in series with this combination. A battery\nof $12 \\mathrm{~V}$ is connected across this combination. The charge on $2 \\mu \\mathrm{F}$ capacitor is", "image": null}, "options": [{"id": "8P77y", "text": "$12 \\mu C$", "image": null, "isCorrect": true}, {"id": "aXT3b", "text": "$16 \\mu C$", "image": null, "isCorrect": false}, {"id": "nrvI2", "text": "$14 \\mu C$", "image": null, "isCorrect": false}, {"id": "bZh0N", "text": "$11 \\mu C$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Two capacitors of capacities $2 \\mu \\mathrm{F}$ and $4 \\mu \\mathrm{F}$ are connected in parallel. A third capacitor of $6 \\mu \\mathrm{F}$ capacity is connected in series with this combination. A battery of $12 \\mathrm{~V}$ is connected across this combination. The charge on $2 \\mu \\mathrm{F}$ capacitor is $12 \\mu \\mathrm{C}$.\nExplanation:\nThe circuit diagram of given situation is as shown below\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/GLKkfWKOy24LAzjwRks4DrCG3OcLUHmRpprr7a5HkCo.original.fullsize.png\"><br>\nThe equivalent capacitance of $2 \\mu \\mathrm{F}$ and $4 \\mu \\mathrm{F}$ capacitors connected in parallel Is $C_{e q}=2+4=6 \\mu \\mathrm{F}$\nThe circuit now becomes<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/JcD9wt0g3uI1EDq9z2V311Js2Nq2z6Pw0fcolVNpub0.original.fullsize.png\"><br>\nAs, both the capacitors are of the same capacitance, so the potential of $12 \\mathrm{~V}$ is equally divided in them i.e., $V_{1}=V_{2}=6 V$\nIn parallel combination, the potential remains the same.\n$\\therefore$ Charge on $2 \\mu \\mathrm{F}, \\mathrm{Q}=2 \\times \\mathrm{V}_{1}=2 \\times 6=12 \\mu \\mathrm{C}$\nOR<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/cDt0HG4OnCpVmMQnLraOSgPSc1AC9PG1FKUrGxmJcgc.original.fullsize.png\"><br>\nLet $C_{1}=2 \\mu F_{1} C_{2}=4 \\mu F$ and $C_{3}=6 \\mu F$\nEquivalent of $C_{1}$ and $C_{2}=C_{4}=6 \\mu F$\nEquivalent of $C_{3}$ and $C_{4}=C_{5}=3 \\mu F$\nCharge on $C_{5}=Q=C_{5} V=3 \\times 12=36 \\mu C$.\n$C_{3}$ and $C_{4}$ are in series. Hence charge on them is also $36 \\mu C$.\nThe charge of $36 \\mu C$ is divided between $C_{1}$ and $C_{2}$ in proportion to their capacitance.\n$\\frac{Q_{1}}{Q_{2}}=\\frac{C_{1}}{C_{2}}$\n$\\therefore \\frac{Q_{1}}{Q_{1}+Q_{2}}=\\frac{C_{1}}{C_{1}+C_{2}}$\n$\\therefore \\frac{Q_{1}}{Q}=\\frac{C_{1}}{C_{1}+C_{2}}=\\frac{2}{6}=\\frac{1}{3}$\n$\\therefore Q_{1}=\\frac{Q}{3}=\\frac{36}{3}=12 \\mu C$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fc60279619d9d8a1f24", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "Five capacitors each of capacity 'C' are connected as shown in figure. If their resultant capacity is $2 \\mu \\mathrm{F}$, then the capacity of each condenser is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/nLO73jobrP3SSUtgr-aXlPoJxm6e6WoBEgB39h6TZog.original.fullsize.png\">", "image": null}, "options": [{"id": "W2FL1", "text": "$2.5 \\mu \\mathrm{F}$", "image": null, "isCorrect": false}, {"id": "ZNqaE", "text": "$2\\mu \\mathrm{F}$", "image": null, "isCorrect": false}, {"id": "FU5gG", "text": "$10\\mu \\mathrm{F}$", "image": null, "isCorrect": true}, {"id": "gAUwH", "text": "$5\\mu \\mathrm{F}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, resultant capacity, $\\mathrm{C}_{\\mathrm{eq}}=2 \\mu \\mathrm{F}$\nThe equivalent capacity of the circuit is given by $\\frac{1}{C_{a q}}=\\frac{1}{C}+\\frac{1}{C}+\\frac{1}{C}+\\frac{1}{C}+\\frac{1}{C} \\ldots(\\because$ all capacitors are in series)\n$\\begin{array}{l}\n\\frac{1}{C_{e q}}=\\frac{5}{C} \\\\\n\\frac{1}{2 \\mu F}=\\frac{5}{C} \\\\\n\\Rightarrow C=10 \\mu F\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fa00279619d9d8a1dff", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "Two condensers of capacities ' $\\mathrm{C}^{\\prime}$ and ${ }^{\\prime} 2 \\mathrm{C}^{\\prime}$ are connected in parallel and then in series with $3^{\\text {rd }}$ condenser of capacity '3C'. The combination is charged to 'V' volt. The charge on the condenser of capacity 'C' is", "image": null}, "options": [{"id": "hWB77", "text": "$\\frac{C V}{3}$", "image": null, "isCorrect": false}, {"id": "imMdj", "text": "$\\frac{C V}{2}$", "image": null, "isCorrect": true}, {"id": "ivWQM", "text": "$2 C V$", "image": null, "isCorrect": false}, {"id": "0kL5d", "text": "$C V$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f660279619d9d8a1c2a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}], "question": {"text": "A network of 4 capacitors is connected to a battery as shown. The ratio of the charges on capacitors $\\mathrm{C}_{2}$ and $\\mathrm{C}_{4}$ is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/oAUMw7IfcEtQC4IBNB35-eCEz9KXmk72B3rz0KEf9wg.original.fullsize.png\">", "image": null}, "options": [{"id": "VP4BI", "text": "$\\frac{3}{13}$", "image": null, "isCorrect": false}, {"id": "f9Wbo", "text": "$\\frac{3}{19}$", "image": null, "isCorrect": false}, {"id": "uLamw", "text": "$\\frac{3}{17}$", "image": null, "isCorrect": false}, {"id": "8RIJo", "text": "$\\frac{3}{22}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Equivalent capacitance for three capacitors $\\mathrm{C}_{1}, \\mathrm{C}_{2}$ and $\\left.\\mathrm{C}_{3}\\right)$ in series is given by\n$\\begin{array}{l}\n\\frac{1}{\\mathrm{C}_{\\mathrm{eq}}}=\\frac{1}{\\mathrm{C}_{1}}+\\frac{1}{\\mathrm{C}_{2}}+\\frac{1}{\\mathrm{C}_{3}}=\\frac{\\mathrm{C}_{2} \\mathrm{C}_{3}+\\mathrm{C}_{3} \\mathrm{C}_{1}+\\mathrm{C}_{\\mathrm{C}} \\mathrm{C}_{2}}{\\mathrm{C}_{\\mathrm{C}} \\mathrm{C} \\mathrm{C}_{3}} \\\\\n\\Rightarrow \\mathrm{C}_{\\mathrm{eq}}=\\frac{\\mathrm{C}_{1} \\mathrm{C}_{2} \\mathrm{C}_{3}}{\\mathrm{C}_{1} \\mathrm{C}_{2}+\\mathrm{C}_{2} \\mathrm{C}_{3}+\\mathrm{C}_{3} \\mathrm{C}_{1}} \\\\\n\\Rightarrow \\mathrm{C}_{\\mathrm{eq}}=\\frac{\\mathrm{C}(2 \\mathrm{C})(3 \\mathrm{C})}{\\mathrm{C}(2 \\mathrm{C})+(2 \\mathrm{C})(3 \\mathrm{C})+(3 \\mathrm{C}) \\mathrm{C}}=\\frac{6}{11} \\mathrm{C}\n\\end{array}$\n$\\Rightarrow$ Charge on capacitors $\\left(\\mathrm{C}_{1}, \\mathrm{C}_{2} \\& \\mathrm{C}_{3}\\right)$ in series\n$=\\mathrm{C}_{\\mathrm{eq}} \\mathrm{V}=\\frac{6 \\mathrm{C}}{11} \\mathrm{v}$\nCharge on capacitor $\\mathrm{C}_{4}=\\mathrm{C}_{4} \\mathrm{~V}=4 \\mathrm{CV}$\n$\\frac{\\text { Charge } \\mathrm{onC}_{2}}{\\text { Charge } \\mathrm{onC}_{4}}=\\frac{\\frac{6 \\mathrm{C}}{11} \\mathrm{~V}}{4 \\mathrm{CV}}=\\frac{6}{11} \\times \\frac{1}{4}=\\frac{3}{22}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/QrkowKuvPoAeP7gX0tYkRZ2dROdhlF4-YkWhVvIkaJI.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f520279619d9d8a1b88", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "Seven capacitors each of capacitance $2 \\mu F$ are to be connected to obtain equivalent\ncapacitance of $\\left(\\frac{10}{11}\\right) \\mu \\mathrm{F}$. Which of the following combination is possible?", "image": null}, "options": [{"id": "roUY3", "text": "3 in parallel and 4 in series", "image": null, "isCorrect": false}, {"id": "8zzQd", "text": "2 in parallel and 5 in series", "image": null, "isCorrect": false}, {"id": "fWsxH", "text": "5 in parallel and 2 in series", "image": null, "isCorrect": true}, {"id": "O9jYJ", "text": "4 in parallel and 3 in series", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In SHM, V $=\\sqrt{A^{2}-x^{2}}$\n$\\mathrm{V}=\\sqrt{\\mathrm{A}^{2}-\\frac{4 \\mathrm{~A}^{2}}{9}}=\\sqrt{\\frac{5 \\mathrm{~A}^{2}}{9}}$\n$3 \\mathrm{~V}=\\sqrt{\\mathrm{A}^{\\prime 2}-\\frac{4 \\mathrm{~A}^{2}}{9}}$\nDividing the above two equations give $A^{\\prime}=\\frac{7 \\mathrm{~A}}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f440279619d9d8a1b19", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}], "question": {"text": "Four capacitors of equal capacity have an equivalent capacitance $\\mathrm{C}_{1}$ when connected in series and an equivalent capacitance $\\mathrm{C}_{2}$ when connected in parallel.\nThe ratio $\\frac{\\mathrm{C}_{2}}{\\mathrm{C}_{1}}$, is", "image": null}, "options": [{"id": "ZUHlx", "text": "4", "image": null, "isCorrect": false}, {"id": "LRWPd", "text": "12", "image": null, "isCorrect": false}, {"id": "CtHTl", "text": "16", "image": null, "isCorrect": true}, {"id": "oDUqj", "text": "8", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let capacitance of each capacitor is C. In series, equivalent capacitance\n$$\nC_{1}=\\frac{C}{4}\n$$\nIn parallel, equivalent capacitance\n$$\n\\begin{aligned}\n\\mathrm{C}_{2} &=4 \\mathrm{C} \\\\\n\\therefore \\frac{\\mathrm{C}_{1}}{\\mathrm{C}_{2}} &=\\frac{1}{16}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f440279619d9d8a1b18", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}], "question": {"text": "Three condensers of capacities $\\mathrm{C}_{1}, \\mathrm{C}_{2}, \\mathrm{C}_{3}$ are connected in series with a source of\ne.m.f. $V$. The potentials across the three condensers are in the ratio of", "image": null}, "options": [{"id": "g9irT", "text": "$\\mathrm{C}_{1}: \\mathrm{C}_{2}: \\mathrm{C}_{3}$", "image": null, "isCorrect": false}, {"id": "7rvYY", "text": "$C_{1}^{2}: C_{2}^{2}: C_{3}^{2}$", "image": null, "isCorrect": false}, {"id": "BzYSl", "text": "$1: 1: 1$", "image": null, "isCorrect": false}, {"id": "R9aK7", "text": "$\\frac{1}{\\mathrm{C}_{1}}: \\frac{1}{\\mathrm{C}_{2}}: \\frac{1}{\\mathrm{C}_{3}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "When capacitors are connected in series, the charge is the same on all the capacitors.\n$$\n\\begin{array}{l}\n\\mathrm{Q}=\\mathrm{C}_{1} \\mathrm{~V}_{1}=\\mathrm{C}_{2} \\mathrm{~V}_{2}=\\mathrm{C}_{7} \\mathrm{~V}_{3} \\\\\n\\text { Or } \\frac{V_{1}}{\\frac{1}{C_{1}}}=\\frac{V_{2}}{\\frac{1}{C_{2}}}=\\frac{V_{3}}{\\frac{1}{C_{3}}}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f300279619d9d8a1a7c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}], "question": {"text": "Two capacitors of same capacity are first joined in series and then in parallel. The\nratio of resultant capacity in series to that in parallel combination will be", "image": null}, "options": [{"id": "a4vvY", "text": "$2: 1$", "image": null, "isCorrect": false}, {"id": "IARP1", "text": "$1: 4$", "image": null, "isCorrect": true}, {"id": "koOvC", "text": "$4: 1$", "image": null, "isCorrect": false}, {"id": "2uroB", "text": "$1: 2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f190279619d9d8a19c4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}], "question": {"text": "The potential differences that must be applied across the parallel and series combination of 3 identical capacitors is such that the energy stored in them becomes the same. The ratio of potential difference in parallel to series combination\nis", "image": null}, "options": [{"id": "kqCK5", "text": "$\\frac{1}{4}$", "image": null, "isCorrect": false}, {"id": "SPhhx", "text": "$\\frac{1}{6}$", "image": null, "isCorrect": false}, {"id": "CQgxC", "text": "$\\frac{1}{3}$", "image": null, "isCorrect": true}, {"id": "b8hUj", "text": "$\\frac{1}{8}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $C$ be the capacity of each capacitor. The equivalent capacitance of three capacitors in parallel combination will be $C_{p}$ $=3 C$ and in series combination $C_{S}=\\frac{C}{3}$\nLet $V_{p}$ be the potential difference in parallel combination and $V_{S}$ in series combination then the energy stored in the same in the two cases.\n$$\n\\begin{array}{l}\n\\therefore \\frac{1}{2} C_{p} V_{p}^{2}=\\frac{1}{2} C_{s} V_{s}^{2} \\\\\n\\therefore \\frac{V_{p}^{2}}{V_{s}^{2}}=\\frac{C_{s}}{C_{p}}=\\frac{C}{3} \\cdot \\frac{1}{3 C}=\\frac{1}{9} \\\\\n\\therefore \\frac{V_{p}}{V_{s}}=\\frac{1}{3}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ee10279619d9d8a1809", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d77 th> <math><msub><mrow><mi>C</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><msub><mrow><mi>ε</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>&nbsp;</mi><mi>A</mi></mrow><mrow><mn>6</mn><mi>d</mi></mrow></mfrac><mo>;</mo></math> <math><msub><mrow><mi>C</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>=</mo><mfrac><mrow><msub><mrow><mi>ε</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>&nbsp;</mi><mi>A</mi></mrow><mrow><mi>9</mi><mi>d</mi></mrow></mfrac></math><br /><math><mo>∴</mo><mi>C</mi><mi>e</mi><mi>q</mi><mo>=</mo><msub><mrow><mi>C</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>C</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><msub><mrow><mi>C</mi></mrow><mrow><mn>3</mn></mrow></msub><mi></mi><mi>for</mi></math> parallel combination of capacitors<br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>C</mi></mrow><mrow><mi>e</mi><mi>q</mi></mrow></msub><mo>=</mo><mfrac><mrow><msub><mrow><mi>ε</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>A</mi></mrow><mrow><mi>d</mi></mrow></mfrac><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>6</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>9</mn></mrow></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>11</mn><msub><mrow><mi>ε</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>A</mi></mrow><mrow><mn>18</mn><mi>d</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e5f0279619d9d8a13e7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "Three condenser of capacitance $C(\\mu \\mathrm{F})$ are connected in parallel to which a condenser of capacitance $C$ is connected in series. Effective capacitance is $3.75$, then capacity of each condenser is", "image": null}, "options": [{"id": "omxaP", "text": "$4 \\mu \\mathrm{F}$", "image": null, "isCorrect": false}, {"id": "5FvHT", "text": "$5 \\mu \\mathrm{F}$", "image": null, "isCorrect": true}, {"id": "nwWDT", "text": "$6 \\mu \\mathrm{F}$", "image": null, "isCorrect": false}, {"id": "UY8Kk", "text": "$8 \\mu \\mathrm{F}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The effective capacitance of three condenser connected in parallel $=3 C$ When $3 C$ is connected in series to $C$\n$$\n\\begin{aligned}\nC_{\\text {Result }} &=\\frac{3 C \\times C}{3 C+C}=3.75 \\\\\n\\Rightarrow \\quad C &=5 \\mu \\mathrm{F}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a263280279619d9d8a3c80", "title": "Capacitors with Dielectric", "totalQuestions": 55, "questions": [{"_id": "6abb88cc15a9fc0fc8c14717", "type": "singleCorrect", "question": {"text": "Air capacitor has capacitance $C_1$. The space between two plates of capacitor is filled with two dielectric as shown in figure. The new capacitance of the capacitor is $C_2$. Then $\\dfrac{C_1}{C_2}$ is [$d$ = distance between two plates, $K_1$ and $K_2$ are dielectric constants of first and second dielectrics respectively]<br><br><img style=\"width: 400px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/may/watermarked_images/20_may_shift_1__q25_d1.png\" />", "image": null}, "options": [{"id": "GwPBr", "label": "A", "text": "$\\dfrac{11}{30}$", "isCorrect": false, "image": null}, {"id": "P0wt4", "label": "B", "text": "$\\dfrac{8}{30}$", "isCorrect": true, "image": null}, {"id": "WNwH0", "label": "C", "text": "$\\dfrac{7}{30}$", "isCorrect": false, "image": null}, {"id": "0VhW9", "label": "D", "text": "$\\dfrac{13}{30}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The initial capacitance of the air capacitor is given by:<br><br>$C_1 = \\dfrac{\\epsilon_0 A}{d}$<br><br>From the given figure, the two dielectrics are placed in series between the plates. Each dielectric has a thickness of $d/2$ and the same cross-sectional area $A$.<br><br>The capacitance of the first dielectric region is:<br><br>$C'_1 = \\dfrac{K_1 \\epsilon_0 A}{d/2} = \\dfrac{2 K_1 \\epsilon_0 A}{d} = 2 K_1 C_1$<br><br>The capacitance of the second dielectric region is:<br><br>$C'_2 = \\dfrac{K_2 \\epsilon_0 A}{d/2} = \\dfrac{2 K_2 \\epsilon_0 A}{d} = 2 K_2 C_1$<br><br>Since these two capacitors are in series, the equivalent capacitance $C_2$ is:<br><br>$\\dfrac{1}{C_2} = \\dfrac{1}{C'_1} + \\dfrac{1}{C'_2}$<br><br>$\\dfrac{1}{C_2} = \\dfrac{1}{2 K_1 C_1} + \\dfrac{1}{2 K_2 C_1}$<br><br>$\\dfrac{1}{C_2} = \\dfrac{1}{2 C_1} \\left( \\dfrac{1}{K_1} + \\dfrac{1}{K_2} \\right) = \\dfrac{1}{2 C_1} \\left( \\dfrac{K_1 + K_2}{K_1 K_2} \\right)$<br><br>Rearranging to find the ratio $\\dfrac{C_1}{C_2}$:<br><br>$\\dfrac{C_1}{C_2} = \\dfrac{K_1 + K_2}{2 K_1 K_2}$<br><br>Substituting the given values $K_1 = 5$ and $K_2 = 3$:<br><br>$\\dfrac{C_1}{C_2} = \\dfrac{5 + 3}{2 \\times 5 \\times 3} = \\dfrac{8}{30}$<br><br>Answer: $\\dfrac{8}{30}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884b15a9fc0fc8c14252", "type": "singleCorrect", "question": {"text": "A parallel plate capacitor of plate separation $2$ mm and plate area $40$ $\\text{cm}^2$ is filled with dielectric whose area is same as plates of capacitor. Thickness is $1$ mm and dielectric constant is $5$. New capacitance is ($\\epsilon_0$ = permittivity of free space)", "image": null}, "options": [{"id": "f6Y9E", "label": "A", "text": "$\\dfrac{3\\epsilon_0}{10}\\,F$", "isCorrect": false, "image": null}, {"id": "4Wn2a", "label": "B", "text": "$\\dfrac{10\\epsilon_0}{3}\\,F$", "isCorrect": true, "image": null}, {"id": "lLqnc", "label": "C", "text": "$\\dfrac{20\\epsilon_0}{3}\\,F$", "isCorrect": false, "image": null}, {"id": "BUamW", "label": "D", "text": "$\\dfrac{3\\epsilon_0}{20}\\,F$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given:<br>Plate area $A = 40 \\text{ cm}^2 = 40 \\times 10^{-4} \\text{ m}^2$<br>Plate separation $d = 2 \\text{ mm} = 2 \\times 10^{-3} \\text{ m}$<br>Thickness of dielectric $t = 1 \\text{ mm} = 1 \\times 10^{-3} \\text{ m}$<br>Dielectric constant $K = 5$<br><br>The capacitance of a parallel plate capacitor partially filled with a dielectric slab is given by:<br>$C = \\dfrac{\\epsilon_0 A}{d - t + \\dfrac{t}{K}}$<br><br>Substituting the given values:<br>$C = \\dfrac{\\epsilon_0 \\times 40 \\times 10^{-4}}{2 \\times 10^{-3} - 1 \\times 10^{-3} + \\dfrac{1 \\times 10^{-3}}{5}}$<br><br>$C = \\dfrac{\\epsilon_0 \\times 40 \\times 10^{-4}}{10^{-3} \\left(1 + \\dfrac{1}{5}\\right)}$<br><br>$C = \\dfrac{\\epsilon_0 \\times 40 \\times 10^{-4}}{10^{-3} \\times \\dfrac{6}{5}}$<br><br>$C = \\dfrac{\\epsilon_0 \\times 4 \\times 10^{-3}}{\\dfrac{6}{5} \\times 10^{-3}}$<br><br>$C = \\dfrac{4 \\epsilon_0 \\times 5}{6} = \\dfrac{20 \\epsilon_0}{6} = \\dfrac{10 \\epsilon_0}{3} \\text{ F}$<br><br>Answer: $\\dfrac{10\\epsilon_0}{3}\\,F$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887e15a9fc0fc8c1443c", "type": "singleCorrect", "question": {"text": "A parallel plate capacitor having capacity $12$ pF is charged by a battery of $10$ V between its plates. The battery is now disconnected and a slab of dielectric constant $6$ is kept between the plates. The work done by the capacitor on the slab is", "image": null}, "options": [{"id": "liGT0", "label": "A", "text": "$1 \\times 10^{-10}$ J", "isCorrect": false, "image": null}, {"id": "W9ZcV", "label": "B", "text": "$2 \\times 10^{-10}$ J", "isCorrect": false, "image": null}, {"id": "p6zIH", "label": "C", "text": "$5 \\times 10^{-10}$ J", "isCorrect": true, "image": null}, {"id": "LZMBQ", "label": "D", "text": "$6 \\times 10^{-10}$ J", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Initial capacitance, $C_i = 12 \\times 10^{-12}$ F<br><br>Initial voltage, $V_i = 10$ V<br><br>Initial energy stored in the capacitor is given by:<br><br>$U_i = \\dfrac{1}{2} C_i V_i^2 = \\dfrac{1}{2} \\times 12 \\times 10^{-12} \\times (10)^2 = 6 \\times 10^{-10}$ J<br><br>Since the battery is disconnected, the charge on the capacitor remains constant. The initial charge is $Q = C_i V_i$.<br><br>When a dielectric slab of constant $K = 6$ is inserted, the new capacitance becomes:<br><br>$C_f = K C_i = 6 \\times 12 \\times 10^{-12} = 72 \\times 10^{-12}$ F<br><br>The final energy stored in the capacitor is:<br><br>$U_f = \\dfrac{Q^2}{2C_f} = \\dfrac{Q^2}{2(K C_i)} = \\dfrac{U_i}{K}$<br><br>$U_f = \\dfrac{6 \\times 10^{-10}}{6} = 1 \\times 10^{-10}$ J<br><br>The work done by the capacitor on the slab is equal to the decrease in its electrostatic potential energy:<br><br>$W = U_i - U_f = 6 \\times 10^{-10} - 1 \\times 10^{-10} = 5 \\times 10^{-10}$ J<br><br>Answer: $5 \\times 10^{-10}$ J", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887e15a9fc0fc8c1443b", "type": "singleCorrect", "question": {"text": "A parallel plate air capacitor has capacity $C$ and plate area $A$. Now the space between its plates is filled by two slabs of thickness $\\dfrac{d}{2}$ each, having dielectric constants $K_1$ and $K_2$. Distance of separation between plates is $d$. The capacity of the capacitor is ($\\varepsilon_0$ = permittivity of free space)", "image": null}, "options": [{"id": "EYMXi", "label": "A", "text": "$\\dfrac{2\\varepsilon_0 d}{A}\\left(\\dfrac{K_1 + K_2}{K_1 K_2}\\right)$", "isCorrect": false, "image": null}, {"id": "WAYCZ", "label": "B", "text": "$2C\\left(\\dfrac{K_1 K_2}{K_1 + K_2}\\right)$", "isCorrect": true, "image": null}, {"id": "1S23I", "label": "C", "text": "$\\dfrac{2\\varepsilon_0 d}{A}(K_1 + K_2)$", "isCorrect": false, "image": null}, {"id": "ENye5", "label": "D", "text": "$2C\\left(\\dfrac{K_1 + K_2}{K_1 K_2}\\right)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Initial capacitance of the air capacitor is $C = \\dfrac{\\varepsilon_0 A}{d}$<br><br>When two dielectric slabs of thickness $\\dfrac{d}{2}$ are introduced between the plates, they act as two capacitors connected in series.<br><br>Capacitance of the first part is $C_1 = \\dfrac{K_1 \\varepsilon_0 A}{d/2} = \\dfrac{2K_1 \\varepsilon_0 A}{d} = 2K_1 C$<br><br>Capacitance of the second part is $C_2 = \\dfrac{K_2 \\varepsilon_0 A}{d/2} = \\dfrac{2K_2 \\varepsilon_0 A}{d} = 2K_2 C$<br><br>The equivalent capacitance $C_{eq}$ for the series combination is given by:<br><br>$C_{eq} = \\dfrac{C_1 C_2}{C_1 + C_2}$<br><br>$C_{eq} = \\dfrac{(2K_1 C)(2K_2 C)}{2K_1 C + 2K_2 C}$<br><br>$C_{eq} = \\dfrac{4K_1 K_2 C^2}{2C(K_1 + K_2)}$<br><br>$C_{eq} = 2C\\left(\\dfrac{K_1 K_2}{K_1 + K_2}\\right)$<br><br>Answer: $2C\\left(\\dfrac{K_1 K_2}{K_1 + K_2}\\right)$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887e15a9fc0fc8c1443a", "type": "singleCorrect", "question": {"text": "When a dielectric is placed in an electric field, the electric field inside the dielectric", "image": null}, "options": [{"id": "iF1Bj", "label": "A", "text": "increases", "isCorrect": false, "image": null}, {"id": "Cttga", "label": "B", "text": "decreases", "isCorrect": true, "image": null}, {"id": "peDGY", "label": "C", "text": "is constant", "isCorrect": false, "image": null}, {"id": "UiOYZ", "label": "D", "text": "is zero", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "When a dielectric is placed in an external electric field $\\vec{E}_{0}$, the molecules of the dielectric get polarized.<br><br>This polarization induces an internal electric field $\\vec{E}_{p}$ in a direction opposite to the external electric field.<br><br>The net electric field inside the dielectric is given by $\\vec{E} = \\vec{E}_{0} - \\vec{E}_{p}$.<br><br>Since the induced electric field opposes the external electric field, the net electric field inside the dielectric decreases.<br><br>Answer: decreases", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888d15a9fc0fc8c144c7", "type": "singleCorrect", "question": {"text": "A slab of material of dielectric constant $k$ has the same area as the plates of the parallel plate capacitor but has thickness $\\dfrac{3d}{4}$, where $d$ is the separation of the plates. How is the capacitance changed, when the slab is inserted between the plates? ($C$ = original capacitance)", "image": null}, "options": [{"id": "SBxXk", "label": "A", "text": "$\\dfrac{4kC}{(k+3)}$", "isCorrect": true, "image": null}, {"id": "0P2Av", "label": "B", "text": "$\\dfrac{(k+3)C}{4k}$", "isCorrect": false, "image": null}, {"id": "sOmHC", "label": "C", "text": "$\\dfrac{(k-3)C}{4k}$", "isCorrect": false, "image": null}, {"id": "TbtOL", "label": "D", "text": "$\\dfrac{4kC}{(k-3)}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The original capacitance of the parallel plate capacitor is given by:<br><br>$C = \\dfrac{\\varepsilon_0 A}{d}$<br><br>When a dielectric slab of thickness $t$ and dielectric constant $k$ is inserted between the plates, the new capacitance is:<br><br>$C' = \\dfrac{\\varepsilon_0 A}{d - t + \\dfrac{t}{k}}$<br><br>Substituting $t = \\dfrac{3d}{4}$ into the expression:<br><br>$C' = \\dfrac{\\varepsilon_0 A}{d - \\dfrac{3d}{4} + \\dfrac{3d}{4k}}$<br><br>$C' = \\dfrac{\\varepsilon_0 A}{\\dfrac{d}{4} + \\dfrac{3d}{4k}}$<br><br>$C' = \\dfrac{\\varepsilon_0 A}{\\dfrac{d(k + 3)}{4k}}$<br><br>$C' = \\dfrac{4k}{k + 3} \\left(\\dfrac{\\varepsilon_0 A}{d}\\right)$<br><br>$C' = \\dfrac{4kC}{k + 3}$<br><br>Answer: $\\dfrac{4kC}{(k+3)}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885d15a9fc0fc8c14303", "type": "singleCorrect", "question": {"text": "Find the capacitance of the Parallel plate capacitor shown in the figure.<br>(A = area of each plate, $\\varepsilon_0$ = permittivity of free space)<br><img style=\"width: 400px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/may/watermarked_images/13_may_shift_1__q31_d1.png\" />", "image": null}, "options": [{"id": "b7cMK", "label": "A", "text": "$\\dfrac{2KA\\varepsilon_0}{(K+1)d}$", "isCorrect": true, "image": null}, {"id": "hnuIb", "label": "B", "text": "$\\dfrac{2KA\\varepsilon_0}{d}$", "isCorrect": false, "image": null}, {"id": "XOG7J", "label": "C", "text": "$\\dfrac{(K+1)A\\varepsilon_0}{2d}$", "isCorrect": false, "image": null}, {"id": "KsRC5", "label": "D", "text": "$\\dfrac{2KA\\varepsilon_0}{(K^2+1)d}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given arrangement can be considered as two capacitors connected in series:<br><br>1. A capacitor with dielectric constant $K$, plate area $A$, and thickness $d_1 = \\dfrac{d}{2}$. Its capacitance is:<br>$C_1 = \\dfrac{K \\varepsilon_0 A}{d/2} = \\dfrac{2K \\varepsilon_0 A}{d}$<br><br>2. A capacitor with air (dielectric constant $1$), plate area $A$, and thickness $d_2 = \\dfrac{d}{2}$. Its capacitance is:<br>$C_2 = \\dfrac{\\varepsilon_0 A}{d/2} = \\dfrac{2 \\varepsilon_0 A}{d}$<br><br>The equivalent capacitance $C_{eq}$ for the series combination is given by:<br>$\\dfrac{1}{C_{eq}} = \\dfrac{1}{C_1} + \\dfrac{1}{C_2}$<br><br>Substituting the values of $C_1$ and $C_2$:<br>$\\dfrac{1}{C_{eq}} = \\dfrac{d}{2K \\varepsilon_0 A} + \\dfrac{d}{2 \\varepsilon_0 A}$<br><br>$\\dfrac{1}{C_{eq}} = \\dfrac{d}{2 \\varepsilon_0 A} \\left( \\dfrac{1}{K} + 1 \\right)$<br><br>$\\dfrac{1}{C_{eq}} = \\dfrac{d(K+1)}{2K \\varepsilon_0 A}$<br><br>Therefore, the equivalent capacitance is:<br>$C_{eq} = \\dfrac{2K \\varepsilon_0 A}{(K+1)d}$<br><br>Answer: $\\dfrac{2KA\\varepsilon_0}{(K+1)d}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb882d15a9fc0fc8c14143", "type": "singleCorrect", "question": {"text": "A parallel plate air capacitor consists of two metal plates of area $A$ and separation $d$. A slab of thickness $t$ and dielectric constant $2k$ is inserted between the plates with its faces parallel to the plates. The effective capacitance of the system is ($\\epsilon_0=$ permittivity of free space)", "image": null}, "options": [{"id": "yIbWm", "label": "A", "text": "$\\dfrac{\\epsilon_0 A}{(d-t)+\\dfrac{t}{2k}}$", "isCorrect": true, "image": null}, {"id": "d4ZLJ", "label": "B", "text": "$\\dfrac{\\epsilon_0 A}{(d-t)-\\dfrac{t}{k}}$", "isCorrect": false, "image": null}, {"id": "meVes", "label": "C", "text": "$\\dfrac{\\epsilon_0 A}{(2d-t)-\\dfrac{t}{2k}}$", "isCorrect": false, "image": null}, {"id": "GwzmE", "label": "D", "text": "$\\dfrac{\\epsilon_0 A}{(d-2t)-\\dfrac{t}{k}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The system can be considered as two capacitors connected in series.<br><br>The first capacitor is formed by the air gap of thickness $d - t$, and its capacitance is $C_1 = \\dfrac{\\epsilon_0 A}{d - t}$.<br><br>The second capacitor is formed by the dielectric slab of thickness $t$ and dielectric constant $2k$, and its capacitance is $C_2 = \\dfrac{2k \\epsilon_0 A}{t}$.<br><br>The equivalent capacitance $C$ of the series combination is given by:<br><br>$\\dfrac{1}{C} = \\dfrac{1}{C_1} + \\dfrac{1}{C_2}$<br><br>Substituting the values of $C_1$ and $C_2$:<br><br>$\\dfrac{1}{C} = \\dfrac{d - t}{\\epsilon_0 A} + \\dfrac{t}{2k \\epsilon_0 A}$<br><br>$\\dfrac{1}{C} = \\dfrac{1}{\\epsilon_0 A} \\left( (d - t) + \\dfrac{t}{2k} \\right)$<br><br>$C = \\dfrac{\\epsilon_0 A}{(d - t) + \\dfrac{t}{2k}}$<br><br>Answer: $\\dfrac{\\epsilon_0 A}{(d-t)+\\dfrac{t}{2k}}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb882d15a9fc0fc8c14141", "type": "singleCorrect", "question": {"text": "When the dielectric is placed in an external electric field, the electric field inside the dielectric is", "image": null}, "options": [{"id": "a92RB", "label": "A", "text": "larger than the external electric field.", "isCorrect": false, "image": null}, {"id": "EM88o", "label": "B", "text": "less than the external electric field.", "isCorrect": true, "image": null}, {"id": "wuWiG", "label": "C", "text": "equal to the external electric field.", "isCorrect": false, "image": null}, {"id": "txmdG", "label": "D", "text": "equal to or greater than external electric field.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "When a dielectric material is placed in an external electric field $\\vec{E}_0$, the molecules of the dielectric get polarized. This polarization induces an internal electric field $\\vec{E}_p$ which opposes the external electric field.<br><br>The net electric field inside the dielectric is given by $\\vec{E} = \\vec{E}_0 - \\vec{E}_p$.<br><br>Since the induced electric field $\\vec{E}_p$ is in the opposite direction to $\\vec{E}_0$, the magnitude of the net electric field inside the dielectric is $E = E_0 - E_p$.<br><br>Alternatively, the electric field inside a dielectric is $E = \\dfrac{E_0}{K}$, where $K$ is the dielectric constant. Since $K > 1$ for all dielectrics, $E < E_0$.<br><br>Thus, the electric field inside the dielectric is always less than the external electric field.<br><br>Answer: less than the external electric field.", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d34f8c30a4553e1be25d", "type": "singleCorrect", "question": {"text": "In a parallel plate air capacitor of plate separation '$d$', a dielectric slab of thickness '$t$' is introduced between the plates. The capacitance becomes one-third of the original value. The dielectric constant of the slab will be", "image": null}, "options": [{"id": "tsFk5", "label": "A", "text": "$\\dfrac{t}{d + t}$", "isCorrect": false, "image": null}, {"id": "w0tgz", "label": "B", "text": "$\\dfrac{t}{2d + t}$", "isCorrect": true, "image": null}, {"id": "PpQGT", "label": "C", "text": "$\\dfrac{t}{d - 2t}$", "isCorrect": false, "image": null}, {"id": "h1G42", "label": "D", "text": "$\\dfrac{2t}{2d - t}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The capacitance of a parallel plate air capacitor is given by:<br><br>$C_0 = \\dfrac{\\epsilon_0 A}{d}$<br><br>When a dielectric slab of thickness $t$ and dielectric constant $K$ is introduced between the plates, the new capacitance becomes:<br><br>$C = \\dfrac{\\epsilon_0 A}{d - t + \\dfrac{t}{K}}$<br><br>According to the given condition, the new capacitance is one-third of the original value:<br><br>$C = \\dfrac{C_0}{3}$<br><br>Substituting the expressions for $C$ and $C_0$:<br><br>$\\dfrac{\\epsilon_0 A}{d - t + \\dfrac{t}{K}} = \\dfrac{\\epsilon_0 A}{3d}$<br><br>Equating the denominators:<br><br>$d - t + \\dfrac{t}{K} = 3d$<br><br>Rearranging the terms to solve for $K$:<br><br>$\\dfrac{t}{K} = 2d + t$<br><br>$K = \\dfrac{t}{2d + t}$<br><br>Answer: $\\dfrac{t}{2d + t}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3088c30a4553e1bdf6c", "type": "singleCorrect", "question": {"text": "A parallel plate air capacitor has capacity 'C' farad, potential 'V' volt and energy 'E' joule. When the gap between the plates is completely filled with dielectric", "image": null}, "options": [{"id": "pfyIz", "label": "A", "text": "V increases, E decreases.", "isCorrect": false, "image": null}, {"id": "I06Og", "label": "B", "text": "V decreases, E increases.", "isCorrect": false, "image": null}, {"id": "O4Keg", "label": "C", "text": "both V and E increase.", "isCorrect": false, "image": null}, {"id": "WWuFS", "label": "D", "text": "both V and E decrease.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Since the capacitor is isolated, the charge $Q$ on the plates remains constant.<br><br>The initial capacitance is $C$, potential is $V = \\dfrac{Q}{C}$, and energy is $E = \\dfrac{Q^2}{2C}$.<br><br>When a dielectric of dielectric constant $K > 1$ is introduced, the new capacitance becomes $C' = KC$.<br><br>The new potential is $V' = \\dfrac{Q}{C'} = \\dfrac{Q}{KC} = \\dfrac{V}{K}$.<br><br>Since $K > 1$, $V' < V$, so the potential decreases.<br><br>The new energy is $E' = \\dfrac{Q^2}{2C'} = \\dfrac{Q^2}{2KC} = \\dfrac{E}{K}$.<br><br>Since $K > 1$, $E' < E$, so the energy also decreases.<br><br>Therefore, both $V$ and $E$ decrease.<br><br>Answer: both V and E decrease.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2fb8c30a4553e1bdee2", "type": "singleCorrect", "question": {"text": "A slab of material of dielectric constant $K$ has the same area as the plates of a parallel plate capacitor but has a thickness $(4/5)d$, where $d$ is the separation of the plates. The capacitance in the presence and absence of dielectric are $C$ and $C_0$ respectively. The ratio $(C/C_0)$ is", "image": null}, "options": [{"id": "Br54X", "label": "A", "text": "$\\dfrac{K + 4}{5K}$", "isCorrect": false, "image": null}, {"id": "cnW7C", "label": "B", "text": "$\\dfrac{4K}{K + 5}$", "isCorrect": false, "image": null}, {"id": "MeoB5", "label": "C", "text": "$\\dfrac{5K}{K + 4}$", "isCorrect": true, "image": null}, {"id": "WgR5g", "label": "D", "text": "$\\dfrac{K + 5}{4K}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The capacitance of a parallel plate capacitor without a dielectric is given by:<br><br>$C_0 = \\dfrac{\\varepsilon_0 A}{d}$<br><br>When a dielectric slab of thickness $t$ and dielectric constant $K$ is introduced, the capacitance becomes:<br><br>$C = \\dfrac{\\varepsilon_0 A}{d - t + \\dfrac{t}{K}}$<br><br>Given $t = \\dfrac{4}{5}d$, substituting this value yields:<br><br>$C = \\dfrac{\\varepsilon_0 A}{d - \\dfrac{4}{5}d + \\dfrac{4d}{5K}}$<br><br>$C = \\dfrac{\\varepsilon_0 A}{\\dfrac{d}{5} + \\dfrac{4d}{5K}}$<br><br>$C = \\dfrac{\\varepsilon_0 A}{\\dfrac{d(K + 4)}{5K}}$<br><br>$C = \\dfrac{5K \\varepsilon_0 A}{d(K + 4)}$<br><br>Taking the ratio of $C$ to $C_0$ gives:<br><br>$\\dfrac{C}{C_0} = \\dfrac{5K}{K + 4}$<br><br>Answer: $\\dfrac{5K}{K + 4}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ce8c30a4553e1bdd03", "type": "singleCorrect", "question": {"text": "A capacitor has capacity C when it's parallel plates are separated by air medium of thickness 'd'. A slab of material of dielectric constant K having area equal to that of plates but thickness $\\dfrac{d}{2}$ is inserted between the plates. Capacitance of the capacitor in the presence of slab will be", "image": null}, "options": [{"id": "pBZ9k", "label": "A", "text": "$\\text{KC}$", "isCorrect": false, "image": null}, {"id": "KUs9z", "label": "B", "text": "$2\\text{KC}$", "isCorrect": false, "image": null}, {"id": "J43zg", "label": "C", "text": "$\\dfrac{\\text{KC}}{\\text{K}+1}$", "isCorrect": false, "image": null}, {"id": "Qo29G", "label": "D", "text": "$\\dfrac{2\\text{KC}}{\\text{K}+1}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Initial capacitance of the parallel plate capacitor with air is given by<br><br>$C = \\dfrac{\\epsilon_0 A}{d}$<br><br>When a dielectric slab of thickness $t = \\dfrac{d}{2}$ and dielectric constant $K$ is inserted, the system can be considered as two capacitors in series.<br><br>Capacitance of the air-filled part of thickness $\\dfrac{d}{2}$ is<br><br>$C_1 = \\dfrac{\\epsilon_0 A}{\\dfrac{d}{2}} = \\dfrac{2\\epsilon_0 A}{d} = 2C$<br><br>Capacitance of the dielectric-filled part of thickness $\\dfrac{d}{2}$ is<br><br>$C_2 = \\dfrac{K\\epsilon_0 A}{\\dfrac{d}{2}} = \\dfrac{2K\\epsilon_0 A}{d} = 2KC$<br><br>The equivalent capacitance $C'$ of these two capacitors in series is<br><br>$C' = \\dfrac{C_1 C_2}{C_1 + C_2}$<br><br>Substituting the values of $C_1$ and $C_2$:<br><br>$C' = \\dfrac{(2C)(2KC)}{2C + 2KC}$<br><br>$C' = \\dfrac{4KC^2}{2C(K + 1)}$<br><br>$C' = \\dfrac{2KC}{K + 1}$<br><br>Answer: $\\dfrac{2\\text{KC}}{\\text{K}+1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3168c30a4553e1be00a", "type": "singleCorrect", "question": {"text": "The function of a dielectric in a capacitor is to", "image": null}, "options": [{"id": "aiBjQ", "label": "A", "text": "reduce the plate area of the capacitor.", "isCorrect": false, "image": null}, {"id": "x5LKk", "label": "B", "text": "to decrease the capacitance.", "isCorrect": false, "image": null}, {"id": "vZjx2", "label": "C", "text": "reduce the effective potential on plates.", "isCorrect": true, "image": null}, {"id": "4U5Ad", "label": "D", "text": "increase the effective potential on plates.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "When a dielectric material is introduced between the plates of a capacitor, it gets polarized due to the external electric field. This polarization creates an induced electric field inside the dielectric which opposes the external electric field.<br><br>As a result, the net electric field between the plates decreases. Since the potential difference is given by $V = E \\times d$, the effective potential difference between the plates also decreases for a given charge.<br><br>This reduction in potential difference leads to an increase in the capacitance of the capacitor, as $C = \\dfrac{Q}{V}$. Therefore, the function of a dielectric is to reduce the effective potential on the plates.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36b8c30a4553e1be388", "type": "singleCorrect", "question": {"text": "The capacitance of a capacitor becomes $\\dfrac{7}{6}$ times the original value if dielectric slab of thickness $t = \\dfrac{2d}{3}$ is introduced between the plates, where 'd' is the distance of separation between the plates. The dielectric constant of the slab is", "image": null}, "options": [{"id": "kr9UT", "label": "A", "text": "$\\dfrac{9}{11}$", "isCorrect": false, "image": null}, {"id": "UXcpK", "label": "B", "text": "$\\dfrac{14}{11}$", "isCorrect": true, "image": null}, {"id": "VeWVk", "label": "C", "text": "$\\dfrac{8}{11}$", "isCorrect": false, "image": null}, {"id": "NHWcJ", "label": "D", "text": "$\\dfrac{12}{11}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The initial capacitance of the capacitor is given by:<br><br>$C_0 = \\dfrac{\\epsilon_0 A}{d}$<br><br>When a dielectric slab of thickness $t$ and dielectric constant $K$ is introduced, the new capacitance becomes:<br><br>$C = \\dfrac{\\epsilon_0 A}{d - t + \\dfrac{t}{K}}$<br><br>Substituting $t = \\dfrac{2d}{3}$ into the expression:<br><br>$C = \\dfrac{\\epsilon_0 A}{d - \\dfrac{2d}{3} + \\dfrac{2d}{3K}}$<br><br>$C = \\dfrac{\\epsilon_0 A}{\\dfrac{d}{3} + \\dfrac{2d}{3K}} = \\dfrac{3 \\epsilon_0 A}{d \\left(1 + \\dfrac{2}{K}\\right)}$<br><br>$C = \\dfrac{3 C_0}{1 + \\dfrac{2}{K}}$<br><br>Given that $C = \\dfrac{7}{6} C_0$, we can equate the two expressions:<br><br>$\\dfrac{7}{6} = \\dfrac{3}{1 + \\dfrac{2}{K}}$<br><br>$7 \\left(1 + \\dfrac{2}{K}\\right) = 18$<br><br>$7 + \\dfrac{14}{K} = 18$<br><br>$\\dfrac{14}{K} = 11$<br><br>$K = \\dfrac{14}{11}$<br><br>Answer: $\\dfrac{14}{11}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b48c30a4553e1bdbe8", "type": "singleCorrect", "question": {"text": "A parallel plate capacitor has plate area $40 \\text{ cm}^2$ and plates separation $2$ mm. The space between the plates is filled with a dielectric medium of a thickness $1$ mm and dielectric constant $5$. The capacitance of the system is", "image": null}, "options": [{"id": "1ubEv", "label": "A", "text": "$24 \\epsilon_0 \\text{ F}$", "isCorrect": false, "image": null}, {"id": "Pf5fr", "label": "B", "text": "$\\dfrac{3}{10} \\epsilon_0 \\text{ F}$", "isCorrect": false, "image": null}, {"id": "NS3bd", "label": "C", "text": "$\\dfrac{10}{3} \\epsilon_0 \\text{ F}$", "isCorrect": true, "image": null}, {"id": "ElnPB", "label": "D", "text": "$10 \\epsilon_0 \\text{ F}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The capacitance of a parallel plate capacitor partially filled with a dielectric is given by:<br><br>$C = \\dfrac{\\epsilon_0 A}{d - t + \\dfrac{t}{K}}$<br><br>Given values are:<br>$A = 40 \\text{ cm}^2 = 40 \\times 10^{-4} \\text{ m}^2$<br>$d = 2 \\text{ mm} = 2 \\times 10^{-3} \\text{ m}$<br>$t = 1 \\text{ mm} = 1 \\times 10^{-3} \\text{ m}$<br>$K = 5$<br><br>Substituting the values into the formula:<br><br>$C = \\dfrac{\\epsilon_0 \\times 40 \\times 10^{-4}}{2 \\times 10^{-3} - 1 \\times 10^{-3} + \\dfrac{1 \\times 10^{-3}}{5}}$<br><br>$C = \\dfrac{\\epsilon_0 \\times 40 \\times 10^{-4}}{10^{-3} \\left(1 + \\dfrac{1}{5}\\right)}$<br><br>$C = \\dfrac{\\epsilon_0 \\times 40 \\times 10^{-4}}{10^{-3} \\times \\dfrac{6}{5}}$<br><br>$C = \\dfrac{\\epsilon_0 \\times 4 \\times 10^{-3}}{1.2 \\times 10^{-3}}$<br><br>$C = \\dfrac{4}{1.2} \\epsilon_0 = \\dfrac{40}{12} \\epsilon_0 = \\dfrac{10}{3} \\epsilon_0 \\text{ F}$<br><br>Answer: $\\dfrac{10}{3} \\epsilon_0 \\text{ F}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be9bf9280d7f9932d87", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Air capacitor has capacitance of $1 \\mu \\mathrm{~F}$. Now the space between two plates of capacitor is filled with two dielectrics as shown in figure. The capacitance of the capacitor is ( $\\mathrm{d}=$ distance between two plates, $\\mathrm{K}_1$ and $\\mathrm{K}_2$ are dielectric constants of two dielectrics respectively)\n\n<img src=\"https://cdn.quizrr.
