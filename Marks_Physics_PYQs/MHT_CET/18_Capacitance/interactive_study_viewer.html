pted", "lastPracticed": null}, {"_id": "65a25f8d0279619d9d8a1d63", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "A parallel plate capacitor has uniform electric field 'E' in the space between the\nplates. If the distance between plates is 'd' and area of each plate is 'A', the energy\nstored in the capacitor is $\\left(\\epsilon_{0}=\\right.$ permittivity of free space $)$", "image": null}, "options": [{"id": "pbWrN", "text": "$\\frac{1}{2} \\frac{\\epsilon_{0} \\mathrm{EA}}{\\mathrm{d}}$", "image": null, "isCorrect": false}, {"id": "7tC3B", "text": "$\\frac{1}{2} \\epsilon_{0} \\mathrm{E}^{2} \\mathrm{Ad}$", "image": null, "isCorrect": true}, {"id": "WZyPF", "text": "$\\frac{1}{2} \\frac{\\epsilon_{0} \\mathrm{Ad}}{\\mathrm{E}^{2}}$", "image": null, "isCorrect": false}, {"id": "7CcXU", "text": "$\\frac{1}{2} \\frac{\\epsilon_{0} \\mathrm{E}^{2} \\mathrm{~A}}{\\mathrm{~d}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Total energy \\(=\\) energy density volume\n\\(=\\left(\\frac{1}{2} \\epsilon_{0} \\mathrm{E}^{2}\\right)(\\mathrm{Ad})\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f530279619d9d8a1b91", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "A capacitor is charged by a battery and energy stored is 'U'. Now the battery is\nremoved and the distance between plates is increased to four times. The energy\nstored becomes", "image": null}, "options": [{"id": "t4jyt", "text": "$4 \\mathrm{U}$", "image": null, "isCorrect": true}, {"id": "swSSi", "text": "U.", "image": null, "isCorrect": false}, {"id": "xABYV", "text": "$3 \\mathrm{U}$", "image": null, "isCorrect": false}, {"id": "87jWB", "text": "$2 \\mathrm{U}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As we know energy stored in capacitor is propotional to distance so, after increases the distance energy will be 4U.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ed30279619d9d8a1792", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}], "question": {"text": "A series combination of <math> <mrow> <msub> <mi>N</mi> <mn>1</mn> </msub> </mrow> </math> is charged to a potential difference <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mtext> </mtext><mi mathvariant=\"normal\">V</mi></math>. Another parallel combination of <math> <mrow> <msub> <mi>N</mi> <mn>2</mn> </msub> </mrow> </math> (each of capacity <math> <mrow> <msub> <mi>C</mi> <mn>2</mn> </msub> </mrow> </math> is charged to a potential difference <math> <mi>V</mi></math>. The total energy stored in both the combination is the same. The value of <math> <mrow> <msub> <mi>C</mi> <mn>1</mn> </msub> </mrow> </math> in terms of <math> <mrow> <msub> <mi>C</mi> <mn>2</mn> </msub> </mrow> </math>&nbsp;is", "image": null}, "options": [{"id": "Kjnbt", "text": "<math><mfrac><mrow><msub><mrow><mi>C</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>N</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>N</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>9</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "ssLvi", "text": "<math><mfrac><mrow><msub><mrow><mi>C</mi></mrow><mrow><mn>2</mn></mrow></msub><msubsup><mrow><mi>N</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><msubsup><mrow><mi>N</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>9</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "qxfO5", "text": "<math><mfrac><mrow><msub><mrow><mi>C</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>N</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><mn>9</mn><msub><mrow><mi>N</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "7oJJr", "text": "<math><mfrac><mrow><msub><mrow><mi>C</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>N</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>9</mn><msub><mrow><mi>N</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <msub> <mi>C</mi> <mrow> <mi>e</mi><mi>q</mi></mrow> </msub> <mo>=</mo><mfrac> <mrow> <msub> <mi>C</mi> <mn>1</mn> </msub> </mrow> <mrow> <msub> <mi>N</mi> <mn>1</mn> </msub> </mrow> </mfrac> </mrow> </math><br /><math> <mrow> <mi>E</mi><mo>=</mo><mfrac> <mn>1</mn> <mn>2</mn> </mfrac> <mi>C</mi><msup> <mi>V</mi> <mn>2</mn> </msup></mrow></math><br /><math> <mrow> <mo>=</mo><mfrac> <mn>1</mn> <mn>2</mn> </mfrac> <mfrac> <mro ls": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}], "question": {"text": "The amount of work done in increasing the voltage across the plates of the capacitor from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi></math>. The work done in increasing it from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> will be", "image": null}, "options": [{"id": "VhZI7", "text": "<math><mi>W</mi></math>", "image": null, "isCorrect": false}, {"id": "B7XeM", "text": "<math><mn>0.6</mn><mi> </mi><mi>W</mi></math>", "image": null, "isCorrect": false}, {"id": "dj9uf", "text": "<math><mn>1.25</mn><mi> </mi><mi>W</mi></math>", "image": null, "isCorrect": false}, {"id": "gJeQd", "text": "<math><mn>1.67</mn><mi>&nbsp;</mi><mi>W</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The work done in increasing the potential is given by<br /><math><mi>W</mi><mo>=</mo><mi>d</mi><mi>U</mi><mo>∝</mo><mo>(</mo><msubsup><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>-</mo><msubsup><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>)</mo></math><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><msub><mrow><mi>W</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>W</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mo>(</mo><msubsup><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>-</mo><msubsup><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>)</mo></mrow><mrow><msubsup><mrow><mo>(</mo><mi>V</mi></mrow><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>-</mo><msubsup><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>)</mo></mrow></mfrac><mi>&nbsp;</mi><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">e</mi><mi>&nbsp;</mi><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>5</mn><mi>v</mi><mo>,</mo><mi>&nbsp;</mi><msub><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>10</mn><mi>V</mi><mi>&nbsp;</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">d</mi><mi>&nbsp;</mi><msub><mrow><mi>V</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>=</mo><mn>15</mn><mi>V</mi></math><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><mi>W</mi></mrow><mrow><msub><mrow><mi>W</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>+</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>100</mn><mo>-</mo><mn>25</mn></mrow><mrow><mn>225</mn><mo>-</mo><mn>100</mn></mrow></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>75</mn></mrow><mrow><mn>125</mn></mrow></mfrac></math><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>W</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>1.67</mn><mi>&nbsp;</mi><mi>W</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e880279619d9d8a1531", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "Energy per unit volume for a capacitor having area $A$ and separation $d$ kept at potential difference $V$ is given by", "image": null}, "options": [{"id": "DZc0U", "text": "$\\frac{1}{2} \\varepsilon_{0} \\frac{V^{2}}{d^{2}}$", "image": null, "isCorrect": true}, {"id": "1b5RL", "text": "$\\frac{1}{2 \\varepsilon_{0}} \\frac{V^{2}}{d^{2}}$", "image": null, "isCorrect": false}, {"id": "kx780", "text": "$\\frac{1}{2} C V^{2}$", "image": null, "isCorrect": false}, {"id": "5HcfP", "text": "$\\frac{Q^{2}}{2 C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Energy density $=\\frac{1}{2} \\varepsilon_{0} E^{2}$\nSince\n$$\nE=\\frac{V}{d}\n$$\nTherefore energy $=\\frac{1}{2} \\varepsilon_{0}\\left(\\frac{V^{2}}{d^{2}}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e760279619d9d8a149c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "Capacity of a capacitor is $48 \\mu \\mathrm{F}$. When it is charged from $0.1 \\mathrm{C}$ to $0.5 \\mathrm{C}$, change in the energy stored is", "image": null}, "options": [{"id": "exMVS", "text": "$2500 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "bHDXF", "text": "$2.5 \\times 10^{-3} \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "fI3hp", "text": "$2.5 \\times 10^{6} \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "QrQyE", "text": "$2.42 \\times 10^{-2} \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Change in energy $\\Delta U=\\frac{1}{2}\\left[\\frac{q_{1}^{2}-q_{2}^{2}}{C}\\right]$\n$$\n\\begin{array}{l}\n=\\frac{1}{2}\\left[\\frac{(0.5)^{2}-(0.1)^{2}}{48 \\times 10^{-6}}\\right] \\\\\n=\\frac{1}{2}\\left[\\frac{0.25-0.01}{48 \\times 10^{-6}}\\right] \\\\\n=\\frac{1}{2}\\left[\\frac{0.24}{48 \\times 10^{-6}}\\right] \\\\\n=\\frac{1}{2}\\left[\\frac{10^{4}}{2}\\right] \\\\\n=2500 \\mathrm{~J}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e4e0279619d9d8a135f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "The energy required to charge a parallel plate condenser of plate separation $d$ and plate area of cross-section $A$ such that the uniform electric field between the plates is $E$, is", "image": null}, "options": [{"id": "xt6Ag", "text": "$\\frac{1}{2} \\varepsilon_{0} E^{2} / A d$", "image": null, "isCorrect": false}, {"id": "g6o34", "text": "$\\varepsilon_{0} E^{2} / A d$", "image": null, "isCorrect": false}, {"id": "zWkcV", "text": "$\\varepsilon_{0} E^{2} A d$", "image": null, "isCorrect": true}, {"id": "Awflx", "text": "$\\frac{1}{2} \\varepsilon_{0} E^{2} A d$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Energy given by the cell\n$$\n\\begin{aligned}\n& E=C V^{2} \\\\\n\\text { Here, } C &=\\text { capacitance of condenser } \\\\\n&=\\frac{A \\varepsilon_{0}}{d}\n\\end{aligned}\n$$\n$V=$ potential difference across the plates $=E d$\n$$\n\\text { Therefore, } E=\\left(\\frac{A \\varepsilon_{0}}{d}\\right)(E d)^{2}=A \\varepsilon_{0} E^{2} d\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "65a263280279619d9d8a3c82", "title": "Charging and Discarging of capacitors", "totalQuestions": 7, "questions": [{"_id": "68871bc7bf9280d7f9932c51", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Three capacitors are connected to a battery as shown in figure. The ratio of charge on capacitors $C_3$ and $C_1$ is\n\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/PJCK4JpbFQKVYtXnSUaDLkuJoK8CsbiuSK03VvV3Jvk.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "Q2wCI", "text": "1.5", "image": null, "isCorrect": false}, {"id": "zumgy", "text": "2.5", "image": null, "isCorrect": false}, {"id": "by7s2", "text": "3.5", "image": null, "isCorrect": false}, {"id": "Tu7nQ", "text": "4.5", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "From the given circuit diagram, the capacitor $C_3$ is connected directly across the battery $V$.<br><br>Therefore, the potential difference across $C_3$ is $V$.<br><br>The charge on $C_3$ is given by:<br>$Q_3 = C_3 V = 3CV$<br><br>Capacitors $C_1$ and $C_2$ are connected in series, and this series combination is connected in parallel with $C_3$ across the battery $V$.<br><br>The equivalent capacitance of the series combination of $C_1$ and $C_2$ is:<br>$C_{12} = \\dfrac{C_1 C_2}{C_1 + C_2} = \\dfrac{1C \\times 2C}{1C + 2C} = \\dfrac{2C^2}{3C} = \\dfrac{2}{3}C$<br><br>The potential difference across this series combination is also $V$. In a series circuit, the charge on each capacitor is the same and equal to the total charge of the combination.<br><br>The charge on $C_1$ is:<br>$Q_1 = C_{12} V = \\dfrac{2}{3}CV$<br><br>The ratio of the charge on capacitor $C_3$ to that on $C_1$ is:<br>$\\dfrac{Q_3}{Q_1} = \\dfrac{3CV}{\\dfrac{2}{3}CV} = \\dfrac{3 \\times 3}{2} = \\dfrac{9}{2} = 4.5$<br><br>Answer: 4.5", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792140b0aee93fa0796dd85", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "Three condensers of capacities ' $\\mathrm{C}_1$ ', ' $\\mathrm{C}_2$ ', ' $\\mathrm{C}_3$ ' are connected in series with a source of e.m.f. ' $V$ '. The potentials across the three condensers are in the ratio", "image": null}, "options": [{"id": "dkYlL", "text": "$1: 1: 1$", "image": null, "isCorrect": false}, {"id": "qo0e0", "text": "$\\mathrm{C}_1: \\mathrm{C}_2: \\mathrm{C}_3$", "image": null, "isCorrect": false}, {"id": "ws36k", "text": "$\\mathrm{C}_1^2: \\mathrm{C}_2^2: \\mathrm{C}_3^2$", "image": null, "isCorrect": false}, {"id": "QmjaP", "text": "$\\frac{1}{\\mathrm{C}_1}: \\frac{1}{\\mathrm{C}_2}: \\frac{1}{\\mathrm{C}_3}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In a series combination of capacitors, the charge $Q$ on each capacitor is the same.<br><br>The potential difference across a capacitor is given by $V = \\dfrac{Q}{C}$.<br><br>For the three capacitors, the potential differences are $V_1 = \\dfrac{Q}{C_1}$, $V_2 = \\dfrac{Q}{C_2}$, and $V_3 = \\dfrac{Q}{C_3}$.<br><br>The ratio of the potentials across the three capacitors is $V_1 : V_2 : V_3 = \\dfrac{Q}{C_1} : \\dfrac{Q}{C_2} : \\dfrac{Q}{C_3}$.<br><br>Since $Q$ is constant, the ratio becomes $\\dfrac{1}{C_1} : \\dfrac{1}{C_2} : \\dfrac{1}{C_3}$.<br><br>Answer: $\\frac{1}{\\mathrm{C}_1}: \\frac{1}{\\mathrm{C}_2}: \\frac{1}{\\mathrm{C}_3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261840279619d9d8a2d34", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "A parallel plate capacitor is charged and then disconnected from the charging battery. If the plates are now moved further apart by pulling them by means of insulting handles, then", "image": null}, "options": [{"id": "BwYXz", "text": "the capacitance of the capacitor increases", "image": null, "isCorrect": false}, {"id": "7Fq7g", "text": "the voltage across the capacitor increases", "image": null, "isCorrect": true}, {"id": "xGnxn", "text": "the energy stored in the capacitor decreases", "image": null, "isCorrect": false}, {"id": "7qS3c", "text": "the charge on the capacitor decreases", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When the capacitor is charged and then disconnected, the charge across the plates remains a constant, even when the plates are separated.\nThe capacitance is related to the structure of parallel plate capacitor as $\\frac{A \\varepsilon_0}{d}$. When the plate is separated, the distance between the plate $d$ increases and hence the capacitance decreases.\nHence, according to the $Q=C V$ relation, the voltage across the capacitor increases in order to keep the charge constant.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261170279619d9d8a29be", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}], "question": {"text": "An uncharged capacitor is connected to a battery. While charging the capacitor, how much is the energy lost, from the energy supplied by the battery?", "image": null}, "options": [{"id": "aFDPc", "text": "$50 \\%$", "image": null, "isCorrect": false}, {"id": "WLnnU", "text": "$75 \\%$", "image": null, "isCorrect": false}, {"id": "D2kF7", "text": "$100 \\%$", "image": null, "isCorrect": false}, {"id": "ZOxLE", "text": "$25 \\%$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Consider the following diagram:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/EM--vENB8t81kxJHXzQXtlvba5foMfS-E5v7aNP6RSk.original.fullsize.png\">\n$\\begin{aligned} & Q=C V \\\\ & E_{\\text {capocitor }}=\\frac{Q^2}{2 C}=\\frac{1}{2} C V^2 \\\\ & W=\\text { Work done by battery }=Q V=C V^2 \\\\ & \\therefore E_{\\text {loss }}=(W)-\\left(E_{\\text {capocitor }}\\right)=C V^2-\\frac{1}{2} C V^2=\\frac{1}{2} C V^2=\\frac{W}{2}\\end{aligned}$\nThis is $50 \\%$ off the energy supplied by the battery", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260b90279619d9d8a26c8", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "The charge on each capacitor when a voltage source of $15 \\mathrm{~V}$ is connected in the circuit as shown, is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/0hlZx4Jqx20lfK8eG9lIcNJS12Waidqv0jENMtbCY38.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "1xcbr", "text": "$75 \\mu \\mathrm{C}$", "image": null, "isCorrect": true}, {"id": "8MVeu", "text": "$150 \\mu \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "anA77", "text": "$30 \\mu \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "nZfcC", "text": "$60 \\mu \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/BtNPlgRz9xaZUMC7o2ehw6AUu7_zuVr6yI2AuUfcg_w.original.fullsize.png\"><br>\nAll four capacitors are connected in parallel.\n$\\therefore$ The charge on each capacitor,\n$$\n\\mathrm{q}=\\mathrm{CV}=5 \\times 15=75 \\mu \\mathrm{C}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2605e0279619d9d8a23ea", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "A condenser of capacity ' $\\mathrm{C}_1$ ' is charged to potential ' $\\mathrm{V}_1$ ' and then disconnected. Uncharged capacitor of capacity ' $\\mathrm{C}_2$ ' is connected in parallel with ' $\\mathrm{C}_1$ '. The resultant potential ' $\\mathrm{V}_2$ ' is", "image": null}, "options": [{"id": "l3X5j", "text": "$\\frac{\\mathrm{V}_1 \\mathrm{C}_2}{\\mathrm{C}_1}$", "image": null, "isCorrect": false}, {"id": "LjLGd", "text": "$\\frac{\\mathrm{C}_2}{\\mathrm{C}_1+\\mathrm{C}_2}$", "image": null, "isCorrect": false}, {"id": "f4upp", "text": "$\\frac{\\mathrm{C}_1 \\mathrm{~V}_1}{\\mathrm{C}_2}$", "image": null, "isCorrect": false}, {"id": "Ynkcx", "text": "$\\frac{\\mathrm{C}_1 \\mathrm{~V}_1}{\\mathrm{C}_1+\\mathrm{C}_2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The charge stored by the charged condenser is\n$$\n\\mathrm{Q}=\\mathrm{C}_1 \\mathrm{~V}_1\n$$\nWhen the uncharged condenser is connected in parallel, the effective capacitance becomes $\\left(\\mathrm{C}_1+\\mathrm{C}_2\\right)$\nHence the potential, $\\mathrm{V}_2=\\frac{\\mathrm{Q}}{\\mathrm{C}_1+\\mathrm{C}_2}=\\frac{\\mathrm{C}_1 \\mathrm{~V}_1}{\\mathrm{C}_1+\\mathrm{C}_2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e500279619d9d8a1370", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "A $20 \\mu \\mathrm{F}$ capacitor is connected to $45 \\mathrm{~V}$ battery through a circuit whose resistance is $2000 \\Omega$. What is the final charge on the capacitor?", "image": null}, "options": [{"id": "WpY3V", "text": "$9 \\times 10^{-4} \\mathrm{C}$", "image": null, "isCorrect": true}, {"id": "lx2Sd", "text": "$9.154 \\times 10^{-4} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "1t6jv", "text": "$9.8 \\times 10^{-4} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "eIF2h", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We know that in steady state the capacitor behaves like as an open circuit i.e., capacitor will not pass the current.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/1I7St6cmGEnWAOrEYXHtG_TBg0CbKTIy1Wtk9Qqx2D4.original.fullsize.png\"><br>\nSo, the potential difference across the capacitor $=45 \\mathrm{~V}$\nHence, the final charge on the capacitor is\n$$\nq=C V\n$$\nHere, $C=20 \\mu \\mathrm{F}, V=45 \\mathrm{~V}$\n$\\therefore$\n$$\nq=20 \\times 10^{-6} \\times 45\n$$\nor\n$$\nq=900 \\times 10^{-6}\n$$\nOr\n$$\nq=9 \\times 10^{-4} \\mathrm{C}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
