  <script>
    const data = {"index": 18, "chapterId": "61c0899734a1d89d41763668", "chapter": "Capacitance", "exam": "MHT CET", "subject": "Physics", "totalTopics": 5, "totalQuestions": 197, "downloadTime": "2026-10-08 20:35:00", "topics": [{"index": 1, "topicId": "65a263290279619d9d8a3c84", "title": "Capacitance", "totalQuestions": 31, "questions": [{"_id": "6abb889e15a9fc0fc8c14565", "type": "singleCorrect", "question": {"text": "Four parallel plate capacitors are connected in parallel. Each capacitor has a plate area $\\dfrac{A}{4}$ and the separation between the plates is $d$, $2d$, $3d$ and $4d$ respectively. The equivalent capacity of the combination is [$\\varepsilon_0 = $ permittivity of free space]", "image": null}, "options": [{"id": "Ma58K", "label": "A", "text": "$\\dfrac{5A\\varepsilon_0}{12d}$", "isCorrect": false, "image": null}, {"id": "tJ6qI", "label": "B", "text": "$\\dfrac{7A\\varepsilon_0}{24d}$", "isCorrect": false, "image": null}, {"id": "XZfAB", "label": "C", "text": "$\\dfrac{9A\\varepsilon_0}{36d}$", "isCorrect": false, "image": null}, {"id": "RGB58", "label": "D", "text": "$\\dfrac{25A\\varepsilon_0}{48d}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The capacitance of a parallel plate capacitor is given by $C = \\dfrac{\\varepsilon_0 A'}{d'}$.<br><br>For the four capacitors, the area is $A' = \\dfrac{A}{4}$ and the distances are $d$, $2d$, $3d$, and $4d$.<br><br>The individual capacitances are:<br><br>$C_1 = \\dfrac{\\varepsilon_0 \\left(\\dfrac{A}{4}\\right)}{d} = \\dfrac{\\varepsilon_0 A}{4d}$<br><br>$C_2 = \\dfrac{\\varepsilon_0 \\left(\\dfrac{A}{4}\\right)}{2d} = \\dfrac{\\varepsilon_0 A}{8d}$<br><br>$C_3 = \\dfrac{\\varepsilon_0 \\left(\\dfrac{A}{4}\\right)}{3d} = \\dfrac{\\varepsilon_0 A}{12d}$<br><br>$C_4 = \\dfrac{\\varepsilon_0 \\left(\\dfrac{A}{4}\\right)}{4d} = \\dfrac{\\varepsilon_0 A}{16d}$<br><br>Since the capacitors are connected in parallel, the equivalent capacitance is the sum of the individual capacitances:<br><br>$C_{eq} = C_1 + C_2 + C_3 + C_4$<br><br>$C_{eq} = \\dfrac{\\varepsilon_0 A}{4d} + \\dfrac{\\varepsilon_0 A}{8d} + \\dfrac{\\varepsilon_0 A}{12d} + \\dfrac{\\varepsilon_0 A}{16d}$<br><br>$C_{eq} = \\dfrac{\\varepsilon_0 A}{d} \\left( \\dfrac{1}{4} + \\dfrac{1}{8} + \\dfrac{1}{12} + \\dfrac{1}{16} \\right)$<br><br>Taking the common denominator as $48$:<br><br>$C_{eq} = \\dfrac{\\varepsilon_0 A}{d} \\left( \\dfrac{12 + 6 + 4 + 3}{48} \\right) = \\dfrac{25A\\varepsilon_0}{48d}$<br><br>Answer: $\\dfrac{25A\\varepsilon_0}{48d}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883e15a9fc0fc8c141d8", "type": "singleCorrect", "question": {"text": "Consider the earth to be a sphere, having charge $Q$. Let $R$, $V$ and $A$ be its radius, volume and area respectively. The capacitance of the earth is [$\\varepsilon_0$ = permittivity of free space]", "image": null}, "options": [{"id": "uYcRH", "label": "A", "text": "$4\\pi\\varepsilon_0 \\dfrac{V}{A}$", "isCorrect": false, "image": null}, {"id": "Kz3tY", "label": "B", "text": "$4\\pi\\varepsilon_0 \\dfrac{A}{V}$", "isCorrect": false, "image": null}, {"id": "2W3ph", "label": "C", "text": "$12\\pi\\varepsilon_0 \\dfrac{A}{V}$", "isCorrect": false, "image": null}, {"id": "QijCK", "label": "D", "text": "$12\\pi\\varepsilon_0 \\dfrac{V}{A}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The capacitance of a spherical conductor of radius $R$ is given by $C = 4\\pi\\varepsilon_0 R$.<br><br>The volume of the sphere is $V = \\dfrac{4}{3}\\pi R^3$.<br><br>The surface area of the sphere is $A = 4\\pi R^2$.<br><br>Dividing the volume by the area gives:<br><br>$\\dfrac{V}{A} = \\dfrac{\\dfrac{4}{3}\\pi R^3}{4\\pi R^2} = \\dfrac{R}{3}$<br><br>$R = 3\\dfrac{V}{A}$<br><br>Substituting the value of $R$ in the expression for capacitance:<br><br>$C = 4\\pi\\varepsilon_0 \\left(3\\dfrac{V}{A}\\right) = 12\\pi\\varepsilon_0 \\dfrac{V}{A}$<br><br>Answer: $12\\pi\\varepsilon_0 \\dfrac{V}{A}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88ba15a9fc0fc8c14669", "type": "singleCorrect", "question": {"text": "A capacitor of unknown capacitance is connected across a battery of $'V'$ volt. The charge stored in it is $'Q'$ C. When potential across the capacitor is reduced by $'V_1'$ volt, the charge stored in it becomes $'Q_1'$ C. The potential $'V'$ is", "image": null}, "options": [{"id": "3pkMr", "label": "A", "text": "$\\dfrac{QV_1}{Q - Q_1}$", "isCorrect": true, "image": null}, {"id": "uqcej", "label": "B", "text": "$\\dfrac{Q}{(Q - Q_1)}$", "isCorrect": false, "image": null}, {"id": "WH9Bt", "label": "C", "text": "$\\dfrac{V_1}{(Q_1 - Q)}$", "isCorrect": false, "image": null}, {"id": "15V58", "label": "D", "text": "$\\dfrac{(Q - Q_1)}{V_1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the capacitance be $C$.<br><br>The initial charge is $Q$ when the potential is $V$.<br><br>$Q = CV \\Rightarrow C = \\dfrac{Q}{V}$<br><br>When the potential is reduced by $V_1$, the new potential is $V - V_1$ and the new charge is $Q_1$.<br><br>$Q_1 = C(V - V_1)$<br><br>Substituting $C = \\dfrac{Q}{V}$:<br><br>$Q_1 = \\dfrac{Q}{V}(V - V_1)$<br><br>$Q_1 V = Q(V - V_1)$<br><br>$Q_1 V = QV - QV_1$<br><br>$QV_1 = QV - Q_1 V$<br><br>$QV_1 = V(Q - Q_1)$<br><br>$V = \\dfrac{QV_1}{Q - Q_1}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3248c30a4553e1be09b", "type": "singleCorrect", "question": {"text": "Two circular plates each of radius '$r$' are kept parallel to each other distance '$d$' apart. The capacitance of the capacitor formed is '$C_1$'. If the radius of each of the plates is increased to $\\sqrt{3}$ times the earlier radius and their distance of separation decreased to half the initial value, the capacitance now becomes '$C_2$'. The ratio $C_1 : C_2$ is", "image": null}, "options": [{"id": "PDOud", "label": "A", "text": "$1 : 2$", "isCorrect": false, "image": null}, {"id": "HKspo", "label": "B", "text": "$1 : 4$", "isCorrect": false, "image": null}, {"id": "oJAO6", "label": "C", "text": "$1 : 6$", "isCorrect": true, "image": null}, {"id": "hePti", "label": "D", "text": "$6 : 1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The capacitance of a parallel plate capacitor is given by $C = \\dfrac{\\epsilon_0 A}{d}$<br><br>For circular plates of radius $r$, the area is $A = \\pi r^2$<br><br>Initial capacitance is $C_1 = \\dfrac{\\epsilon_0 \\pi r^2}{d}$<br><br>When the radius is increased to $\\sqrt{3}r$, the new area is $A' = \\pi (\\sqrt{3}r)^2 = 3\\pi r^2$<br><br>The new distance of separation is $d' = \\dfrac{d}{2}$<br><br>The new capacitance is $C_2 = \\dfrac{\\epsilon_0 (3\\pi r^2)}{d/2} = \\dfrac{6\\epsilon_0 \\pi r^2}{d}$<br><br>Taking the ratio of $C_1$ and $C_2$:<br><br>$\\dfrac{C_1}{C_2} = \\dfrac{\\dfrac{\\epsilon_0 \\pi r^2}{d}}{\\dfrac{6\\epsilon_0 \\pi r^2}{d}} = \\dfrac{1}{6}$<br><br>The ratio $C_1 : C_2$ is $1 : 6$<br><br>Answer: $1 : 6$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3408c30a4553e1be1c7", "type": "singleCorrect", "question": {"text": "Two indentical metal plates are given charges $q_1$ and $q_2$ $(q_2 < q_1)$ respectively. They are brought close together to form a parallel plate capacitor with capacitance 'C'. The potential difference 'V' between the plates is", "image": null}, "options": [{"id": "HOvAG", "label": "A", "text": "$\\dfrac{q_1 - q_2}{C}$", "isCorrect": false, "image": null}, {"id": "aIICZ", "label": "B", "text": "$\\dfrac{q_1 + q_2}{C}$", "isCorrect": false, "image": null}, {"id": "gr2Yu", "label": "C", "text": "$\\dfrac{q_1 - q_2}{2C}$", "isCorrect": true, "image": null}, {"id": "DtMkH", "label": "D", "text": "$\\dfrac{q_1 + q_2}{2C}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "When two identical metal plates are given charges $q_1$ and $q_2$, the charge on the outer surfaces of both plates is $\\dfrac{q_1 + q_2}{2}$.<br><br>The charge on the inner surface of the first plate is $q_1 - \\dfrac{q_1 + q_2}{2} = \\dfrac{q_1 - q_2}{2}$.<br><br>The charge on the inner surface of the second plate is $q_2 - \\dfrac{q_1 + q_2}{2} = -\\left(\\dfrac{q_1 - q_2}{2}\\right)$.<br><br>The charge on the capacitor is the magnitude of the charge on the inner surfaces, which is $q = \\dfrac{q_1 - q_2}{2}$.<br><br>The potential difference $V$ between the plates is given by $V = \\dfrac{q}{C}$.<br><br>Substituting the value of $q$, we get $V = \\dfrac{q_1 - q_2}{2C}$.<br><br>Answer: $\\dfrac{q_1 - q_2}{2C}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2dc8c30a4553e1bdd91", "type": "singleCorrect", "question": {"text": "Two parallel plate air capacitors are connected in parallel. Each capacitor has plate area $A/2$ and separation between the plates is $d$ and $2d$ respectively. The equivalent capacity of the combination is<br><br>( $\\epsilon_0$ = absolute permittivity of free space)", "image": null}, "options": [{"id": "oR0Hr", "label": "A", "text": "$\\dfrac{A\\epsilon_0}{d}$", "isCorrect": false, "image": null}, {"id": "Npw82", "label": "B", "text": "$\\dfrac{3A\\epsilon_0}{4d}$", "isCorrect": true, "image": null}, {"id": "cufCJ", "label": "C", "text": "$\\dfrac{2A\\epsilon_0}{3d}$", "isCorrect": false, "image": null}, {"id": "pn7bU", "label": "D", "text": "$\\dfrac{A\\epsilon_0}{4d}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The capacitance of a parallel plate capacitor is given by $C = \\dfrac{\\epsilon_0 A'}{d'}$<br><br>For the first capacitor, area $A' = \\dfrac{A}{2}$ and separation $d' = d$<br><br>$C_1 = \\dfrac{\\epsilon_0 \\left(\\dfrac{A}{2}\\right)}{d} = \\dfrac{\\epsilon_0 A}{2d}$<br><br>For the second capacitor, area $A' = \\dfrac{A}{2}$ and separation $d' = 2d$<br><br>$C_2 = \\dfrac{\\epsilon_0 \\left(\\dfrac{A}{2}\\right)}{2d} = \\dfrac{\\epsilon_0 A}{4d}$<br><br>Since the capacitors are connected in parallel, their equivalent capacitance is the sum of their individual capacitances:<br><br>$C_{eq} = C_1 + C_2$<br><br>$C_{eq} = \\dfrac{\\epsilon_0 A}{2d} + \\dfrac{\\epsilon_0 A}{4d} = \\dfrac{3\\epsilon_0 A}{4d}$<br><br>Answer: $\\dfrac{3A\\epsilon_0}{4d}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2988c30a4553e1bdabe", "type": "singleCorrect", "question": {"text": "A parallel plate capacitor with air between the plate has a capacitance of $15$ pF. The separation between the plates becomes twice and the space between them is filled with a medium of dielectric constant $3.5$. Then the capacitance becomes $x/4$ pF.<br>The value of $x$ is", "image": null}, "options": [{"id": "yfzxW", "label": "A", "text": "$105$", "isCorrect": true, "image": null}, {"id": "N37VX", "label": "B", "text": "$109$", "isCorrect": false, "image": null}, {"id": "5kerk", "label": "C", "text": "$111$", "isCorrect": false, "image": null}, {"id": "jOnpG", "label": "D", "text": "$115$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The initial capacitance of the parallel plate capacitor with air is given by:<br><br>$C_1 = \\dfrac{\\epsilon_0 A}{d} = 15 \\text{ pF}$<br><br>When the separation between the plates is doubled ($d' = 2d$) and the space is filled with a dielectric of constant $K = 3.5$, the new capacitance becomes:<br><br>$C_2 = \\dfrac{K \\epsilon_0 A}{d'} = \\dfrac{3.5 \\epsilon_0 A}{2d}$<br><br>Substituting the value of $\\dfrac{\\epsilon_0 A}{d}$ from the initial condition:<br><br>$C_2 = \\dfrac{3.5}{2} \\times 15 = \\dfrac{7}{4} \\times 15 = \\dfrac{105}{4} \\text{ pF}$<br><br>Given that the new capacitance is $\\dfrac{x}{4} \\text{ pF}$, we can compare the two expressions:<br><br>$\\dfrac{x}{4} = \\dfrac{105}{4}$<br><br>$x = 105$<br><br>Answer: $105$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d35d8c30a4553e1be2f1", "type": "singleCorrect", "question": {"text": "The earth is assumed to be a charged conducting sphere having volume 'V' and surface area 'A'. The capacitance of the earth in free space is ($\\epsilon_0$ = permittivity of free space)", "image": null}, "options": [{"id": "SyBgP", "label": "A", "text": "$2\\pi \\epsilon_0 V/A$", "isCorrect": false, "image": null}, {"id": "YOfD1", "label": "B", "text": "$4\\pi \\epsilon_0 V/A$", "isCorrect": false, "image": null}, {"id": "UvLIU", "label": "C", "text": "$8\\pi \\epsilon_0 V/A$", "isCorrect": false, "image": null}, {"id": "ujVDj", "label": "D", "text": "$12\\pi \\epsilon_0 V/A$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The capacitance of a spherical conductor of radius $R$ is given by $C = 4\\pi \\epsilon_0 R$.<br><br>The volume of the sphere is $V = \\dfrac{4}{3}\\pi R^3$ and its surface area is $A = 4\\pi R^2$.<br><br>Taking the ratio of volume to surface area:<br><br>$\\dfrac{V}{A} = \\dfrac{\\dfrac{4}{3}\\pi R^3}{4\\pi R^2} = \\dfrac{R}{3}$<br><br>This gives $R = \\dfrac{3V}{A}$.<br><br>Substituting the value of $R$ in the expression for capacitance:<br><br>$C = 4\\pi \\epsilon_0 \\left(\\dfrac{3V}{A}\\right) = 12\\pi \\epsilon_0 \\dfrac{V}{A}$<br><br>Answer: $12\\pi \\epsilon_0 V/A$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d35b8c30a4553e1be2db", "type": "singleCorrect", "question": {"text": "Three parallel plate air capacitors are connected in parallel. Each capacitor has plate area A/3 and separation between the plates is d, 2d and 3d respectively. The equivalent capacity of the combination is ($\\epsilon_0$-permittivity of free space)", "image": null}, "options": [{"id": "mtzsp", "label": "A", "text": "$\\dfrac{9\\epsilon_0 A}{17d}$", "isCorrect": false, "image": null}, {"id": "kGOvH", "label": "B", "text": "$\\dfrac{11\\epsilon_0 A}{17d}$", "isCorrect": false, "image": null}, {"id": "6H1k8", "label": "C", "text": "$\\dfrac{11\\epsilon_0 A}{18d}$", "isCorrect": true, "image": null}, {"id": "aKS8Z", "label": "D", "text": "$\\dfrac{9\\epsilon_0 A}{14d}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The capacitance of a parallel plate capacitor is given by $C = \\dfrac{\\epsilon_0 A'}{d'}$<br><br>For the three capacitors, the capacitances are:<br><br>$C_1 = \\dfrac{\\epsilon_0 (A/3)}{d} = \\dfrac{\\epsilon_0 A}{3d}$<br><br>$C_2 = \\dfrac{\\epsilon_0 (A/3)}{2d} = \\dfrac{\\epsilon_0 A}{6d}$<br><br>$C_3 = \\dfrac{\\epsilon_0 (A/3)}{3d} = \\dfrac{\\epsilon_0 A}{9d}$<br><br>Since the capacitors are connected in parallel, the equivalent capacitance is the sum of individual capacitances:<br><br>$C_{eq} = C_1 + C_2 + C_3$<br><br>$C_{eq} = \\dfrac{\\epsilon_0 A}{3d} + \\dfrac{\\epsilon_0 A}{6d} + \\dfrac{\\epsilon_0 A}{9d}$<br><br>$C_{eq} = \\dfrac{\\epsilon_0 A}{d} \\left( \\dfrac{1}{3} + \\dfrac{1}{6} + \\dfrac{1}{9} \\right)$<br><br>$C_{eq} = \\dfrac{\\epsilon_0 A}{d} \\left( \\dfrac{6 + 3 + 2}{18} \\right) = \\dfrac{11\\epsilon_0 A}{18d}$<br><br>Answer: $\\dfrac{11\\epsilon_0 A}{18d}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bd6bf9280d7f9932cde", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A capacitor of unknown capacity is connected across a battery of V volt. The charge stored in it is Q coulomb. When potential across the capacitor is reduced by $V_1$ volt, the charge stored in it becomes $Q_1$ coulomb. The potential V is", "image": null}, "options": [{"id": "U8QVg", "text": "$\\frac{Q V_1}{Q-Q_1}$", "image": null, "isCorrect": true}, {"id": "MRWsa", "text": "$\\frac{Q_1 V_1}{Q+Q_1}$", "image": null, "isCorrect": false}, {"id": "6JOu1", "text": "$\\frac{Q_1}{Q}$", "image": null, "isCorrect": false}, {"id": "BFnBV", "text": "$\\frac{\\mathrm{Q}}{\\mathrm{Q}_1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the capacitance of the capacitor be $C$.<br><br>Initially, the charge stored is $Q$ at potential $V$.<br><br>$Q = CV \\Rightarrow C = \\dfrac{Q}{V}$<br><br>When the potential is reduced by $V_1$, the new potential is $V - V_1$ and the new charge is $Q_1$.<br><br>$Q_1 = C(V - V_1)$<br><br>Substituting the value of $C$:<br><br>$Q_1 = \\dfrac{Q}{V}(V - V_1)$<br><br>$Q_1 V = QV - QV_1$<br><br>$QV - Q_1 V = QV_1$<br><br>$V(Q - Q_1) = QV_1$<br><br>$V = \\dfrac{QV_1}{Q - Q_1}$<br><br>Answer: $\\frac{Q V_1}{Q-Q_1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bb8bf9280d7f9932bd6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Two identical metal plates are given charges $\\mathrm{q}_1$ and $\\mathrm{q}_2\\left(\\mathrm{q}_2 < \\mathrm{q}_1\\right)$ respectively. If they are now brought close together to form a parallel plate capacitor with capacitance 'C', the potential difference 'V' between the plates is", "image": null}, "options": [{"id": "HnXrm", "text": "$\\frac{q_1-q_2}{c}$", "image": null, "isCorrect": false}, {"id": "mllHO", "text": "$\\frac{q_1+q_2}{c}$", "image": null, "isCorrect": false}, {"id": "XzKtN", "text": "$\\frac{q_1-q_2}{2 C}$", "image": null, "isCorrect": true}, {"id": "T9v7m", "text": "$\\frac{q_1+q_2}{2 C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When two identical metal plates with charges $q_1$ and $q_2$ are brought close together, the charges redistribute on their inner and outer surfaces.<br><br>The charge on the outer surfaces of both plates will be equal to half of the total charge, i.e., $\\dfrac{q_1 + q_2}{2}$.<br><br>The charge on the inner surface of the first plate is:<br>$q_{inner1} = q_1 - \\dfrac{q_1 + q_2}{2} = \\dfrac{q_1 - q_2}{2}$<br><br>The charge on the inner surface of the second plate is:<br>$q_{inner2} = q_2 - \\dfrac{q_1 + q_2}{2} = -\\left(\\dfrac{q_1 - q_2}{2}\\right)$<br><br>These equal and opposite charges on the inner surfaces act as the charge $q$ of the capacitor. Thus, the effective charge on the capacitor is $q = \\dfrac{q_1 - q_2}{2}$.<br><br>The potential difference $V$ between the plates of a capacitor with capacitance $C$ is given by $V = \\dfrac{q}{C}$.<br><br>Substituting the value of $q$, we get:<br>$V = \\dfrac{q_1 - q_2}{2C}$<br><br>Answer: $\\frac{q_1-q_2}{2 C}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b75bf9280d7f993296e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Earth is assumed to be a charged conducting sphere having volume V and surface area $A$. The capacitance of the earth in free space is ( $\\epsilon_0=$ permittivity of free space)", "image": null}, "options": [{"id": "eX1Y5", "text": "$\\frac{2 \\pi \\epsilon_0 V}{A}$", "image": null, "isCorrect": false}, {"id": "V8JSo", "text": "$\\frac{8 \\pi \\epsilon_0 V}{A}$", "image": null, "isCorrect": false}, {"id": "NvvPf", "text": "$\\frac{12 \\pi \\epsilon_0 V}{A}$", "image": null, "isCorrect": true}, {"id": "7qXvs", "text": "$\\frac{4 \\pi \\epsilon_0 V}{A}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The capacitance of a spherical conductor of radius $R$ in free space is given by $C = 4 \\pi \\epsilon_0 R$.<br><br>The volume of the sphere is $V = \\dfrac{4}{3} \\pi R^3$.<br><br>The surface area of the sphere is $A = 4 \\pi R^2$.<br><br>Dividing the volume by the surface area, we get:<br><br>$\\dfrac{V}{A} = \\dfrac{\\dfrac{4}{3} \\pi R^3}{4 \\pi R^2} = \\dfrac{R}{3}$<br><br>This gives $R = \\dfrac{3V}{A}$.<br><br>Substituting the value of $R$ in the formula for capacitance, we get:<br><br>$C = 4 \\pi \\epsilon_0 \\left( \\dfrac{3V}{A} \\right) = \\dfrac{12 \\pi \\epsilon_0 V}{A}$<br><br>Answer: $\\frac{12 \\pi \\epsilon_0 V}{A}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b66bf9280d7f99328d9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The graph shows the variation of voltage (v) across the plates of two parallel plate capacitors A and B versus increase of charge Q stored in them. Then\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/6_v1xh72uA-WwnC7GUa3IEC3FeQ9sGl9zg0Y03iMq5s.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "7ifRK", "text": "capacity of both capacitors is same.", "image": null, "isCorrect": false}, {"id": "zCuHt", "text": "capacity of $A$ is higher than $B$.", "image": null, "isCorrect": true}, {"id": "cPxUe", "text": "capacity of $B$ is higher than $A$.", "image": null, "isCorrect": false}, {"id": "97kjC", "text": "capacity of both is zero.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The capacitance $C$ of a capacitor is given by the formula:<br>$C = \\dfrac{Q}{V}$<br><br>From the given graph of voltage ($V$) versus charge ($Q$), the slope of the line is:<br>$\\text{Slope} = \\dfrac{V}{Q} = \\dfrac{1}{C}$<br><br>From the graph, it is clear that the slope of line B is greater than the slope of line A.<br>$\\text{Slope}_B > \\text{Slope}_A$<br>$\\Rightarrow \\dfrac{1}{C_B} > \\dfrac{1}{C_A}$<br>$\\Rightarrow C_A > C_B$<br><br>Alternatively, for a given constant charge $Q$, the graph shows that $V_B > V_A$.<br>Since $C \\propto \\dfrac{1}{V}$ for a constant $Q$, a smaller voltage corresponds to a higher capacitance.<br>Therefore, $C_A > C_B$, which means the capacity of A is higher than B.<br><br>Answer: capacity of $A$ is higher than $B$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b47bf9280d7f99327c7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The voltage between the plates of a parallel plate capacitor of capacity $1 \\mu \\mathrm{~F}$ is changing at the rate of $4 \\mathrm{~V} / \\mathrm{s}$. the displacement current in the capacitor is", "image": null}, "options": [{"id": "ye65H", "text": "$4 ~\\mu \\mathrm{A}$", "image": null, "isCorrect": true}, {"id": "GxJEJ", "text": "$3 ~\\mu \\mathrm{A}$", "image": null, "isCorrect": false}, {"id": "2972U", "text": "$1 ~\\mu \\mathrm{A}$", "image": null, "isCorrect": false}, {"id": "cFi5f", "text": "$6 ~\\mu \\mathrm{A}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The displacement current $I_d$ in a capacitor is given by<br><br>$I_d = C \\dfrac{dV}{dt}$<br><br>Given:<br>$C = 1 \\mu\\mathrm{F} = 10^{-6} \\mathrm{~F}$<br>$\\dfrac{dV}{dt} = 4 \\mathrm{~V/s}$<br><br>Substituting the values:<br><br>$I_d = 10^{-6} \\times 4 = 4 \\times 10^{-6} \\mathrm{~A}$<br><br>$I_d = 4 \\mu\\mathrm{A}$<br><br>Answer: $4 ~\\mu \\mathrm{A}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792143f0aee93fa0796df1f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "The graph shows the variation of voltage ' V ' across the plates of two capacitors $A$ and $B$ versus increase in charge ' $Q$ ' stored in them. Then\r\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/Naf3PtAuSrloZ0pCev9mZQSIeUZhfc2VAWGu9YV-5Z8.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "kgzhG", "text": "capacitance A has high capacity.", "image": null, "isCorrect": true}, {"id": "HR2ts", "text": "capacitance B has high capacity.", "image": null, "isCorrect": false}, {"id": "oL1iG", "text": "both have same capacity.", "image": null, "isCorrect": false}, {"id": "MpoG4", "text": "capacity of $\\mathrm{A}=2$ times capacity of B .", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The relationship between charge ($Q$), voltage ($V$), and capacitance ($C$) is given by $Q = CV$, which can be rearranged as $V = \\dfrac{1}{C}Q$.<br><br>In a graph of $V$ versus $Q$, the slope of the straight line is equal to $\\dfrac{1}{C}$.<br><br>From the given graph, for a constant charge $Q$, the voltage across capacitor B is greater than the voltage across capacitor A ($V_B > V_A$).<br><br>Since $C = \\dfrac{Q}{V}$, a smaller voltage for the same charge corresponds to a larger capacitance.<br><br>Therefore, $C_A > C_B$, which means capacitor A has a higher capacity.<br><br>Answer: capacitance A has high capacity.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792141a0aee93fa0796ddfe", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "A resistor of $50 \\Omega$, inductor of self inductance $\\left(\\frac{3}{\\pi^2}\\right) \\mathrm{H}$ and a capacitor of unknown capacity are connected in series to an a.c. source of 100 V and 50 Hz . When the voltage and current are in phase, the value of capacitance is (nearly)", "image": null}, "options": [{"id": "fo6U2", "text": "$0.66 \\times 10^{-4} \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "6Dk7M", "text": "$0.33 \\times 10^{-4} \\mathrm{~F}$", "image": null, "isCorrect": true}, {"id": "JPO3G", "text": "$0.66 \\times 10^{-2} \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "qn44O", "text": "$0.33 \\times 10^{-2} \\mathrm{~F}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When voltage and current are in phase, the circuit is in resonance.<br><br>At resonance, $X_L = X_C$<br><br>$\\omega L = \\dfrac{1}{\\omega C}$<br><br>$C = \\dfrac{1}{\\omega^2 L} = \\dfrac{1}{(2\\pi f)^2 L}$<br><br>Given $f = 50$ Hz, $L = \\dfrac{3}{\\pi^2}$ H<br><br>$C = \\dfrac{1}{(2\\pi \\times 50)^2 \\times \\left(\\dfrac{3}{\\pi^2}\\right)}$<br><br>$C = \\dfrac{1}{10000\\pi^2 \\times \\dfrac{3}{\\pi^2}}$<br><br>$C = \\dfrac{1}{30000}$<br><br>$C = 0.33 \\times 10^{-4}$ F<br><br>Answer: $0.33 \\times 10^{-4} \\mathrm{~F}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792135b0aee93fa0796d824", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "A parallel plate capacitor is charged and then isolated. If the separation between the plates is increased, which one of the following statement is NOT correct?", "image": null}, "options": [{"id": "pazvA", "text": "Charge remains constant after it is isolated.", "image": null, "isCorrect": false}, {"id": "xy8U0", "text": "Potential difference across the plates decreases.", "image": null, "isCorrect": true}, {"id": "EVENS", "text": "Potential difference across the plates increases.", "image": null, "isCorrect": false}, {"id": "xCMHB", "text": "Capacitance of capacitor decreases.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since the capacitor is isolated after being charged, the charge $Q$ on the plates remains constant.<br><br>The capacitance of a parallel plate capacitor is given by $C = \\dfrac{\\varepsilon_0 A}{d}$.<br><br>When the separation $d$ between the plates is increased, the capacitance $C$ decreases.<br><br>The potential difference across the plates is given by $V = \\dfrac{Q}{C}$.<br><br>Since $Q$ is constant and $C$ decreases, the potential difference $V$ increases.<br><br>Therefore, the statement that the potential difference across the plates decreases is incorrect.<br><br>Answer: Potential difference across the plates decreases.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213480aee93fa0796d794", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Two circular metal plates each of radius ' $r$ ' are kept parallel to each other distance 'd' apart. The capacitance of the capacitor formed is ' $\\mathrm{C}_1$ '. If the radius of each of the plates is increased to $\\sqrt{2}$ times the earlier radius and their distance of separation decreased to half the initial value, the capacitance now becomes ' $\\mathrm{C}_2$ '. The ratio of the capacitances $\\mathrm{C}_1: \\mathrm{C}_2$. is", "image": null}, "options": [{"id": "U5SuO", "text": "$1: 1$", "image": null, "isCorrect": false}, {"id": "Y9PCO", "text": "$1: 2$", "image": null, "isCorrect": false}, {"id": "6juGd", "text": "$1: 4$", "image": null, "isCorrect": true}, {"id": "yH2uk", "text": "$4: 1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The capacitance of a parallel plate capacitor is given by $C = \\dfrac{\\varepsilon_0 A}{d} = \\dfrac{\\varepsilon_0 \\pi r^2}{d}$.<br><br>For the initial capacitor:<br>$C_1 = \\dfrac{\\varepsilon_0 \\pi r^2}{d}$<br><br>For the final capacitor, the radius is $r' = \\sqrt{2}r$ and the distance is $d' = \\dfrac{d}{2}$.<br><br>The new capacitance is:<br>$C_2 = \\dfrac{\\varepsilon_0 \\pi (\\sqrt{2}r)^2}{\\dfrac{d}{2}} = \\dfrac{\\varepsilon_0 \\pi (2r^2)}{\\dfrac{d}{2}} = \\dfrac{4\\varepsilon_0 \\pi r^2}{d}$<br><br>Taking the ratio of $C_1$ to $C_2$:<br>$\\dfrac{C_1}{C_2} = \\dfrac{\\dfrac{\\varepsilon_0 \\pi r^2}{d}}{\\dfrac{4\\varepsilon_0 \\pi r^2}{d}} = \\dfrac{1}{4}$<br><br>The ratio $C_1 : C_2$ is $1 : 4$.<br><br>Answer: $1: 4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2621e0279619d9d8a31f0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "The potential on the plates of capacitor are $+20 \\mathrm{~V}$ and $-20 \\mathrm{~V}$. The charge on the plate is $40 \\mathrm{C}$. The capacitance of the capacitor is", "image": null}, "options": [{"id": "uHeex", "text": "$2 \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "UdHie", "text": "$1 \\mathrm{~F}$", "image": null, "isCorrect": true}, {"id": "ZhjKY", "text": "$4 \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "XDK29", "text": "$0.5 \\mathrm{~F}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\mathrm{V} & =20-(-20)=40 \\text { volt } \\\\ \\mathrm{Q} & =40 \\mathrm{C} \\\\ \\mathrm{C} & =\\frac{\\mathrm{Q}}{\\mathrm{V}} \\\\ \\therefore \\quad \\mathrm{C} & =\\frac{40}{40} \\\\ \\therefore \\quad \\mathrm{C} & =1 \\mathrm{~F}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2621d0279619d9d8a31e4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "The equivalent capacity between terminal A and $B$ is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/__b-VuVPOtsByovkhBbMVvtIIxHri0VOyWJJFjA7pJA.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "ulsw0", "text": "$\\frac{\\mathrm{C}}{4}$", "image": null, "isCorrect": false}, {"id": "PYTxP", "text": "$\\frac{3 \\mathrm{C}}{4}$", "image": null, "isCorrect": false}, {"id": "x7il2", "text": "$\\frac{\\mathrm{C}}{3}$", "image": null, "isCorrect": false}, {"id": "E1ZbI", "text": "$\\frac{4 \\mathrm{C}}{3}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/2CK24wnZCD0hWlfV9qmTPYUJvApPZpYBghWCioTw8U0.original.fullsize.png\"><br>\n\n$$\n\\begin{aligned}\n\\frac{1}{C_5} & =\\frac{1}{C}+\\frac{1}{C}+\\frac{1}{C} \\\\\n\\therefore \\quad C_5 & =\\frac{C}{3}\n\\end{aligned}\n$$\nNow, $\\mathrm{C}_5$ and $\\mathrm{C}$ are connected in parallel,\n$$\n\\therefore \\quad \\mathrm{C}_{\\text {net }}=\\mathrm{C}_{\\mathrm{s}}+\\mathrm{C}=\\frac{\\mathrm{C}}{3}+\\mathrm{C}=\\frac{4 \\mathrm{C}}{3}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261ce0279619d9d8a2f7d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "Two capacitors $\\mathrm{C}_1=3 \\mu \\mathrm{F}$ and $\\mathrm{C}_2=2 \\mu \\mathrm{F}$ are connected in series across d.c. source of $100 \\mathrm{~V}$. The ratio of the potential across $C_2$ to $C_1$ is", "image": null}, "options": [{"id": "GNWqH", "text": "$2: 3$", "image": null, "isCorrect": false}, {"id": "MfbPI", "text": "$3:2$", "image": null, "isCorrect": true}, {"id": "At9qN", "text": "$6:5$", "image": null, "isCorrect": false}, {"id": "IlJh4", "text": "$5:6$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{array}{ll}\n\\therefore \\quad & \\mathrm{C}_1=3 \\mu \\mathrm{F} \\text { and } \\mathrm{C}_2=2 \\mu \\mathrm{F} \\\\\n& \\mathrm{C}_{\\text {series }}=\\frac{\\mathrm{C}_1 \\mathrm{C}_2}{\\mathrm{C}_1+\\mathrm{C}_2}=\\frac{6}{5} \\mu \\mathrm{F} \\\\\n& \\text { Also, } \\mathrm{Q}=\\mathrm{CV} \\\\\n\\mathrm{Q} & =\\mathrm{C}_{\\text {series }} \\times \\mathrm{V} \\\\\n& =\\frac{6}{5} \\times 100=120 \\mu \\mathrm{C}\n\\end{array}$\n$\\mathrm{Q}$ will be the same across both the capacitors as they are in series.\n$\\therefore \\quad$ Potential across capacitors,\n$\\begin{aligned}\n& \\mathrm{V}_1=\\frac{\\mathrm{Q}}{\\mathrm{C}_1}=\\frac{120}{3}=40 \\mathrm{~V} \\\\\n& \\mathrm{~V}_2=\\frac{\\mathrm{Q}}{\\mathrm{C}_2}=\\frac{120}{2}=60 \\mathrm{~V} \\\\\n& \\therefore \\quad \\mathrm{V}_2: \\mathrm{V}_1=60: 40=3: 2\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261ab0279619d9d8a2e64", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "The capacitance of a parallel plate capacitor is $2.5 \\mu \\mathrm{F}$. When it is half filled with a dielectric as shown in figure, its capacitance becomes $5 \\mu \\mathrm{F}$. The dielectric constant of the dielectric is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/D8Z_pCX2WVOnJLIKJ2PsgBkghg61C96Mu7ey-AydYWI.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "JrIel", "text": "7.5", "image": null, "isCorrect": false}, {"id": "576Tc", "text": "3", "image": null, "isCorrect": true}, {"id": "lw7jH", "text": "4", "image": null, "isCorrect": false}, {"id": "BAttj", "text": "5", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $\\mathrm{C}=\\frac{\\varepsilon_0 \\mathrm{~A}}{\\mathrm{~d}}=2.5 \\mu \\mathrm{F}$\nWhen half filled with air,\n$\\mathrm{C}_1=\\frac{\\varepsilon_0(\\mathrm{~A} / 2)}{\\mathrm{d}}=\\frac{\\varepsilon_0 \\mathrm{~A}}{2 \\mathrm{~d}}$\n$\\left(\\because \\varepsilon_{\\mathrm{r}}=1\\right)$\nWhen half filled with a dielectric,\n$\\mathrm{C}_2=\\frac{\\varepsilon_{\\mathrm{r}} \\varepsilon_0(\\mathrm{~A} / 2)}{\\mathrm{d}}=\\frac{\\varepsilon_{\\mathrm{r}} \\varepsilon_0 \\mathrm{~A}}{2 \\mathrm{~d}} \\text {, }$\nFrom the figure, it can be seen that $\\mathrm{C}_1$ and $\\mathrm{C}_2$ are in parallel configuration.\n$\\begin{array}{ll}\n\\therefore \\quad & \\mathrm{C}_{\\mathrm{eq}}=\\mathrm{C}_1+\\mathrm{C}_2 \\\\\n& \\text { Given, } \\mathrm{C}_{\\mathrm{eq}}=5 \\mu \\mathrm{F} \\\\\n& \\Rightarrow 5 \\mu \\mathrm{F}=\\frac{\\varepsilon_0 \\mathrm{~A}}{2 \\mathrm{~d}}+\\frac{\\varepsilon_{\\mathrm{r}} \\varepsilon_0 \\mathrm{~A}}{2 \\mathrm{~d}} \\\\\n& 5=\\frac{2.5}{2}+\\varepsilon_{\\mathrm{r}} \\frac{2.5}{2} \\\\\n& \\frac{3.75}{1.25}=\\varepsilon_{\\mathrm{r}} \\\\\n\\therefore \\quad & \\varepsilon_{\\mathrm{r}}=3\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2616f0279619d9d8a2c8a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "The earth is assumed to be charged conducting sphere having volume $V$ and surface area $A$. The capacitance of the earth in free space is", "image": null}, "options": [{"id": "sGHC1", "text": "$\\frac{2 \\pi \\epsilon_0 V}{A}$", "image": null, "isCorrect": false}, {"id": "eSGTP", "text": "$\\frac{12 \\pi \\epsilon_0 V}{A}$", "image": null, "isCorrect": true}, {"id": "SixKA", "text": "$\\frac{8 \\pi \\epsilon_0 V}{A}$", "image": null, "isCorrect": false}, {"id": "JbbgC", "text": "$\\frac{4 \\pi \\epsilon_0 V}{A}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If we assume shape of earth be solid sphere of radius $R$.\nThe ratio of earth volume to surface area: $\\frac{V}{A}=\\frac{\\left(\\frac{4}{3} \\pi R^3\\right)}{4 \\pi R^2}=\\frac{R}{3}$ or, $R=\\frac{3 V}{A}$\nThe capacitance of earth is,\n$C_E=4 \\pi \\epsilon_0 R=4 \\pi \\epsilon_0\\left(\\frac{3 V}{A}\\right)=\\frac{12 \\pi \\epsilon_0 V}{A}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261280279619d9d8a2a45", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "Two parallel air capacitors have their plate areas $100 \\mathrm{~cm}^2$ and $500 \\mathrm{~cm}^2$, respectively. They have the same charge and potential. If the distance between the plates of the first capacitor is $0.5 \\mathrm{~mm}$, the distance between the plates of the second capacitor is", "image": null}, "options": [{"id": "zcV0D", "text": "$1 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "mQ1a9", "text": "$0.75 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "CkHHq", "text": "$0.25 \\mathrm{~cm}$", "image": null, "isCorrect": true}, {"id": "NfrSE", "text": "$0.52 \\mathrm{~cm}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here, two parallel plate capacitors have same charge q and same potential V, so they have equal capacitances as\n$\\begin{aligned} & \\mathrm{C}=\\frac{\\mathrm{q}}{\\mathrm{V}} \\\\ & \\mathrm{C}_1=\\mathrm{C}_2 \\\\ & \\frac{\\varepsilon_0 \\mathrm{~A}_1}{\\mathrm{~d}_1}=\\frac{\\varepsilon_0 \\mathrm{~A}_2}{\\mathrm{~d}_2} \\\\ & \\text { Or } \\mathrm{d}_2=\\frac{\\mathrm{A}_2}{\\mathrm{~A}_1} \\mathrm{~d}_1 \\\\ & \\text { Now, } \\mathrm{A}_1=100 \\mathrm{~cm}^2, \\mathrm{~A}_2=500 \\mathrm{~cm}^2 \\\\ & \\mathrm{~d}_1=0.5 \\mathrm{~mm}=0.05 \\mathrm{~cm} \\\\ & \\therefore \\mathrm{d}_2=\\frac{500 \\times 0.05}{100}=0.25 \\mathrm{~cm}=2.5 \\mathrm{~mm}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261050279619d9d8a2928", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "Two condensers $C_1$ and $C_2$ in a circuit are joined as shown below.\nThe potential of point A is $V_1$ and that of B is $V_2$. The potential of point D will be\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/rvcEJ_tloP0RSa8aLGX8gGLiBPF6420m0IAtf72JRQg.original.fullsize.png\">", "image": null}, "options": [{"id": "IL7aU", "text": "$\\frac{C_1 V_2+C_2 V_1}{C_1+C_2}$", "image": null, "isCorrect": false}, {"id": "NkE8g", "text": "$\\frac{1}{2}\\left(V_1+V_2\\right)$", "image": null, "isCorrect": false}, {"id": "5zFSy", "text": "$\\frac{C_2 V_1-C_1 V_2}{C_1+C_2}$", "image": null, "isCorrect": false}, {"id": "oKXoP", "text": "$\\frac{C_2\\left(V_1+V_2\\right)}{C_1+C_2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$V_2-V_1$ will be divided between $C_1$ and $C_2$. Let $V_D$ be potential at point D.\nLet $\\mathrm{Q}$ be the charge on each capacitor. Then the potential drop can be written as:\n$\\begin{aligned} & V_2-V_1=V_2-V_D+V_D-V_1 \\\\ & \\Rightarrow V_2-V_1=\\frac{Q}{C_2}+\\frac{Q}{C_1} \\\\ & \\Rightarrow Q=\\frac{C_1 C_2\\left(V_2-V_1\\right)}{C_1+C_2}\\end{aligned}$\nPotential difference across $C_1$ is\n$V_D=V_1+\\frac{C_2\\left(V_2-V_1\\right)}{C_1+C_2}=\\frac{C_2\\left(V_1+V_2\\right)}{C_1+C_2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260910279619d9d8a2589", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "The plates of a parallel plate capacitor of capacity ' $\\mathrm{C}_1$ ' are moved closer together until they are half their original separation. The new capacitance ' $\\mathrm{C}_2$ ' is", "image": null}, "options": [{"id": "4jTq3", "text": "$\\mathrm{C}_2=\\frac{\\mathrm{C}_1}{2}$", "image": null, "isCorrect": false}, {"id": "lL0Nd", "text": "$\\mathrm{C}_2=\\mathrm{C}_1$", "image": null, "isCorrect": false}, {"id": "QxvGR", "text": "$\\mathrm{C}_2=2 \\mathrm{C}_1$", "image": null, "isCorrect": true}, {"id": "m20wP", "text": "$C_2=4 C_1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The capacitance of a parallel plate capacitor is given by\n$$\n\\mathrm{C}=\\frac{\\mathrm{kA} \\varepsilon_0}{\\mathrm{~d}}\n$$\nIf the distance between the plates $\\mathrm{d}$ is decreased to half, the capacitance will become double.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260120279619d9d8a2185", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}], "question": {"text": "The earth is assumed to be a charged conducting sphere having volume ' $\\mathrm{V}^{\\prime}$ and surface area 'A'. The capacitance of the earth in free space is $\\left(\\mathrm{E}_{0}=\\right.$ permittivity of free space $)$", "image": null}, "options": [{"id": "okiWu", "text": "$12 \\pi \\in_{0} \\frac{\\mathrm{V}}{\\mathrm{A}}$", "image": null, "isCorrect": true}, {"id": "ZQ7VS", "text": "$4 \\pi \\in_{0} \\frac{\\mathrm{V}}{\\mathrm{A}}$", "image": null, "isCorrect": false}, {"id": "Ye89J", "text": "$2 \\pi \\in_{0} \\frac{\\mathrm{V}}{\\mathrm{A}}$", "image": null, "isCorrect": false}, {"id": "ySy34", "text": "$8 \\pi \\in_{0} \\frac{\\mathrm{V}}{\\mathrm{A}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If we assume shape of earth be solid spherical.\nThen, the volume of earth $=4 / 3 \\pi \\mathrm{R}^{3}$\nwhere $R$ is radius of earth.\nGiven, volume of earth $=\\mathrm{V}=4 / 3 \\pi \\mathrm{R}^{3}$\nsurface area of earth $=\\mathrm{A}=4 \\pi \\mathrm{R}^{2}$\nSo, $V / A=\\left(4 / 3 R^{3}\\right) / 4 \\pi R^{2}$\nor $\\mathrm{V} / \\mathrm{A}=\\mathrm{R} / 3$\nor, $\\mathrm{R}=3 \\mathrm{~V} / \\mathrm{A}$\nNow, capacitance of earth $=4 \\pi \\in_{0} \\mathrm{R}$\n$=4 \\pi \\in_{0} \\frac{3 \\mathrm{V}}{\\mathrm{~A}}$\n$=\\frac{12 \\pi \\in_{0} \\mathrm{V}}{\\mathrm{~A}}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f8d0279619d9d8a1d64", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "A capacitor of unknown capacitance $\\mathrm{C}$ is connected across a battery of $\\mathrm{V}$ volt. The\ncharge stored in it becomes $Q$ coulomb. When potential across the capacitor is\nreduced by $\\mathrm{V}^{\\prime}$ volt, the charge stored in it becomes Q'coulomb. The capacitance C\nis", "image": null}, "options": [{"id": "xRpy3", "text": "$\\frac{\\mathrm{Q}-\\mathrm{Q}^{\\prime}}{\\sqrt{\\mathrm{V}^{\\prime}}}$", "image": null, "isCorrect": false}, {"id": "84ltm", "text": "$\\frac{\\mathrm{V}^{\\prime}}{\\mathrm{Q}-\\mathrm{Q}^{\\prime}}$", "image": null, "isCorrect": false}, {"id": "yDYE2", "text": "$\\frac{\\mathrm{Q}+\\mathrm{Q}^{\\prime}}{\\mathrm{V}^{\\prime}}$", "image": null, "isCorrect": false}, {"id": "8XZBx", "text": "$\\frac{\\mathrm{Q}-\\mathrm{Q}^{\\prime}}{\\mathrm{V}^{\\prime}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\mathrm{Q}=\\mathrm{CV}$\n$\\mathrm{Q}^{\\prime}=\\mathrm{C}\\left(\\mathrm{V}-\\mathrm{V}^{\\prime}\\right)=\\mathrm{CV}=\\mathrm{CV}^{\\prime}$\n$\\mathrm{Q}^{\\prime}=\\mathrm{Q}-\\mathrm{CV}^{\\prime}$\n$\\therefore \\mathrm{CV}^{\\prime}=\\mathrm{Q}-\\mathrm{Q}^{\\prime}$\n$\\mathrm{C}=\\frac{Q-Q^{\\prime}}{V^{\\prime}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ec00279619d9d8a16fc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f62", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "MHT CET 2017"}], "question": {"text": "A parallel plate air capacitor has capacity 'C' farad, potential 'V' volt and energy 'E' joule. When the gap between the plates is completely filled with dielectric", "image": null}, "options": [{"id": "TIJBf", "text": "Both V and E increase", "image": null, "isCorrect": false}, {"id": "sTgkb", "text": "Both V and E decrease", "image": null, "isCorrect": true}, {"id": "YKYqN", "text": "V decrease, E increase", "image": null, "isCorrect": false}, {"id": "7B4vb", "text": "V increase, E decrease", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Both V and E decrease", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f62", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "MHT CET 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e880279619d9d8a1532", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "If the distance between the plates of a parallel plate capacitor of capacity $10 \\mu \\mathrm{F}$ is doubled, then new capacity will be", "image": null}, "options": [{"id": "6jmXS", "text": "$5 \\mu \\mathrm{F}$", "image": null, "isCorrect": true}, {"id": "KrEoy", "text": "$20 \\mu \\mathrm{F}$", "image": null, "isCorrect": false}, {"id": "RavO4", "text": "$10 \\mu \\mathrm{F}$", "image": null, "isCorrect": false}, {"id": "OnmOg", "text": "$15 \\mu \\mathrm{F}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In parallel plate capacitor\n$$\nC=\\varepsilon_{0} \\frac{A}{d}\n$$\nNow\n$$\nd^{\\prime}=2 d\n$$\nHence,\n$$\nC^{\\prime}=\\frac{\\varepsilon_{0} A}{d^{\\prime}}=\\frac{\\varepsilon_{0} A}{2 d}\n$$\nFrom Eqs. (i) and (ii)\n$$\n\\begin{array}{l}\n\\frac{C^{\\prime}}{C}=\\frac{1}{2} \\\\\nC^{\\prime}=\\frac{C}{2}\n\\end{array}\n$$\nPutting $C=10 \\mu \\mathrm{F}$\n$$\nC^{\\prime}=\\frac{10}{2}=5 \\mu \\mathrm{F}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e750279619d9d8a149b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "In a parallel plate capacitor, the capacity increases if", "image": null}, "options": [{"id": "0Wwuy", "text": "area of the plate is decreased", "image": null, "isCorrect": false}, {"id": "fMHoF", "text": "distance between the plates increases", "image": null, "isCorrect": false}, {"id": "eclxK", "text": "area of the plate is increased", "image": null, "isCorrect": true}, {"id": "IrWIV", "text": "dielectric constant decrease", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In a parallel plate capacitor, the capacity of capacitor,\n$$\nC=\\frac{k \\varepsilon_{0} A}{d}\n$$\n$\\therefore$\n$C \\propto A$\nSo, the capacity of capacitor increase if area of the plate is increased.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a263280279619d9d8a3c83", "title": "Grouping of capacitors", "totalQuestions": 63, "questions": [{"_id": "6abb883e15a9fc0fc8c141d9", "type": "singleCorrect", "question": {"text": "Two parallel plate air capacitors of same capacity '$C$' are connected in series to a battery of emf '$E$'. Then one of the capacitors is completely filled with dielectric material of constant '$K$'. The change in the effective capacity of the series combination is", "image": null}, "options": [{"id": "MRryX", "label": "A", "text": "$\\dfrac{C}{2}\\left[\\dfrac{K-1}{K+1}\\right]^2$", "isCorrect": false, "image": null}, {"id": "hal3E", "label": "B", "text": "$\\dfrac{C}{2}\\left[\\dfrac{K+1}{K-1}\\right]^2$", "isCorrect": false, "image": null}, {"id": "h1phh", "label": "C", "text": "$\\dfrac{2}{C}\\left[\\dfrac{K-1}{K+1}\\right]$", "isCorrect": false, "image": null}, {"id": "ksKCi", "label": "D", "text": "$\\dfrac{C}{2}\\left[\\dfrac{K-1}{K+1}\\right]$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Initial effective capacity of two identical capacitors of capacity $C$ connected in series is given by:<br><br>$C_{i} = \\dfrac{C \\times C}{C + C} = \\dfrac{C}{2}$<br><br>When one of the capacitors is completely filled with a dielectric material of constant $K$, its new capacity becomes $KC$. The other capacitor remains unchanged with capacity $C$.<br><br>Final effective capacity of the series combination is:<br><br>$C_{f} = \\dfrac{KC \\times C}{KC + C} = \\dfrac{KC}{K+1}$<br><br>The change in the effective capacity of the series combination is:<br><br>$\\Delta C = C_{f} - C_{i}$<br><br>$\\Delta C = \\dfrac{KC}{K+1} - \\dfrac{C}{2}$<br><br>$\\Delta C = C \\left[ \\dfrac{K}{K+1} - \\dfrac{1}{2} \\right]$<br><br>$\\Delta C = C \\left[ \\dfrac{2K - (K+1)}{2(K+1)} \\right]$<br><br>$\\Delta C = \\dfrac{C}{2} \\left[ \\dfrac{K-1}{K+1} \\right]$<br><br>Answer: $\\dfrac{C}{2}\\left[\\dfrac{K-1}{K+1}\\right]$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884c15a9fc0fc8c14260", "type": "singleCorrect", "question": {"text": "Four capacitors each of $16$ $\\mu F$ are connected as shown. The capacitance between points $A$ and $B$ is (in $\\mu F$)<br><img style=\"width: 400px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/may/watermarked_images/15_may_shift_2__q18_d1.png\" />", "image": null}, "options": [{"id": "vfJ1S", "label": "A", "text": "$4$", "isCorrect": false, "image": null}, {"id": "ZepHQ", "label": "B", "text": "$16$", "isCorrect": false, "image": null}, {"id": "vtEee", "label": "C", "text": "$32$", "isCorrect": true, "image": null}, {"id": "pEFGL", "label": "D", "text": "$64$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the nodes between the capacitors from left to right be $N_1, N_2, N_3, N_4,$ and $N_5$.<br><br>The four capacitors are connected as follows:<br>$C_1$ is between $N_1$ and $N_2$<br>$C_2$ is between $N_2$ and $N_3$<br>$C_3$ is between $N_3$ and $N_4$<br>$C_4$ is between $N_4$ and $N_5$<br><br>From the given circuit diagram:<br>The top wire connects node $N_1$ and node $N_5$ to terminal B. Thus, $N_1$ and $N_5$ are at the same potential, $V_B$.<br>The bottom wire connects node $N_2$ and node $N_4$ to terminal A. Thus, $N_2$ and $N_4$ are at the same potential, $V_A$.<br>Node $N_3$ is isolated and only connected to $C_2$ and $C_3$.<br><br>Now let's analyze the potential difference across each capacitor:<br>For $C_1$: It is connected between $N_1$ ($V_B$) and $N_2$ ($V_A$). It contributes to the capacitance between A and B.<br>For $C_4$: It is connected between $N_4$ ($V_A$) and $N_5$ ($V_B$). It also contributes to the capacitance between A and B.<br>For $C_2$ and $C_3$: They are in series between $N_2$ and $N_4$. Since both $N_2$ and $N_4$ are connected to terminal A, they are at the same potential ($V_A$). The potential difference across the series combination of $C_2$ and $C_3$ is zero. Therefore, no charge is stored in them, and they are effectively short-circuited.<br><br>The equivalent circuit consists only of $C_1$ and $C_4$ connected in parallel between terminals A and B.<br><br>The equivalent capacitance $C_{AB}$ is:<br>$C_{AB} = C_1 + C_4$<br><br>Given that each capacitor has a capacitance of $16 \\mu F$:<br>$C_{AB} = 16 \\mu F + 16 \\mu F = 32 \\mu F$<br><br>Answer: $32$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886c15a9fc0fc8c14390", "type": "singleCorrect", "question": {"text": "A capacitor of $20\\ \\mu$F is charged up to $500$ V is connected in parallel with another capacitor of $10\\ \\mu$F which is charged up to $200$ V. Then, the common potential will be", "image": null}, "options": [{"id": "Vi3Bo", "label": "A", "text": "$400$ V", "isCorrect": true, "image": null}, {"id": "SUSPb", "label": "B", "text": "$200$ V", "isCorrect": false, "image": null}, {"id": "XE30M", "label": "C", "text": "$100$ V", "isCorrect": false, "image": null}, {"id": "j1xoe", "label": "D", "text": "$50$ V", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The common potential $V$ when two capacitors are connected in parallel is given by the ratio of total charge to total capacitance.<br><br>$V = \\dfrac{C_1 V_1 + C_2 V_2}{C_1 + C_2}$<br><br>Given $C_1 = 20 \\mu$F, $V_1 = 500$ V, $C_2 = 10 \\mu$F, and $V_2 = 200$ V.<br><br>Substituting the values:<br><br>$V = \\dfrac{20 \\times 500 + 10 \\times 200}{20 + 10}$<br><br>$V = \\dfrac{10000 + 2000}{30}$<br><br>$V = \\dfrac{12000}{30} = 400$ V<br><br>Answer: $400$ V", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88bd15a9fc0fc8c14688", "type": "singleCorrect", "question": {"text": "What will be the charge on any one of the $4\\,\\mu F$ capacitors and $2\\,\\mu F$ capacitor in $\\mu C$ ?<br><img style=\"width: 250px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/may/watermarked_images/12_may_shift_2__q32_d1.png\" />", "image": null}, "options": [{"id": "KH5Ts", "label": "A", "text": "$1, 1$", "isCorrect": false, "image": null}, {"id": "eJEC8", "label": "B", "text": "$2, 2$", "isCorrect": false, "image": null}, {"id": "Y5xuR", "label": "C", "text": "$3, 3$", "isCorrect": false, "image": null}, {"id": "rvi0x", "label": "D", "text": "$4, 4$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let the bottom-left junction be node A and the bottom-right junction be node B. <br><br>The battery of $2 \\text{ V}$ is connected across nodes A and B, so the potential difference between A and B is $2 \\text{ V}$. <br><br>The $2 \\, \\mu\\text{F}$ capacitor is connected directly across nodes A and B. <br><br>The potential difference across the $2 \\, \\mu\\text{F}$ capacitor is $2 \\text{ V}$. <br><br>The charge on the $2 \\, \\mu\\text{F}$ capacitor is $Q_2 = C \\times V = 2 \\, \\mu\\text{F} \\times 2 \\text{ V} = 4 \\, \\mu\\text{C}$. <br><br>The two $4 \\, \\mu\\text{F}$ capacitors are connected in series, and this entire branch is connected across nodes A and B. <br><br>The equivalent capacitance of this series combination is $C_{eq} = \\dfrac{4 \\times 4}{4 + 4} = 2 \\, \\mu\\text{F}$. <br><br>The potential difference across this series combination is $2 \\text{ V}$. <br><br>The total charge on this series branch is $Q_4 = C_{eq} \\times V = 2 \\, \\mu\\text{F} \\times 2 \\text{ V} = 4 \\, \\mu\\text{C}$. <br><br>Since they are in series, the charge on each $4 \\, \\mu\\text{F}$ capacitor is the same as the total charge of the branch, which is $4 \\, \\mu\\text{C}$. <br><br>Therefore, the charge on any one of the $4 \\, \\mu\\text{F}$ capacitors is $4 \\, \\mu\\text{C}$ and the charge on the $2 \\, \\mu\\text{F}$ capacitor is $4 \\, \\mu\\text{C}$.<br><br>Answer: $4, 4$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2fb8c30a4553e1bdee3", "type": "singleCorrect", "question": {"text": "A parallel plate capacitor of capacitance 'C' is connected to a battery and charged to a potential 'V'. Another capacitor of capacitance '$3C$' is charged to a potential '$3V$'. The charging battery is then disconnected and both the capacitors are connected in parallel to each other such that positive terminal of one is connected to negative terminal of the other. The final energy of the configuration is", "image": null}, "options": [{"id": "4HBKj", "label": "A", "text": "$1.5\\,CV^2$", "isCorrect": false, "image": null}, {"id": "n9eS0", "label": "B", "text": "$6.5\\,CV^2$", "isCorrect": false, "image": null}, {"id": "SS3Pe", "label": "C", "text": "$8.0\\,CV^2$", "isCorrect": true, "image": null}, {"id": "5p3z7", "label": "D", "text": "$18.0\\,CV^2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Initial charge on the first capacitor, $Q_1 = CV$<br><br>Initial charge on the second capacitor, $Q_2 = (3C)(3V) = 9CV$<br><br>When connected in parallel with opposite polarities, the net charge is $Q = Q_2 - Q_1 = 9CV - CV = 8CV$<br><br>Equivalent capacitance of the parallel combination is $C_{eq} = C + 3C = 4C$<br><br>Final energy of the configuration is given by $U = \\dfrac{Q^2}{2C_{eq}}$<br><br>Substituting the values, $U = \\dfrac{(8CV)^2}{2(4C)} = \\dfrac{64C^2V^2}{8C} = 8CV^2$<br><br>Answer: $8.0\\,CV^2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ec8c30a4553e1bde42", "type": "singleCorrect", "question": {"text": "Figure shows a network of five capacitors connected to a supply voltage 'V'. The equivalent capacitance and the energy stored in the network is respectively<br><img style=\"width: 250px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/17_april_shift_2__q32_d1.png\" />", "image": null}, "options": [{"id": "0l6XK", "label": "A", "text": "$4C$ , $2CV^2$", "isCorrect": true, "image": null}, {"id": "Vnfxi", "label": "B", "text": "$6C$ , $3CV^2$", "isCorrect": false, "image": null}, {"id": "L7BLn", "label": "C", "text": "$9C$ , $4CV^2$", "isCorrect": false, "image": null}, {"id": "OpaaE", "label": "D", "text": "$11C$ , $9CV^2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the positive terminal of the battery be connected to node A and the negative terminal to node C. Let the top wire be node B.<br><br>From the given circuit diagram, we can identify the connections of each capacitor:<br>The top $3C$ capacitor is connected between nodes A and B.<br>The vertical $3C$ capacitor is connected between nodes A and B.<br>The middle horizontal $2C$ capacitor is connected between nodes A and C.<br>The vertical $1C$ capacitor is connected between nodes B and C.<br>The rightmost vertical $2C$ capacitor is connected between nodes B and C.<br><br>The two $3C$ capacitors are in parallel. Their equivalent capacitance is:<br>$C_{AB} = 3C + 3C = 6C$<br><br>The $1C$ and $2C$ capacitors are in parallel. Their equivalent capacitance is:<br>$C_{BC} = 1C + 2C = 3C$<br><br>The equivalent capacitors $C_{AB}$ and $C_{BC}$ are in series. Their equivalent capacitance is:<br>$C_{series} = \\dfrac{C_{AB} \\times C_{BC}}{C_{AB} + C_{BC}} = \\dfrac{6C \\times 3C}{6C + 3C} = 2C$<br><br>This series combination is in parallel with the middle $2C$ capacitor. The total equivalent capacitance of the network is:<br>$C_{eq} = C_{series} + 2C = 2C + 2C = 4C$<br><br>The total energy stored in the network is given by:<br>$U = \\dfrac{1}{2} C_{eq} V^2 = \\dfrac{1}{2} (4C) V^2 = 2CV^2$<br><br>Answer: $4
