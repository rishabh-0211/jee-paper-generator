in/question-assets/mhtcet/mhtcet2025/tyULEcLV2Yp6elCj8MGzka7pQrgBWaJHZAl1-Z-_M8s.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "j9966", "text": "$6 \\mu \\mathrm{~F}$", "image": null, "isCorrect": true}, {"id": "ApKHk", "text": "$12 \\mu \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "T4LaU", "text": "$\\frac{8}{3} \\mu \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "htgzq", "text": "$3 \\mu \\mathrm{~F}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The initial capacitance of the air capacitor is given by:<br><br>$C_0 = \\dfrac{\\epsilon_0 A}{d} = 1 \\mu\\mathrm{F}$<br><br>From the given figure, the space between the plates is divided into two equal halves parallel to the area of the plates. This arrangement is equivalent to two capacitors connected in parallel, each having a plate area of $A/2$ and a plate separation of $d$.<br><br>The capacitance of the upper half filled with dielectric $K_1$ is:<br><br>$C_1 = \\dfrac{K_1 \\epsilon_0 (A/2)}{d} = \\dfrac{K_1}{2} \\left( \\dfrac{\\epsilon_0 A}{d} \\right) = \\dfrac{K_1}{2} C_0$<br><br>The capacitance of the lower half filled with dielectric $K_2$ is:<br><br>$C_2 = \\dfrac{K_2 \\epsilon_0 (A/2)}{d} = \\dfrac{K_2}{2} \\left( \\dfrac{\\epsilon_0 A}{d} \\right) = \\dfrac{K_2}{2} C_0$<br><br>Since the two capacitors are in parallel, the equivalent capacitance $C$ is the sum of their individual capacitances:<br><br>$C = C_1 + C_2$<br><br>$C = \\dfrac{K_1}{2} C_0 + \\dfrac{K_2}{2} C_0 = \\left( \\dfrac{K_1 + K_2}{2} \\right) C_0$<br><br>Substituting the given values $K_1 = 8$, $K_2 = 4$, and $C_0 = 1 \\mu\\mathrm{F}$:<br><br>$C = \\left( \\dfrac{8 + 4}{2} \\right) \\times 1 \\mu\\mathrm{F}$<br><br>$C = \\dfrac{12}{2} \\mu\\mathrm{F} = 6 \\mu\\mathrm{F}$<br><br>Answer: $6 \\mu \\mathrm{~F}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bdabf9280d7f9932d03", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The function of a dielectric in a capacitor is", "image": null}, "options": [{"id": "ODpBo", "text": "to reduce the effective potential on plates.", "image": null, "isCorrect": true}, {"id": "s3AKC", "text": "to increase the effective potential on plates.", "image": null, "isCorrect": false}, {"id": "psDfd", "text": "to decrease the capacity of capacitance.", "image": null, "isCorrect": false}, {"id": "6ju3N", "text": "to reduce the plate area of the capacitor.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When a dielectric material is introduced between the plates of a capacitor, it gets polarized due to the electric field between the plates.<br><br>This polarization produces an induced electric field in the direction opposite to the original electric field, which reduces the net electric field between the plates.<br><br>Since the potential difference is directly proportional to the electric field ($V = E d$), the effective potential difference between the plates is reduced.<br><br>As capacitance is given by $C = \\dfrac{Q}{V}$, a decrease in the potential difference results in an increase in the capacitance of the capacitor.<br><br>Therefore, the function of a dielectric in a capacitor is to reduce the effective potential on the plates.<br><br>Answer: to reduce the effective potential on plates.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bc8bf9280d7f9932c5b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The capacity of air filled parallel plate capacitor is $\\mathrm{C}_0$. One-half of the space between the plates is filled with a dielectric constant ' $K$ ' as shown in figure. The new capacity becomes $C_n$. The ratio $C_n$ to $C_0$ is\n\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/epf5HZ3tD2iFN-Xyw_ZFdk_xqSLWrB65MU3K8aliZ20.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "qB7QR", "text": "$\\left(\\frac{\\mathrm{K}+1}{2}\\right)$", "image": null, "isCorrect": true}, {"id": "tI8o0", "text": "$\\left(\\frac{\\mathrm{K}+1}{3}\\right)$", "image": null, "isCorrect": false}, {"id": "XuwaA", "text": "$\\left(\\frac{\\mathrm{K}+1}{4}\\right)$", "image": null, "isCorrect": false}, {"id": "bG3sa", "text": "4(K+1)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the area of the parallel plates be $A$ and the distance between them be $d$.<br>The initial capacitance of the air-filled capacitor is given by:<br>$C_0 = \\dfrac{\\varepsilon_0 A}{d}$<br><br>According to the given figure, the dielectric of constant $K$ fills one-half of the space between the plates such that it extends fully between the plates but only covers half of their area. This arrangement is equivalent to two capacitors connected in parallel:<br>1. A capacitor with dielectric $K$, having plate area $A/2$ and separation $d$.<br>2. A capacitor with air, having plate area $A/2$ and separation $d$.<br><br>The capacitance of the dielectric-filled part is:<br>$C_1 = \\dfrac{K \\varepsilon_0 (A/2)}{d} = \\dfrac{K}{2} \\left(\\dfrac{\\varepsilon_0 A}{d}\\right) = \\dfrac{K}{2} C_0$<br><br>The capacitance of the air-filled part is:<br>$C_2 = \\dfrac{\\varepsilon_0 (A/2)}{d} = \\dfrac{1}{2} \\left(\\dfrac{\\varepsilon_0 A}{d}\\right) = \\dfrac{1}{2} C_0$<br><br>Since these two parts are in parallel, the new equivalent capacitance $C_n$ is the sum of their individual capacitances:<br>$C_n = C_1 + C_2$<br>$C_n = \\dfrac{K}{2} C_0 + \\dfrac{1}{2} C_0 = C_0 \\left( \\dfrac{K+1}{2} \\right)$<br><br>The ratio of the new capacity to the initial capacity is:<br>$\\dfrac{C_n}{C_0} = \\dfrac{K+1}{2}$<br><br>Answer: $\\left(\\frac{\\mathrm{K}+1}{2}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b86bf9280d7f9932a0d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A parallel plate air capacitor has capacity ' $C$ ' and distance of separation between plates is ' d '. If a conducting sheet of thickness $\\frac{2 \\mathrm{~d}}{3}$ is inserted in between the plates, the capacitance becomes $C_1$. The ratio of $\\frac{C_1}{C}$ is", "image": null}, "options": [{"id": "WlcAM", "text": "$2: 1$", "image": null, "isCorrect": false}, {"id": "cwSwI", "text": "$4: 1$", "image": null, "isCorrect": false}, {"id": "dfFLz", "text": "$3: 1$", "image": null, "isCorrect": true}, {"id": "Ebcq2", "text": "$5: 1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The capacitance of a parallel plate air capacitor is given by $C = \\dfrac{\\varepsilon_0 A}{d}$.<br><br>When a conducting sheet of thickness $t$ is inserted between the plates, the new capacitance is $C_1 = \\dfrac{\\varepsilon_0 A}{d - t}$.<br><br>Given $t = \\dfrac{2d}{3}$, we have:<br><br>$C_1 = \\dfrac{\\varepsilon_0 A}{d - \\dfrac{2d}{3}} = \\dfrac{\\varepsilon_0 A}{\\dfrac{d}{3}} = 3 \\left( \\dfrac{\\varepsilon_0 A}{d} \\right)$<br><br>$C_1 = 3C$<br><br>The ratio $\\dfrac{C_1}{C} = \\dfrac{3}{1} = 3:1$.<br><br>Answer: $3: 1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b56bf9280d7f993285b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A parallel plate capacitor has plate area $50 \\mathrm{~cm}^2$ and plate separation 3 mm . The space between the plates is filled with a dielectric medium of thickness 1 mm and dielectric constant 4 . The capacitance becomes ( $\\epsilon_0=$ permittivity of free space)", "image": null}, "options": [{"id": "TiMTE", "text": "$\\frac{18 \\epsilon_0}{7}$", "image": null, "isCorrect": false}, {"id": "f7Fil", "text": "$\\frac{20 \\epsilon_0}{9}$", "image": null, "isCorrect": true}, {"id": "lyfOL", "text": "$\\frac{16 \\epsilon_0}{7}$", "image": null, "isCorrect": false}, {"id": "G7E39", "text": "$\\frac{14 \\epsilon_0}{5}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The capacitance of a parallel plate capacitor partially filled with a dielectric is given by:<br><br>$C = \\dfrac{\\epsilon_0 A}{d - t + \\dfrac{t}{K}}$<br><br>Given:<br>$A = 50 \\text{ cm}^2 = 50 \\times 10^{-4} \\text{ m}^2$<br>$d = 3 \\text{ mm} = 3 \\times 10^{-3} \\text{ m}$<br>$t = 1 \\text{ mm} = 1 \\times 10^{-3} \\text{ m}$<br>$K = 4$<br><br>Substituting the values:<br><br>$C = \\dfrac{\\epsilon_0 \\times 50 \\times 10^{-4}}{3 \\times 10^{-3} - 1 \\times 10^{-3} + \\dfrac{1 \\times 10^{-3}}{4}}$<br><br>$C = \\dfrac{\\epsilon_0 \\times 50 \\times 10^{-4}}{\\left(2 + \\dfrac{1}{4}\\right) \\times 10^{-3}}$<br><br>$C = \\dfrac{\\epsilon_0 \\times 50 \\times 10^{-4}}{\\dfrac{9}{4} \\times 10^{-3}}$<br><br>$C = \\dfrac{200 \\times 10^{-4}}{9 \\times 10^{-3}} \\epsilon_0$<br><br>$C = \\dfrac{20 \\epsilon_0}{9}$<br><br>Answer: $\\frac{20 \\epsilon_0}{9}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b35bf9280d7f9932719", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A parallel plate air capacitor has capacitance $C_p$. It is equally filled with parallel layers of materials of dielectric constants $\\mathrm{K}_1$ and $\\mathrm{K}_2$. Now its capacity becomes $C_K$. The ratio $C_P$ to $C_K$ is", "image": null}, "options": [{"id": "pIjCN", "text": "$\\mathrm{K}_1+\\mathrm{K}_2$", "image": null, "isCorrect": false}, {"id": "s7YHr", "text": "$\\frac{\\mathrm{K}_1+\\mathrm{K}_2}{\\mathrm{~K}_1 \\mathrm{~K}_2}$", "image": null, "isCorrect": false}, {"id": "GdEOY", "text": "$\\frac{K_1+K_2}{2 K_1 K_2}$", "image": null, "isCorrect": true}, {"id": "NhVqj", "text": "$\\frac{2 \\mathrm{~K}_1 \\mathrm{~K}_2}{\\mathrm{~K}_1+\\mathrm{K}_2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The initial capacitance of the parallel plate air capacitor is given by:<br><br>$C_P = \\dfrac{\\epsilon_0 A}{d}$<br><br>When the capacitor is equally filled with parallel layers of dielectric materials, the layers are parallel to the plates. This arrangement acts as two capacitors connected in series, each having the same area $A$ but half the thickness $\\dfrac{d}{2}$.<br><br>The capacitance of the first layer is:<br><br>$C_1 = \\dfrac{K_1 \\epsilon_0 A}{\\dfrac{d}{2}} = \\dfrac{2 K_1 \\epsilon_0 A}{d} = 2 K_1 C_P$<br><br>The capacitance of the second layer is:<br><br>$C_2 = \\dfrac{K_2 \\epsilon_0 A}{\\dfrac{d}{2}} = \\dfrac{2 K_2 \\epsilon_0 A}{d} = 2 K_2 C_P$<br><br>The equivalent capacitance $C_K$ for the series combination is given by:<br><br>$\\dfrac{1}{C_K} = \\dfrac{1}{C_1} + \\dfrac{1}{C_2}$<br><br>$\\dfrac{1}{C_K} = \\dfrac{1}{2 K_1 C_P} + \\dfrac{1}{2 K_2 C_P}$<br><br>$\\dfrac{1}{C_K} = \\dfrac{K_1 + K_2}{2 K_1 K_2 C_P}$<br><br>Rearranging to find the ratio $\\dfrac{C_P}{C_K}$:<br><br>$\\dfrac{C_P}{C_K} = \\dfrac{K_1 + K_2}{2 K_1 K_2}$<br><br>Answer: $\\frac{K_1+K_2}{2 K_1 K_2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b10bf9280d7f99325f8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Two parallel plate air capacitors of same capacity 'C' are connected in parallel to a battery of e.m.f. ' $E$ '. Then one of the capacitors is completely filled with dielectric material of constant ' $K$ '. The change in the effective capacity of the parallel combination is", "image": null}, "options": [{"id": "4TAKs", "text": "$\\frac{\\mathrm{C}}{(\\mathrm{K}-1)}$", "image": null, "isCorrect": false}, {"id": "85Vsb", "text": "$\\frac{\\mathrm{KC}}{\\mathrm{K}-1}$", "image": null, "isCorrect": false}, {"id": "TFwlu", "text": "$\\mathrm{KC}+1$", "image": null, "isCorrect": false}, {"id": "Vi3FS", "text": "$\\mathrm{C}(\\mathrm{K}-1)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Initial effective capacity of the parallel combination of two identical capacitors is $C_i = C + C = 2C$.<br><br>When one of the capacitors is completely filled with a dielectric material of constant $K$, its new capacity becomes $KC$.<br><br>The final effective capacity of the parallel combination is $C_f = KC + C = C(K + 1)$.<br><br>The change in the effective capacity is $\\Delta C = C_f - C_i$.<br><br>Substituting the values, we get $\\Delta C = C(K + 1) - 2C = CK + C - 2C = C(K - 1)$.<br><br>Answer: $\\mathrm{C}(\\mathrm{K}-1)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871afbbf9280d7f993254f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The plates of a parallel plate capacitor are separated by a distance 'd' with air as the medium between them. A dielectric slab of dielectric constant 3 is introduced between the plates so as to increase the capacity by $50 \\%$. The thickness of the dielectric slab is", "image": null}, "options": [{"id": "pd7SG", "text": "$\\frac{d}{2}$", "image": null, "isCorrect": true}, {"id": "Md6oJ", "text": "$\\frac{d}{3}$", "image": null, "isCorrect": false}, {"id": "uxorS", "text": "$\\frac{\\mathrm{d}}{5}$", "image": null, "isCorrect": false}, {"id": "kPK5F", "text": "$\\frac{5 d}{6}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The initial capacitance of the parallel plate capacitor with air as the medium is given by:<br><br>$C_0 = \\dfrac{\\varepsilon_0 A}{d}$<br><br>When a dielectric slab of thickness $t$ and dielectric constant $K$ is introduced between the plates, the new capacitance becomes:<br><br>$C = \\dfrac{\\varepsilon_0 A}{d - t + \\dfrac{t}{K}}$<br><br>Given that the capacity increases by $50\\%$, the new capacitance is:<br><br>$C = C_0 + 0.5 C_0 = \\dfrac{3}{2} C_0$<br><br>Substituting the expressions for $C$ and $C_0$:<br><br>$\\dfrac{\\varepsilon_0 A}{d - t + \\dfrac{t}{K}} = \\dfrac{3}{2} \\left( \\dfrac{\\varepsilon_0 A}{d} \\right)$<br><br>$\\dfrac{1}{d - t + \\dfrac{t}{3}} = \\dfrac{3}{2d}$<br><br>$2d = 3 \\left( d - t + \\dfrac{t}{3} \\right)$<br><br>$2d = 3 \\left( d - \\dfrac{2t}{3} \\right)$<br><br>$2d = 3d - 2t$<br><br>$2t = d$<br><br>$t = \\dfrac{d}{2}$<br><br>Answer: $\\frac{d}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214440aee93fa0796df48", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "Air capacitor has capacitance ' $\\mathrm{C}_1$ '. The space between two plates of capacitor is filled with two dielectrics as shown in figure. The new capacitance of the capacitor is ' $\\mathrm{C}_2$ '. The ratio $\\frac{\\mathrm{C}_1}{\\mathrm{C}_2}$ is $(\\mathrm{d}=$ distance between two plates of capacitor, $K_1$ and $K_2$ are dielectric constants of two dielectrics respectively)\r\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/8Y625jL2JqaVFZR0WAOu5yUhTWU5sFNqUlvg0KAN-as.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "dR56v", "text": "$\\mathrm{K}_1+\\mathrm{K}_2$", "image": null, "isCorrect": false}, {"id": "hXCsH", "text": "$\\frac{\\mathrm{K}_1+\\mathrm{K}_2}{\\mathrm{~K}_1-\\mathrm{K}_2}$", "image": null, "isCorrect": false}, {"id": "7G7Yy", "text": "$\\frac{2 \\mathrm{~K}_1 \\mathrm{~K}_2}{\\mathrm{~K}_1+\\mathrm{K}_2}$", "image": null, "isCorrect": false}, {"id": "IBzxK", "text": "$\\frac{\\mathrm{K}_1+\\mathrm{K}_2}{2 \\mathrm{~K}_1 \\mathrm{~K}_2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The initial capacitance of the air capacitor is given by:<br><br>$C_1 = \\dfrac{\\epsilon_0 A}{d}$<br><br>where $A$ is the area of the plates and $d$ is the distance between them.<br><br>From the given figure, the space between the plates is filled with two dielectrics of dielectric constants $K_1$ and $K_2$, each occupying half the distance between the plates (i.e., $d/2$). This arrangement is equivalent to two capacitors connected in series.<br><br>The capacitance of the first part is:<br><br>$C'_1 = \\dfrac{K_1 \\epsilon_0 A}{d/2} = \\dfrac{2 K_1 \\epsilon_0 A}{d} = 2 K_1 C_1$<br><br>The capacitance of the second part is:<br><br>$C'_2 = \\dfrac{K_2 \\epsilon_0 A}{d/2} = \\dfrac{2 K_2 \\epsilon_0 A}{d} = 2 K_2 C_1$<br><br>The equivalent capacitance $C_2$ of these two capacitors in series is:<br><br>$\\dfrac{1}{C_2} = \\dfrac{1}{C'_1} + \\dfrac{1}{C'_2}$<br><br>$\\dfrac{1}{C_2} = \\dfrac{1}{2 K_1 C_1} + \\dfrac{1}{2 K_2 C_1}$<br><br>$\\dfrac{1}{C_2} = \\dfrac{1}{2 C_1} \\left( \\dfrac{1}{K_1} + \\dfrac{1}{K_2} \\right)$<br><br>$\\dfrac{1}{C_2} = \\dfrac{K_1 + K_2}{2 K_1 K_2 C_1}$<br><br>Rearranging to find the ratio $\\dfrac{C_1}{C_2}$:<br><br>$\\dfrac{C_1}{C_2} = \\dfrac{K_1 + K_2}{2 K_1 K_2}$<br><br>Answer: $\\frac{\\mathrm{K}_1+\\mathrm{K}_2}{2 \\mathrm{~K}_1 \\mathrm{~K}_2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792142f0aee93fa0796dea5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "When the dielectric is placed in an external electric field, the electric field inside the dielectric is", "image": null}, "options": [{"id": "1BKQ4", "text": "less than the external electric field.", "image": null, "isCorrect": true}, {"id": "qrSZf", "text": "larger than the external electric field.", "image": null, "isCorrect": false}, {"id": "5jxgF", "text": "equal to the external electric field.", "image": null, "isCorrect": false}, {"id": "48Fwn", "text": "equal to or greater than external electric field.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When a dielectric material is placed in an external electric field $\\vec{E}_{0}$, the molecules of the dielectric get polarized.<br><br>This polarization creates an induced electric field $\\vec{E}_{p}$ inside the dielectric, which is directed opposite to the external electric field.<br><br>The net electric field inside the dielectric is given by $\\vec{E} = \\vec{E}_{0} - \\vec{E}_{p}$.<br><br>Since the induced field opposes the external field, the magnitude of the net electric field inside the dielectric is less than the magnitude of the external electric field.<br><br>Answer: less than the external electric field.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792142b0aee93fa0796de87", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "Two identical capacitors A and B are connected in series to a battery of E.M.F., 'E'. Capacitor B contains a slab of dielectric constant $\\mathrm{K} . \\mathrm{Q}_{\\mathrm{A}}$ and $\\mathrm{Q}_{\\mathrm{B}}$ are the charges stored in A and B . When the dielectric slab is removed, the corresponding charges are $\\mathrm{Q}_{\\mathrm{A}}^{\\prime}$ and $\\mathrm{Q}_{\\mathrm{B}}$. Then", "image": null}, "options": [{"id": "kgerZ", "text": "$\\frac{Q_A^{\\prime}}{Q_A}=\\frac{K}{2}$", "image": null, "isCorrect": false}, {"id": "eJPUk", "text": "$\\frac{\\mathrm{Q}_{\\mathrm{B}}^{\\prime}}{\\mathrm{Q}_{\\mathrm{B}}}=\\frac{\\mathrm{K}+1}{2}$", "image": null, "isCorrect": false}, {"id": "DaDWj", "text": "$\\frac{Q_A^{\\prime}}{Q_A}=\\frac{K+1}{K}$", "image": null, "isCorrect": false}, {"id": "aAyPX", "text": "$\\quad \\frac{\\mathrm{Q}_{\\mathrm{B}}^{\\prime}}{\\mathrm{Q}_{\\mathrm{B}}}=\\frac{\\mathrm{K}+1}{2 \\mathrm{~K}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let the capacitance of capacitor A without dielectric be $C$.<br><br>Initially, capacitor B has a dielectric of constant $K$, so its capacitance is $KC$.<br><br>Since A and B are in series, the equivalent capacitance is $C_{eq} = \\dfrac{C \\times KC}{C + KC} = \\dfrac{KC}{K+1}$.<br><br>The charge on each capacitor in series is the same, so $Q_A = Q_B = C_{eq} E = \\dfrac{KCE}{K+1}$.<br><br>When the dielectric slab is removed from B, its capacitance becomes $C$.<br><br>The new equivalent capacitance is $C_{eq}^{\\prime} = \\dfrac{C \\times C}{C + C} = \\dfrac{C}{2}$.<br><br>The new charge on each capacitor is $Q_A^{\\prime} = Q_B^{\\prime} = C_{eq}^{\\prime} E = \\dfrac{CE}{2}$.<br><br>Taking the ratio of the new charge to the old charge for capacitor B:<br><br>$\\dfrac{Q_B^{\\prime}}{Q_B} = \\dfrac{\\dfrac{CE}{2}}{\\dfrac{KCE}{K+1}} = \\dfrac{K+1}{2K}$.<br><br>Answer: $\\quad \\frac{\\mathrm{Q}_{\\mathrm{B}}^{\\prime}}{\\mathrm{Q}_{\\mathrm{B}}}=\\frac{\\mathrm{K}+1}{2 \\mathrm{~K}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e30aee93fa0796dc4f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "Two parallel plate air capacitors of same capacity ' C ' are connected in series to a battery of emf ' $E$ '. Then one of the capacitors is completely filled with dielectric material of constant ' $K$ '. The change in the effective capacity of the series combination is", "image": null}, "options": [{"id": "IRGXl", "text": "$\\frac{\\mathrm{C}}{2}\\left[\\frac{\\mathrm{~K}+1}{\\mathrm{~K}-1}\\right]$", "image": null, "isCorrect": false}, {"id": "QRJOm", "text": "$\\frac{2}{\\mathrm{C}}\\left[\\frac{\\mathrm{K}-1}{\\mathrm{~K}+1}\\right]$", "image": null, "isCorrect": false}, {"id": "b9d9A", "text": "$\\frac{\\mathrm{C}}{2}\\left[\\frac{\\mathrm{~K}-1}{\\mathrm{~K}+1}\\right]$", "image": null, "isCorrect": true}, {"id": "Jv4pz", "text": "$\\frac{\\mathrm{C}}{2}\\left[\\frac{\\mathrm{~K}-1}{\\mathrm{~K}+1}\\right]^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Initial effective capacity of two capacitors in series is $C_1 = \\dfrac{C \\times C}{C + C} = \\dfrac{C}{2}$.<br><br>When one capacitor is filled with a dielectric of constant $K$, its new capacity becomes $KC$.<br><br>The new effective capacity of the series combination is $C_2 = \\dfrac{C \\times KC}{C + KC} = \\dfrac{KC}{K+1}$.<br><br>The change in effective capacity is $\\Delta C = C_2 - C_1 = \\dfrac{KC}{K+1} - \\dfrac{C}{2}$.<br><br>$\\Delta C = C \\left[ \\dfrac{K}{K+1} - \\dfrac{1}{2} \\right] = C \\left[ \\dfrac{2K - (K+1)}{2(K+1)} \\right] = \\dfrac{C}{2} \\left[ \\dfrac{K-1}{K+1} \\right]$.<br><br>Answer: $\\frac{\\mathrm{C}}{2}\\left[\\frac{\\mathrm{~K}-1}{\\mathrm{~K}+1}\\right]$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213aa0aee93fa0796da93", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "Air capacitor has capacitance of $1 \\mu \\mathrm{~F}$. Now the space between two plates of capacitor is filled with two dielectrics as shown in figure. The capacitance of the capacitor is [ $\\mathrm{d}=$ distance between two plates of capacitor, $\\mathrm{K}_1$ and $\\cdot \\mathrm{K}_2$ are dielectric constants of first dielectric and second dielectric respectively]\r\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/9CKOJl-M19pUvQl7ZsJh35l7hY8_b61e0UHKGYiE3HY.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "iMmgf", "text": "$3 \\mu \\mathrm{~F}$", "image": null, "isCorrect": true}, {"id": "WPuL9", "text": "$6 \\mu \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "1Gyf3", "text": "$8 \\mu \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "KVe47", "text": "$12 \\mu \\mathrm{~F}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The initial capacitance of the air capacitor is given by:<br><br>$C_0 = \\dfrac{\\epsilon_0 A}{d} = 1 \\mu\\mathrm{F}$<br><br>From the given figure, the space between the plates is divided into two equal halves parallel to the plates. This arrangement can be considered as two capacitors connected in parallel.<br><br>Each capacitor has a plate area of $A/2$ and a plate separation of $d$.<br><br>The capacitance of the upper half with dielectric $K_1$ is:<br><br>$C_1 = \\dfrac{K_1 \\epsilon_0 (A/2)}{d} = \\dfrac{K_1}{2} \\left(\\dfrac{\\epsilon_0 A}{d}\\right) = \\dfrac{K_1}{2} C_0$<br><br>The capacitance of the lower half with dielectric $K_2$ is:<br><br>$C_2 = \\dfrac{K_2 \\epsilon_0 (A/2)}{d} = \\dfrac{K_2}{2} \\left(\\dfrac{\\epsilon_0 A}{d}\\right) = \\dfrac{K_2}{2} C_0$<br><br>Since the two capacitors are in parallel, the equivalent capacitance $C_{eq}$ is:<br><br>$C_{eq} = C_1 + C_2 = \\dfrac{K_1}{2} C_0 + \\dfrac{K_2}{2} C_0 = \\left(\\dfrac{K_1 + K_2}{2}\\right) C_0$<br><br>Substituting the given values $K_1 = 4$, $K_2 = 2$, and $C_0 = 1 \\mu\\mathrm{F}$:<br><br>$C_{eq} = \\left(\\dfrac{4 + 2}{2}\\right) \\times 1 \\mu\\mathrm{F} = \\dfrac{6}{2} \\mu\\mathrm{F} = 3 \\mu\\mathrm{F}$<br><br>Answer: $3 \\mu \\mathrm{~F}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213930aee93fa0796d9dd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "The function of dielectric in a capacitor is", "image": null}, "options": [{"id": "Sr1it", "text": "to reduce the effective potential on plates.", "image": null, "isCorrect": true}, {"id": "P77cB", "text": "to increase the effective potential on plates.", "image": null, "isCorrect": false}, {"id": "S3yyc", "text": "to decrease the capacitance.", "image": null, "isCorrect": false}, {"id": "NpgmR", "text": "to reduce the plate area of capacitor.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When a dielectric material is placed between the plates of a capacitor, it gets polarized due to the applied electric field. This polarization creates an internal electric field that opposes the external electric field.<br><br>As a result, the net electric field between the plates decreases. Since the potential difference is given by $V = E \\times d$, the effective potential difference between the plates is reduced for a given charge.<br><br>This reduction in potential difference leads to an increase in the capacitance of the capacitor, as $C = \\dfrac{Q}{V}$.<br><br>Answer: to reduce the effective potential on plates.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213710aee93fa0796d8cf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "A parallel plate capacitor has plate area $40 \\mathrm{~cm}^2$ and plate separation 2 mm . The space between the plates is filled with a dielectric medium of thickness 1 mm and dielectric constant 5 . The capacitance of the system is ( $\\varepsilon_0=$ permittivity of vacuum)", "image": null}, "options": [{"id": "BdV29", "text": "$24 \\varepsilon_0 \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "FeGmA", "text": "$\\dfrac{3}{10} \\varepsilon_0 \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "omO2e", "text": "$\\dfrac{10}{3} \\varepsilon_0 \\mathrm{~F}$", "image": null, "isCorrect": true}, {"id": "9efGr", "text": "$10 \\varepsilon_0 \\mathrm{~F}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given:<br>Plate area $A = 40 \\mathrm{~cm}^2 = 40 \\times 10^{-4} \\mathrm{~m}^2 = 4 \\times 10^{-3} \\mathrm{~m}^2$<br>Plate separation $d = 2 \\mathrm{~mm} = 2 \\times 10^{-3} \\mathrm{~m}$<br>Dielectric thickness $t = 1 \\mathrm{~mm} = 1 \\times 10^{-3} \\mathrm{~m}$<br>Dielectric constant $K = 5$<br><br>The capacitance of a parallel plate capacitor partially filled with a dielectric slab is given by:<br>$C = \\dfrac{\\varepsilon_0 A}{d - t + \\dfrac{t}{K}}$<br><br>Substituting the given values:<br>$C = \\dfrac{\\varepsilon_0 \\times 4 \\times 10^{-3}}{2 \\times 10^{-3} - 1 \\times 10^{-3} + \\dfrac{1 \\times 10^{-3}}{5}}$<br><br>$C = \\dfrac{4 \\varepsilon_0 \\times 10^{-3}}{\\left(1 + \\dfrac{1}{5}\\right) \\times 10^{-3}}$<br><br>$C = \\dfrac{4 \\varepsilon_0}{\\dfrac{6}{5}}$<br><br>$C = \\dfrac{20}{6} \\varepsilon_0 = \\dfrac{10}{3} \\varepsilon_0 \\mathrm{~F}$<br><br>Answer: $\\dfrac{10}{3} \\varepsilon_0 \\mathrm{~F}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792136c0aee93fa0796d8aa", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "A parallel plate air capacitor, with plate separation ' d ' has a capacitance of 9 pF . The space between the plates is now filled with two dielectrics, the first having $\\mathrm{K}_1=3$ and thickness $\\mathrm{d}_1=\\mathrm{d} / 3$, while the $2^{\\text {nd }}$ has $\\mathrm{K}_2=6$ and thickness $\\mathrm{d}_2=2 \\mathrm{~d} / 3$. The capacitance of the new capacitor is", "image": null}, "options": [{"id": "KUYYX", "text": "3.8 pF", "image": null, "isCorrect": false}, {"id": "eR3bC", "text": "20.25 pF", "image": null, "isCorrect": false}, {"id": "hNHeN", "text": "40.5 pF", "image": null, "isCorrect": true}, {"id": "pgtNl", "text": "45 pF", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The initial capacitance of the parallel plate air capacitor is given by:<br><br>$C_0 = \\dfrac{\\varepsilon_0 A}{d} = 9 \\text{ pF}$<br><br>When the space is filled with two dielectrics of thicknesses $d_1$ and $d_2$, it can be considered as two capacitors connected in series.<br><br>The capacitance of the first part is:<br><br>$C_1 = \\dfrac{K_1 \\varepsilon_0 A}{d_1} = \\dfrac{3 \\varepsilon_0 A}{d/3} = \\dfrac{9 \\varepsilon_0 A}{d} = 9 C_0$<br><br>The capacitance of the second part is:<br><br>$C_2 = \\dfrac{K_2 \\varepsilon_0 A}{d_2} = \\dfrac{6 \\varepsilon_0 A}{2d/3} = \\dfrac{9 \\varepsilon_0 A}{d} = 9 C_0$<br><br>The equivalent capacitance $C$ of the series combination is given by:<br><br>$\\dfrac{1}{C} = \\dfrac{1}{C_1} + \\dfrac{1}{C_2}$<br><br>$\\dfrac{1}{C} = \\dfrac{1}{9 C_0} + \\dfrac{1}{9 C_0} = \\dfrac{2}{9 C_0}$<br><br>$C = \\dfrac{9 C_0}{2}$<br><br>Substituting the value of $C_0 = 9 \\text{ pF}$:<br><br>$C = \\dfrac{9 \\times 9}{2} = \\dfrac{81}{2} = 40.5 \\text{ pF}$<br><br>Answer: 40.5 pF", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262780279619d9d8a34c8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "A parallel plate capacitor with air medium between the plates has a capacitance of $10 \\mu \\mathrm{F}$. The area of capacitor is divided into two equal halves and filled with two media (as shown in figure) having dielectric constant $K_1=2$ and $\\mathrm{K}_2=4$. The capacitance of the system will be\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/iSPjA5VJu4Q_7u4M3B-LQYxatdoGsOQz6v5LQE7w6Fc.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "2LFQb", "text": "$10 \\mu \\mathrm{F}$", "image": null, "isCorrect": false}, {"id": "jr0iI", "text": "$20 \\mu \\mathrm{F}$", "image": null, "isCorrect": false}, {"id": "7XOKw", "text": "$30 \\mu \\mathrm{F}$", "image": null, "isCorrect": true}, {"id": "3K7h4", "text": "$40 \\mu \\mathrm{F}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{C}=\\frac{\\varepsilon_0 \\mathrm{~A}}{\\mathrm{~d}}=10 \\mu \\mathrm{F}$\nAfter dividing the area into two equal halves, the resultant capacitance is calculated as,\n$\\begin{aligned}\n\\mathrm{C}_{\\text {eq }} & =\\mathrm{C}_1+\\mathrm{C}_2 \\\\\n& =\\frac{\\mathrm{K}_1 \\varepsilon_0 \\mathrm{~A}_1}{\\mathrm{~d}}+\\frac{\\mathrm{K}_1 \\varepsilon_0 \\mathrm{~A}_1}{\\mathrm{~d}}=\\frac{\\frac{2 \\varepsilon_0 \\mathrm{~A}}{2}}{\\mathrm{~d}}+\\frac{\\frac{4 \\varepsilon_0 \\mathrm{~A}}{2}}{\\mathrm{~d}} \\\\\n\\therefore \\quad \\mathrm{C}_{\\text {eq }} & =\\frac{\\varepsilon_0 \\mathrm{~A}}{\\mathrm{~d}}+\\frac{2 \\varepsilon_0 \\mathrm{~A}}{\\mathrm{~d}}=\\frac{3 \\varepsilon_0 \\mathrm{~A}}{\\mathrm{~d}}=3 \\times 10=30 \\mu \\mathrm{F}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262520279619d9d8a3394", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "In a parallel plate capacitor with air between the plates, the distance ' $\\mathrm{d}$ ' between the plates is changed and the space is filled with dielectric constant 8 . The capacity of the capacitor is increased 16 times, the distance between the plates is", "image": null}, "options": [{"id": "vemUo", "text": "$2 \\mathrm{~d}$", "image": null, "isCorrect": false}, {"id": "6TcS2", "text": "$4 \\mathrm{~d}$", "image": null, "isCorrect": false}, {"id": "o76ZG", "text": "$\\frac{\\mathrm{d}}{2}$", "image": null, "isCorrect": true}, {"id": "2Vbx8", "text": "$\\frac{\\mathrm{d}}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{C}_1=\\frac{\\mathrm{A} \\varepsilon_0}{\\mathrm{~d}}$                                                                                           ...(i)\n$\\mathrm{C}_2=\\frac{8 \\mathrm{~A} \\varepsilon_0}{\\mathrm{~d}^{\\prime}} \\Rightarrow 16 \\mathrm{C}_1=\\frac{8 \\mathrm{~A} \\varepsilon_0}{\\mathrm{~d}^{\\prime}}$       \n                                                                                                   ...(iii)\n where $\\mathrm{d}^{\\prime}$ the unknown separation.\nDividing (i) by (ii)\n$\\frac{C_1}{16 C_1}=\\frac{A \\varepsilon_0}{d} \\times \\frac{d^{\\prime}}{A \\varepsilon_0}$\n$\\frac{8 \\mathrm{~d}}{16}=\\mathrm{d}^{\\prime}$\n$\\therefore \\quad \\mathrm{d}^{\\prime}=\\frac{\\mathrm{d}}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2620c0279619d9d8a315f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "A parallel plate capacitor is charged by a battery and battery remains connected. The dielectric slab of constant ' $\\mathrm{K}$ ' is inserted between the plates and then taken out. Then electric field between the plates", "image": null}, "options": [{"id": "lfPvh", "text": "remains the same", "image": null, "isCorrect": true}, {"id": "267Ci", "text": "increases", "image": null, "isCorrect": false}, {"id": "2XEcU", "text": "decreases", "image": null, "isCorrect": false}, {"id": "6w0iM", "text": "becomes zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Std.12|Ch-8| Subtopic-8.10", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261e30279619d9d8a3021", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "Two dielectric slabs having dielectric constant ' $\\mathrm{K}_1$ ' and ' $\\mathrm{K}_2$ ' of thickness ' $\\frac{\\mathrm{d}}{4}$ and $\\frac{3 \\mathrm{~d}}{4}$ are inserted between the plates as shown in figure. The net capacitance between $A$ and $B$ is $\\left[\\varepsilon_0\\right.$ is permittivity of free space]\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/CL6MKocVaQ48Y9bGIFcPY7BDW8rapMysgkXvEwLugNc.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "3TAv4", "text": "$\\frac{2 \\mathrm{~A} \\varepsilon_0}{\\mathrm{~d}}\\left[\\frac{\\mathrm{K}_1 \\mathrm{~K}_2}{3 \\mathrm{~K}_1+\\mathrm{K}_2}\\right]$", "image": null, "isCorrect": false}, {"id": "81FTj", "text": "$\\frac{3 \\mathrm{~A} \\varepsilon_0}{\\mathrm{~d}}\\left[\\frac{\\mathrm{K}_1+\\mathrm{K}_2}{\\mathrm{~K}_1 \\mathrm{~K}_2}\\right]$", "image": null, "isCorrect": false}, {"id": "haRnw", "text": "$\\frac{3 \\mathrm{A}\\varepsilon_0}{2 \\mathrm{~d}}\\left[\\frac{\\mathrm{K}_1+\\mathrm{K}_2}{\\mathrm{~K}_1 \\mathrm{~K}_2}\\right]$", "image": null, "isCorrect": false}, {"id": "bFzzF", "text": "$\\frac{4 A \\varepsilon_0}{d}\\left[\\frac{K_1 K_2}{3 K_1+K_2}\\right]$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Capacity of $1^{\\text {st }}$ Capacitor,\n$C_1=\\frac{K_1 \\varepsilon_0 A}{d / 4}=\\frac{4 K_1 \\varepsilon_0 A}{d}$\nCapacity of $2^{\\text {nd }}$ Capacitor,\n$\\mathrm{C}_2=\\frac{\\mathrm{K}_2 \\varepsilon_0 \\mathrm{~A}}{3 \\mathrm{~d} / 4}=\\frac{4 \\mathrm{~K}_2 \\varepsilon_0 \\mathrm{~A}}{3 \\mathrm{~d}}$\nEquivalent capacitance $\\frac{1}{\\mathrm{C}}=\\frac{1}{\\mathrm{C}_1}+\\frac{1}{\\mathrm{C}_2}$\n$\\begin{aligned}\n\\frac{1}{\\mathrm{C}_1} & =\\frac{\\mathrm{d}}{4 \\mathrm{~K}_1 \\varepsilon_0 \\mathrm{~A}} ; \\frac{1}{\\mathrm{C}_2}=\\frac{3 \\mathrm{~d}}{4 \\mathrm{~K}_2 \\varepsilon_0 \\mathrm{~A}} \\\\\n\\frac{1}{\\mathrm{C}} & =\\frac{\\mathrm{d}}{4 \\mathrm{~K}_1 \\varepsilon_0 \\mathrm{~A}}+\\frac{3 \\mathrm{~d}}{4 \\mathrm{~K}_2 \\varepsilon_0 \\mathrm{~A}} \\\\\n\\frac{1}{\\mathrm{C}} & =\\frac{\\mathrm{d}}{4 \\varepsilon_0 \\mathrm{~A}}\\left[\\frac{1}{\\mathrm{~K}_1}+\\frac{3}{\\mathrm{~K}_2}\\right] \\\\\n\\frac{1}{\\mathrm{C}} & =\\frac{\\mathrm{d}}{4 \\varepsilon_0 \\mathrm{~A}}\\left[\\frac{\\mathrm{K}_2+3 \\mathrm{~K}_1}{\\mathrm{~K}_1 \\mathrm{~K}_2}\\right] \\\\\n\\therefore \\quad \\mathrm{C} & =\\frac{4 \\varepsilon_0 \\mathrm{~A}}{\\mathrm{~d}}\\left[\\frac{\\mathrm{K}_1 \\mathrm{~K}_2}{3 \\mathrm{~K}_1+\\mathrm{K}_2}\\right]\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261ad0279619d9d8a2e71", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "The potential energy of charged parallel plate capacitor is $v_0$. If a slab of dielectric constant $\\mathrm{K}$ is inserted between the plates, then the new potential energy will be", "image": null}, "options": [{"id": "7mbvt", "text": "$\\frac{v_0}{K}$", "image": null, "isCorrect": true}, {"id": "9wrr8", "text": "${v_0}{K^2}$", "image": null, "isCorrect": false}, {"id": "bntE7", "text": "$\\frac{v_0}{K^2}$", "image": null, "isCorrect": false}, {"id": "HbMA5", "text": "${v_0}^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We know, $v_0=\\frac{Q^2}{2 C}$\nOn inserting the slab of dielectric constant $\\mathrm{k}$, the new capacitance $\\mathrm{C}^{\\prime}=\\mathrm{KC}$\n$\\therefore \\quad$ New potential energy $v_0^{\\prime}=\\frac{\\mathrm{Q}^2}{2 \\mathrm{C}^{\\prime}}$\n$v_0^1=\\frac{Q^2}{2 \\mathrm{KC}}=\\frac{v_0}{\\mathrm{~K}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261950279619d9d8a2dbb", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "In a parallel plate air capacitor of plate separation $d$, a dielectric slab of thickness $t$ is introduced between the plates $(t < d)$. The capacitance becomes one-third of the original value. The dielectric constant of the slab will be", "image": null}, "options": [{"id": "s9oaI", "text": "$\\frac{t}{2 d+t}$", "image": null, "isCorrect": true}, {"id": "q0nL4", "text": "$\\frac{t}{d-2 t}$", "image": null, "isCorrect": false}, {"id": "gS8iN", "text": "$\\frac{t}{d+t}$", "image": null, "isCorrect": false}, {"id": "h28Uk", "text": "$\\frac{2 t}{2 d-t}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Equivalent Capacitance of the dielectric-air system is given by\n$\\frac{1}{C^{\\prime}}=\\left(\\frac{d-t}{\\varepsilon_0 A}\\right)+\\left(\\frac{t}{K \\varepsilon_0 A}\\right)=\\frac{d-t\\left(1-\\frac{1}{K}\\right)}{\\varepsilon_0 A}$\nIf new capacitance is given by one third of the old value:\n$\\begin{aligned}\n& C=\\frac{\\varepsilon_0 A}{d-t\\left(1-\\frac{1}{K}\\right)}=\\frac{\\varepsilon_0 A}{3 d} \\\\\n& \\Rightarrow d-t+\\frac{t}{K}=3 d \\\\\n& \\Rightarrow K=\\frac{t}{2 d+t}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261720279619d9d8a2ca5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "The dielectric slab is introduced between the plates of a parallel plate charged capacitor. Which one of the following quantities will not change?", "image": null}, "options": [{"id": "w2c7G", "text": "The charge on the capacitor.", "image": null, "isCorrect": true}, {"id": "FwRzu", "text": "The potential difference between the plates.", "image": null, "isCorrect": false}, {"id": "GfHHk", "text": "The energy stored in the capacitor.", "image": null, "isCorrect": false}, {"id": "A461k", "text": "The electric field between the plates of a capacitor.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Only the amount of charge stored in the capacitor will remain constant when the dielectric is inserted between the plates (isolated system).\nCharge will redistribute, such on the plate $Q\\left(1-\\frac{1}{K}\\right)$ and $\\frac{Q}{K}$ on the dielectric interface.\nThe electric field present between the plates of capacitor changes because it varies with the dielectric constant:\n$E^{\\prime}=\\frac{Q}{4 \\pi \\varepsilon_0 K}=\\frac{E}{K}$\nThe capacitance increases as:\n$C^{\\prime}=\\frac{K \\varepsilon_0 A}{d}=K C$\nThe dielectric constant also affects the potential difference as:\n$\\begin{aligned} & Q=C^{\\prime} V^{\\prime}=C K V^{\\prime}=C V \\\\ & \\therefore V^{\\prime}=\\frac{V}{K}\\end{aligned}$\nand the energy stored in the capacitor:\n$U^{\\prime}=\\frac{1}{2} \\frac{Q^2}{C^{\\prime}}=\\frac{U}{K}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261180279619d9d8a29c3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}], "question": {"text": "A parallel plate air filled capacitor of capacitance $C$ has plate area $A$ and the distance between the plates $d$. When a metal sheet of thickness $\\left(\\frac{d}{2}\\right)$ and of the same area $A$ is introduced between the plates, its capacitance becomes $C_2$. The ratio $C_2: C_1$ is", "image": null}, "options": [{"id": "t8PY9", "text": "$4: 1$", "image": null, "isCorrect": false}, {"id": "TgnPL", "text": "$2: 1$", "image": null, "isCorrect": true}, {"id": "gcp3M", "text": "3:1", "image": null, "isCorrect": false}, {"id": "y59jm", "text": "$3: 2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The capacitance of the air filled parallel plate capacitor is given by\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/CsIsXyY7ZmxBR4d02cp5XaPwxArgbsNba1n7RGfxltI.original.fullsize.png\">\nWhen a slab of dielectric constant $K$, and thickness $\\mathrm{t}$ is introduced in between the plates of the capacitor, its new capacitance is given by $C^{\\prime}$. This leads to parallel combination of two capacitors:\n$\\frac{1}{C^{\\prime}}=\\frac{d-t}{\\varepsilon_0 A}+\\frac{t}{K \\varepsilon_0 A}=\\frac{d+t\\left(\\frac{1}{K}-1\\right)}{\\varepsilon_0 A}$\nSince a metal sheet of thickness $d / 2$ is introduced, hence here, $t=d / 2$, $K=\\propto$ (for metals)\nor $\\frac{1}{K}=0$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/nQkgUtmgJHNuwhHoMhimvkNUwmzn2gpEJPhfJjkjuBg.original.fullsize.png\">\nTaking ratio of equation (2) and (1),\n$\\therefore \\frac{C^{\\prime}}{C}=\\frac{\\frac{2 \\varepsilon_0 A}{d}}{\\frac{\\varepsilon_0 A}{d}}=\\frac{2}{1}=2: 1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260a40279619d9d8a2626", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "Two parallel plates with dielectric placed between the plates are as shown in figure. The resultant capacity of capacitor will [A = area of plate. $t_1, t_2$ and $t_3$ are thickness of dielectric slabs, $k_1$, $\\mathrm{k}_2$ and $\\mathrm{k}_3$ are dielectric constant.]\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/R5nkR7DXnotiynzpjUSEklNdYpWhvXofS0K9-qo8PMI.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "yPnwZ", "text": "$\\frac{\\mathrm{A} \\varepsilon_0}{\\left[\\frac{\\mathrm{t}_1+\\mathrm{t}_2+\\mathrm{t}_3}{\\mathrm{k}_1+\\mathrm{k}_2+\\mathrm{k}_3}\\right]}$", "image": null, "isCorrect": false}, {"id": "R3sXE", "text": "$\\frac{\\mathrm{A} \\varepsilon_0\\left(\\mathrm{k}_1 \\mathrm{k}_2 \\mathrm{k}_3\\right)}{\\mathrm{t}_1 \\mathrm{t}_2 \\mathrm{t}_3}$", "image": null, "isCorrect": false}, {"id": "W1lWU", "text": "$\\mathrm{~A} \\varepsilon_0\\left[\\frac{\\mathrm{k}_1}{\\mathrm{t}_1}+\\frac{\\mathrm{k}_2}{\\mathrm{t}_2}+\\frac{\\mathrm{k}_3}{\\mathrm{t}_3}\\right]$", "image": null, "isCorrect": false}, {"id": "aRWic", "text": "$\\frac{\\mathrm{A} \\varepsilon_0}{\\left[\\frac{\\mathrm{t}_1}{\\mathrm{k}_1}+\\frac{\\mathrm{t}_2}{\\mathrm{k}_2}+\\frac{\\mathrm{t}_3}{\\mathrm{k}_3}\\right]}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "These are three capacitors connected in series.\n$$\n\\begin{aligned}\n& \\frac{1}{\\mathrm{C}}=\\frac{1}{\\mathrm{C}_1}+\\frac{1}{\\mathrm{C}_2}+\\frac{1}{\\mathrm{C}_3}=\\frac{\\mathrm{t}_1}{\\varepsilon_0 \\mathrm{Ak}_1}+\\frac{\\mathrm{t}_2}{\\varepsilon_0 \\mathrm{Ak}_2}+\\frac{\\mathrm{t}_3}{\\varepsilon_0 \\mathrm{Ak}_3} \\\\\n& \\mathrm{C}=\\frac{\\mathrm{A} \\varepsilon_0}{\\left[\\frac{\\mathrm{t}_1}{\\mathrm{k}_1}+\\frac{\\mathrm{t}_2}{\\mathrm{k}_2}+\\frac{\\mathrm{t}_3}{\\mathrm{k}_3}\\right]}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2606f0279619d9d8a247a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "When the battery across the plates of a charged condenser is disconnected and a dielectric slab is introduced between its plates then the energy stored", "image": null}, "options": [{"id": "Yd5q1", "text": "becomes infinity", "image": null, "isCorrect": false}, {"id": "ULnYB", "text": "does not change", "image": null, "isCorrect": false}, {"id": "p6LxV", "text": "increases", "image": null, "isCorrect": false}, {"id": "5fRQs", "text": "decreases", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Since the battery is disconnected, the charge on the capacitor remains constant. When the dielectric slab is introduced, the capacitance increases $\\mathrm{k}$ times.\nEnergy stored, $\\mathrm{U}_{\\mathrm{i}}=\\frac{\\mathrm{q}^2}{2 \\mathrm{C}}$\n$$\n\\mathrm{U}_{\\mathrm{f}}=\\frac{\\mathrm{q}^2}{2 \\mathrm{kC}} < \\mathrm{U}_{\\mathrm{i}}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2605b0279619d9d8a23d1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "Two identical parallel plate air capacitors are connected in series to a battery of emf ' $\\mathrm{V}$ '. If one of the capacitor is inserted in liquid of dielectric constant ' $\\mathrm{K}$ ' then, potential difference of the other capacitor will become", "image": null}, "options": [{"id": "0WZdG", "text": "$\\frac{\\mathrm{K}-1}{\\mathrm{KV}}$", "image": null, "isCorrect": false}, {"id": "B4qsI", "text": "$\\frac{\\mathrm{K}+1}{\\mathrm{KV}}$", "image": null, "isCorrect": false}, {"id": "vIfRO", "text": "$\\left(\\frac{\\mathrm{KV}}{\\mathrm{K}+1}\\right)$", "image": null, "isCorrect": true}, {"id": "BPkEF", "text": "$\\frac{\\mathrm{KV}}{\\mathrm{K}-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the capacitance of capacitors are C initially.\nSo, afterward $\\mathrm{C}_1=\\mathrm{KC}$ and $\\mathrm{C}_2=\\mathrm{C}$\np.d. across capacitor $\\mathrm{C}_2$ is\n$$\n\\mathrm{V}_2=\\frac{\\mathrm{C}_1 \\mathrm{~V}}{\\mathrm{C}_1+\\mathrm{C}_2}=\\frac{\\mathrm{KCV}}{\\mathrm{C}+\\mathrm{KC}}=\\frac{\\mathrm{KV}}{\\mathrm{K}+1}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260470279619d9d8a232f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "An air-filled parallel plate capacitor has a capacity $2 \\mathrm{pF}$, The separation of the plates is doubled and the interspace between the plates is filled with dielectric material, then the capacity is increased to $6 \\mathrm{pF}$, The dielectric constant of the material is", "image": null}, "options": [{"id": "dueIN", "text": "3", "image": null, "isCorrect": false}, {"id": "cHUE6", "text": "6", "image": null, "isCorrect": true}, {"id": "5YAVy", "text": "2", "image": null, "isCorrect": false}, {"id": "RQYzi", "text": "4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\mathrm{C}=\\frac{\\mathrm{kA} \\varepsilon_0}{\\mathrm{~d}} \\\\\n& \\therefore \\frac{\\mathrm{C}_2}{\\mathrm{C}_1}=\\frac{\\mathrm{k}_2}{\\mathrm{k}_1} \\cdot \\frac{\\mathrm{d}_1}{\\mathrm{~d}_2} \\\\\n& \\therefore \\frac{6}{2}=\\frac{\\mathrm{k}_2}{1} \\cdot \\frac{1}{2} \\\\\n& \\therefore \\mathrm{k}_2=6\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260370279619d9d8a22b4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "A parallel plate capacitor filled with oil of a dielectric constant 3 between the plates has capacitance ' $C$ '. If the oil is removed, then the capacitance of the capacitor will be", "image": null}, "options": [{"id": "hCLuQ", "text": "$\\frac{\\mathrm{C}}{\\sqrt{3}}$", "image": null, "isCorrect": false}, {"id": "jJ57t", "text": "$3 \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "OQtlp", "text": "$\\sqrt{3} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "9QWky", "text": "$\\frac{C}{3}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\mathrm{C}=\\frac{\\mathrm{K} \\varepsilon_0 \\mathrm{~A}}{\\mathrm{~d}}=\\frac{3 \\varepsilon_0 \\mathrm{~A}}{\\mathrm{~d}}\n$$\nAfter removing the oil, capacitance becomes\n$$\n\\mathrm{C}^{\\prime}=\\frac{\\varepsilon_0 \\mathrm{~A}}{\\mathrm{~d}}=\\frac{\\mathrm{C}}{3}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260220279619d9d8a2207", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "A parallel plate air capacitor is charged up to $100 \\mathrm{~V}$. A plate $2 \\mathrm{~mm}$ thick is inserted between the plates. Then to maintain the same potential difference, the distance between the plates is increased by $1.6 \\mathrm{~mm}$. The dielectric constant of the thick plate is", "image": null}, "options": [{"id": "1GNlX", "text": "4", "image": null, "isCorrect": false}, {"id": "5uhp7", "text": "5", "image": null, "isCorrect": true}, {"id": "EfzKV", "text": "2", "image": null, "isCorrect": false}, {"id": "PQwcN", "text": "3", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If $d$ is the initial distance between the plates then capacitance is given by $\\mathrm{C}=\\frac{\\mathrm{kA} \\in_0}{\\mathrm{~d}}$\n\nWhen a plate of thickness $\\mathrm{t}=2 \\mathrm{~mm}$ is inserted between the plates the capacitance,\n$$\nC_1=\\frac{k A \\epsilon_0}{\\left(d-t+\\frac{t}{k}\\right)}\n$$\nIf distance between the plates is increased by $\\mathrm{x}=1.6 \\mathrm{~mm}$ Capacitance become, $\\mathrm{C}_2=\\frac{\\mathrm{kA} \\in_0}{\\left(\\mathrm{~d}+\\mathrm{x}-\\mathrm{t}+\\frac{\\mathrm{t}}{\\mathrm{k}}\\right)}$ But $\\mathrm{C}_2=\\mathrm{C}$\n$\\begin{aligned} & \\therefore \\mathrm{d}+\\mathrm{x}-\\mathrm{t}+\\frac{\\mathrm{t}}{\\mathrm{k}}=\\mathrm{d} \\\\ & \\therefore \\mathrm{t}-\\mathrm{x}=\\frac{\\mathrm{t}}{\\mathrm{k}} \\\\ & \\therefore 2-1.6=\\frac{2}{\\mathrm{k}} \\\\ & \\therefore 0.4=\\frac{2}{\\mathrm{k}} \\quad \\therefore \\mathrm{k}=5\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fd90279619d9d8a1fba", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "The function of a dielectric in a capacitor is", "image": null}, "options": [{"id": "1tEpH", "text": "to increase the effective potential on plates.", "image": null, "isCorrect": false}, {"id": "6vEDb", "text": "to reduce the effective potential on plates.", "image": null, "isCorrect": true}, {"id": "JIp97", "text": "to decrease the capacitance.", "image": null, "isCorrect": false}, {"id": "bPM6R", "text": "to reduce the plate area of capacitor.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "to reduce the effective potential on plates", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fb00279619d9d8a1e76", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "The capacitance of a parallel plate capacitor with air as medium is $3 \\mu \\mathrm{F}$. With the introduction of a dielectric medium between the plates, the capacitance becomes 15 $\\mu F$. The permittivity of the medium in SI unit is $\\left[\\epsilon_{0}=8 \\cdot 85 \\times 10^{-12}\\right.$ SI unit]", "image": null}, "options": [{"id": "57cqn", "text": "15", "image": null, "isCorrect": false}, {"id": "gCJt2", "text": "$8.845 \\times 10^{-11}$", "image": null, "isCorrect": false}, {"id": "4VZ4K", "text": "$0.4425 \\times 10^{-10}$", "image": null, "isCorrect": true}, {"id": "CoDSm", "text": "44. 5", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Capacitance of a paralle plate capacitor $\\mathrm{C}=\\frac{\\varepsilon \\mathrm{A}}{\\mathrm{d}}$\nhere $\\varepsilon$ is the permitivity of the medium\nFor air medium $\\varepsilon=\\varepsilon_{0}=8.85 \\times 10^{-12} \\mathrm{C}^{2} \\mathrm{~N}^{-1} \\mathrm{~m}^{-2} \\quad \\therefore \\mathrm{C}^{\\prime}=\\frac{\\varepsilon_{0} \\mathrm{~A}}{\\mathrm{~d}} \\ldots .1$\nwhearas for dielectric medium capacitance $\\mathrm{C}=\\frac{\\varepsilon \\mathrm{A}}{\\mathrm{d}} \\ldots 2$\nFrom 1 and 2\n$$\n\\begin{array}{l}\n\\frac{\\mathrm{C}}{\\mathrm{C}^{\\prime}}=\\frac{\\varepsilon}{\\varepsilon_{0}} \\\\\n\\therefore \\varepsilon=\\frac{15}{3} \\times 8.85 \\times 10^{-12}=\\left(44.25 \\times 10^{-12}\\right)=0.44 \\times 10^{-10} \\mathrm{C}^{2} \\mathrm{~N}^{-1} \\mathrm{~m}^{2}\n\\end{array}\n$$\nHence the permitivity of the medium $\\varepsilon=0.44 \\times 10^{-10} \\mathrm{C}^{2} \\mathrm{~N}^{-1} \\mathrm{~m}^{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f9e0279619d9d8a1dea", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "Two identical parallel plate air capacitors are connected in series to a battery of e..m.f. ${ }^{\\prime} \\mathrm{V}^{\\prime}$. If one of the capacitor is inserted in liquid of dielectric constant '$\\mathrm{K}^{\\prime}$, then potential difference of the other capacitor will become", "image": null}, "options": [{"id": "RQW4u", "text": "$\\frac{\\mathrm{K}}{\\mathrm{V}(\\mathrm{K}+1)}$", "image": null, "isCorrect": false}, {"id": "O0x0W", "text": "$\\frac{\\mathrm{KV}}{\\mathrm{K}+1}$", "image": null, "isCorrect": true}, {"id": "iMIgq", "text": "$\\frac{\\mathrm{K}+1}{\\mathrm{KV}}$", "image": null, "isCorrect": false}, {"id": "arcT3", "text": "$\\frac{\\mathrm{K}}{\\mathrm{V}(1-\\mathrm{K})}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the capacitance of capacitor \\(C_{2}\\) be \\(C\\). Thus capacitance of capacitor \\(C_{1}\\) is KC.\nPotential across the capacitor \\(\\mathrm{C}_{2}, \\mathrm{~V}_{2}=\\frac{\\mathrm{C}_{2}}{\\mathrm{C}_{1}+\\mathrm{C}_{2}} \\mathrm{~V}\\)\n\\(\\therefore \\mathrm{V}_{2}=\\frac{\\mathrm{KC}}{\\mathrm{C}_{1}+\\mathrm{KC}} \\mathrm{V}\\)\n\\(\\Longrightarrow \\mathrm{V}_{2}=\\frac{\\mathrm{KV}}{\\mathrm{K}+1}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f1e0279619d9d8a19e8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}], "question": {"text": "In a parallel plate capacitor, the capacity can be increased by decreasing", "image": null}, "options": [{"id": "feP6Z", "text": "permeability of the medium.", "image": null, "isCorrect": false}, {"id": "g3d8k", "text": "value of dielectric constant.", "image": null, "isCorrect": false}, {"id": "FKN4j", "text": "area of the plates.", "image": null, "isCorrect": false}, {"id": "zhh4U", "text": "the distance between plates.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Separation. Decreasing the separation of the plates, decreases the voltage of the capacitor since the electric-field is not affected by the distance between the plates. The voltage on the capacitor is $V=E d$. Therefore the voltage increases", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f080279619d9d8a193f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}], "question": {"text": "In a parallel plate air capacitor the distance between plates is reduced to one fourth and the space between them is filled with a dielectric medium of constant 2. If the initial capacity of the capacitor is <math><mn>4</mn><mi>μ</mi><mi>F</mi><mo>.</mo></math> then its new capacity is", "image": null}, "options": [{"id": "HUcrh", "text": "<math><mn>32</mn><mi>μ</mi><mi>F</mi></math>", "image": null, "isCorrect": true}, {"id": "Rof0H", "text": "<math><mn>18</mn><mi>μ</mi><mi>F</mi></math>", "image": null, "isCorrect": false}, {"id": "yRtju", "text": "<math><mn>8</mn><mi>μ</mi><mi>F</mi></math>", "image": null, "isCorrect": false}, {"id": "70cN2", "text": "<math><mn>44</mn><mi>μ</mi><mi>F</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The capacitance of a parallel plate air capacitor is given by <br/><math><msub><mrow><mi>C</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mfrac><mrow><msub><mrow><mi>ε</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>A</mi></mrow><mrow><mi>d</mi></mrow></mfrac></math>  <br/>Where, <math><msub><mrow><mi>ε</mi></mrow><mrow><mn>0</mn></mrow></msub></math> =permittivity of the medium, <br/>A = area of plates <br/>and d = distance between the plates <br/>When the distance between plates is reduced and a dielectric slab is introduced, then the capacitance becomes <br/><math><mi>C</mi><mo>=</mo><mfrac><mrow><mi>K</mi><msub><mrow><mi>ε</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>A</mi></mrow><mrow><msub><mrow><mi>d</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></math> … (ii) <br/>Where, K = dielectric constant of medium. <br/>Here, K = 2, <math><msub><mrow><mi>d</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfrac><mrow><mi>d</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math> and <math><msub><mrow><mi>C</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mn>4</mn><mi>μ</mi><mi>F</mi></math> = <math><mn>4</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup><mi>F</mi></math>  <br/>From Eq. (ii), we get <br/><math><mi>C</mi><mo>=</mo><mn>4</mn><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>K</mi><msub><mrow><mi>ε</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>A</mi></mrow><mrow><msub><mrow><mi>d</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>4</mn><mi>K</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><msub><mrow><mi>ε</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>A</mi></mrow><mrow><mi>d</mi></mrow></mfrac></mrow></mfenced></math>  <br/><math><mo>=</mo><mn>4</mn><mi>K</mi><msub><mrow><mi>C</mi></mrow><mrow><mn>0</mn></mrow></msub></math> …. (iii) [From Eq. (i)] <br/>Substituting given values in Eq. (iii), we get <br/><math><mi>C</mi><mo>=</mo><mn>4</mn><mo>×</mo><mn>2</mn><mo>×</mo><mn>4</mn><mo>=</mo><mn>32</mn><mi>μ</mi><mi>F</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ebc0279619d9d8a16dc", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f62", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "MHT CET 2017"}], "question": {"text": "Two parallel plate air capacitors of the same capacity&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math> are connected in series to a battery of emf <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi></math>. Then one of the capacitors is completely filled with the dielectric material of constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi></math>. The change in the effective capacitance of the series combination is", "image": null}, "options": [{"id": "e3oTr", "text": "<math><mfrac><mrow><mi>C</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mi>K</mi><mo>-</mo><mn>1</mn></mrow><mrow><mi>K</mi><mo>+</mo><mn>1</mn></mrow></mfrac></mrow></mfenced></math>", "image": null, "isCorrect": true}, {"id": "ag4dJ", "text": "<math><mfrac><mrow><mi>C</mi></mrow><mrow><mn>4</mn></mrow></mfrac><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mi>K</mi><mo>-</mo><mn>1</mn></mrow><mrow><mi>K</mi><mo>+</mo><mn>1</mn></mrow></mfrac></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "aUu3m", "text": "<math><mfrac><mrow><mi>C</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mi>K</mi><mo>+</mo><mn>1</mn></mrow><mrow><mi>K</mi><mo>-</mo><mn>1</mn></mrow></mfrac></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "YU8qs", "text": "<math><
