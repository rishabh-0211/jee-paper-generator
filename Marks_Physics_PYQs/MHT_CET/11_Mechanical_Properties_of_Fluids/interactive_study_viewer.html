 [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Water (of density '$\\rho$') flows steadily through a horizontal pipe of variable cross-section. If the pressure of water is 'P' at a point where the flow speed is ' $V$ ', then the pressure at another point where the flow speed becomes 3 V is", "image": null}, "options": [{"id": "nkbRu", "text": "$\\mathrm{P}-4 \\rho \\mathrm{V}^2$", "image": null, "isCorrect": true}, {"id": "J0nHj", "text": "$\\mathrm{P}+\\frac{3}{2} \\rho \\mathrm{V}^2$", "image": null, "isCorrect": false}, {"id": "7WpVZ", "text": "$\\mathrm{P}+\\frac{5}{2} \\rho \\mathrm{V}^2$", "image": null, "isCorrect": false}, {"id": "Breke", "text": "$\\mathrm{P}-8 \\rho \\mathrm{V}^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Bernoulli's theorem for a horizontal pipe:<br><br>$P_1 + \\dfrac{1}{2}\\rho v_1^2 = P_2 + \\dfrac{1}{2}\\rho v_2^2$<br><br>Given $P_1 = P$, $v_1 = V$, and $v_2 = 3V$.<br><br>Substituting the values:<br><br>$P + \\dfrac{1}{2}\\rho V^2 = P_2 + \\dfrac{1}{2}\\rho (3V)^2$<br><br>$P + \\dfrac{1}{2}\\rho V^2 = P_2 + \\dfrac{9}{2}\\rho V^2$<br><br>$P_2 = P + \\dfrac{1}{2}\\rho V^2 - \\dfrac{9}{2}\\rho V^2$<br><br>$P_2 = P - 4\\rho V^2$<br><br>Answer: $\\mathrm{P}-4 \\rho \\mathrm{V}^2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bb4bf9280d7f9932bbb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A horizontal pipeline carries water in a stream-line flow. At a point along the pipe, where the cross-sectional area is $10 \\mathrm{~cm}^2$, the velocity of water is $1 \\mathrm{~m} / \\mathrm{s}$ and pressure is 2000 Pa . The pressure of water at another point where the cross-sectional area $5 \\mathrm{~cm}^2$ is\n$\\left[\\text { Given } \\rightarrow \\text { density of water }=1000 \\mathrm{~kg} / \\mathrm{m}^3\\right]$", "image": null}, "options": [{"id": "fTMTw", "text": "1000 Pa", "image": null, "isCorrect": false}, {"id": "CZYO1", "text": "750 Pa", "image": null, "isCorrect": false}, {"id": "mgCYS", "text": "500 Pa", "image": null, "isCorrect": true}, {"id": "2D2va", "text": "250 Pa", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using the equation of continuity:<br><br>$A_1 v_1 = A_2 v_2$<br><br>$10 \\times 1 = 5 \\times v_2$<br><br>$v_2 = 2 \\text{ m/s}$<br><br>Using Bernoulli's equation for a horizontal pipe:<br><br>$P_1 + \\dfrac{1}{2} \\rho v_1^2 = P_2 + \\dfrac{1}{2} \\rho v_2^2$<br><br>$2000 + \\dfrac{1}{2} \\times 1000 \\times (1)^2 = P_2 + \\dfrac{1}{2} \\times 1000 \\times (2)^2$<br><br>$2000 + 500 = P_2 + 2000$<br><br>$P_2 = 500 \\text{ Pa}$<br><br>Answer: 500 Pa", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b87bf9280d7f9932a12", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A wind with speed $50 \\mathrm{~m} / \\mathrm{s}$ blows parallel to the roof of a house. The area of the roof is $300 \\mathrm{~m}^2$. Assume that the pressure inside the house is atmospheric pressure. Density of air is $1.2 \\mathrm{~kg} / \\mathrm{m}^3$. The magnitude of the force exerted by the wind on the roof will be", "image": null}, "options": [{"id": "mnEUg", "text": "$1.5 \\times 10^5 \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "ShiuX", "text": "$3.0 \\times 10^5 \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "H7Ddv", "text": "$4.5 \\times 10^5 \\mathrm{~N}$", "image": null, "isCorrect": true}, {"id": "aVg1m", "text": "$9.0 \\times 10^5 \\mathrm{~N}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using Bernoulli's equation just inside and outside the roof:<br><br>$P_{in} + \\dfrac{1}{2}\\rho v_{in}^2 = P_{out} + \\dfrac{1}{2}\\rho v_{out}^2$<br><br>Since the air inside the house is at rest, $v_{in} = 0$ and $P_{in} = P_0$ (atmospheric pressure).<br><br>$P_0 = P_{out} + \\dfrac{1}{2}\\rho v^2$<br><br>The pressure difference across the roof is $\\Delta P = P_0 - P_{out} = \\dfrac{1}{2}\\rho v^2$.<br><br>The upward force exerted on the roof is $F = \\Delta P \\times A = \\dfrac{1}{2}\\rho v^2 A$.<br><br>Substituting the given values:<br><br>$F = \\dfrac{1}{2} \\times 1.2 \\times (50)^2 \\times 300$<br><br>$F = 0.6 \\times 2500 \\times 300$<br><br>$F = 450000 \\text{ N} = 4.5 \\times 10^5 \\text{ N}$<br><br>Answer: $4.5 \\times 10^5 \\mathrm{~N}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b55bf9280d7f993284f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Water flows through a horizontal pipe of varying cross-section at the rate of $\\pi \\times 10^{-1} \\mathrm{~m}^3 / \\mathrm{s}$. The velocity of water at a point where the radius of the pipe is 10 cm is $(\\pi=3.14)$", "image": null}, "options": [{"id": "7bqgl", "text": "$0.1 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "pKlOP", "text": "$1 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "Rqve7", "text": "$10 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": true}, {"id": "LeLfJ", "text": "$100 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The rate of flow of water is $Q = \\pi \\times 10^{-1} \\mathrm{~m}^3 / \\mathrm{s}$.<br><br>The radius of the pipe is $r = 10 \\mathrm{~cm} = 0.1 \\mathrm{~m}$.<br><br>The cross-sectional area is $A = \\pi r^2 = \\pi (0.1)^2 = \\pi \\times 10^{-2} \\mathrm{~m}^2$.<br><br>Using the relation for the rate of flow, $Q = A v$.<br><br>$v = \\dfrac{Q}{A}$<br><br>$v = \\dfrac{\\pi \\times 10^{-1}}{\\pi \\times 10^{-2}}$<br><br>$v = 10 \\mathrm{~m} / \\mathrm{s}$<br><br>Answer: $10 \\mathrm{~m} / \\mathrm{s}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b45bf9280d7f99327b4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "An incompressible fluid flows steadily through a cylindrical pipe having radius $R$ at point $A$ and $\\left(\\frac{R}{3}\\right)$ at point $B$ further along the direction of flow of liquid. If the velocity at point A is ' V ' then that at point $B$ is", "image": null}, "options": [{"id": "hYEZb", "text": "$\\frac{V}{9}$", "image": null, "isCorrect": false}, {"id": "1xa4H", "text": "$\\frac{v}{3}$", "image": null, "isCorrect": false}, {"id": "On5H5", "text": "3V", "image": null, "isCorrect": false}, {"id": "0Bfba", "text": "9V", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to the equation of continuity for steady flow of an incompressible fluid:<br><br>$A_A V_A = A_B V_B$<br><br>The area of cross-section at point A is $A_A = \\pi R^2$ and the area at point B is $A_B = \\pi \\left(\\dfrac{R}{3}\\right)^2 = \\dfrac{\\pi R^2}{9}$.<br><br>Substituting the given values into the equation of continuity:<br><br>$\\pi R^2 V = \\dfrac{\\pi R^2}{9} V_B$<br><br>$V_B = 9V$<br><br>Answer: 9V", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792142f0aee93fa0796dea2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "A cylinder contains water upto a height 'H'. It has three orifices $\\mathrm{O}_1, \\mathrm{O}_2, \\mathrm{O}_3$ as shown in the figure. Let $V_1, V_2, V_3$ be the speed of efflux of water from the three orifices. Then\r\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/nFbmWtMK5-VyolPWtyRTtAv0UyzwPVeG5ofPYyZ9Gi4.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "REv5u", "text": "$\\mathrm{V}_1=\\mathrm{V}_2=\\mathrm{V}_3$", "image": null, "isCorrect": false}, {"id": "OVXNL", "text": "$V_1 \\lt V_2 \\lt V_3$", "image": null, "isCorrect": true}, {"id": "I6jQp", "text": "$\\mathrm{V}_1\\gt\\mathrm{V}_2\\gt\\mathrm{V}_3$", "image": null, "isCorrect": false}, {"id": "VGWFq", "text": "$\\quad \\mathrm{V}_1=\\mathrm{V}_3\\gt\\mathrm{V}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Torricelli's law, the speed of efflux $v$ from an orifice is given by:<br><br>$v = \\sqrt{2gh}$<br><br>where $h$ is the depth of the orifice below the free surface of the liquid.<br><br>From the given figure, let the depths of the orifices $O_1, O_2$, and $O_3$ from the free surface be $h_1, h_2$, and $h_3$ respectively. It is evident that:<br><br>$h_1 < h_2 < h_3$<br><br>Since the speed of efflux is directly proportional to the square root of the depth ($v \\propto \\sqrt{h}$), we have:<br><br>$\\sqrt{2gh_1} < \\sqrt{2gh_2} < \\sqrt{2gh_3}$<br><br>$\\Rightarrow V_1 < V_2 < V_3$<br><br>Answer: $V_1 \\lt V_2 \\lt V_3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213bc0aee93fa0796db1a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "A completely filled water tank of height ' $h$ ' has a hole at the bottom. The total pressure of the bottom is 4 H and atmospheric pressure is H . The velocity of water flowing out of the hole is ( $\\rho=$ density of water)", "image": null}, "options": [{"id": "2LHPA", "text": "$\\sqrt{\\dfrac{3 H}{\\rho}}$", "image": null, "isCorrect": false}, {"id": "sAIbW", "text": "$\\sqrt{\\dfrac{5 \\mathrm{H}}{\\rho}}$", "image": null, "isCorrect": false}, {"id": "QpGJL", "text": "$\\sqrt{\\dfrac{6 \\mathrm{H}}{\\rho}}$", "image": null, "isCorrect": true}, {"id": "UI3F3", "text": "$\\sqrt{\\dfrac{9 \\mathrm{H}}{\\rho}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Total pressure at the bottom of the tank is given by:<br><br>$P_{\\text{total}} = P_{\\text{atm}} + \\rho g h$<br><br>Given $P_{\\text{total}} = 4H$ and $P_{\\text{atm}} = H$:<br><br>$4H = H + \\rho g h$<br><br>$\\rho g h = 3H$<br><br>$gh = \\dfrac{3H}{\\rho}$<br><br>According to Torricelli's law, the velocity of efflux $v$ from a hole at the bottom of the tank is:<br><br>$v = \\sqrt{2gh}$<br><br>Substituting the value of $gh$:<br><br>$v = \\sqrt{2 \\left(\\dfrac{3H}{\\rho}\\right)} = \\sqrt(\\dfrac{6H}{\\rho})$<br><br>Answer: $\\sqrt{\\dfrac{6 \\mathrm{H}}{\\rho}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ba0aee93fa0796db0b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "A closed pipe containing a liquid showed a pressure $P_1$ by gauge. When the valve was opened, pressure was reduced to $P_2$. The speed of water flowing out of the pipe is ( $\\rho=$ density of water )", "image": null}, "options": [{"id": "QO7mB", "text": "$\\left[\\dfrac{4\\left(P_1-P_2\\right)}{\\rho}\\right]^{1 / 2}$", "image": null, "isCorrect": false}, {"id": "MXWfQ", "text": "$\\left[\\dfrac{4\\left(P_2-P_1\\right)}{\\rho}\\right]^{1 / 2}$", "image": null, "isCorrect": false}, {"id": "huAtb", "text": "$\\left[\\dfrac{2\\left(P_1-P_2\\right)}{\\rho}\\right]^{1 / 2}$", "image": null, "isCorrect": true}, {"id": "J6eEm", "text": "$\\left[\\dfrac{2\\left(\\mathrm{P}_2-\\mathrm{P}_1\\right)}{\\rho}\\right]^{1 / 2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Applying Bernoulli's theorem at the two states (closed and open valve) for the same horizontal level:<br><br>$P_1 + \\dfrac{1}{2}\\rho v_1^2 = P_2 + \\dfrac{1}{2}\\rho v_2^2$<br><br>Initially, the valve is closed, so the velocity of the liquid $v_1 = 0$.<br><br>When the valve is opened, the pressure is $P_2$ and the velocity is $v_2 = v$.<br><br>Substituting these values into Bernoulli's equation:<br><br>$P_1 + 0 = P_2 + \\dfrac{1}{2}\\rho v^2$<br><br>$P_1 - P_2 = \\dfrac{1}{2}\\rho v^2$<br><br>$v^2 = \\dfrac{2(P_1 - P_2)}{\\rho}$<br><br>$v = \\left[\\dfrac{2(P_1 - P_2)}{\\rho}\\right]^{1/2}$<br><br>Answer: $\\left[\\dfrac{2\\left(P_1-P_2\\right)}{\\rho}\\right]^{1 / 2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213970aee93fa0796d9f9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "Water is flowing in a conical tube as shown in figure. Velocity of water at area ' $\\mathrm{A}_2$ ' is $60 \\mathrm{~cm} / \\mathrm{s}$. The value of ' $\\mathrm{A}_1$ ' and ' $\\mathrm{A}_2$ ' is $10 \\mathrm{~cm}^2$ and $5 \\mathrm{~cm}^2$ respectively. The pressure difference at both the cross-section is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/Mk5FQ8TeDWXPbv58lAeUB3wrwbaQ9uYmRuxVREt96u8.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "sCPzO", "text": "$230 \\mathrm{~N} / \\mathrm{m}^2$", "image": null, "isCorrect": false}, {"id": "csFTI", "text": "$200 \\mathrm{~N} / \\mathrm{m}^2$", "image": null, "isCorrect": false}, {"id": "zfZIV", "text": "$135 \\mathrm{~N} / \\mathrm{m}^2$", "image": null, "isCorrect": true}, {"id": "RUHJd", "text": "$105 \\mathrm{~N} / \\mathrm{m}^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From the equation of continuity, we have:<br><br>$A_1 V_1 = A_2 V_2$<br><br>Given $A_1 = 10 \\text{ cm}^2$, $A_2 = 5 \\text{ cm}^2$, and $V_2 = 60 \\text{ cm/s} = 0.6 \\text{ m/s}$.<br><br>Substituting the values:<br><br>$10 \\times V_1 = 5 \\times 60$<br><br>$V_1 = 30 \\text{ cm/s} = 0.3 \\text{ m/s}$<br><br>Assuming the tube is horizontal, we apply Bernoulli's equation:<br><br>$P_1 + \\dfrac{1}{2}\\rho V_1^2 = P_2 + \\dfrac{1}{2}\\rho V_2^2$<br><br>The pressure difference is:<br><br>$\\Delta P = P_1 - P_2 = \\dfrac{1}{2}\\rho (V_2^2 - V_1^2)$<br><br>Using the density of water $\\rho = 1000 \\text{ kg/m}^3$:<br><br>$\\Delta P = \\dfrac{1}{2} \\times 1000 \\times (0.6^2 - 0.3^2)$<br><br>$\\Delta P = 500 \\times (0.36 - 0.09)$<br><br>$\\Delta P = 500 \\times 0.27 = 135 \\text{ N/m}^2$<br><br>Answer: $135 \\mathrm{~N} / \\mathrm{m}^2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792136f0aee93fa0796d8c7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "The surface of water in a water tank of cross section area $750 \\mathrm{~cm}^2$ on the top of a house is ' $h$ ' $m$ above the tap level. The speed of water coming out through the tap of cross section area $500 \\mathrm{~mm}^2$ is $30 \\mathrm{~cm} / \\mathrm{s}$. At that instant $\\dfrac{\\mathrm{dh}}{\\mathrm{dt}}$ is $\\mathrm{x}=10^{-3} \\mathrm{~m} / \\mathrm{s}$. The value of ' x ' will be", "image": null}, "options": [{"id": "NY4lR", "text": "2", "image": null, "isCorrect": true}, {"id": "gk3Si", "text": "3", "image": null, "isCorrect": false}, {"id": "fDXFC", "text": "4", "image": null, "isCorrect": false}, {"id": "2E5NJ", "text": "6", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using the equation of continuity:<br><br>$A_1 v_1 = A_2 v_2$<br><br>Given $A_1 = 750 \\text{ cm}^2 = 750 \\times 10^{-4} \\text{ m}^2$<br><br>$A_2 = 500 \\text{ mm}^2 = 500 \\times 10^{-6} \\text{ m}^2$<br><br>$v_2 = 30 \\text{ cm/s} = 0.3 \\text{ m/s}$<br><br>Substituting the values:<br><br>$750 \\times 10^{-4} \\times v_1 = 500 \\times 10^{-6} \\times 0.3$<br><br>$v_1 = \\dfrac{150 \\times 10^{-6}}{750 \\times 10^{-4}}$<br><br>$v_1 = \\dfrac{1}{5} \\times 10^{-2} = 2 \\times 10^{-3} \\text{ m/s}$<br><br>Since $v_1 = \\dfrac{dh}{dt} = x \\times 10^{-3} \\text{ m/s}$, we get $x = 2$.<br><br>Answer: 2", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213460aee93fa0796d783", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "A gardening pipe having an internal radius ' $R$ ' is connected to a water sprinkler having ' $n$ ' holes each of radius ' $r$ '. The water in the pipe has a speed ' $v$ '. The speed of water leaving the sprinkler is", "image": null}, "options": [{"id": "vmPUs", "text": "$\\left(\\dfrac{\\mathrm{R}^2}{\\mathrm{r}^2}\\right) \\mathrm{nV}$", "image": null, "isCorrect": false}, {"id": "y6Je6", "text": "$\\dfrac{R^2 v}{n r^2}$", "image": null, "isCorrect": true}, {"id": "Hf0oA", "text": "$\\left(\\dfrac{\\mathrm{nr}^2}{\\mathrm{R}^2}\\right) \\mathrm{V}$", "image": null, "isCorrect": false}, {"id": "Kb4tk", "text": "$\\left(\\dfrac{n R^2}{r^2}\\right) V$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using the equation of continuity, the volume flow rate of water entering the pipe is equal to the volume flow rate of water leaving the sprinkler.<br><br>$A_1 v_1 = A_2 v_2$<br><br>Here, the area of the main pipe is $A_1 = \\pi R^2$ and the speed of water is $v_1 = v$.<br><br>The total area of the $n$ holes of the sprinkler is $A_2 = n \\pi r^2$ and let the speed of water leaving be $v_2 = v'$.<br><br>Substituting the values in the equation of continuity:<br><br>$\\pi R^2 v = n \\pi r^2 v'$<br><br>$v' = \\dfrac{R^2 v}{n r^2}$<br><br>Answer: $\\dfrac{R^2 v}{n r^2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213350aee93fa0796d6fb", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "A drum of radius '$R$' full of liquid of density '$d$' is rotated at angular velocity '$\\omega$' rad/s. The pressure difference between the wall and the centre of the drum will be", "image": null}, "options": [{"id": "PDYFD", "text": "$\\dfrac{\\omega^2 R^2 d}{2}$", "image": null, "isCorrect": true}, {"id": "8qYqp", "text": "$\\dfrac{\\omega^2 \\mathrm{Rd}}{2}$", "image": null, "isCorrect": false}, {"id": "KvPml", "text": "$\\dfrac{\\omega R d^2}{2}$", "image": null, "isCorrect": false}, {"id": "tyYcB", "text": "$\\dfrac{\\omega^2 \\mathrm{R}^2 \\mathrm{~d}^2}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Consider a small fluid element of thickness $dr$ and cross-sectional area $A$ at a distance $r$ from the axis of rotation.<br><br>Mass of the fluid element, $dm = d \\times A \\times dr$<br><br>The centripetal force required for this element to rotate is provided by the pressure difference $dp$ across it.<br><br>$A \\times dp = dm \\times \\omega^2 r$<br><br>$A \\times dp = (d \\times A \\times dr) \\times \\omega^2 r$<br><br>$dp = d \\times \\omega^2 r \\times dr$<br><br>Integrating from the centre ($r = 0$) to the wall ($r = R$):<br><br>$\\Delta p = \\int_{0}^{R} d \\times \\omega^2 r \\times dr$<br><br>$\\Delta p = d \\times \\omega^2 \\left[ \\dfrac{r^2}{2} \\right]_{0}^{R}$<br><br>$\\Delta p = \\dfrac{\\omega^2 R^2 d}{2}$<br><br>Answer: $\\dfrac{\\omega^2 R^2 d}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213230aee93fa0796d670", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "Glycerine of density $1.25 \\times 10^3 \\mathrm{~kg} / \\mathrm{m}^{3^4}$ is flowing in conical shaped horizontal pipe. Crosssectional area of the pipe at its both ends is $10 \\mathrm{~cm}^2$ and $5 \\mathrm{~cm}^2$ respectively. Pressure difference at both the ends is $3 \\mathrm{~N} / \\mathrm{m}^2$. Rate of flow of liquid in the pipe is", "image": null}, "options": [{"id": "ezHkJ", "text": "$4 \\times 10^{-5} \\mathrm{~m}^3 / \\mathrm{s}$", "image": null, "isCorrect": true}, {"id": "8LRws", "text": "$2 \\times 10^{-5} \\mathrm{~m}^3 / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "BSSxF", "text": "$5 \\times 10^{-5} \\mathrm{~m}^3 / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "ix4MP", "text": "$6 \\times 10^{-5} \\mathrm{~m}^3 / \\mathrm{s}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using the equation of continuity, $A_1 v_1 = A_2 v_2 = Q$, where $Q$ is the rate of flow.<br><br>$v_1 = \\dfrac{Q}{A_1}$ and $v_2 = \\dfrac{Q}{A_2}$<br><br>Using Bernoulli's theorem for a horizontal pipe:<br><br>$P_1 + \\dfrac{1}{2} \\rho v_1^2 = P_2 + \\dfrac{1}{2} \\rho v_2^2$<br><br>$P_1 - P_2 = \\dfrac{1}{2} \\rho (v_2^2 - v_1^2)$<br><br>$\\Delta P = \\dfrac{1}{2} \\rho Q^2 \\left( \\dfrac{1}{A_2^2} - \\dfrac{1}{A_1^2} \\right)$<br><br>Given:<br><br>$\\Delta P = 3 \\text{ N/m}^2$<br><br>$\\rho = 1.25 \\times 10^3 \\text{ kg/m}^3$<br><br>$A_1 = 10 \\text{ cm}^2 = 10^{-3} \\text{ m}^2$<br><br>$A_2 = 5 \\text{ cm}^2 = 5 \\times 10^{-4} \\text{ m}^2$<br><br>Substituting the values:<br><br>$3 = \\dfrac{1}{2} \\times 1.25 \\times 10^3 \\times Q^2 \\left( \\dfrac{1}{(5 \\times 10^{-4})^2} - \\dfrac{1}{(10^{-3})^2} \\right)$<br><br>$3 = \\dfrac{1}{2} \\times 1.25 \\times 10^3 \\times Q^2 \\left( \\dfrac{1}{25 \\times 10^{-8}} - \\dfrac{1}{10^{-6}} \\right)$<br><br>$3 = \\dfrac{1}{2} \\times 1.25 \\times 10^3 \\times Q^2 (4 \\times 10^6 - 1 \\times 10^6)$<br><br>$3 = \\dfrac{1}{2} \\times 1.25 \\times 10^3 \\times Q^2 \\times 3 \\times 10^6$<br><br>$1 = \\dfrac{1}{2} \\times 1.25 \\times 10^9 \\times Q^2$<br><br>$Q^2 = \\dfrac{2}{1.25 \\times 10^9} = \\dfrac{1.6}{10^9} = 16 \\times 10^{-10}$<br><br>$Q = 4 \\times 10^{-5} \\text{ m}^3/\\text{s}$<br><br>Answer: $4 \\times 10^{-5} \\mathrm{~m}^3 / \\mathrm{s}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213200aee93fa0796d657", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "A streamline flow of a liquid of density ' $\\rho$ ' is passing through a horizontal pipe of cross-sectional area $A_1$ and $A_2$ at two ends. If the pressure of liquid is ' P ' at a point where flow speed is ' $v$ ', then pressure at another point where the flow of speed becomes 3 v is", "image": null}, "options": [{"id": "YCV8v", "text": "$\\mathrm{P}-\\dfrac{3}{4} \\rho v^2$", "image": null, "isCorrect": false}, {"id": "LXT3a", "text": "$P-2 \\rho v^2$", "image": null, "isCorrect": false}, {"id": "tGl1c", "text": "$\\mathrm{P}-3 \\rho v^2$", "image": null, "isCorrect": false}, {"id": "uRmi5", "text": "$P-4 \\rho v^2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Using Bernoulli's equation for a horizontal pipe:<br><br>$P_1 + \\dfrac{1}{2}\\rho v_1^2 = P_2 + \\dfrac{1}{2}\\rho v_2^2$<br><br>Substituting the given values $P_1 = P$, $v_1 = v$, and $v_2 = 3v$:<br><br>$P + \\dfrac{1}{2}\\rho v^2 = P_2 + \\dfrac{1}{2}\\rho (3v)^2$<br><br>$P + \\dfrac{1}{2}\\rho v^2 = P_2 + \\dfrac{9}{2}\\rho v^2$<br><br>$P_2 = P + \\dfrac{1}{2}\\rho v^2 - \\dfrac{9}{2}\\rho v^2$<br><br>$P_2 = P - 4\\rho v^2$<br><br>Answer: $P-4 \\rho v^2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262660279619d9d8a3436", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "The potential energy of a molecule on the surface of a liquid compared to the molecules inside the liquid is", "image": null}, "options": [{"id": "v30eK", "text": "zero", "image": null, "isCorrect": false}, {"id": "Pv4u2", "text": "less", "image": null, "isCorrect": false}, {"id": "nfVRV", "text": "same", "image": null, "isCorrect": false}, {"id": "KoDf9", "text": "large", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "\\begin{array}{l|l|l|l|}  Std.12 & Ch-2 & Subtopic-2.4 \\end{array}", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262410279619d9d8a330f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "Venturimeter is used to", "image": null}, "options": [{"id": "DEUhG", "text": "measure liquid pressure.", "image": null, "isCorrect": false}, {"id": "2czkh", "text": "ṁeasure liquid density.", "image": null, "isCorrect": false}, {"id": "OFzqD", "text": "measure rate of flow of liquids.", "image": null, "isCorrect": true}, {"id": "yzfiV", "text": "measure surface tension.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A Venturi meter measures liquid flow in a pipe using a narrow section and works on the basis of Bernoulli's principle.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262300279619d9d8a3284", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "Select the WRONG statement from the following. In a streamline flow", "image": null}, "options": [{"id": "k1x3Q", "text": "velocity of a fluid at a given point is never constant.", "image": null, "isCorrect": true}, {"id": "LyiWV", "text": "velocity is smaller than critical velocity.", "image": null, "isCorrect": false}, {"id": "vhoJW", "text": "layers are always parallel.", "image": null, "isCorrect": false}, {"id": "MjH2K", "text": "the particles do not move in random direction.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In streamlined flow, the velocity of a fluid at a specific point is always constant because each particle of the fluid follows a well-defined path and there is no mixing or crossing of paths between particles.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261fa0279619d9d8a30d3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "A body of density ' $\\rho$ ' is dropped from rest at a height ' $h$ ' into a lake of density ' $\\sigma$ ' $(\\sigma>\\rho)$. The maximum depth to which the body sinks before returning to float on the surface is (neglect air dissipative forces)", "image": null}, "options": [{"id": "AA5oy", "text": "$\\frac{\\mathrm{h} \\rho}{(\\sigma-\\rho)}$", "image": null, "isCorrect": false}, {"id": "Pq2yo", "text": "$\\frac{h \\rho}{(\\sigma+\\rho)}$", "image": null, "isCorrect": false}, {"id": "UDtHI", "text": "$\\frac{h \\rho}{(\\rho-\\sigma)}$", "image": null, "isCorrect": true}, {"id": "Z41Av", "text": "$\\frac{2 h \\rho}{(\\sigma-\\rho)}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Initial velocity of the ball $=\\sqrt{2 \\text { gh }}$\nUpward force:\n$$\n\\begin{aligned}\n& F=\\sigma V g-\\rho V g \\\\\n& (\\rho V) a=V g(\\sigma-\\rho) \\\\\n\\therefore \\quad & a=\\frac{g(\\sigma-\\rho)}{\\rho}\n\\end{aligned}\n$$\n\nFinal velocity is zero when it sinks.\n$$\n\\begin{aligned}\n\\therefore \\quad & v^2-u^2=2 \\text { as } \\\\\n& 0-(\\sqrt{2 g h})^2=2 \\frac{g(\\sigma-\\rho)}{\\rho} H \\\\\n& H=\\frac{h \\rho}{(\\rho-\\sigma)}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261cf0279619d9d8a2f87", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "Water flows through a horizontal pipe at a speed ' $\\mathrm{V}$ '. Internal diameter of the pipe is ' $\\mathrm{d}$ '. If the water is coming out at a speed ' $V_1$ ' then the diameter of the nozzle is", "image": null}, "options": [{"id": "tu35n", "text": "$d \\sqrt{\\frac{V_1}{V}}$", "image": null, "isCorrect": false}, {"id": "LiGor", "text": "$d \\sqrt{\\frac{V}{V_1}}$", "image": null, "isCorrect": true}, {"id": "uwsVm", "text": "$\\frac{d V}{V_1}$", "image": null, "isCorrect": false}, {"id": "ykh0F", "text": "$\\frac{\\mathrm{V}_1}{\\mathrm{dV}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From equation of continuity,\n$\\begin{aligned}\n& \\mathrm{A}_1 \\mathrm{~V}_1=\\mathrm{A}_2 \\mathrm{~V}_2 \\\\\n& \\text { Given: } \\mathrm{V}_1=\\mathrm{V} \\text { and } \\mathrm{V}_2=\\mathrm{V}_1 \\\\\n& \\Rightarrow \\mathrm{A}_1 \\mathrm{~V}=\\mathrm{A}_2 \\mathrm{~V}_1 \\\\\n& \\frac{\\pi \\mathrm{d}^2}{4} \\mathrm{~V}=\\frac{\\pi \\mathrm{d}_{\\mathrm{n}}^2 \\mathrm{n}}{4} \\mathrm{~V}_1 \\quad \\ldots\\left(\\because \\mathrm{A}=\\frac{\\pi \\mathrm{d}^2}{4}\\right)\n\\end{aligned}$\nwhere $d_n$ is the diameter of the nozzle.\n$\\begin{aligned}\n& \\therefore \\quad \\mathrm{d}_{\\mathrm{n}}^2=\\mathrm{d}^2 \\frac{\\mathrm{V}}{\\mathrm{V}_1} \\\\\n& \\therefore \\quad \\mathrm{d}_{\\mathrm{n}}=\\mathrm{d} \\sqrt{\\frac{\\mathrm{V}}{\\mathrm{V}_1}}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261a90279619d9d8a2e58", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "Water is flowing through a horizontal pipe in stream line flow. At the narrowest part of the pipe", "image": null}, "options": [{"id": "Kt7Xj", "text": "velocity is maximum and pressure is minimum", "image": null, "isCorrect": true}, {"id": "oOvnj", "text": "pressure is maximum and velocity is minimum", "image": null, "isCorrect": false}, {"id": "OLnD2", "text": "both pressure and velocity are minimum", "image": null, "isCorrect": false}, {"id": "iIOfs", "text": "both pressure and velocity are maximum", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using equation of continuity,\n$\\mathrm{A}_1 \\mathrm{~V}_1=\\mathrm{A}_2 \\mathrm{~V}_2$\nIn streamlined flow, as the product of $\\mathrm{Av}$ is a constant, the velocity at the narrowest part will be maximum.\nBy using Bernoulli's principle,\n$\\mathrm{P}+\\frac{1}{2} \\rho v^2+\\rho g h=\\text { Constant }$\nWe see that $\\rho g h$ is constant because the pipe is horizontal.\nAs velocity increases, for the equation to remain constant, $\\mathrm{P}$ has to decrease.\n$\\therefore \\quad$ Velocity will be maximum and pressure is minimum", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2614a0279619d9d8a2b5c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "In a streamlined flow, the velocity of a fluid at a given point", "image": null}, "options": [{"id": "zIKbc", "text": "is always constant", "image": null, "isCorrect": true}, {"id": "HDdwG", "text": "does not remain constant", "image": null, "isCorrect": false}, {"id": "EPvUI", "text": "changes from low value to high value", "image": null, "isCorrect": false}, {"id": "6Z45d", "text": "changes from high value to low value", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "By definition, in a streamlined flow the velocity of flow at any chosen point in the liquid is always the same, i.e., it doesn't vary with time.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fd70279619d9d8a1fad", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "A closed pipe containing liquid showed a pressure ' $\\mathrm{P}_{1}$ ' by guage. When the valve is\nopened, pressure was reduced to ' $\\mathrm{P}_{2}$ '. The speed of water flowing out of the pipe\nis $[\\rho=$ density of water $]$", "image": null}, "options": [{"id": "UcrW9", "text": "$\\left[\\frac{2\\left(\\mathrm{P}_{1}+\\mathrm{P}_{2}\\right)}{\\rho}\\right]^{1 / 2}$", "image": null, "isCorrect": false}, {"id": "kCtiO", "text": "$\\left[\\frac{2\\left(\\mathrm{P}_{1}-\\mathrm{P}_{2}\\right)}{\\rho}\\right]^{1 / 2}$", "image": null, "isCorrect": true}, {"id": "8pIfL", "text": "$\\left[\\frac{\\rho}{2\\left(\\mathrm{P}_{1}-\\mathrm{P}_{2}\\right)}\\right]^{1 / 2}$", "image": null, "isCorrect": false}, {"id": "wK5pe", "text": "$\\left[\\frac{\\rho}{2\\left(\\mathrm{P}_{1}+\\mathrm{P}_{2}\\right)}\\right]^{1 / 2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(B)\nBy Bernoulli equation,\n$\\begin{aligned}\n& P_{1}=P_{2}+\\frac{1}{2} \\rho v^{2} \\\\\n\\therefore & P_{1}-P_{2}=\\frac{1}{2} \\rho v^{2} \\\\\n\\therefore \\quad v &=\\sqrt{\\frac{2\\left(P_{1}-P_{2}\\right)}{\\rho}}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f540279619d9d8a1b9b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "Water is flowing through a horizontal pipe of non-uniform cross-section. In the region of narrowest part inside the pipe, the water will have", "image": null}, "options": [{"id": "BENvw", "text": "maximum velocity and minimum pressure.", "image": null, "isCorrect": true}, {"id": "nHHnT", "text": "both the pressure and velocity maximum.", "image": null, "isCorrect": false}, {"id": "DWC6T", "text": "both the pressure and velocity minimum.", "image": null, "isCorrect": false}, {"id": "mxwZV", "text": "maximum pressure and minimum velocity.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "By equation of continuity\n$\\mathrm{A}_{1} \\mathrm{~V}_{1}=\\mathrm{A}_{2} \\mathrm{~V}_{2}$\nHence if area of cross-section decreases, the velocity increases.\nBy Bernoulli's equation\n$p+\\frac{1}{2} \\rho V^{2}=\\text { constant }$\n$\\therefore$ if $V$ increase pressure decreases.\nHence in the narrowest part, velocity is maximum and pressure is minimum.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f420279619d9d8a1b0a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}], "question": {"text": "Water flows through a horizontal pipe at a speed 'V'. Internal diameter of the pipe\nis 'd'. If the water is emerging at a speed ' $V_{1}$ ' then the diameter of the nozzle is", "image": null}, "options": [{"id": "tRR1C", "text": "$\\frac{\\mathrm{V}}{\\mathrm{V}_{1}}$", "image": null, "isCorrect": false}, {"id": "llNj5", "text": "$\\mathrm{d} \\sqrt{\\frac{\\mathrm{V}_{1}}{\\mathrm{~V}}}$", "image": null, "isCorrect": false}, {"id": "X1gff", "text": "$\\mathrm{d} \\sqrt{\\frac{\\mathrm{V}}{\\mathrm{V}_{1}}}$", "image": null, "isCorrect": true}, {"id": "9N9VW", "text": "$\\frac{\\mathrm{d} V_{1}}{\\mathrm{~V}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "By equation of continuity $A_{1} V_{1}=A_{2} V_{2}$\n$$\n\\begin{array}{l}\n\\therefore \\frac{\\mathrm{V}_{2}}{\\mathrm{~V}_{1}}=\\frac{\\mathrm{A}_{1}}{\\mathrm{~A}_{2}}=\\frac{\\mathrm{d}_{1}^{2}}{\\mathrm{~d}_{2}^{2}} \\\\\n\\therefore \\frac{\\mathrm{d}_{2}^{2}}{\\mathrm{~d}_{1}^{2}}=\\frac{\\mathrm{v}_{1}}{\\mathrm{v}_{2}} \\\\\n\\therefore \\frac{\\mathrm{d}_{2}}{\\mathrm{~d}_{1}}=\\sqrt{\\frac{\\mathrm{v}_{1}}{\\mathrm{v}_{2}}} \\\\\n\\therefore \\mathrm{d}_{2}=\\mathrm{d}_{1} \\sqrt{\\frac{\\mathrm{v}_{1}}{\\mathrm{v}_{2}}}=\\mathrm{d} \\sqrt{\\frac{\\mathrm{v}}{\\mathrm{v}_{1}}}\n\\end{array}\n$$\n$$\n\\therefore \\mathrm{A} \\propto \\mathrm{d}^{2}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ee60279619d9d8a182e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}], "question": {"text": "A metal sphere of radius ‘ <math><mi>R</mi></math> ’ and density ‘ <math><msub><mrow><mi>Q</mi></mrow><mrow><mn>1</mn></mrow></msub></math> ’ is dropped in a liquid of density ‘ <math><mi>σ</mi></math> ’ moves with terminal velocity ‘ <math><mi>V</mi></math> ’. Another metal sphere of same radius and density ‘ <math><msub><mrow><mi>Q</mi></mrow><mrow><mn>2</mn></mrow></msub></math> ’ is dropped in the same liquid, its terminal velocity will be", "image": null}, "options": [{"id": "8zuNI", "text": "<math><mi>V</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mrow><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>Q</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><mi>σ</mi></mrow></mfenced></mrow><mo>/</mo><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>Q</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><mi>σ</mi></mrow></mfenced></mrow></mrow></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "UZKup", "text": "<math><mi>V</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mrow><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>Q</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><mi>σ</mi></mrow></mfenced></mrow><mo>/</mo><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>Q</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><mi>σ</mi></mrow></mfenced></mrow></mrow></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "TvNb6", "text": "<math><mi>V</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mrow><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>Q</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>-</mo><mi>σ</mi></mrow></mfenced></mrow><mo>/</mo><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>Q</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><mi>σ</mi></mrow></mfenced></mrow></mrow></mrow></mfenced></math>", "image": null, "isCorrect": true}, {"id": "cIaYu", "text": "<math><mi>V</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mrow><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>Q</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><mi>σ</mi></mrow></mfenced></mrow><mo>/</mo><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>Q</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>-</mo><mi>σ</mi></mrow></mfenced></mrow></mrow></mrow></mfenced></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><msub><mrow><mi>V</mi></mrow><mrow><mi>T</mi></mrow></msub><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>9</mn></mrow></mfrac><mfrac><mrow><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup><mfenced separators=\"|\"><mrow><mi>δ</mi><mo>-</mo><mi>σ</mi></mrow></mfenced><mo>.</mo><mi>g</mi></mrow><mrow><mi>n</mi></mrow></mfrac></math>  <br/><math><mfrac><mrow><mi>V</mi></mrow><mrow><msub><mrow><mi>V</mi></mrow><mrow><mi>T</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mfrac><mrow><mn>2</mn></mrow><mrow><mn>9</mn></mrow></mfrac><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><mfrac><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>Q</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><mi>σ</mi></mrow></mfenced><mo>.</mo></mrow><mrow><mi>n</mi></mrow></mfrac><mi>g</mi></mrow><mrow><mfrac><mrow><mn>2</mn></mrow><mrow><mn>9</mn></mrow></mfrac><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><mfenced separators=\"|\"><mrow><msub><mrow><mi>Q</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>-</mo><mi>σ</mi></mrow></mfenced><mo>.</mo><mi>g</mi></mrow></mfrac><mo>&#8658;</mo><msub><mrow><mi>V</mi></mrow><mrow><mi>T</mi></mrow></msub><mo>=</mo><mfrac><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>Q</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>-</mo><mi>σ</mi></mrow></mfenced><mo>.</mo><mi>V</mi></mrow><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>Q</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><mi>σ</mi></mrow></mfenced></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f0b0279619d9d8a1952", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}], "question": {"text": "Two light balls are suspended as shown in figure. When a stream of air passes through the space between them, the distance between the balls will <br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/dd68ac82-2725-404c-aee1-ae19fbcc6ed8.png\">", "image": null}, "options": [{"id": "Q0H8H", "text": "Remain same", "image": null, "isCorrect": false}, {"id": "9Lw3f", "text": "Increase", "image": null, "isCorrect": false}, {"id": "BchBT", "text": "May increase or decrease, depending on speed of air", "image": null, "isCorrect": false}, {"id": "eWCcD", "text": "Decrease", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "When a stream of air passes through the space between the balls, the pressure reduces between them as compared to the atmospheric pressure on either side. So, according to Bernoulli’s theorem, the pressure energy should be constant and is compensated by movement of balls toward each other. So, the distance between the balls will decrease.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ece0279619d9d8a176d", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}], "question": {"text": "A vessel completely filled with water has holes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> at depths&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>h</mi></math> from the top respectively. The hole <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;is a square of side&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> is a circle of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>. The water flowing out per second from both the holes is same. Then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math> is equal to", "image": null}, "options": [{"id": "sqP0Q", "text": "<math><msup><mrow><mn>r</mn></mrow><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup><msup><mrow><mfenced separators=\"|\"><mrow><mi>π</mi></mrow></mfenced></mrow><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup><msup><mrow><mfenced separators=\"|\"><mrow><mn>3</mn></mrow></mfenced></mrow><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "wocwr", "text": "<math><mn>r</mn><msup><mrow><mfenced separators=\"|\"><mrow><mi>π</mi></mrow></mfenced></mrow><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac></mrow></msup><msup><mrow><mfenced separators=\"|\"><mrow><mn>3</mn></mrow></mfenced></mrow><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "mAoMh", rac> </msup> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>r</mtext> </mrow> </mfenced> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>3</mn> </mrow> </mfenced> </mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> </msup> </mrow> </mrow> </math><br /><math> <mrow> <mrow> <mtext>L</mtext> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>r</mtext> </mrow> </mfenced> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi>π</mi> </mrow> </mfenced> </mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </msup> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>3</mn> </mrow> </mfenced> </mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> </msup> </mrow> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e860279619d9d8a1522", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "Bernoulli's equation is conservation of", "image": null}, "options": [{"id": "K3cl9", "text": "energy", "image": null, "isCorrect": true}, {"id": "agp8o", "text": "momentum", "image": null, "isCorrect": false}, {"id": "mK6p9", "text": "angular momentum", "image": null, "isCorrect": false}, {"id": "mwnm4", "text": "mass", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Bernoulli's equation is conservation of energy.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "65a263210279619d9d8a3c32", "title": "Efflux of liquid", "totalQuestions": 6, "questions": [{"_id": "6abb88bc15a9fc0fc8c1467d", "type": "singleCorrect", "question": {"text": "A water tank of height $'h'$ has a hole at the bottom. It is completely filled with water. The total pressure at the bottom is $4H$ and atmospheric pressure is $H$. The velocity of water flowing out of the hole is ($\\rho$ = density of water)", "image": null}, "options": [{"id": "bfArD", "label": "A", "text": "$\\left(\\dfrac{6H}{\\rho}\\right)^{\\frac{1}{2}}$", "isCorrect": true, "image": null}, {"id": "ukwx3", "label": "B", "text": "$\\left(\\dfrac{H}{\\rho}\\right)^{\\frac{1}{2}}$", "isCorrect": false, "image": null}, {"id": "jg2ok", "label": "C", "text": "$\\left(\\dfrac{3H}{\\rho}\\right)^{\\frac{1}{2}}$", "isCorrect": false, "image": null}, {"id": "GKvfP", "label": "D", "text": "$\\left(\\dfrac{5H}{\\rho}\\right)^{\\frac{1}{2}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Total pressure at the bottom of the tank is given by the sum of atmospheric pressure and the pressure due to the water column.<br><br>$P_{total} = P_{atm} + \\rho g h$<br><br>Given $P_{total} = 4H$ and $P_{atm} = H$.<br><br>$4H = H + \\rho g h$<br><br>$\\rho g h = 3H$<br><br>Applying Bernoulli's principle between the top surface of the water and the hole at the bottom:<br><br>$P_{atm} + \\rho g h + 0 = P_{atm} + 0 + \\dfrac{1}{2}\\rho v^2$<br><br>$\\rho g h = \\dfrac{1}{2}\\rho v^2$<br><br>Substituting the value of $\\rho g h$:<br><br>$3H = \\dfrac{1}{2}\\rho v^2$<br><br>$v^2 = \\dfrac{6H}{\\rho}$<br><br>$v = \\left(\\dfrac{6H}{\\rho}\\right)^{\\dfrac{1}{2}}$<br><br>Answer: $\\left(\\dfrac{6H}{\\rho}\\right)^{\\frac{1}{2}}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a58c30a4553e1bdb45", "type": "singleCorrect", "question": {"text": "On opposite sides of a wide vertical vessel filled with water (density $\\rho$), two identical holes are drilled, each having cross-section area $A$. The height difference between holes is $x$. The resultant force of reaction of water flowing out of vessel is ($g$ = acceleration due to gravity)", "image": null}, "options": [{"id": "DTJr1", "label": "A", "text": "$\\rho A g x$", "isCorrect": false, "image": null}, {"id": "bAMAT", "label": "B", "text": "$2\\rho A g x$", "isCorrect": true, "image": null}, {"id": "mDjwN", "label": "C", "text": "$3\\rho A g x$", "isCorrect": false, "image": null}, {"id": "wbi0G", "label": "D", "text": "$4\\rho A g x$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the depth of the upper hole from the free surface of water be $h_1$ and the depth of the lower hole be $h_2$.<br><br>The velocity of efflux from the upper hole is $v_1 = \\sqrt{2gh_1}$ and from the lower hole is $v_2 = \\sqrt{2gh_2}$.<br><br>The force of reaction due to water flowing out from a hole is given by the rate of change of momentum, $F = v \\dfrac{dm}{dt} = \\rho A v^2$.<br><br>The reaction force from the upper hole is $F_1 = \\rho A (2gh_1) = 2\\rho A g h_1$.<br><br>The reaction force from the lower hole is $F_2 = \\rho A (2gh_2) = 2\\rho A g h_2$.<br><br>Since the holes are on opposite sides, the water jets emerge in opposite directions, meaning the reaction forces also act in opposite directions.<br><br>The resultant force of reaction is $F_{net} = F_2 - F_1 = 2\\rho A g (h_2 - h_1)$.<br><br>Given that the height difference between the holes is $x$, we have $h_2 - h_1 = x$.<br><br>Therefore, $F_{net} = 2\\rho A g x$.<br><br>Answer: $2\\rho A g x$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf7bf9280d7f9932e15", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A vessel completely filled with water has two holes 'P' and 'Q' at depths ' 2 h ' and ' 8 h ' from the top respectively. Hole ' P ' is square of side ' a ' and hole ' $Q$ ' is a circle of radius ' $r$ '. The water flowing out per second from both the holes is same, then side ' $a$ ' of hole ' $P$ ' is", "image": null}, "options": [{"id": "Hl2pK", "text": "$\\sqrt{2 \\pi r}$", "image": null, "isCorrect": false}, {"id": "LMRS3", "text": "$r \\sqrt{2 \\pi}$", "image": null, "isCorrect": true}, {"id": "HE6HZ", "text": "$2 \\sqrt{\\pi r}$", "image": null, "isCorrect": false}, {"id": "8cgzF", "text": "$2 \\pi r$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Velocity of efflux from hole P at depth $2h$ is $v_P = \\sqrt{2g(2h)} = 2\\sqrt{gh}$<br><br>Velocity of efflux from hole Q at depth $8h$ is $v_Q = \\sqrt{2g(8h)} = 4\\sqrt{gh}$<br><br>Area of square hole P is $A_P = a^2$<br><br>Area of circular hole Q is $A_Q = \\pi r^2$<br><br>Since the volume of water flowing out per second is the same for both holes:<br><br>$A_P v_P = A_Q v_Q$<br><br>$a^2 (2\\sqrt{gh}) = (\\pi r^2) (4\\sqrt{gh})$<br><br>$a^2 = 2\\pi r^2$<br><br>$a = r\\sqrt{2\\pi}$<br><br>Answer: $r \\sqrt{2 \\pi}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b66bf9280d7f99328d8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "There are two identical small holes on the opposite side of a tank containing full of a liquid. The tank is open at the top. The difference in height between the two holes is ' $h$ '. As the liquid comes out of the two holes, the tank will experience a net horizontal force proportional to\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/Dt9YM_clXvs84t6KEAHgfi73x1ImGdlJqZ4EFDiT5qQ.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "hGUSj", "text": "$h^{3 / 2}$", "image": null, "isCorrect": false}, {"id": "LKrih", "text": "$h^2$", "image": null, "isCorrect": false}, {"id": "Ce5XJ", "text": "$\\sqrt{\\mathrm{h}}$", "image": null, "isCorrect": false}, {"id": "iD2cV", "text": "h", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let the area of each hole be $A$ and the density of the liquid be $\rho$.<br><br>Let the depth of the upper hole from the free surface of the liquid be $h_1$ and that of the lower hole be $h_2$.<br><br>According to Torricelli's law, the velocity of efflux from the upper hole is $v_1 = \\sqrt{2gh_1}$ and from the lower hole is $v_2 = \\sqrt{2gh_2}$.<br><br>The horizontal force exerted on the tank due to the liquid coming out of a hole is equal to the rate of change of momentum of the escaping liquid:<br>$F = v \\dfrac{dm}{dt} = v (\\rho A v) = \\rho A v^2$<br><br>Force due to the upper hole:<br>$F_1 = \\rho A (\\sqrt{2gh_1})^2 = 2\\rho A g h_1$<br><br>Force due to the lower hole:<br>$F_2 = \\rho A (\\sqrt{2gh_2})^2 = 2\\rho A g h_2$<br><br>Since the holes are on opposite sides, the liquid jets emerge in opposite directions, causing the forces on the tank to act in opposite directions.<br><br>The net horizontal force on the tank is:<br>$F_{\\text{net}} = F_2 - F_1 = 2\\rho A g h_2 - 2\\rho A g h_1 = 2\\rho A g (h_2 - h_1)$<br><br>Given that the difference in height between the two holes is $h$, we have $h_2 - h_1 = h$.<br><br>Therefore, $F_{\\text{net}} = 2\\rho A g h$<br><br>Thus, the net horizontal force is directly proportional to $h$.<br><br>Answer: h", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fc80279619d9d8a1f38", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "A large open tank containing water has two holes to its wall. A square hole of side 'a' is made at a depth 'y' and a circular hole of radius 'r' is made at a depth '16y'from the surface of water. If equal amount of water comes out through both the holes per second, then the relation between 'r' and 'a' will be", "image": null}, "options": [{"id": "yQYO9", "text": "$r=\\frac{2 a}{\\pi}$", "image": null, "isCorrect": false}, {"id": "KCGdM", "text": "$r=\\frac{a}{2 \\sqrt{\\pi}}$", "image": null, "isCorrect": true}, {"id": "rnVlp", "text": "$r=\\frac{a}{2 \\pi}$", "image": null, "isCorrect": false}, {"id": "icW4S", "text": "$r=\\frac{2 a}{\\sqrt{\\pi}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(A)\n$v_{1} A_{1}=v_{2} A_{2}$\n$\\sqrt{2 g h_{1}} A_{1}=\\sqrt{2 g h_{2}} A_{2}$\n$\\sqrt{y} a^{2}=\\sqrt{16} y \\pi r^{2}$\n$a^{2}=4 \\pi r^{2}$\n$r=\\frac{a}{2 \\sqrt{\\pi}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f6a0279619d9d8a1c46", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}], "question": {"text": "A large vessel completely filled with water has two holes ' $A$ ' and ' $B$ ' at depths 'h' and '4h' from the top. Hole 'A' is a square of side 'L' and hole 'B' is circle of radius 'R'. If from both the holes same quanitity of water is flowing per second, then side of square hole is", "image": null}, "options": [{"id": "aOxta", "text": "$2 \\pi R$", "image": null, "isCorrect": false}, {"id": "z15my", "text": "$\\sqrt{2 \\pi \\mathbf{R}}$", "image": null, "isCorrect": false}, {"id": "sPVhd", "text": "$\\sqrt{2 \\pi} \\cdot \\mathrm{R}$", "image": null, "isCorrect": true}, {"id": "tHRvN", "text": "$\\frac{R}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The ratio of velocities of water is given by\n$\\begin{aligned}\n& \\frac{V_{A}}{V_{B}}=\\sqrt{\\frac{h}{4 h}}=\\frac{1}{2} \\\\\n\\therefore & V_{B}=2 V_{A}\n\\end{aligned}$\nQuantity of water flowing is same\n$\\begin{aligned}\n\\therefore \\mathrm{V}_{\\mathrm{A}} \\times \\mathrm{L}^{2} &=\\mathrm{V}_{\\mathrm{B}} \\times \\pi \\mathrm{R}^{2} \\\\\n\\therefore \\mathrm{V}_{\\mathrm{A}} \\mathrm{L}^{2} &=2 \\mathrm{~V}_{\\mathrm{A}} \\times \\pi \\mathrm{R}^{2} \\\\\n\\therefore \\quad \\mathrm{L}^{2} &=2 \\pi \\mathrm{R}^{2} \\\\\n\\mathrm{~L} &=\\sqrt{2 \\pi} \\cdot \\mathrm{R}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "65a263200279619d9d8a3c2d", "title": "Surface tension", "totalQuestions": 221, "questions": [{"_id": "6abb88ce15a9fc0fc8c14725", "type": "singleCorrect", "question": {"text": "$729$ water droplets of equal radii combine to form a big drop. The ratio of final surface energy to the total initial surface energy is", "image": null}, "options": [{"id": "g0lAh", "label": "A", "text": "$729:1$", "isCorrect": false, "image": null}, {"id": "hrKTQ", "label": "B", "text": "$8:1$", "isCorrect": false, "image": null}, {"id": "RZHAn", "label": "C", "text": "$1:81$", "isCorrect": false, "image": null}, {"id": "zFLie", "label": "D", "text": "$1:9$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let the radius of each small droplet be $r$ and the radius of the big drop be $R$.<br><br>Equating the initial and final volumes:<br><br>$\\dfrac{4}{3} \\pi R^3 = 729 \\times \\dfrac{4}{3} \\pi r^3$<br><br>$R^3 = 729 r^3$<br><br>$R = 9r$<br><br>The initial surface energy of $729$ droplets is:<br><br>$E_i = 729 \\times 4 \\pi r^2 T$<br><br>The final surface energy of the big drop is:<br><br>$E_f = 4 \\pi R^2 T = 4 \\pi (9r)^2 T = 81 \\times 4 \\pi r^2 T$<br><br>The ratio of final surface energy to the total initial surface energy is:<br><br>$\\dfrac{E_f}{E_i} = \\dfrac{81 \\times 4 \\pi r^2 T}{729 \\times 4 \\pi r^2 T} = \\dfrac{81}{729} = \\dfrac{1}{9}$<br><br>Answer: $1:9$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88cd15a9fc0fc8c1471b", "type": "singleCorrect", "question": {"text": "Water rises to a height of $2.2$ cm in glass capillary tube. The height to which water will rise in another capillary having one-fourth area of cross-section as that of the first is.", "image": null}, "options": [{"id": "UwOC9", "label": "A", "text": "$4.2$ cm", "isCorrect": false, "image": null}, {"id": "2KnlE", "label": "B", "text": "$4.4$ cm", "isCorrect": true, "image": null}, {"id": "Ml938", "label": "C", "text": "$3.4$ cm", "isCorrect": false, "image": null}, {"id": "J5e7S", "label": "D", "text": "$5.2$ cm", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The height of capillary rise is given by $h = \\dfrac{2T \\cos \\theta}{\\rho g r}$<br><br>This implies $h \\propto \\dfrac{1}{r}$<br><br>The area of cross-section is $A = \\pi r^2$<br><br>Given $A_2 = \\dfrac{A_1}{4}$, we get $r_2 = \\dfrac{r_1}{2}$<br><br>Therefore, $h_2 = h_1 \\times \\dfrac{r_1}{r_2} = 2.2 \\times 2 = 4.4$ cm<br><br>Answer: $4.4$ cm", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88cb15a9fc0fc8c1470b", "type": "singleCorrect", "question": {"text": "If a capillary tube is immersed in water, rise of water in capillary is $h_1$. When the whole arrangement is taken to a depth $d$ in a mine, the water level rises to $h_2$. The ratio $\\dfrac{h_2}{h_1}$ is (R=radius of earth)", "image": null}, "options": [{"id": "cEHJv", "label": "A", "text": "$\\dfrac{R+d}{4}$", "isCorrect": false, "image": null}, {"id": "0Kf4b", "label": "B", "text": "$\\dfrac{R-d}{R}$", "isCorrect": false, "image": null}, {"id": "2gDxH", "label": "C", "text": "$\\dfrac{R}{(R+d)}$", "isCorrect": false, "image": null}, {"id": "2DVQ0", "label": "D", "text": "$\\dfrac{R}{(R-d)}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The height of capillary rise is given by $h = \\dfrac{2T \\cos \\theta}{\\rho g r}$<br><br>This implies $h \\propto \\dfrac{1}{g}$<br><br>At the surface of the earth, acceleration due to gravity is $g_1 = g$<br><br>At a depth $d$ in a mine, acceleration due to gravity is $g_2 = g\\left(1 - \\dfrac{d}{R}\\right) = g\\left(\\dfrac{R-d}{R}\\right)$<br><br>The ratio of capillary rise is $\\dfrac{h_2}{h_1} = \\dfrac{g_1}{g_2}$<br><br>Substituting the values, we get $\\dfrac{h_2}{h_1} = \\dfrac{g}{g\\left(\\dfrac{R-d}{R}\\right)} = \\dfrac{R}{R-d}$<br><br>Answer: $\\dfrac{R}{(R-d)}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889b15a9fc0fc8c14547", "type": "singleCorrect", "question": {"text": "Which of the following is NOT TRUE?<br>a. When soluble substance is dissolved in water, the surface tension of water increases.<br>b. When sparingly soluble substance is mixed with water, surface tension of water increases.<br>c. When insoluble impurity is added into the water, surface tension of water decreases.<br>d. In case of molten copper or molten cadmium, the surface tension increases with increase in its temperature.", "image": null}, "options": [{"id": "yO73e", "label": "A", "text": "b", "isCorrect": true, "image": null}, {"id": "3lg0J", "label": "B", "text": "c", "isCorrect": false, "image": null}, {"id": "HHNJ7", "label": "C", "text": "a", "isCorrect": false, "image": null}, {"id": "6z9ri", "label": "D", "text": "d", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "When a highly soluble substance (like sodium chloride or sugar) is dissolved in water, the surface tension of water increases.<br><br>When a sparingly soluble substance (like phenol, soap, or camphor) is mixed with water, the surface tension of water decreases. Therefore, the statement that surface tension increases is incorrect.<br><br>When an insoluble impurity (like oil or grease) is added to water, the surface tension of water decreases.<br><br>For most liquids, surface tension decreases with an increase in temperature. However, molten copper and molten cadmium are exceptions where the surface tension increases with an increase in temperature.<br><br>Answer: b", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883c15a9fc0fc8c141c8", "type": "singleCorrect", "question": {"text": "A metal wire of length '$L$' and density '$d$' rests horizontally on the free surface of water. The maximum radius of the wire so that the
