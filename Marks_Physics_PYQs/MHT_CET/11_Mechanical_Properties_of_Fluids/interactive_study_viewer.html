herical object is falling under gravity through a viscous fluid. The sphere attains the terminal velocity when", "image": null}, "options": [{"id": "lw174", "label": "A", "text": "viscous force is zero.", "isCorrect": false, "image": null}, {"id": "EIz29", "label": "B", "text": "buoyant force is equal to force due to gravity", "isCorrect": false, "image": null}, {"id": "XJFdu", "label": "C", "text": "viscous force plus force of gravity becomes equal to buoyant force.", "isCorrect": false, "image": null}, {"id": "hcWdx", "label": "D", "text": "buoyant force plus viscous force becomes equal to force due to gravity.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "When a spherical object falls under gravity through a viscous fluid, three forces act on it:<br><br>1. Force due to gravity (weight) acting vertically downwards.<br>2. Buoyant force acting vertically upwards.<br>3. Viscous drag force acting vertically upwards (opposite to the direction of motion).<br><br>The object attains terminal velocity when its acceleration becomes zero, meaning the net force acting on it is zero.<br><br>For the net force to be zero, the total upward force must be equal to the total downward force.<br><br>Therefore, buoyant force plus viscous force becomes equal to the force due to gravity.<br><br>Answer: buoyant force plus viscous force becomes equal to force due to gravity.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b48c30a4553e1bdbef", "type": "singleCorrect", "question": {"text": "Two rain drops of same radius '$r$' falling with same terminal velocity '$V$' merge and form bigger drop of radius '$R$'. The terminal velocity of big drop is", "image": null}, "options": [{"id": "iXmgA", "label": "A", "text": "$\\dfrac{VR^2}{r^2}$", "isCorrect": true, "image": null}, {"id": "8juBI", "label": "B", "text": "$\\dfrac{2VR}{r}$", "isCorrect": false, "image": null}, {"id": "P9OF5", "label": "C", "text": "$\\dfrac{VR}{r}$", "isCorrect": false, "image": null}, {"id": "OdtJG", "label": "D", "text": "$Vr^2 / R^2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The terminal velocity of a spherical drop of radius $r$ falling through a viscous medium is given by Stokes' law:<br><br>$V = \\dfrac{2}{9} \\dfrac{r^2 (\\rho - \\sigma) g}{\\eta}$<br><br>From this relation, the terminal velocity is directly proportional to the square of the radius of the drop:<br><br>$V \\propto r^2$<br><br>For the smaller drop of radius $r$, the terminal velocity is $V$.<br><br>For the bigger drop of radius $R$, let the terminal velocity be $V'$.<br><br>Taking the ratio of their terminal velocities:<br><br>$\\dfrac{V'}{V} = \\dfrac{R^2}{r^2}$<br><br>$V' = \\dfrac{V R^2}{r^2}$<br><br>Answer: $\\dfrac{VR^2}{r^2}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b48c30a4553e1bdbe7", "type": "singleCorrect", "question": {"text": "A spherical ball of radius $1$ mm and density $10.5$ g/cc is dropped in glycerine of coefficient of viscosity $9.8$ poise and density $1.5$ g/cc. Viscous force on the ball when it attains constant velocity is $3696 \\times 10^{-x}$ N. The value of $x$ is<br>(Given, $g = 9.8 \\text{ m}/\\text{s}^2$ and $\\pi = \\dfrac{22}{7}$)", "image": null}, "options": [{"id": "27nTN", "label": "A", "text": "$5$", "isCorrect": false, "image": null}, {"id": "rM4V5", "label": "B", "text": "$6$", "isCorrect": false, "image": null}, {"id": "TLLnT", "label": "C", "text": "$7$", "isCorrect": true, "image": null}, {"id": "sSaRk", "label": "D", "text": "$8$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "When the spherical ball attains constant (terminal) velocity, the net force acting on it is zero. The downward weight of the ball is balanced by the upward buoyant force and the viscous force.<br><br>Viscous force $F_v = W - F_B$<br><br>$F_v = \\dfrac{4}{3}\\pi r^3 \\rho g - \\dfrac{4}{3}\\pi r^3 \\sigma g$<br><br>$F_v = \\dfrac{4}{3}\\pi r^3 (\\rho - \\sigma) g$<br><br>Given values in SI units:<br>$r = 1 \\text{ mm} = 10^{-3} \\text{ m}$<br>$\\rho = 10.5 \\text{ g/cc} = 10.5 \\times 10^3 \\text{ kg/m}^3$<br>$\\sigma = 1.5 \\text{ g/cc} = 1.5 \\times 10^3 \\text{ kg/m}^3$<br>$g = 9.8 \\text{ m/s}^2$<br><br>Substituting the values:<br><br>$F_v = \\dfrac{4}{3} \\times \\dfrac{22}{7} \\times (10^{-3})^3 \\times (10.5 \\times 10^3 - 1.5 \\times 10^3) \\times 9.8$<br><br>$F_v = \\dfrac{4}{3} \\times \\dfrac{22}{7} \\times 10^{-9} \\times 9000 \\times 9.8$<br><br>$F_v = 4 \\times 22 \\times 3000 \\times \\dfrac{9.8}{7} \\times 10^{-9}$<br><br>$F_v = 88 \\times 3000 \\times 1.4 \\times 10^{-9}$<br><br>$F_v = 88 \\times 4200 \\times 10^{-9}$<br><br>$F_v = 369600 \\times 10^{-9} \\text{ N}$<br><br>$F_v = 3696 \\times 10^{-7} \\text{ N}$<br><br>Comparing this with the given viscous force $3696 \\times 10^{-x} \\text{ N}$, we get:<br><br>$x = 7$<br><br>Answer: $7$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be8bf9280d7f9932d83", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Two spheres of different material are falling through liquid of density $2 \\times 10^3 \\mathrm{~kg} / \\mathrm{m}^3$ with same uniform speed. The density of sphere 1 and that of sphere 2 is $8 \\times 10^3 \\mathrm{~kg} / \\mathrm{m}^3$ and $11 \\times 10^3 \\mathrm{~kg} / \\mathrm{m}^3$ respectively. The ratio of their radii is (first to second sphere)", "image": null}, "options": [{"id": "MvqbJ", "text": "$\\sqrt{\\frac{3}{2}}$", "image": null, "isCorrect": true}, {"id": "cVqrN", "text": "$\\frac{11}{8}$", "image": null, "isCorrect": false}, {"id": "8manw", "text": "$\\sqrt{\\frac{11}{8}}$", "image": null, "isCorrect": false}, {"id": "YaTH4", "text": "$\\frac{3}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The terminal velocity of a sphere falling through a viscous liquid is given by Stokes' law:<br><br>$v = \\dfrac{2}{9} \\dfrac{r^2 (\\rho - \\sigma) g}{\\eta}$<br><br>Since both spheres fall with the same uniform speed, $v_1 = v_2$.<br><br>$\\dfrac{2}{9} \\dfrac{r_1^2 (\\rho_1 - \\sigma) g}{\\eta} = \\dfrac{2}{9} \\dfrac{r_2^2 (\\rho_2 - \\sigma) g}{\\eta}$<br><br>$r_1^2 (\\rho_1 - \\sigma) = r_2^2 (\\rho_2 - \\sigma)$<br><br>$\\dfrac{r_1^2}{r_2^2} = \\dfrac{\\rho_2 - \\sigma}{\\rho_1 - \\sigma}$<br><br>Substituting the given values $\\rho_1 = 8 \\times 10^3 \\mathrm{~kg/m}^3$, $\\rho_2 = 11 \\times 10^3 \\mathrm{~kg/m}^3$, and $\\sigma = 2 \\times 10^3 \\mathrm{~kg/m}^3$:<br><br>$\\dfrac{r_1^2}{r_2^2} = \\dfrac{11 \\times 10^3 - 2 \\times 10^3}{8 \\times 10^3 - 2 \\times 10^3}$<br><br>$\\dfrac{r_1^2}{r_2^2} = \\dfrac{9 \\times 10^3}{6 \\times 10^3} = \\dfrac{3}{2}$<br><br>$\\dfrac{r_1}{r_2} = \\sqrt{\\dfrac{3}{2}}$<br><br>Answer: $\\sqrt{\\frac{3}{2}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bc7bf9280d7f9932c4f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "125 small water drops of same size fall through air with constant velocity $4 \\mathrm{~cm} / \\mathrm{s}$. They coalesce to form a big drop. The terminal velocity of the big drop is", "image": null}, "options": [{"id": "TeR6I", "text": "$0.5 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "YmEas", "text": "$1 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": true}, {"id": "SAEeA", "text": "$1.5 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "eLxWN", "text": "$2.5 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $r$ be the radius of a small drop and $R$ be the radius of the big drop.<br><br>Since volume remains constant when $125$ drops coalesce:<br><br>$\\dfrac{4}{3}\\pi R^3 = 125 \\times \\dfrac{4}{3}\\pi r^3$<br><br>$R^3 = 125 r^3 \\Rightarrow R = 5r$<br><br>The terminal velocity of a drop of radius $r$ is given by $v = \\dfrac{2}{9} \\dfrac{r^2 (\\rho - \\sigma) g}{\\eta}$.<br><br>Thus, terminal velocity is directly proportional to the square of the radius ($v \\propto r^2$).<br><br>Let $V$ be the terminal velocity of the big drop.<br><br>$\\dfrac{V}{v} = \\left(\\dfrac{R}{r}\\right)^2$<br><br>$\\dfrac{V}{4} = (5)^2 = 25$<br><br>$V = 100 \\text{ cm/s} = 1 \\text{ m/s}$<br><br>Answer: $1 \\mathrm{~m} / \\mathrm{s}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba6bf9280d7f9932b3b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The velocity of small spherical ball of mass ' $m$ ' and density ' $d_1$ ', when dropped in a container filled with glycerine becomes constant after some time. The viscous force acting on the ball if density of glycerine is ' $\\mathrm{d}_2$ ' is", "image": null}, "options": [{"id": "dt22j", "text": "$\\mathrm{mg}\\left(1-\\frac{\\mathrm{d}_2}{\\mathrm{~d}_1}\\right)$", "image": null, "isCorrect": true}, {"id": "bMRq1", "text": "$\\operatorname{mg}\\left(1+\\frac{\\mathrm{d}_2}{\\mathrm{~d}_1}\\right)$", "image": null, "isCorrect": false}, {"id": "PRNpe", "text": "$\\mathrm{mg}\\left(1-\\frac{\\mathrm{d}_1}{\\mathrm{~d}_2}\\right)$", "image": null, "isCorrect": false}, {"id": "iZib5", "text": "$\\mathrm{mg}\\left(1+\\frac{\\mathrm{d}_1}{\\mathrm{~d}_2}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When the velocity of the ball becomes constant, it has achieved terminal velocity. At this stage, the net force acting on the ball is zero.<br><br>The forces acting on the ball are:<br>Downward weight of the ball, $W = mg$<br>Upward buoyant force, $U = V d_2 g$<br>Upward viscous force, $F_v$<br><br>Equating the forces:<br>$W = U + F_v$<br>$F_v = W - U$<br><br>Since mass $m = V d_1$, the volume of the ball is $V = \\dfrac{m}{d_1}$.<br><br>Substituting $V$ in the expression for buoyant force:<br>$U = \\left(\\dfrac{m}{d_1}\\right) d_2 g = mg \\left(\\dfrac{d_2}{d_1}\\right)$<br><br>Therefore, the viscous force is:<br>$F_v = mg - mg \\left(\\dfrac{d_2}{d_1}\\right) = mg \\left(1 - \\dfrac{d_2}{d_1}\\right)$<br><br>Answer: $\\mathrm{mg}\\left(1-\\frac{\\mathrm{d}_2}{\\mathrm{~d}_1}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b31bf9280d7f9932700", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Two raindrops reach the earth with different terminal velocities having the ratio $9: 4$. The ratio of their volumes is", "image": null}, "options": [{"id": "5Zstx", "text": "$\\frac{8}{27}$", "image": null, "isCorrect": false}, {"id": "lLzft", "text": "$\\frac{9}{4}$", "image": null, "isCorrect": false}, {"id": "BfWIg", "text": "$\\frac{3}{2}$", "image": null, "isCorrect": false}, {"id": "tDqDn", "text": "$\\frac{27}{8}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The terminal velocity of a spherical drop of radius $r$ is given by $v_t = \\dfrac{2}{9} \\dfrac{r^2 (\\rho - \\sigma) g}{\\eta}$.<br><br>Thus, $v_t \\propto r^2$.<br><br>Given $\\dfrac{v_{t1}}{v_{t2}} = \\dfrac{9}{4}$.<br><br>$\\dfrac{r_1^2}{r_2^2} = \\dfrac{9}{4} \\Rightarrow \\dfrac{r_1}{r_2} = \\dfrac{3}{2}$.<br><br>The volume of a spherical drop is $V = \\dfrac{4}{3} \\pi r^3$, which means $V \\propto r^3$.<br><br>The ratio of their volumes is $\\dfrac{V_1}{V_2} = \\left(\\dfrac{r_1}{r_2}\\right)^3 = \\left(\\dfrac{3}{2}\\right)^3 = \\dfrac{27}{8}$.<br><br>Answer: $\\frac{27}{8}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b0cbf9280d7f99325ed", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Water is flowing steadily in a river with a constant velocity gradient. A and B are the two layers of water at heights 40 cm and 90 cm from the bottom. The velocity of the layer A is $12 \\mathrm{~cm} / \\mathrm{s}$. The velocity of the layer B is", "image": null}, "options": [{"id": "ym8Qf", "text": "$15 \\mathrm{~cm} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "Qcrjp", "text": "$21 \\mathrm{~cm} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "Gvx6t", "text": "$27 \\mathrm{~cm} / \\mathrm{s}$", "image": null, "isCorrect": true}, {"id": "6Q7ux", "text": "$36 \\mathrm{~cm} / \\mathrm{s}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since the velocity gradient is constant, $\\dfrac{dv}{dy} = k$ (constant).<br><br>Integrating, we get $v = ky + c$. At the bottom of the river ($y = 0$), the velocity of water is zero ($v = 0$), which gives $c = 0$.<br><br>Thus, $v = ky$, which implies $v \\propto y$.<br><br>$\\dfrac{v_A}{y_A} = \\dfrac{v_B}{y_B}$<br><br>Substituting the given values $y_A = 40 \\text{ cm}$, $v_A = 12 \\text{ cm/s}$, and $y_B = 90 \\text{ cm}$:<br><br>$\\dfrac{12}{40} = \\dfrac{v_B}{90}$<br><br>$v_B = \\dfrac{12 \\times 90}{40} = 27 \\text{ cm/s}$<br><br>Answer: $27 \\mathrm{~cm} / \\mathrm{s}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b0abf9280d7f99325db", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "' n ' small water drops of same size (radius r ) fall through air with constant velocity V. They coalesce to form a big drop of radius R. The terminal velocity of the big drop is", "image": null}, "options": [{"id": "cJy04", "text": "$\\frac{\\mathrm{VR}^2}{\\mathrm{r}^2}$", "image": null, "isCorrect": true}, {"id": "JVcUk", "text": "$\\frac{\\mathrm{Vr}^2}{\\mathrm{R}^2}$", "image": null, "isCorrect": false}, {"id": "kjTQk", "text": "$\\frac{\\mathrm{VR}}{\\mathrm{r}}$", "image": null, "isCorrect": false}, {"id": "59T4M", "text": "$\\frac{\\mathrm{Vr}}{\\mathrm{R}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The terminal velocity of a spherical drop of radius $r$ falling through a viscous medium is given by Stokes' law:<br><br>$V = \\dfrac{2}{9} \\dfrac{r^2 (\\rho - \\sigma) g}{\\eta}$<br><br>From this relation, it is clear that the terminal velocity is directly proportional to the square of the radius of the drop.<br><br>$V \\propto r^2$<br><br>For the small drop of radius $r$, the terminal velocity is $V \\propto r^2$.<br><br>For the big drop of radius $R$, let the terminal velocity be $V'$. Then, $V' \\propto R^2$.<br><br>Taking the ratio of the two terminal velocities, we get:<br><br>$\\dfrac{V'}{V} = \\dfrac{R^2}{r^2}$<br><br>$V' = \\dfrac{V R^2}{r^2}$<br><br>Answer: $\\frac{\\mathrm{VR}^2}{\\mathrm{r}^2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792141b0aee93fa0796de0a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "The viscous force between two liquid layers is", "image": null}, "options": [{"id": "CjgAx", "text": "radial.", "image": null, "isCorrect": false}, {"id": "2PAVe", "text": "normal to the liquid surface.", "image": null, "isCorrect": false}, {"id": "SBX2K", "text": "tangential to the liquid surface.", "image": null, "isCorrect": true}, {"id": "MlT2i", "text": "neither purely tangential nor purely normal.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Viscous force is the internal frictional force that acts between adjacent layers of a fluid in relative motion.<br><br>It acts parallel or tangential to the surface of the liquid layers in order to oppose the relative velocity between them.<br><br>Therefore, the viscous force between two liquid layers is tangential to the liquid surface.<br><br>Answer: tangential to the liquid surface.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213f60aee93fa0796dce5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "A lead sphere of mass ' $m$ ' falls in viscous liquid with terminal velocity $\\mathrm{V}_0$. Another lead sphere of mass ' 8 m ' but of same material will fall through the same liquid with terminal velocity", "image": null}, "options": [{"id": "NjEMM", "text": "$\\mathrm{V}_0$", "image": null, "isCorrect": false}, {"id": "JrCJm", "text": "$8 \\mathrm{~V}_0$", "image": null, "isCorrect": false}, {"id": "1Rwud", "text": "$4 \\mathrm{~V}_0$", "image": null, "isCorrect": true}, {"id": "QEAPT", "text": "$64 \\mathrm{~V}_0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Terminal velocity of a spherical body of radius $r$ falling through a viscous liquid is given by<br><br>$V = \\dfrac{2}{9} \\dfrac{r^2 (\\rho - \\sigma) g}{\\eta}$<br><br>Since the material and liquid are the same, $V \\propto r^2$.<br><br>Mass of the sphere is $m = \\dfrac{4}{3} \\pi r^3 \\rho$<br><br>This implies $m \\propto r^3$, or $r \\propto m^{1/3}$.<br><br>Therefore, $V \\propto (m^{1/3})^2 \\Rightarrow V \\propto m^{2/3}$.<br><br>For the first sphere, $V_1 = V_0$ and $m_1 = m$.<br><br>For the second sphere, $m_2 = 8m$.<br><br>$\\dfrac{V_2}{V_1} = \\left( \\dfrac{m_2}{m_1} \\right)^{2/3} = \\left( \\dfrac{8m}{m} \\right)^{2/3} = (8)^{2/3} = 4$<br><br>$V_2 = 4V_0$<br><br>Answer: $4 \\mathrm{~V}_0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213f40aee93fa0796dcd2", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "Two rain drops of same radius are falling through air each with a steady speed of $5 \\mathrm{~cm} / \\mathrm{s}$. If the drops coalesce, the new steady velocity of big drop will be", "image": null}, "options": [{"id": "n0Tgu", "text": "$5 \\mathrm{~cm} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "fqapV", "text": "$5 \\sqrt{2} \\mathrm{~cm} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "mpmMx", "text": "$5 \\times 2^{1 / 3} \\mathrm{~cm} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "K57Uo", "text": "$5 \\times(4)^{1 / 3} \\mathrm{~cm} / \\mathrm{s}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $r$ be the radius of each small drop and $v$ be its terminal velocity.<br><br>The terminal velocity of a spherical drop of radius $r$ is given by $v = \\dfrac{2}{9} \\dfrac{r^2 (\\rho - \\sigma) g}{\\eta}$.<br><br>Thus, $v \\propto r^2$.<br><br>When two such drops coalesce to form a single big drop of radius $R$, the total volume remains conserved.<br><br>$\\dfrac{4}{3} \\pi R^3 = 2 \\times \\dfrac{4}{3} \\pi r^3$<br><br>$R^3 = 2r^3 \\Rightarrow R = 2^{1/3} r$<br><br>Let $V$ be the terminal velocity of the big drop. Since $V \\propto R^2$, we have:<br><br>$\\dfrac{V}{v} = \\left(\\dfrac{R}{r}\\right)^2 = \\left(2^{1/3}\\right)^2 = 2^{2/3} = 4^{1/3}$<br><br>$V = v \\times 4^{1/3}$<br><br>Given $v = 5 \\text{ cm/s}$, we get:<br><br>$V = 5 \\times (4)^{1/3} \\text{ cm/s}$<br><br>Answer: $5 \\times(4)^{1 / 3} \\mathrm{~cm} / \\mathrm{s}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213cf0aee93fa0796dbaf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "Two metal spheres are falling through a liquid of density $2.5 \\times 10^3 \\mathrm{~kg} / \\mathrm{m}^3$ with the same uniform speed. The density of material of first sphere and second sphere is $11.5 \\times 10^3 \\mathrm{~kg} / \\mathrm{m}^3$ and $8.5 \\times 10^3 \\mathrm{~kg} / \\mathrm{m}^3$ respectively. The ratio of the radius of first sphere to that of second sphere is", "image": null}, "options": [{"id": "PlQ3Q", "text": "$\\dfrac{2}{3}$", "image": null, "isCorrect": false}, {"id": "jz7Te", "text": "$\\sqrt{\\dfrac{2}{3}}$", "image": null, "isCorrect": true}, {"id": "q3lST", "text": "$\\dfrac{3}{2}$", "image": null, "isCorrect": false}, {"id": "XQVXw", "text": "$\\sqrt{\\dfrac{3}{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The terminal velocity of a sphere falling through a viscous liquid is given by $v = \\dfrac{2}{9} \\dfrac{r^2 (\\sigma - \\rho) g}{\\eta}$<br><br>Since both spheres fall with the same uniform speed, their terminal velocities are equal.<br><br>$v_1 = v_2$<br><br>$\\dfrac{2}{9} \\dfrac{r_1^2 (\\rho_1 - \\rho) g}{\\eta} = \\dfrac{2}{9} \\dfrac{r_2^2 (\\rho_2 - \\rho) g}{\\eta}$<br><br>$r_1^2 (\\rho_1 - \\rho) = r_2^2 (\\rho_2 - \\rho)$<br><br>$\\dfrac{r_1^2}{r_2^2} = \\dfrac{\\rho_2 - \\rho}{\\rho_1 - \\rho}$<br><br>Substituting the given values:<br><br>$\\dfrac{r_1^2}{r_2^2} = \\dfrac{8.5 \\times 10^3 - 2.5 \\times 10^3}{11.5 \\times 10^3 - 2.5 \\times 10^3}$<br><br>$\\dfrac{r_1^2}{r_2^2} = \\dfrac{6.0}{9.0} = \\dfrac{2}{3}$<br><br>$\\dfrac{r_1}{r_2} = \\sqrt{\\dfrac{2}{3}}$<br><br>Answer: $\\sqrt{\\dfrac{2}{3}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213be0aee93fa0796db29", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "A metal sphere of radius $R$, density $\\rho_1$ moves with terminal velocity $V_1$ through a liquid of density $\\sigma$. Another sphere of same radius but density $\\rho_2$ - moves through same liquid. Its terminal velocity is $\\mathrm{V}_2$. The ratio $\\mathrm{V}_1: \\mathrm{V}_2$ is", "image": null}, "options": [{"id": "clhS9", "text": "$\\left(\\rho_2+\\sigma\\right):\\left(\\rho_1-\\sigma\\right)$", "image": null, "isCorrect": false}, {"id": "Lu0xB", "text": "$\\left(\\rho_1+\\sigma\\right):\\left(\\rho_2-\\sigma\\right)$", "image": null, "isCorrect": false}, {"id": "v3Nh2", "text": "$\\left(\\rho_2-\\sigma\\right):\\left(\\rho_1-\\sigma\\right)$", "image": null, "isCorrect": false}, {"id": "aG1ro", "text": "$\\left(\\rho_1-\\sigma\\right):\\left(\\rho_2-\\sigma\\right)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The terminal velocity of a sphere of radius $R$ and density $\\rho$ falling through a liquid of density $\\sigma$ and coefficient of viscosity $\\eta$ is given by<br><br>$V = \\dfrac{2}{9} \\dfrac{R^2 (\\rho - \\sigma) g}{\\eta}$<br><br>For the first sphere, the terminal velocity is<br><br>$V_1 = \\dfrac{2}{9} \\dfrac{R^2 (\\rho_1 - \\sigma) g}{\\eta}$<br><br>For the second sphere, the terminal velocity is<br><br>$V_2 = \\dfrac{2}{9} \\dfrac{R^2 (\\rho_2 - \\sigma) g}{\\eta}$<br><br>Taking the ratio of the two terminal velocities, we get<br><br>$\\dfrac{V_1}{V_2} = \\dfrac{\\rho_1 - \\sigma}{\\rho_2 - \\sigma}$<br><br>Thus, $V_1 : V_2 = (\\rho_1 - \\sigma) : (\\rho_2 - \\sigma)$<br><br>Answer: $\\left(\\rho_1-\\sigma\\right):\\left(\\rho_2-\\sigma\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ab0aee93fa0796da9b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "Two identical drops of water are falling through air with steady velocity ' $V$ '. If the two drops come together to form a single drop. The new velocity of the single drop is", "image": null}, "options": [{"id": "uYlVS", "text": "$(2)^{1 / 3} \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "GXo0j", "text": "$\\quad(2)^{3 / 2} \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "BMAIZ", "text": "$\\quad(2)^{2 / 3} \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "CBJmb", "text": "$\\quad(2)^{1 / 4} \\mathrm{~V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The terminal velocity of a spherical drop of radius $r$ falling through a viscous medium is given by $V = \\dfrac{2}{9} \\dfrac{r^2 (\\rho - \\sigma) g}{\\eta}$.<br><br>Thus, the terminal velocity is directly proportional to the square of the radius, $V \\propto r^2$.<br><br>When two identical drops of radius $r$ combine to form a single drop of radius $R$, the total volume remains conserved.<br><br>$\\dfrac{4}{3} \\pi R^3 = 2 \\times \\dfrac{4}{3} \\pi r^3$<br><br>$R^3 = 2 r^3 \\Rightarrow R = 2^{1/3} r$<br><br>The new terminal velocity $V'$ of the combined drop is proportional to $R^2$.<br><br>$\\dfrac{V'}{V} = \\left(\\dfrac{R}{r}\\right)^2$<br><br>$\\dfrac{V'}{V} = \\left(2^{1/3}\\right)^2 = 2^{2/3}$<br><br>$V' = 2^{2/3} V$<br><br>Answer: $\\quad(2)^{2 / 3} \\mathrm{~V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792135c0aee93fa0796d82e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "A steel ball of radius 6 mm has a terminal speed of $12 \\mathrm{cms}^{-1}$ in a viscous liquid. What will be the terminal speed of a steel ball of radius 3 mm in the same liquid?", "image": null}, "options": [{"id": "7n3ab", "text": "$12 \\mathrm{cms}^{-1}$", "image": null, "isCorrect": false}, {"id": "XywZD", "text": "$9 \\mathrm{cms}^{-1}$", "image": null, "isCorrect": false}, {"id": "L7CaH", "text": "$6 \\mathrm{cms}^{-1}$", "image": null, "isCorrect": false}, {"id": "sQIDg", "text": "$3 \\mathrm{cms}^{-1}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The terminal velocity of a spherical body of radius $r$ in a viscous liquid is given by Stokes' law:<br><br>$v_t = \\dfrac{2}{9} \\dfrac{r^2 (\\rho - \\sigma) g}{\\eta}$<br><br>Since the material of the ball and the liquid are the same, $v_t \\propto r^2$.<br><br>$\\dfrac{v_2}{v_1} = \\left(\\dfrac{r_2}{r_1}\\right)^2$<br><br>Substituting the given values, $r_1 = 6 \\mathrm{\\ mm}$, $v_1 = 12 \\mathrm{\\ cms}^{-1}$, and $r_2 = 3 \\mathrm{\\ mm}$:<br><br>$\\dfrac{v_2}{12} = \\left(\\dfrac{3}{6}\\right)^2$<br><br>$\\dfrac{v_2}{12} = \\dfrac{1}{4}$<br><br>$v_2 = 3 \\mathrm{\\ cms}^{-1}$<br><br>Answer: $3 \\mathrm{cms}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792134b0aee93fa0796d7a5", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "A metal ball of radius $9 \\times 10^{-4} \\mathrm{~m}$ and density $10^4 \\mathrm{~kg} / \\mathrm{m}^3$ falls freely under gravity through a distance 'h' and erfters a tank of water. Considering that the metal ball has constant velocity, the value of h is [coefficient of viscosity of water $=8.1 \\times 10^{-4} \\mathrm{pa}-\\mathrm{s}, \\mathrm{g}=10 \\mathrm{~m} / \\mathrm{s}^2$ density of water $\\left.=10^3 \\mathrm{~kg} / \\mathrm{m}^3\\right]$", "image": null}, "options": [{"id": "fsjmb", "text": "20 m", "image": null, "isCorrect": true}, {"id": "zhOlf", "text": "18 m", "image": null, "isCorrect": false}, {"id": "diaTo", "text": "15 m", "image": null, "isCorrect": false}, {"id": "b9S5Z", "text": "12 m", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The terminal velocity of the spherical ball in water is given by:<br><br>$v_t = \\dfrac{2}{9} \\dfrac{r^2 (\\rho - \\sigma) g}{\\eta}$<br><br>Substituting the given values:<br><br>$v_t = \\dfrac{2}{9} \\dfrac{(9 \\times 10^{-4})^2 (10^4 - 10^3) \\times 10}{8.1 \\times 10^{-4}}$<br><br>$v_t = \\dfrac{2}{9} \\dfrac{81 \\times 10^{-8} \\times 9000 \\times 10}{8.1 \\times 10^{-4}}$<br><br>$v_t = \\dfrac{2}{9} \\times \\dfrac{729 \\times 10^{-4}}{8.1 \\times 10^{-4}}$<br><br>$v_t = \\dfrac{2}{9} \\times 90 = 20 \\text{ m/s}$<br><br>Since the ball falls freely through a height $h$ and enters the water with constant velocity, its velocity just before entering the water must be equal to the terminal velocity.<br><br>$v = \\sqrt{2gh} = v_t$<br><br>$\\sqrt{2 \\times 10 \\times h} = 20$<br><br>$20h = 400$<br><br>$h = 20 \\text{ m}$<br><br>Answer: 20 m", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262650279619d9d8a3432", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "By adding soluble impurity in a liquid, angle of contact", "image": null}, "options": [{"id": "eXoWk", "text": "decreases", "image": null, "isCorrect": true}, {"id": "oDwde", "text": "increases", "image": null, "isCorrect": false}, {"id": "PsNfa", "text": "remains unchanged", "image": null, "isCorrect": false}, {"id": "jJxOo", "text": "first increases and then decreases", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\begin{array}{|l|l|l|} \\hline Std.12 & Ch-2 & Subtopic-2.4 \\end{array}", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262300279619d9d8a3282", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "A spherical metal ball of radius ' $r$ ' falls through viscous liquid with velocity ' $\\mathrm{V}$ '. Another metal ball of same material but of radius $\\left(\\frac{\\mathrm{r}}{3}\\right)$ falls through same liquid, then its terminal velocity will be", "image": null}, "options": [{"id": "KVQCE", "text": "$\\frac{\\mathrm{V}}{3}$", "image": null, "isCorrect": false}, {"id": "7qpZK", "text": "$\\frac{\\mathrm{V}}{4}$", "image": null, "isCorrect": false}, {"id": "j94Lt", "text": "$\\frac{\\mathrm{V}}{6}$", "image": null, "isCorrect": false}, {"id": "BuBNb", "text": "$\\frac{\\mathrm{V}}{9}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\mathrm{v}=\\frac{2 \\mathrm{r}^2(\\rho-\\sigma) \\mathrm{g}}{9 \\Delta}\n$$\n$\\rho, \\sigma$ and $\\eta$ are constant\n$$\n\\Rightarrow \\mathrm{v} \\propto \\mathrm{r}^2\n$$\n\nThe ratio of terminal velocities is\n$$\n\\begin{aligned}\n\\frac{\\mathrm{v}_1}{\\mathrm{v}_2} & =\\frac{\\mathrm{r}_1^2}{\\mathrm{r}_2^2} \\\\\n\\frac{\\mathrm{v}_1}{\\mathrm{v}_2} & =\\frac{\\mathrm{r}^2}{\\left(\\frac{\\mathrm{r}}{3}\\right)^2} \\\\\n\\frac{\\mathrm{v}_1}{\\mathrm{v}_2} & =9 \\\\\n\\therefore \\quad \\mathrm{v}_2 & =\\frac{\\mathrm{v}}{9}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262080279619d9d8a3144", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "A fluid of density ' $\\rho$ ' is flowing through a uniform tube of diameter ' $\\mathrm{d}$ '. The coefficient of viscosity of the fluid is ' $\\eta$ ', then critical velocity of the fluid is", "image": null}, "options": [{"id": "5jLyq", "text": "inversely proportional to ' $\\eta$ '", "image": null, "isCorrect": false}, {"id": "SSQtd", "text": "directly proportional to ' $\\eta$ '", "image": null, "isCorrect": true}, {"id": "j9dPI", "text": "directly proportional to 'd'", "image": null, "isCorrect": false}, {"id": "KkNEo", "text": "directly proportional to ' $\\rho$ '", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The equation for critical velocity is given as:\n$\\mathrm{v}=\\mathrm{k} \\frac{\\eta}{\\rho \\mathrm{r}}$\n$\\therefore \\quad$ The critical velocity is directly proportional to $\\eta$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261e40279619d9d8a3025", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "A metal sphere of mass ' $m$ ' and density ' $\\sigma_1$ ' falls with terminal velocity through a container containing liquid. The density of liquid is ' $\\sigma_2$ '. The viscous force acting on the sphere is", "image": null}, "options": [{"id": "YxTRX", "text": "$m g\\left(1+\\frac{\\sigma_2}{\\sigma_1}\\right)$", "image": null, "isCorrect": false}, {"id": "wWC4n", "text": "$m g\\left(1-\\frac{\\sigma_1}{\\sigma_2}\\right)$", "image": null, "isCorrect": false}, {"id": "y8evy", "text": "$\\operatorname{mg}\\left(1-\\frac{\\sigma_2}{\\sigma_1}\\right)$", "image": null, "isCorrect": true}, {"id": "fdGWm", "text": "$\\operatorname{mg}\\left(1+\\frac{\\sigma_1}{\\sigma_2}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given: Mass of sphere $=\\mathrm{m}$, Density of sphere $=\\sigma_1$, Density of liquid $=\\sigma_2$.\n$\\mathrm{At}=\\mathrm{v}=\\mathrm{v}_{\\mathrm{t}}$,\nWeight of sphere $(\\mathrm{W})=$ Viscous Force $\\left(\\mathrm{F}_{\\mathrm{V}}\\right)+$ Buoyant Force due to the medium $\\left(\\mathrm{F}_{\\mathrm{B}}\\right)$\n$\\begin{aligned}\n\\Rightarrow \\mathrm{W} & =\\mathrm{F}_{\\mathrm{V}}+\\mathrm{F}_{\\mathrm{B}} \\\\\n\\mathrm{Mg} & =\\mathrm{F}_{\\mathrm{V}}+\\left(\\sigma_2 \\mathrm{~V}\\right) \\mathrm{g} \\quad \\ldots .(\\because \\mathrm{m}=\\mathrm{D} . \\mathrm{V}) \\\\\n\\therefore \\quad \\mathrm{F}_{\\mathrm{V}} & =\\mathrm{mg}-\\left(\\sigma_2 \\mathrm{~V}\\right) \\mathrm{g} \\\\\n& =\\mathrm{mg}\\left[1-\\frac{\\sigma_2 \\mathrm{~V}}{\\mathrm{~m}}\\right] \\\\\n& =\\mathrm{mg}\\left[1-\\frac{\\sigma_2 \\mathrm{~V}}{\\sigma_1 \\mathrm{~V}}\\right] \\\\\n& =\\mathrm{mg}\\left[1-\\frac{\\sigma_2}{\\sigma_1}\\right]\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261be0279619d9d8a2efe", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "A fluid of density ' $\\rho$ ' and viscosity ' $\\eta$ ' is flowing through a pipe of diameter ' $d$ ', with a velocity ' $v$ '. Reynold number is", "image": null}, "options": [{"id": "92WQ8", "text": "$\\frac{2 d \\rho v}{\\eta}$", "image": null, "isCorrect": false}, {"id": "pKdt9", "text": "$\\frac{\\mathrm{d} \\rho \\mathrm{v}}{\\eta}$", "image": null, "isCorrect": true}, {"id": "27G8P", "text": "$\\frac{d \\rho v}{\\eta^2}$", "image": null, "isCorrect": false}, {"id": "2D4aH", "text": "$\\frac{2 \\eta \\mathrm{dv}}{\\rho}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Std.12 | Ch-2 | Subtopic-2.6", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261740279619d9d8a2cb1", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "A spherical solid ball of volume $V$ is made up of material of density $\\rho$. It is falling through a liquid of density $\\sigma(\\sigma<\\rho)$. Assume that the liquid applies a viscous force on the ball that is proportional to square of the terminal speed $v_{\\mathrm{T}}, F=-K v_{\\mathrm{T}}^2, \\forall(K>0)$, then the terminal speed of the ball is ( $g=$ acceleration due to gravity)", "image": null}, "options": [{"id": "UvjiD", "text": "$\\left[\\frac{V g \\rho}{K}\\right]^{\\frac{1}{2}}$", "image": null, "isCorrect": false}, {"id": "NE6Zi", "text": "$\\left[\\frac{V g(\\rho-\\sigma)}{K}\\right]^{\\frac{1}{2}}$", "image": null, "isCorrect": false}, {"id": "1gjtN", "text": "$\\frac{V g(\\rho-\\sigma)}{K}$", "image": null, "isCorrect": true}, {"id": "7te9H", "text": "$\\frac{V g \\rho}{K}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The condition for terminal speed $v_{\\mathrm{T}}$ is given by,\nweight $(W)=$ buoyant force $(f)+$ viscous force $(F)$\nWe know, $W=\\rho V g, f=\\sigma V g$ and $F=K v_{\\mathrm{T}}^2$\n$\\therefore \\rho V g=\\sigma V g+K v_{\\mathrm{T}}^2$\n$v_{\\mathrm{T}}=\\sqrt{\\frac{(\\rho-\\sigma) V g}{K}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2615f0279619d9d8a2c06", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "When a liquid of density ' $\\rho$ ' flows through a tube of diameter ' $d$ ' with critical velocity ' $\\mathrm{V}$ ' then the Reynolds number is\n$\\text { ( } \\eta=\\text { coefficient of viscosity of liquid) }$", "image": null}, "options": [{"id": "9DK7m", "text": "$\\frac{\\eta \\rho}{V d}$", "image": null, "isCorrect": false}, {"id": "oKAYT", "text": "$\\frac{\\mathrm{Vd}}{\\rho \\eta}$", "image": null, "isCorrect": false}, {"id": "4kiAG", "text": "$\\frac{\\mathrm{Vpd}}{\\eta}$", "image": null, "isCorrect": true}, {"id": "WrnRI", "text": "$\\frac{V \\eta d}{\\eta}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Dimensionless number that helps to find the dominant force between inertial force and viscous force. It is defined as,\n$\\text { Reynold's number }=\\frac{\\text { inertial force }}{\\text { viscous force }}=\\left(\\frac{\\rho \\mathrm{Vd}}{\\eta}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2614f0279619d9d8a2b80", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "Two rain drops of same radius $r$ falling with terminal velocity $V$ merge and form bigger drop with radius $R$, terminal velocity is", "image": null}, "options": [{"id": "ePw3C", "text": "$\\frac{V R^2}{r^2}$", "image": null, "isCorrect": true}, {"id": "eCzNg", "text": "$\\frac{V R}{r}$", "image": null, "isCorrect": false}, {"id": "Rmma4", "text": "$\\frac{V r^2}{R^2}$", "image": null, "isCorrect": false}, {"id": "3btPW", "text": "$\\frac{2 V R}{r}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Expression for terminal velocity can be obtained by balancing weight of the droplet with viscous retardation force and the buoyancy force.\nTerminal velocity is given by $v=\\frac{2}{9}\\left(\\frac{r^2(\\rho-\\sigma)}{\\eta}\\right)$\n$\\therefore v \\propto r^2$\nNow, let $V^{\\prime}$ be the terminal velocity of the merged droplet\n$\\begin{aligned}\n& \\therefore \\frac{V}{V^{\\prime}}=\\frac{r^2}{R^2} \\\\\n& \\Rightarrow V^{\\prime}=\\frac{V R^2}{r^2}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2613b0279619d9d8a2ade", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "A lead sphere of mass' $m$ ' falls in a viscous liquid with terminal velocity ' $V$ ' Another lead sphere of mass ' $8 \\mathrm{~m}$ ' will fall through the same liquid with terminal velocity", "image": null}, "options": [{"id": "CSYMA", "text": "V", "image": null, "isCorrect": false}, {"id": "8yJbt", "text": "$64 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "vWpkn", "text": "$8 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "Nzaud", "text": "$4 \\mathrm{~V}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The terminal velocity is given by,\n$\\begin{aligned} & \\mathrm{V}_{\\mathrm{T}}=\\frac{2}{9} \\mathrm{r}^2 \\frac{(\\rho-\\sigma)}{\\eta} \\\\ & \\Rightarrow \\mathrm{V}_{\\mathrm{T}} \\propto \\mathrm{r}^2\\end{aligned}$\nwhere $r$ radius sphere\n$\\begin{aligned} & \\text { Mass } \\propto \\text { volume } \\Rightarrow \\frac{\\mathrm{m}_1}{\\mathrm{~m}_2}=\\frac{\\left(\\frac{4}{3} \\pi \\mathrm{r}_1^3\\right)}{\\left(\\frac{4}{3} \\pi \\mathrm{r}_2^3\\right)} \\Rightarrow \\frac{\\mathrm{m}}{8 \\mathrm{~m}}=\\frac{\\mathrm{r}_1^3}{\\mathrm{r}_2^3} \\\\ & \\Rightarrow \\frac{1}{8}=\\left(\\frac{\\mathrm{r}_1}{\\mathrm{r}_2}\\right)^3 \\Rightarrow \\frac{\\mathrm{r}_1}{\\mathrm{r}_2}=\\frac{1}{2} \\Rightarrow \\mathrm{r}_2=2 \\mathrm{r}_1 \\\\ & \\text { So } \\frac{\\mathrm{V}_{\\mathrm{T} 2}}{\\mathrm{~V}_{\\mathrm{T} 1}}=\\frac{\\mathrm{r}_2^2}{\\mathrm{r}_1^2}=4 \\Rightarrow \\mathrm{V}_{\\mathrm{T} 2}=4 \\mathrm{~V}_{\\mathrm{T} 1}=4 \\mathrm{~V}_{\\mathrm{T}}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261160279619d9d8a29b0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}], "question": {"text": "When a liquid flows through a tube, the Reynold's number is 900 , the flow of a liquid is", "image": null}, "options": [{"id": "WX5I6", "text": "turbulent.", "image": null, "isCorrect": false}, {"id": "1SeSB", "text": "changes from turbulent flow to a streamline flow.", "image": null, "isCorrect": false}, {"id": "QxjSv", "text": "streamline.", "image": null, "isCorrect": true}, {"id": "2qWvT", "text": "changes from a streamline flow to a turbulent flow.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Reynold number of liquid is 900 . The nature of liquid flow is streamlined.\nFor fully developed laminar flow $\\mathrm{Re}<2300$, transition region exists between $2300<\\operatorname{Re}<2900$ and for turbulent flow $2900<\\operatorname{Re}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261140279619d9d8a29a3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}], "question": {"text": "Eight identical small drops of water are falling down vertically through a medium, each with terminal velocity $v$. If they combine to form a single drop, then its terminal velocity will be", "image": null}, "options": [{"id": "RsrJT", "text": "$3 v$", "image": null, "isCorrect": false}, {"id": "5WyPO", "text": "$6 v$", "image": null, "isCorrect": false}, {"id": "28Vno", "text": "$5 v$", "image": null, "isCorrect": false}, {"id": "cQSFg", "text": "$4 v$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $R$, and $r$ be the radii of the big and small drops respectively. The volume of the big drop $=8 \\times$ volume of one small drops\n$\\begin{aligned} & \\therefore \\frac{4}{2} \\pi R^3=8 \\times \\frac{4}{3} \\pi r^3 \\\\ & \\therefore R^3=(2 r)^3 \\therefore R=2 r\\end{aligned}$\nThe terminal velocity of a drop $v \\propto(\\text { radius })^2$\n$\\begin{aligned} & \\therefore \\frac{V}{v}=\\frac{R^2}{r^2}=\\frac{(2 r)^2}{r^3}=4 \\\\ & \\therefore V=4 v\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261040279619d9d8a2923", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "A small ball of mass $M$, radius $R$ and density $\\rho$ moves with terminal velocity through a container filled with glycerine of density $\\sigma$. The viscous force acting on the ball is ( $g=$ gravitational acceleration)", "image": null}, "options": [{"id": "0LFNC", "text": "Мgрб", "image": null, "isCorrect": false}, {"id": "Ha2AG", "text": "$M g(\\rho-\\sigma)$", "image": null, "isCorrect": false}, {"id": "RZsRX", "text": "$M g\\left[1-\\frac{\\sigma}{\\rho}\\right]$", "image": null, "isCorrect": true}, {"id": "SnuV7", "text": "$\\frac{M g \\rho}{\\sigma}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Considering force balance on the ball falling with terminal velocity:\n$F_v+\\sigma V g=\\rho V g$\nwhere $F_v$ is the viscous force, $V$ is the volume of the ball.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/Tsp1Isk_rXMVT_tYbvqrjBB7wT3oetTwU7Z0UWujWV4.original.fullsize.png\">\nTaking the ratio of equation (1) and (2):\n$F_v=M g\\left(1-\\frac{\\sigma}{\\rho}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260c80279619d9d8a2741", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "' $n$ ' small drops of same size fall through air with constant velocity $5 \\mathrm{~cm} / \\mathrm{s}$. They coalesce to form a big drop. The terminal velocity of the big drop is", "image": null}, "options": [{"id": "qlq3v", "text": "$7 \\mathrm{n}^{2 / 3} \\mathrm{~cm} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "gKLDw", "text": "$5 \\mathrm{n}^{2 / 3} \\mathrm{~cm} / \\mathrm{s}$", "image": null, "isCorrect": true}, {"id": "57krs", "text": "$3 \\mathrm{n}^{2 / 3} \\mathrm{~cm} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "2HogH", "text": "$9 \\mathrm{n}^{2 / 3} \\mathrm{~cm} / \\mathrm{s}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\text { Volume }=\\frac{4}{3} \\pi r^3 n=\\frac{4}{3} \\pi R^3 \\\\\n& \\therefore \\mathrm{R}=\\mathrm{n}^{1 / 3} \\mathrm{r} \\therefore \\frac{\\mathrm{R}}{\\mathrm{r}}=\\mathrm{n}^{\\frac{1}{3}}\n\\end{aligned}\n$$\nTerminal velocity, $\\mathrm{v} \\propto \\mathrm{r}^2$\n$$\n\\begin{aligned}\n& \\frac{\\mathrm{v}_2}{\\mathrm{v}_1}=\\left(\\frac{\\mathrm{r}_2}{\\mathrm{r}_1}\\right)^2=\\left(\\frac{\\mathrm{R}}{\\mathrm{r}}\\right)^2=\\mathrm{n}^{2 / 3} \\\\\n& \\therefore \\mathrm{v}_2=\\mathrm{n}^{2 / 3} \\mathrm{v}_1=5 \\mathrm{n}^{2 / 3} \\mathrm{~m} / \\mathrm{s}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260a50279619d9d8a262f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "The speed of a ball of radius $2 \\mathrm{~cm}$ in a viscous liquid is $20 \\mathrm{~cm} / \\mathrm{s}$. What will be the speed of a ball of radius $1 \\mathrm{~cm}$ in same liquid?", "image": null}, "options": [{"id": "oBukO", "text": "$10 \\mathrm{~cm} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "zl3y6", "text": "$4 \\mathrm{~cm} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "NAg6o", "text": "$5 \\mathrm{~cm} / \\mathrm{s}$", "image": null, "isCorrect": true}, {"id": "1ziQk", "text": "$8 \\mathrm{~cm} / \\mathrm{s}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Terminal velocity $\\mathrm{V} \\propto \\mathrm{r}^2$\n$$\n\\begin{aligned}\n& \\therefore \\frac{\\mathrm{V}_2}{\\mathrm{~V}_1}=\\left(\\frac{\\mathrm{r}_2}{\\mathrm{r}_1}\\right)^2=\\left(\\frac{1}{2}\\right)^2=\\frac{1}{4} \\\\\n& \\therefore \\mathrm{V}_2=\\frac{\\mathrm{V}_1}{4}=\\frac{20}{4}=5 \\mathrm{~cm} / \\mathrm{s}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260950279619d9d8a25a9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "A glass tube of uniform cross-section is connected to a tap with a rubber tube. The tap is opened slowly. Initially the flow of water in the tube is streamline. The speed of flow of water to convert it into a turbulent flow is\n[radius of tube $=1 \\mathrm{~cm}, \\eta=1 \\times 10^{-3} \\frac{\\mathrm{Ns}}{\\mathrm{m}^2}, \\mathrm{R}_{\\mathrm{n}}=2500$ and density of water $=10^3 \\mathrm{~kg} / \\mathrm{m}^3$ ]", "image": null}, "options": [{"id": "4UIjB", "text": "0.15 m/s", "image": null, "isCorrect": false}, {"id": "aMXvc", "text": "0.125 m/s", "image": null, "isCorrect": true}, {"id": "yIcdX", "text": "0.3 m/s", "image": null, "isCorrect": false}, {"id": "syKX1", "text": "0.2 m/s", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Reynold number is given by\n$$\n\\begin{aligned}\n& \\mathrm{R}_{\\mathrm{n}}=\\frac{\\mathrm{v}_{\\mathrm{c}} \\rho \\mathrm{d}}{\\eta} \\\\\n& \\therefore \\mathrm{v}_{\\mathrm{c}}=\\frac{\\mathrm{R}_{\\mathrm{n}} \\eta}{\\rho \\mathrm{d}} \\\\\n& \\mathrm{R}_{\\mathrm{n}}=2500, \\eta=10^{-3} \\mathrm{Ns} / \\mathrm{m}^2, \\rho=10^3 \\mathrm{~kg} / \\mathrm{m}^3 \\\\\n& \\mathrm{~d}=2 \\mathrm{r}=2 \\mathrm{~cm}=2 \\times 10^{-2} \\mathrm{~m}\n\\end{aligned}\n$$\nSubstituting these values and calculating we get critical velocity $\\mathrm{v}_{\\mathrm{c}}=0.125 \\mathrm{~m} / \\mathrm{s}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260800279619d9d8a24fe", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "If the terminal speed of a sphere A [density $\\rho_A=7.5 \\mathrm{~kg} \\mathrm{~m}^{-3}$ ] is $0.4 \\mathrm{~ms}^{-1}$, in a viscous liquid [density $\\rho_{\\mathrm{L}}=1.5 \\mathrm{~kg} \\mathrm{~m}^{-3}$ ], the terminal speed of sphere $B$ [density $\\rho_B=3 \\mathrm{~kg} \\mathrm{~m}^{-3}$ ] of the same size in the same liquid is", "image": null}, "options": [{"id": "Ev4OO", "text": "$0.3 \\mathrm{~ms}^{-1}$", "image": null, "isCorrect": false}, {"id": "kvepq", "text": "$0.1 \\mathrm{~ms}^{-1}$", "image": null, "isCorrect": true}, {"id": "vsNEl", "text": "$0.2 \\mathrm{~ms}^{-1}$", "image": null, "isCorrect": false}, {"id": "PhUba", "text": "$0.04 \\mathrm{~ms}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Terminal speed is given by\n$$\n\\begin{aligned}\n& \\mathrm{V}=\\frac{2}{9} \\frac{\\mathrm{r}^2\\left(\\rho-\\rho_{\\mathrm{L}}\\right)}{\\eta} \\\\\n& \\therefore \\frac{\\mathrm{V}_{\\mathrm{A}}}{\\mathrm{V}_{\\mathrm{B}}}=\\frac{\\rho_{\\mathrm{A}}-\\rho_{\\mathrm{L}}}{\\rho_{\\mathrm{B}}-\\rho_{\\mathrm{L}}}=\\frac{7.5-1.5}{3-1.5}=\\frac{6}{1.5}=4 \\\\\n& \\therefore \\mathrm{V}_{\\mathrm{B}}=\\frac{\\mathrm{V}_{\\mathrm{A}}}{4}=\\frac{0.4}{4}=0.1 \\mathrm{~ms}^{-1}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2607f0279619d9d8a24f7", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "A ball rises to the surface of a liquid with constant velocity. The density of the liquid is four times the density of the material of the ball. The viscous force of the liquid on the rising ball is greater than the weight of the ball by a factor of", "image": null}, "options": [{"id": "2Eyky", "text": "4", "image": null, "isCorrect": false}, {"id": "2h4lb", "text": "3", "image": null, "isCorrect": true}, {"id": "yO81k", "text": "2", "image": null, "isCorrect": false}, {"id": "KgX55", "text": "5", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The ball is moving with constant velocity.\nHence the net force acting on it is zero.\nThe weight of the ball, $\\mathrm{W}=\\frac{4}{3} \\pi \\mathrm{r}^3 \\rho_{\\mathrm{b}} \\mathrm{g}$ (in downward direction)\nThe viscous force $F_v$ is in downward direction\nThe buoyant force $\\mathrm{F}_{\\mathrm{B}}=\\frac{4}{3} \\pi \\mathrm{r}^3 \\rho_{\\ell}$ g (in upward direction)\n$$\n\\begin{aligned}\n& \\therefore \\mathrm{F}_{\\mathrm{v}}+\\mathrm{W}=\\mathrm{F}_{\\mathrm{B}} \\\\\n& \\therefore \\mathrm{F}_{\\mathrm{v}}=\\mathrm{F}_{\\mathrm{B}}-\\mathrm{W} \\\\\n& =\\frac{4}{3} \\pi \\mathrm{r}^3 \\mathrm{~g}\\left(\\rho_{\\ell}-\\rho_{\\mathrm{b}}\\right)=\\frac{4}{3} \\pi \\mathrm{r}^3 \\mathrm{~g} \\times 3 \\rho_{\\mathrm{b}} \\quad\\left(\\because \\rho_{\\ell}=4 \\rho_{\\mathrm{b}}\\right) \\\\\n& \\therefore \\frac{\\mathrm{F}_{\\mathrm{v}}}{\\mathrm{W}}=3\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260490279619d9d8a2341", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "The velocity of a small ball of mass ' $M$ ' and density ' $\\mathrm{d}_1$ ' when dropped in a container filled with glycerin becomes constant after some time. If the density of glycerin is ' $\\mathrm{d}_2$ ', the viscous force acting on the ball is ( $\\mathrm{g}$ = acceleration due to gravity)", "image": null}, "options": [{"id": "REy5v", "text": "$\\operatorname{Mg} \\frac{\\mathrm{d}_1}{\\mathrm{~d}_2}$", "image": null, "isCorrect": false}, {"id": "QGwaq", "text": "$\\operatorname{Mgd}_1 \\mathrm{~d}_2$", "image": null, "isCorrect": false}, {"id": "otWMB", "text": "$\\operatorname{Mg}\\left(\\mathrm{d}_1-\\mathrm{d}_2\\right)$", "image": null, "isCorrect": false}, {"id": "IBZw4", "text": "$\\operatorname{Mg}\\left(1-\\frac{\\mathrm{d}_2}{\\mathrm{~d}_1}\\right)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Since the velocity is constant, the net force acting on the ball is zero.\n$$\n\\begin{aligned}\n& \\mathrm{F}_{\\mathrm{V}}+\\mathrm{F}_{\\mathrm{B}}=\\mathrm{Mg} \\\\\n& \\mathrm{F}_{\\mathrm{V}}+\\mathrm{Vd}_2 \\mathrm{~g}=\\mathrm{Mg}\n\\end{aligned}\n$$\n$$\n\\mathrm{F}_{\\mathrm{v}}+\\frac{\\mathrm{M}}{\\mathrm{d}_1} \\mathrm{~d}_2 \\mathrm{~g}=\\mathrm{Mg}\n$$\n$$\n\\mathrm{F}_{\\mathrm{V}}=\\mathrm{Mg}\\left(1-\\frac{\\mathrm{d}_2}{\\mathrm{~d}_1}\\right)\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260260279619d9d8a2223", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "A body of density $\\rho$ is dropped from (at rest) height ' $h$ ' into a lake of density ' $\\delta$ ' $(\\delta>\\rho)$. The maximum depth to which the body sinks before returning to float on the surface is [Neglect all dissipative forces]", "image": null}, "options": [{"id": "FgLtE", "text": "$\\frac{(\\delta-\\rho)}{2 h \\rho}$", "image": null, "isCorrect": false}, {"id": "zldfT", "text": "$\\frac{2 h \\rho}{(\\delta-\\rho)}$", "image": null, "isCorrect": false}, {"id": "LVNZE", "text": "$\\frac{h \\rho}{2(\\delta-\\rho)}$", "image": null, "isCorrect": false}, {"id": "j4a3V", "text": "$\\frac{h \\rho}{(\\delta-\\rho)}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The velocity of the body when it reaches the surface of the lake is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/0lP4IS-Iv7WDRjr9JNHLK3kSKtGhxm3lk0PANa5oEPs.original.fullsize.png\"><br>\n$$\n\\begin{aligned}\n& \\frac{\\mathrm{a}}{\\mathrm{g}}=\\frac{\\delta-\\rho}{\\rho} \\\\\n& \\therefore \\mathrm{a}=\\left(\\frac{\\delta-\\rho}{\\rho}\\right) \\mathrm{g}\n\\end{aligned}\n$$\nIf $a$ is the acceleration and retardation in the liquid then $\\mathrm{v}^2=2 \\mathrm{ad}$\nby eq. (1) and (4)\n$$\n\\begin{aligned}\n& 2 \\mathrm{ad}=2 \\mathrm{gh} \\\\\n& \\therefore \\mathrm{d}=\\frac{\\mathrm{g}}{\\mathrm{a}} \\mathrm{h} \\quad \\therefore \\mathrm{d}=\\frac{\\rho}{\\delta-\\rho} \\mathrm{h}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260000279619d9d8a20ee", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "A metal sphere of radius 'R', density ' $\\varrho_{1}$ ' moves with terminal velocity ' $\\mathrm{v}_{1}$ ' through\na liquid of density ' $\\sigma^{\\prime}$. Another sphere of same radius but of density ' $\\varrho_{2}$ ' moves\nthrough same liquid. Its terminal velocity will be", "image": null}, "options": [{"id": "iANrb", "text": "$\\left[\\frac{\\varrho_{1}-\\varrho_{2}}{\\sigma}\\right] \\mathrm{v}_{1}$", "image": null, "isCorrect": false}, {"id": "Ry0vZ", "text": "$\\left[\\frac{\\varrho_{2}+\\sigma}{\\varrho_{1}+\\sigma}\\right] \\mathrm{v}_{1}$", "image": null, "isCorrect": false}, {"id": "dWgqc", "text": "$\\left[\\frac{\\varrho_{1}+\\varrho_{2}}     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
