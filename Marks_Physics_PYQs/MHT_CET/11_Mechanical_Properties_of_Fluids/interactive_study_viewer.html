: true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3148c30a4553e1bdff4", "type": "singleCorrect", "question": {"text": "A soap bubble of radius R is blown. After heating the solution, a second bubble of radius 2R is blown. The work required to blow the second bubble in comparison to that required for the first bubble is", "image": null}, "options": [{"id": "OiKsH", "label": "A", "text": "slightly less than $4$ times", "isCorrect": true, "image": null}, {"id": "bbk2V", "label": "B", "text": "exactly double", "isCorrect": false, "image": null}, {"id": "cFoNB", "label": "C", "text": "slightly less than double", "isCorrect": false, "image": null}, {"id": "0htLg", "label": "D", "text": "slightly more than $4$ times", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The work done in blowing a soap bubble of radius $R$ is given by $W = 2 \\times 4\\pi R^2 \\times T = 8\\pi R^2 T$, where $T$ is the surface tension of the soap solution.<br><br>For the first bubble of radius $R$, the work done is $W_1 = 8\\pi R^2 T_1$.<br><br>For the second bubble of radius $2R$, the work done is $W_2 = 8\\pi (2R)^2 T_2 = 32\\pi R^2 T_2$.<br><br>The ratio of the work done is $\\dfrac{W_2}{W_1} = \\dfrac{32\\pi R^2 T_2}{8\\pi R^2 T_1} = 4 \\dfrac{T_2}{T_1}$.<br><br>When the solution is heated, its temperature increases. The surface tension of a liquid decreases with an increase in temperature, so $T_2 < T_1$.<br><br>Therefore, $\\dfrac{W_2}{W_1} < 4$, which means the work required to blow the second bubble is slightly less than $4$ times the work required for the first bubble.<br><br>Answer: slightly less than $4$ times", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3148c30a4553e1bdff3", "type": "singleCorrect", "question": {"text": "The excess pressure inside the first soap bubble of radius $R_1$ is three times that inside the second soap bubble of radius $R_2$. The ratio of volumes of the first bubble to second bubble is", "image": null}, "options": [{"id": "UQA6e", "label": "A", "text": "$1:3$", "isCorrect": false, "image": null}, {"id": "GIaaA", "label": "B", "text": "$1:6$", "isCorrect": false, "image": null}, {"id": "B90G8", "label": "C", "text": "$1:27$", "isCorrect": true, "image": null}, {"id": "Ddd90", "label": "D", "text": "$1:9$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The excess pressure inside a soap bubble of radius $R$ is given by $\\Delta P = \\dfrac{4T}{R}$.<br><br>Given that $\\Delta P_1 = 3\\Delta P_2$.<br><br>$\\dfrac{4T}{R_1} = 3 \\left(\\dfrac{4T}{R_2}\\right)$<br><br>$\\dfrac{R_1}{R_2} = \\dfrac{1}{3}$<br><br>The volume of a spherical bubble is $V = \\dfrac{4}{3}\\pi R^3$.<br><br>The ratio of their volumes is $\\dfrac{V_1}{V_2} = \\left(\\dfrac{R_1}{R_2}\\right)^3 = \\left(\\dfrac{1}{3}\\right)^3 = \\dfrac{1}{27}$.<br><br>Thus, the ratio of volumes is $1:27$.<br><br>Answer: $1:27$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2998c30a4553e1bdac6", "type": "singleCorrect", "question": {"text": "Determine the ratio of surface energy of $1$ large drop to $1$ small drop, if $1000$ small drops combined to form $1$ large drop.", "image": null}, "options": [{"id": "3r0sr", "label": "A", "text": "$100:1$", "isCorrect": true, "image": null}, {"id": "Nb08u", "label": "B", "text": "$10:1$", "isCorrect": false, "image": null}, {"id": "pXXn3", "label": "C", "text": "$1000:1$", "isCorrect": false, "image": null}, {"id": "vWPoT", "label": "D", "text": "$1:1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the radius of the small drop be $r$ and the radius of the large drop be $R$.<br><br>Since $1000$ small drops combine to form $1$ large drop, the total volume remains conserved.<br><br>$\\dfrac{4}{3}\\pi R^3 = 1000 \\times \\dfrac{4}{3}\\pi r^3$<br><br>$R^3 = 1000 r^3 \\Rightarrow R = 10r$<br><br>The surface energy of a drop is given by $E = T \\times A$, where $T$ is the surface tension and $A$ is the surface area.<br><br>Surface energy of $1$ large drop, $E_{L} = T \\times 4\\pi R^2$<br><br>Surface energy of $1$ small drop, $E_{S} = T \\times 4\\pi r^2$<br><br>The ratio of their surface energies is:<br><br>$\\dfrac{E_{L}}{E_{S}} = \\dfrac{T \\times 4\\pi R^2}{T \\times 4\\pi r^2} = \\left(\\dfrac{R}{r}\\right)^2$<br><br>Substituting $R = 10r$:<br><br>$\\dfrac{E_{L}}{E_{S}} = \\left(\\dfrac{10r}{r}\\right)^2 = 100$<br><br>The required ratio is $100:1$.<br><br>Answer: $100:1$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2988c30a4553e1bdac2", "type": "singleCorrect", "question": {"text": "A spherical drop of liquid splits into $1000$ identical spherical drops. If $u_i$ is the surface energy of the original drop and $u_f$ is the total surface energy of the resulting drops, the (ignoring evaporation). $u_f / u_i = (10/x)$. Then value of $x$ is", "image": null}, "options": [{"id": "iGQ5F", "label": "A", "text": "$1$", "isCorrect": true, "image": null}, {"id": "Gnjx8", "label": "B", "text": "$3$", "isCorrect": false, "image": null}, {"id": "2YlWF", "label": "C", "text": "$7$", "isCorrect": false, "image": null}, {"id": "GgaHf", "label": "D", "text": "$9$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the radius of the original drop be $R$ and the radius of each smaller drop be $r$.<br><br>Equating the initial and final volumes:<br><br>$\\dfrac{4}{3}\\pi R^3 = 1000 \\times \\dfrac{4}{3}\\pi r^3$<br><br>$R^3 = 1000 r^3 \\Rightarrow R = 10 r \\Rightarrow r = \\dfrac{R}{10}$<br><br>The initial surface energy is $u_i = T \\times 4\\pi R^2$.<br><br>The final total surface energy is $u_f = 1000 \\times T \\times 4\\pi r^2$.<br><br>Substituting $r = \\dfrac{R}{10}$:<br><br>$u_f = 1000 \\times T \\times 4\\pi \\left(\\dfrac{R}{10}\\right)^2 = 10 \\times T \\times 4\\pi R^2 = 10 u_i$<br><br>The ratio is $\\dfrac{u_f}{u_i} = 10$.<br><br>Given $\\dfrac{u_f}{u_i} = \\dfrac{10}{x}$, we get $x = 1$.<br><br>Answer: $1$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36b8c30a4553e1be386", "type": "singleCorrect", "question": {"text": "Two small drops of liquid of same radius coalesce to form a big drop. The ratio of the total surface energies after and before the change is", "image": null}, "options": [{"id": "e8PLB", "label": "A", "text": "$2 : 1$", "isCorrect": false, "image": null}, {"id": "9DJrZ", "label": "B", "text": "$\\sqrt{2} : 1$", "isCorrect": false, "image": null}, {"id": "hwPOg", "label": "C", "text": "$2^{-1/3} : 1$", "isCorrect": true, "image": null}, {"id": "sv1lU", "label": "D", "text": "$1 : 2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the radius of each small drop be $r$ and the radius of the big drop be $R$.<br><br>Equating the volumes before and after coalescing:<br><br>$\\dfrac{4}{3}\\pi R^3 = 2 \\times \\dfrac{4}{3}\\pi r^3$<br><br>$R = 2^{1/3}r$<br><br>The total surface energy of the two small drops before coalescing is:<br><br>$E_i = 2 \\times (4\\pi r^2 T) = 8\\pi r^2 T$<br><br>The total surface energy of the big drop after coalescing is:<br><br>$E_f = 4\\pi R^2 T = 4\\pi (2^{1/3}r)^2 T = 4\\pi \\times 2^{2/3} r^2 T$<br><br>The ratio of the total surface energies after and before the change is:<br><br>$\\dfrac{E_f}{E_i} = \\dfrac{4\\pi \\times 2^{2/3} r^2 T}{8\\pi r^2 T} = \\dfrac{2^{2/3}}{2} = 2^{-1/3}$<br><br>The ratio is $2^{-1/3} : 1$.<br><br>Answer: $2^{-1/3} : 1$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36b8c30a4553e1be385", "type": "singleCorrect", "question": {"text": "Three liquids have same surface tension and have densities $\\rho_1, \\rho_2$ and $\\rho_3$ $(\\rho_1 > \\rho_2 > \\rho_3)$. In three identical capillaries rise of liquid is same. The corresponding angles of contact $\\theta_1, \\theta_2$ and $\\theta_3$ are related as", "image": null}, "options": [{"id": "47CTZ", "label": "A", "text": "$\\theta_1 > \\theta_2 > \\theta_3$", "isCorrect": false, "image": null}, {"id": "aklGH", "label": "B", "text": "$\\theta_1 < \\theta_2 < \\theta_3$", "isCorrect": true, "image": null}, {"id": "s3GCA", "label": "C", "text": "$\\theta_1 = \\theta_2 = \\theta_3$", "isCorrect": false, "image": null}, {"id": "Ud98x", "label": "D", "text": "$\\theta_1 > \\theta_2 < \\theta_3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The height of capillary rise is given by the formula:<br><br>$h = \\dfrac{2T \\cos\\theta}{r \\rho g}$<br><br>Rearranging the formula for $\\cos\\theta$, we get:<br><br>$\\cos\\theta = \\dfrac{h r g}{2T} \\rho$<br><br>It is given that the surface tension $T$, capillary radius $r$, and capillary rise $h$ are the same for all three liquids. Therefore, the term $\\dfrac{h r g}{2T}$ is a constant.<br><br>This implies that $\\cos\\theta \\propto \\rho$.<br><br>Given the relation between the densities is $\\rho_1 > \\rho_2 > \\rho_3$, it follows that:<br><br>$\\cos\\theta_1 > \\cos\\theta_2 > \\cos\\theta_3$<br><br>For capillary rise, the angle of contact $\\theta$ is acute ($0 \\le \\theta < 90^\\circ$). In this interval, the cosine function is strictly decreasing, meaning a larger value of $\\cos\\theta$ corresponds to a smaller angle $\\theta$.<br><br>Thus, the relation between the angles of contact is:<br><br>$\\theta_1 < \\theta_2 < \\theta_3$<br><br>Answer: $\\theta_1 < \\theta_2 < \\theta_3$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36a8c30a4553e1be381", "type": "singleCorrect", "question": {"text": "The work done in splitting a water drop of radius 'R' into 64 droplets is (T is the surface tension of water)", "image": null}, "options": [{"id": "oV9dC", "label": "A", "text": "$8\\pi R^2 T$", "isCorrect": false, "image": null}, {"id": "7oiDB", "label": "B", "text": "$12\\pi R^2 T$", "isCorrect": true, "image": null}, {"id": "gguqY", "label": "C", "text": "$4\\pi R^2 T$", "isCorrect": false, "image": null}, {"id": "MvJQN", "label": "D", "text": "$16\\pi R^2 T$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the radius of the large drop be $R$ and the radius of each small droplet be $r$.<br><br>By conservation of volume:<br><br>$\\dfrac{4}{3}\\pi R^3 = 64 \\times \\dfrac{4}{3}\\pi r^3$<br><br>$R^3 = 64 r^3 \\Rightarrow r = \\dfrac{R}{4}$<br><br>Initial surface area of the drop:<br><br>$A_i = 4\\pi R^2$<br><br>Final surface area of 64 droplets:<br><br>$A_f = 64 \\times 4\\pi r^2 = 64 \\times 4\\pi \\left(\\dfrac{R}{4}\\right)^2 = 16\\pi R^2$<br><br>Change in surface area:<br><br>$\\Delta A = A_f - A_i = 16\\pi R^2 - 4\\pi R^2 = 12\\pi R^2$<br><br>Work done in splitting the drop:<br><br>$W = T \\Delta A = 12\\pi R^2 T$<br><br>Answer: $12\\pi R^2 T$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d35e8c30a4553e1be302", "type": "singleCorrect", "question": {"text": "A liquid drop having surface energy E is sprayed into $512$ droplets of the same size. Then the final surface energy is", "image": null}, "options": [{"id": "mkMcs", "label": "A", "text": "$4E$", "isCorrect": false, "image": null}, {"id": "NGhoG", "label": "B", "text": "$8E$", "isCorrect": true, "image": null}, {"id": "KsgTO", "label": "C", "text": "$2E$", "isCorrect": false, "image": null}, {"id": "mxlFZ", "label": "D", "text": "$E$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the radius of the initial drop be $R$ and the surface tension of the liquid be $T$.<br><br>The initial surface energy is given by $E = 4\\pi R^2 T$.<br><br>Let the radius of each of the $512$ smaller droplets be $r$. Since the total volume remains constant during the process:<br><br>$\\dfrac{4}{3}\\pi R^3 = 512 \\times \\dfrac{4}{3}\\pi r^3$<br><br>$R^3 = 512 r^3$<br><br>$R = 8r \\Rightarrow r = \\dfrac{R}{8}$<br><br>The final surface energy of the $512$ droplets is:<br><br>$E' = 512 \\times 4\\pi r^2 T$<br><br>Substituting $r = \\dfrac{R}{8}$:<br><br>$E' = 512 \\times 4\\pi \\left(\\dfrac{R}{8}\\right)^2 T$<br><br>$E' = 512 \\times \\dfrac{4\\pi R^2 T}{64}$<br><br>$E' = 8 \\times (4\\pi R^2 T)$<br><br>$E' = 8E$<br><br>Answer: $8E$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d35c8c30a4553e1be2e7", "type": "singleCorrect", "question": {"text": "In a capillary tube of radius 'R', a straight thin metal wire of radius 'r' is inserted symmetrically and one end of the combination is dipped vertically in water such that lower end of the capillary and thin wire are at same level. If 'T' is the surface tension of water and '$\\rho$' is the density of water then the rise of water in the capillary is", "image": null}, "options": [{"id": "fM96M", "label": "A", "text": "$\\dfrac{T}{(R-r)\\rho g}$", "isCorrect": false, "image": null}, {"id": "4e2lI", "label": "B", "text": "$\\dfrac{2T}{(R-r)\\rho g}$", "isCorrect": true, "image": null}, {"id": "vV3YE", "label": "C", "text": "$\\dfrac{4T}{(R+r)\\rho g}$", "isCorrect": false, "image": null}, {"id": "QIGhJ", "label": "D", "text": "$\\dfrac{T}{(R+r)\\rho g}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The upward force due to surface tension acts on the inner circumference of the capillary tube and the outer circumference of the inserted wire. Assuming the angle of contact to be zero, the total upward force is given by:<br><br>$F = T(2\\pi R) + T(2\\pi r) = 2\\pi T(R + r)$<br><br>The volume of the water raised in the annular space between the capillary and the wire is:<br><br>$V = \\pi(R^2 - r^2)h$<br><br>The weight of the raised water column is:<br><br>$W = V \\rho g = \\pi(R^2 - r^2)h \\rho g$<br><br>In equilibrium, the upward force due to surface tension balances the weight of the water column:<br><br>$2\\pi T(R + r) = \\pi(R^2 - r^2)h \\rho g$<br><br>$2T(R + r) = (R - r)(R + r)h \\rho g$<br><br>$h = \\dfrac{2T}{(R - r)\\rho g}$<br><br>Answer: $\\dfrac{2T}{(R-r)\\rho g}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d35c8c30a4553e1be2e6", "type": "singleCorrect", "question": {"text": "Due to surface tension, the excess pressure inside a smaller drop is $9$ units. If $27$ smaller drops combine then excess pressure inside the bigger drop is", "image": null}, "options": [{"id": "TPLUa", "label": "A", "text": "$3$ units", "isCorrect": true, "image": null}, {"id": "A3b8n", "label": "B", "text": "$9$ units", "isCorrect": false, "image": null}, {"id": "hy2Gp", "label": "C", "text": "$18$ units", "isCorrect": false, "image": null}, {"id": "IM6am", "label": "D", "text": "$6$ units", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Excess pressure inside a liquid drop of radius $r$ is given by $P = \\dfrac{2T}{r}$.<br><br>For the smaller drop, $P_1 = \\dfrac{2T}{r} = 9$ units.<br><br>When $27$ smaller drops combine to form a bigger drop of radius $R$, the total volume remains conserved.<br><br>$\\dfrac{4}{3}\\pi R^3 = 27 \\times \\dfrac{4}{3}\\pi r^3$<br><br>$R^3 = 27r^3 \\Rightarrow R = 3r$<br><br>The excess pressure inside the bigger drop is $P_2 = \\dfrac{2T}{R}$.<br><br>Substituting $R = 3r$, we get:<br><br>$P_2 = \\dfrac{2T}{3r} = \\dfrac{1}{3} \\left( \\dfrac{2T}{r} \\right)$<br><br>$P_2 = \\dfrac{1}{3} \\times 9 = 3$ units.<br><br>Answer: $3$ units", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf9bf9280d7f9932e23", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A spherical liquid drop splits in to 729 identical spherical drops. If $E$ is the surface energy of the original drop and $U$ is the total surface energy of resulting drops, then $\\frac{E}{U}=\\frac{1}{x}$. The value of $x$ is", "image": null}, "options": [{"id": "yf3kN", "text": "9", "image": null, "isCorrect": true}, {"id": "Jmp7Z", "text": "7", "image": null, "isCorrect": false}, {"id": "iKXnM", "text": "6", "image": null, "isCorrect": false}, {"id": "HHAjz", "text": "13", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $R$ be the radius of the original drop and $r$ be the radius of each of the $729$ small drops.<br><br>By conservation of volume:<br>$\\dfrac{4}{3}\\pi R^3 = 729 \\times \\dfrac{4}{3}\\pi r^3$<br><br>$R^3 = 729 r^3$<br><br>$R = 9r$<br><br>The surface energy of the original drop is:<br>$E = 4\\pi R^2 T$<br><br>The total surface energy of the $729$ small drops is:<br>$U = 729 \\times 4\\pi r^2 T$<br><br>The ratio of the surface energies is:<br>$\\dfrac{E}{U} = \\dfrac{4\\pi R^2 T}{729 \\times 4\\pi r^2 T} = \\dfrac{R^2}{729 r^2}$<br><br>Substituting $R = 9r$:<br>$\\dfrac{E}{U} = \\dfrac{(9r)^2}{729 r^2} = \\dfrac{81 r^2}{729 r^2} = \\dfrac{1}{9}$<br><br>Given $\\dfrac{E}{U} = \\dfrac{1}{x}$, we get $x = 9$.<br><br>Answer: 9", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf7bf9280d7f9932e11", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The liquid (mercury) meniscus in capillary tube will be convex if the angle of contact is", "image": null}, "options": [{"id": "WTeBP", "text": "greater than $90^{\\circ}$", "image": null, "isCorrect": true}, {"id": "7OSNB", "text": "less than $90^{\\circ}$", "image": null, "isCorrect": false}, {"id": "jTRDb", "text": "equal to $90^{\\circ}$", "image": null, "isCorrect": false}, {"id": "4OgRP", "text": "equal to $0^{\\circ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The shape of the liquid meniscus in a capillary tube depends on the angle of contact between the liquid and the solid surface.<br><br>If the angle of contact is acute (less than $90^{\\circ}$), the liquid wets the solid surface and the meniscus is concave.<br><br>If the angle of contact is obtuse (greater than $90^{\\circ}$), the liquid does not wet the solid surface and the meniscus is convex.<br><br>For mercury in a glass capillary tube, the angle of contact is obtuse (approximately $140^{\\circ}$), which is greater than $90^{\\circ}$. Therefore, its meniscus is convex.<br><br>Answer: greater than $90^{\\circ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be7bf9280d7f9932d7c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A paper disc of radius ' R ' from which a circular hole of radius ' r ' is cut out, is floating in a liquid of surface tension ' $T$ '. The force on the disc due to surface tension will be", "image": null}, "options": [{"id": "YbA3k", "text": "$2 \\pi(R+r) T$", "image": null, "isCorrect": true}, {"id": "eEqJl", "text": "$\\pi \\mathrm{RT}$", "image": null, "isCorrect": false}, {"id": "FMFjV", "text": "$\\pi(R+r) T$", "image": null, "isCorrect": false}, {"id": "FBlTS", "text": "$4 \\pi(R+r) T$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The force due to surface tension acts along the boundary of the object in contact with the liquid surface.<br><br>For a paper disc of radius $R$ with a circular hole of radius $r$ cut out, there are two boundaries in contact with the liquid:<br>1. The outer boundary of length $2\\pi R$<br>2. The inner boundary of length $2\\pi r$<br><br>The total length of the boundary in contact with the liquid is:<br>$L = 2\\pi R + 2\\pi r = 2\\pi(R+r)$<br><br>The total force on the disc due to surface tension is:<br>$F = T \\times L$<br><br>$F = T \\times 2\\pi(R+r) = 2\\pi(R+r)T$<br><br>Answer: $2 \\pi(R+r) T$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bdabf9280d7f9932d04", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "When one end of the capillary is dipped in water, the height of water column is ' $h$ '. The upward force of 108 dyne due to surface tension is balanced by the force due to the weight of water column. The inner circumference of the capillary is\n(surface tension of water $=7.2 \\times 10^{-2} \\mathrm{~N} / \\mathrm{m}$ )", "image": null}, "options": [{"id": "oeUVW", "text": "3 cm", "image": null, "isCorrect": false}, {"id": "qNMCA", "text": "2.5 cm", "image": null, "isCorrect": false}, {"id": "ESQtH", "text": "1.8 cm", "image": null, "isCorrect": false}, {"id": "dIwEM", "text": "1.5 cm", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Surface tension in CGS units is $T = 7.2 \\times 10^{-2} \\text{ N/m} = 7.2 \\times 10^{-2} \\times 10^{3} \\text{ dyne/cm} = 72 \\text{ dyne/cm}$<br><br>The upward force due to surface tension is given by $F = T \\times L \\times \\cos \\theta$<br><br>For water, the angle of contact $\\theta = 0^{\\circ}$, so $\\cos \\theta = 1$<br><br>Given $F = 108 \\text{ dyne}$<br><br>$108 = 72 \\times L$<br><br>$L = \\dfrac{108}{72} = 1.5 \\text{ cm}$<br><br>Answer: 1.5 cm", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bd8bf9280d7f9932cf2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Under isothermal conditions, two soap bubbles of radii $r_1$ and $r_2$ coalesce in vacuum to form a big bubble. The radius of the big bubble is", "image": null}, "options": [{"id": "M62rq", "text": "$\\left(r_1+r_2\\right)^{\\frac{1}{2}}$", "image": null, "isCorrect": false}, {"id": "IDNe3", "text": "$\\left(r_1+r_2\\right)^2$", "image": null, "isCorrect": false}, {"id": "MxkGe", "text": "$\\left(r_1^2+r_2^2\\right)^{\\frac{1}{2}}$", "image": null, "isCorrect": true}, {"id": "vXuNu", "text": "$\\left(r_1+r_2\\right)^3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $P_1$ and $P_2$ be the pressures inside the two soap bubbles, and $V_1$ and $V_2$ be their respective volumes.<br><br>Since the bubbles are in a vacuum, the external pressure is zero. The pressure inside a soap bubble of radius $r$ is given by $P = \\dfrac{4T}{r}$, where $T$ is the surface tension of the soap solution.<br><br>The volume of a bubble of radius $r$ is $V = \\dfrac{4}{3}\\pi r^3$.<br><br>Assuming the gas inside behaves ideally, the number of moles of gas is $n = \\dfrac{PV}{R_g T_0}$, where $R_g$ is the universal gas constant and $T_0$ is the absolute temperature.<br><br>When the two bubbles coalesce under isothermal conditions, the total number of moles of gas is conserved:<br><br>$n_1 + n_2 = n$<br><br>$\\dfrac{P_1 V_1}{R_g T_0} + \\dfrac{P_2 V_2}{R_g T_0} = \\dfrac{P V}{R_g T_0}$<br><br>$P_1 V_1 + P_2 V_2 = P V$<br><br>Substituting the expressions for pressure and volume:<br><br>$\\left(\\dfrac{4T}{r_1}\\right) \\left(\\dfrac{4}{3}\\pi r_1^3\\right) + \\left(\\dfrac{4T}{r_2}\\right) \\left(\\dfrac{4}{3}\\pi r_2^3\\right) = \\left(\\dfrac{4T}{R}\\right) \\left(\\dfrac{4}{3}\\pi R^3\\right)$<br><br>Simplifying the equation, we get:<br><br>$r_1^2 + r_2^2 = R^2$<br><br>$R = \\left(r_1^2 + r_2^2\\right)^{\\dfrac{1}{2}}$<br><br>Answer: $\\left(r_1^2+r_2^2\\right)^{\\frac{1}{2}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bd6bf9280d7f9932ce5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The work done in splitting a water drop of radius $R$ in to 64 droplets is ( $\\mathrm{T}=$ surface tension of water)", "image": null}, "options": [{"id": "5gjz3", "text": "$6 \\pi \\mathrm{TR}^2$", "image": null, "isCorrect": false}, {"id": "FqZda", "text": "$24 \\pi \\mathrm{TR}^2$", "image": null, "isCorrect": false}, {"id": "28Ncu", "text": "$12 \\pi \\mathrm{TR}^2$", "image": null, "isCorrect": true}, {"id": "k0cRP", "text": "$16 \\pi \\mathrm{TR}^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $R$ be the radius of the large drop and $r$ be the radius of each of the $64$ small droplets.<br><br>Since the total volume remains constant during the splitting process:<br><br>$\\dfrac{4}{3} \\pi R^3 = 64 \\times \\dfrac{4}{3} \\pi r^3$<br><br>$R^3 = 64 r^3 \\Rightarrow r = \\dfrac{R}{4}$<br><br>Initial surface area of the large drop:<br><br>$A_i = 4 \\pi R^2$<br><br>Final surface area of the $64$ small droplets:<br><br>$A_f = 64 \\times 4 \\pi r^2 = 64 \\times 4 \\pi \\left(\\dfrac{R}{4}\\right)^2 = 16 \\pi R^2$<br><br>Change in surface area:<br><br>$\\Delta A = A_f - A_i = 16 \\pi R^2 - 4 \\pi R^2 = 12 \\pi R^2$<br><br>The work done in splitting the drop is given by the product of surface tension and the change in surface area:<br><br>$W = \\mathrm{T} \\Delta A = 12 \\pi \\mathrm{T} R^2$<br><br>Answer: $12 \\pi \\mathrm{TR}^2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bc9bf9280d7f9932c63", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Let $R_1, R_2$ and $R_3$ be the radii of three mercury drops. $A$ big mercury drop is formed from them under isothermal conditions. The radius of the resultant drop is", "image": null}, "options": [{"id": "6YqR4", "text": "$\\left(R_1^3+R_2^3+R_3^3\\right)^{\\frac{1}{3}}$", "image": null, "isCorrect": true}, {"id": "OFSdT", "text": "$\\left(R_1^2+R_2^3-R_3^3\\right)^{\\frac{1}{3}}$", "image": null, "isCorrect": false}, {"id": "zNe0B", "text": "$\\left(R_1^3+R_2^3+R_3^3\\right)$", "image": null, "isCorrect": false}, {"id": "ubc7f", "text": "$\\left(R_1+R_2+R_3\\right)^3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $R$ be the radius of the resultant big drop.<br><br>Since the drops combine under isothermal conditions, the total volume of the mercury remains conserved.<br><br>Volume of the big drop = Sum of the volumes of the three smaller drops<br><br>$\\dfrac{4}{3}\\pi R^3 = \\dfrac{4}{3}\\pi R_1^3 + \\dfrac{4}{3}\\pi R_2^3 + \\dfrac{4}{3}\\pi R_3^3$<br><br>$R^3 = R_1^3 + R_2^3 + R_3^3$<br><br>$R = \\left(R_1^3 + R_2^3 + R_3^3\\right)^{\\dfrac{1}{3}}$<br><br>Answer: $\\left(R_1^3+R_2^3+R_3^3\\right)^{\\frac{1}{3}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bc6bf9280d7f9932c4b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A capillary tube when immersed vertically in water, the rise of water column is upto height $h_1$ on earth's surface. When this arrangement is taken into a mine of depth ' d ', below earth's surface, the height of the water column is $h_2$. If $R$ is the radius of the earth, the ratio $\\frac{h_2}{h_1}$ is", "image": null}, "options": [{"id": "svBNc", "text": "$\\frac{\\mathrm{R}+\\mathrm{d}}{\\mathrm{R}}$", "image": null, "isCorrect": false}, {"id": "0xIiG", "text": "$\\frac{\\mathrm{R}-\\mathrm{d}}{\\mathrm{R}}$", "image": null, "isCorrect": false}, {"id": "opz0f", "text": "$\\frac{R}{R+d}$", "image": null, "isCorrect": false}, {"id": "b0WX7", "text": "$\\frac{\\mathrm{R}}{\\mathrm{R}-\\mathrm{d}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The height of capillary rise is given by Jurin's law:<br><br>$h = \\dfrac{2T \\cos \\theta}{r \\rho g}$<br><br>Since $T$, $\\theta$, $r$, and $\\rho$ remain constant, the height $h$ is inversely proportional to the acceleration due to gravity $g$.<br><br>$h \\propto \\dfrac{1}{g}$<br><br>On the surface of the earth, the height is $h_1 \\propto \\dfrac{1}{g}$.<br><br>At a depth $d$ below the earth's surface, the acceleration due to gravity is:<br><br>$g_d = g \\left(1 - \\dfrac{d}{R}\\right) = g \\left(\\dfrac{R-d}{R}\\right)$<br><br>The height of capillary rise at depth $d$ is $h_2 \\propto \\dfrac{1}{g_d}$.<br><br>Taking the ratio of $h_2$ to $h_1$:<br><br>$\\dfrac{h_2}{h_1} = \\dfrac{g}{g_d} = \\dfrac{g}{g \\left(\\dfrac{R-d}{R}\\right)} = \\dfrac{R}{R-d}$<br><br>Answer: $\\frac{\\mathrm{R}}{\\mathrm{R}-\\mathrm{d}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bb9bf9280d7f9932bda", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "When one end of a capillary tube is dipped in water, the height of water column is ' $h$ '. The upward force of 105 dyne due to surface tension is balanced by the force due to the weight of water column. The inner circumference of the capillary tube is\n(Surface tension of water $=7 \\times 10^{-2} \\mathrm{~N} / \\mathrm{m}$ )", "image": null}, "options": [{"id": "n97YU", "text": "$1.5 \\mathrm{~cm}$", "image": null, "isCorrect": true}, {"id": "KtBQX", "text": "2 cm", "image": null, "isCorrect": false}, {"id": "zL5H8", "text": "$2.5 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "cLZ5Y", "text": "3 cm", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The upward force due to surface tension is given by $F = T \\times C \\times \\cos \\theta$, where $C$ is the inner circumference of the capillary tube.<br><br>For water, the angle of contact $\\theta = 0^\\circ$, so $\\cos \\theta = 1$.<br><br>Given $F = 105 \\text{ dyne} = 105 \\times 10^{-5} \\text{ N}$ and $T = 7 \\times 10^{-2} \\text{ N/m}$.<br><br>Substituting the values:<br><br>$105 \\times 10^{-5} = 7 \\times 10^{-2} \\times C$<br><br>$C = \\dfrac{105 \\times 10^{-5}}{7 \\times 10^{-2}}$<br><br>$C = 15 \\times 10^{-3} \\text{ m}$<br><br>$C = 1.5 \\times 10^{-2} \\text{ m} = 1.5 \\text{ cm}$<br><br>Answer: $1.5 \\mathrm{~cm}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bb7bf9280d7f9932bcc", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The amount of work done in blowing a soap bubble such that its diameter increases from ' d ' to ' D ' is ( $\\mathrm{T}=$ surface tension of solution)", "image": null}, "options": [{"id": "86o5h", "text": "$\\pi\\left(D^2-d^2\\right) T$", "image": null, "isCorrect": false}, {"id": "hOWDk", "text": "$2 \\pi\\left(D^2-d^2\\right) T$", "image": null, "isCorrect": true}, {"id": "HExwj", "text": "$4 \\pi\\left(D^2-d^2\\right) T$", "image": null, "isCorrect": false}, {"id": "LEiox", "text": "$8 \\pi\\left(D^2-d^2\\right) T$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A soap bubble has two free surfaces, one inside and one outside.<br><br>Initial radius of the bubble, $r_1 = \\dfrac{d}{2}$<br><br>Final radius of the bubble, $r_2 = \\dfrac{D}{2}$<br><br>Initial total surface area, $A_1 = 2 \\times 4 \\pi r_1^2 = 8 \\pi \\left(\\dfrac{d}{2}\\right)^2 = 2 \\pi d^2$<br><br>Final total surface area, $A_2 = 2 \\times 4 \\pi r_2^2 = 8 \\pi \\left(\\dfrac{D}{2}\\right)^2 = 2 \\pi D^2$<br><br>Increase in surface area, $\\Delta A = A_2 - A_1 = 2 \\pi (D^2 - d^2)$<br><br>Work done in blowing the bubble is given by the product of surface tension and the increase in surface area:<br><br>$W = T \\times \\Delta A = 2 \\pi (D^2 - d^2) T$<br><br>Answer: $2 \\pi\\left(D^2-d^2\\right) T$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba5bf9280d7f9932b36", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "In a capillary tube of area of cross-section 'a' water rises to height 'h'. To what height will water rise in a capillary tube of area of cross-section $4 a$ ?", "image": null}, "options": [{"id": "eGy3u", "text": "$4 h$", "image": null, "isCorrect": false}, {"id": "C1Sm5", "text": "$2 h$", "image": null, "isCorrect": false}, {"id": "qTuc5", "text": "$\\frac{\\mathrm{h}}{2}$", "image": null, "isCorrect": true}, {"id": "dPtSk", "text": "$\\frac{\\mathrm{h}}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The height of capillary rise is given by $h = \\dfrac{2T \\cos \\theta}{r \\rho g}$<br><br>This implies $h \\propto \\dfrac{1}{r}$<br><br>The area of cross-section of the capillary tube is $a = \\pi r^2$, which gives $r \\propto \\sqrt{a}$<br><br>Therefore, $h \\propto \\dfrac{1}{\\sqrt{a}}$<br><br>For the two capillary tubes, we can write $\\dfrac{h_2}{h_1} = \\sqrt{\\dfrac{a_1}{a_2}}$<br><br>Given $a_1 = a$ and $a_2 = 4a$, we get $\\dfrac{h_2}{h} = \\sqrt{\\dfrac{a}{4a}} = \\dfrac{1}{2}$<br><br>$h_2 = \\dfrac{h}{2}$<br><br>Answer: $\\frac{\\mathrm{h}}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b96bf9280d7f9932aa5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The energy needed for breaking a liquid drop of radius ' $R$ ' into 216 droplets, each of radius ' $r$ ' is ' $x$ ' times TR ${ }^2$. The value of ' $x$ ' is [ $\\mathrm{T}=$ surface tension of the liquid]", "image": null}, "options": [{"id": "tUlvQ", "text": "$4 \\pi$", "image": null, "isCorrect": false}, {"id": "5h6hZ", "text": "$12 \\pi$", "image": null, "isCorrect": false}, {"id": "smcaw", "text": "$180 \\pi$", "image": null, "isCorrect": false}, {"id": "aIXHF", "text": "$20 \\pi$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "By the conservation of volume, the volume of the initial drop is equal to the total volume of the 216 droplets.<br><br>$\\dfrac{4}{3} \\pi R^3 = 216 \\times \\dfrac{4}{3} \\pi r^3$<br><br>$R^3 = 216 r^3 \\Rightarrow R = 6r \\Rightarrow r = \\dfrac{R}{6}$<br><br>The initial surface area of the drop is:<br><br>$A_1 = 4 \\pi R^2$<br><br>The final surface area of the 216 droplets is:<br><br>$A_2 = 216 \\times 4 \\pi r^2$<br><br>Substituting $r = \\dfrac{R}{6}$:<br><br>$A_2 = 216 \\times 4 \\pi \\left(\\dfrac{R}{6}\\right)^2 = 216 \\times 4 \\pi \\left(\\dfrac{R^2}{36}\\right) = 24 \\pi R^2$<br><br>The increase in surface area is:<br><br>$\\Delta A = A_2 - A_1 = 24 \\pi R^2 - 4 \\pi R^2 = 20 \\pi R^2$<br><br>The energy required to break the drop is given by the product of surface tension and the increase in surface area:<br><br>$E = T \\Delta A = T(20 \\pi R^2) = 20 \\pi T R^2$<br><br>Comparing this with the given expression $x T R^2$, we get:<br><br>$x = 20 \\pi$<br><br>Answer: $20 \\pi$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b95bf9280d7f9932a9b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The amount of work done in blowing a soap bubble such that its diameter increases from $d_1$ to $d_2$ is ( $T=$ surface tension of soap solution)", "image": null}, "options": [{"id": "eP9Gu", "text": "$4 \\pi\\left(\\mathrm{~d}_2^2-\\mathrm{d}_1^2\\right) \\mathrm{T}$", "image": null, "isCorrect": false}, {"id": "wfwHw", "text": "$8 \\pi\\left(\\mathrm{~d}_2^2-\\mathrm{d}_1^2\\right) \\mathrm{T}$", "image": null, "isCorrect": false}, {"id": "a9ep7", "text": "$\\pi\\left(\\mathrm{d}_2^2-\\mathrm{d}_1^2\\right) \\mathrm{T}$", "image": null, "isCorrect": false}, {"id": "HHNBI", "text": "$2 \\pi\\left(\\mathrm{~d}_2^2-\\mathrm{d}_1^2\\right) \\mathrm{T}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "A soap bubble has two free surfaces (inner and outer).<br><br>Initial surface area of the soap bubble, $A_1 = 2 \\times 4 \\pi r_1^2 = 2 \\times 4 \\pi \\left(\\dfrac{d_1}{2}\\right)^2 = 2 \\pi d_1^2$<br><br>Final surface area of the soap bubble, $A_2 = 2 \\times 4 \\pi r_2^2 = 2 \\times 4 \\pi \\left(\\dfrac{d_2}{2}\\right)^2 = 2 \\pi d_2^2$<br><br>Increase in surface area, $\\Delta A = A_2 - A_1 = 2 \\pi (d_2^2 - d_1^2)$<br><br>Work done in blowing the bubble is given by the product of surface tension and the increase in surface area:<br><br>$W = T \\times \\Delta A = 2 \\pi (d_2^2 - d_1^2) T$<br><br>Answer: $2 \\pi\\left(\\mathrm{~d}_2^2-\\mathrm{d}_1^2\\right) \\mathrm{T}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b85bf9280d7f9932a02", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A disc of paper of radius ' $R$ ' has a hole of radius ' $r$ '. It is floating on a liquid of surface tension ' T '. The force of surface tension on the disc is", "image": null}, "options": [{"id": "20iRb", "text": "$2 \\pi \\mathrm{~T}(\\mathrm{R}-\\mathrm{r})$", "image": null, "isCorrect": false}, {"id": "KSS2y", "text": "$2 \\pi \\mathrm{~T}(\\mathrm{R}+\\mathrm{r})$", "image": null, "isCorrect": true}, {"id": "4gDoy", "text": "$3 \\pi \\mathrm{~T} \\cdot \\mathrm{R}$", "image": null, "isCorrect": false}, {"id": "seJCS", "text": "$4 \\pi \\mathrm{~T}(\\mathrm{R}+\\mathrm{r})$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The force of surface tension acts on the total boundary of the paper disc in contact with the liquid.<br><br>The disc has two boundaries: the outer edge of radius $R$ and the inner edge of the hole of radius $r$.<br><br>Length of the outer boundary $= 2\\pi R$<br><br>Length of the inner boundary $= 2\\pi r$<br><br>Total length of the boundary in contact with the liquid is $L = 2\\pi R + 2\\pi r = 2\\pi(R + r)$.<br><br>The force of surface tension is given by $F = T \\times L$.<br><br>Substituting the value of $L$, we get $F = T \\times 2\\pi(R + r) = 2\\pi T(R + r)$.<br><br>Answer: $2 \\pi \\mathrm{~T}(\\mathrm{R}+\\mathrm{r})$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b83bf9280d7f99329f1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The excess pressure inside first soap bubble is three times that of a second soap bubble. The ratio of volumes of the first to second bubble", "image": null}, "options": [{"id": "QvQJT", "text": "$1: 3$", "image": null, "isCorrect": false}, {"id": "SpWH5", "text": "$1: 9$", "image": null, "isCorrect": false}, {"id": "qk9hS", "text": "$1: 27$", "image": null, "isCorrect": true}, {"id": "S10JU", "text": "$27: 1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The excess pressure inside a soap bubble is given by $P = \\dfrac{4T}{R}$<br><br>Given $P_1 = 3P_2$<br><br>$\\dfrac{4T}{R_1} = 3 \\left(\\dfrac{4T}{R_2}\\right)$<br><br>$\\dfrac{R_1}{R_2} = \\dfrac{1}{3}$<br><br>The volume of a spherical bubble is $V = \\dfrac{4}{3}\\pi R^3$<br><br>The ratio of their volumes is:<br><br>$\\dfrac{V_1}{V_2} = \\left(\\dfrac{R_1}{R_2}\\right)^3 = \\left(\\dfrac{1}{3}\\right)^3 = \\dfrac{1}{27}$<br><br>Answer: $1: 27$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b76bf9280d7f9932979", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Water rises in a capillary tube of radius $r$ upto a height $h$. The mass of water in a capillary is $m$. The mass of water that will rise in capillary of radius $\\frac{\\mathrm{r}}{5}$ will be", "image": null}, "options": [{"id": "XOyMb", "text": "$\\frac{\\mathrm{m}}{5}$", "image": null, "isCorrect": true}, {"id": "ZWBq1", "text": "$\\frac{\\mathrm{m}}{2}$", "image": null, "isCorrect": false}, {"id": "o4TVa", "text": "m", "image": null, "isCorrect": false}, {"id": "kLRRw", "text": "$\\frac{\\mathrm{m}}{25}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The height of liquid in a capillary tube is given by Jurin's law:<br><br>$h = \\dfrac{2T \\cos \\theta}{r \\rho g}$<br><br>The mass of the liquid in the capillary tube is:<br><br>$m = \\pi r^2 h \\rho$<br><br>Substituting the expression for $h$ into the mass equation:<br><br>$m = \\pi r^2 \\left( \\dfrac{2T \\cos \\theta}{r \\rho g} \\right) \\rho = \\dfrac{2 \\pi r T \\cos \\theta}{g}$<br><br>This shows that the mass of the liquid raised is directly proportional to the radius of the capillary tube, i.e., $m \\propto r$.<br><br>For the new capillary tube, the radius is $r' = \\dfrac{r}{5}$.<br><br>Therefore, the new mass $m'$ will be:<br><br>$m' = \\dfrac{m}{5}$<br><br>Answer: $\\frac{\\mathrm{m}}{5}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b76bf9280d7f9932975", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The excess pressure inside a soap bubble is 1.5 times the excess pressure inside a second soap bubble. The volume of the second bubble is ' $x$ ' times the volume of the first bubble. The value of ' $x$ ' is", "image": null}, "options": [{"id": "jiTnN", "text": "$\\frac{3}{2}$", "image": null, "isCorrect": false}, {"id": "OqzFI", "text": "$\\frac{9}{4}$", "image": null, "isCorrect": false}, {"id": "6xzpL", "text": "$\\frac{8}{27}$", "image": null, "isCorrect": false}, {"id": "cjU2i", "text": "$\\frac{27}{8}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The excess pressure inside a soap bubble of radius $R$ and surface tension $T$ is given by $P = \\dfrac{4T}{R}$.<br><br>Let the excess pressures of the first and second bubbles be $P_1$ and $P_2$, and their radii be $R_1$ and $R_2$ respectively.<br><br>Given that $P_1 = 1.5 P_2 = \\dfrac{3}{2} P_2$.<br><br>$\\dfrac{4T}{R_1} = \\dfrac{3}{2} \\left(\\dfrac{4T}{R_2}\\right)$<br><br>$\\dfrac{R_2}{R_1} = \\dfrac{3}{2}$<br><br>The volume of a soap bubble is $V = \\dfrac{4}{3}\\pi R^3$.<br><br>The ratio of the volume of the second bubble to the first bubble is:<br><br>$x = \\dfrac{V_2}{V_1} = \\left(\\dfrac{R_2}{R_1}\\right)^3$<br><br>$x = \\left(\\dfrac{3}{2}\\right)^3 = \\dfrac{27}{8}$<br><br>Answer: $\\frac{27}{8}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b75bf9280d7f9932970", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The energy needed for breaking a liquid drop of radius ' R ' into ' n ' droplets each of radius ' $r$ ' is\n$\\text { [ } \\mathrm{T}=\\text { surface tension of the liquid] }$", "image": null}, "options": [{"id": "eUlLW", "text": "$4 \\pi \\mathrm{~T} \\mathrm{R}^2\\left[\\frac{\\mathrm{R}}{\\mathrm{r}}+1\\right]$", "image": null, "isCorrect": false}, {"id": "gpV58", "text": "$4 \\pi \\mathrm{~T} \\mathrm{R}^2\\left[\\frac{\\mathrm{R}}{\\mathrm{r}}-1\\right]$", "image": null, "isCorrect": true}, {"id": "5NKLo", "text": "$4 \\pi \\mathrm{~T} \\mathrm{R}^2\\left[\\frac{\\mathrm{r}}{\\mathrm{R}}+1\\right]$", "image": null, "isCorrect": false}, {"id": "2MrZD", "text": "$4 \\pi \\mathrm{Tr}^2\\left[\\frac{\\mathrm{R}}{\\mathrm{r}}-1\\right]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Volume of the initial drop is equal to the total volume of $n$ droplets.<br><br>$\\dfrac{4}{3} \\pi R^3 = n \\times \\dfrac{4}{3} \\pi r^3$<br><br>$n = \\dfrac{R^3}{r^3}$<br><br>Initial surface area of the drop, $A_1 = 4 \\pi R^2$<br><br>Final surface area of $n$ droplets, $A_2 = n \\times 4 \\pi r^2$<br><br>Change in surface area, $\\Delta A = A_2 - A_1 = n \\times 4 \\pi r^2 - 4 \\pi R^2$<br><br>Substituting $n = \\dfrac{R^3}{r^3}$:<br><br>$\\Delta A = \\left(\\dfrac{R^3}{r^3}\\right) 4 \\pi r^2 - 4 \\pi R^2$<br><br>$\\Delta A = 4 \\pi \\dfrac{R^3}{r} - 4 \\pi R^2$<br><br>$\\Delta A = 4 \\pi R^2 \\left[\\dfrac{R}{r} - 1\\right]$<br><br>Energy needed to break the drop is given by $E = T \\Delta A$<br><br>$E = 4 \\pi T R^2 \\left[\\dfrac{R}{r} - 1\\right]$<br><br>Answer: $4 \\pi \\mathrm{~T} \\mathrm{R}^2\\left[\\frac{\\mathrm{R}}{\\mathrm{r}}-1\\right]$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b65bf9280d7f99328d0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A capillary tube is taken from earth's surface to moon's surface. The rise of liquid column on the moon's surface is (acceleration due to gravity on the earth's surface is six times that of moon's surface)", "image": null}, "options": [{"id": "v21Mh", "text": "zero.", "image": null, "isCorrect": false}, {"id": "PlQqy", "text": "six times that on the earth's surface.", "image": null, "isCorrect": true}, {"id": "bIVZ3", "text": "equal to that on the earth's surface.", "image": null, "isCorrect": false}, {"id": "hfPVd", "text": "$\\left(\\frac{1}{6}\\right)^{\\text {th }}$ that on the earth's surface.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The formula for the rise of a liquid column in a capillary tube is given by<br><br>$h = \\dfrac{2T \\cos \\theta}{r \\rho g}$<br><br>For a given capillary tube and liquid, $T$, $\\theta$, $r$, and $\\rho$ are constant. Thus, the capillary rise is inversely proportional to the acceleration due to gravity.<br><br>$h \\propto \\dfrac{1}{g}$<br><br>$\\dfrac{h_m}{h_e} = \\dfrac{g_e}{g_m}$<br><br>Given that the acceleration due to gravity on the earth's surface is six times that on the moon's surface, $g_e = 6g_m$.<br><br>$\\dfrac{h_m}{h_e} = \\dfrac{6g_m}{g_m} = 6$<br><br>$h_m = 6h_e$<br><br>The rise of the liquid column on the moon's surface is six times that on the earth's surface.<br><br>Answer: six times that on the earth's surface.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b65bf9280d7f99328ce", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A rectangular film of liquid is expanded from ( $5 \\mathrm{~cm} \\times 4 \\mathrm{~cm}$ ) to ( $7 \\mathrm{~cm} \\times 8 \\mathrm{~cm}$ ). If the work done is $3 \\times 10^{-4} \\mathrm{~J}$, the surface tension of the liquid is (nearly)", "image": null}, "options": [{"id": "UidUj", "text": "$0.4 \\mathrm{~N} / \\mathrm{m}$", "image": null, "isCorrect": false}, {"id": "q2XHs", "text": "$0.04 \\mathrm{~N} / \\mathrm{m}$", "image": null, "isCorrect": true}, {"id": "HnqLm", "text": "0.4 dyne/cm", "image": null, "isCorrect": false}, {"id": "NeCRg", "text": "$4.0 \\mathrm{~N} / \\mathrm{m}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Initial area of the film, $A_1 = 5 \\text{ cm} \\times 4 \\text{ cm} = 20 \\text{ cm}^2 = 20 \\times 10^{-4} \\text{ m}^2$<br><br>Final area of the film, $A_2 = 7 \\text{ cm} \\times 8 \\text{ cm} = 56 \\text{ cm}^2 = 56 \\times 10^{-4} \\text{ m}^2$<br><br>Increase in area of the film, $\\Delta A = A_2 - A_1 = 36 \\times 10^{-4} \\text{ m}^2$<br><br>Since a liquid film has two free surfaces, the total increase in surface area is $2 \\times \\Delta A = 2 \\times 36 \\times 10^{-4} \\text{ m}^2 = 72 \\times 10^{-4} \\text{ m}^2$<br><br>Work done, $W = T \\times 2 \\Delta A$<br><br>$3 \\times 10^{-4} = T \\times 72 \\times 10^{-4}$<br><br>$T = \\dfrac{3}{72} = \\dfrac{1}{24} \\approx 0.0416 \\text{ N/m}$<br><br>The closest value is $0.04 \\text{ N/m}$.<br><br>Answer: $0.04 \\mathrm{~N} / \\mathrm{m}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b53bf9280d7f993283d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Two capillary tubes of same diameter are kept vertically in two liquids whose densities are in the ratio $4: 3$. If their surface tensions are in the ratio 6:5, the ratio of heights $\\left(\\frac{h_1}{h_2}\\right)$ of liquids in the two capillary tubes is (Their angle of contacts are same)", "image": null}, "options": [{"id": "wab0s", "text": "$\\frac{10}{7}$", "image": null, "isCorrect": false}, {"id": "LrsTg", "text": "$\\frac{9}{10}$", "image": null, "isCorrect": true}, {"id": "ycg8q", "text": "$\\frac{10}{9}$", "image": null, "isCorrect": false}, {"id": "WtTii", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The height of a liquid in a capillary tube is given by the formula:<br><br>$h = \\dfrac{2T \\cos\\theta}{r \\rho g}$<br><br>Since the capillary tubes have the same diameter, $r_1 = r_2$. The angle of contact is also the same, so $\\theta_1 = \\theta_2$. Therefore, the height $h$ is directly proportional to the surface tension $T$ and inversely proportional to the density $\\rho$:<br><br>$h \\propto \\dfrac{T}{\\rho}$<br><br>The ratio of the heights of the liquids in the two capillary tubes is:<br><br>$\\dfrac{h_1}{h_2} = \\dfrac{T_1}{T_2} \\times \\dfrac{\\rho_2}{\\rho_1}$<br><br>Given that $\\dfrac{T_1}{T_2} = \\dfrac{6}{5}$ and $\\dfrac{\\rho_1}{\\rho_2} = \\dfrac{4}{3}$, we get:<br><br>$\\dfrac{h_1}{h_2} = \\dfrac{6}{5} \\times \\dfrac{3}{4}$<br><br>$\\dfrac{h_1}{h_2} = \\dfrac{18}{20} = \\dfrac{9}{10}$<br><br>Answer: $\\frac{9}{10}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b53bf9280d7f9932838", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "In air, a soap bubble of radius $R$ breaks into 64 small soap bubbles of equal radius $r$. Assuming the surface tension remains unchanged, the ratio of excess pressure inside the big soap bubble to that inside a small soap bubble is", "image": null}, "options": [{"id": "E7dyr", "text": "$1: 4$", "image": null, "isCorrect": true}, {"id": "0ve5A", "text": "$4: 1$", "image": null, "isCorrect": false}, {"id": "8q3O5", "text": "$2: 1$", "image": null, "isCorrect": false}, {"id": "5WSey", "text": "$1: 2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The volume of air is conserved when the bubble breaks up.<br><br>$\\dfrac{4}{3}\\pi R^3 = 64 \\times \\dfrac{4}{3}\\pi r^3 \\Rightarrow R^3 = 64 r^3 \\Rightarrow R = 4r$<br><br>A soap bubble has two free surfaces, so the excess pressure inside a bubble of radius $R$ is $\\Delta P = \\dfrac{4T}{R}$.<br><br>$\\dfrac{\\Delta P_{\\text{big}}}{\\Delta P_{\\text{small}}} = \\dfrac{4T/R}{4T/r} = \\dfrac{r}{R} = \\dfrac{r}{4r} = \\dfrac{1}{4}$<br><br>Therefore, the required ratio is $1 : 4$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b44bf9280d7f99327b0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Water rises up to height ' $x$ ' in a capillary tube immersed vertically in water. When the whole arrangement is taken to a depth ' d ' in a mine, the water level rises up to height Y . If R is the radius of the earth then the ratio $\\mathrm{Y}: \\mathrm{x}$ is", "image": null}, "options": [{"id": "BRARe", "text": "$\\mathrm{R}:(\\mathrm{R}+\\mathrm{d})$", "image": null, "isCorrect": false}, {"id": "wAkKx", "text": "$\\mathrm{R}:(\\mathrm{R}-\\mathrm{d})$", "image": null, "isCorrect": true}, {"id": "h6exX", "text": "$\\mathrm{R}:(\\mathrm{R}-\\mathrm{d})^2$", "image": null, "isCorrect": false}, {"id": "v0X2i", "text": "$\\mathrm{R}:(\\mathrm{R}+\\mathrm{d})^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The height of capillary rise is given by $h = \\dfrac{2T \\cos \\theta}{r \\rho g}$<br><br>This implies $h \\propto \\dfrac{1}{g}$<br><br>At the surface of the earth, the capillary rise is $x \\propto \\dfrac{1}{g}$<br><br>At a depth $d$ in a mine, the acceleration due to gravity is $g' = g\\left(1 - \\dfrac{d}{R}\\right) = g\\left(\\dfrac{R-d}{R}\\right)$<br><br>The capillary rise at depth $d$ is $Y \\propto \\dfrac{1}{g'}$<br><br>Taking the ratio of $Y$ to $x$:<br><br>$\\dfrac{Y}{x} = \\dfrac{g}{g'} = \\dfrac{g}{g\\left(\\dfrac{R-d}{R}\\right)} = \\dfrac{R}{R-d}$<br><br>Thus, $Y:x = R:(R-d)$<br><br>Answer: $\\mathrm{R}:(\\mathrm{R}-\\mathrm{d})$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b44bf9280d7f99327a8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A liquid drop of volume $V$ is placed on the surface of glass plate. Then another glass plate is placed on it such that liquid forms a thin layer of area A between the surfaces of two plates. To separate the plates a force $F$ has to be applied normal to the surfaces. The surface tension of the liquid is", "image": null}, "options": [{"id": "nsaZB", "text": "$\\frac{\\mathrm{FV}}{2 \\mathrm{~A}}$", "image": null, "isCorrect": false}, {"id": "bGIbV", "text": "$\\frac{F V}{2 A^2}$", "image": null, "isCorrect": true}, {"id": "1ecO6", "text": "$\\frac{F V}{A^2}$", "image": null, "isCorrect": false}, {"id": "R8nFE", "text": "$\\frac{F}{V A}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $t$ be the thickness of the liquid layer between the two glass plates.<br><br>The volume of the liquid is given by $V = A t \\Rightarrow t = \\dfrac{V}{A}$.<br><br>The radius of curvature of the meniscus formed at the edge of the liquid layer is $r = \\dfrac{t}{2}$.<br><br>The pressure difference across the free surface of the liquid is $\\Delta P = \\dfrac{T}{r} = \\dfrac{2T}{t}$, where $T$ is the surface tension.<br><br>The force required to separate the two glass plates is $F = \\Delta P \\times A$.<br><br>Substituting the value of $\\Delta P$, we get $F = \\dfrac{2T A}{t}$.<br><br>Substituting $t = \\dfrac{V}{A}$, we get $F = \\dfrac{2T A^2}{V}$.<br><br>Rearranging for surface tension $T$, we get $T = \\dfrac{F V}{2 A^2}$.<br><br>Answer: $\\frac{F V}{2 A^2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b37bf9280d7f9932731", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Pure water rises through a height $h$ in a capillary tube of internal radius $r$. Surface tension of water is $T$. The pressure difference between the water level in the container and the lowest point of the concave meniscus is", "image": null}, "options": [{"id": "kAzwe", "text": "$\\frac{\\mathrm{r}}{\\mathrm{T}}$", "image": null, "isCorrect": false}, {"id": "m6GP9", "text": "$\\frac{\\mathrm{T}}{\\mathrm{r}}$", "image": null, "isCorrect": false}, {"id": "NIafV", "text": "$\\frac{2 \\mathrm{~T}}{\\mathrm{r}}$", "image": null, "isCorrect": true}, {"id": "UzVOH", "text": "$\\frac{\\mathrm{r}}{2 \\mathrm{~T}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The pressure at the free surface of water in the container is atmospheric pressure, $P_0$.<br><br>For a concave meniscus in a capillary tube, the pressure just below the lowest point of the meniscus is less than the pressure just above it (which is $P_0$) by an amount equal to the excess pressure.<br><br>According to Laplace's law, the excess pressure across a curved liquid surface is given by $\\Delta P = \\dfrac{2T}{R}$, where $R$ is the radius of curvature of the meniscus.<br><br>For pure water, the angle of contact is $\\theta = 0^{\\circ}$. Thus, the radius of curvature of the meniscus is equal to the internal radius of the capillary tube, $R = r$.<br><br>The pressure just below the meniscus is $P_0 - \\dfrac{2T}{r}$.<br><br>Therefore, the pressure difference between the water level in the container and the lowest point of the concave meniscus is:<br><br>$\\Delta P = P_0 - \\left(P_0 - \\dfrac{2T}{r}\\right) = \\dfrac{2T}{r}$<br><br>Answer: $\\frac{2 \\mathrm{~T}}{\\mathrm{r}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b37bf9280d7f993272d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A liquid drop having surface energy E is sprayed into 512 droplets of same size. The final surface energy is", "image": null}, "options": [{"id": "Re01v", "text": "12 E", "image": null, "isCorrect": false}, {"id": "W9dNU", "text": "4 E", "image": null, "isCorrect": false}, {"id": "vPppi", "text": "8 E", "image": null, "isCorrect": true}, {"id": "dPdll", "text": "6 E", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the initial radius of the liquid drop be $R$ and the surface tension be $T$.<br><br>Initial surface energy $E = 4\\pi R^2 T$.<br><br>Let the radius of each of the $512$ smaller droplets be $r$.<br><br>Since the total volume remains constant during the spraying process:<br><br>$\\dfrac{4}{3}\\pi R^3 = 512 \\times \\dfrac{4}{3}\\pi r^3$<br><br>$R^3 = 512 r^3$<br><br>$R = 8r \\Rightarrow r = \\dfrac{R}{8}$<br><br>The final surface energy $E'$ of the $512$ droplets is:<br><br>$E' = 512 \\times 4\\pi r^2 T$<br><br>Substituting $r = \\dfrac{R}{8}$:<br><br>$E' = 512 \\times 4\\pi \\left(\\dfrac{R}{8}\\right)^2 T$<br><br>$E' = 512 \\times \\dfrac{4\\pi R^2 T}{64}$<br><br>$E' = 8 \\times (4\\pi R^2 T)$<br><br>$E' = 8E$<br><br>Answer: 8 E", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b23bf9280d7f9932693", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A water drop of $0.01 \\mathrm{~cm}^3$ is squeezed between two glass plates and spreads in to area of $10 \\mathrm{~cm}^2$. If surface tension of water is 70 dyne $/ \\mathrm{cm}$ then the normal force required to separate glass plates from each other will be", "image": null}, "options": [{"id": "3FNTy", "text": "12 N", "image": null, "isCorrect": false}, {"id": "APpCr", "text": "14 N", "image": null, "isCorrect": true}, {"id": "L9p34", "text": "16 N", "image": null, "isCorrect": false}, {"id": "jcFUO", "text": "28 N", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Volume of the water drop, $V = 0.01 \\mathrm{~cm}^3$<br>Area of the film, $A = 10 \\mathrm{~cm}^2$<br>Surface tension, $T = 70 \\text{ dyne/cm}$<br><br>Let the thickness of the water film be $t$. The volume of the film is given by:<br>$V = A \\times t \\Rightarrow t = \\dfrac{V}{A}$<br><br>The pressure difference across the free surface of the water film is $\\Delta P = \\dfrac{2T}{t}$.<br>The normal force required to separate the glass plates is:<br>$F = \\Delta P \\times A = \\dfrac{2AT}{t}$<br><br>Substituting $t = \\dfrac{V}{A}$ into the force equation:<br>$F = \\dfrac{2A^2T}{V}$<br><br>Substituting the given values:<br>$F = \\dfrac{2 \\times (10)^2 \\times 70}{0.01}$<br>$F = \\dfrac{14000}{0.01} = 14 \\times 10^5 \\text{ dyne}$<br><br>Since $1 \\text{ N} = 10^5 \\text{ dyne}$, we get:<br>$F = 14 \\text{ N}$<br><br>Answer: 14 N", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b22bf9280d7f9932689", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A liquid drop having surface energy E is spread into 729 droplets of same size. The final surface energy of the droplets is", "image": null}, "options": [{"id": "G38Y9", "text": "6 E", "image": null, "isCorrect": false}, {"id": "OhZ8O", "text"
