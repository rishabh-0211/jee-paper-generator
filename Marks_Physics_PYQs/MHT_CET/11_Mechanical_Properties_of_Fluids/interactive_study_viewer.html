: "9 E", "image": null, "isCorrect": true}, {"id": "3G4RE", "text": "E", "image": null, "isCorrect": false}, {"id": "p0yu5", "text": "3 E", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the radius of the initial drop be $R$ and the radius of each small droplet be $r$.<br><br>Initial surface energy is $E = 4\\pi R^2 T$.<br><br>By conservation of volume:<br>$\\dfrac{4}{3}\\pi R^3 = 729 \\times \\dfrac{4}{3}\\pi r^3$<br><br>$R^3 = 729 r^3 \\Rightarrow R = 9r \\Rightarrow r = \\dfrac{R}{9}$<br><br>Final surface energy of 729 droplets is:<br>$E_f = 729 \\times 4\\pi r^2 T$<br><br>$E_f = 729 \\times 4\\pi \\left(\\dfrac{R}{9}\\right)^2 T$<br><br>$E_f = 729 \\times \\dfrac{4\\pi R^2 T}{81}$<br><br>$E_f = 9 \\times (4\\pi R^2 T) = 9E$<br><br>Answer: 9 E", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b21bf9280d7f9932683", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The surface energy of a liquid drop is \"V\". It is sprayed into 1000 equal droplets. The surface energy of all the droplets is", "image": null}, "options": [{"id": "HecCt", "text": "V", "image": null, "isCorrect": false}, {"id": "sQAYQ", "text": "10 V", "image": null, "isCorrect": true}, {"id": "En9HO", "text": "100 V", "image": null, "isCorrect": false}, {"id": "Ejxw2", "text": "1000 V", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the radius of the initial liquid drop be $R$ and the surface tension be $T$.<br><br>The initial surface energy is given by $V = 4\\pi R^2 T$.<br><br>When the drop is sprayed into $n = 1000$ equal droplets of radius $r$, the total volume remains constant.<br><br>$\\dfrac{4}{3}\\pi R^3 = 1000 \\times \\dfrac{4}{3}\\pi r^3$<br><br>$R^3 = 1000 r^3 \\Rightarrow r = \\dfrac{R}{10}$<br><br>The total surface energy of the $1000$ droplets is $E = 1000 \\times 4\\pi r^2 T$.<br><br>Substituting $r = \\dfrac{R}{10}$:<br><br>$E = 1000 \\times 4\\pi \\left(\\dfrac{R}{10}\\right)^2 T$<br><br>$E = 1000 \\times \\dfrac{4\\pi R^2 T}{100}$<br><br>$E = 10 \\times (4\\pi R^2 T) = 10 V$<br><br>Answer: 10 V", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871afdbf9280d7f9932566", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "When a big drop of water is formed from ' $n$ ' small drops of water, the energy loss is '3E' where ' E ' is the energy of the bigger drop. The radius of the bigger drop is ' $R$ ' and that of smaller drop is ' $r$ ' then the value of ' n ' is", "image": null}, "options": [{"id": "LxTbJ", "text": "$\\frac{2 \\mathrm{R}^2}{\\mathrm{r}}$", "image": null, "isCorrect": false}, {"id": "Vp78D", "text": "$\\frac{4 R^2}{r^2}$", "image": null, "isCorrect": true}, {"id": "aRqUn", "text": "$\\frac{4 \\mathrm{R}}{\\mathrm{r}}$", "image": null, "isCorrect": false}, {"id": "fS45p", "text": "$\\frac{4 \\mathrm{R}}{\\mathrm{r}^2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $T$ be the surface tension of water.<br><br>Surface energy of the bigger drop, $E = 4 \\pi R^2 T$<br><br>Surface energy of $n$ smaller drops, $E_i = n(4 \\pi r^2 T)$<br><br>Energy loss during the formation of the bigger drop is given by:<br><br>$\\Delta E = E_i - E$<br><br>Given that the energy loss is $3E$:<br><br>$E_i - E = 3E$<br><br>$E_i = 4E$<br><br>Substituting the expressions for $E_i$ and $E$:<br><br>$n(4 \\pi r^2 T) = 4(4 \\pi R^2 T)$<br><br>$n r^2 = 4 R^2$<br><br>$n = \\dfrac{4 R^2}{r^2}$<br><br>Answer: $\\frac{4 R^2}{r^2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871afdbf9280d7f993255e", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "One end of a capillary tube is dipped in water, the rise of water column is ' $h$ '. The upward force of 98 dyne due to surface tension is balanced by the force due to the weight of the water column. The inner circumference of the capillary is (surface tension of water $=7 \\times 10^{-2} \\mathrm{Nm}^{-1}$ )", "image": null}, "options": [{"id": "NFzkE", "text": "1.4 cm", "image": null, "isCorrect": true}, {"id": "ZddD4", "text": "0.7 cm", "image": null, "isCorrect": false}, {"id": "1az1Y", "text": "0.14 cm", "image": null, "isCorrect": false}, {"id": "onsrd", "text": "0.07 cm", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The upward force due to surface tension is given by $F = T \\times C \\times \\cos \\theta$, where $C$ is the inner circumference of the capillary tube and $\\theta$ is the angle of contact.<br><br>For water, the angle of contact is $\\theta = 0^\\circ$, so $\\cos \\theta = 1$.<br><br>Given $F = 98 \\text{ dyne} = 98 \\times 10^{-5} \\text{ N}$ and $T = 7 \\times 10^{-2} \\text{ N m}^{-1}$.<br><br>Substituting the values, we get:<br><br>$98 \\times 10^{-5} = 7 \\times 10^{-2} \\times C$<br><br>$C = \\dfrac{98 \\times 10^{-5}}{7 \\times 10^{-2}} \\text{ m}$<br><br>$C = 14 \\times 10^{-3} \\text{ m}$<br><br>Converting to centimeters:<br><br>$C = 14 \\times 10^{-3} \\times 10^2 \\text{ cm} = 1.4 \\text{ cm}$<br><br>Answer: 1.4 cm", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871afbbf9280d7f993254d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A liquid rises to a height of 2.4 cm in a glass capillary $P$. Another glass capillary Q having diameter 80% of capillary P is immersed in the same liquid. The rise of liquid in capillary Q is", "image": null}, "options": [{"id": "Bf9gB", "text": "$2.4 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "AVAXs", "text": "$3.4 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "T39Wf", "text": "3 cm", "image": null, "isCorrect": true}, {"id": "7ZVXo", "text": "$2.5 \\mathrm{~cm}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The height of liquid rise in a capillary tube is given by<br><br>$h = \\dfrac{2T \\cos \\theta}{r \\rho g}$<br><br>For the same liquid and glass interface, $h \\propto \\dfrac{1}{r}$ or $h \\propto \\dfrac{1}{D}$, where $D$ is the diameter of the capillary tube.<br><br>Therefore, $h_P D_P = h_Q D_Q$<br><br>Given that $D_Q = 0.8 D_P$ and $h_P = 2.4$ cm.<br><br>$h_Q = h_P \\left( \\dfrac{D_P}{D_Q} \\right)$<br><br>$h_Q = 2.4 \\left( \\dfrac{D_P}{0.8 D_P} \\right)$<br><br>$h_Q = \\dfrac{2.4}{0.8} = 3$ cm<br><br>Answer: 3 cm", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214420aee93fa0796df3e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "A liquid drop having surface energy ' $E$ ' is spread into 512 droplets of same size. The final surface energy of the droplets is", "image": null}, "options": [{"id": "Q27d0", "text": "2 E", "image": null, "isCorrect": false}, {"id": "SJhch", "text": "4 E", "image": null, "isCorrect": false}, {"id": "YUJ0L", "text": "8 E", "image": null, "isCorrect": true}, {"id": "9BBIs", "text": "12 E", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the radius of the initial drop be $R$ and the radius of each small droplet be $r$.<br><br>Initial surface energy of the drop is given by:<br>$E = T \\times 4\\pi R^2$<br><br>By conservation of volume:<br>$\\dfrac{4}{3}\\pi R^3 = 512 \\times \\dfrac{4}{3}\\pi r^3$<br><br>$R^3 = 512 r^3 \\Rightarrow R = 8r \\Rightarrow r = \\dfrac{R}{8}$<br><br>Final surface energy of the 512 droplets is:<br>$E' = 512 \\times T \\times 4\\pi r^2$<br><br>Substituting $r = \\dfrac{R}{8}$:<br>$E' = 512 \\times T \\times 4\\pi \\left(\\dfrac{R}{8}\\right)^2$<br><br>$E' = 512 \\times T \\times 4\\pi \\dfrac{R^2}{64}$<br><br>$E' = 8 \\times (T \\times 4\\pi R^2) = 8E$<br><br>Answer: 8 E", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214400aee93fa0796df2d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "A water drop is divided into 8 equal droplets. The pressure difference between the inner and outer side of the big drop will be", "image": null}, "options": [{"id": "hrKsu", "text": "same as the smaller droplet.", "image": null, "isCorrect": false}, {"id": "vaPY1", "text": "half of that for smaller droplet", "image": null, "isCorrect": true}, {"id": "GzxA9", "text": "$\\left(\\frac{1}{4}\\right)^{\\text {th }}$ of that for smaller droplet.", "image": null, "isCorrect": false}, {"id": "3dgvr", "text": "twice that for smaller droplet", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the radius of the big drop be $R$ and the radius of each small droplet be $r$.<br><br>Since the volume remains constant when the drop is divided:<br><br>$\\dfrac{4}{3}\\pi R^3 = 8 \\times \\dfrac{4}{3}\\pi r^3$<br><br>$R^3 = 8r^3 \\Rightarrow R = 2r$<br><br>The pressure difference (excess pressure) for a liquid drop is given by $\\Delta P = \\dfrac{2T}{R}$, where $T$ is the surface tension.<br><br>For the big drop, the pressure difference is:<br><br>$\\Delta P_{\\text{big}} = \\dfrac{2T}{R}$<br><br>For the smaller droplet, the pressure difference is:<br><br>$\\Delta P_{\\text{small}} = \\dfrac{2T}{r}$<br><br>Substituting $R = 2r$ in the expression for the big drop:<br><br>$\\Delta P_{\\text{big}} = \\dfrac{2T}{2r} = \\dfrac{1}{2} \\left(\\dfrac{2T}{r}\\right) = \\dfrac{1}{2} \\Delta P_{\\text{small}}$<br><br>Thus, the pressure difference for the big drop is half of that for the smaller droplet.<br><br>Answer: half of that for smaller droplet", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792143f0aee93fa0796df21", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "On the surface of the liquid in equilibrium, molecules of the liquid possess", "image": null}, "options": [{"id": "g9iKx", "text": "maximum potential energy.", "image": null, "isCorrect": true}, {"id": "a9Cit", "text": "minimum potential energy.", "image": null, "isCorrect": false}, {"id": "201Tg", "text": "maximum kinetic energy.", "image": null, "isCorrect": false}, {"id": "pIioE", "text": "minimum kinetic energy.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Molecules on the surface of a liquid experience a net inward cohesive force.<br><br>To bring a molecule from the interior of the liquid to the surface, work must be done against this net inward force.<br><br>This work done is stored in the molecule in the form of potential energy.<br><br>Therefore, the molecules on the surface of the liquid possess maximum potential energy as compared to the molecules in the interior.<br><br>Answer: maximum potential energy.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214310aee93fa0796deb1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "When capillary is dipped vertically in water, rise of water in capillary is ' h '. The angle of contact is zero. Now the tube is depressed so that its length above the water surface is $\\frac{\\mathrm{h}}{3}$. The new apparent angle of contact is $\\left(\\cos 0^{\\circ}=1\\right)$", "image": null}, "options": [{"id": "sDjdT", "text": "$\\cos ^{-1}\\left(\\frac{1}{2}\\right)$", "image": null, "isCorrect": false}, {"id": "GgUze", "text": "$\\quad \\cos ^{-1}\\left(\\frac{1}{3}\\right)$", "image": null, "isCorrect": true}, {"id": "T9ezh", "text": "$\\quad \\cos ^{-1}\\left(\\frac{1}{4}\\right)$", "image": null, "isCorrect": false}, {"id": "v12Fa", "text": "$\\quad \\cos ^{-1}\\left(\\frac{1}{6}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The height of capillary rise is given by $h = \\dfrac{2T \\cos \\theta}{r \\rho g}$.<br><br>For a given liquid and capillary tube, $\\dfrac{h}{\\cos \\theta} = \\text{constant}$.<br><br>Initially, the angle of contact is $\\theta = 0^{\\circ}$, so $\\cos \\theta = 1$.<br><br>When the tube is depressed, the liquid does not overflow but the meniscus adjusts its shape. The new height of the liquid column is $h' = \\dfrac{h}{3}$.<br><br>Let the new apparent angle of contact be $\\theta'$.<br><br>Using the relation $\\dfrac{h}{\\cos \\theta} = \\dfrac{h'}{\\cos \\theta'}$, we get:<br><br>$\\dfrac{h}{1} = \\dfrac{\\dfrac{h}{3}}{\\cos \\theta'}$<br><br>$\\cos \\theta' = \\dfrac{1}{3}$<br><br>$\\theta' = \\cos^{-1}\\left(\\dfrac{1}{3}\\right)$<br><br>Answer: $\\quad \\cos ^{-1}\\left(\\frac{1}{3}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792142b0aee93fa0796de86", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "In most liquids, with rise in temperature, surface tension of a liquid", "image": null}, "options": [{"id": "M5RvI", "text": "first decreases and then increases.", "image": null, "isCorrect": false}, {"id": "UxWbM", "text": "increases.", "image": null, "isCorrect": false}, {"id": "3DjYF", "text": "decreases.", "image": null, "isCorrect": true}, {"id": "n0Pei", "text": "remains unchanged.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "With a rise in temperature, the kinetic energy of the liquid molecules increases. This increased thermal agitation weakens the intermolecular forces of attraction (cohesive forces) between the molecules.<br><br>Since surface tension is a direct consequence of these cohesive forces, a decrease in the cohesive forces leads to a decrease in surface tension.<br><br>Therefore, in most liquids, the surface tension decreases with an increase in temperature and becomes zero at the critical temperature.<br><br>Answer: decreases.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792140a0aee93fa0796dd80", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "Two capillary tubes A and B of the same internal diameter are kept vertically in two different liquids whose densities are in the ratio $4: 3$. If the surface tensions of these two liquids are in the ratio $6: 5$, then the ratio of rise of liquid in capillary A to that in B is (assume their angles of contact are nearly equal)", "image": null}, "options": [{"id": "L0Alb", "text": "10:9", "image": null, "isCorrect": false}, {"id": "vj55i", "text": "$9: 10$", "image": null, "isCorrect": true}, {"id": "hy2NI", "text": "7:10", "image": null, "isCorrect": false}, {"id": "QOTu2", "text": "$10: 7$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The formula for capillary rise is given by $h = \\dfrac{2T \\cos \\theta}{r \\rho g}$<br><br>Since the internal diameters are the same, $r_A = r_B$. The angles of contact are nearly equal, so $\\cos \\theta_A = \\cos \\theta_B$.<br><br>The ratio of capillary rise is:<br><br>$\\dfrac{h_A}{h_B} = \\dfrac{T_A}{T_B} \\times \\dfrac{\\rho_B}{\\rho_A}$<br><br>Given $\\dfrac{T_A}{T_B} = \\dfrac{6}{5}$ and $\\dfrac{\\rho_A}{\\rho_B} = \\dfrac{4}{3}$<br><br>$\\dfrac{h_A}{h_B} = \\dfrac{6}{5} \\times \\dfrac{3}{4} = \\dfrac{18}{20} = \\dfrac{9}{10}$<br><br>Answer: $9: 10$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214060aee93fa0796dd64", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "The angle of contact between glass and water is $0^{\\circ}$ and water rises in a glass capillary upto 6 cm (Surface tension of water is T). Another liquid of surface tension ' $2 \\mathrm{~T}^{\\prime}$, angle of contact $60^{\\circ}$ and relative density 2 will rise in the same capillary up to $\\left(\\cos 0^{\\circ}=1, \\cos 60^{\\circ}=0.5\\right)$", "image": null}, "options": [{"id": "2zi2v", "text": "1.5 cm", "image": null, "isCorrect": false}, {"id": "9GvTi", "text": "2 cm", "image": null, "isCorrect": false}, {"id": "Zdxv1", "text": "3 cm", "image": null, "isCorrect": true}, {"id": "4xGcA", "text": "4.0 cm", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The height of liquid in a capillary tube is given by Jurin's law:<br><br>$h = \\dfrac{2T \\cos \\theta}{r \\rho g}$<br><br>For water:<br>$h_1 = 6 \\text{ cm}$<br>$T_1 = T$<br>$\\theta_1 = 0^{\\circ}$<br>$\\rho_1 = \\rho_w$<br><br>For the second liquid:<br>$T_2 = 2T$<br>$\\theta_2 = 60^{\\circ}$<br>$\\rho_2 = 2\\rho_w$<br><br>Taking the ratio of the heights for the same capillary tube ($r_1 = r_2 = r$):<br><br>$\\dfrac{h_2}{h_1} = \\dfrac{T_2}{T_1} \\times \\dfrac{\\cos \\theta_2}{\\cos \\theta_1} \\times \\dfrac{\\rho_1}{\\rho_2}$<br><br>Substituting the given values:<br><br>$\\dfrac{h_2}{6} = \\left(\\dfrac{2T}{T}\\right) \\times \\left(\\dfrac{\\cos 60^{\\circ}}{\\cos 0^{\\circ}}\\right) \\times \\left(\\dfrac{\\rho_w}{2\\rho_w}\\right)$<br><br>$\\dfrac{h_2}{6} = 2 \\times \\dfrac{0.5}{1} \\times \\dfrac{1}{2}$<br><br>$\\dfrac{h_2}{6} = 0.5$<br><br>$h_2 = 3 \\text{ cm}$<br><br>Answer: 3 cm", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214060aee93fa0796dd5d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "When a mercury drop of radius ' $R$ ' splits up into 1000 droplets of radius ' $r$ ', the change in surface energy is ( $T=$ surface tension of mercury)", "image": null}, "options": [{"id": "wE24c", "text": "$8 \\pi \\mathrm{R}^2 \\mathrm{~T}$", "image": null, "isCorrect": false}, {"id": "EUEdJ", "text": "$16 \\pi \\mathrm{R}^2 \\mathrm{~T}$", "image": null, "isCorrect": false}, {"id": "vk5PY", "text": "$\\quad 34 \\pi \\mathrm{R}^2 \\mathrm{~T}$", "image": null, "isCorrect": false}, {"id": "RHJCG", "text": "$\\quad 36 \\pi R^2 T$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Volume of the large drop is equal to the total volume of 1000 small droplets.<br><br>$\\dfrac{4}{3} \\pi R^3 = 1000 \\times \\dfrac{4}{3} \\pi r^3$<br><br>$R^3 = 1000 r^3$<br><br>$R = 10 r \\Rightarrow r = \\dfrac{R}{10}$<br><br>Initial surface area, $A_1 = 4 \\pi R^2$<br><br>Final surface area, $A_2 = 1000 \\times 4 \\pi r^2$<br><br>$A_2 = 1000 \\times 4 \\pi \\left(\\dfrac{R}{10}\\right)^2 = 40 \\pi R^2$<br><br>Change in surface area, $\\Delta A = A_2 - A_1$<br><br>$\\Delta A = 40 \\pi R^2 - 4 \\pi R^2 = 36 \\pi R^2$<br><br>Change in surface energy, $\\Delta E = T \\Delta A = 36 \\pi R^2 T$<br><br>Answer: $\\quad 36 \\pi R^2 T$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213f50aee93fa0796dcdd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "A capillary tube stands with its lower end dipped into liquid for which the angle of contact is $90^{\\circ}$. The liquid will", "image": null}, "options": [{"id": "eqAab", "text": "neither rise nor fall.", "image": null, "isCorrect": true}, {"id": "fd5z0", "text": "get depressed only.", "image": null, "isCorrect": false}, {"id": "pw7lX", "text": "rise only.", "image": null, "isCorrect": false}, {"id": "SuHCG", "text": "rise upto the top of the tube.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The height of the liquid column in a capillary tube is given by Jurin's law:<br><br>$h = \\dfrac{2T \\cos \\theta}{r \\rho g}$<br><br>where $T$ is the surface tension, $\\theta$ is the angle of contact, $r$ is the radius of the capillary tube, $\\rho$ is the density of the liquid, and $g$ is the acceleration due to gravity.<br><br>Given that the angle of contact $\\theta = 90^{\\circ}$.<br><br>Substituting $\\theta = 90^{\\circ}$ in the formula, we get:<br><br>$h = \\dfrac{2T \\cos 90^{\\circ}}{r \\rho g}$<br><br>Since $\\cos 90^{\\circ} = 0$, we have:<br><br>$h = 0$<br><br>Thus, the liquid will neither rise nor fall in the capillary tube.<br><br>Answer: neither rise nor fall.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e50aee93fa0796dc5d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "The work done in blowing a soap bubble of radius R is $\\mathrm{W}_1$ at room temperature. Now the soap solution is heated. From the heated solution another soap bubble of radius 2 R is blown and the work done is $\\mathrm{W}_2$. Then", "image": null}, "options": [{"id": "6Rod8", "text": "$\\mathrm{W}_2=0$", "image": null, "isCorrect": false}, {"id": "OxgKX", "text": "$\\mathrm{W}_2=4 \\mathrm{~W}_1$", "image": null, "isCorrect": false}, {"id": "wUq24", "text": "$\\mathrm{W}_2 \\lt 4 \\mathrm{~W}_1$", "image": null, "isCorrect": true}, {"id": "4B6Xg", "text": "$\\quad \\mathrm{W}_2=\\mathrm{W}_1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The work done in blowing a soap bubble of radius $R$ is given by $W = 2 \\times 4\\pi R^2 \\times T = 8\\pi R^2 T$, where $T$ is the surface tension of the soap solution.<br><br>At room temperature, the work done is $W_1 = 8\\pi R^2 T_1$.<br><br>When the soap solution is heated, its surface tension decreases. Let the new surface tension at the higher temperature be $T_2$. Thus, $T_2 < T_1$.<br><br>The work done in blowing a new bubble of radius $2R$ from the heated solution is:<br><br>$W_2 = 8\\pi (2R)^2 T_2 = 32\\pi R^2 T_2 = 4(8\\pi R^2 T_2)$<br><br>Since $T_2 < T_1$, we can write:<br><br>$4(8\\pi R^2 T_2) < 4(8\\pi R^2 T_1)$<br><br>Therefore, $W_2 < 4W_1$.<br><br>Answer: $\\mathrm{W}_2 \\lt 4 \\mathrm{~W}_1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e20aee93fa0796dc48", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "Water rises in a capillary tube of radius ' $r$ ' up to height ' $h$ '. The mass of water in capillary is ' $m$ '. The mass of water that will rise in capillary of radius $\\mathrm{r} / 3$ will be", "image": null}, "options": [{"id": "Xxb9a", "text": "m", "image": null, "isCorrect": false}, {"id": "jXiqY", "text": "$\\frac{\\mathrm{m}}{3}$", "image": null, "isCorrect": true}, {"id": "e2CSn", "text": "$\\frac{m}{6}$", "image": null, "isCorrect": false}, {"id": "R3Gtf", "text": "$\\frac{\\mathrm{m}}{9}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The height of water in a capillary tube is given by $h = \\dfrac{2T \\cos \\theta}{r \\rho g}$.<br><br>The mass of water in the capillary tube is $m = \\pi r^2 h \\rho$.<br><br>Substituting the value of $h$, we get:<br><br>$m = \\pi r^2 \\left( \\dfrac{2T \\cos \\theta}{r \\rho g} \\right) \\rho = \\dfrac{2 \\pi r T \\cos \\theta}{g}$<br><br>This implies that $m \\propto r$.<br><br>For a capillary tube of radius $r' = \\dfrac{r}{3}$, the new mass $m'$ is:<br><br>$m' = \\dfrac{m}{3}$<br><br>Answer: $\\frac{\\mathrm{m}}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213df0aee93fa0796dc32", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "A big water drop is formed by the combination of ' $n$ ' small water droplets of equal radii. The ratio of the surface energy of ' $n$ ' droplets to the surface energy of the big drop is", "image": null}, "options": [{"id": "3rkZE", "text": "$\\sqrt{\\mathrm{n}}: 1$", "image": null, "isCorrect": false}, {"id": "XKWbE", "text": "$\\sqrt[3]{\\mathrm{n}}: 1$", "image": null, "isCorrect": true}, {"id": "z0HoE", "text": "$n: 1$", "image": null, "isCorrect": false}, {"id": "68Poc", "text": "$\\mathrm{n}^2: 1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $r$ be the radius of each small droplet and $R$ be the radius of the big drop.<br><br>By conservation of volume:<br>$n \\times \\dfrac{4}{3} \\pi r^3 = \\dfrac{4}{3} \\pi R^3$<br>$R = n^{1/3} r$<br><br>Surface energy of $n$ small droplets is $E_1 = n \\times 4 \\pi r^2 T$<br>Surface energy of the big drop is $E_2 = 4 \\pi R^2 T$<br><br>The required ratio is:<br>$\\dfrac{E_1}{E_2} = \\dfrac{n \\times 4 \\pi r^2 T}{4 \\pi R^2 T} = \\dfrac{n r^2}{R^2}$<br><br>Substituting $R = n^{1/3} r$:<br>$\\dfrac{E_1}{E_2} = \\dfrac{n r^2}{(n^{1/3} r)^2} = \\dfrac{n}{n^{2/3}} = n^{1/3}$<br><br>The ratio is $\\sqrt[3]{n} : 1$.<br><br>Answer: $\\sqrt[3]{\\mathrm{n}}: 1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d10aee93fa0796dbc4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "A glass capillary of radius $0.35\\text{ mm}$ is inclined at $60^\\circ$ with the vertical in water. The length of the water column in the capillary is (surface tension of water = $7 \\times 10^{-2}\\text{ N/m}$, acceleration due to gravity, g = $10\\text{ m/s}^2$, $\\cos 0^\\circ = 1$, $\\cos 60^\\circ = 0.5$)", "image": null}, "options": [{"id": "Qu9bm", "text": "6 cm", "image": null, "isCorrect": false}, {"id": "HaG1k", "text": "8 cm", "image": null, "isCorrect": true}, {"id": "HUbv0", "text": "10 cm", "image": null, "isCorrect": false}, {"id": "GdYhb", "text": "12 cm", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The vertical height $h$ to which water rises in a capillary tube is given by<br><br>$h = \\dfrac{2T \\cos \\theta}{r \\rho g}$<br><br>Substituting the given values:<br><br>$h = \\dfrac{2 \\times 7 \\times 10^{-2} \\times 1}{0.35 \\times 10^{-3} \\times 1000 \\times 10}$<br><br>$h = \\dfrac{14 \\times 10^{-2}}{3.5} = 0.04 \\text{ m} = 4 \\text{ cm}$<br><br>When the capillary tube is inclined at an angle $\\alpha$ with the vertical, the vertical height of the liquid column remains the same. If $l$ is the length of the water column in the inclined tube, then<br><br>$h = l \\cos \\alpha$<br><br>$l = \\dfrac{h}{\\cos 60^\\circ}$<br><br>$l = \\dfrac{4}{0.5} = 8 \\text{ cm}$<br><br>Answer: 8 cm", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213cd0aee93fa0796db9e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "Two soap bubbles having radii ' $r_1$ ' and ' $r_2$ ' has inside pressure ' $\\mathrm{P}_1$ ' and ' $\\mathrm{P}_2$ ' respectively. If $\\mathrm{P}_0$ is external pressure then ratio of their volume is", "image": null}, "options": [{"id": "sAQuv", "text": "$\\dfrac{\\left(\\mathrm{P}_1-\\mathrm{P}_0\\right)}{\\left(\\mathrm{P}_2-\\mathrm{P}_0\\right)}$", "image": null, "isCorrect": false}, {"id": "f3Dgg", "text": "$\\dfrac{\\left(\\mathrm{P}_2-\\mathrm{P}_0\\right)}{\\left(\\mathrm{P}_1-\\mathrm{P}_0\\right)}$", "image": null, "isCorrect": false}, {"id": "jJ5Y4", "text": "$\\dfrac{\\left(\\mathrm{P}_2-\\mathrm{P}_0\\right)^3}{\\left(\\mathrm{P}_1-\\mathrm{P}_0\\right)^3}$", "image": null, "isCorrect": true}, {"id": "5AGMR", "text": "$\\dfrac{\\left(\\mathrm{P}_1-\\mathrm{P}_0\\right)^3}{\\left(\\mathrm{P}_2-\\mathrm{P}_0\\right)^3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The excess pressure inside a soap bubble is given by $\\Delta P = \\dfrac{4T}{r}$.<br><br>For the first bubble, $P_1 - P_0 = \\dfrac{4T}{r_1} \\Rightarrow r_1 = \\dfrac{4T}{P_1 - P_0}$.<br><br>For the second bubble, $P_2 - P_0 = \\dfrac{4T}{r_2} \\Rightarrow r_2 = \\dfrac{4T}{P_2 - P_0}$.<br><br>The volume of a spherical bubble is $V = \\dfrac{4}{3}\\pi r^3$.<br><br>The ratio of their volumes is $\\dfrac{V_1}{V_2} = \\left(\\dfrac{r_1}{r_2}\\right)^3$.<br><br>Substituting the values of $r_1$ and $r_2$, we get $\\dfrac{V_1}{V_2} = \\left(\\dfrac{\\dfrac{4T}{P_1 - P_0}}{\\dfrac{4T}{P_2 - P_0}}\\right)^3 = \\dfrac{(P_2 - P_0)^3}{(P_1 - P_0)^3}$.<br><br>Answer: $\\dfrac{\\left(\\mathrm{P}_2-\\mathrm{P}_0\\right)^3}{\\left(\\mathrm{P}_1-\\mathrm{P}_0\\right)^3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213a90aee93fa0796da86", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "The work done in splitting a water drop of radius R into 64 droplets is ( $\\mathrm{T}=$ Surface tension of water)", "image": null}, "options": [{"id": "3BxD4", "text": "$6 \\pi \\mathrm{TR}^2$", "image": null, "isCorrect": false}, {"id": "QBW0Y", "text": "$12 \\pi \\mathrm{TR}^2$", "image": null, "isCorrect": true}, {"id": "C6jF8", "text": "$8 \\pi \\mathrm{TR}^2$", "image": null, "isCorrect": false}, {"id": "WY50X", "text": "$\\quad 24 \\pi \\mathrm{TR}^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the radius of the large drop be $R$ and the radius of each small droplet be $r$.<br><br>Since the volume remains constant during the splitting process:<br><br>$\\dfrac{4}{3} \\pi R^3 = 64 \\times \\dfrac{4}{3} \\pi r^3$<br><br>$R^3 = 64 r^3 \\Rightarrow r = \\dfrac{R}{4}$<br><br>Initial surface area of the large drop:<br><br>$A_i = 4 \\pi R^2$<br><br>Final surface area of the 64 small droplets:<br><br>$A_f = 64 \\times 4 \\pi r^2 = 64 \\times 4 \\pi \\left(\\dfrac{R}{4}\\right)^2 = 16 \\pi R^2$<br><br>Change in surface area:<br><br>$\\Delta A = A_f - A_i = 16 \\pi R^2 - 4 \\pi R^2 = 12 \\pi R^2$<br><br>Work done in splitting the drop is equal to the product of surface tension and the change in surface area:<br><br>$W = \\mathrm{T} \\Delta A = 12 \\pi \\mathrm{T} R^2$<br><br>Answer: $12 \\pi \\mathrm{TR}^2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213a70aee93fa0796da7a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "Let ' $n$ ' is the number of liquid drops, each with surface energy ' $E$ '. These drops join to form single drop. In this process", "image": null}, "options": [{"id": "4oGgB", "text": "some energy will be absorbed", "image": null, "isCorrect": false}, {"id": "lsXPt", "text": "energy absorbed is $\\left[E\\left(n-n^{2 / 3}\\right)\\right]$", "image": null, "isCorrect": false}, {"id": "sQKmK", "text": "energy released will be $\\left[E\\left(n-n^{2 / 3}\\right)\\right]$", "image": null, "isCorrect": true}, {"id": "xTFOz", "text": "energy released will be $\\left[\\mathrm{E}\\left(2^{2 / 3}-1\\right)\\right]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $r$ be the radius of each small drop and $R$ be the radius of the large drop.<br><br>Since volume remains constant during the process:<br><br>$\\dfrac{4}{3}\\pi R^3 = n \\times \\dfrac{4}{3}\\pi r^3$<br><br>$R = n^{1/3}r$<br><br>The surface energy of one small drop is $E = 4\\pi r^2 T$, where $T$ is the surface tension.<br><br>Initial total surface energy of $n$ drops:<br><br>$E_i = n \\times (4\\pi r^2 T) = nE$<br><br>Final surface energy of the single large drop:<br><br>$E_f = 4\\pi R^2 T = 4\\pi (n^{1/3}r)^2 T = n^{2/3}(4\\pi r^2 T) = n^{2/3}E$<br><br>Since $E_i > E_f$, the surface energy decreases, which means energy is released.<br><br>Energy released $= E_i - E_f = nE - n^{2/3}E = E(n - n^{2/3})$<br><br>Answer: energy released will be $\\left[E\\left(n-n^{2 / 3}\\right)\\right]$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213a50aee93fa0796da6d", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "Three liquids of densities $\\rho_1, \\rho_2$ and $\\rho_3$ (with $\\rho_1\\gt\\rho_2\\gt\\rho_3$ ) having same value of surface tension T , rise to the same height in three identical capillaries. Angle of contact $\\theta_1, \\theta_2$ and $\\theta_3$ respectively obey", "image": null}, "options": [{"id": "JzuBC", "text": "$\\dfrac{\\pi}{2}\\gt\\theta_1\\gt\\theta_2\\gt\\theta_3\\gt0$", "image": null, "isCorrect": false}, {"id": "1sujO", "text": "$0 \\leqslant \\theta_1 \\lt \\theta_2 \\lt \\theta_3 \\lt \\dfrac{\\pi}{2}$", "image": null, "isCorrect": true}, {"id": "1sRRM", "text": "$\\dfrac{\\pi}{2} \\lt \\theta_1 \\lt \\theta_2 \\lt \\theta_3 \\lt \\pi$", "image": null, "isCorrect": false}, {"id": "5bis2", "text": "$\\pi\\gt\\theta_1\\gt\\theta_2\\gt\\dfrac{\\pi}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The height of capillary rise is given by Jurin's law:<br><br>$h = \\dfrac{2T \\cos\\theta}{\\rho g r}$<br><br>Rearranging the formula for $\\cos\\theta$, we get:<br><br>$\\cos\\theta = \\dfrac{h r g}{2T} \\rho$<br><br>Since the liquids rise to the same height $h$ in identical capillaries (same radius $r$) and have the same surface tension $T$, the term $\\dfrac{h r g}{2T}$ is a positive constant. Thus, $\\cos\\theta \\propto \\rho$.<br><br>Given the relation between densities is $\\rho_1 \\gt \\rho_2 \\gt \\rho_3$, it follows that:<br><br>$\\cos\\theta_1 \\gt \\cos\\theta_2 \\gt \\cos\\theta_3$<br><br>Since the liquids rise in the capillary ($h \\gt 0$), $\\cos\\theta$ must be positive, meaning the angles of contact are acute, i.e., $0 \\leqslant \\theta \\lt \\dfrac{\\pi}{2}$.<br><br>In the interval $[0, \\dfrac{\\pi}{2})$, the cosine function is strictly decreasing. Therefore, a larger value of cosine corresponds to a smaller angle. This gives:<br><br>$\\theta_1 \\lt \\theta_2 \\lt \\theta_3$<br><br>Combining the conditions, we get:<br><br>$0 \\leqslant \\theta_1 \\lt \\theta_2 \\lt \\theta_3 \\lt \\dfrac{\\pi}{2}$<br><br>Answer: $0 \\leqslant \\theta_1 \\lt \\theta_2 \\lt \\theta_3 \\lt \\dfrac{\\pi}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213950aee93fa0796d9ea", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "When an air bubble rises from the bottom of lake to the surface, its radius is doubled. The atmospheric pressure is equal to that of a column of water of height ' $H$ '. The depth of the lake is", "image": null}, "options": [{"id": "uIyLF", "text": "H", "image": null, "isCorrect": false}, {"id": "V9lxe", "text": "2 H", "image": null, "isCorrect": false}, {"id": "k6UaT", "text": "7 H", "image": null, "isCorrect": true}, {"id": "GMEEz", "text": "8 H", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the radius of the bubble at the bottom be $r$ and at the surface be $2r$.<br><br>Volume of the bubble at the bottom, $V_1 = \\dfrac{4}{3}\\pi r^3$<br><br>Volume of the bubble at the surface, $V_2 = \\dfrac{4}{3}\\pi (2r)^3 = 8V_1$<br><br>Let the depth of the lake be $h$. The atmospheric pressure is given as $P_2 = \\rho g H$, where $\\rho$ is the density of water.<br><br>Pressure at the bottom of the lake, $P_1 = P_{atm} + \\rho g h = \\rho g H + \\rho g h = \\rho g(H + h)$<br><br>Assuming the temperature of the lake is constant, we apply Boyle's law:<br><br>$P_1 V_1 = P_2 V_2$<br><br>$\\rho g(H + h) \\times V_1 = \\rho g H \\times 8V_1$<br><br>$H + h = 8H$<br><br>$h = 7H$<br><br>Answer: 7 H", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213850aee93fa0796d96c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "Identify the correct figure which shows the relation between the height of water column in a capillary tube and the capillary radius.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/vnu-B5xGkQYnkHpm9jmmZ6f975Cn-gxouhUga6H-r40.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "chh1v", "text": "(ii)", "image": null, "isCorrect": true}, {"id": "xZKD0", "text": "(iv)", "image": null, "isCorrect": false}, {"id": "JGSl3", "text": "(i)", "image": null, "isCorrect": false}, {"id": "JWcc9", "text": "(iii)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The height $h$ of the liquid column in a capillary tube is given by Jurin's law:<br><br>$h = \\dfrac{2T \\cos \\theta}{\\rho g r}$<br><br>where $T$ is the surface tension, $\\theta$ is the angle of contact, $\\rho$ is the density of the liquid, $g$ is the acceleration due to gravity, and $r$ is the radius of the capillary tube.<br><br>For a given liquid and material of the capillary tube, $T$, $\\theta$, $\\rho$, and $g$ are constants. Therefore, the height $h$ is inversely proportional to the radius $r$:<br><br>$h \\propto \\dfrac{1}{r}$<br><br>This inverse relationship means that the graph between $h$ and $r$ is a rectangular hyperbola. Looking at the given figures, graph (ii) correctly represents this rectangular hyperbolic relation.<br><br>Answer: (ii)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213810aee93fa0796d94f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "A water film is formed between two parallel wires of 10 cm length. The distance of 0.5 cm between the wires is increased by 1 mm . The work done in the process is (surface tension of water $=72 \\mathrm{~N} / \\mathrm{m}$ ).", "image": null}, "options": [{"id": "knBTv", "text": "$2.88 \\times 10^{-2} \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "OFaLv", "text": "$7.2 \\times 10^{-2} \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "MNWhC", "text": "$1.44 \\times 10^{-2} \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "r3y7c", "text": "$3.6 \\times 10^{-2} \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The work done in stretching a liquid film is given by the product of surface tension and the change in surface area:<br><br>$W = T \\times \\Delta A$<br><br>Since a liquid film has two free surfaces (front and back), the total increase in surface area is:<br><br>$\\Delta A = 2 \\times L \\times \\Delta x$<br><br>Given:<br>Length of the wire, $L = 10 \\text{ cm} = 0.1 \\text{ m}$<br>Increase in distance, $\\Delta x = 1 \\text{ mm} = 10^{-3} \\text{ m}$<br>Surface tension, $T = 72 \\text{ N/m}$<br><br>Substituting the values to find the change in area:<br><br>$\\Delta A = 2 \\times 0.1 \\times 10^{-3} = 2 \\times 10^{-4} \\text{ m}^2$<br><br>Now, calculating the work done:<br><br>$W = 72 \\times 2 \\times 10^{-4}$<br><br>$W = 144 \\times 10^{-4} \\text{ J}$<br><br>$W = 1.44 \\times 10^{-2} \\text{ J}$<br><br>Answer: $1.44 \\times 10^{-2} \\mathrm{~J}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213700aee93fa0796d8ce", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "The excess pressure inside a spherical drop of water A is four times that of another drop B. Then the ratio of mass of drop $A$ to that of drop $B$ is", "image": null}, "options": [{"id": "0jef2", "text": "$1: 4$", "image": null, "isCorrect": false}, {"id": "FEBwX", "text": "$1: 8$", "image": null, "isCorrect": false}, {"id": "JnNs8", "text": "$1: 16$", "image": null, "isCorrect": false}, {"id": "SwP2K", "text": "$1: 64$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Excess pressure inside a spherical drop of water is given by $\\Delta P = \\dfrac{2T}{R}$.<br><br>Given $\\Delta P_A = 4 \\Delta P_B$.<br><br>$\\dfrac{2T}{R_A} = 4 \\left(\\dfrac{2T}{R_B}\\right)$<br><br>$R_B = 4 R_A$<br><br>The mass of a spherical drop is $M = \\dfrac{4}{3} \\pi R^3 \\rho$.<br><br>The ratio of mass of drop A to that of drop B is<br><br>$\\dfrac{M_A}{M_B} = \\left(\\dfrac{R_A}{R_B}\\right)^3$<br><br>$\\dfrac{M_A}{M_B} = \\left(\\dfrac{1}{4}\\right)^3 = \\dfrac{1}{64}$<br><br>Answer: $1: 64$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792136d0aee93fa0796d8b2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "Water rises up to height ' $X$ ' in a capillary tube immersed vertically in water. When the whole arrangement is taken to a depth ' $d$ ' in a mine, the water level rises up to height ' $Y$ '. If ' $R$ ' is\r\nthe radius of earth then the ratio $\\dfrac{Y}{X}$ is", "image": null}, "options": [{"id": "Qz0FD", "text": "$\\left(1-\\dfrac{d}{R}\\right)^{-1}$", "image": null, "isCorrect": true}, {"id": "H9H6g", "text": "$\\left(1-\\dfrac{d}{R}\\right)$", "image": null, "isCorrect": false}, {"id": "5Qsft", "text": "$\\left(1+\\dfrac{d}{R}\\right)^{-1}$", "image": null, "isCorrect": false}, {"id": "TGDXk", "text": "$\\left(1+\\dfrac{d}{R}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The height of capillary rise is given by $h = \\dfrac{2T \\cos \\theta}{\\rho g r}$.<br><br>At the surface of the earth, the height is $X = \\dfrac{2T \\cos \\theta}{\\rho g r}$.<br><br>At a depth $d$ in a mine, the acceleration due to gravity is $g' = g \\left(1 - \\dfrac{d}{R}\\right)$.<br><br>The height of capillary rise at this depth is $Y = \\dfrac{2T \\cos \\theta}{\\rho g' r}$.<br><br>Taking the ratio of $Y$ to $X$, we get:<br><br>$\\dfrac{Y}{X} = \\dfrac{g}{g'}$<br><br>Substituting the value of $g'$, we get:<br><br>$\\dfrac{Y}{X} = \\dfrac{g}{g \\left(1 - \\dfrac{d}{R}\\right)} = \\left(1 - \\dfrac{d}{R}\\right)^{-1}$<br><br>Answer: $\\left(1-\\dfrac{d}{R}\\right)^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792135e0aee93fa0796d83b", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "A liquid drop of density ' $\\rho$ ' is floating half immersed in a liquid of density ' $d$ '. If ' $T$ ' is the surface tension then the diameter of the liquid drop is ( $\\mathrm{g}=$ acceleration due to gravity)", "image": null}, "options": [{"id": "MYijF", "text": "$\\left[\\dfrac{6 \\mathrm{~T}}{\\mathrm{~g}(2 \\rho-\\mathrm{d})}\\right]^{\\dfrac{1}{2}}$", "image": null, "isCorrect": false}, {"id": "8FjYr", "text": "$\\left[\\dfrac{8 \\mathrm{~T}}{3 \\mathrm{~g}(2 \\rho-\\mathrm{d})}\\right]^{\\dfrac{1}{2}}$", "image": null, "isCorrect": false}, {"id": "VYUj0", "text": "$\\left[\\dfrac{12 \\mathrm{~T}}{\\mathrm{~g}(2 \\rho-\\mathrm{d})}\\right]^{\\dfrac{1}{2}}$", "image": null, "isCorrect": true}, {"id": "yVyjm", "text": "$\\left[\\dfrac{3 \\mathrm{~T}}{\\mathrm{~g}(2 \\rho-\\mathrm{d})}\\right]^{\\dfrac{\\mathrm{t}}{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $R$ be the radius of the liquid drop.<br><br>The weight of the drop acting downwards is:<br>$W = \\dfrac{4}{3} \\pi R^3 \\rho g$<br><br>Since the drop is half immersed, the volume of the displaced liquid is $\\dfrac{2}{3} \\pi R^3$. The buoyant force (upthrust) acting upwards is:<br>$F_B = \\dfrac{2}{3} \\pi R^3 d g$<br><br>The surface tension force acts upwards along the circumference of the drop at the liquid surface. The length of the contact line is $2 \\pi R$. The force due to surface tension is:<br>$F_T = 2 \\pi R T$<br><br>For the drop to be in equilibrium, the total downward force must equal the total upward force:<br>$W = F_B + F_T$<br><br>$\\dfrac{4}{3} \\pi R^3 \\rho g = \\dfrac{2}{3} \\pi R^3 d g + 2 \\pi R T$<br><br>$\\dfrac{2}{3} \\pi R^3 (2 \\rho - d) g = 2 \\pi R T$<br><br>$R^2 = \\dfrac{3 T}{g (2 \\rho - d)}$<br><br>$R = \\left[ \\dfrac{3 T}{g (2 \\rho - d)} \\right]^{\\dfrac{1}{2}}$<br><br>The diameter of the drop is $D = 2 R$:<br>$D = 2 \\left[ \\dfrac{3 T}{g (2 \\rho - d)} \\right]^{\\dfrac{1}{2}} = \\left[ \\dfrac{12 T}{g (2 \\rho - d)} \\right]^{\\dfrac{1}{2}}$<br><br>Answer: $\\left[\\dfrac{12 \\mathrm{~T}}{\\mathrm{~g}(2 \\rho-\\mathrm{d})}\\right]^{\\dfrac{1}{2}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792135d0aee93fa0796d833", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "The pressure inside a soap bubble A is 1.01 atmosphere and that in a soap bubble B is 1.02 atmosphere. The ratio of volume of bubble A to that of $B$ is [Surrounding pressure $=1$ atmosphere $]$", "image": null}, "options": [{"id": "L8cDX", "text": "$101: 102$", "image": null, "isCorrect": false}, {"id": "kkw10", "text": "$102: 101$", "image": null, "isCorrect": false}, {"id": "JCBiX", "text": "$8: 1$", "image": null, "isCorrect": true}, {"id": "NcnBQ", "text": "$2: 1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The excess pressure inside a soap bubble is given by $\\Delta P = \\dfrac{4T}{R}$<br><br>For bubble A, the excess pressure is $\\Delta P_A = 1.01 - 1 = 0.01$ atm<br><br>For bubble B, the excess pressure is $\\Delta P_B = 1.02 - 1 = 0.02$ atm<br><br>Since $R = \\dfrac{4T}{\\Delta P}$, the ratio of their radii is<br><br>$\\dfrac{R_A}{R_B} = \\dfrac{\\Delta P_B}{\\Delta P_A} = \\dfrac{0.02}{0.01} = 2$<br><br>The volume of a spherical bubble is $V = \\dfrac{4}{3}\\pi R^3$<br><br>The ratio of their volumes is<br><br>$\\dfrac{V_A}{V_B} = \\left(\\dfrac{R_A}{R_B}\\right)^3 = (2)^3 = 8$<br><br>The ratio of the volume of bubble A to that of B is $8:1$<br><br>Answer: $8: 1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213490aee93fa0796d79c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "The pressure inside two soap bubbles, (A) is 1.01 and that of (B) is 1.02 atmosphere respectively. The ratio of their respective radii (A to B) is (outside pressure $=1 \\mathrm{~atm}$.)", "image": null}, "options": [{"id": "9h0e0", "text": "$2: 1$", "image": null, "isCorrect": true}, {"id": "s1rd9", "text": "$4: 1$", "image": null, "isCorrect": false}, {"id": "GiZL1", "text": "$6: 1$", "image": null, "isCorrect": false}, {"id": "0Loyv", "text": "$8: 1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The excess pressure inside a soap bubble is given by $\\Delta P = \\dfrac{4T}{R}$.<br><br>For bubble A, the excess pressure is $\\Delta P_A = P_A - P_0 = 1.01 - 1 = 0.01 \\text{ atm}$.<br><br>For bubble B, the excess pressure is $\\Delta P_B = P_B - P_0 = 1.02 - 1 = 0.02 \\text{ atm}$.<br><br>Since the radius $R$ is inversely proportional to the excess pressure $\\Delta P$, the ratio of their radii is:<br><br>$\\dfrac{R_A}{R_B} = \\dfrac{\\Delta P_B}{\\Delta P_A} = \\dfrac{0.02}{0.01} = \\dfrac{2}{1}$<br><br>The ratio of their respective radii is $2:1$.<br><br>Answer: $2: 1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213330aee93fa0796d6ea", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "Liquid drops are falling slowly one by one from vertical glass tube. The relation between the weight of a drop ' $w$ ', the surface tension ' $T$ ' and the radius ' $r$ ' of the bore of the tube is (Angle of contact is zero)", "image": null}, "options": [{"id": "vP5sN", "text": "$\\mathrm{W}=\\pi \\mathrm{r}^2 \\mathrm{~T}$", "image": null, "isCorrect": false}, {"id": "3W2v2", "text": "$\\mathrm{W}=2 \\pi^2 \\mathrm{r} T$", "image": null, "isCorrect": false}, {"id": "kRbav", "text": "$\\quad \\mathrm{W}=\\left(\\dfrac{4}{2}\\right) \\pi^2 \\mathrm{rT}$", "image": null, "isCorrect": false}, {"id": "C8qtV", "text": "$\\quad \\mathrm{W}=2 \\pi \\mathrm{rT}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "When a liquid drop falls slowly from a vertical glass tube, it detaches when its weight is just balanced by the upward force due to surface tension.<br><br>The surface tension acts along the circumference of the bore of the tube.<br><br>The circumference of the bore is $2 \\pi r$.<br><br>The upward force due to surface tension is given by $F = T \\times 2 \\pi r \\times \\cos(\\theta)$.<br><br>Given that the angle of contact $\\theta$ is zero, $\\cos(0) = 1$.<br><br>Equating the weight of the drop to the surface tension force, we get $W = 2 \\pi r T$.<br><br>Answer: $\\quad \\mathrm{W}=2 \\pi \\mathrm{rT}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213210aee93fa0796d660", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "The pressure inside a soap bubble A is 1.01 atmosphere and that in a soap bubble B is 1.02 atmosphere. The ratio of volume of A to that of $B$ is", "image": null}, "options": [{"id": "a2m5j", "text": "$2: 1$", "image": null, "isCorrect": false}, {"id": "rHbjM", "text": "$8: 1$", "image": null, "isCorrect": true}, {"id": "WLTnI", "text": "$101: 102$", "image": null, "isCorrect": false}, {"id": "10y4e", "text": "$102: 101$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Excess pressure inside a soap bubble is given by $\\Delta P = \\dfrac{4T}{R}$<br><br>Let the atmospheric pressure be $P_0 = 1$ atm.<br><br>For bubble A, excess pressure $\\Delta P_A = 1.01 - 1 = 0.01$ atm.<br><br>For bubble B, excess pressure $\\Delta P_B = 1.02 - 1 = 0.02$ atm.<br><br>Since $\\Delta P \\propto \\dfrac{1}{R}$, we have $R \\propto \\dfrac{1}{\\Delta P}$<br><br>The volume of a bubble is $V = \\dfrac{4}{3}\\pi R^3$, so $V \\propto \\dfrac{1}{(\\Delta P)^3}$<br><br>The ratio of volumes is $\\dfrac{V_A}{V_B} = \\left(\\dfrac{\\Delta P_B}{\\Delta P_A}\\right)^3 = \\left(\\dfrac{0.02}{0.01}\\right)^3 = 2^3 = 8$<br><br>Thus, the ratio of volume of A to that of B is $8:1$.<br><br>Answer: $8: 1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2627c0279619d9d8a34e8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "It is easier to spray water to which soap is added because addition of soap to water", "image": null}, "options": [{"id": "TOTWQ", "text": "decreases surface tension of water", "image": null, "isCorrect": true}, {"id": "YI6JM", "text": "increases surface tension of water.", "image": null, "isCorrect": false}, {"id": "IzzBn", "text": "makes surface tension of water zero.", "image": null, "isCorrect": false}, {"id": "opymP", "text": "increases its density.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Std.12|Ch-2|Subtopic-2.4", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2627c0279619d9d8a34e7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "1000 small water drops of equal size combine to form a big drop. The ratio of final surface energy to the total initial surface energy is", "image": null}, "options": [{"id": "qceYq", "text": "$10:1$", "image": null, "isCorrect": false}, {"id": "x7mzY", "text": "$1:10$", "image": null, "isCorrect": true}, {"id": "n1QnK", "text": "$1000:1$", "image": null, "isCorrect": false}, {"id": "CiNFc", "text": "$1:1000$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Radii of the bigger and smaller drops are related as, $\\mathrm{R} \\propto \\mathrm{n}^{\\frac{1}{3}} \\mathrm{r}$\nNow, surface energy $E=T d A=T \\times 4 \\pi R^2$\n$\\begin{array}{ll}\n\\therefore \\quad & \\frac{\\mathrm{E}_2}{\\mathrm{E}_1}=\\frac{4 \\pi \\mathrm{R}^2 \\times \\mathrm{T}}{\\mathrm{n} \\times 4 \\pi \\mathrm{r}^2 \\mathrm{~T}} \\\\\n\\therefore \\quad \\frac{\\mathrm{E}_2}{\\mathrm{E}_1} & =\\frac{\\mathrm{R}^2}{\\mathrm{nr}^2}=\\frac{\\mathrm{n}^{\\frac{2}{3}} \\times \\mathrm{r}^2}{\\mathrm{nr}^2} \\\\\n& \\frac{\\mathrm{E}_2}{\\mathrm{E}_1}=\\frac{1}{\\mathrm{n}^{\\frac{1}{3}}}=\\frac{1}{1000^{\\frac{1}{3}}} \\\\\n\\therefore \\quad \\frac{\\mathrm{E}_2}{\\mathrm{E}_1} & =1: 10\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2627b0279619d9d8a34e0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "Two spherical soap bubbles of radii ' $a$ ' and ' $b$ ' in vacuum coalesce under isothermal conditions. The resulting bubble has a radius equal to", "image": null}, "options": [{"id": "gqcbY", "text": "$a+b$", "image": null, "isCorrect": false}, {"id": "iC02Q", "text": "$\\frac {a+b}{2}$", "image": null, "isCorrect": false}, {"id": "9LFOC", "text": "$\\sqrt{a^2+b^2}$", "image": null, "isCorrect": true}, {"id": "hUd1V", "text": "$\\frac {a+b}{ab}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Number of moles is conserved, so\n$\\mathrm{P}_1 \\mathrm{~V}_1+\\mathrm{P}_2 \\mathrm{~V}_2=\\mathrm{P}_3 \\mathrm{~V}$\nBut, $\\mathrm{P}=\\frac{4 \\mathrm{~T}}{\\mathrm{r}}$ where, $\\mathrm{r}$ is the radius of the bubble\n$\\begin{aligned}\n& \\therefore \\quad \\frac{4 \\mathrm{~T}}{\\mathrm{a}}\\left(\\frac{4}{3} \\pi \\mathrm{a}^3\\right)+\\frac{4 \\mathrm{~T}}{\\mathrm{~b}}\\left(\\frac{4}{3} \\pi \\mathrm{b}^3\\right)=\\frac{4 \\mathrm{~T}}{\\mathrm{c}}\\left(\\frac{4}{3} \\pi \\mathrm{c}^3\\right) \\\\\n& \\mathrm{a}^2+\\mathrm{b}^2=\\mathrm{c}^2 \\\\\n& \\mathrm{c}=\\sqrt{\\mathrm{a}^2+\\mathrm{b}^2}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2626a0279619d9d8a3454", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "Water rises in a capillary tube of radius ' $r$ ' upto a height ' $h$ '. The mass of water in a capillary is ' $m$ '. The mass of water that will rise in a capillary tube of radius $\\frac{\\text { ' } r \\text { ' }}{3}$ will be", "image": null}, "options": [{"id": "J80W5", "text": "$3 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "xhwxp", "text": "$\\frac{\\mathrm{m}}{3}$", "image": null, "isCorrect": true}, {"id": "1WkQ7", "text": "$\\mathrm{m}$", "image": null, "isCorrect": false}, {"id": "8Qg5Q", "text": "$\\frac{2 \\mathrm{~m}}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{array}{ll} & \\mathrm{h} \\propto \\frac{1}{\\mathrm{r}} \\\\ & \\text { Mass of water in a capillary, } \\mathrm{m}=\\pi \\mathrm{r}^2 \\mathrm{~h} \\rho \\\\ \\therefore \\quad & \\mathrm{m} \\propto \\mathrm{r}^2 \\mathrm{~h} \\\\ \\therefore \\quad & \\mathrm{m} \\propto \\mathrm{r}^2 / \\mathrm{r} \\\\ \\therefore \\quad & \\frac{\\mathrm{m}_2}{\\mathrm{~m}}=\\frac{\\frac{\\mathrm{r}}{3}}{\\mathrm{r}} \\\\ \\therefore \\quad & \\mathrm{m}_2=\\frac{\\mathrm{m}}{3}\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262570279619d9d8a33c0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "If work done in blowing a soap bubble of volume ' $\\mathrm{V}$ ' is $\\mathrm{W}$ then the work done in blowing the bubble of volume $2 \\mathrm{~V}$ from same soap solution is", "image": null}, "options": [{"id": "JOwZb", "text": "$\\frac{\\mathrm{W}}{2}$", "image": null, "isCorrect": false}, {"id": "VsgSB", "text": "$\\sqrt{2} \\mathrm{~W}$", "image": null, "isCorrect": false}, {"id": "RtzXE", "text": "$(2)^{\\frac{1}{3}} \\mathrm{~W}$", "image": null, "isCorrect": false}, {"id": "i9V4k", "text": "$(4)^{\\frac{1}{3}} \\mathrm{~W}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The work done is given as $\\mathrm{W}=\\mathrm{T} \\Delta \\mathrm{A}$\nVolume of sphere is $\\mathrm{V}=\\frac{4}{3} \\pi \\mathrm{r}^3$\nArea of sphere is $\\mathrm{A}=4 \\pi \\mathrm{r}^2$\n$\\therefore \\quad \\mathrm{A} \\propto \\mathrm{V}^{\\frac{2}{3}}$\n$\\therefore \\quad \\mathrm{W} \\propto \\mathrm{V}^{\\frac{2}{3}}$\n$\\frac{\\mathrm{W}^{\\prime}}{\\mathrm{W}}=\\frac{\\mathrm{V}^{\\frac{2}{3}}}{\\mathrm{~V}^{\\frac{2}{3}}}$\n$\\frac{\\mathrm{W}^{\\prime}}{\\mathrm{W}}=\\frac{(2 \\mathrm{~V})^{\\frac{2}{3}}}{\\mathrm{~V}^{\\frac{2}{3}}} \\quad \\ldots .(\\because \\mathrm{V}=2 \\mathrm{~V})$\n$\\therefore \\quad \\frac{\\mathrm{W}^{\\prime}}{\\mathrm{W}}=2^{\\frac{2}{3}}=4^{\\frac{1}{3}}$\n$\\therefore \\quad \\mathrm{W}^{\\prime}=4^{\\frac{1}{3}} \\mathrm{~W}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262410279619d9d8a330d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "Twenty seven droplets of water each of radius $0.1 \\mathrm{~mm}$ merge to form a single drop then the energy released is", "image": null}, "options": [{"id": "vnp6h", "text": "$1.6 \\times 10^{-3} \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "tF5IN", "text": "$1.6 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "ZsZvp", "text": "$1600 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "MG6BJ", "text": "$1.6 \\times 10^{-7} \\mathrm{~J}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "From\n$$\n\\begin{aligned}\n& \\mathrm{W}=4 \\pi \\mathrm{r}^2 \\mathrm{~T}\\left(\\mathrm{n}-\\mathrm{n}^{2 / 3}\\right) \\\\\n& \\mathrm{W}=4 \\pi \\times\\left(0.1 \\times 10^{-3}\\right)^2 \\times 0.072\\left[27-(3)^{2 / 3}\\right] \\\\\n& =1.627 \\times 10^{-7} \\quad\\left(\\mathrm{~T}_{\\text {water }}=0.075 \\mathrm{~N} / \\mathrm{m}\\right)\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262410279619d9d8a330b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "A large number of water droplets each of radius ' $t$ ' combine to form a large drop of Radius ' $R$ '. If the surface tension of water is ' $T$ ' \\& mechanical equivalent of heat is ' $\\mathrm{J}$ ' then the rise in temperature due to this is", "image": null}, "options": [{"id": "DmN3v", "text": "$\\frac{2 \\mathrm{~T}}{\\mathrm{rJ}}$", "image": null, "isCorrect": false}, {"id": "AWgKl", "text": "$\\frac{3 \\mathrm{~T}}{\\mathrm{RJ}}$", "image": null, "isCorrect": false}, {"id": "5v8fN", "text": "$\\frac{3 \\mathrm{~T}}{\\mathrm{~J}}\\left(\\frac{1}{\\mathrm{r}}-\\frac{1}{\\mathrm{R}}\\right)$", "image": null, "isCorrect": true}, {"id": "HzYsZ", "text": "$\\frac{2 \\mathrm{~T}}{\\mathrm{~J}}\\left(\\frac{1}{\\mathrm{r}}-\\frac{1}{\\mathrm{R}}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Radius of each droplet $=\\mathrm{r}$\nRadius of the drop $=\\mathrm{R}$\nAs volume remains constant,\n$$\n\\begin{aligned}\n& \\mathrm{n} \\times \\frac{4}{3} \\pi \\mathrm{r}^3=\\frac{4}{3} \\pi \\mathrm{R}^3 \\\\\n& \\therefore \\quad \\mathrm{n}=\\frac{\\mathrm{R}^3}{\\mathrm{r}^3}\n\\end{aligned}\n$$\nDecrease in surface area $=4 \\pi r^2 n-4 \\pi R^2 n$\n$$\n\\begin{aligned}\n\\Delta \\mathrm{A} & =4 \\pi\\left[\\mathrm{nr}^2-\\mathrm{R}^2\\right] \\\\\n& =4 \\pi\\left[\\frac{\\mathrm{R}^3}{\\mathrm{r}^3} \\mathrm{r}^2-\\mathrm{R}^2\\right] \\\\\n& =4 \\pi \\mathrm{R}^3\\left[\\frac{1}{\\mathrm{r}}-\\frac{1}{\\mathrm{R}}\\right]\n\\end{aligned}\n$$\nEnery released $\\mathrm{W}=\\mathrm{T} \\times \\Delta \\mathrm{T}$\n$$\n\\begin{aligned}\n& \\text { Heat produced } \\mathrm{Q}=\\frac{\\mathrm{W}}{\\mathrm{J}} \\\\\n& \\text { H }\n\\end{aligned}\n$$\nHeat produced $\\mathrm{Q}=\\frac{\\mathrm{W}}{\\mathrm{J}}$\n$$\n\\mathrm{Q}=\\mathrm{m} \\cdot \\mathrm{s} \\cdot \\Delta \\theta\n$$\nPut (i) and (iii) into (ii)\n$$\n\\begin{aligned}\n& \\mathrm{m} \\cdot \\mathrm{S} \\Delta \\theta=\\frac{4 \\pi \\mathrm{R}^3 \\mathrm{~T}}{\\mathrm{~J}}\\left[\\frac{1}{\\mathrm{r}}-\\frac{1}{\\mathrm{R}}\\right] \\\\\n& \\frac{4}{3} \\pi \\mathrm{R} \\rho_{\\text {water }} \\mathrm{S}_{\\text {water }} \\Delta \\theta=\\frac{4 \\pi \\mathrm{R}^3 \\mathrm{~T}}{\\mathrm{~J}}\\left[\\frac{1}{\\mathrm{r}}-\\frac{1}{\\mathrm{R}}\\right] \\\\\n& \\Delta \\mathrm{Q}=\\frac{3 \\mathrm{~T}}{\\mathrm{~J}}\\left[\\frac{1}{\\mathrm{r}}-\\frac{1}{\\mathrm{R}}\\right]\n\\end{aligned}\n$$", "imag
