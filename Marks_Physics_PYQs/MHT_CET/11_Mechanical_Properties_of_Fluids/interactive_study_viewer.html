2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "A needle is $7 \\mathrm{~cm}$ long. Assuming that the needle is not wetted by water, what is the weight of the needle, so that floats on water?\n$$\n\\left[\\mathrm{T}=\\text { surface tension of water }=70 \\frac{\\mathrm{dyne}}{\\mathrm{cm}}\\right]\n$$\n[acceleration due to gravity $=980 \\mathrm{~cm} \\mathrm{~s}^{-2}$ ]", "image": null}, "options": [{"id": "NJEev", "text": "1 g wt", "image": null, "isCorrect": true}, {"id": "hxbxA", "text": "5 g wt", "image": null, "isCorrect": false}, {"id": "UM9iM", "text": "3 g wt", "image": null, "isCorrect": false}, {"id": "njWbd", "text": "7 g wt", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The weight of the needle is balanced by the force due to surface tension\n$$\n\\begin{aligned}\n& \\mathrm{W}=2 \\mathrm{TL} \\\\\n& =2 \\times 70 \\times 7 \\\\\n& =980 \\mathrm{dyne} \\\\\n& =1 \\mathrm{~g} \\mathrm{wt}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2606e0279619d9d8a246e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "Let ' $W_1$ ' be the work done in blowing a soap bubble of radius ' $r$ ' from soap solution at room temperature. The soap solution is now heated and second soap bubble of radius ' $2 \\mathrm{r}$ ' is blown from the heated soap solution. If ' $\\mathrm{W}_2$ ' is the work done in forming this bubble then", "image": null}, "options": [{"id": "XMo8H", "text": "$\\mathrm{W}_2=2 \\mathrm{~W}_1$", "image": null, "isCorrect": false}, {"id": "FTFmV", "text": "$\\mathrm{W}_2=4 \\mathrm{~W}_1$", "image": null, "isCorrect": false}, {"id": "Qo5YV", "text": "$\\mathrm{W}_2>4 \\mathrm{~W}_1$", "image": null, "isCorrect": false}, {"id": "aOHvP", "text": "$\\mathrm{W}_2 < 4 \\mathrm{~W}_1$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\mathrm{W}_1=8 \\pi \\mathrm{r}^2 \\mathrm{~T}\n$$\nWhere, $\\mathrm{T}=$ surface tension\n$$\n\\mathrm{W}_2=8 \\pi(2 \\mathrm{r})^2 \\mathrm{~T}^{\\prime}=32 \\pi \\mathrm{r}^2 \\mathrm{~T}^{\\prime}\n$$\nSince soap solution is heated, its surface tension decrease.\n$$\n\\begin{aligned}\n& \\therefore \\mathrm{T}^{\\prime} < \\mathrm{T} \\\\\n& \\therefore \\mathrm{W}_2 < 4 \\mathrm{~W}_1\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2606d0279619d9d8a2469", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "A drop of liquid of density ' $\\rho$ ' is floating half immersed in a liquid of density ' $d$ '. If ' $T$ ' is the surface tension, then the diameter of the drop of the liquids is", "image": null}, "options": [{"id": "y3UI7", "text": "$\\sqrt{\\frac{6 T}{g(2 \\rho-d)}}$", "image": null, "isCorrect": false}, {"id": "fmJ2y", "text": "$\\sqrt{\\frac{T}{g(2 \\rho-d)}}$", "image": null, "isCorrect": false}, {"id": "htQL6", "text": "$\\sqrt{\\frac{2 T}{g(2 \\rho-d)}}$", "image": null, "isCorrect": false}, {"id": "jWMl6", "text": "$\\sqrt{\\frac{12 T}{g(2 \\rho-d)}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The drop is in equilibrium under the action of the following forces:\nWeight of the liquid, $\\mathrm{W}=\\mathrm{Mg}=\\frac{4}{3} \\pi \\mathrm{r}^3 \\rho \\mathrm{g}$ (downwards)\nUpthrust $=$ weight of the liquid displaced\n$$\n\\therefore \\mathrm{F}_{\\mathrm{t}}=\\frac{2}{3} \\pi \\mathrm{r}^3 \\mathrm{dg}\n$$\n(upwards)\nForce due to surface tension, $\\mathrm{F}=2 \\pi \\mathrm{rT}$ (upwards)\n$$\n\\begin{aligned}\n& \\therefore \\mathrm{Mg}=\\mathrm{F}+\\mathrm{F}_{\\mathrm{t}} \\\\\n& \\therefore \\mathrm{F}=\\mathrm{Mg}-\\mathrm{F}_{\\mathrm{t}} \\\\\n& \\therefore 2 \\pi \\mathrm{r} T=\\frac{4}{3} \\pi \\mathrm{r}^3 \\rho g-\\frac{2}{3} \\pi \\mathrm{r}^3 \\mathrm{dg} \\\\\n& \\therefore \\mathrm{T}=\\frac{2}{3} \\mathrm{r}^2 \\rho g-\\frac{1}{3} \\mathrm{r}^2 \\mathrm{dg} \\\\\n& =\\mathrm{r}^2 g\\left(\\frac{2}{3} \\rho-\\frac{1}{3} d\\right) \\\\\n& =\\mathrm{r}^2 g\\left(\\frac{2 \\rho-d}{3}\\right) \\\\\n& \\therefore \\mathrm{r}=\\sqrt{\\frac{3 \\mathrm{~T}}{\\mathrm{~g}(2 \\rho-\\mathrm{d})}} \\\\\n& \\therefore \\mathrm{D}=\\sqrt{\\frac{12 \\mathrm{~T}}{\\mathrm{~g}(2 \\rho-d)}}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2606c0279619d9d8a245c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "Water rises in a capillary tube of radius ' $r$ ' to a height ' $h$ '. The mass of water in a capillary is ' $m$ '. The mass of water will rise in a capillary tube of radius $\\frac{r}{3}$ will be", "image": null}, "options": [{"id": "HclIp", "text": "$3m$", "image": null, "isCorrect": false}, {"id": "N0Am9", "text": "$\\frac{\\mathrm{m}}{3}$", "image": null, "isCorrect": true}, {"id": "4tOYb", "text": "$m$", "image": null, "isCorrect": false}, {"id": "QvtGg", "text": "$\\frac{2 \\mathrm{~m}}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{h} \\propto \\frac{1}{\\mathrm{r}} \\quad \\therefore \\frac{\\mathrm{h}_2}{\\mathrm{~h}_1}=\\frac{\\mathrm{r}_1}{\\mathrm{r}_2}=3 \\\\ & \\therefore \\mathrm{h}_2=3 \\mathrm{~h}_1 \\\\ & \\mathrm{~m}_1=\\mathrm{h}_1 \\pi \\mathrm{r}_1^2 \\rho, \\mathrm{m}_2=\\mathrm{h}_2 \\pi \\mathrm{r}_2^2 \\rho \\\\ & \\therefore \\frac{\\mathrm{m}_2}{\\mathrm{~m}_1}=\\frac{\\mathrm{h}_2}{\\mathrm{~h}_1}\\left(\\frac{\\mathrm{r}_2}{\\mathrm{r}_1}\\right)^2=3 \\times\\left(\\frac{1}{3}\\right)^2=\\frac{1}{3} \\\\ & \\therefore \\mathrm{m}_2=\\frac{\\mathrm{m}_1}{3}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2605e0279619d9d8a23ec", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "In capillary tube having area of cross-section ' $A$ ', water rises to a height ' $h$ '. If cross sectional area is reduced to $\\frac{A}{9}$, the rise of water in the capillary tube is", "image": null}, "options": [{"id": "UsdF0", "text": "h", "image": null, "isCorrect": false}, {"id": "KQPh8", "text": "4 h", "image": null, "isCorrect": false}, {"id": "QhKOU", "text": "3 h", "image": null, "isCorrect": true}, {"id": "8b7Jg", "text": "2h", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & h=\\frac{2 T \\cos \\theta}{r \\rho g} \\\\ & \\Rightarrow h \\propto \\frac{1}{r} \\\\ & \\text { And } A=\\pi r^2 \\Rightarrow r \\propto \\sqrt{A} \\\\ & \\Rightarrow h \\propto \\frac{1}{\\sqrt{A}} \\\\ & \\text { Now, } \\frac{h_2}{h_1}=\\sqrt{\\frac{A_1}{A_2}} \\\\ & \\Rightarrow \\frac{h_2}{h}=\\sqrt{\\frac{A}{A / 9}}=3 \\\\ & \\Rightarrow h_2=3 h\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2605c0279619d9d8a23df", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "A big water drop is divided into 8 equal droplets. $\\Delta \\mathrm{P}_{\\mathrm{S}}$ and $\\Delta \\mathrm{P}_{\\mathrm{B}}$ be the excess pressure inside a smaller and bigger drop respectively. The relation between $\\Delta \\mathrm{P}_{\\mathrm{S}}$ and $\\Delta \\mathrm{P}_{\\mathrm{B}}$ is", "image": null}, "options": [{"id": "xqMwE", "text": "$\\Delta \\mathrm{P}_{\\mathrm{B}}=\\Delta \\mathrm{P}_{\\mathrm{S}}$", "image": null, "isCorrect": false}, {"id": "v60ET", "text": "$\\Delta \\mathrm{P}_{\\mathrm{B}}=\\frac{1}{2} \\Delta \\mathrm{P}_{\\mathrm{S}}$", "image": null, "isCorrect": true}, {"id": "ed8J7", "text": "$\\Delta \\mathrm{P}_{\\mathrm{B}}=\\frac{1}{4} \\Delta \\mathrm{P}_{\\mathrm{S}}$", "image": null, "isCorrect": false}, {"id": "ge5Dx", "text": "$\\Delta \\mathrm{P}_{\\mathrm{B}}=2 \\Delta \\mathrm{P}_{\\mathrm{S}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Volume of 8 smaller drop $=$ Volume of the bigger drop\n$$\n\\begin{aligned}\n& \\therefore 8 \\times \\frac{4}{3} \\pi r^3=\\frac{4 \\pi}{3} R^3 \\\\\n& \\therefore 2 r=R \\text { or } r=\\frac{R}{2}\n\\end{aligned}\n$$\nExcess pressure $\\Delta \\mathrm{P}_{\\mathrm{s}}=\\frac{2 \\mathrm{~T}}{\\mathrm{r}}$ and $\\Delta \\mathrm{P}_{\\mathrm{B}}=\\frac{2 \\mathrm{~T}}{\\mathrm{R}}$\n$$\n\\therefore \\frac{\\Delta \\mathrm{P}_{\\mathrm{B}}}{\\Delta \\mathrm{P}_{\\mathrm{S}}}=\\frac{\\mathrm{r}}{\\mathrm{R}}=\\frac{1}{2}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260590279619d9d8a23c6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "Water rises to a height $10 \\mathrm{~cm}$ in a capillary tube. It will rise to a height which is much more than $10 \\mathrm{~cm}$ in a very long capillary tube if the apparatus is kept.", "image": null}, "options": [{"id": "6yP9t", "text": "on the surface of moon", "image": null, "isCorrect": true}, {"id": "gWYin", "text": "at the north pole", "image": null, "isCorrect": false}, {"id": "2L9qZ", "text": "in a lift moving up with an acceleration", "image": null, "isCorrect": false}, {"id": "0TGqT", "text": "on the equator", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Rise in a capillary tube is given by\n$$\n\\begin{aligned}\n& \\mathrm{h}=\\frac{2 \\mathrm{~T} \\cos \\theta}{\\mathrm{r} \\rho \\mathrm{g}} \\\\\n& \\therefore \\mathrm{h} \\propto \\frac{1}{\\mathrm{~g}}\n\\end{aligned}\n$$\nSmaller the value of $g$. greater will be h. Out of the given options, value $g$ will be minimum for option (A)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260580279619d9d8a23bc", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "Under isothermal conditions, two soap bubbles of radii ' $r_1$ ' and ' $r_2$ ' combine to forms a single soap bubble of radius ' $R$ '. The surface tension of soap solution is ( $\\mathrm{P}=$ outside pressure)", "image": null}, "options": [{"id": "7IYtm", "text": "$\\frac{\\mathrm{P}\\left(\\mathrm{R}^3+\\mathrm{r}_1^3+\\mathrm{r}_2^3\\right)}{4\\left(\\mathrm{r}_1^2-\\mathrm{r}_2^2+\\mathrm{R}^2\\right)}$", "image": null, "isCorrect": false}, {"id": "n7I58", "text": "$\\frac{\\mathrm{P}\\left(\\mathrm{R}^2+\\mathrm{r}_1^2+\\mathrm{r}_2^2\\right)}{4\\left(\\mathrm{r}_1^2-\\mathrm{r}_2^2+\\mathrm{R}^2\\right)}$", "image": null, "isCorrect": false}, {"id": "OW0ey", "text": "$\\frac{P\\left(R^3-r_1^3-r_2^3\\right)}{4\\left(r_1^2+r_2^2-R^2\\right)}$", "image": null, "isCorrect": true}, {"id": "nxLoH", "text": "$\\frac{\\mathrm{P}\\left(\\mathrm{R}^2-\\mathrm{r}_1^2-\\mathrm{r}_2^2\\right)}{4\\left(\\mathrm{r}_1^3+\\mathrm{r}_2^3-\\mathrm{R}^3\\right)}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Pressure inside the first bubble $=\\mathrm{P}+\\frac{4 \\mathrm{~T}}{\\mathrm{r}_1}$\nPressure inside the second bubble $=\\mathrm{P}+\\frac{4 \\mathrm{~T}}{\\mathrm{r}_2}$\nUsing the formula $\\mathrm{PV}=\\mathrm{nR} \\theta \\quad(\\theta=$ absolute temp $)$\n$\\left(\\mathrm{P}+\\frac{4 \\mathrm{~T}}{\\mathrm{r}_1}\\right) \\cdot \\frac{4 \\pi}{3} \\mathrm{r}_1^3=\\mathrm{n}_1 \\mathrm{R} \\theta \\quad$ ( $\\mathrm{R}$ is molar gas constant)\n$\\left(\\mathrm{P}+\\frac{4 \\mathrm{~T}}{\\mathrm{r}_2}\\right) \\cdot \\frac{4 \\pi}{3} \\mathrm{r}_2^3=\\mathrm{n}_2 \\mathrm{R} \\theta$\nand $\\left(\\mathrm{P}+\\frac{4 \\mathrm{~T}}{\\mathrm{R}}\\right) \\cdot \\frac{4 \\pi}{3} \\mathrm{R}^3=\\left(\\mathrm{n}_1+\\mathrm{n}_2\\right) \\mathrm{R} \\theta$\n$\\therefore\\left(\\mathrm{P}+\\frac{4 \\mathrm{~T}}{\\mathrm{R}}\\right) \\cdot \\frac{4 \\pi}{3} \\mathrm{R}^3=\\left(\\mathrm{P}+\\frac{4 \\mathrm{~T}}{\\mathrm{r}_1}\\right) \\cdot \\frac{4 \\pi}{3} \\mathrm{r}_1^3+\\left(\\mathrm{P}+\\frac{4 \\mathrm{~T}}{\\mathrm{r}_2}\\right) \\cdot \\frac{4 \\pi \\mathrm{r}_2^3}{3}$\n$\\therefore\\left(\\mathrm{P}+\\frac{4 \\mathrm{~T}}{\\mathrm{R}}\\right) \\mathrm{R}^3=\\left(\\mathrm{P}+\\frac{4 \\mathrm{~T}}{\\mathrm{r}_1}\\right) \\mathrm{r}_1^3+\\left(\\mathrm{P}+\\frac{4 \\mathrm{~T}}{\\mathrm{r}_2}\\right) \\mathrm{r}_2^3$\non solving: $\\mathrm{T}=\\frac{\\mathrm{P}\\left(\\mathrm{R}^3-\\mathrm{r}_1^3-\\mathrm{r}_2^3\\right)}{4\\left(\\mathrm{r}_1^2+\\mathrm{r}_2^2-\\mathrm{R}^2\\right)}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2604a0279619d9d8a234b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "Two small drops of mercury each of radius ' $R$ ' coalesce to from a large single drop. The ratio of the total surface energies before and after the change is", "image": null}, "options": [{"id": "pza5u", "text": "$\\sqrt{2}: 1$", "image": null, "isCorrect": false}, {"id": "1vzVY", "text": "$2^{2 / 3}: 1$", "image": null, "isCorrect": false}, {"id": "H3WFs", "text": "$2^{1 / 3}: 1$", "image": null, "isCorrect": true}, {"id": "USjhj", "text": "$2: 1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Total surface energy before coalesce\n$$\nE_1=2\\left(4 \\pi R^2\\right) T\n$$\nBut $\\frac{4}{3} \\pi \\mathrm{R}^3 \\times 2=\\frac{4}{3} \\pi \\mathrm{R}^{13}$\n$$\nR^{\\prime}=(2)^{1 / 3} R\n$$\nTotal surface energy after coalescing\n$$\n\\begin{aligned}\n& \\mathrm{E}_2=4 \\pi R^{\\prime 2} \\mathrm{~T}=4 \\pi(2)^{2 / 3} R^2 \\mathrm{~T} \\\\\n& \\frac{\\mathrm{E}_1}{\\mathrm{E}_2}=\\frac{2\\left(4 \\pi R^2\\right) \\mathrm{T}}{4 \\pi(2)^{2 / 3} \\mathrm{R}^2 \\mathrm{~T}}=2^{1-\\frac{2}{3}}=2^{1 / 3}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260460279619d9d8a232d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "The surface tension of most of the liquid decreases with rise in", "image": null}, "options": [{"id": "5nFQZ", "text": "viscosity of the liquid", "image": null, "isCorrect": false}, {"id": "XQiLs", "text": "diameter of capillary", "image": null, "isCorrect": false}, {"id": "t0ugc", "text": "temperature of the liquid", "image": null, "isCorrect": true}, {"id": "XnGSA", "text": "density of the liquid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Theory based", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260380279619d9d8a22b5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "Let ' $\\mathrm{R}_1$ ' and ' $\\mathrm{R}_2$ ' are radii of two mercury drops. A big mercury drop is formed from then under isothermal conditions. The radius of the resultant drop is", "image": null}, "options": [{"id": "fHkK4", "text": "$\\sqrt{\\mathrm{R}_1^2+\\mathrm{R}_2^2}$", "image": null, "isCorrect": false}, {"id": "qf5D2", "text": "$\\left(\\mathrm{R}_1^3+\\mathrm{R}_2^3\\right)^{\\frac{1}{3}}$", "image": null, "isCorrect": true}, {"id": "sy7z1", "text": "$\\sqrt{\\mathrm{R}_1^2-\\mathrm{R}_2^2}$", "image": null, "isCorrect": false}, {"id": "fz78J", "text": "$\\frac{R_1+R_2}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The volume of the bigger drop will be equal to the sum of the volumes of the smaller drops\n$$\n\\begin{aligned}\n& \\frac{4}{3} \\pi \\mathrm{R}^3=\\frac{4}{3} \\pi \\mathrm{R}_1^3+\\frac{4}{3} \\pi \\mathrm{R}_2^3 \\\\\n& \\therefore \\mathrm{R}=\\left(\\mathrm{R}_1^3+\\mathrm{R}_2^3\\right)^{1 / 3}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260350279619d9d8a22a1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "The force required to take away a flat circular plate of radius 2 $\\mathrm{cm}$ from the surface of water is\n$\\left[\\right.$ Surface tension of water $\\left.=70 \\times 10^{-3} \\mathrm{Nm}^{-1}, \\pi=\\frac{22}{7}\\right]$", "image": null}, "options": [{"id": "0ykJc", "text": "$4.4 \\times 10^{-4} \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "bJFeq", "text": "$8.8 \\times 10^{-3} \\mathrm{~N}$", "image": null, "isCorrect": true}, {"id": "3idJV", "text": "$6.6 \\times 10^{-4} \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "WNdbq", "text": "$11 \\times 10^{-3} \\mathrm{~N}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The force required to take away circular plate due to surface tension\n$$\n\\begin{aligned}\n& F=2 \\pi r \\mathrm{~T} \\\\\n& =2 \\times \\frac{22}{7} \\times 2 \\times 10^{-2} \\times 70 \\times 10^{-3} \\\\\n& =8.8 \\times 10^{-3} \\mathrm{~N}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260330279619d9d8a2290", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "Air is pushed in a soap bubble to increase its radius from 'R' to ' $2 \\mathrm{R}$ '. In this case, the pressure inside the bubble", "image": null}, "options": [{"id": "gtVdp", "text": "does not change", "image": null, "isCorrect": false}, {"id": "AKrId", "text": "decrease", "image": null, "isCorrect": true}, {"id": "FZ6hA", "text": "becomes zero", "image": null, "isCorrect": false}, {"id": "0dsEr", "text": "increase", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Excess pressure in a soap bubble is given by\n$$\n\\mathrm{P}=\\frac{4 \\mathrm{~T}}{\\mathrm{R}}\n$$\nHence if radius is increased, the pressure will decrease.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260230279619d9d8a220d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "What should be the radius of water drop so that excess pressure inside it is $72 \\mathrm{Nm}^{-2}$ ? (The surface tension of water $7.2 \\times 10^{-2} \\mathrm{Nm}^{-1}$ )", "image": null}, "options": [{"id": "o2MRT", "text": "$1 \\mathrm{~mm}$", "image": null, "isCorrect": false}, {"id": "EJFUt", "text": "$2 \\mathrm{~mm}$", "image": null, "isCorrect": true}, {"id": "fZssX", "text": "$8\\mathrm{~mm}$", "image": null, "isCorrect": false}, {"id": "th0pz", "text": "$4 \\mathrm{~mm}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Excess pressure in a water drop $=\\frac{2 T}{R}$\n$$\n\\begin{aligned}\n& \\mathrm{T}=7.2 \\times 10^{-2} \\mathrm{Nm}^{-2} \\\\\n& \\therefore 72=\\frac{2 \\times 7.2 \\times 10^{-2}}{\\mathrm{R}} \\\\\n& \\therefore \\mathrm{R}=\\frac{2 \\times 7.2 \\times 10^{-2}}{72}=2 \\times 10^{-3} \\mathrm{~m}=2 \\mathrm{~mm}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260210279619d9d8a21fe", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "The surface energy of a liquid drop is ' $U$ '. It splits up into 512 equal droplets. The surface energy becomes", "image": null}, "options": [{"id": "CrIdU", "text": "$8 \\mathrm{U}$", "image": null, "isCorrect": true}, {"id": "2DKGi", "text": "$6 \\mathrm{U}$", "image": null, "isCorrect": false}, {"id": "DMdk0", "text": "$4 \\mathrm{U}$", "image": null, "isCorrect": false}, {"id": "68DPq", "text": "$2 \\mathrm{U}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\frac{4}{3} \\pi R^3=512 \\times \\frac{4}{3} \\pi r^3 \\\\ & \\therefore r=\\frac{R}{8} \\\\ & U=4 \\pi R^2 T \\\\ & U^{\\prime}=512 \\times 4 \\pi r^2 T \\\\ & =512 \\times \\frac{4 \\pi R^2 T}{64}=8\\left(4 \\pi R^2 T\\right)=8 U\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260130279619d9d8a218c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}], "question": {"text": "Three liquids have same surface tension and densities $\\varrho_{1}, Q_{2}$, and $\\varrho_{3}\\left(\\varrho_{1}>\\varrho_{2}>\\varrho_{3}\\right)$.\nIn three identical capillaries, rise of liquid is same. The corresponding angles of contact $\\theta_{1}, \\theta_{2}$ and $\\theta_{3}$ are related as", "image": null}, "options": [{"id": "VlNV8", "text": "$\\theta_{1}>\\theta_{2}>\\theta_{3}$", "image": null, "isCorrect": false}, {"id": "8V4Nf", "text": "$\\theta_{1} < \\theta_{2}>\\theta_{3}$", "image": null, "isCorrect": false}, {"id": "Xu9jD", "text": "$\\theta_{1}>\\theta_{2} < \\theta_{3}$", "image": null, "isCorrect": false}, {"id": "81a0T", "text": "$\\theta_{1} < \\theta_{2} < \\theta_{3}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Rise of a liquid in a capillary tube is given by,\n$\\mathrm{h}=\\frac{2 \\mathrm{T} \\cos \\theta}{\\mathrm{r} \\rho \\mathrm{g}}$\nor $\\cos \\theta=h r \\rho g / 2 T$\nwhere $\\theta=$ angle of contact,\n$\\mathrm{r}=$ radius of capillary tube\n$\\mathrm{T}=$ surface tension\n$\\rho=$ density of liquid\nnow given that $h$, $T$ and $r$ are constants for all three liquids,\nand $\\rho_{1}>\\rho_{2}>\\rho_{3}$,\ntherefore $\\cos \\theta_{1}>\\cos \\theta_{2}>\\cos \\theta_{3}$\nor $\\theta_{1} < \\theta_{2} < \\theta_{3}$\nnow as the liquid is rising in all three capillaries therefore angles of contact will be acute,\n$0 \\leq \\theta_{1} < \\theta_{2} < \\theta_{3} < \\frac{\\pi}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fff0279619d9d8a20e6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "If ' $\\mathrm{T}^{\\prime}$ is the surface tension of a soap solution, then the work done in blowing a soap\nbubble from diameter 'D' to diameter '2D' is", "image": null}, "options": [{"id": "aHCTo", "text": "$2 \\pi \\mathrm{TD}^{2}$", "image": null, "isCorrect": false}, {"id": "QS3mJ", "text": "$4 \\pi \\mathrm{TD}^{2}$", "image": null, "isCorrect": false}, {"id": "EpiXI", "text": "$8 \\pi \\mathrm{TD}^{2}$", "image": null, "isCorrect": false}, {"id": "EwLxq", "text": "$6 \\pi \\mathrm{TD}^{2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$W=\\frac{4 \\pi}{4}\\left(4 D^{2}-D^{2}\\right) T \\times 2$\n$=3 \\mathrm{D}^{2} \\pi \\mathrm{T} \\times 2=6 \\mathrm{D}^{2} \\pi \\mathrm{T}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ffe0279619d9d8a20de", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "When a capillary tube is immersed in water vertically, water rises to a height ' $\\mathrm{h}^{\\prime}$ inside the tube. If the radius of another capillary tube is $\\frac{1}{3}$ that of the previous, the\nheight to which water will rise in this }$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fed0279619d9d8a2058", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "Water rises upto a height 'h' in a capillary tube on the surface of the earth. The value of ' $\\mathrm{h}$ ' will increase if the experimental setup is kept in $[\\mathrm{g}=$ acceleration due\nto gravity]", "image": null}, "options": [{"id": "rICHk", "text": "a lift going upward with a certain acceleration.", "image": null, "isCorrect": false}, {"id": "kaIZz", "text": "a lift going down with acceleration", "image": null, "isCorrect": true}, {"id": "B3pTe", "text": "accelerating train.", "image": null, "isCorrect": false}, {"id": "Qr3dO", "text": "a satellite rotating close to earth.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(D)\n$h=\\frac{2 T \\cos \\theta}{r \\rho g} \\quad \\therefore h \\propto \\frac{1}{g}$\nFor a lift going down with acceleration $a$, the effective value of $g$ is $g^{\\prime}=g-a$ $g^{\\prime}=g-a$\n$\\mathrm{g}^{\\prime} < \\mathrm{g} \\quad \\therefore \\mathrm{h}$ will increase.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fd90279619d9d8a1fc0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "A water film is formed between the two straight parallel wires, each of length 10\n$\\mathrm{cm}$, kept at a separation of $0 \\cdot 5 \\mathrm{~cm}$. Now, the separation between them is\nincreased by $1 \\mathrm{~mm}$ without breaking the water film.\nThe work done for this is\n(surface tension of water $=7 \\cdot 2 \\times 10^{-2} \\mathrm{Nm}^{-1}$ )", "image": null}, "options": [{"id": "TsEKD", "text": "$7 \\cdot 22 \\times 10^{-6} \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "iDO0W", "text": "$5 \\cdot 76 \\times 10^{-5} \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "bNP66", "text": "$1 \\cdot 44 \\times 10^{-5} \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "kNtY2", "text": "$2 \\cdot 88 \\times 10^{-5} \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(A)\nIncrease in the area of the film is\n$\\Delta \\mathrm{A}=10 \\mathrm{~cm} \\times 0.1 \\mathrm{~cm}=1 \\mathrm{~cm}^{2}=10^{-4} \\mathrm{~m}^{2}$\nWork done $W=2 T . \\Delta A$\n$\\begin{array}{l}\n=2 \\times 7.2 \\times 10^{-2} \\times 10^{-4} \\mathrm{~J} \\\\\n=1.44 \\times 10^{-5} \\mathrm{~J}\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPractice ct": true}, {"id": "GxGCK", "text": "12 TL", "image": null, "isCorrect": false}, {"id": "q56ko", "text": "16 TL", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(B)\nLength of four sides $=4 \\mathrm{~L}$\n$\\therefore$ Force due to surface tension $=4 \\mathrm{~L} \\times 2 \\mathrm{~T}=8 \\mathrm{LT}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fc30279619d9d8a1f0e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "The work done in blowing a soap bubble of radius 'R' is ' $\\mathrm{W}$ '. The work done in blowing a bubble of radius ' $2 \\mathrm{R}^{\\prime}$ of the same soap solution is", "image": null}, "options": [{"id": "1XHFt", "text": "$\\frac{\\mathrm{w}}{4}$", "image": null, "isCorrect": false}, {"id": "Ym0TP", "text": "$\\frac{\\mathrm{w}}{2}$", "image": null, "isCorrect": false}, {"id": "8mOL6", "text": "4w", "image": null, "isCorrect": true}, {"id": "rgz41", "text": "2w", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(B)\n$\\mathrm{W}_{1}=8 \\pi \\mathrm{R}^{2} \\mathrm{~T}$ where $\\mathrm{T}$ is surface tension.\nIf radius is doubled and surface tension remains same then $\\mathrm{W}_{2}=8 \\pi(2 \\mathrm{R})^{2} \\mathrm{~T}=8 \\pi \\mathrm{R}^{2} \\mathrm{~T}=4 \\mathrm{~W}_{1}$\nHowever, the solution is heated, the value of surface tension decreases. Hence, $\\mathrm{W}_{2} < 4 \\mathrm{~W}_{1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fb30279619d9d8a1e90", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "Two small drops of mercury each of radius 'R' coalesce to form a large single drop. The ratio of the total surface energies before and after the change is", "image": null}, "options": [{"id": "wMAQg", "text": "$2\\frac{2}{3}:1$", "image": null, "isCorrect": false}, {"id": "QCBlT", "text": "$\\sqrt{2}: 1$", "image": null, "isCorrect": false}, {"id": "fsb60", "text": "$2\\frac{1}{3}: 1$", "image": null, "isCorrect": true}, {"id": "nEFhl", "text": "$2: 1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The volume of mercury remains same.\n$$\n\\begin{array}{l}\n\\therefore \\frac{4 \\pi}{3} R^{3}=2\\left(\\frac{4 \\pi}{3} r^{3}\\right) \\\\\n\\therefore R^{3}=2 r^{3} \\quad \\text { or } \\quad r^{3}=\\frac{R^{3}}{2} \\\\\n\\therefore r=\\frac{R}{2^{\\frac{1}{3}}}\n\\end{array}\n$$\nInitial surface energy $\\mathrm{E}_{1}=4 \\pi \\mathrm{R}^{2} \\cdot \\mathrm{T}$\nFinal surface energy\n$\\mathrm{E}_{2}=4 \\pi \\mathrm{r}^{2} \\mathrm{~T}=4 \\pi\\left(\\frac{\\mathrm{R}}{2^{\\frac{1}{3}}}\\right)^{2} \\mathrm{~T}=4 \\pi \\frac{\\mathrm{R}^{2}}{2^{\\frac{2}{3}} \\mathrm{~T}}$\n$\\therefore \\frac{E_{1}}{E_{2}}=2^{\\frac{2}{3}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fb20279619d9d8a1e88", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "Water rises in a capillary tube of radius $\\mathrm{r}$ upto a height 'h'. The mass of water in a capillary is 'm'. The mass of water that will rise in a capillary of radius $\\frac{\\mathrm{r}}{4}$ will be", "image": null}, "options": [{"id": "ZqtH5", "text": "$\\frac{m}{4}$", "image": null, "isCorrect": true}, {"id": "9o7d0", "text": "$\\frac{4}{\\mathrm{~m}}$", "image": null, "isCorrect": false}, {"id": "Em1Rb", "text": "4m", "image": null, "isCorrect": false}, {"id": "fjywh", "text": "m", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{hr}=$ constant\n$\\therefore$ rise of water in capillary of radius $\\frac{\\mathrm{r}}{4}$ is $4 \\mathrm{~h}$\nNow, $\\pi \\mathrm{r}^{2} \\mathrm{~h} \\rho=\\mathrm{m}$\n$\\therefore \\quad \\pi\\left(\\frac{\\mathrm{r}}{4}\\right)^{2} \\times 4 \\mathrm{~h} \\rho=\\frac{\\mathrm{m}}{4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fa00279619d9d8a1dfc", "ty 2020 (14 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f7b0279619d9d8a1cd3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}], "question": {"text": "Let ${ }^{\\prime} \\mathrm{R}_{1}$ ' and ${ }^{\\prime} \\mathrm{R}_{2}$ ' are radii of two mercury drops. A big mercury drop is formed from\nthem under isothermal conditions. The radius of the resultant drop is", "image": null}, "options": [{"id": "BZXL5", "text": "$\\mathrm{R}=\\sqrt{\\mathrm{R}_{1}^{2}-\\mathrm{R}_{2}^{2}}$", "image": null, "isCorrect": false}, {"id": "knkre", "text": "$R=\\frac{R_{1}+R_{2}}{2}$", "image": null, "isCorrect": false}, {"id": "tWIMd", "text": "$\\mathrm{R}=\\sqrt{\\mathrm{R}_{1}^{2}+\\mathrm{R}_{2}^{2}}$", "image": null, "isCorrect": false}, {"id": "nhVaJ", "text": "$\\mathrm{R}=\\left(\\mathrm{R}_{1}^{3}+\\mathrm{R}_{2}^{3}\\right)^{\\frac{1}{3}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The Volume of the bigger drop is equal to the sum of the volumes of the smaller drops.\n$\\begin{aligned}\n& \\frac{4}{3} \\pi R^{3}=\\frac{4}{3} \\pi R_{1}^{3}+\\frac{4}{3} \\pi R_{2}^{3} \\\\\n\\therefore \\quad & R=\\sqrt[3]{R_{1}^{3}+R_{2}^{3}}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f670279619d9d8a1c34", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b ons": [{"id": "n00Jn", "text": "1:1000", "image": null, "isCorrect": false}, {"id": "R5Poo", "text": "1:1", "image": null, "isCorrect": false}, {"id": "SNoZd", "text": "$1: 10$", "image": null, "isCorrect": true}, {"id": "KKi56", "text": "$1: 100$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$U_{1}=1000 \\times 4 \\pi r_{1}^{2} \\times T$\n$\\frac{r_{2}}{r_{1}}=(1000)^{1 / 3}=10$\n$U_{2}=4 \\pi r_{2}^{2} T$\n$\\frac{U_{2}}{U_{1}}=\\frac{4 \\pi r_{2}^{2} T}{1000 \\times 4 \\pi r_{1}^{2} \\times T}=\\frac{100}{1000}=\\frac{1}{10}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f550279619d9d8a1b9f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "small drops of liquid of same radius coalesce to form a big drop. The ratio of\nthe total surface energies after and before the change is", "image": null}, "options": [{"id": "qlsiw", "text": "$2^{3}: 1$", "image": null, "isCorrect": false}, {"id": "3i0Tm", "text": "$2^{-\\frac{1}{3}}: 1$", "image": null, "isCorrect": true}, {"id": "01cRb", "text": "$2^{-\\frac{2}{3}}: 1$", "image": null, "isCorrect": false}, {"id": "0t7Ow", "text": "$2^{\\frac{2}{3}}: 1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$2 \\times \\frac{4}{3} \\pi r^{3}=\\frac{4}{3} \\pi R^{3} \\quad \\therefore \\quad R=2^{\\frac{1}{3}} r$\nRatio of energies $\\frac{E_{2}}{E_{1}}=\\frac{4 \\pi R^{2} T}{2 \\times \\pi r^{2} \\times T}$\n$\\frac{E_{2}}{E_{1}}=\\frac{R^{2}}{2 r^{2}}=\\frac{2^{\\frac{2}{3}} r^{2}}{2 r^{2}}=2^{\\frac{2}{3}-1}=2^{-\\frac{1}{3}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f530279619d9d8a1b92", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "The excess pressure inside a spherical drop of water is three times that of another\ndrop of water. The ratio of their surface area is", "image": null}, "options": [{"id": "ZBT4J", "text": "$3: 1$", "image": null, "isCorrect": false}, {"id": "B5o8l", "text": "$6: 1$", "image": null, "isCorrect": false}, {"id": "PEddL", "text": "$1: 9$", "image": null, "isCorrect": true}, {"id": "r1DUJ", "text": "$1: 3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Excess pressure $p=\\frac{2 T}{r}$\n$\\frac{p_{1}}{p_{2}}=\\frac{r_{2}}{r_{1}}=3$\n$\\begin{array}{l}\n\\therefore r_{2}=3 r_{1} \\\\\n\\frac{A_{1}}{A_{2}}=\\frac{\\pi r_{1}^{2}}{\\pi r_{2}^{2}}=\\left(\\frac{r_{1}}{r_{2}}\\right)^{2}=\\frac{1}{(3)^{2}}=\\frac{1}{9}\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": l, "isCorrect": false}, {"id": "EuLcI", "text": "$\\mathrm{r}=\\frac{\\mathrm{R}}{\\mathrm{n}}$", "image": null, "isCorrect": false}, {"id": "KtVvh", "text": "$\\mathrm{r}=\\frac{\\mathrm{R}}{\\mathrm{n}^{\\frac{1}{3}}}$", "image": null, "isCorrect": true}, {"id": "ZtOJN", "text": "$\\mathrm{r}=\\mathrm{R} \\mathrm{n}^{\\frac{1}{3}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Volume remains constant\n$\\therefore \\mathrm{n} \\times \\frac{4}{3} \\pi \\mathrm{r}^{3}=\\frac{4}{3} \\pi \\mathrm{R}^{3}$\n$\\therefore \\mathrm{nr}^{3}=\\mathrm{R}^{3}$\n$\\therefore \\quad n^{\\frac{1}{3}} r=R \\quad \\therefore r=\\frac{R}{n^{\\frac{1}{3}}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f1f0279619d9d8a19f4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}], "question": {"text": "A wire of length $10 \\mathrm{~cm}$ is gently placed horizontally on the surface of water having\nsurface tension of $75 \\times 10^{3} \\mathrm{~N} / \\mathrm{m}$. What force is required to just pull up the wire\nfrom the water surface?", "image": null}, "options": [{"id": "GuI0G", "text": "$15 \\times 10^{-2} \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "IZjaZ", "text": "$7 \\cdot 5 \\times 10^{-2} \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "H8Zhw", "text": "$1 \\cdot 5 \\times 10^{-2} \\mathrm{~N}$", "image": null, "isCorrect": true} ngleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}], "question": {"text": "Which one of the following statement is correct?", "image": null}, "options": [{"id": "S0XXU", "text": "Surface energy is potential energy per unit length", "image": null, "isCorrect": false}, {"id": "gk4zv", "text": "Surface tension is work done per unit area", "image": null, "isCorrect": true}, {"id": "i3Bm9", "text": "Surface tension is work done per unit length", "image": null, "isCorrect": false}, {"id": "eyTe2", "text": "Surface energy is work done per unit force", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Surface tension is the force applied per unit length or work done (or energy) per unit area of a liquid surface. While surface energy is the amount of work done per unit area by the force.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ef40279619d9d8a189c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}], "question": {"text": "A molecule of water on the surface", "image": null}, "options": [{"id": "ZUHI6", "text": "Downward resultant unbalanced adhesive force", "image": null, "isCorrect": false}, {"id": "HHdQp", "text": "Upward resultant unbalanced cohesive force", "imag mpted", "lastPracticed": null}, {"_id": "65a25e860279619d9d8a1521", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "The radius $R$ of the soap bubble is doubled under isothermal condition. If $T$ be the surface tension of soap bubble. The work done in doing so it given by", "image": null}, "options": [{"id": "KKrI8", "text": "$32 \\pi R{ }^{2} T$", "image": null, "isCorrect": true}, {"id": "2jk2q", "text": "$24 \\pi R^{2} T$", "image": null, "isCorrect": false}, {"id": "QC2zk", "text": "$8 \\pi R^{2} T$", "image": null, "isCorrect": false}, {"id": "wXW8w", "text": "$4 \\pi R^{2} T$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Surface energy of a bubble\n$$\n\\begin{array}{l}\nE=\\text { Tension } \\times \\text { surface area } \\\\\nE=T \\times A\n\\end{array}\n$$\nFor soap bubble\n$$\n\\begin{array}{l}\nE=2 T \\times A \\\\\nE=2 T \\times 4 \\pi R^{2}\n\\end{array}\n$$\nHere, $\\quad R=$ radius of bubble\nIf radius is doubled then we have\n$$\n\\begin{array}{l}\nE^{\\prime}=2 T \\times 4 \\pi R^{2} \\\\\nE^{\\prime}=2 T \\times 4 \\pi(2 R)^{2} \\\\\nE^{\\prime}=32 \\pi R^{2} T\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e740279619d9d8a148b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "On the surface of the liquid in equilibrium, molecules of the liquid possess", "image": null}, "options": [{"id": "d2xQA", "text": "maximum potential energy", "image": null, "isCorrect": true}, {"id": "8StgC", "text": "minimum potential energy", "image": null, "isCorrect": false}, {"id": "LOJwU", "text": "maximum kinetic energy", "image": null, "isCorrect": false}, {"id": "Xhief", "text": "minimum kinetic energy", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "On the surface of the liquid in equilibrium molecules of the liquid possess maximum potential energy.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e620279619d9d8a13fc", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "The change in energy when a big dropis split in sma $\\| n$ droplets is", "image": null}, "options": [{"id": "UCfjf", "text": "$4 R^{2}\\left(n^{2 / 3}-1\\right) I$", "image": null, "isCorrect": false}, {"id": "LrSsx", "text": "$4 \\pi R^{2}\\left(n^{1 / 3}-1\\right) T$", "image": null, "isCorrect": true}, {"id": "EcPsK", "text": "$4 \\pi R^{2}\\left(n^{-1 / 3}-1\\right) T$", "image": null, "isCorrect": false}, {"id": "k81X0", "text": "$4 \\pi R^{2}\\left[n^{-2 / 3}-1\\right] T$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When a drop of radius $R$ split into $n$ smaller drops (each of radius $r$ ), then surface area of liquid increases. Hence, the work is to be done against surface tension. Since, the volume of liquid remains constant\n$$\n\\begin{array}{l}\n\\therefore \\quad \\frac{4}{3} \\pi R^{3}=n \\frac{4}{3} \\pi r^{3} \\quad \\therefore R^{3}=n r^{3} \\\\\n\\text { Work done }=T \\times \\Delta A \\\\\n=T\\left[n 4 \\pi r^{2}-4 \\pi R^{2}\\right] \\\\\n=4 \\pi R^{2} T\\left(n^{1 / 3}-1\\right)\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e4e0279619d9d8a135e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "The potential energy of a molecule on the surface of a liquid compared to one inside the liquid is", "image": null}, "options": [{"id": "EQava", "text": "zero", "image": null, "isCorrect": false}, {"id": "UmnmF", "text": "lesser", "image": null, "isCorrect": false}, {"id": "SlYD7", "text": "equal", "image": null, "isCorrect": false}, {"id": "ThDH6", "text": "greater", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "When the surface area of a liquid is increased, molecules from the interior of the liquid rise to the surface. As these molecules reach the surface work is done against the cohesive force. This work is stored in the molecules in the form of potential energy. Thus, the potential energy of the molecules lying in the surface is greater than that of the molecules in the interior of the liquid.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e4e0279619d9d8a135d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "A frame made of metallic wire enclosing a surface area $A$ is covered with a soap film. If the area of the frame of metallic wire is reduced by $50 \\%$, the energy of the soap film will be changed by", "image": null}, "options": [{"id": "LVmTG", "text": "$100 \\%$", "image": null, "isCorrect": false}, {"id": "a2kfO", "text": "$75 \\%$", "image": null, "isCorrect": false}, {"id": "UJoya", "text": "$50 \\%$", "image": null, "isCorrect": true}, {"id": "lo5ty", "text": "$25 \\%$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Surface energy $=$ surface tension $\\times$ surface area\n$$\nE=T \\times 2 A\n$$\nNew surface energy,\n$$\nE_{1}=T \\times 2\\left(\\frac{A}{2}\\right)=T \\times A\n$$\n$\\%$ decrease in surface energy\n$$\n\\begin{array}{l}\n=\\frac{E-E_{1}}{E} \\times 100 \\\\\n=\\frac{2 T A-T A}{2 T A} \\times 100=50 \\%\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e3a0279619d9d8a12c1", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "According to Hooke's law of elasticity, if stress is increased, then the ratio of stress to strain", "image": null}, "options": [{"id": "75CDz", "text": "becomes zero", "image": null, "isCorrect": false}, {"id": "SCGKF", "text": "remains constant", "image": null, "isCorrect": true}, {"id": "z2Uq9", "text": "decreases", "image": null, "isCorrect": false}, {"id": "3AM8e", "text": "increases", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Hooke in 1679 , showed experimentally that if strain is small, then the stress is proportional to strain. The ratio of stress to strain is constant for material of the given body and is called modulus of elasticity $E$. Thus, $E=\\frac{\\text { stress }}{\\text { strain }}=$ constant\nHence, if stress is increased, then the ratio of stress to strain remains constant.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 7, "topicId": "65a263210279619d9d8a3c30", "title": "Viscosity", "totalQuestions": 51, "questions": [{"_id": "6abb889d15a9fc0fc8c14560", "type": "singleCorrect", "question": {"text": "A tiny water droplet falls through the air at a uniform terminal speed of $1$ cm/s. If $27$ such identical droplets coalesce to form a single larger drop, what will be the new terminal velocity of the resulting drop, assuming the air remains the same?", "image": null}, "options": [{"id": "bLnqZ", "label": "A", "text": "$3$ cm/s", "isCorrect": false, "image": null}, {"id": "Kr3aM", "label": "B", "text": "$27$ cm/s", "isCorrect": false, "image": null}, {"id": "6aYkJ", "label": "C", "text": "$81$ cm/s", "isCorrect": false, "image": null}, {"id": "ZITzM", "label": "D", "text": "$9$ cm/s", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let the radius of a single tiny droplet be $r$ and its terminal velocity be $v$.<br><br>The terminal velocity of a spherical drop of radius $r$ falling through a viscous medium is given by Stokes' law:<br><br>$v = \\dfrac{2}{9} \\dfrac{r^2 (\\rho - \\sigma) g}{\\eta}$<br><br>This implies $v \\propto r^2$.<br><br>When $27$ such identical droplets coalesce to form a single larger drop of radius $R$, the total volume remains conserved:<br><br>$\\dfrac{4}{3} \\pi R^3 = 27 \\times \\dfrac{4}{3} \\pi r^3$<br><br>$R^3 = 27 r^3$<br><br>$R = 3r$<br><br>The new terminal velocity $v'$ of the larger drop will be:<br><br>$v' \\propto R^2$<br><br>$\\dfrac{v'}{v} = \\left(\\dfrac{R}{r}\\right)^2$<br><br>$\\dfrac{v'}{1} = (3)^2$<br><br>$v' = 9$ cm/s<br><br>Answer: $9$ cm/s", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883c15a9fc0fc8c141c7", "type": "singleCorrect", "question": {"text": "'$n$' identical small drops of water are falling down vertically through a medium each with a terminal velocity '$v$'. If they combine to form a single drop, then its terminal velocity is $xv$. The value of $x$ is", "image": null}, "options": [{"id": "2rawI", "label": "A", "text": "$n^{1/3}$", "isCorrect": false, "image": null}, {"id": "0zIU6", "label": "B", "text": "$n^{2/3}$", "isCorrect": true, "image": null}, {"id": "CmumH", "label": "C", "text": "$n^2$", "isCorrect": false, "image": null}, {"id": "TWMCF", "label": "D", "text": "$n^3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Terminal velocity of a small drop of radius $r$ is given by $v = \\dfrac{2}{9} \\dfrac{r^2 (\\rho - \\sigma) g}{\\eta}$<br><br>Thus, $v \\propto r^2$<br><br>When $n$ drops combine to form a single drop of radius $R$, the total volume remains conserved.<br><br>$\\dfrac{4}{3} \\pi R^3 = n \\times \\dfrac{4}{3} \\pi r^3$<br><br>$R = n^{1/3} r$<br><br>The terminal velocity of the new drop is $V \\propto R^2$<br><br>$V = \\left( \\dfrac{R}{r} \\right)^2 v$<br><br>$V = (n^{1/3})^2 v = n^{2/3} v$<br><br>Comparing with $V = xv$, we get $x = n^{2/3}$<br><br>Answer: $n^{2/3}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88aa15a9fc0fc8c145d7", "type": "singleCorrect", "question": {"text": "If terminal speed of a sphere of gold (density = $19.5\\ \\text{kg/m}^3$) is $0.2$ m/s in viscous liquid (density = $1.5\\ \\text{kg/m}^3$), find the terminal speed of a sphere of silver (density = $10.5\\ \\text{kg/m}^3$) of the same size in the same liquid.", "image": null}, "options": [{"id": "haXvv", "label": "A", "text": "$0.4\\ \\text{m/s}$", "isCorrect": false, "image": null}, {"id": "wNkX2", "label": "B", "text": "$0.133\\ \\text{m/s}$", "isCorrect": false, "image": null}, {"id": "d3Aya", "label": "C", "text": "$0.1\\ \\text{m/s}$", "isCorrect": true, "image": null}, {"id": "dP3XZ", "label": "D", "text": "$0.2\\ \\text{m/s}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The terminal velocity of a spherical body of radius $r$ and density $\\rho$ falling through a liquid of density $\\sigma$ and coefficient of viscosity $\\eta$ is given by<br><br>$v = \\dfrac{2r^2(\\rho - \\sigma)g}{9\\eta}$<br><br>Since $r$, $\\eta$, and $g$ are constant for both spheres, the terminal velocity is directly proportional to the difference in densities:<br><br>$v \\propto (\\rho - \\sigma)$<br><br>For the gold sphere:<br><br>$v_1 \\propto (\\rho_{\\text{gold}} - \\sigma)$<br><br>$0.2 \\propto (19.5 - 1.5)$<br><br>$0.2 \\propto 18$<br><br>For the silver sphere:<br><br>$v_2 \\propto (\\rho_{\\text{silver}} - \\sigma)$<br><br>$v_2 \\propto (10.5 - 1.5)$<br><br>$v_2 \\propto 9$<br><br>Taking the ratio of the two equations:<br><br>$\\dfrac{v_2}{0.2} = \\dfrac{9}{18}$<br><br>$\\dfrac{v_2}{0.2} = \\dfrac{1}{2}$<br><br>$v_2 = 0.1\\ \\text{m/s}$<br><br>Answer: $0.1\\ \\text{m/s}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887a15a9fc0fc8c14415", "type": "singleCorrect", "question": {"text": "Two spherical rain drops reach the surface of the earth with terminal velocities having ratio $16:9$. The ratio of their surface area is", "image": null}, "options": [{"id": "K5iTm", "label": "A", "text": "$4:3$", "isCorrect": false, "image": null}, {"id": "LPcSc", "label": "B", "text": "$64:27$", "isCorrect": false, "image": null}, {"id": "XrvHr", "label": "C", "text": "$16:9$", "isCorrect": true, "image": null}, {"id": "mbKOM", "label": "D", "text": "$9:16$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The terminal velocity of a spherical drop of radius $r$ is given by<br><br>$v_t = \\dfrac{2r^2(\\rho - \\sigma)g}{9\\eta}$<br><br>This implies $v_t \\propto r^2$.<br><br>The surface area of a spherical drop is given by $A = 4\\pi r^2$, which means $A \\propto r^2$.<br><br>Therefore, $A \\propto v_t$.<br><br>Given the ratio of terminal velocities is $\\dfrac{v_{t1}}{v_{t2}} = \\dfrac{16}{9}$.<br><br>The ratio of their surface areas is $\\dfrac{A_1}{A_2} = \\dfrac{v_{t1}}{v_{t2}} = \\dfrac{16}{9}$.<br><br>Answer: $16:9$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885b15a9fc0fc8c142f0", "type": "singleCorrect", "question": {"text": "Two solid spheres of same material but of mass M and 8M fall simultaneously on a viscous liquid and their terminal velocities are V and nV, then the value of n is", "image": null}, "options": [{"id": "9Yvsh", "label": "A", "text": "$16$", "isCorrect": false, "image": null}, {"id": "LiIYJ", "label": "B", "text": "$8$", "isCorrect": false, "image": null}, {"id": "guKPZ", "label": "C", "text": "$4$", "isCorrect": true, "image": null}, {"id": "lRiIb", "label": "D", "text": "$2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Mass of a solid sphere is given by $M = \\dfrac{4}{3} \\pi r^3 \\rho$.<br><br>Since both spheres are made of the same material, their density $\\rho$ is constant, which implies $M \\propto r^3$.<br><br>For the two spheres, $\\dfrac{M_2}{M_1} = \\dfrac{8M}{M} = 8$.<br><br>Therefore, $\\left(\\dfrac{r_2}{r_1}\\right)^3 = 8 \\Rightarrow \\dfrac{r_2}{r_1} = 2$.<br><br>The terminal velocity of a sphere in a viscous liquid is given by $V = \\dfrac{2}{9} \\dfrac{r^2 (\\rho - \\sigma) g}{\\eta}$.<br><br>Since $\\rho$, $\\sigma$, and $\\eta$ are constant, $V \\propto r^2$.<br><br>Taking the ratio of terminal velocities, $\\dfrac{V_2}{V_1} = \\left(\\dfrac{r_2}{r_1}\\right)^2 = (2)^2 = 4$.<br><br>Given $V_1 = V$ and $V_2 = nV$, we get $n = 4$.<br><br>Answer: $4$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88bb15a9fc0fc8c14677", "type": "singleCorrect", "question": {"text": "$'n'$ small drops of water having same size fall through air with constant velocity $4$ cm/s. They coalesce to form a big drop. The terminal velocity of the big drop is", "image": null}, "options": [{"id": "re6Mu", "label": "A", "text": "$2n^{2/3}\\,cm/s$", "isCorrect": false, "image": null}, {"id": "kAmKQ", "label": "B", "text": "$12n^{2/3}\\,cm/s$", "isCorrect": false, "image": null}, {"id": "dTMrl", "label": "C", "text": "$4n^{2/3}\\,cm/s$", "isCorrect": true, "image": null}, {"id": "KwqLc", "label": "D", "text": "$8n^{2/3}\\,cm/s$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $r$ be the radius of each small drop and $R$ be the radius of the big drop.<br><br>Since $n$ small drops coalesce to form a big drop, the total volume remains conserved:<br><br>$\\dfrac{4}{3}\\pi R^3 = n \\times \\dfrac{4}{3}\\pi r^3$<br><br>$R = n^{1/3}r$<br><br>The terminal velocity of a spherical drop of radius $r$ is given by Stokes' law:<br><br>$v = \\dfrac{2}{9}\\dfrac{r^2(\\rho - \\sigma)g}{\\eta}$<br><br>Thus, terminal velocity is directly proportional to the square of the radius ($v \\propto r^2$).<br><br>For the big drop, the terminal velocity $V$ is:<br><br>$V \\propto R^2$<br><br>$\\dfrac{V}{v} = \\left(\\dfrac{R}{r}\\right)^2$<br><br>Substituting $R = n^{1/3}r$ and $v = 4$ cm/s:<br><br>$V = 4 \\times (n^{1/3})^2 = 4n^{2/3}$ cm/s<br><br>Answer: $4n^{2/3}\\,cm/s$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a68c30a4553e1bdb56", "type": "singleCorrect", "question": {"text": "A small metal sphere is falling through a viscous liquid. The variation of velocity ($V$) with time ($t$) is shown correctly in graph<br><img style=\"width: 500px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/19_april_shift_2__q34_d1.png\" />", "image": null}, "options": [{"id": "VqbD9", "label": "A", "text": "b", "isCorrect": false, "image": null}, {"id": "zNSjH", "label": "B", "text": "a", "isCorrect": false, "image": null}, {"id": "Kf1j8", "label": "C", "text": "d", "isCorrect": true, "image": null}, {"id": "zMrPB", "label": "D", "text": "c", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "When a small metal sphere falls through a viscous liquid, the forces acting on it are its weight ($W$) downwards, buoyant force ($F_B$) upwards, and viscous drag force ($F_v$) upwards.<br><br>The equation of motion is given by:<br>$m \\dfrac{dv}{dt} = W - F_B - F_v$<br>$m \\dfrac{dv}{dt} = mg - \\dfrac{4}{3}\\pi r^3 \\sigma g - 6\\pi \\eta r v$<br><br>Initially at $t=0$, $v=0$, so the acceleration is maximum. As velocity increases, the viscous drag force ($6\\pi \\eta r v$) increases, which decreases the net force and hence the acceleration.<br><br>Eventually, the net force becomes zero, and the sphere attains a constant maximum velocity called the terminal velocity ($v_T$).<br><br>The velocity varies with time according to the relation:<br>$v = v_T(1 - e^{-kt/m})$<br><br>This represents an exponentially increasing curve that starts from the origin and asymptotically approaches a constant value. Graph (d) correctly represents this variation.<br><br>Answer: d", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d34d8c30a4553e1be24a", "type": "singleCorrect", "question": {"text": "In case of liquid, if Reynold's number '$R_n$' is $1450$, then the flow of liquid will", "image": null}, "options": [{"id": "5Fnk6", "label": "A", "text": "be streamline.", "isCorrect": false, "image": null}, {"id": "kEYfE", "label": "B", "text": "be turbulent.", "isCorrect": false, "image": null}, {"id": "smknj", "label": "C", "text": "change from streamline to turbulent flow.", "isCorrect": true, "image": null}, {"id": "KBpzD", "label": "D", "text": "be sometimes turbulent and sometimes streamline.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The nature of the flow of a liquid through a pipe is determined by its Reynolds number ($R_n$).<br><br>If $R_n < 1000$, the flow is streamline or laminar.<br><br>If $R_n > 2000$, the flow is turbulent.<br><br>If $1000 < R_n < 2000$, the flow is unsteady, meaning it changes from streamline to turbulent flow.<br><br>Given that $R_n = 1450$, the value lies in the transition range of $1000 < R_n < 2000$.<br><br>Therefore, the flow of the liquid will change from streamline to turbulent.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ea8c30a4553e1bde31", "type": "singleCorrect", "question": {"text": "In case of fluid flowing on horizontal surface the flow of fluid becomes unsteady when Reynolds number (Rn) is", "image": null}, "options": [{"id": "50OZr", "label": "A", "text": "less than 499", "isCorrect": false, "image": null}, {"id": "9tmUB", "label": "B", "text": "between 500 - 999", "isCorrect": false, "image": null}, {"id": "Urqmj", "label": "C", "text": "between 1000 - 1999", "isCorrect": true, "image": null}, {"id": "AgV5e", "label": "D", "text": "greater than 2000", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to the standard classification of fluid flow based on Reynolds number ($R_e$):<br><br>For $R_e < 1000$, the flow is streamline or laminar.<br><br>For $1000 < R_e < 2000$, the flow becomes unsteady or transitional.<br><br>For $R_e > 2000$, the flow is turbulent.<br><br>Therefore, the flow becomes unsteady when the Reynolds number is between $1000$ and $1999$.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3228c30a4553e1be089", "type": "singleCorrect", "question": {"text": "A sp
