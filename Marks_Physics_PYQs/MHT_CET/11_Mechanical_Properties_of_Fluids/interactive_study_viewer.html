  <script>
    const data = {"index": 11, "chapterId": "61c08987db08c04cf2c145f5", "chapter": "Mechanical Properties of Fluids", "exam": "MHT CET", "subject": "Physics", "totalTopics": 7, "totalQuestions": 340, "downloadTime": "2026-10-08 20:34:05", "topics": [{"index": 1, "topicId": "65a263200279619d9d8a3c2e", "title": "Pressure and thrust", "totalQuestions": 8, "questions": [{"_id": "6abb888b15a9fc0fc8c144b6", "type": "singleCorrect", "question": {"text": "When a large bubble rises from bottom of a water lake to its surface, then its radius doubles. If the atmospheric pressure is equal to the pressure of height $H$ of a certain water column then the depth of lake will be", "image": null}, "options": [{"id": "20a1m", "label": "A", "text": "$2H$", "isCorrect": false, "image": null}, {"id": "2jjUe", "label": "B", "text": "$H$", "isCorrect": false, "image": null}, {"id": "sc6NS", "label": "C", "text": "$7H$", "isCorrect": true, "image": null}, {"id": "IrcZN", "label": "D", "text": "$4H$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the radius of the bubble at the bottom be $r$ and at the surface be $2r$.<br><br>Volume of the bubble at the bottom, $V_2 = \\dfrac{4}{3}\\pi r^3$<br><br>Volume of the bubble at the surface, $V_1 = \\dfrac{4}{3}\\pi (2r)^3 = 8V_2$<br><br>Let the depth of the lake be $h$ and the density of water be $\\rho$.<br><br>Pressure at the surface, $P_1 = P_{atm} = \\rho g H$<br><br>Pressure at the bottom, $P_2 = P_{atm} + \\rho g h = \\rho g (H + h)$<br><br>Assuming the temperature remains constant, Boyle's law is applicable:<br><br>$P_1 V_1 = P_2 V_2$<br><br>$\\rho g H (8V_2) = \\rho g (H + h) V_2$<br><br>$8H = H + h$<br><br>$h = 7H$<br><br>Answer: $7H$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3228c30a4553e1be08a", "type": "singleCorrect", "question": {"text": "The pressure at half the depth of a lake is equal to two-third pressure at the bottom of the lake. So the depth 'h' of the lake is ($\\rho$ = density of water in the lake, $g$ = acceleration due to gravity, $P_0$ = atmospheric pressure).", "image": null}, "options": [{"id": "3ipwD", "label": "A", "text": "$\\dfrac{2P_0}{\\rho g}$", "isCorrect": true, "image": null}, {"id": "EIgBD", "label": "B", "text": "$\\dfrac{P_0}{\\rho g}$", "isCorrect": false, "image": null}, {"id": "Cu6am", "label": "C", "text": "$\\dfrac{2P_0}{3\\rho g}$", "isCorrect": false, "image": null}, {"id": "Q3S6O", "label": "D", "text": "$\\dfrac{P_0}{2\\rho g}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the depth of the lake be $h$.<br><br>Pressure at half the depth of the lake is given by $P_1 = P_0 + \\dfrac{\\rho g h}{2}$.<br><br>Pressure at the bottom of the lake is given by $P_2 = P_0 + \\rho g h$.<br><br>According to the given condition, $P_1 = \\dfrac{2}{3} P_2$.<br><br>Substituting the expressions for $P_1$ and $P_2$:<br><br>$P_0 + \\dfrac{\\rho g h}{2} = \\dfrac{2}{3} (P_0 + \\rho g h)$<br><br>$P_0 - \\dfrac{2}{3} P_0 = \\dfrac{2}{3} \\rho g h - \\dfrac{1}{2} \\rho g h$<br><br>$\\dfrac{P_0}{3} = \\dfrac{\\rho g h}{6}$<br><br>$h = \\dfrac{2P_0}{\\rho g}$<br><br>Answer: $\\dfrac{2P_0}{\\rho g}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b34bf9280d7f9932717", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The temperature of an air bubble while rising from bottom to surface of a lake remains constant but diameter is doubled. If pressure on the surface is h meter of mercury column and relative density of mercury is '$\\rho$' then the depth of the lake is", "image": null}, "options": [{"id": "Wz2ap", "text": "5 h $\\rho$", "image": null, "isCorrect": false}, {"id": "cYGNV", "text": "7 h $\\rho$", "image": null, "isCorrect": true}, {"id": "yPmaM", "text": "$\\frac{3 \\mathrm{~h}}{\\rho}$", "image": null, "isCorrect": false}, {"id": "8zls2", "text": "$\\frac{4 \\mathrm{~h}}{\\rho}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $V_1$ and $V_2$ be the volumes of the air bubble at the bottom and surface of the lake respectively.<br><br>Since the diameter is doubled, the radius is also doubled. The volume of a sphere is proportional to the cube of its radius.<br><br>$V_2 = \\dfrac{4}{3} \\pi (2r)^3 = 8 \\left( \\dfrac{4}{3} \\pi r^3 \\right) = 8 V_1$<br><br>Since the temperature remains constant, Boyle's law is applicable:<br><br>$P_1 V_1 = P_2 V_2$<br><br>$P_1 V_1 = P_2 (8 V_1)$<br><br>$P_1 = 8 P_2$<br><br>Let $H$ be the depth of the lake, $\\rho_w$ be the density of water, and $\\rho_m$ be the density of mercury. The relative density of mercury is $\\rho$, so $\\rho_m = \\rho \\rho_w$.<br><br>Pressure at the surface of the lake is given by $h$ meter of mercury column:<br><br>$P_2 = h \\rho_m g = h \\rho \\rho_w g$<br><br>Pressure at the bottom of the lake is:<br><br>$P_1 = P_2 + H \\rho_w g$<br><br>Substituting $P_1$ into the equation $P_1 = 8 P_2$:<br><br>$P_2 + H \\rho_w g = 8 P_2$<br><br>$H \\rho_w g = 7 P_2$<br><br>Substituting the value of $P_2$:<br><br>$H \\rho_w g = 7 (h \\rho \\rho_w g)$<br><br>$H = 7 h \\rho$<br><br>Answer: 7 h $\\rho$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2620a0279619d9d8a3152", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "What should be the diameter of a soap bubble, in order that the excess pressure inside it is $25.6 \\mathrm{Nm}^{-2}$ ? [surface tension of soap solution $\\left.=3.2 \\times 10^{-2} \\mathrm{Nm}^{-2}\\right]$", "image": null}, "options": [{"id": "Q5VN8", "text": "$2 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "KspTc", "text": "$1.5 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "7AkLP", "text": "$1 \\mathrm{~cm}$", "image": null, "isCorrect": true}, {"id": "tnt28", "text": "$0.5 \\mathrm{~cm}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The formula for excess pressure inside the bubble is given as $P_0=\\frac{4 T}{R}$\nWhere, $\\mathrm{T}$ is surface tension and $\\mathrm{R}$ is the radius of the sphere\nRearranging the formula for $\\mathrm{R}$ and substituting the values,$\\begin{aligned}\n& R=\\frac{4 T}{P_0} \\\\\n& R=\\frac{4 \\times 3.2 \\times 10^{-2}}{25.6} \\\\\n& R=0.5 \\times 10^{-2} \\mathrm{~m}=0.5 \\mathrm{~cm}\n\\end{aligned}$\nThe diameter then becomes, $2 \\mathrm{R}=1 \\mathrm{~cm}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260100279619d9d8a2175", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}], "question": {"text": "What would be the absolute pressure at depth $1 \\mathrm{~km}$ below the ocean?\n[Given : density of water $=10^{3} \\mathrm{~kg} / \\mathrm{m}^{3}, \\mathrm{~g}=10 \\mathrm{~m} / \\mathrm{s}^{2}, 1$ atmospheric pressure $=$ $\\left.1 \\cdot 01 \\times 10^{5} \\mathrm{~N} / \\mathrm{m}^{2}\\right]$", "image": null}, "options": [{"id": "IeJXx", "text": "$10 \\cdot 101 \\times 10^{7} \\mathrm{~N} / \\mathrm{m}^{2}$", "image": null, "isCorrect": false}, {"id": "Mhsbj", "text": "$10 \\cdot 101 \\times 10^{7}$ dyne $/ \\mathrm{cm}^{2}$", "image": null, "isCorrect": false}, {"id": "z7oIr", "text": "$10 \\cdot 101 \\times 10^{6}$ dyne $/ \\mathrm{cm}^{2}$", "image": null, "isCorrect": false}, {"id": "XcPJc", "text": "$10 \\cdot 101 \\times 10^{6} \\mathrm{~N} / \\mathrm{m}^{2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given: $\\mathrm{h}=1000 \\mathrm{~m}, \\mathrm{~d}=1.03 \\times 10^{3} \\mathrm{~kg} / \\mathrm{m}^{3}, \\mathrm{~g}=10 \\mathrm{~m} / \\mathrm{s}^{2}$\nThe absolute pressure is given by: absolute pressure $=$ pressure of water $+$ atmospheric pressure\n$\\mathrm{P}=\\mathrm{~hdg}+1 \\mathrm{~atm}=1000 \\times 1.03 \\times 10^{3} \\times 10+1\\mathrm{~atm}$ $=1.03 \\times 10^{7} \\mathrm{~Pa}+1 \\mathrm{~atm}$\n$P=103 \\mathrm{~atm}+1 \\mathrm{~atm}=104 \\mathrm{~atm}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fe90279619d9d8a203c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "The compressibility of water is $5 \\times 10^{-10} \\mathrm{~m}^{2} / \\mathrm{N}$. Pressure of $15 \\times 10^{6} \\mathrm{~Pa}$ is applied\non $100 \\mathrm{ml}$ volume of water. The change in the volume of water is", "image": null}, "options": [{"id": "eDyjt", "text": "$0.75 \\mathrm{ml}$ increase.", "image": null, "isCorrect": false}, {"id": "jXHIH", "text": "$1.50 \\mathrm{ml}$ increase.", "image": null, "isCorrect": false}, {"id": "Tsl2y", "text": "$0.75 \\mathrm{ml}$ decrease.", "image": null, "isCorrect": true}, {"id": "YBzwx", "text": "zero.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(A)\nGiven,\n$\\begin{array}{l}\n\\beta=\\frac{1}{\\mathrm{~K}}=5 \\times 10^{-10} \\mathrm{~m}^{2} / \\mathrm{N} \\\\\n\\Delta \\mathrm{P}=15 \\mathrm{MPa}=15 \\times 10^{6} \\mathrm{~Pa}\n\\end{array}$\nBulk modulus,\n$\\mathrm{K}=-\\frac{\\Delta \\mathrm{P}}{\\varepsilon_{\\mathrm{V}}}$\nwhere, $\\varepsilon_{\\mathrm{V}}=$ volumetric strain\n$\\begin{array}{l}\n\\beta=-\\frac{\\varepsilon_{\\mathrm{V}}}{\\Delta \\mathrm{P}} \\\\\n\\varepsilon_{\\mathrm{V}}=-\\beta \\Delta \\mathrm{P}=-5 \\times 10^{-10} \\times 15 \\times 10^{6} \\\\\n\\varepsilon_{\\mathrm{V}}=7.5 \\times 10^{-3}\n\\end{array}$\nThe correct option is A.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ef90279619d9d8a18c1", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}], "question": {"text": "When a large bubble rises from bottom of a water lake to its surface, then its radius doubles. If the atmospheric pressure is equal to the pressure of height H of a certain water column, then the depth of lake will be", "image": null}, "options": [{"id": "5iwZS", "text": "2H", "image": null, "isCorrect": false}, {"id": "6HdPC", "text": "H", "image": null, "isCorrect": false}, {"id": "EKdwg", "text": "7H", "image": null, "isCorrect": true}, {"id": "68nH6", "text": "4H", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When a large bubble rises from bottom of water lake to its surface, then its radius becomes double. <br/>i.e., <math><msub><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>2</mn><msub><mrow><mi>r</mi></mrow><mrow><mn>1</mn></mrow></msub></math>  <br/>Since, volume <math><mi>V</mi><mo>∝</mo><msup><mrow><mi>r</mi></mrow><mrow><mn>3</mn></mrow></msup></math>  <br/><math><mo>∴</mo><mfrac><mrow><msub><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><msub><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>r</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>3</mn></mrow></msup><mo>=</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>2</mn><msub><mrow><mi>r</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>r</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>8</mn></math>  <br/><math><mo>⇒</mo><msub><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>8</mn><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub></math> … (i) <br/>From Boyle’s law, <br/><math><msub><mrow><mi>p</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msub></math>  <br/>Where, <math><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub></math> = atmospheric pressure. <br/><math><msub><mrow><mi>p</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub><mn>8</mn><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub></math> [from Eq. (ii)] <br/><math><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><msub><mrow><mi>p</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><mn>8</mn></mrow></mfrac></math>  <br/>where, <math><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo></math> atmospheric pressure <br/>and <math><msub><mrow><mi>p</mi></mrow><mrow><mn>1</mn></mrow></msub></math> = pressure at depth d. <br/><math><mo>∴</mo><mi></mi><msub><mrow><mi>p</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi>p</mi></mrow><mrow><mi>a</mi><mi>t</mi><mi>o</mi><mi>m</mi><mi>s</mi><mi>p</mi><mi>h</mi><mi>e</mi><mi>r</mi><mi>i</mi><mi>c</mi></mrow></msub><mo>+</mo><mi>p</mi><mi>g</mi><mi>d</mi></math>  <br/><math><msub><mrow><mi>p</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><mi>p</mi><mi>g</mi><mi>d</mi></math> … (iii) <br/>From Eqs. (ii) and (iii), we have <br/><math><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><mi>p</mi><mi>g</mi><mi>d</mi></mrow><mrow><mn>8</mn></mrow></mfrac></math>  <br/><math><mn>7</mn><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mi>p</mi><mi>g</mi><mi>d</mi></math>  <br/><math><mn>7</mn><mo>.</mo><mi>p</mi><mi>g</mi><mi>H</mi><mo>=</mo><mi>p</mi><mi>g</mi><mi>d</mi></math>  <br/><math><mn>7</mn><mi>H</mi><mo>=</mo><mi>d</mi><mo>⇒</mo><mi>d</mi><mo>=</mo><mn>7</mn><mi>H</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e3b0279619d9d8a12c5", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "We consider a thermodynamic system. If $\\Delta U$ represents the increase in its internal energy and $W$ the work done by the system, which of the following statements is true?", "image": null}, "options": [{"id": "81d3T", "text": "$\\Delta U=-W$ is an adiabatic process", "image": null, "isCorrect": true}, {"id": "YFNHc", "text": "$\\Delta U=W$ in an isothermal process", "image": null, "isCorrect": false}, {"id": "oxTQ7", "text": "$\\Delta U=-W$ in an isothermal process", "image": null, "isCorrect": false}, {"id": "BWdCN", "text": "$\\Delta U=W$ in an adiabatic process", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "An isothermal process is a constant temperature process. In this process, $T=$ constant or $\\Delta T=0$.\n$$\n\\therefore \\quad \\Delta U=n C_{V} \\Delta T=0\n$$\nAn adiabatic process is defined as one with no heat transfer into or out of a system. Therefore, $Q=0 .$ From the first law of thermodynamics.\n$W=-\\Delta U$\nor $\\Delta U=-W$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a263210279619d9d8a3c33", "title": "Pascal's Law", "totalQuestions": 7, "questions": [{"_id": "6abb889a15a9fc0fc8c14544", "type": "singleCorrect", "question": {"text": "In a hydraulic press, the piston in the small cylinder has a diameter of $d_1$ cm, while the larger piston has a diameter of $d_2$ cm. If a force $F_1$ is applied to the small piston, then the force $F_2$ on the large piston is given by", "image": null}, "options": [{"id": "caM7f", "label": "A", "text": "$F_2 = \\dfrac{d_2^2}{d_1^2} F_1$", "isCorrect": true, "image": null}, {"id": "4h60A", "label": "B", "text": "$F_2 = \\dfrac{d_1^2}{d_2^2} F_1$", "isCorrect": false, "image": null}, {"id": "7jyYx", "label": "C", "text": "$F_2 = \\dfrac{d_2^2}{d_1^2} \\dfrac{1}{F_1}$", "isCorrect": false, "image": null}, {"id": "gUYaF", "label": "D", "text": "$F_2 = \\dfrac{d_1^2}{d_2^2} \\dfrac{1}{F_1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Pascal's law, the pressure applied to an enclosed fluid is transmitted undiminished to every portion of the fluid and the walls of the containing vessel.<br><br>Pressure on the small piston is $P_1 = \\dfrac{F_1}{A_1} = \\dfrac{F_1}{\\dfrac{\\pi d_1^2}{4}}$<br><br>Pressure on the large piston is $P_2 = \\dfrac{F_2}{A_2} = \\dfrac{F_2}{\\dfrac{\\pi d_2^2}{4}}$<br><br>Equating the pressures, $P_1 = P_2$<br><br>$\\dfrac{F_1}{d_1^2} = \\dfrac{F_2}{d_2^2}$<br><br>$F_2 = \\dfrac{d_2^2}{d_1^2} F_1$<br><br>Answer: $F_2 = \\dfrac{d_2^2}{d_1^2} F_1$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb882b15a9fc0fc8c14131", "type": "singleCorrect", "question": {"text": "In a hydraulic press, the small cylinder has a diameter of $d_1$ cm, while the large cylinder has a diameter of $d_2$ cm. If a force $F_1$ is applied to a piston of small cylinder, then the force on the piston of large cylinder $F_2$ is", "image": null}, "options": [{"id": "URk3Q", "label": "A", "text": "$\\dfrac{d_1^2}{d_2^2}\\dfrac{1}{F_1}$", "isCorrect": false, "image": null}, {"id": "vyy6V", "label": "B", "text": "$\\dfrac{d_1^2}{d_2^2}F_1$", "isCorrect": false, "image": null}, {"id": "cWOKW", "label": "C", "text": "$\\dfrac{d_2^2}{d_1^2}\\dfrac{1}{F_1}$", "isCorrect": false, "image": null}, {"id": "0RwVk", "label": "D", "text": "$\\dfrac{d_2^2}{d_1^2}F_1$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "According to Pascal's law, the pressure is transmitted equally in all directions in an enclosed fluid.<br><br>Pressure on the small cylinder is $P_1 = \\dfrac{F_1}{A_1}$<br><br>Pressure on the large cylinder is $P_2 = \\dfrac{F_2}{A_2}$<br><br>Equating the pressures, $P_1 = P_2$<br><br>$\\dfrac{F_1}{A_1} = \\dfrac{F_2}{A_2}$<br><br>The areas of the cylinders are $A_1 = \\dfrac{\\pi d_1^2}{4}$ and $A_2 = \\dfrac{\\pi d_2^2}{4}$<br><br>Substituting the areas into the equation:<br><br>$\\dfrac{F_1}{\\dfrac{\\pi d_1^2}{4}} = \\dfrac{F_2}{\\dfrac{\\pi d_2^2}{4}}$<br><br>$\\dfrac{F_1}{d_1^2} = \\dfrac{F_2}{d_2^2}$<br><br>$F_2 = \\dfrac{d_2^2}{d_1^2}F_1$<br><br>Answer: $\\dfrac{d_2^2}{d_1^2}F_1$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3228c30a4553e1be088", "type": "singleCorrect", "question": {"text": "A piston of cross-sectional area $2.5 \\times 10^{-2}\\ \\text{m}^2$ is used in a hydraulic lift to exert a force of $250\\ \\text{N}$ on water. The cross-sectional area of the other piston which supports a car of mass $3000\\ \\text{kg}$ is ($g = 9.8\\ \\text{m/s}^2$)", "image": null}, "options": [{"id": "ZQNn4", "label": "A", "text": "$1.96\\ \\text{m}^2$", "isCorrect": false, "image": null}, {"id": "s4i2X", "label": "B", "text": "$2.94\\ \\text{m}^2$", "isCorrect": true, "image": null}, {"id": "JBi0D", "label": "C", "text": "$3.92\\ \\text{m}^2$", "isCorrect": false, "image": null}, {"id": "TzMXs", "label": "D", "text": "$5.88\\ \\text{m}^2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using Pascal's law, the pressure applied on the first piston is equal to the pressure on the second piston.<br><br>$\\dfrac{F_1}{A_1} = \\dfrac{F_2}{A_2}$<br><br>Given $F_1 = 250\\ \\text{N}$, $A_1 = 2.5 \\times 10^{-2}\\ \\text{m}^2$, $m = 3000\\ \\text{kg}$, and $g = 9.8\\ \\text{m/s}^2$.<br><br>The force on the second piston is $F_2 = mg = 3000 \\times 9.8 = 29400\\ \\text{N}$.<br><br>Substituting the values:<br><br>$\\dfrac{250}{2.5 \\times 10^{-2}} = \\dfrac{29400}{A_2}$<br><br>$10000 = \\dfrac{29400}{A_2}$<br><br>$A_2 = \\dfrac{29400}{10000} = 2.94\\ \\text{m}^2$<br><br>Answer: $2.94\\ \\text{m}^2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262580279619d9d8a33c3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "There is hole of area 'A' at the bottom of a cylindrical vessel. Water is filled to a height ' $h$ ' and water flows out in ' $t$ ' second. If water is filled to a height ' $4 \\mathrm{~h}$ ', it will flow out in time (in second)", "image": null}, "options": [{"id": "whmly", "text": "$\\mathrm{t}$", "image": null, "isCorrect": false}, {"id": "gCKJw", "text": "$4 \\mathrm{t}$", "image": null, "isCorrect": false}, {"id": "AwRGu", "text": "$2 \\mathrm{t}$", "image": null, "isCorrect": true}, {"id": "tMX1I", "text": "$\\frac{\\mathrm{t}}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/fghsOfLDUsYfxj9SLKlh2_Zc3c_D_xmSXJoLFsCUrlg.original.fullsize.png\"><br>\nFrom equation of continuity,\n$A v_1=a_2$\n$\\mathrm{A}\\left(-\\frac{\\mathrm{dh}}{\\mathrm{dt}}\\right)=\\mathrm{a} \\sqrt{2 \\mathrm{gh}}$\n$\\int_{\\mathrm{h}_1}^{\\mathrm{h}_2} \\frac{-\\mathrm{dh}}{\\sqrt{\\mathrm{h}}}=\\int_0^{\\mathrm{t}} \\frac{\\mathrm{a}}{\\mathrm{A}} \\sqrt{2 \\mathrm{~g}} \\mathrm{dt}$\n$-[2 \\sqrt{\\mathrm{h}}]_{\\mathrm{h}_1}^{\\mathrm{h}_2}=\\frac{\\mathrm{a}}{\\mathrm{A}} \\sqrt{2 \\mathrm{~g}} \\mathrm{t}$\n$2\\left(\\sqrt{\\mathrm{h}_2}-\\sqrt{\\mathrm{h}_1}\\right)=\\frac{\\mathrm{a}}{\\mathrm{A}} \\sqrt{2 \\mathrm{gt}}$\n$\\therefore \\quad t=\\frac{2 A}{a} \\sqrt{\\frac{H}{2 g}}=\\frac{A}{a} \\frac{\\sqrt{2 H}}{\\sqrt{g}}$\nFor height $h$, the time is $t_1=\\frac{A}{A_0} \\sqrt{\\frac{2 h}{g}}$\nFor height $4 \\mathrm{~h}$, the time is $t_2=\\frac{A}{A_0} \\sqrt{\\frac{8 h}{g}}$\n$\\therefore \\quad \\frac{t_2}{t_1}=2$\n$\\therefore \\quad \\mathrm{t}_2=2 \\mathrm{t}_1$\n$\\therefore \\quad \\mathrm{t}_2=2 \\mathrm{t}$\n$\\ldots\\left(\\because \\mathrm{t}_1=\\mathrm{t}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261960279619d9d8a2dc5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "A can filled with water is revolved in a vertical circle of radius $r$ with constant speed and water just does not fall down. The time period of revolution is $(g=$ acceleration due to gravity)", "image": null}, "options": [{"id": "lWAyO", "text": "$2 \\pi \\sqrt{r g}$", "image": null, "isCorrect": false}, {"id": "psvGh", "text": "$2 \\pi \\sqrt{5 r g}$", "image": null, "isCorrect": false}, {"id": "S0WYc", "text": "$2 \\pi \\sqrt{\\frac{r}{g}}$", "image": null, "isCorrect": true}, {"id": "GBjQk", "text": "$2 \\pi \\sqrt{\\frac{g}{r}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For water not to fall off the can, then centrifugal force must balance the weight of water,\n$\\therefore \\frac{m v^2}{r} \\geq m g$\nMinimum speed of the can so that water does not fall down is given by,\n$v=\\sqrt{r g}$\nTime period of revolution,\n$T=\\frac{2 \\pi r}{v}=2 \\pi \\sqrt{\\frac{r}{g}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261840279619d9d8a2d35", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "A bucket containing water is revolved in a vertical circle of radius $r$ .To prevent the water from falling down, the minimum frequency of revolution required is ( $g=$ acceleration due to gravity)", "image": null}, "options": [{"id": "QI69I", "text": "$2 \\pi \\sqrt{\\frac{r}{g}}$", "image": null, "isCorrect": false}, {"id": "5micr", "text": "$\\frac{1}{2 \\pi} \\sqrt{\\frac{r}{g}}$", "image": null, "isCorrect": false}, {"id": "ZSvZ7", "text": "$\\frac{1}{2 \\pi} \\sqrt{\\frac{g}{r}}$", "image": null, "isCorrect": true}, {"id": "gRTjW", "text": "$2 \\pi \\sqrt{\\frac{g}{r}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let its angular velocity be $\\omega$ at all points (uniform motion). At the highest point, weight of the body is balanced centrifugal force, so\n$$\n\\begin{aligned}\n& m \\omega^2 r=m g \\\\\n& \\Rightarrow \\omega=\\sqrt{\\frac{g}{r}}\n\\end{aligned}\n$$\nAngular frequency is related to frequency as follows:\n$\\omega=2 \\pi f$\n$\\therefore f=\\frac{\\omega}{2 \\pi}=\\frac{1}{2 \\pi} \\sqrt{\\frac{g}{r}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f7a0279619d9d8a1ccb", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}], "question": {"text": "A liquid kept in a cylindrical vessel is rotated about vertical axis through the centre\nof circular base. The difference in the heights of the liquid at the centre of vessel and\nits edge is $(\\mathrm{R}=$ radius of vessel, $\\omega=$ angular velocity of rotation, $\\mathrm{g}=$ acceleration\ndue to gravity)", "image": null}, "options": [{"id": "cEucS", "text": "$\\frac{R^{2} \\omega^{2}}{g}$", "image": null, "isCorrect": false}, {"id": "Y7UNU", "text": "$\\frac{\\mathbf{R} \\omega}{\\mathbf{g}}$", "image": null, "isCorrect": false}, {"id": "VNPXM", "text": "$\\frac{R \\omega}{2 g}$", "image": null, "isCorrect": false}, {"id": "f2JOA", "text": "$\\frac{R^{2} \\omega^{2}}{2 g}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "When the cylindrical vessel is rotated at angular speed $\\omega$ about its axis, the velocity of the liquid at the sides is maximum, given by $\\mathrm{v}_{\\mathrm{s}}=\\mathrm{r} \\omega$\nApplying Bernoulli's theorem at the sides and at the center of the vessel, we have\n$\\mathrm{P}+\\frac{1}{2} \\rho \\mathrm{v}^{2}=$ constant $\\mathrm{P}_{\\mathrm{s}}+\\frac{1}{2} \\rho \\mathrm{v}_{\\mathrm{s}}^{2}=\\mathrm{P}_{\\mathrm{c}}+\\frac{1}{2} \\rho \\mathrm{v}_{\\mathrm{c}}{ }^{2}$\nwhere\n$\\mathrm{P}_{\\mathrm{s}}=$ pressure at the sides\n$\\mathrm{v}_{\\mathrm{s}}=$ velocity of the liquid at the sides\n$\\mathrm{P}_{\\mathrm{c}}=$ pressure at the center\n$\\mathrm{v}_{\\mathrm{c}}=$ velocity of the liquid at the center\n$\\mathrm{P}_{\\mathrm{c}}-\\mathrm{P}_{\\mathrm{s}}=\\frac{1}{2} \\rho \\mathrm{v}_{\\mathrm{s}}^{2}=\\frac{1}{2} \\rho \\mathrm{r}^{2} \\omega^{2} \\ldots(\\mathrm{I}) \\quad \\because \\mathrm{v}_{\\mathrm{c}}=0$\nSince $\\mathrm{P}_{\\mathrm{c}}$ is greater than $\\mathrm{P}_{\\mathrm{s}}$, the liquid rises at the sides of the vessel. Let $\\mathrm{h}$ be the difference in the levels of the liquids at the sides and at the center, so we have\n$\\mathrm{P}_{\\mathrm{c}}-\\mathrm{P}_{\\mathrm{s}}=\\rho g h \\ldots(\\mathrm{II})$\nfrom (I) and (II) we have\n$\\rho g h=\\frac{1}{2} \\rho r^{2} \\omega^{2}$ \n$\\Rightarrow h=\\frac{r^{2} \\omega^{2}}{2 g}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a263210279619d9d8a3c31", "title": "Archmidies Principle", "totalQuestions": 13, "questions": [{"_id": "6abb884d15a9fc0fc8c14264", "type": "singleCorrect", "question": {"text": "The velocity of a small ball of mass $M$ and density $d$ when dropped in a container filled with glycerine becomes constant after some time. If density of glycerine is $\\dfrac{d}{2}$ then the viscous force acting on the ball will be ($g$=acceleration due to gravity)", "image": null}, "options": [{"id": "QytNn", "label": "A", "text": "$Mg$", "isCorrect": false, "image": null}, {"id": "bRZ6w", "label": "B", "text": "$\\dfrac{3Mg}{2}$", "isCorrect": false, "image": null}, {"id": "haJXH", "label": "C", "text": "$2Mg$", "isCorrect": false, "image": null}, {"id": "H9x9L", "label": "D", "text": "$\\dfrac{Mg}{2}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "When the velocity of the ball becomes constant, the net force acting on it is zero.<br><br>The forces acting on the ball are its weight $W$ downwards, buoyant force $F_B$ upwards, and viscous force $F_V$ upwards.<br><br>$W = F_B + F_V$<br><br>$F_V = W - F_B$<br><br>The volume of the ball is $V = \\dfrac{M}{d}$.<br><br>The buoyant force is given by the weight of the displaced liquid:<br><br>$F_B = V \\times \\text{density of glycerine} \\times g$<br><br>$F_B = \\dfrac{M}{d} \\times \\dfrac{d}{2} \\times g = \\dfrac{Mg}{2}$<br><br>Substituting the values, we get:<br><br>$F_V = Mg - \\dfrac{Mg}{2} = \\dfrac{Mg}{2}$<br><br>Answer: $\\dfrac{Mg}{2}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888c15a9fc0fc8c144be", "type": "singleCorrect", "question": {"text": "A wooden cube (density $d$) of side $L$ floats on a liquid of density $\\rho$ with its upper and lower surfaces horizontal. If the cube is pushed slightly down and released, it performs S.H.M. of period $T$. The value of $T$ is ($g$ = acceleration due to gravity)", "image": null}, "options": [{"id": "jFfgR", "label": "A", "text": "$2\\pi\\sqrt{\\dfrac{L\\rho}{(\\rho - d)g}}$", "isCorrect": false, "image": null}, {"id": "emCdn", "label": "B", "text": "$2\\pi\\sqrt{\\dfrac{Ld}{\\rho g}}$", "isCorrect": true, "image": null}, {"id": "Fncur", "label": "C", "text": "$2\\pi\\sqrt{\\dfrac{L\\rho}{dg}}$", "isCorrect": false, "image": null}, {"id": "q4tC6", "label": "D", "text": "$2\\pi\\sqrt{\\dfrac{Ld}{(\\rho - d)g}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Mass of the cube is $m = L^3 d$.<br><br>When the cube is pushed down by a small distance $x$, the additional volume submerged is $L^2 x$.<br><br>The restoring force acting on the cube is the additional buoyant force:<br><br>$F = - (L^2 x) \\rho g$<br><br>Using Newton's second law, $F = ma$:<br><br>$L^3 d \\cdot a = - L^2 \\rho g x$<br><br>$a = - \\left(\\dfrac{\\rho g}{L d}\\right) x$<br><br>Comparing this with the standard equation of S.H.M., $a = - \\omega^2 x$, we get:<br><br>$\\omega^2 = \\dfrac{\\rho g}{L d} \\Rightarrow \\omega = \\sqrt{\\dfrac{\\rho g}{L d}}$<br><br>The time period of oscillation is:<br><br>$T = \\dfrac{2\\pi}{\\omega} = 2\\pi\\sqrt{\\dfrac{L d}{\\rho g}}$<br><br>Answer: $2\\pi\\sqrt{\\dfrac{Ld}{\\rho g}}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb882b15a9fc0fc8c14132", "type": "singleCorrect", "question": {"text": "A vessel contains oil (density$=0.6$ g/cm$^3$) over mercury (density$=13.6$ g/cm$^3$). A homogeneous sphere floats with half its volume immersed in mercury and the remaining half in oil. The density of the material of the sphere in g/cm$^3$ is", "image": null}, "options": [{"id": "GqnK5", "label": "A", "text": "$6.8$", "isCorrect": false, "image": null}, {"id": "cYdvd", "label": "B", "text": "$6.3$", "isCorrect": false, "image": null}, {"id": "8mAvX", "label": "C", "text": "$7.1$", "isCorrect": true, "image": null}, {"id": "pqlX3", "label": "D", "text": "$7.2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the total volume of the sphere be $V$ and its density be $\\rho$.<br><br>The sphere is in equilibrium, so its weight is balanced by the total buoyant force exerted by the two liquids.<br><br>Weight of the sphere $= V \\rho g$<br><br>Buoyant force due to mercury $= \\dfrac{V}{2} \\rho_{Hg} g$<br><br>Buoyant force due to oil $= \\dfrac{V}{2} \\rho_{oil} g$<br><br>Equating the weight to the total buoyant force:<br><br>$V \\rho g = \\dfrac{V}{2} \\rho_{Hg} g + \\dfrac{V}{2} \\rho_{oil} g$<br><br>$\\rho = \\dfrac{\\rho_{Hg} + \\rho_{oil}}{2}$<br><br>Substituting the given values, $\\rho_{Hg} = 13.6$ g/cm$^3$ and $\\rho_{oil} = 0.6$ g/cm$^3$:<br><br>$\\rho = \\dfrac{13.6 + 0.6}{2}$<br><br>$\\rho = \\dfrac{14.2}{2} = 7.1$ g/cm$^3$<br><br>Answer: $7.1$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3318c30a4553e1be12b", "type": "singleCorrect", "question": {"text": "A rectangular block of mass 'm' and cross-sectional area 'A' floats on a liquid of density '$\\varrho$'. It is given a small vertical displacement from equilibrium, it starts oscillating with frequency (g=acceleration due to gravity)", "image": null}, "options": [{"id": "exask", "label": "A", "text": "$2\\pi\\sqrt{\\dfrac{\\text{m}}{\\text{A}\\varrho\\text{g}}}$", "isCorrect": false, "image": null}, {"id": "4C2j0", "label": "B", "text": "$2\\pi\\sqrt{\\dfrac{\\text{A}\\varrho\\text{g}}{\\text{m}}}$", "isCorrect": false, "image": null}, {"id": "344Xe", "label": "C", "text": "$\\dfrac{1}{2\\pi}\\sqrt{\\dfrac{\\text{A}\\varrho\\text{g}}{\\text{m}}}$", "isCorrect": true, "image": null}, {"id": "TeohM", "label": "D", "text": "$\\dfrac{1}{2\\pi}\\sqrt{\\dfrac{\\text{m}}{\\text{A}\\varrho\\text{g}}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the block be displaced downwards by a small distance $x$ from its equilibrium position.<br><br>The additional volume submerged in the liquid is $Ax$.<br><br>The extra buoyant force acting upwards provides the restoring force, which is given by $F = -(\\text{additional volume}) \\times \\varrho \\times g$<br><br>$F = -A x \\varrho g$<br><br>Comparing this with the standard equation of simple harmonic motion $F = -kx$, we get the effective force constant $k = A\\varrho g$.<br><br>The angular frequency of oscillation is $\\omega = \\sqrt{\\dfrac{k}{m}} = \\sqrt{\\dfrac{A\\varrho g}{m}}$.<br><br>The frequency of oscillation is $f = \\dfrac{\\omega}{2\\pi} = \\dfrac{1}{2\\pi}\\sqrt{\\dfrac{A\\varrho g}{m}}$.<br><br>Answer: $\\dfrac{1}{2\\pi}\\sqrt{\\dfrac{\\text{A}\\varrho\\text{g}}{\\text{m}}}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b38c30a4553e1bdbdf", "type": "singleCorrect", "question": {"text": "A vessel contains oil (density $= 0.8 \\text{ gm}/\\text{cm}^3$) over mercury (density $= 13.6 \\text{ gm}/\\text{cm}^3$). A homogeneous sphere floats with half of its volume immersed in mercury and the other half in oil. The density of the material of the sphere in $\\text{gm}/\\text{cm}^3$ is<br><img style=\"width: 250px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/11_april_shift_1__q21_d1.png\" />", "image": null}, "options": [{"id": "NNMce", "label": "A", "text": "$12.8$", "isCorrect": false, "image": null}, {"id": "XP1Pc", "label": "B", "text": "$7.2$", "isCorrect": true, "image": null}, {"id": "IPqTG", "label": "C", "text": "$6.4$", "isCorrect": false, "image": null}, {"id": "Ks69e", "label": "D", "text": "$3.3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the total volume of the sphere be $V$ and its density be $\\rho$.<br><br>According to the principle of flotation, the weight of the sphere is balanced by the total buoyant force exerted by the two liquids.<br><br>Weight of the sphere, $W = V \\rho g$<br><br>The sphere has half of its volume in mercury and the other half in oil. The total buoyant force $F_B$ is the sum of the buoyant forces from both liquids:<br>$F_B = F_{B,\\text{mercury}} + F_{B,\\text{oil}}$<br>$F_B = \\left(\\dfrac{V}{2}\\right) \\rho_{\\text{Hg}} g + \\left(\\dfrac{V}{2}\\right) \\rho_{\\text{oil}} g$<br><br>Equating the weight of the sphere to the total buoyant force:<br>$V \\rho g = \\dfrac{V}{2} \\rho_{\\text{Hg}} g + \\dfrac{V}{2} \\rho_{\\text{oil}} g$<br><br>Dividing both sides by $Vg$, we get:<br>$\\rho = \\dfrac{\\rho_{\\text{Hg}} + \\rho_{\\text{oil}}}{2}$<br><br>Given $\\rho_{\\text{Hg}} = 13.6 \\text{ gm/cm}^3$ and $\\rho_{\\text{oil}} = 0.8 \\text{ gm/cm}^3$, substituting these values:<br>$\\rho = \\dfrac{13.6 + 0.8}{2}$<br>$\\rho = \\dfrac{14.4}{2} = 7.2 \\text{ gm/cm}^3$<br><br>The density of the material of the sphere is $7.2 \\text{ gm/cm}^3$.<br><br>Answer: $7.2$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b94bf9280d7f9932a8f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A solid cylinder of length $\\ell$ and cross-sectional area $\\frac{\\mathrm{a}}{5}$ is immersed such that it floats with its axis vertical at the liquid-liquid interface with length $\\ell / 4$ in the denser liquid as shown in figure. The lower density liquid $(\\varrho)$ is open to atmosphere having pressure $P_0$. The density d of solid cylinder is\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/RMm7cmJgaoP2BsvtwhCcjSCd9BGQYA2yW820CPh6I1o.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "u821v", "text": "$\\frac{1}{2} \\varrho$", "image": null, "isCorrect": false}, {"id": "qF5W6", "text": "$\\frac{3}{2} \\varrho$", "image": null, "isCorrect": true}, {"id": "sZbcf", "text": "$\\frac{3}{4} \\varrho$", "image": null, "isCorrect": false}, {"id": "1B2sY", "text": "$\\varrho$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the cross-sectional area of the cylinder be $A = \\dfrac{a}{5}$.<br><br>For the cylinder to float in equilibrium, its weight must be balanced by the total buoyant force exerted by the two liquids.<br><br>The total length of the cylinder is $\\ell$. It is given that the length of the cylinder in the denser liquid is $\\dfrac{\\ell}{4}$. Since the cylinder is completely immersed across the interface, the length of the cylinder in the lighter liquid is:<br>$\\ell - \\dfrac{\\ell}{4} = \\dfrac{3\\ell}{4}$<br><br>The weight of the solid cylinder is:<br>$W = \\text{Volume} \\times \\text{density} \\times g = (A\\ell) d g$<br><br>The total buoyant force $F_B$ is the sum of the weights of the displaced liquids:<br>$F_B = \\text{Weight of displaced lighter liquid} + \\text{Weight of displaced denser liquid}$<br>$F_B = A \\left(\\dfrac{3\\ell}{4}\\right) \\varrho g + A \\left(\\dfrac{\\ell}{4}\\right) (3\\varrho) g$<br><br>Equating the weight of the cylinder to the buoyant force ($W = F_B$):<br>$A \\ell d g = A \\left(\\dfrac{3\\ell}{4}\\right) \\varrho g + A \\left(\\dfrac{\\ell}{4}\\right) (3\\varrho) g$<br><br>Dividing both sides by $A \\ell g$, we get:<br>$d = \\dfrac{3}{4}\\varrho + \\dfrac{3}{4}\\varrho$<br><br>$d = \\dfrac{6}{4}\\varrho = \\dfrac{3}{2}\\varrho$<br><br>Answer: $\\frac{3}{2} \\varrho$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b0bbf9280d7f99325e3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A small metal sphere of density $\\rho$ is dropped from height $h$ into a jar containing liquid of density $\\sigma(\\sigma>\\rho)$. The maximum depth up to which the sphere sinks is (Neglect damping forces)", "image": null}, "options": [{"id": "XhTgF", "text": "$\\frac{\\rho}{(\\rho-\\sigma)}$", "image": null, "isCorrect": false}, {"id": "KTIyY", "text": "$\\frac{\\mathrm{h} \\sigma}{(\\rho-\\sigma)}$", "image": null, "isCorrect": false}, {"id": "mWeWJ", "text": "$\\frac{\\sigma}{(\\rho-\\sigma)}$", "image": null, "isCorrect": false}, {"id": "OvoHK", "text": "$\\frac{\\mathrm{h} \\rho}{(\\sigma-\\rho)}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $V$ be the volume of the sphere. The mass of the sphere is $m = V \\rho$.<br><br>Let $x$ be the maximum depth up to which the sphere sinks in the liquid. The total downward displacement of the sphere from its initial position is $h + x$.<br><br>The work done by gravity on the sphere is:<br>$W_g = mg(h + x) = V \\rho g(h + x)$<br><br>The buoyant force acts upwards on the sphere only when it is inside the liquid. The magnitude of the buoyant force is:<br>$F_B = V \\sigma g$<br><br>The work done by the buoyant force is:<br>$W_B = -F_B x = -V \\sigma g x$<br><br>According to the work-energy theorem, the net work done is equal to the change in kinetic energy. Since the sphere starts from rest and momentarily comes to rest at the maximum depth, the change in kinetic energy is zero.<br><br>$W_g + W_B = 0$<br><br>$V \\rho g(h + x) - V \\sigma g x = 0$<br><br>Dividing by $V g$:<br>$\\rho(h + x) - \\sigma x = 0$<br><br>$\\rho h + \\rho x - \\sigma x = 0$<br><br>$x(\\sigma - \\rho) = \\rho h$<br><br>$x = \\dfrac{h \\rho}{\\sigma - \\rho}$<br><br>Answer: $\\frac{\\mathrm{h} \\rho}{(\\sigma-\\rho)}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792141d0aee93fa0796de17", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "A ball rises to surface at a constant velocity in liquid whose density is 3 times greater than that of the material of the ball. The ratio of force of friction acting on the rising ball to its weight is", "image": null}, "options": [{"id": "Ge8pm", "text": "$2: 1$", "image": null, "isCorrect": true}, {"id": "ito7V", "text": "$3: 1$", "image": null, "isCorrect": false}, {"id": "wngjm", "text": "$4: 1$", "image": null, "isCorrect": false}, {"id": "TVpB1", "text": "$6: 1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $V$ be the volume of the ball and $\\rho$ be the density of the material of the ball.<br><br>Weight of the ball, $W = V \\rho g$<br><br>Density of the liquid is given as $3\\rho$.<br><br>Buoyant force acting on the ball in the upward direction, $F_B = V (3\\rho) g = 3 V \\rho g = 3W$<br><br>Since the ball rises at a constant velocity, its acceleration is zero, meaning the net force acting on it is zero. The forces acting on the ball are the upward buoyant force, the downward weight, and the downward force of friction (viscous drag).<br><br>$F_B = W + F_v$<br><br>$3W = W + F_v$<br><br>$F_v = 2W$<br><br>The ratio of the force of friction to its weight is:<br><br>$\\dfrac{F_v}{W} = \\dfrac{2W}{W} = \\dfrac{2}{1}$<br><br>The ratio is $2:1$.<br><br>Answer: $2: 1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213800aee93fa0796d947", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "A hemispherical portion of radius ' $R$ ' is removed from the bottom of a cylinder of radius ' R '. The volume of the remaining cylinder is ' $V$ ' and its mass is ' $M$ '. It is suspended by a string in a liquid of density ' $\\rho$ ' where it stays vertical. The upper surface of the cylinder is at a depth ' $h$ ' below the liquid surface. The force on the bottom of the cylinder is", "image": null}, "options": [{"id": "mNe8P", "text": "Mg", "image": null, "isCorrect": false}, {"id": "9QF3d", "text": "$\\mathrm{Mg}-\\mathrm{V} \\rho \\mathrm{g}$", "image": null, "isCorrect": false}, {"id": "dS9kH", "text": "$\\mathrm{Mg}+\\pi \\mathrm{R}^2 \\mathrm{~h} \\rho g$", "image": null, "isCorrect": false}, {"id": "HDI6W", "text": "($\\rho g (V + \\pi R^2 h)$)", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The net upward force exerted by the liquid on the cylinder is the buoyant force, which is given by Archimedes' principle as:<br><br>$F_B = V \\rho g$<br><br>This buoyant force is the resultant of the forces exerted by the liquid on all surfaces of the cylinder. Since the horizontal forces cancel out due to symmetry, the buoyant force is the difference between the upward force on the bottom surface and the downward force on the top surface:<br><br>$F_B = F_{bottom} - F_{top}$<br><br>The top surface of the cylinder is flat, has an area $A = \\pi R^2$, and is at a depth $h$. The downward force on the top surface is:<br><br>$F_{top} = P_{top} A = (\\rho g h)(\\pi R^2)$<br><br>Substituting $F_{top}$ and $F_B$ into the force balance equation, we get the upward force on the bottom surface:<br><br>$F_{bottom} = F_B + F_{top}$<br><br>$F_{bottom} = V \\rho g + \\rho g h \\pi R^2$<br><br>$F_{bottom} = \\rho g (V + \\pi R^2 h)$<br><br>Answer: ($\\rho g (V + \\pi R^2 h)$)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213330aee93fa0796d6ed", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "A ball rises to surface at a constant velocity in liquid whose density is 4 times that of the material of the ball. The ratio of the force of friction acting on the rising ball and its weight is", "image": null}, "options": [{"id": "bcqpn", "text": "$3: 1$", "image": null, "isCorrect": true}, {"id": "uJZsR", "text": "$4: 1$", "image": null, "isCorrect": false}, {"id": "QZ9vf", "text": "$1: 3$", "image": null, "isCorrect": false}, {"id": "Rxgp6", "text": "$1: 4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the volume of the ball be $V$ and the density of its material be $\\rho$.<br><br>Weight of the ball, $W = V \\rho g$<br><br>Density of the liquid is given as $4\\rho$.<br><br>Buoyant force on the ball, $F_B = V (4\\rho) g = 4W$<br><br>Since the ball rises with a constant velocity, the net force acting on it is zero. The forces acting on the ball are the buoyant force upwards, weight downwards, and viscous friction downwards.<br><br>Equating the forces, we get:<br><br>$F_B = W + F_f$<br><br>$F_f = F_B - W$<br><br>$F_f = 4W - W = 3W$<br><br>The ratio of the force of friction to its weight is:<br><br>$\\dfrac{F_f}{W} = \\dfrac{3W}{W} = 3:1$<br><br>Answer: $3: 1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260ef0279619d9d8a2879", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}], "question": {"text": "A liquid drop of density ' $Q$ ' is floating half immersed in a liquid of density ' $d$ '. Diameter of the liquid drop is\n( $\\mathrm{Q}>\\mathrm{d}, \\mathrm{g}=$ acceleration due to gravity, $\\mathrm{T}=$ surface tension)", "image": null}, "options": [{"id": "3ryV1", "text": "$\\left[\\frac{3 T}{g(2 Q-d)}\\right]^{\\frac{1}{2}}$", "image": null, "isCorrect": false}, {"id": "T2Cqv", "text": "$\\left[\\frac{6 T}{g(Q-d)}\\right]^{\\frac{1}{2}}$", "image": null, "isCorrect": true}, {"id": "rIbBv", "text": "$\\left[\\frac{12 \\mathrm{~T}}{\\mathrm{~g}(2 \\mathrm{Q}-\\mathrm{d})}\\right]^{\\frac{1}{2}}$", "image": null, "isCorrect": false}, {"id": "PG51r", "text": "$\\left[\\frac{9 T}{g(Q-d)}\\right]^{\\frac{1}{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The force balance invovles, surface-tension force and boyancy force balance the weight of the droplet, so the equation is:\n$(2 \\pi r) T+\\left(\\frac{4}{3} \\pi r^3\\right) \\mathrm{dg}=\\left(\\frac{4}{3} \\pi r^3\\right) \\mathrm{Qg}$\nWhere, $\\mathrm{r}$ is the radius of the drop, $\\mathrm{T}$ the interfacial tension between the liquids, $g$ is acceleration due to gravity.\nTherefore,\n$\\mathrm{T}=\\left(\\frac{2}{3} \\mathrm{r}^2\\right)(\\mathrm{Q}-\\mathrm{d}) \\mathrm{g}$\nDiameter $=2 r=\\left[\\frac{6 T}{g(Q-d)}\\right]^{\\frac{1}{2}}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260db0279619d9d8a27da", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}], "question": {"text": "A metal wire of density ' $e$ ' floats on water surface horizontally. If it is NOT to sink in water, then maximum radius of wire is ( $\\mathrm{T}$ = surface tension of water, $\\mathrm{g}$ = gravitational acceleration)", "image": null}, "options": [{"id": "4qkdS", "text": "$\\frac{\\pi \\mathrm{eg}}{\\mathrm{T}}$", "image": null, "isCorrect": false}, {"id": "3mTEB", "text": "$\\frac{\\mathrm{T}}{\\pi \\mathrm{eg}}$", "image": null, "isCorrect": false}, {"id": "PNMyh", "text": "$\\sqrt{\\frac{2 \\mathrm{~T}}{\\pi \\mathrm{eg}}}$", "image": null, "isCorrect": true}, {"id": "fvQQI", "text": "$\\sqrt{\\frac{\\pi e g}{T}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The correct option is (C).\nThere are two free surfaces as shown in the figure:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/ryE4b-rkjq1L08_da8QqGYlR_Fwl2XIYdkNj7U94FA0.original.fullsize.png\">\nConsider the force balance per unit length as shown in the diagram above:\n$2 \\mathrm{~T}=\\mathrm{e} \\pi \\mathrm{r}^2 \\mathrm{~g}$\nTherefore, $r=\\sqrt{\\frac{2 \\mathrm{~T}}{\\pi \\mathrm{eg}}}$.\nWe neglect buoyancy force as it is negligible as compared to surface tension force!", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ed00279619d9d8a177a", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}], "question": {"text": "A thin metal wire of density <math><mi>ρ</mi></math>&nbsp;floats on water surface horizontally. If it is <strong>NOT</strong> to sink in water then maximum radius of wire is proportional to ( <math><mi>T</mi><mo>=</mo></math> surface tension of water, <math><mi>g</mi><mo>=</mo></math> gravitational acceleration)", "image": null}, "options": [{"id": "szQe2", "text": "<math><msqrt><mfrac><mrow><mi>2T</mi></mrow><mrow><mi>π</mi><mi>ρ</mi><mi>g</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "LT2TT", "text": "<math><msqrt><mfrac><mrow><mi>π</mi><mi>ρ</mi><mi>g</mi></mrow><mrow><mi>T</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "rzi5E", "text": "<math><mfrac><mrow><mi>T</mi></mrow><mrow><mi>π</mi><mi>ρ</mi><mi>g</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "5P3DT", "text": "<math><mfrac><mrow><mi>π</mi><mi>ρ</mi><mi>g</mi></mrow><mrow><mi>T</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img alt=\"\" br=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/332699_2_.JPG\" style=\"width: 306px; height: 166px;\" /><br /><math> <mrow>  <mi>M</mi><mi>g</mi><mo>=</mo><mn>2</mn><mi>T</mi><mi>l</mi></mrow></math><br><br /><math> <mrow>  <mi>&#x03C0;</mi><msup>   <mi>r</mi>   <mn>2</mn>  </msup>  <mi>l</mi><mi>&#x03C1;</mi><mi>g</mi><mo>=</mo><mn>2</mn><mi>T</mi><mi>l</mi></mrow></math><br><br /><math> <mrow> <msup> <mi>r</mi> <mn>2</mn> </msup> <mo>=</mo><mfrac> <mi>2T</mi> <mrow> <mi>π</mi><mi>ρ</mi><mi>g</mi></mrow> </mfrac> </mrow> </math><br /><math> <mrow> <mi>r</mi><mo>=</mo><msqrt> <mrow> <mfrac> <mi>2T</mi> <mrow> <mi>π</mi><mi>ρ</mi><mi>g</mi></mrow> </mfrac> </mrow> </msqrt> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "65a263210279619d9d8a3c2f", "title": "Hydrodynamics", "totalQuestions": 34, "questions": [{"_id": "6a44d2f88c30a4553e1bdec3", "type": "singleCorrect", "question": {"text": "An in-compressible fluid flows steadily through a horizontal cylindrical pipe. The pipe has radius '$3R$' at point A and '$1.5R$' at point B, further along the flow direction at the same level. If the velocity at point A is '$v$', then that at point B is", "image": null}, "options": [{"id": "idT58", "label": "A", "text": "$v$", "isCorrect": false, "image": null}, {"id": "4jcNE", "label": "B", "text": "$2v$", "isCorrect": false, "image": null}, {"id": "jYJWu", "label": "C", "text": "$3v$", "isCorrect": false, "image": null}, {"id": "kF4JS", "label": "D", "text": "$4v$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Using the equation of continuity for an incompressible fluid:<br><br>$A_A v_A = A_B v_B$<br><br>$\\pi (3R)^2 v = \\pi (1.5R)^2 v_B$<br><br>$9 \\pi R^2 v = 2.25 \\pi R^2 v_B$<br><br>$v_B = \\dfrac{9}{2.25} v = 4v$<br><br>Answer: $4v$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ea8c30a4553e1bde32", "type": "singleCorrect", "question": {"text": "An incompressible fluid (ideal fluid) is flowing through non uniform cross-sectional tube PQ as shown in the figure from end P to end Q. If $K_P$ and $K_Q$ are the kinetic energy per unit volume of the fluid at end P and end Q respectively, then<br><img style=\"width: 250px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/17_april_shift_2__q16_d1.png\" />", "image": null}, "options": [{"id": "tbeyg", "label": "A", "text": "$K_P = \\dfrac{1}{2}K_Q$", "isCorrect": false, "image": null}, {"id": "WwCtD", "label": "B", "text": "$K_P = K_Q$", "isCorrect": false, "image": null}, {"id": "4faDE", "label": "C", "text": "$K_P < K_Q$", "isCorrect": false, "image": null}, {"id": "rcGt0", "label": "D", "text": "$K_P > K_Q$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "From the given figure, the cross-sectional area of the tube at end P is less than the cross-sectional area at end Q, so $A_P < A_Q$.<br><br>According to the equation of continuity for an incompressible fluid, the product of cross-sectional area and velocity remains constant:<br><br>$A_P v_P = A_Q v_Q$<br><br>Since $A_P < A_Q$, the velocity of the fluid at P is greater than the velocity at Q, which gives $v_P > v_Q$.<br><br>The kinetic energy per unit volume of the fluid is given by $K = \\dfrac{1}{2} \\rho v^2$, where $\\rho$ is the density of the fluid.<br><br>Since $v_P > v_Q$, it follows that $v_P^2 > v_Q^2$.<br><br>Therefore, $\\dfrac{1}{2} \\rho v_P^2 > \\dfrac{1}{2} \\rho v_Q^2$, which implies $K_P > K_Q$.<br><br>Answer: $K_P > K_Q$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d08c30a4553e1bdd13", "type": "singleCorrect", "question": {"text": "A horizontal pipe carries water in a streamline flow. At point along the pipe, where the cross-sectional area is $A_1$, the velocity of water is $V_1$ and the pressure is $P_1$. What is the pressure of water at another point where the cross-sectional area is $A_2$?", "image": null}, "options": [{"id": "ryJhP", "label": "A", "text": "$P_1 - \\dfrac{\\varrho V_2^2}{2A_1^2}(A_2^2 - A_1^2)$", "isCorrect": false, "image": null}, {"id": "6BFmy", "label": "B", "text": "$P_1 + \\dfrac{\\varrho V_1^2}{2A_2^2}(A_2^2 - A_1^2)$", "isCorrect": true, "image": null}, {"id": "bU4t9", "label": "C", "text": "$P_1\\varrho V_1^2(A_1^2 - A_2^2)$", "isCorrect": false, "image": null}, {"id": "CaL8a", "label": "D", "text": "$P/\\varrho V_1^2 A_2^2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using the equation of continuity:<br><br>$A_1 V_1 = A_2 V_2 \\Rightarrow V_2 = \\dfrac{A_1 V_1}{A_2}$<br><br>Using Bernoulli's theorem for a horizontal pipe:<br><br>$P_1 + \\dfrac{1}{2}\\varrho V_1^2 = P_2 + \\dfrac{1}{2}\\varrho V_2^2$<br><br>$P_2 = P_1 + \\dfrac{1}{2}\\varrho (V_1^2 - V_2^2)$<br><br>Substituting the value of $V_2$:<br><br>$P_2 = P_1 + \\dfrac{1}{2}\\varrho \\left(V_1^2 - \\dfrac{A_1^2 V_1^2}{A_2^2}\\right)$<br><br>$P_2 = P_1 + \\dfrac{\\varrho V_1^2}{2A_2^2}(A_2^2 - A_1^2)$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3308c30a4553e1be121", "type": "singleCorrect", "question": {"text": "A closed pipe containing liquid showed a pressure $P_1$ by gauge. When the valve was opened, pressure was reduced to $P_2$. The speed of water flowing out of the pipe is ($\\varrho$=density of water)", "image": null}, "options": [{"id": "XmHdg", "label": "A", "text": "$\\left[\\dfrac{(P_1 - P_2)}{\\varrho}\\right]^{\\frac{1}{2}}$", "isCorrect": false, "image": null}, {"id": "69dm8", "label": "B", "text": "$\\left[\\dfrac{2(P_1 - P_2)}{\\varrho}\\right]^{\\frac{1}{2}}$", "isCorrect": true, "image": null}, {"id": "H9Lxg", "label": "C", "text": "$\\left[\\dfrac{(P_2 - P_1)}{\\varrho}\\right]^{\\frac{1}{2}}$", "isCorrect": false, "image": null}, {"id": "lm7IT", "label": "D", "text": "$\\left[\\dfrac{2(P_2 - P_1)}{\\varrho}\\right]^{\\frac{1}{2}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using Bernoulli's equation for horizontal flow:<br><br>$P_1 + \\dfrac{1}{2}\\varrho v_1^2 = P_2 + \\dfrac{1}{2}\\varrho v_2^2$<br><br>Initially, the valve is closed, so the velocity of water $v_1 = 0$.<br><br>When the valve is opened, the pressure becomes $P_2$ and the velocity becomes $v_2 = v$.<br><br>Substituting these values into the equation:<br><br>$P_1 + 0 = P_2 + \\dfrac{1}{2}\\varrho v^2$<br><br>$P_1 - P_2 = \\dfrac{1}{2}\\varrho v^2$<br><br>$v^2 = \\dfrac{2(P_1 - P_2)}{\\varrho}$<br><br>$v = \\left[\\dfrac{2(P_1 - P_2)}{\\varrho}\\right]^{\\dfrac{1}{2}}$<br><br>Answer: $\\left[\\dfrac{2(P_1 - P_2)}{\\varrho}\\right]^{\\frac{1}{2}}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3308c30a4553e1be11c", "type": "singleCorrect", "question": {"text": "Water flows through a horizontal pipe at a speed 'V'. Internal diameter of the pipe is 'd'. If the water is emerging at a speed '$V_1$' then the diameter of the nozzle is", "image": null}, "options": [{"id": "9R4mp", "label": "A", "text": "$\\text{d}\\sqrt{\\dfrac{\\text{V}}{\\text{V}_1}}$", "isCorrect": true, "image": null}, {"id": "EU3s3", "label": "B", "text": "$\\text{d}\\sqrt{\\dfrac{\\text{V}_1}{\\text{V}}}$", "isCorrect": false, "image": null}, {"id": "WdhIG", "label": "C", "text": "$\\dfrac{\\text{dV}}{\\text{V}_1}$", "isCorrect": false, "image": null}, {"id": "RTFGu", "label": "D", "text": "$\\dfrac{\\text{dV}_1}{\\text{V}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to the equation of continuity, the volume flow rate of an incompressible fluid remains constant throughout the pipe.<br><br>$A_1 V_1 = A_2 V_2$<br><br>Let the diameter of the nozzle be $d_1$. The cross-sectional area of the pipe is $A_1 = \\dfrac{\\pi d^2}{4}$ and the cross-sectional area of the nozzle is $A_2 = \\dfrac{\\pi d_1^2}{4}$.<br><br>Substituting the values into the equation of continuity:<br><br>$\\dfrac{\\pi d^2}{4} V = \\dfrac{\\pi d_1^2}{4} V_1$<br><br>$d^2 V = d_1^2 V_1$<br><br>$d_1^2 = d^2 \\dfrac{V}{V_1}$<br><br>$d_1 = d \\sqrt{\\dfrac{V}{V_1}}$<br><br>Answer: $\\text{d}\\sqrt{\\dfrac{\\text{V}}{\\text{V}_1}}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2978c30a4553e1bdaaf", "type": "singleCorrect", "question": {"text": "The surface of water in a water tank of cross-section area $750$ cm$^2$ on the top of a house is $h$ m above the tap level. The speed of water coming out through the tap of cross-section area $500$ mm$^2$ is $30$ cm/s. At that instant, $dh/dt$ is $y \\times 10^{-3}$ m/s. The value of $y$ will be", "image": null}, "options": [{"id": "BKB1n", "label": "A", "text": "$2$", "isCorrect": true, "image": null}, {"id": "41kjX", "label": "B", "text": "$3$", "isCorrect": false, "image": null}, {"id": "0UFHq", "label": "C", "text": "$4$", "isCorrect": false, "image": null}, {"id": "E3lI2", "label": "D", "text": "$5$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "By the equation of continuity, $A_1 v_1 = A_2 v_2$.<br><br>Here, $A_1 = 750 \\text{ cm}^2$, $A_2 = 500 \\text{ mm}^2 = 5 \\text{ cm}^2$, and $v_2 = 30 \\text{ cm/s}$.<br><br>Substituting the values, $750 \\times v_1 = 5 \\times 30$.<br><br>$v_1 = \\dfrac{150}{750} = 0.2 \\text{ cm/s}$.<br><br>Converting to m/s, $v_1 = 0.2 \\times 10^{-2} \\text{ m/s} = 2 \\times 10^{-3} \\text{ m/s}$.<br><br>Since $v_1 = \\dfrac{dh}{dt}$, we have $\\dfrac{dh}{dt} = 2 \\times 10^{-3} \\text{ m/s}$.<br><br>Comparing with $y \\times 10^{-3} \\text{ m/s}$, we get $y = 2$.<br><br>Answer: $2$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871beabf9280d7f9932d92", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers":
