e": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2622d0279619d9d8a3267", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "Eight small drops of mercury each of radius ' $r$ ', coalesce to form a large single drop. The ratio of total surface energy before and after the change is", "image": null}, "options": [{"id": "ZUGDB", "text": "$2: 1$", "image": null, "isCorrect": true}, {"id": "loT87", "text": "$1: 1$", "image": null, "isCorrect": false}, {"id": "sz8Rj", "text": "$1: 4$", "image": null, "isCorrect": false}, {"id": "yarp6", "text": "$1: 8$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $\\mathrm{R}$ be the radius of the coalesced drop.\n$$\n\\begin{aligned}\n\\therefore \\quad & \\frac{4}{3} \\pi R^3=8 \\times \\frac{4}{3} \\pi r^3 \\\\\n& R^3=8 \\pi r^3 \\\\\n& R=2 r\n\\end{aligned}\n$$\n\nSurface Energy $\\mathrm{E}=\\mathrm{T}$.dA\n$$\n\\begin{aligned}\n& E_1=8 \\times T \\times d A=8 \\times T \\times 4 \\pi r^2 \\\\\n& E_2=T \\times d A=T \\times 4 \\pi R^2\n\\end{aligned}\n$$\n\nWhere $E_1$ and $E_2$ are the surface energies before and after coalescing.\n\nDividing equation (i) by (ii),\n$$\n\\begin{aligned}\n& \\frac{\\mathrm{E}_1}{\\mathrm{E}_2}=\\frac{8 \\mathrm{r}^2}{\\mathrm{R}^2} \\\\\n& \\text { but } \\mathrm{R}=2 \\mathrm{r} \\\\\n& \\therefore \\quad \\frac{\\mathrm{E}_1}{\\mathrm{E}_2}=\\frac{8 \\mathrm{r}^2}{4 \\mathrm{r}^2}=\\frac{2}{1} \\\\\n&\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2621f0279619d9d8a31f9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "The excess pressure inside a first spherical drop of water is three times that of second spherical drop of water. Then the ratio of mass of first spherical drop to that of second spherical drop is", "image": null}, "options": [{"id": "GkBl6", "text": "$1: 3$", "image": null, "isCorrect": false}, {"id": "bIJvF", "text": "$1: 6$", "image": null, "isCorrect": false}, {"id": "GYtsz", "text": "$1: 9$", "image": null, "isCorrect": false}, {"id": "5rtjE", "text": "$1: 27$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Excess pressure inside the $1^{\\text {st }}$ spherical drop is given by,\n$$\n\\begin{aligned}\n\\mathrm{P}_1 & =\\frac{2 \\mathrm{~T}}{\\mathrm{r}_1} \\\\\n& \\text { Similarly, for } 2^{\\text {nd }} \\text { drop } \\\\\n\\mathrm{P}_2 & =\\frac{2 \\mathrm{~T}}{\\mathrm{r}_2} \\\\\n\\mathrm{P}_1 & =3 \\mathrm{P}_2 .......(Given)\\\\\n\\therefore \\quad \\frac{2 \\mathrm{~T}}{\\mathrm{r}_1} & =3\\left(\\frac{2 \\mathrm{~T}}{\\mathrm{r}_2}\\right) \\\\\n\\therefore \\quad \\frac{\\mathrm{r}_1}{\\mathrm{r}_2} & =\\frac{1}{3}\n\\end{aligned}\n$$\nNow, $\\frac{m_1}{m_2}=\\frac{V_1 \\rho_1}{V_2 \\rho_2}$\nAs both the drops are of water, $\\rho_1=\\rho_2$\n$$\n\\begin{aligned}\n& \\therefore \\quad \\frac{\\mathrm{m}_1}{\\mathrm{~m}_2}=\\frac{\\mathrm{V}_1}{\\mathrm{~V}_2} \\\\\n& \\therefore \\quad \\frac{\\mathrm{m}_1}{\\mathrm{~m}_2}=\\frac{4 / 3 \\pi_1^3}{4 / 3 \\mathrm{r}_2^3} \\\\\n& \\therefore \\quad \\frac{\\mathrm{m}_1}{\\mathrm{~m}_2}=\\frac{1}{27}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2621c0279619d9d8a31e1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "A spherical drop of liquid splits into 1000 identical spherical drops. If ' $\\mathrm{E}_1$ ' is the surface energy of the original drop and ' $\\mathrm{E}_2$ ' is the total surface energy of the resulting drops, then $\\frac{E_1}{E_2}=\\frac{x}{10}$. Then value of ' $x$ ' is", "image": null}, "options": [{"id": "sg35t", "text": "9", "image": null, "isCorrect": false}, {"id": "Kiatn", "text": "7", "image": null, "isCorrect": false}, {"id": "C92VO", "text": "3", "image": null, "isCorrect": false}, {"id": "R0ZHi", "text": "1", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{array}{ll} & r=\\text { Radius of small drop } \\\\ & R=\\text { Radius of bigger drop } \\\\ \\therefore \\quad & \\frac{4}{3} \\pi R^3=\\frac{4}{3} \\pi(1000) r^3 \\\\ \\therefore \\quad & R=10 r \\\\ & E_1=T_1^2=T\\left(4 \\pi R^2\\right) \\\\ & E_2=n A_2^2=1000 \\times T\\left(4 \\pi r^2\\right) \\\\ \\therefore \\quad & \\frac{E_1}{E_2}=\\frac{R^2}{1000 r^2}=\\frac{(10 r)^2}{1000 r^2} \\\\ \\therefore \\quad & \\frac{E_1}{E_2}=\\frac{1}{10} \\\\ \\therefore \\quad & x=1\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2621c0279619d9d8a31de", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "Consider a soap film on a rectangular frame of wire of area $3 \\times 3 \\mathrm{~cm}^2$. If the area of the soap film is increased to $5 \\times 5 \\mathrm{~cm}^2$, the work done in the process will be (surface tension of soap solution is $2.5 \\times 10^{-2} \\mathrm{~N} / \\mathrm{m}$ )", "image": null}, "options": [{"id": "Ao4Lq", "text": "$9 \\times 10^{-6} \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "mcjJb", "text": "$16 \\times 10^{-6} \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "Hn0qx", "text": "$40 \\times 10^{-6} \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "LncIQ", "text": "$80 \\times 10^{-6} \\mathrm{~J}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& A_1=9 \\times 10^{-4} \\mathrm{~m}^2, A_2=25 \\times 10^{-4} \\mathrm{~m}^2 \\\\\n& T=2.5 \\times 10^{-2} \\mathrm{~N} / \\mathrm{m}\n\\end{aligned}\n$$\nWork done,\n$$\n\\begin{aligned}\n& W=2 T \\Delta A=2 \\times 2.5 \\times 10^{-2} \\times(25-9) \\times 10^{-4} \\\\\n& W=80 \\times 10^{-6} \\mathrm{~J}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262080279619d9d8a3140", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "A liquid drop of radius ' $R$ ' is broken into ' $n$ ' identical small droplets. The work done is $[\\mathrm{T}=$ surface tension of the liquid]", "image": null}, "options": [{"id": "dob5c", "text": "$4 \\pi R^2\\left(n^{\\frac{2}{3}}-1\\right) T$", "image": null, "isCorrect": false}, {"id": "7NlIZ", "text": "$4 \\pi R^2\\left(n^{\\frac{1}{3}}-1\\right) T$", "image": null, "isCorrect": true}, {"id": "fjBE0", "text": "$4 \\pi R^2\\left(1-n^{\\frac{1}{3}}\\right) T$", "image": null, "isCorrect": false}, {"id": "xineq", "text": "$4 \\pi R^2\\left(1-n^{\\frac{2}{3}}\\right) T$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Volume of $\\mathrm{n}$ smaller droplets $=$ Volume of bigger drop\n$\\begin{aligned}\n& \\mathrm{n} \\frac{4}{3} \\pi \\mathrm{r}^3=\\frac{4}{3} \\pi \\mathrm{R}^3 \\\\\n& \\therefore \\quad \\mathrm{R}=\\mathrm{n}^{\\frac{1}{3}} \\cdot \\mathrm{r} \\\\\n& \\mathrm{r}=\\frac{\\mathrm{R}}{\\mathrm{n}^{\\frac{1}{3}}}\n\\end{aligned}$\n$\\begin{aligned} \\text { Work done } W & =\\left[n \\cdot 4 \\pi r^2-4 \\pi R^2\\right] T \\\\ & =4 \\pi\\left[n \\cdot \\frac{R^2}{n^{\\frac{2}{3}}}-R^2\\right] T \\\\ & =4 \\pi R^2\\left[n^{\\frac{1}{3}}-1\\right] T\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261f50279619d9d8a30b0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "A spherical liquid drop of radius $\\mathrm{R}$ is divided into 8 equal droplets. If surface tension is $\\mathrm{S}$, then the work done in this process will be", "image": null}, "options": [{"id": "3seTD", "text": "$2 \\pi R^2 S$", "image": null, "isCorrect": false}, {"id": "9iOBA", "text": "$3 \\pi R^2 S$", "image": null, "isCorrect": false}, {"id": "vJMIP", "text": "$4 \\pi R^2 S$", "image": null, "isCorrect": true}, {"id": "hERi8", "text": "$2 \\pi \\mathrm{RS}^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Work done, $\\mathrm{W}=\\mathrm{S} \\times \\Delta \\mathrm{A}$\nWhere, $\\Delta \\mathrm{A}$ is a change in surface area. Since, the radius of the big drop be $\\mathrm{R}$ $\\mathrm{A}_{\\text {initial }}=4 \\pi \\mathrm{R}^2$\n\nLet the radius of the small drops be $\\mathrm{r}$ $\\mathrm{A}_{\\text {final }}=8 \\times 4 \\pi \\mathrm{r}^2$\n\nThe volume is constant\n$$\n\\begin{array}{ll}\n\\therefore & \\frac{4}{3} \\pi \\mathrm{R}^3=8 \\times \\frac{4}{3} \\pi \\mathrm{r}^3 \\\\\n\\therefore & \\mathrm{R}^3=8 \\mathrm{r}^3 \\\\\n\\therefore & \\mathrm{R}=2 \\mathrm{r}\n\\end{array}\n$$\n\nSubstituting the values in the formula.\n$$\n\\begin{aligned}\n& \\mathrm{W}=\\mathrm{S} \\times \\Delta \\mathrm{A} \\\\\n& \\mathrm{W}=\\mathrm{S}\\left(\\mathrm{A}_{\\text {final }}-\\mathrm{A}_{\\text {initial }}\\right)\n\\end{aligned}\n$$\n$\\begin{aligned} & \\mathrm{W}=\\mathrm{S}\\left(8 \\times 4 \\pi \\mathrm{r}^2-4 \\pi \\mathrm{R}^2\\right) \\\\ & \\mathrm{W}=\\mathrm{S}\\left(32 \\pi\\left(\\frac{\\mathrm{R}}{2}\\right)^2-4 \\pi \\mathrm{R}^2\\right) \\\\ & \\mathrm{W}=\\mathrm{S}\\left(8 \\pi \\mathrm{R}^2-4 \\pi \\mathrm{R}^2\\right) \\\\ & \\mathrm{W}=4 \\pi \\mathrm{R}^2 \\mathrm{~S}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261f40279619d9d8a30a3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "Two capillary tubes of the same diameter are kept vertically in two different liquids whose densities are in the ratio $4: 3$. The rise of liquid in two capillaries is ' $h_1$ ' and ' $h h_2$ ' respectively. If the surface tensions of liquids are in the ratio $6: 5$, the ratio of heights $\\left(\\frac{h_1}{h_2}\\right)$ is\n(Assume that their angles of contact are same)", "image": null}, "options": [{"id": "Z8cOY", "text": "$0.4$", "image": null, "isCorrect": false}, {"id": "HoFrW", "text": "$0.5$", "image": null, "isCorrect": false}, {"id": "z4Ftl", "text": "$0.8$", "image": null, "isCorrect": false}, {"id": "H0HGk", "text": "$0.9$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given: Density ratio: $\\frac{\\rho_1}{\\rho_2}=\\frac{4}{3}$ and surface tension ratio: $\\frac{\\mathrm{T}_1}{\\mathrm{~T}_2}=\\frac{6}{5}$\n$\\therefore \\quad$ Rise of liquid in a capillary:\n$$\n\\mathrm{h}=\\frac{2 \\mathrm{~T} \\cos \\theta}{\\mathrm{r} \\rho \\mathrm{g}}\n$$\n\nFor constant $\\theta, \\mathrm{r}$ and $\\mathrm{g}$,\n$$\n\\begin{aligned}\n\\mathrm{h} & \\propto \\frac{\\mathrm{T}}{\\rho} \\\\\n\\therefore \\quad & \\frac{\\mathrm{h}_1}{\\mathrm{~h}_2}=\\frac{\\mathrm{T}_1 \\rho_2}{\\mathrm{~T}_2 \\rho_1}=\\frac{6 \\times 3}{5 \\times 4}=0.9\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261e20279619d9d8a3019", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "At critical temperature, the surface tension of liquid is", "image": null}, "options": [{"id": "NujHN", "text": "zero", "image": null, "isCorrect": true}, {"id": "3WsZi", "text": "infinity", "image": null, "isCorrect": false}, {"id": "tMqRj", "text": "unity", "image": null, "isCorrect": false}, {"id": "9UA78", "text": "same as that at any other temperature", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Std.12|Ch-2|Subtopic-2.4", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261d10279619d9d8a2f93", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "Three liquids have same surface tension and densities $\\rho_1, \\rho_2$, and $\\rho_3\\left(\\rho_1>\\rho_2>\\rho_3\\right)$. In three identical capillaries rise of liquid is same. The corresponding angles of contact $\\theta_1, \\theta_2$ and $\\theta_3$ are related as", "image": null}, "options": [{"id": "9Xzgh", "text": "$\\theta_1>\\theta_2>\\theta_3$", "image": null, "isCorrect": false}, {"id": "8pUcu", "text": "$\\theta_1>\\theta_3>\\theta_2$", "image": null, "isCorrect": false}, {"id": "FUcW1", "text": "$\\theta_1 < \\theta_2 < \\theta_3$", "image": null, "isCorrect": true}, {"id": "FkUuY", "text": "$\\theta_1=\\theta_2=\\theta_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Rise in capillary tube,\n$\\mathrm{h}=\\frac{2 \\mathrm{~T} \\cos \\theta}{\\mathrm{rpg}}$\nGiven that, $\\mathrm{h}, \\mathrm{T}, \\mathrm{r}$ and $\\mathrm{g}$ are constant.\n$\\begin{array}{ll}\n\\therefore \\quad & \\frac{\\cos \\theta}{\\rho}=\\text { constant } \\\\\n& \\text { i.e., } \\frac{\\cos \\theta_1}{\\rho_1}=\\frac{\\cos \\theta_2}{\\rho_2}=\\frac{\\cos \\theta_3}{\\rho_3} \\\\\n& \\text { as } \\rho_1>\\rho_2>\\rho_3 \\\\\n& \\cos \\theta_1>\\cos \\theta_2>\\cos \\theta_3 \\\\\n\\therefore \\quad & \\theta_1 < \\theta_2 < \\theta_3\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261ba0279619d9d8a2ee0", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "A film of soap solution is formed between two straight parallel wires of length $10 \\mathrm{~cm}$ each separated by $0.5 \\mathrm{~cm}$. If their separation is increased by $1 \\mathrm{~mm}$ while still maintaining their parallelism. How much work will have to be done?\n(surface tension of solution $=65 \\times 10^{-2} \\mathrm{~N} / \\mathrm{m}$ )", "image": null}, "options": [{"id": "e0k3D", "text": "$7.22 \\times 10^{-6} \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "3aIUR", "text": "$13.0 \\times 10^{-5} \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "FeRp1", "text": "$2.88 \\times 10^{-5} \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "W1qCl", "text": "$5.76 \\times 10^{-5} \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The increase in surface area of the film is, $\\Delta \\mathrm{A}=\\mathrm{A}_2-\\mathrm{A}_1$\n$\\mathrm{A}_1=2 \\times l \\times \\mathrm{b}=2 \\times 10 \\times 10^{-2} \\times 0.5 \\times 10^{-2}$\n$\\mathrm{A}_2=2 \\times l \\times(\\mathrm{b}+1)=2 \\times 10 \\times 10^{-2} \\times(0.5+0.1)$\n$\\times 10^{-2}$\n$A_2-A_1=\\left[2 \\times 10 \\times 10^{-2} \\times(0.5+0.1) \\times 10^{-2}\\right]$\n$-\\left[2 \\times 10 \\times 10^{-2} \\times 0.5 \\times 10^{-2}\\right]$\n$=2 \\times 10^{-4} \\mathrm{~m}^2$\n$\\therefore \\quad$ Work done $=$ Increase in surface energy\n$=\\mathrm{TdA}$\n$=\\left(65 \\times 10^{-2}\\right) \\times\\left(2 \\times 10^{-4}\\right)$\n$=1.3 \\times 10^{-4}$\n$=13 \\times 10^{-5} \\mathrm{~J}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261ac0279619d9d8a2e69", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "The excess of pressure in a first soap bubble is three times that of other soap bubble. Then the ratio of the volume of first bubble to other is", "image": null}, "options": [{"id": "25EWd", "text": "$1:3$", "image": null, "isCorrect": false}, {"id": "HYA3h", "text": "$1:9$", "image": null, "isCorrect": false}, {"id": "pE2jl", "text": "$27:1$", "image": null, "isCorrect": false}, {"id": "hV2oX", "text": "$1:27$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\quad \\Delta \\mathrm{P} \\propto \\frac{1}{\\mathrm{r}} \\Rightarrow \\frac{\\mathrm{r}_1}{\\mathrm{r}_2}=\\frac{\\Delta \\mathrm{P}_2}{\\Delta \\mathrm{P}_1}=\\frac{1}{3} \\\\ & \\therefore \\quad \\frac{\\mathrm{V}_1}{\\mathrm{~V}_2}=\\left(\\frac{\\mathrm{r}_1}{\\mathrm{r}_2}\\right)^3=\\frac{1}{27}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261990279619d9d8a2ddc", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "The radii of two mercury drops are $R_1$ and $R_2$. Under isothermal conditions, a single drop of radius $R$ is formed from them. The relations between $R, R_1$ and $R_2$ is", "image": null}, "options": [{"id": "M88ID", "text": "$R^2=R_1^2+R_2^2$", "image": null, "isCorrect": false}, {"id": "VEegO", "text": "$R=R_1+R_2$", "image": null, "isCorrect": false}, {"id": "r7tLd", "text": "$R=\\frac{R_1+R_2}{2}$", "image": null, "isCorrect": false}, {"id": "yHTdi", "text": "$R^3=R_1^3+R_2^3$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Total volume remains same,\n$\\begin{aligned}\n& \\frac{4}{3} \\pi R^3=\\frac{4}{3} \\pi R_1^3+\\frac{4}{3} \\pi R_2^3 \\\\\n& R^3=R_1^3+R_2^3\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261950279619d9d8a2db7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "The work done in blowing a soap bubble of radius $R$ is $W_1$ and that of radius $2 R$ is $W_2$. The ratio of $W_1$ to $W_2$ is", "image": null}, "options": [{"id": "wXhiU", "text": "1:4", "image": null, "isCorrect": true}, {"id": "6m5Rk", "text": "4:1", "image": null, "isCorrect": false}, {"id": "CpZsO", "text": "2:1", "image": null, "isCorrect": false}, {"id": "tae0O", "text": "1:2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & W_1=2\\left[4 \\pi r^2 T\\right] \\\\ & W_2=2\\left[4 \\pi(2 r)^2 T\\right] \\\\ & \\Rightarrow \\frac{W_1}{W_2}=\\frac{1}{4}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261850279619d9d8a2d41", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "The work done in blowing a soap bubble of radius $R$ is $W_1$ at room temperature. Now the soap solution is heated. From the heated solution another soap bubble of radius $2 R$ is blown and the work done is $W_2$. Then", "image": null}, "options": [{"id": "XxPAU", "text": "$W_2=0$", "image": null, "isCorrect": false}, {"id": "JlA6G", "text": "$W_2=4 W_1$", "image": null, "isCorrect": false}, {"id": "3SWbM", "text": "$W_2<4 W_1$", "image": null, "isCorrect": true}, {"id": "l5O2u", "text": "$W_2=W_1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The work done in forming a soap in forming a soap bubble of radius $r$ is $W_1=8 \\pi r^2 T_1$, where $T_1$ is the surface tension at room temperature and the work done to form a soap bubble of radius $2 r$ is\n$\\therefore \\frac{W_2}{W_1}=\\frac{328 \\pi r^2 T_2}{8 \\pi r^2 T_1}=\\frac{4 T_2}{T_1}$\nIf $T_1=T_2$, then $W_2=4 W_1$\nBut it is given that the solution is heated. As the temperature is increased, the surface tension of the soap solution is decreases\n$\\therefore T_2<T_1 \\quad \\therefore W_2<4 W_1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261850279619d9d8a2d3e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "The excess pressure inside a soap bubble of radius $2 \\mathrm{~cm}$ is 50 dyne $/ \\mathrm{cm}^2$. The surface tension is", "image": null}, "options": [{"id": "0uiO7", "text": "25 dyne $/ \\mathrm{cm}$", "image": null, "isCorrect": true}, {"id": "FynUb", "text": "60 dyne/ cm", "image": null, "isCorrect": false}, {"id": "yW4U9", "text": "50 dyne $/ \\mathrm{cm}$", "image": null, "isCorrect": false}, {"id": "yExrq", "text": "75 dyne/ cm", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given,\nExcess pressure, $\\Delta P=50$ dyne $/ \\mathrm{cm}^2$\nRadius, $r=2 \\mathrm{~cm}$\nFor a soap bubble liquid-air interface is crossed two times, so we have,\nExcess pressure, $\\Delta P=\\frac{4 T}{r}$, where $\\mathrm{T}$ is the surface tension.\n$\\therefore T=\\frac{\\Delta P \\times r}{4}=\\frac{50 \\mathrm{dyne} / \\mathrm{cm}^2 \\times 2 \\mathrm{~cm}}{4}=25 \\mathrm{dyne} / \\mathrm{cm}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261820279619d9d8a2d22", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "A steel coin of thickness $d$ and density $\\rho$ is floating on water of surface tension $T$. The radius of the coin $R$ is [ $g$ = acceleration due to gravity]", "image": null}, "options": [{"id": "79ihJ", "text": "$\\frac{4 T}{3 \\rho g d}$", "image": null, "isCorrect": false}, {"id": "68DNa", "text": "$\\frac{T}{\\rho g d}$", "image": null, "isCorrect": false}, {"id": "iAOPI", "text": "$\\frac{2 T}{\\rho g d}$", "image": null, "isCorrect": true}, {"id": "HHFEl", "text": "$\\frac{3 T}{4 \\rho g d}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Considering, contact angle is zero, and liquid loves the surface. The weight of the coin is balanced by surface tension.\n$\\begin{aligned} & F=T(2 \\pi R)=\\rho\\left(d \\pi R^2\\right) g \\\\ & \\Rightarrow R=\\frac{2 T}{\\rho g d}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261700279619d9d8a2c92", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "A square wire frame of each side $L$ is dipped in soap solution. On taking out, a membrane is formed. If the surface tension of solution is $T$, the force acting on the frame will be", "image": null}, "options": [{"id": "jHtrL", "text": "$8 T L$", "image": null, "isCorrect": true}, {"id": "tvylq", "text": "$10 T L$", "image": null, "isCorrect": false}, {"id": "xCWH2", "text": "$2 T L$", "image": null, "isCorrect": false}, {"id": "UB7Ga", "text": "$54 T L$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The perimeter of square is $4 L$. So, including both sides, the total length will be $8 L$.\nIf $T$ is surface tension (force per unit length) then the total force will be $8 T L$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261700279619d9d8a2c8f", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "Water rises up to a height $h$ in a capillary tube immersed vertically in water. When this whole arrangement is taken to a depth $d$ in a mine, the water level rises up to a height $h^{\\prime}$. If $R$ is the radius of the earth, then the ratio $\\frac{h}{h^{\\prime}}$ is", "image": null}, "options": [{"id": "2TXts", "text": "$1+\\frac{d}{R}$", "image": null, "isCorrect": false}, {"id": "rk1bZ", "text": "$1-\\frac{d}{R}$", "image": null, "isCorrect": true}, {"id": "utXog", "text": "$\\frac{R+d}{R-d}$", "image": null, "isCorrect": false}, {"id": "3Tsfq", "text": "$\\frac{R-d}{R+d}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "On the surface of the earth $T=\\frac{r h \\rho g}{2}$ for water\n$\\therefore h=\\frac{2 T}{r \\rho g}$\nAt a depth $d$, the value of acceleration due to gravity changes to\n$g^{\\prime}=g\\left(1-\\frac{d}{R}\\right)$, therefore\n$g^{\\prime}=g\\left(1-\\frac{d}{R}\\right)$, therefore\n$$\n\\begin{aligned}\n& h^{\\prime}=\\frac{2 T}{r \\rho g^{\\prime} d}=\\frac{2 T}{r \\rho g\\left(1-\\frac{d}{R}\\right)} \\\\\n& \\therefore \\frac{h}{h^{\\prime}}=\\frac{2 T}{r \\rho g} \\times \\frac{r \\rho g\\left(1-\\frac{d}{R}\\right)}{2 T}=1-\\frac{d}{R}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261600279619d9d8a2c11", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "Due to surface tension, the excess pressure inside a smaller drop is 9 units. If 27 smaller drops of same liquid combine then the excess pressure inside the bigger drop is", "image": null}, "options": [{"id": "4Svfa", "text": "18 units", "image": null, "isCorrect": false}, {"id": "nrv3g", "text": "9 units", "image": null, "isCorrect": false}, {"id": "l8OWC", "text": "6 units", "image": null, "isCorrect": false}, {"id": "CtVfL", "text": "3 units", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/C-2mx4VbouzCAIcgL0OwXqVZJ4d4vrk4QeHfyBAkf3I.original.fullsize.png\"><br>\nExcess pressure Or Pressure jump $=2\\left(\\frac{\\sigma}{r}\\right)=9$ units\nIf 27 such drops combine, total volume is: $\\mathrm{V}_{\\mathrm{B}}=27 \\mathrm{~V}_{\\mathrm{S}}$\nUsing volume conservation:\n$\\begin{aligned}\n& \\frac{4}{3} \\pi \\mathrm{R}^3=27\\left(\\frac{4}{3} \\pi \\mathrm{R}^3\\right) \\\\\n& \\Rightarrow \\mathrm{R}=(3 \\mathrm{r}) \\\\\n& \\therefore \\text { Excess pressure }=\\frac{2 \\sigma}{\\mathrm{R}}=\\frac{2 \\sigma}{3 \\mathrm{r}}=3 \\text { units }\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2615d0279619d9d8a2bf7", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "Two glass plates of area $10^{-2} \\mathrm{~m}^2$ have $10 \\mathrm{~cm}$ thick water film between them. The surface tension of water is $70 \\times 10^{-3} \\mathrm{~N} / \\mathrm{m}$. The force required to separate two glass plates from each other is", "image": null}, "options": [{"id": "APRiq", "text": "14 N", "image": null, "isCorrect": true}, {"id": "pdXSP", "text": "17 N", "image": null, "isCorrect": false}, {"id": "UIfmx", "text": "28 N", "image": null, "isCorrect": false}, {"id": "r77SV", "text": "30 N", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Consider complete wetting.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/GnVKDK1Z-nZFJPBZwpgmEsaZJlN6hxVcKcypfklZQR4.original.fullsize.png\"><br>\nThe Laplace pressure jump is given by:\n$\\begin{aligned}\n& \\Delta P=\\frac{\\sigma}{\\left(\\frac{h}{2}\\right)}=\\frac{F}{A} \\\\\n& \\Rightarrow F=\\frac{A \\sigma}{\\frac{h}{2}}=\\frac{10^{-2} \\times 70 \\times 10^{-3}}{5 \\times 10^{-2}} N=28 \\mathrm{~N}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2614c0279619d9d8a2b69", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "A certain number of spherical liquid drops of radius $r$ coalesce to form a single drop of radius $R$ and volume $V$. If $T$ is the surface tension of the liquid, which one of the following statements is true for the energy $(E)$ in the process?", "image": null}, "options": [{"id": "zl9w1", "text": "$E=3 V T\\left[\\frac{1}{r}-\\frac{1}{R}\\right]$ is absorbed.", "image": null, "isCorrect": false}, {"id": "GzxUA", "text": "$E=4 V T\\left[\\frac{1}{r}-\\frac{1}{R}\\right]$ is released.", "image": null, "isCorrect": false}, {"id": "h7Kib", "text": "$E=3 V T\\left[\\frac{1}{r}-\\frac{1}{R}\\right]$ is released.", "image": null, "isCorrect": true}, {"id": "tmJNC", "text": "$E=4 V T\\left[\\frac{1}{r}-\\frac{1}{R}\\right]$ is absorbed.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Change in surface energy is given by\n$E=T(\\Delta A) \\quad---(1)$\nThe initial area is given by,\n$\\mathrm{A}=\\left(4 \\pi r^2\\right) n$\nThe final area is given by,\n$\\mathrm{a}=4 \\pi R^2$\nTherefore, the change in area is given by,\n$\\begin{aligned}\n& \\Delta A=a-A \\\\\n& \\Rightarrow \\Delta A=4 \\pi\\left(n r^2-R^2\\right)---(2)\n\\end{aligned}$\nNow, using volume conservation: $\\left(\\frac{4}{3} \\pi r^2\\right) n=\\frac{4}{3} R^3$\n$\\therefore n=\\frac{R^3}{r^3} \\quad---(3)$\n$\\Delta A=4 \\pi\\left[\\frac{R^3}{r^3} \\cdot r^2-R^2\\right]=4 \\pi\\left[\\frac{R^3}{r}-\\frac{R^3}{R}\\right]=\\left(\\frac{4}{3} \\pi R^3\\right) 3\\left[\\frac{1}{r}-\\frac{1}{R}\\right]=3 V\\left[\\frac{1}{r}-\\frac{1}{R}\\right]$\nIntroducing above value in equation (1)\n$E=3 V T\\left[\\frac{1}{r}-\\frac{1}{R}\\right]$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2613d0279619d9d8a2aed", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "The amount of work done in blowing a sops bubble such that its diameter increases from ' $d$ ' to $\\mathrm{D}$ ' is ( $\\mathrm{T}$ = surface tension of solution )", "image": null}, "options": [{"id": "puPJY", "text": "$4 \\pi\\left(D^2-d^2\\right) T$", "image": null, "isCorrect": false}, {"id": "6FWGX", "text": "$8 \\pi\\left(D^2-d^2\\right) T$", "image": null, "isCorrect": false}, {"id": "nIDck", "text": "$\\pi\\left(D^2-d^2\\right) T$", "image": null, "isCorrect": false}, {"id": "FItOx", "text": "$2 \\pi\\left(D^2-d^2\\right) T$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Change in surface area\n$\\begin{aligned} & =2 \\times 4 \\pi\\left[\\left(\\frac{\\mathrm{D}}{2}\\right)^2-\\left(\\frac{\\mathrm{d}}{2}\\right)^2\\right]=2 \\pi\\left(\\mathrm{D}^2-\\mathrm{d}^2\\right) \\\\ & \\therefore \\text { Work done }=\\text { surface tension } \\times \\text { change in area } \\\\ & =2 \\pi\\left(\\mathrm{D}^2-\\mathrm{d}^2\\right) \\mathrm{T}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2613a0279619d9d8a2ad7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "Water rises in a capillary tube of radius ' $r$ ' upto height ' $h$ ' The mass of water in the capillary is ' $m$ ' The mass of water will rise in a capillary of radius will $\\frac{r}{4}$ be", "image": null}, "options": [{"id": "GzEND", "text": "$4 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "fPO1s", "text": "$\\frac{\\mathrm{m}}{4}$", "image": null, "isCorrect": true}, {"id": "wawCY", "text": "$\\mathrm{m}$", "image": null, "isCorrect": false}, {"id": "xF5mt", "text": "$\\frac{4}{\\mathrm{~m}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The height of water column in a capillary tube is given by\n$\\mathrm{h}=\\frac{2 \\mathrm{~T} \\cos \\theta}{\\mathrm{perg}}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/0yEijc0JxXPTTmiOyHS3zj_y30W8LjtNo4xHhurbKDM.original.fullsize.png\">\nFrom eqs. (i) and (ii), we get\n$\\begin{aligned} & m \\propto r^2 \\times \\frac{1}{r} \\\\ & m \\propto r \\\\ & \\Rightarrow \\frac{m^{\\prime}}{m}=\\frac{\\frac{r}{4}}{r} \\Rightarrow m^{\\prime}=\\frac{m}{4}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2612a0279619d9d8a2a58", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "In capillary tube having area of cross-section ' $\\mathrm{A}$ ', water rises to a height ' $h$ '. If cross sectional area is reduced to $\\frac{A}{9}$, the rise of water in the capillary tube is", "image": null}, "options": [{"id": "ryDk5", "text": "$\\mathrm{h}$", "image": null, "isCorrect": false}, {"id": "LM5Vh", "text": "$4 h$", "image": null, "isCorrect": false}, {"id": "T1FQ9", "text": "$3 \\mathrm{~h}$", "image": null, "isCorrect": true}, {"id": "GuZsR", "text": "$2 \\mathrm{~h}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{h}=\\frac{2 \\mathrm{~T} \\cos \\theta}{\\mathrm{r \\rho g}} \\\\ & \\Rightarrow \\mathrm{h} \\propto \\frac{1}{\\mathrm{r}}\\end{aligned}$\nAnd $\\mathrm{A}=\\pi \\mathrm{r}^2 \\Rightarrow \\mathrm{r} \\propto \\sqrt{\\mathrm{A}}$\n$\\Rightarrow \\mathrm{h} \\propto \\frac{1}{\\sqrt{\\mathrm{A}}}$\nNow, $\\frac{h_2}{h_1}=\\sqrt{\\frac{A_1}{A_2}}$\n$\\begin{aligned} & \\Rightarrow \\frac{h_2}{h}=\\sqrt{\\frac{A}{A / 9}}=3 \\\\ & \\Rightarrow h_2=3 h\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2612a0279619d9d8a2a52", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "A square frame of each side ' $L$ ' is dipped in a soap solution and taken out. The force acting on the film formed is $(\\mathrm{T}=$ surface tension of soap solution)", "image": null}, "options": [{"id": "xR4GB", "text": "8TL", "image": null, "isCorrect": true}, {"id": "j5GdB", "text": "2TL", "image": null, "isCorrect": false}, {"id": "z6hN0", "text": "4TL", "image": null, "isCorrect": false}, {"id": "sTquS", "text": "$6 \\mathrm{TL}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Soap film has two surfaces.\nNet force acting on frame $=2$ (force on one surface)\n$\\begin{aligned} & =2 \\times \\mathrm{T} \\times \\text { (perimeter) } \\\\ & =2 \\times \\mathrm{T} \\times 4 \\mathrm{~L}\\end{aligned}$\nNet force acting on the square frame $=8 \\mathrm{TL}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261260279619d9d8a2a35", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "A water drop of radius ' $r$ ' and volume ' $\\mathrm{V}$ ' is kept in between the two identical glass plates such that it forms a thin layer of area ' $\\mathrm{A}$ ' between the plates. A force ' $\\mathrm{F}$ ' is applied such that the two plates separate from each other. The surface tension ' $\\mathrm{T}$ ' of the liquid is", "image": null}, "options": [{"id": "CtCm9", "text": "$\\frac{F V}{2 A^2}$", "image": null, "isCorrect": true}, {"id": "bZqUN", "text": "$\\frac{\\mathrm{A}^2}{\\mathrm{FV}}$", "image": null, "isCorrect": false}, {"id": "5DsZR", "text": "$\\frac{\\mathrm{AV}}{\\mathrm{F}^2}$", "image": null, "isCorrect": false}, {"id": "dBNJp", "text": "$\\frac{\\mathrm{FV}}{4 \\mathrm{~A}^2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Consider complete wetting.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/6RhJrpL_YgBJx-B7QT1QhKLUfH3AE4d66jccdIKTWLE.original.fullsize.png\">\nThe Laplace pressure jump is given by:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/wfJqDxYn5jVb3eNPq7VkPs9WlpDTCDkQdIqidoJKSL0.original.fullsize.png\">\nOn plugging into equation (1), $\\frac{\\mathrm{T}}{\\left(\\frac{\\mathrm{V}}{2 \\mathrm{~A}}\\right)}=\\frac{\\mathrm{F}}{\\mathrm{A}}$\n$$\n\\therefore \\mathrm{T}=\\frac{\\mathrm{FV}}{2 \\mathrm{~A}^2}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261180279619d9d8a29c4", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}], "question": {"text": "Two narrow tube of diameters $d_1$ and $d_2$ are joined together to form a Utube open at both ends. If U-tube contains water, the difference in water levels in the limbs is\n( $T$ is the surface tension of water, angle of contact is zero and density of water is $\\rho, g$ is the acceleration due to gravity)", "image": null}, "options": [{"id": "Tf5EK", "text": "$\\frac{4 T}{\\rho g}\\left[\\frac{d_2-d_1}{d_1 d_2}\\right]$", "image": null, "isCorrect": true}, {"id": "LnMGB", "text": "$\\frac{4 T}{\\rho g}\\left[\\frac{d_1 d_2}{d_1+d_2}\\right]$", "image": null, "isCorrect": false}, {"id": "GZLFU", "text": "$\\frac{2 T}{\\rho g}\\left[\\frac{d_2-d_1}{d_1 d_2}\\right]$", "image": null, "isCorrect": false}, {"id": "hStn4", "text": "$\\frac{2 T}{\\rho g}\\left[\\frac{d_1+d_2}{d_1 d_2}\\right]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Consider the situation below:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/6AyWgicTzu6JfNn2hf6eObMGMB26XVYwgytiNn3Gnh4.original.fullsize.png\">\nWhen angle of contact is zero degree, the radius of meniscus equals the radius of tube.\nExcess pressure in the first tube $P_1=\\frac{4 T}{d_1}$\nExcess pressure in the second tube, $P_2=\\frac{4 T}{d_2}$\nHence, the pressure difference in the two limbs of the tube is given by,\n$\\Delta P=P_1-P_2=h \\rho g$\n$\\Rightarrow h=\\frac{P_1-P_2}{\\rho g}=\\frac{4 T}{\\rho g}\\left(\\frac{1}{d_1}-\\frac{1}{d_2}\\right)=\\frac{4 T}{\\rho g}\\left[\\frac{d_2-d_1}{d_1 d_2}\\right]$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261060279619d9d8a2930", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "Two soap bubbles of radii $r_1$ and $r_2$ in vacuum coalesce under isothermal conditions. The resulting bubble has a radius equal to", "image": null}, "options": [{"id": "p100K", "text": "$\\sqrt{r_1^2+r_2^2}$", "image": null, "isCorrect": true}, {"id": "bQi54", "text": "$\\frac{r_1+r_2}{2}$", "image": null, "isCorrect": false}, {"id": "7TC0G", "text": "$r_1+r_2$", "image": null, "isCorrect": false}, {"id": "IOXmr", "text": "$\\frac{r_1 r_2}{r_1+r_2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In Iso-thermal process: $p V=\\mathrm{C}$. The pressure inside bubble is: $p \\propto 1 / r$ and volume is: $V \\propto r^3$.\n$\\therefore p V \\propto r^2$\nAnd $n=\\frac{p V}{R T}$, therefore number of moles of gas inside the bubble is proportional to the square of its radius\n$\\therefore n \\propto r^2$\nOn combining bubbles, the total number of moles is conserved: Therefore, $n_1+n_1=N$\n$\\therefore r_1^2+r_2^2=R^2$\nThe above result can also be obtained by total surface energy conservation:\n$2 \\times\\left(4 \\pi R^2\\right) \\sigma=2 \\times\\left(4 \\pi r_1^2\\right) \\sigma+2 \\times\\left(4 \\pi r_2^2\\right) \\sigma$\nor $R=\\sqrt{r_1^2+r_2^2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261010279619d9d8a2907", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "If the excess pressure inside a soap bubble of radius $3 \\mathrm{~mm}$ is equal to the pressure of a water column of height $0.8 \\mathrm{~cm}$, then the surface tension of the soap solution is ( $\\rho_{\\text {water }}=1000 \\mathrm{~kg} / \\mathrm{m}^3, g=9.8 \\mathrm{~m} / \\mathrm{s}^2$ )", "image": null}, "options": [{"id": "TsF4J", "text": "$0.588 \\times 10^{-3} \\mathrm{~N} / \\mathrm{m}$", "image": null, "isCorrect": false}, {"id": "CJBgI", "text": "$588 \\times 10^{-3} \\mathrm{~N} / \\mathrm{m}$", "image": null, "isCorrect": false}, {"id": "Rnc0d", "text": "$58.8 \\times 10^{-3} \\mathrm{~N} / \\mathrm{m}$", "image": null, "isCorrect": true}, {"id": "gQEd8", "text": "$5.88 \\times 10^{-3} \\mathrm{~N} / \\mathrm{m}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The excess pressure inside the bubble is given as, $P=\\frac{4 T}{r}$ as the soap bubble has two liquid-gas interfaces.\nThe pressure to height column of water is given as, $P=\\rho h g$\nSince the excess pressure inside the bubble is balanced by the height of the column and it can be written as,\n$\\frac{4 T}{r}=\\rho h g$\n$\\Rightarrow T=\\frac{r \\rho h g}{4}$\nOn plugging the given values:\n$T=\\frac{1}{4}\\left(3 \\times 10^{-3} \\mathrm{~m} \\times \\frac{10^3 \\mathrm{~kg}}{\\mathrm{~m}^3} \\times 8 \\times 10^{-3} \\mathrm{~m} \\times 9.8 \\frac{\\mathrm{m}}{\\mathrm{s}^2}\\right)=58.8 \\times 10^{-3} \\mathrm{~N} / \\mathrm{m}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260f30279619d9d8a289b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}], "question": {"text": "If a capillary tube of radius $1 \\mathrm{~mm}$ is immersed in water, the mass of water rising in the capillary tube is $\\mathrm{m}$. If the radius of the capillary tube is doubled, then the mass of water that rises in the same capillary tube will be", "image": null}, "options": [{"id": "yDmdx", "text": "$3 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "ZO3rs", "text": "$\\mathrm{m} / 2$", "image": null, "isCorrect": false}, {"id": "LqgPx", "text": "$\\mathrm{m}$", "image": null, "isCorrect": false}, {"id": "20qMO", "text": "$2 \\mathrm{~m}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For capillary rise, $h_1 r_1=h_2 r_2$\n$\\therefore \\frac{h_2}{h_1}=\\frac{r_1}{r_2}=\\frac{1}{2}$\nAnd $m=\\pi r^2 h_1 \\rho$ and $M=p(2 r)^2 \\times h_2 \\times \\rho$\n$\\begin{aligned} & \\therefore \\frac{M^{\\prime}}{M}=\\left(\\frac{2 r}{r}\\right)^2 \\times\\left(\\frac{1}{2}\\right)=4 \\times \\frac{1}{2}=2 \\\\ & \\therefore M=2 \\mathrm{~m}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260f20279619d9d8a2893", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}], "question": {"text": "The surface tension of a soap solution is ' $\\mathrm{T}$ '. Work done in blowing a soap bubble of diameter $2 \\mathrm{~d}$ is", "image": null}, "options": [{"id": "1Ge4H", "text": "$8 \\pi d^2 T$", "image": null, "isCorrect": true}, {"id": "wWdZQ", "text": "$2 \\pi d^2 T$", "image": null, "isCorrect": false}, {"id": "JHB6b", "text": "$4 \\pi d^2 T$", "image": null, "isCorrect": false}, {"id": "Tjfkn", "text": "$6 \\pi d^2 T$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In this case, work done = increase in surface energy, i.e.\n$\\mathrm{W}=\\mathrm{T} \\Delta \\mathrm{A}$\nKey point: In calculation, area of sphere have been multiplied with 2, since there are two surfaces in soap bubble.\n$\\begin{aligned} & \\therefore \\mathrm{W}=\\mathrm{T} \\times\\left[2\\left(4 \\pi \\mathrm{d}^2\\right)\\right] \\\\ & \\Rightarrow \\mathrm{W}=8 \\pi \\mathrm{d}^2 \\mathrm{~T}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260e10279619d9d8a2807", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}], "question": {"text": "A liquid drop having surface energy ' $E$ ' is spread into 216 droplets of the same size. The final surface energy of the droplets is", "image": null}, "options": [{"id": "SpVvZ", "text": "$3 E$", "image": null, "isCorrect": false}, {"id": "jC5st", "text": "$8 \\mathrm{E}$", "image": null, "isCorrect": false}, {"id": "NZtcw", "text": "$2 E$", "image": null, "isCorrect": false}, {"id": "nxZYO", "text": "$6 \\mathrm{E}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The correct option is (D).\nConcept: Surface Energy is proportional to the surface area $\\mathrm{E} \\propto 4 \\pi R^2$.\nConsidering volume conservation, the size of small droplets $r$ is:\n$V=\\frac{4}{3} \\pi R^3=216 \\times \\frac{4}{3} \\pi r^3$\nTherefore, $\\mathrm{R}=6 \\mathrm{r}$\nThe total surface area of the new 216 droplets is:\n$216 \\times\\left(4 \\pi r^2\\right)$\nor $6 \\times\\left(4 \\pi R^2\\right)$\nGiven $E \\propto 4 \\pi R^2$\nTherefore, the total surface energy of the new droplets would be $6 \\mathrm{E}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260df0279619d9d8a27fb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}], "question": {"text": "Which one of the following statements is 'NOT' True about the angle of contact of a liquid?", "image": null}, "options": [{"id": "fhWVX", "text": "Any increase in the temperature of the liquid does not decrease its angle of contact.", "image": null, "isCorrect": true}, {"id": "im5fc", "text": "If an impurity is added in the liquid then it's angle of contact changes.", "image": null, "isCorrect": false}, {"id": "bjGPw", "text": "Angle of contact depends upon the nature of liquid and solid in contact.", "image": null, "isCorrect": false}, {"id": "LSywG", "text": "At a given temperature, the angle of contact is constant for a solid-liquid surface.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The correct option is (A).\nConcept: Contact angle decreases with the increasing temperature.\nAddition of impurity decreases the surface tension of liquid.\nContact angle depends on the nature of liquid and solid in contact.\nTherefore, answer (A) is the only \"NOT\" true statement.\nConcept based question.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260cd0279619d9d8a276b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "If the work done in blowing a soap bubble of volume ' $\\mathrm{V}$ ' is ' $\\mathrm{W}$ ', then the work done in blowing a soap bubble of volume ' $2 \\mathrm{~V}$ ' will be", "image": null}, "options": [{"id": "EugYo", "text": "$2 \\mathrm{~W}$", "image": null, "isCorrect": false}, {"id": "lawBW", "text": "$4^{1 / 3} \\mathrm{~W}$", "image": null, "isCorrect": true}, {"id": "TMTPX", "text": "W", "image": null, "isCorrect": false}, {"id": "VWpNP", "text": "$\\sqrt{2} \\mathrm{~W}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If $\\mathrm{V}$ is the volume then we have\n$\\begin{aligned}\n& \\mathrm{V}=\\frac{4}{3} \\pi \\mathrm{r}^3 \\\\\n& \\mathrm{~V} \\propto \\mathrm{r}^3 \\\\\n& \\therefore \\frac{\\mathrm{V}_2}{\\mathrm{~V}_1}=\\left(\\frac{\\mathrm{r}_2}{\\mathrm{r}_1}\\right)^3 \\\\\n& \\frac{\\mathrm{r}_2}{\\mathrm{r}_1}=\\left(\\frac{\\mathrm{V}_2}{\\mathrm{~V}_1}\\right)^{1 / 3}=(2)^{1 / 3} \\\\\n& \\mathrm{~W}_1=8 \\pi \\mathrm{r}_1^2 \\cdot \\mathrm{T} \\text { and } \\mathrm{W}_2=8 \\pi \\mathrm{r}_2^2 \\mathrm{~T} \\\\\n& \\therefore \\frac{\\mathrm{W}_2}{\\mathrm{~W}_1}=\\left(\\frac{\\mathrm{r}_2}{\\mathrm{r}_1}\\right)^2=(2)^{2 / 3}=(4)^{1 / 3} \\\\\n& \\mathrm{~W}_2=(4)^{1 / 3} \\mathrm{~W}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260c80279619d9d8a2748", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "Pressure inside two soap bubbles is $1.01 \\mathrm{~atm}$ and $1.03 \\mathrm{~atm}$. The ratio between their volumes is (Pressure outside the soap bubble is $1 \\mathrm{~atm}$ )", "image": null}, "options": [{"id": "j04fd", "text": "9:1", "image": null, "isCorrect": false}, {"id": "gQbwZ", "text": "27:1", "image": null, "isCorrect": true}, {"id": "Ad6pJ", "text": "81:1", "image": null, "isCorrect": false}, {"id": "MJMAp", "text": "3:1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Excess pressure inside a soap bubble is given by\n$\\Delta \\mathrm{P}=\\mathrm{P}_{\\mathrm{i}}-\\mathrm{P}_0=\\frac{4 \\mathrm{~T}}{\\mathrm{r}}$\n$\\begin{aligned} & \\Delta \\mathrm{P}_1=1.01 \\mathrm{~atm}-1 \\mathrm{~atm}=0.01 \\mathrm{~atm} \\\\ & \\Delta \\mathrm{P}_2=1.03 \\mathrm{~atm}-1 \\mathrm{~atm}=0.03 \\mathrm{~atm}\\end{aligned}$\n$\\begin{aligned} & \\therefore \\frac{\\Delta \\mathrm{P}_1}{\\Delta \\mathrm{P}_2}=\\frac{\\mathrm{r}_2}{\\mathrm{r}_1} \\\\ & \\frac{0.03}{0.01}=3=\\frac{\\mathrm{r}_2}{\\mathrm{r}_1} \\\\ & \\frac{\\mathrm{V}_2}{\\mathrm{~V}_1}=\\left(\\frac{\\mathrm{r}_2}{\\mathrm{r}_1}\\right)^3=(3)^3=27\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260ba0279619d9d8a26d1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "An ice cube of edge $1 \\mathrm{~cm}$ melts in a gravity free container. The approximate surface area of water formed is (water is in the form of spherical drop)", "image": null}, "options": [{"id": "XXkkX", "text": "$(36 \\pi)^{1 / 3} \\mathrm{~cm}^2$", "image": null, "isCorrect": true}, {"id": "d8idw", "text": "$(24 \\pi)^{1 / 3} \\mathrm{~cm}^2$", "image": null, "isCorrect": false}, {"id": "UC0tx", "text": "$(28 \\pi)^{1 / 3} \\mathrm{~cm}^2$", "image": null, "isCorrect": false}, {"id": "WrPr0", "text": "$(12 \\pi)^{1 / 3} \\mathrm{~cm}^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\mathrm{x}=1 \\mathrm{~cm}\n$$\n$\\therefore$ Volume of the cube $\\mathrm{v}=\\mathrm{x}^3=1 \\mathrm{~cm}^3$, volume of drop $=$ volume of cube.\n$$\n\\begin{aligned}\n& \\frac{4}{3} \\pi r^3=x^3=1 \\mathrm{~cm}^3 \\\\\n& \\therefore r^3=\\frac{3}{4 \\pi} \\text { or } r=\\left(\\frac{3}{4 \\pi}\\right)^{\\frac{1}{3}} \\\\\n& \\therefore r^2=\\left(\\frac{9}{16 \\pi^2}\\right)^{\\frac{1}{3}}\n\\end{aligned}\n$$\nSurface area of drop $=4 \\pi r^2=4 \\pi\\left(\\frac{9}{16 \\pi^2}\\right)^{\\frac{1}{3}}$\n$$\n=\\left(64 \\pi^3 \\times \\frac{9}{16 \\pi^2}\\right)^{\\frac{1}{3}}=(36 \\pi)^{\\frac{1}{3}}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260b90279619d9d8a26c7", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "A glass rod of radius ' $r$ ' ' is inserted symmetrically into a vertical capillary tube of radius ' $\\mathrm{r}_2$ ' $\\left(\\mathrm{r}_1 < \\mathrm{r}_2\\right)$ such that their lower ends are at same level. The arrangement is dipped in water. The height to which water will rise into the tube will be ( $\\rho=$ density of water, $\\mathrm{T}=$ surface tension in water, $\\mathrm{g}$ = acceleration due to gravity)", "image": null}, "options": [{"id": "vwZB3", "text": "$\\frac{2 \\mathrm{~T}}{\\left(\\mathrm{r}_2-\\mathrm{r}_1\\right) \\rho g}$", "image": null, "isCorrect": true}, {"id": "5bCwB", "text": "$\\frac{\\mathrm{T}}{\\left(\\mathrm{r}_2^2-\\mathrm{r}_1^2\\right) \\rho g}$", "image": null, "isCorrect": false}, {"id": "sN8HW", "text": "$\\frac{\\mathrm{T}}{\\left(\\mathrm{r}_2-\\mathrm{r}_1\\right) \\rho \\mathrm{g}}$", "image": null, "isCorrect": false}, {"id": "adb5X", "text": "$\\frac{2 \\mathrm{~T}}{\\left(\\mathrm{r}_2^2-\\mathrm{r}_1^2\\right) \\rho g}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Vertical component of total force of surface tension\n$$\n\\mathrm{F}=\\left(\\mathrm{r}_2+\\mathrm{r}_1\\right) 2 \\pi \\mathrm{T} \\cos \\theta\n$$\nWeight of the liquid in the capillary\n$$\n\\mathrm{W}=\\pi\\left(\\mathrm{r}_2^2-\\mathrm{r}_1^2\\right) \\mathrm{h} \\rho \\mathrm{g}\n$$\nThis is balanced by the vertical component of the face due to the surface tension\n$$\n\\therefore \\pi\\left(\\mathrm{r}_2^2-\\mathrm{r}_1^2\\right) \\mathrm{h} \\rho \\mathrm{g}=\\left(\\mathrm{r}_2+\\mathrm{r}_1\\right) \\times 2 \\pi \\mathrm{T} \\cos \\theta\n$$\nSimplifying and solving for $\\mathrm{h}$ we get,\n$$\n\\mathrm{h}=\\frac{2 \\mathrm{~T} \\cos \\theta}{\\left(\\mathrm{r}_2-\\mathrm{r}_1\\right) \\rho g}=\\frac{2 \\mathrm{~T}}{\\left(\\mathrm{r}_2-\\mathrm{r}_1\\right) \\rho g}\n$$\n(For pure water, $\\theta=0^{\\circ}, \\cos \\theta=1$ )", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260b60279619d9d8a26b5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "Water rises up to a height of $4 \\mathrm{~cm}$ in a capillary tube. The lower end of the capillary tube is at a depth of $8 \\mathrm{~cm}$ below the water level. The mouth pressure required to blow an air bubble at the lower end of the capillary will be ' $\\mathrm{X}$ ' $\\mathrm{cm}$ of water, where $\\mathrm{X}$ is equal to", "image": null}, "options": [{"id": "dlimt", "text": "10", "image": null, "isCorrect": false}, {"id": "QCHUw", "text": "8", "image": null, "isCorrect": false}, {"id": "MUmNA", "text": "6", "image": null, "isCorrect": false}, {"id": "knoRS", "text": "12", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "At the lower ends of the tube, the total pressure is due to height of water column in the container plus the height of water in the capillary.\n$\\therefore$ Total pressure is due to $8+4=12 \\mathrm{~cm}$ of water.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260a50279619d9d8a2630", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "Work done in increasing the size of a soap bubble from radius of $3 \\mathrm{~cm}$ to $5 \\mathrm{~cm}$ in millijoule is nearly (surface tension of soap solution $=0.03 \\mathrm{Nm}^{-1}$ )", "image": null}, "options": [{"id": "k7XGK", "text": "$0.4 \\pi$", "image": null, "isCorrect": true}, {"id": "TgZGw", "text": "$0.2 \\pi$", "image": null, "isCorrect": false}, {"id": "aJxhS", "text": "$4 \\pi$", "image": null, "isCorrect": false}, {"id": "wAsY1", "text": "$2 \\pi$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{w}=8 \\pi \\mathrm{T}\\left(\\mathrm{r}_2^2-\\mathrm{r}_1^2\\right) \\\\ & =8 \\pi \\times 0.03(25-9) \\times 10^{-4} \\\\ & =0.384 \\pi \\times 10^{-3} \\mathrm{~J} \\\\ & =0.384 \\pi \\mathrm{mJ} \\approx 0.4 \\pi \\mathrm{mJ}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260a40279619d9d8a262a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "Water rises to a height of $2 \\mathrm{~cm}$ in a capillary tube. If crosssectional area of the tube is reduced to $\\frac{1}{16}^{\\text {th }}$ of initial area, then water will rise to a height of", "image": null}, "options": [{"id": "JC6UW", "text": "$4 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "KZ47X", "text": "$8 \\mathrm{~cm}$", "image": null, "isCorrect": true}, {"id": "J0Kmn", "text": "$12 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "IytcN", "text": "$16 \\mathrm{~cm}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{h}=\\frac{2 \\mathrm{~T} \\cos \\theta}{\\mathrm{r} \\rho \\mathrm{g}} \\\\ & \\therefore \\frac{\\mathrm{h}_2}{\\mathrm{~h}_1}=\\frac{\\mathrm{r}_1}{\\mathrm{r}_2} \\\\ & \\text { Area } \\mathrm{A}=\\pi \\mathrm{r}^2 \\therefore \\mathrm{A} \\propto \\mathrm{r}^2 \\\\ & \\therefore \\frac{\\mathrm{A}_1}{\\mathrm{~A}_2}=\\frac{\\mathrm{r}_1^2}{\\mathrm{r}_2^2} \\text { or } \\frac{\\mathrm{r}_1}{\\mathrm{r}_2}=\\sqrt{\\frac{\\mathrm{A}_1}{\\mathrm{~A}_2}}=\\sqrt{16} \\\\ & \\frac{\\mathrm{r}_1}{\\mathrm{r}_2}=4 \\\\ & \\therefore \\frac{\\mathrm{h}_2}{\\mathrm{~h}_1}=4 \\text { or } \\mathrm{h}_2=4 \\mathrm{~h}_1=4 \\times 2=8 \\mathrm{~cm}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260940279619d9d8a25a7", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "A thin metal disc of radius ' $r$ ' floats on water surface and bends the surface downwards along the perimeter making an angle ' $\\theta$ ' with the vertical edge of the disc. If the weight of water displaced by the disc is $\\mathrm{W}$, the weight of the metal disc is [ $\\mathrm{T}=$ surface tension of water $]$", "image": null}, "options": [{"id": "fLhVI", "text": "$2 \\pi \\mathrm{r} \\cos \\theta+\\mathrm{W}$", "image": null, "isCorrect": true}, {"id": "izlsb", "text": "$\\mathrm{W}-2 \\pi \\mathrm{rT} \\cos \\theta$", "image": null, "isCorrect": false}, {"id": "XwDRg", "text": "$2 \\pi r \\mathrm{~T}+\\mathrm{W}$", "image": null, "isCorrect": false}, {"id": "Sn2kM", "text": "$2 \\pi \\mathrm{rT} \\cos \\theta-\\mathrm{W}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The weight of the disc is balanced by the force due to the surface tension and the upthrust of water.\nThe component of surface tension in vertically upward direction is $\\mathrm{T} \\cos \\theta$ and the force acting due to it $2 \\pi \\mathrm{r} \\mathrm{T} \\cos \\theta$.\nThe upthrust is equal to the weight of the water displaced (W).\n$\\therefore$ Weight of the disc $=2 \\pi \\mathrm{rT} \\cos \\theta+\\mathrm{W}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260930279619d9d8a259b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "The work done in blowing a soap bubble of volume ' $\\mathrm{V}$ ' is ' $\\mathrm{W}$ '. The work required to blow a soap bubble of volume ' $2 \\mathrm{~V}$ ' is [ $\\mathrm{T}=$ surface tension of soap solution $]$", "image": null}, "options": [{"id": "HEXzP", "text": "$2^{2 / 3} \\mathrm{~W}$", "image": null, "isCorrect": true}, {"id": "vxEuz", "text": "2W", "image": null, "isCorrect": false}, {"id": "t3J9n", "text": "W", "image": null, "isCorrect": false}, {"id": "ioVJz", "text": "$2^{1 / 2} \\mathrm{~W}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{V}=\\frac{4}{3} \\pi \\mathrm{r}^3 \\text { or } \\quad \\mathrm{r}=\\left(\\frac{3 \\mathrm{~V}}{4 \\pi}\\right)^{1 / 3} \\\\ & \\mathrm{~W}=8 \\pi \\mathrm{r}^2 \\mathrm{~T}=8 \\pi\\left(\\frac{3 \\mathrm{~V}}{4 \\pi}\\right)^{2 / 3} \\mathrm{~T} \\\\ & \\mathrm{~W} \\propto \\mathrm{V}^{2 / 3} \\\\ & \\frac{\\mathrm{W}^{\\prime}}{\\mathrm{W}}=\\left(\\frac{2 \\mathrm{~V}}{\\mathrm{~V}}\\right)^{2 / 3}=2^{2 / 3}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260800279619d9d8a2501", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift
