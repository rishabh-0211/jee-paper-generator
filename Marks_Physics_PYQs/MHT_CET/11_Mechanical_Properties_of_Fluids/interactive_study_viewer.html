wire does not sink in water is<br>[$T$ = surface tension of water, $g$ = gravitational acceleration]", "image": null}, "options": [{"id": "7PtKu", "label": "A", "text": "$\\sqrt{\\dfrac{2dg}{\\pi T}}$", "isCorrect": false, "image": null}, {"id": "S9wFK", "label": "B", "text": "$\\sqrt{\\dfrac{2T}{\\pi dg}}$", "isCorrect": true, "image": null}, {"id": "7qhOK", "label": "C", "text": "$\\sqrt{\\dfrac{\\pi dg}{2T}}$", "isCorrect": false, "image": null}, {"id": "KTywA", "label": "D", "text": "$\\sqrt{\\dfrac{T}{\\pi dg}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the maximum radius of the wire be $r$.<br><br>The weight of the metal wire acting downwards is given by:<br><br>$W = \\text{Volume} \\times \\text{density} \\times g = (\\pi r^2 L) d g$<br><br>The maximum upward force due to surface tension acts along the entire length of the wire on both sides. This occurs when the liquid surface becomes vertical at the points of contact.<br><br>$F = 2 T L$<br><br>For the wire to just float and not sink, the upward surface tension force must balance the downward weight of the wire:<br><br>$W = F$<br><br>$\\pi r^2 L d g = 2 T L$<br><br>$\\pi r^2 d g = 2 T$<br><br>$r^2 = \\dfrac{2 T}{\\pi d g}$<br><br>$r = \\sqrt{\\dfrac{2 T}{\\pi d g}}$<br><br>Answer: $\\sqrt{\\dfrac{2T}{\\pi dg}}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883c15a9fc0fc8c141c6", "type": "singleCorrect", "question": {"text": "Under isothermal conditions, a single drop of radius $R$ is formed from two mercury drops of radii $R_1$ and $R_2$. After combination, the relation between $R$, $R_1$ and $R_2$ is", "image": null}, "options": [{"id": "WKqKK", "label": "A", "text": "$R = \\dfrac{R_1 + R_2}{2}$", "isCorrect": false, "image": null}, {"id": "YQ9Cd", "label": "B", "text": "$R^3 = R_1^3 + R_2^3$", "isCorrect": true, "image": null}, {"id": "wxgwB", "label": "C", "text": "$R^2 = R_1^2 + R_2^2$", "isCorrect": false, "image": null}, {"id": "Sm6Gm", "label": "D", "text": "$R = R_1 + R_2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Since mercury is an incompressible liquid, the total mass and density remain constant under isothermal conditions. Thus, the total volume of the drops is conserved.<br><br>Volume of the new drop = Sum of volumes of the two original drops<br><br>$\\dfrac{4}{3}\\pi R^3 = \\dfrac{4}{3}\\pi R_1^3 + \\dfrac{4}{3}\\pi R_2^3$<br><br>$R^3 = R_1^3 + R_2^3$<br><br>Answer: $R^3 = R_1^3 + R_2^3$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884e15a9fc0fc8c1426e", "type": "singleCorrect", "question": {"text": "A capillary tube is taken from the earth to the surface of the moon. The rise of the liquid column on the moon (acceleration due to gravity on earth is $6$ times that of the moon) is", "image": null}, "options": [{"id": "h5Qrw", "label": "A", "text": "$6$ times that of earth's surface", "isCorrect": true, "image": null}, {"id": "TA6MX", "label": "B", "text": "$\\dfrac{1}{6}$ that on the earth's surface", "isCorrect": false, "image": null}, {"id": "cQnTB", "label": "C", "text": "equal to that on the earth's surface", "isCorrect": false, "image": null}, {"id": "jJ7hb", "label": "D", "text": "zero", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The height of the liquid column in a capillary tube is given by Jurin's law:<br><br>$h = \\dfrac{2T \\cos \\theta}{r \\rho g}$<br><br>where $T$ is the surface tension, $\\theta$ is the angle of contact, $r$ is the radius of the capillary tube, $\\rho$ is the density of the liquid, and $g$ is the acceleration due to gravity.<br><br>Since $T$, $\\theta$, $r$, and $\\rho$ remain constant, the capillary rise is inversely proportional to the acceleration due to gravity:<br><br>$h \\propto \\dfrac{1}{g}$<br><br>Given that the acceleration due to gravity on the earth is $6$ times that on the moon, we have $g_e = 6g_m$.<br><br>Therefore, the ratio of the capillary rise on the moon to that on the earth is:<br><br>$\\dfrac{h_m}{h_e} = \\dfrac{g_e}{g_m} = \\dfrac{6g_m}{g_m} = 6$<br><br>$h_m = 6h_e$<br><br>The rise of the liquid column on the moon is $6$ times that on the earth's surface.<br><br>Answer: $6$ times that of earth's surface", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884b15a9fc0fc8c14259", "type": "singleCorrect", "question": {"text": "Two water drops each of radius $r$ coalesce to form a big drop. If $T$ is the surface tension, the surface energy released in this process is $4\\pi r^2 T x$. The value of $x$ is", "image": null}, "options": [{"id": "o3Gfj", "label": "A", "text": "$\\left(2 - 2^{2/3}\\right)$", "isCorrect": true, "image": null}, {"id": "dTFpI", "label": "B", "text": "$\\left(2 - 2^{1/3}\\right)$", "isCorrect": false, "image": null}, {"id": "Ji1eS", "label": "C", "text": "$\\left(1 + \\sqrt{2}\\right)$", "isCorrect": false, "image": null}, {"id": "68A28", "label": "D", "text": "$\\left(\\sqrt{2} - 1\\right)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the radius of the big drop be $R$. Since the volume remains conserved during the process of coalescence:<br><br>$\\dfrac{4}{3} \\pi R^3 = 2 \\times \\dfrac{4}{3} \\pi r^3$<br><br>$R^3 = 2r^3 \\Rightarrow R = 2^{1/3}r$<br><br>The initial surface energy of the two drops is:<br><br>$U_i = 2 \\times (4 \\pi r^2 T) = 8 \\pi r^2 T$<br><br>The final surface energy of the big drop is:<br><br>$U_f = 4 \\pi R^2 T = 4 \\pi (2^{1/3}r)^2 T = 4 \\pi r^2 T (2^{2/3})$<br><br>The surface energy released in this process is:<br><br>$\\Delta U = U_i - U_f$<br><br>$\\Delta U = 8 \\pi r^2 T - 4 \\pi r^2 T (2^{2/3})$<br><br>$\\Delta U = 4 \\pi r^2 T (2 - 2^{2/3})$<br><br>Comparing this with the given expression $4 \\pi r^2 T x$, we get:<br><br>$x = 2 - 2^{2/3}$<br><br>Answer: $\\left(2 - 2^{2/3}\\right)$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88aa15a9fc0fc8c145d8", "type": "singleCorrect", "question": {"text": "A $20$ cm long capillary is dipped vertically in water. Water rises to $8$ cm. If the arrangement is put in a freely falling elevator, the length of water column in capillary tube will be", "image": null}, "options": [{"id": "nqcdi", "label": "A", "text": "$8\\ \\text{cm}$", "isCorrect": false, "image": null}, {"id": "o3yOJ", "label": "B", "text": "$10\\ \\text{cm}$", "isCorrect": false, "image": null}, {"id": "U6lt6", "label": "C", "text": "$4\\ \\text{cm}$", "isCorrect": false, "image": null}, {"id": "idNYa", "label": "D", "text": "$20\\ \\text{cm}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The height of capillary rise is given by $h = \\dfrac{2T \\cos \\theta}{\\rho g r}$.<br><br>In a freely falling elevator, the effective acceleration due to gravity is $g_{eff} = g - g = 0$.<br><br>Substituting $g_{eff} = 0$ in the formula gives a theoretical height $h \\rightarrow \\infty$.<br><br>Since the liquid cannot rise beyond the length of the capillary tube, it rises to the top and the radius of curvature of the meniscus adjusts itself to prevent overflow.<br><br>Therefore, the water column will occupy the entire length of the capillary tube.<br><br>The length of the capillary tube is $20\\ \\text{cm}$, so the length of the water column will be $20\\ \\text{cm}$.<br><br>Answer: $20\\ \\text{cm}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88aa15a9fc0fc8c145d6", "type": "singleCorrect", "question": {"text": "A water drop is divided into 8 equal droplets. The pressure difference between the inner and outer side of the big drop will be", "image": null}, "options": [{"id": "E9hER", "label": "A", "text": "same as for smaller droplet", "isCorrect": false, "image": null}, {"id": "nwc4s", "label": "B", "text": "half of that for smaller droplet", "isCorrect": true, "image": null}, {"id": "KExcZ", "label": "C", "text": "$\\left(\\dfrac{1}{4}\\right)^{th}$ of that for smaller droplet", "isCorrect": false, "image": null}, {"id": "HSHvQ", "label": "D", "text": "twice that for smaller droplet", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the radius of the big drop be $R$ and the radius of each smaller droplet be $r$.<br><br>Since the volume remains constant, we have:<br><br>$\\dfrac{4}{3}\\pi R^3 = 8 \\times \\dfrac{4}{3}\\pi r^3$<br><br>$R^3 = 8r^3 \\Rightarrow R = 2r$<br><br>The pressure difference between the inner and outer side of a drop of radius $R$ is given by $\\Delta P = \\dfrac{2T}{R}$, where $T$ is the surface tension.<br><br>For the big drop: $\\Delta P_{big} = \\dfrac{2T}{R}$<br><br>For the smaller droplet: $\\Delta P_{small} = \\dfrac{2T}{r}$<br><br>Substituting $R = 2r$ in the expression for the big drop:<br><br>$\\Delta P_{big} = \\dfrac{2T}{2r} = \\dfrac{1}{2} \\left(\\dfrac{2T}{r}\\right) = \\dfrac{1}{2} \\Delta P_{small}$<br><br>Thus, the pressure difference for the big drop is half of that for the smaller droplet.<br><br>Answer: half of that for smaller droplet", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886a15a9fc0fc8c14380", "type": "singleCorrect", "question": {"text": "In air, a charged soap bubble of radius R breaks in to 27 small soap bubbles of equal radii r. Then the ratio of mechanical force acting per unit area of big soap bubble to that of a small soap bubble is", "image": null}, "options": [{"id": "w6h3a", "label": "A", "text": "$\\dfrac{1}{81}$", "isCorrect": false, "image": null}, {"id": "z8ieY", "label": "B", "text": "$\\dfrac{3}{1}$", "isCorrect": false, "image": null}, {"id": "6JEBG", "label": "C", "text": "$\\dfrac{1}{3}$", "isCorrect": false, "image": null}, {"id": "zf4Ru", "label": "D", "text": "$\\dfrac{9}{1}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let the radius of the big soap bubble be $R$ and the radius of each small soap bubble be $r$.<br><br>Assuming the volume of the air inside is conserved:<br>$\\dfrac{4}{3}\\pi R^3 = 27 \\times \\dfrac{4}{3}\\pi r^3$<br>$R^3 = 27r^3 \\Rightarrow R = 3r$<br><br>By conservation of charge, the total charge $Q$ on the big bubble is distributed equally among the 27 small bubbles. Let $q$ be the charge on each small bubble:<br>$Q = 27q \\Rightarrow q = \\dfrac{Q}{27}$<br><br>The surface charge density of the big bubble is:<br>$\\sigma_1 = \\dfrac{Q}{4\\pi R^2}$<br><br>The surface charge density of each small bubble is:<br>$\\sigma_2 = \\dfrac{q}{4\\pi r^2} = \\dfrac{\\dfrac{Q}{27}}{4\\pi \\left(\\dfrac{R}{3}\\right)^2} = \\dfrac{Q}{27} \\times \\dfrac{9}{4\\pi R^2} = \\dfrac{1}{3} \\left(\\dfrac{Q}{4\\pi R^2}\\right) = \\dfrac{\\sigma_1}{3}$<br><br>The mechanical force acting per unit area (electrostatic pressure) on a charged surface is given by $f = \\dfrac{\\sigma^2}{2\\epsilon_0}$.<br><br>Therefore, the ratio of the mechanical force per unit area of the big bubble to that of the small bubble is:<br>$\\dfrac{f_1}{f_2} = \\left(\\dfrac{\\sigma_1}{\\sigma_2}\\right)^2 = \\left(\\dfrac{\\sigma_1}{\\dfrac{\\sigma_1}{3}}\\right)^2 = (3)^2 = \\dfrac{9}{1}$<br><br>Answer: $\\dfrac{9}{1}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886a15a9fc0fc8c1437f", "type": "singleCorrect", "question": {"text": "A frame made up of metallic wire enclosing a surface area A is covered with a soap film. If the area of the frame of metallic wire is reduced by 25% the energy of the soap film will be changed by", "image": null}, "options": [{"id": "8g7GZ", "label": "A", "text": "$100\\%$", "isCorrect": false, "image": null}, {"id": "Zdu8l", "label": "B", "text": "$75\\%$", "isCorrect": false, "image": null}, {"id": "H3dd0", "label": "C", "text": "$50\\%$", "isCorrect": false, "image": null}, {"id": "JJtSQ", "label": "D", "text": "$25\\%$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The initial surface energy of the soap film is $E_{1} = T \\times 2A$, where $T$ is the surface tension and $A$ is the area of the frame. The factor of $2$ accounts for the two free surfaces of the soap film.<br><br>When the area is reduced by $25\\%$, the new area becomes $A_{2} = A - 0.25A = 0.75A$.<br><br>The new surface energy is $E_{2} = T \\times 2A_{2} = T \\times 2(0.75A) = 0.75(T \\times 2A) = 0.75E_{1}$.<br><br>The change in energy is $\\Delta E = E_{1} - E_{2} = E_{1} - 0.75E_{1} = 0.25E_{1}$.<br><br>The percentage change in the energy of the soap film is $\\dfrac{\\Delta E}{E_{1}} \\times 100\\% = 0.25 \\times 100\\% = 25\\%$.<br><br>Answer: $25\\%$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886a15a9fc0fc8c1437e", "type": "singleCorrect", "question": {"text": "The excess pressure inside a spherical drop of water is four times that of another drop. Then, their respective mass ratio is", "image": null}, "options": [{"id": "3nSoU", "label": "A", "text": "$1:16$", "isCorrect": false, "image": null}, {"id": "cze9M", "label": "B", "text": "$8:1$", "isCorrect": false, "image": null}, {"id": "GKmq3", "label": "C", "text": "$1:4$", "isCorrect": false, "image": null}, {"id": "12lgF", "label": "D", "text": "$1:64$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The excess pressure inside a liquid drop is given by $\\Delta P = \\dfrac{2T}{R}$.<br><br>Given that $\\Delta P_1 = 4 \\Delta P_2$.<br><br>$\\dfrac{2T}{R_1} = 4 \\left( \\dfrac{2T}{R_2} \\right)$<br><br>$\\dfrac{R_1}{R_2} = \\dfrac{1}{4}$<br><br>The mass of a spherical drop is $M = \\dfrac{4}{3} \\pi R^3 \\rho$.<br><br>The ratio of their masses is $\\dfrac{M_1}{M_2} = \\left( \\dfrac{R_1}{R_2} \\right)^3 = \\left( \\dfrac{1}{4} \\right)^3 = \\dfrac{1}{64}$.<br><br>The respective mass ratio is $1:64$.<br><br>Answer: $1:64$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887a15a9fc0fc8c14416", "type": "singleCorrect", "question": {"text": "A drop of some liquid of volume $0.04\\,\\text{cm}^3$ is placed on the surface of the glass plate. Then another glass plate is placed on it such that the liquid forms a thin layer of area $20\\,\\text{cm}^2$ between the surfaces. To separate the plates a force of $16 \\times 10^5$ dyne has to be applied normal to the surfaces.<br>The surface tension of the liquid in dyne/cm is", "image": null}, "options": [{"id": "owjtP", "label": "A", "text": "$60$", "isCorrect": false, "image": null}, {"id": "UPiSr", "label": "B", "text": "$70$", "isCorrect": false, "image": null}, {"id": "NlEWl", "label": "C", "text": "$80$", "isCorrect": true, "image": null}, {"id": "jesFT", "label": "D", "text": "$90$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Volume of the liquid, $V = 0.04 \\text{ cm}^3$<br><br>Area of the layer, $A = 20 \\text{ cm}^2$<br><br>Thickness of the liquid layer, $t = \\dfrac{V}{A} = \\dfrac{0.04}{20} = 0.002 \\text{ cm}$<br><br>The force required to separate two glass plates with a thin liquid layer between them is given by:<br><br>$F = \\dfrac{2TA}{t}$<br><br>where $T$ is the surface tension of the liquid.<br><br>Substituting the given values:<br><br>$16 \\times 10^5 = \\dfrac{2 \\times T \\times 20}{0.002}$<br><br>$16 \\times 10^5 = 20000 T$<br><br>$T = \\dfrac{16 \\times 10^5}{2 \\times 10^4} = 80 \\text{ dyne/cm}$<br><br>Answer: $80$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887a15a9fc0fc8c14414", "type": "singleCorrect", "question": {"text": "Water rises up to a height $h$ in a capillary tube on the surface of the earth. The value of $h$ will increase, if the experimental set up is kept in ($g$ = acceleration due to gravity)", "image": null}, "options": [{"id": "mlao8", "label": "A", "text": "a lift going upward with a certain acceleration", "isCorrect": false, "image": null}, {"id": "4u7Hz", "label": "B", "text": "accelerating train", "isCorrect": false, "image": null}, {"id": "pIrtp", "label": "C", "text": "a satellite rotating close to earth", "isCorrect": false, "image": null}, {"id": "w2SVg", "label": "D", "text": "a lift going down with acceleration less than '$g$'", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The height of water in a capillary tube is given by the formula:<br><br>$h = \\dfrac{2T \\cos \\theta}{\\rho r g_{eff}}$<br><br>where $g_{eff}$ is the effective acceleration due to gravity.<br><br>For $h$ to increase, the value of $g_{eff}$ must decrease.<br><br>In a lift going upward with acceleration $a$, $g_{eff} = g + a > g$, so $h$ decreases.<br><br>In an accelerating train with acceleration $a$, $g_{eff} = \\sqrt{g^2 + a^2} > g$, so $h$ decreases.<br><br>In a satellite rotating close to earth, $g_{eff} = 0$. The water will rise to the full length of the tube, and the concept of a finite equilibrium height $h$ does not apply.<br><br>In a lift going down with acceleration $a < g$, $g_{eff} = g - a$. Since $g_{eff} < g$, the height $h$ will increase to a new finite equilibrium value.<br><br>Therefore, the value of $h$ increases when the setup is kept in a lift going down with acceleration less than $g$.<br><br>Answer: a lift going down with acceleration less than '$g$'", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888b15a9fc0fc8c144b5", "type": "singleCorrect", "question": {"text": "What is the radius of the biggest aluminium coin of thickness $t$ and density $\\rho$, which will be able to float on the water surface of surface tension $T$? ($g$ = acceleration due to gravity)", "image": null}, "options": [{"id": "jvWyX", "label": "A", "text": "$\\dfrac{4T}{3\\rho g t}$", "isCorrect": false, "image": null}, {"id": "22BIW", "label": "B", "text": "$\\dfrac{4T}{\\rho g t}$", "isCorrect": false, "image": null}, {"id": "cJ6SB", "label": "C", "text": "$\\dfrac{2T}{\\rho g t}$", "isCorrect": true, "image": null}, {"id": "8VbUd", "label": "D", "text": "$\\dfrac{T}{\\rho g t}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For the coin to float on the water surface, the maximum upward force due to surface tension must balance the downward weight of the coin.<br><br>The maximum upward force due to surface tension acts along the perimeter of the coin:<br>$F = T \\times 2\\pi r$<br><br>The weight of the coin is:<br>$W = mg = (\\pi r^2 t) \\rho g$<br><br>Equating the upward surface tension force and the downward weight:<br>$T \\times 2\\pi r = \\pi r^2 t \\rho g$<br><br>$2T = r t \\rho g$<br><br>$r = \\dfrac{2T}{\\rho g t}$<br><br>Answer: $\\dfrac{2T}{\\rho g t}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888b15a9fc0fc8c144b4", "type": "singleCorrect", "question": {"text": "The excess pressure inside a spherical drop of water is four times that of another drop. Their respective mass ratio is", "image": null}, "options": [{"id": "QsYDm", "label": "A", "text": "$1 : 16$", "isCorrect": false, "image": null}, {"id": "0JIA0", "label": "B", "text": "$8 : 1$", "isCorrect": false, "image": null}, {"id": "Djw5L", "label": "C", "text": "$1 : 4$", "isCorrect": false, "image": null}, {"id": "5Cnw1", "label": "D", "text": "$1 : 64$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The excess pressure inside a spherical drop of water is given by $\\Delta P = \\dfrac{2T}{R}$, where $T$ is the surface tension and $R$ is the radius of the drop.<br><br>Given that $\\Delta P_1 = 4\\Delta P_2$.<br><br>$\\dfrac{2T}{R_1} = 4\\left(\\dfrac{2T}{R_2}\\right)$<br><br>$\\dfrac{R_1}{R_2} = \\dfrac{1}{4}$<br><br>The mass of a spherical drop is $M = \\dfrac{4}{3}\\pi R^3 \\rho$, where $\\rho$ is the density of water.<br><br>The ratio of their masses is:<br><br>$\\dfrac{M_1}{M_2} = \\left(\\dfrac{R_1}{R_2}\\right)^3$<br><br>$\\dfrac{M_1}{M_2} = \\left(\\dfrac{1}{4}\\right)^3 = \\dfrac{1}{64}$<br><br>The respective mass ratio is $1 : 64$.<br><br>Answer: $1 : 64$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885c15a9fc0fc8c142f2", "type": "singleCorrect", "question": {"text": "When a big drop of water is formed from n small drops of water, the energy loss is 3E, where E is the energy of the big drop. If R is the radius of big drop and r is the radius of the smaller drop then number of smaller drops n is", "image": null}, "options": [{"id": "YKjhQ", "label": "A", "text": "$\\dfrac{4R}{r^2}$", "isCorrect": false, "image": null}, {"id": "hGZhg", "label": "B", "text": "$\\dfrac{4R}{r}$", "isCorrect": false, "image": null}, {"id": "ySQSm", "label": "C", "text": "$\\dfrac{2R^2}{r}$", "isCorrect": false, "image": null}, {"id": "fHr69", "label": "D", "text": "$\\dfrac{4R^2}{r^2}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let $T$ be the surface tension of water.<br><br>The surface energy of the big drop is:<br>$E = 4 \\pi R^2 T$<br><br>The total surface energy of $n$ small drops is:<br>$E_i = n \\times 4 \\pi r^2 T$<br><br>The energy loss during the formation of the big drop is given by:<br>$\\Delta E = E_i - E$<br><br>Given that the energy loss is $3E$:<br>$E_i - E = 3E$<br><br>$E_i = 4E$<br><br>Substituting the expressions for $E_i$ and $E$:<br>$n \\times 4 \\pi r^2 T = 4 \\times (4 \\pi R^2 T)$<br><br>$n r^2 = 4 R^2$<br><br>$n = \\dfrac{4R^2}{r^2}$<br><br>Answer: $\\dfrac{4R^2}{r^2}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885b15a9fc0fc8c142f1", "type": "singleCorrect", "question": {"text": "When one end of a capillary tube is dipped in water, water rises to a height h. The upward force of $105$ dyne due to surface tension is balanced by the force due to weight of water column. The inner circumference of the capillary is (surface tension of water = $7 \\times 10^{-2}$ N/m)", "image": null}, "options": [{"id": "h7F7z", "label": "A", "text": "$1.5$ cm", "isCorrect": true, "image": null}, {"id": "5XAsn", "label": "B", "text": "$2$ cm", "isCorrect": false, "image": null}, {"id": "hou6l", "label": "C", "text": "$2.5$ cm", "isCorrect": false, "image": null}, {"id": "39Oq2", "label": "D", "text": "$3$ cm", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The upward force due to surface tension in a capillary tube is given by $F = T \\times L \\times \\cos \\theta$, where $T$ is the surface tension, $L$ is the inner circumference, and $\\theta$ is the angle of contact.<br><br>For water, the angle of contact $\\theta \\approx 0^\\circ$, so $\\cos \\theta = 1$.<br><br>Given:<br>Upward force $F = 105$ dyne $= 105 \\times 10^{-5}$ N<br>Surface tension $T = 7 \\times 10^{-2}$ N/m<br><br>Substituting the values into the formula:<br>$105 \\times 10^{-5} = (7 \\times 10^{-2}) \\times L$<br><br>$L = \\dfrac{105 \\times 10^{-5}}{7 \\times 10^{-2}}$<br><br>$L = 15 \\times 10^{-3}$ m<br><br>$L = 1.5 \\times 10^{-2}$ m $= 1.5$ cm<br><br>Answer: $1.5$ cm", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88bd15a9fc0fc8c1468d", "type": "singleCorrect", "question": {"text": "The height of the liquid column raised in a capillary tube of certain radius when dipped in liquid $A$ vertically is $5$ cm. If the same tube is dipped in similar way in another liquid $B$ of surface tension and density double the values of liquid $A$, the height of liquid column raised in liquid $B$ is (Assume that angle of contact for both the liquids is almost same)", "image": null}, "options": [{"id": "ctlcn", "label": "A", "text": "$0.20$ m", "isCorrect": false, "image": null}, {"id": "oiDVv", "label": "B", "text": "$0.10$ m", "isCorrect": false, "image": null}, {"id": "5Wt9E", "label": "C", "text": "$0.05$ m", "isCorrect": true, "image": null}, {"id": "7pS3n", "label": "D", "text": "$0.50$ m", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The height of the liquid column in a capillary tube is given by $h = \\dfrac{2T \\cos \\theta}{r \\rho g}$<br><br>For liquid $A$, $h_A = \\dfrac{2T_A \\cos \\theta}{r \\rho_A g} = 5$ cm<br><br>For liquid $B$, the surface tension is $T_B = 2T_A$ and the density is $\\rho_B = 2\\rho_A$<br><br>The height of the liquid column for liquid $B$ is:<br><br>$h_B = \\dfrac{2T_B \\cos \\theta}{r \\rho_B g} = \\dfrac{2(2T_A) \\cos \\theta}{r (2\\rho_A) g} = \\dfrac{2T_A \\cos \\theta}{r \\rho_A g} = h_A$<br><br>$h_B = 5$ cm $= 0.05$ m<br><br>Answer: $0.05$ m", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb882b15a9fc0fc8c14130", "type": "singleCorrect", "question": {"text": "A rectangular film of liquid is expanded from ($6$ cm $\\times 5$ cm) to ($8$ cm $\\times 9$ cm). If the work done is $4\\times 10^{-4}$ J, the surface tension of the liquid is", "image": null}, "options": [{"id": "sIrJX", "label": "A", "text": "$0.04\\,\\dfrac{N}{m}$", "isCorrect": false, "image": null}, {"id": "GltFJ", "label": "B", "text": "$0.05\\,\\dfrac{N}{m}$", "isCorrect": true, "image": null}, {"id": "9qU6z", "label": "C", "text": "$0.06\\,\\dfrac{N}{m}$", "isCorrect": false, "image": null}, {"id": "M3JPD", "label": "D", "text": "$0.07\\,\\dfrac{N}{m}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Initial area of the film, $A_1 = 6 \\text{ cm} \\times 5 \\text{ cm} = 30 \\text{ cm}^2$<br><br>Final area of the film, $A_2 = 8 \\text{ cm} \\times 9 \\text{ cm} = 72 \\text{ cm}^2$<br><br>Change in area, $\\Delta A = A_2 - A_1 = 72 - 30 = 42 \\text{ cm}^2$<br><br>Since a liquid film has two free surfaces, the total increase in surface area is:<br><br>$\\Delta S = 2 \\times \\Delta A = 2 \\times 42 \\text{ cm}^2 = 84 \\text{ cm}^2 = 84 \\times 10^{-4} \\text{ m}^2$<br><br>The work done in expanding the film is given by:<br><br>$W = T \\times \\Delta S$<br><br>Substituting the given values:<br><br>$4 \\times 10^{-4} = T \\times 84 \\times 10^{-4}$<br><br>$T = \\dfrac{4}{84} = \\dfrac{1}{21} \\approx 0.0476 \\text{ N/m}$<br><br>Rounding to two decimal places, the surface tension is approximately $0.05 \\text{ N/m}$.<br><br>Answer: $0.05\\,\\dfrac{N}{m}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a78c30a4553e1bdb5c", "type": "singleCorrect", "question": {"text": "If we dip capillary tubes of different radii $r_n$ in water and the water rises to different heights $h_n$ in them, then ($n = 1, 2, 3$ .........)", "image": null}, "options": [{"id": "KLe0u", "label": "A", "text": "$\\dfrac{h_n}{r_n^2} = \\text{constant}$", "isCorrect": false, "image": null}, {"id": "oh58d", "label": "B", "text": "$\\dfrac{h_n}{r_n} = \\text{constant}$", "isCorrect": false, "image": null}, {"id": "FgOTu", "label": "C", "text": "$h_n r_n^2 = \\text{constant}$", "isCorrect": false, "image": null}, {"id": "DIXpP", "label": "D", "text": "$h_n r_n = \\text{constant}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The height $h$ of the liquid column in a capillary tube of radius $r$ is given by Jurin's law:<br><br>$h = \\dfrac{2T \\cos \\theta}{\\rho g r}$<br><br>For a given liquid and tube material, the surface tension $T$, angle of contact $\\theta$, density $\\rho$, and acceleration due to gravity $g$ are constants.<br><br>Therefore, $h \\propto \\dfrac{1}{r}$<br><br>$h r = \\text{constant}$<br><br>For different capillary tubes, $h_n r_n = \\text{constant}$.<br><br>Answer: $h_n r_n = \\text{constant}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d34d8c30a4553e1be24c", "type": "singleCorrect", "question": {"text": "If $450$ erg of work is done in blowing a soap bubble of radius '$r$', the additional work required to be done to blow it to a radius equal to $3r$ is", "image": null}, "options": [{"id": "LpTjP", "label": "A", "text": "$2400$ erg", "isCorrect": false, "image": null}, {"id": "Ime7b", "label": "B", "text": "$3000$ erg", "isCorrect": false, "image": null}, {"id": "ZMLMm", "label": "C", "text": "$3600$ erg", "isCorrect": true, "image": null}, {"id": "6FX34", "label": "D", "text": "$4000$ erg", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Work done in blowing a soap bubble of radius $r$ is<br><br>$W_1 = 2 \\times 4\\pi r^2 T = 8\\pi r^2 T$<br><br>Given $W_1 = 450$ erg.<br><br>Work done in blowing a soap bubble of radius $3r$ is<br><br>$W_2 = 2 \\times 4\\pi (3r)^2 T = 9 \\times 8\\pi r^2 T = 9 W_1$<br><br>The additional work required to blow it from radius $r$ to $3r$ is<br><br>$\\Delta W = W_2 - W_1 = 9 W_1 - W_1 = 8 W_1$<br><br>$\\Delta W = 8 \\times 450 = 3600$ erg<br><br>Answer: $3600$ erg", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d34d8c30a4553e1be24b", "type": "singleCorrect", "question": {"text": "The excess pressure inside a soap bubble of radius $2.5$ cm is $48$ dyne/cm$^2$. The surface tension of soap solution in dyne /cm is", "image": null}, "options": [{"id": "qqosx", "label": "A", "text": "$25$", "isCorrect": false, "image": null}, {"id": "QtKcW", "label": "B", "text": "$30$", "isCorrect": true, "image": null}, {"id": "HaTHP", "label": "C", "text": "$35$", "isCorrect": false, "image": null}, {"id": "hUMDD", "label": "D", "text": "$40$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The excess pressure inside a soap bubble is given by $\\Delta P = \\dfrac{4T}{R}$<br><br>where $T$ is the surface tension and $R$ is the radius of the bubble.<br><br>Given, $\\Delta P = 48$ dyne/cm$^2$ and $R = 2.5$ cm.<br><br>Substituting the values, we get:<br><br>$48 = \\dfrac{4T}{2.5}$<br><br>$T = \\dfrac{48 \\times 2.5}{4}$<br><br>$T = 12 \\times 2.5 = 30$ dyne/cm<br><br>Answer: $30$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3068c30a4553e1bdf5e", "type": "singleCorrect", "question": {"text": "A metal wire of length 'L' and density 'd' floats horizontally on the free surface of water. The maximum radius of the wire does not sink in water is<br>[ $T$ = surface tension of water , $g$ = gravitational acceleration]", "image": null}, "options": [{"id": "Nqxby", "label": "A", "text": "$\\sqrt{\\dfrac{2dg}{\\pi T}}$", "isCorrect": false, "image": null}, {"id": "AHKO0", "label": "B", "text": "$\\sqrt{\\dfrac{2T}{\\pi dg}}$", "isCorrect": true, "image": null}, {"id": "9ipPX", "label": "C", "text": "$\\sqrt{\\dfrac{\\pi dg}{2T}}$", "isCorrect": false, "image": null}, {"id": "dUTtg", "label": "D", "text": "$\\sqrt{\\dfrac{T}{\\pi dg}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Weight of the metal wire acting downwards is $W = \\pi r^2 L d g$<br><br>Maximum upward force due to surface tension is $F = 2 T L$<br><br>For the wire to float without sinking, the maximum upward force must balance the weight of the wire.<br><br>$2 T L = \\pi r^2 L d g$<br><br>$r^2 = \\dfrac{2 T}{\\pi d g}$<br><br>$r = \\sqrt{\\dfrac{2 T}{\\pi d g}}$<br><br>Answer: $\\sqrt{\\dfrac{2T}{\\pi dg}}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3068c30a4553e1bdf5d", "type": "singleCorrect", "question": {"text": "The energy needed for breaking a liquid drop of radius 'R' into 'n' droplets each of radius 'r' is<br>[ $T$ = surface tension of the liquid]", "image": null}, "options": [{"id": "5L6ul", "label": "A", "text": "$4\\pi T R^2 \\left[\\dfrac{R}{r} - 1\\right]$", "isCorrect": true, "image": null}, {"id": "dRGXJ", "label": "B", "text": "$4\\pi T R \\left[\\dfrac{R}{r} - 1\\right]$", "isCorrect": false, "image": null}, {"id": "GDtn1", "label": "C", "text": "$4\\pi T \\left[\\dfrac{R^2}{r^2} - 1\\right]$", "isCorrect": false, "image": null}, {"id": "ZTzaQ", "label": "D", "text": "$4\\pi T \\left[1 + \\dfrac{R^3}{r}\\right]$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Volume of the initial drop is equal to the total volume of $n$ droplets.<br><br>$\\dfrac{4}{3}\\pi R^3 = n \\times \\dfrac{4}{3}\\pi r^3$<br><br>$n = \\dfrac{R^3}{r^3}$<br><br>Initial surface area of the drop, $A_1 = 4\\pi R^2$<br><br>Final total surface area of $n$ droplets, $A_2 = n \\times 4\\pi r^2$<br><br>Substituting the value of $n$:<br><br>$A_2 = \\left(\\dfrac{R^3}{r^3}\\right) \\times 4\\pi r^2 = 4\\pi \\dfrac{R^3}{r}$<br><br>Increase in surface area, $\\Delta A = A_2 - A_1 = 4\\pi \\dfrac{R^3}{r} - 4\\pi R^2$<br><br>$\\Delta A = 4\\pi R^2 \\left[\\dfrac{R}{r} - 1\\right]$<br><br>Energy required to break the drop, $E = T \\times \\Delta A$<br><br>$E = 4\\pi T R^2 \\left[\\dfrac{R}{r} - 1\\right]$<br><br>Answer: $4\\pi T R^2 \\left[\\dfrac{R}{r} - 1\\right]$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3068c30a4553e1bdf5c", "type": "singleCorrect", "question": {"text": "In most liquids, with rise in temperature surface tension of liquid", "image": null}, "options": [{"id": "Jz5R1", "label": "A", "text": "decreases", "isCorrect": true, "image": null}, {"id": "0ILRM", "label": "B", "text": "increases", "isCorrect": false, "image": null}, {"id": "b5BFt", "label": "C", "text": "remains unchanged", "isCorrect": false, "image": null}, {"id": "LwZnO", "label": "D", "text": "first decreases and then increases", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Surface tension of a liquid arises due to the intermolecular cohesive forces between its molecules.<br><br>As the temperature of the liquid increases, the kinetic energy of the molecules increases. This increased thermal agitation causes the intermolecular distance to increase, which in turn weakens the cohesive forces between the molecules.<br><br>Due to the decrease in cohesive forces, the surface tension of the liquid decreases with a rise in temperature. At the critical temperature, the surface tension becomes zero.<br><br>Answer: decreases", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f98c30a4553e1bdecf", "type": "singleCorrect", "question": {"text": "One large soap bubble of diameter 'D' breaks into $64$ bubbles having surface tension 'T'. The change in surface energy is", "image": null}, "options": [{"id": "0uMtt", "label": "A", "text": "$2\\pi TD^2$", "isCorrect": false, "image": null}, {"id": "Eqvcg", "label": "B", "text": "$4\\pi TD^2$", "isCorrect": false, "image": null}, {"id": "FJBMI", "label": "C", "text": "$6\\pi TD^2$", "isCorrect": true, "image": null}, {"id": "j951O", "label": "D", "text": "$8\\pi TD^2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $R$ be the radius of the large bubble and $r$ be the radius of each small bubble.<br><br>Equating the initial and final volumes:<br><br>$\\dfrac{4}{3}\\pi R^3 = 64 \\times \\dfrac{4}{3}\\pi r^3$<br><br>$R^3 = 64 r^3 \\Rightarrow r = \\dfrac{R}{4}$<br><br>A soap bubble has two free surfaces. The initial surface energy is:<br><br>$U_i = T \\times 2 \\times 4\\pi R^2 = 8\\pi R^2 T$<br><br>The final surface energy of $64$ small bubbles is:<br><br>$U_f = 64 \\times T \\times 2 \\times 4\\pi r^2 = 512\\pi r^2 T$<br><br>Substituting $r = \\dfrac{R}{4}$:<br><br>$U_f = 512\\pi \\left(\\dfrac{R}{4}\\right)^2 T = 512\\pi \\dfrac{R^2}{16} T = 32\\pi R^2 T$<br><br>The change in surface energy is:<br><br>$\\Delta U = U_f - U_i = 32\\pi R^2 T - 8\\pi R^2 T = 24\\pi R^2 T$<br><br>Given the diameter $D = 2R$, we substitute $R = \\dfrac{D}{2}$:<br><br>$\\Delta U = 24\\pi \\left(\\dfrac{D}{2}\\right)^2 T = 24\\pi \\dfrac{D^2}{4} T = 6\\pi TD^2$<br><br>Answer: $6\\pi TD^2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f88c30a4553e1bdec4", "type": "singleCorrect", "question": {"text": "The pressures inside two soap bubbles A and B are $1.02$ atmosphere and $1.04$ atmosphere respectively. The ratio of volume of bubble A to that of bubble B is (outside pressure $= 1$ atmosphere)", "image": null}, "options": [{"id": "ol07e", "label": "A", "text": "$1:8$", "isCorrect": false, "image": null}, {"id": "lT0DD", "label": "B", "text": "$8:1$", "isCorrect": true, "image": null}, {"id": "cTxfP", "label": "C", "text": "$4:1$", "isCorrect": false, "image": null}, {"id": "2giYm", "label": "D", "text": "$1:4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The excess pressure inside a soap bubble is given by $\\Delta P = \\dfrac{4T}{R}$, where $T$ is the surface tension and $R$ is the radius of the bubble.<br><br>For bubble A, the excess pressure is $\\Delta P_A = 1.02 - 1 = 0.02$ atm.<br><br>For bubble B, the excess pressure is $\\Delta P_B = 1.04 - 1 = 0.04$ atm.<br><br>Taking the ratio of the excess pressures, we get $\\dfrac{\\Delta P_A}{\\Delta P_B} = \\dfrac{0.02}{0.04} = \\dfrac{1}{2}$.<br><br>Since $R \\propto \\dfrac{1}{\\Delta P}$, the ratio of their radii is $\\dfrac{R_A}{R_B} = \\dfrac{\\Delta P_B}{\\Delta P_A} = \\dfrac{2}{1}$.<br><br>The volume of a spherical bubble is $V = \\dfrac{4}{3}\\pi R^3$, which means $V \\propto R^3$.<br><br>The ratio of their volumes is $\\dfrac{V_A}{V_B} = \\left(\\dfrac{R_A}{R_B}\\right)^3 = (2)^3 = 8$.<br><br>Thus, the ratio of the volume of bubble A to that of bubble B is $8:1$.<br><br>Answer: $8:1$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ea8c30a4553e1bde30", "type": "singleCorrect", "question": {"text": "If the shape of the liquid surface is curved, then", "image": null}, "options": [{"id": "RwkQo", "label": "A", "text": "the pressure on convex side is equal to atmosphereic pressure.", "isCorrect": false, "image": null}, {"id": "B3WLm", "label": "B", "text": "the pressure on the convex side is equal to pressure on concave side.", "isCorrect": false, "image": null}, {"id": "48j4e", "label": "C", "text": "the pressure on the concave side is greater than that on the convex side.", "isCorrect": true, "image": null}, {"id": "DrMMm", "label": "D", "text": "the pressure on the concave side is lesser than that on the convex side.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "When a liquid surface is curved, there is a pressure difference across the surface due to surface tension.<br><br>The pressure on the concave side of the curved surface is always greater than the pressure on the convex side.<br><br>The excess pressure is given by $\\Delta P = \\dfrac{2T}{R}$, where $T$ is the surface tension and $R$ is the radius of curvature.<br><br>Therefore, the pressure on the concave side is greater than that on the convex side.<br><br>Answer: the pressure on the concave side is greater than that on the convex side.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d33f8c30a4553e1be1b6", "type": "singleCorrect", "question": {"text": "When a capillary tube of radius 'r' is immersed in water, rise of water is upto height 'h'. The mass of water in capillary tube is 'm'. When another capillary tube of radius 'xr' is immersed in water, the mass of water that will rise in this tube is", "image": null}, "options": [{"id": "USO9X", "label": "A", "text": "$x \\cdot m$", "isCorrect": true, "image": null}, {"id": "a9f8q", "label": "B", "text": "$\\dfrac{m}{x}$", "isCorrect": false, "image": null}, {"id": "7ugxP", "label": "C", "text": "$x^2 m$", "isCorrect": false, "image": null}, {"id": "W4xOa", "label": "D", "text": "$(x + 1)m$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The height of water rise in a capillary tube is given by Jurin's law:<br><br>$h = \\dfrac{2T \\cos \\theta}{r \\rho g}$<br><br>The mass of water in the capillary tube is:<br><br>$m = \\text{Volume} \\times \\text{density} = \\pi r^2 h \\rho$<br><br>Substituting the expression for $h$ into the mass equation:<br><br>$m = \\pi r^2 \\left( \\dfrac{2T \\cos \\theta}{r \\rho g} \\right) \\rho = \\dfrac{2 \\pi r T \\cos \\theta}{g}$<br><br>This shows that the mass of water rising in the capillary tube is directly proportional to its radius:<br><br>$m \\propto r$<br><br>For the first capillary tube of radius $r$, the mass is $m$. For the second capillary tube of radius $xr$, the new mass $m'$ will be:<br><br>$m' = x \\cdot m$<br><br>Answer: $x \\cdot m$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d33e8c30a4553e1be1b5", "type": "singleCorrect", "question": {"text": "The excess pressure inside the first soap bubble is three times that inside the second soap bubble. The ratio of the volume of the first soap bubble to the volume of the second soap bubble is", "image": null}, "options": [{"id": "z1Aiz", "label": "A", "text": "$3 : 4$", "isCorrect": false, "image": null}, {"id": "N2J9t", "label": "B", "text": "$1 : 3$", "isCorrect": false, "image": null}, {"id": "JUJJF", "label": "C", "text": "$1 : 9$", "isCorrect": false, "image": null}, {"id": "0E6e3", "label": "D", "text": "$1 : 27$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The excess pressure inside a soap bubble of radius $R$ and surface tension $T$ is given by $P = \\dfrac{4T}{R}$.<br><br>Given $P_1 = 3P_2$.<br><br>$\\dfrac{4T}{R_1} = 3 \\left( \\dfrac{4T}{R_2} \\right)$<br><br>$\\dfrac{R_1}{R_2} = \\dfrac{1}{3}$<br><br>The volume of a soap bubble is $V = \\dfrac{4}{3}\\pi R^3$.<br><br>The ratio of their volumes is $\\dfrac{V_1}{V_2} = \\left( \\dfrac{R_1}{R_2} \\right)^3 = \\left( \\dfrac{1}{3} \\right)^3 = \\dfrac{1}{27}$.<br><br>Thus, the ratio of the volumes is $1 : 27$.<br><br>Answer: $1 : 27$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d33e8c30a4553e1be1b4", "type": "singleCorrect", "question": {"text": "Two soap bubbles, A and B, have radii in the ratio $3 : 2$. The excess pressure inside the bubble A to that of B is in the ratio", "image": null}, "options": [{"id": "Pat5e", "label": "A", "text": "$2 : 3$", "isCorrect": true, "image": null}, {"id": "M297D", "label": "B", "text": "$3 : 2$", "isCorrect": false, "image": null}, {"id": "SDqYd", "label": "C", "text": "$1 : 5$", "isCorrect": false, "image": null}, {"id": "cFfch", "label": "D", "text": "$4 : 9$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The excess pressure inside a soap bubble of radius $R$ and surface tension $T$ is given by $\\Delta P = \\dfrac{4T}{R}$.<br><br>This implies that the excess pressure is inversely proportional to the radius of the bubble, $\\Delta P \\propto \\dfrac{1}{R}$.<br><br>Given the ratio of radii of bubbles A and B is $R_A : R_B = 3 : 2$.<br><br>The ratio of their excess pressures is $\\dfrac{\\Delta P_A}{\\Delta P_B} = \\dfrac{R_B}{R_A} = \\dfrac{2}{3}$.<br><br>Thus, the ratio is $2 : 3$.<br><br>Answer: $2 : 3$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c08c30a4553e1bdc70", "type": "singleCorrect", "question": {"text": "The excess pressure inside a spherical water drop A is four times that of another water drop B. Then, the ratio of the mass of water drop A to that of drop B is", "image": null}, "options": [{"id": "5O04M", "label": "A", "text": "$1 : 8$", "isCorrect": false, "image": null}, {"id": "oST9X", "label": "B", "text": "$1 : 16$", "isCorrect": false, "image": null}, {"id": "lKJD5", "label": "C", "text": "$1 : 32$", "isCorrect": false, "image": null}, {"id": "qs5B2", "label": "D", "text": "$1 : 64$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The excess pressure inside a spherical water drop of radius $R$ and surface tension $T$ is given by $\\Delta P = \\dfrac{2T}{R}$<br><br>Given that $\\Delta P_A = 4 \\Delta P_B$<br><br>$\\dfrac{2T}{R_A} = 4 \\left(\\dfrac{2T}{R_B}\\right)$<br><br>$R_B = 4R_A \\Rightarrow \\dfrac{R_A}{R_B} = \\dfrac{1}{4}$<br><br>The mass of a spherical drop is $M = \\dfrac{4}{3}\\pi R^3 \\rho$<br><br>The ratio of their masses is $\\dfrac{M_A}{M_B} = \\left(\\dfrac{R_A}{R_B}\\right)^3$<br><br>$\\dfrac{M_A}{M_B} = \\left(\\dfrac{1}{4}\\right)^3 = \\dfrac{1}{64}$<br><br>The ratio of the mass of water drop A to that of drop B is $1 : 64$<br><br>Answer: $1 : 64$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c08c30a4553e1bdc6f", "type": "singleCorrect", "question": {"text": "In a capillary tube of area of cross-section '$a$' water rises to height '$h$'. To what height will water rise in a capillary tube of area of cross-section $4a$?", "image": null}, "options": [{"id": "fA64H", "label": "A", "text": "$\\dfrac{h}{4}$", "isCorrect": false, "image": null}, {"id": "v1oqg", "label": "B", "text": "$\\dfrac{h}{2}$", "isCorrect": true, "image": null}, {"id": "m1xQ2", "label": "C", "text": "$2h$", "isCorrect": false, "image": null}, {"id": "c1h06", "label": "D", "text": "$4h$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The height of capillary rise is given by $h = \\dfrac{2T \\cos \\theta}{\\rho g r}$<br><br>This implies $h \\propto \\dfrac{1}{r}$<br><br>The area of cross-section is $a = \\pi r^2$, which gives $r \\propto \\sqrt{a}$<br><br>Therefore, $h \\propto \\dfrac{1}{\\sqrt{a}}$<br><br>Using the relation for two different tubes, we get $h_1 \\sqrt{a_1} = h_2 \\sqrt{a_2}$<br><br>Substituting the given values, $h \\sqrt{a} = h' \\sqrt{4a}$<br><br>$h \\sqrt{a} = h' (2\\sqrt{a})$<br><br>$h' = \\dfrac{h}{2}$<br><br>Answer: $\\dfrac{h}{2}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c08c30a4553e1bdc6e", "type": "singleCorrect", "question": {"text": "A soap bubble of radius $\\dfrac{1}{\\sqrt{\\pi}}$ cm is expanded to radius $\\dfrac{3}{\\sqrt{\\pi}}$ cm. Surface tension of soap solution is 25 dyne/cm. The work done during expansion in erg is", "image": null}, "options": [{"id": "PpHFG", "label": "A", "text": "$800$", "isCorrect": false, "image": null}, {"id": "dcG3K", "label": "B", "text": "$1200$", "isCorrect": false, "image": null}, {"id": "miubh", "label": "C", "text": "$1600$", "isCorrect": true, "image": null}, {"id": "T2UvC", "label": "D", "text": "$2400$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Work done in expanding a soap bubble is given by $W = T \\times \\Delta A$<br><br>Since a soap bubble has two free surfaces, the change in surface area is $\\Delta A = 2 \\times 4\\pi (R_2^2 - R_1^2)$<br><br>Given $R_1 = \\dfrac{1}{\\sqrt{\\pi}}$ cm and $R_2 = \\dfrac{3}{\\sqrt{\\pi}}$ cm<br><br>$\\Delta A = 8\\pi \\left( \\left(\\dfrac{3}{\\sqrt{\\pi}}\\right)^2 - \\left(\\dfrac{1}{\\sqrt{\\pi}}\\right)^2 \\right)$<br><br>$\\Delta A = 8\\pi \\left( \\dfrac{9}{\\pi} - \\dfrac{1}{\\pi} \\right) = 8\\pi \\times \\dfrac{8}{\\pi} = 64$ cm$^2$<br><br>Given surface tension $T = 25$ dyne/cm<br><br>$W = 25 \\times 64 = 1600$ erg<br><br>Answer: $1600$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d18c30a4553e1bdd1e", "type": "singleCorrect", "question": {"text": "One thousand small water drops of equal radii combine to form a big drop. The ratio of final surface energy to the total initial surface energy is", "image": null}, "options": [{"id": "LcWYc", "label": "A", "text": "$1 : 1$", "isCorrect": false, "image": null}, {"id": "CcDel", "label": "B", "text": "$1 : 10$", "isCorrect": true, "image": null}, {"id": "XtEB2", "label": "C", "text": "$1 : 100$", "isCorrect": false, "image": null}, {"id": "w3SBv", "label": "D", "text": "$1 : 1000$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $r$ be the radius of each small drop and $R$ be the radius of the big drop.<br><br>Since volume remains constant during the combination of drops:<br><br>$\\dfrac{4}{3}\\pi R^3 = 1000 \\times \\dfrac{4}{3}\\pi r^3$<br><br>$R = 10r$<br><br>Initial total surface energy of $1000$ drops is:<br><br>$E_i = 1000 \\times 4\\pi r^2 T$<br><br>Final surface energy of the big drop is:<br><br>$E_f = 4\\pi R^2 T = 4\\pi (10r)^2 T = 100 \\times 4\\pi r^2 T$<br><br>The ratio of final surface energy to the total initial surface energy is:<br><br>$\\dfrac{E_f}{E_i} = \\dfrac{100 \\times 4\\pi r^2 T}{1000 \\times 4\\pi r^2 T} = \\dfrac{1}{10}$<br><br>The ratio is $1 : 10$.<br><br>Answer: $1 : 10$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d08c30a4553e1bdd1a", "type": "singleCorrect", "question": {"text": "Under isothermal condition, two soap bubbles of radii $r_1$ and $r_2$ combine to form a single soap bubble of radius R. The surface tension of the soap solution is (P = outside pressure)", "image": null}, "options": [{"id": "x0HFG", "label": "A", "text": "$\\dfrac{P(R^3 - r_1^3 - r_2^3)}{4(r_1^2 + r_2^2 - R^2)}$", "isCorrect": true, "image": null}, {"id": "gB2io", "label": "B", "text": "$\\dfrac{P(R^3 + r_1^3 + r_2^3)}{2(r_1^2 - r_2^2 + R^2)}$", "isCorrect": false, "image": null}, {"id": "4VsMD", "label": "C", "text": "$\\dfrac{P(r_1^3 - r_2^3 - R^3)}{(R^2 + r^2 + r^2)}$", "isCorrect": false, "image": null}, {"id": "I3NZy", "label": "D", "text": "$\\dfrac{P(R^3 - r_1^3 + r_2^3)}{2(r_1^2 + r_2^2 - R^2)}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $T$ be the surface tension of the soap solution.<br><br>The pressure inside a soap bubble of radius $r$ is given by $P_i = P + \\dfrac{4T}{r}$, where $P$ is the outside pressure.<br><br>The volume of the bubble is $V = \\dfrac{4}{3}\\pi r^3$.<br><br>Under isothermal conditions, the temperature remains constant. The total number of moles of air inside the bubbles is conserved, which gives $P_1 V_1 + P_2 V_2 = P_f V_f$.<br><br>Substituting the values for the two initial bubbles and the final bubble:<br><br>$\\left(P + \\dfrac{4T}{r_1}\\right) \\dfrac{4}{3}\\pi r_1^3 + \\left(P + \\dfrac{4T}{r_2}\\right) \\dfrac{4}{3}\\pi r_2^3 = \\left(P + \\dfrac{4T}{R}\\right) \\dfrac{4}{3}\\pi R^3$<br><br>Dividing the entire equation by $\\dfrac{4}{3}\\pi$:<br><br>$P r_1^3 + 4T r_1^2 + P r_2^3 + 4T r_2^2 = P R^3 + 4T R^2$<br><br>Rearranging the terms to solve for $T$:<br><br>$4T r_1^2 + 4T r_2^2 - 4T R^2 = P R^3 - P r_1^3 - P r_2^3$<br><br>$4T (r_1^2 + r_2^2 - R^2) = P (R^3 - r_1^3 - r_2^3)$<br><br>$T = \\dfrac{P(R^3 - r_1^3 - r_2^3)}{4(r_1^2 + r_2^2 - R^2)}$<br><br>Answer: $\\dfrac{P(R^3 - r_1^3 - r_2^3)}{4(r_1^2 + r_2^2 - R^2)}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 3, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3308c30a4553e1be119", "type": "singleCorrect", "question": {"text": "A liquid is at rest in a container. In a sphere of influence, the liquid molecule at its centre is", "image": null}, "options": [{"id": "lfy9w", "label": "A", "text": "attracted by other molecules in the sphere of influence.", "isCorrect": true, "image": null}, {"id": "tkhaK", "label": "B", "text": "attracted by other molecules outside sphere of influence.", "isCorrect": false, "image": null}, {"id": "19MsX", "label": "C", "text": "repelled by other molecules outside the sphere of influence.", "isCorrect": false, "image": null}, {"id": "mgvIc", "label": "D", "text": "repelled by other molecules in the sphere of influence.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The sphere of influence is an imaginary sphere drawn with a molecule as its centre and the intermolecular range as its radius.<br><br>The intermolecular force is attractive in nature for the molecules within this range.<br><br>Therefore, the liquid molecule at the centre of the sphere of influence is attracted by other molecules present inside the sphere of influence.<br><br>Molecules outside the sphere of influence are at a distance greater than the intermolecular range, so they do not exert any significant force on the central molecule.<br><br>Answer: attracted by other molecules in the sphere of influence.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e08c30a4553e1bddbe", "type": "singleCorrect", "question": {"text": "A square frame of each side L is dipped in a soap solution and taken out, the force acting on the film formed is ( T = surface tension of soap solution)", "image": null}, "options": [{"id": "gO5Zg", "label": "A", "text": "$4\\,TL$", "isCorrect": false, "image": null}, {"id": "m3xmD", "label": "B", "text": "$8\\,TL$", "isCorrect": true, "image": null}, {"id": "XCyxr", "label": "C", "text": "$12\\,TL$", "isCorrect": false, "image": null}, {"id": "3E3bE", "label": "D", "text": "$16\\,TL$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The perimeter of the square frame is $4L$.<br><br>A soap film has two free surfaces, so the effective length of the boundary in contact with the film is $2 \\times 4L = 8L$.<br><br>The total force due to surface tension is given by $F = T \\times \\text{effective length}$.<br><br>$F = T \\times 8L = 8TL$.<br><br>Answer: $8\\,TL$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2dc8c30a4553e1bdd9a", "type": "singleCorrect", "question": {"text": "Three liquids have same surface tension and densities $\\rho_1$, $\\rho_2$ and $\\rho_3$ ($\\rho_1 < \\rho_2 < \\rho_3$). In three identical capillaries rise of liquid is same. The corresponding angle of contact $\\theta_1$, $\\theta_2$ and $\\theta_3$ are related as", "image": null}, "options": [{"id": "kQaSd", "label": "A", "text": "$\\theta_1 < \\theta_2 < \\theta_3$", "isCorrect": false, "image": null}, {"id": "S1uP1", "label": "B", "text": "$\\theta_1 > \\theta_2 > \\theta_3$", "isCorrect": true, "image": null}, {"id": "eo4Fj", "label": "C", "text": "$\\theta_1 = \\theta_2 = \\theta_3$", "isCorrect": false, "image": null}, {"id": "FmKw3", "label": "D", "text": "$\\theta_1 > \\theta_2 < \\theta_3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The formula for capillary rise is $h = \\dfrac{2T \\cos\\theta}{r \\rho g}$.<br><br>Rearranging the formula, we get $\\cos\\theta = \\dfrac{h r g}{2T} \\rho$.<br><br>Since $h$, $r$, $g$, and $T$ are constant for all three liquids, $\\cos\\theta \\propto \\rho$.<br><br>Given that $\\rho_1 < \\rho_2 < \\rho_3$, it follows that $\\cos\\theta_1 < \\cos\\theta_2 < \\cos\\theta_3$.<br><br>For capillary rise, the angle of contact $\\theta$ is acute ($0 \\le \\theta < 90^\\circ$). In this interval, the cosine function is strictly decreasing.<br><br>Therefore, a smaller value of $\\cos\\theta$ corresponds to a larger angle $\\theta$, which gives $\\theta_1 > \\theta_2 > \\theta_3$.<br><br>Answer: $\\theta_1 > \\theta_2 > \\theta_3$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2db8c30a4553e1bdd8e", "type": "singleCorrect", "question": {"text": "The excess pressure inside the first soap bubble of radius $R_1$ is three times that inside the second soap bubble of radius $R_2$. The ratio of volumes of the first to second bubble is", "image": null}, "options": [{"id": "iCZrH", "label": "A", "text": "$1 : 27$", "isCorrect": true, "image": null}, {"id": "ppVKg", "label": "B", "text": "$1 : 18$", "isCorrect": false, "image": null}, {"id": "RrqWL", "label": "C", "text": "$1 : 9$", "isCorrect": false, "image": null}, {"id": "YbxUC", "label": "D", "text": "$1 : 3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The excess pressure inside a soap bubble of radius $R$ is given by $\\Delta P = \\dfrac{4T}{R}$, where $T$ is the surface tension.<br><br>Given that the excess pressure inside the first bubble is three times that inside the second bubble:<br><br>$\\Delta P_1 = 3 \\Delta P_2$<br><br>$\\dfrac{4T}{R_1} = 3 \\left(\\dfrac{4T}{R_2}\\right)$<br><br>$\\dfrac{R_1}{R_2} = \\dfrac{1}{3}$<br><br>The volume of a spherical bubble is $V = \\dfrac{4}{3}\\pi R^3$. The ratio of their volumes is:<br><br>$\\dfrac{V_1}{V_2} = \\left(\\dfrac{R_1}{R_2}\\right)^3$<br><br>$\\dfrac{V_1}{V_2} = \\left(\\dfrac{1}{3}\\right)^3 = \\dfrac{1}{27}$<br><br>The ratio of volumes of the first to the second bubble is $1 : 27$.<br><br>Answer: $1 : 27$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3178c30a4553e1be00f", "type": "singleCorrect", "question": {"text": "Water rises to a height $3$ cm in a capillary tube. If cross-sectional area of capillary tube is reduced to $1/3^{rd}$ of its initial area then water will rise to a height of", "image": null}, "options": [{"id": "wtaQb", "label": "A", "text": "$3\\sqrt{3}$ cm", "isCorrect": true, "image": null}, {"id": "0cBL7", "label": "B", "text": "$\\sqrt{3}$ cm", "isCorrect": false, "image": null}, {"id": "3BPUT", "label": "C", "text": "$9$ cm", "isCorrect": false, "image": null}, {"id": "xK74F", "label": "D", "text": "$3$ cm", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The height of water in a capillary tube is given by $h = \\dfrac{2T \\cos \\theta}{\\rho g r}$<br><br>This implies $h \\propto \\dfrac{1}{r}$<br><br>Given that the cross-sectional area is reduced to $\\dfrac{1}{3}$ of its initial value:<br><br>$A_2 = \\dfrac{A_1}{3}$<br><br>$\\pi r_2^2 = \\dfrac{\\pi r_1^2}{3}$<br><br>$r_2 = \\dfrac{r_1}{\\sqrt{3}}$<br><br>Using the relation $h_1 r_1 = h_2 r_2$:<br><br>$h_2 = h_1 \\dfrac{r_1}{r_2}$<br><br>$h_2 = 3 \\times \\sqrt{3} = 3\\sqrt{3}$ cm<br><br>Answer: $3\\sqrt{3}$ cm", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible"
