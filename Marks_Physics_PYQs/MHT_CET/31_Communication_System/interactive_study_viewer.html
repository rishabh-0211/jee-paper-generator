ich the radio waves are no longer reflected back by ionosphere is ______ (<math><br> <mrow><br>  <mi>N</mi><mo>=</mo></mrow><br></math><br> maximum electron density of ionosphere,<math><mi>g</mi></math><br>= acceleration due to gravity)", "image": null}, "options": [{"id": "jZ3F9", "text": "<math><mi>g</mi><mi>N</mi></math>", "image": null, "isCorrect": false}, {"id": "0d8JV", "text": "<math><mi>g</mi><msup><mrow><mi>N</mi></mrow><mrow><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "w38by", "text": "<math><mi>g</mi><msqrt><mi>N</mi></msqrt></math>", "image": null, "isCorrect": true}, {"id": "XbSHf", "text": "<math><msup><mrow><mi>g</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>N</mi></mrow><mrow><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For ionosphere, the maximum frequency of radius waves that can be reflected back is given by  <math><mi>g</mi><msqrt><mi>N</mi></msqrt></math> . Where N is maximum electron density of ionsphere and g is acceleration due to gravity.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e8a0279619d9d8a1543", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "Which of the following is the communication channel in case of radio communication?", "image": null}, "options": [{"id": "m5aIr", "text": "Free space", "image": null, "isCorrect": true}, {"id": "7NfKP", "text": "Reception lines", "image": null, "isCorrect": false}, {"id": "AlvBx", "text": "Transmission lines", "image": null, "isCorrect": false}, {"id": "N5Y05", "text": "None of the above", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a263450279619d9d8a3da9", "title": "Propagation of EM Waves", "totalQuestions": 3, "questions": [{"_id": "65a25fd80279619d9d8a1fb7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "In the process of space communication, use of modem is necessary.\nIn which one of the following modes modem acts as a modulator and a demodulator respectively?", "image": null}, "options": [{"id": "BQGhh", "text": "Transmitting and receiving.", "image": null, "isCorrect": true}, {"id": "Joyn9", "text": "Both receiving.", "image": null, "isCorrect": false}, {"id": "QBlwu", "text": "Both transmitting.", "image": null, "isCorrect": false}, {"id": "54xFs", "text": "Receiving and transmitting.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Transmitting and receiving", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f670279619d9d8a1c33", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}], "question": {"text": "According to theoretical study of radiation from a same linear antenna, the power radiated is proportional to $[\\lambda=$ wavelength $]$", "image": null}, "options": [{"id": "cwopC", "text": "$\\lambda^{-2}$", "image": null, "isCorrect": true}, {"id": "Bdyvn", "text": "$\\lambda^{-1}$", "image": null, "isCorrect": false}, {"id": "coaum", "text": "$\\lambda^{2}$", "image": null, "isCorrect": false}, {"id": "eRMhm", "text": "$\\lambda$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A linear antenna radiates power proportional to $\\left(\\frac{1}{\\lambda}\\right)^{2}$.\nHence a longer antenna emits more power. Also power radiated by a long wavelength base would be small.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e630279619d9d8a1405", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "The waves which are reflected back to the earth by ionos phere is", "image": null}, "options": [{"id": "4aWtr", "text": "ground wave", "image": null, "isCorrect": false}, {"id": "sky5Y", "text": "sky wave", "image": null, "isCorrect": true}, {"id": "l8A4Q", "text": "space wave", "image": null, "isCorrect": false}, {"id": "zUSmz", "text": "All of them", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Sky waves are reflected back to the earth by ionosphere.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a263450279619d9d8a3dab", "title": "Modulation", "totalQuestions": 8, "questions": [{"_id": "65a260100279619d9d8a2173", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}], "question": {"text": "Identify the 'INCORRECT' statement from the following.", "image": null}, "options": [{"id": "25CUV", "text": "Modulation index $\\mu$ is kept greater than one to avoid distortion.", "image": null, "isCorrect": true}, {"id": "d5enK", "text": "The receiving antenna is followed by amplifier, intermediate frequency (IF) stage and detector.", "image": null, "isCorrect": false}, {"id": "JUbCa", "text": "AM detection is carried out using a rectifier and an envelop detector.", "image": null, "isCorrect": false}, {"id": "SKY9W", "text": "Modulated signal is to be followed by power amplifier and then fed to an antenna.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Modulation index $\\mathrm{u}$ is kept greater than one to avoid distortion", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ffd0279619d9d8a20dc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "Modulation is a process of superposing", "image": null}, "options": [{"id": "3A3aO", "text": "low frequency radio signal on low frequency audio waves.", "image": null, "isCorrect": false}, {"id": "fCi0j", "text": "high frequency audio signal on low frequency radio waves.", "image": null, "isCorrect": false}, {"id": "eYCDO", "text": "low frequency audio signal on high frequency radio waves.", "image": null, "isCorrect": true}, {"id": "7lX2Q", "text": "high frequency radio signal on low frequency audio signal.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Low frequency audio signal cannot be transmitted as such over long distances. Therefore. to overcome this difficulty, the low frequency audio signal is superposed on a high frequency wave (carrier wave). This process is called modulation.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fee0279619d9d8a2061", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "A carrier wave of peak voltage 16 volt is used to transmit a signal. If the\nmodulation index is $75 \\%$, the peak voltage of the modulating signal is", "image": null}, "options": [{"id": "WgVp4", "text": "6 volt", "image": null, "isCorrect": false}, {"id": "pheYM", "text": "24 volt", "image": null, "isCorrect": false}, {"id": "nqwSI", "text": "18 volt", "image": null, "isCorrect": false}, {"id": "mCP2B", "text": "12 volt", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "A carrier wave of peak voltage $16 \\mathrm{~V}$ is used to transmit a signal. If the modulation index is $75 \\%$, the peak voltage of the modulating signal is $12 \\mathrm{~V}$.\nExplanation:\nModulation Index\n$(\\mathrm{MI})=\\frac{\\text { Peak voltage of modulating signal }\\left(\\mathrm{V}_{\\mathrm{m}}\\right)}{\\text { Peak voltage of carrier } \\operatorname{signal}\\left(\\mathrm{V}_{\\mathrm{C}}\\right)}$\nGiven, $\\mathrm{Ml}=75 \\%$ and $\\mathrm{V}_{\\mathrm{C}}=16 \\mathrm{~V}$\n$\\therefore \\mathrm{V}_{\\mathrm{m}}=\\mathrm{MI} \\times \\mathrm{V}_{\\mathrm{c}}=\\frac{75}{100} \\times 16=12 \\mathrm{~V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fb20279619d9d8a1e86", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "In amplitude modulation,", "image": null}, "options": [{"id": "gkvTt", "text": "both amplitude and frequency do not change according to information signal.", "image": null, "isCorrect": false}, {"id": "8OjSL", "text": "amplitude remains constant but frequency changes according to information\nsignal.", "image": null, "isCorrect": false}, {"id": "061rD", "text": "both amplitude and frequency change according to information signal.", "image": null, "isCorrect": false}, {"id": "X64Xu", "text": "amplitude of carrier wave changes according to information signal.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "amplitude of carrier wave changes according to information signal", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f9e0279619d9d8a1ded", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "In communication system, the range for line of sight propagation in case of earth is 'd', for the height of antenna (h). If 'h' is doubled then the new range is", "image": null}, "options": [{"id": "pxsTh", "text": "$\\frac{\\mathrm{d}}{\\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "5pGAo", "text": "$\\frac{\\sqrt{2}}{\\mathrm{~d}}$", "image": null, "isCorrect": false}, {"id": "5isDw", "text": "$\\frac{\\mathrm{d}}{2}$", "image": null, "isCorrect": false}, {"id": "GmPBZ", "text": "$\\sqrt{2} \\mathrm{~d}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "No Solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f430279619d9d8a1b0d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}], "question": {"text": "A signal of frequency $3 \\mathrm{kHz}$ is amplitude modulated on a carrier wave of frequency\n$2 \\cdot 5 \\mathrm{MHz}$. The upper and lower sideband frequencies in the resultant signal are", "image": null}, "options": [{"id": "UNnch", "text": "$2500 \\mathrm{kHz}, 2503 \\mathrm{kHz}$", "image": null, "isCorrect": false}, {"id": "Y5Oau", "text": "$2503 \\mathrm{kHz}, 2497 \\mathrm{kHz}$", "image": null, "isCorrect": true}, {"id": "XNmsU", "text": "$2 \\cdot 5 \\mathrm{MHz}, 3 \\mathrm{kHz}$", "image": null, "isCorrect": false}, {"id": "394it", "text": "$5 \\cdot 5 \\mathrm{MHz}, 0 \\cdot 5 \\mathrm{MHz}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} f_{R}=f_{C}+f_{m} &=2500 \\mathrm{KHz}+3 \\mathrm{kz} \\\\ &=2503 \\mathrm{KHz} \\\\ f_{R}=f_{C}-f_{m} &=2500 \\mathrm{kHz}-3 \\mathrm{kHz} \\\\ &=2497 \\mathrm{kHz} \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ecf0279619d9d8a1777", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}], "question": {"text": "In amplitude modulation", "image": null}, "options": [{"id": "di0MG", "text": "Amplitude remains constant but frequency change", "image": null, "isCorrect": false}, {"id": "68PWp", "text": "Both amplitude and frequency do not change", "image": null, "isCorrect": false}, {"id": "sOlGj", "text": "Both amplitude and frequency change", "image": null, "isCorrect": false}, {"id": "KHxsd", "text": "Amplitude of the carrier wave changes according to information signal", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In amplitude modulation amplitude of the carrier wave changes according to information signal.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
