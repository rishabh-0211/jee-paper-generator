  <script>
    const data = {"index": 4, "chapterId": "61c089866e775b4063ccd8a4", "chapter": "Motion In Two Dimensions", "exam": "MHT CET", "subject": "Physics", "totalTopics": 3, "totalQuestions": 118, "downloadTime": "2026-10-08 20:33:42", "topics": [{"index": 1, "topicId": "65a263450279619d9d8a3da8", "title": "Projectile motion", "totalQuestions": 23, "questions": [{"_id": "6abb886e15a9fc0fc8c143a3", "type": "singleCorrect", "question": {"text": "If the initial velocity of projection be doubled, keeping the angle of projection same, the maximum height reached by it will", "image": null}, "options": [{"id": "4FD94", "label": "A", "text": "remain the same", "isCorrect": false, "image": null}, {"id": "nTypx", "label": "B", "text": "be doubled", "isCorrect": false, "image": null}, {"id": "dNI73", "label": "C", "text": "become four times", "isCorrect": true, "image": null}, {"id": "OyVM4", "label": "D", "text": "be halved", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The maximum height reached by a projectile is given by the formula:<br><br>$H = \\dfrac{u^2 \\sin^2 \\theta}{2g}$<br><br>where $u$ is the initial velocity and $\theta$ is the angle of projection.<br><br>When the initial velocity is doubled, $u' = 2u$. The new maximum height $H'$ is:<br><br>$H' = \\dfrac{(2u)^2 \\sin^2 \\theta}{2g}$<br><br>$H' = 4 \\left( \\dfrac{u^2 \\sin^2 \\theta}{2g} \\right)$<br><br>$H' = 4H$<br><br>Therefore, the maximum height becomes four times.<br><br>Answer: become four times", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886a15a9fc0fc8c1437d", "type": "singleCorrect", "question": {"text": "A particle of mass m is projected with velocity V making an angle of $45^\\circ$ with the horizontal. The magnitude of the angular momentum of the projectile about an axis of projection when the particle is at maximum height h is ($g$ = acceleration due to gravity) $\\left(\\sin 45^\\circ = \\dfrac{1}{\\sqrt{2}}\\right)$ $\\left(\\cos 45^\\circ = \\dfrac{1}{\\sqrt{2}}\\right)$", "image": null}, "options": [{"id": "VYBOm", "label": "A", "text": "zero", "isCorrect": false, "image": null}, {"id": "6VYFx", "label": "B", "text": "$\\dfrac{mV^3}{4\\sqrt{2}g}$", "isCorrect": true, "image": null}, {"id": "hG32I", "label": "C", "text": "$\\dfrac{mV^3}{\\sqrt{2}g}$", "isCorrect": false, "image": null}, {"id": "HX8ox", "label": "D", "text": "$m\\sqrt{2gh^2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "At the maximum height, the vertical component of velocity is zero. The particle only has a horizontal velocity component given by:<br><br>$v_x = V \\cos 45^{\\circ} = \\dfrac{V}{\\sqrt{2}}$<br><br>The maximum height $h$ reached by the projectile is the perpendicular distance from the point of projection to the line of motion at the highest point.<br><br>$h = \\dfrac{V^2 \\sin^2 45^{\\circ}}{2g} = \\dfrac{V^2 \\left(\\dfrac{1}{\\sqrt{2}}\\right)^2}{2g} = \\dfrac{V^2}{4g}$<br><br>The magnitude of angular momentum $L$ about the point of projection is the product of the magnitude of linear momentum and the perpendicular distance from the axis to the line of motion.<br><br>$L = p \\times h = m v_x h$<br><br>Substituting the values of $v_x$ and $h$:<br><br>$L = m \\left( \\dfrac{V}{\\sqrt{2}} \\right) \\left( \\dfrac{V^2}{4g} \\right)$<br><br>$L = \\dfrac{m V^3}{4\\sqrt{2}g}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887d15a9fc0fc8c1442f", "type": "singleCorrect", "question": {"text": "A stone is thrown at an angle $\\theta$ with the horizontal reaches a maximum height $H$, then the time of flight of stone will be ($g$ = acceleration due to gravity)", "image": null}, "options": [{"id": "55LGz", "label": "A", "text": "$\\left(\\dfrac{2H}{g}\\right)^{\\frac{1}{2}}$", "isCorrect": false, "image": null}, {"id": "Gdbwb", "label": "B", "text": "$\\dfrac{2(2H\\sin\\theta)^{\\frac{1}{2}}}{g}$", "isCorrect": false, "image": null}, {"id": "CfBfY", "label": "C", "text": "$2\\left(\\dfrac{2H}{g}\\right)^{\\frac{1}{2}}$", "isCorrect": true, "image": null}, {"id": "zSAZz", "label": "D", "text": "$\\dfrac{(2H\\sin\\theta)^{\\frac{1}{2}}}{g}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Maximum height $H = \\dfrac{u^2 \\sin^2 \\theta}{2g}$<br><br>$u \\sin \\theta = \\sqrt{2gH}$<br><br>Time of flight $T = \\dfrac{2u \\sin \\theta}{g}$<br><br>Substituting the value of $u \\sin \\theta$:<br><br>$T = \\dfrac{2\\sqrt{2gH}}{g} = 2\\left(\\dfrac{2H}{g}\\right)^{\\dfrac{1}{2}}$<br><br>Answer: $2\\left(\\dfrac{2H}{g}\\right)^{\\frac{1}{2}}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888a15a9fc0fc8c144a9", "type": "singleCorrect", "question": {"text": "If two spheres are projected at angles $45^\\circ$ and $60^\\circ$ with horizontal and the maximum heights reached are same. The ratio of their initial velocities is ($\\sin 45^\\circ = \\dfrac{1}{\\sqrt{2}}, \\sin 60^\\circ = \\dfrac{\\sqrt{3}}{2}$)", "image": null}, "options": [{"id": "90IWg", "label": "A", "text": "$\\sqrt{2} : \\sqrt{3}$", "isCorrect": false, "image": null}, {"id": "LOvCe", "label": "B", "text": "$3 : 2$", "isCorrect": false, "image": null}, {"id": "s6qib", "label": "C", "text": "$2 : 3$", "isCorrect": false, "image": null}, {"id": "kkf1r", "label": "D", "text": "$\\sqrt{3} : \\sqrt{2}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The maximum height of a projectile is given by $H = \\dfrac{u^2 \\sin^2 \\theta}{2g}$.<br><br>Given that the maximum heights are the same, $H_1 = H_2$.<br><br>$\\dfrac{u_1^2 \\sin^2 \\theta_1}{2g} = \\dfrac{u_2^2 \\sin^2 \\theta_2}{2g}$<br><br>$u_1 \\sin 45^\\circ = u_2 \\sin 60^\\circ$<br><br>$\\dfrac{u_1}{u_2} = \\dfrac{\\sin 60^\\circ}{\\sin 45^\\circ}$<br><br>Substituting the values $\\sin 45^\\circ = \\dfrac{1}{\\sqrt{2}}$ and $\\sin 60^\\circ = \\dfrac{\\sqrt{3}}{2}$:<br><br>$\\dfrac{u_1}{u_2} = \\dfrac{\\dfrac{\\sqrt{3}}{2}}{\\dfrac{1}{\\sqrt{2}}} = \\dfrac{\\sqrt{3}}{\\sqrt{2}}$<br><br>The ratio of their initial velocities is $\\sqrt{3} : \\sqrt{2}$.<br><br>Answer: $\\sqrt{3} : \\sqrt{2}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885a15a9fc0fc8c142e6", "type": "singleCorrect", "question": {"text": "A particle is projected from ground with speed u and at an angle $\\theta$ with horizontal. If at maximum height from ground, the speed of a particle is half times its initial velocity of projection then its maximum height attained is $(\\cos 60^\\circ = 0.5, \\sin 60^\\circ = \\sqrt{3}/2)$ (g = acceleration due to gravity)", "image": null}, "options": [{"id": "3gX4S", "label": "A", "text": "$\\dfrac{2u^2}{g}$", "isCorrect": false, "image": null}, {"id": "b8XU3", "label": "B", "text": "$\\dfrac{3u^2}{8g}$", "isCorrect": true, "image": null}, {"id": "FfNOy", "label": "C", "text": "$\\dfrac{u^2}{g}$", "isCorrect": false, "image": null}, {"id": "ajSve", "label": "D", "text": "$\\dfrac{u^2}{2g}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the initial velocity be $u$ and the angle of projection be $\\theta$.<br><br>At the maximum height, the vertical component of velocity becomes zero, and the particle only has the horizontal component of velocity, which is $u \\cos \\theta$.<br><br>Given that the speed at maximum height is half of the initial speed:<br><br>$u \\cos \\theta = \\dfrac{u}{2}$<br><br>$\\cos \\theta = \\dfrac{1}{2}$<br><br>$\\theta = 60^\\circ$<br><br>The maximum height $H$ attained by the projectile is given by:<br><br>$H = \\dfrac{u^2 \\sin^2 \\theta}{2g}$<br><br>Substituting $\\theta = 60^\\circ$:<br><br>$H = \\dfrac{u^2 \\sin^2 60^\\circ}{2g}$<br><br>$H = \\dfrac{u^2 \\left(\\dfrac{\\sqrt{3}}{2}\\right)^2}{2g}$<br><br>$H = \\dfrac{u^2 \\left(\\dfrac{3}{4}\\right)}{2g}$<br><br>$H = \\dfrac{3u^2}{8g}$<br><br>Answer: $\\dfrac{3u^2}{8g}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a48c30a4553e1bdb3e", "type": "singleCorrect", "question": {"text": "Two spheres are projected at angles $30^\\circ$ and $45^\\circ$ with the horizontal. The maximum height reached by both is same. The ratio of their initial velocities is, $\\left(\\sin 45^\\circ = \\dfrac{1}{\\sqrt{2}}, \\sin 30^\\circ = 0.5\\right)$", "image": null}, "options": [{"id": "SmTmI", "label": "A", "text": "$2 : 3$", "isCorrect": false, "image": null}, {"id": "pKJg5", "label": "B", "text": "$\\sqrt{2} : 1$", "isCorrect": true, "image": null}, {"id": "qyP4i", "label": "C", "text": "$3 : 1$", "isCorrect": false, "image": null}, {"id": "Z3Dik", "label": "D", "text": "$\\sqrt{2} : \\sqrt{3}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The maximum height reached by a projectile is given by $H = \\dfrac{u^2 \\sin^2 \\theta}{2g}$<br><br>Given that the maximum heights are equal for both spheres:<br><br>$H_1 = H_2$<br><br>$\\dfrac{u_1^2 \\sin^2 \\theta_1}{2g} = \\dfrac{u_2^2 \\sin^2 \\theta_2}{2g}$<br><br>$u_1 \\sin \\theta_1 = u_2 \\sin \\theta_2$<br><br>Substituting $\\theta_1 = 30^\\circ$ and $\\theta_2 = 45^\\circ$:<br><br>$u_1 \\sin 30^\\circ = u_2 \\sin 45^\\circ$<br><br>$u_1 \\left(\\dfrac{1}{2}\\right) = u_2 \\left(\\dfrac{1}{\\sqrt{2}}\\right)$<br><br>$\\dfrac{u_1}{u_2} = \\dfrac{2}{\\sqrt{2}} = \\dfrac{\\sqrt{2}}{1}$<br><br>The ratio of their initial velocities is $\\sqrt{2} : 1$.<br><br>Answer: $\\sqrt{2} : 1$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3058c30a4553e1bdf51", "type": "singleCorrect", "question": {"text": "The equation of the trajectory of a ball projected at an angle $\\theta$ with the horizontal, is given as $y = x - \\dfrac{gx^2}{2}$<br>The initial velocity of the ball is<br>[Given : $\\tan 45^\\circ = 1$, $\\cos 45^\\circ = \\dfrac{1}{\\sqrt{2}}$ ]", "image": null}, "options": [{"id": "EU3KY", "label": "A", "text": "$2\\sqrt{2}\\,\\text{m/s}$", "isCorrect": false, "image": null}, {"id": "C6par", "label": "B", "text": "$2\\,\\text{m/s}$", "isCorrect": false, "image": null}, {"id": "Rsxvg", "label": "C", "text": "$\\sqrt{2}\\,\\text{m/s}$", "isCorrect": true, "image": null}, {"id": "WxPx3", "label": "D", "text": "$\\dfrac{1}{\\sqrt{2}}\\,\\text{m/s}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The standard equation of trajectory of a projectile is given by<br><br>$y = x \\tan \\theta - \\dfrac{gx^2}{2u^2 \\cos^2 \\theta}$<br><br>Comparing this with the given equation $y = x - \\dfrac{gx^2}{2}$, we get<br><br>$\\tan \\theta = 1 \\Rightarrow \\theta = 45^\\circ$<br><br>and<br><br>$\\dfrac{g}{2u^2 \\cos^2 \\theta} = \\dfrac{g}{2}$<br><br>$u^2 \\cos^2 \\theta = 1$<br><br>Substituting $\\theta = 45^\\circ$,<br><br>$u^2 \\left(\\dfrac{1}{\\sqrt{2}}\\right)^2 = 1$<br><br>$\\dfrac{u^2}{2} = 1$<br><br>$u^2 = 2$<br><br>$u = \\sqrt{2} \\text{ m/s}$<br><br>Answer: $\\sqrt{2}\\,\\text{m/s}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e98c30a4553e1bde25", "type": "singleCorrect", "question": {"text": "For a projectile motion, the range R is 'n' times the maximum height H. So the angle of projection is", "image": null}, "options": [{"id": "iE9ob", "label": "A", "text": "$\\sin^{-1}\\left(\\dfrac{2}{n}\\right)$", "isCorrect": false, "image": null}, {"id": "rOIHS", "label": "B", "text": "$\\cos^{-1}\\left(\\dfrac{4}{n}\\right)$", "isCorrect": false, "image": null}, {"id": "9hisf", "label": "C", "text": "$\\tan^{-1}\\left(\\dfrac{4}{n}\\right)$", "isCorrect": true, "image": null}, {"id": "25TuJ", "label": "D", "text": "$\\tan^{-1}\\left(\\dfrac{2}{n}\\right)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The horizontal range $R$ of a projectile is given by<br><br>$R = \\dfrac{u^2 \\sin 2\\theta}{g} = \\dfrac{2u^2 \\sin\\theta \\cos\\theta}{g}$<br><br>The maximum height $H$ is given by<br><br>$H = \\dfrac{u^2 \\sin^2\\theta}{2g}$<br><br>Given that $R = nH$, substituting the expressions for $R$ and $H$<br><br>$\\dfrac{2u^2 \\sin\\theta \\cos\\theta}{g} = n \\left( \\dfrac{u^2 \\sin^2\\theta}{2g} \\right)$<br><br>Cancelling $\\dfrac{u^2 \\sin\\theta}{g}$ from both sides<br><br>$2 \\cos\\theta = \\dfrac{n \\sin\\theta}{2}$<br><br>$\\dfrac{\\sin\\theta}{\\cos\\theta} = \\dfrac{4}{n}$<br><br>$\\tan\\theta = \\dfrac{4}{n}$<br><br>$\\theta = \\tan^{-1}\\left(\\dfrac{4}{n}\\right)$<br><br>Answer: $\\tan^{-1}\\left(\\dfrac{4}{n}\\right)$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d33d8c30a4553e1be1a9", "type": "singleCorrect", "question": {"text": "A ball P is projected at an angle of $60^\\circ$ with the vertical with certain initial speed. Another ball Q of the same mass as that of ball P is projected vertically upwards with the same initial speed as that of P. At the highest point, the ratio of potential energy of ball P to that of ball Q is<br>$(\\sin 30^\\circ = 0.5)$", "image": null}, "options": [{"id": "iRhW0", "label": "A", "text": "$1 : 4$", "isCorrect": true, "image": null}, {"id": "Vp1JW", "label": "B", "text": "$4 : 1$", "isCorrect": false, "image": null}, {"id": "G5Zrx", "label": "C", "text": "$2 : 3$", "isCorrect": false, "image": null}, {"id": "tUV6C", "label": "D", "text": "$3 : 2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the initial speed of both balls be $u$ and their mass be $m$.<br><br>For ball P, the angle of projection with the vertical is $60^\\circ$, so the angle with the horizontal is $\\theta_P = 90^\\circ - 60^\\circ = 30^\\circ$.<br><br>The maximum height reached by ball P is $H_P = \\dfrac{u^2 \\sin^2 30^\\circ}{2g} = \\dfrac{u^2 (1/2)^2}{2g} = \\dfrac{u^2}{8g}$.<br><br>The potential energy of ball P at the highest point is $U_P = mgH_P = mg \\left(\\dfrac{u^2}{8g}\\right) = \\dfrac{mu^2}{8}$.<br><br>For ball Q, it is projected vertically upwards, so the angle of projection with the horizontal is $\\theta_Q = 90^\\circ$.<br><br>The maximum height reached by ball Q is $H_Q = \\dfrac{u^2 \\sin^2 90^\\circ}{2g} = \\dfrac{u^2}{2g}$.<br><br>The potential energy of ball Q at the highest point is $U_Q = mgH_Q = mg \\left(\\dfrac{u^2}{2g}\\right) = \\dfrac{mu^2}{2}$.<br><br>The ratio of their potential energies at the highest point is $\\dfrac{U_P}{U_Q} = \\dfrac{\\dfrac{mu^2}{8}}{\\dfrac{mu^2}{2}} = \\dfrac{2}{8} = \\dfrac{1}{4}$.<br><br>Answer: $1 : 4$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2bf8c30a4553e1bdc63", "type": "singleCorrect", "question": {"text": "Two balls A and B are projected at an angle of $45^\\circ$ and $60^\\circ$ respectively, so that the maximum heights reached are same for both. The ratio of initial velocity of projection of ball A to that for ball B is<br>$(\\sin 30^\\circ = \\cos 60^\\circ = \\dfrac{1}{2},\\ \\sin 45^\\circ = \\cos 45^\\circ = \\dfrac{1}{\\sqrt{2}},\\ \\sin 60^\\circ = \\cos 30^\\circ = \\dfrac{\\sqrt{3}}{2})$", "image": null}, "options": [{"id": "88AWG", "label": "A", "text": "$2 : \\sqrt{3}$", "isCorrect": false, "image": null}, {"id": "sl52S", "label": "B", "text": "$\\sqrt{3} : 2$", "isCorrect": false, "image": null}, {"id": "PADHD", "label": "C", "text": "$\\sqrt{2} : \\sqrt{3}$", "isCorrect": false, "image": null}, {"id": "NFu2S", "label": "D", "text": "$\\sqrt{3} : \\sqrt{2}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The maximum height reached by a projectile is given by $H = \\dfrac{u^2 \\sin^2 \\theta}{2g}$<br><br>For ball A, $H_A = \\dfrac{u_A^2 \\sin^2 45^\\circ}{2g}$<br><br>For ball B, $H_B = \\dfrac{u_B^2 \\sin^2 60^\\circ}{2g}$<br><br>Since $H_A = H_B$, we have:<br><br>$\\dfrac{u_A^2 \\sin^2 45^\\circ}{2g} = \\dfrac{u_B^2 \\sin^2 60^\\circ}{2g}$<br><br>$u_A \\sin 45^\\circ = u_B \\sin 60^\\circ$<br><br>$\\dfrac{u_A}{u_B} = \\dfrac{\\sin 60^\\circ}{\\sin 45^\\circ}$<br><br>Substituting the values $\\sin 60^\\circ = \\dfrac{\\sqrt{3}}{2}$ and $\\sin 45^\\circ = \\dfrac{1}{\\sqrt{2}}$:<br><br>$\\dfrac{u_A}{u_B} = \\dfrac{\\dfrac{\\sqrt{3}}{2}}{\\dfrac{1}{\\sqrt{2}}} = \\dfrac{\\sqrt{3}}{\\sqrt{2}}$<br><br>The ratio of initial velocity of projection of ball A to that for ball B is $\\sqrt{3} : \\sqrt{2}$.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ce8c30a4553e1bdd02", "type": "singleCorrect", "question": {"text": "Two objects are projected with same velocity 'u' at different angles $\\alpha$ and $\\beta$ with the horizontal. If $\\alpha + \\beta = 90^\\circ$, the ratio of horizontal range of the first object to the second object will be $[\\sin(\\pi - \\theta) = \\sin\\theta]$", "image": null}, "options": [{"id": "DxiVU", "label": "A", "text": "$4 : 1$", "isCorrect": false, "image": null}, {"id": "BOSsY", "label": "B", "text": "$2 : 1$", "isCorrect": false, "image": null}, {"id": "H7D3J", "label": "C", "text": "$1 : 1$", "isCorrect": true, "image": null}, {"id": "kwott", "label": "D", "text": "$1 : 2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The horizontal range of a projectile is given by $R = \\dfrac{u^2 \\sin(2\\theta)}{g}$.<br><br>For the first object projected at angle $\\alpha$, the range is $R_1 = \\dfrac{u^2 \\sin(2\\alpha)}{g}$.<br><br>For the second object projected at angle $\\beta$, the range is $R_2 = \\dfrac{u^2 \\sin(2\\beta)}{g}$.<br><br>Given $\\alpha + \\beta = 90^\\circ$, we have $\\beta = 90^\\circ - \\alpha$.<br><br>Substituting $\\beta$ in the expression for $R_2$:<br><br>$R_2 = \\dfrac{u^2 \\sin(2(90^\\circ - \\alpha))}{g} = \\dfrac{u^2 \\sin(180^\\circ - 2\\alpha)}{g}$<br><br>Using the identity $\\sin(180^\\circ - \\theta) = \\sin\\theta$, we get:<br><br>$R_2 = \\dfrac{u^2 \\sin(2\\alpha)}{g}$<br><br>Thus, $R_1 = R_2$, which means the ratio of their horizontal ranges is $1 : 1$.<br><br>Answer: $1 : 1$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2df8c30a4553e1bddb6", "type": "singleCorrect", "question": {"text": "A batsman hits a ball with a velocity 'v', making an angle of $60^\\circ$ with the vertical. After some time direction of velocity is making an angle of $60^\\circ$ with the horizontal. The speed of the ball at this instant is<br>$\\left[\\cos(60^\\circ) = \\dfrac{1}{2}, \\cos(30^\\circ) = \\dfrac{\\sqrt{3}}{2}\\right]$", "image": null}, "options": [{"id": "MUTEt", "label": "A", "text": "$\\dfrac{\\sqrt{3}}{2}v$", "isCorrect": false, "image": null}, {"id": "lRIq2", "label": "B", "text": "$\\sqrt{3}v$", "isCorrect": true, "image": null}, {"id": "RTbk8", "label": "C", "text": "$\\dfrac{v}{2}$", "isCorrect": false, "image": null}, {"id": "REgjE", "label": "D", "text": "$V$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The initial angle of the velocity with the vertical is $60^\\circ$. Therefore, the initial angle with the horizontal is $90^\\circ - 60^\\circ = 30^\\circ$.<br><br>The horizontal component of the initial velocity is $u_x = v \\cos(30^\\circ)$.<br><br>Let the speed of the ball be $v'$ when its direction of motion makes an angle of $60^\\circ$ with the horizontal. The horizontal component of velocity at this instant is $v'_x = v' \\cos(60^\\circ)$.<br><br>In projectile motion, the horizontal component of velocity remains constant throughout the flight.<br><br>Equating the horizontal components of velocity:<br><br>$v' \\cos(60^\\circ) = v \\cos(30^\\circ)$<br><br>Substituting the given trigonometric values:<br><br>$v' \\left(\\dfrac{1}{2}\\right) = v \\left(\\dfrac{\\sqrt{3}}{2}\\right)$<br><br>$v' = \\sqrt{3}v$<br><br>Answer: $\\sqrt{3}v$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b94bf9280d7f9932a8c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A body when projected at an angle ' $\\theta$ ' with the horizontal reaches a maximum height ' H '. The time of flight of the body will be ( $g=$ acceleration due to gravity)", "image": null}, "options": [{"id": "ebfUj", "text": "$\\frac{1}{2} \\sqrt{\\frac{2 \\mathrm{H}}{\\mathrm{g}}}$", "image": null, "isCorrect": false}, {"id": "ivIWD", "text": "$\\sqrt{\\frac{g}{2 H}}$", "image": null, "isCorrect": false}, {"id": "2M9R3", "text": "$2 \\sqrt{\\frac{2 \\mathrm{H}}{\\mathrm{g}}}$", "image": null, "isCorrect": true}, {"id": "tzmJg", "text": "$\\sqrt{\\frac{2 \\mathrm{H}}{\\mathrm{g}}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The maximum height of a projectile is given by:<br><br>$H = \\dfrac{u^2 \\sin^2 \\theta}{2g}$<br><br>From this, we can write the vertical component of velocity as:<br><br>$u \\sin \\theta = \\sqrt{2gH}$<br><br>The time of flight of the projectile is given by:<br><br>$T = \\dfrac{2u \\sin \\theta}{g}$<br><br>Substituting the value of $u \\sin \\theta$ into the equation for time of flight:<br><br>$T = \\dfrac{2 \\sqrt{2gH}}{g}$<br><br>$T = 2 \\sqrt{\\dfrac{2H}{g}}$<br><br>Answer: $2 \\sqrt{\\frac{2 \\mathrm{H}}{\\mathrm{g}}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792136c0aee93fa0796d8ad", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "For a projectile, the maximum height and horizontal range are same. The angle of projection ' $\\theta$ ' of the projectile is", "image": null}, "options": [{"id": "0g4Tw", "text": "$\\tan ^{-1}\\left(\\dfrac{1}{2}\\right)$", "image": null, "isCorrect": false}, {"id": "3eIqp", "text": "$\\tan ^{-1}(2)$", "image": null, "isCorrect": false}, {"id": "wDAyo", "text": "$\\tan ^{-1}\\left(\\dfrac{1}{4}\\right)$", "image": null, "isCorrect": false}, {"id": "P6xb6", "text": "$\\tan ^{-1}(4)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The maximum height of a projectile is given by $H = \\dfrac{u^2 \\sin^2 \\theta}{2g}$<br><br>The horizontal range of a projectile is given by $R = \\dfrac{u^2 \\sin 2\\theta}{g} = \\dfrac{2u^2 \\sin \\theta \\cos \\theta}{g}$<br><br>Given that the maximum height and horizontal range are equal, $H = R$<br><br>$\\dfrac{u^2 \\sin^2 \\theta}{2g} = \\dfrac{2u^2 \\sin \\theta \\cos \\theta}{g}$<br><br>$\\dfrac{\\sin \\theta}{2} = 2 \\cos \\theta$<br><br>$\\dfrac{\\sin \\theta}{\\cos \\theta} = 4$<br><br>$\\tan \\theta = 4$<br><br>$\\theta = \\tan^{-1}(4)$<br><br>Answer: $\\tan ^{-1}(4)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213450aee93fa0796d77d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "A ball 'A' is projected vertically upwards with certain initial speed. Another ball ' $B$ ' of same mass is projected at an angle of $30^{\\circ}$ with vertical with the same initial speed. At the highest point, the ratio of potential energy of ball $A$ to that of ball B will be\r\n$\\left(\\sin 90^{\\circ}=1, \\sin 60^{\\circ}=\\cos 30^{\\circ}=\\dfrac{\\sqrt{3}}{2}, \\sin 30^{\\circ}=\\cos 60^{\\circ}=\\dfrac{1}{2}\\right)$", "image": null}, "options": [{"id": "av3Az", "text": "$4: 3$", "image": null, "isCorrect": true}, {"id": "rl5L1", "text": "$3: 4$", "image": null, "isCorrect": false}, {"id": "3fuoB", "text": "$4: 1$", "image": null, "isCorrect": false}, {"id": "0nxtY", "text": "$3: 2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the initial speed of both balls be $u$ and their mass be $m$.<br><br>For ball A, projected vertically upwards:<br>Maximum height $H_A = \\dfrac{u^2}{2g}$<br>Potential energy at the highest point $U_A = mgH_A = \\dfrac{mu^2}{2}$<br><br>For ball B, projected at an angle of $30^{\\circ}$ with the vertical:<br>The vertical component of initial velocity is $u_y = u \\cos 30^{\\circ} = \\dfrac{u\\sqrt{3}}{2}$<br>Maximum height $H_B = \\dfrac{u_y^2}{2g} = \\dfrac{u^2 \\cos^2 30^{\\circ}}{2g} = \\dfrac{3u^2}{8g}$<br>Potential energy at the highest point $U_B = mgH_B = \\dfrac{3mu^2}{8}$<br><br>The ratio of their potential energies is:<br>$\\dfrac{U_A}{U_B} = \\dfrac{\\dfrac{mu^2}{2}}{\\dfrac{3mu^2}{8}} = \\dfrac{4}{3}$<br><br>Answer: $4: 3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262550279619d9d8a33af", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "A stone is projected at angle ' $\\theta$ ' with velocity ' $u$ '. If it executes nearly a circular motion at its maximum point for short time, the radius of the circular path will be ( $\\mathrm{g}=$ acceleration due to gravity)", "image": null}, "options": [{"id": "uM21P", "text": "$\\frac{\\mathrm{u}^2}{\\mathrm{~g}}$", "image": null, "isCorrect": false}, {"id": "7ZnAb", "text": "$\\frac{\\mathrm{u}^2 \\cos ^2 \\theta}{\\mathrm{g}}$", "image": null, "isCorrect": true}, {"id": "6CRZR", "text": "$\\frac{\\mathrm{u}^2 \\sin ^2 \\theta}{\\mathrm{g}}$", "image": null, "isCorrect": false}, {"id": "GDntb", "text": "$\\frac{\\mathrm{u}^2 \\cos ^2 \\theta}{2 \\mathrm{~g}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Horizontal velocity at highest point:\n$\\mathrm{v}_{\\mathrm{x}}=\\mathrm{u}_{\\mathrm{x}}=\\mathrm{u} \\cos \\theta$\n$\\mathrm{a}=\\frac{\\mathrm{v}_{\\mathrm{x}}{ }^2}{\\mathrm{R}}$\n$a=g$\n$\\therefore \\quad \\mathrm{R}=\\frac{\\mathrm{v}_{\\mathrm{x}}{ }^2}{\\mathrm{~g}}=\\frac{(\\mathrm{u} \\cos \\theta)^2}{\\mathrm{~g}}=\\frac{\\mathrm{u}^2 \\cos ^2 \\theta}{\\mathrm{g}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261850279619d9d8a2d40", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "A shell is fired at an angle of $30^{\\circ}$ to the horizontal with velocity $196 \\mathrm{~m} / \\mathrm{s}$. The time of flight is $\\left[\\sin 30^{\\circ}=\\frac{1}{2}=\\cos 60^{\\circ}\\right]$", "image": null}, "options": [{"id": "a4C6T", "text": "$10 \\mathrm{~s}$", "image": null, "isCorrect": false}, {"id": "bBasH", "text": "$16.5 \\mathrm{~s}$", "image": null, "isCorrect": false}, {"id": "FE1Ge", "text": "$20 \\mathrm{~s}$", "image": null, "isCorrect": true}, {"id": "csDCT", "text": "$6.5 \\mathrm{~s}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We know the time of flight for a projectile is given by:\n$$\nt=\\frac{2 u \\sin \\theta}{g}\n$$\nOn placing given values in the above equation:\n$$\nt=\\frac{20 \\times(196 \\mathrm{~m} / \\mathrm{s}) \\times \\sin \\left(30^{\\circ}\\right)}{\\left(9.81 \\mathrm{~m} / \\mathrm{s}^2\\right)}=20 \\mathrm{~s}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261260279619d9d8a2a34", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "An aeroplane is flying in a horizontal direction with a velocity of $540 \\mathrm{~km} / \\mathrm{hr}$ at a height of $1960 \\mathrm{~m}$. When it is vertically above the point A on the ground, a body is dropped from it. The body strikes the ground at point $\\mathrm{B}$. The distance $\\mathrm{AB}$ is equal to\n$\\left(\\mathrm{g}=9.8 \\mathrm{~m} / \\mathrm{s}^2\\right)$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/_M2_ATfb_XeseJ0HyjrEkmh2n13sRxacehFH-5HAWiw.original.fullsize.png\">", "image": null}, "options": [{"id": "u1Cqy", "text": "$2000 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "kufQ6", "text": "$3000 \\mathrm{~m}$", "image": null, "isCorrect": true}, {"id": "TURGQ", "text": "$3600 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "JrGPv", "text": "$4000 \\mathrm{~m}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From $\\mathrm{h}=\\frac{1}{2} \\mathrm{gt}^2$\nWe have $\\mathrm{t}_{\\mathrm{OB}}=\\sqrt{\\frac{2 \\mathrm{~h}_{\\mathrm{OB}}}{\\mathrm{g}}}=\\sqrt{\\frac{2 \\times 1960}{9.8}}=20 \\mathrm{~s}$\nHorizontal distance $\\mathrm{AB}=\\mathrm{vt}_{\\mathrm{OB}}=\\left(540 \\times \\frac{5}{18} \\mathrm{~m} / \\mathrm{s}\\right)(20 \\mathrm{~s})=3000 \\mathrm{~m}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260f30279619d9d8a2897", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}], "question": {"text": "A projectile thrown from the ground has initial speed ' $u$ ' and its direction makes an angle ' $q$ ' with the horizontal. If at maximum height from ground, the speed of projectile is half its initial speed of projection, then the maximum height reached by the projectile is\n$\\begin{aligned} & \\text { [g }=\\text { acceleration due to gravity, } \\sin 30^{\\circ}=\\cos 60^{\\circ}=0.5, \\\\ & \\left.\\cos 30^{\\circ}=\\sin 60^{\\circ}=\\sqrt{3} / 2\\right]\\end{aligned}$", "image": null}, "options": [{"id": "e8gDq", "text": "$\\frac{2 \\mathrm{u}^2}{\\mathrm{~g}}$", "image": null, "isCorrect": false}, {"id": "qNnYm", "text": "$\\frac{3 u^2}{8 g}$", "image": null, "isCorrect": true}, {"id": "DG4Cj", "text": "$\\frac{\\mathrm{u}^2}{\\mathrm{~g}}$", "image": null, "isCorrect": false}, {"id": "pgju5", "text": "$\\frac{\\mathrm{u}^4}{2 \\mathrm{~g}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given at maximum height\n$\\begin{aligned} & \\mathrm{u} \\cos \\theta=\\frac{1}{2} \\mathrm{u} \\Rightarrow \\cos \\theta=\\frac{1}{2} \\\\ & \\therefore \\theta=60^{\\circ}\\end{aligned}$\nWe know, $\\mathrm{H}_{\\max }=\\frac{\\mathrm{u}^2 \\sin ^2 \\theta}{2 \\mathrm{~g}}=\\frac{\\mathrm{u}^2 \\sin ^2 60^{\\circ}}{2 \\mathrm{~g}}=\\frac{3 \\mathrm{u}^2}{8 \\mathrm{~g}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260b70279619d9d8a26bc", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "A projectile is thrown with an initial velocity $(\\hat{a}+b \\hat{j}) \\mathrm{m} / \\mathrm{s}$, where $\\hat{i}$ and $\\hat{j}$ are unit vectors along horizontal and vertical directions respectively. If the range of the projectile is twice the maximum height reached by it, then", "image": null}, "options": [{"id": "AzuCH", "text": "$\\mathrm{b}=2 \\mathrm{a}$", "image": null, "isCorrect": true}, {"id": "nSaiv", "text": "$\\mathrm{b}=4 \\mathrm{a}$", "image": null, "isCorrect": false}, {"id": "3OhJL", "text": "$\\mathrm{b}=\\frac{\\mathrm{a}}{2}$", "image": null, "isCorrect": false}, {"id": "N7Tkg", "text": "$\\mathrm{b}=\\mathrm{a}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{u}_{\\mathrm{x}}=\\mathrm{a}=$ Horizontal component of the velocity\n$\\mathrm{u}_{\\mathrm{y}}=\\mathrm{b}=$ Vertical component of the velocity\nMaximum height, $\\mathrm{H}=\\frac{\\mathrm{u}_{\\mathrm{y}}^2}{2 \\mathrm{~g}}=\\frac{\\mathrm{b}^2}{2 \\mathrm{~g}}$\nRange, $\\mathrm{R}=\\frac{2 \\mathrm{u}_{\\mathrm{y}} \\mathrm{u}_{\\mathrm{x}}}{\\mathrm{g}}=\\frac{2 \\mathrm{ba}}{\\mathrm{g}}$\n$$\n\\begin{aligned}\n& \\because \\mathrm{R}=2 \\mathrm{H} \\\\\n& \\therefore \\frac{2 \\mathrm{ba}}{\\mathrm{g}}=\\frac{2 \\mathrm{~b}^2}{2 \\mathrm{~g}} \\\\\n& \\therefore \\mathrm{b}=2 \\mathrm{a}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260900279619d9d8a2586", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "A stone is projected vertically upwards with velocity ' $\\mathrm{V}$.\nAnother stone of same mass is projected at an angle of $60^{\\circ}$ with the vertical with the same speed (V). The ratio of their potential energies at the highest points of their journey, is", "image": null}, "options": [{"id": "kWrEj", "text": "1:1", "image": null, "isCorrect": false}, {"id": "9UERI", "text": "4:1", "image": null, "isCorrect": true}, {"id": "CZOqq", "text": "3:2", "image": null, "isCorrect": false}, {"id": "LujAw", "text": "2:1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Maximum height, $\\mathrm{h}=\\frac{\\mathrm{u}^2 \\sin ^2 \\theta}{2 \\mathrm{~g}}$\nFor the first stone $\\theta=90^{\\circ}, \\sin 90^{\\circ}=1$\n$$\n\\therefore \\mathrm{h}_1=\\frac{\\mathrm{u}^2}{2 \\mathrm{~g}}=\\frac{\\mathrm{V}^2}{2 \\mathrm{~g}}\n$$\nFor the second stone, $\\mathrm{h}_2=\\frac{\\mathrm{v}^2 \\sin ^2 30^{\\circ}}{2 \\mathrm{~g}}=\\frac{\\mathrm{V}^2}{8 \\mathrm{~g}}$ The masses are same. Hence ratio of potential energies\n$$\n\\frac{\\mathrm{U}_1}{\\mathrm{U}_2}=\\frac{\\mathrm{h}_1}{\\mathrm{~h}_2}=4\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260480279619d9d8a233d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "A bomb is dropped by an aero plane flying horizontally with a velocity $200 \\mathrm{~km} / \\mathrm{hr}$ and at a height of $980 \\mathrm{~m}$. At the time of dropping a bomb, the distance of the aero plane from the target on the ground to hit directly is $\\left(\\mathrm{g}=9.8 \\mathrm{~m} / \\mathrm{s}^2\\right.$ )", "image": null}, "options": [{"id": "CnEH3", "text": "$\\frac{\\sqrt{2} \\times 10^4}{9} \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "t8WRX", "text": "$\\frac{10^4}{9} \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "zscFG", "text": "$\\frac{10^4}{9 \\sqrt{2}} \\mathrm{~m}$", "image": null, "isCorrect": true}, {"id": "6CuCz", "text": "$\\frac{10^4}{18} \\mathrm{~m}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The plane is flying horizontally. Hence initial vertical component of the velocity is zero.\nIf it reaches the ground in time $t$, then\n$$\n\\begin{aligned}\n& \\mathrm{h}=\\frac{1}{2} \\mathrm{gt}^2 \\\\\n& \\mathrm{t}^2=\\frac{2 \\mathrm{~h}}{\\mathrm{~g}}=\\frac{2 \\times 980}{9.8}=200 \\\\\n& \\mathrm{t}=10 \\sqrt{2} \\mathrm{~s}\n\\end{aligned}\n$$\nThe horizontal component of the velocity is\n\n$$\n\\mathrm{V}=200 \\mathrm{~km} / \\mathrm{hr}=200 \\times \\frac{5}{18}=\\frac{1000}{18} \\mathrm{~m} / \\mathrm{s}\n$$\nThe horizontal distance to be covered is\n$$\n\\mathrm{d}=\\mathrm{Vt}=\\frac{1000}{18} \\times 10 \\sqrt{2}=\\frac{10^4}{9 \\sqrt{2}} \\mathrm{~m}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260250279619d9d8a2220", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "A cricket player hit a ball like a projectile, but the fielder caught the ball after 2 second. The maximum height reached by the ball is\n$$\n\\left(\\mathrm{g}=10 \\mathrm{~m} / \\mathrm{s}^2\\right)\n$$", "image": null}, "options": [{"id": "r7EGh", "text": "$2 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "JiEs0", "text": "$5 \\mathrm{~m}$", "image": null, "isCorrect": true}, {"id": "k1zHL", "text": "$4 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "E59Me", "text": "$3 \\mathrm{~m}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Time of flight, $\\mathrm{T}=\\frac{2 \\mathrm{u} \\sin \\theta}{\\mathrm{g}}=2 \\mathrm{~s}$\n$\\therefore \\mathrm{u} \\sin \\theta=\\mathrm{g}=10$\nMaximum height, $\\mathrm{H}=\\frac{\\mathrm{u}^2 \\sin ^2 \\theta}{2 \\mathrm{~g}}=\\frac{(10)^2}{2 \\times 10}=5 \\mathrm{~m}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "68871e95bf9280d7f9933086", "title": "Relative motion", "totalQuestions": 4, "questions": [{"_id": "6abb882a15a9fc0fc8c14125", "type": "singleCorrect", "question": {"text": "Airplanes A and B are flying with constant velocity in the same vertical plane at angles $30^\\circ$ and $60^\\circ$ with respect to the horizontal as shown in the figure. The speed of A is $100\\sqrt{3}$ m/s. At time $t = 0$ s, an observer in A finds B at a distance of $500$ m. This observer sees B moving with a constant velocity perpendicular to the line of motion of A. If at $t = t_0$, A just escapes being hit by B, $t_0$ in second is<br>$\\{\\sin(30)^\\circ= 0.5, \\cos(30)^\\circ=3^{0.5}/2\\}$<br><img style=\"width: 300px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/may/watermarked_images/12_may_shift_1__q3_d1_v2.png\" />", "image": null}, "options": [{"id": "B2o98", "label": "A", "text": "$2$", "isCorrect": false, "image": null}, {"id": "g9kiu", "label": "B", "text": "$3$", "isCorrect": false, "image": null}, {"id": "fvZnw", "label": "C", "text": "$4$", "isCorrect": false, "image": null}, {"id": "F5GU8", "label": "D", "text": "$5$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let the direction of motion of airplane A be along the x-axis. The velocity of A is $\\vec{v}_A = 100\\sqrt{3} \\hat{i}$ m/s.<br><br>Since airplane A flies at $30^\\circ$ and airplane B flies at $60^\\circ$ with respect to the horizontal, the angle between their directions of motion is $60^\\circ - 30^\\circ = 30^\\circ$.<br><br>The velocity of B can be written as:<br>$\\vec{v}_B = v_B \\cos(30^\\circ) \\hat{i} + v_B \\sin(30^\\circ) \\hat{j}$<br><br>The relative velocity of B with respect to A is:<br>$\\vec{v}_{BA} = \\vec{v}_B - \\vec{v}_A = (v_B \\cos(30^\\circ) - 100\\sqrt{3}) \\hat{i} + v_B \\sin(30^\\circ) \\hat{j}$<br><br>It is given that the observer in A sees B moving perpendicular to the line of motion of A. This means the component of $\\vec{v}_{BA}$ along the x-axis is zero:<br>$v_B \\cos(30^\\circ) - 100\\sqrt{3} = 0$<br>$v_B \\left(\\dfrac{\\sqrt{3}}{2}\\right) = 100\\sqrt{3} \\Rightarrow v_B = 200$ m/s<br><br>The relative velocity of B with respect to A is then:<br>$\\vec{v}_{BA} = 200 \\sin(30^\\circ) \\hat{j} = 200 \\left(\\dfrac{1}{2}\\right) \\hat{j} = 100 \\hat{j}$ m/s<br><br>The magnitude of the relative velocity is $|\\vec{v}_{BA}| = 100$ m/s.<br><br>For A to just escape being hit by B, the initial relative distance of $500$ m must be covered by B in the frame of A. The time taken for this is:<br>$t_0 = \\dfrac{500}{100} = 5$ s<br><br>Answer: $5$", "image": null}, "level": 3, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3328c30a4553e1be138", "type": "singleCorrect", "question": {"text": "Two boys are standing at points A and B on ground where distance AB = a. The boy at point B starts running perpendicular to line AB with velocity '$V_1$'. The boy at point A starts running simultaneously with velocity 'V' and catches the other boy in time 't'. The value of 't' is", "image": null}, "options": [{"id": "3zwAk", "label": "A", "text": "$\\left[\\dfrac{a^2}{(V^2 - V_1^2)}\\right]^{\\frac{1}{2}}$", "isCorrect": true, "image": null}, {"id": "J5p2v", "label": "B", "text": "$\\left[\\dfrac{a^2}{(V_1^2 - V^2)}\\right]^{\\frac{1}{2}}$", "isCorrect": false, "image": null}, {"id": "gkNUm", "label": "C", "text": "$\\left[\\dfrac{a^2}{(V^2 - V_1^2)}\\right]$", "isCorrect": false, "image": null}, {"id": "xNezh", "label": "D", "text": "$\\left[\\dfrac{a^2}{(V_1^2 - V^2)}\\right]$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the meeting point be C.<br><br>In the right-angled triangle ABC, the initial distance AB is $a$.<br><br>Since the boy at B runs perpendicular to AB, the angle at B is $90^{\\circ}$.<br><br>The distance travelled by the boy from B is $BC = V_1 t$.<br><br>The distance travelled by the boy from A is $AC = V t$.<br><br>Using Pythagoras theorem in $\\triangle ABC$:<br><br>$(AC)^2 = (AB)^2 + (BC)^2$<br><br>$(V t)^2 = a^2 + (V_1 t)^2$<br><br>$V^2 t^2 - V_1^2 t^2 = a^2$<br><br>$t^2 (V^2 - V_1^2) = a^2$<br><br>$t = \\left[\\dfrac{a^2}{V^2 - V_1^2}\\right]^{\\dfrac{1}{2}}$<br><br>Answer: $\\left[\\dfrac{a^2}{(V^2 - V_1^2)}\\right]^{\\frac{1}{2}}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bb5bf9280d7f9932bc2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Two girls are standing at the ends 'A' and 'B' of a ground where $A B=b$. The girl at ' $B$ ' starts running in a direction perpendicular to ' AB ' with velocity ' $\\mathrm{V}_1$ '. The girl at 'A' starts running simultaneously with velocity ' $\\mathrm{V}_2$ ' and in shortest distance meets the other girl in time ' t '. The value of ' $t$ ' is", "image": null}, "options": [{"id": "vOLq7", "text": "$\\frac{b}{\\sqrt{V_1{ }^2+V_2{ }^2}}$", "image": null, "isCorrect": false}, {"id": "vWmWC", "text": "$\\frac{b}{V_1+V_2}$", "image": null, "isCorrect": false}, {"id": "Vdq7w", "text": "$\\frac{b}{V_2-V_1}$", "image": null, "isCorrect": false}, {"id": "rYlqy", "text": "$\\frac{b}{\\sqrt{V_2{ }^2-V_1{ }^2}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let the initial positions of the two girls be A and B, with $AB = b$.<br><br>The girl at B runs in a direction perpendicular to AB with velocity $V_1$. Let the meeting point be C. The distance covered by her in time $t$ is $BC = V_1 t$.<br><br>The girl at A runs with velocity $V_2$ and meets the other girl at C in time $t$. The distance covered by her is $AC = V_2 t$.<br><br>Since the path of the girl at B is perpendicular to AB, $\\triangle ABC$ is a right-angled triangle with the right angle at B.<br><br>Using Pythagoras theorem in $\\triangle ABC$:<br><br>$AC^2 = AB^2 + BC^2$<br><br>$(V_2 t)^2 = b^2 + (V_1 t)^2$<br><br>$V_2^2 t^2 - V_1^2 t^2 = b^2$<br><br>$t^2 (V_2^2 - V_1^2) = b^2$<br><br>$t = \\dfrac{b}{\\sqrt{V_2^2 - V_1^2}}$<br><br>Answer: $\\frac{b}{\\sqrt{V_2{ }^2-V_1{ }^2}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba4bf9280d7f9932b27", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Two boys are standing at points $A$ and $B$ on ground, where distance $A B=x$. The boy at $B$ stars running perpendicular to $A B$ with velocity $V_1$. The boy at A starts running simultaneously with velocity v and meets the other boy in time $t$. The value of $t$ is", "image": null}, "options": [{"id": "5FkCe", "text": "$\\left[\\frac{x}{v-v_1}\\right]^{1 / 2}$", "image": null, "isCorrect": false}, {"id": "FPokr", "text": "$\\left[\\frac{x}{v_1-v}\\right]^{1 / 2}$", "image": null, "isCorrect": false}, {"id": "EzW7G", "text": "$\\left[\\frac{x^2}{v^2-v_1^2}\\right]^{1 / 2}$", "image": null, "isCorrect": true}, {"id": "bEa6k", "text": "$\\left[\\frac{x^2}{v_1^2-v^2}\\right]^{1 / 2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the meeting point be $C$.<br><br>Since boy $B$ runs perpendicular to $AB$, $\\triangle ABC$ is a right-angled triangle at $B$.<br><br>Distance covered by boy $B$ in time $t$ is $BC = v_1 t$.<br><br>Distance covered by boy $A$ in time $t$ is $AC = v t$.<br><br>Using Pythagoras theorem in $\\triangle ABC$:<br><br>$AC^2 = AB^2 + BC^2$<br><br>$(v t)^2 = x^2 + (v_1 t)^2$<br><br>$v^2 t^2 - v_1^2 t^2 = x^2$<br><br>$t^2 (v^2 - v_1^2) = x^2$<br><br>$t = \\left[\\dfrac{x^2}{v^2 - v_1^2}\\right]^{1/2}$<br><br>Answer: $\\left[\\frac{x^2}{v^2-v_1^2}\\right]^{1 / 2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a263450279619d9d8a3da7", "title": "Uniform Circular Motion", "totalQuestions": 91, "questions": [{"_id": "6abb883b15a9fc0fc8c141c3", "type": "singleCorrect", "question": {"text": "A particle moves along a circular path of radius '$r$' with uniform speed '$v$'. The angle described by the particle in two seconds in radians is", "image": null}, "options": [{"id": "AAsT7", "label": "A", "text": "$vr^2$", "isCorrect": false, "image": null}, {"id": "wVQX2", "label": "B", "text": "$v/r$", "isCorrect": false, "image": null}, {"id": "ZWiIO", "label": "C", "text": "$2v/r$", "isCorrect": true, "image": null}, {"id": "S1WWI", "label": "D", "text": "$r/2v$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The angular speed of the particle is given by $\\omega = \\dfrac{v}{r}$.<br><br>The angle described by the particle in time $t$ is $\\theta = \\omega t$.<br><br>Given $t = 2$ seconds, the angle described is $\\theta = \\dfrac{v}{r} \\times 2 = \\dfrac{2v}{r}$.<br><br>Answer: $2v/r$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88ad15a9fc0fc8c145f6", "type": "singleCorrect", "question": {"text": "Angular velocity of hour hand of a watch is (in rad/s)", "image": null}, "options": [{"id": "HyOwK", "label": "A", "text": "$\\dfrac{\\pi}{43200}$", "isCorrect": false, "image": null}, {"id": "6zH0O", "label": "B", "text": "$\\dfrac{\\pi}{30}$", "isCorrect": false, "image": null}, {"id": "4TySG", "label": "C", "text": "$\\dfrac{\\pi}{21600}$", "isCorrect": true, "image": null}, {"id": "K1ipM", "label": "D", "text": "$\\dfrac{\\pi}{1800}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Time taken by the hour hand to complete one revolution is $T = 12 \\text{ hours}$.<br><br>$T = 12 \\times 60 \\times 60 \\text{ s} = 43200 \\text{ s}$<br><br>Angular velocity $\\omega = \\dfrac{2\\pi}{T}$<br><br>$\\omega = \\dfrac{2\\pi}{43200} = \\dfrac{\\pi}{21600} \\text{ rad/s}$<br><br>Answer: $\\dfrac{\\pi}{21600}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885b15a9fc0fc8c142ee", "type": "singleCorrect", "question": {"text": "The real force F acting on particle of mass m performing circular motion acts along the radius of circle r and is directed forwards the centre of the circle. The magnitude of square root of such a force is (T = periodic time)", "image": null}, "options": [{"id": "KCqHx", "label": "A", "text": "$\\dfrac{2\\pi \\sqrt{mr}}{T}$", "isCorrect": true, "image": null}, {"id": "peumk", "label": "B", "text": "$\\dfrac{Tmr}{4\\pi}$", "isCorrect": false, "image": null}, {"id": "vRyoW", "label": "C", "text": "$\\dfrac{2\\pi T}{\\sqrt{mr}}$", "isCorrect": false, "image": null}, {"id": "W99Te", "label": "D", "text": "$\\dfrac{T^2 mr}{4\\pi}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The centripetal force acting on a particle of mass $m$ in circular motion of radius $r$ is given by $F = m \\omega^2 r$.<br><br>Since the angular velocity $\\omega = \\dfrac{2\\pi}{T}$, where $T$ is the time period, the force becomes:<br><br>$F = m \\left(\\dfrac{2\\pi}{T}\\right)^2 r = \\dfrac{4\\pi^2 m r}{T^2}$<br><br>The magnitude of the square root of this force is:<br><br>$\\sqrt{F} = \\sqrt{\\dfrac{4\\pi^2 m r}{T^2}} = \\dfrac{2\\pi \\sqrt{mr}}{T}$<br><br>Answer: $\\dfrac{2\\pi \\sqrt{mr}}{T}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb882b15a9fc0fc8c1412d", "type": "singleCorrect", "question": {"text": "Two particles A and B are moving in uniform circular motion in concentric circles of radii $r_A$ and $r_B$ with speeds $v_A$ and $v_B$ respectively. $T_A$ and $T_B$ are the time periods of rotation of the particles respectively and their relation is $T_A=3T_B$. The ratio of angular speed of B to that of A will be", "image": null}, "options": [{"id": "tFiCl", "label": "A", "text": "$r_B : 3r_A$", "isCorrect": false, "image": null}, {"id": "lNnhc", "label": "B", "text": "$3r_B : r_A$", "isCorrect": false, "image": null}, {"id": "cXHpa", "label": "C", "text": "$1 : 3$", "isCorrect": false, "image": null}, {"id": "K6ChL", "label": "D", "text": "$3 : 1$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The angular speed of a particle in circular motion is given by $\\omega = \\dfrac{2\\pi}{T}$, where $T$ is the time period.<br><br>For particle A, $\\omega_A = \\dfrac{2\\pi}{T_A}$<br><br>For particle B, $\\omega_B = \\dfrac{2\\pi}{T_B}$<br><br>The ratio of angular speed of B to that of A is:<br><br>$\\dfrac{\\omega_B}{\\omega_A} = \\dfrac{T_A}{T_B}$<br><br>Given $T_A = 3T_B$, substituting this in the above equation gives:<br><br>$\\dfrac{\\omega_B}{\\omega_A} = \\dfrac{3T_B}{T_B} = \\dfrac{3}{1}$<br><br>Thus, the ratio is $3 : 1$.<br><br>Answer: $3 : 1$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a68c30a4553e1bdb50", "type": "singleCorrect", "question": {"text": "A particle completes 2 revolutions in a circular path of radius 3 cm. The angular displacement of the particle will be (in radian)", "image": null}, "options": [{"id": "Cen0s", "label": "A", "text": "$\\pi$", "isCorrect": false, "image": null}, {"id": "vUgB9", "label": "B", "text": "$2\\pi$", "isCorrect": false, "image": null}, {"id": "SWylb", "label": "C", "text": "$3\\pi$", "isCorrect": false, "image": null}, {"id": "n8Twq", "label": "D", "text": "$4\\pi$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Angular displacement for one complete revolution is $2\\pi$ radians.<br><br>For $2$ complete revolutions, the angular displacement is given by $\\theta = 2 \\times 2\\pi = 4\\pi$ radians.<br><br>The radius of the circular path does not affect the angular displacement.<br><br>Answer: $4\\pi$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a58c30a4553e1bdb4b", "type": "singleCorrect", "question": {"text": "A car is travelling at 40 m/s on a circular path of radius 40 m. It is increasing its speed at the rate of $2\\ \\text{m/s}^2$. Its net acceleration is (in $\\text{m/s}^2$) nearly", "image": null}, "options": [{"id": "7Z3gm", "label": "A", "text": "$4\\ \\text{m/s}^2$", "isCorrect": false, "image": null}, {"id": "fWFUE", "label": "B", "text": "$8\\ \\text{m/s}^2$", "isCorrect": false, "image": null}, {"id": "v4Jw6", "label": "C", "text": "$16\\ \\text{m/s}^2$", "isCorrect": false, "image": null}, {"id": "6l8XK", "label": "D", "text": "$40\\ \\text{m/s}^2$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given $v = 40\\ \\text{m/s}$ and $R = 40\\ \\text{m}$.<br><br>Tangential acceleration, $a_t = 2\\ \\text{m/s}^2$.<br><br>Centripetal acceleration, $a_c = \\dfrac{v^2}{R} = \\dfrac{40^2}{40} = 40\\ \\text{m/s}^2$.<br><br>Net acceleration, $a = \\sqrt{a_c^2 + a_t^2} = \\sqrt{40^2 + 2^2} = \\sqrt{1600 + 4} = \\sqrt{1604} \\approx 40\\ \\text{m/s}^2$.<br><br>Answer: $40\\ \\text{m/s}^2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3068c30a4553e1bdf5a", "type": "singleCorrect", "question": {"text": "A particle is performing U.C.M. along a circle of radius $R$. In half the period of revolution, its displacement and distance covered are respectively", "image": null}, "options": [{"id": "s9A8m", "label": "A", "text": "$\\sqrt{2}R, 2\\pi R$", "isCorrect": false, "image": null}, {"id": "VkkRf", "label": "B", "text": "$2R, \\pi R$", "isCorrect": true, "image": null}, {"id": "YZcH3", "label": "C", "text": "$2R, 2\\pi R$", "isCorrect": false, "image": null}, {"id": "rB6Tz", "label": "D", "text": "$R, \\pi R$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In half the period of revolution, the particle moves from its initial position to the diametrically opposite point on the circular path.<br><br>The displacement is the shortest distance between the initial and final positions, which is equal to the diameter of the circle.<br><br>Displacement = $2R$<br><br>The distance covered is the actual path length along the circular trajectory, which is half of the circumference.<br><br>Distance = $\\dfrac{2\\pi R}{2} = \\pi R$<br><br>Answer: $2R, \\pi R$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f98c30a4553e1bdecc", "type": "singleCorrect", "question": {"text": "Two stones of masses $m$ and $3m$ are whirled in horizontal circles, the heavier one in a radius $\\dfrac{r}{3}$ and the lighter one in radius $r$. When both the stones experience same centripetal forces, the tangential speed of lighter stone is '$n$' times that of the value of heavier stone. The value of '$n$' is", "image": null}, "options": [{"id": "OEqqd", "label": "A", "text": "$1$", "isCorrect": false, "image": null}, {"id": "m3LBB", "label": "B", "text": "$2$", "isCorrect": false, "image": null}, {"id": "pJXFw", "label": "C", "text": "$3$", "isCorrect": true, "image": null}, {"id": "ststM", "label": "D", "text": "$4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the mass, radius, and tangential speed of the lighter stone be $m_1 = m$, $r_1 = r$, and $v_1$ respectively.<br><br>Let the mass, radius, and tangential speed of the heavier stone be $m_2 = 3m$, $r_2 = \\dfrac{r}{3}$, and $v_2$ respectively.<br><br>The centripetal force on the lighter stone is $F_1 = \\dfrac{m_1 v_1^2}{r_1} = \\dfrac{m v_1^2}{r}$.<br><br>The centripetal force on the heavier stone is $F_2 = \\dfrac{m_2 v_2^2}{r_2} = \\dfrac{3m v_2^2}{\\dfrac{r}{3}} = \\dfrac{9m v_2^2}{r}$.<br><br>Given that both stones experience the same centripetal force, $F_1 = F_2$.<br><br>$\\dfrac{m v_1^2}{r} = \\dfrac{9m v_2^2}{r}$<br><br>$v_1^2 = 9 v_2^2$<br><br>$v_1 = 3 v_2$<br><br>Since the tangential speed of the lighter stone is $n$ times that of the heavier stone, $n = 3$.<br><br>Answer: $3$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f78c30a4553e1bdebd", "type": "singleCorrect", "question": {"text": "Two particles having mass 'M' and 'm' are moving in a circular path with radius 'R' and 'r' respectively. The time period for both the particles is same. The ratio of angular velocity of the first particle to that of the second particle will be", "image": null}, "options": [{"id": "tTmzp", "label": "A", "text": "$1:1$", "isCorrect": true, "image": null}, {"id": "z4mDX", "label": "B", "text": "$1:2$", "isCorrect": false, "image": null}, {"id": "wWTr0", "label": "C", "text": "$2:3$", "isCorrect": false, "image": null}, {"id": "ClkH0", "label": "D", "text": "$3:4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Angular velocity is given by $\\omega = \\dfrac{2\\pi}{T}$<br><br>Since the time period $T$ is the same for both particles, their angular velocities are equal.<br><br>$\\omega_1 = \\dfrac{2\\pi}{T}$ and $\\omega_2 = \\dfrac{2\\pi}{T}$<br><br>$\\dfrac{\\omega_1}{\\omega_2} = \\dfrac{1}{1}$<br><br>The ratio of their angular velocities is $1:1$.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3228c30a4553e1be083", "type": "singleCorrect", "question": {"text": "A body moves along a circular path of diameter $30\\ \\text{cm}$. It starts from one end of diameter, moves along the circular path and reaches the other end of diameter in 3 second. The angular speed of the body in radian per second is", "image": null}, "options": [{"id": "RkmFI", "label": "A", "text": "$\\dfrac{\\pi}{5}$", "isCorrect": false, "image": null}, {"id": "RNHNb", "label": "B", "text": "$\\dfrac{\\pi}{4}$", "isCorrect": false, "image": null}, {"id": "4xyH6", "label": "C", "text": "$\\dfrac{\\pi}{3}$", "isCorrect": true, "image": null}, {"id": "JKqJz", "label": "D", "text": "$\\dfrac{\\pi}{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The angular displacement of the body when it moves from one end of the diameter to the other end along the circular path is $\\pi$ radians.<br><br>Time taken, $t = 3\\ \\text{s}$.<br><br>Angular speed, $\\omega = \\dfrac{\\theta}{t}$<br><br>$\\omega = \\dfrac{\\pi}{3}\\ \\text{rad/s}$<br><br>Answer: $\\dfrac{\\pi}{3}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3308c30a4553e1be11e", "type": "singleCorrect", "question": {"text": "A particle is moving with constant angular acceleration $4\\,\\text{rad/s}^2$ in circular path. At what time the magnitudes of its tangential acceleration and centripetal acceleration will be equal ?", "image": null}, "options": [{"id": "GEnDh", "label": "A", "text": "$0.2$ s", "isCorrect": false, "image": null}, {"id": "kh7UB", "label": "B", "text": "$0.4$ s", "isCorrect": false, "image": null}, {"id": "YEmlV", "label": "C", "text": "$0.5$ s", "isCorrect": true, "image": null}, {"id": "OI5ev", "label": "D", "text": "$0.6$ s", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given angular acceleration $\\alpha = 4 \\text{ rad/s}^2$.<br><br>Tangential acceleration is given by $a_t = r\\alpha$.<br><br>Centripetal acceleration is given by $a_c = r\\omega^2$.<br><br>Equating the magnitudes of tangential and centripetal acceleration:<br><br>$a_t = a_c$<br><br>$r\\alpha = r\\omega^2$<br><br>$\\omega^2 = \\alpha$<br><br>Assuming the particle starts from rest, the angular velocity at time $t$ is $\\omega = \\alpha t$.<br><br>Substituting $\\omega$ in the above equation:<br><br>$(\\alp
