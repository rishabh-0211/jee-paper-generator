ha t)^2 = \\alpha$<br><br>$\\alpha^2 t^2 = \\alpha$<br><br>$t^2 = \\dfrac{1}{\\alpha}$<br><br>Substituting $\\alpha = 4 \\text{ rad/s}^2$:<br><br>$t^2 = \\dfrac{1}{4}$<br><br>$t = 0.5 \\text{ s}$<br><br>Answer: $0.5$ s", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3308c30a4553e1be11d", "type": "singleCorrect", "question": {"text": "A particle describes a horizontal circle of radius 'r' in conical funnel with smooth inner surface with a speed of $0.5$ m/s. The height of the plane of the circle from the vertex of the funnel is (acceleration due to gravity, $g = 10\\,\\text{m/s}^2$)", "image": null}, "options": [{"id": "r88PO", "label": "A", "text": "$1.5$ cm", "isCorrect": false, "image": null}, {"id": "rtYMC", "label": "B", "text": "$2.5$ cm", "isCorrect": true, "image": null}, {"id": "RxEDl", "label": "C", "text": "$3.5$ cm", "isCorrect": false, "image": null}, {"id": "2O4ZM", "label": "D", "text": "$0.5$ cm", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $\\theta$ be the semi-vertical angle of the conical funnel.<br>The radius of the circular path is $r$ and its height from the vertex is $h$.<br>From the geometry of the cone, we have:<br>$\\tan \\theta = \\dfrac{r}{h}$<br><br>The forces acting on the particle are its weight $mg$ acting vertically downwards and the normal reaction $N$ acting perpendicular to the inner surface of the funnel.<br>The normal reaction makes an angle $\\theta$ with the horizontal. Resolving $N$ into vertical and horizontal components, we get:<br>$N \\sin \\theta = mg$<br>$N \\cos \\theta = \\dfrac{mv^2}{r}$<br><br>Dividing the vertical component by the horizontal component, we obtain:<br>$\\tan \\theta = \\dfrac{rg}{v^2}$<br><br>Equating the two expressions for $\\tan \\theta$:<br>$\\dfrac{r}{h} = \\dfrac{rg}{v^2}$<br><br>$\\Rightarrow h = \\dfrac{v^2}{g}$<br><br>Given $v = 0.5$ m/s and $g = 10$ m/s$^2$, substituting the values:<br>$h = \\dfrac{(0.5)^2}{10} = \\dfrac{0.25}{10} = 0.025$ m<br><br>Converting to centimeters:<br>$h = 0.025 \\times 100$ cm $= 2.5$ cm<br><br>Answer: $2.5$ cm", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2de8c30a4553e1bddb0", "type": "singleCorrect", "question": {"text": "A particle at rest starts moving with constant angular acceleration '$\\alpha$' in a circular path of radius 'r'. At certain instant, the magnitude of centripetal acceleration is $\\left(\\dfrac{1}{3}\\right)^{rd}$ the tangential acceleration. The relation between linear speed (V) and angular acceleration ($\\alpha$) is", "image": null}, "options": [{"id": "JCrpK", "label": "A", "text": "$V = \\dfrac{r\\alpha}{3}$", "isCorrect": false, "image": null}, {"id": "HSc3B", "label": "B", "text": "$V = \\alpha\\sqrt{\\dfrac{r}{2}}$", "isCorrect": false, "image": null}, {"id": "kGPpj", "label": "C", "text": "$V = r\\sqrt{\\dfrac{\\alpha}{3}}$", "isCorrect": true, "image": null}, {"id": "jqhXQ", "label": "D", "text": "$V = \\sqrt{\\dfrac{\\alpha r}{3}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The tangential acceleration of the particle is given by $a_t = r\\alpha$.<br><br>The centripetal acceleration of the particle is given by $a_c = \\dfrac{V^2}{r}$.<br><br>According to the given condition, the magnitude of centripetal acceleration is $\\dfrac{1}{3}$ of the tangential acceleration:<br><br>$a_c = \\dfrac{1}{3} a_t$<br><br>Substituting the expressions for $a_c$ and $a_t$:<br><br>$\\dfrac{V^2}{r} = \\dfrac{1}{3} (r\\alpha)$<br><br>$V^2 = \\dfrac{r^2 \\alpha}{3}$<br><br>Taking the square root on both sides:<br><br>$V = r\\sqrt{\\dfrac{\\alpha}{3}}$<br><br>Answer: $V = r\\sqrt{\\dfrac{\\alpha}{3}}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3148c30a4553e1bdff2", "type": "singleCorrect", "question": {"text": "A particle performing U.C.M. of radius $\\dfrac{\\pi}{2}$ m makes 'x' revolutions in time t. Its tangential velocity is", "image": null}, "options": [{"id": "GSdMV", "label": "A", "text": "$\\dfrac{\\pi x}{t}$", "isCorrect": false, "image": null}, {"id": "etG2h", "label": "B", "text": "$\\dfrac{\\pi^2 x}{t}$", "isCorrect": true, "image": null}, {"id": "IjG5s", "label": "C", "text": "$\\dfrac{\\pi}{xt}$", "isCorrect": false, "image": null}, {"id": "VOY0t", "label": "D", "text": "$\\dfrac{xt}{\\pi}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The radius of the circular path is $r = \\dfrac{\\pi}{2}$ m.<br><br>The particle makes $x$ revolutions in time $t$, so its frequency is $n = \\dfrac{x}{t}$.<br><br>The angular velocity is given by $\\omega = 2\\pi n = \\dfrac{2\\pi x}{t}$.<br><br>The tangential velocity is $v = r\\omega$.<br><br>Substituting the values, we get $v = \\left(\\dfrac{\\pi}{2}\\right) \\left(\\dfrac{2\\pi x}{t}\\right) = \\dfrac{\\pi^2 x}{t}$.<br><br>Answer: $\\dfrac{\\pi^2 x}{t}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36b8c30a4553e1be38a", "type": "singleCorrect", "question": {"text": "A string of length 'L' fixed at one end carries a mass 'm' at the other end. The string makes $\\dfrac{3}{\\pi}$ r.p.s. around the vertical axis through fixed end. The tension in the string is", "image": null}, "options": [{"id": "QV6Pk", "label": "A", "text": "$72 mL$", "isCorrect": false, "image": null}, {"id": "74jhh", "label": "B", "text": "$36 mL$", "isCorrect": true, "image": null}, {"id": "XeyxY", "label": "C", "text": "$18 mL$", "isCorrect": false, "image": null}, {"id": "QG3ms", "label": "D", "text": "$9 mL$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a mass rotating in a horizontal circle as a conical pendulum, the horizontal component of the tension provides the necessary centripetal force.<br><br>$T \\sin \\theta = m \\omega^2 r$<br><br>From the geometry of the pendulum, the radius of the circular path is $r = L \\sin \\theta$. Substituting this into the equation gives:<br><br>$T \\sin \\theta = m \\omega^2 (L \\sin \\theta)$<br><br>$T = m \\omega^2 L$<br><br>The frequency of revolution is given as $f = \\dfrac{3}{\\pi}$. The angular velocity $\\omega$ is:<br><br>$\\omega = 2 \\pi f = 2 \\pi \\left( \\dfrac{3}{\\pi} \\right) = 6$<br><br>Substituting the value of $\\omega$ into the expression for tension:<br><br>$T = m (6)^2 L = 36 mL$<br><br>Answer: $36 mL$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d35e8c30a4553e1be303", "type": "singleCorrect", "question": {"text": "The angular speed of the minute hand of a clock in degrees per second is", "image": null}, "options": [{"id": "YMRpa", "label": "A", "text": "$0.6$", "isCorrect": false, "image": null}, {"id": "jYfyz", "label": "B", "text": "$0.1$", "isCorrect": true, "image": null}, {"id": "JHYNg", "label": "C", "text": "$0.12$", "isCorrect": false, "image": null}, {"id": "hzt4O", "label": "D", "text": "$1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The minute hand of a clock completes one full revolution in $1$ hour.<br><br>Total angle covered in one revolution is $360^{\\circ}$.<br><br>Total time taken is $1 \\text{ hour} = 3600 \\text{ seconds}$.<br><br>Angular speed $\\omega = \\dfrac{360^{\\circ}}{3600 \\text{ s}} = 0.1^{\\circ} \\text{/s}$<br><br>Answer: $0.1$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d35a8c30a4553e1be2d7", "type": "singleCorrect", "question": {"text": "In non uniform circular motion, the ratio of radial acceleration to tangential acceleration is (V is the velocity, r is the radius and $\\alpha$ is the angular acceleration)", "image": null}, "options": [{"id": "O8OYN", "label": "A", "text": "$\\dfrac{\\alpha r}{V}$", "isCorrect": false, "image": null}, {"id": "R5Ti8", "label": "B", "text": "$\\dfrac{V^2}{r^2\\alpha}$", "isCorrect": true, "image": null}, {"id": "SC8xu", "label": "C", "text": "$\\dfrac{r^2\\alpha}{V^2}$", "isCorrect": false, "image": null}, {"id": "0J1A1", "label": "D", "text": "$\\dfrac{r\\alpha^2}{V^2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Radial acceleration is given by $a_r = \\dfrac{V^2}{r}$<br><br>Tangential acceleration is given by $a_t = r\\alpha$<br><br>The ratio of radial acceleration to tangential acceleration is $\\dfrac{a_r}{a_t} = \\dfrac{\\dfrac{V^2}{r}}{r\\alpha} = \\dfrac{V^2}{r^2\\alpha}$<br><br>Answer: $\\dfrac{V^2}{r^2\\alpha}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b38c30a4553e1bdbe2", "type": "singleCorrect", "question": {"text": "A particle of mass $m$ is moving in a circular path of constant radius $r$ such that its centripetal acceleration $a_c$ is varying with time $t$ as, $a_c = k^2 r t^2$. The power delivered to the particle by the forces acting on it is ($K$ = constant)", "image": null}, "options": [{"id": "9kqrw", "label": "A", "text": "$m^2 k^2 r^2 t^2$", "isCorrect": false, "image": null}, {"id": "EnNSJ", "label": "B", "text": "$m k^2 r^2 t$", "isCorrect": true, "image": null}, {"id": "wXKo6", "label": "C", "text": "$2\\pi m k^2 r^2 t$", "isCorrect": false, "image": null}, {"id": "snK28", "label": "D", "text": "$\\dfrac{m k^4 r^2 t^5}{3}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given centripetal acceleration $a_c = k^2 r t^2$<br><br>Using the formula $a_c = \\dfrac{v^2}{r}$:<br><br>$\\dfrac{v^2}{r} = k^2 r t^2$<br><br>$v^2 = k^2 r^2 t^2$<br><br>$v = k r t$<br><br>The kinetic energy of the particle is given by:<br><br>$E = \\dfrac{1}{2} m v^2$<br><br>$E = \\dfrac{1}{2} m (k r t)^2 = \\dfrac{1}{2} m k^2 r^2 t^2$<br><br>The total power delivered by all forces acting on the particle is equal to the rate of change of its kinetic energy:<br><br>$P = \\dfrac{dE}{dt}$<br><br>$P = \\dfrac{d}{dt} \\left( \\dfrac{1}{2} m k^2 r^2 t^2 \\right)$<br><br>$P = \\dfrac{1}{2} m k^2 r^2 (2t)$<br><br>$P = m k^2 r^2 t$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b38c30a4553e1bdbe0", "type": "singleCorrect", "question": {"text": "The position vector of a particle is $\\vec{r} = a \\cos \\omega t \\hat{i} + a \\sin \\omega t \\hat{j}$. Calculate the angle between its position vector and the velocity vector.<br>($\\cos 0=1, \\cos 90=0, \\cos 60=0.5, \\sin 30=0.5, \\sin 0=0$)", "image": null}, "options": [{"id": "sqQl1", "label": "A", "text": "$30^\\circ$", "isCorrect": false, "image": null}, {"id": "VxD7Y", "label": "B", "text": "$60^\\circ$", "isCorrect": false, "image": null}, {"id": "wSl5F", "label": "C", "text": "$90^\\circ$", "isCorrect": true, "image": null}, {"id": "g1sGc", "label": "D", "text": "$0^\\circ$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given position vector $\\vec{r} = a \\cos \\omega t \\hat{i} + a \\sin \\omega t \\hat{j}$<br><br>Velocity vector $\\vec{v} = \\dfrac{d\\vec{r}}{dt} = -a \\omega \\sin \\omega t \\hat{i} + a \\omega \\cos \\omega t \\hat{j}$<br><br>The dot product of $\\vec{r}$ and $\\vec{v}$ is:<br><br>$\\vec{r} \\cdot \\vec{v} = (a \\cos \\omega t)(-a \\omega \\sin \\omega t) + (a \\sin \\omega t)(a \\omega \\cos \\omega t)$<br><br>$\\vec{r} \\cdot \\vec{v} = -a^2 \\omega \\sin \\omega t \\cos \\omega t + a^2 \\omega \\sin \\omega t \\cos \\omega t = 0$<br><br>Since $\\vec{r} \\cdot \\vec{v} = 0$, the angle between the position vector and the velocity vector is $90^\\circ$.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b96bf9280d7f9932a9e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Two stones of masses m and 3 m are whirled in horizontal circles, the heavier one in a radius $\\left(\\frac{\\mathrm{r}}{3}\\right)$ and lighter one in a radius r . The tangential speed of lighter stone is ' $n$ ' times the value of heavier stone. When the magnitude of centripetal force becomes equal the value of $n$ is", "image": null}, "options": [{"id": "5DD1c", "text": "4", "image": null, "isCorrect": false}, {"id": "ljBFi", "text": "3", "image": null, "isCorrect": true}, {"id": "iKvRs", "text": "2", "image": null, "isCorrect": false}, {"id": "Ls6e7", "text": "1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the mass, radius, and tangential speed of the lighter stone be $m_1$, $r_1$, and $v_1$ respectively.<br><br>Let the mass, radius, and tangential speed of the heavier stone be $m_2$, $r_2$, and $v_2$ respectively.<br><br>Given:<br>$m_1 = m$, $r_1 = r$<br>$m_2 = 3m$, $r_2 = \\dfrac{r}{3}$<br>$v_1 = n v_2$<br><br>The centripetal force on the lighter stone is:<br>$F_1 = \\dfrac{m_1 v_1^2}{r_1} = \\dfrac{m (n v_2)^2}{r} = \\dfrac{m n^2 v_2^2}{r}$<br><br>The centripetal force on the heavier stone is:<br>$F_2 = \\dfrac{m_2 v_2^2}{r_2} = \\dfrac{3m v_2^2}{\\dfrac{r}{3}} = \\dfrac{9m v_2^2}{r}$<br><br>Since the magnitudes of the centripetal forces are equal, $F_1 = F_2$:<br>$\\dfrac{m n^2 v_2^2}{r} = \\dfrac{9m v_2^2}{r}$<br><br>$n^2 = 9$<br><br>$n = 3$<br><br>Answer: 3", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b95bf9280d7f9932a97", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "An inextensible string of length ' $\\ell$ ' fixed at one end, carries a mass ' m ' at the other end. If the string makes $\\frac{1}{\\pi}$ revolutions per second around the vertical axis through the fixed end, the tension in the string is [The string makes an angle $\\theta$ with the vertical]", "image": null}, "options": [{"id": "b29bC", "text": "16 ml", "image": null, "isCorrect": false}, {"id": "QZP85", "text": "8 ml", "image": null, "isCorrect": false}, {"id": "prs3O", "text": "4 ml", "image": null, "isCorrect": true}, {"id": "KAdDl", "text": "2 ml", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a conical pendulum, the horizontal component of the tension provides the necessary centripetal force for circular motion.<br><br>$T \\sin\\theta = m r \\omega^2$<br><br>The radius of the horizontal circle is $r = \\ell \\sin\\theta$. Substituting this into the equation, we get:<br><br>$T \\sin\\theta = m (\\ell \\sin\\theta) \\omega^2$<br><br>$T = m \\ell \\omega^2$<br><br>The angular velocity $\\omega$ is given by $\\omega = 2\\pi n$, where $n$ is the frequency of revolution. Given $n = \\dfrac{1}{\\pi}$ rev/s:<br><br>$\\omega = 2\\pi \\left(\\dfrac{1}{\\pi}\\right) = 2 \\text{ rad/s}$<br><br>Substituting the value of $\\omega$ into the expression for tension:<br><br>$T = m \\ell (2)^2 = 4 m \\ell$<br><br>Answer: 4 ml", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b64bf9280d7f99328c6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A vehicle is moving with a constant speed of $10 \\mathrm{~m} / \\mathrm{s}$ in a circular horizontal track of radius 20 m . A bob is suspended from the roof of a vehicle by a massless string. The angle made by the string with the vertical will be (acceleration due to gravity, $g=10 \\mathrm{~m} / \\mathrm{s}^2$ )", "image": null}, "options": [{"id": "p1MD5", "text": "$\\tan ^{-1}(0.5)$", "image": null, "isCorrect": true}, {"id": "kLYgJ", "text": "$\\tan ^{-1}(0.6)$", "image": null, "isCorrect": false}, {"id": "iHXnA", "text": "$\\tan ^{-1}(0.7)$", "image": null, "isCorrect": false}, {"id": "r1WQF", "text": "$\\tan ^{-1}(0.8)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $m$ be the mass of the bob and $T$ be the tension in the string.<br><br>In the frame of the vehicle, the bob experiences a centrifugal force horizontally outwards. For equilibrium in this non-inertial frame:<br><br>$T \\sin \\theta = \\dfrac{mv^2}{r}$<br><br>$T \\cos \\theta = mg$<br><br>Dividing the two equations, we get:<br><br>$\\tan \\theta = \\dfrac{v^2}{rg}$<br><br>Substituting the given values $v = 10 \\mathrm{~m/s}$, $r = 20 \\mathrm{~m}$, and $g = 10 \\mathrm{~m/s^2}$:<br><br>$\\tan \\theta = \\dfrac{10^2}{20 \\times 10} = \\dfrac{100}{200} = 0.5$<br><br>$\\theta = \\tan^{-1}(0.5)$<br><br>Answer: $\\tan ^{-1}(0.5)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b20bf9280d7f9932675", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "For a particle moving in a circle with constant angular speed, which of the following statements is 'false'?", "image": null}, "options": [{"id": "lxSU2", "text": "The velocity vector is tangent to the circle.", "image": null, "isCorrect": false}, {"id": "PU4JJ", "text": "The acceleration vector is tangent to the circle.", "image": null, "isCorrect": true}, {"id": "T69iD", "text": "The velocity and acceleration vectors are perpendicular to each other:", "image": null, "isCorrect": false}, {"id": "CwmCp", "text": "The acceleration vector points to the centre of the circle.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a particle moving in a circle with constant angular speed, the motion is uniform circular motion.<br><br>In uniform circular motion, the tangential acceleration is zero because the speed is constant. The only acceleration acting on the particle is the centripetal acceleration, which is directed along the radius towards the centre of the circle.<br><br>The velocity vector is always tangent to the circular path.<br><br>Since the velocity is tangential and the acceleration is radial, they are perpendicular to each other.<br><br>Therefore, the statement that the acceleration vector is tangent to the circle is false.<br><br>Answer: The acceleration vector is tangent to the circle.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b09bf9280d7f99325d8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A particle performing uniform circular motion of radius $\\frac{\\pi}{2} \\mathrm{~m}$ makes x revolutions in time $t$. Its tangential velocity is", "image": null}, "options": [{"id": "y1HAr", "text": "$\\frac{x}{\\pi t}$", "image": null, "isCorrect": false}, {"id": "Pgr0M", "text": "$\\frac{\\pi^2}{\\mathrm{xt}}$", "image": null, "isCorrect": false}, {"id": "00KWK", "text": "$\\frac{\\pi^2 x}{t}$", "image": null, "isCorrect": true}, {"id": "yFtmI", "text": "$\\frac{\\pi x}{t}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Radius of the circular path is $r = \\dfrac{\\pi}{2}$.<br><br>The particle makes $x$ revolutions in time $t$, so its frequency is $n = \\dfrac{x}{t}$.<br><br>Angular velocity is given by $\\omega = 2\\pi n = \\dfrac{2\\pi x}{t}$.<br><br>Tangential velocity is $v = r\\omega$.<br><br>Substituting the values, we get $v = \\left(\\dfrac{\\pi}{2}\\right) \\left(\\dfrac{2\\pi x}{t}\\right) = \\dfrac{\\pi^2 x}{t}$.<br><br>Answer: $\\frac{\\pi^2 x}{t}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214410aee93fa0796df30", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "A body performing uniform circular motion of radius ' $R$ ' has frequency ' $n$ '. Its centripetal acceleration per unit radius is proportional to $(n)^x$. The value of $x$ is", "image": null}, "options": [{"id": "2SXBi", "text": "1", "image": null, "isCorrect": false}, {"id": "Sqp34", "text": "2", "image": null, "isCorrect": true}, {"id": "F9GxY", "text": "-1", "image": null, "isCorrect": false}, {"id": "McVIJ", "text": "-2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The centripetal acceleration of a body in uniform circular motion is given by $a = \\omega^2 R$.<br><br>The angular velocity $\\omega$ is related to the frequency $n$ by $\\omega = 2\\pi n$.<br><br>Substituting this into the acceleration formula, we get:<br>$a = (2\\pi n)^2 R = 4\\pi^2 n^2 R$<br><br>The centripetal acceleration per unit radius is:<br>$\\dfrac{a}{R} = 4\\pi^2 n^2$<br><br>This shows that $\\dfrac{a}{R} \\propto n^2$.<br><br>Comparing this with the given relation $\\dfrac{a}{R} \\propto n^x$, we get $x = 2$.<br><br>Answer: 2", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214400aee93fa0796df2b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "Two objects of masses ' $m_1$ ' and ' $m_2$ ' are moving in the circles of radii ' $r_1$ ' and ' $r_2$ ' respectively. Their respective angular speeds ' $\\omega_1$ ' and ' $\\omega_2$ ' are such that they both complete one revolution in the same time ' $t$ '. The ratio of linear speed of ' $\\mathrm{m}_2$ ' to that of ' $\\mathrm{m}_1$ ' is", "image": null}, "options": [{"id": "fRgmV", "text": "$\\omega_1: \\omega_2$", "image": null, "isCorrect": false}, {"id": "7tpdt", "text": "$\\mathrm{T}_2: \\mathrm{T}_1$", "image": null, "isCorrect": false}, {"id": "AWo0N", "text": "$\\mathrm{m}_1: \\mathrm{m}_2$", "image": null, "isCorrect": false}, {"id": "VdPVF", "text": "$\\mathrm{r}_2: \\mathrm{r}_1$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The time period of revolution is the same for both objects, so $T_1 = T_2 = t$.<br><br>The angular speed is given by $\\omega = \\dfrac{2\\pi}{T}$.<br><br>Since $T_1 = T_2$, their angular speeds are equal, so $\\omega_1 = \\omega_2 = \\omega$.<br><br>The linear speed of an object in circular motion is given by $v = r\\omega$.<br><br>For the first object, $v_1 = r_1\\omega_1 = r_1\\omega$.<br><br>For the second object, $v_2 = r_2\\omega_2 = r_2\\omega$.<br><br>The ratio of the linear speed of $m_2$ to that of $m_1$ is $\\dfrac{v_2}{v_1} = \\dfrac{r_2\\omega}{r_1\\omega} = \\dfrac{r_2}{r_1}$.<br><br>Thus, the required ratio is $r_2 : r_1$.<br><br>Answer: $\\mathrm{r}_2: \\mathrm{r}_1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792142d0aee93fa0796de97", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "A particle starting from rest moves atong the circumference of a circle of radius ' $r$ ' with angular acceleration ' $\\alpha$ '. The magnitude of the average velocity in time it completes the small angular displacement ' $\\theta$ ' is", "image": null}, "options": [{"id": "69vcV", "text": "$\\frac{r^2}{2 \\alpha \\theta}$", "image": null, "isCorrect": false}, {"id": "59rSo", "text": "$\\frac{\\mathrm{r}}{2 \\alpha \\theta}$", "image": null, "isCorrect": false}, {"id": "ybKVB", "text": "$\\frac{\\mathrm{r} \\alpha \\theta}{2}$", "image": null, "isCorrect": false}, {"id": "Ipi2U", "text": "$\\frac{\\mathrm{r}}{\\sqrt{2}} \\sqrt{\\alpha \\theta}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Initial angular velocity, $\\omega_0 = 0$<br><br>Using the kinematic equation for angular motion:<br><br>$\\theta = \\omega_0 t + \\dfrac{1}{2} \\alpha t^2$<br><br>$\\theta = 0 + \\dfrac{1}{2} \\alpha t^2 \\Rightarrow t = \\sqrt{\\dfrac{2\\theta}{\\alpha}}$<br><br>For a small angular displacement $\\theta$, the magnitude of linear displacement is approximately equal to the arc length:<br><br>$\\text{Displacement} \\approx r\\theta$<br><br>The magnitude of average velocity is given by:<br><br>$v_{avg} = \\dfrac{\\text{Displacement}}{\\text{Time}}$<br><br>$v_{avg} = \\dfrac{r\\theta}{\\sqrt{\\dfrac{2\\theta}{\\alpha}}} = r\\theta \\sqrt{\\dfrac{\\alpha}{2\\theta}} = \\dfrac{r}{\\sqrt{2}} \\sqrt{\\alpha \\theta}$<br><br>Answer: $\\frac{\\mathrm{r}}{\\sqrt{2}} \\sqrt{\\alpha \\theta}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213df0aee93fa0796dc2d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "For a particle moving in vertical circle, the total energy at different positions along the path [The motion is under gravity]", "image": null}, "options": [{"id": "vhFrT", "text": "may increase or decrease.", "image": null, "isCorrect": false}, {"id": "Jt5FB", "text": "decreases.", "image": null, "isCorrect": false}, {"id": "pF3qu", "text": "is conserved.", "image": null, "isCorrect": true}, {"id": "Xo0XX", "text": "increases.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In vertical circular motion under gravity, the forces acting on the particle are the gravitational force and the tension in the string.<br><br>The tension is always perpendicular to the velocity of the particle, so the work done by the tension is zero.<br><br>The gravitational force is a conservative force. Since no non-conservative forces do work on the particle, the total mechanical energy (sum of kinetic and potential energy) of the particle remains constant at all positions along the path.<br><br>Therefore, the total energy is conserved.<br><br>Answer: is conserved.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d00aee93fa0796dbb9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "A particle rotates in a horizontal circle of radius ' R ' in a conical funnel with constant speed ' V '. The inner surface of the funnel is smooth. The height of the plane of the circle from the vertex of the funnel is (g-acceleration due to gravity)", "image": null}, "options": [{"id": "zrmB5", "text": "$\\dfrac{\\mathrm{V}}{\\mathrm{g}}$", "image": null, "isCorrect": false}, {"id": "aec45", "text": "$\\dfrac{\\mathrm{V}}{2 \\mathrm{~g}}$", "image": null, "isCorrect": false}, {"id": "pG4an", "text": "$\\dfrac{\\mathrm{V}^2}{2 \\mathrm{~g}}$", "image": null, "isCorrect": false}, {"id": "yueDB", "text": "$\\dfrac{\\mathrm{V}^2}{\\mathrm{~g}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let the semi-vertical angle of the conical funnel be $\\theta$.<br><br>From the geometry of the cone, the height $h$ of the circular plane from the vertex and its radius $R$ are related by:<br><br>$\\tan \\theta = \\dfrac{R}{h}$<br><br>The forces acting on the particle are its weight $mg$ acting vertically downwards and the normal reaction $N$ acting perpendicular to the inner surface of the funnel.<br><br>The normal reaction $N$ makes an angle $\\theta$ with the horizontal. Resolving $N$ into vertical and horizontal components:<br><br>The vertical component balances the weight:<br><br>$N \\sin \\theta = mg$<br><br>The horizontal component provides the necessary centripetal force for circular motion:<br><br>$N \\cos \\theta = \\dfrac{mV^2}{R}$<br><br>Dividing the vertical equation by the horizontal equation, we get:<br><br>$\\tan \\theta = \\dfrac{Rg}{V^2}$<br><br>Equating the two expressions for $\\tan \\theta$:<br><br>$\\dfrac{R}{h} = \\dfrac{Rg}{V^2}$<br><br>$h = \\dfrac{V^2}{g}$<br><br>Answer: $\\dfrac{\\mathrm{V}^2}{\\mathrm{~g}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213cd0aee93fa0796dba1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "A particle of mass ' $m$ ' performs uniform circular motion of radius ' $r$ ' with linear speed ' $v$ ' under the application of force ' $F$ '. If ' $m$ ', ' $v$ ' and ' $r$ ' are all increased by $20 \\%$ the necessary change in force required to maintain the particle in uniform circular motion, is", "image": null}, "options": [{"id": "6ceLa", "text": "$12 \\%$", "image": null, "isCorrect": false}, {"id": "GyPvG", "text": "$14 \\%$", "image": null, "isCorrect": false}, {"id": "U0mLz", "text": "$44 \\%$", "image": null, "isCorrect": true}, {"id": "c4xRg", "text": "$144 \\%$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The centripetal force required for uniform circular motion is given by<br><br>$F = \\dfrac{mv^2}{r}$<br><br>When mass, speed, and radius are increased by $20\\%$, the new values become<br><br>$m' = m + 0.2m = 1.2m$<br><br>$v' = v + 0.2v = 1.2v$<br><br>$r' = r + 0.2r = 1.2r$<br><br>The new force required is<br><br>$F' = \\dfrac{m'(v')^2}{r'} = \\dfrac{(1.2m)(1.2v)^2}{1.2r}$<br><br>$F' = 1.44 \\dfrac{mv^2}{r} = 1.44F$<br><br>The change in force is<br><br>$\\Delta F = F' - F = 1.44F - F = 0.44F$<br><br>The percentage change in force is<br><br>$\\dfrac{\\Delta F}{F} \\times 100 = 0.44 \\times 100 = 44\\%$<br><br>Answer: $44 \\%$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213bd0aee93fa0796db23", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "For a particle in uniform circular motion", "image": null}, "options": [{"id": "fu8rx", "text": "linear velocity always radial to the circular path, without change in its magnitude", "image": null, "isCorrect": false}, {"id": "7kC5t", "text": "linear velocity always tangential to the circular path, without change in its magnitude", "image": null, "isCorrect": true}, {"id": "9dRgY", "text": "linear acceleration always tangential to the circular path", "image": null, "isCorrect": false}, {"id": "g2F6k", "text": "linear acceleration always along the axis of the circular path", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In uniform circular motion, the particle moves along a circular path with a constant speed. Therefore, the magnitude of its linear velocity remains unchanged.<br><br>The direction of the linear velocity at any point is along the tangent to the circular path at that point.<br><br>The linear acceleration (centripetal acceleration) is directed radially inward towards the center of the circle, not tangentially or along the axis.<br><br>Answer: linear velocity always tangential to the circular path, without change in its magnitude", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213590aee93fa0796d817", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "A wheel of radius 1 m rolls through $180^{\\circ}$ over a plane surface. The magnitude of the displacement of the point of the wheel initially in contact with the surface is.", "image": null}, "options": [{"id": "TBce2", "text": "$2 \\pi$", "image": null, "isCorrect": false}, {"id": "Xaf6g", "text": "$\\pi$", "image": null, "isCorrect": false}, {"id": "cOIgR", "text": "$\\sqrt{\\pi^2+4}$", "image": null, "isCorrect": true}, {"id": "ojXhd", "text": "$3 \\pi$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the initial position of the point of contact be the origin $(0,0)$.<br><br>When the wheel rolls through $180^{\\circ}$ (or $\\pi$ radians), the horizontal distance covered by the center of the wheel is $x = R\\theta = 1 \\times \\pi = \\pi$.<br><br>The point initially at the bottom reaches the top of the wheel. The vertical distance of the point from the ground becomes $y = 2R = 2 \\times 1 = 2$.<br><br>The final coordinates of the point are $(\\pi, 2)$.<br><br>The magnitude of the displacement is $\\sqrt{x^2 + y^2} = \\sqrt{\\pi^2 + 2^2} = \\sqrt{\\pi^2 + 4}$.<br><br>Answer: $\\sqrt{\\pi^2+4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262670279619d9d8a3440", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "A string of length ' $L$ ' fixed at one end carries a body of mass ' $m$ ' at the other end. The mass is revolved in a circle in the horizontal plane about a vertical axis passing through the fixed end of the string. The string makes angle ' $\\theta$ ' with the vertical. The angular frequency of the body is ' $\\omega$ '. The tension in the string is", "image": null}, "options": [{"id": "Rhhil", "text": "$\\mathrm{mL}^2 \\omega$", "image": null, "isCorrect": false}, {"id": "XkGiZ", "text": "$\\mathrm{mL} \\omega^2$", "image": null, "isCorrect": true}, {"id": "sZQXV", "text": "$\\frac{\\omega^2}{\\mathrm{~mL}}$", "image": null, "isCorrect": false}, {"id": "9G8dl", "text": "$\\frac{m \\omega^2}{L}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In case of conical pendulum, the tension in the string provides the necessary centripetal force.\n$\\therefore \\quad \\mathrm{T}=\\mathrm{mr} \\omega^2=\\mathrm{mL} \\omega^2 \\quad \\ldots($ Here, $\\mathrm{r}=\\mathrm{L})$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262650279619d9d8a342f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "A particle moves around a circular path of radius ' $r$ ' with uniform speed ' $V$ '. After moving half the circle, the average acceleration of the particle is", "image": null}, "options": [{"id": "ei3CG", "text": "$\\frac{\\mathrm{V}^2}{\\mathrm{r}}$", "image": null, "isCorrect": false}, {"id": "mLQDB", "text": "$\\frac{2 \\mathrm{~V}^2}{\\mathrm{r}}$", "image": null, "isCorrect": false}, {"id": "Qo3qi", "text": "$\\frac{2 \\mathrm{~V}^2}{\\pi \\mathrm{r}}$", "image": null, "isCorrect": true}, {"id": "bYH9X", "text": "$\\frac{\\mathrm{V}^2}{\\pi \\mathrm{r}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "At end points of the half revolution magnitude of the velocity is same but it directs in opposite direction.\n$$\n\\begin{array}{ll}\n\\therefore & \\Delta V=V-(-V) \\\\\n\\therefore & \\Delta V=2 V\n\\end{array}\n$$\n\nTime taken to complete the half revolution is $\\mathrm{t}=\\frac{\\pi \\mathrm{r}}{\\mathrm{V}}$\n\nAverage acceleration is, $a=\\frac{\\Delta V}{t}=\\frac{2 \\mathrm{~V}}{\\frac{\\pi \\mathrm{r}}{\\mathrm{V}}}$\n$$\n\\therefore \\quad a=\\frac{2 V^2}{\\pi r}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262520279619d9d8a3392", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "A thin uniform rod $A B$ of mass ' $\\mathrm{m}$ ' and length ' $l$ ' is hinged at one end A to the ground level. Initially the rod stands vertically and is allowed to fall freely to the ground in the vertical plane. The angular velocity of the rod when its end B strikes the ground is ( $g$ = acceleration due to gravity)", "image": null}, "options": [{"id": "r9jdN", "text": "$\\sqrt{\\frac{g}{l}}$", "image": null, "isCorrect": false}, {"id": "DMvvZ", "text": "$\\sqrt{\\frac{\\mathrm{mg}}{l}}$", "image": null, "isCorrect": false}, {"id": "SBnAT", "text": "$\\sqrt{\\frac{3 \\mathrm{~g}}{l}}$", "image": null, "isCorrect": true}, {"id": "wWP5G", "text": "$\\sqrt{\\frac{\\mathrm{mg}}{3 l}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We know,\nLoss in P.E = Gain in rotational K.E.\nWhen the centre of mass of the rod falls through a distance $\\frac{\\mathrm{L}}{2}$,\nLoss in P.E $=m g \\frac{L}{2}$                            ...(i)\nand,\nGain in Rotational K.E $=\\frac{1}{2} \\mathrm{I} \\omega^2=\\frac{1}{2}\\left[\\frac{\\mathrm{ML}^2}{3}\\right] \\omega^2$   ...(ii)\nEquating (i) and (ii)\n$$\n\\begin{aligned}\n& \\frac{\\mathrm{MgL}}{2}=\\frac{1}{2} \\frac{\\mathrm{ML}^2}{3} \\omega^2 \\\\\n& \\omega^2=\\frac{3 \\mathrm{~g}}{\\mathrm{~L}} \\\\\n& \\omega=\\sqrt{\\frac{3 \\mathrm{~g}}{\\mathrm{~L}}}=\\sqrt{\\frac{3 \\mathrm{~g}}{l}} \\quad \\ldots(\\because \\text { here } \\mathrm{L}=l)\n\\end{aligned}\n$$\n$\\ldots(\\because$ here $\\mathrm{L}=l)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2622f0279619d9d8a3277", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "A particle is moving in a circle with uniform speed ' $v$ '. In moving from a point to another diametrically opposite point", "image": null}, "options": [{"id": "qOOro", "text": "the momentum changes by $\\mathrm{mv}$", "image": null, "isCorrect": false}, {"id": "iKtvt", "text": "the momentum changes by $2 \\mathrm{mv}$", "image": null, "isCorrect": true}, {"id": "9nLUN", "text": "the kinetic energy changes by $\\frac{1}{2} \\mathrm{mv}^2$", "image": null, "isCorrect": false}, {"id": "tw4Jb", "text": "the kinetic energy changes by $\\mathrm{mv}^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/_TizPQEXfDeNBAK0c_3EiRj6TYV4m6TTw5xhr4J4mU0.original.fullsize.png\"><br>\nAt both points, the momentum will be mv, but will be in opposite directions.\n$$\n\\begin{array}{ll}\n\\therefore & \\Delta \\mathrm{P}=\\mathrm{mv}-(-\\mathrm{mv}) \\\\\n\\therefore & \\Delta \\mathrm{P}=2 \\mathrm{mv}\n\\end{array}\n$$\nThe momentum changes by $2 \\mathrm{mv}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261f80279619d9d8a30c9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "A disc has mass $M$ and radius $R$. How much tangential force should be applied to the rim of the disc, so as to rotate with angular velocity ' $\\omega$ ' in time $t$ ?", "image": null}, "options": [{"id": "l4iqY", "text": "$\\frac{\\mathrm{MR} \\omega}{4 \\mathrm{t}}$", "image": null, "isCorrect": false}, {"id": "nOfDn", "text": "$\\frac{\\mathrm{MR} \\omega}{2 \\mathrm{t}}$", "image": null, "isCorrect": true}, {"id": "jsq9a", "text": "$\\frac{\\mathrm{MR} \\omega}{\\mathrm{t}}$", "image": null, "isCorrect": false}, {"id": "3gdCv", "text": "$M R \\omega t$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Torque: $\\tau=\\mathrm{I} \\alpha=\\frac{\\mathrm{MR}^2}{2} \\times \\frac{\\omega}{\\mathrm{t}}$\n$$\n\\begin{array}{ll}\n\\therefore & \\tau=\\frac{\\mathrm{MR}^2 \\omega}{2 \\mathrm{t}} \\\\\n& \\text { But } \\tau=\\mathrm{R} \\times \\mathrm{F} \\\\\n\\therefore \\quad & \\mathrm{F}=\\frac{\\tau}{\\mathrm{R}}=\\frac{\\mathrm{MR} \\omega}{2 \\mathrm{t}}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261f50279619d9d8a30ad", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "A ball of mass ' $\\mathrm{m}$ ' is attached to the free end of a string of length ' $l$ '. The ball is moving in horizontal circular path about the vertical axis as shown in the diagram.\n\nThe angular velocity ' $\\omega$ ' of the ball will be [ $\\mathrm{T}=$ Tension in the string. $]$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/8enw5eInMEhKXSTYg2suZDAE2trI8d6VE8eRv3O9g8Q.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "JF24I", "text": "$\\sqrt{\\frac{\\mathrm{T} l}{\\mathrm{~m}}}$", "image": null, "isCorrect": false}, {"id": "COojd", "text": "$\\sqrt{\\frac{\\mathrm{Tm}}{l}}$", "image": null, "isCorrect": false}, {"id": "G4JoS", "text": "$\\sqrt{\\frac{\\mathrm{m} l}{\\mathrm{~T}}}$", "image": null, "isCorrect": false}, {"id": "jy4Be", "text": "$\\sqrt{\\frac{\\mathrm{T}}{\\mathrm{m} l}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/JaOpeWx8dLlCPESoHhWeCCKiWLTFQcVsrkGUlKybo4E.original.fullsize.png\"><br>\n\n\nThe tension in the string can be resolved in two components along the perpendicular axis. The gravitational force is acting downwards and the centrifugal force is acting in $-\\mathrm{x}$ direction\n$$\n\\begin{aligned}\n& \\mathrm{T} \\sin \\theta=\\mathrm{mr} \\omega^2 \\\\\n\\therefore \\quad & \\omega^2=\\frac{\\mathrm{T} \\sin \\theta}{\\mathrm{mr}}\n\\end{aligned}\n$$\n$$\n\\therefore \\quad \\omega=\\sqrt{\\frac{\\mathrm{T} \\sin \\theta}{\\mathrm{mr}}}\n$$\n\nFrom figure, $\\sin \\theta=\\frac{\\mathrm{r}}{l}$\n$$\n\\begin{aligned}\n& \\therefore \\quad \\omega=\\sqrt{\\frac{\\mathrm{Tr}}{\\mathrm{mr} l}} \\\\\n& \\therefore \\quad \\omega=\\sqrt{\\frac{\\mathrm{T}}{\\mathrm{m} l}} \\\\\n&\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261f40279619d9d8a30a7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "A particle moves along a circular path with decreasing speed. Hence", "image": null}, "options": [{"id": "knZSv", "text": "its resultant acceleration is towards the centre.", "image": null, "isCorrect": false}, {"id": "qQP1K", "text": "it moves in a spiral path with decreasing radius.", "image": null, "isCorrect": false}, {"id": "uPtiV", "text": "the direction of angular momentum remains constant.", "image": null, "isCorrect": true}, {"id": "Pg1IU", "text": "its angular momentum remains constant", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The direction of angular moment remains constant as the angular momentum is a vector quantity, and its direction is perpendicular to the plane of motion. As the speed decreases, the linear momentum decreases, but the angular momentum remains constant due to the conservation of angular momentum.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261e60279619d9d8a303b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "A particle performing uniform circular motion of radius $\\frac{\\pi}{2} \\mathrm{~m}$ makes ' $\\mathrm{x}$ ' revolutions in time ' $\\mathrm{t}$ '. Its tangential velocity is", "image": null}, "options": [{"id": "0A3uX", "text": "$\\frac{\\pi \\mathrm{X}}{\\mathrm{t}}$", "image": null, "isCorrect": false}, {"id": "r5r3s", "text": "$\\frac{\\pi \\mathrm{x}^2}{\\mathrm{t}}$", "image": null, "isCorrect": false}, {"id": "EvM30", "text": "$\\frac{\\pi^2 x^2}{t}$", "image": null, "isCorrect": false}, {"id": "f4XEh", "text": "$\\frac{\\pi^2 x}{t}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\text { Circumference of the circle }=2 \\pi \\mathrm{r} \\\\ & \\therefore \\quad \\text { Tangential velocity }=\\frac{\\text { Distance Travelled }}{\\text { Time }} \\\\ & \\qquad \\frac{\\pi^2 \\times x}{\\mathrm{t}} \\\\ & =\\frac{\\pi^2 x}{\\mathrm{t}}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261c00279619d9d8a2f0c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "A particle at rest starts moving with constant angular acceleration $4 \\mathrm{rad} / \\mathrm{s}^2$ in circular path. At what time the magnitudes of its tangential acceleration and centrifugal acceleration will be equal?", "image": null}, "options": [{"id": "6O2l6", "text": "$0.4 \\mathrm{~s}$", "image": null, "isCorrect": false}, {"id": "P0sSF", "text": "$0.5 \\mathrm{~s}$", "image": null, "isCorrect": true}, {"id": "qZW9M", "text": "$0.8 \\mathrm{~s}$", "image": null, "isCorrect": false}, {"id": "5DjYE", "text": "$1.0 \\mathrm{~s}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In rotational motion,\n$\\begin{aligned}\n& \\omega=\\omega_0+\\alpha \\mathrm{t} \\\\\n& \\omega=\\alpha \\mathrm{t}\n\\end{aligned}$\n$\\text { ( } \\because \\omega_0=0 \\text {; particle at rest.) }$\n$\\therefore \\quad$ Centrifugal acceleration $\\mathrm{a}=\\omega^2 \\mathrm{r}$\n$\\therefore \\quad \\mathrm{a}=\\alpha^2 \\mathrm{t}^2 \\mathrm{r}$\nTangential acceleration $\\mathrm{a}_{\\mathrm{t}}=\\alpha \\times \\mathrm{r}$\nGiven: $\\mathrm{a}=\\mathrm{a}_{\\mathrm{t}}$\n$\\Rightarrow \\alpha^2 \\mathrm{t}^2 \\mathrm{r}=\\alpha \\mathrm{r}$\n$\\mathrm{t}^2=\\frac{1}{\\alpha}=\\frac{1}{4}$\n$\\therefore \\quad \\mathrm{t}=\\frac{1}{2}=0.5 \\mathrm{~s}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261bb0279619d9d8a2ee3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "A particle of mass ' $\\mathrm{m}$ ' moves along a circle of radius ' $r$ ' with constant tangential acceleration. If K.E. of the particle is ' $E$ ' by the end of third revolution after beginning of the motion, then magnitude of tangential acceleration is", "image": null}, "options": [{"id": "uYMUX", "text": "$\\frac{E}{2 \\pi \\mathrm{rm}}$", "image": null, "isCorrect": false}, {"id": "7Hqt7", "text": "$\\frac{\\mathrm{E}}{6 \\pi \\mathrm{rm}}$", "image": null, "isCorrect": true}, {"id": "0y3OZ", "text": "$\\frac{\\mathrm{E}}{8 \\pi \\mathrm{rm}}$", "image": null, "isCorrect": false}, {"id": "bJQR7", "text": "$\\frac{\\mathrm{E}}{4 \\pi \\mathrm{rm}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\text { Using } 3^{\\text {rd }} \\text { equation of motion, } \\\\ & \\mathrm{v}^2=\\mathrm{u}^2+2 \\mathrm{as} \\\\ & \\therefore \\quad \\mathrm{v}^2=2 \\mathrm{a}_{\\mathrm{t}} \\mathrm{s} \\quad \\ldots .(\\text { For } \\mathrm{u}=0)\\end{aligned}$\n$\\therefore \\quad \\mathrm{a}_{\\mathrm{t}}=\\frac{\\mathrm{v}^2}{2 \\mathrm{~s}}$\nBy the end of $3^{\\text {rd }}$ revolution, distance covered,\n$\\begin{aligned}\n& \\mathrm{s}=3(2 \\pi \\mathrm{r})=6 \\pi \\mathrm{r} \\\\\n\\therefore \\quad & \\mathrm{a}_{\\mathrm{t}}=\\frac{\\mathrm{v}^2}{2 \\times 6 \\pi \\mathrm{r}}... (i)\n\\end{aligned}$\n$\\begin{aligned} & \\text { Also, } \\frac{1}{2} \\mathrm{mv}^2=\\mathrm{E} \\\\ \\therefore \\quad & \\mathrm{v}^2=\\frac{2 \\mathrm{E}}{\\mathrm{m}}... (ii)\\end{aligned}$\nSubstituting equation (ii) in equation (i),\n$a_t=\\frac{2 E}{2 \\times 6 \\pi r \\times m}=\\frac{E}{6 \\pi r m}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261940279619d9d8a2db6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "In non-uniform circular motion, the ratio of tangential to radial acceleration is ( $r$ is radius of circle, $v$ is speed of the particle, $\\alpha$ is angular acceleration)", "image": null}, "options": [{"id": "FgXJl", "text": "$\\frac{\\alpha r^2}{v^2}$", "image": null, "isCorrect": true}, {"id": "pI8T3", "text": "$\\frac{\\alpha^2 r}{v^2}$", "image": null, "isCorrect": false}, {"id": "Qui72", "text": "$\\frac{\\alpha^2 r^2}{v}$", "image": null, "isCorrect": false}, {"id": "ScXpY", "text": "$\\frac{v^2}{r^2 \\alpha}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Ratio of tangential to radial acceleration is given by,\n$\\frac{a_t}{a_r}=\\frac{r \\alpha}{v^2 / r}=\\frac{r^2 \\alpha}{v^2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261830279619d9d8a2d2d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "A body moving in a circular path with a constant speed, it has constant", "image": null}, "options": [{"id": "JPZ00", "text": "momentum", "image": null, "isCorrect": false}, {"id": "szMB9", "text": "kinetic energy", "image": null, "isCorrect": true}, {"id": "ZxX74", "text": "acceleration", "image": null, "isCorrect": false}, {"id": "iRJSK", "text": "velocity", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We can see that direction of velocity and acceleration change continuously.\n$\\therefore$ both are not constant.\nMomentum is $p=m \\vec{v}$ which depends on velocity and changes with velocity. The only quantities, the speed $|\\vec{v}|$ and the kinetic energy is $\\frac{1}{2} m|\\vec{v}|^2$ are constant during uniform circular motion.\nTherefore, the answer is kinetic energy.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261810279619d9d8a2d1e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "Two bodies of masses $\\mathrm{m}$ and $3 \\mathrm{~m}$ are rotating in horizontal circles of radius $r$ and $\\frac{r}{3}$ respectively. The tangential speed of body of mass $m$ is $n$ times that of the value of heavier body. while the centripetal force is same for both. The value of $n$ is", "image": null}, "options": [{"id": "vQrId", "text": "3", "image": null, "isCorrect": true}, {"id": "53slW", "text": "9", "image": null, "isCorrect": false}, {"id": "hQoF6", "text": "1", "image": null, "isCorrect": false}, {"id": "dlTEA", "text": "6", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Centripetal force is same on both, therefore:\n$\\begin{aligned} & \\frac{m(n v)^2}{r}=\\frac{3 m v^2}{\\left(\\frac{r}{3}\\right)} \\\\ & \\Rightarrow n^2=9 \\\\ & \\Rightarrow n=3\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261720279619d9d8a2ca3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "A particle performing U.C.M. of radius $\\frac{\\pi}{2} \\mathrm{~m}$ makes ${ }_x$ revolutions in time\n$t$. Its tangential velocity is", "image": null}, "options": [{"id": "z2fxg", "text": "$\\frac{\\pi x}{t}$", "image": null, "isCorrect": false}, {"id": "QBWhz", "text": "$\\frac{\\pi^2 x}{t}$", "image": null, "isCorrect": true}, {"id": "YUWTp", "text": "$\\frac{\\pi^2 x^2}{t}$", "image": null, "isCorrect": false}, {"id": "pr3gV", "text": "$\\frac{2 \\pi x}{t}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Particle is under uniform circular motion,\nSo angular velocity is $\\omega=\\frac{2 \\pi x}{t}$\nThe tangential velocity is $v=\\omega R=\\left(\\frac{2 \\pi x}{t}\\right) R$\nGiven, $R=\\frac{\\pi}{2}$, therefore,\n$v=\\frac{\\pi^2 x}{t}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261620279619d9d8a2c1e", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "A particle of mass $10 \\mathrm{~g}$ moves along a circle of radius $6.4 \\mathrm{~cm}$ with a constant tangential acceleration. If the kinetic energy of the particle becomes $8 \\times 10^{-4} \\mathrm{~J}$ by the end of the second revolution after the beginning of the motion, the magnitude of the tangential acceleration is", "image": null}, "options": [{"id": "6Qjaa", "text": "0.6 m/s", "image": null, "isCorrect": false}, {"id": "GH2lg", "text": "0.4 m/s", "image": null, "isCorrect": false}, {"id": "n22HI", "text": "0.1 m/s", "image": null, "isCorrect": true}, {"id": "Jl55p", "text": "0.3 m/s", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Consider the following diagram:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/QJtgjKclOtF7n1JJ4O5Rn-d5lG2hmlckKcZE6JfJ_qE.original.fullsize.png\"><br>\nThe tangential acceleration is given by,\n$\\begin{aligned}\n& a_t=\\frac{\\mathrm{d} v}{\\mathrm{~d} t}=\\text { Constant } \\\\\n& \\Rightarrow \\frac{\\mathrm{d} v}{\\mathrm{~d} t}=a_t \\\\\n& \\Rightarrow \\frac{\\mathrm{d} s}{\\mathrm{~d} t} \\cdot \\frac{\\mathrm{d} v}{\\mathrm{~d} s}=a t \\\\\n& \\Rightarrow v=\\frac{\\mathrm{d} v}{\\mathrm{~d} t}=a_t \\\\\n& \\Rightarrow \\int_0^v \\frac{v^2}{2} \\mathrm{~d} v=\\int_0^{(4 \\pi r)} a_t \\mathrm{~d} s\n\\end{aligned}$\nWe know,<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/hrkKMnIN-nCdZwF22QyRZZ5pBruPUHwt_BJ6Xoj8cpA.original.fullsize.png\"><br>\nNow, kinetic energy is given by,\n$K E=\\frac{m v^2}{2}$<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/1QssBG--JkKzkTSs9LiGLWeWTg2OXEUClMNH_2yn1rY.original.fullsize.png\"><br>\nNow, using eq ${ }^{\\mathrm{n}}(1) \\&(2)$\n$\\begin{aligned}\n& \\left(\\frac{2 K E}{m}\\right)=(8 \\pi r) a_t \\\\\n& \\Rightarrow a_t=\\left(\\frac{K E}{(4 \\pi r) m}\\right)\n\\end{aligned}$\nGiven, $K E=8 \\times 10^{-4} \\mathrm{~J}, r=6.4 \\times 10^{-2} \\mathrm{~m}$ and $m=1 \\times 10^{-2} \\mathrm{~kg}$.\n$\\Rightarrow a_t=\\frac{\\left(8 \\times 10^{-4}\\right) \\mathrm{J}}{4 \\pi\\left(6.4 \\times 10^{-2} \\mathrm{~m}\\right)\\left(10^{-2} \\mathrm{~kg}\\right)}=0.1 \\mathrm{~m} / \\mathrm{s}^2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261610279619d9d8a2c17", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "A particle is moving along a circular path with constant speed and centripetal acceleration $a$. If the speed is doubled, the ratio of its acceleration after and before the change is", "image": null}, "options": [{"id": "zCBD6", "text": "2:1", "image": null, "isCorrect": false}, {"id": "OVaEi", "text": "4:1", "image": null, "isCorrect": true}, {"id": "Z5oMa", "text": "3:1", "image": null, "isCorrect": false}, {"id": "ef1Ke", "text": "1:4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n& \\text { Centripetal acceleration }=\\frac{v^2}{R} \\\\\n& \\therefore a \\propto v^2\n\\end{aligned}$\nIf the speed is doubled, then the ratio of its acceleration after and before are in $4: 1$ ratio.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2614b0279619d9d8a2b62", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "A particle is moving in U.C.M. with speed $V$ and radius $R$. The angular acceleration of the particle is", "image": null}, "options": [{"id": "jKcbv", "text": "$\\frac{V^2}{R}$ Perpendicular to the plane of the circle.", "image": null, "isCorrect": false}, {"id": "lCLHx", "text": "$\\frac{V^2}{R}$ along the tangent to the circle.", "image": null, "isCorrect": false}, {"id": "FSvk6", "text": "$\\frac{V^2}{R}$ along the radius towards the centre of the circle.", "image": null, "isCorrect": false}, {"id": "gRcj6", "text": "zero.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Concept-based.\nDuring uniform circular motion, the angular velocity is fixed therefore, the angular acceleration is zero.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261390279619d9d8a2ad2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "A particle of mass ' $m$ ' performs uniform circular motion of radius ' $r$ ' with linear speed ' $v$ ' under the application of force ' $F$ '. If $\\mathrm{m}, \\mathrm{v}$ and $\\mathrm{r}$ are all increased by $50 \\%$, the necessary change in force required to maintain the particle in uniform circular motion is", "image": null}, "options": [{"id": "YLAJk", "text": "$125 \\%$", "image": null, "isCorrect": true}, {"id": "Rmcbb", "text": "$150 \\%$", "image": null, "isCorrect": false}, {"id": "KiVDl", "text": "$100 \\%$", "image": null, "isCorrect": false}, {"id": "5kGWq", "text": "$225 \\%$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given that, Mass $=\\mathrm{m}$, Velocity $=\\mathrm{v}$, Radius $=\\mathrm{r}$\nWe know that, The force is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/o5J28tK5ee2aFi2YLCumC8aX0ZayfMxaFXDxIcyn9ec.original.fullsize.png\">\nNow, the increment is $50 \\%$ in mass, velocity and radius\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/pJ_XnLYr4lMBDnS1CIY-C3u4m0Ie-ju-5XJMWvJFswg.original.fullsize.png\">\nNow, new force is\n$F^{\\prime}=\\frac{\\left(m+\\frac{m}{2}\\right)\\left(v+\\frac{v}{2}\\right)^2}{\\left(r+\\frac{r}{2}\\right)}=\\frac{\\frac{3}{2} m \\times \\frac{9}{4} v^2}{\\frac{3}{2} r}=F \\times \\frac{9}{4}$\nNow, the \\% change in force\n$\\frac{F^{\\prime}-F}{F} \\times 100=\\left(\\frac{9}{4}-1\\right) \\times 100=125 \\%$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260ef0279619d9d8a287e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}], "question": {"text": "A particle is performing a uniform circular motion along a circular of radius ' $\\mathrm{R}$ '. In half the period of revolution, its displacement and distance covered are respectively", "image": null}, "options": [{"id": "kfmgk", "text": "$2 R, \\pi R$", "image": null, "isCorrect": true}, {"id": "S5ACB", "text": "$R, \\pi R$", "image": null, "isCorrect": false}, {"id": "EWiEa", "text": "$2 \\mathrm{R}, 2 \\pi \\mathrm{R}$", "image": null, "isCorrect": false}, {"id": "uvh98", "text": "$\\sqrt{2 R}, 2 \\pi R$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In half the period, particle is diametrically opposite to its initial position. Hence, its displacement is $2 \\mathrm{R}$. It has covered a semicircle, hence distance covered by particle is $\\pi \\mathrm{R}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260cc0279619d9d8a2768", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "A particle is moving along the circular path with constant speed and centripetal acceleration ' $a$ '. If the speed is doubled, the ratio of its acceleration after and before the change is", "image": null}, "options": [{"id": "mNval", "text": "3:1", "image": null, "isCorrect": false}, {"id": "GG0cB", "text": "1:4", "image": null, "isCorrect": false}, {"i
