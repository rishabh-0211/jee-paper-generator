d": "2412C", "text": "2:1", "image": null, "isCorrect": false}, {"id": "UESkh", "text": "4:1", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Centripetal acceleration is given by\n$\\begin{aligned}\n& \\mathrm{a}=\\frac{\\mathrm{v}^2}{\\mathrm{r}} \\therefore \\mathrm{a} \\propto \\mathrm{v}^2 \\\\\n& \\therefore \\frac{\\mathrm{a}_2}{\\mathrm{a}_1}=\\left(\\frac{\\mathrm{v}_2}{\\mathrm{v}_1}\\right)^2=(2)^2=4\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260c80279619d9d8a2744", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "A body of mass ' $\\mathrm{m}$ ' is moving with speed ' $\\mathrm{V}$ ' along a circular path of radius ' $r$ '. Now the speed is reduced to $\\frac{\\mathrm{V}}{2}$ and radius is increased to ' $3 r$ '. For this change, initial centripetal force needs to be", "image": null}, "options": [{"id": "KD3kP", "text": "increased by $\\frac{7}{12}$ times.", "image": null, "isCorrect": false}, {"id": "f4jZP", "text": "increased by $\\frac{10}{12}$ times.", "image": null, "isCorrect": false}, {"id": "sc6Wp", "text": "increased by $\\frac{11}{12}$ times.", "image": null, "isCorrect": true}, {"id": "dXhNU", "text": "increased by $\\frac{1}{12}$ times.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\text { Centripetal force, } \\mathrm{F}=\\frac{\\mathrm{mv}^2}{\\mathrm{r}} \\\\ & \\mathrm{F}_1=\\frac{\\mathrm{mv}_1^2}{\\mathrm{r}_1} \\text { and } \\mathrm{F}_2=\\frac{\\mathrm{mv}_2^2}{\\mathrm{r}_2} \\\\ & \\frac{\\mathrm{F}_2}{\\mathrm{~F}_1}=\\frac{\\mathrm{v}_2^2}{\\mathrm{v}_1^2} \\cdot \\frac{\\mathrm{r}_1}{\\mathrm{r}_2} \\\\ & \\mathrm{v}_2=\\frac{\\mathrm{v}_1}{2} \\text { and } \\mathrm{r}_2=3 \\mathrm{r}_1 \\\\ & \\frac{\\mathrm{F}_2}{\\mathrm{~F}_1}=\\left(\\frac{1}{2}\\right)^2 \\cdot \\frac{1}{3}=\\frac{1}{12} \\\\ & \\mathrm{v}_2=\\frac{\\mathrm{v}_1}{2} \\text { and } \\mathrm{r}_2=3 \\mathrm{r}_1 \\\\ & \\frac{\\mathrm{F}_2}{\\mathrm{~F}_1}=\\left(\\frac{1}{2}\\right)^2 \\cdot \\frac{1}{3}=\\frac{1}{12} \\\\ & \\mathrm{~F}_2=\\frac{\\mathrm{F}_1}{12}\\end{aligned}$\nChange in force $=F_2-F_1=\\frac{F_1}{12}-F_1=-\\frac{11}{12} F_1$ Hence force is decreased by $\\frac{11}{12}$ times.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260b70279619d9d8a26b8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "A particle is performing U.C.M. along the circumference of circle of diameter $50 \\mathrm{~cm}$ with frequency $2 \\mathrm{~Hz}$. The acceleration of the particle in $\\mathrm{m} / \\mathrm{s}^2$ is", "image": null}, "options": [{"id": "oafiu", "text": "$2 \\pi^2$", "image": null, "isCorrect": false}, {"id": "sanrZ", "text": "$4 \\pi^2$", "image": null, "isCorrect": true}, {"id": "F4mDm", "text": "$8 \\pi^2$", "image": null, "isCorrect": false}, {"id": "X8T1Y", "text": "$\\pi^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{d}=50 \\mathrm{~cm} \\\\ & \\therefore \\mathrm{r}=25 \\times 10^{-2} \\mathrm{~m}, \\mathrm{f}=2 \\mathrm{~Hz} \\\\ & \\mathrm{a}=\\mathrm{r} \\omega^2=4 \\pi^2 \\mathrm{f}^2 \\mathrm{r}=4 \\pi^2 \\times 4 \\times 25 \\times 10^{-2}=4 \\pi^2\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260900279619d9d8a2582", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "A body attached to one end of a string performs motion along a vertical circle. Its centripetal acceleration, when the string is horizontal, will be [ $\\mathrm{g}$ = acceleration due to gravity]", "image": null}, "options": [{"id": "sV0ew", "text": "zero", "image": null, "isCorrect": false}, {"id": "T5mud", "text": "5g", "image": null, "isCorrect": false}, {"id": "1rMhy", "text": "3g", "image": null, "isCorrect": true}, {"id": "4EelR", "text": "g", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When string is horizontal its speed is given by\n$$\n\\begin{aligned}\n& \\mathrm{V}=\\sqrt{3 \\mathrm{gr}} \\\\\n& \\text { Centripetal acceleration }=\\frac{\\mathrm{V}^2}{\\mathrm{r}}=3 \\mathrm{~g}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260700279619d9d8a2481", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "A body performing uniform circular motion of radius ' $R$ ' has frequency ' $n$ '. Its centripetal acceleration is", "image": null}, "options": [{"id": "mBpSQ", "text": "$8 \\pi^2 nR^2$", "image": null, "isCorrect": false}, {"id": "kf4J9", "text": "$4 \\pi^2 n^2 R$", "image": null, "isCorrect": true}, {"id": "A0X8e", "text": "$4 \\pi^2 n^2 R^2$", "image": null, "isCorrect": false}, {"id": "hGVUc", "text": "$8 \\pi^2 n^2 R$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Centripetal acceleration $a=r \\omega^2=R(2 \\pi n)^2$ $=4 \\pi^2 n^2 R$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2606f0279619d9d8a2479", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "If $\\omega_1$ is angular velocity of hour hand of clock and $\\omega_2$ is angular velocity of the earth, then the ratio $\\omega_1: \\omega_2$ is", "image": null}, "options": [{"id": "k7P6a", "text": "$1: 2$", "image": null, "isCorrect": false}, {"id": "vhdvO", "text": "$2: 3$", "image": null, "isCorrect": false}, {"id": "m1g9j", "text": "$3: 2$", "image": null, "isCorrect": false}, {"id": "BFffM", "text": "$2: 1$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\frac{\\omega_1}{\\omega_2}=\\frac{\\mathrm{T}_2}{\\mathrm{~T}_1}=\\frac{24 \\text { hours }}{12 \\text { hours }}=2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2606f0279619d9d8a2478", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "The angular displacement of body performing circular motion is given by $\\theta=5 \\sin \\frac{\\pi t}{6}$. The angular velocity of the body at $t=3$ second will be $\\left[\\sin \\frac{\\pi}{2}=1, \\cos \\frac{\\pi}{2}=0\\right]$", "image": null}, "options": [{"id": "ycT75", "text": "$5 \\frac{\\mathrm{rad}}{\\mathrm{s}}$", "image": null, "isCorrect": false}, {"id": "rHvDp", "text": "$1 \\frac{\\mathrm{rad}}{\\mathrm{s}}$", "image": null, "isCorrect": false}, {"id": "QYlLp", "text": "$2.5 \\frac{\\mathrm{rad}}{\\mathrm{s}}$", "image": null, "isCorrect": false}, {"id": "SfIp3", "text": "zero", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\theta=5 \\sin \\frac{\\pi t}{6} \\\\ & \\therefore \\frac{\\mathrm{d} \\theta}{\\mathrm{dt}}=\\frac{\\pi}{6} \\cdot 5 \\cos \\frac{\\pi \\mathrm{t}}{6} \\\\ & \\text { At } \\mathrm{t}=3 \\mathrm{~s}, \\frac{\\mathrm{d} \\theta}{\\mathrm{dt}}=\\frac{5 \\pi}{6} \\cos \\frac{\\pi \\times 3}{6}=\\frac{5 \\pi}{6} \\cos \\frac{\\pi}{2}=0\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260110279619d9d8a217b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}], "question": {"text": "A particle is revolving in anticlockwise sense along the circumference of a circle of radius 'r' with linear velocity 'v', then the angle between ' $\\mathrm{v}^{\\prime}$ and angular velocity '$\\omega^{\\prime}$ will be", "image": null}, "options": [{"id": "HjQU2", "text": "$180^{\\circ}$", "image": null, "isCorrect": false}, {"id": "2jbPr", "text": "$90^{\\circ}$", "image": null, "isCorrect": true}, {"id": "hZFWr", "text": "$45^{\\circ}$", "image": null, "isCorrect": false}, {"id": "MW993", "text": "$0^{\\circ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fff0279619d9d8a20ea", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "A particle of mass 'm' moves along a circle of radius 'r' with constant tangential\nacceleration. If kinetic energy 'E' of the particle becomes three times by the end of\nthird revolution after beginning of the motion then the magnitude of tangential\nacceleration is", "image": null}, "options": [{"id": "dus8V", "text": "$\\frac{\\mathrm{E}}{12 \\pi \\mathrm{rm}}$", "image": null, "isCorrect": false}, {"id": "Wl4sV", "text": "$\\frac{\\mathrm{E}}{3 \\pi \\mathrm{rm}}$", "image": null, "isCorrect": false}, {"id": "Ol5px", "text": "$\\frac{\\mathrm{E}}{6 \\pi \\mathrm{rm}}$", "image": null, "isCorrect": true}, {"id": "baqdA", "text": "$\\frac{\\mathrm{E}}{24 \\pi \\mathrm{rm}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{E}_{1}=\\frac{1}{2} \\mathrm{mv}^{2}=\\frac{1}{2} \\mathrm{mr}^{2} \\omega_{1}^{2}$\n$E_{2}=\\frac{3}{2} m r^{2} \\omega_{1}^{2}$\n$\\frac{E_{2}}{E_{1}}=3 \\quad \\therefore E_{2}=3 E_{1}$\n$\\frac{1}{2} \\mathrm{mr}^{2} \\omega^{2}=3 \\frac{1}{2} \\mathrm{~m} \\omega_{0}^{2} \\mathrm{r}^{2}$\n$\\omega^{2}=3 \\omega_{0}^{2}$\n$\\frac{1}{2} m \\omega_{0}^{2} r^{2}=E$\n$\\omega_{0}^{2}=\\frac{2 \\mathrm{E}}{\\mathrm{mr}^{2}}$\n$\\omega^{2}=\\omega_{0}^{2}+2 \\alpha \\theta$\n$3 \\omega_{0}^{2}=\\omega_{0}^{2}+2 \\alpha(3.2 \\pi)$\n$2 \\omega_{0}^{2}=12 \\alpha \\pi$\n$\\alpha=\\frac{\\omega_{0}^{2}}{6 \\pi}=\\frac{2 \\mathrm{E}}{\\mathrm{mr}^{2}} \\times \\frac{1}{6 \\pi}=\\frac{\\mathrm{E}}{3 \\pi \\mathrm{mr}^{2}}$\nBut $\\mathrm{a}=r \\alpha=r \\times \\frac{\\mathrm{E}}{3 \\pi \\mathrm{mr}^{2}}=\\frac{\\mathrm{E}}{3 \\pi \\mathrm{mr}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fec0279619d9d8a2053", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "A body is moving along a circular track of radius $100 \\mathrm{~m}$ with velocity $20 \\mathrm{~m} / \\mathrm{s}$. Its\ntangential acceleration is $3 \\mathrm{~m} / \\mathrm{s}^{2}$, then its resultant acceleration will be", "image": null}, "options": [{"id": "Tm6ex", "text": "$3 \\mathrm{~m} / \\mathrm{s}^{2}$", "image": null, "isCorrect": false}, {"id": "rRNye", "text": "$5 \\mathrm{~m} / \\mathrm{s}^{2}$", "image": null, "isCorrect": true}, {"id": "RJkwP", "text": "$4 \\mathrm{~m} / \\mathrm{s}^{2}$", "image": null, "isCorrect": false}, {"id": "e4fGy", "text": "$2 \\mathrm{~m} / \\mathrm{s}^{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(A)\nTangential acceleration $\\mathrm{a}_{\\mathrm{t}}=3 \\mathrm{~m} / \\mathrm{s}^{2}$\nradial acceleration $\\mathrm{a}_{\\mathrm{r}}=\\frac{\\mathrm{V}^{2}}{\\mathrm{r}}=\\frac{(20)^{2}}{100}=4 \\mathrm{~m} / \\mathrm{s}^{2}$\nTotal acceleration $=\\sqrt{a_{r}^{2}+a_{C}^{2}}=\\sqrt{(4)^{2}+(3)^{2}}=5 \\mathrm{~m} / \\mathrm{s}^{2}$", "image": null}, "videoSolution": null, :00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "A particle is moving in a circle of radius 'R' with constant speed 'V'. The magnitude of average acceleration after half revolution is", "image": null}, "options": [{"id": "neRqt", "text": "$\\frac{2 V^{2}}{\\pi R}$", "image": null, "isCorrect": true}, {"id": "Vyo9w", "text": "$\\frac{2 \\pi}{R V^{2}}$", "image": null, "isCorrect": false}, {"id": "220mn", "text": "$\\frac{2 \\mathrm{~V}}{\\pi \\mathrm{R}^{2}}$", "image": null, "isCorrect": false}, {"id": "F2Aha", "text": "$\\frac{2 R}{\\pi V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Change in speed after half revolution is $2 \\mathrm{~V}$\n$$\n\\begin{aligned}\n\\quad & \\text { Time taken }=\\frac{\\pi R}{V} \\\\\n\\therefore \\quad \\text { average speed } &=\\frac{2 V^{2}}{\\pi R}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f9f0279619d9d8a1df5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "Two cars of masses $m_{1}$ and $m_{2}$ are moving in circles of radii $r_{1}$ and $r_{2}$ respectively. Their speeds are such that they make complete circles in the same time $\\mathrm{t}$. The ratio of their centripetal force is", "image": null}, "options": [{"id": "UDC2w", "text": "$\\mathrm{m}_{1}: \\mathrm{m}_{ , when they experience same centripetal force. The value of $\\mathrm{n}$ is", "image": null}, "options": [{"id": "VR5LM", "text": "2", "image": null, "isCorrect": false}, {"id": "dQCNZ", "text": "3", "image": null, "isCorrect": true}, {"id": "kuFvq", "text": "1", "image": null, "isCorrect": false}, {"id": "gui2S", "text": "4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Centripetal force $=\\frac{\\mathrm{mV}_{1}^{2}}{\\mathrm{r}}=\\frac{3 \\mathrm{mV}_{2}^{2}}{\\left(\\frac{\\mathrm{r}}{3}\\right)}$\n$\\begin{aligned} \\frac{\\mathrm{V}_{1}^{2}}{\\mathrm{~V}_{2}^{2}} &=9 \\\\ \\frac{\\mathrm{V}_{1}^{2}}{\\mathrm{~V}_{2}^{2}} &=3 \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f450279619d9d8a1b1e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}], "question": {"text": "A particle performing U.C.M. of radius $\\frac{\\pi}{2} \\mathrm{~m}$ makes ' $\\mathrm{x}$ ' revolutions in time ' $\\mathrm{t}^{\\prime}$. Its\ntangential velocity is", "image": null}, "options": [{"id": "lsQ3F", "text": "$\\frac{\\pi t}{x^{2}}$", "image": null, "isCorrect": false}, {"id": "aq8XG", "text": "$\\frac{\\pi \\mathrm{x}^{2}}{\\mathrm{t}}$", "image": null, "isCorrect": false}, {"id": "Fyaz7", "text": "$\\frac{\\pi \\mathrm{X}}{\\mathrm{t}^{2}}$", "image": null, "isCorrect": false}, {"id": "bFfS5", "text": "$\\frac{\\pi^{2} x}{t}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "frequency $f=\\frac{x}{t}, \\omega=2 \\pi f=\\frac{2 \\pi x}{t}$ tangential velocity\n$$\nV=\\omega r=\\frac{2 \\pi x}{t} \\cdot \\frac{\\pi}{2}=\\frac{\\pi^{2} x}{t}=3\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f420279619d9d8a1b05", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}], "question": {"text": "Earth revolves round the sun in a circular orbit of radius 'R'. The angular\nmomentum of the revolving earth is directly proportional to", "image": null}, "options": [{"id": "nZ2RE", "text": "$\\mathrm{R}^{2}$", "image": null, "isCorrect": false}, {"id": "NFUIZ", "text": "$\\mathrm{R}^{3}$", "image": null, "isCorrect": false}, {"id": "7MjPS", "text": "$\\mathrm{R}$", "image": null, "isCorrect": false}, {"id": "RC7mC", "text": "$\\sqrt{\\mathrm{R}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Correct option is A)\nWe know that angular momentum of Earth\n$$\n\\begin{array}{l}\n\\mathrm{L}=\\mathrm{mvR} \\\\\n\\Rightarrow \\mathrm{L}=\\mathrm{m} \\sqrt{\\frac{\\mathrm{GM}}{\\mathrm{R}}} \\times \\mathrm{R} \\\\\n\\Rightarrow \\mathrm{L} \\propto \\mathrm{R}^{1 / 2}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f3f0279619d9d8a1af0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}], "question": {"text": "A mass 'm' is tied to one end of a spring and whirled in a horizontal circle with\nconstant angular velocity. The elongation in the spring is $1 \\mathrm{~cm} .$ If the angular speed\nis doubled, the elongation in the spring is $6 \\mathrm{~cm}$. The original length of the spring is", "image": null}, "options": [{"id": "FX2ka", "text": "1. 3 Cm", "image": null, "isCorrect": false}, {"id": "AVXQS", "text": "9 $\\mathrm{Cm}$", "image": null, "isCorrect": true}, {"id": "TBMj7", "text": "6 Cn", "image": null, "isCorrect": false}, {"id": "74VTj", "text": "$12 \\mathrm{Cm}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $\\ell$ be the original length of the spring.\nLet the initial angular velocity be $\\omega$ and the corresponding elongation $\\mathbf{e}_{1}=1 \\mathrm{~cm}$.\nWhen the angular velocity is doubled the elongation $e_{2}=6 \\mathrm{~cm}$.\nIf $k$ is the spring constant then we have\n$$\n\\begin{array}{l}\n\\mathrm{m}\\left(\\ell+e_{1}\\right) \\omega^{2}=\\mathrm{ke}_{1} \\\\\n\\text { and } \\mathrm{m}\\left(\\ell+e_{2}\\right)(2 \\omega)^{2}=\\mathrm{ke}_{2} \\\\\n\\text { or } \\quad \\mathrm{m}\\left(\\ell+e_{2}\\right) \\cdot 4 \\omega^{2}=\\mathrm{ke}_{2}\n\\end{array}\n$$\nDividing Eq(1) by Eq(2), we get\n$$\n\\frac{\\ell+e_{1}}{4\\left(\\ell+e_{2}\\right)}=\\frac{e_{1}}{e_{2}}\n$$\nsolving we get $\\ell=9 \\mathrm{~cm}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f320279619d9d8a1a87", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}], "question": {"text": "A thin circular ring of mass 'M' and radius 'r' is rotating about its axis with an angular speed ' $\\omega$ '. Two particles each of mass 'm' are now attached at diametrically opposite points. The angular speed of the ring will become", "image": null}, "options": [{"id": "Lweo7", "text": "$\\frac{\\omega M}{M+2 m}$", "image": null, "isCorrect": true}, {"id": "iAbAG", "text": "$\\frac{\\omega M}{M+m}$", "image": null, "isCorrect": false}, {"id": "ue6VH", "text": "$\\frac{\\omega(M-2 m)}{M}$", "image": null, "isCorrect": false}, {"id": "YFxul", "text": "$\\frac{\\omega(M-2 m)}{M+2 m}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f310279619d9d8a1a81", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}], "question": {"text": "A particle is performing uniform circular motion. If ' $\\theta^{\\prime},{ }^{\\prime} \\omega^{\\prime},{ }^{\\prime} \\propto^{\\prime}$ and 'a' are its\nangular displacement, angular velocity, angular acceleration and centripetal\nacceleration respectively, then which of the following is 'WRONG'?\n(' $\\mathrm{v}$ ' is its linear velocity )", "image": null}, "options": [{"id": "fBbxw", "text": "$\\overrightarrow{\\mathrm{v}} \\perp \\overrightarrow{\\mathrm{a}}$", "image": null, "isCorrect": false}, {"id": "m0ia4", "text": "$\\vec{\\omega} \\perp \\overrightarrow{\\mathrm{V}}$", "image": null, "isCorrect": false}, {"id": "Q1BwB", "text": "$\\vec{\\omega} \\perp \\vec{\\alpha}$", "image": null, "isCorrect": true}, {"id": "kGXuN", "text": "$\\vec{\\omega} \\perp \\overrightarrow{\\mathrm{a}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f310279619d9d8a1a7f", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}], "question": {"text": "Mass of $0.5 \\mathrm{~kg}$ is attached to a string moving in horizontal circle with angular velocity 10 cycle/min. Keeping the radius constant, tension in the string is made 4\ntimes by increasing angular velocity '\\omega'. The value ' $\\omega$ ' of that mass will be", "image": null}, "options": [{"id": "7bnG3", "text": "$\\frac{1}{3}$ cycle $/ \\mathrm{s}$", "image": null, "isCorrect": true}, {"id": "5BCAt", "text": "$\\frac{1}{2}$ cycle $/ \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "AqLSL", "text": "$\\frac{1}{5}$ cycle $/ \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "JBauc", "text": "$\\frac{1}{4}$ cycle $/ \\mathrm{s}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f1b0279619d9d8a19d4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}], "question": {"text": "Two cars of masses ' $\\mathrm{m}_{1}$ ', and ' $\\mathrm{m}_{2}$ ' are moving in the circles of radii ' $\\mathrm{r}_{1}$ ' and ' $\\mathrm{r}_{2}$ '\nrespectively. Their angular speeds ' $\\omega_{1}$ ' and ' $\\omega_{2}$ ' are such that they both complete one revolution in the same time ' $\\mathrm{t}^{\\prime}$. The ratio of linear speed of ' $\\mathrm{m}_{1}$ ' to the linear\nspeed of ' $\\mathrm{m}_{2}$ ' is", "image": null}, "options": [{"id": "DISK2", "text": "$\\mathrm{r}_{1}: \\mathrm{r}_{2}$", "image": null, "isCorrect": true}, {"id": "bOjDr", "text": "$\\mathrm{~T}_{1}^{2}: \\mathrm{T}_{2}^{2}$", "image": null, "isCorrect": false}, {"id": "lhHI8", "text": "$\\omega_{1}^{2}: \\omega_{2}^{2}$", "image": null, "isCorrect": false}, {"id": "1ODYb", "text": "$\\mathrm{~m}_{1}: \\mathrm{m}_{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "They complete one revolution in the same time.\n$$\n\\begin{array}{l}\n\\therefore \\omega_{1}=\\omega_{2} \\\\\n\\therefore \\frac{V_{1}}{r_{1}}=\\frac{V_{2}}{r_{2}} \\\\\n\\therefore \\frac{V_{1}}{V_{2}}=\\frac{r_{1}}{r_{2}}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ee60279619d9d8a1830", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}], "question": {"text": "The real force ‘ <math><mi>F</mi></math> ’ acting on a particle of mass ‘ <math><mi>m</mi></math> ’ performing circular motion acts along the radius of circle ‘ <math><mi>r</mi></math> ’ and is directed towards the centre of circle. The square root of magnitude of such force is <math><mfenced separators=\"|\"><mrow><mi>T</mi><mo>=</mo><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi></mrow></mfenced></math>", "image": null}, "options": [{"id": "6FlI5", "text": "<math><mfr rrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}], "question": {"text": "A particle is performing U.C.M. along the circumference of a circle of diameter 50 cm with frequency 2 Hz. The acceleration of the particle in <math><mrow><mrow><mi>m</mi></mrow><mo>/</mo><mrow><msup><mrow><mi>s</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mrow></math> is", "image": null}, "options": [{"id": "nycyu", "text": "<math><mn>2</mn><msup><mrow><mi>π</mi></mrow><mrow><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "ADKax", "text": "<math><mn>8</mn><msup><mrow><mi>π</mi></mrow><mrow><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "1VNMl", "text": "<math><msup><mrow><mi>π</mi></mrow><mrow><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "H0f0Z", "text": "<math><mn>4</mn><msup><mrow><mi>π</mi></mrow><mrow><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given, diameter of circle, d = 50 cm <br/><math><mo>=</mo><mn>50</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup><mi>m</mi></math>  <br/>And frequency, f = 2 Hz <br/>The acceleration of particle in a uniform circular motion can be given as <br/><math><mi>a</mi><mo>=</mo><msup><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>x</mi></math>  <br/>Where, <math><mi>ω</mi></math> = angular frequency = <math><mn>2</mn><mi>π</mi><mi>f</mi></math>  <br/>X = distance from centre <math><mo>=</mo><mfrac><mrow><mi>d</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math>  <br/><math><mo>⇒</mo><mi>a</mi><mo>=</mo><mn>4</mn><msup><mrow><mi>π</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>f</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>×</mo><mfrac><mrow><mi>d</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math> … (i) <br/>Substituting given values in Eq. (i), we get <br/><math><mi>a</mi><mo>=</mo><mn>4</mn><msup><mrow><mi>π</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>×</mo><mn>4</mn><mo>×</mo><mfrac><mrow><mn>50</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mn>4</mn><msup><mrow><mi>π</mi></mrow><mrow><mn>2</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f070279619d9d8a1933", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}], "question": {"text": "In U.C.M., when time interval <math><mi>δ</mi><mo>→</mo><mn>0</mn></math> , the angle between change in velocity <math><mfenced separators=\"|\"><mrow><mi>δ</mi><mi>v</mi></mrow></mfenced></math> and linear velocity (v) will be", "image": null}, "options": [{"id": "Pn4mN", "text": "<math><msup><mrow><mn>0</mn></mrow><mrow><mi>o</mi></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "g8bNB", "text": "<math><msup><mrow><mn>90</mn></mrow><mrow><mi>o</mi></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "u0Iai", "text": "<math><msup><mrow><mn>180</mn></mrow><mrow><mi>o</mi></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "YqaRW", "text": "<math><msup><mrow><mn>45</mn></mrow><mrow><mi>o</mi></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The direction of change in velocity <math><mfenced separators=\"|\"><mrow><mi>δ</mi><mi>v</mi></mrow></mfenced></math> is given by <br/><math><mi>ϕ</mi><mo>=</mo><mfrac><mrow><msup><mrow><mn>180</mn></mrow><mrow><mi>o</mi></mrow></msup><mo>-</mo><mi>θ</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><msup><mrow><mn>90</mn></mrow><mrow><mi>o</mi></mrow></msup><mo>-</mo><mfrac><mrow><mi>θ</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math> …. (i) <br/>This can be shown graphically as <br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/791615f3-40d6-466e-a82b-60d4301ab70f.png\"> <br/>For small interval i.e. <math><mi>δ</mi><mi>t</mi><mo>→</mo><mn>0</mn></math> , then angle between <math><msub><mrow><mi>v</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msub></math> is very small i.e., <math><mi>θ</mi><mo>≈</mo><msup><mrow><mn>0</mn></mrow><mrow><mi>o</mi></mrow></msup></math> . <br/>So, from Eq. (i) we get <br/><math><mi>ϕ</mi><mo>=</mo><msup><mrow><mn>90</mn></mrow><mrow><mi>o</mi></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ed20279619d9d8a178d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}], "question": {"text": "A mass attached to one end of a string crosses topmost point on a vertical circle with critical speed. Its centripetal acceleration when string becomes horizontal will }}{r} &=E \\\\\n\\frac{1}{2} m r a &=E \\\\\na &=\\frac{2 E}{m r}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e640279619d9d8a140a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "A car is moving with speed $30 \\mathrm{~ms}^{-1}$ on a circular path of radius $500 \\mathrm{~m}$. Its speed is increasing at a rate of $2 \\mathrm{~ms}^{-2}$, what is the acceleration of the car?", "image": null}, "options": [{"id": "nCnTm", "text": "$2 \\mathrm{~ms}^{-2}$", "image": null, "isCorrect": false}, {"id": "KuJGI", "text": "$2.7 \\mathrm{~ms}^{-2}$", "image": null, "isCorrect": true}, {"id": "GLxDz", "text": "$1.82 \\mathrm{~ms}^{-2}$", "image": null, "isCorrect": false}, {"id": "u4UwH", "text": "$9.82 \\mathrm{~ms}^{-2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Net acceleration in non-uniform circular motion,\n$$\n=\\sqrt{(2)^{2}+\\left[\\frac{900}{500}\\right]^{2}}=2.7 \\mathrm{~ms}^{-2}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e620279619d9d8a13ff", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
