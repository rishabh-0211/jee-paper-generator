  <script>
    const data = {"index": 29, "chapterId": "61c089a53d68d0becac0baff", "chapter": "Nuclear Physics", "exam": "MHT CET", "subject": "Physics", "totalTopics": 4, "totalQuestions": 59, "downloadTime": "2026-10-08 20:35:48", "topics": [{"index": 1, "topicId": "65a263290279619d9d8a3c8a", "title": "Nuclear structure", "totalQuestions": 6, "questions": [{"_id": "6a44d2ce8c30a4553e1bdcff", "type": "singleCorrect", "question": {"text": "The ratio of the density of oxygen nucleus $({}^{16}_{8}\\text{O})$ and helium nucleus $({}^{4}_{2}\\text{He})$ is", "image": null}, "options": [{"id": "Nuz8r", "label": "A", "text": "$1 : 1$", "isCorrect": true, "image": null}, {"id": "MzWCA", "label": "B", "text": "$2 : 1$", "isCorrect": false, "image": null}, {"id": "UoseV", "label": "C", "text": "$4 : 1$", "isCorrect": false, "image": null}, {"id": "KW5fZ", "label": "D", "text": "$8 : 1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The radius of a nucleus with mass number $A$ is given by $R = R_0 A^{1/3}$.<br><br>The volume of the nucleus is $V = \\dfrac{4}{3} \\pi R^3 = \\dfrac{4}{3} \\pi R_0^3 A$.<br><br>The mass of the nucleus is $M \\approx A m$, where $m$ is the average mass of a nucleon.<br><br>The density of the nucleus is $\\rho = \\dfrac{M}{V} = \\dfrac{A m}{\\dfrac{4}{3} \\pi R_0^3 A} = \\dfrac{m}{\\dfrac{4}{3} \\pi R_0^3}$.<br><br>Since the density is independent of the mass number $A$, it is constant for all nuclei.<br><br>Therefore, the ratio of the density of the oxygen nucleus to the helium nucleus is $1 : 1$.<br><br>Answer: $1 : 1$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b74bf9280d7f9932961", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A radioactive element A decays into radioactive element C by the following processes in succession.\n$\\mathrm{A} \\rightarrow \\mathrm{~B}+{ }_2 \\mathrm{H}_{\\mathrm{e}}^4 ; \\mathrm{B} \\rightarrow \\mathrm{C}+2 \\mathrm{e}^{-}$\nThen elements", "image": null}, "options": [{"id": "Wnxsx", "text": "$A$ and $B$ are isobars.", "image": null, "isCorrect": false}, {"id": "PEQzJ", "text": "$A$ and $C$ are isobars.", "image": null, "isCorrect": false}, {"id": "3dBoo", "text": "$A$ and $C$ are isotopes.", "image": null, "isCorrect": true}, {"id": "HUpf3", "text": "$A$ and $B$ are isotopes.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the atomic number and mass number of element $\\mathrm{A}$ be $Z$ and $A_m$ respectively. So, $\\mathrm{A}$ can be represented as ${}_{Z}\\mathrm{A}^{A_m}$.<br><br>In the first decay process, $\\mathrm{A}$ emits an alpha particle (${}_{2}\\mathrm{He}^{4}$):<br>${}_{Z}\\mathrm{A}^{A_m} \\rightarrow {}_{Z-2}\\mathrm{B}^{A_m-4} + {}_{2}\\mathrm{He}^{4}$<br>Thus, element $\\mathrm{B}$ has atomic number $Z-2$ and mass number $A_m-4$.<br><br>In the second decay process, $\\mathrm{B}$ emits two beta particles ($2 {}_{-1}\\mathrm{e}^{0}$):<br>${}_{Z-2}\\mathrm{B}^{A_m-4} \\rightarrow {}_{Z}\\mathrm{C}^{A_m-4} + 2 {}_{-1}\\mathrm{e}^{0}$<br>Thus, element $\\mathrm{C}$ has atomic number $Z$ and mass number $A_m-4$.<br><br>Comparing elements $\\mathrm{A}$ and $\\mathrm{C}$, both have the same atomic number $Z$ but different mass numbers ($A_m$ and $A_m-4$). Elements with the same atomic number but different mass numbers are called isotopes.<br><br>Therefore, $\\mathrm{A}$ and $\\mathrm{C}$ are isotopes.<br><br>Answer: $A$ and $C$ are isotopes.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2606e0279619d9d8a246c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "A nucleus breaks into two nuclear parts, which have their velocity ratio $2: 1$. The ratio of their nuclear radii will be", "image": null}, "options": [{"id": "G9Ov3", "text": "$\\sqrt{2}$", "image": null, "isCorrect": false}, {"id": "bg6sc", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "9L32f", "text": "$\\frac{1}{2^{1 / 3}}$", "image": null, "isCorrect": true}, {"id": "dL4Om", "text": "$\\frac{1}{\\sqrt{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "By law of conservation of momentum, the two parts will have equal and opposite momentum, assuming the nucleus was initially at rest.\n$$\n\\begin{aligned}\n& \\therefore \\mathrm{m}_1 \\mathrm{v}_1=\\mathrm{m}_2 \\mathrm{v}_2 \\text { or } \\frac{\\mathrm{m}_1}{\\mathrm{~m}_2}=\\frac{\\mathrm{v}_2}{\\mathrm{v}_1}=\\frac{1}{2} \\\\\n& \\frac{\\mathrm{m}_1}{\\mathrm{~m}_2}=\\left(\\frac{\\mathrm{r}_1}{\\mathrm{r}_2}\\right)^3=\\frac{1}{2} \\\\\n& \\therefore \\frac{\\mathrm{r}_1}{\\mathrm{r}_2}=\\frac{1}{2^{1 / 3}}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e500279619d9d8a1371", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "A particle having almost zero mass and exactly zero charge is", "image": null}, "options": [{"id": "jNhl6", "text": "positron", "image": null, "isCorrect": false}, {"id": "FmZN5", "text": "electron", "image": null, "isCorrect": false}, {"id": "xRaKi", "text": "neutron", "image": null, "isCorrect": false}, {"id": "NWhlR", "text": "neutrino", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "We know that the neutrino is the particle which has almost zero mass and exactly zero charge. Positron has the charge $+e$ and mass $m_{e}$ [equal to electron mass].\nElectron is a particle which has $-e$ charge and $9.1 \\times 10^{-31}$ kg mass.\nNeutron is a particle which has zero charge and $1838 \\mathrm{~m}_{e}$ mass.\nSo, the required answer is neutrino.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e4f0279619d9d8a1369", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "Two nuclei have their mass numbers in the ratio of $1: 3$. The ratio of their nuclear densities would be", "image": null}, "options": [{"id": "1TliO", "text": "$1: 3$", "image": null, "isCorrect": false}, {"id": "RrONT", "text": "$3: 1$", "image": null, "isCorrect": false}, {"id": "WjGcX", "text": "$(3)^{1 / 3}: 1$", "image": null, "isCorrect": false}, {"id": "3puOC", "text": "$1: 1$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Density of nuclear matter is independent of mass number, so the required ratio is $1: 1$. \nAlternative\n$$\nA_{1}: A_{2}=1: 3\n$$\nTheir radii will be in the ratio\n$$\n\\begin{aligned}\nR_{0} A_{1}^{1 / 3}: R_{0} A_{2}^{1 / 3}=1: 3^{1 / 3} \\\\\n\\text { Density }=\\frac{A}{\\frac{4}{3} \\pi R^{3}} \\\\\n\\therefore \\rho_{A_{1}}: \\rho_{A_{2}}=\\frac{1}{\\frac{4}{3} \\pi R_{0}^{3} \\cdot 1^{3}}=\\frac{3}{\\frac{4}{3} \\pi R_{0}^{3}\\left(3^{1 / 3}\\right)^{3}}\n\\end{aligned}\n$$\nTheir nuclear densities will be the same.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e3f0279619d9d8a12e6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "The momentum of a photon of energy $1 \\mathrm{MeV}$ in $\\mathrm{kg}-\\mathrm{m} / \\mathrm{s}$, will be", "image": null}, "options": [{"id": "9wexb", "text": "$0.33 \\times 10^{6}$", "image": null, "isCorrect": false}, {"id": "gXdn6", "text": "$7 \\times 10^{-24}$", "image": null, "isCorrect": false}, {"id": "CuQa7", "text": "$10^{-22}$", "image": null, "isCorrect": false}, {"id": "mI2nZ", "text": "$5 \\times 10^{-22}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Energy of photon is given by\n$$\nE=\\frac{h c}{\\lambda}\n$$\nwhere $h$ is the Planck's constant, $c$ the velocity of light and $\\lambda$ its wavelength. de-Broglie wavelength is given by\n$$\n\\lambda=\\frac{h}{p}\n$$\nwhere $p$ is being momentum of photon. From Eqs. (i) and (ii), we get\n$$\nE=\\frac{h c}{h / p}=p c\n$$\nOr $p=E / c$\n$$\n\\text { Given, } \\begin{aligned}\n&=1 \\mathrm{MeV}=1 \\times 10^{6} \\times 1.6 \\times 10^{-19} \\mathrm{~J}, \\\\\nc &=3 \\times 10^{8} \\mathrm{~m} / \\mathrm{s}\n\\end{aligned}\n$$\nHence, after putting numerical values, we obtain\n$$\n\\begin{aligned}\np &=\\frac{1 \\times 10^{6} \\times 1.6 \\times 10^{-19}}{3 \\times 10^{8}} \\mathrm{~kg}-\\mathrm{m} / \\mathrm{s} \\\\\n&=5 \\times 10^{-22} \\mathrm{~kg}-\\mathrm{m} / \\mathrm{s}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a263290279619d9d8a3c8c", "title": "Nuclear energy", "totalQuestions": 2, "questions": [{"_id": "6792142b0aee93fa0796de88", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "If $\\mathrm{M}_{\\mathrm{O}}$ is the mass of an oxygen isotope ${ }_8 \\mathrm{O}^{17}$ and $M_p$ and $M_N$ are the mass of proton and mass of neutron respectively, then the nucleus binding energy of the isotope is", "image": null}, "options": [{"id": "pqA3k", "text": "$\\quad \\mathrm{M}_{\\mathrm{o}} \\mathrm{C}^2$", "image": null, "isCorrect": false}, {"id": "Nt1IJ", "text": "$\\quad\\left(\\mathrm{M}_{\\mathrm{O}}-8 \\mathrm{M}_{\\mathrm{p}}\\right) \\mathrm{C}^2$", "image": null, "isCorrect": false}, {"id": "vKFXV", "text": "$\\left(\\mathrm{M}_{\\mathrm{O}}-17 \\mathrm{M}_{\\mathrm{N}}\\right) \\mathrm{C}^2$", "image": null, "isCorrect": false}, {"id": "9X9bS", "text": "$\\left(8 \\mathrm{M}_{\\mathrm{p}}+9 \\mathrm{M}_{\\mathrm{N}}-\\mathrm{M}_{\\mathrm{O}}\\right) \\mathrm{C}^2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The nucleus of the oxygen isotope ${}_8\\mathrm{O}^{17}$ contains $8$ protons and $17 - 8 = 9$ neutrons.<br><br>The mass defect $\\Delta M$ is given by the difference between the sum of the masses of the individual nucleons and the actual mass of the nucleus.<br><br>$\\Delta M = Z \\mathrm{M}_p + (A - Z) \\mathrm{M}_N - \\mathrm{M}_O$<br><br>Substituting $Z = 8$ and $A = 17$:<br><br>$\\Delta M = 8 \\mathrm{M}_p + 9 \\mathrm{M}_N - \\mathrm{M}_O$<br><br>The binding energy is given by $\\Delta M \\mathrm{C}^2$:<br><br>Binding Energy $= (8 \\mathrm{M}_p + 9 \\mathrm{M}_N - \\mathrm{M}_O) \\mathrm{C}^2$<br><br>Answer: $\\left(8 \\mathrm{M}_{\\mathrm{p}}+9 \\mathrm{M}_{\\mathrm{N}}-\\mathrm{M}_{\\mathrm{O}}\\right) \\mathrm{C}^2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e4e0279619d9d8a135c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "If $M_{O}$ is the mass of an oxygen isotope ${ }_{8} \\mathrm{O}^{17}$, $M_{p}$ and $M_{n}$ are the masses of a proton and a neutron, respectively, the nuclear binding energy of the isotope is", "image": null}, "options": [{"id": "5Vs4e", "text": "$\\left(M_{O}-8 M_{p}\\right) c^{2}$", "image": null, "isCorrect": false}, {"id": "9MNFi", "text": "$\\left(M_{O}-8 M_{p}-9 M_{n}\\right) c^{2}$", "image": null, "isCorrect": true}, {"id": "YZKI5", "text": "$M_{O} c^{2}$", "image": null, "isCorrect": false}, {"id": "hSrfw", "text": "$\\left(M_{O}-17 M_{n}\\right) c^{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Binding energy\n$$\n\\begin{aligned}\n\\mathrm{BE} &=\\left(M_{\\text {nucleus }}-M_{\\text {nucleons }}\\right) c^{2} \\\\\n&=\\left(M_{O}-8 M_{p}-9 M_{n}\\right) c^{2}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a263290279619d9d8a3c8b", "title": "Radioactivity", "totalQuestions": 48, "questions": [{"_id": "6abb889d15a9fc0fc8c1455e", "type": "singleCorrect", "question": {"text": "In an alpha decay, the daughter nucleus produced is itself unstable and undergoes further decay. If the number of parent and daughter nuclei at time $t$ are $N_p$ and $N_d$ respectively and their decay constants are $\\lambda_p$ and $\\lambda_d$ respectively. What condition needs to be satisfied in order for $N_d$ to remain constant?", "image": null}, "options": [{"id": "6HORI", "label": "A", "text": "$N_p N_d = \\lambda_d \\lambda_p$", "isCorrect": false, "image": null}, {"id": "L4DY5", "label": "B", "text": "$(N_p)/(N_d) = (\\lambda_p)/(\\lambda_d)$", "isCorrect": false, "image": null}, {"id": "oUiCF", "label": "C", "text": "$2N_p \\lambda_d = 3N_d \\lambda_p$", "isCorrect": false, "image": null}, {"id": "JxY0a", "label": "D", "text": "$N_p \\lambda_p = N_d \\lambda_d$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The rate of change of the number of daughter nuclei is given by the difference between its rate of formation and its rate of decay.<br><br>$\\dfrac{dN_d}{dt} = \\lambda_p N_p - \\lambda_d N_d$<br><br>For the number of daughter nuclei $N_d$ to remain constant, its rate of change must be zero.<br><br>$\\dfrac{dN_d}{dt} = 0$<br><br>$\\lambda_p N_p - \\lambda_d N_d = 0$<br><br>$\\lambda_p N_p = \\lambda_d N_d$<br><br>Answer: $N_p \\lambda_p = N_d \\lambda_d$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889d15a9fc0fc8c1455c", "type": "singleCorrect", "question": {"text": "A radioactive nucleus X with a half-life $T$, decays into a nucleus Y. At $t = 0$, there is no nucleus Y. After some time '$t$', the ratio of the number of Y to that of X is $0.4$. Then, '$t$' is", "image": null}, "options": [{"id": "ljW5P", "label": "A", "text": "$T\\log(1.4)$", "isCorrect": false, "image": null}, {"id": "R5pOQ", "label": "B", "text": "$\\dfrac{T\\log(1.4)}{\\log(2)}$", "isCorrect": true, "image": null}, {"id": "od22N", "label": "C", "text": "$\\dfrac{T\\log(2)}{2\\log(1.4)}$", "isCorrect": false, "image": null}, {"id": "Bt2f3", "label": "D", "text": "$\\dfrac{T}{\\log(2)}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the initial number of nuclei of X be $N_0$.<br><br>At time $t$, the number of nuclei of X is $N_X$ and the number of nuclei of Y is $N_Y = N_0 - N_X$.<br><br>Given $\\dfrac{N_Y}{N_X} = 0.4$<br><br>$\\dfrac{N_0 - N_X}{N_X} = 0.4$<br><br>$\\dfrac{N_0}{N_X} - 1 = 0.4$<br><br>$\\dfrac{N_0}{N_X} = 1.4$<br><br>$N_X = \\dfrac{N_0}{1.4}$<br><br>Using the radioactive decay law, $N_X = N_0 \\left(\\dfrac{1}{2}\\right)^{\\dfrac{t}{T}}$<br><br>$\\dfrac{N_0}{1.4} = N_0 \\left(\\dfrac{1}{2}\\right)^{\\dfrac{t}{T}}$<br><br>$1.4 = 2^{\\dfrac{t}{T}}$<br><br>Taking logarithm on both sides:<br><br>$\\log(1.4) = \\dfrac{t}{T} \\log(2)$<br><br>$t = \\dfrac{T \\log(1.4)}{\\log(2)}$<br><br>Answer: $\\dfrac{T\\log(1.4)}{\\log(2)}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883f15a9fc0fc8c141e8", "type": "singleCorrect", "question": {"text": "Initially $8 \\times 10^{10}$ atoms are present in a radioactive sample. The half-life of the sample is 1 hour. The number of atoms that will decay in the time interval $t = 2$ hour to $t = 5$ hour, is", "image": null}, "options": [{"id": "KpMwU", "label": "A", "text": "$0.25 \\times 10^{10}$", "isCorrect": false, "image": null}, {"id": "WO67P", "label": "B", "text": "$1.5 \\times 10^{10}$", "isCorrect": false, "image": null}, {"id": "hw5Ee", "label": "C", "text": "$1.75 \\times 10^{10}$", "isCorrect": true, "image": null}, {"id": "Slhqq", "label": "D", "text": "$2 \\times 10^{10}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Initial number of atoms, $N_0 = 8 \\times 10^{10}$<br><br>Half-life, $T_{1/2} = 1$ hour<br><br>Number of atoms remaining at $t = 2$ hours ($n = 2$ half-lives):<br><br>$N_1 = N_0 \\left(\\dfrac{1}{2}\\right)^2 = \\dfrac{8 \\times 10^{10}}{4} = 2 \\times 10^{10}$<br><br>Number of atoms remaining at $t = 5$ hours ($n = 5$ half-lives):<br><br>$N_2 = N_0 \\left(\\dfrac{1}{2}\\right)^5 = \\dfrac{8 \\times 10^{10}}{32} = 0.25 \\times 10^{10}$<br><br>Number of atoms decayed in the time interval $t = 2$ hour to $t = 5$ hour:<br><br>$\\Delta N = N_1 - N_2 = 2 \\times 10^{10} - 0.25 \\times 10^{10} = 1.75 \\times 10^{10}$<br><br>Answer: $1.75 \\times 10^{10}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884d15a9fc0fc8c14265", "type": "singleCorrect", "question": {"text": "A radioactive nucleus ${}_{Z}^{A}X$ undergoes spontaneous decay in the sequence ${}_{Z}^{A}X \\rightarrow {}_{Z-1}^{\\Box}B \\rightarrow {}_{Z-3}^{\\Box}C \\rightarrow {}_{Z-2}^{\\Box}D$ where $Z$ is the atomic number of element. The possible decay particles in the sequence are", "image": null}, "options": [{"id": "Ee7JI", "label": "A", "text": "$\\alpha,\\,\\beta^+,\\,\\beta$", "isCorrect": false, "image": null}, {"id": "VBzgk", "label": "B", "text": "$\\beta^+,\\,\\alpha,\\,\\beta$", "isCorrect": true, "image": null}, {"id": "oKyxr", "label": "C", "text": "$\\beta,\\,\\alpha,\\,\\beta^+$", "isCorrect": false, "image": null}, {"id": "KTmOA", "label": "D", "text": "$\\alpha,\\,\\beta,\\,\\beta^+$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In the first step, the atomic number changes from $Z$ to $Z-1$. A decrease of $1$ in the atomic number indicates $\\beta^+$ decay (positron emission).<br><br>In the second step, the atomic number changes from $Z-1$ to $Z-3$. A decrease of $2$ in the atomic number indicates $\\alpha$ decay (emission of a helium nucleus).<br><br>In the third step, the atomic number changes from $Z-3$ to $Z-2$. An increase of $1$ in the atomic number indicates $\\beta^-$ decay (electron emission).<br><br>Thus, the sequence of emitted particles is $\\beta^+$, $\\alpha$, $\\beta^-$.<br><br>Answer: $\\beta^+,\\,\\alpha,\\,\\beta$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88ad15a9fc0fc8c145f2", "type": "singleCorrect", "question": {"text": "A radioactive sample $S_1$ having activity $A_1$ has twice the number of nuclei as another sample of $S_2$ of activity $A_2$. If $A_2 = 2A_1$ then the ratio of half life of $S_1$ to the half life of $S_2$ is", "image": null}, "options": [{"id": "5DVB1", "label": "A", "text": "$4$", "isCorrect": true, "image": null}, {"id": "arWQd", "label": "B", "text": "$2$", "isCorrect": false, "image": null}, {"id": "OP4sC", "label": "C", "text": "$0.25$", "isCorrect": false, "image": null}, {"id": "Q4vno", "label": "D", "text": "$0.75$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Activity is given by $A = \\lambda N$<br><br>For sample $S_1$, $A_1 = \\lambda_1 N_1$<br><br>For sample $S_2$, $A_2 = \\lambda_2 N_2$<br><br>Given that $N_1 = 2N_2$ and $A_2 = 2A_1$<br><br>Substituting the values in the activity relation:<br><br>$\\lambda_2 N_2 = 2(\\lambda_1 N_1)$<br><br>$\\lambda_2 N_2 = 2\\lambda_1 (2N_2)$<br><br>$\\lambda_2 = 4\\lambda_1$<br><br>The half-life is inversely proportional to the decay constant, $T_{1/2} = \\dfrac{\\ln 2}{\\lambda}$<br><br>The ratio of half-life of $S_1$ to $S_2$ is:<br><br>$\\dfrac{(T_{1/2})_1}{(T_{1/2})_2} = \\dfrac{\\lambda_2}{\\lambda_1} = 4$<br><br>Answer: $4$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887c15a9fc0fc8c1442b", "type": "singleCorrect", "question": {"text": "Activity of a radioactive sample decreases to $\\left(\\dfrac{1}{3}\\right)^{rd}$ of its original value in $3$ days. Then in $9$ days its activity will become", "image": null}, "options": [{"id": "inlXk", "label": "A", "text": "$\\left(\\dfrac{1}{27}\\right)$ of the original value", "isCorrect": true, "image": null}, {"id": "Y1DW7", "label": "B", "text": "$\\left(\\dfrac{1}{9}\\right)$ of the original value", "isCorrect": false, "image": null}, {"id": "KIBOE", "label": "C", "text": "$\\left(\\dfrac{1}{18}\\right)$ of the original value", "isCorrect": false, "image": null}, {"id": "0Lmnv", "label": "D", "text": "$\\left(\\dfrac{1}{3}\\right)$ of the original value", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The activity of a radioactive sample at time $t$ is given by the radioactive decay law:<br><br>$A = A_0 e^{-\\lambda t}$<br><br>Given that the activity decreases to $\\dfrac{1}{3}$ of its original value in $3$ days, we have:<br><br>$\\dfrac{A_0}{3} = A_0 e^{-3\\lambda}$<br><br>$e^{-3\\lambda} = \\dfrac{1}{3}$<br><br>We need to find the activity after $9$ days. Substituting $t = 9$ into the decay equation:<br><br>$A' = A_0 e^{-9\\lambda}$<br><br>$A' = A_0 (e^{-3\\lambda})^3$<br><br>Substituting the value of $e^{-3\\lambda}$:<br><br>$A' = A_0 \\left(\\dfrac{1}{3}\\right)^3$<br><br>$A' = \\dfrac{A_0}{27}$<br><br>Thus, the activity will become $\\left(\\dfrac{1}{27}\\right)$ of the original value.<br><br>Answer: $\\left(\\dfrac{1}{27}\\right)$ of the original value", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888f15a9fc0fc8c144d5", "type": "singleCorrect", "question": {"text": "Two radioactive substances $A$ and $B$ have decay constant $5\\lambda$ and $\\lambda$ respectively. At $t = 0$, they have the same number of nuclei. The ratio of number of nuclei of $A$ to those of $B$ will be $\\left(\\dfrac{1}{e}\\right)^2$ after a time interval", "image": null}, "options": [{"id": "YvqTG", "label": "A", "text": "$\\dfrac{1}{4\\lambda}$", "isCorrect": false, "image": null}, {"id": "6ntMU", "label": "B", "text": "$4\\lambda$", "isCorrect": false, "image": null}, {"id": "0Ieqj", "label": "C", "text": "$2\\lambda$", "isCorrect": false, "image": null}, {"id": "tmi5Y", "label": "D", "text": "$\\dfrac{1}{2\\lambda}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The number of nuclei of radioactive substances $A$ and $B$ at time $t$ are given by:<br><br>$N_A = N_0 e^{-5\\lambda t}$<br><br>$N_B = N_0 e^{-\\lambda t}$<br><br>The ratio of the number of nuclei of $A$ to those of $B$ is:<br><br>$\\dfrac{N_A}{N_B} = \\dfrac{e^{-5\\lambda t}}{e^{-\\lambda t}} = e^{-4\\lambda t}$<br><br>Given that this ratio is $\\left(\\dfrac{1}{e}\\right)^2 = e^{-2}$, we have:<br><br>$e^{-4\\lambda t} = e^{-2}$<br><br>Equating the exponents:<br><br>$4\\lambda t = 2$<br><br>$t = \\dfrac{1}{2\\lambda}$<br><br>Answer: $\\dfrac{1}{2\\lambda}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb882f15a9fc0fc8c14150", "type": "singleCorrect", "question": {"text": "In transition 'a', three $\\alpha$ particles and two $\\beta$ particles are emitted in succession from the element ${}_{86}X^{226}$. In transition 'b', two gamma rays, one $\\beta$ particle and two $\\alpha$ particles are emitted in succession from element ${}_{96}Y^{236}$. The atomic number and the mass number of the new elements formed respectively are", "image": null}, "options": [{"id": "IOGny", "label": "A", "text": "a) for first transition:- atomic number $=83$, mass number $=216$ b) for the second transition:- atomic number $=82$, mass number $=214$", "isCorrect": false, "image": null}, {"id": "k4WAF", "label": "B", "text": "a) for first transition:- atomic number $=80$, mass number $=225$ b) for the second transition:- atomic number $=90$, mass number $=220$", "isCorrect": false, "image": null}, {"id": "0okpP", "label": "C", "text": "a) for first transition:- atomic number $=82$, mass number $=214$ b) for the second transition:- atomic number $=93$, mass number $=228$", "isCorrect": true, "image": null}, {"id": "AbSEb", "label": "D", "text": "a) for first transition:- atomic number $=80$, mass number $=214$ b) for the second transition:- atomic number $=90$, mass number $=226$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For transition 'a':<br>Initial element is ${}_{86}X^{226}$.<br>Emission of one $\\alpha$ particle (${}_{2}He^{4}$) decreases the atomic number by $2$ and the mass number by $4$.<br>Emission of one $\\beta$ particle (${}_{-1}e^{0}$) increases the atomic number by $1$ and leaves the mass number unchanged.<br>Change in atomic number $Z = -3(2) + 2(1) = -4$<br>Change in mass number $A = -3(4) + 2(0) = -12$<br>New atomic number $Z = 86 - 4 = 82$<br>New mass number $A = 226 - 12 = 214$<br><br>For transition 'b':<br>Initial element is ${}_{96}Y^{236}$.<br>Emission of $\\gamma$ rays does not change the atomic number or the mass number.<br>Change in atomic number $Z = -2(2) + 1(1) = -3$<br>Change in mass number $A = -2(4) + 1(0) = -8$<br>New atomic number $Z = 96 - 3 = 93$<br>New mass number $A = 236 - 8 = 228$<br><br>Answer: a) for first transition:- atomic number $=82$, mass number $=214$ b) for the second transition:- atomic number $=93$, mass number $=228$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a78c30a4553e1bdb60", "type": "singleCorrect", "question": {"text": "Activity of a radioactive sample decreases to $\\left(\\dfrac{1}{4}\\right)^{th}$ of its original value in 4 days. Then in 16 days its activity will become $x$ times the original value. The value of $x$ is", "image": null}, "options": [{"id": "YriJI", "label": "A", "text": "$\\dfrac{1}{16}$", "isCorrect": false, "image": null}, {"id": "sGQsB", "label": "B", "text": "$\\dfrac{1}{32}$", "isCorrect": false, "image": null}, {"id": "sBaJy", "label": "C", "text": "$\\dfrac{1}{256}$", "isCorrect": true, "image": null}, {"id": "nrKAb", "label": "D", "text": "$\\dfrac{1}{128}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the initial activity be $A_0$ and the half-life be $T_{1/2}$.<br><br>The activity after time $t$ is given by $A = A_0 \\left(\\dfrac{1}{2}\\right)^{\\dfrac{t}{T_{1/2}}}$.<br><br>Given that $A = \\dfrac{A_0}{4}$ at $t = 4$ days:<br><br>$\\dfrac{A_0}{4} = A_0 \\left(\\dfrac{1}{2}\\right)^{\\dfrac{4}{T_{1/2}}}$<br><br>$\\left(\\dfrac{1}{2}\\right)^2 = \\left(\\dfrac{1}{2}\\right)^{\\dfrac{4}{T_{1/2}}}$<br><br>$\\dfrac{4}{T_{1/2}} = 2 \\Rightarrow T_{1/2} = 2$ days.<br><br>After $t = 16$ days, the activity $A'$ is:<br><br>$A' = A_0 \\left(\\dfrac{1}{2}\\right)^{\\dfrac{16}{2}} = A_0 \\left(\\dfrac{1}{2}\\right)^8 = \\dfrac{A_0}{256}$<br><br>Thus, the activity becomes $\\dfrac{1}{256}$ times the original value, so $x = \\dfrac{1}{256}$.<br><br>Answer: $\\dfrac{1}{256}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3098c30a4553e1bdf7d", "type": "singleCorrect", "question": {"text": "A radioactive element has rate of disintegration $16{,}000$ disintegrations per minute at a particular instant. After four minutes, it becomes $2000$ disintegrations per minute. The decay constant per minute is", "image": null}, "options": [{"id": "3lrjb", "label": "A", "text": "$0.25\\log_e 2$", "isCorrect": false, "image": null}, {"id": "KfZ2s", "label": "B", "text": "$0.50\\log_e 3$", "isCorrect": false, "image": null}, {"id": "KATqo", "label": "C", "text": "$0.75\\log_e 2$", "isCorrect": true, "image": null}, {"id": "vzIJB", "label": "D", "text": "$0.8\\log_e 3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The rate of disintegration (activity) of a radioactive element follows the exponential decay law:<br><br>$A = A_0 e^{-\\lambda t}$<br><br>Given initial activity $A_0 = 16000$ disintegrations per minute, final activity $A = 2000$ disintegrations per minute, and time $t = 4$ minutes.<br><br>Substituting these values into the equation:<br><br>$2000 = 16000 e^{-\\lambda (4)}$<br><br>$\\dfrac{2000}{16000} = e^{-4\\lambda}$<br><br>$\\dfrac{1}{8} = e^{-4\\lambda}$<br><br>Taking the natural logarithm on both sides:<br><br>$\\log_e\\left(\\dfrac{1}{8}\\right) = -4\\lambda$<br><br>$\\log_e(2^{-3}) = -4\\lambda$<br><br>$-3 \\log_e 2 = -4\\lambda$<br><br>$\\lambda = \\dfrac{3}{4} \\log_e 2$<br><br>$\\lambda = 0.75 \\log_e 2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2fa8c30a4553e1bdede", "type": "singleCorrect", "question": {"text": "A radioactive sample has half-life of $5$ years. The percentage of fraction decayed in $10$ years will be", "image": null}, "options": [{"id": "9O2TW", "label": "A", "text": "$25\\%$", "isCorrect": false, "image": null}, {"id": "1R6B8", "label": "B", "text": "$50\\%$", "isCorrect": false, "image": null}, {"id": "JazvN", "label": "C", "text": "$75\\%$", "isCorrect": true, "image": null}, {"id": "B8IhR", "label": "D", "text": "$90\\%$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given half-life $T_{1/2} = 5$ years and time $t = 10$ years.<br><br>Number of half-lives $n = \\dfrac{t}{T_{1/2}} = \\dfrac{10}{5} = 2$<br><br>Fraction of sample remaining after $n$ half-lives is given by $\\dfrac{N}{N_0} = \\left(\\dfrac{1}{2}\\right)^n$<br><br>$\\dfrac{N}{N_0} = \\left(\\dfrac{1}{2}\\right)^2 = \\dfrac{1}{4}$<br><br>Fraction of sample decayed $= 1 - \\dfrac{N}{N_0} = 1 - \\dfrac{1}{4} = \\dfrac{3}{4}$<br><br>Percentage of fraction decayed $= \\dfrac{3}{4} \\times 100\\% = 75\\%$<br><br>Answer: $75\\%$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ed8c30a4553e1bde51", "type": "singleCorrect", "question": {"text": "Two samples A and B contain equal amount of radioactive substances. If $\\left(\\dfrac{1}{8}\\right)^{th}$ of sample A and $\\left(\\dfrac{1}{128}\\right)^{th}$ of sample B, remain after 9 hours, then the ratio of half life period of B to that of A is", "image": null}, "options": [{"id": "SJMmT", "label": "A", "text": "$9:7$", "isCorrect": false, "image": null}, {"id": "a0ZzG", "label": "B", "text": "$7:3$", "isCorrect": false, "image": null}, {"id": "PFOVi", "label": "C", "text": "$3:7$", "isCorrect": true, "image": null}, {"id": "vzCax", "label": "D", "text": "$3:1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the initial amount of both samples be $N_0$.<br><br>The amount of radioactive substance remaining after time $t$ is given by $N = N_0 \\left(\\dfrac{1}{2}\\right)^{\\dfrac{t}{T_{1/2}}}$.<br><br>For sample A, after $t = 9$ hours:<br><br>$\\dfrac{N_0}{8} = N_0 \\left(\\dfrac{1}{2}\\right)^{\\dfrac{9}{T_A}}$<br><br>$\\left(\\dfrac{1}{2}\\right)^3 = \\left(\\dfrac{1}{2}\\right)^{\\dfrac{9}{T_A}}$<br><br>$\\dfrac{9}{T_A} = 3 \\Rightarrow T_A = 3$ hours.<br><br>For sample B, after $t = 9$ hours:<br><br>$\\dfrac{N_0}{128} = N_0 \\left(\\dfrac{1}{2}\\right)^{\\dfrac{9}{T_B}}$<br><br>$\\left(\\dfrac{1}{2}\\right)^7 = \\left(\\dfrac{1}{2}\\right)^{\\dfrac{9}{T_B}}$<br><br>$\\dfrac{9}{T_B} = 7 \\Rightarrow T_B = \\dfrac{9}{7}$ hours.<br><br>The ratio of the half-life period of B to that of A is:<br><br>$\\dfrac{T_B}{T_A} = \\dfrac{\\dfrac{9}{7}}{3} = \\dfrac{3}{7}$<br><br>Answer: $3:7$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3428c30a4553e1be1d5", "type": "singleCorrect", "question": {"text": "The activity of a radioactive sample is measured as $N_0$ counts per minute at time $t = 0$ and $\\dfrac{N_0}{e}$ counts per minute at time $t = 3$ minute. The time (in minute) in which the activity reduces to half the value, is", "image": null}, "options": [{"id": "wMBj0", "label": "A", "text": "$\\dfrac{1}{3}\\log_e 2$", "isCorrect": false, "image": null}, {"id": "YJRvv", "label": "B", "text": "$3\\log_e 2$", "isCorrect": true, "image": null}, {"id": "IkdiO", "label": "C", "text": "$3\\log_{10} 2$", "isCorrect": false, "image": null}, {"id": "1WXvW", "label": "D", "text": "$\\dfrac{3}{\\log_e 2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The activity of a radioactive sample at time $t$ is given by $A = A_0 e^{-\\lambda t}$.<br><br>Given that at $t = 0$, $A = N_0$.<br><br>At $t = 3$ minutes, $A = \\dfrac{N_0}{e}$.<br><br>Substituting these values into the decay equation:<br><br>$\\dfrac{N_0}{e} = N_0 e^{-3\\lambda}$<br><br>$e^{-1} = e^{-3\\lambda}$<br><br>Comparing the powers of $e$, we get:<br><br>$3\\lambda = 1 \\Rightarrow \\lambda = \\dfrac{1}{3} \\text{ min}^{-1}$<br><br>The time in which the activity reduces to half its initial value is the half-life $T_{1/2}$, which is given by:<br><br>$T_{1/2} = \\dfrac{\\log_e 2}{\\lambda}$<br><br>Substituting the value of $\\lambda$:<br><br>$T_{1/2} = \\dfrac{\\log_e 2}{\\dfrac{1}{3}} = 3 \\log_e 2 \\text{ min}$<br><br>Answer: $3\\log_e 2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c48c30a4553e1bdc8f", "type": "singleCorrect", "question": {"text": "The half-life of the isotope ${}_{11}\\text{Na}^{24}$ is 15 hr. How much time does it take for $\\left(\\dfrac{7}{8}\\right)^{\\text{th}}$ of a sample of this isotope to decay ?", "image": null}, "options": [{"id": "5bQOL", "label": "A", "text": "$45$ hour", "isCorrect": true, "image": null}, {"id": "GT34Z", "label": "B", "text": "$60$ hour", "isCorrect": false, "image": null}, {"id": "Egk0D", "label": "C", "text": "$75$ hour", "isCorrect": false, "image": null}, {"id": "DzKwR", "label": "D", "text": "$90$ hour", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Fraction of the sample decayed is $\\dfrac{7}{8}$.<br><br>Fraction of the sample remaining is $1 - \\dfrac{7}{8} = \\dfrac{1}{8}$.<br><br>The amount of substance remaining after time $t$ is given by $N = N_0 \\left(\\dfrac{1}{2}\\right)^{\\dfrac{t}{T_{1/2}}}$.<br><br>Substituting the values, we get $\\dfrac{1}{8} = \\left(\\dfrac{1}{2}\\right)^{\\dfrac{t}{15}}$.<br><br>$\\left(\\dfrac{1}{2}\\right)^3 = \\left(\\dfrac{1}{2}\\right)^{\\dfrac{t}{15}}$<br><br>$\\dfrac{t}{15} = 3$<br><br>$t = 45$ hr.<br><br>Answer: $45$ hour", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3168c30a4553e1be001", "type": "singleCorrect", "question": {"text": "Two different radioactive elements with half lives $T_1$ and $T_2$ have undecayed atoms $N_1$ and $N_2$ respectively, present at a given instant. The ratio of their activities at this instant is", "image": null}, "options": [{"id": "bImFU", "label": "A", "text": "$\\dfrac{N_1 T_1}{N_2 T_2}$", "isCorrect": false, "image": null}, {"id": "lyuvg", "label": "B", "text": "$\\dfrac{N_1 T_2}{N_2 T_1}$", "isCorrect": true, "image": null}, {"id": "PX9gf", "label": "C", "text": "$\\dfrac{N_1 T_2}{T_1 T_2}$", "isCorrect": false, "image": null}, {"id": "1n3cm", "label": "D", "text": "$\\dfrac{T_1 T_2}{N_1 N_2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Activity of a radioactive element is given by $A = \\lambda N$<br><br>The decay constant $\\lambda$ is related to half-life $T$ as $\\lambda = \\dfrac{\\ln 2}{T}$<br><br>For the first element, activity $A_1 = \\dfrac{\\ln 2}{T_1} N_1$<br><br>For the second element, activity $A_2 = \\dfrac{\\ln 2}{T_2} N_2$<br><br>The ratio of their activities is $\\dfrac{A_1}{A_2} = \\dfrac{\\dfrac{\\ln 2}{T_1} N_1}{\\dfrac{\\ln 2}{T_2} N_2} = \\dfrac{N_1 T_2}{N_2 T_1}$<br><br>Answer: $\\dfrac{N_1 T_2}{N_2 T_1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf8bf9280d7f9932e1b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A radioactive element having half-life 30 min . is undergoing beta decay. The fraction of radioactive element remains undecayed after 90 min . will be", "image": null}, "options": [{"id": "CBDtu", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "mPyNa", "text": "$\\frac{1}{4}$", "image": null, "isCorrect": false}, {"id": "z8WM9", "text": "$\\frac{1}{8}$", "image": null, "isCorrect": true}, {"id": "8odmH", "text": "$\\frac{1}{16}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given half-life $T_{1/2} = 30$ min and total time $t = 90$ min.<br><br>Number of half-lives $n = \\dfrac{t}{T_{1/2}} = \\dfrac{90}{30} = 3$.<br><br>The fraction of radioactive element remaining undecayed is given by $\\dfrac{N}{N_0} = \\left(\\dfrac{1}{2}\\right)^n$.<br><br>Substituting $n = 3$, we get $\\dfrac{N}{N_0} = \\left(\\dfrac{1}{2}\\right)^3 = \\dfrac{1}{8}$.<br><br>Answer: $\\frac{1}{8}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be9bf9280d7f9932d88", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Two radioactive materials ' $M_1{ }^{\\prime}$ and ' $M_2{ }^{\\prime}$ have decay constants ' $9 \\lambda$ ' and ' $\\lambda$ ' respectively. Initially they have the same number of nuclei. The ratio of the number of nuclei of $M_1$ to that of $M_2$ will be ' $\\left(\\frac{1}{e}\\right)^{\\prime}$ after a time interval", "image": null}, "options": [{"id": "MAgFm", "text": "$\\frac{1}{8 \\lambda}$", "image": null, "isCorrect": true}, {"id": "Cu3MZ", "text": "$\\frac{9}{10 \\lambda}$", "image": null, "isCorrect": false}, {"id": "ltk5l", "text": "$\\frac{1}{10 \\lambda}$", "image": null, "isCorrect": false}, {"id": "tc4Ui", "text": "$\\frac{1}{9 \\lambda}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The number of nuclei of a radioactive material at time $t$ is given by $N = N_0 e^{-\\lambda t}$.<br><br>For material $M_1$, the number of nuclei at time $t$ is $N_1 = N_0 e^{-9\\lambda t}$.<br><br>For material $M_2$, the number of nuclei at time $t$ is $N_2 = N_0 e^{-\\lambda t}$.<br><br>The ratio of the number of nuclei of $M_1$ to that of $M_2$ is given as $\\dfrac{1}{e}$.<br><br>$\\dfrac{N_1}{N_2} = \\dfrac{N_0 e^{-9\\lambda t}}{N_0 e^{-\\lambda t}} = \\dfrac{1}{e}$<br><br>$e^{-8\\lambda t} = e^{-1}$<br><br>Equating the powers of $e$, we get:<br><br>$8\\lambda t = 1$<br><br>$t = \\dfrac{1}{8\\lambda}$<br><br>Answer: $\\frac{1}{8 \\lambda}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bdabf9280d7f9932d07", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A radio active element has rate of disintegration 8000 disintegrations per minute at a particular instant. After four minutes it becomes 2000 disintegrations per minute. The decay constant per minute is", "image": null}, "options": [{"id": "B11t6", "text": "$0.8 \\log _e 2$", "image": null, "isCorrect": false}, {"id": "6HIq8", "text": "$0.6 \\log _e 2$", "image": null, "isCorrect": false}, {"id": "GWjDB", "text": "$0.5 \\log _e 2$", "image": null, "isCorrect": true}, {"id": "cYsUo", "text": "$0.2 \\log _e 2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The rate of disintegration is given by the radioactive decay law:<br><br>$R = R_0 e^{-\\lambda t}$<br><br>Given $R_0 = 8000$ disintegrations per minute, $R = 2000$ disintegrations per minute, and $t = 4$ minutes.<br><br>Substituting the values:<br><br>$2000 = 8000 e^{-4\\lambda}$<br><br>$e^{-4\\lambda} = \\dfrac{2000}{8000} = \\dfrac{1}{4}$<br><br>Taking the natural logarithm on both sides:<br><br>$-4\\lambda = \\log_e \\left(\\dfrac{1}{4}\\right)$<br><br>$4\\lambda = \\log_e 4$<br><br>$4\\lambda = 2 \\log_e 2$<br><br>$\\lambda = \\dfrac{2}{4} \\log_e 2 = 0.5 \\log_e 2$<br><br>Answer: $0.5 \\log _e 2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba7bf9280d7f9932b43", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A radioactive element has rate of disintegration 9000 disintegration per minute at a particular instant. After two minutes it becomes 3000 disintegration per minute. The decay constant per minute is", "image": null}, "options": [{"id": "FzmAk", "text": "$0.5 \\log _e {}^3$", "image": null, "isCorrect": true}, {"id": "el6Hi", "text": "$0.2 \\log _e {}^3$", "image": null, "isCorrect": false}, {"id": "kW1sq", "text": "$0.5 \\log _e {}^2$", "image": null, "isCorrect": false}, {"id": "GqKcY", "text": "$0.2 \\log _e {}^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The rate of disintegration is given by $R = R_0 e^{-\\lambda t}$.<br><br>Given $R_0 = 9000$ disintegrations per minute, $R = 3000$ disintegrations per minute, and $t = 2$ minutes.<br><br>Substituting the values:<br><br>$3000 = 9000 e^{-2\\lambda}$<br><br>$e^{-2\\lambda} = \\dfrac{3000}{9000} = \\dfrac{1}{3}$<br><br>$e^{2\\lambda} = 3$<br><br>Taking natural logarithm on both sides:<br><br>$2\\lambda = \\log_e 3$<br><br>$\\lambda = 0.5 \\log_e 3$<br><br>Answer: $0.5 \\log _e {}^3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b98bf9280d7f9932ab3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A radioactive element ${ }_{92}^{242} \\mathrm{X}$ emits two $\\alpha$ particles, one electron and two positrons. The product nucleus is represented by ${ }_{\\mathrm{P}}^{234} \\mathrm{Y}$. The value of P is", "image": null}, "options": [{"id": "Awk6W", "text": "87", "image": null, "isCorrect": true}, {"id": "Foxtj", "text": "85", "image": null, "isCorrect": false}, {"id": "mAkqc", "text": "92", "image": null, "isCorrect": false}, {"id": "M95GU", "text": "96", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The initial nucleus is ${}_{92}^{242}\\mathrm{X}$.<br><br>The nuclear reaction involving the emission of two $\\alpha$ particles (${}_{2}^{4}\\mathrm{He}$), one electron (${}_{-1}^{0}\\mathrm{e}$), and two positrons (${}_{+1}^{0}\\mathrm{e}$) can be written as:<br><br>${}_{92}^{242}\\mathrm{X} \\rightarrow {}_{\\mathrm{P}}^{234}\\mathrm{Y} + 2 {}_{2}^{4}\\mathrm{He} + 1 {}_{-1}^{0}\\mathrm{e} + 2 {}_{+1}^{0}\\mathrm{e}$<br><br>Conserving the atomic number (charge) on both sides of the reaction:<br><br>$92 = \\mathrm{P} + 2(2) + 1(-1) + 2(+1)$<br><br>$92 = \\mathrm{P} + 4 - 1 + 2$<br><br>$92 = \\mathrm{P} + 5$<br><br>$\\mathrm{P} = 92 - 5 = 87$<br><br>Answer: 87", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b84bf9280d7f99329f7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The activity of radioactive sample is measured as $\\mathrm{N}_0$ counts per minute at time $\\mathrm{t}=\\mathrm{o}$, and $\\frac{\\mathrm{N}_0}{\\mathrm{e}}$ counts per minute at time $\\mathrm{t}=3$ minute, The activity reduces to half its value in time (in minute)", "image": null}, "options": [{"id": "zPglM", "text": "$\\frac{1}{3} \\log _e 2$", "image": null, "isCorrect": false}, {"id": "VH9Qg", "text": "$3 \\log _e 2$", "image": null, "isCorrect": true}, {"id": "5MADN", "text": "$3 \\log _{10} 2$", "image": null, "isCorrect": false}, {"id": "iI8C5", "text": "$\\frac{3}{\\log _{10} 2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The activity of a radioactive sample at time $t$ is given by $A = A_0 e^{-\\lambda t}$.<br><br>Given that at $t = 0$, $A_0 = N_0$.<br><br>At $t = 3$ minutes, $A = \\dfrac{N_0}{e}$.<br><br>Substituting these values into the activity equation:<br><br>$\\dfrac{N_0}{e} = N_0 e^{-3\\lambda}$<br><br>$e^{-1} = e^{-3\\lambda}$<br><br>Equating the powers of $e$, we get:<br><br>$3\\lambda = 1 \\Rightarrow \\lambda = \\dfrac{1}{3} \\text{ minute}^{-1}$<br><br>The time in which the activity reduces to half its value is the half-life $T_{1/2}$, which is given by:<br><br>$T_{1/2} = \\dfrac{\\log_e 2}{\\lambda}$<br><br>Substituting the value of $\\lambda$:<br><br>$T_{1/2} = \\dfrac{\\log_e 2}{\\dfrac{1}{3}} = 3 \\log_e 2 \\text{ minutes}$<br><br>Answer: $3 \\log _e 2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b64bf9280d7f99328c3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "${ }_{88} \\mathrm{R}_{\\mathrm{a}}^{226}$ is converted into ${ }_{82} \\mathrm{P}_{\\mathrm{b}}^{206}$ by emission of alpha $(\\alpha)$ and beta $(\\beta)$ particles. The number of alpha and beta particles emitted are respectively", "image": null}, "options": [{"id": "ytGtg", "text": "5,4", "image": null, "isCorrect": true}, {"id": "FQ915", "text": "4,5", "image": null, "isCorrect": false}, {"id": "o9l3a", "text": "6,4", "image": null, "isCorrect": false}, {"id": "Z0GPp", "text": "4,6", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the number of $\\alpha$ particles emitted be $x$ and the number of $\\beta$ particles emitted be $y$.<br><br>The nuclear reaction is given by:<br><br>${}_{88}\\mathrm{Ra}^{226} \\rightarrow {}_{82}\\mathrm{Pb}^{206} + x({}_{2}\\mathrm{He}^{4}) + y({}_{-1}\\mathrm{e}^{0})$<br><br>Equating the mass numbers on both sides:<br><br>$226 = 206 + 4x$<br><br>$4x = 20 \\Rightarrow x = 5$<br><br>Equating the atomic numbers on both sides:<br><br>$88 = 82 + 2x - y$<br><br>Substituting $x = 5$:<br><br>$88 = 82 + 10 - y$<br><br>$y = 92 - 88 = 4$<br><br>The number of $\\alpha$ and $\\beta$ particles emitted are $5$ and $4$ respectively.<br><br>Answer: 5,4", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b45bf9280d7f99327b5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Two radioactive materials A and B having decay constant '7 $\\lambda$ ' and ' $\\lambda$ ' respectively, initially have same number of nuclei. The time taken to have the ratio of number of nuclei of material B to that of A as ' e ' is", "image": null}, "options": [{"id": "U5fna", "text": "$\\frac{1}{\\lambda}$", "image": null, "isCorrect": false}, {"id": "WcBnt", "text": "$\\frac{1}{6 \\lambda}$", "image": null, "isCorrect": true}, {"id": "NoYGU", "text": "$\\frac{1}{7 \\lambda}$", "image": null, "isCorrect": false}, {"id": "175io", "text": "$\\frac{1}{8 \\lambda}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the initial number of nuclei of both materials be $N_0$.<br><br>The number of nuclei of material A at time $t$ is given by $N_A = N_0 e^{-7\\lambda t}$.<br><br>The number of nuclei of material B at time $t$ is given by $N_B = N_0 e^{-\\lambda t}$.<br><br>Given that the ratio of the number of nuclei of material B to that of A is $e$, we have:<br><br>$\\dfrac{N_B}{N_A} = e$<br><br>$\\dfrac{N_0 e^{-\\lambda t}}{N_0 e^{-7\\lambda t}} = e$<br><br>$e^{6\\lambda t} = e^1$<br><br>Equating the powers of $e$, we get:<br><br>$6\\lambda t = 1$<br><br>$t = \\dfrac{1}{6\\lambda}$<br><br>Answer: $\\frac{1}{6 \\lambda}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b1fbf9280d7f9932670", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "For the following reaction, the particle ' $x$ ' is\n${ }_6^{\\mathrm{C}^{11}} \\longrightarrow{ }_5^{\\mathrm{B}^{11}}+\\beta^{+}+\\mathrm{X}$", "image": null}, "options": [{"id": "ivLLJ", "text": "proton", "image": null, "isCorrect": false}, {"id": "OQF02", "text": "neutrino", "image": null, "isCorrect": true}, {"id": "QtiR9", "text": "anti neutrino", "image": null, "isCorrect": false}, {"id": "uguuQ", "text": "neutron", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given nuclear reaction represents positron emission ($\\beta^{+}$ decay).<br><br>In $\\beta^{+}$ decay, a proton inside the nucleus is converted into a neutron, a positron ($\\beta^{+}$), and a neutrino ($\\nu$).<br><br>The general equation for $\\beta^{+}$ decay is:<br><br>${ }_{Z}^{A}\\mathrm{X} \\longrightarrow { }_{Z-1}^{A}\\mathrm{Y} + { }_{+1}^{0}\\beta + \\nu$<br><br>Comparing this with the given reaction:<br><br>${ }_{6}^{11}\\mathrm{C} \\longrightarrow { }_{5}^{11}\\mathrm{B} + \\beta^{+} + \\mathrm{X}$<br><br>The particle $\\mathrm{X}$ is a neutrino.<br><br>Answer: neutrino", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214430aee93fa0796df3f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "Two radioactive substances $A$ and $B$ have decay constants ' $5 \\lambda$ ' and ' $\\lambda$ ' respectively. At $\\mathrm{t}=0$, they have the same number of nuclei. The ratio of number of nuclei of A to those of B will be $\\left(\\frac{1}{\\mathrm{e}}\\right)^2$ after a time interval", "image": null}, "options": [{"id": "wK5p0", "text": "$\\frac{1}{4 \\lambda}$", "image": null, "isCorrect": false}, {"id": "mSXFi", "text": "$4 \\lambda$", "image": null, "isCorrect": false}, {"id": "JRugT", "text": "$2 \\lambda$", "image": null, "isCorrect": false}, {"id": "Rjurq", "text": "$\\frac{1}{2 \\lambda}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let the initial number of nuclei of A and B be $N_0$.<br><br>The number of nuclei of A at time $t$ is $N_A = N_0 e^{-5\\lambda t}$.<br><br>The number of nuclei of B at time $t$ is $N_B = N_0 e^{-\\lambda t}$.<br><br>The ratio of the number of nuclei of A to B is given by:<br><br>$\\dfrac{N_A}{N_B} = \\dfrac{N_0 e^{-5\\lambda t}}{N_0 e^{-\\lambda t}} = e^{-4\\lambda t}$<br><br>Given that the ratio is $\\left(\\dfrac{1}{e}\\right)^2 = e^{-2}$, we have:<br><br>$e^{-4\\lambda t} = e^{-2}$<br><br>Equating the powers of $e$, we get:<br><br>$4\\lambda t = 2$<br><br>$t = \\dfrac{2}{4\\lambda} = \\dfrac{1}{2\\lambda}$<br><br>Answer: $\\frac{1}{2 \\lambda}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792141c0aee93fa0796de0b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "In the given reaction\r\n${ }_z X^A \\rightarrow{ }_{z+1} Y^A \\rightarrow{ }_{z-1} K^{A-4} \\rightarrow{ }_{z-1} K^{A-4}$\r\nradioactive radiations are emitted in the sequence", "image": null}, "options": [{"id": "tiPh3", "text": "$\\alpha, \\beta, \\gamma$", "image": null, "isCorrect": false}, {"id": "eIOgE", "text": "$\\beta, \\alpha, \\gamma$", "image": null, "isCorrect": true}, {"id": "O8nbB", "text": "$\\gamma, \\alpha, \\beta$", "image": null, "isCorrect": false}, {"id": "aBoft", "text": "$\\beta, \\gamma, \\alpha$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In the first step, ${ }_z X^A \\rightarrow { }_{z+1} Y^A$, the atomic number increases by $1$ and the mass number remains unchanged. This indicates the emission of a $\\beta$ particle.<br><br>In the second step, ${ }_{z+1} Y^A \\rightarrow { }_{z-1} K^{A-4}$, the atomic number decreases by $2$ and the mass number decreases by $4$. This indicates the emission of an $\\alpha$ particle.<br><br>In the third step, ${ }_{z-1} K^{A-4} \\rightarrow { }_{z-1} K^{A-4}$, both the atomic number and the mass number remain unchanged. This indicates the emission of a $\\gamma$ ray.<br><br>The sequence of emitted radioactive radiations is $\\beta, \\alpha, \\gamma$.<br><br>Answer: $\\beta, \\alpha, \\gamma$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214080aee93fa0796dd70", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "A radioactive substance has half-life of 60 minute. During 3 hour, the amount of substance decayed would be", "image": null}, "options": [{"id": "8LZ96", "text": "$8.5 \\%$", "image": null, "isCorrect": false}, {"id": "Xj6R4", "text": "$12.5 \\%$", "image": null, "isCorrect": false}, {"id": "S03Ea", "text": "$25 \\%$", "image": null, "isCorrect": false}, {"id": "PsGni", "text": "$87.5 \\%$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given half-life $T_{1/2} = 60 \\text{ minute} = 1 \\text{ hour}$.<br><br>Time elapsed $t = 3 \\text{ hour}$.<br><br>Number of half-lives $n = \\dfrac{t}{T_{1/2}} = \\dfrac{3}{1} = 3$.<br><br>Amount of substance remaining after $n$ half-lives is given by $N = N_0 \\left(\\dfrac{1}{2}\\right)^n$.<br><br>Substituting $n = 3$, we get $N = N_0 \\left(\\dfrac{1}{2}\\right)^3 = \\dfrac{N_0}{8}$.<br><br>Amount of substance decayed is $N_0 - N = N_0 - \\dfrac{N_0}{8} = \\dfrac{7N_0}{8}$.<br><br>Percentage of substance decayed is $\\dfrac{7}{8} \\times 100\\% = 87.5\\%$.<br><br>Answer: $87.5 \\%$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e30aee93fa0796dc53", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "If ' $T$ ' is the half life of a radioactive substance then its instantaneous rate of change of activity is proportional to", "image": null}, "options": [{"id": "qOghR", "text": "T", "image": null, "isCorrect": false}, {"id": "k7HDV", "text": "$\\mathrm{T}^{-2}$", "image": null, "isCorrect": true}, {"id": "7us9G", "text": "$\\mathrm{T}^{+2}$", "image": null, "isCorrect": false}, {"id": "xOktY", "text": "$\\mathrm{T}^{-3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The activity of a radioactive substance is given by $A = \\lambda N$.<br><br>The instantaneous rate of change of activity is $\\dfrac{dA}{dt} = \\dfrac{d}{dt}(\\lambda N) = \\lambda \\dfrac{dN}{dt}$.<br><br>Since the rate of decay is $\\dfrac{dN}{dt} = -\\lambda N$, we get $\\dfrac{dA}{dt} = -\\lambda^2 N$.<br><br>The decay constant $\\lambda$ is related to the half-life $T$ by $\\lambda = \\dfrac{\\ln 2}{T}$.<br><br>Substituting the value of $\\lambda$, we get $\\dfrac{dA}{dt} = -\\left(\\dfrac{\\ln 2}{T}\\right)^2 N$.<br><br>Thus, for a given number of nuclei $N$, the instantaneous rate of change of activity is proportional to $T^{-2}$.<br><br>Answer: $\\mathrm{T}^{-2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213840aee93fa0796d968", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "Half-lives of two radioactive elements $A$ and $B$ are 30 minute and 60 minute respectively. Initially the samples have equal number of nuclei. After 120 minute the ratio of decayed numbers of nuclei of $B$ to that of $A$ will be", "image": null}, "options": [{"id": "b4Uwy", "text": "$1: 15$", "image": null, "isCorrect": false}, {"id": "tfj8F", "text": "$1: 4$", "image": null, "isCorrect": false}, {"id": "FGiKl", "text": "$4: 5$", "image": null, "isCorrect": true}, {"id": "ompR4", "text": "$5: 4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Initial number of nuclei of $A$ and $B$ is $N_0$.<br><br>Half-life of $A$, $T_A = 30$ min.<br><br>Half-life of $B$, $T_B = 60$ min.<br><br>Time $t = 120$ min.<br><br>Number of half-lives for $A$, $n_A = \\dfrac{120}{30} = 4$.<br><br>Number of half-lives for $B$, $n_B = \\dfrac{120}{60} = 2$.<br><br>Number of nuclei of $A$ remaining, $N_A = \\dfrac{N_0}{2^4} = \\dfrac{N_0}{16}$.<br><br>Number of decayed nuclei of $A$, $D_A = N_0 - \\dfrac{N_0}{16} = \\dfrac{15N_0}{16}$.<br><br>Number of nuclei of $B$ remaining, $N_B = \\dfrac{N_0}{2^2} = \\dfrac{N_0}{4}$.<br><br>Number of decayed nuclei of $B$, $D_B = N_0 - \\dfrac{N_0}{4} = \\dfrac{3N_0}{4}$.<br><br>Ratio of decayed nuclei of $B$ to that of $A$ is $\\dfrac{D_B}{D_A} = \\dfrac{\\dfrac{3N_0}{4}}{\\dfrac{15N_0}{16}} = \\dfrac{3}{4} \\times \\dfrac{16}{15} = \\dfrac{4}{5}$.<br><br>Answer: $4: 5$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262790279619d9d8a34d5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "Half life of radio-active element is 1600 years. The fraction of sample remains undecayed after 6400 years will be", "image": null}, "options": [{"id": "kYFsV", "text": "$\\frac{1}{16}$", "image": null, "isCorrect": true}, {"id": "utB9r", "text": "$\\frac{1}{4}$", "image": null, "isCorrect": false}, {"id": "YxIwY", "text": "$\\frac{1}{8}$", "image": null, "isCorrect": false}, {"id": "gS3iD", "text": "$\\frac{1}{24}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\frac{\\mathrm{N}}{\\mathrm{N}_0}=\\left(\\frac{1}{2}\\right)^{\\frac{\\mathrm{t}}{\\mathrm{T}}}$\nHere, $\\mathrm{t}=6400$ years and $\\mathrm{T}=1600$ years $\\therefore \\quad \\frac{\\mathrm{N}}{\\mathrm{N}_0}=\\left(\\frac{1}{2}\\right)^{\\frac{6400}{1600}}=\\left(\\frac{1}{2}\\right)^4=\\frac{1}{16}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262450279619d9d8a332b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "An isotope of the original nucleus can be formed in a radioactive decay, with the emission of following particles.", "image": null}, "options": [{"id": "0xin3", "text": "one $\\alpha$ and one $\\beta$", "image": null, "isCorrect": false}, {"id": "YW4ZD", "text": "one $\\alpha$ and two $\\beta$", "image": null, "isCorrect": true}, {"id": "k4shH", "text": "one $\\alpha$ and four $\\beta$", "image": null, "isCorrect":
