false}, {"id": "UPWKC", "text": "four $\\alpha$ and one $\\beta$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "${ }_{\\mathrm{Z}} \\mathrm{X}^{\\mathrm{A}} \\stackrel{\\alpha}{\\longrightarrow}{ }_{\\mathrm{Z}-2} \\mathrm{Y}^{\\mathrm{A}-4} \\stackrel{2 \\beta^{-}}{\\longrightarrow}{ }_{\\mathrm{Z}} \\mathrm{X}^{\\mathrm{A}-4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262400279619d9d8a3304", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "A radioactive sample has half-life of 5 years. The percentage of fraction decayed in 10 years will be", "image": null}, "options": [{"id": "NzJrf", "text": "$25 \\%$", "image": null, "isCorrect": false}, {"id": "sg7UH", "text": "$50 \\%$", "image": null, "isCorrect": false}, {"id": "mUxYM", "text": "$75 \\%$", "image": null, "isCorrect": true}, {"id": "hdqBT", "text": "$100 \\%$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given:\nTotal time, $\\mathrm{T}=10$ years\nHalf life, $\\mathrm{T}_{1 / 2}=5$ years\n$\\therefore \\quad$ No. of half lives, $\\mathrm{n}=\\frac{10}{5}=2$\nFrom $\\frac{\\mathrm{N}}{\\mathrm{N}_0}=\\left(\\frac{1}{2}\\right)^{\\mathrm{n}}$\n$\\therefore \\quad \\frac{\\mathrm{N}}{\\mathrm{N}_0}=\\left(\\frac{1}{2}\\right)^2=\\frac{1}{4}$\n$\\therefore \\quad$ After 10 years, $\\frac{1}{4}^{\\text {th }}$ of the original substance will remain.\n$\\Rightarrow\\left(1-\\frac{1}{4}\\right)=\\frac{3}{4} \\times 100=75 \\%$ of the fraction would get decayed.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2622d0279619d9d8a3269", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "Two different radioactive elements with half lives ' $\\mathrm{T}_1$ ' and ' $\\mathrm{T}_2$ ' have undecayed atoms ' $\\mathrm{N}_1$ ' and ' $\\mathrm{N}_2$ ' respectively present at a given instant. The ratio of their activities at that instant is", "image": null}, "options": [{"id": "VRwNo", "text": "$\\frac{\\mathrm{N}_1 \\mathrm{~T}_1}{\\mathrm{~N}_2 \\mathrm{~T}_2}$", "image": null, "isCorrect": false}, {"id": "jKFRf", "text": "$\\frac{\\mathrm{N}_2 \\mathrm{~T}_2}{\\mathrm{~N}_1 \\mathrm{~T}_1}$", "image": null, "isCorrect": false}, {"id": "SoUeS", "text": "$\\frac{\\mathrm{N}_1 \\mathrm{~T}_2}{\\mathrm{~N}_2 \\mathrm{~T}_1}$", "image": null, "isCorrect": true}, {"id": "Y1XBJ", "text": "$\\frac{\\mathrm{N}_1 \\mathrm{~N}_2}{\\mathrm{~T}_1 \\mathrm{~T}_2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\therefore \\quad$ Activity is given as:\n$$\n\\begin{aligned}\n\\therefore \\quad \\mathrm{A} & =\\lambda \\mathrm{N} \\\\\n\\lambda & =\\frac{\\ln 2}{\\mathrm{~T}}\n\\end{aligned}\n$$\n$\\therefore \\quad$ Ratio of two different radioactive elements will be:\n$$\n\\begin{aligned}\n& \\frac{\\mathrm{A}_1}{\\mathrm{~A}_2}=\\frac{\\lambda_1 \\mathrm{~N}_1}{\\lambda_2 \\mathrm{~N}_2} \\\\\n& \\frac{\\mathrm{A}_1}{\\mathrm{~A}_2}=\\frac{\\frac{\\ln 2}{\\mathrm{~T}_1} \\mathrm{~N}_1}{\\frac{\\ln 2}{\\mathrm{~T}_2} \\mathrm{~N}_2} \\\\\n& \\frac{\\mathrm{A}_1}{\\mathrm{~A}_2}=\\frac{\\mathrm{N}_1 \\mathrm{~T}_2}{\\mathrm{~N}_2 \\mathrm{~T}_1}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261f70279619d9d8a30bf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "In a radioactive disintegration, the ratio of initial number of atoms to the number of atoms present at time $t=\\frac{1}{2 \\lambda}$ is $[\\lambda=$ decay constant $]$", "image": null}, "options": [{"id": "kqp1c", "text": "$\\frac{1}{\\mathrm{e}}$", "image": null, "isCorrect": false}, {"id": "SZsTZ", "text": "$\\sqrt{\\mathrm{e}}$", "image": null, "isCorrect": true}, {"id": "XE96M", "text": "$\\mathrm{e}$", "image": null, "isCorrect": false}, {"id": "hCprD", "text": "$2 \\mathrm{e}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to radioactive disintegration law,\n$$\n\\begin{aligned}\n& \\mathrm{N}=\\mathrm{N}_0 \\mathrm{e}^{-\\lambda \\mathrm{t}} \\\\\n& \\frac{\\mathrm{N}}{\\mathrm{N}_0}=\\mathrm{e}^{-\\lambda t} \\\\\n& \\frac{\\mathrm{N}}{\\mathrm{N}_0}=\\mathrm{e}^{-\\lambda \\times \\frac{1}{2 \\lambda}} \\\\\n& \\left(\\because t=\\frac{1}{2 \\lambda}\\right) \\\\\n& \\frac{\\mathrm{N}}{\\mathrm{N}_0}=\\mathrm{e}^{-\\frac{1}{2}} \\\\\n& \\frac{\\mathrm{N}_0}{\\mathrm{~N}}=\\mathrm{e}^{\\frac{1}{2}} \\\\\n& \\frac{\\mathrm{N}_0}{\\mathrm{~N}}=\\sqrt{\\mathrm{e}} \\\\\n&\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261940279619d9d8a2db2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "Activity of a radioactive sample decreases to $\\left(\\frac{1}{3}\\right)^{r d}$ of its original value in 3 days. Then in 9 days its activity reduces to", "image": null}, "options": [{"id": "yPP2H", "text": "$\\left(\\frac{1}{18}\\right)$ of the original value", "image": null, "isCorrect": false}, {"id": "NKBVP", "text": "$\\left(\\frac{1}{9}\\right)$ of the original value", "image": null, "isCorrect": false}, {"id": "qjQE6", "text": "$\\left(\\frac{1}{27}\\right)$ of the original value", "image": null, "isCorrect": true}, {"id": "Tdi4w", "text": "$\\left(\\frac{1}{3}\\right)$ of the original value", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Activity after time $t$ given that half-life is $T$ :\n$A=\\frac{A_0}{2^{t / T}}$\n$\\frac{A_0}{3}=\\frac{A_0}{2^{3 / T}}$\nActivity in 9 days,\n$A=\\frac{A_0}{2^{t / T}}=\\frac{A_0}{2^{9 / T}}=\\frac{A_0}{\\left(2^{3 / T}\\right)^3}=\\frac{A_0}{27}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2613b0279619d9d8a2adc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "The half of a radioactive substance is 25 minutes The time between $50 \\%$ decay and $87.5 \\%$ decay of the substance will be", "image": null}, "options": [{"id": "pPLum", "text": "75 min", "image": null, "isCorrect": false}, {"id": "nXHJX", "text": "$25 \\mathrm{~min}$", "image": null, "isCorrect": false}, {"id": "bsLqF", "text": "$37.5 \\mathrm{~min}$", "image": null, "isCorrect": false}, {"id": "Mtr0y", "text": "$50 \\mathrm{~min}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For $50 \\%$ decay, time is equal to one half-life.\nFor $87.5 \\%$ decay, time is three half - lives.\n$\\therefore$ Time interval $\\Delta \\mathrm{t}=2$ half - lives.\n$\\Delta t=2 \\times 25 \\mathrm{~min}=50 \\mathrm{~min}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260f00279619d9d8a2885", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}], "question": {"text": "For a substance, fraction of its initial quantify $\\left(\\mathrm{N}_0\\right)$ which will disintegrate in its average life time is about $(\\mathrm{e}=2.71)$", "image": null}, "options": [{"id": "2anaq", "text": "$\\left(\\frac{1}{3}\\right) \\mathrm{N}_0$", "image": null, "isCorrect": false}, {"id": "TzFUE", "text": "$\\left(\\frac{1}{2}\\right) \\mathrm{N}_0$", "image": null, "isCorrect": false}, {"id": "YoKaH", "text": "$\\left(\\frac{2}{3}\\right) \\mathrm{N}_0$", "image": null, "isCorrect": true}, {"id": "Scp7F", "text": "$(0.9) \\mathrm{N}_0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a radioactive substance, $\\mathrm{N}=\\mathrm{N}_0 \\mathrm{e}^{-\\lambda t}$\nGiven the mean life, $\\mathrm{t}=\\frac{1}{\\lambda}$\n$\\therefore \\mathrm{N}=\\mathrm{N}_0 \\mathrm{e}^{-\\lambda \\times \\frac{1}{\\lambda}}=\\frac{\\mathrm{N}_0}{\\mathrm{e}}=\\frac{\\mathrm{N}_0}{2.71}=0.37 \\mathrm{~N}_0$\n$0.37 \\mathrm{~N}_0$ is the amount of radioactive substance left after time $\\tau$.\n$\\therefore$ The amount disintegrated in time $\\tau$\n$=\\mathrm{N}_0-0.37 \\mathrm{~N}_0=0.63 \\mathrm{~N}_0=\\frac{2}{3} \\mathrm{~N}_0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260cd0279619d9d8a276f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "The half-life of a radioactive substance is 30 minutes. The time taken between $40 \\%$ decay and $85 \\%$ decay of the same radioactive substance is", "image": null}, "options": [{"id": "1jsmV", "text": "15 minutes", "image": null, "isCorrect": false}, {"id": "n0CVf", "text": "90 minutes", "image": null, "isCorrect": false}, {"id": "rWzrn", "text": "60 minutes", "image": null, "isCorrect": true}, {"id": "Fdzwl", "text": "30 minutes", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When $40 \\%$ nuclei decay, $60 \\%$ nuclei remain undecayed Let this number be $\\mathrm{N}_0$ When $85 \\%$ nuclei decay, $15 \\%$ nuclei remain undecayed This number will be $\\mathrm{N}=\\frac{\\mathrm{N}_0}{4}$\nThe number of nuclei will become one-fourth in two half-lives i.e., 60 minutes.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2607f0279619d9d8a24fc", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "Two radioactive materials $\\mathrm{X}_1$ and $\\mathrm{X}_2$ have decay constants ' $5 \\lambda$ ' and ' $\\lambda$ ' respectively. Initially, they have the same number of nuclei. After time ' $t$ ', the ratio of number of nuclei of $X_1$ to that of $X_2$ is $\\frac{1}{e}$. Then $t$ is equal to", "image": null}, "options": [{"id": "GU1an", "text": "$\\frac{\\lambda}{2}$", "image": null, "isCorrect": false}, {"id": "ctrwe", "text": "$\\frac{\\mathrm{e}}{\\lambda}$", "image": null, "isCorrect": false}, {"id": "q2ThV", "text": "$\\lambda$", "image": null, "isCorrect": false}, {"id": "iYqbN", "text": "$\\frac{1}{4 \\lambda}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $N_1$ be the number of $X_1$ and $N_2$ be the number of nuclei of $X_2$ after time t.\n$$\n\\begin{aligned}\n& \\therefore \\mathrm{N}_1=\\mathrm{N}_0 \\mathrm{e}^{-5 \\lambda \\mathrm{t}} \\text { and } \\mathrm{N}_2=\\mathrm{N}_0 \\mathrm{e}^{-\\lambda \\mathrm{t}} \\\\\n& \\therefore \\frac{\\mathrm{N}_1}{\\mathrm{~N}_2}=\\frac{\\mathrm{e}^{-5 \\lambda \\mathrm{t}}}{\\mathrm{e}^{-\\lambda, \\mathrm{t}}}=\\frac{1}{\\mathrm{e}^{4 \\lambda \\cdot \\mathrm{t}}}=\\frac{1}{\\mathrm{e}} \\\\\n& \\therefore 4 \\lambda \\mathrm{t}=1 \\\\\n& \\therefore \\mathrm{t}=\\frac{1}{4 \\lambda}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260240279619d9d8a2213", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "A sample of radioactive element contains $8 \\times 10^{16}$ active nuclei. The halt-life of the element is 15 days. The number of nuclei decayed after 60 days is", "image": null}, "options": [{"id": "uRTIq", "text": "$7.5 \\times 10^{+16}$", "image": null, "isCorrect": true}, {"id": "cqkHr", "text": "$2.0 \\times 10^{16}$", "image": null, "isCorrect": false}, {"id": "0t0wF", "text": "$0.5 \\times 10^{16}$", "image": null, "isCorrect": false}, {"id": "DKvql", "text": "$4.0 \\times 10^{16}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Half life, $\\mathrm{T}=15$ days, time $\\mathrm{t}=60$ days $=4 \\mathrm{~T}$ The number of nuclei remaining is given by\n$$\n\\begin{aligned}\n& \\mathrm{N}=\\mathrm{N}_0\\left(\\frac{1}{2}\\right)^{\\mathrm{n}}=\\mathrm{N}_0\\left(\\frac{1}{2}\\right)^4=\\frac{1}{16} \\times 8 \\times 10^{16} \\\\\n& =0.5 \\times 10^{16} \\\\\n& \\therefore \\text { No. of nuclei decayed }=\\mathrm{N}_0-\\mathrm{N} \\\\\n& =8 \\times 10^{16}-0.5 \\times 10^{16}=7.5 \\times 10^{16}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260000279619d9d8a20f4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "Two different radioactive elements with half-lives ' $\\mathrm{T}_{1}$ ' and ' $\\mathrm{T}_{2}$ ' have undecayed\natoms ' $\\mathrm{N}_{1}{ }^{\\prime}$ and ${ }^{\\prime} \\mathrm{N}_{2}{ }^{\\prime}$ respectively, present at a given instant. The ratio of their\nactivities at this instant is", "image": null}, "options": [{"id": "lB9Vq", "text": "$\\frac{\\mathrm{T}_{1} \\mathrm{~T}_{2}}{\\mathrm{~N}_{1} \\mathrm{~N}_{2}}$", "image": null, "isCorrect": false}, {"id": "RWtNZ", "text": "$\\frac{\\mathrm{N}_{1} \\mathrm{~N}_{2}}{\\mathrm{~T}_{1} \\mathrm{~T}_{2}}$", "image": null, "isCorrect": false}, {"id": "FDoAX", "text": "$\\frac{\\mathrm{N}_{1} \\mathrm{~T}_{1}}{\\mathrm{~N}_{2} \\mathrm{~T}_{2}}$", "image": null, "isCorrect": false}, {"id": "Upows", "text": "$\\frac{\\mathrm{N}_{1} \\mathrm{~T}_{2}}{\\mathrm{~N}_{2} \\mathrm{~T}_{1}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Activity, $\\mathrm{R}\\left(=\\frac{\\mathrm{dN}}{\\mathrm{dt}}\\right)=\\lambda \\mathrm{N}$\nDecay constant $\\lambda=\\frac{\\log _{e} 2}{\\mathrm{~T}}$\n$\\therefore$ Activity $R=\\frac{\\left(\\log _{\\mathrm{e}} 2\\right) \\mathrm{N}}{\\mathrm{T}}$\n$\\therefore \\mathrm{R}_{1}=\\frac{\\left(\\log _{e} 2\\right) \\mathrm{N}_{1}}{\\mathrm{~T}_{1}}, \\mathrm{R}_{2}=\\frac{\\left(\\log _{e} 2\\right) \\mathrm{N}_{2}}{\\mathrm{~T}_{2}}$\nFor two elements $\\frac{R_{1}}{R_{2}}=\\frac{N_{1}}{T_{1}} \\times \\frac{T_{2}}{N_{2}}=\\left(\\frac{N_{1}}{N_{2}}\\right)=\\left(\\frac{T_{2}}{T_{1}}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fc60279619d9d8a1f21", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "A radioactive nucleus emits $4 \\alpha$ particles and $7 \\beta$ particles in succession. The ratio of number of neutrons to that of protons is $[\\mathrm{A}=$ mass number, $\\mathrm{Z}=$ atomic number $]$", "image": null}, "options": [{"id": "exXWA", "text": "$\\frac{\\mathrm{A}-\\mathrm{Z}-13}{\\mathrm{Z}-2}$", "image": null, "isCorrect": false}, {"id": "g6CQV", "text": "$\\frac{A-Z-13}{Z-1}$", "image": null, "isCorrect": false}, {"id": "DDhs1", "text": "$\\frac{A-Z-15}{Z-1}$", "image": null, "isCorrect": true}, {"id": "Vp4x2", "text": "$\\frac{A-Z-11}{Z-2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let us assume, a particle $X$ having atomic number $Z$ and mass number $A$.\nWhen an a-particle is emitted by a nucleus, then its atomic number decreases by 2 and mass number decreases by 4 . So, for given case, $\\mathrm{Z} \\mathrm{X}^{\\mathrm{A}} \\stackrel{4 \\text { a-particle }}{\\longrightarrow} \\mathrm{Z}_{-\\mathrm{a}} \\mathrm{Y}^{\\mathrm{A}-16}$\nWhen a $\\beta$-particle is emitted by a nucleus its atomic number increases by one and mass number remains unchanged. So, for given case,\n$\\mathrm{Z}-8 \\mathrm{Y}^{\\mathrm{A}-16} \\stackrel{7 \\beta-p a r t i c l e}{\\longrightarrow} \\mathrm{Z}-1 \\mathrm{Z}^{\\mathrm{A}-16}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fc50279619d9d8a1f1a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "An ' $\\alpha$ ' particle of energy $10 \\mathrm{eV}$ is moving in a circular path in uniform magnetic field. The energy of proton moving in the same path and same magnetic field will be [mass of ' $\\alpha$ ' particle $=4$ times mass of proton $]$", "image": null}, "options": [{"id": "J3sq4", "text": "$4 \\mathrm{eV}$", "image": null, "isCorrect": false}, {"id": "ldMlG", "text": "$8 \\mathrm{eV}$", "image": null, "isCorrect": false}, {"id": "aRS13", "text": "$16 \\mathrm{eV}$", "image": null, "isCorrect": false}, {"id": "Fim5D", "text": "$10 \\mathrm{eV}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "(C)\nFrom the formula mentioned above, momentum of particle moving in a magnetic field $\\mathrm{mv}=\\mathrm{p}=\\mathrm{qBr}$\nTherefore, Kinetic Energy of that particle can be written as $\\mathrm{KE}=\\frac{\\mathrm{p}^{2}}{2 \\mathrm{~m}}=$ $\\frac{q^{2} B^{2} r^{2}}{2 m}$\nIn the same magnetic field for the same path, $\\mathrm{KE} \\propto \\frac{\\mathrm{q}^{2}}{\\mathrm{~m}}$\nThis ratio is same for the alpha particle and the proton. $\\left(\\frac{(2 \\mathrm{e})^{2}}{4 \\mathrm{amu}}=\\frac{4 \\mathrm{e}^{2}}{4 \\mathrm{amu}}=\\right.$ $\\frac{\\mathrm{e}^{2}}{\\mathrm{amu}}$; Here amu is the atomic mass unit)\nSo, in such conditions, both will have the same energy. Hence, energy of the alpha particle will be $8 \\mathrm{eV}$ too.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f2f0279619d9d8a1a6e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 the number of radioactive nuclei in the sample\nSo, $\\frac{\\mathrm{dN}}{\\mathrm{dt}}$ can be negative\nThe variation of decay rate with number of active nuclei is shown by the graph", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ebd0279619d9d8a16e0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f62", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "MHT CET 2017"}], "question": {"text": "A radioactive element has a rate of disintegration 10,000 disintegrations per minute at a particular instant. After four minutes it becomes 2500 disintegrations per minute. The decay constant per minute is", "image": null}, "options": [{"id": "5JQ0H", "text": "<math><mn>0.2</mn><mrow><mrow><msubsup><mrow><mi mathvariant=\"normal\">log</mi></mrow><mrow><mi>e</mi></mrow><mrow></mrow></msubsup></mrow><mn>2</mn><mo>⁡</mo><mrow><mi>&nbsp;</mi></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "mXdiZ", "text": "<math><mi> </mi><mn>0.5</mn><mrow><mrow><msubsup><mrow><mi mathvariant=\"normal\">log</mi></mrow><mrow><mi>e</mi></mrow><mrow></mrow></msubsup></mrow><mn>2</mn><mo>⁡</mo><mrow><mi> </mi></mrow></mrow></math>", "image": null, "isCorrect": true}, {"id": "XLE8D", "text": "<math><mn>0.6</mn><mrow><mrow><msubsup><mrow><mi mathvariant=\"normal\">log</mi></mrow><mrow><mi>e</mi></mrow><mrow></mrow></msubsup></mrow><mn>2</mn><mo>⁡</mo><mrow><mi> </mi></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "upH1b", "text": "<math><mn>0.8</mn><mrow><mrow><msubsup><mrow><mi emission of either electrons or positrons. The electrons or positrons emitted in a $\\beta$ -decay do not exist inside the nucleus. They are only created at the time of emission, just as photons are created when an atom makes a transition from higher to a lower energy state. In negative $\\beta$ -decay a neutron in the nucleus is transformed into a proton, an electron and an antineutrino. Hence, in radioactive decay process, the negatively charged emitted \\beta-particles are the electrons produced as a result of the decay of neutrons present inside the nucleus.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e3f0279619d9d8a12e8", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "$m_{p}$ and $m_{n}$ are masses of proton and neutron respectively. An element of mass $M$ has $Z$ protons and $N$ neutrons then", "image": null}, "options": [{"id": "LcX6J", "text": "$M>Z m_{p}+N m_{n}$", "image": null, "isCorrect": false}, {"id": "u5Ndp", "text": "$M=Z m_{p}+N m_{n}$", "image": null, "isCorrect": false}, {"id": "Hu0dj", "text": "$M < Z m_{p}+N m_{n}$", "image": null, "isCorrect": true}, {"id": "aUHaN", "text": "$M$ may be greater than less than or equal to $Z m_{p}+N m_{n}$, depending on nature of element", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When a nucleus is formed, then the mass of nucleus is slightly less than the sum of the mass of $Z$ protons and $N$ neutrons.\nie,\n$$\nM < \\left(Z m_{p}+N m_{n}\\right)\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "65a263290279619d9d8a3c8d", "title": "Nuclear reactions", "totalQuestions": 3, "questions": [{"_id": "6abb88cf15a9fc0fc8c14730", "type": "singleCorrect", "question": {"text": "Which one of the following is possible nuclear reaction?", "image": null}, "options": [{"id": "cZk9L", "label": "A", "text": "${}_5\\text{B}^{10} + {}_2\\text{He}^4 \\rightarrow {}_7\\text{N}^{13} + {}_1\\text{H}^1$", "isCorrect": false, "image": null}, {"id": "UjY6p", "label": "B", "text": "${}_{11}\\text{Na}^{23} + {}_1\\text{H}^1 \\rightarrow {}_{10}\\text{N}^{20} + {}_2\\text{He}^4$", "isCorrect": false, "image": null}, {"id": "aNZo2", "label": "C", "text": "${}_{93}\\text{Np}^{239} \\rightarrow {}_{94}\\text{Pu}^{239} + {}_{-1}\\text{e}^0$", "isCorrect": true, "image": null}, {"id": "a2qt8", "label": "D", "text": "${}_7\\text{N}^{11} + {}_1\\text{H}^1 \\rightarrow {}_6\\text{C}^{12} + {}_{-1}\\text{e}^0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a nuclear reaction to be possible, both the mass number ($A$) and the atomic number ($Z$) must be conserved.<br><br>Checking the given options:<br><br>For ${}_5\\text{B}^{10} + {}_2\\text{He}^4 \\rightarrow {}_7\\text{N}^{13} + {}_1\\text{H}^1$:<br>LHS: $Z = 5 + 2 = 7$<br>RHS: $Z = 7 + 1 = 8$<br>Since $7 \\neq 8$, the atomic number is not conserved.<br><br>For ${}_{11}\\text{Na}^{23} + {}_1\\text{H}^1 \\rightarrow {}_{10}\\text{N}^{20} + {}_2\\text{He}^4$:<br>LHS: $Z = 11 + 1 = 12$, $A = 23 + 1 = 24$<br>RHS: $Z = 10 + 2 = 12$, $A = 20 + 4 = 24$<br>Although $Z$ and $A$ are mathematically balanced, the chemical symbol for $Z=10$ is Neon ($\\text{Ne}$), not Nitrogen ($\\text{N}$).<br><br>For ${}_{93}\\text{Np}^{239} \\rightarrow {}_{94}\\text{Pu}^{239} + {}_{-1}\\text{e}^0$:<br>LHS: $Z = 93$, $A = 239$<br>RHS: $Z = 94 - 1 = 93$, $A = 239 + 0 = 239$<br>Both the atomic number and mass number are conserved. This is a valid $\\beta^{-}$ decay reaction.<br><br>For ${}_7\\text{N}^{11} + {}_1\\text{H}^1 \\rightarrow {}_6\\text{C}^{12} + {}_{-1}\\text{e}^0$:<br>LHS: $Z = 7 + 1 = 8$<br>RHS: $Z = 6 - 1 = 5$<br>Since $8 \\neq 5$, the atomic number is not conserved.<br><br>Answer: ${}_{93}\\text{Np}^{239} \\rightarrow {}_{94}\\text{Pu}^{239} + {}_{-1}\\text{e}^0$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213490aee93fa0796d79a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "In the uranium radioactive series, the initial nucleus is ${ }_{92}^{238} \\mathrm{U}$ and that the final nucleus is ${ }_{82}^{206} \\mathrm{~Pb}$. When uranium nucleus decays into lead, the number of $\\alpha$-particles and $\\beta$-particles emitted are", "image": null}, "options": [{"id": "DRwNL", "text": "$4 \\alpha, 5 \\beta$", "image": null, "isCorrect": false}, {"id": "7OwtS", "text": "$5 \\alpha, 3 \\beta$", "image": null, "isCorrect": false}, {"id": "RKX58", "text": "$6 \\alpha, 7 \\beta$", "image": null, "isCorrect": false}, {"id": "oQ9Tv", "text": "$8 \\alpha, 6 \\beta$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let the number of $\\alpha$-particles emitted be $x$ and the number of $\\beta$-particles emitted be $y$.<br><br>The nuclear reaction can be written as:<br><br>${}_{92}^{238}\\mathrm{U} \\rightarrow {}_{82}^{206}\\mathrm{Pb} + x({}_{2}^{4}\\mathrm{He}) + y({}_{-1}^{0}\\mathrm{e})$<br><br>Equating the mass numbers on both sides:<br><br>$238 = 206 + 4x$<br><br>$4x = 32 \\Rightarrow x = 8$<br><br>Equating the atomic numbers on both sides:<br><br>$92 = 82 + 2x - y$<br><br>Substituting $x = 8$:<br><br>$92 = 82 + 16 - y$<br><br>$92 = 98 - y \\Rightarrow y = 6$<br><br>Thus, $8$ $\\alpha$-particles and $6$ $\\beta$-particles are emitted.<br><br>Answer: $8 \\alpha, 6 \\beta$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fd60279619d9d8a1fa2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "A shell of mass 'M' initially at rest suddenly explodes in three fragments. Two of\nthese fragments are of mass 'M $/ 4$ ' each, which move with velocities $3 \\mathrm{~ms}^{-1}$ and\n$4 \\mathrm{~ms}^{-1}$ respectively in mutually perpendicular directions. The magnitude of velocity of the third fragment is", "image": null}, "options": [{"id": "H7Sdg", "text": "$3 \\cdot 0 \\mathrm{~ms}^{-1}$", "image": null, "isCorrect": false}, {"id": "xKem4", "text": "$2 \\cdot 5 \\mathrm{~ms}^{-1}$", "image": null, "isCorrect": true}, {"id": "PSRAy", "text": "$1 \\cdot 5 \\mathrm{~ms}^{-1}$", "image": null, "isCorrect": false}, {"id": "oZ1ql", "text": "$2 \\cdot 0 \\mathrm{~ms}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The mass $M$ is initially at rest, hence its initial momentum is zero. By law or conservation of momentum, the net momentum of the three pieces should be zero. The moments of the two pieces are\n$\\mathrm{p}_{1}=\\frac{3 \\mathrm{M}}{4} \\text { and } \\mathrm{p}_{2}=\\frac{5 \\mathrm{M}}{4}$\nThree are at right angles to each other.\nTheir resultant will be $p=\\sqrt{p_{1}^{2}+p_{2}^{2}}$\n$\\begin{array}{l}\n=\\sqrt{\\left(\\frac{3 M}{4}\\right)^{2}+\\left(\\frac{4 M}{4}\\right)^{2}} \\\\\n=\\frac{M}{4} \\sqrt{(3)^{2}+(4)^{2}} \\\\\n=\\frac{M}{4} \\sqrt{25}=\\frac{5 M}{4}\n\\end{array}$\nThe momentum of the third piece will be equal and opposite to this.\nThe mass of the third piece will be $\\frac{M}{2}$\nIf its velocity is $\\mathrm{V}$, then\n$\\begin{array}{l}\n\\frac{M}{2} \\cdot V=\\frac{5 M}{4} \\\\\n\\therefore V=2.5 \\mathrm{~ms}^{-1}\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
