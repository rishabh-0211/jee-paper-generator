 =f \\times s \\\\\n& =\\frac{1}{6} \\times 3=0.5 \\mathrm{~J}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e82c6f5bfc7ab78aeb3f", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}], "type": "singleCorrect", "level": 1, "question": {"text": "A machine gun fires 300 bullets per $\\mathrm{min}$ if the mass of each bullet is $10 \\mathrm{~g}$ and the velocity of the bullets is $600 \\mathrm{~ms}^{-1}$, the power (in $\\mathrm{kW}$ ) of the gun is", "image": null}, "options": [{"id": "eVDIm", "text": "\r\n$43200$\r\n", "isCorrect": false, "image": null}, {"id": "j1OUd", "text": "\r\n$9$\r\n", "isCorrect": true, "image": null}, {"id": "6vEnb", "text": "\r\n$72$\r\n", "isCorrect": false, "image": null}, {"id": "eX49p", "text": "\r\n$7.2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Work done by the gun $=$ total kinetic energy of the bullets\r\n$$\r\n\\begin{aligned}\r\n& =n \\frac{1}{2} m v^2=300 \\times \\frac{1}{2} \\times 10 \\times 10^{-3} \\times(600)^2 \\\\\r\n& =150 \\times 10 \\times 10^{-3} \\times 600 \\times 600\r\n\\end{aligned}\r\n$$\r\n$$\r\n\\begin{aligned}\r\n\\text { Power of gun } & =\\frac{\\text { work done }}{\\text { Time taken }} \\\\\r\n& =\\frac{150 \\times 10 \\times 10^{-3} \\times 600 \\times 600}{60 \\mathrm{~s}} \\\\\r\n& =9 \\mathrm{~kW} \\quad(\\because 1 \\text { minute }=60 \\text { seconds })\r\n\\end{aligned}\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8106f5bfc7ab78aea45", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 1, "question": {"text": "A boy pushes a toy box $2.0 \\mathrm{~m}$ along the floor by means of a force of $10 \\mathrm{~N}$ directed downward at an angle of $60^{\\circ}$ to the horizontal. The work done by the boy is", "image": null}, "options": [{"id": "vmOjx", "text": "$6 \\mathrm{~J}$", "isCorrect": false, "image": null}, {"id": "A9LAl", "text": "$8 \\mathrm{~J}$", "isCorrect": false, "image": null}, {"id": "RJDci", "text": "$10 \\mathrm{~J}$", "isCorrect": true, "image": null}, {"id": "0DdFi", "text": "$12 \\mathrm{~J}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\mathrm{W}=\\mathrm{F} \\mathrm{s} \\cos \\theta=10 \\times 2 \\cos 60^{\\circ}=10 \\mathrm{~J}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7b96f5bfc7ab78ae753", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 2, "question": {"text": "A small block of mass $\\mathrm{m}$ is kept on a rough inclined surface of inclination $\\theta$ fixed in a elevator. The elevator goes up with a uniform velocity $\\mathrm{v}$ and the block does not slide on the wedge. The work done by the force of friction on the block in time t will be:", "image": null}, "options": [{"id": "Bvwuk", "text": "zero", "isCorrect": false, "image": null}, {"id": "cPvkr", "text": "$\\mathrm{mgvt} \\cos ^{2} \\theta$", "isCorrect": false, "image": null}, {"id": "bq0BH", "text": "$\\mathrm{mgvt} \\sin ^{2} \\theta$", "isCorrect": true, "image": null}, {"id": "xPfZ6", "text": "$\\mathrm{mgvt} \\sin 2 \\theta$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "\\(\\mathrm{W}_{\\mathrm{f}}=\\mathrm{f} \\sin \\theta \\mathrm{S}\\)\r\n\r\n\\(=(\\mathrm{mg} \\sin \\theta)(\\sin \\theta)(\\mathrm{vt})\\)\r\n\r\n\\(=\\mathrm{mg} \\sin ^{2} \\theta \\mathrm{vt}\\)", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7ab6f5bfc7ab78ae6d9", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 3, "question": {"text": "A light inextensible string that goes over a smooth fixed pulley as shown in the figure connects two blocks of masses $0.36 \\mathrm{~kg}$ and $0.72 \\mathrm{~kg}$. Taking $\\mathrm{g}=10 \\mathrm{~m} / \\mathrm{s}^{2},$ find the work done $(\\mathrm{in}$\r\n\r\njoules) by the string on the block of mass $0.36 \\mathrm{~kg}$ during the first second after the system is released from rest.\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/i7gKSnXmc1MN1Q3bNmoSV1vXdMYrIOUkiYHPtD9sntw.original.fullsize.png\">", "image": null}, "options": [{"id": "dFAQH", "text": "$4 \\mathrm{~J}$", "isCorrect": false, "image": null}, {"id": "6nCtb", "text": "$2 \\mathrm{~J}$", "isCorrect": false, "image": null}, {"id": "72Utl", "text": "$8 \\mathrm{~J}$", "isCorrect": true, "image": null}, {"id": "3LiD3", "text": "$10 \\mathrm{~J}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $m=0.36 \\mathrm{~kg}, M=0.72 \\mathrm{~kg}$. The figure shows the forces on $m$ and $M$. When the system is released, let the acceleration be $a$. Then\r\n\r\n$T-m g=m a$\r\n\r\n$M g-T=M a$\r\n\r\n$$\r\n\r\na=\\frac{(M-m) g}{M+m}=g / 3\r\n\r\n$$\r\n\r\nand $T=4 \\mathrm{mg} / 3$\r\n\r\nFor block m:\r\n\r\n$$\r\n\r\nu=0, a=g / 3, t=1, s=?\r\n\r\n$$\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/_LD6QYhzhQSmiBzK3EKnfY0Rr12eqtvfzy_3HP0QUNg.original.fullsize.png\"><br>\r\n\r\n$$\r\n\r\ns=u t+\\frac{1}{2} a t^{2}=0+\\frac{1}{2} \\times \\frac{g}{3} \\times 1^{2}=g / 6\r\n\r\n$$\r\n\r\nWork done by the string on $m$ is\r\n\r\n$$\r\n\r\n\\bar{T} \\bar{s}=T s=4 \\frac{m g}{3} \\times \\frac{g}{6}=\\frac{4 \\times 0.36 \\times 10 \\times 10}{3 \\times 6}=8 \\mathrm{~J}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64c0e8526f5bfc7ab78aecd6", "title": "Energy", "totalQuestions": 9, "questions": [{"_id": "67726d13c49e8ef28ee2b40a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}], "question": {"text": "An ideal massless spring $S$ can be compressed 1 m by a force of 100 N in equilibrium. The same spring is placed at the bottom of a frictionless inclined plane inclined at $30^{\\circ}$ to the horizontal. A 10 kg block $M$ is released from rest at the top of the incline and is brought to rest momentarily after compressing the spring by 2 m . If $g=10 \\mathrm{~m} / \\mathrm{s}^2$, what is the speed of mass just before it touches the spring?\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/hq1iaBw0F-3D2b_C0XDe7_HWaCatHfnfeY04o3kCOts.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "UaWiZ", "text": "$\\sqrt{20} \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": true}, {"id": "qxMAU", "text": "$\\sqrt{30} \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "4TJOC", "text": "$\\sqrt{10} \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "G0tdl", "text": "$\\sqrt{40} \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$F=k x$\n$\\therefore \\quad k=\\frac{F}{x}=\\frac{100}{1} \\mathrm{~N} / \\mathrm{m}=100 \\mathrm{~N} / \\mathrm{m}$\nNow, from energy conservation, between natural length of spring and its maximum compression state.\n$\\frac{1}{2} m v^2+m g h=\\frac{1}{2} k x_{\\max }^2$\n$\\begin{aligned} \\therefore \\quad v & =\\sqrt{\\frac{k x_{\\max }^2}{m}-2 g h} \\\\ & =\\sqrt{\\frac{(100)(2)^2}{10}-(2)(10)\\left(\\frac{2}{2}\\right)}=\\sqrt{20} \\mathrm{~m} / \\mathrm{s}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67726cf6c49e8ef28ee2b32f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}], "question": {"text": "A spherical ball of mass 20 kg is stationary at the top of a hill of height 100 m . It rolls down a smooth surface to the ground, then climbs up another hill of height 30 m and finally rolls down to a horizontal base at a height of 20 m above the ground. The velocity attained by the ball is", "image": null}, "options": [{"id": "U5yUr", "text": "$20 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "4y4C4", "text": "$40 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": true}, {"id": "7v8Iq", "text": "$10 \\sqrt{30} \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "sfpw5", "text": "$10 \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/D6DbmVWgQOgrs2-vWpfGCUXRmP72VUd_H9L2sm3ZrwQ.original.fullsize.png\"/>\nUsing conservation of energy,\n$\\mathrm{m}(10 \\times 100)=\\mathrm{m}\\left(\\frac{1}{2} \\mathrm{v}^2+10 \\times 20\\right)$\nor $\\frac{1}{2} v^2=800$ or $v=\\sqrt{1600}=40 \\mathrm{~m} / \\mathrm{s}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7c86f5bfc7ab78ae7d4", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 2, "question": {"text": "An elastic string of unstretched length $\\mathrm{L}$ and force constant $\\mathrm{k}$ is stretched by a small length $\\mathrm{x}$. It is further stretched by another small length y. The work done in the second stretching is", "image": null}, "options": [{"id": "ZZ1Xh", "text": "$1 / 2 \\mathrm{Ky}^{2}$", "isCorrect": false, "image": null}, {"id": "peUj9", "text": "$1 / 2 \\mathrm{Ky}(2 \\mathrm{x}+\\mathrm{y})$", "isCorrect": true, "image": null}, {"id": "xFBh7", "text": "$1 / 2 \\mathrm{~K}\\left(\\mathrm{x}^{2}+\\mathrm{y}^{2}\\right)$", "isCorrect": false, "image": null}, {"id": "ZvKwa", "text": "$1 / 2 \\mathrm{k}(\\mathrm{x}+\\mathrm{y})^{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In the string elastic force is conservative in nature. $\\therefore \\mathrm{W}=-\\Delta \\mathrm{U}$\r\n\r\nWork done by elastic force of string,\r\n\r\n$$\r\n\r\n\\begin{aligned}\r\n\r\n\\mathrm{W} &=-\\left(\\mathrm{U}_{\\mathrm{F}}-\\mathrm{U}_{\\mathrm{i}}\\right)=\\mathrm{U}_{\\mathrm{i}}-\\mathrm{U}_{\\mathrm{F}} \\\\\r\n\r\n\\mathrm{W} &=\\frac{1}{2} \\mathrm{k} \\mathrm{x}^{2}-\\frac{\\mathrm{k}}{2}(\\mathrm{x}+\\mathrm{y})^{2} \\\\\r\n\r\n&=\\frac{1}{2} \\mathrm{k} \\mathrm{x}^{2}-\\frac{1}{2} \\mathrm{k}\\left(\\mathrm{x}^{2}+\\mathrm{y}^{2}+2 \\mathrm{xy}\\right) \\\\\r\n\r\n&=\\frac{1}{2} \\mathrm{k} \\mathrm{x}^{2}-\\frac{1}{2} \\mathrm{k} \\mathrm{y}^{2}-\\frac{1}{2} \\mathrm{kx}^{2}-\\frac{1}{2} \\mathrm{k}(2 \\mathrm{xy}) \\\\\r\n\r\n&=-\\mathrm{k} \\mathrm{x} \\mathrm{y}-\\frac{1}{2} \\mathrm{k} \\mathrm{y}^{2}\r\n\r\n\\end{aligned}\r\n\r\n$$\r\n\r\nTherefore, the work done against elastic force\r\n\r\n$\\mathrm{W}_{\\text {external }}=-\\mathrm{W}=\\frac{\\mathrm{K} y}{2}(2 \\mathrm{x}+\\mathrm{y})$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7ab6f5bfc7ab78ae6d8", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 2, "question": {"text": "A $3.628 \\mathrm{~kg}$ freight car moving along a horizontal rail road spur track at $7.2 \\mathrm{~km} /$ hour strikes a bumper whose coil springs experiences a maximum compression of $30 \\mathrm{~cm}$ in stopping the car. The elastic potential energy of the springs at the instant when they are compressed $15 \\mathrm{~cm}$ is", "image": null}, "options": [{"id": "SACfV", "text": "$12.1 \\times 10^{4} \\mathrm{~J}$", "isCorrect": false, "image": null}, {"id": "kW8Xa", "text": "$121 \\times 10^{4} \\mathrm{~J}$", "isCorrect": false, "image": null}, {"id": "j29wQ", "text": "$1.21 \\times 10^{4} \\mathrm{~J}$", "isCorrect": true, "image": null}, {"id": "AHPAH", "text": "$1.21 \\times 10^{6} \\mathrm{~J}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "\\(\\begin{aligned} 7.2 \\mathrm{~km} / \\mathrm{ram} &=\\frac{7.2 \\times \\frac{5}{18} \\mathrm{~m} / \\mathrm{s}}{7 / 2^{2}} \\\\ &=\\frac{72 \\times 5}{10 \\times 18}=2 \\mathrm{~m} / \\mathrm{s} \\end{aligned}\\)\r\n\r\nfirt case EC \\(\\frac{1}{2} k x^{2}=\\frac{1}{2} m v^{2}\\) \\(\\Rightarrow \\frac{1}{7} k\\left(30 \\times 10^{-2}\\right)^{2}=\\frac{1}{2} \\times 3.628 \\times(2)^{2}\\) \\(k=\\frac{4 \\times 3.628}{9 \\times 10^{-2}}\\)\r\n\r\n\\(\\begin{aligned} \\text { EC } & \\frac{1}{2} k x^{2}=\\frac{1}{2} m v^{2} \\\\ \\Rightarrow & \\frac{1}{2} k\\left(30 \\times 10^{-2}\\right)^{2}=\\frac{1}{2} \\times 3.628 \\times(2)^{2} \\\\ k &=\\frac{4 \\times 3.628}{9 \\times 10^{-2}} \\end{aligned}\\)\r\n\r\nenergy potential enrgy when conpressed at \\(15 \\mathrm{~cm}\\) \r\n\r\n\\(\\begin{aligned}\\Rightarrow & \\frac{1}{2} k\\left(15 \\times 10^{-2}\\right)^{2} \\\\=& \\frac{1}{2} \\times \\frac{4 \\times 3.628}{9 \\times 10^{-2}} \\times 225 \\times 10^{-4} \\\\=& \\frac{1639 \\times 10^{-2}}{9} \\\\=& 182.206 \\times 10^{-2} \\end{aligned}\\)\r\n\r\n\\(\\begin{aligned} &\\Rightarrow \\frac{1}{2} k\\left(15 \\times 10^{2}\\right. \\\\ &=\\frac{1}{2} \\times \\frac{\\alpha \\times 3.628}{9 \\times 10^{-2}} \\times 225 \\times 10^{-4} \\\\ &=\\frac{1639 \\times 10^{-2}}{9} \\\\ &=182.206 \\times 10^{-2} \\end{aligned}\\)", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e79b6f5bfc7ab78ae659", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 1, "question": {"text": "If the unit of force and length be each increased by four times, then the unit of energy is increased by", "image": null}, "options": [{"id": "6GUi9", "text": "16 times", "isCorrect": true, "image": null}, {"id": "Drt03", "text": "8 times", "isCorrect": false, "image": null}, {"id": "daM20", "text": "2 times", "isCorrect": false, "image": null}, {"id": "HTRnq", "text": "4 times", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Since unit of energy $=$ (unit of force). (unit of length) so if we increase unit of length and force, each by four times, then unit of energy will increase by sixteen times.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e78e6f5bfc7ab78ae5dd", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}], "question": {"text": "A massless platform is kept on a light elastic spring as shown in fig. When a sand particle of mass $0.1 \\mathrm{~kg}$ is dropped on the pan from a height of $0.24 \\mathrm{~m},$ the particle strikes the pan and spring is compressed by $0.01 \\mathrm{~m}$. From what height should the particle be dropped to cause a compression of $0.04 \\mathrm{~m}$.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/VOZwHqRlKn2xl2kyM8b4t6lL9gxkxmHNIE5NJo7QlXo.original.fullsize.png\">", "image": null}, "options": [{"id": "mHvrL", "text": "$3.96 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "2O5vr", "text": "$0.396 \\mathrm{~m}$", "image": null, "isCorrect": true}, {"id": "i8Qvn", "text": "$4 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "M2ziU", "text": "$0.4 \\mathrm{~m}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution available", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000 $U(x, y)=\\cos (x+y)$. The force acting on a particle at position given by coordinates $(0, \\pi / 4)$ is $-$", "image": null}, "options": [{"id": "FGSFO", "text": "$-\\frac{1}{\\sqrt{2}}(\\hat{\\mathrm{i}}+\\hat{\\mathrm{j}})$", "image": null, "isCorrect": false}, {"id": "ECWb7", "text": "$\\frac{1}{\\sqrt{2}}(\\hat{i}+\\hat{j})$", "image": null, "isCorrect": true}, {"id": "P8ndH", "text": "$\\left(\\frac{1}{2} \\hat{\\mathrm{i}}+\\frac{\\sqrt{3}}{2} \\hat{\\mathrm{j}}\\right)$", "image": null, "isCorrect": false}, {"id": "i5PX1", "text": "$\\left(\\frac{1}{2} \\hat{\\mathrm{i}}-\\frac{\\sqrt{3}}{2} \\hat{\\mathrm{j}}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\quad \\mathrm{F}_{\\mathrm{x}}=-\\frac{\\partial \\mathrm{U}}{\\partial \\mathrm{x}}=\\sin (\\mathrm{x}+\\mathrm{y})$\n$$\n\\begin{array}{l}\n\\mathrm{F}_{\\mathrm{y}}=-\\frac{\\partial \\mathrm{U}}{\\partial \\mathrm{x}}=\\sin (\\mathrm{x}+\\mathrm{y}) \\\\\n\\left.\\mathrm{F}_{\\mathrm{x}}=\\sin (\\mathrm{x}+\\mathrm{y})\\right]_{(0, \\pi / 4)}=\\frac{1}{\\sqrt{2}} \\\\\n\\left.\\mathrm{~F}_{\\mathrm{y}}=\\sin (\\mathrm{x}+\\mathrm{y})\\right]_{(0, \\pi / 4)}=\\frac{1}{\\sqrt{2}} \\\\\n\\therefore \\mathrm{F}=\\frac{1}{\\sqrt{2}}[\\hat{\\mathrm{i}}+\\hat{\\mathrm{j}}]\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7716f5bfc7ab78ae4e0", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "A chain of oSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
