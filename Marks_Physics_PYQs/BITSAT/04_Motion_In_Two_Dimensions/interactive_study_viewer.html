  <script>
    const data = {"index": 4, "chapterId": "61e7bd6f3bf0edf6b5de3a0b", "chapter": "Motion In Two Dimensions", "exam": "BITSAT", "subject": "Physics", "totalTopics": 3, "totalQuestions": 28, "downloadTime": "2026-10-08 20:27:45", "topics": [{"index": 1, "topicId": "64c0e8526f5bfc7ab78aecd0", "title": "Relative motion", "totalQuestions": 2, "questions": [{"_id": "64c0e7ca6f5bfc7ab78ae7eb", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 2, "question": {"text": "A $2 \\mathrm{~m}$ wide truck is moving with a uniform speed $v_{0}=8 \\mathrm{~m} / \\mathrm{s}$ along a straight horizontal road. $\\mathrm{A}$ pedestrain starts to cross the road with a uniform speed $v$ when the truck is 4 m away from him. The minimum value of $v$ so that he can cross the road safely is\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/Z3fJLaj1dg6v6X8HIQc2GSDfUqbDQP6LBa9-0HbyYFE.original.fullsize.png\">", "image": null}, "options": [{"id": "vyEBS", "text": "$2.62 \\mathrm{~m} / \\mathrm{s}$", "isCorrect": false, "image": null}, {"id": "SomKQ", "text": "$4.6 \\mathrm{~m} / \\mathrm{s}$", "isCorrect": false, "image": null}, {"id": "DL1co", "text": "$3.57 \\mathrm{~m} / \\mathrm{s}$", "isCorrect": true, "image": null}, {"id": "OPoDN", "text": "$1.414 \\mathrm{~m} / \\mathrm{s}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the man starts crossing the road at an angle $\\theta$ as shown in figure. For safe crossing the condition is that the man must cross the road by the time the truck describes the distance 4 । $A C$ or 4 । $2 \\cot \\theta$. $\\therefore \\frac{4+2 \\cot \\theta}{8}=\\frac{2 / \\sin \\theta}{v}$ or $v=\\frac{8}{2 \\sin \\theta+\\cos \\theta}$\r\n\r\nFor minimum $v, \\frac{d v}{d \\theta}=0$\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/0Fx5hXOh-RW30FnSsjhaGPlflHon3wkCwFFKFHGt6w4.original.fullsize.png\"><br>\r\n\r\nor $\\frac{-8(2 \\cos \\theta-\\sin \\theta)}{(2 \\sin \\theta+\\cos \\theta)^{2}}=0$ or $2 \\cos \\theta-$\r\n\r\n$\\sin \\theta=0$\r\n\r\nor $\\tan \\theta=2$\r\n\r\nFrom equation (i),\r\n\r\n$$\r\n\r\nv_{\\min }=\\frac{8}{2\\left(\\frac{2}{\\sqrt{5}}\\right)+\\frac{1}{\\sqrt{5}}}=\\frac{8}{\\sqrt{5}}=3.57 \\mathrm{~m} / \\mathrm{s}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e78d6f5bfc7ab78ae5d7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}], "question": {"text": "A passenger in a open car travelling at $30 \\mathrm{~m} / \\mathrm{s}$ throws a ball out over the bonnet. Relative to the car the initial velocity of the ball is $20 \\mathrm{~m} / \\mathrm{s}$ at $60^{\\circ}$ to the horizontal. The angle of projection of the ball with respect to the horizontal road will be", "image": null}, "options": [{"id": "0BA51", "text": "$\\tan ^{-1}\\left(\\frac{2}{3}\\right)$", "image": null, "isCorrect": false}, {"id": "BS78S", "text": "$\\tan ^{-1}\\left(\\frac{\\sqrt{3}}{4}\\right)$", "image": null, "isCorrect": true}, {"id": "6zPw7", "text": "$\\tan ^{-1}\\left(\\frac{4}{\\sqrt{3}}\\right)$", "image": null, "isCorrect": false}, {"id": "OThMr", "text": "$\\tan ^{-1}\\left(\\frac{3}{4}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\\begin{array}{l}\n\\left(\\overrightarrow{\\mathrm{v}}_{\\mathrm{bc}}\\right)_{\\mathrm{x}}=\\left(\\overrightarrow{\\mathrm{v}}_{\\mathrm{b}}\\right)_{\\mathrm{x}}-\\left(\\overrightarrow{\\mathrm{v}}_{\\mathrm{c}}\\right)_{\\mathrm{x}} \\\\\n20 \\cos 60^{\\circ}=\\left(\\overrightarrow{\\mathrm{v}}_{\\mathrm{b}}\\right)_{\\mathrm{x}}-30 \\\\\n\\left(\\overrightarrow{\\mathrm{v}}_{\\mathrm{b}}\\right)_{\\mathrm{x}}=40 ;\\left(\\overrightarrow{\\mathrm{v}}_{\\mathrm{bc}}\\right)_{\\mathrm{y}}=\\left(\\overrightarrow{\\mathrm{v}}_{\\mathrm{b}}\\right)_{\\mathrm{y}}-\\left(\\overrightarrow{\\mathrm{v}}_{\\mathrm{c}}\\right)_{\\mathrm{y}} \\\\\n20 \\sin 60^{\\circ}=\\left(\\overrightarrow{\\mathrm{v}}_{\\mathrm{b}}\\right)_{\\mathrm{y}}-0 \\\\\n\\left(\\overrightarrow{\\mathrm{v}}_{\\mathrm{b}}\\right)_{\\mathrm{y}}=10 \\sqrt{3} ; \\tan \\theta=\\frac{\\left(\\overrightarrow{\\mathrm{v}}_{\\mathrm{b}}\\right)_{\\mathrm{y}}}{\\left(\\overrightarrow{\\mathrm{v}}_{\\mathrm{b}}\\right)_{\\mathrm{x}}}=\\frac{10 \\sqrt{3}}{40}=\\frac{\\sqrt{3}}{4}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64c0e8516f5bfc7ab78aecce", "title": "Projectile motion", "totalQuestions": 21, "questions": [{"_id": "67726d12c49e8ef28ee2b408", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}], "question": {"text": "A projectile is projected with velocity of $40 \\mathrm{~m} / \\mathrm{s}$ at an angle $\\theta$ with the horizontal. If $R$ be the horizontal range covered by the projectile and after $t$ seconds, its inclination with horizontal becomes zero, then the value of $\\cot \\theta$ is\n[Take, $g=10 \\mathrm{~m} / \\mathrm{s}^2$ ]", "image": null}, "options": [{"id": "fn3El", "text": "$\\frac{R}{20 t^2}$", "image": null, "isCorrect": true}, {"id": "s3co2", "text": "$\\frac{R}{10 t^2}$", "image": null, "isCorrect": false}, {"id": "rkCVY", "text": "$\\frac{5 R}{t^2}$", "image": null, "isCorrect": false}, {"id": "rtr7w", "text": "$\\frac{R}{t^2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "At maximum height, inclination with horizontal becomes zero.\nTime (taken by) projectile to reach maximum height,\n$\\begin{aligned}\n \\quad t & =\\frac{u \\sin \\theta}{g} \\\\\n\\Rightarrow \\quad u & =\\frac{g t}{\\sin \\theta}\\ldots(i)\n\\end{aligned}$\nSince,\n$R=u \\cos \\theta \\times(2 t)$\n$\\begin{aligned}\n\\Rightarrow \\quad \\cos \\theta & =\\frac{R}{2 u t} \\\\\n\\Rightarrow \\quad \\cos \\theta & =\\frac{R}{2 \\cdot \\frac{g t}{\\sin \\theta} \\cdot t} \\\\\n& =\\frac{R \\sin \\theta}{2 g t^2}(Using(i))\n\\end{aligned}$\n$\\Rightarrow \\quad \\cot \\theta=\\frac{R}{2 g t^2}=\\frac{R}{2 \\times 10 t^2}=\\frac{R}{20 t^2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67726d05c49e8ef28ee2b3a2", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}], "question": {"text": "A particle of mass $m$ is projected with a velocity ' $u$ ' making an angle of $30^{\\circ}$ with the horizontal. The magnitude of angular momentum of the projectile about the point of projection when the particle is at its maximum height $h$ is:", "image": null}, "options": [{"id": "67dN1", "text": "$\\frac{\\sqrt{3}}{16} \\frac{\\mathrm{mu}^3}{\\mathrm{~g}}$", "image": null, "isCorrect": true}, {"id": "IsEeA", "text": "$\\frac{\\sqrt{3}}{2} \\frac{\\mathrm{mu}^2}{\\mathrm{~g}}$", "image": null, "isCorrect": false}, {"id": "3KfsF", "text": "$\\frac{\\mathrm{mu}^3}{\\sqrt{2} \\mathrm{~g}}$", "image": null, "isCorrect": false}, {"id": "KKjki", "text": "zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Angular momentum, $L=m v H=m u \\cos 30 H$\n$=m u \\cos 30^{\\circ} \\times \\frac{u^2 \\sin ^2 \\theta}{2 g}\\left[\\because H=\\frac{u^2 \\sin ^2 \\theta}{2 g}\\right]$\n$=\\frac{m u^3}{2 g} \\times \\frac{\\sqrt{3}}{2} \\times\\left(\\frac{1}{2}\\right)^2=\\frac{\\sqrt{3} m u^3}{16 g}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67726d04c49e8ef28ee2b39a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}], "question": {"text": "The range of the projectile projected at an angle of $15^{\\circ}$ with horizontal is 50 m . If the projectile is projected with same velocity at an angle of $45^{\\circ}$ with horizontal, then its range will be :", "image": null}, "options": [{"id": "cAgXO", "text": "50 m", "image": null, "isCorrect": false}, {"id": "qGnGs", "text": "$50 \\sqrt{2} \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "50dOE", "text": "100 m", "image": null, "isCorrect": true}, {"id": "9W9pe", "text": "$100 \\sqrt{2} \\mathrm{~m}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Range of projectile\n$R=\\frac{v^2 \\sin 2 \\theta}{g}(\\because R \\propto \\sin (2 \\theta))$\n$\\frac{R_1}{R_2}=\\frac{\\sin \\left(2 \\theta_1\\right)}{\\sin \\left(2 \\theta_2\\right)}=\\frac{\\sin (2 \\times 15)}{\\sin (2 \\times 45)}=\\frac{\\sin 30^{\\circ}}{\\sin 90^{\\circ}}$\n$\\Rightarrow \\frac{50}{\\mathrm{R}_2}=\\frac{1}{2} \\Rightarrow \\mathrm{R}_2=100 \\mathrm{~m}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67726cf7c49e8ef28ee2b332", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}], "question": {"text": "A body is thrown with a velocity of 9.8 ms making an angle of $30^{\\circ}$ with the horizontal. It will hit the ground after a time", "image": null}, "options": [{"id": "tOAZt", "text": "3.0 s", "image": null, "isCorrect": false}, {"id": "HHvH0", "text": "2.0 s", "image": null, "isCorrect": false}, {"id": "ftbNI", "text": "1.5 s", "image": null, "isCorrect": false}, {"id": "NwpRO", "text": "1 s", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Time of flight $=\\frac{2 u \\sin \\theta}{g}$\n$=\\frac{2 \\times 9.8 \\times \\sin 30^{\\circ}}{9.8}=2 \\times \\frac{1}{2}=1 \\mathrm{sec}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b87a97ae24e9e2db8cba", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}], "question": {"text": "A projectile is projected at $30^{\\circ}$ from horizontal with initial velocity $40 \\mathrm{~ms}^{-1}$. The velocity of the projectile at $\\mathrm{t}=2 \\mathrm{~s}$ from the start will be: (Given $\\mathrm{g}=10 \\mathrm{~m} / \\mathrm{s}^2$ )", "image": null}, "options": [{"id": "eKSjL", "text": "$20 \\sqrt{3} \\mathrm{~ms}^{-1}$", "image": null, "isCorrect": true}, {"id": "nA3wq", "text": "$40 \\sqrt{3} \\mathrm{~ms}^{-1}$", "image": null, "isCorrect": false}, {"id": "H9gEx", "text": "$20 \\mathrm{~ms}^{-1}$", "image": null, "isCorrect": false}, {"id": "wscdr", "text": "<br />Zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given,<br />Initial velocity of projectile, $u=40 \\mathrm{~m} / \\mathrm{s}$<br />Angle, $\\theta=30^{\\circ}$<br />Time of flight<br />$\\mathrm{T}=\\frac{2 \\mathrm{u} \\sin \\theta}{\\mathrm{g}}=\\frac{2 \\times 40 \\times 1}{10 \\times 2}=45\\left(\\because \\mathrm{g}=10 \\mathrm{~m} / \\mathrm{s}^2\\right)$<br />It means projectile is at maximum height at $t=$ $2 \\mathrm{~s}$. At maximum height vertical component of velocity is zero.<br />$\\begin{aligned}<br />& \\text { Velocity at } \\mathrm{t}=2 \\mathrm{~s}=\\mathrm{V}_{\\mathrm{x}}=\\mathrm{u} \\cos \\theta=40 \\cos 30^{\\circ} \\\\<br />& =20 \\sqrt{3} \\mathrm{~ms}^{-1} \\text {. } \\\\<br />&<br />\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e82e6f5bfc7ab78aeb48", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}], "type": "singleCorrect", "level": 2, "question": {"text": "A projectile is projected with the velocity of $(3 \\hat{\\mathbf{i}}+4 \\hat{\\mathbf{j}}) \\mathrm{m} / \\mathrm{s}$. The horizontal range of the projectile will be", "image": null}, "options": [{"id": "lpEMr", "text": "\r\n$1.2 \\mathrm{~m}$\r\n", "isCorrect": false, "image": null}, {"id": "fBwQR", "text": "\r\n$2.4 \\mathrm{~m}$\r\n", "isCorrect": true, "image": null}, {"id": "IKZpm", "text": "\r\n$3.6 \\mathrm{~m}$\r\n", "isCorrect": false, "image": null}, {"id": "3IQJf", "text": "\r\n$4.5 \\mathrm{~m}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given, $\\mathbf{v}=3 \\hat{\\mathbf{i}}+4 \\hat{\\mathbf{j}}$\r\n$$\r\n\\therefore \\quad v=|\\mathrm{v}|=\\sqrt{3^2+4^2} \\Rightarrow v=5 \\mathrm{~m} / \\mathrm{s}\r\n$$\r\nFrom figure,\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/S68DyZBu4WVIyvgm-kVZTbqOsJd6ueHWTqIkKHSEDW4.original.fullsize.png\"><br>\r\n$\\sin \\theta=\\frac{4}{5}$ and $\\cos \\theta=\\frac{3}{5}$\r\n$\\because \\quad R=\\frac{v^2 \\sin 2 \\theta}{g}$\r\n$=\\frac{v^2 \\cdot 2 \\sin \\theta \\cdot \\cos \\theta}{g}$\r\n$=\\frac{5 \\times 5 \\times 2 \\times \\frac{4}{5} \\times \\frac{3}{5}}{10}=24 \\mathrm{~m}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e81e6f5bfc7ab78aeabf", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}], "type": "singleCorrect", "level": 1, "question": {"text": "A gun fires two bullets at $60^{\\circ}$ and $30^{\\circ}$ with horizontal. The bullets strike at some horizontal distance. The ratio of maximum height for the two bullets is in the ratio of", "image": null}, "options": [{"id": "G7z1M", "text": "$2: 1$", "isCorrect": false, "image": null}, {"id": "BBZzQ", "text": "$3: 1$", "isCorrect": true, "image": null}, {"id": "imAhL", "text": "$4: 1$", "isCorrect": false, "image": null}, {"id": "w3T9S", "text": "$1: 1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The bullets are fired at the same initial speed\r\n\r\n$\\begin{array}{l}\r\n\r\n\\frac{\\mathrm{H}}{\\mathrm{H}^{\\prime}}=\\frac{\\mathrm{u}^{2} \\sin ^{2} 60^{\\circ}}{2 \\mathrm{~g}} \\times \\frac{2 \\mathrm{~g}}{\\mathrm{u}^{2} \\sin ^{2} 30^{\\circ}}=\\frac{\\sin ^{2} 60^{\\circ}}{\\sin ^{2} 30^{\\circ}} \\\\\r\n\r\n=\\frac{(\\sqrt{3} / 2)^{2}}{(1 / 2)^{2}}=\\frac{3}{1}\r\n\r\n\\end{array}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8116f5bfc7ab78aea4b", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 1, "question": {"text": "The equation of a projectile is $y=\\sqrt{3} x-\\frac{g x^{2}}{2}$ The angle of projection is given by", "image": null}, "options": [{"id": "lIG1e", "text": "$\\tan \\theta=\\frac{1}{\\sqrt{3}}$", "isCorrect": false, "image": null}, {"id": "ttpGs", "text": "$\\tan \\theta=\\sqrt{3}$", "isCorrect": true, "image": null}, {"id": "UxER8", "text": "$\\frac{\\pi}{2}$", "isCorrect": false, "image": null}, {"id": "WR5aL", "text": "zero.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Comparing the given equation with\r\n\r\n$\\mathrm{y}=\\mathrm{x} \\tan \\theta-\\frac{\\mathrm{gx}^{2}}{2 \\mathrm{u}^{2} \\cos ^{2} \\theta}, \\text { we get }$\r\n\r\n$\\tan \\theta=\\sqrt{3}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8106f5bfc7ab78aea43", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 2, "question": {"text": "A projectile A is thrown at an angle of $30^{\\circ}$ to the horizontal from point P. At the same time, another projectile $\\mathrm{B}$ is thrown with velocity $\\mathrm{v}_{2}$ upwards from the point $Q$ vertically below the highest point. For $\\mathrm{B}$ to collide with $\\mathrm{A}, \\frac{\\mathrm{v}_{2}}{\\mathrm{v}_{1}}$ should be\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/vF2xDXuYtbtwWbS7a7r-aDtGj8xqB_3Xt-aZ47JE_wU.original.fullsize.png\">", "image": null}, "options": [{"id": "n6kkK", "text": "1", "isCorrect": false, "image": null}, {"id": "wgXCW", "text": "2", "isCorrect": false, "image": null}, {"id": "Be6B8", "text": "$\\frac{1}{2}$", "isCorrect": true, "image": null}, {"id": "ersUP", "text": "4", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "This happen when vertical velocity of both are same.\r\n\r\n$\\therefore v_{2}=v_{1} \\sin 30^{\\circ} \\text { or } \\frac{v_{2}}{v_{1}}=\\frac{1}{2}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8046f5bfc7ab78ae9dd", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}], "type": "singleCorrect", "level": 1, "question": {"text": "A projectile is given an initial velocity of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mover><mi mathvariant=\"normal\">i</mi><mo>^</mo></mover><mo>+</mo><msqrt><mn>3</mn></msqrt><mo>&#160;</mo><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover></mrow></mfenced><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>,</mo></math>&nbsp;where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi mathvariant=\"normal\">i</mi><mo>^</mo></mover></math> is along the ground and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover></math> is along the vertical. Then, the equation of the path of projectile is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>[</mo></math>Take, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"\"><mrow><mi>g</mi><mo>=</mo><mn>10</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced></math>", "image": null}, "options": [{"id": "xLsOw", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><msqrt><mn>3</mn></msqrt><mi>x</mi><mo>-</mo><mn>5</mn><msup><mi>x</mi><mn>2</mn></msup></math>", "isCorrect": true, "image": null}, {"id": "FAzcv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><msqrt><mn>3</mn></msqrt><mi>x</mi><mo>+</mo><mn>5</mn><msup><mi>x</mi><mn>2</mn></msup></math>", "isCorrect": false, "image": null}, {"id": "s5mf5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><msqrt><mn>3</mn></msqrt><mi>y</mi><mo>+</mo><mn>5</mn><msup><mi>x</mi><mn>2</mn></msup></math>", "isCorrect": false, "image": null}, {"id": "6nbiQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>=</mo><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><msqrt><mn>3</mn></msqrt></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Velocity of projectile at time <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi></math>&nbsp;is given by</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mi>u</mi><mo>-</mo><mi>g</mi><mo>&#160;</mo><mi>t</mi><mo>&#160;</mo><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mover><mi mathvariant=\"normal\">i</mi><mo>^</mo></mover><mo>+</mo><msqrt><mn>3</mn></msqrt><mo>&#160;</mo><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover><mo>-</mo><mn>10</mn><mo>&#160;</mo><mi>t</mi><mover><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">j</mi></mrow><mo>^</mo></mover></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><mi>r</mi><mo>=</mo><mo>&#8747;</mo><mi>v</mi><mo>&#160;</mo><mi>d</mi><mi>t</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>&#8747;</mo><mo>&#160;</mo><mfenced><mrow><mover><mi mathvariant=\"normal\">i</mi><mo>^</mo></mover><mo>+</mo><msqrt><mn>3</mn></msqrt><mo>&#160;</mo><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover><mo>-</mo><mn>10</mn><mo>&#160;</mo><mi>t</mi><mo>&#160;</mo><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover></mrow></mfenced><mo>&#160;</mo><mi>d</mi><mi>t</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>t</mi><mo>&#160;</mo><mover><mi mathvariant=\"normal\">i</mi><mo>^</mo></mover><mo>+</mo><msqrt><mn>3</mn></msqrt><mo>&#160;</mo><mi>t</mi><mo>&#160;</mo><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover><mo>-</mo><mn>10</mn><mfrac><msup><mi>t</mi><mn>2</mn></msup><mn>2</mn></mfrac><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>t</mi><mo>&#160;</mo><mover><mi mathvariant=\"normal\">i</mi><mo>^</mo></mover><mo>+</mo><msqrt><mn>3</mn></msqrt><mo>&#160;</mo><mi>t</mi><mo>&#160;</mo><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover><mo>-</mo><mn>5</mn><mo>&#160;</mo><msup><mi>t</mi><mn>2</mn></msup><mo>&#160;</mo><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><mi>t</mi><mo>&#160;</mo><mover><mi mathvariant=\"normal\">i</mi><mo>^</mo></mover><mo>+</mo><mfenced><mrow><msqrt><mn>3</mn></msqrt><mo>&#160;</mo><mi>t</mi><mo>-</mo><mn>5</mn><mo>&#160;</mo><msup><mi>t</mi><mn>2</mn></msup></mrow></mfenced><mo>&#160;</mo><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover></math></p><p>or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>&#160;</mo><mover><mi mathvariant=\"normal\">i</mi><mo>^</mo></mover><mo>+</mo><mi>y</mi><mo>&#160;</mo><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover><mo>=</mo><mi>t</mi><mo>&#160;</mo><mover><mi mathvariant=\"normal\">i</mi><mo>^</mo></mover><mo>+</mo><mfenced><mrow><msqrt><mn>3</mn></msqrt><mo>&#160;</mo><mi>t</mi><mo>-</mo><mn>5</mn><mo>&#160;</mo><msup><mi>t</mi><mn>2</mn></msup></mrow></mfenced><mo>&#160;</mo><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover></math></p><p>On comparing, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mi>t</mi></math>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; ...(i)</p><p>and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><msqrt><mn>3</mn></msqrt><mo>&#160;</mo><mi>t</mi><mo>-</mo><mn>5</mn><mo>&#160;</mo><msup><mi>t</mi><mn>2</mn></msup></math>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; ...(ii)</p><p>From Eqs (i) and (ii), we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><msqrt><mn>3</mn></msqrt><mo>&#160;</mo><mi>x</mi><mo>-</mo><mn>5</mn><mo>&#160;</mo><msup><mi>x</mi><mn>2</mn></msup></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7e66f5bfc7ab78ae8d6", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}], "type": "singleCorrect", "level": 3, "question": {"text": "The horizontal range and maximum height attained by a projectile are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>H</mi></math> respectively. If a constant horizontal acceleration <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mfrac><mi>g</mi><mn>4</mn></mfrac></math> is imparted to the projectile due to wind, then its horizontal range and maximum height will be&nbsp;", "image": null}, "options": [{"id": "xxWbm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>R</mi><mo>+</mo><mi>H</mi></mrow></mfenced><mo>,</mo><mfrac><mi>H</mi><mn>2</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "fgIZU", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>R</mi><mo>+</mo><mfrac><mi>H</mi><mn>2</mn></mfrac></mrow></mfenced><mo>,</mo><mn>2</mn><mi>H</mi></math>", "isCorrect": false, "image": null}, {"id": "EjrML", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>R</mi><mo>+</mo><mn>2</mn><mi>H</mi></mrow></mfenced><mo>,</mo><mi>H</mi></math>", "isCorrect": false, "image": null}, {"id": "y8CCN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>R</mi><mo>+</mo><mi>H</mi></mrow></mfenced><mo>,</mo><mi>H</mi></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mfrac><mrow><mn>2</mn><msub><mi>U</mi><mi>y</mi></msub></mrow><mi>g</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>H</mi><mo>=</mo><mfrac><msubsup><mi>U</mi><mi>y</mi><mn>2</mn></msubsup><mrow><mn>2</mn><mi>g</mi></mrow></mfrac></math></p><p>Here maximum height will be same as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>H</mi></math>&nbsp;because there is no acceleration change in vertical direction.</p><p>and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><msub><mi>U</mi><mi>x</mi></msub><mo>&#215;</mo><mi>T</mi></math></p><p>When a horizontal acceleration is also given to the projectile <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>U</mi><mi>y</mi></msub><mo>,</mo><mi>T</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>H</mi></math> will remain&nbsp;unchanged while range will become</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>R</mi><mo>&#39;</mo></msup><mo>=</mo><msub><mi>U</mi><mi>x</mi></msub><mo>&#215;</mo><mi>T</mi><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>a</mi><msup><mi>T</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>R</mi><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfrac><mi>g</mi><mn>4</mn></mfrac><mfenced><mfrac><mrow><mn>4</mn><msubsup><mi>U</mi><mi>y</mi><mn>2</mn></msubsup></mrow><msup><mi>g</mi><mn>2</mn></msup></mfrac></mfenced><mo>=</mo><mi>R</mi><mo>+</mo><mi>H</mi><mo>&#160;&#160;</mo><mfenced open=\"[\" close=\"]\"><mrow><mo>&#8757;</mo><mi>a</mi><mo>=</mo><mfrac><mi>g</mi><mn>4</mn></mfrac></mrow></mfenced></math></p><p>Therefore horizontal range &amp; maximum height will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>R</mi><mo>+</mo><mi>H</mi></mrow></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mi>H</mi></math>.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7e56f5bfc7ab78ae8c9", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}], "type": "singleCorrect", "level": 1, "question": {"text": "At what angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi></math> to the horizontal should an object is projected so that the maximum height reached is equal to the horizontal range?", "image": null}, "options": [{"id": "RFSzH", "text": "<span style=\"color:null;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>tan</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced><mn>2</mn></mfenced></math></span>", "isCorrect": false, "image": null}, {"id": "F9szO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>tan</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced><mn>4</mn></mfenced></math>", "isCorrect": true, "image": null}, {"id": "kCJwX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>tan</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>(</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><mo>)</mo></math>", "isCorrect": false, "image": null}, {"id": "WS4no", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>tan</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced><mn>3</mn></mfenced></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Given, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>H</mi><mo>=</mo><mi>R</mi></math></p><p>or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msup><mi>u</mi><mn>2</mn></msup><msup><mi>sin</mi><mn>2</mn></msup><mi>&#952;</mi></mrow><mrow><mn>2</mn><mi>g</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><msup><mi>u</mi><mn>2</mn></msup><mi>sin</mi><mn>2</mn><mi>&#952;</mi></mrow><mi>g</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>sin</mi><mfenced><mi>&#952;</mi></mfenced><mo>&#215;</mo><mi>sin</mi><mfenced><mi>&#952;</mi></mfenced></mrow><mn>2</mn></mfrac><mo>=</mo><mn>2</mn><mi>sin</mi><mfenced><mi>&#952;</mi></mfenced><mo>&#215;</mo><mi>cos</mi><mfenced><mi>&#952;</mi></mfenced></math></p><p>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>tan</mi><mi>&#952;</mi><mo>=</mo><mn>4</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>&#952;</mi><mo>=</mo><msup><mi>tan</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced><mn>4</mn></mfenced></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7d96f5bfc7ab78ae860", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 1, "question": {"text": "A stone projected with a velocity a at an angle $\\theta$ with the horizontal reaches maximum height $\\mathrm{H}_{1}$. When it is projected with velocity u at an angle $\\left(\\frac{\\pi}{2}-\\theta\\right)$ with the horizontal, it reaches maximum height $\\mathrm{H}_{2}$. The relation between the horizontal range $\\mathrm{R}$ of the projectile, heights $\\mathrm{H}_{1}$ and $\\mathrm{H}_{2}$ is", "image": null}, "options": [{"id": "nNqRo", "text": "$\\mathrm{R}=4 \\sqrt{\\mathrm{H}_{1} \\mathrm{H}_{2}}$", "isCorrect": true, "image": null}, {"id": "1kEQJ", "text": "$\\mathrm{R}=4\\left(\\mathrm{H}_{1}-\\mathrm{H}_{2}\\right)$", "isCorrect": false, "image": null}, {"id": "L5Qx9", "text": "$\\mathrm{R}=4\\left(\\mathrm{H}_{1}+\\mathrm{H}_{2}\\right)$", "isCorrect": false, "image": null}, {"id": "Igh53", "text": "$\\mathrm{R}=\\frac{\\mathrm{H}_{1}^{2}}{\\mathrm{H}_{2}^{2}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{H}_{1}=\\frac{\\mathrm{u}^{2} \\sin ^{2} \\theta}{2 \\mathrm{~g}} \\\\ \\text { and } \\mathrm{H}_{2}=\\frac{\\mathrm{u}^{2} \\sin ^{2}\\left(90^{\\circ}-\\theta\\right)}{2 \\mathrm{~g}}=\\frac{\\mathrm{u}^{2} \\cos ^{2} \\theta}{2 \\mathrm{~g}} \\\\ \\mathrm{H}_{1} \\mathrm{H}_{2}=& \\frac{u^{2} \\sin ^{2} \\theta}{2 \\mathrm{~g}} \\times \\frac{u^{2} \\cos ^{2} \\theta}{2 \\mathrm{~g}}=\\frac{\\left(u^{2} \\sin 2 \\theta\\right)^{2}}{16 g^{2}}=\\frac{R^{2}}{16} \\\\ \\therefore R=4 \\sqrt{H_{1} H_{2}} \\end{aligned}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7ca6f5bfc7ab78ae7ea", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 2, "question": {"text": "A particle of mass $2 \\mathrm{~m}$ is projected at an angle of $45^{\\circ}$ with the horizontal with a velocity of $20 \\sqrt{2} \\mathrm{~m} / \\mathrm{s}$. After $1 \\mathrm{~s}$, explosion takes place and the particle is broken into two equal pieces. As a result of explosion, one part comes to rest. The maximum height from the ground attained by the other part is", "image": null}, "options": [{"id": "ZVMnj", "text": "$50 \\mathrm{~m}$", "isCorrect": false, "image": null}, {"id": "PXPiL", "text": "$25 \\mathrm{~m}$", "isCorrect": false, "image": null}, {"id": "pc4su", "text": "$40 \\mathrm{~m}$", "isCorrect": false, "image": null}, {"id": "zGzMK", "text": "$35 \\mathrm{~m}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given : Initial velocity $u_{0}=20 \\sqrt{2} \\mathrm{~m} / \\mathrm{s} ;$ angle of projection $\\theta=45^{\\circ}$\r\n\r\nTherefore horizontal and vertical components of initial velocity are $\\mathrm{u}_{\\mathrm{x}}=20 \\sqrt{2} \\cos 45^{\\circ}=20 \\mathrm{~m} / \\mathrm{s}$\r\n\r\nand $\\mathrm{u}_{\\mathrm{y}}=20 \\sqrt{2} \\sin 45^{\\circ}=20 \\mathrm{~m} / \\mathrm{s}$\r\n\r\nAfter $1 \\mathrm{~s}$, horizontal component remains unchanged while the vertical component becomes $v_{y}=u_{y}-g t$\r\n\r\nDue to explosion, one part comes to rest. Hence, from the conservation of linear momentum, vertical component of second\r\n\r\npart will become $v_{y}^{\\prime}=20 m / s$ Therefore, maximum height attained by the second part will be $\\mathrm{H}=\\mathrm{h}_{1}+\\mathrm{h}_{2}$\r\n\r\nUsing, $\\mathrm{h}=\\mathrm{ut}+\\frac{1}{2} \\mathrm{at}^{2}$\r\n\r\n$\\Rightarrow \\mathrm{h}_{1}=(20 \\times 1)-\\frac{1}{2} \\times 10 \\times(1)^{2}=15 \\mathrm{~m}$\r\n\r\n$\\mathrm{a}=\\mathrm{g}=10 \\mathrm{~m} / \\mathrm{s}^{2}$\r\n\r\n$\\mathrm{h}_{2}=\\frac{\\mathrm{v}_{\\mathrm{y}}^{\\prime 2}}{2 \\mathrm{~g}}=\\frac{(20)^{2}}{2 \\times 10}=20 \\mathrm{~m}$\r\n\r\n$\\mathrm{H}=20+15=35 \\mathrm{~m}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7c96f5bfc7ab78ae7e0", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 2, "question": {"text": "The position of a projectile launched from the origin at $t=0$ is given by $\\vec{r}=(40 \\hat{i}+50 \\hat{j}) \\mathrm{m}$ at $t=$ $2 \\mathrm{~s}$. If the projectile was launched at an angle $\\theta$ from the horizontal, then $\\theta$ is $\\left(\\right.$ take $\\left.g=10 \\mathrm{~ms}^{-2}\\right)$\\", "image": null}, "options": [{"id": "qcIXG", "text": "$\\tan ^{-1} \\frac{2}{3}$", "isCorrect": false, "image": null}, {"id": "znw8y", "text": "$\\tan ^{-1} \\frac{3}{2}$", "isCorrect": false, "image": null}, {"id": "ugj8g", "text": "$\\tan ^{-1} \\frac{7}{4}$", "isCorrect": true, "image": null}, {"id": "RURbE", "text": "$\\tan ^{-1} \\frac{4}{5}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "From question, Horizontal velocity (initial),\r\n\r\n$$\r\n\r\nu_{x}=\\frac{40}{2}=20 \\mathrm{~m} / \\mathrm{s}\r\n\r\n$$\r\n\r\nVertical velocity (initial), $50=u_{y} t+\\frac{1}{2} g t^{2}$\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n\\Rightarrow u_{y} \\times 2+\\frac{1}{2}(-10) \\times 4 \\\\\r\n\r\n\\text { or, } \\quad 50=2 u_{y}-20\r\n\r\n\\end{array}\r\n\r\n$$\r\n\r\nor, $u_{y}=\\frac{70}{2}=35 \\mathrm{~m} / \\mathrm{s}$\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n\\therefore \\quad \\tan \\theta=\\frac{u_{y}}{u_{x}}=\\frac{35}{20}=\\frac{7}{4} \\\\\r\n\r\n\\Rightarrow \\quad \\text { Angle } \\theta=\\tan ^{-1} \\frac{7}{4}\r\n\r\n\\end{array}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7b96f5bfc7ab78ae750", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 1, "question": {"text": "A projectile is fired with a velocity u making an angle $\\theta$ with the horizontal. What is the magnitude of change in velocity when it is at the highest point -", "image": null}, "options": [{"id": "kARL8", "text": "$u \\cos \\theta$", "isCorrect": false, "image": null}, {"id": "3kcrl", "text": "$\\mathrm{u}$", "isCorrect": false, "image": null}, {"id": "uSKth", "text": "$\\mathrm{u} \\sin \\theta$", "isCorrect": true, "image": null}, {"id": "zm9w3", "text": "$\\mathrm{u} \\cos \\theta-\\mathrm{u}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Initially $\\mathrm{u}=\\cos \\theta \\hat{\\mathrm{i}}+\\mathrm{u} \\sin \\theta \\hat{\\mathrm{j}}$.\r\n\r\nAt highest point $\\mathrm{v}=\\mathrm{u} \\cos \\theta \\hat{\\mathrm{i}}$\r\n\r\n$\\therefore$ difference is $\\mathrm{u} \\sin \\theta$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7aa6f5bfc7ab78ae6d4", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 1, "question": {"text": "A body is projected, making an acute angle with the horizontal. If angle between velocity $\\vec{v}$ and acceleration $\\overrightarrow{\\mathrm{g}}$ is $\\theta,$ then", "image": null}, "options": [{"id": "mHyWN", "text": "$\\theta=90^{\\circ}$", "isCorrect": false, "image": null}, {"id": "GhMvw", "text": "$\\quad \\theta=0^{\\circ}$", "isCorrect": false, "image": null}, {"id": "sJqV4", "text": "$90^{\\circ}<\\theta<0^{\\circ}$", "isCorrect": false, "image": null}, {"id": "eK20N", "text": "$0^{\\circ}<\\theta<180^{\\circ}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Here velocity is acting upwards when projectile is going upwards and acceleration is downwards. The angle $\\theta$ between $\\overrightarrow{\\mathrm{v}}$ and $\\overrightarrow{\\text { a }}$ is more than $0^{\\circ}$ and less than $180^{\\circ}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e79e6f5bfc7ab78ae66e", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 1, "question": {"text": "The range of the particle when launched at an angle of $15^{\\circ}$ with the horizontal is $1.5 \\mathrm{~km}$. What is the range of the projectile when launched at an angle of $45^{\\circ}$ to the horizontal.", "image": null}, "options": [{"id": "jQ187", "text": "$1.5 \\mathrm{~km}$", "isCorrect": false, "image": null}, {"id": "lN4sC", "text": "$3.0 \\mathrm{~km}$", "isCorrect": true, "image": null}, {"id": "i1JQS", "text": "$6.0 \\mathrm{~km}$", "isCorrect": false, "image": null}, {"id": "2huSw", "text": "$0.75 \\mathrm{~km}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$1.5=\\frac{\\mathrm{u}^{2} \\sin 30}{\\mathrm{~g}} ; \\mathrm{R}=\\frac{\\mathrm{u}^{2} \\sin 90}{\\mathrm{~g}}=3 \\mathrm{~km}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e79b6f5bfc7ab78ae656", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 2, "question": {"text": "A projectile can have the same range $\\mathrm{R}$ for two angles of projection. If $t_{1}$ and $t_{2}$ be the times of flight in two cases, then what is the product of two times of flight?", "image": null}, "options": [{"id": "dpGpV", "text": "$\\mathrm{t}_{1} \\mathrm{t}_{2} \\propto \\mathrm{R}$", "isCorrect": true, "image": null}, {"id": "XS2he", "text": "$\\mathrm{t}_{1} \\mathrm{t}_{2} \\propto \\mathrm{R}^{2}$", "isCorrect": false, "image": null}, {"id": "MzIrf", "text": "$\\mathrm{t}_{1} \\mathrm{t}_{2} \\propto \\mathrm{l} / \\mathrm{R}$", "isCorrect": false, "image": null}, {"id": "mPbSL", "text": "$\\mathrm{t}_{1} \\mathrm{t}_{2} \\propto 1 / \\mathrm{R}^{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\mathrm{t}_{1}=\\frac{2 \\mathrm{u} \\sin \\theta}{\\mathrm{g}}$ and\r\n$\\mathrm{t}_{2}=\\frac{2 \\mathrm{u} \\sin (90-\\theta)}{\\mathrm{g}}=\\frac{2 \\mathrm{u} \\cos \\theta}{\\mathrm{g}}$\r\n$\\begin{aligned} \\therefore \\mathrm{t}_{1} \\mathrm{t}_{2} &=\\frac{4 \\mathrm{u}^{2} \\cos \\theta \\sin \\theta}{\\mathrm{g}^{2}}=\\frac{2}{\\mathrm{~g}}\\left[\\frac{\\mathrm{u}^{2} \\sin 2 \\theta}{\\mathrm{g}}\\right] \\\\ &=\\frac{2}{\\mathrm{~g}} \\mathrm{R}, \\end{aligned}$\r\nwhere $\\mathrm{R}$ is the range. \r\nHence $t_{1} t_{2} \\propto R$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e77f6f5bfc7ab78ae55c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}], "question": {"text": "Two projectiles $\\mathrm{A}$ and $\\mathrm{B}$ are thrown with the same speed but angles are $40^{\\circ}$ and $50^{\\circ}$ with the horizontal. Then", "image": null}, "options": [{"id": "RTC9x", "text": "A will fall earlier", "image": null, "isCorrect": true}, {"id": "RjLHe", "text": "$\\mathrm{B}$ will fall earlier", "image": null, "isCorrect": false}, {"id": "mBn51", "text": "both will fall at the same time", "image": null, "isCorrect": false}, {"id": "A2Cwv", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{T}=\\frac{2 \\mathrm{u} \\sin \\theta}{\\mathrm{g}},$ lesser is the value of $\\theta$, lesser is $\\sin \\theta$ and hence lesser will be the time taken. Hence A will fall earlier.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7716f5bfc7ab78ae4de", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "A projectile projected at an angle $30^{\\circ}$ from the horizontal has a range $\\mathrm{R}$. If the angle of projection at the same initial velocity be $60^{\\circ}$, then the range will be-", "image": null}, "options": [{"id": "pTkC6", "text": "$\\mathrm{R}$", "image": null, "isCorrect": true}, {"id": "MpEo6", "text": "$\\mathrm{R} / 2$", "image": null, "isCorrect": false}, {"id": "aRyU6", "text": "$2 \\mathrm{R}$", "image": null, "isCorrect": false}, {"id": "BFIpv", "text": "$\\mathrm{R}^{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If sum of angle of projection $=90^{\\circ}$ for given speed then range for that angle of projection is same.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64c0e8516f5bfc7ab78aeccf", "title": "Uniform Circular Motion", "totalQuestions": 5, "questions": [{"_id": "67726d13c49e8ef28ee2b40c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}], "question": {"text": "A rigid body rotates about a fixed axis with variable angular velocity equal to $\\alpha-\\beta t$, at the time $t$, where $\\alpha, \\beta$ are constants. The angle through which it rotates before it stops is", "image": null}, "options": [{"id": "Fg09K", "text": "$\\frac{\\alpha^2}{2 \\beta}$", "image": null, "isCorrect": true}, {"id": "h74tA", "text": "$\\frac{\\alpha^2-\\beta^2}{2 \\alpha}$", "image": null, "isCorrect": false}, {"id": "Ln7Hx", "text": "$\\frac{\\alpha^2-\\beta^2}{2 \\beta}$", "image": null, "isCorrect": false}, {"id": "tIifZ", "text": "$\\frac{(\\alpha-\\beta) \\alpha}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\omega=\\alpha-\\beta t$. Comparing with $\\omega=\\omega_0-\\alpha t$\nInitial angular velocity $=\\alpha$\nAngular'retardation $=\\beta$\n$\\therefore$ Angle rotated before it stops is $\\frac{\\alpha^2}{2 \\beta}$. [using\n$\\left.\\omega^2=\\omega_0^2+2 \\beta \\theta\\right]$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8126f5bfc7ab78aea5a", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 2, "question": {"text": "A wheel is rotating at $900 \\mathrm{r}$.p.m. about its axis. When power is cut offit comes to rest in 1 minute. The angular retardation in $\\mathrm{rad} / \\mathrm{s}^{2}$ is", "image": null}, "options": [{"id": "XaCTI", "text": "$\\pi / 2$", "isCorrect": true, "image": null}, {"id": "mqzmq", "text": "$\\pi / 4$", "isCorrect": false, "image": null}, {"id": "ItAEr", "text": "$\\pi / 6$", "isCorrect": false, "image": null}, {"id": "JGTKp", "text": "$\\pi / 8$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Angular retardation,\r\n\r\n$\\begin{aligned} \\alpha &=\\frac{\\omega_{2}-\\omega_{1}}{t}=\\frac{2 \\pi\\left(\\mathrm{n}_{2}-\\mathrm{n}_{1}\\right)}{\\mathrm{t}} \\\\ &=\\frac{2 \\pi(0-900 / 60)}{60}=\\frac{\\pi}{2} \\mathrm{rad} / \\mathrm{s}^{2} \\end{aligned}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7aa6f5bfc7ab78ae6d1", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 2, "question": {"text": "The velocity and acceleration vectors of a particle undergoing circular motion are $\\overrightarrow{\\mathrm{v}}=2 \\hat{\\mathrm{i}} \\mathrm{m} / \\mathrm{s}$ and $\\overrightarrow{\\mathrm{a}}=2 \\hat{\\mathrm{i}}+4 \\hat{\\mathrm{j}} \\mathrm{m} / \\mathrm{s}^{2}$ respectively at an instant of time. The radius of the circle is -", "image": null}, "options": [{"id": "1s2RA", "text": "$1 \\mathrm{~m}$", "isCorrect": true, "image": null}, {"id": "PimPg", "text": "$2 \\mathrm{~m}$", "isCorrect": false, "image": null}, {"id": "QYcPE", "text": "$3 \\mathrm{~m}$", "isCorrect": false, "image": null}, {"id": "7PQx5", "text": "$4 \\mathrm{~m}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "It can be observed that component of acceleration perpendicular to velocity is $\\mathrm{a}=4 \\mathrm{~m} / \\mathrm{s}^{2}$\r\n\r\n$$\r\n\r\n\\therefore \\text { radius }=\\frac{\\mathrm{v}^{2}}{\\mathrm{a}_{\\mathrm{c}}}=\\frac{(2)^{2}}{4}=1 \\text { metre }\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e79c6f5bfc7ab78ae65c", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 1, "question": {"text": "A wheel of radius $\\mathrm{R}$ rolls on the ground with a uniform velocity $\\mathrm{v}$. The relative acceleration of topmost point of the wheel with respect to the bottom most point is\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/onXV_CBaeBCQKk1QE6yt9n2V7mRxvHV2Dara3e1cO9c.original.fullsize.png\">", "image": null}, "options": [{"id": "of7CX", "text": "$\\frac{\\mathrm{v}^{2}}{\\mathrm{R}}$", "isCorrect": false, "image": null}, {"id": "o11jl", "text": "$\\frac{2 \\mathrm{v}^{2}}{\\mathrm{R}}$", "isCorrect": true, "image": null}, {"id": "7nbu1", "text": "$\\frac{\\mathrm{v}^{2}}{2 \\mathrm{R}}$", "isCorrect": false, "image": null}, {"id": "dySlC", "text": "$\\frac{4 \\mathrm{v}^{2}}{\\mathrm{R}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "As $a_{\\mathrm{CM}}=0 \\quad\\left[\\mathrm{v}_{\\mathrm{CM}}=\\right.$ constant $]$, Tangential acceleration of each point $\\left|\\overrightarrow{\\mathrm{a}}_{\\mathrm{AB}}\\right|=\\frac{2 \\mathrm{v}^{2}}{\\mathrm{R}}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e77f6f5bfc7ab78ae55d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}], "question": {"text": "A body is travelling in a circle at a constant speed. It", "image": null}, "options": [{"id": "fzl9r", "text": "has a constant velocity", "image": null, "isCorrect": false}, {"id": "BZ9Ud", "text": "is not accelerated", "image": null, "isCorrect": false}, {"id": "rAhBT", "text": "has an inward radial acceleration", "image": null, "isCorrect": true}, {"id": "LNIvT", "text": "has an outward radial acceleration", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Body moves with constant speed it means that tangential acceleration $\\mathrm{a}_{\\mathrm{T}}=0 \\& \\mathrm{conly}$ centripetal acceleration $\\mathrm{a}_{\\mathrm{C}}$ exists whose direction is always towards the centre or inward (along the radius of the circle).", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
