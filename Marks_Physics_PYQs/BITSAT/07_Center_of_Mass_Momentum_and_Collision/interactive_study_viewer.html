null}, {"_id": "64c0e8136f5bfc7ab78aea5e", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 3, "question": {"text": "A nucleus splits into two nuclear parts which have their velocity ratio equal to $2: 1 .$ What will be the ratio of their nuclear radius?", "image": null}, "options": [{"id": "IcTJ6", "text": "$2^{1 / 3}: 1$", "isCorrect": false, "image": null}, {"id": "lFHsO", "text": "$1: 2^{1 / 3}$", "isCorrect": true, "image": null}, {"id": "2PYJU", "text": "$3^{1 / 2}: 1$", "isCorrect": false, "image": null}, {"id": "oaGNZ", "text": "$1: 3^{1 / 2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "As momentum is conserved, therefore\r\n\r\n$\\frac{\\mathrm{m}_{1}}{\\mathrm{~m}_{2}}=\\frac{\\mathrm{A}_{1}}{\\mathrm{~A}_{2}}=\\frac{\\mathrm{v}_{2}}{\\mathrm{v}_{1}}=\\frac{1}{2}$\r\n\r\n$\\therefore \\frac{\\mathrm{R}_{1}}{\\mathrm{R}_{2}}=\\left(\\frac{\\mathrm{A}_{1}}{\\mathrm{~A}_{2}}\\right)^{1 / 3}=\\left(\\frac{1}{2}\\right)^{1 / 3}=1: 2^{1 / 3}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7b96f5bfc7ab78ae74e", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 1, "question": {"text": "A rifle man, who together with his rifle has a mass of $100 \\mathrm{~kg}$, stands on a smooth surface and fires 10 shots horizontally. Each bullet has a mass $10 \\mathrm{~g}$ and a muzzle velocity of $800 \\mathrm{~ms}^{-1}$. The velocity which the rifle man attains after firing 10 shots is", "image": null}, "options": [{"id": "U431d", "text": "$8 \\mathrm{~ms}^{-1}$", "isCorrect": false, "image": null}, {"id": "Xvvno", "text": "$0.8 \\mathrm{~ms}^{-1}$", "isCorrect": true, "image": null}, {"id": "5Vgrw", "text": "$0.08 \\mathrm{~ms}^{-1}$", "isCorrect": false, "image": null}, {"id": "63L1D", "text": "$-0.8 \\mathrm{~ms}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to law of conservation of momentum,\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n100 \\mathrm{v}=-\\frac{10}{1000} \\times 10 \\times 800 \\\\\r\n\r\n\\text { i.e., } \\mathrm{v}=0.8 \\mathrm{~ms}^{-1}\r\n\r\n\\end{array}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e79b6f5bfc7ab78ae658", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 2, "question": {"text": "A man of mass $100 \\mathrm{~kg}$. is standing on a platform of mass $200 \\mathrm{~kg}$. which is kept on a smooth ice surface. If the man starts moving on the platform with a speed $30 \\mathrm{~m} / \\mathrm{sec}$ relative to the platform then calculate with what velocity relative to the ice the platform will recoil?", "image": null}, "options": [{"id": "KfbOw", "text": "$5 \\mathrm{~m} / \\mathrm{sec}$", "isCorrect": false, "image": null}, {"id": "AAU10", "text": "$10 \\mathrm{~m} / \\mathrm{sec}$", "isCorrect": true, "image": null}, {"id": "IuFvy", "text": "$15 \\mathrm{~m} / \\mathrm{sec}$", "isCorrect": false, "image": null}, {"id": "pSnvF", "text": "$20 \\mathrm{~m} / \\mathrm{sec}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Consider the situation shown in figure.Suppose the man moves at a speed w towards right and the the platform recoils at a speed \\(\\mathrm{V}\\) towards left, both relative to the ice. Hence, the speed of the man relative to the platform is\r\n\\(\\mathrm{V}+\\mathrm{w}\\). By the question,\r\n\\(\\mathrm{V}+\\mathrm{w}=\\mathrm{v}\\), or \\(\\mathrm{w}=\\mathrm{v}-\\mathrm{V} \\ldots\\) (i)\r\nTaking the platform and the man to be the system, there is no external horizontal force on the system. The linear momentum of the system remains constant. Initially both the man and the platform were at rest. Thus,\r\n\\(0=\\mathrm{MV}-\\underset{m v}{\\operatorname{mor}} \\mathrm{MV}=\\mathrm{m}(\\mathrm{v}-\\mathrm{V})[\\mathrm{Using}(\\mathrm{i})]\\)\r\nor, \\(V=\\frac{m v}{M+m}\\)\r\nHence, the velocity relative to the ice is \\(V=\\frac{m v}{M+m}\\).", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e77f6f5bfc7ab78ae55f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}], "question": {"text": "A spring is compressed between two toy carts of mass $\\mathrm{m}_{1}$ and $\\mathrm{m}_{2}$. When the toy carts are released, the springs exert equal and opposite average forces for the same time on each toy cart. If $v_{1}$ and $\\mathrm{v}_{2}$ are the velocities of the toy carts and there is no friction between the toy carts and the ground, then :", "image": null}, "options": [{"id": "NmuxR", "text": "$\\mathrm{v}_{1} / \\mathrm{v}_{2}=\\mathrm{m}_{1} / \\mathrm{m}_{2}$", "image": null, "isCorrect": false}, {"id": "ejPo6", "text": "$\\mathrm{v}_{1} / \\mathrm{v}_{2}=\\mathrm{m}_{2} / \\mathrm{m}_{1}$", "image": null, "isCorrect": false}, {"id": "5EABh", "text": "$\\mathrm{v}_{1} / \\mathrm{v}_{2}=-\\mathrm{m}_{2} / \\mathrm{m}_{1}$", "image": null, "isCorrect": true}, {"id": "Ejo4n", "text": "$\\mathrm{v}_{1} / \\mathrm{v}_{2}=-\\mathrm{m}_{1} / \\mathrm{m}_{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Applying law of conservation of linear momentum\n$\\mathrm{m}_{1} \\mathrm{v}_{1}+\\mathrm{m}_{2} \\mathrm{v}_{2}=0$\n$\\frac{\\mathrm{m}_{1}}{\\mathrm{~m}_{2}}=-\\frac{\\mathrm{v}_{2}}{\\mathrm{v}_{1}}$ or $\\frac{\\mathrm{v}_{1}}{\\mathrm{v}_{2}}=-\\frac{\\mathrm{m}_{2}}{\\mathrm{~m}_{1}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64c0e8536f5bfc7ab78aecdb", "title": "Centre of mass of discrete particles", "totalQuestions": 3, "questions": [{"_id": "67726d06c49e8ef28ee2b3ac", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}], "question": {"text": "Two bodies of mass 1 kg and 3 kg have position vectors $\\hat{i}+2 \\hat{j}+k$ and $-3 \\hat{i}-2 \\hat{j}+\\hat{k}$ respectively. The magnitude of position vector of centre of mass of this system will be similar to the magnitude of vector :", "image": null}, "options": [{"id": "4HsGL", "text": "$\\hat{\\mathrm{i}}-2 \\hat{\\mathrm{j}}+\\hat{\\mathrm{k}}$", "image": null, "isCorrect": true}, {"id": "8yfzk", "text": "$-3 \\hat{i}-2 \\hat{j}+\\hat{k}$", "image": null, "isCorrect": false}, {"id": "ZSuvz", "text": "$-2 \\hat{i}+2 \\hat{k}$", "image": null, "isCorrect": false}, {"id": "xR2PH", "text": "$-2 \\hat{i}-\\hat{j}+2 \\hat{k}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Position of COM of a mass - system is given as,\n$\\vec{r}_{\\mathrm{com}}=\\frac{m_1 \\vec{r}_1+m_2 \\vec{r}_2}{m_1+m_2}=\\frac{1(\\hat{i}+2 \\hat{j}+\\hat{k})+3(-3 \\hat{i}-2 \\hat{j}+\\hat{k}}{1+3}$\n$=-2 \\hat{i}-\\hat{j}+\\hat{k}$\n$\\left|\\vec{r}_{c m}\\right|=|-2 \\hat{i}-\\hat{j}+\\hat{k}|=\\sqrt{(2)^2+(1)^2+(1)^2}=\\sqrt{6}$\nOnly option (1) magnitude is\n$\\sqrt{1^2+(-2)^2+1^2}=\\sqrt{6}$\nSo option (1) is correct.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7f36f5bfc7ab78ae948", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}], "type": "singleCorrect", "level": 3, "question": {"text": "An object of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#160;</mo><mi>kg</mi></math> is projected with a velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> at an angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>&#176;</mo></math>, to the horizontal. At the highest point of its path, the projectile explodes and breaks up into two fragments of masses <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi>kg</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#160;</mo><mi>kg</mi><mo>.</mo></math> The fragments separate horizontally after the explosion, which releases internal energy such that the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi><mi>E</mi></math> of the system af the highest point is doubled. The separation between the two fragments when they reach the ground is", "image": null}, "options": [{"id": "oezFr", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>52</mn><mo>.</mo><mn>25</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math>", "isCorrect": false, "image": null}, {"id": "CB7Qy", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>44</mn><mo>.</mo><mn>25</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math>", "isCorrect": true, "image": null}, {"id": "yGoj6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>65</mn><mo>.</mo><mn>32</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math>", "isCorrect": false, "image": null}, {"id": "gpbqQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>78</mn><mo>.</mo><mn>76</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Given, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>=</mo><mn>5</mn><mo>&#160;</mo><mi>kg</mi><mo>,</mo><mi>v</mi><mo>=</mo><mn>20</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>,</mo><mi>&#952;</mi><mo>=</mo><mn>60</mn><mo>&#176;</mo></math></p><p>Vertical component of velocity, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>y</mi></msub><mo>=</mo><mi>v</mi><mo>&#160;</mo><mi>sin</mi><mo>&#160;</mo><mn>60</mn><mo>&#176;</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>20</mn><mo>&#215;</mo><mfrac><msqrt><mn>3</mn></msqrt><mn>2</mn></mfrac><mo>=</mo><mn>10</mn><msqrt><mn>3</mn></msqrt><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p><p>Time taken to reach the highest point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo></math> Time taken to reach the ground from highest point.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mfrac><mrow><mi>v</mi><mo>&#160;</mo><mi>sin</mi><mo>&#160;</mo><mi>&#952;</mi></mrow><mi>g</mi></mfrac><mo>=</mo><mfrac><msub><mi>v</mi><mi>y</mi></msub><mi>g</mi></mfrac><mo>=</mo><mfrac><mrow><mn>10</mn><msqrt><mn>3</mn></msqrt></mrow><mrow><mn>9</mn><mo>.</mo><mn>8</mn></mrow></mfrac><mo>=</mo><mn>1</mn><mo>.</mo><mn>77</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math></p><p>At the highest point, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> splits up into two parts of masses <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mn>1</mn></msub><mo>=</mo><mn>1</mn><mo>&#160;</mo><mi>kg</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mn>2</mn></msub><mo>=</mo><mn>4</mn><mo>&#160;</mo><mi>kg</mi></math></p><p>If their velocities are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>2</mn></msub></math> respectively, then applying the principle of conservation of linear momentum, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mn>1</mn></msub><msub><mi>v</mi><mn>1</mn></msub><mo>+</mo><msub><mi>m</mi><mn>2</mn></msub><msub><mi>v</mi><mn>2</mn></msub><mo>=</mo><mi>m</mi><mi>v</mi><mo>&#160;</mo><mi>cos</mi><mo>&#160;</mo><mi>&#952;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>1</mn></msub><mo>+</mo><mn>4</mn><msub><mi>v</mi><mn>2</mn></msub><mo>=</mo><mn>5</mn><mo>&#215;</mo><mn>20</mn><mo>&#215;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#160;&#160;</mo><mfenced open=\"[\" close=\"]\"><mrow><mo>&#8757;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>&#952;</mi><mo>=</mo><mn>60</mn><mo>&#176;</mo></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>1</mn></msub><mo>+</mo><mn>4</mn><msub><mi>v</mi><mn>2</mn></msub><mo>=</mo><mn>5</mn><mo>&#215;</mo><mn>10</mn><mo>=</mo><mn>50</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi mathvariant=\"normal\">i</mi></mfenced></math></p><p>Initial <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi><mi>E</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#160;</mo><mi>m</mi><mo>&#160;</mo><msup><mfenced><mrow><mi>v</mi><mo>&#160;</mo><mi>cos</mi><mo>&#160;</mo><mi>&#952;</mi></mrow></mfenced><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mn>5</mn><mo>&#215;</mo><msup><mfenced><mn>10</mn></mfenced><mn>2</mn></msup><mo>=</mo><mn>250</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p><p>Final <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi><mi>E</mi><mo>=</mo><mn>2</mn></math>&nbsp;(initial <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi><mi>E</mi></math>)<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mo>&#215;</mo><mn>250</mn><mo>=</mo><mn>500</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msub><mi>m</mi><mn>1</mn></msub><msubsup><mi>v</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msub><mi>m</mi><mn>2</mn></msub><msubsup><mi>v</mi><mn>2</mn><mn>2</mn></msubsup><mo>=</mo><mn>500</mn></math></p><p>or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;&#160;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mn>1</mn><mo>&#215;</mo><msubsup><mi>v</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mn>4</mn><mo>&#215;</mo><msubsup><mi>v</mi><mn>2</mn><mn>2</mn></msubsup><mo>=</mo><mn>500</mn></math></p><p>or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;&#160;</mo><msubsup><mi>v</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><mn>4</mn><msubsup><mi>v</mi><mn>2</mn><mn>2</mn></msubsup><mo>=</mo><mn>1000</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi>ii</mi></mfenced></math></p><p>Solving Eq. (i) and (ii), we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>1</mn></msub><mo>=</mo><mn>30</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>,</mo><mo>&#160;</mo><msub><mi>v</mi><mn>2</mn></msub><mo>=</mo><mn>5</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p><p>Hence, the separation between the two fragments</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced><mrow><msub><mi>v</mi><mn>1</mn></msub><mo>-</mo><msub><mi>v</mi><mn>2</mn></msub></mrow></mfenced><mo>&#215;</mo><mi>t</mi><mo>=</mo><mfenced><mrow><mn>30</mn><mo>-</mo><mn>5</mn></mrow></mfenced><mo>&#215;</mo><mn>1</mn><mo>.</mo><mn>77</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>=</mo><mn>44</mn><mo>.</mo><mn>25</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7806f5bfc7ab78ae563", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}], "question": {"text": "A system consists of three particles, each of mass $\\mathrm{m}$ and located at (1,1),(2,2) and (3,3) . The co-ordinates of the centre of mass are", "image": null}, "options": [{"id": "0llp2", "text": "(1,1)", "image": null, "isCorrect": false}, {"id": "ZcHKo", "text": "(2,2)", "image": null, "isCorrect": true}, {"id": "jlnX0", "text": "(3,3)", "image": null, "isCorrect": false}, {"id": "0EzYi", "text": "(6,6)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The coordinates of C.M of three particle are\n\\begin{array}{c}\n\\mathrm{x}=\\frac{\\mathrm{m}_{1} \\mathrm{x}_{1}+\\mathrm{m}_{2} \\mathrm{x}_{2}+\\mathrm{m}_{3} \\mathrm{x}_{3}}{\\mathrm{~m}_{1}+\\mathrm{m}_{2}+\\mathrm{m}_{3}} \\& \\mathrm{y}=\\frac{\\mathrm{m}_{1} \\mathrm{y}_{1}+\\mathrm{m}_{2} \\mathrm{y}_{2}+\\mathrm{m}_{3} \\mathrm{y}_{3}}{\\mathrm{~m}_{1}+\\mathrm{m}_{2}+\\mathrm{m}_{3}} \\\\\n\\text { here } \\mathrm{m}_{1}=\\mathrm{m}_{2}=\\mathrm{m}_{3}=\\mathrm{m} \\\\\n\\text { so } \\mathrm{x}=\\frac{\\left(\\mathrm{x}_{1}+\\mathrm{x}_{2}+\\mathrm{x}_{3}\\right) \\mathrm{m}}{\\mathrm{m}+\\mathrm{m}+\\mathrm{m}}=2\n\\end{array}\n$$\ny=\\frac{\\left(y_{1}+y_{2}+y_{3}\\right) m}{m+m+m}=2\n$$\nso coordinates of $\\mathrm{C} . \\mathrm{M}$. of three particle are (2,2)\n$\\mathrm{V}=300 \\mathrm{~m} / \\mathrm{s}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64c0e8536f5bfc7ab78aecdd", "title": "Centre of mass of continuous mass distribution", "totalQuestions": 1, "questions": [{"_id": "64c0e8206f5bfc7ab78aeace", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}], "type": "singleCorrect", "level": 2, "question": {"text": "Three bricks each of length $L$ and mass $M$ are arranged as shown from the wall. The distance of the centre of mass of the system from the wall is\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/qMdxJfwjUdkLzDUsPKM0YdQXmw-xVZisZyfqigQuYY8.original.fullsize.png\">", "image": null}, "options": [{"id": "heQHE", "text": "$\\frac{\\mathrm{L}}{4}$", "isCorrect": false, "image": null}, {"id": "q50F0", "text": "$\\frac{\\mathrm{L}}{2}$", "isCorrect": false, "image": null}, {"id": "6ps87", "text": "$\\left(\\frac{3}{2}\\right) \\mathrm{L}$", "isCorrect": false, "image": null}, {"id": "QecjQ", "text": "$\\left(\\frac{11}{12}\\right) \\mathrm{L}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/u7DJxTmuY-PRriQ_WqzP3NpTSxNbz31Yer_aINc-e1s.original.fullsize.png\"><br>\r\n\r\n$x_{1}=\\frac{\\mathrm{L}}{2}, x_{2}=\\mathrm{L}, x_{3}=\\frac{5 \\mathrm{~L}}{4}$\r\n\r\n$\\therefore x_{\\mathrm{CM}}=\\frac{m_{1} x_{1}+m_{2} x_{2}+m_{3} x_{3}}{m_{1}+m_{2}+m_{3}}$\r\n\r\n$=\\frac{\\mathrm{M} \\times \\frac{\\mathrm{L}}{2}+\\mathrm{M} \\times \\mathrm{L}+\\mathrm{M} \\times \\frac{5 \\mathrm{~L}}{4}}{\\mathrm{M}+\\mathrm{M}+\\mathrm{M}}=\\frac{11 \\mathrm{~L}}{12}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "64c0e8536f5bfc7ab78aecdc", "title": "Impulse", "totalQuestions": 1, "questions": [{"_id": "64c0e7f66f5bfc7ab78ae963", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}], "type": "singleCorrect", "level": 2, "question": {"text": "A trolley having mass of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>&#160;</mo><mi>kg</mi></math> moves with uniform speed of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>36</mn><mo>&#160;</mo><msup><mi>kmh</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> on a frictionless track. A child of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&#160;</mo><mi>kg</mi></math> runs on the trolley from one end to the other (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math> away)&nbsp;&nbsp;with a speed of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> relative to the trolley in a direction opposite to its inotion and ultimately jumps out of the trolley. With how much velocity has the trolley moved from the time the child begins to run?", "image": null}, "options": [{"id": "RV2Il", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>.</mo><mn>36</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "isCorrect": true, "image": null}, {"id": "vBKhX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>11</mn><mo>.</mo><mn>36</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "isCorrect": false, "image": null}, {"id": "j0Nsc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>.</mo><mn>36</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "isCorrect": false, "image": null}, {"id": "fpQEi", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>14</mn><mo>.</mo><mn>40</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>since, no external force is acting on the system, we can apply conservation of linear momentum.</p><p>Speed of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>&#160;</mo><mi>kg</mi></math> trolley <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>36</mn><mo>&#215;</mo><mn>1000</mn></mrow><mrow><mn>60</mn><mo>&#215;</mo><mn>60</mn></mrow></mfrac><mo>=</mo><mn>10</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p><p>If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>u</mi></math> be the initial velocity of trolley, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>b</mi></msub></math> be the absolute velocity of the boy after the beginning of journey of the boy, their relative velocity is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>.</p><p>So, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>v</mi><mo>&#39;</mo></msup><mo>-</mo><msub><mi>v</mi><mi>b</mi></msub><mo>=</mo><mn>4</mn><mo>&#8658;</mo><msub><mi>v</mi><mi>b</mi></msub><mo>=</mo><mfenced><mrow><msup><mi>v</mi><mo>&#39;</mo></msup><mo>-</mo><mn>4</mn></mrow></mfenced></math></p><p>Now, applying law of conservation of momentum,</p><p>Momentum before the boy begins tu run<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo></math> Momentum after the beginning of boy&#39;s running</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;&#160;</mo><mn>220</mn><mo>&#215;</mo><mn>10</mn><mo>=</mo><mn>200</mn><msup><mi>v</mi><mo>&#39;</mo></msup><mo>+</mo><mn>20</mn><mfenced><mrow><msup><mi>v</mi><mo>&#39;</mo></msup><mo>-</mo><mn>4</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2200</mn><mo>=</mo><mn>220</mn><msup><mi>v</mi><mo>&#39;</mo></msup><mo>-</mo><mn>80</mn><mo>&#8658;</mo><mn>220</mn><msup><mi>v</mi><mo>&#39;</mo></msup><mo>=</mo><mn>2280</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>v</mi><mo>'</mo></msup><mo>=</mo><mfrac><mn>2280</mn><mn>220</mn></mfrac><mo>=</mo><mn>10</mn><mo>.</mo><mn>36</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "64c0e8526f5bfc7ab78aecd9", "title": "Collisions", "totalQuestions": 5, "questions": [{"_id": "67726d13c49e8ef28ee2b410", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}], "question": {"text": "A ball falling freely from a height of $4.9 \\mathrm{~m} / \\mathrm{s}$, hits a horizontal surface. If $e=\\frac{3}{4}$, then the ball will hit the surface, second time after", "image": null}, "options": [{"id": "QqjTf", "text": "1.0 s", "image": null, "isCorrect": false}, {"id": "JwWZJ", "text": "1.5 s", "image": null, "isCorrect": true}, {"id": "W91BP", "text": "2.0 s", "image": null, "isCorrect": false}, {"id": "iE8c5", "text": "3.0 s", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n\\text {Velocity on hitting the surface } & =\\sqrt{2 \\times 9.8 \\times 4.9} \\\\\n& =9.8 \\mathrm{~m} / \\mathrm{s}\n\\end{aligned}$\nVelocity after first bounce, $v=\\frac{3}{4} \\times 9.8$\nTime taken from first bounce to the second bounce\n$=\\frac{2 v}{g}=2 \\times \\frac{3}{4} \\times 9.8 \\times \\frac{1}{9.8}=1.5 \\mathrm{~s}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b87197ae24e9e2db8c63", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}], "question": {"text": "A particle of mass $m$ moving with velocity $v$ collides with a stationary particle of mass $2 \\mathrm{~m}$. After collision, they stick together and continue to move together with velocity", "image": null}, "options": [{"id": "BbZXS", "text": "$\\mathrm{v}$", "image": null, "isCorrect": false}, {"id": "Aj3lR", "text": "$\\frac{\\mathrm{v}}{2}$", "image": null, "isCorrect": false}, {"id": "GraJD", "text": "$\\frac{\\mathrm{v}}{3}$", "image": null, "isCorrect": true}, {"id": "fI2Ee", "text": "$\\frac{v}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/SbGKuYro4oi5MfE5YaI3FNs5wpXRnpmNdsMqjZHtRo0.original.fullsize.png\"><br><br />Applying conservation of linear momentum<br />$\\Rightarrow \\overrightarrow{\\mathrm{P}}_{\\mathrm{i}}=\\overrightarrow{\\mathrm{P}}_{\\mathrm{f}}(\\because \\mathrm{P}=\\mathrm{mv})$<br />$m v_1+2 m v_2=(m+2 m) v^{\\prime}$<br />$m v^1+2 m \\times 0=(3 m) v^{\\prime}$<br />$\\Rightarrow \\mathrm{mv}=3 \\mathrm{mv}^{\\prime} \\Rightarrow \\mathrm{v}^{\\prime}=\\frac{\\mathrm{v}}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7da6f5bfc7ab78ae866", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 2, "question": {"text": "Consider elastic collision of a particle of mass m moving with a velocity u with another particle of the same mass at rest. After the collision the projectile and the struck particle move in directions making angles $\\theta_{1}$ and $\\theta_{2}$ respectively with the initial direction of motion. The sum of the angles $\\theta_{1}+\\theta_{2},$ is :", "image": null}, "options": [{"id": "57EnF", "text": "$45^{\\circ}$", "isCorrect": false, "image": null}, {"id": "HXYCA", "text": "$90^{\\circ}$", "isCorrect": true, "image": null}, {"id": "Igwj2", "text": "$135^{\\circ}$", "isCorrect": false, "image": null}, {"id": "B210e", "text": "$180^{\\circ}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "No Solution", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7cb6f5bfc7ab78ae7ec", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 3, "question": {"text": "A neutron moving with speed v makes a head on collision with a hydrogen atom in ground state kept at rest. The minimum kinetic energy of the neutron for which inelastic collision takes place is", "image": null}, "options": [{"id": "idODP", "text": "$10.2 \\mathrm{eV}$", "isCorrect": false, "image": null}, {"id": "7cDKg", "text": "$20.4 \\mathrm{eV}$", "isCorrect": true, "image": null}, {"id": "lKiqU", "text": "$12.1 \\mathrm{eV}$", "isCorrect": false, "image": null}, {"id": "fskWq", "text": "$16.8 \\mathrm{eV}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let speed of neutron before collision $=\\mathrm{V}$ Speed of neutron after collision $=\\mathrm{V}_{1}$ Speed of proton or hydrogen atom after collision $=\\mathrm{V}_{2}$ Energy of excitation $=\\Delta \\mathrm{E}$ From the law of conservation of linear momentum, $\\mathrm{mv}=\\mathrm{mv}_{1}+\\mathrm{mv}_{2}$\r\n\r\nAnd for law of conservation of energy,\r\n\r\n$$\r\n\r\n\\frac{1}{2} \\mathrm{mv}^{2}=\\frac{1}{2} \\mathrm{mv}_{1}^{2}+\\frac{1}{2} \\mathrm{mv}_{2}^{2}\r\n\r\n$$\r\n\r\nFrom squaring eq. (i), we get\r\n\r\n$$\r\n\r\nv^{2}=v_{1}^{2}+v_{2}^{2}+2 v_{1} v_{2}\r\n\r\n$$\r\n\r\nFrom squaring eq. (ii), we get\r\n\r\n$$\r\n\r\nv^{2}=v_{1}^{2}+v_{2}^{2}+\\frac{2 \\Delta E}{m}\r\n\r\n$$\r\n\r\nFrom eqn (3) \\& (4)\r\n\r\n$$\r\n\r\n\\begin{aligned}\r\n\r\n\\therefore 2 \\mathrm{v}_{1} \\mathrm{v}_{2} &=\\frac{2 \\Delta \\mathrm{E}}{\\mathrm{m}} \\\\\r\n\r\n\\therefore\\left(\\mathrm{v}_{1}-\\mathrm{v}_{2}\\right)^{2} &=\\left(\\mathrm{v}_{1}+\\mathrm{v}_{2}\\right)^{2}-4 \\mathrm{v}_{1} \\mathrm{v}_{2}=\\mathrm{v}^{2}-\\frac{4 \\Delta \\mathrm{E}}{\\mathrm{m}}\r\n\r\n\\end{aligned}\r\n\r\n$$\r\n\r\nAs, $v_{1}-v_{2}$ must be real, $v^{2}-\\frac{4 \\Delta E}{m} \\geq 0$\r\n\r\n$$\r\n\r\n\\Rightarrow \\quad \\frac{1}{2} \\mathrm{mv}^{2} \\geq 2 \\Delta \\mathrm{E}\r\n\r\n$$\r\n\r\nThe minimum energy that can be absorbed by the hydrogen atom in the ground state to go into the excited state is $10.2 \\mathrm{eV}$. Therefore, the maximum kinetic energy needed is\r\n\r\n$$\r\n\r\n\\frac{1}{2} m v_{\\min }^{2}=2 \\times 10.2=20.4 \\mathrm{eV}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7716f5bfc7ab78ae4e1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "A particle of mass $10 \\mathrm{~kg}$ moving eastwards with a speed $5 \\mathrm{~ms}^{-1}$ collides with another particle of the same mass moving north-wards with the same speed $5 \\mathrm{~ms}^{-1}$. The two particles coalesce on collision. The new particle of mass $20 \\mathrm{~kg}$ will move in the north-east direction with velocity", "image": null}, "options": [{"id": "uQfZg", "text": "$10 \\mathrm{~ms}^{-1}$", "image": null, "isCorrect": false}, {"id": "dwQhP", "text": "$5 \\mathrm{~ms}^{-1}$", "image": null, "isCorrect": false}, {"id": "XoU8X", "text": "$\\quad(5 / \\sqrt{2}) \\mathrm{ms}^{-1}$", "image": null, "isCorrect": true}, {"id": "OKppB", "text": "none of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here $\\hat{i} m v+\\hat{j} m v=2 m \\vec{V}$\nThat is $\\overrightarrow{\\mathrm{V}}=\\frac{\\mathrm{v}}{2}(\\hat{\\mathrm{i}}+\\hat{\\mathrm{j}})$\nHence $V=\\frac{v}{2} \\times \\sqrt{2}=\\frac{v}{\\sqrt{2}} \\cdot\\left[\\right.$ Here $\\left.v=5 \\mathrm{~ms}^{-1}\\right]$\n$$\n\\text { So, } V=\\frac{5}{\\sqrt{2}} \\mathrm{~ms}^{-1}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
