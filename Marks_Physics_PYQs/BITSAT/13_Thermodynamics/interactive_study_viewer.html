    const data = {"index": 13, "chapterId": "61e7bd707d70b66ab213f490", "chapter": "Thermodynamics", "exam": "BITSAT", "subject": "Physics", "totalTopics": 4, "totalQuestions": 32, "downloadTime": "2026-10-08 20:27:52", "topics": [{"index": 1, "topicId": "64c0e8566f5bfc7ab78aed00", "title": "Thermodynamic Systems", "totalQuestions": 3, "questions": [{"_id": "67726cf9c49e8ef28ee2b345", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}], "question": {"text": "On celcius scale the temperature of body increases by $40^{\\circ} \\mathrm{C}$. The increase in temperature on Fahrenheit scale is:", "image": null}, "options": [{"id": "nP5JS", "text": "$70^{\\circ} \\mathrm{F}$", "image": null, "isCorrect": false}, {"id": "xjq8L", "text": "$68^{\\circ} \\mathrm{F}$", "image": null, "isCorrect": false}, {"id": "ODUCl", "text": "$72^{\\circ} \\mathrm{F}$", "image": null, "isCorrect": true}, {"id": "dOcmr", "text": "$75^{\\circ} \\mathrm{F}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since $\\frac{F-32}{9}=\\frac{C}{5}$\n$\\Rightarrow \\Delta \\mathrm{C}=\\frac{5}{9} \\Delta \\mathrm{~F}$\n$\\Rightarrow 40=\\frac{5}{9} \\Delta \\mathrm{~F} \\Rightarrow \\Delta \\mathrm{~F}=72^{\\circ} \\mathrm{F}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8216f5bfc7ab78aeade", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}], "type": "singleCorrect", "level": 2, "question": {"text": "The compressibility of water is $4 \\times 10^{-5}$ per unit atmospheric pressure. The decrease in volume of $100 \\mathrm{~cm}^{3}$ of water under a pressure of 100 atmosphere will be", "image": null}, "options": [{"id": "3TMLR", "text": "$0.4 \\mathrm{~cm}^{3}$", "isCorrect": true, "image": null}, {"id": "NedUF", "text": "$4 \\times 10^{-5} \\mathrm{~cm}^{3}$", "isCorrect": false, "image": null}, {"id": "SkROf", "text": "$0.025 \\mathrm{~cm}^{3}$", "isCorrect": false, "image": null}, {"id": "mthBb", "text": "$0.004 \\mathrm{~cm}^{3}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Compressibility $=\\frac{1}{\\mathrm{~B}}=\\frac{\\Delta \\mathrm{V} / \\mathrm{V}}{\\mathrm{P}}$.\r\n\r\nHere, $\\mathrm{P}=100 \\mathrm{~atm}$\r\n\r\nCompressibility $=4 \\times 10^{-5}$ and $\\mathrm{V}=100 \\mathrm{~cm}^{3}$\r\n\r\nHence, $\\Delta \\mathrm{V}=0.4 \\mathrm{~cm}^{3}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e79c6f5bfc7ab78ae661", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 3, "question": {"text": "A solid body of constant heat capacity $1 \\mathrm{~J} /{ }^{\\circ} \\mathrm{C}$ is being heated by keeping it in contact with reservoirs in two ways:\r\n(i) Sequentially keeping in contact with 2 reservoirs such that each reservoir supplies same amount of heat.\r\n(ii) Sequentially keeping in contact with 8 reservoirs such that each reservoir supplies same amount of heat. \r\nIn both the cases body is brought from initial temperature $100^{\\circ} \\mathrm{C}$ to final temperature $200^{\\circ} \\mathrm{C}$. Entropy change of the body in the two cases respectively is:", "image": null}, "options": [{"id": "TrAzz", "text": "$\\ln 2,2 \\ln 2$", "isCorrect": false, "image": null}, {"id": "1jnVh", "text": "$2 \\ln 2,8 \\ln 2$", "isCorrect": false, "image": null}, {"id": "VTNMH", "text": "$\\ln 2,4 \\ln 2$", "isCorrect": false, "image": null}, {"id": "noC8X", "text": "$\\ln 2, \\ln 2$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The entropy change of the body in the two cases is same as entropy is a state function.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64c0e8556f5bfc7ab78aecfd", "title": "First Law of Thermodynamics", "totalQuestions": 6, "questions": [{"_id": "67726d03c49e8ef28ee2b395", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}], "question": {"text": "A gas can be taken from A to B via two different processes $A C B$ and $A D B$. When path $A C B$ is used 60 J of heat flows into the system and 30J of work is done by the system. If path ADB is used work done by the system is 10 J . The heat Flow into the system in path ADB is :\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/BTgnsQiDXhMQKUjqaE8rwJ3EgYJiO9S8_MGxWHRyZVw.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "JA5dP", "text": "40 J", "image": null, "isCorrect": true}, {"id": "HxSSE", "text": "80 J", "image": null, "isCorrect": false}, {"id": "8hNpD", "text": "100 J", "image": null, "isCorrect": false}, {"id": "82eK2", "text": "20 J", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\triangle \\mathrm{U}$ remains same for both paths ACB and ADB\n$\\Delta Q_{A C B}=\\Delta W_{A C B}+\\Delta U_{A C B}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/cfGnB_R9pifjj0rf8sfOj_3iHZgf3N86v-T3w80prTw.original.fullsize.png\"/>\n$\\Rightarrow 60 \\mathrm{~J}=30 \\mathrm{~J}+\\Delta \\mathrm{U}_{\\mathrm{ACB}} \\Rightarrow \\mathrm{U}_{\\mathrm{ACB}}=30 \\mathrm{~J}$\nAs change in internal energy depends only on initial and final point\n$\\therefore \\Delta \\mathrm{U}_{\\mathrm{ADB}}=\\Delta \\mathrm{U}_{\\mathrm{ACB}}=30 \\mathrm{~J}$\n$\\Delta \\mathrm{Q}_{\\mathrm{ADB}}=\\Delta \\mathrm{U}_{\\mathrm{ADB}}+\\Delta \\mathrm{W}_{\\mathrm{ADB}}=10 \\mathrm{~J}+30 \\mathrm{~J}=40 \\mathrm{~J}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67726cf7c49e8ef28ee2b337", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}], "question": {"text": "A source supplies heat to a system at the rate of 1000 W . If the system performs work at a rate of 200 W . The rate at which internal energy of the system increases", "image": null}, "options": [{"id": "lMOPH", "text": "1200 W", "image": null, "isCorrect": false}, {"id": "C3Ll4", "text": "600 W", "image": null, "isCorrect": false}, {"id": "ANZlT", "text": "500 W", "image": null, "isCorrect": false}, {"id": "SXNE5", "text": "800 W", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given,\nRate of heat supplied, $\\frac{\\mathrm{dQ}}{\\mathrm{dt}}=1000 \\mathrm{~W}$\nRate of work performed, $\\frac{\\mathrm{dw}}{\\mathrm{dt}}=200 \\mathrm{~W}$\nUsing first law of thermodynamics\n$d Q=d U+d w$\n\\(\\Rightarrow \\frac{\\mathrm{dU}}{\\mathrm{dt}}=\\frac{\\mathrm{dQ}}{\\mathrm{dt}}-\\frac{\\mathrm{dw}}{\\mathrm{dt}} \\Rightarrow \\frac{\\mathrm{dU}}{\\mathrm{dt}}=1000-200=800\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7ba6f5bfc7ab78ae75a", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 1, "question": {"text": "In a thermodynamic process, the pressure of a fixed mass of a gas is changed in such a manner that the gas releases $20 \\mathrm{~J}$ of heat and $8 \\mathrm{~J}$ of work is done on the gas. If the initial internal energy of the gas was $30 \\mathrm{~J}$, then the final internal energy will be", "image": null}, "options": [{"id": "vT3J6", "text": "$2 \\mathrm{~J}$", "isCorrect": false, "image": null}, {"id": "bpqac", "text": "$42 \\mathrm{~J}$", "isCorrect": false, "image": null}, {"id": "i6c4V", "text": "$18 \\mathrm{~J}$", "isCorrect": true, "image": null}, {"id": "Cs7Sh", "text": "$58 \\mathrm{~J}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $\\Delta \\mathrm{Q}=-20 \\mathrm{~J}, \\mathrm{~W}=-8 \\mathrm{~J}$\r\n\r\nUsing Ist law $\\Delta \\mathrm{Q}=\\Delta \\mathrm{U}+\\Delta \\mathrm{W}$\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n\\Rightarrow \\Delta Q=-20+8=-12 \\mathrm{~J} \\\\\r\n\r\n\\mathrm{Uf}=-12+30=18 \\mathrm{~J}\r\n\r\n\\end{array}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7ac6f5bfc7ab78ae6e2", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 1, "question": {"text": "A thermodynamical system is changed from state $\\left(\\mathrm{P}_{1}, \\mathrm{~V}_{1}\\right)$ to $\\left(\\mathrm{P}_{2}, \\mathrm{~V}_{2}\\right)$ by two different process, the quantity which will remain same will be", "image": null}, "options": [{"id": "YDRMA", "text": "$\\Delta \\mathrm{Q}$", "isCorrect": false, "image": null}, {"id": "G3AFE", "text": "$\\Delta \\mathrm{W}$", "isCorrect": false, "image": null}, {"id": "kEuPG", "text": "$\\Delta \\mathrm{Q}+\\Delta \\mathrm{W}$", "isCorrect": false, "image": null}, {"id": "ExhF6", "text": "$\\Delta \\mathrm{Q}-\\Delta \\mathrm{W}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For all process $\\Delta \\mathrm{U}=\\Delta \\mathrm{Q}-\\Delta \\mathrm{W}$\r\n\r\ndoes not change as it depends on initial final states.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e79c6f5bfc7ab78ae662", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 1, "question": {"text": "Which of the following process is possible according to the first law of thermodynamics?", "image": null}, "options": [{"id": "fJbyI", "text": "$\\mathrm{W}>0, \\mathrm{Q}<0$ and $\\mathrm{dU}=0$", "isCorrect": false, "image": null}, {"id": "dgVkc", "text": "$\\mathrm{W}>0, \\mathrm{Q}<0$ and $\\mathrm{dU}>0$", "isCorrect": false, "image": null}, {"id": "N4wzh", "text": "$\\quad \\mathrm{W}>0, \\mathrm{Q}<0$ and $\\mathrm{dU}<0$", "isCorrect": true, "image": null}, {"id": "TkozK", "text": "$\\mathrm{W}<0, \\mathrm{Q}>0$ and $\\mathrm{dU}<0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Correct answer is (c) \\(W > 0, Q < 0\\) and \\(d U < 0\\)", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7726f5bfc7ab78ae4e9", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "A sample of gas expands from volume $\\mathrm{V}_{1}$ to $\\mathrm{V}_{2}$. The amount of work done by the gas is greatest when the expansion is", "image": null}, "options": [{"id": "aeRSf", "text": "isothermal", "image": null, "isCorrect": true}, {"id": "1tRqX", "text": "isobaric", "image": null, "isCorrect": false}, {"id": "rxA3c", "text": "adiabatic", "image": null, "isCorrect": false}, {"id": "QFJb0", "text": "equal in all cases", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution available", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64c0e8566f5bfc7ab78aecfe", "title": "Thermodynamic Processes", "totalQuestions": 20, "questions": [{"_id": "67726d10c49e8ef28ee2b3fa", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}], "question": {"text": "In the given cycle $A B C D A$, the heat required for an ideal monoatomic gas will be\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/Cis1pidkMZJI1eQWoa0vIHk3Vz8_TvySvBnwCR-HfWc.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "mzTpY", "text": "$p_0 V_0$", "image": null, "isCorrect": false}, {"id": "KoqiX", "text": "$\\frac{13}{2} p_0 V_0$", "image": null, "isCorrect": true}, {"id": "2Lof2", "text": "$\\frac{11}{2} p_0 V_0$", "image": null, "isCorrect": false}, {"id": "WdfTJ", "text": "$4 p_0 V_0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In the given cycle, heat is supplied in process $D$ to $A$ at constant volume and in process $A$ to $B$ at constant pressure.\n$\\therefore$ Heat supplied, $Q=n C_V(\\Delta T)_{D A}+n C_p(\\Delta T)_{A B}$\nFor an ideal monoatomic gas,\n$\\begin{aligned}\nC_V & =\\frac{3}{2} R \\text { and } C_p=\\frac{5}{2} R \\\\\n\\Rightarrow \\quad Q & =\\frac{3}{2} n R \\Delta T+\\frac{5}{2} n R \\Delta T \\quad[\\because n R \\Delta T=p \\Delta V] \\\\\n& =\\frac{3}{2}\\left(p_0 V_0\\right)+5\\left(p_0 V_0\\right) \\\\\n& =\\frac{13}{2} p_0 V_0\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b87b97ae24e9e2db8cc9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}], "question": {"text": "A hypothetical gas expands adiabatically such that its volume changes from 08 litres to 27 litres. If the ratio of final pressure of the gas to initial pressure of the gas is $\\frac{16}{81}$. Then the ratio of $\\frac{\\mathrm{C}_{\\mathrm{P}}}{\\mathrm{C}_{\\mathrm{V}}}$ will be.", "image": null}, "options": [{"id": "Vdxtg", "text": "$\\frac{4}{3}$", "image": null, "isCorrect": true}, {"id": "FSkFS", "text": "$\\frac{3}{1}$", "image": null, "isCorrect": false}, {"id": "3WLdf", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "1zL1z", "text": "$\\frac{3}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In adiabatic process<br />$\\begin{aligned}<br />& \\mathrm{PV}^\\gamma=\\text { constant } \\\\<br />& \\Rightarrow \\quad \\mathrm{P}_1 \\mathrm{~V}_1^\\gamma=\\mathrm{P}_2 \\mathrm{~V}_2^\\gamma \\\\<br />& \\Rightarrow \\quad \\frac{\\mathrm{P}_1}{\\mathrm{P}_2}=\\left(\\frac{\\mathrm{V}_2}{\\mathrm{~V}_1}\\right)^\\gamma \\Rightarrow \\frac{81}{16}=\\left(\\frac{27}{8}\\right)^\\gamma \\\\<br />& \\Rightarrow\\left(\\frac{9}{4}\\right)^2=\\left(\\frac{9 \\times 3}{4 \\times 2}\\right)^\\gamma \\Rightarrow\\left(\\frac{9}{4}\\right)^{2-\\gamma}=\\left(\\frac{3}{2}\\right)^\\gamma \\\\<br />& \\Rightarrow\\left(\\frac{9}{4}\\right)^{2-\\gamma}=\\left(\\frac{9}{4}\\right)^{\\gamma / 2} \\Rightarrow 2-\\gamma=\\frac{\\gamma}{2} \\\\<br />& \\Rightarrow 2=\\frac{3}{2} \\gamma \\Rightarrow \\gamma=\\frac{4}{3}<br />\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b87097ae24e9e2db8c5b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}], "question": {"text": "A thermodynamic system is taken through cyclic process. The total work done in the process is :<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/r_k-pTakueAeath94qEiCmm7MqVo46295nTfgzwVCcw.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "ES1Sb", "text": "$100 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "AkX8u", "text": "$300 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "yjcBc", "text": "Zero", "image": null, "isCorrect": false}, {"id": "uSBLy", "text": "$200 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Work done $=$ Area under the curve<br />$\\Rightarrow \\mathrm{W}=\\frac{1}{2} \\times(4-2) \\times(400-100)=\\frac{1}{2}(2) \\times 300$<br />$\\mathrm{W}=300 \\mathrm{~J}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8216f5bfc7ab78aead7", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}], "type": "singleCorrect", "level": 2, "question": {"text": "An ideal gas at atmospheric pressure is adiabatically compressed so that its density becomes 32 times of its initial value. If the final pressure of gas is 128 atmospheres, the value of ' $\\gamma$ ' of the gas is :", "image": null}, "options": [{"id": "0eqr6", "text": "$1.5$", "isCorrect": false, "image": null}, {"id": "QYbtA", "text": "$1.4$", "isCorrect": true, "image": null}, {"id": "1rx92", "text": "$1.3$", "isCorrect": false, "image": null}, {"id": "onZMV", "text": "$1.6$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Volume $v=\\frac{\\mathrm{m}}{d}$ and using $\\mathrm{PV}^{\\gamma}=$ constant\r\n\r\n$\\begin{array}{l}\r\n\r\n\\frac{\\mathrm{P}^{\\prime}}{\\mathrm{P}}=\\frac{\\mathrm{V}}{\\mathrm{V}^{\\prime}}=\\left(\\frac{\\mathrm{d}^{\\prime}}{\\mathrm{d}}\\right)^{\\gamma} \\\\\r\n\r\n\\text { or } 128=(32)^{\\gamma} \\\\\r\n\r\n\\therefore \\gamma=\\frac{7}{5}=1.4\r\n\r\n\\end{array}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8116f5bfc7ab78aea4a", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 3, "question": {"text": "In an adiabatic process, the pressure is increased by $\\frac{2}{3} \\% .$ If $\\gamma=\\frac{3}{2},$ then the volume decreases by nearly", "image": null}, "options": [{"id": "DQUGt", "text": "$\\frac{4}{9} \\%$", "isCorrect": true, "image": null}, {"id": "QqYGQ", "text": "$\\frac{2}{3} \\%$", "isCorrect": false, "image": null}, {"id": "nXDdh", "text": "$1 \\%$", "isCorrect": false, "image": null}, {"id": "tkR22", "text": "$\\frac{9}{4} \\%$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\mathrm{PV}^{3 / 2}=\\mathrm{K}$\r\n\r\n$\\log \\mathrm{P}+\\frac{3}{2} \\log \\mathrm{V}=\\log \\mathrm{K}$\r\n\r\n$\\frac{\\Delta \\mathrm{P}}{\\mathrm{P}}+\\frac{3}{2} \\frac{\\Delta \\mathrm{V}}{\\mathrm{V}}=0$\r\n\r\n$\\frac{\\Delta \\mathrm{V}}{\\mathrm{V}}=-\\frac{2}{3} \\frac{\\Delta \\mathrm{P}}{\\mathrm{P}}$ or $\\frac{\\Delta \\mathrm{V}}{\\mathrm{V}}=\\left(-\\frac{2}{3}\\right)\\left(\\frac{2}{3}\\right)=-\\frac{4}{9}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8056f5bfc7ab78ae9e1", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}], "type": "singleCorrect", "level": 3, "question": {"text": "<p>The figure shows the graph of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>p</mi><mi>V</mi></mrow><mi>T</mi></mfrac></math> versus <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math> for <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup><mo>&#160;</mo><mo>&#160;</mo><mi>kg</mi></math> of hydrogen gas at two different temperatures, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>,</mo><mo>&#160;</mo><mi>V</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> represents pressure, volume and temperature respectively.Then, the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>p</mi><mi>V</mi></mrow><mi>T</mi></mfrac><mo>,</mo></math>&nbsp;where the curve meet on the vertical axis, is</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/12c359dd-c6a7-4166-a2e5-aff6c707f3e3-image.png\" style=\"width: 220px; height: 182px;\" /></p>", "image": null}, "options": [{"id": "hZCiu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>R</mi><mn>5</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "30Wms", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">R</mi></mrow><mn>3</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "9DzSM", "text": "<math xmlns=\"http://  "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8026f5bfc7ab78ae9c5", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>The pressure versus temperature graph of an ideal gas is shown in the figure below. If the density of gas at point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#961;</mi><mn>0</mn></msub></math>, then the density of the gas at point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>&nbsp;will be</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/a38ea51e-bfc8-4676-a99c-366ff646d4c0-image.png\" style=\"width: 313px; height: 238px;\" /></p>", "image": null}, "options": [{"id": "eGxCQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mi>&#961;</mi><mn>0</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "2Ew8n", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>3</mn></mfrac><msub><mi>&#961;</mi><mn>0</mn></msub></math>", "isCorrect": true, "image": null}, {"id": "gLmf0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>2</mn></mfrac><msub><mi>&#961;</mi><mn>0</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "AHaw6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><msub><mi>&#961;</mi><mn>0</mn></msub></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Given, density of gas at point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>,</mo><mo>&#160;</mo><msub><mi>&#961;</mi><mi>A</mi></msub><mo>=</mo><msub><mi>&#961;</mi><mn>0</mn></msub></math></p><p>General equation for an ideal gas</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mi>V</mi><mo>=</mo><mi>n</mi><mi>R</mi><mi>T</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>p</mi><mi>V</mi><mo>=</mo><mfrac><mi>m</mi><mi>M</mi></mfrac><mi>R</mi><mi>T</mi></math>&nbsp;&nbsp;[<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>&#8594;</mo></math>mass, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><mo>&#8594;</mo></math> molecular mass]</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>p</mi><mo>=</mo><mfrac><mi>m</mi><mi>V</mi></mfrac><mo>&#183;</mo><mfrac><mi>R</mi><mi>M</mi></mfrac><mo>&#183;</mo><mi>T</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>p</mi><mo>=</mo><mi>&#961;</mi><mfenced><mfrac><mi>R</mi><mi>M</mi></mfrac></mfenced><mi>T</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi mathvariant=\"normal\">i</mi></mfenced></math>&nbsp; &nbsp; [where density&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#961;</mi><mo>=</mo><mfrac><mi>m</mi><mi>V</mi></mfrac></math>]</p><p>Applying Equation. (i) at point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>, respectively.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>=</mo><msub><mi>&#961;</mi><mi>A</mi></msub><mfenced><mfrac><mi>R</mi><mi>M</mi></mfrac></mfenced><msub><mi>T</mi><mn>0</mn></msub><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi>ii</mi></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>p</mi><mo>=</mo><msub><mi>&#961;</mi><mi>B</mi></msub><mfenced><mfrac><mi>R</mi><mi>M</mi></mfrac></mfenced><mn>3</mn><msub><mi>T</mi><mn>0</mn></msub><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi>iii</mi></mfenced></math></p><p>From Equations. (ii) and (iii), we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>=</mo><mfrac><msub><mi>&#961;</mi><mi>A</mi></msub><msub><mi>&#961;</mi><mi>B</mi></msub></mfrac><mo>&#183;</mo><mfrac><mn>1</mn><mn>3</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>&#961;</mi><mi>B</mi></msub><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><msub><mi>&#961;</mi><mi>A</mi></msub><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><msub><mi>&#961;</mi><mn>0</mn></msub></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8016f5bfc7ab78ae9c3", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}], "type": "singleCorrect", "level": 1, "question": {"text": "An ideal monoatomic gas at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math> expands adiabatically to twice its volume. The final temperature of gas is", "image": null}, "options": [{"id": "vaXFF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><msqrt><mn>2</mn></msqrt></math>", "isCorrect": false, "image": null}, {"id": "Du28M", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><msqrt><mn>3</mn></msqrt></math>", "isCorrect": false, "image": null}, {"id": "zGBlF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><msup><mfenced><mfrac><mn>1</mn><mn>2</mn></mfrac></mfenced><mfrac><mn>2</mn><mn>3</mn></mfrac></msup></math>", "isCorrect": true, "image": null}, {"id": "jQPRZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><msup><mfenced><mn>2</mn></mfenced><mfrac><mn>2</mn><mn>3</mn></mfrac></msup></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>For an ideal monatomic gas, the ratio of specific heat capacity at constant pressure to specific heat capacity at constant volume is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#947;</mi><mo>=</mo><mfrac><mn>5</mn><mn>3</mn></mfrac></math></p><p>In an adiabatic process,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><msup><mi>V</mi><mrow><mi>&#947;</mi><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo></math>&nbsp;constant</p><p>i.e.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mi>f</mi></msub><msubsup><mi>V</mi><mi>f</mi><mrow><mi>&#947;</mi><mo>-</mo><mn>1</mn></mrow></msubsup><mo>=</mo><msub><mi>T</mi><mi>i</mi></msub><msubsup><mi>V</mi><mi>i</mi><mrow><mi>&#947;</mi><mo>-</mo><mn>1</mn></mrow></msubsup><mo>&#8658;</mo><msub><mi>T</mi><mi>f</mi></msub><mo>=</mo><msub><mi>T</mi><mi>i</mi></msub><msup><mfenced><mfrac><msub><mi>V</mi><mi>i</mi></msub><msub><mi>V</mi><mi>f</mi></msub></mfrac></mfenced><mrow><mi>&#947;</mi><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo><mn>300</mn><msup><mfenced><mfrac><mn>1</mn><mn>2</mn></mfrac></mfenced><mrow><mfrac><mn>5</mn><mn>3</mn></mfrac><mo>-</mo><mn>1</mn></mrow></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>300</mn><msup><mfenced><mfrac><mn>1</mn><mn>2</mn></mfrac></mfenced><mrow><mn>2</mn><mo>/</mo><mn>3</mn></mrow></msup></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7f56f5bfc7ab78ae95a", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Helium gas goes through a cycle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mi>C</mi><mi>D</mi><mi>A</mi></math> (consisting of two isochoric and two isobaric lines) as shown in figure. The efficiency of this cycle is approximately</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/ed26730e-d0f2-4d2c-8fab-c5e28bebf59e-image.png\" style=\"width: 220px; height: 205px;\" /></p>", "image": null}, "options": [{"id": "UdfxT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>.</mo><mn>4</mn><mo>&#160;</mo><mo>%</mo></math>", "isCorrect": true, "image": null}, {"id": "KZVd8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mo>.</mo><mn>1</mn><mo>&#160;</mo><mo>%</mo></math>", "isCorrect": false, "image": null}, {"id": "8iZ1R", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mo>%</mo></math>", "isCorrect": false, "image": null}, {"id": "Usaxv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mo>%</mo></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Helium is mono atomic gas, for which<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mi>V</mi></msub><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>R</mi><mo>.</mo><msub><mi>C</mi><mi>p</mi></msub><mo>=</mo><mfrac><mn>5</mn><mn>2</mn></mfrac><mi>R</mi></math></p><p>Work done by the gas in one complete cycle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo></math> area <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mi>C</mi><mi>D</mi><mi>A</mi><mo>=</mo><msub><mi>p</mi><mn>0</mn></msub><msub><mi>V</mi><mn>0</mn></msub></math></p><p>From <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>, Heat given to gas <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>n</mi><msub><mi>C</mi><mi>V</mi></msub><mi mathvariant=\"normal\">&#916;</mi><mi>T</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>1</mn><mo>&#215;</mo><mfenced><mrow><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>R</mi></mrow></mfenced><mo>&#215;</mo><mi mathvariant=\"normal\">&#916;</mi><mi>T</mi><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><msub><mi>V</mi><mn>0</mn></msub><mfenced><mrow><mi mathvariant=\"normal\">&#916;</mi><mi>p</mi></mrow></mfenced><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><msub><mi>V</mi><mn>0</mn></msub><msub><mi>p</mi><mn>0</mn></msub></math></p><p>From <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>&nbsp;to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math>,&nbsp;heat given to gas <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>n</mi><msub><mi>C</mi><mi>p</mi></msub><mi mathvariant=\"normal\">&#916;</mi><mi>T</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>1</mn><mo>&#215;</mo><mfenced><mrow><mfrac><mn>5</mn><mn>2</mn></mfrac><mi>R</mi></mrow></mfenced><mo>&#215;</mo><mi mathvariant=\"normal\">&#916;</mi><mi>T</mi><mo>=</mo><mfrac><mn>5</mn><mn>2</mn></mfrac><mfenced><mrow><mn>2</mn><msub><mi>p</mi><mn>0</mn></msub></mrow></mfenced><mi mathvariant=\"normal\">&#916;</mi><mi>V</mi><mo>=</mo><mn>5</mn><msub><mi>p</mi><mn>0</mn></msub><msub><mi>V</mi><mn>0</mn></msub></math></p><p>Efficiency of cycle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mo>&#160;</mo><mi>Work</mi><mo>&#160;</mo><mi>done</mi><mo>&#160;</mo><mi>by</mi><mo>&#160;</mo><mi>the</mi><mo>&#160;</mo><mi>gas</mi><mo>/</mo><mi>cycle</mi><mo>&#160;</mo></mrow><mrow><mo>&#160;</mo><mi>Total</mi><mo>&#160;</mo><mi>heat</mi><mo>&#160;</mo><mi>given</mi><mo>&#160;</mo><mi>to</mi><mo>&#160;</mo><mi>gas</mi><mo>/</mo><mi>cycle</mi><mo>&#160;</mo></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><msub><mi>p</mi><mn>0</mn></msub><msub><mi>V</mi><mn>0</mn></msub></mrow><mrow><mfrac><mn>3</mn><mn>2</mn></mfrac><msub><mi>p</mi><mn>0</mn></msub><msub><mi>V</mi><mn>0</mn></msub><mo>+</mo><mn>5</mn><msub><mi>p</mi><mn>0</mn></msub><msub><mi>V</mi><mn>0</mn></msub></mrow></mfrac><mo>=</mo><mfrac><mn>2</mn><mn>13</mn></mfrac></math></p><p>Efficiency <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mo>%</mo></mfenced><mo>=</mo><mfrac><mn>2</mn><mn>13</mn></mfrac><mo>&#215;</mo><mn>100</mn><mo>=</mo><mn>15</mn><mo>.</mo><mn>4</mn><mo>&#160;</mo><mo>%</mo></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7da6f5bfc7ab78ae868", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 1, "question": {"text": "Figure below shows two paths that may be taken by a gas to go from a state $A$ to a state $(c)$\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/nzRA95eMoR3YlQ8kQbEoiA1ntlSUxAm_XMzWZytxkCc.original.fullsize.png\"><br>\r\n\r\nIn process $\\mathrm{AB}, 400 \\mathrm{~J}$ of heat is added to the system and in process $\\mathrm{BC}, 100 \\mathrm{~J}$ of heat is added to the system. The heat absorbed by the system in the process AC will be", "image": null}, "options": [{"id": "cEd6P", "text": "$500 \\mathrm{~J}$", "isCorrect": false, "image": null}, {"id": "9YoEK", "text": "$460 \\mathrm{~J}$", "isCorrect": true, "image": null}, {"id": "FcdMD", "text": "$300 \\mathrm{~J}$", "isCorrect": false, "image": null}, {"id": "nvCFV", "text": "$380 \\mathrm{~J}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In cyclic process ABCA $\\mathrm{Q}_{\\text {cycle }}=\\mathrm{W}_{\\text {cycl }}$\r\n\r\n$\\mathrm{Q}_{\\mathrm{AB}}+\\mathrm{Q}_{\\mathrm{BC}}+\\mathrm{Q}_{\\mathrm{CA}}=$ ar. of $\\Delta \\mathrm{ABC}$\r\n\r\n$+400+100+\\mathrm{Q}_{\\mathrm{C} \\rightarrow \\mathrm{A}}=\\frac{1}{2}\\left(2 \\times 10^{-3}\\right)\\left(4 \\times 10^{4}\\right)$\r\n\r\n$\\Rightarrow \\mathrm{Q}_{\\mathrm{C} \\rightarrow \\mathrm{A}}=-460 \\mathrm{~J}$\r\n\r\n$\\Rightarrow \\mathrm{Q}_{\\mathrm{A} \\rightarrow C}=+460 \\mathrm{~J}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7c96f5bfc7ab78ae7dd", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 1, "question": {"text": "A vessel of volume 20L contains a mixture of hydrogen and helium at temperature of $27^{\\circ} \\mathrm{C}$ and pressure 2 atm. The mass of mixture is $5 \\mathrm{~g}$. Assuming the gases to be ideal, the ratio of mass of hydrogen to that of helium in the given mixture will be", "image": null}, "options": [{"id": "r40fB", "text": "1: 2", "isCorrect": false, "image": null}, {"id": "MIRDC", "text": "2: 3", "isCorrect": false, "image": null}, {"id": "vyPkn", "text": "2: 1", "isCorrect": false, "image": null}, {"id": "cIP9f", "text": "2: 5", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let there are $\\mathrm{n}_{1}$ moles of hydrogen and $\\mathrm{n}_{2}$ moles of helium in the given mixture. As $\\mathrm{Pv}$ $=\\mathrm{nRT}$\r\n\r\nThen the pressure of the mixture\r\n\r\n$$\r\n\r\n\\begin{array}{r}\r\n\r\nP=\\frac{\\mathrm{n}_{1} \\mathrm{RT}}{\\mathrm{V}}+\\frac{\\mathrm{n}_{2} \\mathrm{RT}}{\\mathrm{V}}=\\left(\\mathrm{n}_{1}+\\mathrm{n}_{2}\\right) \\frac{\\mathrm{RT}}{\\mathrm{V}} \\\\\r\n\r\n2 \\times 101.3 \\times 10^{3}=\\left(\\mathrm{n}_{1}+\\mathrm{n}_{2}\\right) \\times \\frac{(8.3 \\times 300)}{20 \\times 10^{-3}}\r\n\r\n\\end{array}\r\n\r\n$$\r\n\r\nor,\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n\\left(\\mathrm{n}_{1}+\\mathrm{n}_{2}\\right)=\\frac{2 \\times 101.3 \\times 10^{3} \\times 20 \\times 10^{-3}}{(8.3)(300)} \\\\\r\n\r\n\\text { or, } \\mathrm{n}_{1}+\\mathrm{n}_{2}=1.62\r\n\r\n\\end{array}\r\n\r\n$$\r\n\r\nThe mass of the mixture is (in grams)\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n\\mathrm{n}_{1} \\times 2+\\mathrm{n}_{2} \\times 4=5 \\\\\r\n\r\n\\Rightarrow \\quad\\left(\\mathrm{n}_{1}+2 \\mathrm{n}_{2}\\right)=2.5 \\quad \\ldots\r\n\r\n\\end{array}\r\n\r\n$$\r\n\r\nSolving the eqns. (1) and (2), we get $\\mathrm{n}_{1}=0.74$ and $\\mathrm{n}_{2}=0.88$\r\n\r\nHence, $\\frac{\\mathrm{m}_{\\mathrm{H}}}{\\mathrm{m}_{\\mathrm{He}}}=\\frac{0.74 \\times 2}{0.88 \\times 4}=\\frac{1.48}{3.52}=\\frac{2}{5}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7ba6f5bfc7ab78ae75c", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 1, "question": {"text": "Two balloons are filled one with pure he gas and other with air respectively. If the pressure and temperature of these balloons are same, then the number of molecules per unit volume is", "image": null}, "options": [{"id": "EOWNW", "text": "more in He gas filled balloon", "isCorrect": false, "image": null}, {"id": "IqrkZ", "text": "same in both balloons", "isCorrect": true, "image": null}, {"id": "fVvmM", "text": "more in air filled balloon", "isCorrect": false, "image": null}, {"id": "Yp4Pd", "text": "in the ratio 1: 4", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Assuming the balloons have the same volume, as $\\mathrm{pV}=\\mathrm{nRT}$. If $\\mathrm{P}, \\mathrm{V}$ and $\\mathrm{T}$ are the same, $\\mathrm{n}$ the number of moles present will be the same, whether it is He or air. Hence, number of molecules per unit volume will be same in both the balloons.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7ba6f5bfc7ab78ae759", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 2, "question": {"text": "One mole of $\\mathrm{O}_{2}$ gas having a volume equal to 22.4 Litres at $0^{\\circ} \\mathrm{C}$ and 1 atmospheric pressure in compressed isothermally so that its volume reduces to 11.2 litres. The work done in this process is-", "image": null}, "options": [{"id": "mYFxJ", "text": "$1672.5 \\mathrm{~J}$", "isCorrect": false, "image": null}, {"id": "sJnva", "text": "$1728 \\mathrm{~J}$", "isCorrect": false, "image": null}, {"id": "EzxWp", "text": "$-1728 \\mathrm{~J}$", "isCorrect": false, "image": null}, {"id": "Z34Xj", "text": "$-1572.5 \\mathrm{~J}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Work done in adiabatic process, \\(\\mathrm{W}=\\mu \\mathrm{RT} \\log _{\\mathrm{e}}\\left(\\frac{\\mathrm{V}_{\\mathrm{f}}}{\\mathrm{V}_{\\mathrm{i}}}\\right)\\)\r\n\r\n\\(\\mathrm{W}=1 \\times 8.314 \\times 273 \\times \\log _{\\mathrm{e}}\\left(\\frac{11.2}{22.4}\\right)\\)\r\n\r\n\\(\\mathrm{W}=8.314 \\times 273 \\times \\log _{\\mathrm{e}}\\left(\\frac{1}{2}\\right)\\)\r\n\r\n\\(\\mathrm{W}=8.314 \\times 273 \\times\\left[\\log _{\\mathrm{e}}(1)-\\log _{\\mathrm{e}}(2)\\right]\\)\r\n\r\n\\(\\mathrm{W}=8.314 \\times 273 \\times(0-0.69)\\)\r\n\r\n\\(\\mathrm{W}=-1566.1 \\mathrm{~J}\\)", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7ad6f5bfc7ab78ae6e6", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 2, "question": {"text": "Two gases occupy two containers $A$ and $B$ the gas in $\\mathrm{A},$ of volume $0.10 \\mathrm{~m}^{3},$ exerts a pressure of $1.40 \\mathrm{MPa}$ and that in $\\mathrm{B}$ of volume $0.15 \\mathrm{~m}^{3}$ exerts a pressure $0.7 \\mathrm{MPa}$. The two containers are united by a tube of negligible volume and the gases are allowed to intermingle. Then if the temperature remains constant, the final pressure in the container will be (in MPa)", "image": null}, "options": [{"id": "2YX1m", "text": "0.7", "isCorrect": false, "image": null}, {"id": "n97Z7", "text": "0.98", "isCorrect": true, "image": null}, {"id": "AURLe", "text": "1.4", "isCorrect": false, "image": null}, {"id": "0OCz5", "text": "210", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "We know that $\\mathrm{P}_{\\mathrm{A}} \\mathrm{V}_{\\mathrm{A}}=\\mathrm{n}_{\\mathrm{A}} \\mathrm{RT}, \\mathrm{P}_{\\mathrm{B}} \\mathrm{V}_{\\mathrm{B}}=\\mathrm{n}_{\\mathrm{B}} \\mathrm{RT}$\r\n\r\n$\\begin{array}{ll} & \\text { and } P_{f}\\left(V_{A}+V_{B}\\right)=\\left(n_{A}+n_{B}\\right) R T \\\\ & P_{f}\\left(V_{A}+V_{B}\\right)=P_{A} V_{A}+P_{B} V_{B} \\\\ \\therefore & P_{f}=\\left(\\frac{P_{A} V_{A}+P_{B} V_{B}}{V_{A}+V_{B}}\\right) \\\\ & =\\frac{1.4 \\times 0.1+0.7 \\times 0.15}{0.1+0.15} \\mathrm{MPa}=0.98 \\mathrm{MPa}\\end{array}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7ac6f5bfc7ab78ae6e4", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 2, "question": {"text": "A vessel containing 1 more of $\\mathrm{O}_{2}$ gas (molar mass  32) at temperature $\\mathrm{T}$. The pressure of the gas is p. An identical vessel containing one mole of he gas (molar mass 4 ) at temperature $2 \\mathrm{~T}$ has a pressure of", "image": null}, "options": [{"id": "KUBW0", "text": "$\\mathrm{p} / 8$", "isCorrect": false, "image": null}, {"id": "wYgKY", "text": "$\\mathrm{p}$", "isCorrect": false, "image": null}, {"id": "WBZFw", "text": "$2 \\mathrm{p}$", "isCorrect": true, "image": null}, {"id": "gYZCN", "text": "$8 \\mathrm{p}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Applying gas equation, $\\mathrm{pV}=\\mathrm{nRT}$ We can write, $\\mathrm{p}_{1} \\mathrm{~V}=\\mathrm{n}_{1} \\mathrm{RT}_{1}$ and $\\mathrm{p}_{2} \\mathrm{~V}=\\mathrm{n}_{2} \\mathrm{RT}_{2}$\r\n\r\n$\\Rightarrow \\quad \\frac{\\mathrm{p}_{2}}{\\mathrm{p}_{1}}=\\frac{\\mathrm{n}_{2}}{\\mathrm{n}_{1}} \\times \\frac{\\mathrm{T}_{2}}{\\mathrm{~T}_{1}}=\\frac{1}{1} \\times \\frac{2 \\mathrm{~T}}{\\mathrm{~T}}=2$\r\n\r\n$\\Rightarrow \\mathrm{p}_{2}=2 \\mathrm{p}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e79d6f5bfc7ab78ae664", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 1, "question": {"text": "A sample of ideal monoatomic gas is taken round the cycle ABCA as shown in the figure. The work done during the cycle is\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/Dn4mh3Fq-NJiyG35Ir_DMNaX9dtBaVHvH36wSjlDcKo.original.fullsize.png\">", "image": null}, "options": [{"id": "C7FFc", "text": "$3 \\mathrm{pV}$", "isCorrect": true, "image": null}, {"id": "kKIOp", "text": "zero", "isCorrect": false, "image": null}, {"id": "ImTZi", "text": "$9 \\mathrm{pV}$", "isCorrect": false, "image": null}, {"id": "A1OYm", "text": "$6 \\mathrm{pV}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\Delta \\mathrm{W}=$ area under the $\\mathrm{p}-\\mathrm{V}$ curve\r\n$=\\frac{1}{2} \\times 3 \\mathrm{p} \\times 2 \\mathrm{~V}=3 \\mathrm{pV}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e79d6f5bfc7ab78ae663", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 2, "question": {"text": "For an isothermal expansion of a perfect gas, the value of $\\frac{\\Delta P}{P}$ is equal to", "image": null}, "options": [{"id": "LxqNI", "text": "$-\\gamma^{1 / 2} \\frac{\\Delta V}{V}$", "isCorrect": false, "image": null}, {"id": "SgI0x", "text": "$-\\frac{\\Delta V}{V}$", "isCorrect": true, "image": null}, {"id": "PjlqE", "text": "$-\\gamma \\frac{\\Delta V}{V}$", "isCorrect": false, "image": null}, {"id": "336zP", "text": "$-\\gamma^{2} \\frac{\\Delta V}{V}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Differentiate $P V=$ constant w.r.t $V$\r\n$\\Rightarrow P \\Delta V+V \\Delta P=0 \\quad \\Rightarrow \\frac{\\Delta P}{P}=-\\frac{\\Delta V}{V}$", "image": null}, "videoSolution": null, "questio , "image": null}, "options": [{"id": "4LvYi", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>7</mn><mo>&#215;</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&#160;</mo><mi>cal</mi><mo>,</mo><mo>&#160;</mo><mn>70</mn><mo>.</mo><mn>70</mn><mo>&#160;</mo><mo>%</mo></math>", "isCorrect": false, "image": null}, {"id": "JkDN5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>.</mo><mn>27</mn><mo>&#215;</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&#160;</mo><mi>cal</mi><mo>,</mo><mo>&#160;</mo><mn>72</mn><mo>.</mo><mn>72</mn><mo>&#160;</mo><mo>%</mo></math>", "isCorrect": true, "image": null}, {"id": "9K5cW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>70</mn><mo>&#215;</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&#160;</mo><mi>cal</mi><mo>,</mo><mo>&#160;</mo><mn>80</mn><mo>.</mo><mn>70</mn><mo>&#160;</mo><mo>%</mo></math>", "isCorrect": false, "image": null}, {"id": "kOK9D", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>.</mo><mn>70</mn><mo>&#215;</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&#160;</mo><mi>cal</mi><mo>,</mo><mo>&#160;</mo><mn>70</mn><mo>.</mo><mn>70</mn><mo>&#160;</mo><mo>%</mo></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Given, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Q</mi><mn>1</mn></msub><mo>=</mo><msup><mn>10</mn><mn>6</mn></msup><mo>&#160;</mo><mi>cal</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>1</mn></msub><mo>=</mo><mn>827</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi><mo>=</mo><mo>(</mo><mn>827</mn><mo>+</mo><mn>273</mn><mo>)</mo><mo>=</mo><mn>1100</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math>,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mn>27</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi><mo>=</mo><mo>(</ e": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7ac6f5bfc7ab78ae6e3", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 2, "question": {"text": "A Carnot's heat engine works between the temperatures $427^{\\circ} \\mathrm{C}$ and $27^{\\circ} \\mathrm{C}$. What amount of heat should it consume per second to deliver mechanical work at the rate of $1.0 \\mathrm{~kW} ?$", "image": null}, "options": [{"id": "YoYPQ", "text": "$0.417 \\mathrm{kcal} / \\mathrm{s}$", "isCorrect": true, "image": null}, {"id": "dgVwd", "text": "$4.17 \\mathrm{kcal} / \\mathrm{s}$", "isCorrect": false, "image": null}, {"id": "yji5v", "text": "$41.7 \\mathrm{kcal} / \\mathrm{s}$", "isCorrect": false, "image": null}, {"id": "08IZw", "text": "$0.212 \\mathrm{kcal} / \\mathrm{s}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The efficiency of the heat engine is\r\n\r\n$$\r\n\r\n\\eta=1-\\frac{T_{2}}{T_{1}}=1-\\left(\\frac{273+27 K}{273+427 K}\\right)=\\frac{4}{7}\r\n\r\n$$\r\n\r\nBut $\\quad \\eta=\\frac{\\mathrm{W}}{\\mathrm{Q}_{1}}$\r\n\r\n$$\r\n\r\n\\therefore \\mathrm{Q}_{1}=\\frac{\\mathrm{W}}{\\eta}=\\frac{1.0 \\mathrm{~kW}}{4 / 7}=1.75 \\mathrm{~kW}=0.417 \\mathrm{kcal} / \\mathrm{s}\r\n\r\n$$\r\n\r\nThus, the engine would require 417 cal of heat per second, to deliver the requisite amount of work.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7816f5bfc7ab78ae56c", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}], "question": {"text": "An ideal refrigerator has a freezer at a temperature of $13^{\\circ} \\mathrm{C}$. The coefficient of performance of the engine is $5 .$ The temperature of the air (to which heat is rejected) is", "image": null}, "options": [{"id": "wMyic", "text": "$320^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "5EHi2", "text": "$39^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": true}, {"id": "uGRXH", "text": "$325 \\mathrm{~K}$", "image": null, "isCorrect": false}, {"id": "FZSZ6", "text": "$325^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{T}_{2}=273-13=260$,\n$$\n\\mathrm{K}=\\frac{\\mathrm{T}_{2}}{\\mathrm{~T}_{1}-\\mathrm{T}_{2}} ; \\quad 5=\\frac{260}{\\mathrm{~T}_{1}-260}\n$$\nor $\\mathrm{T}_{1}-260=52 ; \\quad \\mathrm{T}_{1}=312 \\mathrm{~K}$\n$\\mathrm{T}_{2}=312-273=39^{\\circ} \\mathrm{C}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
