rrect": false, "image": null}], "correctValue": null, "solution": {"text": "Total carrent, $1=(5+10 \\sin \\omega \\mathrm{t})$\r\n\r\n$$\r\n\r\n\\begin{aligned}\r\n\r\n\\Rightarrow I_{\\text {eff }} &=\\left[\\frac{\\int_{0}^{\\mathrm{T}} \\mathrm{I}^{2} \\mathrm{dt}}{\\int_{0}^{\\mathrm{T}} \\mathrm{dt}}\\right]^{1 / 2} \\\\\r\n\r\n&=\\left[\\frac{1}{\\mathrm{~T}} \\int_{0}^{\\mathrm{T}}(5+10 \\sin \\omega \\mathrm{t})^{2} \\mathrm{dt}\\right]^{1 / 2} \\\\\r\n\r\n&=\\left[\\frac{1}{\\mathrm{~T}} \\int_{0}^{\\mathrm{T}}\\left(25+100 \\sin \\omega \\mathrm{t}+100 \\sin ^{2} \\omega \\mathrm{t}\\right)\\right]^{1 / 2} \\\\\r\n\r\n\\text { But, } \\quad \\frac{1}{\\mathrm{~T}} \\int_{0}^{\\mathrm{T}} \\sin \\omega \\mathrm{t} \\mathrm{dt}=0\r\n\r\n\\end{aligned}\r\n\r\n$$\r\n\r\nand\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n\\frac{1}{\\mathrm{~T}} \\int_{0}^{\\mathrm{T}} \\sin ^{2} \\omega \\mathrm{t} \\mathrm{dt}=\\frac{1}{2} \\\\\r\n\r\n\\text { So, } \\mathrm{I}_{\\mathrm{eff}}=\\left[25+\\frac{1}{2} \\times 100\\right]^{1 / 2}=5 \\sqrt{3} \\mathrm{~A}\r\n\r\n\\end{array}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7bc6f5bfc7ab78ae76a", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 2, "question": {"text": "Voltage $V$ and current $i$ in $A C$ circuit are given by $\\mathrm{V}=50 \\sin (50 \\mathrm{t})$ volt, $\\mathrm{i}=50 \\sin \\left(50 \\mathrm{t}+\\frac{\\pi}{3}\\right) \\mathrm{mA}$\r\n\r\nThe power dissipated in the circuit is", "image": null}, "options": [{"id": "LERfI", "text": "$5.0 \\mathrm{~W}$", "isCorrect": false, "image": null}, {"id": "zgrHI", "text": "$2.5 \\mathrm{~W}$", "isCorrect": false, "image": null}, {"id": "mPuSb", "text": "$1.25 \\mathrm{~W}$", "isCorrect": true, "image": null}, {"id": "un1X6", "text": "zero", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $V=50 \\sin (50$ t) $V$ Maximum voltage, $\\mathrm{V}_{0}=50 \\mathrm{~V}$\r\n\r\n$$\r\n\r\ni=\\left(50 t+\\frac{\\pi}{3}\\right) \\mathrm{mA}\r\n\r\n$$\r\n\r\nMaximum current, $i_{0}=50 \\mathrm{~mA}=50 \\times 10^{-3} \\mathrm{~A}$\r\n\r\nPower dissipated, $\\mathrm{P}=\\frac{\\mathrm{i}_{0}}{\\sqrt{2}} \\times \\frac{\\mathrm{V}_{0}}{\\sqrt{2}}$\r\n\r\n$=\\frac{50 \\times 50 \\times 10^{-3}}{2}=\\frac{2500 \\times 10^{-3}}{2}=1.25 \\mathrm{~W}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e79e6f5bfc7ab78ae673", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 1, "question": {"text": "The r.m.s. value of potential difference $\\mathrm{V}$ shown in the figure is\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/5QDiyYGrdWNO8gADy-u0-3igbVsJRCuRL2hTyLf0ufk.original.fullsize.png\">", "image": null}, "options": [{"id": "7PevE", "text": "$\\mathrm{V}_{0}$", "isCorrect": false, "image": null}, {"id": "VKRdA", "text": "$\\mathrm{V}_{0} / \\sqrt{2}$", "isCorrect": true, "image": null}, {"id": "CwnKQ", "text": "$\\mathrm{V}_{0} / 2$", "isCorrect": false, "image": null}, {"id": "vdd15", "text": "$\\mathrm{V}_{0} / \\sqrt{3}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\mathrm{V}_{\\mathrm{rms}}=\\sqrt{\\frac{(\\mathrm{T} / 2) \\mathrm{V}_{0}{ }^{2}+0}{\\mathrm{~T}}}=\\frac{\\mathrm{V}_{0}}{\\sqrt{2}}$.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7826f5bfc7ab78ae579", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}], "question": {"text": "An alternating voltage $V=V_{0}$ sin ot is appliedacross a circuit. As a result, a current $I=I_{0} \\sin (\\omega t-\\pi / 2)$ flows in it. The power consumed per cycle is", "image": null}, "options": [{"id": "JcEdC", "text": "zero", "image": null, "isCorrect": true}, {"id": "yeLqo", "text": "$0.5 \\mathrm{~V}_{0} \\mathrm{I}_{0}$", "image": null, "isCorrect": false}, {"id": "P1E6r", "text": "$0.707 \\mathrm{~V}_{0} \\mathrm{I}_{0}$", "image": null, "isCorrect": false}, {"id": "onjJA", "text": "$1.414 \\mathrm{~V}_{0} \\mathrm{I}_{0}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The phase angle between voltage $\\mathrm{V}$ and current I is $\\pi / 2$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7746f5bfc7ab78ae4f7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "The instantaneous current from an a.c. source is $\\mathrm{I}=6 \\sin 314 \\mathrm{t}$. What is the rms value of the current?", "image": null}, "options": [{"id": "UCRYo", "text": "$3 \\sqrt{2} \\mathrm{amp}$", "image": null, "isCorrect": true}, {"id": "xgZo9", "text": "$2 \\sqrt{2}$ amp", "image": null, "isCorrect": false}, {"id": "rdVtT", "text": "$\\sqrt{2} \\mathrm{amp}$", "image": null, "isCorrect": false}, {"id": "esyAR", "text": "$2 \\mathrm{amp}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{I}_{\\mathrm{rms}}=\\frac{\\mathrm{I}_{0}}{\\sqrt{2}}=\\frac{6}{\\sqrt{2}}=3 \\sqrt{2} \\mathrm{amp} .$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64c0e85a6f5bfc7ab78aed31", "title": "AC Circuits", "totalQuestions": 9, "questions": [{"_id": "67726d04c49e8ef28ee2b39b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}], "question": {"text": "In an ac circuit, an inductor, a capacitor and a resistor are connected in series with $X_L=R=$ $\\mathrm{X}_{\\mathrm{C}}$. Impedance of this circuit is :", "image": null}, "options": [{"id": "vkoCo", "text": "$2 \\mathrm{R}^2$", "image": null, "isCorrect": false}, {"id": "VPZp9", "text": "Zero", "image": null, "isCorrect": false}, {"id": "Kx3dR", "text": "R", "image": null, "isCorrect": true}, {"id": "4GgCN", "text": "$\\mathrm{R} \\sqrt{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Impedance in LCR circuit\n$Z=\\sqrt{\\left(X_L-X_C\\right)^2+R^2} \\quad \\because X_L=X_C=R$\n$\\therefore Z=R$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b87a97ae24e9e2db8cc1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}], "question": {"text": "In the given circuit, rms value of current (Irms) through the resistor $R$ is :<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/aHaZk2pei9iFEQ9YHqBkmjmbU2nf5eV9CESgR6GnNIM.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "S5lMf", "text": "$2 \\mathrm{~A}$", "image": null, "isCorrect": true}, {"id": "bIv4Y", "text": "$\\frac{1}{2} \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "NmhFv", "text": "$20 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "5DOMR", "text": "$2 \\sqrt{2} \\mathrm{~A}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(a) Given,<br />Capacitive reactance, $\\mathrm{X}_{\\mathrm{C}}=100 \\Omega$<br />Inductive reactance, $\\mathrm{X}_{\\mathrm{L}}=200 \\Omega$<br />Resistance, $R=100 \\Omega$<br />Impedance, $\\mathrm{Z}=\\sqrt{\\mathrm{R}^2+\\left(\\mathrm{X}_{\\mathrm{L}}-\\mathrm{X}_{\\mathrm{C}}\\right)^2}$<br />$Z=\\sqrt{100^2+(200-100)^2}=100 \\sqrt{2} \\Omega$<br />RMS value of current,<br />$i_{\\mathrm{rms}}=\\frac{V_{\\mathrm{rms}}}{Z}=\\frac{200 \\sqrt{2}}{100 \\sqrt{2}}=2 \\mathrm{~A}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e82d6f5bfc7ab78aeb44", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}], "type": "singleCorrect", "level": 2, "question": {"text": "In the circuit shown in the figure, the $\\mathrm{AC}$ source gives a voltage $V=20 \\cos (2000 t)$ neglecting source resistance, the voltmeter and ammeter reading will be\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/v5y3bhAJ29Rq6lxNBnA5ho52xioZBvUCYER9Mb7lpWI.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "VDag4", "text": "\r\n$0 \\mathrm{~V}, 0.47 \\mathrm{~A}$\r\n", "isCorrect": false, "image": null}, {"id": "7cLo9", "text": "\r\n$282 \\mathrm{~V}, 1.41 \\mathrm{~A}$\r\n", "isCorrect": true, "image": null}, {"id": "GTNHQ", "text": "\r\n$1.41 \\mathrm{~V}, 0.47 \\mathrm{~A}$\r\n", "isCorrect": false, "image": null}, {"id": "GEQo3", "text": "\r\n$15 \\mathrm{~V}, 837 \\mathrm{~A}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given, $R_1=8 \\Omega$\r\n$\\begin{aligned} R_2 & =2 \\Omega \\\\ L & =5 \\mathrm{mH} \\\\ C & =50 \\mu \\mathrm{F}\\end{aligned}$\r\nand $\\quad V_0=20 \\cos (2000 t)$\r\nImpedance, $Z=\\sqrt{R^2+\\left(X_L-X_C\\right)^2}$\r\nAs, here, $X_L=\\omega L=2000 \\times 5 \\times 10^{-3}=10 \\Omega$\r\nSimilarly, $X_L=\\frac{1}{\\omega C}=\\frac{1}{2000 \\times 50 \\times 10^{-6}}=10 \\Omega$ $\\because \\quad X_L=X_C$, Hence, $i_{\\max }=\\frac{V_0}{Z}=\\frac{20}{(8+2)}=2 \\mathrm{~A}$\r\nHence, $\\quad i_{\\operatorname{rms}}=\\frac{i_{\\max }}{\\sqrt{2}}=\\frac{2}{\\sqrt{2}}=1.41 \\mathrm{~A}$ and\r\n$$\r\n\\begin{aligned}\r\nV & =R_2 i_{\\mathrm{rms}}=1.41 \\times 2 \\\\\r\n& =282 \\mathrm{~V}\r\n\\end{aligned}\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8126f5bfc7ab78aea57", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 1, "question": {"text": "In series combination of $R, L$ and $C$ with an A.C. source at resonance, if $\\mathrm{R}=20 \\mathrm{ohm},$ then impedence $Z$ of the combination is", "image": null}, "options": [{"id": "cQZlR", "text": "$20 \\mathrm{ohm}$", "isCorrect": true, "image": null}, {"id": "Szxvc", "text": "zero", "isCorrect": false, "image": null}, {"id": "P69C8", "text": "10 ohm", "isCorrect": false, "image": null}, {"id": "e1JJa", "text": "$400 \\mathrm{ohm}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "No Solution", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7f46f5bfc7ab78ae94f", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}], "type": "singleCorrect", "level": 1, "question": {"text": "A resistor <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>, an inductor <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math>, a capacitor <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math> and voltmeters <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>1</mn></msub><mo>,</mo><msub><mi>V</mi><mn>2</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>3</mn></msub></math> are connected to an oscillator in the circuit as shown in the adjoining diagram. When the frequency of the&nbsp;oscillation is increased, then at the resonant frequency, the voltmeter reading is zero in the case of<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/1676fe19-0483-4851-ac28-556e31160568-image.png\" style=\"width: 280px; height: 201px;\" />", "image": null}, "options": [{"id": "ZlDie", "text": "voltmeter <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>1</mn></msub></math> only", "isCorrect": false, "image": null}, {"id": "OkTGD", "text": "voltmeter <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>2</mn></msub></math> only", "isCorrect": true, "image": null}, {"id": "XQnkJ", "text": "voltmeter <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>3</mn></msub></math> only", "isCorrect": false, "image": null}, {"id": "wpl9n", "text": "All the three voltmeters", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>At resonance, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>X</mi><mi>L</mi></msub><mo>=</mo><msub><mi>X</mi><mi>C</mi></msub></math>&nbsp;or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#969;</mi><mi>L</mi><mo>=</mo><mfrac><mn>1</mn><mrow><mi>&#969;</mi><mi>C</mi></mrow></mfrac></math></p><p>Voltage across the series <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi><mo>-</mo><mi>C</mi></math> combination,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>2</mn></msub><mo>=</mo><mi>i</mi><mfenced><mrow><msub><mi>X</mi><mi>L</mi></msub><mo>-</mo><msub><mi>X</mi><mi>C</mi></msub></mrow></mfenced><mo>=</mo><mn>0</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7da6f5bfc7ab78ae86d", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 2, "question": {"text": "A resistor of resistance $R$, capacitor of capacitance $C$ and inductor of inductance $L$ are connected in parallel to AC power source of voltage $\\varepsilon_{0} \\sin \\omega t$. The maximum current through the resistance is half of the maximum current through the power source. Then value of $\\mathrm{R}$ is", "image": null}, "options": [{"id": "AwfrE", "text": "$\\frac{\\sqrt{3}}{\\left|\\omega C-\\frac{1}{\\omega L}\\right|}$", "isCorrect": true, "image": null}, {"id": "OYNcJ", "text": "$\\sqrt{3}\\left|\\frac{1}{\\omega C}-\\omega L\\right|$", "isCorrect": false, "image": null}, {"id": "UCT5j", "text": "$\\sqrt{5}\\left|\\frac{1}{\\omega C}-\\omega L\\right|$", "isCorrect": false, "image": null}, {"id": "OZA4F", "text": "None of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\frac{i_{R_{0}}}{\\sqrt{\\left(i_{R_{0}}\\right)^{2}+\\left(i_{c_{0}}-i_{L_{0}}\\right)^{2}}}=\\frac{1}{2}$\r\n\r\n$\\Rightarrow \\frac{\\varepsilon_{0} / R}{\\sqrt{\\left(\\varepsilon_{0} / R\\right)^{2}+\\left(\\varepsilon_{0} \\omega C-\\frac{\\varepsilon_{0}}{\\omega L}\\right)^{2}}}=\\frac{1}{2}$\r\n\r\n$\\Rightarrow R=\\frac{\\sqrt{3}}{\\left(\\omega C-\\frac{1}{\\omega L}\\right)}$\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/Rrn4TWflryKKMeTqlt_-v_Kj9S0PR4CKBdOoea_aOMY.original.fullsize.png\">", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7cb6f5bfc7ab78ae7ef", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 1, "question": {"text": "In the circuit shown below, the ac source has voltage $V=20 \\cos (\\omega t)$ volt with $\\omega=2000 \\mathrm{rad} / \\mathrm{s}$\r\n\r\nThe amplitude of the current will be nearest to\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/0sMCMm8Dj6GVncaD-q5TZfNMH0aQT3lyO35PZhANVqc.original.fullsize.png\">", "image": null}, "options": [{"id": "FFWd9", "text": "$2 \\mathrm{~A}$", "isCorrect": true, "image": null}, {"id": "G8X7t", "text": "$3.3 \\mathrm{~A}$", "isCorrect": false, "image": null}, {"id": "ohnxo", "text": "$2 / \\sqrt{5} \\mathrm{~A}$", "isCorrect": false, "image": null}, {"id": "tnsZL", "text": "$\\sqrt{5} \\mathrm{~A}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$$\r\n\r\n\\begin{aligned}\r\n\r\nZ=& \\sqrt{R^{2}+\\left(\\omega L-\\frac{1}{\\omega C}\\right)^{2}} \\\\\r\n\r\n&=\\sqrt{10^{2}+\\left(2000 \\times 5 \\times 10^{3}-\\frac{1}{2000 \\times 50 \\times 10^{-6}}\\right)^{2}} \\\\\r\n\r\n=& 10 \\Omega \\\\\r\n\r\n\\quad i=\\frac{V_{0}}{Z}=\\frac{20}{10}=2 A .\r\n\r\n\\end{aligned}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7826f5bfc7ab78ae57a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}], "question": {"text": "A resistance $\\mathrm{R}$ and inductance $\\mathrm{L}$ and a capacitor $\\mathrm{C}$ all are connected in series with an AC supply. The resistance of $\\mathrm{R}$ is 16 ohm and for a given frequency, the inductive reactance of $L$ is 24 ohm and capacitive reactance of $\\mathrm{C}$ is $12 \\mathrm{ohm} .$ If the current in the circuit is 5 amp., find the potential difference across $\\mathrm{R}, \\mathrm{L}$ and $\\mathrm{C}$.", "image": null}, "options": [{"id": "c2cyU", "text": "30,20,50 volt", "image": null, "isCorrect": false}, {"id": "o300d", "text": "40,100,60 volt", "image": null, "isCorrect": false}, {"id": "rLU9w", "text": "70,110,60 volt", "image": null, "isCorrect": false}, {"id": "p6K8L", "text": "80,120,60 volt", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\mathrm{V}_{\\mathrm{R}}=\\mathrm{i} \\mathrm{R}=5 \\times 16=80 \\mathrm{Volt}$\n$$\n\\begin{array}{l}\n\\mathrm{V}_{\\mathrm{L}}=\\mathrm{i} \\times(\\omega \\mathrm{L})=5 \\times 24=120 \\mathrm{Volt} \\\\\n\\mathrm{V}_{\\mathrm{C}}=\\mathrm{i} \\times(\\mathrm{l} / \\omega \\mathrm{C})=5 \\times 12=60 \\mathrm{Volt}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7746f5bfc7ab78ae4f8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "A coil has resistance 30 ohm and inductive reactance 20 ohm at $50 \\mathrm{~Hz}$ frequency. If an ac source, of 200 volt, $100 \\mathrm{~Hz},$ is connected across the coil, the current in the coil will be", "image": null}, "options": [{"id": "ZCXxi", "text": "$4.0 \\mathrm{~A}$", "image": null, "isCorrect": true}, {"id": "w4lq2", "text": "$8.0 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "7tSUh", "text": "$7.2 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "pfkBo", "text": "$2.0 \\mathrm{~A}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If $\\omega=50 \\times 2 \\pi$ then $\\omega \\mathrm{L}=20 \\Omega$ If $\\omega^{\\prime}=100 \\times 2 \\pi$ then $\\omega^{\\prime} \\mathrm{L}=40 \\Omega$\nCurrent flowing in the coil is\n$$\n\\mathrm{I}=\\frac{200}{\\mathrm{Z}}=\\frac{200}{\\sqrt{\\mathrm{R}^{2}+\\left(\\omega^{\\prime} \\mathrm{L}\\right)^{2}}}=4 \\mathrm{~A}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64c0e85a6f5bfc7ab78aed33", "title": "Quality and Power Factor", "totalQuestions": 2, "questions": [{"_id": "64c0e8206f5bfc7ab78aead2", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}], "type": "singleCorrect", "level": 1, "question": {"text": "For an RLC circuit driven with voltage of amplitude $V_{m}$ and frequency $\\omega_{0}=\\frac{1}{\\sqrt{\\mathrm{LC}}}$ the current exhibits resonance the quality factor, $Q$ is given by", "image": null}, "options": [{"id": "mVAW6", "text": "$\\frac{\\omega_{0}}{\\mathrm{~L}}$", "isCorrect": false, "image": null}, {"id": "Omv4n", "text": "$\\frac{\\omega_{0} \\mathrm{~L}}{\\mathrm{R}}$", "isCorrect": true, "image": null}, {"id": "yg7ap", "text": "$\\frac{\\mathrm{R}}{\\omega_{0} \\mathrm{C}}$", "isCorrect": false, "image": null}, {"id": "bX5Mu", "text": "$\\frac{\\mathrm{CR}}{\\omega_{0}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Total angular momentum of the system initially \\(\\mathrm{L}_{\\mathrm{i}}=\\mathrm{I}_{1} \\mathrm{w}+\\mathrm{I}_{2}(0)=\\mathrm{I}_{1} \\mathrm{w}\\) Total angular momentum of the system finally \\(\\mathrm{L}_{\\mathrm{f}}=\\left(\\mathrm{I}_{1}+\\mathrm{I}_{2}\\right) \\mathrm{w}_{2}\\)\r\n\r\nAccording to conservation of angular momentum i.e. \\(\\mathrm{L}_{\\mathrm{i}}=\\mathrm{L}_{\\mathrm{f}}\\)\r\n\r\n\\(\\begin{aligned}\r\n\r\n&\\Rightarrow \\mathrm{I}_{1} \\omega=\\left(\\mathrm{I}_{1}+\\mathrm{I}_{2}\\right) \\omega_{2} \\\\\r\n\r\n&\\Rightarrow \\omega_{2}=\\frac{\\mathrm{I}_{1} \\omega}{\\mathrm{I}_{1}+\\mathrm{I}_{2}}\r\n\r\n\\end{aligned}\\)", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e79e6f5bfc7ab78ae672", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 1, "question": {"text": "The impedance of a circuit consists of $3 \\Omega$ resistance and $4 \\Omega$ reactance. The power factor of the circuit is", "image": null}, "options": [{"id": "cKvuK", "text": "0.4", "isCorrect": false, "image": null}, {"id": "XtK3Z", "text": "0.6", "isCorrect": true, "image": null}, {"id": "Ul9wG", "text": "0.8", "isCorrect": false, "image": null}, {"id": "eICHF", "text": "1", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\tan \\phi=\\frac{\\mathrm{X}}{\\mathrm{R}} \\times \\frac{4}{3}$\r\nPower factor $=\\cos \\phi=\\frac{3}{5}=0.6$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "64c0e85a6f5bfc7ab78aed32", "title": "Parallel AC Circuits", "totalQuestions": 1, "questions": [{"_id": "64c0e7906f5bfc7ab78ae5f3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}], "question": {"text": "Which one of the following curves represents the variation of impedance ( $Z$ ) with frequency $f$ in series LCR circuit?", "image": null}, "options": [{"id": "VTm8E", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/GGtIsBiQGaY2PLOKHZ5GzOlvnCuBsxwozQTgj7G_BnE.original.fullsize.png\">", "image": null, "isCorrect": false}, {"id": "19Tdo", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/jM-xNwBH3CODhOPEvYzB7lLDsyr7Do97Ecg6AGDzJwA.original.fullsize.png\">", "image": null, "isCorrect": false}, {"id": "jmN4P", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/MKqaScywQ4CrVeN0NQq9IlaIHeUavAdfAR1qh_l5sis.original.fullsize.png\">", "image": null, "isCorrect": true}, {"id": "o8VKX", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/qiqsR7wDYuJEn0iHY0GiZpdRtqIL5HPN1D62lFNuTQs.original.fullsize.png\">", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$Z=\\sqrt{R^{2}+\\left(2 \\pi \\mathrm{fL}-\\frac{1}{2 \\pi \\mathrm{fC}}\\right)^{2}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
