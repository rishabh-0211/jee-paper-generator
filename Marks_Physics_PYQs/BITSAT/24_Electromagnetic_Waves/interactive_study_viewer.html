xt": "An electromagnetic wave passes through space and its equation is given by $\\mathrm{E}=\\mathrm{E}_{0} \\sin (\\omega \\mathrm{t}-\\mathrm{kx})$\nwhere $\\mathrm{E}$ is electric field. Energy density of electromagnetic wave in space is", "image": null}, "options": [{"id": "eTTb4", "text": "$\\frac{1}{2} \\varepsilon_{0} \\mathrm{E}_{0}^{2}$", "image": null, "isCorrect": true}, {"id": "xOqFE", "text": "$\\frac{1}{4} \\varepsilon_{0} \\mathrm{E}_{0}^{2}$", "image": null, "isCorrect": false}, {"id": "ktrtl", "text": "$\\varepsilon_{0} \\mathrm{E}_{0}^{2}$", "image": null, "isCorrect": false}, {"id": "aWePQ", "text": "$2 \\varepsilon_{0} \\mathrm{E}_{0}^{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Energy density\n$$\n=\\varepsilon_{0} \\mathrm{E}_{\\mathrm{rm}}^{2}=\\varepsilon_{0}\\left(\\frac{\\mathrm{E}_{0}}{\\sqrt{2}}\\right)^{2}=\\frac{1}{2} \\varepsilon_{0} \\mathrm{E}_{0}^{2}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7746f5bfc7ab78ae4f9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "The magnetic field in a travelling electromagnetic wave has a peak value of $20 \\mathrm{nT}$. The peak value of electric field strength is", "image": null}, "options": [{"id": "sbNoo", "text": "$3 \\mathrm{~V} / \\mathrm{m}$", "image": null, "isCorrect": false}, {"id": "V443v", "text": "$6 \\mathrm{~V} / \\mathrm{m}$", "image": null, "isCorrect": true}, {"id": "sOzOi", "text": "$9 \\mathrm{~V} / \\mathrm{m}$", "image": null, "isCorrect": false}, {"id": "cYoDM", "text": "$12 \\mathrm{~V} / \\mathrm{m}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\overrightarrow{\\mathrm{E}}_{0}=\\overrightarrow{\\mathrm{B}}_{0} \\times \\overrightarrow{\\mathrm{C}}$\n$$\n\\left|\\overrightarrow{\\mathrm{E}}_{0}\\right|=\\left|\\mathrm{B}_{0}\\right| \\cdot|\\overrightarrow{\\mathrm{C}}|=20 \\times 10^{-9} \\times 3 \\times 10^{8}=6 \\mathrm{~V} / \\mathrm{m}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64c0e85a6f5bfc7ab78aed35", "title": "X-Rays", "totalQuestions": 1, "questions": [{"_id": "64c0e7756f5bfc7ab78ae4ff", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "An X-ray tube is operated at $15 \\mathrm{kV}$. Calculate the upper limit of the speed of the electrons striking the target.", "image": null}, "options": [{"id": "ZWhS6", "text": "$7.26 \\times 10^{7} \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": true}, {"id": "XHgq9", "text": "$7.62 \\times 10^{7} \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "G7GLm", "text": "$7.62 \\times 10^{7} \\mathrm{~cm} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "826HL", "text": "$7.26 \\times 10^{9} \\mathrm{~m} / \\mathrm{s}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The maximum kinetic energy of an electron accelerated through a potential difference of $\\mathrm{V}$ volt is $\\frac{1}{2} \\mathrm{mv}^{2}=\\mathrm{eV}$\n$$\n\\begin{array}{l}\n\\therefore \\text { maximum velocity } \\mathrm{v}=\\sqrt{\\frac{2 \\mathrm{eV}}{\\mathrm{m}}} \\\\\n\\mathrm{v}=\\sqrt{\\frac{2 \\times 1.6 \\times 10^{-19} \\times 15000}{9.1 \\times 10^{-31}}} \\\\\n\\mathrm{v}=7.26 \\times 10^{7} \\mathrm{~m} / \\mathrm{s}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
