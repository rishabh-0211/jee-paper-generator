  <script>
    const data = {"index": 22, "chapterId": "61e7bd7f4ea4ca4e8a493885", "chapter": "Electromagnetic Induction", "exam": "BITSAT", "subject": "Physics", "totalTopics": 6, "totalQuestions": 24, "downloadTime": "2026-10-08 20:28:08", "topics": [{"index": 1, "topicId": "64c0e8596f5bfc7ab78aed2a", "title": "Magnetic Flux, Faraday's and Lenz law", "totalQuestions": 6, "questions": [{"_id": "67726d11c49e8ef28ee2b3fc", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}], "question": {"text": "Inside a solenoid of radius 0.5 m , magnetic field is changing at a rate of $50 \\times 10^{-6} \\mathrm{~T} / \\mathrm{s}$.\nAcceleration of an electron placed at a distance of 0.3 m from axis of solenoid will be", "image": null}, "options": [{"id": "dUnJ3", "text": "$23 \\times 10^6 \\mathrm{~ms}^{-2}$", "image": null, "isCorrect": true}, {"id": "d5sSP", "text": "$26 \\times 10^6 \\mathrm{~m} / \\mathrm{s}^2$", "image": null, "isCorrect": false}, {"id": "TJNmi", "text": "$1.3 \\times 10^9 \\mathrm{~ms}^{-2}$", "image": null, "isCorrect": false}, {"id": "D7rIV", "text": "$26 \\times 10^9 \\mathrm{~m} / \\mathrm{s}^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The changing magnetic field induce an electric field which will accelerate the electron.\nThe acceleration of electron will be\n$a=\\frac{e E}{m} \\quad[\\because F=q E]$\nTo find electric field $E$, we will use Faraday's electromagnetic induction.\n$\\mathrm{emf}, \\varepsilon=\\frac{-d \\phi}{d t}(B \\cdot A)$\nwhere, $B$ is the magnetic field and $A$ is the area of cross-section.\n$\\varepsilon=-A \\cdot \\frac{d B}{d t}=-\\pi r^2 \\frac{d B}{d t}$\nNow, electric field, $E=-\\frac{\\mathrm{emf}}{\\text { distance }}=-\\frac{\\dot{\\varepsilon}}{d}$\n$=\\frac{\\pi r^2}{d} \\frac{d B}{d t}$\nNow, acceleration, $a=\\frac{e}{m} \\frac{\\pi r^2}{d} \\frac{d B}{d t}$\n$=\\frac{1.6 \\times 10^{-19}}{9.1 \\times 10^{-31}} \\times \\frac{22}{7}$\n$\\begin{aligned} & \\times \\frac{(0.5)^2}{(0.3)} \\times 50 \\times 10^{-6} \\\\ & =23 \\times 10^6 \\mathrm{~ms}^{-2}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67726cf7c49e8ef28ee2b339", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}], "question": {"text": "A rectangular loop of length 2.5 m and width 2 m is placed at $60^{\\circ}$ to a magnetic field of 4 T . The loop is removed from the field in 10 sec . The average emf induced in the loop during this time is", "image": null}, "options": [{"id": "Wj1bw", "text": "$-2 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "uRe7c", "text": "$+2 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "9rzWF", "text": "$+1 \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "A0r2w", "text": "$-1 \\mathrm{~V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Averageemf, $\\mathrm{e}=\\frac{\\text { Changein flux }}{\\text { Time }}=-\\frac{\\Delta \\phi}{\\Delta \\mathrm{t}}$\n$=-\\frac{0-\\left(4 \\times(2.5 \\times 2) \\cos 60^{\\circ}\\right)}{10}=+1 \\mathrm{~V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8056f5bfc7ab78ae9e6", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>In a coil of resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>, the induced current developed by changing magnetic flux through it, is shown in figure as a function of time. The magnitude of change in flux through the coil is</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/8ea035ac-dd7e-479c-8dbe-0b7bb723d4d6-image.png\" style=\"width: 270px; height: 205px;\" /></p>", "image": null}, "options": [{"id": "QByIM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#160;</mo><mi>Wb</mi></math>", "isCorrect": false, "image": null}, {"id": "UOXZW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&#160;</mo><mi>Wb</mi></math>", "isCorrect": false, "image": null}, {"id": "nWsH9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>32</mn><mo>&#160;</mo><mi>Wb</mi></math>", "isCorrect": false, "image": null}, {"id": "w6fJ5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>&#160;</mo><mi>Wb</mi></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>According to the given graph <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>I</mi><mo>-</mo><mi>t</mi></mrow></mfenced></math>&nbsp;induced current <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>I</mi><mo>)</mo></math>&nbsp;is obtained from the slope. Hence, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mfrac><mn>1</mn><mi>R</mi></mfrac><mfrac><mrow><mi>d</mi><mi>&#981;</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>d</mi><mi>&#981;</mi><mo>=</mo><mi>I</mi><mi>d</mi><mi>t</mi><mo>&#215;</mo><mi>R</mi><mo>=</mo></math> area of triangle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>O</mi><mi>S</mi><mo>&#215;</mo><mi>R</mi><mo>=</mo><mfrac><mrow><mn>8</mn><mo>&#215;</mo><mn>0</mn><mo>.</mo><mn>2</mn></mrow><mn>2</mn></mfrac><mo>&#215;</mo><mn>50</mn><mo>=</mo><mn>40</mn><mo>&#160;</mo><mi>Wb</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7ae6f5bfc7ab78ae6f2", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 1, "question": {"text": "The ratio of secondary and primary turns of step-up transformer is $4: 1 .$ If a current of 4 A is applied to the primary, the induced current in secondary will be", "image": null}, "options": [{"id": "jgVvk", "text": "$8 \\mathrm{~A}$", "isCorrect": false, "image": null}, {"id": "O3ufL", "text": "$2 \\mathrm{~A}$", "isCorrect": false, "image": null}, {"id": "S90qb", "text": "$1 \\mathrm{~A}$", "isCorrect": true, "image": null}, {"id": "7NgkC", "text": "$0.5 \\mathrm{~A}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\frac{\\mathrm{I}_{\\mathrm{S}}}{\\mathrm{I}_{\\mathrm{P}}}=\\frac{\\mathrm{N}_{\\mathrm{P}}}{\\mathrm{N}_{\\mathrm{S}}}=\\frac{1}{4} \\Rightarrow \\mathrm{I}_{\\mathrm{S}}=\\frac{1}{4} \\times 4=1 \\mathrm{~A}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e79e6f5bfc7ab78ae671", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 1, "question": {"text": "The laws of electromagnetic induction have been used in the construction of a", "image": null}, "options": [{"id": "Y7Pxh", "text": "galvanometer", "isCorrect": false, "image": null}, {"id": "m7GDJ", "text": "voltmeter", "isCorrect": false, "image": null}, {"id": "UMyXa", "text": "electric motor", "isCorrect": false, "image": null}, {"id": "z4LP6", "text": "generator", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Hint:\r\nThe laws of Electromagnetic Induction give us idea about the various ways in which we can produce Electric Current using Electric or Magnetic field.\r\nCorrect Option is D.\r\nExplanation for correct answer:\r\n- Galvanometer is a device which detects current in the circuit.\r\n- Voltmeter is a device which measures potential difference between two points in the circuit.\r\n- Electric motor is a device which converts Electrical Energy into Mechanical Energy.\r\n- Electric Generator is an device which produces Electric Current from Mechanical energy, Chemical energy, or by using Magnetic or Electric Fields. The laws if Electromagnetic Induction are used in Electric Generator which produces Electric Current from Magnetic or Electric Fields.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7746f5bfc7ab78ae4f6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "Lenz's law is a consequence of the law of conservation of", "image": null}, "options": [{"id": "An6ah", "text": "charge", "image": null, "isCorrect": false}, {"id": "o5L6Y", "text": "mass", "image": null, "isCorrect": false}, {"id": "bCyIY", "text": "energy", "image": null, "isCorrect": true}, {"id": "SLkh3", "text": "momentum", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution available", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64c0e8596f5bfc7ab78aed2d", "title": "Induced Electric Field", "totalQuestions": 7, "questions": [{"_id": "65b7b87a97ae24e9e2db8cbc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}], "question": {"text": "A $12 \\mathrm{~V}$ battery connected to a coil of resistance $6 \\Omega$ through a switch, drives a constant current in the circuit. The switch is opened in $1 \\mathrm{~ms}$. The emf induced across the coil is $20 \\mathrm{~V}$. The inductance of the coil is :", "image": null}, "options": [{"id": "qrMp8", "text": "$5 \\mathrm{mH}$", "image": null, "isCorrect": false}, {"id": "uFzDk", "text": "$12 \\mathrm{mH}$", "image": null, "isCorrect": false}, {"id": "HrPZT", "text": "$8 \\mathrm{mH}$", "image": null, "isCorrect": false}, {"id": "jYyYf", "text": "$10 \\mathrm{mH}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Induced emf, $\\varepsilon=-\\mathrm{L} \\frac{\\mathrm{dI}}{\\mathrm{dt}} \\Rightarrow 20=-\\mathrm{L} \\frac{(0-2)}{10^{-3}}$ Hence, inductance of the coil.<br />$\\mathrm{L}=10 \\mathrm{mH}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b87197ae24e9e2db8c66", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}], "question": {"text": "A conducting loop of radius $\\frac{10}{\\sqrt{\\pi}} \\mathrm{cm}$ is placed perpendicular to a uniform magnetic field of $0.5 T$. The magnetic field is decreased to zero in $0.5 s$ at a steady rate. The induced emf in the circular loop at $0.25 s$ is:", "image": null}, "options": [{"id": "PnSqJ", "text": "$\\mathrm{emf}=1 \\mathrm{mV}$", "image": null, "isCorrect": false}, {"id": "zu6Vn", "text": "$\\mathrm{emf}=10 \\mathrm{mV}$", "image": null, "isCorrect": true}, {"id": "L94Ij", "text": "$\\mathrm{emf}=100 \\mathrm{mV}$", "image": null, "isCorrect": false}, {"id": "PFKJ5", "text": "$\\mathrm{emf}=5 \\mathrm{mV}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As $\\left.\\varepsilon\\right|_{t=0.5 \\mathrm{sec}}=-\\frac{\\mathrm{d} \\phi}{\\mathrm{dt}}$<br />$=-\\mathrm{A} \\frac{\\mathrm{dB}}{\\mathrm{dt}} \\quad\\left[\\because \\theta=0^{\\circ} \\Rightarrow \\cos \\theta=1\\right]$<br />$=-\\pi \\times\\left(\\frac{10}{\\sqrt{\\pi}}\\right)^2 \\times 10^{-4} \\times \\frac{0-0.5}{0.5}=10^{-2} \\mathrm{~V}=10 \\mathrm{mV}$<br />As $\\frac{d B}{d t}=$ constant $\\Rightarrow$ Induced emf will not change with time. So, $\\left.\\mathrm{e}\\right|_{0,5 \\mathrm{sec}}=\\left.\\mathrm{e}\\right|_{0.25 \\mathrm{sec}}=10 \\mathrm{mV}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7e56f5bfc7ab78ae8cf", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}], "type": "singleCorrect", "level": 1, "question": {"text": "A conducting circular loop is placed in a uniform magnetic field, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>025</mn><mo>&#160;</mo><mi mathvariant=\"normal\">T</mi></math> with its plane perpendicular to the loop. The radius of the loop is made to shrink at a constant rate of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi>mm</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. The induced emf when the radius is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi>cm</mi></math>, is", "image": null}, "options": [{"id": "FtVPq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>&#960;</mi><mo>&#160;</mo><mi>&#956;V</mi></math>", "isCorrect": false, "image": null}, {"id": "yQHi9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#960;</mi><mo>&#160;</mo><mi>&#956;V</mi></math>", "isCorrect": true, "image": null}, {"id": "gOD2r", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">&#960;</mi><mn>2</mn></mfrac><mi>&#956;V</mi></math>", "isCorrect": false, "image": null}, {"id": "9tHZB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi>&#956;V</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Here, magnetic field,<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>025</mn><mo>&#160;</mo><mi mathvariant=\"normal\">T</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math> Magnetic flux <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#981;</mi><mo>=</mo><mi>B</mi><mo>&#183;</mo><mi>A</mi><mo>=</mo><mi>B</mi><mo>&#183;</mo><mi>&#960;</mi><msup><mi>r</mi><mn>2</mn></msup></math></p><p>Induced <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>emf</mi><mo>&#160;</mo><mfenced close=\"|\" open=\"|\"><mi mathvariant=\"normal\">e</mi></mfenced><mo>=</mo><mfrac><mrow><mi>d</mi><mi>&#981;</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>B</mi><mi>&#960;</mi><mn>2</mn><mi>r</mi><mo>&#183;</mo><mfrac><mrow><mi>d</mi><mi>r</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>0</mn><mo>.</mo><mn>025</mn><mo>&#215;</mo><mi>&#960;</mi><mo>&#215;</mo><mn>2</mn><mo>&#215;</mo><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>&#215;</mo><mn>1</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>&#960;</mi><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>6</mn><mo>&#160;</mo></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>&#960;</mi><mo>&#160;</mo><mi>&#956;V</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7da6f5bfc7ab78ae867", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 3, "question": {"text": "A conducting circular loop is placed in a uniform magnetic field of $0.04 \\mathrm{~T}$ with its plane perpendicular to the magnetic field. The radius of the loop starts shrinking at $2 \\mathrm{~mm} / \\mathrm{s}$. The induced emf in the loop when the radius is $2 \\mathrm{~cm}$ is", "image": null}, "options": [{"id": "4DjLK", "text": "$4.8 \\pi \\mu \\mathrm{V}$", "isCorrect": false, "image": null}, {"id": "ZApuy", "text": "$0.8 \\pi \\mu \\mathrm{V}$", "isCorrect": false, "image": null}, {"id": "luEQ9", "text": "$1.6 \\pi \\mu \\mathrm{V}$", "isCorrect": false, "image": null}, {"id": "t03eX", "text": "$3.2 \\pi \\mu \\mathrm{V}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Induced emf in the loop is given by\r\n\r\n$\\mathrm{e}=-\\mathrm{B} \\cdot \\frac{\\mathrm{d} \\mathrm{A}}{\\mathrm{dt}}$ where $\\mathrm{A}$ is the area of the loop.\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n\\mathrm{e}=-\\mathrm{B} \\cdot \\frac{\\mathrm{d}}{\\mathrm{dt}}\\left(\\pi \\mathrm{r}^{2}\\right)=-\\mathrm{B} \\pi 2 \\mathrm{r} \\frac{\\mathrm{dr}}{\\mathrm{dt}} \\\\\r\n\r\n\\mathrm{r}=2 \\mathrm{~cm}=2 \\times 10^{-2} \\mathrm{~m} \\\\\r\n\r\n\\mathrm{dr}=2 \\mathrm{~mm}=2 \\times 10^{-3} \\mathrm{~m} \\\\\r\n\r\n\\mathrm{dt}=1 \\mathrm{~s} \\\\\r\n\r\n\\mathrm{e}=-0.04 \\times 3.14 \\times 2 \\times 2 \\times 10^{-2} \\times \\frac{2 \\times 10^{-3}}{1} \\mathrm{~V} \\\\\r\n\r\n=0.32 \\pi \\times 10^{-5} \\mathrm{~V} \\\\\r\n\r\n=3.2 \\pi \\times 10^{-6} \\mathrm{~V} \\\\\r\n\r\n=3.2 \\pi \\mu \\mathrm{V}\r\n\r\n\\end{array}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7c86f5bfc7ab78ae7d7", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 1, "question": {"text": "A conducting square loop is placed in a magnetic field $B$ with its plane perpendicular to the field. The sides of the loop start shrinking at a constant rate $\\alpha$. The induced emf in the loop at an instant when its side is ' $a$ ' is", "image": null}, "options": [{"id": "3WRHM", "text": "$2 a \\alpha B$", "isCorrect": true, "image": null}, {"id": "tnXOF", "text": "$a^{2} \\alpha B$", "isCorrect": false, "image": null}, {"id": "c91bU", "text": "$2 a^{2} \\alpha B$", "isCorrect": false, "image": null}, {"id": "9RtR9", "text": "$a \\alpha B$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "At any time $t$, the side of the square $a=\\left(a_{0}\\right.$ $-\\alpha t),$ where $a_{0}=$ side at $t=0$\r\n\r\nAt this instant, flux through the square :\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n\\phi=B A \\cos 0^{\\circ}=B\\left(a_{0}-\\alpha t\\right)^{2} \\\\\r\n\r\n\\therefore \\text { emf induced } E=-\\frac{d \\phi}{d t} \\\\\r\n\r\n\\Rightarrow E=-B .2\\left(a_{0}-\\alpha t\\right)(0-\\alpha)=+2 \\alpha a B\r\n\r\n\\end{array}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7bc6f5bfc7ab78ae769", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 3, "question": {"text": "A coil 10 turns and a resistance of $20 \\Omega$ is connected in series with B.G of resistance $30 \\Omega$. The coil is placed with its plane perpendicular to the direction of a uniform magnetic field of induction $10^{-2} \\mathrm{~T}$. If it is now turned through an angle of $60^{\\circ}$ about an axis in its plane. Find the charge induced in the coil. (Area of a coil $=10^{-2} \\mathrm{~m}^{2}$ )", "image": null}, "options": [{"id": "xrbvh", "text": "$2 \\times 10^{-5} \\mathrm{C}$", "isCorrect": false, "image": null}, {"id": "9BZwn", "text": "$3.2 \\times 10^{-5} \\mathrm{C}$", "isCorrect": false, "image": null}, {"id": "nvaq4", "text": "$1 \\times 10^{-5} \\mathrm{C}$", "isCorrect": true, "image": null}, {"id": "MaO2e", "text": "$5.5 \\times 10^{-5} \\mathrm{C}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given: $\\mathrm{n}=10$ turns, $\\mathrm{R}_{\\text {coil }}=20 \\Omega, \\mathrm{R}_{\\mathrm{G}}=30 \\Omega$, Total resistance in the circuit $=20+30$\r\n\r\n$=50 \\Omega$\r\n\r\n$\\mathrm{A}=10^{-2} \\mathrm{~m}^{2}, \\mathrm{~B}=10^{-2} \\mathrm{~T}, \\phi_{1}=0^{\\circ}, \\phi_{2}=60^{\\circ}$\r\n\r\n$\\mathrm{q}=\\frac{\\phi_{1}-\\phi_{2}}{\\mathrm{R}}=\\frac{\\mathrm{Bn} \\mathrm{A} \\cos \\theta_{1}-\\mathrm{Bn} \\mathrm{A} \\cos \\theta_{2}}{\\mathrm{R}}$\r\n\r\n$=\\frac{\\operatorname{Bn} \\mathrm{A}(\\cos 0-\\cos 60)}{\\mathrm{R}}=\\frac{\\mathrm{BnA}(1-0.5)}{\\mathrm{R}}$\r\n\r\n$=\\frac{0.5 \\times 10^{-2} \\times 10 \\times 10^{-2}}{50}=\\frac{50 \\times 10^{-5}}{50}$\r\n\r\n$=1 \\times 10^{-5} \\mathrm{C} \\quad$ (Charge induced in a coil)", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7ae6f5bfc7ab78ae6f0", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 1, "question": {"text": "Eddy currents are produced when", "image": null}, "options": [{"id": "3GOIE", "text": "a metal is kept in varying magnetic field", "isCorrect": true, "image": null}, {"id": "FEfkF", "text": "a metal is kept in steady magnetic field", "isCorrect": false, "image": null}, {"id": "OORzs", "text": "a circular coil is placed in a magnetic field", "isCorrect": false, "image": null}, {"id": "k4NN3", "text": "through a circular coil, current is passed", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Eddy can be created when a conductor is moving through a magnetic field, or when the magnetic field surrounding a stationary conductor is varying. Option A", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64c0e8596f5bfc7ab78aed2c", "title": "Motional and Rotational EMF", "totalQuestions": 4, "questions": [{"_id": "64c0e81e6f5bfc7ab78aeabc", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}], "type": "singleCorrect", "level": 1, "question": {"text": "A metal disc of radius $100 \\mathrm{~cm}$ is rotated at a constant angular speed of $60 \\mathrm{rad} / \\mathrm{s}$ in a plane at right angles to an external field of magnetic induction $0.05 \\mathrm{~Wb} / \\mathrm{m}^{2}$. The emf induced between the centre and a point on the rim will be", "image": null}, "options": [{"id": "GASHx", "text": "$3 \\mathrm{~V}$", "isCorrect": false, "image": null}, {"id": "ekWgs", "text": "$1.5 \\mathrm{~V}$", "isCorrect": true, "image": null}, {"id": "OwPAs", "text": "$6 \\mathrm{~V}$", "isCorrect": false, "image": null}, {"id": "J8tJU", "text": "$9 \\mathrm{~V}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Induced emf produced between the centre and a point on the disc is given by\r\n\r\n$\\begin{array}{l}\r\n\r\ne=\\frac{1}{2} \\omega \\mathrm{BR}^{2} \\\\\r\n\r\n\\omega=60 \\mathrm{rad} / \\mathrm{s}, \\mathrm{B}=0.05 \\mathrm{~Wb} / \\mathrm{m}^{2} \\\\\r\n\r\n\\text { and } \\mathrm{R}=100 \\mathrm{~cm}=1 \\mathrm{~m} \\\\\r\n\r\n\\text { We get } e=\\frac{1}{2} \\times 60 \\times 0.05 \\times(1)^{2}=1.5 \\mathrm{~V}\r\n\r\n\\end{array}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8136f5bfc7ab78aea5c", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 1, "question": {"text": "A conducting square loop of side $\\mathrm{L}$ and resistance $\\mathrm{R}$ moves in its plane with a uniform velocity v perpendicular to one of its side. A magnetic induction $\\mathrm{B}$ constant in time and space, pointing perpendicular and into the plane of the loop exists everywhere.\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/v3-1Mt3mK4D2OS5PERmiMAk_YvGxnqyAuKIeBkon8vw.original.fullsize.png\"><br>\r\n\r\nThe current induced in the loop is", "image": null}, "options": [{"id": "GMG6K", "text": "$\\frac{\\mathrm{B} \\ell \\mathrm{v}}{\\mathrm{R}}$ clockwise", "isCorrect": false, "image": null}, {"id": "pwN2Z", "text": "$\\frac{\\mathrm{B} \\ell \\mathrm{v}}{\\mathrm{R}}$ anticlockwise", "isCorrect": false, "image": null}, {"id": "oZODu", "text": "$\\frac{2 \\mathrm{~B} \\ell v}{\\mathrm{R}}$ anticlockwise", "isCorrect": false, "image": null}, {"id": "bYdaO", "text": "zero", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Since the magnetic field is uniform the flux $f$ through the square loop at any time $t$ is constant, because\r\n\r\n$\\begin{array}{l}\r\n\r\n\\mathrm{f}=\\mathrm{B} \\times \\mathrm{A}=\\mathrm{B} \\times \\mathrm{L}^{2}=\\text { constant } \\\\\r\n\r\n\\therefore \\varepsilon=-\\frac{\\mathrm{d} \\phi}{\\mathrm{dt}}=\\text { zero }\r\n\r\n\\end{array}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8036f5bfc7ab78ae9cf", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}], "type": "singleCorrect", "level": 2, "question": {"text": "A semicircular wire of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math> rotates in uniform magnetic field <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> about its diameter with angular velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#969;</mi></math>. If the total resistance of the circuit is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>, then the mean power generated per period of rotation is", "image": null}, "options": [{"id": "H0gVZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mfenced><mrow><mi>&#960;</mi><mi>B</mi><msup><mi>r</mi><mn>2</mn></msup><mi>&#969;</mi></mrow></mfenced><mn>2</mn></msup><mrow><mn>8</mn><mo>&#160;</mo><mi mathvariant=\"normal\">R</mi></mrow></mfrac></math>", "isCorrect": true, "image": null}, {"id": "k3bfn", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>&#960;</mi><mi>B</mi><mi>r</mi><msup><mi>&#969;</mi><mn>2</mn></msup></mrow><mrow><mn>8</mn><mi>R</mi></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "ytHYo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mfenced><mrow><mi>&#960;</mi><mi>B</mi><mi>r</mi><mi>&#969;</mi></mrow></mfenced><mn>2</mn></msup><mrow><mn>8</mn><mo>&#160;</mo><mi mathvariant=\"normal\">R</mi></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "xxTgN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The flux linked with coil (made of wire of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>) of area <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and magnetic field <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>, is given by</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#981;</mi><mo>=</mo><mi>B</mi><mi>A</mi><mo>&#160;</mo><mi>cos</mi><mo>&#160;</mo><mi>&#952;</mi><mo>=</mo><mi>B</mi><mo>&#160;</mo><mfenced><mfrac><mrow><mi>&#960;</mi><msup><mi>r</mi><mn>2</mn></msup></mrow><mn>2</mn></mfrac></mfenced><mo>&#160;</mo><mi>cos</mi><mo>&#160;</mo><mi>&#969;</mi><mi>t</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#981;</mi><mo>=</mo><mfrac><mrow><mi>&#960;</mi><mi>B</mi><msup><mi>r</mi><mn>2</mn></msup></mrow><mn>2</mn></mfrac><mo>&#160;</mo><mi>cos</mi><mo>&#160;</mo><mi>&#969;</mi><mi>t</mi></math>&nbsp; &nbsp;[<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8757;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>A</mi><mo>=</mo><mfrac><mrow><mi>&#960;</mi><msup><mi>r</mi><mn>2</mn></msup></mrow><mn>2</mn></mfrac></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi><mo>=</mo><mi>&#969;</mi><mi>t</mi></math>]</p><p>By Faraday&#39;s law of electromagnetic induction, induced emf,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>e</mi><mo>=</mo><mo>-</mo><mfrac><mrow><mi>d</mi><mi>&#981;</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math></p><p>Hence, after differentiating,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>e</mi><mo>=</mo><mo>-</mo><mfrac><mi>d</mi><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mfenced><mrow><mfrac><mrow><mi>&#960;</mi><mi>B</mi><msup><mi>r</mi><mn>2</mn></msup></mrow><mn>2</mn></mfrac><mo>&#160;</mo><mi>cos</mi><mo>&#160;</mo><mi>&#969;</mi><mi>t</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mi>&#960;</mi><mi>B</mi><msup><mi>r</mi><mn>2</mn></msup><mi>&#969;</mi></mrow><mn>2</mn></mfrac><mo>&#160;</mo><mi>sin</mi><mo>&#160;</mo><mi>&#969;</mi><mi>t</mi></math>&nbsp; (where, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo></math> resistance in the circuit)</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math>&nbsp;Power&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mfrac><msup><mi>e</mi><mn>2</mn></msup><mi>R</mi></mfrac><mo>=</mo><mfrac><mrow><msup><mi>&#960;</mi><mn>2</mn></msup><msup><mi>B</mi><mn>2</mn></msup><msup><mi>r</mi><mn>4</mn></msup><msup><mi>&#969;</mi><mn>2</mn></msup><mo>&#160;</mo><msup><mi>sin</mi><mn>2</mn></msup><mi>&#969;</mi><mi>t</mi></mrow><mrow><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">R</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math>&nbsp;Mean power&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>P</mi><mo>&#175;</mo></mover><mo>=</mo><mfrac><mrow><msup><mi>&#960;</mi><mn>2</mn></msup><msup><mi>B</mi><mn>2</mn></msup><msup><mi>r</mi><mn>4</mn></msup><msup><mi>&#969;</mi><mn>2</mn></msup></mrow><mrow><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">R</mi></mrow></mfrac><mo>&#183;</mo><mover><mrow><msup><mi>sin</mi><mn>2</mn></msup><mi>&#969;</mi><mi>t</mi></mrow><mo>&#175;</mo></mover></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><msup><mi>&#960;</mi><mn>2</mn></msup><msup><mi>B</mi><mn>2</mn></msup><msup><mi>r</mi><mn>4</mn></msup><msup><mi>&#969;</mi><mn>2</mn></msup></mrow><mrow><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">R</mi></mrow></mfrac><mo>&#183;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math>&nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><mrow><mo>&#8757;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mover><mrow><msup><mi>sin</mi><mn>2</mn></msup><mi>&#969;</mi><mi>t</mi></mrow><mo>&#175;</mo></mover><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><msup><mfenced><mrow><mi>&#960;</mi><mi>B</mi><msup><mi>r</mi><mn>2</mn></msup><mi>&#969;</mi></mrow></mfenced><mn>2</mn></msup><mrow><mn>8</mn><mo>&#160;</mo><mi mathvariant=\"normal\">R</mi></mrow></mfrac></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7906f5bfc7ab78ae5f2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}], "question": {"text": "A metal rod of length $1 \\mathrm{~m}$ is rotated about one of its ends in a plane right angles to a field of inductance $2.5 \\times 10^{-3} \\mathrm{~Wb} / \\mathrm{m}^{2}$. If it makes 1800 revolutions/min. Calculate induced e.m.f. between its ends.", "image": null}, "options": [{"id": "Zh6po", "text": "$2.471 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "mgpcE", "text": "$3.171 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "E7pOw", "text": "$0.471 \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "5aEQv", "text": "$1.771 \\mathrm{~V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given : $\\ell=1 \\mathrm{~m}, \\mathrm{~B}=5 \\times 10^{-3} \\mathrm{~Wb} / \\mathrm{m}^{2}$\n$$\n\\mathrm{f}=\\frac{1800}{60}=30 \\text { rotations } / \\mathrm{sec}\n$$\nIn one rotation, the moving rod of the metal traces a circle of radius $\\mathrm{r}=\\ell$\n$\\therefore$ Area swept in one rotation $=\\pi r^{2}$\n$$\n\\begin{array}{l}\n\\frac{\\mathrm{d} \\phi}{\\mathrm{dt}}=\\frac{\\mathrm{d}}{\\mathrm{dt}}(\\mathrm{BA})=\\mathrm{B} \\cdot \\frac{\\mathrm{d} \\mathrm{A}}{\\mathrm{dt}}=\\frac{\\mathrm{B} \\pi \\mathrm{r}^{2}}{\\mathrm{~T}} \\\\\n=\\mathrm{B} \\mathrm{f} \\pi \\mathrm{r}^{2}=\\left(5 \\times 10^{-3}\\right) \\times 3.14 \\times 30 \\times 1=0.471 \\mathrm{~V}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "64c0e85a6f5bfc7ab78aed2f", "title": "Inductance", "totalQuestions": 1, "questions": [{"_id": "64c0e7f36f5bfc7ab78ae942", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Two inductors <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>1</mn></msub></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>2</mn></msub></math> are connected in parallel and a time varying current flows as shown in figure. The ratio ot current <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>i</mi><mn>1</mn></msub><msub><mi>i</mi><mn>2</mn></msub></mfrac></math> at any ime <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi></math> Is<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/e395eb82-c1b7-4c9b-8cae-857766929c90-image.png\" style=\"width: 350px; height: 174px;\" /></p>", "image": null}, "options": [{"id": "k510b", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>L</mi><mn>2</mn></msub><msub><mi>L</mi><mn>1</mn></msub></mfrac></math>", "isCorrect": true, "image": null}, {"id": "9rQAK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>L</mi><mn>1</mn></msub><msub><mi>L</mi><mn>2</mn></msub></mfrac></math>", "isCorrect": false, "image": null}, {"id": "cgjBl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msubsup><mi>L</mi><mn>2</mn><mn>2</mn></msubsup><msup><mfenced><mrow><msub><mi>L</mi><mn>1</mn></msub><mo>+</mo><msub><mi>L</mi><mn>2</mn></msub></mrow></mfenced><mn>2</mn></msup></mfrac></math>", "isCorrect": false, "image": null}, {"id": "j5Ngi", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msubsup><mi>L</mi><mn>1</mn><mn>2</mn></msubsup><msup><mfenced><mrow><msub><mi>L</mi><mn>1</mn></msub><mo>+</mo><msub><mi>L</mi><mn>2</mn></msub></mrow></mfenced><mn>2</mn></msup></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>As the inductors are in parallel, induced emf across the two inductors is the same, i.e.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>e</mi><mn>1</mn></msub><mo>=</mo><msub><mi>e</mi><mn>2</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>1</mn></msub><mfenced><mfrac><mrow><mi>d</mi><msub><mi>i</mi><mn>1</mn></msub></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mfenced><mo>=</mo><msub><mi>L</mi><mn>2</mn></msub><mfenced><mfrac><mrow><mi>d</mi><msub><mi>i</mi><mn>2</mn></msub></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mfenced></math></p><p>On integrating both sides, we get<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>1</mn></msub><mo>&#8747;</mo><mfrac><mrow><mi>d</mi><msub><mi>i</mi><mn>1</mn></msub></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><msub><mi>L</mi><mn>2</mn></msub><mo>&#8747;</mo><mfrac><mrow><mi>d</mi><msub><mi>i</mi><mn>2</mn></msub></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>1</mn></msub><msub><mi>i</mi><mn>1</mn></msub><mo>=</mo><msub><mi>L</mi><mn>2</mn></msub><msub><mi>i</mi><mn>2</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><msub><mi>i</mi><mn>1</mn></msub><msub><mi>i</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><msub><mi>L</mi><mn>2</mn></msub><msub><mi>L</mi><mn>1</mn></msub></mfrac></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "64c0e8596f5bfc7ab78aed2b", "title": "Self and Mutual Inductance", "totalQuestions": 4, "questions": [{"_id": "67726d04c49e8ef28ee2b398", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}], "question": {"text": "There are two long co-axial solenoids of same length $l$. The inner and outer coils have radii $r_1$ and $r_2$ and number of turns per unit length $n_1$ and $n_2$, respectively. The ratio of mutual inductance to the self-inductance of the inner-coil is:", "image": null}, "options": [{"id": "4O5wr", "text": "$\\frac{n_1}{n_2}$", "image": null, "isCorrect": false}, {"id": "1VxiZ", "text": "$\\frac{n_2}{n_1} \\cdot \\frac{n_1}{r_2}$", "image": null, "isCorrect": false}, {"id": "NmICf", "text": "$\\frac{n_2}{n_1} \\cdot \\frac{r_2^2}{r_1^2}$", "image": null, "isCorrect": false}, {"id": "aU09f", "text": "$\\frac{n_2}{n_1}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The rate of mutual inductance is given by\n$\\mathrm{M}=\\mu_0 \\mathrm{n}_1 \\mathrm{n}_2 \\pi \\mathrm{~m}_1^2$     ....(i)\nThe rate of self inductance is given by\n$\\mathrm{L}=\\mu_0 \\mathrm{n}_1^2 \\pi \\mathrm{r}_1^2$    .....(ii)\nDividing (i) by (ii)\n$\\Rightarrow \\frac{\\mathrm{M}}{\\mathrm{L}}=\\frac{\\mathrm{n}_2}{\\mathrm{n}_1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7ae6f5bfc7ab78ae6f1", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 2, "question": {"text": "Two coaxial solenoids are made by winding thin insulated wire over a pipe of cross-sectional area $\\mathrm{A}=10 \\mathrm{~cm}^{2}$ and length $=20 \\mathrm{~cm} .$ If one of the solenoid has 300 turns and the other 400 turns, their mutual inductance is $\\left(\\mu_{0}=4 \\pi \\times 10^{-7} \\mathrm{TmA}^{-1}\\right)$", "image": null}, "options": [{"id": "4rVA0", "text": "$2.4 \\pi \\times 10^{-5} \\mathrm{H}$", "isCorrect": false, "image": null}, {"id": "Qyn8J", "text": "$4.8 \\pi \\times 10^{-4} \\mathrm{H}$", "isCorrect": false, "image": null}, {"id": "tgDuV", "text": "$4.8 \\pi \\times 10^{-5} \\mathrm{H}$", "isCorrect": false, "image": null}, {"id": "uAcZg", "text": "$2.4 \\pi \\times 10^{-4} \\mathrm{H}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "$\\begin{aligned} M &=\\frac{\\mu_{0} \\mathrm{~N}_{1} \\mathrm{~N}_{2} \\mathrm{~A}}{\\ell} \\\\ &=\\frac{4 \\pi \\times 10^{-7} \\times 300 \\times 400 \\times 100 \\times 10^{-4}}{0.2} \\\\ &=2.4 \\pi \\times 10^{-4} \\mathrm{H} \\end{aligned}$\r\n\r\n#", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7826f5bfc7ab78ae578", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}], "question": {"text": "Two solenoids of same cross-sectional area have their lengths and number of turns in ratio of 1: 2 . The ratio of self-inductance of two solenoids is", "image": null}, "options": [{"id": "mrRbb", "text": "1: 1", "image": null, "isCorrect": false}, {"id": "nw6cz", "text": "1: 2", "image": null, "isCorrect": true}, {"id": "iAxhE", "text": "2: 1", "image": null, "isCorrect": false}, {"id": "dQgXg", "text": "1: 4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From $L=\\frac{\\mu_{0} N^{2} A}{1} \\alpha \\frac{N^{2}}{1}$\nwe get, $\\frac{\\mathrm{L}_{1}}{\\mathrm{~L}_{2}}=\\frac{(1 / 2)^{2}}{1 / 2}=\\frac{1}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7826f5bfc7ab78ae577", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}], "question": {"text": "The back emf induced in a coil, when current changes from 1 ampere to zero in one milli-second, is 4 volts, the self inductance of the coil is", "image": null}, "options": [{"id": "3lCxK", "text": "1 henry", "image": null, "isCorrect": false}, {"id": "QYZz8", "text": "4 henry", "image": null, "isCorrect": false}, {"id": "48Ut0", "text": "$10^{-3}$ henry", "image": null, "isCorrect": false}, {"id": "CSv1U", "text": "$4 \\times 10^{-3}$ henry", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\mathrm{e}=-\\mathrm{L} \\frac{\\mathrm{di}}{\\mathrm{dt}}$\nBut $\\mathrm{e}=4 \\mathrm{~V}$ and $\\frac{\\mathrm{di}}{\\mathrm{dt}}=\\frac{0-1}{10^{-3}}=-1 / 10^{-3}$\n$\\therefore \\frac{-1}{10^{-3}}(-\\mathrm{L})=4 \\Rightarrow \\mathrm{L}=4 \\times 10^{-3}$ henry", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "64c0e85a6f5bfc7ab78aed2e", "title": "LR Circuit", "totalQuestions": 2, "questions": [{"_id": "65b7b87197ae24e9e2db8c65", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}], "question": {"text": "In an LC oscillator, if values of inductance and capacitance become twice and eight times, respectively, then the resonant frequency of oscillator becomes $\\mathrm{x}$ times its initial resonant frequency $\\omega_0$. The value of $x$ is:", "image": null}, "options": [{"id": "1Ngo6", "text": "$1 / 4$", "image": null, "isCorrect": true}, {"id": "TMKGq", "text": "16", "image": null, "isCorrect": false}, {"id": "eHcJC", "text": "$1 / 16$", "image": null, "isCorrect": false}, {"id": "4yaBR", "text": "4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The resonance frequency of LC oscillations circuit is<br />$\\omega=\\frac{1}{\\sqrt{\\mathrm{L}^{\\prime} \\mathrm{C}^{\\prime}}} \\Rightarrow \\mathrm{L}^{\\prime} \\rightarrow 2 \\mathrm{~L}$<br />$\\mathrm{C}^{\\prime} \\rightarrow 8 \\mathrm{C}$<br />$\\omega=\\frac{1}{\\sqrt{2 \\mathrm{~L} \\times 8 \\mathrm{C}}}=\\frac{1}{4 \\sqrt{\\mathrm{LC}}} 9 \\omega_0=\\frac{1}{\\sqrt{\\mathrm{LC}}}$<br />$\\omega=\\frac{\\omega_0}{4}$ So, $x=\\frac{1}{4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7d76f5bfc7ab78ae84c", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 3, "question": {"text": "An inductor of inductance $L=400 \\mathrm{mH}$ and resistors of resistance $R_{1}=2 \\Omega$ and $R_{2}=2 \\Omega$ are connected to a battery of emf $12 \\mathrm{~V}$ as shown in the figure. The internal resistance of the battery is negligible. The switch $S$ is closed at $t=0 .$ The potential drop across $L$ as a function of time is\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/7X35j8e3bYNhi279A5VMee8ezq0Qbq7rDaH9QG_3jeg.original.fullsize.png\">", "image": null}, "options": [{"id": "iSFfx", "text": "$\\frac{12}{t} e^{-3 t} \\mathrm{~V}$", "isCorrect": false, "image": null}, {"id": "vUU5J", "text": "$6\\left(1-e^{-t / 0.2}\\right) \\mathrm{V}$", "isCorrect": false, "image": null}, {"id": "UTwPb", "text": "$12 \\mathrm{e}^{-5 t} \\mathrm{~V}$", "isCorrect": true, "image": null}, {"id": "owcwj", "text": "$6 \\mathrm{e}^{-5 t} \\mathrm{~V}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Growth in current in $L R_{2}$ branch when switch is closed is given by\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\ni=\\frac{E}{R_{2}}\\left[1-e^{-R_{2} t / L}\\right] \\\\\r\n\r\n\\Rightarrow \\frac{d i}{d t}=\\frac{E}{R_{2}} \\cdot \\frac{R_{2}}{L} e^{-R_{2} t / L}=\\frac{E}{L} e^{-\\frac{R_{2} t}{L}}\r\n\r\n\\end{array}\r\n\r\n$$\r\n\r\nHence, potential drop across $\\mathbf{L}=\\left(\\frac{E}{L} e^{-R_{2} t / L}\\right) L=E e^{-R_{2} t / L}$\r\n\r\n$=12 e^{-\\frac{2 t}{400 \\times 10^{-3}}}=12 \\mathrm{e}^{-5 t} \\mathrm{~V}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
