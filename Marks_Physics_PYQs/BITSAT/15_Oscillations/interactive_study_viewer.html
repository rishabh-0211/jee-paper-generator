ortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 2, "question": {"text": "An instantaneous displacement of a simple harmonic oscillator is $x=A \\cos (\\omega t+\\pi / 4)$. Its speed will be maximum at time", "image": null}, "options": [{"id": "VYZaT", "text": "$\\pi / 4 \\omega$", "isCorrect": true, "image": null}, {"id": "RksvO", "text": "$\\pi / 2 \\omega$", "isCorrect": false, "image": null}, {"id": "2BoUc", "text": "$\\pi / \\omega$", "isCorrect": false, "image": null}, {"id": "Ww0NT", "text": "$2 \\pi \\omega$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Velocity, $v=\\frac{d x}{d t}=-A \\omega \\sin (\\omega t+\\pi / 4)$\r\n\r\nVelocity will be maximum, when $\\omega t+\\pi / 4=\\pi / 2$ or $\\omega t=\\pi / 2-\\pi / 4=\\pi / 4$ or $t=\\pi / 4 \\omega$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7f76f5bfc7ab78ae965", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}], "type": "singleCorrect", "level": 3, "question": {"text": "If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>,</mo><mo>&#160;</mo><mi>v</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math> denote the displacement, the velocity and the acceleration of a particle executing <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mi>H</mi><mi>M</mi></math>&nbsp;of time period <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math>. Then, which of the following does not change with time?", "image": null}, "options": [{"id": "VzoWJ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>a</mi><mi>T</mi></mrow><mi>x</mi></mfrac></math>", "isCorrect": true, "image": null}, {"id": "A9jr8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mi>T</mi><mo>+</mo><mn>2</mn><mi>&#960;</mi><mi>v</mi></math>", "isCorrect": false, "image": null}, {"id": "z0bx1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>a</mi><mi>T</mi></mrow><mi>v</mi></mfrac></math>", "isCorrect": false, "image": null}, {"id": "zXqzI", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>a</mi><mn>2</mn></msup><msup><mi>T</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn><msup><mi>&#960;</mi><mn>2</mn></msup><msup><mi>v</mi><mn>2</mn></msup></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>We know, instantaneous displacement,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mi>r</mi><mo>&#160;</mo><mi>sin</mi><mi>&#969;</mi><mi>t</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8757;</mo></math> Instantaneous velocity, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mfrac><mrow><mi>d</mi><mi>x</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mi>r</mi><mi>&#969;</mi><mo>&#160;</mo><mi>cos</mi><mi>&#969;</mi><mi>t</mi></math></p><p>So. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>a</mi><mi>T</mi></mrow><mi>x</mi></mfrac><mo>=</mo><mfrac><mrow><mo>-</mo><msup><mi>&#969;</mi><mn>2</mn></msup><mi>x</mi><mo>&#215;</mo><mi>T</mi></mrow><mi>x</mi></mfrac><mo>=</mo><mo>-</mo><msup><mi>&#969;</mi><mn>2</mn></msup><mi>T</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mn>4</mn><msup><mi>&#960;</mi><mn>2</mn></msup></mrow><msup><mi>T</mi><mn>2</mn></msup></mfrac><mo>&#215;</mo><mi>T</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mo>-</mo><mn>4</mn><msup><mi>&#960;</mi><mn>2</mn></msup></mrow><mi>T</mi></mfrac><mo>=</mo></math> constant</p><p>and,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;&#160;</mo><mfrac><mrow><mi>a</mi><mi>T</mi></mrow><mi>V</mi></mfrac><mo>=</mo><mfrac><mrow><mo>-</mo><msup><mi>&#969;</mi><mn>2</mn></msup><mi>r</mi><mi>sin</mi><mi>&#969;</mi><mi>t</mi><mo>&#215;</mo><mi>T</mi></mrow><mrow><mi>&#969;</mi><mi>r</mi><mi>cos</mi><mi>&#969;</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mi>&#969;</mi><mi>T</mi><mi>tan</mi><mi>&#969;</mi><mi>T</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mfrac><mrow><mn>2</mn><mi>&#960;</mi></mrow><mi>T</mi></mfrac><mo>&#215;</mo><mi>T</mi><mo>&#160;</mo><mi>tan</mi><mi>&#969;</mi><mi>t</mi><mo>=</mo></math>not constant</p><p>Similarly, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mi>T</mi><mo>+</mo><mn>2</mn><mi>&#960;</mi><mi>v</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>a</mi><mn>2</mn></msup><msup><mi>T</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn><msup><mi>&#960;</mi><mn>2</mn></msup><msup><mi>v</mi><mn>2</mn></msup></math> is also not constant,<br />i.e. both are function of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7e76f5bfc7ab78ae8db", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}], "type": "singleCorrect", "level": 3, "question": {"text": "<p>A load of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>&nbsp;falls from a height <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math> on the scale pan hung from a spring as shown. If the spring constant is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi></math> and the mass of the scale pan is zero and the mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> does not bounce relative to the pan, then the amplitude of vibration is&nbsp;</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/a5eae703-e0ed-4086-92f2-856e6fc9b23a-image.png\" style=\"width: 200px; height: 306px;\" /></p>", "image": null}, "options": [{"id": "zJc57", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>m</mi><mi>g</mi></mrow><mi>k</mi></mfrac></math>", "isCorrect": false, "image": null}, {"id": "sjEg7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>m</mi><mi>g</mi></mrow><mi>k</mi></mfrac><msqrt><mn>1</mn><mo>+</mo><mfrac><mrow><mn>2</mn><mi>h</mi><mi>k</mi></mrow><mrow><mi>m</mi><mi>g</mi></mrow></mfrac></msqrt></math>", "isCorrect": true, "image": null}, {"id": "LcJhT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>m</mi><mi>g</mi></mrow><mi>k</mi></mfrac><mo>+</mo><mfrac><mrow><mi>m</mi><mi>g</mi></mrow><mi>k</mi></mfrac><msqrt><mfrac><mrow><mn>1</mn><mo>+</mo><mn>2</mn><mi>h</mi><mi>k</mi></mrow><mrow><mi>m</mi><mi>g</mi></mrow></mfrac></msqrt></math>", "isCorrect": false, "image": null}, {"id": "8NwnF", "text": "None of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>From the energy conservation principle,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mi>g</mi><mi>h</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>k</mi><msubsup><mi>X</mi><mn>0</mn><mn>2</mn></msubsup><mo>-</mo><mi>m</mi><mi>g</mi><msub><mi>X</mi><mn>0</mn></msub></math></p><p>where, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>X</mi><mn>0</mn></msub></math> is maximum elongation in spring.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>k</mi><msubsup><mi>X</mi><mn>0</mn><mn>2</mn></msubsup><mo>-</mo><mi>m</mi><mi>g</mi><msub><mi>X</mi><mn>0</mn></msub><mo>-</mo><mi>m</mi><mi>g</mi><mi>h</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><msubsup><mi>X</mi><mn>0</mn><mn>2</mn></msubsup><mo>-</mo><mfrac><mrow><mn>2</mn><mi>m</mi><mi>g</mi></mrow><mi>k</mi></mfrac><msub><mi>X</mi><mn>0</mn></msub><mo>-</mo><mfrac><mrow><mn>2</mn><mi>m</mi><mi>g</mi></mrow><mi>k</mi></mfrac><mi>h</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>X</mi><mn>0</mn></msub><mo>=</mo><mfrac><mrow><mn>2</mn><mfrac><mrow><mi>m</mi><mi>g</mi></mrow><mn>2</mn></mfrac><mo>&#177;</mo><msqrt><msup><mfenced><mfrac><mrow><mn>2</mn><mi>m</mi><mi>g</mi></mrow><mi>k</mi></mfrac></mfenced><mn>2</mn></msup><mo>+</mo><mn>4</mn><mo>&#215;</mo><mfrac><mrow><mn>2</mn><mi>m</mi><mi>g</mi></mrow><mi>k</mi></mfrac><mi>h</mi></msqrt></mrow><mn>2</mn></mfrac><mo>=</mo><mfrac><mrow><mi>m</mi><mi>g</mi></mrow><mn>2</mn></mfrac><mo>+</mo><msqrt><msup><mfenced><mfrac><mrow><mi>m</mi><mi>g</mi></mrow><mi>k</mi></mfrac></mfenced><mn>2</mn></msup><mo>+</mo><mfrac><mrow><mn>2</mn><mi>m</mi><mi>g</mi></mrow><mi>k</mi></mfrac><mi>h</mi></msqrt></math></p><p>Amplitude <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo></math> elongation in spring for lowest extreme position<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><msub><mi>X</mi><mn>0</mn></msub></mfenced></math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo></math>&nbsp;elongation in spring for equilibrium position<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><msub><mi>X</mi><mn>1</mn></msub></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msub><mi>X</mi><mn>0</mn></msub><mo>-</mo><msub><mi>X</mi><mn>1</mn></msub><mo>=</mo><mfrac><mrow><mi>m</mi><mi>g</mi></mrow><mi>k</mi></mfrac><msqrt><mn>1</mn><mo>+</mo><mfrac><mrow><mn>2</mn><mi>h</mi><mi>k</mi></mrow><mrow><mi>m</mi><mi>g</mi></mrow></mfrac></msqrt><mo>&#160;</mo></math>,&nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mrow><mo>&#8757;</mo><msub><mi>X</mi><mn>1</mn></msub><mo>=</mo><mfrac><mrow><mi>m</mi><mi>g</mi></mrow><mi>k</mi></mfrac></mrow></mfenced></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7e76f5bfc7ab78ae8d9", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}], "type": "singleCorrect", "level": 2, "question": {"text": "A rectangular block of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> and area of cross-section <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> floats in a liquid of density <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#961;</mi></math>. If it is given a vertical displacement from equilibrium, it undergoes oscillation with a time period <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math>. Then", "image": null}, "options": [{"id": "jP4D3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>&#8733;</mo><msqrt><mi>&#961;</mi></msqrt></math>", "isCorrect": false, "image": null}, {"id": "N8X7H", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>&#8733;</mo><mfrac><mn>1</mn><msqrt><mi>A</mi></msqrt></mfrac></math>", "isCorrect": true, "image": null}, {"id": "PDJKv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>&#8733;</mo><mfrac><mn>1</mn><mi>&#961;</mi></mfrac></math>", "isCorrect": false, "image": null}, {"id": "tskKz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>&#8733;</mo><mfrac><mn>1</mn><msqrt><mi>m</mi></msqrt></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Let block is displaced through <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math>, then weight of displaced water or upthrust (upwards)</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mi>A</mi><mi>x</mi><mi>&#961;</mi><mi>g</mi></math></p><p>Where, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> is area of a cross-section of the block and $\\rho$ is density. This must be equal to force <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>=</mo><mi>m</mi><mi>a</mi></mrow></mfenced></math> applied where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> is mass of the block and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math> is acceleration.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mi>m</mi><mi>a</mi><mo>=</mo><mo>-</mo><mi>A</mi><mi>x</mi><mi>&#961;</mi><mi>g</mi></math></p><p>or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mo>-</mo><mfrac><mrow><mi>A</mi><mi>&#961;</mi><mi>g</mi></mrow><mi>m</mi></mfrac><mi>x</mi><mo>=</mo><mo>-</mo><msup><mi>&#969;</mi><mn>2</mn></msup><mi>x</mi></math></p><p>This is equation of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>SHM</mi></math>.</p><p>The time period of oscillation,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>&#960;</mi></mrow><mi>&#969;</mi></mfrac><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><mi>m</mi><mrow><mi>A</mi><mi>&#961;</mi><mi>g</mi></mrow></mfrac></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>T</mi><mo>&#8733;</mo><mfrac><mn>1</mn><msqrt><mi>A</mi></msqrt></mfrac></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7da6f5bfc7ab78ae86b", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 2, "question": {"text": "A point particle of mass $0.1 \\mathrm{~kg}$ is executing S.H.M. of amplitude of $0.1 \\mathrm{~m}$. When the particle passes through the mean position, its kinetic energy is 8 $\\times 10^{-3}$ Joule. Obtain the equation of motion of this particle if this initial phase of oscillation is $45^{\\circ} .$", "image": null}, "options": [{"id": "7zvya", "text": "$y=0.1 \\sin \\left(\\pm 4 t+\\frac{\\pi}{4}\\right)$", "isCorrect": true, "image": null}, {"id": "SFPbK", "text": "$\\quad y=0.2 \\sin \\left(\\pm 4 t+\\frac{\\pi}{4}\\right)$", "isCorrect": false, "image": null}, {"id": "S8Kp9", "text": "$y=0.1 \\sin \\left(\\pm 2 t+\\frac{\\pi}{4}\\right)$", "isCorrect": false, "image": null}, {"id": "95Exf", "text": "$y=0.2 \\sin \\left(\\pm 2 t+\\frac{\\pi}{4}\\right)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "No Solution", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7d96f5bfc7ab78ae863", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 3, "question": {"text": "A $1 \\mathrm{~kg}$ mass is attached to a spring of force constant $600 \\mathrm{~N} / \\mathrm{m}$ and rests on a smooth horizontal surface with other end of the spring tied to wall as shown in figure. A second mass of $0.5 \\mathrm{~kg}$ slides along the surface towards the first at $3 \\mathrm{~m} / \\mathrm{s}$. If the masses make a perfectly inelastic collision, then find amplitude and time period of oscillation of combined mass.\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/7RB8kg5GImmHiuCU5XdGpoGOppt6O5xpyJtDsUB4MYA.original.fullsize.png\">", "image": null}, "options": [{"id": "qS6RW", "text": "$5 \\mathrm{~cm}, \\frac{\\pi}{10} \\mathrm{~s}$", "isCorrect": true, "image": null}, {"id": "S6KGk", "text": "$5 \\mathrm{~cm}, \\frac{\\pi}{5} \\mathrm{~s}$", "isCorrect": false, "image": null}, {"id": "eIIXe", "text": "$4 \\mathrm{~cm}, \\frac{2 \\pi}{5} \\mathrm{~s}$", "isCorrect": false, "image": null}, {"id": "6wYVj", "text": "$4 \\mathrm{~cm}, \\frac{\\pi}{3} \\mathrm{~s}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "No Solution", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7cb6f5bfc7ab78ae7ed", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 3, "question": {"text": "Vertical displacement of a plank with a body of mass \\(m\\) on it is varying according to law \\(y=\\sin \\omega t+\\sqrt{3} \\cos \\omega t\\). The minimum value of \\(\\omega\\) for which the mass just breaks off the plank and the moment it occurs first after \\(\\mathrm{t}=0\\), are given by", "image": null}, "options": [{"id": "MV8E8", "text": "\\(\\sqrt{\\mathrm{g} / 2}, \\frac{\\sqrt{2}}{6} \\frac{\\pi}{\\sqrt{\\mathrm{g}}}\\)", "isCorrect": true, "image": null}, {"id": "OITsO", "text": "\\(\\frac{\\mathrm{g}}{\\sqrt{2}}, \\frac{2}{3} \\sqrt{\\pi / \\mathrm{g}}\\)", "isCorrect": false, "image": null}, {"id": "XMYbu", "text": "\\(\\sqrt{\\mathrm{g} / 2}, \\frac{\\pi}{3} \\sqrt{2 / \\mathrm{g}}\\)", "isCorrect": false, "image": null}, {"id": "Bemte", "text": "\\(\\sqrt{2 g}, \\sqrt{2 \\pi / 3 g}\\)", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "From, figure,\r\n\r\n$$\r\n\r\n\\begin{array}{ll} \r\n\r\n& \\Lambda_{\\mathrm{R}}=\\sqrt{(\\sqrt{3})^{2}+(1)^{2}}-2 \\\\\r\n\r\n& \\theta=\\tan ^{-1}\\left(\\frac{\\sqrt{3}}{1}\\right)=\\frac{\\pi}{3} \\\\\r\n\r\n\\therefore \\quad & \\mathrm{y}=2 \\sin \\left(\\omega \\mathrm{t}+\\frac{\\pi}{3}\\right)\r\n\r\n\\end{array}\r\n\r\n$$\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/qDQXfpTAafdxXjRT0KmftJ2IGzUtwLnnUJibSYxYCl4.original.fullsize.png\"><br>\r\n\r\n$$\r\n\r\n\\frac{\\mathrm{d}^{2} \\mathrm{y}}{\\mathrm{dt}^{2}}=\\mathrm{a}=-2 \\omega^{2} \\sin \\left(\\omega \\mathrm{t}+\\frac{\\pi}{3}\\right)\r\n\r\n$$\r\n\r\n$a_{\\max }=-2 \\omega^{2}=g$\r\n\r\nFor which mass just breaks off the plank $\\omega=\\sqrt{\\mathrm{g} / 2}$\r\n\r\nThis will be happen for the first time when\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n\\omega \\mathrm{t}+\\frac{\\pi}{3}+\\frac{\\pi}{2} \\text { or } \\omega \\mathrm{t}=\\frac{\\pi}{6} \\\\\r\n\r\n\\therefore \\quad \\mathrm{t}=\\frac{\\pi}{6 \\omega}=\\frac{\\pi}{6} \\sqrt{\\frac{2}{\\mathrm{~g}}}\r\n\r\n\\end{array}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7c76f5bfc7ab78ae7ce", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 2, "question": {"text": "The displacement of a particle is given at time t, by:\r\n\r\n$x=A \\sin (-2 \\omega t)+B \\sin ^{2} \\omega t \\quad$ Then,", "image": null}, "options": [{"id": "MJslD", "text": "the motion of the particle is SHM with an amplitude of $\\sqrt{A^{2}+\\frac{B^{2}}{4}}$", "isCorrect": true, "image": null}, {"id": "CT7Mc", "text": "the motion of the particle is not SHM, but oscillatory with a time period of $T=\\pi / \\omega$", "isCorrect": false, "image": null}, {"id": "WmXof", "text": "the motion of the particle is oscillatory with a time period of $T=\\pi / 2 \\omega$", "isCorrect": false, "image": null}, {"id": "zyABx", "text": "the motion of the particle is a periodic.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The displacement of the particle is given by:\r\n\r\n$$\r\n\r\n\\begin{aligned}\r\n\r\nx &=A \\sin (-2 \\omega t)+B \\sin ^{2} \\omega t \\\\\r\n\r\n&=-A \\sin 2 \\omega t+\\frac{B}{2}(1-\\cos 2 \\omega t) \\\\\r\n\r\n&=-\\left(A \\sin 2 \\omega t+\\frac{B}{2} \\cos 2 \\omega t\\right)+\\frac{B}{2}\r\n\r\n\\end{aligned}\r\n\r\n$$\r\n\r\nThis motion represents SHM with an amplitude: $\\sqrt{A^{2}+\\frac{B^{2}}{4}},$ and mean position\r\n\r\n$$\r\n\r\n\\frac{B}{2}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7ba6f5bfc7ab78ae75d", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 3, "question": {"text": "Two particles $\\mathrm{P}$ and $\\mathrm{Q}$ describe S.H.M. of same amplitude a, same frequency $\\mathrm{f}$ along the same straight line. The maximum distance between the two particles is $\\mathrm{a} \\sqrt{2}$. The initial phase difference between the particle is $-$", "image": null}, "options": [{"id": "sZdIY", "text": "zero", "isCorrect": false, "image": null}, {"id": "SFpnc", "text": "$\\pi / 2$", "isCorrect": true, "image": null}, {"id": "dWjIO", "text": "$\\pi / 6$", "isCorrect": false, "image": null}, {"id": "kDLdw", "text": "$\\pi \\beta$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\mathrm{x}_{1}=\\mathrm{a} \\sin \\left(\\omega \\mathrm{t}+\\phi_{1}\\right), \\mathrm{x}_{2}=\\mathrm{a} \\sin \\left(\\omega \\mathrm{t}+\\phi_{2}\\right)$\r\n\r\n$\\Rightarrow \\quad\\left|\\mathrm{x}_{1}-\\mathrm{x}_{2}\\right|=2 \\mathrm{a} \\sin \\left(\\omega \\mathrm{t}+\\frac{\\phi_{1}+\\phi_{2}}{2}\\right) \\cos \\left(\\frac{\\phi_{1}-\\phi_{2}}{2}\\right)$\r\n\r\nTomaximize $\\left|\\mathrm{x}_{1}-\\mathrm{x}_{2}\\right|: \\sin \\left(\\omega \\mathrm{t}+\\frac{\\phi_{1}+\\phi_{2}}{2}\\right)=1$\r\n\r\n$\\Rightarrow \\mathrm{a} \\sqrt{2}=2 \\mathrm{a} \\times 1 \\times \\cos \\left(\\frac{\\phi_{1}-\\phi_{2}}{2}\\right)$\r\n\r\n$\\Rightarrow \\frac{1}{\\sqrt{2}}=\\cos \\left(\\frac{\\phi_{1}-\\phi_{2}}{2}\\right) \\Rightarrow \\frac{\\pi}{4}=\\frac{\\phi_{1}-\\phi_{2}}{2}$\r\n\r\n$\\Rightarrow \\phi_{1}-\\phi_{2}=\\frac{\\pi}{2}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7ad6f5bfc7ab78ae6e7", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 2, "question": {"text": "An instantaneous displacement of a simple harmonic oscillator is $\\mathrm{x}=\\mathrm{A} \\cos (\\omega \\mathrm{t}+\\pi / 4) .$ Its speed will be maximum at time", "image": null}, "options": [{"id": "GYhWd", "text": "$\\pi / 4 \\omega$", "isCorrect": true, "image": null}, {"id": "rSVQ1", "text": "$\\pi / 2 \\omega$", "isCorrect": false, "image": null}, {"id": "rUNXm", "text": "$\\pi / \\omega$", "isCorrect": false, "image": null}, {"id": "evsVf", "text": "$2 \\pi \\omega$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Velocity, $\\mathrm{v}=\\frac{\\mathrm{dx}}{\\mathrm{dt}}=-\\mathrm{A} \\omega \\sin (\\omega \\mathrm{t}+\\pi / 4)$\r\n\r\nVelocity will be maximum, when $\\omega t+\\pi / 4=\\pi / 2$ or $\\omega t=\\pi / 2-\\pi / 4=\\pi / 4$\r\n\r\nor $t=\\pi / 4 \\omega$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e78f6f5bfc7ab78ae5e8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}], "question": {"text": "Which of the following expressions corresponds to simple harmonic motion along a straight line, where $x$ is the displacement and $a, b, c$ are positive constants?", "image": null}, "options": [{"id": "gZKSo", "text": "$a+b x-c x^{2}$", "image": null, "isCorrect": false}, {"id": "SPGCD", "text": "$b x^{2}$", "image": null, "isCorrect": false}, {"id": "x3m4M", "text": "$a-b x+c x^{2}$", "image": null, "isCorrect": false}, {"id": "1Nxft", "text": "$-b x$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In linear S.H.M., the restoring force acting on particle should always be proportional to the displacement of the particle and directed towards the equilibrium position. i.e., $\\mathrm{F} \\propto \\mathrm{x}$\nor $\\mathrm{F}=-\\mathrm{bx}$ where $\\mathrm{b}$ is a positive constant.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64c0e8566f5bfc7ab78aed04", "title": "Energy of Simple Harmonic Motion", "totalQuestions": 3, "questions": [{"_id": "65b7b87a97ae24e9e2db8cbe", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}], "question": {"text": "The variation of kinetic energy (KE) of a particle executing simple harmonic motion with the displacement (x) starting from mean position to extreme position (A) is given by", "image": null}, "options": [{"id": "iIMWi", "text": "<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/dimh0q40udXvWSKmHpJiz8xNY5YVjqr58-F8id9cL78.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "rDAzc", "text": "<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/mUHWi2SDOUu5yjq4TzfhE5FuHlTJuJxkWwYc2iq10og.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "4Z0EH", "text": "<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/I-X5KKseNU8RJmOtJxz_fCkQlR6SNsMC4V3bIhZyO_8.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "s2l4p", "text": "<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/K7iMRNXzppX1JMP1jz93GejVSKH77LJ8VE6XDuY9M8o.original.fullsize.png\"><br>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<br />$\\begin{aligned} & T \\cdot E=K \\cdot E+P . E \\\\ & \\Rightarrow K \\cdot E=T \\cdot E-K \\cdot E \\\\ & =\\frac{1}{2} k^2-\\frac{1}{2} k^2 \\\\ & \\Rightarrow K E=\\frac{1}{2} m \\omega^2\\left(A^2-x^2\\right) \\quad\\left[\\because k=m \\omega^2\\right]\\end{aligned}$<br />$\\mathrm{KE}$ is maximum at $\\mathrm{x}=0$ \\& $\\mathrm{KE}$ is zero when $\\mathrm{x}=\\mathrm{A}$ $\\therefore \\mathrm{K} . \\mathrm{E}$ vs $\\mathrm{x}$ graph is parabola.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b87197ae24e9e2db8c60", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}], "question": {"text": "A particle executes SHM of amplitude A. The distance from the mean position when it's kinetic energy becomes equal to its potential energy is", "image": null}, "options": [{"id": "pAgAN", "text": "$\\sqrt{2 \\mathrm{~A}}$", "image": null, "isCorrect": false}, {"id": "er6S2", "text": "$2 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "nVHbT", "text": "$\\frac{1}{\\sqrt{2}} \\mathrm{~A}$", "image": null, "isCorrect": true}, {"id": "DT9F0", "text": "$\\frac{1}{2} \\mathrm{~A}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the distance from the mean position is $\\mathrm{X}$.<br />Given $\\mathrm{KE}=\\mathrm{PE}$<br />So, $\\frac{1}{2} M \\omega^2\\left(A^2-x^2\\right)=\\frac{1}{2} M \\omega^2 x^2$<br />$A^2-x^2=x^2 \\Rightarrow A^2=2 \\times 2$<br />$\\therefore \\mathrm{x}= \\pm \\frac{\\mathrm{A}}{\\sqrt{2}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7e56f5bfc7ab78ae8ca", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>A body of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi>kg</mi></math> is executing simple harmonic motion. Its displacement <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mfenced><mi>cm</mi></mfenced></math> at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi></math> seconds is given by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mn>6</mn><mi>sin</mi><mfenced><mrow><mn>100</mn><mi>t</mi><mo>+</mo><mfrac><mi>&#960;</mi><mn>4</mn></mfrac></mrow></mfenced></math>. Its maximum kinetic energy is</p>", "image": null}, "options": [{"id": "StGQp", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}, {"id": "Hfjcd", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>18</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": true, "image": null}, {"id": "WC7Zz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>24</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}, {"id": "qkX3s", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>36</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Given, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mn>6</mn><mo>&#160;</mo><mi>cm</mi><mo>=</mo><mn>6</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi ma ions": [{"id": "6ztCF", "text": "$\\frac{1}{2 \\pi} \\sqrt{\\frac{k}{4 \\mathrm{M}}}$", "isCorrect": false, "image": null}, {"id": "VIPqN", "text": "$\\frac{1}{\\pi} \\sqrt{\\frac{k}{\\mathrm{M}}}$", "isCorrect": true, "image": null}, {"id": "lkG0B", "text": "$\\frac{1}{2 \\pi} \\sqrt{\\frac{k}{7 \\mathrm{M}}}$", "isCorrect": false, "image": null}, {"id": "QLYCT", "text": "$\\frac{1}{2 \\pi} \\sqrt{\\frac{7 k}{\\mathrm{M}}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The equivalent system is shown in figure.\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/42RHMP-yIszBahNNrU3hZoXOKU49eZ4Dbypu4udHdzY.original.fullsize.png\"><br>\r\n\r\nThe equivalent force constant of which $k_{\\mathrm{e}}=k+3 k=4 k$ $\\therefore \\omega=\\sqrt{\\frac{k_{e}}{m}}=\\sqrt{\\frac{4 k}{m}}=2 \\sqrt{\\frac{k}{m}}$\r\n\r\nand $\\mathrm{f}=\\frac{\\omega}{2 \\pi}=\\frac{2}{2 \\pi} \\sqrt{\\frac{k}{m}}=\\frac{1}{\\pi} \\sqrt{\\frac{k}{m}}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8116f5bfc7ab78aea4c", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 3, "question": {"text": "Frequency of oscillation is proportional to\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/2Fka4nbw_giuNK19bw_t9qgWuL0nJxRH2NdnHC2h4NI.original.fullsize.png\">", "image": null}, "options": [{"id": "Qb5P4", "text": "$\\sqrt{\\frac{3 \\mathrm{k}}{\\mathrm{m}}}$", "isCorrect": true, "image": null}, {"id": "cmxdg", "text": "$\\sqrt{\\frac{\\mathrm{k}}{\\mathrm{m}}}$", "isCorrect": false, "image": null}, {"id": "WmSyq", "text": "$\\sqrt{\\frac{2 \\mathrm{k}}{\\mathrm{m}}}$", "isCorrect": false, "image": null}, {"id": "StcL2", "text": "$\\sqrt{\\frac{\\mathrm{m}}{3 \\mathrm{k}}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/fVXcn21iwp3NiK0FQADxaIUO2mU1h3GRfwNMO5PnGHg.original.fullsize.png\"><br>\r\n\r\nLet mass is displaced towards left by $x$ then force on $\\operatorname{mass}=-\\mathrm{kx}-2 \\mathrm{kx}=-3 \\mathrm{kx}$\r\n\r\n[negative sign is taken because force is opposite to the direction of motion]\r\n\r\n$\\begin{array}{l}\r\n\r\n\\Rightarrow \\mathrm{F}=-3 \\mathrm{kx}=-\\mathrm{m} \\omega^{2} \\mathrm{x} \\Rightarrow \\omega=\\sqrt{\\frac{3 \\mathrm{k}}{\\mathrm{m}}} \\\\\r\n\r\n\\mathrm{f}=\\frac{\\omega}{2 \\pi}=\\frac{1}{2 \\pi} \\sqrt{\\frac{3 \\mathrm{k}}{\\mathrm{m}}}\r\n\r\n\\end{array}$\r\n\r\nThus it is propotional to $\\sqrt{3 \\mathrm{k} / \\mathrm{m}}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8056f5bfc7ab78ae9e0", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}], "type": "singleCorrect", "level": 2, "question": {"text": "Frequency of oscillation of a body is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#160;</mo><mi>Hz</mi></math> when a force <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mn>1</mn></msub></math> is applied and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>&#160;</mo><mi>Hz</mi></math> when another force <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mn>2</mn></msub></math> is applied. If both forces <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mn>2</mn></msub></math> are applied together, then frequency of oscillation of the body will be", "image": null}, "options": [{"id": "OWZBD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>13</mn><mo>&#160;</mo><mi>Hz</mi></math>", "isCorrect": true, "image": null}, {"id": "VDeQX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>169</mn><mo>&#160;</mo><mi>Hz</mi></math>", "isCorrect": false, "image": null}, {"id": "9FOgS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>62</mn><mo>&#160;</mo><mi>Hz</mi></math>", "isCorrect": false, "image": null}, {"id": "9aiww", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>52</mn><mo>&#160;</mo><mi>Hz</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>According to the question,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mn>1</mn></msub><mo>=</mo><mo>-</mo><msub><mi>k</mi><mn>1</mn></msub><mi>x</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mn>2</mn></msub><mo>=</mo><mo>-</mo><msub><mi>k</mi><mn>2</mn></msub><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math>&nbsp;Frequency of oscillation</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>1</mn></msub><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mi>&#960;</mi></mrow></mfrac><msqrt><mfrac><msub><mi>k</mi><mn>1</mn></msub><mi>m</mi></mfrac></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mi>&#960;</mi></mrow></mfrac><msqrt><mfrac><msub><mi>k</mi><mn>1</mn></msub><mi>m</mi></mfrac></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>k</mi><mn>1</mn></msub><mo>=</mo><mn>100</mn><msup><mi>&#960;</mi><mn>2</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math></p><p>Similarly, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mi>&#960;</mi></mrow></mfrac><msqrt><mfrac><msub><mi>k</mi><mn>2</mn></msub><mi>m</mi></mfrac></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;&#160;</mo><msub><mi>k</mi><mn>2</mn></msub><mo>=</mo><mn>576</mn><msup><mi>&#960;</mi><mn>2</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math></p><p>Now, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><msub><mi>F</mi><mn>1</mn></msub><mo>+</mo><msub><mi>F</mi><mn>2</mn></msub><mo>=</mo><mo>-</mo><mfenced><mrow><msub><mi>k</mi><mn>1</mn></msub><mo>+</mo><msub><mi>k</mi><mn>2</mn></msub></mrow></mfenced><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math>&nbsp;Frequency of oscillation,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mi>&#960;</mi></mrow></mfrac><msqrt><mfrac><mrow><msub><mi>k</mi><mn>1</mn></msub><mo>+</mo><msub><mi>k</mi><mn>2</mn></msub></mrow><mi>m</mi></mfrac></msqrt><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mi>&#960;</mi></mrow></mfrac><msqrt><mfrac><mrow><mn>100</mn><msup><mi>&#960;</mi><mn>2</mn></msup><mi>m</mi><mo>+</mo><mn>576</mn><msup><mi>&#960;</mi><mn>2</mn></msup><mi>m</mi></mrow><mi>m</mi></mfrac></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;&#160;</mo><mi>v</mi><mo>=</mo><mn>13</mn><mo>&#160;</mo><mi>Hz</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8046f5bfc7ab78ae9db", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}], "type": "singleCorrect", "level": 2, "question": {"text": "The time period of a bob performing simple harmonic motion in water is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>. If density of bob&nbsp;is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>3</mn></mfrac><mo>&#215;</mo><msup><mn>10</mn><mn>3</mn></msup><mo>&#160;</mo><mi>kg</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>3</mn></mrow></msup></math>, then time period of bob performing simple harmonic motion in air will be", "image": null}, "options": [{"id": "xILtV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>", "isCorrect": false, "image": null}, {"id": "TRVpJ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>", "isCorrect": false, "image": null}, {"id": "fBm2M", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>", "isCorrect": false, "image": null}, {"id": "3dAkv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Given, density of bob, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#961;</mi><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><mo>&#215;</mo><msup><mn>10</mn><mn>3</mn></msup><mo>&#160;</mo><mi>kg</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>3</mn></mrow></msup></math><br />Density of water, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#963;</mi><mo>=</mo><msup><mn>10</mn><mn>3</mn></msup><mo>&#160;</mo><mo>&#160;</mo><mi>kg</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>3</mn></mrow></msup></math></p><p>If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>g</mi><mo>&#39;</mo></msup></math> be gravitational acceleration in water then,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>g</mi><mo>'</mo></msup><mo>=</mo><mi>g</mi><mo>&#160;</mo><mfenced><mrow><mn>1</mn><mo>-</mo><mfrac><mi>&#963;</mi><mi>&#961;</mi></mfrac></mrow></mfenced><mo>=</mo><mi>g</mi><mo>&#160;</mo><mfenced><mrow><mn>1</mn><mo>-</mo><mfrac><msup><mn>10</mn><mn>3</mn></msup><mrow><mfrac><mn>4</mn><mn>3</mn></mfrac><mo>&#215;</mo><msup><mn>10</mn><mn>3</mn></msup></mrow></mfrac></mrow></mfenced><mo>=</mo><mfrac><mi>g</mi><mn>4</mn></mfrac></math></p><p>As, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;&#160;</mo><msub><mi>T</mi><mrow><mi>air</mi><mo>&#160;</mo></mrow></msub><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><mi>I</mi><mi>g</mi></mfrac></msqrt></math>,</p><p>Similarly, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;&#160;</mo><msub><mi>T</mi><mrow><mi>water</mi><mo>&#160;</mo></mrow></msub><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><mi>I</mi><msup><mi>g</mi><mo>'</mo></msup></mfrac></msqrt><mo>&#160;</mo><mfenced open=\"[\" close=\"]\"><mrow><msub><mi>T</mi><mrow><mi>water</mi><mo>&#160;</mo></mrow></msub><mo>=</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></mrow></mfenced><mo>&#160;</mo><mfenced><mrow><msup><mi>g</mi><mo>'</mo></msup><mo>=</mo><mfrac><mi>g</mi><mn>4</mn></mfrac></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>=</mo><mn>2</mn><mi>&#960;</mi><mo>&#160;</mo><msqrt><mfrac><mi>I</mi><mrow><mi>g</mi><mo>/</mo><mn>4</mn></mrow></mfrac></msqrt><mo>=</mo><mn>2</mn><mi>&#960;</mi><mo>&#160;</mo><msqrt><mfrac><mi>I</mi><mi>g</mi></mfrac></msqrt><mo>&#160;</mo><mo>&#183;</mo><mn>2</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>=</mo><mn>2</mn><mo>.</mo><msub><mi>T</mi><mrow><mi>air</mi><mo>&#160;</mo></mrow></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mo>&#160;</mo><msub><mi>T</mi><mrow><mi>air</mi><mo>&#160;</mo></mrow></msub><mo>=</mo><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7f46f5bfc7ab78ae951", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}], "type": "singleCorrect", "level": 2, "question": {"text": "The bob of simple pendulum is a spherical hollow ball filled with water. A plugged hole near the bottom of the oscillating bob get&nbsp;suddenly unplugged. During observation, till water is coming out, the time period of oscillation would", "image": null}, "options": [{"id": "V6fcs", "text": "first increase&nbsp;and then decrease to the original value", "isCorrect": true, "image": null}, {"id": "pi5rx", "text": "first decrease and then increase to the original value", "isCorrect": false, "image": null}, {"id": "yFXoW", "text": "remain unchanged", "isCorrect": false, "image": null}, {"id": "k0Pye", "text": "increase towards a saturation value", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The bob filled completely with water has its centre of mass at its centre. The time period of oscillation is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><mi>l</mi><mi>g</mi></mfrac></msqrt></math></p><p>As the water starts coming out of the bob, its centre of mass shifts vertically downward and as a result, effective length of the pendulum increases and hence its period also increases. When the bob is empty, again its centre of mass appears at its centre and as a result, the period of oscillation again reaches to its original value.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7e86f5bfc7ab78ae8e7", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}], "type": "singleCorrect", "level": 1, "question": {"text": "Two simple pendulums of lengths <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math> respectively are given small displacement in one direction at the same time they will again be in the same sense when the pendulum of shorter length has completed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math> oscillations. Then, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math> is", "image": null}, "options": [{"id": "pG7kV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math>", "isCorrect": false, "image": null}, {"id": "jKuIq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>", "isCorrect": false, "image": null}, {"id": "us5IW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>", "isCorrect": true, "image": null}, {"id": "7slm2", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>According to question</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>n</mi><mn>1</mn></msub><msub><mi>T</mi><mn>1</mn></msub><mo>=</mo><msub><mi>n</mi><mn>2</mn></msub><msub><mi>T</mi><mn>2</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>n</mi><mo>&#183;</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><mn>5</mn><mi>g</mi></mfrac></msqrt><mo>=</mo><mfenced><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><mn>20</mn><mi>g</mi></mfrac></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>n</mi><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mn>2</mn><mo>&#8658;</mo><mi>n</mi><mo>=</mo><mn>2</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "64c0e8566f5bfc7ab78aed02", "title": "Applications of SHM", "totalQuestions": 5, "questions": [{"_id": "67726cf9c49e8ef28ee2b349", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}], "question": {"text": "A simple pendulum doing small oscillations at a place R height above earth surface has time period of $T_1=4 \\mathrm{~s}$. $T_2$ would be it's time period if it is brought to a point which is at a height $2 R$ from earth surface. Choose the correct relation $[\\mathrm{R}=$ radius of Earth $]:$", "image": null}, "options": [{"id": "YoXkw", "text": "$T_1=T_2$", "image": null, "isCorrect": false}, {"id": "cTOOa", "text": "$2 \\mathrm{~T}_1=3 \\mathrm{~T}_2$", "image": null, "isCorrect": false}, {"id": "JFCNZ", "text": "$3 \\mathrm{~T}_1=2 \\mathrm{~T}_2$", "image": null, "isCorrect": true}, {"id": "Gnwpk", "text": "$2 \\mathrm{~T}_1=\\mathrm{T}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Time period of simple pendulum,\n$\\mathrm{T}=2 \\pi \\sqrt{\\frac{l}{\\mathrm{~g}}} \\& \\mathrm{~g}=\\frac{\\mathrm{GM}}{(\\mathrm{R}+\\mathrm{h})^2}$\n$\\therefore \\mathrm{T} \\propto(\\mathrm{R}+\\mathrm{h})$\n$\\Rightarrow \\frac{\\mathrm{T}_1}{\\mathrm{~T}_2}=\\frac{\\left(\\mathrm{R}+\\mathrm{h}_1\\right)}{\\left(\\mathrm{R}+\\mathrm{h}_2\\right)}=\\frac{(\\mathrm{R}+\\mathrm{R})}{(\\mathrm{R}+2 \\mathrm{R})}=\\frac{2}{3} \\Rightarrow 3 \\mathrm{~T}_1=2 \\mathrm{~T}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7bb6f5bfc7ab78ae75e", "previousYea thrm{~L} / \\mathrm{g}_{\\text {eff }}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Effective $g^{\\prime}=g-\\frac{k q^{2}}{d^{2} m}, \\quad T \\propto \\frac{1}{\\sqrt{g_{\\text {eff }}}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "64c0e8566f5bfc7ab78aed01", "title": "Superposition of S.H.M's and Resonance", "totalQuestions": 1, "questions": [{"_id": "64c0e7736f5bfc7ab78ae4ec", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "In case of a forced vibration, the resonance wave becomes very sharp when the", "image": null}, "options": [{"id": "XSetc", "text": "restoring force is small", "image": null, "isCorrect": false}, {"id": "FAZ1M", "text": "applied periodic force is small", "image": null, "isCorrect": false}, {"id": "oNklC", "text": "quality factor is small", "image": null, "isCorrect": false}, {"id": "72MoW", "text": "damping force is small", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "No Solution available", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "64c0e8566f5bfc7ab78aed06", "title": "Angular oscillations", "totalQuestions": 1, "questions": [{"_id": "64c0e81f6f5bfc7ab78aeacb", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}], "type": "singleCorrect", "level": 3, "question": {"text": "In a simple pendulum of length I the bob is pulled aside from its equilibrium position through an angle $\\theta$ and then released. The bob passes through the equilibrium position with speed", "image": null}, "options": [{"id": "1Jx9V", "text": "$\\sqrt{2 g l(1+\\cos \\theta)}$", "isCorrect": false, "image": null}, {"id": "YlVRl", "text": "$\\sqrt{2 g l \\sin \\theta}$", "isCorrect": false, "image": null}, {"id": "aiZmz", "text": "$\\sqrt{2 \\mathrm{~g} l}$", "isCorrect": false, "image": null}, {"id": "gM3LN", "text": "$\\sqrt{2 \\mathrm{~g} l(1-\\cos \\theta)}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "If $l$ is length of pendulum and $\\theta$ be angular amplitude then from principle of conservation of energy\r\n\r\n(Initial total energy) $0+\\mathrm{mgh}=\\frac{1}{2} m v^{2}+0$ (Final total energy) $\\Rightarrow v=\\sqrt{2 g h}=\\sqrt{2 g l(1-\\cos \\theta)}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
