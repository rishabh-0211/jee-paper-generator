3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}], "question": {"text": "In a mixture of gases, the average number of degree of freedoms per molecule is 6 . The rms speed of the molecule of the gas is $c$, then the velocity of sound in the gas is", "image": null}, "options": [{"id": "5eWIm", "text": "$\\frac{c}{\\sqrt{3}}$", "image": null, "isCorrect": false}, {"id": "hjNKg", "text": "$\\frac{c}{\\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "r4CH6", "text": "$\\frac{2 c}{3}$", "image": null, "isCorrect": true}, {"id": "WKtK5", "text": "$\\frac{3 c}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "($v_{\\mathrm{rms}}=\\sqrt{\\frac{3 R T}{M}}$ and $v_{\\text {sound }}=\\sqrt{\\frac{\\gamma R T}{M}}$ $\\frac{v_{\\text {sound }}}{v_{\\text {rms }}}=\\sqrt{\\frac{\\gamma}{3}}$\nDegree of freedom is 6 .\n$\\begin{array}{lr}\n\\therefore & \\gamma=1+\\frac{2}{f}=1+\\frac{2}{6}=\\frac{4}{3} \\\\\n\\therefore & v_{\\text {sound }}=\\sqrt{\\frac{4 / 3}{3}} v_{\\text {rms }}=\\frac{2}{3} v_{\\text {rms }}=\\frac{2 c}{3}\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67726d06c49e8ef28ee2b3a6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}], "question": {"text": "The temperature of an ideal gas is increased from 200 K to 800 K . If r.m.s. speed of gas at 200 K is $v_0$. Then, r.m.s. speed of the gas at 800 K will be:", "image": null}, "options": [{"id": "sUOLA", "text": "$\\mathrm{v}_0$", "image": null, "isCorrect": false}, {"id": "2iRu6", "text": "$4 v_0$", "image": null, "isCorrect": false}, {"id": "QKCXz", "text": "$\\frac{v_0}{4}$", "image": null, "isCorrect": false}, {"id": "69sbr", "text": "$2 \\mathrm{v}_0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "RMS speed,\n$\\mathrm{V}_{\\mathrm{rms}}=\\sqrt{\\frac{3 \\mathrm{RT}}{\\mathrm{M}}}$\n$\\Rightarrow \\quad \\mathrm{V}_{\\mathrm{mm}} \\propto \\sqrt{\\mathrm{T}}$\nHere, $\\mathrm{T}_{\\text {initiol }}=200 \\mathrm{~K}$\n$\\mathrm{T}_{\\mathrm{fing1}}=800 \\mathrm{~K}$\nInitial RMS speed $=\\mathrm{v}_0$\n$\\therefore \\frac{v_0}{v_{\\mathrm{rms}}}=\\sqrt{\\frac{200}{800}} \\Rightarrow v_{\\mathrm{ms}}=2 v_0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e82d6f5bfc7ab78aeb47", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}], "type": "singleCorrect", "level": 1, "question": {"text": "A monoatomic gas of molar mass $m$ is kept in a insulated container. Container is moving with velocity $v$. If the container is suddenly stopped, then the change in the temperature of the gas is", "image": null}, "options": [{"id": "PtM62", "text": "\r\n$m v^2 / 4 R$\r\n", "isCorrect": false, "image": null}, {"id": "jS09r", "text": "\r\n$m v^2 / 2 R$\r\n", "isCorrect": false, "image": null}, {"id": "QA5Bg", "text": "\r\n$m v^2 / R$\r\n", "isCorrect": false, "image": null}, {"id": "ktran", "text": "\r\n$m v^2 / 3 R$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let the insulated container has $n$ moles of the monoatomic gas. The loss of kinetic energy of the gas,\r\n$$\r\n\\Delta E_K=\\frac{1}{2}(m n) v^2\r\n$$\r\nIf the change in temperature of the gas is $\\Delta T$, then heat gained by the gas is,\r\n$$\r\n\\Delta Q=\\frac{3}{2} n R \\Delta T\r\n$$\r\nNow, according to question,\r\n$$\r\n\\begin{aligned}\r\n\\Delta Q & =\\Delta E_K \\\\\r\n\\frac{3}{2} n R \\Delta T & =\\frac{1}{2} m n v^2 \\\\\r\n\\Rightarrow \\quad \\Delta T & =\\frac{m v^2}{3 R}\r\n\\end{aligned}\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8216f5bfc7ab78aeadb", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}], "type": "singleCorrect", "level": 2, "question": {"text": "The temperature of an ideal gas is increased from $120 \\mathrm{~K}$ to $480 \\mathrm{~K}$. If at $120 \\mathrm{~K}$, the root mean square velocity of the gas molecules is $v$, at $480 \\mathrm{~K}$ it becomes", "image": null}, "options": [{"id": "IBb1n", "text": "$4 u$", "isCorrect": false, "image": null}, {"id": "BTUv5", "text": "$2 u$", "isCorrect": true, "image": null}, {"id": "ZP9Gv", "text": "$\\frac{u}{2}$", "isCorrect": false, "image": null}, {"id": "NfIyP", "text": "$\\frac{u}{4}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "\\(\\frac{\\mathrm{v}_{1}}{\\mathrm{v}_{2}}=\\frac{\\sqrt{\\frac{3 \\mathrm{RT}_{1}}{\\mathrm{M}}}}{\\sqrt{\\frac{3 \\mathrm{RT}_{2}}{\\mathrm{M}}}}=\\sqrt{\\frac{\\mathrm{T}_{1}}{\\mathrm{~T}_{2}}} \\therefore \\mathrm{v}_{2}=2 \\mathrm{v}_{1}\\)", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8106f5bfc7ab78aea42", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 1, "question": {"text": "Ther.m.s. velocity of oxygen molecule at $16^{\\circ} \\mathrm{C}$ is $474 \\mathrm{~m} / \\mathrm{sec}$. The r.m.s. velocity in $\\mathrm{m} / \\mathrm{s}$ of hydrogen molecule at $127^{\\circ} \\mathrm{C}$ is", "image": null}, "options": [{"id": "9sjmR", "text": "1603", "isCorrect": false, "image": null}, {"id": "6Rp4r", "text": "1896", "isCorrect": false, "image": null}, {"id": "FLfzx", "text": "2230.59", "isCorrect": true, "image": null}, {"id": "CW4r2", "text": "2730", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$v_{\\operatorname{oxg} .}=\\sqrt{\\frac{3 R \\times 289}{32}}\\left(v_{\\mathrm{rms}}=\\sqrt{\\frac{3 R T}{\\mathrm{M}}}\\right)$\r\n\r\n$\\mathrm{v}_{\\mathrm{H}}=\\sqrt{\\frac{3 \\mathrm{R} \\times 400}{2}}$ so $\\mathrm{v}_{\\mathrm{H}}=2230.59 \\mathrm{~m} / \\mathrm{sec}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7d76f5bfc7ab78ae84b", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 2, "question": {"text": "The molecules of a given mass of a gas have\r\n\r\nr.m.s. velocity of $200 \\mathrm{~ms}^{-1}$ at $27^{\\circ} \\mathrm{C}$ and $1.0 \\times 10^{5}$ $\\mathrm{Nm}^{-2}$ pressure. When the temperature and pressure of the gas are respectively, $127^{\\circ} \\mathrm{C}$ and $0.05 \\times 10^{5} \\mathrm{Nm}^{-2},$ the r.m.s. velocity of its molecules in $\\mathrm{ms}^{-1}$ is :", "image": null}, "options": [{"id": "4aFc3", "text": "$100 \\sqrt{2}$", "isCorrect": false, "image": null}, {"id": "0x9Hy", "text": "$\\frac{400}{\\sqrt{3}}$", "isCorrect": true, "image": null}, {"id": "hpGaD", "text": "$\\frac{100 \\sqrt{2}}{3}$", "isCorrect": false, "image": null}, {"id": "03ifR", "text": "$\\frac{100}{3}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Here $v_{1}=200 \\mathrm{~m} / \\mathrm{s}$; temperature $\\mathrm{T}_{1}=27^{\\circ} \\mathrm{C}=27+273=300 \\mathrm{k}$\r\n\r\ntemperature $\\mathrm{T}_{2}=127^{\\circ} \\mathrm{C}=127+273=400 \\mathrm{k}$\r\n\r\n$\\mathrm{V}=?$\r\n\r\nR.M.S. Velocity, $\\mathrm{V} \\propto \\sqrt{\\mathrm{T}}$\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n\\Rightarrow \\quad \\frac{v}{200}=\\sqrt{\\frac{400}{300}} \\\\\r\n\r\n\\Rightarrow \\quad v=\\frac{200 \\times 2}{\\sqrt{3}} \\mathrm{~m} / \\mathrm{s} \\\\\r\n\r\n\\Rightarrow \\quad \\mathrm{v}=\\frac{400}{\\sqrt{3}} \\mathrm{~m} / \\mathrm{s}\r\n\r\n\\end{array}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7ba6f5bfc7ab78ae75b", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 2, "question": {"text": "In the kinetic theory of gases, which of these statements is/are true?\r\n\r\n(i) The pressure of a gas is proportional to the mean speed of the molecules.\r\n\r\n(ii) The root mean square speed of the molecules is proportional to the pressure.\r\n\r\n(iii) The rate of diffusion is proportional to the mean speed of the molecules.\r\n\r\n(iv) The mean translational kinetic energy of a gas is proportional to its kelvin temperature.", "image": null}, "options": [{"id": "5JeIz", "text": "(ii) and (iii) only", "isCorrect": false, "image": null}, {"id": "o0EQZ", "text": "(i),(ii) and (iv) only", "isCorrect": false, "image": null}, {"id": "pbqX4", "text": "(i) and (iii) only", "isCorrect": false, "image": null}, {"id": "YPFQO", "text": "(iii) and (iv) only", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "No Solution", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7ad6f5bfc7ab78ae6e5", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 2, "question": {"text": "The temperature of an ideal gas is increased from $27^{\\circ} \\mathrm{C}$ to $127^{\\circ} \\mathrm{C}$, then percentage increase in $\\mathrm{v}_{\\mathrm{rms}}$\r\n\r\nis", "image": null}, "options": [{"id": "7eKEC", "text": "$37 \\%$", "isCorrect": false, "image": null}, {"id": "nuWUt", "text": "$11 \\%$", "isCorrect": false, "image": null}, {"id": "KKXlg", "text": "$33 \\%$", "isCorrect": false, "image": null}, {"id": "cmXD6", "text": "$15.5 \\%$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "We know, $\\mathrm{V}_{\\mathrm{mms}}=\\sqrt{\\frac{3 \\mathrm{RT}}{\\mathrm{M}}}$\r\n\r\n$\\Rightarrow \\%$ increase in\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n\\mathrm{V}_{\\mathrm{rms}}=\\frac{\\sqrt{\\frac{3 \\mathrm{R} \\mathrm{T}_{2}}{\\mathrm{M}}}-\\sqrt{\\frac{3 \\mathrm{RT}_{1}}{\\mathrm{M}}}}{\\sqrt{\\frac{3 \\mathrm{RT}_{1}}{\\mathrm{M}}}} \\times 100 \\\\\r\n\r\n=\\frac{\\sqrt{\\mathrm{T}_{2}}-\\sqrt{\\mathrm{T}_{1}}}{\\sqrt{\\mathrm{T}_{1}}} \\times 100 \\\\\r\n\r\n=\\frac{\\sqrt{400}-\\sqrt{300}}{\\sqrt{300}} \\times 100 \\\\\r\n\r\n=\\frac{20-17.32}{17.32} \\times 100=15.5 \\%\r\n\r\n\\end{array}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e78f6f5bfc7ab78ae5e7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}], "question": {"text": "The molecules of a given mass of gas have a root mean square velocity of $200 \\mathrm{~m} \\mathrm{~s}^{-1}$ at $27^{\\circ} \\mathrm{C}$ and $1.0 \\times 10^{5} \\mathrm{Nm}^{-2}$ pressure. When the temperature is $127^{\\circ} \\mathrm{C}$ and the pressure $0.5 \\times 10^{5} \\mathrm{Nm}^{-2},$ the root mean square velocity in $\\mathrm{ms}^{-1}$, is", "image": null}, "options": [{"id": "SJkAb", "text": "$\\frac{400}{\\sqrt{3}}$", "image": null, "isCorrect": true}, {"id": "BUJbM", "text": "$100 \\sqrt{2}$", "image": null, "isCorrect": false}, {"id": "3PNtP", "text": "$\\frac{100 \\sqrt{2}}{3}$", "image": null, "isCorrect": false}, {"id": "Xnbsm", "text": "$\\frac{100}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\frac{c_{2}}{c_{1}}=\\sqrt{\\frac{400}{300}}=\\frac{2}{\\sqrt{3}}$\n$$\n\\Rightarrow c_{2}=\\frac{2}{\\sqrt{3}} \\times 200=\\frac{400}{\\sqrt{3}} \\mathrm{~ms}^{-1}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64c0e8726f5bfc7ab78aee43", "title": "Degree of Freedom and Specific Heat", "totalQuestions": 2, "questions": [{"_id": "64c0e7f76f5bfc7ab78ae964", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}], "type": "singleCorrect", "level": 3, "question": {"text": "A gas has molar heat capacity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>=</mo><mn>37</mn><mo>.</mo><mn>55</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi>mol</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>, in this process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mi>T</mi><mo>=</mo></math> constant. The number of degree of freedom of the molecule of gas is", "image": null}, "options": [{"id": "CLAC9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>", "isCorrect": false, "image": null}, {"id": "SSuao", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>", "isCorrect": false, "image": null}, {"id": "9R6lU", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math>", "isCorrect": true, "image": null}, {"id": "lMTOG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Given, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>=</mo><mn>37</mn><mo>.</mo><mn>55</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi>mol</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p><p>Also, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>T</mi><mo>=</mo></math> constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi></math></p><p>According to ideal gas equation, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>V</mi><mo>=</mo><mi>R</mi><mi>T</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>p</mi><mo>=</mo><mfrac><mrow><mi>R</mi><mi>T</mi></mrow><mi>V</mi></mfrac><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi mathvariant=\"normal\">i</mi></mfenced></math></p><p>Putting the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math> in Eq. (i), we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>R</mi><mi>T</mi></mrow><mi>V</mi></mfrac><mo>&#215;</mo><mi>T</mi><mo>=</mo><mi>K</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#8658;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>V</mi><mo>=</mo><mfrac><mrow><mi>R</mi><msup><mi>T</mi><mn>2</mn></msup></mrow><mi>K</mi></mfrac><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi>ii</mi></mfenced></math></p><p>On differentiating above equation both sides, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>V</mi></mrow><mrow><mi>d</mi><mi>T</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>R</mi><mi>T</mi></mrow><mi>K</mi></mfrac><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi>iii</mi></mfenced></math><br />But&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>T</mi><mi>K</mi></mfrac><mo>=</mo><mfrac><mn>1</mn><mi>p</mi></mfrac><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mfenced open=\"[\" close=\"]\"><mrow><mi>from</mi><mi>Eq</mi><mo>.</mo><mo>&#160;</mo><mo>&#160;</mo><mfenced><mi mathvariant=\"normal\">i</mi></mfenced></mrow></mfenced></math><br />Hence, Eq. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>iii</mi></mfenced></math>becomes</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>V</mi></mrow><mrow><mi>d</mi><mi>T</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">R</mi></mrow><mi>p</mi></mfrac></math><br />So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>=</mo><msub><mi>C</mi><mi>V</mi></msub><mo>+</mo><mfrac><mrow><mi>p</mi><mi>d</mi><mi>V</mi></mrow><mrow><mi>d</mi><mi>T</mi></mrow></mfrac></math><br />or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>=</mo><msub><mi>C</mi><mi>V</mi></msub><mo>+</mo><mfrac><mrow><mi>p</mi><mo>&#215;</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">R</mi></mrow><mi>p</mi></mfrac><mo>=</mo><msub><mi>C</mi><mi>V</mi></msub><mo>+</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">R</mi></math><br />or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mi>V</mi></msub><mo>=</mo><mi>C</mi><mo>-</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">R</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi>iv</mi></mfenced></math></p><p>As <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mi>V</mi></msub><mo>=</mo><mfrac><mrow><mi>n</mi><mi>R</mi></mrow><mn>2</mn></mfrac><mo>,</mo></math>&nbsp;where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>=</mo></math> number of degrees of freedom.<br />Putting the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mi>V</mi></msub></math> in Eq. (iv), we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>n</mi><mi>R</mi></mrow><mn>2</mn></mfrac><mo>=</mo><mi>C</mi><mo>-</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">R</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mo>&#160;</mo><mfenced><mrow><mi>C</mi><mo>-</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">R</mi></mrow></mfenced></mrow><mi>R</mi></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mo>&#160;</mo><mfenced><mrow><mn>37</mn><mo>.</mo><mn>55</mn><mo>-</mo><mn>2</mn><mo>&#215;</mo><mn>8</mn><mo>.</mo><mn>3</mn></mrow></mfenced></mrow><mrow><mn>8</mn><mo>.</mo><mn>3</mn></mrow></mfrac><mo>=</mo><mn>5</mn><mo>.</mo><mn>048</mn><mo>&#8776;</mo><mn>5</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e79d6f5bfc7ab78ae666", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 1, "question": {"text": "For a gas if ratio of specific heats at constant pressure and volume is $\\gamma$ then value of degrees of freedom is", "image": null}, "options": [{"id": "3FR8c", "text": "$\\frac{3 \\gamma-1}{2 \\gamma-1}$", "isCorrect": false, "image": null}, {"id": "mlMtd", "text": "$\\frac{2}{\\gamma-1}$", "isCorrect": true, "image": null}, {"id": "p5Clc", "text": "$\\frac{9}{2}(\\gamma-1)$", "isCorrect": false, "image": null}, {"id": "YRMDT", "text": "$\\frac{25}{2}(\\gamma-1)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\gamma=1+\\frac{2}{f}, \\Rightarrow \\gamma-1=\\frac{2}{f} \\\\ & \\Rightarrow \\frac{f}{2}=\\frac{1}{\\gamma-1} \\Rightarrow f=\\frac{2}{\\gamma-1} \\end{aligned}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "64c0e8726f5bfc7ab78aee41", "title": "Pressure and Energy of gas", "totalQuestions": 3, "questions": [{"_id": "65b7b87b97ae24e9e2db8cca", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}], "question": {"text": "A flask contains hydrogen and oxygen in the ratio of $2: 1$ by mass at temperature $27^{\\circ} \\mathrm{C}$. The ratio of average kinetic energy per molecule of hydrogen and oxygen respectively is :", "image": null}, "options": [{"id": "9ZQtv", "text": "<br />2 : 1", "image": null, "isCorrect": false}, {"id": "TiOK4", "text": "<br />1 : 1", "image": null, "isCorrect": true}, {"id": "QM3gZ", "text": "<br />1 : 4", "image": null, "isCorrect": false}, {"id": "sJ2yZ", "text": "<br />4 : 1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Average kinetic energy for diatomic gases<br />$\\begin{aligned}<br />& \\mathrm{K}_{\\mathrm{av}}=\\frac{5}{2} \\mathrm{kT} \\\\<br />& \\therefore \\frac{\\left(\\mathrm{K}_{\\mathrm{av}}\\right)_{\\mathrm{H}}}{\\left(\\mathrm{K}_{\\mathrm{av}}\\right)_{\\mathrm{O}}}=\\frac{(27+273)}{(27+273)}=1<br />\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e79d6f5bfc7ab78ae665", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 2, "question": {"text": "The average translational kinetic energy of $\\mathrm{O}_{2}$ (molar mass 32) molecules at a particular temperature is $0.048 \\mathrm{eV}$. The translational kinetic energy of $\\mathrm{N}_{2}$ (molar mass 28 ) molecules in $\\mathrm{eV}$ at the same temperature is", "image": null}, "options": [{"id": "1s41u", "text": "0.0015", "isCorrect": false, "image": null}, {"id": "ZwqAV", "text": "0.003", "isCorrect": false, "image": null}, {"id": "JhT0l", "text": "0.048", "isCorrect": true, "image": null}, {"id": "eOcur", "text": "0.768", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given,\r\n\\(\\mathrm{E}_{\\mathrm{O}_{2}}=0.048 \\mathrm{eV}\\)\r\nWe know that,\r\nTranslational kinetic energy,\r\n\\(\\mathrm{E}=\\frac{3}{2} \\mathrm{KT}\\)\r\nwhere, \\(\\mathrm{k}=\\) Boltzmann constant\r\n\\(\\mathrm{T}=\\) Temperature\r\n\\(\\therefore \\mathrm{E} \\propto \\mathrm{T}\\)\r\nSince, the temperature is same for both oxygen and nitrogen\r\ntherefore, \\(\\mathrm{E}_{\\mathrm{O}_{2}}=\\mathrm{E}_{\\mathrm{N}_{2}}\\)\r\n\\(\\therefore \\mathrm{E}_{\\mathrm{N}_{2}}=0.048 \\mathrm{eV}\\)", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7816f5bfc7ab78ae56d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}], "question": {"text": "3 moles of an ideal gas at a temperature of $27^{\\circ} \\mathrm{C}$ are mixed with 2 moles of an ideal gas at a temperature $227^{\\circ} \\mathrm{C}$, determine the equilibrium temperature of the mixture, assuming no loss of energy.", "image": null}, "options": [{"id": "1AVOF", "text": "$327^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "R2MOB", "text": "$107^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": true}, {"id": "XPI23", "text": "$318^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "3vIE8", "text": "$410^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Energy possessed by the ideal gas at $27^{\\circ} \\mathrm{C}$ is\n$$\nE_{1}=3\\left(\\frac{3}{2} R \\times 300\\right)=\\frac{2700 R}{2}\n$$\nEnergy possessed by the ideal gas at $227^{\\circ} \\mathrm{C}$ is\n$$\n\\mathrm{E}_{2}=2\\left(\\frac{3 \\mathrm{R}}{2} \\times 500\\right)=1500 \\mathrm{R}\n$$\nIf $\\mathrm{T}$ be the equilibrium temperature, of the mixture, then its energy will be\n$$\n\\mathrm{E}_{\\mathrm{m}}=5\\left(\\frac{3 \\mathrm{R} \\mathrm{T}}{2}\\right)\n$$\nSince, energy remains conserved,\n$$\n\\mathrm{E}_{\\mathrm{m}}=\\mathrm{E}_{1}+\\mathrm{E}_{2}\n$$\nor $\\quad 5\\left(\\frac{3 R T}{2}\\right)=\\frac{2700 R}{2}+1500 R$\nor $\\quad \\mathrm{T}=380 \\mathrm{~K}$ or $107^{\\circ} \\mathrm{C}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
