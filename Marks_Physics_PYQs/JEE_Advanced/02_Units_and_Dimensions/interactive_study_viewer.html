anced 2024 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16aa6f23ac7d519f9b656", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "64b1672d25f94b8a85b91cda", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 2)", "title": "JEE Advanced 2023 (Paper 2)"}], "question": {"text": "Young&rsquo;s modulus of elasticity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Y</mi></math>&nbsp;is expressed in terms of three derived quantities, namely, the gravitational constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>G</mi></math>, Planck&rsquo;s constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math> and the speed of light <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>c</mi></math>, as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Y</mi><mo>=</mo><msup><mi>c</mi><mi>&#945;</mi></msup><msup><mi>h</mi><mi>&#946;</mi></msup><msup><mi>G</mi><mi>&#947;</mi></msup></math>. Which of the following is the correct option?", "image": null}, "options": [{"id": "iUCvk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>=</mo><mn>7</mn><mo>,</mo><mo>&#160;</mo><mi>&#946;</mi><mo>=</mo><mo>-</mo><mn>1</mn><mo>,</mo><mo>&#160;</mo><mi>&#947;</mi><mo>=</mo><mo>&#8211;</mo><mn>2</mn></math>", "image": null, "isCorrect": true}, {"id": "Jk5tJ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>=</mo><mo>&#8211;</mo><mn>7</mn><mo>,</mo><mo>&#160;</mo><mi>&#946;</mi><mo>=</mo><mo>&#8211;</mo><mn>1</mn><mo>,</mo><mo>&#160;</mo><mi>&#947;</mi><mo>=</mo><mo>&#8211;</mo><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "OAQUk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>=</mo><mn>7</mn><mo>,</mo><mo>&#160;</mo><mi>&#946;</mi><mo>=</mo><mo>&#8211;</mo><mn>1</mn><mo>,</mo><mo>&#160;</mo><mi>&#947;</mi><mo>=</mo><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "n8WzB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>=</mo><mo>&#8211;</mo><mn>7</mn><mo>,</mo><mo>&#160;</mo><mi>&#946;</mi><mo>=</mo><mn>1</mn><mo>,</mo><mo>&#160;</mo><mi>&#947;</mi><mo>=</mo><mo>&#8211;</mo><mn>2</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>Dimensions of Young&#39;s modulus:&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>M</mi><mn>1</mn></msup><msup><mi>L</mi><mrow><mo>&#8211;</mo><mn>1</mn></mrow></msup><mi>T</mi><msup><mo>&#160;</mo><mrow><mo>&#8211;</mo><mn>2</mn></mrow></msup></mrow></mfenced></math></p><p>Dimensions of velocity of light:&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>M</mi><mn>0</mn></msup><msup><mi>L</mi><mn>1</mn></msup><msup><mi>T</mi><mrow><mo>&#8211;</mo><mn>1</mn></mrow></msup></mrow></mfenced></math></p><p>Dimensions of Planck&#39;s constant:&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>M</mi><mn>1</mn></msup><msup><mi>L</mi><mn>2</mn></msup><mo>&#160;</mo><msup><mi>T</mi><mrow><mo>&#8211;</mo><mn>1</mn></mrow></msup></mrow></mfenced></math></p><p>Dimensions of Gravitational constant:&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>M</mi><mrow><mo>&#8211;</mo><mn>1</mn></mrow></msup><msup><mi>L</mi><mn>3</mn></msup><msup><mi>T</mi><mrow><mo>&#8211;</mo><mn>2</mn></mrow></msup></mrow></mfenced></math></p><p>Now, as given in the question</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Y</mi><mo>=</mo><msup><mi>c</mi><mi>&#945;</mi></msup><msup><mi>h</mi><mi>&#946;</mi></msup><msup><mi>G</mi><mi>&#947;</mi></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>M</mi><mn>1</mn></msup><msup><mi>L</mi><mrow><mo>&#8211;</mo><mn>1</mn></mrow></msup><mi>T</mi><msup><mo>&#160;</mo><mrow><mo>&#8211;</mo><mn>2</mn></mrow></msup></mrow></mfenced><mo>=</mo><msup><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>M</mi><mn>0</mn></msup><msup><mi>L</mi><mn>1</mn></msup><msup><mi>T</mi><mrow><mo>&#8211;</mo><mn>1</mn></mrow></msup></mrow></mfenced><mi>&#945;</mi></msup><mo>&#160;</mo><msup><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>M</mi><mn>1</mn></msup><msup><mi>L</mi><mn>2</mn></msup><mo>&#160;</mo><msup><mi>T</mi><mrow><mo>&#8211;</mo><mn>1</mn></mrow></msup></mrow></mfenced><mi>&#946;</mi></msup><msup><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>M</mi><mrow><mo>&#8211;</mo><mn>1</mn></mrow></msup><msup><mi>L</mi><mn>3</mn></msup><msup><mi>T</mi><mrow><mo>&#8211;</mo><mn>2</mn></mrow></msup></mrow></mfenced><mi>&#947;</mi></msup></math></p><p>Comparing exponent of the M, L &amp; T both sides, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>=</mo><mi>&#946;</mi><mo>-</mo><mi>&#947;</mi><mo>&#160;</mo><mo>&#8658;</mo><mo>&#160;</mo><mi>&#946;</mi><mo>=</mo><mn>1</mn><mo>+</mo><mi>&#947;</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>1</mn></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>1</mn><mo>=</mo><mi>&#945;</mi><mo>+</mo><mn>2</mn><mi>&#946;</mi><mo>+</mo><mn>3</mn><mi>&#947;</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>2</mn></mfenced></math></p><p>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>2</mn><mo>=</mo><mo>-</mo><mi>&#945;</mi><mo>-</mo><mi>&#946;</mi><mo>-</mo><mn>2</mn><mi>&#947;</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>3</mn></mfenced></math></p><p>From equation(1) and (2), we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>1</mn><mo>=</mo><mi>&#945;</mi><mo>+</mo><mn>2</mn><mfenced><mrow><mn>1</mn><mo>+</mo><mi>&#947;</mi></mrow></mfenced><mo>+</mo><mn>3</mn><mi>&#947;</mi><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><mi>&#945;</mi><mo>+</mo><mn>5</mn><mi>&#947;</mi><mo>=</mo><mo>-</mo><mn>3</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>4</mn></mfenced></math></p><p>From equation(1) and (3), we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>2</mn><mo>=</mo><mo>-</mo><mi>&#945;</mi><mo>-</mo><mfenced><mrow><mn>1</mn><mo>+</mo><mi>&#947;</mi></mrow></mfenced><mo>-</mo><mn>2</mn><mi>&#947;</mi><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><mi>&#945;</mi><mo>+</mo><mn>3</mn><mi>&#947;</mi><mo>=</mo><mn>1</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>5</mn></mfenced></math></p><p>From equation(4) and equation(5), we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>=</mo><mn>7</mn><mo>,</mo><mo>&#160;</mo><mi>&#947;</mi><mo>=</mo><mo>&#8211;</mo><mn>2</mn></math>&nbsp;and then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#946;</mi><mo>=</mo><mn>1</mn><mo>+</mo><mi>&#947;</mi><mo>=</mo><mo>-</mo><mn>1</mn></math>.</p></blockquote>", "image": null}, "videoSolution": {"videoId": "f27a860517ab4ab7bb259668768ea933", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/yTyxpmfjAQ9vY.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/yTyxpmfjAQ9vY.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": true}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previou ath>&nbsp;is _______.", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "<blockquote><p>Given here:&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mi>B</mi></mfenced><mo>=</mo><msup><mfenced close=\"]\" open=\"[\"><mi>e</mi></mfenced><mi>&#945;</mi></msup><msup><mfenced close=\"]\" open=\"[\"><msub><mi>m</mi><mi>e</mi></msub></mfenced><mi>&#946;</mi></msup><msup><mfenced close=\"]\" open=\"[\"><mi>h</mi></mfenced><mi>&#947;</mi></msup><msup><mfenced close=\"]\" open=\"[\"><mi>k</mi></mfenced><mi>&#948;</mi></msup></math></p><p>The dimensions of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mi>e</mi></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><mi>Current</mi><mo>&#215;</mo><mi>time</mi></mrow></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><mi>I</mi><mi>T</mi></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><msub><mi>m</mi><mi>e</mi></msub></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\"><mi>M</mi></mfenced></math>, Planck&#39;s constant&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mi>h</mi></mfenced><mo>=</mo><mfrac><mi>Energy</mi><mi>Frequency</mi></mfrac><mo>=</mo><mfrac><mfenced close=\"]\" open=\"[\"><mrow><mi>M</mi><msup><mi>L</mi><mn>2</mn></msup><msup><mi>T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced><mfenced close=\"]\" open=\"[\"><msup><mi>T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mfenced></mfrac><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><mi>M</mi><msup><mi>L</mi><mn>2</mn></msup><msup><mi>T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mi>k</mi></mfenced><mo>=</mo><mfrac><mn>1</mn><mfenced close=\"]\" open=\"[\"><msub><mi>&#949;</mi><mn>0</mn></msub></mfenced></mfrac><mo>=</mo><msup><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>M</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi>L</mi><mrow><mo>-</mo><mn>3</mn></mrow></msup><msup><mi>T</mi><mn>4</mn></msup><msup><mi>I</mi><mn>2</mn></msup></mrow></mfenced><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><mi>M</mi><msup><mi>L</mi><mn>3</mn></msup><msup><mi>T</mi><mrow><mo>-</mo><mn>4</mn></mrow></msup><msup><mi>I</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced></math></p><p>Using Principle of homogeneity,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>M</mi><mn>1</mn></msup><msup><mi>T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><msup><mi>I</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced><mo>=</mo><msup><mfenced close=\"]\" open=\"[\"><mrow><mi>I</mi><mi>T</mi></mrow></mfenced><mi>&#945;</mi></msup><msup><mfenced close=\"]\" open=\"[\"><mi>M</mi></mfenced><mi>&#946;</mi></msup><msup><mfenced close=\"]\" open=\"[\"><mrow><mi>M</mi><msup><mi>L</mi><mn>2</mn></msup><msup><mi>T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced><mi>&#947;</mi></msup><msup><mfenced close=\"]\" open=\"[\"><mrow><mi>M</mi><msup><mi>L</mi><mn>3</mn></msup><msup><mi>T</mi><mrow><mo>-</mo><mn>4</mn></mrow></msup><msup><mi>I</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced><mi>&#948;</mi></msup></math></p><p>Comparing both sides, we get</p><p>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#946;</mi><mo>+</mo><mi>&#947;</mi><mo>+</mo><mi>&#948;</mi><mo>=</mo><mn>1</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi mathvariant=\"normal\">i</mi></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>&#947;</mi><mo>+</mo><mn>3</mn><mi>&#948;</mi><mo>=</mo><mn>0</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo  density of free electrons, each of mass $m$. When the electrons are subjected to an electric field, they are displaced relatively away from the heavy positive ions.If the electric field becomes zero, the electrons being to oscillate about the positive ions with a natural angular frequency $\\omega_p$, which is called the plasma frequency. To sustain the oscillations, a time varying electric field needs to be applied that has an angular frequency $\\omega$, where a part of the energy is absorbed and a part of it is reflected. As $\\omega$ approaches $\\omega_p$, all the free electrons are set to resonance together and all the energy is reflected. This is the explanation of high reflectivity of metals.<strong>Question:</strong>\nTaking the electronic charge as $e$ and the permittivity as $\\varepsilon_0$, use dimensional analysis to determine the correct expression for $\\omega_p$.", "image": null}, "options": [{"id": "SGzmD", "text": "\n$\\sqrt{\\frac{N e}{m \\varepsilon_0}}$\n", "image": null, "isCorrect": false}, {"id": "5z6Dx", "text": "\n$\\sqrt{\\frac{m \\varepsilon_0}{N e}}$\n", "image": null, "isCorrect": false}, {"id": "riRxX", "text": "\n$\\sqrt{\\frac{N e^2}{m \\varepsilon_0}}$\n", "image": null, "isCorrect": true}, {"id": "SgwAM", "text": "\n$\\sqrt{\\frac{m \\varepsilon_0}{N e^2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$N=$ Number of electrons per unit volume\n$$\n\\begin{aligned}\n\\therefore \\quad[N] & =\\left[\\mathrm{L}^{-3}\\right],[e]=[q] \\\\\n& =[I t]=[\\mathrm{AT}] \\\\\n{\\left[\\varepsilon_0\\right] } & =\\left[\\mathrm{M}^{-1} \\mathrm{~L}^{-3} \\mathrm{~T}^4 \\mathrm{~A}^2\\right]\n\\end{aligned}\n$$\nSubstituting the dimensions, we can see that,\n$$\n\\left.\\sqrt{\\frac{N e^2}{m \\varepsilon_0}}\\right]=\\left[\\mathrm{T}^{-1}\\right]\n$$\nAngular frequency has also the dimension $\\left[\\mathrm{T}^{-1}\\right]$.\n$\\therefore$ Correct option is (c).\nAnalysis of Question\n(i) From calculation point of view, question is moderately difficult. Otherwise it is simple.\n(ii) Students may commit a mistake in the dimensions of $N$. It is not dimensionless.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c48", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 1)", "title": "JEE Advanced 2011 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169d3f23ac7d519f9aecd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1e77301f65c2f92c40", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 1)", "title": "JEE Advanced 2007 (Paper 1)"}], "question": {"text": "Some physical quantities are given in Column I and some possible SI units in which these quantities may be expressed are given in Column II. Match the physical quantities in Column I with the units in Column II and indicate your answer by darkening appropriate bubbles in the $4 \\times 4$ matrix given in the ORS.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/71rwiOBIl8y69LXU1c8nAsedgtxa0TzE-uNAQgeFDS4.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "d6TVI", "text": "\nA-p, r; B-r, s; C-q; D-p, q\n", "image": null, "isCorrect": false}, {"id": "bUnCS", "text": "\nA-p, q; B-r, s; C-r, s; D-r, s\n", "image": null, "isCorrect": true}, {"id": "iFJLw", "text": "\nA-q; B-r, s; C-s; D-p, q, r\n", "image": null, "isCorrect": false}, {"id": "mZUoI", "text": "\nA-r, s; B-q; C-p; D-p, q, s", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution Available", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1e77301f65c2f92c40", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 1)", "title": "JEE Advanced 2007 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "6a0be52444d287c9361e5ce4", "title": "Units", "totalQuestions": 1, "questions": [{"_id": "6a0be51444d287c9361e5cc7", "type": "numerical", "question": {"text": "In a new system of units, the units of mass, length, time and current are $5$ kg, $5$ m, $5$ s and $5$ A, respectively. If $\\mu_0$ and $\\epsilon_0$ are the permeability and permittivity of free space, respectively, then in this new system of units, the magnitude of one SI unit of $\\sqrt{\\mu_0/\\epsilon_0}$, is:", "image": null}, "options": [], "correctValue": "25", "solution": {"text": "The dimensional formula for permeability of free space $\\mu_0$ is $[M L T^{-2} A^{-2}]$.<br><br>The dimensional formula for permittivity of free space $\\epsilon_0$ is $[M^{-1} L^{-3} T^4 A^2]$.<br><br>The dimensional formula for $\\sqrt{\\dfrac{\\mu_0}{\\epsilon_0}}$ is:<br>$\\left( \\dfrac{[M L T^{-2} A^{-2}]}{[M^{-1} L^{-3} T^4 A^2]} \\right)^{1/2} = \\left( [M^2 L^4 T^{-6} A^{-4}] \\right)^{1/2} = [M L^2 T^{-3} A^{-2}]$<br><br>Let the magnitude of $1$ SI unit in the new system be $n$. Using the principle of dimensional homogeneity:<br>$n_1 u_1 = n_2 u_2$<br>$1 \\times [M_1 L_1^2 T_1^{-3} A_1^{-2}] = n \\times [M_2 L_2^2 T_2^{-3} A_2^{-2}]$<br><br>Given the new units are $M_2 = 5$ kg, $L_2 = 5$ m, $T_2 = 5$ s, and $A_2 = 5$ A, while the SI units are $M_1 = 1$ kg, $L_1 = 1$ m, $T_1 = 1$ s, and $A_1 = 1$ A.<br><br>$n = \\left( \\dfrac{M_1}{M_2} \\right) \\left( \\dfrac{L_1}{L_2} \\right)^2 \\left( \\dfrac{T_1}{T_2} \\right)^{-3} \\left( \\dfrac{A_1}{A_2} \\right)^{-2}$<br><br>$n = \\left( \\dfrac{1}{5} \\right) \\left( \\dfrac{1}{5} \\right)^2 \\left( \\dfrac{1}{5} \\right)^{-3} \\left( \\dfrac{1}{5} \\right)^{-2}$<br><br>$n = 5^{-1} \\times 5^{-2} \\times 5^3 \\times 5^2$<br><br>$n = 5^{-1 - 2 + 3 + 2} = 5^2 = 25$<br><br>Thus, the magnitude of one SI unit in the new system of units is $25$.<br><br>Answer: $25$", "image": null}, "level": 2, "videoSolution": {"videoId": "0a8b692f02c041419e90be419a37fe18", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/4Nnxw5EpHNSKX.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/4Nnxw5EpHNSKX.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "previousYearPapers": [{"_id": "6a0be4ef402904185b819b43", "title": "JEE Advanced 2026 (Paper 2)", "shortName": "2026 (Paper 2)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a0be4ef402904185b819b43", "title": "JEE Advanced 2026 (Paper 2)", "shortName": "2026 (Paper 2)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Advanced';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
