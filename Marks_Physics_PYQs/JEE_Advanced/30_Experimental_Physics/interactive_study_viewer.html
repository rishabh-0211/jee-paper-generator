alse}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "684c67d769037fad219cb0c1", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2025-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2025 (Paper 1)", "title": "JEE Advanced 2025 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a9cf23ac7d519f9b5fa", "previousYearPapers": [{"_id": "632c83583e3fd59bda92e46d", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2022-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2022 (Paper 2)", "title": "JEE Advanced 2022 (Paper 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Area of the cross-section of a wire is measured using a screw gauge. The pitch of the main scale is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi>mm</mi></math>. The circular scale has&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn></math> divisions and for one full rotation of the circular scale, the main scale shifts by two divisions. The measured readings are listed below.</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 350px;\">\t<tbody>\t\t<tr>\t\t\t<td><strong>Measurement condition</strong></td>\t\t\t<td><strong>Main scale reading</strong></td>\t\t\t<td><strong>Circular scale reading</strong></td>\t\t</tr>\t\t<tr>\t\t\t<td>Two arms of gauge touching each other without wire</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn></math>&nbsp;division</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>&nbsp;divisions</td>\t\t</tr>\t\t<tr>\t\t\t<td>Attempt-<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>: With wire</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>&nbsp;divisions</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn></math> divisions</td>\t\t</tr>\t\t<tr>\t\t\t<td>Attempt-<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>: With wire</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>&nbsp;divisions</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>16</mn></math> divisions</td>\t\t</tr>\t</tbody></table><p>What are the diameter and cross-sectional area of the wire measured using the screw gauge?</p>", "image": null}, "options": [{"id": "Yse2u", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>22</mn><mo>&#177;</mo><mn>0</mn><mo>.</mo><mn>02</mn><mi>mm</mi><mo>,</mo><mo>&#160;</mo><mi>&#960;</mi><mfenced><mrow><mn>1</mn><mo>.</mo><mn>23</mn><mo>&#160;</mo><mo>&#177;</mo><mo>&#160;</mo><mn>0</mn><mo>.</mo><mn>02</mn></mrow></mfenced><msup><mi>mm</mi><mn>2</mn></msup></math>", "isCorrect": false, "image": null}, {"id": "8b1SF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>22</mn><mo>&#177;</mo><mn>0</mn><mo>.</mo><mn>01</mn><mi>mm</mi><mo>,</mo><mi>&#960;</mi><mfenced><mrow><mn>1</mn><mo>.</mo><mn>23</mn><mo>&#177;</mo><mn>0</mn><mo>.</mo><mn>01</mn></mrow></mfenced><msup><mi>mm</mi><mn>2</mn></msup></math>", "isCorrect": false, "image": null}, {"id": "dHl2F", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>14</mn><mo>&#177;</mo><mn>0</mn><mo>.</mo><mn>02</mn><mi>mm</mi><mo>,</mo><mi>&#960;</mi><mfenced><mrow><mn>1</mn><mo>.</mo><mn>14</mn><mo>&#177;</mo><mn>0</mn><mo>.</mo><mn>02</mn></mrow></mfenced><msup><mi>mm</mi><mn>2</mn></msup></math>", "isCorrect": true, "image": null}, {"id": "U3W67", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>14</mn><mo>&#177;</mo><mn>0</mn><mo>.</mo><mn>01</mn><mi>mm</mi><mo>,</mo><mi>&#960;</mi><mfenced><mrow><mn>1</mn><mo>.</mo><mn>14</mn><mo>&#177;</mo><mn>0</mn><mo>.</mo><mn>01</mn></mrow></mfenced><msup><mi>mm</mi><mn>2</mn></msup></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Note: This question is given bonus by JEE council.</p><p>In one rotation 2 divisions of the main scale are crossed. Therefore, the least count of the screw gauge is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi><mi>C</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mo>&#215;</mo><mn>0</mn><mo>.</mo><mn>5</mn></mrow><mn>100</mn></mfrac><mo>=</mo><mn>0</mn><mo>.</mo><mn>01</mn><mo>&#160;</mo><mi>mm</mi></math></p><p>And the zero error is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#215;</mo><mi>L</mi><mi>C</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>04</mn><mo>&#160;</mo><mi>mm</mi></math></p><p>Reading-1</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>1</mn></msub><mo>=</mo><mi>MSR</mi><mo>+</mo><mi>LC</mi><mo>&#215;</mo><mi>CSR</mi><mo>-</mo><mfenced><mrow><mi>Zero</mi><mo>&#160;</mo><mi>error</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced><mrow><mn>2</mn><mo>+</mo><mn>0</mn><mo>.</mo><mn>20</mn><mo>-</mo><mn>0</mn><mo>.</mo><mn>04</mn></mrow></mfenced><mi>mm</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mo>.</mo><mn>16</mn><mi>mm</mi></math></p><p>Reading-2</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>2</mn></msub><mo>=</mo><mfenced><mrow><mn>2</mn><mo>+</mo><mn>0</mn><mo>.</mo><mn>16</mn><mo>-</mo><mn>0</mn><mo>.</mo><mn>04</mn></mrow></mfenced><mi>mm</mi><mo>=</mo><mn>2</mn><mo>.</mo><mn>12</mn><mi>mm</mi></math></p><p>Therefore, average reading&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mi>m</mi></msub><mo>=</mo><mfrac><mrow><msub><mi>R</mi><mn>1</mn></msub><mo>+</mo><msub><mi>R</mi><mn>2</mn></msub></mrow><mn>2</mn></mfrac><mo>=</mo><mn>2</mn><mo>.</mo><mn>14</mn><mo>&#160;</mo><mi>mm</mi></math></p><p>Average mean error&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mfenced close=\"|\" open=\"|\"><mrow><msub><mi>R</mi><mi>m</mi></msub><mo>-</mo><msub><mi>R</mi><mn>1</mn></msub></mrow></mfenced><mo>+</mo><mfenced close=\"|\" open=\"|\"><mrow><msub><mi>R</mi><mi>m</mi></msub><mo>-</mo><msub><mi>R</mi><mn>2</mn></msub></mrow></mfenced></mrow><mn>2</mn></mfrac><mo>=</mo><mn>0</mn><mo>.</mo><mn>02</mn><mo>&#160;</mo><mi>mm</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo></math>&nbsp;Diameter&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi><mo>=</mo><mfenced><mrow><mn>2</mn><mo>.</mo><mn>14</mn><mo>&#177;</mo><mn>0</mn><mo>.</mo><mn>02</mn></mrow></mfenced><mo>&#160;</mo><mi>mm</mi></math></p><p>Area&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mi>&#960;</mi><msup><mi>d</mi><mn>2</mn></msup></mrow><mn>4</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mo>&#8710;</mo><mi>Area</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>&#960;</mi><mi>d</mi></mrow><mn>4</mn></mfrac><mfenced><mrow><mo>&#8710;</mo><mi>d</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mo>&#8710;</mo><mi>Area</mi><mo>&#8773;</mo><mi>&#960;</mi><mfenced><mrow><mn>0</mn><mo>.</mo><mn>02</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>Area</mi><mo>=</mo><mfrac><mrow><mi>&#960;</mi><msup><mi>d</mi><mn>2</mn></msup></mrow><mn>4</mn></mfrac><mo>&#177;</mo><mo>&#8710;</mo><mi>Area</mi><mo>=</mo><mi>&#960;</mi><mfenced><mrow><mn>1</mn><mo>.</mo><mn>14</mn><mo>&#177;</mo><mn>0</mn><mo>.</mo><mn>02</mn></mrow></mfenced><mo>&#160;</mo><msup><mi>mm</mi><mn>2</mn></msup></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "d08da11334c547baa330ee09f64f0df8", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Qkn8gpoTMTumC.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Qkn8gpoTMTumC.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "632c83583e3fd59bda92e46d", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2022-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2022 (Paper 2)", "title": "JEE Advanced 2022 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a90f23ac7d519f9b58b", "previousYearPapers": [{"_id": "619f94437e944e1fdc2859b5", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2021-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2021 (Paper 2)", "title": "JEE Advanced 2021 (Paper 2)"}], "type": "numerical", "level": 1, "question": {"text": "<p>In order to measure the internal resistance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>r</mi><mn>1</mn></msub></math>&nbsp;of a cell of emf&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#949;</mi><mo>,</mo></math>&nbsp;a meter bridge of wire resistance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>0</mn></msub><mo>=</mo><mn>50</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>, a resistance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>R</mi><mn>0</mn></msub><mn>2</mn></mfrac></math>, another cell of emf&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>&#949;</mi><mn>2</mn></mfrac></math>&nbsp;(internal resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>) and a galvanometer&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>G</mi></math>&nbsp;are used in a circuit, as shown in the figure. If the null point is found at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi><mo>=</mo><mn>72</mn><mo>&#160;</mo><mi>cm</mi><mo>,</mo></math>&nbsp;then the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>r</mi><mn>1</mn></msub><mo>=</mo><mi>_</mi><mi>_</mi><mi>_</mi><mi>_</mi><mi mathvariant=\"normal\">&#937;</mi><mo>.</mo></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/98a0246f-0ceb-4982-9f4e-27c8dce75b43-D9.png\" style=\"width: 350px; height: 155px;\" />&nbsp;</p>", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/d91e89ea-6c82-4f65-9c6d-67d1f3039373-image.png\" style=\"width: 300px; height: 241px;\" /></p><p>Resistance of potential wire is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>0</mn></msub><mo>=</mo><mn>50</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math></p><p>Resistance of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&#160;</mo><mi>cm</mi></math>&nbsp;wire&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>50</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math></p><p>So, Resistance of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>72</mn><mo>&#160;</mo><mi>cm</mi></math>&nbsp;wire&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>50</mn><mn>100</mn></mfrac><mo>&#215;</mo><mn>72</mn><mo>=</mo><mn>36</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math></p><p>Current,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mfrac><mstyle displaystyle=\"true\"><mfrac bevelled=\"true\"><mstyle displaystyle=\"true\"><mi>&#949;</mi></mstyle><mn>2</mn></mfrac></mstyle><mrow><mn>14</mn><mo>+</mo><mn>25</mn></mrow></mfrac><mo>=</mo><mfrac><mi>&#949;</mi><mrow><msub><mi>r</mi><mn>1</mn></msub><mo>+</mo><mn>75</mn></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>r</mi><mn>1</mn></msub><mo>=</mo><mn>3</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math></p>", "image": null}, "videoSolution": {"videoId": "b404cdbcbff54de59c1b3fbfdf5f780a", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/7y63Vl1nzSfhd.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/7y63Vl1nzSfhd.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "619f94437e944e1fdc2859b5", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2021-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2021 (Paper 2)", "title": "JEE Advanced 2021 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a88f23ac7d519f9b542", "previousYearPapers": [{"_id": "619f94337e944e1fdc2859b4", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021 (Paper 1)", "title": "JEE Advanced 2021 (Paper 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>The smallest division on the main scale of a Vernier calipers is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>1</mn><mo>&#160;</mo><mi>cm</mi></math>. Ten divisions of the Vernier scale correspond to nine divisions of the main scale. The figure below on the left shows the reading of this calipers with no gap between its two jaws. The figure on the right shows the reading with a solid sphere held between the jaws. The correct diameter of the sphere is</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/f8c86341-24a8-45c2-a97d-9c345ef2173d-image.png\" style=\"width: 400px; height: 179px;\" /></p>", "image": null}, "options": [{"id": "rXkEE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3.07</mn><mi>cm</mi></math>", "isCorrect": false, "image": null}, {"id": "jXY8g", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>.</mo><mn>11</mn><mo>&#160;</mo><mi>cm</mi></math>", "isCorrect": false, "image": null}, {"id": "izOJi", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>.</mo><mn>15</mn><mo>&#160;</mo><mi>cm</mi></math>", "isCorrect": true, "image": null}, {"id": "7uohm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>.</mo><mn>17</mn><mo>&#160;</mo><mi>cm</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Given,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mi>V</mi><mi>S</mi><mi>D</mi><mo>=</mo><mn>9</mn><mi>M</mi><mi>S</mi><mi>D</mi></math></p><p>Least count of the vernier caliper,&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi><mi>C</mi><mo>=</mo><mi>M</mi><mi>S</mi><mi>D</mi><mo>-</mo><mi>V</mi><mi>S</mi><mi>D</mi><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><mi>L</mi><mi>C</mi><mo>=</mo><mi>M</mi><mi>S</mi><mi>D</mi><mo>-</mo><mfrac><mrow><mn>9</mn><mi>M</mi><mi>S</mi><mi>D</mi></mrow><mn>10</mn></mfrac><mo>=</mo><mfrac><mrow><mi>M</mi><mi>S</mi><mi>D</mi></mrow><mn>10</mn></mfrac><mo>=</mo><mfrac><mrow><mn>0</mn><mo>.</mo><mn>1</mn><mo>&#160;</mo><mi>cm</mi></mrow><mn>10</mn></mfrac><mo>=</mo><mn>0</mn><mo>.</mo><mn>1</mn><mo>&#160;</mo><mi>mm</mi><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><mi>L</mi><mi>C</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>01</mn><mo>&#160;</mo><mi>cm</mi></math></p><p><strong>Case I:</strong> When sphere is not present between jaws then,</p><p>ma =\"normal\">M</mi><mo>.</mo><mi mathvariant=\"normal\">S</mi><mo>.</mo><mi mathvariant=\"normal\">D</mi><mo>.</mo><mo>-</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mi mathvariant=\"normal\">M</mi><mo>.</mo><mi mathvariant=\"normal\">S</mi><mo>.</mo><mi mathvariant=\"normal\">D</mi></math><br /><math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">L</mi><mo>.</mo><mi mathvariant=\"normal\">C</mi></mrow></mfenced><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mfrac><mrow><mn>1</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">M</mi><mo>.</mo><mi mathvariant=\"normal\">S</mi><mo>.</mo><mi mathvariant=\"normal\">D</mi></mrow><mrow><mn>5</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>40</mn></mrow></mfrac><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math><br />For option A and B<br />If the pitch of the screw gauge is twice the least count of the Vernier callipers then pitch <math><mo>=</mo><mn>2</mn><mo>&#215;</mo><mi mathvariant=\"normal\">L</mi><mo>.</mo><mi mathvariant=\"normal\">C</mi><mo>.</mo></math> of Vernier scale<br /><math><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>20</mn></mrow></mfrac><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math><br />Hence least count of screw gauge <math><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">h</mi></mrow><mrow><mn>100</mn></mrow></mfrac></math> <math><mo>=</mo><mfrac><mrow><mn>0.50</mn></mrow><mrow><mn>100</mn></mrow></mfrac></math><br /><math><mo>=</mo><mn>0.005</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">m</mi></math><br />For option C and D<br />Least count of linear scale of screw gauge<br /><math><mo>=</mo><mn>2</mn><mo>&#215;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>40</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow riant=\"normal\">&#937;</mi></math></p><p>For error analysis,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mfenced><mfrac><mrow><mn>40</mn><mo>.</mo><mn>0</mn><mo>&#177;</mo><mn>0</mn><mo>.</mo><mn>1</mn></mrow><mrow><mn>100</mn><mo>.</mo><mn>0</mn><mo>-</mo><mfenced><mrow><mn>40</mn><mo>.</mo><mn>0</mn><mo>&#177;</mo><mn>0</mn><mo>.</mo><mn>1</mn></mrow></mfenced></mrow></mfrac></mfenced><mo>&#215;</mo><mn>90</mn><mo>=</mo><mfenced><mfrac><mrow><mn>40</mn><mo>.</mo><mn>0</mn><mo>&#177;</mo><mn>0</mn><mo>.</mo><mn>1</mn></mrow><mrow><mn>60</mn><mo>.</mo><mn>0</mn><mo>&#177;</mo><mn>0</mn><mo>.</mo><mn>1</mn></mrow></mfrac></mfenced><mo>&#215;</mo><mn>90</mn></math><br />In multiplication and division, fractional errors get added up.</p><p>Therefore,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>&#8710;</mo><mi>R</mi></mrow><mi>R</mi></mfrac><mo>=</mo><mfrac><mrow><mn>0</mn><mo>.</mo><mn>1</mn></mrow><mn>40</mn></mfrac><mo>+</mo><mfrac><mstyle displaystyle=\"true\"><mn>0</mn><mo>.</mo><mn>1</mn></mstyle><mstyle displaystyle=\"true\"><mn>60</mn></mstyle></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#8710;</mo><mi>R</mi><mo>=</mo><mfrac><mn>100</mn><mrow><mfenced separators=\"|\"><mn>40</mn></mfenced><mfenced separators=\"|\"><mn>60</mn></mfenced></mrow></mfrac><mo>&#215;</mo><mn>0.1</mn><mo>&#215;</mo><mn>60</mn></math><math><mo>=</mo><mn>0.25</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math><br />Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mfenced><mrow><mn>60</mn><mo>&#177;</mo><mn>0</mn><mo>.</mo><mn>25</mn></mrow></mfenced><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math></p>", "image": null}, "videoSolution": {"videoId": "ef2dca667286452c8baf8fd09cf6644c", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/5DWugOFO5ZS1R.480.jpeg", "th ], "question": {"text": "A vernier calipers has $1 \\mathrm{~mm}$ marks on the main scale. It has 20 equal divisions on the vernier scale which match with 16 main scale divisions. For this vernier calipers, the least count is", "image": null}, "options": [{"id": "2mKRi", "text": "\n$0.02 \\mathrm{~mm}$\n", "image": null, "isCorrect": false}, {"id": "ok61i", "text": "\n$0.05 \\mathrm{~mm}$\n", "image": null, "isCorrect": false}, {"id": "ucZUQ", "text": "\n$0.1 \\mathrm{~mm}$\n", "image": null, "isCorrect": false}, {"id": "NWvKC", "text": "\n$0.2 \\mathrm{~mm}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Least count of vernier calipers\n$$\n\\begin{aligned}\n& \\text { LC }=1 \\mathrm{MSD}-1 \\text { VSD } \\\\\n& =\\frac{\\text { Smallest division on main scale }}{\\text { Number of divisions on vernier scale }} \\\\\n& 20 \\text { divisions of vernier scale } \\\\\n& =16 \\text { divisions of main scale } \\\\\n& \\therefore \\quad 1 \\mathrm{VSD}=\\frac{16}{20} \\mathrm{~mm}=0.8 \\mathrm{~mm} \\\\\n& \\therefore \\quad \\text { LC }=1 \\mathrm{MSD}-1 \\mathrm{VSD} \\\\\n& =1 \\mathrm{~mm}-0.8 \\mathrm{~mm} \\\\\n& \\therefore \\quad=0.2 \\mathrm{~mm} \\\\\n&\n\\end{aligned}\n$$\n$\\therefore$ The correct option is (d).", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c47", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 2)", "title": "JEE Advanced 2010 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169e9f23ac7d519f9af96", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c43", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 2)", "title": "JEE Advanced 2008 (Paper 2)"}], "question": {"text": "Column I gives a list of possible set of parameters measured in some experiments. The variations of the parameters in the form of graphs are shown in Column II. Match the set of parameters given in Column I with the graphs given in Column II. Indicate your answer by darkening the appropriate bubble of the $4 \\times 4$ matrix given in the ORS.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/kKOnEC0VsHIYxeGj56aR3d6HdmJGw3KZd3eJoq8bRzU.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "4gqMA", "text": "\n(A) q, (B) p,q, (C) p,s, (D) q,s\n", "image": null, "isCorrect": false}, {"id": "goGqE", "text": "\n(A) q,r, (B) p,q, (C) s, (D) q\n", "image": null, "isCorrect": false}, {"id": "ymIYm", "text": "\n(A) p, (B) q,s, (C) s, (D) q\n", "image": null, "isCorrect": true}, {"id": "eTqhD", "text": "\n(A) p,q, (B) q, (C) p,q, (D) q", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(A) Potential energy is minimum at mean position.\n(B) For $a=0, s=v t \\longrightarrow$ option $(q)$\nor $\\quad s=s_0+v t \\longrightarrow$ option $(r)$\nFor $a=$ constant,\n$$\ns=u t+\\frac{1}{2} a t^2 \\longrightarrow \\text { option }(s)\n$$\n(C) $R=\\frac{v^2 \\sin 2 \\theta}{g} \\therefore R \\propto v^2 \\longrightarrow$ option (s)\n(D) $T=2 \\pi \\sqrt{\\frac{l}{g}} \\therefore T^2 \\propto l \\longrightarrow$ option $(q)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c43", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 2)", "title": "JEE Advanced 2008 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169dff23ac7d519f9af40", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c42", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 1)", "title": "JEE Advanced 2008 (Paper 1)"}], "question": {"text": "Students I, II and III perform an experiment for measuring the acceleration due to gravity $(g)$ using a simple pendulum. They use different lengths of the pendulum and/or record time for different number of oscillations. The observations are shown in the table.\nLeast count for length $=0.1 \\mathrm{~cm}$\nLeast count for time $=0.1 \\mathrm{~s}$\n\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/vlvGSLty-Nbgt7ypLoTmhc8v_JV4M1IqFcYxvSHpk0I.original.fullsize.png\"><br>\n\n\nIf $E_{\\mathrm{I}}, E_{\\mathrm{II}}$ and $E_{\\mathrm{III}}$ are the percentage errors in $g$, i.e., $\\left(\\frac{\\Delta g}{g} \\times 100\\right)$ for students I, II and III, respectively.", "image": null}, "options": [{"id": "mJHsy", "text": "\n$E_{\\mathrm{I}}=0$\n", "image": null, "isCorrect": false}, {"id": "IoTqM", "text": "\n$E_{\\mathrm{I}}$ is minimum\n", "image": null, "isCorrect": true}, {"id": "Oy9hU", "text": "\n$E_{\\mathrm{I}}=E_{\\mathrm{II}}$\n", "image": null, "isCorrect": false}, {"id": "LIMNU", "text": "\n$E_{\\mathrm{II}}$ is maximum", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& T & =2 \\pi \\sqrt{\\frac{l}{g}} \\quad \\text { or } \\quad \\frac{t}{n}=2 \\pi \\sqrt{\\frac{l}{g}} \\\\\n\\therefore \\quad & g & =\\frac{\\left(4 \\pi^2\\right)\\left(n^2\\right) l}{t^2}\n\\end{aligned}\n$$\n\n$\\%$ error in $g=\\frac{\\Delta g}{g} \\times 100=\\left(\\frac{\\Delta l}{l}+\\frac{2 \\cdot \\Delta t}{t}\\right) \\times 100$\n$$\n\\begin{aligned}\n& E_{\\mathrm{I}}=\\left(\\frac{0.1}{64}+\\frac{2 \\times 0.1}{128}\\right) \\times 100=0.3125 \\% \\\\\n& E_{\\mathrm{II}}=\\left(\\frac{0.1}{64}+\\frac{2 \\times 0.1}{64}\\right) \\times 100=0.46875 \\% \\quad E_{\\mathrm{III}}=\\left(\\frac{0.1}{20}+\\frac{2 \\times 0.1}{36}\\right) \\times 100=1.055 \\%\n\\end{aligned}\n$$\nHence, $E_{\\mathrm{I}}$ is minimum.\n$\\therefore$ correct option is (b).", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c42", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 1)", "title": "JEE Advanced 2008 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169c5f23ac7d519f9ae4b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1e77301f65c2f92c3f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}], "question": {"text": "The circular scale of a screw gauge has 50 divisions and pitch of $0.5 \\mathrm{~mm}$. Find the diameter of sphere. Main scale reading is 2 .\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/VASXFazDcy_MWn37WFedHJCS7GriIFZHYPqEImRmNPU.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "srcDy", "text": "\n$1.2$\n", "image": null, "isCorrect": true}, {"id": "pJQeP", "text": "\n$1.25$\n", "image": null, "isCorrect": false}, {"id": "KaDZl", "text": "\n$2.20$\n", "image": null, "isCorrect": false}, {"id": "YlnyN", "text": "\n$2.25$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Least count $\\mathrm{LC}=\\frac{\\text { Pitch }}{\\text { Number of divisions on circular scale }}=\\frac{0.1}{50}$ $=0.01 \\mathrm{~mm}$\nNow, diameter of ball $=(2 \\times 0.5 \\mathrm{~mm})+(25-5)(0.01)=1.2 \\mathrm{~mm}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1e77301f65c2f92c3f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    if (!data.topics || data.topics.length === 0) {
      document.getElementById('current-topic-title').textContent = "No Questions Available";
      document.getElementById('current-topic-count').textContent = "0 Questions";
      document.getElementById('questions-list').innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted); font-size: 16px;">No previous year questions recorded for this chapter in this exam.</div>';
    } else {
      data.topics.forEach((t, i) => {
        const pill = document.createElement('div');
        pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
        pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
        pill.onclick = () => selectTopic(i);
        pillsContainer.appendChild(pill);
      });
    }

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Advanced';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => { if (data.topics && data.topics.length > 0) selectTopic(0); });
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      if (data.topics && data.topics.length > 0) selectTopic(0);
    }
  </script>
</body>
</html>
