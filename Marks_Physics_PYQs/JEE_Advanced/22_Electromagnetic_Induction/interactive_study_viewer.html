ill&nbsp;rotate in the same direction as the direction of magnet&#39;s motion</p>", "image": null}, "videoSolution": {"videoId": "561abbf6d1c24f9598818568201549c0", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/c4Bc3URT8fboQ.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/c4Bc3URT8fboQ.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf830", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020 (Paper 1)", "title": "JEE Advanced 2020 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a20f23ac7d519f9b195", "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c4b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 2)", "title": "JEE Advanced 2012 (Paper 2)"}], "type": "multipleCorrect", "level": 2, "question": {"text": "A current carrying infinitely long wire is kept along the diameter of a circular wire loop, without touching it, the correct statement(s) is(are)", "image": null}, "options": [{"id": "I2pve", "text": "The emf induced in the loop is zero if the current is constant.", "isCorrect": true, "image": null}, {"id": "AOLOW", "text": "The emf induced in the loop is finite if the current is constant.", "isCorrect": false, "image": null}, {"id": "Syftj", "text": "The emf induced in the loop is zero if the current decreases at a steady rate.", "isCorrect": true, "image": null}, {"id": "7uSu5", "text": "The emf induced in the loop is infinite if the current decreases at a steady rate.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "If the current is constant, the emf induced in the loop zero. Emf will be induced in the circular wire loop when flux through it changes with time.\r\n\r\n$\\mathrm{e}=-\\frac{\\Delta \\phi}{\\Delta \\mathrm{t}}$\r\n\r\nwhen the current is constant, the flux changing through it will be zero.\r\n\r\nAlso, if the current decreases at steady rate, the emf. induced in the loop is zero.\r\n\r\nWhen the current is decreasing at a steady rate then the change in the flux (decreasing inwards) on the right half of the wire is equal to the change in flux (decreasing outwards) on the left half of the wire such that $\\Delta \\phi$ through the circular loop is zero.\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/pMb-i-hx_6TMOAXEfVyhqx49W_QA3YpqMVkpEO5sdg4.original.fullsize.png\">", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c4b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 2)", "title": "JEE Advanced 2012 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169eef23ac7d519f9afc4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c44", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009 (Paper 1)", "title": "JEE Advanced 2009 (Paper 1)"}], "question": {"text": "The figure shows certain wire segments joined together to form a coplanar loop. The loop is placed in a perpendicular\nmagnetic field in the direction going into the plane of the figure. The magnitude of the field increases with time. $I_1$ and $I_2$ are the currents in the segments $a b$ and $c d$. Then,\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/FmoUDf4PAoABJAyyVwSzfFcrzpNV9UnhNo5asTpqQW8.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "PrEDy", "text": "\n$I_1>I_2$\n", "image": null, "isCorrect": false}, {"id": "599jR", "text": "\n$I_1 < I_2$", "image": null, "isCorrect": false}, {"id": "0CYoW", "text": "\n$I_1$ is in the direction ba and $I_2$ is in the direction $c d$\n", "image": null, "isCorrect": false}, {"id": "qexjH", "text": "\n$I_1$ is in the direction $a b$ and $I_2$ is in the direction $d c$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Cross $\\otimes$ magnetic field passing from the closed loop is increasing. Therefore, from Lenz's law induced current will product $\\operatorname{dot} \\odot$ magnetic field. Hence, induced current is anticlockwise.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c44", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009 (Paper 1)", "title": "JEE Advanced 2009 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169c7f23ac7d519f9ae60", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1e77301f65c2f92c3f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}], "question": {"text": "<strong>Paragraph:</strong>\nModern trains are based on Maglev technology in which trains are magnetically leviated, which runs its EDS Maglev system.\nThere are coils on both sides of wheels. Due to motion of train, current induces in the coil of track which levitate it. This is in accordance with Lenz's law. If trains lower down then due to Lenz's law a repulsive force increases due to which train gets uplifted and if it goes much high then there is a net downward force disc to gravity. s in the coil of track which levitate it. This is in accordance with Lenz's law. If trains lower down then due to Lenz's law a repulsive force increases due to which train gets uplifted and if it goes much high then there is a net downward force disc to gravity. The advantage of Maglev train is that there is no friction between the train and the track, thereby reducing power consumption and enabling the train to attain very high speeds.\nDisadvantage of Maglev train is that as it slows down the electromagnetic forces decreases and it becomes difficult to keep it leviated and as it moves forward according to Lenz law, there is an electromagnetic drag force.<strong>Question:</strong>\nWhat is the advantage of this system?", "image": null}, "options": [{"id": "ZQfpG", "text": "\nNo friction hence no power consumption\n", "image": null, "isCorrect": true}, {"id": "cS7KH", "text": "\nNo electric power is used\n", "image": null, "isCorrect": false}, {"id": "s3KZu", "text": "\nGravitation force is zero\n", "image": null, "isCorrect": false}, {"id": "T2Mmo", "text": "\nElectrostatic force draws the train", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No solution is required.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1e77301f65c2f92c3f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64b16ad2f23ac7d519f9b86c", "title": "Induced Electric Field", "totalQuestions": 5, "questions": [{"_id": "66965dd3d603121f43a3fae5", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "66965789b31faf98fda8fefa", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2024-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Paper 2)", "title": "JEE Advanced 2024 (Paper 2)"}], "question": {"text": "A region in the form of an equilateral triangle (in $x-y$ plane) of height $L$ has a uniform magnetic field $\\vec{B}$ pointing in the $+z$-direction. A conducting loop $\\mathrm{PQR}$, in the form of an equilateral triangle of the same height $L$, is placed in the $x-y$ plane with its vertex $\\mathrm{P}$ at $x=0$ in the orientation shown in the figure. At $t=0$, the loop starts entering the region of the magnetic field with a uniform velocity $\\vec{v}$ along the $+x$-direction. The plane of the loop and its orientation remain unchanged throughout its motion.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/vB2VAUsvsgWneESUJCNMe8iUMgA2Y9IxVr1_XchW_0c.original.fullsize.png\">\nWhich of the following graph best depicts the variation of the induced emf $(E)$ in the loop as a function of the distance $(x)$ starting from $x=0$ ?", "image": null}, "options": [{"id": "bCEEX", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/caJvmmKEiT24m1pYgJ3CyC3H6HvuvQ4wWLN0ddxJWk0.original.fullsize.png\"><br>", "image": null, "isCorrect": true}, {"id": "D5kuB", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/jw44KQyU1sH3j9xrQlvUSWBU9L-hx4_azDmgvJlPVRE.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "l2S8G", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/J0bFxg_JnU2ikp5BbKpi4XlDllrjND_Bpk8IS5LqWzU.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "DFDh7", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/Ov78FnnbQzHjM7itASfIo6Ujm23sVkFNCSh56sqz-B4.original.fullsize.png\"><br>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For, 0 to $\\mathrm{L}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/-9moMqNTuNtW-vxcVf7_pF-sFI7893I3l1CERsUB9_k.original.fullsize.png\">\n$\\varepsilon=\\mathrm{B} \\ell_{\\text {eff }} \\mathrm{v}=\\mathrm{B} \\times \\frac{\\mathrm{x}}{\\sqrt{3}} \\mathrm{v}$\nFor, $\\mathrm{L}$ to $2 \\mathrm{~L}$<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/QNmfDefr0Fcy3NJtN1Blpw_B4WJX3c9_DydBO4jli8c.original.fullsize.png\"><br>$\\begin{aligned} & |e m f|=B\\left(\\frac{L}{\\sqrt{3}}-\\frac{x_0}{\\sqrt{3}}\\right) v-B \\frac{2 x_0}{\\sqrt{3}} v \\\\ & =\\frac{B v L}{\\sqrt{3}}-\\sqrt{3} \\mathrm{Bvx}_0 \\\\ & =\\operatorname{Bv}\\left[\\frac{L}{\\sqrt{3}}-\\sqrt{3}(x-L)\\right] \\\\ & =\\frac{B v}{\\sqrt{3}}[L-3 \\mathrm{x}+3 \\mathrm{~L}] \\\\ & =\\frac{B v}{\\sqrt{3}}[4 L-3 \\mathrm{x}] \\\\ & \\text { at } x=\\frac{4 L}{3} \\\\ & e m f=0 \\\\ & \\end{aligned}$", "image": null}, "videoSolution": {"videoId": "ae556bfd22474fbcab8f5ebe05e2e06c", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/vCW8AYhmTjOQy.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/vCW8AYhmTjOQy.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "66965789b31faf98fda8fefa", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2024-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Paper 2)", "title": "JEE Advanced 2024 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a8ff23ac7d519f9b587", "previousYearPapers": [{"_id": "619f94437e944e1fdc2859b5", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2021-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2021 (Paper 2)", "title": "JEE Advanced 2021 (Paper 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<strong>Paragraph</strong><br>A special metal $S$ conducts electricity without any resistance. A closed wire loop, made of $S$, does not allow any change in flux through itself by inducing a suitable current to generate a compensating flux. The induced current in the loop cannot decay due to its zero resistance. This current gives rise to a magnetic moment which in turn repels the source of magnetic field or flux. Consider such a loop, of radius $a$, with its center at the origin. A magnetic dipole of moment $m$ is brought along the axis of this loop from infinity to a point at distance $r(\\gg a)$ from the center of the loop with its north pole always facing the loop, as shown in the figure below.<br><br>The magnitude of magnetic field of a dipole $m$, at a point on its axis at distance $r$, is $\\frac{\\mu_{0}}{2 \\pi} \\frac{m}{r^{3}}$, where $\\mu_{0}$ is the permeability of free space. The magnitude of the force between two magnetic dipoles with moments, $m_{1}$ and $m_{2}$, separated by a distance $r$ on the common axis, with their north poles facing each other, is $\\frac{k m_{1} m_{2}}{r^{4}}$, where $k$ is a constant of appropriate dimensions. The direction of this force is along the line joining the two dipoles.<br><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/OnwLM4py_dLCUenLLwdFNEy8sa-0i9DHGKEW9cpctzU.original.fullsize.png\" /><br><strong>Question</strong>When the dipole&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>&nbsp;is placed at a distance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>&nbsp;from the centre of the loop (as shown in the figure), the current induced in the loop will be proportional to:", "image": null}, "options": [{"id": "2aa3O", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>m</mi><msup><mi>r</mi><mn>3</mn></msup></mfrac></math>", "isCorrect": true, "image": null}, {"id": "YlRSb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>m</mi><mn>2</mn></msup><msup><mi>r</mi><mn>2</mn></msup></mfrac></math>", "isCorrect": false, "image": null}, {"id": "F1wZM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>m</mi><msup><mi>r</mi><mn>2</mn></msup></mfrac></math>", "isCorrect": false, "image": null}, {"id": "6yjtt", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>m</mi><mn>2</mn></msup><mi>r</mi></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/571fef32-a285-4778-9cb1-8a36e9213622-image.png\" style=\"width: 230px; height: 84px;\" /></p><p>For a super conducting loop, net flux&nbsp;passing through it will remain constant.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mfenced><msub><mi>&#981;</mi><mrow><mi>total</mi><mo>&#160;</mo></mrow></msub></mfenced><mi>i</mi></msub><mo>=</mo><msub><mfenced><msub><mi>&#981;</mi><mrow><mi>total</mi><mo>&#160;</mo></mrow></msub></mfenced><mi>f</mi></msub></math></p><p>As area is same, therefore,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>&#956;</mi><mn>0</mn></msub><mi>m</mi></mrow><mrow><mn>2</mn><msup><mi>&#960;r</mi><mn>3</mn></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mi>&#956;</mi><mn>0</mn></msub><mi>I</mi></mrow><mrow><mn>2</mn><mi>a</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>I</mi><mo>=</mo><mfrac><mrow><mi>a</mi><mi>m</mi></mrow><msup><mi>&#960;r</mi><mn>3</mn></msup></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>I</mi><mo>&#8733;</mo><mfrac><mi>m</mi><msup><mi>r</mi><mn>3</mn></msup></mfrac></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "619f94437e944e1fdc2859b5", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2021-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2021 (Paper 2)", "title": "JEE Advanced 2021 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a2df23ac7d519f9b208", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf823", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2013-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2013 (Paper 2)", "title": "JEE Advanced 2013 (Paper 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<strong> Paragraph: </strong>\r\n\r\nA point charge $Q$ is moving in a circular orbit of radius $R$ in the $x-y$ plane with an angular velocity $\\omega .$ This can be considered as equivalent to a loop carrying a steady current $\\frac{Q \\omega}{2 \\pi}$. A uniform magnetic field along the positive $z$-axis is now switched on, which increases at a constant rate from 0 to $B$ in one second. Assume that the radius of the orbit remains constant. The application of the magnetic field induces an emf in the orbit. The induced emf is defined as the work done by an induced electric field in moving a unit positive charge around a closed loop. It is known that, for an orbiting charge, the magnetic dipole moment is proportional to the angular momentum with a proportionality constant $\\gamma$.\r\n\r\n<br> <strong> Question: </strong>\r\n\r\nThe magnitude of the induced electric field in the orbit at any instant of time during the time interval of the magnetic field change is", "image": null}, "options": [{"id": "0OeYB", "text": "<math> <mrow> <mfrac> <mrow> <mtext>BR</mtext> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> </mrow> </math>", "isCorrect": false, "image": null}, {"id": "KX27U", "text": "<math> <mrow> <mfrac> <mrow> <mtext>BR</mtext> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math>", "isCorrect": true, "image": null}, {"id": "cP85t", "text": "<math> <mrow> <mtext>BR</mtext> </mrow> </math>", "isCorrect": false, "image": null}, {"id": "Xs5Rs", "text": "<math> <mrow> <mtext>2BR</mtext> </mrow> </math>", "isCorrect": fals id": "615d92eede3d91842a5cf823", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2013-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2013 (Paper 2)", "title": "JEE Advanced 2013 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a12f23ac7d519f9b10e", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c49", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 2)", "title": "JEE Advanced 2011 (Paper 2)"}], "question": {"text": "Which of the field patterns given in the figure is valid for electric field as well as for magnetic field?", "image": null}, "options": [{"id": "qyXFU", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/PvXG5u85HXYPikpmJCG0Dyb9XLSnjaulKAjw6YYBM8Q.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "sy4EN", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/8sAGjXi2E27EMRrmB8p4jNzjcPrulhkKE0jI6HTNJ0g.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "CfpGn", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/vB6wiKRN6J5Veh7UeXiZol7mOzgMVULyI16yyFEu8Hw.original.fullsize.png\"><br>", "image": null, "isCorrect": true}, {"id": "OVbFR", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/iEBS_GWoOypMxmFZtVPC3y0Rvs0ctlO9FwT931vvo78.original.fullsize.png\"><br>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Correct answer is (c), because induced electric field lines (produced by change in magnetic field) and magnetic field lines form closed loops.\nAnalysis of Question\nQuestion is simple, provided you have an idea of induced electric field lines.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c49", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 2)", "title": "JEE Advanced 2011 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169c7f23ac7d519f9ae66", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1e77301f65c2f92c3f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}], "question": {"text": "Match the following columns\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/sMqslWdePeakThlq1yBOr6vLpYxkICZ4jmVngXlMfX8.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "wy45H", "text": "\n(a) p,q, (b) p,q, (c) p, (d) q,r\n", "image": null, "isCorrect": false}, {"id": "LCI4u", "text": "\n(a) p, (b) p,q,s, (c) p,s, (d) q,r,s\n", "image": null, "isCorrect": true}, {"id": "sYs2v", "text": "\n(a) p,q, (b) p, q, (c) p,s, (d) p,q,r\n", "image": null, "isCorrect": false}, {"id": "SOttS", "text": "\n(a) p, (b) p, s, (c) p, (d) p,q,s", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(a) $\\rightarrow$ p\n(b) $\\rightarrow$ p, q, s\n(c) $\\rightarrow$ q, s\n(d) $\\rightarrow$ q, r, s", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1e77301f65c2f92c3f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64b16ad2f23ac7d519f9b86f", "title": "Motional and Rotational EMF", "totalQuestions": 11, "questions": [{"_id": "6a0be50f44d287c9361e5c96", "type": "singleCorrect", "question": {"text": "List-I contains four conducting loops lying in the $XY$ plane, as shown in the figures. The loops are rotating about $Z$ axis passing through the point $O$ with time period $T$ in clockwise direction. The region $x > 0$ contains a uniform magnetic field $B$ in the $+z$ direction. List-II contains the qualitative variation of the induced current $i(t)$ for each of these loops. Choose the option which describes the correct match between the entries in List-I to those in List-II.<br><table style=\"border: 1px solid black; border-collapse: collapse; width: auto;\"><tr><th style=\"border: 1px solid black; padding: 10px;\">List-I</th><th style=\"border: 1px solid black; padding: 10px;\">List-II</th></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">(P) <img style=\"width: 150px\" src=\"https://cdn.quizrr.in/question-assets/jee_adv/2026/watermarked_images/p1_english__q31_d1.png\" /></td><td style=\"border: 1px solid black; padding: 10px;\">(1) <img style=\"width: 200px\" src=\"https://cdn.quizrr.in/question-assets/jee_adv/2026/watermarked_images/p1_english__q31_d5.png\" /></td></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">(Q) <img style=\"width: 150px\" src=\"https://cdn.quizrr.in/question-assets/jee_adv/2026/watermarked_images/p1_english__q31_d2.png\" /></td><td style=\"border: 1px solid black; padding: 10px;\">(2) <img style=\"width: 200px\" src=\"https://cdn.quizrr.in/question-assets/jee_adv/2026/watermarked_images/p1_english__q31_d6.png\" /></td></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">(R) <img style=\"width: 150px\" src=\"https://cdn.quizrr.in/question-assets/jee_adv/2026/watermarked_images/p1_english__q31_d3.png\" /></td><td style=\"border: 1px solid black; padding: 10px;\">(3) <img style=\"width: 200px\" src=\"https://cdn.quizrr.in/question-assets/jee_adv/2026/watermarked_images/p1_english__q31_d7.png\" /></td></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">(S) <img style=\"width: 150px\" src=\"https://cdn.quizrr.in/question-assets/jee_adv/2026/watermarked_images/p1_english__q31_d4.png\" /></td><td style=\"border: 1px solid black; padding: 10px;\">(4) <img style=\"width: 200px\" src=\"https://cdn.quizrr.in/question-assets/jee_adv/2026/watermarked_images/p1_english__q31_d8.png\" /></td></tr><tr><td style=\"border: 1px solid black; padding: 10px;\"></td><td style=\"border: 1px solid black; padding: 10px;\">(5) <img style=\"width: 200px\" src=\"https://cdn.quizrr.in/question-assets/jee_adv/2026/watermarked_images/p1_english__q31_d9.png\" /></td></tr></table>", "image": null}, "options": [{"id": "SJzQS", "text": "P $\\rightarrow$ 5, Q $\\rightarrow$ 4, R $\\rightarrow$ 1, S $\\rightarrow$ 3", "isCorrect": false, "image": null}, {"id": "NBcW3", "text": "P $\\rightarrow$ 3, Q $\\rightarrow$ 2, R $\\rightarrow$ 5, S $\\rightarrow$ 4", "isCorrect": false, "image": null}, {"id": "EhIN1", "text": "P $\\rightarrow$ 3, Q $\\rightarrow$ 2, R $\\rightarrow$ 1, S $\\rightarrow$ 4", "isCorrect": true, "image": null}, {"id": "Wfeou", "text": "P $\\rightarrow$ 5, Q $\\rightarrow$ 1, R $\\rightarrow$ 2, S $\\rightarrow$ 3", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let us analyze the induced current $i(t)$ for each loop as it rotates clockwise with time period $T$. The magnetic field $B$ is uniform in the $+z$ direction for $x > 0$. The angular velocity is $\\omega = \\dfrac{2\\pi}{T}$. The induced EMF is $\\varepsilon = -\\dfrac{d\\Phi}{dt} = -B \\dfrac{dA}{dt}$, where $A(t)$ is the area of the loop in the region $x > 0$. The current $i(t)$ is proportional to $\\dfrac{dA}{dt}$.<br><br><b>Loop (P):</b><br>This is a semicircle in the region $x < 0$ at $t = 0$. As it rotates clockwise, the top half of the straight edge enters the region $x > 0$. The area in $x > 0$ is a sector of angle $\\theta = \\omega t$.<br>For $0 \\le t \\le T/2$, the area $A(t) = \\dfrac{1}{2}R^2\\omega t$ increases linearly, so $\\dfrac{dA}{dt}$ is a positive constant. Thus, $i(t)$ is a positive constant.<br>For $T/2 \\le t \\le T$, the loop exits the region $x > 0$, and the area decreases linearly, so $\\dfrac{dA}{dt}$ is a negative constant. Thus, $i(t)$ is a negative constant.<br>This matches graph (3). So, P $\\rightarrow$ 3.<br><br><b>Loop (R):</b><br>This is a single sector of angle $60^{\\circ} = \\dfrac{\\pi}{3}$.<br>For $0 \\le t \\le T/6$, the sector enters $x > 0$. The area increases linearly, so $i(t)$ is a positive constant.<br>For $T/6 \\le t \\le T/2$, the sector is fully inside $x > 0$. The area is constant, so $i(t) = 0$.<br>For $T/2 \\le t \\le 2T/3$, the sector exits $x > 0$. The area decreases linearly, so $i(t)$ is a negative constant.<br>For $2T/3 \\le t \\le T$, the sector is fully outside $x > 0$. The area is zero, so $i(t) = 0$.<br>This matches graph (1). So, R $\\rightarrow$ 1.<br><br><b>Loop (S):</b><br>This loop consists of two identical sectors arranged symmetrically but connected such that they form a figure-8 loop (crossing at the origin). The two lobes of a figure-8 loop have opposite area vectors. As the loop rotates, the rate of change of flux in the top lobe is exactly canceled by the rate of change of flux in the bottom lobe due to their symmetric entry and exit combined with the opposite sense of traversal. Therefore, the net induced EMF and current are zero at all times.<br>This matches graph (4). So, S $\\rightarrow$ 4.<br><br><b>Loop (Q):</b><br>By elimination and matching the remaining options, Q corresponds to graph (2). The loop has multiple sectors that enter and exit the magnetic field at different intervals, creating alternating positive and negative pulses of current.<br>So, Q $\\rightarrow$ 2.<br><br>The correct matching is P $\\rightarrow$ 3, Q $\\rightarrow$ 2, R $\\rightarrow$ 1, S $\\rightarrow$ 4.", "image": null}, "level": 3, "videoSolution": {"videoId": "7a207b86da884eb98070f79ddc4b2872", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/1f94uwJ0fTUp6.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/1f94uwJ0fTUp6.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "previousYearPapers": [{"_id": "6a0be4ef402904185b819b42", "title": "JEE Advanced 2026 (Paper 1)", "shortName": "2026 (Paper 1)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a0be4ef402904185b819b42", "title": "JEE Advanced 2026 (Paper 1)", "shortName": "2026 (Paper 1)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "685102be6bba689a3eb09c83", "type": "multipleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "684c67d769037fad219cb0c1", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2025-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2025 (Paper 1)", "title": "JEE Advanced 2025 (Paper 1)"}], "question": {"text": "A conducting square loop of side $L$, mass $M$ and resistance $R$ is moving in the $X Y$ plane with its edges parallel to the $X$ and $Y$ axes. The region $y \\geq 0$ has a uniform magnetic field, $\\vec{B}=B_0 k$. The magnetic field is zero everywhere else. At time $t=0$, the loop starts to enter the magnetic field with an initial velocity $v_0 \\hat{\\jmath} \\mathrm{~m} / \\mathrm{s}$, as shown in the figure. Considering the quantity $K=\\frac{B_0^2 L^2}{R M}$ in appropriate units, ignoring self-inductance of the loop and gravity, which of the following statements is/are correct:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/4QW8W90xWctqhEjhbmd90siQYrCnxRfLDltVwkbuqI4.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "Tsy5y", "text": "If $v_0=1.5 K L$, the loop will stop before it enters completely inside the region of magnetic field.", "image": null, "isCorrect": false}, {"id": "NJCnA", "text": "When the complete loop is inside the region of magnetic field, the net force acting on the loop is zero.", "image": null, "isCorrect": true}, {"id": "7C45p", "text": "If $v_0=\\frac{K L}{10}$, the loop comes to rest at $t=\\left(\\frac{1}{K}\\right) \\ln \\left(\\frac{5}{2}\\right)$.", "image": null, "isCorrect": false}, {"id": "vQqZT", "text": "If $v_0=3 K L$, the complete loop enters inside the region of magnetic field at time $t=\\left(\\frac{1}{K}\\right) \\ln \\left(\\frac{3}{2}\\right)$.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/56kqwRfAyMWAbxmWC_yJXRuyr4Tys1yPGhTPG9gl7rc.original.fullsize.png\"><br>$\\Rightarrow \\frac{-\\mathrm{d} \\phi}{\\mathrm{dt}}=\\frac{\\mathrm{d}}{\\mathrm{dt}}\\left(\\mathrm{B}_0 \\times \\ell \\times \\mathrm{y}\\right)=\\mathrm{BV} \\ell$<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/PdruxWz4Sf3IP7lHrhcLGBplNoajOXjBOU96ZnKO4yE.original.fullsize.png\"><br>$\\begin{aligned} & \\overrightarrow{\\mathrm{F}}=\\mathrm{B}(\\hat{\\mathrm{i}})(\\ell)(-\\hat{\\mathrm{j}}) \\\\ & \\mathrm{ma}=-\\mathrm{B}_0\\left[\\frac{\\mathrm{~B}_0 \\mathrm{~V} \\ell}{\\mathrm{R}}\\right](\\ell) \\\\ & \\mathrm{a}=-\\frac{\\mathrm{B}_0^2 \\ell^2 \\mathrm{~V}}{\\mathrm{mR}}\\end{aligned}$\n$\\begin{aligned} & \\text { Also } K=\\frac{B_0^2 \\ell^2 V}{R M} \\\\ & \\text { So }[a=-k v] \\\\ & \\frac{d v}{d t}=-k v \\\\ & \\int_{v_0}^v \\frac{d v}{d t}=\\int_0^t-k d t \\\\ & \\ell n \\frac{v}{v_0}=-k t\\end{aligned}$\n$\\left[\\mathrm{v}=\\mathrm{v}_0 \\mathrm{e}^{-\\mathrm{kt}}\\right]$ $\\left[\\mathrm{v}=\\mathrm{v}_0 \\mathrm{e}^{-\\mathrm{kt}}\\right]$ $\\ldots .(\\mathrm{i})$\n$\\frac{\\mathrm{dx}}{\\mathrm{dt}}=\\mathrm{v}_0 \\mathrm{e}^{-\\mathrm{kt}} \\quad(\\mathrm{x} \\leq \\ell)$\n$\\begin{aligned} & \\int_0^{\\mathrm{x}} \\mathrm{dx}=\\int_0^{\\mathrm{t}} \\mathrm{v}_0 \\mathrm{e}^{-\\mathrm{kt}} \\mathrm{dt} \\\\ & =\\frac{\\mathrm{v}_0}{\\mathrm{k}}\\left(1-\\mathrm{e}^{-\\mathrm{kt}}\\right)\\end{aligned}$\nWhen $x=\\ell$\n$\\ell=\\frac{\\mathrm{V}_0}{\\mathrm{k}}\\left(1-\\mathrm{e}^{-\\mathrm{kt}}\\right)$\nOption (D) $\\left(\\mathrm{v}_0=3 \\mathrm{k} \\ell\\right)$\n$\\begin{aligned} & \\ell=\\frac{3 \\mathrm{k} \\ell}{\\mathrm{k}}\\left(1-\\mathrm{e}^{-\\mathrm{kt}}\\right) \\\\ & \\frac{1}{3}=1-\\mathrm{e}^{-\\mathrm{kt}} \\\\ & \\mathrm{f} \\frac{2}{3}=2 \\mathrm{e}^{-\\mathrm{kt}} \\\\ & -\\mathrm{kt}=8 \\mathrm{n}\\left(\\frac{2}{3}\\right) \\\\ & \\mathrm{t}=\\frac{1}{\\mathrm{k}} \\ell \\mathrm{n}\\left(\\frac{2}{3}\\right)\\end{aligned}$\nComplete loop will enter at $\\mathrm{t}=\\frac{1}{\\mathrm{k}} \\ln \\left(\\frac{2}{3}\\right)$\nOption (B)\n$\\frac{\\mathrm{d} \\phi}{\\mathrm{dt}}=0, \\underline{\\underline{\\mathrm{e}}}=0, \\mathrm{i}=0, \\mathrm{~F}=0$\nAns. B,D)", "image": null}, "videoSolution": {"videoId": "2f17517773e149c19966407835d5be42", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/P58eALuRcWWZL.240.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/P58eALuRcWWZL.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "684c67d769037fad219cb0c1", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2025-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2025 (Paper 1)", "title": "JEE Advanced 2025 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "685102be6bba689a3eb09c81", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "684c67d769037fad219cb0c1", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2025-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2025 (Paper 1)", "title": "JEE Advanced 2025 (Paper 1)"}], "question": {"text": "A conducting square loop initially lies in the $X Z$ plane with its lower edge hinged along the $X$-axis. Only in the region $y \\geq 0$, there is a time dependent magnetic field pointing along the $Z$-direction, $\\vec{B}(t)=B_0(\\cos \\omega t) \\hat{K}$, where $B_0$ is a constant. The magnetic field is zero everywhere else. At time $t=0$, the loop starts rotating with constant angular speed $\\omega$ about the $X$ axis in the clockwise direction as viewed from the $+X$ axis (as shown in the figure). Ignoring self-inductance of the loop and gravity, which of the following plots correctly represents the induced e.m.f. ( $V$ ) in the loop as a function of time:<br><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/PKLLKwwhYwPIC-mgWwLOBC-iL34u_GwCH8Q7YPs0Gsg.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "Ib9gm", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/9i6Hlq9VvncEVszFf0y8aFtdRS_F3PEGgdqY2m1ILgY.original.fullsize.png\"><br>", "image": null, "isCorrect": true}, {"id": "LIPvg", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/YlVErI0m7yjZHIoUVjVxmvbWlyFkaui8WDUQ_91LxMs.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "FXmtl", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/Ize6f5r_0u62QgCusOz9hiz0enfNbHBEm_3JwNGw4AQ.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "1hPqp", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/ythmBhyyQliBEfWiMK8AFfYkMrXCu-Y_fajgBqf3JNc.original.fullsize.png\"><br>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\phi=\\mathrm{B}_0 \\cos \\omega \\mathrm{tA} \\sin \\omega \\mathrm{t}=\\frac{\\mathrm{B}_0 \\mathrm{~A} \\sin 2 \\omega \\mathrm{t}}{2} \\\\ & \\varepsilon=-\\frac{\\mathrm{d} \\phi}{\\mathrm{dt}}=-\\mathrm{B}_0 \\mathrm{~A} \\cos 2 \\omega \\mathrm{t}=\\left(0 \\leq \\mathrm{t} \\leq \\frac{\\pi}{\\omega}\\right) \\\\ & \\varepsilon=0 \\quad\\left(\\frac{\\pi}{\\omega} \\leq \\mathrm{t} \\leq \\frac{2 \\pi}{\\omega}\\right)\\end{aligned}$\nAns. Option (A)", "image": null}, "videoSolution": {"videoId": "45e18a469d3345b4ab182bb270355492", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/cwUsEVRWv64ty.240.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/cwUsEVRWv64ty.720.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "684c67d769037fad219cb0c1", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2025-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2025 (Paper 1)", "title": "JEE Advanced 2025 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16aa7f23ac7d519f9b65d", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "64b1672d25f94b8a85b91cda", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 2)", "title": "JEE Advanced 2023 (Paper 2)"}], "question": {"text": "<p>A rectangular conducting loop of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#160;</mo><mi>cm</mi></math> and width <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi>cm</mi></math> is in the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mi>y</mi></math>-plane, as shown in the figure. It is being moved away from a thin and long conducting wire along the direction&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msqrt><mn>3</mn></msqrt><mn>2</mn></mfrac><mover><mi>x</mi><mo>&#8743;</mo></mover><mo>+</mo><mfrac><mstyle displaystyle=\"true\"><mn>1</mn></mstyle><mstyle displaystyle=\"true\"><mn>2</mn></mstyle></mfrac><mover><mi>y</mi><mo>&#8743;</mo></mover></math>&nbsp;with a constant speed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math>.&nbsp;The wire is carrying a steady current <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mn>10</mn><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></math> in the positive <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>-direction. A current of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#160;</mo><mi>&#956;</mi><mi mathvariant=\"normal\">A</mi></math>&nbsp;flows through the loop when it is at a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi><mo>=</mo><mn>4</mn><mo>&#160;</mo><mi>cm</mi></math> from the wire. If the resistance of the loop is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>1</mn><mo>&#160;</mo><mi>&#937;</mi></math>, then the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math> is _____&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>.</p><p>[Given: The permeability of free space&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#956;</mi><mn>0</mn></msub><mo>=</mo><mn>4</mn><mi>&#960;</mi><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>7</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">A</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>]</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/d33f2e1f-b5b9-423d-9e28-fdd1922fbe26.png\" style=\"width: 300px; height: 232px;\" /></p>", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "<blockquote><p>The two sides of the rectangular loop which are perpendicular to the wire would not contribute in induced&nbsp;emf.</p><p>Angle of velocity vector with x-axis is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>tan</mi><mi>&#945;</mi><mo>=</mo><mfrac><mstyle displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mstyle displaystyle=\"true\"><mfrac><msqrt><mn>3</mn></msqrt><mn>2</mn></mfrac></mstyle></mfrac><mo>=</mo><mfrac><mn>1</mn><msqrt><mn>3</mn></msqrt></mfrac></math>. Therefore,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>=</mo><mn>30</mn><mo>&#176;</mo></math>.</p><p>For parallel sides:</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>E</mi><mo>&#8594;</mo></mover><mo>=</mo><mover><mi>B</mi><mo>&#8594;</mo></mover><mo>&#215;</mo><mover><mi>v</mi><mo>&#8594;</mo></mover></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><msub><mi>&#956;</mi><mn>0</mn></msub><mi>I</mi></mrow><mrow><mn>2</mn><mi>&#960;</mi><mi>x</mi></mrow></mfrac><mo>&#215;</mo><mi>v</mi></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/8e320405-2540-4759-a9e7-841708818d70.png\" style=\"width: 250px; height: 216px;\" /></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo></math>&nbsp;Net emf&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced><mrow><msub><mi>E</mi><mn>1</mn></msub><mi>cos</mi><msup><mn>60</mn><mi mathvariant=\"normal\">o</mi></msup><mo>-</mo><msub><mi>E</mi><mn>2</mn></msub><mi>cos</mi><msup><mn>60</mn><mi mathvariant=\"normal\">o</mi></msup></mrow></mfenced><mo>&#215;</mo></math>width</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mfrac><mn>2</mn><mn>100</mn></mfrac><mo>&#215;</mo><mfrac><mrow><msub><mi>&#956;</mi><mn>0</mn></msub><mi>I</mi><mi>v</mi></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi></mrow></mfrac><mfenced close=\"]\" open=\"[\"><mrow><mfrac><mn>1</mn><mstyle displaystyle=\"true\"><mfrac><mn>4</mn><mn>100</mn></mfrac></mstyle></mfrac><mo>-</mo><mfrac><mn>1</mn><mstyle displaystyle=\"true\"><mfrac><mn>8</mn><mn>100</mn></mfrac></mstyle></mfrac></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>100</mn></mfrac><mo>&#215;</mo><mfenced><mrow><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>7</mn></mrow></msup></mrow></mfenced><mo>&#215;</mo><mn>10</mn><mo>&#215;</mo><mi>v</mi><mo>&#215;</mo><mfrac><mn>100</mn><mn>8</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mo>.</mo><mn>5</mn><mi>v</mi><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>7</mn></mrow></msup></math></p><p>Now, net EMF&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>i</mi><mo>&#215;</mo><mi>R</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>v</mi><mo>=</mo><mfrac><mrow><mfenced><mrow><mn>10</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup></mrow></mfenced><mo>&#215;</mo><mn>0</mn><mo>.</mo><mn>1</mn></mrow><mrow><mn>2</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>7</mn></mrow></msup></mrow></mfrac><mo>=</mo><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "31668fcea4c24a3c9ffd5444e12f0679", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/OnY0uM19WZTQR.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/OnY0uM19WZTQR.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64b1672d25f94b8a85b91cda", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 2)", "title": "JEE Advanced 2023 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16aa2f23ac7d519f9b630", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "64b1672d25f94b8a85b91cd9", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 1)", "title": "JEE Advanced 2023 (Paper 1)"}], "question": {"text": "<p>A thin conducting rod <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><mi>N</mi></math> of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&#160;</mo><mi>gm</mi></math>, length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>25</mn><mo>&#160;</mo><mi>cm</mi></math> and resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mi>&#937;</mi></math>&nbsp;is held on frictionless, long, perfectly conducting vertical rails as shown in the figure. There is a uniform magnetic field <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>B</mi><mn>0</mn></msub><mo>=</mo><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">T</mi></math> directed perpendicular to the plane of the rod-rail arrangement. The rod is released from rest at time <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>0</mn></math> and it moves down along the rails. Assume air drag is negligible. Match each quantity in List-<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi></math> with an appropriate value from List-<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>II</mi></math>, and choose the correct option.</p><p>[Given: The acceleration due to gravity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mo>=</mo><mn>10</mn><mo>&#160;</mo><msup><mi>ms</mi><mrow><mo>&#8722;</mo><mn>2</mn></mrow></msup></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>e</mi><mrow><mo>&#8722;</mo><mn>1</mn></mrow></msup><mo>=</mo><mn>0</mn><mo>.</mo><mn>4</mn></math>]</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/133ebaa3-5dce-4761-9283-7081c4bd6846.png\" style=\"width: 300px; height: 342px;\" /></p><p>&nbsp;</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 500px;\">\t<tbody>\t\t<tr>\t\t\t<td>&nbsp;</td>\t\t\t<td style=\"text-align: center;\">List-<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi></math></td>\t\t\t<td style=\"text-align: center;\">&nbsp;</td>\t\t\t<td style=\"text-align: center;\">List-<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>II</mi></math></td>\t\t</tr>\t\t<tr>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math></td>\t\t\t<td>At <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>, the magnitude of the induced emf in Volt</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>07</mn></math></td>\t\t</tr>\t\t<tr>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Q</mi></math></td>\t\t\t<td>At <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>, the magnitude of the magnetic force in Newton</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>14</mn></math></td>\t\t</tr>\t\t<tr>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math></td>\t\t\t<td>At <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>, the power dissipated as heat in Watt</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>20</mn></math></td>\t\t</tr>\t\t<tr>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi></math></td>\t\t\t<td>\t\t\t<p>The magnitude of terminal velocity of the rod in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>&#8722;</mo><mn>1</mn></mrow></msup></math></p>\t\t\t</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>12</mn></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>&nbsp;</td>\t\t\t<td>&nbsp;</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>00</mn></math></td>\t\t</tr>\t</tbody></table>", "image": null}, "options": [{"id": "tdfeq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi><mo>&#8594;</mo><mn>5</mn><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">Q</mi><mo>&#8594;</mo><mn>2</mn><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">R</mi><mo>&#8594;</mo><mn>3</mn><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">S</mi><mo>&#8594;</mo><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "IgVrQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi><mo>&#8594;</mo><mn>3</mn><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">Q</mi><mo>&#8594;</mo><mn>1</mn><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">R</mi><mo>&#8594;</mo><mn>4</mn><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">S</mi><mo>&#8594;</mo><mn>5</mn></math>", "image": null, "isCorrect": false}, {"id": "GZaVq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi><mo>&#8594;</mo><mn>4</mn><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">Q</mi><mo>&#8594;</mo><mn>3</mn><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">R</mi><mo>&#8594;</mo><mn>1</mn><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">S</mi><mo>&#8594;</mo><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "4BZIy", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi><mo>&#8594;</mo><mn>3</mn><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">Q</mi><mo>&#8594;</mo><mn>4</mn><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">R</mi><mo>&#8594;</mo><mn>2</mn><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">S</mi><mo>&#8594;</mo><mn>5</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<blockquote><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/13265107-35ff-417d-a9a1-186aa781a55a.png\" style=\"width: 300px; height: 342px;\" /></p><p>Induced emf <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#949;</mi><mo>=</mo><mi>B</mi><mi mathvariant=\"script\">l</mi><mi>v</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo></math>&nbsp;Induced current&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>i</mi><mo>=</mo><mfrac><mi>&#949;</mi><mi>R</mi></mfrac><mo>=</mo><mfrac><mrow><mi>B</mi><mi mathvariant=\"script\">l</mi><mi>v</mi></mrow><mi>R</mi></mfrac></math></p><p>Direction of induced current would be from&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi><mo>&#160;</mo><mtext>to</mtext><mo>&#160;</mo><mi>M</mi></math>.</p><p>Now magnetic force acting on the rod due to this current would be in the&nbsp;upward direction. Therefore, we can write</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>m</mi><mi>g</mi><mo>-</mo><mi>i</mi><mi mathvariant=\"script\">l</mi><mi>B</mi><mo>=</mo><mi>m</mi><mi>a</mi></math>&nbsp;[Applying <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>2</mn><mi>nd</mi></msup></math>&nbsp;law]</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>m</mi><mi>g</mi><mo>-</mo><mfrac><mrow><msup><mi>B</mi><mn>2</mn></msup><msup><mi mathvariant=\"script\">l</mi><mn>2</mn></msup><mi>v</mi></mrow><mi>R</mi></mfrac><mo>=</mo><mi>m</mi><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msubsup><mo>&#8747;</mo><mn>0</mn><mi>v</mi></msubsup><mo>&#160;</mo><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>m</mi><mi>g</mi><mo>-</mo><mstyle displaystyle=\"true\"><mfrac><mrow><msup><mi>B</mi><mn>2</mn></msup><msup><mi mathvariant=\"script\">l</mi><mn>2</mn></msup><mi>v</mi></mrow><mi>R</mi></mfrac></mstyle></mrow></mfrac><mo>=</mo><msubsup><mo>&#8747;</mo><mn>0</mn><mi>t</mi></msubsup><mfrac><mrow><mi>d</mi><mi>t</mi></mrow><mi>m</mi></mfrac><mo>&#160;</mo><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><mo>&#160;</mo><mfrac><mrow><mi>ln</mi><msup><msub><mfenced close=\"]\" open=\"[\"><mrow><mi>m</mi><mi>g</mi><mo>-</mo><mstyle displaystyle=\"true\"><mfrac><mrow><msup><mi>B</mi><mn>2</mn></msup><msup><mi mathvariant=\"script\">l</mi><mn>2</mn></msup><mi>v</mi></mrow><mi>R</mi></mfrac></mstyle></mrow></mfenced><mn>0</mn></msub><mi>v</mi></msup></mrow><mstyle displaystyle=\"true\"><mfrac><mrow><mo>-</mo><msup><mi>B</mi><mn>2</mn></msup><msup><mi mathvariant=\"script\">l</mi><mn>2</mn></msup></mrow><mi>R</mi></mfrac></mstyle></mfrac><mo>=</mo><mfrac><mi>t</mi><mi>m</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mfrac><mrow><mi>m</mi><mi>g</mi><mo>-</mo><mstyle displaystyle=\"true\"><mfrac><mrow><msup><mi>B</mi><mn>2</mn></msup><msup><mi mathvariant=\"script\">l</mi><mn>2</mn></msup><mi>v</mi></mrow><mi>R</mi></mfrac></mstyle></mrow><mrow><mi>m</mi><mi>g</mi></mrow></mfrac><mo>=</mo><msup><mi>e</mi><mrow><mfrac><mrow><mo>-</mo><msup><mi>B</mi><mn>2</mn></msup><msup><mi mathvariant=\"script\">l</mi><mn>2</mn></msup></mrow><mrow><mi>m</mi><mi>R</mi></mrow></mfrac><mi>t</mi></mrow></msup></math></p><p>Now,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mi>g</mi><mo>=</mo><mfenced><mrow><mn>20</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup></mrow></mfenced><mo>&#215;</mo><mn>10</mn><mo>=</mo><mn>0</mn><mo>.</mo><mn>2</mn></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msup><mi>B</mi><mn>2</mn></msup><msup><mi mathvariant=\"script\">l</mi><mn>2</mn></msup></mrow><mi>R</mi></mfrac><mo>=</mo><mfrac><mrow><msup><mn>4</mn><mn>2</mn></msup><mo>&#215;</mo><msup><mfenced><mrow><mn>0</mn><mo>.</mo><mn>25</mn></mrow></mfenced><mn>2</mn></msup></mrow><mn>10</mn></mfrac><mo>=</mo><mn>0</mn><mo>.</mo><mn>1</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msup><mi>B</mi><mn>2</mn></msup><msup><mi mathvariant=\"script\">l</mi><mn>2</mn></msup></mrow><mrow><mi>m</mi><mi>R</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><msup><mn>4</mn><mn>2</mn></msup><mo>&#215;</mo><msup><mfenced><mrow><mn>0</mn><mo>.</mo><mn>25</mn></mrow></mfenced><mn>2</mn></msup></mrow><mrow><mfenced><mrow><mn>20</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup></mrow></mfenced><mo>&#215;</mo><mn>10</mn></mrow></mfrac><mo>=</mo><mn>5</mn></math></p><p>Therefore,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mfrac><mrow><mn>0</mn><mo>.</mo><mn>2</mn><mo>-</mo><mstyle displaystyle=\"true\"><mn>0</mn><mo>.</mo><mn>1</mn><mi>v</mi></mstyle></mrow><mrow><mn>0</mn><mo>.</mo><mn>2</mn></mrow></mfrac><mo>=</mo><msup><mi>e</mi><mrow><mo>-</mo><mn>5</mn><mi>t</mi></mrow></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>v</mi><mo>=</mo><mn>2</mn><mo>[</mo><mn>1</mn><mo>-</mo><msup><mi>e</mi><mrow><mo>&#8211;</mo><mn>5</mn><mi>t</mi></mrow></msup><mo>]</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo></math>&nbsp;At <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi><mo>,</mo><mo>&#160;</mo><mi>v</mi><mo>=</mo><mn>2</mn><mfenced close=\"]\" open=\"[\"><mrow><mn>1</mn><mo>-</mo><mfrac><mn>1</mn><mi>e</mi></mfrac></mrow></mfenced><mo>=</mo><mn>2</mn><mo>&#215;</mo><mfenced><mrow><mn>0</mn><mo>.</mo><mn>6</mn></mrow></mfenced><mo>=</mo><mn>1</mn><mo>.</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>&#949;</mi><mo>=</mo><mi>B</mi><mi mathvariant=\"script\">l</mi><mi>v</mi><mo>=</mo><mn>4</mn><mo>&#215;</mo><mn>0</mn><mo>.</mo><mn>25</mn><mo>&#215;</mo><mn>1</mn><mo>.</mo><mn>2</mn><mo>=</mo><mn>1</mn><mo>.</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></math>&nbsp;volts</p><p>Then, current at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>&nbsp;will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>i</mi><mo>=</mo><mfrac><mrow><mn>4</mn><mo>&#215;</mo><mn>0</mn><mo>.</mo><mn>25</mn><mo>&#215;</mo><mn>1</mn><mo>.</mo><mn>2</mn></mrow><mn>10</mn></mfrac><mo>=</mo><mn>0</mn><mo>.</mo><mn>12</mn><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></math></p><p>and magnetic force <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>i</mi><mi mathvariant=\"script\">l</mi><mi>B</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>12</mn><mo>&#215;</mo><mn>0</mn><mo>.</mo><mn>25</mn><mo>&#215;</mo><mn>4</mn><mo>=</mo><mn>0</mn><mo>.</mo><mn>12</mn><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi></math></p><p>and power dissipated <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>F</mi><mi>v</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>12</mn><mo>&#215;</mo><mn>1</mn><mo>.</mo><mn>2</mn><mo>=</mo><mn>0</mn><mo>.</mo><mn>144</mn><mo>&#160;</mo><mi mathvariant=\"normal\">W</mi></math></p><p>also for maximum velocity(terminal velocity)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>&#8594;</mo><mo>&#8734;</mo><mo>,</mo><mo>&#160;</mo><msup><mi>e</mi><mrow><mo>-</mo><mn>5</mn><mi>t</mi></mrow></msup><mo>&#8594;</mo><mn>0</mn></math>&nbsp;and hence&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mn>2</mn><mfenced close=\"]\" open=\"[\"><mrow><mn>1</mn><mo>-</mo><mn>0</mn></mrow></mfenced><mo>=</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo></math>&nbsp;Correct match is (D)</p></blockquote>", "image": null}, "videoSolution": {"videoId": "97fe671759ce4a6995454d69f66d4ea3", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Fge1qswLVL8RS.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Fge1qswLVL8RS.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64b1672d25f94b8a85b91cd9", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 1)", "title": "JEE Advanced 2023 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a89f23ac7d519f9b550", "previousYearPapers": [{"_id": "619f94337e944e1fdc2859b4", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021 (Paper 1)", "title": "JEE Advanced 2021 (Paper 1)"}], "type": "multipleCorrect", "level": 2, "question": {"text": "<p>A long straight wire carries a current,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mn>2</mn></math>&nbsp;ampere. A semi-circular conducting rod is placed beside it on two conducting parallel rails of negligible resistance. Both the rails are parallel to the wire. The wire, the rod and the rails lie in the same horizontal plane, as shown in the figure. Two ends of the semi-circular rod are at distances&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi>cm</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#160;</mo><mi>cm</mi></math>&nbsp;from the wire.&nbsp; At time&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>0</mn></math>, the rod starts moving on the rails with a speed&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mn>3</mn><mo>.</mo><mn>0</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>&nbsp;(see the figure).</p><p>A resistor&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>1.4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>&nbsp;and a capacitor&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>0</mn></msub><mo>=</mo><mn>5.0</mn><mo>&#160;</mo><mi>&#956;F</mi></math>&nbsp;are connected in series between the rails. At time&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>0</mn></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>0</mn></msub></math>&nbsp;is uncharged. Which of the following statement(s) is (are) correct? [<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#956;</mi><mn>0</mn></msub><mo>=</mo><mn>4</mn><mi>&#960;</mi><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>&#8722;</mo><mn>7</mn></mrow></msup></math>&nbsp;SI units. Take&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ln</mi><mn>2</mn><mo>=</mo><mn>0.7</mn></math>]</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/b7441289-f46c-471e-9ace-bb7533e4ce9e-image.png\" style=\"width: 200px; height: 275px;\" /></p>", "image": null}, "options": [{"id": "2Vh9k", "text": "Maximum current through&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1.2</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>&#8722;</mo><mn>6</mn></mrow></msup></math>&nbsp;ampere", "isCorrect": true, "image": null}, {"id": "N3Udi", "text": "Maximum current through&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3.8</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>&#8722;</mo><mn>6</mn></mrow></msup></math>&nbsp;ampere.", "isCorrect": false, "image": null}, {"id": "i8FRq", "text": "Maximum charge on capacitor&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>0</mn></msub></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8.4</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>&#8722;</mo><mn>12</mn></mrow></msup></math>&nbsp;coulomb.", "isCorrect": true, "image": null}, {"id": "nPNjR", "text": "Maximum charge on capacitor&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>0</mn></msub></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.4</mo><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>&#8722;</mo><mn>12</mn></mrow></msup></math>&nbsp;coulomb.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Magnetic field due the long wire,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>=</mo><mfrac><mrow><msub><mi>&#956;</mi><mn>0</mn></msub><mi>I</mi></mrow><mrow><mn>2</mn><mi>&#960;</mi><mi>x</mi></mrow></mfrac></math></p><p>Motional emf in small element,&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">d</mi><mi>&#949;</mi><mo>=</mo><mi>B</mi><mi>v</mi><mo>d</mo><mi>x</mi><mo>=</mo><mfrac><mrow><mn>3</mn><msub><mi>&#956;</mi><mn>0</mn></msub><mfenced><mn>2</mn></mfenced></mrow><mrow><mn>2</mn><mi>&#960;</mi><mi>x</mi></mrow></mfrac><mi mathvariant=\"normal\">d</mi><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#949;</mi><mo>=</mo><mfrac><mrow><mn>3</mn><msub><mi>&#956;</mi><mn>0</mn></msub></mrow><mi>&#960;</mi></mfrac><msubsup><mo>&#8747;</mo><mn>1</mn><mn>4</mn></msubsup><mfrac><mn>1</mn><mi>x</mi></mfrac><mi mathvariant=\"normal\">d</mi><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>&#949;</mi><mo>=</mo><mfrac><mrow><mn>3</mn><msub><mi>&#956;</mi><mn>0</mn></msub></mrow><mi>&#960;</mi></mfrac><mi>ln</mi><mn>4</mn></math><mat
