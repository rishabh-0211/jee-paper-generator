\">Δ</mi><mi mathvariant=\"normal\">ϕ</mi></math> is the potential difference developed between the ends of the wire, then the correct statement(s) is/are:<br ><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/bqdjjcsqdhyuvmpkofkmepelxuzfbpxamtelhauarfhhcdenjf.png\"/></p>", "image": null}, "options": [{"id": "rmJkX", "text": "<math><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi mathvariant=\"normal\">Δ</mi><mi mathvariant=\"normal\">ϕ</mi></mrow></mfenced></math>  is proportional to the length of the wire projected on the y-axis.", "isCorrect": true, "image": null}, {"id": "3nV29", "text": "<math><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi mathvariant=\"normal\">Δ</mi><mi mathvariant=\"normal\">ϕ</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>0</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>0</mn></mrow></msub><mi mathvariant=\"normal\">L</mi></math>  for  <math><mi mathvariant=\"normal\">β</mi><mo>=</mo><mn>2</mn></math>", "isCorrect": true, "image": null}, {"id": "7hYA9", "text": "<math><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi mathvariant=\"normal\">Δ</mi><mi mathvariant=\"normal\">ϕ</mi></mrow></mfenced></math>  remains the same if the parabolic wire is replaced by a straight wire,  <math><mi mathvariant=\"normal\">y</mi><mo>=</mo><mi mathvariant=\"normal\">x</mi></math>  initially, of length  <math><msqrt><mn>2</mn></msqrt><mi mathvariant=\"normal\">L</mi></math>", "isCorrect": true, "image": null}, {"id": "e7QGd", "text": "<math><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi mathvariant=\"normal\">Δ</mi><mi mathvariant=\"normal\">ϕ</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>0</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>0</mn></mrow></msub><mi mathvariant=\"normal\">L</mi></math>  for  <math><mi mathvariant=\"normal\">β</mi><mo>=</mo><mn>0</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/noxtjsiksydejfbnxnrbjitbyvbipjfqdsxyaeuxlkwiswmynb.png\"/> <br >For calculating the motional emf across the length of the wire, let us project wire such that  <math><mover accent=\"true\"><mrow><mi>B</mi></mrow><mo>→</mo></mover><mo>,</mo><mover accent=\"true\"><mrow><mi>v</mi></mrow><mo>→</mo></mover><mo>-</mo><mo>,</mo><mover accent=\"true\"><mrow><mi>i</mi></mrow><mo>→</mo></mover></math>  becomes mutually orthogonal. Thus, small emf 'dc' induced in elemental length  <math><mi>‘</mi><mi>d</mi><mi>y</mi><mi>’</mi></math>  of projected wire, will be -<br > <math><mo>⇒</mo><mi>d</mi><mi>ε</mi><mo>=</mo><mi>B</mi><msub><mrow><mi>v</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>d</mi><mi>y</mi><mo>=</mo><msub><mrow><mi>B</mi></mrow><mrow><mn>0</mn></mrow></msub><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mn>1</mn><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>y</mi></mrow><mrow><mi>L</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mi>β</mi></mrow></msup></mrow></mfenced><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>d</mi><mi>y</mi></math> <br > <math><mi>ε</mi><mo>=</mo><mrow><munderover><mo stretchy=\"true\">∫</mo><mrow><mn>0</mn></mrow><mrow><mi>L</mi></mrow></munderover><mrow><msub><mrow><mi>B</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mrow><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>y</mi></mrow><mrow><mi>L</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mi>β</mi></mrow></msup></mrow></mfenced><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>d</mi><mi>y</mi><mo>=</mo><mrow><munderover><mo stretchy=\"true\">∫</mo><mrow><mn>0</mn></mrow><mrow><mi>L</mi></mrow></munderover><mrow><msub><mrow><mi>B</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>⋅</mo><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>⋅</mo><mi>d</mi><mi>y</mi></mrow></mrow><mo>+</mo><mrow><munderover><mo stretchy=\"true\">∫</mo><mrow><mn>0</mn></mrow><mrow><mi>L</mi></mrow></munderover><mrow><mfrac><mrow><msub><mrow><mi>B</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>⋅</mo><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><msup><mrow><mi>L</mi></mrow><mrow><mi>β</mi></mrow></msup></mrow></mfrac><msup><mrow><mi>y</mi></mrow><mrow><mi>β</mi></mrow></msup><mo>⋅</mo><mi>d</mi><mi>y</mi></mrow></mrow></math> <br > <math><mo>=</mo><msub><mrow><mi>B</mi></mrow><mrow><mn>0</mn></mrow></msub><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>L</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>β</mi><mo>+</mo><mn>1</mn></mrow></mfrac></mrow></mfenced></math> <br > <math><mo>∴</mo></math>  emf in loop is proportional to  <math><mi>L</mi></math>  for given value of  <math><mi>β</mi></math> .<br > <math><mo>⇒</mo></math>  Option  <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">A</mi></mrow></mfenced></math>  is correct.<br >for<br > <math><mi>β</mi><mo>=</mo><mn>0</mn><mo>;</mo><mi>ε</mi><mo>=</mo><mn>2</mn><msub><mrow><mi>B</mi></mrow><mrow><mn>0</mn></mrow></msub><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>L</mi></math> <br > <math><mi>β</mi><mo>=</mo><mn>2</mn><mo>;</mo><mi>ε</mi><mo>=</mo><msub><mrow><mi>B</mi></mrow><mrow><mn>0</mn></mrow></msub><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>L</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac><msub><mrow><mi>B</mi></mrow><mrow><mn>0</mn></mrow></msub><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>L</mi><mo>⇒</mo></math>  Option  <math><mo>(</mo><mi mathvariant=\"normal\">B</mi><mo>)</mo></math>  is correct.<br >Now, the length of the projection of the wire  <math><mi>y</mi><mo>=</mo><mi>x</mi></math>  and length  <math><msqrt><mn>2</mn></msqrt><mi>L</mi></math>  on the y-axis is  <math><mi>L</mi></math>  thus the answer remain unchanged  <math><mo>⇒</mo></math>  Option  <math><mo>(</mo><mi mathvariant=\"normal\">C</mi><mo>)</mo></math>  is correct.", "image": null}, "videoSolution": {"videoId": "7deb779a159b4084b39635841f0f14bd", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/cVGS7nnBCB8op.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/cVGS7nnBCB8op.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf82e", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Paper 1)", "title": "JEE Advanced 2019 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a59f23ac7d519f9b398", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf82a", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017 (Paper 1)", "title": "JEE Advanced 2017 (Paper 1)"}], "type": "multipleCorrect", "level": 3, "question": {"text": "<p> A circular insulated copper wire loop is twisted to form two loops of area <math><mi>A</mi><mi> </mi></math> and <math><mn>2</mn><mi>A</mi></math> as shown in the figure. At the point of crossing the wires remain electrically insulated from each other. The entire loop lies in the plane (of the paper). A uniform magnetic field <math><mover accent=\"true\"><mrow><mi>B</mi></mrow><mo>→</mo></mover><mi> </mi></math> points into the plane of the paper. At <math><mi>t</mi><mi> </mi><mo>=</mo><mi> </mi><mn>0</mn></math> , the loop starts rotating about the common diameter as axis with a constant angular velocity in the magnetic field. Which of the following options is/are correct?<br ><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/qsouotgenakplnggoihvdgajfuevdbvlchgnwmywixubnersww.jpeg\"/></p>", "image": null}, "options": [{"id": "3SsGI", "text": "The net emf induced due to both the loops is proportional to  <math><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>ω</mi><mi>t</mi></mrow></mrow></math>", "isCorrect": false, "image": null}, {"id": "ACFQi", "text": "The amplitude of the maximum net emf induced due to both the loops is equal to the amplitude of the maximum emf induced in the smaller loop alone", "isCorrect": true, "image": null}, {"id": "nz3pI", "text": "The rate of change of flux is maximum when plane of loop is perpendicular to the plane of paper", "isCorrect": true, "image": null}, {"id": "Sylsn", "text": "The emf induced in the loop is proportional to sum of areas of two loops", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/7_solu_phys_pa1.jpg\"/></p><p>When a conducting loop rotating in a magnetic field <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>has an angular velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ω</mi></math>, the flux through the loop of area <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> at an angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>θ</mi><mo> </mo><mo>=</mo><mo> </mo><mi>ω</mi><mi>t</mi></math>, </p><p><math><mi>ϕ</mi><mo>=</mo><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi>B</mi></mrow></mfenced><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi>A</mi></mrow></mfenced><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></math></p><p><math><mo>=</mo><mi>B</mi><mi>A </mi><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mi>ω</mi><mi>t</mi></mrow></mfenced></mrow></mrow></math></p><p>The induced emf,</p><p><math><mi>ε</mi><mo>=</mo><mi> </mi><mo>-</mo><mfrac><mrow><mi>d</mi><mi>ϕ</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mi>B</mi><mi>A</mi><mi>ω</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mi>ω</mi><mi>t</mi></mrow></mfenced></mrow></mrow></math></p><p>So,  <math><mi>ε</mi><mi> </mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">d</mi><mfrac><mrow><mi>d</mi><mi>ϕ</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mi> </mi><mo>∝</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mi>ω</mi><mi>t</mi></mrow></mfenced></mrow></mrow></math></p><p>So, the emf is maximum when, <math><mi>ω</mi><mi>t</mi><mo>=</mo><mi>θ</mi><mo>=</mo><mfrac><mrow><mi>π</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>.</mo></math></p><p>Since the emf in the smaller loop will act opposite to that of the larger loop,</p><p><math><msub><mrow><mi>ε</mi></mrow><mrow><mi>N</mi><mi>e</mi><mi>t</mi></mrow></msub><mo>=</mo><mi> </mi><msub><mrow><mi>ε</mi></mrow><mrow><mn>2</mn><mi>A</mi></mrow></msub><mo>-</mo><mi> </mi><msub><mrow><mi>ε</mi></mrow><mrow><mi>A</mi></mrow></msub><mo>=</mo><mi>B</mi><mfenced separators=\"|\"><mrow><mn>2</mn><mi>A</mi></mrow></mfenced><mi>ω</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>ω</mi><mi>t</mi></mrow></mrow><mo>-</mo><mi>B</mi><mfenced separators=\"|\"><mrow><mi>A</mi></mrow></mfenced><mi>ω</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mi>ω</mi><mi>t</mi></mrow></mfenced></mrow></mrow></math></p><p><math><mo>=</mo><mi>B</mi><mfenced separators=\"|\"><mrow><mn>2</mn><mi>A</mi><mo>-</mo><mi>A</mi></mrow></mfenced><mi>ω</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>ω</mi><mi>t</mi></mrow></mrow><mo>=</mo><mi>B</mi><mi>A</mi><mi> </mi><mi>ω</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>ω</mi><mi>t</mi></mrow></mrow></math></p><p>So, the amplitude of the maximum net emf is equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mi>A</mi></math> which is same as that in the smaller loop.</p>", "image": null}, "videoSolution": {"videoId": "99c90a6cf3fd4bcb971b1a8dc5f28d52", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/VIDrAbSZSbHke.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/VIDrAbSZSbHke.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf82a", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017 (Paper 1)", "title": "JEE Advanced 2017 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a53f23ac7d519f9b364", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf829", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2016-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2016 (Paper 2)", "title": "JEE Advanced 2016 (Paper 2)"}], "type": "multipleCorrect", "level": 3, "question": {"text": "<p>A rigid wire loop of square shape having side of length L and resistance R is moving along the x-axis with a constant velocity <math><msub><mrow><mi>v</mi></mrow><mrow><mn>0</mn></mrow></msub></math> in the plane of the paper. At t = 0, the right edge of the loop enters a region of length 3L where there is a uniform magnetic field <math><msub><mrow><mi>B</mi></mrow><mrow><mn>0</mn></mrow></msub></math> into the plane of the paper, as shown in the figure. For sufficiently large <math><msub><mrow><mi>v</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>,</mo></math> the loop eventually crosses the region. Let x be the location of the right edge of the loop. Let v(x), I(x) and F(x) represent the velocity of the loop, current in the loop, and force on the loop, respectively, as a function of x. Counter-clockwise current is taken as positive.<br ><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/Phy_Papr2_9..jpg\"/><br >Which of the following schematic plot(s) is(are) correct ? (Ignore gravity)</p>", "image": null}, "options": [{"id": "wM77U", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/Phy_Papr2_9_a_.jpg\"/>", "isCorrect": false, "image": null}, {"id": "a8csh", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/Phy_Papr2_9_b_.jpg\"/>", "isCorrect": false, "image": null}, {"id": "LtPqh", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/Phy_Papr2_9_c_.jpg\"/>", "isCorrect": true, "image": null}, {"id": "8ErBj", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/Phy_Papr2_9_D_.jpg\"/>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/Phy_Papr2_9_Ans_.jpg\"/><br >When loop was entering (x < L)<br ><math><mi>ϕ</mi><mo>=</mo><mi>B</mi><mi>L</mi><mi>x</mi></math><br ><math><mi>e</mi><mo>=</mo><mfrac><mrow><mi>d</mi><mi>ϕ</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mi>B</mi><mi>L</mi><mfrac><mrow><mi>d</mi><mi>x</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math><br ><math><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi>e</mi></mrow></mfenced><mo>=</mo><mi>B</mi><mi>L</mi><mi>V</mi></math><br ><math><mi>i</mi><mo>=</mo><mfrac><mrow><mi>e</mi></mrow><mrow><mi>R</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>B</mi><mi>L</mi><mi>V</mi></mrow><mrow><mi>R</mi></mrow></mfrac><mfenced separators=\"|\"><mrow><mi>A</mi><mi>C</mi><mi>W</mi></mrow></mfenced></math><br ><math><mi>F</mi><mo>=</mo><mfrac><mrow><mi>i</mi></mrow><mrow><mi>B</mi></mrow></mfrac></math> (Left direction) = <math><mfrac><mrow><msup><mrow><mi>B</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>V</mi></mrow><mrow><mi>R</mi></mrow></mfrac></math> (in left direction)<br ><math><mo>⇒</mo><mi> </mi><mi> </mi><mi> </mi><mi>a</mi><mo>=</mo><mfrac><mrow><mi>F</mi></mrow><mrow><mi>m</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><msup><mrow><mi>B</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>V</mi></mrow><mrow><mi>m</mi><mi>R</mi></mrow></mfrac><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi>a</mi><mo>=</mo><mi>V</mi><mfrac><mrow><mi>d</mi><mi>V</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac></math><br ><math><mi>V</mi><mfrac><mrow><mi>d</mi><mi>V</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><msup><mrow><mi>B</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>V</mi></mrow><mrow><mi>m</mi><mi>R</mi></mrow></mfrac><mi> </mi><mi> </mi><mo>⇒</mo><mi> </mi><mi> </mi><mi> </mi><mrow><munderover><mo stretchy=\"false\">∫</mo><mrow><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mi>V</mi></mrow></munderover><mrow><mi>d</mi><mi>V</mi></mrow></mrow><mo>=</mo><mi> </mi><mo>-</mo><mfrac><mrow><msup><mrow><mi>B</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>m</mi><mi>R</mi></mrow></mfrac><mi> </mi><mrow><munderover><mo stretchy=\"false\">∫</mo><mrow><mn>0</mn></mrow><mrow><mi>x</mi></mrow></munderover><mrow><mi>d</mi><mi>x</mi></mrow></mrow></math><br ><math><mo>⇒</mo><mi> </mi><mi> </mi><mi> </mi><mi>V</mi><mo>=</mo><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>-</mo><mfrac><mrow><msup><mrow><mi>B</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>m</mi><mi>R</mi></mrow></mfrac><mi>x</mi></math> (straight line of negative slope for x < L)<br ><math><mi>I</mi><mo>=</mo><mfrac><mrow><mi>B</mi><mi>L</mi></mrow><mrow><mi>R</mi></mrow></mfrac><mi> </mi><mi>V</mi><mi> </mi><mo>⇒</mo><mi> </mi></math> (I vs x will also be straight line of negative slope for x < L)<br ><math><mi>L</mi><mo>≤</mo><mi>x</mi><mo>≤</mo><mn>3</mn><mi>L</mi></math><br ><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/Phy_Papr2_9_1_.jpg\"/><br ><math><mfrac><mrow><mi>d</mi><mi>ϕ</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mn>0</mn></math><br ><math><mi>e</mi><mo>=</mo><mn>0</mn><mi> </mi><mi> </mi><mi>i</mi><mo>=</mo><mn>0</mn></math><br >F = 0<br ><math><mi>x</mi><mo>></mo><mn>4</mn><mi>L</mi></math><br ><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/Phy_Papr2_9_2_.jpg\"/><br ><math><mi>e</mi><mo>=</mo><mi>B</mi><mi mathvariant=\"script\">l</mi><mi>v</mi></math><br >Force also will be in left direction.<br ><math><mi>i</mi><mo>=</mo><mfrac><mrow><mi>B</mi><mi>L</mi><mi>W</mi></mrow><mrow><mi>R</mi></mrow></mfrac></math> (clockwise) <math><mi>a</mi><mo>=</mo><mfrac><mrow><msup><mrow><mi>B</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>V</mi></mrow><mrow><mi>m</mi><mi>R</mi></mrow></mfrac><mo>=</mo><mi>V</mi><mfrac><mrow><mi>d</mi><mi>V</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac></math><br ><math><mi>F</mi><mo>=</mo><mfrac><mrow><msup><mrow><mi>B</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>V</mi></mrow><mrow><mi>R</mi><mi> </mi></mrow></mfrac></math> <math><mrow><munderover><mo stretchy=\"false\">∫</mo><mrow><mi>L</mi></mrow><mrow><mi>x</mi></mrow></munderover><mrow><mo>-</mo><mfrac><mrow><msup><mrow><mi>B</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>m</mi><mi>R</mi></mrow></mfrac><mi>d</mi><mi>x</mi><mo>=</mo><mrow><munderover><mo stretchy=\"false\">∫</mo><mrow><msub><mrow><mi>V</mi></mrow><mrow><mi>i</mi></mrow></msub></mrow><mrow><msub><mrow><mi>V</mi></mrow><mrow><mi>f</mi></mrow></msub></mrow></munderover><mrow><mi>d</mi><mi>V</mi></mrow></mrow></mrow></mrow></math><br ><math><mo>⇒</mo><mi> </mi><mi> </mi><mfrac><mrow><msup><mrow><mi>B</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>m</mi><mi>R</mi></mrow></mfrac><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mi>L</mi></mrow></mfenced><mo>=</mo><msub><mrow><mi>V</mi></mrow><mrow><mi>f</mi></mrow></msub><mo>-</mo><msub><mrow><mi>V</mi></mrow><mrow><mi>i</mi></mrow></msub></math><br ><math><msub><mrow><mi>V</mi></mrow><mrow><mi>f</mi></mrow></msub><mo>=</mo><msub><mrow><mi>V</mi></mrow><mrow><mi>i</mi></mrow></msub><mo>-</mo><mfrac><mrow><msup><mrow><mi>B</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>m</mi><mi>R</mi></mrow></mfrac><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mi>L</mi></mrow></mfenced></math> (straight line of negative slope)<br ><math><mi>I</mi><mo>=</mo><mfrac><mrow><mi>B</mi><mi>L</mi><mi>V</mi></mrow><mrow><mi>R</mi></mrow></mfrac><mo>→</mo></math> (Clockwise) (straight line of negative slope)", "image": null}, "videoSolution": {"videoId": "b9778cb1e5484a22bdf0e5637972c892", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/oVyBZ88X7qz2P.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/oVyBZ88X7qz2P.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf829", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2016-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2016 (Paper 2)", "title": "JEE Advanced 2016 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a4df23ac7d519f9b32c", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf828", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016 (Paper 1)", "title": "JEE Advanced 2016 (Paper 1)"}], "type": "multipleCorrect", "level": 3, "question": {"text": "<p>A conducting loop in the shape of right angled isosceles triangle of height 10 cm is kept such that the <math><msup><mrow><mn>90</mn></mrow><mrow><mi>o</mi></mrow></msup></math> vertex is very close to an infinitely long conducting wire (see the figure). The wire is electrically insulated from the loop. The hypotenuse of the triangle is parallel to the wire. The current in the triangular loop is in counterclockwise direction and increased at constant rate of <math><mn>10</mn><mi> </mi><mi>A</mi><mi> </mi><msup><mrow><mi>s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>.</mo></math> Which of the following statement(s) is (are) true?<br ><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/Phy_7.jpg\"/></p>", "image": null}, "options": [{"id": "RDq5l", "text": "The induced current in the wire is in opposite direction to the current along the hypotenuse.", "isCorrect": false, "image": null}, {"id": "lC8kf", "text": "There is a repulsive force between the wire and the loop", "isCorrect": true, "image": null}, {"id": "B5BWj", "text": "If the loop is rotated at a constant angular speed about the wire, an additional emf of  <math><mfenced separators=\"|\"><mrow><mfrac><mrow><msub><mrow><mi>μ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mi>π</mi></mrow></mfrac></mrow></mfenced></math>  volt is induced in the wire.", "isCorrect": false, "image": null}, {"id": "qOqte", "text": "The magnitude of induced emf in the wire is <math><mfenced separators=\"|\"><mrow><mfrac><mrow><msub><mrow><mi>&mu;</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mi>&pi;</mi></mrow></mfrac></mrow></mfenced></math> volt", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>From lenz's law it can be understood that due to induced current in wire flux will change in loop thats why it will be repelled by the loop</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/Phy_Papr1_7_Ans_.jpg\"/><br >Also by direction of induced electric field, the current in the wire is in the same direction of current along the hypotenuse.<br >Flux through triangle if wire has current <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>i</mi><mn>1</mn></msub></math> </p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>ϕ</mi><mn>2</mn></msub><mo>=</mo><msubsup><mo>∫</mo><mn>0</mn><mrow><mn>0</mn><mo>.</mo><mn>1</mn></mrow></msubsup><mi>B</mi><mo>d</mo><mi>A</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi> </mi><munderover><mo>∫</mo><mn>0</mn><mn>0.1</mn></munderover><mfenced separators=\"|\"><mfrac><mrow><msub><mi>μ</mi><mn>0</mn></msub><msub><mi>i</mi><mn>1</mn></msub></mrow><mrow><mn>2</mn><mi>π</mi><mi>x</mi></mrow></mfrac></mfenced><mi> </mi><mfenced separators=\"|\"><mrow><mn>2</mn><mi>x</mi><mi>d</mi><mi>x</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><msub><mi>μ</mi><mn>0</mn></msub><msub><mi>i</mi><mn>1</mn></msub></mrow><mrow><mn>10</mn><mi>π</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mo> </mo><msub><mi>ϕ</mi><mn>2</mn></msub><mo>=</mo><mi>M</mi><msub><mi>i</mi><mn>1</mn></msub></math><br ><math><mo>⇒</mo><mi> </mi><mi> </mi><mi> </mi></math> Mutual inductance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><mo>=</mo><mfrac><msub><mi>μ</mi><mn>0</mn></msub><mrow><mn>10</mn><mi>π</mi></mrow></mfrac></math><br >Induced emf in wire</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>ε</mi><mn>1</mn></msub><mo>=</mo><mi>M</mi><mfrac><mrow><mi>d</mi><msub><mi>i</mi><mn>2</mn></msub></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><msub><mi>μ</mi><mn>0</mn></msub><mrow><mn>10</mn><mi>π</mi></mrow></mfrac><mfrac><mrow><mi>d</mi><msub><mi>i</mi><mn>2</mn></msub></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><msub><mi>μ</mi><mn>0</mn></msub><mrow><mn>10</mn><mi>π</mi></mrow></mfrac><mo>×</mo><mn>10</mn><mo>=</mo><mfrac><msub><mi>μ</mi><mn>0</mn></msub><mi>π</mi></mfrac></math></p>", "image": null}, "videoSolution": {"videoId": "3bffe3d5e1624ac28eb3c0a0fc57c1ba", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/xx6Zw7UQK8ZBD.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/xx6Zw7UQK8ZBD.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf828", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016 (Paper 1)", "title": "JEE Advanced 2016 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "64b16ad2f23ac7d519f9b86e", "title": "Inductance", "totalQuestions": 1, "questions": [{"_id": "64b16a2df23ac7d519f9b209", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf823", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2013-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2013 (Paper 2)", "title": "JEE Advanced 2013 (Paper 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<strong> Paragraph: </strong>\r\n\r\nA point charge $Q$ is moving in a circular orbit of radius $R$ in the $x-y$ plane with an angular velocity $\\omega .$ This can be considered as equivalent to a loop carrying a steady current $\\frac{Q \\omega}{2 \\pi}$. A uniform magnetic field along the positive $z$-axis is now switched on, which increases at a constant rate from 0 to $B$ in one second. Assume that the radius of the orbit remains constant. The application of the magnetic field induces an emf in the orbit. The induced emf is defined as the work done by an induced electric field in moving a unit positive charge around a closed loop. It is known that, for an orbiting charge, the magnetic dipole moment is proportional to the angular momentum with a proportionality constant $\\gamma$.\r\n\r\n<br> <strong> Question: </strong>\r\n\r\nThe change in the magnetic dipole moment associated with the orbit, at the end of the time interval of the magnetic field change, is", "image": null}, "options": [{"id": "qqAw7", "text": "<math> <mrow> <mo>-</mo> <mi>&#947;&#160;</mi> <msup> <mtext>BQR</mtext> <mn>2</mn> </msup> </mrow> </math>", "isCorrect": false, "image": null}, {"id": "RaBmW", "text": "<math> <mrow> <mo>-</mo> <mi>&#947;&#160;</mi> <mfrac> <mrow> <msup> <mtext>BQR</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math>", "isCorrect": true, "image": null}, {"id": "JpuRh", "text": "<math> <mrow> <mi>&#947;&#160;</mi> <mfrac> <mrow> <msup> <mtext>BQR</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math>", "isCorrect": false, "image": null}, {"id": "DnNAQ", "text": "<math> <mrow> <mi>&#947;&#160;</mi> <msup> <mtext>BQR</mtext> <mn>2</mn> </msup> </mrow> </math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Magnetic dipole moment <math> <mrow> <mtext>M</mtext> <mo>=</mo> <mi>&#947;</mi> <mtext>J</mtext> </mrow> </math><br /><math> <mrow> <mo>&#916;</mo> <mtext>M</mtext> <mo>=</mo> <mi>&#947;</mi> <mo>&#916;</mo> <mtext>J</mtext> </mrow> </math>&nbsp;...(1)<br /><math> <mrow> <mfrac> <mrow> <mo>&#916;</mo> <mtext>J</mtext> </mrow> <mrow> <mo>&#916;</mo> <mtext>t</mtext> </mrow> </mfrac> <mo>=</mo> <mo>-</mo> <mtext>Q</mtext> <mfrac> <mrow> <mtext>dB</mtext> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> <mo>&#183;</mo> <mfrac> <mrow> <mtext>R</mtext> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </math><br /><math> <mrow> <mo>&#916;</mo> <mtext>J</mtext> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <mtext>QB</mtext> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msup> <mtext>R</mtext> <mn>2</mn> </msup> </mrow> </math><br />So <math> <mrow> <mo>&#916;</mo> <mtext>M</mtext> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <mi>&#947;</mi> <msup> <mtext>QBR</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math><br /><strong>Alternate</strong><br /><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/EM0012621_AnsExp2_1.jpg\" /></strong><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mtext>M</mtext><mtext>L</mtext></mfrac><mo>=</mo><mfrac><mtext>Q</mtext><mrow><mn>2</mn><mtext>m</mtext></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>M</mtext><mo>=</mo><mfr <mtext>QB</mtext> </mrow> <mrow> <mn>2</mn> <mtext>m</mtext> </mrow> </mfrac> </mrow> </mfenced> <mfrac> <mrow> <msup> <mtext>R</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mtext>M</mtext><mo>=</mo><msub><mtext>M</mtext><mtext>f</mtext></msub><mo>-</mo><msub><mtext>M</mtext><mtext>i</mtext></msub><mo>=</mo><mfrac><mrow><mtext>Q</mtext><mi>&#969;</mi><msup><mtext>R</mtext><mn>2</mn></msup></mrow><mn>2</mn></mfrac><mo>-</mo><mfrac><mrow><msup><mtext>Q</mtext><mn>2</mn></msup><msup><mtext>BR</mtext><mn>2</mn></msup></mrow><mrow><mn>4</mn><mtext>m</mtext></mrow></mfrac><mo>-</mo><mfrac><mrow><mtext>Q</mtext><mi>&#969;</mi><msup><mtext>R</mtext><mn>2</mn></msup></mrow><mn>2</mn></mfrac><mo>=</mo><mo>-</mo><mi>&#947;</mi><mfrac><msup><mtext>BQR</mtext><mn>2</mn></msup><mn>2</mn></mfrac></math>", "image": null}, "videoSolution": {"videoId": "9df6600dd9e7464382b19490fd3f4372", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/JAsutopLquOFz.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/JAsutopLquOFz.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf823", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2013-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2013 (Paper 2)", "title": "JEE Advanced 2013 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "64b16ad2f23ac7d519f9b86d", "title": "Self and Mutual Inductance", "totalQuestions": 2, "questions": [{"_id": "64b16a83f23ac7d519f9b51c", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf831", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2020-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2020 (Paper 2)", "title": "JEE Advanced 2020 (Paper 2)"}], "type": "numerical", "level": 3, "question": {"text": "<p>The inductors of two <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi><mi>R</mi></math> circuits are placed next to each other, as shown in the figure. The values of the self-inductance of the inductors, resistances, mutual-inductance and applied voltages are specified in the given circuit. After both the switches are closed simultaneously, the total work done by the batteries against the induced <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mi>M</mi><mi>F</mi></math> in the inductors by the time the currents reach their steady-state values is_______<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>mJ</mi></math>.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/2f0783c2-7251-40b7-94cc-5ed3518be948-image_v2.png\"/></p>", "image": null}, "options": [], "correctValue": "55", "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/97414cae-6750-467a-9fe6-961b6279a830-image.png\"/></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>ε</mi><mn>1</mn></msub><mo>=</mo><msub><mi>L</mi><mn>1</mn></msub><mfrac><mrow><mi>d</mi><msub><mi>i</mi><mn>1</mn></msub></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>+</mo><mi>M</mi><mfrac><mrow><mi>d</mi><msub><mi>i</mi><mn>2</mn></msub></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi><msub><mi>W</mi><mn>1</mn></msub><mo>=</mo><msub><mi>ε</mi><mn>1</mn></msub><msub><mi>i</mi><mn>1</mn></msub><mi>d</mi><mi>t</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msub><mi>L</mi><mn>1</mn></msub><mfenced><mrow><mi>d</mi><msub><mi>i</mi><mn>1</mn></msub></mrow></mfenced><msub><mi>i</mi><mn>1</mn></msub><mo>+</mo><mi>M</mi><mfenced><mrow><mi>d</mi><msub><mi>i</mi><mn>2</mn></msub></mrow></mfenced><msub><mi>i</mi><mn>1</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi><msub><mi>W</mi><mn>2</mn></msub><mo>=</mo><msub><mi>L</mi><mn>2</mn></msub><mfenced><mrow><mi>d</mi><msub><mi>i</mi><mn>2</mn></msub></mrow></mfenced><msub><mi>i</mi><mn>2</mn></msub><mo>+</mo><mi>M</mi><mfenced><mrow><mi>d</mi><msub><mi>i</mi><mn>1</mn></msub></mrow></mfenced><msub><mi>i</mi><mn>2</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi><msub><mi>W</mi><mn mathvariant=\"italic\">1</mn></msub><mo mathvariant=\"italic\">+</mo><mi>d</mi><msub><mi>W</mi><mn mathvariant=\"italic\">2</mn></msub><mo mathvariant=\"italic\">=</mo><msub><mi>L</mi><mn mathvariant=\"italic\">1</mn></msub><msub><mi>i</mi><mn mathvariant=\"italic\">1</mn></msub><mfenced><mrow><mi mathvariant=\"italic\">d</mi><msub><mi mathvariant=\"italic\">i</mi><mn mathvariant=\"italic\">1</mn></msub></mrow></mfenced><mo mathvariant=\"italic\">+</mo><msub><mi>L</mi><mn mathvariant=\"italic\">2</mn></msub><msub><mi>i</mi><mn mathvariant=\"italic\">2</mn></msub><mfenced><mrow><mi mathvariant=\"italic\">d</mi><msub><mi mathvariant=\"italic\">i</mi><mn mathvariant=\"italic\">2</mn></msub></mrow></mfenced><mo mathvariant=\"italic\">+</mo><mi>M</mi><mi>d</mi><mfenced><mrow><msub><mi mathvariant=\"italic\">i</mi><mn mathvariant=\"italic\">1</mn></msub><mo mathvariant=\"italic\">·</mo><msub><mi mathvariant=\"italic\">i</mi><mn mathvariant=\"italic\">2</mn></msub></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msub><mi>L</mi><mn>1</mn></msub><msubsup><mi>i</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msub><mi>L</mi><mn>2</mn></msub><msubsup><mi>i</mi><mn>2</mn><mn>2</mn></msubsup><mo>+</mo><msub><mi>M</mi><mn>1</mn></msub><msub><mi>i</mi><mn>2</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>55</mn><mo> </mo><mi>mJ</mi></math>,</p><p>Note : If mutual induction is taken in opposite direction then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">W</mi><mo>=</mo><mn>35</mn><mo> </mo><mi>mJ</mi></math></p>", "image": null}, "videoSolution": {"videoId": "a311c33c59874065896de43dda928a07", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/WZRp04462O5ON.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/WZRp04462O5ON.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf831", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2020-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2020 (Paper 2)", "title": "JEE Advanced 2020 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a19f23ac7d519f9b155", "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c4a", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 1)", "title": "JEE Advanced 2012 (Paper 1)"}], "type": "numerical", "level": 3, "question": {"text": "A circular wire loop of radius $R$ is placed in the $x-y$ plane centered at the origin $O$. A square loop of side $a(a< < R)$ having two turns is placed with its centre at $z=\\sqrt{3} R$ along the axis of the circular wire loop, as shown in figure.<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/JqNcOFDBbBi_8pytzODy6YCrM91SCU7qIL1ioD2YVLw.original.fullsize.png\"><br>\r\n\r\nThe plane of the square loop makes an angle of $45^{\\circ}$ with respect to the $z$-axis. If the mutual inductance between the loops is given by $\\frac{\\mu_{0} a^{2}}{2^{p / 2} R}$, then the value of $p$ is", "image": null}, "options": [], "correctValue": "7", "solution": {"text": "The magnetic field due to current carrying wire at the location of square loop is\r\n\r\n$B=\\frac{\\mu_{0}}{4 \\pi} \\frac{2 \\pi i R^{2}}{\\left(R^{2}+3 R^{2}\\right)^{3 / 2}}=\\frac{\\mu_{0} i}{16 R}$\r\n\r\nThe mutual induction\r\n\r\n$\\begin{array}{l}\r\n\r\nM=\\frac{N \\phi}{i}=\\frac{2}{i}\\left[\\frac{\\mu_{0} i}{16 R} \\times a^{2} \\cos 45^{\\circ}\\right] \\\\\r\n\r\n\\therefore \\quad M=\\frac{\\mu_{0} a^{2}}{2^{\\frac{7}{2}} R}\r\n\r\n\\end{array}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c4a", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 1)", "title": "JEE Advanced 2012 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "64b16ad3f23ac7d519f9b870", "title": "LR Circuit", "totalQuestions": 2, "questions": [{"_id": "64b16a64f23ac7d519f9b401", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf82c", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018 (Paper 1)", "title": "JEE Advanced 2018 (Paper 1)"}], "type": "multipleCorrect", "level": 3, "question": {"text": "<p>In the figure below, the switches <math><msub><mrow><mi>S</mi></mrow><mrow><mn>1</mn></mrow></msub><mi> </mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">d</mi><mi> </mi><msub><mrow><mi>S</mi></mrow><mrow><mn>2</mn></mrow></msub></math> are closed simultaneously at <math><mi>t</mi><mi> </mi><mo>=</mo><mi> </mi><mn>0</mn></math> and a current starts to flow in the circuit. Both the batteries have the same magnitude of the electromotive force (emf) and the polarities are as indicated in the figure. Ignore mutual inductance between the inductors. The current I in the middle wire reaches its maximum magnitude <math><msub><mrow><mi>I</mi></mrow><mrow><mi>m</mi><mi>a</mi><mi>x</mi></mrow></msub></math> time <math><mi>t</mi><mi> </mi><mo>=</mo><mi>τ</mi></math>. Which of the following statements is (are) true?<br ><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/4_ques_phys_3.jpg\"/></p>", "image": null}, "options": [{"id": "GjfAQ", "text": "<math><msub><mrow><mi>I</mi></mrow><mrow><mi>m</mi><mi>a</mi><mi>x</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>V</mi></mrow><mrow><mn>2</mn><mi>R</mi></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "d9I6G", "text": "<math><msub><mrow><mi>I</mi></mrow><mrow><mi>m</mi><mi>a</mi><mi>x</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>V</mi></mrow><mrow><mn>4</mn><mi>R</mi></mrow></mfrac></math>", "isCorrect": true, "image": null}, {"id": "xVHGR", "text": "<math><mi>τ</mi><mo>=</mo><mfrac><mrow><mi>L</mi></mrow><mrow><mi>R</mi></mrow></mfrac><mrow><mrow><mi mathvariant=\"normal\">ln</mi></mrow><mo>⁡</mo><mrow><mn>2</mn></mrow></mrow></math>", "isCorrect": false, "image": null}, {"id": "1F0GI", "text": "<math><mi>τ</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>L</mi></mrow><mrow><mi>R</mi></mrow></mfrac><mi mathvariant=\"script\">l</mi><mrow><mrow><mi mathvariant=\"normal\">ln</mi></mrow><mo>⁡</mo><mrow><mn>2</mn></mrow></mrow></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/hflyofvoiphmshewodaoropytzaepteggbqkftudtubltlnbuk.jpeg\"/></p><p>The current in the middle, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi></math>, as shown in the figure above has a maximum value,<br ><math><msub><mrow><mi>i</mi></mrow><mrow><mi>m</mi> mId": "615d76cfc52ffa3c944600e0", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018 (Paper 1)", "title": "JEE Advanced 2018 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a5ff23ac7d519f9b3d1", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf82b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2017-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2017 (Paper 2)", "title": "JEE Advanced 2017 (Paper 2)"}], "type": "multipleCorrect", "level": 3, "question": {"text": "<p>A source of constant voltage <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">V</mi></math> is connected to a resistance<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo> </mo><mi mathvariant=\"normal\">R</mi></math> and two ideal inductors <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">L</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">L</mi><mn>2</mn></msub></math> through a switch <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi></math> as shown. There is no mutual inductance between the two inductors. The switch <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi></math> is initially open. At <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">t</mi><mo>=</mo><mn>0</mn></math> , the switch is closed and current begins to flow. Which of the following options is/are correct?<br ><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/446324a5-f822-43ab-913b-f02aeb4331ea-image.png\"/></p>", "image": null}, "options": [{"id": "wt3al", "text": "The ratio of the currents through <math><msub><mrow><mi>L</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msub></math> is fixed at all times <math><mfenced separators=\"|\"><mrow><mi>t</mi><mo>&gt;</mo><mn>0</mn></mrow></mfenced></math>", "isCorrect": true, "image": null}, {"id": "AXUZE", "text": "After a long time, the current through <math><msub><mrow><mi>L</mi></mrow><mrow><mn>1</mn></mrow></msub></math> will be <math><mfrac><mrow><mi>V</mi></mrow><mrow><mi>R</mi></mrow></mfrac><mfrac><mrow><msub><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>L</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math>", "isCorrect": true, "image": null}, {"id": "Euru5", "text": "After a long time, the current through <math><msub><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msub></math> will be <math><mfrac><mrow><mi>V</mi></mrow><mrow><mi>R</mi></mrow></mfrac><mfrac><mrow><msub><mrow><mi>L</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>L</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math>", "isCorrect": true, "image": null}, {"id": "iRdnx", "text": "At  <math><mi>t</mi><mo>=</mo><mn>0</mn></math> , the current through the resistance R is  <math><mfrac><mrow><mi>V</mi></mrow><mrow><mi>R</mi></mrow></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/88462d42-ccf9-4995-ab83-a4096c0bb7e7-image.png\"/> </p><p>As <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">L</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">L</mi><mn>2</mn></msub></math> are in parallel so equivalent  </p><p>inductance, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">L</mi><mo>=</mo><mfrac><mrow><msub><mi mathvariant=\"normal\">L</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">L</mi><mn>2</mn></msub></mrow><mrow><msub><mi mathvariant=\"normal\">L</mi><mn>1</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">L</mi><mn>2</mn></msub></mrow></mfrac></math></p><p>Here, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>2</mn></msub></math> are the inductance (shown in circuit)</p><p>The current through the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>RL</mi></math> series circuit at anytime is given as </p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi><mo>=</mo><mi mathvariant=\"normal\"> </mi><mfrac><mi mathvariant=\"normal\">V</mi><mi mathvariant=\"normal\">R</mi></mfrac><mfenced><mrow><mn>1</mn><mo>-</mo><msup><mi mathvariant=\"normal\">e</mi><mfrac><mrow><mo>-</mo><mi>Rt</mi></mrow><mi mathvariant=\"normal\">L</mi></mfrac></msup></mrow></mfenced></math></p><p>At <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">t</mi><mo>=</mo><mn>0</mn></math>,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">V</mi><mi mathvariant=\"normal\">R</mi></mfrac><mfenced><mrow><mn>1</mn><mo>-</mo><msup><mi mathvariant=\"normal\">e</mi><mn>0</mn></msup></mrow></mfenced><mo>=</mo><mn>0</mn></math></p><p>After a longtime i.e. at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">t</mi><mo>=</mo><mo>∞</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">V</mi><mi mathvariant=\"normal\">R</mi></mfrac><mfenced><mrow><mn>1</mn><mo>-</mo><msup><mi mathvariant=\"normal\">e</mi><mrow><mo>-</mo><mo>∞</mo></mrow></msup></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi mathvariant=\"normal\">I</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">V</mi><mi mathvariant=\"normal\">R</mi></mfrac></math></p><p>Let currents through <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">L</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">L</mi><mn>2</mn></msub></math> are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">I</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">I</mi><mn>2</mn></msub></math> respectively. As <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">L</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">L</mi><mn>2</mn></msub></math> are joined in parallel</p><p>Voltage across <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">L</mi><mn>1</mn></msub><mo>=</mo></math> Voltage across <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">L</mi><mn>2</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msub><mi mathvariant=\"normal\">V</mi><msub><mi mathvariant=\"normal\">L</mi><mn>1</mn></msub></msub><mo>=</mo><msub><mi mathvariant=\"normal\">V</mi><msub><mi mathvariant=\"normal\">L</mi><mn>2</mn></msub></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msub><mi mathvariant=\"normal\">L</mi><mn>1</mn></msub><mfrac><mrow><mo>d</mo><msub><mi mathvariant=\"normal\">I</mi><mn>1</mn></msub></mrow><mrow><mo>d</mo><mi mathvariant=\"normal\">t</mi></mrow></mfrac><mo>=</mo><msub><mi mathvariant=\"normal\">L</mi><mn>2</mn></msub><mfrac><mrow><mo>d</mo><msub><mi mathvariant=\"normal\">I</mi><mn>2</mn></msub></mrow><mrow><mo>d</mo><mi mathvariant=\"normal\">t</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msub><mi mathvariant=\"normal\">L</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">I</mi><mn>1</mn></msub><mo>=</mo><msub><mi mathvariant=\"normal\">L</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">I</mi><mn>2</mn></msub></math></p><p>Thus, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi mathvariant=\"normal\">I</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">I</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">L</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">L</mi><mn>1</mn></msub></mfrac></math></p><p>By current division rule,</p><p>Current <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">I</mi><mn>1</mn></msub></math> across <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">L</mi><mn>1</mn></msub></math> is </p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">I</mi><mn>1</mn></msub><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">L</mi><mn>2</mn></msub><mrow><msub><mi mathvariant=\"normal\">L</mi><mn>1</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">L</mi><mn>2</mn></msub></mrow></mfrac><mo>×</mo><mi mathvariant=\"normal\">I</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msub><mi mathvariant=\"normal\">I</mi><mn>1</mn></msub><mo>=</mo><mfrac><mi mathvariant=\"normal\">V</mi><mi mathvariant=\"normal\">R</mi></mfrac><mfenced><mfrac><msub><mi mathvariant=\"normal\">L</mi><mn>2</mn></msub><mrow><msub><mi mathvariant=\"normal\">L</mi><mn>1</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">L</mi><mn>2</mn></msub></mrow></mfrac></mfenced></math></p><p>Current <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">I</mi><mn>2</mn></msub></math> across <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">L</mi><mn>2</mn></msub></math> is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">I</mi><mn>2</mn></msub><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">L</mi><mn>1</mn></msub><mrow><msub><mi mathvariant=\"normal\">L</mi><mn>1</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">l</mi><mn>2</mn></msub></mrow></mfrac><mo>×</mo><mi mathvariant=\"normal\">I</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">I</mi><mn>2</mn></msub><mo>=</mo><mfrac><mi mathvariant=\"normal\">V</mi><mi mathvariant=\"normal\">R</mi></mfrac><mfenced><mfrac><msub><mi mathvariant=\"normal\">L</mi><mn>1</mn></msub><mrow><msub><mi mathvariant=\"normal\">L</mi><mn>1</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">L</mi><mn>2</mn></msub></mrow></mfrac></mfenced></math></p>", "image": null}, "videoSolution": {"videoId": "e7bd7cf555734ca5b5289e5042b758fd", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/HSB4ECtJ6JA7n.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/HSB4ECtJ6JA7n.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf82b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2017-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2017 (Paper 2)", "title": "JEE Advanced 2017 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    if (!data.topics || data.topics.length === 0) {
      document.getElementById('current-topic-title').textContent = "No Questions Available";
      document.getElementById('current-topic-count').textContent = "0 Questions";
      document.getElementById('questions-list').innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted); font-size: 16px;">No previous year questions recorded for this chapter in this exam.</div>';
    } else {
      data.topics.forEach((t, i) => {
        const pill = document.createElement('div');
        pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
        pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
        pill.onclick = () => selectTopic(i);
        pillsContainer.appendChild(pill);
      });
    }

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Advanced';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => { if (data.topics && data.topics.length > 0) selectTopic(0); });
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      if (data.topics && data.topics.length > 0) selectTopic(0);
    }
  </script>
