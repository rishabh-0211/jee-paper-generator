alse}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64b1672d25f94b8a85b91cd9", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 1)", "title": "JEE Advanced 2023 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a33f23ac7d519f9b245", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf824", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014 (Paper 1)", "title": "JEE Advanced 2014 (Paper 1)"}], "type": "numerical", "level": 2, "question": {"text": "<p>A rocket is moving in a gravity free space with a constant acceleration of <math><mn>2</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">m</mi><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></math> along + x direction (see figure). The length of a chamber inside the rocket is 4 m. A ball is thrown from the left end of the chamber in + x direction with a speed of <math><mn>0.3</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">m</mi><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> relative to the rocket. At the same time, another ball is thrown in - x direction with a speed of <math><mn>0.2</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">m</mi><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> from its right end relative to the rocket. The time in seconds when the two balls hit each other for the first time is<br ><br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/image11-7df61076-1252-4ac5-a2f5-9e712e7fb910.png\"/></p>", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "Consider motion of two balls with respect to rocket.\r\n\r\n\\(\\frac{u^2}{2 a}=\\frac{0.3 \\times 0.3}{2 \\times 2}=\\frac{0.09}{4}=0.02 m\\)\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/image11-7df61076-1252-4ac5-a2f5-9e712e7fb910.png\"/>\r\n\r\nSo, collision of two bals will take place very near to left wall.\r\n\r\n\\(\\begin{aligned}\r\n\r\n& \\text { for } B S=u t+\\frac{1}{2} a t^2 \\\\\r\n\r\n& -4=-0.2 t\\left(\\frac{1}{2}\\right) 2 t^2 \\Rightarrow t^2+0.2 t \\\\\r\n\r\n& -4=0 \\\\\r\n\r\n& \\Rightarrow f t=\\frac{-0.2 \\pm \\sqrt{0.04+16}}{2}=1.9\r\n\r\n\\end{aligned}\\)\r\n\r\nnearest integer \\(=2 \\mathrm{~s}\\)", "image": null}, "videoSolution": {"videoId": "1d4ca06760fb4ae196328dc94e575126", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/W5vT9fmtRKKaK.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/W5vT9fmtRKKaK.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf824", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014 (Paper 1)", "title": "JEE Advanced 2014 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a33f23ac7d519f9b241", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf824", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014 (Paper 1)", "title": "JEE Advanced 2014 (Paper 1)"}], "type": "numerical", "level": 3, "question": {"text": "<p>Airplanes A and B are flying with constant velocity in the same vertical plane at angles <math><msup><mrow><mn>30</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math> and <math><msup><mrow><mn>60</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math> with respect to the horizontal respectively as shown in the figure. The speed of A is <math><mn>100</mn><msqrt><mn>3</mn></msqrt><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">m</mi><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> . At time t = 0 s, an observer in A finds B at a distance of 500 m. This observer sees B moving with a constant velocity perpendicular to the line of motion of A. If at <math><mi mathvariant=\"normal\">t</mi><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">t</mi></mrow><mrow><mn>0</mn></mrow></msub></math> , A just escapes being hit by B, t<sub>0</sub> in seconds is<br ><br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/image6-dc127c2a-6640-4c23-87dd-c44982ab9035.png\"/></p>", "image": null}, "options": [], "correctValue": "5", "solution": {"text": "<p>The relative velocity of B with respect to A is perpendicular to line of motion of A. <br > <br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/image7-67b00af2-b92e-467c-af14-1508576a39fc.png\"/> <br > <math><mo>∴</mo><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mi mathvariant=\"normal\">B</mi></mrow></msub><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><msup><mrow><mn>30</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></mrow></mrow><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow></msub></math> <br > <math><mo>⇒</mo><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mi mathvariant=\"normal\">B</mi></mrow></msub><mo>=</mo><mn>200</mn></math>  m/s<br >And time  <math><msub><mrow><mi mathvariant=\"normal\">t</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mfrac><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">e</mi></mrow></mfenced></mrow><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">y</mi></mrow></mfenced></mrow></mfrac></math> <br > <math><mo>=</mo><mfrac><mrow><mn>500</mn></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mi mathvariant=\"normal\">B</mi></mrow></msub><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><msup><mrow><mn>30</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></mrow></mrow></mrow></mfrac><mo>=</mo><mn>5</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">c</mi></math></p>", "image": null}, "videoSolution": {"videoId": "b633fa25741a472999a4b6af32c735b7", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/W3MYh4qgj4iMg.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/W3MYh4qgj4iMg.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf824", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014 (Paper 1)", "title": "JEE Advanced 2014 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169e7f23ac7d519f9af8b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c43", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 2)", "title": "JEE Advanced 2008 (Paper 2)"}], "question": {"text": "Statement 1 For an observer looking out through the window of a fast moving train, the nearby objects appear to move in the opposite direction to the train, while the distant objects appear to be stationary.\nand Statement 2 If the observer and the object are moving at velocities $\\overrightarrow{\\mathbf{v}}_{\\mathbf{1}}$ and $\\overrightarrow{\\mathbf{v}_2}$ respectively with reference to a laboratory frame, the velocity of the object with respect to the observer is $\\overrightarrow{\\mathbf{v}_2}-\\overrightarrow{\\mathbf{v}_1}$.", "image": null}, "options": [{"id": "WFWky", "text": "\nStatement 1 is true, Statement 2 is true, Statement 2 is a correct explanation for Statement 1.\n", "image": null, "isCorrect": false}, {"id": "k7OQL", "text": "\nStatement 1 is true, Statement 2 is true, Statement 2 is not a correct explanation for Statement 1.\n", "image": null, "isCorrect": true}, {"id": "JmoMx", "text": "\nStatement 1 is true, Statement 2 is false.\n", "image": null, "isCorrect": false}, {"id": "rmOLp", "text": "\nStatement 1 is false, Statement 2 is true", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/KuQNeOX_19L4lWh8bt_HqtuWD8dcyrw23wpZ4PAV4lA.original.fullsize.png\"><br>\nStatement-2, is formula of relative velocity. But it does not explain statement-1 correctly. The correct explanation of statement-1 is due to visual perception of motion. The object appears to be moving faster, when its angular velocity is greater w.r.t observer.\n$\\therefore$ correct answer is (b).", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c43", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 2)", "title": "JEE Advanced 2008 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64b16aedf23ac7d519f9b9a2", "title": "Projectile motion", "totalQuestions": 12, "questions": [{"_id": "6a0be50e44d287c9361e5c8d", "type": "multipleCorrect", "question": {"text": "A particle is thrown with a speed $v$ from a point $O$ at an angle $\\theta$ with the horizontal plane such that it passes through the point $P$ at a height of $1$ m and horizontal distance of $5$ m from $O$, as shown in the figure. If acceleration due to gravity is $g$ ms$^{-2}$, then the correct statement(s) is/are:<br><img style=\"width: 550px\" src=\"https://cdn.quizrr.in/question-assets/jee_adv/2026/watermarked_images/p1_english__q22_d1.png\" />", "image": null}, "options": [{"id": "ujcuq", "text": "If $\\theta = 45^\\circ$, then $v = \\dfrac{5\\sqrt{g}}{2}$ ms$^{-1}$.", "isCorrect": true, "image": null}, {"id": "OM1n5", "text": "If $\\theta = 45^\\circ$, the particle reaches its maximum height before it reaches $P$.", "isCorrect": true, "image": null}, {"id": "mG34K", "text": "If $\\theta = 30^\\circ$, the particle reaches its maximum height after reaching $P$.", "isCorrect": false, "image": null}, {"id": "YbH1r", "text": "If $\\theta = \\tan^{-1}\\left(\\dfrac{1}{5}\\right)$, then $v = 125\\sqrt{g}$ ms$^{-1}$.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The equation of trajectory of a projectile is given by:<br><br>$y = x \\tan \\theta - \\dfrac{g x^2}{2 v^2 \\cos^2 \\theta}$<br><br>The particle passes through point $P(5, 1)$. Substituting $x = 5$ and $y = 1$:<br><br>$1 = 5 \\tan \\theta - \\dfrac{25 g}{2 v^2 \\cos^2 \\theta}$<br><br>For option (A), substituting $\\theta = 45^\\circ$:<br><br>$1 = 5 \\tan 45^\\circ - \\dfrac{25 g}{2 v^2 \\cos^2 45^\\circ}$<br><br>$1 = 5(1) - \\dfrac{25 g}{2 v^2 (1/2)}$<br><br>$1 = 5 - \\dfrac{25 g}{v^2}$<br><br>$\\dfrac{25 g}{v^2} = 4 \\Rightarrow v^2 = \\dfrac{25 g}{4} \\Rightarrow v = \\dfrac{5\\sqrt{g}}{2}$ ms$^{-1}$<br><br>Thus, option (A) is correct.<br><br>For option (B), the horizontal distance to the maximum height is $x_m = \\dfrac{R}{2} = \\dfrac{v^2 \\sin(2\\theta)}{2g}$.<br><br>For $\\theta = 45^\\circ$ and $v^2 = \\dfrac{25g}{4}$:<br><br>$x_m = \\dfrac{\\left(\\dfrac{25g}{4}\\right) \\sin 90^\\circ}{2g} = \\dfrac{25}{8} = 3.125$ m<br><br>Since $x_m = 3.125$ m $< 5$ m, the particle reaches its maximum height before it reaches $P$. Thus, option (B) is correct.<br><br>For option (C), substituting $\\theta = 30^\\circ$ into the trajectory equation:<br><br>$1 = 5 \\tan 30^\\circ - \\dfrac{25 g}{2 v^2 \\cos^2 30^\\circ}$<br><br>$1 = \\dfrac{5}{\\sqrt{3}} - \\dfrac{25 g}{2 v^2 (3/4)} \\Rightarrow \\dfrac{50 g}{3 v^2} = \\dfrac{5}{\\sqrt{3}} - 1$<br><br>$v^2 = \\dfrac{50\\sqrt{3}g}{3(5 - \\sqrt{3})}$<br><br>The horizontal distance to the maximum height is:<br><br>$x_m = \\dfrac{v^2 \\sin 60^\\circ}{2g} = \\dfrac{v^2 \\sqrt{3}}{4g} = \\dfrac{50\\sqrt{3}g}{3(5 - \\sqrt{3})} \\times \\dfrac{\\sqrt{3}}{4g} = \\dfrac{25}{2(5 - \\sqrt{3})} \\approx 3.82$ m<br><br>Since $x_m < 5$ m, the particle reaches its maximum height before reaching $P$. Thus, option (C) is incorrect.<br><br>For option (D), substituting $\\theta = \\tan^{-1}\\left(\\dfrac{1}{5}\\right)$, so $\\tan \\theta = \\dfrac{1}{5}$:<br><br>$1 = 5\\left(\\dfrac{1}{5}\\right) - \\dfrac{25 g}{2 v^2 \\cos^2 \\theta} \\Rightarrow 1 = 1 - \\dfrac{25 g}{2 v^2 \\cos^2 \\theta}$<br><br>$\\dfrac{25 g}{2 v^2 \\cos^2 \\theta} = 0$<br><br>This is only possible if $v \\to \\infty$. Thus, option (D) is incorrect.<br><br>Answer: If $\\theta = 45^\\circ$, then $v = \\dfrac{5\\sqrt{g}}{2}$ ms$^{-1}$.; If $\\theta = 45^\\circ$, the particle reaches its maximum height before it reaches $P$.", "image": null}, "level": 2, "videoSolution": {"videoId": "ae4f08d194664925b9d5d022728f9a3f", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/KpBvQPaiKRLAs.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/KpBvQPaiKRLAs.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "previousYearPapers": [{"_id": "6a0be4ef402904185b819b42", "title": "JEE Advanced 2026 (Paper 1)", "shortName": "2026 (Paper 1)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a0be4ef402904185b819b42", "title": "JEE Advanced 2026 (Paper 1)", "shortName": "2026 (Paper 1)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "685102c46bba689a3eb09cbd", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "684c67d769037fad219cb0c2", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2025-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2025 (Paper 2)", "title": "JEE Advanced 2025 (Paper 2)"}], "question": {"text": "A projectile of mass 200 g is launched in a viscous medium at an angle $60^{\\circ}$ with the horizontal, with an initial velocity of $270 \\mathrm{~m} / \\mathrm{s}$. It experiences a viscous drag force $\\vec{F}=-c \\vec{v}$ where the drag coefficient $c=0.1 \\mathrm{~kg} / \\mathrm{s}$ and $\\vec{v}$ is the instantaneous velocity of the projectile. The projectile hits a vertical wall after 2 s . Taking $e=2.7$, the horizontal distance of the wall from the point of projection (in m ) is", "image": null}, "options": [], "correctValue": "170", "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/mT-03WjplujBtna1y1Inz8Vxz_uLYLRMxIFjEMUE278.original.fullsize.png\"><br>$\\overrightarrow{\\mathrm{F}}_{\\mathrm{net}}=\\mathrm{m} \\frac{\\mathrm{~d} \\overrightarrow{\\mathrm{v}}}{\\mathrm{dt}}$\n$\\mathrm{mg}+\\overrightarrow{\\mathrm{F}}=\\frac{\\mathrm{md} \\overrightarrow{\\mathrm{v}}}{\\mathrm{dt}}$\n$\\mathrm{mg}-\\mathrm{C} \\overrightarrow{\\mathrm{v}}=\\frac{\\mathrm{md} \\overrightarrow{\\mathrm{v}}}{\\mathrm{dt}}$\nHorizontal direction\n$-\\mathrm{Cv}_{\\mathrm{x}}=\\frac{\\mathrm{mdv}_{\\mathrm{x}}}{\\mathrm{dt}}$\n$\\begin{aligned} & -\\frac{C}{m} \\int_0^t d t=\\int_{v_{0 x}}^{v_x} \\frac{d v_x}{v_x} \\\\ & -\\frac{t}{2}=\\ell n \\frac{v_x}{v_{0 x}} \\\\ & \\frac{d x}{d t}=v_x=v_{0 x} e^{-t / 2} \\\\ & \\int_0^{S_x} d x=v_{0 x} \\int_0^t e^{-t / 2} d t \\\\ & S_x=2 v_{0 x}\\left(1-e^{-t / 2}\\right) \\\\ & \\text { at } t=2 \\sec \\end{aligned}$\n$\\begin{aligned} & \\mathrm{S}_{\\mathrm{x}}=2 \\times 270 \\times \\cos 60^{\\circ}\\left[1-\\frac{1}{\\mathrm{e}}\\right] \\\\ & \\mathrm{S}_{\\mathrm{x}}=270\\left(1-\\frac{1}{2.7}\\right) \\\\ & =\\frac{270}{2.7} \\times(1.7) \\\\ & =170 \\mathrm{~m} \\\\ & \\mathrm{~S}_{\\mathrm{x}}=170 \\mathrm{~m}\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "a3bc5034f26242e68a1a7346005e5b2c", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/1lDzFKs0Ia50i.240.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/1lDzFKs0Ia50i.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "684c67d769037fad219cb0c2", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2025-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2025 (Paper 2)", "title": "JEE Advanced 2025 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16aa0f23ac7d519f9b620", "type": "multipleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "64b1672d25f94b8a85b91cd9", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 1)", "title": "JEE Advanced 2023 (Paper 1)"}], "question": {"text": "<p>A slide with a frictionless curved surface, which becomes horizontal at its lower end, is fixed on the terrace of a building of height <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>h</mi></math> from the ground, as shown in the figure. A spherical ball of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>&nbsp;is released on the slide from rest at a height <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math>&nbsp;from the top of the terrace. The ball leaves the slide with a velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mover><mi>u</mi><mo>&#8594;</mo></mover><mn>0</mn></msub><mo>=</mo><msub><mi>u</mi><mn>0</mn></msub><mover><mi>x</mi><mo>&#8743;</mo></mover></math>&nbsp;and falls on the ground at a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi></math>&nbsp;from the building making an angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi></math>&nbsp;with the horizontal. It bounces off with a velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>v</mi><mo>&#8594;</mo></mover></math>&nbsp;and reaches a maximum height <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>h</mi><mn>1</mn></msub></math>. The acceleration due to gravity is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi></math>&nbsp;and the coefficient of restitution of the ground is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msqrt><mn>3</mn></msqrt></mfrac></math>. Which of the following statement(s) is(are) correct?</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/f7208a69-a5ba-4db4-a179-b415761f2923.png\" style=\"width: 500px; height: 282px;\" /></p>", "image": null}, "options": [{"id": "wlPnO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mover><mi>u</mi><mo>&#8594;</mo></mover><mn>0</mn></msub><mo>=</mo><msqrt><mn>2</mn><mi>g</mi><mi>h</mi></msqrt><mover><mi>x</mi><mo>&#8743;</mo></mover></math>", "image": null, "isCorrect": true}, {"id": "tWI3C", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>v</mi><mo>&#8594;</mo></mover><mo>=</mo><msqrt><mn>2</mn><mi>g</mi><mi>h</mi></msqrt><mfenced><mrow><mover><mi>x</mi><mo>&#8743;</mo></mover><mo>-</mo><mover><mi>z</mi><mo>&#8743;</mo></mover></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "hLquQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi><mo>=</mo><msup><mn>60</mn><mi mathvariant=\"normal\">o</mi></msup></math>", "image": null, "isCorrect": true}, {"id": "YmEAa", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>d</mi><msub><mi>h</mi><mn>1</mn></msub></mfrac><mo>=</mo><mn>2</mn><msqrt><mn>3</mn></msqrt></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/8121f631-c7a5-4bbd-a9c5-602950b55627.png\" style=\"width: 500px; height: 312px;\" /></p><p>Using energy conservation,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mi>g</mi><mi>h</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><msup><mfenced><msub><mi>u</mi><mn>0</mn></msub></mfenced><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>u</mi><mn>0</mn></msub><mo>=</mo><msqrt><mn>2</mn><mi>g</mi><mi>h</mi></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>u</mi><mn>0</mn></msub></math>&nbsp;is the horizontal component of the velocity throughout the flight. For vertical component of the velocity(just before collision with the ground), we can use equation of motion</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><msub><mi>v</mi><mi>z</mi></msub></mfenced><mn>2</mn></msup><mo>=</mo><msup><mn>0</mn><mn>2</mn></msup><mo>+</mo><mn>2</mn><mfenced><mrow><mo>-</mo><mi>g</mi></mrow></mfenced><mfenced><mrow><mo>-</mo><mn>3</mn><mi>h</mi></mrow></mfenced><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><msub><mi>v</mi><mi>z</mi></msub><mo>=</mo><msqrt><mn>6</mn><mi>g</mi><mi>h</mi></msqrt></math></p><p>Angle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi></math>&nbsp;can be written as,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>tan</mi><mi>&#952;</mi><mo>=</mo><mfrac><msub><mi>v</mi><mi>z</mi></msub><mi>u</mi></mfrac><mo>=</mo><msqrt><mn>3</mn></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#952;</mi><mo>=</mo><msup><mn>60</mn><mi mathvariant=\"normal\">o</mi></msup></math></p><p>Horizontal distance covered just before the collision will be,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi><mo>=</mo><msub><mi>u</mi><mn>0</mn></msub><mi>T</mi><mspace linebreak=\"newline\"></mspace><mo>=</mo><msub><mi>u</mi><mn>0</mn></msub><msqrt><mn>2</mn><mfenced><mfrac><mrow><mn>3</mn><mi>h</mi></mrow><mi>g</mi></mfrac></mfenced></msqrt><mspace linebreak=\"newline\"></mspace><mo>=</mo><msqrt><mn>2</mn><mi>g</mi><mi>h</mi></msqrt><msqrt><mfenced><mn>2</mn></mfenced><mfenced><mfrac><mrow><mn>3</mn><mi>h</mi></mrow><mi>g</mi></mfrac></mfenced></msqrt><mspace linebreak=\"newline\"></mspace><mo>=</mo><mn>2</mn><msqrt><mn>3</mn></msqrt><mi>h</mi></math></p><p>After collision, only velocity along <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>z</mi></math>-direction changes. Therefore,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>1</mn></msub><mo>=</mo><mi>e</mi><msub><mi>v</mi><mi>z</mi></msub><mo>=</mo><msqrt><mn>2</mn><mi>g</mi><mi>h</mi></msqrt></math>&nbsp;and hence</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>v</mi><mo>&#8594;</mo></mover><mo>=</mo><msub><mi>u</mi><mn>0</mn></msub><mover><mi>i</mi><mo>&#8743;</mo></mover><mo>+</mo><msub><mi>v</mi><mn>1</mn></msub><mover><mi>k</mi><mo>&#8743;</mo></mover></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msqrt><mn>2</mn><mi>g</mi><mi>h</mi></msqrt><mfenced close=\"]\" open=\"[\"><mrow><mover><mi>i</mi><mo>&#8743;</mo></mover><mo>+</mo><mover><mi>k</mi><mo>&#8743;</mo></mover></mrow></mfenced><mspace linebreak=\"newline\"></mspace><mo>=</mo><msqrt><mn>2</mn><mi>g</mi><mi>h</mi></msqrt><mfenced close=\"]\" open=\"[\"><mrow><mover><mi>x</mi><mo>&#8743;</mo></mover><mo>+</mo><mover><mi>z</mi><mo>&#8743;</mo></mover></mrow></mfenced></math></p><p>Now, maximum height achieved after collision will be,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>h</mi><mn>1</mn></msub><mo>=</mo><mfrac><msup><msub><mi>v</mi><mn>1</mn></msub><mn>2</mn></msup><mrow><mn>2</mn><mi>g</mi></mrow></mfrac><mo>=</mo><mi>h</mi></math>.</p><p>Finally,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>u</mi><mn>0</mn></msub><mo>=</mo><msqrt><mn>2</mn><mi>g</mi><mi>h</mi></msqrt><mo>,</mo><mo>&#160;</mo><mi>&#952;</mi><mo>=</mo><msup><mn>60</mn><mi mathvariant=\"normal\">o</mi></msup><mo>,</mo><mo>&#160;</mo><mfrac><mi>d</mi><msub><mi>h</mi><mn>1</mn></msub></mfrac><mo>=</mo><mn>2</mn><msqrt><mn>3</mn></msqrt></math>.</p>", "image": null}, "videoSolution": {"videoId": "8cb37b6b5cdb475fbdd23d35d74df9de", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/lB6lzqYGr9X15.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/lB6lzqYGr9X15.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64b1672d25f94b8a85b91cd9", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 1)", "title": "JEE Advanced 2023 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a95f23ac7d519f9b5bb", "previousYearPapers": [{"_id": "632c83573e3fd59bda92e46c", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022 (Paper 1)", "title": "JEE Advanced 2022 (Paper 1)"}], "type": "numerical", "level": 1, "question": {"text": "A projectile is fired from horizontal ground with speed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math>&nbsp;and projection angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi></math>. When the acceleration due to gravity is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi></math>, the range of the projectile is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi></math>. If at the highest point in its trajectory, the projectile enters a different region where the effective acceleration due to gravity is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>g</mi><mo>'</mo></msup><mo>=</mo><mfrac><mi>g</mi><mrow><mn>0</mn><mo>.</mo><mn>81</mn></mrow></mfrac></math>, then the new range is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>d</mi><mo>'</mo></msup><mo>=</mo><mi>n</mi><mi>d</mi><mo>.</mo></math> The value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>&nbsp;is", "image": null}, "options": [], "correctValue": "0.95", "solution": {"text": "<blockquote><p>Horizontal range of the projectile is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi><mo>=</mo><mfrac><mrow><msup><mi>v</mi><mn>2</mn></msup><mi>sin</mi><mn>2</mn><mi>&#952;</mi></mrow><mi>g</mi></mfrac></math></p><p>Maximum height attained by the projectile is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>H</mi><mo>=</mo><mfrac><mrow><msup><mi>v</mi><mn>2</mn></msup><msup><mi>sin</mi><mn>2</mn></msup><mi>&#952;</mi></mrow><mrow><mn>2</mn><mi>g</mi></mrow></mfrac></math></p><p>So, after entering the new region, time taken by projectile to reach ground</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mi>H</mi></mrow><msup><mi>g</mi><mo>&#39;</mo></msup></mfrac></msqrt></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mfenced><mstyle displaystyle=\"true\"><mfrac><mrow><msup><mi>v</mi><mn>2</mn></msup><msup><mi>sin</mi><mn>2</mn></msup><mi>&#952;</mi></mrow><mrow><mn>2</mn><mi>g</mi></mrow></mfrac></mstyle></mfenced></mrow><mstyle displaystyle=\"true\"><mfrac><mi>g</mi><mrow><mn>0</mn><mo>.</mo><mn>81</mn></mrow></mfrac></mstyle></mfrac></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>0</mn><mo>.</mo><mn>94</mn><mi>v</mi><mi>sin</mi><mi>&#952;</mi></mrow><mi>g</mi></mfrac></math></p><p>So, horizontal displacement done by the projectile in new region is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mfrac><mrow><mn>0</mn><mo>.</mo><mn>9</mn><mi>v</mi><mi>sin</mi><mi>&#952;</mi></mrow><mi>g</mi></mfrac><mo>&#215;</mo><mi>v</mi><mi>cos</mi><mi>&#952;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>0</mn><mo>.</mo><mn>9</mn><mfrac><mrow><msup><mi>v</mi><mn>2</mn></msup><mi>sin</mi><mn>2</mn><mi>&#952;</mi></mrow><mrow><mn>2</mn><mi>g</mi></mrow></mfrac></math></p><p>So, new range is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>d</mi><mo>&#39;</mo></msup><mo>=</mo><mfrac><mi>d</mi><mn>2</mn></mfrac><mo>+</mo><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><msup><mi>v</mi><mn>2</mn></msup><mi>sin</mi><mn>2</mn><mi>&#952;</mi></mrow><mrow><mn>2</mn><mi>g</mi></mrow></mfrac><mo>+</mo><mn>0</mn><mo>.</mo><mn>9</mn><mfrac><mrow><msup><mi>v</mi><mn>2</mn></msup><mi>sin</mi><mn>2</mn><mi>&#952;</mi></mrow><mrow><mn>2</mn><mi>g</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>0</mn><mo>.</mo><mn>95</mn><mo>&#160;</mo><mi>d</mi></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>95</mn><mo>&#160;</mo><mi mathvariant=\"normal\">d</mi></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "7a03e8d24e6940ed81b81f5bc19da00e", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/7NNvEEvRx5UXr.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/7NNvEEvRx5UXr.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "632c83573e3fd59bda92e46c", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022 (Paper 1)", "title": "JEE Advanced 2022 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a88f23ac7d519f9b547", "previousYearPapers": [{"_id": "619f94337e944e1fdc2859b4", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021 (Paper 1)", "title": "JEE Advanced 2021 (Paper 1)"}], "type": "numerical", "level": 1, "question": {"text": "A projectile is thrown from a point $\\mathrm{O}$ on the ground at an angle $45^{\\circ}$ from the vertical and with a speed $5 \\sqrt{2} \\mathrm{~m} / \\mathrm{s}$. The projectile at the highest point of its trajectory splits into two equal parts. One part falls vertically down to the ground, $0.5 \\mathrm{~s}$ after the splitting. The other part, $t$ seconds after the splitting, falls to the ground at a distance $x$ meters from the point O. The acceleration due to gravity $g=10 \\mathrm{~m} / \\mathrm{s}^{2}$.<br>The value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>&nbsp;is ________.", "image": null}, "options": [], "correctValue": "7.5", "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/4731f6d0-00df-4d09-8598-ce80c9599f21-image.png\" style=\"width: 400px; height: 172px;\" /></p><p>So,</p><p>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mfrac><mi>R</mi><mn>2</mn></mfrac><mo>+</mo><mi>r</mi></math>&nbsp;</p><p>Where,<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> is the range of oblique projectile and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>&nbsp;is the range of horizontal projectile.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mfrac><mi>R</mi><mn>2</mn></mfrac><mo>+</mo><mn>10</mn><mo>&#215;</mo><msqrt><mfrac><mrow><mn>2</mn><mi>h</mi></mrow><mi>g</mi></mfrac></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mfrac><mrow><msup><mi>u</mi><mn>2</mn></msup><mi>sin</mi><mn>2</mn><mi>&#952;</mi></mrow><mrow><mi>g</mi><mo>&#215;</mo><mn>2</mn></mrow></mfrac><mo>+</mo><mn>10</mn><mo>&#215;</mo><mn>0.5</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mfrac><mn>50</mn><mn>20</mn></mfrac><mo>+</mo><mn>5</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>2.5</mn><mo>+</mo><mn>5</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>7.5</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math></p>", "image": null}, "videoSolution": {"videoId": "099863bf8b8443a0a62c7458b493077f", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/KPPBfcFT5d7fP.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/KPPBfcFT5d7fP.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "619f94337e944e1fdc2859b4", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021 (Paper 1)", "title": "JEE Advanced 2021 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a88f23ac7d519f9b546", "previousYearPapers": [{"_id": "619f94337e944e1fdc2859b4", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021 (Paper 1)", "title": "JEE Advanced 2021 (Paper 1)"}], "type": "numerical", "level": 1, "question": {"text": "A projectile is thrown from a point $\\mathrm{O}$ on the ground at an angle $45^{\\circ}$ from the vertical and with a speed $5 \\sqrt{2} \\mathrm{~m} / \\mathrm{s}$. The projectile at the highest point of its trajectory splits into two equal parts. One part falls vertically down to the ground, $0.5 \\mathrm{~s}$ after the splitting. The other part, $t$ seconds after the splitting, falls to the ground at a distance $x$ meters from the point O. The acceleration due to gravity $g=10 \\mathrm{~m} / \\mathrm{s}^{2}$.<br>The value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi></math>&nbsp;is _________.", "image": null}, "options": [], "correctValue": "0.5", "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/ec94909c-b9ed-4731-8d59-52f05eecd4e4-image.png\" style=\"width: 500px; height: 145px;\" /></p><p>After splitting of projectile in two equal parts one part falls vertically down to the ground.&nbsp;</p><p>So, velocity of another part will be according to conservation of linear momentum,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>&#215;</mo><mn>5</mn><mo>=</mo><mfrac><mi>m</mi><mn>2</mn></mfrac><mo>&#215;</mo><mn>0</mn><mo>+</mo><mfrac><mi>m</mi><mn>2</mn></mfrac><mo>&#215;</mo><mi>v</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>v</mi><mo>=</mo><mn>10</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>&#8722;</mo><mn>1</mn></mrow></msup></math></p><p>Now time taken by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mn>1</mn></msub></math>,&nbsp;to reach ground,&nbsp;</p><p>since after splitting of projectile&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mn>1</mn></msub></math>&nbsp;will perform horizontal projectile so,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mi>h</mi></mrow><mi>g</mi></mfrac></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>t</mi><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><msup><mi>u</mi><mn>2</mn></msup><msup><mi>sin</mi><mn>2</mn></msup><mi>&#952;</mi></mrow><mrow><mn>2</mn><msup><mi>g</mi><mn>2</mn></msup></mrow></mfrac></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>t</mi><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mo>&#215;</mo><mn>50</mn></mrow><mrow><mn>2</mn><mo>&#215;</mo><mn>10</mn><mo>&#215;</mo><mn>10</mn></mrow></mfrac><mo>&#215;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></msqrt><mo>=</mo><msqrt><mn>0.25</mn></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>t</mi><mo>=</mo><mn>0.5</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>&nbsp;</p>", "image": null}, "videoSolution": {"videoId": "450413cc62354988827c152ab3f27372", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/g2DjHch8tllu0.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/g2DjHch8tllu0.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "619f94337e944e1fdc2859b4", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021 (Paper 1)", "title": "JEE Advanced 2021 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a7df23ac7d519f9b4df", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf830", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020 (Paper 1)", "title": "JEE Advanced 2020 (Paper 1)"}], "type": "multipleCorrect", "level": 1, "question": {"text": "<p>A uniform electric field, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>E</mi><mo>→</mo></mover><mo>=</mo><mo>-</mo><mn>400</mn><msqrt><mn>3</mn></msqrt><mo> </mo><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover><mo> </mo><mi mathvariant=\"normal\">N</mi><mo> </mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> is applied in a region. A charged particle of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> carrying positive charge <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi></math> is projected in this region with an initial speed of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msqrt><mn>10</mn></msqrt><mo>×</mo><msup><mn>10</mn><mn>6</mn></msup><mo> </mo><mi mathvariant=\"normal\">m</mi><mo> </mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. This particle is aimed to hit a target <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math>, which is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo> </mo><mi mathvariant=\"normal\">m</mi></math> away from its entry point into the field as shown schematically in the figure. Take <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>q</mi><mi>m</mi></mfrac><mo>=</mo><msup><mn>10</mn><mn>10</mn></msup><mo> </mo><mi mathvariant=\"normal\">C</mi><mo> </mo><msup><mi>kg</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. Then</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/7a2b89eb-38aa-4693-b2b8-03e4c1edc461-image.png\"/></p>", "image": null}, "options": [{"id": "ZbQHD", "text": "the particle will hit <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi></math> if projected at an angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>45</mn><mo>&#176;</mo></math> from the horizontal", "isCorrect": false, "image": null}, {"id": "2x83Q", "text": "the particle will hit <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi></math> if projected either at an angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&#176;</mo></math>&nbsp;or&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>&#176;</mo></math> from the horizontal", "isCorrect": true, "image": null}, {"id": "F1oP8", "text": "time taken by the particle to hit <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi></math> could be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mn>5</mn><mn>6</mn></mfrac></msqrt><mi>&#956;</mi><mi mathvariant=\"normal\">s</mi></math> as well as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mn>5</mn><mn>2</mn></mfrac></msqrt><mi>&#956;</mi><mi mathvariant=\"normal\">s</mi></math>", "isCorrect": true, "image": null}, {"id": "kbIEK", "text": "time taken by the particle to hit <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mn>5</mn><mn>3</mn></mfrac></msqrt><mi>&#956;</mi><mi>s</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>a</mi><mi>y</mi></msub><mo>=</mo><mfrac><mi>E</mi><mi>M</mi></mfrac><mo>=</mo><mn>4</mn><msqrt><mn>3</mn></msqrt><mo>×</mo><msup><mn>10</mn><mn>12</mn></msup><mo> </mo><mi mathvariant=\"normal\">m</mi><mo> </mo><msup><mi mathvariant=\"normal\">s</mi><mn>2</mn></msup></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/d26e9e69-5cd5-443d-a87f-508327036d0b-image.png\"/></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi><mo>=</mo><mfrac><mrow><msup><mi mathvariant=\"normal\">u</mi><mn>2</mn></msup><mi>sin</mi><mn>2</mn><mi>θ</mi></mrow><msub><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">y</mi></msub></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>sin</mi><mn>2</mn><mi>θ</mi><mo>=</mo><mfrac><mrow><mi>R</mi><msub><mi>a</mi><mi>y</mi></msub></mrow><msup><mi>u</mi><mn>2</mn></msup></mfrac><mo>=</mo><mfrac><msqrt><mn>3</mn></msqrt><mn>2</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>θ</mi><mo>=</mo><mn>30</mn><mo>°</mo></math> or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>°</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>u</mi><mi>sin</mi><mo> </mo><mn>30</mn><mo>°</mo></mrow><msub><mi>a</mi><mi>y</mi></msub></mfrac></math> or  <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mi>u</mi><mi>sin</mi><mo> </mo><mn>60</mn><mo>°</mo></mrow><msub><mi>a</mi><mi>y</mi></msub></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msqrt><mfrac><mn>5</mn><mn>6</mn></mfrac></msqrt><mi>μ</mi><mi mathvariant=\"normal\">s</mi></math> or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mn>5</mn><mn>2</mn></mfrac></msqrt><mi>μ</mi><mi mathvariant=\"normal\">s</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf830", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020 (Paper 1)", "title": "JEE Advanced 2020 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a77f23ac7d519f9b4a9", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf82f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Paper 2)", "title": "JEE Advanced 2019 (Paper 2)"}], "type": "numerical", "level": 1, "question": {"text": "<p>A ball is thrown from ground at an angle <math><mi mathvariant=\"normal\">θ</mi></math> with horizontal and with an initial speed <math><msub><mrow><mi mathvariant=\"normal\">u</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>.</mo></math> For the resulting projectile motion, the magnitude of average velocity of the ball up to the point when it hits the ground for the first time is <math><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>.</mo></math> After hitting the ground, ball rebounds at the same angle <math><mi mathvariant=\"normal\">θ</mi></math> but with a reduced speed of <math><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">u</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mi mathvariant=\"normal\">α</mi></mrow></mfrac><mo>.</mo></math> Its motion continues for a long time as shown in figure. If the magnitude of average velocity of the ball for entire duration of motion is <math><mn>0.8</mn><mtext> </mtext><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>,</mo></math> the value of <math><mi mathvariant=\"normal\">α</mi></math> is______<br ><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/9e4cc92b-70db-4e0f-90dc-127f599005f2-image25.png\"/></p>", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "For first projectile<br />Average velocity, <math><mfenced close=〉 open=〈 separators=|><mrow><mi>V</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mi>R</mi></mrow><mrow><mi>T</mi></mrow></mfrac><mo>=</mo><msub><mrow><mi>U</mi></mrow><mrow><mi>x</mi></mrow></msub><mo>=</mo><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub><mi>&nbsp;</mi><mfenced close=] open=[ separators=|><mrow><mtable><mtr> 945;</mi></math> with the horizontal. At the highest point of its trajectory, it makes a completely inelastic collision with another identical particle, which was thrown vertically upward from the ground with the same initial speed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>u</mi><mo>&#8728;</mo></msub></math>. The angle that the composite system makes with the horizontal immediately after the collision is", "image": null}, "options": [{"id": "94DQY", "text": "<math> <mrow> <mfrac> <mrow> <mi>&pi;</mi> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> </mrow> </math>", "isCorrect": true, "image": null}, {"id": "A5W6K", "text": "<math><mrow>  <mfrac>    <mrow>      <mi>&pi;</mi>    </mrow>    <mrow>      <mn>2</mn>    </mrow>  </mfrac>  <mo>+</mo>  <mi>&alpha;</mi></mrow></math>", "isCorrect": false, "image": null}, {"id": "95XD1", "text": "<math><mrow>  <mfrac>    <mrow>      <mi>&pi;</mi>    </mrow>    <mrow>      <mn>2</mn>    </mrow>  </mfrac>  <mo>-</mo>  <mi>&alpha;</mi></mrow></math>", "isCorrect": false, "image": null}, {"id": "jKZpq", "text": "<math> <mrow> <mfrac> <mrow> <mi>&pi;</mi> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "At the highest point\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/ndehrydyswka.png\">\r\n\r\n\\(v_{1}=\\frac{u_{0} \\cos \\alpha}{2} \\quad\\) (by applying momentum conservation in horizontal direction)\r\n\r\n\\(\\mathrm{v}_{2}=\\frac{\\mathrm{u}_{0} \\cos \\alpha}{2} \\quad\\) (by applying momentum conservation in vertical direction)\r\n\r\n\\(\\theta=45^{\\circ}\\left(\\mathrm{H}=\\frac{\\mathrm{u}_{0}^{2} \\sin ^{2} \\alpha}{2 \\mathrm{~g}}\\right)\\)", "image": null}, "videoSolution": {"videoId": "477e5978da034e37852d97988865c82c", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/lbba5C1oDJLvd.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/lbba5C1oDJLvd.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf822", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013 (Paper 1)", "title": "JEE Advanced 2013 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a18f23ac7d519f9b14d", "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c4a", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 1)", "title": "JEE Advanced 2012 (Paper 1)"}], "type": "singleCorrect", "level": 3, "question": {"text": "A small block is connected to one end of a massless spring of un-stretched length $4.9 \\mathrm{~m}$. The other end of the spring (see the figure) is fixed. The system lies on a horizontal frictionless surface. The block is stretched by $0.2 \\mathrm{~m}$ and released from rest at $t=0$. It then executes simple harmonic motion with angular frequency $\\omega=\\pi / 3 \\mathrm{rad} / \\mathrm{s}$. Simultaneously at $t=0$, a small pebble is projected with speed $v$ form point $P$ at an angle of $45^{\\circ}$ as shown in the figure. Point $P$ is at a horizontal distance of $10 \\mathrm{~m}$ from $O$. If the pebble hits the block at $t=1 \\mathrm{~s}$, the value of $v$ is (take $g$ $=10 \\mathrm{~m} / \\mathrm{s}^{2}$ )\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/8JfHbEDRw9CzUF3KhntqqOIXAPC3H9itqgYrnpnqqJI.original.fullsize.png\">", "image": null}, "options": [{"id": "panRv", "text": "$\\sqrt{50} \\mathrm{~m} / \\mathrm{s}$", "isCorrect": true, "image": null}, {"id": "JMa4o", "text": "$\\sqrt{51} \\mathrm{~m} / \\mathrm{s}$", "isCorrect": false, "image": null}, {"id": "cqwkm", "text": "$\\sqrt{52} \\mathrm{~m} / \\mathrm{s}$", "isCorrect": false, "image": null}, {"id": "FAotT", "text": "$\\sqrt{53} \\mathrm{~m} / \\mathrm{s}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Time of flight of projectile,\r\n\r\n$T=\\frac{2 V \\sin \\theta}{g}$\r\n\r\n$\\therefore \\quad 1=\\frac{2 V \\sin 45^{\\circ}}{g} \\quad \\therefore \\quad V=\\sqrt{50} \\mathrm{~ms}^{-1}$\r\n\r\nHence pebble is projected with a speed $V=\\sqrt{50} \\mathrm{~ms}^{-1}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c4a", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 1)", "title": "JEE Advanced 2012 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a13f23ac7d519f9b118", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c49", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 2)", "title": "JEE Advanced 2011 (Paper 2)"}], "question": {"text": "A train is moving along a straight line with a constant acceleration a. A boy standing in the train throws a ball forward with a speed of $10 \\mathrm{~m} / \\mathrm{s}$, at an angle of $60^{\\circ}$ to the horizontal. The boy has to move forward by $1.15 \\mathrm{~m}$ inside the train to catch the ball back at the initial height. The acceleration of the train in $\\mathrm{m} / \\mathrm{s}^2$, is", "image": null}, "options": [], "correctValue": "5", "solution": {"text": "$\\begin{aligned} t & =T=\\frac{2 u \\sin \\theta}{g} \\\\ & =\\frac{2 \\times 10 \\times \\sin 60^{\\circ}}{10}=\\sqrt{3} \\mathrm{~s}\\end{aligned}$\nDisplacement of train in time $t=\\frac{1}{2} a t^2$\nDisplacement of boy with respect to train\n$$\n=1.15 \\mathrm{~m}\n$$\n$\\therefore$ Displacement of boy with respect to ground $=\\left(1.15+\\frac{1}{2} a t^2\\right)$\nDisplacement of ball with respect to ground $=\\left(u \\cos 60^{\\circ}\\right) t$\nTo catch the ball back at initial height,\n$$\n\\begin{aligned}\n1.15+\\frac{1}{2} a t^2 & =\\left(u \\cos 60^{\\circ}\\right) t \\\\\n\\therefore 1.15+\\frac{1}{2} a(\\sqrt{3})^2 & =10 \\times \\frac{1}{2} \\times \\sqrt{3}\n\\end{aligned}\n$$\nSolving this equation, we get\n$$\na=5 \\mathrm{~ms}^{-2}\n$$\n$\\therefore$ Answer is 5 .\nAnalysis of Question\n(i) Question is moderately tough.\n(ii) Velocity of ball given in the question is with respect to ground.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c49", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 2)", "title": "JEE Advanced 2011 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64b16aedf23ac7d519f9b9a0", "title": "Uniform Circular Motion", "totalQuestions": 4, "questions": [{"_id": "64b16aa6f23ac7d519f9b657", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "64b1672d25f94b8a85b91cda", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 2)", "title": "JEE Advanced 2023 (Paper 2)"}], "question": {"text": "A particle of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>&nbsp;is moving in the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mi>y</mi></math>-plane such that its velocity at a point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>x</mi><mo>,</mo><mo>&#160;</mo><mi>y</mi><mo>)</mo></math> is given as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>v</mi><mo>&#8594;</mo></mover><mo>=</mo><mi>&#945;</mi><mfenced><mrow><mi>y</mi><mover><mi>x</mi><mo>&#8743;</mo></mover><mo>+</mo><mn>2</mn><mi>x</mi><mover><mi>y</mi><mo>&#8743;</mo></mover></mrow></mfenced></math>&nbsp;where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi></math> is a non-zero constant. What is the force&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>F</mi><mo>&#8594;</mo></mover></math>&nbsp;acting on the particle?", "image": null}, "options": [{"id": "UY78V", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>F</mi><mo>&#8594;</mo></mover><mo>=</mo><mn>2</mn><mi>m</mi><msup><mi>&#945;</mi><mn>2</mn></msup><mfenced><mrow><mi>x</mi><mover><mi>x</mi><mo>&#8743;</mo></mover><mo>+</mo><mi>y</mi><mover><mi>y</mi><mo>&#8743;</mo></mover></mrow></mfenced></math>", "image": null, "isCorrect": true}, {"id": "vuVIj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>F</mi><mo>&#8594;</mo></mover><mo>=</mo><mi>m</mi><msup><mi>&#945;</mi><mn>2</mn></msup><mfenced><mrow><mi>y</mi><mover><mi>x</mi><mo>&#8743;</mo></mover><mo>+</mo><mn>2</mn><mi>x</mi><mover><mi>y</mi><mo>&#8743;</mo></mover></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "JVzsA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>F</mi><mo>&#8594;</mo></mover><mo>=</mo><mn>2</mn><mi>m</mi><msup><mi>&#945;</mi><mn>2</mn></msup><mfenced><mrow><mi>y</mi><mover><mi>x</mi><mo>&#8743;</mo></mover><mo>+</mo><mi>x</mi><mover><mi>y</mi><mo>&#8743;</mo></mover></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "z6Ony", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>F</mi><mo>&#8594;</mo></mover><mo>=</mo><mi>m</mi><msup><mi>&#945;</mi><mn>2</mn></msup><mfenced><mrow><mi>x</mi><mover><mi>x</mi><mo>&#8743;</mo></mover><mo>+</mo><mn>2</mn><mi>y</mi><mover><mi>y</mi><mo>&#8743;</mo></mover></mrow></mfenced></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>As force is given by,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>F</mi><mo>&#8594;</mo></mover><mo>=</mo><mi>m</mi><mfrac><mrow><mi>d</mi><mover><mi>v</mi><mo>&#8594;</mo></mover></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math>.</p><p>Given:&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>v</mi><mo>&#8594;</mo></mover><mo>=</mo><mi>&#945;</mi><mfenced><mrow><mi>y</mi><mover><mi>x</mi><mo>&#8743;</mo></mover><mo>+</mo><mn>2</mn><mi>x</mi><mover><mi>y</mi><mo>&#8743;</mo></mover></mrow></mfenced></math>, where velocity along x-axis is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>x</mi></msub><mo>=</mo><mi>&#945;</mi><mi>y</mi></math>&nbsp;and&nbsp;velocity along y-axis is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>y</mi></msub><mo>=</mo><mn>2</mn><mi>x</mi><mi>&#945;</mi></math>.</p><p>Therefore,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mover><mi>v</mi><mo>&#8594;</mo></mover></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mi>&#945;</mi><mfenced><mrow><mfrac><mrow><mi>d</mi><mi>y</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mover><mi>x</mi><mo>&#8743;</mo></mover><mo>+</mo><mn>2</mn><mfrac><mrow><mi>d</mi><mi>x</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mover><mi>y</mi><mo>&#8743;</mo></mover></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>&#945;</mi><mfenced><mrow><msub><mi>v</mi><mi>y</mi></msub><mover><mi>x</mi><mo>&#8743;</mo></mover><mo>+</mo><mn>2</mn><msub><mi>v</mi><mi>x</mi></msub><mover><mi>y</mi><mo>&#8743;</mo></mover></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>&#945;</mi><mfenced close=\"]\" open=\"[\"><mrow><mn>2</mn><mi>x</mi><mi>&#945;</mi><mover><mi>x</mi><mo>&#8743;</mo></mover><mo>+</mo><mn>2</mn><mi>&#945;</mi><mi>y</mi><mover><mi>y</mi><mo>&#8743;</mo></mover></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><msup><mi>&#945;</mi><mn>2</mn></msup><mfenced close=\"]\" open=\"[\"><mrow><mi>x</mi><mover><mi>x</mi><mo>&#8743;</mo></mover><mo>+</mo><mi>y</mi><mover><mi>y</mi><mo>&#8743;</mo></mover></mrow></mfenced></math></p><p>Therefore, required value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>F</mi><mo>&#8594;</mo></mover><mo>=</mo><mn>2</mn><mi>m</mi><msup><mi>&#945;</mi><mn>2</mn></msup><mfenced close=\"]\" open=\"[\"><mrow><mi>x</mi><mover><mi>x</mi><mo>&#8743;</mo></mover><mo>+</mo><mi>y</mi><mover><mi>y</mi><mo>&#8743;</mo></mover></mrow></mfenced></math>.</p></blockquote>", "image": null}, "videoSolution": {"videoId": "ccd16dfafe624e149e96351597cb3762", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/WPpjge3xMyuT7.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/WPpjge3xMyuT7.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64b1672d25f94b8a85b91cda", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 2)", "title": "JEE Advanced 2023 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a5ef23ac7d519f9b3c9", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf82b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2017-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2017 (Paper 2)", "title": "JEE Advanced 2017 (Paper 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Three vectors <math><mover accent=\"true\"><mrow><mi>P</mi></mrow><mo>→</mo></mover><mo>,</mo><mi> </mi><mover accent=\"true\"><mrow><mi>Q</mi></mrow><mo>→</mo></mover></math> and <math><mover accent=\"true\"><mrow><mi>R</mi></mrow><mo>→</mo></mover></math> are shown in the figure. Let, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math> be any point on the vector <math><mover accent=\"true\"><mrow><mi>R</mi></mrow><mo>→</mo></mover></math> . The distance between the points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>b</mi><mfenced close=\"|\" open=\"|\" separators=\"|\"><mover><mi>R</mi><mo>→</mo></mover></mfenced></math>. The general relation among vectors <math><mover accent=\"true\"><mrow><mi>P</mi></mrow><mo>→</mo></mover><mo>,</mo><mi> </mi><mover accent=\"true\"><mrow><mi>Q</mi></mrow><mo>→</mo></mover></math> and <math><mover accent=\"true\"><mrow><mi>S</mi></mrow><mo>→</mo></mover></math> are<br ><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/fxvjotshlvejqksysmtytynwyqgfburynvsnjqnidlmxhiijui.jpeg\"/></p>", "image": null}, "options": [{"id": "BJ2b0", "text": "<math><mover accent=\"true\"><mrow><mi>S</mi></mrow><mo>→</mo></mover><mo>=</mo><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mi>b</mi></mrow></mfenced><mi> </mi><mover accent=\"true\"><mrow><mi>P</mi></mrow><mo>→</mo></mover><mo>+</mo><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mover accent=\"true\"><mrow><mi>Q</mi></mrow><mo>→</mo></mover></math>", "isCorrect": false, "image": null}, {"id": "uOygG", "text": "<math><mover accent=\"true\"><mrow><mi>S</mi></mrow><mo>→</mo></mover><mo>=</mo><mfenced separators=\"|\"><mrow><mi>B</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mover accent=\"true\"><mrow><mi>P</mi></mrow><mo>→</mo></mover><mo>+</mo><mi>b</mi><mover accent=\"true\"><mrow><mi>Q</mi></mrow><mo>→</mo></mover></math>", "isCorrect": false, "image": null}, {"id": "ISOnO", "text": "<math><mover accent=\"true\"><mrow><mi>S</mi></mrow><mo>&rarr;</mo></mover><mo>=</mo><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mi>b</mi></mrow></mfenced><mover accent=\"true\"><mrow><mi>P</mi></mrow><mo>&rarr;</mo></mover><mo>+</mo><mi>b</mi><mover accent=\"true\"><mrow><mi>Q</mi></mrow><mo>&rarr;</mo></mover></math>", "isCorrect": true, "image": null}, {"id": "raWwi", "text": "<math><mover accent=\"true\"><mrow><mi>S</mi></mrow><mo>→</mo></mover><mo>=</mo><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced><mover accent=\"true\"><mrow><mi>P</mi></mrow><mo>→</mo></mover><mo>+</mo><mi>b</mi><mover accent=\"true\"><mrow><mi>Q</mi></mrow><mo>→</mo></mover></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/fxvjotshlvejqksysmtytynwyqgfburynvsnjqnidlmxhiijui.jpeg\"/><p>Let, vector from point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> to point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math> be <math><mover accent=\"true\"><mrow><mi>C</mi></mrow><mo>→</mo></mover></math>, </p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi> </mi><mover><mi>C</mi><mo>→</mo></mover><mo>=</mo><mi>b</mi><mfenced close=\"|\" open=\"|\" separators=\"|\"><mover><mi>R</mi><mo>→</mo></mover></mfenced><mi> </mi><mover><mi>R</mi><mo>^</mo></mover><mo>=</mo><mi>b</mi><mfenced close=\"|\" open=\"|\" separators=\"|\"><mover><mi>R</mi><mo>→</mo></mover></mfenced><mi> </mi><mfenced separators=\"|\"><mfrac><mover><mi>R</mi><mo>→</mo></mover><mfenced close=\"|\" open=\"|\" separators=\"|\"><mover><mi>R</mi><mo>→</mo></mover></mfenced></mfrac></mfenced><mo>=</mo><mi>b</mi><mover><mi>R</mi><mo>→</mo></mover><mo>=</mo><mi>b</mi><mfenced separators=\"|\"><mrow><mover><mi>Q</mi><mo>→</mo></mover><mo>-</mo><mi> </mi><mover><mi>P</mi><mo>→</mo></mover></mrow></mfenced></math></p><p>From triangle rule of vector addition, </p><p><math><mover accent=\"true\"><mrow><mi>P</mi></mrow><mo>→</mo></mover><mo>+</mo><mi> </mi><mover accent=\"true\"><mrow><mi>C</mi></mrow><mo>→</mo></mover><mo>=</mo><mi> </mi><mover accent=\"true\"><mrow><mi>S</mi></mrow><mo>→</mo></mover></math></p><p><math><mover accent=\"true\"><mrow><mi>P</mi></mrow><mo>→</mo></mover><mo>+</mo><mi>b</mi><mfenced separators=\"|\"><mrow><mover accent=\"true\"><mrow><mi>Q</mi></mrow><mo>→</mo></mover><mo>-</mo><mi> </mi><mover accent=\"true\"><mrow><mi>P</mi></mrow><mo>→</mo></mover></mrow></mfenced><mo>=</mo><mi> </mi><mover accent=\"true\"><mrow><mi>S</mi></mrow><mo>→</mo></mover></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi> </mi><mover><mi>S</mi><mo>→</mo></mover><mo>=</mo><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mi>b</mi></mrow></mfenced><mover><mi>P</mi><mo>→</mo></mover><mo>+</mo><mi>b</mi><mover><mi>Q</mi><mo>→</mo></mover></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf82b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2017-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2017 (Paper 2)", "title": "JEE Advanced 2017 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a0af23ac7d519f9b0c6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c48", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 1)", "title": "JEE Advanced 2011 (Paper 1)"}], "question": {"text": "A ball of mass $(m) 0.5 \\mathrm{~kg}$ is attached to the end of a string having length $(L) 0.5 \\mathrm{~m}$. The ball is rotated on a horizontal circular path about vertical axis. The maximum tension that the string can bear is $324 \\mathrm{~N}$. The maximum possible value of angular velocity of ball (in rad/s) is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/0TyV2n8gTki5yMAZr7KgdSjyaPFeAUXVThk_t2iUdQ8.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "jcqcG", "text": "\n9\n", "image": null, "isCorrect": false}, {"id": "8yd6Q", "text": "\n18\n", "image": null, "isCorrect": false}, {"id": "2YUV4", "text": "\n27\n", "image": null, "isCorrect": false}, {"id": "uE0M1", "text": "\n36", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/hQ-PiqB_orrFBgFTj13vssd112-QatgeCTIXhpgU2G8.original.fullsize.png\"><br>\n\n$T \\cos \\theta$ component will cancel $\\mathrm{mg}$.\n$T \\sin \\theta$ component will provide necessary centripetal force to the ball towards centre $C$.\n$$\n\\begin{array}{rlrl} \n& \\therefore & T \\sin \\theta & =m r \\omega^2=m(l \\sin \\theta) \\omega^2 \\\\\n& \\text { or } & T & =m l \\omega^2 \\\\\n& \\therefore & \\omega & =\\sqrt{\\frac{T}{m l}} \\\\\n& \\text { or } & \\omega_{\\max } & =\\sqrt{\\frac{T_{\\max }}{m l}}=\\sqrt{\\frac{324}{0.5 \\times 0.5}} \\\\\n& = & 36 \\mathrm{rad} / \\mathrm{s}\n\\end{array}\n$$\n$\\therefore$ Correct option is (d).\nAnalysis of Question\n(i) Question is simple.\n(ii) This is called the conical pendulum.\n(iii) The interesting fact in this problem is that $\\omega$ or $T$ is independent of $\\theta$.\n$\\omega \\propto \\sqrt{T}$\nIf $\\omega$ is increased, $T$ will also increase.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c48", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 1)", "title": "JEE Advanced 2011 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169e6f23ac7d519f9af81", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c43", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 2)", "title": "JEE Advanced 2008 (Paper 2)"}], "question": {"text": "A bob of mass $M$ is suspended by a massless string of length $L$. The horizontal velocity $v$ at position $A$ is just sufficient to make it reach the point $B$. The angle $\\theta$ at which the speed of the bob is half of that at $A$, satisfies\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/yB_mlfJxewK2ISXeI6nPyfMNBOljptoFdvbYpqzvEPk.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "q6Eim", "text": "\n$\\theta=\\frac{\\pi}{4}$\n", "image": null, "isCorrect": false}, {"id": "2kEVM", "text": "\n$\\frac{\\pi}{4} < \\theta < \\frac{\\pi}{2}$", "image": null, "isCorrect": false}, {"id": "mZQCP", "text": "\n$\\frac{\\pi}{2} < \\theta < \\frac{3 \\pi}{4}$", "image": null, "isCorrect": false}, {"id": "CgjOE", "text": "\n$\\frac{3 \\pi}{4} < \\theta < \\pi$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$v=\\sqrt{5 g L}$\nSolving Eqs. (i), (ii) and (iii) we get,\n$$\n\\cos \\theta=-\\frac{7}{8} \\quad \\text { or } \\theta=\\cos ^{-1}\\left(-\\frac{7}{8}\\right)=151^{\\circ}\n$$\n$\\therefore$ correct option is (d).", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c43", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 2)", "title": "JEE Advanced 2008 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Advanced';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
