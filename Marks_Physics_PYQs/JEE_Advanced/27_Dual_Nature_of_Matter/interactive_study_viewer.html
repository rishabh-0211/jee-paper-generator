rac></math> <br >Now, radius of  <math><msup><mrow><mi mathvariant=\"normal\">n</mi></mrow><mrow><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">h</mi></mrow></msup></math>  shell,  <math><mi mathvariant=\"normal\">r</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">n</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi mathvariant=\"normal\">z</mi></mrow></mfrac></mrow></mfenced><msub><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>0</mn></mrow></msub></math> <br > <math><mo>⇒</mo><mi mathvariant=\"normal\">r</mi><mo>=</mo><mfrac><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mn>3</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>3</mn></mrow></mfrac><mo>.</mo><msub><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>0</mn></mrow></msub></math>     <math><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mo>∵</mo><msub><mrow><mi mathvariant=\"normal\">Z</mi></mrow><mrow><mi mathvariant=\"normal\">L</mi><mi mathvariant=\"normal\">i</mi></mrow></msub><mo>=</mo><mn>3</mn></mrow></mfenced></math> <br > <math><mo>⇒</mo><mi mathvariant=\"normal\">r</mi><mo>=</mo><mn>3</mn><msub><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>0</mn></mrow></msub></math> <br >From De Broglie law<br > <math><mi mathvariant=\"normal\">w</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">h</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">h</mi></mrow><mrow><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">m</mi></mrow></mfrac></math> <br > <math><mo>⇒</mo><mi mathvariant=\"normal\">λ</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">h</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">v</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">h</mi></mrow><mrow><mfrac><mrow><mn>3</mn><mi mathvariant=\"normal\">h</mi></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">π</mi></mrow></mfrac><mi mathvariant=\"normal\">r</mi></mrow></mfrac></math> <br > <math><mo>⇒</mo><mi mathvariant=\"normal\">λ</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">π</mi><mi mathvariant=\"normal\">r</mi></mrow><mrow><mn>3</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">π</mi></mrow><mrow><mn>3</mn></mrow></mfrac><mo>×</mo><mn>3</mn><msub><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>0</mn></mrow></msub></math> <br > <math><mi mathvariant=\"normal\">λ</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">π</mi><msub><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">π</mi><msub><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>0</mn></mrow></msub></math> <br > <math><mo>⇒</mo><mi mathvariant=\"normal\">P</mi><mo>=</mo><mn>2</mn></math>", "image": null}, "videoSolution": {"videoId": "0512266ae4a4409eafd12a88060b1b37", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/azYcpUFQ9V8lo.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/azYcpUFQ9V8lo.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf827", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2015-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2015 (Paper 2)", "title": "JEE Advanced 2015 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a1af23ac7d519f9b157", "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c4a", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 1)", "title": "JEE Advanced 2012 (Paper 1)"}], "type": "numerical", "level": 2, "question": {"text": "A proton is fired from very far away towards a nucleus with charge $Q=120 e$, where $e$ is the electronic charge. It makes a closest approach of $10 \\mathrm{fm}$ to the nucleus. The de Broglie wavelength (in units of $\\mathrm{fm}$ ) of the proton at its start is: (take the proton mass, $m_{p}=(5 / 3) \\times 10^{-27} \\mathrm{~kg} ; h / e=4.2 \\times$ $10^{-15} \\mathrm{~J} . \\mathrm{S} / \\mathrm{C}$;\r\n\r\n$\\frac{1}{4 \\pi \\varepsilon_{0}}=9 \\times 10^{9} \\mathrm{~m} / \\mathrm{F} ; 1 \\mathrm{fm}=10^{-15} \\mathrm{~m}$", "image": null}, "options": [], "correctValue": "7", "solution": {"text": "From energy conservation Loss in K.E. of proton = gain in potential energy of the proton - nucleus system\r\n\r\n$\\begin{array}{c}\r\n\r\n\\frac{1}{2} m v^{2}=\\frac{1}{4 \\pi \\varepsilon_{0}} \\frac{q_{1} q_{2}}{r} \\quad \\therefore \\frac{p^{2}}{2 m}=\\frac{1}{4 \\pi \\in_{0}} \\frac{q_{1} q_{2}}{r} \\\\\r\n\r\n\\therefore \\frac{1}{2 m}\\left(\\frac{h^{2}}{\\lambda^{2}}\\right)=\\frac{1}{4 \\pi \\in_{0}} \\frac{q_{1} q_{2}}{r} \\quad \\therefore \\lambda=\\sqrt{\\frac{4 \\pi \\epsilon_{0} r \\cdot h^{2}}{q_{1} q_{2}(2 m)}}\r\n\r\n\\end{array}$\r\n\r\nPutting the values of $4 \\pi \\varepsilon_{0}, r, h, q_{1}, q_{2}$ and $m$ we get, deBroglie wavelength of proton, $\\lambda=7 \\mathrm{fm}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c4a", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 1)", "title": "JEE Advanced 2012 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169fcf23ac7d519f9b04c", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c46", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 1)", "title": "JEE Advanced 2010 (Paper 1)"}], "question": {"text": "An $\\alpha$-particle and a proton are accelerated from rest by a potential difference of $100 \\mathrm{~V}$. After this, their de Broglie wavelengths are $\\lambda_\\alpha$ and $\\lambda_p$ respectively. The ratio $\\frac{\\lambda_p}{\\lambda_\\alpha}$, to the nearest integer, is", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "$$\n\\begin{aligned}\n\\lambda & =\\frac{h}{P}=\\frac{h}{\\sqrt{2 q q V m}} \\text { or } \\lambda \\propto \\frac{1}{\\sqrt{q m}} \\\\\n\\frac{\\lambda_p}{\\lambda_\\alpha} & =\\sqrt{\\frac{q_\\alpha}{q_p} \\cdot \\frac{m_{\\propto}}{m_p}}=\\sqrt{\\frac{(2)(4)}{(1)(1)}}=2.828\n\\end{aligned}\n$$\nThe nearest integer is 3 .\n$\\therefore$ answer is 3 .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c46", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 1)", "title": "JEE Advanced 2010 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169d8f23ac7d519f9af01", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c41", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 2)", "title": "JEE Advanced 2007 (Paper 2)"}], "question": {"text": "Electrons with de-Broglie wavelength $\\lambda$ fall on the target in an X-ray tube. The cut-off wavelength of the emitted X-rays is", "image": null}, "options": [{"id": "TMWCf", "text": "\n$\\lambda_0=\\frac{2 m c \\lambda^2}{h}$\n", "image": null, "isCorrect": true}, {"id": "NFxgp", "text": "\n$\\lambda_0=\\frac{2 h}{m c}$\n", "image": null, "isCorrect": false}, {"id": "21MUe", "text": "\n$\\lambda_0=\\frac{2 m^2 c^2 \\lambda^3}{h^2}$\n", "image": null, "isCorrect": false}, {"id": "bbiKS", "text": "\n$\\lambda_0=\\lambda$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Momentum of striking electrons, $p=\\frac{h}{\\lambda}$\n$\\therefore$ Kinetic energy of striking electrons, $K=\\frac{p^2}{2 m}=\\frac{h^2}{2 m \\lambda^2}$\nThis is also, maximum energy of $X$-ray photons.\nTherefore, $\\quad \\frac{h c}{\\lambda_0}=\\frac{h^2}{2 m \\lambda^2}$ or $\\lambda_0=\\frac{2 m \\lambda^2 c}{h}$\n$\\therefore$ Correct option is (a).", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c41", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 2)", "title": "JEE Advanced 2007 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64b16acff23ac7d519f9b844", "title": "Photoelectric Effect", "totalQuestions": 15, "questions": [{"_id": "64b16aa1f23ac7d519f9b627", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "64b1672d25f94b8a85b91cd9", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 1)", "title": "JEE Advanced 2023 (Paper 1)"}], "question": {"text": "<p>A Hydrogen-like atom has atomic number <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Z</mi></math>. Photons emitted in the electronic transitions from level <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>=</mo><mn>4</mn></math> to level <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>=</mo><mn>3</mn></math> in these atoms are used to perform photoelectric effect experiment on a target metal. The maximum kinetic energy of the photoelectrons generated is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>95</mn><mo>&#160;</mo><mi>eV</mi></math>. If the photoelectric threshold wavelength for the target metal is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>310</mn><mo>&#160;</mo><mi>nm</mi></math>, the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Z</mi></math> is _____.</p><p>[Given <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><mi>c</mi><mo>=</mo><mn>1240</mn><mo>&#160;</mo><mi>eV</mi><mo>-</mo><mi>nm</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mi>h</mi><mi>c</mi><mo>=</mo><mn>13</mn><mo>.</mo><mn>6</mn><mo>&#160;</mo><mi>eV</mi></math>, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> is the Rydberg constant, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math> is the Planck&rsquo;s constant and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>c</mi></math>&nbsp;is the speed of light in vacuum]</p>", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "<blockquote><p>From Einstein&#39;s photoelectric effect, we can write</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mo>=</mo><mi>K</mi><msub><mi>E</mi><mrow><mi>m</mi><mi>a</mi><mi>x</mi></mrow></msub><mo>+</mo><mi>&#981;</mi><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><mi>E</mi><mo>=</mo><mi>K</mi><msub><mi>E</mi><mrow><mi>m</mi><mi>a</mi><mi>x</mi></mrow></msub><mo>+</mo><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mi>&#955;</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#8710;</mo><msub><mi>E</mi><mrow><mn>4</mn><mo>&#160;</mo><mi>to</mi><mo>&#160;</mo><mn>3</mn></mrow></msub><mo>=</mo><mn>1</mn><mo>.</mo><mn>95</mn><mo>&#160;</mo><mi>eV</mi><mo>+</mo><mfrac><mn>1240</mn><mn>310</mn></mfrac><mi>eV</mi><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><mo>&#8710;</mo><msub><mi>E</mi><mrow><mn>4</mn><mo>&#160;</mo><mi>to</mi><mo>&#160;</mo><mn>3</mn></mrow></msub><mo>=</mo><mn>5</mn><mo>.</mo><mn>95</mn><mo>&#160;</mo><mi>eV</mi></math></p><p>Now, as we know for Hydrogen like atoms, we can write&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>E</mi><mo>=</mo><mn>13</mn><mo>.</mo><mn>6</mn><mo>&#160;</mo><msup><mi>Z</mi><mn>2</mn></msup><mfenced><mrow><mfrac><mn>1</mn><msup><mfenced><msub><mi>n</mi><mn>1</mn></msub></mfenced><mn>2</mn></msup></mfrac><mo>-</mo><mfrac><mn>1</mn><msup><mfenced><msub><mi>n</mi><mn>2</mn></msub></mfenced><mn>2</mn></msup></mfrac></mrow></mfenced></math></p><p>Therefore,<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>13</mn><mo>.</mo><mn>6</mn><mo>&#160;</mo><msup><mi>Z</mi><mn>2</mn></msup><mfenced><mrow><mfrac><mn>1</mn><msup><mn>3</mn><mn>2</mn></msup></mfrac><mo>-</mo><mfrac><mn>1</mn><msup><mn>4</mn><mn>2</mn></msup></mfrac></mrow></mfenced><mo>=</mo><mn>5</mn><mo>.</mo><mn>95</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>13</mn><mo>.</mo><mn>6</mn><mo>&#160;</mo><msup><mi>Z</mi><mn>2</mn></msup><mfrac><mn>7</mn><mrow><mn>9</mn><mo>&#215;</mo><mn>16</mn></mrow></mfrac><mo>=</mo><mn>5</mn><mo>.</mo><mn>95</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>Z</mi><mn>2</mn></msup><mo>=</mo><mfrac><mrow><mn>5</mn><mo>.</mo><mn>95</mn><mo>&#215;</mo><mn>9</mn><mo>&#215;</mo><mn>16</mn></mrow><mrow><mn>13</mn><mo>.</mo><mn>6</mn><mo>&#215;</mo><mn>7</mn></mrow></mfrac><mo>=</mo><mn>9</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>Z</mi><mo>=</mo><mn>3</mn></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "264884ed198a4ea9a94584cfde0971ed", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/HdYMxBpyD47SH.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/HdYMxBpyD47SH.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64b1672d25f94b8a85b91cd9", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 1)", "title": "JEE Advanced 2023 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a9cf23ac7d519f9b5f9", "previousYearPapers": [{"_id": "632c83583e3fd59bda92e46d", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2022-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2022 (Paper 2)", "title": "JEE Advanced 2022 (Paper 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "When light of a given wavelength is incident on a metallic surface, the minimum potential needed to stop the emitted photoelectrons is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>.</mo><mn>0</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></math>. This potential drops to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>6</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></math>&nbsp;if another source with wavelength four times that of the first one and intensity half of the first one is used. What are the wavelength of the first source and the work function of the metal, respectively? [Take<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mi>e</mi></mfrac><mo>=</mo><mn>1</mn><mo>.</mo><mn>24</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi>mC</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> .]", "image": null}, "options": [{"id": "MjSlL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>72</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>7</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>,</mo><mn>1</mn><mo>.</mo><mn>20</mn><mi>eV</mi></math>", "isCorrect": true, "image": null}, {"id": "2EMgq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>72</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>7</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>,</mo><mn>5</mn><mo>.</mo><mn>60</mn><mi>eV</mi></math>", "isCorrect": false, "image": null}, {"id": "f61Xh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>.</mo><mn>78</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>7</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>,</mo><mn>5</mn><mo>.</mo><mn>60</mn><mi>eV</mi></math>", "isCorrect": false, "image": null}, {"id": "kvolV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>.</mo><mn>78</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>7</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>,</mo><mn>1</mn><mo>.</mo><mn>20</mn><mi>eV</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>According to the Einstein&#39;s equation of photoelectric effect for the first case,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mi>&#955;</mi></mfrac><mo>-</mo><mi>&#981;</mi><mo>=</mo><mn>6</mn><mo>&#160;</mo><mi>eV</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#8943;</mo><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo></math></p><p>And for the second case,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mn>4</mn><mi>&#955;</mi></mrow></mfrac><mo>-</mo><mi>&#981;</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>6</mn><mo>&#160;</mo><mi>eV</mi></math></p><p>Therefore,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><mi>h</mi><mi>c</mi></mrow><mrow><mn>4</mn><mi>&#955;</mi></mrow></mfrac><mo>=</mo><mn>5</mn><mo>.</mo><mn>4</mn><mi>eV</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>&#955;</mi><mo>=</mo><mfrac><mrow><mn>3</mn><mi>h</mi><mi>c</mi></mrow><mrow><mn>4</mn><mo>&#215;</mo><mn>5</mn><mo>.</mo><mn>4</mn><mi>eV</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn><mo>&#215;</mo><mn>1</mn><mo>.</mo><mn>24</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup></mrow><mrow><mn>4</mn><mo>&#215;</mo><mn>5</mn><mo>.</mo><mn>4</mn></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#955;</mi><mo>=</mo><mn>1</mn><mo>.</mo><mn>72</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>7</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo></math>&nbsp;from equation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">i</mi></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mn>1</mn><mo>.</mo><mn>72</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>7</mn></mrow></msup></mrow></mfrac><mo>&#215;</mo><mfrac><mn>1</mn><mrow><mn>1</mn><mo>.</mo><mn>6</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>19</mn></mrow></msup></mrow></mfrac><mo>-</mo><mi>&#981;</mi><mo>=</mo><mn>6</mn><mo>&#160;</mo><mi>eV</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>25</mn></mrow></msup></mrow><mrow><mn>2</mn><mo>.</mo><mn>75</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>26</mn></mrow></msup></mrow></mfrac><mo>-</mo><mi>&#981;</mi><mo>=</mo><mn>6</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#981;</mi><mo>=</mo><mfenced><mrow><mn>7</mn><mo>.</mo><mn>27</mn><mo>-</mo><mn>6</mn></mrow></mfenced><mo>&#8773;</mo><mn>1</mn><mo>.</mo><mn>2</mn><mo>&#160;</mo><mi>eV</mi></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "ac142b71474441678b3548b6155ed152", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/wYCK65bKIwoxl.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/wYCK65bKIwoxl.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "632c83583e3fd59bda92e46d", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2022-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2022 (Paper 2)", "title": "JEE Advanced 2022 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a90f23ac7d519f9b58d", "previousYearPapers": [{"_id": "619f94437e944e1fdc2859b5", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2021-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2021 (Paper 2)", "title": "JEE Advanced 2021 (Paper 2)"}], "type": "numerical", "level": 2, "question": {"text": "In a photoemission experiment, the maximum kinetic energies of photoelectrons from metals&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>,</mo><mi>Q</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mi>P</mi></msub><mo>,</mo><mo>&#160;</mo><msub><mi>E</mi><mi>Q</mi></msub></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mi>R</mi></msub></math>, respectively, and they are related by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mi>P</mi></msub><mo>=</mo><mn>2</mn><msub><mi>E</mi><mi>Q</mi></msub><mo>=</mo><mn>2</mn><msub><mi>E</mi><mi>R</mi></msub></math>. In this experiment, the same source of monochromatic light is used for metals&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math>&nbsp;while a different source of monochromatic light is used for the metal&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>. The work functions for metals&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>,</mo><mi>Q</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>.</mo><mn>0</mn><mo>&#160;</mo><mi>eV</mi><mo>,</mo><mo>&#160;</mo><mn>4</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi>eV</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi>eV</mi></math>, respectively. The energy of the incident photon used for metal&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>, in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>e</mi><mi>V</mi></math>&nbsp;is ___.", "image": null}, "options": [], "correctValue": "6", "solution": {"text": "<p>Let&nbsp;the maximum kinetic energies of photoelectrons&nbsp;be<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mi>P</mi></msub><mo>=</mo><mn>2</mn><msub><mi>E</mi><mi>Q</mi></msub><mo>=</mo><mn>2</mn><msub><mi>E</mi><mi>R</mi></msub><mo>=</mo><mn>2</mn><mi>E</mi></math>.</p><p>The energy of incident photon on metal&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>&#160;</mo><mtext>and</mtext><mo>&#160;</mo><mi>Q</mi></math>&nbsp;be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>U</mi></math>&nbsp;and for&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>U</mi><mo>'</mo></math>.</p><p>Photoelectric equation,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mi>ph</mi></msub><mo>=</mo><mi>&#981;</mi><mo>+</mo><mi>K</mi><msub><mi>E</mi><mi>max</mi></msub></math></p><p>Now, using it for the three cases,&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>U</mi><mo>=</mo><mn>4</mn><mo>+</mo><mn>2</mn><mi>E</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>1</mn></mfenced><mspace linebreak=\"newline\"></mspace><mi>U</mi><mo>=</mo><mn>4</mn><mo>.</mo><mn>5</mn><mo>+</mo><mi>E</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>2</mn></mfenced><mspace linebreak=\"newline\"></mspace><mi>U</mi><mo>&#39;</mo><mo>=</mo><mn>5</mn><mo>.</mo><mn>5</mn><mo>+</mo><mi>E</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>3</mn></mfenced></math></p><p>From&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>1</mn></mfenced><mo>&#160;</mo><mtext>and</mtext><mo>&#160;</mo><mfenced><mn>2</mn></mfenced></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi>eV</mi></math></p><p>From&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>3</mn></mfenced></math>,&nbsp;energy of the incident photon for metal&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>U</mi><mo>&#39;</mo><mo>=</mo><mn>5</mn><mo>.</mo><mn>5</mn><mo>+</mo><mn>0</mn><mo>.</mo><mn>5</mn><mo>=</mo><mn>6</mn><mo>&#160;</mo><mi>eV</mi></math></p>", "image": null}, "videoSolution": {"videoId": "eb8c743d8d2c45ad94e01f94a7ef391a", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/GX751cGP6IpSS.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/GX751cGP6IpSS.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "619f94437e944e1fdc2859b5", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2021-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2021 (Paper 2)", "title": "JEE Advanced 2021 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a77f23ac7d519f9b4a8", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf82f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Paper 2)", "title": "JEE Advanced 2019 (Paper 2)"}], "type": "numerical", "level": 2, "question": {"text": "<p>A perfectly reflecting mirror of mass <math><mi mathvariant=\"normal\">M</mi></math> mounted on a spring constitutes a spring-mass system of angular frequency <math><mi mathvariant=\"normal\">Ω</mi></math> such that <math><mfrac><mrow><mn>4</mn><mi mathvariant=\"normal\">π</mi><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">Ω</mi></mrow><mrow><mi mathvariant=\"normal\">h</mi></mrow></mfrac><mo>=</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>24</mn></mrow></msup><mtext> </mtext><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></math> with <math><mi mathvariant=\"normal\">h</mi></math> as Planck's constant. <math><mi mathvariant=\"normal\">N</mi></math> photons of wavelength <math><mi mathvariant=\"normal\">λ</mi><mo>=</mo><mn>8</mn><mi mathvariant=\"normal\">π</mi><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup><mtext> </mtext><mi mathvariant=\"normal\">m</mi></math> strike the mirror simultaneously at normal incidence such that the mirror gets displaced by <math><mn>1</mn><mtext> </mtext><mi mathvariant=\"normal\">μ</mi><mi mathvariant=\"normal\">m</mi><mo>.</mo></math> If the value of <math><mi mathvariant=\"normal\">N</mi></math> is <math><mi mathvariant=\"normal\">x</mi><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>12</mn></mrow></msup><mo>,</mo></math> then the value of <math><mi mathvariant=\"normal\">x</mi></math> is________.<br/>[Consider the spring as massless]<br ><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/58c9d372-ac90-4d89-93a4-545f76d06fe1-image24.png\"/></p>", "image": null}, "options": [], "correctValue": "1", "solution": {"text": "Total Momentum transferred on mirror <math><mo>=</mo><mfrac><mrow><mn>2</mn><mi>N</mi><mi>h</mi></mrow><mrow><mi>λ</mi></mrow></mfrac></math> (for perfect reflection)<br />In an <math><mi mathvariant=\"\\&quot;normal\\&quot;\">S</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">H</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">M</mi></math><br /><math><msub><mrow><mi>V</mi></mrow><mrow><mi mathvariant=\"\\&quot;normal\\&quot;\">m</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">a</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">x</mi></mrow></msub><mo>=</mo><mi>A</mi><mo>.</mo><mi mathvariant=\"\\&quot;normal\\&quot;\">Ω</mi></math><br />Where <math><mi>A</mi><mo>=</mo></math> amplitude and <math><mi mathvariant=\"\\&quot;normal\\&quot;\">Ω</mi><mo>=</mo></math> angular frequency<br /><math><mo>⇒</mo><mfrac><mrow><mn>2</mn><mi>N</mi><mi>h</mi></mrow><mrow><mi>λ</mi></mrow></mfrac><mo>=</mo><mi>M</mi><msub><mrow><mi>V</mi></mrow><mrow><mfenced separators=\"\\&quot;|\\&quot;\"><mrow><mi mathvariant=\"\\&quot;normal\\&quot;\">m</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">e</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">a</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">n</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">&nbsp;</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">p</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">o</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">s</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">i</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">t</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">i</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">o</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">n</mi></mrow></mfenced></mrow></msub></math><br /><math><mtable><mtr><mtd><msub><mrow><mi>V</mi></mrow><mrow><mfenced separators=\"\\&quot;|\\&quot;\"><mrow><mi mathvariant=\"\\&quot;normal\\&quot;\">m</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">e</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">a</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">n</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">&nbsp;</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">p</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">o</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">s</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">i</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">t</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">i</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">o</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">n</mi></mrow></mfenced></mrow></msub><mo>=</mo><mi mathvariant=\"\\&quot;normal\\&quot;\">Ω</mi><mi>A</mi></mtd><mtd><mfenced separators=\"\\&quot;|\\&quot;\"><mrow><mi mathvariant=\"\\&quot;normal\\&quot;\">w</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">h</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">e</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">r</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">e</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">&nbsp;</mi><mi>A</mi><mo>=</mo><mn>1</mn><mi>&nbsp;</mi><mi>μ</mi><mi>m</mi></mrow></mfenced></mtd></mtr></mtable></math><br /><math><mo>⇒</mo><mtable><mtr><mtd><mfrac><mrow><mn>2</mn><mi>N</mi><mi>h</mi></mrow><mrow><mi>λ</mi></mrow></mfrac><mo>=</mo><mi>M</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">Ω</mi><mi>A</mi></mtd><mtd><mfenced separators=\"\\&quot;|\\&quot;\"><mrow><mi mathvariant=\"\\&quot;normal\\&quot;\">w</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">h</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">e</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">r</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">e</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">&nbsp;</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">λ</mi><mo>=</mo><mn>8</mn><mi mathvariant=\"\\&quot;normal\\&quot;\">π</mi><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup></mrow></mfenced></mtd></mtr></mtable></math><br /><math><mo>∴</mo><mi>N</mi><mo>=</mo><mfrac><mrow><mi>λ</mi><mi>M</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">Ω</mi><mi>A</mi></mrow><mrow><mn>2</mn><mi>h</mi></mrow></mfrac></math><br /><math><mo>⇒</mo><mi>N</mi><mo>=</mo><mfrac><mrow><mi>M</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">Ω</mi><mfenced separators=\"\\&quot;|\\&quot;\"><mrow><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup></mrow></mfenced><mi>λ</mi></mrow><mrow><mn>2</mn><mi>h</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>M</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">Ω</mi><mn>8</mn><mi>π</mi><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup></mrow><mrow><mn>2</mn><mi>h</mi></mrow></mfrac></math><br /><math><mi>N</mi><mo>=</mo><mfrac><mrow><mn>4</mn><mi>π</mi><mi>M</mi><mi mathvariant=\"\\&quot;normal\\&quot;\">Ω</mi></mrow><mrow><mi>h</mi></mrow></mfrac><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>12</mn></mrow></msup></math><br /><math><mo>=</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>24</mn></mrow></msup><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>12</mn></mrow></msup></math><br /><math><mi>N</mi><mo>=</mo><mn>1</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>12</mn></mrow></msup></math><br /><math><mi>x</mi><mo>=</mo><mn>1</mn></math>", "image": null}, "videoSolution": {"videoId": "a7d0536bfb9b4fe0902173b595870be7", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/kr0fDilMbJ81z.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/kr0fDilMbJ81z.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf82f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Paper 2)", "title": "JEE Advanced 2019 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a6bf23ac7d519f9b440", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf82d", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2018-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2018 (Paper 2)", "title": "JEE Advanced 2018 (Paper 2)"}], "type": "numerical", "level": 3, "question": {"text": "In a photoelectric experiment, a parallel beam of monochromatic light with the power of <math> <mrow> <mn>200</mn><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mtext>W</mtext></mrow> </math> is incident on a perfectly absorbing cathode of work function <math><mn>6.25</mn><mi>&#160;</mi><mi>eV</mi></math>. The frequency of light is just above the threshold frequency so that the photoelectrons are emitted with negligible kinetic energy. Assume that the photoelectron emission efficiency is 100%. A potential difference of <math> <mrow> <mn>500</mn><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mtext>V</mtext></mrow> </math> is applied between the cathode and the anode. All the emitted electrons are incident normally on the anode and are absorbed. The anode experiences a force <math><mi>F</mi><mo>=</mo><mi>n</mi><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>4</mn></mrow></msup><mn>&#160;N</mn></math> due to the impact of the electrons. The value of <math> <mi>n</mi> </math> is __________. Mass of the electron <math><msub><mrow><mi>m</mi></mrow><mrow><mi>e</mi></mrow></msub><mo>=</mo><mn>9</mn><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>31</mn></mrow></msup><mi>&#160;kg</mi><mi>&#160;</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">d</mi><mi>&#160;</mi><mn>1.0</mn><mi>&#160;</mi><mi>eV</mi><mo>=</mo><mn>1.6</mn><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>19</mn></mrow></msup><mi>&#160;J</mi></math>.", "image": null}, "options": [], "correctValue": "24", "solution": {"text": "Power <math><mo>=</mo><mi>N</mi><mi>h</mi><mi>ν</mi></math><br /><math><mi>N</mi><mo>=</mo></math> number of photons per second<br />Since <math><mi>K</mi><mi>E</mi><mo>=</mo><mn>0</mn><mo>,</mo><mi>h</mi><mi>ν</mi><mo>=</mo><mi>ϕ</mi></math><br /><math><mn>200</mn><mo>=</mo><mi>N</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mn>6.25</mn><mo>×</mo><mn>1.6</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>19&nbsp;</mn></mrow></msup><mi mathvariant=\"normal\">&nbsp;J</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">e</mi></mrow></mfenced></math><br /><math><mi>N</mi><mo>=</mo><mfrac><mrow><mn>200</mn></mrow><mrow><mn>6.25</mn><mo>×</mo><mn>1.6</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>19</mn></mrow></msup></mrow></mfrac></math><br />As photon is just above threshold frequency <math><mi>K</mi><msub><mrow><mi>E</mi></mrow><mrow><mi>m</mi><mi>a</mi><mi>x</mi></mrow></msub></math> is zero and they are accelerated by potential difference of <math><mn>500</mn><mi>&nbsp;V</mi></math><br /><math><mi>K</mi><msub><mrow><mi>E</mi></mrow><mrow><mi>f</mi></mrow></msub><mo>=</mo><mi>q</mi><mi>∆</mi><mi>V</mi></math><br /><math><mfrac><mrow><msup><mrow><mi>P</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><mi>m</mi></mrow></mfrac><mo>=</mo><mi>q</mi><mi>∆</mi><mi>V</mi><mo>⇒</mo><mi>P</mi><mo>=</mo><msqrt><mn>2</mn><mi>m</mi><mi>q</mi><mi>∆</mi><mi>V</mi></msqrt></math><br />Since efficiency is 100%, number of electrons emitted is equal to number of photons falling per second as electrons are completely absorbed, force exerted <math><mi>n</mi><mi>m</mi><mi>v</mi></math><br /><math><mo>=</mo><mi>&nbsp;</mi><mfrac><mrow><mn>200</mn></mrow><mrow><mn>6.25</mn><mo>×</mo><mn>1.6</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>19</mn></mrow></msup></mrow></mfrac><mo>×</mo><msqrt><mn>2</mn><mfenced separators=\"|\"><mrow><mn>9</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>31</mn></mrow></msup></mrow></mfenced><mo>×</mo><mn>1.6</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>19</mn></mrow></msup><mo>×</mo><mn>500</mn></msqrt></math><br /><math><mo>=</mo><mi>&nbsp;</mi><mfrac><mrow><mn>3</mn><mo>×</mo><mn>200</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>25</mn></mrow></msup><mo>×</mo><msqrt><mn>1600</mn></msqrt></mrow><mrow><mn>6.25</mn><mo>×</mo><mn>1.6</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>19</mn></mrow></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mo>×</mo><mn>40</mn></mrow><mrow><mn>6.25</mn><mo>×</mo><mn>1.6</mn></mrow></mfrac><mo>×</mo><msup><mrow><mn>10</mn></mrow> Light": "https://d1z78r8i505acl.cloudfront.net/poster/erlIGTCXMRkXy.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/erlIGTCXMRkXy.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf822", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013 (Paper 1)", "title": "JEE Advanced 2013 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a13f23ac7d519f9b11b", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c49", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 2)", "title": "JEE Advanced 2011 (Paper 2)"}], "question": {"text": "A silver sphere of radius $1 \\mathrm{~cm}$ and work function $4.7 \\mathrm{eV}$ is suspended from an insulating thread in free-space. It is under continuous illumination of $200 \\mathrm{~nm}$ wavelength light. As photoelectrons are emitted, the sphere gets charged and acquires a potential. The maximum number of photoelectrons emitted from the sphere is $A \\times 10^Z$ (where $1 < A < 10$ ). The value of $Z$ is", "image": null}, "options": [], "correctValue": "7", "solution": {"text": "Photoemission will stop when potential on silver sphere becomes equal to the stopping potential.\n$\\therefore \\quad \\frac{h c}{\\lambda}-W=e V_0$\nHere, $\\quad V_0=\\frac{1}{4 \\pi \\varepsilon_0} \\frac{n e}{r}$\n$$\n\\begin{aligned}\n& \\therefore \\quad\\left(\\frac{1240}{1200} \\mathrm{eV}\\right)-(4.7 \\mathrm{eV}) \\\\\n&=\\frac{9 \\times 10^9 \\times n \\times 1.6 \\times 10^{-19}}{10^{-2}} \\\\\n&(6.2-4.7)=\\frac{9 \\times 10^9 \\times n \\times 1.6 \\times 10^{-19}}{10^{-2}} \\\\\n& \\text { or } \\quad n= \\frac{1.5 \\times 10^{-2}}{9 \\times 1.6 \\times 10^{-10}}=1.04 \\times 10^7\n\\end{aligned}\n$$\n$\\therefore$ Answer is 7 .\nAnalysis of Question\n(i) Question is moderately difficult.\n(ii) In $\\mathrm{eV}_0$ if we substitute the value of $e=1.6 \\times 10^{-19} \\mathrm{C}$, then answer is in J. If we leave it then, answer is in $e \\mathrm{~V}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c49", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 2)", "title": "JEE Advanced 2011 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169f4f23ac7d519f9afff", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c45", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2009-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2009 (Paper 2)", "title": "JEE Advanced 2009 (Paper 2)"}], "question": {"text": "Photoelectric effect experiments are performed using three different metal plates $p, \\quad q$ and $r$ having work functions $\\varphi_p=2.0 \\mathrm{eV}, \\varphi_q=2.5 \\mathrm{eV}$ and $\\varphi_r=3.0 \\mathrm{eV}$, respectively. A light beam containing wavelengths of $550 \\mathrm{~nm}$, $450 \\mathrm{~nm}$ and $350 \\mathrm{~nm}$ with equal intensities illuminates each of the plates. The correct $I-V$ graph for the experiment is", "image": null}, "options": [{"id": "tG64F", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/8gqO7thopOJzGlQ9pDUL_lC--xm2lipVk9RdDK48P18.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "veWnr", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/6Yha14QE5ecgcKW1rCihKK-A4yRVTTcuOpB6VBHIqrk.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "qNzIA", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/WtXlrOd4Fl_5Schqee2hXSKf9Vl1EhIXPzBJ05W6Lwo.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "rbBHf", "text": "\nNone of these", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\begin{gathered}\n\\text { 1. } K_p=E_p-\\phi_p=\\frac{1240}{550}-20=0.2545 \\mathrm{eV} \\\\\nK_q=E_q-\\phi_q=\\frac{1240}{450}-25=0.255 \\mathrm{eV} \\\\\nK_r=E_r-\\phi_r=\\frac{1240}{350}-3.0=0.543 \\mathrm{eV}\n\\end{gathered}\n$$\nIn the above equation $K$ represents maximum kinetic energy of photoelectrons and $E$, the energy of incident right. From the above values we can see that stopping potential, $\\left|V_r\\right|>\\left|V_q\\right|>\\left|V_p\\right|$\nFurther, their intensities are equal, but energy of individual photon of $r$ is maximum. Hence, number of photons incident (per unit area per unit time) of $r$ can be assumed to be least. Hence, saturation current of $r$ should be minimum.\nKeeping these points in mind no option seems to be correct. The correct graph is shown below,\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/ZssLLzGjx-oP96ATdC4k8dbeZqjya_pqS6yPBSp_fqk.original.fullsize.png\"><br>\n$$\n\\therefore \\text { No choice is correct. }\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c45", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2009-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2009 (Paper 2)", "title": "JEE Advanced 2009 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169c5f23ac7d519f9ae4c", "type": "multipleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1e77301f65c2f92c3f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}], "question": {"text": "The graph between $1 / \\lambda$ and stopping potential $(V)$ of three metals having work function $\\phi_1, \\phi_2$ and $\\phi_3$ in an experiment of photoelectric effect is plotted as shown in the figure. Which of the following statement(s) is/are correct? [Here $\\lambda$ is the wavelength of the incident ray].\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/fn5xOb21duNxkrB5xCJ-bdVJUfvk6qC36_-esP5Eqzw.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "qHB9d", "text": "\nRatio of work functions $\\phi_1: \\phi_2: \\phi_3=1: 2: 4$.\n", "image": null, "isCorrect": true}, {"id": "4HXXm", "text": "\nRatio of work functions $\\phi_1: \\phi_2: \\phi_3=4: 2: 1$.\n", "image": null, "isCorrect": false}, {"id": "j5KJi", "text": "\n$\\tan \\theta$ is directly proportional to $h c / e$, where $h$ is Planck's constant and $c$ is the speed of light.\n", "image": null, "isCorrect": true}, {"id": "T8gla", "text": "\nThe violet colour light can eject photoelectrons from metals 2 and 3.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From the relation, $e V=\\frac{h c}{\\lambda}-\\phi$ or $V=\\left(\\frac{h c}{e}\\right)\\left(\\frac{1}{\\lambda}\\right)-\\frac{\\phi}{e}$ This is equation of straight line.\nSlope is $\\tan \\theta=\\frac{h c}{e}$\n$$\n\\begin{aligned}\n\\phi_1: \\phi_2: \\phi_3 & =\\frac{h c}{\\lambda_{01}}: \\frac{h c}{\\lambda_{02}}: \\frac{h c}{\\lambda_{03}}=\\frac{1}{\\lambda_{01}}: \\frac{1}{\\lambda_{02}}: \\frac{1}{\\lambda_{03}}=1: 2: 4 \\\\\n\\frac{1}{\\lambda_{01}} & =0.001 \\mathrm{~nm}^{-1} \\text { or } \\lambda_{01}=10000 Å \\\\\n\\frac{1}{\\lambda_{02}} & =0.002 \\mathrm{~nm}^{-1} \\text { or } \\lambda_{02}=5000 Å \\\\\n\\frac{1}{\\lambda_{03}} & =0.004 \\mathrm{~nm}^{-1} \\text { or } \\lambda_{03}=25000 Å\n\\end{aligned}\n$$\nViolet colour has wavelength $4000 Å$.\nSo, violet colour can eject photoelectrons from metal-1 and metal-2.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1e77301f65c2f92c3f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    if (!data.topics || data.topics.length === 0) {
      document.getElementById('current-topic-title').textContent = "No Questions Available";
      document.getElementById('current-topic-count').textContent = "0 Questions";
      document.getElementById('questions-list').innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted); font-size: 16px;">No previous year questions recorded for this chapter in this exam.</div>';
    } else {
      data.topics.forEach((t, i) => {
        const pill = document.createElement('div');
        pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
        pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
        pill.onclick = () => selectTopic(i);
        pillsContainer.appendChild(pill);
      });
    }

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Advanced';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => { if (data.topics && data.topics.length > 0) selectTopic(0); });
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      if (data.topics && data.topics.length > 0) selectTopic(0);
    }
  </script>
</body>
</html>
