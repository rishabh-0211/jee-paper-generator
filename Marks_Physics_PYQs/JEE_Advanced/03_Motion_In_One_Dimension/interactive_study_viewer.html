inal.fullsize.png\"><br>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Momentum is first positive but decreasing. Displacement (or say position). is initially zero.\nIt will first increase. At highest point, momentum is zero and displacement is maximum. After that momentum is downwards (negative) and increasing but displacement is decreasing. Only (d) option satisfies these conditions.\nAnalysis of Question\n(i) Question is simple.\n(ii) Since all the graphs given in question are parabolic type, we need not to check the mathematical part of the question.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c48", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 1)", "title": "JEE Advanced 2011 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64b16aeff23ac7d519f9b9b2", "title": "Non-uniform Motion", "totalQuestions": 1, "questions": [{"_id": "64b16a4df23ac7d519f9b331", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf828", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016 (Paper 1)", "title": "JEE Advanced 2016 (Paper 1)"}], "type": "multipleCorrect", "level": 1, "question": {"text": "The positon vector <math><mover accent=\"true\"><mrow><mi>r</mi></mrow><mo>&#8594;</mo></mover></math> of a particle of mass m is given by the following equation <math><mover accent=\"true\"><mrow><mi>r</mi></mrow><mo>&#8594;</mo></mover><mfenced separators=\"|\"><mrow><mi>t</mi></mrow></mfenced><mo>=</mo><mi>&#945;</mi><msup><mrow><mi>t</mi></mrow><mrow><mn>3</mn></mrow></msup><mover accent=\"true\"><mrow><mi>i</mi></mrow><mo>^</mo></mover><mo>+</mo><mi>&#946;</mi><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup><mover accent=\"true\"><mrow><mi>j</mi></mrow><mo> n>10</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>×</mo><mn>1</mn><mover accent=\"true\"><mrow><mi>i</mi></mrow><mo>^</mo></mover><mo>+</mo><mn>2</mn><mo>×</mo><mn>5</mn><mover accent=\"true\"><mrow><mi>j</mi></mrow><mo>^</mo></mover></mrow></mfenced><mo>=</mo><mn>2</mn><mover accent=\"true\"><mrow><mi>i</mi></mrow><mo>^</mo></mover><mo>+</mo><mover accent=\"true\"><mrow><mi>j</mi></mrow><mo>^</mo></mover></math> <br >(iv)  <math><mover accent=\"true\"><mrow><mi>τ</mi></mrow><mo>→</mo></mover><mo>=</mo><mi>r</mi><mo>×</mo><mover accent=\"true\"><mrow><mi>F</mi></mrow><mo>→</mo></mover></math> <br > <math><mo>=</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>10</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mover accent=\"true\"><mrow><mi>i</mi></mrow><mo>^</mo></mover><mo>+</mo><mn>5</mn><mover accent=\"true\"><mrow><mi>j</mi></mrow><mo>^</mo></mover></mrow></mfenced><mo>×</mo><mfenced separators=\"|\"><mrow><mn>2</mn><mover accent=\"true\"><mrow><mi>i</mi></mrow><mo>^</mo></mover><mo>+</mo><mover accent=\"true\"><mrow><mi>j</mi></mrow><mo>^</mo></mover></mrow></mfenced></math>  <br > <math><mo>=</mo><mo>+</mo><mfrac><mrow><mn>10</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mover accent=\"true\"><mrow><mi>k</mi></mrow><mo>^</mo></mover><mo>+</mo><mn>10</mn><mfenced separators=\"|\"><mrow><mo>-</mo><mover accent=\"true\"><mrow><mi>k</mi></mrow><mo>^</mo></mover></mrow></mfenced></math>  <br > <math><mo>=</mo><mo>-</mo><mfrac><mrow><mn>20</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mover accent=\"true\"><mrow><mi>k</mi></mrow><mo>^</mo></mover><mi> </mi></math>", "image": null}, "videoSolution": {"videoId": "72e6f7b0dd9f42969d6acf7b30b4938c", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/2a6R7oLq8vYqi.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/2a6R7oLq8vYqi.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf828", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016 (Paper 1)", "title": "JEE Advanced 2016 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "66965e0b844b5f1d94e798b7", "title": "Relative Motion", "totalQuestions": 1, "questions": [{"_id": "66965dd8d603121f43a40e72", "type": "numerical", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "66965789b31faf98fda8fefa", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2024-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Paper 2)", "title": "JEE Advanced 2024 (Paper 2)"}], "question": {"text": "A ball is thrown from the location $\\left(x_0, y_0\\right)=(0,0)$ of a horizontal playground with an initial speed $v_0$ at an angle $\\theta_0$ from the $+x$-direction. The ball is to be hit by a stone, which is thrown at the same time from the location $\\left(x_1, y_1\\right)=(L, 0)$. The stone is thrown at an angle $\\left(180-\\theta_1\\right)$ from the $+x$-direction with a suitable initial speed. For a fixed $v_0$, when $\\left(\\theta_0, \\theta_1\\right)=\\left(45^{\\circ}, 45^{\\circ}\\right)$, the stone hits the ball after time $T_1$, and when $\\left(\\theta_0, \\theta_1\\right)=\\left(60^{\\circ}, 30^{\\circ}\\right)$, it hits the ball after time $T_2$. In such a case, $\\left(T_1 / T_2\\right)^2$ is _______ .", "image": null}, "options": [], "correctValue": 2, "solution": {"text": "For case I :\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/u9Al_faN8FMZKamCLt15IzlCUp4QrsdixqkMC0Y2syo.original.fullsize.png\">\n$a_{\\text {rel }}=0$\nFor collision $\\frac{\\mathrm{v}_0}{\\sqrt{2}}=\\frac{\\mathrm{v}}{\\sqrt{2}}$\n$\\therefore \\mathrm{v}=\\mathrm{v}_0$\nSo $\\mathrm{T}_1=\\frac{\\mathrm{L}}{\\frac{\\mathrm{v}_0}{\\sqrt{2}}+\\frac{\\mathrm{v}}{\\sqrt{2}}}$\n$\\therefore \\tau_1=\\frac{\\mathrm{L}}{\\sqrt{2} \\mathrm{v}_0} \\ldots . .(1)$\nFor case II,\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/GboTeS8Qff495XnPuDOZa0th_x8sv7aKL18Z5jCjG3o.original.fullsize.png\">\n$a_{\\text {rel }}=0$\nFor collision, $\\frac{\\mathrm{v}_0 \\sqrt{3}}{2}=\\frac{\\mathrm{v}}{2}$\n$\\begin{aligned}\n& \\therefore \\mathrm{v}=\\sqrt{3} \\mathrm{v}_0 \\\\\n& \\text { So, } \\mathrm{T}_2=\\frac{\\mathrm{L}}{\\frac{\\mathrm{v}_0}{2}+\\mathrm{v} \\frac{\\sqrt{3}}{2}} \\\\\n& \\mathrm{~T}_2=\\frac{\\mathrm{L}}{\\frac{\\mathrm{v}_0}{2}+\\frac{3 \\mathrm{v}_0}{2}} \\\\\n& \\therefore \\mathrm{T}_2=\\frac{\\mathrm{L}}{2 \\mathrm{v}_0} \\ldots \\ldots . .(2) \\\\\n& \\text { so, }\\left(\\frac{\\mathrm{T}_1}{\\mathrm{~T}_2}\\right)^2=(\\sqrt{2})^2=2 \\Rightarrow\\left(\\frac{\\mathrm{T}_1}{\\mathrm{~T}_2}\\right)^2=2\n\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "81c6cc07fd9e4b68829a83820fe399a3", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/AXGBOXCkQbqu3.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/AXGBOXCkQbqu3.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "66965789b31faf98fda8fefa", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2024-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Paper 2)", "title": "JEE Advanced 2024 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Advanced';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
