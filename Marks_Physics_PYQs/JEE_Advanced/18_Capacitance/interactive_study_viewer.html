erial of relative permittivity <math><msub><mrow><mi>ϵ</mi></mrow><mrow><mi>r</mi></mrow></msub></math> . The cell electromotive force (emf) <math><mrow> <msub> <mi>V</mi> <mn>0</mn> </msub> </mrow> <mi> </mi><mo>=</mo><mi> </mi><mn>8</mn><mi> </mi><mi>V</mi></math> . First the switch <math><msub><mrow><mi>S</mi></mrow><mrow><mn>1</mn></mrow></msub></math> is closed while the switch <math><msub><mrow><mi>S</mi></mrow><mrow><mn>2</mn></mrow></msub></math> is kept open. When the capacitor <math><msub><mrow><mi>C</mi></mrow><mrow><mn>3</mn></mrow></msub></math> is fully charged, <math><msub><mrow><mi>S</mi></mrow><mrow><mn>1</mn></mrow></msub></math> is opened and <math><msub><mrow><mi>S</mi></mrow><mrow><mn>2</mn></mrow></msub></math> is closed simultaneously. When all the capacitors reach equilibrium, the charge on <math><msub><mrow><mi>C</mi></mrow><mrow><mn>3</mn></mrow></msub></math> is found to be <math><mn>5</mn><mi> </mi><mi>μ</mi><mi>C</mi></math> . The value of <math><msub><mrow><mi>ϵ</mi></mrow><mrow><mi>r</mi></mrow></msub></math> =____________.<br ><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/xyzryitbyxwnrebtgcoxxtfvgsobjhwmsianjxhzumtgpbkpbd.jpeg\"/></p>", "image": null}, "options": [], "correctValue": "1.5", "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/11_solu_phy.jpg\"/>\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/11_solu_1_phy.jpg\"/>\r\n\r\nApplying loop rule\r\n\r\n<math><mfrac><mrow><mn>5</mn></mrow><mrow><mn>1</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>3</mn></mrow><mrow><msub><mrow><mo>∈</mo></mrow><mrow><mi>r</mi></mrow></msub></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>1</mn></mrow></mfrac><mo>=</mo><mn>0</mn></math>\r\n\r\n<math><mfrac><mrow><mn>3</mn></mrow><mrow><msub><mrow><mo>∈</mo></mrow><mrow><mi>r</mi></mrow></msub></mrow></mfrac><mo>=</mo><mn>2</mn></math>\r\n\r\n<math><msub><mrow><mo>∈</mo></mrow><mrow><mi>r</mi></mro e6X7Rp86zaokBjgBxu+44dom27F9SWEKtXrRT/9Y9/qC0KNAYoCOAUcAtP0XYWBohIAwcRiDQwQEQaGCAiDQxQqLpxSuz88v/Ef878JY59u1CM6/Oy6PhxvEgfjsjo5qnvxOJl8eLsTVUQFJJFwrJJYtq6IyJVlaRLFWf3rBGzpv1LzP56rziXeQcbCPH/GV7fjn6pJmcAAAAASUVORK5CYII=\">", "image": null}, "options": [{"id": "cKYkq", "text": "$+32 \\mu \\mathrm{C}$", "isCorrect": false, "image": null}, {"id": "KaMim", "text": "$+40 \\mu \\mathrm{C}$", "isCorrect": false, "image": null}, {"id": "YgwHI", "text": "$+48 \\mu \\mathrm{C}$", "isCorrect": true, "image": null}, {"id": "8Aj1U", "text": "$+80 \\mu \\mathrm{C}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The total charge on plate $A$ will be $80 \\mu \\mathrm{C}$.\r\n\r\n$2 \\mu F$ and $3 \\mu F$ capacitors are in parallel. Therefore, $C_{e q}=2+3=5 \\mathrm{HF}$\r\n\r\nCharge on capacitor of $3 \\mu \\mathrm{F}$ capacitance $q=\\frac{3}{5} \\times 80=48 \\mu C$\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/hg2rttPavpB446uZyDbOiN4HL3hyjh-OD7VgG6EegZM.original.fullsize.png\">", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c4b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 2)", "title": "JEE Advanced 2012 (Paper 2)"}, "evalStatus": "correct", "lastPracticed": "2024-12-02T07:06:34.524Z"}]}, {"index": 3, "topicId": "64b16ae5f23ac7d519f9b949", "title": "Capacitors with Dielectric", "totalQuestions": 5, "questions": [{"_id": "6a0be51544d287c9361e5cc9", "type": "numerical", "question": {"text": "<strong>Passage:</strong> A container of height $2$ m, length $2$ m and breadth $1$ m is made of insulating vertical walls and two large area horizontal metal plates ($M_1$ and $M_2$) which extend far beyond the vertical walls in all directions. The container is partitioned into two equal chambers with a thin insulating vertical wall. The partition wall contains a small hole of cross-sectional area $\\sqrt{10}$ cm$^2$ near its bottom edge. Initially the hole is closed and the left chamber of the container is completely filled with a liquid of dielectric constant $\\epsilon_r = 15$ and the right chamber is empty ($\\epsilon_r = 1$). At time $t = 0$, the hole is opened and the liquid flows from the left chamber to the right chamber. In both the chambers, the space above the liquid has $\\epsilon_r = 1$ and is maintained at atmospheric pressure. The schematic of the container at a time $t > 0$ is shown in the figure.<br>[Given: acceleration due to gravity is $10$ ms$^{-2}$.]<br><img style=\"width: 400px\" src=\"https://cdn.quizrr.in/question-assets/jee_adv/2026/watermarked_images/p2_english__q33_d1.png\" /><br><br><strong>Question:</strong> The difference in the capacitance (in F) between the metal plates at $t = 0$ and that at $t = 500$ s is $(8 - n)\\epsilon_0$, where $\\epsilon_0$ is the permittivity of free space. The value of $n$ is:", "image": null}, "options": [], "correctValue": "1.97", "solution": {"text": "Let $A$ be the area of each chamber. $A = 1 \\times 1 = 1 \\text{ m}^2$. Distance between plates is $d = 2 \\text{ m}$.<br><br>At $t = 0$, the left chamber is completely filled with liquid ($\\epsilon_r = 15$) and right chamber is empty ($\\epsilon_r = 1$).<br><br>Initial capacitance $C(0) = C_1 + C_2 = \\dfrac{15 \\epsilon_0 A}{d} + \\dfrac{\\epsilon_0 A}{d} = \\dfrac{15 \\epsilon_0 (1)}{2} + \\dfrac{\\epsilon_0 (1)}{2} = 8 \\epsilon_0$.<br><br>Let $y_1$ and $y_2$ be the liquid levels in the left and right chambers at time $t$. By conservation of volume, $y_1 + y_2 = 2 \\text{ m}$.<br><br>Let $h = y_1 - y_2$. The velocity of efflux from the left chamber is $v = \\sqrt{2gh}$.<br><br>Rate of flow $Q = -A \\dfrac{dy_1}{dt} = a \\sqrt{2gh}$, where $a = \\sqrt{10} \\times 10^{-4} \\text{ m}^2$ is the hole area.<br><br>Since $y_1 + y_2 = 2$, we have $dy_2 = -dy_1$, so $dh = 2dy_1 \\Rightarrow \\dfrac{dy_1}{dt} = \\dfrac{1}{2} \\dfrac{dh}{dt}$.<br><br>$-\\dfrac{1}{2} \\dfrac{dh}{dt} = a \\sqrt{2gh} \\Rightarrow \\dfrac{dh}{\\sqrt{h}} = -2a \\sqrt{2g} dt$.<br><br>Integrating from $t=0$ ($h=2$) to $t=500 \\text{ s}$ ($h$):<br><br>$\\int_{2}^{h} h^{-1/2} dh = -2a \\sqrt{2g} \\int_{0}^{500} dt$<br><br>$2\\sqrt{h} - 2\\sqrt{2} = -2 (\\sqrt{10} \\times 10^{-4}) (\\sqrt{20}) (500) = -\\sqrt{200} \\times 10^{-4} \\times 1000 = -10\\sqrt{2} \\times 0.1 = -\\sqrt{2}$.<br><br>$2\\sqrt{h} = \\sqrt{2} \\Rightarrow \\sqrt{h} = \\dfrac{1}{\\sqrt{2}} \\Rightarrow h = 0.5 \\text{ m}$.<br><br>From $y_1 + y_2 = 2$ and $y_1 - y_2 = 0.5$, we get $y_1 = 1.25 \\text{ m}$ and $y_2 = 0.75 \\text{ m}$.<br><br>At $t=500 \\text{ s}$, each chamber acts as two capacitors in series (liquid and air).<br><br>$C_{left} = \\dfrac{1}{\\dfrac{y_1}{15\\epsilon_0 A} + \\dfrac{2-y_1}{\\epsilon_0 A}} = \\dfrac{15\\epsilon_0}{30 - 14y_1} = \\dfrac{15\\epsilon_0}{30 - 14(1.25)} = \\dfrac{15\\epsilon_0}{12.5} = \\dfrac{6}{5} \\epsilon_0 = 1.2 \\epsilon_0$.<br><br>$C_{right} = \\dfrac{1}{\\dfrac{y_2}{15\\epsilon_0 A} + \\dfrac{2-y_2}{\\epsilon_0 A}} = \\dfrac{15\\epsilon_0}{30 - 14y_2} = \\dfrac{15\\epsilon_0}{30 - 14(0.75)} = \\dfrac{15\\epsilon_0}{19.5} = \\dfrac{150}{195} \\epsilon_0 = \\dfrac{10}{13} \\epsilon_0$.<br><br>$C(500) = C_{left} + C_{right} = \\dfrac{6}{5} \\epsilon_0 + \\dfrac{10}{13} \\epsilon_0 = \\dfrac{128}{65} \\epsilon_0 \\approx 1.97 \\epsilon_0$.<br><br>Difference in capacitance $= C(0) - C(500) = 8\\epsilon_0 - \\dfrac{128}{65}\\epsilon_0 = \\left(8 - \\dfrac{128}{65}\\right)\\epsilon_0$.<br><br>Comparing this with the given expression $(8 - n)\\epsilon_0$, we get $n = \\dfrac{128}{65} = 1.97$", "image": null}, "level": 3, "videoSolution": {"videoId": "8723a5894a414e4b95d514b5b9fe848e", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/vyrP9NKM0nhCK.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/vyrP9NKM0nhCK.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "previousYearPapers": [{"_id": "6a0be4ef402904185b819b43", "title": "JEE Advanced 2026 (Paper 2)", "shortName": "2026 (Paper 2)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a0be4ef402904185b819b43", "title": "JEE Advanced 2026 (Paper 2)", "shortName": "2026 (Paper 2)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16aa0f23ac7d519f9b624", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "64b1672d25f94b8a85b91cd9", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 1)", "title": "JEE Advanced 2023 (Paper 1)"}], "question": {"text": "<p>A container has a base of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&#160;</mo><mi>cm</mi><mo>&#215;</mo><mn>5</mn><mo>&#160;</mo><mi>cm</mi></math> and height <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&#160;</mo><mi>cm</mi></math>, as shown in the figure. It has two parallel electrically conducting walls each of area <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&#160;</mo><mi>cm</mi><mo>&#215;</mo><mn>50</mn><mo>&#160;</mo><mi>cm</mi></math>. The remaining walls of the container are thin and non-conducting. The container is being filled with a liquid of dielectric constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>&nbsp;at a uniform rate of <math xmlns=\"http:// <mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">K</mi><msub><mrow><mo>&#8712;</mo></mrow><mrow><mn>0</mn></mrow></msub><mi mathvariant=\"normal\">A</mi></mrow><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">n</mi><mn>2</mn></mrow></mfrac></mrow></mfenced><mo>.</mo></math> The value of <math><mi mathvariant=\"normal\">&#945;</mi></math> will be____<br /><math><mo>[</mo><msub><mrow><mo>&#8712;</mo></mrow><mrow><mn>0</mn></mrow></msub></math> is the permittivity of free space]", "image": null}, "options": [], "correctValue": "1", "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/jwwygxeqqbmykrfpcajhkvetzcahgnqzyoewhdzovabgxtponi.png\"/>\r\n\r\nLet <math><msup><mrow><mi>m</mi></mrow><mrow><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">h</mi></mrow></msup></math> layer is at a distance <math><mi mathvariant=\"normal\">‘</mi><mi mathvariant=\"normal\">x</mi><mi mathvariant=\"normal\">’</mi></math> from left plate.\r\n\r\nAlso, let there be a small strip of thickness 'dx' having small capacitance <math><mi>′</mi><mi>′</mi><mi>d</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mi>C</mi></mrow></mfrac></mrow></mfenced><mi>′</mi><mi>′</mi></math> with medium <math><mi>′</mi><mi>′</mi><msub><mrow><mi>K</mi></mrow><mrow><mi>m</mi></mrow></msub><mi>′</mi><mi>′</mi></math> in between.\r\n\r\n<math><mo>⇒</mo><mfrac><mrow><mi>x</mi></mrow><mrow><mi>m</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>D</mi></mrow><mrow><mi>N</mi></mrow></mfrac></math>\r\n\r\nAlso, <math><mi>d</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mi>C</mi></mrow></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mi>d</mi><mi>x</mi></mrow><mrow><msub><mrow><mi>K</mi></mrow><mrow><mi>m</mi></mrow></msub><msub><mrow><mi>ε</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>A</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>d</mi><mi>x</mi></mrow><mrow>  the two plates as shown in the figure, the capacitance becomes <math><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>2</mn></mrow></msub></math> . The ratio <math><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></math> is<br ><br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/image10-00858567-f376-486b-be8c-e64f8146c3f4.jpg\"/></p>", "image": null}, "options": [{"id": "Crzlf", "text": "<math><mfrac><mrow><mn>6</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "Bk5ij", "text": "<math><mfrac><mrow><mn>5</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "zzGqm", "text": "<math><mfrac><mrow><mn>7</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "a9KTH", "text": "<math><mfrac><mrow><mn>7</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<math><mfrac><mrow><mn>5</mn><msub><mrow><mi mathvariant=\"normal\">ϵ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mi mathvariant=\"normal\">d</mi></mrow></mfrac><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>1</mn></mrow></msub></math> <br >In new setup we have 3 different setups<br >i.  <math><mfrac><mrow><mn>5</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mfrac><mrow><mi mathvariant=\"normal\">d</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mi mathvariant=\"normal\"> </mi><msub><mrow><mi mathvariant=\"normal\">ϵ</mi></mrow><mrow><mn>1</mn></mrow></msub></math> <br > <math><msup><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mi mathvariant=\"normal\">′</mi></mrow></msup><mo>=</mo><mfrac><mrow><mfrac><mrow><mn>5</mn></mrow><mrow><mn>2</mn></mrow></mfrac><msub><mrow><mi mathvariant=\"normal\">ϵ</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">ϵ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mfrac><mrow><mi mathvariant=\"normal\">d</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfrac><mo>=</mo><mn>2</mn><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>1</mn></mrow></msub></math> <br >ii.  <math><mfrac><mrow><mn>5</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mfrac><mrow><mi mathvariant=\"normal\">d</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mi mathvariant=\"normal\"> </mi><msub><mrow><mi mathvariant=\"normal\">ϵ</mi></mrow><mrow><mn>2</mn></mrow></msub></math> <br > <math><msup><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mi mathvariant=\"normal\">′</mi><mi mathvariant=\"normal\">′</mi></mrow></msup><mo>=</mo><mfrac><mrow><mfrac><mrow><mn>5</mn></mrow><mrow><mn>2</mn></mrow></mfrac><msub><mrow><mi mathvariant=\"normal\">ϵ</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">ϵ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mfrac><mrow><mi mathvariant=\"normal\">d</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfrac><mo>=</mo><mn>4</mn><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>1</mn></mrow></msub></math> <br >iii.  <math><mfrac><mrow><mn>5</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">d</mi><mo>,</mo><mi mathvariant=\"normal\"> </mi><msub><mrow><mi mathvariant=\"normal\">ϵ</mi></mrow><mrow><mn>1</mn></mrow></msub></math> <br > <math><msup><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mi mathvariant=\"normal\">′</mi><mi mathvariant=\"normal\">′</mi><mi mathvariant=\"normal\">′</mi></mrow></msup><mo>=</mo><mfrac><mrow><mfrac><mrow><mn>5</mn></mrow><mrow><mn>2</mn></mrow></mfrac><msub><mrow><mi mathvariant=\"normal\">ϵ</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">ϵ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mi mathvariant=\"normal\">d</mi></mrow></mfrac><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>1</mn></mrow></msub></math> <br > <br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/image11-8247136b-678d-49c1-81a5-296746d0e4f3.jpg\"/> <br > <math><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></mrow></mfenced></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>14</mn></mrow><mrow><mn>6</mn></mrow></mfrac><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>7</mn></mrow><mrow><mn>3</mn></mrow></mfrac><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>1</mn></mrow></msub></math> <br > <math><mo>∴</mo><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>7</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null}, "videoSolution": {"videoId": "a72ea764e4654356af8bcdb7a7d2f832", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/4h7jvu2FLWFxw.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/4h7jvu2FLWFxw.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf827", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2015-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2015 (Paper 2)", "title": "JEE Advanced 2015 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a32f23ac7d519f9b238", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf824", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014 (Paper 1)", "title": "JEE Advanced 2014 (Paper 1)"}], "type": "multipleCorrect", "level": 2, "question": {"text": "<p>A parallel plate capacitor has a dielectric slab of dielectric constant K between its plates that covers 1/3 of the area of its plates, as shown in the figure. The total capacitance of the capacitor is C while that of the portion with dielectric in between is <math><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>1</mn></mrow></msub></math> . When the capacitor is charged, the plate area covered by the dielectric gets charge <math><msub><mrow><mi mathvariant=\"normal\">Q</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and the rest of the area gets charge <math><msub><mrow><mi mathvariant=\"normal\">Q</mi></mrow><mrow><mn>2</mn></mrow></msub></math> . The electric field in the dielectric is <math><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and that in the other portion is <math><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>2</mn></mrow></msub></math> . Choose the correct option/options, ignoring edge effects.<br ><br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/image2-95418e85-0042-4c6f-8564-a2a5d886ae5b.png\"/></p>", "image": null}, "options": [{"id": "ryhh1", "text": "<math><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mn>1</mn></math>", "isCorrect": true, "image": null}, {"id": "GvoPE", "text": "<math><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">K</mi></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "bD3pB", "text": "<math><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">Q</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">Q</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mi mathvariant=\"normal\">K</mi></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "vg5l1", "text": "<math><mfrac><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mo>+</mo><mi mathvariant=\"normal\">K</mi></mrow><mrow><mi mathvariant=\"normal\">K</mi></mrow></mfrac></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "As <math><mi mathvariant=\"normal\">E</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">v</mi></mrow><mrow><mi mathvariant=\"normal\">d</mi></mrow></mfrac></math><br /><math><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">v</mi></mrow><mrow><mi mathvariant=\"normal\">d</mi></mrow></mfrac></math><br /><math><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">v</mi></mrow><mrow><mi mathvariant=\"normal\">d</mi></mrow></mfrac></math><br />(As both parts have some P.D.) upper capacitor have capacitance<br /><math><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mi mathvariant=\"normal\">K</mi><msub><mrow><mi mathvariant=\"normal\">&epsilon;</mi></mrow><mrow><mn>0</mn></mrow></msub><mi mathvariant=\"normal\">A</mi><mo>/</mo><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">&nbsp;</mi></math><br />Lower capacitor<br /><math><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>2</mn><msub><mrow><mi mathvariant=\"normal\">&epsilon;</mi></mrow><mrow><mn>0</mn></mrow></msub><mi mathvariant=\"normal\">A</mi><mo>/</mo><mi mathvariant=\"normal\">d</mi></math><br /><math><mo>&there4;</mo></math> equivalent capacitance<br /><math><mi mathvariant=\"normal\">C</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">k</mi><mo>+</mo><mn>2</mn></mrow></mfenced><msub><mrow><mi mathvariant=\"normal\">ϵ</mi></mrow><mrow><mn>0</mn></mrow></msub><mi mathvariant=\"normal\">A</mi><mo>/</mo><mi mathvariant=\"normal\">d</mi></math><br /><math><mo>&there4;</mo><mfrac><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">k</mi><mo>+</mo><mn>2</mn></mrow><mrow><mi mathvariant=\"normal\">k</mi></mrow></mfrac></math><br />And <math><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>1</mn></mrow></msub><mi mathvariant=\"normal\">&nbsp;</mi><mo>:</mo><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">v</mi></mrow><mrow><mi mathvariant=\"normal\">d</mi></mrow></mfrac><mo>:</mo><mfrac><mrow><mi mathvariant=\"normal\">v</mi></mrow><mrow><mi mathvariant=\"normal\">d</mi></mrow></mfrac><mo>=</mo><mn>1</mn></math>", "image": null}, "videoSolution": {"videoId": "7330b8ca0c8242719ae72f71b02dec1f", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/R8iT09bDzptJq.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/R8iT09bDzptJq.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf824", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014 (Paper 1)", "title": "JEE Advanced 2014 (Paper 1)"}, "evalStatus": "incorrect", "lastPracticed": "2024-12-02T06:37:24.726Z"}]}, {"index": 4, "topicId": "64b16ae5f23ac7d519f9b947", "title": "Force and Energy stored in capacitor", "totalQuestions": 4, "questions": [{"_id": "64b16a95f23ac7d519f9b5bc", "previousYearPapers": [{"_id": "632c83573e3fd59bda92e46c", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022 (Paper 1)", "title": "JEE Advanced 2022 (Paper 1)"}], "type": "multipleCorrect", "level": 2, "question": {"text": "<p>A medium having dielectric constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi><mo>&gt;</mo><mn>1</mn></math>&nbsp;fills the space between the plates of a parallel plate capacitor. The plates have large area, and the distance between them is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi></math>. The capacitor is connected to a battery of voltage <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi></math>. as shown in Figure (a). Now, both the plates are moved by a distance of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>d</mi><mn>2</mn></mfrac></math> from their original positions, as shown in Figure (b).</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/3046c2e4-8622-45a1-9824-b44c89de88e3-image.png\" style=\"width: 350px; height: 180px;\" /></p><p>In the process of going from the configuration depicted in Figure (a) to that in Figure (b), which of the following statement(s) is(are) correct?</p>", "image": null}, "options": [{"id": "D3SEE", "text": "The electric field inside the dielectric material is reduced by a factor of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math>.", "isCorrect": false, "image": null}, {"id": "F00IF", "text": "The capacitance is decreased by a factor of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mrow><mi>K</mi><mo>+</mo><mn>1</mn></mrow></mfrac></math>.", "isCorrect": true, "image": null}, {"id": "QKJXt", "text": "The voltage between the capacitor plates is increased by a factor of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>K</mi><mo>+</mo><mn>1</mn></mrow></mfenced></math>.", "isCorrect": false, "image": null}, {"id": "bNDZx", "text": "The work done in the process DOES NOT depend on the presence of the dielectric material.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/81f8d8ca-acd5-4828-91c2-21b745d7d975-image.png\" style=\"width: 360px; height: 166px;\" /></p><p>Capacitance of both capacitors are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mi>a</mi></msub><mo>=</mo><mfrac><mrow><mi>K</mi><msub><mi>&#949;</mi><mn>0</mn></msub><mi>A</mi></mrow><mi>d</mi></mfrac></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mi>b</mi></msub><mo>=</mo><mfrac><mrow><msub><mi>&#949;</mi><mn>0</mn></msub><mi>A</mi></mrow><mrow><mi>d</mi><mo>+</mo><mfenced><mfrac><mi>d</mi><mi>K</mi></mfrac></mfenced></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mi>&#949;</mi><mn>0</mn></msub><mi>A</mi><mi>K</mi></mrow><mrow><mi>d</mi><mfenced><mrow><mi>K</mi><mo>+</mo><mn>1</mn></mrow></mfenced></mrow></mfrac></math></p><p>Now, charge stored is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>q</mi><mi mathvariant=\"normal\">a</mi></msub><mo>=</mo><mfrac><mrow><mi>K</mi><msub><mi>&#949;</mi><mn>0</mn></msub><mi>A</mi></mrow><mi>d</mi></mfrac><mi>V</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>q</mi><mi>b</mi></msub><mo>=</mo><mfrac><mrow><msub><mi>&#949;</mi><mn>0</mn></msub><mi>A</mi><mi>K</mi><mi>V</mi></mrow><mrow><mi>d</mi><mfenced><mrow><mi>K</mi><mo>+</mo><mn>1</mn></mrow></mfenced></mrow></mfrac></math>.</p><p>Electric field between each parallel plate capacitor is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mi>a</mi></msub><mo>=</mo><mfrac><msub><mi>q</mi><mi>a</mi></msub><mrow><mi>K</mi><mi>A</mi><msub><mi>&#949;</mi><mn>0</mn></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>K</mi><msub><mi>&#949;</mi><mn>0</mn></msub><mi>A</mi><mi>V</mi></mrow><mrow><mi>d</mi><mi>K</mi><msub><mi>&#949;</mi><mn>0</mn></msub><mi>A</mi></mrow></mfrac></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mi>V</mi><mi>d</mi></mfrac></math>&nbsp;and</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mfenced><msub><mi>E</mi><mi>b</mi></msub></mfenced><mi>dielectric</mi></msub><mo>=</mo><mfrac><msub><mi>E</mi><mi>air</mi></msub><mi>K</mi></mfrac></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><msub><mi>q</mi><mi>b</mi></msub><mrow><mi>K</mi><mi>A</mi><msub><mi>&#949;</mi><mn>0</mn></msub></mrow></mfrac></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><msub><mi>&#949;</mi><mn>0</mn></msub><mi>A</mi><mi>K</mi><mi>V</mi></mrow><mrow><mi>d</mi><mfenced><mrow><mi>K</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mfenced><mrow><mi>K</mi><mi>A</mi><msub><mi>&#949;</mi><mn>0</mn></msub></mrow></mfenced></mrow></mfrac></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mi>V</mi><mrow><mi>d</mi><mfenced><mrow><mi>K</mi><mo>+</mo><mn>1</mn></mrow></mfenced></mrow></mfrac></math></p><p>So, from above relations, we can see that capacitance decrease by a factor of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mrow><mi>K</mi><mo>+</mo><mn>1</mn></mrow></mfrac></math>.</p></blockquote><blockquote><p>Work done in the process&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><msub><mi>U</mi><mi>f</mi></msub><mo>-</mo><msub><mi>U</mi><mi>i</mi></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mrow><msub><mi>C</mi><mi>f</mi></msub><mo>-</mo><msub><mi>C</mi><mi>i</mi></msub></mrow></mfenced><msup><mi>V</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mrow><mfrac><mrow><msub><mi>&#949;</mi><mn>0</mn></msub><mi>A</mi><mi>K</mi></mrow><mrow><mi>d</mi><mfenced><mrow><mi>K</mi><mo>+</mo><mn>1</mn></mrow></mfenced></mrow></mfrac><mo>-</mo><mfrac><mrow><mi>K</mi><msub><mi>&#949;</mi><mn>0</mn></msub><mi>A</mi></mrow><mi>d</mi></mfrac></mrow></mfenced><msup><mi>V</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mi>V</mi><mn>2</mn></msup><mfrac><mrow><msub><mi>&#949;</mi><mn>0</mn></msub><mi>A</mi><mi>K</mi></mrow><mi>d</mi></mfrac><mfenced><mrow><mfrac><mn>1</mn><mrow><mi>K</mi><mo>+</mo><mn>1</mn></mrow></mfrac><mo>-</mo><mn>1</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfrac><mrow><msub><mi>&#949;</mi><mn>0</mn></msub><mi>A</mi><mi>K</mi><msup><mi>V</mi><mn>2</mn></msup></mrow><mi>d</mi></mfrac><mfrac><mrow><mn>1</mn><mo>-</mo><mi>K</mi><mo>-</mo><mn>1</mn></mrow><mrow><mi>K</mi><mo>+</mo><mn>1</mn></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfrac><mrow><msub><mi>&#949;</mi><mn>0</mn></msub><mi>A</mi><msup><mi>V</mi><mn>2</mn></msup></mrow><mi>d</mi></mfrac><mfenced><mfrac><mrow><mo>-</mo><msup><mi>K</mi><mn>2</mn></msup></mrow><mrow><mi>K</mi><mo>+</mo><mn>1</mn></mrow></mfrac></mfenced></math></p><p>Thus, the work done in the process depends upon the dielectric material.</p></blockquote>", "image": null}, "videoSolution": {"videoId": "5ec7de1684a3486f8b696b353793fdfc", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/HZOtMx1zK528j.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/HZOtMx1zK528j.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "632c83573e3fd59bda92e46c", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022 (Paper 1)", "title": "JEE Advanced 2022 (Paper 1)"}, "evalStatus": "correct", "lastPracticed": "2024-11-30T11:02:53.174Z"}, {"_id": "64b16a60f23ac7d519f9b3d7", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf82b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2017-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2017 (Paper 2)", "title": "JEE Advanced 2017 (Paper 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<strong> Paragraph: </strong>\r\n\r\nConsider a simple $R C$ circuit as shown in Figure $1$.\r\n\r\nProcess 1: In the circuit the switch $S$ is closed at $t=0$ and the capacitor is fully charged to voltage $V_{0}$ (i.e., charging continues for time $T>>R C$ ). In the process some dissipation $\\left(E_{D}\\right)$ occurs across the resistance $R$. The amount of energy finally stored in the fully charged capacitor is $E_{C}$.\r\n\r\nProcess 2: In a different process the voltage is first set to $\\frac{V_{0}}{3}$ and maintained for a charging time $T>>R C$. Then the voltage is raised to $\\frac{2 V_{0}}{3}$ without discharging the capacitor and again maintained for a time $T>>R C$. The process is repeated one more time by raising the voltage to $V_{0}$ and the capacitor is charged to the same final voltage $V_{0}$ as in Process 1.\r\n\r\nThese two processes are depicted in Figure $2 .$\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/3hict01xSw6FyuXh_2qulXcKYs9jUrrEUZAMrv_GzUE.original.fullsize.png\"><br>\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/yQ5vkMubbDGQwsU_k7Dwv6nzzCKrbzhgT73D7qg05Ek.original.fullsize.png\"><br>\r\n\r\n<br> <strong> Question: </strong>\r\n\r\nIn Process 2, total energy dissipated across the resistance $E_{D}$ is:", "image": null}, "options": [{"id": "5ZYSp", "text": "\\(E_D=\\frac{1}{2} C V_0^2\\)", "isCorrect": false, "image": null}, {"id": "mK0y8", "text": "\\(E_D=3\\left(\\frac{1}{2} C V_0^2\\right)\\)", "isCorrect": false, "image": null}, {"id": "aBEIj", "text": "\\(E_D=\\frac{1}{3}\\left(\\frac{1}{2} C V_0^2\\right)\\)", "isCorrect": true, "image": null}, {"id": "Ry3lS", "text": "\\(E_D=3 C V_0^2\\)", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For process (i)<br />Charge on capacitor&nbsp;<math><mo>=</mo><mfrac><mrow><mi>C</mi><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>&#160;</mi></mrow><mrow><mn>3</mn></mrow></mfrac></math><br />Energy stored in capacitor&nbsp;<math><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>C</mi><mfrac><mrow><msubsup><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>9</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>C</mi><msubsup><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>18</mn></mrow></mfrac></math><br />Work done by battery&nbsp;<math><mo>=</mo><mfrac><mrow><mi>C</mi><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>3</mn></mrow></mfrac><mo>&#215;</mo><mfrac><mrow><mi>V</mi></mrow><mrow><mn>3</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>C</mi><msubsup><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>9</mn></mrow></mfrac></math><br />Heat loss&nbsp; <math><mo>=</mo><mfrac><mrow><mi>C</mi><msubsup><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>9</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mi>C</mi><msubsup><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>18</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>C</mi><msubsup><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>18</mn></mrow></mfrac></math><br />For process (ii)<br />Charge on capacitor&nbsp;<math><mo>=</mo><mfrac><mrow><mn>2</mn><mi>C</mi><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>3</mn></mrow></mfrac></math><br />Extra charge flow through battery&nbsp;<math><mo>=</mo><mfrac><mrow><mi>C</mi><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>3</mn></mrow></mfrac></math><br />Work done by battery:&nbsp; <math><mfrac><mrow><mi>C</mi><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>3</mn></mrow></mfrac><mi>&#160;</mi><mo>.</mo><mfrac><mrow><mn>2</mn><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>3</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>C</mi><msubsup><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>9</mn></mrow></mfrac></math><br />Final energy store in capacitor:&nbsp;<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>C</mi><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>2</mn><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>4</mn><mi>C</mi><msubsup><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>18</mn></mrow></mfrac></math><br />Energy store in process 2:&nbsp;<math><mfrac><mrow><mn>4</mn><mi>C</mi><msubsup><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>18</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mi>C</mi><msubsup><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>18</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn><mi>C</mi><msubsup><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>18</mn></mrow></mfrac></math><br />Heat loss in process (ii) = work done by battery in process (ii) &ndash; energy store in capacitor process (ii)<br /><math><mo>=</mo><mfrac><mrow><mn>2</mn><mi>C</mi><msubsup><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>9</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>3</mn><mi>C</mi><msubsup><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>18</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>C</mi><msubsup><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>18</mn></mrow></mfrac></math><br />For process (iii)<br />Charge on capacitor&nbsp;<math><mo>=</mo><mi>C</mi><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></math><br />Extra charge flow through battery:&nbsp;<math><mi>C</mi><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>-</mo><mfrac><mrow><mn>2</mn><mi>C</mi><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>3</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>C</mi><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>3</mn></mrow></mfrac></math><br />Work done by battery in this process:&nbsp;<math><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>C</mi><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></mfenced><mi>&#160;</mi><mfenced separators=\"|\"><mrow><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfenced><mo>=</mo><mfrac><mrow><mi>C</mi><msubsup><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>3</mn></mrow></mfrac></math><br />Find energy store in capacitor:&nbsp; <math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>C</mi><msubsup><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></math><br />Energy stored in this process:&nbsp; <math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>C</mi><msubsup><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>-</mo><mfrac><mrow><mn>4</mn><mi>C</mi><msubsup><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>18</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>5</mn><mi>C</mi><msubsup><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>18</mn></mrow></mfrac></math><br />Heat loss in process (iii):&nbsp; <math><mfrac><mrow><mi>C</mi><msubsup><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>3</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>5</mn><mi>C</mi><msubsup><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>18</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>C</mi><msubsup><mrow><mi>V</mi></mrow><mrow><mn>0< rrect": true}], "correctValue": null, "solution": {"text": "$q_i=C_i V=2 V=q$ (say)\nThis charge will remain constant after switch is shifted from position 1 to position 2.\n$$\n\\begin{aligned}\nU_i & =\\frac{1}{2} \\frac{q^2}{C_i}=\\frac{q^2}{2 \\times 2}=\\frac{q^2}{4} \\\\\nU_f & =\\frac{1}{2} \\frac{q^2}{C_f}=\\frac{q^2}{2 \\times 10}=\\frac{q^2}{20}\n\\end{aligned}\n$$\n$\\therefore$ Energy dissipated $=U_i-U_f=\\frac{q^2}{5}$\nThis energy dissipated $\\left(=\\frac{q^2}{5}\\right)$ is $80 \\%$ of the initial stored energy $\\left(=\\frac{q^2}{4}\\right)$.\nAnalysis of Question\n(i) This question is moderately tough.\n(ii) In a capacitor circuit, redistribution of charge takes place under following three conditions.\n(a) A switch is closed.\n(b) A closed switch is opened.\n(c) A switch is shifted from one position to another position.\nIn the redistribution of charge, energy is dissipated.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c48", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 1)", "title": "JEE Advanced 2011 (Paper 1)"}, "evalStatus": "correct", "lastPracticed": "2024-12-02T07:13:43.239Z"}]}, {"index": 5, "topicId": "64b16ae5f23ac7d519f9b946", "title": "Charging and Discarging of capacitors", "totalQuestions": 4, "questions": [{"_id": "64b16a88f23ac7d519f9b549", "previousYearPapers": [{"_id": "619f94337e944e1fdc2859b4", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021 (Paper 1)", "title": "JEE Advanced 2021 (Paper 1)"}], "type": "numerical", "level": 2, "question": {"text": "In the circuit shown below, the switch $\\mathrm{S}$ is connected to position $\\mathrm{P}$ for a long time so that the charge on the capacitor becomes $q_{1} \\mu \\mathrm{C}$. Then $\\mathrm{S}$ is switched to position $\\mathrm{Q}$. A rks.app/pyq/jee_advanced/99af4d0f-7bfb-4f0d-abe1-c832689232ee-image.png\" style=\"width: 400px; height: 198px;\" /></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>i</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mo>&#8722;</mo><mn>1</mn></mrow><mrow><mn>2</mn><mo>+</mo><mn>1</mn></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>i</mi><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></math></p><p>Now,</p><p>Charge on capacitor,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi><mo>=</mo><mi>C</mi><mi>V</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>q</mi><mo>=</mo><mfenced><mrow><mn>1</mn><mi>&#956;F</mi></mrow></mfenced><mfenced><mrow><mfrac><mn>4</mn><mn>3</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>q</mi><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><mi>&#956;C</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>q</mi><mo>=</mo><mn>1.33</mn><mo>&#160;</mo><mi>&#956;C</mi></math></p>", "image": null}, "videoSolution": {"videoId": "4ec2f0775acf41fca39ced58006ada1b", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/I1GX7qjfmxS77.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/I1GX7qjfmxS77.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "619f94337e944e1fdc2859b4", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible" e", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c43", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 2)", "title": "JEE Advanced 2008 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169d1f23ac7d519f9aeba", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1e77301f65c2f92c40", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 1)", "title": "JEE Advanced 2007 (Paper 1)"}], "question": {"text": "A circuit is connected as shown in the figure with the switch $S$ open. When the switch is closed, the total amount of charge that flows from $Y$ to $X$ is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/gVNmoMqCTlpc9kjg3AHBkN3h3FpoDB_xQ_LN2wyvCFU.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "1ccGP", "text": "\nzero\n", "image": null, "isCorrect": false}, {"id": "axtuN", "text": "\n$54 \\mu \\mathrm{C}$\n", "image": null, "isCorrect": false}, {"id": "o213e", "text": "\n$27 \\mu \\mathrm{C}$\n", "image": null, "isCorrect": true}, {"id": "mJGvG", "text": "\n$81 \\mu \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From $Y$ to $X$ charge flows to plates $a$ and $b$.\n$$\n\\left(q_0+q_b\\right)_i=0,\\left(q_0+q_b\\right)_f=27 \\mu \\mathrm{C}\n$$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/U9y-IpNMTnta5hFfTFwh-2QOoznAart4eldMPFAg-5M.original.fullsize.png\"><br><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/qLd1-LHBQQ3Yec5ukMhmKqut2Kcs75i6baaqnE6p4O8.original.fullsize.png\"><br>\n$\\therefore 27 \\mu \\mathrm{C}$ charge flows from $Y$ to $X$.\n$\\therefore$ Correct option is (c)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1e77301f65c2f92c40", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 1)", "title": "JEE Advanced 2007 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Advanced';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
