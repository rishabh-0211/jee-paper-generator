{k})$<br><br>The magnitude of the wave vector is $|\\vec{k}| = 5$ m$^{-1}$.<br><br>The angular frequency $\\omega$ is:<br><br>$\\omega = c|\\vec{k}| = (3 \\times 10^8) \\times 5 = 1.5 \\times 10^9$ rad s$^{-1}$<br><br>The magnetic field $\\vec{B}$ is given by:<br><br>$\\vec{B} = \\dfrac{1}{c}(\\hat{n} \\times \\vec{E}) = \\dfrac{1}{c} \\left[ -\\dfrac{1}{5}(3\\hat{j} + 4\\hat{k}) \\right] \\times [E_0 \\sin(3y + 4z + \\omega t)\\,\\hat{i}]$<br><br>$\\vec{B} = -\\dfrac{E_0}{5c} \\sin(3y + 4z + \\omega t) [3(\\hat{j} \\times \\hat{i}) + 4(\\hat{k} \\times \\hat{i})]$<br><br>$\\vec{B} = -\\dfrac{E_0}{5c} \\sin(3y + 4z + \\omega t) (-3\\hat{k} + 4\\hat{j}) = \\dfrac{E_0}{5c} \\sin(3y + 4z + \\omega t) (-4\\hat{j} + 3\\hat{k})$<br><br>Answer: The wave is travelling in $-\\dfrac{1}{5}(3\\hat{j} + 4\\hat{k})$ direction.; The value of $\\omega$ is $1.5 \\times 10^9$ rad s$^{-1}$.", "image": null}, "level": 2, "videoSolution": {"videoId": "5bfc722aac1943369b57dac5024faad1", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/GlTdQZVBeM6vv.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/GlTdQZVBeM6vv.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "previousYearPapers": [{"_id": "6a0be4ef402904185b819b42", "title": "JEE Advanced 2026 (Paper 1)", "shortName": "2026 (Paper 1)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a0be4ef402904185b819b42", "title": "JEE Advanced 2026 (Paper 1)", "shortName": "2026 (Paper 1)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}, "evalS mi>x</mi></msub><mo>=</mo><mo>-</mo><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>7</mn></mrow></msup><mi>sin</mi><mfenced open=\"[\" close=\"]\"><mrow><mn>2</mn><mi>&#960;</mi><mfenced><mrow><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mn>4</mn></msup><mi>t</mi><mo>-</mo><mfrac><msup><mn>10</mn><mn>7</mn></msup><mn>3</mn></mfrac><mi>z</mi></mrow></mfenced></mrow></mfenced><mi>Wb</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "1IJyr", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>B</mi><mi>y</mi></msub><mo>=</mo><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>7</mn></mrow></msup><mi>sin</mi><mfenced open=\"[\" close=\"]\"><mrow><mn>2</mn><mi>&#960;</mi><mfenced><mrow><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mn>14</mn></msup><mi>t</mi><mo>-</mo><mfrac><msup><mn>10</mn><mn>7</mn></msup><mn>3</mn></mfrac><mi>z</mi></mrow></mfenced></mrow></mfenced><mi>Wb</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "hrnTM", "text": "The wave is polarized in the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mi>y</mi></math>-plane with polarization angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>30</mn><mi mathvariant=\"normal\">o</mi></msup></math> with respect to the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>-axis", "image": null, "isCorrect": false}, {"id": "XEhRV", "text": "The refractive index of the medium is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>Speed of light in medium is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mfrac><mi>&#969;</mi><mi>k</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>v</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>&#960;</mi><mfenced><mrow><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mn>14</mn></msup></mrow></mfenced></mrow><mrow><mn>2</mn><mi>&#960;</mi><mo>&#215;</mo><mstyle displaystyle=\"true\"><mfrac><msup><mn>10</mn><mn>7</mn></msup><mn>3</mn></mfrac></mstyle></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>v</mi><mo>=</mo><mn>1</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mn>8</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p><p>Therefore, refractive index&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#956;</mi><mo>=</mo><mfrac><mi>c</mi><mi>v</mi></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn><mo>&#215;</mo><msup><mn>10</mn><mn>8</mn></msup></mrow><mrow><mn>1</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mn>8</mn></msup></mrow></mfrac><mo>=</mo><mn>2</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#956;</mi><mo>=</mo><mn>2</mn></math></p><p>Given&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>E</mi><mo>&#8594;</mo></mover><mo>=</mo><mn>30</mn><mfenced><mrow><mn>2</mn><mover><mi>x</mi><mo>&#8743;</mo></mover><mo>+</mo><mover><mi>y</mi><mo>&#8743;</mo></mover></mrow></mfenced><mi>sin</mi><mfenced><mrow><mn>2</mn><mi>&#960;</mi><mfenced><mrow><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mn>14</mn></msup><mi>t</mi><mo>-</mo><mfrac><msup><mn>10</mn><mn>7</mn></msup><mn>3</mn></mfrac><mi>z</mi></mrow></mfenced></mrow></mfenced><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/4b3c79c6-c994-4abf-b0c5-6210eaff8054.png\" style=\"width: 300px; height: 202px;\" /></p><p>The wave is polarised in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mi>y</mi><mo>-</mo></math>plane with polarisation angle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>tan</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced><mfrac><mn>1</mn><mn>2</mn></mfrac></mfenced></math>&nbsp;with respect to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>-</mo></math>axis.</p><p>Amplitude of magnetic field,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>B</mi><mn>0</mn></msub><mo>=</mo><mfrac><msub><mi>E</mi><mn>0</mn></msub><mi>V</mi></mfrac><mo>=</mo><mfrac><mrow><mn>30</mn><msqrt><msup><mn>2</mn><mn>2</mn></msup><mo>+</mo><msup><mn>1</mn><mn>2</mn></msup></msqrt></mrow><mrow><mn>1</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mn>8</mn></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>30</mn><msqrt><mn>5</mn></msqrt></mrow><mrow><mn>1</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mn>8</mn></msup></mrow></mfrac></math></p><p>Now, direction of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>B</mi><mo>&#8594;</mo></mover></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mover><mi>v</mi><mo>&#8594;</mo></mover><mo>&#215;</mo><mover><mi>E</mi><mo>&#8594;</mo></mover></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mover><mi>k</mi><mo>&#8743;</mo></mover><mo>&#215;</mo><mfrac><mfenced><mrow><mn>2</mn><mstyle displaystyle=\"true\"><mover><mi>i</mi><mo>&#8743;</mo></mover></mstyle><mo>+</mo><mstyle displaystyle=\"true\"><mover><mi>j</mi><mo>&#8743;</mo></mover></mstyle></mrow></mfenced><msqrt><mn>5</mn></msqrt></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced><mfrac><mrow><mo>-</mo><mover><mi>i</mi><mo>&#8743;</mo></mover><mo>+</mo><mn>2</mn><mover><mi>j</mi><mo>&#8743;</mo></mover></mrow><msqrt><mn>5</mn></msqrt></mfrac></mfenced></math>.</p><p>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>B</mi><mo>&#8594;</mo></mover><mo>=</mo><mfenced><mfrac><mrow><mo>-</mo><mover><mi>i</mi><mo>&#8743;</mo></mover><mo>+</mo><mn>2</mn><mover><mi>j</mi><mo>&#8743;</mo></mover></mrow><msqrt><mn>5</mn></msqrt></mfrac></mfenced><mo>&#215;</mo><mfrac><mrow><mn>30</mn><msqrt><mn>5</mn></msqrt></mrow><mrow><mn>1</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mn>8</mn></msup></mrow></mfrac><mi>sin</mi><mfenced close=\"]\" open=\"[\"><mrow><mn>2</mn><mi>&#960;</mi><mfenced><mrow><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mn>14</mn></msup><mi>t</mi><mo>-</mo><mfrac><msup><mn>10</mn><mn>7</mn></msup><mn>3</mn></mfrac><mi>z</mi></mrow></mfenced></mrow></mfenced><mo>&#160;</mo><mo>&#160;</mo><mi>Wb</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><mspace linebreak=\"newline\"></mspace><mo>=</mo><mfenced><mrow><mo>-</mo><mover><mi mathvariant=\"normal\">i</mi><mo>&#8743;</mo></mover><mo>+</mo><mn>2</mn><mover><mi mathvariant=\"normal\">j</mi><mo>&#8743;</mo></mover></mrow></mfenced><mo>&#215;</mo><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>7</mn></mrow></msup><mi>sin</mi><mfenced close=\"]\" open=\"[\"><mrow><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi><mfenced><mrow><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mn>14</mn></msup><mi mathvariant=\"normal\">t</mi><mo>-</mo><mfrac><msup><mn>10</mn><mn>7</mn></msup><mn>3</mn></mfrac><mi mathvariant=\"normal\">z</mi></mrow></mfenced></mrow></mfenced><mo>&#160;</mo><mo>&#160;</mo><mi>Wb</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math></p><p>Hence,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>B</mi><mi>x</mi></msub><mo>=</mo><mo>-</mo><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>7</mn></mrow></msup><mi>sin</mi><mfenced close=\"]\" open=\"[\"><mrow><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi><mfenced><mrow><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mn>14</mn></msup><mi mathvariant=\"normal\">t</mi><mo>-</mo><mfrac><msup><mn>10</mn><mn>7</mn></msup><mn>3</mn></mfrac><mi mathvariant=\"normal\">z</mi></mrow></mfenced></mrow></mfenced><mo>&#160;</mo><mi>Wb</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math></p><p>and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>B</mi><mi>y</mi></msub><mo>=</mo><mn>4</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>7</mn></mrow></msup><mi>sin</mi><mfenced close=\"]\" open=\"[\"><mrow><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi><mfenced><mrow><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mn>14</mn></msup><mi mathvariant=\"normal\">t</mi><mo>-</mo><mfrac><msup><mn>10</mn><mn>7</mn></msup><mn>3</mn></mfrac><mi mathvariant=\"normal\">z</mi></mrow></mfenced></mrow></mfenced><mo>&#160;</mo><mi>Wb</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math></p>", "image": null}, "videoSolution": {"videoId": "3840ad2f686e4737b4d0b3951c56dd36", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/9hZdjjszhIo1j.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/9hZdjjszhIo1j.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64b1672d25f94b8a85b91cda", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 2)", "title": "JEE Advanced 2023 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64b16ae5f23ac7d519f9b94a", "title": "X-Rays", "totalQuestions": 6, "questions": [{"_id": "66965dd4d603121f43a3fffc", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "66965789b31faf98fda8fefa", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2024-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Paper 2)", "title": "JEE Advanced 2024 (Paper 2)"}], "question": {"text": "A metal target with atomic number $Z=46$ is bombarded with a high energy electron beam. The emission of X-rays from the target is analyzed. The ratio $r$ of the wavelengths of the $K_\\alpha$-line and the cut-off is found to be $r=2$. If the same electron beam bombards another metal target with $Z=41$, the value of $r$ will be", "image": null}, "options": [{"id": "jtlkH", "text": "2.53", "image": null, "isCorrect": true}, {"id": "FRbCq", "text": "1.27", "image": null, "isCorrect": false}, {"id": "R9K77", "text": "2.24", "image": null, "isCorrect": false}, {"id": "JaF2q", "text": "1.58", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\(\\begin{aligned} & \\frac{1}{\\lambda_\\alpha}=\\frac{3}{4} R(Z-1)^2 p \\\\ & \\lambda_{\\text {cut }}=\\frac{h c}{e V} \\\\ & \\Rightarrow \\text { Ratio } \\propto \\frac{1}{(Z-1)^2} \\text { for same beam } \\\\ & \\frac{Z}{x}=\\frac{40^2}{45^2} \\\\ & \\Rightarrow x=\\frac{45^2}{40^2} .2 \\approx 2.53 \\end{aligned}\\)", "image": null}, "videoSolution": {"videoId": "5192b822246b416e9d3bea72ae0b2ee2", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/NUt6vSI3cCX1G.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/NUt6vSI3cCX1G.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "66965789b31faf98fda8fefa", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2024-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Paper 2)", "title": "JEE Advanced 2024 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a83f23ac7d519f9b515", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf831", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2020-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2020 (Paper 2)", "title": "JEE Advanced 2020 (Paper 2)"}], "type": "multipleCorrect", "level": 2, "question": {"text": "In an <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>X</mi></math>-ray tube, electrons emitted from a filament (cathode) carrying current <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi></math> hit a target (anode) at a distance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi></math> from the cathode. The target is kept at a potential&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi></math> higher than the cathode resulting in emission of continuous and characteristic X-rays. If the filament current&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi></math> is decreased to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>I</mi><mn>2</mn></mfrac><mo>,</mo></math> the potential difference&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi></math> is increased to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>V</mi><mo>,</mo></math> and the separation distance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi></math> is reduced to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>d</mi><mn>2</mn></mfrac><mo>,</mo></math> then", "image": null}, "options": [{"id": "G6Xy0", "text": "the cut-off wavelength will reduce to half, and the wavelengths of the characteristic X-rays will remain the same", "isCorrect": true, "image": null}, {"id": "gCExj", "text": "the cut-off wavelength as well as the wavelengths of the characteristic X-rays will remain the&nbsp;same", "isCorrect": false, "image": null}, {"id": "u1x0P", "text": "the cut-off wavelength will reduce to half, and the intensities of all the X-rays will decrease", "isCorrect": true, "image": null}, {"id": "V83Ez", "text": "the cut-off wavelength will become two times larger, and the intensity of all the X-rays will&nbsp;decrease", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Cut off wavelength <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#955;</mi><mi mathvariant=\"normal\">C</mi></msub><mo>&#8733;</mo><mfrac><mn>1</mn><mi mathvariant=\"normal\">V</mi></mfrac></math></p><p>So, cut-off wavelength becomes half.</p><p>Characteristic x-ray depends on target atomic number, so it remains same.</p><p>On decreasing filament current number of electron decrease, so intensity of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>X</mi></math> -ray decreases.</p>", "image": null}, "videoSolution": {"videoId": "6f6cf209463b4dd5af927ad09510bc24", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/jtSyAd2eaXv5q.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/jtSyAd2eaXv5q.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf831", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2020-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2020 (Paper 2)", "title": "JEE Advanced 2020 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a47f abusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c42", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 1)", "title": "JEE Advanced 2008 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169d1f23ac7d519f9aec1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1e77301f65c2f92c40", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 1)", "title": "JEE Advanced 2007 (Paper 1)"}], "question": {"text": "Statement I If the accelerating potential in an X-ray tube is increased, the wavelengths of the characteristic $X$-rays do not change.\nStatement II When an electron beam strikes the target in an X-ray tube, part of the kinetic energy is converted into X-ray energy.", "image": null}, "options": [{"id": "9XV09", "text": "\nStatement I is true, Statement II is true; Statement II is a correct explanation for Statement I\n", "image": null, "isCorrect": false}, {"id": "SLKWP", "text": "\nStatement I is true, Statement II is true; Statement II is NOT a correct explanation for Statement I\n", "image": null, "isCorrect": true}, {"id": "Vi60s", "text": "\nStatement I is true, Statement II is false\n", "image": null, "isCorrect": false}, {"id": "FPC5f", "text": "\nStatement I is false, Statement II is true", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Cut-off wavelength depends on the accelerating voltage, not the characteristic $\\mathrm{X}$-rays. Further approximately $2 \\%$ kinetic energy of the electrons is utilised in producing X-rays. Rest $98 \\%$ is lost in heat.\n$\\therefore$ Option (b) is correct.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1e77301f65c2f92c40", "examId":     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    if (!data.topics || data.topics.length === 0) {
      document.getElementById('current-topic-title').textContent = "No Questions Available";
      document.getElementById('current-topic-count').textContent = "0 Questions";
      document.getElementById('questions-list').innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted); font-size: 16px;">No previous year questions recorded for this chapter in this exam.</div>';
    } else {
      data.topics.forEach((t, i) => {
        const pill = document.createElement('div');
        pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
        pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
        pill.onclick = () => selectTopic(i);
        pillsContainer.appendChild(pill);
      });
    }

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Advanced';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => { if (data.topics && data.topics.length > 0) selectTopic(0); });
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      if (data.topics && data.topics.length > 0) selectTopic(0);
    }
  </script>
</body>
</html>
