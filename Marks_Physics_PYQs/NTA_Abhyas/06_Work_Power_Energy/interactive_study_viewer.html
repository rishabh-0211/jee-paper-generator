  <script>
    const data = {"index": 6, "chapterId": "616023bef4c3ea68d46811e1", "chapter": "Work Power Energy", "exam": "NTA Abhyas (JEE Main)", "subject": "Physics", "totalTopics": 4, "totalQuestions": 123, "downloadTime": "2026-10-08 20:31:46", "topics": [{"index": 1, "topicId": "6aa3ab79aa8dc1ff681780c4", "title": "Work Done", "totalQuestions": 34, "questions": [{"_id": "6151e863fa217f2902401cb9", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "109", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform chain of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math> and mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> is lying on a smooth table and one-third of its length is hanging vertically down over the edge of the table. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi></math> is the acceleration due to gravity, the work required to pull the hanging part on to the table is", "image": null}, "options": [{"id": "HhBpH", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><mi>g</mi><mi>L</mi></math>", "image": null, "isCorrect": false}, {"id": "r1Pm8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>M</mi><mi>g</mi><mi>L</mi></mrow><mn>3</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "prsfn", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>M</mi><mi>g</mi><mi>L</mi></mrow><mn>9</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "OEbbU", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>M</mi><mi>g</mi><mi>L</mi></mrow><mn>18</mn></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Mass of hanging portion is <math><mfrac><mrow><mi mathvariant=\"normal\">M</mi></mrow><mrow><mn>3</mn></mrow></mfrac></math> <math><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><mn>6</mn></mrow></mfrac></math> below the table top.<br /><br />Therefore, the required work done is,<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image7-a68fc384-bc8a-4ef3-a5b3-0711c1829843.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"height: 143px; width: 290px;\" /><br /><br /><math><mi mathvariant=\"normal\">W</mi><mo>=</mo><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">M</mi></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></mfenced><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><mn>6</mn></mrow></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">L</mi></mrow><mrow><mn>18</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863eac2563f048f58e3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "76", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "&nbsp;A block of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> is connected rigidly with a smooth wedge (plank) by a light spring of stiffness <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi></math>. If the wedge is moved with constant velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>0</mn></msub></math>, then find the work done by the external agent until the maximum compression of the spring.<br />\r<br />\r<img alt=\"\" height=\"128\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014759_Question_1.jpg\" style=\"max-width:100%; object-fit:contain\" width=\"196\" />", "image": null}, "options": [{"id": "yd1Si", "text": "<math> <mrow> <mi>m</mi><mo>⁡</mo><msubsup><mrow><mi>v</mi><mo>⁡</mo> </mrow> <mn>0</mn> <mn>2</mn> </msubsup> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "7f7KF", "text": "<math><mrow><mn>2</mn>  <mi>m</mi><mo>&ApplyFunction;</mo>  <msubsup>        <mrow>          <mi>v</mi><mo>&ApplyFunction;</mo>        </mrow>        <mn>0</mn>        <mn>2</mn>  </msubsup></mrow></math>", "image": null, "isCorrect": false}, {"id": "btYxe", "text": "<math> <mrow><mn>3</mn> <mi>m</mi><mo>⁡</mo> <msubsup> <mrow> <mi>v</mi><mo>⁡</mo> </mrow> <mn>0</mn> <mn>2</mn> </msubsup> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "tFV1a", "text": "<math> <mrow><mn>2</mn> <mi>m</mi><mo>⁡</mo> <msubsup> <mrow> <mi>v</mi><mo>⁡</mo> </mrow> <mn>0</mn> <mn>3</mn> </msubsup> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let us take wedge + spring + block as a system. The forces responsible for performing work are spring force kx (←) and the external force F(→).<br /><br /><img alt=\"\" height=\"110\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014759_AnsExp_1.jpg\" style=\"max-width:100%; object-fit:contain\" width=\"242\" /><br /><br />Work Energy theorem for block + spring + plank relative to ground :<br /><br />Applying work-energy theorem, we have W<sub>ext</sub> + W<sub>sp</sub> = ΔK<br /><br />where W<sub>sp</sub> the total work done by the spring on wedge and block <math> <mrow> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>k</mtext> <msup> <mi>x</mi> <mn>2</mn> </msup> </mrow> </math> and ΔK = change in KE of the block (because the plank does not change its kinetic energy)<br /><br /><math> <mrow> <mtext>Then,</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <msub> <mtext>W</mtext> <mtext>ext</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>k</mtext> <msup> <mi>x</mi> <mn>2</mn> </msup> <mo>+</mo> <mtext>Δ</mtext> <mtext>K</mtext> </mrow> </math><br /><br />As the block was initially stationary and it will acquire a velocity v<sub>0</sub> equal to that of the plank at the time of maximum compression of the spring, the change in kinetic energy of the block relative to ground is<br /><br /><math> <mrow> <mtext>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Δ</mtext> <mtext>K</mtext> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mi>m</mi><mo>⁡</mo> <msubsup> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi>v</mi><mo>⁡</mo> </mrow> <mn>0</mn> <mn>2</mn> </msubsup> </mrow> </math><br /><br />Substituting ΔK in the above equation, we have<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <msub> <mtext>W</mtext> <mtext>ext</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>K</mtext> <msup> <mi>x</mi> <mn>2</mn> </msup> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mi>m</mi><mo>⁡</mo> <msubsup> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi>v</mi><mo>⁡</mo> </mrow> <mn>0</mn> <mn>2</mn> </msubsup> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>...(i)</mtext> </mrow> </math><br /><br />Work Energy theorem for block + spring + plank&nbsp; relative to the plank W<sub>ext</sub> + W<sub>sp</sub> = ΔK The plank moves with constant velocity, there is no pseudo-force acting on the block. W<sub>ext</sub>&nbsp;= 0&nbsp;Then the net work done on the system (block + plank), due to the spring, can be given as<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <msub> <mtext>W</mtext> <mtext>SP</mtext> </msub> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>k</mtext> <msup> <mi>x</mi> <mn>2</mn> </msup> </mrow> </math><br /><br />As the relative velocity between the observer (plank) and block decreases from v<sub>0</sub> to zero at the time of maximum compression of the spring, the change in kinetic energy of the block is <math> <mrow> <mtext>Δ</mtext> <mtext>K</mtext> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mi>m</mi><mo>⁡</mo> <msubsup> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi>v</mi><mo>⁡</mo> </mrow> <mn>0</mn> <mn>2</mn> </msubsup> <mtext>.</mtext> </mrow> </math><br /><br />Substituting W<span style=\"font-size: 10.8333px;\"><sub>sp &nbsp;</sub>&nbsp;<span style=\"font-size:12px;\">and</span>&nbsp;&nbsp;</span><math><mover accent=\"false\"><mrow><mo>△</mo><mi>K</mi></mrow></mover></math> in above equation&nbsp;<br />&nbsp;-<math><mrow><mfrac><mrow><mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mi></mi><mi></mi><mi></mi><mi></mi><mi>k</mi><mo>⁡</mo> <msup> <mi>x</mi> <mn>2</mn> </msup> <mo>=</mo>&nbsp;<mtext>-</mtext><mfrac><mrow><mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mi>m</mi><mo>⁡</mo> <msubsup> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi>v</mi><mo>⁡</mo> </mrow> <mn>0</mn> <mn>2</mn>&nbsp;</msubsup></mrow></math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(ii)<br /><br />From (i) &amp; (ii)<br /><math><mrow><msub><mtext>W</mtext> <mtext>ext</mtext> </msub>&nbsp;</mrow></math><math><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><msubsup><mrow><mi>m</mi><mi>v</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><msubsup><mrow><mi>m</mi><mi>v</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>=</mo><msubsup><mrow><mi>m</mi><mi>v</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e83826f6f99f7859", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "12", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A block of mass <math><mi mathvariant=\"normal\">m</mi></math> is stationary with respect to the wedge of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi></math> moving with uniform speed <math><mi mathvariant=\"normal\">v</mi></math> on horizontal surface. Work done by friction force on the block in <math><mi mathvariant=\"normal\">t</mi></math> seconds is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/76214q.png\" style=\"width: 229px; height: 198px;\" />", "image": null}, "options": [{"id": "uEJhe", "text": "zero", "image": null, "isCorrect": false}, {"id": "40J0l", "text": "<math><mo>–</mo><mfrac><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">t</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">&nbsp;</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mn>2</mn><mi mathvariant=\"normal\">θ</mi></mrow></mrow></math>", "image": null, "isCorrect": true}, {"id": "oCioh", "text": "<math><mo>–</mo><mi mathvariant=\"normal\"> </mi><mfrac><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">t</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "tH8wM", "text": "<math><mo>–</mo><mfrac><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">t</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">&nbsp;</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/54536.png\" style=\"width: 380px; height: 219px;\" /><br />Since block doesn't move with respect towedge, so friction force should balance the component of weight along the inclined plane.<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mo>=</mo><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi>sin</mi><mo>⁡</mo><mi mathvariant=\"normal\">θ</mi></math><br /><br />Component of displacement along the inclined plane in time&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi></math>&nbsp;is given by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mi>t</mi><mi>cos</mi><mfenced><mi>θ</mi></mfenced></math><br />Work done by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">f</mi><mo>=</mo><mo>–</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi>sin</mi><mo>⁡</mo><mi mathvariant=\"normal\">θ</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi>cos</mi><mo>⁡</mo><mi mathvariant=\"normal\">θ</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">t</mi></math><br /><br /><math><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><mo>–</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">&nbsp;</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mn>2</mn><mi mathvariant=\"normal\">θ</mi></mrow></mrow></mrow><mrow><mn>2</mn></mrow></mfrac><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>×</mo><mi mathvariant=\"normal\">t</mi></mrow></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e63ade483eae614c", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "59", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "As shown in the figure, a chain of mass <math><mi>m</mi></math> is placed on a smooth quarter circular portion of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math>. End <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A&nbsp;</mi></math>is tied with a wedge while the remaining chain is free, then the minimum work required to be done by the external agent to make the chain horizontal keeping point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;fixed, is<br />\r&nbsp; <img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/32472q.png\" style=\"width: 192px; height: 178px;\" />", "image": null}, "options": [{"id": "MKXj2", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mtext>gR</mtext></math>", "image": null, "isCorrect": false}, {"id": "7mOdy", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mtext>g</mtext><mfrac><mrow><mn>2</mn><mtext>R</mtext></mrow><mi>π</mi></mfrac></math>", "image": null, "isCorrect": true}, {"id": "exgeg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mtext>g</mtext><msqrt><mn>2</mn></msqrt><mfrac><mrow><mn>2</mn><mtext>R</mtext></mrow><mi>&#x3C0;</mi></mfrac></math>", "image": null, "isCorrect": false}, {"id": "1M7JA", "text": "None", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Center of mass of the chain is at <math> <mrow> <mfrac> <mrow> <mn>2</mn><mi>R</mi></mrow> <mi>π</mi> </mfrac> </mrow> </math> from horizontal<br /><br />As shown in figure .......<br /><br />Height gain by center of mass is <math> <mrow> <mfrac> <mrow> <mn>2</mn> <mtext>R</mtext> </mrow> <mrow> <mi>π</mi> </mrow> </mfrac> </mrow> </math><br /><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0032472_Ans.jpg\" style=\"width: 223px; height: 99px;\" /><br /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>Wg</mtext><mo>=</mo><mo>-</mo><mi>m</mi><mtext>g</mtext><mfenced><mfrac><mrow><mn>2</mn><mtext>R</mtext></mrow><mi>π</mi></mfrac></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext>W</mtext><mtext>ext.</mtext></msub><mo>=</mo><mo>-</mo><mtext>Wg</mtext><mo>=</mo><mfenced><mrow><mi>m</mi><mtext>g</mtext><mfrac><mrow><mn>2</mn><mtext>R</mtext></mrow><mi>π</mi></mfrac></mrow></mfenced></math><br /><br />&nbsp;&nbsp;<strong>Alternate solution</strong><br /><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/32472q.png\" style=\"width: 192px; height: 178px;\" /><br /><br /><br /><math> <mrow> <msub> <mtext>U</mtext> <mtext>i</mtext> </msub><mo>=</mo> <mo>∫</mo> <mo>-</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>dm</mtext> </mrow> </mfenced> <mtext>gy</mtext> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mtext>g</mtext><mo>∫</mo><mtext>R cos</mtext><mi>θ</mi><mfenced><mfrac><mi>m</mi><mfrac><mi>π</mi><mn>2</mn></mfrac></mfrac></mfenced><mtext>d</mtext><mi>θ</mi></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mfrac><mrow><mn>2</mn><mtext>Rg</mtext><mi>m</mi></mrow><mi>π</mi></mfrac><munderover><mo>∫</mo><mn>0</mn><mfrac><mi>π</mi><mn>2</mn></mfrac></munderover><mo>cos</mo><mi>θ</mi><mtext>d</mtext><mi>θ</mi></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mfrac><mrow><mn>2</mn><mtext>Rg</mtext><mi>m</mi></mrow><mi>π</mi></mfrac><mo>[</mo><mtext>sin</mtext><mi>θ</mi><msubsup><mo>]</mo><mn>0</mn><mrow><mi>π</mi><mo>/</mo><mn>2</mn></mrow></msubsup></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mfrac><mrow><mn>2</mn><mi>m</mi><mtext>gR</mtext></mrow><mi>π</mi></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext>U</mtext><mtext>f</mtext></msub><mo>=</mo><mn>0</mn><mo>⇒</mo><mo>Δ</mo><mtext>U</mtext><mo>=</mo><msub><mtext>w</mtext><mtext>ext</mtext></msub><mo>=</mo><mfrac><mrow><mn>2</mn><mi>m</mi><mtext>gR</mtext></mrow><mi>π</mi></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e3fb30b12b1ab6c0", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "69", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mn>1</mn></msub></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mn>2</mn></msub></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mn>3</mn></msub></math>&nbsp;represent the work done in moving a particle from&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> along three different paths <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math> respectively (as shown) in the gravitational field of a point mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>. Find the correct relation between <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mn>1</mn></msub></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mn>2</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mn>3</mn></msub></math>.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0007534_Ques1_1.jpg\" />", "image": null}, "options": [{"id": "8TYpv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mn>1</mn></msub><mo>&#62;</mo><msub><mi>W</mi><mn>2</mn></msub><mo>&#62;</mo><msub><mi>W</mi><mn>3</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "bnQQr", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mn>1</mn></msub><mo>=</mo><msub><mi>W</mi><mn>2</mn></msub><mo>=</mo><msub><mi>W</mi><mn>3</mn></msub></math>", "image": null, "isCorrect": true}, {"id": "8h1Wz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mn>1</mn></msub><mo>&#60;</mo><msub><mi>W</mi><mn>2</mn></msub><mo>&#60;</mo><msub><mi>W</mi><mn>3</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "OJYZb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mn>2</mn></msub><mo>&#62;</mo><msub><mi>W</mi><mn>1</mn></msub><mo>&#62;</mo><msub><mi>W</mi><mn>3</mn></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Gravitational field is a conservative force field. In a conservative force field work done is path independent", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e21b64314a271bb8", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "05", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>&nbsp;</mo><mi>kg</mi></math> metal block of dimensions <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>16</mn><mo>&nbsp;</mo><mi>cm</mi><mo>×</mo><mn>8</mn><mo>&nbsp;</mo><mi>cm</mi><mo>×</mo><mn>6</mn><mo>&nbsp;</mo><mi>cm</mi></math> is lying on a table with its face of largest area touching the table. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mo>=</mo><mn>10</mn><mo>&nbsp;</mo><msup><mi>ms</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>, then the minimum amount of work done in making it stand with its length vertical is", "image": null}, "options": [{"id": "EoQ5h", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "ktwgB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>.</mo><mn>4</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "mVxPa", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": true}, {"id": "7fwrM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>.</mo><mn>8</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When face of the largest area is touching the table, height of centre of gravity above the table <math> <mrow> <msub> <mrow> <mi></mi><mi>h</mi><mo>⁡</mo> </mrow> <mn>1</mn> </msub> <mo>=</mo> <mfrac> <mrow> <mn>6</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>=</mo> <mn>3</mn> <mspace width=\"0.5em\"></mspace> <mtext>cm</mtext> </mrow> </math><br /><br />With its length vertical, height of centre of gravity would become <math> <mrow> <msub> <mrow> <mi></mi><mi>h</mi><mo>⁡</mo> </mrow> <mn>2</mn> </msub> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>6</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>=</mo> <mn>8</mn> <mspace width=\"0.5em\"></mspace> <mtext>cm</mtext> </mrow> </math><br /><br />Minimum work required W = (P.E.)<sub>2</sub> – (P.E.)<sub>1</sub><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp; &nbsp;&nbsp; &nbsp; &nbsp; = mg(h<sub>2</sub> – h<sub>1</sub>)<br /><br /><math> <mrow> <mi></mi><mi>W</mi><mo>⁡</mo> <mo>=</mo> <mfrac> <mrow> <mn>8</mn> <mo>×</mo> <mn>1</mn> <mn>0</mn> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>8</mn> <mo>-</mo> <mn>3</mn> </mrow> </mfenced> </mrow> <mrow> <mn>1</mn> <mn>0</mn> <mn>0</mn> </mrow> </mfrac> <mo>=</mo> <mn>4</mn> <mspace width=\"0.5em\"></mspace> <mtext>J</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e120762d15e96369", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "100", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An observer and a vehicle, both start moving together from rest (towards the right) with acceleration <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>, respectively. There is a <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi>kg</mi></math> block on the floor of the vehicle and coefficient of friction is <math> <mrow> <mi>μ</mi> <mo>=</mo> <mtext>0.</mtext> <mn>3</mn> </mrow> </math>&nbsp;between their surface. Then the work done by the frictional force on the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi>kg</mi></math> block observed by the running observer, during the first <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo></math>seconds of the motion&nbsp;<br />\r<br />\r<b><u><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0026900_Question.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 350px; height: 121px;\" /></u></b>", "image": null}, "options": [{"id": "DdJfP", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>24</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 120px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "Z8VzL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>-24</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": true}, {"id": "tn9QF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>16</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 71px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "ABSpZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>-16</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext>f</mtext><mtext>limiting</mtext></msub><mo>=</mo><mi>&#956;</mi><mtext>&#160;mg</mtext><mo>=</mo><mn>0</mn><mtext>.</mtext><mn>3</mn><mo>&#215;</mo><mn>2</mn><mo>&#215;</mo><mn>1</mn><mn>0</mn><mo>=</mo><mn>6</mn><mo>&#160;</mo><mtext>N</mtext></math><br /><br />Force needed for acc. of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><mi>m</mi><mi>a</mi><mo>=</mo><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi></math><br /><br />So friction force static, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">f</mi><mo>=</mo><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi></math><br /><br />Displacement w.r.t. observer in t = 2 sec. is<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>S</mtext><mo>=</mo><msub><mtext>u</mtext><mtext>rel</mtext></msub><mtext>t</mtext><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msub><mtext>a</mtext><mtext>rel</mtext></msub><msup><mtext>t</mtext><mn>2</mn></msup><mo>=</mo><mn>0</mn><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mrow><mo>-</mo><mn>3</mn></mrow></mfenced><mo>&#215;</mo><mn>4</mn><mo>=</mo><mo>-</mo><mn>6</mn><mo>&#160;</mo><mtext>m</mtext></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>W</mtext><mo>=</mo><mover><mtext>f</mtext><mo>&#8594;</mo></mover><mtext>.</mtext><mover><mtext>S</mtext><mo>&#8594;</mo></mover><mo>=</mo><mn>4</mn><mfenced><mrow><mo>-</mo><mn>6</mn></mrow></mfenced><mo>=</mo><mo>-</mo><mn>2</mn><mn>4</mn><mo>&#160;</mo><mtext>J</mtext></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863dd2426682da912f2", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "72", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A particle of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> moves along the quarter section of the circular path whose centre is at the origin. The radius of the circular path is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math>. A force <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>F</mi><mo>→</mo></mover><mo>=</mo><mi>y</mi><mover><mi mathvariant=\"normal\">i</mi><mo>^</mo></mover><mo>-</mo><mi>x</mi><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover></math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">N</mi></math> acts on the particle, where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>,</mo><mi>y</mi></math> denote the coordinates of the position of the particle. Calculate the work done by this force in taking the particle from point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>(</mo><mi mathvariant=\"normal\">a</mi><mo>,</mo><mo>&nbsp;</mo><mn>0</mn><mo>)</mo></math> to point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo>(</mo><mn>0</mn><mo>,</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">a</mi><mo>)</mo></math> along the circular path.<br />\r<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image12-5456f7ad-bf7d-44a8-873a-f42e691e1f58.jpg\" />", "image": null}, "options": [{"id": "dIXdK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>&#960;a</mi><mn>2</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "2WjnG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>&#960;a</mi><mn>2</mn></msup><mn>2</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "lbGdP", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mfrac><msup><mi>πa</mi><mn>2</mn></msup><mn>2</mn></mfrac><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": true}, {"id": "oxxXN", "text": "Zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Work done by force F;<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>w</mi><mo>=</mo><mo>&#8747;</mo><mover><mi>F</mi><mo>&#8594;</mo></mover><mo>.</mo><mi>d</mi><mi>r</mi><mo>=</mo><mo>&#8747;</mo><mrow><mfenced separators=\"|\"><mrow><mi>y</mi><mover><mi mathvariant=\"normal\">i</mi><mo>^</mo></mover><mo>-</mo><mi>x</mi><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover></mrow></mfenced><mo>.</mo><mo>(</mo></mrow><mi mathvariant=\"normal\">d</mi><mi>x</mi><mover><mi mathvariant=\"normal\">i</mi><mo>^</mo></mover><mo>+</mo><mi mathvariant=\"normal\">d</mi><mi>y</mi><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover><mo>)</mo><mi>&#160;</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>&#8747;</mo><mfenced separators=\"|\"><mrow><mi>y</mi><mi mathvariant=\"normal\">d</mi><mi>x</mi><mo>-</mo><mi>x</mi><mi mathvariant=\"normal\">d</mi><mi>y</mi></mrow></mfenced></math><br /><br /><math><mo>&#8757;</mo><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br /><math><mo>&#8756;</mo><mi>x</mi><mi>d</mi><mi>x</mi><mo>+</mo><mi>y</mi><mi>d</mi><mi>y</mi><mo>=</mo><mn>0</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>W</mi><mo>=</mo><mo>&#8747;</mo><mfenced><mrow><mi>y</mi><mfenced separators=\"|\"><mfrac><mrow><mo>-</mo><mi>y</mi><mi>d</mi><mi>y</mi></mrow><mi>x</mi></mfrac></mfenced><mo>-</mo><mi>x</mi><mi>d</mi><mi>y</mi></mrow></mfenced><mo>=</mo><mo>-</mo><mo>&#8747;</mo><mfrac><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</m 020-05-25T09:00:00.000Z"}], "question": {"text": "The displacement of an object of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&nbsp;</mo><mi>kg</mi></math>&nbsp;is&nbsp;given by the relation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><msup><mi>t</mi><mn>2</mn></msup></math> , where <math><mi mathvariant=\"normal\">t</mi></math> is time in seconds. If the work done by the net force on the object in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">s</mi></math>&nbsp;is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>p</mi><mi>q</mi></mfrac><mo>&nbsp;</mo><mi>joule</mi></math>, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi></math>&nbsp;are smallest integer values, then what is the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>+</mo><mi>q</mi></math>?", "image": null}, "options": [], "correctValue": "11", "solution": {"text": "<math><mi>S</mi><mo>=</mo><mfrac><mrow><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>3</mn></mrow></mfrac></math><br /><br /><math><mi>v</mi><mo>=</mo><mfrac><mrow><mi>d</mi><mi>S</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math><br /><br /><math><mfrac><mrow><mi>d</mi><mi>S</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi>t</mi><mo>=</mo><mi>v</mi><mo>;</mo><mi>&nbsp;</mi></math><br /><mi><br /><math><mi>W</mi><mo>=</mo><mo>∆</mo><mi mathvariant=\"normal\">K</mi><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mi mathvariant=\"normal\">t</mi><mo>=</mo><mn>2</mn></mrow></msub><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mi mathvariant=\"normal\">t=0</mi></mrow></msub></math><br /><br /><math><mo>W=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>m</mi><mfenced separators=\"|\"><mrow><msubsup><mrow><mi>v</mi></mrow><mrow><mi>t</mi><mo>=</mo><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>-</mo><msubsup><mrow><mi>v</mi></mrow><mrow><mi>t</mi><mo>=</mo><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>⋅</mo><mn>3</mn><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>16</mn></mrow><mrow><mn>9</mn></mrow></mfrac><mo>-</mo><mn>0</mn></mrow></mfenced><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><mrow><mrow><mn>8</mn></mrow><mo>/</mo><mrow><mn>3&nbsp;</mn></mrow></mrow><mi mathvariant=\"normal\">J</mi></math><br/><br/><math><mo>⇒</mo><mi> </mi><mi> </mi><mi>p</mi><mo>+</mo><mi>q</mi><mo>=</mo><mn>11</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638a22dbef5b07ca39", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "49", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Initially, a block of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> is at rest on a frictionless floor and the spring is in a relaxed condition. One end of the spring is rigidly attached to the block and the other end is fixed to a wall. A constant force is applied on the block as shown in the figure. The maximum velocity of the block is<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/efdooidtexniibankgzlhsmrlcibmzycpuatjzshkzurthxzty.png\" />", "image": null}, "options": [{"id": "JfCJR", "text": "<math xmlns=\"http://www.w3.o bsup><mi>v</mi><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">x</mi></mrow><mn>2</mn></msubsup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">x</mi></mrow></msub><mo>=</mo><msqrt><mfrac><mi>F</mi><mrow><mi>m</mi><mi>K</mi></mrow></mfrac></msqrt></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637f8f4b9f049bbcf4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "29", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A block of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi><mo>=</mo><mn>0</mn><mo>.1</mo><mo>&nbsp;</mo><mi>kg</mi></math> is released from a height of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> on a curved smooth surface. On the horizontal surface, path <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math> is smooth and path <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BC</mi></math>&nbsp;is rough with a coefficient of friction <math><mi>μ</mi><mo>=</mo><mn>0.1</mn></math>. If the impact of the block with the vertical wall at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math>&nbsp;is perfectly elastic, the total distance covered by the block on the horizontal surface before coming to rest will be (take <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">g</mi><mo>=</mo><mn>10</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>)<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/348114.JPG\" style=\"width: 250px; height: 116px;\" />", "image": null}, "options": [{"id": "RDJJ2", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>29</mn><mi mathvariant=\"normal\">&#xA0;</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "eKj4g", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>49</mn><mi mathvariant=\"normal\">&#xA0;</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "bAhwr", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>59</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": true}, {"id": "82XJe", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>109</mn><mi mathvariant=\"normal\">&#xA0;</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Total <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>KE</mi></math> dissipated against friction <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>mgh</mi><mo>=</mo><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math><br /><br />Work done against friction in one trip across <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BC</mi><mo>=</mo><mi>mg&#956;</mi><mo>&#215;</mo><mn>2</mn><mo>=</mo><mn>0</mn><mo>.2</mo><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math><br /><br /><math><mo>&#8756;</mo></math> Total number of trips across <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BC</mi><mo>=</mo><mfrac><mn>4</mn><mtext>0.2</mtext></mfrac><mo>=</mo><mn>20</mn></math><br /><br /><math><mo>&#8756;</mo></math> Total distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>20</mn><mo>&#215;</mo><mi>BC</mi><mo>+</mo><mn>19</mn><mo>&#215;</mo><mi>AB</mi><mo>=</mo><mn>59</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86376b36ae960e7dc94", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "52", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A <math><mn>0.5</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi></math> block slides from <math><mi>A</mi></math> on horizontal track with an initial speed of <math><mn>3</mn><mi mathvariant=\"normal\">&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">m&nbsp;</mi><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>–</mo><mn>1</mn></mrow></msup></math> towards a weightless horizontal spring of length <math><mn>1&nbsp;</mn><mi mathvariant=\"normal\">m</mi></math> and force constant <math><mn>2</mn><mi mathvariant=\"normal\">&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">N&nbsp;</mi><mi mathvariant=\"normal\">m</mi></mrow><mrow><mo>–</mo><mn>1</mn></mrow></msup></math>. The part <math><mi>A</mi><mi>B</mi></math> of the track is frictionless and the part <math><mi>B</mi><mi>C</mi></math> has the coefficient of static and kinetic friction as <math><mn>0.22</mn></math> and <math><mn>0.20</mn></math> respectively. If the distance <math><mi>A</mi><mi>B</mi></math> and <math><mi>B</mi><mi>D</mi></math> are <math><mn>2</mn><mi mathvariant=\"normal\">&nbsp;m</mi></math> and <math><mn>2.14 m&nbsp;</mn></math>respectively, the total distance through which the block moves before it comes to rest completely is -<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/71827q.png\" style=\"width: 285px; height: 97px;\" />", "image": null}, "options": [{"id": "uiQCW", "text": "<math><mn>2.5</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "pjyvG", "text": "<math><mn>4.42</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "dKcZG", "text": "<math><mn>4.24</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": true}, {"id": "r3Fsk", "text": "<math><mn>2.44</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "At <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">D</mi><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi><mi mathvariant=\"normal\">E</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi mathvariant=\"normal\">&#160;</mi><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup><mi mathvariant=\"normal\">&#160;</mi><mo>&#8211;</mo><mi mathvariant=\"normal\">&#160;</mi><msub><mi>&#956;</mi><mi mathvariant=\"normal\">k</mi></msub><mi>m</mi><mi>g</mi><mi mathvariant=\"normal\">&#160;</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">D</mi></mrow></mfenced></math><br /><br /><math><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">&#160;</mi><mo>&#215;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>0.5</mn><mi mathvariant=\"normal\">&#160;</mi><mo>&#215;</mo><mi mathvariant=\"normal\">&#160;</mi><msup><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></msup><mi mathvariant=\"normal\">&#160;</mi><mo>&#8211;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>0.2</mn><mi mathvariant=\"normal\">&#160;</mi><mo>&#215;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>0.5</mn><mi mathvariant=\"normal\">&#160;</mi><mo>&#215;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>10</mn><mi mathvariant=\"normal\">&#160;</mi><mo>&#215;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>2.14</mn></math><br /><br /><math><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mn>2.25</mn><mi mathvariant=\"normal\">&#160;</mi><mo>&#8211;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>2.14</mn><mo>=</mo><mn>0.11</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">J</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0.11</mn><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>&#160;</mi><mi>k</mi><msup><mi>x</mi><mn>2</mn></msup><mi mathvariant=\"normal\">&#160;</mi><mo>+</mo><mi>&#160;</mi><msub><mi>&#956;</mi><mi mathvariant=\"normal\">R</mi></msub><mi>m</mi><mi>g</mi><mi>x</mi><mo>&#8658;</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>x</mi><mo>&#8211;</mo><mn>0.11</mn><mo>=</mo><mn>0</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mn>0.1</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">m</mi></math><br /><br /><math><mi mathvariant=\"normal\">T</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">d</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#160;</mi><mo>+</mo><mi mathvariant=\"normal\">&#160;</mi><mn>2.14</mn><mi mathvariant=\"normal\">&#160;</mi><mo>+</mo><mi mathvariant=\"normal\">&#160;</mi><mn>0.1</mn><mi mathvariant=\"normal\">&#160;</mi><mo>=</mo><mn>4.24</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86373969913a521fa64", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "66", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A man is holding a chain of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>&nbsp;and length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi></math>&nbsp;such that the lower end of the chain just touches a table. Now the man places half the length of the chain very slowly on the table while keeping the other half vertical. The work done by the man in this process is", "image": null}, "options": [{"id": "H1XgQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8211;</mo><mfrac><mrow><mi>m</mi><mi>g</mi><mi>l</mi></mrow><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "081sN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8211;</mo><mfrac><mrow><mi>m</mi><mi>g</mi><mi>l</mi></mrow><mn>4</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "qWYTl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8211;</mo><mn>3</mn><mfrac><mrow><mi>m</mi><mi>g</mi><mi>l</mi></mrow><mn>8</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "Fx3uz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8211;</mo><mi mathvariant=\"normal\">&#160;</mi><mfrac><mrow><mi>m</mi><mi>g</mi><mi>l</mi></mrow><mn>8</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The work done by man is negative of magnitude of decrease in potential energy of chain.<br /><br /><br /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image1-5230aec2-2e12-41bd-8861-89bc53f01816.jpg\" /><br /><br /><br /><br /><math><mi mathvariant=\"normal\">Δ</mi><mi mathvariant=\"normal\">U</mi><mo>=</mo><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">&nbsp;</mi><mo>–</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><mn>4</mn></mrow></mfrac><mo>=</mo><mn>3</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><mn>8</mn></mrow></mfrac></math><br /><br /><math><mo>∴</mo><mi mathvariant=\"normal\">W</mi><mo>=</mo><mo>–</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><mn>3</mn><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"script\">l</mi></mrow><mrow><mn>8</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86372b8094e22943edb", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "06", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The velocity-time graph of a particle of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi>kg</mi></math> is shown in the figure. The net work done on the particle in the first two seconds of the motion is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-05-24_at_8.22.59_PM.jpeg\" style=\"width: 250px; height: 179px;\" />", "image": null}, "options": [{"id": "bsMOn", "text": "<math><mo>-</mo><mn>9300</mn><mi>&nbsp;</mi><mtext>J</mtext></math>", "image": null, "isCorrect": false}, {"id": "gaBLx", "text": "<math><mn>12000</mn><mi> </mi><mtext>J</mtext></math>", "image": null, "isCorrect": false}, {"id": "oaM3q", "text": "<math><mo>-</mo><mn>4500</mn><mi>&nbsp;</mi><mtext>J</mtext></math>", "image": null, "isCorrect": true}, {"id": "fV2Hz", "text": "<math><mo>-</mo><mn>12000</mn><mi> </mi><mtext>J</mtext></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi>v</mi><mo>=</mo><mo>-</mo><mn>5</mn><mi>t</mi><mo>+</mo><mn>50</mn></math><br /><br /><math><msub><mrow><mi>v</mi></mrow><mrow><mi>a</mi><mi>t</mi><mi>&nbsp;</mi><mi>t</mi><mo>=</mo><mn>2</mn></mrow></msub><mo>=</mo><mn>40</mn></math><br /><br /><math><mo>∆</mo><mi>&nbsp;</mi><mi>K</mi><mo>.</mo><mi>E</mi><mo>.</mo><mo>=</mo><mi>W</mi><mo>.</mo><mi>D</mi><mo>.</mo><mi>&nbsp;</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mfenced separators=\"|\"><mrow><msup><mrow><mn>40</mn></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mn>50</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced><mo>×</mo><mn>10</mn></math><br /><br /><math><mo>=</mo><mo>-</mo><mn>4500</mn></math>&nbsp;<mtext>J</mtext>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636e12da6470443f10", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "47", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A bucket full of water weighs <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&nbsp;</mo><mi>kg</mi></math>, it is pulled from a well <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> deep. There is a small hole in the bucket through which water leaks at a constant rate. If it is observed that for every metre the bucket loses&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.2</mo><mo>&nbsp;</mo><mi>kg</mi></math>&nbsp;mass of water, then the total work done in pulling the bucket up from the well is [<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mo>=</mo><mn>10</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>]", "image": null}, "options": [{"id": "eWZCo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>600</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": true}, {"id": "xyIRG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>400</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "e5CjL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "xveEi", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>500</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The weight of bucket when it has been pulled up a distance <math><mi>x</mi><mi>&nbsp;</mi><mi>i</mi><mi>s</mi><mi>&nbsp;</mi></math>(5-0.2<math><mi>x</mi><mo>)</mo><mo>.</mo></math><br /><br />Hence, the required work is<br /><br /><math><mi>W</mi><mo>=</mo><mrow><msubsup><mo stretchy=\"false\">∫</mo><mrow><mi>x</mi><mo>=</mo><mn>20</mn></mrow><mrow><mi>x</mi><mo>=</mo><mn>0</mn></mrow></msubsup><mrow><mo>-</mo><mfenced separators=\"|\"><mrow><mn>5</mn><mo>-</mo><mn>0.2</mn><mi>x</mi></mrow></mfenced><mo>×</mo><mn>10</mn><mo>×</mo><mi>d</mi><mi>x</mi></mrow></mrow></math><br /><br /><math><mo>=</mo><msubsup><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mn>50</mn><mi>x</mi></mrow></mfenced></mrow><mrow><mi>x</mi><mo>=</mo><mn>0</mn></mrow><mrow><mi>x</mi><mo>=</mo><mn>20</mn></mrow></msubsup><mo>-</mo><msubsup><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mn>2</mn><mfrac><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></mrow><mrow><mi>x</mi><mo>=</mo><mn>0</mn></mrow><mrow><mi>x</mi><mo>=</mo><mn>20</mn></mrow></msubsup></math><br /><br /><math><mi>W</mi><mo>=</mo><mn>50</mn><mo>×</mo><mn>20</mn><mo>-</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>20</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>600&nbsp;</mn><mi mathvariant=\"normal\">J</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636d2b687070a1dd89", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "39", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020",
