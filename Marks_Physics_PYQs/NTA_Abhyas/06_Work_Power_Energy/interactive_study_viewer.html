>", "image": null, "isCorrect": true}, {"id": "0BDC9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>M</mi><mi>g</mi><mi>L</mi></mrow><msup><mi>n</mi><mn>2</mn></msup></mfrac></math>", "image": null, "isCorrect": false}, {"id": "h64GI", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>M</mi><mi>g</mi><mi>L</mi></mrow><mrow><mn>4</mn><msup><mi>n</mi><mn>3</mn></msup></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "ML8vh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>M</mi><mi>g</mi><mi>L</mi></mrow><mrow><mn>3</mn><msup><mi>n</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/415416516581.jpg\" style=\"width: 290px; height: 175px;\" /></strong></u><br /><br />If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> is the mass per unit length of the chain,&nbsp;<span style=\"line-height: 1.6em;\">the mass of the chain of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math> will be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>×</mo><mi>m</mi><mo>=</mo><mi>y</mi><mi>m</mi></math>&nbsp;and the force acting on it due to gravity will be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mi>y</mi><mo>×</mo><mi>g</mi><mo>=</mo><mi>m</mi><mi>g</mi><mi>y</mi></math>(assuming that <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math> is the length of the chain hanging over the edge). So, the work done in pulling the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>d</mo><mi>y</mi></math> length of the chain on the table<br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>d</mo><mi>W</mi><mo>=</mo><mi>F</mi><mfenced><mrow><mo>-</mo><mo>d</mo><mi>y</mi></mrow></mfenced></math>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;[as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math> is decreasing]</span><br /><br /><span style=\"line-height: 1.6em;\">i.e., &nbsp; &nbsp; </span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>d</mo><mi>W</mi><mo>=</mo><mi>m</mi><mi>g</mi><mi>y</mi><mo>(</mo><mo>-</mo><mo>d</mo><mi>y</mi><mo>)</mo></math><span style=\"line-height: 1.6em;\">&nbsp; &nbsp;[as</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><mi>m</mi><mi>g</mi><mi>y</mi></math><span style=\"line-height: 1.6em;\">]</span><br /><br /><span style=\"line-height: 1.6em;\">So, the work done in pulling the hanging portion on the table :</span><br /><br />&nbsp;<math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>W</mtext> <mo>=</mo> <mo>-</mo> <msubsup> <mo>∫</mo> <mtext>L/n</mtext> <mn>0</mn> </msubsup> <mtext>mgydy</mtext> <mo>=</mo> <mfrac> <mrow> <msup> <mtext>MgL</mtext> <mn>2</mn> </msup> </mrow> <mrow> <msup> <mtext>2n</mtext> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mtext>or</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>W</mtext> <mo>=</mo> <msup> <mtext>MgL/2n</mtext> <mn>2</mn> </msup> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mtext>as&nbsp; M</mtext> <mo>&nbsp;=&nbsp;</mo> <mtext>mL</mtext> </mrow> </mfenced> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863cb766dc75a5 n></mrow></msub></mrow><mrow><mn>2</mn></mrow></msup><mo>×</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>l</mi></mrow><mrow><mi mathvariant=\"normal\">L</mi></mrow></mfrac></mrow></mfenced></mrow></mfenced></mtd></mtr><mtr><mtd><mi mathvariant=\"normal\">W</mi><mo>=</mo><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">g</mi><mi>l</mi><mfenced open=\"[\" close=\"]\" separators=\"|\"><mrow><mn>1</mn><mo>+</mo><msup><mrow><msub><mrow><mi mathvariant=\"normal\">θ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced></mtd></mtr></mtable></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b371fecee958c6b4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "58", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The blocks <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>&nbsp;</mo></math>and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&nbsp;shown in the figure have masses <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>M</mi><mi mathvariant=\"normal\">A</mi></msub><mo>=</mo><mn>5</mn><mo>&nbsp;</mo><mi>kg</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>M</mi><mi mathvariant=\"normal\">B</mi></msub><mo>=</mo><mn>4</mn><mo>&nbsp;</mo><mi>kg</mi></math>. the system is released from rest. The speed of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&nbsp;after <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;has travelled a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> along the incline is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi mathvariant=\"normal\">g</mi><mo>=</mo><mn>10</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced></math> &nbsp;<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0026944_Question.jpg\" style=\"width: 200px; height: 250px;\" />", "image": null}, "options": [{"id": "aWEsk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mn>15</mn><mn>2</mn></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "XLjxP", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mn>15</mn><mn>8</mn></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "EUyN3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mn>5</mn><mn>6</mn></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "koOy7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mn>5</mn><mn>2</mn></mfrac></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;moves down the incline by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&nbsp;shall move up by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math>. If the speed of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&nbsp;is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math>&nbsp;then the speed of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;will be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>v</mi></math>.<br /><br />From the conservation of energy: Gain in K.E. = loss in P.E.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><msub><mi>M</mi><mtext>A</mtext></msub><msup><mfenced><mrow><mn>2</mn><mi>v</mi></mrow></mfenced><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msub><mi>M</mi><mtext>B</mtext></msub><msup><mi>v</mi><mn>2</mn></msup><mo>=</mo><msub><mi>M</mi><mtext>A</mtext></msub><mtext>g</mtext><mo>&#215;</mo><mfrac><mn>3</mn><mn>5</mn></mfrac><mo>-</mo><msub><mi>M</mi><mtext>B</mtext></msub><mtext>g</mtext><mo>&#215;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math><br /><br />Solving we get,&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msqrt><mfrac><mtext>g</mtext><mn>3</mn></mfrac></msqrt><mo>=</mo><msqrt><mfrac><mn>5</mn><mn>6</mn></mfrac></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a6f65d3521f80795", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "01", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A particle is released from a height <math><mi>S</mi></math>. At certain height its kinetic energy is three times its potential energy. The height and speed of the particle at that instant are respectively", "image": null}, "options": [{"id": "08e8D", "text": "<math> <mrow> <mfrac> <mi>S</mi> <mn>4</mn> </mfrac> <mo>,</mo><mtext> </mtext><mfrac> <mrow> <mn>3</mn><mi>g</mi><mi>S</mi></mrow> <mn>2</mn> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "qLskC", "text": "<math> <mrow> <mfrac> <mi>S</mi> <mn>4</mn> </mfrac> <mo>,</mo><mtext> </mtext><mfrac> <mrow> <msqrt> <mrow> <mn>3</mn><mi>g</mi><mi>S</mi></mrow> </msqrt> </mrow> <mn>2</mn> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "BwI6C", "text": "<math><mfrac><mrow><mi>S</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mfrac><mrow><msqrt><mn>3</mn><mi>g</mi><mi>S</mi></msqrt></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "PKUbq", "text": "<math><mfrac><mrow><mi>S</mi></mrow><mrow><mn>4</mn></mrow></mfrac><mo>,</mo><msqrt><mfrac><mrow><mn>3</mn><mi>g</mi><mi>S</mi></mrow><mrow><mn>2</mn></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "We can realize the situation as shown.&nbsp; Let at point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mi>C</mi> </math> distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mi>x</mi> </math> from highest point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mi>A</mi> </math>, the particle's kinetic energy is three times its potential energy.<br /><br />Velocity <math><mi>C</mi><mo>,</mo></math><br /><br /><math><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>0</mn><mo>+</mo><mn>2</mn><mi>g</mi><mi>x</mi></math><br /><br /><math><mi>O</mi><mi>r</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>2</mn><mi>g</mi><mi>x</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi></math>.....(i)<br /><br />Potential energy at ,<math><mi>C</mi><mo>=</mo><mi>m</mi><mi>g</mi><mi>&nbsp;</mi><mfenced separators=\"|\"><mrow><mi>S</mi><mo>-</mo><mi>x</mi></mrow></mfenced><mi>&nbsp;</mi><mi>&nbsp;</mi><mo>…</mo><mo>.</mo><mo>.</mo><mo>(</mo><mi>i</mi><mi>i</mi><mo>)</mo></math><br /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image21-77280a62-8d67-4094-b093-0338e686eade.jpg\" style=\"width: 137px; height: 224px;\" /><br /><br />At Point C,<br /><br />Kinetic energy <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <mo>=</mo><mn>3</mn><mo>×</mo></mrow> </math> potential energy<br /><br />ie, <math><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><mn>1</mn></mrow><mrow><mi>&nbsp;</mi><mn>2</mn></mrow></mfrac><mi>m</mi><mo>×</mo><mn>2</mn><mi>g</mi><mi>x</mi><mo>=</mo><mn>3</mn><mo>×</mo><mi>m</mi><mi>g</mi><mo>(</mo><mi>S</mi><mo>-</mo><mi>x</mi><mo>)</mo></math><br /><br />or <math><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>x</mi><mo>=</mo><mn>3</mn><mi>S</mi><mo>-</mo><mn>3</mn><mi>x</mi></math><br /><br />or <math><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mn>4</mn><mi>x</mi><mo>=</mo><mn>3</mn><mi>S</mi></math><br /><br />or <math><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>S</mi><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi>x</mi></math><br /><br />or <math><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>x</mi><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mi>S</mi></math><br /><br />Therefore, from Eq.(i)<br /><br /><math><msup><mrow><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>2</mn><mi>g</mi><mo>×</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mi>S</mi></math><br /><br />Or <math><msup><mrow><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>g</mi><mi>S</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>o</mi><mi>r</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>v</mi><mo>=</mo><msqrt><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>g</mi><mi>S</mi></msqrt></math><br /><br />Height of the particle from the ground<br /><br /><math><mo>=</mo><mi>&nbsp;</mi><mi>S</mi><mo>-</mo><mi>x</mi><mo>=</mo><mi>S</mi><mo>-</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mi>S</mi><mo>=</mo><mfrac><mrow><mi>s</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a0cb0f169ffd53e2", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "26", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A particle is placed at the origin and a force&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">F</mi><mo>=</mo><mi>kx</mi></math> is acting on it (where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">k</mi></math> is a positive constant). IF <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">U</mi><mo>(</mo><mn>0</mn><mo>)</mo><mo>=</mo><mn>0</mn></math>, the graph of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">U</mi><mo>(</mo><mi mathvariant=\"normal\">x</mi><mo>)</mo></math> versus&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi></math> will be (where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">U</mi></math> is the potential energy function)", "image": null}, "options": [{"id": "pneZ0", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0010228_Ans1_1.jpg\" style=\"width: 201px; height: 192px;\" />", "image": null, "isCorrect": true}, {"id": "O9rYr", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0010228_Ans2_1.jpg\" style=\"width: 195px; height: 192px;\" />", "image": null, "isCorrect": false}, {"id": "juS04", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0010228_Ans3_1.jpg\" style=\"width: 206px; height: 211px;\" />", "image": null, "isCorrect": false}, {"id": "l4jK5", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0010228_Ans4_1.jpg\" style=\"width: 194px; height: 192px;\" />", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <mtext>F</mtext> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <mtext>dU</mtext> </mrow> <mrow> <mtext>dx</mtext> </mrow> </mfrac> <mo>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&rArr;</mo> <mo>&nbsp;&nbsp;&nbsp;&nbsp;&int;</mo> <mtext>dU</mtext> <mo>=</mo> <mo>-</mo> <mo>&int;</mo> <mtext>Fdx</mtext> </mrow> </math><br /><br /><math> <mrow> <msub> <mtext>U</mtext> <mn>2</mn> </msub> <mo>-</mo> <msub> <mtext>U</mtext> <mn>1</mn> </msub> <mo>=</mo> <mo>-</mo> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mo>&int;</mo> <mtext>kxdx</mtext> </mrow> </mfenced> <mo>&nbsp;&nbsp;&rArr;</mo> <mtext>&nbsp;&nbsp;U</mtext> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <mn>1</ /msup><mo>-</mo><mn>3</mn><mi>x</mi></mrow></mfenced><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi></math>.&nbsp;The equilibrium position of the particle is at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>. The value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mi>x</mi></math>&nbsp;will be", "image": null}, "options": [], "correctValue": "15", "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">U</mi><mfenced><mi mathvariant=\"normal\">x</mi></mfenced><mo>=</mo><mfenced><mrow><msup><mi mathvariant=\"normal\">x</mi><mn>2</mn></msup><mo>−</mo><mn>3</mn><mi mathvariant=\"normal\">x</mi></mrow></mfenced><mi mathvariant=\"normal\">J</mi></math><br />For a conservative field, Force, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">F</mi><mo>⁡</mo><mo>=</mo><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">d</mi><mo>⁡</mo><mi mathvariant=\"normal\">U</mi><mo>⁡</mo></mrow><mrow><mi mathvariant=\"normal\">d</mi><mo>⁡</mo><mi mathvariant=\"normal\">x</mi></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mi mathvariant=\"normal\">F</mi><mo>⁡</mo><mo>=</mo><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">d</mi><mo>⁡</mo></mrow><mrow><mi mathvariant=\"normal\">d</mi><mo>⁡</mo><mi mathvariant=\"normal\">x</mi></mrow></mfrac><mfenced><mrow><msup><mi mathvariant=\"normal\">x</mi><mn>2</mn></msup><mo>-</mo><mn>3</mn><mi mathvariant=\"normal\">x</mi></mrow></mfenced><mo>=</mo><mo>-</mo><mfenced><mrow><mn>2</mn><mi mathvariant=\"normal\">x</mi><mo>-</mo><mn>3</mn></mrow></mfenced><mo>=</mo><mo>-</mo><mn>2</mn><mi mathvariant=\"normal\">x</mi><mo>+</mo><mn>3</mn></math><br /><br />At equilibrium position, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">F</mi><mo>=</mo><mn>0</mn></math>&nbsp;<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>2</mn><mi mathvariant=\"normal\">x</mi><mo>+</mo><mn>3</mn><mo>=</mo><mn>0</mn><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mo>⇒</mo><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mi mathvariant=\"normal\">x</mi><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mi mathvariant=\"normal\">m</mi><mo>⁡</mo><mo>=</mo><mn>1</mn><mo>·</mo><mn>5</mn><mspace width=\"0.5em\"></mspace><mtext>m</mtext></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637fd0e2d4d1c15368", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "40", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A block of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math>&nbsp;slides on a frictionless surface with an initial speed of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>0</mn></msub></math>. On top of the block, there is a small block&nbsp;of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>.&nbsp;The coefficient of friction between the blocks&nbsp;is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>μ</mi></math>. The system of blocks encounters an ideal spring with force constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi></math>. The maximum value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi></math>&nbsp;for which the blocks don't slip relative to each other is</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0032412_Question1.jpg\" styl math></p><p>Also for the upper block</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>f</mi><mrow><mi>m</mi><mi>a</mi><mi>x</mi></mrow></msub><mo>=</mo><mi>&#956;</mi><mi>m</mi><mi>g</mi><mo>=</mo><mi>m</mi><mfrac><mi>k</mi><mrow><mi>m</mi><mo>+</mo><mi>M</mi></mrow></mfrac><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#956;</mi><mi>g</mi><mo>=</mo><mfrac><mi>k</mi><mrow><mi>m</mi><mo>+</mo><mi>M</mi></mrow></mfrac><mfenced><mrow><msub><mi>v</mi><mn>0</mn></msub><msqrt><mfrac><mrow><mi>m</mi><mo>+</mo><mi>M</mi></mrow><mi>k</mi></mfrac></msqrt></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mi>k</mi><mrow><mi>m</mi><mo>+</mo><mi>M</mi></mrow></mfrac><mo>=</mo><msup><mfenced><mfrac><mrow><mi>&#956;</mi><mi>g</mi></mrow><msub><mi>v</mi><mn>0</mn></msub></mfrac></mfenced><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>k</mi><mo>=</mo><msup><mfenced><mfrac><mrow><mi>&#956;</mi><mi>g</mi></mrow><msub><mi>v</mi><mn>0</mn></msub></mfrac></mfenced><mn>2</mn></msup><mfenced><mrow><mi>m</mi><mo>+</mo><mi>M</mi></mrow></mfenced></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637f8f4b9f049bbcf4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "29", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A block of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi><mo>=</mo><mn>0</mn><mo>.1</mo><mo>&nbsp;</mo><mi>kg</mi></math> is released from a height of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4 bsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>0</mn><mo>.</mo><mn>10</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>2</mn><mo>.</mo><mn>00</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>. If the retarding force <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>f</mi><mi>r</mi></msub></math>&nbsp;on the block in this range is inversely proportional to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math> over this range i.e.<br />\r<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>f</mi><mi>r</mi></msub><mo>=</mo><mo>-</mo><mfrac><mi>k</mi><mi>x</mi></mfrac></math>&nbsp;for&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.10</mo><mo>&lt;</mo><mi>x</mi><mo>&lt;</mo><mn>2</mn><mo>.00</mo></math><br />\r<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>f</mi><mi>r</mi></msub><mo>=</mo><mn>0</mn></math> for <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>&lt;</mo><mn>0.10</mn><mtext> </mtext></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>&gt;</mo><mn>2.00</mn></math><br />\rIf&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi></math> then, the speed of this block ( in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>&nbsp;) as it crosses the patch is ( use&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"script\">l</mi><mi>n</mi><mtext>   </mtext><mn>20</mn><mo>=</mo><mn>3</mn></math>&nbsp;)", "image": null}, "options": [], "correctValue": "1", "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mo>∫</mo><msub><mi>f</mi ts in standard SI units and <math><mi>x</mi></math> is in metres. Find the dissociation energy of the molecule (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">J</mi></math>). [Take <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">a</mi><mo>=</mo><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>8</mn></msup></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">b</mi><mo>=</mo><mn>20</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>4</mn></msup></math>]", "image": null}, "options": [], "correctValue": "25", "solution": {"text": "<math><mi>U</mi><mo>(</mo><mi>x</mi><mo>)</mo><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>8</mn></mrow></msup></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>20</mn></mrow><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>4</mn></mrow></msup></mrow></mfrac></math><br /><math><mo>∴</mo><mi>&nbsp;</mi><mfrac><mrow><mi>d</mi><mi>U</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mo>=</mo><mn>0</mn><mi>&nbsp;</mi><mi>&nbsp;</mi><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><mo>-</mo><mn>8</mn><mo>×</mo><mn>4</mn></mrow><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>9</mn></mrow></msup></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>20</mn><mo>×</mo><mn>4</mn></mrow><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>5</mn></mrow></msup></mrow></mfrac></math><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><mn>4</mn></mrow><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>5</mn></mrow></msup></mrow></mfrac><mfenced separators=\"|\"><mrow><mn>20</mn><mo>-</mo><mfrac><mrow><mn>8</mn></mrow><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>4</mn></mrow></msup></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>0</mn></math><br /><math><mi>x</mi><mo>=</mo><mi>∞</mi></math> and <math><msup><mrow><mi>x</mi></mrow><mrow><mn>4</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>8</mn></mrow><mrow><mn>20</mn></mrow></mfrac></math><br />Also <math><mfrac><mrow><msup><mrow><mi>d</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>U</mi></mrow><mrow><mi>d</mi><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>=</mo><mo>+</mo><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">e</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">t</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><msup><mrow><mi>x</mi></mrow><mrow><mn>4</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>8</mn></mrow><mrow><mn>20</mn></mrow></mfrac></math><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>U</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow></msub><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>4</mn></mrow></msup></mrow></mfrac><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>4</mn></mrow></msup></mrow></mfrac><mo>-</mo><mn>5</mn></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>4</mn><mo>×</mo><mn>20</mn></mrow><mrow><mn>8</mn></mrow></mfrac><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>20</mn></mrow><mrow><mn>8</mn></mrow></mfrac><mo>-</mo><mn>5</mn></mrow></mfenced></math><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>U</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow></msub><mo>=</mo><mo>-</mo><mfrac><mrow><mn>4</mn><mo>×</mo><mn>20</mn></mrow><mrow><mn>8</mn></mrow></mfrac><mo>×</mo><mfrac><mrow><mn>20</mn></mrow><mrow><mn>8</mn></mrow></mfrac><mo>=</mo><mo>-</mo><mn>25</mn><mi>&nbsp;</mi><mi>&nbsp;</mi><mi mathvariant=\"normal\">J</mi></math><br /><math><mo>∴</mo></math> Dissociation energy <math><mo>=</mo><mfenced separators=\"|\"><mrow><msub><mrow><mi>U</mi></mrow><mrow><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">e</mi></mrow></msub><mo>-</mo><msub><mrow><mi>U</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow></msub></mrow></mfenced><mo>=</mo><mn>25</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">J</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635f50adffbb9c8ffa", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "103", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A ring of mass m free to slide on a fixed smooth horizontal rod is attached to a particle of mass M kg by a inextensible string of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi></math>. Initially, both M and m are at rest and the string is vertical. A horizontal velocity <math><msub><mrow><mi>v</mi></mrow><mrow><mn>0</mn></mrow></msub></math> is imparted to the particle. The maximum height up to which block will rise w.r.t its initial position is (M = 2m)<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/xwppzxnhalzykjffhhhltqdjqbmxiwsmjvhowpeobyiyspvzvw.jpeg\" style=\"max-width:100%; object-fit:contain\" />", "image": null}, "options": [{"id": "wfnBM", "text": "<math><mfrac><mrow><msubsup><mrow><mi>v</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>2</mn><mi>g</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "Crwl8", "text": "<math><mfrac><mrow><msubsup><mrow><mi>v</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>4</mn><mi>g</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "RezTn", "text": "<math><mfrac><mrow><msubsup><mrow><mi>v</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>6</mn><mi>g</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "9sIU2", "text": "<math><mfrac><mrow><msubsup><mrow><mi>v</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>8</mn><mi>g</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The reduced mass of the system is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mi>reduced</mi></msub><mo>=</mo><mfrac><mrow><mi>m</mi><mo>&#215;</mo><mn>2</mn><mi>m</mi></mrow><mrow><mi>m</mi><mo>+</mo><mn>2</mn><mi>m</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>m</mi></mrow><mn>3</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>K</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mfrac><mrow><mn>2</mn><mi>m</mi></mrow><mn>3</mn></mfrac></mfenced><msup><mfenced><msub><mi>v</mi><mn>0</mn></msub></mfenced><mn>2</mn></msup><mo>=</mo><mn>2</mn><mi>m</mi><mi>g</mi><mi>h</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>h</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mfrac><mrow><mn>2</mn><mi>m</mi></mrow><mn>3</mn></mfrac></mfenced><mfrac><msup><mfenced><msub><mi>v</mi><mn>0</mn></msub></mfenced><mn>2</mn></msup><mrow><mn>2</mn><mi>m</mi><mi>g</mi></mrow></mfrac><mo>=</mo><mfrac><msup><mfenced><msub><mi>v</mi><mn>0</mn></msub></mfenced><mn>2</mn></msup><mrow><mn>6</mn><mi>g</mi></mrow></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635d709085284e6a44", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "57", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A particle of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>1</mn><mo>&nbsp;</mo><mi>kg</mi></math> is dropped from a height <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>40</mn><mo>&nbsp;</mo><mi>cm</mi></math> on a light horizontal platform fixed to one end of an elastic spring, the other being fixed to a base, as shown in the diagram. The particle collides with the platform and sticks to it. As a result, the spring is compressed by an amount <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>10</mn><mo>&nbsp;</mo><mi>cm</mi></math>. What is the force constant of the spring?<br />\r(Take <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>10</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>)<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0022109_Question.jpg\" style=\"width: 180px; height: 157px;\" />", "image": null}, "options": [{"id": "hdMql", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>600</mn><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><div id=\"gtx-trans\" style=\"position: absolute; left: 5px; top: -6px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "fpxoN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>800</mn><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><div id=\"gtx-trans\" style=\"position: absolute; left: 5px; top: -6px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "RaRgV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1000</mn><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><div id=\"gtx-trans\" style=\"position: absolute; left: 5px; top: -6px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "DEJei", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1200</mn><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><div id=\"gtx-trans\" style=\"position: absolute; left: 5px; top: -6px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since the platform is depressed by an amount x, the total work done on the spring is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mi>g</mi><mo>(</mo><mi>h</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mi>x</mi><mo>)</mo></math>. This work is stored in the spring in the form of potential energy <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>k</mi><msup><mi>x</mi><mn>2</mn></msup></math>.<br /><br />Equating the two, we have<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>k</mi><msup><mi>x</mi><mn>2</mn></msup><mo>=</mo><mi>m</mi><mi>g</mi><mfenced><mrow><mi>h</mi><mo>+</mo><mi>x</mi></mrow></mfenced></math>&nbsp;or&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi><mo>=</mo><mfrac><mrow><mtext>2&#160;</mtext><mtext mathvariant=\"italic\">mg</mtext><mfenced><mrow><mi>h</mi><mo>+</mo><mi>x</mi></mrow></mfenced></mrow><msup><mi>x</mi><mn>2</mn></msup></mfrac></math><br /><br />Given, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>0</mn><mo>.</mo><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>0</mn><mo>.</mo><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>1</mn><mo>&#160;</mo><mi>kg</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>10</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>. Substituting these values, we get<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>1000</mn><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635d4e82ad247d8c39", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "46", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The potential energy of a particle of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&nbsp;</mo><mi>kg</mi></math> moving in the <math><mi>x</mi><mo>-</mo><mi>y</mi></math> plane is given by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>U</mi><mo>=</mo><mo>(</mo><mo>-</mo><mn>7</mn><mi>x</mi><mo>+</mo><mn>24</mn><mi>y</mi><mo>)</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi></math>, <math><mi>x</mi></math> and <math><mi>y</mi></math> being in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>metre</mi></math>. If the particle starts from rest from origin, then what is the speed (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>) of particle at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">s</mi></math>?", "image": null}, "options": [], "correctValue": "10", "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>F</mi><mo>&#8594;</mo></mover><mo>=</mo><mo>-</mo><mfrac><mrow><mo>&#8706;</mo><mi>U</mi></mrow><mrow><mo>&#8706;</mo><mi>x</mi></mrow></mfrac><mover><mi mathvariant=\"bold\">i</mi><mo>^</mo></mover><mo>-</mo><mfrac><mrow><mo>&#8706;</mo><mi>U</mi></mrow><mrow><mo>&#8706;</mo><mi>y</mi></mrow></mfrac><mover><mi mathvariant=\"bold\">j</mi><mo>^</mo></mover><mo>=</mo><mn>7</mn><mover><mi mathvariant=\"bold\">i</mi><mo>^</mo></mover><mo>-</mo><mn>24</mn><mover><mi mathvariant=\"bold\">j</mi><mo>^</mo></mover></math><br /><br /><math><mo>&#8756;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><msub><mrow><mi>a</mi></mrow><mrow><mi>x</mi></mrow></msub><mo>=</mo><mfrac><mrow><msub><mrow><mi>F</mi></mrow><mrow><mi>x</mi></mrow></msub></mrow><mrow><mi>m</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>7</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mo>=</mo><mn>1.4</mn><mi>&#160;</mi><mi mathvariant=\"normal\">m</mi><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></math> along positive <math><mi>x</mi></math>-axis<br /><br /><math><msub><mrow><mi>a</mi></mrow><mrow><mi>y</mi></mrow></msub><mo>=</mo><mfrac><mrow><msub><mrow><mi>F</mi></mrow><mrow><mi>y</mi></mrow></msub></mrow><mrow><mi>m</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mfrac><mrow><mn>24</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math><br /><br /><math><mo>=</mo><mn>4.8</mn><mi mathvariant=\"normal\">m</mi><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></math> along negative <math><mi>y</mi></math>-axis<br /><br /><math><mo>&#8756;</mo><mi>&#160;</mi><msub><mrow><mi>v</mi></mrow><mrow><mi>x</mi></mrow></msub><mo>=</mo><msub><mrow><mi>a</mi></mrow><mrow><mi>x</mi></mrow></msub><mi>t</mi><mo>=</mo><mn>1.4</mn><mo>&#215;</mo><mn>2</mn></math><br /><br /><math><mo>=</mo><mn>2.8</mn><mi>&#160;</mi><mi mathvariant=\"normal\">m</mi><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></math><br /><br />and <math><msub><mrow><mi>v</mi></mrow><mrow><mi>y</mi></mrow></msub><mo>=</mo><mn>4.8</mn><mo>&#215;</mo><mn>2</mn><mo>=</mo><mn>9.6</mn><mi>&#160;</mi><mi mathvariant=\"normal\">m</mi><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br /><math><mo>&#8756;</mo><mi>&#160;</mi><mi>v</mi><mo>=</mo><msqrt><msubsup><mrow><mi>v</mi></mrow><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msubsup><mo>+</mo><msubsup><mrow><mi>v</mi></mrow><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msubsup></msqrt><mo>=</mo><mn>10</mn><mi>&#160;</mi><mi mathvariant=\"normal\">m</mi><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635a0665a92c9f4f1f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "80", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A block of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>=</mo><mn>0.1</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi>kg</mi></math> is connected to a spring of unknown spring constant k. It is compressed to a distance&nbsp;<math><mi>x</mi> </math> from its equilibrium position and released from rest. After approaching half the distance <math><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></math> from the equilibrium position, it hits another block and comes to rest momentarily, while the other block moves with velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&nbsp;</mi><mn>3</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. The total initial energy of the spring is:", "image": null}, "options": [{"id": "9JoFF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.6</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": true}, {"id": "Cp5GY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.8</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "KNB6D", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.5</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "WO62o", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.3</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "By mechanical energy conservation between compression positions <math><mi>x</mi></math> and <math><mfrac><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>k</mi><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>k</mi><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>m</mi><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>k</mi><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>k</mi><mfrac><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>4</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>m</mi><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>k</mi><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>m</mi><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br /><math><mi>v</mi><mo>=</mo><msqrt><mfrac><mrow><mn>3</mn><mi>k</mi><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>4</mn><mi>m</mi></mrow></mfrac></msqrt><mo>=</mo><msqrt><mfrac><mrow><mn>3</mn><mi>k</mi></mrow><mrow><mi>m</mi></mrow></mfrac></msqrt><mfrac><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><br />On collision with a block at rest<br /><br /><math><mo>&#8757;</mo></math> Velocities are exchanged <math><mo>&#8658;</mo></math> elastic collision between identical masses.<br /><br /><math><mo>&#8756;</mo><mi>v</mi><mo>=</mo><mn>3</mn><mo>=</mo><msqrt><mfrac><mrow><mn>3</mn><mi>k</mi></mrow><mrow><mi>m</mi></mrow></mfrac></msqrt><mfrac><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><br /><math><mo>&#8658;</mo><mn>6</mn><mo>=</mo><msqrt><mfrac><mrow><mn>3</mn><mi>k</mi></mrow><mrow><mi>m</mi></mrow></mfrac><mi>&#160;</mi></msqrt><mi>&#160;</mi><mi>x</mi></math><br /><br /><math><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mn>6</mn><msqrt><mfrac><mrow><mi>m</mi></mrow><mrow><mn>3</mn><mi>k</mi></mrow></mfrac></msqrt></math><br /><br /><math><mo>&#8756;</mo></math> The initial energy of the spring is<br /><br /><math><mi>U</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>k</mi><mi>&#160;</mi><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>k</mi><mo>&#215;</mo><mn>36</mn><mfrac><mrow><mi>m</mi></mrow><mrow><mn>3</mn><mi>k</mi></mrow></mfrac><mo>=</mo><mn>6</mn><mi>m</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>U</mi><mo>=</mo><mn>6</mn><mo>&#215;</mo><mn>0.1</mn><mo>=</mo><mn>0</mn><mo>.6</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">J</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863560a11905f977d73", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "67", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 20 ><mi mathvariant=\"normal\">n</mi><mi>t</mi></math><br /><br /><math><mo>&#8658;</mo><mi>a</mi><mo>&#8733;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mi>t</mi></msqrt></mrow></mfrac></math> ....... (1)<br /><br />Now, <math><mi>S</mi><mo>=</mo><msqrt><mn>2</mn></msqrt><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#160;</mi><mi>a</mi><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup></math> <math><mfenced separators=\"|\"><mrow><mo>&#8757;</mo><mi mathvariant=\"normal\">&#160;</mi><mi>u</mi><mo>=</mo><mn>0</mn></mrow></mfenced></math><br /><br /><math><mo>&#8658;</mo><mi>S</mi><mo>&#8733;</mo><mi>a</mi><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br /><math><mo>&#8756;</mo><mi>S</mi><mo>&#8733;</mo><mfrac><mrow><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><msqrt><mi>t</mi></msqrt></mrow></mfrac></math>&nbsp; [Using (1)]<br /><br /><math><mo>&#8658;</mo><mi>S</mi><mo>&#8733;</mo><msup><mrow><mi>t</mi></mrow><mrow><mrow><mrow><mn>3</mn></mrow><mo>/</mo><mrow><mn>2</mn></mrow></mrow></mrow></msup></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634878ab46984496e5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "03", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A vertical spring of force constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&nbsp;</mo><msup><mi>Nm</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> is attached to the ceiling, with a block of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi>kg</mi></math>&nbsp;suspended fro  "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "74", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A spherical ball of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> is kept at the highest point in the space between two fixed, concentric spheres&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> (see fig.). The smaller sphere&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> has a radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> and space between the two spheres has a width <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi></math>. The ball has a diameter very slightly less than <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi></math>. All surfaces are frictionless. The ball is given a gentle push (towards the right in the figure). The angle made by the radius vector of the ball with the upward vertical is denoted by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>θ</mi></math>.&nbsp; What is the total normal reaction force exerted by the spheres on the ball in terms of angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>θ</mi></math>?<br />\r<br />\r<img alt=\"\" height=\"124\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0007554_Ques1_1.jpg\" style=\"max-width:100%; object-fit:contain\" width=\"166\" />", "image": null}, "options": [{"id": "CiC2L", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mi>g</mi><mo>&#160;</mo><mo>(</mo><mn>3</mn><mi>cos</mi><mi>&#952;</mi><mo>&#160;</mo><mo>&#8211;</mo><mn>2</mn><mo>&#160;</mo><mo>)</mo></math>", "image": null, "isCorrect": true}, {"id": "TS79X", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mi>g</mi><mo>&#160;</mo><mo>(</mo><mo>&#160;</mo><mn>2</mn><mi>cos</mi><mi>&#952;</mi><mo>&#160;</mo><mo>&#8211;</mo><mo>&#160;</mo><mn>3</mn><mo>&#160;</mo><mo>)</mo></math>", "image": null, "isCorrect": false}, {"id": "xDY7u", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>m</mi><mi>g</mi><mo>&#160;</mo><mo>(</mo><mo>&#160;</mo><mn>2</mn><mi>cos</mi><mi>&#952;</mi><mo>&#160;</mo><mo>&#8211;</mo><mo>&#160;</mo><mn>1</mn><mo>&#160;</mo><mo>)</mo></math>", "image": null, "isCorrect": false}, {"id": "JmfJR", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>m</mi><mi>g</mi><mo>&#160;</mo><mo>(</mo><mo>&#160;</mo><mn>3</mn><mi>cos</mi><mi>&#952;</mi><mo>&#160;</mo><mo>&#8211;</mo><mo>&#160;</mo><mn>1</mn><mo>&#160;</mo><mo>)</mo></math><div id=\"gtx-trans\" style=\"position: absolute; left: 105px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><mo>=</mo><mfenced><mrow><mi>R</mi><mo>+</mo><mfrac><mi>d</mi><mn>2</mn></mfrac></mrow></mfenced><mfenced><mrow><mn>1</mn><mo>-</mo><mtext>cos</mtext><mi>&#160;&#952;</mi></mrow></mfenced></math><br />&nbsp;<br /><img alt=\"\" height=\"186\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0007554_AnsExp1_1.jpg\" style=\"max-width:100%; object-fit:contain\" width=\"172\" /><br />&nbsp;<br />The velocity of the ball at an angle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi></math> is<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>&#957;</mi><mn>2</mn></msup><mo>=</mo><mn>2</mn><mi>g</mi><mi>h</mi><mo>=</mo><mn>2</mn><mfenced><mrow><mi>R</mi><mo>+</mo><mfrac><mi>d</mi><mn>2</mn></mfrac></mrow></mfenced><mfenced><mrow><mn>1</mn><mo>-</mo><mtext>cos</mtext><mi>&#160;&#952;</mi></mrow></mfenced><mi>g</mi></math>&nbsp; ...... (i)<br /><br />Let N be the normal reaction (away from the centre) at angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi></math>. Then, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">mg&#160;</mtext><mtext>cos</mtext><mi>&#160;&#952;</mi><mo>-</mo><mi>N</mi><mo>=</mo><mfrac><mrow><mi>m</mi><msup><mi>&#957;</mi><mn>2</mn></msup></mrow><mfenced><mrow><mi>R</mi><mo>+</mo><mfrac><mi>d</mi><mn>2</mn></mfrac></mrow></mfenced></mfrac></math><br /><br />Substituting the value of <math> <mrow> <msup> <mi>&#957;</mi> <mn>2</mn> </msup> </mrow> </math> from equation (i), we get<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">mg</mtext><mtext>&#160;cos</mtext><mi>&#160;&#952;</mi><mo>-</mo><mi>N</mi><mo>=</mo><mtext>2</mtext><mtext mathvariant=\"italic\">mg</mtext><mfenced><mrow><mn>1</mn><mo>-</mo><mtext>cos</mtext><mi>&#160;&#952;</mi></mrow></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi><mo>=</mo><mi>m</mi><mi>g</mi><mfenced><mrow><mtext>3 cos</mtext><mi>&#160;&#952;</mi><mo>-</mo><mn>2</mn></mrow></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86344a0a0b28a217df9", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "34", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>The initial configuration of the system is as shown in the figure.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/260423_qrghu.png\" style=\"width: 170px; height: 144px;\" /><br />\r<br />\rThe string and the pulley are light. The bob is released and the string starts wrapping around the pulley. (The pulley is held in place by a force applied at the centre)<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/jee_2phy.JPG\" style=\"width: 150px; height: 152px;\" /><br />\r<br />\rFind the rate <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi></math> at which the length of the string wrapped around the pulley increases (as a function of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">θ</mi></math>).</p>\r", "image": null}, "options": [{"id": "oECyi", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">R</mi><mfenced separators=\"|\"><mrow><mi>l</mi><mo>-</mo><mi>R&#x3B8;</mi></mrow></mfenced></mfrac><msqrt><mn>2</mn><mi mathvariant=\"normal\">g</mi><mfenced open=\"[\" close=\"]\"><mrow><mfenced separators=\"|\"><mrow><mi>l</mi><mo>-</mo><mi>R&#x3B8;</mi></mrow></mfenced><mi>sin&#x3B8;</mi></mrow></mfenced></msqrt></math>", "image": null, "isCorrect": false}, {"id": "ihzuS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">R</mi><mfenced separators=\"|\"><mrow><mi>l</mi><mo>-</mo><mi>R&#x3B8;</mi></mrow></mfenced></mfrac><msqrt><mn>2</mn><mi mathvariant=\"normal\">g</mi><mfenced open=\"[\" close=\"]\"><mrow><mfenced separators=\"|\"><mrow><mi>l</mi><mo>-</mo><mi>R&#x3B8;</mi></mrow></mfenced><mi>sin&#x3B8;</mi><mo>+</mo><mi>Rcos&#x3B8;</mi></mrow></mfenced></msqrt></math>", "image": null, "isCorrect": false}, {"id": "yqhml", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">R</mi><mfenced separators=\"|\"><mrow><mi>l</mi><mo>-</mo><mi>R&#x3B8;</mi></mrow></mfenced></mfrac><msqrt><mn>2</mn><mi mathvariant=\"normal\">g</mi><mfenced open=\"[\" close=\"]\"><mrow><mfenced separators=\"|\"><mrow><mi>l</mi><mo>-</mo><mi>R&#x3B8;</mi></mrow></mfenced><mi>sin&#x3B8;</mi><mo>+</mo><mi mathvariant=\"normal\">R</mi><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mi>sin</mi><mi>&#x3B8;</mi></mrow></mfenced></mrow></mfenced></msqrt></math>", "image": null, "isCorrect": false}, {"id": "BG5Gh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">R</mi><mfenced separators=\"|\"><mrow><mi>l</mi><mo>-</mo><mi>R&#x3B8;</mi></mrow></mfenced></mfrac><msqrt><mn>2</mn><mi mathvariant=\"normal\">g</mi><mfenced open=\"[\" close=\"]\"><mrow><mfenced separators=\"|\"><mrow><mi>l</mi><mo>-</mo><mi>R&#x3B8;</mi></mrow></mfenced><mi>sin&#x3B8;</mi><mo>+</mo><mi mathvariant=\"normal\">R</mi><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mi>cos&#x3B8;</mi></mrow></mfenced></mrow></mfenced></msqrt></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>At any instant of time, the length of the string wrapped on the pulley is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R&#952;</mi></math>&nbsp;and the remaining length&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">L</mi><mo>=</mo><mi>l</mi><mo>-</mo><mi>R&#952;</mi></math></p><p>The rate <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi><mo>=</mo><mi mathvariant=\"normal\">R</mi><mfrac><mi>d&#952;</mi><mi>dt</mi></mfrac><mo>=</mo><mi>R&#969;</mi><mo>=</mo><mi mathvariant=\"normal\">R</mi><mfrac><mi mathvariant=\"normal\">v</mi><mfenced separators=\"|\"><mrow><mi>l</mi><mo>-</mo><mi>R&#952;</mi></mrow></mfenced></mfrac></math>, where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">v</mi></math>&nbsp;is the speed of the particle</p><p>The height through which the particle has come down</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">h</mi><mo>=</mo><mi mathvariant=\"normal\">R</mi><mfenced><mrow><mn>1</mn><mo>-</mo><mi>cos&#952;</mi></mrow></mfenced><mo>+</mo><mfenced><mrow><mi>l</mi><mo>-</mo><mi>R&#952;</mi></mrow></mfenced><mi>sin&#952;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">v</mi><mo>=</mo><msqrt><mn>2</mn><mi mathvariant=\"normal\">g</mi><mfenced open=\"[\" close=\"]\"><mrow><mi mathvariant=\"normal\">R</mi><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mi>cos&#952;</mi></mrow></mfenced><mo>+</mo><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">l</mi><mo>-</mo><mi>R&#952;</mi></mrow></mfenced><mi>sin&#952;</mi></mrow></mfenced></msqrt></math></p><p>So,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">R</mi><mfenced separators=\"|\"><mrow><mi>l</mi><mo>-</mo><mi>R&#952;</mi></mrow></mfenced></mfrac><msqrt><mn>2</mn><mi mathvariant=\"normal\">g</mi><mfenced open=\"[\" close=\"]\"><mrow><mfenced separators=\"|\"><mrow><mi>l</mi><mo>-</mo><mi>R&#952;</mi></mrow></mfenced><mi>sin&#952;</mi><mo>+</mo><mi mathvariant=\"normal\">R</mi><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mi>cos&#952;</mi></mrow></mfenced></mrow></mfenced></msqrt></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86341dc26a0ccefff3e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "104", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A ball is dropped on to a horizontal plate from a height <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><mo>=</mo><mn>9</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> above it. If the coefficient of restitution is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>e</mi><mo>=</mo><mfrac bevelled=\"true\"><mn>1</mn><mn>2</mn></mfrac></math>, the total distance travelled before the ball comes to rest is</p>\r", "image": null}, "options": [{"id": "liSjC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 78px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "d8EjB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 78px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "184UW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 78px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "W5NIZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>25</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 78px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The impact between the ball and the plate is direct impact. If u is the velocity of the ball before impact, its velocity after is eu, where e is the coefficient of restitution.<br /><br />But&nbsp;<math> <mrow> <mi></mi><mi></mi><mi></mi><mi>u</mi><mo>⁡</mo> <mo>=</mo> <msqrt> <mn>2</mn> <mtext>gh</mtext> </msqrt> </mrow> </math>&nbsp;since the ball falls from a height h. So the velocity of the ball at the first rebound<br /><br /><math> <mrow> <mo>=</mo> <msub> <mrow> <mtext>v</mtext> </mrow> <mn>1</mn> </msub> <mo>=</mo> <mi></mi><mi></mi><mi>e</mi><mo>⁡</mo> <mi></mi><mi></mi><mi>u</mi><mo>⁡</mo> <mo>=</mo> <mi></mi><mi></mi><mi>e</mi><mo>⁡</mo> <msqrt> <mn>2</mn> <mtext>gh</mtext> </msqrt> </mrow> </math><br /><br />The height h<sub>1</sub> to which it rises after first rebound<br /><br /><math> <mrow> <msub> <mrow> <mi></mi><mi></mi><mi>h</mi><mo>⁡</mo> </mrow> <mn>1</mn> </msub> <mo>=</mo> <mfrac> <mrow> <msubsup> <mrow> <mtext>v</mtext> </mrow> <mn>1</mn> <mn>2</mn> </msubsup> </mrow> <mrow> <mn>2</mn> <mtext>g</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <msup> <mrow> <mi></mi><mi></mi><mi>e</mi><mo>⁡</mo> </mrow> <mn>2</mn> </msup> <mo>·</mo> <mn>2</mn> <mtext>gh</mtext> </mrow> <mrow> <mn>2</mn> <mtext>g</mtext> </mrow> </mfrac> <mo>=</mo> <msup> <mrow> <mi></mi><mi></mi><mi>e</mi><mo>⁡</mo> </mrow> <mn>2</mn> </msup> <mi></mi><mi></mi><mi>h</mi><mo>⁡</mo> </mrow> </math><br /><br />The velocity v<sub>2</sub> after second rebound v<sub>2</sub> = ev<sub>1</sub> = e<sup>2</sup>u<br /><br />The height h<sub>2</sub> it rises after second rebound<br /><br /><math> <mrow> <msub> <mrow> <mi></mi><mi></mi><mi>h</mi><mo>⁡</mo> </mrow> <mn>2</mn> </msub> <mo>=</mo> <mfrac> <mrow> <msubsup> <mrow> <mtext>v</mtext> </mrow> <mn>2</mn> <mn>2</mn> </msubsup> </mrow> <mrow> <mn>2</mn> <mtext>g</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <msup> <mrow> <mi></mi><mi></mi><mi>e</mi><mo>⁡</mo> </mrow> <mn>4</mn> </msup> <mo>·</mo> <msup> <mrow> <mi></mi><mi></mi><mi>u</mi><mo>⁡</mo> </mrow> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn> <mtext>g</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <msup> <mrow> <mi></mi><mi></mi><mi>e</mi><mo>⁡</mo> </mrow> <mn>4</mn> </msup> <mo>·</mo> <mn>2</mn> <mtext>gh</mtext> </mrow> <mrow> <mn>2</mn> <mtext>g</mtext> </mrow> </mfrac> <mo>=</mo> <msup> <mrow> <mi></mi><mi></mi><mi>e</mi><mo>⁡</mo> </mrow> <mn>4</mn> </msup> <mi></mi><mi></mi><mi>h</mi><mo>⁡</mo> </mrow> </math><br /><br />In general, the height hn to which the ball rises after n<sup>th</sup> rebound is given by h<sub>n</sub> = e<sup>2n</sup>h.<br /><br />Total distance travelled<br /><br />&nbsp;&nbsp;&nbsp; = h + 2h<sub>1</sub> + 2h<sub>2</sub> + 2h<sub>3</sub> + ................+2h<sub>n</sub>+............to ∞<br /><br />&nbsp;&nbsp;&nbsp; = h + 2 (e<sup>2</sup>h + e<sup>4</sup>h + e<sup>6</sup> h +.......)<br /><br />&nbsp;&nbsp;&nbsp; = h + 2he<sup>2</sup>(1 + e<sup>2</sup> + e<sup>4</sup>+...........)<br /><br />&nbsp;&nbsp;&nbsp; <math> <mrow> <mo>=</mo> <mi></mi><mi></mi><mi>h</mi><mo>⁡</mo> <mo>+</mo> <mfrac> <mrow> <mn>2</mn> <mi></mi><mi></mi><mi>h</mi><mo>⁡</mo> <msup> <mrow> <mi></mi><mi></mi><mi>e</mi><mo>⁡</mo> </mrow> <mn>2</mn> </msup> </mrow> <mrow> <mn>1</mn> <mo>-</mo> <msup> <mrow> <mi></mi><mi></mi><mi>e</mi><mo>⁡</mo> </mrow> <mn>2</mn> </msup> </mrow> </mfrac> <mo>=</mo> <mi></mi><mi></mi><mi>h</mi><mo>⁡</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>1</mn> <mo>+</mo> <mfrac> <mrow> <mn>2</mn> <msup> <mrow> <mi></mi><mi></mi><mi>e</mi><mo>⁡</mo> </mrow> <mn>2</mn> </msup> </mrow> <mrow> <mn>1</mn> <mo>-</mo> <msup> <mrow> <mi></mi><mi></mi><mi>e</mi><mo>⁡</mo> </mrow> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </mfenced> <mo>=</mo> <mfrac> <mrow> <mi></mi><mi></mi><mi>h</mi><mo>⁡</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>1</mn> <mo>+</mo> <msup> <mrow> <mi></mi><mi></mi><mi>e</mi><mo>⁡</mo> </mrow> <mn>2</mn> </msup> </mrow> </mfenced> </mrow> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>1</mn> <mo>-</mo> <msup> <mrow> <mi></mi><mi></mi><mi>e</mi><mo>⁡</mo> </mrow> <mn>2</mn> </msup> </mrow> </mfenced> </mrow> </mfrac> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp; <math> <mrow> <mo>=</mo> <mfrac> <mrow> <mn>9</mn> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>1</mn> <mo>+</mo> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> </mrow> </mfenced> </mrow> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>1</mn> <mo>-</mo> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> </mrow> </mfenced> </mrow> </mfrac> <mo>=</mo> <mn>1</mn> <mn>5</mn> <mspace width=\"0.5em\"></mspace> <mtext>m</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633ee44e8e0ea8049d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "83", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A ball whose kinetic energy is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi></math>, is thrown at an angle of&nbsp;<math> <mrow> <mn>45</mn><mo>°</mo> </mrow> </math> &nbsp;with the horizontal. Its kinetic energy at the highest point of its flight will be:", "image": null}, "options": [{"id": "5Ncgd", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi></math>", "image": null, "isCorrect": false}, {"id": "AYFfn", "text": "<math> <mrow> <mfrac> <mi>E</mi> <mn>2</mn> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "HMuaW", "text": "<math>  <mrow>   <mfrac>    <mi>E</mi>    <mrow>     <msqrt>      <mn>2</mn>     </msqrt>         </mrow
