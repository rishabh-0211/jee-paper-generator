text": "A <math><mn>0.5</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi></math> block slides from <math><mi>A</mi></math> on horizontal track with an initial speed of <math><mn>3</mn><mi mathvariant=\"normal\">&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">m&nbsp;</mi><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>–</mo><mn>1</mn></mrow></msup></math> towards a weightless horizontal spring of length <math><mn>1&nbsp;</mn><mi mathvariant=\"normal\">m</mi></math> and force constant <math><mn>2</mn><mi mathvariant=\"normal\">&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">N&nbsp;</mi><mi mathvariant=\"normal\">m</mi></mrow><mrow><mo>–</mo><mn>1</mn></mrow></msup></math>. The part <math><mi>A</mi><mi>B</mi></math> of the track is frictionless and the part <math><mi>B</mi><mi>C</mi></math> has the coefficient of static and kinetic friction as <math><mn>0.22</mn></math> and <math><mn>0.20</mn></math> respectively. If the distance <math><mi>A</mi><mi>B</mi></math> and <math><mi>B</mi><mi>D</mi></math> are <math><mn>2</mn><mi mathvariant=\"normal\">&nbsp;m</mi></math> and <math><mn>2.14 m&nbsp;</mn></math>respectively, the total distance through which the block moves before it comes to rest completely is -<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/71827q.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 200px; height: 68px;\" />", "image": null}, "options": [{"id": "ukKQ7", "text": "<math><mn>2.5</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "J86Mw", "text": "<math><mn>4.42</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "wVqvL", "text": "<math><mn>4.24</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": true}, {"id": "dilwX", "text": "<math><mn>2.44</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "At <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">D</mi><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi><mi mathvariant=\"normal\">E</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi mathvariant=\"normal\">&#160;</mi><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup><mi mathvariant=\"normal\">&#160;</mi><mo>&#8211;</mo><mi mathvariant=\"normal\">&#160;</mi><msub><mi>&#956;</mi><mi mathvariant=\"normal\">k</mi></msub><mi>m</mi><mi>g</mi><mi mathvariant=\"normal\">&#160;</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">D</mi></mrow></mfenced></math><br /><br /><math><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">&#160;</mi><mo>&#215;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>0.5</mn><mi mathvariant=\"normal\">&#160;</mi><mo>&#215;</mo><mi mathvariant=\"normal\">&#160;</mi><msup><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></msup><mi mathvariant=\"normal\">&#160;</mi><mo>&#8211;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>0.2</mn><mi mathvariant=\"normal\">&#160;</mi><mo>&#215;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>0.5</mn><mi mathvariant=\"normal\">&#160;</mi><mo>&#215;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>10</mn><mi mathvariant=\"normal\">&#160;</mi><mo>&#215;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>2.14</mn></math><br /><br /><math><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mn>2.25</mn><mi mathvariant=\"normal\">&#160;</mi><mo>&#8211;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>2.14</mn><mo>=</mo><mn>0.11</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">J</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0.11</mn><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>&#160;</mi><mi>k</mi><msup><mi>x</mi><mn>2</mn></msup><mi mathvariant=\"normal\">&#160;</mi><mo>+</mo><mi>&#160;</mi><msub><mi>&#956;</mi><mi mathvariant=\"normal\">R</mi></msub><mi>m</mi><mi>g</mi><mi>x</mi><mo>&#8658;</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>x</mi><mo>&#8211;</mo><mn>0.11</mn><mo>=</mo><mn>0</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mn>0.1</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">m</mi></math><br /><br /><math><mi mathvariant=\"normal\">T</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">d</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#160;</mi><mo>+</mo><mi mathvariant=\"normal\">&#160;</mi><mn>2.14</mn><mi mathvariant=\"normal\">&#160;</mi><mo>+</mo><mi mathvariant=\"normal\">&#160;</mi><mn>0.1</mn><mi mathvariant=\"normal\">&#160;</mi><mo>=</mo><mn>4.24</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633725960046ad3593", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "81", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A block of mass <math><mi mathvariant=\"normal\">M</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi></math> with a semicircular track of radius <math><mi mathvariant=\"normal\">R</mi><mo>=</mo><mn>1.1</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi></math> rests on a horizontal frictionless surface. A uniform cylinder of radius <math><mi mathvariant=\"normal\">r</mi><mo>=</mo><mn>10</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math> and mass <math><mi mathvariant=\"normal\">m</mi><mo>=</mo><mn>1.0</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi></math> is released from rest from the top point <math><mi mathvariant=\"normal\">A</mi></math>. The cylinder slips on the semicircular frictionless track. The speed of the block when the cylinder reaches the bottom of the track at <math><mi mathvariant=\"normal\">B</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">g</mi><mo>=</mo><mn>10</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced></math><br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image65-ac2448c3-c6df-4af6-bb63-ed0d1610061d.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 140px; height: 100px;\" />", "image": null}, "options": [{"id": "M5i6u", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mn>10</mn><mn>3&nbsp;</mn></mfrac></msqrt><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "DGyAo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mn>4</mn><mn>3&#160;</mn></mfrac></msqrt><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "kGAoU", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mn>5</mn><mn>2&#160;</mn></mfrac></msqrt><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "NolYz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>10</mn></msqrt><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the speed of the block be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math>. Then from conservation of momentum, the velocity of the cylinder will be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>v</mi></math> in the opposite direction <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mi>m</mi><mo>=</mo><mfrac><mi>M</mi><mn>2</mn></mfrac></mrow></mfenced></math><br /><br />Now from conservation of energy<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mi>g</mi><mi>h</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>M</mi><msup><mi>v</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><msup><mfenced separators=\"|\"><mrow><mn>2</mn><mi>v</mi></mrow></mfenced><mn>2</mn></msup><mo>,</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi>h</mi><mo>=</mo><mi>R</mi><mo>-</mo><mi>r</mi><mo>=</mo><mn>1</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi></math><br /><br />so <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><msqrt><mfrac><mn>10</mn><mn>3&nbsp;</mn></mfrac></msqrt><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633537818c46b3c840", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "71", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A block of mass <math><mn>2</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi></math> is kept at the origin at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>0</mn></math> and is having velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><msqrt><mn>5</mn></msqrt><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> in the positive <math><mi mathvariant=\"normal\">x</mi></math> -direction. The only force on it is a conservative and its potential energy is defined as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>U</mi><mo>=</mo><mo>-</mo><mi mathvariant=\"normal\">&nbsp;</mi><msup><mi>x</mi><mn>3</mn></msup><mo>+</mo><mn>6</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>15</mn></math>. Its velocity when the force acting on it is minimum (after the time <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>0</mn></math> ) is -", "image": null}, "options": [], "correctValue": "8", "solution": {"text": "At <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>0</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mn>2</mn><mo>&#215;</mo><mn>80</mn><mo>=</mo><mn>80</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">J</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>U</mi><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mn>15</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">J</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi mathvariant=\"normal\">&#160;</mi><mi>E</mi><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mi>K</mi><mo>+</mo><mi>U</mi><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mn>95</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">J</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mi mathvariant=\"normal\">d</mi><mi>U</mi></mrow><mrow><mi mathvariant=\"normal\">d</mi><mi>x</mi></mrow></mfrac><mo>&#8658;</mo><mi>F</mi><mo>=</mo><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>12</mn><mi>x</mi></math><br /><br />For <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">m</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><mfrac><mrow><mi mathvariant=\"normal\">d</mi><mi>F</mi></mrow><mrow><mi mathvariant=\"normal\">d</mi><mi>x</mi></mrow></mfrac><mo>=</mo><mn>0</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">&#160;</mi><mi>x</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">m</mi></math><br /><br />At <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mi mathvariant=\"normal\">&#160;</mi><mo>=</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mi>K</mi><mo>+</mo><mi>U</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>95</mn><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mn>2</mn><mo>&#215;</mo><msup><mi>v</mi><mn>2</mn></msup><mo>+</mo><mfenced separators=\"|\"><mrow><mo>-</mo><mn>8</mn><mo>+</mo><mn>24</mn><mo>+</mo><mn>15</mn></mrow></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>v</mi><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mn>8</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86334329d4f20bc5f6d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "36", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two spherical bodies of the same mass <math><mi>M</mi></math>, are moving with velocities <math><msub><mrow><mi>v</mi></mrow><mrow><mn>1</mn></mrow></msub></math>and <math><msub><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msub></math>&nbsp;respectively, along the same line. These bodies collide p hvariant=\"normal\">x</mi></math> in the time taken by him to hit the ground, then the average force acting on him is", "image": null}, "options": [{"id": "iuneg", "text": "<math><mfrac><mrow><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">h</mi></mrow><mrow><mi mathvariant=\"normal\">x</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "JnKxU", "text": "<math><mfrac><mrow><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">x</mi></mrow><mrow><mi mathvariant=\"normal\">h</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "YihyO", "text": "<math><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">g</mi><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">h</mi></mrow><mrow><mi mathvariant=\"normal\">x</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "VepfG", "text": "<math><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">g</mi><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mi mathvariant=\"normal\">h</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">F</mi><mo>=</mo><mo>-</mo><mfrac><mrow><mo>&#8710;</mo><mi mathvariant=\"normal\">u</mi></mrow><mrow><mo>&#8710;</mo><mi mathvariant=\"normal\">x</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mfrac><mfenced separators=\"|\"><mrow><mo>-</mo><mi>Mgh</mi></mrow></mfenced><mi mathvariant=\"normal\">x</mi></mfrac><mo>=</mo><mfrac><mi>Mgh</mi><mi mathvariant=\"normal\">x</mi></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863183f32837c0417ae", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "78", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Consider an elliptically shaped rail PQ in the vertical plane with <math><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>3</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi></math> and <math><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">Q</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>4</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi></math> . A block of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi>kg</mi></math> is pulled along the rail from&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Q</mi></math> with a force of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>18</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi></math>, which is always parallel to line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>PQ</mi></math> (see the figure given). Assuming no frictional losses, the kinetic energy of the block when it reaches <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Q</mi><mo>&nbsp;</mo></math>is <math><mo>(</mo><mi mathvariant=\"normal\">n</mi><mo>×</mo><mn>10</mn><mo>)</mo></math>&nbsp;joules. The value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">n</mi></math> is (take acceleration due to gravity = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>–</mo><mn>2</mn></mrow></msup></math> )<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image17-5aae0c64-3590-429e-843c-1ceabe1ff5bf.png\" style=\"max-width:100%; object-fit:contain\" style=\"height: 123px; width: 120px;\" />", "image": null}, "options": [], "correctValue": "5", "solution": {"text": "Using work-energy theorem<br /><br /><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mrow><mi>m</mi><mi>g</mi></mrow></msub><mo>+</mo><msub><mi>W</mi><mi>F</mi></msub><mo>=</mo><mi mathvariant=\"normal\">&#916;</mi><mi>K</mi><mi>E</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mi>m</mi><mi>g</mi><mi>h</mi><mo>+</mo><mi>F</mi><mi>d</mi><mo>=</mo><mi mathvariant=\"normal\">&#916;</mi><mi>K</mi><mi>E</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>1</mn><mo>&#215;</mo><mn>10</mn><mo>&#215;</mo><mn>4</mn><mo>+</mo><mn>18</mn><mfenced separators=\"|\"><mn>5</mn></mfenced><mo>=</mo><mi mathvariant=\"normal\">&#916;</mi><mi>K</mi><mi>E</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#916;</mi><mi>K</mi><mi>E</mi><mo>=</mo><mn>50</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>n</mi><mo>=</mo><mn>5</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631540bc3dc5113c77", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "53", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A heavy, flexible uniform chain of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">π</mi><mi>r</mi></math> and mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>λ</mi><mi mathvariant=\"normal\">π</mi><mi>r</mi><mo>&nbsp;</mo></math>lies in a smooth semicircular tube <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi><mo>&nbsp;</mo></math>of the radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>. Assuming a slight disturbance to start the chain in motion, find the velocity&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math> with which it will emerge from the end&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> of the tube.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014750_Question_1_1.jpg\" style=\"width: 249px; height: 164px;\" />", "image": null}, "options": [{"id": "Hi3dP", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>4</mn><mi>g</mi><mi>r</mi><mo>&#8289;</mo><mfenced><mrow><mfrac><mn>3</mn><mtext>&#960;</mtext></mfrac><mo>+</mo><mfrac><mtext>&#960;</mtext><mn>2</mn></mfrac></mrow></mfenced></msqrt></math>", "image": null, "isCorrect": false}, {"id": "DQdZT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn><mi>g</mi><mi>r</mi><mfenced><mrow><mfrac><mn>2</mn><mtext>&#960;</mtext></mfrac><mo>+</mo><mfrac><mtext>&#960;</mtext><mn>5</mn></mfrac></mrow></mfenced></msqrt></math>", "image": null, "isCorrect": false}, {"id": "OiMfg", "text": "<math> <mrow> <msqrt> <mn>2</mn> <mtext>g</mtext> <mi></mi><mi></mi><mi></mi><mi></mi><mi>r</mi><mo>⁡</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>2</mn> </mrow> <mrow> <mtext>π</mtext> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <mtext>π</mtext> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </mfenced> </msqrt> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "MKmii", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>5</mn><mi>g</mi><mi>r</mi><mfenced><mrow><mfrac><mn>4</mn><mtext>π</mtext></mfrac><mo>+</mo><mfrac><mtext>π</mtext><mn>3</mn></mfrac></mrow></mfenced></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since friction absent, we can apply the law of conservation of energy. Centre of gravity of a semicircular arc is at a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">π</mi></mrow><mi>r</mi></mfrac></mfenced></math> from the centre.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>Initial potential energy</mtext><mo>=</mo><mfenced><mrow><mtext mathvariant=\"italic\">λ</mtext><mtext>π</mtext><mtext mathvariant=\"italic\">r</mtext></mrow></mfenced><mi>g</mi><mfenced><mfrac><mrow><mn>2</mn><mtext mathvariant=\"italic\">r</mtext></mrow><mtext>π</mtext></mfrac></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>Final potential energy</mtext><mo>=</mo><mfenced><mrow><mtext mathvariant=\"italic\">λ</mtext><mtext>π</mtext><mtext mathvariant=\"italic\">r</mtext></mrow></mfenced><mi>g</mi><mfenced><mfrac><mrow><mo>-</mo><mtext>π</mtext><mtext mathvariant=\"italic\">r</mtext></mrow><mn>2</mn></mfrac></mfenced></math><br /><br />When the chain is completely slipped off the tube, all the links of the chain have the same velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math>.<br /><br /><u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014750_AnsExp1_1.jpg\" /></strong></u><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>Kinetic energy of chain</mtext><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mrow><mtext mathvariant=\"italic\">λ</mtext><mtext>π</mtext><mtext mathvariant=\"italic\">r</mtext></mrow></mfenced><msup><mi>v</mi><mn>2</mn></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>From COE,</mtext><mspace width=\"0.5em\"></mspace><mtext mathvariant=\"italic\">λ</mtext><mtext>π</mtext><mtext mathvariant=\"italic\">rg</mtext><mfenced><mfrac><mrow><mn>2</mn><mtext>π</mtext></mrow><mtext>r</mtext></mfrac></mfenced><mo>=</mo><mfenced><mrow><mtext mathvariant=\"italic\">λ</mtext><mtext>π</mtext><mtext mathvariant=\"italic\">r</mtext></mrow></mfenced><mtext mathvariant=\"italic\">g</mtext><mfenced><mfrac><mrow><mo>-</mo><mtext>π</mtext><mtext mathvariant=\"italic\">r</mtext></mrow><mn>2</mn></mfrac></mfenced><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mrow><mtext mathvariant=\"italic\">λ</mtext><mtext>π</mtext><mtext mathvariant=\"italic\">r</mtext></mrow></mfenced><msup><mi>v</mi><mn>2</mn></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>From which we find,</mtext><mspace width=\"0.5em\"></mspace><mi>v</mi><mo>=</mo><msqrt><mn>2</mn><mi>g</mi><mi>r</mi><mfenced><mrow><mfrac><mn>2</mn><mtext>π</mtext></mfrac><mo>+</mo><mfrac><mtext>π</mtext><mn>2</mn></mfrac></mrow></mfenced></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863150b73baba08a4ca", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "87", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Power applied to a particle varies with time as <math><mi>P</mi><mo>=</mo><mo>(</mo><mn>3</mn><msup><mrow><mi>t</mi></mrow>< r": null, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
