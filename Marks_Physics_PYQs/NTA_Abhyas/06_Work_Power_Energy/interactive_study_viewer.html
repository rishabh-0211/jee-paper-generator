i</mi><mo>^</mo></mover><mo>+</mo><mn>2</mn><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>r</mi><mo>→</mo></mover><mo>=</mo><msub><mover><mi>r</mi><mo>→</mo></mover><mn>2</mn></msub><mo>-</mo><msub><mover><mi>r</mi><mo>→</mo></mover><mn>1</mn></msub><mo>=</mo><mn>5</mn><mover><mi>i</mi><mo>^</mo></mover><mo>-</mo><mn>4</mn><mover><mi>j</mi><mo>^</mo></mover><mo>-</mo><mn>3</mn><mover><mi>i</mi><mo>^</mo></mover><mo>-</mo><mn>8</mn><mover><mi>j</mi><mo>^</mo></mover></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mover><mi>i</mi><mo>^</mo></mover><mo>-</mo><mn>12</mn><mover><mi>j</mi><mo>^</mo></mover></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">W</mi><mo>=</mo><mover><mi mathvariant=\"normal\">F</mi><mo>→</mo></mover><mo>·</mo><mover><mi mathvariant=\"normal\">S</mi><mo>→</mo></mover><mo>=</mo><mo>(</mo><mn>6</mn><mover><mi mathvariant=\"normal\">i</mi><mo>^</mo></mover><mo>+</mo><mn>2</mn><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover><mo>)</mo><mo>·</mo><mo>(</mo><mn>2</mn><mover><mi mathvariant=\"normal\">i</mi><mo>^</mo></mover><mo>-</mo><mn>12</mn><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover><mo>)</mo></math><br />&nbsp;&nbsp; &nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mn>12</mn><mi>J</mi></math></p><p>&nbsp;</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635b2435c43dc8287b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "65", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform chain of length&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math> and mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> overhangs a horizontal table with its two-third part on the table. The friction coefficient between the table and the chain is <math><mi>μ</mi></math>. The work done by friction during the period, the chain slips of the table is", "image": null}, "options": [{"id": "6TutT", "text": "<math><mo>-</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>9</mn></mrow></mfrac><mi>μ</mi><mi>M</mi><mi>g</mi><mi>L</mi></math>", "image": null, "isCorrect": true}, {"id": "fvPcP", "text": "<math><mo>-</mo><mfrac><mrow><mn>6</mn></mrow><mrow><mn>9</mn></mrow></mfrac><mi>μ</mi><mi>M</mi><mi>g</mi><mi>L</mi></math>", "image": null, "isCorrect": false}, {"id": "43UkZ", "text": "<math><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mi>μ</mi><mi>M</mi><mi>g</mi><mi>L</mi></math>", "image": null, "isCorrect": false}, {"id": "FHfnA", "text": "<math><mo>-</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>9</mn></mrow></mfrac><mi>μ</mi><mi>M</mi><mi>g</mi><mi>L</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The linear mass density is <math><mfrac><mrow><mi>M</mi></mrow><mrow><mi>L</mi></mrow></mfrac></math>. The small work done for the slippage on the small distance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">d</mi><mi>l</mi></math> is given by<br /><br /><math><mi>d</mi><mi>W</mi><mo>=</mo><mo>-</mo><mi>&#956;</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mi>M</mi></mrow><mrow><mi>L</mi></mrow></mfrac></mrow></mfenced><mi>g</mi><mi>l</mi><mi>d</mi><mi>l</mi></math><br /><br />Now, total work done<br /><br /><math><mi>W</mi><mo>=</mo><mrow><msubsup><mo stretchy=\"false\">&#8747;</mo><mrow><mn>0</mn></mrow><mrow><mfrac><mrow><mn>2</mn><mi>L</mi></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></msubsup><mrow><mo>-</mo><mfrac><mrow><mi>&#956;</mi><mi>M</mi><mi>g</mi></mrow><mrow><mi>L</mi></mrow></mfrac><mi>l</mi><mi>&#160;</mi><mi>d</mi><mi>l</mi></mrow></mrow></math><br /><br /><math><mo>=</mo><mi>&#160;</mi><mi>&#160;</mi><mo>-</mo><mfrac><mrow><mi>&#956;</mi><mi>M</mi><mi>g</mi></mrow><mrow><mi>L</mi></mrow></mfrac><msubsup><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><msup><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>0</mn></mrow><mrow><mfrac><mrow><mn>2</mn><mi>L</mi></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></msubsup><mo>=</mo><mo>-</mo><mfrac><mrow><mi>&#956;</mi><mi>M</mi><mi>g</mi></mrow><mrow><mn>2</mn><mi>L</mi></mrow></mfrac><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>4</mn><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>9</mn></mrow></mfrac><mo>-</mo><mn>0</mn></mrow></mfenced></math><br /><br /><math><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>W</mi><mo>=</mo><mo>-</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>9</mn></mrow></mfrac><mi>&#956;</mi><mi>M</mi><mi>g</mi><mi>L</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635617780b46db273d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "31", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A particle starts with speed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">v</mi><mn>0</mn></msub></math> from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi><mo>=</mo><mn>0</mn></math> along <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi></math>-axis with retardation proportional to the square of its displacement. Work done by the force acting on the particle is proportional to", "image": null}, "options": [{"id": "FZJJk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">x</mi><mfrac><mn>5</mn><mn>2</mn></mfrac></msup></math>", "image": null, "isCorrect": false}, {"id": "mlD0G", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">x</mi><mn>3</mn></msup></math>", "image": null, "isCorrect": true}, {"id": "IqacB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">x</mi></msup></math>", "image": null, "isCorrect": false}, {"id": "Q0ukM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">x</mi><mn>2</mn></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Given&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">a</mi><mo>=</mo><mo>-</mo><msup><mi>Kx</mi><mn>2</mn></msup></math></p><p>or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8211;</mo><mi mathvariant=\"normal\">v</mi><mfrac><mi>dv</mi><mi>dx</mi></mfrac><mo>=</mo><msup><mi mathvariant=\"normal\">x</mi><mn>2</mn></msup></math></p><p>integrating both sides<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8211;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced separators=\"|\"><mrow><msup><mi mathvariant=\"normal\">v</mi><mn>2</mn></msup><mo>&#8211;</mo><msubsup><mi mathvariant=\"normal\">v</mi><mn>0</mn><mn>2</mn></msubsup></mrow></mfenced><mo>=</mo><mfrac><msup><mi mathvariant=\"normal\">x</mi><mn>3</mn></msup><mn>3</mn></mfrac></math></p><p>Now, using work-energy theorem&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">W</mi><mo>=</mo><mo>&#8710;</mo><mi>KE</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">W</mi><mo>&#160;</mo><mo>&#8733;</mo><mo>&#160;</mo><msup><mi mathvariant=\"normal\">x</mi><mn>3</mn></msup></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634878ab46984496e5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "03", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A vertical spring of force constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&nbsp;</mo><msup><mi>Nm</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> is attached to the ceiling, with a block of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi>kg</mi></math>&nbsp;suspended from it. Now an external force <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi></math>&nbsp;is applied on the block so that the spring is stretched by an additional length of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>. The work done by the force&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi></math> is [Take <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mo>=</mo><mn>10</mn><mo>&nbsp;</mo><msup><mi>ms</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>]</p>\r\r<p><br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0027622_Question.jpg\" style=\"width: 138px; height: 136px;\" /></p>\r", "image": null}, "options": [{"id": "rPchh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": true}, {"id": "lIxqe", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>400</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "HxNd2", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "w9viy", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>600</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "x = elongation in spring due to mass 10 kg<br /><br /><math> <mrow> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>0</mn> <mo>×</mo> <mn>1</mn> <mn>0</mn> </mrow> <mrow> <mn>1</mn> <mn>0</mn> <mn>0</mn> </mrow> </mfrac> <mo>=</mo> <mtext>1 m</mtext> </mrow> </math><br /><br /><math> <mrow> <msub> <mtext>W</mtext> <mtext>F</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>×</mo> <mn>1</mn> <mn>0</mn> <mn>0</mn> <mo>×</mo> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>3</mn> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> <mo>-</mo> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>1</mn> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> </mrow> </mfenced> <mo>-</mo> <mn>1</mn> <mn>0</mn> <mo>×</mo> <mn>1</mn> <mn>0</mn> <mo>×</mo> <mn>2</mn> </mrow> </math><br /><br />= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633b8201638d9c020d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "84", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A <math><mn>0.5</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi></math> block slides from <math><mi>A</mi></math> on horizontal track with an initial speed of <math><mn>3</mn><mi mathvariant=\"normal\">&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">m&nbsp;</mi><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>–</mo><mn>1</mn></mrow></msup></math> towards a weightless horizontal spring of length <math><mn>1&nbsp;</mn><mi mathvariant=\"normal\">m</mi></math> and force constant <math><mn>2</mn><mi mathvariant=\"normal\">&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">N&nbsp;</mi><mi mathvariant=\"normal\">m</mi></mrow><mrow><mo>–</mo><mn>1</mn></mrow></msup></math>. The part <math><mi>A</mi><mi>B</mi></math> of the track is frictionless and the part <math><mi>B</mi><mi>C</mi></math> has the coefficient of static and kinetic friction as <math><mn>0.22</mn></math> and <math><mn>0.20</mn></math> respectively. If the distance <math><mi>A</mi><mi>B</mi></math> and <math><mi>B</mi><mi>D</mi></math> are <math><mn>2</mn><mi mathvariant=\"normal\">&nbsp;m</mi></math> and <math><mn>2.14 m&nbsp;</mn></math>respectively, the total distance through which the block moves before it comes to rest completely is -<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/71827q.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 200px; height: 68px;\" />", "image": null}, "options": [{"id": "ukKQ7", "text": "<math><mn>2.5</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "J86Mw", "text": "<math><mn>4.42</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "wVqvL", "text": "<math><mn>4.24</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": true}, {"id": "dilwX", "text": "<math><mn>2.44</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "At <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">D</mi><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi><mi mathvariant=\"normal\">E</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi mathvariant=\"normal\">&#160;</mi><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup><mi mathvariant=\"normal\">&#160;</mi><mo>&#8211;</mo><mi mathvariant=\"normal\">&#160;</mi><msub><mi>&#956;</mi><mi mathvariant=\"normal\">k</mi></msub><mi>m</mi><mi>g</mi><mi mathvariant=\"normal\">&#160;</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">D</mi></mrow></mfenced></math><br /><br /><math><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">&#160;</mi><mo>&#215;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>0.5</mn><mi mathvariant=\"normal\">&#160;</mi><mo>&#215;</mo><mi mathvariant=\"normal\">&#160;</mi><msup><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></msup><mi mathvariant=\"normal\">&#160;</mi><mo>&#8211;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>0.2</mn><mi mathvariant=\"normal\">&#160;</mi><mo>&#215;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>0.5</mn><mi mathvariant=\"normal\">&#160;</mi><mo>&#215;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>10</mn><mi mathvariant=\"normal\">&#160;</mi><mo>&#215;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>2.14</mn></math><br /><br /><math><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mn>2.25</mn><mi mathvariant=\"normal\">&#160;</mi><mo>&#8211;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>2.14</mn><mo>=</mo><mn>0.11</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">J</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0.11</mn><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>&#160;</mi><mi>k</mi><msup><mi>x</mi><mn>2</mn></msup><mi mathvariant=\"normal\">&#160;</mi><mo>+</mo><mi>&#160;</mi><msub><mi>&#956;</mi><mi mathvariant=\"normal\">R</mi></msub><mi>m</mi><mi>g</mi><mi>x</mi><mo>&#8658;</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>x</mi><mo>&#8211;</mo><mn>0.11</mn><mo>=</mo><mn>0</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mn>0.1</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">m</mi></math><br /><br /><math><mi mathvariant=\"normal\">T</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">d</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#160;</mi><mo>+</mo><mi mathvariant=\"normal\">&#160;</mi><mn>2.14</mn><mi mathvariant=\"normal\">&#160;</mi><mo>+</mo><mi mathvariant=\"normal\">&#160;</mi><mn>0.1</mn><mi mathvariant=\"normal\">&#160;</mi><mo>=</mo><mn>4.24</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863183f32837c0417ae", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "78", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Consider an elliptically shaped rail PQ in the vertical plane with <math><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>3</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi></math> and <math><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">Q</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>4</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi></math> . A block of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi>kg</mi></math> is pulled along the rail from&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Q</mi></math> with a force of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>18</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi></math>, which is always parallel to line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>PQ</mi></math> (see the figure given). Assuming no frictional losses, the kinetic energy of the block when it reaches <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Q</mi><mo>&nbsp;</mo></math>is <math><mo>(</mo><mi mathvariant=\"normal\">n</mi><mo>×</mo><mn>10</mn><mo>)</mo></math>&nbsp;joules. The value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">n</mi></math> is (take acceleration due to gravity = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>–</mo><mn>2</mn></mrow></msup></math> )<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image17-5aae0c64-3590-429e-843c-1ceabe1ff5bf.png\" style=\"max-width:100%; object-fit:contain\" style=\"height: 123px; width: 120px;\" />", "image": null}, "options": [], "correctValue": "5", "solution": {"text": "Using work-energy theorem<br /><br /><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mrow><mi>m</mi><mi>g</mi></mrow></msub><mo>+</mo><msub><mi>W</mi><mi>F</mi></msub><mo>=</mo><mi mathvariant=\"normal\">&#916;</mi><mi>K</mi><mi>E</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mi>m</mi><mi>g</mi><mi>h</mi><mo>+</mo><mi>F</mi><mi>d</mi><mo>=</mo><mi mathvariant=\"normal\">&#916;</mi><mi>K</mi><mi>E</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>1</mn><mo>&#215;</mo><mn>10</mn><mo>&#215;</mo><mn>4</mn><mo>+</mo><mn>18</mn><mfenced separators=\"|\"><mn>5</mn></mfenced><mo>=</mo><mi mathvariant=\"normal\">&#916;</mi><mi>K</mi><mi>E</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#916;</mi><mi>K</mi><mi>E</mi><mo>=</mo><mn>50</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>n</mi><mo>=</mo><mn>5</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630d69626349b222cc", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "17", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A block of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> is gently placed over a massive plank moving horizontally over a smooth surface with velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10&nbsp;</mn><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. The coefficient of friction between the block and the plank is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>2</mn></math>. The distance travelled by the block till it slides on the plank is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi>g</mi><mo>=</mo><mn>10&nbsp;</mn><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced></math>", "image": null}, "options": [{"id": "oTIMB", "text": "<math><mn>10</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "KPR0F", "text": "<math><mn>15</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "UjyCl", "text": "<math><mn>25</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": true}, {"id": "QrEec", "text": "<math><mn>35</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/D-3_solu.png\" style=\"width: 250px; height: 62px;\" /><br /><br />Initially the block is not moving with respect to ground while plank is moving, it means, relative motion is there between the plank and block due to which friction (kinetic) starts acting. Initial velocity of block is zero and final velocity is <math><mn>10&#160;</mn><mrow><mrow><mi mathvariant=\"normal\">m</mi></mrow><mo>/</mo><mrow><mi mathvariant=\"normal\">s</mi></mrow></mrow></math> and let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>s</mi></math> is the distance travelled by the block over the ground, then:-<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>m</mi><msup><mfenced separators=\"|\"><mn>10</mn></mfenced><mn>2</mn></msup></mrow><mn>2</mn></mfrac><mo>-</mo><mfrac><mrow><mi>m</mi><msup><mfenced separators=\"|\"><mn>0</mn></mfenced><mn>2</mn></msup></mrow><mn>2</mn></mfrac><mo>=</mo><mn>0</mn><mo>.2</mo><mo>&#215;</mo><mi>m</mi><mo>&#215;</mo><mn>10</mn><mo>&#215;</mo><mi>s</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>50</mn><mo>=</mo><mn>2</mn><mi>s</mi><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mi>s</mi><mo>=</mo><mn>25</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630aea7bc314cb3911", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "95", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A chain (mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math>) is hanging from a wooden structure as shown in the figure <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\" <msup>              <mtext>b</mtext>            <mn>2</mn>      </msup>      <mo>+</mo>      <mtext>ab</mtext>      <mi>&pi;</mi>    </mrow>  </mfenced></mrow></math>", "image": null, "isCorrect": false}, {"id": "WD6UM", "text": "<math><mrow>  <mfrac>    <mrow>      <mtext>Mg</mtext>      <mtext>b</mtext>    </mrow>    <mrow>      <mn>4</mn>      <mtext>a</mtext>      <mo>+</mo>      <mi>&pi;</mi>      <mtext>b</mtext>    </mrow>  </mfrac>  <mfenced open=\"[\" close=\"]\" separators=\",\">    <mrow>      <mtext>b</mtext>      <mo>+</mo>      <mtext>a</mtext>      <mi>&pi;</mi>    </mrow>  </mfenced></mrow></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Work done by gravity = &ndash; (Change in P.E.)<br /><br />&rArr; u<sub>i</sub> = u<sub>linear</sub> + u<sub>curved</sub><br /><br /><math> <mrow> <mo>=</mo> <mtext>Mass per unit length</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>M</mtext> </mrow> <mrow> <mtext>a</mtext> <mo>+</mo> <mfrac> <mrow> <mi>&pi;</mi> <mtext>b</mtext> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <msub> <mtext>W</mtext> <mtext>gravity</mtext> </msub> <mo>=</mo> <msub> <mtext>u</mtext> <mtext>i</mtext> </msub> <mo>-</mo> <msub> <mtext>u</mtext> <mtext>f</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mtext>Mgb</mtext> </mrow> <mrow> <mn>4</mn> <mtext>a</mtext> <mo>+</mo> <mi>&pi;</mi> <mtext>b</mtext> </mrow> </mfrac> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mtext>b</mtext> <mo>+</mo> <mtext>a</mtext> <mi>&pi;</mi> </mrow> </mfenced> </mrow> </math><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/New_Diagram_2.png\" style=\"max-width:100%; object-fit:contain\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86303f4cbf7a3ad4dc2", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "101", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A mass&nbsp;<math><mi>m</mi> </math> on the surface of the Earth is shifted to a target equal to the radius of the Earth. If <math> <mi>R</mi> </math> is the radius and <math> <mi>M</mi> </math> is the mass of the Earth, then work done in this process is", "image": null}, "options": [{"id": "a1GY0", "text": "<math><mfrac><mrow><mi>m</mi><mi>g</mi><mi>R</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "0cHl6", "text": "<math><mi>m</mi><mi>g</mi><mi>R</mi></math>", "image": null, "isCorrect": false}, {"id": "qlP8P", "text": "<math><mn>2</mn><mi> </mi><mi>m</mi><mi>g</mi><mi>R</mi></math>", "image": null, "isCorrect": false}, {"id": "sVgR4", "text": "<math><mfrac><mrow><mi>m</mi><mi>g</mi><mi>R</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Work done <math><mo>=</mo><mo>∆</mo><mi>P</mi><mi>E</mi><mo>=</mo><mo>-</mo><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><mrow><mi>R</mi><mo>+</mo><mi>R</mi></mrow></mfrac><mo>-</mo><mfenced separators=\"|\"><mrow><mo>-</mo><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><mrow><mi>R</mi></mrow></mfrac></mrow></mfenced></math><br /><math><mo>=</mo><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><mrow><mn>2</mn><mi>R</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>m</mi><mi>g</mi><mi>R</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math><br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630255e095c00c9bf6", "type": "numerical", "level": 1, "questi n>3</mn><mi>x</mi></mrow></mfenced><mi mathvariant=\"normal\">&#160;</mi><mi>d</mi><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><msubsup><mfenced open=\"[\" close=\"]\" separators=\"|\"><msup><mi>x</mi><mn>2</mn></msup></mfenced><mn>2</mn><mn>10</mn></msubsup><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mfenced open=\"[\" close=\"]\" separators=\"|\"><mrow><mn>100</mn><mo>-</mo><mn>4</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mn>8</mn><mo>&#215;</mo><msup><mi>v</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mo>&#215;</mo><mn>96</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mn>6</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p><p>&nbsp;</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "6aa3ab79aa8dc1ff681780c2", "title": "Energy", "totalQuestions": 73, "questions": [{"_id": "6151e863ff5bd6388aad1ca7", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "21", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A bead of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math> can slide without friction on a fixed circular horizontal ring of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi mathvariant=\"normal\">R</mi></math> " separators=\"|\"><mrow><mi mathvariant=\"normal\">R</mi><mo>-</mo><mi mathvariant=\"normal\">R</mi></mrow></mfenced><mn>2</mn></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mo>&nbsp;&nbsp;</mo><mi mathvariant=\"normal\">&nbsp;</mi><msub><mi>KE</mi><mi mathvariant=\"normal\">f</mi></msub><mo>=</mo><mn>8</mn><msup><mi>kR</mi><mn>2</mn></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863fe21921f94c10847", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "45", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A running man has the same kinetic energy as that of a boy of half his mass. The man speed up by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> and the boy changes his speed by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>, so that the kinetic energies of the boy and the man are again equal. Then <math><mi>x</mi></math> in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> is", "image": null}, "options": [{"id": "6rePJ", "text": "<math><mo>-</mo><mn>2</mn><msqrt><mn>2</mn></msqrt></math>", "image": null, "isCorrect": false}, {"id": "QWdMh", "text": "<math><mo>+</mo><mn>2</mn><msqrt><mn>2</mn></msqrt></math>", "image": null, "isCorrect": true}, {"id": "6gNpL", "text": "<math><msqrt><mn>2</mn></msqrt></math>", "image": null, "isCorrect": false}, {"id": "wwDet", "text": "2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let <math><msub><mrow><mi>v</mi></mrow><mrow><mi>M</mi></mrow></msub></math>&nbsp;be&nbsp;velocity of man,<math><msub><mrow><mi>v</mi></mrow><mrow><mi>B</mi></mrow></msub></math>of boy, then kinetic energy according to question ,<br /><br /><math><mi>i</mi><mi>e</mi><mi>&nbsp;</mi><mi>K</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>M</mi><msubsup><mrow><mi>v</mi></mrow><mrow><mi>M</mi></mrow><mrow><mn>2</mn></mrow></msubsup><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>.</mo><mfrac><mrow><mi>M</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>.</mo><msubsup><mrow><mi>v</mi></mrow><mrow><mi>B</mi></mrow><mrow><mn>2</mn></mrow></msubsup></math><br /><br />Or <math><msubsup><mrow><mi>v</mi></mrow><mrow><mi>M</mi></mrow><mrow><mn>2</mn></mrow></msubsup><mo>=</mo><mfrac><mrow><msubsup><mrow><mi>V</mi></mrow><mrow><mi>B</mi></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><br />Or <math><mi>&nbsp;</mi><mi>&nbsp;</mi><msqrt><mi>&nbsp;</mi><mn>2</mn></msqrt><msub><mrow><mi>v</mi></mrow><mrow><mi>M</mi></mrow></msub><mo>=</mo><msub><mrow><mi>v</mi></mrow><mrow><mi>B</mi></mrow></msub></math><br /><br />When man speeds up <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>and boy changes his speed by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mi>&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>.Then ,<br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>M</mi><msup><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>v</mi></mrow><mrow><mi>M</mi></mrow></msub><mo>+</mo><mn>2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>⋅</mo><mfrac><mrow><mi>M</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>⋅</mo><msup><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>v</mi></mrow><mrow><mi>B</mi></mrow></msub><mo>+</mo><mi>x</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br />Or <math><msup><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>v</mi></mrow><mrow><mi>M</mi></mrow></msub><mo>+</mo><mn>2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><msup><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>v</mi></mrow><mrow><mi>B</mi></mrow></msub><mo>+</mo><mi>x</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><br /><math><mn>2</mn><msup><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>v</mi></mrow><mrow><mi>M</mi></mrow></msub><mo>+</mo><mn>2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msup><mrow><mfenced separators=\"|\"><mrow><msqrt><mn>2</mn></msqrt><msub><mrow><mi>v</mi></mrow><mrow><mi>M</mi></mrow></msub><mo>+</mo><mi>x</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></math> <math><mfenced separators=\"|\"><mrow><mo>∵</mo><msub><mrow><mi>v</mi></mrow><mrow><mi>B</mi></mrow></msub><mo>=</mo><msqrt><mn>2</mn></msqrt><msub><mrow><mi>v</mi></mrow><mrow><mi>m</mi></mrow></msub></mrow></mfenced></math><br /><br />Or <math><msqrt><mn>2</mn></msqrt><mfenced separators=\"|\"><mrow><msub><mrow><mi>v</mi></mrow><mrow><mi>M</mi></mrow></msub><mo>+</mo><mn>2</mn></mrow></mfenced><mo>=</mo><msqrt><mn>2</mn></msqrt><msub><mrow><mi>v</mi></mrow><mrow><mi>M</mi></mrow></msub><mo>+</mo><mi>x</mi></math><br /><br />Or +<math><mn>2</mn><msqrt><mn>2</mn></msqrt><mo>=</mo><mi>x</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863fcdf746939c70e46", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "35", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A rod <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math> of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi></math>&nbsp;and&nbsp;length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">L</mi></math>&nbsp;is lying on a horizontal frictionless surface. A particle of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math> travelling along the surface hits the end <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> of the rod with a velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">v</mi><mn>0</mn></msub></math>&nbsp;in a direction perpendicular to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math>. The collision is perfectly elastic and after the collision, the particle comes to rest. The ratio&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">M</mi></mfrac></math>&nbsp;is", "image": null}, "options": [{"id": "ir7Lg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>4</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "jEZJw", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "3uHGX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "raF5N", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Q11111111.jpg\" style=\"width: 250px; height: 234px;\" /><br />Using the principle of conservation of linear momentum</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>mv</mi><mn>0</mn></msub><mo>=</mo><msub><mi>Mv</mi><mi>cm</mi></msub></math></p><p>Using the principle of conservation of angular momentum</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>mv</mi><mn>0</mn></msub><mfrac><mi mathvariant=\"normal\">L</mi><mn>2</mn></mfrac><mo>=</mo><mfrac><msup><mi>ML</mi><mn>2</mn></msup><mn>12</mn></mfrac><mi mathvariant=\"normal\">&#969;</mi></math></p><p>Since the collision is completely elastic, the velocity of approach is equal to the velocity of separation</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">v</mi><mn>0</mn></msub><mo>=</mo><msub><mi mathvariant=\"normal\">v</mi><mi>cm</mi></msub><mo>+</mo><mi mathvariant=\"normal\">&#969;</mi><mfrac><mi mathvariant=\"normal\">L</mi><mn>2</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi mathvariant=\"normal\">v</mi><mn>0</mn></msub><mo>=</mo><mfrac><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">M</mi></mfrac><msub><mi mathvariant=\"normal\">v</mi><mn>0</mn></msub><mo>+</mo><mn>3</mn><mfrac><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">M</mi></mfrac><msub><mi mathvariant=\"normal\">v</mi><mn>0</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">M</mi></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863fb9c6a83fcb365d7", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "82", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A particle is attached to a string and the other end of the string is attached to a fixed support. In order to just complete the vertical circular motion, what should be the ratio of the kinetic energy of the particle at its highest point to that at its lowest point?", "image": null}, "options": [], "correctValue": "0.2", "solution": {"text": "K.E <math><mi>&nbsp;</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>&nbsp;</mi><mi>m</mi><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br />At lowest point in vertical circular motion&nbsp;<math><msub><mrow><mi>V</mi></mrow><mrow><mi>l</mi></mrow></msub><mo>=</mo><msqrt><mn>5</mn><mi>r</mi><mi>g</mi></msqrt></math> and at highest point <math><msub><mrow><mi>V</mi></mrow><mrow><mi>h</mi></mrow></msub><mo>=</mo><msqrt><mi>r</mi><mi>g</mi></msqrt></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><msub><mrow><mfenced separators=\"|\"><mrow><mi>K</mi><mo>.</mo><mi>E</mi></mrow></mfenced></mrow><mrow><mi>h</mi></mrow></msub></mrow><mrow><msub><mrow><mfenced separators=\"|\"><mrow><mi>K</mi><mo>.</mo><mi>E</mi></mrow></mfenced></mrow><mrow><mi>l</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mo>=</mo><mn>0.2</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863fa217f2902401cb9", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "109", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform chain of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math> and mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> is lying on a smooth table and one-third of its length is hanging vertically down over the edge of the table. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi></math> is the acceleration due to gravity, the work required to pull the hanging part on to the table is", "image": null}, "options": [{"id": "HhBpH", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><mi>g</mi><mi>L</mi></math>", "image": null, "isCorrect": false}, {"id": "r1Pm8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>M</mi><mi>g</mi><mi>L</mi></mrow><mn>3</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "prsfn", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>M</mi><mi>g</mi><mi>L</mi></mrow><mn>9</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "OEbbU", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>M</mi><mi>g</mi><mi>L</mi></mrow><mn>18</mn></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Mass of hanging portion is <math><mfrac><mrow><mi mathvariant=\"normal\">M</mi></mrow><mrow><mn>3</mn></mrow></mfrac></math> <math><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><mn>6</mn></mrow></mfrac></math> below the table top.<br /><br />Therefore, the required work done is,<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image7-a68fc384-bc8a-4ef3-a5b3-0711c1829843.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"height: 143px; width: 290px;\" /><br /><br /><math><mi mathvariant=\"normal\">W</mi><mo>=</mo><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">M</mi></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></mfenced><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><mn>6</mn></mrow></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">L</mi></mrow><mrow><mn>18</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863f9b13d4abbc81e0a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "98", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The bob of a pendulum is released from a horizontal position <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> as shown in the figure. If the length of the pendulum is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>, what is the speed with which the bob arrives at the lowermost point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>, given that it dissipated <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>%</mo></math> of its initial energy against air resistance?<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/mmyeuubnnwyrdvcrrgikcqevpbtsnwyeddvxxrgrrlyfepcajz.png\" style=\"max-width:100%; object-fit:contain\" />", "image": null}, "options": [{"id": "YOIOb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><div id=\"gtx-trans\" style=\"position: absolute; left: 47px; top: -8px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "Tsp0J", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5.5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "ag887", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5.3</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "QdhpI", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4.4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "At the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> the energy of the pendulum is entirely potential energy. At point B, the energy of the pendulum is entirely kinetic energy. It means that as the bob pendulum lowers from A to B, the potential energy is converted into kinetic energy. Thus, at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>, KE = PE. But <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>%</mo></math> of the potential energy is dissipated against air resistance.<br /><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/kxzwevvdqsqaytpybrwjisxdcbjhkjusvuevkjcfxsochsualg.png\" style=\"max-width:100%; object-fit:contain\" /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>KE</mi></math> at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo>=</mo><mn>95</mn><mo>%&#160;</mo><mi>of</mi><mi mathvariant=\"normal\">&#160;</mi><mi>PE</mi><mi mathvariant=\"normal\">&#160;</mi><mi>at</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">A</mi></math> .... (i)<br /><br /><math><mo>&#8756;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi></math> From equation (i), <math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>m</mi><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>95</mn></mrow><mrow><mn>100</mn></mrow></mfrac><mi>m</mi><mi>g</mi><mi>h</mi></math><br /><br /><math><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>2</mn><mo>&#215;</mo><mfrac><mrow><mn>95</mn></mrow><mrow><mn>100</mn></mrow></mfrac><mi>g</mi><mi>h</mi><mo>=</mo><mn>2</mn><mo>&#215;</mo><mfrac><mrow><mn>95</mn></mrow><mrow><mn>100</mn></mrow></mfrac><mo>&#215;</mo><mn>9.8</mn><mo>&#215;</mo><mn>1.5</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><msqrt><mfrac><mrow><mn>19</mn><mo>&#215;</mo><mn>9.8</mn><mo>&#215;</mo><mn>1.5</mn></mrow><mn>10</mn></mfrac></msqrt><mo>=</mo><msqrt><mn>27.93</mn></msqrt><mo>=</mo><mn>5.285</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mn>5</mn><mo>.3</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863f0863bb3d0614f04", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "10", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A particle of mass <math><mi mathvariant=\"bold\">m</mi></math> is moving in a circular path of constant radius <math><mi mathvariant=\"bold\">r</mi></math> such that its centripetal acceleration <math><msub><mrow><mi mathvariant=\"bold\">a</mi></mrow><mrow><mi mathvariant=\"bold\">c</mi></mrow></msub></math> is varying with time <math><mi mathvariant=\"normal\">t</mi></math> as <math><msub><mrow><mi mathvariant=\"bold\">a</mi></mrow><mrow><mi mathvariant=\"bold\">c</mi></mrow></msub><mo>=</mo><msup><mrow><mi mathvariant=\"normal\">k</mi></mrow><mrow><mn>2</mn></mrow></msup><mi mathvariant=\"normal\">&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">t</mi></mrow><mrow><mn>2</mn></mrow></msup></math> , where <math><mi mathvariant=\"normal\">k</mi></math> is a constant. The power delivered to the particle by the force acting on it is", "image": null}, "options": [{"id": "YLBBW", "text": "<math><mn>2</mn><mi mathvariant=\"normal\">π</mi><mi mathvariant=\"normal\"> </mi><msup><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">k</mi></mrow><mrow><mn>2</mn></mrow></msup><mi mathvariant=\"normal\"> </mi><msup><mrow><mi mathvariant=\"normal\">r</mi></mrow><mrow><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "IxeL7", "text": "<math><msup><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">k</mi></mrow><mrow><mn>2</mn></mrow></msup><mi mathvariant=\"normal\">&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">r</mi></mrow><mrow><mn>2</mn></mrow></msup><mi mathvariant=\"normal\">t</mi></math>", "image": null, "isCorrect": true}, {"id": "dSbFo", "text": "<math><mfrac><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">m</mi><msup><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mn>4</mn></mrow></msup><mi mathvariant=\"normal\">&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">r</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi mathvariant=\"normal\">t</mi></mrow><mrow><mn>5</mn></mrow></msup></mrow></mfenced></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "CYgjN", "text": "Zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><msub><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mi mathvariant=\"normal\">c</mi></mrow></msub><mo>=</mo><msup><mrow><mi mathvariant=\"normal\">k</mi></mrow><mrow><mn>2</mn></mrow></msup><mi mathvariant=\"normal\">&#160;</mi><msup><mrow><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">t</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br />or <math><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">v</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi mathvariant=\"normal\">r</mi></mrow></mfrac><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><msup><mrow><mi mathvariant=\"normal\">k</mi></mrow><mrow><mn>2</mn></mrow></msup><mi mathvariant=\"normal\">&#160;</mi><msup><mrow><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">t</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br />or <math><mi mathvariant=\"normal\">v</mi><mo>=</mo><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">t</mi></math><br /><br />Therefore, tangential acceleration, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">t</mi></msub><mi mathvariant=\"normal\">&#160;</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">v</mi></mrow><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">t</mi></mrow></mfrac><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">r</mi></math><br /><br />or Tangential force,<br /><br /><math><msub><mrow><mi mathvariant=\"normal\">F</mi></mrow><mrow><mi mathvariant=\"normal\">t</mi></mrow></msub><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi></mrow><mrow><mi mathvariant=\"normal\">t</mi></mrow></msub><mo>=</mo><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">r</mi></math><br /><br />Only tangential force does work.<br /><br /><math><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">w</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">r</mi><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">F</mi></mrow><mrow><mi mathvariant=\"normal\">t</mi></mrow></msub><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">v</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">r</mi></mrow></mfenced><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">t</mi></mrow></mfenced></math><br /><br />or <math><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">w</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">r</mi><mo>=</mo><msup><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">k</mi></mrow><mrow><mn>2</mn></mrow></msup><mi mathvariant=\"normal\">&#160;</mi><msup><mrow><mi mathvariant=\"normal\">r</mi></mrow><mrow><mn>2</mn></mrow></msup><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">t</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863eac2563f048f58e3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "76", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "&nbsp;A block of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> is connected rigidly with a smooth wedge (plank) by a light spring of stiffness <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi></math>. If the wedge is moved with constant velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>0</mn></msub></math>, then find the work done by the external agent until the maximum compression of the spring.<br />\r<br />\r<img alt=\"\" height=\"128\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014759_Question_1.jpg\" style=\"max-width:100%; object-fit:contain\" width=\"196\" />", "image": null}, "options": [{"id": "yd1Si", "text": "<math> <mrow> <mi>m</mi><mo>⁡</mo><msubsup><mrow><mi>v</mi><mo>⁡</mo> </mrow> <mn>0</mn> <mn>2</mn> </msubsup> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "7f7KF", "text": "<math><mrow><mn>2</mn>  <mi>m</mi><mo>&ApplyFunction;</mo>  <msubsup>        <mrow>          <mi>v</mi><mo>&ApplyFunction;</mo>        </mrow>        <mn>0</mn>        <mn>2</mn>  </msubsup></mrow></math>", "image": null, "isCorrect": false}, {"id": "btYxe", "text": "<math> <mrow><mn>3</mn> <mi>m</mi><mo>⁡</mo> <msubsup> <mrow> <mi>v</mi><mo>⁡</mo> </mrow> <mn>0</mn> <mn>2</mn> </msubsup> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "tFV1a", "text": "<math> <mrow><mn>2</mn> <mi>m</mi><mo>⁡</mo> <msubsup> <mrow> <mi>v</mi><mo>⁡</mo> </mrow> <mn>0</mn> <mn>3</mn> </msubsup> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let us take wedge + spring + block as a system. The forces responsible for performing work are spring force kx (←) and the external force F(→).<br /><br /><img alt=\"\" height=\"110\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014759_AnsExp_1.jpg\" style=\"max-width:100%; object-fit:contain\" width=\"242\" /><br /><br />Work Energy theorem for block + spring + plank relative to ground :<br /><br />Applying work-energy theorem, we have W<sub>ext</sub> + W<sub>sp</sub> = ΔK<br /><br />where W<sub>sp</sub> the total work done by the spring on wedge and block <math> <mrow> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>k</mtext> <msup> <mi>x</mi> <mn>2</mn> </msup> </mrow> </math> and ΔK = change in KE of the block (because the plank does not change its kinetic energy)<br /><br /><math> <mrow> <mtext>Then,</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <msub> <mtext>W</mtext> <mtext>ext</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>k</mtext> <msup> <mi>x</mi> <mn>2</mn> </msup> <mo>+</mo> <mtext>Δ</mtext> <mtext>K</mtext> </mrow> </math><br /><br />As the block was initially stationary and it will acquire a velocity v<sub>0</sub> equal to that of the plank at the time of maximum compression of the spring, the change in kinetic energy of the block relative to ground is<br /><br /><math> <mrow> <mtext>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Δ</mtext> <mtext>K</mtext> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mi>m</mi><mo>⁡</mo> <msubsup> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi>v</mi><mo>⁡</mo> </mrow> <mn>0</mn> <mn>2</mn> </msubsup> </mrow> </math><br /><br />Substituting ΔK in the above equation, we have<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <msub> <mtext>W</mtext> <mtext>ext</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>K</mtext> <msup> <mi>x</mi> <mn>2</mn> </msup> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mi>m</mi><mo>⁡</mo> <msubsup> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi>v</mi><mo>⁡</mo> </mrow> <mn>0</mn> <mn>2</mn> </msubsup> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>...(i)</mtext> </mrow> </math><br /><br />Work Energy theorem for block + spring + plank&nbsp; relative to the plank W<sub>ext</sub> + W<sub>sp</sub> = ΔK The plank moves with constant velocity, there is no pseudo-force acting on the block. W<sub>ext</sub>&nbsp;= 0&nbsp;Then the net work done on the system (block + plank), due to the spring, can be given as<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <msub> <mtext>W</mtext> <mtext>SP</mtext> </msub> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>k</mtext> <msup> <mi>x</mi> <mn>2</mn> </msup> </mrow> </math><br /><br />As the relative velocity between the observer (plank) and block decreases from v<sub>0</sub> to zero at the time of maximum compression of the spring, the change in kinetic energy of the block is <math> <mrow> <mtext>Δ</mtext> <mtext>K</mtext> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mi>m</mi><mo>⁡</mo> <msubsup> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi>v</mi><mo>⁡</mo> </mrow> <mn>0</mn> <mn>2</mn> </msubsup> <mtext>.</mtext> </mrow> </math><br /><br />Substituting W<span style=\"font-size: 10.8333px;\"><sub>sp &nbsp;</sub>&nbsp;<span style=\"font-size:12px;\">and</span>&nbsp;&nbsp;</span><math><mover accent=\"false\"><mrow><mo>△</mo><mi>K</mi></mrow></mover></math> in above equation&nbsp;<br />&nbsp;-<math><mrow><mfrac><mrow><mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mi></mi><mi></mi><mi></mi><mi></mi><mi>k</mi><mo>⁡</mo> <msup> <mi>x</mi> <mn>2</mn> </msup> <mo>=</mo>&nbsp;<mtext>-</mtext><mfrac><mrow><mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mi>m</mi><mo>⁡</mo> <msubsup> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi>v</mi><mo>⁡</mo> </mrow> <mn>0</mn> <mn>2</mn>&nbsp;</msubsup></mrow></math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(ii)<br /><br />From (i) &amp; (ii)<br /><math><mrow><msub><mtext>W</mtext> <mtext>ext</mtext> </msub>&nbsp;</mrow></math><math><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><msubsup><mrow><mi>m</mi><mi>v</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><msubsup><mrow><mi>m</mi><mi>v</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>=</mo><msubsup><mrow><mi>m</mi><mi>v</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e63ade483eae614c", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "59", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "As shown in the figure, a chain of mass <math><mi>m</mi></math> is placed on a smooth quarter circular portion of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math>. End <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A&nbsp;</mi></math>is tied with a wedge while the remaining chain is free, then the minimum work required to be done by the external agent to make the chain horizontal keeping point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;fixed, is<br />\r&nbsp; <img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/32472q.png\" style=\"width: 192px; height: 178px;\" />", "image": null}, "options": [{"id": "MKXj2", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mtext>gR</mtext></math>", "image": null, "isCorrect": false}, {"id": "7mOdy", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mtext>g</mtext><mfrac><mrow><mn>2</mn><mtext>R</mtext></mrow><mi>π</mi></mfrac></math>", "image": null, "isCorrect": true}, {"id": "exgeg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mtext>g</mtext><msqrt><mn>2</mn></msqrt><mfrac><mrow><mn>2</mn><mtext>R</mtext></mrow><mi>&#x3C0;</mi></mfrac></math>", "image": null, "isCorrect": false}, {"id": "1M7JA", "text": "None", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Center of mass of the chain is at <math> <mrow> <mfrac> <mrow> <mn>2</mn><mi>R</mi></mrow> <mi>π</mi> </mfrac> </mrow> </math> from horizontal<br /><br />As shown in figure .......<br /><br />Height gain by center of mass is <math> <mrow> <mfrac> <mrow> <mn>2</mn> <mtext>R</mtext> </mrow> <mrow> <mi>π</mi> </mrow> </mfrac> </mrow> </math><br /><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0032472_Ans.jpg\" style=\"width: 223px; height: 99px;\" /><br /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>Wg</mtext><mo>=</mo><mo>-</mo><mi>m</mi><mtext>g</mtext><mfenced><mfrac><mrow><mn>2</mn><mtext>R</mtext></mrow><mi>π</mi></mfrac></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext>W</mtext><mtext>ext.</mtext></msub><mo>=</mo><mo>-</mo><mtext>Wg</mtext><mo>=</mo><mfenced><mrow><mi>m</mi><mtext>g</mtext><mfrac><mrow><mn>2</mn><mtext>R</mtext></mrow><mi>π</mi></mfrac></mrow></mfenced></math><br /><br />&nbsp;&nbsp;<strong>Alternate solution</strong><br /><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/32472q.png\" style=\"width: 192px; height: 178px;\" /><br /><br /><br /><math> <mrow> <msub> <mtext>U</mtext> <mtext>i</mtext> </msub><mo>=</mo> <mo>∫</mo> <mo>-</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>dm</mtext> </mrow> </mfenced> <mtext>gy</mtext> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mtext>g</mtext><mo>∫</mo><mtext>R cos</mtext><mi>θ</mi><mfenced><mfrac><mi>m</mi><mfrac><mi>π</mi><mn>2</mn></mfrac></mfrac></mfenced><mtext>d</mtext><mi>θ</mi></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mfrac><mrow><mn>2</mn><mtext>Rg</mtext><mi>m</mi></mrow><mi>π</mi></mfrac><munderover><mo>∫</mo><mn>0</mn><mfrac><mi>π</mi><mn>2</mn></mfrac></munderover><mo>cos</mo><mi>θ</mi><mtext>d</mtext><mi>θ</mi></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mfrac><mrow><mn>2</mn><mtext>Rg</mtext><mi>m</mi></mrow><mi>π</mi></mfrac><mo>[</mo><mtext>sin</mtext><mi>θ</mi><msubsup><mo>]</mo><mn>0</mn><mrow><mi>π</mi><mo>/</mo><mn>2</mn></mrow></msubsup></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mfrac><mrow><mn>2</mn><mi>m</mi><mtext>gR</mtext></mrow><mi>π</mi></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext>U</mtext><mtext>f</mtext></msub><mo>=</mo><mn>0</mn><mo>⇒</mo><mo>Δ</mo><mtext>U</mtext><mo>=</mo><msub><mtext>w</mtext><mtext>ext</mtext></msub><mo>=</mo><mfrac><mrow><mn>2</mn><mi>m</mi><mtext>gR</mtext></mrow><mi>π</mi></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e3fb30b12b1ab6c0", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "69", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mn>1</mn></msub></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mn>2</mn></msub></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mn>3</mn></msub></math>&nbsp;represent the work done in moving a particle from&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> along three different paths <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math> respectively (as shown) in the gravitational field of a point mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>. Find the correct relation between <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mn>1</mn></msub></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mn>2</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mn>3</mn></msub></math>.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0007534_Ques1_1.jpg\" />", "image": null}, "options": [{"id": "8TYpv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mn>1</mn></msub><mo>&#62;</mo><msub><mi>W</mi><mn>2</mn></msub><mo>&#62;</mo><msub><mi>W</mi><mn>3</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "bnQQr", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mn>1</mn></msub><mo>=</mo><msub><mi>W</mi><mn>2</mn></msub><mo>=</mo><msub><mi>W</mi><mn>3</mn></msub></math>", "image": null, "isCorrect": true}, {"id": "8h1Wz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mn>1</mn></msub><mo>&#60;</mo><msub><mi>W</mi><mn>2</mn></msub><mo>&#60;</mo><msub><mi>W</mi><mn>3</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "OJYZb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mn>2</mn></msub><mo>&#62;</mo><msub><mi>W</mi><mn>1</mn></msub><mo>&#62;</mo><msub><mi>W</mi><mn>3</mn></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Gravitational field is a conservative force field. In a conservative force field work done is path independent", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e21b64314a271bb8", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "05", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>&nbsp;</mo><mi>kg</mi></math> metal block of dimensions <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>16</mn><mo>&nbsp;</mo><mi>cm</mi><mo>×</mo><mn>8</mn><mo>&nbsp;</mo><mi>cm</mi><mo>×</mo><mn>6</mn><mo>&nbsp;</mo><mi>cm</mi></math> is lying on a table with its face of largest area touching the table. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mo>=</mo><mn>10</mn><mo>&nbsp;</mo><msup><mi>ms</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>, then the minimum amount of work done in making it stand with its length vertical is", "image": null}, "options": [{"id": "EoQ5h", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "ktwgB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>.</mo><mn>4</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "mVxPa", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": true}, {"id": "7fwrM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>.</mo><mn>8</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When face of the largest area is touching the table, height of centre of gravity above the table <math> <mrow> <msub> <mrow> <mi></mi><mi>h</mi><mo>⁡</mo> </mrow> <mn>1</mn> </msub> <mo>=</mo> <mfrac> <mrow> <mn>6</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>=</mo> <mn>3</mn> <mspace width=\"0.5em\"></mspace> <mtext>cm</mtext> </mrow> </math><br /><br />With its length vertical, height of centre of gravity would become <math> <mrow> <msub> <mrow> <mi></mi><mi>h</mi><mo>⁡</mo> </mrow> <mn>2</mn> </msub> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>6</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>=</mo> <mn>8</mn> <mspace width=\"0.5em\"></mspace> <mtext>cm</mtext> </mrow> </math><br /><br />Minimum work required W = (P.E.)<sub>2</sub> – (P.E.)<sub>1</sub><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp; &nbsp;&nbsp; &nbsp; &nbsp; = mg(h<sub>2</sub> – h<sub>1</sub>)<br /><br /><math> <mrow> <mi></mi><mi>W</mi><mo>⁡</mo> <mo>=</mo> <mfrac> <mrow> <mn>8</mn> <mo>×</mo> <mn>1</mn> <mn>0</mn> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>8</mn> <mo>-</mo> <mn>3</mn> </mrow> </mfenced> </mrow> <mrow> <mn>1</mn> <mn>0</mn> <mn>0</mn> </mrow> </mfrac> <mo>=</mo> <mn>4</mn> <mspace width=\"0.5em\"></mspace> <mtext>J</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863db8060aa82cf4358", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "102", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A rubber ball is dropped from a height of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> on a plane. It bounces back to a height of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>8</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>. Find the coefficient of the restitution for the collision.", "image": null}, "options": [], "correctValue": "0.6", "solution": {"text": "<p>If the ball is dropped from height&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math>&nbsp;and bounces back to height&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>h</mi><mn>1</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>h</mi><mn>1</mn></msub><mo>=</mo><msup><mi>e</mi><mn>2</mn></msup><mi>h</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>e</mi><mo>=</mo><msqrt><mfrac><msub><mi>h</mi><mn>1</mn></msub><mi>h</mi></mfrac></msqrt></math></p><p>&nbsp; &nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msqrt><mfrac><mrow><mn>1</mn><mo>.</mo><mn>8</mn></mrow><mn>5</mn></mfrac></msqrt><mo>=</mo><mn>0</mn><mo>.</mo><mn>6</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d44f6728735b9421", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "51", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A block of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi>kg</mi></math> is released from the top of a rough incline having&nbsp;<math><mrow><mi>μ</mi> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <msqrt> <mn>3</mn></msq
