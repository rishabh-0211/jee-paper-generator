><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">a</mi></math>", "image": null, "isCorrect": false}, {"id": "sX6eF", "text": "<math><mn>7.2</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo> </mo><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">a</mi></math>", "image": null, "isCorrect": true}, {"id": "odeLI", "text": "<math><mn>3.6</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo> </mo><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">a</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Horizontal component of Earth’s field,<br /><br /><math> <mrow> <mi>H</mi><mo>=</mo><mi>B</mi><mi>cos</mi><mi>θ</mi><mo>,</mo></mrow> </math> since, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>θ</mi><mo>=</mo><mn>60</mn><mo>°</mo></math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/vidoes.PNG\" style=\"width: 150px; height: 154px;\" /><br /><br /><math> <mrow> <mn>3.6</mn><mo>×</mo><msup> <mrow> <mn>10</mn></mrow> <mrow> <mo>−</mo><mn>5</mn></mrow> </msup> <mo>=</mo><mi>B</mi><mo>×</mo><mfrac> <mn>1</mn> <mn>2</mn> </mfrac> <mo>⇒</mo><mi>B</mi><mo>=</mo><mn>7.2</mn><mo>×</mo><msup> <mrow> <mn>10</mn></mrow> <mrow> <mo>−</mo><mn>5</mn></mrow> </msup> </mrow> </math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>tesla</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "6aa3ab79aa8dc1ff6817806f", "title": "Magnetic Equipments", "totalQuestions": 16, "questions": [{"_id": "6151e863fc0f21b15a9875a2", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "91", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two magnets held together in earth's magnetic field when the same polarity together causes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mi>&nbsp;</mi><mtext>v</mtext><mtext>i</mtext><mtext>b</mtext><mo>/</mo><mi>min</mi></math> and when opposite poles&nbsp;<math><mn>4</mn><mi>&nbsp;</mi><mrow><mrow><mtext>v</mtext><mtext>i</mtext><mtext>b</mtext></mrow><mo>/</mo><mrow><mtext>m</mtext><mtext>i</mtext><mtext>n</mtext></mrow></mrow></math>. What is the ratio of magnetic moments?", "image": null}, "options": [], "correctValue": "1.25", "solution": {"text": "Here we use sum and difference method.<br /><br /><math><mfrac><mrow><msub><mrow><mi>M</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>M</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msubsup><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>-</mo><msubsup><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><msubsup><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>+</mo><msubsup><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow></mfrac></math><br /><br />Where <math><msub><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub></math> are time periods<br /><br /><math><mi>T</mi><mi>&nbsp;</mi><mo>∝</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>n</mi></mrow></mfrac></math> <math><mo>(</mo><mo>∵</mo><mi>n</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">q</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">y</mi><mo>.</mo><mo>)</mo></math><br /><br /><math><mo>⇒</mo></math> <math><mfrac><mrow><msub><mrow><mi>M</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>M</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msubsup><mrow><mi>n</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mi>&nbsp;</mi><mo>+</mo><mi>&nbsp;</mi><msubsup><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><msubsup><mrow><mi>n</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mi>&nbsp;</mi><mo>-</mo><mi>&nbsp;</mi><msubsup><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><msup><mfenced separators=\"|\"><mn>12</mn></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced separators=\"|\"><mn>4</mn></mfenced><mn>2</mn></msup></mrow><mrow><msup><mfenced separators=\"|\"><mn>12</mn></mfenced><mn>2</mn></msup><mo>-</mo><msup><mfenced separators=\"|\"><mn>4</mn></mfenced><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>144</mn><mo>+</mo><mn>16</mn></mrow><mrow><mn>144</mn><mo>-</mo><mn>16</mn></mrow></mfrac><mo>=</mo><mfrac><mn>10</mn><mn>8</mn></mfrac><mo>=</mo><mn>1</mn><mo>.</mo><mn>25</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863eedce9d01ec059ab", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "61", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A magnetic needle of negligible breadth and thickness compared to its length, oscillates in a horizontal plane with a period <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math>. The period of oscillation of each part obtained on breaking the magnet into <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>&nbsp;equal parts and perpendicular to the length is", "image": null}, "options": [{"id": "KlVaj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math>", "image": null, "isCorrect": false}, {"id": "kgGSa", "text": "<math> <mrow> <mfrac> <mi>T</mi> <mi>n</mi> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "Or6Oh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mi>T</mi></math>", "image": null, "isCorrect": false}, {"id": "8WJO1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>n</mi></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi mathvariant=\"normal\">T</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">π</mi><msqrt><mfrac><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">B</mi></mrow></mfrac></msqrt></math><br /><br />on breaking n equal parts perpendicular to length<br /><br /><math><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">′</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>12</mn></mrow></mfrac><mi mathvariant=\"normal\">&nbsp;</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mi mathvariant=\"normal\">n</mi></mrow></mfrac></mrow></mfenced><mi mathvariant=\"normal\">&nbsp;</mi><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"script\">l</mi></mrow><mrow><mi mathvariant=\"normal\">n</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></math> of each part<br /><br /><math><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">′</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><msup><mrow><mi mathvariant=\"normal\">n</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow></mfrac><mo>,</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">′</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">M</mi></mrow><mrow><mi mathvariant=\"normal\">n</mi></mrow></mfrac></math><br /><br /><math><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mi mathvariant=\"normal\">′</mi></mrow></msup></mrow><mrow><mi mathvariant=\"normal\">T</mi></mrow></mfrac><mo>=</mo><msqrt><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mi mathvariant=\"normal\">′</mi></mrow></msup></mrow><mrow><msup><mrow><mi mathvariant=\"normal\">M</mi></mrow><mrow><mi mathvariant=\"normal\">′</mi></mrow></msup></mrow></mfrac><mo>×</mo><mfrac><mrow><mi mathvariant=\"normal\">M</mi></mrow><mrow><mi mathvariant=\"normal\">I</mi></mrow></mfrac></msqrt><mo>=</mo><msqrt><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mi mathvariant=\"normal\">n</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow></mfrac><mi mathvariant=\"normal\">&nbsp;</mi><mo>×</mo><mi mathvariant=\"normal\">n</mi></msqrt><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">n</mi></mrow></mfrac><mo>⇒</mo><mi mathvariant=\"normal\">&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mi mathvariant=\"normal\">′</mi></mrow></msup><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mi mathvariant=\"normal\">n</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ed928527c3028c81", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "35", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A deflection magnetometer is placed with its arm along the east-west direction and a bar magnet is placed along the arm of the magnetometer. Due to the magnet, the deflection observed is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">θ</mi></math>&nbsp;and the period of oscillation of the needle in the magnetometer is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi></math>. When the magnet is removed, the period of oscillation is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub></math>. The relation between <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub></math> is", "image": null}, "options": [{"id": "OlBou", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">T</mi><mn>2</mn></msup><mo>=</mo><msubsup><mi mathvariant=\"normal\">T</mi><mn>0</mn><mn>2</mn></msubsup><mi>cos</mi><mo>&#x2061;</mo><mi mathvariant=\"normal\">&#x3B8;</mi></math>", "image": null, "isCorrect": true}, {"id": "urGJL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>=</mo><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub><mi>cos</mi><mo>&#x2061;</mo><mi mathvariant=\"normal\">&#x3B8;</mi></math>", "image": null, "isCorrect": false}, {"id": "mbB8D", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub><mrow><mi>cos</mi><mo>&#x2061;</mo><mi mathvariant=\"normal\">&#x3B8;</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "MVHAM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">T</mi><mn>2</mn></msup><mo>=</mo><mfrac><msubsup><mi mathvariant=\"normal\">T</mi><mn>0</mn><mn>2</mn></msubsup><mrow><mi>cos</mi><mo>&#x2061;</mo><mi mathvariant=\"normal\">&#x3B8;</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In the usual setting of deflection magnetometer, field due to magnet (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">F</mi></math>) and horizontal component (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">H</mi></math>) of earth&#39;s field are perpendicular to each other. Therefore, the net field on the magnetic needle is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><msup><mi mathvariant=\"normal\">F</mi><mn>2</mn></msup><mo>+</mo><msup><mi mathvariant=\"normal\">H</mi><mn>2</mn></msup></msqrt></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><mi mathvariant=\"normal\">T</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi><msqrt><mfrac><mi mathvariant=\"normal\">I</mi><mrow><mi mathvariant=\"normal\">M</mi><msqrt><msup><mi mathvariant=\"normal\">F</mi><mn>2</mn></msup><mo>+</mo><msup><mi mathvariant=\"normal\">H</mi><mn>2</mn></msup></msqrt></mrow></mfrac></msqrt></math> ...(i)<br /><br />When the magnet is removed,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi><msqrt><mfrac><mi mathvariant=\"normal\">I</mi><mi>MH</mi></mfrac></msqrt></math> ...(ii)<br /><br />Also, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\">H</mi></mfrac><mo>=</mo><mi>tan</mi><mo>&#8289;</mo><mi mathvariant=\"normal\">&#952;</mi></math><br /><br />Dividing (i) by (ii), we get<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">T</mi><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub></mfrac><mo>=</mo><msqrt><mfrac><mi mathvariant=\"normal\">H</mi><msqrt><msup><mi mathvariant=\"normal\">F</mi><mn>2</mn></msup><mo>+</mo><msup><mi mathvariant=\"normal\">H</mi><mn>2</mn></msup></msqrt></mfrac></msqrt></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msqrt><mfrac><mi mathvariant=\"normal\">H</mi><msqrt><msup><mi mathvariant=\"normal\">H</mi><mn>2</mn></msup><msup><mi>tan</mi><mn>2</mn></msup><mo>&#8289;</mo><mi mathvariant=\"normal\">&#952;</mi><mo>+</mo><msup><mi mathvariant=\"normal\">H</mi><mn>2</mn></msup></msqrt></mfrac></msqrt><mo>=</mo><msqrt><mfrac><mi mathvariant=\"normal\">H</mi><mrow><mi mathvariant=\"normal\">H</mi><msqrt><msup><mi>sec</mi><mn>2</mn></msup><mo>&#8289;</mo><mi mathvariant=\"normal\">&#952;</mi></msqrt></mrow></mfrac></msqrt><mo>=</mo><msqrt><mi>cos</mi><mo>&#8289;</mo><mi mathvariant=\"normal\">&#952;</mi></msqrt></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable><mtr><mtd><mo>&#8658;</mo><mfrac><msup><mi mathvariant=\"normal\">T</mi><mn>2</mn></msup><msubsup><mi mathvariant=\"normal\">T</mi><mn>0</mn><mn>2</mn></msubsup></mfrac><mo>=</mo><mi>cos</mi><mo>&#8289;</mo><mi mathvariant=\"normal\">&#952;</mi></mtd><mtd><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#8756;</mo><msup><mi mathvariant=\"normal\">T</mi><mn>2</mn></msup><mo>=</mo><msubsup><mi mathvariant=\"normal\">T</mi><mn>0</mn><mn>2</mn></msubsup><mi>cos</mi><mo>&#8289;</mo><mi mathvariant=\"normal\">&#952;</mi></mtd></mtr></m tempted", "lastPracticed": null}, {"_id": "6151e863cabc3f0d6c127f63", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "12", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A magnetic needle free to rotate in a horizontal plane is placed at the centre of a circular current-carrying coil whose axis is perpendicular to the magnetic meridian at that place. It is also known that the magnetic declination at this place is zero and in this condition, the magnetic needle is pointing towards the north-west. Now, if we reverse the direction of current in the coil, then the magnetic needle will", "image": null}, "options": [{"id": "45yKP", "text": "point north-west", "image": null, "isCorrect": false}, {"id": "1ScCI", "text": "point north-east", "image": null, "isCorrect": true}, {"id": "Y09dx", "text": "point south-east", "image": null, "isCorrect": false}, {"id": "44Pno", "text": "point south-west", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If there is no current in the coil, then the needle would point north but due to the magnetic field of the coil, it is pointing north-west. This means the magnetic field due to the coil is towards west and it is equal to the horizontal component of earth's magnetic field. So when we reverse the direction of current the magnetic field due to the coil will be towards east and the magnetic needle will point north-east.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c6e27b567c658be9", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "01", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A magnet makes <math> <mrow> <mn>40</mn></mrow> </math> oscillations per minute at a place having magnetic field induction of <math><mn>0.1</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>–</mo><mn>5</mn></mrow></msup><mi>&nbsp;</mi><mn>T</mn></math>. At another place, it takes <math> <mrow> <mn>2.5</mn><mtext> </mtext><mtext>s</mtext></mrow> </math> to complete one vibration. The value of earth's horizontal field at that place is", "image": null}, "options": [{"id": "cycqd", "text": "<math><mn>0.25</mn><mo>&times;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>&ndash;</mo><mn>6</mn></mrow></msup><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">T</mi></math>", "image": null, "isCorrect": false}, {"id": "fb2Ba", "text": "<math><mn>0.36</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>–</mo><mn>6</mn></mrow></msup><mi>&nbsp;</mi><mn>T</mn></math>", "image": null, "isCorrect": true}, {"id": "1UNFQ", "text": "<math><mn>0.66</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>–</mo><mn>8</mn></mrow></msup><mi>&nbsp;</mi><mn>T</mn></math>", "image": null, "isCorrect": false}, {"id": "1Zzbd", "text": "<math><mn>1.2</mn><mo>&times;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>&ndash;</mo><mn>6</mn></mrow></msup><mi>&nbsp;</mi><mn>T</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi>T</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">π</mi><msqrt><mfrac><mrow><mi>I</mi></mrow><mrow><mi>M</mi><mo>×</mo><msub><mrow><mi>B</mi></mrow><mrow><mi>H</mi></mrow></msub></mrow></mfrac></msqrt><mo>⇒</mo><mi>T</mi><mo>∝</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><msub><mrow><mi>B</mi></mrow><mrow><mi>H</mi></mrow></msub></msqrt></mrow></mfrac></math><br /><br /><math><mo>⇒</mo><mfrac><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><msqrt><mfrac><mrow><mo>(</mo><msub><mrow><mi>B</mi></mrow><mrow><mi>H</mi></mrow></msub><msub><mrow><mo>)</mo></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mo>(</mo><msub><mrow><mi>B</mi></mrow><mrow><mi>H</mi></mrow></msub><msub><mrow><mo>)</mo></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></msqrt><mo>⇒</mo><mfrac><mrow><mrow><mrow><mn>60</mn></mrow><mo>/</mo><mrow><mn>40</mn></mrow></mrow></mrow><mrow><mn>2.5</mn></mrow></mfrac><mo>=</mo><msqrt><mfrac><mrow><mo>(</mo><msub><mrow><mi>B</mi></mrow><mrow><mi>H</mi></mrow></msub><msub><mrow><mo>)</mo></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>0.1</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mo>-</mo><mn>5</mn></mrow></msup></mrow></mfrac></msqrt></math><br /><br /><math><mo>⇒</mo><mo>(</mo><msub><mrow><mi>B</mi></mrow><mrow><mi>H</mi></mrow></msub><msub><mrow><mo>)</mo></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>0.36</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup><mn>&nbsp;T</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b8c84322321714c2", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "105", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A hoop and a solid cylinder of same mass and radius are made of a permanent magnetic material with their respective axes. But the magnetic moment of hoop is twice of solid cylinder. They are placed in a uniform magnetic field in such a manner that their magnetic moments make a small angle with the field. If the osc null}, {"_id": "6151e863362f34170e9d9da3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "104", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A bar magnet has a magnetic moment equal to <math><mn>5</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>5</mn></mrow></msup></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Wb</mi><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>. It is suspended in a magnetic field which has a magnetic induction <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>=</mo><mn>8</mn><mi>π</mi><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>4</mn></mrow></msup><mtext> </mtext><mtext>T</mtext></math>. The magnet vibrates with a period of vibration equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>15&nbsp;s</mtext></math>. The moment of inertia of magnet is", "image": null}, "options": [{"id": "CGYf9", "text": "<math><mn>4.54</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>4</mn></mrow></msup><mi>&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "HmmpI", "text": "<math> <mrow> <mo>&nbsp;</mo><mn>4.54</mn><mo>×</mo><msup> <mrow> <mn>10</mn></mrow> <mrow> <mo>−</mo><mn>5</mn></mrow> </msup> <mo>&nbsp;</mo><mtext>kg&nbsp;</mtext><msup><mtext>m</mtext> <mn>2</mn> </msup> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "dP6aD", "text": "<math> <mrow> <mo>&nbsp;</mo><mn>4.54</mn><mo>×</mo><msup> <mrow> <mn>10</mn></mrow> <mrow> <mo>−</mo><mn>4</mn></mrow> </msup> <mo>&nbsp;</mo><mtext>kg&nbsp;</mtext><msup><mtext>m</mtext> <mn>2</mn> </msup> </mrow> </math>", "image": null, "isCorrect": f sup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "gIW9R", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">A</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "1jZ07", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2.4</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">A</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>According to Curie&#39;s law,</p><p>Magnetization,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>&#8733;</mo><mfrac><mrow><mi>Magnetic</mi><mo>&#160;</mo><mi>Induction</mi><mo>(</mo><mi>B</mi><mo>)</mo></mrow><mrow><mi>A</mi><mi>b</mi><mi>s</mi><mi>o</mi><mi>l</mi><mi>u</mi><mi>t</mi><mi>e</mi><mo>&#160;</mo><mi>t</mi><mi>e</mi><mi>m</mi><mi>p</mi><mi>e</mi><mi>r</mi><mi>a</mi><mi>t</mi><mi>u</mi><mi>r</mi><mi>e</mi><mo>(</mo><mi>T</mi><mo>)</mo></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><msub><mi>I</mi><mn>2</mn></msub><msub><mi>I</mi><mn>1</mn></msub></mfrac><mo>=</mo><mfrac><mrow><msub><mi>B</mi><mn>2</mn></msub><msub><mi>T</mi><mn>1</mn></msub></mrow><mrow><msub><mi>B</mi><mn>1</mn></msub><msub><mi>T</mi><mn>2</mn></msub></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><msub><mi>I</mi><mn>2</mn></msub><mn>8</mn></mfrac><mo>=</mo><mfrac><mrow><mn>0</mn><mo>.</mo><mn>2</mn><mo>&#215;</mo><mn>4</mn></mrow><mrow><mn>0</mn><mo>.</mo><mn>6</mn><mo>&#215;</mo><mn>16</mn></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>I</mi><mn>2</mn></msub><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863de3cbfc23069d3d2", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "33", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If a diamagnetic substance is brought near north or south pole of a bar magnet, it is", "image": null}, "options": [{"id": "0A0Ri", "text": "attracted by poles", "image": null, "isCorrect": false}, {"id": "I2cay", "text": "repelled by poles", "image": null, "isCorrect": true}, {"id": "o8V1H", "text": "repelled by the north pole and attracted by the south pole", "image": null, "isCorrect": false}, {"id": "KwrOj", "text": "attracted by the north pole and repelled by the south pole", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Diagmagnetic substances are repelled by the poles of a bar magnet.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863cbd1a205503367f7", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "07", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The correct set of diamagnetic substances among the following sets are", "image": null}, "options": [{"id": "XMKvb", "text": "aluminum, sodium calcium and oxygen", "image": null, "isCorrect": false}, {"id": "67C0k", "text": "bismuth, copper, lead and silicon", "image": null, "isCorrect": true}, {"id": "FMhPa", "text": "cobalt, nickel, gadolinium and aluminium", "image": null, "isCorrect": false}, {"id": "1PhPN", "text": "silver, niobium, magnesium and calcium", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Bismuth, copper, lead and silicon all are having diamagnetic property as atoms of these material have resultant magnetic moment zero.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b8c84322321714c2", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "105", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A hoop and a solid cylinder of same mass and radius are made of a permanent magnetic material with their respective axes. But the magnetic moment of hoop is twice of solid cylinder. They are placed in a uniform magnetic field in such a manner that their magnetic moments make a small angle with the field. If the oscillation periods of hoop and cylinder are <math><msub><mrow><mi>T</mi></mrow><mrow><mi>h</mi></mrow></msub></math> and <math><msub><mrow><mi>T</mi></mrow><mrow><mi>c</mi></mrow></msub></math> respectively, then:", "image": null}, "options": [{"id": "vq37x", "text": "<math><msub><mrow><mi>T</mi></mrow><mrow><mi>h</mi></mrow></msub><mo>=</mo><mn>2</mn><msub><mrow><mi>T</mi></mrow><mrow><mi>c</mi></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "Ewx9G", "text": "<math><msub><mrow><mi>T</mi></mrow><mrow><mi>h</mi></mrow></msub><mo>=</mo><msub><mrow><mi>T</mi></mrow><mrow><mi>c</mi></mrow></msub></math>", "image": null, "isCorrect": true}, {"id": "GST3g", "text": "<math><msub><mrow><mi>T</mi></mrow><mrow><mi>h</mi></mrow></msub><mo>=</mo><mn>0.5</mn><msub><mrow><mi>T</mi></mrow><mrow><mi>c</mi></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "x723o", "text": "<math><msub><mrow><mi>T</mi></mrow><mrow><mi>h</mi></mrow></msub><mo>=</mo><mn>1.5</mn><msub><mrow><mi>T</mi></mrow><mrow><mi>c</mi></mrow></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Time period of any magnetic body place in an external magnetic field is:-<br/><br/> <math><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>I</mi></mrow><mrow><mi>M</mi><mi>B</mi></mrow></mfrac></msqrt></math> <br/><br/> <math><msub><mrow><mi>T</mi></mrow><mrow><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">p</mi></mrow></msub><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>m</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>M</mi><mi>B</mi></mrow></mfrac></msqrt></math>      ...... <math><mo>(</mo><mn>1</mn><mo>)</mo></math>                 <math><msub><mrow><mi>I</mi></mrow><mrow><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">p</mi></mrow></msub><mo>=</mo><mi>m</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></math> <br/><br/> <math><msub><mrow><mi>T</mi></mrow><mrow><mi>c</mi></mrow></msub><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mfrac><mrow><mi>m</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn></mrow></mfrac></mrow><mrow><mfrac><mrow><mi>M</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mfenced separators=\"|\"><mrow><mi>B</mi></mrow></mfenced></mrow></mfrac><mi> </mi></msqrt></math>              ...... <math><mo>(</mo><mn>2</mn><mo>)</mo></math>                 <math><msub><mrow><mi>I</mi></mrow><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">y</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">r</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>m</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn></mrow></mfrac></math> <br/><br/>From  <math><mo>(</mo><mn>1</mn><mo>)</mo></math>  and  <math><mo>(</mo><mn>2</mn><mo>)</mo></math> <br/><br/> <math><msub><mrow><mi>T</mi></mrow><mrow><mi>h</mi></mrow></msub><mo>=</mo><msub><mrow><mi>T</mi></mrow><mrow><mi>c</mi></mrow></msub></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a410dde356f92f93", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "21", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi mathvariant=\"normal\">H</mi></math> curve for a ferromagnet is shown in the figure. The ferromagnet is placed inside a long solenoid with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1000</mn><mo>&nbsp;</mo><mi>turns</mi><mo>&nbsp;</mo><msup><mi>cm</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. The current that should be passed in the solenoid to demagnetise the ferromagnet completely is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/juka.JPG\" style=\"width: 250px; height: 227px;\" />", "image": null}, "options": [{"id": "hQKQ3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#xA0;</mo><mi>mA</mi></math>", "image": null, "isCorrect": false}, {"id": "Kd7HI", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&#xA0;</mo><mi>&#x3BC;A</mi></math>", "image": null, "isCorrect": false}, {"id": "iA8e7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#xA0;</mo><mi>mA</mi></math>", "image": null, "isCorrect": true}, {"id": "XTGds", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>&#xA0;</mo><mi>&#x3BC;A</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Coercivity of ferromagnet,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">H</mi><mo>=</mo><mn>100</mn><mo>&#160;</mo><mn>A</mn><mo>/</mo><mn>m</mn></math>.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">n</mi><mo>&#215;</mo><mi mathvariant=\"normal\">I</mi><mo>=</mo><mn>100</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi><mo>=</mo><mfrac><mn>100</mn><msup><mn>10</mn><mn>5</mn></msup></mfrac><mo>=</mo><mn>1</mn><mi mathvariant=\"normal\">&#160;</mi><mn>m</mn><mn>A</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637f9e11fd10ae685b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "24", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Which of these materials requires the least value of magnetic field strength to magnetize it?", "image": null}, "options": [{"id": "mj9RF", "text": "Nickel", "image": null, "isCorrect": true}, {"id": "cJ35X", "text": "Silver", "image": null, "isCorrect": false}, {"id": "8icFN", "text": "Tungsten", "image": null, "isCorrect": false}, {"id": "R1WYH", "text": "Sodium Chloride", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The least value of magnetic field strength required to magnetize is nickel because it is a ferromagnetic material. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ni</mi></math> is a ferromagnetic substance which gets strongly magnetized when placed in an external magnetic field. When external magnetic field <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">B</mi><mn>0</mn></msub></math>, is applied the magnetic domains orient themselves in the direction of magnetic filed and grow in size.<br /><br />Hence, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ni</mi></math>&nbsp;requires least value of magnetic strength. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>NaCl</mi></math> is a diamagnetic material. Its field lines are repelled.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863787a833d861a1789", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "90", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A ferromagnetic material is heated above its curie temperature. Which one of the following is the correct statement?", "image": null}, "options": [{"id": "2qk48", "text": "Ferromagnetic domains are perfectly arranged", "image": null, "isCorrect": false}, {"id": "g8Q4j", "text": "Ferromagnetic domains become random", "image": null, "isCorrect": true}, {"id": "TsW4M", "text": "Ferromagnetic domains are not influenced", "image": null, "isCorrect": false}, {"id": "ducf5", "text": "Ferromagnetic material changes into diamagnetic material", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Beyond curie temperature, ferromagnetic material turns into paramagnetic material, as if ferromagnetic domains become random.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863199919e484ab993e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "36", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The correct graph which shows the variation of paramagnetic susceptibility <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn mathvariant=\"italic\">S</mn></math> with temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> is", "image": null}, "options": [{"id": "meDlS", "text": "<br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/zSdfasdfasdfds123.jpg\" style=\"width: 250px; height: 177px;\" />", "image": null, "isCorrect": false}, {"id": "6UaVq", "text": "<br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/zSdfasdfasdfds1234567.jpg\" style=\"width: 250px; height: 177px;\" />", "image": null, "isCorrect": false}, {"id": "pNgSS", "text": "<br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/zSdfasdfasdfds12345.jpg\" style=\"width: 250px; height: 177px;\" />", "image": null, "isCorrect": true}, {"id": "z5eai", "text": "<br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/zSdfasdfasdfds123456.jpg\" style=\"width: 250px; height: 177px;\" />", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Paramagnetic susceptibility is inversely proportional to temperature.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mo>&#8733;</mo><mfrac><mn>1</mn><mi>T</mi></mfrac></math> . The graph is a hyperbola", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630d025f6dafc824c2", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "31", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "For protecting sensitive equipment from an external magnetic field, which among the following is the most effective solution?", "image": null}, "options": [{"id": "tS6zl", "text": "Wrap insulation around it", "image": null, "isCorrect": false}, {"id": "udVbO", "text": "Place inside an iron can", "image": null, "isCorrect": true}, {"id": "mgTBy", "text": "Surround with fine copper sheet", "image": null, "isCorrect": false}, {"id": "YfxjK", "text": "Place inside an aluminum can", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The iron can produce a magnetic screening for the equipment as most of the magnetic lines of force will flow through iron and very less number of lines will be present in the space around the equipment.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
