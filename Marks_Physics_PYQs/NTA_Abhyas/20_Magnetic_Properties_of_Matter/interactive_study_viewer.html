normal\">&theta;</mi><mo>=</mo><mn>30</mn><mo>&deg;</mo></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b18e7b488d696b66", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "22", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The distance of two points on the axis of a magnet from its centre is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi>cm</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mi>cm</mi></math> respectively. The ratio of magnetic intensity at these points is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>.</mo><mn>5</mn><mo>:</mo><mn>1</mn></math>. The length of the magnet will be", "image": null}, "options": [{"id": "ySqTw", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#xA0;</mo><mi>cm</mi></math>", "image": null, "isCorrect": false}, {"id": "EmU7l", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>25</mn><mo>&#xA0;</mo><mi>cm</mi></math>", "image": null, "isCorrect": false}, {"id": "isyvx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&#xA0;</mo><mi>cm</mi></math>", "image": null, "isCorrect": false}, {"id": "DfoXh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi>cm</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>The magnetic field on the axis of a bar magnet of length&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">l</mi></math>, having a pole strength&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math>,&nbsp;at a distance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">d</mi></math>&nbsp;is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">&#956;</mi><mn>0</mn></msub><mrow><mn>4</mn><mi mathvariant=\"normal\">&#960;</mi></mrow></mfrac><mfrac><mi mathvariant=\"normal\">m</mi><msup><mfenced open=\"[\" close=\"]\"><mrow><mi mathvariant=\"normal\">d</mi><mo>-</mo><mi mathvariant=\"normal\">l</mi></mrow></mfenced><mn>2</mn></msup></mfrac><mo>-</mo><mfrac><msub><mi mathvariant=\"normal\">&#956;</mi><mn>0</mn></msub><mrow><mn>4</mn><mi mathvariant=\"normal\">&#960;</mi></mrow></mfrac><mfrac><mi mathvariant=\"normal\">m</mi><msup><mfenced open=\"[\" close=\"]\"><mrow><mi mathvariant=\"normal\">d</mi><mo>+</mo><mi mathvariant=\"normal\">l</mi></mrow></mfenced><mn>2</mn></msup></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo>=</mo><mfrac><mrow><msub><mi mathvariant=\"normal\">&#956;</mi><mn>0</mn></msub><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>4</mn><mi mathvariant=\"normal\">&#960;</mi></mrow></mfrac><mfrac><mrow><msup><mfenced open=\"[\" close=\"]\"><mrow><mi mathvariant=\"normal\">d</mi><mo>+</mo><mi mathvariant=\"normal\">l</mi></mrow></mfenced><mn>2</mn></msup><mo>-</mo><msup><mfenced open=\"[\" close=\"]\"><mrow><mi mathvariant=\"normal\">d</mi><mo>-</mo><mi mathvariant=\"normal\">l</mi></mrow></mfenced><mn>2</mn></msup></mrow><msup><mfenced open=\"[\" close=\"]\"><mrow><msup><mi mathvariant=\"normal\">d</mi><mn>2</mn></msup><mo>-</mo><msup><mi mathvariant=\"normal\">l</mi><mn>2</mn></msup></mrow></mfenced><mn>2</mn></msup></mfrac><mo>=</mo><mfrac><mrow><msub><mi mathvariant=\"normal\">&#956;</mi><mn>0</mn></msub><mi>mld</mi></mrow><mrow><mi mathvariant=\"normal\">&#960;</mi><msup><mfenced open=\"[\" close=\"]\"><mrow><msup><mi mathvariant=\"normal\">d</mi><mn>2</mn></msup><mo>-</mo><msup><mi mathvariant=\"normal\">l</mi><mn>2</mn></msup></mrow></mfenced><mn>2</mn></msup></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><msub><mi mathvariant=\"normal\">B</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">B</mi><mn>2</mn></msub></mfrac><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mfrac><msub><mi mathvariant=\"normal\">d</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">d</mi><mn>2</mn></msub></mfrac><mi mathvariant=\"normal\">&#160;</mi><msup><mfenced open=\"[\" close=\"]\" separators=\"|\"><mfrac><mrow><msubsup><mi mathvariant=\"normal\">d</mi><mn>2</mn><mn>2</mn></msubsup><mo>-</mo><msup><mi mathvariant=\"normal\">l</mi><mn>2</mn></msup></mrow><mrow><msubsup><mi mathvariant=\"normal\">d</mi><mn>1</mn><mn>2</mn></msubsup><mo>-</mo><msup><mi mathvariant=\"normal\">l</mi><mn>2</mn></msup></mrow></mfrac></mfenced><mn>2</mn></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><mn>12</mn><mo>.5</mo></mrow><mn>1</mn></mfrac><mo>=</mo><mfrac><mn>10</mn><mn>20</mn></mfrac><mi mathvariant=\"normal\">&#160;</mi><msup><mfenced close=\"]\" open=\"[\" separators=\"|\"><mfrac><mrow><mn>400</mn><mo>-</mo><msup><mi mathvariant=\"normal\">l</mi><mn>2</mn></msup></mrow><mrow><mn>100</mn><mo>-</mo><msup><mi mathvariant=\"normal\">l</mi><mn>2</mn></msup></mrow></mfrac></mfenced><mn>2</mn></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">l</mi><mo>= 5</mo><mi>cm</mi></math><br /><br />Hence, length of magnet <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">l</mi><mo>= 10</mo><mi>cm</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86394236ddfd7b8063f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "11", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If the magnetic moment and the pole strength of a bar magnet are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3.6</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">A</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>120</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math>, then its magnetic length is", "image": null}, "options": [{"id": "E8uuP", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>&#xA0;</mi><mn>c</mn><mn>m</mn></math>", "image": null, "isCorrect": true}, {"id": "p8BU1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0.3</mn><mi>&#xA0;</mi><mn>c</mn><mn>m</mn></math>", "image": null, "isCorrect": false}, {"id": "NOgSm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3.3</mn><mi>&#xA0;</mi><mn>c</mn><mn>m</mn></math>", "image": null, "isCorrect": false}, {"id": "duoX5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>33</mn><mi>&#xA0;</mi><mn>c</mn><mn>m</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>For a bar magnet, the magnetic moment is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mi>p</mi><mi>o</mi><mi>l</mi><mi>e</mi><mo>&#160;</mo><mi>s</mi><mi>t</mi><mi>r</mi><mi>e</mi><mi>n</mi><mi>g</mi><mi>t</mi><mi>h</mi><mo>&#215;</mo><mi>m</mi><mi>a</mi><mi>g</mi><mi>n</mi><mi>e</mi><mi>t</mi><mi>i</mi><mi>c</mi><mo>&#160;</mo><mi>l</mi><mi>e</mi><mi>n</mi><mi>g</mi><mi>t</mi><mi>h</mi></math></p><p>So the magnetic length will be<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>l</mi><mi>mag</mi></msub><mo>=</mo><mfrac><mi>M</mi><mi>m</mi></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>l</mi><mi>mag</mi></msub><mo>=</mo><mfrac><mrow><mn>3.6</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup></mrow><mrow><mn>120</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup></mrow></mfrac><mo>=</mo><mn>3</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>2</mn></mrow></msup><mi>&#160;</mi><mn>m</mn><mo>=</mo><mn>3</mn><mi>&#160;</mi><mn>c</mn><mn>m</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86392007d3b30340cf0", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "27", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A vibration magnetometer consists of two identical bar magnets placed one over the other such that they are mutually perpendicular and bisect each other. The time period of the combination is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">s</mi></math>. If one of the magnets is removed, then the time period of other one will be", "image": null}, "options": [{"id": "VxRAV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>5.78</mtext><mo>&#xA0;</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "1dQfS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>3.36</mtext><mo>&#xA0;</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": true}, {"id": "oFf5F", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>4.36</mtext><mo>&#xA0;</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "e3xMy", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>5.36</mtext><mo>&#xA0;</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As magnets are perpendicular to each other, the resultant magnetic moment<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">M</mi><mo>'</mo><mo>=</mo><msqrt><msup><mi mathvariant=\"normal\">M</mi><mn>2</mn></msup><mo>+</mo><msup><mi mathvariant=\"normal\">M</mi><mn>2</mn></msup></msqrt><mo>=</mo><msqrt><mn>2</mn></msqrt><mo>&nbsp;</mo><mi mathvariant=\"normal\">M</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mo>&nbsp;&nbsp;</mo><msub><mi mathvariant=\"normal\">T</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">π</mi><msqrt><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">I</mi></mrow><mrow><mfenced><mrow><msqrt><mn>2</mn></msqrt><mi mathvariant=\"normal\">M</mi></mrow></mfenced><mi mathvariant=\"normal\">H</mi></mrow></mfrac></msqrt></math>&nbsp;<br /><br />In the second case, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">T</mi><mn>2</mn></msub><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">π</mi><msqrt><mfrac><mi mathvariant=\"normal\">I</mi><mi>MH</mi></mfrac></msqrt></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi mathvariant=\"normal\">T</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">T</mi><mn>1</mn></msub></mfrac><mo>=</mo><mfrac><mn>1</mn><msup><mfenced separators=\"|\"><mn>2</mn></mfenced><mrow><mn>1</mn><mo>/</mo><mn>4</mn></mrow></msup></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</mo><msub><mi mathvariant=\"normal\">T</mi><mn>2</mn></msub><mo>=</mo><mfrac><mn>4</mn><msup><mfenced separators=\"|\"><mn>2</mn></mfenced><mrow><mn>1</mn><mo>/</mo><mn>4</mn></mrow></msup></mfrac><mo>=</mo><mtext>3.36</mtext><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">s</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637f9e11fd10ae685b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "24", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Which of these materials requires the least value of magnetic field strength to magnetize it?", "image": null}, "options": [{"id": "mj9RF", "text": "Nickel", "image": null, "isCorrect": true}, {"id": "cJ35X", "text": "Silver", "image": null, "isCorrect": false}, {"id": "8icFN", "text": "Tungsten", "image": null, "isCorrect": false}, {"id": "R1WYH", "text": "Sodium Chloride", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The least value of magnetic field strength required to magnetize is nickel because it is a ferromagnetic material. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ni</mi></math> is a ferromagnetic substance which gets strongly magnetized when placed in an external magnetic field. When external magnetic field <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">B</mi><mn>0</mn></msub></math>, is applied the magnetic domains orient themselves in the direction of magnetic filed and grow in size.<br /><br />Hence, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ni</mi></math>&nbsp;requires least value of magnetic strength. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>NaCl</mi></math> is a diamagnetic material. Its field lines are repelled.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637d059a5b0854a221", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "18", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A magnetic dipole is acted upon by two magnetic fields which are inclined to each other at an angle of <math><msup><mrow><mn>75</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math>. One of the fields has a magnitude of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>&nbsp;</mo><mi>mT</mi></math>. The dipole attains stable equilibrium at an angle of <math><msup><mrow><mn>30</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math> with this field. The magnitude of the other field (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>mT</mi></math>) is close to", "image": null}, "options": [{"id": "T97e9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "NfI3U", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>11</mn></math>", "image": null, "isCorrect": true}, {"id": "I8pNo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>36</mn></math>", "image": null, "isCorrect": false}, {"id": "Abgrc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1060</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <msub> <mi>θ</mi> <mn>1</mn> </msub> <mo>+</mo><mi>θ</mi><mo>=</mo><msup> <mrow> <mn>75</mn></mrow> <mi>o</mi> </msup> </mrow> </math><br /><br /><math> <mi>M</mi><msub> <mi>B</mi> <mn>1</mn> </msub> <mi>sin</mi><msub> <mi>θ</mi> <mn>1</mn> </msub> <mo>=</mo><mi>M</mi><msub> <mi>B</mi> <mn>2</mn> </msub> <mi>sin</mi><mi>θ</mi> </math><br /><br /><math> <mo>⇒</mo><mfrac> <mrow> <msub> <mi>B</mi> <mn>1</mn> </msub> </mrow> <mrow> <msqrt> <mn>2</mn> </msqrt> </mrow> </mfrac> <mo>=</mo><mfrac> <mrow> <mn>15</mn> </mrow> <mn>2</mn> </mfrac> </math><br /><br /><math> <mo>⇒</mo><msub> <mi>B</mi> <mn>1</mn> </msub> <mo>=</mo> <mfrac> <mrow> <mn>15</mn> </mrow> <mrow> <msqrt> <mn>2</mn> </msqrt> </mrow> </mfrac> <mo>≈</mo><mn>11&nbsp;</mn><mn>m</mn><mn>T</mn> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637c9a2e68866fa7a6", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "25", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two bar magnets&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathM ext>M</mtext> <mtext>B</mtext> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> <msup> <mn>0</mn> <mn>2</mn> </msup> <mo>+</mo> <mn>1</mn> <msup> <mn>5</mn> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn> <msup> <mn>0</mn> <mn>2</mn> </msup> <mo>-</mo> <mn>1</mn> <msup> <mn>5</mn> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </math><br />&nbsp;<br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math><mrow><mo> =</mo><mfrac linethickness=\"1\"><mrow><mn>400</mn><mo>+</mo><mn>225</mn></mrow><mrow><mn>400</mn><mo>-</mo><mn>225</mn></mrow></mfrac></mrow></math><br />&nbsp;<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">A</mi></msub><mo>:</mo><msub><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">B</mi></msub><mo>=</mo><mn>25</mn><mo>:</mo><mn>7</mn></math><br />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635c728da3f08858d6", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "02", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The mid points of two small magnetic dipoles of length <math> <mtext>d</mtext> </math> in end-on positions, are separated by a distance <math> <mtext>x</mtext></math><math>&nbsp;<mrow><mfenced><mrow><mtext>x</mtext><mo>&gt;</mo><mo>&gt;</mo><mtext>d</mtext></mrow></mfenced></mrow></math>. The magnitude of force between them is proportional to <math> <mrow> <msup> <mtext>x</mtext> <mrow> <mo>−</mo><mtext>n</mtext></mrow> </msup> </mrow> </math> where n is :<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0025910_AnsExp_1.jpg\" style=\"widt ategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635c11dd90c1ce6a89", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "04", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A magnetic dipole is placed in a uniform magnetic field of intensity&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>,&nbsp;oriented along the direction of the field.<em>&nbsp;</em>If the&nbsp;magnetic dipole moment is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math>,&nbsp;then the&nbsp;maximum work an external agent can perform in rotating the dipole will be", "image": null}, "options": [{"id": "rLp37", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>M</mi><mi>B</mi></math>", "image": null, "isCorrect": false}, {"id": "WFS35", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi>M</mi><mi>B</mi></math>", "image": null, "isCorrect": false}, {"id": "WidgF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>M</mi><mi>B</mi></math>", "image": null, "isCorrect": true}, {"id": "A31fK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><mi>B</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The maximum work done by an external agent is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><msub><mi>U</mi><mrow><mn>180</mn><mo>&#176;</mo></mrow></msub><mo>-</mo><msub><mi>U</mi><mrow><mn>0</mn><mo>&#176;</mo></mrow></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mi>M</mi><mi>B</mi><mo>-</mo><mfenced><mrow><mo>-</mo><mi>M</mi><mi>B</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mn>2</mn><mi>M</mi><mi>B</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86342a16d6e0c181b4b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "14", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>If at a distance of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>&nbsp;</mo><mi>cm</mi></math>&nbsp;at an axial position of a dipole, the \"magnetic potential\" (analogous to electric potential) is&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.4</mo><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">J</mi><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>, then the magnetic moment of the dipole is</p>\r", "image": null}, "options": [{"id": "zwtF8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>28.6</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">A</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math>", "image": null, "isCorrect": false}, {"id": "toqaH", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>32.2</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">A</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math>", "image": null, "isCorrect": false}, {"id": "rOAoP", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>38.4</mn><mo>&#xA0;</mo><mi mathvari i mathvariant=\"normal\">g&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "HmmpI", "text": "<math> <mrow> <mo>&nbsp;</mo><mn>4.54</mn><mo>×</mo><msup> <mrow> <mn>10</mn></mrow> <mrow> <mo>−</mo><mn>5</mn></mrow> </msup> <mo>&nbsp;</mo><mtext>kg&nbsp;</mtext><msup><mtext>m</mtext> <mn>2</mn> </msup> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "dP6aD", "text": "<math> <mrow> <mo>&nbsp;</mo><mn>4.54</mn><mo>×</mo><msup> <mrow> <mn>10</mn></mrow> <mrow> <mo>−</mo><mn>4</mn></mrow> </msup> <mo>&nbsp;</mo><mtext>kg&nbsp;</mtext><msup><mtext>m</mtext> <mn>2</mn> </msup> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "pEkKH", "text": "<math> <mrow> <mo>&nbsp;</mo><mn>4.54</mn><mo>×</mo><msup> <mrow> <mn>10</mn></mrow> <mn>5</mn> </msup> <mo>&nbsp;</mo><mtext>kg</mtext><msup><mtext>m</mtext> <mn>2</mn> </msup> </mrow> </math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Here, magnetic moment is given in weber-meter, which is the unit of <math><msub><mrow><mi>μ</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>&nbsp;</mi><mi>M</mi></math>.<br /><br /><math><mo>∴&nbsp;&nbsp;&nbsp;&nbsp;</mo><msub><mrow><mi mathvariant=\"normal\">μ</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>&nbsp;</mi><mi>M</mi><mo>=</mo><mn>5</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>5</mn></mrow></msup></math> Wb-m<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math><mi>M</mi><mo>=</mo><mfrac><mrow><mn>5</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>5</mn></mrow></msup></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">μ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac><mi mathvariant=\"normal\">A</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br />Also,&nbsp;&nbsp;&nbsp; <math><mi>B</mi><mo>=</mo><mn>8</mn><mi>π</mi><m  null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86320e0d371921ee05e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "09", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An electron of charge <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>e</mi></math>&nbsp;is moving in a circular orbit of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>&nbsp;around a nucleus, at a frequency&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#965;</mi></math>. The&nbsp;magnetic moment associated with the orbital motion of the electron is", "image": null}, "options": [{"id": "EEMa6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>&#x3C0;</mi><mi>&#x3C5;</mi><mi>e</mi><msup><mi>r</mi><mn>2</mn></msup></math>", "image": null, "isCorrect": false}, {"id": "whi8D", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>&#x3C0;</mi><mi>&#x3C5;</mi><msup><mi>r</mi><mn>2</mn></msup></mrow><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "ryupq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#x3C0;</mi><mi>e</mi><mi>&#x3C5;</mi><msup><mi>r</mi><mn>2</mn></msup></math>", "image": null, "isCorrect": true}, {"id": "HNOfd", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>&#x3C0;</mi><mi>&#x3C5;</mi><msup><mi>r</mi><mn>2</mn></msup></mrow><mn>4</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The equivalent current due to the motion of the electron is&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>i</mi><mo>=</mo><mi>e</mi><mi>&#965;</mi></math></p><p>So, the magnetic moment will be</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><mo>=</mo><mi>i</mi><mo>&#215;</mo><mi>&#960;</mi><msup><mi>r</mi><mn>2</mn></msup><mo>=</mo><mi>&#960;</mi><mi>e</mi><mi>&#965;</mi><msup><mi>r</mi><mn>2</mn></msup></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863199919e484ab993e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "36", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The correct graph which shows the variation of paramagnetic susceptibility <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn mathvariant=\"italic\">S</mn></math> with temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> is", "image": null}, "options": [{"id": "meDlS", "text": "<br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/zSdfasdfasdfds123.jpg\" style=\"width: 250px; height: 177px;\" />", "image": null, "isCorrect": false}, {"id": "6UaVq", "text": "<br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/zSdfasdfasdfds1234567.jpg\" style=\"width: 250px; height: 177px;\" />", "image": null, "isCorrect": false}, {"id": "pNgSS", "text": "<br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/zSdfasdfasdfds12345.jpg\" style=\"width: 250px; height: 177px;\" />", "image": null, "isCorrect": true}, {"id": "z5eai", "text": "<br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/zSdfasdfasdfds123456.jpg\" style=\"width: 250px; height: 177px;\" />", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Paramagnetic susceptibility is inversely proportional to temperature.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mo>&#8733;</mo><mfrac><mn>1</mn><mi>T</mi></mfrac></math> . The graph is a hyperbola", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630b6b693ef7557c1d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "05", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>&nbsp;is the orbital radius and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math>&nbsp;is the orbital velocity of an electron in a hydrogen atom, then its magnetic dipole moment is", "image": null}, "options": [{"id": "CYsXM", "text": "<div><p align=\"left\" style=\"text-align:left;\" ><span  style=\"position:relative;top:0.0pt\">&nbsp;<math>  <mrow>   <mfrac>    <mrow>     <mi>e</mi><mi>v</mi><mi>r</mi>    </mrow>    <mrow>     <mn>2</mn><mi>&pi;</mi>    </mrow>   </mfrac>     </mrow> </math>  </span></p><p ><span ></span></p><p ><span ></span></p><p ><span ></span></p><p ><span ></span></p><p ><span ></span></p><p align=\"center\" style=\"text-align:center\" ><span ></span></p></div>", "image": null, "isCorrect": false}, {"id": "8jcMm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>e</mi><mi>v</mi><mi>r</mi></math>", "image": null, "isCorrect": false}, {"id": "Hnh3b", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>e</mi><mi>v</mi><mi>r</mi></mrow><mn>2</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "hoVP6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>e</mi><mi>v</mi><mi>r</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<div><p><b><span>The magnetic dipole moment of a revolving electron:</span></b><span> The electron of change (&ndash;<i>e</i>) performs uniforms circular motion around a stationary&nbsp;heavy nucleus of charge +<i>Ze</i>. This constitutes a current <i>I</i>.</span></p><p align=\"center\" style=\"text-align:center;\"><span><img alt=\"\" height=\"199\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/IL0003569_AnsExp4_1.png\" width=\"276\" /></span></p><p><span style=\"position:relative;top:0.0pt\">&nbsp;<math> <mo>&#8756;</mo> </math> </span><span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mi>I</mi><mo>=</mo><mfrac> <mi>e</mi> <mi>T</mi> </mfrac> </mrow> </math> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(i)</span></p><p><span>Where, <i>T</i> is the time period of revolution. Let <i>r</i> be the orbital radius of electron and <i>v</i> the orbital speed. Then</span></p><p><span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;<math> <mrow> <mi>T</mi><mo>=</mo><mfrac> <mrow> <mn>2</mn><mi>&#960;</mi><mi>r</mi> </mrow> <mi>&#965;</mi> </mfrac> </mrow> </math> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(ii)</span></p><p><span>Substituting the value of <i>T</i> in (i), we get</span></p><p><span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;<math> <mrow> <mi>I</mi><mo>=</mo><mfrac> <mi>e</mi> <mrow> <mfrac> <mrow> <mn>2</mn><mi>&#960;</mi><mi>r</mi> </mrow> <mi>&#965;</mi> </mfrac> </mrow> </mfrac> <mo>=</mo><mfrac> <mrow> <mi>e</mi><mi>&#965;</mi> </mrow> <mrow> <mn>2</mn><mi>&#960;</mi><mi>r</mi> </mrow> </mfrac> </mrow> </math> </span></p><p><span>The magnetic moment (<i>m</i>) associated with this circular current is</span></p><p><span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;<math> <mrow> <mi>m</mi><mo>=</mo><mi>I</mi><mi>&#960;</mi><msup> <mi>r</mi> <mn>2</mn> </msup> </mrow> </math> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mrow><mo>[</mo> <mrow> <mo>&#8757;</mo><mover accent=\"true\"> <mi>m</mi> <mo stretchy=\"true\">&#8594;</mo> </mover> <mo>=</mo><mi>I</mi><mover accent=\"true\"> <mi>A</mi> <mo stretchy=\"true\">&#8594;</mo> </mover> </mrow> <mo>]</mo></mrow> </mrow> </math> </span></p><p><span style=\"position:relative;top:0.0pt\">&nbsp;<math> <mo>&#8756;</mo> </math> </span><span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mi>m</mi><mo>=</mo><mfrac> <mrow> <mi>e</mi><mi>&#965;</mi> </mrow> <mrow> <mn>2</mn><mi>&#960;</mi><mi>r</mi> </mrow> </mfrac> <mo>&#8901;</mo><mi>&#960;</mi><msup> <mi>r</mi> <mn>2</mn> </msup> <mo>=</mo><mfrac> <mrow> <mi>e</mi><mi>&#965;</mi><mi>r</mi> </mrow> <mn>2</mn> </mfrac> </mrow> </math></span></p></div>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630b4c318c0d77d432", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "108", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The magnetic needle of a vibration magnetometer makes 12 oscillations per minute in the horizontal component of earth's magnetic field. When an external short bar magnet is placed at some distance along the axis of the needle in the same line, it makes 15 oscillations per minute. If the poles of the bar magnet are interchanged, the number of oscillations it makes per minute is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mi>n</mi></msqrt></math>. What is the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>?", "image": null}, "options": [], "correctValue": "63", "solution": {"text": "<strong>Ist case :</strong><br /><br /><math><mi>n</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><mi>&#960;</mi></mrow></mfrac><msqrt><mfrac><mrow><mi>M</mi><msub><mrow><mi>B</mi></mrow><mrow><mi>H</mi></mrow></msub></mrow><mrow><mi>I</mi></mrow></mfrac></msqrt></math><br /><br /><math><mo>&#8658;&#160;&#160;&#160;&#160;</mo><mi>n</mi><mo>&#8733;</mo><msqrt><msub><mrow><mi>B</mi></mrow><mrow><mi>H</mi></mrow></msub></msqrt><mo>&#160;&#8658;&#160;</mo><mfrac><mrow><msub><mrow><mi>n</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><msqrt><mfrac><mrow><msub><mrow><mi>B</mi></mrow><mrow><mi>H</mi></mrow></msub></mrow><mrow><msub><mrow><mi>B</mi></mrow><mrow><mi>H</mi></mrow></msub><mo>+</mo><msub><mrow><msub><mrow><mi>B</mi></mro row><mrow><mi>H</mi></mrow></msub><mo>-</mo><mfrac><mrow><mn>9</mn></mrow><mrow><mn>16</mn></mrow></mfrac><msub><mrow><mi>B</mi></mrow><mrow><mi>H</mi></mrow></msub></mrow></mfrac></msqrt></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><msub><mi>n</mi><mn>3</mn></msub><mo>=</mo><msqrt><mn>63</mn></msqrt><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mi>n</mi><mo>=</mo><mn>63</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630a5bdcd063d6e05f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "32", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A magnet is cut in four equal parts by cutting it parallel to its length. The time period of each part, if the time period of the original magnet in the same field is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub></math>, will be</p>\r", "image": null}, "options": [{"id": "trT4Y", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub></math>", "image": null, "isCorrect": true}, {"id": "Jo0O6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "SMAUt", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub><mn>4</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "GolwL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For each part, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">I</mi><mn>1</mn></msub><mo>=</mo><mfrac><mi mathvariant=\"normal\">I</mi><mn>4</mn></mfrac></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">M</mi><mn>1</mn></msub><mo>=</mo><mfrac><mi mathvariant=\"normal\">M</mi><mn>4</mn></mfrac></math>.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">T</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi><msqrt><mfenced separators=\"|\"><mfrac><mi mathvariant=\"normal\">I</mi><mi>MB</mi></mfrac></mfenced></msqrt></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">T</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi><msqrt><mfenced separators=\"|\"><mfrac><msub><mi mathvariant=\"normal\">I</mi><mn>1</mn></msub><mrow><msub><mi mathvariant=\"normal\">M</mi><mn>1</mn></msub><mi mathvariant=\"normal\">B</mi></mrow></mfrac></mfenced></msqrt></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi><msqrt><mfenced separators=\"|\"><mfrac><mrow><mi mathvariant=\"normal\">I</mi><mo>&#215;</mo><mn>4</mn></mrow><mrow><mn>4</mn><mi mathvariant=\"normal\">M</mi><mo>&#215;</mo><mi mathvariant=\"normal\">B</mi></mrow></mfrac></mfenced></msqrt></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><mfrac><msub><mi mathvariant=\"normal\">T</mi><mn>1</mn></msub><mi mathvariant=\"normal\">T</mi></mfrac><mo>=</mo><mn>1</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><mi mathvariant=\"normal\">&#160;</mi><msub><mi mathvariant=\"normal\">T</mi><mn>1</mn></msub><mo>=</mo><mi mathvariant=\"normal\">T</mi><mo>=</mo><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630811b883dc7897d6", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "08", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In a uniform magnetic field of strength <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>15</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">T</mi></math>, a&nbsp;short bar magnet of magnetic moment <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>32</mn><mo>&nbsp;</mo><msup><mi>J T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> is placed. The potential energy of the magnet in its unstable equilibrium position is", "image": null}, "options": [{"id": "QK9o4", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>.</mo><mn>8</mn><mo>&#xD7;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>&#xA0;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": true}, {"id": "2a86I", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mo>.</mo><mn>6</mn><mo>&#xD7;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>&#xA0;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "Wagg6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>8</mn><mo>&#xD7;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>&#xA0;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "FF0Dq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>2</mn><mo>&#xD7;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>&#xA0;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the unstable equilibrium, the angle between the magnetic moment and magnetic field is 180<sup>o</sup>. ( <math> <mrow> <mo>∵</mo> </mrow> </math>&nbsp; In this position it will be in a direction perpendicular to magnetic field thus maximum torque will act on it.)<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math> <mrow> <mi>θ</mi> <mo>=</mo> <mn>1</mn> <mn>8</mn> <msup> <mn>0</mn> <mtext>o</mtext> </msup> </mrow> </math><br /><br />Potential energy of the magnet<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; U = - mB cos 180<sup>o</sup><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; = - 0.32 x 0.15 (- 1) = 4.8 x 10<sup>-2</sup> J<br /><br />Thus, for the unstable equilibrium the potential energy is 4.8 x 10<sup>-2</sup> J.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "6aa3ab79aa8dc1ff6817806e", "title": "Earths Magnetic Field", "totalQuestions": 8, "questions": [{"_id": "6151e863fc0f21b15a9875a2", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "91", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two magnets held together in earth's magnetic field when the same polarity together causes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mi>&nbsp;</mi><mtext>v</mtext><mtext>i</mtext><mtext>b</mtext><mo>/</mo><mi>min</mi></math> and when opposite poles&nbsp;<math><mn>4</mn><mi>&nbsp;</mi><mrow><mrow><mtext>v</mtext><mtext>i</mtext><mtext>b</mtext></mrow><mo>/</mo><mrow><mtext>m</mtext><mtext>i</mtext><mtext>n</mtext></mrow></mrow></math>. What is the ratio of magnetic moments?", "image": null}, "options": [], "correctValue": "1.25", "solution": {"text": "Here we use sum and difference method.<br /><br /><math><mfrac><mrow><msub><mrow><mi>M</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>M</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msubsup><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>-</mo><msubsup><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><msubsup><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>+</mo><msubsup><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow></mfrac></math><br /><br />Where <math><msub><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub></math> are time periods<br /><br /><math><mi>T</mi><mi>&nbsp;</mi><mo>∝</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>n</mi></mrow></mfrac></math> <math><mo>(</mo><mo>∵</mo><mi>n</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">q</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">y</mi><mo>.</mo><mo>)</mo></math><br /><br /><math><mo>⇒</mo></math> <math><mfrac><mrow><msub><mrow><mi>M</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>M</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msubsup><mrow><mi>n</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mi>&nbsp;</mi><mo>+</mo><mi>&nbsp;</mi><msubsup><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><msubsup><mrow><mi>n</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mi>&nbsp;</mi><mo>-</mo><mi>&nbsp;</mi><msubsup><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><msup><mfenced separators=\"|\"><mn>12</mn></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced separators=\"|\"><mn>4</mn></mfenced><mn>2</mn></msup></mrow><mrow><msup><mfenced separators=\"|\"><mn>12</mn></mfenced><mn>2</mn></msup><mo>-</mo><msup><mfenced separators=\"|\"><mn>4</mn></mfenced><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>144</mn><mo>+</mo><mn>16</mn></mrow><mrow><mn>144</mn><mo>-</mo><mn>16</mn></mrow></mfrac><mo>=</mo><mfrac><mn>10</mn><mn>8</mn></mfrac><mo>=</mo><mn>1</mn><mo>.</mo><mn>25</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e43cbe775597373f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "30", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "At a place the true value of angle of dip is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>°</mo></math>. If dip circle is rotated by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">ϕ</mi><mo>°</mo></math> from magnetic meridian, the angle of dip is found to be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>tan</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>⁡</mo><mrow><mo>(</mo><mn>2</mn><mo>)</mo></mrow></math>. Then the value of <math><mi mathvariant=\"normal\">ϕ</mi></math> is", "image": null}, "options": [{"id": "sZw4J", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>45</mn><mo>&#176;</mo></math>", "image": null, "isCorrect": false}, {"id": "zNNmn", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>&#176;</mo></math>", "image": null, "isCorrect": false}, {"id": "pKQNc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>&#176;</mo></math>", "image": null, "isCorrect": false}, {"id": "KycEB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&#176;</mo></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math><msup><mrow><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>&#8289;</mo><mrow><mi mathvariant=\"normal\">&#948;</mi></mrow></mrow></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi></mrow></msup><mo>=</mo><mfrac><mrow><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>&#8289;</mo><mrow><mi mathvariant=\"normal\">&#948;</mi></mrow></mrow></mrow><mrow><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>&#8289;</mo><mrow><msup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></mrow></mrow></mrow></mfrac></math><br /><br /><math><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>&#8289;</mo><mrow><mfenced separators=\"|\"><mrow><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>&#8289;</mo><mrow><mfenced separators=\"|\"><mrow><mn>2</mn></mrow></mfenced></mrow></mrow></mrow></mfenced></mrow></mrow><mo>=</mo><mfrac><mrow><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>&#8289;</mo><mrow><msup><mrow><mn>60</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></mrow></mrow></mrow><mrow><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>&#8289;</mo><mrow><msup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></mrow></mrow></mrow></mfrac></math><br /><br />Or, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>cos</mi><mo>&#8289;</mo><mi mathvariant=\"normal\">x</mi><mo>&#176;</mo><mo>=</mo><mfrac><msqrt><mn>3</mn></msqrt><mn>2</mn></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi mathvariant=\"normal\">x</mi><mo>=</mo><mn>30</mn><mo>&#176;</mo></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863cabc3f0d6c127f63", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "12", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A magnetic needle free to rotate in a horizontal plane is placed at the centre of a circular current-carrying coil whose axis is perpendicular to the magnetic meridian at that place. It is also known that the magnetic declination at this place is zero and in this condition, the magnetic needle is pointing towards the north-west. Now, if we reverse the direction of current in the coil, then the magnetic needle will", "image": null}, "options": [{"id": "45yKP", "text": "point north-west", "image": null, "isCorrect": false}, {"id": "1ScCI", "text": "point north-east", "image": null, "isCorrect": true}, {"id": "Y09dx", "text": "point south-east", "image": null, "isCorrect": false}, {"id": "44Pno", "text": "point south-west", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If there is no current in the coil, then the needle would point north but due to the magnetic field of the coil, it is pointing north-west. This means the magnetic field due to the coil is towards west and it is equal to the horizontal component of earth's magnetic field. So when we reverse the direction of current the magnetic field due to the coil will be towards east and the magnetic needle will point north-east.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c6e27b567c658be9", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "01", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A magnet makes <math> <mrow> <mn>40</mn></mrow> </math> oscillations per minute at a place having magnetic field induction of <math><mn>0.1</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>–</mo><mn>5</mn></mrow></msup><mi>&nbsp;</mi><mn>T</mn></math>. At another place, it takes <math> <mrow> <mn>2.5</mn><mtext> </mtext><mtext>s</mtext></mrow> </math> to complete one vibration. The value of earth's horizontal field at that place is", "image": null}, "options": [{"id": "cycqd", "text": "<math><mn>0.25</mn><mo>&times;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>&ndash;</mo><mn>6</mn></mrow></msup><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">T</mi></math>", "image": null, "isCorrect": false}, {"id": "fb2Ba", "text": "<math><mn>0.36</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>–</mo><mn>6</mn></mrow></msup><mi>&nbsp;</mi><mn>T</mn></math>", "image": null, "isCorrect": true}, {"id": "1UNFQ", "text": "<math><mn>0.66</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>–</mo><mn>8</mn></mrow></msup><mi>&nbsp;</mi><mn>T</mn></math>", "image": null, "isCorrect": false}, {"id": "1Zzbd", "text": "<math><mn>1.2</mn><mo>&times;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>&ndash;</mo><mn>6</mn></mrow></msup><mi>&nbsp;</mi><mn>T</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi>T</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">π</mi><msqrt><mfrac><mrow><mi>I</mi></mrow><mrow><mi>M</mi><mo>×</mo><msub><mrow><mi>B</mi></mrow><mrow><mi>H</mi></mrow></msub></mrow></mfrac></msqrt><mo>⇒</mo><mi>T</mi><mo>∝</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><msub><mrow><mi>B</mi></mrow><mrow><mi>H</mi></mrow></msub></msqrt></mrow></mfrac></math><br /><br /><math><mo>⇒</mo><mfrac><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><msqrt><mfrac><mrow><mo>(</mo><msub><mrow><mi>B</mi></mrow><mrow><mi>H</mi></mrow></msub><msub><mrow><mo>)</mo></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mo>(</mo><msub><mrow><mi>B</mi></mrow><mrow><mi>H</mi></mrow></msub><msub><mrow><mo>)</mo></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></msqrt><mo>⇒</mo><mfrac><mrow><mrow><mrow><mn>60</mn></mrow><mo>/</mo><mrow><mn>40</mn></mrow></mrow></mrow><mrow><mn>2.5</mn></mrow></mfrac><mo>=</mo><msqrt><mfrac><mrow><mo>(</mo><msub><mrow><mi>B</mi></mrow><mrow><mi>H</mi></mrow></msub><msub><mrow><mo>)</mo></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>0.1</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mo>-</mo><mn>5</mn></mrow></msup></mrow></mfrac></msqrt></math><br /><br /><math><mo>⇒</mo><mo>(</mo><msub><mrow><mi>B</mi></mrow><mrow><mi>H</mi></mrow></msub><msub><mrow><mo>)</mo></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>0.36</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup><mn>&nbsp;T</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c1436f9c89c42b9c", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "23", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "At a certain place, the angle of dip is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&#176;</mo></math> and the horizontal component of earth&#39;s magnetic field is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&#160;</mo><mi>&#956;T</mi></math>.&nbsp;The total magnetic field (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#956;T</mi></math>) of the earth at this place, is", "image": null}, "options": [{"id": "gWQ9M", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><msqrt><mn>3</mn></msqrt><mo>&#xA0;</mo><mi>&#x3BC;T</mi></math>", "image": null, "isCorrect": false}, {"id": "sVAXa", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&#xA0;</mo><mi>&#x3BC;T</mi></math>", "image": null, "isCorrect": false}, {"id": "mqiDG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>100</mn><msqrt><mn>3</mn></msqrt></mfrac><mo>&#xA0;</mo><mi>&#x3BC;T</mi></math>", "image": null, "isCorrect": true}, {"id": "SexGZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>&#xA0;</mo><mi>&#x3BC;T</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">H</mi><mrow><mi>cos</mi><mo>&#8289;</mo><mi mathvariant=\"normal\">&#948;</mi></mrow></mfrac><mo>=</mo><mfrac><mn>50</mn><mrow><mi>cos</mi><mo>&#8289;</mo><msup><mn>30</mn><mi mathvariant=\"normal\">o</mi></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>50</mn><mi mathvariant=\"normal\">&#160;</mi><mo>&#215;</mo><mn>2</mn></mrow><msqrt><mn>3</mn></msqrt></mfrac><mo>=</mo><mfrac><mn>100</mn><msqrt><mn>3</mn></msqrt></mfrac><mo>&#160;</mo><mi>&#956;T</mi></math><br /><br />(H = horizontal component of the earth&#39;s magnetic field and B = total magnetic field of earth)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863be2df64986e2d471", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "109", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two magnets of equal mass are joined at 90<math><mo>°</mo></math> each other as shown in figure. Magnet <math><msub><mrow><mi>N</mi></mrow><mrow><mn>1</mn></mrow></msub><mi>&nbsp;</mi><msub><mrow><mi>S</mi></mrow><mrow><mn>1</mn></mrow></msub></math> has a magnetic moment <math><msqrt><mn>3</mn></msqrt></math> times that of <math><msub><mrow><mi>N</mi></mrow><mrow><mn>2</mn></mrow></msub><mi>&nbsp;</mi><msub><mrow><mi>S</mi></mrow><mrow><mn>2</mn></mrow></msub></math>. The arrangement is pivoted so that it is free to rotate in horizontal plane. When in equilibrium, what angle should <math><msub><mrow><mi>N</mi></mrow><mrow><mn>1</mn></mrow></msub><mi>&nbsp;</mi><msub><mrow><mi>S</mi></mrow><mrow><mn>1</mn></mrow></msub></math> make with magnetic meridian?<br />\r<br />\r&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Phys_28.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 120px; height: 120px;\" />", "image": null}, "options": [{"id": "qMb39", "text": "75<math><mo>°</mo></math>", "image": null, "isCorrect": false}, {"id": "Lt3Z9", "text": "60<math><mo>°</mo></math>", "image": null, "isCorrect": false}, {"id": "cXHdo", "text": "30<math><mo>&deg;</mo></math>", "image": null, "isCorrect": true}, {"id": "0it6B", "text": "45<math><mo>°</mo></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In equilibrium, the resultant magnetic moment will be along magnetic meridian. Let <math><msub><mrow><mi>N</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>S</mi></mrow><mrow><mn>1</mn></mrow></msub></math> make <math><mi>&ang;</mi><mi mathvariant=\"normal\">&theta;</mi></math> with resultant<br /><br /><math><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">&theta;</mi><mo>=</mo><mfrac><mrow><msub><mrow><mi>M</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>M</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>M</mi></mrow><mrow><msqrt><mn>3</mn></msqrt><mi>M</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac><mi>&nbsp;</mi><mo>&there4;</mo><mi mathvariant=\"normal\">&theta;</mi><mo>=</mo><mn>30</mn><mo>&deg;</mo></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635b2e11c9cafe69bc", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "41", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A magnetic compass needle oscillates <math><mn>30</mn></math> times per minute at a place where the dip is <math><mn>45</mn><mo>°</mo></math>&nbsp;and <math><mn>40</mn></math> times per minute where the dip is <math><mn>30</mn><mo>°</mo></math>. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>B</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>B</mi><mn>2</mn></msub></math> are the net magnetic fields due to the earth at the two places respectively, then the ratio <math><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>/</mo><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>2</mn></mrow></msub></math> is approximately equal to", "image": null}, "options": [{"id": "WniZZ", "text": "<math><mn>3.6</mn></math>", "image": null, "isCorrect": false}, {"id": "b49Mz", "text": "<math><mn>1.8</mn></math>", "image": null, "isCorrect": false}, {"id": "Ob8bH", "text": "<math><mn>1.2</mn></math>", "image": null, "isCorrect": false}, {"id": "BqPiZ", "text": "<math><mn>0.7</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>f</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>f</mi><mn>2</mn></msub></math> be the respective oscillation frequencies respectively for&nbsp;<math><mn>45</mn><mo>&#176;</mo></math> and <math><mn>30</mn><mo>&#176;</mo></math>&nbsp;dip. Then,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>f</mi><mn>1</mn></msub><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi></mrow></mfrac><msqrt><mfrac><mrow><mi>M</mi><msub><mi>B</mi><mn>1</mn></msub><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mn>45</mn><mo>&#176;</mo></mrow><mi>I</mi></mfrac></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>f</mi><mn>2</mn></msub><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi></mrow></mfrac><msqrt><mfrac><mrow><mi>M</mi><msub><mi>B</mi><mn>2</mn></msub><mi>cos</mi><mn>30</mn><mo>&#176;</mo></mrow><mi>I</mi></mfrac></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>f</mi><mn>1</mn></msub><msub><mi>f</mi><mn>2</mn></msub></mfrac><mo>=</mo><msqrt><mfrac><mrow><msub><mi>B</mi><mn>1</mn></msub><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mn>45</mn><mo>&#176;</mo></mrow><mrow><msub><mi>B</mi><mn>2</mn></msub><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mn>30</mn><mo>&#176;</mo></mrow></mfrac></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><msup><mn>30</mn><mn>2</mn></msup><msup><mn>40</mn><mn>2</mn></msup></mfrac><mo>=</mo><mfrac><mrow><msub><mi>B</mi><mn>1</mn></msub><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mn>45</mn><mo>&#176;</mo></mrow><mrow><msub><mi>B</mi><mn>2</mn></msub><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mn>30</mn><mo>&#176;</mo></mrow></mfrac><mi mathvariant=\"normal\">&#160;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><msub><mi>B</mi><mn>1</mn></msub><msub><mi>B</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><mrow><mn>900</mn><mo>&#215;</mo><mi mathvaria
