><mfrac><mrow><mstyle displaystyle=\"true\"><mfrac><mrow><mi>m</mi><msup><mi>l</mi><mn>2</mn></msup></mrow><msup><mi>t</mi><mn>2</mn></msup></mfrac></mstyle><mo>×</mo><mi mathvariant=\"normal\">l</mi></mrow><mrow><msup><mi mathvariant=\"normal\">l</mi><mn>2</mn></msup><mo>×</mo><mi mathvariant=\"normal\">Δ</mi><mi mathvariant=\"normal\">θ</mi><mo>×</mo><mi mathvariant=\"normal\">t</mi></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">m</mi><mo>×</mo><mi mathvariant=\"normal\">l</mi></mrow><mrow><mi mathvariant=\"normal\">Δ</mi><mi mathvariant=\"normal\">θ</mi><mo>×</mo><msup><mi mathvariant=\"normal\">t</mi><mn>3</mn></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>21.6</mn><mo>×</mo><mn>0.1</mn></mrow><mrow><mn>4</mn><mo>×</mo><msup><mfenced separators=\"|\"><mn>60</mn></mfenced><mn>3</mn></msup></mrow></mfrac></math><br /><br /><math><mo>=</mo><mn>2.5</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup></math> new units", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e2c37878ddd41d3a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "97", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The period of oscillation of a simple pendulum is given by <math><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>L</mi></mrow><mrow><mi>g</mi></mrow></mfrac></msqrt></math>, where <math><mi>L</mi></math> is the length of the pendulum and <math><mi>g</mi></math> is the acceleration due to gravity. The length is measured using a meter scale which has <math><mn>500</mn></math> divisions. If the measured value <math><mi>L</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi>cm</mi></math>, the accuracy in the determination of <math><mi>g</mi></math> is <math><mn>1.1</mn><mi>%</mi></math> and the time taken for <math><mn>100</mn></math> oscillations is <math><mn>100</mn></math> seconds, what should be the possible error in measurement of the clock in one minute (in milliseconds)?", "image": null}, "options": [{"id": "a5ork", "text": "<math><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "8BA2Z", "text": "<math><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "bVkgG", "text": "<math><mn>5</mn></math>", "image": null, "isCorrect": true}, {"id": "Rj8Je", "text": "<math><mn>0.25</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given,<br /><br /><math><mi>T</mi><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><mrow><mi>l</mi></mrow><mrow><mi>g</mi></mrow></mfrac></msqrt></math><br /><br />or <math><msup><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><msup><mrow><mi>&#960;</mi></mrow><mrow><mn>2</mn></mrow></msup><mfrac><mrow><mi>l</mi></mrow><mrow><mi>g</mi></mrow></mfrac></math><br /><br /><math><mo>&#8756;</mo><mi>&#160;</mi><mi>&#160;</mi><mn>2</mn><mfrac><mrow><mo>&#8710;</mo><mi>T</mi></mrow><mrow><mi>T</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mo>&#8710;</mo><mi>l</mi></mrow><mrow><mi>l</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mo>&#8710;</mo><mi>g</mi></mrow><mrow><mi>g</mi></mrow></mfrac></math> ...(i)<br /><br />Now, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi><mo>=</mo><mn>50</mn><mo>&#160;</mo><mi>cm</mi><mo>,</mo><mi>&#160;</mi><mo>&#8710;</mo><mi>l</mi><mo>=</mo><mn>2</mn><mo>&#160;</mo><mi>mm</mi><mo>=</mo><mn>0.2</mn><mi mathvariant=\"normal\">&#160;</mi><mi>cm</mi></math><br /><br /><math><mfrac><mrow><mo>&#8710;</mo><mi>g</mi></mrow><mrow><mi>g</mi></mrow></mfrac><mo>=</mo><mn>1.1</mn><mi>%</mi><mo>=</mo><mfrac><mrow><mn>1.1</mn></mrow><mrow><mn>100</mn></mrow></mfrac></math><br /><br />Put these values in Equation. (i), then we get<br /><br /><math><mfrac><mrow><mo>&#8710;</mo><mi>T</mi></mrow><mrow><mi>T</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>0.2</mn></mrow><mrow><mn>50</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1.1</mn></mrow><mrow><mn>100</mn></mrow></mfrac></mrow></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>7.5</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math> or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7.</mn><mn>5</mn><mi mathvariant=\"normal\">&#160;</mi><mi>ms</mi></math><br /><br /><math><mo>&#8757;</mo></math> In <math><mn>100</mn></math> s, resolution of the clock is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>.5</mo><mi mathvariant=\"normal\">&#160;</mi><mi>ms</mi></math> .<br /><br /><math><mo>&#8756;</mo></math> In <math><mn>60</mn></math> s resolution of the clock is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>7</mn><mo>.5</mo><mo>&#215;</mo><mn>60</mn></mrow><mn>100</mn></mfrac><mo>&#8776;</mo><mn>5</mn><mo>&#160;</mo><mi>ms</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d48fb546aaa67dd3", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "31", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The density of a sphere is measured by measuring the mass and diameter. If it is known that the maximum percentage errors in the measurement of mass and diameter are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>%</mo></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>%</mo></math>&nbsp;respectively then the maximum percentage error in the measurement of density is&nbsp;", "image": null}, "options": [], "correctValue": "11", "solution": {"text": "<p>The density can be computed by&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#961;</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">v</mi></mfrac><mo>=</mo><mfrac><mi mathvariant=\"normal\">m</mi><mstyle displaystyle=\"true\"><mfrac><msup><mi>&#960;d</mi><mn>3</mn></msup><mn>6</mn></mfrac></mstyle></mfrac></math></p><p>or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#961;</mi><mo>&#160;</mo><mo>&#8733;</mo><mo>&#160;</mo><mfrac><mi mathvariant=\"normal\">m</mi><msup><mi mathvariant=\"normal\">d</mi><mn>3</mn></msup></mfrac></math></p><p>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mfrac><mrow><mo>&#8710;</mo><mi mathvariant=\"normal\">&#961;</mi></mrow><mi mathvariant=\"normal\">&#961;</mi></mfrac><mo>&#215;</mo><mn>100</mn><mo>%</mo><mo>=</mo><mfrac><mrow><mo>&#8710;</mo><mi mathvariant=\"normal\">m</mi></mrow><mi mathvariant=\"normal\">m</mi></mfrac><mo>&#215;</mo><mn>100</mn><mo>%</mo><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>3</mn><mfrac><mrow><mo>&#8710;</mo><mi mathvariant=\"normal\">d</mi></mrow><mi mathvariant=\"normal\">d</mi></mfrac><mo>&#215;</mo><mn>100</mn><mo>%</mo></math></p><p>or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>&#8710;</mo><mi mathvariant=\"normal\">&#961;</mi></mrow><mi mathvariant=\"normal\">&#961;</mi></mfrac><mo>&#215;</mo><mn>100</mn><mo>=</mo><mn>2</mn><mo>+</mo><mn>3</mn><mo>&#215;</mo><mn>3</mn><mo>=</mo><mn>11</mn></math></p><p>Hence, the percentage error in measurement of density is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>11</mn><mo>%</mo></math>&nbsp;</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d15a0249e04fd4ef", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "21", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<div>\r<p align=\"left\" style=\"text-align:left;\"><span>The length and breadth of a metal sheet are<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mn>3</mn><mo>.</mo><mn>124</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo></math>and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>.</mo><mn>002</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> respectively. The area of this sheet up to the correct number of significant figures is</span></p>\r</div>\r", "image": null}, "options": [{"id": "5zrb7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mo>.378</mo><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math>", "image": null, "isCorrect": true}, {"id": "wE91X", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mo>.37</mo><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math>", "image": null, "isCorrect": false}, {"id": "cHz5V", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mo>.378248</mo><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math>", "image": null, "isCorrect": false}, {"id": "2RZmZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mo>.3782</mo><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<div><p align=\"left\" style=\"text-align:left;\"><span>Area of metal sheet &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>3</mn><mo>.124</mo><mo>×</mo><mn>3</mn><mo>.002</mo><mtext>  </mtext><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math> </span></p><p align=\"left\" style=\"text-align:left;\"><span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>9</mn><mo>.378248</mo><mtext>  </mtext><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math> &nbsp; </span></p><p align=\"left\" style=\"text-align:left;\"><span>Now, the result must have significant figures equal to the least of figures being multiplied, so, area of metal sheet &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>9</mn><mo>.378</mo><mtext>  </mtext><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math> &nbsp;&nbsp;(four significant digits)</span></p></div>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863caa4b8f05ba2d54a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "32", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A screw gauge with a pitch of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>0.5</mtext><mo>&nbsp;</mo><mi>mm</mi></math> and a circular scale with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn></math> divisions is used to measure the thickness of a thin sheet of aluminium. Before starting the measurement, it is found that when the two jaws of the screw gauge are brought in contact, the <math><msup><mrow><mn>45</mn></mrow><mrow><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">h</mi></mrow></msup></math> division coincides with the main scale line and that the zero of the main scale is barely visible. What is the thickness of the sheet if the main scale reading is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>0.5</mtext><mo>&nbsp;</mo><mi>mm</mi></math> and the <math><msup><mrow><mn>25</mn></mrow><mrow><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">h</mi></mrow></msup></math> division coincides with the main scale line?", "image": null}, "options": [{"id": "fnTfE", "text": "<math><mn>0.70</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "bFc0x", "text": "<math><mn>0.50</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "OVArW", "text": "<math><mn>0.75</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "tOBej", "text": "<math><mn>0.80</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math><mi mathvariant=\"normal\">L</mi><mi mathvariant=\"normal\">C</mi><mo>=</mo><mfrac><mrow><mn>0.5</mn></mrow><mrow><mn>50</mn></mrow></mfrac><mo>=</mo><mn>0.01</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">m</mi></math><br /><br />Zero error <math><mo>=</mo><mn>0.50</mn><mo>-</mo><mn>0.45</mn><mo>=</mo><mo>-</mo><mn>0.05</mn></math><br /><br />Thickness <math><mo>=</mo><mfenced separators=\"|\"><mrow><mn>0.5</mn><mo>+</mo><mn>25</mn><mo>×</mo><mn>0.01</mn></mrow></mfenced><mo>+</mo><mn>0.05</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>0.50</mn><mo>+</mo><mn>0.25</mn><mo>+</mo><mn>0.05</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>0.80</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b960d70d70ac6068", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "05", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A student performs an experiment to determine young&#39;s modulus of a wire, exactly <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math> long, by searle&#39;s method. In a particular reading, the student measures the extension in the length of the wire to be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>8</mn><mo>&#160;</mo><mi>mm</mi></math> with an uncertainty of <math><mo>&#177;</mo><mi>&#160;</mi><mn>0.05</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">m</mi></math> at a load of exactly <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>0</mn><mo>&#160;</mo><mi>kg</mi></math>. The student also measures the diamet pted", "lastPracticed": null}, {"_id": "6151e86397beec60d4fe9038", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "13", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CGS</mi></math> system of units, the density of a material is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi><mo>&#160;</mo><msup><mi>cm</mi><mrow><mo>-</mo><mn>3</mn></mrow></msup></math>. What will be the value of the density of the material in a system of units in which unit of length is <math> <mrow> <mn>10</mn><mtext>&#8203;</mtext><mtext>&#8201;</mtext><mtext>cm</mtext></mrow> </math> and unit of mass is <math> <mrow> <mtext>100&#160;g</mtext></mrow> </math>?&nbsp;", "image": null}, "options": [{"id": "jUg0K", "text": "<math > <mrow>  <mtext>0</mtext><mtext>.04</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "KVpMF", "text": "<math > <mrow>  <mtext>0</mtext><mtext>.4</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "X81Tt", "text": "<math> <mrow> <mtext>40</mtext></mrow> </math>", "image": null, "isCorrect": true}, {"id": "krAYn", "text": "<math > <mrow>  <mtext>400</mtext></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>As&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext>n</mtext><mn>1</mn></msub><msub><mtext>u</mtext><mn>1</mn></msub><mo>=</mo><msub><mtext>n</mtext><mn>2</mn></msub><msub><mtext>u</mtext><mn>2</mn></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi><mo>&#160;</mo><msup><mi>cm</mi><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>=</mo><msub><mtext>n</mtext><mn>2</mn></msub><mfrac><mtext>100 g</mtext><msup><mfenced><mtext>10 cm</mtext></mfenced><mn>3</mn></msup></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mtext>n</mtext><mn>2</mn></msub><mo>=</mo><mtext>40</mtext></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637d712e0329177e65", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "11", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In&nbsp;a new system of units, the unit of force is <math> <mrow> <mtext>100&nbsp;N</mtext></mrow></math>, unit of length is <math> <mrow> <mtext>10&nbsp;m</mtext></mrow> </math> and unit of time is <math> <mrow> <mtext>100&nbsp;s</mtext></mrow></math>. Unit of mass in this system can be expressed as", "image": null}, "options": [{"id": "316So", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <msup> <mrow> <mn>10</mn></mrow> <mn>5</mn> </msup> <mtext>&nbsp;k</mtext><mtext>g</mtext></mrow> </math>", "image": null, "isCorrect": true}, {"id": "PaQmv", "text": "<math  xmlns='http://www.w3.org/1998/Math/MathML'> <mrow>  <msup>   <mrow>    <mn>10</mn></mrow>   <mn>6</mn>  </msup>  <mtext>&nbsp;k</mtext><mtext>g</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "jcEze", "text": "<math  xmlns='http://www.w3.org/1998/Math/MathML'> <mrow>  <msup>   <mrow>    <mn>10</mn></mrow>   <mn>2</mn>  </msup>  <mtext>&nbsp;k</mtext><mtext>g</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "ne4qr", "text": "<math  xmlns='http://www.w3.org/1998/Math/MathML'> <mrow>  <msup>   <mrow>    <mn>10</mn></mrow>   <mn>3</mn>  </msup>  <mtext>&nbsp;k</mtext><mtext>g</mtext></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here, force (F) = [MLT<sup>–2</sup>] = 100 N&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(i)<br /><br />Length (L) = [L] = 10 m&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(ii)<br /><br />Time (t) = [T] = 100 s&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(iii)<br /><br />Substituting values of L and T from Equations. (ii) and (iii) in Equation. (i), we get<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;M × 10 × (100)<sup>–2</sup> = 100<br /><br />or&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <mi>M</mi><mo>⁡</mo> <mo>×</mo> <mn>1</mn> <mn>0</mn> </mrow> <mrow> <mn>1</mn> <mn>0</mn> <mn>0</mn> <mo>×</mo> <mn>1</mn> <mn>0</mn> <mn>0</mn> </mrow> </mfrac> <mo>=</mo> <mn>1</mn> <mn>0</mn> <mn>0</mn> </mrow> </math><br /><br />or&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;M = 100 × 1000 kg<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <mtext>M</mtext><mo>=</mo><msup> <mrow> <mn>10</mn></mrow> <mn>5&nbsp;</mn> </msup> <mtext>kg</mtext></mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637a80caecf70efaa0", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "84", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If velocity, force and time are taken to be fundamental quantities, then the dimensional formula for mass is", "image": null}, "options": [{"id": "RSZnk", "text": "Q = Kv<sup>-1</sup> FT", "image": null, "isCorrect": true}, {"id": "r2Fck", "text": "Q = Kv<sup>3</sup> FT<sup>2</sup>", "image": null, "isCorrect": false}, {"id": "u8WP7", "text": "Q = 2Kv<sup>-2</sup> FT", "image": null, "isCorrect": false}, {"id": "Xm5BR", "text": "Q = -3Kv<sup>2</sup> FT", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the quantity be Q, then,<br /><br />Q = f (v, F, T)<br /><br />Assuming that the function is the product of power functions of v, F and T,<br /><br />Q = Kv<sup>x&nbsp;</sup>F<sup>y&nbsp;</sup>T<sup>z</sup> &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;...(i)<br /><br />where K is a dimensionless constant of proportionality. The above equation dimensionally becomes<br /><br />&nbsp; &nbsp; &nbsp; &nbsp; [Q] = [LT<sup>-1</sup>]<sup>x</sup>[MLT<sup>-2</sup>]<sup>y</sup>[T]<sup>z</sup><br /><br />i.e., &nbsp; [Q] = [M<sup>y</sup>][L<sup>x</sup><sup>+</sup><sup>y</sup>T<sup>-x-2y</sup><sup>+z</sup>] &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;...(ii)<br /><br />​Now<br /><br />Q = mass i.e., &nbsp; [Q] = [M]<br /><br />So Equation (ii) becomes<br /><br />[M] = [M<sup>y</sup>L<sup>x</sup><sup>+</sup><sup>y</sup>T<sup>-x-2y</sup><sup>+z</sup>]<br /><br />its dimensional correctness requires<br /><br />y = 1, &nbsp; &nbsp; x + y = 0 &nbsp; and &nbsp; - x - 2y + z = 0<br /><br />which on solving yields<br /><br />x = -1, &nbsp; &nbsp;y = 1 &nbsp; and &nbsp; z = 1<br /><br />Substituting it in Equation (i), we get<br /><br />Q = Kv<sup>-1</sup> FT", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863623cb010e51fb382", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "77", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If unit of length, mass and time each be doubled, the new unit of work done is _____ times the old unit of work", "image": null}, "options": [{"id": "08M4w", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>", "image": null, "isCorrect": false}, {"id": "MesDc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn></math>", "image": null, "isCorrect": false}, {"id": "MY3CI", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn></math>", "image": null, "isCorrect": false}, {"id": "D2XAP", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math><msub><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><msub><mrow><mi>n</mi></mrow><mrow><mn>1</mn></mrow></msub><msup><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><msub><mrow><mi>M</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>M</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>1</mn></mrow></msup><mi>&nbsp;</mi><msup><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><msub><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>L</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mi>&nbsp;</mi><msup><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub></mr p;</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mi>x</mi></mfenced></mrow></mfrac><mo>=</mo><mfrac><mfenced close=\"]\" open=\"[\" separators=\"|\"><msup><mi>T</mi><mn>2</mn></msup></mfenced><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi>M</mi><msup><mi>L</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi>T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced><mi>&nbsp;</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mi>L</mi></mfenced></mrow></mfrac><mo>=</mo><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><msup><mi>M</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi>T</mi><mn>4</mn></msup></mrow></mfenced></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mi>a</mi></mrow><mrow><mi>b</mi></mrow></mfrac></mrow></mfenced><mo>=</mo><mi>&nbsp;</mi><mfrac><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><msup><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced></mrow><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><msup><mrow><mi>M</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup></mrow></mfenced></mrow></mfrac><mo>=</mo><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi>M</mi><msup><mrow><mi>T</mi></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637d712e0329177e65", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "11", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In&nbsp;a new system of units, the unit of force is <math> <mrow> <mtext>100&nbsp;N</mtext></mrow></math>, unit of length is <math> <mrow> <mtext>10&nbsp;m</mtext></mrow> </math> and unit of time is <math> <mrow> <mtext>100&nbsp;s</mtext></mrow></math>. Unit of mass in this system can be expressed as", "image": null}, "options": [{"id": "316So", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <msup> <mrow> <mn>10</mn></mrow> <mn>5</mn> </msup> <mtext>&nbsp;k</mtext><mtext>g</mtext></mrow> </math>", "image": null, "isCorrect": true}, {"id": "PaQmv", "text": "<math  xmlns='http://www.w3.org/1998/Math/MathML'> <mrow>  <msup>   <mrow>    <mn>10</mn></mrow>   <mn>6</mn>  </msup>  <mtext>&nbsp;k</mtext><mtext>g</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "jcEze", "text": "<math  xmlns='http://www.w3.org/1998/Math/MathML'> <mrow>  <msup>   <mrow>    <mn>10</mn></mrow>   <mn>2</mn>  </msup>  <mtext>&nbsp;k</mtext><mtext>g</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "ne4qr", "text": "<math  xmlns='http://www.w3.org/1998/Math/MathML'> <mrow>  <msup>   <mrow>    <mn>10</mn></mrow>   <mn>3</mn>  </msup>  <mtext>&nbsp;k</mtext><mtext>g</mtext></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here, force (F) = [MLT<sup>–2</sup>] = 100 N&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(i)<br /><br />Length (L) = [L] = 10 m&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(ii)<br /><br />Time (t) = [T] = 100 s&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(iii)<br /><br />Substituting values of L and T from Equations. (ii) and (iii) in Equation. (i), we get<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;M × 10 × (100)<sup>–2</sup> = 100<br /><br />or&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <mi>M</mi><mo>⁡</mo> <mo>×</mo> <mn>1</mn> <mn>0</mn> </mrow> <mrow> <mn>1</mn> <mn>0</mn> <mn>0</mn> <mo>×</mo> <mn>1</mn> <mn>0</mn> <mn>0</mn> </mrow> </mfrac> <mo>=</mo> <mn>1</mn> <mn>0</mn> <mn>0</mn> </mrow> </math><br /><br />or&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;M = 100 × 1000 kg<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <mtext>M</mtext><mo>=</mo><msup> <mrow> <mn>10</mn></mrow> <mn>5&nbsp;</mn> </msup> <mtext>kg</mtext></mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637a82b6f31187bceb", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "47", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If the time period <math> <mrow> <mo stretchy=\"false\">(</mo><mi>T</mi><mo stretchy=\"false\">)</mo></mrow> </math> of vibration of a liquid drop depends on surface tension <math> <mrow> <mo stretchy=\"false\">(</mo><mi>S</mi><mo stretchy=\"false\">)</mo></mrow> </math> , radius <math> <mrow> <mo stretchy=\"false\">(</mo><mi>r</mi><mo stretchy=\"false\">)</mo></mrow> </math> of the drop and density <math> <mrow> <mo stretchy=\"false\">(</mo><mi>ρ</mi><mo stretchy=\"false\">)</mo></mrow> </math> of the liquid, then the expression of <math> <mi>T</mi> </math> is", "image": null}, "options": [{"id": "nerbB", "text": " <math> <mrow> <mi>T</mi><mo>=</mo><mi>k</mi><msqrt> <mrow> <mi>ρ</mi><msup> <mi>r</mi> <mn>3</mn> </msup> <mo>/</mo><mi>S</mi></mrow> </msqrt> </mrow>  </math> ", "image": null, "isCorrect": true}, {"id": "dFro5", "text": " <math> <mrow> <mi>T</mi><mo>=</mo><mi>k</mi><msqrt> <mrow> <msup> <mi>ρ</mi> <mrow> <mn>1</mn><mo>/</mo><mn>2</mn></mrow> </msup> <msup> <mi>r</mi> <mn>3</mn> </msup> <mo>/</mo><mi>S</mi></mrow> </msqrt> </mrow>  </math> ", "image": null, "isCorrect": false}, {"id": "ctTFW", "text": " <math> <mrow> <mi>T</mi><mo>=</mo><mi>k</mi><msqrt> <mrow> <mi>ρ</mi><msup> <mi>r</mi> <mn>3</mn> </msup> <mo>/</mo><msup> <mi>S</mi> <mrow> <mn>1</mn><mo>/</mo><mn>2</mn></mrow> </msup> </mrow> </msqrt> </mrow>  </math> ", "image": null, "isCorrect": false}, {"id": "SH2xQ", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let  <math> <mrow> <mi>T</mi><mo>∝</mo><msup> <mi>S</mi> <mi>x</mi> </msup> <msup> <mi>r</mi> <mi>y</mi> </msup> <msup> <mi>ρ</mi> <mi>z</mi> </msup> </mrow>  </math>  by substituting the dimension of  <math> <mrow> <mo stretchy=\"false\">[</mo><mi>T</mi><mo stretchy=\"false\">]</mo><mo>=</mo><mo stretchy=\"false\">[</mo><mi>T</mi><mo stretchy=\"false\">]</mo></mrow>  </math>   <math> <mrow> <mo stretchy=\"false\">[</mo><mi>S</mi><mo stretchy=\"false\">]</mo><mo>=</mo><mo stretchy=\"false\">[</mo><mi>M</mi><msup> <mi>T</mi> <mrow> <mo>−</mo><mn>2</mn></mrow> </msup> <mo stretchy=\"false\">]</mo><mo>,</mo><mtext> </mtext><mo stretchy=\"false\">[</mo><mi>r</mi><mo stretchy=\"false\">]</mo><mo>=</mo><mo stretchy=\"false\">[</mo><mi>L</mi><mo stretchy=\"false\">]</mo><mo>,</mo><mtext> </mtext><mo stretchy=\"false\">[</mo><mi>ρ</mi><mo stretchy=\"false\">]</mo><mo>=</mo><mo stretchy=\"false\">[</mo><mi>M</mi><msup> <mi>L</mi> <mrow> <mo>−</mo><mn>3</mn></mrow> </msup> <mo stretchy=\"false\">]</mo></mrow>  </math>  and by comparing the power of both the sides  <math> <mrow> <mi>x</mi><mo>=</mo><mo>−</mo><mn>1</mn><mo>/</mo><mn>2</mn><mo>,</mo><mtext> </mtext><mi>y</mi><mo>=</mo><mn>3</mn><mo>/</mo><mn>2</mn><mo>,</mo><mtext> </mtext><mi>z</mi><mo>=</mo><mn>1</mn><mo>/</mo><mn>2</mn></mrow>  </math>  so  <math> <mrow> <mi>T</mi><mo>∝</mo><msqrt> <mrow> <mi>ρ</mi><msup> <mi>r</mi> <mn>3</mn> </msup> <mo>/</mo><mi>S</mi></mrow> </msqrt> <mo>⇒</mo><mi>T</mi><mo>=</mo><mi>k</mi><msqrt> <mrow> <mfrac> <mrow> <mi>ρ</mi><msup> <mi>r</mi> <mn>3</mn> </msup> </mrow> <mi>S</mi> </mfrac> </mrow> </msqrt> </mrow>  </math> ", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637a80caecf70efaa0", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "84", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If velocity, force and time are taken to be fundamental quantities, then the dimensional formula for mass is", "image": null}, "options": [{"id": "RSZnk", "text": "Q = Kv<sup>-1</sup> FT", "image": null, "isCorrect": true}, {"id": "r2Fck", "text": "Q = Kv<sup>3</sup> FT<sup>2</sup>", "image": null, "isCorrect": false}, {"id": "u8WP7", "text": "Q = 2Kv<sup>-2</sup> FT", "image": null, "isCorrect": false}, {"id": "Xm5BR", "text": "Q = -3Kv<sup>2</sup> FT", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the quantity be Q, then,<br /><br />Q = f (v, F, T)<br /><br />Assuming that the function is the product of power functions of v, F and T,<br /><br />Q = Kv<sup>x&nbsp;</sup>F<sup>y&nbsp;</sup>T<sup>z</sup> &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;...(i)<br /><br />where K is a dimensionless constant of proportionality. The above equation dimensionally becomes<br /><br />&nbsp; &nbsp; &nbsp; &nbsp; [Q] = [LT<sup>-1</sup>]<sup>x</sup>[MLT<sup>-2</sup>]<sup>y</sup>[T]<sup>z</sup><br /><br />i.e., &nbsp; [Q] = [M<sup>y</sup>][L<sup>x</sup><sup>+</sup><sup>y</sup>T<sup>-x-2y</sup><sup>+z</sup>] &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;...(ii)<br /><br />​Now<br /><br />Q = mass i.e., &nbsp; [Q] = [M]<br /><br />So Equation (ii) becomes<br /><br />[M] = [M<sup>y</sup>L<sup>x</sup><sup>+</sup><sup>y</sup>T<sup>-x-2y</sup><sup>+z</sup>]<br /><br />its dimensional correctness requires<br /><br />y = 1, &nbsp; &nbsp; x + y = 0 &nbsp; and &nbsp; - x - 2y + z = 0<br /><br />which on solving yields<br /><br />x = -1, &nbsp; &nbsp;y = 1 &nbsp; and &nbsp; z = 1<br /><br />Substituting it in Equation (i), we get<br /><br />Q = Kv<sup>-1</sup> FT", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86371cc9368220f448c", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "78", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In electromagnetic theory, the electric and magnetic phenomena are related to each other. Therefore, the dimensions of electric and magnetic quantities must also be related to each other. In the questions below, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\" separators=\"|\"><mi mathvariant=\"normal\">E</mi></mfenced><mi mathvariant=\"normal\">&nbsp;</mi><mi>and</mi><mi mathvariant=\"normal\">&nbsp;</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mi mathvariant=\"normal\">B</mi></mfenced></math> stand for dimensions of electric and magnetic fields respectively, while <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\" i mathvariant=\"normal\">r</mi></mrow><mrow><mi mathvariant=\"normal\">s</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mo>-</mo><mn>1</mn><mo>-</mo><mo>(</mo><mo>-</mo><mn>3</mn><mo>)</mo><mo>+</mo><mn>4</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>6</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mn>3</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
