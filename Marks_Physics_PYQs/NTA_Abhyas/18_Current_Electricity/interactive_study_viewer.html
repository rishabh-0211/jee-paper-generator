 null}, {"_id": "6151e863c80f09070c5dbef6", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "14", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the part of the circuit shown in the figure, the potential difference between points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mi mathvariant=\"normal\">A</mi></msub><mo>-</mo><msub><mi>V</mi><mi mathvariant=\"normal\">B</mi></msub><mo>=</mo><mn>16</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></math>.&nbsp;The current passing through the&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>&nbsp;resistance will be<br />\r<br />\r&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0022149_Question.jpg\" style=\"width: 292px; height: 132px;\" /></strong></u>", "image": null}, "options": [{"id": "XApeT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}, {"id": "YdlP0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": true}, {"id": "9yplm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>.</mo><mn>0</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}, {"id": "Rot25", "text": "zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0629596_sol.jpg\" style=\"width: 327px; height: 152px;\" /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">V</mi><mi mathvariant=\"normal\">A</mi></msub><mo>-</mo><msub><mi mathvariant=\"normal\">V</mi><mi mathvariant=\"normal\">B</mi></msub><mo>=</mo><mn>16</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mn>4</mn><msub><mi>i</mi><mn>1</mn></msub><mo>+</mo><mn>2</mn><mfenced><mrow><msub><mi>i</mi><mn>1</mn></msub><mo>+</mo><msub><mi>i</mi><mn>2</mn></msub></mrow></mfenced><mo>-</mo><mn>3</mn><mo>+</mo><mn>4</mn><msub><mi>i</mi><mn>1</mn></msub><mo>=</mo><mn>16</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></math>&nbsp;&nbsp;&nbsp;&nbsp; ......(i)<br /><br />Using Kirchhoff&#39;s second law in the closed loops we have<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>9</mn><mo>-</mo><msub><mi>i</mi><mn>2</mn></msub><mo>-</mo><mn>2</mn><mfenced><mrow><msub><mi>i</mi><mn>1</mn></msub><mo>+</mo><msub><mi>i</mi><mn>2</mn></msub></mrow></mfenced><mo>=</mo><mn>0</mn></math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ......(ii)<br /><br />Solving equations (i) and (ii), we get<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>i</mi><mn>1</mn></msub><mo>=</mo><mn>1</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>i</mi><mn>2</mn></msub><mo>=</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></math><br /><br /><math> <mrow> <mo>&#8756;</mo> </mrow> </math>&nbsp;Current through <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>&nbsp;resistor <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mo>+</mo><mn>1</mn><mo>.</mo><mn>5</mn><mo>=</mo><mn>3</mn><mo>.</mo><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c5212e5222a6a44a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "03", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the given circuit, Reading of ammeter is <math><mn>1</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">A</mi></math>. If each of the <math><mn>4</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math> resistor is replaced by <math><mn>2</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math> resistor, the reading of ammeter will become nearly -<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image160-798e785f-af90-43c7-9ac4-234b0efb5a79.jpg\" style=\"height: 202px; width: 250px;\" />", "image": null}, "options": [{"id": "ouCBq", "text": "<math><mn>1</mn><mi mathvariant=\"normal\">&nbsp;</mi><mo>.</mo><mn>11</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": true}, {"id": "GmNZA", "text": "<math><mn>1.25</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}, {"id": "IBmc6", "text": "<math><mn>1.34</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}, {"id": "WTFlF", "text": "<math><mn>1.68</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">A</mi></msub><mo>=</mo></math>Ammeter Resistance<br />then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mn>1</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">A</mi><mo>=</mo><mfrac><mrow><mn>10</mn><mi mathvariant=\"normal\">V</mi></mrow><msub><mi mathvariant=\"normal\">R</mi><mrow><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">q</mi></mrow></msub></mfrac><mo>=</mo><mfrac><mn>10</mn><mrow><mn>9</mn><mo>+</mo><msub><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">A</mi></msub></mrow></mfrac><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mi mathvariant=\"normal\">&#160;</mi><msub><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">A</mi></msub><mo>=</mo><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math><br />When <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#160;</mo><mi>&#937;</mi></math>&nbsp;resistors are replaced by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi>&#937;</mi></math>, then<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">I</mi><mo>=</mo><mfrac><mn>10</mn><mrow><mn>8</mn><mo>+</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mn>10</mn><mn>9</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi><mo>=</mo><mn>1.11</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">A</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c4b191d2f138bb22", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "24", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">V</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi></math> graphs for a conductor at temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">T</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">T</mi><mn>2</mn></msub></math> are shown in the figure.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><msub><mi mathvariant=\"normal\">T</mi><mn>2</mn></msub><mo>-</mo><msub><mi mathvariant=\"normal\">T</mi><mn>1</mn></msub></mrow></mfenced></math> is proportional to<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/321203.JPG\" style=\"width: 200px; height: 210px;\" />", "image": null}, "options": [{"id": "FhP2v", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>tan</mi><mi>&#x3B8;</mi></math>", "image": null, "isCorrect": false}, {"id": "VGhU1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>sin</mi><mi>&#x3B8;</mi></math>", "image": null, "isCorrect": false}, {"id": "655gl", "text": "<math><mrow><mrow><mi mathvariant=\"normal\">cot</mi></mrow><mrow><mn>2</mn><mi>θ</mi></mrow></mrow></math>", "image": null, "isCorrect": true}, {"id": "1ehOV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>cos</mi><mn>2</mn><mi>&#x3B8;</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The slope of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">V</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi></math>&nbsp;graph gives resistance,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">R</mi><mn>1</mn></msub><mo>=</mo><mi>tan&#952;</mi><mo>,</mo><mo>&#160;</mo><msub><mi mathvariant=\"normal\">R</mi><mn>2</mn></msub><mo>=</mo><mi>tan</mi><mo>(</mo><mn>90</mn><mo>-</mo><mi mathvariant=\"normal\">&#952;</mi><mo>)</mo><mo>=</mo><mi>cot&#952;</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">R</mi><mn>1</mn></msub><mo>=</mo><msub><mi mathvariant=\"normal\">R</mi><mn>0</mn></msub><mo>(</mo><mn>1</mn><mo>+</mo><msub><mi>&#945;T</mi><mn>1</mn></msub><mo>)</mo></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">R</mi><mn>2</mn></msub><mo>=</mo><msub><mi mathvariant=\"normal\">R</mi><mn>0</mn></msub><mo>(</mo><mn>1</mn><mo>+</mo><msub><mi>&#945;T</mi><mn>2</mn></msub><mo>)</mo></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><msub><mi mathvariant=\"normal\">R</mi><mn>2</mn></msub><mo>-</mo><msub><mi mathvariant=\"normal\">R</mi><mn>1</mn></msub><mo>=</mo><msub><mi mathvariant=\"normal\">R</mi><mn>0</mn></msub><mi mathvariant=\"normal\">&#945;</mi><mo>(</mo><msub><mi mathvariant=\"normal\">T</mi><mn>2</mn></msub><mo>-</mo><msub><mi mathvariant=\"normal\">T</mi><mn>1</mn></msub><mo>)</mo></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>cot&#952;</mi><mo>-</mo><mi>tan&#952;</mi><mo>=</mo><msub><mi mathvariant=\"normal\">R</mi><mn>0</mn></msub><mi mathvariant=\"normal\">&#945;</mi><mo>(</mo><msub><mi mathvariant=\"normal\">T</mi><mn>2</mn></msub><mo>-</mo><msub><mi mathvariant=\"normal\">T</mi><mn>1</mn></msub><mo>)</mo></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><msub><mi mathvariant=\"normal\">T</mi><mn>2</mn></msub><mo>-</mo><msub><mi mathvariant=\"normal\">T</mi><mn>1</mn></msub><mo>&#8733;</mo><mfrac><mi>cos&#952;</mi><mi>sin&#952;</mi></mfrac><mo>-</mo><mfrac><mi>sin&#952;</mi><mi>cos&#952;</mi></mfrac></math><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8733;</mo><mfrac><mrow><mn>2</mn><mo>(</mo><msup><mi>cos</mi><mn>2</mn></msup><mi mathvariant=\"normal\">&#952;</mi><mo>-</mo><msup><mi>sin</mi><mn>2</mn></msup><mi mathvariant=\"normal\">&#952;</mi><mo>)</mo></mrow><mrow><mn>2</mn><mi>sin&#952;</mi><mo>&#8901;</mo><mi>cos&#952;</mi></mrow></mfrac></math><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8733;</mo><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mn>2</mn><mi>&#952;</mi></mrow><mrow><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mn>2</mn><mi>&#952;</mi></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><msub><mi mathvariant=\"normal\">T</mi><mn>2</mn></msub><mo>-</mo><msub><mi mathvariant=\"normal\">T</mi><mn>1</mn></msub><mo>&#8733;</mo><mi>cot</mi><mn>2</mn><mi mathvariant=\"normal\">&#952;</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b793e9b1a9060f5a", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "90", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the electrical network shown in the figure, What will be the potential difference (in volt) across <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math> resistance?<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/pic147893625.JPG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 250px; height: 169px;\" />", "image": null}, "options": [], "correctValue": "24", "solution": {"text": "As <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math> resistances are<br /><br />In parallel, their equivalent resistance will be 2&nbsp;<math><mi mathvariant=\"normal\">&#937;</mi></math>. Here 2&nbsp;<math><mi mathvariant=\"normal\">&#937;</mi></math> and 4&nbsp;<math><mi mathvariant=\"normal\">&#937;</mi></math> are in series, their equivalent resistance will be 6&nbsp;<math><mi mathvariant=\"normal\">&#937;</mi></math>. From current distribution law<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0038150_Ans_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 305px; height: 152px;\" /><br /><br /><math><msub><mrow><mi>i</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>12</mn><mo>&#215;</mo><mn>18</mn></mrow><mrow><mn>18</mn></mrow></mfrac><mo>=</mo><mn>12&#160;</mn><mn>A</mn><mi>&#160;</mi></math><br /><br /><math><msub><mrow><mi>i</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>6</mn><mo>&#215;</mo><mn>18</mn></mrow><mrow><mn>18</mn></mrow></mfrac><mo>=</mo><mn>6&#160;</mn><mn>A</mn></math><br /><br /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0038150_Ans_2.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 284px; height: 146px;\" /><br /><br /><br /><br />Now, 12 A current is entering in the parallel combination of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math> and <math><mn>6&#160;</mn><mi mathvariant=\"normal\">&#937;</mi></math> again from current distribution law<br /><br /><math><msubsup><mrow><mi>i</mi></mrow><mrow><mn>1</mn></mrow><mrow><mi>&#8242;</mi><mi>&#8242;</mi></mrow></msubsup><mo>=</mo><mfrac><mrow><mn>6</mn><mo>&#215;</mo><mn>12</mn></mrow><mrow><mn>9</mn></mrow></mfrac><mo>=</mo><mn>8&#160;</mn><mn>A</mn><mi>&#160;</mi></math><br /><br /><math><msubsup><mrow><mi>i</mi></mrow><mrow><mn>2</mn></mrow><mrow><mi>&#8242;</mi><mi>&#8242;</mi></mrow></msubsup><mo>=</mo><mfrac><mrow><mn>3</mn><mo>&#215;</mo><mn>12</mn></mrow><mrow><mn>9</mn></mrow></mfrac><mo>=</mo><mn>4&#160;</mn><mn>A</mn><mo>.</mo></math><br /><br />&there4; The potential difference across <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math> resistance<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>8</mn><mo>&#215;</mo><mn>3</mn><mo>=</mo><mn>24</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a607b501bb2a8830", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "52", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>In the circuit shown in the figure (A), <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>3</mn></msub></math> is a variable resistance. As the value <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>3</mn></msub></math> is changed, the current <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi></math> through the cell varies as shown in the figure (B). As <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>3</mn></msub><mo>→</mo><mi mathvariant=\"normal\">∞</mi></math>, the current&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>→</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>6</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math>.&nbsp;What is the value of the sum of the resistances <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>2</mn></msub></math>&nbsp;in ohms?</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image13-ffe5fce5-9a5d-4187-8c6e-b13b67a5b75b.jpg\" style=\"width: 300px; height: 194px;\" /></p>\r", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "<p>For <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>3</mn></msub><mo>=</mo><mn>0</mn><mo>,</mo><mi>I</mi><mo>=</mo><mn>9</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math> (from the graph).In this situation, the circuit can be drawn as shown in figure <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">A</mi></mrow></mfenced></math> .<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image14-5aa0c129-fced-4188-834c-15919b2db198.jpg\" /><br /><br />[current through R<sub>2&nbsp;</sub>will be zero because we have a short circuit <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>R</mi><mn>3</mn></msub><mo>=</mo><mn>0</mn></mrow></mfenced></math>&nbsp;across <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>2</mn></msub></math>]<br /><br />Here <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mfrac><mn>36</mn><mrow><msub><mi>R</mi><mn>1</mn></msub><mo>+</mo><msub><mi>R</mi><mn>2</mn></msub></mrow></mfrac><mo>=</mo><mn>9</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>1</mn></msub><mo>+</mo><msub><mi>R</mi><mn>2</mn></msub><mo>=</mo><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math>&nbsp;</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a40e207ccf0636bb", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "04", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>In the circuit shown in the figure, the reading of the voltmeter is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>1</mn></msub></math>&nbsp;when only <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>S</mi><mn>1</mn></msub></math> is closed,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>2</mn></msub></math> when only <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>S</mi><mn>2</mn></msub></math> is closed and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>3</mn></msub></math> when both <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>S</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>S</mi><mn>2</mn></msub></math> are closed. From this we can conclude that</p>\r\r<p>&nbsp;<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image73-12b00436-9b2b-4889-a68a-58008bb40bb2.jpg\" style=\"width: 275px; height: 157px;\" /></p>\r", "image": null}, "options": [{"id": "qM11i", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>3</mn></msub><mo>&#62;</mo><msub><mi>V</mi><mn>2</mn></msub><mo>&#62;</mo><msub><mi>V</mi><mn>1</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "TQ9MO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>2</mn></msub><mo>&#62;</mo><msub><mi>V</mi><mn>1</mn></msub><mo>&#62;</mo><msub><mi>V</mi><mn>3</mn></msub></math>", "image": null, "isCorrect": true}, {"id": "xzRrN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>3</mn></msub><mo>&#62;</mo><msub><mi>V</mi><mn>1</mn></msub><mo>&#62;</mo><msub><mi>V</mi><mn>2</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "EoSxN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>1</mn></msub><mo>&#62;</mo><msub><mi>V</mi><mn>2</mn></msub><mo>&#62;</mo><msub><mi>V</mi><mn>3</mn></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In series <math><mi mathvariant=\"normal\">V</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>∝</mo><mi mathvariant=\"normal\">R</mi></math><br /><br />When S<sub>1</sub> is closed and S<sub>2</sub> is open<br /><br /><math><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>3</mn><mi>E</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math><br /><br />When S<sub>1</sub> is open and S<sub>2</sub> is closed<br /><br /><math><msub><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>6</mn><mi>E</mi></mrow><mrow><mn>7</mn></mrow></mfrac></math><br /><br />When S<sub>1</sub> and S<sub>2</sub> both are closed<br /><br /><math><msub><mrow><mi>V</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>2</mn><mi>E</mi></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639b9f88e019504956", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "65", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A wire of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi></math> tapers uniformly from end <math><mi mathvariant=\"normal\">P</mi></math> to end <math><mi mathvariant=\"normal\">Q</mi></math> with the diameter at <math><mi mathvariant=\"normal\">P</mi></math> twice that at <math><mi mathvariant=\"normal\">Q</mi></math>. A potential difference is applied across the ends of the wire. Which graph represents the variation of the drift velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">V</mi></math> of the conduction electrons with distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi></math>?<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image41-a9bbbbea-38ce-47f1-a016-9e43885a47ac.jpg\" style=\"height: 82px; width: 250px;\" />", "image": null}, "options": [{"id": "IxwuO", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image42-4a3ff1a4-7cba-4829-9fcb-c830463b0d46.jpg\" style=\"height: 123px; width: 150px;\" />", "image": null, "isCorrect": false}, {"id": "jSB9r", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image43-425120d3-588b-456f-8ada-33e6b5fdda94.jpg\" style=\"height: 123px; width: 150px;\" />", "image": null, "isCorrect": false}, {"id": "nzFhn", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image44-6571d107-487c-4340-b3c0-92b55bebaf53.jpg\" style=\"height: 124px; width: 150px;\" />", "image": null, "isCorrect": false}, {"id": "yrsDK", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image45-7c2a860b-1367-4549-9fb7-8e96e5102ba0.jpg\" style=\"height: 123px; width: 150px;\" />", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For a current-carrying conductor<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>neπr</mi><mn>2</mn></msup><mi mathvariant=\"normal\">V</mi><mo>=</mo><mi mathvariant=\"normal\">i</mi><mo>=</mo><mi>constant</mi><mspace linebreak=\"newline\"></mspace><mo>∴</mo><mi mathvariant=\"normal\">V</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">K</mi><mrow><mi mathvariant=\"normal\">π</mi><msup><mi mathvariant=\"normal\">r</mi><mn>2</mn></msup></mrow></mfrac><mspace linebreak=\"newline\"></mspace><mo>∴</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi><mo>&nbsp;</mo><mo>∝</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mn>1</mn><msup><mi mathvariant=\"normal\">r</mi><mn>2</mn></msup></mfrac></math><br /><br />Now at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi><mo>=</mo><mn>0</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">s</mi><mo>=</mo><mn>2</mn><msub><mi mathvariant=\"normal\">r</mi><mn>0</mn></msub><mi mathvariant=\"normal\">&nbsp;</mi><mo>;</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">x</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>=</mo><mi>l</mi><mi mathvariant=\"script\">&nbsp;</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">s</mi><mo>=</mo><msub><mi mathvariant=\"normal\">r</mi><mn>0</mn></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mfenced close=\"\" open=\"{\" separators=\"|\"><mtable columnalign=\"left\"><mtr><mtd><msub><mi mathvariant=\"normal\">V</mi><mrow><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">x</mi><mo>=</mo><mn>0</mn></mrow></msub><mo>=</mo><mfrac><mi mathvariant=\"normal\">K</mi><mrow><mi mathvariant=\"normal\">π</mi><mn>4</mn><msubsup><mi mathvariant=\"normal\">r</mi><mn>0</mn><mn>2</mn></msubsup></mrow></mfrac></mtd></mtr><mtr><mtd><msub><mi mathvariant=\"normal\">V</mi><mrow><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">x</mi><mo>=</mo><mi>l</mi></mrow></msub><mo>=</mo><mfrac><mi mathvariant=\"normal\">K</mi><mrow><mi mathvariant=\"normal\">π</mi><msubsup><mi mathvariant=\"normal\">r</mi><mn>0</mn><mn>2</mn></msubsup></mrow></mfrac></mtd></mtr></mtable></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863977d7608a17d04d3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "42", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A heating element has a resistance of <math><mn>100</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math> at room temperature. When it is connected to a supply of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>220</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>, a steady current of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math> passes in it and temperature is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>500</mn><msup><mo>&nbsp;</mo><mi>o</mi></msup><mi mathvariant=\"normal\">C</mi></math> more than the room temperature. The temperature coefficient of resistance of the heating element is", "image": null}, "options": [{"id": "ioP0L", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mi>&#160;</mi><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup><mi>&#160;</mi><msup><mi>&#160;</mi><mi>o</mi></msup><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "argvf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>&#160;</mi><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup><mi>&#160;</mi><msup><mi>&#160;</mi><mi>o</mi></msup><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "6LYoi", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mi>&#160;</mi><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup><mi>&#160;</mi><msup><mi>&#160;</mi><mi>o</mi></msup><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "90Wn8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0.5</mn><mi>&#160;</mi><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup><mi>&#160;</mi><msup><mi>&#160;</mi><mi>o</mi></msup><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Resistance after temperature increases by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>500</mn><msup><mo>&nbsp;</mo><mi>o</mi></msup><mi mathvariant=\"normal\">C</mi><mo>=</mo><mfrac><mn>220</mn><mn>2</mn></mfrac><mo>=</mo><mn>110</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math><br /><br /><math><mn>110</mn><mo>=</mo><mn>100</mn><mi>&nbsp;</mi><mo>(</mo><mn>1</mn><mo>+</mo><mi>α</mi><mn>500</mn><mo>)</mo></math><br /><br /><math><mi>α</mi><mo>=</mo><mfrac><mrow><mn>10</mn></mrow><mrow><mn>100</mn><mi>&nbsp;</mi><mo>×</mo><mn>500</mn></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>α</mi><mo>=</mo><mn>2</mn><mi>&nbsp;</mi><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup><mi>&nbsp;</mi><mo>°</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639063dd12f4a398e7", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "31", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the circuit shown, the current flowing from the battery is<br />\r<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image20-1509ba18-3ff0-4dcd-86c2-b6027cd543a4.jpg\" />", "image": null}, "options": [{"id": "RZSuY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>11</mn><mn>50</mn></mfrac><mo>&#xA0;</mo><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}, {"id": "wnkqS", "text": "<math><mn>10</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": true}, {"id": "CpVqa", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>3</mn></mfrac><mo>&#xA0;</mo><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}, {"id": "fHkZ2", "text": "Infinite current", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image21-83092a9c-6a21-4a4d-adf4-bb34f68044d0.jpg\" /><br /><br />By observing the reduced/equivalent circuit diagram, we can say that,<br /><math><mi mathvariant=\"normal\">i</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mi mathvariant=\"normal\">R</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>20</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mn>10&nbsp;</mn><mi mathvariant=\"normal\">A</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86388440327fc6c744e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "70", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An ammeter, voltmeter and a resistor are connected in series to a cell and the readings are noted as <math><mi>I</mi></math> and <math><mi>V</mi></math>. If another resistor <math><mi>R</mi></math> is connected in parallel with a voltmeter, then", "image": null}, "options": [{"id": "amtiV", "text": "<math><mi>I</mi></math>  and  <math><mi>V</mi></math>  increase", "image": null, "isCorrect": false}, {"id": "aqbZI", "text": "<math><mi>I</mi></math> increases", "image": null, "isCorrect": true}, {"id": "8lXDa", "text": "<math><mi>I</mi></math>  and  <math><mi>V</mi></math>  will remain same", "image": null, "isCorrect": false}, {"id": "da5vs", "text": "<math><mi>I</mi></math>  decreases", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When the resistor <math><mi>R</mi></math> is connected in parallel with voltmeter, the effective resistance in the circuit decreases because <math><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mi>R</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></mrow></mfenced></math><br /><br />Therefore current, <math><mi>I</mi><mo>=</mo><mfrac><mrow><mi>V</mi></mrow><mrow><mi>R</mi></mrow></mfrac></math> increases.<br/><br/>As <math><mi>I</mi></math> increases, potential across <math><mi>R</mi></math> increases and hence potential across voltmeter decreases. Hence reading of voltmeter decreases.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86378065e09e719c297", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "106", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the following network, the potential at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi></math> is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/cjkbdjbfl.PNG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 250px; height: 190px;\" />", "image": null}, "options": [{"id": "gZY0V", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">V</mi></math>", "image": null, "isCorrect": false}, {"id": "nM40n", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3&#xA0;</mn><mi mathvariant=\"normal\">V</mi></math>", "image": null, "isCorrect": false}, {"id": "DMmJB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6&#xA0;</mn><mi mathvariant=\"normal\">V</mi></math>", "image": null, "isCorrect": false}, {"id": "hyVIF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4.8&#xA0;</mn><mi mathvariant=\"normal\">V</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/98ygbnml.PNG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 250px; height: 179px;\" /><br /><br />Let the potential at O is <math><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>.</mo></math><br /><br />Application of Kirchhoff&#39;s first law at junction O gives<br /><br /><math><mfrac><mrow><mn>8</mn><mo>-</mo><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>-</mo><mn>4</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>-</mo><mn>2</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><br /><math><mo>=</mo><mfrac><mrow><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>-</mo><mn>4</mn><mo>+</mo><mn>2</mn><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>-</mo><mn>4</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math><br /><br /><math><mfrac><mrow><mn>4</mn><mfenced separators=\"|\"><mrow><mn>8</mn><mo>-</mo><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>-</mo><mn>4</mn><mo>+</mo><mn>2</mn><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>-</mo><mn>4</mn></math><br /><br /><math><mn>16</mn><mo>-</mo><mn>2</mn><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mn>3</mn><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>-</mo><mn>8</mn></math><br /><br /><math><mn>16</mn><mo>+</mo><mn>8</mn><mo>=</mo><mn>5</mn><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>0</mn></msub><mo>=</mo><mfrac><mn>24</mn><mn>5</mn></mfrac><mo>=</mo><mn>4</mn><mo>.8</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">V</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86362103d87bbd0d56d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "85", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the circuit shown in the figure. <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">A</mi></mrow></mfenced></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>3</mn></msub></math> is a variable resistance<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/75192_CA.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 250px; height: 127px;\" /><br />\r<br />\rAs the value <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>3</mn></msub></math> is changed, current <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi></math> though the cell varies as shown. Obviously, the variation is asymptotic, i.e. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>→</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>6</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math> as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>3</mn></msub><mo>→</mo><mi mathvariant=\"normal\">∞</mi></math> . Resistances <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>2</mn></msub></math> are, respectively", "image": null}, "options": [{"id": "5VpOI", "text": "<math><mn>4</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">Ω</mi><mo>,</mo><mi mathvariant=\"normal\"> </mi><mn>2</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": false}, {"id": "yUgIY", "text": "<math><mn>2</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">Ω</mi><mo>,</mo><mi mathvariant=\"normal\"> </mi><mn>4</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": false}, {"id": "JRLwt", "text": "<math><mn>2</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi><mo>,</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>2</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": true}, {"id": "3E1R4", "text": "<math><mn>1</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">Ω</mi><mo>,</mo><mi mathvariant=\"normal\"> </mi><mn>4</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>3</mn></msub><mo>=</mo><mn>0</mn><mo>,</mo><mi>I</mi><mo>=</mo><mn>9</mn><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></math> (from the graph).In this situation, the circuit can be drawn as shown in figure <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">A</mi></mrow></mfenced></math> .<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image14-5aa0c129-fced-4188-834c-15919b2db198.jpg\" style=\"max-width:100%; object-fit:contain\" /><br /><br />[current through R<sub>2&nbsp;</sub>will be zero because we have a short circuit <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>R</mi><mn>3</mn></msub><mo>=</mo><mn>0</mn></mrow></mfenced></math>&nbsp;across <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>2</mn></msub></math>]<br /><br />Here <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mfrac><mn>36</mn><mrow><msub><mi>R</mi><mn>1</mn></msub><mo>+</mo><msub><mi>R</mi><mn>2</mn></msub></mrow></mfrac><mo>=</mo><mn>9</mn><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></math><br /><br />or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>1</mn></msub><mo>+</mo><msub><mi>R</mi><mn>2</mn></msub><mo>=</mo><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math> ...(1)<br /><br />current will not flow through <math> <mrow> <msub> <mi>R</mi> <mn>3</mn> </msub> </mrow> </math>, it will be open circuit.<br /><br />In this situation, the circuit can be drawn as shown figure <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">B</mi></mrow></mfenced></math> .<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/54478.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 223px; height: 268px;\" /><br />Figure (B)<br /><br />Now <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mfrac><mn>36</mn><mrow><msub><mi>R</mi><mn>1</mn></msub><mo>+</mo><mn>2</mn><msub><mi>R</mi><mn>2&#160;</mn></msub></mrow></mfrac><mo>=</mo><mn>6</mn><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></math>&nbsp;(given)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi mathvariant=\"normal\">&#160;</mi><msub><mi>R</mi><mn>1</mn></msub><mo>+</mo><mn>2</mn><msub><mi>R</mi><mn>2</mn></msub><mo>=</mo><mn>6</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math> ...(2)<br /><br />from Eqs. (1) and (2)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><msub><mi>R</mi><mn>2</mn></msub><mo>=</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635b37aa566bbecb5f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "69", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A copper wire of <math><mn>3</mn><mi>&nbsp;</mi><mn>m</mn><msup><mrow><mn>m</mn></mrow><mrow><mn>2</mn></mrow></msup></math> cross-sectional area carries a current <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math>. The magnitude of the drift velocity for the electrons in the wire is (Assume each copper atom contributes one free electron and density of copper <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>8920</mn><mi>&nbsp;</mi><mi>kg</mi><mo>&nbsp;</mo><msup><mn>m</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>M</mi><mi>Cu</mi></msub><mo>=</mo><mn>63</mn><mo>.5</mo><mo>&nbsp;</mo><mi>kg</mi><mo>&nbsp;</mo><msup><mi>mol</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>)", "image": null}, "options": [{"id": "DLFy7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.24</mo><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "HrZTc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.12</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "x2ygN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn></mn><mo>2.4</mo><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "oHE2x", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.06</mo><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mn>3</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup><mo>&nbsp;</mo><msup><mn>m</mn><mn>2</mn></msup><mo>,</mo><mo>&nbsp;</mo><mi>I</mi><mo>=</mo><mn>5</mn><mn>&nbsp;A</mn><mo>,</mo></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>M</mi><mi>Cu</mi></msub><mo>=</mo><mn>63</mn><mo>.5</mo><mo>&nbsp;</mo><mi>kg</mi><mo>&nbsp;</mo><msup><mi>mol</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>ρ</mi><mrow><mi>C</mi><mi>u</mi></mrow></msub><mo>=</mo><mn>8920</mn><mo>&nbsp;</mo><mi>kg</mi><mo>&nbsp;</mo><msup><mn>m</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup></math><br /><br />Electron density <math><mo>=</mo><mfrac><mrow><mn>6.023</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>23</mn></mrow></msup><mo>×</mo><mn>8920</mn></mrow><mrow><mn>63.5</mn></mrow></mfrac></math><br /><br /><math><mo>=</mo><mn>8.46</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>25</mn></mrow></msup><msup><mrow><mi>&nbsp;m</mi></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></math><br /><br /><math><mo>∴</mo></math> Drift velocity, <math><msub><mrow><mi>v</mi></mrow><mrow><mi>d</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>I</mi></mrow><mrow><mi>e</mi><mi>n</mi><mi>A</mi></mrow></mfrac></math><br /><br /><math><mo>=</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>1.6</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>19</mn></mrow></msup><mo>×</mo><mn>8.46</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>25</mn></mrow></msup><mo>×</mo><mn>3</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup></mrow></mfrac></math><br /><br /><math><mo>=</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>40.608</mn></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>0</mn><mo>.12</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86358f60073ec6dc283", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "47", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the part of the circuit shown in the figure, the potential difference between points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mi mathvariant=\"normal\">A</mi></msub><mo>-</mo><msub><mi>V</mi><mi mathvariant=\"normal\">B</mi></msub><mo>=</mo><mn>16</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>.&nbsp;The current passing through the&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math>&nbsp;resistance will be<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0022149_Question.jpg\" style=\"width: 260px; height: 118px;\" />", "image": null}, "options": [{"id": "fRCLt", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}, {"id": "QOFuO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": true}, {"id": "4loVP", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>.</mo><mn>0</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}, {"id": "WyrMf", "text": "zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0629596_sol.jpg\" style=\"width: 260px; height: 121px;\" /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">V</mi><mi mathvariant=\"normal\">A</mi></msub><mo>-</mo><msub><mi mathvariant=\"normal\">V</mi><mi mathvariant=\"normal\">B</mi></msub><mo>=</mo><mn>16</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mn>4</mn><msub><mi>i</mi><mn>1</mn></msub><mo>+</mo><mn>2</mn><mfenced><mrow><msub><mi>i</mi><mn>1</mn></msub><mo>+</mo><msub><mi>i</mi><mn>2</mn></msub></mrow></mfenced><mo>-</mo><mn>3</mn><mo>+</mo><mn>4</mn><msub><mi>i</mi><mn>1</mn></msub><mo>=</mo><mn>16</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>&nbsp;&nbsp;&nbsp;&nbsp; ......(i)<br /><br />Using Kirchhoff's second law in the closed loops we have<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>9</mn><mo>-</mo><msub><mi>i</mi><mn>2</mn></msub><mo>-</mo><mn>2</mn><mfenced><mrow><msub><mi>i</mi><mn>1</mn></msub><mo>+</mo><msub><mi>i</mi><mn>2</mn></msub></mrow></mfenced><mo>=</mo><mn>0</mn></math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ......(ii)<br /><br />Solving equations (i) and (ii), we get<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>i</mi><mn>1</mn></msub><mo>=</mo><mn>1</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>i</mi><mn>2</mn></msub><mo>=</mo><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math><br /><br /><math> <mrow> <mo>∴</mo> </mrow> </math>&nbsp;Current through <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math>&nbsp;resistor <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mo>+</mo><mn>1</mn><mo>.</mo><mn>5</mn><mo>=</mo><mn>3</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86349a36580c469708f", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "72", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In hydrogen discharge tube, it is observed that through a given cross-section <math><mn>3.13</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>15</mn></mrow></msup></math> electrons are moving from right to left and <math><mn>3.12</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>15</mn></mrow></msup></math> protons are moving from left to right per second. The current in the discharge tube (in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>mA</mi></math>) will be", "image": null}, "options": [], "correctValue": "1", "solution": {"text": "Number of electrons <math><msub><mrow><mi>n</mi></mrow><mrow><mi>e</mi></mrow></msub><mo>=</mo><mn>3.13</mn><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>15</mn></mrow></msup></math><br /><br />Number of protons <math><msub><mrow><mi>n</mi></mrow><mrow><mi>p</mi></mrow></msub><mo>=</mo><mn>3.12</mn><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>15</mn></mrow></msup></math><br /><br />Now, the current is given by the relation<br /><br /><math><mi>i</mi><mo>=</mo><msub><mrow><mi>n</mi></mrow><mrow><mi>e</mi></mrow></msub><msub><mrow><mi>q</mi></mrow><mrow><mi>e</mi></mrow></msub><mo>+</mo><msub><mrow><mi>n</mi></mrow><mrow><mi>p</mi></mrow></msub><msub><mrow><mi>q</mi></mrow><mrow><mi>p</mi></mrow></msub></math><br /><br /><math><mo>=</mo><mn>3.13</mn><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>15</mn></mrow></msup><mo>&#215;</mo><mn>1.6</mn><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>19</mn></mrow></msup><mo>+</mo><mn>3.12</mn><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>15</mn></mrow></msup><mo>&#215;</mo><mn>1.6</mn><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>19</mn></mrow></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>1</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>=</mo><mn>1</mn><mi mathvariant=\"normal\">&#160;</mi><mi>mA</mi></math><br /><br />Now, due to excess the charge on electrons, the direction of the current will be towards the right.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863468d535d8c9ebb56", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "100", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The internal resistance of the cell shown in the figure is negligible. On closing the key <math><mi mathvariant=\"normal\">k</mi></math>, the ammeter reading changes from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0.25</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">A</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>12</mn></mfrac><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math>, then what is the value of resistance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">R</mi><mn>1</mn></msub></math>&nbsp;(in ohm)?<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image1-102156bc-1b93-48c8-b772-05126ba6f272.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"height: 154px; width: 200px;\" />", "image": null}, "options": [], "correctValue": "15", "solution": {"text": "When <math><mi mathvariant=\"normal\">k</mi></math> was open<br /><br />Reading of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mi mathvariant=\"normal\">A</mi></mfenced><mi mathvariant=\"normal\">&#160;</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">E</mi><mn>10</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">&#160;</mi><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mn>0.25</mn></math>,<br /><br />When <math><mi mathvariant=\"normal\">k</mi></math> was closed<br /><br />Reading of <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">A</mi></mrow></mfenced><mi mathvariant=\"normal\">&#160;</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">E</mi><mfenced separators=\"|\"><mrow><mn>10</mn><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfenced></mrow><mrow><mn>10</mn><msub><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>12</mn></mrow></mfrac></math><br /><br /><math><mo>&#8658;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>12</mn><mi mathvariant=\"normal\">&#160;</mi><mfenced separators=\"|\"><mrow><mn>5</mn><mi mathvariant=\"normal\">&#160;</mi><mo>+</mo><mi mathvariant=\"normal\">&#160;</mi><mn>0.5</mn><msub><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfenced><mi mathvariant=\"normal\">&#160;</mi><mo>=</mo><mn>10</mn><msub><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>1</mn></mrow></msub></math><br /><br /><math><msub><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>1</mn></mrow></msub><mi mathvariant=\"normal\">&#160;</mi><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mn>15</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633e0b8ca1c9baa9cf", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "35", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The correct graph representation of potential along the branch <math><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">Q</mi><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">S</mi></math> is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image99-f01c148d-17f2-4d7d-978f-dcc3ca9f650c.jpg\" style=\"height: 132px; width: 220px;\" />", "image": null}, "options": [{"id": "bSvfd", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image100-3ed78434-468b-45e0-b9fa-61e7e3c2f9ba.jpg\" style=\"height: 145px; width: 140px;\" />", "image": null, "isCorrect": false}, {"id": "7lVbh", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image101-a383acb8-1206-4d21-acbc-fe2e7d2910e3.jpg\" style=\"height: 155px; width: 140px;\" />", "image": null, "isCorrect": false}, {"id": "nuuMA", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image102-21573336-341f-4124-8b5d-c7aa24912072.jpg\" style=\"height: 182px; width: 140px;\" />", "image": null, "isCorrect": false}, {"id": "24CTB", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image103-1517a106-e46e-4ab6-af3f-54076f37b8e1.jpg\" style=\"height: 190px; width: 140px;\" />", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "As we move from <math><mi mathvariant=\"normal\">P</mi></math> to <math><mi mathvariant=\"normal\">S</mi></math> we are moving from high potential to low potential. Since <math><mi mathvariant=\"normal\">P</mi></math> is connected to +<math><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">e</mi></math> terminal of battery it should be at a positive potential. <math><mi mathvariant=\"normal\">Q</mi></math> is grounded hence it should be at zero potential. <math><mi mathvariant=\"normal\">R</mi></math>&nbsp;and&nbsp;<math><mi mathvariant=\"normal\">S</mi></math> should be at a negative potential.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633718acd52bfdb1ca", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "81", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An uncharged capacitor of capacitance <math> <mrow> <mn>4&nbsp;</mn> <mi>μ</mi> <mtext>F</mtext> </mrow></math> and a resistance of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>5</mn></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>M</mtext><mi mathvariant=\"normal\">Ω</mi></math> are connected in series with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> battery at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>0</mn></math>. Find the time in seconds after which the potential difference across the capacitor is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math> times the potential difference across the resistor. [Given,<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mi>ln</mi><mo>(</mo><mn>2</mn><mo>)</mo><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>0</mn><mo>.</mo><mn>693</mn></math>]", "image": null}, "options": [], "correctValue": "13.86", "solution": {"text": "Given :<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><msub><mi>V</mi><mi>C</mi></msub><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>3</mn><msub><mi>V</mi><mi>R</mi></msub><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>3</mn><mo>(</mo><mi>V</mi><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><msub><mi>V</mi><mi>C</mi></msub><mo>)</mo></math><br /><br />Here, V is the applied potential.<br />&nbsp;<br /><br /><math> <mrow> <mo>&#8756;</mo><mtext>&#8201;</mtext><mtext>&#8201;</mtext><msub> <mi>V</mi> <mi>C</mi> </msub> <mo>=</mo><mfrac> <mn>3</mn> <mn>4</mn> </mfrac> <mtext>&#8201;</mtext><mi>V</mi></mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>o</mi><mi>r</mi><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mi>V</mi><mrow><mo>(</mo><mn>1</mn><mo>&#8722;</mo><msup><mi>e</mi><mrow><mo>&#8722;</mo><mi>t</mi><mo>/</mo><mi>T</mi></mrow></msup><mo>)</mo></mrow><mo>=</mo><mfrac><mn>3</mn><mn>4</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></math><br /><br /><math> <mrow> <mo>&#8756;</mo><mtext>&#8201;</mtext><msup> <mi>e</mi> <mrow> <mo>&#8722;</mo><mi>t</mi><mo>/</mo><mi>&#964;</mi></mrow> </msup> <mtext>&#8201;</mtext><mo>=</mo><mtext>&#8201;</mtext><mfrac> <mn>1</mn> <mn>4</mn> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>&#8658;</mo><mtext>&#8201;</mtext><mi>t</mi><mtext>&#8201;</mtext><mo>=</mo><mtext>&#8201;</mtext><mi>&#964;</mi><mtext>&#8201;</mtext><mi>ln</mi><mtext>&#8201;</mtext><mn>4</mn><mtext>&#8201;</mtext><mo>=</mo><mtext>&#8201;</mtext><mn>2</mn><mi>&#964;</mi><mtext>&#8201;</mtext><mi>ln</mi><mtext>&#8201;</mtext><mn>2.</mn></mrow> </math><br /><br />Here <math> <mrow> <mi>&#964;</mi><mtext>&#8201;</mtext><mo>=</mo><mtext>&#8201;</mtext><mi>C</mi><mi>R</mi><mtext>&#8201;</mtext><mo>=</mo><mn>10</mn><mi>&#160;s</mi></mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mtext>&#8201;</mtext><mi>t</mi><mtext>&#8201;</mtext><mo>=</mo><mtext>&#8201;</mtext><mn>2</mn><mtext>&#8201;</mtext><mo>&#215;</mo><mtext>&#8201;</mtext><mn>10</mn><mtext>&#8201;</mtext><mo>&#215;</mo><mtext>&#8201;</mtext><mn>0.693</mn><mtext>&#8201;</mtext><mo>=</mo><mtext>&#8201;</mtext><mn>13</mn><mo>.86</mo><mtext>&#8201;</mtext><mi mathvariant=\"normal\">s</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632ba861469feb61f4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "28", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the given circuit, the voltmeter reading is <math><mn>4.5</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">V</mi></math> . Assuming that the voltmeter is ideal, current through <math><mn>12</mn><mi mathvariant=\"normal\">Ω</mi></math> resistance is -<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image6-ea1b9478-8fc9-4c92-9f70-9b2ff978bf4b.jpg\" style=\"height: 186px; width: 250px;\" />", "image": null}, "options": [{"id": "iBXet", "text": "<math><mn>1</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}, {"id": "uuUQZ", "text": "<math><mn>0.5</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": true}, {"id": "ngpWX", "text": "<math><mn>0.25</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}, {"id": "uu76A", "text": "<math><mn>0.1</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image7-8b480985-78c6-4cc1-b518-8ac4426fedc6.jpg\" style=\"height: 169px; width: 250px;\" /></p><p>The voltmeter is ideal so it doesn&#39;t draw any current from the circuit.<br />Potential difference across <math><mn>9</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math> resistance = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4.5</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">V</mi></math> (given)</p><p>So&nbsp;&nbsp;the current in the&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math> resistance =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4.5</mn><mn>9</mn></mfrac><mo>=</mo><mn>0.5</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">A</mi></math></p><p>i.e., <math><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mo>=</mo><mn>0.5</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">A</mi></math></p><p>The same current <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi mathvariant=\"normal\">I</mi><mn>1</mn><mi mathvariant=\"normal\">&#8242;</mi></msubsup></math> passes through <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>. The resistors&nbsp;<math><mn>9</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math> and <math><mn>3</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math> are in series and their equivalent, i.e., <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math> is in parallel with <math><mn>6</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math> between <math><mi mathvariant=\"normal\">A</mi></math> and <math><mi mathvariant=\"normal\">B</mi></math> . Dividing the current in the inverse ratio of resistances between <math><mi mathvariant=\"normal\">A</mi></math> and <math><mi mathvariant=\"normal\">B</mi></math> ,<br /><br /><math><mfrac><mrow><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup></mrow><mrow><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>6</mn></mrow><mrow><mn>12</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><br /><math><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mo>=</mo><mn>2</mn><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#160;</mi><mo>&#215;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>0.5</mn><mo>=</mo><mn>1</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">A</mi></math><br /><br />and <math><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mo>+</mo><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mo>=</mo><mn>0.5</mn><mo>+</mo><mn>1</mn><mo>=</mo><mn>1.5</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">A</mi></math><br /><br />at junction <math><mi mathvariant=\"normal\">C</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow></msub></math> divides into three parts. Since the resistances <math><mn>10</mn><mi mathvariant=\"normal\">&#937;</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><mn>12</mn><mi mathvariant=\"normal\">&#937;</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><mn>15</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math> are in parallel between <math><mi mathvariant=\"normal\">C</mi></math> and <math><mi mathvariant=\"normal\">D</mi></math> , current will distribute in the inverse ratio of resistances.<br /><br /><math><mo>&#8756;</mo><mi mathvariant=\"normal\">&#160;</mi><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>2</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mi mathvariant=\"normal\">&#160;</mi><mo>:</mo><mi mathvariant=\"normal\">&#160;</mi><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>2</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mi mathvariant=\"normal\">&#160;</mi><mo>:</mo><mi mathvariant=\"normal\">&#160;</mi><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>2</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi><mi mathvariant=\"normal\">&#8242;</mi><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>10</mn></mrow></mfrac><mi mathvariant=\"normal\">&#160;</mi><mo>:</mo><mi mathvariant=\"normal\">&#160;</mi><mfrac><mrow><mn>1</mn></mrow><mrow><mn>12</mn></mrow></mfrac><mi mathvariant=\"normal\">&#160;</mi><mo>:</mo><mi mathvariant=\"normal\">&#160;</mi><mfrac><mrow><mn>1</mn></mrow><mrow><mn>15</mn></mrow></mfrac></math><br /><br /><math><mo>=</mo><mn>6</mn><mi mathvariant=\"normal\">&#160;</mi><mo>:</mo><mi mathvariant=\"normal\">&#160;</mi><mn>5</mn><mi mathvariant=\"normal\">&#160;</mi><mo>:</mo><mi mathvariant=\"normal\">&#160;</mi><mn>4</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi mathvariant=\"normal\">I</mi><mn>2</mn><mi mathvariant=\"normal\">&#8242;</mi></msubsup><mo>=</mo><mfrac><mn>5</mn><mn>15</mn></mfrac><mo>&#215;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>1.5</mn><mo>=</mo><mn>0.5</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">A</mi></math><br /><br />So <math><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>2</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mo>=</mo><mn>6</mn><mi mathvariant=\"normal\">k</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>2</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mo>=</mo><mn>5</mn><mi mathvariant=\"normal\">k</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>2</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi><mi mathvariant=\"normal\">&#8242;</mi><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mo>=</mo><mn>4</mn><mi mathvariant=\"normal\">k</mi></math><br /><br />( <math><mi mathvariant=\"normal\">k</mi></math> being a constant of proportionality)<br /><br />and <math><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>2</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mo>+</mo><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>2</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mo>+</mo><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>2</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi><mi mathvariant=\"normal\">&#8242;</mi><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mo>=</mo><mn>15</mn><mi mathvariant=\"normal\">k</mi></math><br /><br />but <math><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>1.5</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">A</mi></math><br /><br /><math><mo>&#8756;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>15</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">k</mi><mo>=</mo><mn>1.5</mn></math><br /><br />or <math><mi mathvariant=\"normal\">k</mi><mo>=</mo><mn>0.1</mn></math><br /><br />so <math><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>2</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mo>=</mo><mn>5</mn><mi mathvariant=\"normal\">k</mi><mo>=</mo><mn>0.5</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">A</mi></math><br /><br />Thus current through <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math> resistance is <math><mn>0.5</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">A</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631b15690499eb08a1", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "17", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The charge on the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi>&#956;F</mi></math> capacitor in the steady state is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/D-7_ques.png\" style=\"width: 250px; height: 90px;\" />", "image": null}, "options": [{"id": "Irw9n", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>/</mo><mn>3</mn><mo>&#xA0;</mo><mi>&#x3BC;C</mi></math>", "image": null, "isCorrect": false}, {"id": "k9qLA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>32</mn><mo>/</mo><mn>3</mn><mo>&#xA0;</mo><mi>&#x3BC;C</mi></math>", "image": null, "isCorrect": true}, {"id": "JH7mt", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>/</mo><mn>3</mn><mo>&#xA0;</mo><mi>&#x3BC;C</mi></math>", "image": null, "isCorrect": false}, {"id": "zhyRF", "text": "<math xmlns=\"http://www
