.w3.org/1998/Math/MathML\"><mn>8</mn><mo>/</mo><mn>3</mn><mo>&#xA0;</mo><mi>&#x3BC;C</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>In steady state, the capacitors are fully charged and act as open circuit, so the equivalent circuit in steady state would be as shown:-</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/D-8_solu_1.png\" style=\"width: 250px; height: 114px;\" /><br /><math><mo>&#8756;</mo></math> Steady State current is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mfrac><mn>12</mn><mrow><mn>2</mn><mo>+</mo><mn>4</mn></mrow></mfrac><mo>=</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></math><br /><math><mo>&#8756;</mo></math> Potential&nbsp;difference across <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">V</mi><mo>=</mo><mn>2</mn><mo>&#215;</mo><mn>4</mn><mo>=</mo><mn>8</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">V</mi></math><br /><math><mo>&#8756;</mo></math> Sum of potential difference across <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi>&#956;F</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#160;</mo><mi>&#956;F</mi><mo>&#160;</mo></math>capacitors is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></math>.&nbsp;As these are in series, so charges on them would be same.&nbsp;Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi></math>&nbsp;be the charge on them, then:-<br />From KVL,&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>q</mi><mn>2</mn></mfrac><mo>+</mo><mfrac><mi>q</mi><mn>4</mn></mfrac><mo>=</mo><mn>8</mn><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mi>q</mi><mo>=</mo><mfrac><mn>32</mn><mn>3</mn></mfrac><mo>&#160;</mo><mi>&#956;C</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863098a9625ebfce3c5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "76", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The figure shown below, calculate the net current from the battery and net resistance of the circuit.<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/awtgaxykpskrlliaeknrzkjgpdjsfucimvnjpdshzbikozkyjl.png\" style=\"max-width:100%; object-fit:contain\" style=\"height: 149px; width: 200px;\" />", "image": null}, "options": [{"id": "FOw5X", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.33</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">A</mi><mo>,</mo><mo>&nbsp;</mo><mfrac><mn>15</mn><mn>2</mn></mfrac><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": true}, {"id": "Cosh2", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.33</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">A</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><mn>15</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math>", "image": null, "isCorrect": false}, {"id": "0F569", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.5</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">A</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><mn>10</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math>", "image": null, "isCorrect": false}, {"id": "T1Hma", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.5</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">A</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><mn>15</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In the given circuit, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">E</mi></math> are at the same potential. Points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">F</mi></math> are also at the same potential.<br /><br />Therefore, the resistance between <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">E</mi><mo>,</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">C</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">F</mi></math> will be ineffective and neglected. Now, the circuit becomes<br /><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/rrfnkkbsagtefmfsayzumpszokerybuufogveukbbajtyzdbqx.png\" style=\"max-width:100%; object-fit:contain\" style=\"height: 145px; width: 200px;\" /><br /><br />In the above circuit, branch <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ABCD</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AEFD</mi></math> are in the parallel combination.<br /><br />Thus, the net resistance of the circuit.<br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">t</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>5</mn><mo>+</mo><mn>5</mn><mo>+</mo><mn>5</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>5</mn><mo>+</mo><mn>5</mn><mo>+</mo><mn>5</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>15</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>15</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>15</mn></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msub><mi>R</mi><mrow><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">t</mi></mrow></msub><mo>=</mo><mfrac><mn>15</mn><mn>2</mn></mfrac><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math><br /><br /><math><mo>∴</mo></math> Current, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mfrac><mi>V</mi><msub><mi>R</mi><mrow><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">t</mi></mrow></msub></mfrac><mo>=</mo><mfrac><mn>10</mn><mrow><mn>15</mn><mo>/</mo><mn>2</mn></mrow></mfrac><mo>=</mo><mfrac><mn>20</mn><mn>15</mn></mfrac><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><mo>=</mo><mn>1</mn><mo>.33</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863094a9adcd5258999", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "95", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the circuit shown in the figure, if potential at point A is taken to be zero , the potential at point B is ?<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/2025.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 250px; height: 115px;\" />", "image": null}, "options": [{"id": "HJaCm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>", "image": null, "isCorrect": true}, {"id": "9sZqc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>", "image": null, "isCorrect": false}, {"id": "LR4jr", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>", "image": null, "isCorrect": false}, {"id": "lrhMj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Current From D to C = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mi>V</mi><mi>D</mi></msub><mo>-</mo><msub><mi>V</mi><mi>C</mi></msub><mo>=</mo><mn>2</mn><mo>×</mo><mn>3</mn><mo>=</mo><mn>6</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mi>A</mi></msub><mo>=</mo><mn>0</mn><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mi>V</mi><mi>C</mi></msub><mo>=</mo><mo>-</mo><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>V</mi></mrow><mrow><mi>D</mi></mrow></msub><mo>+</mo><mn>1</mn><mo>=</mo><mn>6</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mi>V</mi><mi>D</mi></msub><mo>=</mo><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math><br /><br /><math><msub><mrow><mi>V</mi></mrow><mrow><mi>D</mi></mrow></msub><mo>-</mo><msub><mrow><mi>V</mi></mrow><mrow><mi>B</mi></mrow></msub><mo>=</mo><mn>2</mn></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mn>5</mn><mo>-</mo><msub><mrow><mi>V</mi></mrow><mrow><mi>B</mi></mrow></msub><mo>=</mo><mn>2</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mi>V</mi><mi>B</mi></msub><mo>=</mo><mn>3</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86306c738b8ec71f9df", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "61", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two cylindrical conductors with equal cross-sections and different resistivities <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>ρ</mi><mn>1</mn></msub></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>ρ</mi><mn>2</mn></msub></math>&nbsp;are put end to end. Find the charge at the boundary of the conductors if a current&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi></math> flows from conductor&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math> to conductor <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>.<sub>​</sub>", "image": null}, "options": [{"id": "cRYPT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">&#949;</mtext><mn>0</mn></msub><mfenced><mrow><msub><mtext mathvariant=\"italic\">&#961;</mtext><mn>2</mn></msub><mo>-</mo><msub><mtext mathvariant=\"italic\">&#961;</mtext><mn>1</mn></msub></mrow></mfenced><mtext mathvariant=\"italic\">I</mtext></math>", "image": null, "isCorrect": true}, {"id": "6eJUO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">&#949;</mtext><mn>0</mn></msub><mfenced><mrow><mn>2</mn><msub><mtext mathvariant=\"italic\">&#961;</mtext><mn>2</mn></msub><mo>+</mo><msub><mtext mathvariant=\"italic\">&#961;</mtext><mn>1</mn></msub></mrow></mfenced><mtext mathvariant=\"italic\">I</mtext></math>", "image": null, "isCorrect": false}, {"id": "onBqh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>2</mtext><msub><mtext mathvariant=\"italic\">&#949;</mtext><mn>0</mn></msub><mfenced><mrow><msub><mtext mathvariant=\"italic\">&#961;</mtext><mn>1</mn></msub><mo>-</mo><msub><mtext mathvariant=\"italic\">&#961;</mtext><mn>2</mn></msub></mrow></mfenced><mtext mathvariant=\"italic\">I</mtext></math>", "image": null, "isCorrect": false}, {"id": "xS2l3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">&#949;</mtext><mn>0</mn></msub><mfenced><mrow><msub><mtext mathvariant=\"italic\">&#961;</mtext><mn>1</mn></msub><mo>+</mo><msub><mtext mathvariant=\"italic\">&#961;</mtext><mn>2</mn></msub></mrow></mfenced><mtext mathvariant=\"italic\">I</mtext></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to ohm's law,<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mover><mtext>E</mtext><mo>→</mo></mover><mo>=</mo><mtext>ρ</mtext><mover><mtext>J</mtext><mo>→</mo></mover></math><br /><br />The problem is solved by the following steps:<br /><br /><strong>Step I:</strong> Determine the electric field in both conductors.<br /><br />The current density in the first conductor is<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><msub><mi>J</mi><mn>1</mn></msub><mo>=</mo><mfrac><mtext mathvariant=\"italic\">I</mtext><mrow><mtext>π</mtext><msup><mtext mathvariant=\"italic\">R</mtext><mn>2</mn></msup></mrow></mfrac><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace></math>(Along the length of the conductor)<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014652_AnsExp_1.jpg\" style=\"width: 243px; height: 58px;\" /><br /><br />Similarly,<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><msub><mi>J</mi><mn>2</mn></msub><mo>=</mo><mfrac><mi>I</mi><mrow><mtext>π</mtext><msup><mtext mathvariant=\"italic\">R</mtext><mn>2</mn></msup></mrow></mfrac><mo>&nbsp;</mo></math>&nbsp;(along the length of the conductor)<br /><br />The electric field inside the first conductor is<br />&nbsp; &nbsp; &nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">E</mtext><mn>2</mn></msub><mo>=</mo><mfrac><mrow><msub><mtext mathvariant=\"italic\">ρ</mtext><mn>2</mn></msub><mtext mathvariant=\"italic\">I</mtext></mrow><mrow><mtext>π</mtext><msup><mtext mathvariant=\"italic\">R</mtext><mn>2&nbsp;&nbsp;</mn></msup></mrow></mfrac><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace></math>(along the length of the conductor)<br /><br /><strong>Step II:</strong> Consider small cylindrical region near the boundary and apply Gauss's law:<br /><br />We consider a small cylindrical region at the boundary<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014652_AnsExp_2.jpg\" style=\"width: 193px; height: 81px;\" /><br /><br />The area of the cylindrical region is<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">π</mi><msup><mi>R</mi><mn>2</mn></msup></math>​&nbsp; &nbsp;<br />The net flux through this region is<br /><br /><math> <mrow> <mtext>ϕ</mtext> <mo>=</mo> <msub> <mtext>ϕ</mtext> <mn>1</mn> </msub> <mo>+</mo> <msub> <mtext>ϕ</mtext> <mn>2</mn> </msub> <mo>=</mo> <msub> <mrow> <mover accent=\"true\"> <mtext>E</mtext> <mo>→</mo> </mover> </mrow> <mn>1</mn> </msub> <mo>.</mo> <mover accent=\"true\"> <mtext>S</mtext> <mo>→</mo> </mover> <mo>+</mo> <msub> <mrow> <mover accent=\"true\"> <mtext>E</mtext> <mo>→</mo> </mover> </mrow> <mn>2</mn> </msub> <mover accent=\"true\"> <mtext>S</mtext> <mo>→</mo> </mover> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>&nbsp;</mo><msub><mi>E</mi><mn>1</mn></msub><mi>S</mi><mo>&nbsp;</mo><mi>cos</mi><mo>&nbsp;</mo><mn>180</mn><mo>°</mo><mo>&nbsp;</mo><mo>+</mo><mo>&nbsp;</mo><msub><mi>E</mi><mn>2</mn></msub><mi>S</mi><mo>&nbsp;</mo><mi>cos</mi><mn>0</mn><mo>°</mo><mo>=</mo><mo>&nbsp;</mo><mo>-</mo><mo>&nbsp;</mo><msub><mi>E</mi><mn>1</mn></msub><mi>S</mi><mo>&nbsp;</mo><mo>+</mo><mo>&nbsp;</mo><msub><mi>E</mi><mn>2</mn></msub><mi>S</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mo>(</mo><msub><mi>E</mi><mn>2</mn></msub><mo>&nbsp;</mo><mo>-</mo><mo>&nbsp;</mo><msub><mi>E</mi><mn>1</mn></msub><mo>)</mo><mo>&nbsp;</mo><mi>S</mi></math><br /><br />According to Gauss's Law,<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>ϕ</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>q</mtext> </mrow> <mrow> <msub> <mtext>ε</mtext> <mn>0</mn> </msub> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mtext>or</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>E</mtext> <mn>2</mn> </msub> <mo>-</mo> <msub> <mtext>E</mtext> <mn>1</mn> </msub> </mrow> </mfenced> <mo>=</mo> <mfrac> <mrow> <mtext>q</mtext> </mrow> <mrow> <mtext>S</mtext> <msub> <mtext>ε</mtext> <mn>0</mn> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>σ</mtext> </mrow> <mrow> <msub> <mtext>ε</mtext> <mn>0</mn> </msub> </mrow> </mfrac> </mrow> </math><br /><br />∴ The surface charge density at the boundary is<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>σ</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mo>(</mo><msub><mi>E</mi><mn>2</mn></msub><mo>&nbsp;</mo><mo>-</mo><mo>&nbsp;</mo><msub><mi>E</mi><mn>1</mn></msub><mo>)</mo><mo>&nbsp;</mo><msub><mi>ε</mi><mn>0</mn></msub></math><br /><br />Putting the value of E<sub>1</sub><sub> </sub>and E<sub>2</sub>, we get<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mo>&nbsp;</mo><mi>σ</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mo>(</mo><msub><mi>ρ</mi><mn>2</mn></msub><mi mathvariant=\"normal\">j</mi><mo>&nbsp;</mo><mo>-</mo><mo>&nbsp;</mo><msub><mi>ρ</mi><mn>1</mn></msub><mi mathvariant=\"normal\">j</mi><mo>)</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mi>o</mi><mi>r</mi><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mi>σ</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mo>(</mo><msub><mi>ρ</mi><mn>2</mn></msub><mo>&nbsp;</mo><mo>-</mo><mo>&nbsp;</mo><msub><mi>ρ</mi><mn>1</mn></msub><mo>)</mo><mi mathvariant=\"normal\">j</mi></math><br /><br /><math> <mrow> <mo>∴</mo> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>σ</mtext> <mo>=</mo> <msub> <mtext>ε</mtext> <mn> "The resistance of the wire is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">R</mi><mn>1</mn></msub></math>.&nbsp;It is now stretched (keeping the volume constant) without breaking so that its length becomes three times.&nbsp;Now the resistance becomes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">R</mi><mn>2</mn></msub></math>, then what is the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">R</mi><mn>2</mn></msub><mo>:</mo><mo>&nbsp;</mo><msub><mi mathvariant=\"normal\">R</mi><mn>1?</mn></msub></math>", "image": null}, "options": [], "correctValue": "9", "solution": {"text": "<p>For a given wire, its resistance</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi><mo>∝</mo><mfrac><mi>l</mi><mi mathvariant=\"normal\">A</mi></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mo>&nbsp;&nbsp;</mo><msub><mi>R</mi><mn>1</mn></msub><mo>∝</mo><mfrac><msub><mi>l</mi><mn>1</mn></msub><msubsup><mi>r</mi><mn>1</mn><mn>2</mn></msubsup></mfrac></math></p><p>The wire is stretched such that&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>l</mi><mn>2</mn></msub><mo>=</mo><mn>3</mn><msub><mi>l</mi><mn>1</mn></msub></math></p><p>But density is unchanged.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo></math>Density&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mi>M</mi><mi>V</mi></mfrac><mo>=</mo><mfrac><mi>M</mi><mrow><mn>4</mn><mi>π</mi><msubsup><mi>r</mi><mn>1</mn><mn>2</mn></msubsup><msub><mi>l</mi><mn>1</mn></msub></mrow></mfrac><mo>=</mo><mfrac><mi>M</mi><mrow><mn>4</mn><mi>π</mi><msubsup><mi>r</mi><mn>2</mn><mn>2</mn></msubsup><msub><mi>l</mi><mn>2</mn></msub></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msubsup><mi mathvariant=\"normal\">r</mi><mn>2</mn><mn>2</mn></msubsup><mo>=</mo><mfrac><mrow><msub><mi>l</mi><mn>1</mn></msub><msubsup><mi mathvariant=\"normal\">r</mi><mn>1</mn><mn>2</mn></msubsup></mrow><msub><mi>l</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><msubsup><mi>r</mi><mn>1</mn><mn>2</mn></msubsup><mn>3</mn></mfrac><mo>&nbsp;&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>…</mo><mo>.</mo><mo>.</mo><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo><mo>&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mfenced><mrow><mo>∵</mo><msub><mi>l</mi><mn>2</mn></msub><mo>=</mo><mn>3</mn><msub><mi>l</mi><mn>1</mn></msub></mrow></mfenced></math></p><p>Now,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">R</mi><mn>2</mn></msub><mo>∝</mo><mfrac><msub><mi>l</mi><mn>2</mn></msub><msubsup><mi mathvariant=\"normal\">r</mi><mn>2</mn><mn>2</mn></msubsup></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mo>&nbsp;&nbsp;</mo><msub><mi mathvariant=\"normal\">R</mi><mn>2</mn></msub><mo>∝</mo><mfrac><mrow><mn>9</mn><msub><mi>l</mi><mn>1</mn></msub></mrow><msubsup><mi mathvariant=\"normal\">r</mi><mn>1</mn><mn>2</mn></msubsup></mfrac><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi>ii</mi></mfenced></math></p><p>From <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>ii</mi><mo>)</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mo>&nbsp;&nbsp;</mo><msub><mi mathvariant=\"normal\">R</mi><mn>2</mn></msub><mo>:</mo><msub><mi mathvariant=\"normal\">R</mi><mn>1</mn></msub><mo>=</mo><mn>9</mn><mo>:</mo><mn>1</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863cc8674e836f5d01b", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "46", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An electric current passes through a circuit containing two wires of the same material connected in parallel. If the lengths of the wires are in the ratio&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>3</mn></mfrac></math> and radius of the wires are in the ratio&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>3</mn></mfrac></math>, then the ratio of the current passing through the wires is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>m</mi><mi>n</mi></mfrac></math>, where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math> are smallest integers. What is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>+</mo><mi>n</mi></math>?", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "<p>Given that,<br /><br /><math><mfrac><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">d</mi><mfrac><mrow><msub><mrow><mi>r</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math><br /><br />Here, <math><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub></math>and <math><msub><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msub></math>are the length of the wires while <math><msub><mrow><mi>r</mi></mrow><mrow><mn>1</mn></mrow></msub></math>and <math><msub><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msub></math> are the radii of the wires.<br /><br />Now, we know that<br /><br /><math><mi>V</mi><mo>=</mo><mi>I</mi><mi>R</mi><mo>&#10233;</mo><mi>I</mi><mi>R</mi><mo>=</mo><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">t</mi></math><br /><br /><math><mo>&#10233;</mo><msub><mrow><mi>I</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi>I</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br /><math><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#160;</mi><mfrac><mrow><msub><mrow><mi>I</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>I</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mo>&#8230;</mo><mo>.</mo><mfenced separators=\"|\"><mrow><mi>i</mi></mrow></mfenced></math><br /><br />But we know that the resistance of the wire is<br /><br /><math><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>R</mi><mo>=</mo><mfrac><mrow><mi>&#961;</mi><mi>l</mi></mrow><mrow><mi>A</mi></mrow></mfrac></math><br /><br />Hence, from Eq (i)<br /><br /><math> <mrow> <mfrac> <mrow> <msub> <mrow> <mi>I</mi><mo>&#8289;</mo> </mrow> <mn>1</mn> </msub> </mrow> <mrow> <msub> <mrow> <mi>I</mi><mo>&#8289;</mo> </mrow> <mn>2</mn> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mi>&#961;</mi> <msub> <mrow> <mi>l</mi><mo>&#8289;</mo> </mrow> <mn>2</mn> </msub> <mo>/</mo> <msub> <mrow> <mi>A</mi><mo>&#8289;</mo> </mrow> <mn>2</mn> </msub> </mrow> <mrow> <mi>&#961;</mi> <msub> <mrow> <mi>l</mi><mo>&#8289;</mo> </mrow> <mn>1</mn> </msub> <mo>/</mo> <msub> <mrow> <mi>A</mi><mo>&#8289;</mo> </mrow> <mn>1</mn> </msub> </mrow> </mfrac> </mrow> </math><br /><br />Here,<br /><br /><math><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfrac><mrow><mi>&#961;</mi><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>A</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>,</mo><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><mi>&#961;</mi><msub><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mi>a</mi><mi>n</mi><mi>d</mi><mi>&#160;</mi><msub><mrow><mi>&#961;</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi>&#961;</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mi>&#961;</mi></math><br /><br />Because both wires are of same material.<br /><br /><math><mo>&#8756;</mo><mi>&#160;</mi><mi>&#160;</mi><mfrac><mrow><msub><mrow><mi>I</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>I</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>A</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math><br /><br /><math><mo>&#10233;</mo><mfrac><mrow><msub><mrow><mi>I</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>I</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msub><mi>&#960;</mi><msubsup><mrow><mi>r</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub><mi>&#960;</mi><msubsup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow></mfrac><mi>&#160;</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#10233;</mo><mfrac><msub><mi>I</mi><mn>1</mn></msub><msub><mi>I</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><mrow><msub><mi>l</mi><mn>2</mn></msub><msubsup><mi>r</mi><mn>1</mn><mn>2</mn></msubsup></mrow><mrow><msub><mi>l</mi><mn>1</mn></msub><msubsup><mi>r</mi><mn>2</mn><mn>2</mn></msubsup></mrow></mfrac></math><br /><br />Here, <math><mfrac><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mi>&#160;</mi><mi>&#160;</mi><mi>a</mi><mi>n</mi><mi>d</mi><mfrac><mrow><msub><mrow><mi>r</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math><br /><br /><math><mo>&#10233;</mo><mi>&#160;</mi><mi>&#160;</mi><mfrac><mrow><msub><mrow><mi>I</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>I</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mo>&#215;</mo><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br />Or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>I</mi><mn empted", "lastPracticed": null}, {"_id": "6151e863977d7608a17d04d3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "42", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A heating element has a resistance of <math><mn>100</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math> at room temperature. When it is connected to a supply of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>220</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>, a steady current of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math> passes in it and temperature is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>500</mn><msup><mo>&nbsp;</mo><mi>o</mi></msup><mi mathvariant=\"normal\">C</mi></math> more than the room temperature. The temperature coefficient of resistance of the heating element is", "image": null}, "options": [{"id": "ioP0L", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mi>&#160;</mi><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup><mi>&#160;</mi><msup><mi>&#160;</mi><mi>o</mi></msup><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "argvf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>&#160;</mi><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup><mi>&#160;</mi><msup><mi>&#160;</mi><mi>o</mi></msup><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "6LYoi", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mi>&#160;</mi><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup><mi>& /mi><mo>=</mo><mfrac> <mi>&#945;</mi> <mrow> <msup> <mi>r</mi> <mn>2</mn> </msup> </mrow> </mfrac> </math> ]<br /><br />The system may be assumed as a parallel combination of a number of such types of elementary resistance.<br /><br /><math> <mrow> <mo>&#8756;</mo> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> <mo>=</mo> <mo>&#8747;</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>dR</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> <mtext>&#960;</mtext> </mrow> <mrow> <mtext>&#945;</mtext> <mi></mi><mi></mi><mi>l</mi><mo>&#8289;</mo> </mrow> </mfrac> <msubsup> <mo>&#8747;</mo> <mn>0</mn> <mi>a</mi> </msubsup> <msup> <mtext>r</mtext> <mn>3</mn> </msup> <mtext>dr</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>or</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> <mtext>&#960;</mtext> </mrow> <mrow> <mtext>&#945;</mtext> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>l</mi><mo>&#8289;</mo> </mrow> </mfrac> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <msup> <mi>a</mi> <mn>4</mn> </msup> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mi>R</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>&#945;</mi><mi>l</mi></mrow><mrow><mi>&#960;</mi><msup><mi>a</mi><mn>4</mn></msup></mrow></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633e42bdf9e9a65c20", "type": "singleCorre  resistances is", "image": null}, "options": [{"id": "WaeL1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>:</mo><mn>9</mn><mo>:</mo><mn>15</mn></math>", "image": null, "isCorrect": false}, {"id": "nHaCh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>:</mo><mn>3</mn><mo>:</mo><mn>5</mn></math>", "image": null, "isCorrect": false}, {"id": "K52MZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>:</mo><mn>3</mn><mo>:</mo><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "bFuFO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>125</mn><mo>:</mo><mn>30</mn><mo>:</mo><mn>8</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "As we know that <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi><mo>=</mo><mi mathvariant=\"normal\">&#961;</mi><mfrac><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">A</mi></mfrac></math>.<br /><br />So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">R</mi><mn>1</mn></msub><mo>:</mo><msub><mi mathvariant=\"normal\">R</mi><mn>2</mn></msub><mo>:</mo><msub><mi mathvariant=\"normal\">R</mi><mn>3</mn></msub><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">l</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">A</mi><mn>1</mn></msub></mfrac><mo>:</mo><mfrac><msub><mi mathvariant=\"normal\">l</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">A</mi><mn>2</mn></msub></mfrac><mo>:</mo><mfrac><msub><mi mathvariant=\"normal\">l</mi><mn>3</mn></msub><msub><mi mathvariant=\"normal\">A</mi><mn>3</mn></msub></mfrac></math><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><msubsup><mi mathvariant=\"normal\">l</mi><mn>1</mn><mn>2</mn></msubsup><msub><mi mathvariant=\"normal\">V</mi><mn>1</mn></msub></mfrac><mo>:</mo><mfrac><msubsup><mi mathvariant=\"normal\">l</mi><mn>2</mn><mn>2</mn></msubsup><msub><mi mathvariant=\"normal\">V</mi><mn>2</mn></msub></mfrac><mo>:</mo><mfrac><msubsup><mi mathvariant=\"normal\">l</mi><mn>3</mn><mn>2</mn></msubsup><msub><mi mathvariant=\"normal\">V</mi><mn>3</mn></msub></mfrac></math><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><msubsup><mi mathvariant=\"normal\">l</mi><mn>1</mn><mn>2</mn></msubsup><mfenced separators=\"|\"><mrow><msub><mi mathvariant=\"normal\">m</mi><mn>1</mn></msub><mi mathvariant=\"normal\">d</mi></mrow></mfenced></mfrac><mo>:</mo><mfrac><msubsup><mi mathvariant=\"normal\">l</mi><mn>2</mn><mn>2</mn></msubsup><mfenced separators=\"|\"><mrow><msub><mi mathvariant=\"normal\">m</mi><mn>2</mn></msub><mi mathvariant=\"normal\">d</mi></mrow></mfenced></mfrac><mo>:</mo><mfrac><msubsup><mi mathvariant=\"normal\">l</mi><mn>3</mn><mn>2</mn></msubsup><mfenced separators=\"|\"><mrow><msub><mi mathvariant=\"normal\">m</mi><mn>3</mn></msub><mi mathvariant=\"normal\">d</mi></mrow></mfenced></mfrac></math><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><msubsup><mi mathvariant=\"normal\">l</mi><mn>1</mn><mn>2</mn></msubsup><msub><mi mathvariant=\"normal\">m</mi><mn>1</mn></msub></mfrac><mo>:</mo><mfrac><msubsup><mi mathvariant=\"normal\">l</mi><mn>2</mn><mn>2</mn></msubsup><msub><mi mathvariant=\"normal\">m</mi><mn>2</mn></msub></mfrac><mo>:</mo><mfrac><msubsup><mi mathvariant=\"normal\">l</mi><mn>3</mn><mn>2</mn></msubsup><msub><mi mathvariant=\"normal\">m</mi><mn>3</mn></msub></mfrac></math><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><msup><mn>5</mn><mn>2</mn></msup><mn>2</mn></mfrac><mo>:</mo><mfrac><msup><mn>3</mn><mn>2</mn></msup><mn>3</mn></mfrac><mo>:</mo><mfrac><msup><mn>2</mn><mn>2</mn></msup><mn>5</mn></mfrac></math><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>25</mn><mn>2</mn></mfrac><mo>:</mo><mn>3</mn><mo>:</mo><mfrac><mn>4</mn><mn>5</mn></mfrac><mo>=</mo><mn>125</mn><mo>:</mo><mn>30</mn><mo>:</mo><mn>8</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631fc30fdb16559faf", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "97", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Three unequal resistors in parallel are equivalent to a resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math>. If two of them are in the ratio <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>:</mo><mn>2</mn></math> and if no resistance value is fractional, what will be the largest of the three resistance in ohm?", "image": null}, "options": [], "correctValue": "6", "solution": {"text": "Let the resistances be <math><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>,</mo><mi>&nbsp;</mi><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub></math> and <math><msub><mrow><mi>R</mi></mrow><mrow><mn>3</mn></mrow></msub></math><br /><br /><math><mo>∴</mo><mfrac><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>⟹</mo><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mi>k</mi><mo>,</mo><mi>&nbsp;</mi><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>2</mn><mi>k</mi></math><br /><br />In parallel <math><mfrac><mrow><mn>1</mn></mrow><mrow><mi>R</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>3</mn></mrow></msub></mrow></mfrac></math><br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>k</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><mi>k</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>3</mn></mrow></msub></mrow></mfrac></math><br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>3</mn></mrow></msub></mrow></mfrac><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>k</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><mi>k</mi></mrow></mfrac></math><br /><br /><math><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>k</mi><mo>-</mo><mn>2</mn><mo>-</mo><mn>1</mn></mrow><mrow><mn>2</mn><mi>k</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>k</mi><mo>-</mo><mn>3</mn></mrow><mrow><mn>2</mn><mi>k</mi></mrow></mfrac></math><br /><br /><math><msub><mrow><mi>R</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>2</mn><mi>k</mi></mrow><mrow><mn>2</mn><mi>k</mi><mo>-</mo><mn>3</mn></mrow></mfrac></math><br /><br />If k = 1, then <math><msub><mrow><mi>R</mi></mrow><mrow><mn>3</mn></mrow></msub></math> is found to be negative, which is impossible.<br /><br />If k = 2, then <math><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>2</mn><mo>,</mo><mi>&nbsp;</mi><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>4</mn><mi>&nbsp;</mi><msub><mrow><mi>R</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>=</mo><mn>4</mn></math><br /><br /><math><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><msub><mrow><mi>R</mi></mrow><mrow><mn>3</mn></mrow></msub></math>, not satisfying the condition of the question that all resistance are unequal.<br /><br /><math><mi>I</mi><mi>f</mi><mi>&nbsp;</mi><mi>k</mi><mo>=</mo><mn>3</mn><mo>,</mo><mi>&nbsp;</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">n</mi><mi>&nbsp;</mi><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>3</mn><mo>,</mo><mi>&nbsp;</mi><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>6</mn></math><br /><br /><math><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>R</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>=</mo><mn>2&nbsp;</mn><mi mathvariant=\"normal\">Ω</mi></math><br /><br />∴ Largest resistance <math> <mo>=</mo><mn>6&nbsp;</mn><mi mathvariant=\"normal\">Ω</mi><mi mathvariant=\"normal\">&nbsp;</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86318a1338fe3ef2a41", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "18", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A wire of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi></math> has a resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>. If half of the length is stretched to make the radius half of its original value, then the final resistance of the wire is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/75337_q.png\" style=\"width: 300px; height: 115px;\" /><br />\r<br />\r&nbsp;", "image": null}, "options": [{"id": "DkeMW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mi>R</mi></math>", "image": null, "isCorrect": false}, {"id": "ghrye", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mi>R</mi></math>", "image": null, "isCorrect": false}, {"id": "zVC5C", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>17</mn><mi>R</mi></mrow><mn>2</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "DQfru", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>R</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/75337_1_.png\" style=\"width: 319px; height: 113px;\" /><br /><br /><math> <mi>R</mi><mo>=</mo><mfrac> <mrow> <mi>ρ</mi><mi>l</mi></mrow> <mi>A</mi> </mfrac> <mo>=</mo><mfrac> <mrow> <mi>ρ</mi><mi>l</mi></mrow> <mrow> <mi>π</mi><msup> <mi>r</mi> <mn>2</mn> </msup> </mrow> </mfrac> </math><br /><br /><math> <mi>π</mi><msup> <mi>r</mi> <mn>2</mn> </msup> <mfrac> <mi>l</mi> <mn>2</mn> </mfrac> <mo>=</mo><mi>π</mi><msup> <mrow><mo>(</mo> <mrow> <mfrac> <mi>r</mi> <mn>2</mn> </mfrac> </mrow> <mo>)</mo></mrow> <mn>2</mn> </msup> <msup> <mi>l</mi> <mo>′</mo> </msup> </math><br /><br /><math> <msup> <mi>l</mi> <mo>′</mo> </msup><mo>=</mo><mn>2</mn><mi>l</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>'</mo><mo>=</mo><mfrac><mrow><mi>ρ</mi><mi>l</mi><mo>'</mo></mrow><mrow><mi>A</mi><mo>'</mo></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>ρ</mi><mfenced separators=\"|\"><mrow><mn>2</mn><mi>l</mi></mrow></mfenced></mrow><mrow><mi>π</mi><msup><mfenced separators=\"|\"><mstyle displaystyle=\"true\"><mfrac bevelled=\"true\"><mi>r</mi><mn>2</mn></mfrac></mstyle></mfenced><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mn>8</mn><mi>R</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>''</mo><mo>=</mo><mfrac><mrow><mi>ρ</mi><mfenced><mstyle displaystyle=\"true\"><mfrac bevelled=\"true\"><mi>l</mi><mn>2</mn></mfrac></mstyle></mfenced></mrow><mrow><mi>π</mi><msup><mi>r</mi><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mfrac><mi>R</mi><mn>2</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mi>eq</mi></msub><mo>=</mo><mi>R</mi><mo>'</mo><mo>+</mo><mi>R</mi><mo>''</mo><mo>=</mo><mfrac><mrow><mn>17</mn><mi>R</mi></mrow><mn>2</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86313f28bbd2b1acbd7", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "27", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two cylindrical rods of same cross-section area and same length are connected in series to an ideal cell as shown. The resistivity of the left rod is&nbsp;<math><mrow><mi>ρ</mi>&nbsp; </mrow> </math> and that of the right rod is <math> <mrow> <mn>2</mn> <mi>ρ</mi></mrow></math>. Then, the variation of potential at any point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math>&nbsp;at a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi></math> from the left end of the combined system is most appropriately shown in which of the plots?<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/1474_question.png\" style=\"width: 200px; height: 140px;\" />", "image": null}, "options": [{"id": "ALCCJ", "text": "<img alt=\"\" height=\"94\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0001474_AnsExp1_2.jpg\" width=\"188\" />", "image": null, "isCorrect": false}, {"id": "auWRM", "text": "<img alt=\"\" height=\"115\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0001474_AnsExp1_1.jpg\" width=\"182\" />", "image": null, "isCorrect": true}, {"id": "Qbw44", "text": "<img alt=\"\" height=\"115\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0001474_AnsExp1_3.jpg\" width=\"181\" />", "image": null, "isCorrect": false}, {"id": "cpcxI", "text": "<img alt=\"\" height=\"110\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0001474_AnsExp1_4.jpg\" width=\"180\" />", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From relation,&nbsp;<math><mrow><mtext>E</mtext> <mo>=</mo> <mi>ρ</mi> <mtext>J</mtext></mrow></math>, the magnitude of the electric field is greater in the right rod as compared to the left rod. Therefore the magnitude of the potential gradient in the right rod is greater. (Remember that potential is continuous).<br />Therefore the variation is shown by the following figure.<br /><br /><img alt=\"\" height=\"139\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/content_15.20.2..png\" width=\"207\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86306c738b8ec71f9df", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "61", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two cylindrical conductors with equal cross-sections and different resistivities <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>ρ</mi><mn>1</mn></msub></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>ρ</mi><mn>2</mn></msub></math>&nbsp;are put end to end. Find the charge at the boundary of the conductors if a current&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi></math> flows from conductor&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math> to conductor <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>.<sub>​</sub>", "image": null}, "options": [{"id": "cRYPT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">&#949;</mtext><mn>0</mn></msub><mfenced><mrow><msub><mtext mathvariant=\"italic\">&#961;</mtext><mn>2</mn></msub><mo>-</mo><msub><mtext mathvariant=\"italic\">&#961;</mtext><mn>1</mn></msub></mrow></mfenced><mtext mathvariant=\"italic\">I</mtext></math>", "image": null, "isCorrect": true}, {"id": "6eJUO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">&#949;</mtext><mn>0</mn></msub><mfenced><mrow><mn>2</mn><msub><mtext mathvariant=\"italic\">&#961;</mtext><mn>2</mn></msub><mo>+</mo><msub><mtext mathvariant=\"italic\">&#961;</mtext><mn>1</mn></msub></mrow></mfenced><mtext mathvariant=\"italic\">I</mtext></math>", "image": null, "isCorrect": false}, {"id": "onBqh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>2</mtext><msub><mtext mathvariant=\"italic\">&#949;</mtext><mn>0</mn></msub><mfenced><mrow><msub><mtext mathvariant=\"italic\">&#961;</mtext><mn>1</mn></msub><mo>-</mo><msub><mtext mathvariant=\"italic\">&#961;</mtext><mn>2</mn></msub></mrow></mfenced><mtext mathvariant=\"italic\">I</mtext></math>", "image": null, "isCorrect": false}, {"id": "xS2l3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">&#949;</mtext><mn>0</mn></msub><mfenced><mrow><msub><mtext mathvariant=\"italic\">&#961;</mtext><mn>1</mn></msub><mo>+</mo><msub><mtext mathvariant=\"italic\">&#961;</mtext><mn>2</mn></msub></mrow></mfenced><mtext mathvariant=\"italic\">I</mtext></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to ohm's law,<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mover><mtext>E</mtext><mo>→</mo></mover><mo>=</mo><mtext>ρ</mtext><mover><mtext>J</mtext><mo>→</mo></mover></math><br /><br />The problem is solved by the following steps:<br /><br /><strong>Step I:</strong> Determine the electric field in both conductors.<br /><br />The current density in the first conductor is<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><msub><mi>J</mi><mn>1</mn></msub><mo>=</mo><mfrac><mtext mathvariant=\"italic\">I</mtext><mrow><mtext>π</mtext><msup><mtext mathvariant=\"italic\">R</mtext><mn>2</mn></msup></mrow></mfrac><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace></math>(Along the length of the conductor)<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014652_AnsExp_1.jpg\" style=\"width: 243px; height: 58px;\" /><br /><br />Similarly,<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><msub><mi>J</mi><mn>2</mn></msub><mo>=</mo><mfrac><mi>I</mi><mrow><mtext>π</mtext><msup><mtext mathvariant=\"italic\">R</mtext><mn>2</mn></msup></mrow></mfrac><mo>&nbsp;</mo></math>&nbsp;(along the length of the conductor)<br /><br />The electric field inside the first conductor is<br />&nbsp; &nbsp; &nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">E</mtext><mn>2</mn></msub><mo>=</mo><mfrac><mrow><msub><mtext mathvariant=\"italic\">ρ</mtext><mn>2</mn></msub><mtext mathvariant=\"italic\">I</mtext></mrow><mrow><mtext>π</mtext><msup><mtext mathvariant=\"italic\">R</mtext><mn>2&nbsp;&nbsp;</mn></msup></mrow></mfrac><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace></math>(along the length of the conductor)<br /><br /><strong>Step II:</strong> Consider small cylindrical region near the boundary and apply Gauss's law:<br /><br />We consider a small cylindrical region at the boundary<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014652_AnsExp_2.jpg\" style=\"width: 193px; height: 81px;\" /><br /><br />The area of the cylindrical region is<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">π</mi><msup><mi>R</mi><mn>2</mn></msup></math>​&nbsp; &nbsp;<br />The net flux through this region is<br /><br /><math> <mrow> <mtext>ϕ</mtext> <mo>=</mo> <msub> <mtext>ϕ</mtext> <mn>1</mn> </msub> <mo>+</mo> <msub> <mtext>ϕ</mtext> <mn>2</mn> </msub> <mo>=</mo> <msub> <mrow> <mover accent=\"true\"> <mtext>E</mtext> <mo>→</mo> </mover> </mrow> <mn>1</mn> </msub> <mo>.</mo> <mover accent=\"true\"> <mtext>S</mtext> <mo>→</mo> </mover> <mo>+</mo> <msub> <mrow> <mover accent=\"true\"> <mtext>E</mtext> <mo>→</mo> </mover> </mrow> <mn>2</mn> </msub> <mover accent=\"true\"> <mtext>S</mtext> <mo>→</mo> </mover> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>&nbsp;</mo><msub><mi>E</mi><mn>1</mn></msub><mi>S</mi><mo>&nbsp;</mo><mi>cos</mi><mo>&nbsp;</mo><mn>180</mn><mo>°</mo><mo>&nbsp;</mo><mo>+</mo><mo>&nbsp;</mo><msub><mi>E</mi><mn>2</mn></msub><mi>S</mi><mo>&nbsp;</mo><mi>cos</mi><mn>0</mn><mo>°</mo><mo>=</mo><mo>&nbsp;</mo><mo>-</mo><mo>&nbsp;</mo><msub><mi>E</mi><mn>1</mn></msub><mi>S</mi><mo>&nbsp;</mo><mo>+</mo><mo>&nbsp;</mo><msub><mi>E</mi><mn>2</mn></msub><mi>S</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mo>(</mo><msub><mi>E</mi><mn>2</mn></msub><mo>&nbsp;</mo><mo>-</mo><mo>&nbsp;</mo><msub><mi>E</mi><mn>1</mn></msub><mo>)</mo><mo>&nbsp;</mo><mi>S</mi></math><br /><br />According to Gauss's Law,<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>ϕ</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>q</mtext> </mrow> <mrow> <msub> <mtext>ε</mtext> <mn>0</mn> </msub> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mtext>or</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>E</mtext> <mn>2</mn> </msub> <mo>-</mo> <msub> <mtext>E</mtext> <mn>1</mn> </msub> </mrow> </mfenced> <mo>=</mo> <mfrac> <mrow> <mtext>q</mtext> </mrow> <mrow> <mtext>S</mtext> <msub> <mtext>ε</mtext> <mn>0</mn> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>σ</mtext> </mrow> <mrow> <msub> <mtext>ε</mtext> <mn>0</mn> </msub> </mrow> </mfrac> </mrow> </math><br /><br />∴ The surface charge density at the boundary is<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>σ</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mo>(</mo><msub><mi>E</mi><mn>2</mn></msub><mo>&nbsp;</mo><mo>-</mo><mo>&nbsp;</mo><msub><mi>E</mi><mn>1</mn></msub><mo>)</mo><mo>&nbsp;</mo><msub><mi>ε</mi><mn>0</mn></msub></math><br /><br />Putting the value of E<sub>1</sub><sub> </sub>and E<sub>2</sub>, we get<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mo>&nbsp;</mo><mi>σ</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mo>(</mo><msub><mi>ρ</mi><mn>2</mn></msub><mi mathvariant=\"normal\">j</mi><mo>&nbsp;</mo><mo>-</mo><mo>&nbsp;</mo><msub><mi>ρ</mi><mn>1</mn></msub><mi mathvariant=\"normal\">j</mi><mo>)</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mi>o</mi><mi>r</mi><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mi>σ</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mo>(</mo><msub><mi>ρ</mi><mn>2</mn></msub><mo>&nbsp;</mo><mo>-</mo><mo>&nbsp;</mo><msub><mi>ρ</mi><mn>1</mn></msub><mo>)</mo><mi mathvariant=\"normal\">j</mi></math><br /><br /><math> <mrow> <mo>∴</mo> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>σ</mtext> <mo>=</mo> <msub> <mtext>ε</mtext> <mn>0</mn> </msub> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>ρ</mtext> <mn>2</mn> </msub> <mo>-</mo> <msub> <mtext>ρ</mtext> <mn>1</mn> </msub> </mrow> </mfenced> <mfrac> <mrow> <mtext>I</mtext> </mrow> <mrow> <mtext>π</mtext> <msup> <mtext>R</mtext> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </math><br /><br />or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mi>σ</mi><mi mathvariant=\"normal\">π</mi><msup><mi>R</mi><mn>2</mn></msup><mo>=</mo><mo>&nbsp;</mo><msub><mi>ε</mi><mn>0</mn></msub><mo>(</mo><msub><mi>ρ</mi><mn>2</mn></msub><mo>&nbsp;</mo><mo>-</mo><mo>&nbsp;</mo><msub><mi>ρ</mi><mn>1</mn></msub><mo>)</mo><mi>I</mi></math><br /><br />or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><msub><mi>ε</mi><mn>0</mn></msub><mo>(</mo><msub><mi>ρ</mi><mn>2</mn></msub><mo>&nbsp;</mo><mo>-</mo><mo>&nbsp;</mo><msub><mi>ρ</mi><mn>1</mn></msub><mo>)</mo><mi>I</mi></math><br /><br />Charge at the boundary <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><msub><mi>ε</mi><mn>0</mn></msub><mo>(</mo><msub><mi>ρ</mi><mn>2</mn></msub><mo>&nbsp;</mo><mo>-</mo><mo>&nbsp;</mo><msub><mi>ρ</mi><mn>1</mn></msub><mo>)</mo><mi>I</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "6aa3ab79aa8dc1ff6817803b", "title": "Color Coding of Resistors", "totalQuestions": 2, "questions": [{"_id": "6151e863c0287ccc11553be3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "11", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200&#160;</mn><mi mathvariant=\"normal\">&#937;</mi></math> resistance has a certain colour code as per standard colour coding. If one replaces the red colour by green in the code, the new resistance will be", "image": null}, "options": [{"id": "1hl0m", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>500</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi></math>", "image": null, "isCorrect": true}, {"id": "1a6xc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>400</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi></math>", "image": null, "isCorrect": false}, {"id": "nDBRo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi></math>", "image": null, "isCorrect": false}, {"id": "SOvu4", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When red is replaced by green, then the first significant figure in the value of resistance changes from 2 to 5. So the new resistance is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>500</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863164e784f4d4d0d5c", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "14", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>The value of the resistance of a carbon resistor having the standard colour-coding as shown in the figure is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo mathvariant=\"italic\">&#160;</mo><mi>G&#937;</mi><mo>&#177;</mo><mn>5</mn><mo>%</mo></math>. What is the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>?</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0629616.jpg\" style=\"width: 274px; height: 188px;\" />&nbsp;</p>\r", "image": null}, "options": [], "correctValue": "02.10", "solution": {"text": "<p>From colour codes for resistors.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>21</mn><mo>&#215;</mo><msup><mn>10</mn><mn>8</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi><mo>&#177;</mo><mn>5</mn><mo>%</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>2</mn><mo>.</mo><mn>1</mn><mo>&#215;</mo><msup><mn>10</mn><mn>9</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi><mo>&#177;</mo><mn>5</mn><mo>%</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>R</mi><mo>=</mo><mn>2</mn><mo>.</mo><mn>1</mn><mo>&#160;</mo><mi>G&#937;</mi><mo>&#177;</mo><mn>5</mn><mo>%</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>=</mo><mn>2</mn><mo>.</mo><mn>1</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "6aa3ab79aa8dc1ff6817803c", "title": "Combination of Resistances", "totalQuestions": 51, "questions": [{"_id": "6151e863ff5746a3f63a2b28", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "23", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A battery of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> is connected to a resistance of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math> through a variable resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math>. If the variable resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> is increased at the rate of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi><mo>&nbsp;</mo><msup><mi>min</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>, then the amount of charge that passes through the battery in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&nbsp;</mo><mi>min</mi></math>&nbsp;is", "image": null}, "options": [{"id": "xMD9L", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>120</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}, {"id": "80sFY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>120</mn><msub><mi>log</mi><mi mathvariant=\"normal\">e</mi></msub><mfenced><mn>2</mn></mfenced><mo>&#xA0;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": true}, {"id": "Ot952", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>120</mn><mrow><msub><mi>log</mi><mi mathvariant=\"normal\">e</mi></msub><mfenced><mn>2</mn></mfenced></mrow></mfrac><mo>&#xA0;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}, {"id": "RQ3bP", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>60</mn><mrow><msub><mi>log</mi><mi mathvariant=\"normal\">e</mi></msub><mfenced><mn>2</mn></mfenced></mrow></mfrac><mo>&#xA0;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Q</mi><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><mo>∫</mo><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi>dt</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><mo>∫</mo><mfrac><mi mathvariant=\"normal\">V</mi><mi mathvariant=\"normal\">R</mi></mfrac><mi>dt</mi><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><munderover><mo>∫</mo><mn>0</mn><mn>240</mn></munderover><mfrac><mn>10</mn><mrow><mn>20</mn><mo>+</mo><mfenced separators=\"|\"><mfrac><mn>5</mn><mn>60</mn></mfrac></mfenced><mi mathvariant=\"normal\">t</mi></mrow></mfrac><mi>dt</mi><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi>converted</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi>in</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi>seconds</mi></mrow></mfenc
