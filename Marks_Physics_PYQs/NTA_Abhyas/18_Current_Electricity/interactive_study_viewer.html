mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image95-3e6c70c7-0a9e-4865-8a85-560e955ec509.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"height: 95px; width: 250px;\" /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>I</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><mfrac><mn>3</mn><mrow><mn>3</mn><mo>+</mo><mn>6</mn></mrow></mfrac><mo>=</mo><mfrac><mn>5</mn><mn>6</mn></mfrac><mi>&#160;</mi><mi mathvariant=\"normal\">A</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636cbd2997795cbad4", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "22", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The plates of a parallel plate capacitor are charged to a potential difference of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>117</mn><mo>&nbsp;</mo><mo>V</mo></math> and then connected across a resistor. The potential difference across the capacitor decreases exponentially with respect to time. After&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">s</mi></math> the potential difference between the plates is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>39</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>, then after&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">s</mi></math> from the start, the potential difference ( in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">V</mi></math> ) between the plates is", "image": null}, "options": [], "correctValue": "13", "solution": {"text": "During discharging <math><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mi mathvariant=\"normal\">C</mi></mrow></msub><mo>=V</mo><msup><mrow><mi mathvariant=\"normal\">e</mi></mrow><mrow><mrow><mrow><mo>-</mo><mi mathvariant=\"normal\">t</mi></mrow><mo>/</mo><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">C</mi></mrow></mrow></mrow></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">t</mi><mo>=</mo><mn>1</mn></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&nbsp;</mi><msub><mi mathvariant=\"normal\">V</mi><mn>1</mn></msub><mo>=</mo><mi mathvariant=\"normal\">V</mi><mi mathvariant=\"normal\">&nbsp;</mi><msup><mi mathvariant=\"normal\">e</mi><mrow><mo>-</mo><mn>1</mn><mo>/</mo><mi>RC</mi></mrow></msup><mo>=</mo><mfrac><mi mathvariant=\"normal\">V</mi><mn>3</mn></mfrac></math><br /><br /><math><mo>∴</mo><msup><mrow><mi mathvariant=\"normal\">e</mi></mrow><mrow><mrow><mrow><mo>-</mo><mn>1</mn></mrow><mo>/</mo><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">C</mi></mrow></mrow></mrow></msup><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi mathvariant=\"normal\">&nbsp;</mi><mo>…</mo><mo>…</mo><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced></math><br /><br />after <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">s</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>2</mn></msub><mo>=</mo><msup><mi>Ve</mi><mrow><mo>-</mo><mn>2</mn><mo>/</mo><mi>RC</mi></mrow></msup><mo>=</mo><mi mathvariant=\"normal\">V</mi><msup><mfenced separators=\"|\"><mfrac><mn>1</mn><mn>3</mn></mfrac></mfenced><mn>2</mn></msup><mo>=</mo><mfrac><mi>117</mi><mn>9</mn></mfrac><mo>=</mo><mn>13</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636af7c8a8602e10ca", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "107", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "When a battery of emf <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> with internal resistance <math><mn>0.5</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math> is charged by a <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>120</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">V</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi>DC</mi></math> supply using a series resistance of <math><mn>15.5</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math>, then what is the terminal voltage (in volt) of the battery?", "image": null}, "options": [], "correctValue": "11.5", "solution": {"text": "Here, emf of the battery <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>8</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math><br /><br />The internal resistance of the battery, <math><mi>r</mi><mo>=</mo><mn>0.5</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math><br /><br />The voltage of D. C supply = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>120</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math><br /><br />External resistance, <math><mi>R</mi><mo>=</mo><mn>15.5</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math><br /><br />When the battery of emf <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> is charged from a <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>DC</mi></math> supply of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>120</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>, the effective emf in the circular is<br /><br /><math><mi>ε</mi><mo>=</mo><mn>120</mn><mo>-</mo><mn>8</mn><mo>=</mo><mn>112</mn><mi>&nbsp;</mi><mi>V</mi></math><br /><br />The total resistance of the circuit <math><mo>=</mo><mi>R</mi><mo>+</mo><mi>r</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&nbsp;</mi><mi>&nbsp;</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>15.5</mn><mo>+</mo><mn>0.5</mn></mrow></mfenced><mi>&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi><mo>=</mo><mn>16</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi></math> Current in the circuit during charging<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mfrac><mi>ε</mi><mrow><mi>R</mi><mo>+</mo><mi>r</mi></mrow></mfrac><mo>=</mo><mfrac><mn>112</mn><mn>16</mn></mfrac><mo>=</mo><mn>7</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">A</mi></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi></math>&nbsp;The terminal voltage of the battery,<br /><br /><math><mi>V</mi><mo>=</mo><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">b</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">y</mi><mo>+</mo><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">b</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">y</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&nbsp;</mi><mo>=</mo><mn>8</mn><mo>+</mo><mi>I</mi><mi>r</mi><mo>=</mo><mn>8</mn><mo>+</mo><mn>7</mn><mfenced separators=\"|\"><mn>0.5</mn></mfenced><mo>=</mo><mn>11.</mn><mn>5</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">V</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86365cf020fafab66bd", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "64", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Consider the circuit shown in the figure.<br />\r<br />\r<img src=\"https://cdn-question-pool.getmar n>32</mn></mrow></mfrac><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">A</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633e0b8ca1c9baa9cf", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "35", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The correct graph representation of potential along the branch <math><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">Q</mi><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">S</mi></math> is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image99-f01c148d-17f2-4d7d-978f-dcc3ca9f650c.jpg\" style=\"height: 132px; width: 220px;\" />", "image": null}, "options": [{"id": "bSvfd", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image100-3ed78434-468b-45e0-b9fa-61e7e3c2f9ba.jpg\" style=\"height: 145px; width: 140px;\" />", "image": null, "isCorrect": false}, {"id": "7lVbh", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image101-a383acb8-1206-4d21-acbc-fe2e7d2910e3.jpg\" style=\"height: 155px; width: 140px;\" />", "image": null, "isCorrect": false}, {"id": "nuuMA", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image102-21573336-341f-4124-8b5d-c7aa24912072.jpg\" style=\"height: 182px; width: 140px;\" />", "image": null, "isCorrect": false}, {"id": "24CTB", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image103-1517a106-e46e-4ab6-af3f-54076f37b8e1.jpg\" style=\"height: 190px; width: 140px;\" />", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "As we move from <math><mi mathvariant=\"normal\">P</mi></math> to <math><mi mathvariant=\"normal\">S</mi></math> we are moving from high potential to low potential. Since <math><mi mathvariant=\"normal\">P</mi></math> is connected to +<math><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">e</mi></math> terminal of battery it should be at a positive potential. <math><mi mathvariant=\"normal\">Q</mi></math> is grounded hence it should be at zero potential. <math><mi mathvariant=\"normal\">R</mi></math>&nbsp;and&nbsp;<math><mi mathvariant=\"normal\">S</mi></math> should be at a negative potential.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633718acd52bfdb1ca", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "81", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An uncharged capacitor of capacitance <math> <mrow> <mn>4&nbsp;</mn> <mi>μ</mi> <mtext>F</mtext> </mrow></math> and a resistance of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>5</mn></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>M</mtext><mi mathvariant=\"normal\">Ω</mi></math> are connected in series with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> battery at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>0</mn></math>. Find the time in seconds after which the potential difference across the capacitor is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math> times the potential difference across the resistor. [Given,<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mi>ln</mi><mo>(</mo><mn>2</mn><mo>)</mo><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>0</mn><mo>.</mo><mn>693</mn></math>]", "image": null}, "options": [], "correctValue": "13.86", "solution": {"text": "Given :<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><msub><mi>V</mi><mi>C</mi></msub><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>3</mn><msub><mi>V</mi><mi>R</mi></msub><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>3</mn><mo>(</mo><mi>V</mi><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><msub><mi>V</mi><mi>C</mi></msub><mo>)</mo></math><br /><br />Here, V is the applied potential.<br />&nbsp;<br /><br /><math> <mrow> <mo>&#8756;</mo><mtext>&#8201;</mtext><mtext>&#8201;</mtext><msub> <mi>V</mi> <mi>C</mi> </msub> <mo>=</mo><mfrac> <mn>3</mn> <mn>4</mn> </mfrac> <mtext>&#8201;</mtext><mi>V</mi></mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>o</mi><mi>r</mi><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mi>V</mi><mrow><mo>(</mo><mn>1</mn><mo>&#8722;</mo><msup><mi>e</mi><mrow><mo>&#8722;</mo><mi>t</mi><mo>/</mo><mi>T</mi></mrow></msup><mo>)</mo></mrow><mo>=</mo><mfrac><mn>3</mn><mn>4</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></math><br /><br /><math> <mrow> <mo>&#8756;</mo><mtext>&#8201;</mtext><msup> <mi>e</mi> <mrow> <mo>&#8722;</mo><mi>t</mi><mo>/</mo><mi>&#964;</mi></mrow> </msup> <mtext>&#8201;</mtext><mo>=</mo><mtext>&#8201;</mtext><mfrac> <mn>1</mn> <mn>4</mn> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>&#8658;</mo><mtext>&#8201;</mtext><mi>t</mi><mtext>&#8201;</mtext><mo>=</mo><mtext>&#8201;</mtext><mi>&#964;</mi><mtext>&#8201;</mtext><mi>ln</mi><mtext>&#8201;</mtext><mn>4</mn><mtext>&#8201;</mtext><mo>=</mo><mtext>&#8201;</mtext><mn>2</mn><mi>&#964;</mi><mtext>&#8201;</mtext><mi>ln</mi><mtext>&#8201;</mtext><mn>2.</mn></mrow> </math><br /><br />Here <math> <mrow> <mi>&#964;</mi><mte ool.getmarks.app/nta_abhyas/jee_main/images/EM0025062_Ans_2.jpg\" width=\"240\" /><br /><br />Using KVL :<br /><br /><math> <mrow> <mn>2</mn> <mn>0</mn> <mo>&times;</mo> <mtext>0.05</mtext> <mo>+</mo> <mn>1</mn> <mn>0</mn> <mn>0</mn> <mo>&times;</mo> <mtext>0.03</mtext> <mo>-</mo> <msub> <mtext>V</mtext> <mn>2</mn> </msub> <mo>=</mo> <mn>0</mn> </mrow> </math><br /><br /><math> <mrow> <mn>1</mn> <mo>+</mo> <mn>3</mn> <mo>-</mo> <msub> <mtext>V</mtext> <mn>2</mn> </msub> <mo>=</mo> <mn>0</mn> </mrow> </math><br /><br /><math> <mrow> <msub> <mtext>V</mtext> <mn>2</mn> </msub> <mo>=</mo> <mn>4</mn> <mtext>V</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 7, "topicId": "6aa3ab79aa8dc1ff68178040", "title": "Electric Power and Heating Effect of Current", "totalQuestions": 22, "questions": [{"_id": "6151e863fb689001c49693ab", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "22", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The power dissipated (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>watt</mi></math>) in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math> resistance in the following circuit is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ghoigjkn.PNG\" style=\"width: 200px; height: 190px;\" />", "image": null}, "options": [], "correctValue": "0.75", "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/632294.JPG\" style=\"width: 230px; height: 430px;\" /><br /><br />From circuit, <math xmlns=\"http:/ 955;</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>R</mi></mrow><mrow><mn>2</mn><mi>&#955;</mi></mrow></mfrac><mo>&#215;</mo><msup><mrow><mi>q</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>&#955;</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><msup><mrow><mi>q</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>R</mi><mi>&#955;</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><msup><mrow><mi>q</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>R</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>&#215;</mo><mfrac><mrow><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">o</mi><msub><mrow><mi mathvariant=\"normal\">g</mi></mrow><mrow><mi>e</mi></mrow></msub><mn>2</mn></mrow><mrow><msub><mrow><mi>t</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac></math><br /><math><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>H</mi><mo>=</mo><mfrac><mrow><msup><mrow><mi>q</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>R</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">o</mi><msub><mrow><mi mathvariant=\"normal\">g</mi></mrow><mrow><mi>e</mi></mrow></msub><mn>2</mn></mrow><mrow><mn>2</mn><msub><mrow><mi>t</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863bdc050afd98b5303", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "32", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>In the circuit shown, the heat produced in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math> resistance due to current through it is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. Then, the heat generated per second in the&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math> resistance is</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/jee_4.JPG\" style=\"width: 260px; height: 151px;\" /><br />\r&nbsp;</p>\r", "image": null}, "options": [{"id": "O1rnM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">J</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "c3WN9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">J</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "id3zK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">J</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "GRbjL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">J</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Power is given as,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi><mo>=</mo><mn>50</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi><mo>=</mo><mi>Vi</mi><mi mathvariant=\"normal\">&#160;</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#8658;</mo><mi mathvariant=\"normal\">P</mi><mo>=</mo><msup><mi mathvariant=\"normal\">i</mi><mn>2</mn></msup><mi mathvariant=\"normal\">R</mi></math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/8_solu_cet.jpg\" style=\"width: 206px; height: 100px;\" /></p><p><math><mo>&#8658;</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi mathvariant=\"normal\">i</mi><mn>2</mn><mn>2</mn></msubsup><mo>=</mo><mfrac><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">R</mi></mfrac><mo>=</mo><mfrac><mn>50</mn><mn>5</mn></mfrac><mo>=</mo><mn>10</mn><mi mathvariant=\"normal\">&#160;</mi><msup><mi mathvariant=\"normal\">A</mi><mn>2</mn></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">V</mi><mo>=</mo><msup><mi mathvariant=\"normal\">i</mi><mn>2</mn></msup><msub><mi mathvariant=\"normal\">R</mi><mfenced separators=\"|\"><mrow><mn>5</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></mrow></mfenced></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><msqrt><mn>10</mn></msqrt><mo>&#215;</mo><mn>5</mn><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><msqrt><mn>250</mn></msqrt><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">V</mi></math><br /><br />and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math> are in series.<br /><br />So, the required resistance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi><mo>+</mo><mn>8</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi><mo>=</mo><mn>10</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">i</mi><mn>1</mn></msub><mo>=</mo><mfrac><mi mathvariant=\"normal\">V</mi><msub><mi mathvariant=\"normal\">R</mi><mfenced separators=\"|\"><mrow><mn>10</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></mrow></mfenced></msub></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">i</mi><mn>1</mn></msub><mo>=</mo><mfrac><msqrt><mn>250</mn></msqrt><mn>10</mn></mfrac><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">A</mi></math><br /><br />The heat generated per&nbsp;second in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>&nbsp;is given by,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi><mo>=</mo><msub><mi>Vi</mi><mn>1</mn></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msubsup><mi mathvariant=\"normal\">i</mi><mn>1</mn><mn>2</mn></msubsup><mo>&#215;</mo><mi mathvariant=\"normal\">R</mi></math><br /><br /><math><mo>=</mo><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><msqrt><mn>250</mn></msqrt></mrow><mrow><mn>10</mn></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>&#215;</mo><mn>2</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>250</mn><mn>100</mn></mfrac><mo>&#215;</mo><mn>2</mn><mo>=</mo><mfrac><mn>25</mn><mn>10</mn></mfrac><mo>&#215;</mo><mn>2</mn><mo>=</mo><mfrac><mn>25</mn><mn>5</mn></mfrac><mo>=</mo><mn>5</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b5302646324d9905", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "01", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The voltage of clouds is <math><mn>4</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>6</mn></mrow></msup><mi>&nbsp;</mi><mi mathvariant=\"normal\">V</mi></math> with respect to ground. In a lightning strike lasting <math> <mrow> <mtext>100&nbsp;ms</mtext></mrow> </math>, a charge of <math> <mrow> <mtext>4&nbsp;C</mtext></mrow> </math> is delivered to the ground. The average power of lightning strike is (assume complete discharges )", "image": null}, "options": [{"id": "2rbl5", "text": "<math > <mrow>  <mtext>160&#x00A0;MW</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "WTF2q", "text": "<math > <mrow>  <mtext>80&#x00A0;MW</mtext></mrow></math>", "image": null, "isCorrect": true}, {"id": "2PCN3", "text": "<math> <mrow>  <mtext>20&#x00A0;MW</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "5TNd7", "text": "<math> <mrow>  <mtext>500&#x00A0;KW</mtext></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Energy stored between cloud and earth, assuming the capacitor model is<br /><br /><math><mi>W</mi><mo>=</mo><mfrac><mrow><mi>qV</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><br /><math><mfrac><mrow><mn>4</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>6</mn></mrow></msup><mo>×</mo><mn>4</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mn>8</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>6</mn></mrow></msup><mi>&nbsp;</mi><mi mathvariant=\"normal\">J</mi></math><br /><br />The power of lightning strike is<br /><br /><math><mi>P</mi><mo>=</mo><mfrac><mrow><mi>W</mi></mrow><mrow><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><msup><mrow><mn>8</mn><mo>×</mo><mn>10</mn></mrow><mrow><mn>6</mn></mrow></msup></mrow><mrow><mn>0.1</mn></mrow></mfrac><mo>=</mo><mn>80</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>6</mn></mrow></msup><mi>&nbsp;</mi><mi mathvariant=\"normal\">W</mi></math><br /><br /><math><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mo>=</mo><mn>80</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">W</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b2b3a45a40fbf825", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "34", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A coil takes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn></math>&nbsp;minutes to boil a certain amount of water. Another coil takes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn></math>&nbsp;minutes for the same process. Time taken to boil the same amount of water when both coils are connected in series is", "image": null}, "options": [{"id": "pbGMx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math> minutes", "image": null, "isCorrect": false}, {"id": "XRjB8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8.6</mn></math> minutes", "image": null, "isCorrect": false}, {"id": "u0Zo7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>35</mn></math> minutes", "image": null, "isCorrect": true}, {"id": "LHbof", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn></math> minutes", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From Joule&#39;s law,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mi mathvariant=\"normal\">H</mi><mo>=</mo><mfrac><mrow><msup><mi mathvariant=\"normal\">V</mi><mn>2</mn></msup><mi mathvariant=\"normal\">t</mi></mrow><mi>RJ</mi></mfrac><mi mathvariant=\"normal\">&#160;</mi><mi>cal</mi></math><br /><br />Where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">V</mi></math> is potential difference, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">t</mi></math>&nbsp;is the time and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math>&nbsp;is the resistance.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mi mathvariant=\"normal\">R</mi><mo>=</mo><msub><mi mathvariant=\"normal\">R</mi><mn>1</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">R</mi><mn>2</mn></msub></math><br /><br />Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">R</mi></mfrac><mo>=</mo><mfrac><mi>HJ</mi><msup><mi mathvariant=\"normal\">V</mi><mn>2</mn></msup></mfrac><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mi>constant</mi><mo>=</mo><mi mathvariant=\"normal\">k</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi mathvariant=\"normal\">R</mi><mn>1</mn></msub><mo>=</mo><msub><mi>kt</mi><mn>1</mn></msub><mi mathvariant=\"normal\">&#160;</mi><mi>and</mi><mi mathvariant=\"normal\">&#160;</mi><msub><mi mathvariant=\"normal\">R</mi><mn>2</mn></msub><mo>=</mo><msub><mi>kt</mi><mn>2</mn></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi mathvariant=\"normal\">&#160;</mi><mi>kt</mi><mo>=</mo><msub><mi>kt</mi><mn>1</mn></msub><mo>+</mo><msub><mi>kt</mi><mn>2</mn></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">t</mi><mo>=</mo><mn>15</mn><mo>+</mo><mn>20</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">t</mi><mo>=</mo><mn>35</mn></math>&nbsp;minutes", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86394bb1e0eebdc2f9b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "74", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>24</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">V</mi></math> battery of internal resistance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math> is connected to a variable resistance. If the rate of heat production in the resistor is maximum, then the current in the circuit is", "image": null}, "options": [{"id": "UxeWq", "text": "<math><mn>2</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}, {"id": "cSaGv", "text": "<math><mn>3</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": true}, {"id": "foCvl", "text": "<math><mn>4</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}, {"id": "ZSIG9", "text": "<math><mn>6</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mi>r</mi></math> (power dissipated is maximum)<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image22-9eb0fa53-d4f7-4daa-9ebb-cd2602327459.jpg\" style=\"max-width:100%; object-fit:contain\" /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi mathvariant=\"normal\">&#160;</mi><mi>R</mi><mo>=</mo><mn>4&#160;</mn><mi mathvariant=\"normal\">&#937;</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mi>I</mi><mo>=</mo><mfrac><mi>V</mi><msub><mi>R</mi><mrow><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">t</mi></mrow></msub></mfrac><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mfrac><mn>24</mn><mn>8</mn></mfrac><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mn>3</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">A</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863892fcd9edc1d36b0", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "62", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A battery is charged at a potential of 15 V in 8 h when the current flowing is 10A. The battery on discharge supplies a current of 5A for 15 h. The mean terminal voltage during discharge is 14V. What is the watt-hour efficiency of the battery?", "image": null}, "options": [], "correctValue": "87.5", "solution": {"text": "The power of the battery, when charged is given by<br /><br /><math><msub><mrow><mi>P</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>I</mi></mrow><mrow><mn>1</mn></mrow></msub></math><br /><br />The electrical energy dissipated is given by<br /><br /><math><msub><mrow><mi>E</mi></mrow><mrow><mi>t</mi></mrow></msub><mo>=</mo><msub><mrow><mi>P</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub></math><br /><br /><math><msub><mrow><mi>E</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>I</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>15</mn><mo>×</mo><mn>10</mn><mo>×</mo><mn>8</mn></math><br /><br /><math><mo>=</mo><mn>1200</mn><mi>&nbsp;</mi><mi>W</mi><mi>h</mi></math><br /><br />Similarly, the electrical energy dissipated during the discharge of battery is given by<br /><br /><math><msub><mrow><mi>E</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><msub><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>I</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br /><math><mo>=</mo><mn>14</mn><mo>×</mo><mn>5</mn><mo>×</mo><mn>15</mn></math><br /><br /><math><mo>=</mo><mn>1050</mn><mi>&nbsp;</mi><mi>W</mi><mi>h</mi></math><br /><br />Hence, watt-hour efficiency of the battery is given by<br /><br /><math><mi>η</mi><mo>=</mo><mfrac><mrow><msub><mrow><mi>E</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>E</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>×</mo><mn>100</mn></math><br /><br /><math><mo>=</mo><mn>0.875</mn><mo>×</mo><mn>100</mn><mo>=</mo><mn>87.5</mn><mi>%</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637fb33e62f5109b83", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "53", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Find the resistor in which the dissipated power is the greatest -<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image42-5b4f8a6e-4c27-4278-bf38-346dac268633.jpg\" style=\"width: 200px; height: 114px;\" />", "image": null}, "options": [{"id": "Hi74s", "text": "<math><mn>2</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">&Omega;</mi></math>", "image": null, "isCorrect": false}, {"id": "2uKny", "text": "<math><mn>9</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">&Omega;</mi></math>", "image": null, "isCorrect": false}, {"id": "qSDjZ", "text": "<math><mn>18</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": false}, {"id": "fDfEn", "text": "<math><mn>5</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Equivalent circuit<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/75204_1.jpg\" style=\"width: 313px; height: 188px;\" /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/75204_2.jpg\" style=\"width: 289px; height: 199px;\" /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta 998/Math/MathML\"><mn>3</mn></math> identical cells of negligible internal resistances are connected in series. Due to the current, the temperature of the wire is raised by <math> <mrow> <mo>Δ</mo> <mtext mathvariant=\"italic\">T</mtext> </mrow> </math>&nbsp;<math><mrow><mo></mo> </mrow> </math>in a time <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi></math>.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi></math>&nbsp;number&nbsp;of similar cells is now connected&nbsp; in series with a wire of the same material and cross-section but of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>L</mi></math>. The temperature of the wire is raised by the same amount&nbsp;<math> <mrow> <mo>Δ</mo> <mtext mathvariant=\"italic\">T</mtext> </mrow> </math> <math><mrow><mo></mo></mrow></math>in the same time. The value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi></math>&nbsp;is", "image": null}, "options": [], "correctValue": "6", "solution": {"text": "In the first case,&nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>3</mn> <mtext mathvariant=\"italic\">E</mtext> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> </mrow> <mrow> <mtext mathvariant=\"italic\">R</mtext> </mrow> </mfrac> <mi>t</mi> <mo>=</mo> <mtext mathvariant=\"italic\">m</mtext> <mtext mathvariant=\"italic\">s</mtext> <mo>Δ</mo> <mtext mathvariant=\"italic\">T </mtext></mrow></math>&nbsp;...(i)<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;<math> <mrow> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mtext mathvariant=\"italic\">H</mtext> <mo>=</mo> <mfrac> <mrow> <msup> <mtext mathvariant=\"italic\">V</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mtext mathvariant=\"italic\">R</mtext> </mrow> </mfrac> <mi>t</mi> </mrow> </mfenced> </mrow> </math><br /><br />When length of the wire is doubled, resistance and mass both are doubled.<br />Therefore, in the second case,&nbsp;&nbsp;&nbsp;&nbsp;<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;<math> <mrow> <mfrac> <mrow> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext mathvariant=\"italic\">N</mtext> <mtext mathvariant=\"italic\">E</mtext> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn> <mtext mathvariant=\"italic\">R</mtext> </mrow> </mfrac> <mo>·</mo> <mi>t</mi> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>2</mn> <mtext mathvariant=\"italic\">m</mtext> </mrow> </mfenced> <mtext mathvariant=\"italic\">s</mtext> <mo>Δ</mo> <mtext mathvariant=\"italic\">T</mtext></mrow></math>&nbsp; ...(ii)<br /><br />Dividing equation (ii) by (i), we get<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp; &nbsp; &nbsp;&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mtext mathvariant=\"italic\">N</mtext><mn>2</mn></msup><mtext>18</mtext></mfrac><mo>=</mo><mn>2</mn></math>&nbsp;or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>N</mi><mn>2</mn></msup><mo>=</mo><mn>36</mn></math>&nbsp;or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi><mo>=</mo><mn>6</mn></math>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86352bc7bd2714efd76", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "38", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A wire of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math> identical cells, of negligible internal resistance, are connected in series. Due to the current, the temperature of the wire is raised by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>Δ</mo><mi>T</mi></math> in a time <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi></math>. A number of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi></math> similar cells are now connected in series with a wire of the same material and area of cross-section but of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>L</mi></math>. The temperature of the wire is raised by the same amount <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>Δ</mo><mi>T</mi></math> in the same time.&nbsp;Find the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi></math>.</p>\r", "image": null}, "options": [], "correctValue": "6", "solution": {"text": "In the first case<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mfenced><mrow><mn>3</mn><mi>E</mi></mrow></mfenced><mn>2</mn></msup><mi>R</mi></mfrac><mi>t</mi><mo>=</mo><mi>m</mi><mi>s</mi><mo>&#916;</mo><mi>T</mi></math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;... (ii)<br /><br />&nbsp;When the length of the wire is doubled, resistance and mass both are doubled. Therefore, in the second case,<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mfenced><mrow><mi>N</mi><mi>E</mi></mrow></mfenced><mn>2</mn></msup><mrow><mn>2</mn><mi>R</mi></mrow></mfrac><mi>t</mi><mo>=</mo><mfenced><mrow><mn>2</mn><mi>m</mi></mrow></mfenced><mi>s</mi><mo>&#916;</mo><mi>T</mi></math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;... (ii)<br /><br />&nbsp;Dividing Eq.(ii) by (i) we get<br /><br />&nbsp; &nbsp; &nbsp; &nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>N</mi><mn>2</mn></msup><mn>18</mn></mfrac><mo>=</mo><mn>2</mn></math><br /><br />or &nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mtext mathvariant=\"italic\">N</mtext><mn>2</mn></msup><mo>=</mo><mn>36</mn></math><br /><br />or &nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi><mo>=</mo><mn>6</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86352a794f873a99189", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "18", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A battery of internal resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math> is connected to the network of resistances as shown in the figure. In order that the maximum power be delivered to the network, the value of <em><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math></em>&nbsp;(in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Ω</mi></math>) should be<br />\r<br />\r<style type=\"text/css\"><!--\r\t\t@page { margin: 2cm }\r\t\tP { margin-bottom: 0.21cm }\r\t-->\r</style>\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0001496_Ques1_1.jpg\" style=\"width: 390px; height: 164px;\" />", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "The given circuit is a balanced Wheatstone's bridge.<br /><br /><style type=\"text/css\"><!--\t\t@page { margin: 2cm }\t\tP { margin-bottom: 0.21cm }\t--></style><strong><u><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0001496_AnsExp4_1.jpg\" style=\"width: 456px; height: 200px;\" /></u></strong><br /><br />Thus, no current will flow across <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mi>R</mi></math>. The given circuit will now be equivalent to:-<br /><br /><style type=\"text/css\"><!--\t\t@page { margin: 2cm }\t\tP { margin-bottom: 0.21cm }\t--></style><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0001496_AnsExp4_2..jpg\" /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0001496_AnsExp4_3..jpg\" style=\"width: 348px; height: 177px;\" /><br /><br />For maximum power, net external resistance = Total internal resistance<br />or&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>R</mi><mo>=</mo><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math><br />or&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634de6ad4943783be6", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "66", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An air-filled parallel plate capacitor has capacitance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math>. The capacitor is connected through a resistor to a voltage source providing a constant potential difference <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi></math><br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image34-bb612c78-285f-440f-9442-5b397256a6c7.jpg\" style=\"height: 120px; width: 220px;\" /><br />\r<br />\rA dielectric plate with a dielectric constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi></math> is inserted into the capacitor, filling it completely. After the equilibrium is established plate is quickly removed. Find the amount of heat generated in the resistor by the time, the equilibrium is re-established.", "image": null}, "options": [{"id": "ZNa5q", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><msup><mi>V</mi><mn>2</mn></msup><mi mathvariant=\"normal\">&#160;</mi><mfenced separators=\"|\"><mrow><mi>K</mi><mo>-</mo><mi mathvariant=\"normal\">&#160;</mi><mn>1</mn></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "bZawW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>C</mi><msup><mi>V</mi><mn>2</mn></msup><mi mathvariant=\"normal\">&nbsp;</mi><msup><mfenced separators=\"|\"><mrow><mi>K</mi><mo>-</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>1</mn></mrow></mfenced></msup></math>", "image": null, "isCorrect": true}, {"id": "3PGPu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><msup><mi>V</mi><mn>2</mn></msup><mi mathvariant=\"normal\">&#160;</mi><msup><mfenced separators=\"|\"><mrow><mi>K</mi><mo>-</mo><mi mathvariant=\"normal\">&#160;</mi><mn>1</mn></mrow></mfenced><mn>2</mn></msup></math>", "image": null, "isCorrect": false}, {"id": "UBlL8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>C</mi><msup><mi>V</mi><mn>2</mn></msup><mfenced separators=\"|\"><mrow><msup><mi>K</mi><mn>2</mn></msup><mo>-</mo><mi mathvariant=\"normal\">&#160;</mi><mn>1</mn></mrow></mfenced></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>After the insertion of the slab and steady-state is reached, the energy stored in the capacitor is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>U</mi><mi mathvariant=\"normal\">i</mi></msub><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>K</mi><mi>C</mi><msup><mi>V</mi><mn>2</mn></msup></math></p><p>After the removal of the lab and steady-state is reached, the energy stored in the capacitor is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>U</mi><mi mathvariant=\"normal\">f</mi></msub><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>C</mi><msup><mi>V</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">H</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">t</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>C</mi><msup><mfenced separators=\"|\"><mrow><mi>K</mi><mo>-</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>1</mn></mrow></mfenced></msup><msup><mi>V</mi><mn>2</mn></msup></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633cb80fbbd11149bc", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "92", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two bulbs consume the same power when operated at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> respectively. When these bulbs are connected in series across a DC source of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>400</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>, then the ratio of power consumed across them is", "image": null}, "options": [{"id": "MYhr1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>3</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "tMNlm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "3CD2M", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>9</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "TT5je", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><mn>4</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi>R</mi><mo>=</mo><mfrac><mrow><msup><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>P</mi></mrow></mfrac><mi>&nbsp;</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi><mi>&nbsp;</mi><mi>R</mi><mo>∝</mo><msup><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>&nbsp;</mi><mo>∴</mo><mfrac><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mn>200</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mn>300</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>9</mn></mrow></mfrac></math>.<br /><br />When bulbs are connected in series, the current <math><mi>I</mi></math> is same through each. As <math><mi>P</mi><mo>=</mo><msup><mrow><mi>I</mi></mrow><mrow><mn>2</mn></mrow></msup><mi ", "title": "Wheatstone Bridge", "totalQuestions": 13, "questions": [{"_id": "6151e863f457c9ac2dec9aa1", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "20", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two unknown resistance are connected in the two gaps of a meter-bridge. The null point is obtained at 40 cm from the left end. A <math><mn>30</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math> resistance is connected in series with the smaller of the two resistances, the null point shifts by 20 cm to the right end. What is the value of the smaller resistance (in <math><mi mathvariant=\"normal\">Ω</mi></math>)? ", "image": null}, "options": [], "correctValue": "24", "solution": {"text": "<p><math><msub><mrow><mi mathvariant=\"script\">l</mi></mrow><mrow><mi>x</mi></mrow></msub><mo>=</mo><mn>40</mn><mi>&#160;</mi><mi>c</mi><mi>m</mi><mo>,</mo><mi>&#160;</mi><msub><mrow><mi mathvariant=\"script\">l</mi></mrow><mrow><mi>R</mi></mrow></msub><mo>=</mo><mn>60</mn><mi>&#160;</mi><mi>c</mi><mi>m</mi></math><br /><br /><math><mfrac><mrow><mi>x</mi></mrow><mrow><mi>R</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi mathvariant=\"script\">l</mi></mrow><mrow><mi>x</mi></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"script\">l</mi></mrow><mrow><mi>R</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>40</mn></mrow><mrow><mn>60</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math> ....... (i)<br /><br /><math><mo>&#8756;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mfrac><mrow><mi>x</mi><mo>+</mo><mn>30</mn><mi>&#160;</mi></mrow><mrow><mi>R</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>60</mn></mrow><mrow><mn>40</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mfrac><mrow><mi>x</mi><mo>+</mo><mn>30</mn></mrow><mi>x</mi></mfrac><mo>=</mo><mfrac><mn>9</mn><mn>4</mn></mfrac></math></p><p><math><mn>9</mn><mi>x</mi><mo>=</mo><mn>4</mn><mi>x</mi><mo>+</mo><mn>120</mn></math><br /><br /><math><mn>5</mn><mi>x</mi><mo>=</mo><mn>120</mn><mi>&#160;</mi><mi>&#160;</mi><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>x</mi><mo>=</mo><mn>24</mn><mi>&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863eed797f4d77d8833", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "09", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In Wheatstone bridge, four resistors of resistances&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi mathvariant=\"normal\">&#937;</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>&nbsp;respectively, are connected in cyclic order. The resistance (in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#937;</mi></math>) that is to be connected in parallel with the resistance of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>&nbsp;to balance the network is", "image": null}, "options": [], "correctValue": "10", "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>10</mn><mi>R</mi></mrow><mrow><mn>10</mn><mo>+</mo><mi>R</mi></mrow></mfrac><mo>×</mo><mn>12</mn><mo>=</mo><mn>15</mn><mo>×</mo><mn>4</mn></math></p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Question_21.jpg\" style=\"width: 337px; height: 197px;\" /><br /><br />on solving <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>10</mn><mi>Ω</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863eb63a8607511a5b4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "12", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>The figure below shows a wheatstone bridge with resistors&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math>&nbsp;having&nbsp;almost equal resistance.&nbsp;When <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>400</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math>,&nbsp;the bridge is in balanced condition. If on interchanging <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math>, the bridge is again balanced for <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>405</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math>, then the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>X</mi></math>&nbsp;is</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/629348q.png\" style=\"width: 188px; height: 290px;\" /></p>\r", "image": null}, "options": [{"id": "2cex4", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>404</mn><mo>.</mo><mn>5</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi></math>", "image": null, "isCorrect": false}, {"id": "Nn4PG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>402</mn><mo>.</mo><mn>5</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi></math>", "image": null, "isCorrect": true}, {"id": "1ZjGG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>403</mn><mo>.</mo><mn>5</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi></math>", "image": null, "isCorrect": false}, {"id": "V1JYv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>401</mn><mo>.</mo><mn>5</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Initially,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>P</mi><mi>Q</mi></mfrac><mo>=</mo><mfrac><mn>400</mn><mi>x</mi></mfrac></math></p><p>Once we interchange&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math>, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>Q</mi><mi>P</mi></mfrac><mo>=</mo><mfrac><mn>405</mn><mi>X</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mi>P</mi><mi>Q</mi></mfrac><mo>&#215;</mo><mfrac><mi>Q</mi><mi>P</mi></mfrac><mo>=</mo><mfrac><mrow><mn>400</mn><mo>&#215;</mo><mn>405</mn></mrow><msup><mi>X</mi><mn>2</mn></msup></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>X</mi><mo>=</mo><msqrt><mn>400</mn><mo>&#215;</mo><mn>405</mn></msqrt><mo>&#8776;</mo><mn>402</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e5d357b3168ed43d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "08", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The resistance of the following circuit figure between <math><mi>A</mi></math> and <math><mi>B</mi></math> is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0038956_Question.jpg\" style=\"width: 199px; height: 164px;\" />", "image": null}, "options": [{"id": "5l8mL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>2</mn></mfrac><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi></math>", "image": null, "isCorrect": true}, {"id": "DHwj0", "text": "<math><mn>2</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">&Omega;</mi></math>", "image": null, "isCorrect": false}, {"id": "UhiyI", "text": "<math><mn>4</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">&Omega;</mi></math>", "image": null, "isCorrect": false}, {"id": "E42aZ", "text": "<math><mn>8</mn><mi> </mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since resistance connected in arms <math><mi mathvariant=\"italic\">CE</mi><mo>,</mo><mi mathvariant=\"italic\"> ED</mi><mo>,</mo><mi mathvariant=\"italic\"> CF</mi></math><br />and <math><mi mathvariant=\"italic\">FD</mi></math> will form a balanced Wheatstone bridge,<br />therefore, the resistance of arm <math><mi mathvariant=\"italic\">EF</mi></math> becomes<br />ineffective. Now resistance of arm <math><mi mathvariant=\"italic\">CED</mi></math> or <math><mi mathvariant=\"italic\">CFD</mi><mo>=</mo><mn>2</mn><mo>+</mo><mn>2</mn><mo>=</mo><mn>4</mn><mi mathvariant=\"normal\">Ω</mi></math><br />Effective resistance of these two parallel arm <math><mo>=</mo><mfrac><mrow><mn>4</mn><mo>×</mo><mn>4</mn></mrow><mrow><mn>4</mn><mo>+</mo><mn>4</mn></mrow></mfrac><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">Ω</mi></math><br /><br />Now resistance of arm <math><mi mathvariant=\"italic\">ACDB</mi><mo>=</mo><mn>2</mn><mo>+</mo><mn>2</mn><mo>+</mo><mn>2</mn><mo>=</mo><mn>6</mn><mi mathvariant=\"normal\">Ω</mi></math><br />in parallel with resistance arm <math><mi mathvariant=\"italic\">AB</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">Ω</mi></math> Thus,<br />effective resistance between <math><mi>A</mi></math> and <math><mi>B</mi></math><br /><br /><math><mo>=</mo><mfrac><mrow><mn>6</mn><mo>×</mo><mn>2</mn></mrow><mrow><mn>6</mn><mo>+</mo><mn>2</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">Ω</mi></math><br /><br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863da123fdc992d6c2e", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "66", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The metre bridge wire <math><mi>A</mi><mi>B</mi></math> shown in the adjoining figure is <math><mn>100 cm</mn></math> long. When <math><mi>A</mi><mi>D</mi><mo>=</mo><mn>30</mn><mi>&nbsp;</mi><mi>cm</mi><mo>,</mo></math> no deflection occurs in the galvanometer. What is the value of <math><mi>R</mi></math>&nbsp;(in ohm)?<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/deepa.PNG\" style=\"width: 200px; height: 115px;\" />", "image": null}, "options": [], "correctValue": "14", "solution": {"text": "Let <math><mi>ρ</mi></math> be the resistance per unit length of the metre bridge wire.<br /><br />From the condition of balance of Wheatstone bridge.<br /><br /><math><mfrac><mrow><mi>P</mi></mrow><mrow><mi>Q</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>R</mi></mrow><mrow><mi>S</mi></mrow></mfrac></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><mn>6</mn></mrow><mrow><mi>R</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>30</mn><mi>ρ</mi></mrow><mrow><mfenced separators=\"|\"><mrow><mn>100</mn><mo>-</mo><mn>30</mn></mrow></mfenced><mi>ρ</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>30</mn></mrow><mrow><mn>70</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>7</mn></mrow></mfrac></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>R</mi><mo>=</mo><mfrac><mrow><mn>7</mn><mo>×</mo><mn>6</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>R</mi><mo>=</mo><mn>14</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d008bdca1a39da7f", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "37", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In a Wheatstone's network,&nbsp;<math xmlns=\"http://www.w3.org/1998/Mat ub></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi>i</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>i</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math><br /><br /><math><mo>∴</mo><msub><mrow><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>θ</mi></mrow><mrow><mn>1</mn></mrow></msub><mi>&nbsp;</mi><mo>:</mo><msub><mrow><mi>θ</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>2</mn></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>i</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>:</mo><msub><mrow><mi>i</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>2:1</mn></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>i</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><msub><mrow><mi>i</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mn>5</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>4</mn></mrow></msup><mn>m</mn><mn>A</mn></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>i</mi><mo>=</mo><mfrac><mrow><mi>V</mi></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">f</mi></mrow></msub><mo>+</mo><mi>R</mi><mi>s</mi></mrow></mfrac><mo>⇒</mo><mi>R</mi><mi>s</mi><mo>=</mo><mfrac><mrow><mi>V</mi></mrow><mrow><mi>i</mi></mrow></mfrac><mo>-</mo><msub><mrow><mi>R</mi></mrow><mrow><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">f</mi></mrow></msub></math><br /><br /><math><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>5</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>4</mn></mrow></msup></mrow></mfrac><mo>-</mo><mn>2000</mn></math><br /><br /><math><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo></mo><mn>4</mn></mrow></msup><mo>-</mo><mn>2000</mn></math><br /><br /><math><mo>=</mo><mn>4</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo></mo><mn>3</mn></mrow></msup><mo>-</mo><mn>2000</mn></math><br /><br /><math><mo>=</mo><mn>2000&nbsp;</mn><mi mathvariant=\"normal\">Ω</mi></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi></math> The resistance of <math><mn>1970</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math> is to be replaced by <math><mn>1970</mn><mo>+</mo><mn>2000</mn><mo>=</mo><mn>3970&nbsp;</mn><mi mathvariant=\"normal\">Ω</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86394a2ce5c3b97f111", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "22", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two cells of E.M.F.&nbsp;<math><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">&nbsp;</mi><mfenced separators=\"|\"><mrow><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">&nbsp;</mi><mo>&gt;</mo><mi mathvariant=\"normal\">&nbsp;</mi><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfenced></math> are connected in series in the secondary circuit of a potentiometer experiment for determination of E.M.F. The balancing length is found to be <math><mn>825</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>. Now when the terminals of cell&nbsp;<math><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>1</mn></mrow></msub></math> are reversed, then the balancing length is found to be <math><mn>225</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>. The ratio of <math><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>2</mn></mrow></msub></math> is", "image": null}, "options": [{"id": "WsnsO", "text": "<math><mn>2</mn><mi mathvariant=\"normal\"> </mi><mo>:</mo><mi mathvariant=\"normal\"> </mi><mn>3</mn></math>", "image": null, "isCorrect": false}, {"id": "WHXBM", "text": "<math><mn>4</mn><mi mathvariant=\"normal\">&nbsp;</mi><mo>:</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>7</mn></math>", "image": null, "isCorrect": true}, {"id": "yMkZ7", "text": "<math><mn>7</mn><mi mathvariant=\"normal\"> </mi><mo>:</mo><mi mathvariant=\"normal\"> </mi><mn>4</mn></math>", "image": null, "isCorrect": false}, {"id": "4KHHZ", "text": "none of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">&nbsp;</mi><mo>+</mo><mi mathvariant=\"normal\">&nbsp;</mi><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>1</mn></mrow></msub><mi mathvariant=\"normal\">&nbsp;</mi><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">x</mi><mfenced separators=\"|\"><mrow><mn>825</mn></mrow></mfenced></math><br /><br /><math><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">&nbsp;</mi><mo>–</mo><mi mathvariant=\"normal\">&nbsp;</mi><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>1</mn></mrow></msub><mi mathvariant=\"normal\">&nbsp;</mi><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">x</mi><mfenced separators=\"|\"><mrow><mn>225</mn></mrow></mfenced></math><br /><br />Dividing above equations, we get<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi mathvariant=\"normal\">E</mi><mn>2</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">E</mi><mn>1</mn></msub></mrow><mrow><msub><mi mathvariant=\"normal\">E</mi><mn>2</mn></msub><mo>-</mo><msub><mi mathvariant=\"normal\">E</mi><mn>1</mn></msub></mrow></mfrac><mo>=</mo><mfrac><mn>11</mn><mn>3</mn></mfrac></math><br /><br />Appling componendo and dividendo, we get<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi mathvariant=\"normal\">E</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">E</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><mn>4</mn><mn>7</mn></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638b9294a346be9b0b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "48", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An ammeter has resistance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>0</mn></msub></math>&nbsp;and range&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>i</mi></math>.&nbsp; What resistance should be connected in parallel with it to increase its range by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mi>i</mi></math>?", "image": null}, "options": [{"id": "m1PY1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>0</mn></msub><mo>/</mo><mfenced><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></mfenced></math>", "
