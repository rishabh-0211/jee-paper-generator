h><mfrac><mrow><mn>3</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mo>A</mo></math>", "image": null, "isCorrect": true}, {"id": "rs9NY", "text": "<math><mfrac><mrow><mn>2</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mo>A</mo></math>", "image": null, "isCorrect": false}, {"id": "9nlIM", "text": "<math><mfrac><mrow><mn>4</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mo>A</mo></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The circuit can be reduced as follows<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Nandigama.PNG\" style=\"width: 300px; height: 124px;\" /><br /><br />Reading of ammeter <math><mo>=</mo><mi>I</mi></math><br /><br /><math><mo>=</mo><mfrac><mrow><mn>300</mn></mrow><mrow><mrow><mrow><mi>R</mi></mrow><mo>/</mo><mrow><mn>3</mn></mrow></mrow></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>900</mn></mrow><mrow><mi>R</mi></mrow></mfrac></math><br /><br />As. <math><mi>R</mi><mo>=</mo><mn>1500&nbsp;</mn><mi mathvariant=\"normal\">Ω</mi><mo>,</mo><mi>&nbsp;</mi><mi>I</mi><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>5&nbsp;</mn></mrow></mfrac><mi>A</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863f60edb04e2998247", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "87", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>80&nbsp;μ</mtext><mtext>C</mtext></math> charge is given to the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>4&nbsp;μ</mtext><mtext>F</mtext></math> capacitor in the circuit shown in the figure so that the upper plate&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> is positively charged. An unknown resistance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> is connected in the left limb. As soon as the switch&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi></math> in the central limb is closed, a current of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math> flows through the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mtext>Ω</mtext></math> resistor in the central limb. The capacitive time constant for the circuit is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0067835.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 240px; height: 130px;\" />", "image": null}, "options": [{"id": "1amEI", "text": "<math> <mrow> <mo>56&nbsp;</mo> <mtext>&mu;</mtext> <mtext>s</mtext> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "8bVH3", "text": "<math> <mrow> <mo>8&nbsp;</mo> <mtext>&mu;</mtext> <mtext>s</mtext> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "tzwHb", "text": "<math> <mrow> <mo>200&nbsp;</mo> <mtext>&mu;</mtext> <mtext>s</mtext> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "Gher9", "text": "<math> <mrow> <mo>40&nbsp;</mo> <mtext>μ</mtext> <mtext>s</mtext> </mrow> </math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Potential difference across the central limb = 16 V = Potential difference across <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>16</mn><mo>&#160;</mo><mtext>&#937;</mtext></math> = Potential difference across the left limb.<br /><br /><math> <mrow> <mo>&#8658;</mo> <mo>current through</mo> <mo>16</mo> <mtext>&#937;</mtext> <mo>=</mo> <mn>1</mn> <mo>A</mo> </mrow> </math><br /><br /><math> <mrow> <mo>&#8658;</mo> <mo>current through the left limb</mo> <mo>=</mo> <mn>1</mn> <mo>A</mo> </mrow> </math>&nbsp;and<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>R</mtext><mo>=</mo><mn>11</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><msub><mi>&#964;</mi><mtext>c</mtext></msub><mo>=</mo><mfenced><mrow><mfrac><mrow><mn>1</mn><mn>6</mn></mrow><mn>2</mn></mfrac><mo>+</mo><mn>2</mn></mrow></mfenced><mo>ohms</mo><mo>&#215;</mo><mfenced><mrow><mn>4</mn><mo>&#215;</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup></mrow></mfenced><mo>&#160;</mo><mo>F</mo><mo>=</mo><mo>40</mo><mo>&#160;</mo><mtext>&#956;</mtext><mtext>s</mtext></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863f164213650592937", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "09", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A circuit consists of three identical lamps connected to a battery as shown in the figure. When the switch <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math> is closed then the intensities of lamps&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math></p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/image77-c9c14abc-58c8-4665-8959-fae50272f4f11.jpg\" style=\"width: 312px; height: 169px;\" /></p>\r", "image": null}, "options": [{"id": "o3ZJP", "text": "will increase by eight times", "image": null, "isCorrect": false}, {"id": "W8FPW", "text": "will decrease by two times", "image": null, "isCorrect": false}, {"id": "Kl4oG", "text": "will increase by more than two times", "image": null, "isCorrect": true}, {"id": "oIBBG", "text": "will remain the same", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "After closing of <math><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">C</mi></math> bulb or lamp become short circuited<br /><br /><br /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image78-6d2f89ea-6cbd-44b3-8dc6-48cb1e0fd20c.jpg\" style=\"width: 250px; height: 125px;\" /><br /><br /><br /><br />potential across <math><mi mathvariant=\"normal\">A</mi></math> and <math><mi mathvariant=\"normal\">B</mi></math> before closing of <math><mi mathvariant=\"normal\">S</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>3</mn></mrow></mfrac></math><br /><br />Potential across <math><mi mathvariant=\"normal\">A</mi></math> and <math><mi mathvariant=\"normal\">B</mi></math> after closing of <math><mi mathvariant=\"normal\">S</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><br />As <math><mi>P</mi><mo>∝</mo><msup><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br /><math><mo>∴</mo><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mi mathvariant=\"normal\">i</mi></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mi mathvariant=\"normal\">f</mi></mrow></msub></mrow></mfrac><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><mn>4</mn></mrow><mrow><mn>9</mn></mrow></mfrac></math><br /><br /><math><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mi mathvariant=\"normal\">f</mi></mrow></msub><mo>=</mo><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mi mathvariant=\"normal\">i</mi></mrow></msub><mo>×</mo><mn>9</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>2.25</mn><mi mathvariant=\"normal\">&nbsp;</mi><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mi mathvariant=\"normal\">i</mi></mrow></msub></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ee6314457d9d6578", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "08", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>The current <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>I</mi><mn>1</mn></msub></math>&nbsp;(in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>)&nbsp;flowing through the&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math> resistor in the given circuit is</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/628243_CA_que.png\" style=\"width: 200px; height: 158px;\" /></p>\r", "image": null}, "options": [{"id": "zq977", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>2</mn></math>", "image": null, "isCorrect": true}, {"id": "1WJny", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>4</mn></math>", "image": null, "isCorrect": false}, {"id": "NYS3J", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>5</mn></math>", "image": null, "isCorrect": false}, {"id": "1z3bi", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>25</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/628243solu_CA.png\" style=\"width: 200px; height: 163px;\" /></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mo>.</mo><mn>5</mn></mrow></mfrac><mo>=</mo><mn>0</mn><mo>.</mo><mn>4</mn><mi mathvariant=\"normal\">A</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>i</mi><mo>=</mo><mfrac><mi>I</mi><mn>2</mn></mfrac><mo>=</mo><mn>0</mn><mo>.</mo><mn>2</mn><mi>A</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e75dfcd22ee6dab1", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "108", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A battery of internal resistance <math><mn>4</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math> is connected to the network of resistances, as shown in the figure. In order to deliver the maximum power&nbsp;to the network, what should be the value of R in ohm?<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/gjlksdhgos.PNG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 250px; height: 124px;\" />", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "The given figure is a balanced form of Wheatstone bridge therefore, 6R resistance can be removed.<br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mi>P</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn><mi>R</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>6</mn><mi>R</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><mi>R</mi></mrow></mfrac></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>R</mi></mrow><mrow><mi>P</mi></mrow></msub><mo>=</mo><mn>2</mn><mi>R</mi><mo>.</mo></math><br /><br />The power delivered to the network is maximum when internal resistance = External resistance.<br /><br /><math><mn>4</mn><mo>=</mo><mn>2</mn><mi>R</mi></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>R</mi><mo>=</mo><mn>2&nbsp;</mn><mi mathvariant=\"normal\">Ω</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e5d357b3168ed43d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "08", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The resistance of the following circuit figure between <math><mi>A</mi></math> and <math><mi>B</mi></math> is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0038956_Question.jpg\" style=\"width: 199px; height: 164px;\" />", "image": null}, "options": [{"id": "5l8mL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>2</mn></mfrac><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi></math>", "image": null, "isCorrect": true}, {"id": "DHwj0", "text": "<math><mn>2</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">&Omega;</mi></math>", "image": null, "isCorrect": false}, {"id": "UhiyI", "text": "<math><mn>4</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">&Omega;</mi></math>", "image": null, "isCorrect": false}, {"id": "E42aZ", "text": "<math><mn>8</mn><mi> </mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since resistance connected in arms <math><mi mathvariant=\"italic\">CE</mi><mo>,</mo><mi mathvariant=\"italic\"> ED</mi><mo>,</mo><mi mathvariant=\"italic\"> CF</mi></math><br />and <math><mi mathvariant=\"italic\">FD</mi></math> will form a balanced Wheatstone bridge,<br />therefore, the resistance of arm <math><mi mathvariant=\"italic\">EF</mi></math> becomes<br />ineffective. Now resistance of arm <math><mi mathvariant=\"italic\">CED</mi></math> or <math><mi mathvariant=\"italic\">CFD</mi><mo>=</mo><mn>2</mn><mo>+</mo><mn>2</mn><mo>=</mo><mn>4</mn><mi mathvariant=\"normal\">Ω</mi></math><br />Effective resistance of these two parallel arm <math><mo>=</mo><mfrac><mrow><mn>4</mn><mo>×</mo><mn>4</mn></mrow><mrow><mn>4</mn><mo>+</mo><mn>4</mn></mrow></mfrac><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">Ω</mi></math><br /><br />Now resistance of arm <math><mi mathvariant=\"italic\">ACDB</mi><mo>=</mo><mn>2</mn><mo>+</mo><mn>2</mn><mo>+</mo><mn>2</mn><mo>=</mo><mn>6</mn><mi mathvariant=\"normal\">Ω</mi></math><br />in parallel with resistance arm <math><mi mathvariant=\"italic\">AB</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">Ω</mi></math> Thus,<br />effective resistance between <math><mi>A</mi></math> and <math><mi>B</mi></math><br /><br /><math><mo>=</mo><mfrac><mrow><mn>6</mn><mo>×</mo><mn>2</mn></mrow><mrow><mn>6</mn><mo>+</mo><mn>2</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">Ω</mi></math><br /><br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863dea7eb09c354aa53", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "30", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Three resistors of equal resistance are arranged in four different combinations, as shown below. Arrange the combinations in increasing order of power dissipation if it is known that each combination carries the same current.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0028988_Question_1..jpg\" style=\"width: 280px; height: 78px;\" /><br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0028988_Question_2.jpg\" style=\"width: 280px; height: 79px;\" />", "image": null}, "options": [{"id": "RInmS", "text": "​<math><mi>III</mi><mo>&lt;</mo><mi>II</mi><mo>&lt;</mo><mi>IV</mi><mo>&lt;</mo><mi mathvariant=\"normal\">I</mi></math>", "image": null, "isCorrect": true}, {"id": "87zjD", "text": "<math><mi>II</mi><mo>&lt;</mo><mi>III</mi><mo>&lt;</mo><mi>IV</mi><mo>&lt;</mo><mi mathvariant=\"normal\">I</mi></math>", "image": null, "isCorrect": false}, {"id": "y8Wq5", "text": "<math><mi mathvariant=\"normal\">I</mi><mo>&lt;</mo><mi>IV</mi><mo>&lt;</mo><mi>III</mi><mo>&lt;</mo><mi>II</mi></math>", "image": null, "isCorrect": false}, {"id": "Bbxmf", "text": "​<math><mi mathvariant=\"normal\">I</mi><mo>&lt;</mo><mi>III</mi><mo>&lt;</mo><mi>II</mi><mo>&lt;</mo><mi>IV</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi><mo>=</mo><msup><mi mathvariant=\"normal\">I</mi><mn>2</mn></msup><mi mathvariant=\"normal\">R</mi></math><br /><br />Current is same, so <math> <mrow> <mtext>P</mtext> <mo>∝</mo> <mtext>R</mtext> </mrow> </math><br /><br />In the first case, it is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi mathvariant=\"normal\">r</mi></math>, in second case it is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>3</mn></mfrac><mi mathvariant=\"normal\">r</mi></math>, in the third case it is <math> <mrow> <mfrac> <mrow> <mtext>r</mtext> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> </mrow> </math>&nbsp;and in the fourth case the net resistance is <math> <mrow> <mfrac> <mrow> <mn>3</mn> <mtext>r</mtext> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math>.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mpadded lspace=\"+1px\"><msub><mi mathvariant=\"normal\">R</mi><mi>III</mi></msub><mo>&nbsp;</mo></mpadded><mo>&lt;</mo><mo>&nbsp;</mo><msub><mi mathvariant=\"normal\">R</mi><mi>II</mi></msub><mo>&nbsp;</mo><mo>&lt;</mo><mo>&nbsp;</mo><msub><mi mathvariant=\"normal\">R</mi><mi>IV</mi></msub><mo>&nbsp;</mo><mo>&lt;</mo><mo>&nbsp;</mo><msub><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">I</mi></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mo>&nbsp;</mo><msub><mi mathvariant=\"normal\">P</mi><mi>III</mi></msub><mo>&lt;</mo><msub><mi mathvariant=\"normal\">P</mi><mi>II</mi></msub><mo>&lt;</mo><msub><mi mathvariant=\"normal\">P</mi><mi>IV</mi></msub><mo>&lt;</mo><msub><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">I</mi></msub></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d3509707c84571da", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "21", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The resistance of each straight section <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>r</mtext><mo>=</mo><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math>.&nbsp;Find the equivalent resistance (in ohms) between <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/500797_phys.jpg\" style=\"width: 350px; height: 159px;\" />", "image": null}, "options": [], "correctValue": "7", "solution": {"text": "<u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0022022_Ans.jpg\" style=\"width: 350px; height: 65px;\" /></strong></u><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;&#160;&#160;&#160;</mo><msub><mtext>r</mtext><mtext>AB</mtext></msub><mo>=</mo><mtext>r</mtext><mo>+</mo><mtext>1.5r</mtext><mo>+</mo><mtext>r</mtext><mo>=</mo><mtext>3.5r</mtext><mo>=</mo><mn>7</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d0857351577afc86", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "15", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The resistance of the wire is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">R</mi><mn>1</mn></msub></math>.&nbsp;It is now stretched (keeping the volume constant) without breaking so that its length becomes three times.&nbsp;Now the resistance becomes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">R</mi><mn>2</mn></msub></math>, then what is the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">R</mi><mn>2</mn></msub><mo>:</mo><mo>&nbsp;</mo><msub><mi mathvariant=\"normal\">R</mi><mn>1?</mn></msub></math>", "image": null}, "options": [], "correctValue": "9", "solution": {"text": "<p>For a given wire, its resistance</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi><mo>∝</mo><mfrac><mi>l</mi><mi mathvariant=\"normal\">A</mi></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mo>&nbsp;&nbsp;</mo><msub><mi>R</mi><mn>1</mn></msub><mo>∝</mo><mfrac><msub><mi>l</mi><mn>1</mn></msub><msubsup><mi>r</mi><mn>1</mn><mn>2</mn></msubsup></mfrac></math></p><p>The wire is stretched such that&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>l</mi><mn>2</mn></msub><mo>=</mo><mn>3</mn><msub><mi>l</mi><mn>1</mn></msub></math></p><p>But density is unchanged.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo></math>Density&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mi>M</mi><mi>V</mi></mfrac><mo>=</mo><mfrac><mi>M</mi><mrow><mn>4</mn><mi>π</mi><msubsup><mi>r</mi><mn>1</mn><mn>2</mn></msubsup><msub><mi>l</mi><mn>1</mn></msub></mrow></mfrac><mo>=</mo><mfrac><mi>M</mi><mrow><mn>4</mn><mi>π</mi><msubsup><mi>r</mi><mn>2</mn><mn>2</mn></msubsup><msub><mi>l</mi><mn>2</mn></msub></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msubsup><mi mathvariant=\"normal\">r</mi><mn>2</mn><mn>2</mn></msubsup><mo>=</mo><mfrac><mrow><msub><mi>l</mi><mn>1</mn></msub><msubsup><mi mathvariant=\"normal\">r</mi><mn>1</mn><mn>2</mn></msubsup></mrow><msub><mi>l</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><msubsup><mi>r</mi><mn>1</mn><mn>2</mn></msubsup><mn>3</mn></mfrac><mo>&nbsp;&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>…</mo><mo>.</mo><mo>.</mo><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo><mo>&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mfenced><mrow><mo>∵</mo><msub><mi>l</mi><mn>2</mn></msub><mo>=</mo><mn>3</mn><msub><mi>l</mi><mn>1</mn></msub></mrow></mfenced></math></p><p>Now,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">R</mi><mn>2</mn></msub><mo>∝</mo><mfrac><msub><mi>l</mi><mn>2</mn></msub><msubsup><mi mathvariant=\"normal\">r</mi><mn>2</mn><mn>2</mn></msubsup></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mo>&nbsp;&nbsp;</mo><msub><mi mathvariant=\"normal\">R</mi><mn>2</mn></msub><mo>∝</mo><mfrac><mrow><mn>9</mn><msub><mi>l</mi><mn>1</mn></msub></mrow><msubsup><mi mathvariant=\"normal\">r</mi><mn>1</mn><mn>2</mn></msubsup></mfrac><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi>ii</mi></mfenced></math></p><p>From <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>ii</mi><mo>)</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mo>&nbsp;&nbsp;</mo><msub><mi mathvariant=\"normal\">R</mi><mn>2</mn></msub><mo>:</mo><msub><mi mathvariant=\"normal\">R</mi><mn>1</mn></msub><mo>=</mo><mn>9</mn><mo>:</mo><mn>1</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d008bdca1a39da7f", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "37", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In a Wheatstone's network,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi><mo>=</mo><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Q</mi><mo>=</mo><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi><mo>=</mo><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi><mo>=</mo><mn>3</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math>. Find the resistance (in <math> <mi mathvariant=\"normal\">Ω</mi> </math>) with which <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi></math> is to be shunted, in order that the bridge gets balanced.", "image": null}, "options": [], "correctValue": "6", "solution": {"text": "Let a resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math> be shunted with resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math>, so that the bridge is balanced.<br /><br />Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mo mathvariant=\"italic\">'</mo></math>&nbsp;be the resultant resistance of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>, then<br /><br />In balanced position<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/P-8.png\" style=\"width: 327px; height: 237px;\" /><br /><br /><math><mfrac><mrow><mi>P</mi></mrow><mrow><mi>Q</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>R</mi></mrow><mrow><msup><mrow><mi>S</mi></mrow><mrow><mi>′</mi></mrow></msup></mrow></mfrac></math><br /><br /><math><mfrac><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><msup><mrow><mi>S</mi></mrow><mrow><mi>′</mi></mrow></msup></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mi>&nbsp;</mi><msup><mi>S</mi><mi>′</mi></msup><mo>=</mo><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math><br /><br />Now,<br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mi>S</mi></mrow><mrow><mi>′</mi></mrow></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>S</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>r</mi></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>r</mi></mfrac><mo>=</mo><mfrac><mn>1</mn><msup><mi>S</mi><mi>′</mi></msup></mfrac><mo>-</mo><mfrac><mn>1</mn><mi>S</mi></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>-</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn><mo>-</mo><mn>2</mn></mrow><mn>6</mn></mfrac></math><br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mi>r</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>6</mn></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><mn>6</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863cc8674e836f5d01b", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "46", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An electric current passes through a circuit containing two wires of the same material connected in parallel. If the lengths of the wires are in the ratio&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>3</mn></mfrac></math> and radius of the wires are in the ratio&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>3</mn></mfrac></math>, then the ratio of the current passing through the wires is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>m</mi><mi>n</mi></mfrac></math>, where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math> are smallest integers. What is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>+</mo><mi>n</mi></math>?", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "<p>Given that,<br /><br /><math><mfrac><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">d</mi><mfrac><mrow><msub><mrow><mi>r</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math><br /><br />Here, <math><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub></math>and <math><msub><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msub></math>are the length of the wires while <math><msub><mrow><mi>r</mi></mrow><mrow><mn>1</mn></mrow></msub></math>and <math><msub><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msub></math> are the radii of the wires.<br /><br />Now, we know that<br /><br /><math><mi>V</mi><mo>=</mo><mi>I</mi><mi>R</mi><mo>&#10233;</mo><mi>I</mi><mi>R</mi><mo>=</mo><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">t</mi></math><br /><br /><math><mo>&#10233;</mo><msub><mrow><mi>I</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi>I</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br /><math><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#160;</mi><mfrac><mrow><msub><mrow><mi>I</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>I</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mo>&#8230;</mo><mo>.</mo><mfenced separators=\"|\"><mrow><mi>i</mi></mrow></mfenced></math><br /><br />But we know that the resistance of the wire is<br /><br /><math><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>R</mi><mo>=</mo><mfrac><mrow><mi>&#961;</mi><mi>l</mi></mrow><mrow><mi>A</mi></mrow></mfrac></math><br /><br />Hence, from Eq (i)<br /><br /><math> <mrow> <mfrac> <mrow> <msub> <mrow> <mi>I</mi><mo>&#8289;</mo> </mrow> <mn>1</mn> </msub> </mrow> <mrow> <msub> <mrow> <mi>I</mi><mo>&#8289;</mo> </mrow> <mn>2</mn> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mi>&#961;</mi> <msub> <mrow> <mi>l</mi><mo>&#8289;</mo> </mrow> <mn>2</mn> </msub> <mo>/</mo> <msub> <mrow> <mi>A</mi><mo>&#8289;</mo> </mrow> <mn>2</mn> </msub> </mrow> <mrow> <mi>&#961;</mi> <msub> <mrow> <mi>l</mi><mo>&#8289;</mo> </mrow> <mn>1</mn> </msub> <mo>/</mo> <msub> <mrow> <mi>A</mi><mo>&#8289;</mo> </mrow> <mn>1</mn> </msub> </mrow> </mfrac> </mrow> </math><br /><br />Here,<br /><br /><math><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfrac><mrow><mi>&#961;</mi><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>A</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>,</mo><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><mi>&#961;</mi><msub><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mi>a</mi><mi>n</mi><mi>d</mi><mi>&#160;</mi><msub><mrow><mi>&#961;</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi>&#961;</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mi>&#961;</mi></math><br /><br />Because both wires are of same material.<br /><br /><math><mo>&#8756;</mo><mi>&#160;</mi><mi>&#160;</mi><mfrac><mrow><msub><mrow><mi>I</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>I</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>A</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math><br /><br /><math><mo>&#10233;</mo><mfrac><mrow><msub><mrow><mi>I</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>I</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msub><mi>&#960;</mi><msubsup><mrow><mi>r</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub><mi>&#960;</mi><msubsup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow></mfrac><mi>&#160;</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#10233;</mo><mfrac><msub><mi>I</mi><mn>1</mn></msub><msub><mi>I</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><mrow><msub><mi>l</mi><mn>2</mn></msub><msubsup><mi>r</mi><mn>1</mn><mn>2</mn></msubsup></mrow><mrow><msub><mi>l</mi><mn>1</mn></msub><msubsup><mi>r</mi><mn>2</mn><mn>2</mn></msubsup></mrow></mfrac></math><br /><br />Here, <math><mfrac><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mi>&#160;</mi><mi>&#160;</mi><mi>a</mi><mi>n</mi><mi>d</mi><mfrac><mrow><msub><mrow><mi>r</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math><br /><br /><math><mo>&#10233;</mo><mi>&#160;</mi><mi>&#160;</mi><mfrac><mrow><msub><mrow><mi>I</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>I</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mo>&#215;</mo><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br />Or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>I</mi><mn>1</mn></msub><msub><mi>I</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>=</mo><mfrac><mi>m</mi><mi>n</mi></mfrac><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><mi>m</mi><mo>+</mo><mi>n</mi><mo>=</mo><mn>4</mn></math></p><p>&nbsp;</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863cb72bb63ad7ff540", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "73", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A potential difference of <math><mn>220</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">V</mi></math> is applied across a rheostat of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12000</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math>. The voltmeter <math><mi mathvariant=\"normal\">V</mi></math> has a resistance of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6000</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math> and distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BC</mi></math>&nbsp;is one-fourth of the distance from <math><mi mathvariant=\"normal\">A</mi></math> to <math><mi mathvariant=\"normal\">B</mi></math> . The error in the reading of voltmeter is approximately -<br />\r<br />\r<img alt=\"\" height=\"142\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image24-8295bfc6-f2ba-4c7c-848a-78bbcb40ca65.jpg\" style=\"max-width:\"100%\"; object-fit:contain\" width=\"293\" />", "image": null}, "options": [{"id": "4L84K", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>27</mn><mo>%</mo></math>", "image": null, "isCorrect": true}, {"id": "22Zaa", "text": "<math><mn>10</mn><mi mathvariant=\"normal\">%</mi></math>", "image": null, "isCorrect": false}, {"id": "QxaB5", "text": "<math><mn>40</mn><mi mathvariant=\"normal\">%</mi></math>", "image": null, "isCorrect": false}, {"id": "QlNky", "text": "<math><mn>15</mn><mi mathvariant=\"normal\">%</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "It total voltage across <math><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">B</mi></math> is <math><mn>220</mn></math> then voltage across <math><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">B</mi></math> should be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>220</mn><mn>4</mn></mfrac><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>55</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">V</mi></math> (voltage to be measured)<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image25-360e2eb3-6ae3-4c27-9ab8-80dfaf9a015a.jpg\" style=\"max-width:\"100%\"; object-fit:contain\" style=\"height: 159px; width: 280px;\" /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi><mi mathvariant=\"normal\">′</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>=</mo><mfrac><mrow><mn>220</mn><mo>×</mo><mn>2000</mn></mrow><mn>11000</mn></mfrac><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>40</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">V</mi></math> (voltage being measured)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">%</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi><mo>=</mo><mfrac><mrow><mi>V</mi><mo>-</mo><mi>V</mi><mi mathvariant=\"normal\">′</mi></mrow><mi>V</mi></mfrac><mo>×</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>100</mn><mo>=</mo><mfrac><mrow><mn>55</mn><mo>-</mo><mn>40</mn></mrow><mn>55</mn></mfrac><mo>×</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>100</mn><mo>=27%</mo></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c6b2b5aee02eac91", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "51", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>If the resistance of each branch of the circuit shown below is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>, then the equivalent resistance of the circuit between the points&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&nbsp;is</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013908_Ques1_1.jpg\" /></p>\r", "image": null}, "options": [{"id": "UxSMB", "text": "<math> <mrow> <mfrac> <mrow> <mtext>16</mtext> </mrow> <mrow> <mtext>24</mtext> </mrow> </mfrac> <mtext>&Omega;</mtext> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "ZE40A", "text": "<math> <mrow> <mfrac> <mrow> <mtext>22</mtext> </mrow> <mrow> <mtext>35</mtext> </mrow> </mfrac> <mtext>&Omega;</mtext> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "Sd5gN", "text": "<math><mrow>  <mfrac>    <mrow>      <mtext>12</mtext>    </mrow>    <mrow>      <mtext>30</mtext>    </mrow>  </mfrac>  <mtext>&Omega;</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "mJRaK", "text": "<math> <mrow> <mfrac> <mrow> <mtext>30</mtext> </mrow> <mrow> <mtext>12</mtext> </mrow> </mfrac> <mtext>Ω</mtext> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013908_AnsExp2_1.jpg\" style=\"width: 461px; height: 279px;\" /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013908_AnsExp_1_3.jpg\" style=\"width: 475px; height: 221px;\" /><br /><br /><math> <mrow> <mo>&rArr;</mo> <mspace width=\"0.5em\"></mspace> <msub> <mtext>R</mtext> <mtext>eq</mtext> </msub> <mo>=</mo> <mo>(</mo> <mfrac> <mrow> <mn>1</mn> <mn>1</mn> </mrow> <mrow> <mn>6</mn> </mrow> </mfrac> <mo>∥</mo> <mn>2</mn> <mo>∥</mo> <mfrac> <mrow> <mn>1</mn> <mn>1</mn> </mrow> <mrow> <mn>6</mn> </mrow> </mfrac> <mo>)</mo> <mo>=</mo> <mfrac> <mrow> <mtext>22</mtext> </mrow> <mrow> <mtext>35</mtext> </mrow> </mfrac> <mtext>&Omega;</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c5212e5222a6a44a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "03", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the given circuit, Reading of ammeter is <math><mn>1</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">A</mi></math>. If each of the <math><mn>4</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math> resistor is replaced by <math><mn>2</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math> resistor, the reading of ammeter will become nearly -<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_a ant=\"normal\">P</mi><mo>=</mo><msub><mi>Vi</mi><mn>1</mn></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msubsup><mi mathvariant=\"normal\">i</mi><mn>1</mn><mn>2</mn></msubsup><mo>&#215;</mo><mi mathvariant=\"normal\">R</mi></math><br /><br /><math><mo>=</mo><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><msqrt><mn>250</mn></msqrt></mrow><mrow><mn>10</mn></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>&#215;</mo><mn>2</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>250</mn><mn>100</mn></mfrac><mo>&#215;</mo><mn>2</mn><mo>=</mo><mfrac><mn>25</mn><mn>10</mn></mfrac><mo>&#215;</mo><mn>2</mn><mo>=</mo><mfrac><mn>25</mn><mn>5</mn></mfrac><mo>=</mo><mn>5</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b95ba4ff554f7a38", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "02", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A constant <math><mn>60</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">V</mi></math> supply is connected across the two <math><mi mathvariant=\"normal\"></mi></math>resistors as shown in diagram. Calculate the reading of the voltmeter which has a resistance of <math><mn>200</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">Ω</mi></math>&nbsp;<br />\r<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/ uestion": {"text": "Given <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>1</mn></msub><mo>=</mo><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi><mo>,</mo><mo>&nbsp;</mo><msub><mi>R</mi><mn>2</mn></msub><mo>=</mo><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi><mo>,</mo><mo>&nbsp;</mo><msub><mi>C</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">μ</mi><mi mathvariant=\"normal\">F</mi><mo>,</mo><mo>&nbsp;</mo><msub><mi>C</mi><mn>2</mn></msub><mo>=</mo><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">μ</mi><mi mathvariant=\"normal\">F</mi></math> . The time constants (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>μs</mi></math> ) for the circuits <math><mi mathvariant=\"normal\">I</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">I</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">I</mi></math> are respectively:<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/382937bb-6d0a-4f1f-be07-89e6830462d7.png\" style=\"max-width:100%; object-fit:contain\" style=\"height: 115px; width: 300px;\" />", "image": null}, "options": [{"id": "gLdId", "text": "<math><mn>18</mn><mo>,</mo><mfrac><mrow><mn>8</mn></mrow><mrow><mn>9</mn></mrow></mfrac><mo>,</mo><mi></mi><mn>4</mn></math>", "image": null, "isCorrect": false}, {"id": "Qygw6", "text": "<math><mn>18,4</mn><mo>,</mo><mfrac><mrow><mn>8</mn></mrow><mrow><mn>9</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "aXyms", "text": "<math><mn>4</mn><mo>,</mo><mfrac><mrow><mn>8</mn></mrow><mrow><mn>9</mn></mrow></mfrac><mo>,</mo><mi></mi><mn>18</mn></math>", "image": null, "isCorrect": false}, {"id": "jnHZh", "text": "<math><mfrac><mrow><mn>8</mn></mrow><mrow><mn>9</mn></mrow></mfrac><mo>,</mo><mn>18</mn><mo>,</mo><mi></mi><mn>4</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In figure I<br />Effective resistance ( parallel&nbsp;combination)<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>1</mn></msub><mo>=</mo><mfrac><mrow><mn>1</mn><mo>&#215;</mo><mn>2</mn></mrow><mrow><mn>1</mn><mo>+</mo><mn>2</mn></mrow></mfrac><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math> and effective capacitance (series combination)<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>1</mn></msub><mo>=</mo><mfrac><mrow><mn>2</mn><mo>&#215;</mo><mn>4</mn></mrow><mrow><mn>2</mn><mo>+</mo><mn>4</mn></mrow></mfrac><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">&#956;</mi><mi mathvariant=\"normal\">F</mi></math><br />Time constant<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#964;</mi><mn>1</mn></msub><mo>=</mo><msub><mi>R</mi><mn>1</mn></msub><msub><mi>C</mi><mn>1</mn></msub><mo>=</mo><mfrac><mn>8</mn><mn>9</mn></mfrac><mo>&#160;</mo><mi>&#956;s</mi></math><br />In figure II<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>2</mn></msub><mo>=</mo><mn>1</mn><mo>+</mo><mn>2</mn><mo>=</mo><mn>3</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>2</mn></msub><mo>=</mo><mn>2</mn><mo>+</mo><mn>4</mn><mo>=</mo><mn>6</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#956;</mi><mi mathvariant=\"normal\">F</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#964;</mi><mn>2</mn></msub><mo>=</mo><mn>18</mn><mo>&#160;</mo><mi>&#956;s</mi></math><br />In figure III,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>3</mn></msub><mo>=</mo><mfrac><mrow><mn>1</mn><mo>&#215;</mo><mn>2</mn></mrow><mrow><mn>1</mn><mo>+</mo><mn>2</mn></mrow></mfrac><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>3</mn></msub><mo>=</mo><mn>2</mn><mo>+</mo><mn>4</mn><mo>=</mo><mn>6</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#956;</mi><mi mathvariant=\"normal\">F</mi><mo>;</mo><mo>&#160;</mo><msub><mi>&#964;</mi><mn>3</mn></msub><mo>=</mo><mn>4</mn><mo>&#160;</mo><mi>&#956;s</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b793e9b1a9060f5a", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "90", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the electrical network shown in the figure, What will be the potential difference (in volt) across <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math> resistance?<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/pic147893625.JPG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 250px; height: 169px;\" />", "image": null}, "options": [], "correctValue": "24", "solution": {"text": "As <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math> resistances are<br /><br />In parallel, their equivalent resistance will be 2&nbsp;<math><mi mathvariant=\"normal\">&#937;</mi></math>. Here 2&nbsp;<math><mi mathvariant=\"normal\">&#937;</mi></math> and 4&nbsp;<math><mi mathvariant=\"normal\">&#937;</mi></math> are in series, their equivalent resistance will be 6&nbsp;<math><mi mathvariant=\"normal\">&#937;</mi></math>. From current distribution law<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0038150_Ans_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 305px; height: 152px;\" /><br /><br /><math><msub><mrow><mi>i</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>12</mn><mo>&#215;</mo><mn>18</mn></mrow><mrow><mn>18</mn></mrow></mfrac><mo>=</mo><mn>12&#160;</mn><mn>A</mn><mi>&#160;</mi></math><br /><br /><math><msub><mrow><mi>i</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>6</mn><mo>&#215;</mo><mn>18</mn></mrow><mrow><mn>18</mn></mrow></mfrac><mo>=</mo><mn>6&#160;</mn><mn>A</mn></math><br /><br /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0038150_Ans_2.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 284px; height: 146px;\" /><br /><br /><br /><br />Now, 12 A current is entering in the parallel combination of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math> and <math><mn>6&#160;</mn><mi mathvariant=\"normal\">&#937;</mi></math> again from current distribution law<br /><br /><math><msubsup><mrow><mi>i</mi></mrow><mrow><mn>1</mn></mrow><mrow><mi>&#8242;</mi><mi>&#8242;</mi></mrow></msubsup><mo>=</mo><mfrac><mrow><mn>6</mn><mo>&#215;</mo><mn>12</mn></mrow><mrow><mn>9</mn></mrow></mfrac><mo>=</mo><mn>8&#160;</mn><mn>A</mn><mi>&#160;</mi></math><br /><br /><math><msubsup><mrow><mi>i</mi></mrow><mrow><mn>2</mn></mrow><mrow><mi>&#8242;</mi><mi>&#8242;</mi></mrow></msubsup><mo>=</mo><mfrac><mrow><mn>3</mn><mo>&#215;</mo><mn>12</mn></mrow><mrow><mn>9</mn></mrow></mfrac><mo>=</mo><mn>4&#160;</mn><mn>A</mn><mo>.</mo></math><br /><br />&there4; The potential difference across <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math> resistance<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>8</mn><mo>&#215;</mo><mn>3</mn><mo>=</mo><mn>24</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b2b3a45a40fbf825", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "34", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A coil takes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn></math>&nbsp;minutes to boil a certain amount of water. Another coil takes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn></math>&nbsp;minutes for the same process. Time taken to boil the same amount of water when both coils are connected in series is", "image": null}, "options": [{"id": "pbGMx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math> minutes", "image": null, "isCorrect": false}, {"id": "XRjB8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8.6</mn></math> minutes", "image": null, "isCorrect": false}, {"id": "u0Zo7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>35</mn></math> minutes", "image": null, "isCorrect": true}, {"id": "LHbof", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn></math> minutes", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From Joule&#39;s law,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mi mathvariant=\"normal\">H</mi><mo>=</mo><mfrac><mrow><msup><mi mathvariant=\"normal\">V</mi><mn>2</mn></msup><mi mathvariant=\"normal\">t</mi></mrow><mi>RJ</mi></mfrac><mi mathvariant=\"normal\">&#160;</mi><mi>cal</mi></math><br /><br />Where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">V</mi></math> is potential difference, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">t</mi></math>&nbsp;is the time and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math>&nbsp;is the resistance.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mi mathvariant=\"normal\">R</mi><mo>=</mo><msub><mi mathvariant=\"normal\">R</mi><mn>1</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">R</mi><mn>2</mn></msub></math><br /><br />Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">R</mi></mfrac><mo>=</mo><mfrac><mi>HJ</mi><msup><mi mathvariant=\"normal\">V</mi><mn>2</mn></msup></mfrac><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mi>constant</mi><mo>=</mo><mi mathvariant=\"normal\">k</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi mathvariant=\"normal\">R</mi><mn>1</mn></msub><mo>=</mo><msub><mi>kt</mi><mn>1</mn></msub><mi mathvariant=\"normal\">&#160;</mi><mi>and</mi><mi mathvariant=\"normal\">&#160;</mi><msub><mi mathvariant=\"normal\">R</mi><mn>2</mn></msub><mo>=</mo><msub><mi>kt</mi><mn>2</mn></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi mathvariant=\"normal\">&#160;</mi><mi>kt</mi><mo>=</mo><msub><mi>kt</mi><mn>1</mn></msub><mo>+</mo><msub><mi>kt</mi><mn>2</mn></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">t</mi><mo>=</mo><mn>15</mn><mo>+</mo><mn>20</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">t</mi><mo>=</mo><mn>35</mn></math>&nbsp;minutes", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863aebc649ea59103ae", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "80", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A metal wire of resistance <math><mn>3</mn><mtext> </mtext><mi mathvariant=\"normal\">Ω</mi></math> is elongated to make a uniform wire of double its previous length. This new wire is now bent and the ends joined to make a circle. If two points on this circle make an angle <math><msup><mrow><mn>60</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math> at the center, the equivalent resistance between these two points will be:", "image": null}, "options": [{"id": "xgRA3", "text": "<math><mfrac><mrow><mn>5</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mtext> </mtext><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": true}, {"id": "9h0KV", "text": "<math><mfrac><mrow><mn>12</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mtext> </mtext><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": false}, {"id": "QK4lt", "text": "<math><mfrac><mrow><mn>7</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mtext> </mtext><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": false}, {"id": "r9hTz", "text": "<math><mfrac><mrow><mn>5</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mtext> </mtext><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We know, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mfrac><mrow><mn>8</mn><mi>l</mi></mrow><mi>A</mi></mfrac><mo>=</mo><mfrac><mrow><mn>8</mn><msup><mi>l</mi><mn>2</mn></msup></mrow><mrow><mi>A</mi><mi>l</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>8</mn><msup><mi>l</mi><mn>2</mn></msup></mrow><mrow><mi mathvariant=\"normal\">V</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>&#8733;</mo><msup><mi>l</mi><mn>2</mn></msup></math> if the volume is constant.<br /><math><mo>&#8756;</mo><mi mathvariant=\"normal\">&#160;</mi></math> New resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>4</mn><mi>R</mi><mo>.</mo></math><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ca003bce-30b1-46ce-8688-da31073a4bfd-image8.png\" style=\"max-width:100%; object-fit:contain\" /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>1</mn></msub><mo>=</mo><mfrac><mrow><mn>4</mn><mi>R</mi></mrow><mn>360</mn></mfrac><mo>&#215;</mo><mn>300</mn><mo>=</mo><mfrac><mrow><mn>10</mn><mi>R</mi></mrow><mn>3</mn></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>2</mn></msub><mo>=</mo><mfrac><mrow><mn>4</mn><mi>R</mi></mrow><mn>360</mn></mfrac><mo>&#215;</mo><mn>60</mn><mo>=</mo><mfrac><mrow><mn>2</mn><mi>R</mi></mrow><mn>3</mn></mfrac></math><br /><math><mo>&#8756;</mo></math> Equivalent resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mrow><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">q</mi></mrow></msub><mo>=</mo><mfrac><mrow><msub><mi>R</mi><mn>1</mn></msub><msub><mi>R</mi><mn>2</mn></msub></mrow><mrow><msub><mi>R</mi><mn>1</mn></msub><mo>+</mo><msub><mi>R</mi><mn>2</mn></msub></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mfrac><mrow><mn>10</mn><mi>R</mi></mrow><mn>3</mn></mfrac><mo>&#215;</mo><mfrac><mrow><mn>2</mn><mi>R</mi></mrow><mn>3</mn></mfrac></mrow><mrow><mfrac><mrow><mn>10</mn><mi>R</mi></mrow><mn>3</mn></mfrac><mo>+</mo><mfrac><mrow><mn>2</mn><mi>R</mi></mrow><mn>3</mn></mfrac></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>5</mn><mi>R</mi></mrow><mn>9</mn></mfrac></math><br /><math><mo>=</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a607b501bb2a8830", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "52", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>In the circuit shown in the figure (A), <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>3</mn></msub></math> is a variable resistance. As the value <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>3</mn></msub></math> is changed, the current <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi></math> through the cell varies as shown in the figure (B). As <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>3</mn></msub><mo>→</mo><mi mathvariant=\"normal\">∞</mi></math>, the current&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>→</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>6</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math>.&nbsp;What is the value of the sum of the resistances <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>2</mn></msub></math>&nbsp;in ohms?</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image13-ffe5fce5-9a5d-4187-8c6e-b13b67a5b75b.jpg\" style=\"width: 300px; height: 194px;\" /></p>\r", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "<p>For <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>3</mn></msub><mo>=</mo><mn>0</mn><mo>,</mo><mi>I</mi><mo>=</mo><mn>9</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math> (from the graph).In this situation, the circuit can be drawn as shown in figure <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">A</mi></mrow></mfenced></math> .<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image14-5aa0c129-fced-4188-834c-15919b2db198.jpg\" /><br /><br />[current through R<sub>2&nbsp;</sub>will be zero because we have a short circuit <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>R</mi><mn>3</mn></msub><mo>=</mo><mn>0</mn></mrow></mfenced></math>&nbsp;across <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>2</mn></msub></math>]<br /><br />Here <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mfrac><mn>36</mn><mrow><msub><mi>R</mi><mn>1</mn></msub><mo>+</mo><msub><mi>R</mi><mn>2</mn></msub></mrow></mfrac><mo>=</mo><mn>9</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>1</mn></msub><mo>+</mo><msub><mi>R</mi><mn>2</mn></msub><mo>=</mo><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math>&nbsp;</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a54b2867e7bee13e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "05", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Twelve resistors each of resistance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math>&nbsp;are connected as shown in the figure. Net resistance between points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>H</mi></math> would be<br />\r<br />\r<br />\r&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0028962_qUESTION.jpg\" style=\"width: 211px; height: 207px;\" />", "image": null}, "options": [{"id": "lBpHF", "text": "<math><mfrac><mrow><mn>5</mn></mrow><mrow><mn>6</mn></mrow></mfrac><mi>&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": false}, {"id": "crfPu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi></math>", "image": null, "isCorrect": false}, {"id": "2Ruje", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>4</mn></mfrac><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi></math>", "image": null, "isCorrect": true}, {"id": "R5OnH", "text": "<math ><mfrac><mrow><mn>7</mn></mrow><mrow><mn>12</mn></mrow></mfrac><mi> </mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let current i enters from point A and leaves at H. Then current can be distributed as follows :<br /><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0028962_ANS_1.jpg\" style=\"width: 280px; height: 217px;\" /><br /><br /><br />from the above diagram we can see that no current will flow in wires CE and FD. So, the simple circuit is as follows:<br /><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0028962_ANS_2.jpg\" style=\"width: 351px; height: 175px;\" /><br /><br /><br /><math> <mrow> <mo>∴&nbsp;&nbsp;&nbsp;</mo> <msub> <mtext>R</mtext> <mtext>AH</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> <mi>Ω</mi> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a40e207ccf0636bb", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "04", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>In the circuit shown in the figure, the reading of the voltmeter is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>1</mn></msub></math>&nbsp;when only <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>S</mi><mn>1</mn></msub></math> is closed,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>2</mn></msub></math> when only <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>S</mi><mn>2</mn></msub></math> is closed and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>3</mn></msub></math> when both <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>S</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>S</mi><mn>2</mn></msub></math> are closed. From this we can conclude that</p>\r\r<p>&nbsp;<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image73-12b00436-9b2b-4889-a68a-58008bb40bb2.jpg\" style=\"width: 275px; height: 157px;\" /></p>\r", "image": null}, "options": [{"id": "qM11i", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>3</mn></msub><mo>&#62;</mo><msub><mi>V</mi><mn>2</mn></msub><mo>&#62;</mo><msub><mi>V</mi><mn>1</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "TQ9MO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>2</mn></msub><mo>&#62;</mo><msub><mi>V</mi><mn>1</mn></msub><mo>&#62;</mo><msub><mi>V</mi><mn>3</mn></msub></math>", "image": null, "isCorrect": true}, {"id": "xzRrN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>3</mn></msub><mo>&#62;</mo><msub><mi>V</mi><mn>1</mn></msub><mo>&#62;</mo><msub><mi>V</mi><mn>2</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "EoSxN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>1</mn></msub><mo>&#62;</mo><msub><mi>V</mi><mn>2</mn></msub><mo>&#62;</mo><msub><mi>V</mi><mn>3</mn></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In series <math><mi mathvariant=\"normal\">V</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>∝</mo><mi mathvariant=\"normal\">R</mi></math><br /><br />When S<sub>1</sub> is closed and S<sub>2</sub> is open<br /><br /><math><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>3</mn><mi>E</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math><br /><br />When S<sub>1</sub> is open and S<sub>2</sub> is closed<br /><br /><math><msub><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>6</mn><mi>E</mi></mrow><mrow><mn>7</mn></mrow></mfrac></math><br /><br />When S<sub>1</sub> and S<sub>2</sub> both are closed<br /><br /><math><msub><mrow><mi>V</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>2</mn><mi>E</mi></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86393176ef0763e97a3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "28", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Find the equivalent resistance about any branch of the base of the square pyramid shown. Assume resistance of each branch is <math><mi mathvariant=\"normal\">R</mi></math>.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image82-a875d7cf-9708-4747-b053-2a2449029751.jpg\" style=\"height: 180px; width: 140px;\" />", "image": null}, "options": [{"id": "DrQbL", "text": "<math><mfrac><mrow><mn>7</mn><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>15</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "3Qnu9", "text": "<math><mfrac><mrow><mn>8</mn><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>15</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "dfnzD", "text": "<math><mfrac><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "kNkVm", "text": "none of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Looking at the circuit from above, we can see that between any two adjacent points (let say A and B), the circuit is symmetric so the junction P can be disconnected.<br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image83-6284965e-3946-425c-8f66-28a0b2a189e4.jpg\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639063dd12f4a398e7", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "31", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the circuit shown, the current flowing from the battery is<br />\r<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image20-1509ba18-3ff0-4dcd-86c2-b6027cd543a4.jpg\" />", "image": null}, "options": [{"id": "RZSuY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>11</mn><mn>50</mn></mfrac><mo>&#xA0;</mo><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}, {"id": "wnkqS", "text": "<math><mn>10</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": true}, {"id": "CpVqa", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>3</mn></mfrac><mo>&#xA0;</mo><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}, {"id": "fHkZ2", "text": "Infinite current", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image21-83092a9c-6a21-4a4d-adf4-bb34f68044d0.jpg\" /><br /><br />By observing the reduced/equivalent circuit diagram, we can say that,<br /><math><mi mathvariant=\"normal\">i</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mi mathvariant=\"normal\">R</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>20</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mn>10&nbsp;</mn><mi mathvariant=\"normal\">A</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86388440327fc6c744e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "70", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An ammeter, voltmeter and a resistor are connected in series to a cell and the readings are noted as <math><mi>I</mi></math> and <math><mi>V</mi></math>. If another resistor <math><mi>R</mi></math> is connected in parallel with a voltmeter, then", "image": null}, "options": [{"id": "amtiV", "text": "<math><mi>I</mi></math>  and  <math><mi>V</mi></math>  increase", "image": null, "isCorrect": false}, {"id": "aqbZI", "text": "<math><mi>I</mi></math> increases", "image": null, "isCorrect": true}, {"id": "8lXDa", "text": "<math><mi>I</mi></math>  and  <math><mi>V</mi></math>  will remain same", "image": null, "isCorrect": false}, {"id": "da5vs", "text": "<math><mi>I</mi></math>  decreases", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When the resistor <math><mi>R</mi></math> is connected in parallel with voltmeter, the effective resistance in the circuit decreases because <math><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mi>R</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></mrow>
