se}, {"id": "i76YC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>105</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi></math>", "image": null, "isCorrect": false}, {"id": "bFIH1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>115</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/nnn-123.JPG\" style=\"width: 300px; height: 294px;\" /><br /><br />Potential gradient of potentiometer<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>2.5</mn><mrow><mo>(</mo><mn>3</mn><mo>+</mo><mi>R</mi><mo>+</mo><mn>32</mn><mo>)</mo></mrow></mfrac><mo>×</mo><mfrac><mn>30</mn><mn>10</mn></mfrac></math><br />Balancing length for cell of emf <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>e</mi><mo>=</mo><mn>0.4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>&nbsp;</mo><mi>cm</mi></math>.<br /><math><mo>∴</mo><mfrac><mrow><mn>2.5</mn></mrow><mrow><mo>(</mo><mn>35</mn><mo>+</mo><mi>R</mi><mo>)</mo></mrow></mfrac><mo>×</mo><mn>3</mn><mo>×</mo><mn>8</mn><mo>=</mo><mn>0.4</mn></math><br /><math><mo>⇒</mo><mn>5</mn><mo>×</mo><mn>3</mn><mo>×</mo><mn>4</mn><mo>=</mo><mfrac><mrow><mn>0.04</mn><mo>×</mo><mo>(</mo><mn>35</mn><mo>+</mo><mi>R</mi><mo>)</mo></mrow><mrow><mn>10</mn></mrow></mfrac></math><br /><math><mo>⇒</mo><mn>15</mn><mo>×</mo><mn>10</mn><mo>=</mo><mn>35</mn><mo>+</mo><mi>R</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>R</mi><mo>=</mo><mn>115</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637974e0ef778d07a3", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "60", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "For what value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>, (in ohm) the current in galvanometer is zero?<br />\r<br />\r<img alt=\"\" height=\"112\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image40-2b45eae2-882f-4f18-82e2-dcb951254621.jpg\" width=\"249\" />", "image": null}, "options": [], "correctValue": "1", "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/75203_1.jpg\" style=\"width: 255px; height: 121px;\" /><br /><br /><math><mi mathvariant=\"normal\">i</mi><mo>=</mo><mfrac><mrow><mn>12</mn></mrow><mrow><mi mathvariant=\"normal\">R</mi><mo>+</mo><mn>5</mn></mrow></mfrac></math><br /><br />Potential difference across <math><mi mathvariant=\"normal\">R</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">V</mi><mo>=</mo><mfrac><mrow><mn>12</mn></mrow><mrow><mi mathvariant=\"normal\">R</mi><mo>+</mo><mn>5</mn></mrow></mfrac><mo>×</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">R</mi></math><br /><br /><math><mo>∴</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>2</mn><mo>=</mo><mfrac><mrow><mn>12</mn></mrow><mrow><mi mathvariant=\"normal\">R</mi><mo>+</mo><mn>5</mn></mrow></mfrac><mo>×</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">R</mi></math><br /><br /><math><mo>⇒</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">R</mi><mo>+</mo><mn>5</mn><mo>=</mo><mn>6</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">R</mi></math><br /><br /><math><mo>⇒</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">R</mi><mo>=</mo><mn>1</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86370f423423efe7f4d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "25", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In a potentiometer experiment, the balancing length obtained with a cell is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>240</mn><mo>&nbsp;</mo><mi>cm</mi></math>. On shunting the cell with a resistance of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math>, the balancing length becomes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>120</mn><mo>&nbsp;</mo><mi>cm</mi></math>. The internal resistance of the cell is", "image": null}, "options": [{"id": "GJ03X", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi></math>", "image": null, "isCorrect": false}, {"id": "wkMKO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi></math>", "image": null, "isCorrect": false}, {"id": "4YlOW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0.5</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi></math>", "image": null, "isCorrect": false}, {"id": "vHefb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>In the first case, the emf of the battery is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">E</mi><mo>=</mo><msub><mtext>Kl</mtext><mn>1</mn></msub></math>, where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">K</mi></math>&nbsp;is the potential gradient and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">l</mi><mn>1</mn></msub></math>&nbsp;is the first balancing length.</p><p>In the second case the potential difference across the battery is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mtext>ER</mtext><mrow><mtext>r</mtext><mo>+</mo><mtext>R</mtext></mrow></mfrac><mo>=</mo><msub><mtext>Kl</mtext><mn>2</mn></msub></math>,&nbsp;where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math>&nbsp;is the shunt resistance used.</p><p>Dividing the above two equations, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>r</mi><mi>R</mi></mfrac><mo>+</mo><mpadded lspace=\"+1px\"><mn>1</mn></mpadded><mo>=</mo><mfrac><msub><mi>l</mi><mn>1</mn></msub><msub><mi>l</mi><mn>2</mn></msub></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>&#8658;r</mtext><mo>=</mo><mn>2</mn><mfenced open=\"[\" close=\"]\"><mfrac><mrow><mn>240</mn><mo>-</mo><mn>120</mn></mrow><mn>120</mn></mfrac></mfenced><mo>=</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637024ea7e9365f470", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "57", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A galvanometer of resistance <math><mn>50</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math> is converted into an ammeter by connecting a low resistance (shunt) of value <math><mn>1</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math> in parallel to the galvanometer,&nbsp;<math><mi mathvariant=\"normal\">S</mi></math>. If full-scale deflection current of the galvanometer is <math><mn>10</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">A</mi></math>, then the maximum current that can be measured by the ammeter is -", "image": null}, "options": [{"id": "tQoUp", "text": "<math><mn>500</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}, {"id": "sEad7", "text": "<math><mn>510</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": true}, {"id": "UVywB", "text": "<math><mn>610</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}, {"id": "CIdcq", "text": "<math><mn>490</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mo>=</mo><mi>G</mi><mfrac><msub><mi>I</mi><mi mathvariant=\"normal\">g</mi></msub><mrow><mi>I</mi><mo>–</mo><msub><mi>I</mi><mi mathvariant=\"normal\">g</mi></msub></mrow></mfrac></math><br /><br />Shunt and Galvnometer are in parallel combination<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/MUKESH_DIAGRAM_1.jpg\" style=\"width: 250px; height: 123px;\" /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">1</mi><mo>=</mo><mn>50</mn><mo>×</mo><mfrac><mn>10</mn><mrow><mi>I</mi><mo>–</mo><mn>10</mn></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>-</mo><mn>1</mn><mn>0</mn><mo>=</mo><mn>500</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mn>510</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">A</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636fffce9e5a14dd51", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "75", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The reading of the ideal ammeter will be (Resistance of ideal ammeters is zero)<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image94-5fc9e791-828b-4289-bcb2-113d83792339.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"height: 103px; width: 250px;\" />", "image": null}, "options": [{"id": "l115W", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>6</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": true}, {"id": "pQSXk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>6</mn><mn>5</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}, {"id": "z47eH", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>2</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}, {"id": "aJBm7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>3</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mrow><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">q</mi></mrow></msub><mo>=</mo><mn>3</mn><mo>&#8741;</mo><mn>6</mn><mo>+</mo><mn>2</mn><mo>=</mo><mn>2</mn><mo>+</mo><mn>2</mn><mo>=</mo><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math></p><p>Current from Battery,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mfrac><mi>V</mi><msub><mi>R</mi><mrow><mi>e</mi><mi>q</mi></mrow></msub></mfrac><mo>=</mo><mfrac><mn>10</mn><mn>4</mn></mfrac><mo>=</mo><mn>2</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image95-3e6c70c7-0a9e-4865-8a85-560e955ec509.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"height: 95px; width: 250px;\" /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>I</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><mfrac><mn>3</mn><mrow><mn>3</mn><mo>+</mo><mn>6</mn></mrow></mfrac><mo>=</mo><mfrac><mn>5</mn><mn>6</mn></mfrac><mi>&#160;</mi><mi mathvariant=\"normal\">A</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86362c7d76c0f4be872", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "46", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A voltmeter with a resistance <math><mn>50</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>3&nbsp;</mn></mrow></msup><mi mathvariant=\"normal\">Ω</mi></math> is used to measure voltage in a circuit. To increase its range to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math> times, the additional resistance to be put in series is", "image": null}, "options": [{"id": "C6Fid", "text": "<math><mn>9</mn><mi> </mi><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>6</mn></mrow></msup><mi> </mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": false}, {"id": "Hab5d", "text": "<math><msup><mrow><mn>10</mn></mrow><mrow><mn>5</mn></mrow></msup><mi> </mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": true}, {"id": "PGEtm", "text": "<math><mn>1.5</mn><mi> </mi><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>5</mn></mrow></msup><mi> </mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": false}, {"id": "CJCQC", "text": "<math><mn>9</mn><mi> </mi><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>5</mn></mrow></msup><mi> </mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi>V</mi><mo>=</mo><msub><mrow><mi>i</mi></mrow><mrow><mi mathvariant=\"normal\">g</mi></mrow></msub><mi>R</mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">d</mi><mi> </mi><mi> </mi><msup><mrow><mi>V</mi></mrow><mrow><mi>&prime;</mi></mrow></msup><mo>=</mo><msub><mrow><mi>i</mi></mrow><mrow><mi mathvariant=\"normal\">g</mi></mrow></msub><msup><mrow><mi>R</mi></mrow><mrow><mi>&prime;</mi></mrow></msup><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi><mi> </mi><mfrac><mrow><msup><mrow><mi>R</mi></mrow><mrow><mi>&prime;</mi></mrow></msup></mrow><mrow><mi>R</m l}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
