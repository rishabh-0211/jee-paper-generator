</mfenced></math><br /><br />Therefore current, <math><mi>I</mi><mo>=</mo><mfrac><mrow><mi>V</mi></mrow><mrow><mi>R</mi></mrow></mfrac></math> increases.<br/><br/>As <math><mi>I</mi></math> increases, potential across <math><mi>R</mi></math> increases and hence potential across voltmeter decreases. Hence reading of voltmeter decreases.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863806b73f724caf287", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "06", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>The maximum and the minimum equivalent resistance&nbsp;obtained by combining&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>&nbsp;identical resistors of resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>, are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mi>max</mi></msub></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mi>min</mi></msub></math>&nbsp;respectively. The ratio&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>R</mi><mi>max</mi></msub><msub><mi>R</mi><mi>min</mi></msub></mfrac></math>&nbsp;is equal to</p>\r", "image": null}, "options": [{"id": "EtrvV", "text": "<math><mi mathvariant=\"normal\">n</mi></math>", "image": null, "isCorrect": false}, {"id": "xfpDw", "text": "<math><msup><mrow><mi mathvariant=\"normal\">n</mi></mrow><mrow><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "JuTxe", "text": "<math><msup><mrow><mi mathvariant=\"normal\">n</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "GdWYC", "text": "<math><msup><mrow><mi mathvariant=\"normal\">n</mi></mrow><mrow><mn>3</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "To get maximum equivalent resistance all resistance must be connected in series<br /><math><mo>&#8756;</mo><msub><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">q</mi></mrow></msub></mrow></mfenced></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">x</mi></mrow></msub><mo>=</mo><mi mathvariant=\"normal\">R</mi><mo>+</mo><mi mathvariant=\"normal\">R</mi><mo>+</mo><mi mathvariant=\"normal\">R</mi><mo>+</mo><mo>&#8230;</mo><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">R</mi><mo>.</mo><mo>=</mo><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">R</mi></math><br />To get minimum equivalent resistance all resistances must be connected in parallel.<br /><math><mo>&#8756;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">q</mi></mrow></msub></mrow></mfenced></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">R</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">R</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">R</mi></mrow></mfrac><mo>+</mo><mo>&#8230;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">n</mi></mrow></mfrac><mo>,</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">q</mi></mrow></msub></mrow></mfenced></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">&#160;</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">n</mi></mrow><mrow><mi mathvariant=\"normal\">R</mi></mrow></mfrac></math><br /><math><mo>&#8658;</mo><msub><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">q</mi></mrow></msub></mrow></mfenced></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mi mathvariant=\"normal\">n</mi></mrow></mfrac><mo>&#8756;</mo><mfrac><mrow><msub><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">q</mi></mrow></msub></mrow></mfenced></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">x</mi></mrow></msub></mrow><mrow><msub><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">q</mi></mrow></msub></mrow></mfenced></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">R</mi></mrow><mrow><mi mathvariant=\"normal\">R</mi><mo>/</mo><mi mathvariant=\"normal\">n</mi></mrow></mfrac><mo>=</mo><msup><mrow><mi mathvariant=\"normal\">n</mi></mrow><mrow><mn>2</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637bd56d6fa973c323", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "11", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two circular rings of identical radii and resistance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>36</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math>&nbsp;are placed as shown in the figure. Conducting joints are made at points&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>&nbsp;and&nbsp;a cell of emf&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>&nbsp;is connected between these two points. What is the power (in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">W</mi></math>) delivered by the cell? [<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>1</mn></msub></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>2</mn></msub></math>&nbsp;are the centres of the two rings]<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Circlesimahesj.PNG\" style=\"width: 197px; height: 159px;\" />", "image": null}, "options": [], "correctValue": "100", "solution": {"text": "<p>From the figure.<br />&nbsp; &nbsp; &nbsp; &nbsp; AC<sub>1</sub> = AC<sub>2</sub> = C<sub>1</sub> C<sub>2</sub> = radius<br /><math> <mrow> <mo>∴</mo> </mrow> </math> &nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>∠</mo> <msub> <mtext>AC</mtext> <mn>1</mn> </msub> <mtext>B</mtext> <mo>=</mo> <mn>1</mn> <mn>2</mn> <msup> <mn>0</mn> <mn>0</mn> </msup> </mrow> </math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/6516510465.JPG\" style=\"width: 250px; height: 186px;\" /></p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/253232.jpg\" style=\"height: 217px; width: 150px;\" /></p><p>In between A and B, 4 resistances are in parallel&nbsp;</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Graphic0101000.JPG\" style=\"width: 402px; height: 185px;\" /><br /><br />Hence the resistance of four sections are in parallel<br />Hence equivalent resistance R across AB is<br /><math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mn>4</mn> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>1</mn> <mn>2</mn> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>1</mn> <mn>2</mn> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mn>4</mn> </mrow> </mfrac> </mrow> </math><br />or&nbsp;&nbsp;&nbsp; <math> <mrow> <mtext>R</mtext> <mo>=</mo> <mn>4</mn> <mi>Ω</mi> </mrow> </math><br /><math> <mrow> <mo>∴</mo>&nbsp; </mrow> </math> Power&nbsp;<math> <mrow> <mfrac> <mrow> <msup> <mtext>V</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>2</mn> <mn>0</mn> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> <mo>=</mo> <mn>1</mn> <mn>0</mn> <mn>0</mn> <mtext>&nbsp;watt</mtext> </mrow> </math><br /><br />&nbsp;</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86375bcec9914805b45", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "16", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the given circuit all resistors are identical. Their resistance is equal to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>. Find the equivalent resistance between <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&nbsp;(in <math><mi mathvariant=\"normal\">&#937;</mi></math>).<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/vxozlrfcsurbxqmtnuunwvwrfqaodlxkpouffemzyixdljohcz.jpeg\" />", "image": null}, "options": [], "correctValue": "09.00", "solution": {"text": "<p>Equivalent circuit is shown below:-</p><p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/dsinnwxwupmswzvcbqdzlpfmnvdtdrbdwodqqgridfrkutclll.jpeg\" /><br />Therefore, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mrow><mi>e</mi><mo>&#8289;</mo><mi>q</mi></mrow></msub><mo>&#8289;</mo><mo>=</mo><mfrac><mi>r</mi><mn>5</mn></mfrac><mo>+</mo><mfrac><mi>r</mi><mn>4</mn></mfrac><mo>=</mo><mfrac><mrow><mn>9</mn><mi>r</mi></mrow><mn>20</mn></mfrac><mo>=</mo><mn>9</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863747285b34b1278d7", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "25", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The resistance of the series combination of two resistors is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi></math>. When they are joined in parallel the equivalent resistance becomes&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math>. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi><mo>=</mo><mi>nP</mi></math>, then the minimum possible value of <em><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">n</mi></math></em> is", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "In series combination,&nbsp;&nbsp;&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi><mo>=</mo><mfenced><mrow><msub><mi mathvariant=\"normal\">R</mi><mn>1</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">R</mi><mn>2</mn></msub></mrow></mfenced></math><br /><br />In parallel combination,&nbsp; <math> <mrow> <mtext>P</mtext> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>R</mtext> <mn>1</mn> </msub> <msub> <mtext>R</mtext> <mn>2</mn> </msub> </mrow> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>R</mtext> <mn>1</mn> </msub> <mo>+</mo> <msub> <mtext>R</mtext> <mn>2</mn> </msub> </mrow> </mfenced> </mrow> </mfrac> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8757;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">S</mi><mo>=</mo><mi>nP</mi></math><br /><br /><math> <mrow> <mo>&#8756;</mo> </mrow> </math> &nbsp; <math> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>R</mtext> <mn>1</mn> </msub> <mo>+</mo> <msub> <mtext>R</mtext> <mn>2</mn> </msub> </mrow> </mfenced>&#160; &#160; <mo>=</mo> <mtext>n</mtext> <mfrac> <mrow> <msub> <mtext>R</mtext> <mn>1</mn> </msub> <msub> <mtext>R</mtext> <mn>2</mn> </msub> </mrow> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>R</mtext> <mn>1</mn> </msub> <mo>+</mo> <msub> <mtext>R</mtext> <mn>2</mn> </msub> </mrow> </mfenced> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>&#8756;</mo> </mrow> </math> &nbsp;&nbsp;<math> <mrow> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>R</mtext> <mn>1</mn> </msub> <mo>+</mo> <msub> <mtext>R</mtext> <mn>2</mn> </msub> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> <mo>=</mo> <mtext>n</mtext> <msub> <mtext>R</mtext> <mn>1</mn> </msub> <msub> <mtext>R</mtext> <mn>2</mn> </msub> </mrow> </math><br /><br />For minimum value, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">R</mi><mn>1</mn></msub><mo>=</mo><msub><mi mathvariant=\"normal\">R</mi><mn>2</mn></msub><mo>=</mo><mi mathvariant=\"normal\">R</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mtext>R</mtext><mo>+</mo><mtext>R</mtext></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mtext>n</mtext><mfenced><mrow><mtext>R</mtext><mo>&#215;</mo><mtext>R</mtext></mrow></mfenced><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mn>4</mn><msup><mtext>R</mtext><mn>2</mn></msup><mo>=</mo><msup><mtext>nR</mtext><mn>2</mn></msup><mspace linebreak=\"newline\"/><mtext>&#8658;</mtext><mi mathvariant=\"normal\">n</mi><mo>=</mo><mn>4</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86371270fbf2aae810e", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "67", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the circuit shown, the resistance of each resistor is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>100</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math>. Find the resistance in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Ω</mi></math> to the nearest integer, which is to be connected between points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">D</mi></math> so that the resistance of entire circuit between <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> does not depend on the number of elementary cells.<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ca5ec107-dac4-40ce-bc70-d88ea624952c-image30.png\" style=\"height: 106px; width: 400px;\" />", "image": null}, "options": [], "correctValue": "73", "solution": {"text": "Let resistance added across <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CD</mi></math> is <math><mi>x</mi></math>, then the equivalent resistance between&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> will be independent of the number of elementary cells if the combination of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math> with the resistors of the elementary cells is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math> itself. So <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mi>AB</mi></msub><mo>=</mo><mi>x</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>&#160;</mi><mi>x</mi><mo>=</mo><mfrac><mrow><mfenced separators=\"|\"><mrow><mn>2</mn><mi>R</mi><mo>+</mo><mi>x</mi></mrow></mfenced><mo>&#215;</mo><mi>R</mi></mrow><mfenced separators=\"|\"><mrow><mn>3</mn><mi>R</mi><mo>+</mo><mi>x</mi></mrow></mfenced></mfrac></math><br /><math><mo>&#8658;</mo><mi>&#160;</mi><mi>x</mi><mo>=</mo><mfenced separators=\"|\"><mrow><msqrt><mn>3</mn></msqrt><mo>-</mo><mn>1</mn></mrow></mfenced><mo>&#215;</mo><mi>R</mi></math><br /><math><mo>=</mo><mfenced separators=\"|\"><mrow><mn>1.73</mn><mo>-</mo><mn>1</mn></mrow></mfenced><mo>&#215;</mo><mn>100</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>73</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636eaf890706eae47a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "78", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>In the circuit shown,&nbsp;each resistor is of resistance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>.&nbsp;The equivalent resistance between terminals <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&nbsp;is :</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ee01703d-bd09-4f37-a151-67d28c82a91f-35.JPG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 280px; height: 89px;\" /></p>\r", "image": null}, "options": [{"id": "IUxp4", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>R</mi></math>", "image": null, "isCorrect": false}, {"id": "RevA4", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>3</mn><mo>&#160;</mo><mi>R</mi></math>", "image": null, "isCorrect": false}, {"id": "zHxVi", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>5</mn><mi>R</mi></math>", "image": null, "isCorrect": true}, {"id": "paSTG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>&#160;</mo><mi>R</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/0f512403-e87f-4a2d-ae30-12d621c24120-32.JPG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 229px; height: 97px;\" /></p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/33e5d887-5746-484b-9041-ca5f77e0a408-33.JPG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 202px; height: 133px;\" /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/b0616086-4f5e-4df2-9930-3559af3a9e82-34.JPG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 199px; height: 121px;\" /></p><p>[balanced wheat-stone bridge] then equivalent resistance, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>3</mn><mi>R</mi></mrow><mn>2</mn></mfrac><mo>=</mo><mn>1</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi>R</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86362a92281d5526f42", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "05", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Given <math><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>5.0</mn><mo>±</mo><mn>0.2</mn><mi mathvariant=\"normal\">Ω</mi><mo>,</mo><mi mathvariant=\"normal\">&nbsp;</mi><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>10.0</mn><mo>±</mo><mn>0.1</mn><mi mathvariant=\"normal\">Ω</mi><mo>.</mo><mi mathvariant=\"normal\">&nbsp;</mi></math>What is total resistance in parallel with possible percentage error?", "image": null}, "options": [{"id": "dcUeC", "text": "<math><mn>15</mn><mi mathvariant=\"normal\">Ω</mi><mo>±</mo><mn>2</mn><mi mathvariant=\"normal\">%</mi></math>", "image": null, "isCorrect": false}, {"id": "MrBwC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>.</mo><mn>3</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi><mo>&#xB1;</mo><mn>3</mn><mi mathvariant=\"normal\">%</mi></math>", "image": null, "isCorrect": true}, {"id": "FKTtq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi><mo>&#xB1;</mo><mn>3</mn><mi mathvariant=\"normal\">%</mi></math>", "image": null, "isCorrect": false}, {"id": "SLovb", "text": "<math><mn>3.3</mn><mi mathvariant=\"normal\">Ω</mi><mo>±</mo><mn>7</mn><mi mathvariant=\"normal\">%</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In parallel,<br /><br /><math><msub><mrow><mi>R</mi></mrow><mrow><mi>p</mi></mrow></msub><mo>=</mo><mfrac><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math><math><mo>&nbsp; &nbsp;=</mo><mfrac><mrow><mn>5.0</mn><mo>×</mo><mn>10.0</mn></mrow><mrow><mn>5.0</mn><mo>+</mo><mn>10.0</mn></mrow></mfrac></math><math><mo>&nbsp; =</mo><mfrac><mrow><mn>50</mn></mrow><mrow><mn>15</mn></mrow></mfrac><mo>=</mo><mn>3.3</mn><mi mathvariant=\"normal\">Ω</mi></math><br /><br />Also,<br /><math><msub><mrow><mi>R</mi></mrow><mrow><mi>P</mi></mrow></msub><mo>=</mo><mn>3.3</mn><mi mathvariant=\"normal\">Ω</mi></math><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mi>p</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math><br /><br />Differentiating<br /><br /><math><mo>⟹</mo></math><math><mfrac><mrow><mi mathvariant=\"normal\">Δ</mi><msub><mrow><mi>R</mi></mrow><mrow><mi>p</mi></mrow></msub></mrow><mrow><msubsup><mrow><mi>R</mi></mrow><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msubsup></mrow></mfrac><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">Δ</mi><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msubsup><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow></mfrac><mo>+</mo><mfrac><mrow><mi mathvariant=\"normal\">Δ</mi><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msubsup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow></mfrac></math><br /><br /><math><mfrac><mrow><mi mathvariant=\"normal\">Δ</mi><msub><mrow><mi>R</mi></mrow><mrow><mi>p</mi></mrow></msub></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mi>p</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>50</mn></mrow><mrow><mn>15</mn></mrow></mfrac><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>0.2</mn></mrow><mrow><mn>25</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>0.1</mn></mrow><mrow><mn>100</mn></mrow></mfrac></mrow></mfenced></math><br /><br />%error = <math><mfrac><mrow><mn>50</mn></mrow><mrow><mn>15</mn></mrow></mfrac><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>0.8</mn><mo>+</mo><mn>0.1</mn></mrow><mrow><mn>100</mn></mrow></mfrac></mrow></mfenced><mo>×</mo><mn>100</mn><mo>=</mo><mn>3</mn><mi>%</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86362103d87bbd0d56d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "85", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the circuit shown in the figure. <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">A</mi></mrow></mfenced></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>3</mn></msub></math> is a variable resistance<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/75192_CA.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 250px; height: 127px;\" /><br />\r<br />\rAs the value <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>3</mn></msub></math> is changed, current <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi></math> though the cell varies as shown. Obviously, the variation is asymptotic, i.e. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>→</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>6</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math> as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>3</mn></msub><mo>→</mo><mi mathvariant=\"normal\">∞</mi></math> . Resistances <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>2</mn></msub></math> are, respectively", "image": null}, "options": [{"id": "5VpOI", "text": "<math><mn>4</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">Ω</mi><mo>,</mo><mi mathvariant=\"normal\"> </mi><mn>2</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": false}, {"id": "yUgIY", "text": "<math><mn>2</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">Ω</mi><mo>,</mo><mi mathvariant=\"normal\"> </mi><mn>4</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": false}, {"id": "JRLwt", "text": "<math><mn>2</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi><mo>,</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>2</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": true}, {"id": "3E1R4", "text": "<math><mn>1</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">Ω</mi><mo>,</mo><mi mathvariant=\"normal\"> </mi><mn>4</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>3</mn></msub><mo>=</mo><mn>0</mn><mo>,</mo><mi>I</mi><mo>=</mo><mn>9</mn><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></math> (from the graph).In this situation, the circuit can be drawn as shown in figure <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">A</mi></mrow></mfenced></math> .<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image14-5aa0c129-fced-4188-834c-15919b2db198.jpg\" style=\"max-width:100%; object-fit:contain\" /><br /><br />[current through R<sub>2&nbsp;</sub>will be zero because we have a short circuit <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>R</mi><mn>3</mn></msub><mo>=</mo><mn>0</mn></mrow></mfenced></math>&nbsp;across <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>2</mn></msub></math>]<br /><br />Here <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mfrac><mn>36</mn><mrow><msub><mi>R</mi><mn>1</mn></msub><mo>+</mo><msub><mi>R</mi><mn>2</mn></msub></mrow></mfrac><mo>=</mo><mn>9</mn><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></math><br /><br />or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>1</mn></msub><mo>+</mo><msub><mi>R</mi><mn>2</mn></msub><mo>=</mo><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math> ...(1)<br /><br />current will not flow through <math> <mrow> <msub> <mi>R</mi> <mn>3</mn> </msub> </mrow> </math>, it will be open circuit.<br /><br />In this situation, the circuit can be drawn as shown figure <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">B</mi></mrow></mfenced></math> .<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/54478.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 223px; height: 268px;\" /><br />Figure (B)<br /><br />Now <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mfrac><mn>36</mn><mrow><msub><mi>R</mi><mn>1</mn></msub><mo>+</mo><mn>2</mn><msub><mi>R</mi><mn>2&#160;</mn></msub></mrow></mfrac><mo>=</mo><mn>6</mn><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></math>&nbsp;(given)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi mathvariant=\"normal\">&#160;</mi><msub><mi>R</mi><mn>1</mn></msub><mo>+</mo><mn>2</mn><msub><mi>R</mi><mn>2</mn></msub><mo>=</mo><mn>6</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math> ...(2)<br /><br />from Eqs. (1) and (2)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><msub><mi>R</mi><mn>2</mn></msub><mo>=</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86355b67b32fa1e6444", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "15", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>In the circuit shown,&nbsp;each resistor is of resistance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>.&nbsp;The equivalent resistance between the terminals <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&nbsp;is</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ee01703d-bd09-4f37-a151-67d28c82a91f-35.JPG\" style=\"width: 333px; height: 106px;\" /></p>\r", "image": null}, "options": [{"id": "9lpTc", "text": "<math> <mrow>  <mtext>2</mtext><mtext>&#x2009;</mtext><mtext>R</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "5GY0i", "text": "<math> <mrow>  <mtext>1</mtext><mtext>.3&#x00A0;R</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "cL1Lu", "text": "<math> <mrow> <mtext>1</mtext><mtext>.5</mtext><mtext> </mtext><mtext>R</mtext></mrow> </math>", "image": null, "isCorrect": true}, {"id": "priL7", "text": "<math> <mrow>  <mtext>15&#x00A0;R</mtext></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img alt=\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/abs/0f512403-e87f-4a2d-ae30-12d621c24120-32.jpg\" style=\"width: 229px; height: 97px;\" ></p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/abs/33e5d887-5746-484b-9041-ca5f77e0a408-33.jpg\" style=\"width: 202px; height: 133px;\" /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/abs/b0616086-4f5e-4df2-9930-3559af3a9e82-34.jpg\" style=\"width: 199px; height: 121px;\" /></p><p>[The given circuit is actually a balanced wheat-stone bridge]</p><p>Hence, equivalent resistance<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>3</mn><mi>R</mi></mrow><mn>2</mn></mfrac><mo>=</mo><mn>1</mn><mo>.</mo><mn>5</mn><mi>R</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86352a794f873a99189", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "18", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A battery of internal resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math> is connected to the network of resistances as shown in the figure. In order that the maximum power be delivered to the network, the value of <em><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math></em>&nbsp;(in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Ω</mi></math>) should be<br />\r<br />\r<style type=\"text/css\"><!--\r\t\t@page { margin: 2cm }\r\t\tP { margin-bottom: 0.21cm }\r\t-->\r</style>\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0001496_Ques1_1.jpg\" style=\"width: 390px; height: 164px;\" />", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "The given circuit is a balanced Wheatstone's bridge.<br /><br /><style type=\"text/css\"><!--\t\t@page { margin: 2cm }\t\tP { margin-bottom: 0.21cm }\t--></style><strong><u><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0001496_AnsExp4_1.jpg\" style=\"width: 456px; height: 200px;\" /></u></strong><br /><br />Thus, no current will flow across <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mi>R</mi></math>. The given circuit will now be equivalent to:-<br /><br /><style type=\"text/css\"><!--\t\t@page { margin: 2cm }\t\tP { margin-bottom: 0.21cm }\t--></style><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0001496_AnsExp4_2..jpg\" /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0001496_AnsExp4_3..jpg\" style=\"width: 348px; height: 177px;\" /><br /><br />For maximum power, net external resistance = Total internal resistance<br />or&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>R</mi><mo>=</mo><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math><br />or&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634df97d4c7f7590bb", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "07", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/jee2vwtuio.JPG\" style=\"width: 127px; height: 131px;\" />&nbsp;</p>\r\r<p>In the above arrangement,&nbsp;each side of the cube has&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>&nbsp;resistance and&nbsp;it is known&nbsp;that the effective resistance&nbsp;between&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>&nbsp;is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>9</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>. Now,&nbsp;if the resistor between&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>&nbsp;is removed, then find the new&nbsp;effective resistance (in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#937;</mi></math>) between the same two points.</p>\r", "image": null}, "options": [], "correctValue": "01.25", "solution": {"text": "<p>i.&nbsp;For a cube of resistors each of resistance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;the equivalent resistance between two edges on the same face is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">R</mi><mrow><mi>e</mi><mi>q</mi></mrow></msub><mo>=</mo><mfrac><mrow><mn>5</mn><mi mathvariant=\"normal\">R</mi></mrow><mn>9</mn></mfrac></math></p><p>ii.&nbsp;If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math>&nbsp;is removed, assuming the equivalent&nbsp;resistance between remaining resistors is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>,</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msub><mi>R</mi><mrow><mi>e</mi><mi>q</mi></mrow></msub></mfrac><mo>=</mo><mfrac><mn>1</mn><mi>R</mi></mfrac><mo>+</mo><mfrac><mn>1</mn><mi>x</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mrow><mi>e</mi><mi>q</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>R</mi><mi>x</mi></mrow><mrow><mi>R</mi><mo>+</mo><mi>x</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><mfrac><mn>5</mn><mn>9</mn></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn><mo>(</mo><mi>x</mi><mo>)</mo></mrow><mrow><mn>1</mn><mo>+</mo><mi>x</mi></mrow></mfrac><mo>=</mo><mfrac><mi>x</mi><mrow><mn>1</mn><mo>+</mo><mi>x</mi></mrow></mfrac><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mrow><mo>&#8757;</mo><mo>&#160;</mo><mi>R</mi><mo>=</mo><mn>1</mn><mi>&#937;</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><mn>5</mn><mo>(</mo><mn>1</mn><mo>+</mo><mi>x</mi><mo>)</mo><mo>=</mo><mn>9</mn><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><mn>5</mn><mo>+</mo><mn>5</mn><mi>x</mi><mo>=</mo><mn>9</mn><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><mn>5</mn><mo>=</mo><mn>4</mn><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><mi>x</mi><mo>=</mo><mfrac><mn>5</mn><mn>4</mn></mfrac><mi>&#937;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><mi>x</mi><mo>=</mo><mn>1</mn><mo>.</mo><mn>25</mn><mi>&#937;</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863468d535d8c9ebb56", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "100", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The internal resistance of the cell shown in the figure is negligible. On closing the key <math><mi mathvariant=\"normal\">k</mi></math>, the ammeter reading changes from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0.25</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">A</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>12</mn></mfrac><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math>, then what is the value of resistance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">R</mi><mn>1</mn></msub></math>&nbsp;(in ohm)?<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image1-102156bc-1b93-48c8-b772-05126ba6f272.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"height: 154px; width: 200px;\" />", "image": null}, "options": [], "correctValue": "15", "solution": {"text": "When <math><mi mathvariant=\"normal\">k</mi></math> was open<br /><br />Reading of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mi mathvariant=\"normal\">A</mi></mfenced><mi mathvariant=\"normal\">&#160;</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">E</mi><mn>10</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">&#160;</mi><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mn>0.25</mn></math>,<br /><br />When <math><mi mathvariant=\"normal\">k</mi></math> was closed<br /><br />Reading of <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">A</mi></mrow></mfenced><mi mathvariant=\"normal\">&#160;</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">E</mi><mfenced separators=\"|\"><mrow><mn>10</mn><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfenced></mrow><mrow><mn>10</mn><msub><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>12</mn></mrow></mfrac></math><br /><br /><math><mo>&#8658;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>12</mn><mi mathvariant=\"normal\">&#160;</mi><mfenced separators=\"|\"><mrow><mn>5</mn><mi mathvariant=\"normal\">&#160;</mi><mo>+</mo><mi mathvariant=\"normal\">&#160;</mi><mn>0.5</mn><msub><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfenced><mi mathvariant=\"normal\">&#160;</mi><mo>=</mo><mn>10</mn><msub><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>1</mn></mrow></msub></math><br /><br /><math><msub><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>1</mn></mrow></msub><mi mathvariant=\"normal\">&#160;</mi><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mn>15</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634365835e9bdbd9bf", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "101", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The effective resistance between points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math> of the electrical circuit shown in the figure is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image6-f0cf64bd-51ad-410b-aaa1-75f83520dc8d.jpg\" style=\"max-width:100%; object-fit:contain\" />", "image": null}, "options": [{"id": "Uh6hp", "text": "<math><mfrac><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "ipYIQ", "text": "<math><mi>R</mi></math>", "image": null, "isCorrect": false}, {"id": "8NHNA", "text": "<math><mfrac><mrow><mn>3</mn><mi>R</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "YAMZN", "text": "<math><mn>2</mn><mi>R</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According balanced wheat stone bridge<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image7-35cf0d3b-e161-4979-8014-197d936bc996.jpg\" style=\"max-width:100%; object-fit:contain\" /><br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mi>e</mi><mi>q</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><mi>R</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><mi>R</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>R</mi></mrow></mfrac></math><br /><br /><math><mo>=</mo><mfrac><mrow><mn>1</mn><mo>+</mo><mn>1</mn><mo>+</mo><mn>2</mn></mrow><mrow><mn>2</mn><mi>R</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mi>R</mi></mrow></mfrac></math><br /><br /><math><msub><mrow><mi>R</mi></mrow><mrow><mi>e</mi><mi>q</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633cb80fbbd11149bc", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "92", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two bulbs consume the same power when operated at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> respectively. When these bulbs are connected in series across a DC source of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>400</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>, then the ratio of power consumed across them is", "image": null}, "options": [{"id": "MYhr1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>3</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "tMNlm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "3CD2M", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>9</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "TT5je", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><mn>4</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi>R</mi><mo>=</mo><mfrac><mrow><msup><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>P</mi></mrow></mfrac><mi>&nbsp;</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi><mi>&nbsp;</mi><mi>R</mi><mo>∝</mo><msup><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>&nbsp;</mi><mo>∴</mo><mfrac><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mn>200</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mn>300</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>9</mn></mrow></mfrac></math>.<br /><br />When bulbs are connected in series, the current <math><mi>I</mi></math> is same through each. As <math><mi>P</mi><mo>=</mo><msup><mrow><mi>I</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>&nbsp;</mi><mi>R</mi><mi>&nbsp;</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi><mi>&nbsp;</mi><mi>P</mi><mo>∝</mo><mi>R</mi><mo>(</mo><mi>&nbsp;</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">s</mi><mi>&nbsp;</mi><mi>I</mi></math> is same in series),<br /><br />so <math><mfrac><mrow><msub><mrow><mi>P</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>P</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>9</mn></mrow></mfrac></math>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86331dd914164bf6219", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "91", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the shown wireframe, each side of a square (the smallest square) has a resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math>. What is the equivalent resistance value (in ohm) of the circuit between the points <math><mi mathvariant=\"normal\">A</mi></math> and <math><mi mathvariant=\"normal\">B</mi></math>?<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image164-b955d77f-ed7b-4b1f-9d5a-9e67fc5c0810.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"height: 142px; width: 250px;\" />", "image": null}, "options": [], "correctValue": "14", "solution": {"text": "The circuit can be folded about <math><mi mathvariant=\"normal\">B</mi></math> and redrawn as<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/lhukyjth.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 359px; height: 203px;\" /><br /><br />Hence equivalent resistance between <math><mi mathvariant=\"normal\">A</mi></math> and <math><mi mathvariant=\"normal\">B</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">R</mi><mo>=</mo><mn>2</mn><mo>&#215;</mo><mn>7</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi><mo>=</mo><mn>14</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632ba861469feb61f4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "28", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the given circuit, the voltmeter reading is <math><mn>4.5</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">V</mi></math> . Assuming that the voltmeter is ideal, current through <math><mn>12</mn><mi mathvariant=\"normal\">Ω</mi></math> resistance is -<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image6-ea1b9478-8fc9-4c92-9f70-9b2ff978bf4b.jpg\" style=\"height: 186px; width: 250px;\" />", "image": null}, "options": [{"id": "iBXet", "text": "<math><mn>1</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}, {"id": "uuUQZ", "text": "<math><mn>0.5</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": true}, {"id": "ngpWX", "text": "<math><mn>0.25</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}, {"id": "uu76A", "text": "<math><mn>0.1</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image7-8b480985-78c6-4cc1-b518-8ac4426fedc6.jpg\" style=\"height: 169px; width: 250px;\" /></p><p>The voltmeter is ideal so it doesn&#39;t draw any current from the circuit.<br />Potential difference across <math><mn>9</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math> resistance = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4.5</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">V</mi></math> (given)</p><p>So&nbsp;&nbsp;the current in the&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math> resistance =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4.5</mn><mn>9</mn></mfrac><mo>=</mo><mn>0.5</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">A</mi></math></p><p>i.e., <math><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mo>=</mo><mn>0.5</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">A</mi></math></p><p>The same current <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi mathvariant=\"normal\">I</mi><mn>1</mn><mi mathvariant=\"normal\">&#8242;</mi></msubsup></math> passes through <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>. The resistors&nbsp;<math><mn>9</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math> and <math><mn>3</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math> are in series and their equivalent, i.e., <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math> is in parallel with <math><mn>6</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math> between <math><mi mathvariant=\"normal\">A</mi></math> and <math><mi mathvariant=\"normal\">B</mi></math> . Dividing the current in the inverse ratio of resistances between <math><mi mathvariant=\"normal\">A</mi></math> and <math><mi mathvariant=\"normal\">B</mi></math> ,<br /><br /><math><mfrac><mrow><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup></mrow><mrow><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>6</mn></mrow><mrow><mn>12</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><br /><math><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mo>=</mo><mn>2</mn><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#160;</mi><mo>&#215;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>0.5</mn><mo>=</mo><mn>1</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">A</mi></math><br /><br />and <math><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mo>+</mo><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mo>=</mo><mn>0.5</mn><mo>+</mo><mn>1</mn><mo>=</mo><mn>1.5</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">A</mi></math><br /><br />at junction <math><mi mathvariant=\"normal\">C</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow></msub></math> divides into three parts. Since the resistances <math><mn>10</mn><mi mathvariant=\"normal\">&#937;</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><mn>12</mn><mi mathvariant=\"normal\">&#937;</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><mn>15</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math> are in parallel between <math><mi mathvariant=\"normal\">C</mi></math> and <math><mi mathvariant=\"normal\">D</mi></math> , current will distribute in the inverse ratio of resistances.<br /><br /><math><mo>&#8756;</mo><mi mathvariant=\"normal\">&#160;</mi><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>2</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mi mathvariant=\"normal\">&#160;</mi><mo>:</mo><mi mathvariant=\"normal\">&#160;</mi><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>2</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mi mathvariant=\"normal\">&#160;</mi><mo>:</mo><mi mathvariant=\"normal\">&#160;</mi><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>2</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi><mi mathvariant=\"normal\">&#8242;</mi><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>10</mn></mrow></mfrac><mi mathvariant=\"normal\">&#160;</mi><mo>:</mo><mi mathvariant=\"normal\">&#160;</mi><mfrac><mrow><mn>1</mn></mrow><mrow><mn>12</mn></mrow></mfrac><mi mathvariant=\"normal\">&#160;</mi><mo>:</mo><mi mathvariant=\"normal\">&#160;</mi><mfrac><mrow><mn>1</mn></mrow><mrow><mn>15</mn></mrow></mfrac></math><br /><br /><math><mo>=</mo><mn>6</mn><mi mathvariant=\"normal\">&#160;</mi><mo>:</mo><mi mathvariant=\"normal\">&#160;</mi><mn>5</mn><mi mathvariant=\"normal\">&#160;</mi><mo>:</mo><mi mathvariant=\"normal\">&#160;</mi><mn>4</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi mathvariant=\"normal\">I</mi><mn>2</mn><mi mathvariant=\"normal\">&#8242;</mi></msubsup><mo>=</mo><mfrac><mn>5</mn><mn>15</mn></mfrac><mo>&#215;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>1.5</mn><mo>=</mo><mn>0.5</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">A</mi></math><br /><br />So <math><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>2</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mo>=</mo><mn>6</mn><mi mathvariant=\"normal\">k</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>2</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mo>=</mo><mn>5</mn><mi mathvariant=\"normal\">k</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>2</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi><mi mathvariant=\"normal\">&#8242;</mi><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mo>=</mo><mn>4</mn><mi mathvariant=\"normal\">k</mi></math><br /><br />( <math><mi mathvariant=\"normal\">k</mi></math> being a constant of proportionality)<br /><br />and <math><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>2</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mo>+</mo><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>2</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mo>+</mo><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>2</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi><mi mathvariant=\"normal\">&#8242;</mi><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mo>=</mo><mn>15</mn><mi mathvariant=\"normal\">k</mi></math><br /><br />but <math><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>1.5</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">A</mi></math><br /><br /><math><mo>&#8756;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>15</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">k</mi><mo>=</mo><mn>1.5</mn></math><br /><br />or <math><mi mathvariant=\"normal\">k</mi><mo>=</mo><mn>0.1</mn></math><br /><br />so <math><msubsup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>2</mn></mrow><mrow><mi mathvariant=\"normal\">&#8242;</mi><mi mathvariant=\"normal\">&#8242;</mi></mrow></msubsup><mo>=</mo><mn>5</mn><mi mathvariant=\"normal\">k</mi><mo>=</mo><mn>0.5</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">A</mi></math><br /><br />Thus current through <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math> resistance is <math><mn>0.5</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">A</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863282c3ba290200cb4", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "55", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A meter bridge circuit is powered by an ideal battery of emf&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>&nbsp;and negligible internal resistance. The bridge wire has a resistance per unit length equal to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0.1</mn><mi>&nbsp;</mi><mi>Ω&nbsp;</mi><msup><mi>cm</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>.&nbsp;Unknown resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>X</mi></math>&nbsp;is connected in the left gap and <math><mn>6&nbsp;</mn><mi mathvariant=\"normal\">Ω</mi></math> in the right gap. The null point divides the wire in the ratio <math><mn>2</mn><mo>:</mo><mn>3</mn></math>. What is the current (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>) drawn from the battery?", "image": null}, "options": [], "correctValue": "1", "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>l</mi><mn>1</mn></msub><msub><mi>l</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><mo>=</mo><mfrac><msub><mi>v</mi><mn>1</mn></msub><msub><mi>v</mi><mn>2</mn></msub></mfrac></math><br /><br />Now <math><msub><mrow><mi>v</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mi>v</mi><mo>=</mo><mn>5</mn><mi>&#160;</mi><mn>V</mn></math> <math><mo>=</mo><mi>I</mi><mi>R</mi></math><br /><br />For potentiometer wire <math><mfrac><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math><br /><br /><math><mfrac><mrow><mi>x</mi></mrow><mrow><mn>6</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>&#8658;</mo><mfrac><mrow><mi>x</mi></mrow><mrow><mi mathvariant=\"script\">l</mi></mrow></mfrac><mo>=</mo><mn>4</mn><mi>&#160;</mi><mfrac><mrow><mi mathvariant=\"normal\">&#937;</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi></mrow></mfrac></math><br /><br />The resistance per unit length of the wire is <math><mfrac><mrow><mn>0.1</mn><mi mathvariant=\"normal\">&#937;</mi></mrow><mrow><mn>c</mn><mn>m</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn><mi mathvariant=\"normal\">&#937;</mi></mrow><mrow><mn>m</mn></mrow></mfrac></math><br /><br /><math><mo>&#8756;</mo><mi>&#160;</mi><mfenced separators=\"|\"><mrow><mi>x</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mo>=</mo><msub><mrow><mi>R</mi></mrow><mrow><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">f</mi></mrow></msub><mo>=</mo><mn>5</mn></math><br /><br /><math><mo>&#8756;</mo><mi>&#160;</mi><mi>i</mi><mo>=</mo><mfrac><mrow><mi>V</mi></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">f</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mo>=</mo><mn>1</mn><mi>&#160;</mi><mn>A</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86326f8485abe924474", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "82", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The resistance of each straight section is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math>.&nbsp;Find the equivalent resistance (in ohms) between <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/500797_phys.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 270px; height: 123px;\" />", "image": null}, "options": [], "correctValue": "7", "solution": {"text": "<p><u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0022022_Ans.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 350px; height: 65px;\" /></strong></u></p><p>The circuit can be simplified as shown in the above figure. Due to symmetry, we can see that the distribution of current at point A in the circuit, is the same as the recombination of the current before point B. Also, the junction which is present between the points C and D can be disconnected because it won&#39;t affect the distribution of current.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><msub><mi>r</mi><mtext>AB</mtext></msub><mo>=</mo><mi>r</mi><mo>+</mo><mtext>1.5</mtext><mtext mathvariant=\"italic\">r</mtext><mo>+</mo><mi>r</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>r</mi><mi>AB</mi></msub><mo>=</mo><mtext>3.5</mtext><mtext mathvariant=\"italic\">r</mtext><mo>=</mo><mn>7</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631fc30fdb16559faf", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "97", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Three unequal resistors in parallel are equivalent to a resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math>. If two of them are in the ratio <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>:</mo><mn>2</mn></math> and if no resistance value is fractional, what will be the largest of the three resistance in ohm?", "image": null}, "options": [], "correctValue": "6", "solution": {"text": "Let the resistances be <math><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>,</mo><mi>&nbsp;</mi><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub></math> and <math><msub><mrow><mi>R</mi></mrow><mrow><mn>3</mn></mrow></msub></math><br /><br /><math><mo>∴</mo><mfrac><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>⟹</mo><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mi>k</mi><mo>,</mo><mi>&nbsp;</mi><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>2</mn><mi>k</mi></math><br /><br />In parallel <math><mfrac><mrow><mn>1</mn></mrow><mrow><mi>R</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>3</mn></mrow></msub></mrow></mfrac></math><br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>k</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><mi>k</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>3</mn></mrow></msub></mrow></mfrac></math><br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>3</mn></mrow></msub></mrow></mfrac><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>k</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><mi>k</mi></mrow></mfrac></math><br /><br /><math><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>k</mi><mo>-</mo><mn>2</mn><mo>-</mo><mn>1</mn></mrow><mrow><mn>2</mn><mi>k</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>k</mi><mo>-</mo><mn>3</mn></mrow><mrow><mn>2</mn><mi>k</mi></mrow></mfrac></math><br /><br /><math><msub><mrow><mi>R</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>2</mn><mi>k</mi></mrow><mrow><mn>2</mn><mi>k</mi><mo>-</mo><mn>3</mn></mrow></mfrac></math><br /><br />If k = 1, then <math><msub><mrow><mi>R</mi></mrow><mrow><mn>3</mn></mrow></msub></math> is found to be negative, which is impossible.<br /><br />If k = 2, then <math><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>2</mn><mo>,</mo><mi>&nbsp;</mi><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>4</mn><mi>&nbsp;</mi><msub><mrow><mi>R</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>=</mo><mn>4</mn></math><br /><br /><math><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><msub><mrow><mi>R</mi></mrow><mrow><mn>3</mn></mrow></msub></math>, not satisfying the condition of the question that all resistance are unequal.<br /><br /><math><mi>I</mi><mi>f</mi><mi>&nbsp;</mi><mi>k</mi><mo>=</mo><mn>3</mn><mo>,</mo><mi>&nbsp;</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">n</mi><mi>&nbsp;</mi><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>3</mn><mo>,</mo><mi>&nbsp;</mi><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>6</mn></math><br /><br /><math><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>R</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>=</mo><mn>2&nbsp;</mn><mi mathvariant=\"normal\">Ω</mi></math><br /><br />∴ Largest resistance <math> <mo>=</mo><mn>6&nbsp;</mn><mi mathvariant=\"normal\">Ω</mi><mi mathvariant=\"normal\">&nbsp;</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631b15690499eb08a1", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "17", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The charge on the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi>&#956;F</mi></math> capacitor in the steady state is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/D-7_ques.png\" style=\"width: 250px; height: 90px;\" />", "image": null}, "options": [{"id": "Irw9n", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>/</mo><mn>3</mn><mo>&#xA0;</mo><mi>&#x3BC;C</mi></math>", "image": null, "isCorrect": false}, {"id": "k9qLA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>32</mn><mo>/</mo><mn>3</mn><mo>&#xA0;</mo><mi>&#x3BC;C</mi></math>", "image": null, "isCorrect": true}, {"id": "JH7mt", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>/</mo><mn>3</mn><mo>&#xA0;</mo><mi>&#x3BC;C</mi></math>", "image": null, "isCorrect": false}, {"id": "zhyRF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>/</mo><mn>3</mn><mo>&#xA0;</mo><mi>&#x3BC;C</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>In steady state, the capacitors are fully charged and act as open circuit, so the equivalent circuit in steady state would be as shown:-</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/D-8_solu_1.png\" style=\"width: 250px; height: 114px;\" /><br /><math><mo>&#8756;</mo></math> Steady State current is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mfrac><mn>12</mn><mrow><mn>2</mn><mo>+</mo><mn>4</mn></mrow></mfrac><mo>=</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></math><br /><math><mo>&#8756;</mo></math> Potential&nbsp;difference across <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">V</mi><mo>=</mo><mn>2</mn><mo>&#215;</mo><mn>4</mn><mo>=</mo><mn>8</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">V</mi></math><br /><math><mo>&#8756;</mo></math> Sum of potential difference across <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi>&#956;F</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#160;</mo><mi>&#956;F</mi><mo>&#160;</mo></math>capacitors is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></math>.&nbsp;As these are in series, so charges on them would be same.&nbsp;Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi></math>&nbsp;be the charge on them, then:-<br />From KVL,&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>q</mi><mn>2</mn></mfrac><mo>+</mo><mfrac><mi>q</mi><mn>4</mn></mfrac><mo>=</mo><mn>8</mn><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mi>q</mi><mo>=</mo><mfrac><mn>32</mn><mn>3</mn></mfrac><mo>&#160;</mo><mi>&#956;C</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86318a1338fe3ef2a41", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "18", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A wire of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi></math> has a resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>. If half of the length is stretched to make
