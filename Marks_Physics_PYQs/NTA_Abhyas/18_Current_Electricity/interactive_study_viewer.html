 the radius half of its original value, then the final resistance of the wire is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/75337_q.png\" style=\"width: 300px; height: 115px;\" /><br />\r<br />\r&nbsp;", "image": null}, "options": [{"id": "DkeMW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mi>R</mi></math>", "image": null, "isCorrect": false}, {"id": "ghrye", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mi>R</mi></math>", "image": null, "isCorrect": false}, {"id": "zVC5C", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>17</mn><mi>R</mi></mrow><mn>2</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "DQfru", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>R</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/75337_1_.png\" style=\"width: 319px; height: 113px;\" /><br /><br /><math> <mi>R</mi><mo>=</mo><mfrac> <mrow> <mi>ρ</mi><mi>l</mi></mrow> <mi>A</mi> </mfrac> <mo>=</mo><mfrac> <mrow> <mi>ρ</mi><mi>l</mi></mrow> <mrow> <mi>π</mi><msup> <mi>r</mi> <mn>2</mn> </msup> </mrow> </mfrac> </math><br /><br /><math> <mi>π</mi><msup> <mi>r</mi> <mn>2</mn> </msup> <mfrac> <mi>l</mi> <mn>2</mn> </mfrac> <mo>=</mo><mi>π</mi><msup> <mrow><mo>(</mo> <mrow> <mfrac> <mi>r</mi> <mn>2</mn> </mfrac> </mrow> <mo>)</mo></mrow> <mn>2</mn> </msup> <msup> <mi>l</mi> <mo>′</mo> </msup> </math><br /><br /><math> <msup> <mi>l</mi> <mo>′</mo> </msup><mo>=</mo><mn>2</mn><mi>l</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>'</mo><mo>=</mo><mfrac><mrow><mi>ρ</mi><mi>l</mi><mo>'</mo></mrow><mrow><mi>A</mi><mo>'</mo></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>ρ</mi><mfenced separators=\"|\"><mrow><mn>2</mn><mi>l</mi></mrow></mfenced></mrow><mrow><mi>π</mi><msup><mfenced separators=\"|\"><mstyle displaystyle=\"true\"><mfrac bevelled=\"true\"><mi>r</mi><mn>2</mn></mfrac></mstyle></mfenced><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mn>8</mn><mi>R</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>''</mo><mo>=</mo><mfrac><mrow><mi>ρ</mi><mfenced><mstyle displaystyle=\"true\"><mfrac bevelled=\"true\"><mi>l</mi><mn>2</mn></mfrac></mstyle></mfenced></mrow><mrow><mi>π</mi><msup><mi>r</mi><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mfrac><mi>R</mi><mn>2</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mi>eq</mi></msub><mo>=</mo><mi>R</mi><mo>'</mo><mo>+</mo><mi>R</mi><mo>''</mo><mo>=</mo><mfrac><mrow><mn>17</mn><mi>R</mi></mrow><mn>2</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86313f28bbd2b1acbd7", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "27", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two cylindrical rods of same cross-section area and same length are connected in series to an ideal cell as shown. The resistivity of the left rod is&nbsp;<math><mrow><mi>ρ</mi>&nbsp; </mrow> </math> and that of the right rod is <math> <mrow> <mn>2</mn> <mi>ρ</mi></mrow></math>. Then, the variation of potential at any point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math>&nbsp;at a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi></math> from the left end of the combined system is most appropriately shown in which of the plots?<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/1474_question.png\" style=\"width: 200px; height: 140px;\" />", "image": null}, "options": [{"id": "ALCCJ", "text": "<img alt=\"\" height=\"94\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0001474_AnsExp1_2.jpg\" width=\"188\" />", "image": null, "isCorrect": false}, {"id": "auWRM", "text": "<img alt=\"\" height=\"115\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0001474_AnsExp1_1.jpg\" width=\"182\" />", "image": null, "isCorrect": true}, {"id": "Qbw44", "text": "<img alt=\"\" height=\"115\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0001474_AnsExp1_3.jpg\" width=\"181\" />", "image": null, "isCorrect": false}, {"id": "cpcxI", "text": "<img alt=\"\" height=\"110\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0001474_AnsExp1_4.jpg\" width=\"180\" />", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From relation,&nbsp;<math><mrow><mtext>E</mtext> <mo>=</mo> <mi>ρ</mi> <mtext>J</mtext></mrow></math>, the magnitude of the electric field is greater in the right rod as compared to the left rod. Therefore the magnitude of the potential gradient in the right rod is greater. (Remember that potential is continuous).<br />Therefore the variation is shown by the following figure.<br /><br /><img alt=\"\" height=\"139\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/content_15.20.2..png\" width=\"207\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863098a9625ebfce3c5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "76", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The figure shown below, calculate the net current from the battery and net resistance of the circuit.<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/awtgaxykpskrlliaeknrzkjgpdjsfucimvnjpdshzbikozkyjl.png\" style=\"max-width:100%; object-fit:contain\" style=\"height: 149px; width: 200px;\" />", "image": null}, "options": [{"id": "FOw5X", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.33</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">A</mi><mo>,</mo><mo>&nbsp;</mo><mfrac><mn>15</mn><mn>2</mn></mfrac><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": true}, {"id": "Cosh2", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.33</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">A</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><mn>15</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math>", "image": null, "isCorrect": false}, {"id": "0F569", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.5</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">A</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><mn>10</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math>", "image": null, "isCorrect": false}, {"id": "T1Hma", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.5</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">A</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><mn>15</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In the given circuit, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">E</mi></math> are at the same potential. Points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">F</mi></math> are also at the same potential.<br /><br />Therefore, the resistance between <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">E</mi><mo>,</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">C</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">F</mi></math> will be ineffective and neglected. Now, the circuit becomes<br /><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/rrfnkkbsagtefmfsayzumpszokerybuufogveukbbajtyzdbqx.png\" style=\"max-width:100%; object-fit:contain\" style=\"height: 145px; width: 200px;\" /><br /><br />In the above circuit, branch <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ABCD</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AEFD</mi></math> are in the parallel combination.<br /><br />Thus, the net resistance of the circuit.<br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">t</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>5</mn><mo>+</mo><mn>5</mn><mo>+</mo><mn>5</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>5</mn><mo>+</mo><mn>5</mn><mo>+</mo><mn>5</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>15</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>15</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>15</mn></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msub><mi>R</mi><mrow><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">t</mi></mrow></msub><mo>=</mo><mfrac><mn>15</mn><mn>2</mn></mfrac><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math><br /><br /><math><mo>∴</mo></math> Current, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mfrac><mi>V</mi><msub><mi>R</mi><mrow><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">t</mi></mrow></msub></mfrac><mo>=</mo><mfrac><mn>10</mn><mrow><mn>15</mn><mo>/</mo><mn>2</mn></mrow></mfrac><mo>=</mo><mfrac><mn>20</mn><mn>15</mn></mfrac><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><mo>=</mo><mn>1</mn><mo>.33</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "6aa3ab79aa8dc1ff6817803d", "title": "Electric Cell or Battery", "totalQuestions": 29, "questions": [{"_id": "6151e863f32d59cffb3db715", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "29", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">n</mi></math>&nbsp;identical cells are joined in series with two cells&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> with reversed polarities. EMF of each cell is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">E</mi></math> and internal resistance is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi></math>. The potential difference across the cell&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> is (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">n</mi><mo>&gt;</mo><mn>4</mn></math>)", "image": null}, "options": [{"id": "9YZge", "text": "<math> <mrow> <mfrac> <mrow> <mn>2</mn> <mtext>E</mtext> </mrow> <mrow> <mtext>n</mtext> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "KXTGo", "text": "<math> <mrow> <mn>2</mn> <mtext>E</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>1</mn> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>n</mtext> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "v5ZJV", "text": "<math> <mrow> <mfrac> <mrow> <mn>4</mn> <mtext>E</mtext> </mrow> <mrow> <mtext>n</mtext> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "YVGO4", "text": "<math> <mrow> <mn>2</mn> <mtext>E</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>1</mn> <mo>-</mo> <mfrac> <mrow> <mn>2</mn> </mrow> <mrow> <mtext>n</mtext> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Total number of cells =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">n</mi></math><br />Total resistance =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>nr</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">n</mi><mo>-</mo><mn>2</mn></math>&nbsp;cells provide a forward emf,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math> cells provide a reverse emf so:<br />Total emf <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced><mrow><mtext>n</mtext><mo>-</mo><mn>2</mn></mrow></mfenced><mtext>E</mtext><mo>-</mo><mn>2</mn><mtext>E</mtext><mo>=</mo><mtext>ne</mtext><mo>-</mo><mn>4</mn><mtext>E</mtext><mo>=</mo><mtext>E</mtext><mfenced><mrow><mtext>n</mtext><mo>-</mo><mn>4</mn></mrow></mfenced></math><br /><br />Current,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi><mo>&#160;</mo><mo>=</mo><mfrac><mrow><mi>total</mi><mo>&#160;</mo><mi>emf</mi></mrow><mrow><mi>total</mi><mo>&#160;</mo><mi>resistance</mi></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>I</mtext><mo>=</mo><mfrac><mrow><mtext>E</mtext><mfenced><mrow><mtext>n</mtext><mo>-</mo><mn>4</mn></mrow></mfenced></mrow><mfenced><mtext>nr</mtext></mfenced></mfrac></math><br /><br />PD across A or B (voltage across internal resisitance)&nbsp;<br /><br /><math> <mrow> <mtext>V</mtext> <mo>=</mo> <mtext>Ir</mtext> <mo>+</mo> <mtext>E</mtext> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mtext>E</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>n</mtext> <mo>-</mo> <mn>4</mn> </mrow> </mfenced> <mo>/</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>nr</mtext> </mrow> </mfenced> </mrow> </mfenced> <mtext>r</mtext> <mo>+</mo> <mtext>E</mtext> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mtext>E</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>n</mtext> <mo>-</mo> <mn>4</mn> </mrow> </mfenced> <mtext>/n</mtext> <mo>+</mo> <mtext>E</mtext> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mtext>E</mtext> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>n</mtext> <mo>-</mo> <mn>4</mn> <mo>)</mo> <mo>/</mo> <mtext>n</mtext> </mrow> </mfenced> <mo>+</mo> <mn>1</mn> </mrow> </mfenced> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mtext>E</mtext> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>n</mtext> <mo>-</mo> <mn>4</mn> <mo>+</mo> <mtext>n</mtext> </mrow> </mfenced> <mo>/</mo> <mtext>n</mtext> </mrow> </mfenced> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mtext>E</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>2</mn> <mtext>n</mtext> <mo>-</mo> <mn>4</mn> </mrow> </mfenced> <mo>/</mo> <mtext>n</mtext> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mn>2</mn> <mtext>E</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>n</mtext> <mo>-</mo> <mn>2</mn> </mrow> </mfenced> <mo>/</mo> <mtext>n</mtext> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mn>2</mn> <mtext>E</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>1</mn> <mo>-</mo> <mn>2</mn> <mo>/</mo> <mtext>n</mtext> </mrow> </mfenced> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e75dfcd22ee6dab1", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "108", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A battery of internal resistance <math><mn>4</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math> is connected to the network of resistances, as shown in the figure. In order to deliver the maximum power&nbsp;to the network, what should be the value of R in ohm?<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/gjlksdhgos.PNG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 250px; height: 124px;\" />", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "The given figure is a balanced form of Wheatstone bridge therefore, 6R resistance can be removed.<br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mi>P</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn><mi>R</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>6</mn><mi>R</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><mi>R</mi></mrow></mfrac></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>R</mi></mrow><mrow><mi>P</mi></mrow></msub><mo>=</mo><mn>2</mn><mi>R</mi><mo>.</mo></math><br /><br />The power delivered to the network is maximum when internal resistance = External resistance.<br /><br /><math><mn>4</mn><mo>=</mo><mn>2</mn><mi>R</mi></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>R</mi><mo>=</mo><mn>2&nbsp;</mn><mi mathvariant=\"normal\">Ω</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e2b37ff4ca94f3ea", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "71", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "When a Daniel cell is connected in the secondary circuit of a potentiometer, the balancing length is found to be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>540</mn><mo>&nbsp;</mo><mi>cm</mi></math>. If the balancing length becomes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>500</mn><mo>&nbsp;</mo><mi>cm</mi></math> when the cell is short-circuited with <math><mn>1</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi><mo>,</mo></math> the internal resistance of the cell (in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Ω</mi></math>) is", "image": null}, "options": [], "correctValue": "0.08", "solution": {"text": "Internal resistance,<br /><br /><math><mi>r</mi><mo>=</mo><mi>R</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>1</mn><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>540</mn><mo>-</mo><mn>500</mn></mrow><mrow><mn>500</mn></mrow></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>40</mn></mrow><mrow><mn>500</mn></mrow></mfrac><mo>=</mo><mn>0.08</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863de7cab940cab340c", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "10", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></ma al\">V</mi></math><br /><br />The internal resistance of the battery, <math><mi>r</mi><mo>=</mo><mn>0.5</mn><mi>&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math><br /><br />The voltage of D. C supply = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>120</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></math><br /><br />External resistance, <math><mi>R</mi><mo>=</mo><mn>15.5</mn><mi>&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math><br /><br />When the battery of emf <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></math> is charged from a <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>DC</mi></math> supply of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>120</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></math>, the effective emf in the circular is<br /><br /><math><mi>&#949;</mi><mo>=</mo><mn>120</mn><mo>-</mo><mn>8</mn><mo>=</mo><mn>112</mn><mi>&#160;</mi><mi>V</mi></math><br /><br />The total resistance of the circuit <math><mo>=</mo><mi>R</mi><mo>+</mo><mi>r</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#160;</mi><mi>&#160;</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>15.5</mn><mo>+</mo><mn>0.5</mn></mrow></mfenced><mi>&#160;</mi><mi mathvariant=\"normal\">&#937;</mi><mo>=</mo><mn>16</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math><br /><br /><math><mo>&#8756;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi></math> Current in the circuit during charging<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mfrac><mi>&#949;</mi><mrow><mi>R</mi><mo>+</mo><mi>r</mi></mrow></mfrac><mo>=</mo><mfrac><mn>112</mn><mn>16</mn></mfrac><mo>=</mo><mn>7</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">A</mi></math><br /><br /><math><mo>&#8756;</mo><mi>&#160;</mi><mi>&#160;</mi></math>&nbsp;The terminal voltage of the battery,<br /><br /><math><mi>V</mi><mo>=</mo><mi m yle=\"width: 200px; height: 148px;\" /><br /><br />Clearly, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>2</mn></math> Volt Battery is Charging and another battery is discharging given,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1.2</mn><mo>+</mo><mn>0.2</mn><mi>I</mi><mo>=</mo><mn>1.5</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>I</mi><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mo>-</mo><mn>0.4</mn><mi>I</mi><mo>=</mo><mn>1.5</mn></math><br /><br /><math><mo>⇒</mo><mi>E</mi><mo>=</mo><mn>1.5</mn><mo>+</mo><mn>0.4</mn><mo>×</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>E</mi><mo>=</mo><mn>2.1</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">V</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86394a2ce5c3b97f111", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "22", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two cells of E.M.F.&nbsp;<math><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">&nbsp;</mi><mfenced separators=\"|\"><mrow><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">&nbsp;</mi><mo>&gt;</mo><mi mathvariant=\"normal\">&nbsp;</mi><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfenced></math> are connected in series in the secondary circuit of a potentiometer experiment for determination of E.M.F. The balancing length is found to be <math><mn>825</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>. Now when the terminals of cell&nbsp;<math><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>1</mn></mrow></msub></math> are reversed, then the balancing length is found to be <math><mn>225</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>. The ratio of <math><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>2</mn></mrow></msub></math> is", "image": null}, "options": [{"id": "WsnsO", "text": "<math><mn>2</mn><mi mathvariant=\"normal\"> </mi><mo>:</mo><mi mathvariant=\"normal\"> </mi><mn>3</mn></math>", "image": null, "isCorrect": false}, {"id": "WHXBM", "text": "<math><mn>4</mn><mi mathvariant=\"normal\">&nbsp;</mi><mo>:</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>7</mn></math>", "image": null, "isCorrect": true}, {"id": "yMkZ7", "text": "<math><mn>7</mn><mi mathvariant=\"normal\"> </mi><mo>:</mo><mi mathvariant=\"normal\"> </mi><mn>4</mn></math>", "image": null, "isCorrect": false}, {"id": "4KHHZ", "text": "none of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">&nbsp;</mi><mo>+</mo><mi mathvariant=\"normal\">&nbsp;</mi><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>1</mn></mrow></msub><mi mathvariant=\"normal\">&nbsp;</mi><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">x</mi><mfenced separators=\"|\"><mrow><mn>825</mn></mrow></mfenced></math><br /><br /><math><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">&nbsp;</mi><mo>–</mo><mi mathvariant=\"normal\">&nbsp;</mi><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>1</mn></mrow></msub><mi mathvariant=\"normal\">&nbsp;</mi><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">x</mi><mfenced separators=\"|\"><mrow><mn>225</mn></mrow></mfenced></math><br /><br />Dividing above equations, we get<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi mathvariant=\"normal\">E</mi><mn>2</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">E</mi><mn>1</mn></msub></mrow><mrow><msub><mi mathvariant=\"normal\">E</mi><mn>2</mn></msub><mo>-</mo><msub><mi mathvariant=\"normal\">E</mi><mn>1</mn></msub></mrow></mfrac><mo>=</mo><mfrac><mn>11</mn><mn>3</mn></mfrac></math><br /><br />Appling componendo and dividendo, we get<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi mathvariant=\"normal\">E</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">E</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><mn>4</mn><mn>7</mn></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638fa43d96fa37daff", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "24", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A current of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math> flows through a <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math> resistor when connected across a battery. The same battery supplies a current of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>0.5</mtext><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">A</mi></math>&nbsp;when connected across a <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math> resistor. The internal resistance of the battery is", "image": null}, "options": [{"id": "XzC4m", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi></math>", "image": null, "isCorrect": true}, {"id": "Uw9hJ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi></math>", "image": null, "isCorrect": false}, {"id": "gNM3X", "text": "<math><mn>5</mn><mi> </mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": false}, {"id": "zr63K", "text": "<math><mn>0.5</mn><mi> </mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Current <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">E</mi><mrow><mi mathvariant=\"normal\">R</mi><mo>+</mo><mi mathvariant=\"normal\">r</mi></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>2</mn><mo>=</mo><mfrac><mi mathvariant=\"normal\">E</mi><mrow><mn>2</mn><mo>+</mo><mi mathvariant=\"normal\">r</mi></mrow></mfrac></math> .... (i)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>0</mn><mo>.5</mo><mo>=</mo><mfrac><mi mathvariant=\"normal\">E</mi><mrow><mn>9</mn><mo>+</mo><mi mathvariant=\"normal\">r</mi></mrow></mfrac></math> .... (ii)<br /><br />On dividing equation (i) by equation (ii), we get<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mtext>0.5</mtext></mfrac><mo>=</mo><mfrac><mrow><mn>9</mn><mo>+</mo><mi mathvariant=\"normal\">r</mi></mrow><mrow><mn>2</mn><mo>+</mo><mi mathvariant=\"normal\">r</mi></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>4</mn><mo>=</mo><mfrac><mrow><mn>9</mn><mo>+</mo><mi mathvariant=\"normal\">r</mi></mrow><mrow><mn>2</mn><mo>+</mo><mi mathvariant=\"normal\">r</mi></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>3</mn><mi mathvariant=\"normal\">r</mi><mo>=</mo><mn>1</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">r</mi><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863892fcd9edc1d36b0", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "62", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A battery is charged at a potential of 15 V in 8 h when the current flowing is 10A. The battery on discharge supplies a current of 5A for 15 h. The mean terminal voltage during discharge is 14V. What is the watt-hour efficiency of the battery?", "image": null}, "options": [], "correctValue": "87.5", "solution": {"text": "The power of the battery, when charged is given by<br /><br /><math><msub><mrow><mi>P</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>I</mi></mrow><mrow><mn>1</mn></mrow></msub></math><br /><br />The electrical energy dissipated is given by<br /><br /><math><msub><mrow><mi>E</mi></mrow><mrow><mi>t</mi></mrow></msub><mo>=</mo><msub><mrow><mi>P</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub></math><br /><br /><math><msub><mrow><mi>E</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>I</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>15</mn><mo>×</mo><mn>10</mn><mo>×</mo><mn>8</mn></math><br /><br /><math><mo>=</mo><mn>1200</mn><mi>&nbsp;</mi><mi>W</mi><mi>h</mi></math><br /><br />Similarly, the electrical energy dissipated during the discharge of battery is given by<br /><br /><math><msub><mrow><mi>E</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><msub><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>I</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br /><math><mo>=</mo><mn>14</mn><mo>×</mo><mn>5</mn><mo>×</mo><mn>15</mn></math><br /><br /><math><mo>=</mo><mn>1050</mn><mi>&nbsp;</mi><mi>W</mi><mi>h</mi></math><br /><br />Hence, watt-hour efficiency of the battery is given by<br /><br /><math><mi>η</mi><mo>=</mo><mfrac><mrow><msub><mrow><mi>E</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>E</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>×</mo><mn>100</mn></math><br /><br /><math><mo>=</mo><mn>0.875</mn><mo>×</mo><mn>100</mn><mo>=</mo><mn>87.5</mn><mi>%</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86383ace42abdf2543b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "10", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>The potential difference between the points&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>&nbsp;in the given circuit is</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ee068cc3-3428-4445-bcfc-1b3ce98fb25d-9.jpg\" style=\"width: 210px; height: 87px;\" /></p>\r", "image": null}, "options": [{"id": "ZxAMD", "text": "<math> <mrow>  <mn>1</mn><mtext>&#x2009;</mtext><mtext>V</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "76wk8", "text": "<math> <mrow>  <mn>3</mn><mtext>&#x2009;</mtext><mtext>V</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "rPDAc", "text": "<math> <mrow>  <mn>6</mn><mtext>&#x2009;</mtext><mtext>V</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "8T4sa", "text": "<math> <mrow>  <mn>2</mn><mtext>&#x2009;</mtext><mtext>V</mtext></mrow></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mrow><mi>A</mi><mi>B</mi></mrow></msub><mo>=</mo><mfrac><mrow><mfrac><mn>1</mn><mn>1</mn></mfrac><mo>+</mo><mfrac><mn>2</mn><mn>1</mn></mfrac><mo>+</mo><mfrac><mn>3</mn><mn>1</mn></mfrac></mrow><mrow><mfrac><mn>1</mn><mn>1</mn></mfrac><mo>+</mo><mfrac><mn>1</mn><mn>1</mn></mfrac><mo>+</mo><mfrac><mn>1</mn><mn>1</mn></mfrac></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn><mo>+</mo><mn>2</mn><mo>+</mo><mn>3</mn></mrow><mn>3</mn></mfrac><mo>=</mo><mfrac><mn>6</mn><mn>3</mn></mfrac><mo>=</mo><mn>2</mn><mi>v</mi><mi>o</mi><mi>l</mi><mi>t</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863832ce2200d9aa2e1", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "13", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>Two batteries of emf&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>2</mn></msub></math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>E</mi><mn>2</mn></msub><mo>&gt;</mo><msub><mi>E</mi><mn>1</mn></msub></mrow></mfenced></math> and internal resistances&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>r</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>r</mi><mn>2</mn></msub></math> respectively are connected in parallel as shown in the figure.&nbsp;Then, which of the following statements is correct?</p>\r\r<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/3453661.png\" style=\"width: 300px; height: 189px;\" /></p>\r", "image": null}, "options": [{"id": "t9B72", "text": "The equivalent emf <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi></math> is smaller than&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>1</mn></msub></math>.", "image": null, "isCorrect": false}, {"id": "QGATD", "text": "The equivalent emf <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mo>=</mo><msub><mi>E</mi><mn>1</mn></msub><mo>+</mo><msub><mi>E</mi><mn>2</mn></msub></math>.", "image": null, "isCorrect": false}, {"id": "AOFsm", "text": "The equivalent emf <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi></math> is greater than <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>2</mn></msub></math>.", "image": null, "isCorrect": false}, {"id": "1Wn4E", "text": "The equivalent emf <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi></math> of two cells is between <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>2</mn></msub></math> always.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>The equivalent internal resistance of the two&nbsp;cells between <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&nbsp;is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mfrac><mrow><msub><mi>r</mi><mn>1</mn></msub><msub><mi>r</mi><mn>2</mn></msub></mrow><mrow><msub><mi>r</mi><mn>1</mn></msub><mo>+</mo><msub><mi>r</mi><mn>2</mn></msub></mrow></mfrac></math></p><p>If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi></math> is the equivalent emf of the two cells in parallel, then</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>E</mi><mi>R</mi></mfrac><mo>=</mo><mfrac><msub><mi>E</mi><mn>1</mn></msub><msub><mi>r</mi><mn>1</mn></msub></mfrac><mo>+</mo><mfrac><msub><mi>E</mi><mn>2</mn></msub><msub><mi>r</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><mrow><msub><mi>E</mi><mn>1</mn></msub><msub><mi>r</mi><mn>2</mn></msub><mo>+</mo><msub><mi>E</mi><mn>2</mn></msub><msub><mi>r</mi><mn>1</mn></msub></mrow><mrow><msub><mi>r</mi><mn>1</mn></msub><msub><mi>r</mi><mn>2</mn></msub></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>E</mi><mo>=</mo><mo>(</mo><mfrac><mrow><msub><mi>E</mi><mn>1</mn></msub><msub><mi>r</mi><mn>2</mn></msub><mo>+</mo><msub><mi>E</mi><mn>2</mn></msub><msub><mi>r</mi><mn>1</mn></msub></mrow><mrow><msub><mi>r</mi><mn>1</mn></msub><msub><mi>r</mi><mn>2</mn></msub></mrow></mfrac><mo>)</mo><mi>R</mi><mo>=</mo><mfrac><mrow><msub><mi>E</mi><mn>1</mn></msub><msub><mi>r</mi><mn>2</mn></msub><mo>+</mo><msub><mi>E</mi><mn>2</mn></msub><msub><mi>r</mi><mn>1</mn></msub></mrow><mfenced><mrow><msub><mi>r</mi><mn>1</mn></msub><mo>+</mo><msub><mi>r</mi><mn>2</mn></msub></mrow></mfenced></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>s</mi><mo>,</mo><mo>&#160;</mo><msub><mi>E</mi><mn>2</mn></msub><mo>&#62;</mo><msub><mi>E</mi><mn>1</mn></msub><mo>&#8658;</mo><msub><mi>E</mi><mn>1</mn></msub><mo>&#60;</mo><mi>E</mi><mo>&#60;</mo><msub><mi>E</mi><mn>2</mn></msub><mo>&#160;&#160;</mo><mo>[</mo></math>For all values of&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"\"><mrow><msub><mi>r</mi><mn>1</mn></msub><mtext>&#160;and&#160;</mtext><msub><mi>r</mi><mn>2</mn></msub></mrow></mfenced></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637b61288a599abfa2", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "16", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A potentiometer wire of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi>cm</mi></math> and resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>32</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math> is connected in series with a battery of EMF&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>, internal resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math> and external resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>. If a secondary cell of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> is balanced at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>&nbsp;</mo><mi>cm</mi></math> length. Then value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> is", "image": null}, "options": [{"id": "OTbqx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi></math>", "image": null, "isCorrect": false}, {"id": "E8GlK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>110</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi></math>", "image": null, "isCorrect": false}, {"id": "i76YC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>105</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi></math>", "image": null, "isCorrect": false}, {"id": "bFIH1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>115</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/nnn-123.JPG\" style=\"width: 300px; height: 294px;\" /><br /><br />Potential gradient of potentiometer<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>2.5</mn><mrow><mo>(</mo><mn>3</mn><mo>+</mo><mi>R</mi><mo>+</mo><mn>32</mn><mo>)</mo></mrow></mfrac><mo>×</mo><mfrac><mn>30</mn><mn>10</mn></mfrac></math><br />Balancing length for cell of emf <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>e</mi><mo>=</mo><mn>0.4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>&nbsp;</mo><mi>cm</mi></math>.<br /><math><mo>∴</mo><mfrac><mrow><mn>2.5</mn></mrow><mrow><mo>(</mo><mn>35</mn><mo>+</mo><mi>R</mi><mo>)</mo></mrow></mfrac><mo>×</mo><mn>3</mn><mo>×</mo><mn>8</mn><mo>=</mo><mn>0.4</mn></math><br /><math><mo>⇒</mo><mn>5</mn><mo>×</mo><mn>3</mn><mo>×</mo><mn>4</mn><mo>=</mo><mfrac><mrow><mn>0.04</mn><mo>×</mo><mo>(</mo><mn>35</mn><mo>+</mo><mi>R</mi><mo>)</mo></mrow><mrow><mn>10</mn></mrow></mfrac></math><br /><math><mo>⇒</mo><mn>15</mn><mo>×</mo><mn>10</mn><mo>=</mo><mn>35</mn><mo>+</mo><mi>R</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>R</mi><mo>=</mo><mn>115</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636af7c8a8602e10ca", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "107", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "When a battery of emf <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> with internal resistance <math><mn>0.5</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math> is charged by a <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>120</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">V</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi>DC</mi></math> supply using a series resistance of <math><mn>15.5</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math>, then what is the terminal voltage (in volt) of the battery?", "image": null}, "options": [], "correctValue": "11.5", "solution": {"text": "Here, emf of the battery <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>8</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math><br /><br />The internal resistance of the battery, <math><mi>r</mi><mo>=</mo><mn>0.5</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math><br /><br />The voltage of D. C supply = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>120</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math><br /><br />External resistance, <math><mi>R</mi><mo>=</mo><mn>15.5</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math><br /><br />When the battery of emf <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> is charged from a <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>DC</mi></math> supply of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>120</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>, the effective emf in the circular is<br /><br /><math><mi>ε</mi><mo>=</mo><mn>120</mn><mo>-</mo><mn>8</mn><mo>=</mo><mn>112</mn><mi>&nbsp;</mi><mi>V</mi></math><br /><br />The total resistance of the circuit <math><mo>=</mo><mi>R</mi><mo>+</mo><mi>r</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&nbsp;</mi><mi>&nbsp;</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>15.5</mn><mo>+</mo><mn>0.5</mn></mrow></mfenced><mi>&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi><mo>=</mo><mn>16</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi></math> Current in the circuit during charging<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mfrac><mi>ε</mi><mrow><mi>R</mi><mo>+</mo><mi>r</mi></mrow></mfrac><mo>=</mo><mfrac><mn>112</mn><mn>16</mn></mfrac><mo>=</mo><mn>7</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">A</mi></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi></math>&nbsp;The terminal voltage of the battery,<br /><br /><math><mi>V</mi><mo>=</mo><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">b</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">y</mi><mo>+</mo><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">b</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">y</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&nbsp;</mi><mo>=</mo><mn>8</mn><mo>+</mo><mi>I</mi><mi>r</mi><mo>=</mo><mn>8</mn><mo>+</mo><mn>7</mn><mfenced separators=\"|\"><mn>0.5</mn></mfenced><mo>=</mo><mn>11.</mn><mn>5</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">V</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86357f2dcf68c76965b", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "44", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A wire of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math> identical cells of negligible internal resistances are connected in series. Due to the current, the temperature of the wire is raised by <math> <mrow> <mo>Δ</mo> <mtext mathvariant=\"italic\">T</mtext> </mrow> </math>&nbsp;<math><mrow><mo></mo> </mrow> </math>in a time <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi></math>.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi></math>&nbsp;number&nbsp;of similar cells is now connected&nbsp; in series with a wire of the same material and cross-section but of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>L</mi></math>. The temperature of the wire is raised by the same amount&nbsp;<math> <mrow> <mo>Δ</mo> <mtext mathvariant=\"italic\">T</mtext> </mrow> </math> <math><mrow><mo></mo></mrow></math>in the same time. The value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi></math>&nbsp;is", "image": null}, "options": [], "correctValue": "6", "solution": {"text": "In the first case,&nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>3</mn> <mtext mathvariant=\"italic\">E</mtext> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> </mrow> <mrow> <mtext mathvariant=\"italic\">R</mtext> </mrow> </mfrac> <mi>t</mi> <mo>=</mo> <mtext mathvariant=\"italic\">m</mtext> <mtext mathvariant=\"italic\">s</mtext> <mo>Δ</mo> <mtext mathvariant=\"italic\">T </mtext></mrow></math>&nbsp;...(i)<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;<math> <mrow> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mtext mathvariant=\"italic\">H</mtext> <mo>=</mo> <mfrac> <mrow> <msup> <mtext mathvariant=\"italic\">V</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mtext mathvariant=\"italic\">R</mtext> </mrow> </mfrac> <mi>t</mi> </mrow> </mfenced> </mrow> </math><br /><br />When length of the wire is doubled, resistance and mass both are doubled.<br />Therefore, in the second case,&nbsp;&nbsp;&nbsp;&nbsp;<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;<math> <mrow> <mfrac> <mrow> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext mathvariant=\"italic\">N</mtext> <mtext mathvariant=\"italic\">E</mtext> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn> <mtext mathvariant=\"italic\">R</mtext> </mrow> </mfrac> <mo>·</mo> <mi>t</mi> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>2</mn> <mtext mathvariant=\"italic\">m</mtext> </mrow> </mfenced> <mtext mathvariant=\"italic\">s</mtext> <mo>Δ</mo> <mtext mathvariant=\"italic\">T</mtext></mrow></math>&nbsp; ...(ii)<br /><br />Dividing equation (ii) by (i), we get<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp; &nbsp; &nbsp;&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mtext mathvariant=\"italic\">N</mtext><mn>2</mn></msup><mtext>18</mtext></mfrac><mo>=</mo><mn>2</mn></math>&nbsp;or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>N</mi><mn>2</mn></msup><mo>=</mo><mn>36</mn></math>&nbsp;or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi><mo>=</mo><mn>6</mn></math>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86352bc7bd2714efd76", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "38", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A wire of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math> identical cells, of negligible internal resistance, are connected in series. Due to the current, the temperature of the wire is raised by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>Δ</mo><mi>T</mi></math> in a time <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi></math>. A number of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi></math> similar cells are now connected in series with a wire of the same material and area of cross-section but of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>L</mi></math>. The temperature of the wire is raised by the same amount <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>Δ</mo><mi>T</mi></math> in the same time.&nbsp;Find the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi></math>.</p>\r", "image": null}, "options": [], "correctValue": "6", "solution": {"text": "In the first case<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mfenced><mrow><mn>3</mn><mi>E</mi></mrow></mfenced><mn>2</mn></msup><mi>R</mi></mfrac><mi>t</mi><mo>=</mo><mi>m</mi><mi>s</mi><mo>&#916;</mo><mi>T</mi></math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;... (ii)<br /><br />&nbsp;When the length of the wire is doubled, resistance and mass both are doubled. Therefore, in the second case,<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mfenced><mrow><mi>N</mi><mi>E</mi></mrow></mfenced><mn>2</mn></msup><mrow><mn>2</mn><mi>R</mi></mrow></mfrac><mi>t</mi><mo>=</mo><mfenced><mrow><mn>2</mn><mi>m</mi></mrow></mfenced><mi>s</mi><mo>&#916;</mo><mi>T</mi></math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;... (ii)<br /><br />&nbsp;Dividing Eq.(ii) by (i) we get<br /><br />&nbsp; &nbsp; &nbsp; &nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>N</mi><mn>2</mn></msup><mn>18</mn></mfrac><mo>=</mo><mn>2</mn></math><br /><br />or &nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mtext mathvariant=\"italic\">N</mtext><mn>2</mn></msup><mo>=</mo><mn>36</mn></math><br /><br />or &nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi><mo>=</mo><mn>6</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86352936573d844164b", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "17", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>&nbsp;battery of internal resistance <math><mn>1</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math> is connected across a uniform wire <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math> of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&nbsp;</mo><mi>cm</mi></math>. The positive terminal of another battery of E.M.F <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> and internal resistance <math><mn>1</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math> is joined to the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> as shown. The distance of point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> is <math><mi>α</mi><mi>&nbsp;</mi><mo>×</mo><mn>10</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>. Find&nbsp;the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>α</mi></math>, for which there is no current through the galvanometer. (resistance of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math> wire is <math><mn>5</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math>)<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/D-17.png\" style=\"width: 200px; height: 159px;\" />", "image": null}, "options": [], "correctValue": "8", "solution": {"text": "<math><msub><mrow><mi>x</mi></mrow><mrow><mi>A</mi><mi>D</mi></mrow></msub><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mo>×</mo><mn>100</mn><mo>=</mo><mn>80</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi><mo>=</mo><mn>8</mn><mo>×</mo><mn>10</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86350844403748725ce", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "93", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A cell of emf E having&nbsp; an internal resistance 'r' is connected to an external resistance R. The potential difference 'V' across the resistance R varies with R as shown by the curve:<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0001440_Ques1_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 200px; height: 144px;\" />", "image": null}, "options": [{"id": "WvRQv", "text": "A", "image": null, "isCorrect": false}, {"id": "6Xare", "text": "B", "image": null, "isCorrect": true}, {"id": "jqCTO", "text": "C", "image": null, "isCorrect": false}, {"id": "EttGW", "text": "D", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <mtext>V</mtext> <mo>=</mo> <mtext>E</mtext> <mo>-</mo> <mtext>ir</mtext> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <mtext>Er</mtext> </mrow> <mrow> <mtext>R</mtext> <mo>+</mo> <mtext>r</mtext> </mrow> </mfrac> <mo>=</mo> <mtext>E</mtext> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>R</mtext> <mo>+</mo> <mtext>r</mtext> <mo>-</mo> <mtext>r</mtext> </mrow> <mrow> <mtext>R</mtext> <mo>+</mo> <mtext>r</mtext> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math><br /><br /><math> <mrow> <mtext>V</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>ER</mtext> </mrow> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>R</mtext> <mo>+</mo> <mtext>r</mtext> </mrow> </mfenced> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>&rArr;</mo> <mtext>&nbsp;&nbsp;V</mtext> <mo>=</mo> <mn>0</mn> <mtext>&nbsp;at&nbsp;</mtext> <mtext>R</mtext> <mo>=</mo> <mn>0</mn> </mrow> </math><br /><br /><math> <mrow> <mtext>V</mtext> <mo>=</mo> <mtext>E</mtext> <mtext>&nbsp;at&nbsp;</mtext> <mtext>R</mtext> <mo>=</mo> <mo>&infin;</mo> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634de6ad4943783be6", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "66", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An air-filled parallel plate capacitor has capacitance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math>. The capacitor is connected through a resistor to a voltage source providing a constant potential difference <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi></math><br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image34-bb612c78-285f-440f-9442-5b397256a6c7.jpg\" style=\"height: 120px; width: 220px;\" /><br />\r<br />\rA dielectric plate with a dielectric constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi></math> is inserted into the capacitor, filling it completely. After the equilibrium is established plate is quickly removed. Find the amount of heat generated in the resistor by the time, the equilibrium is re-established.", "image": null}, "options": [{"id": "ZNa5q", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><msup><mi>V</mi><mn>2</mn></msup><mi mathvariant=\"normal\">&#160;</mi><mfenced separators=\"|\"><mrow><mi>K</mi><mo>-</mo><mi mathvariant=\"normal\">&#160;</mi><mn>1</mn></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "bZawW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>C</mi><msup><mi>V</mi><mn>2</mn></msup><mi mathvariant=\"normal\">&nbsp;</mi><msup><mfenced separators=\"|\"><mrow><mi>K</mi><mo>-</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>1</mn></mrow></mfenced></msup></math>", "image": null, "isCorrect": true}, {"id": "3PGPu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><msup><mi>V</mi><mn>2</mn></msup><mi mathvariant=\"normal\">&#160;</mi><msup><mfenced separators=\"|\"><mrow><mi>K</mi><mo>-</mo><mi mathvariant=\"normal\">&#160;</mi><mn>1</mn></mrow></mfenced><mn>2</mn></msup></math>", "image": null, "isCorrect": false}, {"id": "UBlL8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>C</mi><msup><mi>V</mi><mn>2</mn></msup><mfenced separators=\"|\"><mrow><msup><mi>K</mi><mn>2</mn></msup><mo>-</mo><mi mathvariant=\"normal\">&#160;</mi><mn>1</mn></mrow></mfenced></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>After the insertion of the slab and steady-state is reached, the energy stored in the capacitor is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>U</mi><mi mathvariant=\"normal\">i</mi></msub><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>K</mi><mi>C</mi><msup><mi>V</mi><mn>2</mn></msup></math></p><p>After the removal of the lab and steady-state is reached, the energy stored in the capacitor is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>U</mi><mi mathvariant=\"normal\">f</mi></msub><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>C</mi><msup><mi>V</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">H</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">t</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>C</mi><msup><mfenced separators=\"|\"><mrow><mi>K</mi><mo>-</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>1</mn></mrow></mfenced></msup><msup><mi>V</mi><mn>2</mn></msup></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632423817d974176cc", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "86", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The emf of a cell is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> and internal resistance is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo></math><math><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">Ω</mi></math>. What will be the reading (in volt) of a voltmeter having an internal resistance of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>5</mn></math> <math><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">Ω?</mi></math>", "image": null}, "options": [], "correctValue": "5", "solution": {"text": "Total resistance<math><mo>=</mo><mn>2.5</mn><mo>+</mo><mn>0.5</mn><mo>=</mo><mn>3.0</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">Ω</mi><mo>=</mo><mn>3000</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math><br /><br /><math><mo>∴</mo></math> Current, <math><mi>i</mi><mo>=</mo><mfrac><mrow><mn>6</mn></mrow><mrow><mn>3000</mn></mrow></mfrac><mi mathvariant=\"normal\">&nbsp;A</mi></math>;<br /><br />Reading of voltmeter <math><mo>=</mo><mi>i</mi><mo>×</mo><mfenced separators=\"|\"><mrow><mn>2.5</mn><mo>×</mo><mn>1000</mn></mrow></mfenced></math><br /><br /><math><mo>=</mo><mfrac><mrow><mn>6</mn></mrow><mrow><mn>3000</mn></mrow></mfrac><mo>×</mo><mn>2500</mn><mo>=</mo><mn>5</mn><mi mathvariant=\"normal\">&nbsp;V</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86318890c143074146b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "102", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In an experiment to measure the internal resistance of a cell by potentiometer, it is found that the balance point is at a length of <math> <mrow> <mn>2</mn><mtext> </mtext><mtext>m</mtext></mrow> </math> when the cell is shunted by a <math><mn>4</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math> resistance and at <math> <mrow> <mn>3</mn><mtext> </mtext><mtext>m</mtext></mrow> </math> when cell is shunted by a <math><mn>8</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math> resistance. The internal resistance of cell is -", "image": null}, "options": [{"id": "EPuKM", "text": "<math><mn>12</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": false}, {"id": "W45JF", "text": "<math><mn>8</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": true}, {"id": "SNkOv", "text": "<math><mn>16</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": false}, {"id": "0pwsO", "text": "<math><mn>1</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image6-e5fa3fa8-b352-425a-ac21-8d70722f2 : "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86378065e09e719c297", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "106", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the following network, the potential at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi></math> is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/cjkbdjbfl.PNG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 250px; height: 190px;\" />", "image": null}, "options": [{"id": "gZY0V", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">V</mi></math>", "image": null, "isCorrect": false}, {"id": "nM40n", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3&#xA0;</mn><mi mathvariant=\"normal\">V</mi></math>", "image": null, "isCorrect": false}, {"id": "DMmJB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6&#xA0;</mn><mi mathvariant=\"normal\">V</mi></math>", "image": null, "isCorrect": false}, {"id": "hyVIF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4.8&#xA0;</mn><mi mathvariant=\"normal\">V</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/98ygbnml.PNG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 250px; height: 179px;\" /><br /><br />Let the potential at O is <math><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>.</mo></math><br /><br />Application of Kirchhoff&#39;s first law at junction O gives<br /><br /><math><mfrac><mrow><mn>8</mn><mo>-</mo
