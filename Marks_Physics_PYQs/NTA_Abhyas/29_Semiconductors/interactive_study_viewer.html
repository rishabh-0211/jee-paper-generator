ath/MathML\"><mn>500</mn><mo>&nbsp;</mo><mi>kΩ</mi></math> and the current gain <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>β</mi><mo>=</mo><mn>49</mn></math>. If the power gain of the amplifier is <math><msup><mrow><mn>5</mn><mo>×</mo><mn>10</mn></mrow><mrow><mn>6</mn></mrow></msup></math>, the input resistance is", "image": null}, "options": [{"id": "1o7ta", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>165</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>", "image": null, "isCorrect": false}, {"id": "FtRB9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>198</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>", "image": null, "isCorrect": false}, {"id": "Ib2vT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>225</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>", "image": null, "isCorrect": false}, {"id": "gF5o0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>240</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mi>o</mi></msub><mo>=</mo><mi>&#160;</mi><mn>500</mn><mo>&#160;</mo><mi>k&#937;</mi></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#946;</mi><mo mathvariant=\"italic\">&#160;</mo><mo>=</mo><mn>49</mn><mi>&#160;</mi></math>&nbsp;and <math><mi>P</mi></math> = <math><msup><mrow><mn>5</mn><mo>&#215;</mo><mn>10</mn></mrow><mrow><mn>6</mn></mrow></msup></math><br /><br />We have <math><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>P</mi><mo>=</mo><msup><mrow><mi mathvariant=\"normal\">&#946;</mi><mi>&#160;</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>&#160;</mi><mfrac><mrow><msub><mrow><mi>R</mi></mrow><mrow><mi>o</mi></mrow></msub></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mi>i</mi></mrow></msub></mrow></mfrac></math><br /><br />&nbsp; <math><mn>5</mn><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>6</mn></mrow></msup><mo>=</mo><mfrac><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mn>49</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>&#215;</mo><mn>500</mn><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>3</mn></mrow></msup></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mi>i</mi></mrow></msub></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mi>i</mi></msub><mo>=</mo><mfrac><mrow><mn>49</mn><mo>&#215;</mo><mn>49</mn><mo>&#215;</mo><mn>500</mn><mo>&#215;</mo><msup><mn>10</mn><mn>3</mn></msup></mrow><mrow><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mn>6</mn></msup></mrow></mfrac><mo>=</mo><mn>240</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863986892e6f2ab9a15", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "40", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A common emitter amplifier has a voltage gain of 50, an input impedance of 100 <math><mi mathvariant=\"normal\">Ω</mi></math> and an output impedance of 200 <math><mi mathvariant=\"normal\">Ω</mi><mo>.</mo></math> The power gain of the amplifier is", "image": null}, "options": [{"id": "amA3X", "text": "500", "image": null, "isCorrect": false}, {"id": "T8kvW", "text": "1000", "image": null, "isCorrect": false}, {"id": "4yyXJ", "text": "1250", "image": null, "isCorrect": true}, {"id": "XP3Bh", "text": "100", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"t rmal\">g</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi> </mi><mfenced separators=\"|\"><mrow><mo>=</mo><mfrac><mrow><msub><mrow><mi>R</mi></mrow><mrow><mi>o</mi></mrow></msub></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mi>i</mi></mrow></msub></mrow></mfrac></mrow></mfenced></math><br/><br/>Given, <math><msub><mrow><mi>A</mi></mrow><mrow><mi>V</mi></mrow></msub><mo>=</mo><mn>50</mn><mo>,</mo><mi> </mi><msub><mrow><mi>R</mi></mrow><mrow><mi>o</mi></mrow></msub><mo>=</mo><mn>200</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">Ω</mi><mo>,</mo><mi> </mi><msub><mrow><mi>R</mi></mrow><mrow><mi>i</mi></mrow></msub><mo>=</mo><mn>100</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">Ω</mi></math><br/><br/>Hence,   50 = <math><msub><mrow><mi mathvariant=\"normal\">β</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">C</mi></mrow></msub><mo>×</mo><mfrac><mrow><mn>200</mn></mrow><mrow><mn>100</mn></mrow></mfrac></math><br/><br/><math><mo>∴</mo></math> <math><msub><mrow><mi mathvariant=\"normal\">β</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">C</mi></mrow></msub><mo>=</mo><mn>25</mn></math><br/><br/>Now, AC power gain = <math><msub><mrow><mi>A</mi></mrow><mrow><mi>V</mi></mrow></msub><mo>×</mo><msub><mrow><mi mathvariant=\"normal\">β</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">C</mi></mrow></msub></math> = 50 <math><mo>×</mo></math> 25 = 1250", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86397ca019e67b27e43", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "90", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "i "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">V</mi><mrow><mi>B</mi><mi>B</mi></mrow></msub></math> can vary between <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">V</mi></math>. Find the minimum value of base current and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">V</mi><mrow><mi mathvariant=\"italic\">B</mi><mi mathvariant=\"italic\">B</mi></mrow></msub></math>, so that transistor works in saturation mode. [Given <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>β</mi><mo>=</mo><mn>200</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">V</mi><mi>BE</mi></msub><mo>=</mo><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>]<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/0398337_que.JPG\" style=\"width: 250px; height: 129px;\" />", "image": null}, "options": [{"id": "Z8uCj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mi mathvariant=\"normal\">&#xA0;</mi><mi>&#x3BC;A</mi><mo>,</mo><mn>&#xA0;2.8</mn><mi mathvariant=\"normal\">&#xA0;</mi><mi mathvariant=\"normal\">V</mi></math>", "image": null, "isCorrect": false}, {"id": "K3RCF", "text": "<math><mn>25</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi>μA</mi><mo>,</mo><mn>&nbsp;3.5</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">V</mi></math>", "image": null, "isCorrect": false}, {"id": "K5B23", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi>μA</mi><mo>,</mo><mn>&nbsp;3.5</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">V</mi></math>", "image": null, "isCorrect": true}, {"id": "SxMG8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>25</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi>μA</mi><mo>,</mo><mn>&nbsp;2.8</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">V</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When switched on,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mrow><mi>C</mi><mi>E</mi></mrow></msub><mo>=</mo><mn>0</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mrow><mi>C</mi><mi>C</mi></mrow></msub><mo>-</mo><msub><mi>R</mi><mi>C</mi></msub><mi>&nbsp;</mi><msub><mi>i</mi><mi>C</mi></msub><mo>=</mo><mn>0</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>i</mi><mi>c</mi></msub><mo>=</mo><mfrac><msub><mi>V</mi><mrow><mi>C</mi><mi>C</mi></mrow></msub><msub><mi>R</mi><mi>C</mi></msub></mfrac><mo>=</mo><mfrac><mn>5</mn><mrow><mn>1</mn><mo>×</mo><msup><mn>10</mn><mn>3</mn></msup></mrow></mfrac><mo>=</mo><mn>5</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>i</mi><mi>c</mi></msub><mo>=</mo><mi>β</mi><msub><mi>i</mi><mi>B</mi></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>i</mi><mi>B</mi></msub><mo>=</mo><mfrac><msub><mi>i</mi><mi>C</mi></msub><mi>β</mi></mfrac><mo>=</mo><mfrac><mrow><mn>5</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup></mrow><mn>200</mn></mfrac><mo>=</mo><mn>2</mn><mo>.5</mo><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi><mi>&nbsp;</mi><mo>=</mo><mtext>2.5</mtext><mi>&nbsp;</mi><mi>μA</mi></math><br /><br />Using KVL at input side,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mrow><mi>B</mi><mi>B</mi></mrow></msub><mo>-</mo><msub><mi>i</mi><mi>B</mi></msub><mi>&nbsp;</mi><msub><mi>R</mi><mi>B</mi></msub><mo>-</mo><msub><mi>V</mi><mrow><mi>B</mi><mi>E</mi></mrow></msub><mo>=</mo><mn>0</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mrow><mi>B</mi><mi>B</mi></mrow></msub><mo>=</mo><msub><mi>V</mi><mrow><mi>B</mi><mi>E</mi></mrow></msub><mo>+</mo><msub><mi>i</mi><mi>B</mi></msub><msub><mi>R</mi><mi>B</mi></msub></math><br /><br /><math><mo>=</mo><mn>1</mn><mo>+</mo><mn>100</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>3</mn></mrow></msup><mo>×</mo><mn>25</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup></math><br /><br /><math><mo>=</mo><mn>1</mn><mo>+</mo><mn>2.5</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>3.5</mn><mi mathvariant=\"bold-italic\">&nbsp;</mi><mi mathvariant=\"normal\">V</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638ad3632fc0faad91", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "33", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A working transistor with its three legs marked <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Q</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> is tested using a multimeter. No conduction is found between <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Q</mi></math>. By connecting the common (negative) terminal of the multimeter to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> and the other (positive) terminal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Q</mi></math>, some resistance is seen on the multimeter. Which of the following is true for the transistor?", "image": null}, "options": [{"id": "1w1IP", "text": "It is an n-p-n transistor with R as base", "image": null, "isCorrect": true}, {"id": "gkHE4", "text": "It is an p-n-p transistor with R as collector", "image": null, "isCorrect": false}, {"id": "bCB8o", "text": "It is an p-n-p transistor with R as emitter", "image": null, "isCorrect": false}, {"id": "Xk6Gp", "text": "It is an n-p-n transistor with R as collector", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<span style=\"display: none;\">&nbsp;</span>Since no conduction is found when the multimeter is connected across P and Q it means either both P and Q are n-type or p-type. So, it means R&nbsp;is base. When R&nbsp;is connected to the common terminal and conduction is seen when another terminal is connected to P and Q, so it means transistor is in n-p-n configuration with R&nbsp;as the base.<span style=\"display: none;\">&nbsp;</span>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638603d19ca25d098f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "18", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "For a transistor, the current amplification factor <math> <mrow> <mi>α</mi> </mrow> </math>&nbsp;is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>8</mn></math>. If it is connected in common emitter configuration, the change in collector current when the base current changes by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&nbsp;</mo><mi>mA</mi></math> is", "image": null}, "options": [{"id": "SMLYS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&nbsp;</mo><mi>mA</mi></math>", "image": null, "isCorrect": false}, {"id": "PDOQ2", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>.</mo><mn>8</mn><mo>&#160;</mo><mi>mA</mi></math>", "image": null, "isCorrect": false}, {"id": "W3BDS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>24</mn><mo>&nbsp;</mo><mi>mA</mi></math>", "image": null, "isCorrect": true}, {"id": "a2iou", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>&nbsp;</mo><mi>mA</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>I</mi><mi>c</mi></msub><mo>=</mo><mfenced separators=\"|\"><mfrac><mi>&#945;</mi><mrow><mn>1</mn><mo>-</mo><mi>&#945;</mi></mrow></mfrac></mfenced><msub><mi>I</mi><mi>b</mi></msub><mo>=</mo><mfrac><mn>0.8</mn><mn>0.2</mn></mfrac><msub><mi>I</mi><mi>b</mi></msub><mo>=</mo><mn>4</mn><msub><mi>I</mi><mi>b</mi></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>I</mi><mi>c</mi></msub><mo>=</mo></math>collector current<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>I</mi><mi>b</mi></msub><mo>=</mo></math>base current<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>I</mi><mi>c</mi></msub><mo>=</mo><mn>24</mn><mo>&#160;</mo><mi>mA</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863815ef268f6d785e8", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "42", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the circuit of <math><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">E</mi><mi mathvariant=\"normal\"></mi></math> amplifier, a silicon transistor is used. The value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">V</mtext><mtext>CC</mtext></msub><mo>=</mo><mo>+</mo><mn>20</mn><mo>&nbsp;</mo><mtext>V</mtext><mo>,</mo><msub><mtext mathvariant=\"italic\">R</mtext><mtext>L</mtext></msub><mo>=</mo><mn>3</mn><mo>&nbsp;</mo><mtext>k</mtext><mi mathvariant=\"normal\">Ω</mi></math> , collector voltage <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>5</mn><mo>&nbsp;</mo><mtext>V</mtext><mo>,</mo><mi>β</mi><mo>=</mo><mn>100</mn><mo>.</mo></math> Then the base resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mi mathvariant=\"normal\">B</mi></msub></math> should be ------ <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>×</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math> (Take input voltage drop across Si transistor <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>0.7</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> )<br />\n<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/c8496ecb-d2d7-4fde-8dc3-1e8ec607595e.png\" style=\"width:1.92708in;height:1.86042in\" />", "image": null}, "options": [], "correctValue": "3.86", "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mrow><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">C</mi></mrow></msub><mo>=</mo><msub><mi>V</mi><mi mathvariant=\"normal\">C</mi></msub><mo>+</mo><msub><mi>I</mi><mi mathvariant=\"normal\">C</mi></msub><msub><mi>R</mi><mi mathvariant=\"normal\">L</mi></msub></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mn>20</mn><mo>=</mo><mn>5</mn><mo>+</mo><mn>3</mn><mo>&#215;</mo><msup><mn>10</mn><mn>3</mn></msup><msub><mtext mathvariant=\"italic\">I</mtext><mtext>C</mtext></msub></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><msub><mtext mathvariant=\"italic\">I</mtext><mtext>C</mtext></msub><mo>=</mo><mfrac><mn>15</mn><mrow><mn>3</mn><mo>&#215;</mo><msup><mn>10</mn><mn>3</mn></msup></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>&#160;</mo><mtext>A</mtext><mo>=</mo><mn>5</mn><mo>&#160;</mo><mtext>mA</mtext></math> ,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#946;</mi><mo>=</mo><mfrac><msub><mtext mathvariant=\"italic\">I</mtext><mtext mathvariant=\"italic\">C</mtext></msub><msub><mtext mathvariant=\"italic\">I</mtext><mtext>B</mtext></msub></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><msub><mtext mathvariant=\"italic\">I</mtext><mtext>B</mtext></msub><mo>=</mo><mfrac><msub><mtext mathvariant=\"italic\">I</mtext><mtext>C</mtext></msub><mi>&#946;</mi></mfrac><mo>=</mo><mfrac><mrow><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup></mrow><mn>100</mn></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>&#160;</mo><mtext>A</mtext></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mrow><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">C</mi></mrow></msub><mo>=</mo><msub><mi>I</mi><mi mathvariant=\"normal\">B</mi></msub><msub><mi>R</mi><mi mathvariant=\"normal\">B</mi></msub><mo>+</mo><mi mathvariant=\"normal\">P</mi><mo>.</mo><mi mathvariant=\"normal\">D</mi><mo>.</mo></math> across input junction<br />As silicon transistor is in forward bias, the <math><mtext>P</mtext><mo>.</mo><mtext>D</mtext><mo>.</mo></math> across input junction is <math><mn>0</mn><mo>.</mo><mtext>7</mtext></math> volt.<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mn>20</mn><mo>=</mo><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><msub><mtext mathvariant=\"italic\">R</mtext><mtext>B</mtext></msub><mo>+</mo><mn>0.7</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><msub><mtext mathvariant=\"italic\">R</mtext><mtext>B</mtext></msub><mo>=</mo><mfrac><mn>19.3</mn><mrow><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><msub><mtext mathvariant=\"italic\">R</mtext><mtext>B</mtext></msub><mo>=</mo><mn>3.86</mn><mo>&#215;</mo><msup><mn>10</mn><mn>5</mn></msup><mi mathvariant=\"normal\">&#937;</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863777d945a8c24e277", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "21", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In a transistor, the collector current varies by <math><mn>0.49</mn><mn>&nbsp;m</mn><mn>A</mn></math> and emitter current varies by <math><mn>0.50</mn><mn>&nbsp;A</mn></math> . Current gain <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">β</mi></math> measured is", "image": null}, "options": [{"id": "yoyCb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>49</mn></math>", "image": null, "isCorrect": true}, {"id": "uYqO0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>150</mn></math>", "image": null, "isCorrect": false}, {"id": "RQkJb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>99</mn></math>", "image": null, "isCorrect": false}, {"id": "2CTdJ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>ΔI</mi><mi mathvariant=\"normal\">C</mi></msub><mo>=</mo><mn>0</mn><mo>.49&nbsp;</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mn>A</mn><mo>=</mo><mn>0</mn><mo>.49</mo><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn><mo>&nbsp;</mo></mrow></msup><mo>A</mo></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>ΔI</mi><mi mathvariant=\"normal\">E</mi></msub><mo>=</mo><mn>0</mn><mo>.50&nbsp;</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mn>A</mn><mo>=</mo><mn>0</mn><mo>.50</mo><mo>×</mo><msup><mn>10</mn><mrow><mn>3</mn><mo>&nbsp;</mo></mrow></msup><mo>A</mo></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">α</mi><mo>=</mo><mfrac><msub><mi>ΔI</mi><mi mathvariant=\"normal\">C</mi></msub><msub><mi>ΔI</mi><mi mathvariant=\"normal\">E</mi></msub></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">β</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">α</mi><mrow><mn>1</mn><mo>-</mo><mi mathvariant=\"normal\">α</mi></mrow></mfrac><mo>=</mo><mfrac><mfrac><mrow><mn>0</mn><mo>.49</mo></mrow><mrow><mn>0</mn><mo>.50</mo></mrow></mfrac><mrow><mn>1</mn><mo>-</mo><mfrac><mrow><mn>0</mn><mo>.49</mo></mrow><mrow><mn>0</mn><mo>.50</mo></mrow></mfrac></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>49</mn><mrow><mn>50</mn><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mfrac><mn>49</mn><mn>50</mn></mfrac></mrow></mfenced></mrow></mfrac></math><br /><br /><math><mo>=</mo><mfrac><mrow><mn>49</mn><mo>×</mo><mn>50</mn></mrow><mrow><mn>50</mn><mfenced separators=\"|\"><mrow><mn>50</mn><mo>-</mo><mn>49</mn></mrow></mfenced></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">β</mi><mo>=</mo><mn>49</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637356e8400b0ccc98", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "13", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>In the circuit shown in figure, the base current&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>I</mi><mi mathvariant=\"normal\">B</mi></msub></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#160;</mo><mi>&#956;A</mi></math>&nbsp;and the collector current is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>.</mo><mn>2</mn><mo>&#160;</mo><mi>mA</mi></math>. The voltage (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mi>BE</mi></msub></math>) across the base and emitter is</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/629492_CA__daque.png\" style=\"width: 250px; height: 134px;\" /></p>\r", "image": null}, "options": [{"id": "XRcUx", "text": "<math xmlns=\"http h> is applied, find the power gain.", "image": null}, "options": [{"id": "5Pke3", "text": "<math> <mrow> <mn>9000</mn></mrow> </math>", "image": null, "isCorrect": true}, {"id": "UYTqV", "text": "<math> <mrow>  <mn>4000</mn></mrow></math>", "image": null, "isCorrect": false}, {"id": "BjZIG", "text": "<math> <mrow>  <mn>6000</mn></mrow></math>", "image": null, "isCorrect": false}, {"id": "aP2Wf", "text": "<math> <mrow>  <mn>8000</mn></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Power gain <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><msup><mi>β</mi><mn>2</mn></msup><msub><mtext mathvariant=\"italic\">R</mtext><mtext>L</mtext></msub></mrow><msub><mtext mathvariant=\"italic\">R</mtext><mtext>BE</mtext></msub></mfrac></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>6</mn> <mn>0</mn> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>8</mn> <mn>0</mn> <mn>0</mn> <mn>0</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>=</mo> <mn>9</mn> <mn>0</mn> <mn>0</mn> <mn>0</mn> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86315c70078a1de3b30", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "69", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A transistor oscillator is<br />\r(i) An amplifier with positive feedback<br />\r(ii) An amplifier with reduced gain<br />\r(iii) The one in which DC supply energy is converted into AC output energy. Then</p>\r", "image": null}, "options": [{"id": "07kSg", "text": "All (i), (ii) and (iii) are correct", "image": null, "isCorrect": false}, {"id": "Z6qyH", "text": "(i) and (ii) are correct", "image": null, "isCorrect": false}, {"id": "qCTQp", "text": "(i) and (iii) are correct", "image": null, "isCorrect": true}, {"id": "fBDWF", "text": "(ii) and (iii) are correct", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A transistor oscillator is an amplifier with positive feedback.<br /><br />A transistor oscillator is the one in which DC supply energy is converted into AC output energy.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630a88ef54509d060c", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "81", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A working transistor with its three legs marked P, Q and R is tested using a multimeter. No conduction is found between P and Q. By connecting the common (negative) terminal of the multimeter to R and the other (positive) terminal to P or Q, some resistance is seen on the multimeter. Which of the following is true for the transistor?", "image": null}, "options": [{"id": "MmwNE", "text": "It is an n-p-n transistor with R as base", "image": null, "isCorrect": true}, {"id": "MYkIc", "text": "It is an p-n-p transistor with R as collector", "image": null, "isCorrect": false}, {"id": "W8PnE", "text": "It is an p-n-p transistor with R as emitter", "image": null, "isCorrect": false}, {"id": "JoZWg", "text": "It is an n-p-n transistor with R as collector", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since no conduction is found when multimeter is connected across P and Q it means either both P and Q are <math><mi>n</mi></math>-type or <math><mi>p</mi></math>-type. So, it means <math><mi>R</mi></math> is base. When <math><mi>R</mi></math> is connected to common terminal and conduction is seen when other terminal is connected to P and Q, so it means transistor is in p-n with <math><mi>R</mi></math> as base.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630937898ab7c46a9f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "62", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The current gain <math><mi mathvariant=\"normal\">α</mi></math> of a transistor in common base mode is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>995</mn></math>. Its gain <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>β</mi></math> in the common-emitter mode is", "image": null}, "options": [{"id": "WaIk5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn></math>", "image": null, "isCorrect": false}, {"id": "iHRJl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>99</mn></math>", "image": null, "isCorrect": false}, {"id": "CATVT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>199</mn></math>", "image": null, "isCorrect": true}, {"id": "e1w6c", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The current gain <math><mi mathvariant=\"normal\">α</mi></math> of a transistor in common base mode is 0.995<br /><br /><math><mi mathvariant=\"normal\">β</mi></math> is current gain in the common emitter mode<br /><br /><math><mi mathvariant=\"normal\">β</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">α</mi></mrow><mrow><mn>1</mn><mo>-</mo><mi mathvariant=\"normal\">α</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>0.995</mn></mrow><mrow><mn>1</mn><mo>-</mo><mn>0.995</mn></mrow></mfrac><mo>=</mo><mn>199</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863008be43f10800731", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "44", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the following circuit, a voltmeter <math> <mi>V</mi> </math> is connected across a lamp <math> <mi>L</mi> </math> . What change would occur in voltmeter reading if the resistance <math> <mi>R</mi> </math> is reduced<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image10-14c793df-8936-4bfa-a30b-bddd47b5692e.jpg\" />", "image": null}, "options": [{"id": "Q5h5T", "text": "Increases", "image": null, "isCorrect": true}, {"id": "QtOON", "text": "Decreases", "image": null, "isCorrect": false}, {"id": "jfbQa", "text": "Remains same", "image": null, "isCorrect": false}, {"id": "lpP7D", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here, the emitter-base junction of the N-P-N transistor is forward biased with battery <math><msub><mrow><mi>V</mi></mrow><mrow><mi>B</mi><mi>B</mi></mrow></msub></math> through resistance <math> <mi>R</mi> </math> . When the value of <math> <mi>R</mi> </math> is reduced, then the base current <math><msub><mrow><mi>i</mi></mrow><mrow><mi>b</mi></mrow></msub></math> will increase. As a result, the collector current will also increase. <math> <mrow> <mo stretchy=\"false\">(</mo><msub> <mi>i</mi> <mi>c</mi> </msub> <mo>=</mo><mi>β</mi><msub> <mi>i</mi> <mi>b</mi> </msub> <mo stretchy=\"false\">)</mo></mrow></math>. Due to the increase in <math><msub><mrow><mi>i</mi></mrow><mrow><mi>c</mi></mrow></msub></math>, the potential difference across <math> <mi>L</mi> </math> increases and hence the reading of voltmeter will increase.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "6aa3ab79aa8dc1ff681780a4", "title": "Logic Gates", "totalQuestions": 6, "questions": [{"_id": "6151e863ee5792aef20669be", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "19", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The output <math><mi>Y</mi></math> of the logic circuit shown in figure is best represented as<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/191148-1.JPG\" style=\"width: 300px; height: 100px;\" />", "image": null}, "options": [{"id": "2aA7S", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><menclose notation=\"top\"><mi mathvariant=\"normal\">A</mi></menclose><mo>+</mo><menclose notation=\"top\"><mi mathvariant=\"normal\">B</mi></menclose><mo>.</mo><menclose notation=\"top\"><mi mathvariant=\"normal\">C</mi></menclose></math>", "image": null, "isCorrect":     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
