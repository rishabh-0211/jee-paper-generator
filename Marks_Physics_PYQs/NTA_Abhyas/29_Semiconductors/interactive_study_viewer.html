 173px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div><div id=\"gtx-trans\" style=\"position: absolute; left: 173px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0032997_ANs.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 300px; height: 184px;\" /><br /><br /><strong>i)</strong> In this case of current will flow from B top A. No current will flow through branch C, E (as marked in figure)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;&#160;&#160;&#160;</mo><msub><mi>R</mi><mtext>eq</mtext></msub><mo>=</mo><mfrac><mi>R</mi><mn>4</mn></mfrac><mo>+</mo><mi>R</mi><mo>+</mo><mfrac><mi>R</mi><mn>4</mn></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn><mi>R</mi></mrow><mn>2</mn></mfrac></math><br /><br /><strong>ii)</strong> Here current will flow from A to B so no current will flow in branch D<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;&#160;&#160;&#160;</mo><msub><mi>R</mi><mtext>eq</mtext></msub><mo>=</mo><mfrac><mi>R</mi><mn>4</mn></mfrac><mo>+</mo><mfrac><mi>R</mi><mn>2</mn></mfrac><mo>+</mo><mfrac><mi>R</mi><mn>4</mn></mfrac><mo>=</mo><mi>R</mi></math><br /><br /><strong>iii)</strong> Here also current will flow from A to B, so <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mtext>eq</mtext></msub><mo>=</mo><mi>R</mi></math>&nbsp;same as (ii)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;&#160;&#160;&#160;</mo><msub><mi>R</mi><mtext>ii</mtext></msub><mo>=</mo><msub><mi>R</mi><mtext>iii&#160;</mtext></msub><msub><mtext>&#60;&#160;R</mtext><mtext>i</mtext></msub></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d479b1a39ef0a4fa", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "37", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In a reverse-biased diode, when the applied voltage changes by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>, the current is found to change by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0.5</mn><mo>&nbsp;</mo><mi>μA</mi></math>. The reverse bias resistance of the diode is", "image": null}, "options": [{"id": "DM8ZD", "text": "<math><mn>2</mn><msup><mrow><mo>×</mo><mn>10</mn></mrow><mrow><mn>5</mn></mrow></msup><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": false}, {"id": "Cd3f9", "text": "<math><mn>2</mn><msup><mrow><mo>×</mo><mn>10</mn></mrow><mrow><mn>6</mn></mrow></msup><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": true}, {"id": "Nvc2L", "text": "<math><mi mathvariant=\"normal\">200&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": false}, {"id": "d29tq", "text": "<math><mi mathvariant=\"normal\">2 Ω</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Reverse resistance =<math><mi> </mi><mfrac><mrow><mo>∆</mo><mi>V</mi></mrow><mrow><mo>∆</mo><mi>I</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mn>0.5</mn><mo>×</mo><mn>10</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup></mrow></mfrac><mo>=</mo><mn>2</mn><msup><mrow><mo>×</mo><mn>10</mn></mrow><mrow><mn>6</mn></mrow></msup><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d1ddb8cbb8575f69", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "101", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The amplification factor of a triode is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>.</mo></math> If the grid potential is decreased by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.20</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>, what increase, in plate potential will keep the plate current unchanged?", "image": null}, "options": [{"id": "SOta8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 60px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "4WLOP", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 60px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "ZHR6M", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0.2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 60px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "84eNw", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 60px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi>&#956;</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">&#916;</mi><msub><mrow><mi>V</mi></mrow><mrow><mi>p</mi></mrow></msub></mrow><mrow><mi mathvariant=\"normal\">&#916;</mi><msub><mrow><mi>V</mi></mrow><mrow><mi>g</mi></mrow></msub></mrow></mfrac></math><br /><br /><math><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi mathvariant=\"normal\">&#916;</mi><msub><mrow><mi>V</mi></mrow><mrow><mi>p</mi></mrow></msub><mo>=</mo><mi>&#160;</mi><mo>-</mo><mi>&#956;</mi><mo>&#215;</mo><mi mathvariant=\"normal\">&#916;</mi><msub><mrow><mi>V</mi></mrow><mrow><mi>s</mi></mrow></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mn>50</mn><mfenced separators=\"|\"><mrow><mo>-</mo><mn>20</mn></mrow></mfenced><mo>=</mo><mn>10</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">V</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d0b12766ba67f7ef", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "82", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two identical capacitors&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&nbsp;of capacitance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math>&nbsp;each,&nbsp;are charged to the same potential&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi></math> and are connected in two circuits at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>0</mn></math>, as shown in the figure <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">i</mi></mfenced></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>ii</mi></mfenced></math>&nbsp;respectively. The charge on the capacitors at time<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mi>t</mi><mo>=</mo><mi>C</mi><mi>R</mi></math> are respectively<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image6-0bfe2523-acb2-4c36-b44b-a7f6a447c810.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 250px; height: 106px;\" />", "image": null}, "options": [{"id": "8GzC9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi><mi>C</mi><mo mathvariant=\"italic\">,</mo><mi>&#160;</mi><mi>V</mi><mi>C</mi></math>", "image": null, "isCorrect": false}, {"id": "BRkPX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi mathvariant=\"italic\">V</mi><mi mathvariant=\"italic\">C</mi></mrow><mi mathvariant=\"italic\">e</mi></mfrac><mo mathvariant=\"italic\">,</mo><mi>&#160;</mi><mi>V</mi><mi>C</mi></math>", "image": null, "isCorrect": true}, {"id": "uyKHL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi><mi>C</mi><mo mathvariant=\"italic\">,</mo><mfrac><mrow><mi mathvariant=\"italic\">V</mi><mi mathvariant=\"italic\">C</mi></mrow><mi mathvariant=\"italic\">e</mi></mfrac></math>", "image": null, "isCorrect": false}, {"id": "sX9mO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi mathvariant=\"italic\">V</mi><mi mathvariant=\"italic\">C</mi></mrow><mi mathvariant=\"italic\">e</mi></mfrac><mo mathvariant=\"italic\">,</mo><mfrac><mrow><mi mathvariant=\"italic\">V</mi><mi mathvariant=\"italic\">C</mi></mrow><mi mathvariant=\"italic\">e</mi></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Time <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mi>C</mi><mi>R</mi></math> is known as time constant. It is time in which charge on the capacitor decreases to <math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>e</mn></mrow></mfrac></math> times of its initial charge (steady-state charge).<br /><br />In figure (i) PN junction diode is in forward bias, so current will flow in the circuit i.e., charge on the capacitor decrease and in time t it becomes <math><mi mathvariant=\"normal\">Q</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">e</mi></mrow></mfrac><mfenced separators=\"|\"><mrow><msub><mrow><mi mathvariant=\"normal\">Q</mi></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msub></mrow></mfenced></math> ; where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">Q</mi><mn>0</mn></msub><mo>=</mo><mi>C</mi><mi>V</mi><mo>&#8658;</mo><mi mathvariant=\"normal\">Q</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"italic\">C</mi><mi mathvariant=\"italic\">V</mi></mrow><mi mathvariant=\"italic\">e</mi></mfrac></math><br /><br />In figure (ii) P-N junction diode is in reverse bias, so no current will flow through the circuit hence change on the capacitor will not decay and it remains same i.e. CV after time t.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b3aa07e3e9a86982", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "09", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>&nbsp;In&nbsp;the figure, the reverse breakdown voltage of a Zener diode is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5.</mn><mn>6</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></math>, then the current <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>I</mi><mi mathvariant=\"normal\">z</mi></msub></math> through the diode is</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Question_16.jpg\" style=\"width: 280px; height: 147px;\" /></p>\r", "image": null}, "options": [{"id": "mvq1F", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>17</mn><mo>&#xA0;</mo><mi>mA</mi></math>", "image": null, "isCorrect": false}, {"id": "UBXYs", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>&#xA0;</mo><mi>mA</mi></math>", "image": null, "isCorrect": false}, {"id": "aN7Ns", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#xA0;</mo><mi>mA</mi></math>", "image": null, "isCorrect": true}, {"id": "wBtQQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>&#xA0;</mo><mi>mA</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Question_15.jpg\" style=\"width: 327px; height: 145px;\" /><br />For zener break down potential difference across <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>800</mn><mi>Ω</mi></math> resistor will be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>.</mo><mn>6</mn><mi mathvariant=\"normal\">V</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">V</mi><mi mathvariant=\"normal\">z</mi></msub><mo>=</mo><mn>5</mn><mo>.</mo><mn>6</mn><mi mathvariant=\"normal\">V</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">i</mi><mn>2</mn></msub><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">V</mi><mn>2</mn></msub><mn>800</mn></mfrac><mo>=</mo><mfrac><mrow><mn>5</mn><mo>.</mo><mn>6</mn></mrow><mn>800</mn></mfrac><mo>=</mo><mn>7</mn><mi>mA</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ΔV</mi></math> across <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mi>Ω</mi><mo>=</mo><mn>9</mn><mo>-</mo><mn>5</mn><mo>.</mo><mn>6</mn><mo>=</mo><mn>3</mn><mo>.</mo><mn>4</mn><mi mathvariant=\"normal\">V</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>i</mi><mn>1</mn></msub><mo>=</mo><mfrac><mrow><mn>3</mn><mo>.</mo><mn>4</mn></mrow><mn>200</mn></mfrac><mo>=</mo><mn>17</mn><mi>mA</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">i</mi><mn>1</mn></msub><mo>=</mo><msub><mi mathvariant=\"normal\">i</mi><mn>2</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">z</mi></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">i</mi><mi>z</mi></msub><mo>=</mo><mn>17</mn><mi>mA</mi><mo>-</mo><mn>7</mn><mi>mA</mi><mo>=</mo><mn>10</mn><mi>mA</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b1e5450fb129297f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "17", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The zener diode normally operates under reverse bias condition, the major use of this fact is in the applications where we require", "image": null}, "options": [{"id": "sjjq2", "text": "large volume of current", "image": null, "isCorrect": false}, {"id": "GyF2D", "text": "a constant voltage", "image": null, "isCorrect": true}, {"id": "PeFp8", "text": "a current that is increasing without any change in applied voltage", "image": null, "isCorrect": false}, {"id": "uYPho", "text": "all of the above", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In reverse bias, once Zener diode attains the breakdown voltage, there is no change in voltage across the diode even if we change the current in the circuit by changing the position of rheostat and that's why the voltage across Zener diode is constant<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/D-14.png\" style=\"width: 230px; height: 93px;\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b01c3ca6d382770e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "53", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Zener diodes have higher dopant densities as compared to ordinary <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">p</mi><mo>-</mo><mi mathvariant=\"normal\">n</mi></math> junction diodes. This", "image": null}, "options": [{"id": "x3pr1", "text": "decreases the width of depletion layer as well as electric field", "image": null, "isCorrect": false}, {"id": "n2JgY", "text": "increases the width of depletion layer as well as electric&nbsp;field", "image": null, "isCorrect": false}, {"id": "Jlg0W", "text": "decreases the width of depletion layer but increases the electric field", "image": null, "isCorrect": true}, {"id": "zw66h", "text": "increases the width of depletion layer but decreases the electric field", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Due to high doping, electric field in the depletion layer increases.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ac1a731de42c242a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "65", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A Zener diode of Zener break-down voltage&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> &nbsp;is connected as shown in the figure. Current through Zener diode is<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/khbofayxmjuolxnomqwyqjdebcsnygvjsswmhdmzdlvzzqhfla.png\" style=\"height: 130px; width: 250px;\" />", "image": null}, "options": [{"id": "MmNFb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#160;</mo><mi>mA</mi></math>", "image": null, "isCorrect": false}, {"id": "TyW4D", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.6&nbsp;</mo><mi>mA</mi></math>", "image": null, "isCorrect": false}, {"id": "cqD9S", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mi mathvariant=\"normal\">&#160;</mi><mi>mA</mi></math>", "image": null, "isCorrect": false}, {"id": "9IHov", "text": "Zero", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ijsbqqrqglbekvpvuxiodmlzkgthhxwxsllljbtqrykjzuujer.png\" /><br /><br />If we consider break down in Zener diode, then potential across [{"title": "NTA Abhyas Paper", "value": "71", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "When <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>p</mtext><mo>-</mo><mtext>n</mtext></math> junction diode is forward biased, then", "image": null}, "options": [{"id": "ZbeV9", "text": "the depletion region is reduced and barrier height is increased", "image": null, "isCorrect": false}, {"id": "8yj7w", "text": "the depletion region is widened and barrier height is reduced", "image": null, "isCorrect": false}, {"id": "j9uRh", "text": "both the depletion region and barrier height are reduced", "image": null, "isCorrect": true}, {"id": "zvrbv", "text": "both the depletion region and barrier height are increased", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>p</mtext><mo>-</mo><mtext>n</mtext></math> junction diode is forward biased, both the depletion region and barrier height are reduced.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86377f70b76714219b6", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "32", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In a p-n&nbsp;junction diode not connected to any circuit", "image": null}, "options": [{"id": "Oz12h", "text": "the potential is the same everywhere", "image": null, "isCorrect": false}, {"id": "MEWBo", "text": "the p-type side is at a higher potential than the n-type side", "image": null, "isCorrect": false}, {"id": "YeLpG", "text": "there is an electric field at the junction directed from the n-side to the p-side", "image": null, "isCorrect": true}, {"id": "3sglR", "text": "there is an electric field at the junction directed from the p-type side to the n-type side", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "At the junction, a potential barrier/depletion layer is formed, with n-side at higher potential and p-side at lower potential. Therefore, there is an electric field at the junction directed from the n-side to the p-side.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86377911b37288226ab", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "39", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A Zener diode with a breakdown voltage of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></math>&nbsp;is connected in series with a&nbsp;resistance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;to a battery of emf <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></math>. The maximum power dissipation rating for the Zener diode is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">W</mi></math>. The value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;to ensure maximum power dissipation across the diode is", "image": null}, "options": [{"id": "RzqmJ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi></math>", "image": null, "isCorrect": false}, {"id": "bKPcu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>24</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi></math>", "image": null, "isCorrect": true}, {"id": "396r3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>36</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi></math>", "image": null, "isCorrect": false}, {"id": "LJfZC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM01355481.jpg\" style=\"width: 250px; height: 153px;\" /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">P</mtext><mtext mathvariant=\"italic\">zener</mtext></msub><mo>=</mo><mn>4</mn><mi>i</mi><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>i</mi><mo>=</mo><mfrac bevelled=\"true\"><mn>1</mn><mn>4</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>i</mi><mo>=</mo><mfrac><mn>6</mn><mi>R</mi></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>R</mi><mo>=</mo><mn>24</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863702697835a9b3522", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "78", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Which of the following statements is <strong>not</strong> true?", "image": null}, "options": [{"id": "5CYnE", "text": " The resistance of intrinsic semiconductors decreases with increase of temperature", "image": null, "isCorrect": false}, {"id": "IMqKt", "text": " Doping pure Si with trivalent impurities give p-type semiconductors", "image": null, "isCorrect": false}, {"id": "7gHK1", "text": " The majority carriers in n-type semiconductors are holes", "image": null, "isCorrect": true}, {"id": "z0FuC", "text": " A p-n junction can act as a semiconductor diode", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In n - type semiconductors, electrons are the majority charge carriers.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86367dc32fb5057eae4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "30", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The part of a circuit shown in the figure consists of two ideal diodes and a few resistors. The equivalent resistance of the circuit between <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> is<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/394739.JPG\" style=\"width: 260px; height: 122px;\" />", "image": null}, "options": [{"id": "wRT11", "text": "<math><mn>4</mn><mi> </mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": false}, {"id": "xX7AI", "text": "<math><mn>13</mn><mi> </mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": false}, {"id": "dkTJi", "text": "<math><mn>4</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math> or <math><mn>13</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": true}, {"id": "KvN57", "text": "<math><mn>4</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math> or zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">V</mi><mi mathvariant=\"normal\">A</mi></msub><mo>&#62;</mo><msub><mi mathvariant=\"normal\">V</mi><mi mathvariant=\"normal\">B</mi></msub></math>, both the junction diodes are forward biased and the given circuit diagram becomes a balanced Wheatstone bridge. The equivalent resistance, in this case, becomes <math><mn>4</mn><mi>&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math>.<br /><br />If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">V</mi><mi mathvariant=\"normal\">B</mi></msub><mo>&#62;</mo><msub><mi mathvariant=\"normal\">V</mi><mi mathvariant=\"normal\">A</mi></msub></math>, the diodes are reverse biased. In that case,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi>&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mi>&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math> and <math><mn>4</mn><mi>&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math> are in series.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863547adec8a9965eef", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "103", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A Zener diode is connected to a battery and a load as shown below: The currents I, I<sub>Z</sub> and I<sub>L</sub> are respectively<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Untitled11111lkddjs.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 280px; height: 128px;\" /></p>\r", "image": null}, "options": [{"id": "vTfDh", "text": "12.5 mA, 7.5 mA, 5 mA", "image": null, "isCorrect": true}, {"id": "dJbFz", "text": "15 mA, 7.5 mA, 7.5 mA", "image": null, "isCorrect": false}, {"id": "N0DOg", "text": "12.5 mA, 5 mA, 7.5 mA", "image": null, "isCorrect": false}, {"id": "Jlzho", "text": "15 mA, 5 mA, 10 mA", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Untitled11111lkddjs.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 280px; height: 128px;\" /><br /><br /><math> <mrow> <msub> <mtext>I</mtext> <mtext>L</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>V</mtext> <mtext>AB</mtext> </msub> </mrow> <mrow> <msub> <mtext>R</mtext> <mtext>L</mtext> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>0</mn> </mrow> <mrow> <mn>2</mn> <mn>0</mn> <mn>0</mn> <mn>0</mn> </mrow> </mfrac> <mo>=</mo> <mn>5</mn> <mtext>mA</mtext> </mrow> </math><br /><br /><math> <mrow> <msub> <mtext>I</mtext> &nbsp;</msub><mo>=</mo> <mfrac> <mrow> <mn>6</mn> <mn>0</mn> <mo>-</mo> <mn>1</mn> <mn>0</mn> </mrow> <mrow> <mn>4</mn> <mn>0</mn> <mn>0</mn> <mn>0</mn> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>5</mn> <mn>0</mn> </mrow> <mrow> <mn>4</mn> <mn>0</mn> <mn>0</mn> <mn>0</mn> </mrow> </mfrac> <mo>=</mo> <mn>1</mn> <mn>2</mn> <mo>·</mo> <mn>5</mn> <mtext>mA</mtext> </mrow> </math><br /><br /><math> <mrow> <mtext>I</mtext> <mo>=</mo> <msub> <mtext>I</mtext> <mtext>L</mtext> </msub> <mo>+</mo> <msub> <mtext>I</mtext> <mtext>Z</mtext> </msub> <mo>∴</mo> <msub> <mtext>I</mtext> <mtext>Z</mtext> </msub> <mo>=</mo> <mtext>I</mtext> <mo>-</mo> <msub> <mtext>I</mtext> <mtext>L</mtext> </msub> <mo>=</mo> <mn>7</mn> <mo>·</mo> <mn>5</mn> <mtext>mA</mtext> </mrow> </math><br /><br />Hence,&nbsp;12.5 mA, 7.5 mA, 5 mA", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86352be97850a86300a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "24", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> Zener diode shown in the figure has negligible resistance and a knee current of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&nbsp;</mo><mi>mA</mi></math>. The minimum value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">&nbsp;</mi><mfenced separators=\"|\"><mrow><mi>in</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></mrow></mfenced></math> so that the voltage across it does not fall below <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> is<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/338850-1.JPG\" style=\"width: 250px; height: 164px;\" />", "image": null}, "options": [{"id": "owCWM", "text": "<math><mn>40</mn></math>", "image": null, "isCorrect": false}, {"id": "kMG2b", "text": "<math><mn>60</mn></math>", "image": null, "isCorrect": false}, {"id": "ocN7n", "text": "<math><mn>72</mn></math>", "image": null, "isCorrect": false}, {"id": "RCUsu", "text": "<math><mn>80</mn></math>", "image": null, "isCorrect": true}, {"id": "20Igo", "text": "<math><mn>120</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>In Zener diode,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;&#160;</mo><mfrac><mrow><msub><mi mathvariant=\"normal\">V</mi><mi>max</mi></msub><mo>-</mo><msub><mi mathvariant=\"normal\">V</mi><mi mathvariant=\"normal\">Z</mi></msub></mrow><msub><mi mathvariant=\"normal\">R</mi><mn>1</mn></msub></mfrac><mo>&#8805;</mo><msub><mi mathvariant=\"normal\">I</mi><mi>knee</mi></msub><mo>+</mo><msub><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">R</mi></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">R</mi><mn>1</mn></msub></math>&nbsp;is the series resistance of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">R</mi></msub></math>&nbsp;is the current through the resistance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;&#160;</mo><mfrac><mrow><mn>10</mn><mo>-</mo><mn>6</mn></mrow><mn>50</mn></mfrac><mo>&#8805;</mo><mn>5</mn><mi mathvariant=\"normal\">m</mi><mo>+</mo><msub><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">R</mi></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">&#160;</mi><msub><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">R</mi></msub><mo>&#8804;</mo><mn>80</mn><mo>&#160;</mo><mi>mA</mi><mo>-</mo><mn>5</mn><mo>&#160;</mo><mi>mA</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8757;</mo><msub><mfenced><msub><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">R</mi></msub></mfenced><mi>max</mi></msub><mo>=</mo><mn>75</mn><mo>&#160;</mo><mi>mA</mi></math>&nbsp; &nbsp; &nbsp;(the maximum current through&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math>)</p><p>So the minimum value of the resistance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math>&nbsp;is<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">R</mi><mi>min</mi></msub><mo>=</mo><mfrac><mi mathvariant=\"normal\">V</mi><msub><mfenced><msub><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">R</mi></msub></mfenced><mi>max</mi></msub></mfrac><mo>=</mo><mfrac><mrow><mn>6</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>75</mn><mi mathvariant=\"normal\">&#160;</mi><mi>mA</mi></mrow></mfrac><mo>=</mo><mfrac><mn>6000</mn><mn>75</mn></mfrac><mo>=</mo><mn>80</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634ea549db8acee15a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "33", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A diode AM detector with the output circuit consisting of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi><mo>=</mo><mn>1</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi>kW</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi><mo>=</mo><mn>1</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi>μF</mi></math> would be more suitable for detecting a carrier signal of", "image": null}, "options": [{"id": "KYS7q", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>0.1</mtext><mo>&#xA0;</mo><mi>kHz</mi></math>", "image": null, "isCorrect": false}, {"id": "F8GO5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>0.5</mtext><mo>&#xA0;</mo><mi>kHz</mi></math>", "image": null, "isCorrect": false}, {"id": "tfHzD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>1</mtext><mo>&#xA0;</mo><mi>kHz</mi></math>", "image": null, "isCorrect": false}, {"id": "Tyo8q", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>10</mtext><mo>&nbsp;</mo><mi>kHz</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi><mo>=</mo><mn>1</mn><mi mathvariant=\"normal\">&#160;</mi><mi>k&#937;</mi></math>&nbsp;or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi><mo>=</mo><mn>1</mn><mo>&#215;</mo><msup><mn>10</mn><mn>3</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi><mo>=</mo><mn>1</mn><mo>&#160;</mo><mi>&#956;F</mi></math>&nbsp;or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi><mo>=</mo><mn>1</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">F</mi></math>.<br /><br />In this condition, frequency of carrier signal,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>RC</mi></mfrac><mo>&#60;</mo><mo>&#60;</mo><msub><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">c</mi></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mrow><mn>1</mn><mo>&#215;</mo><msup><mn>10</mn><mn>3</mn></msup><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup></mrow></mfrac><mo>&#60;</mo><mo>&#60;</mo><msub><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">c</mi></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><msub><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">c</mi></msub><mo>&#62;</mo><mo>&#62;</mo><mn>1</mn><mi mathvariant=\"normal\">&#160;</mi><mi>kHz</mi></math><br /><br />Since, frequency must be greater than <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi>kHz</mi></math>&nbsp;the possible answer will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">c</mi></msub><mo>=</mo><mn>10</mn><mi mathvariant=\"normal\">&#160;</mi><mi>kHz</mi></math>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634dcac4ada297080d", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "19", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The forward-bias voltage of a diode is changed from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>6</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>7</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>,&nbsp;the current changes from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&nbsp;</mo><mi>mA</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>&nbsp;</mo><mi>mA</mi></math>. What is the value of the forward bias resistance?", "image": null}, "options": [], "correctValue": "10", "solution": {"text": "<p>The forward biased resistance of a diode is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi><mo>=</mo><mfrac><mrow><mo>&#8710;</mo><mi mathvariant=\"normal\">V</mi></mrow><mrow><mo>&#8710;</mo><mi mathvariant=\"normal\">I</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>0</mn><mo>.7</mo><mo>-</mo><mn>0</mn><mo>.6</mo></mrow><mrow><mfenced separators=\"|\"><mrow><mn>15</mn><mo>-</mo><mn>5</mn></mrow></mfenced><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi><mo>=</mo><mfrac><mrow><mn>0</mn><mo>.1</mo></mrow><mrow><mn>10</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup></mrow></mfrac><mo>=</mo><mn>10</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633d227f73b6bac5f5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "41", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A Zener diode&nbsp;undergoes breakdown for an electric field of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>10</mn><mn>6</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> at the depletion region of <math><mi>p</mi></math>-<math><mi>n</mi></math> junction. If the width of the depletion region is <math> <mn>2.5</mn><mtext>&#8201;</mtext><mtext>&#956;m</mtext> </math>, what should be the reverse-biased potential for the breakdown to occur?</p>\r", "image": null}, "options": [{"id": "N0jfm", "text": "<math > <mtext>3.5</mtext><mtext>&#x2009;</mtext><mtext>V</mtext></math>", "image": null, "isCorrect": false}, {"id": "P6jNh", "text": "<math > <mtext>2.5</mtext><mtext>&#x2009;</mtext><mtext>V</mtext></math>", "image": null, "isCorrect": true}, {"id": "rbqti", "text": "<math > <mtext>1.5</mtext><mtext>&#x2009;</mtext><mtext>V</mtext></math>", "image": null, "isCorrect": false}, {"id": "819mc", "text": "<math > <mtext>0.5</mtext><mtext>&#x2009;</mtext><mtext>V</mtext></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Reverse biased potential for the zener breakdown<br /><br /><math><msub><mrow><mi>V</mi></mrow><mrow><mi>r</mi></mrow></msub><mo>=</mo><mi>E</mi><mi>d</mi><mo>=</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>6</mn></mrow></msup><mo>×</mo><mn>2.5</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup><mo>=</mo><mn>2.5</mn></math> volt", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633478cbf7c149dc43", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "84", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The circuit has two oppositely connect ideal diodes in parallel. What is the current flowing in the circuit?<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Electrons_and_photos_Pg_108_Q-22.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 250px; height: 125px;\" />", "image": null}, "options": [{"id": "wXJEf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>33</mn><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 95px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "Chy6O", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>71</mn><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 95px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "CcFhn", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>00</mn><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 95px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "sZnHv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>71</mn><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 95px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since diode <math> <mrow> <msub> <mtext mathvariant=\"italic\">D</mtext> <mn>1</mn> </msub> </mrow> </math> is reverse biased, therefore it will act as an open circuit.<br />The effective resistance of the circuit is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">R</mtext><mo>=</mo><mn>4</mn><mo>+</mo><mn>2</mn><mo>=</mo><mn>6</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math> .<br />Current in the circuit is <math> <mrow> <mtext mathvariant=\"italic\">I</mtext> <mo>=</mo> <mtext mathvariant=\"italic\">E</mtext> <mo>/</mo> <mtext mathvariant=\"italic\">R</mtext> <mo>=</mo> <mtext>12</mtext> <mo>/</mo> <mn>6</mn> <mo>=</mo> </mrow> </math> 2 A.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633389f7367bacb265", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "15", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>An ideal diode is connected in a circuit&nbsp;with resistance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>50</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi><mo>=</mo><mn>10</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>.&nbsp;If an&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AC</mi></math> input signal shown in the figure is given to the circuit, then the maximum and minimum value of output voltage (without load) is<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/13c62f26-3586-4c9b-84f2-aaa89669867d-image.png\" style=\"width: 450px; height: 223px;\" /></p>\r", "image": null}, "options": [{"id": "IPdrN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi><mo>,</mo><mo>-</mo><mn>15</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></math>", "image": null, "isCorrect": false}, {"id": "3vakq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi><mo>,</mo><mo>-</mo><mn>25</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>", "image": null, "isCorrect": true}, {"id": "9fBPw", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>25</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi><mo>,</mo><mo>-</mo><mn>25</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></math>", "image": null, "isCorrect": false}, {"id": "RBmJp", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>25</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi><mo>,</mo><mo>-</mo><mn>15</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>For the positive half cycle, the diode is in reverse bias. Due to this there will be no current in the resistor, hence the output voltage</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">V</mi><mrow><mi>o</mi><mi>u</mi><mi>t</mi><mi>p</mi><mi>u</mi><mi>t</mi></mrow></msub><mo>=</mo><mn>10</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math></p><p>For the negative half cycle,</p><p>the potential difference across output&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mn>25</mn><mo>&nbsp;</mo><mi>V</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631e00abcb1b2e1967", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "60", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "When the forward bias voltage of a diode is changed from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>6</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>7</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>, the current changes from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&nbsp;</mo><mi>mA</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>&nbsp;</mo><mi>mA</mi></math>. Then its forward bias resistance is", "image": null}, "options": [], "correctValue": "10", "solution": {"text": "Forward biased resistance = <math><mfrac><mrow><mo>&#8710;</mo><mi>V</mi></mrow><mrow><mo>&#8710;</mo><mi>I</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>0.7</mn><mo>-</mo><mn>0.6</mn></mrow><mrow><mfenced separators=\"|\"><mrow><mn>15</mn><mo>-</mo><mn>5</mn></mrow></mfenced><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>0</mn><mo>.1</mo></mrow><mrow><mn>10</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup></mrow></mfrac><mo>=</mo><mn>10</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630a88ef54509d060c", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "81", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A working transistor with its three legs marked P, Q and R is tested using a multimeter. No conduction is found between P and Q. By connecting the common (negative) terminal of the multimeter to R and the other (positive) terminal to P or Q, some resistance is seen on the multimeter. Which of the following is true for the transistor?", "image": null}, "options": [{"id": "MmwNE", "text": "It is an n-p-n transistor with R as base", "image": null, "isCorrect": true}, {"id": "MYkIc", "text": "It is an p-n-p transistor with R as collector", "image": null, "isCorrect": false}, {"id": "W8PnE", "text": "It is an p-n-p transistor with R as emitter", "image": null, "isCorrect": false}, {"id": "JoZWg", "text": "It is an n-p-n transistor with R as collector", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since no conduction is found when multimeter is connected across P and Q it means either both P and Q are <math><mi>n</mi></math>-type or <math><mi>p</mi></math>-type. So, it means <math><mi>R</mi></math> is base. When <math><mi>R</mi></math> is connected to common terminal and conduction is seen when other terminal is connected to P and Q, so it means transistor is in p-n with <math><mi>R</mi></math> as base.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "6aa3ab79aa8dc1ff681780a6", "title": "Special Purpose Diodes", "totalQuestions": 1, "questions": [{"_id": "6151e8639e0f38de28cb8b2e", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "92", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A light-emitting diode (LED) has a voltage drop of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> across it and passes a current of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi>mA</mi></math>. When it operates with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> battery through a limiting resistor <math><mi>R</mi></math>, what is the value of <math><mi>R&nbsp;</mi></math>(in ohm)?", "image": null}, "options": [], "correctValue": "400", "solution": {"text": "Current in the circuit = 10 mA = <math><msup><mrow><mn>10</mn><mo>&#215;</mo><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></math> A<br /><br />and voltage in the circuit = 6<math><mo>-</mo><mn>2</mn><mo>=</mo></math> 4 V<br /><br />from Ohm&#39;s law,<br /><br /><math><mi>V</mi><mo>=</mo><mi>I</mi><mi>R</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mi>R</mi><mo>=</mo><mfrac><mi>V</mi><mi>I</mi></mfrac><mo>=</mo><mfrac><mn>4</mn><mrow><mn>10</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup></mrow></mfrac><mo>=</mo><mi>&#160;</mi><mn>400</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "6aa3ab79aa8dc1ff681780a3", "title": "Junction Transistors", "totalQuestions": 42, "questions": [{"_id": "6151e863ff91b9cd1277b2c6", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "10", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "For a common-emitter transistor amplifier, the current gain is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <mn>60</mn></mrow> </math> . If the emitter current is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>6.6</mo><mo></mo><mi>mA</mi></math> then its base current is", "image": null}, "options": [{"id": "oYKvn", "text": "<math><mn>6.492</mn><mi>mA</mi></math>", "image": null, "isCorrect": false}, {"id": "NApNR", "text": "<math><mn>0.108</mn><mi>mA</mi></math>", "image": null, "isCorrect": true}, {"id": "ZQPua", "text": "<math><mn>0.11</mn><mi>mA</mi></math>", "image": null, "isCorrect": false}, {"id": "8SHeJ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>0.343</mo><mi>mA</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a common-emitter transistor amplifier, the current gain β is 60<br /><br />The emitter current <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">E</mi></msub></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6.6</mn><mi>mA</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">E</mi></msub><msub><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">B</mi></msub></mfrac><mo>=</mo><mn>1</mn><mo>+</mo><mi mathvariant=\"normal\">β</mi><mo>⇒</mo><msub><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">B</mi></msub><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">E</mi></msub><mrow><mn>1</mn><mo>+</mo><mi mathvariant=\"normal\">β</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863fb628b34ea28fafe", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "22", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The current gain&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">β</mi></math> for a common emitter amplifier is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>69</mn></math>. If the emitter current is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>&nbsp;</mo><mi>mA</mi></math>, the base current is", "image": null}, "options": [{"id": "8z7lq", "text": "<math><mn>0.1</mn><mi>&nbsp;</mi><mi>mA</mi></math>", "image": null, "isCorrect": true}, {"id": "Fd1uZ", "text": "<math><mn>1</mn><mi>&nbsp;</mi><mi>mA</mi></math>", "image": null, "isCorrect": false}, {"id": "nflLc", "text": "<math><mn>0.2</mn><mi>&nbsp;</mi><mi>mA</mi></math>", "image": null, "isCorrect": false}, {"id": "4U0m7", "text": "<math><mn>2</mn><mi>&nbsp;</mi><mi>mA</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">β</mi><mo>=</mo><mn>69</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">E</mi></msub><mo>=</mo><mn>7</mn><mo>&nbsp;</mo><mi>mA</mi></math><br /><br />Since, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">β</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">α</mi><mrow><mn>1</mn><mo>-</mo><mi mathvariant=\"normal\">α</mi></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>69</mn><mo>=</mo><mfrac><mi mathvariant=\"normal\">α</mi><mrow><mn>1</mn><mo>-</mo><mi mathvariant=\"normal\">α</mi></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>69</mn><mo>-</mo><mn>69</mn><mi mathvariant=\"normal\">α</mi><mo>=</mo><mi mathvariant=\"normal\">α</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>69</mn><mo>=</mo><mn>70</mn><mi mathvariant=\"normal\">α</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">α</mi><mo>=</mo><mfrac><mn>69</mn><mn>70</mn></mfrac><mo>=</mo><mn>0</mn><mo>.986</mo></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">C</mi></msub><msub><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">E</mi></msub></mfrac><mo>=</mo><mn>0</mn><mo>.986</mo></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><msub><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">C</mi></msub><mo>=</mo><mn>0</mn><mo>.986</mo><mo>&nbsp;&nbsp;</mo><msub><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">E</mi></msub><mo>=</mo><mn>0</mn><mo>.986</mo><mo>×</mo><mn>7</mn><mo>=</mo><mn>6</mn><mo>.9</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi>mA</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><msub><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">B</mi></msub><mo>=</mo><msub><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">E</mi></msub><mo>-</mo><msub><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">C</mi></msub><mo>=</mo><mn>7</mn><mo>-</mo><mn>6</mn><mo>.9</mo><mo>=</mo><mn>0</mn><mo>.1</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi>mA</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863fa15b2a4ff66ecbe", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "88", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A common emitter amplifier has a voltage gain of 50, an input impedance of 100 <math><mi mathvariant=\"normal\">Ω</mi></math> and an output impedance of 200 <math><mi mathvariant=\"normal\">Ω</mi><mo>.</mo></math> The power gain of the amplifier is", "image": null}, "options": [{"id": "0UvcJ", "text": "500", "image": null, "isCorrect": false}, {"id": "WOIRG", "text": "1000", "image": null, "isCorrect": false}, {"id": "TeEbD", "text": "1250", "image": null, "isCorrect": true}, {"id": "S0K0t", "text": "100", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "AC power gain = <math><mfrac><mrow><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">w</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">r</mi></mrow><mrow><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">w</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">r</mi></mrow></mfrac></math><br /><br />= <math><mfrac><mrow><msub><mrow><mo>∆</mo><mi>V</mi></mrow><mrow><mi>c</mi></mrow></msub><mo>&times;</mo><msub><mrow><mo>∆</mo><mi>i</mi></mrow><mrow><mi>c</mi></mrow></msub></mrow><mrow><msub><mrow><mo>∆</mo><mi>V</mi></mrow><mrow><mi>i</mi></mrow></msub><mo>&times;</mo><msub><mrow><mo>∆</mo><mi>i</mi></mrow><mrow><mi>b</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><msub><mrow><mo>∆</mo><mi>V</mi></mrow><mrow><mi>c</mi></mrow></msub></mrow><mrow><msub><mrow><mo>∆</mo><mi>V</mi></mrow><mrow><mi>i</mi></mrow></msub></mrow></mfrac></mrow></mfenced><mo>&times;</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><msub><mrow><mo>∆</mo><mi>i</mi></mrow><mrow><mi>c</mi></mrow></msub></mrow><mrow><msub><mrow><mo>∆</mo><mi>i</mi></mrow><mrow><mi>b</mi></mrow></msub></mrow></mfrac></mrow></mfenced><mo>=</mo><msub><mrow><mi>A</mi></mrow><mrow><mi>V</mi></mrow></msub><mo>&times;</mo><msub><mrow><mi mathvariant=\"normal\">&beta;</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">C</mi></mrow></msub></math><br /><br />where <math><msub><mrow><mi>A</mi></mrow><mrow><mi>V</mi></mrow></msub><mi>&nbsp;</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></math> and <math><msub><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">&beta;</mi></mrow></mfenced></mrow><mrow><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">C</mi></mrow></msub></math> is AC current gain.<br /><br />Also,<br /><br /><math><msub><mrow><mi>A</mi></mrow><mrow><mi>V</mi></mrow></msub><m 63", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "35", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "When <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>NPN</mi></math>&nbsp;transistor is used as an amplifier", "image": null}, "options": [{"id": "tBQqO", "text": "electrons move from base to collector", "image": null, "isCorrect": true}, {"id": "b1c9Y", "text": "holes move from emitter to base", "image": null, "isCorrect": false}, {"id": "ZF6U3", "text": "electrons move from collector to base", "image": null, "isCorrect": false}, {"id": "WhdBY", "text": "holes move from base to collector", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Elelctrons of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>n</mtext></math>-type emitter moves from emitter to base and then base to the collector when <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>NPN</mtext></math> transistor is used as an amplifier.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863bfcac0e9ff66b755", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "20", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The current gain in the common emitter amplifier mode of a transistor is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn></math>. The input impedance is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi>kΩ</mi></math> and load&nbsp;resistance is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi>kΩ</mi></math>. The power gain is", "image": null}, "options": [{"id": "qRfWX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn></math>", "image": null, "isCorrect": false}, {"id": "3oafQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>500</mn></math>", "image": null, "isCorrect": true}, {"id": "Y4B8v", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn></math>", "image": null, "isCorrect": false}, {"id": "eRDI6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The power gain is defined as the ratio of change in output power and the change in input power.<br />Since, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi><mo>=</mo><mi>VI</mi></math>.</p><p><br />Therefore, Power gain = Current gain X Voltage gain<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi mathvariant=\"normal\">&#946;</mi><mo>&#215;</mo><mi mathvariant=\"normal\">&#946;</mi><mfenced separators=\"|\"><mfrac><msub><mi mathvariant=\"normal\">R</mi><mi>out</mi></msub><msub><mi mathvariant=\"normal\">R</mi><mi>in</mi></msub></mfrac></mfenced><mo>=</mo><msup><mi mathvariant=\"normal\">&#946;</mi><mn>2</mn></msup><mfenced separators=\"|\"><mfrac><msub><mi mathvariant=\"normal\">R</mi><mi>out</mi></msub><msub><mi mathvariant=\"normal\">R</mi><mi>in</mi></msub></mfrac></mfenced></math></p><p><br />Given, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#946;</mi><mo>=</mo><mn>10</mn></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">R</mi><mi>in</mi></msub><mo>=</mo><mn>20</mn><mi mathvariant=\"normal\">&#160;</mi><mi>k&#937;</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">R</mi><mi>out</mi></msub><mo>=</mo><mn>100</mn><mi mathvariant=\"normal\">&#160;</mi><mi>k&#937;</mi></math>.<br />Hence, Power gain <math><mo>=</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>10</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>100</mn></mrow><mrow><mn>20</mn></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>100</mn><mo>&#215;</mo><mn>5</mn><mo>=</mo><mn>500</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b439725e5cc2f2ee", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "11", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>In the following common emitter configuration a&nbsp;<math><mi>N</mi><mi>P</mi><mi>N</mi></math> transistor with current gain <math> <mi>β</mi><mo>=</mo><mn>100</mn></math> is used. The output voltage of the amplifier will be<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-05-29_at_1.55.50_PM.jpeg\" style=\"width: 300px; height: 148px;\" /></p>\r", "image": null}, "options": [{"id": "KzNFY", "text": "<math><mn>10</mn><mi> </mi><mi>m</mi><mi>V</mi></math>", "image": null, "isCorrect": false}, {"id": "aBfen", "text": "<math><mn>0.1</mn><mi> </mi><mi>V</mi></math>", "image": null, "isCorrect": false}, {"id": "a6yvi", "text": "<math><mn>1.0</mn><mi>&nbsp;</mi><mi>V</mi></math>", "image": null, "isCorrect": true}, {"id": "KkKNT", "text": "<math><mn>10</mn><mi> </mi><mi>V</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, ture": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b0fe72ea9a755a1e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "67", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In a common emitter NPN transistor,&nbsp;<math><msup><mrow><mn>10</mn></mrow><mrow><mn>10</mn></mrow></msup></math> electrons enter the emitter in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>10</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">s</mi></math> when it is connected to the battery. About&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>%</mo></math> of electrons recombine with holes in the base. The current gain of the transistor is&nbsp;<br />\r<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mi>e</mi><mo>=</mo><mn>1.6</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>19</mn></mrow></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">C</mi></mrow></mfenced></math>", "image": null}, "options": [{"id": "SVlKJ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>98</mn></math>", "image": null, "isCorrect": false}, {"id": "KYrRD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>19</mn></math>", "image": null, "isCorrect": true}, {"id": "LWAfC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>49</mn></math>", "image": null, "isCorrect": false}, {"id": "nri0m", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>95</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Current gain of common emitter <math><mi>β</mi><mo>=</mo><mfrac><mrow><msub><mrow><mi>i</mi></mrow><mrow><mi>C</mi></mrow></msub></mrow><mrow><msub><mrow><mi>i</mi></mrow><mrow><mi>B</mi></mrow></msub></mrow></mfrac></math><br /><br /><math><mi>β</mi><mo>=</mo><mfrac><mrow><mn>95</mn><mi>%</mi><mi>&nbsp;</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">f</mi><mi>&nbsp;</mi><msub><mrow><mi>i</mi></mrow><mrow><mi>E</mi></mrow></msub></mrow><mrow><mn>5</mn><mi>%</mi><mi>&nbsp;</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">f</mi><mi>&nbsp;</mi><msub><mrow><mi>i</mi></mrow><mrow><mi>E</mi></mrow></msub></mrow></mfrac></math><br /><br /><math><mi>β</mi><mo>=</mo><mfrac><mrow><mn>95</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mo>=</mo><mn>19</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a790241f40f85f04", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "14", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In a common emitter transistor amplifier, signal voltage across the collector resistance of <math> <mrow> <mn>2</mn><mo>&nbsp;</mo><mi>k</mi><mi>Ω</mi></mrow> </math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi>volt</mi></math>. What should be the value of resistance&nbsp;&nbsp;<math> <mrow> <msub> <mi>R</mi> <mi>B</mi> </msub> </mrow> </math> in series with&nbsp;&nbsp;<math> <mrow> <msub> <mi>V</mi> <mrow> <mi>B</mi><mi>B</mi></mrow> </msub> </mrow> </math> &nbsp;voltage supply of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi>volt</mi></math> in the input circuit, if the <math> <mrow> <mi>D</mi><mo>.</mo><mi>C</mi><mo>.</mo></mrow> </math> base current is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo></math>times the signal current in&nbsp;<math> <mrow> <msub> <mi>R</mi> <mi>B</mi> </msub> </mrow> </math>?<br />\r<br />\r<math> <mo stretchy=\"false\">(</mo> </math>given base emitter voltage <math> <mrow> <msub> <mtext>V</mtext> <mrow> <mi>B</mi><mi>E</mi></mrow> </msub> <mo>=</mo><mn>0.6</mn></mrow> </math> volt, current amplification factor <math> <mrow> <msub> <mi>β</mi> <mrow> <mi>a</mi><mi>c</mi></mrow> </msub> <mo>≈</mo><msub> <mi>β</mi> <mrow> <mi>d</mi><mi>c</mi></mrow> </msub> <mo>=</mo><mn>100</mn></mrow> </math><math> <mo stretchy=\"false\">)</mo> </math>", "image": null}, "options": [{"id": "9omni", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>&#160;</mo><mi>k&#937;</mi></math>", "image": null, "isCorrect": false}, {"id": "N2WPV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>26</mn><mo>&#160;</mo><mi>k&#937;</mi></math>", "image": null, "isCorrect": false}, {"id": "FCviW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#160;</mo><mi>k&#937;</mi></math>", "image": null, "isCorrect": false}, {"id": "OHMJ2", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>14</mn><mo>&#160;</mo><mi>k&#937;</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mfenced><msub><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">c</mi></msub></mfenced><mi>AC</mi></msub><mo>=</mo><mfrac><msub><mfenced><msub><mi mathvariant=\"normal\">V</mi><mtext>out&#160;</mtext></msub></mfenced><mi>AC</mi></msub><msub><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">C</mi></msub></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mtext>&#160;volt&#160;</mtext></mrow><mrow><mn>2</mn><mo>&#160;</mo><mi>k&#937;</mi></mrow></mfrac><mo>=</mo><mn>1</mn><mo>&#160;</mo><mi>mA</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mfenced><msub>
