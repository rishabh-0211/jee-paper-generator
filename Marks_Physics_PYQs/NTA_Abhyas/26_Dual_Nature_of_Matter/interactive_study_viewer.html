": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>Two particles having de-Broglie wavelengths&nbsp;<math> <mrow> <msub> <mi>λ</mi> <mrow> <mn>1</mn><mo>&nbsp;</mo></mrow> </msub> </mrow> </math> and <math> <mrow> <msub> <mi>λ</mi> <mn>2</mn> </msub> </mrow> </math>,&nbsp;while&nbsp;moving along mutually perpendicular directions, undergo perfectly inelastic collision. The de-Broglie wavelength&nbsp;<math> <mi>λ</mi> </math>, of the final particle is</p>\r", "image": null}, "options": [{"id": "7Stvx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>λ</mi><mo>=</mo><mfrac><mrow><msub><mi>λ</mi><mn>1</mn></msub><msub><mi>λ</mi><mn>2</mn></msub></mrow><msqrt><msubsup><mi>λ</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi>λ</mi><mn>2</mn><mn>2</mn></msubsup></msqrt></mfrac></math>", "image": null, "isCorrect": true}, {"id": "K9uQ4", "text": "<math> <mrow>  <mi>&#x03BB;</mi><mo>=</mo><msqrt>   <mrow>    <msub>     <mi>&#x03BB;</mi>     <mn>1</mn>    </msub>    <msub>     <mi>&#x03BB;</mi>     <mn>2</mn>    </msub>    </mrow>  </msqrt>  </mrow></math>", "image": null, "isCorrect": false}, {"id": "OaJf9", "text": "<math> <mrow>  <mi>&#x03BB;</mi><mo>=</mo><msqrt>   <mrow>    <msub>     <mi>&#x03BB;</mi>     <mn>1</mn>    </msub>    <mo>+</mo><msub>     <mi>&#x03BB;</mi>     <mn>2</mn>    </msub>    </mrow>  </msqrt>  </mrow></math>", "image": null, "isCorrect": false}, {"id": "37GHk", "text": "<math> <mrow>  <mi>&#x03BB;</mi><mo>=</mo><mfrac>   <mrow>    <msub>     <mi>&#x03BB;</mi>     <mn>1</mn>    </msub>    <mo>+</mo><msub>     <mi>&#x03BB;</mi>     <mn>2</mn>    </msub>    </mrow>   <mn>2</mn>  </mfrac>  </mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Let us assume that one of the particles is moving along the positive&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>&nbsp;direction and the other is moving along the positive&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math>&nbsp;direction. The net momentum of the system is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mover><mi>P</mi><mo>→</mo></mover><mi>net</mi></msub><mo>=</mo><mi>P</mi><mover><mi mathvariant=\"normal\">i</mi><mo>^</mo></mover><mo>+</mo><mi>P</mi><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover></math></p><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>h</mi><mi>λ</mi></mfrac><mo>=</mo><mfenced close=\"|\" open=\"|\"><mrow><mfrac><mi>h</mi><msub><mi>λ</mi><mn>1</mn></msub></mfrac><mover><mi mathvariant=\"normal\">i</mi><mo>^</mo></mover><mo>+</mo><mfrac><mi>h</mi><msub><mi>λ</mi><mn>2</mn></msub></mfrac><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover></mrow></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>λ</mi></mfrac><mo>=</mo><msqrt><mfrac><mn>1</mn><msubsup><mi>λ</mi><mn>1</mn><mn>2</mn></msubsup></mfrac><mo>+</mo><mfrac><mn>1</mn><msubsup><mi>λ</mi><mn>2</mn><mn>2</mn></msubsup></mfrac></msqrt></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>λ</mi><mo>=</mo><mfrac><mrow><msub><mi>λ</mi><mn>1</mn></msub><msub><mi>λ</mi><mn>2</mn></msub></mrow><msqrt><msubsup><mi>λ</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi>λ</mi><mn>2</mn><mn>2</mn></msubsup></msqrt></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86392f297ff77093cdd", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "98", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "What should be the velocity of an electron so that its momentum becomes equal to that o 2fce9", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "40", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An electron of mass <math><mi>m</mi></math> and magnitude of charge <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>e</mi></math>&nbsp;at rest, gets accelerated by a constant electric field <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi></math>.&nbsp;The rate of change of de-Broglie wavelength of this electron at a time <math><mi>t</mi></math>&nbsp;is (ignore relativistic effects)", "image": null}, "options": [{"id": "fcLlg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>&#x3BB;</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mfrac><mi>h</mi><mrow><mi>e</mi><mi>E</mi><mi>t</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "QMkyn", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>&#x3BB;</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mfrac><mrow><mn>2</mn><mi>h</mi></mrow><mrow><mi>e</mi><mi>E</mi><mi>t</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "c4HHh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>&#x3BB;</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mfrac><mrow><mn>2</mn><mi>h</mi></mrow><mrow><mi>e</mi><mi>E</mi><msup><mi>t</mi><mn>2</mn></msup></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "nQpfj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>&#x3BB;</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mfrac><mi>h</mi><mrow><mi>e</mi><mi>E</mi><msup><mi>t</mi><mn>2</mn></msup></mrow></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>The acceleration of the electron is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mfrac><mrow><mi>e</mi><mi>E</mi></mrow><mi>m</mi></mfrac></math></p><p>The velocity of the electron as a function of time is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mi>a</mi><mi>t</mi><mo>=</mo><mfrac><mrow><mi>e</mi><mi>E</mi></mrow><mi>m</mi></mfrac><mi>t</mi></math></p><p>The de-Broglie wavelength is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi><mo>=</mo><mfrac><mi>h</mi><mrow><mi>m</mi><mi>v</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi><mo>=</mo><mfrac><mi>h</mi><mrow><mi>m</mi><mfenced separators=\"|\"><mfrac><mrow><mi>e</mi><mi>E</mi></mrow><mi>m</mi></mfrac></mfenced><mi>t</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi><mo>=</mo><mfrac><mi>h</mi><mrow><mi>e</mi><mi>E</mi><mi>t</mi></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>&#955;</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mfrac><mi>h</mi><mrow><mi>e</mi><mi>E</mi><msup><mi>t</mi><mn>2</mn></msup></mrow></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863733a38b44e60d550", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "55", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An electron of mass <math><msup><mrow><mi>m</mi></mrow></msup></math>&nbsp;has de-Broglie wavelen .w3.org/1998/Math/MathML\"><mi>λ</mi><mo>=</mo><mn>3</mn><mi>π</mi><msub><mi>a</mi><mn>0</mn></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From Bohr's law<br /><br /><math><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">r</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">h</mi></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">π</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn><mi mathvariant=\"normal\">h</mi></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">π</mi></mrow></mfrac></math><br /><br /><math><mo>⇒</mo><mi mathvariant=\"normal\">n</mi><mo>=</mo><mn>3</mn></math><br /><br />And momentum <math><mo>=</mo><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">v</mi><mo>=</mo><mfrac><mrow><mn>3</mn><mi mathvariant=\"normal\">h</mi></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">π</mi><mi mathvariant=\"normal\">r</mi></mrow></mfrac></math><br /><br />Now, radius of <math><msup><mrow><mi mathvariant=\"normal\">n</mi></mrow><mrow><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">h</mi></mrow></msup></math> shell, <math><mi mathvariant=\"normal\">r</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">n</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi mathvariant=\"normal\">z</mi></mrow></mfrac></mrow></mfenced><msub><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>0</mn></mrow></msub></math><br /><br /><math><mo>⇒</mo><mi mathvariant=\"normal\">r</mi><mo>=</mo><mfrac><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mn>3</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>3</mn></mrow></mfrac><mo>.</mo><msub><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>0</mn></mrow></msub></math> <math><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mo>∵</mo><msub><mrow><mi mathvariant=\"normal\">Z</mi></mrow><mrow><mi mathvaria /mn><mi mathvariant=\"normal\">π</mi><msub><mi mathvariant=\"normal\">a</mi><mn>0</mn></msub></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86329b87c2dcfbf2473", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "89", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The de-Broglie wavelength <math><msub><mrow><mi>λ</mi></mrow><mrow><mi>n</mi></mrow></msub></math> of the electron in the <math><msup><mrow><mi>n</mi></mrow><mrow><mi>t</mi><mi>h</mi></mrow></msup></math> orbit of hydrogen atom is", "image": null}, "options": [{"id": "oqikn", "text": "Inversely proportional to <math><mi>n</mi></math>", "image": null, "isCorrect": true}, {"id": "hDSZK", "text": "Proportional to  <math><msup><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "sAL4M", "text": "Proportional to  <math><mi>n</mi></math>", "image": null, "isCorrect": false}, {"id": "qLPM9", "text": "Inversely proportional to  <math><msup><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mo>∵</mo><mi>&nbsp;</mi></math> de-Broglie wavelength <math><msub><mrow><mi>λ</mi></mrow><mrow><mi>n</mi></mrow></msub></math> of the electron in the <math><msup><mrow><mi>n</mi></mrow><mrow><mi>t</mi><mi>h</mi></mrow></msup></math> orbit of hydrogen atom<br /><br /><math><mi>λ</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>π</mi></mrow><mrow><mi>n</mi><mi>h</mi></mrow></mfrac><mo>×</mo><mi>h</mi><mi>r</mi></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>λ</mi></mrow><mrow><mi>n</mi></mrow></msub><mo>=</mo><mfrac><mrow><mn>2</mn><mi>π</mi><mi>r</mi></mrow><mrow><mi>n</mi></mrow></mfrac></math><br /><br /><math><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mtable><mtr><mtd><mrow><maligngroup></maligngroup><mn>A</mn><mn>s</mn><mo>,</mo><mi>&nbsp;</mi><mi>λ</mi><mo>=</mo><mfrac><mrow><mi>h</mi></mrow><mrow><mi>p</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>h</mi></mrow><mrow><mi>m</mi><mi>v</mi></mrow></mfrac></mrow></mtd></mtr><mtr><mtd><mrow><maligngroup></maligngroup><mi>o</mi><mi>r</mi><mi>&nbsp;</mi><mi>m</mi><mi>v</mi><mi>r</mi><mo>=</mo><mfrac><mrow><mi>h</mi><mi>r</mi></mrow><mrow><mi>λ</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>n</mi><mi>h</mi></mrow><mrow><mn>2</mn><mi>π</mi></mrow></mfrac><mo>,</mo><mi>λ</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>π</mi></mrow><mrow><mi>n</mi><mi>h</mi></mrow></mfrac><mo>×</mo><mi>h</mi><mi>r</mi></mrow></mtd></mtr></mtable></mrow></mfenced></math><br /><br /><math><msub><mrow><mi>λ</mi></mrow><mrow><mi>n</mi></mrow></msub><mo>∝​</mo><mrow><mi>n</mi></mrow></math><br /><br />Hence, <math><msub><mrow><mi>λ</mi></mrow><mrow><mi>n</mi></mrow></msub></math> is directly proportional to <math><mi>n</mi><mo>.</mo></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863008a706b1f26895b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "102", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two particles <math><mi>A</mi></math> and <math><mi>B</mi></math> of same mass have their de-Broglie wavelengths in the ratio <math><msub><mrow><mi>X</mi></mrow><mrow><mi>A</mi></mrow></msub><mi>&nbsp;</mi><mo>:</mo><msub><mrow><mi>X</ ull, "isCorrect": false}, {"id": "k4dvq", "text": "<math><mn>1</mn><mo>:</mo><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "d0iJz", "text": "<math><mn>1</mn><mo>:</mo><mn>5</mn></math>", "image": null, "isCorrect": false}, {"id": "VCNQp", "text": "<math><mn>1</mn><mo>:</mo><mn>2</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Einstein&#39;s photoelectric equation, the maximum kinetic energy of emitted photoelectrons is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">x</mi></mrow></msub><mo>=</mo><mi>h</mi><mi>&#957;</mi><mo>-</mo><msub><mi>&#981;</mi><mn>0</mn></msub></math><br /><br />Where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><mi>&#957;</mi></math> is the energy of the incident photon and <math><msub><mrow><mi>&#981;</mi></mrow><mrow><mn>0</mn></mrow></msub></math> is the work function.<br /><br />But <math><msub><mrow><mi>K</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">x</mi></mrow></msub><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>m</mi><msubsup><mrow><mi>v</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>2</mn></mrow></msubsup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><msubsup><mi>v</mi><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">x</mi></mrow><mn>2</mn></msubsup><mo>=</mo><mi>h</mi><mi>&#957;</mi><mo>-</mo><msub><mi>&#981;</mi><mn>0</mn></msub></math><br /><br />As per the question,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><msub><msup><mi>v</mi><mn mathvariant=\"italic\">2</mn></msup><mrow><msub><mi>max</mi><mn>1</mn></msub><mo>&#8289;</mo></mrow></msub><mo>=</mo><mn>1</mn><mo>&#160;</mo><mi>eV</mi><mo>-</mo><mtext>0.5</mtext><mi mathvariant=\"normal\">&#160;</mi><mi>eV</mi><mo>=</mo><mtext>0.5</mtext><mi mathvariant=\"normal\">&#160;</mi><mi>eV</mi></math> ...(i)<br /><br />and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><msub><msup><mi>v</mi><mn>2</mn></msup><mrow><msub><mi>max</mi><mn>2</mn></msub><mo>&#8289;</mo></mrow></msub><mo>=</mo><mtext>2.5</mtext><mi mathvariant=\"normal\">&#160;</mi><mi>eV</mi><mo>-</mo><mtext>0.5</mtext><mi mathvariant=\"normal\">&#160;</mi><mi>eV</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#160;</mi><mi>eV</mi></math> ...(ii)<br /><br />Dividing equation (i) by equation (ii), we get<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><msup><mi>v</mi><mn>2</mn></msup><mrow><msub><mi>max</mi><mn>1</mn></msub><mo>&#8289;</mo></mrow></msub><msub><msup><mi>v</mi><mn>2</mn></msup><mrow><msub><mi>max</mi><mn>2</mn></msub><mo>&#8289;</mo></mrow></msub></mfrac><mo>=</mo><mfrac><mrow><mtext>0.5</mtext><mi>&#160;</mi><mi>eV</mi></mrow><mrow><mn>2</mn><mi>&#160;</mi><mi>eV</mi></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></math><br /><br /><math><mfrac><mrow><msub><mrow><mi>v</mi></mrow><mrow><mrow><mrow><msub><mrow><mi mathvariant=\"italic\">max</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mo>&#8289;</mo><mrow></mrow></mrow></mrow></msub></mrow><mrow><msub><mrow><mi>v</mi></mrow><mrow><mrow><mrow><msub><mrow><mi mathvariant=\"italic\">max</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mo>&#8289;</mo><mrow></mrow></mrow></mrow></msub></mrow></mfrac><mo>=</mo><msqrt><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac></msqrt><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["d =\"http://www.w3.org/1998/Math/MathML\"><mn>0.5</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi>eV</mi></math>. The ratio of maximum speeds of the emitted electrons will be", "image": null}, "options": [{"id": "1ZUIu", "text": "<math><mn>1</mn><mo>:</mo><mn>4</mn></math>", "image": null, "isCorrect": false}, {"id": "9ALzX", "text": "<math><mn>1</mn><mo>:</mo><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "Uxbm9", "text": "<math><mn>1</mn><mo>:</mo><mn>5</mn></math>", "image": null, "isCorrect": false}, {"id": "zajaV", "text": "<math><mn>1</mn><mo>:</mo><mn>2</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Einstein&#39;s photoelectric equation, the maximum kinetic energy of emitted photoelectrons is <math><msub><mrow><mi>K</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">x</mi></mrow></msub><mo>=</mo><mi>h</mi><mi>&#965;</mi><mo>-</mo><msub><mrow><mi>&#981;</mi></mrow><mrow><mn>0</mn></mrow></msub></math><br /><br />Where <math><mi>h</mi><mi>&#965;</mi></math> is the energy of incident photon and <math><msub><mrow><mi>&#981;</mi></mrow><mrow><mn>0</mn></mrow></msub></math> is the work function.<br /><br />But <math><msub><mrow><mi>K</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">x</mi></mrow></msub><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>m</mi><msubsup><mrow><mi>v</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>2</mn></mrow></msubsup></math><br /><br /><math><mo>&#8756;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>m</mi><msubsup><mrow><mi>v</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>2</mn></mrow></msubsup><mo>=</mo><mi>h</mi><mi>&#965;</mi><mo>-</mo><msub><mrow><mi>&#981;</mi></mrow><mrow><mn>0</mn></mrow></msub></math><br /><br />As per question,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><msub><msup><mi>v</mi><mn mathvariant=\"italic\">2</mn></msup><mrow><msub><mi>max</mi><mn>1</mn></msub><mo>&#8289;</mo></mrow></msub><mo>=</mo><mn>1</mn><mo>&#160;</mo><mi>eV</mi><mo>-</mo><mtext>0.5</mtext><mi mathvariant=\"normal\">&#160;</mi><mi>eV</mi><mo>=</mo><mtext>0.5</mtext><mi mathvariant=\"normal\">&#160;</mi><mi>eV</mi></math> ...(i)<br /><br />and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><msub><msup><mi>v</mi><mn>2</mn></msup><mrow><msub><mi>max</mi><mn>2</mn></msub><mo>&#8289;</mo></mrow></msub><mo>=</mo><mtext>2.5</mtext><mi mathvariant=\"normal\">&#160;</mi><mi>eV</mi><mo>-</mo><mtext>0.5</mtext><mi mathvariant=\"normal\">&#160;</mi><mi>eV</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#160;</mi><mi>eV</mi></math> ...(ii)<br /><br />Dividing equation (i) by equation (ii), we get<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><msup><mi>v</mi><mn>2</mn></msup><mrow><msub><mi>max</mi><mn>1</mn></msub><mo>&#8289;</mo></mrow></msub><msub><msup><mi>v</mi><mn>2</mn></msup><mrow><msub><mi>max</mi><mn>2</mn></msub><mo>&#8289;</mo></mrow></msub></mfrac><mo>=</mo><mfrac><mrow><mtext>0.5</mtext><mi>&#160;</mi><mi>eV</mi></mrow><mrow><mn>2</mn><mi>&#160;</mi><mi>eV</mi></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></math><br /><br /><math><mfrac><mrow><msub><mrow><mi>v</mi></mrow><mrow><mrow><mrow><msub><mrow><mi mathvariant=\"italic\">max</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mo>&#8289;</mo><mrow></mrow></mrow></mrow></msub></mrow><mrow><msub><mrow><mi>v</mi></mrow><mrow><mrow><mrow><msub><mrow><mi mathvariant=\"italic\">max</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mo>&#8289;</mo><mrow></mrow></mrow></mrow></msub></mrow></mfrac><mo>=</mo><msqrt><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac></msqrt><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863bf5a3ba031954d85", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "07", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The energy of a photon is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi></math>&nbsp;which is equal to the kinetic energy of a proton. If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>λ</mi><mn>1</mn></msub></math> be the de-Broglie wavelength of the proton and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>λ</mi><mn>2</mn></msub></math> be the wavelength of the photon, then the ratio&nbsp;<math><mrow><mfrac linethickness=\"1\"><mrow><msub><mi>λ</mi><mn>1</mn></msub></mrow><mrow><msub><mi>λ</mi><mn>2</mn></msub></mrow></mfrac></mrow></math>&nbsp;is proportional to", "image": null}, "options": [{"id": "BqxTa", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>E</mi><mn>0</mn></msup></math>", "image": null, "isCorrect": false}, {"id": "vCmO7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>E</mi><mfrac bevelled=\"true\"><mn>1</mn><mn>2</mn></mfrac></msup></math>", "image": null, "isCorrect": true}, {"id": "kz1pI", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>E</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "N954T", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>E</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac linethickness=\"1\"><msub><mi>&#x3BB;</mi><mn>1</mn></msub><msub><mi>&#x3BB;</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac linethickness=\"1\"><mfrac linethickness=\"1\"><mi>h</mi><msqrt><mn>2</mn><mi>m</mi><mi>E</mi></msqrt></mfrac><mfrac linethickness=\"1\"><mrow><mi>h</mi><mi>c</mi></mrow><mi>E</mi></mfrac></mfrac><mspace linebreak=\"newline\"/><mo>&#x21D2;</mo><mfrac linethickness=\"1\"><msub><mi>&#x3BB;</mi><mn>1</mn></msub><msub><mi>&#x3BB;</mi><mn>2</mn></msub></mfrac><mo>=</mo><msup><mi>E</mi><mfrac linethickness=\"1\"><mn>1</mn><mn>2</mn></mfrac></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b755a7199b0c51e0", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "96", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If stopping potentials corresponding to wavelength <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4000</mn><mo>&nbsp;</mo><mover><mi mathvariant=\"normal\">A</mi><mo>∘</mo></mover></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4500</mn><mo>&nbsp;</mo><mover><mi mathvariant=\"normal\">A</mi><mo>∘</mo></mover></math>&nbsp;are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>3</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>9</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>, respectively, then the work function of the metal is", "image": null}, "options </math> is used. If radiation of wavelength <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mi mathvariant=\"normal\">λ</mi><mn>0</mn></msub><mi mathvariant=\"normal\">&nbsp;</mi></math>is used with the same metal then the stopping potential (in volt ) will be", "image": null}, "options": [{"id": "LSsuC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "1PxEB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub><mi mathvariant=\"normal\">&#160;</mi></math>", "image": null, "isCorrect": false}, {"id": "emduV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub><mo>+</mo><mfrac><mi>hc</mi><mrow><mn>2</mn><msub><mi>e&#955;</mi><mn>0</mn></msub></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "lyLVI", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub><mo>-</mo><mfrac><mi>hc</mi><mrow><mn>2</mn><msub><mi>e&#955;</mi><mn>0</mn></msub></mrow></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "From Einstein's photoelectric equation<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>eV</mi><mn>0</mn></msub><mo>=</mo><mfrac><mi>hc</mi><msub><mi mathvariant=\"normal\">λ</mi><mn>0</mn></msub></mfrac><mo>-</mo><msub><mi mathvariant=\"normal\">W</mi><mn>0</mn></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>eV</mi><mi mathvariant=\"normal\">′</mi></msup><mo>=</mo><mfrac><mi>hc</mi><mrow><mn>2</mn><msub><mi mathvariant=\"normal\">λ</mi><mn>0</mn></msub></mrow></mfrac><mo>-</mo><msub><mi mathvariant=\"normal\">W</mi><mn>0</mn></msub></math><br /><br />Subtracting <math xmlns=\"http://www.w3.org/ =</mo><mn>1.267</mn><mi>&nbsp;eV</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b4cd333c4db19f96", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "85", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A photocell is illuminated by a small bright source placed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> away. When the same source of light is placed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mfrac bevelled=\"true\"><mn>1</mn><mn>2</mn></mfrac></mfenced></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math> away, the number of electrons emitted by photocathode would", "image": null}, "options": [{"id": "ksi07", "text": "decrease by a factor of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "afAk6", "text": "increase by a factor of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "4qFjJ", "text": "decrease by a factor of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>", "image": null, "isCorrect": false}, {"id": "dAnPk", "text": "increase by a factor of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mfrac><mrow><mi>P</mi><mspace width=\"0.5em\"/><mtext>of source</mtext></mrow><mrow><mn>4</mn><mi mathvariant=\"normal\">&#960;</mi><msup><mfenced><mtext>distance</mtext></mfenced><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mfrac><mi>P</mi><mrow><mn>4</mn><mi>&#960;</mi><msup><mi>d</mi><mn>2</mn></msup></mrow></mfrac></math><br />Here, we assume light to spread uniformly in all directions.<br />The number of photo-electrons emitted from a surface depends on the intensity of light&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi></math> falling on it. Thus the number of electrons emitted&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math> depends directly on <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi></math>.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> remains constant as the source is the same.<br />&nbsp;<br /><math> <mrow> <mo>&#8756;</mo> </mrow> </math> &nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac linethickness=\"1\"><msub><mi>I</mi><mn>2</mn></msub><msub><mi>I</mi><mn>1</mn></msub></mfrac><mo>=</mo><mfrac linethickness=\"1\"><msub><mi>n</mi><mn>2</mn></msub><msub><mi>n</mi><mn>1</mn></msub></mfrac><mo>&#8658;</mo><mfrac linethickness=\"1\"><msub><mi>P</mi><mn>2</mn></msub><msub><mi>P</mi><mn>1</mn></msub></mfrac><msup><mrow><mo>(</mo><mfrac linethickness=\"1\"><msub><mi>d</mi><mn>1</mn></msub><msub><mi>d</mi><mn>2</mn></msub></mfrac><mo>)</mo></mrow><mn>2</mn></msup><mo>=</mo><mfrac linethickness=\"1\"><msub><mi>n</mi><mn>2</mn></msub><msub><mi>n</mi><mn>1</mn></msub></mfrac></math><br />&nbsp;<br /><math> <mrow> <mo>&#8756;</mo> </mrow> </math> &nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac linethickness=\"1\"><msub><mi>n</mi><mn>2</mn></msub><msub><mi>n</mi><mn>1</mn></msub></mfrac><mo>=</mo><mfenced><mfrac linethickness=\"1\"><mi>P</mi><mi>P</mi></mfrac></mfenced><msup><mfenced><mfrac linethickness=\"1\"><mn>1</mn><mstyle displaystyle=\"true\"><mfrac bevelled=\"true\"><mn>1</mn><mn>2</mn></mfrac></mstyle></mfrac></mfenced><mn>2</mn></msup><mo>=</mo><mfrac linethickness=\"1\"><mn>4</mn><mn>1</mn></mfrac></math>&nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mo>&#8757;</mo><mo>&#160;</mo><msub><mi>P</mi><mn>1</mn></msub><mo>&#160;</mo><mo>=</mo><msub><mi>P</mi><mn>2</mn></msub><mo>&#160;</mo><mo>=</mo><mi>P</mi><mo>)</mo></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b23dbba1360a0fd0", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "48", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Light of wavelength&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>0.6&nbsp;μm</mtext></math>&nbsp;falls on a photocell and causes the emission of photoelectrons for which the stopping potential is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>. With the light of wavelength <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>0.4&nbsp;μm</mtext></math>, stopping potentials is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>. With this data, the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac bevelled=\"true\"><mi>h</mi><mi>e</mi></mfrac></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>15</mn></mrow></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi><mo>&nbsp;</mo><mi mathvariant=\"normal\">s</mi></math>.&nbsp;Find the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>.", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>e</mi><mi>V</mi><mo>=</mo><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mi>&#955;</mi></mfrac><mo>&#8722;</mo><mi>W</mi><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mi>V</mi><mo>=</mo><mrow><mo stretchy=\"true\">(</mo><mfrac><mi>h</mi><mi>e</mi></mfrac><mo stretchy=\"true\">)</mo></mrow><mfrac><mi>c</mi><mi>&#955;</mi></mfrac><mo>&#8722;</mo><mfrac><mi>W</mi><mi>e</mi></mfrac></math></p><p><math><semantics><mrow><msub><mi>V</mi><mn>1</mn></msub><mo>=</mo><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mfrac><mi>h</mi><mi>e</mi></mfrac><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mfrac><mi>c</mi><msub><mi>&#955;</mi><mn>1</mn></msub></mfrac><mo>&#8722;</mo><mfrac><mi>W</mi><mi>e</mi></mfrac></mrow></semantics></math> &hellip;&hellip;....&hellip;&hellip;(1)</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>2</mn></msub><mo>=</mo><mrow><mo stretchy=\"true\">(</mo><mfrac><mi>h</mi><mi>e</mi></mfrac><mo stretchy=\"true\">)</mo></mrow><mfrac><mi>c</mi><msub><mi>&#955;</mi><mn>2</mn></msub></mfrac><mo>&#8722;</mo><mfrac><mi>W</mi><mi>e</mi></mfrac></math> &hellip;&hellip;&hellip;&hellip;&hellip;(2)</p><p>Solving these two equations, we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>h</mi><mi>e</mi></mfrac><mo>=</mo><mfrac><mrow><msub><mi>&#955;</mi><mn>1</mn></msub><msub><mi>&#955;</mi><mn>2</mn></msub><mrow><mo stretchy=\"true\">(</mo><msub><mi>V</mi><mn>1</mn></msub><mo>&#8722;</mo><msub><mi>V</mi><mn>2</mn></msub><mo stretchy=\"true\">)</mo></mrow></mrow><mrow><mi>c</mi><mrow><mo stretchy=\"true\">(</mo><msub><mi>&#955;</mi><mn>2</mn></msub><mo>&#8722;</mo><msub><mi>&#955;</mi><mn>1</mn></msub><mo stretchy=\"true\">)</mo></mrow></mrow></mfrac><mo>=</mo><mfrac><mrow><mrow><mo stretchy=\"true\">(</mo><mn>0.6</mn><mo>&#215;</mo><mn>0.4</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>&#8722;</mo><mn>12</mn></mrow></msup><mo stretchy=\"true\">)</mo></mrow><mrow><mo stretchy=\"true\">(</mo><mn>1</mn><mo>.</mo><mn>0</mn><mo stretchy=\"true\">)</mo></mrow></mrow><mrow><mrow><mo stretchy=\"true\">(</mo><mn>3</mn><mo>&#215;</mo><msup><mn>10</mn><mn>8</mn></msup><mo stretchy=\"true\">)</mo></mrow><mrow><mo stretchy=\"true\">(</mo><mn>0</mn><mo>.</mo><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>&#8722;</mo><mn>6</mn></mrow></msup><mo stretchy=\"true\">)</mo></mrow></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>4</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>&#8722;</mo><mn>15</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>=</mo><mn>4</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863afd942213133f610", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "54", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>The radiation emitted, when an electron jumps from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">n</mi><mo>=</mo><mn>3</mn></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">n</mi><mo>=</mo><mn>2</mn></math> orbit in&nbsp;a hydrogen atom, falls on a metal to produce photoelectrons. The electrons from the metal surface with maximum kinetic energy are made to move perpendicular to a magnetic field of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>320</mn></mfrac><mo>&nbsp;</mo><mi mathvariant=\"normal\">T</mi></math>&nbsp;in a radius of <math xmlns=\ p;</mi><mi mathvariant=\"normal\">m&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "Hnt7Y", "text": "<math><mn>1400</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">m&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "ZD6vG", "text": "<math><mn>2800</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">m&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to De Broglie's equation Momentum,<br /><br /><math> <mrow> <mi>p</mi><mo>=</mo><mfrac> <mi>h</mi> <mi>λ</mi> </mfrac> </mrow> </math><br /><br />or <math><mi>v</mi><mo>=</mo><mfrac><mrow><mi>h</mi></mrow><mrow><mi>m</mi><mi>λ</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>6.62</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>34</mn></mrow></msup></mrow><mrow><mn>9.1</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>31</mn></mrow></msup><mo>×</mo><mn>5.2</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>7</mn></mrow></msup></mrow></mfrac></math><br /><br /><math><mo>=</mo><mn>1.4</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>3</mn></mrow></msup><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo><mn>1400</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639068687517ecd6d3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "107", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If <math><msub><mrow><mi>K</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi>K</mi></mrow><mrow><mn>2</mn></mrow></msub></math> are maximum kinetic energies of photoelectrons emitted when lights of wavelength <math><msub><mrow><mi>λ</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi>λ</mi></mrow><mrow><mn>2</mn></mrow></msub></math> respectively incident on a metallic surface. If&nbsp;<math><msub><mrow><mi>λ</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>3</mn><msub><mrow><mi>λ</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>,</mo></math> then", "image": null}, "options": [{"id": "w9yxu", "text": "<math><msub><mrow><mi>K</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>&gt;</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><msub><mrow><mi>K</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "W0cRt", "text": "<math><msub><mrow><mi>K</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>&lt;</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><msub><mrow><mi>K</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></mfenced></math>", "image": null, "isCorrect": true}, {"id": "ofZfy", "text": "<math><msub><mrow><mi>K</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>3</mn><msub><mrow><mi>K</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "VnLtM", "text": "<math><msub><mrow><mi>K</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>3</mn><msub><mrow><mi>K</mi></mrow><mrow><mn>1</mn></mrow></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Eienstein's photoelectric equation is given as,<br/><br/> <math><msub><mrow><mi>K</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mi>h</mi><mi>c</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac></mrow></mfenced></math>     ...(i)<br/><br/>and <math><msub><mrow><mi>K</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mi>h</mi><mi>c</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac></mrow></mfenced></math>  ...(ii)<br/><br/>Dividing Equation (i) by Equation (ii), we get<br/><br/> <math><mfrac><mrow><msub><mrow><mi>K</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>K</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac></mrow><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac></mrow></mfrac></math> <br/><br/>Since, <math><msub><mrow><mi>λ</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>3</mn><msub><mrow><mi>λ</mi></mrow><mrow><mn>2</mn></mrow></msub></math> <br/><br/> <math><mfrac><mrow><msub><mrow><mi>K</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>K</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mn>3</mn><mi>λ</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac></mrow><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac></mrow></mfrac></math> <br/><br/> <math><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mn>3</mn><mi>λ</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mi> </mi><mfrac><mrow><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mfenced separators=\"|\"><mrow><mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mo>/</mo><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mrow></mrow></mfenced></mrow></mfrac></mrow></mfenced></mrow><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac></mrow></mfenced></mrow></mfrac></math> <br/><br/> <math><mfrac><mrow><msub><mrow><mi>K</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>K</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi> </mi><mfrac><mrow><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mfenced separators=\"|\"><mrow><mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mo>/</mo><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mrow></mrow></mfenced></mrow></mfrac></mrow></mfenced></mrow><mrow><mfenced separators=\"| arPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The work function of a metal is in the range of <math> <mtext>2&nbsp;</mtext><mtext> </mtext><mtext>eV</mtext><mtext> </mtext><mtext> </mtext><mtext>to</mtext><mtext> </mtext><mtext> </mtext><mtext>5</mtext><mtext> &nbsp;</mtext><mtext>eV</mtext></math>. Find which of the following wavelength of light cannot be used for photoelectric effect. (Consider, Planck's constant <math> <mo>=</mo><mtext>4</mtext><mo>×</mo><msup> <mtext>10</mtext> <mrow> <mo>−</mo><mtext>15</mtext></mrow> </msup> <mtext>&nbsp;eV-s</mtext> </math>, velocity of light <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>=3</mtext><mo>×</mo><msup><mtext>10</mtext><mn>8</mn></msup><mtext> </mtext><msup><mtext>m&nbsp;s</mtext><mtext>-1</mtext></msup></math>)", "image": null}, "options": [{"id": "7eBgi", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>510</mn><mo>&nbsp;</mo><mi>nm</mi></math>", "image": null, "isCorrect": false}, {"id": "x5LCC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>650</mn><mo>&nbsp;</mo><mi>nm</mi></math>", "image": null, "isCorrect": true}, {"id": "Z2UfL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>400</mn><mo>&nbsp;</mo><mi>nm</mi></math>", "image": null, "isCorrect": false}, {"id": "WiF4h", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>570</mn><mo>&nbsp;</mo><mi>nm</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given that, <math><mn>2</mn><mi>&nbsp;</mi><mi>e</mi><mi>V</mi><mi>&nbsp;</mi><mo>≤</mo><mi>ϕ</mi><mo>≤</mo><mn>5</mn><mi>&nbsp;</mi><mi>e</mi><mi>V</mi></math><br /><br />Wavelength corresponding to minimum and maximum values of work function are<br /><br /><math><msub><mrow><mi>λ</mi></mrow><mrow><mi>m</mi><mi>a</mi><mi>x</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mi>E</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>4</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>15</mn></mrow></msup><mo>×</mo><mn>3</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>8</mn></mrow></msup></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><br /><math><mo>=</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mn>6</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>7</mn></mrow></msup><mi>m</mi><mo>=</mo><mn>600</mn><mi>&nbsp;</mi><mi>n</mi><mi>m</mi></math><br /><br />And <math><msub><mrow><mi>λ</mi></mrow><mrow><mi>m</mi><mi>i</mi><mi>n</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mi>E</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>4</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>15</mn></mrow></msup><mo>×</mo><mn>3</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>8</mn></mrow></msup></mrow><mrow><mn>5</mn></mrow></mfrac></math><br /><br /><math><mo>=</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mn>2.4</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>7</mn></mrow></msup><mi>m</mi><mo>=</mo><mn>240</mn><mi>&nbsp;</mi><mi>n</mi><mi>m</mi></math><br /><br />Clearly wavelength range would be <math><mn>240</mn><mo>≤</mo><mi>λ</mi><mo>≤</mo><mn>600</mn></math><br /><br />Thus, wavelength 650 nm is not suitable for photoelectric effect.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86384d25e738877c55a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "16", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A certain metallic surface is illuminated with monochromatic light of wavelength&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi></math>. The stopping potential for photo-electric current for this light is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><msub><mi>V</mi><mn>0</mn></msub></math>. If the same surface is illuminated with light of wavelength <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>&#955;</mi></math>, the stopping potential is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>0</mn></msub></math>. The threshold wavelength for this surface for the photoelectric effect is", "image": null}, "options": [{"id": "vprkH", "text": "<math><mn>6</mn><mi mathvariant=\"normal\">λ</mi></math>", "image": null, "isCorrect": false}, {"id": "PjJhu", "text": "<math><mn>4</mn><mi mathvariant=\"normal\">λ</mi></math>", "image": null, "isCorrect": true}, {"id": "CLZxh", "text": "<math><mfrac><mrow><mi mathvariant=\"normal\">λ</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "phk8G", "text": "<math><mfrac><mrow><mi mathvariant=\"normal\">λ</mi></mrow><mrow><mn>6</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Using Einstein's photoelectric equation</p><p><math><mi mathvariant=\"normal\">e</mi><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mi mathvariant=\"normal\">s</mi></mrow></msub><mo>=</mo><mi mathvariant=\"normal\">E</mi><mo>-</mo><mi mathvariant=\"normal\">ϕ</mi></math><br /><br /><math><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mi mathvariant=\"normal\">s</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">c</mi></mrow><mrow><mi mathvariant=\"normal\">λ</mi><mi mathvariant=\"normal\">e</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">c</mi></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">λ</mi></mrow><mrow><mn>0</mn></mrow></msub><mi mathvariant=\"normal\">e</mi></mrow></mfrac></math><br /><br /><math><mn>3</mn><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">c</mi></mrow><mrow><mi mathvariant=\"normal\">λ</mi><mi mathvariant=\"normal\">e</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">c</mi></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">λ</mi></mrow><mrow><mn>0</mn></mrow></msub><mi mathvariant=\"normal\">e</mi></mrow></mfrac></math> ...(i)<br /><br /><math><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">c</mi></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">λ</mi><mi mathvariant=\"normal\">e</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">c</mi></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">λ</mi></mrow><mrow><mn>0</mn></mrow></msub><mi mathvariant=\"normal\">e</mi></mrow></mfrac><mi mathvariant=\"normal\">&nbsp;</mi></math> ...(ii)<br /><br />by solving (i) and (ii)<br /><br /><math><mn>0</mn><mo>=</mo><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">c</mi></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">λ</mi><mi mathvariant=\"normal\">e</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">hc</mi></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">λ</mi></mrow><mrow><mn>0</mn></mrow></msub><mi mathvariant=\"normal\">e</mi></mrow></mfrac></math><br /><br /><math><msub><mrow><mi mathvariant=\"normal\">λ</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mn>4</mn><mi mathvariant=\"normal\">λ</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638457198f61e2f9aa", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "24", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The electric field associated with a light wave is given by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">E</mi><mo>=</mo><msub><mi mathvariant=\"normal\">E</mi><mn>0</mn></msub><mi>sin</mi><mo>⁡</mo><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfenced separators=\"|\"><mrow><mn>1</mn><mo>.57</mo><mo>×</mo><msup><mn>10</mn><mn>7</mn></msup></mrow></mfenced><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">x</mi><mo>-</mo><mi>ct</mi></mrow></mfenced></mrow></mfenced></math> (where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">t</mi></math> are in metre and second respectively). This light is used in an experiment on photoelectric effect with the emitter having work function <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">ϕ</mi><mo>=</mo><mtext>1.9</mtext><mi mathvariant=\"normal\">&nbsp;</mi><mn>e</mn><mi mathvariant=\"normal\">V</mi></math>. What is the maximum kinetic energy (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>eV</mi></math>) of the ejected photoelectron? [Take&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">π</mi><mo>=</mo><mn>3</mn><mo>.</mo><mn>14</mn></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>hc</mi><mo>=</mo><mn>12400</mn><mo>&nbsp;</mo><mi>eV</mi><mo>&nbsp;</mo><mover><mi mathvariant=\"normal\">A</mi><mo>∘</mo></mover></math>]", "image": null}, "options": [], "correctValue": "1.2", "solution": {"text": "Given, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">E</mi><mo>=</mo><msub><mi mathvariant=\"normal\">E</mi><mn>0</mn></msub><mi>sin</mi><mo>⁡</mo><mfenced separators=\"|\"><mrow><mn>1</mn><mo>.57</mo><mo>×</mo><msup><mn>10</mn><mn>7</mn></msup></mrow></mfenced><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">x</mi><mo>-</mo><mi>ct</mi></mrow></mfenced></math> ...(i)<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mi mathvariant=\"normal\">E</mi><mo>=</mo><msub><mi mathvariant=\"normal\">E</mi><mn>0</mn></msub><mi>sin</mi><mo>⁡</mo><mfrac><mi mathvariant=\"normal\">ω</mi><mi mathvariant=\"normal\">c</mi></mfrac><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">x</mi><mo>-</mo><mi>ct</mi></mrow></mfenced></math> ...(ii)<br /><br />On comparing equations (i) and (ii), we get<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">ω</mi><mi mathvariant=\"normal\">c</mi></mfrac><mo>=</mo><mn>1</mn><mo>.57</mo><mo>×</mo><msup><mn>10</mn><mn>7</mn></msup></math><br />&nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mi mathvariant=\"normal\">π</mi><mn>2</mn></mfrac><mo>×</mo><msup><mn>10</mn><mn>7</mn></msup></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">λ</mi><mo>=</mo><mn>4</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>7</mn></mrow></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math><br />&nbsp;&nbsp;<math><mo>=</mo><mn>400</mn><mi>&nbsp;</mi><mn>n</mn><mn>m</mn></math><br /><br />As, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">ϕ</mi><mn>0</mn></msub><mo>=</mo><mfrac><mi>hc</mi><mi mathvariant=\"normal\">λ</mi></mfrac><mo>-</mo><msub><mi mathvariant=\"normal\">E</mi><mi mathvariant=\"normal\">K</mi></msub></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>1.9</mtext><mo>=</mo><mfrac><mn>1240</mn><mn>400</mn></mfrac><mo>-</mo><msub><mi mathvariant=\"normal\">E</mi><mi mathvariant=\"normal\">K</mi></msub></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">E</mi><mi mathvariant=\"normal\">K</mi></msub><mo>=</mo><mfenced separators=\"|\"><mrow><mtext>3.1</mtext><mo>-</mo><mtext>1.9</mtext></mrow></mfenced><mi mathvariant=\"normal\">&nbsp;</mi><mi>eV</mi><mo>=</mo><mtext>1.2</mtext><mi mathvariant=\"normal\">&nbsp;</mi><mn>e</mn><mn>V</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863830a7523649ec70b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "99", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The surface of the metal is illuminated with the light of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>400</mn><mo>&nbsp;</mo><mi>nm</mi></math>. The kinetic energy of the ejected photoelectrons was found to be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>68</mn><mo>&nbsp;</mo><mi>eV</mi></math>, the work function of the metal is", "image": null}, "options": [{"id": "f0vpx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>51</mn><mo>&#160;</mo><mi>eV</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 105px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "LlrrG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>42</mn><mo>&#160;</mo><mi>eV</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 118px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "UWkSh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>.</mo><mn>0</mn><mo>&#160;</mo><mi>eV</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 87px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "XeELK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>68</mn><mo>&#160;</mo><mi>eV</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 142px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As we know<br /><br /><math><msub><mrow><mi>&#981;</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mi>&#955;</mi></mrow></mfrac><mo>-</mo><msub><mrow><mi>E</mi></mrow><mrow><mi>k</mi></mrow></msub></math> (Einstein&#39;s equation)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><msub><mi>&#981;</mi><mn>0</mn></msub><mo>=</mo><mfrac><mrow><mn>1240</mn><mo>&#160;</mo><mi>eV</mi><mo>&#160;</mo><mi>nm</mi></mrow><mrow><mn>400</mn><mo>&#160;</mo><mi>nm</mi></mrow></mfrac><mo>-</mo><mn>1</mn><mo>.68</mo><mo>&#160;</mo><mi>eV</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>&#160;&#160;</mo><mi mathvariant=\"normal\">&#160;</mi><mn>3</mn><mo>.1</mo><mo>-</mo><mn>1</mn><mo>.68</mo><mo>=</mo><mn>1</mn><mo>.42</mo><mo>&#160;</mo><mi>eV</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638063b14efe0e4ed0", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "61", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The graph between frequency of incident radiations and stopping potential for a given photosensitive material is as follows.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/jee_phys3.png\" style=\"width: 200px; height: 178px;\" /><br />\rWhat information can be obtained from the value of the intercept on the potential axis?", "image": null}, "options": [{"id": "QVlaP", "text": "Work function", "image": null, "isCorrect": true}, {"id": "cINkZ", "text": "KE of electrons", "image": null, "isCorrect": false}, {"id": "iOT5g", "text": "Stopping potential", "image": null, "isCorrect": false}, {"id": "SWP49", "text": "Frequency of photon", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Graph between frequency of incident radiation and stopping potential for a given photosensitive surface is shown below:</span></p><p><span><img alt=\"\" height=\"238\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/IL0003449_AnsExp1_1.png\" width=\"324\" /></span></p><p><span>Intercept on the potential axis &nbsp;<math> <mrow> <mo>=</mo><mo>&minus;</mo><mfrac> <mrow> <msub> <mi>W</mi> <mn>0</mn> </msub> </mrow> <mi>e</mi> </mfrac> </mrow> </math> </span></p><p align=\"left\" style=\"text-align:left;\"><span style=\"position:relative;top:0.0pt\">&nbsp;<math> <mo>&there4;</mo> </math> </span><span>&nbsp;&nbsp;Work function, &nbsp;<math> <mrow> <msub> <mi>W</mi> <mn>0</mn> </msub> <mo>=</mo><mi>e</mi><mo>&times;</mo> </mrow> </math> Magnitude of intercept on the potential axis.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637b9037dd0f311a66", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "83", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A <math> <mrow> <mn>100</mn><mtext> </mtext><mtext>W</mtext></mrow> </math> sodium lamp radiates energy uniformly in all directions. The wavelength of the sodium light is <math> <mrow> <mn>589</mn><mtext>&nbsp;nm</mtext></mrow></math>. What is the energy per photon in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>eV</mi><mo>)</mo></math> associated with the sodium light? [ <math>&nbsp;<mrow><mtext>h&nbsp;=&nbsp;6</mtext><msup> <mrow> <mtext>.63&nbsp;×&nbsp;10</mtext></mrow> <mrow> <mtext>-34</mtext></mrow> </msup> <mtext>&nbsp;J s</mtext></mrow></math> ]", "image": null}, "options": [{"id": "3vrIp", "text": "<math> <mrow> <mtext>2</mtext><mtext>.11</mtext></mrow> </math>", "image": null, "isCorrect": true}, {"id": "ucGEM", "text": "<math><mrow><mtext>1.22</mtext></mrow> </math>", "image": null, "isCorrect": false}, {"id": "IH8rK", "text": "<math> <mtext>0.5</mtext> </math>", "image": null, "isCorrect": false}, {"id": "aIGEC", "text": "<math> <mtext>3.21</mtext></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, power of the lamp, <math> <mrow> <mtext>P&#160;=&#160;100&#160;W</mtext></mrow> </math><br /><br />The wavelength of the sodium light, <math> <mrow> <mi>&#955;</mi> <mo>=</mo> <mn>5</mn> <mn>8</mn> <mn>9</mn></mrow></math> <math> <mrow> <mtext>nm&#160;=&#160;589&#160;</mtext><mo>&#215;</mo><msup> <mrow> <mtext>&#160;10</mtext></mrow> <mrow> <mo>&#8722;</mo><mn>9</mn></mrow> </msup> <mtext>&#160;m</mtext></mrow> </math><br /><br />Planck constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">h</mtext><mtext>&#160;=&#160;6</mtext><msup><mtext>.63&#160;&#215;&#160;10</mtext><mtext>-34</mtext></msup><mtext>&#160;J&#160;s</mtext></math><br /><br />The energy of each photon<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">E</mtext><mo>=</mo><mfrac><mtext mathvariant=\"italic\">hc</mtext><mi mathvariant=\"italic\">&#955;</mi></mfrac><mo>=</mo><mfrac><mrow><mn>6</mn><mtext>.</mtext><mn>6</mn><mn>3</mn><mo>&#215;</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>-</mo><mn>3</mn><mn>4</mn></mrow></msup><mo>&#215;</mo><mn>3</mn><mo>&#215;</mo><mn>1</mn><msup><mn>0</mn><mn>8</mn></msup></mrow><mrow><mn>5</mn><mn>8</mn><mn>9</mn><mo>&#215;</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>-</mo><mn>9</mn></mrow></msup></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>&#8757;&#160;&#160;</mo><mtext>c</mtext><mo>=</mo><mn>3</mn><mo>&#215;</mo><mn>1</mn><msup><mn>0</mn><mn>8</mn></msup><msup><mtext>&#160;m&#160;s</mtext><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced></math><br /><br /><math><mrow><mo>=</mo> <mn>3</mn> <mtext>.</mtext> <mn>3</mn> <mn>8</mn> <mo>&#215;</mo> <mn>1</mn> <msup> <mn>0</mn> <mrow> <mo>-</mo> <mn>1</mn> <mn>9</mn> </mrow> </msup> <mtext>&#160;J</mtext> </mrow> </math><br /><br /><math><mrow><mo>=</mo> <mfrac> <mrow> <mn>3</mn> <mtext>.</mtext> <mn>3</mn> <mn>8</mn> <mo>&#215;</mo> <mn>1</mn> <msup> <mn>0</mn> <mrow> <mo>-</mo> <mn>1</mn> <mn>9</mn> </mrow> </msup> </mrow> <mrow> <mn>1</mn> <mtext>.</mtext> <mn>6</mn> <mo>&#215;</mo> <mn>1</mn> <msup> <mn>0</mn> <mrow> <mo>-</mo> <mn>1</mn> <mn>9</mn></mrow></msup></mrow></mfrac></mrow></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>eV</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>=&#160;2</mtext><mtext>.11</mtext></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>eV</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863769c82e6810626c5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "19", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In a photoelectric experiment, the relation between the applied potential difference&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">V</mi></math>&nbsp;and the photoelectric current <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi></math> was found to be as shown in the graph below. If the work function of the cathode plate is <math> <mrow> <mn>28.8</mn><mtext>&nbsp;eV</mtext></mrow>&nbsp;</math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">h</mi><mo>=</mo><mn>6</mn><mo>.6</mo><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>34</mn><mo>&nbsp;</mo></mrow></msup><mi mathvariant=\"normal\">J</mi><mo>&nbsp;</mo><mi mathvariant=\"normal\">s</mi></math>, the frequency of incident radiation would be nearly <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>in</mi><mi mathvariant=\"normal\">&nbsp;</mi><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>)</mo></math><br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/61401.JPG\" style=\"width: 300px; height: 190px;\" />", "image": null}, "options": [{"id": "trpQB", "text": "<math><mn>0.436</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>18</mn></mrow></msup></math> <math> <mrow>  <mtext>Hz</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "G106O", "text": "<math><mn>0.436</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>17</mn></mrow></msup></math> <math> <mrow>  <mtext>Hz</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "XyEk9", "text": "<math><mn>0.775</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>16</mn></mrow></msup></math> <math> <mrow> <mtext>Hz</mtext></mrow> </math>", "image": null, "isCorrect": true}, {"id": "eLoZ3", "text": "<math><mn>0.775</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>15</mn></mrow></msup></math> <math> <mrow> <mtext>Hz</mtext></mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the photoelectric effect,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>hf</mi><mo>=</mo><mi mathvariant=\"normal\">ϕ</mi><mo>+</mo><msub><mi>KE</mi><mi>max</mi></msub></math><br /><br />From the graph <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>KE</mi><mi>max</mi></msub><mo>=</mo><mn>3</mn><mo>.2</mo><mtext> eV</mtext></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mi>hf</mi><mo>=</mo><mrow><mo>(</mo><mn>28</mn><mo>.8</mo><mo>+</mo><mn>3</mn><mo>.2</mo><mo>)</mo></mrow><mtext> eV</mtext></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">f</mi><mo>=</mo><mfrac><mn>32</mn><mi mathvariant=\"normal\">h</mi></mfrac><mtext>&nbsp;eV</mtext><mo>=</mo><mtext>  </mtext><mfrac><mrow><mn>32</mn><mo>×</mo><mn>1</mn><mo>.6</mo><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>19</mn></mrow></msup></mrow><mrow><mn>6</mn><mo>.6</mo><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>34</mn></mrow></msup></mrow></mfrac><mtext>&nbsp;Hz</mtext></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>0</mn><mo>.775</mo><mo>×</mo><msup><mn>10</mn><mn>16</mn></msup><mtext>&nbsp;Hz</mtext></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86374d96b4160f58cbd", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "67", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A photon of energy <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10.2</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi>eV</mi></math> corresponds to light of wavelength <math><msub><mrow><mi>λ</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>.</mo></math> Due to an electron transition from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>=</mo><mn>2</mn></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>=</mo><mn>1</mn></math> in a hydrogen atom, the light of wavelength <math><mi>λ</mi></math> is emitted. If we take into account the recoil of the atom when the photon is emitted, then", "image": null}, "options": [{"id": "6Gxg3", "text": "<math><mi>λ</mi><mo>&lt;</mo><msub><mrow><mi>λ</mi></mrow><mrow><mn>0</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "ECjN2", "text": "<math><mi>λ</mi><mo>&gt;</mo><msub><mrow><mi>λ</mi></mrow><mrow><mn>0</mn></mrow></msub></math>", "image": null, "isCorrect": true}, {"id": "STx1Y", "text": "<math><mi>λ</mi><mo>=</mo><msub><mrow><mi>λ</mi></mrow><mrow><mn>0</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "VeTJc", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Without recoil of the atom, the entire energy is carried away by the photon.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><msub><mi>&#955;</mi><mn>0</mn></msub></mfrac><mo>=</mo><mn>10.</mn><mn>2</mn><mo>&#160;</mo><mi>eV</mi></math><br /><br />With recoil of the atom, energy is shared between photon and atom. So, the energy of the photon is less, hence its wavelength is more.<br /><br /><math><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mi>&#955;</mi></mrow></mfrac><mo>&#60;</mo><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><msub><mrow><mi>&#955;</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac></math><br /><br /><math><mo>&#8756;</mo><msub><mrow><mi>&#955;</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>&#60;</mo><mi>&#955;</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863746f2f834c1b8bc1", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "87", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If <math><msub><mrow><mi>n</mi></mrow><mrow><mi>R</mi></mrow></msub></math> and <math><msub><mrow><mi>n</mi></mrow><mrow><mi>V</mi></mrow></msub></math> denote the number of photons emitted by a red bulb and violet bulb of equal power in a given time, then", "image": null}, "options": [{"id": "yLB4G", "text": "<math><msub><mrow><mi>n</mi></mrow><mrow><mi>R</mi></mrow></msub><mo>=</mo><msub><mrow><mi>n</mi></mrow><mrow><mi>V</mi></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "u0Tzr", "text": "<math><msub><mrow><mi>n</mi></mrow><mrow><mi>R</mi></mrow></msub><mo>&gt;</mo><msub><mrow><mi>n</mi></mrow><mrow><mi>V</mi></mrow></msub></math>", "image": null, "isCorrect": true}, {"id": "VsewM", "text": "<math><msub><mrow><mi>n</mi></mrow><mrow><mi>R</mi></mrow></msub><mo>&lt;</mo><msub><mrow><mi>n</mi></mrow><mrow><mi>V</mi></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "Z3YJs", "text": "<math><msub><mrow><mi>n</mi></mrow><mrow><mi>R</mi></mrow></msub> <mo>≤</mo> <msub><mrow><mi>n</mi></mrow><mrow><mi>V</mi></mrow></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Energy possessed by a photon is given by<br /><br /><math><mi>E</mi><mo>=</mo><mi>h</mi><mi>f</mi><mo>=</mo><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mi>λ</mi></mrow></mfrac></math><br /><br />If power of each bulb is <math><mi>P</mi></math> then energy given out in <math><mi>time t</mi></math>&nbsp;equal to <math><mi>P</mi><mi>t</mi><mo>.</mo></math> Let the number of photons be <math><mi>n</mi></math>, then<br /><br /><math><mi>n</mi><mo>=</mo><mfrac><mrow><mi>P</mi><mi>t</mi></mrow><mrow><mi>E</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>P</mi><mi>t</mi></mrow><mrow><mo>(</mo><mi>h</mi><mi>c</mi><mo>/</mo><mi>λ</mi><mo>)</mo></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>P</mi><mi>t</mi><mi>λ</mi></mrow><mrow><mi>h</mi><mi>c</mi></mrow></mfrac></math><br /><br />For red light, <math><msub><mrow><mi>n</mi></mrow><mrow><mi>R</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>P</mi><mi>t</mi><msub><mrow><mi>λ</mi></mrow><mrow><mi>R</mi></mrow></msub></mrow><mrow><mi>h</mi><mi>c</mi></mrow></mfrac></math><br /><br />For violet light, <math><msub><mrow><mi>n</mi></mrow><mrow><mi>V</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>P</mi><mi>t</mi><msub><mrow><mi>λ</mi></mrow><mrow><mi>V</mi></mrow></msub></mrow><mrow><mi>h</mi><mi>c</mi></mrow></mfrac></math><br /><br /><math><mo>∴&nbsp;&nbsp;&nbsp;</mo><mfrac><mrow><msub><mrow><mi>n</mi></mrow><mrow><mi>R</mi></mrow></msub></mrow><mrow><msub><mrow><mi>n</mi></mrow><mrow><mi>V</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mi>R</mi></mrow></msub></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mi>V</mi></mrow></msub></mrow></mfrac></math><br /><br />As <math><msub><mrow><mi>λ</mi></mrow><mrow><mi>R</mi></mrow></msub><mo>&gt;</mo><msub><mrow><mi>λ</mi></mrow><mrow><mi>V</mi></mrow></msub></math><br /><br />So, <math><msub><mrow><mi>n</mi></mrow><mrow><mi>R</mi></mrow></msub><mo>&gt;</mo><msub><mrow><mi>n</mi></mrow><mrow><mi>V</mi></mrow></msub></math>", "image": null}, "videoSolution": null
