rmal\">&#981;</mi></math><br /><br />On putting this Eqn. (ii)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mi>mv</mi><mrow><mi mathvariant=\"normal\">&#8242;</mi><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><mfenced separators=\"|\"><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mi>mv</mi><mn>2</mn></msup><mo>+</mo><mi mathvariant=\"normal\">&#981;</mi></mrow></mfenced><mo>-</mo><mi mathvariant=\"normal\">&#981;</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">v</mi><msup><mo>'</mo><mn>2</mn></msup><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><msup><mi mathvariant=\"normal\">v</mi><mn>2</mn></msup><mo>+</mo><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">&#981;</mi></mrow><mrow><mn>3</mn><mi mathvariant=\"normal\">m</mi></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">v</mi><mo>'</mo><mo>&#62;</mo><msqrt><mfrac><mn>4</mn><mn>3</mn></mfrac></msqrt><mi mathvariant=\"normal\">v</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634f7dbe72fa598368", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "101", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Consider the two following statements I and II, and identify the correct choice given in the answers<br />\r1. In photovoltaic cells, the photoelectric current produced is not proportional to the intensity of incident light.<br />\r2. In gas-filled photoemissive cells, the velocity of photoelectrons depends on the wavelength of the incident radiation.", "image": null}, "options": [{"id": "bWNJ1", "text": "Both 1 and 2 are true", "image": null, "isCorrect": false}, {"id": "LMwm3", "text": "Both 1 and 2 are false", "image": null, "isCorrect": false}, {"id": "lHy6M", "text": "1 is true but 2 is false", "image": null, "isCorrect": false}, {"id": "gnGKK", "text": "1 is false but 2 is true", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In photovoltaic cells, photoelectric current produced is proportional to the intensity of incident light, so the statement <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math> is false.<br /><br />The velocity of photoelectrons depends upon the maximum kinetic energy of photoelectrons, which depends on the frequency and hence on the wavelength of incident radiation, so the statement <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math> is true.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634f3a56d6578ceb89", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "106", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In a photoelectric experiment, a parallel beam of monochromatic light with the power of <math> <mrow> <mn>200</mn><mtext> </mtext><mtext> </mtext><mtext>W</mtext></mrow> </math> is incident on a perfectly absorbing cathode of work function <math><mn>6.25</mn><mi>&nbsp;</mi><mi>eV</mi></math>. The frequency of light is just above the threshold frequency so that the photoelectrons are emitted with negligible kinetic energy. Assume that the photoelectron emission efficiency is 100%. A potential difference of <math> <mrow> <mn>500</mn><mtext> </mtext><mtext> </mtext><mtext>V</mtext></mrow> </math> is applied between the cathode and the anode. All the emitted electrons are incident normally on the anode and are absorbed. The anode experiences a force <math><mi>F</mi><mo>=</mo><mi>n</mi><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>4</mn></mrow></msup><mn>&nbsp;N</mn></math> due to the impact of the electrons. The value of <math> <mi>n</mi> </math> is __________. Mass of the electron <math><msub><mrow><mi>m</mi></mrow><mrow><mi>e</mi></mrow></msub><mo>=</mo><mn>9</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>31</mn></mrow></msup><mi>&nbsp;kg</mi><mi>&nbsp;</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">d</mi><mi>&nbsp;</mi><mn>1.0</mn><mi>&nbsp;</mi><mi>eV</mi><mo>=</mo><mn>1.6</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>19</mn></mrow></msup><mi>&nbsp;J</mi></math>.", "image": null}, "options": [], "correctValue": "24", "solution": {"text": "Power <math><mo>=</mo><mi>N</mi><mi>h</mi><mi>ν</mi></math><br /><br /><math><mi>N</mi><mo>=</mo></math> number of photons per second<br /><br />Since <math><mi>K</mi><mi>E</mi><mo>=</mo><mn>0</mn><mo>,</mo><mi>h</mi><mi>ν</mi><mo>=</mo><mi>ϕ</mi></math><br /><br /><math><mn>200</mn><mo>=</mo><mi>N</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mn>6.25</mn><mo>×</mo><mn>1.6</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>19&nbsp;</mn></mrow></msup><mi mathvariant=\"normal\">&nbsp;J</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">e</mi></mrow></mfenced></math><br /><br /><math><mi>N</mi><mo>=</mo><mfrac><mrow><mn>200</mn></mrow><mrow><mn>6.25</mn><mo>×</mo><mn>1.6</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>19</mn></mrow></msup></mrow></mfrac></math><br /><br />As photon is just above threshold frequency <math><mi>K</mi><msub><mrow><mi>E</mi></mrow><mrow><mi>m</mi><mi>a</mi><mi>x</mi></mrow></msub></math> is zero and they are accelerated by potential difference of <math><mn>500</mn><mi>&nbsp;V</mi></math><br /><br /><math><mi>K</mi><msub><mrow><mi>E</mi></mrow><mrow><mi>f</mi></mrow></msub><mo>=</mo><mi>q</mi><mi>∆</mi><mi>V</mi></math><br /><br /><math><mfrac><mrow><msup><mrow><mi>P</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><mi>m</mi></mrow></mfrac><mo>=</mo><mi>q</mi><mi>∆</mi><mi>V</mi><mo>⇒</mo><mi>P</mi><mo>=</mo><msqrt><mn>2</mn><mi>m</mi><mi>q</mi><mi>∆</mi><mi>V</mi></msqrt></math><br /><br />Since efficiency is 100%, number of electrons emitted is equal to number of photons falling per second as electrons are completely absorbed, force exerted <math><mi>n</mi><mi>m</mi><mi>v</mi></math><br /><br /><math><mo>=</mo><mi>&nbsp;</mi><mfrac><mrow><mn>200</mn></mrow><mrow><mn>6.25</mn><mo>×</mo><mn>1.6</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>19</mn></mrow></msup></mrow></mfrac><mo>×</mo><msqrt><mn>2</mn><mfenced separators=\"|\"><mrow><mn>9</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>31</mn></mrow></msup></mrow></mfenced><mo>×</mo><mn>1.6</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>19</mn></mrow></msup><mo>×</mo><mn>500</mn></msqrt></math><br /><br /><math><mo>=</mo><mi>&nbsp;</mi><mfrac><mrow><mn>3</mn><mo>×</mo><mn>200</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>25</mn></mrow></msup><mo>×</mo><msqrt><mn>1600</mn></msqrt></mrow><mrow><mn>6.25</mn><mo>×</mo><mn>1.6</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>19</mn></mrow></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mo>×</mo><mn>40</mn></mrow><mrow><mn>6.25</mn><mo>×</mo><mn>1.6</mn></mrow></mfrac><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>4</mn></mrow></msup><mo>×</mo><mn>3</mn><mo>=</mo><mn>24</mn><mrow> <mo>×</mo><msup> <mrow> <mn>10</mn></mrow> <mrow> <mo>−</mo><mn>4</mn></mrow> </msup> </mrow></m bhyas Paper", "value": "12", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The maximum kinetic energy of photoelectrons emitted from a metal surface increases from&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>4</mn><mo>&#160;</mo><mi>eV</mi></math>&nbsp;to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>2</mn><mo>&#160;</mo><mi>eV</mi></math>&nbsp;when the frequency of the incident radiation is increased by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>%</mo></math>. What is the work function (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>eV</mi></math>) of the metal surface?", "image": null}, "options": [], "correctValue": "1.6", "solution": {"text": "<p>According to Einstein&#39;s photoelectric equation,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mi>max</mi></msub><mo>=</mo><mi>h</mi><mi>&#965;</mi><mo>-</mo><msub><mi>&#981;</mi><mn>0</mn></msub></math></p><p>where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mi>max</mi></msub></math>&nbsp;is the maximum kinetic energy of photoelectrons and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#981;</mi><mn>0</mn></msub></math>&nbsp;is the work function of the metal surface</p><p>Initially,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><mi>&#965;</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>4</mn><mo>+</mo><msub><mi>&#981;</mi><mn>0</mn></msub></math></p><p>When the frequency is increased by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>%</mo></math>, then</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>4</mn><mi>h</mi><mi>&#965;</mi><mo>=</mo><mn>1</mn><mo>.</mo><mn>2</mn><mo>+</mo><msub><mi>&#981;</mi><mn>0</mn></msub></math></p><p>On solving we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#981;</mi><mn>0</mn></msub><mo>=</mo><mn>1</mn><mo>.</mo><mn>6</mn><mo>&#160;</mo><mi>eV</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632f52d05f28c39c20", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "86", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In an experiment on photoelectric emission from a metallic surface, the wavelength of incident light is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>7</mn></mrow></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>&nbsp;and stopping potential is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>. The threshold frequency of the metal (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Hz</mi></math> ) approximately is (charge on electron <math><mi>e</mi><mo>=</mo><mn>1.6</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>19</mn></mrow></msup></math> C, Planck's constant <math><mi>h</mi><mo>=</mo><mn>6.6</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>34</mn></mrow></msup></math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">J</mi><mo>&nbsp;</mo><mi mathvariant=\"normal\">s</mi></math>)", "image": null}, "options": [{"id": "UWTqO", "text": "<math><mn>12</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>15</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "pfgkm", "text": "<math><mn>9</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>15</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "hTGA3", "text": "<math><msup><mrow><mn>9</mn><mo>×</mo><mn>10</mn></mrow><mrow><mn>14</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "PbPEd", "text": "<math><mn>12</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>13</mn></mrow></msup><mi> </mi><mi> </mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>e</mi><msub><mi>V</mi><mn>0</mn></msub><mo>=</mo><mi>h</mi><mi>&#957;</mi><mo>-</mo><mi>h</mi><msub><mi>&#957;</mi><mn>0</mn></msub></math><br /><br /><math><mo>&#8756;</mo></math> Threshold frequency,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#957;</mi><mn>0</mn></msub><mo>=</mo><mi>v</mi><mo>-</mo><mfrac><mrow><mi>e</mi><msub><mi>V</mi><mn>0</mn></msub></mrow><mi>h</mi></mfrac></math><br /><br />= <math><mfrac><mrow><mi>c</mi></mrow><mrow><mi>&#955;</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mi>e</mi><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mi>h</mi></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><msub><mi>&#957;</mi><mn>0</mn></msub><mo>=</mo><mfrac><mrow><mn>3</mn><mo>&#215;</mo><msup><mn>10</mn><mn>8</mn></msup></mrow><mrow><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>7</mn></mrow></msup></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1.6</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>19</mn></mrow></msup><mo>&#215;</mo><mn>2.5</mn></mrow><mrow><mn>6.6</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>34</mn></mrow></msup></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mn>9</mn><mo>.0</mo><mo>&#215;</mo><msup><mn>10</mn><mn>14</mn></msup><mi mathvariant=\"normal\">&#160;</mi><mi>Hz</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632522b9166e6ad9ea", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "59", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "When light of wavelength <math><msup><mrow><mi>λ</mi></mrow></msup></math>&nbsp;is incident on photosensitive surface, the stopping potential is <math><msup><mrow><mi>V</mi></mrow></msup></math>. When light of wavelength <math><mn>3</mn><mi>λ</mi></math>&nbsp;is incident on same surface, the stopping potential is <math><mfrac><mrow><msup><mrow><mi>V</mi></mrow></msup></mrow><mrow><mn>6</mn></mrow></mfrac><mo>.</mo></math> Threshold wavelength for the surface is", "image": null}, "options": [{"id": "HOQQU", "text": "<math><mn>2</mn><mi>λ</mi></math>", "image": null, "isCorrect": false}, {"id": "WuwoL", "text": "<math><mn>3</mn><mi>λ</mi></math>", "image": null, "isCorrect": false}, {"id": "bevFF", "text": "<math><mn>4</mn><mi>λ</mi></math>", "image": null, "isCorrect": false}, {"id": "FuLgB", "text": "<math><mn>5</mn><mi>λ</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Using <math><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mi>λ</mi></mrow></mfrac><mo>-</mo><mi>ϕ</mi><mo>=</mo><mi>e</mi><mi>V</mi></math><br /><br />When, wavelength <math><mi>λ</mi></math> is incident on metallic surface, the sopping potential required to stop most energetic electron is <math><mi>V</mi></math> and when wavelength increases to <math><mn>3</mn><mi>λ</mi></math> , stopping potential required as <math><mfrac><mrow><mi>V</mi></mrow><mrow><mn>6</mn></mrow></mfrac></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mi>λ</mi></mrow></mfrac><mo>=</mo><mi>e</mi><mi>V</mi><mo>+</mo><mi>ϕ</mi></math> ..... (i)<br /><br />And <math><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mn>3</mn><mi>λ</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>e</mi><mi>V</mi></mrow><mrow><mn>6</mn></mrow></mfrac><mo>+</mo><mi>ϕ</mi></math> .... (ii)<br /><br />Thus equation (ii) can be rewritten as <math><mfrac><mrow><mn>2</mn><mi>h</mi><mi>c</mi></mrow><mrow><mi>λ</mi></mrow></mfrac><mo>=</mo><mi>e</mi><mi>V</mi><mo>+</mo><mn>6</mn><mi>ϕ</mi></math> ..... (iii)<br /><br />Subtracting equation (i) from (iii) we get<br /><br /><math><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mi>λ</mi></mrow></mfrac><mo>=</mo><mn>5</mn><mi>ϕ</mi></math> and <math><mi>ϕ</mi><mo>=</mo><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac></math><br /><br />Thus <math><msub><mrow><mi>λ</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mn>5</mn><mi>λ</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863224ff33d2c8faef3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "64", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A light of intensity <math><mn>16</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">W</mi></math> and energy of each photon&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">V</mi></math> incident on a metal plate of work function <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&nbsp;</mo><mi>eV</mi></math> and area <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math> then find the maximum kinetic energy of emitted electrons and the number of photoelectrons emitted per second if photon efficiency is <math><mn>10</mn><mi>%.</mi></math>", "image": null}, "options": [{"id": "CGgqy", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#160;</mo><mi>eV</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><msup><mn>10</mn><mn>11</mn></msup></math>", "image": null, "isCorrect": true}, {"id": "xmQsY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mi mathvariant=\"normal\">&#160;</mi><mi>eV</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><msup><mn>10</mn><mn>12</mn></msup></math>", "image": null, "isCorrect": false}, {"id": "99EFz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mi mathvariant=\"normal\">&#160;</mi><mi>eV</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><msup><mn>10</mn><mn>13</mn></msup></math>", "image": null, "isCorrect": false}, {"id": "8Ob0O", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mi mathvariant=\"normal\">&#160;</mi><mi>eV</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><msup><mn>10</mn><mn>14</mn></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Maximum <math><mi>K</mi><mi>E</mi><mo>=</mo><mfrac><mrow><mi>h</mi><mi>C</mi></mrow><mrow><mi>&#955;</mi></mrow></mfrac><mo>-</mo><mi>&#981;</mi></math><br /><br /><math><mo>=</mo><mn>10</mn><mo>-</mo><mn>5</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>5</mn><mo>&#160;</mo><mi>eV</mi></math><br /><br />Intensity <math><mi>I</mi><mo>=</mo><mfrac><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>N</mi></mrow><mrow><mi>p</mi></mrow></msub></mrow></mfenced><mfrac><mrow><mi>h</mi><mi>C</mi></mrow><mrow><mi>&#955;</mi></mrow></mfrac></mrow><mrow><mi>t</mi><mi>A</mi></mrow></mfrac><mo>&#8658;</mo><mfrac><mrow><msub><mrow><mi>N</mi></mrow><mrow><mi>p</mi></mrow></msub></mrow><mrow><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>I</mi><mi>A</mi></mrow><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>h</mi><mi>C</mi></mrow><mrow><mi>&#955;</mi></mrow></mfrac></mrow></mfenced></mrow></mfrac></math><br /><br />and the number of emitted photoelectrons per second. <math><mo>=</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><msub><mrow><mi>N</mi></mrow><mrow><mi>p</mi></mrow></msub></mrow><mrow><mi>t</mi></mrow></mfrac></mrow></mfenced><mo>&#215;</mo><mn>10</mn><mi>%</mi></math><br /><br /><math><mo>=</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>I</mi><mi>A</mi></mrow><mrow><mfrac><mrow><mi>h</mi><mi>C</mi></mrow><mrow><mi>&#955;</mi></mrow></mfrac></mrow></mfrac></mrow></mfenced><mo>&#215;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>10</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>16</mn><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>4</mn></mrow></msup></mrow><mrow><mn>10</mn><mo>&#215;</mo><mn>1.6</mn><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>19</mn></mrow></msup><mo>&#215;</mo><mn>10</mn></mrow></mfrac></math><br /><br /><math><mo>=</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>11</mn></mrow></msup></math>&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631eb1e591c172eb3e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "19", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A silver ball of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>4.8</mtext><mi mathvariant=\"normal\">&nbsp;</mi><mi>cm</mi></math> is suspended by a thread in a vacuum chamber. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>UV</mi></math>&nbsp;light of wavelength <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi>nm</mi></math> is incident on the ball for some time during which total energy of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>–</mo><mn>7</mn></mrow></msup><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">J</mi></math> falls on the surface. Assuming that on an average, one out of <math><msup><mrow><mn>10</mn></mrow><mrow><mn>3</mn></mrow></msup></math> photons incident on the ball is able to eject an electron, then the potential of the sphere will be", "image": null}, "options": [{"id": "m2zXw", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mi mathvariant=\"normal\">&#xA0;</mi><mi mathvariant=\"normal\">V</mi></math>", "image": null, "isCorrect": false}, {"id": "YyU1z", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">&#xA0;</mi><mi mathvariant=\"normal\">V</mi></math>", "image": null, "isCorrect": false}, {"id": "XHA9S", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">V</mi></math>", "image": null, "isCorrect": true}, {"id": "rIFA4", "text": "zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The total number of photons striking the surface of the ball is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">p</mi></msub><mo>=</mo><mfrac><mi>E&#955;</mi><mi>hc</mi></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn><mi mathvariant=\"normal\">&#160;</mi><mo>&#215;</mo><mi mathvariant=\"normal\">&#160;</mi><msup><mn>10</mn><mrow><mo>-</mo><mn>7</mn></mrow></msup><mo>&#215;</mo><mn>200</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>9</mn></mrow></msup></mrow><mrow><mn>6</mn><mo>.6</mo><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>34</mn></mrow></msup><mo>&#215;</mo><mn>3</mn><mo>&#215;</mo><msup><mn>10</mn><mn>8</mn></msup></mrow></mfrac><mo>=</mo><mn>1</mn><mo>&#215;</mo><msup><mn>10</mn><mn>11</mn></msup></math></p><p>The total number of electrons ejected is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">e</mi></msub><mo>=</mo><mfrac><mrow><mn>1</mn><msup><mn>0</mn><mn>11</mn></msup></mrow><mrow><mn>1</mn><msup><mn>0</mn><mn>3</mn></msup></mrow></mfrac><mo>=</mo><mn>1</mn><msup><mn>0</mn><mn>8</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi mathvariant=\"normal\">V</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">q</mi><mrow><mn>4</mn><msub><mi>&#960;&#949;</mi><mn>0</mn></msub><mi mathvariant=\"normal\">r</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mfenced separators=\"|\"><mrow><msup><mn>10</mn><mn>8</mn></msup><mo>&#215;</mo><mn>1</mn><mo>.6</mo><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>19</mn></mrow></msup></mrow></mfenced><mo>&#215;</mo><mn>9</mn><mo>&#215;</mo><msup><mn>10</mn><mn>9</mn></msup></mrow><mrow><mn>4</mn><mo>.8</mo><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfrac><mo>=</mo><mn>3</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">V</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631d332556c14d341f", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "10", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A metal has a work function <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#981;</mi><mn>0</mn></msub></math>&nbsp;and its corresponding threshold wavelength is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#955;</mi><mn>0</mn></msub></math>. If the threshold wavelength for a metal whose work function is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>&#981;</mi><mn>0</mn></msub><mn>3</mn></mfrac></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><msub><mi>&#955;</mi><mn>0</mn></msub></math>, then what is the the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>?", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "<p>We know,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">ϕ</mi><mn>0</mn></msub><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">ℏ</mi><mi mathvariant=\"normal\">c</mi></mrow><msub><mi mathvariant=\"normal\">λ</mi><mi mathvariant=\"normal\">n</mi></msub></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mo>&nbsp;&nbsp;</mo><mfrac><msub><mi mathvariant=\"normal\">ϕ</mi><mn>0</mn></msub><msubsup><mi mathvariant=\"normal\">ϕ</mi><mn>0</mn><mo>'</mo></msubsup></mfrac><mo>=</mo><mfrac><msubsup><mi mathvariant=\"normal\">λ</mi><mn>0</mn><mo>'</mo></msubsup><msub><mi mathvariant=\"normal\">λ</mi><mn>0</mn></msub></mfrac></math></p><p>Here,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi mathvariant=\"normal\">ϕ</mi><mn>0</mn><mo>'</mo></msubsup><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">ϕ</mi><mn>0</mn></msub><mn>3</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mo>&nbsp;&nbsp;</mo><mfrac><msubsup><mi mathvariant=\"normal\">λ</mi><mn>0</mn><mo>'</mo></msubsup><msub><mi mathvariant=\"normal\">λ</mi><mn>0</mn></msub></mfrac><mo>=</mo><mn>3</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mo>&nbsp;&nbsp;</mo><msubsup><mi mathvariant=\"normal\">λ</mi><mn>0</mn><mo>'</mo></msubsup><mo>=</mo><mn>3</mn><msub><mi mathvariant=\"normal\">λ</mi><mn>0</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mo>&nbsp;&nbsp;</mo><mi mathvariant=\"normal\">n</mi><mo>=</mo><mn>3</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630bdd1848cc49ec18", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "63", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If the work functions of three photosensitive materials are <math><mn>1</mn><mi>&nbsp;</mi><mi>eV</mi><mo>,</mo><mi>&nbsp;</mi><mn>2&nbsp;</mn><mi>eV</mi></math> and <math><mn>3</mn><mi>&nbsp;</mi><mi>eV</mi></math> respectively, then the ratio of the respective frequencies of light that produce photoelectrons of the maximum kinetic energy of <math><mn>1&nbsp;</mn><mi>eV</mi></math> from each of them is", "image": null}, "options": [{"id": "Z1Kik", "text": "<math><mn>1</mn><mi> </mi><mo>:</mo><mn>2</mn><mi> </mi><mo>:</mo><mn>3</mn></math>", "image": null, "isCorrect": false}, {"id": "J4Mz3", "text": "<math><mn>2</mn><mi>&nbsp;</mi><mo>:</mo><mn>3</mn><mi>&nbsp;</mi><mo>:</mo><mn>4</mn></math>", "image": null, "isCorrect": true}, {"id":     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;

        d.open = allSolutionsOpen;
