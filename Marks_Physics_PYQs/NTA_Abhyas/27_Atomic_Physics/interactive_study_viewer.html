. (i) and (ii)<br /><br /><math><mo>&#8756;</mo><mi>&#160;</mi><mfrac><mrow><msub><mrow><mi>&#955;</mi></mrow><mrow><mi>B</mi></mrow></msub></mrow><mrow><msub><mrow><mi>&#955;</mi></mrow><mrow><mi>L</mi></mrow></msub></mrow></mfrac></math> <math><mo>=</mo><mfrac><mrow><mn>3</mn><mi>&#160;</mi><mi>R</mi></mrow><mrow><mn>4</mn></mrow></mfrac><mo>&#215;</mo><mfrac><mrow><mn>36</mn></mrow><mrow><mn>5</mn><mi>R</mi></mrow></mfrac></math> <math><mo>=</mo></math> <math><mfrac><mrow><mn>27</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math><br /><br /><math><mo>&#8756;</mo><mi>&#160;</mi><msub><mrow><mi>&#955;</mi></mrow><mrow><mi>B</mi></mrow></msub><mi>=</mi></math><math><mfrac><mrow><mn>27</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mi>&#955;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mo>(</mo><mo>&#8757;</mo><mi>&#160;</mi><msub><mrow><mi>&#955;</mi></mrow><mrow><mi>L</mi></mrow></msub><mo>=</mo><mi>&#955;</mi><mo>)</mo></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ce8e4f5b4134b360", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "94", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the hydrogen atom spectrum,&nbsp;<math><msub><mrow><mi>λ</mi></mrow><mrow><mn>3</mn><mo>-</mo><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi>λ</mi></mrow><mrow><mn>2</mn><mo>-</mo><mn>1</mn></mrow></msub></math> represent wavelengths emitted due to transition from second and first excited states to the ground state respectively. The ratio&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>λ</mi><mrow><mn>3</mn><mo>-</mo><mn>1</mn></mrow></msub><msub><mi>λ</mi><mrow><mn>2</mn><mo>-</mo><mn>1</mn></mrow></msub></mfrac><mo>=</mo><mfrac><mi>p</mi><mi>q</mi></mfrac></math>, where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi></math>&nbsp;are the smallest positive integers. What is the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>p</mi><mo>+</mo><mi>q</mi></mrow></mfenced></math>?", "image": null}, "options": [], "correctValue": "59", "solution": {"text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>3</mn><mo>-</mo><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mi>R</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>8</mn><mi>R</mi></mrow><mrow><mn>9</mn></mrow></mfrac></math><br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>2</mn><mo>-</mo><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mi>R</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>3</mn><mi>R</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>3</mn><mo>-</mo><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>2</mn><mo>-</mo><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>27</mn></mrow><mrow><mn>32</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ce375235c305b343", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "51", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A sample consisting of Hydrogen atoms in the ground state is excited by monochromatic radiation of energy <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>.</mo><mn>75</mn><mo>&#160;</mo><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">V</mi></math>. If we were to observe the emission spectrum of this sample, then the number of spectral lines observed, will be", "image": null}, "options": [{"id": "YfejZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>", "image": null, "isCorrect": false}, {"id": "LHukP", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn></math>", "image": null, "isCorrect": true}, {"id": "wtvJ5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn></math>", "image": null, "isCorrect": false}, {"id": "jdXkx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The energy of an electron of&nbsp;a hydrogen atom in the ground state is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>0</mn></msub><mo>=</mo><mo>-</mo><mn>13</mn><mo>.</mo><mn>6</mn><mo>&#160;</mo><mi>eV</mi></math></p><p>The energy of incoming photon = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>.</mo><mn>75</mn><mo>&#160;</mo><mi>eV</mi></math></p><p>The energy of an electron in the&nbsp;excited state is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mfrac><mrow><mn>13</mn><mo>.</mo><mn>6</mn></mrow><msup><mi>n</mi><mn>2</mn></msup></mfrac><mo>=</mo><mo>-</mo><mn>13</mn><mo>.</mo><mn>6</mn><mo>+</mo><mn>12</mn><mo>.</mo><mn>75</mn><mo>=</mo><mo>-</mo><mn>0</mn><mo>.</mo><mn>85</mn><mo>&#160;</mo><mi>eV</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>n</mi><mn>2</mn></msup><mo>=</mo><mfrac><mrow><mn>13</mn><mo>.</mo><mn>6</mn></mrow><mrow><mn>0</mn><mo>.</mo><mn>85</mn></mrow></mfrac><mo>=</mo><mn>16</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>n</mi><mo>=</mo><mn>4</mn></math></p><p>No. of spectral lines =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>n</mi><mfenced><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></mfenced></mrow><mn>2</mn></mfrac></math>&nbsp;=&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c9fb61c2542813fe", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "105", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>Which of the following wavelengths lying in the range <math> <mrow> <mtext>500&nbsp;nm&nbsp;</mtext></mrow></math>to <math> <mrow> <mtext>700&nbsp;nm&nbsp;</mtext></mrow></math>is in hydrogen spectrum?</p>\r", "image": null}, "options": [{"id": "ALRu2", "text": "<math> <mrow> <mtext>654&nbsp;nm</mtext></mrow> </math>", "image": null, "isCorrect": true}, {"id": "Fb9Qm", "text": "<math> <mrow> <mtext>730 nm</mtext></mrow> </math>", "image": null, "isCorrect": false}, {"id": "v21m6", "text": "<math> <mrow> <mtext>815 nm</mtext></mrow> </math>", "image": null, "isCorrect": false}, {"id": "KyFVV", "text": "<math> <mrow> <mtext>540 nm</mtext></mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The energy of a photon of wavelength 500 nm is<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <mtext>hc</mtext> </mrow> <mrow> <mi>λ</mi> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>2</mn> <mn>4</mn> <mn>2</mn> <mspace width=\"0.5em\"></mspace> <mtext>eV</mtext> <mspace width=\"0.5em\"></mspace> <mtext>nm</mtext> </mrow> <mrow> <mn>5</mn> <mn>0</mn> <mn>0</mn> <mspace width=\"0.5em\"></mspace> <mtext>nm</mtext> </mrow> </mfrac> <mo>=</mo> <mn>2</mn> <mo>·</mo> <mn>4</mn> <mn>4&nbsp;</mn> <mtext>eV.</mtext> </mrow> </math><br /><br />The energy of a photon of wavelength 700 nm is<br /><br /><math> <mrow> <mfrac> <mrow> <mtext>hc</mtext> </mrow> <mrow> <mi>λ</mi> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>2</mn> <mn>4</mn> <mn>2</mn> <mspace width=\"0.5em\"></mspace> <mtext>eV</mtext> <mspace width=\"0.5em\"></mspace> <mtext>nm</mtext> </mrow> <mrow> <mn>7</mn> <mn>0</mn> <mn>0</mn> <mspace width=\"0.5em\"></mspace> <mtext>nm</mtext> </mrow> </mfrac> <mo>=</mo> <mn>1</mn> <mo>·</mo> <mn>7</mn> <mn>7&nbsp;</mn> <mtext>eV.</mtext> </mrow> </math><br /><br />The energy difference between the states involved in the transition should, therefore, be between 1.77 eV and 2.44 eV.<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013888_AnsExp1_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 250px; height: 109px;\" /><br /><br />Figures above diagram shows some of the energies of hydrogen states. It is clear that only those trasitions which end at n = 2 may emit photons of energy between 1.77 eV and 2.44 eV. Out of these only n = 3 <mo>→</mo> n = 2 falls in the proper range. The energy of the photon emitted in the transition n = 3 to n = 2 is <mo></mo><mo>Δ</mo>E = (3.4 - 1.5) eV = 1.9 eV. The wavelength is<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mi>λ</mi> <mo>=</mo> <mfrac> <mrow> <mtext>hc</mtext> </mrow> <mrow> <mo>Δ</mo> <mtext>E</mtext> </mrow> </mfrac> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>2</mn> <mn>4</mn> <mn>2</mn> <mspace width=\"0.5em\"></mspace> <mtext>eV</mtext> <mspace width=\"0.5em\"></mspace> <mtext>nm</mtext> </mrow> <mrow> <mn>1</mn> <mo>·</mo> <mn>9</mn> <mspace width=\"0.5em\"></mspace> <mtext>eV</mtext> </mrow> </mfrac> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= 654 nm.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c377b46518f805fc", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "18", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Consider the spectral line resulting from the transition&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">n</mi><mo>=</mo><mn>2</mn><mo>→</mo><mi mathvariant=\"normal\">n</mi><mo>=</mo><mn>1</mn></math> in the atoms and ions given below. The shortest wavelength is produced by", "image": null}, "options": [{"id": "BRQIA", "text": "hydrogen atom", "image": null, "isCorrect": false}, {"id": "5nKHc", "text": "deuterium atom", "image": null, "isCorrect": false}, {"id": "IcbPj", "text": "singly ionized helium", "image": null, "isCorrect": false}, {"id": "eKDRu", "text": "doubly ionized lithium", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Shortest wavelength will correspond to maximum energy. As the value of the atomic number&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">Z</mi><mo>)</mo></math> increases, the magnitude of energy in different energy states gets increased. Value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Z</mi></math> is maximum for doubly ionised lithium atom (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Z</mi><mo>=</mo><mn>3</mn></math>) among the given elements. Hence, the wavelength corresponding to this will be least.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c05f1107c6f9c28e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "15", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Electrons in a certain energy level <math> <mrow> <mi>n</mi><mo>⁡</mo> <mo>=</mo> <msub> <mrow> <mi>n</mi><mo>⁡</mo> </mrow> <mn>1</mn> </msub> </mrow> </math>, can emit <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math> spectral lines. When they are in another energy level, <math> <mrow> <mi>n</mi><mo>⁡</mo> <mo>=</mo> <msub> <mrow> <mi>n</mi><mo>⁡</mo> </mrow> <mn>2</mn> </msub> </mrow> </math>, they can emit <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn></math> spectral lines. The ratio of orbital speeds of the electrons is", "image": null}, "options": [{"id": "cCPiJ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>:</mo><mn>3</mn></math>", "image": null, "isCorrect": true}, {"id": "2NETs", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>:</mo><mn>4</mn></math>", "image": null, "isCorrect": false}, {"id": "3Pb1e", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>:</mo><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "hR9oB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>:</mo><mn>2</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Number of emitted spectral lines,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi><mo>=</mo><mfrac><mrow><mi>n</mi><mo>(</mo><mi>n</mi><mo>-</mo><mn>1</mn><mo>)</mo></mrow><mn>2</mn></mfrac></math>.</p><p><strong>Case I</strong><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi><mo>=</mo><mn>3</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>3</mn><mo>=</mo><mfrac><mrow><msub><mi>n</mi><mn>1</mn></msub><mo>(</mo><msub><mi>n</mi><mn>1</mn></msub><mo>-</mo><mn>1</mn><mo>)</mo></mrow><mn>2</mn></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msubsup><mi>n</mi><mn>1</mn><mn>2</mn></msubsup><mo>-</mo><msub><mi>n</mi><mn>1</mn></msub><mo>-</mo><mn>6</mn><mo>=</mo><mn>0</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mo>(</mo><msub><mi>n</mi><mn>1</mn></msub><mi>&nbsp;</mi><mo>-</mo><mn>3</mn><mo>)</mo><mo>(</mo><msub><mi>n</mi><mn>1</mn></msub><mi>&nbsp;</mi><mo>+</mo><mn>2</mn><mo>)</mo><mo>=</mo><mn>0</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msub><mi>n</mi><mn>1</mn></msub><mo>=</mo><mn>3</mn></math><br /><br /><strong>Case II</strong><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi><mo>=</mo><mn>6</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>6</mn><mo>=</mo><mfrac><mrow><msub><mi>n</mi><mn>2</mn></msub><mo>(</mo><msub><mi>n</mi><mn>2</mn></msub><mo>-</mo><mn>1</mn><mo>)</mo></mrow><mn>2</mn></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msup><msub><mi>n</mi><mn>2</mn></msub><mn>2</mn></msup><mo>-</mo><msub><mi>n</mi><mn>2</mn></msub><mo>-</mo><mn>12</mn><mo>=</mo><mn>0</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mo>(</mo><msub><mi>n</mi><mn>2</mn></msub><mo>-</mo><mn>4</mn><mo>)</mo><mo>(</mo><msub><mi>n</mi><mn>2</mn></msub><mo>+</mo><mn>3</mn><mo>)</mo><mo>=</mo><mn>0</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msub><mi>n</mi><mn>2</mn></msub><mo>=</mo><mn>4</mn></math></p><p>Velocity of electron <math><mi>v</mi><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><msup><mrow><mi>Z</mi><mi>e</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><msub><mrow><mi>ε</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>h</mi><mi>n</mi></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mfrac><msub><mi>v</mi><mn>1</mn></msub><msub><mi>v</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><msub><mi>n</mi><mn>2</mn></msub><msub><mi>n</mi><mn>1</mn></msub></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><msub><mi>v</mi><mn>1</mn></msub><msub><mi>v</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863bcea997e5fe743b4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "41", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An electron in a hydrogen atom makes a transition from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>=</mo><mn>2</mn></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>=</mo><mn>1</mn></math> and emits a photon. This photon strikes a doubly ionized lithium atom which was already in an excited state and completely removes the orbiting electron. The least quantum number for the excited state of the lithium-ion for the process is", "image": null}, "options": [{"id": "8L7Rk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "mYLhe", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>", "image": null, "isCorrect": true}, {"id": "vmxcx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math>", "image": null, "isCorrect": false}, {"id": "d3938", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Let us assume that the electron in the&nbsp;lithium-ion is knocked off from the&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>n</mi><mi>th</mi></msup></math>&nbsp;energy level, then</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><msup><mfenced><msub><mi>Z</mi><mi mathvariant=\"normal\">H</mi></msub></mfenced><mn>2</mn></msup><mfenced><mrow><mfrac><mn>1</mn><msup><mn>1</mn><mn>2</mn></msup></mfrac><mo>&#8722;</mo><mfrac><mn>1</mn><msup><mn>2</mn><mn>2</mn></msup></mfrac></mrow></mfenced><mo>=</mo><mi>R</mi><mfrac><msup><mfenced><msub><mi>Z</mi><mi>Li</mi></msub></mfenced><mn>2</mn></msup><msup><mi>n</mi><mn>2</mn></msup></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><msup><mfenced><mn>1</mn></mfenced><mn>2</mn></msup><mo>&#215;</mo><mfrac><mn>3</mn><mn>4</mn></mfrac><mo>=</mo><mi>R</mi><msup><mfenced><mn>3</mn></mfenced><mn>2</mn></msup><mfenced open=\"[\" close=\"]\" separators=\"|\"><mfrac><mn>1</mn><msup><mi>n</mi><mn>2</mn></msup></mfrac></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>4</mn></mfrac><mo>=</mo><mfrac><mn>9</mn><msup><mi>n</mi><mn>2</mn></msup></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>=</mo><msqrt><mn>12</mn></msqrt><mo>&#8776;</mo><mn>3</mn><mo>.</mo><mn>5</mn></math></p><p>Hence the least quantum number must be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b698b57876371319", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "83", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A potential difference of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mi>kV</mi></math> is applied across an X-ray tube. The minimum wavelength of X-rays generated is\r", "image": null}, "options": [{"id": "clIIe", "text": "<math> <mrow> <mn>0.84</mn><mtext> </mtext><mtext>Å</mtext> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "jKbJi", "text": "<math> <mrow> <mn>0.31</mn><mtext> </mtext><mtext>Å</mtext> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "76T6t", "text": "<math> <mrow> <mn>0.62</mn><mtext> </mtext><mtext>Å</mtext> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "YZUbN", "text": "<math> <mrow> <mn>0.96</mn><mtext> </mtext><mtext>Å</mtext> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <mtext>E</mtext> <mo>=</mo> <mfrac> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>h</mi><mo>⁡</mo> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>c</mi><mo>⁡</mo> </mrow> <mrow> <mi>λ</mi> </mrow> </mfrac> </mrow> </math><br /><math> <mrow> <mo>∴</mo> <msub> <mi>λ</mi> <mtext>min</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>h</mi><mo>⁡</mo> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>c</mi><mo>⁡</mo> </mrow> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>e</mi><mo>⁡</mo> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>V</mi><mo>⁡</mo> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>6</mn> <mtext>.</mtext> <mn>6</mn> <mn>3</mn> <mo>×</mo> <mn>1</mn> <msup> <mn>0</mn> <mrow> <mo>-</mo> <mn>3</mn> <mn>4</mn> </mrow> </msup> <mo>×</mo> <mn>3</mn> <mo>×</mo> <mn>1</mn> <msup> <mn>0</mn> <mn>8</mn> </msup> </mrow> <mrow> <mn>1</mn> <mtext>.</mtext> <mn>6</mn> <mo>×</mo> <mn>1</mn> <msup> <mn>0</mn> <mrow> <mo>-</mo> <mn>1</mn> <mn>9</mn> </mrow> </msup> <mo>×</mo> <mn>2</mn> <mn>0</mn> <mo>×</mo> <mn>1</mn> <msup> <mn>0</mn> <mn>3</mn> </msup> </mrow> </mfrac> <mo>=</mo> <mn>0</mn> <mtext>.</mtext> <mn>6</mn> <mn>2</mn> <mover> <mtext>A</mtext> <mtext>o</mtext> </mover></mrow></math>&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b360f02159ecf04f", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "30", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A hydrogen-like atom (atomic number <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Z</mi></math>) is in a higher excited state of quantum number <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">n</mi></math>. This excited atom can make a transition to the first excited state by successively emitting two photons of energies <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>10.20</mtext><mo>&nbsp;</mo><mi>eV</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>17.00</mtext><mo>&nbsp;</mo><mi>eV</mi></math> respectively. Alternatively, the atom from the same excited state can make a transition to the second excited state by successively emitting two photons of energy <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>4.25</mtext><mo>&nbsp;</mo><mi>eV</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>5.95</mtext><mo>&nbsp;</mo><mi>eV</mi></math> respectively. Determine the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Z</mi></math>. [Ionization energy of hydrogen atom <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mtext>13.6</mtext><mo>&nbsp;</mo><mi>eV]</mi></math>", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "<img alt=\"Picture 129\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/abs/2a8c626e-3bf3-4ebc-861e-e70ec8a817e8-image55.png\" /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>10.2</mtext><mo>+</mo><mn>17</mn><mo>=</mo><mtext>13.6</mtext><mo>&#215;</mo><msup><mi mathvariant=\"normal\">Z</mi><mn>2</mn></msup><mfenced separators=\"|\"><mrow><mfrac><mn>1</mn><msup><mn>2</mn><mn>2</mn></msup></mfrac><mo>-</mo><mfrac><mn>1</mn><msup><mi mathvariant=\"normal\">n</mi><mn>2</mn></msup></mfrac></mrow></mfenced><mo>;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mtext>4.25</mtext><mo>+</mo><mtext>5.95</mtext><mo>=</mo><mtext>13.6</mtext><mo>&#215;</mo><msup><mi mathvariant=\"normal\">Z</mi><mn>2</mn></msup><mfenced><mrow><mfrac><mn>1</mn><msup><mn>3</mn><mn>2</mn></msup></mfrac><mo>-</mo><mfrac><mn>1</mn><msup><mi mathvariant=\"normal\">n</mi><mn>2</mn></msup></mfrac></mrow></mfenced></math><br /><br />Solving the above two equation we get, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Z</mi><mo>=</mo><mn>3</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">n</mi><mo>=</mo><mn>6</mn></math>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a258103e5fd299c9", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "67", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p align=\"left\" style=\"text-align:left;\"><span>A hydrogen atom initially in the ground level absorbs a photon which excites it to the <math><mrow><mi>n</mi><mo>=</mo><mn>4</mn> </mrow> </math> &nbsp;level. Determine the wavelength of the photon.</span></p>\r", "image": null}, "options": [{"id": "Mvbh5", "text": "<math> <mrow> <mn>8.6</mn><mo>×</mo><msup> <mrow> <mn>10</mn> </mrow> <mrow> <mo>−</mo><mn>7</mn>&nbsp; &nbsp;</mrow></msup><mtext>&nbsp;m</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "EJQJK", "text": "<math> <mrow> <mn>9.8</mn><mo>×</mo><msup> <mrow> <mn>10</mn> </mrow> <mrow> <mo>−</mo><mn>8</mn> </mrow> </msup> <mtext>&nbsp;m</mtext></mrow></math>", "image": null, "isCorrect": true}, {"id": "17JW0", "text": "<math> <mrow> <mn>7.4</mn><mo>×</mo><msup> <mrow> <mn>10</mn> </mrow> <mrow> <mo>−</mo><mn>8</mn> </mrow> </msup> <mtext>&nbsp;m</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "gS3Cu", "text": "<math> <mrow> <mn>8.2</mn><mo>×</mo><msup> <mrow> <mn>10</mn> </mrow> <mrow> <mo>−</mo><mn>8</mn> </mrow> </msup> <mtext>&nbsp;m</mtext></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><span>&nbsp;<span>&nbsp;<math> <mrow> <mfrac> <mn>1</mn> <mi>λ</mi> </mfrac> <mo>=</mo><mi>R</mi><mrow><mo>(</mo> <mrow> <mfrac> <mn>1</mn> <mrow> <msubsup> <mi>n</mi> <mn>1</mn> <mn>2</mn> </msubsup> </mrow> </mfrac> <mo>−</mo><mfrac> <mn>1</mn> <mrow> <msubsup> <mi>n</mi> <mn>2</mn> <mn>2</mn> </msubsup> </mrow> </mfrac> </mrow> <mo>)</mo></mrow> </mrow> </math> </span></span></p><p><span>&nbsp; &nbsp;<math> <mrow> <mfrac> <mn>1</mn> <mi>λ</mi> </mfrac> <mo>=</mo><mn>1.09</mn><mo>×</mo><msup> <mrow> <mn>10</mn> </mrow> <mn>7</mn> </msup> <mrow><mo>(</mo> <mrow> <mfrac> <mn>1</mn> <mrow> <msup> <mn>1</mn> <mn>2</mn> </msup> </mrow> </mfrac> <mo>−</mo><mfrac> <mn>1</mn> <mrow> <msup> <mn>4</mn> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> <mo>)</mo></mrow> </mrow> </math> </span></p><p><span>&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;<math> <mrow> <mo>=</mo><mn>1.09</mn><mo>×</mo><msup> <mrow> <mn>10</mn> </mrow> <mn>7</mn> </msup> <mrow><mo>(</mo> <mrow> <mfrac> <mrow> <mn>16</mn><mo>−</mo><mn>1</mn> </mrow> <mrow> <mn>16</mn> </mrow> </mfrac> </mrow> <mo>)</mo></mrow> </mrow> </math> </span></p><p><span>&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;<math> <mrow> <mo>=</mo><mn>1.09</mn><mo>×</mo><msup> <mrow> <mn>10</mn> </mrow> <mn>7</mn> </msup> <mo>×</mo><mfrac> <mrow> <mn>15</mn> </mrow> <mrow> <mn>16</mn> </mrow> </mfrac> </mrow> </math> </span></p><p><span>&nbsp; &nbsp;<math> <mrow> <mi>λ</mi><mo>=</mo><mfrac> <mrow> <mn>16</mn> </mrow> <mrow> <mn>1.09</mn><mo>×</mo><mn>15</mn><mo>×</mo><msup> <mrow> <mn>10</mn> </mrow> <mn>7</mn> </msup> </mrow> </mfrac> <mo>=</mo><mn>9.8</mn><mo>×</mo><msup> <mrow> <mn>10</mn> </mrow> <mrow> <mo>−</mo><mn>8</mn> </mrow> </msup> <mtext> </mtext><mtext>m</mtext></mrow></math></span></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639a9fc59fd6581cca", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "02", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Monochromatic radiation of wavelength <math> <mtext>λ</mtext> </math> is incident on a hydrogen sample in ground state. Hydrogen atoms absorb a fraction of light and subsequently emit radiation of six different wavelengths. Find the value of <math> <mtext>λ</mtext></math>.", "image": null}, "options": [{"id": "y17Md", "text": "<math> <mrow>  <mtext>102&#x00A0;nm</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "Lz5k7", "text": "<math> <mrow>  <mtext>100&#x00A0;nm</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "ioX6g", "text": "<math > <mrow>  <mtext>97</mtext><mtext>.5&#x00A0;nm</mtext></mrow></math>", "image": null, "isCorrect": true}, {"id": "wLD0E", "text": "<math> <mrow>  <mtext>94</mtext><mtext>.5&#x00A0;nm</mtext></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As the hydrogen atoms emit radiation of six different wavelengths, some of them must have been excited to <math> <mrow> <mtext>n</mtext><mo>=</mo><mn>4</mn></mrow> </math>, The energy in <math> <mrow> <mtext>n</mtext><mo>=</mo><mn>4</mn></mrow> </math> state is<br /><br />&nbsp;<math> <mrow> <msub> <mtext>E</mtext> <mn>4</mn> </msub> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>E</mtext> <mn>1</mn> </msub> </mrow> <mrow> <msup> <mn>4</mn> <mn>2</mn> </msup> </mrow> </mfrac> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> <mn>3</mn> <mo>·</mo> <mn>6</mn> <mtext>e</mtext> <mtext>V</mtext> </mrow> <mrow> <mn>1</mn> <mn>6</mn> </mrow> </mfrac> <mo>=</mo> <mo>-</mo> <mn>0</mn> <mo>·</mo> <mn>8</mn> <mn>5</mn> <mtext>eV.</mtext> </mrow> </math><br /><br />The energy needed to take a hydrogen atom from its ground state to <math> <mrow> <mtext>n</mtext><mo>=</mo><mn>4</mn></mrow> </math> is<br /><br /><math> <mrow> <mtext>13</mtext><mtext>.6&nbsp;eV&nbsp;-&nbsp;0</mtext><mtext>.85&nbsp;eV&nbsp;=&nbsp;12</mtext><mtext>.75&nbsp;eV</mtext></mrow> </math> .<br /><br />The photons of the incident radiation should have <math> <mrow> <mn>12.75</mn><mtext> </mtext><mtext> </mtext><mtext>eV</mtext></mrow> </math> of energy. So<br /><br />&nbsp;<math><mrow><mfrac><mrow><mtext>hc</mtext> </mrow> <mrow> <mi>λ</mi> </mrow> </mfrac> <mo>=</mo> <mn>1</mn> <mn>2</mn> <mo>·</mo> <mn>7</mn> <mn>5</mn> <mtext>eV</mtext> </mrow> </math><br /><br />or ,&nbsp;<math><mrow><mi>λ</mi> <mo>=</mo> <mfrac> <mrow> <mtext>hc</mtext> </mrow> <mrow> <mn>1</mn> <mn>2</mn> <mo>·</mo> <mn>7</mn> <mn>5</mn> <mtext>eV</mtext> </mrow> </mfrac> </mrow> </math><br /><br />&nbsp;<math><mrow><mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>2</mn> <mn>4</mn> <mn>2</mn> <mtext>eV</mtext> <mspace width=\"0.5em\"></mspace> <mtext>nm</mtext> </mrow> <mrow> <mn>1</mn> <mn>2</mn> <mo>·</mo> <mn>7</mn> <mn>5</mn> <mtext>eV</mtext> </mrow> </mfrac> </mrow> </math><br /><br />&nbsp;<math> <mrow> <mtext>=&nbsp;97</mtext><mtext>.5&nbsp;nm</mtext></mrow> </math>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86395d8a4d2f1297cfc", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "20", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the Coolidge tube experiment, if the applied voltage is increased to three times, the short wavelength limit of continuous <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi><mo>-</mo><mi>ray</mi></math> spectrum shifts by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&#160;</mo><mi>pm</mi></math>. What is the initial voltage (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>kV</mi></math>) applied to the tube?", "image": null}, "options": [], "correctValue": "41", "solution": {"text": "<math> <mo>∵</mo> </math>&nbsp;cut-off wavelength for continuous x-ray&nbsp;is given as :&nbsp;&nbsp;<math> <mrow> <msub> <mi>λ</mi> <mrow> <mi>min</mi> </mrow> </msub> <mo>=</mo><mfrac> <mrow> <mi>h</mi><mi>c</mi> </mrow> <mrow> <mi>e</mi><msub> <mi>V</mi> <mn>0</mn> </msub> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mo>∴</mo> </math> <math> <mrow> <mfrac> <mrow> <mtext>hc</mtext> </mrow> <mrow> <msub> <mtext>eV</mtext> <mn>0</mn> </msub> </mrow> </mfrac> <mo>=</mo> <mi>λ</mi> <mo>&nbsp;&amp;&nbsp;</mo> <mfrac> <mrow> <mtext>hc</mtext> </mrow> <mrow> <mn>3</mn> <msub> <mtext>eV</mtext> <mn>0</mn> </msub> </mrow> </mfrac> <mo>=</mo> <mi>λ</mi> <mo>-</mo> <mo>Δ</mo> <mi>λ</mi> </mrow> </math><br /><br /><!-- MathType@Translator@5@5@MathML2 (namespace attr).tdl@MathML 2.0 (namespace attr)@ --> <math> <mrow> <mrow><mo>(</mo> <mrow> <msub> <mtext>V</mtext> <mtext>0</mtext> </msub> <mo>=</mo><mtext>accelerating</mtext><mtext> </mtext><mtext>voltage</mtext></mrow> <mo>)</mo></mrow></mrow> </math><br /><!-- MathType@End@5@5@ --><br /><math> <mrow> <mo>⇒&nbsp;&nbsp;</mo> <msub> <mtext>V</mtext> <mn>0</mn> </msub> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> <mtext>hc</mtext> </mrow> <mrow> <mn>3</mn> <mtext>e</mtext> <mo>Δ</mo> <mi>λ</mi> </mrow> </mfrac> <mo>=</mo> <mn>4</mn> <mn>1&nbsp;</mn> <mtext>kV</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863933d75d6f23ddef9", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "96", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Electrons with energy <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>80</mn><mo>&nbsp;</mo><mi>keV</mi></math> are incident on the tungsten target of an X-ray tube. K-shell electrons of tungsten have <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>72</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi>keV</mi></math> energy. X-rays emitted by the tube contain only", "image": null}, "options": [{"id": "Aec13", "text": "A continuous X-ray spectrum (Bremsstrahlung) with a minimum wavelength of  0.155 Å ", "image": null, "isCorrect": false}, {"id": "O4tZT", "text": " A continuous X-ray spectrum (Bremsstrahlung) with all wavelengths", "image": null, "isCorrect": false}, {"id": "MsluJ", "text": "The characteristic X-ray spectrum of tungsten", "image": null, "isCorrect": false}, {"id": "LTxMC", "text": "A continuous X-ray spectrum (Bremsstrahlung) with a minimum wavelength of0.155 Å and the characteristic X-ray spectrum of tungsten", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Minimum wavelength of continuous X - ray spectrum is given<br /><br />by &lambda; min (in &Aring;) = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac linethickness=\"1\"><mn>12375</mn><mi>E</mi></mfrac></math><br /><br />Here E = energy of incident electrons (in eV) = energy corresponding to minimum wavelength<br /><br />E = 80 keV = 80 x 10<sup>3</sup> eV<br /><br />Therefore, &lambda;min (ni &Aring;)= <math><mrow><mfrac linethickness=\"1\"><mn>12375</mn><mrow><mn>80</mn><mo>&#215;</mo><mn>1</mn><msup><mn>0</mn><mn>3</mn></msup></mrow></mfrac><mo>=</mo><mn>0.155</mn></mrow></math><br /><br />Also, the energy of the incident electrons (80 keV) is more than the ionization energy of the K - shell electrons (i. e., 72. 5 keV), Therefore, characteristic X-ray spectrum will also be obtained because the energy of the incident electron is high enough to knock out the electron from K or L- shells.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638f57a742ce0293a3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "86", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A beam of electrons striking a copper target produces X-rays. Its spectrum is as shown. Keeping the voltage same if the copper target is replaced with a different metal, the cut-off wavelength and characteristic lines of the new spectrum will change in comparison with old as<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0068273.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 150px; height: 91px;\" />", "image": null}, "options": [{"id": "IcCgb", "text": "Cut-off wavelength will remain unchanged while characteristic lines will be different", "image": null, "isCorrect": true}, {"id": "1V5Rs", "text": "Both cut-off wavelength and characteristic lines will remain unchanged", "image": null, "isCorrect": false}, {"id": "MyfLS", "text": "Both cut-off wavelength and characteristic lines will be different", "image": null, "isCorrect": false}, {"id": "sxi4f", "text": "Cut-off wavelength will be different while characteristic lines will remain unchanged", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Cut- off wavelength of emitted X-rays depends on maximum kinetic energy of incident electrons on the target and is independent of nature of target. The characteristic lines depend on nature of material of target.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638c70da5aacc93206", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "71", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A hydrogen atom is in the ground state. Then to get six lines in the emission spectrum, the wavelength of incident radiation should be ( Rydberg constant&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>&nbsp;</mo><mo>=</mo><mn>1</mn><mo>.</mo><mn>1</mn><mo>×</mo><msup><mn>10</mn><mn>7</mn></msup><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>)", "image": null}, "options": [{"id": "ojaEC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>800</mn><mo>&#160;</mo><mover><mi mathvariant=\"normal\">A</mi><mo>&#8728;</mo></mover></math>", "image": null, "isCorrect": false}, {"id": "SfChw", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>825</mn><mo>&#160;</mo><mover><mi mathvariant=\"normal\">A</mi><mo>&#8728;</mo></mover></math>", "image": null, "isCorrect": false}, {"id": "Vxw8G", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>975</mn><mo>&nbsp;</mo><mover><mi mathvariant=\"normal\">A</mi><mo>∘</mo></mover></math>", "image": null, "isCorrect": true}, {"id": "EN1Yd", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1025</mn><mo>&#160;</mo><mover><mi mathvariant=\"normal\">A</mi><mo>&#8728;</mo></mover></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Number of possible spectral lines emitted when an electron jumps back to the ground state from <math><mrow><msup><mi>n</mi><mrow><mi>t</mi><mi>h</mi></mrow></msup><mtext>orbit</mtext><mo>=</mo><mfrac><mrow><mi>n</mi><mrow><mo>(</mo><mrow><mi>n</mi><mo>&#8722;</mo><mn>1</mn></mrow><mo>)</mo></mrow></mrow><mn>2</mn></mfrac></mrow></math><br /><br />Here, <math><mrow><mfrac><mrow><mi>n</mi><mrow><mo>(</mo><mrow><mi>n</mi><mo>&#8722;</mo><mn>1</mn></mrow><mo>)</mo></mrow></mrow><mn>2</mn></mfrac><mo>=</mo><mn>6</mn><mo>&#8658;</mo><mi>n</mi><mo>=</mo><mn>4</mn></mrow></math><br /><br />Wavelength <math><mi>&#955;</mi></math> from the transition from <math><mrow><mi>n</mi><mo>=</mo><mn>1</mn></mrow></math> to <math><mrow><mi>n</mi><mo>=</mo><mn>4</mn></mrow></math> is given by,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>&#955;</mi></mfrac><mo>=</mo><mi>R</mi><mrow><mo>(</mo><mfrac><mn>1</mn><mn>1</mn></mfrac><mo>&#8722;</mo><mfrac><mn>1</mn><msup><mn>4</mn><mn>2</mn></msup></mfrac><mo>)</mo></mrow><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mi>&#955;</mi><mo>=</mo><mfrac><mn>16</mn><mrow><mn>15</mn><mi>R</mi></mrow></mfrac><mo>=</mo><mn>975</mn><mo>&#160;</mo><mover><mi mathvariant=\"normal\">A</mi><mo>&#8728;</mo></mover></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86389f819a21217aff1", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "80", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A hydrogen-like atom (described by the Bohr model) is observed to emit six wavelengths, originating from all possible transitions between a group of levels. These levels have energies between <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>0</mn><mo>.</mo><mn>85</mn><mo>&nbsp;</mo><mi>eV</mi></math> and<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mo>-</mo><mn>0</mn><mo>.</mo><mn>544</mn><mo>&nbsp;</mo><mi>eV</mi></math> (including both these values). Find the atomic number of the atom. (Take <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>hc</mi><mo>=</mo><mn>1240</mn><mo>&nbsp;</mo><mi>eV</mi><mo>&nbsp;</mo><mi>nm</mi></math>, ground state energy of hydrogen atom = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>13</mn><mo>.</mo><mn>6</mn><mo>&nbsp;</mo><mi>eV</mi></math>)", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "Total 6 lines are emitted. Therefore,<br /><br /><math><mrow><mfrac linethickness=\"1\"><mrow><mi>n</mi><mrow><mo maxsize=\"1.00em\">(</mo><mi>n</mi><mo>-</mo><mn>1</mn><mo maxsize=\"1.00em\">)</mo></mrow></mrow><mn>2</mn></mfrac><mo>=</mo><mn>6</mn></mrow></math><br /><br />or n = 4<br /><br />So, transition is taking place between m<sup>th</sup> energy state and (m + 3)<sup>th</sup> energy state.<br /><br />E<sub>m</sub> = - 0. 85 eV<br /><br />Or<br /><br /><math><mrow><mo>-</mo><mn>13.6</mn><mrow><mo maxsize=\"1.00em\">(</mo><mfrac linethickness=\"1\"><mrow><msup><mi>z</mi><mn>2</mn></msup></mrow><mrow><msup><mi>m</mi><mn>2</mn></msup></mrow></mfrac><mo maxsize=\"1.00em\">)</mo></mrow><mo>=</mo><mo>-</mo><mn>0.85</mn></mrow></math><br /><br />Or<br /><br /><math><mrow><mfrac linethickness=\"1\"><mi>z</mi><mi>m</mi></mfrac></mrow></math>= 0. 25 ... (i)<br /><br />Similarly, E<sub>m</sub> + 3 = - 0. 544 eV<br /><br />or <math><mrow><mo>-</mo><mn>13.6</mn><mfrac linethickness=\"1\"><mrow><msup><mi>z</mi><mn>2</mn></msup></mrow><mrow><msup><mrow><mo maxsize=\"1.00em\">(</mo><mi>m</mi><mo>+</mo><mn>3</mn><mo maxsize=\"1.00em\">)</mo></mrow><mn>2</mn></msup></mrow></mfrac></mrow></math> = - 0. 544<br /><br />or <math><mrow><mfrac linethickness=\"1\"><mi>z</mi><mrow><mo maxsize=\"1.00em\">(</mo><mi>m</mi><mo>+</mo><mn>3</mn><mo maxsize=\"1.00em\">)</mo></mrow></mfrac><mo>=</mo><mn>0.2</mn><mo>…</mo><mrow><mo maxsize=\"1.00em\">(</mo><mi>i</mi><mi>i</mi><mo maxsize=\"1.00em\">)</mo></mrow></mrow></math>&nbsp;...(ii)<br /><br />Solving Eqs. (i) and (ii) for z and m, we get<br /><br />m = 12 and z = 3<br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86389c45d0454d88dcc", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "26", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Which among the following has a Hydrogen-like spectrum and whose lines have wavelengths four times shorter than those of atomic Hydrogen?", "image": null}, "options": [{"id": "V4IF6", "text": "Helium ion", "image": null, "isCorrect": true}, {"id": "UfHu3", "text": "Beryllium ion", "image": null, "isCorrect": false}, {"id": "8EkhD", "text": "Lithium ion", "image": null, "isCorrect": false}, {"id": "sokOz", "text": "None of these ", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>For Hydrogen like atom,&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mi mathvariant=\"normal\">λ</mi><mo>'</mo></msup></mfrac><mi mathvariant=\"normal\">=</mi><mi mathvariant=\"normal\">R</mi><mo>⁡</mo><mi mathvariant=\"normal\">Z</mi><msup><mo>⁡</mo><mn>2</mn></msup><mfenced><mrow><mfrac><mn>1</mn><msubsup><mi mathvariant=\"normal\">n</mi><mn>1</mn><mn>2</mn></msubsup></mfrac><mo>-</mo><mfrac><mn>1</mn><msubsup><mi mathvariant=\"normal\">n</mi><mn>2</mn><mn>2</mn></msubsup></mfrac></mrow></mfenced></math>&nbsp;&nbsp;&nbsp;...(i)<br /><br />For Hydrogen atom,&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi mathvariant=\"normal\">λ</mi></mfrac><mi mathvariant=\"normal\">=</mi><mi mathvariant=\"normal\">R</mi><mo>⁡</mo><mfenced><mrow><mfrac><mn>1</mn><msubsup><mi mathvariant=\"normal\">n</mi><mn>1</mn><mn>2</mn></msubsup></mfrac><mo>-</mo><mfrac><mn>1</mn><msubsup><mi mathvariant=\"normal\">n</mi><mn>2</mn><mn>2</mn></msubsup></mfrac></mrow></mfenced></math>&nbsp;&nbsp;&nbsp;...(ii)<br /><br />Dividing Eqn (ii) by Eqn (i), we get<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi mathvariant=\"normal\">λ</mi><mo>'</mo></msup><mi mathvariant=\"normal\">λ</mi></mfrac><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">R</mi><mo>⁡</mo><mfenced><mrow><mfrac><mn>1</mn><msubsup><mi mathvariant=\"normal\">n</mi><mn>1</mn><mn>2</mn></msubsup></mfrac><mo>-</mo><mfrac><mn>1</mn><msubsup><mi mathvariant=\"normal\">n</mi><mn>2</mn><mn>2</mn></msubsup></mfrac></mrow></mfenced></mrow><mrow><msup><mtext>RZ</mtext><mn>2</mn></msup><mfenced><mrow><mfrac><mn>1</mn><msubsup><mi mathvariant=\"normal\">n</mi><mn>1</mn><mn>2</mn></msubsup></mfrac><mo>-</mo><mfrac><mn>1</mn><msubsup><mi mathvariant=\"normal\">n</mi><mn>2</mn><mn>2</mn></msubsup></mfrac></mrow></mfenced></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>or&nbsp;&nbsp;</mtext><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mfrac><msup><mi mathvariant=\"normal\">λ</mi><mo>'</mo></msup><mi mathvariant=\"normal\">λ</mi></mfrac><mo>=</mo><mfrac><mn>1</mn><mrow><mi mathvariant=\"normal\">Z</mi><msup><mo>⁡</mo><mn>2</mn></msup></mrow></mfrac></math><br /><br />According to problem,&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">λ</mi><mo>'</mo></msup><mo>=</mo><mfrac><mi mathvariant=\"normal\">λ</mi><mn>4</mn></mfrac></math> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</p><p>&nbsp;&nbsp;∴&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi mathvariant=\"normal\">λ</mi><mo>'</mo></msup><mrow><mn>4</mn><msup><mi mathvariant=\"normal\">λ</mi><mo>'</mo></msup></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><mrow><mi mathvariant=\"normal\">Z</mi><msup><mo>⁡</mo><mn>2</mn></msup></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mtext>       </mtext><mi mathvariant=\"normal\">Z</mi><mo>=</mo><mn>2</mn></math><br /><br />The atomic number of Helium atom is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mn>2</mn> </math>. Hence, the required element is Helium.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863897023d1bdd62d8b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "60", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Imagine an atom made up of a proton and a hypothetical particle of double the mass of the electron but having the same charge as that of the electron. Apply the Bohr atom model and consider all possible transitions of this hypothetical particle to the first excited level. The longest wavelength photon that will be emitted has wavelength <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>λ</mi></math>,&nbsp;(given in terms of Rydberg constant <math><mi>R</mi></math> for hydrogen atom) equal to", "image": null}, "options": [{"id": "8VleN", "text": "<math><mfrac><mrow><mn>9</mn></mrow><mrow><mn>5</mn><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "PNzfD", "text": "<math><mfrac><mrow><mn>36</mn></mrow><mrow><mn>5</mn><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "BPSn2", "text": "<math><mfrac><mrow><mn>18</mn></mrow><mrow><mn>5</mn><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "6jcRn", "text": "<math><mfrac><mrow><mn>4</mn></mrow><mrow><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In hydrogen atom, <math><msub><mrow><mi>E</mi></mrow><mrow><mi>n</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>R</mi><mi>h</mi><mi>c</mi></mrow><mrow><msup><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math><br /><br />Also, <math><msub><mrow><mi>E</mi></mrow><mrow><mi>n</mi></mrow></msub><mo>∝</mo><mi>m</mi></math>, where <math><mi>m</mi></math> is the mass of the electron. Here, the electron has been replaced by a particle, whose mass is double the mass of an electron. Therefore, for this hypothetical atom, energy in&nbsp;<math><mi>n</mi></math>th orbit will be given by<br /><br /><math><msub><mrow><mi>E</mi></mrow><mrow><mi>n</mi></mrow></msub><mo>=</mo><mo>-</mo><mfrac><mrow><mn>2</mn><mi>R</mi><mi>h</mi><mi>c</mi></mrow><mrow><msup><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math><br /><br />The longest wavelength (or minimum energy) photon will correspond to the transition of the particle from <math><mi>n</mi><mo>=</mo><mn>3&nbsp;</mn></math>to <math><mi>n</mi><mo>=</mo><mn>2</mn></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">x</mi></mrow></msub></mrow></mfrac><mo>=</mo><msub><mrow><mi>E</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>-</mo><msub><mrow><mi>E</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>2</mn><mi>R</mi><mi>h</mi><mi>c</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>2</mn><mi>R</mi><mi>h</mi><mi>c</mi><mo>×</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>36</mn></mrow></mfrac></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>λ</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">x</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mfrac><mrow><mn>5</mn></mrow><mrow><mn>18</mn></mrow></mfrac><mi>R</mi><mi>h</mi><mi>c</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>18</mn></mrow><mrow><mn>5</mn><mi>R</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86384029c131393ffaa", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "38", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>An <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math>-ray tube produces a continuous spectrum of radiation with a cutoff wavelength of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>45</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>&nbsp;</mo><mi>nm</mi></math>.&nbsp;The maximum energy of a photon in the radiation (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>eV</mi></math>) is<br />\r[<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><mo>=</mo><mn>6.62</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>34</mn></mrow></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi><mo>&nbsp;</mo><mi mathvariant=\"normal\">s</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>c</mi><mo>=</mo><mn>3</mn><mo>×</mo><msup><mn>10</mn><mn>8</mn></msup><mi>&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>]</p>\r", "image": null}, "options": [{"id": "27wzS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>27500</mn></math>", "image": null, "isCorrect": true}, {"id": "dPHDh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>22500</mn></math>", "image": null, "isCorrect": false}, {"id": "YmMAA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>17500</mn></math>", "image": null, "isCorrect": false}, {"id": "cmrMY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12500</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>E</mi><mo>=</mo><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mi>λ</mi></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>6</mn><mo>.62</mo><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>34</mn></mrow></msup><mo>×</mo><mn>3</mn><mo>×</mo><msup><mn>10</mn><mn>8</mn></msup><mi mathvariant=\"normal\">&nbsp;</mi></mrow><mrow><mn>45</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>12</mn></mrow></msup></mrow></mfrac><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>0</mn><mo>.44</mo><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>14</mn></mrow></msup></mrow><mrow><mn>1</mn><mo>.6</mo><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>19</mn></mrow></msup></mrow></mfrac><mo>&nbsp;</mo><mi>eV</mi><mo>=</mo><mn>0</mn><mo>.275</mo><mo>×</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&nbsp;</mo><mi>eV</mi><mo>=</mo><mn>27500</mn><mo>&nbsp;</mo><mi>eV</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86383fde364b5438079", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "75", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Maximum energy is evolved during which of the following transitions?", "image": null}, "options": [{"id": "D9Nxm", "text": "<math><mi>n</mi><mo>=</mo><mn>1</mn><mi> </mi><mi>t</mi><mi>o</mi><mi> </mi><mi>n</mi><mo>=</mo><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "gVCh6", "text": "<math><mi>n</mi><mo>=</mo><mn>2</mn><mi> </mi><mi> </mi><mi>t</mi><mi>o</mi><mi> </mi><mi>n</mi><mo>=</mo><mn>6</mn></math>", "image": null, "isCorrect": false}, {"id": "bXzfB", "text": "<math><mi>n</mi><mo>=</mo><mn>2</mn><mi> </mi><mi>t</mi><mi>o</mi><mi> </mi><mi> </mi><mi>n</mi><mo>=</mo><mn>1</mn></math>", "image": null, "isCorrect": true}, {"id": "DAzcO", "text": "<math><mi>n</mi><mo>=</mo><mn>6</mn><mi> </mi><mi> </mi><mi>t</mi><mi>o</mi><mi> </mi><mi>n</mi><mo>=</mo><mn>2</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When transition is from upper state to lower state, the energy is evolved. Therefore, options (C) and (d) are practicable.<br/><br/>In option (C)<br/><br/>                 <math><mi>E</mi><mo>=</mo><mo>-</mo><mi>R</mi><mi>h</mi><mi>c</mi><mi> </mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced><mo>=</mo><mo>-</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mi>R</mi><mi>h</mi><mi>c</mi></math> <br/><br/>        In option (d)<br/><br/>                 <math><mi>E</mi><mo>=</mo><mo>-</mo><mi>R</mi><mi>h</mi><mi>c</mi><mi> </mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mn>6</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced></math> <br/><br/> <math><mo>=</mo><mo>-</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>9</mn></mrow></mfrac><mi>R</mi><mi>h</mi><mi>c</mi></math>  <br/><br/>        Thus, maximum energy is evolved in option (c).", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86382c0861ee269c017", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "13", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A&nbsp;sample of atomic hydrogen gas is irradiated by a beam of ultraviolet radiation having a wavelength between <math> <mrow> <mtext>100&nbsp;nm</mtext></mrow> </math> and <math> <mrow> <mtext>200&nbsp;nm</mtext></mrow></math>. Assuming that the atoms are in the ground state, the wavelength which will have low intensity in the transmitted beam is</p>\r", "image": null}, "options": [{"id": "YXGUl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>104&#xA0;nm</mtext></math>", "image": null, "isCorrect": false}, {"id": "9PPg4", "text": "<math> <mrow> <mtext>103&nbsp;nm</mtext></mrow> </math>", "image": null, "isCorrect": true}, {"id": "eCAgq", "text": "<math> <mrow>  <mtext>105&#x00A0;nm</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "AsFUk", "text": "<math> <mrow>  <mtext>100&#x00A0;nm</mtext></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The energy of a&nbsp; photon corresponding to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi><mo>=</mo><mn>100</mn><mo>&#160;</mo><mi>nm</mi></math> is,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>1</mn><mn>2</mn><mn>4</mn><mn>2</mn><mspace width=\"0.5em\"/><mtext>eV&#160;nm</mtext></mrow><mrow><mn>1</mn><mn>0</mn><mn>0</mn><mspace width=\"0.5em\"/><mtext>nm</mtext></mrow></mfrac><mo>=</mo><mn>1</mn><mn>2</mn><mo>&#183;</mo><mn>4</mn><mn>2</mn><mo>&#160;</mo><mtext>eV</mtext></math></p><p>Similarly, the corresponding to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#955;</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>200</mn><mo>&#160;</mo><mi>nm</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>.</mo><mn>21</mn><mo>&#160;</mo><mi>eV</mi></math>.</p><p>The energy needed to take the atom from the ground state to the first excited state is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>2</mn></msub><mo>-</mo><msub><mi>E</mi><mn>1</mn></msub><mo>=</mo><mn>13</mn><mo>.</mo><mn>6</mn><mo>&#160;</mo><mi>eV</mi><mo>-</mo><mn>3</mn><mo>.</mo><mn>4</mn><mo>&#160;</mo><mi>eV</mi><mo>=</mo><mn>10</mn><mo>.</mo><mn>2</mn><mo>&#160;</mo><mi>eV</mi></math></p><p>The energy needed to take the atom from the ground state&nbsp;to the second excited state is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>3</mn></msub><mo>-</mo><msub><mi>E</mi><mn>1</mn></msub><mo>=</mo><mn>13</mn><mo>.</mo><mn>6</mn><mo>&#160;</mo><mi>eV</mi><mo>-</mo><mn>1</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi>eV</mi><mo>=</mo><mn>12</mn><mo>.</mo><mn>1</mn><mo>&#160;</mo><mi>eV</mi></math></p><p>The energy needed to take the atom from the ground state&nbsp;to the third excited state is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>4</mn></msub><mo>-</mo><msub><mi>E</mi><mn>1</mn></msub><mo>=</mo><mn>13</mn><mo>.</mo><mn>6</mn><mo>&#160;</mo><mi>eV</mi><mo>-</mo><mn>0</mn><mo>.</mo><mn>85</mn><mo>&#160;</mo><mi>eV</mi><mo>=</mo><mn>12</mn><mo>.</mo><mn>75</mn><mo>&#160;</mo><mi>eV</mi></math>,&nbsp;and so on.</p><p>Thus, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>.</mo><mn>2</mn><mo>&#160;</mo><mi>eV</mi></math> photons and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>.</mo><mn>1</mn><mo>&#160;</mo><mi>eV</mi></math> photons have a large probability of being absorbed from the given range of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>.</mo><mn>21</mn><mo>&#160;</mo><mi>eV</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>.</mo><mn>42</mn><mo>&#160;</mo><mi>eV</mi></math>.</p><p>The corresponding wavelengths are</p><p><math> <mrow> <msub> <mi>&#955;</mi> <mn>1</mn> </msub> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>2</mn> <mn>4</mn> <mn>2</mn> <mspace width=\"0.5em\"></mspace> <mtext>eV</mtext> <mspace width=\"0.5em\"></mspace> <mtext>nm</mtext> </mrow> <mrow> <mn>1</mn> <mn>0</mn> <mo>&#183;</mo> <mn>2</mn> <mspace width=\"0.5em\"></mspace> <mtext>eV</mtext> </mrow> </mfrac> <mo>=</mo> <mn>1</mn> <mn>2</mn> <mn>2</mn> <mspace width=\"0.5em\"></mspace> <mtext>nm</mtext> </mrow> </math></p><p><br /><math> <mrow> <msub> <mi>&#955;</mi> <mn>2</mn> </msub> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>2</mn> <mn>4</mn> <mn>2</mn> <mspace width=\"0.5em\"></mspace> <mtext>eV</mtext> <mspace width=\"0.5em\"></mspace> <mtext>nm</mtext> </mrow> <mrow> <mn>1</mn> <mn>2</mn> <mo>&#183;</mo> <mn>1</mn> <mspace width=\"0.5em\"></mspace> <mtext>eV</mtext> </mrow> </mfrac> <mo>=</mo> <mn>1</mn> <mn>0</mn> <mn>3</mn> <mspace width=\"0.5em\"></mspace> <mtext>nm</mtext> </mrow> </math><br />These wavelengths will have low intensity in the transmitted beam.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86381177ff1d521781f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "16", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The shortest wavelength of Lyman series of hydrogen atom is equal to the shortest wavelength of Balmer series of an hydrogen like atom of atomic number <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Z</mi></math>. The value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Z</mi></math> is equal to", "image": null}, "options": [{"id": "flPBp", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>", "image": null, "isCorrect": true}, {"id": "3LQU3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>", "image": null, "isCorrect": false}, {"id": "zdcZo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>", "image": null, "isCorrect": false}, {"id": "Ur270", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mn>13.6</mn><mfenced separators=\"|\"><mrow><msup><mrow><mi>Z</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>∞</mi></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>13.6</mn><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mi>∞</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced></math><br /><br /><math><mo>⇒</mo><mi>Z</mi><mo>=</mo><mn>2</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637871a482540ea58d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "50", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Photoelectrons are emitted when <math><mn>4000</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Å</mi></math> radiation is incident on a surface of work function <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>9</mn><mo>&nbsp;</mo><mi>eV</mi></math>. These photoelectrons pass through a region having&nbsp;<math><mi>α</mi> </math> -particles to form <math><mi mathvariant=\"normal\">H</mi><msup><mrow><mi mathvariant=\"normal\">e</mi></mrow><mrow><mo>+</mo></mrow></msup></math> ion, emitting a single photon. In this process,&nbsp;<math><mi mathvariant=\"normal\">H</mi><msup><mrow><mi mathvariant=\"normal\">e</mi></mrow><mrow><mo>+</mo></mrow></msup></math> ions thus formed are in their fourth excited state. The energy released during the combination of <math><mi mathvariant=\"normal\">H</mi><msup><mrow><mi mathvariant=\"normal\">e</mi></mrow><mrow><mo>+</mo></mrow></msup></math> ions is", "image": null}, "options": [{"id": "kCeJw", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>.</mo><mn>38</mn><mo>&nbsp;</mo><mi>eV</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: -6px; top: 38px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "TVtYH", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>.</mo><mn>38</mn><mo>&nbsp;</mo><mi>eV</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: -17px; top: 38px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "wjDtj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>38</mn><mo>&nbsp;</mo><mi>eV</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: -5px; top: -6px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "qhvqI", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>38</mn><mo>&nbsp;</mo><mi>eV</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 3px; top: 38px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The total energy of electron initially <math> <mrow> <mo>=</mo><mfrac> <mrow> <mi>h</mi><mi>c</mi></mrow> <mi>λ</mi> </mfrac> <mo>−</mo><mi>w</mi><mo>=</mo><mn>1.18</mn></mrow> </math><br /><br />Final total energy <math> <mrow> <mo>=</mo><mo>−</mo><mn>2.2</mn></mrow> </math><br /><br />The difference of energy when photoelectron recombines with <math><mi mathvariant=\"normal\">α</mi></math> -particle<br /><br /><math><mo>=</mo><mn>1.18</mn><mo>-</mo><mfenced separators=\"|\"><mrow><mo>-</mo><mn>2.2</mn></mrow></mfenced></math><br /><br /><math><mo>=</mo><mn>3.38</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">V</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637203ea0b1e925d7a", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "89", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Consider a hydrogen-like sample of gas whose energy in the <math><msup><mrow><mi>n</mi></mrow><mrow><mi>t</mi><mi>h</mi></mrow></msup></math> excited state is given by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mi>n</mi></msub><mo>=</mo><mfrac><mrow><mo>-</mo><mn>13.6</mn><msup><mi>Z</mi><mn>2</mn></msup></mrow><msup><mi>n</mi><mn>2</mn></msup></mfrac><mo>&nbsp;</mo><mi>eV</mi></math>. When the electron makes transitions from an excited state to the ground state, the most energetic photons can have energy <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mrow><mi>m</mi><mi>a</mi><mi>x</mi></mrow></msub><mo>=</mo><mn>52.224</mn><mi>&nbsp;</mi><mi>eV</mi></math> and the least energetic photons can have energy <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mrow><mi>m</mi><mi>i</mi><mi>n</mi></mrow></msub><mo>=</mo><mn>1.224</mn><mi>&nbsp;</mi><mi>eV</mi></math>. If the atomic number of the atom and the state of excitation are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Z</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>&nbsp;respectively, then what is the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Z</mi><mo>+</mo><mi>n</mi></math>?", "image": null}, "options": [], "correctValue": "7", "solution": {"text": "<math><mn>52.224</mn><mo>=</mo><mn>13.6</mn><msup><mrow><mi>Z</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>&nbsp;</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced><mi>&nbsp;</mi></math> .....(1)<br /><br /><math><mn>1.224</mn><mo>=</mo><mn>13.6</mn><msup><mrow><mi>z</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>&nbsp;</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced><mi>&nbsp;</mi></math> .....(2)<br /><br />On solving Z = 2 n = 5<br />Hence Z + n = 7", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPra
