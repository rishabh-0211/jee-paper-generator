><mfrac><mrow><mn>5</mn></mrow><mrow><mn>27</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86357bfac331e72bfd0", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "22", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An electron of a stationary hydrogen atom (mass =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math>)&nbsp;jumps from the fifth energy level to the ground level. As a result, the atom emits a photon and recoils with some velocity. The velocity that the atom acquires as a result of photon emission is [<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">h</mi></math>&nbsp;= Planck's constant,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math>&nbsp;= Rydberg's constant]", "image": null}, "options": [{"id": "iPpz9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>24</mn><mi>hR</mi></mrow><mrow><mn>25</mn><mi mathvariant=\"normal\">m</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "JxHI0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>25</mn><mi>hR</mi></mrow><mrow><mn>24</mn><mi mathvariant=\"normal\">m</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "vJwVv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>24</mn><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>25</mn><mi>hR</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "0j4eI", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>25</mn><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>24</mn><mi>hR</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">E</mi><mn>5</mn></msub><mo>−</mo><msub><mi mathvariant=\"normal\">E</mi><mn>1</mn></msub><mo>=</mo><mfrac><mi>hc</mi><mi mathvariant=\"normal\">λ</mi></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>−</mo><mrow><mo>(</mo><mfrac><mi>Rhc</mi><msup><mn>5</mn><mn>2</mn></msup></mfrac><mo>−</mo><mi>Rhc</mi><mo>)</mo></mrow><mo>=</mo><mfrac><mi>hc</mi><mi mathvariant=\"normal\">λ</mi></mfrac></math><br />(where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi><mo>=</mo></math>Rydberg's constant,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">h</mi><mo>=</mo></math>Planck's constant and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">c</mi><mo>=</mo></math>speed of light in vacuum)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mn>24</mn><mn>25</mn></mfrac><mi mathvariant=\"normal\">R</mi><mo>=</mo><mfrac><mn>1</mn><mi mathvariant=\"normal\">λ</mi></mfrac></math><br /><br />But&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">λ</mi></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi mathvariant=\"normal\">v</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">h</mi><mi>mλ</mi></mfrac><mo>=</mo><mfrac><mrow><mn>24</mn><mi>Rh</mi></mrow><mrow><mn>25</mn><mi mathvariant=\"normal\">m</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863534522c064445742", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "35", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">H</mi></math>-atom moving with speed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">v</mi></math> makes a head-on collision with another <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">H</mi></math>-atom at rest. Both the atoms are in the ground state. The minimum value of velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">v</mi></math> for which one of the atoms may excite is", "image": null}, "options": [{"id": "1jzLi", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>6.25</mtext><mo>&#xD7;</mo><msup><mn>10</mn><mn>4</mn></msup><mo>&#xA0;</mo><mi mathvariant=\"normal\">m</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "5zwyW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>8</mtext><mo>&#xD7;</mo><msup><mn>10</mn><mn>4</mn></msup><mo>&#xA0;</mo><mi mathvariant=\"normal\">m</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "IuFhm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>7.25</mtext><mo>&#xD7;</mo><msup><mn>10</mn><mn>4</mn></msup><mo>&#xA0;</mo><mi mathvariant=\"normal\">m</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "KRLZd", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>13.6</mtext><mo>&#xD7;</mo><msup><mn>10</mn><mn>4</mn></msup><mo>&#xA0;</mo><mi mathvariant=\"normal\">m</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For <math><msub><mrow><mi mathvariant=\"normal\">v</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow></msub></math> collision should be completely inelastic.<br /><br />According to energy conservation principle,<br /><br /><math><mo>∴</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">m</mi><msubsup><mrow><mi mathvariant=\"normal\">v</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow><mrow><mn>2</mn></mrow></msubsup><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">m</mi><msup><mrow><mi mathvariant=\"normal\">v</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">m</mi><msup><mrow><mi mathvariant=\"normal\">v</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mo>∆</mo><mi mathvariant=\"normal\">E</mi></math> ...(i))<br /><br />According to momentum conservation principle.<br /><br /><math><mi mathvariant=\"normal\">m</mi><msub><mrow><mi mathvariant=\"normal\">v</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow></msub><mo>=</mo><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">v</mi><mo>+</mo><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">v</mi></math><br /><br /><math><mo>∴</mo><mi mathvariant=\"normal\">v</mi><mo>=</mo><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow></msub></mrow><mrow><mn>2</mn></mrow></mfrac></math> ...(ii)<br /><br />After solving eq. (i) an d(ii), we get<br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">m</mi><msubsup><mrow><mi mathvariant=\"normal\">v</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow><mrow><mn>2</mn></mrow></msubsup><mo>=</mo><mn>2</mn><mo>∆</mo><mi mathvariant=\"normal\">E</mi></math><br /><br /><math><mo>∴</mo><msub><mrow><mi mathvariant=\"normal\">v</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow></msub><mo>=</mo><msqrt><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>4</mn><mo>∆</mo><mi mathvariant=\"normal\">E</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi></mrow></mfrac></mrow></mfenced></msqrt></math><br /><br />Here, <math><mo>∆</mo><mi mathvariant=\"normal\">E</mi><mo>=</mo></math> minimum excitation energy<br /><br /><math><mo>=</mo><mn>10.2</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">V</mi></math><br /><br /><math><mi mathvariant=\"normal\">m</mi><mo>=</mo><mn>1.67</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>27</mn></mrow></msup><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi></math><br /><br /><math><mo>∴</mo><msub><mrow><mi mathvariant=\"normal\">v</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow></msub><mo>=</mo><msqrt><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>4</mn><mo>×</mo><mn>10.2</mn><mo>×</mo><mn>1.6</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>19</mn></mrow></msup></mrow><mrow><mn>1.67</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>27</mn></mrow></msup></mrow></mfrac></mrow></mfenced></msqrt></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mtext>6.25</mtext><mo>&#xD7;</mo><msup><mn>10</mn><mn>4</mn></msup><mo>&#xA0;</mo><mi mathvariant=\"normal\">m</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635164ff8770cd09d9", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "53", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A stationary hydrogen atom in the first excited state emits a photon. If the mass of the hydrogen atom is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>&nbsp;and its ionization energy is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi></math>, then the recoil velocity acquired by the atom is [speed of light =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>c</mi></math>]", "image": null}, "options": [{"id": "MXFOU", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><msqrt><mfrac><mrow><mn>3</mn><mi>E</mi></mrow><mrow><mn>2</mn><mi>m</mi></mrow></mfrac><mo>+</mo><msup><mi>c</mi><mn>2</mn></msup></msqrt></mfenced><mo>-</mo><mi>c</mi></math>", "image": null, "isCorrect": true}, {"id": "5vGpB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><msqrt><mfrac><mrow><mn>3</mn><mi>E</mi></mrow><mrow><mn>4</mn><mi>m</mi></mrow></mfrac><mo>+</mo><msup><mi>c</mi><mn>2</mn></msup></msqrt></mfenced><mo>-</mo><mi>c</mi></math>", "image": null, "isCorrect": false}, {"id": "UV47t", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><mi>E</mi></mrow><mrow><mn>4</mn><mi>m</mi><mi>c</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "n7Iqp", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>E</mi><mrow><mi>m</mi><mi>c</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mi>v</mi><mo>=</mo><mfrac><mi>h</mi><mi>&#955;</mi></mfrac></math>, here <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math>&nbsp;is recoil&nbsp;speed of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">H</mi></math>-atom and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi></math>&nbsp;is the wavelength of the photon.</p><p>When the electron jumps down from the first excited state to the ground state the energy released is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><msub><mi>E</mi><mrow><mn>2</mn><mo>&#8594;</mo><mn>1</mn></mrow></msub><mo>=</mo><mi>E</mi><mfenced><mrow><mn>1</mn><mo>-</mo><mfrac><mn>1</mn><msup><mn>2</mn><mn>2</mn></msup></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>3</mn><mi>E</mi></mrow><mn>4</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><mi>E</mi></mrow><mn>4</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup><mo>+</mo><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mi>&#955;</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><mi>E</mi></mrow><mn>4</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup><mo>+</mo><mi>m</mi><mi>v</mi><mi>c</mi></math></p><p>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mfrac><mi>m</mi><mn>2</mn></mfrac></mfenced><msup><mi>v</mi><mn>2</mn></msup><mo>+</mo><mfenced><mrow><mi>m</mi><mi>c</mi></mrow></mfenced><mi>v</mi><mo>-</mo><mfenced><mfrac><mrow><mn>3</mn><mi>E</mi></mrow><mn>4</mn></mfrac></mfenced><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>v</mi><mo>=</mo><mfenced close=\"]\" open=\"[\"><msqrt><mfrac><mrow><mn>3</mn><mi>E</mi></mrow><mrow><mn>2</mn><mi>m</mi></mrow></mfrac><mo>+</mo><msup><mi>c</mi><mn>2</mn></msup></msqrt></mfenced><mo>-</mo><mi>c</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634e6525b30b8628a4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "04", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the spectrum of the hydrogen atom, the ratio of the wavelengths of the longest wavelength in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi><mi>y</mi><mi>m</mi><mi>a</mi><mi>n</mi></math> series to the longest wavelength in the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mi>a</mi><mi>l</mi><mi>m</mi><mi>e</mi><mi>r</mi></math> series is", "image": null}, "options": [{"id": "4FNL8", "text": "<math> <mrow> <mfrac> <mn>5</mn> <mrow> <mn>27</mn></mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "3nz09", "text": "<math> <mrow>  <mfrac>   <mn>1</mn>   <mrow>    <mn>93</mn></mrow>  </mfrac>  </mrow></math>", "image": null, "isCorrect": false}, {"id": "RqW0U", "text": "<math> <mrow>  <mfrac>   <mn>4</mn>   <mrow>    <mn>9</mn></mrow>  </mfrac>  </mrow></math>", "image": null, "isCorrect": false}, {"id": "pLuxZ", "text": "<math> <mrow>  <mfrac>   <mn>3</mn>   <mrow>    <mn>2</mn></mrow>  </mfrac>  </mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>When an electron jumps&nbsp;down from any higher energy level to the first energy level, then the emitted lines form the Lyman series</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#160;</mi><mfrac><mn>1</mn><msub><mi>&#955;</mi><mi mathvariant=\"normal\">L</mi></msub></mfrac><mo>=</mo><mi>R</mi><mfenced separators=\"|\"><mrow><mfrac><mn>1</mn><msup><mn>1</mn><mn>2</mn></msup></mfrac><mo>-</mo><mfrac><mn>1</mn><msup><mi>n</mi><mn>2</mn></msup></mfrac></mrow></mfenced></math>, where<math><mi>&#160;</mi><mi>R</mi></math> is the Rydberg constant.</p><p>Similarly, when an electron&nbsp;jumps down&nbsp;from any higher energy level to the second energy level, then the emitted lines form the Balmer series</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msub><mi>&#955;</mi><mi mathvariant=\"normal\">B</mi></msub></mfrac><mo>=</mo><mi>R</mi><mfenced separators=\"|\"><mrow><mfrac><mn>1</mn><msup><mn>2</mn><mn>2</mn></msup></mfrac><mo>-</mo><mfrac><mn>1</mn><msup><mi>n</mi><mn>2</mn></msup></mfrac></mrow></mfenced></math><br /><br />For maximum wavelength, the energy gap should be the smallest</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>=</mo><mn>2</mn></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msub><mi>&#955;</mi><mi mathvariant=\"normal\">L</mi></msub></mfrac><mo>=</mo><mi>R</mi><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mfrac><mn>1</mn><msup><mn>2</mn><mn>2</mn></msup></mfrac></mrow></mfenced><mo>=</mo><mi>R</mi><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>3</mn><mi>R</mi></mrow><mn>4</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>=</mo><mn>3</mn></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msub><mi>&#955;</mi><mi mathvariant=\"normal\">B</mi></msub></mfrac><mo>=</mo><mi>R</mi><mfenced separators=\"|\"><mrow><mfrac><mn>1</mn><msup><mn>2</mn><mn>2</mn></msup></mfrac><mo>-</mo><mfrac><mn>1</mn><msup><mn>3</mn><mn>2</mn></msup></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>5</mn><mi>R</mi></mrow><mn>36</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>&#160;</mi><msub><mi>&#955;</mi><mi mathvariant=\"normal\">L</mi></msub></mrow><msub><mi>&#955;</mi><mi mathvariant=\"normal\">B</mi></msub></mfrac><mo>=</mo><mfrac><mn>5</mn><mn>27</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634d750b352e6e73b5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "99", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Let&nbsp;<math> <mrow> <msub> <mi>λ</mi> <mi>α</mi> </msub> </mrow> </math>, <math> <mrow> <msub> <mi>λ</mi> <mi>β</mi> </msub> </mrow> </math> and <math> <mrow> <mrow> <msubsup> <mi>λ</mi> <mi>α</mi> <mo>′</mo> </msubsup> </mrow> </mrow> </math> denote the wavelengths of the X-rays of the <math> <mrow> <msub> <mtext>K</mtext> <mi>α</mi> </msub> </mrow> </math>, <math> <mrow> <msub> <mtext>K</mtext> <mi>β</mi> </msub> </mrow> </math> and <math> <mrow> <msub> <mtext>L</mtext> <mi>α</mi> </msub> </mrow> </math> lines in the characteristic X-rays for a metal. Then,", "image": null}, "options": [{"id": "Kn8T6", "text": "<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <msub> <mi>λ</mi> <mi>β</mi> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <msub> <mi>λ</mi> <mi>α</mi> </msub> </mrow> </mfrac> <mo>+</mo Vl", "text": "<math> <mrow> <mtext>121</mtext><mtext>.6&nbsp;nm</mtext> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "7HmuA", "text": "<math> <mrow> <mtext>182</mtext><mtext>.4&nbsp;nm</mtext> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "C6LPv", "text": "<math> <mrow> <mtext>234</mtext><mtext>.4&nbsp;nm</mtext> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "2HcUC", "text": "<math> <mrow> <mtext>364</mtext><mtext>.8&nbsp;nm</mtext> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The wavelength (<math><mi>λ</mi><mo>)</mo></math> of lines is given by<br /><br /><math><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><mn>1</mn></mrow><mrow><mi>λ</mi></mrow></mfrac> <mo>=</mo><mi>R</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced></math><br /><br />For Lyman series, the shortest wavelength is for <math><mi>n</mi></math>=<math><mi>∞</mi></math> and longest is for <math><mi>n</mi><mo>=</mo> <mn>2</mn></math>.<br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mi>s</mi></mrow></msub></mrow></mfrac><mo>=</mo><mi>&nbsp;</mi><mi>R</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mo>…</mo><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo></math><br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mi>L</mi></mrow></msub></mrow></mfrac><mo>=</mo><mi>&nbsp;</mi><mi>R</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>1</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mi>R</mi></math> ...(ii)<br /><br />Dividing Eq.(ii) by Eq. (i) , we get<br /><br /><math><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mi>L</mi></mrow></msub></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mi>s</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math><br /><br />Given, <math><msub><mrow><mi>λ</mi></mrow><mrow><mi>s</mi></mrow></msub><mo>=</mo> <mo>91.2</mo> <mtext>nm</mtext></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>λ</mi></mrow><mrow><mi>L</mi></mrow></msub></math> = 91.2 <math><mo>×</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac> <mo>=</m     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
