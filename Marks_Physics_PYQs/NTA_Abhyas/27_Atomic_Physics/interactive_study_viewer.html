ll, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a258103e5fd299c9", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "67", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p align=\"left\" style=\"text-align:left;\"><span>A hydrogen atom initially in the ground level absorbs a photon which excites it to the <math><mrow><mi>n</mi><mo>=</mo><mn>4</mn> </mrow> </math> &nbsp;level. Determine the wavelength of the photon.</span></p>\r", "image": null}, "options": [{"id": "Mvbh5", "text": "<math> <mrow> <mn>8.6</mn><mo>×</mo><msup> <mrow> <mn>10</mn> </mrow> <mrow> <mo>−</mo><mn>7</mn>&nbsp; &nbsp;</mrow></msup><mtext>&nbsp;m</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "EJQJK", "text": "<math> <mrow> <mn>9.8</mn><mo>×</mo><msup> <mrow> <mn>10</mn> </mrow> <mrow> <mo>−</mo><mn>8</mn> </mrow> </msup> <mtext>&nbsp;m</mtext></mrow></math>", "image": null, "isCorrect": true}, {"id": "17JW0", "text": "<math> <mrow> <mn>7.4</mn><mo>×</mo><msup> <mrow> <mn>10</mn> </mrow> <mrow> <mo>−</mo><mn>8</mn> </mrow> </msup> <mtext>&nbsp;m</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "gS3Cu", "text": "<math> <mrow> <mn>8.2</mn><mo>×</mo><msup> <mrow> <mn>10</mn> </mrow> <mrow> <mo>−</mo><mn>8</mn> </mrow> </msup> <mtext>&nbsp;m</mtext></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><span>&nbsp;<span>&nbsp;<math> <mrow> <mfrac> <mn>1</mn> <mi>λ</mi> </mfrac> <mo>=</mo><mi>R</mi><mrow><mo>(</mo> <mrow> <mfrac> <mn>1</mn> <mrow> <msubsup> <mi>n</mi> <mn>1</mn> <mn>2</mn> </msubsup> </mrow> </mfrac> <mo>−</mo><mfrac> <mn>1</mn> <mrow> <msubsup> <mi>n</mi> <mn>2</mn> <mn>2</mn> </msubsup> </mrow> </mfrac> </mrow> <mo>)</mo></mrow> </mrow> </math> </span></span></p><p><span>&nbsp; &nbsp;<math> <mrow> <mfrac> <mn>1</mn> <mi>λ</mi> </mfrac> <mo>=</mo><mn>1.09</mn><mo>×</mo><msup> <mrow> <mn>10</mn> </mrow> <mn>7</mn> </msup> <mrow><mo>(</mo> <mrow> <mfrac> <mn>1</mn> <mrow> <msup> <mn>1</mn> <mn>2</mn> </msup> </mrow> </mfrac> <mo>−</mo><mfrac> <mn>1</mn> <mrow> <msup> <mn>4</mn> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> <mo>)</mo></mrow> </mrow> </math> </span></p><p><span>&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;<math> <mrow> <mo>=</mo><mn>1.09</mn><mo>×</mo><msup> <mrow> <mn>10</mn> </mrow> <mn>7</mn> </msup> <mrow><mo>(</mo> <mrow> <mfrac> <mrow> <mn>16</mn><mo>−</mo><mn>1</mn> </mrow> <mrow> <mn>16</mn> </mrow> </mfrac> </mrow> <mo>)</mo></mrow> </mrow> </math> </span></p><p><span>&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;<math> <mrow> <mo>=</mo><mn>1.09</mn><mo>×</mo><msup> <mrow> <mn>10</mn> </mrow> <mn>7</mn> </msup> <mo>×</mo><mfrac> <mrow> <mn>15</mn> </mrow> <mrow> <mn>16</mn> </mrow> </mfrac> </mrow> </math> </span></p><p><span>&nbsp; &nbsp;<math> <mrow> <mi>λ</mi><mo>=</mo><mfrac> <mrow> <mn>16</mn> </mrow> <mrow> <mn>1.09</mn><mo>×</mo><mn>15</mn><mo>×</mo><msup> <mrow> <mn>10</mn> </mrow> <mn>7</mn> </msup> </mrow> </mfrac> <mo>=</mo><mn>9.8</mn><mo>×</mo><msup> <mrow> <mn>10</mn> </mrow> <mrow> <mo>−</mo><mn>8</mn> </mrow> </msup> <mtext> </mtext><mtext>m</mtext></mrow></math></span></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639b68d1aea533a2e8", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "59", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A hydrogen atom moving at speed <math><mi>v</mi></math> collides with another hydrogen atom kept at rest. Find the minimum value of <math><mi>v</mi></math> for which one of the atoms may get ionised. The mass of a hydrogen atom <math><mo>=</mo><mn>1.67</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>27&nbsp;</mn></mrow></msup><mi>kg</mi><mo>.</mo></math> Assume completely inelastic collision.", "image": null}, "options": [{"id": "XYSvV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>.2</mo><mo>&#215;</mo><msup><mn>10</mn><mn>4</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "cyZMB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.3</mo><mo>&#215;</mo><msup><mn>10</mn><mn>4</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "Xfueu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.3</mo><mo>&#215;</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "rA32d", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>.2</mo><mo>&#215;</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Inelastic collision will take place, if a part of incident kinetic energy is utilised in exciting the atom. Here, one atom is to be ionised, i.e. <math><mo>∆</mo><mi>E</mi><mo>=</mo><mn>13.6</mn><mi>&nbsp;</mi><mi>eV</mi></math><br /><br />Assuming completely inelastic collision.<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/348494.PNG\" style=\"width: 200px; height: 75px;\" /><br /><br />For an inelastic collision<br /><br /><math><msub><mrow><mi>v</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mi>v</mi></math><br /><br />By momentum conservation,<br /><br /><math><mi>m</mi><mi>v</mi><mo>=</mo><mn>2</mn><mi>m</mi><mi>V</mi></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>V</mi><mo>=</mo><mfrac><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>m</mi><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>⋅</mo><mn>2</mn><mi>m</mi><msup><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mo>∆</mo><mi>E</mi></math><br /><br /><math><mtable><mtr><mtd><mo>=</mo><mi>m</mi><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mo>∆</mo><mi>E</mi></mtd><mtd><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mo>∵</mo><mi>V</mi><mo>=</mo><mrow><mrow><mi>v</mi></mrow><mo>/</mo><mrow><mn>2</mn></mrow></mrow></mrow></mfenced><mi>&nbsp;</mi></mtd></mtr></mtable></math><br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mi>m</mi><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mo>∆</mo><mi>E</mi></math><br /><br /><math><mi>v</mi><mo>=</mo><msqrt><mfrac><mrow><mn>4</mn><mo>∆</mo><mi>E</mi></mrow><mrow><mi>m</mi></mrow></mfrac></msqrt></math><br /><br /><math><msub><mrow><mi>v</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow></msub><mo>=</mo><msqrt><mfrac><mrow><mn>4</mn><mo>×</mo><mn>13.6</mn><mo>×</mo><mn>1.6</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>19</mn></mrow></msup></mrow><mrow><mn>1.67</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>27</mn></mrow></msup></mrow></mfrac></msqrt></math><br /><br /><math><mo>=</mo><mn>7.2</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>4</mn></mrow></msup><mrow><mrow><mi>&nbsp;m/s</mi></mrow></mrow></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639a9fc59fd6581cca", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "02", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Monochromatic radiation of wavelength <math> <mtext>λ</mtext> </math> is incident on a hydrogen sample in ground state. Hydrogen atoms absorb a fraction of light and subsequently emit radiation of six different wavelengths. Find the value of <math> <mtext>λ</mtext></math>.", "image": null}, "options": [{"id": "y17Md", "text": "<math> <mrow>  <mtext>102&#x00A0;nm</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "Lz5k7", "text": "<math> <mrow>  <mtext>100&#x00A0;nm</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "ioX6g", "text": "<math > <mrow>  <mtext>97</mtext><mtext>.5&#x00A0;nm</mtext></mrow></math>", "image": null, "isCorrect": true}, {"id": "wLD0E", "text": "<math> <mrow>  <mtext>94</mtext><mtext>.5&#x00A0;nm</mtext></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As the hydrogen atoms emit radiation of six different wavelengths, some of them must have been excited to <math> <mrow> <mtext>n</mtext><mo>=</mo><mn>4</mn></mrow> </math>, The energy in <math> <mrow> <mtext>n</mtext><mo>=</mo><mn>4</mn></mrow> </math> state is<br /><br />&nbsp;<math> <mrow> <msub> <mtext>E</mtext> <mn>4</mn> </msub> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>E</mtext> <mn>1</mn> </msub> </mrow> <mrow> <msup> <mn>4</mn> <mn>2</mn> </msup> </mrow> </mfrac> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> <mn>3</mn> <mo>·</mo> <mn>6</mn> <mtext>e</mtext> <mtext>V</mtext> </mrow> <mrow> <mn>1</mn> <mn>6</mn> </mrow> </mfrac> <mo>=</mo> <mo>-</mo> <mn>0</mn> <mo>·</mo> <mn>8</mn> <mn>5</mn> <mtext>eV.</mtext> </mrow> </math><br /><br />The energy needed to take a hydrogen atom from its ground state to <math> <mrow> <mtext>n</mtext><mo>=</mo><mn>4</mn></mrow> </math> is<br /><br /><math> <mrow> <mtext>13</mtext><mtext>.6&nbsp;eV&nbsp;-&nbsp;0</mtext><mtext>.85&nbsp;eV&nbsp;=&nbsp;12</mtext><mtext>.75&nbsp;eV</mtext></mrow> </math> .<br /><br />The photons of the incident radiation should have <math> <mrow> <mn>12.75</mn><mtext> </mtext><mtext> </mtext><mtext>eV</mtext></mrow> </math> of energy. So<br /><br />&nbsp;<math><mrow><mfrac><mrow><mtext>hc</mtext> </mrow> <mrow> <mi>λ</mi> </mrow> </mfrac> <mo>=</mo> <mn>1</mn> <mn>2</mn> <mo>·</mo> <mn>7</mn> <mn>5</mn> <mtext>eV</mtext> </mrow> </math><br /><br />or ,&nbsp;<math><mrow><mi>λ</mi> <mo>=</mo> <mfrac> <mrow> <mtext>hc</mtext> </mrow> <mrow> <mn>1</mn> <mn>2</mn> <mo>·</mo> <mn>7</mn> <mn>5</mn> <mtext>eV</mtext> </mrow> </mfrac> </mrow> </math><br /><br />&nbsp;<math><mrow><mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>2</mn> <mn>4</mn> <mn>2</mn> <mtext>eV</mtext> <mspace width=\"0.5em\"></mspace> <mtext>nm</mtext> </mrow> <mrow> <mn>1</mn> <mn>2</mn> <mo>·</mo> <mn>7</mn> <mn>5</mn> <mtext>eV</mtext> </mrow> </mfrac> </mrow> </math><br /><br />&nbsp;<math> <mrow> <mtext>=&nbsp;97</mtext><mtext>.5&nbsp;nm</mtext></mrow> </math>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638c672da127987ec2", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "43", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Imagine an electron moving in the potential field of a proton given by <math> <mrow> <mtext>V</mtext> <mo>=</mo> <msub> <mtext>V</mtext> <mn>0</mn> </msub> <mtext>&#160;ln</mtext> <mfrac> <mrow> <mtext>r</mtext> </mrow> <mrow> <msub> <mtext>r</mtext> <mn>0</mn> </msub> </mrow> </mfrac> </mrow> </math>&nbsp;where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>r</mi><mn>0</mn></msub></math>&nbsp;is a positive constant and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>&nbsp;is the distance between the electron and proton. Assuming Bohr&#39;s model to be applicable, the variation of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>r</mi><mi>n</mi></msub></math>&nbsp;with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>&nbsp;(principal quantum number) is", "image": null}, "options": [{"id": "6H2sL", "text": "<math> <mrow> <msub> <mtext>r</mtext> <mtext>n</mtext> </msub> <mo>∝</mo> <mtext>n</mtext> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "F7alz", "text": "<math><mrow>  <msub>          <mtext>r</mtext>        <mtext>n</mtext>  </msub>  <mo>&prop;</mo>  <mfrac>    <mrow>      <mn>1</mn>    </mrow>    <mrow>      <mtext>n</mtext>    </mrow>  </mfrac></mrow></math>", "image": null, "isCorrect": false}, {"id": "OMG1b", "text": "<math><mrow>  <msub>          <mtext>r</mtext>        <mtext>n</mtext>  </msub>  <mo>&prop;</mo>  <msup>          <mtext>n</mtext>        <mn>2</mn>  </msup></mrow></math>", "image": null, "isCorrect": false}, {"id": "VMYtW", "text": "<math><mrow>  <msub>          <mtext>r</mtext>        <mtext>n</mtext>  </msub>  <mo>&prop;</mo>  <mfrac>    <mrow>      <mn>1</mn>    </mrow>    <mrow>      <msup>              <mtext>n</mtext>            <mn>2</mn>      </msup>    </mrow>  </mfrac></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <mtext>U</mtext> <mo>=</mo> <mtext>eV</mtext> <mo>=</mo> <msub> <mtext>eV</mtext> <mn>0</mn> </msub> <mtext>&nbsp;ln</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>r</mtext> </mrow> <mrow> <msub> <mtext>r</mtext> <mn>0</mn> </msub> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math><br /><br /><math> <mrow> <mfenced close=\"|\" open=\"|\" separators=\",\"> <mrow> <mtext>F</mtext> </mrow> </mfenced> <mo>=</mo> <mfenced close=\"|\" open=\"|\" separators=\",\"> <mrow> <mo>-</mo> <mfrac> <mrow> <mtext>dU</mtext> </mrow> <mrow> <mtext>dr</mtext> </mrow> </mfrac> </mrow> </mfenced> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>eV</mtext> <mn>0</mn> </msub> </mrow> <mrow> <mtext>r</mtext> </mrow> </mfrac> </mrow> </math><br /><br />This force provide the necessary centripetal force.<br /><br />Hence&nbsp;<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <msup> <mtext>mv</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mtext>r</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>eV</mtext> <mn>0</mn> </msub> </mrow> <mrow> <mtext>r</mtext> </mrow> </mfrac> </mrow> </math><br /><br />or&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext>v</mtext> <mo>=</mo> <msqrt> <mfrac> <mrow> <msub> <mtext>eV</mtext> <mn>0</mn> </msub> </mrow> <mrow> <mtext>m</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>&nbsp;&nbsp;...(1)<br /><br />Moreover,<br /><br /><math> <mrow> <mtext>mvr</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>nh</mtext> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> </mrow> </math>&nbsp;&nbsp;...(2)<br /><br />Dividing Eq. (2) by Eq. (1), we have<br /><br /><math> <mrow> <mtext>mr</mtext> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>nh</mtext> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> </mrow> </mfenced> <msqrt> <mfrac> <mrow> <mtext>m</mtext> </mrow> <mrow> <msub> <mtext>eV</mtext> <mn>0</mn> </msub> </mrow> </mfrac> </msqrt> </mrow> </math>&nbsp;or <math> <mrow> <msub> <mtext>r</mtext> <mtext>n</mtext> </msub> <mo>∝</mo> <mtext>n</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638c5511c7f240c133", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "25", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If the radius of first Bohr's orbit is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi></math>, then de Broglie wavelength of an electron in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>3</mn><mi>rd</mi></msup></math> orbit is nearly", "image": null}, "options": [{"id": "u7Gbt", "text": "<math> <mrow> <mn>2&pi;x</mn> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "3nj8q", "text": "<math> <mrow> <mn>6πx</mn> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "MGIsn", "text": "<math> <mrow> <mn>9x</mn> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "ughxp", "text": "<math> <mrow> <mn>x/3</mn> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">r</mi><mn>3</mn></msub><mo>=</mo></math>Radius of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>3</mn><mi>rd</mi></msup></math>&nbsp;orbit</p><p>and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">r</mi><mn>1</mn></msub><mo>=</mo></math>Radius of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>1</mn><mi>st</mi></msup></math>&nbsp;orbit</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext>r</mtext><mn>3</mn></msub><mo>=</mo><msub><mtext>r</mtext><mn>1</mn></msub><mo>×</mo><mi mathvariant=\"normal\">n</mi><msup><mo>⁡</mo><mn>2</mn></msup><mo>=</mo><mtext>x</mtext><mo>×</mo><msup><mtext>3</mtext><mn>2</mn></msup><mo>=</mo><mtext>9x</mtext></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∵</mo><mo>&nbsp; &nbsp; 2</mo><msub><mi>πr</mi><mn>3</mn></msub><mo>=</mo><mi>nλ</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mtext>λ</mtext><mo>=</mo><mfrac><mrow><mn>2</mn><msub><mtext>πr</mtext><mn>3</mn></msub></mrow><mrow><mi mathvariant=\"normal\">n</mi><mo>⁡</mo></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mtext>π</mtext><mo>×</mo><mn>9</mn><mtext>x</mtext></mrow><mn>3</mn></mfrac><mo>=</mo><mn>6</mn><mtext>πx</mtext></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86389f819a21217aff1", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "80", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A hydrogen-like atom (described by the Bohr model) is observed to emit six wavelengths, originating from all possible transitions between a group of levels. These levels have energies between <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>0</mn><mo>.</mo><mn>85</mn><mo>&nbsp;</mo><mi>eV</mi></math> and<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mo>-</mo><mn>0</mn><mo>.</mo><mn>544</mn><mo>&nbsp;</mo><mi>eV</mi></math> (including both these values). Find the atomic number of the atom. (Take <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>hc</mi><mo>=</mo><mn>1240</mn><mo>&nbsp;</mo><mi>eV</mi><mo>&nbsp;</mo><mi>nm</mi></math>, ground state energy of hydrogen atom = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>13</mn><mo>.</mo><mn>6</mn><mo>&nbsp;</mo><mi>eV</mi></math>)", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "Total 6 lines are emitted. Therefore,<br /><br /><math><mrow><mfrac linethickness=\"1\"><mrow><mi>n</mi><mrow><mo maxsize=\"1.00em\">(</mo><mi>n</mi><mo>-</mo><mn>1</mn><mo maxsize=\"1.00em\">)</mo></mrow></mrow><mn>2</mn></mfrac><mo>=</mo><mn>6</mn></mrow></math><br /><br />or n = 4<br /><br />So, transition is taking place between m<sup>th</sup> energy state and (m + 3)<sup>th</sup> energy state.<br /><br />E<sub>m</sub> = - 0. 85 eV<br /><br />Or<br /><br /><math><mrow><mo>-</mo><mn>13.6</mn><mrow><mo maxsize=\"1.00em\">(</mo><mfrac linethickness=\"1\"><mrow><msup><mi>z</mi><mn>2</mn></msup></mrow><mrow><msup><mi>m</mi><mn>2</mn></msup></mrow></mfrac><mo maxsize=\"1.00em\">)</mo></mrow><mo>=</mo><mo>-</mo><mn>0.85</mn></mrow></math><br /><br />Or<br /><br /><math><mrow><mfrac linethickness=\"1\"><mi>z</mi><mi>m</mi></mfrac></mrow></math>= 0. 25 ... (i)<br /><br />Similarly, E<sub>m</sub> + 3 = - 0. 544 eV<br /><br />or <math><mrow><mo>-</mo><mn>13.6</mn><mfrac linethickness=\"1\"><mrow><msup><mi>z</mi><mn>2</mn></msup></mrow><mrow><msup><mrow><mo maxsize=\"1.00em\">(</mo><mi>m</mi><mo>+</mo><mn>3</mn><mo maxsize=\"1.00em\">)</mo></mrow><mn>2</mn></msup></mrow></mfrac></mrow></math> = - 0. 544<br /><br />or <math><mrow><mfrac linethickness=\"1\"><mi>z</mi><mrow><mo maxsize=\"1.00em\">(</mo><mi>m</mi><mo>+</mo><mn>3</mn><mo maxsize=\"1.00em\">)</mo></mrow></mfrac><mo>=</mo><mn>0.2</mn><mo>…</mo><mrow><mo maxsize=\"1.00em\">(</mo><mi>i</mi><mi>i</mi><mo maxsize=\"1.00em\">)</mo></mrow></mrow></math>&nbsp;...(ii)<br /><br />Solving Eqs. (i) and (ii) for z and m, we get<br /><br />m = 12 and z = 3<br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86389c45d0454d88dcc", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "26", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Which among the following has a Hydrogen-like spectrum and whose lines have wavelengths four times shorter than those of atomic Hydrogen?", "image": null}, "options": [{"id": "V4IF6", "text": "Helium ion", "image": null, "isCorrect": true}, {"id": "UfHu3", "text": "Beryllium ion", "image": null, "isCorrect": false}, {"id": "8EkhD", "text": "Lithium ion", "image": null, "isCorrect": false}, {"id": "sokOz", "text": "None of these ", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>For Hydrogen like atom,&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mi mathvariant=\"normal\">λ</mi><mo>'</mo></msup></mfrac><mi mathvariant=\"normal\">=</mi><mi mathvariant=\"normal\">R</mi><mo>⁡</mo><mi mathvariant=\"normal\">Z</mi><msup><mo>⁡</mo><mn>2</mn></msup><mfenced><mrow><mfrac><mn>1</mn><msubsup><mi mathvariant=\"normal\">n</mi><mn>1</mn><mn>2</mn></msubsup></mfrac><mo>-</mo><mfrac><mn>1</mn><msubsup><mi mathvariant=\"normal\">n</mi><mn>2</mn><mn>2</mn></msubsup></mfrac></mrow></mfenced></math>&nbsp;&nbsp;&nbsp;...(i)<br /><br />For Hydrogen atom,&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi mathvariant=\"normal\">λ</mi></mfrac><mi mathvariant=\"normal\">=</mi><mi mathvariant=\"normal\">R</mi><mo>⁡</mo><mfenced><mrow><mfrac><mn>1</mn><msubsup><mi mathvariant=\"normal\">n</mi><mn>1</mn><mn>2</mn></msubsup></mfrac><mo>-</mo><mfrac><mn>1</mn><msubsup><mi mathvariant=\"normal\">n</mi><mn>2</mn><mn>2</mn></msubsup></mfrac></mrow></mfenced></math>&nbsp;&nbsp;&nbsp;...(ii)<br /><br />Dividing Eqn (ii) by Eqn (i), we get<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi mathvariant=\"normal\">λ</mi><mo>'</mo></msup><mi mathvariant=\"normal\">λ</mi></mfrac><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">R</mi><mo>⁡</mo><mfenced><mrow><mfrac><mn>1</mn><msubsup><mi mathvariant=\"normal\">n</mi><mn>1</mn><mn>2</mn></msubsup></mfrac><mo>-</mo><mfrac><mn>1</mn><msubsup><mi mathvariant=\"normal\">n</mi><mn>2</mn><mn>2</mn></msubsup></mfrac></mrow></mfenced></mrow><mrow><msup><mtext>RZ</mtext><mn>2</mn></msup><mfenced><mrow><mfrac><mn>1</mn><msubsup><mi mathvariant=\"normal\">n</mi><mn>1</mn><mn>2</mn></msubsup></mfrac><mo>-</mo><mfrac><mn>1</mn><msubsup><mi mathvariant=\"normal\">n</mi><mn>2</mn><mn>2</mn></msubsup></mfrac></mrow></mfenced></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>or&nbsp;&nbsp;</mtext><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mfrac><msup><mi mathvariant=\"normal\">λ</mi><mo>'</mo></msup><mi mathvariant=\"normal\">λ</mi></mfrac><mo>=</mo><mfrac><mn>1</mn><mrow><mi mathvariant=\"normal\">Z</mi><msup><mo>⁡</mo><mn>2</mn></msup></mrow></mfrac></math><br /><br />According to problem,&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">λ</mi><mo>'</mo></msup><mo>=</mo><mfrac><mi mathvariant=\"normal\">λ</mi><mn>4</mn></mfrac></math> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</p><p>&nbsp;&nbsp;∴&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi mathvariant=\"normal\">λ</mi><mo>'</mo></msup><mrow><mn>4</mn><msup><mi mathvariant=\"normal\">λ</mi><mo>'</mo></msup></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><mrow><mi mathvariant=\"normal\">Z</mi><msup><mo>⁡</mo><mn>2</mn></msup></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mtext>       </mtext><mi mathvariant=\"normal\">Z</mi><mo>=</mo><mn>2</mn></math><br /><br />The atomic number of Helium atom is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mn>2</mn> </math>. Hence, the required element is Helium.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863897023d1bdd62d8b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "60", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Imagine an atom made up of a proton and a hypothetical particle of double the mass of the electron but having the same charge as that of the electron. Apply the Bohr atom model and consider all possible transitions of this hypothetical particle to the first excited level. The longest wavelength photon that will be emitted has wavelength <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>λ</mi></math>,&nbsp;(given in terms of Rydberg constant <math><mi>R</mi></math> for hydrogen atom) equal to", "image": null}, "options": [{"id": "8VleN", "text": "<math><mfrac><mrow><mn>9</mn></mrow><mrow><mn>5</mn><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "PNzfD", "text": "<math><mfrac><mrow><mn>36</mn></mrow><mrow><mn>5</mn><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "BPSn2", "text": "<math><mfrac><mrow><mn>18</mn></mrow><mrow><mn>5</mn><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "6jcRn", "text": "<math><mfrac><mrow><mn>4</mn></mrow><mrow><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In hydrogen atom, <math><msub><mrow><mi>E</mi></mrow><mrow><mi>n</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>R</mi><mi>h</mi><mi>c</mi></mrow><mrow><msup><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math><br /><br />Also, <math><msub><mrow><mi>E</mi></mrow><mrow><mi>n</mi></mrow></msub><mo>∝</mo><mi>m</mi></math>, where <math><mi>m</mi></math> is the mass of the electron. Here, the electron has been replaced by a particle, whose mass is double the mass of an electron. Therefore, for this hypothetical atom, energy in&nbsp;<math><mi>n</mi></math>th orbit will be given by<br /><br /><math><msub><mrow><mi>E</mi></mrow><mrow><mi>n</mi></mrow></msub><mo>=</mo><mo>-</mo><mfrac><mrow><mn>2</mn><mi>R</mi><mi>h</mi><mi>c</mi></mrow><mrow><msup><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math><br /><br />The longest wavelength (or minimum energy) photon will correspond to the transition of the particle from <math><mi>n</mi><mo>=</mo><mn>3&nbsp;</mn></math>to <math><mi>n</mi><mo>=</mo><mn>2</mn></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">x</mi></mrow></msub></mrow></mfrac><mo>=</mo><msub><mrow><mi>E</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>-</mo><msub><mrow><mi>E</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>2</mn><mi>R</mi><mi>h</mi><mi>c</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>2</mn><mi>R</mi><mi>h</mi><mi>c</mi><mo>×</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>36</mn></mrow></mfrac></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>λ</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">x</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mfrac><mrow><mn>5</mn></mrow><mrow><mn>18</mn></mrow></mfrac><mi>R</mi><mi>h</mi><mi>c</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>18</mn></mrow><mrow><mn>5</mn><mi>R</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863882fd61db65f000d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "68", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The kinetic energy of an electron having de-Broglie wavelength <math><mi>λ</mi></math>&nbsp;is ( <math><mi>h</mi><mo>=</mo></math> Planck's constant, <math><mi>m</mi><mo>=</mo></math> mass of electron)", "image": null}, "options": [{"id": "4LXZt", "text": "<math><mfrac><mrow><mi>h</mi></mrow><mrow><mn>2</mn><mi>m</mi><mi>λ</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "bf8ot", "text": "<math><mfrac><mrow><msup><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><mi>m</mi><msup><mrow><mi>λ</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "V9RAU", "text": "<math><mfrac><mrow><msup><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><msup><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>λ</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "UITnO", "text": "<math><mfrac><mrow><msup><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><msup><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>λ</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <mi>λ</mi><mo>=</mo><mfrac> <mi>h</mi> <mrow> <msqrt> <mrow> <mn>2</mn><mi>m</mi><mi>K</mi><mo>.</mo><mi>E</mi></mrow> </msqrt></mrow></mfrac></mrow></math><br /><br /><math> <mrow> <msup> <mi>λ</mi> <mn>2</mn> </msup> <mo>=</mo><mfrac> <mrow> <msup> <mi>h</mi> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn><mi>m</mi><mrow><mo>(</mo> <mrow> <mi>K</mi><mo>.</mo><mi>E</mi></mrow> <mo>)</mo></mrow></mrow> </mfrac></mrow></math><br /><br /><math> <mrow> <mrow><mo>(</mo> <mrow> <mi>K</mi><mo>.</mo><mi>E</mi></mrow> <mo>)</mo></mrow><mo>=</mo><mfrac> <mrow> <msup> <mi>h</mi> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn><mi>m</mi><msup> <mi>λ</mi> <mn>2</mn> </msup></mrow></mfrac></mrow></math><br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638674b0bcdd2db969", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "40", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The energy required to remove the electron from a singly ionized Helium atom is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>2</mn></math> times the energy required to remove an electron from helium atom. The total energy required to ionize the Helium atom completely is close to", "image": null}, "options": [{"id": "nWTYT", "text": "34 eV", "image": null, "isCorrect": false}, {"id": "JeBJk", "text": "20 eV", "image": null, "isCorrect": false}, {"id": "iRvhZ", "text": "79 eV", "image": null, "isCorrect": true}, {"id": "lG6tp", "text": "109 eV", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The energy required to remove <math> <mrow> <msup> <mtext>e</mtext> <mo>&#8722;</mo> </msup> </mrow> </math> from singly ionized helium atom <math><mo>=</mo><mi>&#160;</mi><mn>54.4</mn><mi>&#160;</mi><mn>e</mn><mn>V</mn></math><br /><br />The energy required to remove <math> <mrow> <msup> <mtext>e</mtext> <mo>&#8722;</mo> </msup> </mrow> </math> from helium atom <math><mo>=</mo><mi>x</mi><mi>&#160;eV</mi></math>&nbsp;<br /><br />given <math><mn>54.4&#160;</mn><mn>e</mn><mn>V</mn><mo>=</mo><mn>2.2&#160;</mn><mi>x</mi><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mn>24.73</mn><mi>&#160;</mi><mn>e</mn><mn>V</mn></math><br /><br />The energy required to ionize helium atom <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>&#160;</mi><mn>79.13</mn><mi>&#160;</mi><mn>e</mn><mn>V</mn><mo>&#8776;</mo><mn>79</mn><mo>&#160;</mo><mi>eV</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86383fde364b5438079", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "75", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Maximum energy is evolved during which of the following transitions?", "image": null}, "options": [{"id": "D9Nxm", "text": "<math><mi>n</mi><mo>=</mo><mn>1</mn><mi> </mi><mi>t</mi><mi>o</mi><mi> </mi><mi>n</mi><mo>=</mo><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "gVCh6", "text": "<math><mi>n</mi><mo>=</mo><mn>2</mn><mi> </mi><mi> </mi><mi>t</mi><mi>o</mi><mi> </mi><mi>n</mi><mo>=</mo><mn>6</mn></math>", "image": null, "isCorrect": false}, {"id": "bXzfB", "text": "<math><mi>n</mi><mo>=</mo><mn>2</mn><mi> </mi><mi>t</mi><mi>o</mi><mi> </mi><mi> </mi><mi>n</mi><mo>=</mo><mn>1</mn></math>", "image": null, "isCorrect": true}, {"id": "DAzcO", "text": "<math><mi>n</mi><mo>=</mo><mn>6</mn><mi> </mi><mi> </mi><mi>t</mi><mi>o</mi><mi> </mi><mi>n</mi><mo>=</mo><mn>2</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When transition is from upper state to lower state, the energy is evolved. Therefore, options (C) and (d) are practicable.<br/><br/>In option (C)<br/><br/>                 <math><mi>E</mi><mo>=</mo><mo>-</mo><mi>R</mi><mi>h</mi><mi>c</mi><mi> </mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced><mo>=</mo><mo>-</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mi>R</mi><mi>h</mi><mi>c</mi></math> <br/><br/>        In option (d)<br/><br/>                 <math><mi>E</mi><mo>=</mo><mo>-</mo><mi>R</mi><mi>h</mi><mi>c</mi><mi> </mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mn>6</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced></math> <br/><br/> <math><mo>=</mo><mo>-</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>9</mn></mrow></mfrac><mi>R</mi><mi>h</mi><mi>c</mi></math>  <br/><br/>        Thus, maximum energy is evolved in option (c).", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86382c0861ee269c017", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "13", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A&nbsp;sample of atomic hydrogen gas is irradiated by a beam of ultraviolet radiation having a wavelength between <math> <mrow> <mtext>100&nbsp;nm</mtext></mrow> </math> and <math> <mrow> <mtext>200&nbsp;nm</mtext></mrow></math>. Assuming that the atoms are in the ground state, the wavelength which will have low intensity in the transmitted beam is</p>\r", "image": null}, "options": [{"id": "YXGUl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>104&#xA0;nm</mtext></math>", "image": null, "isCorrect": false}, {"id": "9PPg4", "text": "<math> <mrow> <mtext>103&nbsp;nm</mtext></mrow> </math>", "image": null, "isCorrect": true}, {"id": "eCAgq", "text": "<math> <mrow>  <mtext>105&#x00A0;nm</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "AsFUk", "text": "<math> <mrow>  <mtext>100&#x00A0;nm</mtext></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The energy of a&nbsp; photon corresponding to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi><mo>=</mo><mn>100</mn><mo>&#160;</mo><mi>nm</mi></math> is,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>1</mn><mn>2</mn><mn>4</mn><mn>2</mn><mspace width=\"0.5em\"/><mtext>eV&#160;nm</mtext></mrow><mrow><mn>1</mn><mn>0</mn><mn>0</mn><mspace width=\"0.5em\"/><mtext>nm</mtext></mrow></mfrac><mo>=</mo><mn>1</mn><mn>2</mn><mo>&#183;</mo><mn>4</mn><mn>2</mn><mo>&#160;</mo><mtext>eV</mtext></math></p><p>Similarly, the corresponding to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#955;</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>200</mn><mo>&#160;</mo><mi>nm</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>.</mo><mn>21</mn><mo>&#160;</mo><mi>eV</mi></math>.</p><p>The energy needed to take the atom from the ground state to the first excited state is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>2</mn></msub><mo>-</mo><msub><mi>E</mi><mn>1</mn></msub><mo>=</mo><mn>13</mn><mo>.</mo><mn>6</mn><mo>&#160;</mo><mi>eV</mi><mo>-</mo><mn>3</mn><mo>.</mo><mn>4</mn><mo>&#160;</mo><mi>eV</mi><mo>=</mo><mn>10</mn><mo>.</mo><mn>2</mn><mo>&#160;</mo><mi>eV</mi></math></p><p>The energy needed to take the atom from the ground state&nbsp;to the second excited state is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>3</mn></msub><mo>-</mo><msub><mi>E</mi><mn>1</mn></msub><mo>=</mo><mn>13</mn><mo>.</mo><mn>6</mn><mo>&#160;</mo><mi>eV</mi><mo>-</mo><mn>1</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi>eV</mi><mo>=</mo><mn>12</mn><mo>.</mo><mn>1</mn><mo>&#160;</mo><mi>eV</mi></math></p><p>The energy needed to take the atom from the ground state&nbsp;to the third excited state is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>4</mn></msub><mo>-</mo><msub><mi>E</mi><mn>1</mn></msub><mo>=</mo><mn>13</mn><mo>.</mo><mn>6</mn><mo>&#160;</mo><mi>eV</mi><mo>-</mo><mn>0</mn><mo>.</mo><mn>85</mn><mo>&#160;</mo><mi>eV</mi><mo>=</mo><mn>12</mn><mo>.</mo><mn>75</mn><mo>&#160;</mo><mi>eV</mi></math>,&nbsp;and so on.</p><p>Thus, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>.</mo><mn>2</mn><mo>&#160;</mo><mi>eV</mi></math> photons and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>.</mo><mn>1</mn><mo>&#160;</mo><mi>eV</mi></math> photons have a large probability of being absorbed from the given range of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>.</mo><mn>21</mn><mo>&#160;</mo><mi>eV</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>.</mo><mn>42</mn><mo>&#160;</mo><mi>eV</mi></math>.</p><p>The corresponding wavelengths are</p><p><math> <mrow> <msub> <mi>&#955;</mi> <mn>1</mn> </msub> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>2</mn> <mn>4</mn> <mn>2</mn> <mspace width=\"0.5em\"></mspace> <mtext>eV</mtext> <mspace width=\"0.5em\"></mspace> <mtext>nm</mtext> </mrow> <mrow> <mn>1</mn> <mn>0</mn> <mo>&#183;</mo> <mn>2</mn> <mspace width=\"0.5em\"></mspace> <mtext>eV</mtext> </mrow> </mfrac> <mo>=</mo> <mn>1</mn> <mn>2</mn> <mn>2</mn> <mspace width=\"0.5em\"></mspace> <mtext>nm</mtext> </mrow> </math></p><p><br /><math> <mrow> <msub> <mi>&#955;</mi> <mn>2</mn> </msub> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>2</mn> <mn>4</mn> <mn>2</mn> <mspace width=\"0.5em\"></mspace> <mtext>eV</mtext> <mspace width=\"0.5em\"></mspace> <mtext>nm</mtext> </mrow> <mrow> <mn>1</mn> <mn>2</mn> <mo>&#183;</mo> <mn>1</mn> <mspace width=\"0.5em\"></mspace> <mtext>eV</mtext> </mrow> </mfrac> <mo>=</mo> <mn>1</mn> <mn>0</mn> <mn>3</mn> <mspace width=\"0.5em\"></mspace> <mtext>nm</mtext> </mrow> </math><br />These wavelengths will have low intensity in the transmitted beam.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86378c96ac0af24499b", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "54", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Which state of triply ionised beryllium (<math><mi mathvariant=\"normal\">B</mi><msup><mrow><mi mathvariant=\"normal\">e</mi></mrow><mrow><mn>3</mn><mo>+</mo></mrow></msup></math>) has the same orbital radius as that of ground state of hydrogen?", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "Radius of orbit of electron in <math><mi>n</mi></math>th excited state of hydrogen<br /><br /><math><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>r</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>=</mo><mfrac><mrow><msub><mrow><mi>ε</mi></mrow><mrow><mn>0</mn></mrow></msub><msup><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><msup><mrow><mi>π</mi><mi>m</mi><mi>Z</mi><mi>e</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>r</mi><mo>∝</mo><mfrac><mrow><msup><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>Z</mi></mrow></mfrac><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mo>…</mo><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><msub><mrow><mi>r</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msubsup><mrow><mi>n</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><msubsup><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow></mfrac><mo>×</mo><mfrac><mrow><msub><mrow><mi>Z</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>Z</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></math><br /><br />But <math><msub><mrow><mi>r</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br />So, <math><msubsup><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>=</mo><msubsup><mrow><mi>n</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mi>&nbsp;</mi><mo>×</mo><mfrac><mrow><msub><mrow><mi>Z</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>Z</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></math><br /><br />Here,<br /><br /><math> <mrow> <msub> <mrow> <mi>n</mi><mo>⁡</mo> </mrow> <mn>1</mn> </msub> </mrow> </math> = 1(ground state of hydrogen),<br /><br /><math> <mrow> <msub> <mrow> <mi>Z</mi><mo>⁡</mo> </mrow> <mn>1</mn> </msub> </mrow> </math> = 1(atomic number of hydrogen),<br /><br /><math> <mrow> <msub> <mrow> <mi>Z</mi><mo>⁡</mo> </mrow> <mn>2</mn> </msub> </mrow> </math> = 4(atomic number of beryllium)<br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><msqrt><msubsup><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup></msqrt> <mo>=</mo> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>1</mn> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> <mo>×</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>1</mn></mrow></mfrac></math><br /><br />or<math><msubsup><mrow><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>n</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup></math> <math><mo>=</mo><mn>4</mn></math><br /><br />or &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mrow> <mi>n</mi><mo>⁡</mo> </mrow> <mn>2</mn> </msub> <mo>=</mo> <mn>2</mn> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637871a482540ea58d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "50", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Photoelectrons are emitted when <math><mn>4000</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Å</mi></math> radiation is incident on a surface of work function <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>9</mn><mo>&nbsp;</mo><mi>eV</mi></math>. These photoelectrons pass through a region having&nbsp;<math><mi>α</mi> </math> -particles to form <math><mi mathvariant=\"normal\">H</mi><msup><mrow><mi mathvariant=\"normal\">e</mi></mrow><mrow><mo>+</mo></mrow></msup></math> ion, emitting a single photon. In this process,&nbsp;<math><mi mathvariant=\"normal\">H</mi><msup><mrow><mi mathvariant=\"normal\">e</mi></mrow><mrow><mo>+</mo></mrow></msup></math> ions thus formed are in their fourth excited state. The energy released during the combination of <math><mi mathvariant=\"normal\">H</mi><msup><mrow><mi mathvariant=\"normal\">e</mi></mrow><mrow><mo>+</mo></mrow></msup></math> ions is", "image": null}, "options": [{"id": "kCeJw", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>.</mo><mn>38</mn><mo>&nbsp;</mo><mi>eV</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: -6px; top: 38px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "TVtYH", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>.</mo><mn>38</mn><mo>&nbsp;</mo><mi>eV</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: -17px; top: 38px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "wjDtj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>38</mn><mo>&nbsp;</mo><mi>eV</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: -5px; top: -6px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "qhvqI", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>38</mn><mo>&nbsp;</mo><mi>eV</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 3px; top: 38px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The total energy of electron initially <math> <mrow> <mo>=</mo><mfrac> <mrow> <mi>h</mi><mi>c</mi></mrow> <mi>λ</mi> </mfrac> <mo>−</mo><mi>w</mi><mo>=</mo><mn>1.18</mn></mrow> </math><br /><br />Final total energy <math> <mrow> <mo>=</mo><mo>−</mo><mn>2.2</mn></mrow> </math><br /><br />The difference of energy when photoelectron recombines with <math><mi mathvariant=\"normal\">α</mi></math> -particle<br /><br /><math><mo>=</mo><mn>1.18</mn><mo>-</mo><mfenced separators=\"|\"><mrow><mo>-</mo><mn>2.2</mn></mrow></mfenced></math><br /><br /><math><mo>=</mo><mn>3.38</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">V</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637203ea0b1e925d7a", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "89", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Consider a hydrogen-like sample of gas whose energy in the <math><msup><mrow><mi>n</mi></mrow><mrow><mi>t</mi><mi>h</mi></mrow></msup></math> excited state is given by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mi>n</mi></msub><mo>=</mo><mfrac><mrow><mo>-</mo><mn>13.6</mn><msup><mi>Z</mi><mn>2</mn></msup></mrow><msup><mi>n</mi><mn>2</mn></msup></mfrac><mo>&nbsp;</mo><mi>eV</mi></math>. When the electron makes transitions from an excited state to the ground state, the most energetic photons can have energy <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mrow><mi>m</mi><mi>a</mi><mi>x</mi></mrow></msub><mo>=</mo><mn>52.224</mn><mi>&nbsp;</mi><mi>eV</mi></math> and the least energetic photons can have energy <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mrow><mi>m</mi><mi>i</mi><mi>n</mi></mrow></msub><mo>=</mo><mn>1.224</mn><mi>&nbsp;</mi><mi>eV</mi></math>. If the atomic number of the atom and the state of excitation are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Z</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>&nbsp;respectively, then what is the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Z</mi><mo>+</mo><mi>n</mi></math>?", "image": null}, "options": [], "correctValue": "7", "solution": {"text": "<math><mn>52.224</mn><mo>=</mo><mn>13.6</mn><msup><mrow><mi>Z</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>&nbsp;</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced><mi>&nbsp;</mi></math> .....(1)<br /><br /><math><mn>1.224</mn><mo>=</mo><mn>13.6</mn><msup><mrow><mi>z</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>&nbsp;</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced><mi>&nbsp;</mi></math> .....(2)<br /><br />On solving Z = 2 n = 5<br />Hence Z + n = 7", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636c7fc5997126e8bc", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "97", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The binding energy of an electron in the ground state of He is equal to 24.6 eV. What is the amount of energy (in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>eV</mi></math>) required to remove both the electrons?", "image": null}, "options": [], "correctValue": "79", "solution": {"text": "Helium atom has 2 electrons. When one electron is removed, the remaining atom is hydrogen like atom, whose energy in first orbit is<br /><math><msub><mrow><mi>E</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mo>-</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mfenced separators=\"|\"><mrow><mn>13.6</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">V</mi></mrow></mfenced><mo>=</mo><mo>-</mo><mn>54.4</mn><mi>&#160;</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">V</mi></math><br />Therefore, to remove the second electron from the atom, the additional energy of 54.4 eV is required. Hence, total energy required to remove both the electrons <math><mo>=</mo><mn>24.6</mn><mo>+</mo><mn>54.4</mn><mo>=</mo><mn>79.0</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">V</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636b1e232f36ff8ec8", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "76", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A Bohr hydrogen atom undergoes a transition <math><mi>n</mi><mo>=</mo><mn>5</mn><mo>→</mo><mi>n</mi><mo>=</mo><mn>4</mn></math> and emits a photon of frequency <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ν</mi></math>. Fr ><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>&#960;</mi><mi>m</mi><mi>Z</mi><msup><mrow><mi>e</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math><br /><br />de-Broglie wavelength<br /><br /><math><mi>&#955;</mi><mo>=</mo><mfrac><mrow><mi>h</mi></mrow><mrow><mi>m</mi><mi>v</mi></mrow></mfrac></math><br /><br />The ratio of both <math><mi>r</mi></math> and <math><mi>&#955;</mi></math>,&nbsp;<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#160;</mi><mfrac><mi>r</mi><mi>&#955;</mi></mfrac></math> = <math><mfrac><mrow><msub><mrow><mi>&#949;</mi></mrow><mrow><mn>0</mn></mrow></msub><msup><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>&#960;</mi><mi>m</mi><mi>Z</mi><msup><mrow><mi>e</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>&#215;</mo><mfrac><mrow><mi>m</mi><mi>v</mi></mrow><mrow><mi>h</mi></mrow></mfrac></math><br /><br />&nbsp; &nbsp; &nbsp;&nbsp;<math> <mo>=</mo><mfrac><mrow><msub><mrow><mi>&#949;</mi></mrow><mrow><mn>0</mn></mrow></msub><msup><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>h</mi><mi>v</mi></mrow><mrow><mi>&#960;</mi><mi>Z</mi><msup><mrow><mi>e</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math><br /><br />But <math><mi>v</mi><mo>=</mo></math> <math><mfrac><mrow><msup><mrow><mi>Z</mi><mi>e</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><mi>h</mi><msub><mrow><mi>&#949;</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>n</mi></mrow></mfrac></math> for <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>n</mi><mi>th</mi></msup></math>&nbsp;orbit<br /><br />Hence, <math><mfrac><mrow><mi>r</mi></mrow><mrow><mi>&#955;</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>n</mi></mrow><mrow><mn>2</mn><mi>&#960;</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86357bfac331e72bfd0", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "22", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An electron of a stationary hydrogen atom (mass =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math>)&nbsp;jumps from the fifth energy level to the ground level. As a result, the atom emits a photon and recoils with some velocity. The velocity that the atom acquires as a result of photon emission is [<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">h</mi></math>&nbsp;= Planck's constant,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math>&nbsp;= Rydberg's constant]", "image": null}, "options": [{"id": "iPpz9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>24</mn><mi>hR</mi></mrow><mrow><mn>25</mn><mi mathvariant=\"normal\">m</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "JxHI0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>25</mn><mi>hR</mi></mrow><mrow><mn>24</mn><mi mathvariant=\"normal\">m</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "vJwVv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>24</mn><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>25</mn><mi>hR</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "0j4eI", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>25</mn><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>24</mn><mi>hR</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">E</mi><mn>5</mn></msub><mo>−</mo><msub><mi mathvariant=\"normal\">E</mi><mn>1</mn></msub><mo>=</mo><mfrac><mi>hc</mi><mi mathvariant=\"normal\">λ</mi></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>−</mo><mrow><mo>(</mo><mfrac><mi>Rhc</mi><msup><mn>5</mn><mn>2</mn></msup></mfrac><mo>−</mo><mi>Rhc</mi><mo>)</mo></mrow><mo>=</mo><mfrac><mi>hc</mi><mi mathvariant=\"normal\">λ</mi></mfrac></math><br />(where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi><mo>=</mo></math>Rydberg's constant,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">h</mi><mo>=</mo></math>Planck's constant and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">c</mi><mo>=</mo></math>speed of light in vacuum)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mn>24</mn><mn>25</mn></mfrac><mi mathvariant=\"normal\">R</mi><mo>=</mo><mfrac><mn>1</mn><mi mathvariant=\"normal\">λ</mi></mfrac></math><br /><br />But&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">λ</mi></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi mathvariant=\"normal\">v</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">h</mi><mi>mλ</mi></mfrac><mo>=</mo><mfrac><mrow><mn>24</mn><mi>Rh</mi></mrow><mrow><mn>25</mn><mi mathvariant=\"normal\">m</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86354fa6e5ddf2094bc", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "06", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef mal\">m</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "IuFhm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>7.25</mtext><mo>&#xD7;</mo><msup><mn>10</mn><mn>4</mn></msup><mo>&#xA0;</mo><mi mathvariant=\"normal\">m</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "KRLZd", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>13.6</mtext><mo>&#xD7;</mo><msup><mn>10</mn><mn>4</mn></msup><mo>&#xA0;</mo><mi mathvariant=\"normal\">m</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For <math><msub><mrow><mi mathvariant=\"normal\">v</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow></msub></math> collision should be completely inelastic.<br /><br />According to energy conservation principle,<br /><br /><math><mo>∴</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">m</mi><msubsup><mrow><mi mathvariant=\"normal\">v</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow><mrow><mn>2</mn></mrow></msubsup><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">m</mi><msup><mrow><mi mathvariant=\"normal\">v</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">m</mi><msup><mrow><mi mathvariant=\"normal\">v</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mo>∆</mo><mi mathvariant=\"normal\">E</mi></math> ...(i))<br /><br />According to momentum conservation principle.<br /><br /><math><mi mathvariant=\"normal\">m</mi><msub><mrow><mi mathvariant=\"normal\">v</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow></msub><mo>=</mo><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">v</mi><mo>+</mo><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">v</mi></math><br /><br /><math><mo>∴</mo><mi mathvariant=\"normal\">v</mi><mo>=</mo><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow></msub></mrow><mrow><mn>2</mn></mrow></mfrac></math> ...(ii)<br /><br />After solving eq. (i) an d(ii), we get<br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">m</mi><msubsup><mrow><mi mathvariant=\"normal\">v</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow><mrow><mn>2</mn></mrow></msubsup><mo>=</mo><mn>2</mn><mo>∆</mo><mi mathvariant=\"normal\">E</mi></math><br /><br /><math><mo>∴</mo><msub><mrow><mi mathvariant=\"normal\">v</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow></msub><mo>=</mo><msqrt><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>4</mn><mo>∆</mo><mi mathvariant=\"normal\">E</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi></mrow></mfrac></mrow></mfenced></msqrt></math><br /><br />Here, <math><mo>∆</mo><mi mathvariant=\"normal\">E</mi><mo>=</mo></math> minimum excitation energy<br /><br /><math><mo>=</mo><mn>10.2</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">V</mi></math><br /><br /><math><mi mathvariant=\"normal\">m</mi><mo>=</mo><mn>1.67</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>27</mn></mrow></msup><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"n </mi></msub></math>", "image": null, "isCorrect": false}, {"id": "ZrIqM", "text": "<math ><mo>-</mo><mfrac><mn>13.6</mn><mn>207</mn></mfrac><mi mathvariant=\"normal\">&#xA0;</mi><mi>eV</mi><mo>,</mo><mo>&#xA0;</mo><mfrac><msub><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">H</mi></msub><mn>207</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "DZOur", "text": "<math><mo>-</mo><mfrac><mn>13.6</mn><mn>207</mn></mfrac><mi mathvariant=\"normal\">&#xA0;</mi><mi>eV</mi><mo>,</mo><mi mathvariant=\"normal\">&#xA0;</mi><mn>207</mn><msub><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">H</mi></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The total energy of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">n</mi><mi>th</mi></msup></math> orbit,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">E</mi><mi mathvariant=\"normal\">n</mi></msub><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><mo>-</mo><mfrac><msup><mi>me</mi><mn>4</mn></msup><mrow><mn>8</mn><msubsup><mi mathvariant=\"normal\">ε</mi><mn>0</mn><mn>2</mn></msubsup><msup><mi mathvariant=\"normal\">h</mi><mn>2</mn></msup></mrow></mfrac><mo>·</mo><mfrac><mn>1</mn><msup><mi mathvariant=\"normal\">n</mi><mn>2</mn></msup></mfrac></math><br /><br />Obviously <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">E</mi><mi mathvariant=\"normal\">n</mi></msub><mo>∝</mo><mi mathvariant=\"normal\">m</mi></math><br /><br /><math><mo>∴</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi mathvariant=\"normal\">E</mi><mi mathvariant=\"normal\">μ</mi></msub><msub><mi mathvariant=\"normal\">E</mi><mi mathvariant=\"normal\">e</mi></msub></mfrac><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">μ</mi></msub><msub><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi></msub></mfrac></math><br /><br /><math><mo>⇒</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">E</mi><mi mathvariant=\"normal\">μ</mi></msub><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">μ</mi></msub><msub><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi></msub></mfrac><mo>×</mo><msub><mi mathvariant=\"normal\">E</mi><mi mathvariant=\"normal\">e</mi></msub></math><br /><br />Ground state energy of a proton in a hydrogen atom,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">E</mi><mi mathvariant=\"normal\">μ</mi></msub><mo>=</mo><mo>-</mo><mtext>13.6</mtext><mo>×</mo><mfrac><mrow><mn>207</mn><msub><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi></msub></mrow><msub><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi></msub></mfrac><mo>&nbsp;</mo><mi>eV</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mtext>13.6</mtext><mo>×</mo><mn>207</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi>eV</mi></math><br /><br />( <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∵</mo><mo>&nbsp;&nbsp;</mo><mi mathvariant=\"normal\">&nbsp;</mi><msub><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">μ</mi></msub><mo>=</mo><mn>207</mn><msub><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi></msub><mo>,</mo></math> where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi></msub></math> is the mass of an electron)<br /><br />We know that,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi><mo>=</mo><mfrac><mrow><msub><mi mathvariant=\"normal\">ε</mi><mn>0</mn></msub><msup><mi mathvariant=\"normal\">h</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">n</mi><mn>2</mn></msup></mrow><mrow><mn>207</mn><msub><mi>πm</mi><mi mathvariant=\"normal\">e</mi></msub><msup><mi mathvariant=\"normal\">e</mi><mn>2</mn></msup></mrow></mfrac></math><br /><br />For ground state <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi mathvariant=\"normal\">n=</mi><mn>1</mn></mrow></mfenced></math> for proton, we have<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">μ</mi></msub><mo>=</mo><mfrac><mrow><msub><mi mathvariant=\"normal\">ε</mi><mn>0</mn></msub><msup><mi mathvariant=\"normal\">h</mi><mn>2</mn></msup></mrow><mrow><mn>207</mn><msub><mi>πm</mi><mi mathvariant=\"normal\">e</mi></msub><mo>·</mo><msup><mi mathvariant=\"normal\">e</mi><mn>2</mn></msup></mrow></mfrac></math><br /><br />But <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi mathvariant=\"normal\">ε</mi><mn>0</mn></msub><msup><mi mathvariant=\"normal\">h</mi><mn>2</mn></msup></mrow><mrow><msub><mi>πm</mi><mi mathvariant=\"normal\">e</mi></msub><mo>·</mo><msup><mi mathvariant=\"normal\">e</mi><mn>2</mn></msup></mrow></mfrac></math> = ground state radius of a hydrogen atom<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi mathvariant=\"normal\">ε</mi><mn>0</mn></msub><msup><mi mathvariant=\"normal\">h</mi><mn>2</mn></msup></mrow><mrow><msub><mi>πm</mi><mi mathvariant=\"normal\">e</mi></msub><mo>·</mo><msup><mi mathvariant=\"normal\">e</mi><mn>2</mn></msup></mrow></mfrac><mo>=</mo><msub><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">H</mi></msub></math><br /><br /><math><mo>∴</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">μ</mi></msub><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">H</mi></msub><mn>207</mn></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863285f8d944b737e6b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "56", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The wavelength of a photon and de-Broglie wavelength an electron have the same value. Given that <math><mi>v</mi></math> is the speed of electron and <math><mi>c</mi></math> is the velocity of light. <math><msub><mrow><mi>E</mi></mrow><mrow><mi>e</mi></mrow></msub><mo>,</mo><mi>&nbsp;</mi><msub><mrow><mi>E</mi></mrow><mrow><mi>p</mi></mrow></msub></math> is the kinetic energy of electron and energy of photon respectively while&nbsp;<math><msub><mrow><mi>p</mi></mrow><mrow><mi>e</mi></mrow></msub><mo>,</mo><mi>&nbsp;</mi><msub><mrow><mi>p</mi></mrow><mrow><mi>h</mi></mrow></msub></math> is the momentum of electron and photon respectively. Then which of the following relation is correct?", "image": null}, "options": [{"id": "HpLod", "text": "<math><mfrac><mrow><msub><mrow><mi>E</mi></mrow><mrow><mi>e</mi></mrow></msub></mrow><mrow><msub><mrow><mi>E</mi></mrow><mrow><mi>p</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>v</mi></mrow><mrow><mn>2</mn><mi>c</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "QkCEM", "text": "<math><mfrac><mrow><msub><mrow><mi>E</mi></mrow><mrow><mi>e</mi></mrow></msub></mrow><mrow><msub><mrow><mi>E</mi></mrow><mrow><mi>p</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>c</mi></mrow><mrow><mi>v</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "Ppbz1", "text": "<math><mfrac><mrow><msub><mrow><mi>p</mi></mrow><mrow><mi>e</mi></mrow></msub></mrow><mrow><msub><mrow><mi>p</mi></mrow><mrow><mi>h</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>c</mi></mrow><mrow><mn>2</mn><mi>v</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "16kTb", "text": "<math><mfrac><mrow><msub><mrow><mi>p</mi></mrow><mrow><mi>e</mi></mrow></msub></mrow><mrow><msub><mrow><mi>p</mi></mrow><mrow><mi>h</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>c</mi></mrow><mrow><mi>v</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><msub><mrow><mi>E</mi></mrow><mrow><mi>e</mi></mrow></msub><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>m</mi><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mfenced separators=\"|\"><mrow><mi>m</mi><mi>v</mi></mrow></mfenced><mi>v</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>h</mi></mrow><mrow><mi>λ</mi></mrow></mfrac></mrow></mfenced><mi>v</mi></math><br /><br />and <math><msub><mrow><mi>E</mi></mrow><mrow><mi>p</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mi>λ</mi></mrow></mfrac><mo>;</mo></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mfrac><mrow><msub><mrow><mi>E</mi></mrow><mrow><mi>e</mi></mrow></msub></mrow><mrow><msub><mrow><mi>E</mi></mrow><mrow><mi>p</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>v</mi></mrow><mrow><mn>2</mn><mi>c</mi></mrow></mfrac></math><br /><br />and according to De Broglie's equation<br /><math><msub><mrow><mi>p</mi></mrow><mrow><mi>h</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>h</mi></mrow><mrow><mi>λ</mi></mrow></mfrac></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mfrac><mrow><msub><mrow><mi>p</mi></mrow><mrow><mi>e</mi></mrow></msub></mrow><mrow><msub><mrow><mi>p</mi></mrow><mrow><mi>h</mi></mrow></msub></mrow></mfrac><mo>=</mo><mn>1</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": <mn>9</mn></mrow><mn>1</mn></mfrac><mo>=</mo><mo>-</mo><mn>122.4</mn><mo>&#160;</mo><mi>eV</mi></math><br /><br />Hence, the ionisation energy for an electron in the ground state of doubly ionised&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Li</mi></math> atom <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>122.4</mn><mo>&#160;</mo><mi>eV</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86309bfdfe8ca3e786f", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "24", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If the first excitation energy of a hydrogen-like atom is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>27</mn><mo>.</mo><mn>3</mn><mo>&nbsp;</mo><mi>eV</mi></math>, then the ionization energy of this atom will be", "image": null}, "options": [], "correctValue": "36.4", "solution": {"text": "<p>First excitation energy<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msup><mi mathvariant=\"normal\">Z</mi><mn>2</mn></msup><mi>Rhc</mi><mfenced><mrow><mfrac><mn>1</mn><msup><mn>1</mn><mn>2</mn></msup></mfrac><mo>−</mo><mfrac><mn>1</mn><msup><mn>2</mn><mn>2</mn></msup></mfrac></mrow></mfenced><mo>=</mo><msup><mi mathvariant=\"normal\">Z</mi><mn>2</mn></msup><mi>Rhc</mi><mfrac><mn>3</mn><mn>4</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mtext>   </mtext><mfrac><mn>3</mn><mn>4</mn></mfrac><mi>Rhc</mi><mo>=</mo><mo>27.3</mo><mtext> </mtext><mi>eV</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mtext>   </mtext><msup><mi mathvariant=\"normal\">Z</mi><mn>2</mn></msu
