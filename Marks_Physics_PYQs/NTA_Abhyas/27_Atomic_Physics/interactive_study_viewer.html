><mover><mi mathvariant=\"normal\">A</mi><mo>&#8728;</mo></mover></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863042441fcf295f50a", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "103", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Find the closest integer wavelength value of K<sub>α</sub> line (in picometer) in copper (Z = 29) if the wavelength of K<sub>α</sub> = line in iron (Z = 26) is known to be equal to193 picometer.", "image": null}, "options": [], "correctValue": "154", "solution": {"text": "By Mosely law <math><mfrac><mrow><mn>1</mn></mrow><mrow><mi>λ</mi></mrow></mfrac></math> ∝ (Z –1)<sup>2</sup><br /><math><mfrac><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>193</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mn>26</mn><mo>-</mo><mn>1</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mn>29</mn><mo>-</mo><mn>1</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math><br /><math><msub><mrow><mi>λ</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>193</mn><mo>×</mo><msup><mrow><mn>25</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><msup><mrow><mn>28</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math><br />λ<sub>2</sub> = 153.8 pm <math> <mo>≃</mo> </math> 154 pm&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "6aa3ab79aa8dc1ff6817802f", "title": "Bohr's Atomic Model", "totalQuestions": 62, "questions": [{"_id": "6151e863f9bb5ae572e3396b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "109", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The ground state energy of hydrogen atom is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>–</mo><mn>13</mn><mo>.</mo><mn>6</mn><mo>&nbsp;</mo><mi>eV</mi></math>. If the electron jumps to the ground state from the 3<sup>rd</sup> excited state, the wavelength of the emitted photon is", "image": null}, "options": [{"id": "UVryy", "text": "<p><mn></mn><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>875</mn><mo>&nbsp;</mo><mover><mi mathvariant=\"normal\">A</mi><mo>∘</mo></mover></math></p>", "image": null, "isCorrect": false}, {"id": "qdSiL", "text": "<p><mn></mn><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1052</mn><mo>&nbsp;</mo><mover><mi mathvariant=\"normal\">A</mi><mo>∘</mo></mover></math></p>", "image": null, "isCorrect": false}, {"id": "MnGW3", "text": "<p><mn></mn><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>752</mn><mo>&nbsp;</mo><mover><mi mathvariant=\"normal\">A</mi><mo>∘</mo></mover></math></p>", "image": null, "isCorrect": false}, {"id": "YJJqA", "text": "<p><mn></mn><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>974</mn><mo>&nbsp;</mo><mover><mi mathvariant=\"normal\">A</mi><mo>∘</mo></mover></math></p><div id=\"gtx-trans\" style=\"position: absolute; left: 56px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p><span>The energy of an electron in n<sup>th</sup> orbit is given by &nbsp;<math> <mrow> <msub> <mi>E</mi> <mtext>n</mtext> </msub> <mo>=</mo><mfrac> <mrow> <mo>&#8722;</mo <mrow><mo>&#8722;</mo><mn>34</mn></mrow></msup><mo>&#215;</mo><mn>3</mn><mo>&#215;</mo><msup><mn>10</mn><mn>8</mn></msup></mrow><mrow><mn>12.75</mn><mo>&#215;</mo><mn>1.6</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>&#8722;</mo><mn>19</mn></mrow></msup></mrow></mfrac></mtd></mtr><mtr><mtd><mo>=</mo><mfrac><mrow><mn>19.878</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>&#8722;</mo><mn>7</mn></mrow></msup></mrow><mn>20.4</mn></mfrac><mo>=</mo><mn>0.974</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>&#8722;</mo><mn>7</mn></mrow></msup><mo>=</mo><mn>974</mn><mover><mtext>A</mtext><mo>&#8728;</mo></mover></mtd></mtr></mtable></math> </span></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863f2a8dcbf3168e218", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "42", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Separation energy of a hydrogen like ion from its third excited state is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>25</mn></math> times the separation energy of hydrogen atom from its first excited state. Find out the atomic number of this hydrogen like ion.", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "<p>Let the separation energy of the ion be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi></math>.&nbsp;Then<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>13</mn><mo>.</mo><mn>6</mn><mo>×</mo><msup><mi>Z</mi><mn>2</mn></msup><mo>×</mo><mfrac><mn>1</mn><mn>16</mn></mfrac><mo>&nbsp;</mo><mi>eV</mi></math><br />and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> w.w3.org/1998/Math/MathML\"><mn>40</mn><mo>.</mo><mn>8</mn><mo>&nbsp;</mo><mi>eV</mi><mo>&nbsp;</mo></math>is emitted. Calculate the atomic number <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Z</mi></math>. Ground state energy of hydrogen atom is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>13</mn><mo>.</mo><mn>6</mn><mo>&nbsp;</mo><mi>eV</mi></math>", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "Let ground state energy (in eV) be E<sub>1</sub><br /><br />Then, from the given condition<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mrow><mn>2</mn><mi>n</mi></mrow></msub><mo>-</mo><mo>&nbsp;</mo><msub><mi>E</mi><mn>1</mn></msub><mo>=</mo><mo>&nbsp;</mo><mn>204</mn><mo>&nbsp;</mo><mi>eV</mi></math><br /><br />Or <math> <mrow> <mfrac> <mrow> <msub> <mtext>E</mtext> <mn>1</mn> </msub> </mrow> <mrow> <mn>4</mn> <msup> <mtext>n</mtext> <mn>2</mn> </msup> </mrow> </mfrac> <mo>-</mo> <msub> <mtext>E</mtext> <mn>1</mn> </msub> <mo>=</mo> <mtext>204 eV</mtext> </mrow> </math><br /><br />Or <math> <mrow> <msub> <mtext>E</mtext> <mn>1</mn> </msub> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>4</mn> <msup> <mtext>n</mtext> <mn>2</mn> </msup> </mrow> </mfrac> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> <mo>=</mo> <mtext>204 eV</mtext> </mrow> </math> ... (i)<br /><br />And E<sub>2n</sub> - E<sub>n</sub> = 40. 8 eV<br /><br />Or <math><mrow><mfrac linethickness=\"1\"><mrow><msub><mi>E</mi><mn>1</mn></msub></mrow><mrow><mn>4</mn><msup><mi>n</mi><mn>2</mn></msup></mrow></mfrac><mo>-</mo><mfrac linethickness=\"1\"><mrow><msub><mi>E</mi><mn>1</mn></msub></mrow><mrow><msup><mi>n</mi><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mn>40.8e</mn><mi>V</mi></mrow></math><br /><br />or<math> <mrow> <msub> <mtext>E</mtext> <mn>1</mn> </msub> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mo>-</mo> <mn>3</mn> </mrow> <mrow> <mn>4</mn> <msup> <mtext>n</mtext> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </mfenced> <mo>=</mo> <mtext>40.8 eV</mtext> </mrow> </math> .... (ii)<br /><br />From Eqs. (i) and (ii),<br /><br /><math> <mrow> <mfrac> <mrow> <mn>1</mn> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>4</mn> <mtext>n</mtext> </mrow> </mfrac> </mrow> <mrow> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>4</mn> <msup> <mtext>n</mtext> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </mfrac> <mo>=</mo> <mn>5</mn> </mrow></math><br /><br />Or&nbsp;<math> <mrow> <mn>1</mn> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>4</mn> <msup> <mtext>n</mtext> <mn>2</mn> </msup> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> <mn>5</mn> </mrow> <mrow> <mn>4</mn> <msup> <mtext>n</mtext> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </math><br /><br />Or&nbsp;<math> <mrow> <mfrac> <mrow> <mn>4</mn> </mrow> <mrow> <msup> <mtext>n</mtext> <mn>2</mn> </msup> </mrow> </mfrac> <mo>=</mo> <mn>1</mn> </mrow> </math><br /><br />or n = 2<br /><br />From Eq. (ii),<br /><br /><math> <mrow> <msub> <mtext>E</mtext> <mn>1</mn> </msub> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <mn>4</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> <msup> <mtext>n</mtext> <mn>2</mn> </msup> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>40.8</mtext> </mrow> </mfenced> <mtext>eV</mtext> </mrow> </math><br /><br /><math><mrow><mo>=</mo><mo>-</mo><mfrac linethickness=\"1\"><mn>4</mn><mn>3</mn></mfrac><msup><mrow><mo maxsize=\"1.00em\">(</mo><mn>2</mn><mo maxsize=\"1.00em\">)</mo></mrow><mn>2</mn></msup><mrow><mo maxsize=\"1.00em\">(</mo><mn>40.8</mn><mo maxsize=\"1.00em\">)</mo></mrow><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>e</mi><mi>V</mi></mrow></math><br /><br />or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">E</mi><mn>1</mn></msub><mo>&nbsp;</mo><mo>=</mo><mo>-</mo><mo>&nbsp;</mo><mn>217</mn><mo>.</mo><mo>&nbsp;</mo><mn>6</mn><mo>&nbsp;</mo><mi>eV</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>1</mn></msub><mo>=</mo><mo>&nbsp;</mo><mo>-</mo><mo>&nbsp;</mo><mo>(</mo><mn>13</mn><mo>.</mo><mo>&nbsp;</mo><mn>6</mn><mo>)</mo><mo>&nbsp;</mo><msub><mi>Z</mi><mn>2</mn></msub></math><br /><br />Therefore &nbsp;<math> <mrow> <msup> <mtext>Z</mtext> <mn>2</mn> </msup> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>E</mtext> <mn>1</mn> </msub> </mrow> <mrow> <mo>-</mo> <mn>1</mn> <mn>3</mn> <mo>·</mo> <mn>6</mn> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mo>-</mo> <mn>2</mn> <mn>1</mn> <mn>7</mn> <mo>-</mo> <mn>6</mn> </mrow> <mrow> <mo>-</mo> <mn>1</mn> <mn>3</mn> <mo>·</mo> <mn>6</mn> </mrow> </mfrac> <mo>=</mo> <mn>1</mn> <mn>6</mn> </mrow> </math><br /><br />Therefore<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mi>Z</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>4</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ebd698fa133261dc", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "12", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>The electron in a hydrogen atom makes a transition from a state&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>n</mi><mn>1</mn></msub></math>&nbsp;to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>n</mi><mn>2</mn></msub></math>. If the time period of the electron in the initial state is eight times that in the final state, then the&nbsp;possible values of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>n</mi><mn>1</mn></msub></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>n</mi><mn>2</mn></msub></math>&nbsp;are&nbsp;</p>\r", "image": null}, "options": [{"id": "ij3xM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>n</mi><mn>1</mn></msub><mo>=</mo><mn>8</mn><mo>,</mo><mo>&#xA0;</mo><msub><mi>n</mi><mn>2</mn></msub><mo>=</mo><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "c6TCw", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>n</mi><mn>1</mn></msub><mo>=</mo><mn>4</mn><mo>,</mo><mo>&#xA0;</mo><msub><mi>n</mi><mn>2</mn></msub><mo>=</mo><mn>2</mn></math>", "image": null, "isCorrect": true}, {"id": "p8nuS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>n</mi><mn>1</mn></msub><mo>=</mo><mn>3</mn><mo>,</mo><mo>&#xA0;</mo><msub><mi>n</mi><mn>2</mn></msub><mo>=</mo><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "ylz4K", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>n</mi><mn>1</mn></msub><mo>=</mo><mn>4</mn><mo>,</mo><mo>&#xA0;</mo><msub><mi>n</mi><mn>2</mn></msub><mo>=</mo><mn>1</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>In a hydrogen atom, the time period obeys the following relation</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>&#8733;</mo><msup><mi>n</mi><mn>3</mn></msup></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><msub><mi>T</mi><mn>1</mn></msub><msub><mi>T</mi><mn>2</mn></msub></mfrac><mo>=</mo><msup><mfenced><mfrac><msub><mi>n</mi><mn>1</mn></msub><msub><mi>n</mi><mn>2</mn></msub></mfrac></mfenced><mn>3</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mn>8</mn><mn>1</mn></mfrac><mo>=</mo><msup><mfenced><mfrac><msub><mi>n</mi><mn>1</mn></msub><msub><mi>n</mi><mn>2</mn></msub></mfrac></mfenced><mn>3</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><msub><mi>n</mi><mn>1</mn></msub><msub><mi>n</mi><mn>2</mn></msub></mfrac><mspace></mspace><mo>=</mo><mfrac><mn>2</mn><mn>1</mn></mfrac></math><br /><br />Thus, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>n</mi><mn>1</mn></msub><mo>=</mo><mn>4</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>n</mi><mn>2</mn></msub><mo>=</mo><mn>2</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ea10edefc267ebd8", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "45", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>In a Coolidge tube, the potential difference used to accelerate the electrons is increased from&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>24</mn><mo>.</mo><mn>8</mn><mo>&nbsp;</mo><mi>kV</mi></math>&nbsp;to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>49</mn><mo>.</mo><mn>6</mn><mo>&nbsp;</mo><mi>kV</mi></math>.&nbsp;As a result, the difference between the wavelength of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mi>α</mi></msub></math>-line and minimum wavelength becomes two times. The initial wavelength of the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mi>α</mi></msub></math>-line is&nbsp;[Take&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mi>e</mi></mfrac><mo>=</mo><mn>12</mn><mo>.4</mo><mo>&nbsp;</mo><mi>kV</mi><mo>&nbsp;</mo><mover><mi mathvariant=\"normal\">A</mi><mo>°</mo></mover></math>]</p>\r", "image": null}, "options": [{"id": "E43bB", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\"></mi><mover><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mo>°</mo></mrow></mover></math>", "image": null, "isCorrect": false}, {"id": "QaqQI", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mi mathvariant=\"normal\"></mi><mover><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mo>°</mo></mrow></mover></math>", "image": null, "isCorrect": true}, {"id": "HfNqs", "text": "<math><mfrac><mrow><mn>5</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\"></mi><mover><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mo>°</mo></mrow></mover></math>", "image": null, "isCorrect": false}, {"id": "AI5zB", "text": "<math><mfrac><mrow><mn>5</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mi mathvariant=\"normal\"></mi><mover><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mo>°</mo></mrow></mover></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Let ∆<em>E</em> be the energy of <em>k</em><sub>&alpha;</sub>-line then</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><msub><mi>&#955;</mi><msub><mi>K</mi><mi>&#945;</mi></msub></msub></mfrac><mo>=</mo><mi mathvariant=\"normal\">&#916;</mi><msub><mi>E</mi><msub><mi>K</mi><mi>&#945;</mi></msub></msub></math><br />&rArr; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#955;</mi><msub><mi>K</mi><mi>&#945;</mi></msub></msub><mo>=</mo><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mi mathvariant=\"normal\">&#916;</mi><msub><mi>E</mi><msub><mi>K</mi><mi>&#945;</mi></msub></msub></mrow></mfrac></math><br />Now the cutoff wavelengths in the two cases are</p><p>&nbsp;<math><msub><mrow><mi>&#955;</mi></mrow><mrow><mn>1</mn><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mi>e</mi><mo>&#215;</mo><mn>24.8&#160;</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">V</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>12.4</mn></mrow><mrow><mn>24.8</mn></mrow></mfrac><mover><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mo>&#176;</mo></mrow></mover><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mover><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mo>&#176;</mo></mrow></mover></math>&nbsp;</p><p><math><msub><mrow><mi>&#955;</mi></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mi>e</mi><mo>&#215;</mo><mn>49.6&#160;</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">V</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>12.4</mn></mrow><mrow><mn>49.6</mn></mrow></mfrac><mover><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mo>&#176;</mo></mrow></mover><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mover><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mo>&#176;</mo></mrow></mover></math><br />&rArr; <math><mn>2</mn><mfenced separators=\"|\"><mrow><msub><mrow><mi>&#955;</mi></mrow><mrow><mi>k</mi><mi>&#945;</mi></mrow></msub><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced><mo>=</mo><mfenced separators=\"|\"><mrow><msub><mrow><mi>&#955;</mi></mrow><mrow><mi>k</mi><mi>&#945;</mi></mrow></msub><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac></mrow></mfenced></math><br />&rArr; <math><mn>2</mn><msub><mrow><mi>&#955;</mi></mrow><mrow><mi>k</mi><mi>&#945;</mi></mrow></msub><mo>-</mo><mn>1</mn><mo>=</mo><msub><mrow><mi>&#955;</mi></mrow><mrow><mi>k</mi><mi>&#945;</mi></mrow></msub><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math><br />&rArr; <math><msub><mrow><mi>&#955;</mi></mrow><mrow><mi>k</mi><mi>&#945;</mi></mrow></msub><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math><br />&rArr; <math><msub><mrow><mi>&#955;</mi></mrow><mrow><mi>k</mi><mi>&#945;</mi></mrow></msub><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mi mathvariant=\"normal\">&#197;</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e1f9ee8e41510e8e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "73", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Imagine an atom made up of a proton and a hypothetical particle of double the mass of the electron but having the same charge as the electron. Apply the Bohr atom model and consider all possible transitions of this hypothetical particle to the first excited level. The longest wavelength photon that will be emitted has wavelength <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>X</mi></math>&nbsp;(given in terms of the Rydberg constant&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> for the hydrogen atom) is equal to", "image": null}, "options": [{"id": "Vs259", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><mrow><mn>5</mn><mi>R</mi></mrow></mfrac></math><div id=\"gtx-trans\" style=\"position: absolute; left: 67px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div><div id=\"gtx-trans\" style=\"position: absolute; left: 67px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "E9Ly7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>36</mn><mrow><mn>5</mn><mi>R</mi></mrow></mfrac></math><div id=\"gtx-trans\" style=\"position: absolute; left: 67px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div><div id=\"gtx-trans\" style=\"position: absolute; left: 67px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "XNIZj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>18</mn><mrow><mn>5</mn><mi>R</mi></mrow></mfrac></math><div id=\"gtx-trans\" style=\"position: absolute; left: 67px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div><div id=\"gtx-trans\" style=\"position: absolute; left: 67px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "2VLTo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mi>R</mi></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>In hydrogen atom <math><mrow><msub> <mtext>E</mtext> <mtext>n</mtext> </msub> <mo></mo><mo>-</mo><mfrac linethickness=\"1\"><mrow><mi>R</mi><mi>h</mi><mi>c</mi></mrow><mrow><msup><mi>n</mi><mn>2</mn></msup></mrow></mfrac></mrow></math><br /><br />where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> is the mass of the electron. Here, the electron has been replaced by a particle whose mass is double of an electron. Therefore, energy in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>n</mi><mi>th</mi></msup></math> orbit for this hypothetical atom will be given by<br /><br /><math><mrow><msub><mi>E</mi><mi>n</mi></msub><mo>=</mo><mo></mo><mo></mo><mo>-</mo><mfrac linethickness=\"1\"><mrow><mn>2</mn><mi>R</mi><mi>h</mi><mi>c</mi></mrow><mrow><msup><mi>n</mi><mn>2</mn></msup></mrow></mfrac></mrow></math><br /><br />The longest wavelength&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi></math>max (or minimum energy) photon will correspond to the transition of the particle from&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>3</mn></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>2</mn><mo>&#160;</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mtext mathvariant=\"italic\">hc</mtext><msub><mi>&#955;</mi><mtext>max</mtext></msub></mfrac><mo>=</mo><msub><mtext mathvariant=\"italic\">E</mtext><mn>3</mn></msub><mo>-</mo><msub><mtext mathvariant=\"italic\">E</mtext><mn>2</mn></msub><mo>=</mo><mn>2</mn><mtext mathvariant=\"italic\">Rhc</mtext><mfenced><mrow><mfrac><mn>1</mn><msup><mn>2</mn><mn>2</mn></msup></mfrac><mo>-</mo><mfrac><mn>1</mn><msup><mn>3</mn><mn>2</mn></msup></mfrac></mrow></mfenced></math><br /><br />This gives, &lambda;<sub> max</sub><math><mo>=</mo><mrow><mfrac linethickness=\"1\"><mn>18</mn><mrow> <mn></mn><mn>5</mn><mi>R</mi></mrow></mfrac></mrow></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863da2232099a942d38", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "49", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Consider a hydrogen-like ionized atom with atomic number <math> <mi>Z</mi> </math> with a single electron. In the emission spectrum of this atom, the photon emitted in the <math><mi>n</mi><mo>=</mo><mn>2</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">o</mi><mi>&nbsp;</mi><mi>n</mi><mo>=</mo><mi>&nbsp;</mi><mn>1</mn></math> transition has energy <math><mn>74.8</mn><mi>&nbsp;</mi><mi>eV</mi></math> higher than the photon emitted in the <math><mi>n</mi><mo>=</mo><mn>3</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">o</mi><mi>&nbsp;</mi><mi>n</mi><mo>=</mo><mn>2</mn></math> transition. Given that the ionization energy of the hydrogen atom is <math><mn>13.6</mn><mi>&nbsp;</mi><mi>eV</mi></math>, what is the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Z</mi></math>?", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "<math><mo>∆</mo><msub><mrow><mi>E</mi></mrow><mrow><mn>2</mn> <mo>&#x2192;</mo><mn>1</mn></mrow></msub><mo>=</mo><mn>13.6</mn><mo>×</mo><msup><mrow><mi>Z</mi></mrow><mrow><mn>2</mn></mrow></msup><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>13.6</mn><mo>×</mo><msup><mrow><mi>Z</mi></mrow><mrow><mn>2</mn></mrow></msup><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac></mrow></mfenced></math><br /><br /><math><mo>∆</mo><msub><mrow><mi>E</mi></mrow><mrow><mn>3</mn> <mo>&#x2192;</mo><mn>2</mn></mrow></msub><mo>=</mo><mn>13.6</mn><mo>×</mo><msup><mrow><mi>Z</mi></mrow><mrow><mn>2</mn></mrow></msup><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>9</mn></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>13.6</mn><mo>×</mo><msup><mrow><mi>Z</mi></mrow><mrow><mn>2</mn></mrow></msup><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>5</mn></mrow><mrow><mn>36</mn></mrow></mfrac></mrow></mfenced></math><br /><br /><math><mo>∆</mo><msub><mrow><mi>E</mi></mrow><mrow><mn>2</mn> <mo>&#x2192;</mo><mn>1</mn></mrow></msub><mo>=</mo><mo>∆</mo><msub><mrow><mi>E</mi></mrow><mrow><mn>3</mn><mo>-</mo><mn>2</mn></mrow></msub><mo>+</mo><mn>74.8</mn></math><br /><br /><math><mn>13.6</mn><mo>×</mo><msup><mrow><mi>Z</mi></mrow><mrow><mn>2</mn></mrow></msup><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>13.6</mn><mo>×</mo><msup><mrow><mi>Z</mi></mrow><mrow><mn>2</mn></mrow></msup><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>5</mn></mrow><mrow><mn>36</mn></mrow></mfrac></mrow></mfenced><mo>+</mo><mn>74.8</mn></math><br /><br /><math><mn>13.6</mn><mo>×</mo><msup><mrow><mi>Z</mi></mrow><mrow><mn>2</mn></mrow></msup><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>36</mn></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>74.8</mn></math><br /><br /><math><msup><mrow><mi>Z</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>9</mn></math><br /><br /><math><mi>Z</mi><mo>=</mo><mo>+</mo><mn>3</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d85e994bf14b7090", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "17", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Electrons having kinetic energy&nbsp;<math><mn>30</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">V</mi></math>&nbsp;are made to collide with atomic hydrogen gas (in ground state) and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>42</mn><mo>.</mo><mn>5</mn><mo>%</mo></math> of electron energy is used to excite the hydrogen atoms. The number of emitted wavelengths in emission spectra are", "image": null}, "options": [{"id": "tW6GW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>", "image": null, "isCorrect": false}, {"id": "tZVXy", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn></math>", "image": null, "isCorrect": true}, {"id": "RweVP", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn></math>", "image": null, "isCorrect": false}, {"id": "ZsW1Y", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>18</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>42</mn><mo>.</mo><mn>5</mn><mo>%</mo></math>&nbsp;of <math><mn>30</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">V</mi><mo>=</mo><mn>12.75</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">V</mi></math><br /><br /><math><mo>∴</mo><msub><mrow><mi>E</mi></mrow><mrow><mn>4</mn></mrow></msub><mo>-</mo><msub><mrow><mi>E</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mo>-</mo><mn>0.85</mn><mo>-</mo><mfenced separators=\"|\"><mrow><mo>-</mo><mn>13.6</mn></mrow></mfenced><mo>=</mo><mn>12.75</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">V</mi></math><br /><br />So, it means electron has been transmitted from ground state to <math><msup><mrow><mn>3</mn></mrow><mrow><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">d</mi></mrow></msup></math> excited state <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">n</mi><mo>=</mo><mn>4</mn></mrow></mfenced></math>, so total number of unique wavelengths emitted are<br /><br /><math><mo>=</mo><mfrac><mrow><mn>4</mn><mo>×</mo><mfenced separators=\"|\"><mrow><mn>4</mn><mo>-</mo><mn>1</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mn>6</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ce8e4f5b4134b360", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "94", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the hydrogen atom spectrum,&nbsp;<math><msub><mrow><mi>λ</mi></mrow><mrow><mn>3</mn><mo>-</mo><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi>λ</mi></mrow><mrow><mn>2</mn><mo>-</mo><mn>1</mn></mrow></msub></math> represent wavelengths emitted due to transition from second and first excited states to the ground state respectively. The ratio&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>λ</mi><mrow><mn>3</mn><mo>-</mo><mn>1</mn></mrow></msub><msub><mi>λ</mi><mrow><mn>2</mn><mo>-</mo><mn>1</mn></mrow></msub></mfrac><mo>=</mo><mfrac><mi>p</mi><mi>q</mi></mfrac></math>, where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi></math>&nbsp;are the smallest positive integers. What is the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>p</mi><mo>+</mo><mi>q</mi></mrow></mfenced></math>?", "image": null}, "options": [], "correctValue": "59", "solution": {"text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>3</mn><mo>-</mo><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mi>R</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>8</mn><mi>R</mi></mrow><mrow><mn>9</mn></mrow></mfrac></math><br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>2</mn><mo>-</mo><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mi>R</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>3</mn><mi>R</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>3</mn><mo>-</mo><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>λ</mi></mrow><mrow><mn>2</mn><mo>-</mo><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>27</mn></mrow><mrow><mn>32</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ce375235c305b343", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "51", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A sample consisting of Hydrogen atoms in the ground state is excited by monochromatic radiation of energy <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>.</mo><mn>75</mn><mo>&#160;</mo><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">V</mi></math>. If we were to observe the emission spectrum of this sample, then the number of spectral lines observed, will be", "image": null}, "options": [{"id": "YfejZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>", "image": null, "isCorrect": false}, {"id": "LHukP", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn></math>", "image": null, "isCorrect": true}, {"id": "wtvJ5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn></math>", "image": null, "isCorrect": false}, {"id": "jdXkx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The energy of an electron of&nbsp;a hydrogen atom in the ground state is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>0</mn></msub><mo>=</mo><mo>-</mo><mn>13</mn><mo>.</mo><mn>6</mn><mo>&#160;</mo><mi>eV</mi></math></p><p>The energy of incoming photon = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>.</mo><mn>75</mn><mo>&#160;</mo><mi>eV</mi></math></p><p>The energy of an electron in the&nbsp;excited state is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mfrac><mrow><mn>13</mn><mo>.</mo><mn>6</mn></mrow><msup><mi>n</mi><mn>2</mn></msup></mfrac><mo>=</mo><mo>-</mo><mn>13</mn><mo>.</mo><mn>6</mn><mo>+</mo><mn>12</mn><mo>.</mo><mn>75</mn><mo>=</mo><mo>-</mo><mn>0</mn><mo>.</mo><mn>85</mn><mo>&#160;</mo><mi>eV</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>n</mi><mn>2</mn></msup><mo>=</mo><mfrac><mrow><mn>13</mn><mo>.</mo><mn>6</mn></mrow><mrow><mn>0</mn><mo>.</mo><mn>85</mn></mrow></mfrac><mo>=</mo><mn>16</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>n</mi><mo>=</mo><mn>4</mn></math></p><p>No. of spectral lines =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>n</mi><mfenced><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></mfenced></mrow><mn>2</mn></mfrac></math>&nbsp;=&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c05f1107c6f9c28e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "15", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Electrons in a certain energy level <math> <mrow> <mi>n</mi><mo>⁡</mo> <mo>=</mo> <msub> <mrow> <mi>n</mi><mo>⁡</mo> </mrow> <mn>1</mn> </msub> </mrow> </math>, can emit <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math> spectral lines. When they are in another energy level, <math> <mrow> <mi>n</mi><mo>⁡</mo> <mo>=</mo> <msub> <mrow> <mi>n</mi><mo>⁡</mo> </mrow> <mn>2</mn> </msub> </mrow> </math>, they can emit <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn></math> spectral lines. The ratio of orbital speeds of the electrons is", "image": null}, "options": [{"id": "cCPiJ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>:</mo><mn>3</mn></math>", "image": null, "isCorrect": true}, {"id": "2NETs", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>:</mo><mn>4</mn></math>", "image": null, "isCorrect": false}, {"id": "3Pb1e", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>:</mo><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "hR9oB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>:</mo><mn>2</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Number of emitted spectral lines,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi><mo>=</mo><mfrac><mrow><mi>n</mi><mo>(</mo><mi>n</mi><mo>-</mo><mn>1</mn><mo>)</mo></mrow><mn>2</mn></mfrac></math>.</p><p><strong>Case I</strong><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi><mo>=</mo><mn>3</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>3</mn><mo>=</mo><mfrac><mrow><msub><mi>n</mi><mn>1</mn></msub><mo>(</mo><msub><mi>n</mi><mn>1</mn></msub><mo>-</mo><mn>1</mn><mo>)</mo></mrow><mn>2</mn></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msubsup><mi>n</mi><mn>1</mn><mn>2</mn></msubsup><mo>-</mo><msub><mi>n</mi><mn>1</mn></msub><mo>-</mo><mn>6</mn><mo>=</mo><mn>0</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mo>(</mo><msub><mi>n</mi><mn>1</mn></msub><mi>&nbsp;</mi><mo>-</mo><mn>3</mn><mo>)</mo><mo>(</mo><msub><mi>n</mi><mn>1</mn></msub><mi>&nbsp;</mi><mo>+</mo><mn>2</mn><mo>)</mo><mo>=</mo><mn>0</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msub><mi>n</mi><mn>1</mn></msub><mo>=</mo><mn>3</mn></math><br /><br /><strong>Case II</strong><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi><mo>=</mo><mn>6</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>6</mn><mo>=</mo><mfrac><mrow><msub><mi>n</mi><mn>2</mn></msub><mo>(</mo><msub><mi>n</mi><mn>2</mn></msub><mo>-</mo><mn>1</mn><mo>)</mo></mrow><mn>2</mn></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msup><msub><mi>n</mi><mn>2</mn></msub><mn>2</mn></msup><mo>-</mo><msub><mi>n</mi><mn>2</mn></msub><mo>-</mo><mn>12</mn><mo>=</mo><mn>0</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mo>(</mo><msub><mi>n</mi><mn>2</mn></msub><mo>-</mo><mn>4</mn><mo>)</mo><mo>(</mo><msub><mi>n</mi><mn>2</mn></msub><mo>+</mo><mn>3</mn><mo>)</mo><mo>=</mo><mn>0</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msub><mi>n</mi><mn>2</mn></msub><mo>=</mo><mn>4</mn></math></p><p>Velocity of electron <math><mi>v</mi><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><msup><mrow><mi>Z</mi><mi>e</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><msub><mrow><mi>ε</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>h</mi><mi>n</mi></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mfrac><msub><mi>v</mi><mn>1</mn></msub><msub><mi>v</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><msub><mi>n</mi><mn>2</mn></msub><msub><mi>n</mi><mn>1</mn></msub></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><msub><mi>v</mi><mn>1</mn></msub><msub><mi>v</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863bfca76c270dc75c7", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "85", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Which among the following expressions is the correct for the magnetic field at the site of the nucleus in a hydrogen atom due to the circular motion of the electron? Assume that the atom is in its ground state and the expressions are given in terms of the fundamental constants.<br />\rwhere&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>&nbsp;= mass of an electron,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>e</mi></math>&nbsp;= charge of an electron,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math>&nbsp;= planck's constant)", "image": null}, "options": [{"id": "q0fzh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>&#956;</mi><mn>0</mn></msub><msup><mtext mathvariant=\"italic\">e</mtext><mn>7</mn></msup><mi>&#960;</mi><msup><mtext mathvariant=\"italic\">m</mtext><mn>2</mn></msup></mrow><mrow><mn>8</mn><msubsup><mi>&#949;</mi><mn>0</mn><mn>3</mn></msubsup><msup><mtext mathvariant=\"italic\">h</mtext><mn>5</mn></msup></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "01279", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>&#956;</mi><mn>0</mn></msub><msup><mtext mathvariant=\"italic\">e</mtext><mn>5</mn></msup><mi>&#960;</mi><msup><mtext mathvariant=\"italic\">m</mtext><mn>2</mn></msup></mrow><mrow><mn>8</mn><msubsup><mi>&#949;</mi><mn>0</mn><mn>3</mn></msubsup><msup><mtext mathvariant=\"italic\">h</mtext><mn>5</mn></msup></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "5vojj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>μ</mi><mn>0</mn></msub><msup><mtext mathvariant=\"italic\">e</mtext><mn>5</mn></msup><mi>π</mi><msup><mtext mathvariant=\"italic\">m</mtext><mn>2</mn></msup></mrow><mrow><mn>8</mn><msubsup><mi>ε</mi><mn>0</mn><mn>3</mn></msubsup><msup><mtext mathvariant=\"italic\">h</mtext><mn>4</mn></msup></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "aNfa9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>μ</mi><mn>0</mn></msub><msup><mtext mathvariant=\"italic\">e</mtext><mn>7</mn></msup><mi>π</mi><msup><mtext mathvariant=\"italic\">m</mtext><mn>2</mn></msup></mrow><mrow><mn>8</mn><msubsup><mi>ε</mi><mn>0</mn><mn>3</mn></msubsup><msup><mtext mathvariant=\"italic\">h</mtext><mn>4</mn></msup></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have<br /><br />&nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mtext mathvariant=\"italic\">mv</mtext><mn>2</mn></msup><mtext mathvariant=\"italic\">r</mtext></mfrac><mo>=</mo><mfrac><msup><mtext mathvariant=\"italic\">e</mtext><mn>2</mn></msup><mrow><mn>4</mn><mi>&#960;</mi><msub><mi>&#949;</mi><mn>0</mn></msub><msup><mtext mathvariant=\"italic\">r</mtext><mn>2</mn></msup></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>or,&#160;</mtext><mspace mathvariant=\"italic\" width=\"0.5em\"/><msup><mtext mathvariant=\"italic\">v</mtext><mn>2</mn></msup><mtext mathvariant=\"italic\">r</mtext><mo>=</mo><mfrac><msup><mtext>e</mtext><mn>2</mn></msup><mrow><mn>4</mn><mi>&#960;</mi><msub><mi>&#949;</mi><mn>0</mn></msub><mtext mathvariant=\"italic\">m</mtext></mrow></mfrac></math>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;...(i)<br /><br />From Bohr&#39;s quantization rule, in ground state,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">vr</mtext><mo>=</mo><mfrac><mtext mathvariant=\"italic\">h</mtext><mrow><mn>2</mn><mi>&#960;</mi><mtext mathvariant=\"italic\">m</mtext></mrow></mfrac><mo>&#183;</mo></math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(ii)<br /><br />From (i) and (ii),<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">v</mtext><mo>=</mo><mfrac><msup><mtext mathvariant=\"italic\">e</mtext><mn>2</mn></msup><mrow><mn>2</mn><msub><mi>&#949;</mi><mn>0</mn></msub><mtext mathvariant=\"italic\">h</mtext></mrow></mfrac></math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(iii)<br /><br />and&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">r</mtext><mo>=</mo><mfrac><mrow><msub><mi>&#949;</mi><mn>0</mn></msub><msup><mtext mathvariant=\"italic\">h</mtext><mn>2</mn></msup></mrow><mrow><mi>&#960;</mi><msup><mtext mathvariant=\"italic\">me</mtext><mn>2</mn></msup></mrow></mfrac></math> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(iv)<br /><br />As the electron moves along a circle, it crosses any point on the circle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mtext mathvariant=\"italic\">v</mtext><mrow><mn>2</mn><mi>&#960;</mi><mtext mathvariant=\"italic\">r</mtext></mrow></mfrac></math> times per unit time. The charge crossing per unit time, that is the current, is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>i</mi></math> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mtext mathvariant=\"italic\">ev</mtext><mrow><mn>2</mn><mi>&#960;</mi><mtext mathvariant=\"italic\">r</mtext></mrow></mfrac></math>. The magnetic field at the centre due to this circular current is<br /><br />&nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">B</mtext><mo>=</mo><mfrac><mrow><msub><mi>&#956;</mi><mn>0</mn></msub><mtext mathvariant=\"italic\">i</mtext></mrow><mrow><mn>2</mn><mtext mathvariant=\"italic\">r</mtext></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mi>&#956;</mi><mn>0</mn></msub><mtext mathvariant=\"italic\">ev</mtext></mrow><mrow><mn>4</mn><mi>&#960;</mi><msup><mtext mathvariant=\"italic\">r</mtext><mn>2</mn></msup></mrow></mfrac></math><br /><br />From (iii) and (iv),<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">B</mtext><mo>=</mo><mfrac><mrow><msub><mi>&#956;</mi><mn>0</mn></msub><mtext mathvariant=\"italic\">e</mtext></mrow><mrow><mn>4</mn><mi>&#960;</mi></mrow></mfrac><mfrac><msup><mtext mathvariant=\"italic\">e</mtext><mn>2</mn></msup><mrow><mn>2</mn><msub><mi>&#949;</mi><mn>0</mn></msub><mtext mathvariant=\"italic\">h</mtext></mrow></mfrac><mo>&#215;</mo><mfrac><mrow><msup><mi>&#960;</mi><mn>2</mn></msup><msup><mtext mathvariant=\"italic\">m</mtext><mn>2</mn></msup><msup><mtext mathvariant=\"italic\">e</mtext><mn>4</mn></msup></mrow><mrow><msubsup><mi>&#949;</mi><mn>0</mn><mn>2</mn></msubsup><msup><mtext mathvariant=\"italic\">h</mtext><mn>4</mn></msup></mrow></mfrac></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><msub><mi>&#956;</mi><mn>0</mn></msub><msup><mtext mathvariant=\"italic\">e</mtext><mn>7</mn></msup><mi>&#960;</mi><msup><mtext mathvariant=\"italic\">m</mtext><mn>2</mn></msup></mrow><mrow><mn>8</mn><msubsup><mi>&#949;</mi><mn>0</mn><mn>3</mn></msubsup><msup><mtext mathvariant=\"italic\">h</mtext><mn>5</mn></msup></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863bcea997e5fe743b4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "41", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An electron in a hydrogen atom makes a transition from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>=</mo><mn>2</mn></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>=</mo><mn>1</mn></math> and emits a photon. This photon strikes a doubly ionized lithium atom which was already in an excited state and completely removes the orbiting electron. The least quantum number for the excited state of the lithium-ion for the process is", "image": null}, "options": [{"id": "8L7Rk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "mYLhe", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>", "image": null, "isCorrect": true}, {"id": "vmxcx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math>", "image": null, "isCorrect": false}, {"id": "d3938", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Let us assume that the electron in the&nbsp;lithium-ion is knocked off from the&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>n</mi><mi>th</mi></msup></math>&nbsp;energy level, then</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><msup><mfenced><msub><mi>Z</mi><mi mathvariant=\"normal\">H</mi></msub></mfenced><mn>2</mn></msup><mfenced><mrow><mfrac><mn>1</mn><msup><mn>1</mn><mn>2</mn></msup></mfrac><mo>&#8722;</mo><mfrac><mn>1</mn><msup><mn>2</mn><mn>2</mn></msup></mfrac></mrow></mfenced><mo>=</mo><mi>R</mi><mfrac><msup><mfenced><msub><mi>Z</mi><mi>Li</mi></msub></mfenced><mn>2</mn></msup><msup><mi>n</mi><mn>2</mn></msup></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><msup><mfenced><mn>1</mn></mfenced><mn>2</mn></msup><mo>&#215;</mo><mfrac><mn>3</mn><mn>4</mn></mfrac><mo>=</mo><mi>R</mi><msup><mfenced><mn>3</mn></mfenced><mn>2</mn></msup><mfenced open=\"[\" close=\"]\" separators=\"|\"><mfrac><mn>1</mn><msup><mi>n</mi><mn>2</mn></msup></mfrac></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>4</mn></mfrac><mo>=</mo><mfrac><mn>9</mn><msup><mi>n</mi><mn>2</mn></msup></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>=</mo><msqrt><mn>12</mn></msqrt><mo>&#8776;</mo><mn>3</mn><mo>.</mo><mn>5</mn></math></p><p>Hence the least quantum number must be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863bc1c2e9fae7919c3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": " mlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Z</mi></math>. [Ionization energy of hydrogen atom <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mtext>13.6</mtext><mo>&nbsp;</mo><mi>eV]</mi></math>", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "<img alt=\"Picture 129\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/abs/2a8c626e-3bf3-4ebc-861e-e70ec8a817e8-image55.png\" /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>10.2</mtext><mo>+</mo><mn>17</mn><mo>=</mo><mtext>13.6</mtext><mo>&#215;</mo><msup><mi mathvariant=\"normal\">Z</mi><mn>2</mn></msup><mfenced separators=\"|\"><mrow><mfrac><mn>1</mn><msup><mn>2</mn><mn>2</mn></msup></mfrac><mo>-</mo><mfrac><mn>1</mn><msup><mi mathvariant=\"normal\">n</mi><mn>2</mn></msup></mfrac></mrow></mfenced><mo>;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mtext>4.25</mtext><mo>+</mo><mtext>5.95</mtext><mo>=</mo><mtext>13.6</mtext><mo>&#215;</mo><msup><mi mathvariant=\"normal\">Z</mi><mn>2</mn></msup><mfenced><mrow><mfrac><mn>1</mn><msup><mn>3</mn><mn>2</mn></msup></mfrac><mo>-</mo><mfrac><mn>1</mn><msup><mi mathvariant=\"normal\">n</mi><mn>2</mn></msup></mfrac></mrow></mfenced></math><br /><br />Solving the above two equation we get, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Z</mi><mo>=</mo><mn>3</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">n</mi><mo>=</mo><mn>6</mn></math>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a2b02c458bf1ad39", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "101", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "titl
