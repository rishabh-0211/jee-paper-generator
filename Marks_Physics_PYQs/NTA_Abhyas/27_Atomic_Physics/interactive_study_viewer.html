<mn>974</mn><mover><mtext>A</mtext><mo>&#8728;</mo></mover></mtd></mtr></mtable></math> </span></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863f44c5d1de401997f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "21", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The <math> <mrow> <msub> <mtext>K</mtext> <mi>α</mi> </msub> </mrow> </math>&nbsp;line obtained for molybdenum&nbsp;<math><mo>(</mo><mi mathvariant=\"normal\">Z</mi><mo>=</mo><mn>42</mn><mo>)</mo></math>&nbsp;is <math><mo>0.71</mo><mi mathvariant=\"normal\">Å</mi></math>.&nbsp;Then, the wavelength of the <math> <mrow> <msub> <mtext>K</mtext> <mi>α</mi> </msub> </mrow> </math>&nbsp;line of copper&nbsp;<math><mo>(</mo><mi mathvariant=\"normal\">Z</mi><mo>=</mo><mn>29</mn><mo>)</mo></math> is", "image": null}, "options": [{"id": "3fMH8", "text": "<math><mtext>2.14&nbsp;</mtext><mi mathvariant=\"normal\">Å</mi></math>", "image": null, "isCorrect": false}, {"id": "nw0Aq", "text": "<math><mtext>1.52&nbsp;</mtext><mi mathvariant=\"normal\">Å</mi></math>", "image": null, "isCorrect": true}, {"id": "Aubh2", "text": "<math><mtext>1.04&nbsp;</mtext><mi mathvariant=\"normal\">Å</mi></math>", "image": null, "isCorrect": false}, {"id": "KZqUC", "text": "<math><mtext>0.71&nbsp;</mtext><mi mathvariant=\"normal\">Å</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">λ</mi><mtext>min</mtext></msub><mo>∝</mo><mfrac><mn>1</mn><msup><mfenced><mrow><mtext>Z</mtext><mo>-</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup></mfrac></math><br /><br /><math> <mrow> <mo>∴</mo> <mfrac> <mrow> <msub> <mtext>λ</mtext> <mtext>Cu</mtext> </msub> </mrow> <mrow> <msub> <mtext>λ</mtext> <mtext>Mo</mtext> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>Z</mtext> <mtext>Mo</mtext> </msub> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> </mrow> <mrow> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>Z</mtext> <mtext>Cu</mtext> </msub> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>4</mn> <msup> <mn>1</mn> <mn>2</mn> </msup> </mrow> <mrow> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>2</mn> <mn>8</mn> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> </mrow> </mfrac> <mo>=</mo> <mtext>2.14</mtext> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴&nbsp;&nbsp;&nbsp;</mo><msub><mi mathvariant=\"normal\">λ</mi><mtext>Cu</mtext></msub><mo>=</mo><mtext>2.14</mtext><mo>×</mo><mo>0.71</mo><mi mathvariant=\"normal\">Å</mi><mo>=</mo><mo>1.52</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">Å</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863eea39bf922a3b2eb", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "100", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A hydrogen-like atom of atomic number <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Z</mi></math> is in an excited state of quantum number <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>n</mi></math>. It can emit a maximum energy photon of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>204</mn><mo>&nbsp;</mo><mi>eV</mi></math>. If it makes a transition to the quantum state <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>, a photon of energy <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>.</mo><mn>8</mn><mo>&nbsp;</mo><mi>eV</mi><mo>&nbsp;</mo></math>is emitted. Calculate the atomic number <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Z</mi></math>. Ground state energy of hydrogen atom is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>13</mn><mo>.</mo><mn>6</mn><mo>&nbsp;</mo><mi>eV</mi></math>", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "Let ground state energy (in eV) be E<sub>1</sub><br /><br />Then, from the given condition<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mrow><mn>2</mn><mi>n</mi></mrow></msub><mo>-</mo><mo>&nbsp;</mo><msub><mi>E</mi><mn>1</mn></msub><mo>=</mo><mo>&nbsp;</mo><mn>204</mn><mo>&nbsp;</mo><mi>eV</mi></math><br /><br />Or <math> <mrow> <mfrac> <mrow> <msub> <mtext>E</mtext> <mn>1</mn> </msub> </mrow> <mrow> <mn>4</mn> <msup> <mtext>n</mtext> <mn>2</mn> </msup> </mrow> </mfrac> <mo>-</mo> <msub> <mtext>E</mtext> <mn>1</mn> </msub> <mo>=</mo> <mtext>204 eV</mtext> </mrow> </math><br /><br />Or <math> <mrow> <msub> <mtext>E</mtext> <mn>1</mn> </msub> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>4</mn> <msup> <mtext>n</mtext> <mn>2</mn> </msup> </mrow> </mfrac> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> <mo>=</mo> <mtext>204 eV</mtext> </mrow> </math> ... (i)<br /><br />And E<sub>2n</sub> - E<sub>n</sub> = 40. 8 eV<br /><br />Or <math><mrow><mfrac linethickness=\"1\"><mrow><msub><mi>E</mi><mn>1</mn></msub></mrow><mrow><mn>4</mn><msup><mi>n</mi><mn>2</mn></msup></mrow></mfrac><mo>-</mo><mfrac linethickness=\"1\"><mrow><msub><mi>E</mi><mn>1</mn></msub></mrow><mrow><msup><mi>n</mi><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mn>40.8e</mn><mi>V</mi></mrow></math><br /><br />or<math> <mrow> <msub> <mtext>E</mtext> <mn>1</mn> </msub> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mo>-</mo> <mn>3</mn> </mrow> <mrow> <mn>4</mn> <msup> <mtext>n</mtext> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </mfenced> <mo>=</mo> <mtext>40.8 eV</mtext> </mrow> </math> .... (ii)<br /><br />From Eqs. (i) and (ii),<br /><br /><math> <mrow> <mfrac> <mrow> <mn>1</mn> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>4</mn> <mtext>n</mtext> </mrow> </mfrac> </mrow> <mrow> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>4</mn> <msup> <mtext>n</mtext> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </mfrac> <mo>=</mo> <mn>5</mn> </mrow></math><br /><br />Or&nbsp;<math> <mrow> <mn>1</mn> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>4</mn> <msup> <mtext>n</mtext> <mn>2</mn> </msup> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> <mn>5</mn> </mrow> <mrow> <mn>4</mn> <msup> <mtext>n</mtext> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </math><br /><br />Or&nbsp;<math> <mrow> <mfrac> <mrow> <mn>4</mn> </mrow> <mrow> <msup> <mtext>n</mtext> <mn>2</mn> </msup> </mrow> </mfrac> <mo>=</mo> <mn>1</mn> </mrow> </math><br /><br />or n = 2<br /><br />From Eq. (ii),<br /><br /><math> <mrow> <msub> <mtext>E</mtext> <mn>1</mn> </msub> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <mn>4</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> <msup> <mtext>n</mtext> <mn>2</mn> </msup> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>40.8</mtext> </mrow> </mfenced> <mtext>eV</mtext> </mrow> </math><br /><br /><math><mrow><mo>=</mo><mo>-</mo><mfrac linethickness=\"1\"><mn>4</mn><mn>3</mn></mfrac><msup><mrow><mo maxsize=\"1.00em\">(</mo><mn>2</mn><mo maxsize=\"1.00em\">)</mo></mrow><mn>2</mn></msup><mrow><mo maxsize=\"1.00em\">(</mo><mn>40.8</mn><mo maxsize=\"1.00em\">)</mo></mrow><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>e</mi><mi>V</mi></mrow></math><br /><br />or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">E</mi><mn>1</mn></msub><mo>&nbsp;</mo><mo>=</mo><mo>-</mo><mo>&nbsp;</mo><mn>217</mn><mo>.</mo><mo>&nbsp;</mo><mn>6</mn><mo>&nbsp;</mo><mi>eV</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mn>1</mn></msub><mo>=</mo><mo>&nbsp;</mo><mo>-</mo><mo>&nbsp;</mo><mo>(</mo><mn>13</mn><mo>.</mo><mo>&nbsp;</mo><mn>6</mn><mo>)</mo><mo>&nbsp;</mo><msub><mi>Z</mi><mn>2</mn></msub></math><br /><br />Therefore &nbsp;<math> <mrow> <msup> <mtext>Z</mtext> <mn>2</mn> </msup> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>E</mtext> <mn>1</mn> </msub> </mrow> <mrow> <mo>-</mo> <mn>1</mn> <mn>3</mn> <mo>·</mo> <mn>6</mn> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mo>-</mo> <mn>2</mn> <mn>1</mn> <mn>7</mn> <mo>-</mo> <mn>6</mn> </mrow> <mrow> <mo>-</mo> <mn>1</mn> <mn>3</mn> <mo>·</mo> <mn>6</mn> </mrow> </mfrac> <mo>=</mo> <mn>1</mn> <mn>6</mn> </mrow> </math><br /><br />Therefore<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mi>Z</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>4</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ea10edefc267ebd8", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "45", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>In a Coolidge tube, the potential difference used to accelerate the electrons is increased from&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>24</mn><mo>.</mo><mn>8</mn><mo>&nbsp;</mo><mi>kV</mi></math>&nbsp;to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>49</mn><mo>.</mo><mn>6</mn><mo>&nbsp;</mo><mi>kV</mi></math>.&nbsp;As a result, the difference between the wavelength of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mi>α</mi></msub></math>-line and minimum wavelength becomes two times. The initial wavelength of the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mi>α</mi></msub></math>-line is&nbsp;[Take&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mi>e</mi></mfrac><mo>=</mo><mn>12</mn><mo>.4</mo><mo>&nbsp;</mo><mi>kV</mi><mo>&nbsp;</mo><mover><mi mathvariant=\"normal\">A</mi><mo>°</mo></mover></math>]</p>\r", "image": null}, "options": [{"id": "E43bB", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\"></mi><mover><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mo>°</mo></mrow></mover></math>", "image": null, "isCorrect": false}, {"id": "QaqQI", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mi mathvariant=\"normal\"></mi><mover><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mo>°</mo></mrow></mover></math>", "image": null, "isCorrect": true}, {"id": "HfNqs", "text": "<math><mfrac><mrow><mn>5</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\"></mi><mover><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mo>°</mo></mrow></mover></math>", "image": null, "isCorrect": false}, {"id": "AI5zB", "text": "<math><mfrac><mrow><mn>5</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mi mathvariant=\"normal\"></mi><mover><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mo>°</mo></mrow></mover></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Let ∆<em>E</em> be the energy of <em>k</em><sub>&alpha;</sub>-line then</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><msub><mi>&#955;</mi><msub><mi>K</mi><mi>&#945;</mi></msub></msub></mfrac><mo>=</mo><mi mathvariant=\"normal\">&#916;</mi><msub><mi>E</mi><msub><mi>K</mi><mi>&#945;</mi></msub></msub></math><br />&rArr; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#955;</mi><msub><mi>K</mi><mi>&#945;</mi></msub></msub><mo>=</mo><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mi mathvariant=\"normal\">&#916;</mi><msub><mi>E</mi><msub><mi>K</mi><mi>&#945;</mi></msub></msub></mrow></mfrac></math><br />Now the cutoff wavelengths in the two cases are</p><p>&nbsp;<math><msub><mrow><mi>&#955;</mi></mrow><mrow><mn>1</mn><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mi>e</mi><mo>&#215;</mo><mn>24.8&#160;</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">V</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>12.4</mn></mrow><mrow><mn>24.8</mn></mrow></mfrac><mover><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mo>&#176;</mo></mrow></mover><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mover><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mo>&#176;</mo></mrow></mover></math>&nbsp;</p><p><math><msub><mrow><mi>&#955;</mi></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mrow><mi>e</mi><mo>&#215;</mo><mn>49.6&#160;</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">V</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>12.4</mn></mrow><mrow><mn>49.6</mn></mrow></mfrac><mover><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mo>&#176;</mo></mrow></mover><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mover><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mo>&#176;</mo></mrow></mover></math><br />&rArr; <math><mn>2</mn><mfenced separators=\"|\"><mrow><msub><mrow><mi>&#955;</mi></mrow><mrow><mi>k</mi><mi>&#945;</mi></mrow></msub><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced><mo>=</mo><mfenced separators=\"|\"><mrow><msub><mrow><mi>&#955;</mi></mrow><mrow><mi>k</mi><mi>&#945;</mi></mrow></msub><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac></mrow></mfenced></math><br />&rArr; <math><mn>2</mn><msub><mrow><mi>&#955;</mi></mrow><mrow><mi>k</mi><mi>&#945;</mi></mrow></msub><mo>-</mo><mn>1</mn><mo>=</mo><msub><mrow><mi>&#955;</mi></mrow><mrow><mi>k</mi><mi>&#945;</mi></mrow></msub><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math><br />&rArr; <math><msub><mrow><mi>&#955;</mi></mrow><mrow><mi>k</mi><mi>&#945;</mi></mrow></msub><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math><br />&rArr; <math><msub><mrow><mi>&#955;</mi></mrow><mrow><mi>k</mi><mi>&#945;</mi></mrow></msub><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mi mathvariant=\"normal\">&#197;</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e1f9ee8e41510e8e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "73", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Imagine an atom made up of a proton and a hypothetical particle of double the mass of the electron but having the same charge as the electron. Apply the Bohr atom model and consider all possible transitions of this hypothetical particle to the first excited level. The longest wavelength photon that will be emitted has wavelength <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>X</mi></math>&nbsp;(given in terms of the Rydberg constant&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> for the hydrogen atom) is equal to", "image": null}, "options": [{"id": "Vs259", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><mrow><mn>5</mn><mi>R</mi></mrow></mfrac></math><div id=\"gtx-trans\" style=\"position: absolute; left: 67px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div><div id=\"gtx-trans\" style=\"position: absolute; left: 67px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "E9Ly7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>36</mn><mrow><mn>5</mn><mi>R</mi></mrow></mfrac></math><div id=\"gtx-trans\" style=\"position: absolute; left: 67px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div><div id=\"gtx-trans\" style=\"position: absolute; left: 67px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "XNIZj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>18</mn><mrow><mn>5</mn><mi>R</mi></mrow></mfrac></math><div id=\"gtx-trans\" style=\"position: absolute; left: 67px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div><div id=\"gtx-trans\" style=\"position: absolute; left: 67px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "2VLTo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mi>R</mi></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>In hydrogen atom <math><mrow><msub> <mtext>E</mtext> <mtext>n</mtext> </msub> <mo></mo><mo>-</mo><mfrac linethickness=\"1\"><mrow><mi>R</mi><mi>h</mi><mi>c</mi></mrow><mrow><msup><mi>n</mi><mn>2</mn></msup></mrow></mfrac></mrow></math><br /><br />where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> is the mass of the electron. Here, the electron has been replaced by a particle whose mass is double of an electron. Therefore, energy in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>n</mi><mi>th</mi></msup></math> orbit for this hypothetical atom will be given by<br /><br /><math><mrow><msub><mi>E</mi><mi>n</mi></msub><mo>=</mo><mo></mo><mo></mo><mo>-</mo><mfrac linethickness=\"1\"><mrow><mn>2</mn><mi>R</mi><mi>h</mi><mi>c</mi></mrow><mrow><msup><mi>n</mi><mn>2</mn></msup></mrow></mfrac></mrow></math><br /><br />The longest wavelength&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi></math>max (or minimum energy) photon will correspond to the transition of the particle from&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>3</mn></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>2</mn><mo>&#160;</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mtext mathvariant=\"italic\">hc</mtext><msub><mi>&#955;</mi><mtext>max</mtext></msub></mfrac><mo>=</mo><msub><mtext mathvariant=\"italic\">E</mtext><mn>3</mn></msub><mo>-</mo><msub><mtext mathvariant=\"italic\">E</mtext><mn>2</mn></msub><mo>=</mo><mn>2</mn><mtext mathvariant=\"italic\">Rhc</mtext><mfenced><mrow><mfrac><mn>1</mn><msup><mn>2</mn><mn>2</mn></msup></mfrac><mo>-</mo><mfrac><mn>1</mn><msup><mn>3</mn><mn>2</mn></msup></mfrac></mrow></mfenced></math><br /><br />This gives, &lambda;<sub> max</sub><math><mo>=</mo><mrow><mfrac linethickness=\"1\"><mn>18</mn><mrow> <mn></mn><mn>5</mn><mi>R</mi></mrow></mfrac></mrow></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863da2232099a942d38", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "49", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Consider a hydrogen-like ionized atom with atomic number <math> <mi>Z</mi> </math> with a single electron. In the emission spectrum of this atom, the photon emitted in the <math><mi>n</mi><mo>=</mo><mn>2</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">o</mi><mi>&nbsp;</mi><mi>n</mi><mo>=</mo><mi>&nbsp;</mi><mn>1</mn></math> transition has energy <math><mn>74.8</mn><mi>&nbsp;</mi><mi>eV</mi></math> higher than the photon emitted in the <math><mi>n</mi><mo>=</mo><mn>3</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">o</mi><mi>&nbsp;</mi><mi>n</mi><mo>=</mo><mn>2</mn></math> transition. Given that the ionization energy of the hydrogen atom is <math><mn>13.6</mn><mi>&nbsp;</mi><mi>eV</mi></math>, what is the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Z</mi></math>?", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "<math><mo>∆</mo><msub><mrow><mi>E</mi></mrow><mrow><mn>2</mn> <mo>&#x2192;</mo><mn>1</mn></mrow></msub><mo>=</mo><mn>13.6</mn><mo>×</mo><msup><mrow><mi>Z</mi></mrow><mrow><mn>2</mn></mrow></msup><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>13.6</mn><mo>×</mo><msup><mrow><mi>Z</mi></mrow><mrow><mn>2</mn></mrow></msup><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac></mrow></mfenced></math><br /><br /><math><mo>∆</mo><msub><mrow><mi>E</mi></mrow><mrow><mn>3</mn> <mo>&#x2192;</mo><mn>2</mn></mrow></msub><mo>=</mo><mn>13.6</mn><mo>×</mo><msup><mrow><mi>Z</mi></mrow><mrow><mn>2</mn></mrow></msup><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>9</mn></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>13.6</mn><mo>×</mo><msup><mrow><mi>Z</mi></mrow><mrow><mn>2</mn></mrow></msup><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>5</mn></mrow><mrow><mn>36</mn></mrow></mfrac></mrow></mfenced></math><br /><br /><math><mo>∆</mo><msub><mrow><mi>E</mi></mrow><mrow><mn>2</mn> <mo>&#x2192;</mo><mn>1</mn></mrow></msub><mo>=</mo><mo>∆</mo><msub><mrow><mi>E</mi></mrow><mrow><mn>3</mn><mo>-</mo><mn>2</mn></mrow></msub><mo>+</mo><mn>74.8</mn></math><br /><br /><math><mn>13.6</mn><mo>×</mo><msup><mrow><mi>Z</mi></mrow><mrow><mn>2</mn></mrow></msup><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>13.6</mn><mo>×</mo><msup><mrow><mi>Z</mi></mrow><mrow><mn>2</mn></mrow></msup><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>5</mn></mrow><mrow><mn>36</mn></mrow></mfrac></mrow></mfenced><mo>+</mo><mn>74.8</mn></math><br /><br /><math><mn>13.6</mn><mo>×</mo><msup><mrow><mi>Z</mi></mrow><mrow><mn>2</mn></mrow></msup><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>36</mn></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>74.8</mn></math><br /><br /><math><msup><mrow><mi>Z</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>9</mn></math><br /><br /><math><mi>Z</mi><mo>=</mo><mo>+</mo><mn>3</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863 mrow><mn>4</mn><mo>×</mo><mfenced separators=\"|\"><mrow><mn>4</mn><mo>-</mo><mn>1</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mn>6</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d79d587cb240d432", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "36", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The potential difference across a Coolidge tube is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mi>kV</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi>mA</mi></math> current flows through the voltage supply. Only <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>0.5%</mtext></math> of the energy, carried by electrons striking the target, is converted into <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math>-ray. Then the power carried by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math>-ray beam (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">W</mi></math>) is", "image": null}, "options": [], "correctValue": "1", "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mi>V</mi><mi>I</mi></math><br />Total power drawn by the tube <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msub><mi>P</mi><mi>T</mi></msub><mo>=</mo><mi>V</mi><mi>I</mi><mo>=</mo><mn>200</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">W</mi></math><br />As <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>0.5%</mtext></math> of energy is carried by
