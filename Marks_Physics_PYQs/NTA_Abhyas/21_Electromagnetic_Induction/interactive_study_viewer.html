mi><mi>&#960;</mi><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><math><mi>&#981;</mi><mo>=</mo><mi>&#960;</mi><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>.</mo><mfrac><mrow><msub><mrow><mi>&#956;</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>q</mi><mi>&#969;</mi></mrow><mrow><mn>16</mn><mi>&#960;</mi><mi>R</mi></mrow></mfrac></math><br /><math><mi>&#981;</mi><mo>=</mo><mfrac><mrow><msub><mrow><mi>&#956;</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>q</mi><mi>&#969;</mi><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>16</mn><mi>R</mi></mrow></mfrac></math><br /><math><mo>|</mo><mi>&#949;</mi><mo>|</mo><mo>=</mo><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mfrac><mrow><mi>d</mi><mi>&#981;</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mrow></mfenced></math><br /><math><mo>|</mo><mi>&#949;</mi><mo>|</mo><mo>=</mo><mfrac><mrow><msub><mrow><mi>&#956;</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>q</mi><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>16</mn><mi>R</mi></mrow></mfrac><mi>&#945;</mi></math> .<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>8</mn><mo>&#160;</mo><mi>volt</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>i</mi><mo>=</mo><mfrac><mn>8</mn><mn>1</mn></mfrac><mo>=</mo><mn>8</mn><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></math>.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e16c66ac782ef272", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "23", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An equilateral triangular loop <em><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ADC</mi></math></em> having some resistance is pulled with a constant velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">v</mi></math> out of a uniform magnetic field directed into the screen. At time <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">t</mi><mo>=</mo><mn>0</mn></math>, side <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>DC</mi></math> of the loop is at edge of the magnetic field. The induced current <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">i</mi></mfenced></math>&nbsp;versus&nbsp;time <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">t</mi></mfenced></math> graph will be as<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/553242.png\" style=\"width: 217px; height: 170px;\" />", "image": null}, "options": [{"id": "7VEJY", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029068_Option_1.jpg\" style=\"width: 155px; height: 148px;\" />", "image": null, "isCorrect": false}, {"id": "wNME7", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029068_Option_2.jpg\" style=\"width: 172px; height: 148px;\" />", "image": null, "isCorrect": true}, {"id": "cv6EU", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029068_Option_3.jpg\" style=\"width: 175px; height: 147px;\" />", "image": null, "isCorrect": false}, {"id": "OpveJ", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029068_Option_4.jpg\" style=\"width: 174px; height: 148px;\" />", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let 2a be the side of the triangle and b the length AE.<br /><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029068_Ans_1.jpg\" style=\"width: 249px; height: 198px;\" /><br /><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <mtext>AH</mtext> </mrow> <mrow> <mtext>AE</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>GH</mtext> </mrow> <mrow> <mtext>EC</mtext> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>∴&nbsp;&nbsp;&nbsp;</mo> <mtext>GH</mtext> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>AH</mtext> </mrow> <mrow> <mtext>AE</mtext> </mrow> </mfrac> </mrow> </mfenced> <mtext>EC</mtext> </mrow> </math><br /><br />or&nbsp;&nbsp;<math> <mrow> <mtext>GH</mtext> <mo>=</mo> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>b</mtext> <mo>-</mo> <mtext>vt</mtext> </mrow> </mfenced> </mrow> <mrow> <mtext>b</mtext> </mrow> </mfrac> <mo>·</mo> <mtext>a</mtext> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mtext>a</mtext> <mo>-</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>a</mtext> </mrow> <mrow> <mtext>b</mtext> </mrow> </mfrac> <mtext>vt</mtext> </mrow> </mfenced> </mrow> </math><br /><br /><math> <mrow> <mo>∴&nbsp;&nbsp;&nbsp;</mo> <mtext>FG</mtext> <mo>=</mo> <mn>2</mn> <mtext>GH</mtext> <mo>=</mo> <mn>2</mn> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mtext>a</mtext> <mo>-</mo> <mfrac> <mrow> <mtext>a</mtext> </mrow> <mrow> <mtext>b</mtext> </mrow> </mfrac> <mtext>vt</mtext> </mrow> </mfenced> </mrow> </math><br /><br />Induced emf <math> <mrow> <mtext>e</mtext> <mo>=</mo> <mtext>Bv</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>FG</mtext> </mrow> </mfenced> <mo>=</mo> <mn>2</mn> <mtext>Bv</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>a</mtext> <mo>-</mo> <mfrac> <mrow> <mtext>a</mtext> </mrow> <mrow> <mtext>b</mtext> </mrow> </mfrac> <mtext>vt</mtext> </mrow> </mfenced> </mrow> </math><br /><br /><math> <mrow> <mo>∴&nbsp;&nbsp;&nbsp;</mo> </mrow> </math> Induced current <math> <mrow> <mtext>i</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>e</mtext> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> <mtext>Bv</mtext> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mtext>a</mtext> <mo>-</mo> <mfrac> <mrow> <mtext>a</mtext> </mrow> <mrow> <mtext>b</mtext> </mrow> </mfrac> <mtext>vt</mtext> </mrow> </mfenced> </mrow> </math><br /><br />or&nbsp; &nbsp; i = k<sub>1</sub> - k<sub>2</sub>t<br /><br />Thus, i-t graph is a straight line with negative slope and positive intercept.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863de61747921037ffb", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "96", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A flexible wire bent in the form of a circle is placed in a uniform magnetic field perpendicularly to the plane of the coil. The radius of the coil changes as shown in the diagram. The graph of the magnitude of induced emf in the coil is represented by<br />\r<br />\r<u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0031609_Question.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 220px; height: 142px;\" /></strong></u>", "image": null}, "options": [{"id": "s91BQ", "text": "<u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0031609_Option_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 200px; height: 160px;\" /></strong></u>", "image": null, "isCorrect": false}, {"id": "rnYAi", "text": "<u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0031609_Option_2.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 200px; height: 156px;\" /></strong></u>", "image": null, "isCorrect": true}, {"id": "D0VA9", "text": "<u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0031609_Option_3.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 200px; height: 159px;\" /></strong></u>", "image": null, "isCorrect": false}, {"id": "hNz75", "text": "<u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0031609_Option_4.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 200px; height: 159px;\" /></strong></u>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In the r-t graph, it is clear that from a to b there is no change in radius and hence no change in area and magnetic flux. Same is the situation from c to d for b to c.<br /><br /><math> <mrow> <mtext>Now</mtext> <mtext>,</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mfenced close=\"|\" open=\"|\" separators=\",\"> <mrow> <mtext>e</mtext> </mrow> </mfenced> <mo>=</mo> <mfrac> <mrow> <mtext>d</mtext> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi>ϕ</mi> </mrow> </mfenced> </mrow> </math><br /><br />&nbsp;&nbsp;<math>&nbsp;<mrow><mfenced close=\"|\" open=\"|\" separators=\",\"><mrow><mtext>e</mtext> </mrow> </mfenced> <mo>=</mo> <mtext>B</mtext> <mfrac> <mrow> <mtext>d</mtext> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi>π</mi> <msup> <mtext>r</mtext> <mn>2</mn> </msup> </mrow> </mfenced> <mo>=</mo> <mtext>B</mtext> <mi>π</mi> <mn>2</mn> <mtext>r</mtext> <mfrac> <mrow> <mtext>dr</mtext> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mtext>Since r</mtext> <mo>∝</mo> <mtext>t,</mtext> <mo>∴</mo> <mfrac> <mrow> <mtext>dr</mtext> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> <mo>=</mo> <mtext>constant</mtext> </mrow> </math><br /><br />∴&nbsp;&nbsp;<math> <mrow> <mfenced close=\"|\" open=\"|\" separators=\",\"> <mrow> <mtext>e</mtext> </mrow> </mfenced> <mo>∝</mo> <mtext>r</mtext> </mrow> </math><br /><br />This is represented in option (2).", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863dc407f9c0195d5d4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "24", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A superconducting loop of radius <math><mi mathvariant=\"normal\">R</mi></math> has self-inductance <math><mi mathvariant=\"normal\">L</mi></math>. A uniform and constant magnetic field <math><mi mathvariant=\"normal\">B</mi></math> is applied perpendicular to the plane of the loop. Initially current in this loop is zero. The loop is rotated by <math><mn>180</mn><mo>°</mo></math>. The current in the loop after the rotation is", "image": null}, "options": [{"id": "4HuLk", "text": "zero", "image": null, "isCorrect": false}, {"id": "keEq1", "text": "<math><mfrac><mrow><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">π</mi><msup><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi mathvariant=\"normal\">L</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "iZqd0", "text": "<math><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">π</mi><msup><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi mathvariant=\"normal\">L</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "DYlxw", "text": "<math><mfrac><mrow><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">π</mi><msup><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">L</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Initially, the current was zero, so self-induced flux was also zero. Now when we rotate the loop, the change in flux is<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Δ</mi><mi mathvariant=\"normal\">ϕ</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">π</mi><msup><mi mathvariant=\"normal\">R</mi><mn>2</mn></msup><mo>×</mo><mi mathvariant=\"normal\">B</mi></math><br /><br />Finally, to maintain the same zero flux, the current in the superconducting loop will be such that the flux due to induced current will negative of the flux due to external field<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">L</mi><mo>×</mo><mi mathvariant=\"normal\">i</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">π</mi><msup><mi mathvariant=\"normal\">R</mi><mn>2</mn></msup><mo>×</mo><mi mathvariant=\"normal\">B</mi></math>.<br /><br /><math><mi mathvariant=\"normal\">i</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">π</mi><msup><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>×</mo><mi mathvariant=\"normal\">B</mi></mrow><mrow><mi mathvariant=\"normal\">L</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863dbb195a46059ab76", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "79", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A non–conducting ring of radius <math><mi>R</mi></math> having uniformly distributed charge <math><mi>Q</mi></math> starts rotating about <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi><mo>–</mo><mi mathvariant=\"normal\">x</mi><mi mathvariant=\"normal\">'</mi></math> axis passing through diameter with an angular acceleration <math><mi>α</mi></math>, as shown in the figure. Another small conducting ring having radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math>&nbsp;<math><mfenced separators=\"|\"><mrow><mi>a</mi><mo>≪</mo><mi>R</mi></mrow></mfenced></math> is kept fixed at the centre of the bigger ring is such a way that axis <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>xx</mi><mi mathvariant=\"normal\">'</mi></math> is passing through its centre and perpendicular to its plane. If the resistance of the small ring is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi><mo>,</mo></math> find the induced current in it in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ampere</mi></math>.<br />\r(Given <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi><mo>=</mo><mfrac><mrow><mn>16</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mn>2</mn></msup></mrow><msub><mi>μ</mi><mn>0</mn></msub></mfrac><mo>&nbsp;</mo><mi mathvariant=\"normal\">C</mi><mo>,</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>1</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mo>,</mo><mi>&nbsp;</mi><mi>a</mi><mi>&nbsp;</mi><mo>=</mo><mi>&nbsp;</mi><mn>0.1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>α</mi><mo>=</mo><mn>8</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">d</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>)<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/460399_que.JPG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 180px; height: 98px;\" />", "image": null}, "options": [], "correctValue": "8", "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/460399_sol.JPG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 200px; height: 156px;\" /><br /><br /><math><mi>d</mi><mi>q</mi><mo>=</mo><mfrac><mrow><mi>q</mi></mrow><mrow><mn>2</mn><mi>π</mi><mi>R</mi></mrow></mfrac><mo>.</mo><mi>R</mi><mi>d</mi><mi>θ</mi><mo>=</mo><mfrac><mrow><mi>q</mi></mrow><mrow><mn>2</mn><mi>π</mi></mrow></mfrac><mo>.</mo><mi>d</mi><mi>θ</mi></math><br /><math><mi>d</mi><mi>i</mi><mo>=</mo><mfrac><mrow><mi>d</mi><mi>q</mi></mrow><mrow><mi>T</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>q</mi><mi>d</mi><mi>θ</mi><mi>ω</mi></mrow><mrow><mn>2</mn><mi>π</mi><mn>2</mn><mi>π</mi></mrow></mfrac></math><br /><math><mi>d</mi><mi>i</mi><mo>=</mo><mfrac><mrow><mi>q</mi><mi>ω</mi></mrow><mrow><mn>4</mn><msup><mrow><mi>π</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>.</mo><mi>d</mi><mi>θ</mi></math><br /><math><mi>d</mi><mi>B</mi><mo>=</mo><mfrac><mrow><msub><mrow><mi>μ</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>d</mi><mi>i</mi><mo>(</mo><mi>R</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><msup><mrow><mo>)</mo></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><msup><mrow><mi>R</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow></mfrac></math><br /><math><mrow><mo stretchy=\"false\">∫</mo><mrow><mi>d</mi><mi>B</mi></mrow></mrow><mo>=</mo><mrow><msubsup><mo stretchy=\"false\">∫</mo><mrow><mn>0</mn></mrow><mrow><mi>π</mi></mrow></msubsup><mrow><mfrac><mrow><msub><mrow><mi>μ</mi></mrow><mrow><mn>0</mn></mrow></msub><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow></mrow><mrow><mn>2</mn><mi>R</mi></mrow></mfrac><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>q</mi><mi>ω</mi></mrow><mrow><mn>4</mn><msup><mrow><mi>π</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced><mi>d</mi><mi>θ</mi></mrow></mrow></math><br /><math><mi>B</mi><mo>=</mo><mfrac><mrow><msub><mrow><mi>μ</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>q</mi><mi>ω</mi></mrow><mrow><mn>16</mn><mi>π</mi><mi>R</mi></mrow></mfrac></math><br /><math><mi>ϕ</mi><mo>=</mo><mi>B</mi><mi>π</mi><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><math><mi>ϕ</mi><mo>=</mo><mi>π</mi><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>.</mo><mfrac><mrow><msub><mrow><mi>μ</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>q</mi><mi>ω</mi></mrow><mrow><mn>16</mn><mi>π</mi><mi>R</mi></mrow></mfrac></math><br /><math><mi>ϕ</mi><mo>=</mo><mfrac><mrow><msub><mrow><mi>μ</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>q</mi><mi>ω</mi><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>16</mn><mi>R</mi></mrow></mfrac></math><br /><math><mo>|</mo><mi>ε</mi><mo>|</mo><mo>=</mo><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mfrac><mrow><mi>d</mi><mi>ϕ</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mrow></mfenced></math><br /><math><mo>|</mo><mi>ε</mi><mo>|</mo><mo>=</mo><mfrac><mrow><msub><mrow><mi>μ</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>q</mi><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>16</mn><mi>R</mi></mrow></mfrac><mi>α</mi></math> .<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>8</mn><mo>&nbsp;</mo><mi>volt</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>i</mi><mo>=</mo><mfrac><mn>8</mn><mn>1</mn></mfrac><mo>=</mo><mn>8</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d8cfb28d3e04db18", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "107", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A long solenoid of the cross-sectional radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;has a thin insulated wire ring tightly put on its winding. One half of the ring has the resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn></math> times that of the other half. The magnetic induction produced by the solenoid varies with time as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mi>b</mi><mi>t</mi></math>, whose b is a constant. If the magnitude of the electric field strength in the ring is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>p</mi><mi>q</mi></mfrac><mi>R</mi><mi>b</mi></math>, where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi></math>&nbsp;are the smallest positive integers, then what is the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>p</mi><mo>+</mo><mi>q</mi></mrow></mfenced></math>?", "image": null}, "options": [], "correctValue": "31", "solution": {"text": "Both upper half and lower half will have same effective area of&nbsp;<math> <mrow> <mfrac> <mrow> <mi>π</mi> <msup> <mrow> <mi></mi><mi></mi><mi></mi><mi>R</mi><mo>⁡</mo> </mrow> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math>&nbsp;so charge in flux will be same and induced emf will have some value. But since the resistance is different due to which current must be different but ring is as a whole is closed circuit so electric field will be generated to make the current flow in both parts to be same.<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013373_AnsExp_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 116px; height: 122px;\" /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013373_AnsExp_2.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 117px; height: 136px;\" /><br /><br /><math> <mrow> <mi>ε</mi> <mo>+</mo> <mi></mi><mi></mi><mi>E</mi><mo>⁡</mo> <mi>π</mi> <mi></mi><mi></mi><mi></mi><mi>R</mi><mo>⁡</mo> <mo>-</mo> <mi></mi><mi></mi><mi>i</mi><mo>⁡</mo> <mn>1</mn> <mn>0</mn> <mi></mi><mi></mi><mi>r</mi><mo>⁡</mo> <mo>=</mo> <mn>0</mn> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mo>…</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi></mi><mi></mi><mi>i</mi><mo>⁡</mo> </mrow> </mfenced> </mrow> </math><br /><br /><math> <mrow> <mi>ε</mi> <mo>-</mo> <mi></mi><mi></mi><mi>E</mi><mo>⁡</mo> <mi>π</mi> <mi></mi><mi></mi><mi></mi><mi>R</mi><mo>⁡</mo> <mo>-</mo> <mi></mi><mi></mi><mi>i</mi><mo>⁡</mo><mi></mi><mi></mi><mi>r</mi><mo>⁡</mo> <mo>=</mo> <mn>0</mn> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mo>…</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi></mi><mi></mi><mi>i</mi><mo>⁡</mo> <mi></mi><mi></mi><mi>i</mi><mo>⁡</mo> </mrow> </mfenced> </mrow> </math><br /><br /><math> <mrow> <mo>⇒</mo> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mn>2</mn> <mi>E</mi> <mi>π</mi> <mi></mi><mi></mi><mi>R</mi><mo>⁡</mo> <mo>-</mo> <mn>9</mn> <mi></mi><mi></mi><mi>i</mi><mo>⁡</mo> <mi></mi><mi></mi><mi>r</mi><mo>⁡</mo> <mo>=</mo> <mn>0</mn> </mrow> </math><br /><br /><math> <mrow> <mi></mi><mi></mi><mi>E</mi><mo>⁡</mo> <mo>=</mo> <mfrac> <mrow> <mn>9</mn> <mtext>i</mtext> <mtext>r</mtext> </mrow> <mrow> <mn>2</mn> <mi>π</mi> <mi></mi><mi></mi><mi>R</mi><mo>⁡</mo> </mrow> </mfrac> <mo>⇒</mo> <mi></mi><mi></mi><mi>i</mi><mo>⁡</mo> <mo>=</mo> <mfrac> <mrow> <mi></mi><mi></mi><mi>E</mi><mo>⁡</mo> </mrow> <mrow> <mn>1</mn> <mn>1</mn> <mi></mi><mi></mi><mi>r</mi><mo>⁡</mo> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mi>π</mi> <msup> <mrow> <mi></mi><mi></mi><mi>R</mi><mo>⁡</mo> </mrow> <mn>2</mn> </msup> <mi>b</mi> </mrow> <mrow> <mn>1</mn> <mn>1</mn> <mi></mi><mi></mi><mi>r</mi><mo>⁡</mo> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>⇒</mo> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mi></mi><mi></mi><mi>E</mi><mo>⁡</mo> <mo>=</mo> <mfrac> <mrow> <mn>9</mn> <mtext>r</mtext> </mrow> <mrow> <mn>2</mn> <mi>π</mi> <mi></mi><mi></mi><mi>R</mi><mo>⁡</mo> </mrow> </mfrac> <mo>×</mo> <mfrac> <mrow> <mi>π</mi> <msup> <mrow> <mi></mi><mi></mi><mi>R</mi><mo>⁡</mo> </mrow> <mn>2</mn> </msup> <mi>b</mi> </mrow> <mrow> <mn>1</mn> <mn>1</mn> <mi></mi><mi></mi><mi>r</mi><mo>⁡</mo> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>9</mn> </mrow> <mrow> <mn>2</mn> <mn>2</mn> </mrow> </mfrac> <mtext>Rb</mtext> </mrow> </math><br /><br />∴&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <mn>9</mn> </mrow> <mrow> <mn>2</mn> <mn>2</mn> </mrow> </mfrac> <mtext>Rb</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d58e068e2c0a8e3f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "61", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A superconducting loop of the radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> has self-inductance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math>. A uniform and the constant magnetic field <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> is applied perpendicular to the plane of the loop. Initially current in this loop is zero. The loop is rotated by <math><mn>180</mn><mo>°</mo></math>. The current in the loop after the rotation is", "image": null}, "options": [{"id": "R3zIr", "text": "zero", "image": null, "isCorrect": false}, {"id": "uGjmM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>B</mi><mi mathvariant=\"normal\">&#960;</mi><msup><mi>R</mi><mn>2</mn></msup></mrow><mi>L</mi></mfrac></math>", "image": null, "isCorrect": false}, {"id": "7sbbc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mi>B</mi><mi mathvariant=\"normal\">&#960;</mi><msup><mi>R</mi><mn>2</mn></msup></mrow><mi>L</mi></mfrac></math>", "image": null, "isCorrect": true}, {"id": "XoEtU", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>B</mi><mi mathvariant=\"normal\">&#960;</mi><msup><mi>R</mi><mn>2</mn></msup></mrow><mrow><mn>2</mn><mi>L</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Initially, the current was zero, so self-induced flux was also zero. Now when we rotate the loop, the change in flux is<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Δ</mi><mi mathvariant=\"normal\">ϕ</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">π</mi><msup><mi mathvariant=\"normal\">R</mi><mn>2</mn></msup><mo>×</mo><mi mathvariant=\"normal\">B</mi></math><br /><br />Finally, to maintain the same zero flux, the current in the superconducting loop will be such that the flux due to induced current will negative of the flux due to external field<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">L</mi><mo>×</mo><mi mathvariant=\"normal\">i</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">π</mi><msup><mi mathvariant=\"normal\">R</mi><mn>2</mn></msup><mo>×</mo><mi mathvariant=\"normal\">B</mi></math>.<br /><br /><math><mi mathvariant=\"normal\">i</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">π</mi><msup><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>×</mo><mi mathvariant=\"normal\">B</mi></mrow><mrow><mi mathvariant=\"normal\">L</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863cb435c263b5dcbd7", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "82", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If a magnet is plugged into a coil, then the magnitude of induced emf does not depend upon", "image": null}, "options": [{"id": "86mP0", "text": "The number of turns in the coil", "image": null, "isCorrect": false}, {"id": "tnZHK", "text": "The medium of the core of the coil", "image": null, "isCorrect": false}, {"id": "Tz5cw", "text": "The strength of the magnet", "image": null, "isCorrect": false}, {"id": "tzKcb", "text": "The resistance of the coil", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The magnitude of induced emf is given by, <math><mi>e</mi><mo>=</mo><mfrac><mrow><mi>N</mi><mi>d</mi><mi>ϕ</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mi>N</mi><mi>B</mi><mfrac><mrow><mi>d</mi><mi>s</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math><br /><br />Which depends upon the number of turns (N), magnetic field intensity (B) which depends upon the medium, rate of change of area <math><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>d</mi><mi>s</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mrow></mfenced></math> which depends upon insertion speed of magnet. It is independent of resistance of the coil.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c7957e391480e327", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "53", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A rectangular frame <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ABCD</mi></math> made of a uniform metal wire has a straight connection between <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">E</mi></math> &amp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">F</mi></math>&nbsp;made of the same wire as shown in the figure.<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mi>AEFD</mi></math>&nbsp;is a square of side <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math>&nbsp;&amp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>EB</mi><mo>=</mo><mi>FC</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math>. The entire circuit is placed in a steadily increasing uniform magnetic field directed into the plane of the paper. The rate&nbsp;of change of the magnetic field is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">T</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>, the resistance per unit length of the wire is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. If the currents in the segments&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AE</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>EF</mi></math>&nbsp;are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>I</mi><mi>AE</mi></msub></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>I</mi><mi>EF</mi></msub></math>&nbsp;respectively, then what is the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>I</mi><mi>AE</mi></msub><msub><mi>I</mi><mi>EF</mi></msub></mfrac></math>?<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013916_Ques1_2.jpg\" style=\"width: 193px; height: 179px;\" />", "image": null}, "options": [], "correctValue": "7", "solution": {"text": "<p><u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013916_AnsExp1_1.jpg\" style=\"width: 243px; height: 198px;\" /> <img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013916_AnsExp1_2.jpg\" /></strong></u><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>e</mi><mn>1</mn></msub><mo>=</mo><mi>A</mi><mfrac><mrow><mtext>d</mtext><mi>B</mi></mrow><mrow><mtext>d</mtext><mi>t</mi></mrow></mfrac><mo>=</mo><mn>1</mn><mo>&#215;</mo><mtext>1</mtext><mo>&#215;</mo><mn>1</mn><mo>=</mo><mtext>1 V</mtext></math><br /><br />&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>e</mi><mn>2</mn></msub><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>0</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></math><br /><br />From loop <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AEFDA</mi></math></p><p>​<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mfenced><mrow><msub><mi>I</mi><mn>1</mn></msub><mo>-</mo><msub><mi>I</mi><mn>2</mn></msub></mrow></mfenced><mo>-</mo><mn>1</mn><mo>+</mo><mn>3</mn><msub><mi>I</mi><mn>1</mn></msub><mo>=</mo><mn>0</mn><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mo>&#8658;</mo><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mn>4</mn><msub><mi>I</mi><mn>1</mn></msub><mo>-</mo><msub><mi>I</mi><mn>2</mn></msub><mo>=</mo><mn>1</mn><mn>&#160; &#160; &#160; &#160; &#160; &#160; &#160; &#160; &#160; &#160; &#160;...(1)</mn></math><br /><br />From loop <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>FCBEF</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>0.5</mtext><mo>-</mo><mn>2</mn><msub><mi>I</mi><mn>2</mn></msub><mo>+</mo><mfenced><mrow><msub><mi>I</mi><mn>1</mn></msub><mo>-</mo><msub><mi>I</mi><mn>2</mn></msub></mrow></mfenced><mo>=</mo><mn>0</mn><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mo>&#8658;</mo><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mo>-</mo><msub><mi>I</mi><mn>1</mn></msub><mo>+</mo><mn>3</mn><msub><mi>I</mi><mn>2</mn></msub><mo>=</mo><mtext>0.5</mtext><mn>&#160; &#160; &#160; &#160; &#160; &#160; &#160; &#160; &#160; &#160; &#160;...(2)</mn></math><br /><br />From (1) and (2)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>I</mi><mn>1</mn></msub><mo>=</mo><mfrac><mtext>7</mtext><mtext>22</mtext></mfrac><mo>&#160;</mo><mtext>A,</mtext><mspace width=\"0.5em\"></mspace><msub><mi>I</mi><mn>2</mn></msub><mo>=</mo><mfrac><mn>3</mn><mtext>11</mtext></mfrac><mo>&#160;</mo><mtext>A,</mtext><mspace width=\"0.5em\"></mspace><msub><mi>I</mi><mn>1</mn></msub><mo>-</mo><msub><mi>I</mi><mn>2</mn></msub><mo>=</mo><mfrac><mtext>1</mtext><mtext>22</mtext></mfrac><mo>&#160;</mo><mtext>A</mtext></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>I</mi><mtext>AE</mtext></msub><mo>=</mo><mfrac><mtext>7</mtext><mtext>22</mtext></mfrac><mo>&#160;</mo><mtext>A</mtext><mspace width=\"0.5em\"></mspace></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>I</mi><mtext>BE</mtext></msub><mo>=</mo><mfrac><mn>3</mn><mtext>11</mtext></mfrac><mo>&#160;</mo><mtext>A</mtext></math>&nbsp;,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>I</mi><mtext>EF</mtext></msub><mo>=</mo><mfrac><mtext>1</mtext><mtext>22</mtext></mfrac><mo>&#160;</mo><mtext>A</mtext></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>I</mi><mi>AE</mi></msub><msub><mi>I</mi><mi>EF</mi></msub></mfrac><mo>=</mo><mn>7</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c42ef1c0bbf4df26", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "12", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A circular coil, carrying a constant current <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>i</mi></math>&nbsp;is kept in the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>-</mo><mi>y</mi></math>&nbsp;plane.&nbsp;The magnetic flux through the entire <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>-</mo><mi>y</mi></math>&nbsp;plane excluding the area of the&nbsp;circular coil is given by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#981;</mi></math>&nbsp;and the magnetic flux through the area of the circular coil area is given by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#981;</mi><mn>0</mn></msub></math>, then", "image": null}, "options": [{"id": "PSu3z", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#x3D5;</mi><mo>&gt;</mo><mo>-</mo><msub><mi>&#x3D5;</mi><mn>0</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "VixXA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ϕ</mi><mo>&lt;</mo><msub><mi>ϕ</mi><mn>0</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "8LuRy", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#x3D5;</mi><mo>=</mo><mo>-</mo><msub><mi>&#x3D5;</mi><mn>0</mn></msub></math>", "image": null, "isCorrect": true}, {"id": "pSeBv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#x3D5;</mi><mo>=</mo><msub><mi>&#x3D5;</mi><mn>0</mn></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>As magnetic field lines always form a closed loop, hence every magnetic field line creating magnetic flux in the inner region must be passing through the outer region. So the magnetic flux for one of the regions will be positive and for the other,&nbsp;it will be negative but both will have the same magnitude. This means&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#981;</mi><mo>=</mo><mo>-</mo><msub><mi>&#981;</mi><mn>0</mn></msub></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c3d34629d4aae847", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "55", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A conducting loop (as shown) has total resistance <math> <mi>R</mi></math>. A uniform magnetic field <math><mi>B</mi><mo>=</mo><mi>γ</mi><mi>t</mi></math> is applied perpendicular to plane of the loop where <math><mi>γ</mi></math> is a constant and <math> <mi>t</mi> </math> is time. The induced current flowing through loop is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/335306q.png\" style=\"width: 125px; height: 117px;\" />", "image": null}, "options": [{"id": "ada84", "text": "<math><mfrac><mrow><mfenced separators=\"|\"><mrow><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced><mi>γ</mi><mi>t</mi></mrow><mrow><mi>R</mi></mrow></mfrac><mi> </mi></math>", "image": null, "isCorrect": false}, {"id": "3hLWZ", "text": "<math><mfrac><mrow><mfenced separators=\"|\"><mrow><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced><mi>γ</mi></mrow><mrow><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "z2Jit", "text": "<math><mfrac><mrow><mfenced separators=\"|\"><mrow><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced><mi>γ</mi><mi>t</mi></mrow><mrow><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "CXC4m", "text": "<math><mfrac><mrow><mfenced separators=\"|\"><mrow><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced><mi>γ</mi></mrow><mrow><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given,<br /><br />Uniform magnetic field <math><mfenced separators=\"|\"><mrow><mi>B</mi></mrow></mfenced><mo>=</mo><mi>γ</mi><mi>t</mi></math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/335306q.png\" style=\"width: 125px; height: 117px;\" /><br /><br />Total flux, <math><mover accent=\"true\"><mrow><msub><mrow><mi>B</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mo>→</mo></mover><mo>.</mo><mi>&nbsp;</mi><mover accent=\"true\"><mrow><msub><mrow><mi>A</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mo>→</mo></mover><mo>+</mo><mover accent=\"true\"><mrow><msub><mrow><mi>B</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mo>→</mo></mover><mo>.</mo><mover accent=\"true\"><mrow><msub><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mo>→</mo></mover></math><br /><br /><math><mo>=</mo><mi>B</mi><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><msup><mrow><mn>0</mn></mrow><mrow><mi>o</mi></mrow></msup><mo>+</mo><mi>B</mi><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><msup><mrow><mn>180</mn></mrow><mrow><mi>o</mi></mrow></msup></mrow></mrow></mrow></mrow></math><br /><br /><math><mo>=</mo><mi>B</mi><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mi>B</mi><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br /><math><mi>ϕ</mi><mo>=</mo><mi>B</mi><mo>(</mo><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>)</mo></math><br /><br /><math><mi>ϕ</mi><mo>=</mo><mi>γ</mi><mi>t</mi><mo>(</mo><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>)</mo></math><br /><br />We know that,<br /><br />Induced current (i) <math><mo>=</mo><mfrac><mrow><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi>e</mi></mrow></mfenced></mrow><mrow><mi>R</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mfrac><mrow><mi>d</mi><mi>ϕ</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mi>R</mi></mrow></mfrac></math><br /><br />From Equation (i),<br /><br /><math><mfenced separators=\"|\"><mrow><mi>i</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mfrac><mrow><mi>d</mi><mi></mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>[</mo><mi>γ</mi><mi>t</mi><mfenced separators=\"|\"><mrow><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced><mo>]</mo></mrow><mrow><mi>R</mi></mrow></mfrac></math><br /><br /><math><mfenced separators=\"|\"><mrow><mi>i</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mfenced separators=\"|\"><mrow><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced><mi>γ</mi></mrow><mrow><mi>R</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b4db24fde7810a00", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "02", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A solenoid has <math> <mrow> <mtext>2000</mtext></mrow> </math> turns wound over a length of <math> <mrow> <mtext>0</mtext><mtext>.30&nbsp;m</mtext></mrow> </math>. The area of its cross section is <math><mn>1.2</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><mi mathvariant=\"normal\">&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>2</mn></mrow></msup></math>. Around its central section, a coil of <math> <mrow> <mtext>300</mtext></mrow> </math> turns is wound. If an initial current of <math> <mrow> <mtext>2&nbsp;A</mtext></mrow> </math> in the solenoid is reversed in <math> <mrow> <mtext>0</mtext><mtext>.25&nbsp;s</mtext></mrow> </math>, then the emf induced in the coil is equal to</p>\r", "image": null}, "options": [{"id": "BEn0A", "text": "<math><mn>8.6</mn><mo>&times;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup><mi>&nbsp;</mi></math>V", "image": null, "isCorrect": false}, {"id": "tZyZU", "text": "<math><mn>4.8</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup><mi>&nbsp;</mi></math>V", "image": null, "isCorrect": true}, {"id": "KTwBu", "text": "<math><mn>1.2</mn><mo>&times;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup><mi>&nbsp;</mi></math>V", "image": null, "isCorrect": false}, {"id": "ZXJuz", "text": "<math><mn>6.0</mn><mo>&times;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup><mi>&nbsp;</mi></math>V", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow>  <mi>E</mi><mi>m</mi><mi>f</mi><mo>=</mo><mfrac>   <mrow>    <mi>M</mi><mi>d</mi><mi>i</mi></mrow>   <mrow>    <mi>d</mi><mi>t</mi></mrow>  </mfrac>  <mo>=</mo><mo>&#x00A0;</mo><mfenced>   <mrow>    <mfrac>     <mrow>      <msub>       <mi>&#x03BC;</mi>       <mn>0</mn>      </msub>      <msub>       <mi>N</mi>       <mn>1</mn>      </msub>      <msub>       <mi>N</mi>       <mn>2</mn>      </msub>      <mi>A</mi></mrow>     <mi>l</mi>    </mfrac>    </mrow>  </mfenced><mfrac>   <mrow>    <mi>d</mi><mi>i</mi></mrow>   <mrow>    <mi>d</mi><mi>t</mi></mrow>  </mfrac>  </mrow></math><br /><math><mo>=</mo><mi>&nbsp;</mi><mfrac><mrow><mn>4</mn><mi>π</mi><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>7</mn></mrow></msup><mo>×</mo><mn>2000</mn><mo>×</mo><mn>300</mn><mo>×</mo><mn>1.2</mn><mi>&nbsp;</mi><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><mfenced separators=\"|\"><mrow><mn>4</mn></mrow></mfenced></mrow><mrow><mn>0.3</mn><mo>×</mo><mn>0.25</mn></mrow></mfrac></math><br /><br /><math><mo>=</mo><mn>4.8</mn><mi>&nbsp;</mi><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></math> V", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "correct", "lastPracticed": "2024-12-20T13:04:53.948Z"}, {"_id": "6151e863b1b56aa971ab0a61", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "03", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The magnetic flux through a circuit of resistance <math> <mtext>R</mtext> </math> changes by an amount <math> <mrow> <mo>Δ</mo> <mi>ϕ</mi> </mrow> </math> in a time <math> <mrow> <mo>Δ</mo> <mtext>t</mtext> </mrow> </math>. Then the total quantity of electric charge <math> <mtext>Q</mtext> </math>, that passes through any point in the circuit during this&nbsp;<math><mrow><mo>Δ</mo> <mtext>t</mtext> </mrow> </math> time is, represented by", "image": null}, "options": [{"id": "MwZpR", "text": "<math> <mrow> <mtext>Q</mtext> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> <mfrac> <mrow> <mo>&Delta;</mo> <mi>ϕ</mi> </mrow> <mrow> <mo>&Delta;</mo> <mtext>t</mtext> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "bxCt2", "text": "<math> <mrow> <mtext>Q</mtext> <mo>=</mo> <mfrac> <mrow> <mo>Δ</mo> <mi>ϕ</mi> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "ScR0G", "text": "<math> <mrow> <mtext>Q</mtext> <mo>=</mo> <mfrac> <mrow> <mo>&Delta;</mo> <mi>ϕ</mi> </mrow> <mrow> <mo>&Delta;</mo> <mtext>t</mtext> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "ZVgxW", "text": "<math> <mrow> <mtext>Q</mtext> <mo>=</mo> <mtext>R</mtext> <mfrac> <mrow> <mo>&Delta;</mo> <mi>ϕ</mi> </mrow> <mrow> <mo>&Delta;</mo> <mtext>t</mtext> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Induced emf is given by <math> <mrow> <mi>ε</mi> <mo>=</mo> <mfrac> <mrow> <mo>Δ</mo> <mi>ϕ</mi> </mrow> <mrow> <mo>Δ</mo> <mtext>t</mtext> </mrow> </mfrac> </mrow> </math><br /><br />Current, <math> <mrow> <mtext>I</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>Q</mtext> </mrow> <mrow> <mo>Δ</mo> <mtext>t</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mo>Δ</mo> <mi>ϕ</mi> </mrow> <mrow> <mo>Δ</mo> <mtext>t</mtext> </mrow> </mfrac> <mo>×</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </math>&nbsp;&nbsp;[where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Q</mi></math> is total charge passed in time <math> <mrow> <mo>Δ</mo> <mtext>t</mtext> </mrow> </math>]<br /><br /><math> <mrow> <mo>⇒&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</mo> <mtext>Q</mtext> <mo>=</mo> <mfrac> <mrow> <mo>Δ</mo> <mi>ϕ</mi> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "correct", "lastPracticed": "2024-12-20T12:54:35.574Z"}, {"_id": "6151e863ad86ba19076bd2b3", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "32", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A conducting ring of circular cross-section with inner and outer radii&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">a</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">b</mi></math> is made out of a material of resistivity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">ρ</mi></math>. The thickness of the ring is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">h</mi></math>. It is placed coaxially in a vertical cylindrical region of a magnetic field <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo>=</mo><mi>krt</mi></math>, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">k</mi></math> is a positive constant,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi></math> is the distance from the axis and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">t</mi></math> is the time. If the current through the ring is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi><mo>=</mo><mfenced separators=\"|\"><mfrac><mi>kh</mi><mi>αp</mi></mfrac></mfenced><mi mathvariant=\"normal\">&nbsp;</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><msup><mi mathvariant=\"normal\">b</mi><mn>3</mn></msup><mo>-</mo><msup><mi mathvariant=\"normal\">a</mi><mn>3</mn></msup></mrow></mfenced></math>, then what is the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">α</mi></math>?<br />\r&nbsp;<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image20-bb8dda28-b438-4471-9824-9ca41f4e6d72.jpg\" />", "image": null}, "options": [], "correctValue": "9", "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image21-ae2ccd55-abd8-4950-9379-201dc775717f.jpg\" /><br /><br />The flux through the area of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi></math> is<br /><br /><math><mi mathvariant=\"normal\">&#981;</mi><mo>=</mo><mrow><munderover><mo stretchy=\"false\">&#8747;</mo><mrow><mn>0</mn></mrow><mrow><mi>r</mi></mrow></munderover><mrow><mi>k</mi><mi>r</mi><mi>t</mi><mn>2</mn><mi>&#960;</mi><mi>r</mi><mi>d</mi><mi>r</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>&#960;</mi><mi>k</mi><mi>t</mi><msup><mrow><mi>r</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow><mrow><mn>3</mn></mrow></mfrac><mi>&#160;</mi></mrow></mrow></math><br /><br />E.M.F. induced,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#1013;</mi><mo>=</mo><mfenced open=\"|\" close=\"|\" separators=\"|\"><mfrac><mi>d&#981;</mi><mi>dt</mi></mfrac></mfenced><mo>=</mo><mfrac><mrow><mn>2</mn><msup><mi>&#960;kr</mi><mn>3</mn></msup></mrow><mn>3</mn></mfrac></math><br /><br />Net induced current is<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi><mo>=</mo><munderover><mo>&#8747;</mo><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">b</mi></munderover><mfrac><mrow><mn>2</mn><msup><mi>&#960;r</mi><mn>3</mn></msup><mi>khdr</mi></mrow><mrow><mn>3</mn><mi mathvariant=\"normal\">&#961;</mi><mn>2</mn><mi>&#960;r</mi></mrow></mfrac><mo>=</mo><mfrac><mi>kh</mi><mrow><mn>9</mn><mi mathvariant=\"normal\">&#961;</mi></mrow></mfrac><mi mathvariant=\"normal\">&#160;</mi><mfenced separators=\"|\"><mrow><msup><mi mathvariant=\"normal\">b</mi><mn>3</mn></msup><mo>-</mo><msup><mi mathvariant=\"normal\">a</mi><mn>3</mn></msup></mrow></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#945;</mi><mo>=</mo><mn>9</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a7ec5e36a3a7925f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "29", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The magnetic field within a long, straight solenoid with a circular cross-section of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi></math> is (as shown) increasing at a rate of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">α</mi></math>.&nbsp;<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ayjpvkptboeksdywzuuybmenxiezoczojnvtuvkahpkymjgowa.png\" /><br />\r<br />\rThe rate of change of flux through a circle with radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">a</mi></math> inside the solenoid, normal to the axis of the solenoid and with centre on the solenoid axis is", "image": null}, "options": [{"id": "Ztlyj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>2</mn></msqrt><msup><mi>&#960;a</mi><mn>2</mn></msup><mi mathvariant=\"normal\">&#945;</mi></math>", "image": null, "isCorrect": false}, {"id": "uYEya", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mi>πa</mi><mn>2</mn></msup><mi mathvariant=\"normal\">α</mi></math>", "image": null, "isCorrect": false}, {"id": "L7KML", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>πa</mi><mn>2</mn></msup><mi mathvariant=\"normal\">α</mi></math>", "image": null, "isCorrect": true}, {"id": "SriRH", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>πaα</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Rate of change of flux through circle with radius <math><mi>a</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>dϕ</mi><mi mathvariant=\"normal\">m</mi></msub><mi>dt</mi></mfrac><mo>=</mo><mi mathvariant=\"normal\">A</mi><mfrac><mi>dB</mi><mi>dt</mi></mfrac><mo>=</mo><msup><mi>πa</mi><mn>2</mn></msup><mi mathvariant=\"normal\">α</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a7c23b0b6f827aa0", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "58", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An equilateral triangular loop <math><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">D</mi><mi mathvariant=\"normal\">C</mi></math> of uniform specific resistivity having some resistance is pulled with a constant velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math> out of a uniform magnetic field directed into the paper. At time <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>0</mn></math>, side <math><mi mathvariant=\"normal\">D</mi><mi mathvariant=\"normal\">C</mi></math> of the loop is at the edge of the magnetic field. The induced current <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mi>I</mi></mfenced></math> versus time <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mi>t</mi></mfenced></math> graph will be as :<br />\r<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image10-9ac8c52e-4064-408c-939f-2f1846ed8010.jpg\" style=\"height: 139px; width: 180px;\" />", "image": null}, "options": [{"id": "q4Hu7", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image11-73362336-3cf2-46e5-9b09-a3820876d808.jpg\" style=\"height: 136px; width: 120px;\" />", "image": null, "isCorrect": false}, {"id": "FXKkQ", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image12-25e8ccd9-6b80-40d3-a2fd-fde44b0f39c9.jpg\" style=\"height: 135px; width: 120px;\" />", "image": null, "isCorrect": true}, {"id": "aknSx", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image13-e917f63f-5fa9-4470-8f38-8b49ad3d7376.jpg\" style=\"height: 135px; width: 120px;\" />", "image": null, "isCorrect": false}, {"id": "FOk0Q", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image14-ac0b74b8-06a3-47b1-9bcc-cd4d40ce3655.jpg\" style=\"height: 136px; width: 120px;\" />", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Let <math><mn>2</mn><mi mathvariant=\"normal\">a</mi></math> be the side of the triangle and <math><mi mathvariant=\"normal\">b</mi></math> the length <math><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">E</mi></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∆</mo><mi>AHG</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∆</mo><mi>AEC</mi></math>&nbsp;are similar triangles.<br /><br /><math><mfrac><mrow><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">H</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">E</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">G</mi><mi mathvariant=\"normal\">H</mi></mrow><mrow><mi mathvariant=\"normal\">E</mi><mi mathvariant=\"normal\">C</mi></mrow></mfrac></math><br /><br /><math><mo>∴</mo><mi mathvariant=\"normal\">G</mi><mi mathvariant=\"normal\">H</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">H</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">E</mi></mrow></mfrac></mrow></mfenced><mi mathvariant=\"normal\">E</mi><mi mathvariant=\"normal\">C</mi></math><br /><br /><math><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">b</mi><mo>-</mo><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">t</mi></mrow><mrow><mi mathvariant=\"normal\">b</mi></mrow></mfrac><mo>.</mo><mi mathvariant=\"normal\">a</mi><mo>=</mo><mi mathvariant=\"normal\">a</mi><mo>-</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mi mathvariant=\"normal\">b</mi></mrow></mfrac></mrow></mfenced><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">t</mi></math><br /><br /><math><mo>∴</mo><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\">G</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">G</mi><mi mathvariant=\"normal\">H</mi><mo>=</mo><mn>2</mn><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi mathvariant=\"normal\">a</mi><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mi mathvariant=\"normal\">b</mi></mrow></mfrac><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">t</mi></mrow></mfenced></math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image15-79d97243-ca76-46f2-95ac-868376d0350f.jpg\" style=\"height: 142px; width: 200px;\" /><br /><br />Induced e.m.f., <math><mi mathvariant=\"normal\">e</mi><mo>=</mo><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">v</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\">G</mi></mrow></mfenced><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">v</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">a</mi><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mi mathvariant=\"normal\">b</mi></mrow></mfrac><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">t</mi></mrow></mfenced></math><br /><br /><math><mo>∴</mo></math> Induced current, <math><mi mathvariant=\"normal\">I</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">e</mi></mrow><mrow><mi mathvariant=\"normal\">R</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">v</mi></mrow><mrow><mi mathvariant=\"normal\">R</mi></mrow></mfrac><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi mathvariant=\"normal\">a</mi><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mi mathvariant=\"normal\">b</mi></mrow></mfrac><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">t</mi></mrow></mfenced></math><br /><br />or <math><mi mathvariant=\"normal\">I</mi><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">k</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">k</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">t</mi></math><br /><br />Thus, the&nbsp;<math><mi mathvariant=\"normal\">I</mi><mo>-</mo><mi mathvariant=\"normal\">t</mi></math> graph is a straight line with a negative slope and positive intercept.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639b2fea89627c2e73", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "33", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform circular loop of radius a and resistance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> is pulled at a constant velocity&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">v</mi></math> out of a region of a uniform magnetic field whose magnitude is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>. The plane of the loop and the velocity are both perpendicular to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>. Then the electrical power in the circular loop at the instant when the arc (of the circular loop) outside the region of magnetic field subtends an angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">π</mi><mn>3</mn></mfrac></math> at the centre of the loop is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-06-20_at_3.30.18_PM.jpeg\" style=\"width: 200px; height: 185px;\" />", "image": null}, "options": [{"id": "Onaxf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msup><mi mathvariant=\"normal\">B</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">a</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">v</mi><mn>2</mn></msup></mrow><mi mathvariant=\"normal\">R</mi></mfrac></math>", "image": null, "isCorrect": true}, {"id": "XMjjL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><msup><mi mathvariant=\"normal\">B</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">a</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">v</mi><mn>2</mn></msup></mrow><mi mathvariant=\"normal\">R</mi></mfrac></math>", "image": null, "isCorrect": false}, {"id": "yiDlV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msup><mi mathvariant=\"normal\">B</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">a</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">v</mi><mn>2</mn></msup></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">R</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "lChZF", "text": "none of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The induced emf in the circular loop <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi mathvariant=\"normal\">B</mi><mfenced separators=\"|\"><mi>PQ</mi></mfenced><mi mathvariant=\"normal\">v</mi><mo>=</mo><mi>Bav</mi></math><br /><br />Therefore electrical power consumed by the circular loop<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><msup><mfenced separators=\"|\"><mi>emf</mi></mfenced><mn>2</mn></msup><mi mathvariant=\"normal\">R</mi></mfrac><mo>=</mo><mfrac><msup><mfenced separators=\"|\"><mi>Bav</mi></mfenced><mn>2</mn></msup><mi mathvariant=\"normal\">R</mi></mfrac></math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-06-20_at_3.30.18_PM.jpeg\" style=\"width: 200px; height: 185px;\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86397719df622f78f5b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "65", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A conducting wire&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ab</mi></math> of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi></math>, resistance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math> and mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> starts sliding down at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>0</mn></math> down a smooth vertical, thick pair of perfectly conducting rails as shown in the figure. A uniform magnetic field&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> exist in the space in a direction perpendicular to the plane of the rails. What will be the final constant speed of wire?<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/4f03ffbb-c080-438d-9467-7947933221f9-image5.jpeg\" />", "image": null}, "options": [{"id": "BosNE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>m</mi><mi>g</mi><mi>r</mi></mrow><mrow><msup><mi>B</mi><mn>2</mn></msup><msup><mi>l</mi><mn>2</mn></msup></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "cgl4g", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>m</mi><mi>g</mi><mi>r</mi></mrow><mrow><mn>2</mn><msup><mi>B</mi><mn>2</mn></msup><msup><mi>l</mi><mn>2</mn></msup></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "Q1DBp", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>m</mi><mi>g</mi><mi>r</mi></mrow><mrow><mn>2</mn><mi>B</mi><msup><mi>l</mi><mn>2</mn></msup></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "HoRvX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>m</mi><mi>g</mi><mi>r</mi></mrow><mrow><mi>B</mi><msup><mi>l</mi><mn>2</mn></msup></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>If there are no dissipating forces then the system will oscillate but if there is some small resistance then the acceleration of the conductor is related to the net force as<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mfrac><mrow><mi mathvariant=\"italic\">d</mi><mi mathvariant=\"italic\">v</mi></mrow><mrow><mi mathvariant=\"italic\">d</mi><mi mathvariant=\"italic\">t</mi></mrow></mfrac><mo>=</mo><mi>m</mi><mi>g</mi><mo>-</mo><mi>i</mi><mi>l</mi><mi>B</mi><mo>=</mo><mi>m</mi><mi>g</mi><mo>-</mo><mfrac><mrow><msup><mi>B</mi><mn>2</mn></msup><msup><mi>l</mi><mn>2</mn></msup><mi>v</mi></mrow><mi>r</mi></mfrac></math><br />When the rod attains the steady constant speed, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi mathvariant=\"italic\">d</mi><mi mathvariant=\"italic\">v</mi></mrow><mrow><mi mathvariant=\"italic\">d</mi><mi mathvariant=\"italic\">t</mi></mrow></mfrac></math> is zero. Hence</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>0</mn></msub><mo>=</mo><mfrac><mrow><mi>m</mi><mi>g</mi><mi>r</mi></mrow><mrow><msup><mi>B</mi><mn>2</mn></msup><msup><mi>l</mi><mn>2</mn></msup></mrow></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863971fc3604604daa6", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "37", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Magnetic flux <math><mi mathvariant=\"normal\">ϕ</mi></math> linked with a stationary loop of resistance <math><mi>R</mi></math> varies with time <math><mi>t</mi></math> as&nbsp;<math><mi mathvariant=\"normal\">ϕ</mi><mo>=</mo><mi>a</mi><mi>t</mi><mo>(</mo><mi>T</mi><mo>–</mo><mi>t</mi><mo>)</mo></math>. The amount of heat generated in the loop, during the time interval <math><mi>T</mi></math>, is", "image": null}, "options": [{"id": "8su5F", "text": "<math><mfrac><mrow><mi>a</mi><mi>T</mi></mrow><mrow><mn>3</mn><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "qjQf9", "text": "<math><mfrac><mrow><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>3</mn><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "ANI89", "text": "<math><mfrac><mrow><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "Wh1XL", "text": "<math><mfrac><mrow><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>T</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow><mrow><mn>3</mn><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>|</mo><mi>E</mi><mo>|</mo><mo>=</mo><mfenced open=\"|\" close=\"|\"><mfrac><mrow><mi>d</mi><mi>&#981;</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mfenced><mo>=</mo><mo>(</mo><mi>a</mi><mi>T</mi><mo>&#8211;</mo><mn>2</mn><mi>a</mi><mi>t</mi><mo>)</mo></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>H</mi><mo>=</mo><mo>&#8747;</mo><mfrac><msup><mi>E</mi><mn>2</mn></msup><mi>R</mi></mfrac><mi>d</mi><mi>t</mi><mo>=</mo><mfrac><msup><mi>a</mi><mn>2</mn></msup><mi>R</mi></mfrac><msubsup><mo>&#8747;</mo><mn>0</mn><mi>T</mi></msubsup><msup><mfenced><mrow><mi>T</mi><mo>-</mo><mn>2</mn><mi>t</mi></mrow></mfenced><mn>2</mn></msup><mo>d</mo><mi>t</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><msup><mi>a</mi><mn>2</mn></msup><mi>R</mi></mfrac><msubsup><mo>&#8747;</mo><mn>0</mn><mi>T</mi></msubsup><mfenced><mrow><msup><mi>T</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn><msup><mi>t</mi><mn>2</mn></msup><mo>-</mo><mn>4</mn><mi>T</mi><mi>t</mi></mrow></mfenced><mo>d</mo><mi>t</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><msup><mi>a</mi><mn>2</mn></msup><mi>R</mi></mfrac><mfenced><mrow><msup><mi>T</mi><mn>2</mn></msup><msubsup><menclose notation=\"right\"><mi>t</mi></menclose><mn>0</mn><mi>T</mi></msubsup><mo>+</mo><msubsup><menclose notation=\"right\"><mfrac><mn>4</mn><mn>3</mn></mfrac><msup><mi>t</mi><mn>3</mn></msup></menclose><mn>0</mn><mi>T</mi></msubsup><mo>-</mo><msubsup><menclose notation=\"right\"><mn>2</mn><mi>T</mi><msup><mi>t</mi><mn>2</mn></msup></menclose><mn>0</mn><mi>T</mi></msubsup></mrow></mfenced><mo>=</mo><mfrac><mrow><msup><mi>a</mi><mn>2</mn></msup><msup><mi>T</mi><mn>3</mn></msup></mrow><mrow><mn>3</mn><mi>R</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638e5dcf6a93a24365", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "90", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A rectangular wire loop with length <math><mi>a</mi></math> and width <math><mi>b</mi></math> lies in the <math><mi>x</mi><mi>y</mi></math> -plane as shown. Within the loop, there is a time dependent magnetic field given by <math><mover accent=\"true\"><mrow><mi>B</mi></mrow><mo>→</mo></mover><mo>=</mo><mi>&nbsp;</mi><mi>c</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfenced separators=\"|\"><mrow><mi>x</mi><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>ω</mi><mi>t</mi></mrow></mrow></mrow></mfenced><mover accent=\"true\"><mrow><mi>i</mi></mrow><mo>^</mo></mover><mo>+</mo><mfenced separators=\"|\"><mrow><mi>y</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>ω</mi><mi>t</mi></mrow></mrow></mrow></mfenced><mover accent=\"true\"><mrow><mi>k</mi></mrow><mo>^</mo></mover></mrow></mfenced></math>.Here, <math><mi>c</mi></math> and <math><mi>ω</mi></math> are constants. The magnitude of emf induced in the loop as a function of time is<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/zqnsdabscutzpepcsbehqzkresrqxbfrztwddiibcbzjllgeeu.png\" style=\"max-width:100%; object-fit:contain\" />", "image": null}, "options": [{"id": "BnCDK", "text": "<math><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mfrac><mrow><mi>a</mi><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>c</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mi>ω</mi><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>ω</mi><mi>t</mi></mrow></mrow></mrow></mfenced></math>", "image": null, "isCorrect": true}, {"id": "HWKDo", "text": "<math><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi>a</mi><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>c</mi><mi>ω</mi><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>ω</mi><mi>t</mi></mrow></mrow></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "QqC3y", "text": "<math><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mfrac><mrow><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>b</mi><mi>c</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mi>ω</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>ω</mi><mi>t</mi></mrow></mrow></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "oEBGH", "text": "None of the options"
