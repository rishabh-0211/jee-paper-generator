/mfenced><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#969;</mi><mi>t</mi><mo>=</mo><msup><mi>tan</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced><mn>1</mn></mfenced><mo>=</mo><mfrac><mi>&#960;</mi><mn>4</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mfrac><mi>&#960;</mi><mrow><mn>4</mn><mi>&#969;</mi></mrow></mfrac><mo>=</mo><mfrac><mi>&#960;</mi><mn>4</mn></mfrac><msqrt><mi>L</mi><mi>C</mi></msqrt></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638cccd17f030658c3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "109", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the circuit shown switch <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi></math> is connected to position <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math> for a long time and then joined to the position <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>. The total heat produced in resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">R</mi><mn>1</mn></msub></math> is :<br />\r<br />\r<img alt=\"\" height=\"164\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0032945_Question.jpg\" style=\"max-width:100%; object-fit:contain\" width=\"159\" />", "image": null}, "options": [{"id": "l4McS", "text": "<math> <mrow> <mfrac> <mrow> <msup> <mtext>LE</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn> <msubsup> <mtext>R</mtext> <mn>2</mn> <mn>2</mn> </msubsup> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "62PW9", "text": "<math> <mrow> <mfrac> <mrow> <msup> <mtext>LE</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn> <msubsup> <mtext>R</mtext> <mn>1</mn> <mn>2</mn> </msubsup> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "0Fwwv", "text": "<math> <mrow> <mfrac> <mrow> <msup> <mtext>LE</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn> <msub> <mtext>R</mtext> <mn>1</mn> </msub> <msub> <mtext>R</mtext> <mn>2</mn> </msub> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "KcQS2", "text": "<math> <mrow> <mfrac> <mrow> <msup> <mtext>LE</mtext> <mn>2</mn> </msup> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>R</mtext> <mn>1</mn> </msub> <mo>+</mo> <msub> <mtext>R</mtext> <mn>2</mn> </msub> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn> <msubsup> <mtext>R</mtext> <mn>1</mn> <mn>2</mn> </msubsup> <msubsup> <mtext>R</mtext> <mn>2</mn> <mn>2</mn> </msubsup> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When the key is at position (B) for a long time; the energy stored in the inductor is :<br /><br /><math> <mrow> <msub> <mtext>U</mtext> <mtext>B</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msubsup> <mtext>Li</mtext> <mn>0</mn> <mn>2</mn> </msubsup> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>&#183;</mo> <mtext>L</mtext> <mo>&#183;</mo> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>E</mtext> </mrow> <mrow> <msub> <mtext>R</mtext> <mn>2</mn> </msub> </mrow> </mfrac> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> <mo>=</mo> <mfrac> <mrow> <msup> <mtext>LE</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn> <msubsup> <mtext>R</mtext> <mn>2</mn> <mn>2</mn> </msubsup> </mrow> </mfrac> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0032945_Ans_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 183px; height: 148px;\" /><br /><br />This whole energy will be dissipated in the form of heat when the inductor is connected to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">R</mi><mn>1</mn></msub></math> and no source is connected.<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0032945_Ans_2.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 185px; height: 122px;\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637d92962e4ed01e28", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "95", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If <math><mn>0.1</mn><mi>&nbsp;J</mi></math> of energy is stored for the flow of the current of <math><mn>0.2</mn><mi>&nbsp;</mi><mn>A</mn></math> in an inductor, then its inductance value (in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">H</mi></math>) is", "image": null}, "options": [], "correctValue": "5", "solution": {"text": "The energy stored in an inductor is given by the formula<br /><br /><math><mi>U</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>L</mi><msup><mrow><mi>i</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br />Given, <math><mi>U</mi><mo>=</mo><mn>0.1</mn><mi>&nbsp;J</mi><mo>,</mo><mi>&nbsp;</mi><mi>i</mi><mo>=</mo><mn>0.2</mn><mi>&nbsp;</mi><mn>A</mn></math><br /><br /><math><mn>0.1</mn><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>L</mi><mo>×</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>0.2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>L</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mo>×</mo><mn>0.1</mn></mrow><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mn>0.2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>0.2</mn></mrow><mrow><mn>0.2</mn><mo>×</mo><mn>0.2</mn></mrow></mfrac></math><br /><br /><math><mo>=</mo><mfrac><mrow><mn>10</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mn>5</mn><mi>&nbsp;</mi><mn>H</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634def6e0f946adf46", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "39", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "As shown in figure, the two parallel conducting rails, in a horizontal plane, are connected at one end by an inductor of inductance<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mi>L</mi></math>. A slider (metallic) of mass <em><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math></em>, is imparted a velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>0</mn></msub></math><sub>,</sub> upon the rails, as shown in figure. The period of oscillation of the conducting rod is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-06-25_at_5.18.52_PM.jpeg\" style=\"width: 240px; height: 106px;\" />", "image": null}, "options": [{"id": "EqJrY", "text": "<math><mfrac><mrow><mi>π</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mfrac><mrow><msqrt><mi>m</mi><mi>L</mi></msqrt></mrow><mrow><mi>B</mi><mi>l</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "OTeok", "text": "<math><mfrac><mrow><mn>2</mn><mi>π</mi><msqrt><mi>m</mi><mi>L</mi></msqrt></mrow><mrow><mn>3</mn><mi>B</mi><mi>l</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "4ctGy", "text": "<math><mfrac><mrow><mn>2</mn><mi>π</mi><msqrt><mi>m</mi><mi>L</mi></msqrt></mrow><mrow><mi>B</mi><mi>l</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "y9D1N", "text": "<math><mfrac><mrow><mn>3</mn><mi>π</mi><msqrt><mi>m</mi><mi>L</mi></msqrt></mrow><mrow><mn>2</mn><mi>B</mi><mi>l</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>From energy conservation (there are no dissipative forces)-</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>L</mi><msup><mi>I</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mi>m</mi><mn>2</mn></mfrac><mo>&#215;</mo><mn>2</mn><mi>v</mi><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>+</mo><mfrac><mi>L</mi><mn>2</mn></mfrac><mo>&#215;</mo><mn>2</mn><mi>I</mi><mfrac><mrow><mi>d</mi><mi>I</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mi>v</mi><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mi>I</mi><mi>L</mi><mfrac><mrow><mi>d</mi><mi>I</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math></p><p>The emf induced in an inductor is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mo>=</mo><mi>L</mi><mfrac><mrow><mi>d</mi><mi>I</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mi>B</mi><mi>l</mi><mi>v</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>L</mi><mfrac><mrow><mi>d</mi><mi>I</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mi>B</mi><mi>l</mi><mfrac><mrow><mi>d</mi><mi>x</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mi>L</mi><mi>d</mi><mi>I</mi><mo>=</mo><mi>B</mi><mi>l</mi><mi>d</mi><mi>x</mi><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mi>I</mi><mo>=</mo><mfrac><mrow><mi>B</mi><mi>l</mi></mrow><mi>L</mi></mfrac><mi>x</mi></math></p><p>The force acting on a current-carrying conductor is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mi>I</mi><mi>B</mi><mi>l</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mfrac><mrow><mi>I</mi><mi>B</mi><mi>l</mi></mrow><mi>m</mi></mfrac></math></p><p>Substituting the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi></math>&nbsp;we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mfenced><mrow><mfrac><mstyle displaystyle=\"true\"><mi>B</mi><mi>l</mi></mstyle><mstyle displaystyle=\"true\"><mi>L</mi></mstyle></mfrac><mi>x</mi></mrow></mfenced><mfrac><mrow><mi>B</mi><mi>l</mi></mrow><mi>m</mi></mfrac><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mi>a</mi><mo>=</mo><mo>-</mo><mfenced><mfrac><mstyle displaystyle=\"true\"><msup><mi>B</mi><mn>2</mn></msup><msup><mi>l</mi><mn>2</mn></msup></mstyle><mstyle displaystyle=\"true\"><mi>m</mi><mi>L</mi></mstyle></mfrac></mfenced><mi>x</mi></math></p><p>We got acceleration in the form of</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mo>-</mo><msup><mi>&#969;</mi><mn>2</mn></msup><mi>x</mi></math>&nbsp;</p><p>this implies that the motion is<strong>&nbsp;</strong>SHM, with angular frequency</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#969;</mi><mo>=</mo><msqrt><mfrac><mrow><msup><mi>B</mi><mn>2</mn></msup><msup><mi>l</mi><mn>2</mn></msup></mrow><mrow><mi>m</mi><mi>L</mi></mrow></mfrac></msqrt></math></p><p>The time period of motion is<br /><math><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>T</mi><mo>=</mo><mn>2</mn><mi>&#960;</mi><mfrac><mrow><msqrt><mi>m</mi><mi>L</mi></msqrt></mrow><mrow><mi>B</mi><mi mathvariant=\"script\">l</mi></mrow></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86308562798b29cb657", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "84", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "There are two solenoids of same length and inductance L but their diameters differ to the extent that one can just fit into the other. They are connected in three different ways in series. (1) They are connected in series but separated by large distance, (2) they are connected in series with one inside the other and senses of the turns coinciding, (3) both are connected in series with one inside the other with senses of the turns opposite as depicted in figures 1, 2 and 3 respectively. The total inductance of the solenoids in each of the case 1, 2 and 3 are respectively<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/Object6-fe2c8696-9a53-46a5-a203-f5362c4c68c9.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 260px; height: 135px;\" />", "image": null}, "options": [{"id": "56pr9", "text": "<math><mn>0</mn><mo>,</mo><mi> </mi><mn>4</mn><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>,</mo><mi> </mi><mn>2</mn><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "jvHrH", "text": "<math><mn>4</mn><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>,</mo><mi> </mi><mn>2</mn><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>,</mo><mi> </mi><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "zOcpP", "text": "<math><mn>2</mn><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>,</mo><mi> </mi><mn>0</mn><mo>,</mo><mi> </mi><mn>4</mn><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "2r3tc", "text": "<math><mn>2</mn><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>,</mo><mi> </mi><mn>4</mn><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>,</mo><mi> </mi><mn>0</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "When two solenoids of inductance <math><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub></math> are connected in series at large distance and current <math><mi>i</mi></math> is passed through them, the total flux linkage <math><msub><mrow><mi mathvariant=\"normal\">ϕ</mi></mrow><mrow><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">l</mi></mrow></msub></math>is the sum of the flux linkages <math><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>i</mi></math> and <math><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>i</mi><mo>,</mo><mi> </mi><mi>i</mi><mi>e</mi><mo>,</mo></math><br/><br/><math><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><msub><mrow><mi mathvariant=\"normal\">ϕ</mi></mrow><mrow><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">l</mi></mrow></msub><mo>=</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>i</mi><mo>+</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>i</mi></math><br/><br/>If <math><mi>L</mi></math> be the equivalent inductance of the system, then<br/><br/><math><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><msub><mrow><mi mathvariant=\"normal\">ϕ</mi></mrow><mrow><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">l</mi></mrow></msub><mo>=</mo><mi>L</mi><mi>i</mi></math> <br/><br/><math><mo>∴</mo><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi>L</mi><mi>i</mi><mo>=</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>i</mi><mo>+</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>i</mi></math><br/><br/>or        <math><mi>L</mi><mo>=</mo><mn>2</mn><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub></math><br/><br/>When solenoids are connected in series with one inside the other and senses of the turns coinciding, then there will be mutual inductance <math><mi>L</mi></math> between them. In this case the resultant induced emf in the coils is the sum of the emf <math><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\"> </mi><msub><mrow><mi>e</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi>e</mi></mrow><mrow><mn>2</mn></mrow></msub></math> in the respective coils, <math><mi>i</mi><mi>e</mi><mo>,</mo></math><br/><br/><math><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi>e</mi><mo>=</mo><msub><mrow><mi>e</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>e</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br/><br/><math><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mo>=</mo><mfenced separators=\"|\"><mrow><mo>-</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mfrac><mrow><mi>d</mi><mi>i</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>±</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mfrac><mrow><mi>d</mi><mi>i</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mrow></mfenced><mo>+</mo><mfenced separators=\"|\"><mrow><mo>-</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mfrac><mrow><mi>d</mi><mi>i</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>±</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mfrac><mrow><mi>d</mi><mi>i</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mrow></mfenced></math><br/><br/>Where (+) sign is for positive coupling and (-) sign for negative coupling.<br/><br/>But,                 <math><mi>e</mi><mo>=</mo><mo>-</mo><mi>L</mi><mo>.</mo><mfrac><mrow><mi>d</mi><mi>i</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math><br/><br/><math><mo>∴</mo><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mo>-</mo><mi>L</mi><mfrac><mrow><mi>d</mi><mi>i</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mo>-</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mfrac><mrow><mi>d</mi><mi>i</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>-</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mfrac><mrow><mi>d</mi><mi>i</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>±</mo><mn>2</mn><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mfrac><mrow><mi>d</mi><mi>i</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math><br/><br/><math><mi>i</mi><mi>e</mi><mo>,</mo><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi>L</mi><mo>=</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>+</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>+</mo><mn>2</mn><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub></math><br/><br/><math><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mo>=</mo><mn>4</mn><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub></math>                           (for positive coupling)<br/><br/>When solenoids are connected in series with one inside the other with senses of the turns opposite, then their is negative coupling.<br/><br/>So, <math><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi>L</mi><mo>=</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>+</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>-</mo><mn>2</mn><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mn>0</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "6aa3ab79aa8dc1ff6817804b", "title": "Self and Mutual Inductance", "totalQuestions": 17, "questions": [{"_id": "6151e863f1cf3cfd3b42d468", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "101", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The current&nbsp;<math><mi>i</mi> </math> in a coil varies with time as shown in the figure. The variation of induced emf with time would be<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Annotation_2019-12-30_150004.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 300px; height: 166px;\" />", "image": null}, "options": [{"id": "hPLRy", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/1-21.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 250px; height: 156px;\" />", "image": null, "isCorrect": true}, {"id": "luNu4", "text": "<img alt=\"\" src=\"https:  <mtext>T</mtext> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> <mo>≤</mo> <mtext>t</mtext> <mo>≤</mo> <mtext>T</mtext> </mrow> </math>,<br /><br />i is zero <math> <mrow> <mo>∴&nbsp;&nbsp;</mo> <mfrac> <mrow> <mtext>di</mtext> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> <mo>=</mo> <mn>0</mn> </mrow> </math><br /><br /><math> <mrow> <mo>⇒&nbsp;&nbsp;</mo> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>e</mtext> <mo>=</mo> <mn>0</mn> </mrow> </math>&nbsp;&nbsp;For&nbsp;&nbsp; <math> <mrow> <mfrac> <mrow> <mn>3</mn> <mtext>T</mtext> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> <mo>≤</mo> <mtext>t</mtext> <mo>≤</mo> <mtext>T</mtext> </mrow> </math><br /><br />From this analysis, the variation of induced emf with time as shown in the figure below.<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/1-221.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 250px; height: 156px;\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e6838bb22e3fe70a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "89", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two coaxial solenoids are made by winding thin insulated wire over a pipe of cross-sectional area <math> <mrow> <mtext mathvariant=\"italic\">A</mtext> <mo>=</mo> <mtext>10&nbsp;</mtext> <msup> <mtext>cm</mtext> <mn>2</mn> </msup> </mrow> </math> and length = <math> <mrow> <mtext>&nbsp;20&nbsp;</mtext> <mtext>cm</mtext></mrow></math>. If one of the solenoids has <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn></math> turns and the other <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>400</mn></math> turns, their mutual inductance is&nbsp;<math><mrow><mfenced close=\")\" open=\"(\" separators=\",\"><mrow><msub><mi>μ</mi> <mn>0</mn> </msub> <mo>=</mo> <mn>4</mn> <mi>π</mi> <mo>×</mo> <msup> <mtext>10</mtext> <mrow> <mo>-</mo> <mn>7</mn> </mrow> </msup> <mtext>&nbsp;T&nbsp;</mtext> <mtext>m</mtext> <msup> <mtext>A</mtext> <mn>-1</mn> </msup> </mrow> </mfenced> </mrow> </math>", "image": null}, "options": [{"id": "aeuQ0", "text": "<math> <mrow> <mtext>2.4</mtext> <mi>π</mi> <mo>×</mo> <msup> <mtext>10</mtext> <mrow> <mo>-</mo> <mn>4</mn> </mrow> </msup> <mtext>&nbsp;H</mtext> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "VhNee", "text": "<math> <mrow> <mtext>2.4</mtext> <mi>&pi;</mi> <mo>&times;</mo> <msup> <mtext>10</mtext> <mrow> <mo>-</mo> <mn>5</mn> </mrow> </msup> <mtext>&nbsp;H</mtext> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "tI8v9", "text": "<math> <mrow> <mtext>4.8</mtext> <mi>&pi;</mi> <mo>&times;</mo> <msup> <mtext>10</mtext> <mrow> <mo>-</mo> <mn>4</mn> </mrow> </msup> <mtext>&nbsp;H</mtext> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "TgELF", "text": "<math> <mrow> <mtext>4.8</mtext> <mi>&pi;</mi> <mo>&times;</mo> <msup> <mtext>10</mtext> <mrow> <mo>-</mo> <mn>5</mn> </mrow> </msup> <mtext>&nbsp;H</mtext> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Mutual inductance<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/MI.PNG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 320px; height: 128px;\" /><br /><br /><!-- MathType@Translator@5@5@MathML2 (namespace attr).tdl@MathML 2.0 (namespace attr)@ --> <math> <mrow> <mi>M</mi><mo>=</mo><mfrac> <mrow> <mtext>flux</mtext><mtext> </mtext><mtext>in</mtext><mtext> </mtext><mrow><mo>(</mo> <mn>2</mn> <mo>)</mo></mrow></mrow> <mrow> <mtext>current</mtext><mtext> </mtext><mtext>in</mtext><mtext> </mtext><mrow><mo>(</mo> <mn>1</mn> <mo>)</mo></mrow></mrow> </mfrac> </mrow> </math> <!-- MathType@End@5@5@ --><br /><br /><!-- MathType@Translator@5@5@MathML2 (namespace attr).tdl@MathML 2.0 (namespace attr)@ --> <math> <mrow> <mo>=</mo><mfrac> <mrow> <msub> <mi>ϕ</mi> <mn>2</mn> </msub> </mrow> <mrow> <msub> <mi>i</mi> <mn>1</mn> </msub> </mrow> </mfrac> </mrow> </math> <!-- MathType@End@5@5@ --><br /><br /><!-- MathType@Translator@5@5@MathML2 (namespace attr).tdl@MathML 2.0 (namespace attr)@ --> <math> <mrow> <mo>=</mo><mfrac> <mrow> <msub> <mi>B</mi> <mn>1</mn> </msub> <mo>.</mo><msub> <mi>A</mi> <mn>2</mn> </msub> <msub> <mi>N</mi> <mn>2</mn> </msub> </mrow> <mrow> <msub> <mi>i</mi> <mn>1</mn> </msub> </mrow> </mfrac> </mrow> </math> <!-- MathType@End@5@5@ --><br /><br /><!-- MathType@Translator@5@5@MathML2 (namespace attr).tdl@MathML 2.0 (namespace attr)@ --> <math> <mrow> <mo>=</mo><mfrac> <mrow> <msub> <mi>μ</mi> <mn>0</mn> </msub> <msub> <mi>N</mi> <mn>1</mn> </msub> <msub> <mi>i</mi> <mn>1</mn> </msub> </mrow> <mi>l</mi> </mfrac> <mo>×</mo><mfrac> <mrow> <msub> <mi>A</mi> <mn>2</mn> </msub> <msub> <mi>N</mi> <mn>2</mn> </msub> </mrow> <mrow> <msub> <mi>i</mi> <mn>1</mn> </msub> </mrow> </mfrac> </mrow> </math> <!-- MathType@End@5@5@ --><br /><br /><!-- MathType@Translator@5@5@MathML2 (namespace attr).tdl@MathML 2.0 (namespace attr)@ --> <math> <mrow> <mo>=</mo><mfrac> <mrow> <msub> <mi>μ</mi> <mn>0</mn> </msub> <mtext> </mtext><msub> <mi>N</mi> <mn>1</mn> </msub> <mo>.</mo><msub> <mi>N</mi> <mn>2</mn> </msub> <mo>.</mo><mi>A</mi></mrow> <mi>l</mi> </mfrac> </mrow> </math> <!-- MathType@End@5@5@ --><br /><br /><math><msub><mrow><mi>A</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mi>A</mi></math><br /><br /><math> <mrow> <mtext mathvariant=\"italic\">A</mtext> <mo>=</mo> <mi>π</mi> <msubsup> <mtext mathvariant=\"italic\">r</mtext> <mn>1</mn> <mn>2</mn> </msubsup> <mo>=</mo> <mtext>10</mtext> <msup> <mtext>&nbsp;cm</mtext> <mn>2</mn> </msup> </mrow> </math>,&nbsp;<math> <mrow> <mtext mathvariant=\"italic\">l</mtext> <mo>&nbsp;=&nbsp;</mo> <mtext>20&nbsp;</mtext> <mtext>cm</mtext> </mrow> </math> ,&nbsp;<math> <mrow> <msub> <mtext mathvariant=\"italic\">N</mtext> <mn>1</mn> </msub> <mo>=</mo> <mtext>300</mtext> </mrow> </math>,&nbsp;<math> <mrow> <msub> <mtext mathvariant=\"italic\">N</mtext> <mn>2</mn> </msub> <mo>=</mo> <mtext>400</mtext> </mrow> </math>.<br /><br /><math> <mrow> <mtext mathvariant=\"italic\">M</mtext> <mo>=</mo> <mfrac> <mrow> <msub> <mi>μ</mi> <mn>0</mn> </msub> <msub> <mtext mathvariant=\"italic\">N</mtext> <mn>1</mn> </msub> <msub> <mtext mathvariant=\"italic\">N</mtext> <mn>2</mn> </msub> <mtext mathvariant=\"italic\">A</mtext> </mrow> <mrow> <mtext mathvariant=\"italic\">l</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>4</mn> <mi>π</mi> <mo>×</mo> <msup> <mtext>10</mtext> <mrow> <mo>-</mo> <mn>7</mn> </mrow> </msup> <mo>×</mo> <mtext>300</mtext> <mo>×</mo> <mtext>400</mtext> <mo>×</mo> <mtext>10</mtext> <mo>×</mo> <msup> <mtext>10</mtext> <mrow> <mo>-</mo> <mn>4</mn> </mrow> </msup> </mrow> <mrow> <mtext>0.20</mtext> </mrow> </mfrac> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mtext>2.4</mtext> <mi>π</mi> <mo>×</mo> <msup> <mtext>10</mtext> <mrow> <mo>-</mo> <mn>4</mn> </mrow> </msup> <mtext>&nbsp;H</mtext> </mrow> </math>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863de2b392d6468ed0d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "48", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The current <math><mi mathvariant=\"normal\">I</mi></math> in an inductance coil varies with time according to the graph given in the figure.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image12-02e5c8d4-0616-4230-b7dd-3aa521ccf23c.jpg\" style=\"height: 140px; width: 160px;\" /><br />\r<br />\rWhich one of the following graphs gives the variation of voltage with time across the inductor?", "image": null}, "options": [{"id": "Tyw5a", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image13-35b1dbe0-fd35-4908-9098-9cee2950ece7.jpg\" style=\"height: 126px; width: 150px;\" />", "image": null, "isCorrect": false}, {"id": "WE7x9", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image14-e8840fc1-4975-4089-83b1-d2de5bde761c.jpg\" style=\"height: 175px; width: 160px;\" />", "image": null, "isCorrect": false}, {"id": "KZtZB", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image15-3f34bade-20a5-4b38-8c5b-021d30f20fe1.jpg\" style=\"height: 158px; width: 160px;\" />", "image": null, "isCorrect": true}, {"id": "R72hv", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image16-55490ac8-8098-4392-b0a4-6af8e71ed731.jpg\" style=\"height: 134px; width: 160px;\" />", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The voltage across an inductor is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi><mo>=</mo><mo>-</mo><mi>L</mi><mfrac><mrow><mi>d</mi><mi>i</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math></p><p>So the voltage across the inductor will always be opposite to the rate of change of current.</p><p>When&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>i</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>&#62;</mo><mn>0</mn></math>&nbsp;then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi><mo>&#60;</mo><mn>0</mn></math>&nbsp;and vice versa</p><p>Also, the magnitude of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi></math>&nbsp;is proportional to the magnitude of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>i</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math>.</p><p>When&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>i</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math>decreases,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi></math>&nbsp;also decreases</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863dc407f9c0195d5d4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "24", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A superconducting loop of radius <math><mi mathvariant=\"normal\">R</mi></math> has self-inductance <math><mi mathvariant=\"normal\">L</mi></math>. A uniform and constant magnetic field <math><mi mathvariant=\"normal\">B</mi></math> is applied perpendicular to the plane of the loop. Initially current in this loop is zero. The loop is rotated by <math><mn>180</mn><mo>°</mo></math>. The current in the loop after the rotation is", "image": null}, "options": [{"id": "4HuLk", "text": "zero", "image": null, "isCorrect": false}, {"id": "keEq1", "text": "<math><mfrac><mrow><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">π</mi><msup><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi mathvariant=\"normal\">L</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "iZqd0", "text": "<math><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">π</mi><msup><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi mathvariant=\"normal\">L</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "DYlxw", "text": "<math><mfrac><mrow><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">π</mi><msup><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">L</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Initially, the current was zero, so self-induced flux was also zero. Now when we rotate the loop, the change in flux is<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Δ</mi><mi mathvariant=\"normal\">ϕ</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">π</mi><msup><mi mathvariant=\"normal\">R</mi><mn>2</mn></msup><mo>×</mo><mi mathvariant=\"normal\">B</mi></math><br /><br />Finally, to maintain the same zero flux, the current in the superconducting loop will be such that the flux due to induced current will negative of the flux due to external field<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">L</mi><mo>×</mo><mi mathvariant=\"normal\">i</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">π</mi><msup><mi mathvariant=\"normal\">R</mi><mn>2</mn></msup><mo>×</mo><mi mathvariant=\"normal\">B</mi></math>.<br /><br /><math><mi mathvariant=\"normal\">i</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">π</mi><msup><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>×</mo><mi mathvariant=\"normal\">B</mi></mrow><mrow><mi mathvariant=\"normal\">L</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d58e068e2c0a8e3f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "61", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A superconducting loop of the radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> has self-inductance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math>. A uniform and the constant magnetic field <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> is applied perpendicular to the plane of the loop. Initially current in this loop is zero. The loop is rotated by <math><mn>180</mn><mo>°</mo></math>. The current in the loop after the rotation is", "image": null}, "options": [{"id": "R3zIr", "text": "zero", "image": null, "isCorrect": false}, {"id": "uGjmM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>B</mi><mi mathvariant=\"normal\">&#960;</mi><msup><mi>R</mi><mn>2</mn></msup></mrow><mi>L</mi></mfrac></math>", "image": null, "isCorrect": false}, {"id": "7sbbc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mi>B</mi><mi mathvariant=\"normal\">&#960;</mi><msup><mi>R</mi><mn>2</mn></msup></mrow><mi>L</mi></mfrac></math>", "image": null, "isCorrect": true}, {"id": "XoEtU", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>B</mi><mi mathvariant=\"normal\">&#960;</mi><msup><mi>R</mi><mn>2</mn></msup></mrow><mrow><mn>2</mn><mi>L</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Initially, the current was zero, so self-induced flux was also zero. Now when we rotate the loop, the change in flux is<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Δ</mi><mi mathvariant=\"normal\">ϕ</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">π</mi><msup><mi mathvariant=\"normal\">R</mi><mn>2</mn></msup><mo>×</mo><mi mathvariant=\"normal\">B</mi></math><br /><br />Finally, to maintain the same zero flux, the current in the superconducting loop will be such that the flux due to induced current will negative of the flux due to external field<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">L</mi><mo>×</mo><mi mathvariant=\"normal\">i</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">π</mi><msup><mi mathvariant=\"normal\">R</mi><mn>2</mn></msup><mo>×</mo><mi mathvariant=\"normal\">B</mi></math>.<br /><br /><math><mi mathvariant=\"normal\">i</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">π</mi><msup><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>×</mo><mi mathvariant=\"normal\">B</mi></mrow><mrow><mi mathvariant=\"normal\">L</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c3a2b73de0a59317", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "92", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two coils have a mutual inductance <math><mn>0.005</mn><mi>&nbsp;</mi><mn>H</mn><mo>.</mo></math> The current changes in the first coil according to equation <math><mi>I</mi><mo>=</mo><msub><mrow><mi>I</mi></mrow><mrow><mn>0</mn></mrow></msub><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mi>ω</mi><mi>t</mi></mrow></mfenced></mrow></mrow><mo>,</mo></math> where <math><msub><mrow><mi>I</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mn>10&nbsp;</mn><mn>A</mn></math> and <math><mi>ω</mi><mo>=</mo><mn>100</mn><mi>π</mi><mi>&nbsp;</mi><mi>rad</mi><mi>&nbsp;</mi><msup><mrow><mn>s</mn></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>.</mo></math> The maximum value of emf in the second coil is", "image": null}, "options": [{"id": "V5Aa6", "text": "<math><mn>2</mn><mi>π</mi></math>", "image": null, "isCorrect": false}, {"id": "BP8bd", "text": "<math><mn>5</mn><mi>π</mi></math>", "image": null, "isCorrect": true}, {"id": "JB7pI", "text": "<math><mi>π</mi></math>", "image": null, "isCorrect": false}, {"id": "yjvbG", "text": "<math><mn>4</mn><mi>π</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "emf, induced in second coil <math><mi>e</mi><mo>=</mo><mi>M</mi><mfrac><mrow><mi>d</mi><mi>I</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>e</mi><mo>=</mo><mi>M</mi><mfrac><mrow><mi>d</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mfenced separators=\"|\"><mrow><msub><mrow><mi>I</mi></mrow><mrow><mn>0</mn></mrow></msub><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>ω</mi><mi>t</mi></mrow></mrow></mrow></mfenced><mo>=</mo><mi>M</mi><msub><mrow><mi>I</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>ω</mi><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mi>ω</mi><mi>t</mi></mrow></mfenced></mrow></mrow></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>e</mi><mo>=</mo><mn>0.005</mn><mo>×</mo><mn>10</mn><mo>×</mo><mn>100</mn><mi>π</mi><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>ω</mi><mi>t</mi></mrow></mrow></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>e</mi><mo>=</mo><mn>5</mn><mi>π</mi><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>ω</mi><mi>t</mi></mrow></mrow><mo>,</mo><mi>&nbsp;</mi><msub><mrow><mi>e</mi></mrow><mrow><mi>m</mi><mi>a</mi><mi>x</mi></mrow></msub><mo>=</mo><mn>5</mn><mi>π</mi></math><br /><br />(emf is maximum for <math><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>ω</mi><mi>t</mi></mrow></mrow><mo>=</mo><mn>1</mn></math>)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b955ade75bcfd956", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "51", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A fully charged capacitor&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math> with initial charge <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Q</mi><mn>0</mn></msub></math> is connected to an ideal inductor of self-inductance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math> at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>0</mn></math>. The time at which energy is stored equally between the electric and the magnetic fields is", "image": null}, "options": [{"id": "rgYQF", "text": "<math><mfrac><mrow><mi>π</mi></mrow><mrow><mn>4</mn></mrow></mfrac><msqrt><mi>L</mi><mi>C</mi></msqrt></math>", "image": null, "isCorrect": true}, {"id": "JuG08", "text": "<math><mn>2</mn><mi>π</mi><msqrt><mi>L</mi><mi>C</mi></msqrt></math>", "image": null, "isCorrect": false}, {"id": "Qsidx", "text": "<math><msqrt><mi>L</mi><mi>C</mi></msqrt></math>", "image": null, "isCorrect": false}, {"id": "Q0sbP", "text": "<math><mi>π</mi><msqrt><mi>L</mi><mi>C</mi></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The charge on the capacitor at any instant of time is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>=</mo><msub><mi>Q</mi><mn>0</mn></msub><mi>cos</mi><mfenced><mrow><mi>&#969;</mi><mi>t</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>i</mi><mo>=</mo><mfrac><mrow><mi>d</mi><mi>Q</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mi>&#969;</mi><msub><mi>Q</mi><mn>0</mn></msub><mi>sin</mi><mfenced><mrow><mi>&#969;</mi><mi>t</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>L</mi><msup><mi>i</mi><mn>2</mn></msup><mo>=</mo><mfrac><msup><mi>Q</mi><mn>2</mn></msup><mrow><mn>2</mn><mi>C</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mrow><mo>&#8658;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>L</mi><mi mathvariant=\"normal\">&#160;</mi><mfenced open=\"[\" close=\"]\"><mrow><mi>&#969;</mi><msub><mi>Q</mi><mn>0</mn></msub><mi>sin</mi><mfenced><mrow><mi>&#969;</mi><mi>t</mi></mrow></mfenced></mrow></mfenced></mrow><mn>2</mn></msup><mo>=</mo><mfrac><msup><mfenced open=\"[\" close=\"]\"><mrow><msub><mi>Q</mi><mn>0</mn></msub><mi>cos</mi><mfenced><mrow><mi>&#969;</mi><mi>t</mi></mrow></mfenced></mrow></mfenced><mn>2</mn></msup><mrow><mn>2</mn><mi>C</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#969;</mi><mo>=</mo><mfrac><mn>1</mn><msqrt><mi>L</mi><mi>C</mi></msqrt></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>tan</mi><mfenced><mrow><mi>&#969;</mi><mi>t</mi></mrow></mfenced><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#969;</mi><mi>t</mi><mo>=</mo><msup><mi>tan</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced><mn>1</mn></mfenced><mo>=</mo><mfrac><mi>&#960;</mi><mn>4</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mfrac><mi>&#960;</mi><mrow><mn>4</mn><mi>&#969;</mi></mrow></mfrac><mo>=</mo><mfrac><mi>&#960;</mi><mn>4</mn></mfrac><msqrt><mi>L</mi><mi>C</mi></msqrt></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b4db24fde7810a00", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "02", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A solenoid has <math> <mrow> <mtext>2000</mtext></mrow> </math> turns wound over a length of <math> <mrow> <mtext>0</mtext><mtext>.30&nbsp;m</mtext></mrow> </math>. The area of its cross section is <math><mn>1.2</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><mi mathvariant=\"normal\">&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>2</mn></mrow></msup></math>. Around its central section, a coil of <math> <mrow> <mtext>300</mtext></mrow> </math> turns is wound. If an initial current of <math> <mrow> <mtext>2&nbsp;A</mtext></mrow> </math> in the solenoid is reversed in <math> <mrow> <mtext>0</mtext><mtext>.25&nbsp;s</mtext></mrow> </math>, then the emf induced in the coil is equal to</p>\r", "image": null}, "options": [{"id": "BEn0A", "text": "<math><mn>8.6</mn><mo>&times;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup><mi>&nbsp;</mi></math>V", "image": null, "isCorrect": false}, {"id": "tZyZU", "text": "<math><mn>4.8</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup><mi>&nbsp;</mi></math>V", "image": null, "isCorrect": true}, {"id": "KTwBu", "text": "<math><mn>1.2</mn><mo>&times;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup><mi>&nbsp;</mi></math>V", "image": null, "isCorrect": false}, {"id": "ZXJuz", "text": "<math><mn>6.0</mn><mo>&times;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup><mi>&nbsp;</mi></math>V", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow>  <mi>E</mi><mi>m</mi><mi>f</mi><mo>=</mo><mfrac>   <mrow>    <mi>M</mi><mi>d</mi><mi>i</mi></mrow>   <mrow>    <mi>d</mi><mi>t</mi></mrow>  </mfrac>  <mo>=</mo><mo>&#x00A0;</mo><mfenced>   <mrow>    <mfrac>     <mrow>      <msub>       <mi>&#x03BC;</mi>       <mn>0</mn>      </msub>      <msub>       <mi>N</mi>       <mn>1</mn>      </msub>      <msub>       <mi>N</mi>       <mn>2</mn>      </msub>      <mi>A</mi></mrow>     <mi>l</mi>    </mfrac>    </mrow>  </mfenced><mfrac>   <mrow>    <mi>d</mi><mi>i</mi></mrow>   <mrow>    <mi>d</mi><mi>t</mi></mrow>  </mfrac>  </mrow></math><br /><math><mo>=</mo><mi>&nbsp;</mi><mfrac><mrow><mn>4</mn><mi>π</mi><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>7</mn></mrow></msup><mo>×</mo><mn>2000</mn><mo>×</mo><mn>300</mn><mo>×</mo><mn>1.2</mn><mi>&nbsp;</mi><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><mfenced separators=\"|\"><mrow><mn>4</mn></mrow></mfenced></mrow><mrow><mn>0.3</mn><mo>×</mo><mn>0.25</mn></mrow></mfrac></math><br /><br /><math><mo>=</mo><mn>4.8</mn><mi>&nbsp;</mi><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></math> V", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "correct", "lastPracticed": "2024-12-20T13:04:53.948Z"}, {"_id": "6151e863a307938f403f2376", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "27", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniformly wound solenoidal coil of self-inductance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1.8</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">H</mi></math>&nbsp;and resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math> is broken up into two identical coils. These identical coils are then connected in parallel across a <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> battery of negligible resistance. The time constant of the circuit is", "image": null}, "options": [{"id": "7z2sw", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi mathvariant=\"normal\">&nbsp;</mi><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": true}, {"id": "xoCn1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1.5</mn><mi mathvariant=\"normal\">&#xA0;</mi><mo>&#xD7;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>&#xA0;</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "WINzN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0.75</mn><mi mathvariant=\"normal\">&#xA0;</mi><mo>&#xD7;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>&#xA0;</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "K7svm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mi mathvariant=\"normal\">&#xA0;</mi><mo>&#xD7;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>&#xA0;</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msub><mi mathvariant=\"normal\">L</mi><mi mathvariant=\"normal\">p</mi></msub></mfrac><mo>=</mo><mfrac><mn>1</mn><mi mathvariant=\"normal\">L</mi></mfrac><mo>+</mo><mfrac><mn>1</mn><mi mathvariant=\"normal\">L</mi></mfrac><mo>=</mo><mfrac><mn>2</mn><mi mathvariant=\"normal\">L</mi></mfrac><mo>&#160;&#160;</mo><mo>&#160;</mo><mo>&#160;&#160;</mo><mo>&#8658;</mo><msub><mi mathvariant=\"normal\">L</mi><mi mathvariant=\"normal\">P</mi></msub><mo>=</mo><mfrac><mi mathvariant=\"normal\">L</mi><mn>2</mn></mfrac><mi mathvariant=\"normal\">&#160;</mi></math><br /><br />Where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">L</mi></math> is inductance of each part,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mfrac><mrow><mtext>1.8</mtext><mi mathvariant=\"normal\">&#160;</mi><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup></mrow><mn>2</mn></mfrac><mo>=</mo><mtext>0.9</mtext><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">H</mi></math>&nbsp;<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi mathvariant=\"normal\">&#160;</mi><msub><mi mathvariant=\"normal\">L</mi><mi mathvariant=\"normal\">P</mi></msub><mo>=</mo><mfrac><mi mathvariant=\"normal\">L</mi><mn>2</mn></mfrac><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mfrac><mrow><mtext>0.9</mtext><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup></mrow><mn>2</mn></mfrac><mo>=</mo><mtext>0.45</mtext><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">H</mi></math><br /><br />Resistance of each part, <math xmlns=\"http://www.w3.org/1998/Math/MathML\ p;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math> has no current and the current in the coil&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math> increases at the rate <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>.</mo><mn>0</mn></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>, the emf in the coil <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>25</mn><mo>.</mo><mn>0</mn><mo>&nbsp;</mo><mi>mV</mi></math>. When coil&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math> has a current of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>.</mo><mn>6</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math>, the flux linkage in coil&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>&nbsp;(in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>mWb</mi></math>) is&nbsp;", "image": null}, "options": [], "correctValue": "6", "solution": {"text": "As <math><mi>e</mi><mo>=</mo><mi>M</mi><mfrac><mrow><mi>d</mi><mi>i</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>M</mi><mo>=</mo><mfrac><mrow><mi>e</mi></mrow><mrow><mi>d</mi><mi>i</mi><mo>/</mo><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>25</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></mrow><mrow><mn>15.0</mn></mrow></mfrac><mo>=</mo><mn>1.67</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><mi>H</mi></math><br /><br />As <math><mi>ϕ</mi><mi>&nbsp;</mi><mo>=</mo><mi>M</mi><mi>i</mi></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>ϕ</mi><mo>=</mo><mn>1.67</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>×</mo><mn>3.6</mn><mo>=</mo><mn>6</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></math> Wb<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mn>6</mn> <mo>mWb</mo> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637d92962e4ed01e28", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "95", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If <math><mn>0.1</mn><mi>&nbsp;J</mi></math> of energy is stored for the flow of the current of <math><mn>0.2</mn><mi>&nbsp;</mi><mn>A</mn></math> in an inductor, then its inductance value (in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">H</mi></math>) is", "image": null}, "options": [], "correctValue": "5", "solution": {"text": "The energy stored in an inductor is given by the formula<br /><br /><math><mi>U</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>L</mi><msup><mrow><mi>i</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br />Given, <math><mi>U</mi><mo>=</mo><mn>0.1</mn><mi>&nbsp;J</mi><mo>,</mo><mi>&nbsp;</mi><mi>i</mi><mo>=</mo><mn>0.2</mn><mi>&nbsp;</mi><mn>A</mn></math><br /><br /><math><mn>0.1</mn><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>L</mi><mo>×</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>0.2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>L</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mo>×</mo><mn>0.1</mn></mrow><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mn>0.2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>0.2</mn></mrow><mrow><mn>0.2</mn><mo>×</mo><mn>0.2</mn></mrow></mfrac></math><br /><br /><math><mo>=</mo><mfrac><mrow><mn>10</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mn>5</mn><mi>&nbsp;</mi><mn>H</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636887b11f50b32c38", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "60", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A conducting loop which is in the shape of a right-angled isosceles triangle of height <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi>cm</mi></math> is kept such that the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>90</mn><mo>°</mo></math> vertex is very close to an infinitely long conducting wire (see the figure). The wire is electrically insulated from the loop. The hypotenuse of the triangle is parallel to the wire. The current in the triangular loop is in a counterclockwise direction and increased at a constant rate of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">&nbsp;</mi><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>.</mo></math>&nbsp;The emf induced in the wire is<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Phy_7.jpg\" style=\"width: 238px; height: 66px;\" />", "image": null}, "options": [{"id": "cnNXV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn></mn><msub><mi>&#x3BC;</ ><mo>&lt;</mo><mi>b</mi></mtd></mtr><mtr><mtd><msub><mrow><mi>μ</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">t</mi><mo>;</mo><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi><mi>&nbsp;</mi><mi>b</mi><mo>&lt;</mo><mi>r</mi><mo>&lt;</mo><mi>a</mi></mtd></mtr></mtable></mrow></mfenced></math><br />\rThe self-inductance of the solenoid is", "image": null}, "options": [{"id": "IDih2", "text": "<math><mrow><mrow><mi>π</mi><msup><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mi>l</mi><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><msub><mrow><mi>μ</mi></mrow><mrow><mn>1</mn></mrow></msub><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msub><mrow><mi>μ</mi></mrow><mrow><mn>2</mn></mrow></msub><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "G0ld4", "text": "<math><mrow><mrow><mi>π</mi><msup><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mi>l</mi><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><msub><mrow><mi>μ</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>μ</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "D2eAL", "text": "<math><mrow><mrow><mi>π</mi><msup><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mi>l</mi><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><msub><mrow><mi>μ</mi></mrow><mrow><mn>1</mn></mrow></msub><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msub><mrow><mi>μ</mi></mrow><mrow mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mi>π</mi><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced></mrow></mfenced></mrow><mrow><mi>b</mi><mo>&lt;</mo><mi>r</mi><mo>&lt;</mo><mi>a</mi></mrow></msub></math><br /><br /><math><mo>=</mo><mi>π</mi><msup><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>l</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><msub><mrow><mi>μ</mi></mrow><mrow><mn>1</mn></mrow></msub><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msub><mrow><mi>μ</mi></mrow><mrow><mn>2</mn></mrow></msub><mfenced separators=\"|\"><mrow><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced></mrow></mfenced></math><br /><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/wavrwrnrtnhdizzadktrodakbtanfoxshqmwyukqtrrtwdanlh.png\" style=\"max-width:100%; object-fit:contain\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633ab16ee8fc6eeb42", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "01", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A coil of inductive reactance <math> <mrow> <mn>3</mn> <mn>1</mn> <mi>&nbsp;Ω</mi> </mrow> </math>&nbsp;has a resistance of <math> <mrow> <mn>8</mn> <mi>&nbsp;Ω</mi> </mrow> </math>.&nbsp;It is placed in series with a condenser of capacitive reactance <math> <mrow> <mn>2</mn> <mn>5</mn> <mi>&nbsp;Ω</mi> </mrow> </math>. The combination is connected to an ac source of <math> <mrow> <mtext>110</mtext><mtext> </mtext><mtext>V</mtext></mrow> </math>. The power factor of t
