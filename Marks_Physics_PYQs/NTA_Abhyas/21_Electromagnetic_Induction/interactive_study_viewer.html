mrow><mi mathvariant=\"normal\">E</mi><mi mathvariant=\"normal\">C</mi></mrow></mfrac></math><br /><br /><math><mo>∴</mo><mi mathvariant=\"normal\">G</mi><mi mathvariant=\"normal\">H</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">H</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">E</mi></mrow></mfrac></mrow></mfenced><mi mathvariant=\"normal\">E</mi><mi mathvariant=\"normal\">C</mi></math><br /><br /><math><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">b</mi><mo>-</mo><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">t</mi></mrow><mrow><mi mathvariant=\"normal\">b</mi></mrow></mfrac><mo>.</mo><mi mathvariant=\"normal\">a</mi><mo>=</mo><mi mathvariant=\"normal\">a</mi><mo>-</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mi mathvariant=\"normal\">b</mi></mrow></mfrac></mrow></mfenced><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">t</mi></math><br /><br /><math><mo>∴</mo><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\">G</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">G</mi><mi mathvariant=\"normal\">H</mi><mo>=</mo><mn>2</mn><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi mathvariant=\"normal\">a</mi><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mi mathvariant=\"normal\">b</mi></mrow></mfrac><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">t</mi></mrow></mfenced></math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image15-79d97243-ca76-46f2-95ac-868376d0350f.jpg\" style=\"height: 142px; width: 200px;\" /><br /><br />Induced e.m.f., <math><mi mathvariant=\"normal\">e</mi><mo>=</mo><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">v</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\">G</mi></mrow></mfenced><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">v</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">a</mi><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mi mathvariant=\"normal\">b</mi></mrow></mfrac><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">t</mi></mrow></mfenced></math><br /><br /><math><mo>∴</mo></math> Induced current, <math><mi mathvariant=\"normal\">I</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">e</mi></mrow><mrow><mi mathvariant=\"normal\">R</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">v</mi></mrow><mrow><mi mathvariant=\"normal\">R</mi></mrow></mfrac><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi mathvariant=\"normal\">a</mi><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mi mathvariant=\"normal\">b</mi></mrow></mfrac><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">t</mi></mrow></mfenced></math><br /><br />or <math><mi mathvariant=\"normal\">I</mi><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">k</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">k</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">t</mi></math><br /><br />Thus, the&nbsp;<math><mi mathvariant=\"normal\">I</mi><mo>-</mo><mi mathvariant=\"normal\">t</mi></math> graph is a straight line with a negative slope and positive intercept.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639b2fea89627c2e73", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "33", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform circular loop of radius a and resistance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> is pulled at a constant velocity&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">v</mi></math> out of a region of a uniform magnetic field whose magnitude is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>. The plane of the loop and the velocity are both perpendicular to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>. Then the electrical power in the circular loop at the instant when the arc (of the circular loop) outside the region of magnetic field subtends an angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">π</mi><mn>3</mn></mfrac></math> at the centre of the loop is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-06-20_at_3.30.18_PM.jpeg\" style=\"width: 200px; height: 185px;\" />", "image": null}, "options": [{"id": "Onaxf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msup><mi mathvariant=\"normal\">B</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">a</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">v</mi><mn>2</mn></msup></mrow><mi mathvariant=\"normal\">R</mi></mfrac></math>", "image": null, "isCorrect": true}, {"id": "XMjjL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><msup><mi mathvariant=\"normal\">B</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">a</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">v</mi><mn>2</mn></msup></mrow><mi mathvariant=\"normal\">R</mi></mfrac></math>", "image": null, "isCorrect": false}, {"id": "yiDlV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msup><mi mathvariant=\"normal\">B</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">a</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">v</mi><mn>2</mn></msup></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">R</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "lChZF", "text": "none of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The induced emf in the circular loop <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi mathvariant=\"normal\">B</mi><mfenced separators=\"|\"><mi>PQ</mi></mfenced><mi mathvariant=\"normal\">v</mi><mo>=</mo><mi>Bav</mi></math><br /><br />Therefore electrical power consumed by the circular loop<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><msup><mfenced separators=\"|\"><mi>emf</mi></mfenced><mn>2</mn></msup><mi mathvariant=\"normal\">R</mi></mfrac><mo>=</mo><mfrac><msup><mfenced separators=\"|\"><mi>Bav</mi></mfenced><mn>2</mn></msup><mi mathvariant=\"normal\">R</mi></mfrac></math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-06-20_at_3.30.18_PM.jpeg\" style=\"width: 200px; height: 185px;\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86397719df622f78f5b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "65", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A conducting wire&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ab</mi></math> of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi></math>, resistance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math> and mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> starts sliding down at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>0</mn></math> down a smooth vertical, thick pair of perfectly conducting rails as shown in the figure. A uniform magnetic field&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> exist in the space in a direction perpendicular to the plane of the rails. What will be the final constant speed of wire?<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/4f03ffbb-c080-438d-9467-7947933221f9-image5.jpeg\" />", "image": null}, "options": [{"id": "BosNE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>m</mi><mi>g</mi><mi>r</mi></mrow><mrow><msup><mi>B</mi><mn>2</mn></msup><msup><mi>l</mi><mn>2</mn></msup></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "cgl4g", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>m</mi><mi>g</mi><mi>r</mi></mrow><mrow><mn>2</mn><msup><mi>B</mi><mn>2</mn></msup><msup><mi>l</mi><mn>2</mn></msup></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "Q1DBp", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>m</mi><mi>g</mi><mi>r</mi></mrow><mrow><mn>2</mn><mi>B</mi><msup><mi>l</mi><mn>2</mn></msup></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "HoRvX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>m</mi><mi>g</mi><mi>r</mi></mrow><mrow><mi>B</mi><msup><mi>l</mi><mn>2</mn></msup></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>If there are no dissipating forces then the system will oscillate but if there is some small resistance then the acceleration of the conductor is related to the net force as<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mfrac><mrow><mi mathvariant=\"italic\">d</mi><mi mathvariant=\"italic\">v</mi></mrow><mrow><mi mathvariant=\"italic\">d</mi><mi mathvariant=\"italic\">t</mi></mrow></mfrac><mo>=</mo><mi>m</mi><mi>g</mi><mo>-</mo><mi>i</mi><mi>l</mi><mi>B</mi><mo>=</mo><mi>m</mi><mi>g</mi><mo>-</mo><mfrac><mrow><msup><mi>B</mi><mn>2</mn></msup><msup><mi>l</mi><mn>2</mn></msup><mi>v</mi></mrow><mi>r</mi></mfrac></math><br />When the rod attains the steady constant speed, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi mathvariant=\"italic\">d</mi><mi mathvariant=\"italic\">v</mi></mrow><mrow><mi mathvariant=\"italic\">d</mi><mi mathvariant=\"italic\">t</mi></mrow></mfrac></math> is zero. Hence</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>0</mn></msub><mo>=</mo><mfrac><mrow><mi>m</mi><mi>g</mi><mi>r</mi></mrow><mrow><msup><mi>B</mi><mn>2</mn></msup><msup><mi>l</mi><mn>2</mn></msup></mrow></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86371531a65d9c922b4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "59", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A conducting square frame of side <math> <mtext>a</mtext> </math> and a long straight wire carrying current <math> <mtext>I</mtext> </math> are located in the same plane as shown in the figure. The frame moves to the right with a constant velocity <math> <mtext>V</mtext></math>. The e.m.f induced in the frame (when the centre of the frame is at a distance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math> from the wire) will be proportional to :<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image19-50826b36-96dc-4275-bfef-15a18d134a15.jpg\" />", "image": null}, "options": [{"id": "VyJ4B", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mi>x</mi><mn>2</mn></msup></mfrac></math>", "image": null, "isCorrect": false}, {"id": "X0JR5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mfenced separators=\"|\"><mrow><mn>2</mn><mi>x</mi><mo>-</mo><mi>a</mi></mrow></mfenced><mn>2</mn></msup></mfrac></math>", "image": null, "isCorrect": false}, {"id": "y588S", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mfenced separators=\"|\"><mrow><mn>2</mn><mi>x</mi><mo>+</mo><mi>a</mi></mrow></mfenced><mn>2</mn></msup></mfrac></math>", "image": null, "isCorrect": false}, {"id": "eQDFs", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mrow><mfenced separators=\"|\"><mrow><mn>2</mn><mi>x</mi><mo>-</mo><mi>a</mi></mrow></mfenced><mfenced separators=\"|\"><mrow><mn>2</mn><mi>x</mi><mo>+</mo><mi>a</mi></mrow></mfenced></mrow></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image20-029c3613-6717-4bab-80a5-816280a3a660.png\" /><br /><br />The potential difference across AB is<br /><br /><math><msub><mrow><mi>V</mi></mrow><mrow><mi>A</mi></mrow></msub><mo>-</mo><msub><mrow><mi>V</mi></mrow><mrow><mi>B</mi></mrow></msub><mo>=</mo><msub><mrow><mi>B</mi></mrow><mrow><mn>1</mn></mrow></msub><mi>&#160;</mi><mi>a</mi><mo>.</mo><mi>V</mi><mo>.</mo></math><br /><br /><math><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mfrac><mrow><msub><mrow><mi>&#956;</mi></mrow><mrow><mi>i</mi></mrow></msub></mrow><mrow><mn>2</mn><mi>&#960;</mi><mi>&#160;</mi><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mfrac><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></mrow></mfrac><mi>&#160;</mi><mi>a</mi><mi>V</mi></math><br /><br />The potential difference across CD is<br /><br /><math><msub><mrow><mi>V</mi></mrow><mrow><mi>C</mi></mrow></msub><mo>-</mo><msub><mrow><mi>V</mi></mrow><mrow><mi>D</mi></mrow></msub><mo>=</mo><msub><mrow><mi>B</mi></mrow><mrow><mn>2</mn></mrow></msub><mi>&#160;</mi><mi>a</mi><mo>.</mo><mi>V</mi></math><br /><br /><math><msub><mrow><mi>B</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><msub><mrow><mi>&#956;</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>i</mi></mrow><mrow><mn>2</mn><mi>&#960;</mi><mfenced separators=\"|\"><mrow><mi>x</mi><mo>+</mo><mfrac><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></mrow></mfrac></math><br /><br /><math><msub><mrow><mi>V</mi></mrow><mrow><mi>C</mi></mrow></msub><mo>-</mo><msub><mrow><mi>V</mi></mrow><mrow><mi>D</mi></mrow></msub><mo>=</mo><mi>&#160;</mi><mfrac><mrow><msub><mrow><mi>&#956;</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>i</mi></mrow><mrow><mn>2</mn><mi>&#960;</mi><mfenced separators=\"|\"><mrow><mi>x</mi><mo>+</mo><mfrac><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></mrow></mfrac><mi>&#160;</mi><mi>a</mi><mi>V</mi></math><br /><br />Net Potential difference&nbsp;<math><mo>=</mo><mfrac><mrow><msub><mrow><mi>&#956;</mi></mrow><mrow><mi>i</mi></mrow></msub><mi>&#160;</mi><mi>a</mi><mi>V</mi></mrow><mrow><mn>2</mn><mi>&#160;</mi><mi>&#960;</mi></mrow></mfrac><mi>&#160;</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mi>x</mi><mi>&#160;</mi><mo>-</mo><mi>&#160;</mi><mfrac><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfrac><mo>-</mo><mi>&#160;</mi><mfrac><mrow><mn>1</mn></mrow><mrow><mi>x</mi><mi>&#160;</mi><mo>+</mo><mi>&#160;</mi><mfrac><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfrac></mrow></mfenced></math><br /><br /><math> <mrow> <mrow><mo>(</mo> <mrow> <msub> <mi>V</mi> <mi>A</mi> </msub> <mo>&#8722;</mo><msub> <mi>V</mi> <mi>B</mi> </msub> </mrow> <mo>)</mo></mrow><mo>&#8722;</mo><mrow><mo>(</mo> <mrow> <msub> <mi>V</mi> <mi>C</mi> </msub> <mo>&#8722;</mo><msub> <mi>V</mi> <mi>D</mi> </msub> </mrow> <mo>)</mo></mrow><mo>=</mo><mfrac> <mrow> <mi>&#956;</mi><mi>i</mi><mi>a</mi> </mrow> <mrow> <mn>2</mn><mi>&#960;</mi> </mrow> </mfrac> <mrow><mo>(</mo> <mrow> <mfrac> <mrow> <mn>2</mn><mi>a</mi> </mrow> <mrow> <msup> <mi>x</mi> <mn>2</mn> </msup> <mo>&#8722;</mo><mfrac> <mrow> <msup> <mi>a</mi> <mn>2</mn> </msup> </mrow> <mn>4</mn> </mfrac> </mrow> </mfrac> </mrow> <mo>)</mo></mrow> </mrow> </math><br /><br /><math><mo>&#8733;</mo><mi>&#160;</mi><mi>&#160;</mi><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mo>&#8733;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mfrac><mrow><mn>1</mn></mrow><mrow><mfenced separators=\"|\"><mrow><mn>2</mn><mi>x</mi><mo>+</mo><mi>a</mi></mrow></mfenced><mo>(</mo><mn>2</mn><mi>x</mi><mo>-</mo><mi>a</mi><mo>)</mo></mrow></mfrac><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86355b509123ef82e2e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "35", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform metal rod is moving with a uniform velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">v</mi></math> parallel to a long straight wire carrying a current <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi></math>. The rod is perpendicular to the wire with its ends at distances&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">r</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">r</mi><mn>2</mn></msub></math> (with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">r</mi><mn>2</mn></msub><mo>&gt;</mo><msub><mi mathvariant=\"normal\">r</mi><mn>1</mn></msub></math>) from it. The E.M.F. induced in the rod at that instant is", "image": null}, "options": [{"id": "mGLsg", "text": "zero", "image": null, "isCorrect": false}, {"id": "MNAF2", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi mathvariant=\"normal\">&#x3BC;</mi><mn>0</mn></msub><mi>Iv</mi></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">&#x3C0;</mi></mrow></mfrac><mi>ln</mi><mfenced separators=\"|\"><mfrac><msub><mi mathvariant=\"normal\">r</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">r</mi><mn>1</mn></msub></mfrac></mfenced></math>", "image": null, "isCorrect": true}, {"id": "jL7OV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi mathvariant=\"normal\">&#x3BC;</mi><mn>0</mn></msub><mi>Iv</mi></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">&#x3C0;</mi></mrow></mfrac><mi>ln</mi><mfenced separators=\"|\"><mfrac><msub><mi mathvariant=\"normal\">r</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">r</mi><mn>2</mn></msub></mfrac></mfenced></math>", "image": null, "isCorrect": false}, {"id": "hrTTs", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi mathvariant=\"normal\">&#x3BC;</mi><mn>0</mn></msub><mi>Iv</mi></mrow><mrow><mn>4</mn><mi mathvariant=\"normal\">&#x3C0;</mi></mrow></mfrac><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mfrac><msub><mi mathvariant=\"normal\">r</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">r</mi><mn>2</mn></msub></mfrac></mrow></mfenced></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo>=</mo><mfrac><mrow><msub><mi mathvariant=\"normal\">&#956;</mi><mn>0</mn></msub><mi mathvariant=\"normal\">i</mi></mrow><mrow><mn>2</mn><mi>&#960;x</mi></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d&#949;</mi><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mi>Bv</mi><mfenced><mi>dx</mi></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#949;</mi><mo>=</mo><mfrac><mrow><msub><mi mathvariant=\"normal\">&#956;</mi><mn>0</mn></msub><mi>iv</mi></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi></mrow></mfrac><munderover><mo>&#8747;</mo><msub><mi mathvariant=\"normal\">r</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">r</mi><mn>1</mn></msub></munderover><mfrac><mi>dx</mi><mi mathvariant=\"normal\">x</mi></mfrac><mo>=</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><msub><mi mathvariant=\"normal\">&#956;</mi><mn>0</mn></msub><mi>iv</mi></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi></mrow></mfrac><mi>ln</mi><mfrac><msub><mi mathvariant=\"normal\">r</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">r</mi><mn>1</mn></msub></mfrac></mrow></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863538500a4623ce631", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "56", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A metal bar <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math> can slide on two parallel thick metallic rails separated by a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi></math>. A resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> and an inductance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math> are connected to the rails as shown in the figure. A long straight wire, carrying a constant current <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>I</mi><mn>0</mn></msub></math> is placed in the plane of the rails as shown. The bar <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math> is held at rest at a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>x</mi><mn>0</mn></msub></math> from the long wire. At&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mi>t</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>0</mn></math>, it is made to slide on the rails away from the wire.<br />\r<br />\r<img alt=\"\" height=\"157\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0009092_Ques1_1.jpg\" width=\"185\" /><br />\r<br />\r&nbsp;It is observed that at time<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mi>t</mi><mo>=</mo><mi>T</mi></math>, the metal bar <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math> is at a distance of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mi>x</mi><mn>0</mn></msub></math> from the long wire and the resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> carries a current <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>i</mi><mn>1</mn></msub></math>. The net charge that has flown through resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>0</mn></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mi>T</mi></math> is", "image": null}, "options": [{"id": "SZ2ot", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>R</mi></mfrac><mfenced open=\"[\" close=\"]\"><mrow><mfrac><mrow><msub><mi>&#x3BC;</mi><mn>0</mn></msub><mi>l</mi></mrow><mrow><mn>2</mn><mi>&#x3C0;</mi></mrow></mfrac><mtext>ln</mtext><mfenced><mn>2</mn></mfenced><mo>-</mo><mi>L</mi><msub><mi>i</mi><mn>1</mn></msub></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "w09y9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>R</mi></mfrac><mfenced open=\"[\" close=\"]\"><mrow><mfrac><mrow><msub><mi>&#x3BC;</mi><mn>0</mn></msub><msub><mi>I</mi><mn>0</mn></msub><mi>l</mi></mrow><mi>&#x3C0;</mi></mfrac><mtext>ln</mtext><mfenced><mn>2</mn></mfenced><mo>-</mo><mi>L</mi><msub><mi>i</mi><mn>1</mn></msub></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "qNh1H", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>R</mi></mfrac><mfenced close=\"]\" open=\"[\"><mrow><mfrac><mrow><msub><mi>μ</mi><mn>0</mn></msub><msub><mi>I</mi><mn>0</mn></msub><mi>l</mi></mrow><mrow><mn>2</mn><mi>π</mi></mrow></mfrac><mtext>ln</mtext><mfenced><mn>2</mn></mfenced><mo>-</mo><mi>L</mi><msub><mi>i</mi><mn>1</mn></msub></mrow></mfenced></math>", "image": null, "isCorrect": true}, {"id": "MFViG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>R</mi></mfrac><mfenced open=\"[\" close=\"]\"><mrow><mfrac><mrow><msub><mi>&#x3BC;</mi><mn>0</mn></msub><msub><mi>I</mi><mn>0</mn></msub></mrow><mrow><mn>2</mn><mi>&#x3C0;</mi></mrow></mfrac><mtext>ln</mtext><mfenced><mn>2</mn></mfenced><mo>-</mo><mi>L</mi><msub><mi>i</mi><mn>1</mn></msub></mrow></mfenced></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let v be velocity of AB when AB is at a distance x from the wire,<br /><br /><math> <mrow> <msub> <mtext mathvariant=\"italic\">e</mtext> <mtext mathvariant=\"italic\">AB</mtext> </msub> <mo>=</mo> <mtext mathvariant=\"italic\">B</mtext> <mtext mathvariant=\"italic\">.</mtext> <mi>ℓ</mi> <mtext mathvariant=\"italic\">.</mtext> <mtext mathvariant=\"italic\">v</mtext> <mo>=</mo> <mfrac> <mrow> <msub> <mi>μ</mi> <mn>0</mn> </msub> <msub> <mtext mathvariant=\"italic\">I</mtext> <mn>0</mn> </msub> </mrow> <mrow> <mn>2</mn> <mi>π</mi> <mi>x</mi> </mrow> </mfrac> <mtext mathvariant=\"italic\">I</mtext> <mtext mathvariant=\"italic\">.</mtext> <mtext mathvariant=\"italic\">v</mtext> <mo>=</mo> <mfrac> <mrow> <mtext mathvariant=\"italic\">d</mtext> <mi>ϕ</mi> </mrow> <mrow> <mtext mathvariant=\"italic\">d</mtext> <mtext mathvariant=\"italic\">t</mtext> </mrow> </mfrac> </mrow> </math><br /><br />For circuit Loop,<br /><br /><math> <mrow> <mfrac> <mrow> <mtext mathvariant=\"italic\">d</mtext> <mi>ϕ</mi> </mrow> <mrow> <mtext mathvariant=\"italic\">d</mtext> <mtext mathvariant=\"italic\">t</mtext> </mrow> </mfrac> <mo>-</mo> <mtext mathvariant=\"italic\">i</mtext> <mtext mathvariant=\"italic\">R</mtext> <mo>-</mo> <mtext mathvariant=\"italic\">L</mtext> <mfrac> <mrow> <mtext mathvariant=\"italic\">d</mtext> <mtext mathvariant=\"italic\">i</mtext> </mrow> <mrow> <mtext mathvariant=\"italic\">d</mtext> <mtext mathvariant=\"italic\">t</mtext> </mrow> </mfrac> <mo>=</mo> <mn>0</mn> </mrow> </math><br /><br /><math> <mrow> <mfrac> <mrow> <mtext mathvariant=\"italic\">d</mtext> <mi>ϕ</mi> </mrow> <mrow> <mtext mathvariant=\"italic\">d</mtext> <mtext mathvariant=\"italic\">t</mtext> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <mtext mathvariant=\"italic\">d</mtext> <mtext mathvariant=\"italic\">q</mtext> </mrow> <mrow> <mtext mathvariant=\"italic\">d</mtext> <mtext mathvariant=\"italic\">t</mtext> </mrow> </mfrac> <mtext mathvariant=\"italic\">R</mtext> <mo>-</mo> <mtext mathvariant=\"italic\">L</mtext> <mfrac> <mrow> <mtext mathvariant=\"italic\">d</mtext> <mtext mathvariant=\"italic\">i</mtext> </mrow> <mrow> <mtext mathvariant=\"italic\">d</mtext> <mtext mathvariant=\"italic\">t</mtext> </mrow> </mfrac> <mo>=</mo> <mn>0</mn> </mrow> </math><br /><br /><math> <mrow> <mo>⇒</mo> <mspace width=\"0.5em\"></mspace> <mtext mathvariant=\"italic\">d</mtext> <mtext mathvariant=\"italic\">q</mtext> <mo>=</mo> <mfrac> <mrow> <mtext mathvariant=\"italic\">d</mtext> <mi>ϕ</mi> <mo>-</mo> <mtext mathvariant=\"italic\">L</mtext> <mtext mathvariant=\"italic\">d</mtext> <mtext mathvariant=\"italic\">i</mtext> </mrow> <mrow> <mtext mathvariant=\"italic\">R</mtext> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mtext mathvariant=\"italic\">Δ</mtext> <mtext mathvariant=\"italic\">q</mtext> <mo>=</mo> <mfrac> <mrow> <mtext mathvariant=\"italic\">Δ</mtext> <mi>ϕ</mi> <mo>-</mo> <mtext mathvariant=\"italic\">L</mtext> <mtext mathvariant=\"italic\">Δ</mtext> <mtext mathvariant=\"italic\">I</mtext> </mrow> <mrow> <mtext mathvariant=\"italic\">R</mtext></mrow></mfrac></mrow></math><br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext mathvariant=\"italic\">R</mtext> </mrow> </mfrac> <mo>[</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext mathvariant=\"italic\">ϕ</mtext> <mn>1</mn> </msub> <mo>-</mo> <msub> <mtext mathvariant=\"italic\">ϕ</mtext> <mn>2</mn> </msub> </mrow> </mfenced> <mo>-</mo> <mtext mathvariant=\"italic\">L</mtext>&nbsp;<mrow><msub><mtext mathvariant=\"italic\">i</mtext> <mn>1</mn> </msub> </mrow> </mfenced> <mo>]</mo> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mspace width=\"0.5em\"></mspace><mtext mathvariant=\"italic\">Δ</mtext><mtext mathvariant=\"italic\">q</mtext><mo>=</mo><mfrac><mn>1</mn><mtext mathvariant=\"italic\">R</mtext></mfrac><mo>[</mo><mfrac><mrow><msub><mtext mathvariant=\"italic\">μ</mtext><mn>0</mn></msub><mi>ℓ</mi><msub><mtext mathvariant=\"italic\">I</mtext><mn>0</mn></msub></mrow><mrow><mn>2</mn><mtext mathvariant=\"italic\">π</mtext></mrow></mfrac><mi>ln</mi><mfenced><mn>2</mn></mfenced><mo>-</mo><mtext mathvariant=\"italic\">L</mtext><msub><mtext mathvariant=\"italic\">i</mtext><mn>1</mn></msub><mo>]</mo></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634def6e0f946adf46", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "39", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "As shown in figure, the two parallel conducting rails, in a horizontal plane, are connected at one end by an inductor of inductance<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mi>L</mi></math>. A slider (metallic) of mass <em><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math></em>, is imparted a velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>0</mn></msub></math><sub>,</sub> upon the rails, as shown in figure. The period of oscillation of the conducting rod is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-06-25_at_5.18.52_PM.jpeg\" style=\"width: 240px; height: 106px;\" />", "image": null}, "options": [{"id": "EqJrY", "text": "<math><mfrac><mrow><mi>π</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mfrac><mrow><msqrt><mi>m</mi><mi>L</mi></msqrt></mrow><mrow><mi>B</mi><mi>l</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "OTeok", "text": "<math><mfrac><mrow><mn>2</mn><mi>π</mi><msqrt><mi>m</mi><mi>L</mi></msqrt></mrow><mrow><mn>3</mn><mi>B</mi><mi>l</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "4ctGy", "text": "<math><mfrac><mrow><mn>2</mn><mi>π</mi><msqrt><mi>m</mi><mi>L</mi></msqrt></mrow><mrow><mi>B</mi><mi>l</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "y9D1N", "text": "<math><mfrac><mrow><mn>3</mn><mi>π</mi><msqrt><mi>m</mi><mi>L</mi></msqrt></mrow><mrow><mn>2</mn><mi>B</mi><mi>l</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>From energy conservation (there are no dissipative forces)-</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>L</mi><msup><mi>I</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mi>m</mi><mn>2</mn></mfrac><mo>&#215;</mo><mn>2</mn><mi>v</mi><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>+</mo><mfrac><mi>L</mi><mn>2</mn></mfrac><mo>&#215;</mo><mn>2</mn><mi>I</mi><mfrac><mrow><mi>d</mi><mi>I</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mi>v</mi><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mi>I</mi><mi>L</mi><mfrac><mrow><mi>d</mi><mi>I</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math></p><p>The emf induced in an inductor is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mo>=</mo><mi>L</mi><mfrac><mrow><mi>d</mi><mi>I</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mi>B</mi><mi>l</mi><mi>v</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>L</mi><mfrac><mrow><mi>d</mi><mi>I</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mi>B</mi><mi>l</mi><mfrac><mrow><mi>d</mi><mi>x</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mi>L</mi><mi>d</mi><mi>I</mi><mo>=</mo><mi>B</mi><mi>l</mi><mi>d</mi><mi>x</mi><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mi>I</mi><mo>=</mo><mfrac><mrow><mi>B</mi><mi>l</mi></mrow><mi>L</mi></mfrac><mi>x</mi></math></p><p>The force acting on a current-carrying conductor is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mi>I</mi><mi>B</mi><mi>l</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mfrac><mrow><mi>I</mi><mi>B</mi><mi>l</mi></mrow><mi>m</mi></mfrac></math></p><p>Substituting the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi></math>&nbsp;we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mfenced><mrow><mfrac><mstyle displaystyle=\"true\"><mi>B</mi><mi>l</mi></mstyle><mstyle displaystyle=\"true\"><mi>L</mi></mstyle></mfrac><mi>x</mi></mrow></mfenced><mfrac><mrow><mi>B</mi><mi>l</mi></mrow><mi>m</mi></mfrac><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mi>a</mi><mo>=</mo><mo>-</mo><mfenced><mfrac><mstyle displaystyle=\"true\"><msup><mi>B</mi><mn>2</mn></msup><msup><mi>l</mi><mn>2</mn></msup></mstyle><mstyle displaystyle=\"true\"><mi>m</mi><mi>L</mi></mstyle></mfrac></mfenced><mi>x</mi></math></p><p>We got acceleration in the form of</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mo>-</mo><msup><mi>&#969;</mi><mn>2</mn></msup><mi>x</mi></math>&nbsp;</p><p>this implies that the motion is<strong>&nbsp;</strong>SHM, with angular frequency</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#969;</mi><mo>=</mo><msqrt><mfrac><mrow><msup><mi>B</mi><mn>2</mn></msup><msup><mi>l</mi><mn>2</mn></msup></mrow><mrow><mi>m</mi><mi>L</mi></mrow></mfrac></msqrt></math></p><p>The time period of motion is<br /><math><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>T</mi><mo>=</mo><mn>2</mn><mi>&#960;</mi><mfrac><mrow><msqrt><mi>m</mi><mi>L</mi></msqrt></mrow><mrow><mi>B</mi><mi mathvariant=\"script\">l</mi></mrow></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863456c722f98ea7c11", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "106", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the figure, a conducting rod of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi><mo>=</mo><mn>1</mn></math> meter and mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>=</mo><mn>1</mn><mo>&nbsp;</mo><mi>kg</mi></math> moves with an initial velocity, u <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> . On a fixed horizontal frame containing inductor <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi><mo>=</mo><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">H</mi></math> and resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math> . PQ and MN are smooth, conducting wires. There is a uniform magnetic field of strength <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>=</mo><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">T</mi></math>. Initially, there is no current in the inductor. Find the total charge in coulomb, flown through the inductor by the time velocity of the rod becomes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>f</mi></msub><mo>=</mo><mo>&nbsp;</mo><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&nbsp;</mo></math>and the rod has travelled a distance <math><mi>x</mi><mo>=</mo><mn>3</mn></math> meter.<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/bthdwwfbbrpimuqqccspulwfixlnwqxhbzjuunrdaudwllmflc.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"height: 99px; width: 180px;\" />", "image": null}, "options": [], "correctValue": "1", "solution": {"text": "Let <math><msub><mrow><mi>i</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi>i</mi></mrow><mrow><mn>2</mn></mrow></msub></math> be the current through <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> at any time <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>i</mi><mo>=</mo><msub><mi>i</mi><mn>1</mn></msub><mo>+</mo><msub><mi>i</mi><mn>2</mn></msub><mi>&#160;</mi><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mfrac><mrow><mi>B</mi><mi>l</mi><mi>v</mi></mrow><mi>R</mi></mfrac><mo>=</mo><msub><mi>i</mi><mn>2</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mi>l</mi><mi>v</mi><mo>=</mo><mi>L</mi><mfrac><mrow><mi>d</mi><msub><mi>i</mi><mn>1</mn></msub></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math><br /><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ucfalkacpnruylqigvlfvzxgafflidgldyrdzfiftrkkzvirkr.jpeg\" style=\"max-width:100%; object-fit:contain\" /><br /><br />Force on conducting rod <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>m</mi><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mi>i</mi><mi>l</mi><mi>B</mi><mo>=</mo><mo>-</mo><mfenced separators=\"|\"><mrow><msub><mi>i</mi><mn>1</mn></msub><mo>+</mo><mfrac><mrow><mi>B</mi><mi>l</mi><mi>v</mi></mrow><mi>R</mi></mfrac></mrow></mfenced><mi>l</mi><mi>B</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>m</mi><mi>d</mi><mi>v</mi><mo>=</mo><mi mathvariant=\"script\">&#160;</mi><mo>-</mo><mi>l</mi><mi>B</mi><mi>&#160;</mi><msub><mi>i</mi><mn>1</mn></msub><mi>d</mi><mi>t</mi><mo>-</mo><mfrac><mrow><msup><mi>B</mi><mn>2</mn></msup><msup><mi>l</mi><mn>2</mn></msup></mrow><mi>R</mi></mfrac><mi>v</mi><mi>&#160;</mi><mi>d</mi><mi>t</mi><mi>&#160;</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>m</mi><mo>&#8747;</mo><mi>d</mi><mi>v</mi><mo>=</mo><mo>-</mo><mi>l</mi><mi>B</mi><mi>&#160;</mi><mo>&#8747;</mo><msub><mi>i</mi><mn>1</mn></msub><mi>d</mi><mi>t</mi><mo>-</mo><mfrac><mrow><msup><mi>B</mi><mn>2</mn></msup><msup><mi>l</mi><mn>2</mn></msup></mrow><mi>R</mi></mfrac><mi>&#160;</mi><mo>&#8747;</mo><mi>v</mi><mi>&#160;</mi><mi>d</mi><mi>t</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>m</mi><mfenced separators=\"|\"><mrow><msub><mi>v</mi><mi>f</mi></msub><mo>-</mo><mi>u</mi></mrow></mfenced><mo>=</mo><mo>-</mo><mi>l</mi><mi>B</mi><mi>Q</mi><mo>-</mo><mfrac><mrow><msup><mi>B</mi><mn>2</mn></msup><msup><mi>l</mi><mn>2</mn></msup></mrow><mi>R</mi></mfrac><mi>x</mi></math><br /><br />( <math><msub><mrow><mi>v</mi></mrow><mrow><mn>1</mn></mrow></msub></math> = velocity, when it has moved a distance &#39;x&#39;)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>Q</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mfrac><mrow><msup><mi>B</mi><mn>2</mn></msup><mi>&#160;</mi><msup><mi>l</mi><mn>2</mn></msup></mrow><mi>R</mi></mfrac><mi>&#160;</mi><mi>x</mi><mo>-</mo><mi>m</mi><mfenced separators=\"|\"><mrow><msub><mi>v</mi><mi>f</mi></msub><mo>-</mo><mi>u</mi></mrow></mfenced></mrow><mrow><mi>B</mi><mi mathvariant=\"script\">&#160;</mi><mi>l</mi></mrow></mfrac><mo>=</mo><mn>1</mn><mi>C</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863434518ee98035762", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "38", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "There is a pair of fixed, parallel rails of negligible resistance in a horizontal plane, at a distance of <math><mi>L</mi><mo>=</mo><mn>10</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>. The rails are connected, at one of their ends to an ideal battery of EMF&nbsp;<math><mn>0.5</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">V</mi></math>, as shown in the figure. The system is placed in a vertically downward and perpendicular magnetic field of magnetic induction <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>=</mo><mn>1</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">T</mi></math>. A metal rod of resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>10</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math> is placed perpendicularly on the rails. The rod and rails are frictionless. The magnitude of force, which is to be exerted on the rod in order to move it with a constant speed of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>–</mo><mn>1</mn></mrow></msup></math> in the direction shown, is<br />\r<br />\r<img height=\"89\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ieocapniquntshonpsvfaoegfuwknehwjacjiukzgodvfkqmbh.jpeg\" width=\"203\" />", "image": null}, "options": [{"id": "NpCYl", "text": "<math><mn>2</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>–</mo><mn>3</mn></mrow></msup><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">N</mi></math>", "image": null, "isCorrect": false}, {"id": "Km9Yq", "text": "<math><mn>4</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>–</mo><mn>3</mn></mrow></msup><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">N</mi></math>", "image": null, "isCorrect": true}, {"id": "vvZnA", "text": "<math><mn>8</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>–</mo><mn>3</mn></mrow></msup><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">N</mi></math>", "image": null, "isCorrect": false}, {"id": "Je5S6", "text": "<math><mn>5</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>–</mo><mn>3</mn></mrow></msup><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">N</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><msub><mrow><mi mathvariant=\"normal\">ε</mi></mrow><mrow><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow></msub><mo>=</mo><mi>B</mi><mo>⋅</mo><mi>L</mi><mo>⋅</mo><mi>V</mi><mo>=</mo><mn>1</mn><mo>×</mo><mn>10</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>–</mo><mn>2</mn></mrow></msup><mo>×</mo><mn>1</mn></math><br /><br /><math><msub><mrow><mi mathvariant=\"normal\">ε</mi></mrow><mrow><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow></msub><mo>=</mo><mn>0.1</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">V</mi></math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/0395756_qye.JPG\" style=\"width: 180px; height: 123px;\" /><br /><br /><math><mi>I</mi><mo>=</mo><mfrac><mrow><mn>0.5</mn><mo>-</mo><mn>0.1</mn></mrow><mrow><mn>10</mn></mrow></mfrac><mo>=</mo><mn>0.04</mn></math><br /><br /><math><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mover accent=\"true\"><mrow><mi>F</mi></mrow><mo>→</mo></mover></mrow></mfenced><mo>=</mo><mn>1</mn><mo>×</mo><mn>0.04</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mo>–</mo><mn>2</mn></mrow></msup><mo>×</mo><mn>10</mn></math><br /><br /><math><mo>=</mo><mn>0.4</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>–</mo><mn>2</mn></mrow></msup></math><br /><br /><math><mo>|</mo><mover accent=\"true\"><mrow><mi>F</mi></mrow><mo>→</mo></mover><mo>|</mo><mi mathvariant=\"normal\">&nbsp;</mi><mo>=</mo><mn>4</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mo>–</mo><mn>3</mn></mrow></msup><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">N</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632159d791b28bb2a6", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "51", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A dc motor run by a source of emf <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math>&nbsp;draws a current of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">A</mi></math>. If the efficiency of the motor is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>%</mo></math>, then the resistance of the armature coil is", "image": null}, "options": [{"id": "78Bzn", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi></math>", "image": null, "isCorrect": false}, {"id": "zeleu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">&#x3A9;</mi></math>", "image": null, "isCorrect": true}, {"id": "DNw4Z", "text": "<math><mi mathvariant=\"normal\">30&nbsp;</mi><mi mathvariant=\"normal\">&Omega;</mi></math>", "image": null, "isCorrect": false}, {"id": "Yt9We", "text": "<math><mi mathvariant=\"normal\">25&nbsp;</mi><mi mathvariant=\"normal\">&Omega;</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Let us assume that the source voltage is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi></math>, the back emf developed in the armature coil is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>e</mi></math>, the armature resistance is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;and the armature current is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>i</mi></math>.</p><p>The efficiency of the motor is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>=</mo><mfrac><mrow><mi>i</mi><mi>e</mi></mrow><mrow><mi>i</mi><mi>E</mi></mrow></mfrac><mo>=</mo><mfrac><mi>e</mi><mn>200</mn></mfrac><mo>=</mo><mn>0</mn><mo>.</mo><mn>4</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>e</mi><mo>=</mo><mn>80</mn><mo>&#160;</mo><mi mathvariant=\"normal\">V</mi></math></p><p>The msub><mi mathvariant=\"normal\">e</mi><mn>0</mn></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi mathvariant=\"normal\">B</mi><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">e</mi><mn>0</mn></msub><mi>AN&#969;</mi></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo>=</mo><mfrac><mn>200</mn><mrow><mo>(</mo><mn>0</mn><mo>.25</mo><mo>&#215;</mo><mn>0</mn><mo>.25</mo><mo>)</mo><mo>&#215;</mo><mn>1000</mn><mo>&#215;</mo><mn>100</mn><mi mathvariant=\"normal\">&#960;</mi></mrow></mfrac></math><br /><br />Or&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo>=</mo><mn>0</mn><mo>.01</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">T</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863001e636bf85dd162", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "08", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A square loop <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mi>F</mi><mi>G</mi><mi>H</mi></math>&nbsp;of side <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math>, mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>&nbsp;and total resistance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;is falling under gravity in a region of transverse non-uniform magnetic field given by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>=</mo><msub><mi>B</mi><mn>0</mn></msub><mfrac><mi>y</mi><mi>a</mi></mfrac></math>,&nbsp;where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>B</mi><mn>0</mn></msub></math>&nbsp;is a positive constant and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math>&nbsp;is the position of side <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mi>F</mi></math>&nbsp;of the loop. If at some instant the speed of the loop is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math>, then the total Lorentz&nbsp;force acting on the loop is</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0009083_Ques1_1..jpg\" style=\"width: 300px; height: 173px;\" /></p>\r", "image": null}, "options": [{"id": "t79Gf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><mfrac><mrow><msubsup><mi>B</mi><mn>0</mn><mn>2</mn></msubsup><msup><mi>a</mi><mn>2</mn></msup><mi>v</mi></mrow><mrow><mn>2</mn><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "mHfpV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><mfrac><mrow><mn>2</mn><msubsup><mi>B</mi><mn>0</mn><mn>2</mn></msubsup><msup><mi>a</mi><mn>2</mn></msup><mi>v</mi></mrow><mi>R</mi></mfrac></math>", "image": null, "isCorrect": false}, {"id": "UZL1R", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><mfrac><mrow><msubsup><mi>B</mi><mn>0</mn><mn>2</mn></msubsup><msup><mi>a</mi><mn>2</mn></msup><mi>v</mi></mrow><mi>R</mi></mfrac></math>", "image": null, "isCorrect": true}, {"id": "d1DEg", "text": "zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Motional emf in EH and FG = 0 as&nbsp;<math> <mrow> <mover accent=\"true\"> <mtext>v</mtext> <mo>&#8594;</mo> </mover> <mo>||</mo> <mover accent=\"true\"> <mtext>I</mtext> <mo>&#8594;</mo> </mover> </mrow> </math></p><p>Motional emf in EF is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">e</mi><mn>1</mn></msub><mo>=</mo><mfenced><mfrac><mrow><msub><mtext>B</mtext><mn>0</mn></msub><mtext>y</mtext></mrow><mtext>a</mtext></mfrac></mfenced><mfenced><mtext>a</mtext></mfenced><mn>v</mn><mo>&#8289;</mo><mo>=</mo><msub><mtext>B</mtext><mn>0</mn></msub><mtext>y</mtext><mn>v</mn><mo>&#8289;</mo></math></p><p>Similarly, motional emf in GH will be<br />&nbsp;<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext>e</mtext><mn>2</mn></msub><mo>=</mo><mfenced open=\"{\" close=\"}\"><mfrac><mrow><msub><mtext>B</mtext><mn>0</mn></msub><mfenced><mrow><mtext>y</mtext><mo>+</mo><mtext>a</mtext></mrow></mfenced></mrow><mtext>a</mtext></mfrac></mfenced><mfenced><mtext>a</mtext></mfenced><mfenced><mrow><mn>v</mn><mo>&#8289;</mo></mrow></mfenced><mo>=</mo><msub><mtext>B</mtext><mn>0</mn></msub><mfenced><mrow><mtext>y</mtext><mo>+</mo><mtext>a</mtext></mrow></mfenced><mn>v</mn><mo>&#8289;</mo></math><br />&nbsp;<br />Polarities of e<sub>1</sub>and e<sub>2</sub> are shown in adjoining figures.<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0009084_AnsExp3_2.jpg\" style=\"width: 288px; height: 351px;\" /></p><p>So the net emf is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">e</mi><mo>=</mo><msub><mi mathvariant=\"normal\">e</mi><mn>2</mn></msub><mo>-</mo><msub><mi mathvariant=\"normal\">e</mi><mn>1</mn></msub><mspace linebreak=\"newline\"/><mi mathvariant=\"normal\">e</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><msub><mi mathvariant=\"normal\">B</mi><mn>0</mn></msub><mi>av</mi></math><br /><math> <mrow> <mtext>i</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>e</mtext> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>B</mtext> <mn>0</mn> </msub> <mtext>a</mtext> <mi></mi><mi></mi><mi></mi><mn>v</mn><mo>&#8289;</mo> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </math>&nbsp;</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0009084_AnsExp3_3.jpg\" style=\"width: 255px; height: 242px;\" /><br /><math> <mrow> <msub> <mtext>F</mtext> <mtext>EF</mtext> </msub> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <msub> <mtext>B</mtext> <mn>0</mn> </msub> <mtext>a</mtext> <mn>v</mn><mo>&#8289;</mo> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>a</mtext> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <msub> <mtext>B</mtext> <mn>0</mn> </msub> <mtext>y</mtext> </mrow> <mrow> <mtext>a</mtext> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math>&nbsp;(downwards)</p><p><math> <mrow> <msub> <mtext>F</mtext> <mtext>GH</mtext> </msub> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <msub> <mtext>B</mtext> <mn>0</mn> </msub> <mtext>a</mtext> <mi></mi><mi></mi><mn>v</mn><mo>&#8289;</mo> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>a</mtext> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <msub> <mtext>B</mtext> <mn>0</mn> </msub> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>y</mtext> <mo>+</mo> <mtext>a</mtext> </mrow> </mfenced> </mrow> <mrow> <mtext>a</mtext> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math>&nbsp;<br />&nbsp;<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext>F</mtext><mtext>GH</mtext></msub><mo>=</mo><mfenced><mfrac><mrow><msubsup><mtext>B</mtext><mn>0</mn><mn>2</mn></msubsup><mtext>a</mtext><mn>v</mn><mo>&#8289;</mo></mrow><mtext>R</mtext></mfrac></mfenced><mfenced><mrow><mtext>y</mtext><mo>+</mo><mtext>a</mtext></mrow></mfenced></math>&nbsp; (upwards)</p><p>Net Lorentz force on the loop<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">F</mi><mi>net</mi></msub><mo>=</mo><msub><mtext>F</mtext><mtext>GH</mtext></msub><mo>-</mo><msub><mtext>F</mtext><mtext>EF</mtext></msub><mo>=</mo><mfrac><mrow><msubsup><mtext>B</mtext><mn>0</mn><mn>2</mn></msubsup><msup><mtext>a</mtext><mn>2</mn></msup><mn>v</mn><mo>&#8289;</mo></mrow><mtext>R</mtext></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><mfrac><mrow><msubsup><mi>B</mi><mn>0</mn><mn>2</mn></msubsup><msup><mi>a</mi><mn>2</mn></msup><mi>v</mi></mrow><mi>R</mi></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "6aa3ab79aa8dc1ff68178047", "title": "Inductance", "totalQuestions": 5, "questions": [{"_id": "6151e863b955ade75bcfd956", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "51", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A fully charged capacitor&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math> with initial charge <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Q</mi><mn>0</mn></msub></math> is connected to an ideal inductor of self-inductance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math> at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>0</mn></math>. The time at which energy is stored equally between the electric and the magnetic fields is", "image": null}, "options": [{"id": "rgYQF", "text": "<math><mfrac><mrow><mi>π</mi></mrow><mrow><mn>4</mn></mrow></mfrac><msqrt><mi>L</mi><mi>C</mi></msqrt></math>", "image": null, "isCorrect": true}, {"id": "JuG08", "text": "<math><mn>2</mn><mi>π</mi><msqrt><mi>L</mi><mi>C</mi></msqrt></math>", "imag
