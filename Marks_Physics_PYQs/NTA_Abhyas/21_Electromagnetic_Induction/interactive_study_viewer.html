<mn>0</mn> <mi>&nbsp;Ω</mi> </mrow> </math><br /><br />Power factor, <math> <mrow> <mtext>cos</mtext> <mi>ϕ</mi> <mo>=</mo> <mfrac> <mrow> <mtext>R</mtext> </mrow> <mrow> <mtext>Z</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>8</mn> </mrow> <mrow> <mn>1</mn> <mn>0</mn> </mrow> </mfrac> <mo>=</mo> <mtext>0.8</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "correct", "lastPracticed": "2024-12-20T12:44:40.464Z"}, {"_id": "6151e86308562798b29cb657", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "84", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "There are two solenoids of same length and inductance L but their diameters differ to the extent that one can just fit into the other. They are connected in three different ways in series. (1) They are connected in series but separated by large distance, (2) they are connected in series with one inside the other and senses of the turns coinciding, (3) both are connected in series with one inside the other with senses of the turns opposite as depicted in figures 1, 2 and 3 respectively. The total inductance of the solenoids in each of the case 1, 2 and 3 are respectively<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/Object6-fe2c8696-9a53-46a5-a203-f5362c4c68c9.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 260px; height: 135px;\" />", "image": null}, "options": [{"id": "56pr9", "text": "<math><mn>0</mn><mo>,</mo><mi> </mi><mn>4</mn><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>,</mo><mi> </mi><mn>2</mn><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "jvHrH", "text": "<math><mn>4</mn><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>,</mo><mi> </mi><mn>2</mn><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>,</mo><mi> </mi><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "zOcpP", "text": "<math><mn>2</mn><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>,</mo><mi> </mi><mn>0</mn><mo>,</mo><mi> </mi><mn>4</mn><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "2r3tc", "text": "<math><mn>2</mn><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>,</mo><mi> </mi><mn>4</mn><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>,</mo><mi> </mi><mn>0</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "When two solenoids of inductance <math><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub></math> are connected in series at large distance and current <math><mi>i</mi></math> is passed through them, the total flux linkage <math><msub><mrow><mi mathvariant=\"normal\">ϕ</mi></mrow><mrow><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">l</mi></mrow></msub></math>is the sum of the flux linkages <math><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>i</mi></math> and <math><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>i</mi><mo>,</mo><mi> </mi><mi>i</mi><mi>e</mi><mo>,</mo></math><br/><br/><math><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><msub><mrow><mi mathvariant=\"normal\">ϕ</mi></mrow><mrow><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">l</mi></mrow></msub><mo>=</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>i</mi><mo>+</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>i</mi></math><br/><br/>If <math><mi>L</mi></math> be the equivalent inductance of the system, then<br/><br/><math><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\"> </mi><msub><mrow><mi mathvariant=\"normal\">ϕ</mi></mrow><mrow><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">l</mi></mrow></msub><mo>=</mo><mi>L</mi><mi>i</mi></math> <br/><br/><math><mo>∴</mo><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi>L</mi><mi>i</mi><mo>=</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>i</mi><mo>+</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>i</mi></math><br/><br/>or        <math><mi>L</mi><mo>=</mo><mn>2</mn><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub></math><br/><br/>When solenoids are connected in series with one inside the other and senses of the turns coinciding, then there will be mutual inductance <math><mi>L</mi></math> between them. In this case the resultant induced emf in the coils is the sum of the emf <math><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\"> </mi><msub><mrow><mi>e</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi>e</mi></mrow><mrow><mn>2</mn></mrow></msub></math> in the respective coils, <math><mi>i</mi><mi>e</mi><mo>,</mo></math><br/><br/><math><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi>e</mi><mo>=</mo><msub><mrow><mi>e</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>e</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br/><br/><math><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mo>=</mo><mfenced separators=\"|\"><mrow><mo>-</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mfrac><mrow><mi>d</mi><mi>i</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>±</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mfrac><mrow><mi>d</mi><mi>i</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mrow></mfenced><mo>+</mo><mfenced separators=\"|\"><mrow><mo>-</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mfrac><mrow><mi>d</mi><mi>i</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>±</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mfrac><mrow><mi>d</mi><mi>i</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mrow></mfenced></math><br/><br/>Where (+) sign is for positive coupling and (-) sign for negative coupling.<br/><br/>But,                 <math><mi>e</mi><mo>=</mo><mo>-</mo><mi>L</mi><mo>.</mo><mfrac><mrow><mi>d</mi><mi>i</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math><br/><br/><math><mo>∴</mo><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mo>-</mo><mi>L</mi><mfrac><mrow><mi>d</mi><mi>i</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mo>-</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mfrac><mrow><mi>d</mi><mi>i</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>-</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mfrac><mrow><mi>d</mi><mi>i</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>±</mo><mn>2</mn><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mfrac><mrow><mi>d</mi><mi>i</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math><br/><br/><math><mi>i</mi><mi>e</mi><mo>,</mo><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi>L</mi><mo>=</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>+</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>+</mo><mn>2</mn><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub></math><br/><br/><math><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mo>=</mo><mn>4</mn><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub></math>                           (for positive coupling)<br/><br/>When solenoids are connected in series with one inside the other with senses of the turns opposite, then their is negative coupling.<br/><br/>So, <math><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi>L</mi><mo>=</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>+</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>-</mo><mn>2</mn><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mn>0</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86306db245cd2416fba", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "42", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>LC</mi></math> circuit shown below, the current is in direction as shown and the charges on the capacitor plates have the sign as shown. At this instant<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/dsfadsfad.JPG\" style=\"width: 180px; height: 127px;\" />", "image": null}, "options": [{"id": "0c6dQ", "text": "<math><mi>I</mi></math> is increasing <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math> is increasing", "image": null, "isCorrect": false}, {"id": "h34yP", "text": "<math><mi>I</mi></math> is increasing <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math> is decreasing", "image": null, "isCorrect": false}, {"id": "PmkNU", "text": "<math><mi>I</mi></math> is decreasing <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math> is increasing", "image": null, "isCorrect": true}, {"id": "7zpai", "text": "<math><mi>I</mi></math> is decreasing and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math> is decreasing", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As clearly ‘<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math>’ is increasing so electric field energy in capacitor must be increasing. And hence, magnetic field energy in inductor must be decreasing. So <math><mi>I</mi></math> is decreasing.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "6aa3ab79aa8dc1ff68178048", "title": "LR Circuit", "totalQuestions": 5, "questions": [{"_id": "6151e863d94c31bed6a4afd1", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "57", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The current through an inductor of impedance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math>&nbsp;lags behind the voltage by a phase of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>°</mo></math>&nbsp;when just the inductor is connected to the ac source. Now the inductor is connected to a <math><mn>5</mn><mi mathvariant=\"normal\">Ω</mi></math> resistance in series, then the net impedance of the circuit is<br />\r<br />\r&nbsp; <img alt=\"\" height=\"79\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image10-e690c6e7-d9a6-4435-b5d9-7e9eb653d3dd.jpg\" width=\"266\" />", "image": null}, "options": [{"id": "lfRTK", "text": "<math><mn>15</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": false}, {"id": "pKBXi", "text": "<math><mn>12</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": false}, {"id": "RFTTY", "text": "<math><mn>13.2</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": true}, {"id": "YWRMm", "text": "<math><mn>18</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">Ω</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>=</mo><msqrt><msup><mi>r</mi><mn>2</mn></msup><mo>+</mo><msubsup><mi>X</mi><mi mathvariant=\"normal\">L</mi><mn>2</mn></msubsup></msqrt></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>X</mi><mi mathvariant=\"normal\">L</mi></msub><mi>r</mi></mfrac><mo>=</mo><mi>tan</mi><mo>&#8289;</mo><mn>60</mn><mo>&#176;</mo></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>=</mo><msqrt><msup><mi>r</mi><mn>2</mn></msup><mo>+</mo><msup><mfenced separators=\"|\"><mrow><mi>r</mi><msqrt><mn>3</mn></msqrt></mrow></mfenced><mn>2</mn></msup></msqrt></math> or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><mn>5</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><msub><mi mathvariant=\"normal\">X</mi><mi mathvariant=\"normal\">L</mi></msub><mo>=</mo><mn>5</mn><msqrt><mn>3</mn></msqrt><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Z</mi><mo>=</mo><msqrt><msup><mfenced separators=\"|\"><mrow><mn>5</mn><mo>+</mo><mn>5</mn></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced separators=\"|\"><mrow><mn>5</mn><msqrt><mn>3</mn></msqrt></mrow></mfenced><mn>2</mn></msup></msqrt><mo>=</mo><msqrt><mn>175</mn></msqrt><mo>=</mo><mn>13.2</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#937;</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a307938f403f2376", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "27", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniformly wound solenoidal coil of self-inductance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1.8</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">H</mi></math>&nbsp;and resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Ω</mi></math> is broken up into two identical coils. These identical coils are then connected in parallel across a <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">V</mi></math> battery of negligible resistance. The time constant of the circuit is", "image": null}, "options": [{"id": "7z2sw", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi mathvariant=\"normal\">&nbsp;</mi><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": true}, {"id": "xoCn1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1.5</mn><mi mathvariant=\"normal\">&#xA0;</mi><mo>&#xD7;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>&#xA0;</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "WINzN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0.75</mn><mi mathvariant=\"normal\">&#xA0;</mi><mo>&#xD7;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>&#xA0;</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "K7svm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mi mathvariant=\"normal\">&#xA0;</mi><mo>&#xD7;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>&#xA0;</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msub><mi mathvariant=\"normal\">L</mi><mi mathvariant=\"normal\">p</mi></msub></mfrac><mo>=</mo><mfrac><mn>1</mn><mi mathvariant=\"normal\">L</mi></mfrac><mo>+</mo><mfrac><mn>1</mn><mi mathvariant=\"normal\">L</mi></mfrac><mo>=</mo><mfrac><mn>2</mn><mi mathvariant=\"normal\">L</mi></mfrac><mo>&#160;&#160;</mo><mo>&#160;</mo><mo>&#160;&#160;</mo><mo>&#8658;</mo><msub><mi mathvariant=\"normal\">L</mi><mi mathvariant=\"normal\">P</mi></msub><mo>=</mo><mfrac><mi mathvariant=\"normal\">L</mi><mn>2</mn></mfrac><mi mathvariant=\"normal\">&#160;</mi></math><br /><br />Where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">L</mi></math> is inductance of each part,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mfrac><mrow><mtext>1.8</mtext><mi mathvariant=\"normal\">&#160;</mi><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup></mrow><mn>2</mn></mfrac><mo>=</mo><mtext>0.9</mtext><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">H</mi></math>&nbsp;<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi mathvariant=\"normal\">&#160;</mi><msub><mi mathvariant=\"normal\">L</mi><mi mathvariant=\"normal\">P</mi></msub><mo>=</mo><mfrac><mi mathvariant=\"normal\">L</mi><mn>2</mn></mfrac><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mfrac><mrow><mtext>0.9</mtext><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup></mrow><mn>2</mn></mfrac><mo>=</mo><mtext>0.45</mtext><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">H</mi></math><br /><br />Resistance of each part, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi><mo>=</mo><mfrac><mn>6</mn><mn>2</mn></mfrac><mo>=</mo><mn>3</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math><br /><br />Now, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msub><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">P</mi></msub></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>+</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac></math><br />&nbsp;</p><p>Time constant of circuit,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">L</mi><mi mathvariant=\"normal\">P</mi></msub><msub><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">P</mi></msub></mfrac><mo>=</mo><mfrac><mrow><mtext>0.45</mtext><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup></mrow><mtext>1.5</mtext></mfrac><mo>=</mo><mn>3</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">s</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638cccd17f030658c3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "109", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the circuit shown switch <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi></math> is connected to position <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math> for a long time and then joined to the position <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>. The total heat produced in resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">R</mi><mn>1</mn></msub></math> is :<br />\r<br />\r<img alt=\"\" height=\"164\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0032945_Question.jpg\" style=\"max-width:100%; object-fit:contain\" width=\"159\" />", "image": null}, "options": [{"id": "l4McS", "text": "<math> <mrow> <mfrac> <mrow> <msup> <mtext>LE</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn> <msubsup> <mtext>R</mtext> <mn>2</mn> <mn>2</mn> </msubsup> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "62PW9", "text": "<math> <mrow> <mfrac> <mrow> <msup> <mtext>LE</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn> <msubsup> <mtext>R</mtext> <mn>1</mn> <mn>2</mn> </msubsup> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "0Fwwv", "text": "<math> <mrow> <mfrac> <mrow> <msup> <mtext>LE</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn> <msub> <mtext>R</mtext> <mn>1</mn> </msub> <msub> <mtext>R</mtext> <mn>2</mn> </msub> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "KcQS2", "text": "<math> <mrow> <mfrac> <mrow> <msup> <mtext>LE</mtext> <mn>2</mn> </msup> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>R</mtext> <mn>1</mn> </msub> <mo>+</mo> <msub> <mtext>R</mtext> <mn>2</mn> </msub> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn> <msubsup> <mtext>R</mtext> <mn>1</mn> <mn>2</mn> </msubsup> <msubsup> <mtext>R</mtext> <mn>2</mn> <mn>2</mn> </msubsup> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When the key is at position (B) for a long time; the energy stored in the inductor is :<br /><br /><math> <mrow> <msub> <mtext>U</mtext> <mtext>B</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msubsup> <mtext> ath> can slide on two parallel thick metallic rails separated by a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi></math>. A resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> and an inductance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math> are connected to the rails as shown in the figure. A long straight wire, carrying a constant current <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>I</mi><mn>0</mn></msub></math> is placed in the plane of the rails as shown. The bar <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math> is held at rest at a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>x</mi><mn>0</mn></msub></math> from the long wire. At&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mi>t</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>0</mn></math>, it is made to slide on the rails away from the wire.<br />\r<br />\r<img alt=\"\" height=\"157\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0009092_Ques1_1.jpg\" width=\"185\" /><br />\r<br />\r&nbsp;It is observed that at time<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mi>t</mi><mo>=</mo><mi>T</mi></math>, the metal bar <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math> is at a distance of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mi>x</mi><mn>0</mn></msub></math> from the long wire and the resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> carries a current <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>i</mi><mn>1</mn></msub></math>. The net charge that has flown through resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>0</mn></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mi>T</mi></math> is", "image": null}, "options": [{"id": "SZ2ot", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>R</mi></mfrac><mfenced open=\"[\" close=\"]\"><mrow><mfrac><mrow><msub><mi>&#x3BC;</mi><mn>0</mn></msub><mi>l</mi></mrow><mrow><mn>2</mn><mi>&#x3C0;</mi></mrow></mfrac><mtext>ln</mtext><mfenced><mn>2</mn></mfenced><mo>-</mo><mi>L</mi><msub><mi>i</mi><mn>1</mn></msub></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "w09y9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>R</mi></mfrac><mfenced open=\"[\" close=\"]\"><mrow><mfrac><mrow><msub><mi>&#x3BC;</mi><mn>0</mn></msub><msub><mi>I</mi><mn>0</mn></msub><mi>l</mi></mrow><mi>&#x3C0;</mi></mfrac><mtext>ln</mtext><mfenced><mn>2</mn></mfenced><mo>-</mo><mi>L</mi><msub><mi>i</mi><mn>1</mn></msub></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "qNh1H", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>R</mi></mfrac><mfenced close=\"]\" open=\"[\"><mrow><mfrac><mrow><msub><mi>μ</mi><mn>0</mn></msub><msub><mi>I</mi><mn>0</mn></msub><mi>l</mi></mrow><mrow><mn>2</mn><mi>π</mi></mrow></mfrac><mtext>ln</mtext><mfenced><mn>2</mn></mfenced><mo>-</mo><mi>L</mi><msub><mi>i</mi><mn>1</mn></msub></mrow></mfenced></math>", "image": null, "isCorrect": true}, {"id": "MFViG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>R</mi></mfrac><mfenced open=\"[\" close=\"]\"><mrow><mfrac><mrow><msub><mi>&#x3BC;</mi><mn>0</mn></msub><msub><mi>I</mi><mn>0</mn></msub></mrow><mrow><mn>2</mn><mi>&#x3C0;</mi></mrow></mfrac><mtext>ln</mtext><mfenced><mn>2</mn></mfenced><mo>-</mo><mi>L</mi><msub><mi>i</mi><mn>1</mn></msub></mrow></mfenced></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let v be velocity of AB when AB is at a distance x from the wire,<br /><br /><math> <mrow> <msub> <mtext mathvariant=\"italic\">e</mtext> <mtext mathvari lic\">d</mtext> <mtext mathvariant=\"italic\">t</mtext> </mrow> </mfrac> <mo>=</mo> <mn>0</mn> </mrow> </math><br /><br /><math> <mrow> <mo>⇒</mo> <mspace width=\"0.5em\"></mspace> <mtext mathvariant=\"italic\">d</mtext> <mtext mathvariant=\"italic\">q</mtext> <mo>=</mo> <mfrac> <mrow> <mtext mathvariant=\"italic\">d</mtext> <mi>ϕ</mi> <mo>-</mo> <mtext mathvariant=\"italic\">L</mtext> <mtext mathvariant=\"italic\">d</mtext> <mtext mathvariant=\"italic\">i</mtext> </mrow> <mrow> <mtext mathvariant=\"italic\">R</mtext> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mtext mathvariant=\"italic\">Δ</mtext> <mtext mathvariant=\"italic\">q</mtext> <mo>=</mo> <mfrac> <mrow> <mtext mathvariant=\"italic\">Δ</mtext> <mi>ϕ</mi> <mo>-</mo> <mtext mathvariant=\"italic\">L</mtext> <mtext mathvariant=\"italic\">Δ</mtext> <mtext mathvariant=\"italic\">I</mtext> </mrow> <mrow> <mtext mathvariant=\"italic\">R</mtext></mrow></mfrac></mrow></math><br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext mathvariant=\"italic\">R</mtext> </mrow> </mfrac> <mo>[</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext mathvariant=\"italic\">ϕ</mtext> <mn>1</mn> </msub> <mo>-</mo> <msub> <mtext mathvariant=\"italic\">ϕ</mtext> <mn>2</mn> </msub> </mrow> </mfenced> <mo>-</mo> <mtext mathvariant=\"italic\">L</mtext>&nbsp;<mrow><msub><mtext mathvariant=\"italic\">i</mtext> <mn>1</mn> </msub> </mrow> </mfenced> <mo>]</mo> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mspace width=\"0.5em\"></mspace><mtext mathvariant=\"italic\">Δ</mtext><mtext mathvariant=\"italic\">q</mtext><mo>=</mo><mfrac><mn>1</mn><mtext mathvariant=\"italic\">R</mtext></mfrac><mo>[</mo><mfrac><mrow><msub><mtext mathvariant=\"italic\">μ</mtext><mn>0</mn></msub><mi>ℓ</mi><msub><mtext mathvariant=\"italic\">I</mtext><mn>0</mn></msub></mrow><mrow><mn>2</mn><mtext mathvariant=\"italic\">π</mtext></mrow></mfrac><mi>ln</mi><mfenced><mn>2</mn></mfenced><mo>-</mo><mtext mathvariant=\"italic\">L</mtext><msub><mtext mathvariant=\"italic\">i</mtext><mn>1</mn></msub><mo>]</mo></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863391a14b6fe2bfe57", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "16", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the circuit shown below, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>i</mi><mn>1</mn></msub></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>i</mi><mn>2</mn></msub></math>&nbsp;are the steady-state values of the current through <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>1</mn></msub></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>2</mn></msub></math>&nbsp;respectively,&nbsp;then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>i</mi><mn>1</mn></msub></math>&nbsp;is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/30455-5.JPG\" style=\"width: 250px; height: 200px;\" />", "image": null}, "options": [{"id": "FYIC9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>i</mi><mrow><mn>1</mn><mo>=</mo></mrow></msub><mfrac><mrow><mi>E</mi><msub><mi>L</mi><mn>2</mn></msub></mrow><mrow><mi>R</mi><mfenced><mrow><msub><mi>L</mi><mn>1</mn></msub><mo>+</mo><msub><mi>L</mi><mn>2</mn></msub></mrow></mfenced></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "pE9S7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>i</mi><mrow><mn>1</mn><mo>=</mo></mrow></msub><mfrac><mrow><mi>E</mi><msub><mi>L</mi><mn>1</mn></msub></mrow><mrow><mi>R</mi><mfenced><mrow><msub><mi>L</mi><mn>1</mn></msub><mo>+</mo><msub><mi>L</mi><mn>2</mn></msub></mrow></mfenced></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "wAgys", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>i</mi><mrow><mn>1</mn><mo>=</mo></mrow></msub><mfrac><mrow><mi>E</mi><msub><mi>L</mi><mn>2</mn></msub></mrow><mrow><mi>R</mi><msqrt><msub><mi>L</mi><mn>1</mn></msub><msub><mi>L</mi><mn>2</mn></msub></msqrt></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "QBmtV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>i</mi><mrow><mn>1</mn><mo>=</mo></mrow></msub><mfrac><mrow><mi>E</mi><msub><mi>L</mi><mn>1</mn></msub></mrow><mrow><mi>R</mi><msqrt><msub><mi>L</mi><mn>1</mn></msub><msub><mi>L</mi><mn>2</mn></msub></msqrt></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Since the potential difference across the inductors is same, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>1</mn></msub><mfrac><mrow><mi>d</mi><msub><mi>i</mi><mn>1</mn></msub></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><msub><mi>L</mi><mn>2</mn></msub><mfrac><mrow><mi>d</mi><msub><mi>i</mi><mn>2</mn></msub></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>1</mn></msub><mi>d</mi><msub><mi>i</mi><mn>1</mn></msub><mo>=</mo><msub><mi>L</mi><mn>2</mn></msub><mi>d</mi><msub><mi>i</mi><mn>2</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>1</mn></msub><mo>&#8710;</mo><msub><mi>i</mi><mn>1</mn></msub><mo>=</mo><msub><mi>L</mi><mn>2</mn></msub><mo>&#8710;</mo><msub><mi>i</mi><mn>2</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>1</mn></msub><msub><mi>i</mi><mn>1</mn></msub><mo>=</mo><msub><mi>L</mi><mn>2</mn></msub><msub><mi>i</mi><mn>2</mn></msub></math>&nbsp;(Since the initial value of current through both the inductors was zero)&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>i</mi><mn>1</mn></msub><msub><mi>i</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><msub><mi>L</mi><mn>2</mn></msub><msub><mi>L</mi><mn>1</mn></msub></mfrac></math></p><p>The steady current <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>i</mi></math>&nbsp;passing through <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">i</mtext><mo mathvariant=\"italic\">=</mo><mfrac><mtext mathvariant=\"italic\">E</mtext><mtext mathvariant=\"italic\">R</mtext></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>i</mi><mn>1</mn></msub><mo>=</mo><mfenced><mfrac><msub><mi>L</mi><mn>2</mn></msub><mrow><msub><mi>L</mi><mn>1</mn></msub><mo>+</mo><msub><mi>L</mi><mn>2</mn></msub></mrow></mfrac></mfenced><mi>i</mi><mo>=</mo><mfrac><mrow><mi>E</mi><msub><mi>L</mi><mn>2</mn></msub></mrow><mrow><mi>R</mi><mfenced><mrow><msub><mi>L</mi><mn>1</mn></msub><mo>+</mo><msub><mi>L</mi><mn>2</mn></msub></mrow></mfenced></mrow></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
