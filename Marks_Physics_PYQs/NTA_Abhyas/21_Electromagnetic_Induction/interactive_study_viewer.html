, "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/345222.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 168px; height: 159px;\" /><br />from diagram only <math><mi>z</mi></math> component of magnetic field gives flux.<br /><br />Flux through small elemental area<br /><br/><math><mi>d</mi><mi>ϕ</mi><mo>=</mo><mi>a</mi><mi>d</mi><mi>y</mi><mi>&nbsp;</mi><mi>c</mi><mi>y</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mi>ω</mi><mi>t</mi></mrow></mfenced></mrow></mrow></math><br /><br />net flux <math><mo>=</mo><mi>a</mi><mi>c</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>ω</mi><mi>t</mi><mrow><msubsup><mo stretchy=\"false\">∫</mo><mrow><mn>0</mn></mrow><mrow><mi>b</mi></mrow></msubsup><mrow><mi>y</mi><mi>&nbsp;</mi><mi>d</mi><mi>y</mi></mrow></mrow></mrow></mrow></math><br /><br /><math><mi>ϕ</mi><mo>=</mo><mi>a</mi><mi>c</mi><mfrac><mrow><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn></mrow></mfrac><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>ω</mi><mi>t</mi></mrow></mrow></math><br /><br /><math><mo>∴</mo></math> Induced emf in the loop.<br /><br /><math><mi>ε</mi><mo>=</mo><mfrac><mrow><mi>d</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><msub><mrow><mi>ϕ</mi></mrow><mrow><mi>m</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>d</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>.</mo><mfrac><mrow><mi>a</mi><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>c</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>ω</mi><mi>t</mi></mrow></mrow></math><br /><br />Hence, <math><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi>ε</mi></mrow></mfenced><mo>=</mo><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mfrac><mrow><mi>a</mi><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>c</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mi>ω</mi><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>ω</mi><mi>t</mi></mrow></mrow></mrow></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638b507e01e14a98f8", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "25", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A uniform but time-varying magnetic field is present in a circular region of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math>. The magnetic field is perpendicular and into the plane of the paper and the magnitude of the field is increasing at a constant rate <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">α</mi></math>. There is a straight conducting rod of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">R</mi></math> placed as shown in the diagram. The magnitude of induced E.M.F. across the rod is<br />\r<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/22465.JPG\" style=\"width: 200px; height: 161px;\" /></p>\r", "image": null}, "options": [{"id": "J6Sq1", "text": "<math> <mrow> <mi>&pi;</mi> <msup> <mtext>R</mtext> <mn>2</mn> </msup> <mi>&alpha;</mi> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "Akupi", "text": "<math> <mrow> <mfrac> <mrow> <mi>π</mi> <msup> <mtext>R</mtext> <mn>2</mn> </msup> <mi>α</mi> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "0MT9z", "text": "<math> <mrow> <mfrac> <mrow> <msup> <mtext>R</mtext> <mn>2</mn> </msup> <mi>&alpha;</mi> </mrow> <mrow> <msqrt> <mn>2</mn> </msqrt> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "uIzJK", "text": "<math> <mrow> <mfrac> <mrow> <msup> <mrow> <mi>&pi;</mi> <mtext>R</mtext> </mrow> <mn>2</mn> </msup> <mi>&alpha;</mi> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Considering a square loop as shown, E.M.F. across the loop is given by<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>e</mtext><mo>=</mo><mo>&#8750;</mo><mtext>E.dl</mtext><mo>=</mo><mo>-</mo><mfrac><mrow><mtext>d</mtext><mi mathvariant=\"normal\">&#981;</mi></mrow><mtext>dt</mtext></mfrac><mo>=</mo><mo>-</mo><mi mathvariant=\"normal\">A</mi><mfrac><mi>dB</mi><mi>dt</mi></mfrac></math>&nbsp; &nbsp;(where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> = area = <math> <mrow> <mi>&#960;</mi> <msup> <mtext>R</mtext> <mn>2</mn> </msup> </mrow> </math>)<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0022465_AnsExp_1.jpg\" style=\"width: 160px; height: 173px;\" /><br /><br /><math> <mrow> <mo>&#8658;&#160;&#160;&#160;</mo> <mtext>e</mtext> <mo>=</mo> <mo>-</mo> <mi>&#960;</mi> <msup> <mtext>R</mtext> <mn>2</mn> </msup> <mfrac> <mrow> <mtext>dB</mtext> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> <mo>=</mo> <mo>-</mo> <mi>&#960;</mi> <msup> <mtext>R</mtext> <mn>2</mn> </msup> <mi>&#945;</mi> </mrow> </math><br /><br /><math> <mrow> <mo>&#8756;</mo> </mrow> </math>&nbsp;&nbsp;Magnitude of E.M.F. across one side <math> <mrow> <mo>=</mo> <mfrac> <mrow> <mi>&#960;</mi> <msup> <mtext>R</mtext> <mn>2</mn> </msup> <mi>&#945;</mi> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86377da0daa92f123fc", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "46", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A long solenoid of cross-sectional radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;has a thin insulated wire ring of uniform cross-section tightly put on its winding. The ring is made out of two different material such that one half of the ring has a resistance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn></math> times that of the other half. The magnetic induction produced by the solenoid varies with time as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>=</mo><mi>b</mi><mi>t</mi></math>, where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>b</mi></math> is a constant. The magnitude of the electric field strength in the ring (other than the induced electric field) is", "image": null}, "options": [{"id": "W4yve", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><mrow><mn>1</mn><mn>1</mn></mrow></mfrac><mi>R</mi><mi>b</mi></math>", "image": null, "isCorrect": false}, {"id": "4ihzp", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><mrow><mn>2</mn><mn>2</mn></mrow></mfrac><mi>R</mi><mi>b</mi></math>", "image": null, "isCorrect": true}, {"id": "d5rMN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mo>&nbsp;</mo><mi>R</mi><mi>b</mi></math>", "image": null, "isCorrect": false}, {"id": "tXXEA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mi>b</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Let us assume that the current in the ring is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>i</mi></math>&nbsp;and the resistance of the two halves are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mi>r</mi></math>, then by faraday's law</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"|\" open=\"|\"><mfrac><mrow><mi>d</mi><mi>ϕ</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mfenced><mo>=</mo><mi>π</mi><msup><mi>R</mi><mn>2</mn></msup><mi>b</mi><mo>=</mo><mi>i</mi><mi>r</mi><mo>+</mo><mi>i</mi><mfenced><mrow><mn>10</mn><mi>r</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>i</mi><mo>=</mo><mfrac><mrow><mi>π</mi><msup><mi>R</mi><mn>2</mn></msup><mi>b</mi></mrow><mrow><mn>11</mn><mi>r</mi></mrow></mfrac></math></p><p>The induced electric field in both the parts of the ring is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mi>ind</mi></msub><mo>=</mo><mfrac><mi>R</mi><mn>2</mn></mfrac><mfrac><mrow><mi>d</mi><mi>B</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>R</mi><mi>b</mi></mrow><mn>2</mn></mfrac></math></p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/13373_sol_1.JPG\" style=\"width: 130px; height: 163px;\" /><br /><br />Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi></math>&nbsp;be the field which is developed in each part due to charge accumulation at the junctions, then for the upper half</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>E</mi><mrow><mi>i</mi><mi>n</mi><mi>d</mi></mrow></msub><mo>+</mo><mi>E</mi></mrow></mfenced><mi>π</mi><mi>R</mi><mo>=</mo><mi>i</mi><mfenced><mrow><mn>10</mn><mi>r</mi></mrow></mfenced></math></p><p>and for the lower half</p <mi>d</mi><mi>B</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>E</mi><mo>=</mo><mfrac><mi>R</mi><mn>2</mn></mfrac><mfenced><mrow><mn>12</mn><msup><mi>t</mi><mn>2</mn></msup></mrow></mfenced><mo>=</mo><mn>6</mn><mi>R</mi><msup><mi>t</mi><mn>2</mn></msup></math></p><p>When the ring is about to slip,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi><mi>E</mi><mi>R</mi><mo>=</mo><mi mathvariant=\"normal\">&#956;</mi><mi>m</mi><mi>g</mi><mi>R</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>6</mn><mi>q</mi><mi>R</mi><msup><mi>t</mi><mn>2</mn></msup><mo>=</mo><mi>&#956;</mi><mi>m</mi><mi>g</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#956;</mi><mo>=</mo><mfrac><mrow><mn>6</mn><mi>q</mi><mi>R</mi><msup><mi>t</mi><mn>2</mn></msup></mrow><mrow><mi>m</mi><mi>g</mi></mrow></mfrac><mo>=</mo><mfrac><mn>3</mn><mn>4</mn></mfrac><mo>=</mo><mfrac><mn>18</mn><mn>24</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi><mo>=</mo><mn>18</mn></math></p><p>&nbsp;</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86348e19cfc2b7e82ad", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "06", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A conducting circular loop is placed in a uniform magnetic field&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>04</mn><mo>&#160;</mo><mi mathvariant=\"normal\">T</mi></math> with its plane perpendicular to the magnetic field. The radius of the loop starts shrinking at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi>mm</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. The induced emf in the loop, when the radius is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi>cm</mi></math>, is</p>\r", "image": null}, "options": [{"id": "piK2S", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>.</mo><mn>8</mn><mi>&#x3C0;</mi><mo>&#xA0;</mo><mi>&#x3BC;V</mi></math>", "image": null, "isCorrect": false}, {"id": "Qtrjc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>8</mn><mi>&#x3C0;</mi><mo>&#xA0;</mo><mi>&#x3BC;V</mi></math>", "image": null, "isCorrect": false}, {"id": "VZvQj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>6</mn><mi>&#x3C0;</mi><mo>&#xA0;</mo><mi>&#x3BC;V</mi></math>", "image": null, "isCorrect": false}, {"id": "aAmyZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>.</mo><mn>2</mn><mi>&#x3C0;</mi><mo>&#xA0;</mo><mi>&#x3BC;V</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math> <mrow> <mi>ϕ</mi> <mo>=</mo> <mtext>BA</mtext> <mtext>cos</mtext> <mi>θ</mi> <mo>=</mo> <mtext>B</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi>π</mi> <msup> <mtext>r</mtext> <mn>2</mn> </msup> </mrow> </mfenced> <mtext>cos</mtext> <msup> <mn>0</mn> <mo>∘</mo> </msup> <mo>=</mo> <mtext>B</mtext> <mi>π</mi> <msup> <mtext>r</mtext> <mn>2</mn> </msup> </mrow> </math><br /><br /><math> <mrow> <mfenced close=\"|\" open=\"|\" separators=\",\"> <mrow> <mi>ε</mi> </mrow> </mfenced> <mo>=</mo> <mfrac> <mrow> <mtext>d</mtext> <mi>ϕ</mi> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> <mo>=</mo> <mtext>B</mtext> <mi>π</mi> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>2</mn> <mtext>r</mtext> </mrow> </mfen MathML\"><mfrac><mrow><mi>&#x3C0;</mi><msup><mi>r</mi><mn>2</mn></msup><mi>&#x3B1;</mi></mrow><mrow><mn>2</mn><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "k362A", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mi>&#x3C0;</mi><mi>r</mi><mi>&#x3B1;</mi></mrow><mi>R</mi></mfrac></math>", "image": null, "isCorrect": false}, {"id": "lV0xL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn></mn><mi>&#x3C0;</mi><mi>r</mi><mi>&#x3B1;</mi></mrow><mi>R</mi></mfrac></math>", "image": null, "isCorrect": false}, {"id": "SU931", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>&#x3C0;</mi><msup><mi>r</mi><mn>2</mn></msup><mi>&#x3B1;</mi></mrow><mi>R</mi></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The magnitude of the induced emf in the ring is<br /><math><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi>ε</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mi>d</mi><mi mathvariant=\"normal\">ϕ</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>d</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mfenced separators=\"|\"><mrow><mi>B</mi><mi>A</mi></mrow></mfenced><mo>=</mo><mi>A</mi><mfrac><mrow><mi>d</mi><mi>B</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mi>π</mi><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>α</mi></math><br />The induced current in the ring, <math><mi>I</mi><mo>=</mo><mfrac><mrow><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi>ε</mi></mrow></mfenced></mrow><mrow><mi>R</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>π</mi><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>α</mi></mrow><mrow><mi>R</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633797a4ae2612060e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "78", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The circuit shown in the figure consists of two resistances <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>1</mn></msub></math> &amp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>2</mn></msub></math> connected to two ideal voltmetres <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>1</mn></msub></math> &amp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>2</mn></msub></math>. Assume that a voltmeter reads <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∆</mo><mi>V</mi><mo>=</mo><mo>-</mo><munderover><mo>∫</mo><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">b</mi></munderover><mover><mi mathvariant=\"italic\">E</mi><mo mathvariant=\"italic\">→</mo></mover><mo>.</mo><mi mathvariant=\"normal\">d</mi><mover><mi>l</mi><mo>→</mo></mover></math> between its terminals. A time-varying magnetic field&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>(</mo><mi>t</mi><mo>)</mo><mo>=</mo><msub><mi>B</mi><mn>0</mn></msub><mi>t</mi></math>&nbsp;(where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>B</mi><mn>0</mn></msub></math> is a positive constant of proper dimensions and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi></math> is time) exists in a circular region of radius a and it is directed into the plane of the figure. The reading of voltmeter&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>2</mn></msub></math> is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image17-13c290f2-64d0-42fb-bb2d-4b720a15eee2.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"height: 139px; width: 250px;\" />", "image": null}, "options": [{"id": "gLgBK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi mathvariant=\"normal\">&#960;</mi><msup><mi>a</mi><mn>2</mn></msup><msub><mi>B</mi><mn>0</mn></msub><msub><mi>R</mi><mn>1</mn></msub></mrow><mrow><msub><mi>R</mi><mn>1</mn></msub><mo>+</mo><msub><mi>R</mi><mn>2</mn></msub></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "fjATa", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">&#960;</mi><msup><mi>a</mi><mn>2</mn></msup><msub><mi>B</mi><mn>0</mn></msub><msub><mi>R</mi><mn>2</mn></msub></mrow><mrow><msub><mi>R</mi><mn>1</mn></msub><mo>+</mo><msub><mi>R</mi><mn>2</mn></msub></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "M4T38", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">&#960;</mi><msup><mi>a</mi><mn>2</mn></msup><msub><mi>B</mi><mn>0</mn></msub><msub><mi>R</mi><mn>1</mn></msub></mrow><mrow><msub><mi>R</mi><mn>1</mn></msub><mo>+</mo><msub><mi>R</mi><mn>2</mn></msub></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "NXwCf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi mathvariant=\"normal\">&#960;</mi><msup><mi>a</mi><mn>2</mn></msup><msub><mi>B</mi><mn>0</mn></msub><msub><mi>R</mi><mn>2</mn></msub></mrow><mrow><msub><mi>R</mi><mn>1</mn></msub><mo>+</mo><msub><mi>R</mi><mn>2</mn></msub></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#981;</mi><mo>=</mo><mi mathvariant=\"normal\">&#960;</mi><msup><mi>a</mi><mn>2</mn></msup><msub><mi>B</mi><mn>0</mn></msub><mi>t</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#949;</mi><mo>=</mo><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">d</mi><mi>&#981;</mi></mrow><mrow><mi mathvariant=\"normal\">d</mi><mi>t</mi></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">&#949;</mi><mo>=</mo><mi mathvariant=\"normal\">&#960;</mi><msup><mi>a</mi><mn>2</mn></msup><msub><mi>B</mi><mn>0</mn></msub></math> (indeed emf)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>i</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">&#960;</mi><msup><mi>a</mi><mn>2</mn></msup><msub><mi>B</mi><mn>0</mn></msub></mrow><mrow><msub><mi>R</mi><mn>1</mn></msub><mo>+</mo><msub><mi>R</mi><mn>2</mn></msub></mrow></mfrac></math> (induced current)<br /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image18-d43b174f-159e-4de4-9423-c7b6a94c7c45.jpg\" style=\"max-width:100%; object-fit:contain\" /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><msub><mi>V</mi><mn>1</mn></msub><mo>=</mo><mo>-</mo><munderover><mo>&#8747;</mo><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">b</mi></munderover><mover><mi>E</mi><mo>&#8594;</mo></mover><mo>.</mo><mi mathvariant=\"normal\">d</mi><mover><mi mathvariant=\"italic\">l</mi><mo mathvariant=\"italic\">&#8594;</mo></mover><mo>=</mo><mo>-</mo><mfenced separators=\"|\"><mrow><mo>-</mo><mi>i</mi><msub><mi>R</mi><mn>1</mn></msub></mrow></mfenced><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">&#960;</mi><msup><mi>a</mi><mn>2</mn></msup><msub><mi>B</mi><mn>0</mn></msub><msub><mi>R</mi><mn>1</mn></msub></mrow><mrow><msub><mi>R</mi><mn>1</mn></msub><mo>+</mo><msub><mi>R</mi><mn>2</mn></msub></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><msub><mi>V</mi><mn>2</mn></msub><mo>=</mo><mo>-</mo><munderover><mo>&#8747;</mo><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">b</mi></munderover><mover><mi>E</mi><mo>&#8594;</mo></mover><mo>.</mo><mi mathvariant=\"normal\">d</mi><mover><mi mathvariant=\"italic\">l</mi><mo mathvariant=\"italic\">&#8594;</mo></mover><mo>=</mo><mo>-</mo><mfenced separators=\"|\"><mrow><mo>-</mo><mi>i</mi><msub><mi>R</mi><mn>2</mn></msub></mrow></mfenced><mo>=</mo><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">&#960;</mi><msup><mi>a</mi><mn>2</mn></msup><msub><mi>B</mi><mn>0</mn></msub><msub><mi>R</mi><mn>2</mn></msub></mrow><mrow><msub><mi>R</mi><mn>1</mn></msub><mo>+</mo><msub><mi>R</mi><mn>2</mn></msub></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86321515517a8ddb166", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "31", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A ring of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&nbsp;</mo><mi>kg</mi></math>&nbsp;is uniformly charged with a linear charge density&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">λ</mi><mo>=</mo><mn>4</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">C</mi><mo>&nbsp;</mo><msup><mi>cm</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> and kept on a rough horizontal surface with a friction coefficient of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">μ</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">π</mi><mn>4</mn></mfrac></math>. A time-varying magnetic field <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo>=</mo><msub><mi mathvariant=\"normal\">B</mi><mn>0</mn></msub><msup><mi mathvariant=\"normal\">t</mi><mn>2</mn></msup></math> is applied in a circular region of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">a</mi></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">a</mi><mo>&lt;</mo><mi mathvariant=\"normal\">r</mi></mrow></mfenced></math> perpendicular to the plane of the ring as shown in the figure. Find out the time when the ring just starts to rotate on the surface. (take <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">a</mi><mo>=</mo><mn>5</mn><mo>&nbsp;</mo><mi>cm</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">g</mi><mo>=</mo><mn>10</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">B</mi><mn>0</mn></msub><mo>=</mo><mn>125</mn></math> SI units)<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/460398.JPG\" style=\"width: 300px; height: 235px;\" />", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "Induced electric field,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">E</mi><mo>(</mo><mn>2</mn><mi>&#960;r</mi><mo>)</mo><mo>=</mo><mfrac><mi>d&#966;</mi><mi>dt</mi></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">E</mi><mo>=</mo><mfrac><mrow><msup><mi>&#960;a</mi><mn>2</mn></msup><mn>2</mn><msub><mi mathvariant=\"normal\">B</mi><mn>0</mn></msub><mi mathvariant=\"normal\">t</mi></mrow><mrow><mn>2</mn><mi>&#960;r</mi></mrow></mfrac></math><br />Torque due to field about centre of ring,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">&#964;</mi><mn>1</mn></msub><mo>=</mo><mo>(</mo><mi>qE</mi><mo>)</mo><mi mathvariant=\"normal\">r</mi><mo>=</mo><mo>(</mo><mi mathvariant=\"normal\">&#955;</mi><mo>(</mo><mn>2</mn><mi>&#960;r</mi><mo>)</mo><mo>)</mo><mfenced separators=\"|\"><mfrac><mrow><mn>2</mn><msup><mi>&#960;a</mi><mn>2</mn></msup><msub><mi mathvariant=\"normal\">B</mi><mn>0</mn></msub><mi mathvariant=\"normal\">t</mi></mrow><mrow><mn>2</mn><mi>&#960;r</mi></mrow></mfrac></mfenced><mi mathvariant=\"normal\">r</mi></math><br />The ring starts rotating when,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#964;</mi></math> due to electric field <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi mathvariant=\"normal\">&#964;</mi></math> due to friction.<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">&#964;</mi><mn>1</mn></msub><mo>=</mo><mfenced separators=\"|\"><mi>&#956;mg</mi></mfenced><mi mathvariant=\"normal\">r</mi></math><br />Solving,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">t</mi><mo>=</mo><mfrac><mi>&#956;mg</mi><mrow><mn>2</mn><msup><mi>&#960;a</mi><mn>2</mn></msup><msub><mi mathvariant=\"normal\">B</mi><mn>0</mn></msub><mi mathvariant=\"normal\">&#955;</mi></mrow></mfrac><mo>=</mo><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math> .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631c8fb2401f8774f8", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "14", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A conducting circular loop of area <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math> and resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>&nbsp;is placed perpendicular to a uniform time varying magnetic field <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mfenced><mi>t</mi></mfenced><mo>=</mo><mn>0.6</mn><mi>sin</mi><mfenced><mrow><mn>50</mn><mi>&#960;</mi><mi>t</mi></mrow></mfenced><mo>&#160;</mo><mi mathvariant=\"normal\">T</mi></math>.&nbsp;What is the net charge (in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>mC</mi></math>)&nbsp;flowing through the loop during <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>0</mn></math>&nbsp;and&nbsp;<math> <mrow> <mi>t</mi><mo>=</mo><mn>10</mn><mo>&#160;</mo><mtext>ms</mtext></mrow> </math>?", "image": null}, "options": [], "correctValue": "1.5", "solution": {"text": "<p>Net charge&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mi>Δ</mi><mi>ϕ</mi></mrow><mi mathvariant=\"normal\">R</mi></mfrac><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">A</mi><mfenced><mrow><msub><mi mathvariant=\"normal\">B</mi><mn>2</mn></msub><mo>-</mo><msub><mi mathvariant=\"normal\">B</mi><mn>1</mn></msub></mrow></mfenced></mrow><mi mathvariant=\"normal\">R</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced><mrow><mn>2</mn><mo>.</mo><mn>5</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup></mrow></mfenced><mo>(</mo><mn>0</mn><mo>.</mo><mn>6</mn><mo>)</mo><mfenced close=\"]\" open=\"[\"><mrow><mi>sin</mi><mfrac><mrow><mn>50</mn><mi>π</mi><mo>(</mo><mn>10</mn><mo>)</mo></mrow><msup><mn>10</mn><mn>3</mn></msup></mfrac><mo>-</mo><mi>sin</mi><mn>0</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>1</mn><mo>.</mo><mn>5</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mfenced close=\"]\" open=\"[\"><mrow><mi>sin</mi><mfrac><mi>π</mi><mn>2</mn></mfrac><mo>-</mo><mi>sin</mi><mn>0</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>1</mn><mo>.</mo><mn>5</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mi mathvariant=\"normal\">C</mi><mo>=</mo><mn>1</mn><mo>.</mo><mn>5</mn><mi>mC</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86306db245cd2416fba", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "42", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>LC</mi></math> circuit shown below, the current is in direction as shown and the charges on the capacitor plates have the sign as shown. At this instant<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/dsfadsfad.JPG\" style=\"width: 180px; height: 127px;\" />", "image": null}, "options": [{"id": "0c6dQ", "text": "<math><mi>I</mi></math> is increasing <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math> is increasing", "image": null, "isCorrect": false}, {"id": "h34yP", "text": "<math><mi>I</mi></math> is increasing <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math> is decreasing", "image": null, "isCorrect": false}, {"id": "PmkNU", "text": "<math><mi>I</mi></math> is decreasing <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math> is increasing", "image": null, "isCorrect": true}, {"id": "7zpai", "text": "<math><mi>I</mi></math> is decreasing and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math> is decreasing", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As clearly ‘<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math>’ is increasing so electric field energy in capacitor must be increasing. And hence, magnetic field energy in inductor must be decreasing. So <math><mi>I</mi></math> is decreasing.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863001e636bf85dd162", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "08", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A square loop <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mi>F</mi><mi>G</mi><mi>H</mi></math>&nbsp;of side <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math>, mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>&nbsp;and total resistance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;is falling under gravity in a region of transverse non-uniform magnetic field given by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>=</mo><msub><mi>B</mi><mn>0</mn></msub><mfrac><mi>y</mi><mi>a</mi></mfrac></math>,&nbsp;where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>B</mi><mn>0</mn></msub></math>&nbsp;is a positive constant and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math>&nbsp;is the position of side <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mi>F</mi></math>&nbsp;of the loop. If at some instant the speed of the loop is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math>, then the total Lorentz&nbsp;force acting on the loop is</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0009083_Ques1_1..jpg\" style=\"width: 300px; height: 173px;\" /></p>\r", "image": null}, "options": [{"id": "t79Gf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><mfrac><mrow><msubsup><mi>B</mi><mn>0</mn><mn>2</mn></msubsup><msup><mi>a</mi><mn>2</mn></msup><mi>v</mi></mrow><mrow><mn>2</mn><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "mHfpV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><mfrac><mrow><mn>2</mn><msubsup><mi>B</mi><mn>0</mn><mn>2</mn></msubsup><msup><mi>a</mi><mn>2</mn></msup><mi>v</mi></mrow><mi>R</mi></mfrac></math>", "image": null, "isCorrect": false}, {"id": "UZL1R", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><mfrac><mrow><msubsup><mi>B</mi><mn>0</mn><mn>2</mn></msubsup><msup><mi>a</mi><mn>2</mn></msup><mi>v</mi></mrow><mi>R</mi></mfrac></math>", "image": null, "isCorrect": true}, {"id": "d1DEg", "text": "zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Motional emf in EH and FG = 0 as&nbsp;<math> <mrow> <mover accent=\"true\"> <mtext>v</mtext> <mo>&#8594;</mo> </mover> <mo>||</mo> <mover accent=\"true\"> <mtext>I</mtext> <mo>&#8594;</mo> </mover> </mrow> </math></p><p>Motional emf in EF is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">e</mi><mn>1</mn></msub><mo>=</mo><mfenced><mfrac><mrow><msub><mtext>B</mtext><mn>0</mn></msub><mtext>y</mtext></mrow><mtext>a</mtext></mfrac></mfenced><mfenced><mtext>a</mtext></mfenced><mn>v</mn><mo>&#8289;</mo><mo>=</mo><msub><mtext>B</mtext><mn>0</mn></msub><mtext>y</mtext><mn>v</mn><mo>&#8289;</mo></math></p><p>Similarly, motional emf in GH will be<br />&nbsp;<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext>e</mtext><mn>2</mn></msub><mo>=</mo><mfenced open=\"{\" close=\"}\"><mfrac><mrow><msub><mtext>B</mtext><mn>0</mn></msub><mfenced><mrow><mtext>y</mtext><mo>+</mo><mtext>a</mtext></mrow></mfenced></mrow><mtext>a</mtext></mfrac></mfenced><mfenced><mtext>a</mtext></mfenced><mfenced><mrow><mn>v</mn><mo>&#8289;</mo></mrow></mfenced><mo>=</mo><msub><mtext>B</mtext><mn>0</mn></msub><mfenced><mrow><mtext>y</mtext><mo>+</mo><mtext>a</mtext></mrow></mfenced><mn>v</mn><mo>&#8289;</mo></math><br />&nbsp;<br />Polarities of e<sub>1</sub>and e<sub>2</sub> are shown in adjoining figures.<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0009084_AnsExp3_2.jpg\" style=\"width: 288px; height: 351px;\" /></p><p>So the net emf is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">e</mi><mo>=</mo><msub><mi mathvariant=\"normal\">e</mi><mn>2</mn></msub><mo>-</mo><msub><mi mathvariant=\"normal\">e</mi><mn>1</mn></msub><mspace linebreak=\"newline\"/><mi mathvariant=\"normal\">e</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><msub><mi mathvariant=\"normal\">B</mi><mn>0</mn></msub><mi>av</mi></math><br /><math> <mrow> <mtext>i</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>e</mtext> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>B</mtext> <mn>0</mn> </msub> <mtext>a</mtext> <mi></mi><mi></mi><mi></mi><mn>v</mn><mo>&#8289;</mo> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </math>&nbsp;</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0009084_AnsExp3_3.jpg\" style=\"width: 255px; height: 242px;\" /><br /><math> <mrow> <msub> <mtext>F</mtext> <mtext>EF</mtext> </msub> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <msub> <mtext>B</mtext> <mn>0</mn> </msub> <mtext>a</mtext> <mn>v</mn><mo>&#8289;</mo> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>a</mtext> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <msub> <mtext>B</mtext> <mn>0</mn> </msub> <mtext>y</mtext> </mrow> <mrow> <mtext>a</mtext> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math>&nbsp;(downwards)</p><p><math> <mrow> <msub> <mtext>F</mtext> <mtext>GH</mtext> </msub> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <msub> <mtext>B</mtext> <mn>0</mn> </msub> <mtext>a</mtext> <mi></mi><mi></mi><mn>v</mn><mo>&#8289;</mo> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>a</mtext> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <msub> <mtext>B</mtext> <mn>0</mn> </msub> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>y</mtext> <mo>+</mo> <mtext>a</mtext> </mrow> </mfenced> </mrow> <mrow> <mtext>a</mtext> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math>&nbsp;<br />&nbsp;<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext>F</mtext><mtext>GH</mtext></msub><mo>=</mo><mfenced><mfrac><mrow><msubsup><mtext>B</mtext><mn>0</mn><mn>2</mn></msubsup><mtext>a</mtext><mn>v</mn><mo>&#8289;</mo></mrow><mtext>R</mtext></mfrac></mfenced><mfenced><mrow><mtext>y</mtext><mo>+</mo><mtext>a</mtext></mrow></mfenced></math>&nbsp; (upwards)</p><p>Net Lorentz force on the loop<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">F</mi><mi>net</mi></msub><mo>=</mo><msub><mtext>F</mtext><mtext>GH</mtext></msub><mo>-</mo><msub><mtext>F</mtext><mtext>EF</mtext></msub><mo>=</mo><mfrac><mrow><msubsup><mtext>B</mtext><mn>0</mn><mn>2</mn></msubsup><msup><mtext>a</mtext><mn>2</mn></msup><mn>v</mn><mo>&#8289;</mo></mrow><mtext>R</mtext></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><mfrac><mrow><msubsup><mi>B</mi><mn>0</mn><mn>2</mn></msubsup><msup><mi>a</mi><mn>2</mn></msup><mi>v</mi></mrow><mi>R</mi></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "6aa3ab79aa8dc1ff68178046", "title": "Induced Electric Field", "totalQuestions": 12, "questions": [{"_id": "6151e863fa92301515ffa802", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "41", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>Two long coaxial solenoids of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>R</mi></math>&nbsp;have equal number of turns per unit length. They carry time-varying currents <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>i</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn><mi>k</mi><mi>t</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>i</mi><mn>2</mn></msub><mo>=</mo><mi>k</mi><mi>t</mi></math>&nbsp;respectively, in the same direction. A point charge released between the solenoids at a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>,&nbsp;is seen to move along a circular path. Then the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>&nbsp;is</p>\r\r<p><br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image25-599a3643-d830-48a4-93bf-a20e678ac4cb.png\" style=\"height: 161px; width: 160px;\" /></p>\r", "image": null}, "options": [{"id": "riSMQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><mi>R</mi><msqrt><mn>2</mn></msqrt></math>", "image": null, "isCorrect": true}, {"id": "XtBvQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><mfrac bevelled=\"true\"><mrow><mn>3</mn><mi>R</mi></mrow><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "krLB9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><mi>R</mi><msqrt><mn>3</mn></msqrt></math>", "image": null, "isCorrect": false}, {"id": "OLjN4", "text": "It can be any value between&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>R</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The magnetic field due to the inner solenoid (within its volume) is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>B</mi><mn>1</mn></msub><mo>=</mo><msub><mi>&#956;</mi><mn>0</mn></msub><mi>n</mi><mfenced><mrow><mn>2</mn><mi>k</mi><mi>t</mi></mrow></mfenced></math></p><p>The magnetic field due to the outer solenoid (within its volume) is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>B</mi><mn>2</mn></msub><mo>=</mo><msub><mi>&#956;</mi><mn>0</mn></msub><mi>n</mi><mfenced><mrow><mi>k</mi><mi>t</mi></mrow></mfenced></math></p><p>The flux of magnetic field through the circular area of radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>&nbsp;is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#981;</mi><mo>=</mo><msub><mi>B</mi><mn>1</mn></msub><mi>&#960;</mi><msup><mi>R</mi><mn>2</mn></msup><mo>+</mo><msub><mi>B</mi><mn>2</mn></msub><mi>&#960;</mi><msup><mi>r</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#981;</mi><mo>=</mo><mi>&#960;</mi><msub><mi>&#956;</mi><mn>0</mn></msub><mi>n</mi><mi>k</mi><mi>t</mi><mfenced><mrow><mn>2</mn><msup><mi>R</mi><mn>2</mn></msup><mo>+</mo><msup><mi>r</mi><mn>2</mn></msup></mrow></mfenced></math></p><p>If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>E</mi><mo>&#8594;</mo></mover></math>&nbsp;is the induced electric field at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>, then</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8750;</mo><mover><mi>E</mi><mo>&#8594;</mo></mover><mo>.</mo><mi>d</mi><mover><mi>r</mi><mo>&#8594;</mo></mover><mo>=</mo><mo>-</mo><mfrac><mrow><mi>d</mi><mi>&#981;</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>E</mi><mo>&#215;</mo><mn>2</mn><mi>&#960;</mi><mi>r</mi><mo>=</mo><mi>&#960;</mi><msub><mi>&#956;</mi><mn>0</mn></msub><mi>n</mi><mi>k</mi><mfenced><mrow><mn>2</mn><msup><mi>R</mi><mn>2</mn></msup><mo>+</mo><msup><mi>r</mi><mn>2</mn></msup></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>E</mi><mo>=</mo><msub><mi>&#956;</mi><mn>0</mn></msub><mi>n</mi><mi>k</mi><mfenced><mrow><mfrac><msup><mi>R</mi><mn>2</mn></msup><mi>r</mi></mfrac><mo>+</mo><mfrac><mi>r</mi><mn>2</mn></mfrac></mrow></mfenced></math></p><p>The radius of the circle traversed by the&nbsp;charged particle is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><mfrac><mrow><mi>m</mi><mi>v</mi></mrow><mrow><mi>q</mi><msub><mi>B</mi><mn>2</mn></msub></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mi>E</mi><mfrac><mrow><mi>q</mi><mi>t</mi></mrow><mi>m</mi></mfrac><mo>=</mo><msub><mi>&#956;</mi><mn>0</mn></msub><mi>n</mi><mi>k</mi><mfenced><mrow><mfrac><msup><mi>R</mi><mn>2</mn></msup><mi>r</mi></mfrac><mo>+</mo><mfrac><mi>r</mi><mn>2</mn></mfrac></mrow></mfenced><mfrac><mrow><mi>q</mi><mi>t</mi></mrow><mi>m</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>&#956;</mi><mn>0</mn></msub><mi>n</mi><mi>k</mi><mfenced><mrow><mfrac><msup><mi>R</mi><mn>2</mn></msup><mi>r</mi></mfrac><mo>+</mo><mfrac><mi>r</mi><mn>2</mn></mfrac></mrow></mfenced><mfrac><mrow><mi>q</mi><mi>t</mi></mrow><mi>m</mi></mfrac><mo>=</mo><mfrac><mrow><mi>q</mi><mi>r</mi><msub><mi>B</mi><mn>2</mn></msub></mrow><mi>m</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>&#956;</mi><mn>0</mn></msub><mi>n</mi><mi>k</mi><mi>t</mi><mfenced><mrow><mfrac><msup><mi>R</mi><mn>2</mn></msup><mi>r</mi></mfrac><mo>+</mo><mfrac><mi>r</mi><mn>2</mn></mfrac></mrow></mfenced><mo>=</mo><mi>r</mi><msub><mi>&#956;</mi><mn>0</mn></msub><mi>n</mi><mi>k</mi><mi>t</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>R</mi><mn>2</mn></msup><mo>+</mo><mfrac><msup><mi>r</mi><mn>2</mn></msup><mn>2</mn></mfrac><mo>=</mo><msup><mi>r</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>r</mi><mo>=</mo><mi>R</mi><msqrt><mn>2</mn></msqrt></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d8cfb28d3e04db18", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "107", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A long solenoid of the cross-sectional radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;has a thin insulated wire ring tightly put on its winding. One half of the ring has the resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn></math> times that of the other half. The magnetic induction produced by the solenoid varies with time as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mi>b</mi><mi>t</mi></math>, whose b is a constant. If the magnitude of the electric field strength in the ring is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>p</mi><mi>q</mi></mfrac><mi>R</mi><mi>b</mi></math>, where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi></math>&nbsp;are the smallest positive integers, then what is the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>p</mi><mo>+</mo><mi>q</mi></mrow></mfenced></math>?", "image": null}, "options": [], "correctValue": "31", "solution": {"text": "Both upper half and lower half will have same effective area of&nbsp;<math> <mrow> <mfrac> <mrow> <mi>π</mi> <msup> <mrow> <mi></mi><mi></mi><mi></mi><mi>R</mi><mo>⁡</mo> </mrow> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math>&nbsp;so charge in flux will be same and induced emf will have some value. But since the resistance is different due to which current must be different but ring is as a whole is closed circuit so electric field will be generated to make the current flow in both parts to be same.<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013373_AnsExp_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 116px; height: 122px;\" /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013373_AnsExp_2.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 117px; height: 136px;\" /><br /><br /><math> <mrow> <mi>ε</mi> <mo>+</mo> <mi></mi><mi></mi><mi>E</mi><mo>⁡</mo> <mi>π</mi> <mi></mi><mi></mi><mi></mi><mi>R</mi><mo>⁡</mo> <mo>-</mo> <mi></mi><mi></mi><mi>i</mi><mo>⁡</mo> <mn>1</mn> <mn>0</mn> <mi></mi><mi></mi><mi>r</mi><mo>⁡</mo> <mo>=</mo> <mn>0</mn> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mo>…</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi></mi><mi></mi><mi>i</mi><mo>⁡</mo> </mrow> </mfenced> </mrow> </math><br /><br /><math> <mrow> <mi>ε</mi> <mo>-</mo> <mi></mi><mi></mi><mi>E</mi><mo>⁡</mo> <mi>π</mi> <mi></mi><mi></mi><mi></mi><mi>R</mi><mo>⁡</mo> <mo>-</mo> <mi></mi><mi></mi><mi>i</mi><mo>⁡</mo><mi></mi><mi></mi><mi>r</mi><mo>⁡</mo> <mo>=</mo> <mn>0</mn> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mo>…</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi></mi><mi></mi><mi>i</mi><mo>⁡</mo> <mi></mi><mi></mi><mi>i</mi><mo>⁡</mo> </mrow> </mfenced> </mrow> </math><br /><br /><math> <mrow> <mo>⇒</mo> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mn>2</mn> <mi>E</mi> <mi>π</mi> <mi></mi><mi></mi><mi>R</mi><mo>⁡</mo> <mo>-</mo> <mn>9</mn> <mi></mi><mi></mi><mi>i</mi><mo>⁡</mo> <mi></mi><mi></mi><mi>r</mi><mo>⁡</mo> <mo>=</mo> <mn>0</mn> </mrow> </math><br /><br /><math> <mrow> <mi></mi><mi></mi><mi>E</mi><mo>⁡</mo> <mo>=</mo> <mfrac> <mrow> <mn>9</mn> <mtext>i</mtext> <mtext>r</mtext> </mrow> <mrow> <mn>2</mn> <mi>π</mi> <mi></mi><mi></mi><mi>R</mi><mo>⁡</mo> </mrow> </mfrac> <mo>⇒</mo> <mi></mi><mi></mi><mi>i</mi><mo>⁡</mo> <mo>=</mo> <mfrac> <mrow> <mi></mi><mi></mi><mi>E</mi><mo>⁡</mo> </mrow> <mrow> <mn>1</mn> <mn>1</mn> <mi></mi><mi></mi><mi>r</mi><mo>⁡</mo> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mi>π</mi> <msup> <mrow> <mi></mi><mi></mi><mi>R</mi><mo>⁡</mo> </mrow> <mn>2</mn> </msup> <mi>b</mi> </mrow> <mrow> <mn>1</mn> <mn>1</mn> <mi></mi><mi></mi><mi>r</mi><mo>⁡</mo> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>⇒</mo> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mi></mi><mi></mi><mi>E</mi><mo>⁡</mo> <mo>=</mo> <mfrac> <mrow> <mn>9</mn> <mtext>r</mtext> </mrow> <mrow> <mn>2</mn> <mi>π</mi> <mi></mi><mi></mi><mi>R</mi><mo>⁡</mo> </mrow> </mfrac> <mo>×</mo> <mfrac> <mrow> <mi>π</mi> <msup> <mrow> <mi></mi><mi></mi><mi>R</mi><mo>⁡</mo> </mrow> <mn>2</mn> </msup> <mi>b</mi> </mrow> <mrow> <mn>1</mn> <mn>1</mn> <mi></mi><mi></mi><mi>r</mi><mo>⁡</mo> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>9</mn> </mrow> <mrow> <mn>2</mn> <mn>2</mn> </mrow> </mfrac> <mtext>Rb</mtext> </mrow> </math><br /><br />∴&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <mn>9</mn> </mrow> <mrow> <mn>2</mn> <mn>2</mn> </mrow> </mfrac> <mtext>Rb</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b1b56aa971ab0a61", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "03", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The magnetic flux through a circuit of resistance <math> <mtext>R</mtext> </math> changes by an amount <math> <mrow> <mo>Δ</mo> <mi>ϕ</mi> </mrow> </math> in a time <math> <mrow> <mo>Δ</mo> <mtext>t</mtext> </mrow> </math>. Then the total quantity of electric charge <math> <mtext>Q</mtext> </math>, that passes through any point in the circuit during this&nbsp;<math><mrow><mo>Δ</mo> <mtext>t</mtext> </mrow> </math> time is, represented by", "image": null}, "options": [{"id": "MwZpR", "text": "<math> <mrow> <mtext>Q</mtext> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> <mfrac> <mrow> <mo>&Delta;</mo> <mi>ϕ</mi> </mrow> <mrow> <mo>&Delta;</mo> <mtext>t</mtext> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "bxCt2", "text": "<math> <mrow> <mtext>Q</mtext> <mo>=</mo> <mfrac> <mrow> <mo>Δ</mo> <mi>ϕ</mi> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "ScR0G", "text": "<math> <mrow> <mtext>Q</mtext> <mo>=</mo> <mfrac> <mrow> <mo>&Delta;</mo> <mi>ϕ</mi> </mrow> <mrow> <mo>&Delta;</mo> <mtext>t</mtext> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "ZVgxW", "text": "<math> <mrow> <mtext>Q</mtext> <mo>=</mo> <mtext>R</mtext> <mfrac> <mrow> <mo>&Delta;</mo> <mi>ϕ</mi> </mrow> <mrow> <mo>&Delta;</mo> <mtext>t</mtext> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Induced emf is given by <math> <mrow> <mi>ε</mi> <mo>=</mo> <mfrac> <mrow> <mo>Δ</mo> <mi>ϕ</mi> </mrow> <mrow> <mo>Δ</mo> <mtext>t</mtext> </mrow> </mfrac> </mrow> </math><br /><br />Current, <math> <mrow> <mtext>I</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>Q</mtext> </mrow> <mrow> <mo>Δ</mo> <mtext>t</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mo>Δ</mo> <mi>ϕ</mi> </mrow> <mrow> <mo>Δ</mo> <mtext>t</mtext> </mrow> </mfrac> <mo>×</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </math>&nbsp;&nbsp;[where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Q</mi></math> is total charge passed in time <math> <mrow> <mo>Δ</mo> <mtext>t</mtext> </mrow> </math>]<br /><br /><math> <mrow> <mo>⇒&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</mo> <mtext>Q</mtext> <mo>=</mo> <mfrac> <mrow> <mo>Δ</mo> <mi>ϕ</mi> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "correct", "lastPracticed": "2024-12-20T12:54:35.574Z"}, {"_id": "6151e8638b507e01e14a98f8", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "25", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A uniform but time-varying magnetic field is present in a circular region of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math>. The magnetic field is perpendicular and into the plane of the paper and the magnitude of the field is increasing at a constant rate <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">α</mi></math>. There is a straight conducting rod of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">R</mi></math> placed as shown in the diagram. The magnitude of induced E.M.F. across the rod is<br />\r<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/22465.JPG\" style=\"width: 200px; height: 161px;\" /></p>\r", "image": null}, "options": [{"id": "J6Sq1", "text": "<math> <mrow> <mi>&pi;</mi> <msup> <mtext>R</mtext> <mn>2</mn> </msup> <mi>&alpha;</mi> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "Akupi", "text": "<math> <mrow> <mfrac> <mrow> <mi>π</mi> <msup> <mtext>R</mtext> <mn>2</mn> </msup> <mi>α</mi> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "0MT9z", "text": "<math> <mrow> <mfrac> <mrow> <msup> <mtext>R</mtext> <mn>2</mn> </msup> <mi>&alpha;</mi> </mrow> <mrow> <msqrt> <mn>2</mn> </msqrt> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "uIzJK", "text": "<math> <mrow> <mfrac> <mrow> <msup> <mrow> <mi>&pi;</mi> <mtext>R</mtext> </mrow> <mn>2</mn> </msup> <mi>&alpha;</mi> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Considering a square loop as shown, E.M.F. across the loop is given by<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>e</mtext><mo>=</mo><mo>&#8750;</mo><mtext>E.dl</mtext><mo>=</mo><mo>-</mo><mfrac><mrow><mtext>d</mtext><mi mathvariant=\"normal\">&#981;</mi></mrow><mtext>dt</mtext></mfrac><mo>=</mo><mo>-</mo><mi mathvariant=\"normal\">A</mi><mfrac><mi>dB</mi><mi>dt</mi></mfrac></math>&nbsp; &nbsp;(where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> = area = <math> <mrow> <mi>&#960;</mi> <msup> <mtext>R</mtext> <mn>2</mn> </msup> </mrow> </math>)<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0022465_AnsExp_1.jpg\" style=\"width: 160px; height: 173px;\" /><br /><br /><math> <mrow> <mo>&#8658;&#160;&#160;&#160;</mo> <mtext>e</mtext> <mo>=</mo> <mo>-</mo> <mi>&#960;</mi> <msup> <mtext>R</mtext> <mn>2</mn> </msup> <mfrac> <mrow> <mtext>dB</mtext> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> <mo>=</mo> <mo>-</mo> <mi>&#960;</mi> <msup> <mtext>R</mtext> <mn>2</mn> </msup> <mi>&#945;</mi> </mrow> </math><br /><br /><math> <mrow> <mo>&#8756;</mo> </mrow> </math>&nbsp;&nbsp;Magnitude of E.M.F. across one side <math> <mrow> <mo>=</mo> <mfrac> <mrow> <mi>&#960;</mi> <msup> <mtext>R</mtext> <mn>2</mn> </msup> <mi>&#945;</mi> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86377da0daa92f123fc", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "46", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A long solenoid of cross-sectional radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;has a thin insulated wire ring of uniform cross-section tightly put on its winding. The ring is made out of two different material such that one half of the ring has a resistance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn></math> times that of the other half. The magnetic induction produced by the solenoid varies with time as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>=</mo><mi>b</mi><mi>t</mi></math>, where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>b</mi></math> is a constant. The magnitude of the electric field strength in the ring (other than the induced electric field) is", "image": null}, "options": [{"id": "W4yve", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><mrow><mn>1</mn><mn>1</mn></mrow></mfrac><mi>R</mi><mi>b</mi></math>", "image": null, "isCorrect": false}, {"id": "4ihzp", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><mrow><mn>2</mn><mn>2</mn></mrow></mfrac><mi>R</mi><mi>b</mi></math>", "image": null, "isCorrect": true}, {"id": "d5rMN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mo>&nbsp;</mo><mi>R</mi><mi>b</mi></math>", "image": null, "isCorrect": false}, {"id": "tXXEA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mi>b</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Let us assume that the current in the ring is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>i</mi></math>&nbsp;and the resistance of the two halves are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mi>r</mi></math>, then by faraday's law</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"|\" open=\"|\"><mfrac><mrow><mi>d</mi><mi>ϕ</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mfenced><mo>=</mo><mi>π</mi><msup><mi>R</mi><mn>2</mn></msup><mi>b</mi><mo>=</mo><mi>i</mi><mi>r</mi><mo>+</mo><mi>i</mi><mfenced><mrow><mn>10</mn><mi>r</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>i</mi><mo>=</mo><mfrac><mrow><mi>π</mi><msup><mi>R</mi><mn>2</mn></msup><mi>b</mi></mrow><mrow><mn>11</mn><mi>r</mi></mrow></mfrac></math></p><p>The induced electric field in both the parts of the ring is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mi>ind</mi></msub><mo>=</mo><mfrac><mi>R</mi><mn>2</mn></mfrac><mfrac><mrow><mi>d</mi><mi>B</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>R</mi><mi>b</mi></mrow><mn>2</mn></mfrac></math></p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/13373_sol_1.JPG\" style=\"width: 130px; height: 163px;\" /><br /><br />Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi></math>&nbsp;be the field which is developed in each part due to charge accumulation at the junctions, then for the upper half</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>E</mi><mrow><mi>i</mi><mi>n</mi><mi>d</mi></mrow></msub><mo>+</mo><mi>E</mi></mrow></mfenced><mi>π</mi><mi>R</mi><mo>=</mo><mi>i</mi><mfenced><mrow><mn>10</mn><mi>r</mi></mrow></mfenced></math></p><p>and for the lower half</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>E</mi><mrow><mi>i</mi><mi>n</mi><mi>d</mi></mrow></msub><mo>-</mo><mi>E</mi></mrow></mfenced><mi>π</mi><mi>R</mi><mo>=</mo><mi>i</mi><mi>r</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>2</mn><mi>E</mi><mi>π</mi><mi>R</mi><mo>-</mo><mn>9</mn><mi>i</mi><mi>r</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mo>=</mo><mfrac><mrow><mn>9</mn><mi>i</mi><mi>r</mi></mrow><mrow><mn>2</mn><mi>π</mi><mi>R</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>E</mi><mo>=</mo><mfrac><mrow><mn>9</mn><mi>r</mi></mrow><mrow><mn>2</mn><mi>π</mi><mi>R</mi></mrow></mfrac><mo>×</mo><mfrac><mrow><mi>π</mi><msup><mi>R</mi><mn>2</mn></msup><mi>b</mi></mrow><mrow><mn>1</mn><mn>1</mn><mi>r</mi></mrow></mfrac><mo>=</mo><mfrac><mn>9</mn><mrow><mn>2</mn><mn>2</mn></mrow></mfrac><mi>R</mi><mi>b</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86376fe0776ef923e0b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "26", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In a magnetic field of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0.05</mn><mtext>&nbsp;T</mtext></math>, area of a coil changes from <math> <mrow> <mn>101</mn><msup> <mrow> <mtext>&nbsp;cm</mtext></mrow> <mn>2</mn> </msup> </mrow> </math> to <math> <mrow> <mn>100</mn><msup> <mrow> <mtext>&nbsp;cm</mtext></mrow> <mn>2</mn> </msup> </mrow> </math> without changing the resistance which is <math> <mrow> <mn>2&nbsp;</mn><mn>Ω</mn></mrow></math>. The amount of charge that flows during this period is", "image": null}, "options": [{"id": "eydM6", "text": "<math> <mrow> <mn>2</mn> <mo>·</mo> <mn>5</mn> <mo>×</mo><msup> <mrow> <mn>10</mn></mrow> <mrow> <mo>−</mo><mn>6</mn></mrow> </msup> <mtext>&nbsp;C</mtext></mrow> </math>", "image": null, "isCorrect": true}, {"id": "fyKMP", "text": "<math> <mrow>  <mn>2</mn><mo>&#x00D7;</mo><msup>   <mrow>    <mn>10</mn></mrow>   <mrow>    <mo>&#x2212;</mo><mn>6</mn></mrow>  </msup>  <mtext>&nbsp;C</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "cFTdC", "text": "<math> <mrow>  <msup>   <mrow>    <mn>10</mn></mrow>   <mrow>    <mo>&#x2212;</mo><mn>6</mn></mrow>  </msup>  <mtext>&nbsp;C</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "CbPf9", "text": "<math> <mrow>  <mn>8</mn><mo>&#x00D7;</mo><msup>   <mrow>    <mn>10</mn></mrow>   <mrow>    <mo>&#x2212;</mo><mn>6</mn></mrow>  </msup>  <mtext>&nbsp;C</mtext></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo>=</mo><mtext>0.05</mtext><mo>&#160;</mo><mi mathvariant=\"normal\">T</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">A</mi><mn>1</mn></msub><mo>=</mo><mn>101</mn><mtext>&#8201;</mtext><mtext>&#8201;</mtext><msup><mtext>cm</mtext><mn>2</mn></msup><mo>=</mo><mn>101</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>&#8722;</mo><mn>4</mn></mrow></msup><mtext>&#8201;</mtext><mtext>&#8201;</mtext><msup><mtext>m</mtext><mn>2</mn></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">A</mi><mn>2</mn></msub><mo>=</mo><mn>100</mn><mtext>&#8201;</mtext><mtext>&#8201;</mtext><msup><mtext>cm</mtext><mn>2</mn></msup><mo>=</mo><mn>100</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>&#8722;</mo><mn>4</mn></mrow></msup><mtext>&#8201;</mtext><mtext>&#8201;</mtext><msup><mtext>m</mtext><mn>2</mn></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi><mo>=</mo><mn>2</mn><mtext>&#8201;&#8201;</mtext><mi mathvariant=\"normal\">&#937;</mi></math><br /><br />Amount of charge flown is given by,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">q</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">B</mi><mrow><mo>(</mo><mi mathvariant=\"normal\">&#916;</mi><mtext>&#8201;</mtext><mi mathvariant=\"normal\">A</mi><mo>)</mo></mrow></mrow><mi mathvariant=\"normal\">R</mi></mfrac></math><br /><br />&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mtext>0.05</mtext><mo>&#215;</mo><mfenced><mrow><mn>1</mn><mn>0</mn><mn>1</mn><mo>&#215;</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup><mo>-</mo><mn>1</mn><mn>0</mn><mn>0</mn><mo>&#215;</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup></mrow></mfenced></mrow><mn>2</mn></mfrac></math><br /><br />&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mtext>0.05</mtext><mo>&#215;</mo><mn>1</mn><mo>&#215;</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup></mrow><mn>2</mn></mfrac></math><br /><br />&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mtext>2.5</mtext><mo>&#215;</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup><mo>&#160;</mo><mn>C</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86363a31f76ea32451a", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "80", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A non-conducting ring of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>4</mn><mo>&nbsp;</mo><mi>kg</mi></math> and radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>10</mn><mo>&nbsp;</mo><mi>cm</mi></math> has a charge <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>=</mo><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">C</mi></math> uniformly distributed over its circumference. The ring is placed on a rough horizontal surface such that the plane of the ring is parallel to the surface. A vertical magnetic field <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>=</mo><mn>4</mn><msup><mi>t</mi><mn>3</mn></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">T</mi></math> is switched on at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>0</mn></math>. At <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">s</mi></math> ring starts to rotate about the vertical axis through the centre. The coefficient of friction between the ring and the surface is found to be <math><mfrac><mrow><mi>k</mi></mrow><mrow><mn>24</mn></mrow></mfrac></math>. Then the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi></math>&nbsp;is", "image": null}, "options": [], "correctValue": "18", "solution": {"text": "<p>The induced electric field at the periphery of the ring is</p><p><math><mi>E</mi><mo>=</mo><mfrac><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mfrac><mrow><mi>d</mi><mi>B</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>E</mi><mo>=</mo><mfrac><mi>R</mi><mn>2</mn></mfrac><mfenced><mrow><mn>12</mn><msup><mi>t</mi><mn>2</mn></msup></mrow></mfenced><mo>=</mo><mn>6</mn><mi>R</mi><msup><mi>t</mi><mn>2</mn></msup></math></p><p>When the ring is about to slip,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi><mi>E</mi><mi>R</mi><mo>=</mo><mi mathvariant=\"normal\">&#956;</mi><mi>m</mi><mi>g</mi><mi>R</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>6</mn><mi>q</mi><mi>R</mi><msup><mi>t</mi><mn>2</mn></msup><mo>=</mo><mi>&#956;</mi><mi>m</mi><mi>g</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#956;</mi><mo>=</mo><mfrac><mrow><mn>6</mn><mi>q</mi><mi>R</mi><msup><mi>t</mi><mn>2</mn></msup></mrow><mrow><mi>m</mi><mi>g</mi></mrow></mfrac><mo>=</mo><mfrac><mn>3</mn><mn>4</mn></mfrac><mo>=</mo><mfrac><mn>18</mn><mn>24</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi><mo>=</mo><mn>18</mn></math></p><p>&nbsp;</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863456c722f98ea7c11", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "106", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the figure, a conducting rod of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi><mo>=</mo><mn>1</mn></math> meter and mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>=</mo><mn>1</mn><mo>&nbsp;</mo><mi>kg</mi></math> moves with an initial velocity, u <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> . On a fixed horizontal frame containing inductor <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi><mo>=</mo><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">H</mi></math> and resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Ω</mi></math> . PQ and MN are smooth, conducting wires. There is a uniform magnetic field of strength <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>=</mo><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">T</mi></math>. Initially, there is no current in the inductor. Find the total charge in coulomb, flown through the inductor by the time velocity of the rod becomes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>f</mi></msub><mo>=</mo><mo>&nbsp;</mo><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&nbsp;</mo></math>and the rod has travelled a distance <math><mi>x</mi><mo>=</mo><mn>3</mn></math> meter.<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/bthdwwfbbrpimuqqccspulwfixlnwqxhbzjuunrdaudwllmflc.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"height: 99px; width: 180px;\" />", "image": null}, "options": [], "correctValue": "1", "solution": {"text": "Let <math><msub><mrow><mi>i</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi>i</mi></mrow><mrow><mn>2</mn></mrow></msub></math> be the current through <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> at any time <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>i</mi><mo>=</mo><msub><mi>i</mi><mn>1</mn></msub><mo>+</mo><msub><mi>i</mi><mn>2</mn></msub><mi>&#160;</mi><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mfrac><mrow><mi>B</mi><mi>l</mi><mi>v</mi></mrow><mi>R</mi></mfrac><mo>=</mo><msub><mi>i</mi><mn>2</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mi>l</mi><mi>v</mi><mo>=</mo><mi>L</mi><mfrac><mrow><mi>d</mi><msub><mi>i</mi><mn>1</mn></msub></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math><br /><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ucfalkacpnruylqigvlfvzxgafflidgldyrdzfiftrkkzvirkr.jpeg\" style=\"max-width:100%; object-fit:contain\" /><br /><br />Force on conducting rod <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>m</mi><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mi>i</mi><mi>l</mi><mi>B</mi><mo>=</mo><mo>-</mo><mfenced separators=\"|\"><mrow><msub><mi>i</mi><mn>1</mn></msub><mo>+</mo><mfrac><mrow><mi>B</mi><mi>l</mi><mi>v</mi></mrow><mi>R</mi></mfrac></mrow></mfenced><mi>l</mi><mi>B</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>m</mi><mi>d</mi><mi>v</mi><mo>=</mo><mi mathvariant=\"script\">&#160;</mi><mo>-</mo><mi>l</mi><mi>B</mi><mi>&#160;</mi><msub><mi>i</mi><mn>1</mn></msub><mi>d</mi><mi>t</mi><mo>-</mo><mfrac><mrow><msup><mi>B</mi><mn>2</mn></msup><msup><mi>l</mi><mn>2</mn></msup></mrow><mi>R</mi></mfrac><mi>v</mi><mi>&#160;</mi><mi>d</mi><mi>t</mi><mi>&#160;</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>m</mi><mo>&#8747;</mo><mi>d</mi><mi>v</mi><mo>=</mo><mo>-</mo><mi>l</mi><mi>B</mi><mi>&#160;</mi><mo>&#8747;</mo><msub><mi>i</mi><mn>1</mn></msub><mi>d</mi><mi>t</mi><mo>-</mo><mfrac><mrow><msup><mi>B</mi><mn>2</mn></msup><msup><mi>l</mi><mn>2</mn></msup></mrow><mi>R</mi></mfrac><mi>&#160;</mi><mo>&#8747;</mo><mi>v</mi><mi>&#160;</mi><mi>d</mi><mi>t</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>m</mi><mfenced separators=\"|\"><mrow><msub><mi>v</mi><mi>f</mi></msub><mo>-</mo><mi>u</mi></mrow></mfenced><mo>=</mo><mo>-</mo><mi>l</mi><mi>B</mi><mi>Q</mi><mo>-</mo><mfrac><mrow><msup><mi>B</mi><mn>2</mn></msup><msup><mi>l</mi><mn>2</mn></msup></mrow><mi>R</mi></mfrac><mi>x</mi></math><br /><br />( <math><msub><mrow><mi>v</mi></mrow><mrow><mn> 1998/Math/MathML\"><mn>4</mn><mo>&nbsp;</mo><mi>kg</mi></math>&nbsp;is uniformly charged with a linear charge density&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">λ</mi><mo>=</mo><mn>4</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">C</mi><mo>&nbsp;</mo><msup><mi>cm</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> and kept on a rough horizontal surface with a friction coefficient of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">μ</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">π</mi><mn>4</mn></mfrac></math>. A time-varying magnetic field <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo>=</mo><msub><mi mathvariant=\"normal\">B</mi><mn>0</mn></msub><msup><mi mathvariant=\"normal\">t</mi><mn>2</mn></msup></math> is applied in a circular region of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">a</mi></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">a</mi><mo>&lt;</mo><mi mathvariant=\"normal\">r</mi></mrow></mfenced></math> perpendicular to the plane of the ring as shown in the figure. Find out the time when the ring just starts to rotate on the surface. (take <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">a</mi><mo>=</mo><mn>5</mn><mo>&nbsp;</mo><mi>cm</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">g</mi><mo>=</mo><mn>10</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">B</mi><mn>0</mn></msub><mo>=</mo><mn>125</mn></math> SI units)<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/image
