, "question": {"text": "Initially, the air in an open vessel is maintained at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. Later on, the&nbsp;vessel is heated to a temperature&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math>, so that one-fourth mass of air escapes from the vessel. If the volume of the vessel remains constant during heating, the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> is", "image": null}, "options": [{"id": "iuKRl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>80</mn><mo>&#xA0;</mo><mo>&#xB0;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}, {"id": "jo6ON", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>444</mn><mo>&#xA0;</mo><mo>&#xB0;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}, {"id": "Gd3VQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>333</mn><mo>&#xA0;</mo><mo>&#xB0;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}, {"id": "Pv09w", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>171</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>Since it is an open vessel of constant volume, the pressure and volume of the gas remain constant but the number of moles and the temperature changes.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>V</mi><mo>=</mo><msub><mi>n</mi><mn>1</mn></msub><mi>R</mi><msub><mi>T</mi><mn>1</mn></msub><mo>=</mo><msub><mi>n</mi><mn>2</mn></msub><mi>R</mi><msub><mi>T</mi><mn>2</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><msub><mi>T</mi><mn>2</mn></msub><msub><mi>T</mi><mn>1</mn></msub></mfrac><mo>=</mo><mfrac><msub><mi>n</mi><mn>1</mn></msub><msub><mi>n</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><mn>1</mn><mstyle displaystyle=\"true\"><mfrac bevelled=\"true\"><mn>3</mn><mn>4</mn></mfrac></mstyle></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><msub><mi>T</mi><mn>1</mn></msub><mo>=</mo><mfrac><mn>4</mn><mstyle displaystyle=\"true\"><mn>3</mn></mstyle></mfrac><mo>×</mo><mfenced><mrow><mn>60</mn><mo>+</mo><mn>273</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mn>444</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi><mo>≡</mo><mn>171</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b5cd9c4912745758", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "40", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The temperature of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math> moles of a gas at constant volume is changed from&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>120</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. The change in internal energy is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>80</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi></math>. The total heat capacity of the gas at constant volume (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">J</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>) is", "image": null}, "options": [{"id": "T49ev", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn></math>", "image": null, "isCorrect": false}, {"id": "VfHbi", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>", "image": null, "isCorrect": true}, {"id": "ZKQeZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0.8</mn></math>", "image": null, "isCorrect": false}, {"id": "wHaNe", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0.4</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Number of moles <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>=</mo><mn>5</mn><mi mathvariant=\"normal\">&#160;</mi><mi>mol</mi><mo>,</mo><mo>&#160;&#160;</mo><mi mathvariant=\"normal\">&#160;</mi><msub><mi>T</mi><mn>1</mn></msub><mo>=</mo><mn>100</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mn>120</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi><mo>,</mo><mo>&#160;&#160;</mo><mo>&#8710;</mo><mi>U</mi><mo>=</mo><mn>80</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">J</mi></math></p><p>Rise in temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>T</mi><mo>=</mo><mn>120</mn><mo>-</mo><mn>100</mn><mo>=</mo><mn>20</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>U</mi><mo>=</mo><mi>m</mi><mi>s</mi><mo>&#8710;</mo><mi>T</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>80</mn><mo>=</mo><mn>5</mn><mo>&#215;</mo><msub><mi>M</mi><mn>0</mn></msub><mo>&#215;</mo><mi>s</mi><mo>&#215;</mo><mn>20</mn></math>, where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>M</mi><mn>0</mn></msub></math>&nbsp;is the molar mass</p><p>The heat capacity is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>=</mo><mn>5</mn><msub><mi>M</mi><mn>0</mn></msub><mi>s</mi><mo>=</mo><mn>4</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b422217b98d0d034", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "18", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>&nbsp;moles of an ideal gas undergoes a process&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>→</mo><mi>B</mi></math>&nbsp;as shown in the diagram. The maximum temperature of the gas during the process is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029664_Question.jpg\" style=\"width: 180px; height: 169px;\" />", "image": null}, "options": [{"id": "M46sz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><msub><mtext>P</mtext><mn>0</mn></msub><msub><mtext>V</mtext><mn>0</mn></msub></mrow><mrow><mn>2</mn><mtext mathvariant=\"italic\">nR</mtext></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "wIxlR", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>9</mn><msub><mtext>P</mtext><mn>0</mn></msub><msub><mtext>V</mtext><mn>0</mn></msub></mrow><mrow><mn>4</mn><mtext mathvariant=\"italic\">nR</mtext></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "fkHnf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>9</mn><msub><mtext>P</mtext><mn>0</mn></msub><msub><mtext>V</mtext><mn>0</mn></msub></mrow><mrow><mn>2</mn><mtext mathvariant=\"italic\">nR</mtext></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "IK7XH", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>9</mn><msub><mtext>P</mtext><mn>0</mn></msub><msub><mtext>V</mtext><mn>0</mn></msub></mrow><mtext mathvariant=\"italic\">nR</mtext></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since the P-V graph of the process is a straight line and two points (V<sub>0</sub>, 2P<sub>0</sub>) and (2V<sub>0</sub>, P<sub>0</sub>) are known, its equation will be<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mtext mathvariant=\"italic\">P</mtext><mo>-</mo><msub><mtext>P</mtext><mn>0</mn></msub></mrow></mfenced><mo>=</mo><mfrac><mfenced><mrow><mn>2</mn><msub><mtext>P</mtext><mn>0</mn></msub><mo>-</mo><msub><mtext>P</mtext><mn>0</mn></msub></mrow></mfenced><mfenced><mrow><msub><mtext>V</mtext><mn>0</mn></msub><mo>-</mo><mn>2</mn><msub><mtext>V</mtext><mn>0</mn></msub></mrow></mfenced></mfrac><mfenced><mrow><mtext mathvariant=\"italic\">V</mtext><mo>-</mo><mn>2</mn><msub><mtext>V</mtext><mn>0</mn></msub></mrow></mfenced><mo>=</mo><mfrac><msub><mtext>P</mtext><mn>0</mn></msub><msub><mtext>V</mtext><mn>0</mn></msub></mfrac><mfenced><mrow><mn>2</mn><msub><mtext>V</mtext><mn>0</mn></msub><mo>-</mo><mtext mathvariant=\"italic\">V</mtext></mrow></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</mo><mtext mathvariant=\"italic\">P</mtext><mo>=</mo><mn>3</mn><msub><mtext>P</mtext><mn>0</mn></msub><mo>-</mo><mfrac><mrow><msub><mtext>P</mtext><mn>0</mn></msub><mtext mathvariant=\"italic\">V</mtext></mrow><msub><mtext>V</mtext><mn>0</mn></msub></mfrac></math><br /><br />According to the equation for an ideal gas,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">T</mtext><mo mathvariant=\"italic\">=</mo><mfrac><mtext mathvariant=\"italic\">pV</mtext><mtext mathvariant=\"italic\">nR</mtext></mfrac></math><br /><br />&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced><mrow><mn>3</mn><msub><mtext>P</mtext><mn>0</mn></msub><mo>-</mo><mfrac><mrow><msub><mtext>P</mtext><mn>0</mn></msub><mtext mathvariant=\"italic\">V</mtext></mrow><msub><mtext>V</mtext><mn>0</mn></msub></mfrac></mrow></mfenced><mfrac><mtext mathvariant=\"italic\">V</mtext><mtext mathvariant=\"italic\">nR</mtext></mfrac></math><br /><br />&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>3</mn><msub><mtext>P</mtext><mn>0</mn></msub><msub><mtext>V</mtext><mn>0</mn></msub><mtext mathvariant=\"italic\">V</mtext><mo>-</mo><msub><mtext>P</mtext><mn>0</mn></msub><msup><mtext mathvariant=\"italic\">V</mtext><mn>2</mn></msup></mrow><mrow><mtext mathvariant=\"italic\">nR</mtext><msub><mtext>V</mtext><mn>0</mn></msub></mrow></mfrac></math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(i)<br /><br />For&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> to maximum, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mtext mathvariant=\"italic\">dT</mtext><mtext mathvariant=\"italic\">dV</mtext></mfrac><mo>=</mo><mn>0</mn></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><msub><mtext>P</mtext><mn>0</mn></msub><msub><mtext>V</mtext><mn>0</mn></msub><mo>-</mo><mn>2</mn><msub><mtext>P</mtext><mn>0</mn></msub><mtext mathvariant=\"italic\">V</mtext><mo>=</mo><mn>0</mn></math><br /><br />or&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">V</mtext><mo>=</mo><mfrac><mrow><mn>3</mn><msub><mtext>V</mtext><mn>0</mn></msub></mrow><mn>2</mn></mfrac></math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(ii)<br /><br />Putting this value in Eq. (i), we get<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">T</mtext><mtext>max</mtext></msub><mo>=</mo><mfrac><mrow><mn>3</mn><msub><mtext>P</mtext><mn>0</mn></msub><msub><mtext>V</mtext><mn>0</mn></msub><mfenced><mfrac><mrow><mn>3</mn><msub><mtext>V</mtext><mn>0</mn></msub></mrow><mn>2</mn></mfrac></mfenced><mo>-</mo><msub><mtext>P</mtext><mn>0</mn></msub><mfenced><mrow><mfrac><mn>9</mn><mn>4</mn></mfrac><msubsup><mtext>V</mtext><mn>0</mn><mn>2</mn></msubsup></mrow></mfenced></mrow><mrow><mtext mathvariant=\"italic\">nR</mtext><msub><mtext>V</mtext><mn>0</mn></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>9</mn><msub><mtext>P</mtext><mn>0</mn></msub><msub><mtext>V</mtext><mn>0</mn></msub></mrow><mrow><mn>4</mn><mtext mathvariant=\"italic\">nR</mtext></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b08ce3e36ba312b4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "18", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "One mole of oxygen gas is made to undergo a process in which its molar heat capacity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math> depends on its absolute temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">C</mtext><mo mathvariant=\"italic\">=</mo><mi>&#945;</mi><mtext mathvariant=\"italic\">T</mtext></math>, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi></math>&nbsp;is a positive constant. Work done by the gas when heated from an initial temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>0</mn></msub></math> to a final temperature&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mi>T</mi><mn>0</mn></msub></math>&nbsp;will be", "image": null}, "options": [{"id": "r0ZEf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi>&#x3B1;</mi><msubsup><mi>T</mi><mn>0</mn><mn>2</mn></msubsup></math>", "image": null, "isCorrect": false}, {"id": "m0yOw", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>&#x3B1;</mi><msub><mi>T</mi><mn>0</mn></msub><mo>-</mo><mi>R</mi></mrow></mfenced><mfrac><mrow><mn>3</mn><msub><mi>T</mi><mn>0</mn></msub></mrow><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "xTVXv", "text": "<math> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>3</mn> <mi>α</mi> <msub> <mtext>T</mtext> <mn>0</mn> </msub> <mo>-</mo> <mn>5</mn> <mtext>R</mtext> </mrow> </mfenced> <mfrac> <mrow> <msub> <mtext>T</mtext> <mn>0</mn> </msub> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "ECoOG", "text": "none of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>=</mo><msub><mi>C</mi><mi>v</mi></msub><mo>+</mo><msup><mi>W</mi><mo>'</mo></msup></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>W</mi><mo>'</mo><mo>=</mo><mfrac><mrow><mi>d</mi><mi>W</mi></mrow><mrow><mi>n</mi><mi>d</mi><mi>T</mi></mrow></mfrac></math>&nbsp; &nbsp; &nbsp;(where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>'</mo></math> is the work done by the gas per unit mole per unit rise in temperature)<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>W</mi><mo>'</mo></msup><mo>=</mo><mi>&#945;</mi><mi>T</mi><mo>-</mo><msub><mi>C</mi><mi>v</mi></msub><mo>=</mo><mi>&#945;</mi><mi>T</mi><mo>-</mo><mfenced><mrow><mn>5</mn><mi>R</mi><mo>/</mo><mn>2</mn></mrow></mfenced></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#916;</mo><mi>W</mi><mo>=</mo><mo>&#8747;&#160;</mo><msup><mi>W</mi><mo>'</mo></msup><mi>d</mi><mi>T</mi><mo>=</mo><munderover><mo>&#8747;</mo><msub><mi>T</mi><mn>0</mn></msub><mrow><mn>2</mn><msub><mi>T</mi><mn>0</mn></msub></mrow></munderover><mfenced><mrow><mi>&#945;</mi><mi>T</mi><mo>-</mo><mfrac><mrow><mn>5</mn><mi>R</mi></mrow><mn>2</mn></mfrac></mrow></mfenced><mi>d</mi><mi>T</mi></math><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced><mrow><mn>3</mn><mi>&#945;</mi><msub><mi>T</mi><mn>0</mn></msub><mo>-</mo><mn>5</mn><mi>R</mi></mrow></mfenced><mfrac><msub><mi>T</mi><mn>0</mn></msub><mn>2</mn></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863aef58a0b12be0c22", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "73", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Figure shows the variation of the internal energy&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>U</mi></math> with the density <math><mi>ρ</mi></math> of an ideal monoatomic gas for a thermodynamic process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math>. Process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math> is a part of a rectangular hyperbola. Find the work done (in joule) by gas in process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math>.<br />\r<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image7-ee0d7435-c2b9-4703-a198-5777a838d4e3.jpg\" style=\"max-width:\"100%\"; object-fit:contain\" />", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image8-959f520c-de99-4620-b142-d7ea67aea52a.png\" style=\"max-width:\"100%\"; object-fit:contain\" /><br /><br />Suppose final internal energy is <math><mi>x</mi></math><br /><br />Process AB is isobaric process<br /><br /><math><msub><mrow><mi>U</mi></mrow><mrow><mi>&#961;</mi></mrow></msub></math> = constant<br /><br /><math><mn>2</mn><mo>&#215;</mo><mi>x</mi><mo>=</mo><mn>5</mn><mi>&#160;</mi><mo>&#215;</mo><mn>2</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>5</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math><br /><br />In process AB<br /><br /><math><mi mathvariant=\"normal\">&#916;</mi><mi>U</mi><mo>=</mo><mfrac><mrow><mi>n</mi><mi>f</mi><mi>R</mi><mi mathvariant=\"normal\">&#916;</mi><mi>T</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><br />n = number of mole<br /><br />f = degree of freedom<br /><br /><math><mi mathvariant=\"normal\">&#916;</mi><mi>T</mi></math> = Change in temperature<br /><br /><math><mn>5</mn><mo>-</mo><mn>2</mn><mo>=</mo><mfrac><mrow><mi>n</mi><mi>&#160;</mi><mo>&#215;</mo><mn>3</mn><mi>&#160;</mi><mo>&#215;</mo><mi>R</mi><mi>&#160;</mi><mo>&#215;</mo><mi mathvariant=\"normal\">&#916;</mi><mi>T</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><br /><math><mfrac><mrow><mn>6</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>=</mo><mi>n</mi><mi>R</mi><mi mathvariant=\"normal\">&#916;</mi><mi>T</mi></math><br /><br /><math><mn>2</mn><mo>=</mo><mi>n</mi><mi>R</mi><mi mathvariant=\"normal\">&#916;</mi><mi>T</mi></math><br /><br />Work done <math><mo>=</mo><mi>&#160;</mi><mrow><mo stretchy=\"false\">&#8747;</mo><mrow><mi>P</mi><mi>d</mi><mi>V</mi></mrow></mrow></math><br /><br /><math><mo>=</mo><mi>P</mi><mi mathvariant=\"normal\">&#916;</mi><mi>V</mi></math><br /><br /><math><mo>=</mo><mi>n</mi><mi>R</mi><mi mathvariant=\"normal\">&#916;</mi><mi>T</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ab29e0c25f41b524", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "03", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The temperature of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>&nbsp;moles of an ideal gas is increased from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi>T</mi></math> through a process for which pressure <math> <mrow> <mi>P</mi><mo>=</mo><mi>a</mi><msup> <mi>T</mi> <mrow> <mo>−</mo><mn>1</mn> </mrow> </msup> </mrow> </math>, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math> is a constant. The work done by the gas is", "image": null}, "options": [{"id": "yzm9w", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn></mn><mi>n</mi><mi>R</mi><mi>T</mi></math>", "image": null, "isCorrect": false}, {"id": "vpa6x", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi>n</mi><mi>R</mi><mi>T</mi></math>", "image": null, "isCorrect": false}, {"id": "Dmagl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>n</mi><mi>R</mi><mi>T</mi></math>", "image": null, "isCorrect": false}, {"id": "r5haN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mi>n</mi><mi>R</mi><mi>T</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to ideal gas equation<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <mi>P</mi><mi>V</mi><mo>=</mo><mi>n</mi><mi>R</mi><mi>T</mi></mrow> </math><br /><br /><math> <mrow> <mtext>or</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>V</mi><mo>⁡</mo> <mo>=</mo> <mfrac> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>n</mi><mi>R</mi><mi>T</mi><mo>⁡</mo> </mrow> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>P</mi><mo>⁡</mo> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>∵</mo> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>P</mi><mo>⁡</mo> <mo>=</mo> <mfrac> <mrow> <mi>a</mi> </mrow> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>T</mi><mo>⁡</mo> </mrow> </mfrac> <mspace width=\"0.5em\"></mspace> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>Given</mtext> </mrow> </mfenced> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mo>…</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>i</mtext> </mrow> </mfenced> </mrow> </math><br /><br /><math> <mrow> <mo>∵</mo> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>V</mi><mo>⁡</mo> <mo>=</mo> <mfrac> <mrow> <mi>n</mi> <mi></mi><mi></mi><mi>R</mi><mo>⁡</mo> <msup> <mrow> <mi></mi><mi></mi><mi>T</mi><mo>⁡</mo> </mrow> <mn>2</mn> </msup> </mrow> <mrow> <mi>a</mi> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>⇒&nbsp;&nbsp;&nbsp;&nbsp;</mo> <mtext mathvariant=\"italic\">dV</mtext> <mo>=</mo> <mfrac> <mrow> <mo>2nRT </mo></mrow> <mrow> <mtext mathvariant=\"italic\">a</mtext> </mrow> </mfrac> <mtext mathvariant=\"italic\">dT</mtext> </mrow> </math><br /><br />Work done by the gas, <math> <mrow> <mtext>dW&nbsp;=&nbsp;PdV</mtext> </mrow> </math><br /><br /><math> <mrow> <mtext>or&nbsp;&nbsp;</mtext> <mtext mathvariant=\"italic\">W</mtext> <mo>=</mo> <mspace width=\"0.5em\"></mspace> <munderover> <mo>∫</mo> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>T</mi><mo>⁡</mo> </mrow> <mrow> <mn>4</mn> <mi></mi><mi></mi><mi></mi><mi></mi><mi>T</mi><mo>⁡</mo> </mrow> </munderover> <mfrac> <mrow> <mi>a</mi> </mrow> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi>T</mi><mo>⁡</mo> </mrow> </mfrac> <mfrac> <mrow> <mn>2</mn> <mi>n</mi> <mi></mi><mi>R</mi><mo>⁡</mo> <mrow> <mi></mi><mi>T</mi><mo>⁡</mo> </mrow> </mrow> <mrow> <mi>a</mi> </mrow> </mfrac> <mi></mi><mi></mi><mi></mi><mi>d</mi><mi>T</mi><mo>⁡</mo> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mo>…</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>Using (i) and (ii)</mtext> </mrow> </mfenced> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math> <mrow> <mo>=</mo> <msubsup> <mrow> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mn>2</mn> <mi></mi><mi>n</mi><mo>⁡</mo> <mi></mi><mi>R</mi><mo>⁡</mo> <mi></mi><mi>T</mi><mo>⁡</mo> </mrow> </mfenced> </mrow> <mrow> <mi></mi><mi></mi><mi>T</mi><mo>⁡</mo> </mrow> <mrow> <mn>4</mn> <mi></mi><mi></mi><mi>T</mi><mo>⁡</mo> </mrow> </msubsup> <mo>=</mo> <mn>6</mn> <mi>n</mi> <mi></mi><mi>R</mi><mi>T</mi><mo>⁡</mo> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863aabe0b1a1716ca9e", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "84", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "During an adiabatic process, the pressure of a gas is found to be proportional to the cube of its absolute temperature. The value of ratio&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>C</mi><mi mathvariant=\"normal\">P</mi></msub><msub><mi>C</mi><mi mathvariant=\"normal\">V</mi></msub></mfrac></math>&nbsp; for the gas is", "image": null}, "options": [], "correctValue": "1.5", "solution": {"text": "<p>In an adiabatic process, <math> <mrow> <msup> <mtext mathvariant=\"italic\">T</mtext> <mi>&#947;</mi> </msup> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>constant</mtext> </mrow> </mfenced> <msup> <mtext mathvariant=\"italic\">P</mtext> <mrow> <mi>&#947;</mi> <mo>-</mo> <mn>1</mn> </mrow> </msup> </mrow> </math><br />or&nbsp;&nbsp;<math>&#160; <mrow> <msup> <mtext mathvariant=\"italic\">T</mtext> <mrow> <mi>&#947;</mi> <mo>/</mo> <mi>&#947;</mi> <mo>-</mo> <mn>1</mn> </mrow> </msup> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>constant</mtext> </mrow></mfenced><mtext mathvariant=\"italic\">&#160;P</mtext> </mrow> </math><br /><br />Given&nbsp;<math> <mrow> <msup> <mtext mathvariant=\"italic\">T</mtext> <mn>3</mn> </msup> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>constant</mtext> </mrow> </mfenced> <mtext mathvariant=\"italic\">&#160;P</mtext> </mrow> </math><br /><br /><math> <mrow> <mo>&#8756;</mo> </mrow> </math>&nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <mi>&#947;</mi> </mrow> <mrow> <mi>&#947;</mi> <mo>-</mo> <mn>1</mn> </mrow> </mfrac> <mo>=</mo> <mn>3</mn> <mo>&#8658;</mo> <mn>3</mn> <mi>&#947;</mi> <mo>-</mo> <mn>3</mn> <mo>=</mo> <mi>&#947;</mi> </mrow> </math><br /><br />or&nbsp;&nbsp;<math>&#160; <mrow> <mn>2</mn> <mi>&#947;</mi> <mo>=</mo> <mn>3</mn> <mo>&#8658;</mo> <mi>&#947;</mi> <mo>=</mo> <mn>3</mn> <mo>/</mo> <mn>2</mn></mrow></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mfrac><msub><mi>C</mi><mi mathvariant=\"normal\">p</mi></msub><msub><mi>C</mi><mi mathvariant=\"normal\">v</mi></msub></mfrac><mo>=</mo><mn>1</mn><mo>.</mo><mn>5</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a992dee6c60ae384", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "63", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "During an adiabatic process, the pressure of an ideal gas is found to be proportional to the cube of its absolute temperature. The ratio <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">p</mi></msub><msub><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">v</mi></msub></mfrac></math> for the gas is&nbsp;", "image": null}, "options": [{"id": "gSUo5", "text": "<math> <mrow> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "5Nh8O", "text": "<math> <mrow> <mfrac> <mrow> <mn>4</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "GWuue", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "MfN4D", "text": "<math> <mrow> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given <math> <mrow> <mtext>P</mtext> <mo>&prop;</mo> <msup> <mtext>T</mtext> <mn>3</mn> </msup> </mrow> </math>. But for adiabatic process <math> <mrow> <mtext>P</mtext> <mo>&prop;</mo> <msup> <mtext>T</mtext> <mrow> <mi>&gamma;</mi> <mo>/</mo> <mi>&gamma;</mi> <mo>-</mo> <mn>1</mn> </mrow> </msup> </mrow> </math>. So,<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <mi>&gamma;</mi> </mrow> <mrow> <mi>&gamma;</mi> <mo>-</mo> <mn>1</mn> </mrow> </mfrac> <mo>=</mo> <mn>3</mn> <mo>&rArr;</mo> <mi>&gamma;</mi> <mo>=</mo> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>&rArr;</mo> <mfrac> <mrow> <msub> <mtext>C</mtext> <mtext>p</mtext> </msub> </mrow> <mrow> <msub> <mtext>C</mtext> <mtext>v</mtext> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a5c6964f0e15819d", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "71", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "There is a sample of diatomic gas in a container (whose volume is constant). The temperature of this gas was increased greatly so some molecules fell into atoms (dissociated). The pressure of the gas increased by a factor of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn></math> and the internal energy of the gas increased to a value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>.</mo><mn>4</mn><mo>&nbsp;</mo><mi>times</mi></math> the original internal energy. By what factor did the temperature of the gas (measured in Kelvin) increase?", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "<p> <math><semantics><mrow><mi>P</mi><mi>V</mi><mo>=</mo><mi>n</mi><mi>R</mi><mi>T</mi></mrow></semantics></math> ; <math><semantics><mrow><mn>6</mn><mi>P</mi><mi>V</mi><mo>=</mo><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>n</mi><mn>2</mn></msub><mo>+</mo><mn>2</mn><msub><mi>n</mi><mn>2</mn></msub><mo form=\"postfix\" stretchy=\"false\">)</mo><mi>R</mi><mi>T</mi><mi>′</mi><mo accent=\"false\">⇒</mo><mn>6</mn><mo>=</mo><mfrac><mrow><msub><mi>n</mi><mn>2</mn></msub><mo>+</mo><mn>2</mn><msub><mi>n</mi><mn>2</mn></msub></mrow><mi>n</mi></mfrac><mfrac><msup><mi>T</mi><mi>′</mi></msup><mi>T</mi></mfrac></mrow></semantics></math> ... (i)</p><p> <math><semantics><mrow><mi>U</mi><mo>=</mo><mi>n</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mfrac><mn>5</mn><mn>2</mn></mfrac><mi>R</mi><mi>T</mi><mo form=\"postfix\" stretchy=\"false\">)</mo></mrow></semantics></math> ; <math><semantics><mrow><mn>4.4</mn><mi>U</mi><mo>=</mo><msub><mi>n</mi><mn>2</mn></msub><mo form=\"prefix\" stretchy=\"false\">(</mo><mfrac><mn>5</mn><mn>2</mn></mfrac><mi>R</mi><mi>T</mi><mi>′</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>+</mo><mn>2</mn><msub><mi>n</mi><mn>2</mn></msub><mo form=\"prefix\" stretchy=\"false\">(</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>R</mi><mi>T</mi><mi>′</mi><mo form=\"postfix\" stretchy=\"false\">)</mo></mrow></semantics></math> </p><p> <math><semantics><mrow><mn>4.4</mn><mo>=</mo><mfrac><mrow><mi>n</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mfrac><mn>5</mn><mn>2</mn></mfrac><mi>R</mi><msup><mi>T</mi><mi>′</mi></msup><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>+</mo><msub><mi>n</mi><mn>2</mn></msub><mn>3</mn><mi>R</mi><msup><mi>T</mi><mi>′</mi></msup></mrow><mrow><mi>n</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mfrac><mn>5</mn><mn>2</mn></mfrac><mi>R</mi><mi>T</mi><mo form=\"postfix\" stretchy=\"false\">)</mo></mrow></mfrac></mrow></semantics></math> <math><semantics><mrow><mn>4.4</mn><mo>=</mo><mfrac><mrow><msub><mi>n</mi><mn>1</mn></msub><mo>+</mo><mfrac><mn>6</mn><mn>5</mn></mfrac><msub><mi>n</mi><mn>2</mn></msub></mrow><mi>n</mi></mfrac><mfrac><msup><mi>T</mi><mi>′</mi></msup><mi>T</mi></mfrac></mrow></semantics></math> ... (ii)</p><p> <math><semantics><mrow><mfrac><mn>6</mn><mn>4.4</mn></mfrac><mo>=</mo><mfrac><mrow><msub><mi>n</mi><mn>1</mn></msub><mo>+</mo><mn>2</mn><msub><mi>n</mi><mn>2</mn></msub></mrow><mrow><msub><mi>n</mi><mn>1</mn></msub><mo>+</mo><mfrac><mn>6</mn><mn>5</mn></mfrac><msub><mi>n</mi><mn>2</mn></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>5</mn><msub><mi>n</mi><mn>1</mn></msub><mo>+</mo><mn>10</mn><msub><mi>n</mi><mn>2</mn></msub></mrow><mrow><mn>5</mn><msub><mi>n</mi><mn>1</mn></msub><mo>+</mo><mn>6</mn><msub><mi>n</mi><mn>2</mn></msub></mrow></mfrac></mrow></semantics></math> ; <math><semantics><mrow><mn>30</mn><mspace width=\"0.167em\"></mspace><msub><mi>n</mi><mn>1</mn></msub><mo>+</mo><mn>36</mn><mspace width=\"0.167em\"></mspace><msub><mi>n</mi><mn>2</mn></msub><mo>=</mo><mn>22</mn><mspace width=\"0.167em\"></mspace><msub><mi>n</mi><mn>1</mn></msub><mo>+</mo><mn>44</mn><msub><mi>n</mi><mn>2</mn></msub></mrow></semantics></math> ; <math><semantics><mrow><mn>8</mn><mspace width=\"0.167em\"></mspace><msub><mi>n</mi><mn>1</mn></msub><mo>=</mo><mn>8</mn><mspace width=\"0.167em\"></mspace><msub><mi>n</mi><mn>2</mn></msub><mo accent=\"false\">⇒</mo><mtext mathvariant=\"normal\">  </mtext><msub><mi>n</mi><mn>1</mn></msub><mo>=</mo><msub><mi>n</mi><mn>2</mn></msub></mrow></semantics></math> </p><p>Also, <math><semantics><mrow><msub><mi>n</mi><mn>1</mn></msub><mo>+</mo><msub><mi>n</mi><mn>2</mn></msub><mo>=</mo><mi>n</mi><mo accent=\"false\">⇒</mo><msub><mi>n</mi><mn>1</mn></msub><mo>=</mo><msub><mi>n</mi><mn>2</mn></msub><mo>=</mo><mfrac><mi>n</mi><mn>2</mn></mfrac></mrow></semantics></math> ; <math><semantics><mrow><mn>6</mn><mo>=</mo><mo form=\"prefix\" stretchy=\"false\">(</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>+</mo><mn>1</mn><mo form=\"postfix\" stretchy=\"false\">)</mo><mfrac><msup><mi>T</mi><mi>′</mi></msup><mi>T</mi></mfrac><mo accent=\"false\">⇒</mo><msup><mi>T</mi><mi>′</mi></msup><mo>=</mo><mn>4</mn><mi>T</mi></mrow></semantics></math> </p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a5a3e77739391e01", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "85", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In a given process of an ideal gas, <math>&nbsp;&nbsp;<mrow><mtext mathvariant=\"italic\">dW</mtext> <mo>=</mo> <mn>0&nbsp;</mn> <mtext>and&nbsp;</mtext><mtext mathvariant=\"italic\">dQ</mtext> <mo>&lt;</mo> <mn>0</mn> </mrow> </math>. Then for the gas", "image": null}, "options": [{"id": "tQFoR", "text": "The temperature will decrease", "image": null, "isCorrect": true}, {"id": "oIXPj", "text": "The volume will increase", "image": null, "isCorrect": false}, {"id": "ViOoV", "text": "The pressure will remain contain", "image": null, "isCorrect": false}, {"id": "Z8azq", "text": "The temperature will increase", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>From first law of thermodynamics,<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math><mrow> <mtext>dQ</mtext> <mo>=</mo> <mtext>dU</mtext> <mo>+</mo> <mtext>dW</mtext> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp; &nbsp;<math> <mrow> <mtext>dQ</mtext> <mo>=</mo> <mtext>dU</mtext> <mtext>,&nbsp;</mtext> <mtext>if&nbsp; dW = 0</mtext> </mrow> </math><br /><br />Since,&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math> <mrow> <mtext>dQ</mtext> <mo>&lt;</mo> <mn>0</mn> </mrow> </math><br /><br />Therefore, <math> <mrow> <mtext>dU</mtext> <mo>&lt;</mo> <mn>0&nbsp;</mn>&nbsp; <mtext>or&nbsp;</mtext>&nbsp;&nbsp;&nbsp; <msub> <mtext mathvariant=\"italic\">U</mtext> <mtext>Final</mtext> </msub> <mo>&lt;</mo> <msub> <mtext mathvariant=\"italic\">U</mtext> <mtext>initial</mtext> </msub> </mrow> </math><br /><br />so, the temperature will decrease.<br /><br /><strong>Note:</strong> Internal energy U of an ideal gas depends only on the temperature of the gas. The internal energy of n moles of an ideal gas is given by nC<sub>v</sub> dT</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a3f3492225b7acdf", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "73", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "t
