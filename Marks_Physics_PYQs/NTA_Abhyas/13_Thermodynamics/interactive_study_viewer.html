></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "During AB process is isochoric.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>&#916;</mi><mi>V</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>0</mn><mo>&#160;</mo><mo>&#160;</mo><mspace linebreak=\"newline\"/><mo>&#8756;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>W</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>0</mn></math><br /><br />During <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BC</mi></math>, the process is isothermal.<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0016904_AnsExp_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 169px; height: 146px;\" /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;&#160;&#160;</mo><mo>&#916;</mo><mi>T</mi><mo>=</mo><mn>0</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mi>W</mi><mo>&#8289;</mo><mo>=</mo><msub><mtext mathvariant=\"italic\">RT</mtext><mn>2</mn></msub><mtext>ln</mtext><mfrac><mrow><mi>V</mi><msub><mo>&#8289;</mo><mn>2</mn></msub></mrow><mrow><mi>V</mi><msub><mo>&#8289;</mo><mn>1</mn></msub></mrow></mfrac></math><br /><br />During <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CA</mi></math>, the process is isobaric. So, the pressure is constant.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>W</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mi>P</mi><mo>(</mo><msub><mi>V</mi><mn>1</mn></msub><mo>&#8211;</mo><msub><mi>V</mi><mn>2</mn></msub><mo>)</mo></math><br /><br />But <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msub><mi>V</mi><mn>1</mn></msub><mo>=</mo><mo>&#160;</mo><mi>R</mi><msub><mi>T</mi><mn>1</mn></msub></math><br /><br /><math> <mrow> <mo>&#8756;</mo> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mi></mi><mi></mi><mi></mi><mi></mi><mi>P</mi><mo>&#8289;</mo> <mo>=</mo> <mfrac> <mrow> <msub> <mtext mathvariant=\"italic\">RT</mtext> <mn>1</mn> </msub> </mrow> <mrow> <msub> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi>V</mi><mo>&#8289;</mo> </mrow> <mn>1</mn> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <msub> <mtext mathvariant=\"italic\">RT</mtext> <mn>2</mn> </msub> </mrow> <mrow> <msub> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi>V</mi><mo>&#8289;</mo> </mrow> <mn>2</mn> </msub> </mrow> </mfrac> <mspace width=\"0.5em\"></mspace> <mo>&#8756;</mo> <mspace width=\"0.5em\"></mspace> <mi></mi><mi></mi><mi></mi><mi></mi><mi>W</mi><mo>&#8289;</mo> <mo>=</mo> <mfrac> <mrow> <msub> <mtext mathvariant=\"italic\">RT</mtext> <mn>1</mn> </msub> </mrow> <mrow> <msub> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi>V</mi><mo>&#8289;</mo> </mrow> <mn>1</mn> </msub> </mrow> </mfrac> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi>V</mi><mo>&#8289;</mo> </mrow> <mn>1</mn> </msub> <mo>-</mo> <msub> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi>V</mi><mo>&#8289;</mo> </mrow> <mn>2</mn> </msub> </mrow> </mfenced> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>RT</mtext> <mn>2</mn> </msub> </mrow> <mrow> <msub> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi>V</mi><mo>&#8289;</mo> </mrow> <mn>2</mn> </msub> </mrow> </mfrac> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi>V</mi><mo>&#8289;</mo> </mrow> <mn>1</mn> </msub> <mo>-</mo> <msub> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi>V</mi><mo>&#8289;</mo> </mrow> <mn>2</mn> </msub> </mrow> </mfenced> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863f6c95fd3e1efb021", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "57", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A monoatomic gas undergoes a process in which the pressure <math><mo>(</mo><mi>P</mi><mo>)</mo></math> and the volume <math><mo>(</mo><mi>V</mi><mo>)</mo></math>&nbsp;of the gas are related as <math><mi>P</mi><msup><mrow><mi>V</mi></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>=</mo></math> constant. What will be the molar heat capacity of gas for this process?</p>\r", "image": null}, "options": [{"id": "p1ufB", "text": "<math><mfrac><mrow><mn>5</mn><mi>R</mi></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "L9g3P", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mi>R</mi></math>", "image": null, "isCorrect": false}, {"id": "nRgri", "text": "<math><mfrac><mrow><mn>7</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mi>R</mi></math>", "image": null, "isCorrect": true}, {"id": "bsU8i", "text": "<math><mfrac><mrow><mi>R</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi>P</mi><msup><mrow><mi>V</mi></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>=</mo><mi>c</mi><mi>o</mi><mi>n</mi><mi>s</mi><mi>t</mi><mi>a</mi><mi>n</mi><mi>t</mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi>n</mi><mo>=</mo><mo>-</mo><mn>3</mn></math>  <br/><br/> <math><mi>C</mi><mo>=</mo><mfrac><mrow><mi>R</mi></mrow><mrow><mi>γ</mi><mo>-</mo><mn>1</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mi>R</mi></mrow><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></mfrac><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi>γ</mi><mo>=</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math>  <br/><br/> <math><mi>C</mi><mo>=</mo><mfrac><mrow><mi>R</mi></mrow><mrow><mfrac><mrow><mn>5</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>-</mo><mn>1</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mi>R</mi></mrow><mrow><mo>-</mo><mn>3</mn><mo>-</mo><mn>1</mn></mrow></mfrac></math>  <br/><br/> <math><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mo>=</mo><mfrac><mrow><mn>3</mn><mi>R</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>R</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math>  <br/><br/> <math><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mo>=</mo><mfrac><mrow><mn>7</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mi>R</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863f3a364277b22cb20", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "69", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A cylinder closed at both ends is separated into two equal parts (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>45</mn><mo>&nbsp;</mo><mi>cm</mi></math> each) by a piston impermeable to heat. Both the parts contain the same masses of gas at a temperature of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math> and a pressure of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi>atm</mi></math>. If now the gas in one of the parts is heated such that the piston shifts by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&nbsp;</mo><mi>cm</mi></math>, then the temperature and the pressure of the gas in this part after heating is&nbsp;", "image": null}, "options": [{"id": "AI0Wl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>365&#160;</mn><mi mathvariant=\"normal\">K</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mn>1.125</mn><mi>&#160;</mi><mi>atm</mi></math>", "image": null, "isCorrect": false}, {"id": "C2EhE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>350&#160;</mn><mi mathvariant=\"normal\">K</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mn>1.125</mn><mi>&#160;</mi><mi>atm</mi></math>", "image": null, "isCorrect": false}, {"id": "pN2fX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>375&#160;</mn><mi mathvariant=\"normal\">K</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mn>2.125</mn><mi>&#160;</mi><mi>atm</mi></math>", "image": null, "isCorrect": false}, {"id": "DKgrm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>375&#160;</mn><mi mathvariant=\"normal\">K</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mn>1.125</mn><mi mathvariant=\"normal\">&#160;</mi><mi>atm</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let the crossectional area of the cylinder is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> . Initially<br /><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/uqzlvnnpjsnycxiiomassofzkdwwgkwoorawixzuylyztmzswr.jpeg\" /><br /><br />Representing a closed cylinder<br /><br />separated by a piston<br /><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/mreuldkhvhhcghpryhmwovwolyzeovsrsfzltuwktvhovaoxqt.jpeg\" /><br /><br />The piston is shifted by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mi mathvariant=\"normal\">&#160;</mi><mi>cm</mi></math> in the cylinder<br /><br />For 1, <math><mfrac><mrow><msub><mrow><mi>p</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mi>&#160;</mi><mo>&#8658;</mo><mi>&#160;</mi><mfrac><mrow><mi>p</mi><mi>V</mi></mrow><mrow><mn>300</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub><mfenced separators=\"|\"><mrow><mi>V</mi><mo>+</mo><mi>A</mi><mi>x</mi></mrow></mfenced></mrow><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math> .....(i)<br /><br />For 2, <math><msub><mrow><mi>p</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msub><mi>&#160;</mi><mo>&#8658;</mo><mi>&#160;</mi><mi>p</mi><mi>V</mi><mo>=</mo><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub><mfenced separators=\"|\"><mrow><mi>V</mi><mo>-</mo><mi>A</mi><mi>x</mi></mrow></mfenced></math><br /><br /><math><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><mi>p</mi><mi>V</mi></mrow><mrow><mfenced separators=\"|\"><mrow><mi>V</mi><mo>-</mo><mi>A</mi><mi>x</mi></mrow></mfenced></mrow></mfrac></math> ....(ii)<br /><br />From Equations (i) and (ii),<br /><br /><math><mfrac><mrow><mi>p</mi><mi>V</mi></mrow><mrow><mn>300</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>p</mi><mi>V</mi></mrow><mrow><mfenced separators=\"|\"><mrow><mi>V</mi><mo>-</mo><mi>A</mi><mi>x</mi></mrow></mfenced></mrow></mfrac><mo>&#8901;</mo><mfrac><mrow><mfenced separators=\"|\"><mrow><mi>V</mi><mo>+</mo><mi>A</mi><mi>x</mi></mrow></mfenced></mrow><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math><br /><br /><math><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><mi>V</mi><mo>+</mo><mi>A</mi><mi>x</mi></mrow><mrow><mi>V</mi><mo>-</mo><mi>A</mi><mi>x</mi></mrow></mfrac><mn>300</mn><mo>=</mo><mfrac><mrow><mi>A</mi><mn>45</mn><mo>+A5</mo></mrow><mrow><mi>A</mi><mn>45</mn><mo>-A5</mo></mrow></mfrac><mo>&#215;</mo><mn>300</mn><mo>=</mo><mfrac><mrow><mn>50</mn></mrow><mrow><mn>40</mn></mrow></mfrac><mn>300</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mn>375</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math><br /><br />Putting <math><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub></math> in Equation (i),<br /><br /><math><msub><mrow><mi>P</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><mi>P</mi><mi>V</mi></mrow><mrow><mfenced separators=\"|\"><mrow><mi>V</mi><mo>+</mo><mi>A</mi><mi>x</mi></mrow></mfenced></mrow></mfrac><mo>&#215;</mo><mfrac><mrow><mn>375</mn></mrow><mrow><mn>300</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn><mo>&#215;</mo><mi>A</mi><mo>&#215;</mo><mn>45</mn></mrow><mrow><mi>A</mi><mfenced separators=\"|\"><mrow><mn>450</mn><mo>+</mo><mn>5</mn></mrow></mfenced></mrow></mfrac><mo>&#215;</mo><mfrac><mrow><mn>375</mn></mrow><mrow><mn>300</mn></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>1</mn><mo>.125</mo><mi mathvariant=\"normal\">&#160;</mi><mi>atm</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863f0d87983f583f710", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "13", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The pressure <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>, volume <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi></math> and temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> of a certain material are related by the equation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mi>α</mi><msup><mi>T</mi><mn>2</mn></msup><mo>/</mo><mi>V</mi></math>. The work done by the material at constant pressure, when the temperature changes from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>0</mn></msub></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mi>T</mi><mn>0</mn></msub></math>,&nbsp;is", "image": null}, "options": [{"id": "F6bjz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>&#x3B1;</mi><msubsup><mi>T</mi><mn>0</mn><mn>2</mn></msubsup></math>", "image": null, "isCorrect": true}, {"id": "edg2O", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mi>&#x3B1;</mi><msubsup><mi>T</mi><mn>0</mn><mn>2</mn></msubsup></math>", "image": null, "isCorrect": false}, {"id": "tXG5p", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>3</mn></mfrac><mi>&#x3B1;</mi><msubsup><mi>T</mi><mn>0</mn><mn>2</mn></msubsup></math>", "image": null, "isCorrect": false}, {"id": "u14RG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mi>&#x3B1;</mi><msubsup><mi>T</mi><mn>0</mn><mn>2</mn></msubsup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given relation is<br /><br /><math> <mrow> <mtext>P</mtext> <mo>=</mo> <mfrac> <mrow> <mi>α</mi> <msup> <mtext>T</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mtext>V</mtext> </mrow> </mfrac> <mspace width=\"0.5em\"></mspace> <mo>∴</mo> <mspace width=\"0.5em\"></mspace> <mtext>V</mtext> <mo>=</mo> <mfrac> <mrow> <mi>α</mi> <msup> <mtext>T</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mtext>P</mtext> </mrow> </mfrac> </mrow> </math><br /><br />As pressure is kept constant, <math> <mrow> <mtext>dV</mtext> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>2</mn> <mi>α</mi> <mtext>T</mtext> </mrow> <mrow> <mtext>P</mtext> </mrow> </mfrac> </mrow> </mfenced> <mtext>dT</mtext> </mrow> </math><br /><br /><math> <mrow> <mtext>W</mtext> <mo>=</mo> <mo>∫</mo> <mtext>P</mtext> <mo>·</mo> <mtext>dV</mtext> <mo>=</mo> <munderover> <mo>∫</mo> <msub> <mtext>T</mtext> <mn>0</mn> </msub> <msub> <mtext>2T</mtext> <mn>0</mn> </msub> </munderover> <mtext>P</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>2</mn> <mi>α</mi> <mtext>T</mtext> </mrow> <mrow> <mtext>P</mtext> </mrow> </mfrac> </mrow> </mfenced> <mtext>dT</mtext> <mo>=</mo> <mn>2</mn> <mi>α</mi> <msubsup> <mrow> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mfrac> <mrow> <msup> <mtext>T</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </mfenced> </mrow> <msub> <mtext>T</mtext> <mn>0</mn> </msub> <msub> <mtext>2T</mtext> <mn>0</mn> </msub> </msubsup> <mo>=</mo> <mn>3</mn> <mi>α</mi> <msubsup> <mtext>T</mtext> <mn>0</mn> <mn>2</mn> </msubsup> </mrow> </math> &nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863f0932d722c59585e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "62", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "For two thermodynamic process temperature and volume, diagrams are drawn. In the first process, it is a straight line having initial and final coordinates as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>V</mi><mn>0</mn></msub><mo>,</mo><msub><mi>T</mi><mn>0</mn></msub></mrow></mfenced></math>and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>2</mn><msub><mi>V</mi><mn>0</mn></msub><mo>,</mo><mo>&#160;</mo><mn>2</mn><msub><mi>T</mi><mn>0</mn></msub></mrow></mfenced></math>, whereas in second process it is a rectangular hyperbola having initial and final coordinates (V<sub>0</sub>, T<sub>0</sub>) and (2V<sub>0</sub>, T<sub>0</sub>/2). Then the ratio of work done in the two processes must be<br />\r<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013421_Question_1.jpg\" style=\"width: 350px; height: 141px;\" />", "image": null}, "options": [{"id": "cz2o5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mn>2</mn></math><div id=\"gtx-trans\" style=\"position: absolute; left: 77px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "TYSBl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mn>1</mn></math>", "image": null, "isCorrect": true}, {"id": "m8E5I", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "X6Lub", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "&nbsp; &nbsp;<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013421_AnsExp_1.jpg\" style=\"width: 140px; height: 120px;\" /><br /><br />&nbsp; &nbsp;<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013421_AnsExp_2.jpg\" style=\"width: 140px; height: 129px;\" /><br /><br />The first process is the constant pressure process Hence, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>w</mi><mn>1</mn></msub><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mi>n</mi><mi>R</mi><mo>(</mo><mn>2</mn><msub><mi>T</mi><mn>0</mn></msub><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><msub><mi>T</mi><mn>0</mn></msub><mo>)</mo><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mi>n</mi><mi>R</mi><msub><mi>T</mi><mn>0</mn></msub></math><br /><br />Equation of the second process is <math> <mrow> <mtext>T</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>c</mtext> </mrow> <mrow> <mtext>V</mtext> </mrow> </mfrac> </mrow> </math><br /><br />Hence,&nbsp;<math> <mrow> <mtext>P</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>nRT</mtext> </mrow> <mrow> <mtext>V</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>nRc</mtext> </mrow> <mrow> <msup> <mtext>V</mtext> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>&#8756;&#160;&#160;&#160;&#160;</mo> <mtext>w</mtext> <mo>=</mo> <munderover> <mo>&#8747;</mo> <msub> <mtext>V</mtext> <mn>0</mn> </msub> <mrow> <mn>2</mn> <msub> <mtext>V</mtext> <mn>0</mn> </msub> </mrow> </munderover> <mtext>PdV</mtext> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>nRT</mtext> <mn>0</mn> </msub> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>&#8756;&#160;&#160;&#160;</mo> <mfrac> <mrow> <msub> <mtext>w</mtext> <mn>1</mn> </msub> </mrow> <mrow> <msub> <mtext>w</mtext> <mn>2</mn> </msub> </mrow> </mfrac> <mo>=</mo> <mn>2&#160;</mn> <mtext>:&#160;</mtext> <mn>1</mn> </mrow> </math><br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ed540e81e9091db1", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "99", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The figure shows two isotherms at temperatures <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>1</mn></msub></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>2</mn></msub></math>. A gas is taken from one isotherm to another isotherm through different processes. Then change in internal energy <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>Δ</mo><mtext>U</mtext></math> has a relation –<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0032756.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 190px; height: 132px;\" />", "image": null}, "options": [{"id": "oJSlt", "text": "<math> <mrow> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ab</mtext> </msub> <mo>&gt;</mo> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ac</mtext> </msub> <mo>&gt;</mo> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ad</mtext> </msub> <mo>&gt;</mo> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ae</mtext> </msub> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "44qH2", "text": "<math> <mrow> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ab</mtext> </msub> <mo>=</mo> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ac</mtext> </msub> <mo>&gt;</mo> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ad</mtext> </msub> <mo>&gt;</mo> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ae</mtext> </msub> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "9lv7D", "text": "<math> <mrow> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ab</mtext> </msub> <mo>=</mo> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ac</mtext> </msub> <mo>=</mo> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ad</mtext> </msub> <mo>=</mo> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ae</mtext> </msub> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "AVzvx", "text": "<math> <mrow> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ab</mtext> </msub> <mo>&lt;</mo> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ac</mtext> </msub> <mo>&lt;</mo> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ad</mtext> </msub> <mo>&lt;</mo> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ae</mtext> </msub> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Internal energy depends only on state but not on the process. Hence its change is same for all the processes between two same states.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ed2a8b4f85d4434a", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "05", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A sample of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi>kg</mi></math> monoatomic helium gas (assumed ideal) is taken through the process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mi>C</mi></math> and another sample of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi>kg</mi></math> of the same gas is taken through the process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>D</mi><mi>C</mi></math>.&nbsp;Given that the molecular mass of helium =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&nbsp;</mo><mi>amu</mi></math>, find the temperature&nbsp;of helium in the state&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>D</mi></math>.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>[</mo></math>Take the universal gas constant&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mfrac><mn>25</mn><mn>3</mn></mfrac><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi><mo>&nbsp;</mo><msup><mi>mol</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>]</mo></math><br />\r&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<br />\r&nbsp;<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-05-23_at_8.47.00_PM.jpeg\" style=\"width: 240px; height: 153px;\" /><br />\r&nbsp;", "image": null}, "options": [], "correctValue": "240", "solution": {"text": "<p><strong>&nbsp;</strong>Number of gram moles of He,&nbsp;<math><mrow><mi>n</mi><mo>=</mo><mfrac linethickness=\"1\"><mi>m</mi><mi>M</mi></mfrac><mo>=</mo><mfrac linethickness=\"1\"><mrow><mn>2</mn><mo>&#215;</mo><mn>1</mn><msup><mn>0</mn><mn>3</mn></msup></mrow><mn>4</mn></mfrac><mo>=</mo><mn>500</mn></mrow></math><br />&nbsp;<br />V<sub>A</sub> = 10m<sup>3</sup>, p<sub>A</sub><sub> </sub>= 5 x 10<sup>4 </sup>N/m<sup>2</sup><br />&nbsp;<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mi>A</mi></msub><mo>=</mo><mfrac linethickness=\"1\"><mrow><msub><mi>P</mi><mi>A</mi></msub><msub><mi>V</mi><mi>A</mi></msub></mrow><mrow><mi>n</mi><mi>R</mi></mrow></mfrac><mo>=</mo><mfrac linethickness=\"1\"><mrow><mrow><mo>(</mo><mn>10</mn><mo>)</mo></mrow><mrow><mo>(</mo><mn>5</mn><mo>&#215;</mo><mn>1</mn><msup><mn>0</mn><mn>4</mn></msup><mo>)</mo></mrow></mrow><mrow><mrow><mo>(</mo><mn>500</mn><mo>)</mo></mrow><mo>(</mo><mfrac bevelled=\"true\"><mn>25</mn><mn>3</mn></mfrac><mo>)</mo></mrow></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi><mo>=</mo><mn>120</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math><br />&nbsp;<br />Similarly, V<sub>B</sub> = 10m<sup>3</sup>, p<sub>B</sub> = 10 x 10<sup>4 </sup>N/m<sup>2</sup><br />&nbsp;<br />&nbsp;&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mi>B</mi></msub><mo>=</mo><mfrac linethickness=\"1\"><mrow><mrow><mo>(</mo><mn>10</mn><mo>)</mo></mrow><mrow><mo>(</mo><mn>10</mn><mo>&#215;</mo><mn>1</mn><msup><mn>0</mn><mn>4</mn></msup><mo>)</mo></mrow></mrow><mrow><mrow><mo>(</mo><mn>500</mn><mo>)</mo></mrow><mrow><mo>(</mo><mfrac bevelled=\"true\"><mn>25</mn><mn>3</mn></mfrac><mo>)</mo></mrow></mrow></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi><mo>=</mo><mn>240</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math><br />&nbsp;<br />&nbsp;&nbsp; Similarly,&nbsp; V<sub>C</sub> = 20 m<sup>3</sup>,&nbsp; p<sub>C</sub> = 10 x 10<sup>4</sup> N/m<sup>2</sup><br />&nbsp;</p><p>&nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mi>C</mi></msub><mo>=</mo><mfrac linethickness=\"1\"><mrow><mrow><mo>(</mo><mn>20</mn><mo>)</mo></mrow><mrow><mo>(</mo><mn>10</mn><mo>&#215;</mo><mn>1</mn><msup><mn>0</mn><mn>4</mn></msup><mo>)</mo></mrow></mrow><mrow><mrow><mo>(</mo><mn>500</mn><mo>)</mo></mrow><mo>(</mo><mfrac bevelled=\"true\"><mn>25</mn><mn>3</mn></mfrac><mo>)</mo></mrow></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi><mo>=</mo><mn>480</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math><br />&nbsp;<br />Similarly,&nbsp;&nbsp;V<sub>D</sub> = 20 m<sup>3</sup>, p<sub>D</sub> = 5x 10<sup>4</sup> N/m<sup>2</sup><br />&nbsp;<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mi>D</mi></msub><mo>=</mo><mfrac linethickness=\"1\"><mrow><mrow><mo>(</mo><mn>20</mn><mo>)</mo></mrow><mrow><mo>(</mo><mn>5</mn><mo>&#215;</mo><mn>1</mn><msup><mn>0</mn><mn>4</mn></msup><mo>)</mo></mrow></mrow><mrow><mrow><mo>(</mo><mn>500</mn><mo>)</mo></mrow><mo>(</mo><mfrac bevelled=\"true\"><mn>25</mn><mn>3</mn></mfrac><mo>)</mo></mrow></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi><mo>=</mo><mn>240</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ec10e0b797098987", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "78", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "One mole of an ideal gas as taken from state&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> to state&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> by three different processes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">a</mi><mo>)</mo><mo>&nbsp;</mo><mi>ACB</mi><mo>,</mo><mo>&nbsp;</mo><mo>(</mo><mi mathvariant=\"normal\">b</mi><mo>)</mo><mo>&nbsp;</mo><mi>ADB</mi><mo>&nbsp;</mo></math>and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">c</mi><mo>)</mo><mo>&nbsp;</mo><mi>AEB</mi></math> as shown in the<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mi>P</mi><mo>-</mo><mi>V</mi></math> diagram. The heat absorbed by the gas is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029740_Question.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 199px; height: 152px;\" />", "image": null}, "options": [{"id": "85WPf", "text": "Greater in process (b) than in (a)", "image": null, "isCorrect": false}, {"id": "TMt5t", "text": "The least in process (b)", "image": null, "isCorrect": false}, {"id": "8VSLO", "text": "The same in (a) and (c)", "image": null, "isCorrect": false}, {"id": "ZpIIq", "text": "Less in (c) than in (b)", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Heat absorbed by gas in three processes is given by<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">Q</mtext><mtext>ACB</mtext></msub><mo>=</mo><mo>&#916;</mo><mtext mathvariant=\"italic\">U</mtext><mo>+</mo><msub><mtext mathvariant=\"italic\">W</mtext><mtext>ACB</mtext></msub></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">Q</mtext><mtext>ADB</mtext></msub><mo>=</mo><mo>&#916;</mo><mtext mathvariant=\"italic\">U</mtext></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">Q</mtext><mtext>AEB</mtext></msub><mo>=</mo><mo>&#916;</mo><mtext mathvariant=\"italic\">U</mtext><mo>+</mo><msub><mtext mathvariant=\"italic\">W</mtext><mtext>AEB</mtext></msub></math><br /><br />The change in internal energy in all the three cases is the same and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mi>ACB</mi></msub></math> is positive, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mi>AEB</mi></msub></math> is negative.<br /><br />Hence&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">Q</mtext><mtext>ACB</mtext></msub><mo>&#62;</mo><msub><mtext mathvariant=\"italic\">Q</mtext><mtext>ADB</mtext></msub><mo>&#62;</mo><msub><mtext mathvariant=\"italic\">Q</mtext><mtext>AEB</mtext></msub></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863eaf11e644fac3d02", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "17", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>-</mo><mi>V</mi></math>&nbsp;diagram of a diatomic gas is a straight line parallel to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>-axis. The molar heat capacity of the gas in the process will be", "image": null}, "options": [{"id": "7GTj8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi mathvariant=\"normal\">R</mi></math>", "image": null, "isCorrect": false}, {"id": "k96ZD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2.5</mn><mi mathvariant=\"normal\">R</mi></math>", "image": null, "isCorrect": true}, {"id": "nY8iY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi mathvariant=\"normal\">R</mi></math>", "image": null, "isCorrect": false}, {"id": "XP2dg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>4</mn><mi mathvariant=\"normal\">R</mi></mrow><mn>3</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The process described is isochoric<br /><br /><math><mo>∴</mo></math> molar heat capacity <math><msub><mrow><mi>C</mi></mrow><mrow><mi>V</mi></mrow></msub><mo>=</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>R</mi><mo>=</mo><mn>2.5</mn><mi>R</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e8532b05ae176a92", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "80", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The specific heats of an ideal gas at constant pressure and constant volume are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>525</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>kg</mi><mo>°</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>315</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">J</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi>kg</mi><mo>°</mo><mi mathvariant=\"normal\">&nbsp;</mi><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> respectively. Its density at NTP is", "image": null}, "options": [{"id": "ViMwy", "text": "<math><mn>0.64</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "JQrns", "text": "<math><mn>1.20</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "oGK0T", "text": "<math><mn>1.75</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "YQ2GG", "text": "<math><mn>2.62</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If <math><mi>M</mi></math> is molecular mass of the gas, then from<br /><br /><math><mi>M</mi><mfenced separators=\"|\"><mrow><msub><mrow><mi>C</mi></mrow><mrow><mi>p</mi></mrow></msub><mo>-</mo><msub><mrow><mi>C</mi></mrow><mrow><mi>v</mi></mrow></msub></mrow></mfenced><mo>=</mo><mi>R</mi></math><br /><br /><math><mi>M</mi><mo>=</mo><mfrac><mrow><mn>8.31</mn></mrow><mrow><mn>210</mn></mrow></mfrac><mo>=</mo><mn>0.0392</mn></math><br /><br />If <math><mi mathvariant=\"normal\">ρ</mi></math> is density of the gas at NTP, then mass of 1 <math><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>3</mn></mrow></msup></math>of gas at NTP<math><mo>=</mo><mi mathvariant=\"normal\">ρ</mi></math> kg<br /><br /><math><mo>∴</mo></math> Mass of 22.4 L <math><mo>(</mo><mo>=</mo><mn>22.4</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>3</mn></mrow></msup><mo>)</mo></math> of gas at NTP <math><mo>=</mo><mi mathvariant=\"normal\">ρ</mi><mo>×</mo><mn>22.4</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><mi mathvariant=\"normal\">&nbsp;</mi></math>kg, which is the molecular mass of the gas<br /><br /><math><mo>∴</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">ρ</mi><mo>×</mo><mn>22.4</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>=</mo><mn>0.0392</mn></math><br /><br /><math><mi mathvariant=\"normal\">ρ</mi><mo>=</mo><mfrac><mrow><mn>0.0392</mn></mrow><mrow><mn>22.4</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></mrow></mfrac><mo>=</mo><mn>1.75</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e7f4b4b908221bf8", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "29", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A work of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>146</mn><mo>&nbsp;</mo><mi>kJ</mi></math> is performed on the gas, in order to compress one kilomole of gas adiabatically and in this process the temperature of the gas increases by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. The gas is ( <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>8</mn><mo>.</mo><mn>3</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi><mo>&nbsp;</mo><msup><mi>mol</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> )", "image": null}, "options": [{"id": "GpzeI", "text": "monoatomic", "image": null, "isCorrect": false}, {"id": "xvluZ", "text": "diatomic", "image": null, "isCorrect": true}, {"id": "Ff4Xj", "text": "triatomic", "image": null, "isCorrect": false}, {"id": "swKBZ", "text": "a mixture of monoatomic and diatomic", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>According to first law of thermodynamics<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#916;</mo><mtext>Q</mtext><mo>=</mo><mo>&#916;</mo><mtext>U</mtext><mo>+</mo><mo>&#916;</mo><mtext>W</mtext></math><br /><br />For an adiabatic process, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#916;</mo><mtext>Q=0</mtext></math><br /><br /><math> <mrow> <mo>&#8756;</mo> </mrow> </math>&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>=</mo><mo>&#916;</mo><mtext>U</mtext><mo>+</mo><mo>&#916;</mo><mtext>W</mtext></math><br /><br />or&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#916;</mo><mtext>U</mtext><mo>=</mo><mo>-</mo><mo>&#916;</mo><mtext>W</mtext></math><br /><br />or&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">n</mi><msub><mtext>C</mtext><mtext>V</mtext></msub><mo>&#916;</mo><mtext>T</mtext><mo>=</mo><mo>-</mo><mo>&#916;</mo><mtext>W</mtext></math><br /><br />or&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext>C</mtext><mtext>V</mtext></msub><mo>=</mo><mfrac><mrow><mo>-</mo><mo>&#916;</mo><mtext>W</mtext></mrow><mrow><mi mathvariant=\"normal\">n</mi><mo>&#916;</mo><mtext>T</mtext></mrow></mfrac><mo>=</mo><mfrac><mrow><mo>-</mo><mfenced><mrow><mo>-</mo><mtext>146</mtext></mrow></mfenced><mo>&#215;</mo><msup><mtext>10</mtext><mn>3</mn></msup></mrow><mrow><mfenced><mrow><mn>1</mn><mo>&#215;</mo><msup><mtext>10</mtext><mn>3</mn></msup></mrow></mfenced><mo>&#215;</mo><mn>7</mn></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">v</mi></msub><mo>=</mo><mn>20</mn><mo>.</mo><mn>8</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi>mol</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br />For diatomic gas,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext>C</mtext><mtext>V</mtext></msub><mo>=</mo><mfrac><mn>5</mn><mn>2</mn></mfrac><mtext>R</mtext><mo>=</mo><mfrac><mn>5</mn><mn>2</mn></mfrac><mo>&#215;</mo><msup><mtext>8.3&#160;=&#160;20.8&#160;J&#160;mol</mtext><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mtext>&#160;K</mtext><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br />Hence the gas is diatomic.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e63138e36e32f353", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "09", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In an adiabatic expansion, the volume of air is increased by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>%</mo></math>, then&nbsp;the approximate percentage decrease in its pressure will be", "image": null}, "options": [{"id": "w3fjP", "text": "<math><mn>5</mn><mi mathvariant=\"normal\">%</mi></math>", "image": null, "isCorrect": false}, {"id": "JTCaC", "text": "<math><mn>6</mn><mi mathvariant=\"normal\">%</mi></math>", "image": null, "isCorrect": false}, {"id": "NrmS7", "text": "<math><mn>7</mn><mi mathvariant=\"normal\">%</mi></math>", "image": null, "isCorrect": true}, {"id": "wiTvz", "text": "<math><mn>8</mn><mi mathvariant=\"normal\">%</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mfrac><mrow><mi mathvariant=\"normal\">Δ</mi><mi mathvariant=\"normal\">P</mi></mrow><mrow><mi mathvariant=\"normal\">Δ</mi><mi mathvariant=\"normal\">V</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mi mathvariant=\"normal\">γ</mi><mfrac><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mi mathvariant=\"normal\">V</mi></mrow></mfrac><mi mathvariant=\"normal\"> </mi><mo>→</mo><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">r</mi><mo>→</mo><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">c</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">γ</mi><mo>=</mo><mi mathvariant=\"normal\"> </mi><mn>1.4</mn></mrow></mfenced></math> <br/><br/> <math><mo>∴</mo><mfrac><mrow><mi mathvariant=\"normal\">Δ</mi><mi mathvariant=\"normal\">P</mi></mrow><mrow><mi mathvariant=\"normal\">P</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mi mathvariant=\"normal\">γ</mi><mfrac><mrow><mi mathvariant=\"normal\">Δ</mi><mi mathvariant=\"normal\">V</mi></mrow><mrow><mi mathvariant=\"normal\">V</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mn>1.4</mn><mo>×</mo><mn>5</mn><mo>=</mo><mn>7</mn><mi mathvariant=\"normal\">%</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e1b65358b6ca8255", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "25", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>P</mtext><mo>-</mo><mtext>V</mtext></math>&nbsp;plots for two gases during adiabatic processes are shown in the figure. Plots <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math> should correspond respectively to<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/6065.JPG\" style=\"width: 220px; height: 179px;\" />", "image": null}, "options": [{"id": "kYcyb", "text": "<math> <mrow>  <mtext>He</mtext></mrow></math>and <math> <mrow>  <msub>   <mtext>O</mtext>   <mtext>2</mtext>  </msub>  </mrow></math>", "image": null, "isCorrect": false}, {"id": "4K7kZ", "text": "<math> <mrow> <msub> <mtext>O</mtext> <mtext>2</mtext> </msub> </mrow> </math> and <math> <mrow> <mtext>He</mtext></mrow> </math>", "image": null, "isCorrect": true}, {"id": "AS0nu", "text": "<math > <mrow>  <mtext>He</mtext></mrow></math>and <math> <mrow>  <mtext>Ar</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "hCPmP", "text": "<math> <mrow>  <msub>   <mtext>O</mtext>   <mtext>2</mtext>  </msub>  </mrow></math>and <math> <mrow>  <msub>   <mtext>N</mtext>   <mtext>2</mtext>  </msub>  </mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>In adiabatic process, slope of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi><mo>-</mo><mi mathvariant=\"normal\">V</mi></math>&nbsp;graph is given as,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>d</mn><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>d</mn><mi mathvariant=\"normal\">v</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mi mathvariant=\"normal\">&#947;</mi><mfrac><mtext>P</mtext><mtext>V</mtext></mfrac></math>.<br /><br />For a given <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi><mo>-</mo><mi mathvariant=\"normal\">V</mi></math>&nbsp;graph, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>slope</mi><mo>&#8733;</mo><mo>-</mo><mi mathvariant=\"normal\">&#947;</mi></math></p><p><br />From the given graph,<br /><math><mrow><msub><mrow><mfenced close=\")\" open=\"(\" separators=\",\"><mrow><mtext>slope</mtext> </mrow> </mfenced> </mrow> <mn>2</mn> </msub> <mo>&#62;</mo> <msub> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>slope</mtext> </mrow> </mfenced> </mrow> <mn>1</mn> </msub></mrow></math><br /><math> <mrow> <mo>&#8756;</mo> </mrow></math>&nbsp; &nbsp;<math><mrow><msub><mi>&#947;</mi> <mn>2</mn> </msub> <mo>&#62;</mo> <msub> <mi>&#947;</mi> <mn>1</mn> </msub> </mrow> </math><br /><br />Therefore, plot <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math> should correspond to <math> <mrow> <msub> <mtext>O</mtext> <mn>2</mn> </msub> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi>&#947;</mi> <mo>=</mo> <mn>1.</mn><mn>4</mn> </mrow> </mfenced> </mrow> </math>&nbsp;and plot <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math> should correspond to <math> <mrow> <mtext>He</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi>&#947;</mi> <mo>=</mo> <mn>1.</mn><mn>6</mn><mn>7</mn> </mrow> </mfenced> </mrow> </math>.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863dd76bfd0571ea8f4", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "86", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The diagram shows a horizontal cylindrical container of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&nbsp;</mo><mi>cm</mi></math>, which is partitioned by a tight-fitting separator. The separator is diathermic but conducts heat very slowly. Initially, the separator is in the state shown in the diagram. The temperature of the left part of the cylinder is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math> and that on the right part is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>400</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math>. Initially the separator is in equilibrium. As heat is conducted from the right to left part, separator displaces to the right. Find the displacement of separator (in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>cm</mi></math>) after a long when gases on the two parts of the cylinder are in thermal equilibrium.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0030804_Question.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 200px; height: 121px;\" />", "image": null}, "options": [], "correctValue": "10", "solution": {"text": "It is given that initially, the separator is in equilibrium; thus pressure on both sides of the gas is equal say, it is P<sub>i</sub>. If A be the area of cross-section of cylinder, number of moles of gas in the left and right part, n<sub>1</sub> and n<sub>2</sub>, can be given as<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>n</mi><mn>1</mn></msub><mo>=</mo><mfrac><mrow><msub><mi>P</mi><mtext>i</mtext></msub><mfenced><mrow><mn>1</mn><mn>0</mn><mtext>A</mtext></mrow></mfenced></mrow><mrow><mi>R</mi><mfenced><mrow><mn>1</mn><mn>0</mn><mn>0</mn></mrow></mfenced></mrow></mfrac></math><br /><br />and&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>n</mi><mn>2</mn></msub><mo>=</mo><mfrac><mrow><msub><mi>P</mi><mtext>i</mtext></msub><mfenced><mrow><mn>2</mn><mn>0</mn><mtext>A</mtext></mrow></mfenced></mrow><mrow><mi>R</mi><mfenced><mrow><mn>4</mn><mn>0</mn><mn>0</mn></mrow></mfenced></mrow></mfrac></math><br /><br />Finally, if the separator is displaced to right by a distance x,<br />we have<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>n</mi><mn>1</mn></msub><mo>=</mo><mfrac><mrow><msub><mtext mathvariant=\"italic\">P</mtext><mrow><mi>f</mi><mo>⁡</mo><mtext>i</mtext></mrow></msub><mfenced><mrow><mn>1</mn><mn>0</mn><mo>+</mo><mtext mathvariant=\"italic\">x</mtext></mrow></mfenced><mtext mathvariant=\"italic\">A</mtext></mrow><msub><mtext mathvariant=\"italic\">RT</mtext><mrow><mi>f</mi><mo>⁡</mo></mrow></msub></mfrac></math><br /><br />and&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">n</mtext><mn>2</mn></msub><mo>=</mo><mfrac><mrow><msub><mtext mathvariant=\"italic\">P</mtext><mrow><mi>f</mi><mo>⁡</mo></mrow></msub><mfenced><mrow><mn>2</mn><mn>0</mn><mo>-</mo><mtext mathvariant=\"italic\">x</mtext></mrow></mfenced><mtext mathvariant=\"italic\">A</mtext></mrow><msub><mtext mathvariant=\"italic\">RT</mtext><mrow><mi>f</mi><mo>⁡</mo></mrow></msub></mfrac></math><br /><br />Here <math> <mrow> <msub> <mtext>P</mtext> <mrow> <mi>f</mi><mo>⁡</mo> </mrow> </msub> </mrow> </math>&nbsp;and <math> <mrow> <msub> <mtext>T</mtext> <mrow> <mi>f</mi><mo>⁡</mo> </mrow> </msub> </mrow> </math>&nbsp;are the final pressure and temperature on both sides after a long time.<br />Now if we equate the ratio of moles n<sub>1</sub>/n<sub>2</sub> in initial and final states, we get<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mtext mathvariant=\"italic\">n</mtext><mn>1</mn></msub><msub><mtext mathvariant=\"italic\">n</mtext><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><mfenced><mrow><mn>1</mn><mn>0</mn><mtext mathvariant=\"italic\">A</mtext><mo>/</mo><mn>1</mn><mn>0</mn><mn>0</mn></mrow></mfenced><mfenced><mrow><mn>2</mn><mn>0</mn><mtext mathvariant=\"italic\">A</mtext><mo>/</mo><mn>4</mn><mn>0</mn><mn>0</mn></mrow></mfenced></mfrac><mo>=</mo><mfrac><mrow><mfenced><mrow><mn>1</mn><mn>0</mn><mo>+</mo><mtext mathvariant=\"italic\">x</mtext></mrow></mfenced><mtext mathvariant=\"italic\">A</mtext></mrow><mrow><mfenced><mrow><mn>2</mn><mn>0</mn><mo>-</mo><mtext mathvariant=\"italic\">x</mtext></mrow></mfenced><mtext mathvariant=\"italic\">A</mtext></mrow></mfrac></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mfenced><mrow><mn>2</mn><mn>0</mn><mo>-</mo><mtext mathvariant=\"italic\">x</mtext></mrow></mfenced><mo>=</mo><mn>1</mn><mn>0</mn><mo>+</mo><mtext mathvariant=\"italic\">x</mtext></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">x</mtext><mo>=</mo><mn>10&nbsp;</mn><mo>cm</mo></math><br /><br />Thus in the final state when gases in both parts are in thermal equilibrium, the piston is displaced 10 cm rightward from its initial position.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863dcdb9111b50a560d", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "04", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two moles of an ideal&nbsp;monoatomic&nbsp;gas is<span style=\"font-size: 10.8333px;\"> </span>taken through a cycle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mi>C</mi><mi>A</mi></math>&nbsp;as shown in the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>-</mo><mi>T</mi></math>&nbsp;diagram. During the process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math>, the pressure and temperature of the gas vary such that <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mi>T</mi></math>&nbsp;= constant. If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>1</mn></msub><mo>=</mo><mn>300</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math>&nbsp;and the amount of heat released by the gas during the process&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>=</mo><mo>-</mo><mi>x</mi><mi>R</mi></math>, then the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>&nbsp;is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0007626_Ques1_1.jpg\" /><br />\r&nbsp;", "image": null}, "options": [], "correctValue": "2100", "solution": {"text": "<p>In the process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><msup><mi>V</mi><mi>γ</mi></msup></math> = constant<br /><br />Molar heat capacity,&nbsp;<math><mrow><mi>C</mi><mo>=</mo><mfrac linethickness=\"1\"><mi>R</mi><mrow><mi>γ</mi><mo>-</mo><mn>1</mn></mrow></mfrac><mo>+</mo><mfrac linethickness=\"1\"><mi>R</mi><mrow><mn>1</mn><mo>-</mo><mi>x</mi></mrow></mfrac></mrow></math></p><p>Here the process is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>p</mi><mn>2</mn></msup><mi>V</mi></math>&nbsp;= constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><msup><mi>V</mi><mfrac bevelled=\"true\"><mn>1</mn><mn>2</mn></mfrac></msup></math><sup> </sup>= constant</p><p>i.e,&nbsp;<math><mrow><mi>x</mi><mo>=</mo><mfrac linethickness=\"1\"><mn>1</mn><mn>2</mn></mfrac></mrow></math><br />&nbsp;<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>=</mo><mfrac><mi>R</mi><mrow><mfrac><mn>5</mn><mn>3</mn></mfrac><mo>-</mo><mn>1</mn></mrow></mfrac><mo>+</mo><mfrac><mi>R</mi><mrow><mn>1</mn><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></mfrac><mi>C</mi><mo>=</mo><mn>3</mn><mtext>.</mtext><mn>5</mn><mi>R</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Q</mi><mrow><mi mathvariant=\"normal\">A</mi><mo>→</mo><mi mathvariant=\"normal\">B</mi></mrow></msub><mo>=</mo><mi>n</mi><mi>C</mi><mi>Δ</mi><mi>T</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Q</mi><mrow><mi mathvariant=\"normal\">A</mi><mo>→</mo><mi mathvariant=\"normal\">B</mi></mrow></msub><mo>=</mo><mn>2</mn><mo>×</mo><mn>3</mn><mo>.</mo><mn>5</mn><mi>R</mi><mo>×</mo><mfenced><mrow><mn>300</mn><mo>-</mo><mn>600</mn></mrow></mfenced></math><br />&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Q</mi><mrow><mi mathvariant=\"normal\">A</mi><mo>→</mo><mi mathvariant=\"normal\">B</mi></mrow></msub><mo>=</mo><mo>-</mo><mn>2100</mn><mi>R</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863da4da7510579f57f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "56", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Find the minimum attainable pressure of an ideal gas in process <math> <mrow> <mi>T</mi><mo>=</mo><msub> <mi>T</mi> <mn>0</mn> </msub> <m >2</mn></mfrac><mi>P</mi></math>", "image": null, "isCorrect": false}, {"id": "HOODG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>P</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In isothermal process<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; PV = constant<br /><br /><math> <mrow> <mo>∴&nbsp;&nbsp;&nbsp;</mo> <mtext>PdV</mtext> <mo>+</mo> <mtext>VdP</mtext> <mo>=</mo> <mn>0</mn> </mrow> </math>&nbsp;&nbsp;or&nbsp;&nbsp;<math> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>dP</mtext> </mrow> <mrow> <mtext>dV</mtext> </mrow> </mfrac> </mrow> </mfenced> <mo>=</mo> <mo>-</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>P</mtext> </mrow> <mrow> <mtext>V</mtext> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math><br /><br /><math> <mrow> <mo>∴</mo> </mrow> </math>&nbsp;Bulk modulus, <math> <mrow> <mtext>B</mtext> <mo>=</mo> <mo>-</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>dP</mtext> </mrow> <mrow> <mtext>dV</mtext> <mo>/</mo> <mtext>V</mtext> </mrow> </mfrac> </mrow> </mfenced> <mo>=</mo> <mo>-</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>dP</mtext> </mrow> <mrow> <mtext>dV</mtext> </mrow> </mfrac> </mrow> </mfenced> <mtext>V</mtext> </mrow> </math><br /><br /><math> <mrow><mo>∴&nbsp;&nbsp;&nbsp;</mo> <mtext>B</mtext> <mo>=</mo> <mo>-</mo> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mo>-</mo> <mfrac> <mrow> <mtext>P</mtext> </mrow> <mrow> <mtext>V</mtext> </mrow> </mfrac> </mrow> </mfenced> <mtext>V</mtext> </mrow> </mfenced> <mo>=</mo> <mtext>P</mtext> </mrow> </math><br /><br /><math> <mrow> <mo>∴&nbsp;&nbsp;&nbsp;</mo> <mtext>B</mtext> <mo>=</mo> <mtext>P</mtext> </mrow> </math><br /><br /><strong>Note:</strong> Adiabatic bulk modulus is given by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mi>γP</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c81417f664b6c9f5", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "55", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "One mole of an ideal&nbsp;monatomic gas undergoes an adiabatic expansion in which its volume becomes eight times its initial value. If the initial temperature of the gas is <math> <mrow> <mn>100</mn><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mtext>K</mtext></mrow> </math> and the universal gas constant <math><mi>R</mi><mo>=</mo><mn>8.0</mn><mi>&#160;J</mi><mi>&#160;</mi><mn>mo</mn><msup><mrow><mn>l</mn></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mrow><mn>&#160;K</mn></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>, then how much is the&nbsp;decrease in its internal energy (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">J</mi></math>) ?", "image": null}, "options": [], "correctValue": "900", "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mi>i</mi></msub><mo>=</mo><mi>V</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mi>f</mi></msub><mo>=</mo><mn>8</mn><mi>V</mi></math><br /><br />For adiabatic process <math><mo>{</mo><mrow><mi>&#947;</mi><mo>=</mo><mrow><mn>5/</mn></mrow><mrow><mn>3</mn></mrow></mrow></math> for monoatomic gas<math><mo>}</mo></math><br /><br /><math> <mrow> <msub> <mi>T</mi> <mn>1</mn> </msub> <mo>&#8901;</mo><msubsup> <mi>V</mi> <mn>1</mn> <mrow> <mi>&#947;</mi><mo mo>&#8710;</mo><msub><mi>T</mi><mi mathvariant=\"normal\">A</mi></msub></math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(I)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&nbsp;is held fixed, therefore, heat will be supplied at constant volume.<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><msub><mi>Q</mi><mtext>B</mtext></msub><mo>=</mo><mi>n</mi><msub><msub><mi>C</mi><mtext>V</mtext></msub><mtext>B</mtext></msub><mo>&#8710;</mo><msub><mi>T</mi><mi>B</mi></msub></math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(ii)<br /><br />But&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><msub><mi>Q</mi><mtext>A</mtext></msub><mo>=</mo><mo>&#8710;</mo><msub><mi>Q</mi><mtext>B</mtext></msub></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><msub><mtext mathvariant=\"italic\">nC</mtext><mtext>P</mtext></msub><mtext>A</mtext></msub><mtext mathvariant=\"italic\">&#8710;</mtext><msub><mi>T</mi><mi mathvariant=\"italic\">A</mi></msub><mo>=</mo><msub><msub><mtext mathvariant=\"italic\">nC</mtext><mtext>v</mtext></msub><mtext>B</mtext></msub><mtext mathvariant=\"italic\">&#8710;</mtext><msub><mi>T</mi><mi mathvariant=\"italic\">B</mi></msub></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><msub><mi>T</mi><mtext>B</mtext></msub><mo>=</mo><mfenced><mfrac><msub><mtext>C</mtext><mtext>P</mtext></msub><msub><mtext>C</mtext><mtext>V</mtext></msub></mfrac></mfenced><mo>&#8710;</mo><msub><mi>T</mi><mi mathvariant=\"normal\">A</mi></msub></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo>
