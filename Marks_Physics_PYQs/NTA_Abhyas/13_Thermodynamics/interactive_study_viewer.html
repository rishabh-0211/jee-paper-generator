r /><math> <mrow> <mfrac> <mn>1</mn> <mn>2</mn> </mfrac> <mrow><mo>(</mo> <mrow> <mfrac> <mn>1</mn> <mn>2</mn> </mfrac> <mi>I</mi><msup> <mi>ω</mi> <mn>2</mn> </msup> </mrow> <mo>)</mo></mrow><mo>=</mo><mi>C</mi><mtext> </mtext><mi>m</mi><mtext> </mtext><mtext>θ,</mtext> </mrow> </math><br /><br /><math> <mrow> <mo>⇒</mo><mfrac> <mn>1</mn> <mn>4</mn> </mfrac> <mrow><mo>(</mo> <mrow> <mfrac> <mn>2</mn> <mn>5</mn> </mfrac> <mi>m</mi><msup> <mi>r</mi> <mn>2</mn> </msup> </mrow> <mo>)</mo></mrow><msup> <mrow> <mrow><mo>(</mo> <mrow> <mn>2</mn><mi>π</mi><mi>n</mi> </mrow> <mo>)</mo></mrow> </mrow> <mn>2</mn> </msup> <mo>=</mo><mi>C</mi><mtext> </mtext><mi>m</mi><mtext> </mtext><mi>θ</mi> </mrow></math><br /><br /><math> <mrow> <mo>⇒</mo><mtext>θ</mtext><mo>=</mo><mfrac> <mn>2</mn> <mn>5</mn> </mfrac> <mfrac> <mrow> <msup> <mtext>π</mtext> <mn>2</mn> </msup> <msup> <mi>n</mi> <mn>2</mn> </msup> <msup> <mi>r</mi> <mn>2</mn> </msup> </mrow> <mi>c</mi> </mfrac> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a5c6964f0e15819d", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "71", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "There is a sample of diatomic gas in a container (whose volume is constant). The temperature of this gas was increased greatly so some molecules fell into atoms (dissociated). The pressure of the gas increased by a factor of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn></math> and the internal energy of the gas increased to a value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>.</mo><mn>4</mn><mo>&nbsp;</mo><mi>times</mi></math> the original internal energy. By what factor did the temperature of the gas (measured in Kelvin) increase?", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "<p> <math><semantics><mrow><mi>P</mi><mi>V</mi><mo>=</mo><mi>n</mi><mi>R</mi><mi>T</mi></mrow></semantics></math> ; <math><semantics><mrow><mn>6</mn><mi>P</mi><mi>V</mi><mo>=</mo><mo form=\"prefix\" stretchy=\"false\">(</mo><msub><mi>n</mi><mn>2</mn></msub><mo>+</mo><mn>2</mn><msub><mi>n</mi><mn>2</mn></msub><mo form=\"postfix\" stretchy=\"false\">)</mo><mi>R</mi><mi>T</mi><mi>′</mi><mo accent=\"false\">⇒</mo><mn>6</mn><mo>=</mo><mfrac><mrow><msub><mi>n</mi><mn>2</mn></msub><mo>+</mo><mn>2</mn><msub><mi>n</mi><mn>2</mn></msub></mrow><mi>n</mi></mfrac><mfrac><msup><mi>T</mi><mi>′</mi></msup><mi>T</mi></mfrac></mrow></semantics></math> ... (i)</p><p> <math><semantics><mrow><mi>U</mi><mo>=</mo><mi>n</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mfrac><mn>5</mn><mn>2</mn></mfrac><mi>R</mi><mi>T</mi><mo form=\"postfix\" stretchy=\"false\">)</mo></mrow></semantics></math> ; <math><semantics><mrow><mn>4.4</mn><mi>U</mi><mo>=</mo><msub><mi>n</mi><mn>2</mn></msub><mo form=\"prefix\" stretchy=\"false\">(</mo><mfrac><mn>5</mn><mn>2</mn></mfrac><mi>R</mi><mi>T</mi><mi>′</mi><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>+</mo><mn>2</mn><msub><mi>n</mi><mn>2</mn></msub><mo form=\"prefix\" stretchy=\"false\">(</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>R</mi><mi>T</mi><mi>′</mi><mo form=\"postfix\" stretchy=\"false\">)</mo></mrow></semantics></math> </p><p> <math><semantics><mrow><mn>4.4</mn><mo>=</mo><mfrac><mrow><mi>n</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mfrac><mn>5</mn><mn>2</mn></mfrac><mi>R</mi><msup><mi>T</mi><mi>′</mi></msup><mo form=\"postfix\" stretchy=\"false\">)</mo><mo>+</mo><msub><mi>n</mi><mn>2</mn></msub><mn>3</mn><mi>R</mi><msup><mi>T</mi><mi>′</mi></msup></mrow><mrow><mi>n</mi><mo form=\"prefix\" stretchy=\"false\">(</mo><mfrac><mn>5</mn><mn>2</mn></mfrac><mi>R</mi><mi>T</mi><mo form=\"postfix\" stretchy=\"false\">)</mo></mrow></mfrac></mrow></semantics></math> <math><semantics><mrow><mn>4.4</mn><mo>=</mo><mfrac><mrow><msub><mi>n</mi><mn>1</mn></msub><mo>+</mo><mfrac><mn>6</mn><mn>5</mn></mfrac><msub><mi>n</mi><mn>2</mn></msub></mrow><mi>n</mi></mfrac><mfrac><msup><mi>T</mi><mi>′</mi></msup><mi>T</mi></mfrac></mrow></semantics></math> ... (ii)</p><p> <math><semantics><mrow><mfrac><mn>6</mn><mn>4.4</mn></mfrac><mo>=</mo><mfrac><mrow><msub><mi>n</mi><mn>1</mn></msub><mo>+</mo><mn>2</mn><msub><mi>n</mi><mn>2</mn></msub></mrow><mrow><msub><mi>n</mi><mn>1</mn></msub><mo>+</mo><mfrac><mn>6</mn><mn>5</mn></mfrac><msub><mi>n</mi><mn>2</mn></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>5</mn><msub><mi>n</mi><mn>1</mn></msub><mo>+</mo><mn>10</mn><msub><mi>n</mi><mn>2</mn></msub></mrow><mrow><mn>5</mn><msub><mi>n</mi><mn>1</mn></msub><mo>+</mo><mn>6</mn><msub><mi>n</mi><mn>2</mn></msub></mrow></mfrac></mrow></semantics></math> ; <math><semantics><mrow><mn>30</mn><mspace width=\"0.167em\"></mspace><msub><mi>n</mi><mn>1</mn></msub><mo>+</mo><mn>36</mn><mspace width=\"0.167em\"></mspace><msub><mi>n</mi><mn>2</mn></msub><mo>=</mo><mn>22</mn><mspace width=\"0.167em\"></mspace><msub><mi>n</mi><mn>1</mn></msub><mo>+</mo><mn>44</mn><msub><mi>n</mi><mn>2</mn></msub></mrow></semantics></math> ; <math><semantics><mrow><mn>8</mn><mspace width=\"0.167em\"></mspace><msub><mi>n</mi><mn>1</mn></msub><mo>=</mo><mn>8</mn><mspace width=\"0.167em\"></mspace><msub><mi>n</mi><mn>2</mn></msub><mo accent=\"false\">⇒</mo><mtext mathvariant=\"normal\">  </mtext><msub><mi>n</mi><mn>1</mn></msub><mo>=</mo><msub><mi>n</mi><mn>2</mn></msub></mrow></semantics></math> </p><p>Also, <math><semantics><mrow><msub><mi>n</mi><mn>1</mn></msub><mo>+</mo><msub><mi>n</mi><mn>2</mn></msub><mo>=</mo><mi>n</mi><mo accent=\"false\">⇒</mo><msub><mi>n</mi><mn>1</mn></msub><mo>=</mo><msub><mi>n</mi><mn>2</mn></msub><mo>=</mo><mfrac><mi>n</mi><mn>2</mn></mfrac></mrow></semantics></math> ; <math><semantics><mrow><mn>6</mn><mo>=</mo><mo form=\"prefix\" stretchy=\"false\">(</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>+</mo><mn>1</mn><mo form=\"postfix\" stretchy=\"false\">)</mo><mfrac><msup><mi>T</mi><mi>′</mi></msup><mi>T</mi></mfrac><mo accent=\"false\">⇒</mo><msup><mi>T</mi><mi>′</mi></msup><mo>=</mo><mn>4</mn><mi>T</mi></mrow></semantics></math> </p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a5a3e77739391e01", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "85", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In a given process of an ideal gas, <math>&nbsp;&nbsp;<mrow><mtext mathvariant=\"italic\">dW</mtext> <mo>=</mo> <mn>0&nbsp;</mn> <mtext>and&nbsp;</mtext><mtext mathvariant=\"italic\">dQ</mtext> <mo>&lt;</mo> <mn>0</mn> </mrow> </math>. Then for the gas", "image": null}, "options": [{"id": "tQFoR", "text": "The temperature will decrease", "image": null, "isCorrect": true}, {"id": "oIXPj", "text": "The volume will increase", "image": null, "isCorrect": false}, {"id": "ViOoV", "text": "The pressure will remain contain", "image": null, "isCorrect": false}, {"id": "Z8azq", "text": "The temperature will increase", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>From first law of thermodynamics,<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math><mrow> <mtext>dQ</mtext> <mo>=</mo> <mtext>dU</mtext> <mo>+</mo> <mtext>dW</mtext> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp; &nbsp;<math> <mrow> <mtext>dQ</mtext> <mo>=</mo> <mtext>dU</mtext> <mtext>,&nbsp;</mtext> <mtext>if&nbsp; dW = 0</mtext> </mrow> </math><br /><br />Since,&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math> <mrow> <mtext>dQ</mtext> <mo>&lt;</mo> <mn>0</mn> </mrow> </math><br /><br />Therefore, <math> <mrow> <mtext>dU</mtext> <mo>&lt;</mo> <mn>0&nbsp;</mn>&nbsp; <mtext>or&nbsp;</mtext>&nbsp;&nbsp;&nbsp; <msub> <mtext mathvariant=\"italic\">U</mtext> <mtext>Final</mtext> </msub> <mo>&lt;</mo> <msub> <mtext mathvariant=\"italic\">U</mtext> <mtext>initial</mtext> </msub> </mrow> </math><br /><br />so, the temperature will decrease.<br /><br /><strong>Note:</strong> Internal energy U of an ideal gas depends only on the temperature of the gas. The internal energy of n moles of an ideal gas is given by nC<sub>v</sub> dT</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a3e12aab0aba834a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "38", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An ideal diatomic gas occupies a volume <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>1</mn></msub></math> at a pressure <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub></math>. The gas undergoes a process in which the pressure is proportional to the volume. If at the end of the process the R.M.S. speed of the gas molecules has doubled its initial value, then the heat supplied to the gas, in the given process, is", "image": null}, "options": [{"id": "6yjkz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "ImXhB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "w9iro", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub></math>", "image": null, "isCorrect": true}, {"id": "ZETBS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>As&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>&#8733;</mo><mi>V</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mi>V</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo><mi>constant</mi></math>&nbsp;</p><p>comparing the above equation with&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mi>V</mi><mi>x</mi></msup><mo>=</mo><mi>constant</mi></math>, we get&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mo>-</mo><mn>1</mn></math><br /><br />Also, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>=</mo><msub><mi>C</mi><mi>V</mi></msub><mo>-</mo><mfrac><mi>R</mi><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mn>5</mn><mn>2</mn></mfrac><mi>R</mi><mo>-</mo><mfrac><mi>R</mi><mrow><mo>-</mo><mn>1</mn><mo>-</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mn>3</mn><mi>R</mi></math><br /><br />But as RMS speed is doubled therefore temperature becomes four times.<br />Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>=</mo><mi>n</mi><mi>C</mi><mo>&#916;</mo><mi>T</mi><mo>=</mo><mi>n</mi><mo>&#215;</mo><mn>3</mn><mi>R</mi><mo>&#215;</mo><mn>3</mn><msub><mi>T</mi><mi>i</mi></msub><mo>=</mo><mn>9</mn><mi>n</mi><mi>R</mi><msub><mi>T</mi><mi>i</mi></msub></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>9</mn><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub></math>&nbsp;</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639db11a81c2b0f6cb", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "43", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The molar heat capacity of a monoatomic ideal gas undergoing the process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mi>V</mi><mrow><mn>1</mn><mo>/</mo><mn>2</mn></mrow></msup><mo>=</mo><mi>constant</mi></math>&nbsp;is", "image": null}, "options": [{"id": "KmhMU", "text": "<math><mfrac><mrow><mn>15</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>R</mi></math>", "image": null, "isCorrect": false}, {"id": "o1tJ8", "text": "<math><mfrac><mrow><mn>23</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>R</mi></math>", "image": null, "isCorrect": false}, {"id": "d1vv6", "text": "<math><mfrac><mrow><mn>7</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>R</mi></math>", "image": null, "isCorrect": true}, {"id": "kYrxU", "text": "Zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a polytropic process, specific heat of an ideal gas is given by,<br /><math><mi mathvariant=\"normal\">c</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mi mathvariant=\"normal\">γ</mi><mo>-</mo><mn>1</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>1</mn><mo>-</mo><mi mathvariant=\"normal\">n</mi></mrow></mfrac><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">&nbsp;</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi mathvariant=\"normal\">n</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">&nbsp;,&nbsp;</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">y</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">s</mi></mrow></mfenced></math><br /><math><mi mathvariant=\"normal\">c</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mfrac><mrow><mn>5</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>-</mo><mn>1</mn></mrow></mfrac><mo>+</mo><mn>2</mn><mi mathvariant=\"normal\">R</mi></math><br /><math><mo>=</mo><mfrac><mrow><mn>3</mn><mi>R</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>+</mo><mn>2</mn><mi>R</mi><mo>=</mo><mfrac><mrow><mn>7</mn><mi>R</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86399d70c8cf4330013", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "07", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A monoatomic gas of molar mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>M</mi><mn>0</mn></msub></math>&nbsp;is filled into an insulated container which is moving along a horizontal surface with velocity a&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math>. If the container is stopped&nbsp;suddenly, then the change in temperature of the gas is</p>\r", "image": null}, "options": [{"id": "1xMFf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>M</mi><mn>0</mn></msub><msup><mi>v</mi><mn>2</mn></msup></mrow><mrow><mn>2</mn><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "eIJIq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>M</mi><mn>0</mn></msub><msup><mi>v</mi><mn>2</mn></msup></mrow><mrow><mn>3</mn><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "kZtzs", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><msub><mi>M</mi><mn>0</mn></msub><msup><mi>v</mi><mn>2</mn></msup></mrow><mrow><mn>3</mn><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "1ID01", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><msub><mi>M</mi><mn>0</mn></msub><msup><mi>v</mi><mn>2</mn></msup></mrow><mrow><mn>2</mn><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>If the container is suddenly stopped loss in kinetic energy of the gas is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>K</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mrow><mi>n</mi><msub><mi>M</mi><mn>0</mn></msub></mrow></mfenced><msup><mi>v</mi><mn>2</mn></msup></math>, where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>&nbsp;is the number of moles of the gas.</p><p>If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>T</mi></math>&nbsp;is the change in the temperature of the gas, then</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>n</mi><mi>R</mi><mi>&#916;</mi><mi>T</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mrow><mi>n</mi><msub><mi>M</mi><mn>0</mn></msub></mrow></mfenced><msup><mi>v</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>T</mi><mo>=</mo><mfrac><mrow><msub><mi>M</mi><mn>0</mn></msub><msup><mi>v</mi><mn>2</mn></msup></mrow><mrow><mn>3</mn><mi>R</mi></mrow></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639952b62282fc90f9", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "79", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "One mole of a&nbsp; certain ideal gas obtains an amount of heat&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>1</mn><mo>.</mo><mn>60</mn><mo>&nbsp;</mo><mi>kJ</mi></math>&nbsp;when its temperature is increased by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>Δ</mo><mi>T</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>72</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math>, keeping its pressure constant.&nbsp;The value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>C</mi><mi>P</mi></msub><msub><mi>C</mi><mi>V</mi></msub></mfrac></math>&nbsp;for the gas is", "image": null}, "options": [{"id": "HZOuM", "text": "1.60", "image": null, "isCorrect": true}, {"id": "TZilK", "text": "1.40", "image": null, "isCorrect": false}, {"id": "LXCV6", "text": "1.50", "image": null, "isCorrect": false}, {"id": "WmlN1", "text": "1.30", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "By the first law of thermodynamics<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>&Delta;</mo> <mtext>Q</mtext> <mo>=</mo> <mo>&Delta;</mo> <mtext>U</mtext> <mo>+</mo> <mo>&Delta;</mo> <mtext>W</mtext> </mrow> </math><br /><br />In an isobaric process<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>&Delta;</mo> <mtext>Q</mtext> <mo>=</mo> <msub> <mtext>C</mtext> <mtext>p</mtext> </msub> <mo>&Delta;</mo> <mtext>T</mtext> </mrow> </math><br /><br />and&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>&Delta;</mo> <mtext>U</mtext> <mo>=</mo> <msub> <mtext>C</mtext> <mtext>v</mtext> </msub> <mo>&Delta;</mo> <mtext>T</mtext> </mrow> </math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(always)<br /><br /><math> <mrow> <mo>&there4;&nbsp;&nbsp;&nbsp;</mo> <msub> <mtext>C</mtext> <mtext>p</mtext> </msub> <mo>&Delta;</mo> <mtext>T</mtext> <mo>=</mo> <msub> <mtext>C</mtext> <mtext>v</mtext> </msub> <mo>&Delta;</mo> <mtext>T</mtext> <mo>+</mo> <mo>&Delta;</mo> <mtext>W</mtext> </mrow> </math><br /><br />or&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>&Delta;</mo> <mtext>W</mtext> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>C</mtext> <mtext>p</mtext> </msub> <mo>-</mo> <msub> <mtext>C</mtext> <mtext>v</mtext> </msub> </mrow> </mfenced> <mo>&Delta;</mo> <mtext>T</mtext> </mrow> </math><br /><br />or&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>&Delta;</mo> <mtext>W</mtext> <mo>=</mo> <mtext>R</mtext> <mo>&Delta;</mo> <mtext>T</mtext> </mrow> </math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mo>∵</mo> <msub> <mtext>C</mtext> <mtext>p</mtext> </msub> <mo>-</mo> <msub> <mtext>C</mtext> <mtext>v</mtext> </msub> <mo>=</mo> <mtext>R</mtext> </mrow> </mfenced> </mrow> </math><br /><br /><math> <mrow> <mo>&there4;&nbsp;&nbsp;&nbsp;</mo> <mo>&Delta;</mo> <mtext>W</mtext> <mo>=</mo> <mtext>8.3</mtext> <mo>&times;</mo> <mn>7</mn> <mn>2</mn> <mo>=</mo> <mtext>597.6</mtext> <mo>J</mo> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>&Delta;</mo> <mtext>Q</mtext> <mo>=</mo> <msub> <mtext>C</mtext> <mtext>p</mtext> </msub> <mo>&Delta;</mo> <mtext>T</mtext> </mrow> </math><br /><br /><math> <mrow> <mo>&there4;&nbsp;&nbsp;&nbsp;</mo> <mtext>1.6</mtext> <mo>&times;</mo> <mn>1</mn> <mn>0</mn> <mn>0</mn> <mn>0</mn> <mo>=</mo> <msub> <mtext>C</mtext> <mtext>p</mtext> </msub> <mo>&times;</mo> <mn>7</mn> <mn>2</mn> </mrow> </math><br /><br /><math> <mrow> <mo>&rArr;&nbsp;&nbsp;&nbsp;</mo> <msub> <mtext>C</mtext> <mtext>p</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mtext>1.6</mtext> <mo>&times;</mo> <mn>1</mn> <mn>0</mn> <mn>0</mn> <mn>0</mn> </mrow> <mrow> <mn>7</mn> <mn>2</mn> </mrow> </mfrac> <mo>=</mo> <mtext>22.2</mtext> <msup> <mtext>&nbsp;J mol</mtext> <mrow> <mo>-</mo> <mn>1</mn> </mrow> </msup> <msup> <mtext>K</mtext> <mrow> <mo>-</mo> <mn>1</mn> </mrow> </msup> </mrow> </math><br /><br /><math> <mrow> <mo>&Delta;</mo> <mtext>U</mtext> <mo>=</mo> <mo>&Delta;</mo> <mtext>Q</mtext> <mo>=</mo> <mo>&Delta;</mo> <mtext>W</mtext> <mo>=</mo> <mtext>1.6</mtext> <mo>&times;</mo> <mn>1</mn> <mn>0</mn> <mn>0</mn> <mn>0</mn> <mo>-</mo> <mtext>597.6 J</mtext> <mo>=</mo> <mtext>1002.4 J</mtext> </mrow> </math><br /><br />But&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>&Delta;</mo> <mtext>U</mtext> <mo>=</mo> <msub> <mtext>C</mtext> <mtext>v</mtext> </msub> <mo>&Delta;</mo> <mtext>T</mtext> </mrow> </math><br /><br /><math> <mrow> <mo>&there4;&nbsp;&nbsp;&nbsp;</mo> <msub> <mtext>C</mtext> <mtext>v</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mtext>1002.4</mtext> </mrow> <mrow> <mn>7</mn> <mn>2</mn> </mrow> </mfrac> <mo>=</mo> <mtext>13.9</mtext> <msup> <mtext>J mol</mtext> <mrow> <mo>-</mo> <mn>1</mn> </mrow> </msup> <msup> <mtext>K</mtext> <mrow> <mo>-</mo> <mn>1</mn> </mrow> </msup> </mrow> </math><br /><br /><math> <mrow> <mo>&there4;&nbsp;&nbsp;&nbsp;</mo> <mi>&gamma;</mi> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>C</mtext> <mtext>p</mtext> </msub> </mrow> <mrow> <msub> <mtext>C</mtext> <mtext>v</mtext> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>22.2</mtext> </mrow> <mrow> <mtext>13.9</mtext> </mrow> </mfrac> <mo>=</mo> <mtext>1.60</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639908b7959089e98b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "32", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "One mole of an ideal monatomic gas undergoes a cyclic process as shown in the figure. If the temperature of the gas at state <math><mn>1</mn></math> is <math><mn>300</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">K</mi></math> and at state <math><mn>4</mn></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>500</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">K</mi></math>, then heat exchanged during process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>→</mo><mn>3</mn></math>, is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/image__3_.png\" style=\"width: 200px; height: 129px;\" />", "image": null}, "options": [{"id": "Cjbde", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1000</mn><mi mathvariant=\"normal\">R</mi></math>", "image": null, "isCorrect": true}, {"id": "PUAjS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>600</mn><mi mathvariant=\"normal\">R</mi></math>", "image": null, "isCorrect": false}, {"id": "8ZM7l", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>750</mn><mi mathvariant=\"normal\">R</mi></math>", "image": null, "isCorrect": false}, {"id": "iRQWF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>800</mn><mi mathvariant=\"normal\">R</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">Q</mi><mn>23</mn></msub><mo>=</mo><msub><mi>nC</mi><mi mathvariant=\"normal\">P</mi></msub><mfenced separators=\"|\"><mrow><msub><mi mathvariant=\"normal\">T</mi><mn>3</mn></msub><mo>&#8211;</mo><msub><mi mathvariant=\"normal\">T</mi><mn>2</mn></msub></mrow></mfenced></math></p><p>The processes&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#8594;</mo><mn>2</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&#8594;</mo><mn>4</mn></math>&nbsp;are isochoric in nature. Hence, for these processes&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>&#8733;</mo><mi mathvariant=\"normal\">P</mi></math>. As a result, we obtain,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">T</mi><mn>3</mn></msub><mo>=</mo><mn>1000</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">K</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">T</mi><mn>2</mn></msub><mo>=</mo><mn>600</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">K</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">Q</mi><mn>23</mn></msub><mo>=</mo><mn>1</mn><mo>&#215;</mo><mfrac><mrow><mn>5</mn><mi mathvariant=\"normal\">R</mi></mrow><mn>2</mn></mfrac><mo>&#215;</mo><mn>400</mn><mo>=</mo><mn>1000</mn><mi mathvariant=\"normal\">R</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86396338cbcde2f4707", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "44", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A boy weighing <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&nbsp;</mo><mi>kg</mi></math>&nbsp;eat some bananas. The energy content of the bananas is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1000</mn><mo>&nbsp;</mo><mi>cal</mi></math>. If the boy uses all of this energy to jump upwards from the ground, then the height up to which his centre of mass will rise is [mechanical equivalent of heat =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>.</mo><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi><mo>&nbsp;</mo><msup><mi>cal</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mo>=</mo><mn>10</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>]", "image": null}, "options": [], "correctValue": "8.4", "solution": {"text": "<p>Energy used by the boy is<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mo>=</mo><mo>1000</mo><mo>×</mo><mn>4</mn><mo>.</mo><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>4200</mn><mo>=</mo><mn>50</mn><mo>×</mo><mn>10</mn><mo>×</mo><mi>h</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>h</mi><mo>=</mo><mn>8</mn><mo>.</mo><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86395fd4fb1db90a933", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "79", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A lead bullet of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mo>g</mo></math> travelling at <math><mn>300 m&nbsp;</mn><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> strikes against a block of wood comes to rest. Assuming <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>%</mo></math> of heat is absorbed by the bullet, the increase in its temperature&nbsp; (Specific heat of lead =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>150</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi><mo>&nbsp;</mo><mn>k</mn><msup><mn>g</mn><mrow><mo>-</mo><mn>1&nbsp;</mn></mrow></msup><msup><mn>k</mn><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>)&nbsp;", "image": null}, "options": [{"id": "xGeUx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mi>&#160;&#8451;</mi></math>", "image": null, "isCorrect": false}, {"id": "RIgjD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>125</mn><mi>&#160;&#8451;</mi></math>", "image": null, "isCorrect": false}, {"id": "btn8t", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>150</mn><mi>&#160;&#8451;</mi></math>", "image": null, "isCorrect": true}, {"id": "OknPQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mi>&#160;&#8451;</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here, <math><mi>m</mi><mo>=</mo><mn>10</mn></math> g =<math><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></math> kg<br /><br /><math><mi>v</mi><mo>=</mo><mn>300</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">m&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>,&nbsp;</mo> <mi>Δ</mi> <mi>θ</mi><mo>=</mo><mo>?,&nbsp;</mo><mi>C</mi><mo>=</mo><mn>150</mn></math> <math> <mrow> <mtext>&nbsp;J</mtext><mtext>&nbsp;k</mtext><mtext> </mtext><msup> <mtext>g</mtext> <mrow> <mo>−</mo><mn>1</mn></mrow> </msup> <mtext> </mtext><mtext> </mtext><msup> <mtext>K</mtext> <mrow> <mo>−</mo><mn>1</mn></mrow> </msup> </mrow> </math><br /><br /><math><mi>Q</mi><mo>=</mo><mfrac><mrow><mn>50</mn></mrow><mrow><mn>100</mn></mrow></mfrac><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>m</mi><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup><msup><mrow><mfenced separators=\"|\"><mrow><mn>300</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>225</mn><mi>&nbsp;</mi></math>J<br /><br />From&nbsp; <math> <mrow> <mi>Q</mi><mo>=</mo><mi>m</mi><mi>C</mi><mi>Δ</mi><mi>θ</mi></mrow> </math><br /><br /><math><mi mathvariant=\"normal\">θ</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>=</mo><mfrac><mrow><mi>Q</mi></mrow><mrow><mi>C</mi><mi>m</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>225</mn></mrow><mrow><mn>150</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfrac><mo>=</mo><mn>150</mn><mn>&nbsp;℃</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86392e9667d64b744ca", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "14", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An ideal monatomic gas is confined in a cylinder by a spring-loaded massless piston of cross-section <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>3</mn></mrow></msup><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math>. The piston can slide on the walls of the cylinder without any friction. Initially, the gas is at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math>&nbsp;and occupies a volume of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.4</mo><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>3</mn></mrow></msup><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>3</mn></msup></math> and the spring is in its relaxed position. Now, gas is slowly heated by a small electric heater and the piston moves out slowly by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.1</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>. Calculate the final temperature of the gas and the heat supplied by the heater. The force constant of the spring is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8000</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi><mo>/</mo><mi mathvariant=\"normal\">m</mi></math> and atmospheric pressure is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>×</mo><msup><mn>10</mn><mrow><mn>5</mn><mo>&nbsp;</mo></mrow></msup><mi mathvariant=\"normal\">N</mi><mo>/</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math>.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0629599.jpg\" style=\"width: 301px; height: 131px;\" />", "image": null}, "options": [{"id": "ATtlY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mn>600</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">K</mi><mo>,</mo><mo>&#xA0;</mo><mi>Q</mi><mo>=</mo><mn>680</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "YM4Ry", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mn>800</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">K</mi><mo>,</mo><mo>&#xA0;</mo><mi>Q</mi><mo>=</mo><mn>600</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "JzDcD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mn>600</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">K</mi><mo>,</mo><mo>&#xA0;</mo><mi>Q</mi><mo>=</mo><mn>720</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "YJX5A", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mn>800</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">K</mi><mo>,</mo><mo>&#xA0;</mo><mi>Q</mi><mo>=</mo><mn>720</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>In the initial condition</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub><mo>=</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&#160;</mo><mi>Pa</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn><mo>.</mo><mn>4</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>3</mn></msup></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>1</mn></msub><mo>=</mo><mn>300</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p><p>Finally,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>2</mn></msub><mo>=</mo><msub><mi>P</mi><mn>1</mn></msub><mo>+</mo><mfrac><mrow><mi>k</mi><mi>x</mi></mrow><mi>A</mi></mfrac><mo>=</mo><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&#160;</mo><mi>Pa</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>2</mn></msub><mo>=</mo><msub><mi>V</mi><mn>1</mn></msub><mo>+</mo><mi>A</mi><mi>x</mi><mo>=</mo><mn>3</mn><mo>.</mo><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>3</mn></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub></mrow><msub><mi>T</mi><mn>1</mn></msub></mfrac><mo>=</mo><mfrac><mrow><msub><mi>P</mi><mn>2</mn></msub><msub><mi>V</mi><mn>2</mn></msub></mrow><msub><mi>T</mi><mn>2</mn></msub></mfrac></math>, on solving&nbsp;we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mn>800</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p><p>Applying&nbsp;work-energy theorem for the piston</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mi>gas</mi></msub><mo>+</mo><msub><mi>W</mi><mi>atmos</mi></msub><mo>+</mo><msub><mi>W</mi><mi>spring</mi></msub><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mi>gas</mi></msub><mo>=</mo><msub><mi>P</mi><mn>0</mn></msub><mi>A</mi><mi>x</mi><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>k</mi><msup><mi>x</mi><mn>2</mn></msup><mo>=</mo><mn>120</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#916;</mo><mi>U</mi><mo>=</mo><mi>n</mi><msub><mi>C</mi><mi>V</mi></msub><mo>&#916;</mo><mi>T</mi><mo>=</mo><mfrac><mrow><mi>n</mi><mi>R</mi><mo>&#916;</mo><mi>T</mi></mrow><mfenced><mrow><mi>&#947;</mi><mo>-</mo><mn>1</mn></mrow></mfenced></mfrac><mo>=</mo><mfrac><mrow><msub><mi>P</mi><mn>2</mn></msub><msub><mi>V</mi><mn>2</mn></msub><mo>-</mo><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub></mrow><mfenced><mrow><mi>&#947;</mi><mo>-</mo><mn>1</mn></mrow></mfenced></mfrac><mo>=</mo><mn>600</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>=</mo><mo>&#916;</mo><mi>U</mi><mo>+</mo><msub><mi>W</mi><mrow><mi>g</mi><mi>a</mi><mi>s</mi></mrow></msub><mo>=</mo><mn>6</mn><mn>0</mn><mn>0</mn><mo>+</mo><mn>1</mn><mn>2</mn><mn>0</mn><mo>=</mo><mn>7</mn><mn>2</mn><mn>0&#160;</mn><mi mathvariant=\"normal\">J</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638ce54329815885f1", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "91", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The temperature of equal masses of three different liquids A, B and C are <math><msup><mrow><mn>12</mn></mrow><mrow><mi>&nbsp;o</mi></mrow></msup><mn>C</mn><mo>,</mo><mi>&nbsp;</mi><msup><mrow><mn>19</mn></mrow><mrow><mi>&nbsp;o</mi></mrow></msup><mn>C</mn></math> and <math><msup><mrow><mn>28</mn></mrow><mrow><mi>&nbsp;o</mi></mrow></msup>< rac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638a35eb576490e2f3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "41", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>An ideal monoatomic gas undergoes an expansion from state <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;to state <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&nbsp;following a process which is shown in the indicator diagram. If initially during the expansion, the gas was absorbing heat and later on it was rejecting heat, then what was the volume of the gas when it started rejecting the heat?</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image2-a9fbc9ad-9fe1-4c13-acba-a9b6c6a7a9e3.jpg\" style=\"width: 200px; height: 151px;\" /></p>\r", "image": null}, "options": [{"id": "NTqs0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><msub><mi>V</mi><mn>0</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "T25d7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi><mo>=</mo><mfrac><mn>8</mn><mn>5</mn></mfrac><msub><mi>V</mi><mn>0</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "gaCqQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi><mo>=</mo><mfrac><mn>15</mn><mn>8</mn></mfrac><msub><mi>V</mi><mn>0</mn></msub></math>", "image": null, "isCorrect": true}, {"id": "c3Gsp", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi><mo>=</mo mi><mi>&#952;</mi><mo>)</mo></mrow><mrow><mo>(</mo><mi mathvariant=\"normal\">&#916;</mi><mi>t</mi><mo>)</mo></mrow></mfrac><mo>=</mo><mfrac><mi>P</mi><mrow><mi>m</mi><mi>s</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mfenced><mfrac><mrow><mi mathvariant=\"normal\">&#916;</mi><mi>&#952;</mi></mrow><mrow><mi mathvariant=\"normal\">&#916;</mi><mi>t</mi></mrow></mfrac></mfenced><mn>1</mn></msub><mo>=</mo><mfrac><mn>60</mn><mn>2</mn></mfrac><mo>=</mo><mn>30</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mfenced><mfrac><mrow><mi mathvariant=\"normal\">&#916;</mi><mi>&#952;</mi></mrow><mrow><mi mathvariant=\"normal\">&#916;</mi><mi>t</mi></mrow></mfrac></mfenced><mn>2</mn></msub><mo>=</mo><mfrac><mn>40</mn><mn>4</mn></mfrac><mo>=</mo><mn>10</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>s</mi><mn>1</mn></msub><msub><mi>s</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><msub><mfenced><mstyle displaystyle=\"true\"><mfrac bevelled=\"true\"><mrow><mi mathvariant=\"normal\">&#916;</mi><mi>&#952;</mi></mrow><mrow><mi mathvariant=\"normal\">&#916;</mi><mi>t</mi></mrow></mfrac></mstyle></mfenced><mn>2</mn></msub><msub><mfenced><mfrac bevelled=\"true\"><mrow><mi mathvariant=\"normal\">&#916;</mi><mi>&#952;</mi></mrow><mrow><mi mathvariant=\"normal\">&#916;</mi><mi>t</mi></mrow></mfrac></mfenced><mn>1</mn></msub></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863780558b3fde89759", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "105", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A diatomic ideal gas is heated at constant volume until the pressure is doubled and again heated at constant pressure until the volume is doubled. The average molar heat capacity for the whole process is", "image": null}, "options": [{"id": "McuOg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>1</mn><mn>3</mn><mi>R</mi></mrow><mn>6</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "7puWO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>1</mn><mn>9</mn><mi>R</mi></mrow><mn>6</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "hu9I7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mn>3</mn><mi>R</mi></mrow><mn>6</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "BhOxK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>1</mn><mn>7</mn><mi>R</mi></mrow><mn>6</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let initial pressure, volume and temperature be P<sub>0</sub>, V<sub>0</sub> and T<sub>0</sub>, respectively, indicated by state A in P-V diagram. The gas is then isochorically taken to state B (2P<sub>0</sub>, V<sub>0</sub>, 2T<sub>0</sub>) and then taken from state B to state C (2P<sub>0</sub>, 2V<sub>0</sub>, 4T<sub>0</sub>) isobarically.<br /><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029739_Ans..jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 237px; height: 195px;\" /><br /><br /><br />Total heat absorbed by 1 mol of gas<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>Δ</mo> <mtext>Q</mtext> <mo>=</mo> <msub> <mtext>C</mtext> <mtext>v</mtext> </msub> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>2</mn> <msub> <mtext>T</mtext> <mn>0</mn> </msub> <mo>-</mo> <msub> <mtext>T</mtext> <mn>0</mn> </msub> </mrow> </mfenced> <mo>+</mo> <msub> <mtext>C</mtext> <mtext>P</mtext> </msub> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>4</mn> <msub> <mtext>T</mtext> <mn>0</mn> </msub> <mo>-</mo> <mn>2</mn> <msub> <mtext>T</mtext> <mn>0</mn> </msub> </mrow> </mfenced> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msub> <mtext>RT</mtext> <mn>0</mn> </msub> <mo>+</mo> <mfrac> <mrow> <mn>7</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> <mo>×</mo> <mn>2</mn> <msub> <mtext>T</mtext> <mn>0</mn> </msub> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>9</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msub> <mtext>RT</mtext> <mn>0</mn> </msub> </mrow> </math><br /><br />Total change in temperature from series A to C is <math> <mrow> <mo>Δ</mo> <mtext>T</mtext> <mo>=</mo> <mn>3</mn> <msub> <mtext>T</mtext> <mn>0</mn> </msub> </mrow> </math><br /><br />Therefore,<br /><br />Molar heat capacity <math> <mrow> <mo>=</mo> <mfrac> <mrow> <mo>Δ</mo> <mtext>Q</mtext> </mrow> <mrow> <mo>Δ</mo> <mtext>T</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mfrac> <mrow> <mn>1</mn> <mn>9</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msub> <mtext>RT</mtext> <mn>0</mn> </msub> </mrow> <mrow> <mn>3</mn> <msub> <mtext>T</mtext> <mn>0</mn> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>9</mn> </mrow> <mrow> <mn>6</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637774371615b511b7", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "30", " 1.1</mn><mo>×</mo><mn>1</mn><mo>×</mo><mfenced separators=\"|\"><mrow><mn>80</mn><mo>-</mo><mn>15</mn></mrow></mfenced><mo>+</mo><mn>0.02</mn><mo>×</mo><mfenced separators=\"|\"><mrow><mn>80</mn><mo>-</mo><mn>15</mn></mrow></mfenced></math><br /><br /><math><mn>540</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mo>+</mo><mn>20</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mo>=</mo><mn>71.5</mn><mo>+</mo><mn>1.30</mn></math><br /><br /><math><mo>⇒</mo><mi mathvariant=\"normal\">m</mi><mo>=</mo><mn>0.130</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86375babc92dce9b178", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "33", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A monatomic ideal gas sample is given heat <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Q</mi></math>. One half of this heat is used as work done by the gas and rest is used for increasing its internal energy. The equation of process in terms of volume and temperature is", "image": null}, "options": [{"id": "hFTIX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi mathvariant=\"normal\">V</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">T</mi><mn>3</mn></msup></mfrac><mo>=</mo></math> constant", "image": null, "isCorrect": true}, {"id": "bhOfF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi mathvariant=\"normal\">V</mi><mn>2</mn></msup><msqrt><mi mathvariant=\"normal\">T</mi></msqrt></mfrac><mo>=</mo></math> constant", "image": null, "isCorrect": false}, {"id": "T7ASF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>VT</mi><mn>3</mn></msup><mo>=</mo></math> constant", "image": null, "isCorrect": false}, {"id": "PjOUn", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">V</mi><mn>2</mn></msup><msqrt><mi mathvariant=\"normal\">T</mi></msqrt><mo>=</mo></math> constant", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>PdV</mi><mo>=</mo><msub><mi>nC</mi><mi mathvariant=\"normal\">v</mi></msub><mi>dT</mi><mi mathvariant=\"normal\">&nbsp;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mi>nRT</mi><mi mathvariant=\"normal\">V</mi></mfrac><mi>dV</mi><mo>=</mo><msub><mi>nC</mi><mi mathvariant=\"normal\">v</mi></msub><mi>dT</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mi>dV</mi><mi mathvariant=\"normal\">V</mi></mfrac><mo>=</mo><mfrac><mn>3</mn><mn>1</mn></mfrac><mfrac><mi>dT</mi><mi mathvariant=\"normal\">T</mi></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">V</mi><mn>2</mn></msup><mo>=</mo><msup><mi>CT</mi><mn>3</mn></msup></math>,&nbsp;Where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math> is a constant.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86372e69df94c0b7b75", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "50", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Corresponding to the process shown in figure, the heat given to the gas in the process&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mi>C</mi><mi>A</mi></math> is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>0</mn><mo>.</mo><mn>2</mn><mi>x</mi></mrow></mfenced></math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">J</mi></math>. Find value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>.<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/anjana.PNG\" style=\"width: 390px; height: 230px;\" />", "image": null}, "options": [], "correctValue": "5", "solution": {"text": "Cycle is clockwise. Hence heat will be given to the gas, as work done will be positive.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>=</mo><mi>W</mi><mo>=</mo></math>&nbsp;area of cycle =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863662b6137bab0fb0b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "28", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "One mole of a diatomic gas undergoes a process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub><mrow><mo>[</mo><mn>1</mn><mo>+</mo><msup><mrow><mo>(</mo><mi mathvariant=\"normal\">V</mi><mo>/</mo><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub><mo>)</mo></mrow><mn>3</mn></msup><mo>]</mo></mrow></mfrac></math>, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub></math> are constants. The translational kinetic energy of the gas when <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">V</mi><mo>=</mo><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub></math> is given by", "image": null}, "options": [{"id": "PvYFT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>5</mn><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub></mrow><mn>4</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "pfvzT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub></mrow><mn>2</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "AAEkk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>35</mn><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub></mrow><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "URcfs", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>5</mn><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub></mrow><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <mtext>P</mtext> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>P</mtext> <mn>0</mn> </msub> </mrow> <mrow> <mn>1</mn> <mo>+</mo> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>V</mtext> <mo>/</mo> <msub> <mtext>V</mtext> <mn>0</mn> </msub> </mrow> </mfenced> </mrow> <mn>3</mn> </msup> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>P</mtext> <mn>0</mn> </msub> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mtext>T</mtext> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>P</mtext> <mn>0</mn> </msub> <msub> <mtext>V</mtext> <mn>0</mn> </msub> </mrow> <mrow> <mn>2</mn> <mtext>R</mtext> </mrow> </mfrac> </mrow> </math><br /><br />Therefore, translational kinetic energy is equal to<br /><br /><math> <mrow> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>RT</mtext> <mo>=</mo> <mfrac> <mrow> <mn>3</mn> <mtext>R</mtext> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mfrac> <mrow> <msub> <mtext>P</mtext> <mn>0</mn> </msub> <msub> <mtext>V</mtext> <mn>0</mn> </msub> </mrow> <mrow> <mn>2</mn> <mtext>R</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>3</mn> <msub> <mtext>P</mtext> <mn>0</mn> </msub> <msub> <mtext>V</mtext> <mn>0</mn> </msub> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863651fa9f63a530f6b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "34", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "One mole of an ideal diatomic gas is taken through a process whose <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi><mo>-</mo><mi mathvariant=\"normal\">V</mi></math> diagram is shown in the figure. The work done by the gas is<br />\r<br />\r<img height=\"117\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ebsiaoyqzguripolstvhnkfkpaoarcdpqlsjqzzbwhvmpdvuxo.jpeg\" width=\"212\" />", "image": null}, "options": [{"id": "wKK6M", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#x3C0;P</mi><mn>0</mn></msub><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub><mo>+</mo><mn>2</mn><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "Lr38v", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>&#x3C0;P</mi><mn>0</mn></msub><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub></mrow><mn>2</mn></mfrac><mo>+</mo><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub></math>", "image": null, "isCorrect": true}, {"id": "NN4SB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mi>&#x3C0;P</mi><mn>0</mn></msub><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "EtIob", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>&#x3C0;P</mi><mn>0</mn></msub><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub></mrow><msqrt><mn>2</mn></msqrt></mfrac><mo>+</mo><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Work done = Area under the curve<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub><mo>+</mo><mfrac><mi mathvariant=\"normal\">&#960;</mi><mn>4</mn></mfrac><mfenced separators=\"|\"><mrow><mn>2</mn><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub></mrow></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635f7668ccd1d9dccc", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "88", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<math><mi>P</mi></math> - <math><mi>V</mi></math> diagram of an ideal gas is shown. The gas undergoes from initial state <math> <mi>A</mi> </math> to final state <math> <mi>B</mi> </math> such that initial and final volumes are same. Select the correct alternative for given process <math> <mrow> <mi>A</mi><mi>B</mi></mrow> </math>.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/335280q.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 161px; height: 131px;\" />", "image": null}, "options": [{"id": "VfeP3", "text": "Work done by gas is positive", "image": null, "isCorrect": false}, {"id": "EmAth", "text": "Work done by gas is negative", "image": null, "isCorrect": true}, {"id": "lA6jL", "text": "Temperature of gas increases continuously", "image": null, "isCorrect": false}, {"id": "9svgD", "text": "Process is isochoric", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/335280s.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 142px; height: 125px;\" /><br /><br />Volume does not remain constant throughout the process <math> <mrow>  <mi>A</mi><mi>B</mi></mrow></math>. As <math><mi>T</mi><mo>=</mo><mfrac><mrow><mi>P</mi><mi>V</mi></mrow><mrow><mi>n</mi><mi>R</mi></mrow></mfrac></math>, temperature decreases initially as both <math> <mi>P</mi></math> and <math> <mi>V</mi></math> decreases. By area under curve, net work done is negative.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635b52c536e657de40", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "02", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Some ideal monoatomic gas <math> <mtext>A</mtext> </math> in an enclosure has a pressure <math><mtext>P</mtext></math> and the temperature <math> <mrow> <mtext>T</mtext></mrow></math>. Another ideal monoatomic gas <math> <mtext>B</mtext> </math> enclosed in a container of the same volume has a pressure <math><mn>2</mn><mtext>P</mtext></math> and the temperature <math> <mrow> <mfrac> <mtext>T</mtext> <mn>2</mn></mfrac></mrow></math>. The ratio of the average kinetic energy per molecule of gas <math> <mtext>A</mtext> </math> to gas <math> <mtext>B</mtext> </math> is", "image": null}, "options": [{"id": "UgXJG", "text": "<math><mn>4</mn><mi mathvariant=\"normal\"> </mi><mo>:</mo><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "Cae8I", "text": "<math><mn>2</mn><mi mathvariant=\"normal\"> </mi><mo>:</mo><mn>1</mn></math>", "image": null, "isCorrect": true}, {"id": "QKFZ6", "text": "<math><mn>1</mn><mi mathvariant=\"normal\"> </mi><mo>:</mo><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "MGrVm", "text": "<math><mn>1</mn><mi mathvariant=\"normal\"> </mi><mo>:</mo><mn>4</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The average kinetic energy,  <math><mi mathvariant=\"normal\">K</mi><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">T</mi></math> <br/><br/> <math><mo>∴</mo><mi mathvariant=\"normal\">K</mi><mo>∝</mo><mi mathvariant=\"normal\">T</mi></math> <br/><br/> <math><mo>∴</mo><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mfrac><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>1</mn></mrow></mfrac></math> <br/><br/> <math><mo>∴</mo><msub><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mn>1</mn></mrow></msub><mi mathvariant=\"normal\"> </mi><mo>:</mo><msub><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\"> </mi><mo>:</mo><mn>1</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863567a7a6f6adc4c5e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "98", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A piece of ice falls from a height <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math>&nbsp;so that it melts completely. Only one-quarter of the heat produced is absorbed by the ice and all energy of ice gets converted into heat
