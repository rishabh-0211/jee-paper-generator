"heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A diatomic molecule can be modelled as two rigid balls connected with a spring such that the balls can vibrate with respect to the centre of mass of the system (spring + balls). Consider a diatomic gas made of such diatomic molecules. If the gas performs <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi></math>&nbsp;of work under isobaric condition, then heat given to the gas (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">J</mi></math>) is", "image": null}, "options": [], "correctValue": "70", "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>∆</mo><mi mathvariant=\"normal\">Q</mi></mrow><mi mathvariant=\"normal\">W</mi></mfrac><mo>=</mo><mfrac><mrow><msub><mi>nC</mi><mi mathvariant=\"normal\">p</mi></msub><mo>∆</mo><mi mathvariant=\"normal\">T</mi></mrow><mrow><mi>nR</mi><mo>∆</mo><mi mathvariant=\"normal\">T</mi></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mo>∆</mo><mi mathvariant=\"normal\">Q</mi><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">P</mi></msub><mi mathvariant=\"normal\">R</mi></mfrac><mo>.</mo><mi mathvariant=\"normal\">W</mi></math><br /><math><mo>=</mo><mfrac><mrow><mn>7</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>×</mo><mn>20</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <mo>=70</mo><mtext> </mtext><mtext>J</mtext></mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633c6223f36e35ce06", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "06", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A lead bullet strikes a target with a velocity of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>480</mn><mo>&nbsp;</mo><msup><mi>ms</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>.&nbsp;After the impact,&nbsp;the bullet falls dead and&nbsp;the&nbsp;heat produced in the process gets equally shared between the bullet and the target. If the specific heat capacity of lead is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>c</mi><mo>=</mo><mn>0</mn><mo>.03</mo><mo>&nbsp;</mo><mi>cal</mi><mo>/</mo><mi mathvariant=\"normal\">g</mi><mo>/</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>,&nbsp;then the rise in temperature of the bullet is</p>\r", "image": null}, "options": [{"id": "7Ymqm", "text": "557<math><mi>℃</mi></math>", "image": null, "isCorrect": false}, {"id": "G3fvQ", "text": "457<math><mi>℃</mi></math>", "image": null, "isCorrect": true}, {"id": "HkJ5g", "text": "857<math><mi>℃</mi></math>", "image": null, "isCorrect": false}, {"id": "CXf5q", "text": "754<math><mi>℃</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mo>∆</mo><mi>Q</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mfenced separators=\"|\"><mrow><mi>K</mi><mo>.</mo><mi>E</mi><mo>.</mo></mrow></mfenced><mo>⇒</mo><mi>m</mi><mi>c</mi><mfenced separators=\"|\"><mrow><mo>∆</mo><mi>T</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>m</mi><mi> </mi><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced></mrow><mrow><mi>J</mi></mrow></mfrac></math><br /><br /><math><mo>∆</mo><mi>T</mi><mo>=</mo><mfrac><mrow><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>4</mn><mi>J</mi><mi>c</mi></mrow></mfrac><mo>=</mo><mi>&nbsp;</mi><mfrac><mrow><mn>480</mn><mo>×</mo><mn>480</mn></mrow><mrow><mn>4</mn><mo>×</mo><mn>4.2</mn><mo>×</mo><mo>(</mo><mn>0.03</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>3</mn></mrow></msup><mo>)</mo></mrow></mfrac><mo>=</mo><mn>457</mn><mi>℃</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633bd2d07f9a53bfc6", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "14", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A cylindrical adiabatic&nbsp;container of total volume&nbsp;<math> <mrow> <mn>2</mn><msub> <mi>V</mi> <mn>0</mn> </msub> </mrow> </math> &nbsp;divided into&nbsp;two equal parts by a conducting piston which is free to move as shown in figure. Each part&nbsp;&nbsp;containing identical gas at pressure&nbsp;<math> <mrow> <msub> <mi>P</mi> <mn>0</mn> </msub> </mrow> </math>.&nbsp;Initially temperature of left and right part is&nbsp;<math> <mrow> <mn>4</mn><msub> <mi>T</mi> <mn>0</mn> </msub> </mrow> </math> &nbsp;and&nbsp;<math> <mrow> <msub> <mi>T</mi> <mn>0</mn> </msub> </mrow> </math> &nbsp;respectively. An external&nbsp;force is applied on the piston of area '<math> <mi>A</mi> </math>' to keep the&nbsp;piston at rest. The value of external force required when thermal equilibrium is reached is.</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0629611.jpg\" style=\"width: 249px; height: 130px;\" /></p>\r\r<p>&nbsp;</p>\r", "image": null}, "options": [{"id": "D3nkx", "text": "<math> <mrow>  <mfrac>   <mn>8</mn>   <mn>5</mn>  </mfrac>  <msub>   <mi>P</mi>   <mn>0</mn>  </msub>  <mi>A</mi></mrow></math>", "image": null, "isCorrect": false}, {"id": "gf8lU", "text": "<math> <mrow>  <mfrac>   <mn>2</mn>   <mn>5</mn>  </mfrac>  <msub>   <mi>P</mi>   <mn>0</mn>  </msub>  <mi>A</mi></mrow></math>", "image": null, "isCorrect": false}, {"id": "wPhWM", "text": "<math> <mrow>  <mfrac>   <mn>5</mn>   <mn>6</mn>  </mfrac>  <msub>   <mi>P</mi>   <mn>0</mn>  </msub>  <mi>A</mi></mrow></math>", "image": null, "isCorrect": false}, {"id": "24L9d", "text": "<math> <mrow>  <mfrac>   <mn>6</mn>   <mn>5</mn>  </mfrac>  <msub>   <mi>P</mi>   <mn>0</mn>  </msub>  <mi>A</mi></mrow></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>If final temp is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>P</mi><mn>0</mn></msub><msub><mi>V</mi><mn>0</mn></msub></mrow><mrow><mn>4</mn><mi>R</mi><msub><mi>T</mi><mn>0</mn></msub></mrow></mfrac><msub><mi>C</mi><mi>v</mi></msub><mfenced><mrow><mn>4</mn><msub><mi>T</mi><mn>0</mn></msub><mo>-</mo><mi mathvariant=\"normal\">T</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><msub><mi>P</mi><mn>0</mn></msub><msub><mi>V</mi><mn>0</mn></msub></mrow><mrow><mi>R</mi><msub><mi>T</mi><mn>0</mn></msub></mrow></mfrac><msub><mi>C</mi><mi>v</mi></msub><mfenced><mrow><mi>T</mi><mo>-</mo><msub><mi>T</mi><mn>0</mn></msub></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>4</mn><msub><mi>T</mi><mn>0</mn></msub><mo>-</mo><mi>T</mi></mrow><mn>4</mn></mfrac><mo>=</mo><mi>T</mi><mo>-</mo><msub><mi>T</mi><mn>0</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><msub><mi>T</mi><mn>0</mn></msub><mo>-</mo><mi>T</mi><mo>=</mo><mn>4</mn><mi>T</mi><mo>-</mo><mn>4</mn><msub><mi>T</mi><mn>0</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><msub><mi>T</mi><mn>0</mn></msub><mo>=</mo><mn>5</mn><mi>T</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mfrac><mrow><mn>8</mn><msub><mi>T</mi><mn>0</mn></msub></mrow><mn>5</mn></mfrac></math></p><p>Final pressure</p><p>In left&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mi>f</mi></msub><mo>=</mo><mfrac><msub><mi>T</mi><mi>f</mi></msub><msub><mi>T</mi><mn>0</mn></msub></mfrac><msub><mi>P</mi><mi>i</mi></msub><mo>=</mo><mfrac><mrow><mfrac><mn>8</mn><mn>5</mn></mfrac><msub><mi>T</mi><mn>0</mn></msub></mrow><mrow><mn>4</mn><msub><mi>T</mi><mn>0</mn></msub></mrow></mfrac><msub><mi>P</mi><mn>0</mn></msub><mo>=</mo><mfrac><mn>2</mn><mn>5</mn></mfrac><msub><mi>P</mi><mn>0</mn></msub></math></p><p>In right&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mi>f</mi></msub><mo>=</mo><mfrac><mrow><mfrac><mn>8</mn><mn>5</mn></mfrac><msub><mi>T</mi><mn>0</mn></msub></mrow><msub><mi>T</mi><mn>0</mn></msub></mfrac><msub><mi>P</mi><mn>0</mn></msub><mo>=</mo><mfrac><mn>8</mn><mn>5</mn></mfrac><msub><mi>P</mi><mn>0</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mi>o</mi><mi>r</mi><mi>c</mi><mi>e</mi><mo>=</mo><mfenced><mrow><mfrac><mrow><mn>8</mn><msub><mi>P</mi><mn>0</mn></msub></mrow><mn>5</mn></mfrac><mo>-</mo><mfrac><mrow><mn>2</mn><msub><mi>P</mi><mn>0</mn></msub></mrow><mn>5</mn></mfrac></mrow></mfenced><mi>A</mi><mo>=</mo><mfrac><mrow><mn>6</mn><msub><mi>P</mi><mn>0</mn></msub><mi>A</mi></mrow><mn>5</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86336d39067d0283673", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "26", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Earth receives <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1400</mn><mo>&#160;</mo><mi mathvariant=\"normal\">W</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math> of solar power. If all&nbsp;the solar energy falling on a lens of area <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>2</mn><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math> is focussed on to a block of ice of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>280</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi></math>, then what is the time (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>min</mi></math>) taken by the ice to melt completely? [<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">L</mi><mi>fusion</mi></msub><mo>=</mo><mn>3</mn><mo>.</mo><mn>3</mn><mi mathvariant=\"normal\">x</mi><mn>105</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi>kg</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>]", "image": null}, "options": [], "correctValue": "5.5", "solution": {"text": "Heat required to melt the block<br /><br />= (0.28kg) (3.3 x 10<sup>5</sup> J/kg)= 9. 24 x 10<sup>4</sup>J<br /><br />Heat received per second = (1400J/ m<sup>2</sup> ) (0. 2m<sup>2</sup> ) = 280 J<br /><br />Time taken (in minutes) =<math><mrow><mfrac linethickness=\"1\"><mrow><mn>9.24</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mn>4</mn></msup></mrow><mrow><mn>280</mn><mo>×</mo><mn>60</mn></mrow></mfrac></mrow></math>&nbsp; = 5. 5<br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863357947b384b434d4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "78", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An ideal gas expands isothermally from a volume <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>1</mn></msub></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>2</mn></msub></math> and then compressed to original volume <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>1</mn></msub></math> adiabatically. The initial pressure is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub></math> and final pressure is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>3</mn></msub></math>. The total work done is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi></math>. Then:", "image": null}, "options": [{"id": "ql7fT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>3</mn></msub><mo>&#62;</mo><msub><mi>P</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><mi>W</mi><mo>&#62;</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "UcOb1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>3</mn></msub><mo>&#60;</mo><msub><mi>P</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><mi>W</mi><mo>&#60;</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "5W2YW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>3</mn></msub><mo>&#62;</mo><msub><mi>P</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><mi>W</mi><mo>&#60;</mo><mn>0</mn></math>", "image": null, "isCorrect": true}, {"id": "CnKqo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>3</mn></msub><mo>=</mo><msub><mi>P</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><mi>W</mi><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From the graph it is clear that <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>3</mn></msub><mo>&#62;</mo><msub><mi>P</mi><mn>1</mn></msub></math> .<br />Since the area under adiabatic process <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">E</mi><mi mathvariant=\"normal\">D</mi></mrow></mfenced></math> is greater than that of the isothermal process <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">D</mi></mrow></mfenced></math> . Therefore net word done<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><msub><mi>W</mi><mi mathvariant=\"normal\">i</mi></msub><mo>+</mo><mfenced separators=\"|\"><mrow><mo>-</mo><msub><mi>W</mi><mi>A</mi></msub></mrow></mfenced></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8757;</mo><mo>&#160;</mo><msub><mi>W</mi><mi mathvariant=\"normal\">A</mi></msub><mo>&#62;</mo><msub><mi>W</mi><mi mathvariant=\"normal\">i</mi></msub><mo>&#8658;</mo><mi>W</mi><mo>&#60;</mo><mn>0</mn></math><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/bf8690b9-59e2-48b0-8772-05ff4a5040a6.png\" style=\"max-width:100%; object-fit:contain\" style=\"width:2.07774in;height:1.70755in\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863320e2cec01584d71", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "93", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two identical systems, with heat capacity at a constant volume that varies as <math><msub><mrow><mi>C</mi></mrow><mrow><mi>v</mi></mrow></msub><mo>=</mo><mi>b</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>3</mn></mrow></msup></math> (where <math><mi>b</mi></math> is a constant) are thermally isolated. Initially, one system is at a temperature <math><mn>100</mn><mi>&#160;</mi><mi>K</mi></math> and the other is at <math><mn>200</mn><mi>K</mi></math> . The systems are then brought to thermal contact and the combined system is allowed to reach thermal equilibrium.&nbsp;If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><msub><mi>T</mi><mn>0</mn></msub><mn>4</mn></msup><mo>=</mo><mi>n</mi><mo>&#215;</mo><msup><mn>10</mn><mn>8</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math>&nbsp;then what will be the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>0</mn></msub></math>&nbsp;is the final temperature in kelvin?", "image": null}, "options": [], "correctValue": "8.5", "solution": {"text": "<p>Energy given by a system = Energy taken by another system<br /><br /><math><mi>d</mi><msub><mrow><mi>Q</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mi>d</mi><msub><mrow><mi>Q</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br /><math><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mrow><munderover><mo stretchy=\"false\">&#8747;</mo><mrow><mn>100</mn></mrow><mrow><mi>T</mi></mrow></munderover><mrow><mi>m</mi><msub><mrow><mi>c</mi></mrow><mrow><mi>v</mi></mrow></msub><mi>d</mi><mi>T</mi><mo>=</mo><mo>-</mo><mrow><munderover><mo stretchy=\"false\">&#8747;</mo><mrow><mn>200</mn></mrow><mrow><mi>T</mi></mrow></munderover><mrow><mi>m</mi><msub><mrow><mi>c</mi></mrow><mrow><mi>v</mi></mrow></msub><mi>d</mi><mi>T</mi></mrow></mrow></mrow></mrow></math><br /><br /><math><mo>&#8658;</mo><mi>&#160;</mi><mrow><munderover><mo stretchy=\"false\">&#8747;</mo><mrow><mn>100</mn></mrow><mrow><mi>T</mi></mrow></munderover><mrow><mi>b</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>3</mn></mrow></msup><mi>d</mi><mi>T</mi><mo>=</mo><mo>-</mo></mrow></mrow><mrow><munderover><mo stretchy=\"false\">&#8747;</mo><mrow><mn>200</mn></mrow><mrow><mi>T</mi></mrow></munderover><mrow><mi>b</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>3</mn></mrow></msup><mi>d</mi><mi>T</mi><mo>&#8658;</mo><msubsup><mrow><mfenced separators=\"|\"><mrow><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup></mrow></mfenced></mrow><mrow><mn>10</mn></mrow><mrow><mi>T</mi></mrow></msubsup><mo>=</mo><mo>-</mo><msubsup><mrow><mfenced separators=\"|\"><mrow><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup></mrow></mfenced></mrow><mrow><mn>200</mn></mrow><mrow><mi>T</mi></mrow></msubsup></mrow></mrow></math><br /><br /><math><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup><mo>-</mo><msup><mrow><mn>100</mn></mrow><mrow><mn>4</mn></mrow></msup><mo>=</mo><mo>-</mo><mfenced separators=\"|\"><mrow><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup><mo>-</mo><msup><mrow><mn>200</mn></mrow><mrow><mn>4</mn></mrow></msup></mrow></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mn>2</mn><msup><mi>T</mi><mn>4</mn></msup><mo>=</mo><mn>17</mn><mo>&#215;</mo><msup><mn>10</mn><mn>8</mn></msup><mo>&#8658;</mo><mi>T</mi><mo>=</mo><mn>171</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><msup><mi>T</mi><mn>4</mn></msup><mo>=</mo><mn>8</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mn>8</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86331390745b59e83af", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "52", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A gas mixture consists of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math> moles of oxygen and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math> moles of argon at temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math>. Neglecting all vibrational modes we calculated the total internal energy of the system to be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mi>R</mi><mi>T</mi></math>. What is the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>?", "image": null}, "options": [], "correctValue": "11", "solution": {"text": "<p>The internal energy of n moles of a gas is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>U</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mtext mathvariant=\"italic\">nFRT</mtext></math><br />where F = number of degrees of freedom.<br />The internal energy of 2 moles of oxygen at temperature T is<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">U</mtext><mn>1</mn></msub><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mn>2</mn><mo>&#215;</mo><mn>5</mn><mtext mathvariant=\"italic\">RT</mtext><mo>=</mo><mn>5</mn><mtext mathvariant=\"italic\">RT</mtext></math>&nbsp;&nbsp;&nbsp;&nbsp;(F = 5 for oxygen molecule)<br /><br />The total internal energy of 4 moles of argon at temperature T is<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>U</mi><mn>2</mn></msub><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mn>4</mn><mo>&#215;</mo><mn>3</mn><mtext mathvariant=\"italic\">RT</mtext><mo>=</mo><mn>6</mn><mtext mathvariant=\"italic\">RT</mtext></math> (F = 3 for argon molecule)<br /><br />Total internal energy <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msub><mi>U</mi><mn>1</mn></msub><mo>+</mo><msub><mi>U</mi><mn>2</mn></msub><mo>=</mo><mn>1</mn><mn>1</mn><mtext mathvariant=\"italic\">RT</mtext></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mn>11</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632f2a82c0b2cf2ddc", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "103", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A cooking vessel on a slow burner contains 5 kg of water and an unknown mass of ice in equilibrium at 0<sup>o</sup>C at time t = 0. The temperature of the mixture is measured at various times and the result is plotted as shown in diagram. During the first 50 min the mixture remains at 0<sup>o</sup>C. From 50 min to 60 min, the temperature increases to 2<sup>o</sup>C. Neglecting the heat capacity of the heat capacity of the vessel, the initial mass of the ice is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029871_Question.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 216px; height: 182px;\" />", "image": null}, "options": [{"id": "pAbbc", "text": "<math> <mrow> <mfrac> <mrow> <mn>1</mn> <mn>0</mn> </mrow> <mrow> <mn>7</mn> </mrow> </mfrac> <mtext>kg</mtext> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "NUp2V", "text": "<math> <mrow> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>7</mn> </mrow> </mfrac> <mtext>kg</mtext> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "Z6Qlv", "text": "<math> <mrow> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> <mtext>kg</mtext> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "9Y4jW", "text": "<math> <mrow> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>8</mn> </mrow> </mfrac> <mtext>kg</mtext> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let m be the mass of ice.<br />Rate of heat given by the burner is constant.<br />In the first 50 min<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <mtext>dQ</mtext> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>mL</mtext> </mrow> <mrow> <msub> <mtext>t</mtext> <mn>1</mn> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>m kg</mtext> <mo>&times;</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>8</mn> <mn>0</mn> <mo>&times;</mo> <mtext>4.2</mtext> <mo>&times;</mo> <mn>1</mn> <msup> <mn>0</mn> <mn>3</mn> </msup> </mrow> </mfenced> <mtext>J/kg</mtext> </mrow> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>5</mn> <mn>0</mn> <mo>&nbsp;min</mo> </mrow> </mfenced> </mrow> </mfrac> </mrow> </math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(i)<br /><br />From 50 min to 60 min<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <mtext>dQ</mtext> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>m</mtext> <mo>+</mo> <mn>5</mn> </mrow> </mfenced> <msub> <mtext>S</mtext> <mrow> <msub> <mtext>H</mtext> <mn>2</mn> </msub> <mtext>O</mtext> </mrow> </msub> <mo>&Delta;</mo> <mi>&theta;</mi> </mrow> <mrow> <msub> <mtext>t</mtext> <mn>2</mn> </msub> </mrow> </mfrac> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>m</mtext> <mo>+</mo> <mn>5</mn> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>4.2</mtext> <mo>&times;</mo> <mn>1</mn> <msup> <mn>0</mn> <mn>3</mn> </msup> </mrow> </mfenced> <mtext>J/kg</mtext> <mo>&times;</mo> <msup> <mn>2</mn> <mo>∘</mo> </msup> <mtext>C</mtext> </mrow> <mrow> <mn>1</mn> <mo>&nbsp;min</mo> </mrow> </mfrac> </mrow> </math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(ii)<br /><br />From Eqs. (i) and (ii)<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <mn>8</mn> <mn>0</mn> <mtext>m</mtext> </mrow> <mrow> <mn>5</mn> <mn>0</mn> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>m</mtext> <mo>+</mo> <mn>5</mn> </mrow> </mfenced> </mrow> <mrow> <mn>1</mn> <mn>0</mn> </mrow> </mfrac> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mn>7</mn> <mtext>m</mtext> <mo>=</mo> <mn>5</mn> <mo>&rArr;</mo> <mtext>m</mtext> <mo>=</mo> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>7</mn> </mrow> </mfrac> <mtext>kg</mtext> <mo>≃</mo> <mtext>0.7</mtext> <mo>kg</mo> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632cedf0dd32b8401d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "26", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An ideal gas is taken through the cycle&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>A</mtext><mo>→</mo><mtext>B</mtext><mo>→</mo><mtext>C</mtext><mo>→</mo><mi mathvariant=\"normal\">A</mi></math>, as shown in the figure. If the net heat supplied to the gas in the cycle is <math> <mrow> <mn>5</mn><mtext> </mtext><mtext>J</mtext></mrow></math>, the work done by the gas in the process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>C</mtext><mo>→</mo><mtext>A</mtext></math>&nbsp;&nbsp;is<br />\r<span style=\"line-height: 1.6em;\">&nbsp; &nbsp;</span><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0006066_Ques1_1.jpg\" style=\"line-height: 1.6em; width: 287px; height: 228px;\" />", "image": null}, "options": [{"id": "bQa6L", "text": "<math> <mrow> <mo>−</mo><mn>5</mn><mtext>&nbsp;J</mtext></mrow> </math>", "image": null, "isCorrect": true}, {"id": "MBzd6", "text": "<math> <mrow>  <mo>&#x2212;</mo><mn>10</mn><mtext>&#x00A0;J</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "JAWkf", "text": "<math> <mrow>  <mo>&#x2212;</mo><mn>15</mn><mtext>&#x00A0;J</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "eI7uz", "text": "<math> <mrow>  <mo>&#x2212;</mo><mn>20</mn><mtext>&#x00A0;J</mtext></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <mo>&#916;</mo> <msub> <mtext>W</mtext> <mtext>AB</mtext> </msub> <mo>=</mo> <mn>p</mn> <mo>&#916;</mo> <mn>V</mn> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>1</mn> <mn>0</mn> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>2</mn> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> <mo>=</mo> <mtext>10 J</mtext> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#916;</mo><msub><mtext>W</mtext><mtext>BC</mtext></msub><mo>=</mo><mn>0</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mfenced><mtext>as V = constant</mtext></mfenced></math><br /><br />From first law of thermodynamics,<br /><br /><math>&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160; <mrow> <mo>&#916;</mo> <mtext>Q</mtext> <mo>=</mo> <mo>&#916;</mo> <mn>W</mn> <mo>+</mo> <mo>&#916;</mo> <mn>U</mn> </mrow> </math><br /><br /><math> <mrow> <mo>&#916;</mo> <mtext>U</mtext> <mo>=</mo> <mn>0 &#160; &#160; &#160; &#160;</mn> </mrow> </math>&nbsp;<br /><br />Process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ABCA</mi></math> is cyclic,<br /><br /><math> <mrow> <mo>&#8756;</mo>&#160; <mo>&#916;</mo> <mtext>Q</mtext> <mo>=</mo> <mo>&#916;</mo> <msub> <mn>W</mn> <mn>AB</mn> </msub> <mo>+</mo> <mo>&#916;</mo> <msub> <mn>W</mn> <mn>BC</mn> </msub> <mo>+</mo> <mo>&#916;</mo> <msub> <mn>W</mn> <mn>CA</mn> </msub> </mrow> </math><br /><br /><math> <mrow> <mo>&#8756;</mo>&#160; <mo>&#916;</mo> <msub> <mn>W</mn> <mn>CA</mn> </msub> <mo>=</mo> <mo>&#916;</mo> <mtext>Q</mtext> <mo>-</mo> <mo>&#916;</mo> <msub> <mn>W</mn> <mn>AB</mn> </msub> <mo>-</mo> <mo>&#916;</mo> <mn>W</mn> <mn>BC</mn> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math><mrow> <mo>=</mo> <mn>5</mn> <mo>-</mo> <mn>1</mn> <mn>0</mn> <mo>-</mo> <mn>0</mn> <mo>=</mo> <mo>-</mo> <mtext>5 J</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632c581790ff6f6b36", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "52", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "One mole of a monoatomic ideal gas undergoes the process <math><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>⟶</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">B</mi></math>, as in the given <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>-</mo><mi>V</mi></math> diagram. The specific heat for this process is<br />\r<br />\r<br />\r<img alt=\"\" height=\"156\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image1-67d0f115-9220-4087-92cb-02cd662289cb.jpg\" width=\"226\" />", "image": null}, "options": [{"id": "9VqNQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><mi>R</mi></mrow><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "SjpVD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>15</mn><mi>R</mi></mrow><mn>7</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "8UdNM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>30</mn><mi>R</mi></mrow><mn>7</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "tOHvD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>20</mn><mi>R</mi></mrow><mn>7</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>Q</mi><mo>=</mo><mi>&#916;</mi><mi>U</mi><mo>+</mo><mi>W</mi></math> (From <math><msup><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">t</mi></mrow></msup></math> law)<br /><br />Here, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>U</mi><mo>=</mo><mi>n</mi><msub><mi>C</mi><mi>V</mi></msub><mi>&#916;</mi><mi>T</mi></math><br /><br />Temperature at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mi mathvariant=\"normal\">A</mi></msub><mo>=</mo><mfrac><mrow><mn>2</mn><msub><mi>P</mi><mn>0</mn></msub><msub><mi>V</mi><mn>0</mn></msub></mrow><mi>R</mi></mfrac></math><br /><br />At <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mi mathvariant=\"normal\">B</mi></msub><mo>=</mo><mfrac><mrow><mn>16</mn><msub><mi>P</mi><mn>0</mn></msub><msub><mi>V</mi><mn>0</mn></msub></mrow><mi>R</mi></mfrac></math><br /><br />So, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>U</mi><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>R</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mfrac><mrow><mn>14</mn><msub><mi>P</mi><mn>0</mn></msub><msub><mi>V</mi><mn>0</mn></msub></mrow><mi>R</mi></mfrac></mfenced><mo>=</mo><mn>21</mn><msub><mi>P</mi><mn>0</mn></msub><msub><mi>V</mi><mn>0</mn></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>2</mn><msub><mi>P</mi><mn>0</mn></msub></mrow></mfenced><mfenced separators=\"|\"><mrow><mn>3</mn><msub><mi>V</mi><mn>0</mn></msub></mrow></mfenced><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced separators=\"|\"><mrow><mn>3</mn><msub><mi>V</mi><mn>0</mn></msub></mrow></mfenced><mfenced separators=\"|\"><mrow><mn>2</mn><msub><mi>P</mi><mn>0</mn></msub></mrow></mfenced></math>&nbsp; &nbsp;[Area under <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>-</mo><mi>V</mi></math> diagram]<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>9</mn><msub><mi>P</mi><mn>0</mn></msub><msub><mi>V</mi><mn>0</mn></msub></math><br /><br />So, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>Q</mi><mo>=</mo><mn>21</mn><msub><mi>P</mi><mn>0</mn></msub><msub><mi>V</mi><mn>0</mn></msub><mo>+</mo><mn>9</mn><msub><mi>P</mi><mn>0</mn></msub><msub><mi>V</mi><mn>0</mn></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>30</mn><msub><mi>P</mi><mn>0</mn></msub><msub><mi>V</mi><mn>0</mn></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>Q</mi><mo>=</mo><mi>n</mi><mi>C</mi><mi>&#916;</mi><mi>T</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>=</mo><mfrac><mrow><mi>&#916;</mi><mi>Q</mi></mrow><mrow><mi>n</mi><mi>&#916;</mi><mi>T</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>30</mn><msub><mi>P</mi><mn>0</mn></msub><msub><mi>V</mi><mn>0</mn></msub></mrow><mfrac><mrow><mn>14</mn><msub><mi>P</mi><mn>0</mn></msub><msub><mi>V</mi><mn>0</mn></msub></mrow><mi>R</mi></mfrac></mfrac><mo>=</mo><mfrac><mn>15</mn><mn>7</mn></mfrac><mi>R</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632b6e8c3eab79edf9", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "96", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "One mole of an ideal gas is taken along the process in which <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mi>V</mi><mi>x</mi></msup></math> = constant. The graph shown represents the variation of molar heat capacity of such a gas with respect to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>. The values of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>c</mi><mo>'</mo></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>'</mo></math>. respectively, are given by<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Question_No._66.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 250px; height: 150px;\" />", "image": null}, "options": [{"id": "8BTwd", "text": "<math> <mrow> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> <mtext>,&nbsp;</mtext> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "CtFPj", "text": "<math> <mrow> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> <mtext>,&nbsp;</mtext> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "508jT", "text": "<math> <mrow> <mfrac> <mrow> <mn>7</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> <mtext>,&nbsp;</mtext> <mfrac> <mrow> <mn>7</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "N8QwS", "text": "<math> <mrow> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> <mtext>,&nbsp;</mtext> <mfrac> <mrow> <mn>7</mn> </mrow> <mrow> <mn>5</mn> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For <math> <mrow>  <mi>P</mi><msup>   <mi>V</mi>   <mi>x</mi>  </msup>  <mo>=</mo><mtext>constant</mtext></mrow></math> <br/><br/><math> <mrow>  <mi>C</mi><mo>=</mo><msub>   <mi>C</mi>   <mi>V</mi>  </msub>  <mo>+</mo><mfrac>   <mi>R</mi>   <mrow>    <mo>&#x2212;</mo><mi>x</mi><mo>+</mo><mn>1</mn></mrow>  </mfrac>  </mrow></math><br/><br/>At&nbsp;<math> <mrow> <mtext>x</mtext> <mo>=</mo> <mo>∞</mo> <mtext>,&nbsp;&nbsp;</mtext> <mtext>C</mtext> <mo>=</mo> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </math><br /><br />from <math> <mrow> <msup> <mtext>PV</mtext> <mtext>x</mtext> </msup> <mo>=</mo> <mtext>constnat</mtext> </mrow> </math><br /><br /><math> <mrow> <mo>⇒&nbsp;&nbsp;&nbsp;</mo> <msup> <mtext>P</mtext> <mrow> <mn>1</mn> <mo>/</mo> <mtext>x</mtext> </mrow> </msup> <mtext>V</mtext> <mo>=</mo> <mtext>another constant</mtext> </mrow> </math><br /><br />so at <math> <mrow> <mtext>x</mtext> <mo>=</mo> <mo>∞</mo> <mtext>,&nbsp;&nbsp;</mtext> <msub> <mtext>C</mtext> <mtext>v</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </math><br /><br />hence <math> <mrow> <mtext>C</mtext> <mo>=</mo> <msub> <mtext>C</mtext> <mtext>v</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </math><br /><br />and then <math> <mrow> <msub> <mtext>C</mtext> <mtext>p</mtext> </msub> <mo>=</mo> <msub> <mtext>C</mtext> <mtext>v</mtext> </msub> <mo>+</mo> <mtext>R</mtext> <mo>=</mo> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </math><br /><br />at x = 0, P = constant and C = C'<br /><br />hence <math> <mrow> <msup> <mtext>C</mtext> <mo>′</mo> </msup> <mo>=</mo> <msub> <mtext>C</mtext> <mtext>p</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </math><br /><br />at x = x', C = 0, so the process is adiabatic, hence<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msup> <mtext>x</mtext> <mo>′</mo> </msup> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>C</mtext> <mtext>p</mtext> </msub> </mrow> <mrow> <msub> <mtext>C</mtext> <mtext>v</mtext> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631e2da1df58d9ffef", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "91", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Diagram shows the variation in the internal energy U with the volume V of 2.0 moles of an ideal gas in cyclic process abcda. The temperatures of the gas at b and c are 500 K and 300 K, respectively. Calculate the heat absorbed by the gas during the process.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0030796_Question.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 200px; height: 181px;\" />", "image": null}, "options": [{"id": "Fo5ub", "text": "400 R ln 2", "image": null, "isCorrect": true}, {"id": "SjaEV", "text": "500 R ln 2", "image": null, "isCorrect": false}, {"id": "0OD8N", "text": "700 R ln 2", "image": null, "isCorrect": false}, {"id": "wO4f9", "text": "800 R ln 2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In the process a to b and c to d<br /><br />as <math> <mrow> <mo>&#916;</mo> <mtext>U</mtext> <mo>=</mo> <mn>0</mn> </mrow> </math>, therefore <math> <mrow> <mo>&#916;</mo> <mtext>T</mtext> <mo>=</mo> <mn>0</mn> </mrow> </math>&nbsp;or T = constant<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext>W</mtext> <mo>=</mo> <munderover> <mo>&#8747;</mo> <msub> <mtext>V</mtext> <mtext>i</mtext> </msub> <msub> <mtext>V</mtext> <mrow> <mi>f</mi><mo>&#8289;</mo> </mrow> </msub> </munderover> <mtext>PdV</mtext> </mrow> </math><br /><br />We have,<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext>PV</mtext> <mo>=</mo> <mtext>nRT</mtext> <mo>&#8658;</mo> <mtext>P</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>nRT</mtext> </mrow> <mrow> <mtext>V</mtext> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>&#8756;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</mo> <mtext>W</mtext> <mo>=</mo> <munderover> <mo>&#8747;</mo> <msub> <mtext>V</mtext> <mtext>i</mtext> </msub> <msub> <mtext>V</mtext> <mrow> <mi>f</mi><mo>&#8289;</mo> </mrow> </msub> </munderover> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>nRT</mtext> </mrow> </mfenced> <mfrac> <mrow> <mtext>RV</mtext> </mrow> <mrow> <mtext>V</mtext> </mrow> </mfrac> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mtext>nRT</mtext> <msubsup> <mrow> <mfenced close=\"|\" open=\"|\" separators=\",\"> <mrow> <mtext>ln V</mtext> </mrow> </mfenced> </mrow> <msub> <mtext>V</mtext> <mtext>i</mtext> </msub> <msub> <mtext>V</mtext> <mrow> <mi>f</mi><mo>&#8289;</mo> </mrow> </msub> </msubsup> <mo>=</mo> <mtext>nRT</mtext> <mo>ln</mo> <mfrac> <mrow> <msub> <mtext>V</mtext> <mrow> <mi>f</mi><mo>&#8289;</mo> </mrow> </msub> </mrow> <mrow> <msub> <mtext>V</mtext> <mtext>i</mtext> </msub> </mrow> </mfrac> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mtext>W</mtext> <mtext>ab</mtext> </msub> <mo>=</mo> <msub> <mtext>nRT</mtext> <mtext>b</mtext> </msub> <mo>ln</mo> <mfrac> <mrow> <mn>2</mn> <msub> <mtext>V</mtext> <mn>0</mn> </msub> </mrow> <mrow> <msub> <mtext>V</mtext> <mn>0</mn> </msub> </mrow> </mfrac> <mo>=</mo> <mn>2</mn> <mtext>R</mtext> <mo>&#215;</mo> <mn>5</mn> <mn>0</mn> <mn>0</mn> <mo>ln</mo> <mn>2</mn> <mo>=</mo> <mn>1</mn> <mn>0</mn> <mn>0</mn> <mn>0</mn> <mo>R ln 2</mo> </mrow> </math><br /><br />and&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mtext>W</mtext> <mtext>cd</mtext> </msub> <mo>=</mo> <msub> <mtext>nRT</mtext> <mtext>c</mtext> </msub> <mo>ln</mo> <mfrac> <mrow> <msub> <mtext>V</mtext> <mn>0</mn> </msub> </mrow> <mrow> <mn>2</mn> <msub> <mtext>V</mtext> <mn>0</mn> </msub> </mrow> </mfrac> <mo>=</mo> <mn>2</mn> <mtext>R</mtext> <mo>&#215;</mo> <mn>3</mn> <mn>0</mn> <mn>0</mn> <mo>ln</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>=</mo> <mo>-</mo> <mn>6</mn> <mn>0</mn> <mn>0</mn> <mo>R ln 2</mo> </mrow> </math><br /><br />There is no volume change from b to c and from d to a, so<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mtext>W</mtext> <mtext>bc</mtext> </msub> <mo>=</mo> <msub> <mtext>W</mtext> <mtext>da</mtext> </msub> <mo>=</mo> <mn>0</mn> </mrow> </math><br /><br />The work done in the complete cycle<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext>W</mtext> <mo>=</mo> <msub> <mtext>W</mtext> <mtext>ab</mtext> </msub> <mo>+</mo> <msub> <mtext>W</mtext> <mtext>bc</mtext> </msub> <mo>+</mo> <msub> <mtext>W</mtext> <mtext>cd</mtext> </msub> <mo>+</mo> <msub> <mtext>W</mtext> <mtext>da</mtext> </msub> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>10</mn><mn>0</mn><mn>0</mn><mo>R ln 2</mo><mo>+</mo><mn>0</mn><mo>-</mo><mn>6</mn><mn>0</mn><mn>0</mn><mo>R ln 2</mo><mo>+</mo><mn>0</mn></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mn>4</mn> <mn>0</mn> <mn>0</mn> <mo>R ln 2</mo> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863183eb1bd1794c524", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "45", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An earthen pitcher loses&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">g</mi></math> of water per minute due to evaporation. If the water equivalent of pitcher is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi>kg</mi></math>&nbsp;and the pitcher contains <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi>kg</mi></math>&nbsp;of water, calculate the time required for the water in the pitcher to cool to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>28</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>&nbsp;from its original temperature of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>.&nbsp;Neglect radiation effects. Latent heat of vapourization of water in this range of temperature is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>580</mn><mo>&nbsp;</mo><mi>cal</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">g</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>&nbsp;and specific heat of water is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi>kcal</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">g</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&nbsp;</mo><mo>°</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>.", "image": null}, "options": [{"id": "Ihcl6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>38</mn><mo>.</mo><mn>6</mn><mo>&#160;</mo><mi>min</mi></math>", "image": null, "isCorrect": false}, {"id": "Y9Te7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi>min</mi></math>", "image": null, "isCorrect": false}, {"id": "xLAie", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>34</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi>min</mi></math>", "image": null, "isCorrect": true}, {"id": "N5vz3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>41</mn><mo>.</mo><mn>2</mn><mo>&nbsp;</mo><mi>min</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As water equivalent of pitcher is 0.5 kg, i..e., pitcher is equivalent to 0.5 kg of water, heat to be extracted from the system of water and pitcher for decreasing its temperature from 30 to 28<sup>o</sup>C is<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mtext>Q</mtext> <mn>1</mn> </msub> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>m</mtext> <mo>+</mo> <mtext>M</mtext> </mrow> </mfenced> <mtext>c</mtext> <mo>Δ</mo> <mtext>T</mtext> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp; &nbsp;<math> <mrow> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>9.5</mtext> <mo>+</mo> <mtext>0.5</mtext> </mrow> </mfenced> <mtext>kg&nbsp;</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>1</mn> <mo>k cal/kg</mo> <msup> <mtext>C</mtext> <mo>∘</mo> </msup> </mrow> </mfenced> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>3</mn> <mn>0</mn> <mo>-</mo> <mn>2</mn> <mn>8</mn> </mrow> </mfenced> </mrow> <mo>∘</mo> </msup> <mtext>C</mtext> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp; &nbsp;<math> <mrow> <mo>=</mo> <mn>2</mn> <mn>0</mn> <mo>kcal</mo> </mrow> </math><br /><br />And heat extracted from the pitcher through evaporation in t minutes<br /><br /><math> <mrow> <msub> <mtext>Q</mtext> <mn>2</mn> </msub> <mo>=</mo> <mtext>mL</mtext> <mo>=</mo> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>dm</mtext> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> <mo>×</mo> <mtext>t</mtext> </mrow> </mfenced> <mtext>L</mtext> <mo>=</mo> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>1</mn> <mtext>g</mtext> </mrow> <mrow> <mtext>min</mtext> </mrow> </mfrac> <mo>×</mo> <mtext>t</mtext> </mrow> </mfenced> <mn>5</mn> <mn>8</mn> <mn>0</mn> <mfrac> <mrow> <mtext>cal</mtext> </mrow> <mrow> <mtext>g</mtext> </mrow> </mfrac> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mn>5</mn> <mn>8</mn> <mn>0</mn> <mo>×</mo> <mtext>t cal</mtext> </mrow> </math><br /><br />According to given problem <math> <mrow> <msub> <mtext>Q</mtext> <mn>2</mn> </msub> <mo>=</mo> <msub> <mtext>Q</mtext> <mn>1</mn> </msub> </mrow> </math>, &nbsp;i.e., <math> <mrow> <mn>5</mn> <mn>8</mn> <mn>0</mn> <mo>×</mo> <mtext>t</mtext> <mo>=</mo> <mn>2</mn> <mn>0</mn> <mo>×</mo> <mn>1</mn> <msup> <mn>0</mn> <mn>3</mn> </msup> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; t = 34.5 min", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631125a71deac30f53", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "46", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Diagram shows the variation of internal energy <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>U</mi><mo>)</mo></math>&nbsp;with the pressure <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>P</mi><mo>)</mo></math>&nbsp;of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>0</mn><mo>&nbsp;</mo><mi>mole</mi></math>&nbsp;gas in cyclic process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>abcda</mi></math>. The temperature of gas at <math xmlns=\"http:/ s=\",\"> <mrow> <mtext>P</mtext> <mo>-</mo> <mtext>constant</mtext> </mrow> </mfenced> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mtext>W</mtext> <mrow> <mtext>a</mtext> <mo>&#160;&#8594;&#160;</mo> <mtext>b</mtext> </mrow> </msub> <mo>=</mo> <mtext>P</mtext> <mo>&#916;</mo> <mtext>V</mtext> <mo>=</mo> <mtext>n</mtext> <mtext>R</mtext> <mo>&#916;</mo> <mtext>T</mtext> <mo>=</mo> <mo>-</mo> <mn>4</mn> <mn>0</mn> <mn>0</mn> <mtext>&#160;R</mtext> </mrow> </math><br /><br />For process <math> <mrow> <mtext>b</mtext> <mo>&#160;&#8594;&#160;</mo> <mtext>c</mtext> <mtext>,&#160;&#160;</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>T</mtext> <mo>-</mo> <mtext>constant</mtext> </mrow> </mfenced> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext>W</mtext><mrow><mtext>b</mtext><mo>&#160;&#8594;&#160;</mo><mtext>c</mtext></mrow></msub><mo>=</mo><mi>nRTln</mi><mfenced><mfrac><msub><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">i</mi></msub><msub><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">f</mi></msub></mfrac></mfenced><mo>=</mo><mo>-</mo><mn>2</mn><mtext>R</mtext><mfenced><mn>300</mn></mfenced><mtext>ln</mtext><mo>&#160;</mo><mn>2</mn></math><br /><br />For process <math> <mrow> <mtext>c</mtext> <mo>&#160;&#8594;&#160;</mo> <mtext>d</mtext> <mtext>,&#160;&#160;</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>P</mtext> <mo>-</mo> <mtext>constant</mtext> </mrow> </mfenced> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext>W</mtext><mrow><mtext>c</mtext><mo>&#160;&#8594;&#160;</mo><mtext>d</mtext></mrow></msub><mo>=</mo><mtext>P</mtext><mo>&#916;</mo><mtext>V</mtext><mo>=</mo><mtext>nR</mtext><mo>&#916;</mo><mtext>T=</mtext><mo>+</mo><mn>4</mn><mn>0</mn><mn>0</mn><mtext>R</mtext></math><br /><br />For process <math> <mrow> <mtext>d</mtext> <mo>&#160;&#8594;&#160;</mo> <mtext>a</mtext> <mtext>,&#160;&#160;</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>T</mtext> <mo>-</mo> <mtext>constant</mtext> </mrow> </mfenced> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext>W</mtext><mrow><mtext>d</mtext><mo>&#160;&#8594;&#160;</mo><mtext>a</mtext></mrow></msub><mo>=</mo><mi>nRTln</mi><mfenced><mfrac><msub><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">i</mi></msub><msub><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">f</mi></msub></mfrac></mfenced><mo>=</mo><mo>+</mo><mn>2</mn><mtext>R</mtext><mfenced><mrow><mn>5</mn><mn>0</mn><mn>0</mn></mrow></mfenced><mtext>ln</mtext><mn>&#160;2</mn></math><br /><br />Net work,<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mo>&#916;</mo> <mtext>W</mtext> </mrow> </mfenced> <mo>=</mo> <msub> <mtext>W</mtext> <mrow> <mtext>a</mtext> <mo>&#160;&#8594;&#160;</mo> <mtext>b</mtext> </mrow> </msub> <mo>+</mo> <msub> <mtext>W</mtext> <mrow> <mtext>b</mtext> <mo>+</mo> <mtext>c</mtext> </mrow> </msub> <mo>+</mo> <msub> <mtext>W</mtext> <mrow> <mtext>c</mtext> <mo>&#160;&#8594;&#160;</mo> <mtext>d</mtext> </mrow> </msub> <mo>+</mo> <msub> <mtext>W</mtext> <mrow> <mtext>d</mtext> <mo>&#160;&#8594;&#160;</mo> <mtext>a</mtext> </mrow> </msub> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>&#916;</mo> <mtext>W</mtext> <mo>=</mo> <mn>4</mn> <mn>0</mn> <mn>0</mn> <mtext>&#160;R ln 2</mtext> </mrow> </math><br /><br /><math> <mrow> <mtext>dQ</mtext> <mo>=</mo> <mtext>dU</mtext> <mo>+</mo> <mtext>dW</mtext> </mrow> </math>, first law of thermodynamics<br /><br />&nbsp;<math> <mrow> <mtext>dQ</mtext> <mo>=</mo> <mn>4</mn> <mn>0</mn> <mn>0</mn> <mtext>&#160;R ln 2</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630ddaf922452610f7", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "64", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi></math> moles of an ideal diatomic gas is enclosed in a cylinder at temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math>. suppose on supplying heat to the gas, its temperature remains constant but <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math> moles get dissociated into atoms. Heat supplied to the gas is", "image": null}, "options": [{"id": "Qd6Gk", "text": "<math> <mrow> <mtext>Zero</mtext> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "GmQH4", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>n</mi><mi>R</mi><mi>T</mi></math>", "image": null, "isCorrect": true}, {"id": "ts8lm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>n</mi><mi>R</mi><mi>T</mi></math>", "image": null, "isCorrect": false}, {"id": "HV6Ht", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>R</mi><mi>T</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since the gas is enclosed in a vessel, therefore, during heating process, volume of the gas remains constant. Hence, no work is done by the gas. It means heat supplied to the gas is used to increase its internal energy only.<br /><br />Initial internal energy of the gas is <math> <mrow> <msub> <mtext>U</mtext> <mn>1</mn> </msub> <mo>=</mo> <mtext>N</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </mfenced> <mtext>T</mtext> </mrow> </math><br /><br />Since n moles get dissociated into atoms, therefore, after heating, vessel contains <math> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>N</mtext> <mo>-</mo> <mtext>n</mtext> </mrow> </mfenced> </mrow> </math>&nbsp; moles of diatomic gas and 2n moles of a mono-atomic gas. Hence the internal energy for the gas, after heating, will be equal to <math> <mrow> <msub> <mtext>U</mtext> <mn>2</mn> </msub> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>N</mtext> <mo>-</mo> <mtext>n</mtext> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </mfenced> <mtext>T</mtext> <mo>+</mo> <mn>2</mn> <mtext>n</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </mfenced> <mtext>T</mtext> <mo>=</mo> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>NRT</mtext> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>nRT</mtext> </mrow> </math><br /><br />Hence, the heat supplied = increase in internal energy<br /><br /><math> <mrow> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>U</mtext> <mn>2</mn> </msub> <mo>-</mo> <msub> <mtext>U</mtext> <mn>1</mn> </msub> </mrow> </mfenced> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>nRT</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630d2a0731994f021b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "36", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An ideal gas <math><mfenced separators=\"|\"><mrow><mi>γ</mi><mo>=</mo><mn>1.5</mn></mrow></mfenced></math> undergoes a thermodynamic process in which the temperature and pressure of the gas are related as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi>P</mi><mn>2</mn></msup></math> = constant. The molar heat capacity of the gas during the process is", "image": null}, "options": [{"id": "dnj1g", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>R</mi></math>", "image": null, "isCorrect": false}, {"id": "2MLbM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>3</mn></mfrac><mi>R</mi></math>", "image": null, "isCorrect": false}, {"id": "97jd2", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>2</mn></mfrac><mi>R</mi></math>", "image": null, "isCorrect": true}, {"id": "rHyd4", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>3</mtext><mi>R</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi>P</mi><mn>2</mn></msup><mo>=</mo></math> constant<br /><br /><math><mo>&#8658;</mo></math> <math><mi>P</mi><msup><mrow><mi>V</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> = constant</p><p>For a polytropic process&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mi>V</mi><mi>x</mi></msup></math>&nbsp;= constant, the molar heat capacity is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>=</mo><mi>R</mi><mfenced open=\"[\" close=\"]\"><mrow><mfrac><mn>1</mn><mrow><mi>&#947;</mi><mo>-</mo><mn>1</mn></mrow></mfrac><mo>+</mo><mfrac><mn>1</mn><mrow><mn>1</mn><mo>-</mo><mi>x</mi></mrow></mfrac></mrow></mfenced></math></p><p>Substituting the values we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>=</mo><mi>R</mi><mfenced open=\"[\" close=\"]\"><mrow><mfrac><mn>1</mn><mrow><mn>1</mn><mo>.</mo><mn>5</mn><mo>-</mo><mn>1</mn></mrow></mfrac><mo>+</mo><mfrac><mn>1</mn><mrow><mn>1</mn><mo>-</mo><mfenced><mrow><mo>-</mo><mn>1</mn></mrow></mfenced></mrow></mfrac></mrow></mfenced><mo>=</mo><mfrac><mn>5</mn><mn>2</mn></mfrac><mi>R</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863083cf2a99595fba6", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "49", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi>kg</mi></math> of ice at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>20°C</mn></math> is mixed with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&nbsp;</mo><mi>kg</mi></math> of water at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20°C</mn></math>. The water content of the final mixture is (Latent heat of ice <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>80</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi>kcal</mi><mo>&nbsp;</mo><msup><mi>kg</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>, the specific heat of water <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>1</mn><mo>&nbsp;</mo><mi>kcal</mi><msup><mi>kg</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>°</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>&nbsp;and specific heat of ice <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mtext>0.5</mtext><mi mathvariant=\"normal\">&nbsp;</mi><mi>kcal</mi><mi mathvariant=\"normal\">&nbsp;</mi><msup><mi>kg</mi><mrow><mo>–</mo><mn>1</mn></mrow></msup><mo>°</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>–</mo><mn>1</mn></mrow></msup></math> )", "image": null}, "options": [{"id": "RK0Jc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mi mathvariant=\"normal\">&#xA0;</mi><mi>kg</mi></math>", "image": null, "isCorrect": false}, {"id": "pYLfJ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi>kg</mi></math>", "image": null, "isCorrect": true}, {"id": "h8WoF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi mathvariant=\"normal\">&#xA0;</mi><mi>kg</mi></math>", "image": null, "isCorrect": false}, {"id": "J2qbk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi mathvariant=\"normal\">&#xA0;</mi><mi>kg</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Here,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">s</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">&#952;</mi><mn>1</mn></msub></math>&nbsp;are the mass, specific heat and temperature difference for water respectively. Similarly,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">&#952;</mi><mn>2</mn></msub></math>&nbsp;are the corresponding quantities for ice. Here,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">L</mi></math>&nbsp;is the latent heat of fusion.</p><p>We have, the heat lost by water <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>ms&#952;</mi></math>, heat gained by ice <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>MS&#952;</mi><mo>+</mo><mi>ML</mi></math>.<br /><br />From the principle of calorimetry, we have, the heat lost by water=heat gained by ice.</p><p>Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>ms&#952;</mi><mn>1</mn></msub><mo>=</mo><msub><mi>MS&#952;</mi><mn>2</mn></msub><mo>+</mo><mi>ML</mi></math>.</p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#215;</mo><mn>1</mn><mo>&#215;</mo><mfenced><mrow><mn>20</mn><mo>-</mo><mn>0</mn></mrow></mfenced><mo>=</mo><mn>2</mn><mo>&#215;</mo><mn>0</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><mn>20</mn><mo>+</mo><mi mathvariant=\"normal\">x</mi><mo>&#215;</mo><mn>80</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi><mo>=</mo><mn>1</mn><mo>&#160;</mo><mi>kg</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi>kg</mi></math>&nbsp;of ice melts to form water.<br /><br />Hence, final amount of water&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#160;</mo><mi>kg</mi><mo>+</mo><mn>1</mn><mo>&#160;</mo><mi>kg</mi><mo>=</mo><mn>6</mn><mo>&#160;</mo><mi>kg</mi></math>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86304cc6fbd5095cd42", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "10", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An ideal gas undergoes&nbsp;the cyclic process <math> <mrow> <mtext>abca</mtext></mrow> </math>as shown in the figure. The&nbsp;internal energy change of the gas along the path <math> <mrow> <mtext>c</mtext><mtext>a</mtext></mrow> </math> &nbsp;is&nbsp;<math> <mrow> <mo>−</mo><mn>180</mn><mo>&nbsp;</mo><mtext>J</mtext></mrow> </math>. The gas absorb <math> <mrow> <mn>250</mn><mo>&nbsp;</mo><mtext>J</mtext></mrow> </math> of heat along the path <math> <mrow> <mtext>a</mtext><mtext>b</mtext></mrow> </math> &nbsp;and also absorbs&nbsp;<math> <mrow> <mn>60</mn><mo>&nbsp;</mo><mtext>J</mtext></mrow> </math> &nbsp;of heat along&nbsp;the path <math> <mrow> <mtext>bc</mtext></mrow> </math>. Find the work done by the gas along the path <math> <mrow> <mtext>a</mtext><mtext>b</mtext><mtext>c</mtext></mrow></math><br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-05-28_at_7.35.59_PM.jpeg\" style=\"width: 200px; height: 190px;\" />", "image": null}, "options": [{"id": "UwUDO", "text": "<math> <mrow> <mn>130</mn><mo>&nbsp;</mo><mtext>J</mtext></mrow> </math>", "image": null, "isCorrect": true}, {"id": "cu6xS", "text": "<math> <mrow>  <mn>140</mn><mo>&#x00A0;</mo><mtext>J</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "mW2Z3", "text": "<math> <mrow>  <mn>120</mn><mo>&#x00A0;</mo><mtext>J</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "mesE1", "text": "<math> <mrow>  <mn>100</mn><mo>&#x00A0;</mo><mtext>J</mtext></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Change in internal energy for a cyclic process is zero. Thus,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><msub><mi mathvariant=\"normal\">U</mi><mi>abc</mi></msu n>2</mn> <mn>0</mn> </mrow> <mrow> <mn>5</mn> </mrow> </mfrac> <mo>=</mo> <mn>4</mn> </mrow> </math><br /><br /><math> <mrow> <msub> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mo>&#916;</mo> <mtext>Q</mtext> </mrow> </mfenced> </mrow> <mtext>ca</mtext> </msub> <mo>=</mo> <mo>-</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>7</mn> <mn>0</mn> <mn>0</mn> <mn>0</mn> <mo>+</mo> <mn>4</mn> <mo>&#215;</mo> <mn>7</mn> <mn>0</mn> <mn>0</mn> </mrow> </mfenced> <mo>=</mo> <mo>-</mo> <mn>9</mn> <mn>8</mn> <mn>0</mn> <mn>0</mn> <mo>J</mo> </mrow> </math><br /><br />Negative sign shows that heat is ejected.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86302b77fabdd5a0a54", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "94", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Determine the work done by an ideal gas undergoing a cyclic process from&nbsp;<math> <mrow> <mn>1</mn> <mo>→</mo> <mn>4</mn> <mo>→</mo> <mn>3</mn> <mo>→</mo> <mn>2</mn> <mo>→</mo> <mn>1</mn> </mrow> </math>. Given <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub><mo>=</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&nbsp;</mo><mi>Pa</mi><mo>,</mo><mo>&nbsp;</mo><msub><mi>P</mi><mn>0</mn></msub><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>3</mn><mo>×</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&nbsp;</mo><mi>Pa</mi><mo>,</mo><mo>&nbsp;</mo><msub><mi>P</mi><mn>3</mn></msub><mo>=</mo><mn>4</mn><mo>×</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&nbsp;</mo><mi>Pa</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>2</mn></msub><mo>-</mo><msub><mi>V</mi><
