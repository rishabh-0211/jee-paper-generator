ub></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a closed system, the total number of moles remains constant. So<br/><br/><math><msub><mrow><mi>p</mi></mrow><mrow><mn>1</mn></mrow></msub><mi>V</mi><mo>=</mo><msub><mrow><mi>n</mi></mrow><mrow><mn>1</mn></mrow></msub><mi>R</mi><msub><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow></msub><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">d</mi><mi> </mi><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub><mi>V</mi><mo>=</mo><msub><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msub><mi>R</mi><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br/><br/><math><mo>∴</mo><mi> </mi><mi>p</mi><mfenced separators=\"|\"><mrow><mn>2</mn><mi>V</mi></mrow></mfenced><mo>=</mo><mfenced separators=\"|\"><mrow><msub><mrow><mi>n</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced><mi>R</mi><mi>T</mi></math><br/><br/><math><mo>∴</mo><mi> </mi><mfrac><mrow><mi>p</mi></mrow><mrow><mi>T</mi></mrow></mfrac><mi> </mi><mi> </mi><mo>=</mo><mi> </mi><mfrac><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>n</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></mfrac><mi>R</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><msub><mrow><mi>P</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>+</mo><mfrac><mrow><msub><mrow><mi>P</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></mrow></mfenced></math><br/><br/>= <math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><msub><mrow><mi>p</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></mrow></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86336c78cb58adf798a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "60", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The root mean square&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>rms</mi></mfenced></math> speed of oxygen molecules (O<sub>2</sub>) at a certain temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math>&nbsp;(on kelvin scale) is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi></math>. If the temperature is doubled and oxygen gas dissociates into atomic oxygen, the&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>rms</mi></math> speed becomes", "image": null}, "options": [{"id": "6qtpK", "text": "two times", "image": null, "isCorrect": true}, {"id": "33tg9", "text": "three times", "image": null, "isCorrect": false}, {"id": "kMenU", "text": "four times", "image": null, "isCorrect": false}, {"id": "erTbJ", "text": "unchanged", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mtext>V</mtext> <mtext>rms</mtext> </msub> <mo>=</mo> <msqrt> <mfrac> <mrow> <mtext>3RT</mtext> </mrow> <mrow> <mtext>M</mtext> </mrow> </mfrac> </msqrt> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mtext>V</mtext> <mtext>rms</mtext> </msub> <mo>&#8733;</mo> <msqrt> <mfrac> <mrow> <mtext>T</mtext> </mrow> <mrow> <mtext>M</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(i)<br /><br />When oxygen gas dissociates into atomic oxygen, its<br />atomic mass M will become half.<br />Temperature is doubled.<br />So, from Eq. (i) V<sub>rms</sub> will become two times.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msubsup><mtext>V</mtext><mtext>rms</mtext><mo>'</mo></msubsup><msub><mtext>V</mtext><mtext>rms</mtext></msub></mfrac><mo>=</mo><mfrac><msqrt><mfrac><mtext>2T</mtext><mfrac><mtext>M</mtext><mtext>2</mtext></mfrac></mfrac></msqrt><msqrt><mfrac><mtext>T</mtext><mtext>M</mtext></mfrac></msqrt></mfrac></math><br /><br /><math> <mo>=</mo><msqrt> <mn>4</mn> </msqrt> <mo>=</mo><mn>2</mn> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msubsup><mtext>V</mtext><mtext>rms</mtext><mo>'</mo></msubsup><mo>=</mo><mn>2</mn><msub><mtext>V</mtext><mtext>rms</mtext></msub></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863320e2cec01584d71", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "93", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two identical systems, with heat capacity at a constant volume that varies as <math><msub><mrow><mi>C</mi></mrow><mrow><mi>v</mi></mrow></msub><mo>=</mo><mi>b</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>3</mn></mrow></msup></math> (where <math><mi>b</mi></math> is a constant) are thermally isolated. Initially, one system is at a temperature <math><mn>100</mn><mi>&#160;</mi><mi>K</mi></math> and the other is at <math><mn>200</mn><mi>K</mi></math> . The systems are then brought to thermal contact and the combined system is allowed to reach thermal equilibrium.&nbsp;If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><msub><mi>T</mi><mn>0</mn></msub><mn>4</mn></msup><mo>=</mo><mi>n</mi><mo>&#215;</mo><msup><mn>10</mn><mn>8</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math>&nbsp;then what will be the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>0</mn></msub></math>&nbsp;is the final temperature in kelvin?", "image": null}, "options": [], "correctValue": "8.5", "solution": {"text": "<p>Energy given by a system = Energy taken by another system<br /><br /><math><mi>d</mi><msub><mrow><mi>Q</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mi>d</mi><msub><mrow><mi>Q</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br /><math><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mrow><munderover><mo stretchy=\"false\">&#8747;</mo><mrow><mn>100</mn></mrow><mrow><mi>T</mi></mrow></munderover><mrow><mi>m</mi><msub><mrow><mi>c</mi></mrow><mrow><mi>v</mi></mrow></msub><mi>d</mi><mi>T</mi><mo>=</mo><mo>-</mo><mrow><munderover><mo stretchy=\"false\">&#8747;</mo><mrow><mn>200</mn></mrow><mrow><mi>T</mi></mrow></munderover><mrow><mi>m</mi><msub><mrow><mi>c</mi></mrow><mrow><mi>v</mi></mrow></msub><mi>d</mi><mi>T</mi></mrow></mrow></mrow></mrow></math><br /><br /><math><mo>&#8658;</mo><mi>&#160;</mi><mrow><munderover><mo stretchy=\"false\">&#8747;</mo><mrow><mn>100</mn></mrow><mrow><mi>T</mi></mrow></munderover><mrow><mi>b</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>3</mn></mrow></msup><mi>d</mi><mi>T</mi><mo>=</mo><mo>-</mo></mrow></mrow><mrow><munderover><mo stretchy=\"false\">&#8747;</mo><mrow><mn>200</mn></mrow><mrow><mi>T</mi></mrow></munderover><mrow><mi>b</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>3</mn></mrow></msup><mi>d</mi><mi>T</mi><mo>&#8658;</mo><msubsup><mrow><mfenced separators=\"|\"><mrow><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup></mrow></mfenced></mrow><mrow><mn>10</mn></mrow><mrow><mi>T</mi></mrow></msubsup><mo>=</mo><mo>-</mo><msubsup><mrow><mfenced separators=\"|\"><mrow><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup></mrow></mfenced></mrow><mrow><mn>200</mn></mrow><mrow><mi>T</mi></mrow></msubsup></mrow></mrow></math><br /><br /><math><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup><mo>-</mo><msup><mrow><mn>100</mn></mrow><mrow><mn>4</mn></mrow></msup><mo>=</mo><mo>-</mo><mfenced separators=\"|\"><mrow><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup><mo>-</mo><msup><mrow><mn>200</mn></mrow><mrow><mn>4</mn></mrow></msup></mrow></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mn>2</mn><msup><mi>T</mi><mn>4</mn></msup><mo>=</mo><mn>17</mn><mo>&#215;</mo><msup><mn>10</mn><mn>8</mn></msup><mo>&#8658;</mo><mi>T</mi><mo>=</mo><mn>171</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><msup><mi>T</mi><mn>4</mn></msup><mo>=</mo><mn>8</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mn>8</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632a6bb64d90f28fe3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "21", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A vessel contains two non-reactive gases neon (monatomic) and oxygen (diatomic). The ratio of their partial pressures is <math><mn>3</mn><mo>:</mo><mn>2</mn></math>. the ratio of number of molecules is", "image": null}, "options": [{"id": "aFjga", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "m3OTW", "text": "<math><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "ZEKPn", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "CIeF6", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As partial pressure of a gas in a mixture is the pressure it would exert for the same volume and temperature, if it alone occupied the vessel, therefore, for common <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">V</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">P</mi><mn>1</mn></msub></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">P</mi><mn>2</mn></msub></math> are partial pressures<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">P</mi><mn>1</mn></msub><mi mathvariant=\"normal\">V</mi><mo>=</mo><msub><mi mathvariant=\"normal\">μ</mi><mn>1</mn></msub><mi>RT</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">P</mi><mn>2</mn></msub><mi mathvariant=\"normal\">V</mi><mo>=</mo><msub><mi mathvariant=\"normal\">μ</mi><mn>2</mn></msub><mi>RT</mi></math>&nbsp;<br /><br />Here, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math> refer to neon gas and oxygen gas respectively<br /><br />Now, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><msub><mi mathvariant=\"normal\">P</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">P</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">μ</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">μ</mi><mn>2</mn></msub></mfrac><mo>⇒</mo><mfrac><msub><mi mathvariant=\"normal\">μ</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">μ</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac></math>&nbsp;( given <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi mathvariant=\"normal\">P</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">P</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac></math>)<br />If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">N</mi><mn>1</mn></msub></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub></math> are number of molecules of two gases, then<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mo> </mo><mo> </mo><mfrac><msub><mi mathvariant=\"normal\">N</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">μ</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">μ</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac></math>, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">μ</mi><mn>1</mn></msub><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">N</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">A</mi></msub></mfrac></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">μ</mi><mn>2</mn></msub><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">A</mi></msub></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630c528a1f4ce9c312", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "76", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two identical glass bulbs are interconnected by a thin glass tube. A gas is filled in these bulbs at NTP. If one bulb is placed in ice and another bulb is placed inside a hot bath, then the pressure of the gas becomes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>5</mn></math> times. The temperature of the hot bath will be<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0031158_Question.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 250px; height: 130px;\" />", "image": null}, "options": [{"id": "u72T3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 55px; top: 41px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "SGhQY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>182</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 55px; top: 41px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "lDGnr", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>256</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 55px; top: 41px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "m5HtF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>546</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 55px; top: 41px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Quantity of gas in these bulbs is constant, i.e.,<br />initial no. of moles in both the bulbs = final number of moles<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mi>&#956;</mi> <mn>1</mn> </msub> <mo>+</mo> <msub> <mi>&#956;</mi> <mn>2</mn> </msub> <mo>=</mo> <msubsup> <mi>&#956;</mi> <mn>1</mn> <mo>&#8242;</mo> </msubsup> <mo>+</mo> <msubsup> <mi>&#956;</mi> <mn>2</mn> <mo>&#8242;</mo> </msubsup> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mtext mathvariant=\"italic\">PV</mtext><mrow><mtext mathvariant=\"italic\">R</mtext><mfenced><mrow><mn>2</mn><mn>7</mn><mn>3</mn></mrow></mfenced></mrow></mfrac><mo>+</mo><mfrac><mtext mathvariant=\"italic\">PV</mtext><mrow><mtext mathvariant=\"italic\">R</mtext><mfenced><mrow><mn>2</mn><mn>7</mn><mn>3</mn></mrow></mfenced></mrow></mfrac><mo>=</mo><mfrac><mrow><mtext>1.5</mtext><mtext mathvariant=\"italic\">PV</mtext></mrow><mrow><mtext mathvariant=\"italic\">R</mtext><mfenced><mrow><mn>2</mn><mn>7</mn><mn>3</mn></mrow></mfenced></mrow></mfrac><mo>+</mo><mfrac><mrow><mtext>1.5</mtext><mtext mathvariant=\"italic\">PV</mtext></mrow><mrow><mtext mathvariant=\"italic\">R</mtext><mfenced><mtext mathvariant=\"italic\">T</mtext></mfenced></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;&#160;&#160;&#160;</mo><mfrac><mn>2</mn><mrow><mn>2</mn><mn>7</mn><mn>3</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn><mo>.</mo><mn>5</mn></mrow><mrow><mn>2</mn><mn>7</mn><mn>3</mn></mrow></mfrac><mo>+</mo><mfrac><mtext>1.5</mtext><mi>T</mi></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;&#160;&#160;&#160;</mo><mi>T</mi><mo>=</mo><mn>8</mn><mn>1</mn><mn>9</mn><mo>K</mo><mo>=</mo><mn>5</mn><mn>4</mn><mn>6</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863083cf2a99595fba6", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "49", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi>kg</mi></math> of ice at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>20°C</mn></math> is mixed with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&nbsp;</mo><mi>kg</mi></math> of water at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20°C</mn></math>. The water content of the final mixture is (Latent heat of ice <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>80</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi>kcal</mi><mo>&nbsp;</mo><msup><mi>kg</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>, the specific heat of water <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>1</mn><mo>&nbsp;</mo><mi>kcal</mi><msup><mi>kg</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>°</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>&nbsp;and specific heat of ice <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mtext>0.5</mtext><mi mathvariant=\"normal\">&nbsp;</mi><mi>kcal</mi><mi mathvariant=\"normal\">&nbsp;</mi><msup><mi>kg</mi><mrow><mo>–</mo><mn>1</mn></mrow></msup><mo>°</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>–</mo><mn>1</mn></mrow></msup></math> )", "image": null}, "options": [{"id": "RK0Jc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mi mathvariant=\"normal\">&#xA0;</mi><mi>kg</mi></math>", "image": null, "isCorrect": false}, {"id": "pYLfJ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi>kg</mi></math>", "image": null, "isCorrect": true}, {"id": "h8WoF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi mathvariant=\"normal\">&#xA0;</mi><mi>kg</mi></math>", "image": null, "isCorrect": false}, {"id": "J2qbk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi mathvariant=\"normal\">&#xA0;</mi><mi>kg</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Here,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">s</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">&#952;</mi><mn>1</mn></msub></math>&nbsp;are the mass, specific heat and temperature difference for water respectively. Similarly,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">&#952;</mi><mn>2</mn></msub></math>&nbsp;are the corresponding quantities for ice. Here,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">L</mi></math>&nbsp;is the latent heat of fusion.</p><p>We have, the heat lost by water <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>ms&#952;</mi></math>, heat gained by ice <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>MS&#952;</mi><mo>+</mo><mi>ML</mi></math>.<br /><br />From the principle of calorimetry, we have, the heat lost by water=heat gained by ice.</p><p>Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>ms&#952;</mi><mn>1</mn></msub><mo>=</mo><msub><mi>MS&#952;</mi><mn>2</mn></msub><mo>+</mo><mi>ML</mi></math>.</p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#215;</mo><mn>1</mn><mo>&#215;</mo><mfenced><mrow><mn>20</mn><mo>-</mo><mn>0</mn></mrow></mfenced><mo>=</mo><mn>2</mn><mo>&#215;</mo><mn>0</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><mn>20</mn><mo>+</mo><mi mathvariant=\"normal\">x</mi><mo>&#215;</mo><mn>80</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi><mo>=</mo><mn>1</mn><mo>&#160;</mo><mi>kg</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi>kg</mi></math>&nbsp;of ice melts to form water.<br /><br />Hence, final amount of water&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#160;</mo><mi>kg</mi><mo>+</mo><mn>1</mn><mo>&#160;</mo><mi>kg</mi><mo>=</mo><mn>6</mn><mo>&#160;</mo><mi>kg</mi></math>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863059c5f513909c0f3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "27", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A cylindrical adiabatic&nbsp;container of total volume&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub></math>&nbsp;is divided into&nbsp;two equal parts by a conducting piston which is free to move as shown in the figure. Each part&nbsp;contains&nbsp;identical gas at pressure&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub></math>.&nbsp;Initially the temperatures of the left and right parts are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub></math> respectively. An external&nbsp;force is applied on the piston of area <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;to keep the&nbsp;piston at rest. The value of external force required when thermal equilibrium is reached is</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0629611.jpg\" style=\"width: 275px; height: 113px;\" /></p>\r\r<p>&nbsp;</p>\r", "image": null}, "options": [{"id": "6boHH", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>8</mn><mn>5</mn></mfrac><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}, {"id": "SCrUP", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>5</mn></mfrac><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}, {"id": "iai5s", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>6</mn></mfrac><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}, {"id": "RVwcd", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>6</mn><mn>5</mn></mfrac><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>If final temp is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub></mrow><mrow><mn>4</mn><msub><mi>RT</mi><mn>0</mn></msub></mrow></mfrac><msub><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">v</mi></msub><mfenced><mrow><mn>4</mn><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub><mo>-</mo><mi mathvariant=\"normal\">T</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub></mrow><msub><mi>RT</mi><mn>0</mn></msub></mfrac><msub><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">v</mi></msub><mfenced><mrow><mi mathvariant=\"normal\">T</mi><mo>-</mo><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>4</mn><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub><mo>-</mo><mi mathvariant=\"normal\">T</mi></mrow><mn>4</mn></mfrac><mo>=</mo><mi mathvariant=\"normal\">T</mi><mo>-</mo><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub><mo>-</mo><mi mathvariant=\"normal\">T</mi><mo>=</mo><mn>4</mn><mi mathvariant=\"normal\">T</mi><mo>-</mo><mn>4</mn><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub><mo>=</mo><mn>5</mn><mi mathvariant=\"normal\">T</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>=</mo><mfrac><mrow><mn>8</mn><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub></mrow><mn>5</mn></mfrac></math></p><p>Final pressure</p><p>In left&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">f</mi></msub><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">T</mi><mi mathvariant=\"normal\">f</mi></msub><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub></mfrac><msub><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">i</mi></msub><mo>=</mo><mfrac><mrow><mfrac><mn>8</mn><mn>5</mn></mfrac><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub></mrow><mrow><mn>4</mn><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub></mrow></mfrac><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub><mo>=</mo><mfrac><mn>2</mn><mn>5</mn></mfrac><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub></math></p><p>In right&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">f</mi></msub><mo>=</mo><mfrac><mrow><mfrac><mn>8</mn><mn>5</mn></mfrac><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub></mrow><msub><mi math ib", "text": "<math><msub><mrow><mi>T</mi></mrow><mrow><mi>f</mi></mrow></msub><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>7</mn></mrow></mfrac><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "DPotK", "text": "<math><msub><mrow><mi>T</mi></mrow><mrow><mi>f</mi></mrow></msub><mo>=</mo><mfrac><mrow><mn>7</mn></mrow><mrow><mn>3</mn></mrow></mfrac><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "HxCll", "text": "<math><msub><mrow><mi>T</mi></mrow><mrow><mi>f</mi></mrow></msub><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub></math>", "image": null, "isCorrect": true}, {"id": "WVQLv", "text": "<math><msub><mrow><mi>T</mi></mrow><mrow><mi>f</mi></mrow></msub><mo>=</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>2</mn></mrow></mfrac><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here, change in internal energy of the system is zero, ie, increase in internal energy of one is equal to decrease in internal energy of other.<br /><br /><b><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029171_Ans.jpg\" style=\"width: 250px; height: 105px;\" /></b><br /><br /><math><mo>∆</mo><msub><mrow><mi>U</mi></mrow><mrow><mi>A</mi></mrow></msub><mo>=</mo><mn>1</mn><mo>&times;</mo><mfrac><mrow><mn>5</mn><mi>R</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>(</mo><msub><mrow><mi>T</mi></mrow><mrow><mi>f</mi></mrow></msub><mo>-</mo><msub><mrow><mi>T</mi></mrow><mrow><mi>o</mi></mrow></msub><mo>)</mo></math><br /><br /><math><mo>∆</mo><msub><mrow><mi>U</mi></mrow><mrow><mi>B</mi></mrow></msub><mo>=</mo><mn>1</mn><mo>&times;</mo><mfrac><mrow><mn>3</mn><mi>R</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>(</mo><msub><mrow><mi>T</mi></mrow><mrow><mi>f</mi></mrow></msub><mo>-</mo><mfrac><mrow><mn>7</mn></mrow><mrow><mn>3</mn></mrow></mfrac><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>)</mo></math><br /><br />Now, <math><mo>∆</mo><msub><mrow><mi>U</mi></mrow><mrow><mi>A</mi></mrow></msub><mo>+</mo><mo>∆</mo><msub><mrow><mi>U</mi></mrow><mrow><mi>B</mi></mrow></msub><mo>=</mo><mn>0</mn></math><br /><br /><math><mfrac><mrow><mn>5</mn><mi>R</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mfenced separators=\"|\"><mrow><msub><mrow><mi>T</mi></mrow><mrow><mi>f</mi></mrow></msub><mo>-</mo><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfenced><mo>+</mo><mfrac><mrow><mn>3</mn><mi>R</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mfenced separators=\"|\"><mrow><msub><mrow><mi>T</mi></mrow><mrow><mi>f</mi></mrow></msub><mo>-</mo><mfrac><mrow><mn>7</mn><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>0</mn></math><br /><br /><math><mn>5</mn><msub><mrow><mi>T</mi></mrow><mrow><mi>f</mi></mrow></msub><mo>-</mo><mn>5</mn><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>+</mo><mn>3</mn><msub><mrow><mi>T</mi></mrow><mrow><mi>f</mi></mrow></msub><mo>-</mo><mn>7</mn><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mn>0</mn></math><br /><br /><math><mo>&rArr;</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mn>8</mn><msub><mrow><mi>T</mi></mrow><mrow><mi>f</mi></mrow></msub><mo>=</mo><mn>12</mn><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub></math><br /><br /><math><mo>&rArr;</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>T</mi></mrow><mrow><mi>f</mi></mrow></msub><mo>=</mo><mfrac><mrow><mn>12</mn></mrow><mrow><mn>8</mn></mrow></mfrac><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863f581677cc339404a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "54", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A liquid of density <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>85</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">g</mi><mo>&nbsp;</mo><msup><mi>cm</mi><mrow><mo>-</mo><mn>3</mn></mrow></msup></math> flows through a calorimeter at the rate of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>.</mo><mn>0</mn><mo>&nbsp;</mo><msup><mi>cm</mi><mn>3</mn></msup><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. Heat is added by means of a <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>250</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">W</mi></math> electric heating coil and a temperature difference of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>°</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">C</mi></math> is established in steady-state conditions between the inflow and the outflow points of the liquid. The specific heat for the liquid will be (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi>kcal</mi><mo>&#160;</mo><mo>=</mo><mn>4186</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>&nbsp;)", "image": null}, "options": [{"id": "iYfWj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>6</mn><mo>&#xA0;</mo><mi>kcal</mi><mo>&#xA0;</mo><msup><mi>kg</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "j3uJx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>3</mn><mo>&#xA0;</mo><mi>kcal</mi><mo>&#xA0;</mo><msup><mi>kg</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "N1dzE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>5</mn><mo>&#xA0;</mo><mi>kcal</mi><mo>&#xA0;</mo><msup><mi>kg</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "Q6UjW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>4</mn><mo>&#xA0;</mo><mi>kcal</mi><mo>&#xA0;</mo><msup><mi>kg</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>This is a problem on &#39;flow calorimeter&#39; used to measure the specific heat of the liquid.<br />Amount of heat supplied to the water per second by the heating coil = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Q</mi><mi mathvariant=\"normal\">s</mi></msub></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>250</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>&nbsp; &nbsp;<math> <mrow> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> <mn>5</mn> <mn>0</mn> </mrow> <mrow> <mn>4</mn> <mn>1</mn> <mn>8</mn> <mn>6</mn> </mrow> </mfrac> <mtext>kcal</mtext> </mrow> </math><br /><br />The volume of liquid flowing out per second = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>.</mo><mn>0</mn><mo>&#160;</mo><msup><mi>cm</mi><mn>3</mn></msup><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>8</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>3</mn></msup></math></p><p>Mass of this liquid = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>0</mn><mo>.</mo><mn>85</mn><mo>)</mo><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>1000</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>8</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup><mo>&#160;</mo><mi>kg</mi></math><br /><br />The temperature rise of this mass of liquid = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>&#176;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">C</mi></math></p><p>Hence,&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> <mn>5</mn> <mn>0</mn> </mrow> <mrow> <mn>4</mn> <mn>1</mn> <mn>8</mn> <mn>6</mn> </mrow> </mfrac> <mo>=</mo> <mtext>mst</mtext> <mo>=</mo> <mtext>0.85</mtext> <mo>&#215;</mo> <mn>8</mn> <mo>&#215;</mo> <mn>1</mn> <msup> <mn>0</mn> <mrow> <mo>-</mo> <mn>3</mn> </mrow> </msup> <mo>&#215;</mo> <mtext>s</mtext> <mo>&#215;</mo> <mn>1</mn> <mn>5</mn> </mrow> </math><br /><br />Hence,&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>s</mtext><mo>=</mo><mfrac><mrow><mn>2</mn><mn>5</mn><mn>0</mn><mo>&#215;</mo><mn>1</mn><msup><mn>0</mn><mn>3</mn></msup></mrow><mrow><mn>4</mn><mn>1</mn><mn>8</mn><mn>6</mn><mo>&#215;</mo><mtext>0.85</mtext><mo>&#215;</mo><mn>8</mn><mo>&#215;</mo><mn>1</mn><mn>5</mn></mrow></mfrac><mo>=</mo><mtext>0.6&#160;</mtext><mi>kcal</mi><mo>&#160;</mo><msup><mi>kg</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mo>K</mo><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863f0d87983f583f710", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "13", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The pressure <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>, volume <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi></math> and temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> of a certain material are related by the equation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mi>α</mi><msup><mi>T</mi><mn>2</mn></msup><mo>/</mo><mi>V</mi></math>. The work done by the material at constant pressure, when the temperature changes from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>0</mn></msub></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mi>T</mi><mn>0</mn></msub></math>,&nbsp;is", "image": null}, "options": [{"id": "F6bjz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>&#x3B1;</mi><msubsup><mi>T</mi><mn>0</mn><mn>2</mn></msubsup></math>", "image": null, "isCorrect": true}, {"id": "edg2O", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mi>&#x3B1;</mi><msubsup><mi>T</mi><mn>0</mn><mn>2</mn></msubsup></math>", "image": null, "isCorrect": false}, {"id": "tXG5p", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>3</mn></mfrac><mi>&#x3B1;</mi><msubsup><mi>T</mi><mn>0</mn><mn>2</mn></msubsup></math>", "image": null, "isCorrect": false}, {"id": "u14RG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mi>&#x3B1;</mi><msubsup><mi>T</mi><mn>0</mn><mn>2</mn></msubsup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given relation is<br /><br /><math> <mrow> <mtext>P</mtext> <mo>=</mo> <mfrac> <mrow> <mi>α</mi> <msup> <mtext>T</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mtext>V</mtext> </mrow> </mfrac> <mspace width=\"0.5em\"></mspace> <mo>∴</mo> <mspace width=\"0.5em\"></mspace> <mtext>V</mtext> <mo>=</mo> <mfrac> <mrow> <mi>α</mi> <msup> <mtext>T</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mtext>P</mtext> </mrow> </mfrac> </mrow> </math><br /><br />As pressure is kept constant, <math> <mrow> <mtext>dV</mtext> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>2</mn> <mi>α</mi> <mtext>T</mtext> </mrow> <mrow> <mtext>P</mtext> </mrow> </mfrac> </mrow> </mfenced> <mtext>dT</mtext> </mrow> </math><br /><br /><math> <mrow> <mtext>W</mtext> <mo>=</mo> <mo>∫</mo> <mtext>P</mtext> <mo>·</mo> <mtext>dV</mtext> <mo>=</mo> <munderover> <mo>∫</mo> <msub> <mtext>T</mtext> <mn>0</mn> </msub> <msub> <mtext>2T</mtext> <mn>0</mn> </msub> </munderover> <mtext>P</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>2</mn> <mi>α</mi> <mtext>T</mtext> </mrow> <mrow> <mtext>P</mtext> </mrow> </mfrac> </mrow> </mfenced> <mtext>dT</mtext> <mo>=</mo> <mn>2</mn> <mi>α</mi> <msubsup> <mrow> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mfrac> <mrow> <msup> <mtext>T</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </mfenced> </mrow> <msub> <mtext>T</mtext> <mn>0</mn> </msub> <msub> <mtext>2T</mtext> <mn>0</mn> </msub> </msubsup> <mo>=</mo> <mn>3</mn> <mi>α</mi> <msubsup> <mtext>T</mtext> <mn>0</mn> <mn>2</mn> </msubsup> </mrow> </math> &nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ed540e81e9091db1", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "99", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The figure shows two isotherms at temperatures <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>1</mn></msub></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>2</mn></msub></math>. A gas is taken from one isotherm to another isotherm through different processes. Then change in internal energy <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>Δ</mo><mtext>U</mtext></math> has a relation –<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0032756.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 190px; height: 132px;\" />", "image": null}, "options": [{"id": "oJSlt", "text": "<math> <mrow> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ab</mtext> </msub> <mo>&gt;</mo> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ac</mtext> </msub> <mo>&gt;</mo> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ad</mtext> </msub> <mo>&gt;</mo> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ae</mtext> </msub> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "44qH2", "text": "<math> <mrow> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ab</mtext> </msub> <mo>=</mo> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ac</mtext> </msub> <mo>&gt;</mo> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ad</mtext> </msub> <mo>&gt;</mo> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ae</mtext> </msub> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "9lv7D", "text": "<math> <mrow> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ab</mtext> </msub> <mo>=</mo> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ac</mtext> </msub> <mo>=</mo> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ad</mtext> </msub> <mo>=</mo> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ae</mtext> </msub> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "AVzvx", "text": "<math> <mrow> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ab</mtext> </msub> <mo>&lt;</mo> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ac</mtext> </msub> <mo>&lt;</mo> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ad</mtext> </msub> <mo>&lt;</mo> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>ae</mtext> </msub> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Internal energy depends only on state but not on the process. Hence its change is same for all the processes between two same states.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ec10e0b797098987", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "78", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "One mole of an ideal gas as taken from state&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> to state&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> by three different processes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">a</mi><mo>)</mo><mo>&nbsp;</mo><mi>ACB</mi><mo>,</mo><mo>&nbsp;</mo><mo>(</mo><mi mathvariant=\"normal\">b</mi><mo>)</mo><mo>&nbsp;</mo><mi>ADB</mi><mo>&nbsp;</mo></math>and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">c</mi><mo>)</mo><mo>&nbsp;</mo><mi>AEB</mi></math> as shown in the<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mi>P</mi><mo>-</mo><mi>V</mi></math> diagram. The heat absorbed by the gas is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029740_Question.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 199px; height: 152px;\" />", "image": null}, "options": [{"id": "85WPf", "text": "Greater in process (b) than in (a)", "image": null, "isCorrect": false}, {"id": "TMt5t", "text": "The least in process (b)", "image": null, "isCorrect": false}, {"id": "8VSLO", "text": "The same in (a) and (c)", "image": null, "isCorrect": false}, {"id": "ZpIIq", "text": "Less in (c) than in (b)", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Heat absorbed by gas in three processes is given by<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">Q</mtext><mtext>ACB</mtext></msub><mo>=</mo><mo>&#916;</mo><mtext mathvariant=\"italic\">U</mtext><mo>+</mo><msub><mtext mathvariant=\"italic\">W</mtext><mtext>ACB</mtext></msub></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">Q</mtext><mtext>ADB</mtext></msub><mo>=</mo><mo>&#916;</mo><mtext mathvariant=\"italic\">U</mtext></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">Q</mtext><mtext>AEB</mtext></msub><mo>=</mo><mo>&#916;</mo><mtext mathvariant=\"italic\">U</mtext><mo>+</mo><msub><mtext mathvariant=\"italic\">W</mtext><mtext>AEB</mtext></msub></math><br /><br />The change in internal energy in all the three cases is the same and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mi>ACB</mi></msub></math> is positive, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mi>AEB</mi></msub></math> is negative.<br /><br />Hence&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">Q</mtext><mtext>ACB</mtext></msub><mo>&#62;</mo><msub><mtext mathvariant=\"italic\">Q</mtext><mtext>ADB</mtext></msub><mo>&#62;</mo><msub><mtext mathvariant=\"italic\">Q</mtext><mtext>AEB</mtext></msub></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863eaf11e644fac3d02", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "17", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>-</mo><mi>V</mi></math>&nbsp;diagram of a diatomic gas is a straight line parallel to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>-axis. The molar heat capacity of the gas in the process will be", "image": null}, "options": [{"id": "7GTj8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi mathvariant=\"normal\">R</mi></math>", "image": null, "isCorrect": false}, {"id": "k96ZD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2.5</mn><mi mathvariant=\"normal\">R</mi></math>", "image": null, "isCorrect": true}, {"id": "nY8iY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi mathvariant=\"normal\">R</mi></math>", "image": null, "isCorrect": false}, {"id": "XP2dg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>4</mn><mi mathvariant=\"normal\">R</mi></mrow><mn>3</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The process described is isochoric<br /><br /><math><mo>∴</mo></math> molar heat capacity <math><msub><mrow><mi>C</mi></mrow><mrow><mi>V</mi></mrow></msub><mo>=</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>R</mi><mo>=</mo><mn>2.5</mn><mi>R</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e7f4b4b908221bf8", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "29", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A work of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>146</mn><mo>&nbsp;</mo><mi>kJ</mi></math> is performed on the gas, in order to compress one kilomole of gas adiabatically and in this process the temperature of the gas increases by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. The gas is ( <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>8</mn><mo>.</mo><mn>3</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi><mo>&nbsp;</mo><msup><mi>mol</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> )", "image": null}, "options": [{"id": "GpzeI", "text": "monoatomic", "image": null, "isCorrect": false}, {"id": "xvluZ", "text": "diatomic", "image": null, "isCorrect": true}, {"id": "Ff4Xj", "text": "triatomic", "image": null, "isCorrect": false}, {"id": "swKBZ", "text": "a mixture of monoatomic and diatomic", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>According to first law of thermodynamics<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#916;</mo><mtext>Q</mtext><mo>=</mo><mo>&#916;</mo><mtext>U</mtext><mo>+</mo><mo>&#916;</mo><mtext>W</mtext></math><br /><br />For an adiabatic process, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#916;</mo><mtext>Q=0</mtext></math><br /><br /><math> <mrow> <mo>&#8756;</mo> </mrow> </math>&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>=</mo><mo>&#916;</mo><mtext>U</mtext><mo>+</mo><mo>&#916;</mo><mtext>W</mtext></math><br /><br />or&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#916;</mo><mtext>U</mtext><mo>=</mo><mo>-</mo><mo>&#916;</mo><mtext>W</mtext></math><br /><br />or&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">n</mi><msub><mtext>C</mtext><mtext>V</mtext></msub><mo>&#916;</mo><mtext>T</mtext><mo>=</mo><mo>-</mo><mo>&#916;</mo><mtext>W</mtext></math><br /><br />or&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext>C</mtext><mtext>V</mtext></msub><mo>=</mo><mfrac><mrow><mo>-</mo><mo>&#916;</mo><mtext>W</mtext></mrow><mrow><mi mathvariant=\"normal\">n</mi><mo>&#916;</mo><mtext>T</mtext></mrow></mfrac><mo>=</mo><mfrac><mrow><mo>-</mo><mfenced><mrow><mo>-</mo><mtext>146</mtext></mrow></mfenced><mo>&#215;</mo><msup><mtext>10</mtext><mn>3</mn></msup></mrow><mrow><mfenced><mrow><mn>1</mn><mo>&#215;</mo><msup><mtext>10</mtext><mn>3</mn></msup></mrow></mfenced><mo>&#215;</mo><mn>7</mn></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">v</mi></msub><mo>=</mo><mn>20</mn><mo>.</mo><mn>8</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi>mol</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br />For diatomic gas,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext>C</mtext><mtext>V</mtext></msub><mo>=</mo><mfrac><mn>5</mn><mn>2</mn></mfrac><mtext>R</mtext><mo>=</mo><mfrac><mn>5</mn><mn>2</mn></mfrac><mo>&#215;</mo><msup><mtext>8.3&#160;=&#160;20.8&#160;J&#160;mol</mtext><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mtext>&#160;K</mtext><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br />Hence the gas is diatomic.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863dcdb9111b50a560d", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "04", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two moles of an ideal&nbsp;monoatomic&nbsp;gas is<span style=\"font-size: 10.8333px;\"> </span>taken through a cycle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mi>C</mi><mi>A</mi></math>&nbsp;as shown in the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>-</mo><mi>T</mi></math>&nbsp;diagram. During the process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math>, the pressure and temperature of the gas vary such that <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mi>T</mi></math>&nbsp;= constant. If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>1</mn></msub><mo>=</mo><mn>300</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math>&nbsp;and the amount of heat released by the gas during the process&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>=</mo><mo>-</mo><mi>x</mi><mi>R</mi></math>, then the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>&nbsp;is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0007626_Ques1_1.jpg\" /><br />\r&nbsp;", "image": null}, "options": [], "correctValue": "2100", "solution": {"text": "<p>In the process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><msup><mi>V</mi><mi>γ</mi></msup></math> = constant<br /><br />Molar heat capacity,&nbsp;<math><mrow><mi>C</mi><mo>=</mo><mfrac linethickness=\"1\"><mi>R</mi><mrow><mi>γ</mi><mo>-</mo><mn>1</mn></mrow></mfrac><mo>+</mo><mfrac linethickness=\"1\"><mi>R</mi><mrow><mn>1</mn><mo>-</mo><mi>x</mi></mrow></mfrac></mrow></math></p><p>Here the process is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>p</mi><mn>2</mn></msup><mi>V</mi></math>&nbsp;= constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><msup><mi>V</mi><mfrac bevelled=\"true\"><mn>1</mn><mn>2</mn></mfrac></msup></math><sup> </sup>= constant</p><p>i.e,&nbsp;<math><mrow><mi>x</mi><mo>=</mo><mfrac linethickness=\"1\"><mn>1</mn><mn>2</mn></mfrac></mrow></math><br />&nbsp;<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>=</mo><mfrac><mi>R</mi><mrow><mfrac><mn>5</mn><mn>3</mn></mfrac><mo>-</mo><mn>1</mn></mrow></mfrac><mo>+</mo><mfrac><mi>R</mi><mrow><mn>1</mn><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></mfrac><mi>C</mi><mo>=</mo><mn>3</mn><mtext>.</mtext><mn>5</mn><mi>R</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Q</mi><mrow><mi mathvariant=\"normal\">A</mi><mo>→</mo><mi mathvariant=\"normal\">B</mi></mrow></msub><mo>=</mo><mi>n</mi><mi>C</mi><mi>Δ</mi><mi>T</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Q</mi><mrow><mi mathvariant=\"normal\">A</mi><mo>→</mo><mi mathvariant=\"normal\">B</mi></mrow></msub><mo>=</mo><mn>2</mn><mo>×</mo><mn>3</mn><mo>.</mo><mn>5</mn><mi>R</mi><mo>×</mo><mfenced><mrow><mn>300</mn><mo>-</mo><mn>600</mn></mrow></mfenced></math><br />&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Q</mi><mrow><mi mathvariant=\"normal\">A</mi><mo>→</mo><mi mathvariant=\"normal\">B</mi></mrow></msub><mo>=</mo><mo>-</mo><mn>2100</mn><mi>R</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863dbf6835010791f40", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "86", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A body takes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi>min</mi></math> to cool from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">℃</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">℃</mi></math>. If the temperature of the surroundings is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>25</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">℃</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>527</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">℃</mi></math> respectively. The final temperature of the body is", "image": null}, "options": [{"id": "CioCW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>48</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}, {"id": "fgUjK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>46</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}, {"id": "tapI9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>49</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}, {"id": "fVkvC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>42.85</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Newton's law<br /><br /><math><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">θ</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">θ</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mi>t</mi></mrow></mfrac><mo>=</mo><mi>K</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">θ</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">θ</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>2</mn></mrow></mfrac><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">θ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfenced></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mfrac><mrow><mn>60</mn><mo>-</mo><mn>50</mn></mrow><mrow><mn>10</mn></mrow></mfrac><mo>=</mo><mi>K</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>60</mn><mo>+</mo><mn>50</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>-</mo><mn>25</mn></mrow></mfenced></math> ....(i)<br /><br />Let <math><mi mathvariant=\"normal\">θ</mi></math> be the temperature after another 10 min<br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mfrac><mrow><mn>50</mn><mo>-</mo><mi mathvariant=\"normal\">θ</mi></mrow><mrow><mn>10</mn></mrow></mfrac><mo>=</mo><mi>K</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">θ</mi><mo>+</mo><mn>50</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>-</mo><mn>25</mn></mrow></mfenced></math> ....(ii)<br /><br />Dividing Eq.(i) by Eq. (ii), we get<br /><br /><math><mfrac><mrow><mn>10</mn></mrow><mrow><mn>50</mn><mo>-</mo><mi mathvariant=\"normal\">θ</mi></mrow></mfrac><mi>&nbsp;</mi><mo>=</mo><mi>&nbsp;</mi><mfrac><mrow><mn>30</mn><mo>×</mo><mn>2</mn></mrow><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mfrac><mi>&nbsp;</mi><mo>∴</mo><mi>&nbsp;</mi><mi mathvariant=\"normal\">θ</mi><mo>=</mo><mn>42.85&nbsp;</mn><mi mathvariant=\"normal\">℃</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863da641c24a61625d4", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "90", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The internal energy of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>n</mi><mn>1</mn></msub></math>&nbsp;mol of hydrogen of temperature&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> is equal to the internal energy of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>n</mi><mn>2</mn></msub></math>&nbsp;mol of helium at temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>T</mi></math>. What will be the value of the ratio&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>n</mi><mn>1</mn></msub><msub><mi>n</mi><mn>2</mn></msub></mfrac></math>?", "image": null}, "options": [], "correctValue": "1.2", "solution": {"text": "The internal energy of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math> moles of an ideal gas at temperature T is given by<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">U</mtext><mo>=</mo><mfrac><mrow><mi>f</mi><mo>&#8289;</mo></mrow><mn>2</mn></mfrac><mtext mathvariant=\"italic\">nRT</mtext></math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(<math> <mrow> <mi>f</mi><mo>&#8289;</mo> <mo>=</mo> </mrow> </math>&nbsp;degrees of freedom)<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>U</mi><mn>1</mn></msub><mo>=</mo><msub><mi>U</mi><mn>2</mn></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><msub><mo>&#8289;</mo><mn>1</mn></msub><msub><mi>n</mi><mn>1</mn></msub><msub><mi>T</mi><mn>1</mn></msub><mo>=</mo><mi>f</mi><msub><mo>&#8289;</mo><mn>2</mn></msub><msub><mi>n</mi><mn>2</mn></msub><msub><mi>T</mi><mn>2</mn></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;&#160;&#160;&#160;</mo><mfrac><msub><mi>n</mi><mn>1</mn></msub><msub><mi>n</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><mrow><mi>f</mi><msub><mo>&#8289;</mo><mn>2</mn></msub><msub><mi>T</mi><mn>2</mn></msub></mrow><mrow><mi>f</mi><msub><mo>&#8289;</mo><mn>1</mn></msub><msub><mi>T</mi><mn>1</mn></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn><mo>&#215;</mo><mn>2</mn></mrow><mrow><mn>5</mn><mo>&#215;</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mn>6</mn><mn>5</mn></mfrac></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>1</mn><mo>.</mo><mn>2</mn></math><br /><br />Here, <math> <mrow> <msub> <mrow> <mi>f</mi><mo>&#8289;</mo> </mrow> <mn>2</mn> </msub> </mrow> </math> = degrees of freedom of He = 3<br /><br />and, <math> <mrow> <msub> <mrow> <mi>f</mi><mo>&#8289;</mo> </mrow> <mn>1</mn> </msub> </mrow> </math>&nbsp; = degrees of freedom of H<sub>2</sub> = 5", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d3e0c9aa5e0c4e0c", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "33", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In an energy recycling process, <math> <mrow> <mtext>X</mtext><mtext> </mtext><mtext>g</mtext></mrow> </math> of steam at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100&nbsp;</mn><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> becomes water at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100&nbsp;</mn><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> which converts <math> <mrow> <mtext>Y</mtext><mtext> </mtext><mtext>g</mtext></mrow> </math> of ice at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0&nbsp;</mn><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> into water at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100&nbsp;</mn><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. The ratio of <math><mfrac><mrow><mi mathvariant=\"normal\">X</mi></mrow><mrow><mi mathvariant=\"normal\">Y</mi></mrow></mfrac></math> will be (specific heat of water <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>4200</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi><mo>&nbsp;</mo><msup><mi>kg</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math>,&nbsp;specific latent heat of fusion <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>3.36</mn><mo>×</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi><mo>&nbsp;</mo><msup><mi>kg</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>,&nbsp;specific latent heat of vaporization <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>22.68</mn><mo>×</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi><mo>&nbsp;</mo><msup><mi>kg</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>)", "image": null}, "options": [{"i orrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>=</mo><msub><mi>C</mi><mi>v</mi></msub><mo>+</mo><msup><mi>W</mi><mo>'</mo></msup></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>W</mi><mo>'</mo><mo>=</mo><mfrac><mrow><mi>d</mi><mi>W</mi></mrow><mrow><mi>n</mi><mi>d</mi><mi>T</mi></mrow></mfrac></math>&nbsp; &nbsp; &nbsp;(where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>'</mo></math> is the work done by the gas per unit mole per unit rise in temperature)<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>W</mi><mo>'</mo></msup><mo>=</mo><mi>&#945;</mi><mi>T</mi><mo>-</mo><msub><mi>C</mi><mi>v</mi></msub><mo>=</mo><mi>&#945;</mi><mi>T</mi><mo>-</mo><mfenced><mrow><mn>5</mn><mi>R</mi><mo>/</mo><mn>2</mn></mrow></mfenced></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#916;</mo><mi>W</mi><mo>=</mo><mo>&#8747;&#160;</mo><msup><mi>W</mi><mo>'</mo></msup><mi>d</mi><mi>T</mi><mo>=</mo><munderover><mo>&#8747;</mo><msub><mi>T</mi><mn>0</mn></msub><mrow><mn>2</mn><msub><mi>T</mi><mn>0</mn></msub></mrow></munderover><mfenced><mrow><mi>&#945;</mi><mi>T</mi><mo>-</mo><mfrac><mrow><mn>5</mn><mi>R</mi></mrow><mn>2</mn></mfrac></mrow></mfenced><mi>d</mi><mi>T</mi></math><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced><mrow><mn>3</mn><mi>&#945;</mi><msub><mi>T</mi><mn>0</mn></msub><mo>-</mo><mn>5</mn><mi>R</mi></mrow></mfenced><mfrac><msub><mi>T</mi><mn>0</mn></msub><mn>2</mn></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863aef58a0b12be0c22", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "73", "isVisible": true}], "
