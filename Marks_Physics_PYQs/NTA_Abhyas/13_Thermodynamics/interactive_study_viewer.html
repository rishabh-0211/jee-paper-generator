//www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>375&#160;</mn><mi mathvariant=\"normal\">K</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mn>2.125</mn><mi>&#160;</mi><mi>atm</mi></math>", "image": null, "isCorrect": false}, {"id": "DKgrm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>375&#160;</mn><mi mathvariant=\"normal\">K</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mn>1.125</mn><mi mathvariant=\"normal\">&#160;</mi><mi>atm</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let the crossectional area of the cylinder is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> . Initially<br /><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/uqzlvnnpjsnycxiiomassofzkdwwgkwoorawixzuylyztmzswr.jpeg\" /><br /><br />Representing a closed cylinder<br /><br />separated by a piston<br /><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/mreuldkhvhhcghpryhmwovwolyzeovsrsfzltuwktvhovaoxqt.jpeg\" /><br /><br />The piston is shifted by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mi mathvariant=\"normal\">&#160;</mi><mi>cm</mi></math> in the cylinder<br /><br />For 1, <math><mfrac><mrow><msub><mrow><mi>p</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mi>&#160;</mi><mo>&#8658;</mo><mi>&#160;</mi><mfrac><mrow><mi>p</mi><mi>V</mi></mrow><mrow><mn>300</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub><mfenced separators=\"|\"><mrow><mi>V</mi><mo>+</mo><mi>A</mi><mi>x</mi></mrow></mfenced></mrow><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math> .....(i)<br /><br />For 2, <math><msub><mrow><mi>p</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msub><mi>&#160;</mi><mo>&#8658;</mo><mi>&#160;</mi><mi>p</mi><mi>V</mi><mo>=</mo><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub><mfenced separators=\"|\"><mrow><mi>V</mi><mo>-</mo><mi>A</mi><mi>x</mi></mrow></mfenced></math><br /><br /><math><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><mi>p</mi><mi>V</mi></mrow><mrow><mfenced separators=\"|\"><mrow><mi>V</mi><mo>-</mo><mi>A</mi><mi>x</mi></mrow></mfenced></mrow></mfrac></math> ....(ii)<br /><br />From Equations (i) and (ii),<br /><br /><math><mfrac><mrow><mi>p</mi><mi>V</mi></mrow><mrow><mn>300</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>p</mi><mi>V</mi></mrow><mrow><mfenced separators=\"|\"><mrow><mi>V</mi><mo>-</mo><mi>A</mi><mi>x</mi></mrow></mfenced></mrow></mfrac><mo>&#8901;</mo><mfrac><mrow><mfenced separators=\"|\"><mrow><mi>V</mi><mo>+</mo><mi>A</mi><mi>x</mi></mrow></mfenced></mrow><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math><br /><br /><math><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><mi>V</mi><mo>+</mo><mi>A</mi><mi>x</mi></mrow><mrow><mi>V</mi><mo>-</mo><mi>A</mi><mi>x</mi></mrow></mfrac><mn>300</mn><mo>=</mo><mfrac><mrow><mi>A</mi><mn>45</mn><mo>+A5</mo></mrow><mrow><mi>A</mi><mn>45</mn><mo>-A5</mo></mrow></mfrac><mo>&#215;</mo><mn>300</mn><mo>=</mo><mfrac><mrow><mn>50</mn></mrow><mrow><mn>40</mn></mrow></mfrac><mn>300</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mn>375</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math><br /><br />Putting <math><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub></math> in Equation (i),<br /><br /><math><msub><mrow><mi>P</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><mi>P</mi><mi>V</mi></mrow><mrow><mfenced separators=\"|\"><mrow><mi>V</mi><mo>+</mo><mi>A</mi><mi>x</mi></mrow></mfenced></mrow></mfrac><mo>&#215;</mo><mfrac><mrow><mn>375</mn></mrow><mrow><mn>300</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn><mo>&#215;</mo><mi>A</mi><mo>&#215;</mo><mn>45</mn></mrow><mrow><mi>A</mi><mfenced separators=\"|\"><mrow><mn>450</mn><mo>+</mo><mn>5</mn></mrow></mfenced></mrow></mfrac><mo>&#215;</mo><mfrac><mrow><mn>375</mn></mrow><mrow><mn>300</mn></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>1</mn><mo>.125</mo><mi mathvariant=\"normal\">&#160;</mi><mi>atm</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e8532b05ae176a92", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "80", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The specific heats of an ideal gas at constant pressure and constant volume are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>525</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>kg</mi><mo>°</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>315</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">J</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi>kg</mi><mo>°</mo><mi mathvariant=\"normal\">&nbsp;</mi><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> respectively. Its density at NTP is", "image": null}, "options": [{"id": "ViMwy", "text": "<math><mn>0.64</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "JQrns", "text": "<math><mn>1.20</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "oGK0T", "text": "<math><mn>1.75</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "YQ2GG", "text": "<math><mn>2.62</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If <math><mi>M</mi></math> is molecular mass of the gas, then from<br /><br /><math><mi>M</mi><mfenced separators=\"|\"><mrow><msub><mrow><mi>C</mi></mrow><mrow><mi>p</mi></mrow></msub><mo>-</mo><msub><mrow><mi>C</mi></mrow><mrow><mi>v</mi></mrow></msub></mrow></mfenced><mo>=</mo><mi>R</mi></math><br /><br /><math><mi>M</mi><mo>=</mo><mfrac><mrow><mn>8.31</mn></mrow><mrow><mn>210</mn></mrow></mfrac><mo>=</mo><mn>0.0392</mn></math><br /><br />If <math><mi mathvariant=\"normal\">ρ</mi></math> is density of the gas at NTP, then mass of 1 <math><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>3</mn></mrow></msup></math>of gas at NTP<math><mo>=</mo><mi mathvariant=\"normal\">ρ</mi></math> kg<br /><br /><math><mo>∴</mo></math> Mass of 22.4 L <math><mo>(</mo><mo>=</mo><mn>22.4</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>3</mn></mrow></msup><mo>)</mo></math> of gas at NTP <math><mo>=</mo><mi mathvariant=\"normal\">ρ</mi><mo>×</mo><mn>22.4</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><mi mathvariant=\"normal\">&nbsp;</mi></math>kg, which is the molecular mass of the gas<br /><br /><math><mo>∴</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">ρ</mi><mo>×</mo><mn>22.4</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>=</mo><mn>0.0392</mn></math><br /><br /><math><mi mathvariant=\"normal\">ρ</mi><mo>=</mo><mfrac><mrow><mn>0.0392</mn></mrow><mrow><mn>22.4</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></mrow></mfrac><mo>=</mo><mn>1.75</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e54c31a4378f3e6c", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "29", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two identical calorimeters&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> contain an equal quantity of water at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. A <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">g</mi></math> piece of metal <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math> of specific heat <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0.2</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">l</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">g</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&nbsp;</mo><mo>°</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> is dropped into <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">g</mi></math> piece of metal <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Y</mi></math>&nbsp;is dropped into <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>. The equilibrium temperature in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>22</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> and that in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>23</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. The initial temperature of both the metals was&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. The specific heat of metal <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Y</mi></math>&nbsp;(in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">l</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">g</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&nbsp;</mo><mo>°</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>) is", "image": null}, "options": [{"id": "LZ7p5", "text": "<math><mfrac><mrow><mn>27</mn></mrow><mrow><mn>85</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "cHg2Z", "text": "<math><mfrac><mrow><mn>54</mn></mrow><mrow><mn>85</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "YgeKi", "text": "<math><mfrac><mrow><mn>81</mn></mrow><mrow><mn>85</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "KMF8t", "text": "<math><mn>0.4</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">X</mi><mo>:</mo><mn>5</mn><mo>×</mo><mn>0.2</mn><mo>×</mo><mo>(</mo><mn>40</mn><mo>-</mo><mn>22</mn><mo>)</mo></math><br /><br /><math><mo>=</mo><mi mathvariant=\"normal\">m</mi><mo>×</mo><mi mathvariant=\"normal\">C</mi><mo>×</mo><mfenced separators=\"|\"><mrow><mn>22</mn><mo>-</mo><mn>20</mn></mrow></mfenced></math><br /><br /><math><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Y</mi><mo>:</mo><mn>5</mn><mo>×</mo><mi mathvariant=\"normal\">C</mi><mo>×</mo><mo>(</mo><mn>40</mn><mo>-</mo><mn>23</mn><mo>)</mo></math><br /><br /><math><mo>=</mo><mi mathvariant=\"normal\">m</mi><mo>×</mo><mi mathvariant=\"normal\">C</mi><mo>×</mo><mo>(</mo><mn>23</mn><mo>-</mo><mn>20</mn><mo>)</mo></math><br /><br /><math><mo>⇒</mo><mi mathvariant=\"normal\">C</mi><mo>=</mo><mfrac><mrow><mn>27</mn></mrow><mrow><mn>85</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863dd76bfd0571ea8f4", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "86", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The diagram shows a horizontal cylindrical container of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&nbsp;</mo><mi>cm</mi></math>, which is partitioned by a tight-fitting separator. The separator is diathermic but conducts heat very slowly. Initially, the separator is in the state shown in the diagram. The temperature of the left part of the cylinder is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math> and that on the right part is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>400</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math>. Initially the separator is in equilibrium. As heat is conducted from the right to left part, separator displaces to the right. Find the displacement of separator (in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>cm</mi></math>) after a long when gases on the two parts of the cylinder are in thermal equilibrium.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0030804_Question.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 200px; height: 121px;\" />", "image": null}, "options": [], "correctValue": "10", "solution": {"text": "It is given that initially, the separator is in equilibrium; thus pressure on both sides of the gas is equal say, it is P<sub>i</sub>. If A be the area of cross-section of cylinder, number of moles of gas in the left and right part, n<sub>1</sub> and n<sub>2</sub>, can be given as<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>n</mi><mn>1</mn></msub><mo>=</mo><mfrac><mrow><msub><mi>P</mi><mtext>i</mtext></msub><mfenced><mrow><mn>1</mn><mn>0</mn><mtext>A</mtext></mrow></mfenced></mrow><mrow><mi>R</mi><mfenced><mrow><mn>1</mn><mn>0</mn><mn>0</mn></mrow></mfenced></mrow></mfrac></math><br /><br />and&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>n</mi><mn>2</mn></msub><mo>=</mo><mfrac><mrow><msub><mi>P</mi><mtext>i</mtext></msub><mfenced><mrow><mn>2</mn><mn>0</mn><mtext>A</mtext></mrow></mfenced></mrow><mrow><mi>R</mi><mfenced><mrow><mn>4</mn><mn>0</mn><mn>0</mn></mrow></mfenced></mrow></mfrac></math><br /><br />Finally, if the separator is displaced to right by a distance x,<br />we have<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>n</mi><mn>1</mn></msub><mo>=</mo><mfrac><mrow><msub><mtext mathvariant=\"italic\">P</mtext><mrow><mi>f</mi><mo>⁡</mo><mtext>i</mtext></mrow></msub><mfenced><mrow><mn>1</mn><mn>0</mn><mo>+</mo><mtext mathvariant=\"italic\">x</mtext></mrow></mfenced><mtext mathvariant=\"italic\">A</mtext></mrow><msub><mtext mathvariant=\"italic\">RT</mtext><mrow><mi>f</mi><mo>⁡</mo></mrow></msub></mfrac></math><br /><br />and&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">n</mtext><mn>2</mn></msub><mo>=</mo><mfrac><mrow><msub><mtext mathvariant=\"italic\">P</mtext><mrow><mi>f</mi><mo>⁡</mo></mrow></msub><mfenced><mrow><mn>2</mn><mn>0</mn><mo>-</mo><mtext mathvariant=\"italic\">x</mtext></mrow></mfenced><mtext mathvariant=\"italic\">A</mtext></mrow><msub><mtext mathvariant=\"italic\">RT</mtext><mrow><mi>f</mi><mo>⁡</mo></mrow></msub></mfrac></math><br /><br />Here <math> <mrow> <msub> <mtext>P</mtext> <mrow> <mi>f</mi><mo>⁡</mo> </mrow> </msub> </mrow> </math>&nbsp;and <math> <mrow> <msub> <mtext>T</mtext> <mrow> <mi>f</mi><mo>⁡</mo> </mrow> </msub> </mrow> </math>&nbsp;are the final pressure and temperature on both sides after a long time.<br />Now if we equate the ratio of moles n<sub>1</sub>/n<sub>2</sub> in initial and final states, we get<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mtext mathvariant=\"italic\">n</mtext><mn>1</mn></msub><msub><mtext mathvariant=\"italic\">n</mtext><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><mfenced><mrow><mn>1</mn><mn>0</mn><mtext mathvariant=\"italic\">A</mtext><mo>/</mo><mn>1</mn><mn>0</mn><mn>0</mn></mrow></mfenced><mfenced><mrow><mn>2</mn><mn>0</mn><mtext mathvariant=\"italic\">A</mtext><mo>/</mo><mn>4</mn><mn>0</mn><mn>0</mn></mrow></mfenced></mfrac><mo>=</mo><mfrac><mrow><mfenced><mrow><mn>1</mn><mn>0</mn><mo>+</mo><mtext mathvariant=\"italic\">x</mtext></mrow></mfenced><mtext mathvariant=\"italic\">A</mtext></mrow><mrow><mfenced><mrow><mn>2</mn><mn>0</mn><mo>-</mo><mtext mathvariant=\"italic\">x</mtext></mrow></mfenced><mtext mathvariant=\"italic\">A</mtext></mrow></mfrac></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mfenced><mrow><mn>2</mn><mn>0</mn><mo>-</mo><mtext mathvariant=\"italic\">x</mtext></mrow></mfenced><mo>=</mo><mn>1</mn><mn>0</mn><mo>+</mo><mtext mathvariant=\"italic\">x</mtext></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">x</mtext><mo>=</mo><mn>10&nbsp;</mn><mo>cm</mo></math><br /><br />Thus in the final state when gases in both parts are in thermal equilibrium, the piston is displaced 10 cm rightward from its initial position.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863da4da7510579f57f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "56", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Find the minimum attainable pressure of an ideal gas in process <math> <mrow> <mi>T</mi><mo>=</mo><msub> <mi>T</mi> <mn>0</mn> </msub> <mo>+</mo><mi>α</mi><msup> <mi>V</mi> <mn>2</mn></msup></mrow></math>, where <math> <mrow> <msub> <mi>T</mi> <mn>0</mn> </msub> </mrow> </math> and <math> <mi>α</mi> </math> are positive constants and <math> <mi>V</mi> </math> is the volume of one mole of gas.&nbsp;", "image": null}, "options": [{"id": "raOk9", "text": "<math> <mrow> <mn>2</mn><mi>R</mi><msqrt> <mrow> <mi>α</mi><msub> <mi>T</mi> <mn>0</mn> </msub> </mrow> </msqrt> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "zSAnE", "text": "<math> <mrow>  <mn>3</mn><mi>R</mi><msqrt>   <mrow>    <mi>&#x03B1;</mi><msub>     <mi>T</mi>     <mn>0</mn>    </msub>    </mrow>  </msqrt>  </mrow></math>", "image": null, "isCorrect": false}, {"id": "V1LHD", "text": "<math> <mrow>  <mn>3</mn><mi>R</mi></mrow></math>", "image": null, "isCorrect": false}, {"id": "RgFEr", "text": "<math> <mrow> <mn>3</mn><mi>R</mi><msqrt> <mrow> <mfrac> <mrow> <mi>α</mi><msub> <mi>T</mi> <mn>0</mn> </msub> </mrow> <mn>2</mn> </mfrac> </mrow> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given,<br /><br /><math> <mrow> <mi>T</mi><mo>=</mo><msub> <mi>T</mi> <mn>0</mn> </msub> <mo>+</mo><mi>α</mi><msup> <mi>V</mi> <mn>2</mn> </msup> </mrow> </math>...(i)<br /><br />For 1 mol of a gas, <math> <mrow> <mi>P</mi><mi>V</mi><mo>=</mo><mi>R</mi><mi>T</mi></mrow> </math><br /><br />of <math> <mrow> <mi>V</mi><mo>=</mo><mfrac> <mrow> <mi>R</mi><mi>T</mi></mrow> <mi>P</mi> </mfrac> </mrow> </math><br /><br />Substituting this value in Eq. (i), we get<br /><br /><math> <mrow> <mi>T</mi><mo>=</mo><msub> <mi>T</mi> <mn>0</mn> </msub> <mo>+</mo><mi>α</mi><msup> <mrow> <mfenced> <mrow> <mfrac> <mrow> <mi>R</mi><mi>T</mi></mrow> <mi>P</mi> </mfrac> </mrow> </mfenced></mrow> <mn>2</mn> </msup> <mo>=</mo><msub> <mi>T</mi> <mn>0</mn> </msub> <mo>+</mo><mi>α</mi><mfrac> <mrow> <msup> <mi>R</mi> <mn>2</mn> </msup> <msup> <mi>T</mi> <mn>2</mn> </msup> </mrow> <mrow> <msup> <mi>P</mi> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </math><br /><br />or <math> <mrow> <mi>T</mi><msup> <mi>P</mi> <mn>2</mn> </msup> <mo>=</mo><msub> <mi>T</mi> <mn>0</mn> </msub> <msup> <mi>P</mi> <mn>2</mn> </msup> <mo>+</mo><mi>α</mi><msup> <mi>R</mi> <mn>2</mn> </msup> <msup> <mi>T</mi> <mn>2</mn> </msup> </mrow> </math><br /><br />or <math> <mrow> <mi>P</mi><mo>=</mo><msqrt> <mi>α</mi> </msqrt> <mi>R</mi><mi>T</mi><msup> <mrow> <mfenced> <mrow> <mi>T</mi><mo>−</mo><msub> <mi>T</mi> <mn>0</mn> </msub> </mrow> </mfenced></mrow> <mrow> <mo>−</mo><mn>1</mn><mo>/</mo><mn>2</mn></mrow> </msup> </mrow> </math> ...(ii)<br /><br />After differentiating, we get<br /><br /><math> <mrow> <mfrac> <mrow> <mi>d</mi><mi>P</mi></mrow> <mrow> <mi>d</mi><mi>T</mi></mrow> </mfrac> <mo>=</mo><msqrt> <mi>α</mi> </msqrt> <mi>R</mi><mfenced close=\"]\" open=\"[\"> <mrow> <msup> <mrow> <mfenced> <mrow> <mi>T</mi><mo>−</mo><msub> <mi>T</mi> <mn>0</mn> </msub> </mrow> </mfenced></mrow> <mrow> <mo>−</mo><mn>1</mn><mo>/</mo><mn>2</mn></mrow> </msup> <mo>−</mo><mfrac> <mn>1</mn> <mn>2</mn> </mfrac> <mi>T</mi><msup> <mrow> <mfenced> <mrow> <mi>T</mi><mo>−</mo><msub> <mi>T</mi> <mn>0</mn> </msub> </mrow> </mfenced></mrow> <mrow> <mo>−</mo><mn>3</mn><mo>/</mo><mn>2</mn></mrow> </msup> </mrow> </mfenced></mrow> </math><br /><br />For minimum pressure,<br /><br /><math> <mrow> <mfrac> <mrow> <mi>d</mi><mi>P</mi></mrow> <mrow> <mi>d</mi><mi>T</mi></mrow> </mfrac> <mo>=</mo><mn>0</mn></mrow> </math><br /><br /><math> <mrow> <mo>∴&nbsp;&nbsp;&nbsp;&nbsp;</mo> <mn>0</mn> <mo>=</mo> <msqrt> <mi>α</mi> </msqrt> <mo>R</mo> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>T</mtext> <mo>-</mo> <msub> <mtext>T</mtext> <mn>0</mn> </msub> </mrow> </mfenced> </mrow> <mrow> <mo>-</mo> <mn>1</mn> <mo>/</mo> <mn>2</mn> </mrow> </msup> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>T</mtext> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>T</mtext> <mo>-</mo> <msub> <mtext>T</mtext> <mn>0</mn> </msub> </mrow> </mfenced> </mrow> <mrow> <mo>-</mo> <mn>3</mn> <mo>/</mo> <mn>2</mn> </mrow> </msup> </mrow> </mfenced> </mrow> </math><br /><br />After solving, T = 2T<sub>0</sub><br /><br />From Eq. (ii),<br /><br /><math> <mrow> <msub> <mi>P</mi> <mrow> <mi>min</mi></mrow> </msub> <mo>=</mo><msqrt> <mi>α</mi> </msqrt> <mi>R</mi><mn>2</mn><msub> <mi>T</mi> <mn>0</mn> </msub> <msup> <mrow> <mfenced> <mrow> <mn>2</mn><msub> <mi>T</mi> <mn>0</mn> </msub> <mo>−</mo><msub> <mi>T</mi> <mn>0</mn> </msub> </mrow> </mfenced></mrow> <mrow> <mo>−</mo><mn>1</mn><mo>/</mo><mn>2</mn></mrow> </msup> </mrow> </math><br /><br /><math> <mrow> <mo>=</mo><mn>2</mn><mi>R</mi><msqrt> <mrow> <mi>α</mi><msub> <mi>T</mi> <mn>0</mn> </msub> </mrow> </msqrt> </mrow> </math><br /><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0030784_Ans.jpg\" style=\"width: 200px; height: 154px;\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863da143d5c6fe403d3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "31", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the given figure the area of the frictionless piston is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math> and it is being held in equilibrium by an external force. Now the external force is slowly removed and heat is supplied to the gas due to which the piston displaces by <math><mfrac><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math> where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">L</mi><mo>=</mo><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>. The natural length of the ideal springs is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">L</mi><mo>=</mo><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>. Spring constant is given as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">K</mi><mo>=</mo><mn>100</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. The pressure of the gas in the final situation is<br />\r<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image15-3f4e6aad-3ad7-4a0a-9a1e-9dc7e4790180.jpg\" />", "image": null}, "options": [{"id": "pyNVb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mi mathvariant=\"normal\">&#xA0;</mi><mi mathvariant=\"normal\">N</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><mi mathvariant=\"normal\">&#xA0;</mi></math>", "image": null, "isCorrect": false}, {"id": "o52I2", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><mi mathvariant=\"normal\">&nbsp;</mi></math>", "image": null, "isCorrect": true}, {"id": "bllEf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mi mathvariant=\"normal\">&#xA0;</mi><mi mathvariant=\"normal\">N</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><mi mathvariant=\"normal\">&#xA0;</mi></math>", "image": null, "isCorrect": false}, {"id": "qwmBe", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>400</mn><mi mathvariant=\"normal\">&#xA0;</mi><mi mathvariant=\"normal\">N</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><mi mathvariant=\"normal\">&#xA0;</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image16-c3d0b96f-5d32-48fa-9427-33d6a44b15be.jpg\" /><br /><br />In the case of equilibrium, net force on the piston becomes zero. So,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML empted", "lastPracticed": null}, {"_id": "6151e863c68aa327461a0b75", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "51", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">g</mi></math> of ice at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> is added to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">g</mi></math> of water initially at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>70</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> in a calorimeter of unknown water equivalent <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi></math>. If the final temperature of the mixture is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>, then the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi></math>&nbsp;is [Take latent heat of fusion of ice&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mi mathvariant=\"normal\">f</mi></msub><mo>=</mo><mn>80</mn><mo>&nbsp;</mo><mi>cal</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">g</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>&nbsp;and&nbsp;specific heat capacity of water&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>s</mi><mo>=</mo><mn>1</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi>cal</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">g</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&nbsp;</mo><mo>°</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>]", "image": null}, "options": [{"id": "z04Jg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>70</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">g</mi></math>", "image": null, "isCorrect": false}, {"id": "nZyr0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>80</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">g</mi></math>", "image": null, "isCorrect": false}, {"id": "8fTtn", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">g</mi></math>", "image": null, "isCorrect": true}, {"id": "4s1Ha", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">g</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The principle of calorimetry states that for an isolated system,</p><p>The heat gained by the cold body (Here it is ice)&nbsp;= The heat lost by the hot body (Here it is water + calorimeter)</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mi>ice</mi></msub><msub><mi>L</mi><mi mathvariant=\"normal\">f</mi></msub><mo>+</mo><msub><mi>m</mi><mi>ice</mi></msub><mi>s</mi><mo>&#8710;</mo><mi>T</mi><mo>=</mo><mfenced><mrow><msub><mi>m</mi><mi>water</mi></msub><mo>+</mo><mi>W</mi></mrow></mfenced><mi>s</mi><mo>&#8710;</mo><mi>T</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>60</mn><mo>&#215;</mo><mn>80</mn><mo>+</mo><mn>60</mn><mo>&#215;</mo><mn>1</mn><mo>&#215;</mo><mn>40</mn><mo>=</mo><mfenced separators=\"|\"><mrow><mn>200</mn><mo>+</mo><mi>W</mi></mrow></mfenced><mo>&#215;</mo><mn>1</mn><mo>&#215;</mo><mn>30</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>480</mn><mo>+</mo><mn>240</mn><mo>=</mo><mn>600</mn><mo>+</mo><mn>3</mn><mi>W</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>W</mi><mo>=</mo><mn>40</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863bf98f1b0cd963a4f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "32", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>If masses of all the molecules of a gas are halved and their speeds are doubled, then the ratio of initial and final pressures is</p>\r", "image": null}, "options": [{"id": "0IsQu", "text": "<math><mn>1</mn><mo>:</mo><mn>2</mn></math>", "image": null, "isCorrect": true}, {"id": "PscwK", "text": "<math><mn>2</mn><mo>:</mo><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "ZEUYz", "text": "<math><mn>4</mn><mo>:</mo><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "ff1E0", "text": "<math><mn>1</mn><mo>:</mo><mn>4</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using the relation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">p</mi><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mfrac><msup><mi>mnv</mi><mn>2</mn></msup><mi mathvariant=\"normal\">V</mi></mfrac></math> ...(i)<br /><br />and also <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">&#8242;</mi></msup><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mfrac><mrow><mfrac><mi mathvariant=\"normal\">m</mi><mn>2</mn></mfrac><mi mathvariant=\"normal\">n</mi><msup><mfenced separators=\"|\"><mrow><mn>2</mn><mi mathvariant=\"normal\">v</mi></mrow></mfenced><mn>2</mn></msup></mrow><mi mathvariant=\"normal\">V</mi></mfrac></math> ...(ii)<br /><br />Dividing Eq.(ii) by Eq. (i), we get<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">&#8242;</mi></mrow><mi mathvariant=\"normal\">p</mi></mfrac><mo>=</mo><mn>2</mn></math><br /><br />So, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">p</mi><mo>:</mo><msup><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">&#8242;</mi></msup><mo>=</mo><mn>1</mn><mo>:</mo><mn>2</mn></math><br /><br />The ratio of initial and final pressures is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>:</mo><mn>2</mn></math>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ba734676bf4ced59", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "51", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Initially, the air in an open vessel is maintained at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. Later on, the&nbsp;vessel is heated to a temperature&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math>, so that one-fourth mass of air escapes from the vessel. If the volume of the vessel remains constant during heating, the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> is", "image": null}, "options": [{"id": "iuKRl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>80</mn><mo>&#xA0;</mo><mo>&#xB0;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}, {"id": "jo6ON", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>444</mn><mo>&#xA0;</mo><mo>&#xB0;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}, {"id": "Gd3VQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>333</mn><mo>&#xA0;</mo><mo>&#xB0;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}, {"id": "Pv09w", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>171</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>Since it is an open vessel of constant volume, the pressure and volume of the gas remain constant but the number of moles and the temperature changes.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>V</mi><mo>=</mo><msub><mi>n</mi><mn>1</mn></msub><mi>R</mi><msub><mi>T</mi><mn>1</mn></msub><mo>=</mo><msub><mi>n</mi><mn>2</mn></msub><mi>R</mi><msub><mi>T</mi><mn>2</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><msub><mi>T</mi><mn>2</mn></msub><msub><mi>T</mi><mn>1</mn></msub></mfrac><mo>=</mo><mfrac><msub><mi>n</mi><mn>1</mn></msub><msub><mi>n</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><mn>1</mn><mstyle displaystyle=\"true\"><mfrac bevelled=\"true\"><mn>3</mn><mn>4</mn></mfrac></mstyle></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><msub><mi>T</mi><mn>1</mn></msub><mo>=</mo><mfrac><mn>4</mn><mstyle displaystyle=\"true\"><mn>3</mn></mstyle></mfrac><mo>×</mo><mfenced><mrow><mn>60</mn><mo>+</mo><mn>273</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mn>444</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi><mo>≡</mo><mn>171</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["d i>R</mi> <mn>2</mn> </msup> <msup> <mi>T</mi> <mn>2</mn> </msup> </mrow> </math><br /><br />or <math> <mrow> <mi>P</mi><mo>=</mo><msqrt> <mi>α</mi> </msqrt> <mi>R</mi><mi>T</mi><msup> <mrow> <mfenced> <mrow> <mi>T</mi><mo>−</mo><msub> <mi>T</mi> <mn>0</mn> </msub> </mrow> </mfenced></mrow> <mrow> <mo>−</mo><mn>1</mn><mo>/</mo><mn>2</mn></mrow> </msup> </mrow> </math> ...(ii)<br /><br />After differentiating, we get<br /><br /><math> <mrow> <mfrac> <mrow> <mi>d</mi><mi>P</mi></mrow> <mrow> <mi>d</mi><mi>T</mi></mrow> </mfrac> <mo>=</mo><msqrt> <mi>α</mi> </msqrt> <mi>R</mi><mfenced close=\"]\" open=\"[\"> <mrow> <msup> <mrow> <mfenced> <mrow> <mi>T</mi><mo>−</mo><msub> <mi>T</mi> <mn>0</mn> </msub> </mrow> </mfenced></mrow> <mrow> <mo>−</mo><mn>1</mn><mo>/</mo><mn>2</mn></mrow> </msup> <mo>−</mo><mfrac> <mn>1</mn> <mn>2</mn> </mfrac> <mi>T</mi><msup> <mrow> <mfenced> <mrow> <mi>T</mi><mo>−</mo><msub> <mi>T</mi> <mn>0</mn> </msub> </mrow> </mfenced></mrow> <mrow> <mo>−</mo><mn>3</mn><mo>/</mo><mn>2</mn></mrow> </msup> </mrow> </mfenced></mrow> </math><br /><br />For minimum pressure,<br /><br /><math> <mrow> <mfrac> <mrow> <mi>d</mi><mi>P</mi></mrow> <mrow> <mi>d</mi><mi>T</mi></mrow> </mfrac> <mo>=</mo><mn>0</mn></mrow> </math><br /><br /><math> <mrow> <mo>∴&nbsp;&nbsp;&nbsp;&nbsp;</mo> <mn>0</mn> <mo>=</mo> <msqrt> <mi>α</mi> </msqrt> <mo>R</mo> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>T</mtext> <mo>-</mo> <msub> <mtext>T</mtext> <mn>0</mn> </msub> </mrow> </mfenced> </mrow> <mrow> <mo>-</mo> <mn>1</mn> <mo>/</mo> <mn>2</mn> </mrow> </msup> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>T</mtext> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>T</mtext> <mo>-</mo> <msub> <mtext>T</mtext> <mn>0</mn> </msub> </mrow> </mfenced> </mrow> <mrow> <mo>-</mo> <mn>3</mn> <mo>/</mo> <mn>2</mn> </mrow> </msup> </mrow> </mfenced> </mrow> </math><br /><br />After solving, T = 2T<sub>0</sub><br /><br />From Eq. (ii),<br /><br /><math> <mrow> <msub> <mi>P</mi> <mrow> <mi>min</mi></mrow> </msub> <mo>=</mo><msqrt> <mi>α</mi> </msqrt> <mi>R</mi><mn>2</mn><msub> <mi>T</mi> <mn>0</mn> </msub> <msup> <mrow> <mfenced> <mrow> <mn>2</mn><msub> <mi>T</mi> <mn>0</mn> </msub> <mo>−</mo><msub> <mi>T</mi> <mn>0</mn> </msub> </mrow> </mfenced></mrow> <mrow> <mo>−</mo><mn>1</mn><mo>/</mo><mn>2</mn></mrow> </msup> </mrow> </math><br /><br /><math> <mrow> <mo>=</mo><mn>2</mn><mi>R</mi><msqrt> <mrow> <mi>α</mi><msub> <mi>T</mi> <mn>0</mn> </msub> </mrow> </msqrt> </mrow> </math><br /><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0030784_Ans.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 200px; height: 154px;\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638ce54329815885f1", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "91", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The temperature of equal masses of three different liquids A, B and C are <math><msup><mrow><mn>12</mn></mrow><mrow><mi>&nbsp;o</mi></mrow></msup><mn>C</mn><mo>,</mo><mi>&nbsp;</mi><msup><mrow><mn>19</mn></mrow><mrow><mi>&nbsp;o</mi></mrow></msup><mn>C</mn></math> and <math><msup><mrow><mn>28</mn></mrow><mrow><mi>&nbsp;o</mi></mrow></msup><mn>C</mn></math> respectively. The temperature when A and B are mixed is <math><msup><mrow><mn>16</mn></mrow><mrow><mi>&nbsp;o</mi></mrow></msup><mn>C</mn></math> and when B and C are mixed is <math><msup><mrow><mn>23</mn></mrow><mrow><mi>&nbsp;o</mi></mrow></msup><mn>C</mn></math>. The temperature when A and C are mixed is", "image": null}, "options": [{"id": "CoozR", "text": "<math><msup><mrow><mn>18.2</mn></mrow><mrow><mi>&nbsp;o</mi></mrow></msup><mn>C</mn></math>", "image": null, "isCorrect": false}, {"id": "Cgkn6", "text": "<math><msup><mrow><mn>22</mn></mrow><mrow><mi>&nbsp;o</mi></mrow></msup><mn>C</mn></math>", "image": null, "isCorrect": false}, {"id": "sRIeE", "text": "<math><msup><mrow><mn>20.2</mn></mrow><mrow><mi>&nbsp;o</mi></mrow></msup><mn>C</mn></math>", "image": null, "isCorrect": true}, {"id": "laHTa", "text": "<math><msup><mrow><mn>25.2</mn></mrow><mrow><mi>&nbsp;o</mi></mrow></msup><mn>C</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Heat gain <math> <mo>=</mo> </math> heat lost<br /><br /><math> <mrow> <msub> <mi>C</mi> <mi>A</mi> </msub> <mrow><mo>(</mo> <mrow> <mn>16</mn><mo>−</mo><mn>12</mn></mrow> <mo>)</mo></mrow><mo>=</mo><msub> <mi>C</mi> <mi>B</mi> </msub> <mrow><mo>(</mo> <mrow> <mn>19</mn><mo>−</mo><mn>16</mn></mrow> <mo>)</mo></mrow><mo>⇒</mo><mfrac> <mrow> <msub> <mi>C</mi> <mi>A</mi> </msub> </mrow> <mrow> <msub> <mi>C</mi> <mi>B</mi> </msub> </mrow> </mfrac> <mo>=</mo><mfrac> <mn>3</mn> <mn>4</mn> </mfrac> </mrow> </math> and <math> <mrow> <msub> <mi>C</mi> <mi>B</mi> </msub> <mrow><mo>(</mo> <mrow> <mn>23</mn><mo>−</mo><mn>19</mn></mrow> <mo>)</mo></mrow><mo>=</mo><msub> <mi>C</mi> <mi>C</mi> </msub> <mrow><mo>(</mo> <mrow> <mn>28</mn><mo>−</mo><mn>23</mn></mrow> <mo>)</mo></mrow><mo>⇒</mo><mfrac> <mrow> <msub> <mi>C</mi> <mi>B</mi> </msub> </mrow> <mrow> <msub> <mi>C</mi> <mi>C</mi> </msub> </mrow> </mfrac> <mo>=</mo><mfrac> <mn>5</mn> <mn>4</mn> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>⇒</mo><mfrac> <mrow> <msub> <mi>C</mi> <mi>A</mi> </msub> </mrow> <mrow> <msub> <mi>C</mi> <mi>C</mi> </msub> </mrow> </mfrac> <mo>=</mo><mfrac> <mrow> <mn>15</mn></mrow> <mrow> <mn>16</mn></mrow> </mfrac> </mrow> </math> …(i)<br /><br />If <math> <mi>θ</mi> </math> is the temperature when A and C are mixed then,<br /><br /><math> <mrow> <msub> <mi>C</mi> <mi>A</mi> </msub> <mrow><mo>(</mo> <mrow> <mi>θ</mi><mo>−</mo><mn>12</mn></mrow> <mo>)</mo></mrow><mo>=</mo><msub> <mi>C</mi> <mi>C</mi> </msub> <mrow><mo>(</mo> <mrow> <mn>28</mn><mo>−</mo><mi>θ</mi></mrow> <mo>)</mo></mrow></mrow> </math><br /><br /><math> <mrow> <mo>⇒</mo><mfrac> <mrow> <msub> <mi>C</mi> <mi>A</mi> </msub> </mrow> <mrow> <msub> <mi>C</mi> <mi>C</mi> </msub> </mrow> </mfrac> <mo>=</mo><mfrac> <mrow> <mn>28</mn><mo>−</mo><mi>θ</mi></mrow> <mrow> <mi>θ</mi><mo>−</mo><mn>12</mn></mrow> </mfrac> </mrow> </math> … (ii)<br /><br />On solving equations (i) and (ii) <math> <mrow> <mi>θ</mi><mo>=</mo><msup> <mrow> <mn>20.2</mn></mrow> <mi>&nbsp;o</mi> </msup> <mn>C</mn></mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863831053bfd5ade70f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "28", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Temperature of an ideal gas is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math>. The final temperature of the gas when its volume changes from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">V</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">V</mi></math> in the process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">p</mi><mo>=</mo><mi>αV</mi></math> (here <math xm . Hence, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi></math> becomes <math><mn>2</mn><mo>×</mo><mn>2</mn><mo>=</mo><mn>4</mn></math> times<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>=</mo><mn>4</mn><mo>×</mo><mn>300</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">K</mi><mo>=</mo><mn>1200</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">K</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638203a47f7044e6e8", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "42", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A vertical closed cylinder is separated into two parts by a frictionless piston of mass <math><mi>m</mi></math> and of negligible thickness. The piston is free to move along the length of the cylinder. The length of the cylinder above piston is <math><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>,</mo></math> and that below the piston is <math><msub><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>,</mo></math> such that <math><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>&gt;</mo><msub><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>.</mo></math> Each part of the cylinder contains <math><mi>n</mi></math> moles of an ideal gas at equal temperature <math><mi>T</mi><mo>.</mo></math> If the piston is stationary, its mass&nbsp;<math><mi>m</mi></math>&nbsp;will be given by:<br />\r(<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> is universal gas constant and <math><mi>g</mi></math> is the a "6151e86379a9dd3ade25c3c6", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "100", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A glass bulb of the volume <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>400</mn><mo>&nbsp;</mo><msup><mi>cm</mi><mn>3</mn></msup></math> is connected to another bulb of volume <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>&nbsp;</mo><msup><mi>cm</mi><mn>3</mn></msup></math> by means of a tube of negligible volume. The bulbs contain dry air and are both at a common temperature and pressure of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>0</mn><mo>&nbsp;</mo><mi>atm</mi></math>, respectively. The larger bulb is immersed in steam at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> and the smaller in melting ice at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. Find the final common pressure.", "image": null}, "options": [{"id": "rduJ3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>13</mn><mo>&#160;</mo><mi>atm</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 100px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "PtFLo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>23</mn><mo>&#160;</mo><mi>atm</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 96px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "CcHaK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>43</mn><mo>&#160;</mo><mi>atm</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 76px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "i84sb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>53</mn><mo>&#160;</mo><mi>atm</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 86px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let n<sub>1</sub> and n<sub>2</sub> denote the number of moles of gas in the large and small bulbs, in the final configuration, respectively. Denoting the final temperatures by T<sub>1</sub> and T<sub>2</sub> and the final pressure by P<sub>f</sub>, the ideal gas law implies that<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mtext>p</mtext> <mrow> <mi>f</mi><mo>⁡</mo> </mrow> </msub> <msub> <mtext>V</mtext> <mn>1</mn> </msub> <mo>=</mo> <msub> <mtext>n</mtext> <mn>1</mn> </msub> <msub> <mtext>RT</mtext> <mn>1</mn> </msub> </mrow> </math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(i)<br /><br />and&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mtext>p</mtext> <mrow> <mi>f</mi><mo>⁡</mo> </mrow> </msub> <msub> <mtext>V</mtext> <mn>2</mn> </msub> <mo>=</mo> <msub> <mtext>n</mtext> <mn>2</mn> </msub> <msub> <mtext>RT</mtext> <mn>2</mn> </msub> </mrow> </math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(ii)<br /><br />where p<sub>0</sub>, V<sub>0</sub> = V<sub>1</sub> + V<sub>2</sub> and T<sub>0</sub> are the initial pressure, volume, and temperature, respectively.<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <msub> <mtext>p</mtext> <mrow> <mi>f</mi><mo>⁡</mo> </mrow> </msub> <msub> <mtext>V</mtext> <mn>1</mn> </msub> </mrow> <mrow> <msub> <mtext>RT</mtext> <mn>1</mn> </msub> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <msub> <mtext>p</mtext> <mrow> <mi>f</mi><mo>⁡</mo> </mrow> </msub> <msub> <mtext>V</mtext> <mn>2</mn> </msub> </mrow> <mrow> <msub> <mtext>RT</mtext> <mn>2</mn> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>p</mtext> <mn>0</mn> </msub> <msub> <mtext>V</mtext> <mn>0</mn> </msub> </mrow> <mrow> <msub> <mtext>RT</mtext> <mn>0</mn> </msub> </mrow> </mfrac> </mrow> </math><br /><br />Solving for Pf, we obtain <math> <mrow> <msub> <mtext>p</mtext> <mrow> <mi>f</mi><mo>⁡</mo> </mrow> </msub> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>p</mtext> <mn>0</mn> </msub> <msub> <mtext>V</mtext> <mn>0</mn> </msub> </mrow> <mrow> <msub> <mtext>T</mtext> <mn>0</mn> </msub> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <msub> <mtext>V</mtext> <mn>1</mn> </msub> </mrow> <mrow> <msub> <mtext>T</mtext> <mn>1</mn> </msub> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <msub> <mtext>V</mtext> <mn>2</mn> </msub> </mrow> <mrow> <msub> <mtext>T</mtext> <mn>2</mn> </msub> </mrow> </mfrac> </mrow> </mfenced> </mrow> </mfrac> </mrow> </math><br /><br />Inserting the numerical values; p<sub>0</sub> = 1.00 atm, T<sub>0</sub> = 293.15 K(t<sub>0</sub> = 20<sup>o</sup>C),<br /><br />&nbsp;T<sub>1</sub> = 373.15 K(t<sub>1</sub> = 100<sup>o</sup>C), and T<sub>2</sub> = 237.15 K(t<sub>2</sub> = 0<sup>o</sup>C),<br /><br />we find&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mtext>p</mtext> <mrow> <mi>f</mi><mo>⁡</mo> </mrow> </msub> <mo>=</mo> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>1.00</mtext> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>600</mtext> </mrow> </mfenced> </mrow> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>293.15</mtext> </mrow> </mfenced> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>4</mn> <mn>0</mn> <mn>0</mn> </mrow> <mrow> <mtext>373.15</mtext> </mrow> </mfrac> </mrow> </mfenced> <mo>+</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>2</mn> <mn>0</mn> <mn>0</mn> </mrow> <mrow> <mtext>273.15</mtext> </mrow> </mfrac> </mrow> </mfenced> </mrow> </mfenced> </mrow> </mfrac> <mo>=</mo> <mtext>1.13 atm</mtext></mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637774371615b511b7", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "30", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Steam at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> is passed into <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>1</mn><mo>&nbsp;</mo><mi>kg</mi></math> of water contained in a calorimeter of water equivalent <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>02</mn><mo>&nbsp;</mo><mi>kg</mi></math> at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> till the temperature of the calorimeter and its contents rise to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>80</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> . The mass of the steam condensed in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>kg</mi></math> is", "image": null}, "options": [{"id": "qi
