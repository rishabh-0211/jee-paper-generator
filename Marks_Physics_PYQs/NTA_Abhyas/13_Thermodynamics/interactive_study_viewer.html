>&#916;</mi><mi>Q</mi><mo>=</mo><mi>n</mi><mi>C</mi><mi>&#916;</mi><mi>T</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>=</mo><mfrac><mrow><mi>&#916;</mi><mi>Q</mi></mrow><mrow><mi>n</mi><mi>&#916;</mi><mi>T</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>30</mn><msub><mi>P</mi><mn>0</mn></msub><msub><mi>V</mi><mn>0</mn></msub></mrow><mfrac><mrow><mn>14</mn><msub><mi>P</mi><mn>0</mn></msub><msub><mi>V</mi><mn>0</mn></msub></mrow><mi>R</mi></mfrac></mfrac><mo>=</mo><mfrac><mn>15</mn><mn>7</mn></mfrac><mi>R</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632b6e8c3eab79edf9", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "96", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "One mole of an ideal gas is taken along the process in which <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mi>V</mi><mi>x</mi></msup></math> = constant. The graph shown represents the variation of molar heat capacity of such a gas with respect to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>. The values of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>c</mi><mo>'</mo></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>'</mo></math>. respectively, are given by<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Question_No._66.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 250px; height: 150px;\" />", "image": null}, "options": [{"id": "8BTwd", "text": "<math> <mrow> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> <mtext>,&nbsp;</mtext> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "CtFPj", "text": "<math> <mrow> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> <mtext>,&nbsp;</mtext> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "508jT", "text": "<math> <mrow> <mfrac> <mrow> <mn>7</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> <mtext>,&nbsp;</mtext> <mfrac> <mrow> <mn>7</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "N8QwS", "text": "<math> <mrow> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> <mtext>,&nbsp;</mtext> <mfrac> <mrow> <mn>7</mn> </mrow> <mrow> <mn>5</mn> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For <math> <mrow>  <mi>P</mi><msup>   <mi>V</mi>   <mi>x</mi>  </msup>  <mo>=</mo><mtext>constant</mtext></mrow></math> <br/><br/><math> <mrow>  <mi>C</mi><mo>=</mo><msub>   <mi>C</mi>   <mi>V</mi>  </msub>  <mo>+</mo><mfrac>   <mi>R</mi>   <mrow>    <mo>&#x2212;</mo><mi>x</mi><mo>+</mo><mn>1</mn></mrow>  </mfrac>  </mrow></math><br/><br/>At&nbsp;<math> <mrow> <mtext>x</mtext> <mo>=</mo> <mo>∞</mo> <mtext>,&nbsp;&nbsp;</mtext> <mtext>C</mtext> <mo>=</mo> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </math><br /><br />from <math> <mrow> <msup> <mtext>PV</mtext> <mtext>x</mtext> </msup> <mo>=</mo> <mtext>constnat</mtext> </mrow> </math><br /><br /><math> <mrow> <mo>⇒&nbsp;&nbsp;&nbsp;</mo> <msup> <mtext>P</mtext> <mrow> <mn>1</mn> <mo>/</mo> <mtext>x</mtext> </mrow> </msup> <mtext>V</mtext> <mo>=</mo> <mtext>another constant</mtext> </mrow> </math><br /><br />so at <math> <mrow> <mtext>x</mtext> <mo>=</mo> <mo>∞</mo> <mtext>,&nbsp;&nbsp;</mtext> <msub> <mtext>C</mtext> <mtext>v</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </math><br /><br />hence <math> <mrow> <mtext>C</mtext> <mo>=</mo> <msub> <mtext>C</mtext> <mtext>v</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </math><br /><br />and then <math> <mrow> <msub> <mtext>C</mtext> <mtext>p</mtext> </msub> <mo>=</mo> <msub> <mtext>C</mtext> <mtext>v</mtext> </msub> <mo>+</mo> <mtext>R</mtext> <mo>=</mo> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </math><br /><br />at x = 0, P = constant and C = C'<br /><br />hence <math> <mrow> <msup> <mtext>C</mtext> <mo>′</mo> </msup> <mo>=</mo> <msub> <mtext>C</mtext> <mtext>p</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </math><br /><br />at x = x', C = 0, so the process is adiabatic, hence<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msup> <mtext>x</mtext> <mo>′</mo> </msup> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>C</mtext> <mtext>p</mtext> </msub> </mrow> <mrow> <msub> <mtext>C</mtext> <mtext>v</mtext> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631e2da1df58d9ffef", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "91", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Diagram shows the variation in the internal energy U with the volume V of 2.0 moles of an ideal gas in cyclic process abcda. The temperatures of the gas at b and c are 500 K and 300 K, respectively. Calculate the heat absorbed by the gas during the process.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0030796_Question.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 200px; height: 181px;\" />", "image": null}, "options": [{"id": "Fo5ub", "text": "400 R ln 2", "image": null, "isCorrect": true}, {"id": "SjaEV", "text": "500 R ln 2", "image": null, "isCorrect": false}, {"id": "0OD8N", "text": "700 R ln 2", "image": null, "isCorrect": false}, {"id": "wO4f9", "text": "800 R ln 2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In the process a to b and c to d<br /><br />as <math> <mrow> <mo>&#916;</mo> <mtext>U</mtext> <mo>=</mo> <mn>0</mn> </mrow> </math>, therefore <math> <mrow> <mo>&#916;</mo> <mtext>T</mtext> <mo>=</mo> <mn>0</mn> </mrow> </math>&nbsp;or T = constant<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext>W</mtext> <mo>=</mo> <munderover> <mo>&#8747;</mo> <msub> <mtext>V</mtext> <mtext>i</mtext> </msub> <msub> <mtext>V</mtext> <mrow> <mi>f</mi><mo>&#8289;</mo> </mrow> </msub> </munderover> <mtext>PdV</mtext> </mrow> </math><br /><br />We have,<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext>PV</mtext> <mo>=</mo> <mtext>nRT</mtext> <mo>&#8658;</mo> <mtext>P</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>nRT</mtext> </mrow> <mrow> <mtext>V</mtext> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>&#8756;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</mo> <mtext>W</mtext> <mo>=</mo> <munderover> <mo>&#8747;</mo> <msub> <mtext>V</mtext> <mtext>i</mtext> </msub> <msub> <mtext>V</mtext> <mrow> <mi>f</mi><mo>&#8289;</mo> </mrow> </msub> </munderover> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>nRT</mtext> </mrow> </mfenced> <mfrac> <mrow> <mtext>RV</mtext> </mrow> <mrow> <mtext>V</mtext> </mrow> </mfrac> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mtext>nRT</mtext> <msubsup> <mrow> <mfenced close=\"|\" open=\"|\" separators=\",\"> <mrow> <mtext>ln V</mtext> </mrow> </mfenced> </mrow> <msub> <mtext>V</mtext> <mtext>i</mtext> </msub> <msub> <mtext>V</mtext> <mrow> <mi>f</mi><mo>&#8289;</mo> </mrow> </msub> </msubsup> <mo>=</mo> <mtext>nRT</mtext> <mo>ln</mo> <mfrac> <mrow> <msub> <mtext>V</mtext> <mrow> <mi>f</mi><mo>&#8289;</mo> </mrow> </msub> </mrow> <mrow> <msub> <mtext>V</mtext> <mtext>i</mtext> </msub> </mrow> </mfrac> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mtext>W</mtext> <mtext>ab</mtext> </msub> <mo>=</mo> <msub> <mtext>nRT</mtext> <mtext>b</mtext> </msub> <mo>ln</mo> <mfrac> <mrow> <mn>2</mn> <msub> <mtext>V</mtext> <mn>0</mn> </msub> </mrow> <mrow> <msub> <mtext>V</mtext> <mn>0</mn> </msub> </mrow> </mfrac> <mo>=</mo> <mn>2</mn> <mtext>R</mtext> <mo>&#215;</mo> <mn>5</mn> <mn>0</mn> <mn>0</mn> <mo>ln</mo> <mn>2</mn> <mo>=</mo> <mn>1</mn> <mn>0</mn> <mn>0</mn> <mn>0</mn> <mo>R ln 2</mo> </mrow> </math><br /><br />and&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mtext>W</mtext> <mtext>cd</mtext> </msub> <mo>=</mo> <msub> <mtext>nRT</mtext> <mtext>c</mtext> </msub> <mo>ln</mo> <mfrac> <mrow> <msub> <mtext>V</mtext> <mn>0</mn> </msub> </mrow> <mrow> <mn>2</mn> <msub> <mtext>V</mtext> <mn>0</mn> </msub> </mrow> </mfrac> <mo>=</mo> <mn>2</mn> <mtext>R</mtext> <mo>&#215;</mo> <mn>3</mn> <mn>0</mn> <mn>0</mn> <mo>ln</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>=</mo> <mo>-</mo> <mn>6</mn> <mn>0</mn> <mn>0</mn> <mo>R ln 2</mo> </mrow> </math><br /><br />There is no volume change from b to c and from d to a, so<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mtext>W</mtext> <mtext>bc</mtext> </msub> <mo>=</mo> <msub> <mtext>W</mtext> <mtext>da</mtext> </msub> <mo>=</mo> <mn>0</mn> </mrow> </math><br /><br />The work done in the complete cycle<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext>W</mtext> <mo>=</mo> <msub> <mtext>W</mtext> <mtext>ab</mtext> </msub> <mo>+</mo> <msub> <mtext>W</mtext> <mtext>bc</mtext> </msub> <mo>+</mo> <msub> <mtext>W</mtext> <mtext>cd</mtext> </msub> <mo>+</mo> <msub> <mtext>W</mtext> <mtext>da</mtext> </msub> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>10</mn><mn>0</mn><mn>0</mn><mo>R ln 2</mo><mo>+</mo><mn>0</mn><mo>-</mo><mn>6</mn><mn>0</mn><mn>0</mn><mo>R ln 2</mo><mo>+</mo><mn>0</mn></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mn>4</mn> <mn>0</mn> <mn>0</mn> <mo>R ln 2</mo> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631c7c48156446348a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "106", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A sound wave passing through the air at NTP produces a pressure of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>001</mn><mo>&nbsp;</mo><mi>dyne</mi><mo>&nbsp;</mo><msup><mi>cm</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math> during a compression. The corresp o>&nbsp;</mo><mo>°</mo><mn>C</mn></math>. If the cork can come out at a pressure&nbsp;<math><mn>3&nbsp;</mn></math>times the atmospheric pressure, then up to what temperature should the bottle be heated in order to remove the cork.", "image": null}, "options": [{"id": "ks2Pb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>325.5</mn><mo>&#160;</mo><mo>&#176;</mo><mn>C</mn></math>", "image": null, "isCorrect": false}, {"id": "sn1ZK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>851</mn><mo>&#160;</mo><mo>&#176;</mo><mn>C</mn></math>", "image": null, "isCorrect": false}, {"id": "dgh1X", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>651</mn><mo>&#160;</mo><mo>&#176;</mo><mn>C</mn></math>", "image": null, "isCorrect": true}, {"id": "KiGSC", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We know that, <math><msub><mrow><mi>p</mi></mrow><mrow><mn>1</mn></mrow></msub><mi>V</mi><mo>=</mo><mi>n</mi><mi>R</mi><msub><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow></msub></math><br /><br /><math><mo>&#8658;</mo><mn>1</mn><mo>&#215;</mo><mi>V</mi><mo>=</mo><mi>n</mi><mi>R</mi><mfenced separators=\"|\"><mrow><mn>35</mn><mo>+</mo><mn>273</mn></mrow></mfenced></math><br /><br /><math><mo>=</mo><mi>n</mi><mi>R</mi><mo>&#215;</mo><mn>308</mn></math> ....(i)<br /><br />and <math><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub><mi>V</mi><mo>=</mo><mi>n</mi><mi>R</mi><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br /><math><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mn>3</mn><mo>&#215;</mo><mi>V</mi><mo>=</mo><mi>n</mi><mi>R</mi><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub></math> ....(ii)<br /><br />On dividing Equation (ii) by Equation (i), we get<br /><br /><math><mn>3</mn><mo>=</mo><mrow><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mo>/</mo><mrow><mn>308</mn></mrow></mrow></math><br /><br /><math><mo>&#8658;</mo><mi>&#160;</mi><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>924</mn><mi>&#160;</mi><mn>K</mn></math><br /><br /><math><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>924</mn><mo>-</mo><mn>273</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>651</mn><mo>&#160;</mo><mo>&#176;</mo><mn>C</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863132d5e19cab46c87", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "94", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>Three samples of the same gas <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math>&nbsp;(<mi></mi><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>γ</mi><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac></math>) have equal volume initially. Now, the volume of each sample is doubled. For <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>, the process is adiabatic; for <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>, it is isobaric and for <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math>, the process is isothermal. If the final pressures are equal for all the three samples, the ratio of their initial pressures is</p>\r", "image": null}, "options": [{"id": "WZ2Sf", "text": "<math> <mrow> <mn>2</mn> <mtext>&nbsp;:&nbsp;</mtext> <mn>1</mn> <mtext>&nbsp;:&nbsp;</mtext> <msqrt> <mn>2</mn> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "7SFaN", "text": "<math> <mrow> <mn>2</mn> <msqrt> <mn>2</mn> </msqrt> <mtext>&nbsp;:&nbsp;</mtext> <mn>1</mn> <mtext>&nbsp;:&nbsp;</mtext> <mn>2</mn> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "vUxGL", "text": "<math> <mrow> <msqrt> <mn>2</mn> </msqrt> <mtext>&nbsp;:&nbsp;</mtext> <mn>1</mn> <mtext>&nbsp;:&nbsp;</mtext> <mn>2</mn> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "FC5bE", "text": "<math> <mrow> <msqrt> <mn>2</mn> </msqrt> <mtext>&nbsp;:&nbsp;</mtext> <mn>2</mn> <mtext>&nbsp;:&nbsp;</mtext> <mn>1</mn> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let P<sub>A</sub>, P<sub>B</sub>, P<sub>C</sub> be the initial pressures of the three samples and P be the final pressure of each.<br /><br />For A process is adiabatic, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mi>V</mi><mi>&#947;</mi></msup><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo></math>constant<br /><br /><mo></mo><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mo>&#160;</mo><msub><mi>P</mi><mi>A</mi></msub><mo>(</mo><mi>V</mi><msup><mo>)</mo><mrow><mn>3</mn><mo>/</mo><mn>2</mn><mo>&#160;</mo></mrow></msup><mo>=</mo><mo>&#160;</mo><mi>P</mi><mo>&#160;</mo><mo>(</mo><mn>2</mn><mi>V</mi><msup><mo>)</mo><mrow><mn>3</mn><mo>/</mo><mn>2</mn></mrow></msup><mo>&#160;</mo><mo>&#8658;</mo><mo>&#160;</mo><msub><mi>P</mi><mi>A</mi></msub><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><msup><mn>2</mn><mrow><mn>3</mn><mo>/</mo><mn>2</mn></mrow></msup><mo>&#160;</mo><mi>P</mi></math><br /><br />For B, the process is isobaric&nbsp; <mo></mo><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mo>&#160;</mo><msub><mi>P</mi><mi>B</mi></msub><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mi>P</mi></math><br /><br />For C, the process is isothermal, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>V</mi><mo>&#160;</mo><mo>=</mo></math> constant<br /><br /><mo></mo><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mo>&#160;</mo><msub><mi>P</mi><mi>C</mi></msub><mo>(</mo><mi>V</mi><mo>)</mo><mo>=</mo><mo>&#160;</mo><mi>P</mi><mo>(</mo><mn>2</mn><mi>V</mi><mo>)</mo><mo>&#160;</mo><mo>&#8658;</mo><mo>&#160;</mo><msub><mi>P</mi><mi>C</mi></msub><mo>=</mo><mo>&#160;</mo><mn>2</mn><mi>P</mi></math><br /><br />Hence, <math> <mrow> <msub> <mtext>P</mtext> <mtext>A</mtext> </msub> <mtext>&#160;:&#160;</mtext> <msub> <mtext>P</mtext> <mtext>B</mtext> </msub> <mtext>&#160;:&#160;</mtext> <msub> <mtext>P</mtext> <mtext>C</mtext> </msub> <mo>=</mo> <msup> <mn>2</mn> <mrow> <mn>3</mn> <mo>/</mo> <mn>2</mn> </mrow> </msup> <mtext>&#160;:&#160;</mtext> <mn>1</mn> <mtext>&#160;:&#160;</mtext> <mn>2</mn> <mo>=</mo> <mn>2</mn> <msqrt> <mn>2</mn> </msqrt> <mtext>&#160;:&#160;</mtext> <mn>1</mn> <mtext>&#160;:&#160;</mtext> <mn>2</mn> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631125a71deac30f53", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "46", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Diagram shows the variation of internal energy <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>U</mi><mo>)</mo></math>&nbsp;with the pressure <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>P</mi><mo>)</mo></math>&nbsp;of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>0</mn><mo>&nbsp;</mo><mi>mole</mi></math>&nbsp;gas in cyclic process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>abcda</mi></math>. The temperature of gas at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">c</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">d</mi></math>&nbsp;are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>500</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math>, respectively. Calculate the heat absorbed by the gas during the process.<br />\r<br />\r<br />\r&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0030772_Question.jpg\" style=\"width: 225px; height: 208px;\" />", "image": null}, "options": [{"id": "Oj9kz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>440</mn><mo>&nbsp;</mo><mi>R</mi><mo>&nbsp;</mo><mi>ln</mi><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "Sd9SL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>400</mn><mo>&nbsp;</mo><mi>R</mi><mo>&nbsp;</mo><mi>ln</mi><mn>2</mn></math>", "image": null, "isCorrect": true}, {"id": "VZc2H", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>430</mn><mo>&nbsp;</mo><mi>R</mi><mo>&nbsp;</mo><mi>ln</mi><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "N3AQ3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>414</mn><mo>&nbsp;</mo><mi>R</mi><mo>&nbsp;</mo><mi>ln</mi><mn>2</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Change in internal energy for cyclic process <math> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mo>&#916;</mo> <mtext>U</mtext> </mrow> </mfenced> <mo>=</mo> <mn>0</mn> </mrow> </math><br /><br />For process <math> <mrow> <mtext>a</mtext> <mo>&#160;&#8594;&#160;</mo> <mtext>b</mtext> <mtext>,&#160;&#160;</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>P</mtext> <mo>-</mo> <mtext>constant</mtext> </mrow> </mfenced> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mtext>W</mtext> <mrow> <mtext>a</mtext> <mo>&#160;&#8594;&#160;</mo> <mtext>b</mtext> </mrow> </msub> <mo>=</mo> <mtext>P</mtext> <mo>&#916;</mo> <mtext>V</mtext> <mo>=</mo> <mtext>n</mtext> <mtext>R</mtext> <mo>&#916;</mo> <mtext>T</mtext> <mo>=</mo> <mo>-</mo> <mn>4</mn> <mn>0</mn> <mn>0</mn> <mtext>&#160;R</mtext> </mrow> </math><br /><br />For process <math> <mrow> <mtext>b</mtext> <mo>&#160;&#8594;&#160;</mo> <mtext>c</mtext> <mtext>,&#160;&#160;</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>T</mtext> <mo>-</mo> <mtext>constant</mtext> </mrow> </mfenced> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext>W</mtext><mrow><mtext>b</mtext><mo>&#160;&#8594;&#160;</mo><mtext>c</mtext></mrow></msub><mo>=</mo><mi>nRTln</mi><mfenced><mfrac><msub><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">i</mi></msub><msub><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">f</mi></msub></mfrac></mfenced><mo>=</mo><mo>-</mo><mn>2</mn><mtext>R</mtext><mfenced><mn>300</mn></mfenced><mtext>ln</mtext><mo>&#160;</mo><mn>2</mn></math><br /><br />For process <math> <mrow> <mtext>c</mtext> <mo>&#160;&#8594;&#160;</mo> <mtext>d</mtext> <mtext>,&#160;&#160;</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>P</mtext> <mo>-</mo> <mtext>constant</mtext> </mrow> </mfenced> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext>W</mtext><mrow><mtext>c</mtext><mo>&#160;&#8594;&#160;</mo><mtext>d</mtext></mrow></msub><mo>=</mo><mtext>P</mtext><mo>&#916;</mo><mtext>V</mtext><mo>=</mo><mtext>nR</mtext><mo>&#916;</mo><mtext>T=</mtext><mo>+</mo><mn>4</mn><mn>0</mn><mn>0</mn><mtext>R</mtext></math><br /><br />For process <math> <mrow> <mtext>d</mtext> <mo>&#160;&#8594;&#160;</mo> <mtext>a</mtext> <mtext>,&#160;&#160;</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>T</mtext> <mo>-</mo> <mtext>constant</mtext> </mrow> </mfenced> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext>W</mtext><mrow><mtext>d</mtext><mo>&#160;&#8594;&#160;</mo><mtext>a</mtext></mrow></msub><mo>=</mo><mi>nRTln</mi><mfenced><mfrac><msub><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">i</mi></msub><msub><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">f</mi></msub></mfrac></mfenced><mo>=</mo><mo>+</mo><mn>2</mn><mtext>R</mtext><mfenced><mrow><mn>5</mn><mn>0</mn><mn>0</mn></mrow></mfenced><mtext>ln</mtext><mn>&#160;2</mn></math><br /><br />Net work,<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mo>&#916;</mo> <mtext>W</mtext> </mrow> </mfenced> <mo>=</mo> <msub> <mtext>W</mtext> <mrow> <mtext>a</mtext> <mo>&#160;&#8594;&#160;</mo> <mtext>b</mtext> </mrow> </msub> <mo>+</mo> <msub> <mtext>W</mtext> <mrow> <mtext>b</mtext> <mo>+</mo> <mtext>c</mtext> </mrow> </msub> <mo>+</mo> <msub> <mtext>W</mtext> <mrow> <mtext>c</mtext> <mo>&#160;&#8594;&#160;</mo> <mtext>d</mtext> </mrow> </msub> <mo>+</mo> <msub> <mtext>W</mtext> <mrow> <mtext>d</mtext> <mo>&#160;&#8594;&#160;</mo> <mtext>a</mtext> </mrow> </msub> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>&#916;</mo> <mtext>W</mtext> <mo>=</mo> <mn>4</mn> <mn>0</mn> <mn>0</mn> <mtext>&#160;R ln 2</mtext> </mrow> </math><br /><br /><math> <mrow> <mtext>dQ</mtext> <mo>=</mo> <mtext>dU</mtext> <mo>+</mo> <mtext>dW</mtext> </mrow> </math>, first law of thermodynamics<br /><br />&nbsp;<math> <mrow> <mtext>dQ</mtext> <mo>=</mo> <mn>4</mn> <mn>0</mn> <mn>0</mn> <mtext>&#160;R ln 2</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630e8573fca2488a58", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "69", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An ideal gas is compressed to half of its initial volume by means of several processes. Which of the process results in the maximum work done on the gas?", "image": null}, "options": [{"id": "tQyIJ", "text": "Isobaric", "image": null, "isCorrect": false}, {"id": "XZ2Gk", "text": "Isochoric", "image": null, "isCorrect": false}, {"id": "5QfpG", "text": "Isothermal", "image": null, "isCorrect": false}, {"id": "Co3kT", "text": "Adiabatic", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image5-3797b5f0-b551-4aad-95a3-4860b74e9b27.jpg\" /><br /><br />Since area under the curve is maximum for the adiabatic process so work done on the gas will be maximum for the adiabatic process.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630ddaf922452610f7", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "64", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi></math> moles of an ideal diatomic gas is enclosed in a cylinder at temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math>. suppose on supplying heat to the gas, its temperature remains constant but <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math> moles get dissociated into atoms. Heat supplied to the gas is", "image": null}, "options": [{"id": "Qd6Gk", "text": "<math> <mrow> <mtext>Zero</mtext> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "GmQH4", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>n</mi><mi>R</mi><mi>T</mi></math>", "image": null, "isCorrect": true}, {"id": "ts8lm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>n</mi><mi>R</mi><mi>T</mi></math>", "image": null, "isCorrect": false}, {"id": "HV6Ht", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>R</mi><mi>T</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since the gas is enclosed in a vessel, therefore, during heating process, volume of the gas remains constant. Hence, no work is done by the gas. It means heat supplied to the gas is used to increase its internal energy only.<br /><br />Initial internal energy of the gas is <math> <mrow> <msub> <mtext>U</mtext> <mn>1</mn> </msub> <mo>=</mo> <mtext>N</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </mfenced> <mtext>T</mtext> </mrow> </math><br /><br />Since n moles get dissociated into atoms, therefore, after heating, vessel contains <math> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>N</mtext> <mo>-</mo> <mtext>n</mtext> </mrow> </mfenced> </mrow> </math>&nbsp; moles of diatomic gas and 2n moles of a mono-atomic gas. Hence the internal energy for the gas, after heating, will be equal to <math> <mrow> <msub> <mtext>U</mtext> <mn>2</mn> </msub> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>N</mtext> <mo>-</mo> <mtext>n</mtext> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </mfenced> <mtext>T</mtext> <mo>+</mo> <mn>2</mn> <mtext>n</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </mfenced> <mtext>T</mtext> <mo>=</mo> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>NRT</mtext> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>nRT</mtext> </mrow> </math><br /><br />Hence, the heat supplied = increase in internal energy<br /><br /><math> <mrow> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>U</mtext> <mn>2</mn> </msub> <mo>-</mo> <msub> <mtext>U</mtext> <mn>1</mn> </msub> </mrow> </mfenced> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>nRT</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630d2a0731994f021b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "36", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An ideal gas <math><mfenced separators=\"|\"><mrow><mi>γ</mi><mo>=</mo><mn>1.5</mn></mrow></mfenced></math> undergoes a thermodynamic process in which the temperature and pressure of the gas are related as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi>P</mi><mn>2</mn></msup></math> = constant. The molar heat capacity of the gas during the process is", "image": null}, "options": [{"id": "dnj1g", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>R</mi></math>", "image": null, "isCorrect": false}, {"id": "2MLbM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>3</mn></mfrac><mi>R</mi></math>", "image": null, "isCorrect": false}, {"id": "97jd2", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>2</mn></mfrac><mi>R</mi></math>", "image": null, "isCorrect": true}, {"id": "rHyd4", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>3</mtext><mi>R</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi>P</mi><mn>2</mn></msup><mo>=</mo></math> constant<br /><br /><math><mo>&#8658;</mo></math> <math><mi>P</mi><msup><mrow><mi>V</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> = constant</p><p>For a polytropic process&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mi>V</mi><mi>x</mi></msup></math>&nbsp;= constant, the molar heat capacity is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>=</mo><mi>R</mi><mfenced open=\"[\" close=\"]\"><mrow><mfrac><mn>1</mn><mrow><mi>&#947;</mi><mo>-</mo><mn>1</mn></mrow></mfrac><mo>+</mo><mfrac><mn>1</mn><mrow><mn>1</mn><mo>-</mo><mi>x</mi></mrow></mfrac></mrow></mfenced></math></p><p>Substituting the values we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>=</mo><mi>R</mi><mfenced open=\"[\" close=\"]\"><mrow><mfrac><mn>1</mn><mrow><mn>1</mn><mo>.</mo><mn>5</mn><mo>-</mo><mn>1</mn></mrow></mfrac><mo>+</mo><mfrac><mn>1</mn><mrow><mn>1</mn><mo>-</mo><mfenced><mrow><mo>-</mo><mn>1</mn></mrow></mfenced></mrow></mfrac></mrow></mfenced><mo>=</mo><mfrac><mn>5</mn><mn>2</mn></mfrac><mi>R</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630c528a1f4ce9c312", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "76", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two identical glass bulbs are interconnected by a thin glass tube. A gas is filled in these bulbs at NTP. If one bulb is placed in ice and another bulb is placed inside a hot bath, then the pressure of the gas becomes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>5</mn></math> times. The temperature of the hot bath will be<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0031158_Question.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 250px; height: 130px;\" />", "image": null}, "options": [{"id": "u72T3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 55px; top: 41px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "SGhQY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>182</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 55px; top: 41px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "lDGnr", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>256</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 55px; top: 41px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "m5HtF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>546</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 55px; top: 41px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Quantity of gas in these bulbs is constant, i.e.,<br />initial no. of moles in both the bulbs = final number of moles<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mi>&#956;</mi> <mn>1</mn> </msub> <mo>+</mo> <msub> <mi>&#956;</mi> <mn>2</mn> </msub> <mo>=</mo> <msubsup> <mi>&#956;</mi> <mn>1</mn> <mo>&#8242;</mo> </msubsup> <mo>+</mo> <msubsup> <mi>&#956;</mi> <mn>2</mn> <mo>&#8242;</mo> </msubsup> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mtext mathvariant=\"italic\">PV</mtext><mrow><mtext mathvariant=\"italic\">R</mtext><mfenced><mrow><mn>2</mn><mn>7</mn><mn>3</mn></mrow></mfenced></mrow></mfrac><mo>+</mo><mfrac><mtext mathvariant=\"italic\">PV</mtext><mrow><mtext mathvariant=\"italic\">R</mtext><mfenced><mrow><mn>2</mn><mn>7</mn><mn>3</mn></mrow></mfenced></mrow></mfrac><mo>=</mo><mfrac><mrow><mtext>1.5</mtext><mtext mathvariant=\"italic\">PV</mtext></mrow><mrow><mtext mathvariant=\"italic\">R</mtext><mfenced><mrow><mn>2</mn><mn>7</mn><mn>3</mn></mrow></mfenced></mrow></mfrac><mo>+</mo><mfrac><mrow><mtext>1.5</mtext><mtext mathvariant=\"italic\">PV</mtext></mrow><mrow><mtext mathvariant=\"italic\">R</mtext><mfenced><mtext mathvariant=\"italic\">T</mtext></mfenced></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;&#160;&#160;&#160;</mo><mfrac><mn>2</mn><mrow><mn>2</mn><mn>7</mn><mn>3</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn><mo>.</mo><mn>5</mn></mrow><mrow><mn>2</mn><mn>7</mn><mn>3</mn></mrow></mfrac><mo>+</mo><mfrac><mtext>1.5</mtext><mi>T</mi></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;&#160;&#160;&#160;</mo><mi>T</mi><mo>=</mo><mn>8</mn><mn>1</mn><mn>9</mn><mo>K</mo><mo>=</mo><mn>5</mn><mn>4</mn><mn>6</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863059c5f513909c0f3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "27", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A cylindrical adiabatic&nbsp;container of total volume&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub></math>&nbsp;is divided into&nbsp;two equal parts by a conducting piston which is free to move as shown in the figure. Each part&nbsp;contains&nbsp;identical gas at pressure&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub></math>.&nbsp;Initially the temperatures of the left and right parts are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub></math> respectively. An external&nbsp;force is applied on the piston of area <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;to keep the&nbsp;piston at rest. The value of external force required when thermal equilibrium is reached is</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0629611.jpg\" style=\"width: 275px; height: 113px;\" /></p>\r\r<p>&nbsp;</p>\r", "image": null}, "options": [{"id": "6boHH", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>8</mn><mn>5</mn></mfrac><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}, {"id": "SCrUP", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>5</mn></mfrac><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}, {"id": "iai5s", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>6</mn></mfrac><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": false}, {"id": "RVwcd", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>6</mn><mn>5</mn></mfrac><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub><mi mathvariant=\"normal\">A</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>If final temp is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub></mrow><mrow><mn>4</mn><msub><mi>RT</mi><mn>0</mn></msub></mrow></mfrac><msub><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">v</mi></msub><mfenced><mrow><mn>4</mn><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub><mo>-</mo><mi mathvariant=\"normal\">T</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub></mrow><msub><mi>RT</mi><mn>0</mn></msub></mfrac><msub><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">v</mi></msub><mfenced><mrow><mi mathvariant=\"normal\">T</mi><mo>-</mo><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>4</mn><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub><mo>-</mo><mi mathvariant=\"normal\">T</mi></mrow><mn>4</mn></mfrac><mo>=</mo><mi mathvariant=\"normal\">T</mi><mo>-</mo><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub><mo>-</mo><mi mathvariant=\"normal\">T</mi><mo>=</mo><mn>4</mn><mi mathvariant=\"normal\">T</mi><mo>-</mo><mn>4</mn><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub><mo>=</mo><mn>5</mn><mi mathvariant=\"normal\">T</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>=</mo><mfrac><mrow><mn>8</mn><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub></mrow><mn>5</mn></mfrac></math></p><p>Final pressure</p><p>In left&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">f</mi></msub><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">T</mi><mi mathvariant=\"normal\">f</mi></msub><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub></mfrac><msub><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">i</mi></msub><mo>=</mo><mfrac><mrow><mfrac><mn>8</mn><mn>5</mn></mfrac><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub></mrow><mrow><mn>4</mn><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub></mrow></mfrac><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub><mo>=</mo><mfrac><mn>2</mn><mn>5</mn></mfrac><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub></math></p><p>In right&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">f</mi></msub><mo>=</mo><mfrac><mrow><mfrac><mn>8</mn><mn>5</mn></mfrac><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub></mrow><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub></mfrac><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub><mo>=</mo><mfrac><mn>8</mn><mn>5</mn></mfrac><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Force</mi><mo>=</mo><mfenced><mrow><mfrac><mrow><mn>8</mn><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub></mrow><mn>5</mn></mfrac><mo>-</mo><mfrac><mrow><mn>2</mn><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub></mrow><mn>5</mn></mfrac></mrow></mfenced><mi mathvariant=\"normal\">A</mi><mo>=</mo><mfrac><mrow><mn>6</mn><msub><mi mathvariant=\"normal\">P</mi><mn>0</mn></msub><mi mathvariant=\"normal\">A</mi></mrow><mn>5</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863057e01457e6c15f6", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "70", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The ratio of the speed of sound in nitrogen gas to that in helium gas, at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math> is", "image": null}, "options": [{"id": "ZsRno", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mn>2</mn><mn>7</mn></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "xgnWu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mn>1</mn><mn>7</mn></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "KVoYY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msqrt><mn>3</mn></msqrt><mn>5</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "iimgh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msqrt><mn>6</mn></msqrt><mn>5</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Speed of sound in an ideal gas is given by<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><msqrt><mfrac><mrow><mi>&#947;</mi><mi>R</mi><mi>T</mi></mrow><mi>M</mi></mfrac></msqrt></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;&#160;&#160;&#160;</mo><mi>v</mi><mo>&#8733;</mo><msqrt><mfrac><mi>&#947;</mi><mi>M</mi></mfrac></msqrt></math>&nbsp; &nbsp; &nbsp; [<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> is same for both the gases]<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mi>&#947;</mi> <msub> <mtext>N</mtext> <mn>2</mn> </msub> </msub> <mo>=</mo> <mfrac> <mrow> <mn>7</mn> </mrow> <mrow> <mn>5</mn> </mrow> </mfrac> </mrow> </math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(Diatomic)<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mi>&#947;</mi> <mtext>He</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> </mrow> </math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(Monoatomic)</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;&#160;&#160;&#160;</mo><mfrac><msub><mi>v</mi><msub><mtext>N</mtext><mn>2</mn></msub></msub><msub><mi>v</mi><mtext>He</mtext></msub></mfrac><mo>=</mo><msqrt><mfrac><msub><mi>&#947;</mi><msub><mtext>N</mtext><mn>2</mn></msub></msub><msub><mi>&#947;</mi><mtext>He</mtext></msub></mfrac><mo>&#183;</mo><mfrac><msub><mi>M</mi><mtext>He</mtext></msub><msub><mi>M</mi><msub><mtext>N</mtext><mn>2</mn></msub></msub></mfrac></msqrt><mo>=</mo><msqrt><mfrac><mrow><mn>7</mn><mo>/</mo><mn>5</mn></mrow><mrow><mn>5</mn><mo>/</mo><mn>3</mn></mrow></mfrac><mfenced><mfrac><mn>4</mn><mrow><mn>2</mn><mn>8</mn></mrow></mfrac></mfenced></msqrt></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><msqrt><mn>3</mn></msqrt><mn>5</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86304cc6fbd5095cd42", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "10", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An ideal gas undergoes&nbsp;the cyclic process <math> <mrow> <mtext>abca</mtext></mrow> </math>as shown in the figure. The&nbsp;internal energy change of the gas along the path <math> <mrow> <mtext>c</mtext><mtext>a</mtext></mrow> </math> &nbsp;is&nbsp;<math> <mrow> <mo>−</mo><mn>180</mn><mo>&nbsp;</mo><mtext>J</mtext></mrow> </math>. The gas absorb <math> <mrow> <mn>250</mn><mo>&nbsp;</mo><mtext>J</mtext></mrow> </math> of heat along the path <math> <mrow> <mtext>a</mtext><mtext>b</mtext></mrow> </math> &nbsp;and also absorbs&nbsp;<math> <mrow> <mn>60</mn><mo>&nbsp;</mo><mtext>J</mtext></mrow> </math> &nbsp;of heat along&nbsp;the path <math> <mrow> <mtext>bc</mtext></mrow> </math>. Find the work done by the gas along the path <math> <mrow> <mtext>a</mtext><mtext>b</mtext><mtext>c</mtext></mrow></math><br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-05-28_at_7.35.59_PM.jpeg\" style=\"width: 200px; height: 190px;\" />", "image": null}, "options": [{"id": "UwUDO", "text": "<math> <mrow> <mn>130</mn><mo>&nbsp;</mo><mtext>J</mtext></mrow> </math>", "image": null, "isCorrect": true}, {"id": "cu6xS", "text": "<math> <mrow>  <mn>140</mn><mo>&#x00A0;</mo><mtext>J</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "mW2Z3", "text": "<math> <mrow>  <mn>120</mn><mo>&#x00A0;</mo><mtext>J</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "mesE1", "text": "<math> <mrow>  <mn>100</mn><mo>&#x00A0;</mo><mtext>J</mtext></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Change in internal energy for a cyclic process is zero. Thus,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><msub><mi mathvariant=\"normal\">U</mi><mi>abc</mi></msub><mo>+</mo><mo>&#8710;</mo><msub><mi mathvariant=\"normal\">U</mi><mi>ca</mi></msub><mo>=</mo><mn>0</mn><mspace linebreak=\"newline\"/><mo>&#8710;</mo><msub><mi mathvariant=\"normal\">U</mi><mi>abc</mi></msub><mo>=</mo><mo>-</mo><mo>&#8710;</mo><msub><mi mathvariant=\"normal\">U</mi><mi>ca</mi></msub><mo>=</mo><mn>180</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;Q</mi><mo>=</mo><mi>&#916;W</mi><mo>+</mo><mi>&#916;U</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>250</mn><mo>+</mo><mn>60</mn><mo>=</mo><mi>&#916;W</mi><mo>+</mo><mn>180</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;W</mi><mo>=</mo><mn>130</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["de     let currentTopicIndex = 0;

    function toggleTheme() {

      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {

      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {

        d.open = allSolutionsOpen;

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));

      selectTopic(0);
    }
