 [{"title": "NTA Abhyas Paper", "value": "28", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Temperature of an ideal gas is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math>. The final temperature of the gas when its volume changes from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">V</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">V</mi></math> in the process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">p</mi><mo>=</mo><mi>αV</mi></math> (here <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">α</mi></math> is a positive constant) is", "image": null}, "options": [{"id": "wmVsz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>900</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math>", "image": null, "isCorrect": false}, {"id": "meOMW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1200</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math>", "image": null, "isCorrect": true}, {"id": "X9h3S", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math>", "image": null, "isCorrect": false}, {"id": "3cGKG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>500</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given relation is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">p</mi><mo>∝</mo><mi mathvariant=\"normal\">V</mi></math><br /><br />Therefore, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">p</mi><mo>∝</mo><mi mathvariant=\"normal\">V</mi></math><br /><br />When <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">V</mi></math> changes from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">V</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">V</mi></math>, pressure <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">p</mi></math> is also doubled<br /><br />For an ideal gas, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>pV</mi><mi mathvariant=\"normal\">T</mi></mfrac><mo>=</mo></math>constant<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">T</mi><mo>∝</mo><mi>pV</mi></math>. Hence, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi></math> becomes <math><mn>2</mn><mo>×</mo><mn>2</mn><mo>=</mo><mn>4</mn></math> times<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>=</mo><mn>4</mn><mo>×</mo><mn>300</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">K</mi><mo>=</mo><mn>1200</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">K</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637f21fb2e554fc1ea", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "06", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An ideal gas expands isothermally from volume <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>1</mn></msub></math>&nbsp;to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>2</mn></msub></math>&nbsp;and then it is adiabatically compressed back to its original volume <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>1</mn></msub></math>.&nbsp;The initial and final pressures of the gas are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>3</mn></msub></math>&nbsp;respectively and the net&nbsp;work done by the gas is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi></math>,&nbsp;then", "image": null}, "options": [{"id": "oDIiz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>3</mn></msub><mo>&gt;</mo><msub><mi>P</mi><mn>1</mn></msub><mo>,</mo><mo>&#xA0;</mo><mi>W</mi><mo>&gt;</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "s5Fwl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>3</mn></msub><mo>&lt;</mo><msub><mi>P</mi><mn>1</mn></msub><mo>,</mo><mo>&#xA0;</mo><mi>W</mi><mo>&lt;</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "nHJNK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>3</mn></msub><mo>&gt;</mo><msub><mi>P</mi><mn>1</mn></msub><mo>,</mo><mo>&#xA0;</mo><mi>W</mi><mo>&lt;</mo><mn>0</mn></math>", "image": null, "isCorrect": true}, {"id": "MQ8it", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>3</mn></msub><mo>=</mo><msub><mi>P</mi><mn>1</mn></msub><mo>,</mo><mo>&#xA0;</mo><mi>W</mi><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The two processes are shown in the following P-V diagram:<br /><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029609_Ans.jpg\" style=\"width: 211px; height: 189px;\" /><br /><br /><br />For iothermal process:<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; P<sub>1</sub>V<sub>1</sub> = P<sub>2</sub>V<sub>2</sub><br /><br />i.e.,&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mtext>P</mtext> <mn>1</mn> </msub> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <msub> <mtext>V</mtext> <mn>2</mn> </msub> </mrow> <mrow> <msub> <mtext>V</mtext> <mn>1</mn> </msub> </mrow> </mfrac> </mrow> </mfenced> <msub> <mtext>P</mtext> <mn>2</mn> </msub> </mrow> </math><br /><br />For adiabatic process:<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mtext>P</mtext> <mn>3</mn> </msub> <msubsup> <mtext>V</mtext> <mn>1</mn> <mi>γ</mi> </msubsup> <mo>=</mo> <msub> <mtext>P</mtext> <mn>2</mn> </msub> <msubsup> <mtext>V</mtext> <mn>2</mn> <mi>γ</mi> </msubsup> </mrow> </math><br /><br />i.e.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mtext>P</mtext> <mn>3</mn> </msub> <mo>=</mo> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <msub> <mtext>V</mtext> <mn>2</mn> </msub> </mrow> <mrow> <msub> <mtext>V</mtext> <mn>1</mn> </msub> </mrow> </mfrac> </mrow> </mfenced> </mrow> <mi>γ</mi> </msup> <msub> <mtext>P</mtext> <mn>2</mn> </msub> </mrow> </math><br /><br />As&nbsp;<math> <mrow> <mi>γ</mi> <mo>&gt;</mo> <mn>1</mn> </mrow> </math>, hence P<sub>3</sub> &gt; P<sub>1</sub><br /><br />Further, as slope of adiabatic curve is greater than that of isothermal process curve, adiabatic curve will lie above the isothermal curve. That is, area under adiabatic curve &gt; area under isothermal curve<br /><br />i.e.,&nbsp;Negative work &gt; Positive work<br /><br />i.e., W &lt; 0", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637edcc6e8c0941778", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "101", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A gas is undergoing an adiabatic process. At a certain stage, the volume and absolute temperature of the gas are <math><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>,</mo><mi>&nbsp;</mi><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub></math> and the magnitude of the slope of the V-T curve is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>. molar specific heat of the gas at constant pressure is [Assume the volume of the gas is taken on the y-axis and absolute temperature of the gas taken on x-axis]", "image": null}, "options": [{"id": "5jG7I", "text": "<math><mfrac><mrow><mi>m</mi><mi>R</mi><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "1ukAJ", "text": "<math><mfrac><mrow><mi>m</mi><mi>R</mi><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><msub><mrow><mn>2</mn><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "WYNul", "text": "<math><mfrac><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>+</mo><mi>m</mi><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfenced><mi>R</mi></mrow><mrow><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "HVIIC", "text": "<math><mfrac><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>+</mo><mi>m</mi><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfenced><mi>R</mi></mrow><mrow><mn>2</mn><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For adiabatic process <math><mi>T</mi><msup><mrow><mi>V</mi></mrow><mrow><mi>γ</mi><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo></math> constant Differentiating with respect to T<br /><br /><math> <msup> <mi>V</mi> <mrow> <mi>γ</mi><mo>−</mo><mn>1</mn></mrow> </msup> <mo>+</mo><mi>T</mi><mrow><mo>(</mo> <mrow> <mi>γ</mi><mo>−</mo><mn>1</mn></mrow> <mo>)</mo></mrow><msup> <mi>V</mi> <mrow> <mi>γ</mi><mo>−</mo><mn>2</mn></mrow> </msup> <mfrac> <mrow> <mi>d</mi><mi>V</mi></mrow> <mrow> <mi>d</mi><mi>t</mi></mrow> </mfrac> <mo>=</mo><mn>0</mn> </math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><mi>d</mi><mi>V</mi></mrow><mrow><mi>d</mi><mi>T</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mfrac><mrow><mi>V</mi></mrow><mrow><mi>T</mi><mfenced separators=\"|\"><mrow><mi>γ</mi><mo>-</mo><mn>1</mn></mrow></mfenced></mrow></mfrac><mi>,&nbsp;</mi><msub><mrow><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mfrac><mrow><mi>d</mi><mi>V</mi></mrow><mrow><mi>d</mi><mi>T</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>,</mo><mi>&nbsp;</mi><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></msub><mo>=</mo><mi>m</mi></math><br /><br /><math><mo>⇒</mo></math><math><mfrac><mrow><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub><mfenced separators=\"|\"><mrow><mi>γ</mi><mo>-</mo><mn>1</mn></mrow></mfenced></mrow></mfrac><mo>=</mo><mi>m</mi></math><br /><br /><math><mi>γ</mi><mo>-</mo><mn>1</mn><mo>=</mo><mfrac><mrow><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>m</mi></mrow></mfrac></math><br /><br /><math><msub><mrow><mi>C</mi></mrow><mrow><mi>V</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>R</mi></mrow><mrow><mi>γ</mi><mo>-</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>R</mi><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>m</mi></mrow><mrow><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac></math><br /><br /><math><msub><mrow><mi>C</mi></mrow><mrow><mi>P</mi></mrow></msub><mo>=</mo><msub><mrow><mi>C</mi></mrow><mrow><mi>V</mi></mrow></msub><mo>+</mo><mi>R</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mfrac><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>m</mi></mrow><mrow><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac></mrow></mfenced><mi>R</mi></math><br /><br /><math> <mrow> <mo>=</mo><mrow><mo>(</mo> <mrow> <mfrac> <mrow> <msub> <mi>V</mi> <mn>0</mn> </msub> <mo>+</mo><mi>m</mi><msub> <mi>T</mi> <mn>0</mn> </msub> </mrow> <mrow> <msub> <mi>V</mi> <mn>0</mn> </msub> </mrow> </mfrac> </mrow> <mo>)</mo></mrow><mi>R</mi></mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86379a9dd3ade25c3c6", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "100", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A glass bulb of the volume <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>400</mn><mo>&nbsp;</mo><msup><mi>cm</mi><mn>3</mn></msup></math> is connected to another bulb of volume <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>&nbsp;</mo><msup><mi>cm</mi><mn>3</mn></msup></math> by means of a tube of negligible volume. The bulbs contain dry air and are both at a common temperature and pressure of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>0</mn><mo>&nbsp;</mo><mi>atm</mi></math>, respectively. The larger bulb is immersed in steam at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> and the smaller in melting ice at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. Find the final common pressure.", "image": null}, "options": [{"id": "rduJ3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>13</mn><mo>&#160;</mo><mi>atm</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 100px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "PtFLo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>23</mn><mo>&#160;</mo><mi>atm</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 96px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "CcHaK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>43</mn><mo>&#160;</mo><mi>atm</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 76px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "i84sb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>53</mn><mo>&#160;</mo><mi>atm</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 86px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let n<sub>1</sub> and n<sub>2</sub> denote the number of moles of gas in the large and small bulbs, in the final configuration, respectively. Denoting the final temperatures by T<sub>1</sub> and T<sub>2</sub> and the final pressure by P<sub>f</sub>, the ideal gas law implies that<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mtext>p</mtext> <mrow> <mi>f</mi><mo>⁡</mo> </mrow> </msub> <msub> <mtext>V</mtext> <mn>1</mn> </msub> <mo>=</mo> <msub> <mtext>n</mtext> <mn>1</mn> </msub> <msub> <mtext>RT</mtext> <mn>1</mn> </msub> </mrow> </math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(i)<br /><br />and&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mtext>p</mtext> <mrow> <mi>f</mi><mo>⁡</mo> </mrow> </msub> <msub> <mtext>V</mtext> <mn>2</mn> </msub> <mo>=</mo> <msub> <mtext>n</mtext> <mn>2</mn> </msub> <msub> <mtext>RT</mtext> <mn>2</mn> </msub> </mrow> </math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(ii)<br /><br />where p<sub>0</sub>, V<sub>0</sub> = V<sub>1</sub> + V<sub>2</sub> and T<sub>0</sub> are the initial pressure, volume, and temperature, respectively.<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <msub> <mtext>p</mtext> <mrow> <mi>f</mi><mo>⁡</mo> </mrow> </msub> <msub> <mtext>V</mtext> <mn>1</mn> </msub> </mrow> <mrow> <msub> <mtext>RT</mtext> <mn>1</mn> </msub> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <msub> <mtext>p</mtext> <mrow> <mi>f</mi><mo>⁡</mo> </mrow> </msub> <msub> <mtext>V</mtext> <mn>2</mn> </msub> </mrow> <mrow> <msub> <mtext>RT</mtext> <mn>2</mn> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>p</mtext> <mn>0</mn> </msub> <msub> <mtext>V</mtext> <mn>0</mn> </msub> </mrow> <mrow> <msub> <mtext>RT</mtext> <mn>0</mn> </msub> </mrow> </mfrac> </mrow> </math><br /><br />Solving for Pf, we obtain <math> <mrow> <msub> <mtext>p</mtext> <mrow> <mi>f</mi><mo>⁡</mo> </mrow> </msub> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>p</mtext> <mn>0</mn> </msub> <msub> <mtext>V</mtext> <mn>0</mn> </msub> </mrow> <mrow> <msub> <mtext>T</mtext> <mn>0</mn> </msub> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <msub> <mtext>V</mtext> <mn>1</mn> </msub> </mrow> <mrow> <msub> <mtext>T</mtext> <mn>1</mn> </msub> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <msub> <mtext>V</mtext> <mn>2</mn> </msub> </mrow> <mrow> <msub> <mtext>T</mtext> <mn>2</mn> </msub> </mrow> </mfrac> </mrow> </mfenced> </mrow> </mfrac> </mrow> </math><br /><br />Inserting the numerical values; p<sub>0</sub> = 1.00 atm, T<sub>0</sub> = 293.15 K(t<sub>0</sub> = 20<sup>o</sup>C),<br /><br />&nbsp;T<sub>1</sub> = 373.15 K(t<sub>1</sub> = 100<sup>o</sup>C), and T<sub>2</sub> = 237.15 K(t<sub>2</sub> = 0<sup>o</sup>C),<br /><br />we find&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mtext>p</mtext> <mrow> <mi>f</mi><mo>⁡</mo> </mrow> </msub> <mo>=</mo> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>1.00</mtext> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>600</mtext> </mrow> </mfenced> </mrow> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>293.15</mtext> </mrow> </mfenced> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>4</mn> <mn>0</mn> <mn>0</mn> </mrow> <mrow> <mtext>373.15</mtext> </mrow> </mfrac> </mrow> </mfenced> <mo>+</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>2</mn> <mn>0</mn> <mn>0</mn> </mrow> <mrow> <mtext>273.15</mtext> </mrow> </mfrac> </mrow> </mfenced> </mrow> </mfenced> </mrow> </mfrac> <mo>=</mo> <mtext>1.13 atm</mtext></mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863786f706442d2f6c3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "01", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If <math><mi>A</mi><mi>B</mi></math> is an isothermal, <math><mi>B</mi><mi>C</mi></math> is an isochoric and <math><mi>A</mi><mi>C</mi></math> is an adiabatic, which of the graphs correctly represents given in figure?", "image": null}, "options": [{"id": "rCpoF", "text": "<br/><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image2-d7f132a0-1ead-4743-a3e3-8c995e47d5a9.jpg\" style=\"width: 211px; height: 221px;\" />", "image": null, "isCorrect": false}, {"id": "vMSl2", "text": "<br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image3-f6969aea-840e-4243-abab-a67d2923a4d0.jpg\" style=\"width: 215px; height: 209px;\" />", "image": null, "isCorrect": true}, {"id": "TgDIa", "text": "<br/><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image4-f3db6a24-0abd-4553-ae72-a4fb0e34e54f.jpg\" style=\"width: 211px; height: 210px;\" />", "image": null, "isCorrect": false}, {"id": "NG4H8", "text": "<br/><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image5-5f9ca48f-ec92-4edf-88e9-de3bfd8b77ef.jpg\" style=\"width: 223px; height: 206px;\" />", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As slope of adiabatic <math><mi>A</mi><mi>C</mi></math> is more than the slope of isothermal <math><mi>A</mi><mi>B</mi></math>, and <math> <mrow>  <mtext>BC</mtext></mrow></math> is isochoric (<math><mi>i</mi><mi>e</mi></math> at constant volume), therefore, figure (b) represents the curves correctly", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863780558b3fde89759", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "105", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A diatomic ideal gas is heated at constant volume until the pressure is doubled and again heated at constant pressure until the volume is doubled. The average molar heat capacity for the whole process is", "image": null}, "options": [{"id": "McuOg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>1</mn><mn>3</mn><mi>R</mi></mrow><mn>6</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "7puWO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>1</mn><mn>9</mn><mi>R</mi></mrow><mn>6</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "hu9I7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mn>3</mn><mi>R</mi></mrow><mn>6</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "BhOxK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>1</mn><mn>7</mn><mi>R</mi></mrow><mn>6</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let initial pressure, volume and temperature be P<sub>0</sub>, V<sub>0</sub> and T<sub>0</sub>, respectively, indicated by state A in P-V diagram. The gas is then isochorically taken to state B (2P<sub>0</sub>, V<sub>0</sub>, 2T<sub>0</sub>) and then taken from state B to state C (2P<sub>0</sub>, 2V<sub>0</sub>, 4T<sub>0</sub>) isobarically.<br /><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029739_Ans..jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 237px; height: 195px;\" /><br /><br /><br />Total heat absorbed by 1 mol of gas<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>Δ</mo> <mtext>Q</mtext> <mo>=</mo> <msub> <mtext>C</mtext> <mtext>v</mtext> </msub> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>2</mn> <msub> <mtext>T</mtext> <mn>0</mn> </msub> <mo>-</mo> <msub> <mtext>T</mtext> <mn>0</mn> </msub> </mrow> </mfenced> <mo>+</mo> <msub> <mtext>C</mtext> <mtext>P</mtext> </msub> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>4</mn> <msub> <mtext>T</mtext> <mn>0</mn> </msub> <mo>-</mo> <mn>2</mn> <msub> <mtext>T</mtext> <mn>0</mn> </msub> </mrow> </mfenced> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msub> <mtext>RT</mtext> <mn>0</mn> </msub> <mo>+</mo> <mfrac> <mrow> <mn>7</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> <mo>×</mo> <mn>2</mn> <msub> <mtext>T</mtext> <mn>0</mn> </msub> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>9</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msub> <mtext>RT</mtext> <mn>0</mn> </msub> </mrow> </math><br /><br />Total change in temperature from series A to C is <math> <mrow> <mo>Δ</mo> <mtext>T</mtext> <mo>=</mo> <mn>3</mn> <msub> <mtext>T</mtext> <mn>0</mn> </msub> </mrow> </math><br /><br />Therefore,<br /><br />Molar heat capacity <math> <mrow> <mo>=</mo> <mfrac> <mrow> <mo>Δ</mo> <mtext>Q</mtext> </mrow> <mrow> <mo>Δ</mo> <mtext>T</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mfrac> <mrow> <mn>1</mn> <mn>9</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msub> <mtext>RT</mtext> <mn>0</mn> </msub> </mrow> <mrow> <mn>3</mn> <msub> <mtext>T</mtext> <mn>0</mn> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>9</mn> </mrow> <mrow> <mn>6</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86375babc92dce9b178", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "33", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A monatomic ideal gas sample is given heat <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Q</mi></math>. One half of this heat is used as work done by the gas and rest is used for increasing its internal energy. The equation of process in terms of volume and temperature is", "image": null}, "options": [{"id": "hFTIX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi mathvariant=\"normal\">V</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">T</mi><mn>3</mn></msup></mfrac><mo>=</mo></math> constant", "image": null, "isCorrect": true}, {"id": "bhOfF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi mathvariant=\"normal\">V</mi><mn>2</mn></msup><msqrt><mi mathvariant=\"normal\">T</mi></msqrt></mfrac><mo>=</mo></math> constant", "image": null, "isCorrect": false}, {"id": "T7ASF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>VT</mi><mn>3</mn></msup><mo>=</mo></math> constant", "image": null, "isCorrect": false}, {"id": "PjOUn", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">V</mi><mn>2</mn></msup><msqrt><mi mathvariant=\"normal\">T</mi></msqrt><mo>=</mo></math> constant", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>PdV</mi><mo>=</mo><msub><mi>nC</mi><mi mathvariant=\"normal\">v</mi></msub><mi>dT</mi><mi mathvariant=\"normal\">&nbsp;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mi>nRT</mi><mi mathvariant=\"normal\">V</mi></mfrac><mi>dV</mi><mo>=</mo><msub><mi>nC</mi><mi mathvariant=\"normal\">v</mi></msub><mi>dT</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mi>dV</mi><mi mathvariant=\"normal\">V</mi></mfrac><mo>=</mo><mfrac><mn>3</mn><mn>1</mn></mfrac><mfrac><mi>dT</mi><mi mathvariant=\"normal\">T</mi></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">V</mi><mn>2</mn></msup><mo>=</mo><msup><mi>CT</mi><mn>3</mn></msup></math>,&nbsp;Where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math> is a constant.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86372e69df94c0b7b75", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "50", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Corresponding to the process shown in figure, the heat given to the gas in the process&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mi>C</mi><mi>A</mi></math> is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>0</mn><mo>.</mo><mn>2</mn><mi>x</mi></mrow></mfenced></math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">J</mi></math>. Find value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>.<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/anjana.PNG\" style=\"width: 390px; height: 230px;\" />", "image": null}, "options": [], "correctValue": "5", "solution": {"text": "Cycle is clockwise. Hence heat will be given to the gas, as work done will be positive.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>=</mo><mi>W</mi><mo>=</mo></math>&nbsp;area of cycle =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636c6f321199f9f15d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "102", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A litre of dry air at STP allowed to expand to a volume of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">L</mi></math> under adiabatic conditions. If <math><mi mathvariant=\"normal\">γ</mi><mo>=</mo><mn>1.40</mn></math>, the work done is <math><mo>(</mo><msup><mrow><mn>3</mn></mrow><mrow><mn>1.4</mn></mrow></msup><mo>=</mo><mn>4.6555</mn><mo>)</mo></math>", "image": null}, "options": [{"id": "pIIvq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>48</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 38px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "jUkQG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60.7</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 38px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "y6QBl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>90.5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 38px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "wJedu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100.8</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 38px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here, <math><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>1</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">L</mi><mo>=</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><mi mathvariant=\"normal\">&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>3</mn></mrow></msup><mo>,</mo><mi mathvariant=\"normal\">&nbsp;</mi><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>3</mn><mi mathvariant=\"normal\">L</mi><mo>=</mo><mn>3</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>3</mn></mrow></msup></math><br /><br /><math><msub><mrow><mi>p</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>1</mn></math> atm <math><mo>=</mo><mn>1.013</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>5</mn></mrow></msup><mi mathvariant=\"normal\">N</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>,</mo><mi>&nbsp;</mi><mi mathvariant=\"normal\">γ</mi><mo>=</mo><mn>1.40</mn><mo>,</mo><mi>&nbsp;</mi><mtext>W</mtext><mo>=</mo><mo>?</mo></math><br /><br />As changes are adiabatic,<br /><br /><math><msub><mrow><mi>p</mi></mrow><mrow><mn>1</mn></mrow></msub><msubsup><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">γ</mi></mrow></msubsup><mo>=</mo><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub><msubsup><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow><mrow><mi mathvariant=\"normal\">γ</mi></mrow></msubsup></math><br /><br /><math><mfrac><mrow><msub><mrow><mi>p</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><msub><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></mrow></mfenced></mrow><mrow><mi mathvariant=\"normal\">γ</mi></mrow></msup><mo>=</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>3</mn></mrow></mfenced></mrow><mrow><mn>1.4</mn></mrow></msup><mo>=</mo><mn>4.6555</mn></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><msub><mrow><mi>p</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><mn>4.6555</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1.013</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>5</mn></mrow></msup></mrow><mrow><mn>4.6555</mn></mrow></mfrac></math><br /><br /><math><mo>=</mo><mn>0.217</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>5</mn></mrow></msup><mi>&nbsp;</mi><mi mathvariant=\"normal\">N</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></math><br /><br />Work done, W<math><mo>=</mo><mfrac><mrow><msub><mrow><mi>p</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mi mathvariant=\"normal\">γ</mi><mo>-</mo><mn>1</mn></mrow></mfrac></math><br /><br /><math><mtext>W=</mtext><mfrac><mrow><mn>1.013</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>5</mn></mrow></msup><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>-</mo><mn>0.217</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>5</mn></mrow></msup><mo>×</mo><mn>3</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></mrow><mrow><mn>1.4</mn><mo>-</mo><mn>1</mn></mrow></mfrac></math><br /><br /><math> <mrow>  <mtext>W</mtext><mo>=</mo><mn>90.5</mn><mo>&#x00A0;</mo><mtext>J</mtext></mrow></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636a46327b273dfee5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "87", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Consider an ideal gas confined in an isolated closed chamber. As the gas undergoes an adiabatic expansion, the average time of collision between molecules increases as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>V</mi><mi>q</mi></msup></math> , where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi></math> is the volume of the gas. The value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi></math> is:<br />\r<br />\r<math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">γ</mi><mo>=</mo><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mi mathvariant=\"normal\">P</mi></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mi mathvariant=\"normal\">v</mi></mrow></msub></mrow></mfrac></mrow></mfenced></math>", "image": null}, "options": [{"id": "8392u", "text": "<math><mfrac><mrow><mi mathvariant=\"normal\">γ</mi><mo>-</mo><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "4XqAV", "text": "<math><mfrac><mrow><mn>3</mn><mi mathvariant=\"normal\">γ</mi><mo>+</mo><mn>1</mn></mrow><mrow><mn>6</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "JAeTl", "text": "<math><mfrac><mrow><mn>3</mn><mi mathvariant=\"normal\">γ</mi><mo>-</mo><mn>5</mn></mrow><mrow><mn>6</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "OWYWS", "text": "<math><mfrac><mrow><mi mathvariant=\"normal\">γ</mi><mo>+</mo><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Average time of collision <br/><br/> <math><mi>t</mi><mo>=</mo><mfrac><mrow><mi>m</mi><mi>e</mi><mi>a</mi><mi>n</mi><mi> </mi><mi>f</mi><mi>r</mi><mi>e</mi><mi>e</mi><mi> </mi><mi>p</mi><mi>a</mi><mi>t</mi><mi>h</mi><mo>(</mo><mi>λ</mi><mo>)</mo></mrow><mrow><mi>a</mi><mi>v</mi><mi>e</mi><mi>r</mi><mi>a</mi><mi>g</mi><mi>e</mi><mi> </mi><mi>s</mi><mi>p</mi><mi>e</mi><mi>e</mi><mi>d</mi><mi> </mi><mo>(</mo><mi>v</mi><mo>)</mo></mrow></mfrac></math> <br/><br/> <math><mi>t</mi><mo>∝</mo><mfrac><mrow><mi>λ</mi></mrow><mrow><mi>v</mi></mrow></mfrac></math> <br/><br/> <math><mo>∵</mo><mi>λ</mi><mo>∝</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>n</mi><mi>o</mi><mo>.</mo><mi> </mi><mi>o</mi><mi>f</mi><mi> </mi><mi>m</mi><mi>o</mi><mi>l</mi><mi>e</mi><mi>c</mi><mi>u</mi><mi>l</mi><mi>e</mi><mi>s</mi><mi> </mi><mi>p</mi><mi>e</mi><mi>r</mi><mi> </mi><mi>u</mi><mi>n</mi><mi>i</mi><mi>t</mi><mi> </mi><mi>v</mi><mi>o</mi><mi>l</mi><mi>u<  "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<math><mi>P</mi></math> - <math><mi>V</mi></math> diagram of an ideal gas is shown. The gas undergoes from initial state <math> <mi>A</mi> </math> to final state <math> <mi>B</mi> </math> such that initial and final volumes are same. Select the correct alternative for given process <math> <mrow> <mi>A</mi><mi>B</mi></mrow> </math>.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/335280q.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 161px; height: 131px;\" />", "image": null}, "options": [{"id": "VfeP3", "text": "Work done by gas is positive", "image": null, "isCorrect": false}, {"id": "EmAth", "text": "Work done by gas is negative", "image": null, "isCorrect": true}, {"id": "lA6jL", "text": "Temperature of gas increases continuously", "image": null, "isCorrect": false}, {"id": "9svgD", "text": "Process is isochoric", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/335280s.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 142px; height: 125px;\" /><br /><br />Volume does not remain constant throughout the process <math> <mrow>  <mi>A</mi><mi>B</mi></mrow></math>. As <math><mi>T</mi><mo>=</mo><mfrac><mrow><mi>P</mi><mi>V</mi></mrow><mrow><mi>n</mi><mi>R</mi></mrow></mfrac></math>, temperature decreases initially as both <math> <mi>P</mi></math> and <math> <mi>V</mi></math> decreases. By area under curve, net work done is negative.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634e853005508cee2e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "59", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "During an adiabatic process, the pressure of a gas is found to be proportional to the cube of its absolute temperature. The ratio <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>C</mi><mi mathvariant=\"normal\">P</mi></msub><msub><mi>C</mi><mi mathvariant=\"normal\">V</mi></msub></mfrac></math>&nbsp; for the gas is", "image": null}, "options": [{"id": "t2r1Z", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac bevelled=\"true\"><mn>4</mn><mn>3</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "c71bG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "0RCfv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac bevelled=\"true\"><mn>5</mn><mn>3</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "oc7w7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac bevelled=\"true\"><mn>3</mn><mn>2</mn></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In an adiabatic process, <math> <mrow> <msup> <mtext mathvariant=\"italic\">T</mtext> <mi>γ</mi> </msup> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>constant</mtext> </mrow> </mfenced> <msup> <mtext mathvariant=\"italic\">P</mtext> <mrow> <mi>γ</mi> <mo>-</mo> <mn>1</mn> </mrow> </msup> </mrow> </math><br />or&nbsp;&nbsp;<math>&nbsp; <mrow> <msup> <mtext mathvariant=\"italic\">T</mtext> <mrow> <mi>γ</mi> <mo>/</mo> <mi>γ</mi> <mo>-</mo> <mn>1</mn> </mrow> </msup> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>constant</mtext> </mrow></mfenced><mtext mathvariant=\"italic\">&nbsp;P</mtext> </mrow> </math><br /><br />Given&nbsp;<math> <mrow> <msup> <mtext mathvariant=\"italic\">T</mtext> <mn>3</mn> </msup> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>constant</mtext> </mrow> </mfenced> <mtext mathvariant=\"italic\">&nbsp;P</mtext> </mrow> </math><br /><br /><math> <mrow> <mo>∴</mo> </mrow> </math>&nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <mi>γ</mi> </mrow> <mrow> <mi>γ</mi> <mo>-</mo> <mn>1</mn> </mrow> </mfrac> <mo>=</mo> <mn>3</mn> <mo>⇒</mo> <mn>3</mn> <mi>γ</mi> <mo>-</mo> <mn>3</mn> <mo>=</mo> <mi>γ</mi> </mrow> </math><br /><br />or&nbsp;&nbsp;<math>&nbsp; <mrow> <mn>2</mn> <mi>γ</mi> <mo>=</mo> <mn>3</mn> <mo>⇒</mo> <mi>γ</mi> <mo>=</mo> <mn>3</mn> <mo>/</mo> <mn>2</mn></mrow></math><br /><br />For monoatomic gas, <math> <mrow> <mi>γ</mi> <mo>=</mo> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> </mrow> </math> = 1.67<br /><br />For diatomic gas, <math> <mrow> <mi>γ</mi> <mo>=</mo> <mfrac> <mrow> <mn>7</mn> </mrow> <mrow> <mn>5</mn> </mrow> </mfrac> </mrow> </math> = 1.4<br /><br />when <math> <mrow> <mi>γ</mi> </mrow> </math> = 1.5, the gas must be a suitable mixture of monoatomic and diatomic gases<br /><br /><math> <mrow> <mo>∴</mo> </mrow> </math>&nbsp;&nbsp;<math>&nbsp;&nbsp; <mrow> <mi>γ</mi> </mrow> </math> = 3/2.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634c347621a65d1ab8", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "66", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "One mole of a perfect gas, initially at a pressure and temperature of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>10</mn><mn>5</mn></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math>, respectively, expands isothermally until its volume is doubled and then adiabatically until its volume is again doubled. Find the final pressure of the gas. Given <math> <mrow> <mi>γ</mi> <mo>=</mo> <mtext>1.4</mtext> </mrow> </math>.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0036010_Question.jpg\" style=\"width: 231px; height: 174px;\" />", "image": null}, "options": [{"id": "z6AUX", "text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mn>0</mn><mo>.</mo><mn>5</mn></mrow></mfenced><mrow><mn>2</mn><mo>.</mo><mn>4</mn></mrow></msup><mo>×</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math></p>", "image": null, "isCorrect": true}, {"id": "FsKQt", "text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mn>0</mn><mo>.</mo><mn>5</mn></mrow></mfenced><mrow><mn>1</mn><mo>.</mo><mn>4</mn></mrow></msup><mo>&#215;</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math></p>", "image": null, "isCorrect": false}, {"id": "Hw7hu", "text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mn>0</mn><mo>.</mo><mn>5</mn></mrow></mfenced><mrow><mn>2</mn><mo>.</mo><mn>4</mn></mrow></msup><mo>&#215;</mo><msup><mn>10</mn><mn>6</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math></p>", "image": null, "isCorrect": false}, {"id": "48Zpc", "text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mn>0</mn><mo>.</mo><mn>5</mn></mrow></mfenced><mrow><mn>1</mn><mo>.</mo><mn>4</mn></mrow></msup><mo>&#215;</mo><msup><mn>10</mn><mn>6</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math></p>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>V</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>T</mi><mn>1</mn></msub></math> be the initial pressure, volume and the temperature of the gas, respectively. For isothermal expansion (1 to 2), we have<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mo>&#160;</mo><msub><mi>V</mi><mn>2</mn></msub><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>2</mn><msub><mi>V</mi><mn>1</mn></msub><mo>&#160;</mo><mo>;</mo><mo>&#160;</mo><mo>&#160;</mo><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><msub><mi>P</mi><mn>2</mn></msub><mo>&#160;</mo><msub><mi>V</mi><mn>2</mn></msub></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mo>&#160;</mo><msub><mi>P</mi><mn>2</mn></msub><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><msub><mi>P</mi><mn>1</mn></msub><mfenced><mfrac bevelled=\"true\"><msub><mi>V</mi><mn>1</mn></msub><msub><mi>V</mi><mn>2</mn></msub></mfrac></mfenced><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac bevelled=\"true\"><msub><mi>P</mi><mn>1</mn></msub><mn>2</mn></mfrac><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>0</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math><br /><br.>&nbsp; </br.><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><msub><mi>T</mi><mn>2</mn></msub><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><msub><mi>T</mi><mn>1</mn></msub><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>300</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math><br /><br />For adiabatic expansion (2 to 3),<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">P</mtext><mn>2</mn></msub><msubsup><mtext mathvariant=\"italic\">V</mtext><mn>2</mn><mi>&#947;</mi></msubsup><mo>=</mo><msub><mtext mathvariant=\"italic\">P</mtext><mn>3</mn></msub><msubsup><mtext mathvariant=\"italic\">V</mtext><mn>3</mn><mi>&#947;</mi></msubsup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;&#160;&#160;&#160;</mo><msub><mtext mathvariant=\"italic\">V</mtext><mn>3</mn></msub><mo>=</mo><mn>2</mn><msub><mtext mathvariant=\"italic\">V</mtext><mn>2</mn></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;&#160;&#160;&#160;</mo><msub><mtext mathvariant=\"italic\">P</mtext><mn>3</mn></msub><mo>=</mo><msub><mtext mathvariant=\"italic\">P</mtext><mn>2</mn></msub><msup><mfenced><mfrac><msub><mtext mathvariant=\"italic\">V</mtext><mn>2</mn></msub><msub><mtext mathvariant=\"italic\">V</mtext><mn>3</mn></msub></mfrac></mfenced><mi>&#947;</mi></msup><mo>=</mo><mtext>0.5</mtext><mo>&#215;</mo><mn>1</mn><msup><mn>0</mn><mn>5</mn></msup><mo>&#215;</mo><msup><mfenced><mtext>0.5</mtext></mfenced><mtext>1.4</mtext></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mo>&#160;</mo><msub><mi>P</mi><mn>3</mn></msub><mo>=</mo><msup><mfenced><mrow><mn>0</mn><mo>.</mo><mn>5</mn></mrow></mfenced><mrow><mn>2</mn><mo>.</mo><mn>4</mn></mrow></msup><mo>&#215;</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math><br />&nbsp;</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634b922e6bb6b03078", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "15", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>Temperature and volume curves are drawn for&nbsp;two thermodynamic processes. For the first process, it is a straight line and for the second, it is a rectangular hyperbola. The ratio of work done in the first process to the work done in the second process is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013421_Question_1.jpg\" style=\"width: 350px; height: 141px;\" /></p>\r", "image": null}, "options": [{"id": "RUCUL", "text": "2:1", "image": null, "isCorrect": true}, {"id": "ZD6Zq", "text": "3:1", "image": null, "isCorrect": false}, {"id": "wCrLF", "text": "4:1", "image": null, "isCorrect": false}, {"id": "U2ap8", "text": "3:2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013421_AnsExp_1.jpg\" style=\"width: 140px; height: 120px;\" /><br />The first process is a constant pressure process, hence<br />w<sub>1</sub> = nR(2T<sub>0</sub> - T<sub>0</sub>) = nRT<sub>0</sub><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013421_AnsExp_2.jpg\" style=\"width: 140px; height: 129px;\" /><br />The equation for the second process is<br /><math><mrow><mtext>T</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>c</mtext> </mrow> <mrow> <mtext>V</mtext> </mrow></mfrac></mrow></math><br />Hence,&nbsp;<math> <mrow> <mtext>P</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>nRT</mtext> </mrow> <mrow> <mtext>V</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>nRc</mtext> </mrow> <mrow> <msup> <mtext>V</mtext> <mn>2</mn></msup></mrow></mfrac></mrow></math><br /><math> <mrow> <mo>∴&nbsp;&nbsp;&nbsp;&nbsp;</mo> <mtext>w</mtext> <mo>=</mo> <munderover> <mo>∫</mo> <msub> <mtext>V</mtext> <mn>0</mn> </msub> <mrow> <mn>2</mn> <msub> <mtext>V</mtext> <mn>0</mn> </msub> </mrow> </munderover> <mtext>PdV</mtext> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>nRT</mtext> <mn>0</mn> </msub> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>∴&nbsp;&nbsp;&nbsp;</mo> <mfrac> <mrow> <msub> <mtext>w</mtext> <mn>1</mn> </msub> </mrow> <mrow> <msub> <mtext>w</mtext> <mn>2</mn> </msub> </mrow> </mfrac> <mo>=</mo> <mn>2&nbsp;</mn> <mtext>:&nbsp;</mtext> <mn>1</mn> </mrow> </math><br />∴&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;2 : 1", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633f86c06831312cc8", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "27", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A diatomic molecule can be modelled as two rigid balls connected with a spring such that the balls can vibrate with respect to the centre of mass of the system (spring + balls). Consider a diatomic gas made of such diatomic molecules. If the gas performs <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi></math>&nbsp;of work under isobaric condition, then heat given to the gas (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">J</mi></math>) is", "image": null}, "options": [], "correctValue": "70", "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>∆</mo><mi mathvariant=\"normal\">Q</mi></mrow><mi mathvariant=\"normal\">W</mi></mfrac><mo>=</mo><mfrac><mrow><msub><mi>nC</mi><mi mathvariant=\"normal\">p</mi></msub><mo>∆</mo><mi mathvariant=\"normal\">T</mi></mrow><mrow><mi>nR</mi><mo>∆</mo><mi mathvariant=\"normal\">T</mi></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mo>∆</mo><mi mathvariant=\"normal\">Q</mi><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">P</mi></msub><mi mathvariant=\"normal\">R</mi></mfrac><mo>.</mo><mi mathvariant=\"normal\">W</mi></math><br /><math><mo>=</mo><mfrac><mrow><mn>7</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>×</mo><mn>20</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <mo>=70</mo><mtext> </mtext><mtext>J</mtext></mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633cf27bacf8c0c22b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "54", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An ideal gas <math><mo>(</mo><mi mathvariant=\"normal\">γ</mi><mo>=</mo><mn>1.5</mn><mo>)</mo></math> is expanded adiabatically. How many times its initial volume should the gas be expanded to reduce the root mean square velocity of molecules by a factor of&nbsp;<math><mrow><mtext>2</mtext></mrow></math>?", "image": null}, "options": [{"id": "UoMCi", "text": "<math > <mtext>4</mtext></math> times", "image": null, "isCorrect": false}, {"id": "3sqTV", "text": "<math> <mrow> <mtext>16</mtext></mrow> </math> times", "image": null, "isCorrect": true}, {"id": "9TLmK", "text": "<math> <mtext>8</mtext></math> times", "image": null, "isCorrect": false}, {"id": "3ZiUB", "text": "<math> <mtext>2</mtext></math> times", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">v</mi><mi>rms</mi></msub><mo>=</mo><msqrt><mfrac><mrow><mn>3</mn><mi>RT</mi></mrow><mi mathvariant=\"normal\">M</mi></mfrac></msqrt><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mi>or</mi><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><msub><mi mathvariant=\"normal\">v</mi><mi>rms</mi></msub><mo>∝</mo><msqrt><mi mathvariant=\"normal\">T</mi></msqrt></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">v</mi><mi>rms</mi></msub></math> is to reduce two times, i.e.&nbsp;the temperature of the gas will have to reduce four times or<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi mathvariant=\"normal\">T</mi><mi mathvariant=\"normal\">'</mi></mrow><mi mathvariant=\"normal\">T</mi></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></math><br /><br />During the adiabatic process,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>⁡</mo><mi mathvariant=\"normal\">V</mi><msup><mo>⁡</mo><mrow><mi mathvariant=\"normal\">γ</mi><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo><mi mathvariant=\"normal\">T</mi><msup><mo>⁡</mo><mo>'</mo></msup><mi mathvariant=\"normal\">V</mi><msup><mo>⁡</mo><mrow><mo>'</mo><mi mathvariant=\"normal\">γ</mi><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br />or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi mathvariant=\"normal\">V</mi><msup><mo>⁡</mo><mo>'</mo></msup></mrow><mi mathvariant=\"normal\">V</mi></mfrac><mo>=</mo><msup><mfenced separators=\"|\"><mfrac><mi mathvariant=\"normal\">T</mi><msup><mi mathvariant=\"normal\">T</mi><mi mathvariant=\"normal\">'</mi></msup></mfrac></mfenced><mfrac><mn>1</mn><mrow><mi mathvariant=\"normal\">γ</mi><mo>-</mo><mn>1</mn></mrow></mfrac></msup></math><br /><br /><math><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mo>=</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>4</mn></mrow></mfenced></mrow><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>1.5</mn><mo>-</mo><mn>1</mn></mrow></mfrac></mrow></msup><mo>=</mo><msup><mrow><mn>4</mn></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>16</mn></math><br /><br /><math><mo>∴</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">V</mi><mi mathvariant=\"normal\">'</mi></msup><mo>=</mo><mn>16</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">V</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86337291518d3e6818d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "105", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>Two soap bubbles of radii x and y coalesce to constitute a bubble of radius z. Then z is equal to</p>\r", "image": null}, "options": [{"id": "o0Wva", "text": "<math><msqrt><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup></msqrt></math>", "image": null, "isCorrect": true}, {"id": "5cgIj", "text": "<math><msqrt><mi>x</mi><mo>+</mo><mi>y</mi></msqrt></math>", "image": null, "isCorrect": false}, {"id": "lLKlb", "text": "<math><mi>x</mi><mo>+</mo><mi>y</mi></math>", "image": null, "isCorrect": false}, {"id": "iDqC7", "text": "<math><mfrac><mrow><mi>x</mi><mo>+</mo><mi>y</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi>n</mi><mo>=</mo><msub><mrow><mi>n</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br /><math><mi>p</mi><mi>V</mi><mo>=</mo><msub><mrow><mi>p</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029179_Ans.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"opacity: 0.9; width: 200px; height: 62px;\" /><br /><br /><math><msub><mrow><mi>p</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi>p</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>+</mo><mfrac><mrow><mn>4</mn><mi>T</mi></mrow><mrow><mi>x</mi></mrow></mfrac><mo>,</mo><mi>&nbsp;</mi><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><msub><mrow><mi>p</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>+</mo><mfrac><mrow><mn>4</mn><mi>T</mi></mrow><mrow><mi>y</mi></mrow></mfrac><mo>,</mo><mi>&nbsp;</mi><mi>p</mi><mo>=</mo><msub><mrow><mi>p</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>+</mo><mfrac><mrow><mn>4</mn><mi>T</mi></mrow><mrow><mi>z</mi></mrow></mfrac></math><br /><br />If the process takes place is vacuum then <math><msub><mrow><mi>p</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mn>0</mn></math><br /><br /><math><msub><mrow><mi>p</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>4</mn><mi>T</mi></mrow><mrow><mi>x</mi></mrow></mfrac><mo>,</mo><mi>&nbsp;</mi><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>4</mn><mi>T</mi></mrow><mrow><mi>y</mi></mrow></mfrac><mo>,</mo><mi>&nbsp;</mi><mi>p</mi><mo>=</mo><mfrac><mrow><mn>4</mn><mi>T</mi></mrow><mrow><mi>z</mi></mrow></mfrac></math><br /><br />If process is isothermal<br /><br /><math><mo>&there4;</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>p</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mi>p</mi><mi>V</mi></math><br /><br /><math><mo>&there4;</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>z</mi><mo>=</mo><msqrt><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863357947b384b434d4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "78", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An ideal gas expands isothermally from a volume <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>1</mn></msub></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>2</mn></msub></math> and then compressed to original volume <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>1</mn></msub></math> adiabatically. The initial pressure is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub></math> and final pressure is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>3</mn></msub></math>. The total work done is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi></math>. Then:", "image": null}, "options": [{"id": "ql7fT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>3</mn></msub><mo>&#62;</mo><msub><mi>P</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><mi>W</mi><mo>&#62;</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "UcOb1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>3</mn></msub><mo>&#60;</mo><msub><mi>P</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><mi>W</mi><mo>&#60;</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "5W2YW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>3</mn></msub><mo>&#62;</mo><msub><mi>P</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><mi>W</mi><mo>&#60;</mo><mn>0</mn></math>", "image": null, "isCorrect": true}, {"id": "CnKqo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>3</mn></msub><mo>=</mo><msub><mi>P</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><mi>W</mi><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From the graph it is clear that <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>3</mn></msub><mo>&#62;</mo><msub><mi>P</mi><mn>1</mn></msub></math> .<br />Since the area under adiabatic process <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">E</mi><mi mathvariant=\"normal\">D</mi></mrow></mfenced></math> is greater than that of the isothermal process <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">D</mi></mrow></mfenced></math> . Therefore net word done<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><msub><mi>W</mi><mi mathvariant=\"normal\">i</mi></msub><mo>+</mo><mfenced separators=\"|\"><mrow><mo>-</mo><msub><mi>W</mi><mi>A</mi></msub></mrow></mfenced></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8757;</mo><mo>&#160;</mo><msub><mi>W</mi><mi mathvariant=\"normal\">A</mi></msub><mo>&#62;</mo><msub><mi>W</mi><mi mathvariant=\"normal\">i</mi></msub><mo>&#8658;</mo><mi>W</mi><mo>&#60;</mo><mn>0</mn></math><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/bf8690b9-59e2-48b0-8772-05ff4a5040a6.png\" style=\"max-width:100%; object-fit:contain\" style=\"width:2.07774in;height:1.70755in\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863355fd2568165c557", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "48", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two gases occupy two containers <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>; the gas in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>, of volume <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>10</mn><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>3</mn></msup></math>, exerts a pressure of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>40</mn><mo>&nbsp;</mo><mi>MPa</mi></math> and that in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>, of volume <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>15</mn><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>3</mn></msup></math>, exerts a pressure <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>7</mn><mo>&nbsp;</mo><mi>MPa</mi></math>. The two containers are joined by a tube of negligible volume and the gases are allowed to intermingle. Then if the temperature remains constant, the final pressure in the containers will be (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>MPa</mi></math>)", "image": null}, "options": [{"id": "IAyFC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>90</mn></math>", "image": null, "isCorrect": false}, {"id": "LItKk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>98</mn></math>", "image": null, "isCorrect": true}, {"id": "wypza", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>40</mn></math>", "image": null, "isCorrect": false}, {"id": "StyZM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>10</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As the quantity of gas remains constant <math> <mrow> <msub> <mi>&#956;</mi> <mtext>A</mtext> </msub> <mo>+</mo> <msub> <mi>&#956;</mi> <mtext>B</mtext> </msub> <mo>=</mo> <mi>&#956;</mi> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>P</mi><mtext>A</mtext></msub><msub><mi>V</mi><mtext>A</mtext></msub></mrow><mrow><mi>R</mi><mi>T</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><msub><mi>P</mi><mtext>B</mtext></msub><msub><mi>V</mi><mtext>B</mtext></msub></mrow><mrow><mi>R</mi><mi>T</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>P</mi><mfenced><mrow><msub><mtext>V</mtext><mtext>A</mtext></msub><mo>+</mo><msub><mi>V</mi><mtext>B</mtext></msub></mrow></mfenced></mrow><mrow><mi>R</mi><mi>T</mi></mrow></mfrac></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mfrac><mrow><msub><mi>P</mi><mtext>A</mtext></msub><msub><mi>V</mi><mtext>A</mtext></msub><mo>+</mo><msub><mi>P</mi><mtext>B</mtext></msub><msub><mi>V</mi><mtext>B</mtext></msub></mrow><mrow><msub><mi>V</mi><mtext>A</mtext></msub><mo>+</mo><msub><mi>V</mi><mtext>B</mtext></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mtext>1.4</mtext><mo>&#215;</mo><mtext>0.1</mtext><mo>+</mo><mtext>0.7</mtext><mo>&#215;</mo><mtext>0.15</mtext></mrow><mrow><mtext>0.1</mtext><mo>+</mo><mtext>0.15</mtext></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;&#160;&#160;&#160;</mo><mi>P</mi><mo>=</mo><mtext>0.98 MPa</mtext></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632cedf0dd32b8401d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "26", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An ideal gas is taken through the cycle&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>A</mtext><mo>→</mo><mtext>B</mtext><mo>→</mo><mtext>C</mtext><mo>→</mo><mi mathvariant=\"normal\">A</mi></math>, as shown in the figure. If the net heat supplied to the gas in the cycle is <math> <mrow> <mn>5</mn><mtext> </mtext><mtext>J</mtext></mrow></math>, the work done by the gas in the process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>C</mtext><mo>→</mo><mtext>A</mtext></math>&nbsp;&nbsp;is<br />\r<span style=\"line-height: 1.6em;\">&nbsp; &nbsp;</span><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0006066_Ques1_1.jpg\" style=\"line-height: 1.6em; width: 287px; height: 228px;\" />", "image": null}, "options": [{"id": "bQa6L", "text": "<math> <mrow> <mo>−</mo><mn>5</mn><mtext>&nbsp;J</mtext></mrow> </math>", "image": null, "isCorrect": true}, {"id": "MBzd6", "text": "<math> <mrow>  <mo>&#x2212;</mo><mn>10</mn><mtext>&#x00A0;J</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "JAWkf", "text": "<math> <mrow>  <mo>&#x2212;</mo><mn>15</mn><mtext>&#x00A0;J</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "eI7uz", "text": "<math> <mrow>  <mo>&#x2212;</mo><mn>20</mn><mtext>&#x00A0;J</mtext></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <mo>&#916;</mo> <msub> <mtext>W</mtext> <mtext>AB</mtext> </msub> <mo>=</mo> <mn>p</mn> <mo>&#916;</mo> <mn>V</mn> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>1</mn> <mn>0</mn> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>2</mn> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> <mo>=</mo> <mtext>10 J</mtext> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#916;</mo><msub><mtext>W</mtext><mtext>BC</mtext></msub><mo>=</mo><mn>0</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mfenced><mtext>as V = constant</mtext></mfenced></math><br /><br />From first law of thermodynamics,<br /><br /><math>&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160; <mrow> <mo>&#916;</mo> <mtext>Q</mtext> <mo>=</mo> <mo>&#916;</mo> <mn>W</mn> <mo>+</mo> <mo>&#916;</mo> <mn>U</mn> </mrow> </math><br /><br /><math> <mrow> <mo>&#916;</mo> <mtext>U</mtext> <mo>=</mo> <mn>0 &#160; &#160; &#160; &#160;</mn> </mrow> </math>&nbsp;<br /><br />Process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ABCA</mi></math> is cyclic,<br /><br /><math> <mrow> <mo>&#8756;</mo>&#160; <mo>&#916;</mo> <mtext>Q</mtext> <mo>=</mo> <mo>&#916;</mo> <msub> <mn>W</mn> <mn>AB</mn> </msub> <mo>+</mo> <mo>&#916;</mo> <msub> <mn>W</mn> <mn>BC</mn> </msub> <mo>+</mo> <mo>&#916;</mo> <msub> <mn>W</mn> <mn>CA</mn> </msub> </mrow> </math><br /><br /><math> <mrow> <mo>&#8756;</mo>&#160; <mo>&#916;</mo> <msub> <mn>W</mn> <mn>CA</mn> </msub> <mo>=</mo> <mo>&#916;</mo> <mtext>Q</mtext> <mo>-</mo> <mo>&#916;</mo> <msub> <mn>W</mn> <mn>AB</mn> </msub> <mo>-</mo> <mo>&#916;</mo> <mn>W</mn> <mn>BC</mn> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math><mrow> <mo>=</mo> <mn>5</mn> <mo>-</mo> <mn>1</mn> <mn>0</mn> <mo>-</mo> <mn>0</mn> <mo>=</mo> <mo>-</mo> <mtext>5 J</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632c581790ff6f6b36", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "52", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "One mole of a monoatomic ideal gas undergoes the process <math><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>⟶</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">B</mi></math>, as in the given <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>-</mo><mi>V</mi></math> diagram. The specific heat for this process is<br />\r<br />\r<br />\r<img alt=\"\" height=\"156\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image1-67d0f115-9220-4087-92cb-02cd662289cb.jpg\" width=\"226\" />", "image": null}, "options": [{"id": "9VqNQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><mi>R</mi></mrow><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "SjpVD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>15</mn><mi>R</mi></mrow><mn>7</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "8UdNM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>30</mn><mi>R</mi></mrow><mn>7</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "tOHvD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>20</mn><mi>R</mi></mrow><mn>7</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>Q</mi><mo>=</mo><mi>&#916;</mi><mi>U</mi><mo>+</mo><mi>W</mi></math> (From <math><msup><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">t</mi></mrow></msup></math> law)<br /><br />Here, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>U</mi><mo>=</mo><mi>n</mi><msub><mi>C</mi><mi>V</mi></msub><mi>&#916;</mi><mi>T</mi></math><br /><br />Temperature at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mi mathvariant=\"normal\">A</mi></msub><mo>=</mo><mfrac><mrow><mn>2</mn><msub><mi>P</mi><mn>0</mn></msub><msub><mi>V</mi><mn>0</mn></msub></mrow><mi>R</mi></mfrac></math><br /><br />At <math xmlns=\"http://ww
