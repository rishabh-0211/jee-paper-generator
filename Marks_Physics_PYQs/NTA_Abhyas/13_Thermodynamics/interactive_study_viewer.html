x; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "vws4d", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>500</mn><mo>&#160;</mo><mi>Pa</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 130px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mn>2</mn><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>3</mn><msub><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br /><math><msub><mrow><mi>P</mi></mrow><mrow><mn>1</mn></mrow></msub><mi>V</mi><mo>=</mo><mfrac><mrow><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><mi>M</mi></mrow></mfrac><mi>R</mi><mi>T</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>a</mi><mi>n</mi><mi>d</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>P</mi></mrow><mrow><mn>2</mn></mrow></msub><mi>V</mi><mo>=</mo><mfrac><mrow><msub><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mi>M</mi></mrow></mfrac><mi>R</mi><mi>T</mi><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mfrac><mrow><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><mi>M</mi></mrow></mfrac><mi>R</mi><mi>T</mi></math><br /><math><mfrac><mrow><msub><mrow><mi>P</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>P</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math> ………(i)<br />The process is isothermal <math><mfenced separators=\"|\"><mrow><msub><mrow><mi>P</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi>P</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></math><br />Hence, <math><mo>∆</mo><msub><mrow><mi>P</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi>P</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><mfrac><mrow><msub><mrow><mi>P</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><mn>2</mn></mrow></mfrac><mo>⇒</mo><msub><mrow><mi>P</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>2</mn><mo>∆</mo><msub><mrow><mi>P</mi></mrow><mrow><mn>1</mn></mrow></msub></math><br /><math><mo>∆</mo><msub><mrow><mi>P</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><msub><mrow><mi>P</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>-</mo><mfrac><mrow><msub><mrow><mi>P</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi>P</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac><msub><mrow><mi>P</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfrac><mrow><msub><mrow><mi>P</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><mn>3</mn></mrow></mfrac></math><br /><math><mo>∆</mo><msub><mrow><mi>P</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>∆</mo><msub><mrow><mi>P</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>.</mo><mn>300</mn></math><br /><math><mo>∆</mo><msub><mrow><mi>P</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>200</mn><mi>&nbsp;</mi><mi>P</mi><mi>a</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a3e12aab0aba834a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "38", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An ideal diatomic gas occupies a volume <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>1</mn></msub></math> at a pressure <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub></math>. The gas undergoes a process in which the pressure is proportional to the volume. If at the end of the process the R.M.S. speed of the gas molecules has doubled its initial value, then the heat supplied to the gas, in the given process, is", "image": null}, "options": [{"id": "6yjkz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "ImXhB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "w9iro", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub></math>", "image": null, "isCorrect": true}, {"id": "ZETBS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>As&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>&#8733;</mo><mi>V</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mi>V</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo><mi>constant</mi></math>&nbsp;</p><p>comparing the above equation with&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mi>V</mi><mi>x</mi></msup><mo>=</mo><mi>constant</mi></math>, we get&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mo>-</mo><mn>1</mn></math><br /><br />Also, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>=</mo><msub><mi>C</mi><mi>V</mi></msub><mo>-</mo><mfrac><mi>R</mi><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mn>5</mn><mn>2</mn></mfrac><mi>R</mi><mo>-</mo><mfrac><mi>R</mi><mrow><mo>-</mo><mn>1</mn><mo>-</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mn>3</mn><mi>R</mi></math><br /><br />But as RMS speed is doubled therefore temperature becomes four times.<br />Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>=</mo><mi>n</mi><mi>C</mi><mo>&#916;</mo><mi>T</mi><mo>=</mo><mi>n</mi><mo>&#215;</mo><mn>3</mn><mi>R</mi><mo>&#215;</mo><mn>3</mn><msub><mi>T</mi><mi>i</mi></msub><mo>=</mo><mn>9</mn><mi>n</mi><mi>R</mi><msub><mi>T</mi><mi>i</mi></msub></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>9</mn><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub></math>&nbsp;</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a2767ddd17bc6e9d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "49", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Three moles of an ideal gas undergo a cyclic process shown in figure. The work done by the gas during the process is [Take&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ln</mi><mo>(</mo><mn>2</mn><mo>)</mo><mo>=</mo><mn>0</mn><mo>.</mo><mn>693</mn></math>]<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/wenrdgmvqlbstmjwkylmjgyrfpxowpexvqaccfvhfsqrpalsvf.png\" />", "image": null}, "options": [{"id": "UsZW4", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2.36</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi>R</mi><msub><mi>T</mi><mn>0</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "JXncx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0.58</mn><mi mathvariant=\"normal\">&#160;</mi><mi>R</mi><msub><mi>T</mi><mn>0</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "MQsLo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1.16</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi>R</mi><msub><mi>T</mi><mn>0</mn></msub></math>", "image": null, "isCorrect": true}, {"id": "4mcEC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8211;</mo><mn>0.58</mn><mi mathvariant=\"normal\">&#160;</mi><mi>R</mi><msub><mi>T</mi><mn>0</mn></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If <math><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>0</mn></mrow></msub></math> be volume of the gas at <math><mi>C</mi><mo>,</mo><mi>&nbsp;</mi><msub><mrow><mi>P</mi></mrow><mrow><mn>0</mn></mrow></msub><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mn>3</mn><mi>R</mi><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub></math><br /><br /><math><mi>W</mi><mo>=</mo><mn>3</mn><mi>R</mi><mo>(</mo><mn>2</mn><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>)</mo><mi>l</mi><mi>n</mi><mn>2</mn><mo>–</mo><msub><mrow><mi>P</mi></mrow><mrow><mn>0</mn></mrow></msub><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></math><br /><br /><math><mo>=</mo><mn>6</mn><mi>R</mi><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>l</mi><mi>n</mi><mn>2</mn><mo>–</mo><mn>3</mn><mi>R</mi><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub></math><br /><br /><math><mo>=</mo><mn>3</mn><mi>R</mi><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>[</mo><mn>2</mn><mo>×</mo><mn>0.693</mn><mo>–</mo><mn>1</mn><mo>]</mo></math><br /><br /><math><mo>=</mo><mn>3</mn><mi>R</mi><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>[</mo><mn>1.386</mn><mo>–</mo><mn>1</mn><mo>]</mo></math><br /><br /><math><mo>=</mo><mn>1.16</mn><mi>R</mi><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639efac21910453994", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "73", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Liquid oxygen at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math> is heated to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math> at a constant pressure of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi>atm</mi></math>. The rate of heating is constant. Among the following graphs that represent the variation of temperature with time is", "image": null}, "options": [{"id": "UzezW", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0006080_Ans1_1.jpg\" style=\"max-width:\"100%\"; object-fit:contain\" style=\"width: 150px; height: 164px;\" />", "image": null, "isCorrect": false}, {"id": "0R7D8", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0006080_Ans2_1.jpg\" style=\"max-width:\"100%\"; object-fit:contain\" style=\"width: 150px; height: 161px;\" />", "image": null, "isCorrect": false}, {"id": "wzx8i", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0006080_Ans3_1.jpg\" style=\"max-width:\"100%\"; object-fit:contain\" style=\"width: 150px; height: 157px;\" />", "image": null, "isCorrect": true}, {"id": "hze9Q", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0006080_Ans4_1.jpg\" style=\"max-width:\"100%\"; object-fit:contain\" style=\"width: 150px; height: 159px;\" />", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Temperature of liquid oxygen will first increase in the same phase. Then, phase change ( liquid to gas) will take place. During which temperature will remain constant. After that temperature of oxygen in gaseous state will further increase.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639db11a81c2b0f6cb", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "43", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The molar heat capacity of a monoatomic ideal gas undergoing the process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mi>V</mi><mrow><mn>1</mn><mo>/</mo><mn>2</mn></mrow></msup><mo>=</mo><mi>constant</mi></math>&nbsp;is", "image": null}, "options": [{"id": "KmhMU", "text": "<math><mfrac><mrow><mn>15</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>R</mi></math>", "image": null, "isCorrect": false}, {"id": "o1tJ8", "text": "<math><mfrac><mrow><mn>23</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>R</mi></math>", "image": null, "isCorrect": false}, {"id": "d1vv6", "text": "<math><mfrac><mrow><mn>7</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>R</mi></math>", "image": null, "isCorrect": true}, {"id": "kYrxU", "text": "Zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a polytropic process, specific heat of an ideal gas is given by,<br /><math><mi mathvariant=\"normal\">c</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mi mathvariant=\"normal\">γ</mi><mo>-</mo><mn>1</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>1</mn><mo>-</mo><mi mathvariant=\"normal\">n</mi></mrow></mfrac><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">&nbsp;</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi mathvariant=\"normal\">n</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">&nbsp;,&nbsp;</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">y</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">s</mi></mrow></mfenced></math><br /><math><mi mathvariant=\"normal\">c</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mfrac><mrow><mn>5</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>-</mo><mn>1</mn></mrow></mfrac><mo>+</mo><mn>2</mn><mi mathvariant=\"normal\">R</mi></math><br /><math><mo>=</mo><mfrac><mrow><mn>3</mn><mi>R</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>+</mo><mn>2</mn><mi>R</mi><mo>=</mo><mfrac><mrow><mn>7</mn><mi>R</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639d31bbddb2c03c7b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "97", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A diatomic ideal gas is heated at constant volume until the pressure is doubled and again heated at constant pressure until the volume is doubled. The average molar heat capacity for the whole process is", "image": null}, "options": [{"id": "qn3OX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>1</mn><mn>3</mn><mi>R</mi></mrow><mn>6</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "Y0l87", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>1</mn><mn>9</mn><mi>R</mi></mrow><mn>6</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "e1WoN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mn>3</mn><mi>R</mi></mrow><mn>6</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "KCntP", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>1</mn><mn>7</mn><mi>R</mi></mrow><mn>6</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let initial pressure, volume and temperature be P<sub>0</sub>, V<sub>0</sub> and T<sub>0</sub>, respectively, indicated by state A in P-V diagram. The gas is then isochorically taken to state B (2P<sub>0</sub>, V<sub>0</sub>, 2T<sub>0</sub>) and then taken from state B to state C (2P<sub>0</sub>, 2V<sub>0</sub>, 4T<sub>0</sub>) isobarically.<br /><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029739_Ans..jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 237px; height: 195px;\" /><br /><br /><br />Total heat absorbed by 1 mol of gas<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>Δ</mo> <mtext>Q</mtext> <mo>=</mo> <msub> <mtext>C</mtext> <mtext>v</mtext> </msub> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>2</mn> <msub> <mtext>T</mtext> <mn>0</mn> </msub> <mo>-</mo> <msub> <mtext>T</mtext> <mn>0</mn> </msub> </mrow> </mfenced> <mo>+</mo> <msub> <mtext>C</mtext> <mtext>P</mtext> </msub> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>4</mn> <msub> <mtext>T</mtext> <mn>0</mn> </msub> <mo>-</mo> <mn>2</mn> <msub> <mtext>T</mtext> <mn>0</mn> </msub> </mrow> </mfenced> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msub> <mtext>RT</mtext> <mn>0</mn> </msub> <mo>+</mo> <mfrac> <mrow> <mn>7</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> <mo>×</mo> <mn>2</mn> <msub> <mtext>T</mtext> <mn>0</mn> </msub> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>9</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msub> <mtext>RT</mtext> <mn>0</mn> </msub> </mrow> </math><br /><br />Total change in temperature from series A to C is <math> <mrow> <mo>Δ</mo> <mtext>T</mtext> <mo>=</mo> <mn>3</mn> <msub> <mtext>T</mtext> <mn>0</mn> </msub> </mrow> </math><br /><br />Therefore,<br /><br />Molar heat capacity <math> <mrow> <mo>=</mo> <mfrac> <mrow> <mo>Δ</mo> <mtext>Q</mtext> </mrow> <mrow> <mo>Δ</mo> <mtext>T</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mfrac> <mrow> <mn>1</mn> <mn>9</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msub> <mtext>RT</mtext> <mn>0</mn> </msub> </mrow> <mrow> <mn>3</mn> <msub> <mtext>T</mtext> <mn>0</mn> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>9</mn> </mrow> <mrow> <mn>6</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86399d70c8cf4330013", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "07", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A monoatomic gas of molar mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>M</mi><mn>0</mn></msub></math>&nbsp;is filled into an insulated container which is moving along a horizontal surface with velocity a&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math>. If the container is stopped&nbsp;suddenly, then the change in temperature of the gas is</p>\r", "image": null}, "options": [{"id": "1xMFf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>M</mi><mn>0</mn></msub><msup><mi>v</mi><mn>2</mn></msup></mrow><mrow><mn>2</mn><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "eIJIq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>M</mi><mn>0</mn></msub><msup><mi>v</mi><mn>2</mn></msup></mrow><mrow><mn>3</mn><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "kZtzs", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><msub><mi>M</mi><mn>0</mn></msub><msup><mi>v</mi><mn>2</mn></msup></mrow><mrow><mn>3</mn><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "1ID01", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><msub><mi>M</mi><mn>0</mn></msub><msup><mi>v</mi><mn>2</mn></msup></mrow><mrow><mn>2</mn><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>If the container is suddenly stopped loss in kinetic energy of the gas is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>K</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mrow><mi>n</mi><msub><mi>M</mi><mn>0</mn></msub></mrow></mfenced><msup><mi>v</mi><mn>2</mn></msup></math>, where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>&nbsp;is the number of moles of the gas.</p><p>If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>T</mi></math>&nbsp;is the change in the temperature of the gas, then</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>n</mi><mi>R</mi><mi>&#916;</mi><mi>T</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mrow><mi>n</mi><msub><mi>M</mi><mn>0</mn></msub></mrow></mfenced><msup><mi>v</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>T</mi><mo>=</mo><mfrac><mrow><msub><mi>M</mi><mn>0</mn></msub><msup><mi>v</mi><mn>2</mn></msup></mrow><mrow><mn>3</mn><mi>R</mi></mrow></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639952b62282fc90f9", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "79", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "One mole of a&nbsp; certain ideal gas obtains an amount of heat&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>1</mn><mo>.</mo><mn>60</mn><mo>&nbsp;</mo><mi>kJ</mi></math>&nbsp;when its temperature is increased by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>Δ</mo><mi>T</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>72</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math>, keeping its pressure constant.&nbsp;The value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>C</mi><mi>P</mi></msub><msub><mi>C</mi><mi>V</mi></msub></mfrac></math>&nbsp;for the gas is", "image": null}, "options": [{"id": "HZOuM", "text": "1.60", "image": null, "isCorrect": true}, {"id": "TZilK", "text": "1.40", "image": null, "isCorrect": false}, {"id": "LXCV6", "text": "1.50", "image": null, "isCorrect": false}, {"id": "WmlN1", "text": "1.30", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "By the first law of thermodynamics<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>&Delta;</mo> <mtext>Q</mtext> <mo>=</mo> <mo>&Delta;</mo> <mtext>U</mtext> <mo>+</mo> <mo>&Delta;</mo> <mtext>W</mtext> </mrow> </math><br /><br />In an isobaric process<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>&Delta;</mo> <mtext>Q</mtext> <mo>=</mo> <msub> <mtext>C</mtext> <mtext>p</mtext> </msub> <mo>&Delta;</mo> <mtext>T</mtext> </mrow> </math><br /><br />and&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>&Delta;</mo> <mtext>U</mtext> <mo>=</mo> <msub> <mtext>C</mtext> <mtext>v</mtext> </msub> <mo>&Delta;</mo> <mtext>T</mtext> </mrow> </math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(always)<br /><br /><math> <mrow> <mo>&there4;&nbsp;&nbsp;&nbsp;</mo> <msub> <mtext>C</mtext> <mtext>p</mtext> </msub> <mo>&Delta;</mo> <mtext>T</mtext> <mo>=</mo> <msub> <mtext>C</mtext> <mtext>v</mtext> </msub> <mo>&Delta;</mo> <mtext>T</mtext> <mo>+</mo> <mo>&Delta;</mo> <mtext>W</mtext> </mrow> </math><br /><br />or&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>&Delta;</mo> <mtext>W</mtext> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>C</mtext> <mtext>p</mtext> </msub> <mo>-</mo> <msub> <mtext>C</mtext> <mtext>v</mtext> </msub> </mrow> </mfenced> <mo>&Delta;</mo> <mtext>T</mtext> </mrow> </math><br /><br />or&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>&Delta;</mo> <mtext>W</mtext> <mo>=</mo> <mtext>R</mtext> <mo>&Delta;</mo> <mtext>T</mtext> </mrow> </math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mo>∵</mo> <msub> <mtext>C</mtext> <mtext>p</mtext> </msub> <mo>-</mo> <msub> <mtext>C</mtext> <mtext>v</mtext> </msub> <mo>=</mo> <mtext>R</mtext> </mrow> </mfenced> </mrow> </math><br /><br /><math> <mrow> <mo>&there4;&nbsp;&nbsp;&nbsp;</mo> <mo>&Delta;</mo> <mtext>W</mtext> <mo>=</mo> <mtext>8.3</mtext> <mo>&times;</mo> <mn>7</mn> <mn>2</mn> <mo>=</mo> <mtext>597.6</mtext> <mo>J</mo> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>&Delta;</mo> <mtext>Q</mtext> <mo>=</mo> <msub> <mtext>C</mtext> <mtext>p</mtext> </msub> <mo>&Delta;</mo> <mtext>T</mtext> </mrow> </math><br /><br /><math> <mrow> <mo>&there4;&nbsp;&nbsp;&nbsp;</mo> <mtext>1.6</mtext> <mo>&times;</mo> <mn>1</mn> <mn>0</mn> <mn>0</mn> <mn>0</mn> <mo>=</mo> <msub> <mtext>C</mtext> <mtext>p</mtext> </msub> <mo>&times;</mo> <mn>7</mn> <mn>2</mn> </mrow> </math><br /><br /><math> <mrow> <mo>&rArr;&nbsp;&nbsp;&nbsp;</mo> <msub> <mtext>C</mtext> <mtext>p</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mtext>1.6</mtext> <mo>&times;</mo> <mn>1</mn> <mn>0</mn> <mn>0</mn> <mn>0</mn> </mrow> <mrow> <mn>7</mn> <mn>2</mn> </mrow> </mfrac> <mo>=</mo> <mtext>22.2</mtext> <msup> <mtext>&nbsp;J mol</mtext> <mrow> <mo>-</mo> <mn>1</mn> </mrow> </msup> <msup> <mtext>K</mtext> <mrow> <mo>-</mo> <mn>1</mn> </mrow> </msup> </mrow> </math><br /><br /><math> <mrow> <mo>&Delta;</mo> <mtext>U</mtext> <mo>=</mo> <mo>&Delta;</mo> <mtext>Q</mtext> <mo>=</mo> <mo>&Delta;</mo> <mtext>W</mtext> <mo>=</mo> <mtext>1.6</mtext> <mo>&times;</mo> <mn>1</mn> <mn>0</mn> <mn>0</mn> <mn>0</mn> <mo>-</mo> <mtext>597.6 J</mtext> <mo>=</mo> <mtext>1002.4 J</mtext> </mrow> </math><br /><br />But&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>&Delta;</mo> <mtext>U</mtext> <mo>=</mo> <msub> <mtext>C</mtext> <mtext>v</mtext> </msub> <mo>&Delta;</mo> <mtext>T</mtext> </mrow> </math><br /><br /><math> <mrow> <mo>&there4;&nbsp;&nbsp;&nbsp;</mo> <msub> <mtext>C</mtext> <mtext>v</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mtext>1002.4</mtext> </mrow> <mrow> <mn>7</mn> <mn>2</mn> </mrow> </mfrac> <mo>=</mo> <mtext>13.9</mtext> <msup> <mtext>J mol</mtext> <mrow> <mo>-</mo> <mn>1</mn> </mrow> </msup> <msup> <mtext>K</mtext> <mrow> <mo>-</mo> <mn>1</mn> </mrow> </msup> </mrow> </math><br /><br /><math> <mrow> <mo>&there4;&nbsp;&nbsp;&nbsp;</mo> <mi>&gamma;</mi> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>C</mtext> <mtext>p</mtext> </msub> </mrow> <mrow> <msub> <mtext>C</mtext> <mtext>v</mtext> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>22.2</mtext> </mrow> <mrow> <mtext>13.9</mtext> </mrow> </mfrac> <mo>=</mo> <mtext>1.60</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639908b7959089e98b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "32", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "One mole of an ideal monatomic gas undergoes a cyclic process as shown in the figure. If the temperature of the gas at state <math><mn>1</mn></math> is <math><mn>300</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">K</mi></math> and at state <math><mn>4</mn></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>500</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">K</mi></math>, then heat exchanged during process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>→</mo><mn>3</mn></math>, is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/image__3_.png\" style=\"width: 200px; height: 129px;\" />", "image": null}, "options": [{"id": "Cjbde", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1000</mn><mi mathvariant=\"normal\">R</mi></math>", "image": null, "isCorrect": true}, {"id": "PUAjS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>600</mn><mi mathvariant=\"normal\">R</mi></math>", "image": null, "isCorrect": false}, {"id": "8ZM7l", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>750</mn><mi mathvariant=\"normal\">R</mi></math>", "image": null, "isCorrect": false}, {"id": "iRQWF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>800</mn><mi mathvariant=\"normal\">R</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">Q</mi><mn>23</mn></msub><mo>=</mo><msub><mi>nC</mi><mi mathvariant=\"normal\">P</mi></msub><mfenced separators=\"|\"><mrow><msub><mi mathvariant=\"normal\">T</mi><mn>3</mn></msub><mo>&#8211;</mo><msub><mi mathvariant=\"normal\">T</mi><mn>2</mn></msub></mrow></mfenced></math></p><p>The processes&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#8594;</mo><mn>2</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&#8594;</mo><mn>4</mn></math>&nbsp;are isochoric in nature. Hence, for these processes&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>&#8733;</mo><mi mathvariant=\"normal\">P</mi></math>. As a result, we obtain,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">T</mi><mn>3</mn></msub><mo>=</mo><mn>1000</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">K</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">T</mi><mn>2</mn></msub><mo>=</mo><mn>600</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">K</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">Q</mi><mn>23</mn></msub><mo>=</mo><mn>1</mn><mo>&#215;</mo><mfrac><mrow><mn>5</mn><mi mathvariant=\"normal\">R</mi></mrow><mn>2</mn></mfrac><mo>&#215;</mo><mn>400</mn><mo>=</mo><mn>1000</mn><mi mathvariant=\"normal\">R</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863986807ce59a6e305", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "08", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>An inverted bell, lying at the bottom of lake <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>47</mn><mo>.</mo><mn>6</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math> deep, has&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&#160;</mo><msup><mi>cm</mi><mn>3</mn></msup></math> of air trapped in it. The bell is brought to the surface of the lake, then the volume of the trapped air will become [atmospheric pressure = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>70</mn><mo>&#160;</mo><mi>cm</mi></math> of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Hg</mi></math> and density of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Hg</mi><mo>=</mo><mn>13</mn><mo>.</mo><mn>6</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi><mo>&#160;</mo><msup><mi>cm</mi><mrow><mo>-</mo><mn>3</mn></mrow></msup></math>]</p>\r\r<p>&nbsp;</p>\r", "image": null}, "options": [{"id": "lEuwe", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>600</mn><mo>&#xA0;</mo><msup><mi>cm</mi><mn>3</mn></msup></math>", "image": null, "isCorrect": false}, {"id": "nv8wH", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>&#xA0;</mo><msup><mi>cm</mi><mn>3</mn></msup></math>", "image": null, "isCorrect": true}, {"id": "hpYdD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>250</mn><mo>&#xA0;</mo><msup><mi>cm</mi><mn>3</mn></msup></math>", "image": null, "isCorrect": false}, {"id": "AlvqA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>&#xA0;</mo><msup><mi>cm</mi><mn>3</mn></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Boyle's law, pressure and volume are inversely&nbsp;proportional to each other i.e.&nbsp;<math> <mrow> <mtext>p</mtext> <mo>∝</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>v</mtext> </mrow> </mfrac> </mrow> </math><br /><br /><u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0010163_AnsExp2_1.jpg\" /></strong></u><br /><br /><math> <mrow> <mo>⇒</mo> <mspace width=\"0.5em\"></mspace> <msub> <mtext>P</mtext> <mn>1</mn> </msub> <msub> <mtext>V</mtext> <mn>1</mn> </msub> <mo>=</mo> <msub> <mtext>P</mtext> <mn>2</mn> </msub> <msub> <mtext>V</mtext> <mn>2</mn> </msub> </mrow> </math><br /><br /><math> <mrow> <mo>⇒</mo> <mspace width=\"0.5em\"></mspace> <mo>(</mo> <msub> <mtext>P</mtext> <mn>0</mn> </msub> <mo>+</mo> <mtext>h</mtext> <msub> <mi mathvariant=\"normal\">ρ</mi> <mtext>w</mtext> </msub> <mtext>g</mtext> <mo>)</mo> <msub> <mtext>V</mtext> <mn>1</mn> </msub> <mo>=</mo> <msub> <mtext>P</mtext> <mn>0</mn> </msub> <msub> <mtext>V</mtext> <mn>2</mn> </msub> </mrow> </math><br /><br /><math> <mrow> <mo>⇒</mo> <mspace width=\"0.5em\"></mspace> <msub> <mtext>V</mtext> <mn>2</mn> </msub><mo>=</mo> <mo>(</mo> <mn>1</mn> <mo>+</mo> <mfrac> <mrow> <mtext>h</mtext> <msub> <mi mathvariant=\"normal\">ρ</mi> <mtext>w</mtext> </msub> <mtext>g</mtext> </mrow> <mrow> <msub> <mtext>P</mtext> <mn>0</mn> </msub> </mrow> </mfrac> <mo>)</mo> <msub> <mtext>V</mtext> <mn>1</mn> </msub> </mrow> </math><br /><br /><br /><math> <mtable columnalign=\"left\"> <mtr> <mtd> <msub> <mi>V</mi> <mn>2</mn> </msub> <mo>=</mo><mo stretchy=\"false\">(</mo><mn>1</mn><mo>+</mo><mfrac> <mrow> <mn>47.6</mn><mo>*</mo><mn>1</mn><mo>*</mo><mn>1000</mn><mo>*</mo><mn>10</mn></mrow> <mrow> <mn>70</mn><mo>*</mo><msup> <mrow> <mn>10</mn></mrow> <mrow> <mo>−</mo><mn>2</mn></mrow> </msup> <mo>*</mo><mn>13.6</mn><mo>*</mo><mn>1000</mn><mo>*</mo><mn>10</mn></mrow> </mfrac> <mo stretchy=\"false\">)</mo> </mtd> </mtr> <mtr> <mtd> <mrow></mrow> </mtd> </mtr> <mtr> <mtd> <mo stretchy=\"false\">[</mo><mi>A</mi><mi>s</mi><mtext> </mtext><msub> <mi>P</mi> <mn>2</mn> </msub> <mo>=</mo><msub> <mi>P</mi> <mn>0</mn> </msub> <mo>=</mo><mn>70</mn><mtext> </mtext><mtext> </mtext><mi>c</mi><mi>m</mi><mtext> </mtext><mtext> </mtext><mi>o</mi><mi>f</mi><mtext> </mtext><mi>H</mi><mi>g</mi><mo>=</mo><mn>70</mn><mo>*</mo><msup> <mn>10</mn> <mrow> <mo>−</mo><mn>2</mn></mrow> </msup> <mo>*</mo><mn>13.6</mn><mo>*</mo><mn>1000</mn><mo>*</mo><mn>10</mn><mo stretchy=\"false\">]</mo> </mtd> </mtr> <mtr> <mtd> <mrow></mrow> </mtd> </mtr> </mtable> </math><br /><math> <mrow> <mo>⇒</mo> <mspace width=\"0.5em\"></mspace> <msub> <mtext>V</mtext> <mn>2</mn> </msub> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>1</mn> <mo>+</mo> <mn>5</mn> </mrow> </mfenced> <mn>5</mn> <mn>0</mn> <msup> <mtext>cm</mtext> <mn>3</mn> </msup> <mo>=</mo> <mn>3</mn> <mn>0</mn> <mn>0</mn> <msup> <mtext>cm</mtext> <mn>3</mn> </msup> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863938668ce161a49bf", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "103", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A diesel engine takes in 1 mole of air at 300 K, 1 atm pressure and compresses it adiabatically to <math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>3</mn> <mn>2</mn> </mrow> </mfrac> <mtext>th&nbsp;</mtext></mrow></math>of the original volume. Considering air as a diatomic ideal gas, the change in temperature is", "image": null}, "options": [{"id": "UGG8E", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>900</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">K</mi></math>", "image": null, "isCorrect": true}, {"id": "lkqTQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1200</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">K</mi></math>", "image": null, "isCorrect": false}, {"id": "cqDYT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>600</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">K</mi></math>", "image": null, "isCorrect": false}, {"id": "448y0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2400</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">K</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Using&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mtext>T</mtext> <mn>1</mn> </msub> <msubsup> <mtext>V</mtext> <mn>1</mn> <mrow> <mi>&#947;</mi> <mo>-</mo> <mn>1</mn> </mrow> </msubsup> <mo>=</mo> <msub> <mtext>T</mtext> <mn>2</mn> </msub> <msubsup> <mtext>V</mtext> <mn>2</mn> <mrow> <mi>&#947;</mi> <mo>-</mo> <mn>1</mn> </mrow> </msubsup> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mtext>T</mtext><mn>2</mn></msub><mo>=</mo><msub><mtext>T</mtext><mn>1</mn></msub><msup><mfenced><mfrac><msub><mtext>V</mtext><mn>1</mn></msub><msub><mtext>V</mtext><mn>2</mn></msub></mfrac></mfenced><mrow><mi>&#947;</mi><mo>-</mo><mn>1</mn></mrow></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mtext>T</mtext><mn>2</mn></msub><mo>=</mo><msub><mtext>T</mtext><mn>1</mn></msub><msup><mfenced><mfrac><mn>1</mn><mn>32</mn></mfrac></mfenced><mrow><mfrac><mn>7</mn><mn>5</mn></mfrac><mo>-</mo><mn>1</mn></mrow></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">T</mi><mn>2</mn></msub><mo>=</mo><mn>4</mn><msub><mi mathvariant=\"normal\">T</mi><mn>1</mn></msub><mo>=</mo><mn>1200</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi><mspace linebreak=\"newline\"/><mo>&#8710;</mo><mi mathvariant=\"normal\">T</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>900</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863934c8a063e4e2cac", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "80", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Find the minimum attainable pressure of an ideal gas in process <math> <mrow> <mi>T</mi><mo>=</mo><msub> <mi>T</mi> <mn>0</mn> </msub> <mo>+</mo><mi>α</mi><msup> <mi>V</mi> <mn>2</mn></msup></mrow></math>, where <math> <mrow> <msub> <mi>T</mi> <mn>0</mn> </msub> </mrow> </math> and <math> <mi>α</mi> </math> are positive constants and <math> <mi>V</mi> </math> is the volume of one mole of gas.&nbsp;", "image": null}, "options": [{"id": "fkYvN", "text": "<math> <mrow> <mn>2</mn><mi>R</mi><msqrt> <mrow> <mi>α</mi><msub> <mi>T</mi> <mn>0</mn> </msub> </mrow> </msqrt> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "ZwkuN", "text": "<math> <mrow>  <mn>3</mn><mi>R</mi><msqrt>   <mrow>    <mi>&#x03B1;</mi><msub>     <mi>T</mi>     <mn>0</mn>    </msub>    </mrow>  </msqrt>  </mrow></math>", "image": null, "isCorrect": false}, {"id": "hHKEH", "text": "<math> <mrow>  <mn>3</mn><mi>R</mi></mrow></math>", "image": null, "isCorrect": false}, {"id": "ddn8p", "text": "<math> <mrow> <mn>3</mn><mi>R</mi><msqrt> <mrow> <mfrac> <mrow> <mi>α</mi><msub> <mi>T</mi> <mn>0</mn> </msub> </mrow> <mn>2</mn> </mfrac> </mrow> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given,<br /><br /><math> <mrow> <mi>T</mi><mo>=</mo><msub> <mi>T</mi> <mn>0</mn> </msub> <mo>+</mo><mi>α</mi><msup> <mi>V</mi> <mn>2</mn> </msup> </mrow> </math>...(i)<br /><br />For 1 mol of a gas, <math> <mrow> <mi>P</mi><mi>V</mi><mo>=</mo><mi>R</mi><mi>T</mi></mrow> </math><br /><br />of <math> <mrow> <mi>V</mi><mo>=</mo><mfrac> <mrow> <mi>R</mi><mi>T</mi></mrow> <mi>P</mi> </mfrac> </mrow> </math><br /><br />Substituting this value in Eq. (i), we get<br /><br /><math> <mrow> <mi>T</mi><mo>=</mo><msub> <mi>T</mi> <mn>0</mn> </msub> <mo>+</mo><mi>α</mi><msup> <mrow> <mfenced> <mrow> <mfrac> <mrow> <mi>R</mi><mi>T</mi></mrow> <mi>P</mi> </mfrac> </mrow> </mfenced></mrow> <mn>2</mn> </msup> <mo>=</mo><msub> <mi>T</mi> <mn>0</mn> </msub> <mo>+</mo><mi>α</mi><mfrac> <mrow> <msup> <mi>R</mi> <mn>2</mn> </msup> <msup> <mi>T</mi> <mn>2</mn> </msup> </mrow> <mrow> <msup> <mi>P</mi> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </math><br /><br />or <math> <mrow> <mi>T</mi><msup> <mi>P</mi> <mn>2</mn> </msup> <mo>=</mo><msub> <mi>T</mi> <mn>0</mn> </msub> <msup> <mi>P</mi> <mn>2</mn> </msup> <mo>+</mo><mi>α</mi><msup> <mi>R</mi> <mn>2</mn> </msup> <msup> <mi>T</mi> <mn>2</mn> </msup> </mrow> </math><br /><br />or <math> <mrow> <mi>P</mi><mo>=</mo><msqrt> <mi>α</mi> </msqrt> <mi>R</mi><mi>T</mi><msup> <mrow> <mfenced> <mrow> <mi>T</mi><mo>−</mo><msub> <mi>T</mi> <mn>0</mn> </msub> </mrow> </mfenced></mrow> <mrow> <mo>−</mo><mn>1</mn><mo>/</mo><mn>2</mn></mrow> </msup> </mrow> </math> ...(ii)<br /><br />After differentiating, we get<br /><br /><math> <mrow> <mfrac> <mrow> <mi>d</mi><mi>P</mi></mrow> <mrow> <mi>d</mi><mi>T</mi></mrow> </mfrac> <mo>=</mo><msqrt> <mi>α</mi> </msqrt> <mi>R</mi><mfenced close=\"]\" open=\"[\"> <mrow> <msup> <mrow> <mfenced> <mrow> <mi>T</mi><mo>−</mo><msub> <mi>T</mi> <mn>0</mn> </msub> </mrow> </mfenced></mrow> <mrow> <mo>−</mo><mn>1</mn><mo>/</mo><mn>2</mn></mrow> </msup> <mo>−</mo><mfrac> <mn>1</mn> <mn>2</mn> </mfrac> <mi>T</mi><msup> <mrow> <mfenced> <mrow> <mi>T</mi><mo>−</mo><msub> <mi>T</mi> <mn>0</mn> </msub> </mrow> </mfenced></mrow> <mrow> <mo>−</mo><mn>3</mn><mo>/</mo><mn>2</mn></mrow> </msup> </mrow> </mfenced></mrow> </math><br /><br />For minimum pressure,<br /><br /><math> <mrow> <mfrac> <mrow> <mi>d</mi><mi>P</mi></mrow> <mrow> <mi>d</mi><mi>T</mi></mrow> </mfrac> <mo>=</mo><mn>0</mn></mrow> </math><br /><br /><math> <mrow> <mo>∴&nbsp;&nbsp;&nbsp;&nbsp;</mo> <mn>0</mn> <mo>=</mo> <msqrt> <mi>α</mi> </msqrt> <mo>R</mo> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>T</mtext> <mo>-</mo> <msub> <mtext>T</mtext> <mn>0</mn> </msub> </mrow> </mfenced> </mrow> <mrow> <mo>-</mo> <mn>1</mn> <mo>/</mo> <mn>2</mn> </mrow> </msup> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>T</mtext> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>T</mtext> <mo>-</mo> <msub> <mtext>T</mtext> <mn>0</mn> </msub> </mrow> </mfenced> </mrow> <mrow> <mo>-</mo> <mn>3</mn> <mo>/</mo> <mn>2</mn> </mrow> </msup> </mrow> </mfenced> </mrow> </math><br /><br />After solving, T = 2T<sub>0</sub><br /><br />From Eq. (ii),<br /><br /><math> <mrow> <msub> <mi>P</mi> <mrow> <mi>min</mi></mrow> </msub> <mo>=</mo><msqrt> <mi>α</mi> </msqrt> <mi>R</mi><mn>2</mn><msub> <mi>T</mi> <mn>0</mn> </msub> <msup> <mrow> <mfenced> <mrow> <mn>2</mn><msub> <mi>T</mi> <mn>0</mn> </msub> <mo>−</mo><msub> <mi>T</mi> <mn>0</mn> </msub> </mrow> </mfenced></mrow> <mrow> <mo>−</mo><mn>1</mn><mo>/</mo><mn>2</mn></mrow> </msup> </mrow> </math><br /><br /><math> <mrow> <mo>=</mo><mn>2</mn><mi>R</mi><msqrt> <mrow> <mi>α</mi><msub> <mi>T</mi> <mn>0</mn> </msub> </mrow> </msqrt> </mrow> </math><br /><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0030784_Ans.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 200px; height: 154px;\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86392e9667d64b744ca", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "14", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An ideal monatomic gas is confined in a cylinder by a spring-loaded massless piston of cross-section <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>3</mn></mrow></msup><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math>. The piston can slide on the walls of the cylinder without any friction. Initially, the gas is at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math>&nbsp;and occupies a volume of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.4</mo><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>3</mn></mrow></msup><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>3</mn></msup></math> and the spring is in its relaxed position. Now, gas is slowly heated by a small electric heater and the piston moves out slowly by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.1</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>. Calculate the final temperature of the gas and the heat supplied by the heater. The force constant of the spring is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8000</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi><mo>/</mo><mi mathvariant=\"normal\">m</mi></math> and atmospheric pressure is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>×</mo><msup><mn>10</mn><mrow><mn>5</mn><mo>&nbsp;</mo></mrow></msup><mi mathvariant=\"normal\">N</mi><mo>/</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math>.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0629599.jpg\" style=\"width: 301px; height: 131px;\" />", "image": null}, "options": [{"id": "ATtlY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mn>600</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">K</mi><mo>,</mo><mo>&#xA0;</mo><mi>Q</mi><mo>=</mo><mn>680</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "YM4Ry", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mn>800</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">K</mi><mo>,</mo><mo>&#xA0;</mo><mi>Q</mi><mo>=</mo><mn>600</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "JzDcD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mn>600</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">K</mi><mo>,</mo><mo>&#xA0;</mo><mi>Q</mi><mo>=</mo><mn>720</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "YJX5A", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mn>800</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">K</mi><mo>,</mo><mo>&#xA0;</mo><mi>Q</mi><mo>=</mo><mn>720</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>In the initial condition</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub><mo>=</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&#160;</mo><mi>Pa</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn><mo>.</mo><mn>4</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>3</mn></msup></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>1</mn></msub><mo>=</mo><mn>300</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p><p>Finally,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>2</mn></msub><mo>=</mo><msub><mi>P</mi><mn>1</mn></msub><mo>+</mo><mfrac><mrow><mi>k</mi><mi>x</mi></mrow><mi>A</mi></mfrac><mo>=</mo><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&#160;</mo><mi>Pa</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>2</mn></msub><mo>=</mo><msub><mi>V</mi><mn>1</mn></msub><mo>+</mo><mi>A</mi><mi>x</mi><mo>=</mo><mn>3</mn><mo>.</mo><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>3</mn></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub></mrow><msub><mi>T</mi><mn>1</mn></msub></mfrac><mo>=</mo><mfrac><mrow><msub><mi>P</mi><mn>2</mn></msub><msub><mi>V</mi><mn>2</mn></msub></mrow><msub><mi>T</mi><mn>2</mn></msub></mfrac></math>, on solving&nbsp;we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mn>800</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p><p>Applying&nbsp;work-energy theorem for the piston</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mi>gas</mi></msub><mo>+</mo><msub><mi>W</mi><mi>atmos</mi></msub><mo>+</mo><msub><mi>W</mi><mi>spring</mi></msub><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mi>gas</mi></msub><mo>=</mo><msub><mi>P</mi><mn>0</mn></msub><mi>A</mi><mi>x</mi><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>k</mi><msup><mi>x</mi><mn>2</mn></msup><mo>=</mo><mn>120</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#916;</mo><mi>U</mi><mo>=</mo><mi>n</mi><msub><mi>C</mi><mi>V</mi></msub><mo>&#916;</mo><mi>T</mi><mo>=</mo><mfrac><mrow><mi>n</mi><mi>R</mi><mo>&#916;</mo><mi>T</mi></mrow><mfenced><mrow><mi>&#947;</mi><mo>-</mo><mn>1</mn></mrow></mfenced></mfrac><mo>=</mo><mfrac><mrow><msub><mi>P</mi><mn>2</mn></msub><msub><mi>V</mi><mn>2</mn></msub><mo>-</mo><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub></mrow><mfenced><mrow><mi>&#947;</mi><mo>-</mo><mn>1</mn></mrow></mfenced></mfrac><mo>=</mo><mn>600</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>=</mo><mo>&#916;</mo><mi>U</mi><mo>+</mo><msub><mi>W</mi><mrow><mi>g</mi><mi>a</mi><mi>s</mi></mrow></msub><mo>=</mo><mn>6</mn><mn>0</mn><mn>0</mn><mo>+</mo><mn>1</mn><mn>2</mn><mn>0</mn><mo>=</mo><mn>7</mn><mn>2</mn><mn>0&#160;</mn><mi mathvariant=\"normal\">J</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638bd2e8c70f378a58", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "50", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "When gas is given heat <math><mi mathvariant=\"normal\">&#916;</mi><mi>Q</mi></math>, a part of heat energy is utilized into work done&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi></math> by gas&nbsp;and the remaining part is utilized to change in internal energy. An ideal diatomic gas is heated at constant pressure,&nbsp; the ratio of the internal energy change to heat energy supplied, is", "image": null}, "options": [{"id": "BRXgR", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>7</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "ed2Q7", "text": "<math><mfrac><mrow><mn>2</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "gYfCW", "text": "<math><mfrac><mrow><mn>5</mn></mrow><mrow><mn>7</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "HRd5t", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Fraction of supplied energy which increases the internal energy is given by <br/><br/>         <math><mi>f</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">Δ</mi><mi>U</mi></mrow><mrow><msub><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">Δ</mi><mi>Q</mi></mrow></mfenced></mrow><mrow><mi>p</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>μ</mi><msub><mrow><mi>C</mi></mrow><mrow><mi>V</mi></mrow></msub><mi mathvariant=\"normal\">Δ</mi><mi>T</mi></mrow><mrow><mi>μ</mi><msub><mrow><mi>C</mi></mrow><mrow><mi>P</mi></mrow></msub><mi mathvariant=\"normal\">Δ</mi><mi>T</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>γ</mi></mrow></mfrac></math> <br/><br/>        [here, according to definition of sp. Heat at constant pressure  <math><msub><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">Δ</mi><mi>Q</mi></mrow></mfenced></mrow><mrow><mi>p</mi><mo>=</mo><mi>c</mi></mrow></msub><mo>=</mo><mi>n</mi><msub><mrow><mi>C</mi></mrow><mrow><mi>P</mi></mrow></msub><mi mathvariant=\"normal\">Δ</mi><mi>T</mi></math> ] <br/><br/>        For diatomic gas <math><mi>γ</mi><mo>=</mo><mfrac><mrow><mn>7</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math> <br/><br/> <math><mo>⇒</mo><mi> </mi><mi> </mi><mi>f</mi><mo>=</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>7</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638a35eb576490e2f3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "41", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>An ideal monoatomic gas undergoes an expansion from state <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;to state <math xmlns=\"http://www.w3.org/1
