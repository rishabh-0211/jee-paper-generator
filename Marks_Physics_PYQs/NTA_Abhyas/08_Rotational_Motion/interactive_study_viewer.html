{"id": "7GMQt", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>g</mi><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The cylinder rotating under gravity has both translational and rotational motions. Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math> be the linear velocity of its centre of mass and &omega; its angular velocity about the axis of rotation, then in descending a distance h it will lose PE = Mgh while the gain in KE<br /><br /><u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014139_AnsExp2_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 329px; height: 379px;\" /></strong></u><br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>I</mtext> <msup> <mtext>&#969;</mtext> <mn>2</mn> </msup> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>M</mtext> <msup> <mtext>v</mtext> <mn>2</mn> </msup> </mrow> </mfenced> <mtext>,</mtext> <mspace width=\"0.5em\"></mspace> <mtext>so</mtext> </mrow> </math><br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>Mgh</mtext> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>I</mtext> <msup> <mtext>&#969;</mtext> <mn>2</mn> </msup> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msup> <mtext>Mv</mtext> <mn>2</mn> </msup> </mrow> </math><br /><br /><math> <mrow> <mtext>Here</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>I</mtext> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msup> <mtext>MR</mtext> <mn>2</mn> </msup> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>and</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>v</mtext> <mo>=</mo> <mtext>R</mtext> <mtext>&#969;</mtext> </mrow> </math><br /><br /><math> <mrow> <mtext>so</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>Mgh</mtext> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msup> <mtext>Mv</mtext> <mn>2</mn> </msup> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msup> <mtext>MR</mtext> <mn>2</mn> </msup> </mrow> </mfenced> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mfrac> <mrow> <msup> <mtext>v</mtext> <mn>2</mn> </msup> </mrow> <mrow> <msup> <mtext>R</mtext> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>so</mtext><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><msup><mtext>v</mtext><mn>2</mn></msup><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><mi>g</mi><mtext>h</mtext></math><br /><br />Now differentiating both sides with respect to time<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mtext>2v</mtext><mfrac><mtext>dv</mtext><mtext>dt</mtext></mfrac><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><mi>g</mi><mfrac><mtext>dh</mtext><mtext>dt</mtext></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>or</mtext><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mi>a</mi><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><mi>g</mi><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mfenced open=\"[\" close=\"]\"><mrow><mtext>as</mtext><mfrac><mtext>dv</mtext><mtext>dt</mtext></mfrac><mo>=</mo><mi>a</mi><mspace width=\"0.5em\"/><mtext>and</mtext><mspace width=\"0.5em\"/><mfrac><mtext>dh</mtext><mtext>dt</mtext></mfrac><mo>=</mo><mtext>v</mtext></mrow></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86378d78e10b0000c9b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "67", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>As shown in the figure, wheel <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>r</mi><mi mathvariant=\"normal\">A</mi></msub><mo>=</mo><mn>10</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math> is coupled by a belt <math><mi mathvariant=\"normal\">B</mi></math> to the wheel <math><mi mathvariant=\"normal\">C</mi></math> of radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>r</mi><mi mathvariant=\"normal\">C</mi></msub><mo>=</mo><mn>25</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>. The angular speed of wheel <math><mi mathvariant=\"normal\">A</mi></math> is increased from rest at a constant rate of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1.6</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">d</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>. Time after which wheel <math><mi mathvariant=\"normal\">C</mi></math> reaches a rotational speed of <math><mn>100</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">m</mi></math>, assuming the belt does not slip, is nearly<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image23-f9a1c174-cd30-4fa8-85f9-9ee5f0c71413.jpg\" style=\"height: 93px; width: 220px;\" /></p>\r", "image": null}, "options": [{"id": "z6dq7", "text": "<math><mn>4</mn><mi>&nbsp;</mi><mrow><mrow><mi mathvariant=\"normal\">s</mi></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "VqTN3", "text": "<math><mn>8</mn><mi>&nbsp;</mi><mrow><mrow><mi mathvariant=\"normal\">s</mi></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "FJ9zW", "text": "<math><mn>12</mn><mi>&nbsp;</mi><mrow><mrow><mi mathvariant=\"normal\">s</mi></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "7njca", "text": "<math><mn>16&nbsp;</mn><mrow><mrow><mi mathvariant=\"normal\">s</mi></mrow></mrow></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>a</mi><mi>t</mi></msub><mo>=</mo><msub><mi>&#945;</mi><mi mathvariant=\"normal\">A</mi></msub><mi>&#160;</mi><msub><mi>r</mi><mi mathvariant=\"normal\">A</mi></msub><mo>=</mo><msub><mi>&#945;</mi><mi mathvariant=\"normal\">C</mi></msub><msub><mi>r</mi><mi mathvariant=\"normal\">C</mi></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#945;</mi><mi mathvariant=\"normal\">C</mi></msub><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><msub><mi>&#945;</mi><mi mathvariant=\"normal\">A</mi></msub><mi mathvariant=\"normal\">&#160;</mi><mfenced separators=\"|\"><mfrac><msub><mi>r</mi><mi mathvariant=\"normal\">A</mi></msub><msub><mi>r</mi><mi mathvariant=\"normal\">C</mi></msub></mfrac></mfenced><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mtext>1.6</mtext><mo>&#215;</mo><mfrac><mn>10</mn><mn>25</mn></mfrac><mo>=</mo><mtext>0.64</mtext><mo>&#160;</mo><mi>rad</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mfrac><msub><mi>&#969;</mi><mi>C</mi></msub><msub><mi>&#945;</mi><mi>C</mi></msub></mfrac><mo>=</mo><mfrac><mfrac><mrow><mn>100</mn><mo>&#215;</mo><mn>2</mn><mi>&#960;</mi></mrow><mn>60</mn></mfrac><mrow><mn>0</mn><mo>.64</mo></mrow></mfrac><mo>=</mo><mtext>16.35&#160;</mtext><mi mathvariant=\"normal\">s</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636d517b2cd1c44466", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "63", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform circular disc of radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math> placed on a rough horizontal plane has initial velocity&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>0</mn></msub></math> and angular velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>ω</mi><mn>0</mn></msub></math>&nbsp;as shown. The disc comes to rest after moving some distance in the direction of motion. Then<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029915_Question.jpg\" style=\"width: 216px; height: 118px;\" />", "image": null}, "options": [{"id": "lI1pd", "text": "The friction force acts in the forward direction", "image": null, "isCorrect": false}, {"id": "KOz0g", "text": "The point of contact of disc with ground has zero velocity", "image": null, "isCorrect": false}, {"id": "hjia9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>0</mn></msub></math>&nbsp;must be equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>r</mi><msub><mi>ω</mi><mn>0</mn></msub></mrow><mn>2</mn></mfrac></math>&nbsp;in magnitude", "image": null, "isCorrect": true}, {"id": "pzeqF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>0</mn></msub></math>&nbsp;must be equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>r</mi><msub><mi>&#969;</mi><mn>0</mn></msub></math>&nbsp;in magnitude", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Conserving the angular momentum of the disc about its bottom-most point, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><msup><mi>R</mi><mn>2</mn></msup><msub><mi>&#969;</mi><mn>0</mn></msub><mo>-</mo><mi>m</mi><msub><mi>v</mi><mn>0</mn></msub><mi>R</mi><mo>=</mo><mn>0</mn></math>&nbsp;(Since the disc finally comes to rest, it means its total angular momentum is zero)</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>0</mn></msub><mo>=</mo><mfrac><mrow><mi>r</mi><msub><mi>&#969;</mi><mn>0</mn></msub></mrow><mn>2</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636d4050d8d9eb3056", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "40", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two uniform discs&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&nbsp;of equal radii but having different masses <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi>kg</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi>kg</mi></math>&nbsp;respectively, are connected (at centres) by a massless spring of spring constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi><mo>=</mo><mn>1000</mn><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>&nbsp;and then placed on a sufficiently rough horizontal surface. If initially, the system is released from rest with the spring being compressed by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#160;</mo><mi>cm</mi></math>, then the speed of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> when the spring comes back to its natural length, is<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ad1a64a9-2cb4-4862-a777-0b1dc70c7305-image15.png\" style=\"height: 95px; width: 200px;\" />", "image": null}, "options": [{"id": "DYcvB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>A</mi></msub><mo>=</mo><msqrt><mfrac><mn>40</mn><mn>9</mn></mfrac></msqrt><mi>&#xA0;</mi><mi mathvariant=\"normal\">m</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "Gdejg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>A</mi></msub><mo>=</mo><msqrt><mfrac><mn>20</mn><mn>9</mn></mfrac></msqrt><mi>&#xA0;</mi><mi mathvariant=\"normal\">m</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "OSc4B", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>A</mi></msub><mo>=</mo><msqrt><mfrac><mn>20</mn><mn>3</mn></mfrac></msqrt><mi>&#xA0;</mi><mi mathvariant=\"normal\">m</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "IPvNJ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>A</mi></msub><mo>=</mo><msqrt><mfrac><mn>40</mn><mn>3</mn></mfrac></msqrt><mi>&#xA0;</mi><mi mathvariant=\"normal\">m</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/b450b365-425b-4c4e-ae5f-3465dc5ccee5-image16.png\" style=\"height: 126px; width: 200px;\" /></p><p><math><mi>k</mi><mi>x</mi><mo>-</mo><mi>f</mi><mo>=</mo><mi>M</mi><mi>a</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mi>R</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup><mfrac><mi>a</mi><mi>R</mi></mfrac></math></p><p><math><mi>a</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>k</mi><mi>x</mi></mrow><mrow><mn>3</mn><mi>M</mi></mrow></mfrac></math></p><p><math><mi>f</mi><mo>=</mo><mfrac><mrow><mi>k</mi><mi>x</mi></mrow><mrow><mn>3</mn></mrow></mfrac></math></p><p>So the friction forces acting on <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&nbsp;are always equal in magnitude and opposite in direction. Hence, the net force acting on the system is always zero.<br />By energy and momentum conservation. (When spring in its natural length)</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mi>A</mi></msub><msub><mi>v</mi><mi>A</mi></msub><mo>=</mo><msub><mi>m</mi><mi>B</mi></msub><msub><mi>v</mi><mi>B</mi></msub></math></p><p><math><msub><mrow><mi>v</mi></mrow><mrow><mi>B</mi></mrow></msub><mo>=</mo><mfrac><mrow><msub><mrow><mi>v</mi></mrow><mrow><mi>A</mi></mrow></msub></mrow><mrow><mn>2</mn></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>4</mn></mfrac><msub><mi>m</mi><mi>A</mi></msub><msubsup><mi>v</mi><mi>A</mi><mn>2</mn></msubsup><mo>+</mo><mfrac><mn>3</mn><mn>4</mn></mfrac><msub><mi>m</mi><mi>B</mi></msub><msub><msup><mi>v</mi><mn>2</mn></msup><mi>B</mi></msub><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>k</mi><msup><mi>x</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>4</mn></mfrac><msub><mi>m</mi><mi>A</mi></msub><msubsup><mi>v</mi><mi>A</mi><mn>2</mn></msubsup><mo>+</mo><mfrac><mn>3</mn><mn>4</mn></mfrac><msub><mi>m</mi><mi>B</mi></msub><mfrac><msubsup><mi>v</mi><mi>A</mi><mn>2</mn></msubsup><mn>4</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>k</mi><msup><mi>x</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>9</mn><msubsup><mi>v</mi><mi>A</mi><mn>2</mn></msubsup></mrow><mn>8</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mn>1000</mn><mo>&#215;</mo><msup><mfenced><mrow><mn>0</mn><mo>.</mo><mn>1</mn></mrow></mfenced><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>A</mi></msub><mo>=</mo><msqrt><mfrac><mn>40</mn><mn>9</mn></mfrac></msqrt><mi>&#160;</mi><mi mat up><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>&nbsp;</mo></mrow></mfenced></math><br />\r<br />\r<img alt=\"\" height=\"122\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013412_Question_1.jpg\" width=\"214\" />", "image": null}, "options": [{"id": "tquPF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>33</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math><div id=\"gtx-trans\" style=\"position: absolute; left: 4px; top: -6px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "CrRdc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>.</mo><mn>66</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math><div id=\"gtx-trans\" style=\"position: absolute; left: -30px; top: -6px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "tGC71", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>33</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math><div id=\"gtx-trans\" style=\"position: absolute; left: 107px; top: 41px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "5xb2p", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>.</mo><mn>33</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math><div id=\"gtx-trans\" style=\"position: absolute; left: 107px; top: 41px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null  of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi></math> and radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> is lying on a rough horizontal plane. A constant force <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><mn>4&nbsp;</mn><mi>M</mi><mi>g</mi></math> acts vertically downwards at point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> such that the line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>OP</mi></math> makes an angle of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>°</mo></math> with the horizontal as shown in the figure. The minimum value of the coefficient of friction <math><mi>μ</mi></math> so that sphere performs pure rolling, is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-06-29_at_3.43.47_PM.jpeg\" style=\"width: 200px; height: 152px;\" />", "image": null}, "options": [{"id": "U3QZr", "text": "<math><mfrac><mn>3</mn><mn>7</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "vLA5c", "text": "<math><mfrac><mn>4</mn><mn>7</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "hrbq0", "text": "<math><mfrac><mn>2</mn><mn>7</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "oH7bz", "text": "<math><mfrac><mn>2</mn><mn>5</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img height=\"195\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/sspqkrjmeztbkwrudmmujxlnnnbvpdtvytiklesyzsdehrsxyv.png\" width=\"191\" /></p><p>Writing torque about the bottommost point,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi>M</mi><mi>g</mi><mo>&#215;</mo><mfrac><mi>R</mi><mn>2</mn></mfrac><mo>=</mo><mfrac><mn>7</mn><mn>5</mn></mfrac><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup><mfrac><mi>a</mi><mi>R</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>a</mi><mo>=</mo><mfrac><mrow><mn>10</mn><mi>g</mi></mrow><mn>7</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mo>=</mo><mi>&#956;</mi><mfenced><mrow><mn>5</mn><mi>M</mi><mi>g</mi></mrow></mfenced><mo>=</mo><mi>M</mi><mi>a</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mi>&#956;</mi><mi>g</mi><mo>=</mo><mfrac><mrow><mn>10</mn><mi>g</mi></mrow><mn>7</mn></mfrac><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mi>&#956;</mi><mo>=</mo><mfrac><mn>2</mn><mn>7</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632b696053b5280dea", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "34", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A small ball of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math> and radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">R</mi><mn>10</mn></mfrac></math> rolls without slipping along the track shown in the figure. The radius of circular part of the track is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math>. If the ball starts from rest at a height of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mi mathvariant=\"normal\">R</mi></math> above the bottom, the normal force on the ball at the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/29201_quedafdsfs.png\" style=\"width: 200px; height: 119px;\" />", "image": null}, "options": [{"id": "YBzCk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>100</mn><mn>3</mn></mfrac><mi>mg</mi></math>", "image": null, "isCorrect": false}, {"id": "ZxZvZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>100</mn><mn>9</mn></mfrac><mi>mg</mi></math>", "image": null, "isCorrect": true}, {"id": "uz5Vk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>200</mn><mn>9</mn></mfrac><mi>mg</mi></math>", "image": null, "isCorrect": false}, {"id": "yj8gD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>50</mn><mn>7</mn></mfrac><mi>mg</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Using Work-Energy Theorem</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mi>mgR</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mi>mv</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mrow><mfrac><mn>2</mn><mn>5</mn></mfrac><msup><mi>mr</mi><mn>2</mn></msup></mrow></mfenced><mo>&#215;</mo><msup><mi mathvariant=\"normal\">&#969;</mi><mn>2</mn></msup></math></p><p>since the sphere is rolling without slipping&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">v</mi><mo>=</mo><mi>r&#969;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mn>7</mn><mi>mgR</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mi mathvariant=\"normal\">&#160;</mi><mfenced separators=\"|\"><mrow><mfrac><mn>7</mn><mn>5</mn></mfrac><msup><mi>mr</mi><mn>2</mn></msup></mrow></mfenced><mo>&#215;</mo><mi mathvariant=\"normal\">&#160;</mi><mfrac><msup><mi mathvariant=\"normal\">v</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">r</mi><mn>2</mn></msup></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi mathvariant=\"normal\">v</mi><mn>2</mn></msup><mo>=</mo><mn>10</mn><mi>gR</mi></math></p><p>at point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math>, we can consider sphere as a point object doing circular motion in a circle of the radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">R</mi><mo>-</mo><mi mathvariant=\"normal\">r</mi><mo>)</mo></math>&nbsp;with velocity&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">v</mi></math>,</p><p>Hence at point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">N</mi><mo>=</mo><mfrac><msup><mi>mv</mi><mn>2</mn></msup><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">R</mi><mo>-</mo><mi mathvariant=\"normal\">r</mi></mrow></mfenced></mfrac><mo>=</mo><mfrac><mrow><mn>10</mn><mi>mgR</mi></mrow><mfenced><mrow><mi mathvariant=\"normal\">R</mi><mo>-</mo><mfrac><mi mathvariant=\"normal\">R</mi><mn>10</mn></mfrac></mrow></mfenced></mfrac><mo>=</mo><mfrac><mrow><mn>10</mn><mi>mgR</mi></mrow><mstyle displaystyle=\"true\"><mfrac><mrow><mn>9</mn><mi mathvariant=\"normal\">R</mi></mrow><mn>10</mn></mfrac></mstyle></mfrac></math>&nbsp; &nbsp;( given&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">R</mi><mn>10</mn></mfrac></math>&nbsp;)</p><p>or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">N</mi><mo>=</mo><mfrac><mn>100</mn><mn>9</mn></mfrac><mi>mg</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632a3cb900007942ee", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "79", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform solid sphere of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi></math> and radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> is lying on a rough horizontal plane. A constant force <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><mn>4&nbsp;</mn><mi>M</mi><mi>g</mi></math> acts vertically downwards at point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> such that the line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>OP</mi></math> makes an angle of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>°</mo></math> with the horizontal as shown in the figure. The minimum value of the coefficient of friction <math><mi>μ</mi></math> so that sphere performs pure rolling, is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-08-05_at_2.22.18_PM.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 200px; height: 163px;\" />", "image": null}, "options": [{"id": "mfmBw", "text": "<math><mfrac><mn>3</mn><mn>7</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "nZe3P", "text": "<math><mfrac><mn>4</mn><mn>7</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "ebFET", "text": "<math><mfrac><mn>2</mn><mn>7</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "XTklF", "text": "<math><mfrac><mn>2</mn><mn>5</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"t mi mathvariant=\"normal\">ω</mi><mn>0</mn></msub></math>. Once the pure rolling starts; let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>2</mn></msub></math> be the linear speeds of their centres of mass, then", "image": null}, "options": [{"id": "riP2g", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>1</mn></msub><mo>=</mo><msub><mi>v</mi><mn>2</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "OOZFU", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>1</mn></msub><mo>&gt;</mo><msub><mi>v</mi><mn>2</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "sjzUY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>1</mn></msub><mo>&lt;</mo><msub><mi>v</mi><mn>2</mn></msub></math>", "image": null, "isCorrect": true}, {"id": "eufQd", "text": "Data is insufficient", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From conservation of angular momentum about point of contact :<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029667_Ans.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 197px; height: 98px;\" /><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext mathvariant=\"italic\">I</mtext> <msub> <mi mathvariant=\"normal\">ω</mi> <mn>0</mn> </msub> <mo>=</mo> <mtext mathvariant=\"italic\">I</mtext> <mi mathvariant=\"normal\">ω</mi> <mo>+</mo> <mtext mathvariant=\"italic\">mRv</mtext> </mrow> </math><br />or&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext mathvariant=\"italic\">I</mtext> <msub> <mi mathvariant=\"normal\">ω</mi> <mn>0</mn> </msub> <mo>=</mo> <mtext mathvariant=\"italic\">I</mtext> <mfrac> <mrow> <mtext mathvariant=\"italic\">v</mtext> </mrow> <mrow> <mtext mathvariant=\"italic\">R</mtext> </mrow> </mfrac> <mo>+</mo> <mtext mathvariant=\"italic\">mRv</mtext> </mrow> </math><br />or&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext mathvariant=\"italic\">v</mtext> <mo>=</mo> <mfrac> <mrow> <mtext mathvariant=\"italic\">I</mtext> <msub> <mi mathvariant=\"normal\">ω</mi> <mn>0</mn> </msub> </mrow> <mrow> <mfrac> <mrow> <mtext mathvariant=\"italic\">I</mtext> </mrow> <mrow> <mtext mathvariant=\"italic\">R</mtext> </mrow> </mfrac> <mo>+</mo> <mtext mathvariant=\"italic\">mR</mtext> </mrow> </mfrac> </mrow> </math><br />or&nbsp;<br />or&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext mathvariant=\"italic\">v</mtext> <mo>=</mo> <mfrac> <mrow> <msub> <mi mathvariant=\"normal\">ω</mi> <mn>0</mn> </msub> </mrow> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <mtext mathvariant=\"italic\">mR</mtext> </mrow> <mrow> <mtext mathvariant=\"italic\">I</mtext> </mrow> </mfrac> </mrow> </mfrac> </mrow> </math><br />Now&nbsp;<math> <mrow> <msub> <mtext mathvariant=\"italic\">I</mtext> <mrow> <mtext>solid</mtext> <mspace width=\"0.5em\"></mspace> <mtext>sphere &lt;</mtext> </mrow> </msub> <msub> <mtext mathvariant=\"italic\">I</mtext> <mtext>hollow</mtext> </msub> </mrow> </math><br />∴&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mtext mathvariant=\"italic\">v</mtext> <mrow> <mtext>solid</mtext> <mspace width=\"0.5em\"></mspace> <mo>&lt;</mo> </mrow> </msub> <msub> <mtext mathvariant=\"italic\">v</mtext> <mtext>hollow</mtext> </msub> </mrow> </math><br />∴&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mtext mathvariant=\"italic\">v</mtext> <mn>1</mn> </msub> <mo>&lt;</mo> <msub> <mtext mathvariant=\"italic\">v</mtext> <mn>2</mn> </msub> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863058e9b8aacec32c8", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "09", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A solid cylinder is given a velocity&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>0</mn></msub></math>&nbsp;and an angular speed&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#969;</mi><mn>0</mn></msub></math>&nbsp;in the anticlockwise direction and then it is placed gently&nbsp;on a&nbsp;very long rough plank (initially at rest)&nbsp;as shown in the figure. Then, choose the <strong>incorrect</strong> statement:</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/628353_CA_que.png\" style=\"width: 240px; height: 113px;\" /></p>\r", "image": null}, "options": [{"id": "AWQUE", "text": "the friction force on the disc is in the backward direction till pure rolling starts", "image": null, "isCorrect": false}, {"id": "hvSDW", "text": "the friction force between the disc and the plank is kinetic in nature till pure rolling starts", "image": null, "isCorrect": false}, {"id": "1xBcM", "text": "the total momentum of system (disc and plank) is conserved", "image": null, "isCorrect": false}, {"id": "dveng", "text": "the angular momentum of the disc about any point on the horizontal surface remains conserved", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>Initial velocity of point of contact of disc is in forward direction.</p><p>Hence friction is in backward direction and kinetic in nature.</p><p>Net force on the system is zero. So momentum is conserved.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863052bf63f1ed5fe29", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "27", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A disc of radius <math> <mtext>R</mtext> </math> rolls without slipping at a speed&nbsp;<math><mtext>v</mtext> </math> along the positive <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi></math>-axis. The velocity of a point <math> <mtext>P</mtext> </math> at the instant shown in the figure is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0030130_Question._._.jpg\" style=\"width: 198px; height: 192px;\" />", "image": null}, "options": [{"id": "XI0z6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mover><mtext>v</mtext><mo>&#x2192;</mo></mover><mtext>P</mtext></msub><mo>=</mo><mfenced><mrow><mtext>v</mtext><mo>+</mo><mfrac><mrow><mtext>v r sin</mtext><mspace width=\"0.5em\"/><mi mathvariant=\"normal\">&#x3B8;</mi></mrow><mtext>R</mtext></mfrac></mrow></mfenced><mover><mtext>i</mtext><mo>^</mo></mover><mo>+</mo><mfrac><mrow><mtext>v r cos</mtext><mspace width=\"0.5em\"/><mi mathvariant=\"normal\">&#x3B8;</mi></mrow><mtext>R</mtext></mfrac><mover><mtext>j</mtext><mo>^</mo></mover></math>", "image": null, "isCorrect": false}, {"id": "CCqAg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mover><mtext>v</mtext><mo>&#x2192;</mo></mover><mtext>P</mtext></msub><mo>=</mo><mfenced><mrow><mtext>v</mtext><mo>+</mo><mfrac><mrow><mtext>v r sin</mtext><mspace width=\"0.5em\"/><mi mathvariant=\"normal\">&#x3B8;</mi></mrow><mtext>R</mtext></mfrac></mrow></mfenced><mover><mtext>i</mtext><mo>^</mo></mover><mo>-</mo><mfrac><mrow><mtext>v r cos</mtext><mspace width=\"0.5em\"/><mi mathvariant=\"normal\">&#x3B8;</mi></mrow><mtext>R</mtext></mfrac><mover><mtext>j</mtext><mo>^</mo></mover></math>", "image": null, "isCorrect": true}, {"id": "HQi1C", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mover><mtext>v</mtext><mo>&#x2192;</mo></mover><mtext>P</mtext></msub><mo>=</mo><mfrac><mrow><mtext>v r sin</mtext><mspace width=\"0.5em\"/><mi mathvariant=\"normal\">&#x3B8;</mi></mrow><mtext>R</mtext></mfrac><mover><mtext>i</mtext><mo>^</mo></mover><mo>+</mo><mfrac><mrow><mtext>v r cos</mtext><mspace width=\"0.5em\"/><mi mathvariant=\"normal\">&#x3B8;</mi></mrow><mtext>R</mtext></mfrac><mover><mtext>j</mtext><mo>^</mo></mover></math>", "image": null, "isCorrect": false}, {"id": "P1dtx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mover><mtext>v</mtext><mo>&#x2192;</mo></mover><mtext>P</mtext></msub><mo>=</mo><mfrac><mrow><mtext>v r sin</mtext><mspace width=\"0.5em\"/><mi mathvariant=\"normal\">&#x3B8;</mi></mrow><mtext>R</mtext></mfrac><mover><mtext>i</mtext><mo>^</mo></mover><mo>-</mo><mfrac><mrow><mtext>v r cos</mtext><mspace width=\"0.5em\"/><mi mathvariant=\"normal\">&#x3B8;</mi></mrow><mtext>R</mtext></mfrac><mover><mtext>j</mtext><mo>^</mo></mover></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">ω</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">R</mi></mfrac></math>&nbsp;for pure rolling.<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0030130_Ans.jpg\" style=\"width: 191px; height: 192px;\" /><br /><br />The velocity of point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> is resultant of two velocity vectors shown as arrows in the figure. Hence,<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mrow> <mover accent=\"true\"> <mtext>v</mtext> <mo>→</mo> </mover> </mrow> <mtext>P</mtext> </msub> <mo>=</mo> <msub> <mtext>v</mtext> <mtext>x</mtext> </msub> <mover accent=\"true\"> <mtext>i</mtext> <mo>^</mo> </mover> <mo>+</mo> <msub> <mtext>v</mtext> <mtext>y</mtext> </msub> <mover accent=\"true\"> <mtext>j</mtext> <mo>^</mo> </mover> </mrow> </math><br /><br />or&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mrow> <mover accent=\"true\"> <mtext>v</mtext> <mo>→</mo> </mover> </mrow> <mtext>P</mtext> </msub> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>v</mtext> <mo>+</mo> <mfrac> <mrow> <mtext>v r sin</mtext> <mspace width=\"0.5em\"></mspace> <mi mathvariant=\"normal\">θ</mi> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </mfenced> <mrow> <mspace width=\"0.5em\"></mspace> <mover accent=\"true\"> <mtext>i</mtext> <mo>^</mo> </mover> </mrow> <mo>-</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>v r cos</mtext> <mspace width=\"0.5em\"></mspace> <mi mathvariant=\"normal\">θ</mi> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </mfenced> <mspace width=\"0.5em\"></mspace> <mover accent=\"true\"> <mtext>j</mtext> <mo>^</mo> </mover> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "6aa3ab79aa8dc1ff6817809c", "title": "Combination of Translation and Rotation", "totalQuestions": 10, "questions": [{"_id": "6151e863fc43a88e0e18dd92", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "62", "isVisible": true}], "previousYearPap msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> towards right. Find the time (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">s</mi></math>) after which plank and cylinder will separate. [<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">g</mi><mo>=</mo><mn>10</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>]<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0102907.jpg\" style=\"width: 295px; height: 109px;\" />", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "Drawing free body diagram of the cylinder with respect to plank.<br/><br/> <math><mn>2</mn><mi>μ</mi><mi>m</mi><mi>g</mi><mo>=</mo><mi>m</mi><mi>a</mi><mo>⇒</mo><mi>a</mi><mo>=</mo><mn>2</mn><mi>μ</mi><mi>g</mi></math> <br/><br/> <math><mfenced separators=\"|\"><mrow><mi>μ</mi><mi>m</mi><mi>g</mi><mi>R</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>m</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>α</mi><mi mathvariant=\"normal\"> </mi><mo>;</mo><mi>α</mi><mo>-</mo><mfrac><mrow><mn>2</mn><mi>μ</mi><mi>g</mi></mrow><mrow><mi>r</mi></mrow></mfrac></math> <br/><br/>Acceleration of point of contact with respect to plank is  <math><mn>4</mn><mi>μ</mi><mi>g</mi></math> <br/><br/>Velocity of pure rolling starts,<br/><br/> <math><mo>-</mo><mi mathvariant=\"normal\">v</mi><mo>+</mo><mn>4</mn><mi mathvariant=\"normal\">μ</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">t</mi><mo>=</mo><mn>0</mn></math> <br/><br/> <math><mi mathvariant=\"normal\">t</mi><mo>=</mo><mfrac><mrow><mn>20</mn></mrow><mrow><mn>4</mn><mo>×</mo><mn>0.5</mn><mo>×</mo><mn>10</mn></mrow></mfrac><mo>=</mo><mn>1</mn><mi mathvariant=\"normal\">s</mi></math> <br/><br/>Distance traveled by cylinder with respect to plank in 1s is<br/><br/> <math><msup><mrow><mi mathvariant=\"normal\">S</mi></mrow><mrow><mi mathvariant=\"normal\">&prime;</mi></mrow></msup><mo>=</mo><mo>-</mo><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">t</mi><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mfenced separators=\"|\"><mrow><mn>2</mn><mi mathvariant=\"normal\">μ</mi><mi mathvariant=\"normal\">g</mi></mrow></mfenced><msup><mrow><mi mathvariant=\"normal\">t</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mo>-</mo><mn>15</mn><mi mathvariant=\"normal\">m</mi></math> <br/><br/>At  <math><mi mathvariant=\"normal\">t</mi><mo>=</mo><mn>1</mn><mi mathvariant=\"normal\">s</mi></math> , the velocity of cylinder with respect to plank is<br/><br/> <math><mi mathvariant=\"normal\">t</mi><mo>=</mo><mn>1</mn><mi mathvariant=\"normal\">s</mi></math> <br/><br/> <math><msub><mrow><mi mathvariant=\"normal\">v</mi></mrow><mrow><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">l</mi></mrow></msub><mo>=</mo><mo>-</mo><mi mathvariant=\"normal\">v</mi><mo>+</mo><mn>2</mn><mi mathvariant=\"normal\">μ</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">t</mi><mo>=</mo><mo>-</mo><mn>20</mn><mo>+</mo><mn>2</mn><mo>×</mo><mn>0.5</mn><mo>×</mo><mn>10</mn><mo>=</mo><mo>-</mo><mn>10</mn></math>  m/s<br/><br/>Remaining 10 m will be travelled in time  <math><msup><mrow><mi mathvariant=\"normal\">t</mi></mrow><mrow><mi mathvariant=\"normal\">&prime;</mi></mrow></msup><mo>=</mo><mfrac><mrow><mn>10</mn></mrow><mrow><mn>10</mn></mrow></mfrac><mo>=</mo><mn>1</mn><mi mathvariant=\"normal\">s</mi></math> <br/><br/> <math><mo>∴</mo></math>  Total time = 2s", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d16392c526afbaeb", "type": "singleCorrect", "level , "image": null, "isCorrect": false}, {"id": "VXgN8", "text": "perpendicular to velocity of point <math><mi>Q</mi></math> ( <math><mi>Q</mi></math> and <math><mi>C</mi></math> are at same horizontal level)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/56bb0644-01cf-437c-b68a-67e47bf85e00-image25.jpeg\" /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">V</mi><mn>1</mn></msub><mtext>&#160;cos&#160;</mtext><msup><mn>60</mn><mo>&#8728;</mo></msup><mo>=</mo><mfrac><mrow><mn>3</mn><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub></mrow><mn>2</mn></mfrac><mtext>&#160;cos&#160;</mtext><msup><mn>30</mn><mo>&#8728;</mo></msup><mspace linebreak=\"newline\"/><mo>&#8658;</mo><msub><mi mathvariant=\"normal\">V</mi><mn>1</mn></msub><mo>=</mo><mfrac><mrow><mn>3</mn><msqrt><mn>3</mn></msqrt></mrow><mn>2</mn></mfrac><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a97e24e9a845aaec", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "109", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the figure shown, the plank is being pulled to the right with a constant speed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math>. If the cylinder does not slip then<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0031340_Question.._._xyz.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 220px; height: 141px;\" />", "image": nu length&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math> and radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> has two cords wound around it with their ends attached to the ceiling, as shown in the figure. The cylinder is held horizontally with the two cords vertical. When the system is released from rest, the linear acceleration of the cylinder as it falls will be<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-08-26_at_3.19.38_PM.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 200px; height: 146px;\" />", "image": null}, "options": [{"id": "4pPYY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>g</mi><mn>3</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "jR1G6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mi>g</mi></mrow><mn>3</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "iG5uC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><mi>g</mi></mrow><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "7GMQt", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>g</mi><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The cylinder rotating under gravity has both translational and rotational motions. Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math> be the linear velocity of its centre of mass and &omega; its angular velocity about the axis of rotation, then in descending a distance h it will lose PE = Mgh while the gain in KE<br /><br /><u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014139_AnsExp2_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 329px; height: 379px;\" /></strong></u><br /><br /><math>
