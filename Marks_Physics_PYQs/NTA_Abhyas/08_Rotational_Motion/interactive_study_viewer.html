</mo><mi>rad</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. The angular velocity of the disc, if a mass of <math><mtext>0.25</mtext><mo>&nbsp;</mo><mi>kg</mi></math> is put on the periphery is", "image": null}, "options": [{"id": "epjmI", "text": "<math><msup><mrow><mn>24</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">d&nbsp;</mi><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "PvXxR", "text": "<math><msup><mrow><mn>36</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">d&nbsp;</mi><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "8bLun", "text": "<math><msup><mrow><mn>15</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">d&nbsp;</mi><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "vjpuO", "text": "<math><msup><mrow><mn>26</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">d&nbsp;</mi><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If no external torque acts on a system of particle then angular momentum of the system remains constant, that is,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#964;</mi><mo>=</mo><mn>0</mn></math><br /><br /><math><mo>&#8658;</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>dL</mi><mi>dt</mi></mfrac><mo>=</mo><mn>0</mn></math><br /><br /><math><mo>&#8658;</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">L</mi><mo>=</mo><mi>I&#969;</mi><mo>=</mo></math>constant<br /><br /><math><mo>&#8658;</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">I</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">&#969;</mi><mn>1</mn></msub><mo>=</mo><msub><mi mathvariant=\"normal\">I</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">&#969;</mi><mn>2</mn></msub></math><br /><br /><math><mo>&#8756;</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mi>Mr</mi><mn>2</mn></msup><msub><mi mathvariant=\"normal\">&#969;</mi><mn>1</mn></msub><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">M</mi><mo>+</mo><mn>2</mn><mi mathvariant=\"normal\">m</mi></mrow></mfenced><msup><mi mathvariant=\"normal\">r</mi><mn>2</mn></msup><msub><mi mathvariant=\"normal\">&#969;</mi><mn>2</mn></msub></math> ...(i)<br /><br />Here, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi><mo>=</mo><mn>2</mn><mo>&#160;</mo><mi>kg</mi></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi><mo>=</mo><mtext>0.25</mtext><mo>&#160;</mo><mi>kg</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi><mo>=</mo><mtext>0.2</mtext><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">&#969;</mi><mn>1</mn></msub><mo>=</mo><mn>30</mn><mi mathvariant=\"normal\">&#160;</mi><mi>rad</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br />Hence, we get after putting the given values in Eq. (i)<br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>&#215;</mo><mn>2</mn><mo>&#215;</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>0.2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>&#215;</mo><mn>30</mn><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>&#215;</mo><mfenced separators=\"|\"><mrow><mn>2</mn><mo>+</mo><mn>2</mn><mo>&#215;</mo><mn>0.25</mn></mrow></mfenced><msup><mrow><mfenced separators=\"|\"><mrow><mn>0.2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>&#215;</mo><msub><mrow><mi>&#969;</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br /><math><mo>&#8658;</mo></math> <math><mn>60</mn><mo>=</mo><mn>2.5</mn><msub><mrow><mi>&#969;</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br /><math><mo>&#8756;</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#969;</mi><mn>2</mn></msub><mo>=</mo><mn>24</mn><mi>&#160;</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">d</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634053d9181a5e0976", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "65", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform thin rod&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math> of length&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math> and mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> is undergoing rotation about a fixed axis passing through end&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and perpendicular to the rod, such that end&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> remains stationary as shown. The kinetic energy of section&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AP</mi></math> of the rod is equal to the kinetic energy of section&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BP</mi></math> of the rod at an instant. Then what is the value of <math><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">B</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">p</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>3</mn></mrow></msup></math>?(<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AP</mi></math> are lengths of respective parts of the rod)<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image24-182ae1ac-674d-4960-989a-459b22f73dc9.jpg\" />", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "The KE of given section AP and PB will be equal if the moment of inertia of each section AP and section PB about A is same.<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image25-24a337f1-98dc-49f1-a4ba-06f1a65e5bd3.jpg\" /><br /><br />Moment of inertia of segment AP w.r.t given axis <math><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">λ</mi><mi mathvariant=\"normal\">x</mi></mrow></mfenced><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>3</mn></mrow></mfrac><mi mathvariant=\"normal\">&nbsp;</mi></math><br /><br />Moment of inertia of segment PB w.r.t given axis <math><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">λ</mi><mi mathvariant=\"normal\">L</mi></mrow></mfenced><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>3</mn></mrow></mfrac><mo>-</mo><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">λ</mi><mi mathvariant=\"normal\">x</mi></mrow></mfenced><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>3</mn></mrow></mfrac></math><br /><br />(Moment of inertia or rod AB w.r.t. given axis is <math><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>0</mn></mrow></msub></math> )<br /><br /><math><mo>∴</mo><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>⇒</mo><mfrac><mrow><mi mathvariant=\"normal\">λ</mi><msup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow><mrow><mn>3</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">λ</mi><msup><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow><mrow><mn>3</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">λ</mi><msup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow><mrow><mn>3</mn></mrow></mfrac></math><br /><br />Or <math><msup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>3</mn></mrow></msup><mo>=</mo><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><br /><math><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">B</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">P</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>3</mn></mrow></msup><mo>=</mo><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow><mrow><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfrac><mo>=</mo><mn>2</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863384897a9162fe5c2", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "07", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Four solid spheres each of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math>&nbsp;and radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;are placed at four corners of a light square frame of side length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi>R</mi></math>&nbsp;such that centres of spheres coincide with corners of the square. What will be the moment of inertia of the system about an axis normal to the plane of the frame and passing through its centre?", "image": null}, "options": [{"id": "PcgVE", "text": "<math><mfrac><mrow><mn>21</mn><mi>M</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>5</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "HmtnT", "text": "<math><mfrac><mrow><mn>42</mn><mi>M</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>5</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "gsm9i", "text": "<math><mfrac><mrow><mn>84</mn><mi>M</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>5</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "N3ouk", "text": "<math><mfrac><mrow><mn>168</mn><mi>M</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>5</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math><mi mathvariant=\"normal\">I</mi><mo>=</mo><mn>4</mn><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow></msub></math><br /><br />Where <math><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow></msub></math> is MI of each sphere<br /><br /><math><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mi mathvariant=\"normal\">c</mi></mrow></msub><mo>+</mo><mi mathvariant=\"normal\">M</mi><msup><mrow><mi mathvariant=\"normal\">d</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br />And <math><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mi mathvariant=\"normal\">c</mi></mrow></msub><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mi mathvariant=\"normal\">M</mi><msup><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>2</mn></mrow></msup></math> ; <math><mi mathvariant=\"normal\">d</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac></math> ; <math><mi mathvariant=\"normal\">L</mi><mo>=</mo><mn>4</mn><mi mathvariant=\"normal\">R</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86337b82dec1661aeb1", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "101", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform circular disc has radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> and mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>. A particle, also of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>, is fixed at a point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> on the edge of the disc as shown in the diagram. The disc can rotate freely about a fixed horizontal chord <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>PQ</mi></math> that is at a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac bevelled=\"true\"><mi>R</mi><mn>4</mn></mfrac></math> from the centre <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math> of the disc. The line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AC</mi></math> is perpendicular to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>PQ</mi></math>.<br />\rInitially, the disc is held vertical with point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> at its highest position. It is then allowed to fall so that it starts rotating about <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>PQ</mi></math>. Find the linear speed of the particle as it reaches its lowest position.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/dadsadsfd.JPG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 200px; height: 157px;\" />", "image": null}, "options": [{"id": "FQ9TC", "text": "<math><mrow><mo>-</mo>  <msqrt>    <mtext>2gR</mtext>  </msqrt></mrow></math>", "image": null, "isCorrect": false}, {"id": "dXq2g", "text": "<math><mrow>  <msqrt>    <mtext>3gR</mtext>  </msqrt></mrow></math>", "image": null, "isCorrect": false}, {"id": "apDl7", "text": "<math><mrow><mo>-</mo>  <msqrt>    <mtext>4gR</mtext>  </msqrt></mrow></math>", "image": null, "isCorrect": false}, {"id": "Eff3C", "text": "<math> <mrow> <msqrt> <mtext>5gR</mtext> </msqrt> </mrow> </math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "As moment of inertia of a disc about a diameter is <math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msup> <mtext>mR</mtext> <mn>2</mn> </msup> </mrow> </mfenced> <mtext>,</mtext> </mrow> </math> the moment of inertia of the disc about the chord PQ by &#39;theorem of parallel axes&#39; will be<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <msub> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>I</mtext> <mtext>D</mtext> </msub> </mrow> </mfenced> </mrow> <mtext>PQ</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> <msup> <mtext>mR</mtext> <mn>2</mn> </msup> <mo>+</mo> <mtext>m</mtext> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> <mo>=</mo> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mtext>16</mtext> </mrow> </mfrac> <msup> <mtext>mR</mtext> <mn>2</mn> </msup> </mrow> </math><br /><br />and as particle of mass m is at a distance [R + (R/4) = (5/4)R] from PQ, the moment of inertia of the system about PQ<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>I</mtext> <mo>=</mo> <msub> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>I</mtext> <mtext>D</mtext> </msub> </mrow> </mfenced> </mrow> <mtext>PQ</mtext> </msub> <mo>+</mo> <msub> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>I</mtext> <mtext>P</mtext> </msub> </mrow> </mfenced> </mrow> <mtext>PQ</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mtext>16</mtext> </mrow> </mfrac> <msup> <mtext>mR</mtext> <mn>2</mn> </msup> <mo>+</mo> <mtext>m</mtext> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> <mo>=</mo> <mfrac> <mrow> <mn>1</mn><mn>5</mn> </mrow> <mrow> <mn>8</mn> </mrow> </mfrac> <msup> <mtext>mR</mtext> <mn>2</mn> </msup> </mrow> </math><br /><br />Now if &omega;&nbsp;is the angular speed of the system when A reaches the lowest point A&#39; on rotation about the axis PQ, by &#39;conservation of mechanical energy&#39;,<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>I</mtext> <msup> <mtext>&omega;</mtext> <mn>2</mn> </msup> <mo>=</mo> <mtext>mg</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msup> <mtext>AA</mtext> <mo>&prime;</mo> </msup> </mrow> </mfenced> <mo>+</mo> <msup> <mtext>mgCC</mtext> <mo>&prime;</mo> </msup> <mo>=</mo> <mtext>mg</mtext> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mtext>2AD</mtext> <mo>+</mo> <mtext>2CD</mtext> </mrow> </mfenced> </mrow> </math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014144_AnsExp_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 300px; height: 147px;\" /><br /><br /><math> <mrow> <mtext>i.e.,</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>&times;</mo> <mfrac> <mrow> <mtext>15</mtext> </mrow> <mrow> <mn>8</mn> </mrow> </mfrac> <mtext>mR</mtext> <msup> <mspace></mspace> <mn>2</mn> </msup> <msup> <mtext>&omega;</mtext> <mn>2</mn> </msup> <mo>=</mo> <mn>2</mn> <mtext>mg</mtext> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>R</mtext> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </mfenced> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </mfenced> <mtext>,</mtext> </mrow> </math><br /><br /><math> <mrow> <mtext>i.e.,</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>&omega;</mtext> <mo>=</mo> <mn>4</mn> <msqrt> <mfrac> <mrow> <mtext>g</mtext> </mrow> <mrow> <mtext>5R</mtext> </mrow> </mfrac> </msqrt> </mrow> </math><br /><br /><math> <mrow> <mtext>so</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <msub> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>v</mtext> </mrow> </mfenced> </mrow> <msup> <mtext>A</mtext> <mo>&prime;</mo> </msup> </msub> <mo>=</mo> <mtext>r</mtext> <mtext>&omega;</mtext> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>R</mtext> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </mfenced> <mo>&times;</mo> <mn>4</mn> <msqrt> <mfrac> <mrow> <mtext>g</mtext> </mrow> <mrow> <mtext>5R</mtext> </mrow> </mfrac> </msqrt> <mo>=</mo> <msqrt> <mtext>5gR</mtext> </msqrt> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633354374425002b2b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "87", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Let <math> <mi>M</mi> </math> be the mass and <math> <mi>L</mi> </math> be the length of a thin uniform rod. In first case, axis of rotation is passing through center and perpendicular to the length of the rod. In second case axis of rotation is passing through one end and perpendicular to the length of the rod. The ratio of radius of gyration in first case to second case is", "image": null}, "options": [{"id": "Uo7cJ", "text": "<math><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "BhRAb", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "K0MOQ", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "VOT0H", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>8</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Moment of inertia of rod whose axis of rotation is passing through center and perpendicular to the plane of rod is<br /><br /><math><mi>I</mi><mo>=</mo><mfrac><mrow><mi>M</mi><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>12</mn></mrow></mfrac><mi>&nbsp;</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">d</mi><mi>&nbsp;</mi><mi>I</mi><mo>=</mo><mi>M</mi><msubsup><mrow><mi>K</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup></math> (where <math> <mrow> <msub> <mtext>K</mtext> <mn>1</mn> </msub> </mrow> </math> radius of gravitation)<br /><br /><math><mo>⇒</mo><msub><mrow><mi>K</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfrac><mrow><mi>L</mi></mrow><mrow><mn>2</mn><msqrt><mn>3</mn></msqrt></mrow></mfrac></math> ..... (i)<br /><br />When axis of rotation of rod is passing through one end of rod, then<br /><br /><math><mi>I</mi><mo>=</mo><mi>M</mi><msubsup><mrow><mi>K</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>=</mo><mfrac><mrow><mi>M</mi><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>3</mn></mrow></mfrac><mo>⇒</mo><msub><mrow><mi>K</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><mi>L</mi></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math> ..... (ii)<br /><br />Taking ratios of (i) and (ii) we get<br /><br /><math><mfrac><mrow><msub><mrow><mi>K</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>K</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>L</mi></mrow><mrow><mn>2</mn><msqrt><mn>3</mn><mi>&nbsp;</mi></msqrt></mrow></mfrac><mo>×</mo><mfrac><mrow><msqrt><mn>3</mn></msqrt></mrow><mrow><mi>L</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><msub><mrow><mi>K</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>K</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632bbccfe3723d7de4", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "46", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A bullet of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">g</mi></math>&nbsp;and speed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>500</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>&nbsp;is fired into a door and gets embedded exactly at the centre of the door. The door is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>0</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>&nbsp;wide and weighs <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>&nbsp;</mo><mi>kg</mi></math>. It is hinged at one end and rotates about a vertical axis practically without friction. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ω</mi></math>&nbsp;is the angular speed (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>rad</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>) of the door just after the bullet embeds into it, then find the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mi>ω</mi></math>. Ignore the mass of the bullet as compared to the door.", "image": null}, "options": [], "correctValue": "6.25", "solution": {"text": "Given, mass of bullet (m) = 10 g&nbsp;= 0.01 kg<br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; Speed of bullet (v) = 500 m s<sup>-1</sup><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; Width of the door (l) = 1.0 m<br /><br />&nbsp; &nbsp; &nbsp; Mass of the door (M) = 12 kg<br /><br />As bullet gets embedded exactly at the centre of the door, therefore its distance from the hinged end of the door,<br /><br />​<math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>(r)</mtext> <mo>=</mo> <mfrac> <mrow> <mi>l</mi><mo>⁡</mo> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>m</mtext> </mrow> </math><br /><br />Angular momentum transferred by the bullet to the door,<br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;(L) = mv × r<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mo>=</mo> <mtext>0.01</mtext> <mo>×</mo> <mtext>500</mtext> <mo>×</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;= 2.5 J-s<br /><br />Moment of inertia of the door about the vertical axis at one of its end,<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>(I)</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>M</mtext> <msup> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi>l</mi><mo>⁡</mo> </mrow> <mn>2</mn> </msup> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>12</mtext> <mo>×</mo> <msup> <mtext>(1)</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> <mo>=</mo> <msup> <mtext>4 kg-m</mtext> <mn>2</mn> </msup> </mrow> </math><br /><br />But angular momentum, (L) = Iω​<br /><br />∴&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 2.5 = 4 × ω<br /><br /><math> <mrow> <mtext>or&nbsp;</mtext> <mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>ω</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>2.5</mtext> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> </mrow> </math><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; ω = 0.625 rad s<sup>-1</sup>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632841fa5e6ffa2270", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "107", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A solid sphere and hollow sphere of the same mass and radius are given a spin about their centre of mass and then, they are placed on a rough horizontal surface. The spin angular velocity is the same for both the spheres and it is equal to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">ω</mi><mn>0</mn></msub></math>. Once the pure rolling starts; let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>2</mn></msub></math> be the linear speeds of their centres of mass, then", "image": null}, "options": [{"id": "riP2g", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>1</mn></msub><mo>=</mo><msub><mi>v</mi><mn>2</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "OOZFU", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>1</mn></msub><mo>&gt;</mo><msub><mi>v</mi><mn>2</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "sjzUY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>1</mn></msub><mo>&lt;</mo><msub><mi>v</mi><mn>2</mn></msub></math>", "image": null, "isCorrect": true}, {"id": "eufQd", "text": "Data is insufficient", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From conservation of angular momentum about point of contact :<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029667_Ans.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 197px; height: 98px;\" /><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext mathvariant=\"italic\">I</mtext> <msub> <mi mathvariant=\"normal\">ω</mi> <mn>0</mn> </msub> <mo>=</mo> <mtext mathvariant=\"italic\">I</mtext> <mi mathvariant=\"normal\">ω</mi> <mo>+</mo> <mtext mathvariant=\"italic\">mRv</mtext> </mrow> </math><br />or&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext mathvariant=\"italic\">I</mtext> <msub> <mi mathvariant=\"normal\">ω</mi> <mn>0</mn> </msub> <mo>=</mo> <mtext mathvariant=\"italic\"> 0629609.jpg\" style=\"width: 362px; height: 232px;\" /></p>\r\r<p>&nbsp;</p>\r", "image": null}, "options": [{"id": "jnR7r", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>7</mn><mi mathvariant=\"normal\">&#8467;</mi></mrow><mn>15</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "9Ccwq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mi>&#8467;</mi></mrow><mn>5</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "Cr99G", "text": "<math> <mrow> <mfrac> <mrow> <mn>8</mn><mi mathvariant=\"script\">l</mi></mrow> <mrow> <mn>15</mn></mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "NwJUT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>4</mn><mi>ℓ</mi></mrow><mn>5</mn></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>I</mi><mrow><mi>A</mi><mi>B</mi></mrow></msub><mo>=</mo><mo>∫</mo><msup><mi>y</mi><mn>2</mn></msup><mi>d</mi><mi>m</mi><mo>=</mo><mfrac><msub><mi>λ</mi><mn>0</mn></msub><msup><mi>ℓ</mi><mn>3</mn></msup></mfrac><msubsup><mo>∫</mo><mrow><mo>-</mo><mi>x</mi></mrow><mrow><mi>l</mi><mo>-</mo><mi>x</mi></mrow></msubsup><mo>(</mo><mi>y</mi><mo>+</mo><mi>x</mi><msup><mo>)</mo><mn>3</mn></msup><msup><mi>y</mi><mn>2</mn></msup><mi>d</mi><mi>y</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∫</mo><mo>(</mo><mi>y</mi><mo>+</mo><mi>x</mi><msup><mo>)</mo><mn>3</mn></msup><msup><mi>y</mi><mn>2</mn></msup><mi>d</mi><mi>y</mi><mo>=</mo><msup><mi>y</mi><mn>2</mn></msup><mfrac><mrow><mo>(</mo><mi>y</mi><mo>+</mo><mi>x</mi><msup><mo>)</mo><mn>4</mn></msup></mrow><mn>4</mn></mfrac><mo>-</mo><mo>∫</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>y</mi><mo>(</mo><mi>y</mi><mo>+</mo><mi>x</mi><msup><mo>)</mo><mn>4</mn></msup><mi>d</mi><mi>y</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/Mat
