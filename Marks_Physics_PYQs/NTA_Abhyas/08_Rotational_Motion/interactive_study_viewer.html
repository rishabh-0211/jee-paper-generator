"normal\">g</mi></mrow><mrow><mn>13</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "AWWck", "text": "<math><mfrac><mrow><mi mathvariant=\"normal\">g</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "qDX2k", "text": "<math><mfrac><mrow><mn>3</mn><mi mathvariant=\"normal\">g</mi></mrow><mrow><mn>8</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "z7sTi", "text": "<math><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">e</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the rod: <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>T</mtext><mi>&#8467;</mi><mo>-</mo><mtext>mg</mtext><mfenced><mfrac><mi>&#8467;</mi><mn>2</mn></mfrac></mfenced><mo>=</mo><mfrac><mrow><mtext>m</mtext><msup><mi>&#8467;</mi><mn>2</mn></msup></mrow><mn>3</mn></mfrac><mo>&#215;</mo><mfrac><mtext>a</mtext><mi>&#8467;</mi></mfrac></math> ...(i)<br /><br />For the: <math><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi><mo>-</mo><mi mathvariant=\"normal\">T</mi><mo>=</mo><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi></math> ...(ii)<br /><br />Solving (i) and (ii) we get: <math><mi mathvariant=\"normal\">a</mi><mo>=</mo><mfrac><mrow><mn>3</mn><mi mathvariant=\"normal\">g</mi></mrow><mrow><mn>8</mn></mrow></mfrac></math><br /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image7-e05807fa-0976-475c-b507-830d4fa53781.jpg\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863f1017dd1a9124e56", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "105", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A rope of negligible mass is wound around a hollow cylinder of mass 3 kg and radius 40 cm and then the entire arrangement is placed on a smooth horizontal surface. What is the angular acceleration (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>rad</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>) of the cylinder if the rope is pulled with a &nbsp;force of 30 N?", "image": null}, "options": [], "correctValue": "10", "solution": {"text": "Given, &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;M&nbsp;= 3 kg<br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; R = 40 cm = 0.40 m<br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; F = 30 N<br /><br />Moment of inertia of the hollow cylinder about its axis of symmetry<br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;I = MR<sup>2</sup><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;= 3 × (0.40)<sup>2</sup> = 0.48 kg-m<sup>2</sup><br /><br />Torque acting on the cylinder by the applied force,<br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; <math> <mrow> <mn>τ</mn> </mrow> </math> = F × R<br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;= 30 × 0.40 = 12 N-m.<br /><br />Angular acceleration produced in cylinder,<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>α</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>τ</mtext> </mrow> <mrow> <mtext>I</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>12</mtext> </mrow> <mrow> <mtext>0.48</mtext> </mrow> </mfrac> <mo>=</mo> <msup> <mtext>25 rad/s</mtext> <mn>2</mn> </msup> </mrow> </math><br /><br />Linear acceleration, a = R<math> <mrow> <mn>α</mn> </mrow> </math><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;= 0.40 × 25 = 10.0 m/s<sup>2</sup>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ea73e6f0aac2e283", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "31", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Four solid spheres each of diameter <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>5</mn></msqrt><mo>&nbsp;</mo><mi>cm</mi></math>&nbsp;and mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>0.5</mtext><mo>&nbsp;</mo><mi>kg</mi></math> are placed with their centres at the corners of a square of side <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&nbsp;</mo><mi>cm</mi></math>. The moment of inertia of the system about the diagonal of the square is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">N</mi><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup><mo>&nbsp;</mo><mi>kg</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math>, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">N</mi></math> is", "image": null}, "options": [], "correctValue": "9", "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>r</mtext><mo>=</mo><mfrac><mtext>d</mtext><mn>2</mn></mfrac><mo>=</mo><mfrac><msqrt><mn>5</mn></msqrt><mn>2</mn></mfrac><mtext>cm</mtext><mo>=</mo><mfrac><msqrt><mn>5</mn></msqrt><mn>2</mn></mfrac><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>&#160;</mo><mtext>m</mtext></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi><mo>=</mo><mtext>0.5</mtext><mo>&#160;</mo><mi>kg</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">a</mi><mo>=</mo><mn>4</mn><mo>&#160;</mo><mi>cm</mi><mo>=</mo><mn>4</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0007297_AnsExp1_1.jpg\" /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">I</mi><mi>XX</mi></msub><mo>=</mo><msub><mi mathvariant=\"normal\">I</mi><mn>1</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">I</mi><mn>2</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">I</mi><mn>3</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">I</mi><mn>4</mn></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac linethickness=\"1\"><mn>2</mn><mn>5</mn></mfrac><msup><mi>mr</mi><mn>2</mn></msup><mo>+</mo><mfenced><mrow><mi mathvariant=\"normal\">m</mi><msup><mfenced><mfrac linethickness=\"1\"><mi mathvariant=\"normal\">a</mi><msqrt><mn>2</mn></msqrt></mfrac></mfenced><mn>2</mn></msup><mo>+</mo><mfrac linethickness=\"1\"><mn>2</mn><mn>5</mn></mfrac><msup><mi>mr</mi><mn>2</mn></msup></mrow></mfenced><mo>+</mo><mfrac linethickness=\"1\"><mn>2</mn><mn>5</mn></mfrac><msup><mi>mr</mi><mn>2</mn></msup><mo>+</mo><mfenced><mrow><mi mathvariant=\"normal\">m</mi><msup><mfenced><mfrac linethickness=\"1\"><mi mathvariant=\"normal\">a</mi><msqrt><mn>2</mn></msqrt></mfrac></mfenced><mn>2</mn></msup><mo>+</mo><mfrac linethickness=\"1\"><mn>2</mn><mn>5</mn></mfrac><msup><mi>mr</mi><mn>2</mn></msup></mrow></mfenced></math><br /><br />Substituting the values, we get,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">I</mi><mi>XX</mi></msub><mo>=</mo><mn>9</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup><mo>&#160;</mo><mi>kg</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math><br /><br />Therefore, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">N</mi><mo>=</mo><mn>9</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e8416bea6e3ab501", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "68", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A ballet dancer is rotating about his own vertical axis on smooth horizontal floor with a time period 0.5 sec. The dancer folds himself close to his axis of rotation due to which his radius of gyration decreases by 20%, then his time period is", "image": null}, "options": [{"id": "5du7W", "text": "0.1 sec", "image": null, "isCorrect": false}, {"id": "w6nyN", "text": "0.25 sec", "image": null, "isCorrect": false}, {"id": "mc028", "text": "0.32 sec", "image": null, "isCorrect": true}, {"id": "r5HBM", "text": "0.4 sec", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">ω</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">ω</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br /><math><mi mathvariant=\"normal\">M</mi><msubsup><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">π</mi></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mi mathvariant=\"normal\">M</mi><msubsup><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">π</mi></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math><br><br><math> <mrow>  <mfrac>   <mrow>    <msub>     <mi>T</mi>     <mn>2</mn>    </msub>       </mrow>   <mrow>    <msub>     <mi>T</mi>     <mn>1</mn>    </msub>       </mrow>  </mfrac>  <mo>=</mo><msup>   <mrow>    <mrow><mo>(</mo>     <mrow>      <mfrac>       <mrow>        <msub>         <mi>K</mi>         <mn>2</mn>        </msub>               </mrow>       <mrow>        <msub>         <mi>K</mi>         <mn>1</mn>        </msub>               </mrow>      </mfrac>           </mrow>    <mo>)</mo></mrow>   </mrow>   <mn>2</mn>  </msup>   </mrow></math><br><br>T<sub>2</sub> = 0.64 × 0.5 <br><br>= 0.32 sec", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e79dac9ae976895e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "80", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform disc of mass <math><mi>M</mi></math> and radius <math><mi>R</mi><mi>&nbsp;</mi></math>is mounted on a fixed horizontal axis. A block of mass <math><mi>m</mi></math> hangs from a massless string that is wrapped around the rim of the disc. The magnitude of the acceleration of the falling block (<math><mi>m</mi></math>) is", "image": null}, "options": [{"id": "DrgbO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mi>M</mi></mrow><mrow><mi>M</mi><mo>+</mo><mn>2</mn><mi>m</mi></mrow></mfrac><mi>&#160;</mi><mi>g</mi></math>", "image": null, "isCorrect": false}, {"id": "bmVjE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mi>m</mi></mrow><mrow><mi>M</mi><mo>+</mo><mn>2</mn><mi>m</mi></mrow></mfrac><mi>&#160;</mi><mi>g</mi></math>", "image": null, "isCorrect": true}, {"id": "2SEgX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>M</mi><mo>+</mo><mn>2</mn><mi>m</mi></mrow><mrow><mn>2</mn><mi>&#160;</mi><mi>M</mi><mi>&#160;</mi></mrow></mfrac><mi>&#160;</mi><mi>g</mi></math>", "image": null, "isCorrect": false}, {"id": "wKgbV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mi>M</mi><mo>+</mo><mi>m</mi></mrow><mrow><mn>2</mn><mi>M</mi><mi>&#160;</mi></mrow></mfrac><mi>&#160;</mi><mi>g</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When pulley has a finite mass <math><mi>M</mi></math> and radius <math><mi>R</mi></math>, then tension in two segments of the string are different.<br /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image25-8e2c543b-b2b7-4dbb-a4bb-ec438590c74b.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 138px; height: 190px;\" /><br /><br />Here, <math><mi>m</mi><mi>a</mi><mo>=</mo><mi>m</mi><mi mathvariant=\"normal\">g</mi><mo>-</mo><mi>T</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mfrac><mi>m</mi><mrow><mi>m</mi><mo>+</mo><mfrac><mi>M</mi><mn>2</mn></mfrac></mrow></mfrac><mi>g</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>m</mi></mrow><mrow><mn>2</mn><mi>m</mi><mo>+</mo><mi>M</mi></mrow></mfrac><mi>g</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e2d0f0c1277ae796", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "29", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A block of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math> is attached to one end of a light string which is wrapped on a disc of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">m</mi></math> and radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math>. The total length of the slack portion of the string is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">l</mi></math>. The block is released from rest. The angular velocity of the disc just after the string becomes taut is<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/oubpotpkvjoekwvsvzbyeyfufxjhhxwuebshhfwyvljhwtnehw.jpeg\" />", "image": null}, "options": [{"id": "B0W4T", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mi>gl</mi><msup><mi mathvariant=\"normal\">R</mi><mn>2</mn></msup></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "q5mcQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mi>gl</mi><msup><mi mathvariant=\"normal\">2R</mi><mn>2</mn></msup></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "mPL20", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mi>2gl</mi><msup><mi mathvariant=\"normal\">3R</mi><mn>2</mn></msup></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "T8nMd", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mi>3gl</mi><msup><mi mathvariant=\"normal\">2R</mi><mn>2</mn></msup></mfrac></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Using the principle of conservation of angular momentum,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi><msqrt><mn>2</mn><mi>gl</mi></msqrt><mo>&#215;</mo><mi mathvariant=\"normal\">R</mi><mo>=</mo><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mfenced separators=\"|\"><mrow><mn>2</mn><mi mathvariant=\"normal\">m</mi></mrow></mfenced><mi mathvariant=\"normal\">&#160;</mi><msup><mi mathvariant=\"normal\">R</mi><mn>2</mn></msup></mrow><mn>2</mn></mfrac><mo>+</mo><msup><mi>mR</mi><mn>2</mn></msup></mrow></mfenced><mo>&#215;</mo><mi mathvariant=\"normal\">&#969;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">&#969;</mi><mo>=</mo><msqrt><mfrac><mi>gl</mi><mrow><mn>2</mn><msup><mi mathvariant=\"normal\">R</mi><mn>2</mn></msup></mrow></mfrac></msqrt></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d7901ba2eaccd7fa", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "20", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Four holes of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> are cut from a thin square plate of side <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi mathvariant=\"normal\">R</mi></math> and mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi></math>. The moment of inertia of the remaining portion about <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">z</mi></math>-axis is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image12-1928b2f7-2960-4fed-bc2a-7913345ac551.png\" />", "image": null}, "options": [{"id": "ozocx", "text": "<math><mfrac><mrow><mi mathvariant=\"normal\">π</mi></mrow><mrow><mn>12</mn></mrow></mfrac><mi mathvariant=\"normal\">M</mi><msup><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "liNBP", "text": "<math><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">π</mi></mrow><mrow><mn>4</mn></mrow></mfrac></mrow></mfenced><mi mathvariant=\"normal\">M</mi><msup><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "mu2mV", "text": "<math><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>8</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>10</mn><mi mathvariant=\"normal\">π</mi></mrow><mrow><mn>16</mn></mrow></mfrac></mrow></mfenced><mi mathvariant=\"normal\">M</mi><msup><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "AMTsq", "text": "<math><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">π</mi></m ow>  </mfrac></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math> be the mass of the sphere.<br /><br />Since, it is a case of backward slipping, force of friction is in forward direction. Limiting friction will act in this case.<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0023431_AnsExp_1.jpg\" style=\"width: 436px; height: 162px;\" /><br /><br /><math> <mrow> <mtext>Linear acceleration</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>a</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>f</mtext> </mrow> <mrow> <mtext>m</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>μ</mtext> <mo>mg</mo> </mrow> <mrow> <mtext>m</mtext> </mrow> </mfrac> <mo>=</mo> <mtext>μ</mtext> <mtext>g</mtext> </mrow> </math><br /><br /><math> <mrow> <mtext>Angular retardation</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>α</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>τ</mtext> </mrow> <mrow> <mtext>I</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>f</mtext> <mo>·</mo> <mtext>r</mtext> </mrow> <mrow> <mfrac> <mrow> <mn>2</mn> </mrow> <mrow> <mn>5</mn> </mrow> </mfrac> <msup> <mtext>mr</mtext> <mn>2</mn> </msup> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mfrac> <mrow> <mtext>μ</mtext> <mtext>g</mtext> </mrow> <mrow> <mtext>r</mtext> </mrow> </mfrac> </mrow> </math><br /><br />Slipping will be stopped when&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">v</mi><mo>=</mo><mi>rω</mi></math><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>at</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">r</mi><mo>(</mo><msub><mi mathvariant=\"normal\">ω</mi><mn>0</mn></msub><mo>&nbsp;</mo><mo>-</mo><mo>&nbsp;</mo><mi>αt</mi><mo>)</mo></math><br /><br /><math><mrow>&nbsp;<mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mtext>μ</mtext> <mtext>gt</mtext> <mo>=</mo> <mtext>r</mtext> <mo>(</mo> <msub> <mtext>ω</mtext> <mn>0</mn> </msub> <mo>-</mo> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mfrac> <mrow> <mtext>μ</mtext> <mtext>g</mtext> <mtext>t</mtext> </mrow> <mrow> <mtext>r</mtext> </mrow> </mfrac> <mo>)</mo> </mrow> </math><br /><br /><math><mrow>&nbsp;<mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mfrac><mrow><mn>7</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>μ</mtext> <mtext>gt</mtext> <mo>=</mo> <mtext>r</mtext> <msub> <mtext>ω</mtext> <mn>0</mn> </msub> </mrow> </math><br /><br /><math> <mrow> <mo>∴</mo> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>t</mtext> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> </mrow> <mrow> <mn>7</mn> </mrow> </mfrac> <mfrac> <mrow> <mtext>r</mtext> <msub> <mtext>ω</mtext> <mn>0</mn> </msub> </mrow> <mrow> <mtext>μ</mtext> <mtext>g</mtext> </mrow> </mfrac> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ca428073e20654a4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "74", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform ring is rotating about the vertical axis with angular velocity&nbsp;<math><mrow><mi>ω&nbsp;</mi></mrow></math>initially. A point insect (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi></math>) having the same mass as that of the ring starts walking from the lowest point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">P</mi><mn>1</mn></msub></math>&nbsp;and finally reaches the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">P</mi><mn>2</mn></msub></math>&nbsp;(as shown in the figure). The final angular velocity of the ring is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0028180_Question.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 123px; height: 152px;\" />", "image": null}, "options": [{"id": "wgyQe", "text": "<math><mrow>  <mi>&omega;</mi>  <mo>/</mo>  <mn>4</mn></mrow></math>", "image": null, "isCorrect": false}, {"id": "y8C1n", "text": "<math><mrow>  <mi>&omega;</mi></mrow></math>", "image": null, "isCorrect": false}, {"id": "lAwQ6", "text": "<math><mrow>  <mi>&omega;</mi>  <mo>/</mo>  <mn>2</mn></mrow></math>", "image": null, "isCorrect": false}, {"id": "OycGw", "text": "<math> <mrow> <mi>ω</mi> <mo>/</mo> <mn>3</mn> </mrow> </math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "From the conservation of angular momentum<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup></mrow></mfenced><mi>&#969;</mi><mo>=</mo><mfenced><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mtext mathvariant=\"italic\">MR</mtext><mn>2</mn></msup><mo>+</mo><msup><mtext mathvariant=\"italic\">MR</mtext><mn>2</mn></msup></mrow></mfenced><mi>&#969;</mi><mo>&#180;</mo><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mfenced><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mtext mathvariant=\"italic\">MR</mtext><mn>2</mn></msup></mrow></mfenced><mi>&#969;</mi><mo>=</mo><mfenced><mrow><mfrac><mn>3</mn><mn>2</mn></mfrac><msup><mtext mathvariant=\"italic\">MR</mtext><mn>2</mn></msup></mrow></mfenced><mi>&#969;</mi><mo>&#180;</mo><mo>&#8658;</mo><mi>&#969;</mi><mo>&#180;</mo><mo>=</mo><mfrac><mi>&#969;</mi><mn>3</mn></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c4f7d1e5bb48f941", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "95", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two man of mass <math><mn>50</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi></math> and <math><mn>60</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi></math> on diametrically opposite point of a turntable of mass <math><mn>90</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi></math> . The turntable is free to rotate about vertical axis. The two men start moving towards each other along the circumference of table. The angle rotated by table when the two men meet each other -", "image": null}, "options": [{"id": "FW2Q0", "text": "<math><mn>8.2</mn><mo>°</mo></math>", "image": null, "isCorrect": false}, {"id": "0MYX8", "text": "<math><mn>4.5</mn><mo>°</mo></math>", "image": null, "isCorrect": true}, {"id": "p6JDG", "text": "<math><mn>2.8</mn><mo>°</mo></math>", "image": null, "isCorrect": false}, {"id": "N9scn", "text": "<math><mn>6.8</mn><mo>°</mo></math>", "imag t>&#x2009;</mtext><mtext>sin</mtext><mtext>&#x2009;</mtext><mi>&#x03B8;</mi></mrow></math>", "image": null, "isCorrect": false}, {"id": "XIGkT", "text": "<math> <mrow> <msqrt> <mrow> <mfrac> <mrow> <mn>6</mn><mi>g</mi></mrow> <mi>L</mi> </mfrac> </mrow> </msqrt> <mi>sin</mi><mfrac> <mtext>θ</mtext> <mn>2</mn> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "dr8XV", "text": "<math> <mrow>  <msqrt>   <mrow>    <mfrac>     <mrow>      <mn>6</mn><mi>g</mi></mrow>     <mi>L</mi>    </mfrac>    </mrow>  </msqrt>  <mi>cos</mi><mfrac>   <mi>&#x03B8;</mi>   <mn>2</mn>  </mfrac>  </mrow></math>", "image": null, "isCorrect": false}, {"id": "8Wlvl", "text": "<math> <mrow>  <msqrt>   <mrow>    <mfrac>     <mrow>      <mn>6</mn><mi>g</mi></mrow>     <mi>L</mi>    </mfrac>    <mtext>&#x2009;</mtext></mrow>  </msqrt>  <mtext>cos</mtext><mtext>&#x2009;</mtext><mi>&#x03B8;</mi></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>When the rod rotates through angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi></math>, the fall <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math> of centre of gravity is given by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mstyle displaystyle=\"true\"><mfrac><mi>L</mi><mn>2</mn></mfrac><mo>-</mo><mi>h</mi></mstyle><mstyle displaystyle=\"true\"><mfrac><mi>L</mi><mn>2</mn></mfrac></mstyle></mfrac><mo>=</mo><mi>cos</mi><mfenced><mi>&#952;</mi></mfenced></math></p><p>&nbsp;</p><p>or<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo mathvariant=\"italic\">&#160;&#160;</mo><mi>h</mi><mo mathvariant=\"italic\">=</mo><mfrac><mi mathvariant=\"italic\">L</mi><mn mathvariant=\"italic\">2</mn></mfrac><mo mathvariant=\"italic\">(</mo><mn mathvariant=\"italic\">1</mn><mo mathvariant=\"italic\">-</mo><mi>c</mi><mi>o</mi><mi>s</mi><mi>&#952;</mi><mo mathvariant=\"italic\">)</mo></math></p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/abs/61eb23d4-c2ea-45ee-acb1-3fe68777d4a0-4.jpg\" style=\"width: 175px; height: 173px;\" /></p><p>Decrease in potential energy</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo mathvariant=\"italic\">=</mo><mi>M</mi><mi>g</mi><mi>h</mi><mo mathvariant=\"italic\">=</mo><mi>M</mi><mi>g</mi><mfrac><mi mathvariant=\"italic\">L</mi><mn mathvariant=\"italic\">2</mn></mfrac><mo mathvariant=\"italic\">(</mo><mn mathvariant=\"italic\">1</mn><mo mathvariant=\"italic\">-</mo><mi>c</mi><mi>o</mi><mi>s</mi><mi>&#952;</mi><mo mathvariant=\"italic\">)</mo></math></p><p>Now, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi><mi>E</mi></math> of rotation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo mathvariant=\"italic\">=</mo><mfrac><mn mathvariant=\"italic\">1</mn><mn mathvariant=\"italic\">2</mn></mfrac><mi>I</mi><msup><mi>&#969;</mi><mn mathvariant=\"italic\">2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mfrac><msup><mi>ML</mi><mn>2</mn></msup><mn>3</mn></mfrac><msup><mi>&#969;</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mfrac><msup><mi>ML</mi><mn>2</mn></msup><mn>3</mn></mfrac><msup><mi>&#969;</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"\" open=\"[\"><mrow><mi mathvariant=\"normal\">I</mi><mo>=</mo><msup><mi>ML</mi><mn>2</mn></msup><mo>/</mo><mn>3</mn></mrow></mfenced></math>&nbsp;(because rod is rotating about an axis&nbsp;passing through its one end)&nbsp;</p><p>According to law of conservation of energy, decrease in potential energy will be equal to gain in kinetic energy.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><mi>g</mi><mfrac><mi mathvariant=\"italic\">L</m ormal\">&nbsp;</mi><mfrac><mrow><mn>2</mn><mi>v</mi></mrow><mrow><mi>L</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn><msub><mrow><mi>M</mi></mrow><mrow><mn>2</mn></mrow></msub><mi>v</mi></mrow><mrow><mn>2</mn><msub><mrow><mi>M</mi></mrow><mrow><mn>1</mn></mrow></msub><mi>L</mi></mrow></mfrac></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mfrac><mrow><msub><mrow><mi>M</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>M</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math><br /><br /><math> <mo>=</mo><mn>0.75</mn> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b6fc1e1f16591adc", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "104", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "From a solid sphere of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> and radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>, a cube of the maximum possible volume is cut. Moment of inertia of cube about an axis passing through its centre and perpendicular to one of its faces is:", "image": null}, "options": [{"id": "69G0l", "text": "<math><mfrac><mrow><mn>4</mn><mi>M</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>3</mn><msqrt><mn>3</mn></msqrt><mi>π</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "9V9IL", "text": "<math><mfrac><mrow><mi>M</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>32</mn><msqrt><mn>2</mn></msqrt><mi>π</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "tdCR1", "text": "<math><mfrac><mrow><mi>M</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>16</mn><msqrt><mn>2</mn></msqrt><mi>π</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "1gZsm", "text": "<math><mfrac><mrow><mn>4</mn><mi>M</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>9</mn><msqrt><mn>3</mn></msqrt><mi>π</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let a be length of edge for cube<br />with maximum possible volume diagonal length = 2R<br /><br /><math><mo>⇒</mo><msqrt><mn>3</mn></msqrt><mi>a</mi><mo>=</mo><mn>2</mn><mi>R</mi><mo>⇒</mo><mi>a</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>R</mi></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math><br /><br />As densities of sphere and cube are equal. Let M' be mass of cube<br /><br /><math> <mrow> <mfrac> <mrow> <mtext>M</mtext> </mrow> <mrow> <mfrac> <mrow> <mn>4</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> <mi>π</mi> <msup> <mtext>R</mtext> <mn>3</mn> </msup> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <msup> <mtext>M</mtext> <mo>′</mo> </msup> </mrow> <mrow> <msup> <mtext>a</mtext> <mn>3</mn> </msup> </mrow> </mfrac> </mrow> </math><br /><br /><math><msup><mrow><mi>M</mi></mrow><mrow><mi>′</mi></mrow></msup><mo>=</mo><mfrac><mrow><mn>3</mn><mi>M</mi><msup><mrow><mi>a</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow><mrow><mn>4</mn><mi>π</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow></mfrac></math><br /><br />Moment of inertia of cube about an axis passing through its centre is&nbsp;<br /><br /><math><mo>I=</mo><mfrac><mrow><msup><mrow><mi>M</mi></mrow><mrow><mi>′</mi></mrow></msup><mfenced separators=\"|\"><mrow><mn>2</mn><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced></mrow><mrow><mn>12&nbsp;</mn></mrow></mfrac></math><math><mo>=</mo><mfrac><mrow><mn>3</mn><mi>M</mi><msup><mrow> t=\"normal\">&#160;</mi><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When there is no external torque then the angular momentum remains constant.<br /><br />i.e. <math><mi>&#964;</mi><mo>=</mo><mn>0</mn><mo>&#8658;</mo><mfrac><mrow><mi>d</mi><mi>L</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mn>0</mn></math><br /><br /><math><mo>&#8756;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><msub><mrow><mi>I</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>&#969;</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi>I</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>&#969;</mi></mrow><mrow><mn>2</mn></mrow></msub></math> ... (i)<br /><br />Here <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><mo>=</mo><mn>2</mn><mi>&#160;</mi><mi>kg</mi><mo>,</mo><mi>&#160;</mi><mi>m</mi><mo>=</mo><mn>0.25</mn><mi mathvariant=\"normal\">&#160;</mi><mi>kg</mi><mo>,</mo><mi>&#160;</mi><mi>r</mi><mo>=</mo><mn>0.2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>,</mo></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#969;</mi><mn>1</mn></msub><mo>=</mo><mn>30</mn><mi mathvariant=\"normal\">&#160;</mi><mi>rad</mi><mi mathvariant=\"normal\">&#160;</mi><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br />Hence, putting the value of <math><msub><mrow><mi>&#969;</mi></mrow><mrow><mn>1</mn></mrow></msub></math> in equation (i), we get<br /><br /><math><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>&#215;</mo><mn>2</mn><mo>&#215;</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>0.2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>&#215;</mo><mn>30</mn><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>&#215;</mo><mfenc dn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-07-27_at_3.14.48_PM.jpeg\" style=\"width: 180px; height: 194px;\" />", "image": null}, "options": [{"id": "OGwZM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mn>12</mn><mn>5</mn></mfrac><mi>g</mi><mi>l</mi></msqrt></math>", "image": null, "isCorrect": true}, {"id": "7fr6C", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn><mi>g</mi><mi>l</mi></msqrt></math>", "image": null, "isCorrect": false}, {"id": "82Tkb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mn>16</mn><mn>5</mn></mfrac><mi>g</mi><mi>l</mi></msqrt></math>", "image": null, "isCorrect": false}, {"id": "Jf2lf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>2</mn><mi>g</mi><mi>l</mi></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Loss in kinetic energy = gain in potential energy<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>I</mi><msup><mi>&#969;</mi><mn>2</mn></msup><mo>=</mo><mi>m</mi><mi>g</mi><mfrac><mi>l</mi><mn>2</mn></mfrac><mo>+</mo><mi>m</mi><mi>g</mi><mi>l</mi></math> ...(i)<br /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image20-883b7238-1ce3-4b73-8dea-99b2113c5906.png\" /><br /><br />Here, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mfrac><mrow><mi>m</mi><msup><mi>l</mi><mn>2</mn></msup></mrow><mn>4</mn></mfrac><mo>+</mo><mi>m</mi><msup><mi>l</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>5</mn><mn>4</mn></mfrac><mi>m</mi><msup><mi>l</mi><mn>2</mn></msup></math><br /><br />From (i),<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced separators=\"|\"><mrow><mfrac><mn>5</mn><mn>4</mn></mfrac><mi>m</mi><msup><mi>l</mi><mn>2</mn></msup></mrow></mfenced><msup><mi>&#969;</mi><mn>2</mn></msup><mo>=</mo><mfrac><mrow><mi>m</mi><mi>g</mi><mi>l</mi></mrow><mn>2</mn></mfrac><mo>+</mo><mi>m</mi><mi>g</mi><mi>l</mi><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>m</mi><mi>g</mi><mi>l</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><msup><mi>l</mi><mn>2</mn></msup><msup><mi>&#969;</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>12</mn><mn>5</mn></mfrac><mi>m</mi><mi>g</mi><mi>l</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><msub><mi>v</mi><mi mathvariant=\"normal\">c</mi></msub><mo>=</mo><msqrt><mfenced separators=\"|\"><mfrac><mrow><mn>12</mn><mi>g</mi><mi>l</mi></mrow><mn>5</mn></mfrac></mfenced></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637eb43b691cadb768", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "76", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The moment of inertia of a circular ring of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi>kg</mi></math> about an axis passing through its centre and perpendicular to its plane is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&nbsp;</mo><mi>kg</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math>. The diameter of the ring is", "image": null}, "options": [{"id": "Vh1FN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 79px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "HhgIK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 79px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "o2MTt", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 79px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "4A26s", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 79px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Moment of inertia of circular ring about an axis passing through its centre of mass and perpendicular to its plane<br /><br /><math><mi>I</mi><mo>=</mo><mi>M</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br />Here, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mn>4</mn><mi>&#160;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup><mo>,</mo><mi>&#160;</mi><mi>m</mi><mo>=</mo><mn>1</mn><mi>&#160;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi></math><br /><br /><math><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>1</mn></mrow></mfrac><mo>=</mo><mn>4</mn></math><br /><br />or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math><br /><br />Therefore, diameter of ring = 4 m.", "image": n I (about AD)</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>m</mtext> <msup> <mi>ℓ</mi> <mn>2</mn> </msup> </mrow> <mrow> <mn>1</mn> <mn>2</mn> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <mtext>m</mtext> <msup> <mi>ℓ</mi> <mn>2</mn> </msup> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>m</mtext> <msup> <mi>ℓ</mi> <mn>2</mn> </msup> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/QuestionR4.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 140px; height: 231px;\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863798a050c63fa2583", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "94", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "From a circular disc of radius <math><mi>R</mi></math> and mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mi>M</mi></math>, a small disc of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac bevelled=\"true\"><mi>R</mi><mn>3</mn></mfrac></math>&nbsp;is removed from the disc. The moment of inertia of the remaining disc about an axis perpendicular to the plane of the disc and passing through <math><mi>O</mi></math> is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-08-20_at_2.42.09_PM.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 250px; height: 209px;\" />", "image": null}, "options": [{"id": "9Kn74", "text": " math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> and diameter <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi></math> are stuck together such that the lines connecting the centres form an equilateral triangle of side length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi></math>. Find the&nbsp;ratio <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>I</mi><mn>0</mn></msub><mo>/</mo><msub><mi>I</mi><mi>A</mi></msub></math>, where<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><msub><mi>I</mi><mn>0</mn></msub></math>&nbsp;is the moment of inertia of the system about an axis passing through the centroid and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>I</mi><mi>A</mi></msub></math>&nbsp;is the moment of inertia of the system about an axis passing through the centre of any sphere&nbsp;and perpendicular to the plane of the triangle.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0629730.jpg\" style=\"width: 230px; height: 211px;\" /></p>\r", "image": null}, "options": [{"id": "Fu6PC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>23</mn><mn>13</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "EWR5s", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>13</mn><mn>15</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "rzstj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>13</mn><mn>23</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "9kfHH", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>15</mn><mn>13</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The moment of inertia of the system about the point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">O</mi></math>&nbsp;is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>I</mi><mn>0</mn></msub><mo>=</mo><mn>3</mn><mfenced open=\"[\" close=\"]\"><mrow><mfrac><mn>2</mn><mn>5</mn></mfrac><mi>M</mi><msup><mfenced><mfrac><mi>d</mi><mn>2</mn></mfrac></mfenced><mn>2</mn></msup><mo>+</mo><mi>M</mi><msup><mfenced><mfrac><mi>d</mi><msqrt><mn>3</mn></msqrt></mfrac></mfenced><mn>2</mn></msup></mrow></mfenced><mo>=</mo><mfrac><mn>13</mn><mn>10</mn></mfrac><mi>M</mi><msup><mi>d</mi><mn>2</mn></msup></math></p><p>The moment of inertia of the system about the point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>I</mi><mi mathvariant=\"normal\">A</mi></msub><mo>=</mo><mn>2</mn><mfenced open=\"[\" close=\"]\"><mrow><mfrac><mn>2</mn><mn>5</mn></mfrac><mi>M</mi><msup><mfenced><mfrac><mi>d</mi><mn>2</mn></mfrac></mfenced><mn>2</mn></msup><mo>+</mo><mi>M</mi><mo>(</mo><mi>d</mi><msup><mo>)</mo><mn>2</mn></msup></mrow></mfenced><mo>+</mo><mfrac><mn>2</mn><mn>5</mn></mfrac><mi>M</mi><msup><mfenced><mfrac><mi>d</mi><mn>2</mn></mfrac></mfenced><mn>2</mn></msup><mo>=</mo><mfrac><mn>23</mn><mn>10</mn></mfrac><mi>M</mi><msup><mi>d</mi><mn>2</mn></msup></math></p><p>So, the ratio&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>13</mn><mn>23</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635b9a71427cefe6fa", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "44", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform rod&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math> of length&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi></math> and mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> is free to rotate about point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>. The rod is released from rest in the horizontal position. The initial angular acceleration of the rod will be<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-07-01_at_11.55.38_AM.jpeg\" style=\"width: 200px; height: 132px;\" />", "image": null}, "options": [{"id": "BoPy9", "text": "<math> <mrow> <mfrac> <mrow> <mn>2</mn> <mtext>g</mtext> </mrow> <mrow> <mn>3</mn> <mi>l</mi> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "dg8jg", "text": "<math> <mrow> <mtext>g</mtext> <mfrac> <mrow> <mi>l</mi> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "IT2pw", "text": "<math><mrow>  <mfrac>    <mrow>      <mn>3</mn>    </mrow>    <mrow>      <mn>2</mn>    </mrow>  </mfrac>  <mtext>g</mtext><mi>l</mi></mrow></math>", "image": null, "isCorrect": false}, {"id": "KfdN3", "text": "<math> <mrow> <mfrac> <mrow> <mn>3</mn> <mtext>g</mtext> </mrow> <mrow> <mn>2</mn> <mi>l</mi> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The moment of inertia of the uniform rod about an axis through one end and perpendicular to its length is<br /><br /><math> <mrow> <mtext>I</mtext> <mo>=</mo> <mfrac> <mrow> <msup> <mtext>ml</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> </mrow> </math><br /><br />Where m is mass of rod and l is length.<br /><br />Torque <math> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi>τ</mi> <mo>=</mo> <mtext>I</mtext> <mi>α</mi> </mrow> </mfenced> </mrow> </math>&nbsp;acting on centre of gravity of rod is given by<br /><br /><math> <mrow> <mi>τ</mi> <mo>=</mo> <mtext>mg</mtext> <mfrac> <mrow> <mn>l</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math><br /><br />or&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext>I</mtext> <mi>α</mi> <mo>=</mo> <mtext>mg</mtext> <mfrac> <mrow> <mn>l</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math><br /><br />or&nbsp;&nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <msup> <mtext>ml</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> <mi>α</mi> <mo>=</mo> <mtext>mg</mtext> <mfrac> <mrow> <mn>l</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math><br /><br />or&nbsp;&nbsp;&nbsp;<math> <mrow> <mi>α</mi> <mo>=</mo> <mfrac> <mrow> <mn>3</mn> <mtext>g</mtext> </mrow> <mrow> <mn>2</mn> <mtext>l</mtext> </mrow> </mfrac> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86356b8f148f9386926", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "34", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A thin circular metal disc of the radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>500</mn><mo>&nbsp;</mo><mi>mm</mi></math> is set rotating about a central axis normal to its plane. Upon raising in temperature gradually, the radius increases to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>507</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi>mm</mi></math>. The percentage change in the rotational kinetic energy will be", "image": null}, "options": [{"id": "U6cSc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>5</mn><mo>%</mo></math>", "image": null, "isCorrect": false}, {"id": "bWUoD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>-1</mn><mo>.</mo><mn>5</mn><mo>%</mo></math>", "image": null, "isCorrect": false}, {"id": "HnIHS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>%</mo></math>", "image": null, "isCorrect": false}, {"id": "UPgNm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>-3</mn><mo>%</mo></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given&nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mtext>dR</mtext><mtext>R</mtext></mfrac><mo>&#215;</mo><mn>100</mn><mo>=</mo><mfrac><mfenced><mrow><mtext>507.5</mtext><mo>-</mo><mtext>500.0</mtext></mrow></mfenced><mtext>500.0</mtext></mfrac><mo>&#215;</mo><mn>100</mn><mo>=</mo><mtext>1.5%</mtext></math><br /><br />Now,&nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>K</mtext><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mtext>I</mtext><msup><mi mathvariant=\"normal\">&#969;</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mtext>I</mtext></mrow></mfrac><msup><mfenced><mrow><mtext>I</mtext><mi mathvariant=\"normal\">&#969;</mi></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mfrac><msup><mtext>L</mtext><mn>2</mn></msup><mrow><mn>2</mn><mtext>I</mtext></mrow></mfrac></math><br /><br />or,&nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>K</mtext><mo>=</mo><mfrac><msup><mtext>L</mtext><mn>2</mn></msup><mrow><mn>2</mn><mfenced><mstyle displaystyle=\"true\"><mfrac><msup><mtext>MR</mtext><mn>2</mn></msup><mn>2</mn></mfrac></mstyle></mfenced></mrow></mfrac><mo>=</mo><mfrac><msup><mtext>L</mtext><mn>2</mn></msup><mrow><mtext>M</mtext><mfenced><msup><mtext>R</mtext><mn>2</mn></msup></mfenced></mrow></mfrac></math><br /><br />Taking log and differentiating, <math> <mrow> <mfrac> <mrow> <mtext>dK</mtext> </mrow> <mrow> <mtext>K</mtext> </mrow> </mfrac> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <mn>2</mn> <mtext>dR</mtext> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </math><br /><br />or, the percentage change in <math> <mrow> <mtext>K</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>dK</mtext> <mo>&#215;</mo> <mn>1</mn> <mn>0</mn> <mn>0</mn> </mrow> <mrow> <mtext>K</mtext> </mrow> </mfrac> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <mn>2</mn> <mtext>dR</mtext> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> <mo>&#215;</mo> <mn>1</mn> <mn>0</mn> <mn>0</mn> <mo>=</mo> <mo>-</mo> <mn>3</mn> <mtext>%</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86352024b67975a122e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "89", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A constant power is supplied to a disc that can rotate freely about a fixed vertical axis. Angular velocity <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">ω</mi></mrow></mfenced></math> of the disc varies with the number of rotations (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">n</mi></math>) made by the disc after starting from rest as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">ω</mi><mo>=</mo><mi mathvariant=\"normal\">k</mi><msup><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">x</mi></msup></math>. Hence&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi></math> is: (K is a constant)", "image": null}, "options": [{"id": "MUqVM", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "iA24M", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mr
