/mrow> </mfrac> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msup> <mtext>MR</mtext> <mn>2</mn> </msup> </mrow> </mfenced> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mfrac> <mrow> <msup> <mtext>v</mtext> <mn>2</mn> </msup> </mrow> <mrow> <msup> <mtext>R</mtext> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>so</mtext><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><msup><mtext>v</mtext><mn>2</mn></msup><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><mi>g</mi><mtext>h</mtext></math><br /><br />Now differentiating both sides with respect to time<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mtext>2v</mtext><mfrac><mtext>dv</mtext><mtext>dt</mtext></mfrac><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><mi>g</mi><mfrac><mtext>dh</mtext><mtext>dt</mtext></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>or</mtext><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mi>a</mi><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><mi>g</mi><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mfenced open=\"[\" close=\"]\"><mrow><mtext>as</mtext><mfrac><mtext>dv</mtext><mtext>dt</mtext></mfrac><mo>=</mo><mi>a</mi><mspace width=\"0.5em\"/><mtext>and</mtext><mspace width=\"0.5em\"/><mfrac><mtext>dh</mtext><mtext>dt</mtext></mfrac><mo>=</mo><mtext>v</mtext></mrow></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636d517b2cd1c44466", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "63", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform circular disc of radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math> placed on a rough horizontal plane has initial velocity&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>0</mn></msub></math> and angular velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>ω</mi><mn>0</mn></msub></math>&nbsp;as shown. The disc comes to rest after moving some distance in the direction of motion. Then<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029915_Question.jpg\" style=\"width: 216px; height: 118px;\" />", "image": null}, "options": [{"id": "lI1pd", "text": "The friction force acts in the forward direction", "image": null, "isCorrect": false}, {"id": "KOz0g", "text": "The point of contact of disc with ground has zero velocity", "image": null, "isCorrect": false}, {"id": "hjia9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>0</mn></msub></math>&nbsp;must be equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>r</mi><msub><mi>ω</mi><mn>0</mn></msub></mrow><mn>2</mn></mfrac></math>&nbsp;in magnitude", "image": null, "isCorrect": true}, {"id": "pzeqF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>0</mn></msub></math>&nbsp;must be equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>r</mi><msub><mi>&#969;</mi><mn>0</mn></msub></math>&nbsp;in magnitude", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Conserving the angular momentum of the disc about its bottom-most point, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><msup><mi>R</mi><mn>2</mn></msup><msub><mi>&#969;</mi><mn>0</mn></msub><mo>-</mo><mi>m</mi><msub><mi>v</mi><mn>0</mn></msub><mi>R</mi><mo>=</mo><mn>0</mn></math>&nbsp;(Since the disc finally comes to rest, it means its total angular momentum is zero)</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>0</mn></msub><mo>=</mo><mfrac><mrow><mi>r</mi><msub><mi>&#969;</mi><mn>0</mn></msub></mrow><mn>2</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636167a91fc9d1987a", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "04", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the given arrangement, the rod is free to rotate about the hinge and it is in constant contact with the equilateral triangular block of base length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mi>a</mi></mrow><msqrt><mn>3</mn></msqrt></mfrac></math>. If the block is moving horizontally with a speed&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mn>20</mn><mo>&nbsp;</mo><msup><mi>ms</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>, then&nbsp;find the magnitude of the angular velocity of the rod (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>rad</mi><mo>.</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>) at the instant when <math><mi>θ</mi><mo>=</mo><msup><mrow><mn>30</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mo>.</mo></math> [Given that <math> <mi>a</mi><mo>=</mo><mn>1</mn><mtext> </mtext><mtext> </mtext><mtext>m</mtext></math>]<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/phys231567432.jpeg\" style=\"width: 321px; height: 273px;\" />", "image": null}, "options": [], "correctValue": "5", "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/e7accd4f-2349-472c-b1aa-697322b5d787.jpeg\" style=\"width: 180px; height: 135px;\" /><br /><br /><math> <mrow> <mfrac> <mi>h</mi> <mi>x</mi> </mfrac> <mo>=</mo><mi>tan</mi><mi>θ</mi></mrow> </math><br /><br /><math> <mrow> <mi>x</mi><mo>=</mo><mi>h</mi><mi>cot</mi><mi>θ</mi></mrow> </math><br /><br /><math> <mrow> <mfrac> <mrow> <mi>d</mi><mi>x</mi></mrow> <mrow> <mi>d</mi><mi>t</mi></mrow> </mfrac> <mo>=</mo><mo>−</mo><mi>h</mi><mtext> </mtext><msup> <mrow> <mtext>cosec</mtext></mrow> <mn>2</mn> </msup> <mi>θ</mi><mfrac> <mrow> <mi>d</mi><mi>θ</mi></mrow> <mrow> <mi>d</mi><mi>t</mi></mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mfenced close=\"|\" open=\"|\"> <mi>ω</mi> </mfenced><mo>=</mo><mfrac> <mi>v</mi> <mi>h</mi> </mfrac> <msup> <mrow> <mi>sin</mi></mrow> <mn>2</mn> </msup> <mi>θ</mi><mo>=</mo><mfrac> <mrow> <mn>20</mn></mrow> <mn>1</mn> </mfrac> <mo>×</mo><mfrac> <mn>1</mn> <mn>4</mn> </mfrac> <mo>=</mo><mn>5</mn><mtext> </mtext><mtext>rad/s</mtext></mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636117c069160cf1b2", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "58", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The instantaneous velocity of point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&nbsp;of the given rod of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> in the represented direction. What is the angular velocity (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>rad</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>) of the rod for the minimum possible magnitude of the velocity of the end <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>? \r&nbsp; <img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image1-35a2aed1-aa50-4281-b353-72c91004fdc7.png\" style=\"height: 117px; width: 240px;\" />", "image": null}, "options": [], "correctValue": "5.2", "solution": {"text": "If rod is rotated about end A, then vertical component of velocity, <math><msub><mrow><mi mathvariant=\"normal\">v</mi></mrow><mrow><mo>⊥</mo></mrow></msub></math> of end a will be zero.<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image2-9217c9d1-d16e-4959-b45a-0ade78582285.png\" style=\"height: 112px; width: 240px;\" /><br /><br /><math><mo>∴</mo><mi mathvariant=\"normal\">ω</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">v</mi><msup><mrow><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mn>60</mn></mrow></mrow></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></mrow><mrow><mi mathvariant=\"normal\">l</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><msqrt><mn>3</mn></msqrt><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">v</mi></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">l</mi></mrow></mfrac></math><br /><br /><math><mo>=</mo><mfrac><mrow><msqrt><mn>3</mn></msqrt><mo>×</mo><mn>3</mn></mrow><mrow><mn>2</mn><mo>×</mo><mn>0.5</mn></mrow></mfrac><mo>=</mo><mn>5.2</mn></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>rad</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632d78622bb5e46a45", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "12", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>Two beads each of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> are fixed on a&nbsp;light rigid rod&nbsp;of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>l</mi></math>&nbsp;which is&nbsp;free to rotate in a horizontal plane. The bead on the far end is given some velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math>&nbsp;as shown in the figure. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mi>cm</mi></msub></math>&nbsp;represents the kinetic energy of the centre of mass of the system and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mi mathvariant=\"normal\">R</mi></msub></math>&nbsp;represents the rotational kinetic energy of the system, then what is the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>K</mi><mi>cm</mi></msub><msub><mi>K</mi><mi mathvariant=\"normal\">R</mi></msub></mfrac></math>?</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/629276q.png\" style=\"width: 307px; height: 120px;\" /></p>\r", "image": null}, "options": [], "correctValue": "0.9", "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/629276s.png\" style=\"width: 308px; height: 169px;\" /></p><p>The distance of the centre of mass from the hinge,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>r</mi><mi>cm</mi></msub><mo>=</mo><mfrac><mrow><mi>m</mi><mi>l</mi><mo>+</mo><mi>m</mi><mo>(</mo><mn>2</mn><mi>l</mi><mo>)</mo></mrow><mrow><mi>m</mi><mo>+</mo><mi>m</mi></mrow></mfrac><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>l</mi></math></p><p>The angular velocity of the system,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ω</mi><mo>=</mo><mfrac><mi>v</mi><mrow><mn>2</mn><mi>l</mi></mrow></mfrac></math>&nbsp;</p><p>The velocity of the centre of mass of the system,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>cm</mi></msub><mo>=</mo><mfrac><mrow><mn>3</mn><mi>l</mi></mrow><mn>2</mn></mfrac><mi>ω</mi><mo>=</mo><mfrac><mn>3</mn><mn>4</mn></mfrac><mi>v</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msub><mi>K</mi><mi>cm</mi></msub><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mn>2</mn><mi>m</mi><msub><msup><mi>v</mi><mn>2</mn></msup><mi>cm</mi></msub><mo>=</mo><mfrac><mrow><mn>9</mn><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup></mrow><mn>16</mn></mfrac></math></p><p>The moment of inertia of the system about the hinge,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mi>m</mi><msup><mi>l</mi><mn>2</mn></msup><mo>+</mo><mi>m</mi><msup><mfenced><mrow><mn>2</mn><mi>l</mi></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>5</mn><mi>m</mi><msup><mi>l</mi><mn>2</mn></msup></math></p><p>The rotational kinetic energy of the system,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mi mathvariant=\"normal\">R</mi></msub><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>I</mi><msup><mi>ω</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mn>5</mn><mi>m</mi><msup><mi>l</mi><mn>2</mn></msup><msup><mfenced><mfrac><mi>v</mi><mrow><mn>2</mn><mi>l</mi></mrow></mfrac></mfenced><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msub><mi>K</mi><mi mathvariant=\"normal\">R</mi></msub><mo>=</mo><mfrac><mrow><mn>5</mn><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup></mrow><mn>8</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>K</mi><mi>cm</mi></msub><msub><mi>K</mi><mi mathvariant=\"normal\">R</mi></msub></mfrac><mo>=</mo><mfrac><mrow><mn>9</mn><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup></mrow><mn>16</mn></mfrac><mo>×</mo><mfrac><mn>8</mn><mrow><mn>5</mn><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mn>0</mn><mo>.</mo><mn>9</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863052bf63f1ed5fe29", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "27", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A disc of radius <math> <mtext>R</mtext> </math> rolls without slipping at a speed&nbsp;<math><mtext>v</mtext> </math> along the positive <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi></math>-axis. The velocity of a point <math> <mtext>P</mtext> </math> at the instant shown in the figure is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0030130_Question._._.jpg\" style=\"width: 198px; height: 192px;\" />", "image": null}, "options": [{"id": "XI0z6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mover><mtext>v</mtext><mo>&#x2192;</mo></mover><mtext>P</mtext></msub><mo>=</mo><mfenced><mrow><mtext>v</mtext><mo>+</mo><mfrac><mrow><mtext>v r sin</mtext><mspace width=\"0.5em\"/><mi mathvariant=\"normal\">&#x3B8;</mi></mrow><mtext>R</mtext></mfrac></mrow></mfenced><mover><mtext>i</mtext><mo>^</mo></mover><mo>+</mo><mfrac><mrow><mtext>v r cos</mtext><mspace width=\"0.5em\"/><mi mathvariant=\"normal\">&#x3B8;</mi></mrow><mtext>R</mtext></mfrac><mover><mtext>j</mtext><mo>^</mo></mover></math>", "image": null, "isCorrect": false}, {"id": "CCqAg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mover><mtext>v</mtext><mo>&#x2192;</mo></mover><mtext>P</mtext></msub><mo>=</mo><mfenced><mrow><mtext>v</mtext><mo>+</mo><mfrac><mrow><mtext>v r sin</mtext><mspace width=\"0.5em\"/><mi mathvariant=\"normal\">&#x3B8;</mi></mrow><mtext>R</mtext></mfrac></mrow></mfenced><mover><mtext>i</mtext><mo>^</mo></mover><mo>-</mo><mfrac><mrow><mtext>v r cos</mtext><mspace width=\"0.5em\"/><mi mathvariant=\"normal\">&#x3B8;</mi></mrow><mtext>R</mtext></mfrac><mover><mtext>j</mtext><mo>^</mo></mover></math>", "image": null, "isCorrect": true}, {"id": "HQi1C", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mover><mtext>v</mtext><mo>&#x2192;</mo></mover><mtext>P</mtext></msub><mo>=</mo><mfrac><mrow><mtext>v r sin</mtext><mspace width=\"0.5em\"/><mi mathvariant=\"normal\">&#x3B8;</mi></mrow><mtext>R</mtext></mfrac><mover><mtext>i</mtext><mo>^</mo></mover><mo>+</mo><mfrac><mrow><mtext>v r cos</mtext><mspace width=\"0.5em\"/><mi mathvariant=\"normal\">&#x3B8;</mi></mrow><mtext>R</mtext></mfrac><mover><mtext>j</mtext><mo>^</mo></mover></math>", "image": null, "isCorrect": false}, {"id": "P1dtx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mover><mtext>v</mtext><mo>&#x2192;</mo></mover><mtext>P</mtext></msub><mo>=</mo><mfrac><mrow><mtext>v r sin</mtext><mspace width=\"0.5em\"/><mi mathvariant=\"normal\">&#x3B8;</mi></mrow><mtext>R</mtext></mfrac><mover><mtext>i</mtext><mo>^</mo></mover><mo>-</mo><mfrac><mrow><mtext>v r cos</mtext><mspace width=\"0.5em\"/><mi mathvariant=\"normal\">&#x3B8;</mi></mrow><mtext>R</mtext></mfrac><mover><mtext>j</mtext><mo>^</mo></mover></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">ω</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">R</mi></mfrac></math>&nbsp;for pure rolling.<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0030130_Ans.jpg\" style=\"width: 191px; height: 192px;\" /><br /><br />The velocity of point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> is resultant of two velocity vectors shown as arrows in the figure. Hence,<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mrow> <mover accent=\"true\"> <mtext>v</mtext> <mo>→</mo> </mover> </mrow> <mtext>P</mtext> </msub> <mo>=</mo> <msub> <mtext>v</mtext> <mtext>x</mtext> </msub> <mover accent=\"true\"> <mtext>i</mtext> <mo>^</mo> </mover> <mo>+</mo> <msub> <mtext>v</mtext> <mtext>y</mtext> </msub> <mover accent=\"true\"> <mtext>j</mtext> <mo>^</mo> </mover> </mrow> </math><br /><br />or&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mrow> <mover accent=\"true\"> <mtext>v</mtext> <mo>→</mo> </mover> </mrow> <mtext>P</mtext> </msub> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>v</mtext> <mo>+</mo> <mfrac> <mrow> <mtext>v r sin</mtext> <mspace width=\"0.5em\"></mspace> <mi mathvariant=\"normal\">θ</mi> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </mfenced> <mrow> <mspace width=\"0.5em\"></mspace> <mover accent=\"true\"> <mtext>i</mtext> <mo>^</mo> </mover> </mrow> <mo>-</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>v r cos</mtext> <mspace width=\"0.5em\"></mspace> <mi mathvariant=\"normal\">θ</mi> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </mfenced> <mspace width=\"0.5em\"></mspace> <mover accent=\"true\"> <mtext>j</mtext> <mo>^</mo> </mover> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 7, "topicId": "6aa3ab79aa8dc1ff6817809b", "title": "Collisions in Rotation", "totalQuestions": 11, "questions": [{"_id": "6151e863eb49eebed56136b8", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "37", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A merry-go-round is at rest, pivoted on a frictionless axis. A child of mass&nbsp;<math><mi>m</mi> </math> runs along the path tangential to the rim with speed&nbsp;<math><mi>v</mi> </math> and jumps on to merry-go-round. If <math> <mi>R</mi> </math>is the radius of the merry-go-round and <math> <mi>I</mi> </math> is the moment of inertia, then the angular velocity of the merry-go-round and the child is", "image": null}, "options": [{"id": "BhkmZ", "text": "<math> <mrow> <mfrac> <mrow> <mi>m</mi><mi>v</mi><mi>R</mi></mrow> <mrow> <mi>m</mi><msup> <mi>R</mi> <mn>2</mn> </msup> <mo>+</mo><mi>I</mi></mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "0KnWX", "text": "<math> <mrow>  <mfrac>   <mrow>    <mi>m</mi><mi>v</mi><mi>R</mi></mrow>   <mi>I</mi>  </mfrac>  </mrow></math>", "image": null, "isCorrect": false}, {"id": "AfqO5", "text": "<math> <mrow>  <mfrac>   <mrow>    <mi>m</mi><msup>     <mi>R</mi>     <mn>2</mn>    </msup>    <mo>+</mo><mi>I</mi></mrow>   <mrow>    <mi>m</mi><mi>v</mi><mi>R</mi></mrow>  </mfrac>  </mrow></math>", "image": null, "isCorrect": false}, {"id": "LkNO5", "text": "<math> <mrow>  <mfrac>   <mi>I</mi>   <mrow>    <mi>m</mi><mi>v</mi><mi>R</mi></mrow>  </mfrac>  </mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "By law of conservation of angular momentum<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mtext mathvariant=\"italic\">mvR</mtext><mo mathvariant=\"italic\">=</mo><mfenced><msub><mtext mathvariant=\"italic\">I</mtext><mtext mathvariant=\"italic\">system</mtext></msub></mfenced><mtext mathvariant=\"italic\">&#969;</mtext></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mspace width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mtext mathvariant=\"italic\">mvR</mtext><mo mathvariant=\"italic\">=</mo><mfenced><mrow><mtext mathvariant=\"italic\">I</mtext><mo>+</mo><msup><mtext mathvariant=\"italic\">mR</mtext><mn mathvariant=\"italic\">2</mn></msup></mrow></mfenced><mtext mathvariant=\"italic\">&#969;</mtext></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mtext mathvariant=\"italic\">&#969;</mtext><mo mathvariant=\"italic\">=</mo><mfrac><mtext mathvariant=\"italic\">mvR</mtext><mrow><mtext mathvariant=\"italic\">I</mtext><mo>+</mo><msup><mtext mathvariant=\"italic\">mR</mtext><mn mathvariant=\"italic\">2</mn></msup></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e2d0f0c1277ae796", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "29", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A block of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math> is attached to one end of a light string which is wrapped on a disc of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">m</mi></math> and radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math>. The total length of the slack portion of the string is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">l</mi></math>. The block is released from rest. The angular velocity of the disc just after the string becomes taut is<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/oubpotpkvjoekwvsvzbyeyfufxjhhxwuebshhfwyvljhwtnehw.jpeg\" />", "image": null}, "options": [{"id": "B0W4T", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mi>gl</mi><msup><mi mathvariant=\"normal\">R</mi><mn>2</mn></msup></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "q5mcQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mi>gl</mi><msup><mi mathvariant=\"normal\">2R</mi><mn>2</mn></msup></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "mPL20", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mi>2gl</mi><msup><mi mathvariant=\"normal\">3R</mi><mn>2</mn></msup></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "T8nMd", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mi>3gl</mi><msup><mi mathvariant=\"normal\">2R</mi><mn>2</mn></msup></mfrac></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Using the principle of conservation of angular momentum,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi><msqrt><mn>2</mn><mi>gl</mi></msqrt><mo>&#215;</mo><mi mathvariant=\"normal\">R</mi><mo>=</mo><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mfenced separators=\"|\"><mrow><mn>2</mn><mi mathvariant=\"normal\">m</mi></mrow></mfenced><mi mathvariant=\"normal\">&#160;</mi><msup><mi mathvariant=\"normal\">R</mi><mn>2</mn></msup></mrow><mn>2</mn></mfrac><mo>+</mo><msup><mi>mR</mi><mn>2</mn></msup></mrow></mfenced><mo>&#215;</mo><mi mathvariant=\"normal\">&#969;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">&#969;</mi><mo>=</mo><msqrt><mfrac><mi>gl</mi><mrow><mn>2</mn><msup><mi mathvariant=\"normal\">R</mi><mn>2</mn></msup></mrow></mfrac></msqrt></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c13aad5ccf8d7587", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "47", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A uniform smooth rod (mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>&nbsp;and length <math><mi mathvariant=\"script\">l</mi></math> ) placed on a smooth horizontal floor is hit by a particle (mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>) moving on the floor, at a distance <math><mfrac><mrow><mi mathvariant=\"script\">l</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math> from one end elastically (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>e</mi><mo>=</mo><mn>1</mn></math>). The distance travelled by the centre of the rod after the collision, when it has completed three revolutions, will be</p>\r", "image": null}, "options": [{"id": "aSVxE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>&#x3C0;</mi><mi>l</mi></math>", "image": null, "isCorrect": true}, {"id": "p2hhf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>&#x3C0;</mi><mi>l</mi></math>", "image": null, "isCorrect": false}, {"id": "tssIo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn></mn><mi>&#x3C0;</mi><mi>l</mi></math>", "image": null, "isCorrect": false}, {"id": "8tGBq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi>&#x3C0;</mi><mi>l</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img alt=\"\" height=\"170\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image35-a77bff44-056e-4492-bf8d-cc4db7faffa5.jpg\" width=\"170\" /><br /><br />Applying conservation of linear momentum,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mi>v</mi><mo>=</mo><mi>m</mi><mi>v</mi><mi mathvariant=\"normal\">&#8242;</mi><mo>+</mo><mi>m</mi><mi>V</mi></math><br /><br /><math><mo>&#8658;</mo><mi>v</mi><mo>=</mo><mi>v</mi><mi mathvariant=\"normal\">&#8242;</mi><mo>+</mo><mi>V</mi></math>&nbsp; &nbsp; &nbsp; &nbsp;........(i)<br /><br />Applying conservation of angular momentum about the point of collision<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>=</mo><mfenced separators=\"|\"><mfrac><mrow><mi>m</mi><msup><mi>l</mi><mn>2</mn></msup></mrow><mn>12</mn></mfrac></mfenced><mi>&#969;</mi><mo>-</mo><mi>m</mi><mi>V</mi><mfenced separators=\"|\"><mfrac><mi>l</mi><mn>4</mn></mfrac></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>l</mi><mi>&#969;</mi><mo>=</mo><mn>3</mn><mi>V</mi></math>&nbsp; &nbsp; ..........(ii)<br /><br />for a perfectly elastic collision&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>e</mi><mo>=</mo><mn>1</mn></math></p><p>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>-</mo><mn>0</mn><mo>=</mo><mi>V</mi><mo>+</mo><mfrac><mrow><mi>&#969;</mi><mi>l</mi></mrow><mn>4</mn></mfrac><mo>-</mo><mi>v</mi><mi mathvariant=\"normal\">&#8242;</mi></math>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;..........(iii)</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mi>V</mi><mo>+</mo><mfrac><mrow><mn>3</mn><mi>V</mi></mrow><mn>4</mn></mfrac><mo>-</mo><mfenced><mrow><mi>v</mi><mo>-</mo><mi>V</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>v</mi><mo>=</mo><mfrac><mrow><mn>11</mn><mi>V</mi></mrow><mn>4</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>V</mi><mo>=</mo><mfrac><mrow><mn>8</mn><mi>v</mi></mrow><mn>11</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#969;</mi><mo>=</mo><mfrac><mrow><mn>24</mn><mi>v</mi></mrow><mrow><mn>11</mn><mi>l</mi></mrow></mfrac></math></p><p>Angle rotated by the rod&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi><mo>=</mo><mn>6</mn><mi>&#960;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mfrac><mi>&#952;</mi><mi>&#969;</mi></mfrac><mo>=</mo><mfrac><mrow><mn>6</mn><mi>&#960;</mi></mrow><mi>&#969;</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>6</mn><mi>&#960;</mi><mo>&#215;</mo><mfrac><mrow><mn>11</mn><mi>l</mi></mrow><mrow><mn>24</mn><mi>v</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>11</mn><mi>l</mi></mrow><mrow><mn>4</mn><mi>v</mi></mrow></mfrac></math></p><p>Hence, distance travelled by the centre of the rod is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mo>=</mo><mi>V</mi><mi>t</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mo>=</mo><mfrac><mrow><mn>8</mn><mi>v</mi></mrow><mn>11</mn></mfrac><mfenced separators=\"|\"><mfrac><mrow><mn>11</mn><mi>l</mi></mrow><mrow><mn>4</mn><mi>v</mi></mrow></mfrac></mfenced><mo>=</mo><mn>2</mn><mi>&#960;</mi><mi>l</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b72208c5062b1b90", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "84", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform rod of mass <math><msub><mrow><mi mathvariant=\"normal\">M</mi></mrow><mrow><mn>1</mn></mrow></msub></math> is hinged at its upper end. A particle of mass <math><msub><mrow><mi mathvariant=\"normal\">M</mi></mrow><mrow><mn>2</mn></mrow></msub></math> moving horizontally strikes the rod at its midpoint elastically. If the particle comes to rest after collision, then, Find the value of <math><mfrac><mrow><msub><mrow><mi>M</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>M</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math><br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image24-2b929b41-1e15-4d77-ab62-31c1194635a5.jpg\" styl ><mo> </mo><mi mathvariant=\"normal\">&nbsp;</mi><mo>…</mo><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced></math><br /><br />for <math><mi mathvariant=\"normal\">e</mi><mo>=</mo><mn>1</mn><mo>,</mo><mi mathvariant=\"normal\">&nbsp;</mi><msub><mrow><mi mathvariant=\"normal\">v</mi></mrow><mrow><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">M</mi></mrow></msub><mo>=</mo><mi mathvariant=\"normal\">v</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">ω</mi><mi>L</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">&nbsp;</mi><mo>…</mo><mfenced separators=\"|\"><mrow><mn>2</mn></mrow></mfenced></math><br /><br /><math><mo>⇒</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><mn>2</mn><mi>v</mi></mrow><mrow><mi>L</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn><msub><mrow><mi>M</mi></mrow><mrow><mn>2</mn></mrow></msub><mi>v</mi></mrow><mrow><mn>2</mn><msub><mrow><mi>M</mi></mrow><mrow><mn>1</mn></mrow></msub><mi>L</mi></mrow></mfrac></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mfrac><mrow><msub><mrow><mi>M</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>M</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math><br /><br /><math> <mo>=</mo><mn>0.75</mn> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638ab3b981dc66f9de", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "72", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A disc of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi>kg</mi></math> and radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> is rotating with an angular velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi>rad</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>, about an axis passing through its centre and perpendicular to its plane. If a mass of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.25</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi>kg</mi></math> is stuck on the periphery of the disc, then its angular velocity will become", "image": null}, "options": [{"id": "JYnqz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>24</mn><mi mathvariant=\"normal\">&#160;</mi><mi>rad</mi><mi mathvariant=\"normal\">&#160;</mi><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "W81IV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>36</mn><mi mathvariant=\"normal\">&#160;</mi><mi>rad</mi><mi mathvariant=\"normal\">&#160;</mi><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "ogrw9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mi mathvariant=\"normal\">&#160;</mi><mi>rad</mi><mi mathvariant=\"normal\">&#160;</mi><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "go1AX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>26</mn><mi mathvariant=\"normal\">&#160;</mi><mi>rad</mi><mi mathvariant=\"normal\">&#160;</mi><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When there is no external torque then the angular momentum remains constant.<br /><br />i.e. <math><mi>&#964;</mi><mo>=</mo><mn>0</mn><mo>&#8658;</mo><mfrac><mrow><mi>d</mi><mi>L</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mn>0</mn></math><br /><br /><math><mo>&#8756;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><msub><mrow><mi>I</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>&#969;</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi>I</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>&#969;</mi></mrow><mrow><mn>2</mn></mrow></msub></math> ... (i)<br /><br />Here <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><mo>=</mo><mn>2</mn><mi>&#160;</mi><mi>kg</mi><mo>,</mo><mi>&#160;</mi><mi>m</mi><mo>=</mo><mn>0.25</mn><mi mathvariant=\"normal\">&#160;</mi><mi>kg</mi><mo>,</mo><mi>&#160;</mi><mi>r</mi><mo>=</mo><mn>0.2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>,</mo></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#969;</mi><mn>1</mn></msub><mo>=</mo><mn>30</mn><mi mathvariant=\"normal\">&#160;</mi><mi>rad</mi><mi mathvariant=\"normal\">&#160;</mi><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br />Hence, putting the value of <math><msub><mrow><mi>&#969;</mi></mrow><mrow><mn>1</mn></mrow></msub></math> in equation (i), we get<br /><br /><math><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>&#215;</mo><mn>2</mn><mo>&#215;</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>0.2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>&#215;</mo><mn>30</mn><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>&#215;</mo><mfenced separators=\"|\"><mrow><mn>2</mn><mo>+</mo><mn>2</mn><mo>&#215;</mo><mn>0.25</mn></mrow></mfenced><msup><mrow><mfenced separators=\"|\"><mrow><mn>0.2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>&#215;</mo><msub><mrow><mi>&#969;</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br /><math><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mn>1.2</mn><mo>=</mo><mn>0.05</mn><mi>&#969;</mi><msub><mrow></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><msub><mi>&#969;</mi><mn>2</mn></msub><mo>=</mo><mn>24</mn><mi>&#160;</mi><mi>rad</mi><mi mathvariant=\"normal\">&#160;</mi><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636064858a27399b6a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "52", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A cubical block of side moving with a velocity&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math> on a horizontal smooth plane as shown. It hits a ridge at point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi></math>&nbsp;and sticks to it (collision is perfectly inelastic). The angular speed of the block after it hits&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi></math> is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/22302_1.jpg\" style=\"width: 196px; height: 140px;\" />", "image": null}, "options": [{"id": "KEkAQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><mi>v</mi></mrow><mrow><mn>4</mn><mi>a</mi></mrow></mfrac></math><div id=\"gtx-trans\" style=\"position: absolute; left: -1px; top: -6px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "d48F4", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><mi>v</mi></mrow><mrow><mn>2</mn><mi>a</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "22gK4", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msqrt><mn>3</mn></msqrt><mtext mathvariant=\"italic\">v</mtext></mrow><mrow><msqrt><mn>2</mn></msqrt><mtext mathvariant=\"italic\">a</mtext></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "Z4Fft", "text": "Zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0022302_Ans.jpg\" style=\"width: 417px; height: 105px;\" /></strong></u><br /><br /><br />Net torque about&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi></math> is zero.<br />Therefore, angular momentum <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>L</mi></mfenced></math> about point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi></math> will be conserved<br /><br />or, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">L</mtext><mtext>i</mtext></msub><mo>=</mo><msub><mtext mathvariant=\"italic\">L</mtext><mtext>f</mtext></msub></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">Mv</mtext><mfenced><mfrac><mtext mathvariant=\"italic\">a</mtext><mn>2</mn></mfrac></mfenced><mo>=</mo><msub><mtext mathvariant=\"italic\">I</mtext><mn>0</mn></msub><mi>&#969;</mi><mo>=</mo><mfenced><mrow><msub><mtext mathvariant=\"italic\">I</mtext><mtext>com</mtext></msub><mo>+</mo><msup><mtext mathvariant=\"italic\">Mr</mtext><mn>2</mn></msup></mrow></mfenced><mi>&#969;</mi></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced open=\"{\" close=\"}\"><mrow><mfenced><mfrac><msup><mtext mathvariant=\"italic\">Ma</mtext><mn>2</mn></msup><mn>6</mn></mfrac></mfenced><mo>+</mo><mtext mathvariant=\"italic\">M</mtext><mfenced><mfrac><msup><mtext mathvariant=\"italic\">a</mtext><mn>2</mn></msup><mn>2</mn></mfrac></mfenced></mrow></mfenced><mi>&#969;</mi><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><msup><mtext mathvariant=\"italic\">Ma</mtext><mn>2</mn></msup><mi>&#969;</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;&#160;&#160;&#160;</mo><mi>&#969;</mi><mo>=</mo><mn>3</mn><mtext mathvariant=\"italic\">v</mtext><mo>/</mo><mn>4</mn><mtext mathvariant=\"italic\">a</mtext></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863409ae221b1c0e1ca", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "83", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A rod&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math> of length&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math> and mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> is free to move on a frictionless horizontal surface. It is moving with a velocity&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math>, as shown in figure. End&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> of rod&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math> strikes the end of the wall. Assuming elastic impact, the angular velocity of the rod&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math>, just after impact, is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/0304476_ques.JPG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 170px; height: 74px;\" />", "image": null}, "options": [{"id": "hMAxF", "text": "<math><mfrac><mrow><mi>v</mi></mrow><mrow><mn>2</mn><mi>L</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "6xCoY", "text": "<math><mfrac><mrow><mn>3</mn><mi>v</mi></mrow><mrow><mi>L</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "u5a1h", "text": "<math><mfrac><mrow><mn>3</mn><mi>v</mi></mrow><mrow><mn>2</mn><mi>L</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "dHnXW", "text": "<math><mfrac><mrow><mi>v</mi></mrow><mrow><mi>L</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>From the conservation of angular&nbsp;momentum,</p><p><math><mo>⇒</mo><mi>M</mi><msub><mrow><mi>v</mi></mrow><mrow><mi>c</mi><mi>m</mi></mrow></msub><mfrac><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>M</mi><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>12</mn></mrow></mfrac><mi>ω</mi><mo>=</mo><mfrac><mrow><mi>M</mi><mi>v</mi><mi>L</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>⇒</mo><msub><mrow><mi>v</mi></mrow><mrow><mi>c</mi><mi>m</mi></mrow></msub><mo>+</mo><mfrac><mrow><mi>ω</mi><mi>L</mi></mrow><mrow><mn>6</mn></mrow></mfrac><mo>=</mo><mi>v</mi></math><br /><br />From the conservation of linear momentum,</p><p><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><mi>ω</mi><mi>L</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>-</mo><msub><mrow><mi>v</mi></mrow><mrow><mi>c</mi><mi>m</mi></mrow></msub><mo>=</mo><mi>v</mi><mo>⇒</mo><mi>ω</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>L</mi></mrow><mrow><mn>6</mn></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>2</mn><mi>v</mi></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>ω</mi><mo>=</mo><mfrac><mrow><mn>3</mn><mi>v</mi></mrow><mrow><msub><mrow><mi>L</mi></mrow></msub></mrow></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633224c770cdf7e58d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "85", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform rod of mass m and length&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math> is hinged at one end and free to rotate in the horizontal plane. All the surface are smooth. A particle of same mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> collides with the rod perpendicular to the length of rod with a speed <math><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>0</mn></mrow></msub></math>. The coefficient of restitution for the collision is <math><mi mathvariant=\"normal\">e</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>. If hinge reaction during the collision is zero then the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi></math> is:<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image19-8b6dacb6-be44-473a-99fc-ba1359d29599.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 130px; height: 106px;\" />", "image": null}, "options": [{"id": "lQvSh", "text": "No such value of x is possible", "image": null, "isCorrect": false}, {"id": "9nvMB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi><mo>=</mo><mfrac><mi>L</mi><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "gAzfJ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>L</mi></mrow><mn>3</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "YWaRB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi><mo>=</mo><mi>L</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Angular momentum conservation about the hinge<br /><br /><img alt=\"\" height=\"155\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image21-6392d037-010a-48cc-8f20-938fbd57d516.jpg\" style=\"max-width:100%; object-fit:contain\" width=\"268\" /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><msub><mi>v</mi><mn>0</mn></msub><mi mathvariant=\"normal\">x</mi><mo>=</mo><mi>m</mi><msub><mi>v</mi><mn>1</mn></msub><mi mathvariant=\"normal\">x</mi><mo>+</mo><mfrac><mrow><mi>m</mi><msup><mi>L</mi><mn>2</mn></msup></mrow><mn>3</mn></mfrac><mi>&#969;</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>0</mn></msub><mi mathvariant=\"normal\">x</mi><mo>=</mo><msub><mi>v</mi><mn>1</mn></msub><mi mathvariant=\"normal\">x</mi><mo>+</mo><mfrac><mrow><mi>&#969;</mi><msup><mi>L</mi><mn>2</mn></msup></mrow><mn>3</mn></mfrac></math> ...(i)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">e</mi><mo>=</mo><mfrac><mrow><mi>&#969;</mi><mi mathvariant=\"normal\">x</mi><mo>-</mo><msub><mi>v</mi><mn>1</mn></msub></mrow><msub><mi>v</mi><mn>0</mn></msub></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math> ...(ii)<br /><br />Impulse of hinge<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>J</mi><mo>=</mo><mi>m</mi><mi>&#969;</mi><mfrac><mi>L</mi><mn>2</mn></mfrac><mo>+</mo><mi>m</mi><msub><mi>v</mi><mn>1</mn></msub><mo>-</mo><mi>m</mi><msub><mi>v</mi><mn>0</mn></msub><mi mathvariant=\"normal\">&#160;</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>J</mi><mo>=</mo><mi>m</mi><mi>&#969;</mi><mfrac><mi>L</mi><mn>2</mn></mfrac><mo>-</mo><mi>m</mi><mfrac><mrow><mi>&#969;</mi><msup><mi>L</mi><mn>2</mn></msup></mrow><mrow><mn>3</mn><mi mathvariant=\"normal\">x</mi></mrow></mfrac><mi mathvariant=\"normal\">&#160;</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>J</mi><mo>=</mo><mn>0</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>L</mi></mrow><mn>3</mn></mfrac></math><br /><br />It is independent of &#39;e&#39;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632bbccfe3723d7de4", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "46", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A bullet of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">g</mi></math>&nbsp;and speed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>500</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>&nbsp;is fired into a door and gets embedded exactly at the centre of the door. The door is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>0</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>&nbsp;wide and weighs <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>&nbsp;</mo><mi>kg</mi></math>. It is hinged at one end and rotates about a vertical axis practically without friction. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ω</mi></math>&nbsp;is the angular speed (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>rad</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>) of the door just after the bullet embeds into it, then find the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mi>ω</mi></math>. Ignore the mass of the bullet as compared to the door.", "image": null}, "options": [], "correctValue": "6.25", "solution": {"text": "Given, mass of bullet (m) = 10 g&nbsp;= 0.01 kg<br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; Speed of bullet (v) = 500 m s<sup>-1</sup><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; Width of the door (l) = 1.0 m<br /><br />&nbsp; &nbsp; &nbsp; Mass of the door (M) = 12 kg<br /><br />As bullet gets embedded exactly at the centre of the door, therefore its distance from the hinged end of the door,<br /><br />​<math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>(r)</mtext> <mo>=</mo> <mfrac> <mrow> <mi>l</mi><mo>⁡</mo> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>m</mtext> </mrow> </math><br /><br />Angular momentum transferred by the bullet to the door,<br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;(L) = mv × r<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mo>=</mo> <mtext>0.01</mtext> <mo>×</mo> <mtext>500</mtext> <mo>×</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;= 2.5 J-s<br /><br />Moment of inertia of the door about the vertical axis at one of its end,<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>(I)</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>M</mtext> <msup> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi>l</mi><mo>⁡</mo> </mrow> <mn>2</mn> </msup> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>12</mtext> <mo>×</mo> <msup> <mtext>(1)</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> <mo>=</mo> <msup> <mtext>4 kg-m</mtext> <mn>2</mn> </msup> </mrow> </math><br /><br />But angular momentum, (L) = Iω​<br /><br />∴&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 2.5 = 4 × ω<br /><br /><math> <mrow> <mtext>or&nbsp;</mtext> <mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace , "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "By law of conservation of angular momentum<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mi>Σ</mi> <mtext>mvr</mtext> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext mathvariant=\"italic\">I</mtext> <mtext>system</mtext> </msub> </mrow> </mfenced> <mi>ω</mi> </mrow> </math><br /><br /><math> <mrow> <mo>⇒&nbsp;&nbsp;&nbsp;&nbsp;</mo> <mtext>mv</mtext> <mfrac> <mrow> <mtext mathvariant=\"italic\">l</mtext> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>2</mn> <mtext>m</mtext> </mrow> </mfenced> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>2</mn> <mtext mathvariant=\"italic\">l</mtext> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> </mrow> <mrow> <mn>1</mn> <mn>2</mn> </mrow> </mfrac> <mi>ω</mi> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> <mtext>m</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>4</mn> <msup> <mtext mathvariant=\"italic\">l</mtext> <mn>2</mn> </msup> </mrow> </mfenced> </mrow> <mrow> <mn>1</mn> <mn>2</mn> </mrow> </mfrac> <mi>ω</mi> </mrow> </math><br /><br /><math> <mrow> <mo>⇒&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</mo> <mi>ω</mi> <mo>=</mo> <mfrac> <mrow> <mn>3</mn> <mtext>v</mtext> </mrow> <mrow> <mn>4</mn> <mtext mathvariant=\"italic\">l</mtext> </mrow> </mfrac> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>anti-clockwise</mtext> </mrow> </mfenced> </mrow> </math><br /><br />Note that clockwise or anti-clockwise rotation can only be determined here by the given diagram.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
