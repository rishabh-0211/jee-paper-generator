a height&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math> above the bottom of the loop of radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> which is much larger than the radius of the sphere <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>. The minimum value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math> for the sphere to complete the loop is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-08-12_at_3.36.27_PM.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 180px; height: 114px;\" />", "image": null}, "options": [{"id": "GjEYv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>1</mn><mo>&#160;</mo><mi>R</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 103px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "L3FsD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>3</mn><mo>&#160;</mo><mi>R</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 103px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "OnZOW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>7</mn><mo>&#160;</mo><mi>R</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 103px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "C7X7p", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi>R</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 103px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "At the topmost point of the loop minimum value of<br />the linear speed of the centre of the sphere should be :<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">v</mtext><mo>=</mo><msqrt><mtext mathvariant=\"italic\">gR</mtext></msqrt></math><br /><br />or&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;translational kinetic energy<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">K</mtext><mtext>T</mtext></msub><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mtext mathvariant=\"italic\">mv</mtext><mn>2</mn></msup><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mtext mathvariant=\"italic\">mgR</mtext><mtext>.</mtext></math><br /><br />In case of pure rolling of a solid sphere the ratio<br />of rotational to translational kinetic energy is :<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mtext mathvariant=\"italic\">K</mtext><mtext>R</mtext></msub><msub><mtext mathvariant=\"italic\">K</mtext><mtext>T</mtext></msub></mfrac><mo>=</mo><mfrac><mn>2</mn><mn>5</mn></mfrac></math><br /><br />&there4; Total kinetic energy at topmost point should be :<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">K</mtext><mo>=</mo><mfrac><mrow><mn>5</mn><mo>+</mo><mn>2</mn></mrow><mn>5</mn></mfrac><mtext>.</mtext><mspace width=\"0.5em\"/><msub><mtext mathvariant=\"italic\">K</mtext><mtext>T</mtext></msub><mo>=</mo><mfrac><mn>7</mn><mn>5</mn></mfrac><mfenced><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><mtext mathvariant=\"italic\">mgR</mtext></mrow></mfenced><mo>=</mo><mfrac><mn>7</mn><mrow><mn>1</mn><mn>0</mn></mrow></mfrac><mtext mathvariant=\"italic\">mgR</mtext></math><br /><br />Now from conservation of mechanical energy :<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>7</mn><mrow><mn>1</mn><mn>0</mn></mrow></mfrac><mtext mathvariant=\"italic\">mgR</mtext><mo>=</mo><mtext mathvariant=\"italic\">mg</mtext><mspace width=\"0.5em\"/><mfenced><mrow><mtext mathvariant=\"italic\">h</mtext><mtext>&#160;- 2</mtext><mtext mathvariant=\"italic\">R</mtext></mrow></mfenced></math><br /><br />&there4;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mi>h</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>2</mn><mo>.</mo><mn>7</mn><mo>&#160;</mo><mi>R</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86388597e698e479dfa", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "30", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A solid spherical ball of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>9</mn></mfrac><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>&nbsp;is connected to a point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> on the wall with the help of a string which makes an angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>θ</mi><mo>=</mo><mn>45</mn><mo>°</mo></math>&nbsp;with the vertical. The sphere&nbsp;can rotate freely about its central axis and it is set into rotational motion against the vertical face of the wall with an angular velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&nbsp;</mo><mi>rad</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. In how much time (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">s</mi></math>) will it come to rest? [<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">μ</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>1</mn></math>]<br />\r<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/cd9b5746-cbb4-4d44-b94e-c7344643f06e-image11.jpeg\" style=\"height: 118px; width: 220px;\" />", "image": null}, "options": [], "correctValue": "20", "solution": {"text": "FBD of the spherical ball<br /><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/08168956-1d70-42a0-97b0-8bba646da59e-image12.jpeg\" style=\"height: 157px; width: 220px;\" /><br /><br />For translational equilibrium<br /><math><mi>T</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mn>45</mn><mo>°</mo><mo>=</mo><mi>M</mi><mi>g</mi><mo>+</mo><mi mathvariant=\"normal\">μ</mi><mi mathvariant=\"normal\">N</mi></math><br />T sin15° = N<br />Also <math><mi>τ</mi><mi mathvariant=\"normal\">Δ</mi><mi>t</mi><mo>=</mo><mi mathvariant=\"normal\">Δ</mi><mi>L</mi></math><br /><math><mo>⇒</mo><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">μ</mi><mi>N</mi><mi>R</mi></mrow></mfenced><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Δ</mi><mi>t</mi><mo>=</mo><mi>I</mi><msub><mrow><mi mathvariant=\"normal\">ω</mi></mrow><mrow><mn>0</mn></mrow></msub></math><br /><math><mi mathvariant=\"normal\">Δ</mi><mi>t</mi><mo>=</mo><mfrac><mrow><mfrac><mrow><mn>2</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mi>M</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><msub><mrow><mi>ω</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mi>μ</mi><mi>N</mi><mi>R</mi></mrow></mfrac></math><br />Solving we get t = 20 s", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86384c9326f2f3111a1", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "53", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A uniform ball of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>&nbsp;is placed on the top of a sphere of radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>10</mn><mi>r</mi></math>. It is given a slight push due to which it starts&nbsp;rolling down the sphere without slipping. The spin angular velocity of the ball when it breaks off from the sphere is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ω</mi><mo>=</mo><msqrt><mfrac><mi>p</mi><mi>q</mi></mfrac><mfenced><mfrac><mi>g</mi><mi>r</mi></mfrac></mfenced></msqrt></math>, where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi></math>&nbsp;is the acceleration due to gravity and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi></math>&nbsp;are the smallest integers. What is the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>+</mo><mi>q</mi></math>?</p>\r", "image": null}, "options": [], "correctValue": "127", "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mtext>mv</mtext><mn>2</mn></msup><mfenced><mrow><mtext>R</mtext><mo>+</mo><mtext>r</mtext></mrow></mfenced></mfrac><mo>=</mo><mo>mg cos</mo><mi>&#952;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>mgh</mtext><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mtext>mv</mtext><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mtext>I</mtext><msup><mi>&#969;</mi><mn>2</mn></msup></math></p><p><math> <mrow> <mtext>mg</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>R</mtext> <mo>+</mo> <mtext>r</mtext> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>1</mn> <mo>-</mo> <mo>cos</mo> <mi>&#952;</mi> </mrow> </mfenced> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msup> <mtext>mv</mtext> <mn>2</mn> </msup> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>5</mn> </mrow> </mfrac> <msup> <mtext>mv</mtext> <mn>2</mn> </msup> <mo>=</mo> <mfrac> <mrow> <mn>7</mn> </mrow> <mrow> <mn>1</mn> <mn>0</mn> </mrow> </mfrac> <msup> <mtext>mv</mtext> <mn>2</mn> </msup> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Image_1.png\" style=\"width: 124px; height: 142px;\" /><br /><br /><math> <mrow> <mfrac> <mrow> <mn>1</mn> <mn>0</mn> </mrow> <mrow> <mn>7</mn> </mrow> </mfrac> <mtext>mg</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>1</mn> <mo>-</mo> <mo>cos</mo> <mi>&#952;</mi> </mrow> </mfenced> <mo>=</mo> <mtext>mg</mtext> <mo>cos</mo> <mi>&#952;</mi> </mrow> </math><br /><br /><math> <mrow> <msup> <mtext>mv</mtext> <mn>2</mn> </msup> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>0</mn> </mrow> <mrow> <mn>7</mn> </mrow> </mfrac> <mtext>mg</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>R</mtext> <mo>+</mo> <mtext>r</mtext> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>1</mn> <mo>-</mo> <mtext>cos</mtext> <mi>&#952;</mi> </mrow> </mfenced> <mfrac> <mrow> <mn>1</mn> <mn>0</mn> </mrow> <mrow> <mn>7</mn> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>7</mn> </mrow> <mrow> <mn>7</mn> </mrow> </mfrac> <mtext>cos</mtext> <mi>&#952;</mi> </mrow> </math><br /><br />or&nbsp;<math> <mrow> <mo>cos</mo> <mi>&#952;</mi> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>0</mn> </mrow> <mrow> <mn>1</mn> <mn>7</mn> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mtext>v</mtext> <mo>=</mo> <msqrt> <mtext>g</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>R</mtext> <mo>+</mo> <mtext>r</mtext> </mrow> </mfenced> <mo>cos</mo> <mi>&#952;</mi> </msqrt> <mo>=</mo> <msqrt> <mfrac> <mrow> <mn>1</mn> <mn>0</mn> </mrow> <mrow> <mn>1</mn> <mn>7</mn> </mrow> </mfrac> <mtext>g</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>R</mtext> <mo>+</mo> <mtext>r</mtext> </mrow> </mfenced> </msqrt> </mrow> </math><br /><br />and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#969;</mi><mo>=</mo><mfrac><mtext>v</mtext><mtext>r</mtext></mfrac><mo>=</mo><msqrt><mfrac><mrow><mn>1</mn><mn>0</mn><mtext>g</mtext><mfenced><mrow><mtext>R</mtext><mo>+</mo><mtext>r</mtext></mrow></mfenced></mrow><mrow><mn>1</mn><mn>7</mn><msup><mtext>r</mtext><mn>2</mn></msup></mrow></mfrac></msqrt><mo>=</mo><msqrt><mfrac><mrow><mn>110</mn><mtext>g</mtext></mrow><mrow><mn>17</mn><mtext>r</mtext></mrow></mfrac></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>p</mi><mo>+</mo><mi>q</mi><mo>=</mo><mn>127</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863807caef5211ba474", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "70", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A weightless rod of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi></math> carries two equal masses&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> one fixed at the end and other in the middle of the rod. The rod can revolve in a vertical plane about <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>. Then horizontal velocity which must be imparted to end&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math> of the rod to deflect it to the horizontal position is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-07-27_at_3.14.48_PM.jpeg\" style=\"width: 180px; height: 194px;\" />", "image": null}, "options": [{"id": "OGwZM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mn>12</mn><mn>5</mn></mfrac><mi>g</mi><mi>l</mi></msqrt></math>", "image": null, "isCorrect": true}, {"id": "7fr6C", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn><mi>g</mi><mi>l</mi></msqrt></math>", "image": null, "isCorrect": false}, {"id": "82Tkb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mn>16</mn><mn>5</mn></mfrac><mi>g</mi><mi>l</mi></msqrt></math>", "image": null, "isCorrect": false}, {"id": "Jf2lf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>2</mn><mi>g</mi><mi>l</mi></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Loss in kinetic energy = gain in potential energy<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>I</mi><msup><mi>&#969;</mi><mn>2</mn></msup><mo>=</mo><mi>m</mi><mi>g</mi><mfrac><mi>l</mi><mn>2</mn></mfrac><mo>+</mo><mi>m</mi><mi>g</mi><mi>l</mi></math> ...(i)<br /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image20-883b7238-1ce3-4b73-8dea-99b2113c5906.png\" /><br /><br />Here, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mfrac><mrow><mi>m</mi><msup><mi>l</mi><mn>2</mn></msup></mrow><mn>4</mn></mfrac><mo>+</mo><mi>m</mi><msup><mi>l</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>5</mn><mn>4</mn></mfrac><mi>m</mi><msup><mi>l</mi><mn>2</mn></msup></math><br /><br />From (i),<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced separators=\"|\"><mrow><mfrac><mn>5</mn><mn>4</mn></mfrac><mi>m</mi><msup><mi>l</mi><mn>2</mn></msup></mrow></mfenced><msup><mi>&#969;</mi><mn>2</mn></msup><mo>=</mo><mfrac><mrow><mi>m</mi><mi>g</mi><mi>l</mi></mrow><mn>2</mn></mfrac><mo>+</mo><mi>m</mi><mi>g</mi><mi>l</mi><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>m</mi><mi>g</mi><mi>l</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><msup><mi>l</mi><mn>2</mn></msup><msup><mi>&#969;</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>12</mn><mn>5</mn></mfrac><mi>m</mi><mi>g</mi><mi>l</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><msub><mi>v</mi><mi mathvariant=\"normal\">c</mi></msub><mo>=</mo><msqrt><mfenced separators=\"|\"><mfrac><mrow><mn>12</mn><mi>g</mi><mi>l</mi></mrow><mn>5</mn></mfrac></mfenced></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637cd284b06a25fe7c", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "06", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>The toy-top (initially at rest)&nbsp;shown in the figure, has a moment of inertia <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup><mo>&nbsp;</mo><mi>kg</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math>&nbsp;and it is&nbsp;free to rotate about the stationary axis&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>A</mi><mo>'</mo></math>. The&nbsp;string wrapped around the&nbsp;peg&nbsp;of the toy-top is pulled outwards without&nbsp;letting it slip and simultaneously maintaining&nbsp;a constant tension of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>.</mo><mn>625</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi></math>. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ω</mi></math>&nbsp;is the angular speed (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>rad</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>) of the top after&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>80</mn><mo>&nbsp;</mo><mi>cm</mi></math>&nbsp;of string has been pulled off the peg, then mark your answer as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>ω</mi><mn>100</mn></mfrac></math>.</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/627076_queaefnd_phy.png\" style=\"width: 180px; height: 230px;\" /></p>\r", "image": null}, "options": [], "correctValue": "1.50", "solution": {"text": "Work done<br /><br /><math> <mrow> <mo>=</mo><mtext>F</mtext><mo>×</mo><mi>Δ</mi><mtext>r</mtext><mo>=</mo><mn>5.625</mn><mo>×</mo><mn>0.8</mn><mtext> </mtext><mtext>m</mtext><mo>=</mo><mn>4.5</mn><mtext> </mtext><mtext>J</mtext></mrow> </math> and<br /><br />work done <math> <mrow> <mo>=</mo><mi>Δ</mi><mtext>K</mtext><mo>=</mo><mfrac> <mn>1</mn> <mn>2</mn> </mfrac> <msubsup> <mrow> <mtext>Iω</mtext></mrow> <mtext>r</mtext> <mtext>2</mtext> </msubsup> <mo>−</mo><mfrac> <mn>1</mn> <mn>2</mn> </mfrac> <msubsup> <mrow> <mtext>Iω</mtext></mrow> <mtext>1</mtext> <mtext>2</mtext> </msubsup> </mrow> </math><br /><br /><math> <mrow> <mo>∴</mo><mn>4.5</mn><mo>=</mo><mfrac> <mn>1</mn> <mn>2</mn> </mfrac> <mo>×</mo><mn>4</mn><mo>×</mo><msup> <mrow> <mn>10</mn></mrow> <mrow> <mo>−</mo><mn>4</mn></mrow> </msup> <mo>×</mo><msubsup> <mtext>ω</mtext> <mtext>r</mtext> <mtext>2</mtext> </msubsup> <mo>−</mo><mn>0</mn></mrow> </math><br /><br /><math> <mrow> <mn>...</mn></mrow> </math> (<math> <mo>∵</mo> </math> top starts from rest, <math> <mrow> <msub> <mi>ω</mi> <mtext>i</mtext> </msub> <mo>=</mo><mn>0</mn></mrow> </math>)<br /><br /><math> <mrow> <msub> <mtext>ω</mtext> <mtext>f</mtext> </msub> <mo>=</mo><mn>150</mn><mtext> </mtext><mtext>rad/s</mtext></mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86378d78e10b0000c9b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "67", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>As shown in the figure, wheel <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>r</mi><mi mathvariant=\"normal\">A</mi></msub><mo>=</mo><mn>10</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math> is coupled by a belt <math><mi mathvariant=\"normal\">B</mi></math> to the wheel <math><mi mathvariant=\"normal\">C</mi></math> of radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>r</mi><mi mathvariant=\"normal\">C</mi></msub><mo>=</mo><mn>25</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>. The angular speed of wheel <math><mi mathvariant=\"normal\">A</mi></math> is increased from rest at a constant rate of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1.6</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">d</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>. Time after which wheel <math><mi mathvariant=\"normal\">C</mi></math> reaches a rotational speed of <math><mn>100</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">m</mi></math>, assuming the belt does not slip, is nearly<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image23-f9a1c174-cd30-4fa8-85f9-9ee5f0c71413.jpg\" style=\"height: 93px; width: 220px;\" /></p>\r", "image": null}, "options": [{"id": "z6dq7", "text": "<math><mn>4</mn><mi>&nbsp;</mi><mrow><mrow><mi mathvariant=\"normal\">s</mi></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "VqTN3", "text": "<math><mn>8</mn><mi>&nbsp;</mi><mrow><mrow><mi mathvariant=\"normal\">s</mi></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "FJ9zW", "text": "<math><mn>12</mn><mi>&nbsp;</mi><mrow><mrow><mi mathvariant=\"normal\">s</mi></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "7njca", "text": "<math><mn>16&nbsp;</mn><mrow><mrow><mi mathvariant=\"normal\">s</mi></mrow></mrow></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>a</mi><mi>t</mi></msub><mo>=</mo><msub><mi>&#945;</mi><mi mathvariant=\"normal\">A</mi></msub><mi>&#160;</mi><msub><mi>r</mi><mi mathvariant=\"normal\">A</mi></msub><mo>=</mo><msub><mi>&#945;</mi><mi mathvariant=\"normal\">C</mi></msub><msub><mi>r</mi><mi mathvariant=\"normal\">C</mi></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#945;</mi><mi mathvariant=\"normal\">C</mi></msub><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><msub><mi>&#945;</mi><mi mathvariant=\"normal\">A</mi></msub><mi mathvariant=\"normal\">&#160;</mi><mfenced separators=\"|\"><mfrac><msub><mi>r</mi><mi mathvariant=\"normal\">A</mi></msub><msub><mi>r</mi><mi mathvariant=\"normal\">C</mi></msub></mfrac></mfenced><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mtext>1.6</mtext><mo>&#215;</mo><mfrac><mn>10</mn><mn>25</mn></mfrac><mo>=</mo><mtext>0.64</mtext><mo>&#160;</mo><mi>rad</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mfrac><msub><mi>&#969;</mi><mi>C</mi></msub><msub><mi>&#945;</mi><mi>C</mi></msub></mfrac><mo>=</mo><mfrac><mfrac><mrow><mn>100</mn><mo>&#215;</mo><mn>2</mn><mi>&#960;</mi></mrow><mn>60</mn></mfrac><mrow><mn>0</mn><mo>.64</mo></mrow></mfrac><mo>=</mo><mtext>16.35&#160;</mtext><mi mathvariant=\"normal\">s</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636dc44e0a3e22c294", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "03", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The moment of inertia of a rigid body in terms of its angular momentum <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math> and kinetic energy <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi></math>&nbsp;is", "image": null}, "options": [{"id": "esAaf", "text": "<math><mfrac><mrow><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>K</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "88Usi", "text": "<math><mfrac><mrow><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><mi>K</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "rAIdf", "text": "<math><mfrac><mrow><mi>L</mi></mrow><mrow><msup><mrow><mn>2</mn><mi>K</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "D1wlo", "text": "<math><mfrac><mrow><mi>L</mi></mrow><mrow><mn>2</mn><mi>K</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Angular momentum of a rigid body about a fixed axis is given by<br /><br /><math><mi>L</mi><mo>=</mo><mi>I</mi><mi>ω</mi></math><br /><br />Where <math><mi>I</mi></math> is moment of inertia and <math><mi>ω</mi></math> is angular velocity about that axis.<br /><br />Kinetic energy of body is given by<br /><br /><math><mi>K</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>&nbsp;</mi><mi>I</mi><msup><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br /><math><mo>∴</mo></math> <math><mi>K</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><mi>I</mi></mrow></mfrac><msup><mrow><mfenced separators=\"|\"><mrow><mi>I</mi><mi>ω</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><mi>I</mi></mrow></mfrac></math><br /><br /><math><mo>⇒</mo></math> <math><mi>I</mi><mo>=</mo><mfrac><mrow><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><mi>K</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636d4050d8d9eb3056", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "40", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two uniform discs&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&nbsp;of equal radii but having different masses <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi>kg</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi>kg</mi></math>&nbsp;respectively, are connected (at centres) by a massless spring of spring constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi><mo>=</mo><mn>1000</mn><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>&nbsp;and then placed on a sufficiently rough horizontal surface. If initially, the system is released from rest with the spring being compressed by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#160;</mo><mi>cm</mi></math>, then the speed of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> when the spring comes back to its natural length, is<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ad1a64a9-2cb4-4862-a777-0b1dc70c7305-image15.png\" style=\"height: 95px; width: 200px;\" />", "image": null}, "options": [{"id": "DYcvB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>A</mi></msub><mo>=</mo><msqrt><mfrac><mn>40</mn><mn>9</mn></mfrac></msqrt><mi>&#xA0;</mi><mi mathvariant=\"normal\">m</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "Gdejg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>A</mi></msub><mo>=</mo><msqrt><mfrac><mn>20</mn><mn>9</mn></mfrac></msqrt><mi>&#xA0;</mi><mi mathvariant=\"normal\">m</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "OSc4B", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>A</mi></msub><mo>=</mo><msqrt><mfrac><mn>20</mn><mn>3</mn></mfrac></msqrt><mi>&#xA0;</mi><mi mathvariant=\"normal\">m</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "IPvNJ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>A</mi></msub><mo>=</mo><msqrt><mfrac><mn>40</mn><mn>3</mn></mfrac></msqrt><mi>&#xA0;</mi><mi mathvariant=\"normal\">m</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/b450b365-425b-4c4e-ae5f-3465dc5ccee5-image16.png\" style=\"height: 126px; width: 200px;\" /></p><p><math><mi>k</mi><mi>x</mi><mo>-</mo><mi>f</mi><mo>=</mo><mi>M</mi><mi>a</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mi>R</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup><mfrac><mi>a</mi><mi>R</mi></mfrac></math></p><p><math><mi>a</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>k</mi><mi>x</mi></mrow><mrow><mn>3</mn><mi>M</mi></mrow></mfrac></math></p><p><math><mi>f</mi><mo>=</mo><mfrac><mrow><mi>k</mi><mi>x</mi></mrow><mrow><mn>3</mn></mrow></mfrac></math></p><p>So the friction forces acting on <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&nbsp;are always equal in magnitude and opposite in direction. Hence, the net force acting on the system is always zero.<br />By energy and momentum conservation. (When spring in its natural length)</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mi>A</mi></msub><msub><mi>v</mi><mi>A</mi></msub><mo>=</mo><msub><mi>m</mi><mi>B</mi></msub><msub><mi>v</mi><mi>B</mi></msub></math></p><p><math><msub><mrow><mi>v</mi></mrow><mrow><mi>B</mi></mrow></msub><mo>=</mo><mfrac><mrow><msub><mrow><mi>v</mi></mrow><mrow><mi>A</mi></mrow></msub></mrow><mrow><mn>2</mn></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>4</mn></mfrac><msub><mi>m</mi><mi>A</mi></msub><msubsup><mi>v</mi><mi>A</mi><mn>2</mn></msubsup><mo>+</mo><mfrac><mn>3</mn><mn>4</mn></mfrac><msub><mi>m</mi><mi>B</mi></msub><msub><msup><mi>v</mi><mn>2</mn></msup><mi>B</mi></msub><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>k</mi><msup><mi>x</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>4</mn></mfrac><msub><mi>m</mi><mi>A</mi></msub><msubsup><mi>v</mi><mi>A</mi><mn>2</mn></msubsup><mo>+</mo><mfrac><mn>3</mn><mn>4</mn></mfrac><msub><mi>m</mi><mi>B</mi></msub><mfrac><msubsup><mi>v</mi><mi>A</mi><mn>2</mn></msubsup><mn>4</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>k</mi><msup><mi>x</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>9</mn><msubsup><mi>v</mi><mi>A vel": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "89", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A constant power is supplied to a disc that can rotate freely about a fixed vertical axis. Angular velocity <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">ω</mi></mrow></mfenced></math> of the disc varies with the number of rotations (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">n</mi></math>) made by the disc after starting from rest as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">ω</mi><mo>=</mo><mi mathvariant=\"normal\">k</mi><msup><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">x</mi></msup></math>. Hence&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi></math> is: (K is a constant)", "image": null}, "options": [{"id": "MUqVM", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "iA24M", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "ti74Q", "text": "<math><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "WoOkY", "text": "<math><mn>2</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi mathvariant=\"normal\">τ</mi><mo>=</mo><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">α</mi></math> <br/><br/>         <math><mi mathvariant=\"normal\">P</mi><mo>=</mo><mi mathvariant=\"normal\">τ</mi><mi mathvariant=\"normal\">ω</mi></math> <br/><br/>         <math><mi mathvariant=\"normal\">P</mi><mo>=</mo><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\"> <
