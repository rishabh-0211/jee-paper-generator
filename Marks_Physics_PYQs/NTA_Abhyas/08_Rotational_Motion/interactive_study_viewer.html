 mathvariant=\"normal\">m</mi></math>,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><mfrac><mi>τ</mi><mi>d</mi></mfrac><mo>=</mo><mfrac><mn>1.6</mn><mn>0.4</mn></mfrac><mo>=</mo><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi></math>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635dccba8e373a0846", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "56", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A cylinder weighing <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>450</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi></math> with a radius of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&nbsp;</mo><mi>cm</mi></math> is held fixed on an incline that is rotating at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi>rad</mi><mo>&nbsp;</mo><msup><mi>s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. The cylinder is released when the incline is at position <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">θ</mi></math> equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>°</mo></math>. If the cylinder is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> from the bottom <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> at the instant of release, what is the initial acceleration of the centre of the cylinder relative to the incline, if there is no slipping? <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow> tion: absolute; left: 107px; top: 41px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Free body diagram of the cylinder w.r.t. the inclined plane. The torque about the point of contact O.<br /><br /><math> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>mg</mtext> <mspace width=\"0.5em\"></mspace> <mtext>sin</mtext> <mspace width=\"0.5em\"></mspace> <mi>&#952;</mi> <mo>-</mo> <mtext>mr</mtext> <msup> <mi>&#969;</mi> <mn>2</mn> </msup> </mrow> </mfenced> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>R</mi><mo>&#8289;</mo> <mo>=</mo> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>I</mi><mo>&#8289;</mo> <mtext>.</mtext> <mi>&#945;</mi> <mo>=</mo> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msup> <mtext>mR</mtext> <mn>2</mn> </msup> <mo>&#215;</mo> <mfrac> <mrow> <mi>a</mi> </mrow> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>R</mi><mo>&#8289;</mo> </mrow> </mfrac> </mrow> </math>&nbsp; &nbsp; (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>= radius of circle, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>6</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math>)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mspace width=\"0.5em\"/><mtext>mgsin</mtext><mspace width=\"0.5em\"/><mi>&#952;</mi><mo>-</mo><mtext>mr</mtext><msup><mi>&#969;</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>ma</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mspace width=\"0.5em\"/><mi>a</mi><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><mfenced><mrow><mtext>g</mtext><mspace width=\"0.5em\"/><mtext>sin</mtext><mspace width=\"0.5em\"/><mi>&#952;</mi><mo>-</mo><mi>r</mi><mo>&#8289;</mo><msup><mi>&#969;</mi><mn>2</mn></msup></mrow></mfenced><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><mfenced open=\"[\" close=\"]\"><mrow><mn>1</mn><mn>0</mn><mo>&#215;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>-</mo><mn>6</mn><mo>&#215;</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mrow></mfenced><mo>=</mo><mn>2</mn><mtext>.</mtext><mn>3</mn><mn>3</mn><mspace width=\"0.5em\"/><msup><mtext>m&#160;s</mtext><mrow><mo>-</mo><mn>2</mn></mrow></msup></math><br /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013412_AnsExp_1.jpg\" style=\"width: 200px; height: 136px;\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635b9a71427cefe6fa", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "44", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform rod&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math> of length&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi></math> and mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> is free to rotate about point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>. The rod is released from rest in the horizontal position. The initial angular acceleration of the rod will be<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-07-01_at_11.55.38_AM.jpeg\" style=\"width: 200px; height: 132px;\" />", "image": null}, "options": [{"id": "BoPy9", "text": "<math> <mrow> <mfrac> <mrow> <mn>2</mn> <mtext>g</mtext> </mrow> <mrow> <mn>3</mn> <mi>l</mi> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "dg8jg", "text": "<math> <mrow> <mtext>g</mtext> <mfrac> <mrow> <mi>l</mi> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "IT2pw", "text": "<math><mrow>  <mfrac>    <mrow>      <mn>3</mn>    </mrow>    <mrow>      <mn>2</mn>    </mrow>  </mfrac>  <mtext>g</mtext><mi>l</mi></mrow></math>", "image": null, "isCorrect": false}, {"id": "KfdN3", "text": "<math> <mrow> <mfrac> <mrow> <mn>3</mn> <mtext>g</mtext> </mrow> <mrow> <mn>2</mn> <mi>l</mi> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The moment of inertia of the uniform rod about an axis through one end and perpendicular to its length is<br /><br /><math> <mrow> <mtext>I</mtext> <mo>=</mo> <mfrac> <mrow> <msup> <mtext>ml</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> </mrow> </math><br /><br />Where m is mass of rod and l is length.<br /><br />Torque <math> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi>τ</mi> <mo>=</mo> <mtext>I</mtext> <mi>α</mi> </mrow> </mfenced> </mrow> </math>&nbsp;acting on centre of gravity of rod is given by<br /><br /><math> <mrow> <mi>τ</mi> <mo>=</mo> <mtext>mg</mtext> <mfrac> <mrow> <mn>l</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math><br /><br />or&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext>I</mtext> <mi>α</mi> <mo>=</mo> <mtext>mg</mtext> <mfrac> <mrow> <mn>l</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math><br /><br />or&nbsp;&nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <msup> <mtext>ml</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> <mi>α</mi> <mo>=</mo> <mtext>mg</mtext> <mfrac> <mrow> <mn>l</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math><br /><br />or&nbsp;&nbsp;&nbsp;<math> <mrow> <mi>α</mi> <mo>=</mo> <mfrac> <mrow> <mn>3</mn> <mtext>g</mtext> </mrow> <mrow> <mn>2</mn> <mtext>l</mtext> </mrow> </mfrac> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStruct t-fit:contain\" style=\"width: 152px; height: 162px;\" /></u></strong><br /><br /><math> <mrow> <mi>&mu;</mi> <mtext>N</mtext> <mo>-</mo> <mtext>mg sin</mtext> <mi>&theta;</mi> <mo>=</mo> <mtext>m</mtext> <msup> <mi>&omega;</mi> <mn>2</mn> </msup> <mfrac> <mrow> <mi>ℓ</mi> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mtext>mg cos</mtext> <mi>&theta;</mi> <mo>-</mo> <mtext>N</mtext> <mo>=</mo> <mtext>m</mtext> <mfrac> <mrow> <mi>ℓ</mi> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> <mi>&alpha;</mi> </mrow> </math><br /><br />Solving , <math> <mrow> <mn>1</mn> <mn>3</mn> <mo>tan</mo> <mi>&theta;</mi> <mo>=</mo> <mn>4</mn> <mi>&mu;</mi> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86350d387aac8277a6c", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "91", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform thin hemispherical shall is kept at rest and in equilibrium on an inclined plane of angle of inclination <math><mi mathvariant=\"normal\">θ</mi><mo>=</mo><msup><mrow><mn>30</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math> as shown in figure. If the surface of the inclined plane is sufficiently rough to prevent sliding then the angle <math><mi mathvariant=\"normal\">α</mi></math> made by the plane of hemisphere with inclined plane is:<br />\r<br />\r<img alt=\"\" height=\"138\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image16-cef0a479-1703-45a7-98ca-da51f3c17836.jpg\" style=\"max-width:100%; object-fit:contain\" width=\"249\" />", "image": null}, "options": [{"id": "fsqhC", "text": "Value o
