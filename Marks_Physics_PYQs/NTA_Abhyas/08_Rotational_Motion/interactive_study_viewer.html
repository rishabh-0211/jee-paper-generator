<mrow> <mtext>x tan</mtext> <mi>θ</mi> <mo>=</mo> <mn>4</mn> <mi>μ</mi> </mrow> </math> . Find x. (Take g = 10 m/s<sup>2</sup>)<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0070168_Question.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 180px; height: 163px;\" />", "image": null}, "options": [{"id": "kM0Eq", "text": "13", "image": null, "isCorrect": true}, {"id": "T4cO2", "text": "11", "image": null, "isCorrect": false}, {"id": "IKKWE", "text": "9", "image": null, "isCorrect": false}, {"id": "0GxMb", "text": "7", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "One fourth length<br /><br /><math> <mrow> <mfrac> <mrow> <mtext>mg</mtext> <mi>ℓ</mi> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> <mtext>sin</mtext> <mi>&theta;</mi> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>I</mtext> <msup> <mi>&omega;</mi> <mn>2</mn> </msup> </mrow> </math><br /><br /><math> <mrow> <mi>&alpha;</mi> <mo>=</mo> <mfrac> <mrow> <mtext>mg</mtext> <mfrac> <mrow> <mi>ℓ</mi> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> <mo>cos</mo> <mi>&theta;</mi> </mrow> <mrow> <mtext>I</mtext> </mrow> </mfrac> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp; <strong><u><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0070168_Solution.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 152px; height: 162px;\" /></u></strong><br /><br /><math> <mrow> <mi>&mu;</mi> <mtext>N</mtext> <mo>-</mo> <mtext>mg sin</mtext> <mi>&theta;</mi> <mo>=</mo> <mtext>m</mtext> <msup> <mi>&omega;</mi> <mn>2</mn> </msup> <mfrac> <mrow> <mi>ℓ</mi> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mtext>mg cos</mtext> <mi>&theta;</mi> <mo>-</mo> <mtext>N</mtext> <mo>=</mo> <mtext>m</mtext> <mfrac> <mrow> <mi>ℓ</mi> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> <mi>&alpha;</mi> </mrow> </math><br /><br />Solving , <math> <mrow> <mn>1</mn> <mn>3</mn> <mo>tan</mo> <mi>&theta;</mi> <mo>=</mo> <mn>4</mn> <mi>&mu;</mi> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863501f79351d4e3eff", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "16", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>In a continuous printing process, paper roll is wrapped on a cylindrical core which is free to rotate about a fixed horizontal axis. The paper is drawn into the process at a constant speed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math>, as shown in the figure. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math> is the radius of paper on the roll at any given time and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>b</mi></math> is the thickness of the paper, then the angular acceleration of the roll at this instant is<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/bb-11.JPG\" style=\"width: 270px; height: 221px;\" /></p>\r", "image": null}, "options": [{"id": "ceBfa", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msup><mi>v</mi><mn>2</mn></msup><mi>b</mi></mrow><mrow><mn>2</mn><msup><mi>&#x3C0;</mi><mn>2</mn></msup><msup><mi>r</mi><mn>3</mn></msup></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "LlDtt", "text": "<p>zero because&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math>&nbsp;is constant</p>", "image": null, "isCorrect": false}, {"id": "GY2fS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msup><mi>v</mi><mn>2</mn></msup><mi>b</mi></mrow><mrow><mn>2</mn><mi>π</mi><msup><mi>r</mi><mn>3</mn></msup></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "SGt8R", "text": "cannot be calculated from given information", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>In a continuous printing process suppose the total length of paper is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi></math>.</p><p>If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>r</mi><mn>1</mn></msub></math> is the inner radius of roll then,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>π</mi><msup><mi>r</mi><mn>2</mn></msup><mo>-</mo><mi>π</mi><msubsup><mi>r</mi><mn>1</mn><mn>2</mn></msubsup><mo>=</mo><mi>l</mi><mo>×</mo><mi>b</mi></math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(i)<br />And at this moment,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mi>r</mi><mi>ω</mi></math>&nbsp; &nbsp; &nbsp;...(ii)&nbsp; &nbsp;&nbsp;<br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/bbbbb-111.JPG\" style=\"width: 200px; height: 174px;\" /><br /><br />Differentiating equation (i) w.r.t. time,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>π</mi><mo>×</mo><mn>2</mn><mi>r</mi><mfrac><mrow><mi>d</mi><mi>r</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>d</mi><mi>l</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>·</mo><mi>b</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mrow><mi>d</mi><mi>r</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>v</mi><mo>.</mo><mi>b</mi></mrow><mrow><mn>2</mn><mi>π</mi><mi>r</mi></mrow></mfrac></math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(iii)<br /><br />Differentiating equation (ii) w.r.t time<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>⇒</mi><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mi>r</mi><mfenced><mfrac><mrow><mi>d</mi><mi>ω</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mfenced><mo>+</mo><mi>ω</mi><mfenced><mfrac><mrow><mi>d</mi><mi>r</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mfenced></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>⇒</mtext><mn>0</mn><mo>=</mo><mi>r</mi><mi>α</mi><mo>+</mo><mi>ω</mi><mfrac><mrow><mi>d</mi><mi>r</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>∵</mo><mfrac><mtext>dr</mtext><mtext>dt</mtext></mfrac><mtext>is</mtext><mo>-</mo><mtext>ve</mtext></mrow></mfenced></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>⇒</mtext><mfrac><mrow><mi>d</mi><mi>r</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>r</mi><mi>α</mi></mrow><mi>ω</mi></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>⇒</mtext><mi>α</mi><mo>=</mo><mfrac><mi>ω</mi><mi>r</mi></mfrac><mfenced><mfrac><mrow><mi>d</mi><mi>r</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mfenced></math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(iv)<br /><br />Using (iii) and (iv),&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>v</mi><mi>b</mi><mi>.</mi><mi>ω</mi></mrow><mrow><mn>2</mn><mi>π</mi><msup><mi>r</mi><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><msup><mi>v</mi><mn>2</mn></msup><mi>b</mi></mrow><mrow><mn>2</mn><mi>π</mi><msup><mi>r</mi><mn>3</mn></msup></mrow></mfrac><mo>=</mo><mi>α</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634d4dc95eb9ce198a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "98", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform disc of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> and radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;is supported vertically by a pivot at its periphery as shown. A particle of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> is fixed to the rim and raised to the highest point above the centre. The system is released from rest and it can rotate about pivot freely. The angular speed of the system when it attached object is directly beneath the pivot, is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image6-7f944a77-05b4-4e43-91be-e66d5de1a1f9.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"height: 178px; width: 130px;\" />", "image": null}, "options": [{"id": "QF7nn", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mrow><mn>24</mn><mi>g</mi></mrow><mrow><mn>11</mn><mi>R</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "vyHYK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mrow><mn>8</mn><mi>g</mi></mrow><mrow><mn>11</mn><mi>R</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "kd6xu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mrow><mn>8</mn><mi>g</mi></mrow><mrow><mn>3</mn><mi>R</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "LwKFr", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mrow><mn>14</mn><mi>g</mi></mrow><mrow><mn>3</mn><mi>R</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><mi>g</mi><mfenced><mrow><mn>2</mn><mi>R</mi></mrow></mfenced><mo>+</mo><mi>M</mi><mi>g</mi><mfenced><mrow><mn>4</mn><mi>R</mi></mrow></mfenced><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>&#160;</mi><mfenced separators=\"|\"><mrow><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup><mo>+</mo><mi>M</mi><mo>(</mo><mn>2</mn><mi>R</mi><msup><mo>)</mo><mn>2</mn></msup></mrow></mfenced><msup><mi>&#969;</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>6</mn><mi>M</mi><mi>g</mi><mi>R</mi><mo>=</mo><mfrac><mn>11</mn><mn>4</mn></mfrac><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup><msup><mi>&#969;</mi><mn>2</mn></msup></math><br /><br /><math><mo>&#8658;</mo><mi mathvariant=\"italic\">&#160;</mi><mi mathvariant=\"italic\">&#969;</mi><mo>=</mo><msqrt><mfrac><mrow><mn>24</mn><mi mathvariant=\"italic\">g</mi></mrow><mrow><mn>11</mn><mi mathvariant=\"italic\">R</mi></mrow></mfrac></msqrt></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634882767f18f5e6db", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "75", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "When a ceiling fan is switched off, its angular velocity falls to half while it makes&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>36</mn></math> rotations. How many rotations will it make before coming to rest?", "image": null}, "options": [{"id": "3fIhR", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>24</mn></math>", "image": null, "isCorrect": false}, {"id": "6wQga", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>36</mn></math>", "image": null, "isCorrect": false}, {"id": "ed2qh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>18</mn></math>", "image": null, "isCorrect": false}, {"id": "EEhpg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "From the third equation of angular motion,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">&#969;</mi><mn>2</mn></msup><mo>=</mo><msubsup><mi>&#969;</mi><mn>0</mn><mn>2</mn></msubsup><mo>-</mo><mn>2</mn><mi>&#945;&#952;</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#160;</mi><mo>(</mo><mi mathvariant=\"normal\">H</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">e</mi><mo>,</mo><mi mathvariant=\"normal\">&#969;</mi><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">&#969;</mi><mn>0</mn></msub><mn>2</mn></mfrac><mo>,</mo><mi mathvariant=\"normal\">&#952;</mi><mo>=</mo><mn>36</mn><mo>&#215;</mo><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi><mo>)</mo></math><br /><br /><math><mo>&#8756;</mo></math> <math><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><msub><mrow><mi>&#969;</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msubsup><mrow><mi>&#969;</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>-</mo><mn>2</mn><mi>&#945;</mi><mo>&#215;</mo><mn>36</mn><mo>&#215;</mo><mn>2</mn><mi>&#960;</mi></math><br /><br />or <math><mn>4</mn><mo>&#215;</mo><mn>36</mn><mi>&#960;</mi><mi>&#945;</mi><mo>=</mo><msubsup><mrow><mi>&#969;</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>-</mo><mfrac><mrow><msubsup><mrow><mi>&#969;</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>4</mn></mrow></mfrac></math><br /><br />or <math><mn>4</mn><mo>&#215;</mo><mn>36</mn><mi>&#960;</mi><mi>&#945;</mi><mo>=</mo><mfrac><mrow><mn>3</mn><msubsup><mrow><mi>&#969;</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>4</mn></mrow></mfrac></math><br /><br />or <math><mi>&#945;</mi><mo>=</mo><mfrac><mrow><msubsup><mrow><mi>&#969;</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>16</mn><mo>&#215;</mo><mn>12</mn><mi>&#960;</mi></mrow></mfrac></math> ...(i)<br /><br />According to question again applying the third equation of angular motion<br /><br /><math><msup><mrow><mi>&#969;</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msubsup><mrow><mi>&#969;</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>-</mo><mn>2</mn><mi>&#945;</mi><mi>&#952;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mo>(</mo><mi mathvariant=\"normal\">H</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">e</mi><mo>,</mo><mi>&#160;</mi><mi>&#969;</mi><mo>=</mo><mn>0</mn><mo>)</mo></math><br /><br /><math><mo>&#8756;</mo></math> <math><mn>0</mn><mo>=</mo><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><msub><mrow><mi>&#969;</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mo>&#215;</mo><mfrac><mrow><msubsup><mrow><mi mathvariant=\"normal\">&#969;</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>.</mo><mi mathvariant=\"normal\">&#952;</mi></mrow><mrow><mn>16</mn><mo>&#215;</mo><mn>12</mn><mi mathvariant=\"normal\">&#960;</mi></mrow></mfrac></math><br /><br />or <math><mi mathvariant=\"normal\">&#952;</mi><mo>=</mo><mn>24</mn><mi mathvariant=\"normal\">&#960;</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#952;</mi><mo>=</mo><mn>12</mn><mo>&#215;</mo><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi></math><br /><br />But <math><mn>2</mn><mi>&#960;</mi><mo>=</mo><mn>1</mn></math> cycle<br /><br />So, <math><mi mathvariant=\"normal\">&#952;</mi><mo>=</mo><mn>12</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">y</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">e</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863409ae221b1c0e1ca", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "83", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A rod&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math> of length&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math> and mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> is free to move on a frictionless horizontal surface. It is moving with a velocity&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math>, as shown in figure. End&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> of rod&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math> strikes the end of the wall. Assuming elastic impact, the angular velocity of the rod&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math>, just after impact, is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/0304476_ques.JPG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 170px; height: 74px;\" />", "image": null}, "options": [{"id": "hMAxF", "text": "<math><mfrac><mrow><mi>v</mi></mrow><mrow><mn>2</mn><mi>L</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "6xCoY", "text": "<math><mfrac><mrow><mn>3</mn><mi>v</mi></mrow><mrow><mi>L</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "u5a1h", "text": "<math><mfrac><mrow><mn>3</mn><mi>v</mi></mrow><mrow><mn>2</mn><mi>L</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "dHnXW", "text": "<math><mfrac><mrow><mi>v</mi></mrow><mrow><mi>L</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>From the conservation of angular&nbsp;momentum,</p><p><math><mo>⇒</mo><mi>M</mi><msub><mrow><mi>v</mi></mrow><mrow><mi>c</mi><mi>m</mi></mrow></msub><mfrac><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>M</mi><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>12</mn></mrow></mfrac><mi>ω</mi><mo>=</mo><mfrac><mrow><mi>M</mi><mi>v</mi><mi>L</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>⇒</mo><msub><mrow><mi>v</mi></mrow><mrow><mi>c</mi><mi>m</mi></mrow></msub><mo>+</mo><mfrac><mrow><mi>ω</mi><mi>L</mi></mrow><mrow><mn>6</mn></mrow></mfrac><mo>=</mo><mi>v</mi></math><br /><br />From the conservation of linear momentum,</p><p><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><mi>ω</mi><mi>L</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>-</mo><msub><mrow><mi>v</mi></mrow><mrow><mi>c</mi><mi>m</mi></mrow></msub><mo>=</mo><mi>v</mi><mo>⇒</mo><mi>ω</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>L</mi></mrow><mrow><mn>6</mn></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>2</mn><mi>v</mi></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>ω</mi><mo>=</mo><mfrac><mrow><mn>3</mn><mi>v</mi></mrow><mrow><msub><mrow><mi>L</mi></mrow></msub></mrow></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634053d9181a5e0976", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "65", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform thin rod&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math> of length&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math> and mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> is undergoing rotation about a fixed axis passing through end&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and perpendicular to the rod, such that end&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> remains stationary as shown. The kinetic energy of section&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AP</mi></math> of the rod is equal to the kinetic energy of section&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BP</mi></math> of the rod at an instant. Then what is the value of <math><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">B</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">p</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>3</mn></mrow></msup></math>?(<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AP</mi></math> are lengths of respective parts of the rod)<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image24-182ae1ac-674d-4960-989a-459b22f73dc9.jpg\" />", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "The KE of given section AP and PB will be equal if the moment of inertia of each section AP and section PB about A is same.<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image25-24a337f1-98dc-49f1-a4ba-06f1a65e5bd3.jpg\" /><br /><br />Moment of inertia of segment AP w.r.t given axis <math><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">λ</mi><mi mathvariant=\"normal\">x</mi></mrow></mfenced><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>3</mn></mrow></mfrac><mi mathvariant=\"normal\">&nbsp;</mi></math><br /><br />Moment of inertia of segment PB w.r.t given axis <math><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">λ</mi><mi mathvariant=\"normal\">L</mi></mrow></mfenced><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>3</mn></mrow></mfrac><mo>-</mo><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">λ</mi><mi mathvariant=\"normal\">x</mi></mrow></mfenced><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>3</mn></mrow></mfrac></math><br /><br />(Moment of inertia or rod AB w.r.t. given axis is <math><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>0</mn></mrow></msub></math> )<br /><br /><math><mo>∴</mo><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>⇒</mo><mfrac><mrow><mi mathvariant=\"normal\">λ</mi><msup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow><mrow><mn>3</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">λ</mi><msup><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow><mrow><mn>3</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">λ</mi><msup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow><mrow><mn>3</mn></mrow></mfrac></math><br /><br />Or <math><msup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>3</mn></mrow></msup><mo>=</mo><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><br /><math><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">B</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">P</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>3</mn></mrow></msup><mo>=</mo><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow><mrow><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfrac><mo>=</mo><mn>2</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86337b82dec1661aeb1", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "101", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform circular disc has radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> and mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>. A particle, also of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>, is fixed at a point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> on the edge of the disc as shown in the diagram. The disc can rotate freely about a fixed horizontal chord <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>PQ</mi></math> that is at a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac bevelled=\"true\"><mi>R</mi><mn>4</mn></mfrac></math> from the centre <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math> of the disc. The line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AC</mi></math> is perpendicular to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>PQ</mi></math>.<br />\rInitially, the disc is held vertical with point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> at its highest position. It is then allowed to fall so that it starts rotating about <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>PQ</mi></math>. Find the linear speed of the particle as it reaches its lowest position.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/dadsadsfd.JPG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 200px; height: 157px;\" />", "image": null}, "options": [{"id": "FQ9TC", "text": "<math><mrow><mo>-</mo>  <msqrt>    <mtext>2gR</mtext>  </msqrt></mrow></math>", "image": null, "isCorrect": false}, {"id": "dXq2g", "text": "<math><mrow>  <msqrt>    <mtext>3gR</mtext>  </msqrt></mrow></math>", "image": null, "isCorrect": false}, {"id": "apDl7", "text": "<math><mrow><mo>-</mo>  <msqrt>    <mtext>4gR</mtext>  </msqrt></mrow></math>", "image": null, "isCorrect": false}, {"id": "Eff3C", "text": "<math> <mrow> <msqrt> <mtext>5gR</mtext> </msqrt> </mrow> </math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "As moment of inertia of a disc about a diameter is <math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msup> <mtext>mR</mtext> <mn>2</mn> </msup> </mrow> </mfenced> <mtext>,</mtext> </mrow> </math> the moment of inertia of the disc about the chord PQ by &#39;theorem of parallel axes&#39; will be<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <msub> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>I</mtext> <mtext>D</mtext> </msub> </mrow> </mfenced> </mrow> <mtext>PQ</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> <msup> <mtext>mR</mtext> <mn>2</mn> </msup> <mo>+</mo> <mtext>m</mtext> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> <mo>=</mo> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mtext>16</mtext> </mrow> </mfrac> <msup> <mtext>mR</mtext> <mn>2</mn> </msup> </mrow> </math><br /><br />and as particle of mass m is at a distance [R + (R/4) = (5/4)R] from PQ, the moment of inertia of the system about PQ<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>I</mtext> <mo>=</mo> <msub> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>I</mtext> <mtext>D</mtext> </msub> </mrow> </mfenced> </mrow> <mtext>PQ</mtext> </msub> <mo>+</mo> <msub> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>I</mtext> <mtext>P</mtext> </msub> </mrow> </mfenced> </mrow> <mtext>PQ</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mtext>16</mtext> </mrow> </mfrac> <msup> <mtext>mR</mtext> <mn>2</mn> </msup> <mo>+</mo> <mtext>m</mtext> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> <mo>=</mo> <mfrac> <mrow> <mn>1</mn><mn>5</mn> </mrow> <mrow> <mn>8</mn> </mrow> </mfrac> <msup> <mtext>mR</mtext> <mn>2</mn> </msup> </mrow> </math><br /><br />Now if &omega;&nbsp;is the angular speed of the system when A reaches the lowest point A&#39; on rotation about the axis PQ, by &#39;conservation of mechanical energy&#39;,<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>I</mtext> <msup> <mtext>&omega;</mtext> <mn>2</mn> </msup> <mo>=</mo> <mtext>mg</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msup> <mtext>AA</mtext> <mo>&prime;</mo> </msup> </mrow> </mfenced> <mo>+</mo> <msup> <mtext>mgCC</mtext> <mo>&prime;</mo> </msup> <mo>=</mo> <mtext>mg</mtext> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mtext>2AD</mtext> <mo>+</mo> <mtext>2CD</mtext> </mrow> </mfenced> </mrow> </math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014144_AnsExp_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 300px; height: 147px;\" /><br /><br /><math> <mrow> <mtext>i.e.,</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>&times;</mo> <mfrac> <mrow> <mtext>15</mtext> </mrow> <mrow> <mn>8</mn> </mrow> </mfrac> <mtext>mR</mtext> <msup> <mspace></mspace> <mn>2</mn> </msup> <msup> <mtext>&omega;</mtext> <mn>2</mn> </msup> <mo>=</mo> <mn>2</mn> <mtext>mg</mtext> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>R</mtext> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </mfenced> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </mfenced> <mtext>,</mtext> </mrow> </math><br /><br /><math> <mrow> <mtext>i.e.,</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>&omega;</mtext> <mo>=</mo> <mn>4</mn> <msqrt> <mfrac> <mrow> <mtext>g</mtext> </mrow> <mrow> <mtext>5R</mtext> </mrow> </mfrac> </msqrt> </mrow> </math><br /><br /><math> <mrow> <mtext>so</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <msub> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>v</mtext> </mrow> </mfenced> </mrow> <msup> <mtext>A</mtext> <mo>&prime;</mo> </msup> </msub> <mo>=</mo> <mtext>r</mtext> <mtext>&omega;</mtext> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>R</mtext> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </mfenced> <mo>&times;</mo> <mn>4</mn> <msqrt> <mfrac> <mrow> <mtext>g</mtext> </mrow> <mrow> <mtext>5R</mtext> </mrow> </mfrac> </msqrt> <mo>=</mo> <msqrt> <mtext>5gR</mtext> </msqrt> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632de8ea66d179cc9e", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "44", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "One-fourth length of a uniform rod is placed on a rough horizontal surface and it starts rotating about the edge as soon as we release it. The rod starts slipping on the edge when it has turned through an angle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>θ</mi></math>.&nbsp;If the coefficient of friction between rod and surface is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>μ</mi></math>, and it satisfies the relation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mi>tan</mi><mi>θ</mi><mo>=</mo><mn>4</mn><mi>μ</mi></math>, then what is the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>? [Take <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mo>=</mo><mn>10</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mo>/</mo><msup><mi mathvariant=\"normal\">s</mi><mn>2</mn></msup></math>]<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image4-9b612ea3-7e0a-447e-b82d-5c9f863eb7a4.jpg\" />", "image": null}, "options": [], "correctValue": "13", "solution": {"text": "<math><mfrac><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"script\">l</mi></mrow><mrow><mn>4</mn></mrow></mfrac><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">I</mi><msup><mrow><mi mathvariant=\"normal\">ω</mi></mrow><mrow><mn>2</mn></mrow></msup></math> <br/><br/>         <math><mi mathvariant=\"normal\">α</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\"> </mi><mfrac><mrow><mi mathvariant=\"script\">l</mi></mrow><mrow><mn>4</mn></mrow></mfrac><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi><mi mathvariant=\"normal\"> </mi></mrow></mrow></mrow><mrow><mi mathvariant=\"normal\">I</mi></mrow></mfrac></math> <br/><br/>         <br/><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image5-6c2a0b2f-e957-4eb7-999b-68d5c73ef755.jpg\" /> <br/><br/>         <math><mi mathvariant=\"normal\">μ</mi><mi mathvariant=\"normal\">N</mi><mo>-</mo><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow><mo>=</mo><mi mathvariant=\"normal\">m</mi><msup><mrow><mi mathvariant=\"normal\">ω</mi></mrow><mrow><mn>2</mn></mrow></msup><mfrac><mrow><mi mathvariant=\"script\">l</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math> <br/><br/>         <math><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow><mo>-</mo><mi mathvariant=\"normal\">N</mi><mo>=</mo><mi mathvariant=\"normal\">m</mi><mfrac><mrow><mi mathvariant=\"script\">l</mi></mrow><mrow><mn>4</mn></mrow></mfrac><mi mathvariant=\"normal\">α</mi></math> <br/><br/>        Solving,<br/><br/>         <math><mn>13</mn><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi><mo>=</mo><mn>4</mn><mi mathvariant=\"normal\">μ</mi></mrow></mrow></math> .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632d78622bb5e46a45", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "12", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>Two beads each of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> are fixed on a&nbsp;light rigid rod&nbsp;of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>l</mi></math>&nbsp;which is&nbsp;free to rotate in a horizontal plane. The bead on the far end is given some velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math>&nbsp;as shown in the figure. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mi>cm</mi></msub></math>&nbsp;represents the kinetic energy of the centre of mass of the system and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mi mathvariant=\"normal\">R</mi></msub></math>&nbsp;represents the rotational kinetic energy of the system, then what is the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>K</mi><mi>cm</mi></msub><msub><mi>K</mi><mi mathvariant=\"normal\">R</mi></msub></mfrac></math>?</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/629276q.png\" style=\"width: 307px; height: 120px;\" /></p>\r", "image": null}, "options": [], "correctValue": "0.9", "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/629276s.png\" style=\"width: 308px; height: 169px;\" /></p><p>The distance of the centre of mass from the hinge,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>r</mi><mi>cm</mi></msub><mo>=</mo><mfrac><mrow><mi>m</mi><mi>l</mi><mo>+</mo><mi>m</mi><mo>(</mo><mn>2</mn><mi>l</mi><mo>)</mo></mrow><mrow><mi>m</mi><mo>+</mo><mi>m</mi></mrow></mfrac><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>l</mi></math></p><p>The angular velocity of the system,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ω</mi><mo>=</mo><mfrac><mi>v</mi><mrow><mn>2</mn><mi>l</mi></mrow></mfrac></math>&nbsp;</p><p>The velocity of the centre of mass of the system,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>cm</mi></msub><mo>=</mo><mfrac><mrow><mn>3</mn><mi>l</mi></mrow><mn>2</mn></mfrac><mi>ω</mi><mo>=</mo><mfrac><mn>3</mn><mn>4</mn></mfrac><mi>v</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msub><mi>K</mi><mi>cm</mi></msub><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mn>2</mn><mi>m</mi><msub><msup><mi>v</mi><mn>2</mn></msup><mi>cm</mi></msub><mo>=</mo><mfrac><mrow><mn>9</mn><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup></mrow><mn>16</mn></mfrac></math></p><p>The moment of inertia of the system about the hinge,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mi>m</mi><msup><mi>l</mi><mn>2</mn></msup><mo>+</mo><mi>m</mi><msup><mfenced><mrow><mn>2</mn><mi>l</mi></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>5</mn><mi>m</mi><msup><mi>l</mi><mn>2</mn></msup></math></p><p>The rotational kinetic energy of the system,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mi mathvariant=\"normal\">R</mi></msub><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>I</mi><msup><mi>ω</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mn>5</mn><mi>m</mi><msup><mi>l</mi><mn>2</mn></msup><msup><mfenced><mfrac><mi>v</mi><mrow><mn>2</mn><mi>l</mi></mrow></mfrac></mfenced><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msub><mi>K</mi><mi mathvariant=\"normal\">R</mi></msub><mo>=</mo><mfrac><mrow><mn>5</mn><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup></mrow><mn>8</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>K</mi><mi>cm</mi></msub><msub><mi>K</mi><mi mathvariant=\"normal\">R</mi></msub></mfrac><mo>=</mo><mfrac><mrow><mn>9</mn><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup></mrow><mn>16</mn></mfrac><mo>×</mo><mfrac><mn>8</mn><mrow><mn>5</mn><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mn>0</mn><mo>.</mo><mn>9</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632b696053b5280dea", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "34", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A small ball of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math> and radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">R</mi><mn>10</mn></mfrac></math> rolls without slipping along the track shown in the figure. The radius of circular part of the track is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math>. If the ball starts from rest at a height of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mi mathvariant=\"normal\">R</mi></math> above the bottom, the normal force on the ball at the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/29201_quedafdsfs.png\" style=\"width: 200px; height: 119px;\" />", "image": null}, "options": [{"id": "YBzCk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>100</mn><mn>3</mn></mfrac><mi>mg</mi></math>", "image": null, "isCorrect": false}, {"id": "ZxZvZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>100</mn><mn>9</mn></mfrac><mi>mg</mi></math>", "image": null, "isCorrect": true}, {"id": "uz5Vk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>200</mn><mn>9</mn></mfrac><mi>mg</mi></math>", "image": null, "isCorrect": false}, {"id": "yj8gD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>50</mn><mn>7</mn></mfrac><mi>mg</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Using Work-Energy Theorem</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mi>mgR</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mi>mv</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mrow><mfrac><mn>2</mn><mn>5</mn></mfrac><msup><mi>mr</mi><mn>2</mn></msup></mrow></mfenced><mo>&#215;</mo><msup><mi mathvariant=\"normal\">&#969;</mi><mn>2</mn></msup></math></p><p>since the sphere is rolling without slipping&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">v</mi><mo>=</mo><mi>r&#969;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mn>7</mn><mi>mgR</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mi mathvariant=\"normal\">&#160;</mi><mfenced separators=\"|\"><mrow><mfrac><mn>7</mn><mn>5</mn></mfrac><msup><mi>mr</mi><mn>2</mn></msup></mrow></mfenced><mo>&#215;</mo><mi mathvariant=\"normal\">&#160;</mi><mfrac><msup><mi mathvariant=\"normal\">v</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">r</mi><mn>2</mn></msup></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi mathvariant=\"normal\">v</mi><mn>2</mn></msup><mo>=</mo><mn>10</mn><mi>gR</mi></math></p><p>at point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math>, we can consider sphere as a point object doing circular motion in a circle of the radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">R</mi><mo>-</mo><mi mathvariant=\"normal\">r</mi><mo>)</mo></math>&nbsp;with velocity&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">v</mi></math>,</p><p>Hence at point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">N</mi><mo>=</mo><mfrac><msup><mi>mv</mi><mn>2</mn></msup><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">R</mi><mo>-</mo><mi mathvariant=\"normal\">r</mi></mrow></mfenced></mfrac><mo>=</mo><mfrac><mrow><mn>10</mn><mi>mgR</mi></mrow><mfenced><mrow><mi mathvariant=\"normal\">R</mi><mo>-</mo><mfrac><mi mathvariant=\"normal\">R</mi><mn>10</mn></mfrac></mrow></mfenced></mfrac><mo>=</mo><mfrac><mrow><mn>10</mn><mi>mgR</mi></mrow><mstyle displaystyle=\"true\"><mfrac><mrow><mn>9</mn><mi mathvariant=\"normal\">R</mi></mrow><mn>10</mn></mfrac></mstyle></mfrac></math>&nbsp; &nbsp;( given&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">R</mi><mn>10</mn></mfrac></math>&nbsp;)</p><p>or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">N</mi><mo>=</mo><mfrac><mn>100</mn><mn>9</mn></mfrac><mi>mg</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632ac735ab3be580ef", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "106", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "&nbsp;A rod of length&nbsp;<math><mrow><mi>l</mi><mo>⁡</mo> </mrow> </math> = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> is maintained to rotate with a constant angular velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ω</mi><mo>=</mo><msup><mtext>1 rad&nbsp;s</mtext><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>&nbsp;about a vertical axis passing through one end (diagram). There is a spring constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi><mo>=</mo><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> which just encloses rod inside it in natural length. One end of the spring is attached to the axis of rotation. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi></math> is a sleeve of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>=</mo><mn>1</mn><mo>&nbsp;</mo><mi>kg</mi></math> which can just fit on rod. All surfaces are smooth. With what minimum kinetic energy (in j) sleeve should be projected so that it enters on the rod without jerk and completely compresses the spring.<br />\r<br /><img alt=\"\" height=\"97\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0020990_Question_1.jpg\" style=\"max-width:100%; object-fit:contain\" width=\"238\" />", "image": null}, "options": [], "correctValue": "6", "solution": {"text": "For entering without jerk <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext>v</mtext><mn>2</mn></msub><mo>=</mo><mi>l</mi><mo>⁡</mo><msub><mi>ω</mi><mn>0</mn></msub><mo>=</mo><msup><mtext>2 m&nbsp;s</mtext><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br />Using work-energy theorem on the sleeve after entering in the frame of rod<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0020990_AnsExp_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 352px; height: 110px;\" /><br /><br /><math> <mrow> <msub> <mtext>W</mtext> <mtext>spring</mtext> </msub> <mo>+</mo> <msub> <mtext>W</mtext> <mtext>centrifugal</mtext> </msub> <mo>=</mo> <mo>Δ</mo> <mtext>K</mtext> </mrow> </math><br /><br /><math> <mrow> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>k</mtext> <msup> <mrow> <mi></mi><mi></mi><mi>l</mi><mo>⁡</mo> </mrow> <mn>2</mn> </msup> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>m</mtext> <msup> <mi>ω</mi> <mn>2</mn> </msup> <msup> <mrow> <mi></mi><mi></mi><mi>l</mi><mo>⁡</mo> </mrow> <mn>2</mn> </msup> <mo>=</mo> <mn>0</mn> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msubsup> <mtext>mv</mtext> <mn>1</mn> <mn>2</mn> </msubsup> </mrow> </math><br /><br /><math> <mrow> <mo>⇒&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</mo> <msubsup> <mtext>v</mtext> <mn>1</mn> <mn>2</mn> </msubsup> <mo>=</mo> <mn>8</mn> </mrow> </math><br /><br />Now, <math> <mrow> <mtext>K</mtext> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>m</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msubsup> <mtext>v</mtext> <mn>1</mn> <mn>2</mn> </msubsup> <mo>+</mo> <msubsup> <mtext>v</mtext> <mn>2</mn> <mn>2</mn> </msubsup> </mrow> </mfenced> <mo>=</mo> <mn>6</mn> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630c1b5e756acecab3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "38", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>The pulley system, shown in the figure, has two pulleys of radii&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>, respectively. If the acceleration of block <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math> in the downward direction, then the acceleration of block <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> will be<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-06-24_at_5.18.59_PM__1_.jpeg\" style=\"width: 150px; height: 207px;\" /></p>\r", "image": null}, "options": [{"id": "6exoI", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">m</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "bjjZO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">m</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "l55eo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">m</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "cn2Wm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>2</mn></mfrac><mo>&#xA0;</mo><mi mathvariant=\"normal\">m</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>a</mi><mi>A</mi></msub><mo>=</mo><mi>&#945;</mi><mo>&#215;</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>=</mo><mn>5</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#945;</mi><mo>=</mo><mfrac><mn>5</mn><mn>2</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math><br /><br />Hence, acceleration of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>a</mi><mi>B</mi></msub><mo>=</mo><mi>&#945;</mi><mo>&#215;</mo><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>=</mo><mfrac><mn>5</mn><mn>2</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "6aa3ab79aa8dc1ff6817809a", "title": "Angular Momentum and Angular Impulse", "totalQuestions": 18, "questions": [{"_id": "6151e863f76fb6f477d0fd6b", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "76", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A block of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>1</mn><mo>&nbsp;</mo><mi>kg</mi></math> is attached to a cord passing through a hole in a horizontal frictionless horizontal surface as shown in the figure. The block is originally revolving at a distance of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> from the hole, with an angular velocity of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi>rad</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> . The cord is then pulled from below, shortening the radius of the circle in which the block revolves to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>. Considering the block to be point mass, calculate the new angular velocity (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>rad</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>).<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image11-9496e010-9c35-44e4-8af3-2cfd481e0a06.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"height: 106px; width: 230px;\" />", "image": null}, "options": [], "correctValue": "8", "solution": {"text": "By conservation of angular momentum<br />&nbsp;<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>I</mi><mn>1</mn></msub><msub><mi>&#969;</mi><mn>1</mn></msub><mo>=</mo><msub><mi>I</mi><mn>2</mn></msub><msub><mi>&#969;</mi><mn>2</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>M</mi><msubsup><mi>R</mi><mn>1</mn><mn>2</mn></msubsup><msub><mi>&#969;</mi><mn>1</mn></msub><mo>=</mo><mi>M</mi><msubsup><mi>R</mi><mn>2</mn><mn>2</mn></msubsup><msub><mi>&#969;</mi><mn>2</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><msub><mi>&#969;</mi><mn>2</mn></msub><mo>=</mo><msup><mfenced separators=\"|\"><mfrac><msub><mi>R</mi><mn>1</mn></msub><msub><mi>R</mi><mn>2</mn></msub></mfrac></mfenced><mn>2</mn></msup><msub><mi>&#969;</mi><mn>1</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msup><mfenced separators=\"|\"><mfrac><mrow><mn>0</mn><mo>.4</mo></mrow><mrow><mn>0</mn><mo>.2</mo></mrow></mfrac></mfenced><mn>2</mn></msup><mo>&#215;</mo><mn>2</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>8</mn><mo>&#160;</mo><mi>rad</mi><mi mathvariant=\"normal\">&#160;</mi><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863eb49eebed56136b8", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "37", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A merry-go-round is at rest, pivoted on a frictionless axis. A child of mass&nbsp;<math><mi>m</mi> </math> runs along the path tangential to the rim with speed&nbsp;<math><mi>v</mi> </math> and jumps on to merry-go-round. If <math> <mi>R</mi> </math>is the radius of the merry-go-round and <math> <mi>I</mi> </math> is the moment of inertia, then the angular velocity of the merry-go-round and the child is", "image": null}, "options": [{"id": "BhkmZ", "text": "<math> <mrow> <mfrac> <mrow> <mi>m</mi><mi>v</mi><mi>R</mi></mrow> <mrow> <mi>m</mi><msup> <mi>R</mi> <mn>2</mn> </msup> <mo>+</mo><mi>I</mi></mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "0KnWX", "text": "<math> <mrow>  <mfrac>   <mrow>    <mi>m</mi><mi>v</mi><mi>R</mi></mrow>   <mi>I</mi>  </mfrac>  </mrow></math>", "image": null, "isCorrect": false}, {"id": "AfqO5", "text": "<math> <mrow>  <mfrac>   <mrow>    <mi>m</mi><msup>     <mi>R</mi>     <mn>2</mn>    </msup>    <mo>+</mo><mi>I</mi></mrow>   <mrow>    <mi>m</mi><mi>v</mi><mi>R</mi></mrow>  </mfrac>  </mrow></math>", "image": null, "isCorrect": false}, {"id": "LkNO5", "text": "<math> <mrow>  <mfrac>   <mi>I</mi>   <mrow>    <mi>m</mi><mi>v</mi><mi>R</mi></mrow>  </mfrac>  </mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "By law of conservation of angular momentum<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mtext mathvariant=\"italic\">mvR</mtext><mo mathvariant=\"italic\">=</mo><mfenced><msub><mtext mathvariant=\"italic\">I</mtext><mtext mathvariant=\"italic\">system</mtext></msub></mfenced><mtext mathvariant=\"italic\">&#969;</mtext></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mspace width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mtext mathvariant=\"italic\">mvR</mtext><mo mathvariant=\"italic\">=</mo><mfenced><mrow><mtext mathvariant=\"italic\">I</mtext><mo>+</mo><msup><mtext mathvariant=\"italic\">mR</mtext><mn mathvariant=\"italic\">2</mn></msup></mrow></mfenced><mtext mathvariant=\"italic\">&#969;</mtext></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mspace mathvariant=\"italic\" width=\"0.5em\"/><mtext mathvariant=\"italic\">&#969;</mtext><mo mathvariant=\"italic\">=</mo><mfrac><mtext mathvariant=\"italic\">mvR</mtext><mrow><mtext mathvariant=\"italic\">I</mtext><mo>+</mo><msup><mtext mathvariant=\"italic\">mR</mtext><mn mathvariant=\"italic\">2</mn></msup></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e8416bea6e3ab501", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "68", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A ballet dancer is rotating about his own vertical axis on smooth horizontal floor with a time period 0.5 sec. The dancer folds himself close to his axis of rotation due to which his radius of gyration decreases by 20%, then his time period is", "image": null}, "options": [{"id": "5du7W", "text": "0.1 sec", "image": null, "isCorrect": false}, {"id": "w6nyN", "text": "0.25 sec", "image": null, "isCorrect": false}, {"id": "mc028", "text": "0.32 sec", "image": null, "isCorrect": true}, {"id": "r5HBM", "text": "0.4 sec", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">ω</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">ω</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br /><math><mi mathvariant=\"normal\">M</mi><msubsup><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">π</mi></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mi mathvariant=\"normal\">M</mi><msubsup><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">π</mi></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math><br><br><math> <mrow>  <mfrac>   <mrow>    <msub>     <mi>T</mi>     <mn>2</mn>    </msub>       </mrow>   <mrow>    <msub>     <mi>T</mi>     <mn>1</mn>    </msub>       </mrow>  </mfrac>  <mo>=</mo><msup>   <mrow>    <mrow><mo>(</mo>     <mrow>      <mfrac>       <mrow>        <msub>         <mi>K</mi>         <mn>2</mn>        </msub>               </mrow>       <mrow>        <msub>         <mi>K</mi>         <mn>1</mn>        </msub>               </mrow>      </mfrac>           </mrow>    <mo>)</mo></mrow>   </mrow>   <mn>2</mn>  </msup>   </mrow></math><br><br>T<sub>2</sub> = 0.64 × 0.5 <br><br>= 0.32 sec", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863dc2250c5c28f3811", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "54", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A small particle of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math> and its retaining cord is spinning with angular velocity <math><mi>ω</mi></math> on the horizontal surface of a smooth disc. As force&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">F</mi></math> is slightly relaxed,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi></math> increases and <math><mi>ω</mi></math> changes. Determine the rate of change of <math><mi>ω</mi></math> with respect to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi></math><br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-07-11_at_1.27.26_PM.jpeg\" style=\"width: 180px; height: 215px;\" />", "image": null}, "options": [{"id": "QhYbH", "text": "<math><mo>+</mo><mfrac><mrow><mi>ω</mi></mrow><mrow><mi>r</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "RBSaL", "text": "<math><mo>-</mo><mfrac><mrow><mi>ω</mi></mrow><mrow><mi>r</mi></mrow></mfrac><mi> </mi></math>", "image": null, "isCorrect": false}, {"id": "rvPUm", "text": "<math><mo>-</mo><mfrac><mrow><mn>2</mn><mi>ω</mi></mrow><mrow><mi>r</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "fntcJ", "text": "<math><mo>+</mo><mfrac><mrow><mn>2</mn><mi>ω</mi></mrow><mrow><mi>r</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "During the motion of the object, there is only one force tension which is acting towards a fixed point (centre of the table - disc). So that motion is under the effect to central force and thus, angular momentum will be conserved. At any radial distance,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">L</mi><mo>=</mo><msup><mi>m&#969;r</mi><mn>2</mn></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>dL</mi><mi>dr</mi></mfrac><mo>=</mo><msup><mi>mr</mi><mn>2</mn></msup><mfrac><mi>d&#969;</mi><mi>dr</mi></mfrac><mo>+</mo><mi>m&#969;</mi><mfenced separators=\"|\"><mrow><mn>2</mn><mi mathvariant=\"normal\">r</mi></mrow></mfenced><mo>=</mo><mn>0</mn></math><br /><br />So, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>d&#969;</mi><mi>dr</mi></mfrac><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mo>-</mo><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">&#969;</mi></mrow><mi mathvariant=\"normal\">r</mi></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ca428073e20654a4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "74", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform ring is rotating about the vertical axis with angular velocity&nbsp;<math><mrow><mi>ω&nbsp;</mi></mrow></math>initially. A point insect (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi></math>) having the same mass as that of the ring starts walking from the lowest point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">P</mi><mn>1</mn></msub></math>&nbsp;and finally reaches the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">P</mi><mn>2</mn></msub></math>&nbsp;(as shown in the figure). The final angular velocity of the ring is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0028180_Question.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 123px; height: 152px;\" />", "image": null}, "options": [{"id": "wgyQe", "text": "<math><mrow>  <mi>&omega;</mi>  <mo>/</mo>  <mn>4</mn></mrow></math>", "image": null, "isCorrect": false}, {"id": "y8C1n", "text": "<math><mrow>  <mi>&omega;</mi></mrow></math>", "image": null, "isCorrect": false}, {"id": "lAwQ6", "text": "<math><mrow>  <mi>&omega;</mi>  <mo>/</mo>  <mn>2</mn></mrow></math>", "image": null, "isCorrect": false}, {"id": "OycGw", "text": "<math> <mrow> <mi>ω</mi> <mo>/</mo> <mn>3</mn> </mrow> </math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "From the conservation of angular momentum<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup></mrow></mfenced><mi>&#969;</mi><mo>=</mo><mfenced><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mtext mathvariant=\"italic\">MR</mtext><mn>2</mn></msup><mo>+</mo><msup><mtext mathvariant=\"italic\">MR</mtext><mn>2</mn></msup></mrow></mfenced><mi>&#969;
