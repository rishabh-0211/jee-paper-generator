ariant=\"normal\">α</mi></mrow></mrow></mrow></mfenced><mi mathvariant=\"normal\">f</mi></math>&nbsp;<br /><br /><math><mo>∴</mo><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi><mo>=</mo></mrow></mrow><mfrac><mrow><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">α</mi></mrow></mrow></mrow><mrow><mn>2</mn><mo>-</mo><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">α</mi></mrow></mrow></mrow></mfrac><mo>⇒</mo><mi mathvariant=\"normal\">α</mi><mo>=</mo><msup><mrow><mn>60</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863479c4278c517484e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "24", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A spool of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi></math> and radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">R</mi></math> lies on an inclined plane as shown in figure. A light thread is wound around the connecting tube of the spool and its free end carries a weight of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math>. The value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math> so that system is in equilibrium is<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029831_Ans.jpg\" style=\"width: 224px; height: 145px;\" />", "image": null}, "options": [{"id": "8kQzu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>Msinα</mi></math>", "image": null, "isCorrect": true}, {"id": "Lfe3Y", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn></mn><mi>Msinα</mi></math>", "image": null, "isCorrect": false}, {"id": "4ScB5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>Mtanα</mi></math>", "image": null, "isCorrect": false}, {"id": "x4va9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn></mn><mi>Mcosα</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Equilibrium of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math> give</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>=</mo><mi>mg</mi></math>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;(<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi></math>&nbsp;= Tension in string)<br /><br />Net torque about point of contact of the spool should be<br />zero. Hence,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>2</mn><mi mathvariant=\"normal\">R</mi><mo>)</mo><mo>(</mo><mi>Mgsinα</mi><mo>)</mo><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mi>TR</mi></math><br /><br />or&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>Mgsinα</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mi>mg</mi></math><br /><br />or&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>2</mn><mi>Msinα</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632de8ea66d179cc9e", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "44", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "One-fourth length of a uniform rod is placed on a rough horizontal surface and it starts rotating about the edge as soon as we release it. The rod starts slipping on the edge when it has turned through an angle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>θ</mi></math>.&nbsp;If the coefficient of friction between rod and surface is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>μ</mi></math>, and it satisfies the relation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mi>tan</mi><mi>θ</mi><mo>=</mo><mn>4</mn><mi>μ</mi></math>, then what is the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>? [Take <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mo>=</mo><mn>10</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mo>/</mo><msup><mi mathvariant=\"normal\">s</mi><mn>2</mn></msup></math>]<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image4-9b612ea3-7e0a-447e-b82d-5c9f863eb7a4.jpg\" />", "image": null}, "options": [], "correctValue": "13", "solution": {"text": "<math><mfrac><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"script\">l</mi></mrow><mrow><mn>4</mn></mrow></mfrac><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">I</mi><msup><mrow><mi mathvariant=\"normal\">ω</mi></mrow><mrow><mn>2</mn></mrow></msup></math> <br/><br/>         <math><mi mathvariant=\"normal\">α</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\"> </mi><mfrac><mrow><mi mathvariant=\"script\">l</mi></mrow><mrow><mn>4</mn></mrow></mfrac><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi><mi mathvariant=\"normal\"> </mi></mrow></mrow></mrow><mrow><mi mathvariant=\"normal\">I</mi></mrow></mfrac></math> <br/><br/>         <br/><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image5-6c2a0b2f-e957-4eb7-999b-68d5c73ef755.jpg\" /> <br/><br/>         <math><mi mathvariant=\"normal\">μ</mi><mi mathvariant=\"normal\">N</mi><mo>-</mo><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow><mo>=</mo><mi mathvariant=\"normal\">m</mi><msup><mrow><mi mathvariant=\"normal\">ω</mi></mrow><mrow><mn>2</mn></mrow></msup><mfrac><mrow><mi mathvariant=\"script\">l</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math> <br/><br/>         <math><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow><mo>-</mo><mi mathvariant=\"normal\">N</mi><mo>=</mo><mi mathvariant=\"normal\">m</mi><mfrac><mrow><mi mathvariant=\"script\">l</mi></mrow><mrow><mn>4</mn></mrow></mfrac><mi mathvariant=\"normal\">α</mi></math> <br/><br/>        Solving,<br/><br/>         <math><mn>13</mn><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi><mo>=</mo><mn>4</mn><mi mathvariant=\"normal\">μ</mi></mrow></mrow></math> .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632a3cb900007942ee", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "79", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform solid sphere of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi></math> and radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> is lying on a rough horizontal plane. A constant force <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><mn>4&nbsp;</mn><mi>M</mi><mi>g</mi></math> acts vertically downwards at point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> such that the line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>OP</mi></math> makes an angle of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>°</mo></math> with the horizontal as shown in the figure. The minimum value of the coefficient of friction <math><mi>μ</mi></math> so that sphere performs pure rolling, is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-08-05_at_2.22.18_PM.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 200px; height: 163px;\" />", "image": null}, "options": [{"id": "mfmBw", "text": "<math><mfrac><mn>3</mn><mn>7</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "nZe3P", "text": "<math><mfrac><mn>4</mn><mn>7</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "ebFET", "text": "<math><mfrac><mn>2</mn><mn>7</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "XTklF", "text": "<math><mfrac><mn>2</mn><mn>5</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-08-05_at_2.27.23_PM.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 180px; height: 208px;\" /></p><p>Writing torque about the bottommost point,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi>M</mi><mi>g</mi><mo>×</mo><mfrac><mi>R</mi><mn>2</mn></mfrac><mo>=</mo><mfrac><mn>7</mn><mn>5</mn></mfrac><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup><mfrac><mi>a</mi><mi>R</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>a</mi><mo>=</mo><mfrac><mrow><mn>10</mn><mi>g</mi></mrow><mn>7</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mo>=</mo><mi>μ</mi><mfenced><mrow><mn>5</mn><mi>M</mi><mi>g</mi></mrow></mfenced><mo>=</mo><mi>M</mi><mi>a</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mi>μ</mi><mi>g</mi><mo>=</mo><mfrac><mrow><mn>10</mn><mi>g</mi></mrow><mn>7</mn></mfrac><mspace linebreak=\"newline\"></mspace><mo>⇒</mo><mi>μ</mi><mo>=</mo><mfrac><mn>2</mn><mn>7</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86328acc6c4eebb9d75", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "10", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform cubical box of side <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math>&nbsp;is placed&nbsp;on a rough floor and it is to be moved by applying minimum possible force <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi></math> at a point which is at a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>b</mi></math>&nbsp;above its centre of mass. If the coefficient of friction is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#956;</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>4</mn><mo>,</mo></math>&nbsp;then what is the maximum possible value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&#215;</mo><mfrac><mi>b</mi><mi>a</mi></mfrac></math> for which the box will not topple before moving?\r<p>&nbsp;</p>\r", "image": null}, "options": [], "correctValue": "50.00", "solution": {"text": "<p>For no toppling&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mfenced><mrow><mfrac><mi>a</mi><mn>2</mn></mfrac><mo>+</mo><mi>b</mi></mrow></mfenced><mo>≤</mo><mi>m</mi><mi>g</mi><mfrac><mi>a</mi><mn>2</mn></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>μ</mi><mfrac><mi>a</mi><mn>2</mn></mfrac><mo>+</mo><mi>μ</mi><mi>b</mi><mo>≤</mo><mfrac><mi>a</mi><mn>2</mn></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>0</mn><mo>.</mo><mn>2</mn><mi>a</mi><mo>+</mo><mn>0</mn><mo>.</mo><mn>4</mn><mi>b</mi><mo>≤</mo><mn>0</mn><mo>.</mo><mn>5</mn><mi>a</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mo>&nbsp;</mo><mn>0</mn><mo>.</mo><mn>4</mn><mi>b</mi><mo>≤</mo><mn>0</mn><mo>.</mo><mn>3</mn><mi>a</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mo>&nbsp;</mo><mi>b</mi><mo>≤</mo><mfrac><mrow><mn>3</mn><mi>a</mi></mrow><mn>4</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mo>&nbsp;</mo><mi>b</mi><mo>≤</mo><mn>0</mn><mo>.</mo><mn>75</mn><mi>a</mi></math></p><p>(in limiting case )</p><p>But it is not possible as maximum value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>b</mi></math> can be equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>5</mn><mi>a</mi></math> only</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mo>&nbsp;&nbsp;</mo><msub><mfenced><mrow><mn>100</mn><mfrac><mi mathvariant=\"normal\">b</mi><mi mathvariant=\"normal\">a</mi></mfrac></mrow></mfenced><mi>max</mi></msub><mo>=</mo><mn>50</mn><mo>.</mo><mn>00</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86321a0c15b6bc76f4f", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "26", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A metre stick is balanced on a knife-edge at its centre. When two coins, each of mass 5 g are put one on top of the other at the 12 cm mark, the stick is found to be balanced at 45.0 cm. What is the mass (in gram) of the metre stick?", "image": null}, "options": [], "correctValue": "66", "solution": {"text": "Let total mass of the metre stick be M gram<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0015780_AnsExp_1_1.jpg\" style=\"width: 329px; height: 122px;\" /><br /><br />Distance between mid-point E and new centre of gravity (DE),<br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; = 50 - 45 = 5 cm<br /><br />Distance between 12 cm mark and new centre of gravity (CD),<br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; = 45 - 12 = 33 cm<br /><br />From principle of moments in equilibrium,<br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;Mg × DE = (2 × 5g) × CD<br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;M × 5 = 10 × 33<br />​<br />or &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;M = 66 g<br /><br />∴ &nbsp;Mass of the metre stick is 66 g.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863199cda0577bd5675", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "51", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two uniform rods of equal length but different masses are rigidly joint to form an L-shaped body, which is then pivoted as shown. If in equilibrium, the body is in the shown configuration, ratio <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac bevelled=\"true\"><mi>M</mi><mi>m</mi></mfrac></math> will be<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029888_Question.jpg\" style=\"width: 220px; height: 170px;\" />", "image": null}, "options": [{"id": "WTK3d", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "utXai", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>", "image": null, "isCorrect": false}, {"id": "W281b", "text": "<math> <mrow> <msqrt> <mn>2</mn> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "937hy", "text": "<math> <mrow> <msqrt> <mn>3</mn> </msqrt> </mrow> </math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Net torque about O should be zero. Hence<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>mg</mtext><mspace width=\"0.5em\"></mspace><mfenced><mrow><mfrac><mtext>l</mtext><mn>2</mn></mfrac><mtext>sin&nbsp;60°</mtext></mrow></mfenced><mo>=</mo><mtext>Mg</mtext><mfenced><mrow><mfrac><mtext>l</mtext><mn>2</mn></mfrac><mtext>sin&nbsp;30°</mtext></mrow></mfenced></math><br /><br />∴&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mtext>M</mtext><mtext>m</mtext></mfrac><mo>=</mo><mfrac><mrow><mtext>sin&nbsp;60°</mtext><mspace width=\"0.5em\"></mspace></mrow><mtext>sin&nbsp;30°</mtext></mfrac><mo>=</mo><msqrt><mn>3</mn></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630e87280f3f1c8536", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "36", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform rod <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math>&nbsp;of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi>kg</mi></math> and length&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> is placed on a sharp support <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">O</mi></math>, such that <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AO</mi><mo>=</mo><mi>a</mi><mo>=</mo><mn>25</mn><mo>&nbsp;</mo><mi>cm</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>OB</mi><mo>=</mo><mi>b</mi><mo>=</mo><mn>75</mn><mo>&nbsp;</mo><mi>cm</mi></math>. A spring of force constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>600</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>&nbsp;is&nbsp;attached to the end <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>,&nbsp;as shown. Initially, the spring is extended by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi>cm</mi></math> at equilibrium. As soon as the thread is burnt, find the normal force (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">N</mi></math>) exerted by the support at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">O</mi></math>.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/636847_que.JPG\" style=\"width: 250px; height: 102px;\" /><br />\r&nbsp;", "image": null}, "options": [], "correctValue": "8", "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi></math>&nbsp;about <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">O</mi></math>&nbsp;is <math><mfrac><mrow><mi>m</mi><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>12</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>m</mi><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>16</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>7</mn><mi>m</mi><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>48</mn></mrow></mfrac></math><br /><br />Spring force&nbsp;&nbsp; <math><mo>⇒</mo><mi>K</mi><mi mathvariant=\"normal\">Δ</mi><mi>x</mi><mo>=</mo><mn>600</mn><mo>×</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>100</mn></mrow></mfrac><mo>=</mo><mn>12</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">N</mi></math><br /><br />Torque, just after burning the string,<br /><br /><math><mi>τ</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>2</mn><mo>×</mo><mn>10</mn><mo>×</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac></mrow></mfenced><mo>+</mo><mn>12</mn><mo>×</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>&nbsp;</mi><mi>τ</mi><mo>=</mo><mi>&nbsp;</mi><mn>5</mn><mi>&nbsp;</mi><mo>+</mo><mi>&nbsp;</mi><mn>9</mn><mi>&nbsp;</mi><mo>=</mo><mi>&nbsp;</mi><mn>14</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mi>α</mi><mo>=</mo><mfrac><mrow><mn>14</mn><mo>×</mo><mn>48</mn></mrow><mrow><mn>7</mn><mo>×</mo><mn>2</mn><mo>×</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mn>48</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi>rad</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math><br /><br /><math><mo>∴</mo></math> Acceleration of COM,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mn>48</mn><mo>×</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>=</mo><mn>12</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math><br /><br />Now, total vertical force<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mi>&nbsp;</mi><mo>+</mo><mi>&nbsp;</mi><mn>20</mn><mi>&nbsp;</mi><mo>–</mo><mi>&nbsp;</mi><mi>N</mi><mi>&nbsp;</mi><mo>=</mo><mi>&nbsp;</mi><mn>2</mn><mi>&nbsp;</mi><mo>×</mo><mi>&nbsp;</mi><mn>12</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>N</mi><mi>&nbsp;</mi><mo>=</mo><mi>&nbsp;</mi><mn>32</mn><mi>&nbsp;</mi><mo>–</mo><mi>&nbsp;</mi><mn>24</mn><mi>&nbsp;</mi><mo>=</mo><mi>&nbsp;</mi><mn>8</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">N</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863082589c0d9583e8c", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "41", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A thin uniform equilateral plate rests in a vertical plane with one of its vertex&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> on a rough horizontal floor and another vertex&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&nbsp;on a smooth vertical wall. If the coefficient of friction <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>μ</mi><mo>=</mo><mfrac><mn>1</mn><msqrt><mn>3</mn></msqrt></mfrac></math>, then the least angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>θ</mi></math> its base&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math> can make with the horizontal surface is</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-06-28_at_4.29.00_PM.jpeg\" style=\"width: 200px; height: 175px;\" /></p>\r", "image": null}, "options": [{"id": "Kr3at", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#x3B8;</mi><mo>=</mo><msup><mi>cot</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced open=\"[\" close=\"]\"><mrow><mi mathvariant=\"normal\">&#x3BC;</mi><mo>+</mo><mfrac><mn>1</mn><msqrt><mn>3</mn></msqrt></mfrac></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "LI1pz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#x3B8;</mi><mo>=</mo><msup><mi>tan</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced open=\"[\" close=\"]\"><mrow><mi mathvariant=\"normal\">&#x3BC;</mi><mo>+</mo><mfrac><mn>1</mn><msqrt><mn>3</mn></msqrt></mfrac></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "rdFqK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#x3B8;</mi><mo>=</mo><msup><mi>tan</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced open=\"[\" close=\"]\"><mrow><mn>2</mn><mi mathvariant=\"normal\">&#x3BC;</mi><mo>+</mo><mfrac><mn>1</mn><msqrt><mn>3</mn></msqrt></mfrac></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "Sv0xS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>θ</mi><mo>=</mo><msup><mi>cot</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced close=\"]\" open=\"[\"><mrow><mn>2</mn><mi mathvariant=\"normal\">μ</mi><mo>+</mo><mfrac><mn>1</mn><msqrt><mn>3</mn></msqrt></mfrac></mrow></mfenced></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-06-28_at_2.29.32_PM.jpeg\" style=\"width: 200px; height: 207px;\" /></p><p>Let us assume that the side-length of the triangle is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math>, then</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi><mo>=</mo><mfrac><mi>a</mi><msqrt><mn>3</mn></msqrt></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>N</mi><mn>1</mn></msub><mo>=</mo><mi>M</mi><mi>g</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>f</mi><mn>1</mn></msub><mo>=</mo><mi>μ</mi><msub><mi>N</mi><mn>1</mn></msub><mo>=</mo><msub><mi>N</mi><mn>2</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>N</mi><mn>2</mn></msub><mo>=</mo><mi>μ</mi><mi>M</mi><mi>g</mi></math></p><p>Balancing the torque about point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><mi>g</mi><mo>×</mo><mi>l</mi><mi>cos</mi><mfenced separators=\"|\"><mrow><mn>30</mn><mo>°</mo><mo>+</mo><mi>θ</mi></mrow></mfenced><mo>-</mo><msub><mi>N</mi><mn>2</mn></msub><mo>×</mo><mi>a</mi><mi>sin</mi><mi>θ</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>M</mi><mi>g</mi><mo>×</mo><mfrac><mi>a</mi><msqrt><mn>3</mn></msqrt></mfrac><mi>cos</mi><mfenced separators=\"|\"><mrow><mn>30</mn><mo>°</mo><mo>+</mo><mi>θ</mi></mrow></mfenced><mo>-</mo><mi>μ</mi><mi>M</mi><mi>g</mi><mo>×</mo><mi>a</mi><mi>sin</mi><mi>θ</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msqrt><mn>3</mn></msqrt></mfrac><mfenced><mrow><mfrac><msqrt><mn>3</mn></msqrt><mn>2</mn></mfrac><mi>cos</mi><mi>θ</mi><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>sin</mi><mi>θ</mi></mrow></mfenced><mo>=</mo><mi>μ</mi><mi>sin</mi><mi>θ</mi></math></p><p>On solving further we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>θ</mi><mo>=</mo><msup><mi>cot</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced close=\"]\" open=\"[\"><mrow><mn>2</mn><mi mathvariant=\"normal\">μ</mi><mo>+</mo><mfrac><mn>1</mn><msqrt><mn>3</mn></msqrt></mfrac></mrow></mfenced></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "6aa3ab79aa8dc1ff6817809f", "title": "Rotational Kinematics", "totalQuestions": 37, "questions": [{"_id": "6151e863f416b22c5ef142f4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "67", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A pendulum is oscillating with an angular amplitude of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>90</mn><mo>°</mo></math> as shown in the figure. The value of angle&nbsp;<math><mi mathvariant=\"normal\">α</mi></math>, made by the string with the vertical, at which the acceleration is directed horizontally is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/132398_1.jpg\" style=\"width: 150px; height: 162px;\" />", "image": null}, "options": [{"id": "GgofK", "text": "0", "image": null, "isCorrect": false}, {"id": "acOE3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>90</mn><mo>&#176;</mo></math>", "image": null, "isCorrect": false}, {"id": "cMaeZ", "text": "<math><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></mrow></mfenced></mrow></mrow></math>", "image": null, "isCorrect": true}, {"id": "x3Dxe", "text": "<math><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></mrow></mfenced></mrow></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For horizontal acceleration, net force in vertical direction should be zero.<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/1354_mvb.PNG\" style=\"width: 162px; height: 158px;\" /><br /><br />Loss in potential energy = gain in kinetic energy<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mi>g</mi><mi>h</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mi>g</mi><mi>l</mi><mi>cos</mi><mo>&#8289;</mo><mi mathvariant=\"normal\">&#945;</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mi>v</mi><mo>=</mo><msqrt><mn>2</mn><mi>g</mi><mi>l</mi><mi>cos</mi><mo>&#8289;</mo><mi mathvariant=\"normal\">&#945;</mi></msqrt></math><br /><br /><math><mo>&#8757;</mo></math> The net force towards O is<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>-</mo><mi>m</mi><mi>g</mi><mi>cos</mi><mo>&#8289;</mo><mi mathvariant=\"normal\">&#945;</mi><mo>=</mo><mfrac><mrow><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup></mrow><mi>l</mi></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mi>m</mi><mn>2</mn><mi>g</mi><mi>l</mi><mi>cos</mi><mo>&#8289;</mo><mi mathvariant=\"normal\">&#945;</mi><mi mathvariant=\"normal\">&#160;</mi></mrow><mi>l</mi></mfrac><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#160;</mi><mi>m</mi><mi>g</mi><mi>cos</mi><mo>&#8289;</mo><mi mathvariant=\"normal\">&#945;</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>T</mi><mo>=</mo><mn>3</mn><mi>m</mi><mi>g</mi><mi>cos</mi><mo>&#8289;</mo><mi mathvariant=\"normal\">&#945;</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>T</mi><mi>cos</mi><mo>&#8289;</mo><mi mathvariant=\"normal\">&#945;</mi><mo>=</mo><mi>m</mi><mi>g</mi></math><br /><br />Or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>m</mi><mi>g</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><msup><mi mathvariant=\"normal\">s</mi><mn>2</mn></msup><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#945;</mi><mo>=</mo><mi>m</mi><mi>g</mi></math><br /><br /><math><mo>&#8756;</mo><mi mathvariant=\"normal\">&#945;</mi><mo>=</mo><msup><mrow><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></mrow></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863efe11c7e389b799d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "22", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the diagram shown, a rod of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi></math> has been fixed on a ring of the same mass. The whole system has been placed on a perfectly rough surface. The system is gently displaced so that the ring starts rolling. The velocity of the centre of the ring when the rod becomes horizontal is (the length of the rod is equal to the radius of the ring)<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/0136254-2.JPG\" style=\"width: 250px; height: 270px;\" />", "image": null}, "options": [{"id": "SONMt", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mrow><mn>3</mn><mi>gR</mi></mrow><mn>10</mn></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "YnEpC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mrow><mn>5</mn><mi>gR</mi></mrow><mn>3</mn></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "Vb9M8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mrow><mn>3</mn><mi>gR</mi></mrow><mn>7</mn></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "uI5aq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mrow><mn>2</mn><mi>gR</mi></mrow><mn>9</mn></mfrac></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image8-d834afc6-b062-4a57-a208-48014071d2a2.jpg\" /></p><br />The moment of inertia of the system about instantaneous axis of rotation is given by,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi><mo>=</mo><msub><mi mathvariant=\"normal\">I</mi><mi>ring</mi></msub><mo>+</mo><msub><mi mathvariant=\"normal\">I</mi><mi>rod</mi></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">I</mi><mo>=</mo><mo>(</mo><msup><mi>MR</mi><mn>2</mn></msup><mo>+</mo><msup><mi>MR</mi><mn>2</mn></msup><mo>)</mo><mo>+</mo><mfenced><mrow><mfrac><mn>1</mn><mn>12</mn></mfrac><msup><mi>MR</mi><mn>2</mn></msup><mo>+</mo><msubsup><mi>MR</mi><mn>1</mn><mn>2</mn></msubsup></mrow></mfenced></math>&nbsp; &nbsp; &nbsp; &nbsp;(From parallel axis theorem)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">I</mi><mo>=</mo><mn>2</mn><msup><mi>MR</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><mn>12</mn></mfrac><msup><mi>MR</mi><mn>2</mn></msup><mo>+</mo><mi mathvariant=\"normal\">M</mi><msup><mfenced><mfrac><mrow><msqrt><mn>5</mn></msqrt><mi mathvariant=\"normal\">R</mi></mrow><mn>2</mn></mfrac></mfenced><mn>2</mn></msup></math>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>&#8757;</mo><msub><mi mathvariant=\"normal\">R</mi><mn>1</mn></msub><mo>=</mo><msqrt><msup><mi mathvariant=\"normal\">R</mi><mn>2</mn></msup><mo>+</mo><msup><mfenced><mfrac><mi mathvariant=\"normal\">R</mi><mn>2</mn></mfrac></mfenced><mn>2</mn></msup></msqrt><mo>=</mo><mfrac><mrow><msqrt><mn>5</mn></msqrt><mi mathvariant=\"normal\">R</mi></mrow><mn>2</mn></mfrac></mrow></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">I</mi><mo>=</mo><mn>2</mn><msup><mi>MR</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><mn>12</mn></mfrac><msup><mi>MR</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>5</mn><mn>4</mn></mfrac><msup><mi>MR</mi><mn>2</mn></msup><mo>=</mo><mn>2</mn><msup><mi>MR</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><msup><mi>MR</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>10</mn><mn>3</mn></mfrac><msup><mi>MR</mi><mn>2</mn></msup></math><br /><br />Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">I</mi><mi>system</mi></msub><mo>=</mo><mfrac><mn>10</mn><mn>3</mn></mfrac><msup><mi>MR</mi><mn>2</mn></msup></math>.<br /><br /><br />Now from work - energy theorem, we get,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Mg</mi><mfrac><mi mathvariant=\"normal\">R</mi><mn>2</mn></mfrac><mo>=</mo></math>Rotational kinetic energy of the system about instantaneous axis of rotation<br />(here&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">R</mi><mn>2</mn></mfrac></math>&nbsp;is the distance through which the center of mass of the rod descends)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>Mg</mi><mfrac><mi mathvariant=\"normal\">R</mi><mn>2</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi mathvariant=\"normal\">&#160;</mi><msub><mi mathvariant=\"normal\">I</mi><mi>system</mi></msub><mi mathvariant=\"normal\">&#160;</mi><msup><mi mathvariant=\"normal\">&#969;</mi><mn>2</mn></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>Mg</mi><mfrac><mi mathvariant=\"normal\">R</mi><mn>2</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mfrac><mn>10</mn><mn>3</mn></mfrac><msup><mi>MR</mi><mn>2</mn></msup><mo>&#215;</mo><msup><mi mathvariant=\"normal\">&#969;</mi><mn>2</mn></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">&#969;</mi><mo>=</mo><msqrt><mfrac><mrow><mn>3</mn><mi mathvariant=\"normal\">g</mi></mrow><mrow><mn>10</mn><mi mathvariant=\"normal\">R</mi></mrow></mfrac></msqrt></math><br /><br /><br />Now velocity of center of mass is given as,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">v</mi><mo>=</mo><mi>R&#969;</mi></math>.<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">v</mi><mo>=</mo><mi mathvariant=\"normal\">R</mi><mo>&#215;</mo><msqrt><mfrac><mrow><mn>3</mn><mi mathvariant=\"normal\">g</mi></mrow><mrow><mn>10</mn><mi mathvariant=\"normal\">R</mi></mrow></mfrac></msqrt></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">v</mi><mo>=</mo><msqrt><mfrac><mrow><mn>3</mn><mi>gR</mi></mrow><mn>10</mn></mfrac></msqrt></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e2c78a57d3c19b37", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "02", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A chain of mass <math> <mi>m</mi> </math> forming a circle of radius <math> <mtext>R</mtext> </math> is slipped on a smooth round cone with half-angle <math> <mtext>θ</mtext> </math>. Find the tension in the chain if it rotates with a constant angular velocity <math> <mtext>ω</mtext> </math> about a vertical axis coinciding with the symmetry axis of the cone.</p>\r", "image": null}, "options": [{"id": "pa7Ov", "text": "<math> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi></mi><mi></mi><mi></mi><mi>R</mi><mo>⁡</mo> <msup> <mi>ω</mi> <mn>2</mn> </msup> <mo>+</mo> <mtext>g</mtext> <mspace width=\"0.5em\"></mspace> <mtext>cot</mtext> <mspace width=\"0.5em\"></mspace> <mi>θ</mi> </mrow> </mfenced> <mfrac> <mrow> <mi>m</mi><mo>⁡</mo> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "WMT32", "text": "<math><mrow>  <mfenced open=\"(\" close=\")\" separators=\",\">    <mrow>      <mi>R</mi><mo>&ApplyFunction;</mo>      <msup>              <mi>&omega;</mi>            <mn>2</mn>      </msup>      <mo>-</mo>      <mtext>g</mtext>      <mspace width=\"0.5em\" />      <mtext>cot</mtext>      <mspace width=\"0.5em\" />      <mi>&theta;</mi>    </mrow>  </mfenced>  <mfrac>    <mrow>      <mi>m</mi><mo>&ApplyFunction;</mo>    </mrow>    <mrow>      <mn>2</mn>      <mi>&pi;</mi>    </mrow>  </mfrac></mrow></math>", "image": null, "isCorrect": false}, {"id": "wxcQv", "text": "<math><mrow>  <mfenced open=\"(\" close=\")\" separators=\",\">    <mrow>      <mi>R</mi><mo>&ApplyFunction;</mo>      <msup>              <mi>&omega;</mi>            <mn>2</mn>      </msup>      <mo>+</mo>      <mtext>g</mtext>      <mspace width=\"0.5em\" />      <mtext>cot</mtext>      <mspace width=\"0.5em\" />      <mi>&theta;</mi>    </mrow>  </mfenced>  <mfrac>    <mrow>      <mi>m</mi><mo>&ApplyFunction;</mo>    </mrow>    <mrow>      <mn></mn>      <mi>&pi;</mi>    </mrow>  </mfrac></mrow></math>", "image": null, "isCorrect": false}, {"id": "f2V2B", "text": "<math><mrow>  <mfenced open=\"(\" close=\")\" separators=\",\">    <mrow>      <mi>R</mi><mo>&ApplyFunction;</mo>      <msup>              <mi>&omega;</mi>            <mn></mn>      </msup>      <mo>-</mo>      <mtext>g</mtext>      <mspace width=\"0.5em\" />      <mtext>cot</mtext>      <mspace width=\"0.5em\" />      <mi>&theta;</mi>    </mrow>  </mfenced>  <mfrac>    <mrow>      <mi>m</mi><mo>&ApplyFunction;</mo>    </mrow>    <mrow>      <mn>2</mn>      <mi>&pi;</mi>    </mrow>  </mfrac></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Every element of chain moves on a circular path. So, every element of the chain experiences centripetal force. We consider a small element <math> <mrow> <mi>Δ</mi><mtext>m</mtext></mrow> </math> on the chain making angle <math> <mrow> <mtext>Δθ</mtext></mrow> </math> at the centre<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014530_AnsExp_1_1.jpg\" style=\"width: 223px; height: 153px;\" /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014530_AnsExp_1_2.jpg\" style=\"width: 284px; height: 194px;\" /><br /><br /><math> <mrow> <mtext>ΔN&nbsp;sin&nbsp;θ&nbsp;=&nbsp;Δmg</mtext></mrow>&nbsp;&nbsp;</math>...... (i)<br /><br />Net force towards centre is<br /><br /><math> <mrow> <mn>2</mn> <mtext>T</mtext> <mspace width=\"0.5em\"></mspace> <mtext>sin</mtext> <mfrac> <mrow> <mo>Δ</mo> <mi>θ</mi> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>-</mo> <mo>Δ</mo> <mtext>N</mtext> <mspace width=\"0.5em\"></mspace> <mtext>cos</mtext> <mi>θ</mi> <mo>=</mo> <mo>Δ</mo> <mtext>mR</mtext> <mspace width=\"0.5em\"></mspace> <msup> <mi>ω</mi> <mn>2</mn> </msup> </mrow> </math><br /><br /><math><mrow><mo>Δ</mo> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>N</mi><mo>⁡</mo> <mspace width=\"0.5em\"></mspace> <mtext>cos</mtext> <mspace width=\"0.5em\"></mspace> <mi>θ</mi> <mo>=</mo> <mn>2</mn> <mi></mi><mi></mi><mi></mi><mi>T</mi><mo>⁡</mo> <mtext>sin</mtext> <mfrac> <mrow> <mo>Δ</mo> <mi>θ</mi> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>-</mo> <mo>Δ</mo> <mtext>mR</mtext> <mspace width=\"0.5em\"></mspace> <msup> <mi>ω</mi> <mn>2</mn>&nbsp;&nbsp;</msup></mrow></math>.......... (ii)<br /><br />From eqn.(i) and (ii) we get<br /><br /><math> <mrow> <mtext>cos</mtext> <mspace width=\"0.5em\"></mspace> <mi>θ</mi> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> <mtext>T</mtext> <mspace width=\"0.5em\"></mspace> <mtext>sin</mtext> <mfrac> <mrow> <mo>Δ</mo> <mi>θ</mi> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>-</mo> <mo>Δ</mo> <mtext>mR</mtext> <mspace width=\"0.5em\"></mspace> <msup> <mi>ω</mi> <mn>2</mn> </msup> </mrow> <mrow> <mo>Δ</mo> <mtext>mg</mtext> </mrow> </mfrac> </mrow> </math><br /><br />But <math> <mrow> <mtext>Δ&nbsp;θ&nbsp;</mtext></mrow> </math> is very small.<br /><br />∴&nbsp;&nbsp;<math> <mrow> <mtext>sin</mtext> <mfrac> <mrow> <mo>Δ</mo> <mi>θ</mi> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mo>Δ</mo> <mi>θ</mi> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math><br /><br />∵&nbsp;&nbsp;<math> <mrow> <mtext>cot</mtext> <mspace width=\"0.5em\"></mspace> <mi>θ</mi> <mo>=</mo> <mfrac> <mrow> <mtext>T</mtext> <mo>Δ</mo> <mi>θ</mi> <mo>-</mo> <mo>Δ</mo> <mtext>mR</mtext> <mspace width=\"0.5em\"></mspace> <msup> <mi>ω</mi> <mn>2</mn> </msup> </mrow> <mrow> <mo>Δ</mo> <mtext>mg</mtext> </mrow> </mfrac> </mrow> </math><br /><br />Here Δm makes an angle Δθ at the centre. The total mass of chain is m.<br /><br />∴ The mass of chain per unit angle is<br /><br /><math> <mrow> <mi>λ</mi> <mo>=</mo> <mfrac> <mrow> <mi>m</mi><mo>⁡</mo> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> </mrow> </math><br /><br />∴&nbsp;&nbsp;<math> <mrow> <mo>Δ</mo> <mi>m</mi><mo>⁡</mo> <mo>=</mo> <mi>λ</mi> <mo>Δ</mo> <mi>θ</mi> <mo>=</mo> <mfrac> <mrow> <mi>m</mi><mo>⁡</mo> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> <mo>Δ</mo> <mi>θ</mi> <mo>=</mo> <mfrac> <mrow> <mi>m</mi><mo>⁡</mo> <mo>Δ</mo> <mi>θ</mi> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> </mrow> </math><br /><br />∴&nbsp;&nbsp;<math> <mrow> <mtext>cot</mtext><mtext> </mtext><mtext> </mtext><mi>θ</mi><mo>=</mo><mfrac> <mrow> <mtext>T</mtext><mi>Δ</mi><mi>θ</mi><mo>−</mo><mfenced> <mrow> <mfrac> <mrow> <mi>m</mi><mi>Δ</mi><mi>θ</mi></mrow> <mrow> <mn>2</mn><mi>π</mi></mrow> </mfrac> </mrow> </mfenced><mi>R</mi><msup> <mi>ω</mi> <mn>2</mn> </msup> </mrow> <mrow> <mfenced> <mrow> <mfrac> <mi>m</mi> <mrow> <mn>2</mn><mi>π</mi></mrow> </mfrac> <mi>Δ</mi><mi>θ</mi></mrow> </mfenced><mi>g</mi></mrow> </mfrac> </mrow> </math><br /><br />∴&nbsp;&nbsp;<math> <mrow> <mi></mi><mi></mi><mi></mi><mi>T</mi><mo>⁡</mo> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi></mi><mi></mi><mi></mi><mi>R</mi><mo>⁡</mo> <msup> <mi>ω</mi> <mn>2</mn> </msup> <mo>+</mo> <mtext>g</mtext> <mspace width=\"0.5em\"></mspace> <mtext>cot</mtext> <mspace width=\"0.5em\"></mspace> <mi>θ</mi> </mrow> </mfenced> <mfrac> <mrow> <mi>m</mi><mo>⁡</mo> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e06c84b6616561b6", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "04", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A solid sphere of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;and mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math>&nbsp;is rolled by a force <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi></math> acting at the top of the sphere as shown in the figure. The sphere starts from rest and rolls without slipping, then<br />\r<br />\r<br />\r&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0032599_Ques.jpg\" style=\"width: 215px; height: 110px;\" />", "image": null}, "options": [{"id": "LWvHO", "text": "work done by force <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi></math> when the center moves a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math> is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>F</mi><mi>S</mi></math>", "image": null, "isCorrect": true}, {"id": "0GbQd", "text": "work done by force <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi></math> when the center moves a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math> is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>F</mi><mi>S</mi></math>", "image": null, "isCorrect": false}, {"id": "9g2KJ", "text": "work done by force <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi></math> when the center moves a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math> is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn></mn><mi>F</mi><mi>S</mi></math>", "image": null, "isCorrect": false}, {"id": "y7Bal", "text": "work done by force <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi></math> when the center moves a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math> is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi>F</mi><mi>S</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0032599_Ans.jpg\" style=\"width: 184px; height: 147px;\" /><br /><br /><br />When the centre moves a distance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math>,&nbsp;the topmost point displaces by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>S</mi></math>. The work done is by the force is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mn>2</mn><mi>F</mi><mi>S</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d25ebc0741b7136c", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "50", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two particles of masses&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>m</mi></math> are attached to the massless rod of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>l</mi></math> as shown in figure. The rod is hinged at its midpoint&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi></math> and is free to rotate in vertical plane about hinge. The minimum speed&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math> at the given instant so that it can complete the circle.<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/wqixqarjlegegijhuezevefcptetiglukamnywjlpmusqfopfx.jpeg\" />", "image": null}, "options": [{"id": "Wwbdw", "text": "<math><msqrt><mi>g</mi><mi mathvariant=\"script\">l</mi></msqrt></math>", "image": null, "isCorrect": false}, {"id": "1hmjd", "text": "<math><msqrt><mn>4</mn><mi>g</mi><mi mathvariant=\"script\">l</mi></msqrt></math>", "image": null, "isCorrect": false}, {"id": "SG0QJ", "text": "<math><msqrt><mn>5</mn><mi>g</mi><mi mathvariant=\"script\">l</mi></msqrt></math>", "image": null, "isCorrect": false}, {"id": "3Mluh", "text": "<math><msqrt><mfrac><mrow><mn>4</mn><mi>g</mi><mi mathvariant=\"script\">l</mi></mrow><mrow><mn>3</mn></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/iolgqltbrljqcfbpcginviyhtdiamydfcvbhswxadobhkolhjo.jpeg\" /><br /><br /><math><msub><mrow><mi>W</mi></mrow><mrow><mi>g</mi></mrow></msub><mo>=</mo><msub><mrow><mi>K</mi></mrow><mrow><mi>f</mi></mrow></msub><mo>-</mo><msub><mrow><mi>K</mi></mrow><mrow><mi>i</mi></mrow></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mi>g</mi><mn>2</mn><mi>l</mi><mo>-</mo><mn>2</mn><mi>m</mi><mi>g</mi><mn>2</mn><mi>l</mi><mo>=</mo><mn>0</mn><mo>-</mo><mfenced open=\"[\" close=\"]\" separators=\"|\"><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced separators=\"|\"><mrow><mn>2</mn><mi>m</mi></mrow></mfenced><msup><mi>v</mi><mn>2</mn></msup></mrow></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>2</mn><mi>m</mi><mi>g</mi><mi>l</mi><mo>=</mo><mo>-</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup></math><br /><br /><math><mi>v</mi><mo>=</mo><msqrt><mfrac><mrow><mn>4</mn><mi>g</mi><mi mathvariant=\"script\">l</mi></mrow><mrow><mn>3</mn></mrow></mfrac></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863cf5eeda0bc39c547", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "13", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A motor generates an output power of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>220</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">W</mi></math> at an angular velocity of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2100</mn><mo>&nbsp;</mo><mi>rpm</mi></math>. Calculate&nbsp;the torque (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>) produced by the motor? [Take&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">π</mi><mo>=</mo><mfrac><mn>22</mn><mn>7</mn></mfrac></math>]", "image": null}, "options": [], "correctValue": "01.00", "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#969;</mi><mo>=</mo><mn>2100</mn><mo>&#215;</mo><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi></mrow><mn>60</mn></mfrac><mo>=</mo><mn>70</mn><mi mathvariant=\"normal\">&#960;</mi><mo>&#160;</mo><mi>rad</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mi>&#964;</mi><mi>&#969;</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#964;</mi><mo>=</mo><mfrac><mi mathvariant=\"italic\">P</mi><mi mathvariant=\"italic\">&#969;</mi></mfrac><mo>=</mo><mfrac><mrow><mn>220</mn><mo>&#215;</mo><mn>7</mn></mrow><mrow><mn>70</mn><mo>&#215;</mo><mn>22</mn></mrow></mfrac><mo>=</mo><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863cd58e74507d6be38", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "33", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A solid spherical ball of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math>&nbsp;is released from the topmost point of the shown semi-spherical shell. The track is sufficiently rough to enable pure rolling motion.&nbsp;The normal force between the ball and the shell at the lowest position&nbsp;is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029741_Ans.jpg\" style=\"width: 194px; height: 144px;\" />", "image": null}, "options": [{"id": "lGMVC", "text": "<math> <mrow> <mfrac> <mrow> <mn>1</mn> <mn>2</mn> </mrow> <mrow> <mn>7</mn> </mrow> </mfrac> <mtext>mg</mtext> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "mpAwS", "text": "<math> <mrow> <mfrac> <mrow> <mn>7</mn> <mn></mn> </mrow> <mrow> <mn>9</mn> </mrow> </mfrac> <mtext>mg</mtext> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "Z9HSp", "text": "<math> <mrow> <mfrac> <mrow> <mn>1</mn> <mn>7</mn> </mrow> <mrow> <mn>7</mn> </mrow> </mfrac> <mtext>mg</mtext> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "4H6ec", "text": "<math> <mrow> <mfrac> <mrow> <mn>1</mn> <mn>0</mn> </mrow> <mrow> <mn>7</mn> </mrow> </mfrac> <mtext>mg</mtext> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029741_Ans.jpg\" style=\"width: 194px; height: 144px;\" /><br /><br />From the law of conservation of mechanical energy,<br /><br />Final energy = Translational kinetic energy + Rotational kinetic energy<br /><br />Hence, Final energy =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mi>mv</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mi>I&#969;</mi><mn>2</mn></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mi>mv</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mfrac><mn>2</mn><mn>5</mn></mfrac><msup><mi>mR</mi><mn>2</mn></msup><mo>&#215;</mo><msup><mfenced><mfrac><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">R</mi></mfrac></mfenced><mn>2</mn></msup><mo>=</mo><mfrac><mn>7</mn><mn>10</mn></mfrac><msup><mi>mv</mi><mn>2</mn></msup></math><br /><br />Hence, we finally obtain,&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>mg</mtext><mfenced><mtext>R - r</mtext></mfenced><mo>=</mo><mfrac><mn>7</mn><mrow><mn>1</mn><mn>0</mn></mrow></mfrac><msup><mtext>mv</mtext><mn>2</mn></msup></math>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; .......(1)<br /><br />and&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext>N</mtext> <mo>-</mo> <mtext>mg</mtext> <mo>=</mo> <mfrac> <mrow> <msup> <mtext>mv</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mtext>R - r</mtext> </mrow> </mfrac> </mrow> </math>&nbsp; &nbsp; &nbsp; &nbsp;..........(2)<br /><br />Solving Eqs. (1) and (2), we get<br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext>N</mtext> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>7</mn> </mrow> <mrow> <mn>7</mn> </mrow> </mfrac> <mtext>mg</mtext> </mrow></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863baefe69e6691f7e5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "11", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A uniform rod of length <math> <mi>L</mi> </math> is free to rotate in a vertical plane about a fixed horizontal axis through <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>. The rod begins rotating from rest from its unstable equilibrium position. When it has turned through an angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>θ</mi></math>,&nbsp;its angular velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">ω</mi></math>&nbsp;is given by</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Image_1.jpg\" style=\"width: 157px; height: 169px;\" /></p>\r", "image": null}, "options": [{"id": "9pEQ4", "text": "<math > <mrow>  <msqrt>   <mrow>    <mfrac>     <mrow>      <mn>6</mn><mi>g</mi></mrow>     <mi>L</mi>    </mfrac>    </mrow>  </msqrt>  <mtext>&#x2009;</mtext><mtext>sin</mtext><mtext>&#x2009;</mtext><mi>&#x03B8;</mi></mrow></math>", "image": null, "isCorrect": false}, {"id": "XIGkT", "text": "<math> <mrow> <msqrt> <mrow> <mfrac> <mrow> <mn>6</mn><mi>g</mi></mrow> <mi>L</mi> </mfrac> </mrow> </msqrt> <mi>sin</mi><mfrac> <mtext>θ</mtext> <mn>2</mn> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "dr8XV", "text": "<math> <mrow>  <msqrt>   <mrow>    <mfrac>     <mrow>      <mn>6</mn><mi>g</mi></mrow>     <mi>L</mi>    </mfrac>    </mrow>  </msqrt>  <mi>cos</mi><mfrac>   <mi>&#x03B8;</mi>   <mn>2</mn>  </mfrac>  </mrow></math>", "image": null, "isCorrect": false}, {"id": "8Wlvl", "text": "<math> <mrow>  <msqrt>   <mrow>    <mfrac>     <mrow>      <mn>6</mn><mi>g</mi></mrow>     <mi>L</mi>    </mfrac>    <mtext>&#x2009;</mtext></mrow>  </msqrt>  <mtext>cos</mtext><mtext>&#x2009;</mtext><mi>&#x03B8;</mi></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>When the rod rotates through angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi></math>, the fall <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math> of centre of gravity is given by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mstyle displaystyle=\"true\"><mfrac><mi>L</mi><mn>2</mn></mfrac><mo>-</mo><mi>h</mi></mstyle><mstyle displaystyle=\"true\"><mfrac><mi>L</mi><mn>2</mn></mfrac></mstyle></mfrac><mo>=</mo><mi>cos</mi><mfenced><mi>&#952;</mi></mfenced></math></p><p>&nbsp;</p><p>or<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo mathvariant=\"italic\">&#160;&#160;</mo><mi>h</mi><mo mathvariant=\"italic\">=</mo><mfrac><mi mathvariant=\"italic\">L</mi><mn mathvariant=\"italic\">2</mn></mfrac><mo mathvariant=\"italic\">(</mo><mn mathvariant=\"italic\">1</mn><mo mathvariant=\"italic\">-</mo><mi>c</mi><mi>o</mi><mi>s</mi><mi>&#952;</mi><mo mathvariant=\"italic\">)</mo></math></p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/abs/61eb23d4-c2ea-45ee-acb1-3fe68777d4a0-4.jpg\" style=\"width: 175px; height: 173px;\" /></p><p>Decrease in potential energy</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo mathvariant=\"italic\">=</mo><mi>M</mi><mi>g</mi><mi>h</mi><mo mathvariant=\"italic\">=</mo><mi>M</mi><mi>g</mi><mfrac><mi mathvariant=\"italic\">L</mi><mn mathvariant=\"italic\">2</mn></mfrac><mo mathvariant=\"italic\">(</mo><mn mathvariant=\"italic\">1</mn><mo mathvariant=\"italic\">-</mo><mi>c</mi><mi>o</mi><mi>s</mi><mi>&#952;</mi><mo mathvariant=\"italic\">)</mo></math></p><p>Now, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi><mi>E</mi></math> of rotation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo mathvariant=\"italic\">=</mo><mfrac><mn mathvariant=\"italic\">1</mn><mn mathvariant=\"italic\">2</mn></mfrac><mi>I</mi><msup><mi>&#969;</mi><mn mathvariant=\"italic\">2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mfrac><msup><mi>ML</mi><mn>2</mn></msup><mn>3</mn></mfrac><msup><mi>&#969;</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mfrac><msup><mi>ML</mi><mn>2</mn></msup><mn>3</mn></mfrac><msup><mi>&#969;</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"\" open=\"[\"><mrow><mi mathvariant=\"normal\">I</mi><mo>=</mo><msup><mi>ML</mi><mn>2</mn></msup><mo>/</mo><mn>3</mn></mrow></mfenced></math>&nbsp;(because rod is rotating about an axis&nbsp;passing through its one end)&nbsp;</p><p>According to law of conservation of energy, decrease in potential energy will be equal to gain in kinetic energy.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><mi>g</mi><mfrac><mi mathvariant=\"italic\">L</mi><mn mathvariant=\"italic\">2</mn></mfrac><mo mathvariant=\"italic\">(</mo><mn mathvariant=\"italic\">1</mn><mo mathvariant=\"italic\">-</mo><mi>c</mi><mi>o</mi><mi>s</mi><mi>&#952;</mi><mo mathvariant=\"italic\">)</mo><mo mathvariant=\"italic\">=</mo><mfrac><mrow><mi mathvariant=\"italic\">M</mi><msup><mi mathvariant=\"italic\">L</mi><mn mathvariant=\"italic\">2</mn></msup></mrow><mn mathvariant=\"italic\">6</mn></mfrac><msup><mi>&#969;</mi><mn mathvariant=\"italic\">2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#969;</mi><mo>=</mo><msqrt><mfrac><mrow><mn>3</mn><mi>g</mi></mrow><mi>L</mi></mfrac><mo>(</mo><mn>1</mn><mo>-</mo><mi>C</mi><mi>o</mi><mi>s</mi><mi>&#952;</mi><mo>)</mo></msqrt><mo>=</mo><msqrt><mfrac><mrow><mn>6</mn><mi>g</mi></mrow><mi>L</mi></mfrac></msqrt><mi>S</mi><mi>i</mi><mi>n</mi><mfrac><mi>&#952;</mi><mn>2</mn></mfrac></math></p><p>&nbsp;</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ab0dabce9b952e89", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "77", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform, thin cylindrical shell and solid cylinder roll horizontally without slipping. The speed of the cylindrical shell is <math><mi mathvariant=\"italic\">v</mi></math>. The solid cylinder and the hollow cylinder encounter an incline that they climb without slipping. If the maximum height they reach is the same, find the initial speed <math><mi mathvariant=\"italic\">v</mi><mi mathvariant=\"italic\">'</mi></math> of the solid cylinder.", "image": null}, "options": [{"id": "t9SaQ", "text": "<math><msqrt><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac></msqrt><mi mathvariant=\"italic\">v</mi></math>", "image": null, "isCorrect": true}, {"id": "3AvjA", "text": "<math><msqrt><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac></msqrt><mi mathvariant=\"italic\">v</mi></math>", "image": null, "isCorrect": false}, {"id": "7L1X7", "text": "<math><msqrt><mfrac><mrow><mn>3</mn></mrow><mrow><mn>5</mn></mrow></mfrac></msqrt><mi mathvariant=\"italic\">v</mi></math>", "image": null, "isCorrect": false}, {"id": "92IsL", "text": "<math><msqrt><mfrac><mrow><mn>5</mn></mrow><mrow><mn>3</mn></mrow></mfrac></msqrt><mi mathvariant=\"italic\">v</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi mathvariant=\"italic\">K</mi><mi mathvariant=\"italic\">E</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><msup><mrow><mi mathvariant=\"italic\">m</mi><mi mathvariant=\"italic\">v</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"italic\">I</mi><msup><mrow><mi mathvariant=\"italic\">ω</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac><msubsup><mrow><mi mathvariant=\"italic\">m</mi><mi mathvariant=\"italic\">v</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>=</mo><msubsup><mrow><mi mathvariant=\"italic\">m</mi><mi mathvariant=\"italic\">v</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup></math><br /><math><mfrac><mrow><msub><mrow><mi mathvariant=\"italic\">v</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"italic\">v</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><msqrt><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a86ad4fcc8c58b50", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "108", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An automobile moves on a road with a speed of <math><mn>54</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">h</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> . The radius of its wheels is <math> <mn>0.45</mn><mtext> </mtext><mtext>m</mtext> </math> and the moment of inertia of the wheel about its axis of rotation is <math><mn>3</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>2</mn></mrow></msup></math> . If the vehicle is brought to rest in <math> <mtext>15&nbsp;s</mtext> </math>, the magnitude of average torque transmitted by its brakes to the wheel is:", "image": null}, "options": [{"id": "Wmb9w", "text": "<math><mn>8.58</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>2&nbsp;</mn></mrow></msup><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "Rw4tA", "text": "<math><mn>10.86</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\"> </mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>2</mn></mrow></msup><mi mathvariant=\"normal\"> </mi><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "m1ZTd", "text": "<math><mn>2.86</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\"> </mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\"> </mi></mrow></msup><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "5rCUx", "text": "<math><mn>6.66</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>2&nbsp;</mn></mrow></msup><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math><msub><mrow><mi mathvariant=\"normal\">ω</mi></mrow><mrow><mi mathvariant=\"normal\">i</mi></mrow></msub><mo>=</mo><mfrac><mrow><mn>15</mn></mrow><mrow><mn>0.45<
