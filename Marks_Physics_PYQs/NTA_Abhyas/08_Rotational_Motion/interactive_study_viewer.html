stion": {"text": "The moment of inertia of a hollow cubical box of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> and side length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math>, about an axis passing through centres of two opposite faces, is equal to <math><mfrac><mrow><mi>x</mi><mi>M</mi><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>18</mn></mrow></mfrac></math>.&nbsp;The value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math> is", "image": null}, "options": [], "correctValue": "5", "solution": {"text": "<p>Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> be the mass of each face of the cubical box.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mn>2</mn><mo>×</mo><mfenced separators=\"|\"><mfrac><mrow><mi>m</mi><msup><mi>a</mi><mn>2</mn></msup></mrow><mn>6</mn></mfrac></mfenced><mo>+</mo><mn>4</mn><mo>×</mo><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mi>m</mi><msup><mi>a</mi><mn>2</mn></msup></mrow><mn>12</mn></mfrac><mo>+</mo><mi>m</mi><msup><mfenced separators=\"|\"><mfrac><mi>a</mi><mn>2</mn></mfrac></mfenced><mn>2</mn></msup></mrow></mfenced></math><br /><br /><math><mo>=</mo><mfrac><mrow><mn>5</mn><mi>m</mi><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>3</mn></mrow></mfrac></math><br /><br />But,&nbsp;<math><mi>m</mi><mo>=</mo><mfrac><mrow><mi>M</mi></mrow><mrow><mn>6</mn></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mi>I</mi><mo>=</mo><mfrac><mrow><mn>5</mn><mi>M</mi><msup><mi>a</mi><mn>2</mn></msup></mrow><mn>18</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>x</mi><mo>=</mo><mn>5</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630e87280f3f1c8536", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "36", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform rod <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math>&nbsp;of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi>kg</mi></math> and length&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> is placed on a sharp support <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">O</mi></math>, such that <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AO</mi><mo>=</mo><mi>a</mi><mo>=</mo><mn>25</mn><mo>&nbsp;</mo><mi>cm</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>OB</mi><mo>=</mo><mi>b</mi><mo>=</mo><mn>75</mn><mo>&nbsp;</mo><mi>cm</mi></math>. A spring of force constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>600</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>&nbsp;is&nbsp;attached to the end <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>,&nbsp;as shown. Initially, the spring is extended by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi>cm</mi></math> at equilibrium. As soon as the thread is burnt, find the normal force (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">N</mi></math>) exerted by the support at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">O</mi></math>.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/636847_que.JPG\" style=\"width: 250px; height: 102px;\" /><br />\r&nbsp;", "image": null}, "options": [], "correctValue": "8", "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi></math>&nbsp;about <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">O</mi></math>&nbsp;is <math><mfrac><mrow><mi>m</mi><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>12</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>m</mi><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>16</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>7</mn><mi>m</mi><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>48</mn></mrow></mfrac></math><br /><br />Spring force&nbsp;&nbsp; <math><mo>⇒</mo><mi>K</mi><mi mathvariant=\"normal\">Δ</mi><mi>x</mi><mo>=</mo><mn>600</mn><mo>×</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>100</mn></mrow></mfrac><mo>=</mo><mn>12</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">N</mi></math><br /><br />Torque, just after burning the string,<br /><br /><math><mi>τ</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>2</mn><mo>×</mo><mn>10</mn><mo>×</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac></mrow></mfenced><mo>+</mo><mn>12</mn><mo>×</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>&nbsp;</mi><mi>τ</mi><mo>=</mo><mi>&nbsp;</mi><mn>5</mn><mi>&nbsp;</mi><mo>+</mo><mi>&nbsp;</mi><mn>9</mn><mi>&nbsp;</mi><mo>=</mo><mi>&nbsp;</mi><mn>14</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mi>α</mi><mo>=</mo><mfrac><mrow><mn>14</mn><mo>×</mo><mn>48</mn></mrow><mrow><mn>7</mn><mo>×</mo><mn>2</mn><mo>×</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mn>48</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi>rad</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math><br /><br /><math><mo>∴</mo></math> Acceleration of COM,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mn>48</mn><mo>×</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>=</mo><mn>12</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math><br /><br />Now, total vertical force<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mi>&nbsp;</mi><mo>+</mo><mi>&nbsp;</mi><mn>20</mn><mi>&nbsp;</mi><mo>–</mo><mi>&nbsp;</mi><mi>N</mi><mi>&nbsp;</mi><mo>=</mo><mi>&nbsp;</mi><mn>2</mn><mi>&nbsp;</mi><mo>×</mo><mi>&nbsp;</mi><mn>12</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>N</mi><mi>&nbsp;</mi><mo>=</mo><mi>&nbsp;</mi><mn>32</mn><mi>&nbsp;</mi><mo>–</mo><mi>&nbsp;</mi><mn>24</mn><mi>&nbsp;</mi><mo>=</mo><mi>&nbsp;</mi><mn>8</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">N</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630d96f64e4b6f38a7", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "04", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform rod of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>M</mi><mn>1</mn></msub></math> is hinged at its upper end as shown in the figure. A particle of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>M</mi><mn>2</mn></msub></math>&nbsp;which is&nbsp;moving horizontally, strikes the rod elastically at its midpoint. If the particle comes to rest after collision, then the value of <math><mfrac><mrow><msub><mrow><mi>M</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>M</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math>&nbsp;is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image24-2b929b41-1e15-4d77-ab62-31c1194635a5.jpg\" style=\"width: 150px; height: 203px;\" />", "image": null}, "options": [], "correctValue": "0.75", "solution": {"text": "<p>Conserving angular Momentum about the hinge, just before and after the collision&nbsp;<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mi>H</mi></msub><mo>=</mo><msub><mi>M</mi><mn>2</mn></msub><mi>v</mi><mfrac><mi>L</mi><mn>2</mn></mfrac><mo>=</mo><mfrac><mrow><msub><mi>M</mi><mn>1</mn></msub><msup><mi>L</mi><mn>2</mn></msup></mrow><mn>3</mn></mfrac><mi>ω</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ω</mi><mo>=</mo><mfrac><mrow><mn>3</mn><msub><mi>M</mi><mn>2</mn></msub><mi>v</mi></mrow><mrow><mn>2</mn><msub><mi>M</mi><mn>1</mn></msub><mi>L</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">e</mi><mo>=</mo><mn>1</mn><mo>,</mo><mi mathvariant=\"normal\">&nbsp;</mi><msub><mi mathvariant=\"normal\">v</mi><mrow><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">M</mi></mrow></msub><mo>=</mo><mi mathvariant=\"normal\">v</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">ω</mi><mi>L</mi></mrow><mn>2</mn></mfrac></math><br /><br /><math><mo>⇒</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><mn>2</mn><mi>v</mi></mrow><mrow><mi>L</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn><msub><mrow><mi>M</mi></mrow><mrow><mn>2</mn></mrow></msub><mi>v</mi></mrow><mrow><mn>2</mn><msub><mrow><mi>M</mi></mrow><mrow><mn>1</mn></mrow></msub><mi>L</mi></mrow></mfrac></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mfrac><mrow><msub><mrow><mi>M</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>M</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>0.75</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86307cab88808f594a4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "07", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A circular platform is free to rotate in a horizontal plane about a vertical axis passing through its centre. A tortoise is sitting at the edge of the platform. Now the platform is given an angular velocity <math><msub><mrow><mi mathvariant=\"normal\">ω</mi></mrow><mrow><mn>0</mn></mrow></msub></math>. When the tortoise moves along a chord of the platform with a constant velocity (w.r.t. the platform), which of the following graphs shows properly the variation of angular velocity of the platform with the time <math><mi>t</mi></math>?", "image": null}, "options": [{"id": "yYr5s", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/628086a.png\" style=\"width: 169px; height: 128px;\" />", "image": null, "isCorrect": false}, {"id": "vJwN4", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/628086b.png\" style=\"width: 166px; height: 149px;\" />", "image": null, "isCorrect": false}, {"id": "hx63G", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/628086c.png\" style=\"width: 167px; height: 141px;\" />", "image": null, "isCorrect": true}, {"id": "oiDlX", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/628086d.png\" style=\"width: 144px; height: 130px;\" />", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As there is no external torque, angular momentum will remain constant. When the tortoise moves from <math><mi>A</mi></math> to <math><mi>C</mi></math>, figure, moment of inertia of the platform and tortoise decreases. Therefore, angular velocity of the system increases. When the tortoise moves from <math><mi>C</mi></math> to <math><mi>B</mi></math>, moment of inertia increases. Therefore, angular velocity decreases<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/628086s.png\" style=\"width: 167px; height: 161px;\" /><br /><br />If, <math><mi>M</mi></math>=mass of platform<br /><br /><math><mi>R</mi><mo>=</mo></math>radius of platform<br /><br /><math><mi>m</mi><mo>=</mo></math>mass of tortoise moving along the chord <math><mi>A</mi><mi>B</mi></math><br /><br /><math><mi>a</mi><mo>=</mo></math>perpendicular distance of <math><mi>O</mi></math> from <math><mi>A</mi><mi>B</mi></math><br /><br />Initial angular momentum, <math><msub><mrow><mi>I</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mi>m</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mfrac><mrow><mi>M</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><br />At any time <math><mi>t</mi></math>, let the tortoise reach <math><mi>D</mi></math> moving with velocity <math><mi>v</mi></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>A</mi><mi>D</mi><mo>=</mo><mi>v</mi><mi>t</mi></math><br /><br /><math><mi>A</mi><mi>C</mi><mo>=</mo><msqrt><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></msqrt></math><br /><br />As <math><mi>D</mi><mi>C</mi><mo>=</mo><mi>A</mi><mi>C</mi><mo>-</mo><mi>A</mi><mi>D</mi><mo>=</mo><mo>(</mo><msqrt><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></msqrt><mo>-</mo><mi>v</mi><mi>t</mi><mo>)</mo></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>O</mi><mi>D</mi><mo>=</mo><mi>r</mi><mo>=</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><msqrt><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></msqrt><mo>-</mo><mi>v</mi><mi>t</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br />Angular momentum at time <math><mi>t</mi></math><br /><br /><math><msub><mrow><mi>I</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mi>m</mi><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mfrac><mrow><mi>M</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><br />As angular momentum is conserved<br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>I</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">ω</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><msub><mrow><mi>I</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">ω</mi><mfenced separators=\"|\"><mrow><mi>t</mi></mrow></mfenced></math><br /><br />This shows that variation of <math><mi mathvariant=\"normal\">ω</mi><mo>(</mo><mi>t</mi><mo>)</mo></math> with time is nonlinear. Choice<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/628086c.png\" style=\"width: 167px; height: 141px;\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86300eee799a5b7c63f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "08", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A bar of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>&nbsp;and&nbsp;length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi></math>&nbsp;is in pure translational motion with its centre of mass moving with a velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math>. It collides and sticks to another identical bar at rest as shown in the figure. Assuming that after the collision the system of the two bars becomes one composite bar of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>l</mi></math>,&nbsp;then the angular velocity of the composite bar will be<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-05-26_at_4.10.04_PM.jpeg\" style=\"width: 200px; height: 170px;\" />", "image": null}, "options": [{"id": "x0X4B", "text": "<math> <mrow> <mfrac> <mrow> <mn>3</mn> <mi>v</mi> </mrow> <mrow> <mn>4</mn> <mtext mathvariant=\"italic\">l</mtext> </mrow> </mfrac> </mrow> </math>, anti-clockwise", "image": null, "isCorrect": true}, {"id": "UBWye", "text": "<math> <mrow> <mfrac> <mrow> <mn>4</mn> <mi>v</mi> </mrow> <mrow> <mn>3</mn> <mtext mathvariant=\"italic\">l</mtext> </mrow> </mfrac> </mrow> </math>, anti-clockwise", "image": null, "isCorrect": false}, {"id": "urfv3", "text": "<math> <mrow> <mfrac> <mrow> <mn>3</mn> <mi>v</mi> </mrow> <mrow> <mn>4</mn> <mtext mathvariant=\"italic\">l</mtext> </mrow> </mfrac> </mrow> </math>, clockwise", "image": null, "isCorrect": false}, {"id": "4gzF6", "text": "<math> <mrow> <mfrac> <mrow> <mn>4</mn> <mi>v</mi> </mrow> <mrow> <mn>3</mn> <mtext mathvariant=\"italic\">l</mtext> </mrow> </mfrac> </mrow> </math>, clockwise", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "By law of conservation of angular momentum<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mi>Σ</mi> <mtext>mvr</mtext> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext mathvariant=\"italic\">I</mtext> <mtext>system</mtext> </msub> </mrow> </mfenced> <mi>ω</mi> </mrow> </math><br /><br /><math> <mrow> <mo>⇒&nbsp;&nbsp;&nbsp;&nbsp;</mo> <mtext>mv</mtext> <mfrac> <mrow> <mtext mathvariant=\"italic\">l</mtext> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>2</mn> <mtext>m</mtext> </mrow> </mfenced> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>2</mn> <mtext mathvariant=\"italic\">l</mtext> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> </mrow> <mrow> <mn>1</mn> <mn>2</mn> </mrow> </mfrac> <mi>ω</mi> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> <mtext>m</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>4</mn> <msup> <mtext mathvariant=\"italic\">l</mtext> <mn>2</mn> </msup> </mrow> </mfenced> </mrow> <mrow> <mn>1</mn> <mn>2</mn> </mrow> </mfrac> <mi>ω</mi> </mrow> </math><br /><br /><math> <mrow> <mo>⇒&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</mo> <mi>ω</mi> <mo>=</mo> <mfrac> <mrow> <mn>3</mn> <mtext>v</mtext> </mrow> <mrow> <mn>4</mn> <mtext mathvariant=\"italic\">l</mtext> </mrow> </mfrac> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>anti-clockwise</mtext> </mrow> </mfenced> </mrow> </math><br /><br />Note that clockwise or anti-clockwise rotation can only be determined here by the given diagram.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "6aa3ab79aa8dc1ff681780a0", "title": "Torque", "totalQuestions": 36, "questions": [{"_id": "6151e863f3f27d35a32428f7", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "05", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A Uniform rod <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math> is hinged at its end <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;and the other end of the rod is connected to a block through a massless string as shown in the figure. The pulley is smooth and massless. Masses of the block and the rod are same and are equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>. The&nbsp;acceleration of the block just after the release from this position is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-05-23_at_8.46.38_PM.jpeg\" style=\"width: 240px; height: 188px;\" /></p>\r", "image": null}, "options": [{"id": "ELIM7", "text": "<math><mfrac><mrow><mn>6</mn><mi mathvariant=\"normal\">g</mi></mrow><mrow><mn>13</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "AWWck", "text": "<math><mfrac><mrow><mi mathvariant=\"normal\">g</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "qDX2k", "text": "<math><mfrac><mrow><mn>3</mn><mi mathvariant=\"normal\">g</mi></mrow><mrow><mn>8</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "z7sTi", "text": "<math><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">e</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the rod: <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>T</mtext><mi>&#8467;</mi><mo>-</mo><mtext>mg</mtext><mfenced><mfrac><mi>&#8467;</mi><mn>2</mn></mfrac></mfenced><mo>=</mo><mfrac><mrow><mtext>m</mtext><msup><mi>&#8467;</mi><mn>2</mn></msup></mrow><mn>3</mn></mfrac><mo>&#215;</mo><mfrac><mtext>a</mtext><mi>&#8467;</mi></mfrac></math> ...(i)<br /><br />For the: <math><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi><mo>-</mo><mi mathvariant=\"normal\">T</mi><mo>=</mo><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi></math> ...(ii)<br /><br />Solving (i) and (ii) we get: <math><mi mathvariant=\"normal\">a</mi><mo>=</mo><mfrac><mrow><mn>3</mn><mi mathvariant=\"normal\">g</mi></mrow><mrow><mn>8</mn></mrow></mfrac></math><br /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image7-e05807fa-0976-475c-b507-830d4fa53781.jpg\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863f1017dd1a9124e56", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "105", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A rope of negligible mass is wound around a hollow cylinder of mass 3 kg and radius 40 cm and then the entire arrangement is placed on a smooth horizontal surface. What is the angular acceleration (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>rad</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>) of the cylinder if the rope is pulled with a &nbsp;force of 30 N?", "image": null}, "options": [], "correctValue": "10", "solution": {"text": "Given, &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;M&nbsp;= 3 kg<br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; R = 40 cm = 0.40 m<br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; F = 30 N<br /><br />Moment of inertia of the hollow cylinder about its axis of symmetry<br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;I = MR<sup>2</sup><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;= 3 × (0.40)<sup>2</sup> = 0.48 kg-m<sup>2</sup><br /><br />Torque acting on the cylinder by the applied force,<br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; <math> <mrow> <mn>τ</mn> </mrow> </math> = F × R<br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;= 30 × 0.40 = 12 N-m.<br /><br />Angular acceleration produced in cylinder,<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>α</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>τ</mtext> </mrow> <mrow> <mtext>I</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>12</mtext> </mrow> <mrow> <mtext>0.48</mtext> </mrow> </mfrac> <mo>=</mo> <msup> <mtext>25 rad/s</mtext> <mn>2</mn> </msup> </mrow> </math><br /><br />Linear acceleration, a = R<math> <mrow> <mn>α</mn> </mrow> </math><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;= 0.40 × 25 = 10.0 m/s<sup>2</sup>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e79dac9ae976895e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "80", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform disc of mass <math><mi>M</mi></math> and radius <math><mi>R</mi><mi>&nbsp;</mi></math>is mounted on a fixed horizontal axis. A block of mass <math><mi>m</mi></math> hangs from a massless string that is wrapped around the rim of the disc. The magnitude of the acceleration of the falling block (<math><mi>m</mi></math>) is", "image": null}, "options": [{"id": "DrgbO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mi>M</mi></mrow><mrow><mi>M</mi><mo>+</mo><mn>2</mn><mi>m</mi></mrow></mfrac><mi>&#160;</mi><mi>g</mi></math>", "image": null, "isCorrect": false}, {"id": "bmVjE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mi>m</mi></mrow><mrow><mi>M</mi><mo>+</mo><mn>2</mn><mi>m</mi></mrow></mfrac><mi>&#160;</mi><mi>g</mi></math>", "image": null, "isCorrect": true}, {"id": "2SEgX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>M</mi><mo>+</mo><mn>2</mn><mi>m</mi></mrow><mrow><mn>2</mn><mi>&#160;</mi><mi>M</mi><mi>&#160;</mi></mrow></mfrac><mi>&#160;</mi><mi>g</mi></math>", "image": null, "isCorrect": false}, {"id": "wKgbV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mi>M</mi><mo>+</mo><mi>m</mi></mrow><mrow><mn>2</mn><mi>M</mi><mi>&#160;</mi></mrow></mfrac><mi>&#160;</mi><mi>g</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When pulley has a finite mass <math><mi>M</mi></math> and radius <math><mi>R</mi></math>, then tension in two segments of the string are different.<br /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image25-8e2c543b-b2b7-4dbb-a4bb-ec438590c74b.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 138px; height: 190px;\" /><br /><br />Here, <math><mi>m</mi><mi>a</mi><mo>=</mo><mi>m</mi><mi mathvariant=\"normal\">g</mi><mo>-</mo><mi>T</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mfrac><mi>m</mi><mrow><mi>m</mi><mo>+</mo><mfrac><mi>M</mi><mn>2</mn></mfrac></mrow></mfrac><mi>g</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>m</mi></mrow><mrow><mn>2</mn><mi>m</mi><mo>+</mo><mi>M</mi></mrow></mfrac><mi>g</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e3f33da4958276f9", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "61", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A right triangular plate <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ABC</mi></math> of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> is free to rotate in the vertical plane about a fixed horizontal axis through <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>. It is supported by a string such that the side <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math> is horizontal. The reaction at the support <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0031602_Question.jpg\" style=\"width: 192px; height: 186px;\" />", "image": null}, "options": [{"id": "ySMoW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>m</mi><mtext>g</mtext></mrow><mn>3</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "EA3BA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mtext>2</mtext><mi>m</mi><mtext>g</mtext></mrow><mn>3</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "m7uSA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>m</mi><mtext>g</mtext></mrow><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "T6S8B", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mtext>g</mtext></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For equilibrium of torque about A,<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>m</mi><mtext>g</mtext></mrow></mfenced><mfrac><mi>l</mi><mn>3</mn></mfrac><mo>=</mo><mi>T</mi><mfenced><mi>l</mi></mfenced><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mtext>or</mtext><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mi>T</mi><mo>=</mo><mfrac><mrow><mi>m</mi><mtext>g</mtext></mrow><mn>3</mn></mfrac></math><br /><br />For verticle equilibrium of plate,<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mtext>A</mtext></msub><mo>+</mo><mi>T</mi><mo>=</mo><mi>m</mi><mtext>g</mtext><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mo>∴</mo><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><msub><mtext>R</mtext><mtext>A</mtext></msub><mo>=</mo><mfrac><mrow><mn>2</mn><mi>m</mi><mtext>g</mtext></mrow><mn>3</mn></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e2c78a57d3c19b37", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "02", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A chain of mass <math> <mi>m</mi> </math> forming a circle of radius <math> <mtext>R</mtext> </math> is slipped on a smooth round cone with half-angle <math> <mtext>θ</mtext> </math>. Find the tension in the chain if it rotates with a constant angular velocity <math> <mtext>ω</mtext> </math> about a vertical axis coinciding with the symmetry axis of the cone.</p>\r", "image": null}, "options": [{"id": "pa7Ov", "text": "<math> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi></mi><mi></mi><mi></mi><mi>R</mi><mo>⁡</mo> <msup> <mi>ω</mi> <mn>2</mn> </msup> <mo>+</mo> <mtext>g</mtext> <mspace width=\"0.5em\"></mspace> <mtext>cot</mtext> <mspace width=\"0.5em\"></mspace> <mi>θ</mi> </mrow> </mfenced> <mfrac> <mrow> <mi>m</mi><mo>⁡</mo> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "WMT32", "text": "<math><mrow>  <mfenced open=\"(\" close=\")\" separators=\",\">    <mrow>      <mi>R</mi><mo>&ApplyFunction;</mo>      <msup>              <mi>&omega;</mi>            <mn>2</mn>      </msup>      <mo>-</mo>      <mtext>g</mtext>      <mspace width=\"0.5em\" />      <mtext>cot</mtext>      <mspace width=\"0.5em\" />      <mi>&theta;</mi>    </mrow>  </mfenced>  <mfrac>    <mrow>      <mi>m</mi><mo>&ApplyFunction;</mo>    </mrow>    <mrow>      <mn>2</mn>      <mi>&pi;</mi>    </mrow>  </mfrac></mrow></math>", "image": null, "isCorrect": false}, {"id": "wxcQv", "text": "<math><mrow>  <mfenced open=\"(\" close=\")\" separators=\",\">    <mrow>      <mi>R</mi><mo>&ApplyFunction;</mo>      <msup>              <mi>&omega;</mi>            <mn>2</mn>      </msup>      <mo>+</mo>      <mtext>g</mtext>      <mspace width=\"0.5em\" />      <mtext>cot</mtext>      <mspace width=\"0.5em\" />      <mi>&theta;</mi>    </mrow>  </mfenced>  <mfrac>    <mrow>      <mi>m</mi><mo>&ApplyFunction;</mo>    </mrow>    <mrow>      <mn></mn>      <mi>&pi;</mi>    </mrow>  </mfrac></mrow></math>", "image": null, "isCorrect": false}, {"id": "f2V2B", "text": "<math><mrow>  <mfenced open=\"(\" close=\")\" separators=\",\">    <mrow>      <mi>R</mi><mo>&ApplyFunction;</mo>      <msup>              <mi>&omega;</mi>            <mn></mn>      </msup>      <mo>-</mo>      <mtext>g</mtext>      <mspace width=\"0.5em\" />      <mtext>cot</mtext>      <mspace width=\"0.5em\" />      <mi>&theta;</mi>    </mrow>  </mfenced>  <mfrac>    <mrow>      <mi>m</mi><mo>&ApplyFunction;</mo>    </mrow>    <mrow>      <mn>2</mn>      <mi>&pi;</mi>    </mrow>  </mfrac></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Every element of chain moves on a circular path. So, every element of the chain experiences centripetal force. We consider a small element <math> <mrow> <mi>Δ</mi><mtext>m</mtext></mrow> </math> on the chain making angle <math> <mrow> <mtext>Δθ</mtext></mrow> </math> at the centre<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014530_AnsExp_1_1.jpg\" style=\"width: 223px; height: 153px;\" /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014530_AnsExp_1_2.jpg\" style=\"width: 284px; height: 194px;\" /><br /><br /><math> <mrow> <mtext>ΔN&nbsp;sin&nbsp;θ&nbsp;=&nbsp;Δmg</mtext></mrow>&nbsp;&nbsp;</math>...... (i)<br /><br />Net force towards centre is<br /><br /><math> <mrow> <mn>2</mn> <mtext>T</mtext> <mspace width=\"0.5em\"></mspace> <mtext>sin</mtext> <mfrac> <mrow> <mo>Δ</mo> <mi>θ</mi> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>-</mo> <mo>Δ</mo> <mtext>N</mtext> <mspace width=\"0.5em\"></mspace> <mtext>cos</mtext> <mi>θ</mi> <mo>=</mo> <mo>Δ</mo> <mtext>mR</mtext> <mspace width=\"0.5em\"></mspace> <msup> <mi>ω</mi> <mn>2</mn> </msup> </mrow> </math><br /><br /><math><mrow><mo>Δ</mo> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>N</mi><mo>⁡</mo> <mspace width=\"0.5em\"></mspace> <mtext>cos</mtext> <mspace width=\"0.5em\"></mspace> <mi>θ</mi> <mo>=</mo> <mn>2</mn> <mi></mi><mi></mi><mi></mi><mi>T</mi><mo>⁡</mo> <mtext>sin</mtext> <mfrac> <mrow> <mo>Δ</mo> <mi>θ</mi> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>-</mo> <mo>Δ</mo> <mtext>mR</mtext> <mspace width=\"0.5em\"></mspace> <msup> <mi>ω</mi> <mn>2</mn>&nbsp;&nbsp;</msup></mrow></math>.......... (ii)<br /><br />From eqn.(i) and (ii) we get<br /><br /><math> <mrow> <mtext>cos</mtext> <mspace width=\"0.5em\"></mspace> <mi>θ</mi> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> <mtext>T</mtext> <mspace width=\"0.5em\"></mspace> <mtext>sin</mtext> <mfrac> <mrow> <mo>Δ</mo> <mi>θ</mi> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>-</mo> <mo>Δ</mo> <mtext>mR</mtext> <mspace width=\"0.5em\"></mspace> <msup> <mi>ω</mi> <mn>2</mn> </msup> </mrow> <mrow> <mo>Δ</mo> <mtext>mg</mtext> </mrow> </mfrac> </mrow> </math><br /><br />But <math> <mrow> <mtext>Δ&nbsp;θ&nbsp;</mtext></mrow> </math> is very small.<br /><br />∴&nbsp;&nbsp;<math> <mrow> <mtext>sin</mtext> <mfrac> <mrow> <mo>Δ</mo> <mi>θ</mi> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mo>Δ</mo> <mi>θ</mi> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math><br /><br />∵&nbsp;&nbsp;<math> <mrow> <mtext>cot</mtext> <mspace width=\"0.5em\"></mspace> <mi>θ</mi> <mo>=</mo> <mfrac> <mrow> <mtext>T</mtext> <mo>Δ</mo> <mi>θ</mi> <mo>-</mo> <mo>Δ</mo> <mtext>mR</mtext> <mspace width=\"0.5em\"></mspace> <msup> <mi>ω</mi> <mn>2</mn> </msup> </mrow> <mrow> <mo>Δ</mo> <mtext>mg</mtext> </mrow> </mfrac> </mrow> </math><br /><br />Here Δm makes an angle Δθ at the centre. The total mass of chain is m.<br /><br />∴ The mass of chain per unit angle is<br /><br /><math> <mrow> <mi>λ</mi> <mo>=</mo> <mfrac> <mrow> <mi>m</mi><mo>⁡</mo> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> </mrow> </math><br /><br />∴&nbsp;&nbsp;<math> <mrow> <mo>Δ</mo> <mi>m</mi><mo>⁡</mo> <mo>=</mo> <mi>λ</mi> <mo>Δ</mo> <mi>θ</mi> <mo>=</mo> <mfrac> <mrow> <mi>m</mi><mo>⁡</mo> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> <mo>Δ</mo> <mi>θ</mi> <mo>=</mo> <mfrac> <mrow> <mi>m</mi><mo>⁡</mo> <mo>Δ</mo> <mi>θ</mi> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> </mrow> </math><br /><br />∴&nbsp;&nbsp;<math> <mrow> <mtext>cot</mtext><mtext> </mtext><mtext> </mtext><mi>θ</mi><mo>=</mo><mfrac> <mrow> <mtext>T</mtext><mi>Δ</mi><mi>θ</mi><mo>−</mo><mfenced> <mrow> <mfrac> <mrow> <mi>m</mi><mi>Δ</mi><mi>θ</mi></mrow> <mrow> <mn>2</mn><mi>π</mi></mrow> </mfrac> </mrow> </mfenced><mi>R</mi><msup> <mi>ω</mi> <mn>2</mn> </msup> </mrow> <mrow> <mfenced> <mrow> <mfrac> <mi>m</mi> <mrow> <mn>2</mn><mi>π</mi></mrow> </mfrac> <mi>Δ</mi><mi>θ</mi></mrow> </mfenced><mi>g</mi></mrow> </mfrac> </mrow> </math><br /><br />∴&nbsp;&nbsp;<math> <mrow> <mi></mi><mi></mi><mi></mi><mi>T</mi><mo>⁡</mo> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi></mi><mi></mi><mi></mi><mi>R</mi><mo>⁡</mo> <msup> <mi>ω</mi> <mn>2</mn> </msup> <mo>+</mo> <mtext>g</mtext> <mspace width=\"0.5em\"></mspace> <mtext>cot</mtext> <mspace width=\"0.5em\"></mspace> <mi>θ</mi> </mrow> </mfenced> <mfrac> <mrow> <mi>m</mi><mo>⁡</mo> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ddb06d68f183d996", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "71", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A cylinder of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> is kept on an inclined plane having an angle of inclination <math><mn>30</mn><mo>°</mo></math>. Axis of the cylinder makes an angle<math><mi>&nbsp;</mi><mn>30</mn><mo>°</mo><mi>&nbsp;</mi></math>with the line along the greatest slope. Assuming that cylinder rolls without slipping, the acceleration of the cylinder is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image7-b92f4eef-008f-4837-acdf-6ab42467491a.jpg\" style=\"height: 184px; width: 250px;\" />", "image": null}, "options": [{"id": "Gc97D", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>g</mi><mn>6</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "hiC9j", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>g</mi><mn>4</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "fvhMS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>g</mi><mn>3</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "1IvfY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>g</mi><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Acceleration of the cylinder is given by<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><mi>m</mi><mi>g</mi><mi>sin</mi><mo>⁡</mo><mi mathvariant=\"normal\">θ</mi><mi>sin</mi><mo>⁡</mo><mi mathvariant=\"normal\">α</mi></mrow><mrow><mi>m</mi><mo>+</mo><mfrac bevelled=\"true\"><mi>m</mi><mn>2</mn></mfrac></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><mn>2</mn><mi>g</mi><mi>sin</mi><mo>⁡</mo><mi mathvariant=\"normal\">θ</mi><mi>sin</mi><mo>⁡</mo><mi mathvariant=\"normal\">α</mi></mrow><mn>3</mn></mfrac><mo>=</mo><mfrac><mi>g</mi><mn>6</mn></mfrac></math><br /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image7-b92f4eef-008f-4837-acdf-6ab42467491a.jpg\" style=\"height: 184px; width: 250px;\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863da33c72b533fd427", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "39", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An equilateral prism of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> rests on a rough horizontal surface, with a coefficient of friction <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>μ</mi></math>. A horizontal force&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi></math> is applied to the prism, as shown in the figure. If the coefficient of friction is sufficiently high, so that the prism does not slide before toppling, then the minimum force required to topple the prism is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/120447_que.JPG\" style=\"width: 180px; height: 130px;\" />", "image": null}, "options": [{"id": "gcbwE", "text": "<math><mfrac><mrow><mi>m</mi><mi>g</mi></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "yvqPY", "text": "<math><mfrac><mrow><mi>m</mi><mi>g</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "ZEcqM", "text": "<math><mfrac><mrow><mi>μ</mi><mi>m</mi><mi>g</mi></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "FcfIK", "text": "<math><mfrac><mrow><mi>μ</mi><mi>m</mi><mi>g</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The prism will topple after&nbsp;normal reaction shifts to the rightmost part of the prism.</p><p>Hence, at that time, equating torque about the toppling point ( rightmost point of the prism) due to force&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi></math>&nbsp;and force due to gravity&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mi>g</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>×</mo><mfenced separators=\"|\"><mfrac><mrow><mi>a</mi><msqrt><mn>3</mn></msqrt></mrow><mn>2</mn></mfrac></mfenced><mo>=</mo><mi>m</mi><mi>g</mi><mfrac><mi>a</mi><mn>2</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>F</mi><mo>=</mo><mfrac><mrow><mi>m</mi><mi>g</mi></mrow><msqrt><mn>3</mn></msqrt></mfrac></math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/120447_solu.JPG\" style=\"width: 180px; height: 129px;\" /></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863cf5eeda0bc39c547", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "13", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A motor generates an output power of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>220</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">W</mi></math> at an angular velocity of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2100</mn><mo>&nbsp;</mo><mi>rpm</mi></math>. Calculate&nbsp;the torque (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>) produced by the motor? [Take&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">π</mi><mo>=</mo><mfrac><mn>22</mn><mn>7</mn></mfrac></math>]", "image": null}, "options": [], "correctValue": "01.00", "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#969;</mi><mo>=</mo><mn>2100</mn><mo>&#215;</mo><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi></mrow><mn>60</mn></mfrac><mo>=</mo><mn>70</mn><mi mathvariant=\"normal\">&#960;</mi><mo>&#160;</mo><mi>rad</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mi>&#964;</mi><mi>&#969;</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#964;</mi><mo>=</mo><mfrac><mi mathvariant=\"italic\">P</mi><mi mathvariant=\"italic\">&#969;</mi></mfrac><mo>=</mo><mfrac><mrow><mn>220</mn><mo>&#215;</mo><mn>7</mn></mrow><mrow><mn>70</mn><mo>&#215;</mo><mn>22</mn></mrow></mfrac><mo>=</mo><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863cad7fe4378c45076", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "60", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A sphere is rotating between two rough inclined walls as shown in figure. Coefficient of friction between each wall and the sphere is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac bevelled=\"true\"><mn>1</mn><mn>3</mn></mfrac></math>. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>f</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>f</mi><mn>2</mn></msub></math> be the frictional forces at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Q</mi></math>. Then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>f</mi><mn>1</mn></msub><msub><mi>f</mi><mn>2</mn></msub></mfrac></math>&nbsp;is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0030348_Question.jpg\" style=\"width: 180px; height: 136px;\" />", "image": null}, "options": [{"id": "jfTQC", "text": "<math> <mrow> <mfrac> <mrow> <mn>4</mn> </mrow> <mrow> <msqrt> <mn>3</mn> </msqrt> </mrow> </mfrac> <mo>+</mo> <mn>1</mn> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "YNOVF", "text": "<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <msqrt> <mn>3</mn> </msqrt> </mrow> </mfrac> <mo>+</mo> <mn>2</mn> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "NvSFS", "text": "<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>+</mo> <msqrt><mn>3</mn> </msqrt></mrow> </math>", "image": null, "isCorrect": false}, {"id": "1Qu25", "text": "<math> <mrow> <mn>1</mn> <mo>+</mo> <mn>2</mn> <msqrt> <mn>3</mn> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>μ</mi></math> be the friction coefficient between sphere and each wall. Free body diagram of sphere is<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0030348_Ans_._..jpg\" style=\"width: 180px; height: 133px;\" /><br /><br />Net force on the sphere in horizontal diarection is zero.<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><msub><mi>N</mi><mn>1</mn></msub><mi>cos</mi><msup><mn>60</mn><mi mathvariant=\"normal\">ο</mi></msup><mo>+</mo><mi>μ</mi><msub><mi>N</mi><mn>2</mn></msub><mi>cos</mi><msup><mn>60</mn><mi mathvariant=\"normal\">ο</mi></msup><mo>=</mo><msub><mi>N</mi><mn>2</mn></msub><mi>cos</mi><msup><mn>30</mn><mi mathvariant=\"normal\">ο</mi></msup><mo>+</mo><mi>μ</mi><msub><mi>N</mi><mn>1</mn></msub><mi>cos</mi><msup><mn>30</mn><mi mathvariant=\"normal\">ο</mi></msup></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msub><mi>N</mi><mn>1</mn></msub><mo>+</mo><mi>μ</mi><msub><mi>N</mi><mn>2</mn></msub><mo>=</mo><msqrt><mn>3</mn></msqrt><mfenced><mrow><msub><mi>N</mi><mn>2</mn></msub><mo>+</mo><mi>μ</mi><msub><mi>N</mi><mn>1</mn></msub></mrow></mfenced></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msub><mi>N</mi><mn>1</mn></msub><mfenced><mrow><mn>1</mn><mo>-</mo><msqrt><mn>3</mn></msqrt><mi>μ</mi></mrow></mfenced><mo>=</mo><msub><mi>N</mi><mn>2</mn></msub><mfenced><mrow><msqrt><mn>3</mn></msqrt><mo>-</mo><mi>μ</mi></mrow></mfenced></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><msub><mi>N</mi><mn>1</mn></msub><msub><mi>N</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><mrow><msqrt><mn>3</mn></msqrt><mo>-</mo><mi>μ</mi></mrow><mrow><mn>1</mn><mo>-</mo><msqrt><mn>3</mn></msqrt><mi>μ</mi></mrow></mfrac></math><br />Substituting <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>μ</mi><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac></math> we get,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><msub><mi>N</mi><mn>1</mn></msub><msub><mi>N</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><mrow><msqrt><mn>3</mn></msqrt><mo>-</mo><mfrac><mn>1</mn><mn>3</mn></mfrac></mrow><mrow><mn>1</mn><mo>-</mo><mfrac><msqrt><mn>3</mn></msqrt><mn>3</mn></mfrac></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn><msqrt><mn>3</mn></msqrt><mo>-</mo><mn>1</mn></mrow><mrow><mn>3</mn><mo>-</mo><msqrt><mn>3</mn></msqrt></mrow></mfrac><mo>=</mo><mn>1</mn><mo>+</mo><mfrac><mn>4</mn><msqrt><mn>3</mn></msqrt></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>⇒</mi><mfrac><msub><mi>f</mi><mn>1</mn></msub><msub><mi>f</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><mrow><mi>μ</mi><msub><mi>N</mi><mn>1</mn></msub></mrow><mrow><mi>μ</mi><msub><mi>N</mi><mn>2</mn></msub></mrow></mfrac><mo>=</mo><mn>1</mn><mo>+</mo><mfrac><mn>4</mn><msqrt><mn>3</mn></msqrt></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c78ecd92e62361a2", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "27", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The figure shows a fixed incline plane on which a plank is being pulled upwards such that the centre&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math> of the solid cylinder remains at rest with respect to ground. If&nbsp;no slipping takes place between the cylinder and the plank, then the acceleration of&nbsp;the plank is<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0030262_Question.jpg\" style=\"width: 238px; height: 168px;\" />", "image": null}, "options": [{"id": "9ut6i", "text": "<math> <mrow> <mfrac> <mrow> <mtext>g</mtext> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mspace width=\"0.5em\"></mspace> <mtext>sin</mtext> <mspace width=\"0.5em\"></mspace> <mi mathvariant=\"normal\">&theta;</mi> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "Wg9MY", "text": "<math> <mrow> <mn>2</mn> <mtext>g</mtext> <mspace width=\"0.5em\"></mspace> <mtext>sin</mtext> <mspace width=\"0.5em\"></mspace> <mi mathvariant=\"normal\">θ</mi> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "QJmUn", "text": "<math> <mrow> <mtext>g</mtext> <mspace width=\"0.5em\"></mspace> <mtext>sin</mtext> <mspace width=\"0.5em\"></mspace> <mi mathvariant=\"normal\">&theta;</mi> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "oxJy1", "text": "<math> <mrow> <msqrt> <mn>2</mn> </msqrt> <mtext>g</mtext> <mspace width=\"0.5em\"></mspace> <mtext>sin</mtext> <mspace width=\"0.5em\"></mspace> <mi mathvariant=\"normal\">&theta;</mi> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Linear acceleration of cylinder is zero, i.e.,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>mg</mi><mo>&nbsp;</mo><mi>sin</mi><mo>&nbsp;</mo><mi mathvariant=\"normal\">θ</mi><mo>=</mo><mi mathvariant=\"normal\">f</mi></math>&nbsp; &nbsp; &nbsp; ( here <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">f</mi></math>&nbsp;= frictional force upwards )</p><p>Angular acceleration about the centre&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">α</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">τ</mi><mi mathvariant=\"normal\">I</mi></mfrac></math><br /><br />or&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">α</mi><mo>=</mo><mfrac><mtext>fR</mtext><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mtext>mR</mtext><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mfrac><mtext>2f</mtext><mtext>mR</mtext></mfrac></math><br /><br />or&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">α</mi><mo>=</mo><mfrac><mrow><mtext>2mg sin</mtext><mspace width=\"0.5em\"></mspace><mi mathvariant=\"normal\">θ</mi></mrow><mtext>mR</mtext></mfrac><mo>=</mo><mfrac><mrow><mtext>2g sin</mtext><mspace width=\"0.5em\"></mspace><mi mathvariant=\"normal\">θ</mi></mrow><mtext>R</mtext></mfrac></math><br /><br />For no slipping between cylinder and plank</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">a</mi><mo>=</mo><mtext>R</mtext><mi mathvariant=\"normal\">α</mi><mo>=</mo><mtext>2g sin</mtext><mi mathvariant=\"normal\">θ</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c4d795d7d61b2cdb", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "96", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A wheel of the radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> can rotate freely about its axis. A string is wrapped over its rim and a mass of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&nbsp;</mo><mi>kg</mi></math> is hung. An angular acceleration of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>&nbsp;</mo><mi>rad</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math> is produced in it due to the torque. Then, the moment of inertia of the wheel is&nbsp; (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mo>=</mo><mn>10</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math><sup> </sup>)", "image": null}, "options": [{"id": "GYf6V", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi>kg</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math><div id=\"gtx-trans\" style=\"position: absolute; left: 126px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "HSpzv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi>kg</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math>", "image": null, "isCorrect": false}, {"id": "DVop1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&nbsp;</mo><mi>kg</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math>", "image": null, "isCorrect": false}, {"id": "1RMQB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>&nbsp;</mo><mi>kg</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math>,<br />&nbsp;<br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp; &nbsp; <math> <mrow> <mi>&#945;</mi> <mo>=</mo> <mn>8</mn> <mtext>&#160;rad&#160;</mtext> <msup> <mtext>s</mtext> <mrow> <mo>-</mo> <mn>2</mn> </mrow> </msup> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>=</mo><mn>4</mn><mo>&#160;</mo><mi>kg</mi></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>&#160;</mo><mo>=</mo><mo>?</mo></math><br />&nbsp;<br />Torque,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#964;</mi><mo>=</mo><mi>I</mi><mi>&#945;</mi></math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0009757_AnsExp1_1.jpg\" style=\"max-width:100%; object-fit:contain\" /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mtext mathvariant=\"italic\">mgr</mtext><mo>=</mo><mtext mathvariant=\"italic\">I</mtext><mi>&#945;</mi></math><br />&nbsp;<br />or&nbsp;<math> <mrow> <mn>4</mn> <mo>&#215;</mo> <mn>1</mn> <mn>0</mn> <mo>&#215;</mo> <mtext>0.4</mtext> <mo>=</mo> <mtext>I</mtext> <mo>&#215;</mo> <mn>8</mn> </mrow> </math><br />&nbsp;<br /><math><mrow><mo>&#8658;</mo></mrow></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mfrac linethickness=\"1\"><mn>16</mn><mn>8</mn></mfrac><mo>=</mo><mn>2</mn><mo>&#160;</mo><mi>kg</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math><br />&nbsp;<br />Or&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mn>2</mn><mo>&#160;</mo><msup><mtext>kg&#160;m</mtext><mn>2</mn></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863abc88fe34cfb33ac", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "81", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Consider a uniform disc in the x-y plane free to rotate about an axis parallel to the Z-axis as shown (passing through the centre). A force of 4N applied at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>4</mn><mo>,</mo><mn>3</mn></mrow></mfenced></math>&nbsp;along y-axis, as shown produces an angular acceleration of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math> . Locate the centre of mass of the disc if the mass of the disc is 2 kg.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/0261598_nta.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 180px; height: 103px;\" />", "image": null}, "options": [{"id": "vr6VZ", "text": "(1, 3)", "image": null, "isCorrect": false}, {"id": "rS52O", "text": "(2, 3)", "image": null, "isCorrect": true}, {"id": "nwa8a", "text": "(0, 3)", "image": null, "isCorrect": false}, {"id": "TnDq8", "text": "(4, 3)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As <math><mi>&#964;</mi><mo>=</mo><mi>I</mi><mi>&#945;</mi></math><br /><br /><math><mn>4</mn><mfenced separators=\"|\"><mrow><mi>R</mi></mrow></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mfenced separators=\"|\"><mrow><mn>2</mn></mrow></mfenced><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced><mi>&#160;</mi><mfenced separators=\"|\"><mrow><mn>2</mn></mrow></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>R</mi><mo>=</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math><br /><br />Thus, COM is at (2, 3)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a86ad4fcc8c58b50", "type": "singleCorrect", "level": 1, "quest /mtext><mrow><mn>2</mn><mi>u</mi><mi>sin</mi><mfenced><mi mathvariant=\"normal\">&#952;</mi></mfenced></mrow></mfrac></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mi>m</mi><msup><mi>u</mi><mn>2</mn></msup><mi>sin</mi><mfenced><mrow><mn>2</mn><mi mathvariant=\"normal\">&#952;</mi></mrow></mfenced></mrow><mn>2</mn></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86388597e698e479dfa", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "30", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A solid spherical ball of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>9</mn></mfrac><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>&nbsp;is connected to a point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> on the wall with the help of a string which makes an angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>θ</mi><mo>=</mo><mn>45</mn><mo>°</mo></math>&nbsp;with the vertical. The sphere&nbsp;can rotate freely about its central axis and it is set into rotational motion against the vertical face of the wall with an angular velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&nbsp;</mo><mi>rad</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. In how much time (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">s</mi></math>) will it come to rest? [<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">μ</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>1</mn></math>]<br />\r<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/cd9b5746-cbb4-4d44-b94e-c7344643f06e-image11.jpeg\" style=\"height: 118px; width: 220px;\" />", "image": null}, "options": [], "correctValue": "20", "solution": {"text": "FBD of the spherical ball<br /><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/08168956-1d70-42a0-97b0-8bba646da59e-image12.jpeg\" style=\"height: 157px; width: 220px;\" /><br /><br />For translational equilibrium<br /><math><mi>T</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mn>45</mn><mo>°</mo><mo>=</mo><mi>M</mi><mi>g</mi><mo>+</mo><mi mathvariant=\"normal\">μ</mi><mi mathvariant=\"normal\">N</mi></math><br />T sin15° = N<br />Also <math><mi>τ</mi><mi mathvariant=\"normal\">Δ</mi><mi>t</mi><mo>=</mo><mi mathvariant=\"normal\">Δ</mi><mi>L</mi></math><br /><math><mo>⇒</mo><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">μ</mi><mi>N</mi><mi>R</mi></mrow></mfenced><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Δ</mi><mi>t</mi><mo>=</mo><mi>I</mi><msub><mrow><mi mathvariant=\"normal\">ω</mi></mrow><mrow><mn>0</mn></mrow></msub></math><br /><math><mi mathvariant=\"normal\">Δ</mi><mi>t</mi><mo>=</mo><mfrac><mrow><mfrac><mrow><mn>2</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mi>M</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><msub><mrow><mi>ω</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mi>μ</mi><mi>N</mi><mi>R</mi></mrow></mfrac></math><br />Solving we get t = 20 s", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637cd284b06a25fe7c", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "06", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>The toy-top (initially at rest)&nbsp;shown in the figure, has a moment of inertia <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup><mo>&nbsp;</mo><mi>kg</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math>&nbsp;and it is&nbsp;free to rotate about the stationary axis&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>A</mi><mo>'</mo></math>. The&nbsp;string wrapped around the&nbsp;peg&nbsp;of the toy-top is pulled outwards without&nbsp;letting it slip and simultaneously maintaining&nbsp;a constant tension of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>.</mo><mn>625</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi></math>. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ω</mi></math>&nbsp;is the angular speed (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>rad</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>) of the top after&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>80</mn><mo>&nbsp;</mo><mi>cm</mi></math>&nbsp;of string has been pulled off the peg, then mark your answer as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>ω</mi><mn>100</mn></mfrac></math>.</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/627076_queaefnd_phy.png\" style=\"width: 180px; height: 230px;\" /></p>\r", "image": null}, "options": [], "correctValue": "1.50", "solution": {"text": "Work done<br /><br /><math> <mrow> <mo>=</mo><mtext>F</mtext><mo>×</mo><mi>Δ</mi><mtext>r</mtext><mo>=</mo><mn>5.625</mn><mo>×</mo><mn>0.8</mn><mtext> </mtext><mtext>m</mtext><mo>=</mo><mn>4.5</mn><mtext> </mtext><mtext>J</mtext></mrow> </math> and<br /><br />work done <math> <mrow> <mo>=</mo><mi>Δ</mi><mtext>K</mtext><mo>=</mo><mfrac> <mn>1</mn> <mn>2</mn> </mfrac> <msubsup> <mrow> <mtext>Iω</mtext></mrow> <mtext>r</mtext> <mtext>2</mtext> </msubsup> <mo>−</mo><mfrac> <mn>1</mn> <mn>2</mn> </mfrac> <msubsup> <mrow> <mtext>Iω</mtext></mrow> <mtext>1</mtext> <mtext>2</mtext> </msubsup> </mrow> </math><br /><br /><math> <mrow> <mo>∴</mo><mn>4.5</mn><mo>=</mo><mfrac> <mn>1</mn> <mn>2</mn> </mfrac> <mo>×</mo><mn>4</mn><mo>×</mo><msup> <mrow> <mn>10</mn></mrow> <mrow> <mo>−</mo><mn>4</mn></mrow> </msup> <mo>×</mo><msubsup> <mtext>ω</mtext> <mtext>r</mtext> <mtext>2</mtext> </msubsup> <mo>−</mo><mn>0</mn></mrow> </math><br /><br /><math> <mrow> <mn>...</mn></mrow> </math> (<math> <mo>∵</mo> </math> top starts from rest, <math> <mrow> <msub> <mi>ω</mi> <mtext>i</mtext> </msub> <mo>=</mo><mn>0</mn></mrow> </math>)<br /><br /><math> <mrow> <msub> <mtext>ω</mtext> <mtext>f</mtext> </msub> <mo>=</mo><mn>150</mn><mtext> </mtext><mtext>rad/s</mtext></mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637a4fb46a3f4ff979", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "16", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A sphere is rotating between two rough inclined walls as shown in figure. Coefficient of friction between each wall and the sphere is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac bevelled=\"true\"><mn>1</mn><mn>3</mn></mfrac></math>. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>f</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>f</mi><mn>2</mn></msub></math> be the frictional forces at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Q</mi></math>. Then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>f</mi><mn>1</mn></msub><msub><mi>f</mi><mn>2</mn></msub></mfrac></math>&nbsp;is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0030348_Question.jpg\" style=\"width: 250px; height: 189px;\" />", "image": null}, "options": [{"id": "5asJU", "text": "<math> <mrow> <mfrac> <mrow> <mn>4</mn> </mrow> <mrow> <msqrt> <mn>3</mn> </msqrt> </mrow> </mfrac> <mo>+</mo> <mn>1</mn> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "jjxuK", "text": "<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <msqrt> <mn>3</mn> </msqrt> </mrow> </mfrac> <mo>+</mo> <mn>2</mn> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "7o9Jj", "text": "<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>+</mo> <msqrt><mn>3</mn> </msqrt></mrow> </math>", "image": null, "isCorrect": false}, {"id": "0Jtlt", "text": "<math> <mrow> <mn>1</mn> <mo>+</mo> <mn>2</mn> <msqrt> <mn>3</mn> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#956;</mi></math> be the friction coefficient between sphere and each wall. Free body diagram of sphere is<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0030348_Ans_._..jpg\" style=\"width: 250px; height: 185px;\" /><br /><br />Net force on the sphere in horizontal diarection is zero.<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><msub><mi>N</mi><mn>1</mn></msub><mi>cos</mi><msup><mn>60</mn><mi mathvariant=\"normal\">&#959;</mi></msup><mo>+</mo><mi>&#956;</mi><msub><mi>N</mi><mn>2</mn></msub><mi>cos</mi><msup><mn>60</mn><mi mathvariant=\"normal\">&#959;</mi></msup><mo>=</mo><msub><mi>N</mi><mn>2</mn></msub><mi>cos</mi><msup><mn>30</mn><mi mathvariant=\"normal\">&#959;</mi></msup><mo>+</mo><mi>&#956;</mi><msub><mi>N</mi><mn>1</mn></msub><mi>cos</mi><msup><mn>30</mn><mi mathvariant=\"normal\">&#959;</mi></msup></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>N</mi><mn>1</mn></msub><mo>+</mo><mi>&#956;</mi><msub><mi>N</mi><mn>2</mn></msub><mo>=</mo><msqrt><mn>3</mn></msqrt><mfenced><mrow><msub><mi>N</mi><mn>2</mn></msub><mo>+</mo><mi>&#956;</mi><msub><mi>N</mi><mn>1</mn></msub></mrow></mfenced></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>N</mi><mn>1</mn></msub><mfenced><mrow><mn>1</mn><mo>-</mo><msqrt><mn>3</mn></msqrt><mi>&#956;</mi></mrow></mfenced><mo>=</mo><msub><mi>N</mi><mn>2</mn></msub><mfenced><mrow><msqrt><mn>3</mn></msqrt><mo>-</mo><mi>&#956;</mi></mrow></mfenced></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><msub><mi>N</mi><mn>1</mn></msub><msub><mi>N</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><mrow><msqrt><mn>3</mn></msqrt><mo>-</mo><mi>&#956;</mi></mrow><mrow><mn>1</mn><mo>-</mo><msqrt><mn>3</mn></msqrt><mi>&#956;</mi></mrow></mfrac></math><br />Substituting <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#956;</mi><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac></math> we get,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><msub><mi>N</mi><mn>1</mn></msub><msub><mi>N</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><mrow><msqrt><mn>3</mn></msqrt><mo>-</mo><mfrac><mn>1</mn><mn>3</mn></mfrac></mrow><mrow><mn>1</mn><mo>-</mo><mfrac><msqrt><mn>3</mn></msqrt><mn>3</mn></mfrac></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn><msqrt><mn>3</mn></msqrt><mo>-</mo><mn>1</mn></mrow><mrow><mn>3</mn><mo>-</mo><msqrt><mn>3</mn></msqrt></mrow></mfrac><mo>=</mo><mn>1</mn><mo>+</mo><mfrac><mn>4</mn><msqrt><mn>3</mn></msqrt></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#8658;</mi><mfrac><msub><mi>f</mi><mn>1</mn></msub><msub><mi>f</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><mrow><mi>&#956;</mi><msub><mi>N</mi><mn>1</mn></msub></mrow><mrow><mi>&#956;</mi><msub><mi>N</mi><mn>2</mn></msub></mrow></mfrac><mo>=</mo><mn>1</mn><mo>+</mo><mfrac><mn>4</mn><msqrt><mn>3</mn></msqrt></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863666a0a6dcb78a7b9", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "25", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>T&nbsp;</mtext></math>shaped uniform density object with dimensions shown in the figure is lying on a smooth floor. A force <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mtext>F</mtext><mo>→</mo></mover></math> is applied at the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>P</mtext></math>&nbsp;parallel to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>AB</mtext></math>&nbsp;such that the object has only the translational motion without rotation. Find the location of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>P</mtext></math> with respect to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>C</mtext></math>.<br />\r<style type=\"text/css\"><!--\r\t\t@page { margin: 2cm }\r\t\tP { margin-bottom: 0.21cm }\r\t-->\r</style>\r<p style=\"margin-bottom: 0cm\"><img alt=\"\" height=\"208\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/content_2269.png\" width=\"172\" /></p>\r", "image": null}, "options": [{"id": "pZLu0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>3</mn></mfrac><mtext>l</mtext></math>", "image": null, "isCorrect": true}, {"id": "CdUZz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>l</mtext></math>", "image": null, "isCorrect": false}, {"id": "YNy6u", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>4</mn></mfrac><mi mathvariant=\"normal\">l</mi></math>", "image": null, "isCorrect": false}, {"id": "J4Dg0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>2</mn></mfrac><mi mathvariant=\"normal\">l</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>It is a case of translation motion without rotation. The force should act at the centre of mass<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext>Y</mtext><mtext>cm</mtext></msub><mo>=</mo><mfrac><mrow><mfenced><mrow><mtext>m</mtext><mo>×</mo><mn>2</mn><mtext>l</mtext></mrow></mfenced><mo>+</mo><mfenced><mrow><mn>2</mn><mtext>m</mtext><mo>×</mo><mtext>l</mtext></mrow></mfenced></mrow><mrow><mtext>m</mtext><mo>+</mo><mn>2</mn><mtext>m</mtext></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>4</mn><mtext>l</mtext></mrow><mn>3</mn></mfrac></math></p><p>( considering point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math>&nbsp;as origin )</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86360906e4eeb048576", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "18", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a",
