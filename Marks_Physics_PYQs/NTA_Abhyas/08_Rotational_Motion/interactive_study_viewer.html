e <math><mi>A</mi><mi>B</mi></math>. If the angular momentum of the particle with respect to origin <math><mi>O</mi></math> is <math><msub><mrow><mi>L</mi></mrow><mrow><mi>A</mi></mrow></msub></math> when it is at <math><mi>A</mi></math> and <math><msub><mrow><mi>L</mi></mrow><mrow><mi>B</mi></mrow></msub></math> when it is at <math><mi>B</mi></math>, then<br />\r<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-06-30_at_4.56.30_PM.jpeg\" style=\"width: 180px; height: 145px;\" />", "image": null}, "options": [{"id": "eakDd", "text": "<math><msub><mrow><mi>L</mi></mrow><mrow><mi>A</mi></mrow></msub><mo>&gt;</mo><msub><mrow><mi>L</mi></mrow><mrow><mi>B</mi></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "x0RFp", "text": "<math><msub><mrow><mi>L</mi></mrow><mrow><mi>A</mi></mrow></msub><mo>=</mo><msub><mrow><mi>L</mi></mrow><mrow><mi>B</mi></mrow></msub></math>", "image": null, "isCorrect": true}, {"id": "2GaA2", "text": "The relationship between <math><msub><mrow><mi>L</mi></mrow><mrow><mi>A</mi></mrow></msub></math> and <math><msub><mrow><mi>L</mi></mrow><mrow><mi>B</mi></mrow></msub></math> depends upon the slope of the line <math><mi>A</mi><mi>B</mi></math>", "image": null, "isCorrect": false}, {"id": "euJKl", "text": "<math><msub><mrow><mi>L</mi></mrow><mrow><mi>A</mi></mrow></msub><mo>&lt;</mo><msub><mrow><mi>L</mi></mrow><mrow><mi>B</mi></mrow></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From the definition of angular momentum,<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-06-30_at_5.01.27_PM.jpeg\" style=\"width: 200px; height: 139px;\" /><br /><br /><math><mi mathvariant=\"bold\">L</mi><mo>=</mo><mi mathvariant=\"bold\">r</mi><mo>×</mo><mi mathvariant=\"bold\">p</mi><mo>=</mo><mi>r</mi><mi>m</mi><mi>v</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">∅</mi><mo>(</mo><mo>-</mo><mover accent=\"true\"><mrow><mi mathvariant=\"bold\">k</mi></mrow><mo>^</mo></mover><mo>)</mo></mrow></mrow></math><br /><br />Therefore, the magnitude of <math><mi>L</mi></math> is<br /><br /><math><mi>L</mi><mo>=</mo><mi>m</mi><mi>v</mi><mi>r</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>∅</mi><mo>=</mo><mi>m</mi><mi>v</mi><mi>d</mi></mrow></mrow></math><br /><br />where <math><mi>d</mi><mo>=</mo><mi>r</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>∅</mi></mrow></mrow></math> is the distance of closest approach of the particle to the origin. As <math><mi>d</mi></math> is same for both the particles, hence <math><msub><mrow><mi>L</mi></mrow><mrow><mi>A</mi></mrow></msub><mo>=</mo><msub><mrow><mi>L</mi></mrow><mrow><mi>B</mi></mrow></msub></math>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638efe21f2c878c6f0", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "59", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A particle of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>, initial speed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>u</mi></math>&nbsp;and angle of projection <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>θ</mi></math>, is projected&nbsp;as shown in the figure. Average torque on the projectile between initial and final positions&nbsp; P&nbsp;&nbsp;and&nbsp;&nbsp;Q about the point of projection is&nbsp;<br />\r&nbsp; <img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0030253_Question.jpg\" style=\"width: 188px; height: 153px;\" />", "image": null}, "options": [{"id": "OJ0KH", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>m</mi><msup><mi>u</mi><mn>2</mn></msup><mi>sin</mi><mfenced><mrow><mn>2</mn><mi>&#x3B8;</mi></mrow></mfenced></mrow><mn>2</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "ghIoR", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><msup><mi>u</mi><mn>2</mn></msup><mi>cos</mi><mfenced><mi>&#x3B8;</mi></mfenced></math>", "image": null, "isCorrect": false}, {"id": "wOR9E", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><msup><mi>u</mi><mn>2</mn></msup><mi>sin</mi><mfenced><mi mathvariant=\"normal\">&#x3B8;</mi></mfenced></math>", "image": null, "isCorrect": false}, {"id": "smrx3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>m</mi><msup><mi>u</mi><mn>2</mn></msup><mi>cos</mi><mfenced><mi>&#x3B8;</mi></mfenced></mrow><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mover><mi>&#964;</mi><mo>&#8594;</mo></mover><mrow><mi mathvariant=\"normal\">&#945;</mi><mtext>v</mtext></mrow></msub><mo>&#215;</mo><mi mathvariant=\"normal\">&#916;</mi><mi>t</mi><mo>=&#916;</mo><mover><mi>L</mi><mo>&#8594;</mo></mover></math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(1)<br /><br />Here, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#916;</mi><mi>t</mi></math> = time of flight = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mi>u</mi><mi>sin</mi><mfenced><mi mathvariant=\"normal\">&#952;</mi></mfenced></mrow><mi mathvariant=\"normal\">g</mi></mfrac></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"|\" close=\"|\"><mrow><mover><mi mathvariant=\"normal\">&#916;</mi><mo>&#8594;</mo></mover><mi>L</mi></mrow></mfenced><mo>=</mo><mfenced open=\"|\" close=\"|\"><mrow><msub><mover><mi>L</mi><mo>&#8594;</mo></mover><mtext>f</mtext></msub><mo>-</mo><msub><mover><mi>L</mi><mo>&#8594;</mo></mover><mtext>i</mtext></msub></mrow></mfenced></math> about the point of projection.<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced><mrow><mi>m</mi><mi>u</mi><mi>sin</mi><mfenced><mi mathvariant=\"normal\">&#952;</mi></mfenced></mrow></mfenced><mfenced><mtext>range</mtext></mfenced><mo>-</mo><mn>0</mn></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mfenced><mrow><mi>m</mi><mi>u</mi><mi>sin</mi><mfenced><mi mathvariant=\"normal\">&#952;</mi></mfenced></mrow></mfenced><mfenced><mrow><msup><mi>u</mi><mn>2</mn></msup><mi>sin</mi><mfenced><mrow><mn>2</mn><mi mathvariant=\"normal\">&#952;</mi></mrow></mfenced></mrow></mfenced></mrow><mtext>g</mtext></mfrac></math><br /><br />&there4;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"|\" close=\"|\"><msub><mover><mi mathvariant=\"normal\">&#964;</mi><mo>&#8594;</mo></mover><mrow><mi>a</mi><mtext>v</mtext></mrow></msub></mfenced><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">&#916;</mi><mi>L</mi></mrow><mrow><mi mathvariant=\"normal\">&#916;</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>m</mi><msup><mi>u</mi><mn>3</mn></msup><mi>sin</mi><mfenced><mi mathvariant=\"normal\">&#952;</mi></mfenced><mi>sin</mi><mfenced><mrow><mn>2</mn><mn>&#952;</mn></mrow></mfenced></mrow><mtext>g</mtext></mfrac><mfrac><mtext>g</mtext><mrow><mn>2</mn><mi>u</mi><mi>sin</mi><mfenced><mi mathvariant=\"normal\">&#952;</mi></mfenced></mrow></mfrac></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mi>m</mi><msup><mi>u</mi><mn>2</mn></msup><mi>sin</mi><mfenced><mrow><mn>2</mn><mi mathvariant=\"normal\">&#952;</mi></mrow></mfenced></mrow><mn>2</mn></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86374b436fb4147fe97", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "44", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A particle of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> is projected at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">t</mtext><mtext>&nbsp;=&nbsp;0</mtext></math> from a point <math> <mtext>O</mtext> </math> on the ground with a speed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>0</mn></msub></math>&nbsp;at an angle of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>45</mn><mo>°</mo></math>&nbsp;to the horizontal. The magnitude of the angular momentum of the particle about <math> <mtext>O</mtext> </math> at the time <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">t</mtext><mtext>&nbsp;=&nbsp;</mtext><msub><mtext mathvariant=\"italic\">v</mtext><mn>0</mn></msub><mo>/</mo><mi>g</mi></math>&nbsp;is close to [Take&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>2</mn></msqrt><mo>=</mo><mn>1</mn><mo>.</mo><mn>4</mn></math>]", "image": null}, "options": [{"id": "pQZmZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>0.25</mtext><msubsup><mtext mathvariant=\"italic\">mv</mtext><mn>0</mn><mn>3</mn></msubsup><mo>/</mo><mtext mathvariant=\"italic\">g</mtext></math>", "image": null, "isCorrect": false}, {"id": "HyZTt", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>0.35</mtext><msubsup><mtext mathvariant=\"italic\">mv</mtext><mn>0</mn><mn>3</mn></msubsup><mo>/</mo><mtext mathvariant=\"italic\">g</mtext></math>", "image": null, "isCorrect": true}, {"id": "kC1X2", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>0.50</mtext><msubsup><mtext mathvariant=\"italic\">mv</mtext><mn>0</mn><mn>3</mn></msubsup><mo>/</mo><mtext mathvariant=\"italic\">g</mtext></math>", "image": null, "isCorrect": false}, {"id": "Yxd3C", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>0.60</mtext><msubsup><mtext mathvariant=\"italic\">mv</mtext><mn>0</mn><mn>3</mn></msubsup><mo>/</mo><mtext mathvariant=\"italic\">g</mtext></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using&nbsp;1st-equation&nbsp;of motion <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mi>u</mi><mo>+</mo><mi>a</mi><mi>t</mi></math> along horizontal direction,<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014124_AnsExp2_1.jpg\" style=\"width: 240px; height: 116px;\" /><br /><br /><math> <mrow> <msub> <mtext>v</mtext> <mi>x</mi> </msub> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>v</mtext> <mn>0</mn> </msub> <mo>/</mo> <msqrt> <mn>2</mn> </msqrt> </mrow> </mfenced> <mo>+</mo> <mn>0</mn> <mo>×</mo> <mtext>t</mtext> <mo>=</mo> <mtext>0.7v</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mtext>as</mtext> <mspace width=\"0.5em\"></mspace> <mi>a</mi> <mo>=</mo> <mn>0</mn> </mrow> </mfenced> </mrow> </math><br /><br />and along vertical direction<br /><br /><math> <mrow> <msub> <mtext>v</mtext> <mtext>y</mtext> </msub> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>v</mtext> <mn>0</mn> </msub> <mo>/</mo> <msqrt> <mn>2</mn> </msqrt> </mrow> </mfenced> <mo>-</mo> <mtext>g</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>v</mtext> <mn>0</mn> </msub> <mo>/</mo> <mtext>g</mtext> </mrow> </mfenced> <mo>=</mo> <mo>-</mo> <msub> <mtext>0.3v</mtext> <mn>0</mn> </msub> </mrow> </math><br /><br />So, the velocity of particle at time&nbsp;t&nbsp;= (v<sub>0</sub>/g) in vector form will be<br /><br /><math> <mrow> <mover accent=\"true\"> <mtext>v</mtext> <mo>→</mo> </mover> <mo>=</mo> <mover accent=\"true\"> <mtext>i</mtext> <mo>→</mo> </mover> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>0.7v</mtext> <mn>0</mn> </msub> </mrow> </mfenced> <mo>-</mo> <mover accent=\"true\"> <mtext>j</mtext> <mo>→</mo> </mover> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>0.3v</mtext> <mn>0</mn> </msub> </mrow> </mfenced> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>....(i)</mtext> </mrow> </math><br /><br /><math> <mrow> <mn>Now from 2nd equation of motion&nbsp;</mn> <mtext>s</mtext> <mo>=</mo> <mtext>ut</mtext> <mo>+</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </mfenced> <msup> <mtext>at</mtext> <mn>2</mn> </msup> </mrow> </math> along horizontal direction,<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>x</mtext> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>v</mtext> <mn>0</mn> </msub> </mrow> <mrow> <msqrt> <mn>2</mn> </msqrt> </mrow> </mfrac> <mo>×</mo> <mfrac> <mrow> <msub> <mtext>v</mtext> <mn>0</mn> </msub> </mrow> <mrow> <mtext>g</mtext> </mrow> </mfrac> <mo>=</mo> <mtext>0.7</mtext> <mfrac> <mrow> <msubsup> <mtext>v</mtext> <mn>0</mn> <mn>2</mn> </msubsup> </mrow> <mrow> <mtext>g</mtext> </mrow> </mfrac> </mrow> </math><br /><br />and along vertical direction,<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>y</mtext> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>v</mtext> <mn>0</mn> </msub> </mrow> <mrow> <msqrt> <mn>2</mn> </msqrt> </mrow> </mfrac> <mo>×</mo> <mfrac> <mrow> <msub> <mtext>v</mtext> <mn>0</mn> </msub> </mrow> <mrow> <mtext>g</mtext> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>g</mtext> <msup> <mrow> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mfrac> <mrow> <msub> <mtext>v</mtext> <mn>0</mn> </msub> </mrow> <mrow> <mtext>g</mtext> </mrow> </mfrac> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> <mo>=</mo> <mtext>0.2</mtext> <mfrac> <mrow> <msubsup> <mtext>v</mtext> <mn>0</mn> <mn>2</mn> </msubsup> </mrow> <mrow> <mtext>g</mtext> </mrow> </mfrac> </mrow> </math><br /><br />So the position vector <math> <mrow> <mover accent=\"true\"> <mtext>r</mtext> <mo>→</mo> </mover> </mrow> </math> at the t ( = v<sub>0</sub>/g) will be<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mover accent=\"true\"> <mtext>r</mtext> <mo>→</mo> </mover> <mo>=</mo> <mover accent=\"true\"> <mtext>i</mtext> <mo>→</mo> </mover> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mtext>0.7</mtext> <mfrac> <mrow> <msubsup> <mtext>v</mtext> <mn>0</mn> <mn>2</mn> </msubsup> </mrow> <mrow> <mtext>g</mtext> </mr ": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The moment of inertia of a rigid body in terms of its angular momentum <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math> and kinetic energy <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi></math>&nbsp;is", "image": null}, "options": [{"id": "esAaf", "text": "<math><mfrac><mrow><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>K</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "88Usi", "text": "<math><mfrac><mrow><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><mi>K</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "rAIdf", "text": "<math><mfrac><mrow><mi>L</mi></mrow><mrow><msup><mrow><mn>2</mn><mi>K</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "D1wlo", "text": "<math><mfrac><mrow><mi>L</mi></mrow><mrow><mn>2</mn><mi>K</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Angular momentum of a rigid body about a fixed axis is given by<br /><br /><math><mi>L</mi><mo>=</mo><mi>I</mi><mi>ω</mi></math><br /><br />Where <math><mi>I</mi></math> is moment of inertia and <math><mi>ω</mi></math> is angular velocity about that axis.<br /><br />Kinetic energy of body is given by<br /><br /><math><mi>K</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>&nbsp;</mi><mi>I</mi><msup><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br /><math><mo>∴</mo></math> <math><mi>K</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><mi>I</mi></mrow></mfrac><msup><mrow><mfenced separators=\"|\"><mrow><mi>I</mi><mi>ω</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><mi>I</mi></mrow></mfrac></math><br /><br /
