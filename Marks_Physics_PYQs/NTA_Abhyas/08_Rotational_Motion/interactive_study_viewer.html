mn>2</mn></mfrac></mfenced></mrow></mfenced><mi>&#969;</mi><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><msup><mtext mathvariant=\"italic\">Ma</mtext><mn>2</mn></msup><mi>&#969;</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;&#160;&#160;&#160;</mo><mi>&#969;</mi><mo>=</mo><mn>3</mn><mtext mathvariant=\"italic\">v</mtext><mo>/</mo><mn>4</mn><mtext mathvariant=\"italic\">a</mtext></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863549659031373443e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "88", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A Wheel of moment of inertia <math><mn>2&nbsp;</mn><mn>k</mn><mn>g</mn><mi>&nbsp;</mi><msup><mrow><mn>m</mn></mrow><mrow><mn>2</mn></mrow></msup></math> is rotating about an axis passing through centre and perpendicular to its plane at a speed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>&nbsp;</mo><mi>rad</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. Due to friction, it comes to rest in 5 minutes. The angular momentum of the wheel three minutes before it stops rotating is", "image": null}, "options": [{"id": "Y0Xk0", "text": "<math><mn>24</mn><mi> </mi><mn>&nbsp;k</mn><mn>g</mn><mi> </mi><mrow><mrow><msup><mrow><mn>m</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>/</mo><mrow><mn>s</mn></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "aKZwU", "text": "<math><mn>48</mn><mn>&nbsp;k</mn><mn>g</mn><mi> </mi><mrow><mrow><msup><mrow><mn>m</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>/</mo><mrow><mn>s</mn></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "fNFWZ", "text": "<math><mn>72</mn><mn>&nbsp;k</mn><mn>g</mn><mi>&nbsp;</mi><mrow><mrow><msup><mrow><mn>m</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>/</mo><mrow><mn>s</mn></mrow></mrow></math>", "image": null, "isCorrect": true}, {"id": "4E4qd", "text": "<math><mn>96</mn><mn>&nbsp;k</mn><mn>g</mn><mi> </mi><mrow><mrow><msup><mrow><mn>m</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>/</mo><mrow><mn>s</mn></mrow></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mn>2</mn><mn>&#160;k</mn><mn>g</mn><mo>&#160;</mo><msup><mn>m</mn><mn>2</mn></msup><mo>,</mo><mi>&#160;</mi><msub><mi>&#969;</mi><mi>o</mi></msub><mo>=</mo><mn>60</mn><mi>&#160;</mi><mi>rad</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>5</mn><mi mathvariant=\"normal\">&#160;</mi><mi>min</mi><mo>=</mo><mn>5</mn><mo>&#215;</mo><mn>60</mn><mo>=</mo><mn>300</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">s</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8733;</mo><mi>&#160;</mi><mo>=</mo><mfrac><mrow><mn>0</mn><mo>-</mo><mn>60</mn></mrow><mn>300</mn></mfrac><mo>=</mo><mfrac><mrow><mo>-</mo><mn>60</mn></mrow><mn>300</mn></mfrac><mo>=</mo><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><mn>5</mn></mfrac><mi mathvariant=\"normal\">&#160;</mi><mi>rad</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math><br /><br />for 2min (from starting) (2 min = 120 sec)<br /><br /><math><mi>&#969;</mi><mo>=</mo><msub><mrow><mi>&#969;</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>+</mo><mo>&#8733;</mo><mi>t</mi></math><br /><br /><math><mo>=</mo><mn>60</mn><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mo>&#215;</mo><mn>120</mn><mo>=</mo><mn>60</mn><mo>-</mo><mn>24</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#969;</mi><mo>=</mo><mn>36</mn><mi>&#160;</mi><mi>rad</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">d</mi><mi>&#160;</mi><mi>&#160;</mi><mi>L</mi><mo>=</mo><mi>I</mi><mi>&#969;</mi><mo>=</mo><mn>2</mn><mo>&#215;</mo><mn>36</mn><mo>=</mo><mn>72</mn><mn>&#160;k</mn><mn>g</mn><mi>&#160;</mi><msup><mn>m</mn><mn>2</mn></msup><mo>&#160;</mo><msup><mn>s</mn><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634730246b3a31288e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "30", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A disc of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi>kg</mi></math> and radius <math><mtext>0.2</mtext><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> is rotating with an angular velocity of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&nbsp;</mo><mi>rad</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. The angular velocity of the disc, if a mass of <math><mtext>0.25</mtext><mo>&nbsp;</mo><mi>kg</mi></math> is put on the periphery is", "image": null}, "options": [{"id": "epjmI", "text": "<math><msup><mrow><mn>24</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">d&nbsp;</mi><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "PvXxR", "text": "<math><msup><mrow><mn>36</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">d&nbsp;</mi><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "8bLun", "text": "<math><msup><mrow><mn>15</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">d&nbsp;</mi><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "vjpuO", "text": "<math><msup><mrow><mn>26</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">d&nbsp;</mi><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If no external torque acts on a system of particle then angular momentum of the system remains constant, that is,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#964;</mi><mo>=</mo><mn>0</mn></math><br /><br /><math><mo>&#8658;</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>dL</mi><mi>dt</mi></mfrac><mo>=</mo><mn>0</mn></math><br /><br /><math><mo>&#8658;</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">L</mi><mo>=</mo><mi>I&#969;</mi><mo>=</mo></math>constant<br /><br /><math><mo>&#8658;</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">I</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">&#969;</mi><mn>1</mn></msub><mo>=</mo><msub><mi mathvariant=\"normal\">I</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">&#969;</mi><mn>2</mn></msub></math><br /><br /><math><mo>&#8756;</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mi>Mr</mi><mn>2</mn></msup><msub><mi mathvariant=\"normal\">&#969;</mi><mn>1</mn></msub><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">M</mi><mo>+</mo><mn>2</mn><mi mathvariant=\"normal\">m</mi></mrow></mfenced><msup><mi mathvariant=\"normal\">r</mi><mn>2</mn></msup><msub><mi mathvariant=\"normal\">&#969;</mi><mn>2</mn></msub></math> ...(i)<br /><br />Here, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi><mo>=</mo><mn>2</mn><mo>&#160;</mo><mi>kg</mi></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi><mo>=</mo><mtext>0.25</mtext><mo>&#160;</mo><mi>kg</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi><mo>=</mo><mtext>0.2</mtext><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">&#969;</mi><mn>1</mn></msub><mo>=</mo><mn>30</mn><mi mathvariant=\"normal\">&#160;</mi><mi>rad</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br />Hence, we get after putting the given values in Eq. (i)<br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>&#215;</mo><mn>2</mn><mo>&#215;</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>0.2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>&#215;</mo><mn>30</mn><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>&#215;</mo><mfenced separators=\"|\"><mrow><mn>2</mn><mo>+</mo><mn>2</mn><mo>&#215;</mo><mn>0.25</mn></mrow></mfenced><msup><mrow><mfenced separators=\"|\"><mrow><mn>0.2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>&#215;</mo><msub><mrow><mi>&#969;</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br /><math><mo>&#8658;</mo></math> <math><mn>60</mn><mo>=</mo><mn>2.5</mn><msub><mrow><mi>&#969;</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br /><math><mo>&#8756;</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#969;</mi><mn>2</mn></msub><mo>=</mo><mn>24</mn><mi>&#160;</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">d</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630ff48a9ffec702a1", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "01", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "When a mass is rotated in a plane about <math><mi mathvariant=\"normal\">a</mi></math> fixed point, its angular momentum is directed along the-", "image": null}, "options": [{"id": "A7yGZ", "text": "radius", "image": null, "isCorrect": false}, {"id": "e90yA", "text": "tangent to orbit", "image": null, "isCorrect": false}, {"id": "lKRxp", "text": "axis of rotation", "image": null, "isCorrect": true}, {"id": "qQn3Q", "text": "incline at an angle of  <math><mn>45</mn><mo>°</mo></math>  to plane of rotation", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Angular momentum is directed along the axis of rotation.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86307cab88808f594a4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "07", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A circular platform is free to rotate in a horizontal plane about a vertical axis passing through its centre. A tortoise is sitting at the edge of the platform. Now the platform is given an angular velocity <math><msub><mrow><mi mathvariant=\"normal\">ω</mi></mrow><mrow><mn>0</mn></mrow></msub></math>. When the tortoise moves along a chord of the platform with a constant velocity (w.r.t. the platform), which of the following graphs shows properly the variation of angular velocity of the platform with the time <math><mi>t</mi></math>?", "image": null}, "options": [{"id": "yYr5s", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/628086a.png\" style=\"width: 169px; height: 128px;\" />", "image": null, "isCorrect": false}, {"id": "vJwN4", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/628086b.png\" style=\"width: 166px; height: 149px;\" />", "image": null, "isCorrect": false}, {"id": "hx63G", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/628086c.png\" style=\"width: 167px; height: 141px;\" />", "image": null, "isCorrect": true}, {"id": "oiDlX", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/628086d.png\" style=\"width: 144px; height: 130px;\" />", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As there is no external torque, angular momentum will remain constant. When the tortoise moves from <math><mi>A</mi></math> to <math><mi>C</mi></math>, figure, moment of inertia of the platform and tortoise decreases. Therefore, angular velocity of the system increases. When the tortoise moves from <math><mi>C</mi></math> to <math><mi>B</mi></math>, moment of inertia increases. Therefore, angular velocity decreases<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/628086s.png\" style=\"width: 167px; height: 161px;\" /><br /><br />If, <math><mi>M</mi></math>=mass of platform<br /><br /><math><mi>R</mi><mo>=</mo></math>radius of platform<br /><br /><math><mi>m</mi><mo>=</mo></math>mass of tortoise moving along the chord <math><mi>A</mi><mi>B</mi></math><br /><br /><math><mi>a</mi><mo>=</mo></math>perpendicular distance of <math><mi>O</mi></math> from <math><mi>A</mi><mi>B</mi></math><br /><br />Initial angular momentum, <math><msub><mrow><mi>I</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mi>m</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mfrac><mrow><mi>M</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><br />At any time <math><mi>t</mi></math>, let the tortoise reach <math><mi>D</mi></math> moving with velocity <math><mi>v</mi></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>A</mi><mi>D</mi><mo>=</mo><mi>v</mi><mi>t</mi></math><br /><br /><math><mi>A</mi><mi>C</mi><mo>=</mo><msqrt><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></msqrt></math><br /><br />As <math><mi>D</mi><mi>C</mi><mo>=</mo><mi>A</mi><mi>C</mi><mo>-</mo><mi>A</mi><mi>D</mi><mo>=</mo><mo>(</mo><msqrt><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></msqrt><mo>-</mo><mi>v</mi><mi>t</mi><mo>)</mo></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>O</mi><mi>D</mi><mo>=</mo><mi>r</mi><mo>=</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><msqrt><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></msqrt><mo>-</mo><mi>v</mi><mi>t</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br />Angular momentum at time <math><mi>t</mi></math><br /><br /><math><msub><mrow><mi>I</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mi>m</mi><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mfrac><mrow><mi>M</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><br />As angular momentum is conserved<br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>I</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">ω</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><msub><mrow><mi>I</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">ω</mi><mfenced separators=\"|\"><mrow><mi>t</mi></mrow></mfenced></math><br /><br />This shows that variation of <math><mi mathvariant=\"normal\">ω</mi><mo>(</mo><mi>t</mi><mo>)</mo></math> with time is nonlinear. Choice<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/628086c.png\" style=\"width: 167px; height: 141px;\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863058e9b8aacec32c8", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "09", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A solid cylinder is given a velocity&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>0</mn></msub></math>&nbsp;and an angular speed&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#969;</mi><mn>0</mn></msub></math>&nbsp;in the anticlockwise direction and then it is placed gently&nbsp;on a&nbsp;very long rough plank (initially at rest)&nbsp;as shown in the figure. Then, choose the <strong>incorrect</strong> statement:</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/628353_CA_que.png\" style=\"width: 240px; height: 113px;\" /></p>\r", "image": null}, "options": [{"id": "AWQUE", "text": "the friction force on the disc is in the backward direction till pure rolling starts", "image": null, "isCorrect": false}, {"id": "hvSDW", "text": "the friction force between the disc and the plank is kinetic in nature till pure rolling starts", "image": null, "isCorrect": false}, {"id": "1xBcM", "text": "the total momentum of system (disc and plank) is conserved", "image": null, "isCorrect": false}, {"id": "dveng", "text": "the angular momentum of the disc about any point on the horizontal surface remains conserved", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>Initial velocity of point of contact of disc is in forward direction.</p><p>Hence friction is in backward direction and kinetic in nature.</p><p>Net force on the system is zero. So momentum is conserved.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "6aa3ab79aa8dc1ff6817809e", "title": "Rolling Without Slipping", "totalQuestions": 28, "questions": [{"_id": "6151e863fc43a88e0e18dd92", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "62", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A wheel of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> rolls on the ground with a uniform velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math>. The relative acceleration of the topmost point of the wheel with respect to the bottommost point is", "image": null}, "options": [{"id": "jOJ3b", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mtext mathvariant=\"italic\">v</mtext><mn>2</mn></msup><mtext mathvariant=\"italic\">R</mtext></mfrac></math>", "image": null, "isCorrect": false}, {"id": "HcRZU", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mtext>2</mtext><msup><mtext mathvariant=\"italic\">v</mtext><mn mathvariant=\"italic\">2</mn></msup></mrow><mtext mathvariant=\"italic\">R</mtext></mfrac></math>", "image": null, "isCorrect": true}, {"id": "nEOk3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mtext mathvariant=\"italic\">v</mtext><mn>2</mn></msup><mrow><mtext>2</mtext><mtext mathvariant=\"italic\">R</mtext></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "GcOfD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mtext>4</mtext><msup><mtext mathvariant=\"italic\">v</mtext><mn>2</mn></msup></mrow><mtext mathvariant=\"italic\">R</mtext></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029887_Ans.jpg\" style=\"width: 215px; height: 122px;\" /><br /><br />As it is rolling<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mo>&nbsp;</mo><mi>ω</mi><mo>=</mo><mfrac><mi>V</mi><mi>R</mi></mfrac></math><br /><br /><math> <msub> <mi>V</mi> <mi>Q</mi> </msub> <mo>=</mo><mn>0</mn> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msub><mi>V</mi><mrow><mi>P</mi><mo>/</mo><mi>Q</mi></mrow></msub><mo>=</mo><mi>ω</mi><mrow><mo>(</mo><mn>2</mn><mi>R</mi><mo>)</mo></mrow><mo>=</mo><mn>2</mn><mi>V</mi></math><br /><br /><math> <mo>⇒</mo><msub> <mi>a</mi> <mrow> <mrow><mi>P</mi><mo>/</mo><mi>Q</mi></mrow> </mrow> </msub> <mo>=</mo><mfrac> <mrow> <msub> <mi>V</mi> <mrow> <mrow><mi>P</mi><mo>/</mo><mi>Q</mi></mrow> </mrow> </msub> <msup> <mrow></mrow> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn><mi>R</mi></mrow> </mfrac> <mo>=</mo><mfrac> <mrow> <msup> <mrow> <mrow><mo>(</mo> <mrow> <mn>2</mn><mi>V</mi></mrow> <mo>)</mo></mrow></mrow> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn><mi>R</mi></mrow> </mfrac> <mo>=</mo><mfrac> <mrow> <mn>2</mn><msup> <mi>V</mi> <mn>2</mn> </msup> </mrow> <mi>R</mi> </mfrac> </math><br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863efe11c7e389b799d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "22", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the diagram shown, a rod of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi></math> has been fixed on a ring of the same mass. The whole system has been placed on a perfectly rough surface. The system is gently displaced so that the ring starts rolling. The velocity of the centre of the ring when the rod becomes horizontal is (the length of the rod is equal to the radius of the ring)<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/0136254-2.JPG\" style=\"width: 250px; height: 270px;\" />", "image": null}, "options": [{"id": "SONMt", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mrow><mn>3</mn><mi>gR</mi></mrow><mn>10</mn></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "YnEpC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mrow><mn>5</mn><mi>gR</mi></mrow><mn>3</mn></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "Vb9M8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mrow><mn>3</mn><mi>gR</mi></mrow><mn>7</mn></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "uI5aq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mrow><mn>2</mn><mi>gR</mi></mrow><mn>9</mn></mfrac></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image8-d834afc6-b062-4a57-a208-48014071d2a2.jpg\" /></p><br />The moment of inertia of the system about instantaneous axis of rotation is given by,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi><mo>=</mo><msub><mi mathvariant=\"normal\">I</mi><mi>ring</mi></msub><mo>+</mo><msub><mi mathvariant=\"normal\">I</mi><mi>rod</mi></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">I</mi><mo>=</mo><mo>(</mo><msup><mi>MR</mi><mn>2</mn></msup><mo>+</mo><msup><mi>MR</mi><mn>2</mn></msup><mo>)</mo><mo>+</mo><mfenced><mrow><mfrac><mn>1</mn><mn>12</mn></mfrac><msup><mi>MR</mi><mn>2</mn></msup><mo>+</mo><msubsup><mi>MR</mi><mn>1</mn><mn>2</mn></msubsup></mrow></mfenced></math>&nbsp; &nbsp; &nbsp; &nbsp;(From parallel axis theorem)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">I</mi><mo>=</mo><mn>2</mn><msup><mi>MR</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><mn>12</mn></mfrac><msup><mi>MR</mi><mn>2</mn></msup><mo>+</mo><mi mathvariant=\"normal\">M</mi><msup><mfenced><mfrac><mrow><msqrt><mn>5</mn></msqrt><mi mathvariant=\"normal\">R</mi></mrow><mn>2</mn></mfrac></mfenced><mn>2</mn></msup></math>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>&#8757;</mo><msub><mi mathvariant=\"normal\">R</mi><mn>1</mn></msub><mo>=</mo><msqrt><msup><mi mathvariant=\"normal\">R</mi><mn>2</mn></msup><mo>+</mo><msup><mfenced><mfrac><mi mathvariant=\"normal\">R</mi><mn>2</mn></mfrac></mfenced><mn>2</mn></msup></msqrt><mo>=</mo><mfrac><mrow><msqrt><mn>5</mn></msqrt><mi mathvariant=\"normal\">R</mi></mrow><mn>2</mn></mfrac></mrow></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">I</mi><mo>=</mo><mn>2</mn><msup><mi>MR</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><mn>12</mn></mfrac><msup><mi>MR</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>5</mn><mn>4</mn></mfrac><msup><mi>MR</mi><mn>2</mn></msup><mo>=</mo><mn>2</mn><msup><mi>MR</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><msup><mi>MR</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>10</mn><mn>3</mn></mfrac><msup><mi>MR</mi><mn>2</mn></msup></math><br /><br />Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">I</mi><mi>system</mi></msub><mo>=</mo><mfrac><mn>10</mn><mn>3</mn></mfrac><msup><mi>MR</mi><mn>2</mn></msup></math>.<br /><br /><br />Now from work - energy theorem, we get,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Mg</mi><mfrac><mi mathvariant=\"normal\">R</mi><mn>2</mn></mfrac><mo>=</mo></math>Rotational kinetic energy of the system about instantaneous axis of rotation<br />(here&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">R</mi><mn>2</mn></mfrac></math>&nbsp;is the distance through which the center of mass of the rod descends)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>Mg</mi><mfrac><mi mathvariant=\"normal\">R</mi><mn>2</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi mathvariant=\"normal\">&#160;</mi><msub><mi mathvariant=\"normal\">I</mi><mi>system</mi></msub><mi mathvariant=\"normal\">&#160;</mi><msup><mi mathvariant=\"normal\">&#969;</mi><mn>2</mn></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>Mg</mi><mfrac><mi mathvariant=\"normal\">R</mi><mn>2</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mfrac><mn>10</mn><mn>3</mn></mfrac><msup><mi>MR</mi><mn>2</mn></msup><mo>&#215;</mo><msup><mi mathvariant=\"normal\">&#969;</mi><mn>2</mn></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">&#969;</mi><mo>=</mo><msqrt><mfrac><mrow><mn>3</mn><mi mathvariant=\"normal\">g</mi></mrow><mrow><mn>10</mn><mi mathvariant=\"normal\">R</mi></mrow></mfrac></msqrt></math><br /><br /><br />Now velocity of center of mass is given as,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">v</mi><mo>=</mo><mi>R&#969;</mi></math>.<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">v</mi><mo>=</mo><mi mathvariant=\"normal\">R</mi><mo>&#215;</mo><msqrt><mfrac><mrow><mn>3</mn><mi mathvariant=\"normal\">g</mi></mrow><mrow><mn>10</mn><mi mathvariant=\"normal\">R</mi></mrow></mfrac></msqrt></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">v</mi><mo>=</mo><msqrt><mfrac><mrow><mn>3</mn><mi>gR</mi></mrow><mn>10</mn></mfrac></msqrt></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e06c84b6616561b6", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "04", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A solid sphere of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;and mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math>&nbsp;is rolled by a force <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi></math> acting at the top of the sphere as shown in the figure. The sphere starts from rest and rolls without slipping, then<br />\r<br />\r<br />\r&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0032599_Ques.jpg\" style=\"width: 215px; height: 110px;\" />", "image": null}, "options": [{"id": "LWvHO", "text": "work done by force <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi></math> when the center moves a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math> is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>F</mi><mi>S</mi></math>", "image": null, "isCorrect": true}, {"id": "0GbQd", "text": "work done by force <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi></math> when the center moves a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math> is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>F</mi><mi>S</mi></math>", "image": null, "isCorrect": false}, {"id": "9g2KJ", "text": "work done by force <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi></math> when the center moves a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math> is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn></mn><mi>F</mi><mi>S</mi></math>", "image": null, "isCorrect": false}, {"id": "y7Bal", "text": "work done by force <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi></math> when the center moves a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math> is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi>F</mi><mi>S</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0032599_Ans.jpg\" style=\"width: 184px; height: 147px;\" /><br /><br /><br />When the centre moves a distance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math>,&nbsp;the topmost point displaces by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>S</mi></math>. The work done is by the force is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mn>2</mn><mi>F</mi><mi>S</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ddb06d68f183d996", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "71", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A cylinder of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> is kept on an inclined plane having an angle of inclination <math><mn>30</mn><mo>°</mo></math>. Axis of the cylinder makes an angle<math><mi>&nbsp;</mi><mn>30</mn><mo>°</mo><mi>&nbsp;</mi></math>with the line along the greatest slope. Assuming that cylinder rolls without slipping, the acceleration of the cylinder is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image7-b92f4eef-008f-4837-acdf-6ab42467491a.jpg\" style=\"height: 184px; width: 250px;\" />", "image": null}, "options": [{"id": "Gc97D", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>g</mi><mn>6</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "hiC9j", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>g</mi><mn>4</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "fvhMS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>g</mi><mn>3</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "1IvfY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>g</mi><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Acceleration of the cylinder is given by<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><mi>m</mi><mi>g</mi><mi>sin</mi><mo>⁡</mo><mi mathvariant=\"normal\">θ</mi><mi>sin</mi><mo>⁡</mo><mi mathvariant=\"normal\">α</mi></mrow><mrow><mi>m</mi><mo>+</mo><mfrac bevelled=\"true\"><mi>m</mi><mn>2</mn></mfrac></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><mn>2</mn><mi>g</mi><mi>sin</mi><mo>⁡</mo><mi mathvariant=\"normal\">θ</mi><mi>sin</mi><mo>⁡</mo><mi mathvariant=\"normal\">α</mi></mrow><mn>3</mn></mfrac><mo>=</mo><mfrac><mi>g</mi><mn>6</mn></mfrac></math><br /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image7-b92f4eef-008f-4837-acdf-6ab42467491a.jpg\" style=\"height: 184px; width: 250px;\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d60664e8f5b8c429", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "33", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A solid cylinder is kept on one edge of a plank of same mass and length&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>25</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> placed on a smooth surface as shown in the figure. The coefficient of friction between the cylinder and the plank is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>5</mn></math>. The plank is given a velocity of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> towards right. Find the time (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">s</mi></math>) after which plank and cylinder will separate. [<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">g</mi><mo>=</mo><mn>10</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>]<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0102907.jpg\" style=\"width: 295px; height: 109px;\" />", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "Drawing free body diagram of the cylinder with respect to plank.<br/><br/> <math><mn>2</mn><mi>μ</mi><mi>m</mi><mi>g</mi><mo>=</mo><mi>m</mi><mi>a</mi><mo>⇒</mo><mi>a</mi><mo>=</mo><mn>2</mn><mi>μ</mi><mi>g</mi></math> <br/><br/> <math><mfenced separators=\"|\"><mrow><mi>μ</mi><mi>m</mi><mi>g</mi><mi>R</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>m</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>α</mi><mi mathvariant=\"normal\"> </mi><mo>;</mo><mi>α</mi><mo>-</mo><mfrac><mrow><mn>2</mn><mi>μ</mi><mi>g</mi></mrow><mrow><mi>r</mi></mrow></mfrac></math> <br/><br/>Acceleration of point of contact with respect to plank is  <math><mn>4</mn><mi>μ</mi><mi>g</mi></math> <br/><br/>Velocity of pure rolling starts,<br/><br/> <math><mo>-</mo><mi mathvariant=\"normal\">v</mi><mo>+</mo><mn>4</mn><mi mathvariant=\"normal\">μ</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">t</mi><mo>=</mo><mn>0</mn></math> <br/><br/> <math><mi mathvariant=\"normal\">t</mi><mo>=</mo><mfrac><mrow><mn>20</mn></mrow><mrow><mn>4</mn><mo>×</mo><mn>0.5</mn><mo>×</mo><mn>10</mn></mrow></mfrac><mo>=</mo><mn>1</mn><mi mathvariant=\"normal\">s</mi></math> <br/><br/>Distance traveled by cylinder with respect to plank in 1s is<br/><br/> <math><msup><mrow><mi mathvariant=\"normal\">S</mi></mrow><mrow><mi mathvariant=\"normal\">&prime;</mi></mrow></msup><mo>=</mo><mo>-</mo><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">t</mi><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mfenced separators=\"|\"><mrow><mn>2</mn><mi mathvariant=\"normal\">μ</mi><mi mathvariant=\"normal\">g</mi></mrow></mfenced><msup><mrow><mi mathvariant=\"normal\">t</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mo>-</mo><mn>15</mn><mi mathvariant=\"normal\">m</mi></math> <br/><br/>At  <math><mi mathvariant=\"normal\">t</mi><mo>=</mo><mn>1</mn><mi mathvariant=\"normal\">s</mi></math> , the velocity of cylinder with respect to plank is<br/><br/> <math><mi mathvariant=\"normal\">t</mi><mo>=</mo><mn>1</mn><mi mathvariant=\"normal\">s</mi></math> <br/><br/> <math><msub><mrow><mi mathvariant=\"normal\">v</mi></mrow><mrow><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">l</mi></mrow></msub><mo>=</mo><mo>-</mo><mi mathvariant=\"normal\">v</mi><mo>+</mo><mn>2</mn><mi mathvariant=\"normal\">μ</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">t</mi><mo>=</mo><mo>-</mo><mn>20</mn><mo>+</mo><mn>2</mn><mo>×</mo><mn>0.5</mn><mo>×</mo><mn>10</mn><mo>=</mo><mo>-</mo><mn>10</mn></math>  m/s<br/><br/>Remaining 10 m will be travelled in time  <math><msup><mrow><mi mathvariant=\"normal\">t</mi></mrow><mrow><mi mathvariant=\"normal\">&prime;</mi></mrow></msup><mo>=</mo><mfrac><mrow><mn>10</mn></mrow><mrow><mn>10</mn></mrow></mfrac><mo>=</mo><mn>1</mn><mi mathvariant=\"normal\">s</mi></math> <br/><br/> <math><mo>∴</mo></math>  Total time = 2s", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d1ce883ad4ed7a83", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "23", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A solid sphere of radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi></math> is gently placed on a rough horizontal surface with an initial angular speed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">ω</mi><mn>0</mn></msub></math>&nbsp;but no linear velocity. If the coefficient of friction is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">μ</mi></math>, then the time&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">t</mi></math> when the slipping will stop is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0023431_Question_1.jpg\" style=\"width: 281px; height: 158px;\" />", "image": null}, "options": [{"id": "YaKKc", "text": "<math> <mrow> <mfrac> <mrow> <mn>2</mn> </mrow> <mrow> <mn>7</mn> </mrow> </mfrac> <mfrac> <mrow> <mtext>r</mtext> <msub> <mtext>ω</mtext> <mn>0</mn> </msub> </mrow> <mrow> <mtext>μ</mtext> <mtext>g</mtext> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "HwIWj", "text": "<math><mrow>  <mfrac>    <mrow>      <mn>3</mn>    </mrow>    <mrow>      <mn>7</mn>    </mrow>  </mfrac>  <mfrac>    <mrow>      <mtext>r</mtext>      <msub>              <mtext>&omega;</mtext>            <mn>0</mn>      </msub>    </mrow>    <mrow>      <mtext>&mu;</mtext>      <mtext>g</mtext>    </mrow>  </mfrac></mrow></math>", "image": null, "isCorrect": false}, {"id": "rFGvW", "text": "<math><mrow>  <mfrac>    <mrow>      <mn>4</mn>    </mrow>    <mrow>      <mn>7</mn>    </mrow>  </mfrac>  <mfrac>    <mrow>      <mtext>r</mtext>      <msub>              <mtext>&omega;</mtext>            <mn>0</mn>      </msub>    </mrow>    <mrow>      <mtext>&mu;</mtext>      <mtext>g</mtext>    </mrow>  </mfrac></mrow></math>", "image": null, "isCorrect": false}, {"id": "sBh3n", "text": "<math><mrow>  <mfrac>    <mrow>      <mtext>r</mtext>      <msub>              <mtext>&omega;</mtext>            <mn>0</mn>      </msub>    </mrow>    <mrow>      <mtext>&mu;</mtext>      <mtext>g</mtext>    </mrow>  </mfrac></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math> be the mass of the sphere.<br /><br />Since, it is a case of backward slipping, force of friction is in forward direction. Limiting friction will act in this case.<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0023431_AnsExp_1.jpg\" style=\"width: 436px; height: 162px;\" /><br /><br /><math> <mrow> <mtext>Linear acceleration</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>a</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>f</mtext> </mrow> <mrow> <mtext>m</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>μ</mtext> <mo>mg</mo> </mrow> <mrow> <mtext>m</mtext> </mrow> </mfrac> <mo>=</mo> <mtext>μ</mtext> <mtext>g</mtext> </mrow> </math><br /><br /><math> <mrow> <mtext>Angular retardation</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>α</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>τ</mtext> </mrow> <mrow> <mtext>I</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>f</mtext> <mo>·</mo> <mtext>r</mtext> </mrow> <mrow> <mfrac> <mrow> <mn>2</mn> </mrow> <mrow> <mn>5</mn> </mrow> </mfrac> <msup> <mtext>mr</mtext> <mn>2</mn> </msup> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mfrac> <mrow> <mtext>μ</mtext> <mtext>g</mtext> </mrow> <mrow> <mtext>r</mtext> </mrow> </mfrac> </mrow> </math><br /><br />Slipping will be stopped when&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">v</mi><mo>=</mo><mi>rω</mi></math><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>at</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">r</mi><mo>(</mo><msub><mi mathvariant=\"normal\">ω</mi><mn>0</mn></msub><mo>&nbsp;</mo><mo>-</mo><mo>&nbsp;</mo><mi>αt</mi><mo>)</mo></math><br /><br /><math><mrow>&nbsp;<mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mtext>μ</mtext> <mtext>gt</mtext> <mo>=</mo> <mtext>r</mtext> <mo>(</mo> <msub> <mtext>ω</mtext> <mn>0</mn> </msub> <mo>-</mo> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mfrac> <mrow> <mtext>μ</mtext> <mtext>g</mtext> <mtext>t</mtext> </mrow> <mrow> <mtext>r</mtext> </mrow> </mfrac> <mo>)</mo> </mrow> </math><br /><br /><math><mrow>&nbsp;<mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mfrac><mrow><mn>7</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>μ</mtext> <mtext>gt</mtext> <mo>=</mo> <mtext>r</mtext> <msub> <mtext>ω</mtext> <mn>0</mn> </msub> </mrow> </math><br /><br /><math> <mrow> <mo>∴</mo> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>t</mtext> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> </mrow> <mrow> <mn>7</mn> </mrow> </mfrac> <mfrac> <mrow> <mtext>r</mtext> <msub> <mtext>ω</mtext> <mn>0</mn> </msub> </mrow> <mrow> <mtext>μ</mtext> <mtext>g</mtext> </mrow> </mfrac> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d16392c526afbaeb", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "48", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A smooth rod <math><mi>O</mi><mi>P</mi></math> is fixed vertically. A disc of mass <math><mi>m</mi></math> and radius <math><mi>R</mi></math> is rolling without slipping at the given instant on a rough horizontal surface as shown. Velocity of centre of mass <math><mi>C</mi></math> of disc is <math><msub><mrow><mi>v</mi></mrow><mrow><mn>0</mn></mrow></msub></math> . A rod <math><mi>A</mi><mi>B</mi></math> of length <math><mi>L</mi></math> is connected with disc at <math><mi>A</mi></math>, <math><mrow><mrow><mi>R</mi></mrow><mo>/</mo><mrow><mn>2</mn></mrow></mrow></math> distance vertically up from centre of disc with pin joint (about which it can rotate freely), other end of the rod is attached to a small smooth ring <math><mi>B</mi></math>, which can move freely over rod <math><mi>O</mi><mi>P</mi></math>. At an instant rod <math><mi>A</mi><mi>B</mi></math> makes an angle <math><mn>60</mn><mo>°</mo></math> with the vertical. The velocity of ring on the vertical rod at this instant is.<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/485201-1.PNG\" style=\"width: 250px; height: 175px;\" />", "image": null}, "options": [{"id": "Vjabk", "text": "<math><mfrac><mrow><mn>3</mn><msqrt><mn>3</mn></msqrt></mrow><mrow><mn>2</mn></mrow></mfrac><mi>&nbsp;</mi><msub><mrow><mi>v</mi></mrow><mrow><mn>0</mn></mrow></msub></math>", "image": null, "isCorrect": true}, {"id": "Wdl2f", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><msub><mrow><mi>v</mi></mrow><mrow><mn>0</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "SGwRw", "text": "<math><msub><mrow><mi>v</mi></mrow><mrow><mn>0</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "VXgN8", "text": "perpendicular to velocity of point <math><mi>Q</mi></math> ( <math><mi>Q</mi></math> and <math><mi>C</mi></math> are at same horizontal level)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/56bb0644-01cf-437c-b68a-67e47bf85e00-image25.jpeg\" /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">V</mi><mn>1</mn></msub><mtext>&#160;cos&#160;</mtext><msup><mn>60</mn><mo>&#8728;</mo></msup><mo>=</mo><mfrac><mrow><mn>3</mn><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub></mrow><mn>2</mn></mfrac><mtext>&#160;cos&#160;</mtext><msup><mn>30</mn><mo>&#8728;</mo></msup><mspace linebreak=\"newline\"/><mo>&#8658;</mo><msub><mi mathvariant=\"normal\">V</mi><mn>1</mn></msub><mo>=</mo><mfrac><mrow><mn>3</mn><msqrt><mn>3</mn></msqrt></mrow><mn>2</mn></mfrac><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863cd58e74507d6be38", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "33", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A solid spherical ball of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math>&nbsp;is released from the topmost point of the shown semi-spherical shell. The track is sufficiently rough to enable pure rolling motion.&nbsp;The normal force between the ball and the shell at the lowest position&nbsp;is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029741_Ans.jpg\" style=\"width: 194px; height: 144px;\" />", "image": null}, "options": [{"id": "lGMVC", "text": "<math> <mrow> <mfrac> <mrow> <mn>1</mn> <mn>2</mn> </mrow> <mrow> <mn>7</mn> </mrow> </mfrac> <mtext>mg</mtext> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "mpAwS", "text": "<math> <mrow> <mfrac> <mrow> <mn>7</mn> <mn></mn> </mrow> <mrow> <mn>9</mn> </mrow> </mfrac> <mtext>mg</mtext> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "Z9HSp", "text": "<math> <mrow> <mfrac> <mrow> <mn>1</mn> <mn>7</mn> </mrow> <mrow> <mn>7</mn> </mrow> </mfrac> <mtext>mg</mtext> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "4H6ec", "text": "<math> <mrow> <mfrac> <mrow> <mn>1</mn> <mn>0</mn> </mrow> <mrow> <mn>7</mn> </mrow> </mfrac> <mtext>mg</mtext> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029741_Ans.jpg\" style=\"width: 194px; height: 144px;\" /><br /><br />From the law of conservation of mechanical energy,<br /><br />Final energy = Translational kinetic energy + Rotational kinetic energy<br /><br />Hence, Final energy =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mi>mv</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mi>I&#969;</mi><mn>2</mn></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mi>mv</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mfrac><mn>2</mn><mn>5</mn></mfrac><msup><mi>mR</mi><mn>2</mn></msup><mo>&#215;</mo><msup><mfenced><mfrac><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">R</mi></mfrac></mfenced><mn>2</mn></msup><mo>=</mo><mfrac><mn>7</mn><mn>10</mn></mfrac><msup><mi>mv</mi><mn>2</mn></msup></math><br /><br />Hence, we finally obtain,&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>mg</mtext><mfenced><mtext>R - r</mtext></mfenced><mo>=</mo><mfrac><mn>7</mn><mrow><mn>1</mn><mn>0</mn></mrow></mfrac><msup><mtext>mv</mtext><mn>2</mn></msup></math>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; .......(1)<br /><br />and&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext>N</mtext> <mo>-</mo> <mtext>mg</mtext> <mo>=</mo> <mfrac> <mrow> <msup> <mtext>mv</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mtext>R - r</mtext> </mrow> </mfrac> </mrow> </math>&nbsp; &nbsp; &nbsp; &nbsp;..........(2)<br /><br />Solving Eqs. (1) and (2), we get<br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext>N</mtext> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>7</mn> </mrow> <mrow> <mn>7</mn> </mrow> </mfrac> <mtext>mg</mtext> </mrow></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c78ecd92e62361a2", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "27", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The figure shows a fixed incline plane on which a plank is being pulled upwards such that the centre&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math> of the solid cylinder remains at rest with respect to ground. If&nbsp;no slipping takes place between the cylinder and the plank, then the acceleration of&nbsp;the plank is<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0030262_Question.jpg\" style=\"width: 238px; height: 168px;\" />", "image": null}, "options": [{"id": "9ut6i", "text": "<math> <mrow> <mfrac> <mrow> <mtext>g</mtext> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mspace width=\"0.5em\"></mspace> <mtext>sin</mtext> <mspace width=\"0.5em\"></mspace> <mi mathvariant=\"normal\">&theta;</mi> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "Wg9MY", "text": "<math> <mrow> <mn>2</mn> <mtext>g</mtext> <mspace width=\"0.5em\"></mspace> <mtext>sin</mtext> <mspace width=\"0.5em\"></mspace> <mi mathvariant=\"normal\">θ</mi> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "QJmUn", "text": "<math> <mrow> <mtext>g</mtext> <mspace width=\"0.5em\"></mspace> <mtext>sin</mtext> <mspace width=\"0.5em\"></mspace> <mi mathvariant=\"normal\">&theta;</mi> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "oxJy1", "text": "<math> <mrow> <msqrt> <mn>2</mn> </msqrt> <mtext>g</mtext> <mspace width=\"0.5em\"></mspace> <mtext>sin</mtext> <mspace width=\"0.5em\"></mspace> <mi mathvariant=\"normal\">&theta;</mi> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Linear acceleration of cylinder is zero, i.e.,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>mg</mi><mo>&nbsp;</mo><mi>sin</mi><mo>&nbsp;</mo><mi mathvariant=\"normal\">θ</mi><mo>=</mo><mi mathvariant=\"normal\">f</mi></math>&nbsp; &nbsp; &nbsp; ( here <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">f</mi></math>&nbsp;= frictional force upwards )</p><p>Angular acceleration about the centre&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">α</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">τ</mi><mi mathvariant=\"normal\">I</mi></mfrac></math><br /><br />or&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">α</mi><mo>=</mo><mfrac><mtext>fR</mtext><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mtext>mR</mtext><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mfrac><mtext>2f</mtext><mtext>mR</mtext></mfrac></math><br /><br />or&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">α</mi><mo>=</mo><mfrac><mrow><mtext>2mg sin</mtext><mspace width=\"0.5em\"></mspace><mi mathvariant=\"normal\">θ</mi></mrow><mtext>mR</mtext></mfrac><mo>=</mo><mfrac><mrow><mtext>2g sin</mtext><mspace width=\"0.5em\"></mspace><mi mathvariant=\"normal\">θ</mi></mrow><mtext>R</mtext></mfrac></math><br /><br />For no slipping between cylinder and plank</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">a</mi><mo>=</mo><mtext>R</mtext><mi mathvariant=\"normal\">α</mi><mo>=</mo><mtext>2g sin</mtext><mi mathvariant=\"normal\">θ</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b2b2f95699425b66", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "41", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A spool of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><mo>=</mo><mn>3</mn><mo>&nbsp;</mo><mi>kg</mi></math> and radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>20</mn><mo>&nbsp;</mo><mi>cm</mi></math> has an axle of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><mn>10</mn><mo>&nbsp;</mo><mi>cm</mi></math> around which a string is wrapped. The moment of inertia about an axis perpendicular to the plane of the spool and passing through the centre is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup></mrow><mn>2</mn></mfrac></math>.&nbsp;If the coefficient of friction between the surface and the spool is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>4</mn></math>&nbsp;then the maximum tension which can be applied to the string for which the spool doesn't slip, is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mrow><mi>g</mi><mo>=</mo><mn>10</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced></math></p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/0638311_que.JPG\" style=\"width: 180px; height: 147px;\" /></p>\r", "image": null}, "options": [{"id": "vOBRX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>24</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">N</mi></math>", "image": null, "isCorrect": false}, {"id": "MrH2Z", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>18</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">N</mi></math>", "image": null, "isCorrect": true}, {"id": "gclkf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">N</mi></math>", "image": null, "isCorrect": false}, {"id": "EsgRF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>36</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">N</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img height=\"127\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/xetxsddipeuqszifpmgigrniiemefracxudagpqlqzbsurfkea.png\" width=\"207\" /></p><p>Writing the torque about the instantaneous axis of rotation we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#964;</mi><mo>=</mo><mi>T</mi><mo>&#215;</mo><mfenced><mrow><mi>R</mi><mo>-</mo><mi>r</mi></mrow></mfenced><mo>=</mo><mfenced><mrow><mfrac><mrow><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup></mrow><mn>2</mn></mfrac><mo>+</mo><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup></mrow></mfenced><mi>&#945;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>T</mi><mo>=</mo><mfenced><mfrac><mrow><mn>3</mn><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup></mrow><mrow><mn>2</mn><mfenced><mrow><mi>R</mi><mo>-</mo><mi>r</mi></mrow></mfenced></mrow></mfrac></mfenced><mfrac><mi>a</mi><mi>R</mi></mfrac></math></p><p>Also,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>-</mo><mi>&#956;</mi><mi>M</mi><mi>g</mi><mo>=</mo><mi>M</mi><mi>a</mi></math></p><p>Substituting the values and solving for&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math>&nbsp;we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>18</mn><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ab0dabce9b952e89", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "77", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform, thin cylindrical shell and solid cylinder roll horizontally without slipping. The speed of the cylindrical shell is <math><mi mathvariant=\"italic\">v</mi></math>. The solid cylinder and the hollow cylinder encounter an incline that they climb without slipping. If the maximum height they reach is the same, find the initial speed <math><mi mathvariant=\"italic\">v</mi><mi mathvariant=\"italic\">'</mi></math> of the solid cylinder.", "image": null}, "options": [{"id": "t9SaQ", "text": "<math><msqrt><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac></msqrt><mi mathvariant=\"italic\">v</mi></math>", "image": null, "isCorrect": true}, {"id": "3AvjA", "text": "<math><msqrt><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac></msqrt><mi mathvariant=\"italic\">v</mi></math>", "image": null, "isCorrect": false}, {"id": "7L1X7", "text": "<math><msqrt><mfrac><mrow><mn>3</mn></mrow><mrow><mn>5</mn></mrow></mfrac></msqrt><mi mathvariant=\"italic\">v</mi></math>", "image": null, "isCorrect": false}, {"id": "92IsL", "text": "<math><msqrt><mfrac><mrow><mn>5</mn></mrow><mrow><mn>3</mn></mrow></mfrac></msqrt><mi mathvariant=\"italic\">v</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi mathvariant=\"italic\">K</mi><mi mathvariant=\"italic\">E</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><msup><mrow><mi mathvariant=\"italic\">m</mi><mi mathvariant=\"italic\">v</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"italic\">I</mi><msup><mrow><mi mathvariant=\"italic\">ω</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac><msubsup><mrow><mi mathvariant=\"italic\">m</mi><mi mathvariant=\"italic\">v</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>=</mo><msubsup><mrow><mi mathvariant=\"italic\">m</mi><mi mathvariant=\"italic\">v</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup></math><br /><math><mfrac><mrow><msub><mrow><mi mathvariant=\"italic\">v</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"italic\">v</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><msqrt><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a97e24e9a845aaec", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "109", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the figure shown, the plank is being pulled to the right with a constant speed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math>. If the cylinder does not slip then<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0031340_Question.._._xyz.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 220px; height: 141px;\" />", "image": null}, "options": [{"id": "xD9FE", "text": "The speed of the centre of mass of the cylinder is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>v</mi></math>", "image": null, "isCorrect": false}, {"id": "5TvY3", "text": "The speed of the centre of mass of the cylinder is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math>", "image": null, "isCorrect": false}, {"id": "Zjoxk", "text": "The angular velocity of the cylinder is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>v</mi><mi>R</mi></mfrac></math>", "image": null, "isCorrect": true}, {"id": "ocKtC", "text": "The angular velocity of the cylinder is zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For no slip condition velocity of plank = velocity of bottom point of sphere.<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0031340_Ans.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 204px; height: 108px;\" /><br /><br /><math> <mrow> <mi mathvariant=\"normal\">ω</mi> <mo>=</mo> <mfrac> <mrow> <mtext>v</mtext> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> <mspace width=\"0.5em\"></mspace> <mtext>and</mtext> <msub> <mrow> <mspace width=\"0.5em\"></mspace> <mtext>v</mtext> </mrow> <mtext>c</mtext> </msub> <mo>=</mo> <mn>0</mn> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a20dd9c08e56cf9e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "21", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A uniform ball of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi></math> rolls without slipping down from the top of a sphere of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math>. The spin angular velocity of the ball when i 98/Math/MathML\"><mi>r</mi></math>. The minimum value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math> for the sphere to complete the loop is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-08-12_at_3.36.27_PM.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 180px; height: 114px;\" />", "image": null}, "options": [{"id": "GjEYv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>1</mn><mo>&#160;</mo><mi>R</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 103px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "L3FsD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>3</mn><mo>&#160;</mo><mi>R</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 103px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "OnZOW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>7</mn><mo>&#160;</mo><mi>R</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 103px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "C7X7p", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi>R</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 103px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "At the topmost point of the loop minimum value of<br />the linear speed of the centre of the sphere should be :<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">v</mtext><mo>=</mo><msqrt><mtext mathvariant=\"italic\">gR</mtext></msqrt></math><br /><br />or&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;translational kinetic energy<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">K</mtext><mtext>T</mtext></msub><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mtext mathvariant=\"italic\">mv</mtext><mn>2</mn></msup><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mtext mathvariant=\"italic\">mgR</mtext><mtext>.</mtext></math><br /><br />In case of pure rolling of a solid sphere the ratio<br />of rotational to translational kinetic energy is :<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mtext mathvariant=\"italic\">K</mtext><mtext>R</mtext></msub><msub><mtext mathvariant=\"italic\">K</mtext><mtext>T</mtext></msub></mfrac><mo>=</mo><mfrac><mn>2</mn><mn>5</mn></mfrac></math><br /><br />&there4; Total kinetic energy at topmost point should be :<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">K</mtext><mo>=</mo><mfrac><mrow><mn>5</mn><mo>+</mo><mn>2</mn></mrow><mn>5</mn></mfrac><mtext>.</mtext><mspace width=\"0.5em\"/><msub><mtext mathvariant=\"italic\">K</mtext><mtext>T</mtext></msub><mo>=</mo><mfrac><mn>7</mn><mn>5</mn></mfrac><mfenced><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><mtext mathvariant=\"italic\">mgR</mtext></mrow></mfenced><mo>=</mo><mfrac><mn>7</mn><mrow><mn>1</mn><mn>0</mn></mrow></mfrac><mtext mathvariant=\"italic\">mgR</mtext></math><br /><br />Now from conservation of mechanical energy :<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>7</mn><mrow><mn>1</mn><mn>0</mn></mrow></mfrac><mtext mathvariant=\"italic\">mgR</mtext><mo>=</mo><mtext mathvariant=\"italic\">mg</mtext><mspace width=\"0.5em\"/><mfenced><mrow><mtext mathvariant=\"italic\">h</mtext><mtext>&#160;- 2</mtext><mtext mathvariant=\"italic\">R</mtext></mrow></mfenced></math><br /><br />&there4;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mi>h</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>2</mn><mo>.</mo><mn>7</mn><mo>&#160;</mo><mi>R</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86384c9326f2f3111a1", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "53", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A uniform ball of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>&nbsp;is placed on the top of a sphere of radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>10</mn><mi>r</mi></math>. It is given a slight push due to which it starts&nbsp;rolling down the sphere without slipping. The spin angular velocity of the ball when it breaks off from the sphere is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ω</mi><mo>=</mo><msqrt><mfrac><mi>p</mi><mi>q</mi></mfrac><mfenced><mfrac><mi>g</mi><mi>r</mi></mfrac></mfenced></msqrt></math>, where&nbsp;<math xmlns=\"http://www.w3.or
