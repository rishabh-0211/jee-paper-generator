mo>=</mo> <msup> <mtext>cos</mtext> <mn>-1</mn> </msup> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>3</mn> <mo>/</mo> <mn>5</mn> </mrow> </mfenced> </mrow> </math>&nbsp;by turning its velocity vector in the same plane of motion, such that the speed remains constant. The satellite consequently goes into an elliptical orbit around earth. The ratio of speed at perigee to speed at apogee is", "image": null}, "options": [{"id": "qf6P0", "text": "<math > <mn>3</mn></math>", "image": null, "isCorrect": false}, {"id": "ZqPqf", "text": "<math> <mn>9</mn></math>", "image": null, "isCorrect": true}, {"id": "BBw3f", "text": "<math> <mrow>  <mn>1</mn><mo>/</mo><mn>3</mn></mrow></math>", "image": null, "isCorrect": false}, {"id": "p0LU8", "text": "<math> <mrow>  <mn>1</mn><mo>/</mo><mn>9</mn></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using conservation of angular momentum about O.<br /><br /><math> <mrow> <mtext>m</mtext> <msub> <mtext>V</mtext> <mtext>P</mtext> </msub> <msub> <mtext>r</mtext> <mtext>P</mtext> </msub> <mo>=</mo> <mtext>m</mtext> <msub> <mtext>V</mtext> <mtext>A</mtext> </msub> <msub> <mtext>r</mtext> <mtext>A</mtext> </msub> <mo>=</mo> <mtext>m</mtext> <msub> <mtext>V</mtext> <mn>0</mn> </msub> <msub> <mtext>r</mtext> <mn>0</mn> </msub> <mtext>cos</mtext> <mi>θ</mi> </mrow> </math><br /><br /><math> <mrow> <msub> <mtext>V</mtext> <mtext>A</mtext> </msub> <msub> <mtext>r</mtext> <mtext>A</mtext> </msub> <mo>=</mo> <msub> <mtext>V</mtext> <mtext>P</mtext> </msub> <msub> <mtext>r</mtext> <mtext>P</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mn>3</mn> <msub> <mtext>v</mtext> <mn>0</mn> </msub> <msub> <mtext>r</mtext> <mn>0</mn> </msub> </mrow> <mrow> <mn>5</mn> </mrow> </mfrac> </mrow> </math> ......(1)<br /><br />using conservation of energy<br /><br /><math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>m</mtext> <msubsup> <mtext>V</mtext> <mtext>A</mtext> <mn>2</mn> </msubsup> <mo>+</mo> <mfrac> <mrow> <mo>-</mo> <mtext>GMm</mtext> </mrow> <mrow> <msub> <mtext>r</mtext> <mtext>A</mtext> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mo>-</mo> <mtext>GMm</mtext> </mrow> <mrow> <msub> <mtext>r</mtext> <mn>0</mn> </msub> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>m</mtext> <msubsup> <mtext>V</mtext> <mn>0</mn> <mn>2</mn> </msubsup> </mrow> </math><br /><br /><math> <mrow> <mo>⇒</mo> <mfrac> <mrow> <mn>9</mn> <msubsup> <mtext>V</mtext> <mn>0</mn> <mn>2</mn> </msubsup> <msubsup> <mtext>r</mtext> <mn>0</mn> <mn>2</mn> </msubsup> </mrow> <mrow> <mn>5</mn> <mn>0</mn> <msubsup> <mtext>r</mtext> <mtext>A</mtext> <mn>2</mn> </msubsup> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <msubsup> <mtext>V</mtext> <mn>0</mn> <mn>2</mn> </msubsup> <msub> <mtext>r</mtext> <mn>0</mn> </msub> </mrow> <mrow> <msub> <mtext>r</mtext> <mtext>A</mtext> </msub> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <msubsup> <mtext>V</mtext> <mn>0</mn> <mn>2</mn> </msubsup> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>=</mo> <mn>0</mn> </mrow> </math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mtext>Let</mtext> <mfrac> <mrow> <msub> <mtext>r</mtext> <mn>0</mn> </msub> </mrow> <mrow> <msub> <mtext>r</mtext> <mtext>A</mtext> </msub> </mrow> </mfrac> <mo>=</mo> <mtext>x</mtext> </mrow> </mfenced> </mrow> </math> This is a quadratic equation in <math><mfenced separators=\"|\"><mrow><mfrac><mrow><msub><mrow><mi>r</mi></mrow><mrow><mn>0</mn></mrow></msub><mi> </mi></mrow><mrow><msub><mrow><mi>r</mi></mrow><mrow><mi>a</mi></mrow></msub></mrow></mfrac></mrow></mfenced></math><br /><br /><math><mo>⇒</mo><mn>9</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>50</mn><mi>x</mi><mo>+</mo><mn>25</mn><mo>=</mo><mn>0</mn><mo>⇒</mo><mi>x</mi><mo>=</mo><mn>5</mn><mi>&nbsp;</mi><mi>o</mi><mi>r</mi><mi>&nbsp;</mi><mi>x</mi><mo>=</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>9</mn></mrow></mfrac></math><br /><br /><b><u><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0024680_Question.jpg\" style=\"width: 285px; height: 314px;\" /></u></b><br /><br /><math><mo>⇒</mo><msub><mrow><mi>r</mi></mrow><mrow><mi>A</mi></mrow></msub><mo>=</mo><mfrac><mrow><mn>9</mn></mrow><mrow><mn>5</mn></mrow></mfrac><msub><mrow><mi>r</mi></mrow><mrow><mi>o</mi></mrow></msub><mi>&nbsp;</mi><mo>…</mo><mo>…</mo><mo>.</mo><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced></math><br /><br /><math><msub><mrow><mi>r</mi></mrow><mrow><mi>p</mi></mrow></msub><mo>=</mo><mfrac><mrow><msub><mrow><mi>r</mi></mrow><mrow><mi>o</mi></mrow></msub></mrow><mrow><mn>5</mn></mrow></mfrac><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mo>…</mo><mo>…</mo><mo>.</mo><mo>(</mo><mn>2</mn><mo>)</mo></math><br /><br />using (1)&amp;(2)<br /><br /><math> <mrow> <mo>⇒</mo> <mfrac> <mrow> <msub> <mtext>V</mtext> <mtext>P</mtext> </msub> </mrow> <mrow> <msub> <mtext>V</mtext> <mtext>A</mtext> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>r</mtext> <mtext>A</mtext> </msub> </mrow> <mrow> <msub> <mtext>r</mtext> <mtext>P</mtext> </msub> </mrow> </mfrac> <mo>=</mo> <mn>9</mn> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639ad644abf39242da", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "74", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A planet of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> is in an elliptical orbit about the sun <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>m</mi><mo>&lt;</mo><mo>&lt;</mo><msub><mi>M</mi><mtext>sun</mtext></msub></mrow></mfenced></math>&nbsp;with an orbital period <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math>. If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> be the area of orbit, then its angular momentum would be", "image": null}, "options": [{"id": "y165U", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mi>m</mi><mi>A</mi></mrow><mi>T</mi></mfrac></math>", "image": null, "isCorrect": true}, {"id": "UH36G", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mi>A</mi><mi>T</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 98px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "Cv6pm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>m</mi><mi>A</mi></mrow><mrow><mn>2</mn><mi>T</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "qhIMO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>m</mi><mi>A</mi><mi>T</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 75px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "using Kepler&#39;s II<sup>nd&nbsp;&nbsp;</sup>law ; areal velocity = constant =<math><mfrac><mrow><mi>L</mi></mrow><mrow><mn>2</mn><mi>m</mi></mrow></mfrac></math><br /><br />&rArr;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi mathvariant=\"normal\">d</mi><mi>A</mi></mrow><mrow><mi mathvariant=\"normal\">d</mi><mi>t</mi></mrow></mfrac></math> = <math><mfrac><mrow><mi>L</mi></mrow><mrow><mn>2</mn><mi>m</mi></mrow></mfrac></math><br /><br />&rArr; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi><mo>=</mo><mn>2</mn><mi>m</mi><mfrac><mrow><mi mathvariant=\"normal\">d</mi><mi>A</mi></mrow><mrow><mi mathvariant=\"normal\">d</mi><mi>t</mi></mrow></mfrac></math><br /><br /><math><mi>L</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>m</mi><mi>A</mi></mrow><mrow><mi>T</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638e928b548de37a30", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "36", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A satellite of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> orbits around the Earth of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> in an elliptical orbit of semi-major and semi-minor axes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>a</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math>&nbsp;respectively. The angular momentum of the satellite about the centre of the Earth is", "image": null}, "options": [{"id": "TpSY0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#x3C0;</mi><mi>m</mi><msqrt><mfrac><mrow><mi>G</mi><mi>M</mi><mi>a</mi></mrow><mn>2</mn></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "Z15oU", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#x3C0;</mi><mi>m</mi><msqrt><mfrac><mrow><mi>G</mi><mi>M</mi><mi>a</mi></mrow><mn>4</mn></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "gDu0O", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><msqrt><mfrac><mrow><mi>G</mi><mi>M</mi><mi>a</mi></mrow><mn>8</mn></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "UhNLp", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><msqrt><mfrac><mrow><mi>G</mi><mi>M</mi><mi>a</mi></mrow><mn>2</mn></mfrac></msqrt></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>If the satellite was orbiting the Earth in a circular orbit of radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>a</mi></math>, then its time period would be</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><msup><mfenced><mrow><mn mathvariant=\"normal\">2</mn><mi mathvariant=\"italic\">a</mi></mrow></mfenced><mn>3</mn></msup><mrow><mi>G</mi><mi>M</mi></mrow></mfrac></msqrt></math></p><p>The same would be the time period of the satellite if it orbits in an ellipse having a&nbsp;semi-major axis&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>a</mi></math></p><p>The area of the ellipse is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mi>&#960;</mi><mo>&#215;</mo><mn>2</mn><mi>a</mi><mo>&#215;</mo><mi>a</mi><mo>=</mo><mn>2</mn><mi>&#960;</mi><msup><mi>a</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>A</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mi>L</mi><mrow><mn>2</mn><mi>m</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>&#960;</mi><msup><mi>a</mi><mn>2</mn></msup></mrow><mi>T</mi></mfrac></math>, where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math>&nbsp;is the angular momentum of the satellite about the centre of the Earth.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>L</mi><mo>=</mo><mfrac><mrow><mn>4</mn><mi>&#960;</mi><mi>m</mi><msup><mi>a</mi><mn>2</mn></msup><msqrt><mi>G</mi><mi>M</mi></msqrt></mrow><mrow><mn>2</mn><mi>&#960;</mi><msqrt><mn>8</mn><msup><mi>a</mi><mn>3</mn></msup></msqrt></mrow></mfrac><mo>=</mo><mi>m</mi><msqrt><mfrac><mrow><mi>G</mi><mi>M</mi><mi>a</mi></mrow><mn>2</mn></mfrac></msqrt></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638667a69f0e7a4f89", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "58", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>Suppose the gravitational force varies inversely as the <math><msup><mrow><mi>n</mi></mrow><mrow><mi>t</mi><mi>h</mi></mrow></msup></math> power of the distance. Then the time period of a planet in circular orbit of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;around the sun will be proportional to</p>\r", "image": null}, "options": [{"id": "Q0BRI", "text": "<math><msup><mrow><mi>R</mi></mrow><mrow><mo>-</mo><mi>n</mi></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "Z32Wi", "text": "<math><msup><mrow><mi>R</mi></mrow><mrow><mfrac><mrow><mfenced separators=\"|\"><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "quL3H", "text": "<math><msup><mrow><mi>R</mi></mrow><mrow><mfrac><mrow><mfenced separators=\"|\"><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "G7kyA", "text": "<math><msup><mrow><mi>R</mi></mrow><mrow><mi>n</mi></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Gravitational force <math><mo>=</mo><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><mrow><msup><mrow><mi>d</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math> (Newton's law)<br /><br />But in this case,&nbsp;<math><mi>F</mi><mo>=</mo><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><mrow><msup><mrow><mi>R</mi></mrow><mrow><mi>n</mi></mrow></msup></mrow></mfrac></math> and it provides the necessary centripetal force <math><mfrac><mrow><mi>m</mi><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>R</mi></mrow></mfrac></math><br /><br /><math><mo>∴</mo></math> <math><mfrac><mrow><mi>m</mi><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>R</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><mrow><msup><mrow><mi>R</mi></mrow><mrow><mi>n</mi></mrow></msup></mrow></mfrac></math><br /><math><mo>∴</mo></math> <math><mi>v</mi><mo>=</mo><msqrt><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mrow><msup><mrow><mi>R</mi></mrow><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfrac></msqrt></math> and the period&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> of a planet,&nbsp;<math><mi>T</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>π</mi><mi>R</mi></mrow><mrow><mi>v</mi></mrow></mfrac></math><br /><br /><math><mo>∴</mo></math> <math><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><mi>R</mi><msqrt><mfrac><mrow><msup><mrow><mi>R</mi></mrow><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></msup></mrow><mrow><mi>G</mi><mi>M</mi></mrow></mfrac></msqrt><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><msup><mrow><mi>R</mi></mrow><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msup></mrow><mrow><mi>G</mi><mi>M</mi></mrow></mfrac></msqrt><mo>=</mo><mfrac><mrow><mn>2</mn><mi>π</mi></mrow><mrow><msqrt><mi>G</mi><mi>M</mi></msqrt></mrow></mfrac><mo>⋅</mo><msup><mrow><mi>R</mi></mrow><mrow><mfrac><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup></math><br /><br /><math><mo>∴</mo></math> <math><mi>T</mi><mo>∝</mo><m 0-05-25T09:00:00.000Z"}], "question": {"text": "A planet of the sun is in a circular orbit around the sun, midway between the sun and the earth. Then", "image": null}, "options": [{"id": "M8qwv", "text": "the period of the planet is nearly <math><mn>229</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">y</mi><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "yRu8e", "text": "the period of the planet is nearly <math><mn>129</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">y</mi><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": true}, {"id": "wziQZ", "text": "the speed of the planet is greater than the escape velocity of the earth", "image": null, "isCorrect": false}, {"id": "GtkBt", "text": "the acceleration of the planet is two times the acceleration of the earth", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>T</mi><mn>2</mn></msup><mo>∝</mo><mi>&nbsp;</mi><msup><mi>r</mi><mn>3</mn></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>T</mi><mn>1</mn></msub><msub><mi>T</mi><mn>2</mn></msub></mfrac><mo>=</mo><msup><mfenced separators=\"|\"><mfrac><mi>r</mi><mrow><mi>r</mi><mo>/</mo><mn>2</mn></mrow></mfrac></mfenced><mrow><mn>3</mn><mo>/</mo><mn>2</mn></mrow></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>365</mn><mi>&nbsp;</mi><mtext>days</mtext></mrow><mi>T</mi></mfrac><mo>=</mo><mn>2</mn><msqrt><mn>2</mn></msqrt><mo>;</mo><mi>&nbsp;</mi><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mi>T</mi><mo>=</mo><mfrac><mn>365</mn><mrow><mn>2</mn><msqrt><mn>2</mn></msqrt></mrow></mfrac><mi>&nbsp;</mi><mtext>days</mtext><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>⇒</mo><mn>129</mn><mi>&nbsp;</mi><mtext>days</mtext></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634c744fde556bdb72", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "77", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A small planet is revolving around a very massive star in a circular orbit of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi></math> with a period of revolution <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi></math>. If the gravitational force between the planet and the star is proportional to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">r</mi><mrow><mo>-</mo><mn>5</mn><mo>/</mo><mn>2</mn></mrow></msup></math>, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi></math> will be proportional to", "image": null}, "options": [{"id": "E2xl8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">r</mi><mrow><mn>3</mn><mo>/</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "tlHQv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">r</mi><mrow><mn>5</mn><mo>/</mo><mn>3</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "6ltwX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">r</mi><mrow><mn>7</mn><mo>/</mo><mn>4</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "4Xlpb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">r</mi><mn>3</mn></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Gravitational force provides the necessary centripetal force required by the given planet for circular motion. So<br /><br /><math> <mrow> <mfrac> <mrow> <msup> <mtext>mv</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mtext>r</mtext> </mrow> </mfrac> <mo>&#8733;</mo> <msup> <mtext>r</mtext> <mrow> <mo>-</mo> <mn>5</mn> <mo>/</mo> <mn>2</mn> </mrow> </msup> </mrow> </math><br /><br /><math> <mrow> <mo>&#8658;&#160;&#160;</mo> <mfrac> <mrow> <msup> <mtext>mv</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mtext>r</mtext> </mrow> </mfrac> <mo>=</mo> <msup> <mtext>kr</mtext> <mrow> <mo>-</mo> <mn>5</mn> <mo>/</mo> <mn>2</mn> </mrow> </msup> </mrow> </math>,&nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">k</mi></math> = constant<br /><br /><math> <mrow> <mo>&#8756;&#160;&#160;</mo> <mtext>v</mtext> <mo>=</mo> <msqrt> <mfrac> <mrow> <msup> <mtext>kr</mtext> <mrow> <mo>-</mo> <mn>3</mn> <mo>/</mo> <mn>2</mn> </mrow> </msup> </mrow> <mrow> <mtext>m</mtext> </mrow> </mfrac> </msqrt> </mrow> </math><br /><br /><math> <mrow> <mtext>T</mtext> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> <mi>&#960;</mi> <mtext>r</mtext> </mrow> <mrow> <mtext>v</mtext> </mrow> </mfrac> <mo>=</mo> <mn>2</mn> <mi>&#960;</mi> <mtext>r</mtext> <mo>&#215;</mo> <mfrac> <mrow> <msqrt> <mtext>m</mtext> </msqrt> </mrow> <mrow> <msqrt> <mtext>k</mtext> <msup> <mtext>r</mtext> <mrow> <mo>-</mo> <mn>3</mn> <mo>/</mo> <mn>2</mn> </mrow> </msup> </msqrt> </mrow> </mfrac> </mrow> </math><br /><br />i.e.,&nbsp; <math> <mrow> <mtext>T</mtext> <mo>&#8733;</mo> <msup> <mtext>r</mtext> <mrow> <mn>7</mn> <mo>/</mo> <mn>4</mn> </mrow> </msup> </mrow> </math>.&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "notAttempted", "lastPracticed": null}, {"_id": "6151e8633dc5b5be325e8ad5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "41", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A planet revolves about the sun in an elliptical orbit of semi-major axis <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>×</mo><msup><mn>10</mn><mn>12</mn></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>. The areal velocity of the planet when it is nearest to the sun is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>.4</mo><mo>×</mo><msup><mn>10</mn><mn>16</mn></msup><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. If the least distance between the planet and the sun is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.8</mo><mo>×</mo><msup><mn>10</mn><mn>12</mn></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>, then the minimum speed of the planet is", "image": null}, "options": [{"id": "aAJFb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>min</mi></msub><mo>=</mo><mn>40</mn><mo>&#xA0;</mo><mi>km</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "Jxk0d", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>min</mi></msub><mo>=</mo><mn>30</mn><mo>&#xA0;</mo><mi>km</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "boDoN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>min</mi></msub><mo>=</mo><mn>10</mn><mo>&#xA0;</mo><mi>km</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "UqJfq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>min</mi></msub><mo>=</mo><mn>20</mn><mo>&#xA0;</mo><mi>km</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The areal velocity of a planet around the sun is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>A</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mi>L</mi><mrow><mn>2</mn><mi>m</mi></mrow></mfrac></math>, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math>&nbsp;is the angular momentum of the planet around the sun and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>&nbsp;is its mass.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>.</mo><mn>4</mn><mo>&#215;</mo><msup><mn>10</mn><mn>16</mn></msup><mo>=</mo><mfrac><mrow><mi>m</mi><msub><mi>v</mi><mi>min</mi></msub><msub><mi>r</mi><mi>max</mi></msub></mrow><mrow><mn>2</mn><mi>m</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#215;</mo><mn>4</mn><mo>.</mo><mn>4</mn><mo>&#215;</mo><msup><mn>10</mn><mn>16</mn></msup><mo>=</mo><msub><mi>v</mi><mi>min</mi></msub><mfenced><mrow><mn>4</mn><mo>&#215;</mo><msup><mn>10</mn><mn>12</mn></msup><mo>-</mo><mn>1</mn><mo>.</mo><mn>8</mn><mo>&#215;</mo><msup><mn>10</mn><mn>12</mn></msup></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>min</mi></msub><mo>=</mo><mn>40</mn><mo>&#160;</mo><mi>km</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633a36abc4ca5f7025", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "12", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A small planet is revolving around a very massive star in a circular orbit of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi></math> with a period of revolution <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi></math>. If the gravitational force between the planet and the star is proportional to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">r</mi><mrow><mn>5</mn><mo>/</mo><mn>2</mn></mrow></msup></math>, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi></math> will be proportional to", "image": null}, "options": [{"id": "x3Vo9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">r</mi><mrow><mn>3</mn><mo>/</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "YWA5y", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">r</mi><mrow><mn>5</mn><mo>/</mo><mn>3</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "EAWIZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">r</mi><mrow><mn>7</mn><mo>/</mo><mn>4</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "Qlh89", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">r</mi><mn>3</mn></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the question, the gravitational force between the planet and the star is \\(\\mathrm{F} \\propto \\frac{1}{\\mathrm{R}^{5 / 2}}\\)\n\\(\\therefore \\mathrm{F}=\\frac{\\mathrm{GMm}}{\\mathrm{R}^{5 / 2}}\\)\nWhere M and M be masses of star and planet respectively.\nFor motion of planet in circular orbit,\n\\(\\mathrm{mR} \\omega^{2}=\\frac{\\mathrm{GMm}}{\\mathrm{R}^{5 / 2}}\\)\n\\(\\mathrm{mR}\\left(\\frac{2 \\pi}{\\mathrm{T}}\\right)^{2}=\\frac{\\mathrm{GMm}}{\\mathrm{R}^{5 / 2}}\\) \\(\\left(\\therefore \\omega=\\frac{2 \\pi}{\\mathrm{T}}\\right)\\)\n\\(\\frac{4 \\pi^{2}}{\\mathrm{~T}^{2}}=\\frac{\\mathrm{GM}}{\\mathrm{R}^{7 / 2}} \\Rightarrow \\mathrm{T}^{2}=\\frac{4 \\pi^{2}}{\\mathrm{GM}} \\mathrm{R}^{7 / 2}\\)\n\\(\\mathrm{T}^{2} \\propto \\mathrm{R}^{7 / 2}\\) or \\(\\mathrm{T}^{2} \\propto \\mathrm{R}^{7 / 4}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863339a6f5f8bfbb4ce", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "08", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The given figure shows the elliptical orbit of a planet <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>&nbsp;about the sun <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math>.&nbsp;If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>t</mi><mn>1</mn></msub></math>&nbsp;is the time taken by the planet to move from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math>&nbsp;to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>D</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>t</mi><mn>2</mn></msub></math>&nbsp;is the time taken by the planet to move from&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>, then the relation between <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>t</mi><mn>1</mn></msub></math><sub>&nbsp;</sub>and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>t</mi><mn>2</mn></msub></math>&nbsp;is [Given,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mi>r</mi><mi>e</mi><mi>a</mi><mo>&nbsp;</mo><mi>S</mi><mi>C</mi><mi>D</mi><mo>=</mo><mn>2</mn><mfenced><mrow><mi>a</mi><mi>r</mi><mi>e</mi><mi>a</mi><mo>&nbsp;</mo><mi>S</mi><mi>A</mi><mi>B</mi></mrow></mfenced></math>]<br />\r<br />\r&nbsp; &nbsp; &nbsp; &nbsp;&nbsp;<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0017141_Question_1.jpg\" style=\"width: 200px; height: 126px;\" />", "image": null}, "options": [{"id": "Yeiau", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>t</mi><mn>1</mn></msub><mo>=</mo><mn>4</mn><msub><mi>t</mi><mn>2</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "FRTzn", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>t</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn><msub><mi>t</mi><mn>2</mn></msub></math>", "image": null, "isCorrect": true}, {"id": "dfvpL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>t</mi><mn>1</mn></msub><mo>=</mo><mn></mn><msub><mi>t</mi><mn>2</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "fYmg4", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mi>t</mi><mn>1</mn></msub><mo>=</mo><msub><mi>t</mi><mn>2</mn></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to kepler's second law<br />Equal areas are swept in equal time. t<sub>1</sub>, the time taken to go from C to D = 2t<sub>2</sub> where t<sub>2</sub> is the time taken to go from A to B. As it is given that area SCD = 2SAB.<sub>​</sub>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631250a9744a847250", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "95", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An object is projected from the earth's surface with escape velocity at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mn>0</mn><mo>°</mo></math> with horizontal. What is the angle made by the velocity with horizontal when the object reaches a height <math> <mrow> <mn>2</mn><mi>R</mi></mrow> </math> from the earth's surface? <math> <mi>R</mi> </math> is the radius of the earth. Horizontal can be considered as a line parallel to the tangent at the earth's surface just below the object.", "image": null}, "options": [{"id": "ws41E", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&#176;</mo></math>", "image": null, "isCorrect": false}, {"id": "NVLOG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>45</mn><mo>&#176;</mo></math>", "image": null, "isCorrect": false}, {"id": "NuSmo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>&#176;</mo></math>", "image": null, "isCorrect": true}, {"id": "8EGLV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>&#176;</mo></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mfrac><mrow><mo>-</mo><mi>G</mi><mi>M</mi><mi>m</mi></mrow><mrow><mi>R</mi></mrow></mfrac><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#160;</mi><mo>+</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#160;</mi><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>m</mi><mi>x</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>2</mn><mi>G</mi><mi>M</mi></mrow><mrow><mi>R</mi></mrow></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mo>-</mo><mi>G</mi><mi>M</mi><mi>m</mi></mrow><mrow><mn>3</mn><mi>R</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>m</mi><msubsup><mrow><mi>v</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup></math><br /><br /><math><mo>&#8658;</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#160;</mi><msub><mrow><mi>v</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mi>G</mi><mi>M</mi></mrow><mrow><mn>3</mn><mi>R</mi></mrow></mfrac></msqrt></math><br /><br />By conservation of angular momentum:<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>&#215;</mo><msqrt><mfrac><mrow><mn>2</mn><mi>G</mi><mi>M</mi></mrow><mi>R</mi></mfrac></msqrt><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mn>30</mn><mo>&#176;</mo><mo>&#215;</mo><mi>R</mi><mo>=</mo><mi>m</mi><mo>&#215;</mo><msub><mi>v</mi><mn>1</mn></msub><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mi>&#952;</mi><mo>&#215;</mo><mn>3</mn><mi>R</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mi>&#952;</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi mathvariant=\"normal\">&#160;</mi><mo>&#8658;</mo><mi mathvariant=\"normal\">&#160;</mi><mi>&#952;</mi><mo>=</mo><mn>6</mn><mn>0</mn><mo>&#176;</mo></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630cfc9dcee7035c7b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "86", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A planet moving around the sun sweeps area <math><msub><mrow><mi>A</mi></mrow><mrow><mn>1</mn></mrow></msub></math> in <math><mn>2</mn></math> days, <math><msub><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></msub></math> in <math><mn>4</mn></math> days and <math><msub><mrow><mi>A</mi></mrow><mrow><mn>3</mn></mrow></msub></math> in <math><mn>9</mn></math> days. Then, relation between them<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/CA_physi.JPG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 100px; height: 64px;\" />", "image": null}, "options": [{"id": "uJLWT", "text": "<math><msub><mrow><mi>A</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><msub><mrow><mi>A</mi></mrow><mrow><mn>3</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "w9r6F", "text": "<math><mn>9</mn><msub><mrow><mi>A</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>3</mn><msub><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>2</mn><msub><mrow><mi>A</mi></mrow><mrow><mn>3</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "tuCsR", "text": "<math><mn>18</mn><msub><mrow><mi>A</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>9</mn><msub><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>4</mn><msub><mrow><mi>A</mi></mrow><mrow><mn>3</mn></mrow></msub></math>", "image": null, "isCorrect": true}, {"id": "EFFyk", "text": "<math><mn>3</mn><msub><mrow><mi>A</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>4</mn><msub><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>6</mn><msub><mrow><mi>A</mi></mrow><mrow><mn>3</mn></mrow></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From Kepler's law of area, the aerial velocity remains constant, for a planet moves around the sun.<br /><br />We have, <math><mfrac><mrow><msub><mrow><mi>A</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>4</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi>A</mi></mrow><mrow><mn>3</mn></mrow></msub></mrow><mrow><mn>9</mn></mrow></mfrac></math><br /><br /><math><mo>⇒</mo><mn>18</mn><msub><mrow><mi>A</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>9</mn><msub><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>4</mn><msub><mrow><mi>A</mi></mrow><mrow><mn>3</mn></mrow></msub></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630999a307a92d04ec", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "88", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The graph between the square of the time period and cube of the distance of the planet from the sun is", "image": null}, "options": [{"id": "kz48H", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0028532_Option_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 114px; height: 106px;\" />", "image": null, "isCorrect": false}, {"id": "tMeVc", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0028532_Option_2.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 116px; height: 105px;\" />", "image": null, "isCorrect": false}, {"id": "vVxDr", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0028532_Option_3.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 116px; height: 110px;\" />", "image": null, "isCorrect": true}, {"id": "sJn01", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0028532_Option_4.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 121px; height: 118px;\" />", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to kepler&#39;s third law <math><msup><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>&prop;</mo><msup><mrow><mi>r</mi></mrow><mrow><mn>3</mn></mrow></msup><mo>;</mo></math> At <math><mi>r</mi><mo>=</mo><mn>0</mn><mo>,</mo><mi>T</mi><mo>=</mo><mn>0</mn></math>. It shows that the graph between <math><msup><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msup></math> and <math><msup><mrow><mi>r</mi></mrow><mrow><mn>3</mn></mrow></msup></math> is a straight line passing through origin", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630781c95d656ee3d4", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "56", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A satellite is launched into a circular orbit of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> around the earth. A second satellite is launched int ><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><msubsup><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>8</mn></mrow></mfrac></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><mn>2</mn><msqrt><mn>2</mn></msqrt></mrow></mfrac></math><br /><br /><math><mo>=</mo><mfrac><mrow><mn>365</mn></mrow><mrow><mn>2</mn><mo>×</mo><mn>1.414</mn></mrow></mfrac></math><br /><br /><math><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>129</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">y</mi><mi mathvariant=\"normal\">s</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
