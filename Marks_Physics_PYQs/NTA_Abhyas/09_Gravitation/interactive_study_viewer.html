: null, "isCorrect": true}, {"id": "XjST4", "text": "<math><msqrt><mfrac><mrow><mi>G</mi><mi>M</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><msup><mrow><mfenced separators=\"|\"><mrow><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced></mrow><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "mvdBL", "text": "<math><msqrt><mfrac><mrow><mn>3</mn><mi mathvariant=\"bold-italic\">G</mi><mi mathvariant=\"bold-italic\">M</mi><msup><mrow><mi mathvariant=\"bold-italic\">R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><msup><mrow><mfenced separators=\"|\"><mrow><msup><mrow><mi mathvariant=\"bold-italic\">R</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi mathvariant=\"bold-italic\">a</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced></mrow><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "uKqGF", "text": "<math><msqrt><mfrac><mrow><mn>5</mn><mi>G</mi><mi>M</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><msup><mrow><mfenced separators=\"|\"><mrow><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced></mrow><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/c10104f9-1f57-45ea-9f2a-94878f94b622-image2.jpeg\" style=\"height: 120px; width: 200px;\" /><br /><br /><math><msub><mrow><mi>F</mi></mrow><mrow><mi>R</mi></mrow></msub><mo>=</mo><mn>2</mn><mi>F</mi><mrow><mrow><mi mathvariant=\"italic\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></math><br /><math><mfrac><mrow><mi>m</mi><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>R</mi></mrow></mfrac><mo>=</mo><mfenced separators=\"|\"><mrow><mn>2</mn></mrow></mfenced><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><mrow><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>R</mi></mrow><mrow><mi>r</mi></mrow></mfrac></mrow></mfenced></math><br /><math><mi>r</mi><mo>=</mo><msqrt><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></msqrt></math><br /><math><mo>⇒</mo><mo> </mo><mi>v</mi><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mi>G</mi><mi>M</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><msup><mrow><mfenced separators=\"|\"><mrow><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced></mrow><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup></mrow></mfrac></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639827f48dfa988514", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "64", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The binding energy of a satellite of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> in an orbit of radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math> is (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> = radius of the earth,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">g</mi></math> = acceleration due to gravity)", "image": null}, "options": [{"id": "87yQC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>m</mi><mi mathvariant=\"normal\">g</mi><msup><mi>R</mi><mn>2</mn></msup></mrow><mi>r</mi></mfrac></math>", "image": null, "isCorrect": false}, {"id": "uR3aj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>m</mi><mi mathvariant=\"normal\">g</mi><msup><mi>R</mi><mn>2</mn></msup></mrow><mrow><mn>2</mn><mi>r</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "NVzC7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>m</mi><mi mathvariant=\"normal\">g</mi><msup><mi>R</mi><mn>2</mn></msup></mrow><mrow><mn>4</mn><mi>r</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "76opD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mi>m</mi><mi mathvariant=\"normal\">g</mi><msup><mi>R</mi><mn>2</mn></msup></mrow><mi>r</mi></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The energy required to remove the satellite from its orbit around the earth to infinity is called binding energy of the satellite. It is equal to negative of total mechanical energy of a satellite in its orbit.<br />Thus,<br />The binding energy of the Earth-satellite system,<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext>E</mtext> <mo>=</mo> <mfrac> <mrow> <mo>-</mo> <mtext>GMm</mtext> </mrow> <mrow> <mn>2</mn> <mtext>r</mtext> </mrow> </mfrac> </mrow> </math><br /><br />using,&nbsp;&nbsp;<math><mrow><mtext>g</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>GM</mtext> </mrow> <mrow> <msup> <mtext>R</mtext> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>⇒&nbsp;&nbsp;&nbsp;</mo> <mtext>GM</mtext> <mo>=</mo> <msup> <mtext>gR</mtext> <mn>2</mn> </msup> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴&nbsp;&nbsp;</mo><mi>BE</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">m</mi><msup><mi mathvariant=\"normal\">R</mi><mn>2</mn></msup></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">r</mi></mrow></mfrac></math>&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638e928b548de37a30", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "36", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A satellite of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> orbits around the Earth of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> in an elliptical orbit of semi-major and semi-minor axes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>a</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math>&nbsp;respectively. The angular momentum of the satellite about the centre of the Earth is", "image": null}, "options": [{"id": "TpSY0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#x3C0;</mi><mi>m</mi><msqrt><mfrac><mrow><mi>G</mi><mi>M</mi><mi>a</mi></mrow><mn>2</mn></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "Z15oU", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#x3C0;</mi><mi>m</mi><msqrt><mfrac><mrow><mi>G</mi><mi>M</mi><mi>a</mi></mrow><mn>4</mn></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "gDu0O", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><msqrt><mfrac><mrow><mi>G</mi><mi>M</mi><mi>a</mi></mrow><mn>8</mn></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "UhNLp", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><msqrt><mfrac><mrow><mi>G</mi><mi>M</mi><mi>a</mi></mrow><mn>2</mn></mfrac></msqrt></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>If the satellite was orbiting the Earth in a circular orbit of radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>a</mi></math>, then its time period would be</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><msup><mfenced><mrow><mn mathvariant=\"normal\">2</mn><mi mathvariant=\"italic\">a</mi></mrow></mfenced><mn>3</mn></msup><mrow><mi>G</mi><mi>M</mi></mrow></mfrac></msqrt></math></p><p>The same would be the time period of the satellite if it orbits in an ellipse having a&nbsp;semi-major axis&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>a</mi></math></p><p>The area of the ellipse is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mi>&#960;</mi><mo>&#215;</mo><mn>2</mn><mi>a</mi><mo>&#215;</mo><mi>a</mi><mo>=</mo><mn>2</mn><mi>&#960;</mi><msup><mi>a</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>A</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mi>L</mi><mrow><mn>2</mn><mi>m</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>&#960;</mi><msup><mi>a</mi><mn>2</mn></msup></mrow><mi>T</mi></mfrac></math>, where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math>&nbsp;is the angular momentum of the satellite about the centre of the Earth.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>L</mi><mo>=</mo><mfrac><mrow><mn>4</mn><mi>&#960;</mi><mi>m</mi><msup><mi>a</mi><mn>2</mn></msup><msqrt><mi>G</mi><mi>M</mi></msqrt></mrow><mrow><mn>2</mn><mi>&#960;</mi><msqrt><mn>8</mn><msup><mi>a</mi><mn>3</mn></msup></msqrt></mrow></mfrac><mo>=</mo><mi>m</mi><msqrt><mfrac><mrow><mi>G</mi><mi>M</mi><mi>a</mi></mrow><mn>2</mn></mfrac></msqrt></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638667a69f0e7a4f89", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "58", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>Suppose the gravitational force varies inversely as the <math><msup><mrow><mi>n</mi></mrow><mrow><mi>t</mi><mi>h</mi></mrow></msup></math> power of the distance. Then the time period of a planet in circular orbit of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;around the sun will be proportional to</p>\r", "image": null}, "options": [{"id": "Q0BRI", "text": "<math><msup><mrow><mi>R</mi></mrow><mrow><mo>-</mo><mi>n</mi></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "Z32Wi", "text": "<math><msup><mrow><mi>R</mi></mrow><mrow><mfrac><mrow><mfenced separators=\"|\"><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "quL3H", "text": "<math><msup><mrow><mi>R</mi></mrow><mrow><mfrac><mrow><mfenced separators=\"|\"><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "G7kyA", "text": "<math><msup><mrow><mi>R</mi></mrow><mrow><mi>n</mi></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Gravitational force <math><mo>=</mo><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><mrow><msup><mrow><mi>d</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math> (Newton's law)<br /><br />But in this case,&nbsp;<math><mi>F</mi><mo>=</mo><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><mrow><msup><mrow><mi>R</mi></mrow><mrow><mi>n</mi></mrow></msup></mrow></mfrac></math> and it provides the necessary centripetal force <math><mfrac><mrow><mi>m</mi><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>R</mi></mrow></mfrac></math><br /><br /><math><mo>∴</mo></math> <math><mfrac><mrow><mi>m</mi><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>R</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><mrow><msup><mrow><mi>R</mi></mrow><mrow><mi>n</mi></mrow></msup></mrow></mfrac></math><br /><math><mo>∴</mo></math> <math><mi>v</mi><mo>=</mo><msqrt><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mrow><msup><mrow><mi>R</mi></mrow><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfrac></msqrt></math> and the period&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> of a planet,&nbsp;<math><mi>T</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>π</mi><mi>R</mi></mrow><mrow><mi>v</mi></mrow></mfrac></math><br /><br /><math><mo>∴</mo></math> <math><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><mi>R</mi><msqrt><mfrac><mrow><msup><mrow><mi>R</mi></mrow><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></msup></mrow><mrow><mi>G</mi><mi>M</mi></mrow></mfrac></msqrt><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><msup><mrow><mi>R</mi></mrow><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msup></mrow><mrow><mi>G</mi><mi>M</mi></mrow></mfrac></msqrt><mo>=</mo><mfrac><mrow><mn>2</mn><mi>π</mi></mrow><mrow><msqrt><mi>G</mi><mi>M</mi></msqrt></mrow></mfrac><mo>⋅</mo><msup><mrow><mi>R</mi></mrow><mrow><mfrac><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup></math><br /><br /><math><mo>∴</mo></math> <math><mi>T</mi><mo>∝</mo><msup><mrow><mi>R</mi></mrow><mrow><mfrac><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636fa08c2d258b4d6f", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "59", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A projectile of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> is fired from the surface of the earth at an angle&nbsp;<math><mrow><mi>α</mi> <mo>=</mo> <mn>6</mn> <msup> <mn>0</mn> <mo>∘</mo> </msup> </mrow> </math> from the vertical. The initial speed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>0</mn></msub></math> is equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><msub><mtext mathvariant=\"italic\">GM</mtext><mtext>e</mtext></msub><msub><mtext mathvariant=\"italic\">R</mtext><mtext>e</mtext></msub></mfrac></msqrt></math>. The maximum height that projectile can rise from the surface of the earth is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mtext mathvariant=\"italic\">R</mtext><mtext>e</mtext></msub><mtext mathvariant=\"italic\">x</mtext></mfrac></math>. Find the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>?<br />\r<br />\r<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>G</mi></math> = <span style=\"font-family: 'Helvetica Neue', Helvetica, 'Segoe UI', Arial, freesans, sans-serif; font-size: 14px; line-height: 22.3999996185303px;\">Universal Gravitational constant</span><br />\r<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>M</mi><mi mathvariant=\"italic\">e</mi></msub></math> = Mass of earth<br />\r<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mi>e</mi></msub></math> = Radius of earth<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0067924_Q_1.png\" style=\"width: 181px; height: 180px;\" /></p>\r", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/67067.png\" style=\"width: 250px; height: 230px;\" /><br /><br />By conservation of angular momentum about C at position P and F<br /><br /><math> <mrow> <msub> <mtext>mv</mtext> <mn>0</mn> </msub> <mfrac> <mrow> <msqrt> <mn>3</mn> </msqrt> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msub> <mtext>R</mtext> <mtext>e</mtext> </msub> <mo>=</mo> <mtext>mv</mtext> <msub> <mo>r</mo> <mtext>max</mtext> </msub> </mrow> </math><br /><br /><math> <mrow> <mo>⇒&nbsp;&nbsp;&nbsp;</mo> <mtext>v</mtext> <mo>=</mo> <mfrac> <mrow> <msqrt> <mn>3</mn> </msqrt> <msub> <mtext>R</mtext> <mtext>e</mtext> </msub> <msub> <mtext>v</mtext> <mn>0</mn> </msub> </mrow> <mrow> <mn>2</mn> <msub> <mo>r</mo> <mtext>max</mtext> </msub> </mrow> </mfrac> </mrow> </math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(i)<br /><br />By conservation of mechanical energy between P and F<br /><br /><math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msubsup> <mtext>mv</mtext> <mn>0</mn> <mn>2</mn> </msubsup> <mo>-</mo> <mfrac> <mrow> <msub> <mtext>GM</mtext> <mtext>e</mtext> </msub> <mtext>m</mtext> </mrow> <mrow> <msub> <mtext>R</mtext> <mtext>e</mtext> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msup> <mtext>mv</mtext> <mn>2</mn> </msup> <mo>-</mo> <mfrac> <mrow> <msub> <mtext>GM</mtext> <mtext>e</mtext> </msub> <mtext>m</mtext> </mrow> <mrow> <msub> <mtext>r</mtext> <mtext>max</mtext> </msub> </mrow> </mfrac> </mrow> </math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(ii)<br /><br />Put (i) in (ii)<br /><br /><math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msubsup> <mtext>mv</mtext> <mn>0</mn> <mn>2</mn> </msubsup> <mo>-</mo> <mfrac> <mrow> <msub> <mtext>GM</mtext> <mtext>e</mtext> </msub> <mtext>m</mtext> </mrow> <mrow> <msub> <mtext>R</mtext> <mtext>e</mtext> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>m</mtext> <mfrac> <mrow> <mn>3</mn> <msup> <mtext>R</mtext> <mn>2</mn> </msup> <msubsup> <mtext>v</mtext> <mn>0</mn> <mn>2</mn> </msubsup> </mrow> <mrow> <mn>4</mn> <msubsup> <mo>r</mo> <mtext>max</mtext> <mn>2</mn> </msubsup> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <msub> <mtext>GM</mtext> <mtext>e</mtext> </msub> <mtext>m</mtext> </mrow> <mrow> <msub> <mtext>r</mtext> <mtext>max</mtext> </msub> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <msub> <mtext>v</mtext> <mn>0</mn> </msub> <mo>=</mo> <msqrt> <mfrac> <mrow> <msub> <mtext>GM</mtext> <mtext>e</mtext> </msub> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </msqrt> </mrow> </math><br /><br /><math> <mrow> <mo>⇒&nbsp;&nbsp;&nbsp;</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>m</mtext> <mfrac> <mrow> <msub> <mtext>GM</mtext> <mtext>e</mtext> </msub> </mrow> <mrow> <msub> <mtext>R</mtext> <mtext>e</mtext> </msub> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <msub> <mtext>GM</mtext> <mtext>e</mtext> </msub> <mtext>m</mtext> </mrow> <mrow> <msub> <mtext>R</mtext> <mtext>e</mtext> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>8</mn> </mrow> </mfrac> <mfrac> <mrow> <msubsup> <mtext>mR</mtext> <mtext>e</mtext> <mn>2</mn> </msubsup> </mrow> <mrow> <msubsup> <mtext>r</mtext> <mtext> 6cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A particle is projected from point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>, that is at a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi mathvariant=\"normal\">R</mi></math> from the centre of the earth, with speed <math><msub><mrow><mi mathvariant=\"normal\">v</mi></mrow><mrow><mn>1</mn></mrow></msub></math> in a direction making <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>°</mo></math> with the line joining the centre of the earth and point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>, as shown. Find the speed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">v</mi><mn>1</mn></msub></math> if particle grazes the surface of the earth as shown in the figure. Consider gravitational interaction only between these two. (use <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi mathvariant=\"normal\">G</mi><mi mathvariant=\"normal\">M</mi></mrow><mi mathvariant=\"normal\">R</mi></mfrac><mo>=</mo><mn>6.4</mn><mo>×</mo><msup><mn>10</mn><mn>7</mn></msup><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>)<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image11-5757f813-56fe-42b3-b958-8358dec05bba.jpg\" />", "image": null}, "options": [{"id": "RmdEi", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><msqrt><mn>2</mn></msqrt><mo>&#xA0;</mo><mi>km</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "JkxvO", "text": "<math xmlns=\"http://www.w3 >1</mn></mrow></msup></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635e6e0f30c620d20b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "19", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A cord of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">h</mi><mo>=</mo><mn>64</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> is used to connect an astronaut (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi><mo>=</mo><mn>100</mn><mo>&nbsp;</mo><mi>kg</mi></math>) to a spaceship (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi><mo>≫</mo><mi mathvariant=\"normal\">m</mi></math>) which is&nbsp;orbiting near the earth's surface as shown in the figure. Assuming&nbsp;that the spaceship and the astronaut fall on a straight line from the earth's centre, then the tension in the cord is close to [<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi><mo>=</mo><mn>6400</mn><mo>&nbsp;</mo><mi>km</mi></math>]&nbsp;<br />\r<br />\r<u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014055_Ques1_1.jpg\" style=\"width: 250px; height: 267px;\" /></strong></u></p>\r", "image": null}, "options": [{"id": "e7H2f", "text": "<math> <mrow> <mn>3</mn> <mo>×</mo> <mn>1</mn> <msup> <mn>0</mn> <mrow> <mo>-</mo> <mn>2</mn></mrow></msup><mtext>&nbsp;N</mtext> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "IR4sg", "text": "<math><mrow>  <mn>2</mn>  <mo>&times;</mo>  <mn>1</mn>  <msup>          <mn>0</mn>      <mrow>        <mo>-</mo>        <mn>2</mn>      </mrow>  </msup>  <mtext>&nbsp;N</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "lw5RW", "text": "<math><mrow>  <mn>4</mn>  <mo>&times;</mo>  <mn>1</mn>  <msup>          <mn>0</mn>      <mrow>        <mo>-</mo>        <mn>2</mn>      </mrow>  </msup>  <mtext>&nbsp;N</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "vfAmZ", "text": "<math> <mrow> <mn>5</mn> <mo>×</mo> <mn>1</mn> <msup> <mn>0</mn> <mrow> <mo></mo> <mn>-2</mn> </mrow> </msup> <mtext>&nbsp;N</mtext> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to given problem, the mass of satellite <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi></math> is much greater than that of astronaut <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math>. So the centre of mass of the system will be close to satellite and as the satellite is orbiting close to the surface of earth, the equation of motion of the system <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">S</mi><mo>+</mo><mi mathvariant=\"normal\">A</mi><mo>)</mo></math> will be-<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mtext>GM</mtext><mrow><mi mathvariant=\"normal\">e</mi><mo>&#8289;</mo></mrow></msub><mfenced><mrow><mi mathvariant=\"normal\">M</mi><mo>&#8289;</mo><mo>+</mo><mi mathvariant=\"normal\">m</mi><mo>&#8289;</mo></mrow></mfenced></mrow><mrow><mi mathvariant=\"normal\">R</mi><msup><mo>&#8289;</mo><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mfenced><mrow><mi mathvariant=\"normal\">M</mi><mo>&#8289;</mo><mo>+</mo><mi mathvariant=\"normal\">m</mi><mo>&#8289;</mo></mrow></mfenced><mi mathvariant=\"normal\">R</mi><mo>&#8289;</mo><msup><mi mathvariant=\"normal\">&#969;</mi><mn>2</mn></msup></math><br /><br />i.e.,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi><mo>&#8289;</mo><msup><mi mathvariant=\"normal\">&#969;</mi><mn>2</mn></msup><mo>=</mo><mfrac><msub><mtext>GM</mtext><mrow><mi mathvariant=\"normal\">e</mi><mo>&#8289;</mo></mrow></msub><mrow><mi mathvariant=\"normal\">R</mi><msup><mo>&#8289;</mo><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mtext>g</mtext><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mo>&#8230;</mo><mfenced><mtext>i</mtext></mfenced></math><br /><br />And the equation of motion of the astronaut will be<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mtext>GM</mtext><mrow><mi mathvariant=\"normal\">e</mi><mo>&#8289;</mo></mrow></msub><mi mathvariant=\"normal\">m</mi><mo>&#8289;</mo></mrow><mrow><mi mathvariant=\"normal\">r</mi><msup><mo>&#8289;</mo><mn>2</mn></msup></mrow></mfrac><mo>+</mo><mi mathvariant=\"normal\">T</mi><mo>&#8289;</mo><mo>=</mo><mi mathvariant=\"normal\">m</mi><mo>&#8289;</mo><mi mathvariant=\"normal\">r</mi><mo>&#8289;</mo><msup><mi mathvariant=\"normal\">&#969;</mi><mn>2</mn></msup><mtext>,</mtext><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mtext>i.e.,</mtext><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mi mathvariant=\"normal\">T</mi><mo>&#8289;</mo><mo>=</mo><mi mathvariant=\"normal\">m</mi><mo>&#8289;</mo><mfenced open=\"[\" close=\"]\"><mrow><mi mathvariant=\"normal\">r</mi><mo>&#8289;</mo><msup><mi mathvariant=\"normal\">&#969;</mi><mn>2</mn></msup><mo>-</mo><mfrac><msub><mtext>GM</mtext><mrow><mi mathvariant=\"normal\">e</mi><mo>&#8289;</mo></mrow></msub><mrow><mi mathvariant=\"normal\">r</mi><msup><mo>&#8289;</mo><mn>2</mn></msup></mrow></mfrac></mrow></mfenced></math><br /><br />In the light of equation (i), above equation reduces to<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>&#8289;</mo><mo>=</mo><mtext>mg</mtext><mfenced open=\"[\" close=\"]\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">r</mi><mo>&#8289;</mo></mrow><mrow><mi mathvariant=\"normal\">R</mi><mo>&#8289;</mo></mrow></mfrac><mo>-</mo><msup><mfenced><mfrac><mrow><mi mathvariant=\"normal\">R</mi><mo>&#8289;</mo></mrow><mrow><mi mathvariant=\"normal\">r</mi><mo>&#8289;</mo></mrow></mfrac></mfenced><mn>2</mn></msup></mrow></mfenced><mo>=</mo><mtext>mg</mtext><mfenced open=\"[\" close=\"]\"><mrow><mfrac><mfenced><mrow><mi mathvariant=\"normal\">R</mi><mo>&#8289;</mo><mo>+</mo><mi mathvariant=\"normal\">h</mi><mo>&#8289;</mo></mrow></mfenced><mrow><mi mathvariant=\"normal\">R</mi><mo>&#8289;</mo></mrow></mfrac><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">R</mi><msup><mo>&#8289;</mo><mn>2</mn></msup></mrow><msup><mfenced><mrow><mi mathvariant=\"normal\">R</mi><mo>&#8289;</mo><mo>+</mo><mi mathvariant=\"normal\">h</mi><mo>&#8289;</mo></mrow></mfenced><mn>2</mn></msup></mfrac></mrow></mfenced></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><mrow><mtext>as</mtext><mspace width=\"0.5em\"/><mi mathvariant=\"normal\">r</mi><mo>&#8289;</mo><mo>=</mo><mi mathvariant=\"normal\">R</mi><mo>&#8289;</mo><mo>+</mo><mi mathvariant=\"normal\">h</mi><mo>&#8289;</mo></mrow></mfenced></math><br /><br />or&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>&#8289;</mo><mo>=</mo><mtext>mg</mtext><mfenced open=\"[\" close=\"]\"><mrow><mfenced><mrow><mn>1</mn><mo>+</mo><mfrac><mrow><mi mathvariant=\"normal\">h</mi><mo>&#8289;</mo></mrow><mrow><mi mathvariant=\"normal\">R</mi><mo>&#8289;</mo></mrow></mfrac></mrow></mfenced><mo>-</mo><msup><mfenced><mrow><mn>1</mn><mo>+</mo><mfrac><mrow><mi mathvariant=\"normal\">h</mi><mo>&#8289;</mo></mrow><mrow><mi mathvariant=\"normal\">R</mi><mo>&#8289;</mo></mrow></mfrac></mrow></mfenced><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>3</mn><mtext>mgh</mtext></mrow><mrow><mi mathvariant=\"normal\">R</mi><mo>&#8289;</mo></mrow></mfrac></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><mrow><mtext>as</mtext><msup><mfenced><mrow><mn>1</mn><mo>+</mo><mfrac><mrow><mi mathvariant=\"normal\">h</mi><mo>&#8289;</mo></mrow><mrow><mi mathvariant=\"normal\">R</mi><mo>&#8289;</mo></mrow></mfrac></mrow></mfenced><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>&#8909;</mo><mn>1</mn><mo>-</mo><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">h</mi><mo>&#8289;</mo></mrow><mrow><mi mathvariant=\"normal\">R</mi><mo>&#8289;</mo></mrow></mfrac></mrow></mfenced></math><br /><br />So substituting the given data,<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>&#8289;</mo><mo>=</mo><mfrac><mrow><mn>3</mn><mo>&#215;</mo><mn>100</mn><mo>&#215;</mo><mn>10</mn><mo>&#215;</mo><mn>64</mn></mrow><mrow><mn>6400</mn><mo>&#215;</mo><msup><mn>10</mn><mn>3</mn></msup></mrow></mfrac><mo>=</mo><mn>3</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>2</mn></mrow></msup><mspace width=\"0.5em\"/><mtext>N</mtext></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634dc70c46361dce7b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "38", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A planet of the sun is in a circular orbit around the sun, midway between the sun and the earth. Then", "image": null}, "options": [{"id": "M8qwv", "text": "the period of the planet is nearly <math><mn>229</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">y</mi><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "yRu8e", "text": "the period of the planet is nearly <math><mn>129</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">y</mi><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": true}, {"id": "wziQZ", "text": "the speed of the planet is greater than the escape velocity of the earth", "image": null, "isCorrect": false}, {"id": "GtkBt", "text": "the acceleration of the planet is two times the acceleration of the earth", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>T</mi><mn>2</mn></msup><mo>∝</mo><mi>&nbsp;</mi><msup><mi>r</mi><mn>3</mn></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>T</mi><mn>1</mn></msub><msub><mi>T</mi><mn>2</mn></msub></mfrac><mo>=</mo><msup><mfenced separators=\"|\"><mfrac><mi>r</mi><mrow><mi>r</mi><mo>/</mo><mn>2</mn></mrow></mfrac></mfenced><mrow><mn>3</mn><mo>/</mo><mn>2</mn></mrow></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>365</mn><mi>&nbsp;</mi><mtext>days</mtext></mrow><mi>T</mi></mfrac><mo>=</mo><mn>2</mn><msqrt><mn>2</mn></msqrt><mo>;</mo><mi>&nbsp;</mi><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mi>T</mi><mo>=</mo><mfrac><mn>365</mn><mrow><mn>2</mn><msqrt><mn>2</mn></msqrt></mrow></mfrac><mi>&nbsp;</mi><mtext>days</mtext><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>⇒</mo><mn>129</mn><mi>&nbsp;</mi><mtext>days</mtext></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634c744fde556bdb72", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "77", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A small planet is revolving around a very massive star in a circular orbit of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi></math> with a period of revolution <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi></math>. If the gravitational force between the planet and the star is proportional to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">r</mi><mrow><mo>-</mo><mn>5</mn><mo>/</mo><mn>2</mn></mrow></msup></math>, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi></math> will be proportional to", "image": null}, "options": [{"id": "E2xl8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">r</mi><mrow><mn>3</mn><mo>/</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "tlHQv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">r</mi><mrow><mn>5</mn><mo>/</mo><mn>3</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "6ltwX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">r</mi><mrow><mn>7</mn><mo>/</mo><mn>4</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "4Xlpb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">r</mi><mn>3</mn></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Gravitational force provides the necessary centripetal force required by the given planet for circular motion. So<br /><br /><math> <mrow> <mfrac> <mrow> <msup> <mtext>mv</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mtext>r</mtext> </mrow> </mfrac> <mo>&#8733;</mo> <msup> <mtext>r</mtext> <mrow> <mo>-</mo> <mn>5</mn> <mo>/</mo> <mn>2</mn> </mrow> </msup> </mrow> </math><br /><br /><math> <mrow> <mo>&#8658;&#160;&#160;</mo> <mfrac> <mrow> <msup> <mtext>mv</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mtext>r</mtext> </mrow> </mfrac> <mo>=</mo> <msup> <mtext>kr</mtext> <mrow> <mo>-</mo> <mn>5</mn> <mo>/</mo> <mn>2</mn> </mrow> </msup> </mrow> </math>,&nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">k</mi></math> = constant<br /><br /><math> <mrow> <mo>&#8756;&#160;&#160;</mo> <mtext>v</mtext> <mo>=</mo> <msqrt> <mfrac> <mrow> <msup> <mtext>kr</mtext> <mrow> <mo>-</mo> <mn>3</mn> <mo>/</mo> <mn>2</mn> </mrow> </msup> </mrow> <mrow> <mtext>m</mtext> </mrow> </mfrac> </msqrt> </mrow> </math><br /><br /><math> <mrow> <mtext>T</mtext> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> <mi>&#960;</mi> <mtext>r</mtext> </mrow> <mrow> <mtext>v</mtext> </mrow> </mfrac> <mo>=</mo> <mn>2</mn> <mi>&#960;</mi> <mtext>r</mtext> <mo>&#215;</mo> <mfrac> <mrow> <msqrt> <mtext>m</mtext> </msqrt> </mrow> <mrow> <msqrt> <mtext>k</mtext> <msup> <mtext>r</mtext> <mrow> <mo>-</mo> <mn>3</mn> <mo>/</mo> <mn>2</mn> </mrow> </msup> </msqrt> </mrow> </mfrac> </mrow> </math><br /><br />i.e.,&nbsp; <math> <mrow> <mtext>T</mtext> <mo>&#8733;</mo> <msup> <mtext>r</mtext> <mrow> <mn>7</mn> <mo>/</mo> <mn>4</mn> </mrow> </msup> </mrow> </math>.&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634c507466a8e9a279", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "52", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The total mechanical energy of a planet of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> moving around the Sun along an ellipse depends only on its semi-major axis <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math>. This energy as a function of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math> is given by", "image": null}, "options": [{"id": "VLHiV", "text": "<math> <mrow> <mo>-</mo> <mfrac> <mrow> <mi>G</mi> <msub> <mrow> <mi>M</mi><mo>⁡</mo> </mrow> <mrow> <mi></mi><mi>s</mi><mo>⁡</mo> </mrow> </msub> <mi>m</mi><mo>⁡</mo> </mrow> <mrow> <mn>2</mn> <mi>a</mi> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "t64y7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>G</mi><mi>M</mi><msub><mo>&#8289;</mo><mrow><mi>s</mi><mo>&#8289;</mo></mrow></msub><mi>m</mi><mo>&#8289;</mo></mrow><mrow><mn>2</mn><mi>a</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "dne6i", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>G</mi><mi>M</mi><msub><mo>&#8289;</mo><mrow><mi>s</mi><mo>&#8289;</mo></mrow></msub><mi>m</mi><mo>&#8289;</mo></mrow><mrow><mn>3</mn><mi>a</mi></mrow></mfrac></mat /mn></msub><mo>)</mo><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mo>&#8211;</mo><mo>&#160;</mo><mi>G</mi><msub><mi>M</mi><mi>s</mi></msub><mi>m</mi></math><br /><br />or&nbsp;<math><mrow><mi>E</mi><mo>&#8289;</mo> <mo>&#215;</mo> <mn>2</mn> <mi>a</mi> <mo>=</mo> <mo>-</mo> <mi>G</mi> <msub> <mrow> <mi>M</mi><mo>&#8289;</mo> </mrow> <mrow> <mi></mi><mi>s</mi><mo>&#8289;</mo> </mrow> </msub> <mi>m</mi><mo>&#8289;</mo> </mrow> </math><br /><br />&there4;&nbsp;<math>&#160;<mrow><mi>E</mi><mo>&#8289;</mo> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <mi>G</mi> <msub> <mrow> <mi>M</mi><mo>&#8289;</mo> </mrow> <mrow> <mi>s</mi><mo>&#8289;</mo> </mrow> </msub> <mi>m</mi><mo>&#8289;</mo> </mrow> <mrow> <mn>2</mn> <mi>a</mi> </mrow> </mfrac> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634a4a29ce869c5daa", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "10", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A planet revolves about the sun in elliptical orbit of semi-major axis <math> <mrow> <mn>2</mn><mo>×</mo><msup> <mrow> <mn>10</mn></mrow> <mrow> <mn>12</mn></mrow> </msup> <mtext>m</mtext><mo>.</mo></mrow> </math> The areal velocity of the planet when it is nearest to the sun is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>.4</mo><mo>×</mo><msup><mn>10</mn><mn>16</mn></msup><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup><mo>/</mo><mi mathvariant=\"normal\">s</mi></math>.The least distance between planet and the sun is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.8</mo><mo>×</mo><msup><mn>10</mn><mn>12</mn></msup><mo>&nbsp;</mo><mi mathvari ;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>K&#160;= 4</mtext></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86340c9da83e0234d85", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "37", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An artificial satellite is moving in a circular orbit around the earth, with a speed equal to half the magnitude of escape velocity from the Earth. The height of satellite above the surface of earth is (where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;is the radius of the Earth)", "image": null}, "options": [{"id": "htK1Y", "text": "<math><mi>R</mi></math>", "image": null, "isCorrect": true}, {"id": "cHCPz", "text": "<math><mn>2</mn><mi>R</mi></math>", "image": null, "isCorrect": false}, {"id": "qdCRi", "text": "<math><mn>3</mn><mi>R</mi></math>", "image": null, "isCorrect": false}, {"id": "DW40x", "text": "<math><mn>4</mn><mi >R</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><msqrt><mfrac><mrow><mn>2</mn><mi>G</mi><mi>M</mi></mrow><mrow><mi>R</mi></mrow></mfrac></msqrt><mo>=</mo><msqrt><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mrow><mi>R</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>+</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi>h</mi></mrow></mfrac></msqrt></math><br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mo>×</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><mn>2</mn><mi>G</mi><mi>M</mi></mrow><mrow><mi>R</mi></mrow></mfrac><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mrow><mi>R</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>+</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi>h</mi></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>R</mi><mi>&nbsp;</mi><mo>=</mo><mi>&nbsp;</mi><mi>R</mi><mi>&nbsp;</mi><mo>+</mo><mi>&nbsp;</mi><mi>h</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><mi>&nbsp;</mi><mo>=</mo><mi>&nbsp;</mi><mi>R</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633dc5b5be325e8ad5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "41", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A planet revolves about the sun in an elliptical orbit of semi-major axis <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>×</mo><msup><mn>10</mn><mn>12</mn></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>. The areal velocity of the planet when it is nearest to the sun is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>.4</mo><mo>×</mo><msup><mn>10</mn><mn>16</mn></msup><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. If the least distance between the planet and the sun is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.8</mo><mo>×</mo><msup><mn>10</mn><mn>12</mn></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>, then the minimum speed of the planet is", "image": null}, "options": [{"id": "aAJFb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>min</mi></msub><mo>=</mo><mn>40</mn><mo>&#xA0;</mo><mi>km</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "Jxk0d", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>min</mi></msub><mo>=</mo><mn>30</mn><mo>&#xA0;</mo><mi>km</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "boDoN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>min</mi></msub><mo>=</mo><mn>10</mn><mo>&#xA0;</mo><mi>km</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "UqJfq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>min</mi></msub><mo>=</mo><mn>20</mn><mo>&#xA0;</mo><mi>km</mi><mo>&#xA0;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The areal velocity of a planet around the sun is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>A</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mi>L</mi><mrow><mn>2</mn><mi>m</mi></mrow></mfrac></math>, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math>&nbsp;is the angular momentum of the planet around the sun and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>&nbsp;is its mass.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>.</mo><mn>4</mn><mo>&#215;</mo><msup><mn>10</mn><mn>16</mn></msup><mo>=</mo><mfrac><mrow><mi>m</mi><msub><mi>v</mi><mi>min</mi></msub><msub><mi>r</mi><mi>max</mi></msub></mrow><mrow><mn>2</mn><mi>m</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#215;</mo><mn>4</mn><mo>.</mo><mn>4</mn><mo>&#215;</mo><msup><mn>10</mn><mn>16</mn></msup><mo>=</mo><msub><mi>v</mi><mi>min</mi></msub><mfenced><mrow><mn>4</mn><mo>&#215;</mo><msup><mn>10</mn><mn>12</mn></msup><mo>-</mo><mn>1</mn><mo>.</mo><mn>8</mn><mo>&#215;</mo><msup><mn>10</mn><mn>12</mn></msup></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>min</mi></msub><mo>=</mo><mn>40</mn><mo>&#160;</mo><mi>km</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633a36abc4ca5f7025", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "12", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A small planet is revolving around a very massive star in a circular orbit of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi></math> with a period of revolution <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi></math>. If the gravitational force between the planet and the star is proportional to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">r</mi><mrow><mn>5</mn><mo>/</mo><mn>2</mn></mrow></msup></math>, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi></math> will be proportional to", "image": null}, "options": [{"id": "x3Vo9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">r</mi><mrow><mn>3</mn><mo>/</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "YWA5y", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">r</mi><mrow><mn>5</mn><mo>/</mo><mn>3</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "EAWIZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">r</mi><mrow><mn>7</mn><mo>/</mo><mn>4</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "Qlh89", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">r</mi><mn>3</mn></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the question, the gravitational force between the planet and the star is \\(\\mathrm{F} \\propto \\frac{1}{\\mathrm{R}^{5 / 2}}\\)\n\\(\\therefore \\mathrm{F}=\\frac{\\mathrm{GMm}}{\\mathrm{R}^{5 / 2}}\\)\nWhere M and M be masses of star and planet respectively.\nFor motion of planet in circular orbit,\n\\(\\mathrm{mR} \\omega^{2}=\\frac{\\mathrm{GMm}}{\\mathrm{R}^{5 / 2}}\\)\n\\(\\mathrm{mR}\\left(\\frac{2 \\pi}{\\mathrm{T}}\\right)^{2}=\\frac{\\mathrm{GMm}}{\\mathrm{R}^{5 / 2}}\\) \\(\\left(\\therefore \\omega=\\frac{2 \\pi}{\\mathrm{T}}\\right)\\)\n\\(\\frac{4 \\pi^{2}}{\\mathrm{~T}^{2}}=\\frac{\\mathrm{GM}}{\\mathrm{R}^{7 / 2}} \\Rightarrow \\mathrm{T}^{2}=\\frac{4 \\pi^{2}}{\\mathrm{GM}} \\mathrm{R}^{7 / 2}\\)\n\\(\\mathrm{T}^{2} \\propto \\mathrm{R}^{7 / 2}\\) or \\(\\mathrm{T}^{2} \\propto \\mathrm{R}^{7 / 4}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863332e09d474cf4910", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "14", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A satellite is revolving in a circular orbit at a height <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math> from the earth's surface, such that <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><mo>≪</mo><mi>R</mi></math> where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;is the radius of the earth. Assuming that the effect of the earth's atmosphere can be neglected. What should be the minimum change required in the speed so that the satellite could escape from the gravitational field of earth?", "image": null}, "options": [{"id": "1omzx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msqrt><mn>2</mn></msqrt><mo>-</mo><mn>1</mn></mrow></mfenced><msqrt><mi>g</mi><mi>R</mi></msqrt></math>", "image": null, "isCorrect": true}, {"id": "W37qH", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>9</mn><msqrt><mi>g</mi><mi>R</mi></msqrt></mrow><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "zSGfY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>2</mn><mi>g</mi><mi>R</mi></msqrt></math>", "image": null, "isCorrect": false}, {"id": "E1MhF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mi>g</mi><mi>R</mi></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Orbital velocity&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>0</mn></msub><mo>=</mo><msqrt><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mrow><mo>(</mo><mi>R</mi><mo>+</mo><mi>h</mi><mo>)</mo></mrow></mfrac></msqrt></math></p><p>Velocity required to escape the gravitational field,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>s</mi></msub><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mi>G</mi><mi>M</mi></mrow><mrow><mo>(</mo><mi>R</mi><mo>+</mo><mi>h</mi><mo>)</mo></mrow></mfrac></msqrt></math></p><p>Change in velocity&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mi>GM</mi></mrow><mrow><mo>(</mo><mi mathvariant=\"normal\">R</mi><mo>+</mo><mi mathvariant=\"normal\">h</mi><mo>)</mo></mrow></mfrac></msqrt><mo>-</mo><msqrt><mfrac><mi>GM</mi><mrow><mo>(</mo><mi mathvariant=\"normal\">R</mi><mo>+</mo><mi mathvariant=\"normal\">h</mi><mo>)</mo></mrow></mfrac></msqrt></math></p><p>If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><mo>&#60;</mo><mo>&#60;</mo><mi>R</mi></math>,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>v</mi><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mi>G</mi><mi>M</mi></mrow><mi>R</mi></mfrac></msqrt><mo>-</mo><msqrt><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mi>R</mi></mfrac></msqrt></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>v</mi><mo>=</mo><msqrt><mn>2</mn><mi>g</mi><mi>R</mi></msqrt><mo>-</mo><msqrt><mi>g</mi><mi>R</mi></msqrt></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632f10b9f8762bf6ab", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "04", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Three particles each of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>=</mo><mn>1</mn><mo>&nbsp;</mo><mi>kg</mi></math>, are located at the vertices of an equilateral triangle of side <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>.&nbsp;The speed at which they must move to revolve in a circular orbit,&nbsp;under the influence of mutual gravitational force, circumscribing and preserving the equilateral triangle is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mi>n</mi><msqrt><mi mathvariant=\"normal\">G</mi></msqrt></math>, then the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>&nbsp;is", "image": null}, "options": [], "correctValue": "0.50", "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/ef_wntml/dfghdjhjhjjhsbns.png\"><br><p>The net gravitational force on any particle due to the other two is<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mi mathvariant=\"normal\">g</mi></msub><mo>=</mo><mfrac><mrow><mn>2</mn><mi>G</mi><msup><mi>m</mi><mn>2</mn></msup></mrow><msup><mi>a</mi><mn>2</mn></msup></mfrac><mi>cos</mi><mfenced><mrow><mn>30</mn><mo>°</mo></mrow></mfenced><mo>=</mo><mfrac><mrow><msqrt><mn>3</mn></msqrt><mi>G</mi><msup><mi>m</mi><mn>2</mn></msup></mrow><msup><mi>a</mi><mn>2</mn></msup></mfrac></math><br />Now,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo mathvariant=\"italic\">=</mo><mfrac><mi mathvariant=\"italic\">a</mi><msqrt><mn mathvariant=\"italic\">3</mn></msqrt></mfrac></math></p><p>For circular motion,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mi mathvariant=\"normal\">g</mi></msub><mo>=</mo><mfrac><mrow><msqrt><mn>3</mn></msqrt><mi>G</mi><msup><mi>m</mi><mn>2</mn></msup></mrow><msup><mi>a</mi><mn>2</mn></msup></mfrac><mo>=</mo><mfrac><mrow><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup></mrow><mi>r</mi></mfrac></math></p><p>Solving it we obtain,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mn>0.50</mn><msqrt><mi>G</mi></msqrt></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630f4450aff34751d6", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "69", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two identical satellites are moving around the earth in circular orbits at heights <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>R</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> respectively where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> is the radius of the Earth. The ratio of their kinetic energies is&nbsp;", "image": null}, "options": [{"id": "t4J14", "text": "<math><mn>2</mn><mi mathvariant=\"normal\"> </mi><mo>:</mo><mi mathvariant=\"normal\"> </mi><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "WjPQw", "text": "<math><mn>1</mn><mi>&nbsp;</mi><mo>:</mo><mi>&nbsp;</mi><mn>2</mn></math>", "image": null, "isCorrect": true}, {"id": "7c9HE", "text": "<math><mn>3</mn><mi> </mi><mo>:</mo><mi> </mi><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "zKcbh", "text": "<math><mn>2</mn><mi> </mi><mo>:</mo><mi> </mi><mn>3</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The kinetic energy of satellites in a circular orbit is given as<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mi mathvariant=\"normal\">k</mi></msub><mo>=</mo><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><mrow><mn>2</mn><mi>r</mi></mrow></mfrac><mo>&#8658;</mo><mi mathvariant=\"normal\">&#160;</mi><mfrac><msub><mi>E</mi><msub><mi mathvariant=\"normal\">k</mi><mn>1</mn></msub></msub><msub><mi>E</mi><msub><mi mathvariant=\"normal\">k</mi><mn>2</mn></msub></msub></mfrac><mo>=</mo><mfrac><msub><mi>r</mi><mn>2</mn></msub><msub><mi>r</mi><mn>1</mn></msub></mfrac><mo>=</mo><mfrac><mrow><mi>R</mi><mo>+</mo><mi>R</mi></mrow><mrow><mi>R</mi><mo>+</mo><mn>3</mn><mi>R</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>R</mi></mrow><mrow><mn>4</mn><mi>R</mi></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630781c95d656ee3d4", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "56", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A satellite is launched into a circular orbit of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> around the earth. A second satellite is launched into an orbit of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mn>1.01</mn></mfenced><mi>R</mi></math> . The period of the second satellite is larger than that of the first one by approximately", "image": null}, "options": [], "correctValue": "1.5", "solution": {"text": "<p>In the problem orbital radius is increased by <math><mn>1</mn><mi mathvariant=\"normal\">%</mi></math><br />Time period of satellite <math><mi mathvariant=\"normal\">T</mi><mo>&#8733;</mo><msup><mrow><mi mathvariant=\"normal\">r</mi></mrow><mrow><mn>3</mn><mo>/</mo><mn>2</mn></mrow></msup></math></p><p>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><mo>&#8710;</mo><mi>T</mi></mrow><mi>T</mi></mfrac><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mo>&#215;</mo><mfrac><mrow><mo>&#8710;</mo><mi>r</mi></mrow><mi>r</mi></mfrac></math><br />Percentage change in the time period<br /><math><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math> [ <math><mi mathvariant=\"normal\">%</mi></math> change in orbital radius]<br /><math><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mfenced separators=\"|\"><mrow><mn>1</mn><mi mathvariant=\"normal\">%</mi></mrow></mfenced><mo>=</mo><mn>1.5</mn><mi mathvariant=\"normal\">%</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86302e90af8a81ca67c", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "81", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If a satellite is revolving around a planet of mass <math><mi>M</mi></math> in an elliptical orbit of semi-major axis <math><mi>a</mi></math>, find the orbital speed of the satellite when it is at a distance <math><mi>r</mi></math> from the focus", "image": null}, "options": [{"id": "0J2fD", "text": "<math><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mi>G</mi><mi>M</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>2</mn></mrow><mrow><mi>r</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>a</mi></mrow></mfrac></mrow></mfenced></math>", "image": null, "isCorrect": true}, {"id": "1bEnt", "text": "<math><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mi>G</mi><mi>M</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>2</mn></mrow><mrow><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>a</mi></mrow></mfrac></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "1YHVC", "text": "<math><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mi>G</mi><mi>M</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>2</mn></mrow><mrow><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "Ugn3h", "text": "<math><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mi>G</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>2</mn></mrow><mrow><mi>r</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>a</mi></mrow></mfrac></mrow></mfenced></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As in case of elliptic orbit of a satellite mechanical energy<br /><br />remains constant, at any position of satellite in the orbit,<br /><br /><math><mi mathvariant=\"normal\">K</mi><mi mathvariant=\"normal\">E</mi><mi mathvariant=\"normal\">&#160;</mi><mo>+</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">E</mi><mi mathvariant=\"normal\">&#160;</mi><mo>=</mo><mo>-</mo><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><mrow><mn>2</mn><mi>a</mi></mrow></mfrac></math> ...(i)<br /><br />Now, if at position <math><mi>r</mi><mo>,</mo><mi>v</mi></math> is the orbital speed of satellite<br /><br /><math><mi mathvariant=\"normal\">K</mi><mi mathvariant=\"normal\">E</mi><mi mathvariant=\"normal\">&#160;</mi><mo>=</mo><mi>&#160;</mi><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>&#160;</mi><mi>m</mi><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>&#160;</mi></math> and <math><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">E</mi><mi mathvariant=\"normal\">&#160;</mi><mo>=</mo><mi mathvariant=\"normal\">&#160;</mi><mo>-</mo><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><mrow><mi>r</mi></mrow></mfrac></math> ...(ii)<br /><br />So, from Eqs. (i) and (ii), we have<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>&#160;</mi><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup><mo>-</mo><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><mi>r</mi></mfrac><mo>=</mo><mo>-</mo><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><mrow><mn>2</mn><mi>a</mi></mrow></mfrac><mo>,</mo><mi>&#160;</mi><mspace linebreak=\"newline\"/><mi mathvariant=\"normal\">i</mi><mo>.</mo><mi mathvariant=\"normal\">e</mi><mo>.</mo><mo>,</mo><mi>&#160;</mi><msup><mi>v</mi><mn>2</mn></msup><mo>=</mo><mi>G</mi><mi>M</mi><mfenced open=\"[\" close=\"]\" separators=\"|\"><mrow><mfrac><mn>2</mn><mi>r</mi></mfrac><mo>-</mo><mfrac><mn>1</mn><mi>a</mi></mfrac><mi>&#160;</mi></mrow></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "6aa3ab79aa8dc1ff6817805c", "title": "Kepler Laws", "totalQuestions": 23, "questions": [{"_id": "6151e863f756ff464c0415a6", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "13", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A planet moves around the sun (mass =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>M</mi><mi mathvariant=\"normal\">s</mi></msub></math>) in an elliptical orbit such that its minimum and maximum distance from the sun are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> respectively. The period of revolution of this planet around the sun is", "image": null}, "options": [{"id": "5HVHw", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mi mathvariant=\"normal\">&#x3C0;</mi><msqrt><mfrac><msup><mfenced><mrow><mi>r</mi><mo>+</mo><mi>R</mi></mrow></mfenced><mn>3</mn></msup><mrow><mn>2</mn><mi>G</mi><msub><mi>M</mi><mi mathvariant=\"normal\">s</mi></msub></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "guvEa", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mi mathvariant=\"normal\">&#x3C0;</mi><msqrt><mfrac><msup><mfenced><mrow><mi>r</mi><mo>+</mo><mi>R</mi></mrow></mfenced><mn>3</mn></msup><mrow><mn>3</mn><mi>G</mi><msub><mi>M</mi><mi mathvariant=\"normal\">s</mi></msub></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "agCR6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mi mathvariant=\"normal\">&#x3C0;</mi><msqrt><mfrac><msup><mfenced><mrow><mi>r</mi><mo>+</mo><mi>R</mi></mrow></mfenced><mn>3</mn></msup><mrow><mi>G</mi><msub><mi>M</mi><mi mathvariant=\"normal\">s</mi></msub></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "PwpTZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mi mathvariant=\"normal\">&#x3C0;</mi><msqrt><mfrac><mrow><mn>2</mn><msup><mfenced><mrow><mi>r</mi><mo>+</mo><mi>R</mi></mrow></mfenced><mn>3</mn></msup></mrow><mrow><mi>G</mi><msub><mi>M</mi><mi mathvariant=\"normal\">s</mi></msub></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The length of the semi-major axis of the elliptical orbit of the planet is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mfrac><mrow><mi>r</mi><mo>+</mo><mi>R</mi></mrow><mn>2</mn></mfrac></math></p><p>If we assume that there is a hypothetical planet which moves around the sun in a circular orbit of radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>r</mi><mn>0</mn></msub><mo>=</mo><mfrac><mrow><mi>r</mi><mo>+</mo><mi>R</mi></mrow><mn>2</mn></mfrac></math>, then the time period of this hypothetical planet and our given planet will be same. The time period of a planet around the sun in&nbsp;circular orbit is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi><msqrt><mfrac><msub><msup><mi>r</mi><mn>3</mn></msup><mn>0</mn></msub><mrow><mi>G</mi><msub><mi>M</mi><mi mathvariant=\"normal\">s</mi></msub></mrow></mfrac></msqrt><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi><msqrt><mfrac><msup><mfenced><mfrac><mrow><mi>r</mi><mo>+</mo><mi>R</mi></mrow><mn>2</mn></mfrac></mfenced><mn>3</mn></msup><mrow><mi>G</mi><msub><mi>M</mi><mi mathvariant=\"normal\">s</mi></msub></mrow></mfrac></msqrt></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mi mathvariant=\"normal\">&#960;</mi><msqrt><mfrac><msup><mfenced><mrow><mi>r</mi><mo>+</mo><mi>R</mi></mrow></mfenced><mn>3</mn></msup><mrow><mn>2</mn><mi>G</mi><msub><mi>M</mi><mi mathvariant=\"normal\">s</mi></msub></mrow></mfrac></msqrt></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863f45f00256b587f8c", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "35", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The period of revolution of planet <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> around the sun is eight times that of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>. How many times is the distance of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> from the sun, greater than that of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>?", "image": null}, "options": [{"id": "Fl9qZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "erPUX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>", "image": null, "isCorrect": true}, {"id": "psByM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>", "image": null, "isCorrect": false}, {"id": "xO5fK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">T</mi><mn>2</mn></msup><mo>&#8733;</mo><msup><mi mathvariant=\"normal\">r</mi><mn>3</mn></msup></math>,<br /><br />so, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msubsup><mi mathvariant=\"normal\">T</mi><mi mathvariant=\"normal\">A</mi><mn>2</mn></msubsup><msubsup><mi mathvariant=\"normal\">T</mi><mi mathvariant=\"normal\">B</mi><mn>2</mn></msubsup></mfrac><mo>=</mo><mfrac><msubsup><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">A</mi><mn>3</mn></msubsup><msubsup><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">B</mi><mn>3</mn></msubsup></mfrac></math><br /><br />or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">A</mi></msub><mo>=</mo><mn>4</mn><msub><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">B</mi></msub></math><br /><br />so,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">A</mi></msub><mo>-</mo><msub><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">B</mi></msub><mo>=</mo><mn>4</mn><msub><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">B</mi></msub><mo>-</mo><msub><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">B</mi></msub><mo>=</mo><mn>3</mn><msub><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">B</mi></msub></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e44925732020855b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "82", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two satellites <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&nbsp;are revolving around a planet in coplanar and concentric circular orbits of radii <math><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub></math> respectively in the same sense. Their respective periods of revolution are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi>hour</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>&nbsp;</mo><mi>hours</mi></math> respectively. The radius of the orbit of A is equal to <math><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mn>4</mn></mrow></msup></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>km</mi></math>. What is their relative speed when they are closest?\r", "image": null}, "options": [{"id": "93ZVO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#960;</mi><mo>&#215;</mo><mn>1</mn><msup><mn>0</mn><mn>4</mn></msup><mo>&#160;</mo><mi>km</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">h</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "MmSVY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>&#960;</mi><mn>2</mn></mfrac><mo>&#215;</mo><mn>1</mn><msup><mn>0</mn><mn>4</mn></msup><mo>&#160;</mo><mi>km</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">h</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "jtoQO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><mi>&#960;</mi></mrow><mn>2</mn></mfrac><mo>&#215;</mo><mn>1</mn><msup><mn>0</mn><mn>4</mn></msup><mo>&#160;</mo><mi>km</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">h</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "gHIPs", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>&#960;</mi><mo>&#215;</mo><mn>1</mn><msup><mn>0</mn><mn>4</mn></msup><mo>&#160;</mo><mi>km</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">h</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "By Kepler&#39;s third law <math><msup><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>&#8733;</mo><msup><mrow><mi>R</mi></mrow><mrow><mn>3</mn></mrow></msup></math> or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>T</mi><mn>2</mn></msup><msup><mi>R</mi><mn>3</mn></msup></mfrac><mo>=</mo><mi>constant</mi></math><br /><br /><math><mo>&#8756;</mo></math> <math><mfrac><mrow><msubsup><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><msubsup><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow></mfrac><mo>=</mo><mfrac><mrow><msubsup><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></msubsup></mrow><mrow><msubsup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow>
