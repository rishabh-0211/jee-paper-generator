rg/1998/Math/MathML\"><mi>R</mi></math> applies a gravitational force of attraction equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mn>1</mn></msub></math>&nbsp;on a particle placed at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math>, distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi>R</mi></math> from the centre O of the sphere. A spherical cavity of the radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac bevelled=\"true\"><mi>R</mi><mn>2</mn></mfrac></math> is now made in the sphere as shown in the figure.<br />\rThe sphere with the cavity now applies a gravitational force <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mn>2</mn></msub></math>&nbsp;on the same particle placed at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math>.<br />\rThe ratio <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac bevelled=\"true\"><msub><mi>F</mi><mn>2</mn></msub><msub><mi>F</mi><mn>1</mn></msub></mfrac></math>&nbsp;will be<br />\r<br />\r&nbsp;&nbsp;<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0016177_Question_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 200px; height: 125px;\" />", "image": null}, "options": [{"id": "yyuhV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "RvvmB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>7</mn><mn>9</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "DSkPA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>", "image": null, "isCorrect": false}, {"id": "y2M5w", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Gravitational force due to solid sphere, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">F</mtext><mn>1</mn></msub><mo>=</mo><mfrac><mtext mathvariant=\"italic\">GMm</mtext><msup><mfenced><mrow><mn>2</mn><mtext mathvariant=\"italic\">R</mtext></mrow></mfenced><mn>2</mn></msup></mfrac></math>&nbsp; where M and m are mass of the solid sphere and particle respectively and R is the radius of the sphere.<br /><br />The gravitational force on the particle due to sphere with cavity = force due to a solid sphere - force due to sphere creating a cavity, assumed to be present above at that position.<br /><br />i.e.,&nbsp;&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">F</mtext><mn>2</mn></msub><mo>=</mo><mfrac><mtext mathvariant=\"italic\">GMm</mtext><mrow><mn>4</mn><msup><mtext mathvariant=\"italic\">R</mtext><mn>2</mn></msup></mrow></mfrac><mo>-</mo><mfrac><mrow><mtext mathvariant=\"italic\">G</mtext><mfenced><mrow><mtext mathvariant=\"italic\">M</mtext><mo>/</mo><mn>8</mn></mrow></mfenced><mtext mathvariant=\"italic\">m</mtext></mrow><msup><mfenced><mrow><mn>3</mn><mtext mathvariant=\"italic\">R</mtext><mo>/</mo><mn>2</mn></mrow></mfenced><mn>2</mn></msup></mfrac><mo>=</mo><mfrac><mn>7</mn><mrow><mn>3</mn><mn>6</mn></mrow></mfrac><mfrac><mtext mathvariant=\"italic\">GMm</mtext><msup><mtext mathvariant=\"italic\">R</mtext><mn>2</mn></msup></mfrac></math><br /><br />So&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mtext mathvariant=\"italic\">F</mtext><mn>2</mn></msub><msub><mtext mathvariant=\"italic\">F</mtext><mn>1</mn></msub></mfrac><mo>=</mo><mfrac><mfrac><mrow><mn>7</mn><mtext mathvariant=\"italic\">GMm</mtext></mrow><mrow><mn>3</mn><mn>6</mn><msup><mtext mathvariant=\"italic\">R</mtext><mn>2</mn></msup></mrow></mfrac><mfenced><mfrac><mtext mathvariant=\"italic\">GMm</mtext><mrow><mn>4</mn><msup><mtext mathvariant=\"italic\">R</mtext><mn>2</mn></msup></mrow></mfrac></mfenced></mfrac><mo>=</mo><mfrac><mn>7</mn><mn>9</mn></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863bba1825372c942e1", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "105", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>Gravitational acceleration on the surface of a planet is <math><mfrac><mrow><msqrt><mn>6</mn></msqrt></mrow><mrow><mn>11</mn></mrow></mfrac><mi>g</mi></math> , where g is the gravitational acceleration on the surface of the earth. The average mass density of the planet is <math><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math> times that of the earth. If the escape speed on the surface of the earth is taken to be 11 km/s, the escape speed on the surface of the planet in km/s will be</p>\r", "image": null}, "options": [{"id": "r3Apo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#160;</mo><mi>km</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "S6OYy", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#160;</mo><mi>km</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "bQpOl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&nbsp;</mo><mi>km</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "FtVuY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi>km</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi>g</mi><mo>=</mo><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mrow><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>G</mi></mrow><mrow><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi>&#960;</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>3</mn></mrow></msup><mi>&#961;</mi><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi>&#960;</mi><mi>G</mi><mi>R</mi><mi>&#961;</mi></math> i.e. <math><mi>g</mi><mo>&#8733;</mo><mi>R</mi><mi>&#961;</mi></math><br /><br /><math><mfrac><mrow><msub><mrow><mi>g</mi></mrow><mrow><mi>P</mi></mrow></msub></mrow><mrow><msub><mrow><mi>g</mi></mrow><mrow><mi>E</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msqrt><mn>6</mn></msqrt><msub><mrow><mi>g</mi></mrow><mrow><mi>E</mi></mrow></msub></mrow><mrow><mn>11</mn><msub><mrow><mi>g</mi></mrow><mrow><mi>E</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msqrt><mn>6</mn></msqrt></mrow><mrow><mn>11</mn></mrow></mfrac></math> and <math><mfrac><mrow><msub><mrow><mi>&#961;</mi></mrow><mrow><mi>E</mi></mrow></msub></mrow><mrow><msub><mrow><mi>&#961;</mi></mrow><mrow><mi>P</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math> and <math><mfrac><mrow><msub><mrow><mi>g</mi></mrow><mrow><mi>P</mi></mrow></msub></mrow><mrow><msub><mrow><mi>g</mi></mrow><mrow><mi>E</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi>R</mi></mrow><mrow><mi>P</mi></mrow></msub><msub><mrow><mi>&#961;</mi></mrow><mrow><mi>P</mi></mrow></msub></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mi>E</mi></mrow></msub><msub><mrow><mi>&#961;</mi></mrow><mrow><mi>E</mi></mrow></msub></mrow></mfrac></math><br /><br /><math><mo>&#8756;</mo><mfrac><mrow><msub><mrow><mi>R</mi></mrow><mrow><mi>P</mi></mrow></msub></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mi>E</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi>g</mi></mrow><mrow><mi>P</mi></mrow></msub><msub><mrow><mi>&#961;</mi></mrow><mrow><mi>E</mi></mrow></msub></mrow><mrow><msub><mrow><mi>g</mi></mrow><mrow><mi>E</mi></mrow></msub><msub><mrow><mi>&#961;</mi></mrow><mrow><mi>P</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msqrt><mn>6</mn></msqrt></mrow><mrow><mn>11</mn></mrow></mfrac><mo>&#215;</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><br /><math><mo>&#8756;</mo></math> Escape velocity <math><mi>v</mi><mo>=</mo><msqrt><mn>2</mn><mi>g</mi><mi>R</mi></msqrt></math><br /><br /><math><mo>&#8756;</mo><mfrac><mrow><msub><mrow><mi>v</mi></mrow><mrow><mi>P</mi></mrow></msub></mrow><mrow><msub><mrow><mi>v</mi></mrow><mrow><mi>E</mi></mrow></msub></mrow></mfrac><mo>=</mo><msqrt><mfrac><mrow><msub><mrow><mi>g</mi></mrow><mrow><mi>P</mi></mrow></msub></mrow><mrow><msub><mrow><mi>g</mi></mrow><mrow><mi>E</mi></mrow></msub></mrow></mfrac><mo>&#215;</mo><mfrac><mrow><msub><mrow><mi>R</mi></mrow><mrow><mi>P</mi></mrow></msub></mrow><mrow><msub><mrow><mi>R</mi></mrow><mrow><mi>E</mi></mrow></msub></mrow></mfrac></msqrt><mo>=</mo><msqrt><mfrac><mrow><msqrt><mn>6</mn></msqrt></mrow><mrow><mn>11</mn></mrow></mfrac><mo>&#215;</mo><mfrac><mrow><msqrt><mn>6</mn></msqrt></mrow><mrow><mn>11</mn></mrow></mfrac><mo>&#215;</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></msqrt></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>3</mn><mn>11</mn></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><msub><mi>v</mi><mi>P</mi></msub><mo>=</mo><mfrac><mn>3</mn><mn>11</mn></mfrac><mo>&#215;</mo><msub><mi>v</mi><mi>E</mi></msub><mo>=</mo><mfrac><mn>3</mn><mn>11</mn></mfrac><mo>&#215;</mo><mn>11</mn><mo>=</mo><mn>3</mn><mo>&#160;</mo><mi>km</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b27517261be6e64a", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "57", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A large sphere of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> is fixed at one position and two identical particles each of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>&nbsp;are kept on a line passing through the centre of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> (see figure). The point masses are connected by a rigid massless rod of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi></math> and this assembly is free to move along the line connecting them. All three masses interact only through their mutual gravitational interaction. When the point mass nearer to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> is at a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><mn>3</mn><mi>l</mi></math> from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math>, the tension in the rod is zero for <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>=</mo><mi>k</mi><mfenced separators=\"|\"><mfrac><mi>M</mi><mn>288</mn></mfrac></mfenced></math>. The value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi></math> is<br />\r<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image5-5173a529-60b6-4425-b1dc-89ce80a6f1c1.jpg\" style=\"height: 61px; width: 300px;\" />", "image": null}, "options": [], "correctValue": "7", "solution": {"text": "Due to gravitational interaction connected masses have some acceleration.<br /><br />Let both small masses are moving with acceleration 'a' towards larger mass M<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image6-db67c1cc-3cf9-4c0c-863a-38201940e80d.jpg\" style=\"height: 123px; width: 300px;\" /><br /><br />Force equation for mass nearer to a larger mass<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><msup><mfenced separators=\"|\"><mrow><mn>3</mn><mi>l</mi></mrow></mfenced><mn>2</mn></msup></mfrac><mo>-</mo><mfrac><mrow><mi>G</mi><msup><mi>m</mi><mn>2</mn></msup></mrow><msup><mi>l</mi><mn>2</mn></msup></mfrac><mo>=</mo><mi>m</mi><mi>a</mi></math> ...(i)<br /><br />Force equation for mass away from a larger mass<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><msup><mfenced separators=\"|\"><mrow><mn>4</mn><mi>l</mi></mrow></mfenced><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><mrow><mi>G</mi><msup><mi>m</mi><mn>2</mn></msup></mrow><msup><mi>l</mi><mn>2</mn></msup></mfrac><mo>=</mo><mi>m</mi><mi>a</mi></math> ...(ii)<br /><br />From equation (i) &amp; (ii)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mrow><mn>9</mn><msup><mi>l</mi><mn>2</mn></msup></mrow></mfrac><mo>-</mo><mfrac><mrow><mi>G</mi><mi>m</mi></mrow><msup><mi>l</mi><mn>2</mn></msup></mfrac><mo>=</mo><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mrow><mn>16</mn><msup><mi>l</mi><mn>2</mn></msup></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>G</mi><mi>m</mi></mrow><msup><mi>l</mi><mn>2</mn></msup></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mi>M</mi><mn>9</mn></mfrac><mo>-</mo><mfrac><mi>M</mi><mn>16</mn></mfrac><mo>=</mo><mi>m</mi><mo>+</mo><mi>m</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>7</mn><mi>M</mi></mrow><mn>144</mn></mfrac><mo>=</mo><mn>2</mn><mi>m</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>m</mi><mo>=</mo><mfrac><mrow><mn>7</mn><mi>M</mi></mrow><mn>288</mn></mfrac><mo>=</mo><mi>k</mi><mfenced separators=\"|\"><mfrac><mi>M</mi><mn>288</mn></mfrac></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>k</mi><mo>=</mo><mn>7</mn></math><p>&nbsp;</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ad6ea5e81aa5b2ee", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "65", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A solid sphere of uniform density and radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> applies a gravitational force of attraction equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mn>1</mn></msub></math>&nbsp;on a particle placed at a distance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>R</mi></math> from the centre of the sphere. A spherical cavity of the radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac bevelled=\"true\"><mi>R</mi><mn>2</mn></mfrac></math> is now made in the sphere as shown in the figure. The sphere with the cavity now applies a gravitational force <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mn>2</mn></msub></math>&nbsp;on the same particle. The ratio&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>F</mi><mn>2</mn></msub><msub><mi>F</mi><mn>1</mn></msub></mfrac></math>&nbsp;is<br />\r<br />\r<b><u><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0027300_Question.jpg\" style=\"width: 180px; height: 136px;\" /></u></b>", "image": null}, "options": [{"id": "Ggde6", "text": "<math><mrow>  <mfrac>    <mrow>      <mn>9</mn>    </mrow>    <mrow>      <mn>5</mn>      <mn>0</mn>    </mrow>  </mfrac></mrow></math>", "image": null, "isCorrect": false}, {"id": "CEsoh", "text": "<math> <mrow> <mfrac> <mrow> <mn>4</mn> <mn>1</mn> </mrow> <mrow> <mn>5</mn> <mn>0</mn> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "1OhVV", "text": "<math><mrow>  <mfrac>    <mrow>      <mn>3</mn>    </mrow>    <mrow>      <mn>2</mn>      <mn>5</mn>    </mrow>  </mfrac></mrow></math>", "image": null, "isCorrect": false}, {"id": "39ctR", "text": "<math><mrow>  <mfrac>    <mrow>      <mn>2</mn>      <mn>2</mn>    </mrow>    <mrow>      <mn>2</mn>      <mn>5</mn>    </mrow>  </mfrac></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From the superposition principle,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mn>1</mn></msub><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><msub><mi>F</mi><mi mathvariant=\"normal\">r</mi></msub><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><msub><mi>F</mi><mi mathvariant=\"normal\">c</mi></msub></math><br /><br />Here, F<sub>r</sub> = force due to remaining part = F<sub>2</sub><br /><br />and F<sub>c</sub> = force due to cavity<br /><br />Now,&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mtext>F</mtext> <mn>1</mn> </msub> <mo>=</mo> <mfrac> <mrow> <mtext>GMm</mtext> </mrow> <mrow> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>3</mn> <mtext>R</mtext> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>GMm</mtext> </mrow> <mrow> <mn>9</mn> <msup> <mtext>R</mtext> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <msub> <mtext>F</mtext> <mtext>c</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mtext>G</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>M</mtext> </mrow> <mrow> <mn>8</mn> </mrow> </mfrac> </mrow> </mfenced> <mtext>m</mtext> </mrow> <mrow> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> <mtext>R</mtext> </mrow> </mfrac> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>GMm</mtext> </mrow> <mrow> <mn>5</mn> <mn>0</mn> <msup> <mtext>R</mtext> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>&#8756;&#160;&#160;&#160;&#160;</mo> <msub> <mtext>F</mtext> <mn>2</mn> </msub> <mo>=</mo> <msub> <mtext>F</mtext> <mn>1</mn> </msub> <mo>-</mo> <msub> <mtext>F</mtext> <mtext>c</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mn>4</mn> <mn>1</mn> <mtext>GMm</mtext> </mrow> <mrow> <mn>4</mn> <mn>5</mn> <mn>0</mn> <msup> <mtext>R</mtext> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>&#8756;&#160;&#160;&#160;&#160;</mo> <mfrac> <mrow> <msub> <mtext>F</mtext> <mn>2</mn> </msub> </mrow> <mrow> <msub> <mtext>F</mtext> <mn>1</mn> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>4</mn> <mn>1</mn> </mrow> <mrow> <mn>5</mn> <mn>0</mn> </mrow> </mfrac> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639a67a4f52df54079", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "32", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">e</mi></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">p</mi></msub></math> denote the acceleration due to gravity on the surface of the earth and another planet whose mass and radius are twice that of the earth, then", "image": null}, "options": [{"id": "val3V", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">p</mi></msub><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">e</mi></msub><mn>2</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "ZfCAD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">p</mi></msub><mo>=</mo><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">e</mi></msub></math>", "image": null, "isCorrect": false}, {"id": "P1EOx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">p</mi></msub><mo>=</mo><mn>2</mn><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">e</mi></msub></math>", "image": null, "isCorrect": false}, {"id": "PyCXn", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">p</mi></msub><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">e</mi></msub><msqrt><mn>2</mn></msqrt></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Acceleration due to gravity is given by,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mi mathvariant=\"normal\">g</mi><mo>=</mo><mfrac><mi>GM</mi><msup><mi mathvariant=\"normal\">R</mi><mn>2</mn></msup></mfrac></math><br /><br />where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">G</mi></math> is gravitational constant.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">For</mi><mi mathvariant=\"bold\">&#160;</mi><mi mathvariant=\"bold\">earth</mi><mo>:</mo><mi mathvariant=\"normal\">&#160;</mi><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">e</mi></msub><mo>=</mo><mfrac><msub><mi>GM</mi><mi mathvariant=\"normal\">e</mi></msub><msubsup><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">e</mi><mn>2</mn></msubsup></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">For</mi><mi mathvariant=\"bold\">&#160;</mi><mi mathvariant=\"bold\">planet</mi><mo>:</mo><mi mathvariant=\"normal\">&#160;</mi><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">p</mi></msub><mo>=</mo><mfrac><msub><mi>GM</mi><mi mathvariant=\"normal\">p</mi></msub><msubsup><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">p</mi><mn>2</mn></msubsup></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>or</mi><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mi mathvariant=\"normal\">&#160;</mi><mfrac><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">e</mi></msub><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">p</mi></msub></mfrac><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">e</mi></msub><msub><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">p</mi></msub></mfrac><mi mathvariant=\"normal\">&#160;</mi><mo>&#215;</mo><mfrac><msubsup><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">p</mi><mn>2</mn></msubsup><msubsup><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">e</mi><mn>2</mn></msubsup></mfrac><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#8230;</mo><mfenced separators=\"|\"><mi mathvariant=\"normal\">i</mi></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Given</mi><mo>,</mo><mo>&#160;&#160;</mo><msub><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">p</mi></msub><mo>=</mo><mn>2</mn><msub><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">e</mi></msub><mo>,</mo><mo>&#160;&#160;</mo><msub><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">p</mi></msub><mo>=</mo><mn>2</mn><msub><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">e</mi></msub></math><br /><br />Putting the values in the Eq. (i), we obtain<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mi mathvariant=\"normal\">&#160;</mi><mfrac><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">e</mi></msub><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">p</mi></msub></mfrac><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">e</mi></msub><mrow><mn>2</mn><msub><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">e</mi></msub></mrow></mfrac><mo>&#215;</mo><mfrac><msup><mfenced separators=\"|\"><mrow><mn>2</mn><msub><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">e</mi></msub></mrow></mfenced><mn>2</mn></msup><msubsup><mi mathvariant=\"norma onaut (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi><mo>=</mo><mn>100</mn><mo>&nbsp;</mo><mi>kg</mi></math>) to a spaceship (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi><mo>≫</mo><mi mathvariant=\"normal\">m</mi></math>) which is&nbsp;orbiting near the earth's surface as shown in the figure. Assuming&nbsp;that the spaceship and the astronaut fall on a straight line from the earth's centre, then the tension in the cord is close to [<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi><mo>=</mo><mn>6400</mn><mo>&nbsp;</mo><mi>km</mi></math>]&nbsp;<br />\r<br />\r<u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014055_Ques1_1.jpg\" style=\"width: 250px; height: 267px;\" /></strong></u></p>\r", "image": null}, "options": [{"id": "e7H2f", "text": "<math> <mrow> <mn>3</mn> <mo>×</mo> <mn>1</mn> <msup> <mn>0</mn> <mrow> <mo>-</mo> <mn>2</mn></mrow></msup><mtext>&nbsp;N</mtext> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "IR4sg", "text": "<math><mrow>  <mn>2</mn>  <mo>&times;</mo>  <mn>1</mn>  <msup>          <mn>0</mn>      <mrow>        <mo>-</mo>        <mn>2</mn>      </mrow>  </msup>  <mtext>&nbsp;N</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "lw5RW", "text": "<math><mrow>  <mn>4</mn>  <mo>&times;</mo>  <mn>1</mn>  <msup>          <mn>0</mn>      <mrow>        <mo>-</mo>        <mn>2</mn>      </mrow>  </msup>  <mtext>&nbsp;N</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "vfAmZ", "text": "<math> <mrow> <mn>5</mn> <mo>×</mo> <mn>1</mn> <msup> <mn>0</mn> <mrow> <mo></mo> <mn>-2</mn> </mrow> </msup> <mtext>&nbsp;N</mtext> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to given problem, the mass of satellite <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi></ma he equation of motion of the astronaut will be<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mtext>GM</mtext><mrow><mi mathvariant=\"normal\">e</mi><mo>&#8289;</mo></mrow></msub><mi mathvariant=\"normal\">m</mi><mo>&#8289;</mo></mrow><mrow><mi mathvariant=\"normal\">r</mi><msup><mo>&#8289;</mo><mn>2</mn></msup></mrow></mfrac><mo>+</mo><mi mathvariant=\"normal\">T</mi><mo>&#8289;</mo><mo>=</mo><mi mathvariant=\"normal\">m</mi><mo>&#8289;</mo><mi mathvariant=\"normal\">r</mi><mo>&#8289;</mo><msup><mi mathvariant=\"normal\">&#969;</mi><mn>2</mn></msup><mtext>,</mtext><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mtext>i.e.,</mtext><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mi mathvariant=\"normal\">T</mi><mo>&#8289;</mo><mo>=</mo><mi mathvariant=\"normal\">m</mi><mo>&#8289;</mo><mfenced open=\"[\" close=\"]\"><mrow><mi mathvariant=\"normal\">r</mi><mo>&#8289;</mo><msup><mi mathvariant=\"normal\">&#969;</mi><mn>2</mn></msup><mo>-</mo><mfrac><msub><mtext>GM</mtext><mrow><mi mathvariant=\"normal\">e</mi><mo>&#8289;</mo></mrow></msub><mrow><mi mathvariant=\"normal\">r</mi><msup><mo>&#8289;</mo><mn>2</mn></msup></mrow></mfrac></mrow></mfenced></math><br /><br />In the light of equation (i), above equation reduces to<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>&#8289;</mo><mo>=</mo><mtext>mg</mtext><mfenced open=\"[\" close=\"]\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">r</mi><mo>&#8289;</mo></mrow><mrow><mi mathvariant=\"normal\">R</mi><mo>&#8289;</mo></mrow></mfrac><mo>-</mo><msup><mfenced><mfrac><mrow><mi mathvariant=\"normal\">R</mi><mo>&#8289;</mo></mrow><mrow><mi mathvariant=\"normal\">r</mi><mo>&#8289;</mo></mrow></mfrac></mfenced><mn>2</mn></msup></mrow></mfenced><mo>=</mo><mtext>mg</mtext><mfenced open=\"[\" close=\"]\"><mrow><mfrac><mfenced><mrow><mi mathvariant=\"normal\">R</mi><mo>&#8289;</mo><mo>+</mo><mi
