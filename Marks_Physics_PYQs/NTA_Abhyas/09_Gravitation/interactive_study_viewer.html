</mo> <mn>3</mn> </mrow> <mrow> <mn>2</mn> <mn>4</mn> </mrow> </mfrac> </mrow> </mfenced> <mo>=</mo> <mfrac> <mrow> <msqrt> <mn>3</mn> </msqrt> <msup> <mo mathvariant=\"italic\">Gm</mo> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn> <msup> <mo mathvariant=\"italic\">d</mo> <mn>2</mn> </msup> </mrow> </mfrac> <mtext>along SQ</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86350d1e84790633db4", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "91", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A large sphere of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> is fixed at one position and two identical particles each of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>&nbsp;are kept on a line passing through the centre of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> (see figure). The point masses are connected by a rigid massless rod of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi></math> and this assembly is free to move along the line connecting them. All three masses interact only through their mutual gravitational interaction. When the point mass nearer to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> is at a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><mn>3</mn><mi>l</mi></math> from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math>, the tension in the rod is zero for <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>=</mo><mi>k</mi><mfenced separators=\"|\"><mfrac><mi>M</mi><mn>288</mn></mfrac></mfenced></math>. The value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi></math> is<br />\r<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image5-5173a529-60b6-4425-b1dc-89ce80a6f1c1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"height: 61px; width: 300px;\" />", "image": null}, "options": [], "correctValue": "7", "solution": {"text": "Due to gravitational interaction connected masses have some acceleration.<br /><br />Let both small masses are moving with acceleration 'a' towards larger mass M<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image6-db67c1cc-3cf9-4c0c-863a-38201940e80d.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"height: 123px; width: 300px;\" /><br /><br />Force equation for mass nearer to a larger mass<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><msup><mfenced separators=\"|\"><mrow><mn>3</mn><mi>l</mi></mrow></mfenced><mn>2</mn></msup></mfrac><mo>-</mo><mfrac><mrow><mi>G</mi><msup><mi>m</mi><mn>2</mn></msup></mrow><msup><mi>l</mi><mn>2</mn></msup></mfrac><mo>=</mo><mi>m</mi><mi>a</mi></math> ...(i)<br /><br />Force equation for mass away from a larger mass<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><msup><mfenced separators=\"|\"><mrow><mn>4</mn><mi>l</mi></mrow></mfenced><mn>2</mn></msup></mfrac><mo>+</mo><mfrac><mrow><mi>G</mi><msup><mi>m</mi><mn>2</mn></msup></mrow><msup><mi>l</mi><mn>2</mn></msup></mfrac><mo>=</mo><mi>m</mi><mi>a</mi></math> ...(ii)<br /><br />From equation (i) &amp; (ii)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mrow><mn>9</mn><msup><mi>l</mi><mn>2</mn></msup></mrow></mfrac><mo>-</mo><mfrac><mrow><mi>G</mi><mi>m</mi></mrow><msup><mi>l</mi><mn>2</mn></msup></mfrac><mo>=</mo><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mrow><mn>16</mn><msup><mi>l</mi><mn>2</mn></msup></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>G</mi><mi>m</mi></mrow><msup><mi>l</mi><mn>2</mn></msup></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mi>M</mi><mn>9</mn></mfrac><mo>-</mo><mfrac><mi>M</mi><mn>16</mn></mfrac><mo>=</mo><mi>m</mi><mo>+</mo><mi>m</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>7</mn><mi>M</mi></mrow><mn>144</mn></mfrac><mo>=</mo><mn>2</mn><mi>m</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>m</mi><mo>=</mo><mfrac><mrow><mn>7</mn><mi>M</mi></mrow><mn>288</mn></mfrac><mo>=</mo><mi>k</mi><mfenced separators=\"|\"><mfrac><mi>M</mi><mn>288</mn></mfrac></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>k</mi><mo>=</mo><mn>7</mn></math><p>&nbsp;</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632f10b9f8762bf6ab", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "04", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Three particles each of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>=</mo><mn>1</mn><mo>&nbsp;</mo><mi>kg</mi></math>, are located at the vertices of an equilateral triangle of side <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>.&nbsp;The speed at which they must move to revolve in a circular orbit,&nbsp;under the influence of mutual gravitational force, circumscribing and preserving the equilateral triangle is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mi>n</mi><msqrt><mi mathvariant=\"normal\">G</mi></msqrt></math>, then the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>&nbsp;is", "image": null}, "options": [], "correctValue": "0.50", "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/ef_wntml/dfghdjhjhjjhsbns.png\"><br><p>The net gravitational force on any particle due to the other two is<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mi mathvariant=\"normal\">g</mi></msub><mo>=</mo><mfrac><mrow><mn>2</mn><mi>G</mi><msup><mi>m</mi><mn>2</mn></msup></mrow><msup><mi>a</mi><mn>2</mn></msup></mfrac><mi>cos</mi><mfenced><mrow><mn>30</mn><mo>°</mo></mrow></mfenced><mo>=</mo><mfrac><mrow><msqrt><mn>3</mn></msqrt><mi>G</mi><msup><mi>m</mi><mn>2</mn></msup></mrow><msup><mi>a</mi><mn>2</mn></msup></mfrac></math><br />Now,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo mathvariant=\"italic\">=</mo><mfrac><mi mathvariant=\"italic\">a</mi><msqrt><mn mathvariant=\"italic\">3</mn></msqrt></mfrac></math></p><p>For circular motion,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mi mathvariant=\"normal\">g</mi></msub><mo>=</mo><mfrac><mrow><msqrt><mn>3</mn></msqrt><mi>G</mi><msup><mi>m</mi><mn>2</mn></msup></mrow><msup><mi>a</mi><mn>2</mn></msup></mfrac><mo>=</mo><mfrac><mrow><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup></mrow><mi>r</mi></mfrac></math></p><p>Solving it we obtain,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mn>0.50</mn><msqrt><mi>G</mi></msqrt></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "6aa3ab79aa8dc1ff6817805a", "title": "Gravitational Field", "totalQuestions": 23, "questions": [{"_id": "6151e863ee5d46d6092410f0", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "62", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A cavity of the radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac bevelled=\"true\"><mi>R</mi><mn>2</mn></mfrac></math> is made inside a solid sphere of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>. The centre of the cavity is located at a distance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac bevelled=\"true\"><mi>R</mi><mn>2</mn></mfrac></math> from the centre of the sphere. The gravitational force on a particle of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> at a distance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac bevelled=\"true\"><mi>R</mi><mn>2</mn></mfrac></math> from the centre of the sphere on the line joining both the centres of sphere and cavity is (opposite to the centre of the cavity).<br />\r[Here <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mo>=</mo><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><msup><mi>R</mi><mn>2</mn></msup></mfrac></math>, where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> is the mass of the sphere]", "image": null}, "options": [{"id": "lAosC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mtext mathvariant=\"italic\">mg</mtext><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "lK9xk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3&#160;</mn><mtext mathvariant=\"italic\">mg</mtext></mrow><mn>8</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "zNtng", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mtext mathvariant=\"italic\">mg</mtext><mrow><mn>1</mn><mn>6</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "cY9Jk", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Gravitation field at mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> due to a full solid sphere<br /><br /><math> <mrow> <msub> <mrow> <mover accent=\"true\"> <mtext>E</mtext> <mo>&#8594;</mo> </mover> </mrow> <mn>1</mn> </msub> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <msub> <mtext>g</mtext> <mn>0</mn> </msub> <mover accent=\"true\"> <mtext>r</mtext> <mo>&#8594;</mo> </mover> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <msub> <mtext>g</mtext> <mn>0</mn> </msub> <mover accent=\"true\"> <mtext>r</mtext> <mo>^</mo> </mover> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math></p><p>Gravitational field due to the cavity at mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><mo>'</mo><mo>=</mo><mfrac><mpadded voffset=\"-1px\"><msup><mfenced><mstyle displaystyle=\"true\"><mfrac bevelled=\"true\"><mi>R</mi><mn>2</mn></mfrac></mstyle></mfenced><mn>3</mn></msup></mpadded><msup><mi>R</mi><mn>3</mn></msup></mfrac><mi>M</mi></math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>M</mi><mo>'</mo><mo>=</mo><mfrac><mi>M</mi><mn>8</mn></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mover><mtext>E</mtext><mo>&#8594;</mo></mover><mn>2</mn></msub><mo>=</mo><mo>-</mo><mfenced><mfrac><mrow><mo>-</mo><msup><mtext>GM</mtext><mo>'</mo></msup><mover><mtext>&#160;r</mtext><mo>^</mo></mover></mrow><msup><mtext>R</mtext><mn>2</mn></msup></mfrac></mfenced><mtext>,</mtext></math><br /><br /><math> <mrow> <mo>=</mo> <mfrac> <mrow> <mo>GM</mo> <mover accent=\"true\"> <mtext>r</mtext> <mo>^</mo> </mover> </mrow> <mrow> <mn>8</mn> <msup> <mtext>R</mtext> <mn>2</mn> </msup> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>g</mtext> <mn>0</mn> </msub> <mover accent=\"true\"> <mo>r</mo> <mo>^</mo> </mover> </mrow> <mrow> <mn>8</mn> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <msub> <mrow> <mover accent=\"true\"> <mtext>E</mtext> <mo>&#8594;</mo> </mover> </mrow> <mo>net</mo> </msub> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mo>-</mo> <msub> <mtext>g</mtext> <mn>0</mn> </msub> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <msub> <mtext>g</mtext> <mn>0</mn> </msub> </mrow> <mrow> <mn>8</mn> </mrow> </mfrac> </mrow> </mfenced> <mover accent=\"true\"> <mtext>r</mtext> <mo>^</mo> </mover> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mfrac> <mrow> <mo>-</mo> <mn>3</mn> <msub> <mtext>g</mtext> <mn>0</mn> </msub> <mover accent=\"true\"> <mo>r</mo> <mo>^</mo> </mover> </mrow> <mrow> <mn>8</mn> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>&#8658;&#160;&#160;&#160;</mo> <msub> <mrow> <mover accent=\"true\"> <mtext>F</mtext> <mo>&#8594;</mo> </mover> </mrow> <mtext>net</mtext> </msub> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <mn>3</mn> <msub> <mtext>mg</mtext> <mn>0</mn> </msub> <mover accent=\"true\"> <mo>r</mo> <mo>^</mo> </mover> </mrow> <mrow> <mn>8</mn> </mrow> </mfrac> </mrow> </math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e811752372e1b0f3", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "29", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An astronaut whose height is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1.50</mn><mo>&nbsp;</mo><mtext>m</mtext></math> floats \"feet down\" in an orbiting space shuttle at a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>r</mtext><mo>=</mo><mroot><mrow><mn>6</mn><mo>.</mo><mn>67</mn></mrow><mn>3</mn></mroot><mo>×</mo><msup><mn>10</mn><mn>6</mn></msup><mo>&nbsp;</mo><mtext>m</mtext></math> away from the centre of Earth. The magnitude of difference between the gravitational acceleration at her feet and at her head is found to be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>N</mtext><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>. What is the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">N</mi></math>?&nbsp; &nbsp;<br />\r[<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext>M</mtext><mtext>E</mtext></msub><mo>=</mo><mn>6</mn><mo>×</mo><msup><mn>10</mn><mn>24</mn></msup><mo>&nbsp;</mo><mtext>kg</mtext></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">G</mi><mo>=</mo><mn>6</mn><mo>.</mo><mn>67</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>11</mn></mrow></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup><mo>&nbsp;</mo><msup><mi>kg</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>]", "image": null}, "options": [], "correctValue": "1.8", "solution": {"text": "The gravitational acceleration at any distance <math><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\"></mi></math> from the center of Earth is&nbsp;<math><msub><mrow><mtext>a</mtext></mrow><mrow><mtext>g</mtext></mrow></msub><mo>=</mo><mfrac><mrow><msub><mrow><mtext>GM</mtext></mrow><mrow><mtext>E</mtext></mrow></msub></mrow><mrow><msup><mrow><mtext>r</mtext></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mi mathvariant=\"normal\"></mi></math>.<br />On differentiating, we get&nbsp;&nbsp;<math><mi mathvariant=\"normal\"></mi><msub><mrow><mtext>da</mtext></mrow><mrow><mtext>g</mtext></mrow></msub><mo>=</mo><mo>-</mo><mn>2</mn><mfrac><mrow><msub><mrow><mtext>GM</mtext></mrow><mrow><mtext>E</mtext></mrow></msub></mrow><mrow><msup><mrow><mtext>r</mtext></mrow><mrow><mn>3</mn></mrow></msup></mrow></mfrac><mtext>dr</mtext></math>,&nbsp;where <math><mi mathvariant=\"normal\"></mi><msub><mrow><mtext>da</mtext></mrow><mrow><mtext>g</mtext></mrow></msub><mi mathvariant=\"normal\"></mi></math> is infinitesimal change in a due to differential change <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>dr</mi></math> in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi></math>.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced close=\"|\" open=\"|\"><msub><mtext>da</mtext><mtext>g</mtext></msub></mfenced><mo>=</mo><mn>2</mn><mfrac><mrow><mfenced separators=\"|\"><mrow><mn>6.67</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>11</mn></mrow></msup></mrow></mfenced><mfenced separators=\"|\"><mrow><mn>6</mn><mo>&#215;</mo><msup><mn>10</mn><mn>24</mn></msup></mrow></mfenced></mrow><msup><mfenced separators=\"|\"><mrow><mroot><mrow><mn>6</mn><mo>.67</mo></mrow><mn>3</mn></mroot><mo>&#215;</mo><msup><mn>10</mn><mn>6</mn></msup></mrow></mfenced><mn>3</mn></msup></mfrac><mo>&#215;</mo><mfenced separators=\"|\"><mn>1.50</mn></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mtext>1.8</mtext><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mtext>&#8195;N</mtext><mo>=</mo><mn>1</mn><mo>.</mo><mn>8</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863dd2482e617e47fe9", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "79", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A solid sphere of uniform density and radius <math><mi>r</mi></math> applies a gravitational force of attraction equal to <math><msub><mrow><mi>F</mi></mrow><mrow><mn>1</mn></mrow></msub></math>on a particle placed at <math><mi>P</mi></math>, distance <math><mn>2</mn><mi>R</mi></math> from the centre <math><mi>O</mi></math> of the sphere. A spherical cavity of the radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac bevelled=\"true\"><mi>R</mi><mn>2</mn></mfrac></math> is now made in the sphere as shown in the figure. The sphere with cavity now applied a gravitational force <math><msub><mrow><mi>F</mi></mrow><mrow><mn>2</mn></mrow></msub></math> on the same particle placed at <math><mi>P</mi></math>. The ratio <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac bevelled=\"true\"><msub><mi>F</mi><mn>2</mn></msub><msub><mi>F</mi><mn>1</mn></msub></mfrac></math> will be<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0028535_Question.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 180px; height: 105px;\" />", "image": null}, "options": [{"id": "CCjt3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "y1HEX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>7</mn><mn>9</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "b0JVI", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>", "image": null, "isCorrect": false}, {"id": "GrHVT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Gravitational force due to solid sphere, <math> <mrow> <msub> <mrow> <mi>F</mi><mo>&#8289;</mo> </mrow> <mn>1</mn> </msub> <mo>=</mo> <mfrac> <mrow> <mi>G</mi><mo>&#8289;</mo> <mi>M</mi><mo>&#8289;</mo> <mi>m</mi><mo>&#8289;</mo> </mrow> <mrow> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>2</mn> <mi>R</mi><mo>&#8289;</mo> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> </mrow> </mfrac> <mtext>,</mtext> </mrow> </math><br />where <math><mi>M</mi></math> and <math><mi>m</mi></math> are mass of the solid sphere and particle respectively and <math><mi>R</mi></math> is the radius of the sphere. The gravitational force on particle due to sphere with cavity = force due to solid sphere creating cavity, assumed to be present above at that position<br /><br />i.e.,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mn>2</mn></msub><mo>=</mo><mfrac><mtext mathvariant=\"italic\">GMm</mtext><mrow><mn>4</mn><msup><mtext mathvariant=\"italic\">R</mtext><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><mtext mathvariant=\"italic\">G</mtext><mfenced><mrow><mtext mathvariant=\"italic\">M</mtext><mo>/</mo><mn>8</mn></mrow></mfenced><mtext mathvariant=\"italic\">m</mtext></mrow><msup><mfenced><mrow><mn>3</mn><mtext mathvariant=\"italic\">R</mtext><mo>/</mo><mn>2</mn></mrow></mfenced><mn>2</mn></msup></mfrac><mo>=</mo><mfrac><mn>7</mn><mrow><mn>3</mn><mn>6</mn></mrow></mfrac><mfrac><mtext mathvariant=\"italic\">GMm</mtext><msup><mtext mathvariant=\"italic\">R</mtext><mn>2</mn></msup></mfrac></math><br /><br />So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mtext mathvariant=\"italic\">F</mtext><mn>2</mn></msub><msub><mi>F</mi><mn>1</mn></msub></mfrac><mo>=</mo><mfrac><mrow><mn>7</mn><mtext mathvariant=\"italic\">GMm</mtext></mrow><mrow><mn>3</mn><mn>6</mn><msup><mtext mathvariant=\"italic\">R</mtext><mn>2</mn></msup></mrow></mfrac><mo>/</mo><mfenced><mfrac><mtext mathvariant=\"italic\">GMm</mtext><mrow><mn>4</mn><msup><mtext mathvariant=\"italic\">R</mtext><mn>2</mn></msup></mrow></mfrac></mfenced><mo>=</mo><mfrac><mn>7</mn><mn>9</mn></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863db638ee3b007cc1d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "84", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A hypothetical planet in the shape of a sphere is completely made of an incompressible fluid and has a mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> and radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>. If the pressure at the surface of the planet is zero, then the pressure at the centre of the planet is [<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>G</mi></math>&nbsp;= universal constant of gravitation]", "image": null}, "options": [{"id": "tXU3F", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mfrac><mstyle displaystyle=\"true\"><mn>3</mn><mi>G</mi><msup><mi>M</mi><mn>2</mn></msup></mstyle><mstyle displaystyle=\"true\"><mn>8</mn><mi>&#x3C0;</mi><msup><mi>R</mi><mn>4</mn></msup></mstyle></mfrac></math>", "image": null, "isCorrect": true}, {"id": "30SLV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mfrac><mstyle displaystyle=\"true\"><mn>3</mn><mi>G</mi><msup><mi>M</mi><mn>2</mn></msup></mstyle><mstyle displaystyle=\"true\"><mn>4</mn><mi>&#x3C0;</mi><msup><mi>R</mi><mn>4</mn></msup></mstyle></mfrac></math>", "image": null, "isCorrect": false}, {"id": "WN8sW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mfrac><mstyle displaystyle=\"true\"><mn>3</mn><mi>G</mi><msup><mi>M</mi><mn>2</mn></msup></mstyle><mstyle displaystyle=\"true\"><mn>8</mn><msup><mi>&#x3C0;</mi><mn>2</mn></msup><msup><mi>R</mi><mn>4</mn></msup></mstyle></mfrac></math>", "image": null, "isCorrect": false}, {"id": "RZWN4", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mfrac><mstyle displaystyle=\"true\"><mn>3</mn><mi>G</mi><msup><mi>M</mi><mn>2</mn></msup></mstyle><mstyle displaystyle=\"true\"><mn>4</mn><msup><mi>&#x3C0;</mi><mn>2</mn></msup><msup><mi>R</mi><mn>4</mn></msup></mstyle></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The pressure gradient at a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>&nbsp;from the centre of the spherical planet is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>P</mi></mrow><mrow><mi>d</mi><mi>r</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mi>&#961;</mi><mi>g</mi></math>, where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi></math>&nbsp;is the acceleration due to gravity at that point</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>P</mi></mrow><mrow><mi>d</mi><mi>r</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mfenced><mfrac><mstyle displaystyle=\"true\"><mn>3</mn><mi>M</mi></mstyle><mstyle displaystyle=\"true\"><mn>4</mn><mi>&#960;</mi><msup><mi>R</mi><mn>3</mn></msup></mstyle></mfrac></mfenced><mfenced><mrow><mfrac><mstyle displaystyle=\"true\"><mi>G</mi><mi>M</mi></mstyle><mstyle displaystyle=\"true\"><msup><mi>R</mi><mn>3</mn></msup></mstyle></mfrac><mi>r</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi><mi>P</mi><mo>=</mo><mo>-</mo><mfenced><mrow><mfrac><mstyle displaystyle=\"true\"><mn>3</mn><mi>G</mi><msup><mi>M</mi><mn>2</mn></msup></mstyle><mstyle displaystyle=\"true\"><mn>4</mn><mi>&#960;</mi><msup><mi>R</mi><mn>6</mn></msup></mstyle></mfrac><mi>r</mi></mrow></mfenced><mi>d</mi><mi>r</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mo>&#8747;</mo><mi>P</mi><mn>0</mn></msubsup><mi>d</mi><mi>P</mi><mo>=</mo><mo>-</mo><mfrac><mstyle displaystyle=\"true\"><mn>3</mn><mi>G</mi><msup><mi>M</mi><mn>2</mn></msup></mstyle><mstyle displaystyle=\"true\"><mn>4</mn><mi>&#960;</mi><msup><mi>R</mi><mn>6</mn></msup></mstyle></mfrac><msubsup><mo>&#8747;</mo><mn>0</mn><mi>R</mi></msubsup><mi>r</mi><mi>d</mi><mi>r</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mfrac><mstyle displaystyle=\"true\"><mn>3</mn><mi>G</mi><msup><mi>M</mi><mn>2</mn></msup></mstyle><mstyle displaystyle=\"true\"><mn>8</mn><mi>&#960;</mi><msup><mi>R</mi><mn>4</mn></msup></mstyle></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d066dfd973d92364", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "101", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A spherical hole is made in a solid sphere of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>. The mass of the sphere before hollowing was <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math>. The gravitational field at the centre of the hole due to the remaining mass is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0027280_Question._.xyz.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 173px; height: 170px;\" />", "image": null}, "options": [{"id": "tXSFU", "text": "Zero", "image": null, "isCorrect": false}, {"id": "C6iaR", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mtext mathvariant=\"italic\">GM</mtext><mrow><mn>8</mn><msup><mtext mathvariant=\"italic\">R</mtext><mn>2</mn></msup></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "oGbnx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mtext mathvariant=\"italic\">GM</mtext><mrow><mn>2</mn><msup><mtext mathvariant=\"italic\">R</mtext><mn>2</mn></msup></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "QUiii", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mtext mathvariant=\"italic\">GM</mtext><msup><mtext mathvariant=\"italic\">R</mtext><mn>2</mn></msup></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "By the principle of superposition of fields<br /><br /><math> <mrow> <mover accent=\"true\"> <mtext>E</mtext> <mo>→</mo> </mover> <mo>=</mo> <msub> <mrow> <mover accent=\"true\"> <mtext>E</mtext> <mo>→</mo> </mover> </mrow> <mn>1</mn> </msub> <mo>+</mo> <msub> <mrow> <mover accent=\"true\"> <mtext>E</mtext> <mo>→</mo> </mover> </mrow> <mn>2</mn> </msub> </mrow> </math><br /><br />Here, <math> <mrow> <mover accent=\"true\"> <mtext>E</mtext> <mo>→</mo> </mover> </mrow> </math> = net field at the centre of hole due to entire mass<br /><br /><math> <mrow> <msub> <mrow> <mover accent=\"true\"> <mtext>E</mtext> <mo>→</mo> </mover> </mrow> <mn>1</mn> </msub> </mrow> </math> = field due to remaining mass<br /><br />and &nbsp;<math> <mrow> <msub> <mrow> <mover accent=\"true\"> <mtext>E</mtext> <mo>→</mo> </mover> </mrow> <mn>2</mn> </msub> </mrow> </math> = field due to mass in hole = 0<br /><br /><math> <mrow> <mo>∴&nbsp;&nbsp;&nbsp;&nbsp;</mo> <msub> <mtext>E</mtext> <mn>1</mn> </msub> <mo>=</mo> <mtext>E</mtext> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>GM</mtext> </mrow> <mrow> <msup> <mtext>R</mtext> <mn>3</mn> </msup> </mrow> </mfrac> </mrow> </mfenced> <mtext>.</mtext> <mtext>r</mtext> </mrow> </math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;where r <math> <mrow> <mo>=</mo> <mfrac> <mrow> <mtext>R</mtext> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>∴&nbsp;&nbsp;&nbsp;&nbsp;</mo> <mtext>E</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>GM</mtext> </mrow> <mrow> <mn>2</mn> <msup> <mtext>R</mtext> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863caa7ca38840836d7", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "107", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A solid sphere of uniform density and radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> applies a gravitational force of attraction equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mn>1</mn></msub></math>&nbsp;on a particle placed at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math>, distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi>R</mi></math> from the centre O of the sphere. A spherical cavity of the radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac bevelled=\"true\"><mi>R</mi><mn>2</mn></mfrac></math> is now made in the sphere as shown in the figure.<br />\rThe sphere with the cavity now applies a gravitational force <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mn>2</mn></msub></math>&nbsp;on the same particle placed at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math>.<br />\rThe ratio <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac bevelled=\"true\"><msub><mi>F</mi><mn>2</mn></msub><msub><mi>F</mi><mn>1</mn></msub></mfrac></math>&nbsp;will be<br />\r<br />\r&nbsp;&nbsp;<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0016177_Question_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 200px; height: 125px;\" />", "image": null}, "options": [{"id": "yyuhV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "RvvmB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>7</mn><mn>9</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "DSkPA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>", "image": null, "isCorrect": false}, {"id": "y2M5w", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Gravitational force due to solid sphere, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">F</mtext><mn>1</mn></msub><mo>=</mo><mfrac><mtext mathvariant=\"italic\">GMm</mtext><msup><mfenced><mrow><mn>2</mn><mtext mathvariant=\"italic\">R</mtext></mrow></mfenced><mn>2</mn></msup></mfrac></math>&nbsp; where M and m are mass of the solid sphere and particle respectively and R is the radius of the sphere.<br /><br />The gravitational force on the particle due to sphere with cavity = force due to a solid sphere - force due to sphere creating a cavity, assumed to be present above at that position.<br /><br />i.e.,&nbsp;&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">F</mtext><mn>2</mn></msub><mo>=</mo><mfrac><mtext mathvariant=\"italic\">GMm</mtext><mrow><mn>4</mn><msup><mtext mathvariant=\"italic\">R</mtext><mn>2</mn></msup></mrow></mfrac><mo>-</mo><mfrac><mrow><mtext mathvariant=\"italic\">G</mtext><mfenced><mrow><mtext mathvariant=\"italic\">M</mtext><mo>/</mo><mn>8</mn></mrow></mfenced><mtext mathvariant=\"italic\">m</mtext></mrow><msup><mfenced><mrow><mn>3</mn><mtext mathvariant=\"italic\">R</mtext><mo>/</mo><mn>2</mn></mrow></mfenced><mn>2</mn></msup></mfrac><mo>=</mo><mfrac><mn>7</mn><mrow><mn>3</mn><mn>6</mn></mrow></mfrac><mfrac><mtext mathvariant=\"italic\">GMm</mtext><msup><mtext mathvariant=\"italic\">R</mtext><mn>2</mn></msup></mfrac></math><br /><br />So&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mtext mathvariant=\"italic\">F</mtext><mn>2</mn></msub><msub><mtext mathvariant=\"italic\">F</mtext><mn>1</mn></msub></mfrac><mo>=</mo><mfrac><mfrac><mrow><mn>7</mn><mtext mathvariant=\"italic\">GMm</mtext></mrow><mrow><mn>3</mn><mn>6</mn><msup><mtext mathvariant=\"italic\">R</mtext><mn>2</mn></msup></mrow></mfrac><mfenced><mfrac><mtext mathvariant=\"italic\">GMm</mtext><mrow><mn>4</mn><msup><mtext mathvariant=\"italic\">R</mtext><mn>2</mn></msup></mrow></mfrac></mfenced></mfrac><mo>=</mo><mfrac><mn>7</mn><mn>9</mn></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c4065c993621002a", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "26", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Gravitational acceleration on the surface of&nbsp; a planet is <math> <mrow> <mfrac> <mrow> <msqrt> <mn>6</mn> </msqrt> </mrow> <mrow> <mn>1</mn> <mn>1</mn> </mrow> </mfrac> <mtext>g</mtext> </mrow> </math>, where g is the gravitational acceleration on the surface of the earth. The average mass density of the planet is <math> <mrow> <mfrac> <mrow> <mn>2</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> </mrow> </math> times that of the earth. If the escape speed on the surface of the earth is taken to be 11 kms<sup>-1</sup>, the escape speed on the surface of the planet in kms<sup>-1</sup> will be.", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "<math> <mrow> <mtext>g</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>GM</mtext> </mrow> <mrow> <msup> <mtext>R</mtext> <mn>2</mn> </msup> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>G</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>4</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> <mi>&#960;</mi> <msup> <mtext>R</mtext> <mn>3</mn> </msup> </mrow> </mfenced> <mi>&#961;</mi> </mrow> <mrow> <msup> <mtext>R</mtext> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </math><br /><br />or &nbsp; &nbsp; <math> <mrow> <mtext>g</mtext> <mo>&#8733;</mo> <mi>&#961;</mi> <mtext>R</mtext> </mrow> </math><br /><br />or &nbsp;&nbsp;<math> <mrow> <mtext>R</mtext> <mo>&#8733;</mo> <mfrac> <mrow> <mtext>g</mtext> </mrow> <mrow> <mi>&#961;</mi> </mrow> </mfrac> </mrow> </math><br /><br />Now escape velocity,&nbsp;&nbsp;<math> <mrow> <msub> <mi>&#957;</mi> <mtext>e</mtext> </msub> <mo>&#8733;</mo> <msqrt> <mn>2</mn> <mtext>gR</mtext> </msqrt> </mrow> </math><br /><br />or &nbsp; &nbsp; &nbsp;<math> <mrow> <msub> <mi>&#957;</mi> <mtext>e</mtext> </msub> <mo>&#8733;</mo> <msqrt> <mtext>gR</mtext> </msqrt> </mrow> </math><br /><br />or &nbsp; &nbsp;&nbsp; <math> <mrow> <msub> <mi>&#957;</mi> <mtext>e</mtext> </msub> <mo>&#8733;</mo> <msqrt> <mtext>g</mtext> <mo>&#215;</mo> <mfrac> <mrow> <mtext>g</mtext> </mrow> <mrow> <mi>&#961;</mi> </mrow> </mfrac> </msqrt> <mo>&#8733;</mo> <msqrt> <mfrac> <mrow> <msup> <mtext>g</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mi>&#961;</mi> </mrow> </mfrac> </msqrt> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><msub><mfenced><msub><mi>&#957;</mi><mtext>e</mtext></msub></mfenced><mtext>planet</mtext></msub><mo>=</mo><mfenced><msup><mtext>11 km s</mtext><mn>-1</mn></msup></mfenced><msqrt><mfrac><mn>6</mn><mrow><mn>1</mn><mn>2</mn><mn>1</mn></mrow></mfrac><mo>&#215;</mo><mfrac><mn>3</mn><mn>2</mn></mfrac></msqrt></math><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;<math> <mrow> <mo>=</mo> <msup> <mtext>3 km s</mtext> <mn>-1</mn> </msup> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b73bf337d843d187", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "17", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two concentric spherical shells of masses and radii <math><msub><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>,</mo><mi>&nbsp;</mi><msub><mrow><mi>r</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>,</mo><msub><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msub></math> respectively are as shown. The gravitational field intensity at point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/D-13_que.png\" style=\"width: 180px; height: 143px;\" />", "image": null}, "options": [{"id": "vCbTi", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>G</mi><msub><mi>m</mi><mn>1</mn></msub></mrow><mrow><msup><msub><mi>r</mi><mn>2</mn></msub><mn>2</mn></msup><mo mathvariant=\"italic\">-</mo><msup><msub><mi>r</mi><mn>1</mn></msub><mn>2</mn></msup></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "ynBbI", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>G</mi><msub><mi>m</mi><mn>1</mn></msub></mrow><msup><msub><mi>r</mi><mn>1</mn></msub><mn>2</mn></msup></mfrac></math>", "image": null, "isCorrect": false}, {"id": "p0EO9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>G</mi><msub><mi>m</mi><mn>1</mn></msub></mrow><msup><msub><mi>r</mi><mn>1</mn></msub><mn>2</mn></msup></mfrac><mo mathvariant=\"italic\">+</mo><mfrac><mrow><mi>G</mi><msub><mi>m</mi><mn>2</mn></msub></mrow><msup><msub><mi>r</mi><mn>2</mn></msub><mn>2</mn></msup></mfrac></math>", "image": null, "isCorrect": false}, {"id": "OumcF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>G</mi><msub><mi>m</mi><mn>1</mn></msub></mrow><msup><mi>r</mi><mn>2</mn></msup></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>Since field due to the outer sphere is zero at point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>&nbsp;Hence,</p><p>intensity will be&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>G</mi><msub><mi>m</mi><mn>1</mn></msub></mrow><msup><mi>r</mi><mn>2</mn></msup></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b4d1c27ebe8fdab0", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "43", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In older times, people used to think that the Earth was flat. Imagine that the Earth is indeed not a sphere of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>, but an infinite plate of thickness <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>H</mi></math>. What value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>H</mi></math> is needed to allow the same gravitational acceleration to be experienced as on the surface of the actual Earth? (Assume that the Earth's density is uniform and equal in the two models).", "image": null}, "options": [{"id": "zKbX0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mtext mathvariant=\"italic\">R</mtext></mrow><mn>3</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "WVuju", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>4</mn><mtext mathvariant=\"italic\">R</mtext></mrow><mn>3</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "qIReE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>8</mn><mtext mathvariant=\"italic\">R</mtext></mrow><mn>3</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "PMoCk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mtext mathvariant=\"italic\">R</mtext><mn>3</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/18545.png\" style=\"width: 203px; height: 170px;\" /><br /><br />Applying Gauss law<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8750;</mo><mover><mi>E</mi><mo>&#8594;</mo></mover><mo>.</mo><mi mathvariant=\"normal\">d</mi><mover><mi>s</mi><mo>&#8594;</mo></mover><mo>=</mo><mn>4</mn><mi>&#960;</mi><mi>G</mi><msub><mi>m</mi><mtext>in</mtext></msub></math><br /><br />Where <math> <mrow> <mover accent=\"true\"> <mi>E</mi> <mo stretchy=\"true\">&#8594;</mo> </mover> </mrow> </math> is gravitational field at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">d</mi><mover><mi>s</mi><mo>&#8594;</mo></mover></math><br /><br />Computing over colsed surface given<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mn>2</mn><mi>s</mi><mo>=</mo><mn>4</mn><mi>&#960;</mi><mi>G</mi><mrow><mo>(</mo><mi>&#961;</mi><mi>s</mi><mi>h</mi><mo>)</mo></mrow></math><br /><br /><math> <mrow> <mi>E</mi><mo>=</mo><mfrac> <mrow> <mn>4</mn><mi>&#960;</mi><mi>G</mi><mtext> </mtext><mi>&#961;</mi><mi>h</mi></mrow> <mn>2</mn> </mfrac> </mrow> </math> ... (1)<br /><br />On the surface of earth with radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>,&nbsp;<math> <mrow> <mi>E</mi><mo>=</mo><mfrac> <mrow> <mi>G</mi><mrow><mo>(</mo> <mrow> <mi>&#961;</mi><mfrac> <mn>4</mn> <mn>3</mn> </mfrac> <mi>&#960;</mi><msup> <mi>R</mi> <mn>3</mn> </msup> </mrow> <mo>)</mo></mrow></mrow> <mrow> <msup> <mi>R</mi> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>=</mo><mi>G</mi><mi>&#961;</mi><mfrac> <mn>4</mn> <mn>3</mn> </mfrac> <mi>&#960;</mi><mi>R</mi></mrow> </math> ... (2)<br /><br />Equating (1) and (2)<br /><br /><math> <mrow> <mfrac> <mrow> <mn>4</mn><mi>&#960;</mi><mtext> </mtext><mi>G</mi><mi>&#961;</mi><mi>h</mi></mrow> <mn>2</mn> </mfrac> <mo>=</mo><mi>G</mi><mi>&#961;</mi><mfrac> <mn>4</mn> <mn>3</mn> </mfrac> <mi>&#960;</mi><mi>R</mi></mrow> </math><br /><br /><math> <mrow> <mi>h</mi><mo>=</mo><mfrac> <mrow> <mn>2</mn><mi>R</mi></mrow> <mn>3</mn> </mfrac> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ad6ea5e81aa5b2ee", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "65", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A solid sphere of uniform density and radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> applies a gravitational force of attraction equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mn>1</mn></msub></math>&nbsp;on a particle placed at a distance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>R</mi></math> from the centre of the sphere. A spherical cavity of the radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac bevelled=\"true\"><mi>R</mi><mn>2</mn></mfrac></math> is now made in the sphere as shown in the figure. The sphere with the cavity now applies a gravitational force <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mn>2</mn></msub></math>&nbsp;on the same particle. The ratio&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>F</mi><mn>2</mn></msub><msub><mi>F</mi><mn>1</mn></msub></mfrac></math>&nbsp;is<br />\r<br />\r<b><u><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0027300_Question.jpg\" style=\"width: 180px; height: 136px;\" /></u></b>", "image": null}, "options": [{"id": "Ggde6", "text": "<math><mrow>  <mfrac>    <mrow>      <mn>9</mn>    </mrow>    <mrow>      <mn>5</mn>      <mn>0</mn>    </mrow>  </mfrac></mrow></math>", "image": null, "isCorrect": false}, {"id": "CEsoh", "text": "<math> <mrow> <mfrac> <mrow> <mn>4</mn> <mn>1</mn> </mrow> <mrow> <mn>5</mn> <mn>0</mn> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "1OhVV", "text": "<math><mrow>  <mfrac>    <mrow>      <mn>3</mn>    </mrow>    <mrow>      <mn>2</mn>      <mn>5</mn>    </mrow>  </mfrac></mrow></math>", "image": null, "isCorrect": false}, {"id": "39ctR", "text": "<math><mrow>  <mfrac>    <mrow>      <mn>2</mn>      <mn>2</mn>    </mrow>    <mrow>      <mn>2</mn>      <mn>5</mn>    </mrow>  </mfrac></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From the superposition principle,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mn>1</mn></msub><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><msub><mi>F</mi><mi mathvariant=\"normal\">r</mi></msub><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><msub><mi>F</mi><mi mathvariant=\"normal\">c</mi></msub></math><br /><br />Here, F<sub>r</sub> = force due to remaining part = F<sub>2</sub><br /><br />and F<sub>c</sub> = force due to cavity<br /><br />Now,&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mtext>F</mtext> <mn>1</mn> </msub> <mo>=</mo> <mfrac> <mrow> <mtext>GMm</mtext> </mrow> <mrow> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>3</mn> <mtext>R</mtext> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>GMm</mtext> </mrow> <mrow> <mn>9</mn> <msup> <mtext>R</mtext> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <msub> <mtext>F</mtext> <mtext>c</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mtext>G</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>M</mtext> </mrow> <mrow> <mn>8</mn> </mrow> </mfrac> </mrow> </mfenced> <mtext>m</mtext> </mrow> <mrow> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> <mtext>R</mtext> </mrow> </mfrac> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>GMm</mtext> </mrow> <mrow> <mn>5</mn> <mn>0</mn> <msup> <mtext>R</mtext> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>&#8756;&#160;&#160;&#160;&#160;</mo> <msub> <mtext>F</mtext> <mn>2</mn> </msub> <mo>=</mo> <msub> <mtext>F</mtext> <mn>1</mn> </msub> <mo>-</mo> <msub> <mtext>F</mtext> <mtext>c</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mn>4</mn> <mn>1</mn> <mtext>GMm</mtext> </mrow> <mrow> <mn>4</mn> <mn>5</mn> <mn>0</mn> <msup> <mtext>R</mtext> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>&#8756;&#160;&#160;&#160;&#160;</mo> <mfrac> <mrow> <msub> <mtext>F</mtext> <mn>2</mn> </msub> </mrow> <mrow> <msub> <mtext>F</mtext> <mn>1</mn> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>4</mn> <mn>1</mn> </mrow> <mrow> <mn>5</mn> <mn>0</mn> </mrow> </mfrac> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a0de3db19a192819", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "44", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If gravitational field due to uniform thin hemispherical shell at point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> is <math><mi>I</mi><mo>,</mo></math> then the magnitude of gravitational field at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Q</mi></math> is (Mass of hemispherical shell is <math><mi>M</mi><mo>,</mo></math> radius is&nbsp;<math><mi>R</mi></math> )<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/image11.jpg\" style=\"width: 114px; height: 165px;\" />", "image": null}, "options": [{"id": "i64po", "text": "<math><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mrow><mn>2</mn><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>-</mo><mi>I</mi></math>", "image": null, "isCorrect": true}, {"id": "hkvjC", "text": "<math><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mrow><mn>2</mn><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>+</mo><mi>I</mi></math>", "image": null, "isCorrect": false}, {"id": "n3ys6", "text": "<math><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mrow><mn>4</mn><mi>R</mi></mrow></mfrac><mo>-</mo><mi>I</mi></math>", "image": null, "isCorrect": false}, {"id": "bYrof", "text": "<math><mn>2</mn><mi>I</mi></math>  <math><mo>-</mo><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mrow><mn>2</mn><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/image12.jpg\" style=\"width: 96px; height: 146px;\" /></p><p>gravitational field due to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>II</mi></math>&nbsp;at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math>&nbsp;= gravitational field at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi></math>&nbsp;at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Q</mi></math></p><p>At&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mi mathvariant=\"normal\">I</mi></msub><mo>+</mo><msub><mi>E</mi><mi>II</mi></msub><mo>=</mo><mfrac><mrow><mi>G</mi><mfenced><mrow><mn>2</mn><mi>m</mi></mrow></mfenced></mrow><msup><mfenced><mrow><mn>2</mn><mi>R</mi></mrow></mfenced><mn>2</mn></msup></mfrac><mo>=</mo><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mrow><mn>2</mn><msup><mi>R</mi><mn>2</mn></msup></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mi mathvariant=\"normal\">I</mi></msub><mo>=</mo><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mrow><mn>2</mn><msup><mi>R</mi><mn>2</mn></msup></mrow></mfrac><mo>-</mo><msub><mi>E</mi><mi>II</mi></msub><mo>=</mo><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mrow><mn>2</mn><msup><mi>R</mi><mn>2</mn></msup></mrow></mfrac><mo>-</mo><mi>I</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639a67a4f52df54079", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "32", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">e</mi></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">p</mi></msub></math> denote the acceleration due to gravity on the surface of the earth and another planet whose mass and radius are twice that of the earth, then", "image": null}, "options": [{"id": "val3V", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">p</mi></msub><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">e</mi></msub><mn>2</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "ZfCAD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">p</mi></msub><mo>=</mo><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">e</mi></msub></math>", "image": null, "isCorrect": false}, {"id": "P1EOx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">p</mi></msub><mo>=</mo><mn>2</mn><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">e</mi></msub></math>", "image": null, "isCorrect": false}, {"id": "PyCXn", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">p</mi></msub><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">e</mi></msub><msqrt><mn>2</mn></msqrt></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Acceleration due to gravity is given by,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mi mathvariant=\"normal\">g</mi><mo>=</mo><mfrac><mi>GM</mi><msup><mi mathvariant=\"normal\">R</mi><mn>2</mn></msup></mfrac></math><br /><br />where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">G</mi></math> is gravitational constant.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">For</mi><mi mathvariant=\"bold\">&#160;</mi><mi mathvariant=\"bold\">earth</mi><mo>:</mo><mi mathvariant=\"normal\">&#160;</mi><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">e</mi></msub><mo>=</mo><mfrac><msub><mi>GM</mi><mi mathvariant=\"normal\">e</mi></msub><msubsup><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">e</mi><mn>2</mn></msubsup></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">For</mi><mi mathvariant=\"bold\">&#160;</mi><mi mathvariant=\"bold\">planet</mi><mo>:</mo><mi mathvariant=\"normal\">&#160;</mi><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">p</mi></msub><mo>=</mo><mfrac><msub><mi>GM</mi><mi mathvariant=\"normal\">p</mi></msub><msubsup><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">p</mi><mn>2</mn></msubsup></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>or</mi><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mi mathvariant=\"normal\">&#160;</mi><mfrac><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">e</mi></msub><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">p</mi></msub></mfrac><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">e</mi></msub><msub><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">p</mi></msub></mfrac><mi mathvariant=\"normal\">&#160;</mi><mo>&#215;</mo><mfrac><msubsup><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">p</mi><mn>2</mn></msubsup><msubsup><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">e</mi><mn>2</mn></msubsup></mfrac><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#8230;</mo><mfenced separators=\"|\"><mi mathvariant=\"normal\">i</mi></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Given</mi><mo>,</mo><mo>&#160;&#160;</mo><msub><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">p</mi></msub><mo>=</mo><mn>2</mn><msub><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">e</mi></msub><mo>,</mo><mo>&#160;&#160;</mo><msub><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">p</mi></msub><mo>=</mo><mn>2</mn><msub><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">e</mi></msub></math><br /><br />Putting the values in the Eq. (i), we obtain<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mi mathvariant=\"normal\">&#160;</mi><mfrac><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">e</mi></msub><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">p</mi></msub></mfrac><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">e</mi></msub><mrow><mn>2</mn><msub><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">e</mi></msub></mrow></mfrac><mo>&#215;</mo><mfrac><msup><mfenced separators=\"|\"><mrow><mn>2</mn><msub><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">e</mi></msub></mrow></mfenced><mn>2</mn></msup><msubsup><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">e</mi><mn>2</mn></msubsup></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mfrac><mn>4</mn><mn>1</mn></mfrac><mo>=</mo><mn>2</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mi mathvariant=\"normal\">&#160;</mi><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">p</mi></msub><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">e</mi></msub><mn>2</mn></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638f6282ca631d7b31", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "18", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The gravitational field in a region is given by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>g</mi><mo>→</mo></mover><mo>=</mo><mfenced><mrow><mn>5</mn><mover><mtext>i</mtext><mo>^</mo></mover><mo>+</mo><mn>12</mn><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover></mrow></mfenced><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi>kg</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>.&nbsp;The change in the gravitational potential energy of a particle of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi>kg</mi></math> when it is taken from the origin to a point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>7</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>,</mo><mo>&nbsp;</mo><mo>-</mo><mn>3</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></mrow></mfenced></math> is", "image": null}, "options": [{"id": "HTPr0", "text": "<math> <mrow> <mn>71</mn><mtext> </mtext><mtext> </mtext><mtext>J</mtext></mrow> </math>", "image": null, "isCorrect": false}, {"id": "9TZGy", "text": "<math><mrow>  <mn>1</mn>  <mn>3</mn>  <msqrt>    <mn>5</mn>    <mn>8</mn>  </msqrt>  <mtext>&nbsp;J</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "qp1Qm", "text": "<math> <mrow> <mn>2</mn><mtext> </mtext><mtext> </mtext><mtext>J</mtext></mrow> </math>", "image": null, "isCorrect": true}, {"id": "vViiZ", "text": "<math> <mrow>  <mn>1</mn><mtext>&#x2009;</mtext><mtext>&#x2009;</mtext><mtext>J</mtext></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi><mi>V</mi><mo>=</mo><mo>-</mo><mover><mi>E</mi><mo>→</mo></mover><mo>.</mo><mover><mrow><mi>d</mi><mi>r</mi></mrow><mo>→</mo></mover></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mo>∆</mo><mi>V</mi><mo>=</mo><mo>-</mo><mover><mi>E</mi><mo>→</mo></mover><mo>.</mo><mo>∆</mo><mover><mi>r</mi><mo>→</mo></mover></math><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mfenced><mrow><mn>5</mn><mover><mtext>i</mtext><mo>^</mo></mover><mo>+</mo><mn>1</mn><mn>2</mn><mover><mtext>j</mtext><mo>^</mo></mover></mrow></mfenced><mo>·</mo><mfenced><mrow><mn>7</mn><mover><mtext>i</mtext><mo>^</mo></mover><mo>-</mo><mn>3</mn><mover><mtext>j</mtext><mo>^</mo></mover></mrow></mfenced></math><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math> <mrow> <mo>=</mo> <mo>-</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>3</mn> <mn>5</mn> <mo>-</mo> <mn>3</mn> <mn>6</mn> </mrow> </mfenced> <mo>=</mo> <mn>1</mn> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>⇒Δ</mtext><mtext mathvariant=\"italic\">U</mtext><mo>=</mo><mtext mathvariant=\"italic\">m</mtext><mtext>Δ</mtext><mtext mathvariant=\"italic\">V</mtext><mo>=</mo><mn>2</mn><mo>J</mo></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638e49255993c54038", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "17", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A ball of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>&nbsp;is dropped from a height <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math>&nbsp;in a tunnel, made across the earth (mass = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math>, radius =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>) passing through its centre.&nbsp;If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><mo>≪</mo><mi>R</mi></math>&nbsp;such&nbsp;that the motion of the particle through&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math>&nbsp;can be considered uniformly accelerated at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi></math>,&nbsp;then the time period of the particle is</p>\r\r<p><br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/D-1_que.png\" style=\"width: 170px; height: 235px;\" /></p>\r", "image": null}, "options": [{"id": "azixF", "text": "<math><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>R</mi></mrow><mrow><mi>g</mi></mrow></mfrac></msqrt><mo>+</mo><msqrt><mfrac><mrow><mn>2</mn><mi>h</mi></mrow><mrow><mi>g</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "rSWI4", "text": "<math><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>R</mi></mrow><mrow><mi>g</mi></mrow></mfrac></msqrt><mo>+</mo><mn>2</mn><msqrt><mfrac><mrow><mi>h</mi></mrow><mrow><mi>g</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "kiomG", "text": "<math><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>R</mi></mrow><mrow><mi>g</mi></mrow></mfrac></msqrt><mo>+</mo><mn>4</mn><msqrt><mfrac><mrow><mn>2</mn><mi>h</mi></mrow><mrow><mi>g</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "ToAPl", "text": "<math><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mn>2</mn><mi>R</mi></mrow><mrow><mi>g</mi></mrow></mfrac></msqrt><mo>+</mo><msqrt><mfrac><mrow><mi>h</mi></mrow><mrow><mi>g</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/D-1_que.png\" style=\"width: 170px; height: 235px;\" /></p><p>The time, the particle takes to go through&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math>&nbsp;is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mi>h</mi></mrow><mi>g</mi></mfrac></msqrt></math>&nbsp;and in one complete oscillation, the particle travels through&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math>&nbsp;four times.</p><p>For the motion of the particle through the tunnel, the force acting on the particle is towards the centre of the earth and it is proportional to the distance of the particle from the centre of the earth. Hence the motion of the particle through the tunnel will be like an SHM.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><mo>-</mo><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><msup><mi>R</mi><mn>3</mn></msup></mfrac><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mo>-</mo><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><msup><mi>R</mi><mn>3</mn></msup></mfrac><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mi>SHM</mi></msub><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><msup><mi>R</mi><mn>3</mn></msup><mrow><mi>G</mi><mi>M</mi></mrow></mfrac></msqrt><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><mi>R</mi><mi>g</mi></mfrac></msqrt></math></p><p>So the time period of the particle is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><msub><mi>T</mi><mi>SHM</mi></msub><mo>+</mo><mn>4</mn><msqrt><mfrac><mrow><mn>2</mn><mi>h</mi></mrow><mi>g</mi></mfrac></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><mi>R</mi><mi>g</mi></mfrac></msqrt><mo>+</mo><mn>4</mn><msqrt><mfrac><mrow><mn>2</mn><mi>h</mi></mrow><mi>g</mi></mfrac></msqrt></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638121988eec8c14d8", "type": "singleCorrect" iavibnllxooredvrapvalyaiirc.jpeg\" style=\"max-width:100%; object-fit:contain\" width=\"197\" />", "image": null}, "options": [{"id": "krNQo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "5xJ7B", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "M6g36", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2.4</mn></math>", "image": null, "isCorrect": true}, {"id": "0ZyJV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3.6</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><msub><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>4</mn><mi>m</mi><mi>l</mi></mrow><mrow><mn>5</mn><mi>m</mi></mrow></mfrac><mo>=</mo><mn>0.8</mn><mi>l</mi></math><br /><br /><math><mfrac><mrow><mi>G</mi><mi>m</mi></mrow><mrow><msubsup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>4</mn><mi>G</mi><mi>m</mi></mrow><mrow><mo>(</mo><mi>l</mi><mo>-</mo><msub><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msub><msup><mrow><mo>)</mo></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math><br /><br /><math><mn>2</mn><msub><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><msub><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mi>l</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>x</mi><mn>2</mn></msub><mo>=</mo><mfrac><mi>l</mi><mn>3</mn></mfrac></math><br /><br /><math><mfrac><mrow><msub><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mn>2.4</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635c8f3f5a15b64bea", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "78", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The mass of a planet and its diameter are three times those of earth’s. Then the acceleration due to gravity on the surface of the planet is:&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>g</mi><mo>=</mo><mn>9</mn><mo>.</mo><mn>8</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced></math>", "image": null}, "options": [{"id": "DTySi", "text": "<math><mn>3.3</mn></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "eHLh2", "text": "<math><mn>4.9</mn></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "9m7xJ", "text": "<math><mn>19.6</mn></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "sGPV9", "text": "<math><mn>29.4</mn></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>g</mi><mrow><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">t</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>G</mi><mfenced separators=\"|\"><mrow><mn>3</mn><msub><mi>M</mi><mi>e</mi></msub></mrow></mfenced></mrow><msup><mfenced separators=\"|\"><mrow><mn>3</mn><msub><mi>R</mi><mi>e</mi></msub></mrow></mfenced><mn>2</mn></msup></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mo>=</mo><mfrac><mrow><mi>G</mi><msub><mi>M</mi><mi mathvariant=\"normal\">e</mi></msub></mrow><msup><msub><mi>R</mi><mi>e</mi></msub><mn>2</mn></msup></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>g</mi><mrow><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">t</mi></mrow></msub><mo>=</mo><mfrac><mn>9.8</mn><mn>3</mn></mfrac><mo>&#8776;</mo><mn>3.3</mn></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86357c385a122bf8a21", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "15", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The mass and the diameter of a planet are three times of the respective values for the earth. If the time period of oscillation of a simple pendulum on earth is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>,&nbsp;then the time period of oscillation of the same pendulum on the surface of the given planet would be", "image": null}, "options": [{"id": "aJqqU", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>2</mn></mfrac><mo>&#xA0;</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "h4IFj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><msqrt><mn>3</mn></msqrt></mfrac><mo>&#xA0;</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "w7igX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msqrt><mn>3</mn></msqrt><mn>2</mn></mfrac><mo>&#xA0;</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "nnQMp", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msqrt><mn>3</mn></msqrt><mo>&#xA0;</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>We know that,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mo>=</mo><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><msup><mi>R</mi><mn>2</mn></msup></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><msub><mi>g</mi><mi>p</mi></msub><msub><mi>g</mi><mi>e</mi></msub></mfrac><mo>=</mo><mfrac><msub><mi>M</mi><mi>p</mi></msub><msub><mi>M</mi><mi>e</mi></msub></mfrac><mo>&#215;</mo><msup><mfenced><mfrac><msub><mi>R</mi><mi>e</mi></msub><msub><mi>R</mi><mi>p</mi></msub></mfrac></mfenced><mn>2</mn></msup><mo>=</mo><mn>3</mn><mo>&#215;</mo><mfrac><mn>1</mn><mn>9</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac></math></p><p>Also,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfr o be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>N</mtext><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>. What is the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">N</mi></math>?&nbsp; &nbsp;<br />\r[<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext>M</mtext><mtext>E</mtext></msub><mo>=</mo><mn>6</mn><mo>×</mo><msup><mn>10</mn><mn>24</mn></msup><mo>&nbsp;</mo><mtext>kg</mtext></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">G</mi><mo>=</mo><mn>6</mn><mo>.</mo><mn>67</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>11</mn></mrow></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup><mo>&nbsp;</mo><msup><mi>kg</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>]", "image": null}, "options": [], "correctValue": "1.8", "solution": {"text": "The gravitational acceleration at any distance <math><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\"></mi></math> from the center of Earth is&nbsp;<math><msub><mrow><mtext>a</mtext></mrow><mrow><mtext>g</mtext></mrow></msub><mo>=</mo><mfrac><mrow><msub><mrow><mtext>GM</mtext></mrow><mrow><mtext>E</mtext></mrow></msub></mrow><mrow><msup><mrow><mtext>r</mtext></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mi mathvariant=\"normal\"></mi></math>.<br />On differentiating, we get&nbsp;&nbsp;<math><mi mathvariant=\"normal\"></mi><msub><mrow><mtext>da</mtext></mrow><mrow><mtext>g</mtext></mrow></msub><mo>=</mo><mo>-</mo><mn>2</mn><mfrac><mrow><msub><mrow><mtext>GM</mtext></mrow><mrow><mtext>E</mtext></mrow></msub></mrow><mrow><msup><mrow><mtext>r</mtext></mrow><mrow><mn>3</mn></mrow></msup></mrow></mfrac><mtext>dr</mtext></math>,&nbsp;
