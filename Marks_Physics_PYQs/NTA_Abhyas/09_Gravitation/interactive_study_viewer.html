3</mn><mi>R</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863bbbd913029ddc054", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "94", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ω</mi><mo mathvariant=\"italic\">&nbsp;</mo></math>is the angular velocity of the earth's rotation about its own axis and acceleration due to gravity on the earth's surface at the poles is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi></math>. An object weighed by a spring balance gives the same reading at the equator, as well as at a height&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math> above the poles (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><mo>&nbsp;</mo><mo>≪</mo><mo>&nbsp;</mo><mi>R</mi></math>). What is the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math>?", "image": null}, "options": [{"id": "qQcOi", "text": "<math><mfrac><mrow><mi>g</mi><mi>R</mi></mrow><mrow><mi>ω</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "oQsFL", "text": "<math><mfrac><mrow><msup><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>g</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "qYrIZ", "text": "<math><mfrac><mrow><msup><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><mi>g</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "ZKS3f", "text": "<math><mfrac><mrow><mn>2</mn><msup><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>g</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The value of acceleration due to gravity at the equator is <math><msub><mrow><mi>g</mi></mrow><mrow><mi>E</mi></mrow></msub><mo>=</mo><mi>g</mi><mo>-</mo><mi>R</mi><msup><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msup></math> and the acceleration due to gravity at a height h above the pole is <math><msub><mrow><mi>g</mi></mrow><mrow><mi>h</mi></mrow></msub><mo>=</mo><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mfrac><mrow><mn>2</mn><mi>h</mi></mrow><mrow><mi>R</mi></mrow></mfrac></mrow></mfenced><mi>g</mi></math> . It is given that<br /><br /><math><mo>∵</mo><mi>m</mi><msub><mrow><mi>g</mi></mrow><mrow><mi>E</mi></mrow></msub><mo>=</mo><mi>m</mi><msub><mrow><mi>g</mi></mrow><mrow><mi>h</mi></mrow></msub></math><br /><math><mo>∴</mo><msub><mrow><mi>g</mi></mrow><mrow><mi>E</mi></mrow></msub><mo>=</mo><msub><mrow><mi>g</mi></mrow><mrow><mi>h</mi></mrow></msub></math><br /><br /><math><mo>∴</mo><mi>g</mi><mo>-</mo><mi>R</mi><msup><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mfrac><mrow><mn>2</mn><mi>h</mi></mrow><mrow><mi>R</mi></mrow></mfrac></mrow></mfenced><mi>g</mi><mo>=</mo><mi>g</mi><mo>-</mo><mfrac><mrow><mn>2</mn><mi>h</mi><mi>g</mi></mrow><mrow><mi>R</mi></mrow></mfrac></math><br /><br /><math><mo>∴</mo><mi>R</mi><msup><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>2</mn><mi>h</mi><mi>g</mi></mrow><mrow><mi>R</mi></mrow></mfrac></math> <math><mo>∴</mo><mi>h</mi><mo>=</mo><mfrac><mrow><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><mi>g</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638e49255993c54038", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "17", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A ball of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>&nbsp;is dropped from a height <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math>&nbsp;in a tunnel, made across the earth (mass = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math>, radius =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>) passing through its centre.&nbsp;If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><mo>≪</mo><mi>R</mi></math>&nbsp;such&nbsp;that the motion of the particle through&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math>&nbsp;can be considered uniformly accelerated at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi></math>,&nbsp;then the time period of the particle is</p>\r\r<p><br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/D-1_que.png\" style=\"width: 170px; height: 235px;\" /></p>\r", "image": null}, "options": [{"id": "azixF", "text": "<math><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>R</mi></mrow><mrow><mi>g</mi></mrow></mfrac></msqrt><mo>+</mo><msqrt><mfrac><mrow><mn>2</mn><mi>h</mi></mrow><mrow><mi>g</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "rSWI4", "text": "<math><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>R</mi></mrow><mrow><mi>g</mi></mrow></mfrac></msqrt><mo>+</mo><mn>2</mn><msqrt><mfrac><mrow><mi>h</mi></mrow><mrow><mi>g</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "kiomG", "text": "<math><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>R</mi></mrow><mrow><mi>g</mi></mrow></mfrac></msqrt><mo>+</mo><mn>4</mn><msqrt><mfrac><mrow><mn>2</mn><mi>h</mi></mrow><mrow><mi>g</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "ToAPl", "text": "<math><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mn>2</mn><mi>R</mi></mrow><mrow><mi>g</mi></mrow></mfrac></msqrt><mo>+</mo><msqrt><mfrac><mrow><mi>h</mi></mrow><mrow><mi>g</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/D-1_que.png\" style=\"width: 170px; height: 235px;\" /></p><p>The time, the particle takes to go through&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math>&nbsp;is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mi>h</mi></mrow><mi>g</mi></mfrac></msqrt></math>&nbsp;and in one complete oscillation, the particle travels through&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math>&nbsp;four times.</p><p>For the motion of the particle through the tunnel, the force acting on the particle is towards the centre of the earth and it is proportional to the distance of the particle from the centre of the earth. Hence the motion of the particle through the tunnel will be like an SHM.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><mo>-</mo><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><msup><mi>R</mi><mn>3</mn></msup></mfrac><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mo>-</mo><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><msup><mi>R</mi><mn>3</mn></msup></mfrac><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mi>SHM</mi></msub><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><msup><mi>R</mi><mn>3</mn></msup><mrow><mi>G</mi><mi>M</mi></mrow></mfrac></msqrt><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><mi>R</mi><mi>g</mi></mfrac></msqrt></math></p><p>So the time period of the particle is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><msub><mi>T</mi><mi>SHM</mi></msub><mo>+</mo><mn>4</mn><msqrt><mfrac><mrow><mn>2</mn><mi>h</mi></mrow><mi>g</mi></mfrac></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><mi>R</mi><mi>g</mi></mfrac></msqrt><mo>+</mo><mn>4</mn><msqrt><mfrac><mrow><mn>2</mn><mi>h</mi></mrow><mi>g</mi></mfrac></msqrt></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638ce420b6894091a8", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "63", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A body hanging from a massless spring stretches it by <math><mn>3</mn><mi>&nbsp;</mi><mi>cm</mi></math> on earth's surface. At a place <math><mn>800</mn><mi>&nbsp;</mi><mi>km</mi></math> above the earth's surface, the same body will stretch the spring by (Radius of Earth <math><mo>=</mo><mn>6400</mn><mi>&nbsp;</mi><mi>km</mi></math>)", "image": null}, "options": [{"id": "uFMJo", "text": "<math><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>34</mn></mrow><mrow><mn>27</mn></mrow></mfrac></mrow></mfenced><mi>&nbsp;cm</mi></math>", "image": null, "isCorrect": false}, {"id": "kseHv", "text": "<math><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>64</mn></mrow><mrow><mn>27</mn></mrow></mfrac></mrow></mfenced><mi>&nbsp;cm</mi></math>", "image": null, "isCorrect": true}, {"id": "piXzh", "text": "<math><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>27</mn></mrow><mrow><mn>64</mn></mrow></mfrac></mrow></mfenced><mi>&nbsp;cm</mi></math>", "image": null, "isCorrect": false}, {"id": "IswcQ", "text": "<math><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>27</mn></mrow><mrow><mn>34</mn></mrow></mfrac></mrow></mfenced><mi>&nbsp;cm</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Acceleration due to gravity,<br /><br /><math><mi>g</mi><mo>=</mo><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mrow><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>g</mi><mo>∝</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math><br /><br />When the body is hanged on a spring<br /><br /><math><mi>F</mi><mo>=</mo><mo>-</mo><mi>k</mi><mi>x</mi><mo>=</mo><mi>m</mi><mi>g</mi></math> .....(i)<br /><br />Acts on it, where <math><mi>x</mi></math> is extension in spring. Let <math><mn>800</mn><mi>&nbsp;</mi><mi>k</mi><mi>m</mi></math> above the Earth's surface, the stretch in the length of spring is <math><mi>x</mi><mi>′</mi></math> and value of <math><mi>g</mi></math> is <math><mi>g</mi><mi>′</mi></math> .<br /><br /><math><mi>g</mi><mo>=</mo><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mrow><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math> and <math><msup><mrow><mi>g</mi></mrow><mrow><mi>′</mi></mrow></msup><mo>=</mo><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mi>R</mi><mo>+</mo><mi>h</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math><br /><br />So, <math><msup><mrow><mi>g</mi></mrow><mrow><mi>′</mi></mrow></msup><mo>=</mo><mfrac><mrow><mi>g</mi></mrow><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mfrac><mrow><mi>h</mi></mrow><mrow><mi>R</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math> ....(ii)<br /><br />Where, <math><mi>R</mi><mo>=</mo></math> radius of Earth<br /><br />From Equation (i), we get<br /><br /><math><mi>k</mi><mi>x</mi><mo>=</mo><mi>m</mi><mi>g</mi></math> <math><mo>⇒</mo><mi>x</mi><mo>∝</mo><mi>g</mi></math> ......(iii)<br /><br />Therefore, <math><mfrac><mrow><mi>x</mi><mi>′</mi></mrow><mrow><mi>x</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>g</mi><mi>′</mi></mrow><mrow><mi>g</mi></mrow></mfrac></math><br /><br />From Equations (ii) and (iii), we get<br /><br /><math><mfrac><mrow><mi>x</mi><mi>′</mi></mrow><mrow><mi>x</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mfrac><mrow><mi>g</mi></mrow><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mfrac><mrow><mi>h</mi></mrow><mrow><mi>R</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow><mrow><mi>g</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>g</mi></mrow><mrow><mi>g</mi><msup><mrow><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mfrac><mrow><mn>800</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>3</mn></mrow></msup></mrow><mrow><mn>6400</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>3</mn></mrow></msup></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math><br /><br /><math><mo>=</mo><mfrac><mrow><mi>g</mi></mrow><mrow><mi>g</mi><msup><mrow><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>8</mn></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math><br /><br /><math><mo>=</mo><mfrac><mrow><mi>g</mi></mrow><mrow><mi>g</mi><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>9</mn></mrow><mrow><mn>8</mn></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>g</mi><mo>×</mo><mn>64</mn></mrow><mrow><mi>g</mi><mo>×</mo><mn>81</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>64</mn></mrow><mrow><mn>81</mn></mrow></mfrac></math><br /><br /><math><msup><mrow><mi>x</mi></mrow><mrow><mi>′</mi></mrow></msup><mo>=</mo><mfrac><mrow><mn>64</mn></mrow><mrow><mn>81</mn></mrow></mfrac><mi>x</mi></math> <math><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi>x</mi><mo>=</mo><mn>3</mn><mi>&nbsp;</mi><mi>c</mi><mi>m</mi></mrow></mfenced></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><msup><mrow><mi>x</mi></mrow><mrow><mi>′</mi></mrow></msup><mo>=</mo><mfrac><mrow><mn>64</mn></mrow><mrow><mn>81</mn></mrow></mfrac><mo>×</mo><mn>3</mn><mo>=</mo><mfrac><mrow><mn>64</mn></mrow><mrow><mn>27</mn></mrow></mfrac></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><msup><mrow><mi>x</mi></mrow><mrow><mi>′</mi></mrow></msup><mo>=</mo><mfrac><mrow><mn>64</mn></mrow><mrow><mn>27</mn></mrow></mfrac><mi>&nbsp;cm</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86387b0a178f983714b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "104", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The weight of a body on the surface of the earth is<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mn>63</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi></math>. What is the gravitational force on it due to the earth at a height equal to half the radius of earth?", "image": null}, "options": [{"id": "DsM7J", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>28</mn><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi></math><div id=\"gtx-trans\" style > <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>1</mn> <mo>+</mo> <mfrac> <mrow> <msub> <mrow> <mi></mi><mi>R</mi><mo>&#8289;</mo> </mrow> <mrow> <mi></mi><mi>e</mi><mo>&#8289;</mo> </mrow> </msub> <mo>/</mo> <mn>2</mn> </mrow> <mrow> <msub> <mrow> <mi></mi><mi>R</mi><mo>&#8289;</mo> </mrow> <mrow> <mi></mi><mi>e</mi><mo>&#8289;</mo> </mrow> </msub> </mrow> </mfrac> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>=</mo> <mfrac> <mrow> <mtext>g</mtext> </mrow> <mrow> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>1</mn> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>=</mo> <mfrac> <mrow> <mtext>g</mtext> </mrow> <mrow> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>3</mn> <mo>/</mo> <mn>2</mn> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> </mrow> </mfrac> <mo>=</mo><mtext>g'</mtext> <mo>=</mo> <mfrac> <mrow> <mn>4</mn> </mrow> <mrow> <mn>9</mn> </mrow> </mfrac> </mrow> <mtext>&#160;g</mtext> </math> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(i)<br /><br />Weight of the body at earth&#39;s surface<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>w</mi><mo>=</mo><mi>m</mi><mi>g</mi><mo>=</mo><mn>63</mn><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi></math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(ii)<br /><br />Weight of the body at altitude <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><mo>=</mo><mfrac bevelled=\"true\"><msub><mi>R</mi><mi>e< le displaystyle=\"true\"><mn>3</mn><mi>G</mi><msup><mi>M</mi><mn>2</mn></msup></mstyle><mstyle displaystyle=\"true\"><mn>4</mn><mi>&#960;</mi><msup><mi>R</mi><mn>6</mn></msup></mstyle></mfrac><mi>r</mi></mrow></mfenced><mi>d</mi><mi>r</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mo>&#8747;</mo><mi>P</mi><mn>0</mn></msubsup><mi>d</mi><mi>P</mi><mo>=</mo><mo>-</mo><mfrac><mstyle displaystyle=\"true\"><mn>3</mn><mi>G</mi><msup><mi>M</mi><mn>2</mn></msup></mstyle><mstyle displaystyle=\"true\"><mn>4</mn><mi>&#960;</mi><msup><mi>R</mi><mn>6</mn></msup></mstyle></mfrac><msubsup><mo>&#8747;</mo><mn>0</mn><mi>R</mi></msubsup><mi>r</mi><mi>d</mi><mi>r</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mfrac><mstyle displaystyle=\"true\"><mn>3</mn><mi>G</mi><msup><mi>M</mi><mn>2</mn></msup></mstyle><mstyle displaystyle=\"true\"><mn>8</mn><mi>&#960;</mi><msup><mi>R</mi><mn>4</mn></msup></mstyle></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632f56fe899d8564ef", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "15", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A body hanging from a spring stretches it by <math><mi mathvariant=\"normal\"></mi><mn>1&nbsp;</mn><mtext>cm</mtext></math> at the earth's surface. How much will the same body stretch the spring at a place <math><mi mathvariant=\"normal\"></mi><mn>1600&nbsp;</mn><mtext>km</mtext></math> above the earth's surface? (ans in cm) (Radius of earth <math><mi mathvariant=\"normal\"></mi><mo>=</mo><mn>6400&nbsp;</mn><mtext>km</mtext></math> )", "image": null}, "options": [], "correctValue": "0.64", "solution": {"text": "In equilibrium, weight of the body = stretching force<br /><math><mo>∴</mo><mi mathvariant=\"normal\"></mi></math> At the earth's surface, <math><mi mathvariant=\"normal\"></mi><msup><mrow><mtext>mg</mtext></mrow><mrow><mi mathvariant=\"normal\">'</mi></mrow></msup><mo>=</mo><mtext>k</mtext><mo>×</mo><msup><mrow><mtext>x</mtext></mrow><mrow><mi mathvariant=\"normal\">'</mi></mrow></msup></math><br /><math><mo>⇒</mo><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">g</mi></mrow><mrow><mi mathvariant=\"normal\">'</mi></mrow></msup></mrow><mrow><mi mathvariant=\"normal\">g</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mi mathvariant=\"normal\">'</mi></mrow></msup></mrow><mrow><mi mathvariant=\"normal\">x</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><msubsup><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mi mathvariant=\"normal\">e</mi></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><msup><mrow><mo>(</mo><msub><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mi mathvariant=\"normal\">e</mi></mrow></msub><mo>+</mo><mi mathvariant=\"normal\">h</mi><mo>)</mo></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mi mathvariant=\"normal\"></mi></math><br /><math><mo>=</mo><mfrac><mrow><msup><mrow><mo>(</mo><mn>6400</mn><mo>)</mo></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><msup><mrow><mo>(</mo><mn>6400</mn><mo>+</mo><mn>1600</mn><mo>)</mo></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>16</mn></mrow><mrow><mn>25</mn></mrow></mfrac><mi mathvariant=\"normal\"></mi></math><br /><math><mo>⇒</mo><msup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mi mathvariant=\"normal\">'</mi></mrow></msup><mo>=</mo><mfrac><mrow><mn>16</mn></mrow><mrow><mn>25</mn></mrow></mfrac><mo>×</mo><mi mathvariant=\"normal\">x</mi><mo>=</mo><mfrac><mrow><mn>16</mn></mrow><mrow><mn>25</mn></mrow></mfrac><mo>×</mo><mn>1&nbsp;</mn><mtext>cm</mtext><mo>=</mo><mn>0.64&nbsp;</mn><mtext>cm</mtext><mtext></mtext></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86327b477b6de687d35", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "71", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>How many time faster than the present speed would the earth have to rotate about its axis so that the apparent weight of the bodies on the equator becomes zero? (The radius of the earth&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>6</mn><mo>.4</mo><mo>×</mo><msup><mn>10</mn><mn>6</mn></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>)</p>\r", "image": null}, "options": [{"id": "pVOdR", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#160;</mo><mi>times</mi></math>", "image": null, "isCorrect": false}, {"id": "9Tf6T", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mo>&#160;</mo><mi>times</mi></math>", "image": null, "isCorrect": false}, {"id": "Uf0zY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>13</mn><mo>&#160;</mo><mi>times</mi></math>", "image": null, "isCorrect": false}, {"id": "gtspc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>17</mn><mo>&#160;</mo><mi>times</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let  <math><msub><mrow><mi>ω</mi></mrow><mrow><mn>0</mn></mrow></msub></math> be the new angular velocity.<br/><br/>At the equator <math><msub><mrow><mi>g</mi></mrow><mrow><mi>E</mi></mrow></msub><mo>=</mo><mi>g</mi><mo>-</mo><mi>R</mi><msup><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msup></math> <br/><br/>The weight <math><mi>m</mi><msub><mrow><mi>g</mi></mrow><mrow><mi>E</mi></mrow></msub></math> should be zero. <math><msub><mrow><mi>g</mi></mrow><mrow><mi>E</mi></mrow></msub><mo>=</mo><mn>0</mn></math> <br/><br/> <math><mo>∴</mo><mi>R</mi><msubsup><mrow><mi>ω</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>=</mo><mi>g</mi></math> or <math><msub><mrow><mi>ω</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><msqrt><mfrac><mrow><mi>g</mi></mrow><mrow><mi>R</mi></mrow></mfrac></msqrt></math> <br/><br/> <math><mo>∴</mo><msub><mrow><mi>ω</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><msqrt><mfrac><mrow><mn>9.8</mn></mrow><mrow><mn>6.4</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mn>6</mn></mrow></msup></mrow></mfrac></msqrt><mo>=</mo><mn>1.24</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><mfrac><mrow><mi>r</mi><mi>a</mi><mi>d</mi></mrow><mrow><mi>s</mi></mrow></mfrac></math> <br/><br/>The present angular velocity of the earth is <math><mi>ω</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>π</mi></mrow><mrow><mi>T</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mo>×</mo><mn>3.14</mn></mrow><mrow><mn>24</mn><mo>×</mo><mn>60</mn><mo>×</mo><mn>60</mn></mrow></mfrac></math> <br/><br/> <math><mo>∴</mo></math> <math><mi>ω</mi><mo>=</mo><mfrac><mrow><mn>3.14</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow><mrow><mn>12</mn><mo>×</mo><mn>36</mn></mrow></mfrac><mo>=</mo><mn>7.27</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mo>-</mo><mn>5</mn></mrow></msup></math> <br/><br/> <math><mo>∴</mo><mfrac><mrow><msub><mrow><mi>ω</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mi>ω</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1.24</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></mrow><mrow><mn>7.27</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mo>-</mo><mn>5</mn></mrow></msup></mrow></mfrac><mo>=</mo><mn>17</mn></math> <br/><br/> <math><mo>∴</mo><msub><mrow><mi>ω</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mn>17</mn><mi>ω</mi></math> <br/><br/>It should rotate faster by 17 times the present value.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86315052c7a19dd89ab", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "20", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>Two identical blocks of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math> are suspended from a beam balance whose scale pans differ in vertical height by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">h</mi><mfenced><mrow><mo>&#8810;</mo><mi mathvariant=\"normal\">R</mi></mrow></mfenced></math>, If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#961;</mi></math>&nbsp;are the radius and density of the earth, then the error in weighing is</p>\r\r<p><br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image14-c39d1318-b6c6-4ae3-8712-56168c168d0d.jpg\" style=\"width: 210px; height: 134px;\" /></p>\r", "image": null}, "options": [{"id": "MRq3w", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>3</mn></mfrac><msup><mi>πρR</mi><mn>3</mn></msup><mi>Gm</mi></math>", "image": null, "isCorrect": false}, {"id": "uNkey", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>8</mn><mn>3</mn></mfrac><mi>πρGmh</mi></math>", "image": null, "isCorrect": true}, {"id": "binEM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>8</mn><mn>3</mn></mfrac><msup><mi>πρR</mi><mn>3</mn></msup><mi>Gm</mi></math>", "image": null, "isCorrect": false}, {"id": "rQQpD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>3</mn></mfrac><msup><mi>πρGm</mi><mn>2</mn></msup><mi mathvariant=\"normal\">h</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As with height <math><mi mathvariant=\"normal\">g</mi></math> varies as<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image28-1bdd90fe-6681-42cf-bb82-68245ce815b1.jpg\" style=\"width: 210px; height: 175px;\" /><br /><br />and in accord with the figure <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">h</mi><mn>1</mn></msub><mo>&gt;</mo><msub><mi mathvariant=\"normal\">h</mi><mn>2</mn></msub></math> so <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">W</mi><mn>1</mn></msub></math> will be lesser than <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">W</mi><mn>2</mn></msub></math> and<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">W</mi><mn>2</mn></msub><mo>-</mo><msub><mi mathvariant=\"normal\">W</mi><mn>1</mn></msub><mo>=</mo><msub><mi>mg</mi><mn>2</mn></msub><mo>-</mo><msub><mi>mg</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn><mi>mg</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><msub><mi mathvariant=\"normal\">h</mi><mn>1</mn></msub><mi mathvariant=\"normal\">R</mi></mfrac><mo>-</mo><mfrac><msub><mi mathvariant=\"normal\">h</mi><mn>2</mn></msub><mi mathvariant=\"normal\">R</mi></mfrac></mrow></mfenced></math><br /><br />or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">W</mi><mn>2</mn></msub><mo>-</mo><msub><mi mathvariant=\"normal\">W</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">m</mi><mfrac><mi>GM</mi><msup><mi mathvariant=\"normal\">R</mi><mn>2</mn></msup></mfrac><mfrac><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">R</mi></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi>as</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">g</mi><mo>=</mo><mfrac><mi>GM</mi><msup><mi mathvariant=\"normal\">R</mi><mn>2</mn></msup></mfrac><mi mathvariant=\"normal\">&nbsp;</mi><mi>and</mi><mi mathvariant=\"normal\">&nbsp;</mi><mfenced separators=\"|\"><mrow><msub><mi mathvariant=\"normal\">h</mi><mn>1</mn></msub><mo>-</mo><msub><mi mathvariant=\"normal\">h</mi><mn>2</mn></msub></mrow></mfenced><mo>=</mo><mi mathvariant=\"normal\">h</mi></mrow></mfenced></math><br /><br />or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">W</mi><mn>2</mn></msub><mo>-</mo><msub><mi mathvariant=\"normal\">W</mi><mn>1</mn></msub><mo>=</mo><mfrac><mrow><mn>2</mn><mi>mhG</mi></mrow><msup><mi mathvariant=\"normal\">R</mi><mn>3</mn></msup></mfrac><mfenced separators=\"|\"><mrow><mfrac><mn>4</mn><mn>3</mn></mfrac><msup><mi>πR</mi><mn>3</mn></msup><mi mathvariant=\"normal\">ρ</mi></mrow></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>8</mn><mn>3</mn></mfrac><mi mathvariant=\"normal\">&nbsp;</mi><mi>πρGmh</mi><mi mathvariant=\"normal\">&nbsp;</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi>as</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">M</mi><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><msup><mi>πR</mi><mn>3</mn></msup><mi mathvariant=\"normal\">ρ</mi></mrow></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86310ce1abcc0085fd6", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "75", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A spherical uniform planet is rotating about its axis. The velocity of a point on its equator is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi>km</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. Due to the rotation of the planet about its axis, the acceleration due to gravity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi></math> at equator is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac bevelled=\"true\"><mn>1</mn><mn>2</mn></mfrac></math> of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi></math> at poles. What is the escape velocity (in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>km</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>) of a particle on the planet&nbsp;from the pole of the planet?", "image": null}, "options": [], "correctValue": "15", "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>g</mi><mtext>e</mtext></msub><mo>=</mo><msub><mi>g</mi><mtext>p</mtext></msub><mo>-</mo><mi>R</mi><msup><mi mathvariant=\"normal\">&#969;</mi><mn>2</mn></msup><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mo>&#8658;</mo><mspace width=\"0.5em\"></mspace><mfrac><mi>g</mi><mn>2</mn></mfrac><mo>=</mo><mi>g</mi><mo>-</mo><mi>R</mi><msup><mi mathvariant=\"normal\">&#969;</mi><mn>2</mn></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><msup><mi mathvariant=\"normal\">&#969;</mi><mn>2</mn></msup><mo>=</mo><mfrac><mi>g</mi><mn>2</mn></mfrac><mspace width=\"0.5em\"></mspace><mo>&#8658;</mo><msup><mi>R</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">&#969;</mi><mn>2</mn></msup><mo>=</mo><mfrac><mrow><mi>g</mi><mi>R</mi></mrow><mn>2</mn></mfrac><mspace width=\"0.5em\"></mspace><msup><mrow><mo>&#8658;</mo><mo>&#160;</mo><mi>V</mi></mrow><mn>2</mn></msup><mo>=</mo><mfrac><mrow><mi>g</mi><mi>R</mi></mrow><mn>2</mn></mfrac></math> &nbsp;&nbsp;...(1)<br /><br />The escape velocity,<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mtext>e</mtext></msub><mo>=</mo><msqrt><mn>2</mn><mi>g</mi><mi>R</mi></msqrt></math> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(2)<br /><br />From (1) and (2)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mtext>e</mtext></msub><mo>=</mo><msqrt><mn>2</mn><mo>&#215;</mo><mn>2</mn><msup><mi>V</mi><mn>2</mn></msup></msqrt><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mo>&#8658;</mo><mspace width=\"0.5em\"></mspace><msub><mi>V</mi><mtext>e</mtext></msub><mo>=</mo><mn>2</mn><mi>V</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mi>e</mi></msub><mo>=</mo><mn>15</mn><mo>&#160;</mo><mi>km</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630cc0fdfaf29ed9a6", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "55", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Suppose the earth was covered by an ocean of uniform depth h. <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">h</mi><mo>≪</mo><mi mathvariant=\"normal\">R</mi></mrow></mfenced><mo>.</mo><mi mathvariant=\"normal\">&nbsp;</mi></math> let <math><mi mathvariant=\"normal\">σ</mi></math> be density of ocean and <math><mi mathvariant=\"normal\">ρ</mi></math> be mean density of earth. Let <math><mo>∆</mo><mi mathvariant=\"normal\">g</mi></math> be the approximate difference of value of net acceleration due to gravity between the bottom of the ocean and top <math> <mrow> <mi>Δ</mi><mi>g</mi><mo>=</mo><msub> <mi>g</mi> <mrow> <mi>t</mi><mi>o</mi><mi>p</mi></mrow> </msub> <mo>-</mo><msub> <mi>g</mi> <mrow> <mi>b</mi><mi>o</mi><mi>t</mi><mi>t</mi><mi>o</mi><mi>m</mi></mrow> </msub> </mrow> </math> choose the correct option.", "image": null}, "options": [{"id": "X1Gjo", "text": "<math><mo>∆</mo><mi mathvariant=\"normal\">g</mi><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi mathvariant=\"normal\">π</mi><mi mathvariant=\"normal\">G</mi><mi mathvariant=\"normal\">h</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mn>2</mn><mi mathvariant=\"normal\">ρ</mi><mo>-</mo><mn>3</mn><mi mathvariant=\"normal\">σ</mi></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "5M9ly", "text": "<math><mo>∆</mo><mi mathvariant=\"normal\">g</mi><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi mathvariant=\"normal\">G</mi><mi mathvariant=\"normal\">π</mi><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">&nbsp;</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mn>3</mn><mi mathvariant=\"normal\">σ</mi><mo>-</mo><mn>2</mn><mi mathvariant=\"normal\">ρ</mi></mrow></mfenced></math>", "image": null, "isCorrect": true}, {"id": "ivMod", "text": "<math><mo>∆</mo><mi mathvariant=\"normal\">g</mi><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi mathvariant=\"normal\">G</mi><mi mathv </mo><mi mathvariant=\"normal\">h</mi></mrow></mfenced><mn>3</mn></msup><mo>-</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><msup><mi>&#960;R</mi><mn>3</mn></msup><mi mathvariant=\"normal\">&#963;</mi></mrow></mfenced></mrow></mfenced></mrow><msup><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">R</mi><mo>+</mo><mi mathvariant=\"normal\">h</mi></mrow></mfenced><mn>2</mn></msup></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8776;</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><mi mathvariant=\"normal\">G</mi><mi mathvariant=\"normal\">&#960;</mi><mi mathvariant=\"normal\">&#961;</mi><mi mathvariant=\"normal\">R</mi><mfenced open=\"[\" close=\"]\" separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">h</mi></mrow><mi mathvariant=\"normal\">R</mi></mfrac></mrow></mfenced><mo>+</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><mi mathvariant=\"normal\">G</mi><mi mathvariant=\"normal\">&#960;</mi><mfenced open=\"[\" close=\"]\" separators=\"|\"><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">R</mi><mo>+</mo><mi mathvariant=\"normal\">h</mi></mrow></mfenced><mo>-</mo><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">h</mi></mrow><mi mathvariant=\"normal\">R</mi></mfrac></mrow></mfenced><mi mathvariant=\"normal\">R</mi></mrow></mfenced><mi mathvariant=\"normal\">&#963;</mi></math><br /><br /><math><mo>&#8710;</mo><mi mathvariant=\"normal\">g</mi><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">g</mi></mrow><mrow><mi mathvariant=\"normal\">B</mi></mrow></msub><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">g</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow></msub><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi mathvariant=\"normal\">&#960;</mi><mi mathvariant=\"normal\">G</mi><mi mathvariant=\"normal\">h</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mn>3</mn><mi mathvariant=\"normal\">&#963;</mi><mo>-</mo><mn>2</mn><mi mathvariant=\"normal\">&#961;</mi></mrow></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "6aa3ab79aa8dc1ff6817805b", "title": "Gravitational Potential and Potential Energy", "totalQuestions": 32, "questions": [{"_id": "6151e863f842c8ee37826d57", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "66", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The escape velocity for a planet from the surface is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi mathvariant=\"normal\">e</mi></msub></math>. A particle starts from rest at a large distance from the planet, reaches the planet only under gravitational attraction, and passes through a smooth tunnel through its centre. Its speed at the centre of the planet will be", "image": null}, "options": [{"id": "eZDcn", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi mathvariant=\"normal\">e</mi></msub></math><div id=\"gtx-trans\" style=\"position: absolute; left: 70px; top: 41px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div><div id=\"gtx-trans\" style=\"position: absolute; left: 70px; top: 41px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "cFB2P", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>5</mn><msub><mi>v</mi><mi mathvariant=\"normal\">e</mi></msub></math><div id=\"gtx-trans\" style=\"position: absolute; left: 59px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "ktWiW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>1</mn><mtext>.</mtext><mn>5</mn></msqrt><msub><mi>v</mi><mi mathvariant=\"normal\">e</mi></msub></math>", "image": null, "isCorrect": true}, {"id": "Hg2qJ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mi>v</mi><mi mathvariant=\"normal\">e</mi></msub></math><div id=\"gtx-trans\" style=\"position: absolute; left: 59px; top: 41px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Taking the potential at a large distance from the planet as zero, the potential at the centre of the planet <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mfrac><mrow><mn>3</mn><mtext mathvariant=\"italic\">GM</mtext></mrow><mrow><mn>2</mn><mtext mathvariant=\"italic\">R</mtext></mrow></mfrac></math>.<br /><br />&nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mtext mathvariant=\"italic\">mv</mtext><mn>2</mn></msup><mo>=</mo><mtext mathvariant=\"italic\">m</mtext><mfenced open=\"[\" close=\"]\"><mrow><mn>0</mn><mo>-</mo><mfenced><mrow><mo>-</mo><mfrac><mrow><mn>3</mn><mtext mathvariant=\"italic\">GM</mtext></mrow><mrow><mn>2</mn><mtext mathvariant=\"italic\">R</mtext></mrow></mfrac></mrow></mfenced></mrow></mfenced></math><br /><br />or&nbsp;&nbsp;&nbsp;&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mtext mathvariant=\"italic\">v</mtext><mn>2</mn></msup><mo>=</mo><mfrac><mrow><mn>3</mn><mtext mathvariant=\"italic\">GM</mtext></mrow><mrow><mn>2</mn><mtext mathvariant=\"italic\">R</mtext></mrow></mfrac><mo>=</mo><mn>3</mn><mtext mathvariant=\"italic\">Rg</mtext></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo mathvariant=\"italic\">&#8658;</mo><mo mathvariant=\"italic\">&#160;</mo><msup><mi>v</mi><mn mathvariant=\"italic\">2</mn></msup><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mfenced><mrow><mn>2</mn><mtext mathvariant=\"italic\">RG</mtext></mrow></mfenced><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><msubsup><mtext mathvariant=\"italic\">v</mtext><mtext>e</mtext><mn>2</mn></msubsup><mtext mathvariant=\"italic\">&#160;&#160;&#160;&#160;&#160;</mtext><mfenced><mrow><mo mathvariant=\"italic\">&#8757;</mo><mo mathvariant=\"italic\">&#160;</mo><msub><mi>v</mi><mi>e</mi></msub><mo mathvariant=\"italic\">=</mo><msqrt><mn>2</mn><mi>R</mi><mi>G</mi></msqrt></mrow></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>v</mi><mo>=</mo><msqrt><mn>1</mn><mtext>.</mtext><mn>5</mn></msqrt><msub><mi>v</mi><mi>e</mi></msub></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e584748c5b506023", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "31", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A body is projected upwards with a velocity of <math><msup><mrow><mn>4</mn><mo>×</mo><mn>11.2</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">m&nbsp;</mi><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> from the surface of the earth. The velocity of the body when it escapes from the gravitational pull of earth will be", "image": null}, "options": [{"id": "e5fdj", "text": "<math><msup><mrow><mn>11.2</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">m&nbsp;</mi><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "hTpDn", "text": "<math><msup><mrow><mn>2</mn><mo>×</mo><mn>11.2</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">m&nbsp;</mi><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "wli6e", "text": "<math><msup><mrow><mn>3</mn><mo>×</mo><mn>11.2</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">m&nbsp;</mi><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "auYTV", "text": "<math><msqrt><mn>15</mn></msqrt><mo>×</mo><mn>11.2</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">m&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The minimum velocity of projection to achieve escape velocity can be calculated as,<br /><br />Initial  <math><mi>KE</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mi>mv</mi><mn>2</mn></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>×</mo><mi mathvariant=\"normal\">m</mi><msup><mfenced separators=\"|\"><mrow><mn>4</mn><mo>×</mo><mn>11</mn><mo>.2</mo></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>16</mn><mo>×</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msubsup><mi>mv</mi><mi mathvariant=\"normal\">e</mi><mn>2</mn></msubsup></math><br /><br />As <math><mo>&nbsp;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msubsup><mi>mv</mi><mi mathvariant=\"normal\">e</mi><mn>2</mn></msubsup><mi mathvariant=\"normal\">&nbsp;</mi></math>&nbsp; energy is used up in coming out from the gravitational pull of the earth, so <br /><br />Final   <math><mi mathvariant=\"normal\">&nbsp;</mi><mi>KE</mi><mi mathvariant=\"normal\">&nbsp;</mi></math> should be <math><mi mathvariant=\"normal\">&nbsp;</mi><mn>15</mn><mo>×</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msubsup><mi>mv</mi><mi mathvariant=\"normal\">e</mi><mn>2</mn></msubsup></math><br /><br />Hence, &nbsp;<math ><mfrac><mn>1</mn><mn>2</mn></mfrac><mi mathvariant=\"normal\">m</mi><msup><mfenced><msup><mi mathvariant=\"normal\">v</mi><mo>'</mo></msup></mfenced><mn>2</mn></msup><mo>=</mo><mn>15</mn><mo>×</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msubsup><mi>mv</mi><mi mathvariant=\"normal\">e</mi><mn>2</mn></msubsup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><msup><mi mathvariant=\"normal\">v</mi><mrow><mi mathvariant=\"normal\">′</mi><mn>2</mn></mrow></msup><mo>=</mo><mn>15</mn><msubsup><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">e</mi><mn>2</mn></msubsup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>or</mi><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><msup><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">′</mi></msup><mo>=</mo><msqrt><mn>15</mn></msqrt><msub><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">e</mi></msub></math><br /><br /><math ><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mo>=</mo><msqrt><mn>15</mn></msqrt><mo>×</mo><mn>11</mn><mo>.2</mo><mo>&nbsp;</mo><mi>km</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e3d4aaa318c693dd", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "16", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two large spherical objects of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> each (uniformly distributed) are fixed as shown in figure. A small point mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> is projected from point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> heading towards center <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>2</mn></msub></math> of second sphere. The minimum velocity of point mass so that it can reach upto second object at point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> is <math><mfrac><mrow><mi>n</mi></mrow><mrow><mn>3</mn></mrow></mfrac><msqrt><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mrow><mn>5</mn><mi>R</mi></mrow></mfrac></msqrt></math>.&nbsp;Then calculate <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>. [Neglect other gravitational forces]<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/hilrwaqvpnvtarzsggmwtyerixtjkwfrrflihroadhcxsmwbeo.jpeg\" />", "image": null}, "options": [], "correctValue": "08.00", "solution": {"text": "<p>If the ball can reach the mid point of line connecting spheres, then it will get attracted towards B. (At midpoint gravitational intensity is zero)<br />Using energy conservation,<br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>m</mi><msubsup><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>-</mo><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><mrow><mi>R</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><mrow><mn>9</mn><mi>R</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mn>2</mn><mfrac><mrow><mi>G</mi><mi>M</mi><mi>m</mi></mrow><mrow><mn>5</mn><mi>R</mi></mrow></mfrac><mo>+</mo><mn>0</mn></math><br />Solving, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>0</mn></msub><mo>=</mo><mfrac><mn>8</mn><mn>3</mn></mfrac><msqrt><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mrow><mn>5</mn><mi>R</mi></mrow></mfrac></msqrt></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>n</mi><mo>=</mo><mn>8</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e376245ad2347525", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "89", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A body is projected up with a velocity equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced separators=\"|\"><mrow><mn>3</mn><mo>/</mo><mn>4</mn></mrow></mfenced><mi>th</mi></msup></math>&nbsp;of the escape velocity from the surface of the earth. The height it reaches is, (Radius of earth <math><mo>=</mo><mi mathvariant=\"normal\">R</mi></math>)", "image": null}, "options": [{"id": "VvR7Q", "text": "<math><mfrac><mrow><mn>10</mn><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>9</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "juQv4", "text": "<math><mfrac><mrow><mn>9</mn></mrow><mrow><mn>7</mn></mrow></mfrac><mi mathvariant=\"normal\">R</mi></math>", "image": null, "isCorrect": true}, {"id": "7xRqq", "text": "<math><mfrac><mrow><mn>9</mn></mrow><mrow><mn>8</mn></mrow></mfrac><mi mathvariant=\"normal\">R</mi></math>", "image": null, "isCorrect": false}, {"id": "seVN3", "text": "<math><mfrac><mrow><mn>10</mn><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Escape velocity for the earth is<br /><br /><math><msub><mrow><mi mathvariant=\"normal\">v</mi></mrow><mrow><mi mathvariant=\"normal\">e</mi></mrow></msub><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">G</mi><mi mathvariant=\"normal\">M</mi></mrow><mrow><mi mathvariant=\"normal\">R</mi></mrow></mfrac></msqrt></math><br /><br />Given the velocity projection of the body<br /><br /><math><mo>=</mo><mi mathvariant=\"normal\">v</mi><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac><msub><mrow><mi mathvariant=\"normal\">v</mi></mrow><mrow><mi mathvariant=\"normal\">e</mi></mrow></msub><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mi mathvariant=\"normal\">&nbsp;</mi><msqrt><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">G</mi><mi mathvariant=\"normal\">M</mi></mrow><mrow><mi mathvariant=\"normal\">R</mi></mrow></mfrac></msqrt></math><br /><br />Total energy on the earth<br /><br /><math><mo>=</mo><mi mathvariant=\"normal\">T</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">rg</mi><mi mathvariant=\"normal\">y</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">x</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">h</mi></math><br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><msup><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">v</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mfenced separators=\"|\"><mrow><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">G</mi><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">m</mi></mrow><mrow><mi mathvariant=\"normal\">R</mi></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>0</mn><mo>+</mo><mfenced separators=\"|\"><mrow><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">G</mi><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">m</mi></mrow><mrow><mi mathvariant=\"normal\">R</mi><mo>+</mo><mi mathvariant=\"normal\">h</mi></mrow></mfrac></mrow></mfenced></math><br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>.</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><mn>9</mn></mrow><mrow><mn>16</mn></mrow></mfrac><mo>.</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">G</mi><mi mathvariant=\"normal\">M</mi></mrow><mrow><mi mathvariant=\"normal\">R</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">G</mi><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">m</mi></mrow><mrow><mi mathvariant=\"normal\">R</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">G</mi><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">m</mi></mrow><mrow><mi mathvariant=\"normal\">R</mi><mo>+</mo><mi mathvariant=\"normal\">h</mi></mrow></mfrac></math><br /><br /><math><mfrac><mrow><mn>9</mn></mrow><mrow><mn>16</mn></mrow></mfrac><mo>-</mo><mn>1</mn><mo>=</mo><mo>-</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mi mathvariant=\"normal\">R</mi><mo>+</mo><mi mathvariant=\"normal\">h</mi></mrow></mfrac></math> or <math><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mi mathvariant=\"normal\">R</mi><mo>+</mo><mi mathvariant=\"normal\">h</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mo>-</mo><mn>7</mn></mrow><mrow><mn>16</mn></mrow></mfrac></math><br /><br /><math><mn>7</mn><mi mathvariant=\"normal\">R</mi><mo>+</mo><mn>7</mn><mi mathvariant=\"normal\">h</mi><mo>=</mo><mn>16</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">R</mi></math><br /><br /><math><mn>7</mn><mi mathvariant=\"normal\">h</mi><mo>=</mo><mn>9</mn><mi mathvariant=\"normal\">R</mi><mo>⇒</mo><mi mathvariant=\"normal\">h</mi><mo>=</mo><mfrac><mrow><mn>9</mn></mrow><mrow><mn>7</mn></mrow></mfrac><mi mathvariant=\"normal\">R</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863dfa2cc5638fe3169", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "07", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two particles are projected vertically upwards from the surface of the earth with velocities <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>1</mn></msub><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mi>g</mi><mi>R</mi></mrow><mn>3</mn></mfrac></msqr uestionLabels": [{"title": "NTA Abhyas Paper", "value": "35", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A satellite of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math> is orbiting the earth in a circular orbit at a height <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">R</mi></math> above earth surface where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> is the radius of the earth. If it starts losing energy at a constant rate <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#946;</mi><mo>,</mo></math> then it will fall on the earth surface after the time <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">t</mi><mo>=</mo><mfrac><mi>GMm</mi><mi>n&#946;R</mi></mfrac><mo>.</mo></math>&nbsp;Assuming that the satellite is approximately in a circular orbit at all times, find the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">n</mi><mo>.</mo></math>", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">E</mi><mi mathvariant=\"normal\">i</mi></msub><mo>=</mo><mo>-</mo><mfrac><mi>GMm</mi><mrow><mn>2</mn><mfenced separators=\"|\"><mrow><mn>3</mn><mi mathvariant=\"normal\">R</mi></mrow></mfenced></mrow></mfrac><mo>,</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">E</mi><mi mathvariant=\"normal\">f</mi></msub><mo>=</mo><mo>-</mo><mfrac><mi>GMm</mi><mrow><mn>2</mn><mfenced separators=\"|\"><mi mathvariant=\"normal\">R</mi></mfenced></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi mathvariant=\"normal\">&#160;</mi><mi>&#946;t</mi><mo>=</mo><mfrac><mi>GMm</mi><mi mathvariant=\"normal\">R</mi></mfrac><mfenced open=\"[\" close=\"]\" separators=\"|\"><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#8211;</mo><mfrac><mn>1</mn><mn>6</mn></mfrac></mrow></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#946;t</mi><mo>=</mo><mfrac><mi>GMm</mi><mrow><mn>3</mn><mi mathvariant=\"normal\">R</mi></mrow></mfrac><mo>&#160;</mo><mo>&#8658;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">t</mi><mo>=</mo><mfrac><mi>GMm</mi><mrow><mn>3</mn><mi>&#946;R</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639b12e7f7f1c06a77", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "53", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Consider two identical rings of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math>&nbsp;and radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;fixed on a horizontal axis in a gravity-free space. A particle of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m&nbsp;</mi></math>is held at rest at the centre of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>1</mn><mi>st</mi></msup></math>&nbsp; ring and projected along the axis towards <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>2</mn><mi>nd</mi></msup></math>&nbsp; ring. The minimum speed of projection so that the particle reaches the centre of&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>2</mn><mi>nd</mi></msup></math>&nbsp; ring is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0023836_Question_1..jpg\" style=\"width: 309px; height: 217px;\" />", "image": null}, "options": [{"id": "u1OfD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mi>R</mi></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "vSmTn", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mrow><mn>2</mn><mi>G</mi><mi>M</mi></mrow><mi>R</mi></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "gkuBh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mrow><mn>2</mn><mi>G</mi><mi>M</mi></mrow><mi>R</mi></mfrac><mfenced><mrow><mn>1</mn><mo>+</mo><mfrac><mn>1</mn><msqrt><mn>5</mn></msqrt></mfrac><mo>-</mo><msqrt><mn>2</mn></msqrt></mrow></mfenced></msqrt></math>", "image": null, "isCorrect": true}, {"id": "x1Tt7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mtext mathvariant=\"italic\">GM</mtext><mtext mathvariant=\"italic\">R</mtext></mfrac><mfenced><mrow><mn>1</mn><mo>+</mo><msqrt><mn>5</mn></msqrt><mo>-</mo><mfrac><mn>1</mn><msqrt><mn>2</mn></msqrt></mfrac></mrow></mfenced></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The particle should be projected such that it can reach halfway because after midpoint it will move under the attraction of 2<sup>nd</sup> ring and will reach the center of the ring.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>PE</mi><mi mathvariant=\"normal\">i</mi></msub><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><msub><mi>KE</mi><mi mathvariant=\"normal\">i</mi></msub><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><msub><mi>KE</mi><mi mathvariant=\"normal\">f</mi></msub><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><msub><mi>PE</mi><mi mathvariant=\"normal\">f</mi></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\" "http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi>kg</mi></math> when it is taken from the origin to a point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>7</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>,</mo><mo>&nbsp;</mo><mo>-</mo><mn>3</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></mrow></mfenced></math> is", "image": null}, "options": [{"id": "HTPr0", "text": "<math> <mrow> <mn>71</mn><mtext> </mtext><mtext> </mtext><mtext>J</mtext></mrow> </math>", "image": null, "isCorrect": false}, {"id": "9TZGy", "text": "<math><mrow>  <mn>1</mn>  <mn>3</mn>  <msqrt>    <mn>5</mn>    <mn>8</mn>  </msqrt>  <mtext>&nbsp;J</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "qp1Qm", "text": "<math> <mrow> <mn>2</mn><mtext> </mtext><mtext> </mtext><mtext>J</mtext></mrow> </math>", "image": null, "isCorrect": true}, {"id": "vViiZ", "text": "<math> <mrow>  <mn>1</mn><mtext>&#x2009;</mtext><mtext>&#x2009;</mtext><mtext>J</mtext></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi><mi>V</mi><mo>=</mo><mo>-</mo><mover><mi>E</mi><mo>→</mo></mover><mo>.</mo><mover><mrow><mi>d</mi><mi>r</mi></mrow><mo>→</mo></mover></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mo>∆</mo><mi>V</mi><mo>=</mo><mo>-</mo><mover><mi>E</mi><mo>→</mo></mover><mo>.</mo><mo>∆</mo><mover><mi>r</mi><mo>→</mo></mover></math><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mfenced><mrow><mn>5</mn><mover><mtext>i</mtext><mo>^</mo></mover><mo>+</mo><mn>1</mn><mn>2</mn><mover><mtext>j</mtext><mo>^</mo></mover></mrow></mfenced><mo>·</mo><mfenced><mrow><mn>7</mn><mover><mtext>i</mtext><mo>^</mo></mover><mo>-</mo><mn>3</mn><mover><mtext>j</mtext><mo>^</mo></mover></mrow></mfenced></math><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp /mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">t</mi></mrow></mfenced></math><br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/P_45_Ques.jpg\" style=\"width: 196px; height: 189px;\" />\r<p>&nbsp;</p>\r", "image": null}, "options": [{"id": "D5cCU", "text": "<math><mfrac><mrow><mo>-</mo><mn>2</mn><mi>G</mi><mi>M</mi></mrow><mrow><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "FiGL6", "text": "<math><mfrac><mrow><mo>-</mo><mi>G</mi><mi>M</mi></mrow><mrow><mn>2</mn><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "JAEJW", "text": "<math><mfrac><mrow><mo>-</mo><mi>G</mi><mi>M</mi></mrow><mrow><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "u2ER8", "text": "<math><mfrac><mrow><mo>-</mo><mn>2</mn><mi>G</mi><mi>M</mi></mrow><mrow><mn>3</mn><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "By superposition principle,\n\\(\\mathrm{v}_{1}=\\frac{-\\mathrm{GM}}{2 \\mathrm{R}^{3}}\\left[3 \\mathrm{R}^{2}-\\left(\\frac{\\mathrm{R}}{2}\\right)^{2}\\right]\\)\n\\(=-\\frac{11 \\mathrm{GM}}{8 \\mathrm{R}^{3}}\\)\nAlso, \\(\\mathrm{v}_{2}=-\\frac{3}{2} \\frac{\\mathrm{G}(\\mathrm{M} / 8)}{(\\mathrm{R} / 2)}=\\frac{-3 \\mathrm{GM}}{8 \\mathrm{R}}\\)\nThe required potential is, \\(\\mathrm{v}=\\mathrm{v}_{1}-\\mathrm{v}_{2}\\)\n\\(\\begin{array}{l}\n=-\\frac{11 \\mathrm{GM}}{8 \\mathrm{R}}-\\left(-\\frac{3 \\mathrm{GM}}{8 \\mathrm{R}}\\right) \\\\\n\\mathrm{V}=-\\frac{\\mathrm{GM}}{\\mathrm{R}}\n\\end{array}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86340c9da83e0234d85", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "37", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An artificial satellite is moving in a circular orbit around the earth, with a speed equal to half the magnitude of escape velocity from the Earth. The height of satellite above the surface of earth is (where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;is the radius of the Earth)", "image": null}, "options": [{"id": "htK1Y", "text": "<math><mi>R</mi></math>", "image": null, "isCorrect": true}, {"id": "cHCPz", "text": "<math><mn>2</mn><mi>R</mi></math>", "image": null, "isCorrect": false}, {"id": "qdCRi", "text": "<math><mn>3</mn><mi>R</mi></math>", "image": null, "isCorrect": false}, {"id": "DW40x", "text": "<math><mn>4</mn><mi >R</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><msqrt><mfrac><mrow><mn>2</mn><mi>G</mi><mi>M</mi></mrow><mrow><mi>R</mi></mrow></mfrac></msqrt><mo>=</mo><msqrt><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mrow><mi>R</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>+</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi>h</mi></mrow></mfrac></msqrt></math><br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mo>×</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><mn>2</mn><mi>G</mi><mi>M</mi></mrow><mrow><mi>R</mi></mrow></mfrac><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mrow><mi>R</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>+</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi>h</mi></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>R</mi><mi>&nbsp;</mi><mo>=</mo><mi>&nbsp;</mi><mi>R</mi><mi>&nbsp;</mi><mo>+</mo><mi>&nbsp;</mi><mi>h</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><mi>&nbsp;</mi><mo>=</mo><mi>&nbsp;</mi><mi>R</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863332e09d474cf4910", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "14", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A satellite is revolving in a circular orbit at a height <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math> from the earth's surface, such that <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><mo>≪</mo><mi>R</mi></math> where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;is the radius of the earth. Assuming that the effect of the earth's atmosphere can be neglected. What should be the minimum change required in the speed so that the satellite could escape from the gravitational field of earth?", "image": null}, "options": [{"id": "1omzx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msqrt><mn>2</mn></msqrt><mo>-</mo><mn>1</mn></mrow></mfenced><msqrt><mi>g</mi><mi>R</mi></msqrt></math>", "image": null, "isCorrect": true}, {"id": "W37qH", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>9</mn><msqrt><mi>g</mi><mi>R</mi></msqrt></mrow><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "zSGfY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>2</mn><mi>g</mi><mi>R</mi></msqrt></math>", "image": null, "isCorrect": false}, {"id": "E1MhF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mi>g</mi><mi>R</mi></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Orbital velocity&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>0</mn></msub><mo>=</mo><msqrt><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mrow><mo>(</mo><mi>R</mi><mo>+</mo><mi>h</mi><mo>)</mo></mrow></mfrac></msqrt></math></p><p>Velocity required to escape the gravitational field,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>s</mi></msub><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mi>G</mi><mi>M</mi></mrow><mrow><mo>(</mo><mi>R</mi><mo>+</mo><mi>h</mi><mo>)</mo></mrow></mfrac></msqrt></math></p><p>Change in velocity&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mi>GM</mi></mrow><mrow><mo>(</mo><mi mathvariant=\"normal\">R</mi><mo>+</mo><mi mathvariant=\"normal\">h</mi><mo>)</mo></mrow></mfrac></msqrt><mo>-</mo><msqrt><mfrac><mi>GM</mi><mrow><mo>(</mo><mi mathvariant=\"normal\">R</mi><mo>+</mo><mi mathvariant=\"normal\">h</mi><mo>)</mo></mrow></mfrac></msqrt></math></p><p>If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><mo>&#60;</mo><mo>&#60;</mo><mi>R</mi></math>,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>v</mi><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mi>G</mi><mi>M</mi></mrow><mi>R</mi></mfrac></msqrt><mo>-</mo><msqrt><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mi>R</mi></mfrac></msqrt></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>v</mi><mo>=</mo><msqrt><mn>2</mn><mi>g</mi><mi>R</mi></msqrt><mo>-</mo><msqrt><mi>g</mi><mi>R</mi></msqrt></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631c14280cdeab9d86", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "42", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A stationary object is released from a point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> a distance <math><mn>3</mn><mi>R</mi></math> from the centre of the moon which has radius <math><mi>R</mi></math> and mass <math><mi>M</mi></math>. Which one of the following expressions gives the speed of the object on hitting the moon?", "image": null}, "options": [{"id": "ZBYN9", "text": "<math><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>2</mn><mi>G</mi><mi>M</mi></mrow><mrow><mn>3</mn><mi>R</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "kCA13", "text": "<math><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>4</mn><mi>G</mi><mi>M</mi></mrow><mrow><mn>3</mn><mi>R</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "iMeON", "text": "<math><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>2</mn><mi>G</mi><mi>M</mi></mrow><mrow><mi>R</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "cK28F", "text": "<math><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mrow><mi>R</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the law of conservation of energy,<br /><br /><math><mo>-</mo><mfrac><mrow><mi>G</mi><mi>m</mi><mi>M</mi></mrow><mrow><mn>3</mn><mi>R</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>m</mi><msubsup><mrow><mi>v</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mo>-</mo><mfrac><mrow><mi>G</mi><mi>m</mi><mi>M</mi></mrow><mrow><mi>R</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>m</mi><msubsup><mrow><mi>v</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><br />Where <math><mi>m</mi></math> is the mass of the object, <math><msub><mrow><mi>v</mi></mrow><mrow><mn>0</mn></mrow></msub></math> and <math><msub><mrow><mi>v</mi></mrow><mrow><mn>1</mn></mrow></msub></math>&nbsp;are the initial and final velocities of object, respectively.<br /><br />The object is stationary i.e., <math><msub><mrow><mi>v</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mn>0</mn><mo>.</mo></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mo>-</mo><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mrow><mn>3</mn><mi>R</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mrow><mi>R</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><msubsup><mrow><mi>v</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><msubsup><mrow><mi>v</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>G</mi><mi>M</mi></mrow><mrow><mn>3</mn><mi>R</mi></mrow></mfrac></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>v</mi></mrow><mrow><mn>1</mn></mro
