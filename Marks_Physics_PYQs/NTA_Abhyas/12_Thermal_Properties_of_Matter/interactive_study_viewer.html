i mathvariant=\"normal\">C</mi></math>. If the length of the rod is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi></math> at temperature <math><msup><mrow><mn>0</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mi mathvariant=\"normal\">C</mi></math>, then the temperature at which the length will be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>l</mi></math> is [Given,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ln</mi><mfenced><mn>2</mn></mfenced><mo>=</mo><mn>0</mn><mo>.</mo><mn>693</mn></math>]", "image": null}, "options": [{"id": "ti0n2", "text": "<math><msup><mrow><mn>12&nbsp;</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mi mathvariant=\"normal\">C&nbsp;</mi></math>", "image": null, "isCorrect": false}, {"id": "NLQ3M", "text": "<math><msup><mrow><mn>20&nbsp;</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}, {"id": "M34Wq", "text": "<math><msup><mrow><mn>200&nbsp;</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": true}, {"id": "RgN1U", "text": "<math><msup><mrow><mn>100&nbsp;</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">d</mi><mi>l</mi><mo>=</mo><mi>α</mi><mi>l</mi><mi>d</mi><mi mathvariant=\"normal\">T</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><munderover><mo>∫</mo><mi>l</mi><mrow><mn>2</mn><mi>l</mi></mrow></munderover><mfrac><mrow><mi mathvariant=\"normal\">d</mi><mi>l</mi></mrow><mi>l</mi></mfrac><mo>=</mo><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">&nbsp;</mi><munderover><mo>∫</mo><mn>0</mn><mi mathvariant=\"normal\">T</mi></munderover><mi mathvariant=\"normal\">T</mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">T</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ln</mi><mn>2</mn><mo>=</mo><mi mathvariant=\"normal\">a</mi><mfrac><msup><mi mathvariant=\"normal\">T</mi><mn>2</mn></msup><mn>2</mn></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mi mathvariant=\"normal\">T</mi><mo>=</mo><msup><mfenced close=\"]\" open=\"[\" separators=\"|\"><mfrac><mrow><mi>ln</mi><mn>4</mn></mrow><mi mathvariant=\"normal\">a</mi></mfrac></mfenced><mfrac><mn>1</mn><mn>2</mn></mfrac></msup><mo>=</mo><msup><mfenced close=\"]\" open=\"[\" separators=\"|\"><mfrac><mrow><mn>2</mn><mo>×</mo><mn>0.693</mn></mrow><mrow><mn>3.465</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup></mrow></mfrac></mfenced><mfrac><mn>1</mn><mn>2</mn></mfrac></msup><mo>=</mo><msqrt><mfrac><mn>2</mn><mn>5</mn></mfrac><mo>×</mo><msup><mn>10</mn><mn>5</mn></msup></msqrt><mo>=</mo><msup><mn>200&nbsp;</mn><mi mathvariant=\"normal\">o</mi></msup><mi mathvariant=\"normal\">C</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630a3fe9cbc6c9e979", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "84", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An ideal gas is expanding such that <math><mi>p</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msup></math>= constant. The coefficient of volume expansion of the gas is", "image": null}, "options": [{"id": "0XSIv", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mi>T</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "xoxSW", "text": "<math><mfrac><mrow><mn>2</mn></mrow><mrow><mi>T</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "YjVgp", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mi>T</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "SzIZO", "text": "<math><mfrac><mrow><mn>4</mn></mrow><mrow><mi>T</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, <math><mi>p</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msup></math> = constant<br /><br /><math><mo>&there4;</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>n</mi><mi>R</mi><mi>T</mi></mrow><mrow><mi>V</mi></mrow></mfrac></mrow></mfenced><msup><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo></math>constant<br /><br />or <math><msup><mrow><mi>T</mi></mrow><mrow><mn>3</mn></mrow></msup><msup><mrow><mi>V</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo></math> constant<br /><br />Differentiating the equation, we get<br /><br /><math><mfrac><mrow><mn>3</mn><msup><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>V</mi></mrow></mfrac><mo>.</mo><mi>d</mi><mi>T</mi><mo>-</mo><mfrac><mrow><msup><mrow><mi>T</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow><mrow><msup><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>.</mo><mi>d</mi><mi>V</mi><mo>=</mo><mn>0</mn></math><br /><br />or <math><mn>3</mn><mo>.</mo><mi>d</mi><mi>T</mi><mo>=</mo><mfrac><mrow><mi>T</mi></mrow><mrow><mi>V</mi></mrow></mfrac><mo>.</mo><mi>d</mi><mi>V</mi></math><br /><br />From the equation, <math><mi>d</mi><mi>V</mi><mo>=</mo><mrow><mi>V</mi></mrow><mrow><mi>&gamma;</mi></mrow><mo></mo><mi>d</mi><mi>T</mi></math><br /><br /><math><mi mathvariant=\"normal\">&gamma;</mi><mo>=</mo></math> coefficient of volume expansion of gas<br /><br /><math><mo>=</mo></math> <math><mfrac><mrow><mi>d</mi><mi>V</mi></mrow><mrow><mi>V</mi><mo>.</mo><mi>d</mi><mi>T</mi></mrow></mfrac></math><br /><br /><math><mo>&there4;</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi mathvariant=\"normal\">&gamma;</mi><mo>=</mo><mfrac><mrow><mi>d</mi><mi>V</mi></mrow><mrow><mi>V</mi><mo>.</mo><mi>d</mi><mi>T</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mi>T</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86308965e6c3ae94ded", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "35", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A metal rod having linear expansion coefficient <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>&nbsp;</mo><mo>°</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> has a length of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. The temperature at which it is shortened by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi>mm</mi></math> is", "image": null}, "options": [{"id": "Wy2s6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>20</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}, {"id": "vaB56", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>15</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}, {"id": "7SBeS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>30</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": true}, {"id": "6ea6z", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>25</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">l</mi><mn>2</mn></msub><mo>=</mo><msub><mi mathvariant=\"normal\">l</mi><mn>1</mn></msub><mfenced open=\"[\" close=\"]\" separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mi mathvariant=\"normal\">&#945;</mi><mfenced separators=\"|\"><mrow><msub><mi mathvariant=\"normal\">t</mi><mn>2</mn></msub><mo>-</mo><msub><mi mathvariant=\"normal\">t</mi><mn>1</mn></msub></mrow></mfenced></mrow></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">t</mi><mn>2</mn></msub><mo>=</mo><msub><mi mathvariant=\"normal\">t</mi><mn>1</mn></msub><mo>+</mo><mfrac><mrow><msub><mi mathvariant=\"normal\">l</mi><mn>2</mn></msub><mo>-</mo><msub><mi mathvariant=\"normal\">l</mi><mn>1</mn></msub></mrow><mrow><msub><mi mathvariant=\"normal\">l</mi><mn>1</mn></msub><mi mathvariant=\"normal\">&#945;</mi></mrow></mfrac></math><br /><br />= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>+</mo><mfrac><mrow><mo>-</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup></mrow><mrow><mn>1</mn><mo>.0</mo><mo>&#215;</mo><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup></mrow></mfrac><mo>=</mo><mo>-</mo><mn>30</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "6aa3ab79aa8dc1ff681780a7", "title": "Calorimetry", "totalQuestions": 20, "questions": [{"_id": "6151e863fb4e4b911110fb3e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "17", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A heating curve has been plotted for a solid object as shown in the figure. If the mass of the object is <math><mn>100&nbsp;</mn><mi mathvariant=\"normal\">g</mi></math>, then latent heat of vapourisation for the material of the object is [Given, power supplied to the object is constant and equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi>kW</mi></math>]<br />\r<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/D-4_Ques.png\" style=\"width: 250px; height: 113px;\" />", "image": null}, "options": [{"id": "vgWzX", "text": "<math><mn>1.5</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>6&nbsp;</mn></mrow></msup><mrow><mrow><mi mathvariant=\"normal\">J</mi></mrow><mo>/</mo><mrow><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "WUmbY", "text": "<math><mn>2.5</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>6&nbsp;</mn></mrow></msup><mrow><mrow><mi mathvariant=\"normal\">J</mi></mrow><mo>/</mo><mrow><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "6Xq1m", "text": "<math><mn>3.5</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>6</mn></mrow></msup><mi> </mi><mrow><mrow><mi mathvariant=\"normal\">J</mi></mrow><mo>/</mo><mrow><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "DzzTX", "text": "<math><mn>9.0</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>6&nbsp;</mn></mrow></msup><mrow><mrow><mi mathvariant=\"normal\">J</mi></mrow><mo>/</mo><mrow><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi></mrow></mrow></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>The total heat supplied to the block is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mo>&#8747;</mo><mn>1600</mn><mn>2500</mn></msubsup><mi>p</mi><mi>d</mi><mi>t</mi><mo>=</mo><mi>m</mi><msub><mi>L</mi><mi mathvariant=\"normal\">v</mi></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1000</mn><mo>&#215;</mo><mfenced><mrow><mn>2500</mn><mo>-</mo><mn>1600</mn></mrow></mfenced><mo>=</mo><mn>0</mn><mo>.</mo><mn>1</mn><msub><mi>L</mi><mi mathvariant=\"normal\">v</mi></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mi mathvariant=\"normal\">v</mi></msub><mo>=</mo><mn>9.0</mn><mo>&#215;</mo><msup><mn>10</mn><mn>6&#160;</mn></msup><mi mathvariant=\"normal\">J</mi><mo>/</mo><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863fa2dd96083435a6a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "71", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">g</mi></math> of water at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">g</mi></math> of ice at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>20</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> are mixed together in a calorimeter. Find the final temperature of the mixture. Assume water equivalent of calorimeter to be negligible, specific heats of ice and water are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>5</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi>cal</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">g</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&nbsp;</mo><mo>°</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>, and latent heat of ice is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>80</mn><mo>&nbsp;</mo><mi>cal</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">g</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>.", "image": null}, "options": [{"id": "9bgKu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 39px; top: 41px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "ZPZiM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 39px; top: 41px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "xWxw9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>30</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}, {"id": "K0EOr", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#62;</mo><mo>&#160;</mo><mn>10</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 117px; top: 41px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here ice will absorb heat while hot water will release it.<br />So if&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> is the final temperature of the mixture, heat given by water<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Q</mi><mn>1</mn></msub><mo>=</mo><mi>m</mi><mi>c</mi><mo>&#916;</mo><mi>T</mi><mo>=</mo><mn>5</mn><mo>&#215;</mo><mn>1</mn><mo>&#215;</mo><mfenced><mrow><mn>3</mn><mn>0</mn><mo>-</mo><mi>T</mi></mrow></mfenced></math><br /><br />And heat absorbed by the ice<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Q</mi><mn>2</mn></msub><mo>=</mo><mn>5</mn><mo>&#215;</mo><mfenced><mfrac><mn>1</mn><mn>2</mn></mfrac></mfenced><mfenced open=\"[\" close=\"]\"><mrow><mn>0</mn><mo>-</mo><mfenced><mrow><mo>-</mo><mn>2</mn><mn>0</mn></mrow></mfenced></mrow></mfenced><mo>+</mo><mn>5</mn><mo>&#215;</mo><mn>8</mn><mn>0</mn><mo>+</mo><mn>5</mn><mo>&#215;</mo><mn>1</mn><mfenced><mrow><mi>T</mi><mo>-</mo><mn>0</mn></mrow></mfenced></math><br /><br />So, by the principle of calorimetry <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Q</mi><mn>1</mn></msub><mo>=</mo><mo>&#160;</mo><msub><mi>Q</mi><mn>2</mn></msub><mo>,</mo></math> i.e.,<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>150</mn><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><mn>5</mn><mi>T</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>450</mn><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>5</mn><mi>T</mi></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mi>T</mi><mo>=</mo><mo>-</mo><mo>&#160;</mo><mn>30</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math><br /><br />Which is impossible as a body cannot be cooled to a temperature below the temperature of the cooling body. The physical reason for this discrepancy is the heat remaining after changing the temperature of ice from -20 to 0<sup>o</sup>C with some ice left unmelted and we are taking it for granted that heat is transferred from water at 0<sup>o</sup>C to ice at 0<sup>o</sup>C so that temperature below 0<sup>o</sup>C.<br />However, as heat cannot flow from one body (water) to the other (ice) at the same temperature (0<sup>o</sup>C), the temperature of the system will not fall below 0<sup>o</sup>C.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e71050fd9237f846", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "77", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A cylindrical rod with one end in a steam chamber and the other end in ice results in melting of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">g</mi></math> of ice per second. If the rod is replaced by another with half the length and double the radius of the first and if the thermal conductivity of the material of the second rod is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac bevelled=\"true\"><mn>1</mn><mn>4</mn></mfrac></math> that of the first, the rate at which ice melts in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">g</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> will be", "image": null}, "options": [{"id": "IL8bj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>.</mo><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "JNI7B", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>6</mn></math>", "image": null, "isCorrect": false}, {"id": "rgOi3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>2</mn></math>", "image": null, "isCorrect": true}, {"id": "FfagH", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>1</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As <math><mfrac><mrow><mi>d</mi><mi>Q</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mi>K</mi><mi>A</mi><mi>&nbsp;</mi><mfrac><mrow><mi>d</mi><mi>T</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mo>,</mo></math> therefore, when<br /><br /><math><mi>d</mi><mi>t</mi><mi>&nbsp;</mi><mo>→</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mi>&nbsp;</mi><mi>A</mi><mo>→</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mo>,</mo><mi>&nbsp;</mi><mi>K</mi><mo>→</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math><br /><br /><math><mfrac><mrow><mi>d</mi><mi>Q</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mi>&nbsp;</mi></math>becomes twice ; <math><mi>m</mi></math> would become twice<br /><br />Mass of ice melted/s= 2<math><mo>×</mo><mn>0.1</mn></math>g=0.2g", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e0953ad68d251730", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "95", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Calculate the resulting temperature when <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">g</mi></math> of boiling water is poured into an ice-cold brass vessel (specific heat = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0.1</mn><mo>&nbsp;</mo><mi>cal</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">g</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&nbsp;</mo><mo>°</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> ) of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">g</mi></math>.", "image": null}, "options": [{"id": "ef6mA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>66</mn><mo>.66</mo><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": true}, {"id": "7DuxY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>.66</mo><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}, {"id": "ydXo4", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.66</mo><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}, {"id": "nByHu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>50&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The general formula for final temperature is<br /><br /><math><mi>&#952;</mi><mo>=</mo><mfrac><mrow><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>s</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>&#952;</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>s</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>&#952;</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><mo>&#8230;</mo></mrow><mrow><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>s</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>s</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><mo>&#8230;</mo></mrow></mfrac></math><br /><br />In this problem<br /><br /><math><mi>&#952;</mi><mo>=</mo><mfrac><mrow><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>s</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>&#952;</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>s</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>&#952;</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>s</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>s</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math><br /><br />Here, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mn>1</mn></msub><mo>=</mo><mn>20</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi><mo>,</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><msub><mi>m</mi><mn>2</mn></msub><mo>=</mo><mn>100</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#952;</mi><mn>1</mn></msub><mo>=</mo><mn>100</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><msub><mi>&#952;</mi><mn>2</mn></msub><mo>=</mo><mn>0</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>s</mi><mn>1</mn></msub><mo>=</mo><mn>1</mn><mo>&#160;</mo><mi>cal</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">g</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#160;</mo><mo>&#176;</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>s</mi><mn>2</mn></msub><mo>=</mo><mn>0.1</mn><mi>&#160;</mi><mi>cal</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">g</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#160;</mo><mo>&#176;</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#952;</mi><mo>=</mo><mn>66.66</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863de34a5950e52b8d8", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "59", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Three rods <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BC</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BD</mi></math> of same length <math> <mrow> <mi>l</mi><mo>⁡</mo> </mrow> </math>&nbsp;and cross section <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> are arranged as shown. The end <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">D</mi></math> is immersed in ice whose mass is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>440</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">g</mi></math> and is at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. The end C is maintained at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. Heat is supplied at a constant rate of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>&nbsp;</mo><mi>cal</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. Thermal conductivities of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math> , <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BC</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BD</mi></math> are <math><mi>K</mi></math>, <math><mn>2</mn></math><math><mi>K</mi></math> and <math><mrow><mi>K</mi><mo>/</mo><mn>2</mn></mrow></math> , respectively. Time after which whole ice will melt is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>×</mo><msup><mn>10</mn><mn>2</mn></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">s</mi></math>. What is the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>?&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>K</mi><mo>=</mo><mn>100</mn><mtext> </mtext><msup><mtext>cal&nbsp;m</mtext><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mtext>s</mtext><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>°</mo><msup><mtext>C</mtext><mrow><mo>-</mo><mn>1</mn></mrow></msup><mtext>,&nbsp;A</mtext><mo>=</mo><mn>10</mn><mtext> </mtext><msup><mtext>cm</mtext><mn>2</mn></msup><mo>,</mo><mtext> </mtext><mi>l</mi><mo>=</mo><mn>1</mn><mtext> </mtext><mtext>m</mtext><mo>)</mo></math><br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0030680_Question.jpg\" style=\"width: 180px; height: 156px;\" />", "image": null}, "options": [], "correctValue": "8", "solution": {"text": "<p>Let <math> <mrow> <mi>&#952;</mi> </mrow> </math>&nbsp;be the temperature of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>, then</p><p><math> <mrow> <mfrac> <mrow> <mn>2</mn> <mtext>KA</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi>&#952;</mi> <mo>-</mo> <mn>1</mn> <mn>0</mn> <mn>0</mn> </mrow> </mfenced> </mrow> <mrow> <mi>l</mi><mo>&#8289;</mo> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>K</mtext> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </mfenced> <mtext>A</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi>&#952;</mi> <mo>-</mo> <mn>0</mn> </mrow> </mfenced> </mrow> <mrow> <mi>l</mi><mo>&#8289;</mo> </mrow> </mfrac> <mo>=</mo> <mn>2</mn> <mn>0</mn> <mn>0</mn> </mrow> </math></p><p>Substituting the values we obtain,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>&#952;</mi><mo>-</mo><mn>200</mn><mo>+</mo><mfrac><mi>&#952;</mi><mn>2</mn></mfrac><mo>=</mo><mn>2000</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi><mo>=</mo><mn>880</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math></p><p>Rate of heat flow from <math><mi>B</mi></math> to <math><mi>D</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mfrac><mrow><mi>K</mi><mi>A</mi></mrow><mn>2</mn></mfrac><mrow><mo>(</mo><mi>&#952;</mi><mo>&#8722;</mo><mn>0</mn><mo>)</mo></mrow></mrow><mi>l</mi></mfrac><mo>=</mo><mfrac><mn>0.1</mn><mn>2</mn></mfrac><mrow><mo>(</mo><mn>880</mn><mo>)</mo></mrow><mo>=</mo><mn>44</mn><mtext>&#8201;</mtext><msup><mtext>cal&#160;s</mtext><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><math> <mtable> <mtr> <mtd> <mi>t</mi><mo>=</mo><mfrac> <mrow> <mn>440</mn><mo>&#215;</mo><mn>80</mn></mrow> <mrow> <mn>44</mn></mrow> </mfrac> </mtd> </mtr> <mtr> <mtd> <mo>=</mo><mn>800</mn><mtext>&#8201;</mtext><mtext>s</mtext> </mtd> </mtr> </mtable> </math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>n</mi><mo>=</mo><mn>8</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d1f59937a0748b8f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "63", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A black body of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>34</mn><mo>.</mo><mn>38</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">g</mi></math> and surface area <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>19</mn><mo>.</mo><mn>2</mn><mo>&nbsp;</mo><msup><mi>cm</mi><mn>2</mn></msup></math> is at an initial temperature of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>400</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math>. It is allowed to cool inside an evacuated enclosure kept at constant temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math>. The rate of cooling is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>04</mn><mo>&nbsp;</mo></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>°</mo><mi mathvariant=\"normal\">C</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. The specific heat of the body in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">J</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><msup><mi mathvariant=\"normal\">g</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> is<br />\r(Stefan's constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>σ</mi><mo>=</mo><mn>5.73</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>8</mn></mrow></msup><mi>&nbsp;</mi><mi mathvariant=\"normal\">W</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>4</mn></mrow></msup></math>)", "image": null}, "options": [{"id": "5tzKl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2800</mn></math>", "image": null, "isCorrect": false}, {"id": "AeqXd", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2100</mn></math>", "image": null, "isCorrect": false}, {"id": "WBd0O", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1400</mn></math>", "image": null, "isCorrect": true}, {"id": "0CfhC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1200</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Newtons's law of cooling<br /><br /><math><mfrac><mrow><mi>d</mi><mi mathvariant=\"normal\">θ</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>σ</mi><mi>A</mi><mo>(</mo><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup><mo>-</mo><msubsup><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>4</mn></mrow></msubsup><mo>)</mo></mrow><mrow><mi>m</mi><mi>s</mi></mrow></mfrac></math><br /><br /><math><mo>∴</mo></math> Specific heat <math><mi>s</mi><mo>⁡</mo> <mo>=</mo><mfrac><mrow><mi>σ</mi><mi>A</mi><mo>(</mo><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup><mo>-</mo><msubsup><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>4</mn></mrow></msubsup><mo>)</mo></mrow><mrow><mi>m</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>d</mi><mi mathvariant=\"normal\">θ</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mrow></mfenced></mrow></mfrac></math><br /><br />Substituting the values<br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>s</mi><mo>=</mo><mfrac><mrow><mfenced separators=\"|\"><mrow><mn>5.73</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>8</mn></mrow></msup></mrow></mfenced><mfenced separators=\"|\"><mrow><mn>19.2</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>4</mn></mrow></msup></mrow></mfenced><mo>[</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>4</mn></mrow></mfenced></mrow><mrow><mn>4</mn></mrow></msup><mo>-</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>3</mn></mrow></mfenced></mrow><mrow><mn>4</mn></mrow></msup><mo>]</mo><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>8</mn></mrow></msup></mrow><mrow><mfenced separators=\"|\"><mrow><mn>34.38</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></mrow></mfenced><mo>(</mo><mn>4</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>)&nbsp; &nbsp; &nbsp;</mo></mrow></mfrac><mo>=</mo><mn>1400</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ce65b995631031b0", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "05", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Liquids <math><mi mathvariant=\"normal\">A</mi></math> and <math><mi mathvariant=\"normal\">B</mi></math> are at <math> <mrow> <mtext>30</mtext><msup> <mtext>&#8201;</mtext> <mi>o</mi> </msup> <mtext>C</mtext></mrow> </math> and <math> <mrow> <mtext>20</mtext><msup> <mtext>&#8201;</mtext> <mi>o</mi> </msup> <mtext>C</mtext></mrow> </math>, respectively. When mixed in equal masses, the temperature of the mixture is found to be <math> <mrow> <mtext>26</mtext><msup> <mtext>&#8201;</mtext> <mi>o</mi> </msup> <mtext>C</mtext></mrow> </math>, The specific heats of <math><mi mathvariant=\"normal\">A</mi></math> and <math><mi mathvariant=\"normal\">B</mi></math> are in the ratio of <math> <mrow> <mi>m</mi><mo>:</mo><mi>n</mi></mrow> </math>, where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>&nbsp;are integers, then find minimum value of <math> <mrow> <mi>m</mi><mo>+</mo><mi>n</mi></mrow></math>.", "image": null}, "options": [], "correctValue": "5", "solution": {"text": "At thermal equilibrium<br /><br />heat rejected by one liquid = heat accepted by other liquid<br /><br /><math><msub><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">s</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow></msub><mfenced separators=\"|\"><mrow><mn>30</mn><mo>–</mo><mn>26</mn></mrow></mfenced><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">s</mi></mrow><mrow><mi mathvariant=\"normal\">B</mi></mrow></msub><mfenced separators=\"|\"><mrow><mn>26</mn><mo>–</mo><mn>20</mn></mrow></mfenced></math><br /><br /><math><mo>⇒</mo><mn>4</mn><msub><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow></msub><mo>=</mo><mn>6</mn><msub><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mi mathvariant=\"normal\">B</mi></mrow></msub></math><br /><br /><math><mo>∴</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mi mathvariant=\"normal\">B</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>6</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math> <math> <mrow> <mo>=</mo><mfrac> <mi>m</mi> <mi>n</mi> </mfrac> <mo>⇒</mo><mi>m</mi><mo>+</mo><mi>n</mi><mo>=</mo><mn>3</mn><mo>+</mo><mn>2</mn><mo>=</mo><mn>5</mn></mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c0399f63becac8fc", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "06", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>One end of a copper rod of uniform cross-section and of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>&nbsp;is kept in contact with ice at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>&nbsp;and the other end with water at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. If the whole system is insulated from its&nbsp;surroundings,&nbsp;then at what&nbsp;distance from the end of the rod which is in contact with the steam, the temperature&nbsp;should be&nbsp;maintained at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>, so that in steady-state the rate of melting of ice be equal to the rate of production of steam? <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>[</mo><msub><mi>L</mi><mi>fusion</mi></msub><mo>=</mo><mn>80</mn><mo>&nbsp;</mo><mi>cal</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">g</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mi>vaporization</mi></msub><mo>=</mo><mn>540</mn><mo>&nbsp;</mo><mi>cal</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">g</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>]</mo></math></p>\r", "image": null}, "options": [{"id": "P3KEW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>.</mo><mn>34</mn><mo>&#xA0;</mo><mi>cm</mi></math>", "image": null, "isCorrect": true}, {"id": "1LYU0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>16</mn><mo>.</mo><mn>48</mn><mo>&#xA0;</mo><mi>cm</mi></math>", "image": null, "isCorrect": false}, {"id": "Z3vme", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>21</mn><mo>.</mo><mn>68</mn><mo>&#xA0;</mo><mi>cm</mi></math>", "image": null, "isCorrect": false}, {"id": "h3Doy", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>27</mn><mo>.</mo><mn>87</mn><mo>&#xA0;</mo><mi>cm</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If the point is at a distance x from water at 100<sup>o</sup>C, heat conducted to ice in time t,<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <msub> <mtext>Q</mtext> <mtext>ice</mtext> </msub> <mo>=</mo> <mtext>KA</mtext> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>200</mtext> <mo>-</mo> <mn>0</mn> </mrow> </mfenced> </mrow> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>1.5</mtext> <mo>-</mo> <mi>x</mi> </mrow> </mfenced> </mrow> </mfrac> <mo>×</mo> <mtext>t</mtext> </mrow> </math><br /><br /><strong><u><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013985_AnsExp1_1.jpg\" /></u></strong><br /><br />So ice melted by this heat<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <msub> <mtext>m</mtext> <mtext>ice</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>Q</mtext> <mtext>ice</mtext> </msub> </mrow> <mrow> <msub> <mtext>L</mtext> <mtext>F</mtext> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>KA</mtext> </mrow> <mrow> <mtext>80</mtext> </mrow> </mfrac> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>200</mtext> <mo>-</mo> <mn>0</mn> </mrow> </mfenced> </mrow> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>1.5</mtext> <mo>-</mo> <mi>x</mi> </mrow> </mfenced> </mrow> </mfrac> <mo>×</mo> <mtext>t</mtext> </mrow> </math><br /><br />Similarly heat conducted by the rod to the water at 100<sup>o</sup>C in time t,<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <msub> <mtext>Q</mtext> <mtext>water</mtext> </msub> <mo>=</mo> <mtext>KA</mtext> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>200</mtext> <mo>-</mo> <mtext>100</mtext> </mrow> </mfenced> </mrow> <mrow> <mi>x</mi> </mrow> </mfrac> <mtext>t</mtext> </mrow> </math><br /><br />So steam formed by this heat<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <msub> <mtext>m</mtext> <mtext>steam</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>Q</mtext> <mtext>water</mtext> </msub> </mrow> <mrow> <msub> <mtext>L</mtext> <mtext>V</mtext> </msub> </mrow> </mfrac> <mo>=</mo> <mtext>KA</mtext> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>200</mtext> <mo>-</mo> <mtext>100</mtext> </mrow> </mfenced> </mrow> <mrow> <mtext>540</mtext> <mo>×</mo> <mi>x</mi> </mrow> </mfrac> <mtext>t</mtext> </mrow> </math><br /><br />According to given problem m<sub>ice</sub> = m<sub>steam</sub>, i.e.,<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mfrac> <mrow> <mtext>200</mtext> </mrow> <mrow> <mtext>80</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>1.5</mtext> <mo>-</mo> <mi>x</mi> </mrow> </mfenced> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>100</mtext> </mrow> <mrow> <mtext>540</mtext> <mo>×</mo> <mi>x</mi> </mrow> </mfrac> <mspace width=\"0.5em\"></mspace> <mtext>or</mtext> <mspace width=\"0.5em\"></mspace> <mi>x</mi> <mo>=</mo> <mfrac> <mrow> <mn>6</mn> </mrow> <mrow> <mtext>58</mtext> </mrow> </mfrac> <mtext>m</mtext> <mo>=</mo> <mtext>10.34 cm</mtext> </mrow> </math><br /><br />i.e., 200<sup>o</sup>C temperature must be maintained at a distance 10.34 cm from water at 100<sup>o</sup>C.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a316391af7871745", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "82", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Three containers <math><msub><mrow><mi>C</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>,</mo><mi></mi><msub><mrow><mi>C</mi></mrow><mrow><mn>2</mn></mrow></msub></math> and <math><msub><mrow><mi>C</mi></mrow><mrow><mn>3</mn></mrow></msub></math> have water at different temperatures. The table below shows the final temperature <math><mi>T</mi></math> when different amounts of water (given in liters) are taken from each container and mixed (assume no loss of heat during the process)\r\r<table border=\"1px solid\">\r\t<thead>\r\t\t<tr>\r\t\t\t<th><math><msub><mrow><mi>C</mi></mrow><mrow><mn>1</mn></mrow></msub></math></th>\r\t\t\t<th><math><msub><mrow><mi>C</mi></mrow><mrow><mn>2</mn></mrow></msub></math></th>\r\t\t\t<th><math><msub><mrow><mi>C</mi></mrow><mrow><mn>3</mn></mrow></msub></math></th>\r\t\t\t<th><math><mi>T</mi></math></th>\r\t\t</tr>\r\t</thead>\r\t<tbody>\r\t\t<tr>\r\t\t\t<td><math><mn>1</mn><mi>l</mi></math></td>\r\t\t\t<td><math><mn>2</mn><mi>l</mi></math></td>\r\t\t\t<td><math><mo>-</mo><mo>-</mo></math></td>\r\t\t\t<td><math><msup><mrow><mn>60</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">C</mi></math></td>\r\t\t</tr>\r\t\t<tr>\r\t\t\t<td><math><mo>-</mo><mo>-</mo></math></td>\r\t\t\t<td><math><mn>1</mn><mi>l</mi></math></td>\r\t\t\t<td><math><mn>2</mn><mi>l</mi></math></td>\r\t\t\t<td><math><msup><mrow><mn>30</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">C</mi></math></td>\r\t\t</tr>\r\t\t<tr>\r\t\t\t<td><math><mn>2</mn><mi>l</mi></math></td>\r\t\t\t<td><math><mo>-</mo><mo>-</mo></math></td>\r\t\t\t<td><math><mn>1</mn><mi>l</mi></math></td>\r\t\t\t<td><math><msup><mrow><mn>60</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">C</mi></math></td>\r\t\t</tr>\r\t\t<tr>\r\t\t\t<td><math><mn>1</mn><mi>l</mi></math></td>\r\t\t\t<td><math><mn>1</mn><mi>l</mi></math></td>\r\t\t\t<td><math><mn>1</mn><mi>l</mi></math></td>\r\t\t\t<td><math><mi>θ</mi></math></td>\r\t\t</tr>\r\t</tbody>\r</table>\r<br />\rThe value of <math><mi>θ</mi></math> (in <math><msup><mrow><mi></mi></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mi mathvariant=\"normal\">C</mi></math> to the nearest integer) is___________", "image": null}, "options": [], "correctValue": "50", "solution": {"text": "<p>Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#952;</mi><mn>1</mn></msub></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#952;</mi><mn>2</mn></msub></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#952;</mi><mn>3</mn></msub></math>&nbsp;be the&nbsp;temperatures of water in three containers.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><msub><mi>&#952;</mi><mn>1</mn></msub><mo>+</mo><mn>2</mn><msub><mi>&#952;</mi><mn>2</mn></msub><mo>+</mo><mn>0</mn><msub><mi>&#952;</mi><mn>3</mn></msub><mo>=</mo><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mn>2</mn></mrow></mfenced><mn>60</mn></math><br /><math><msub><mrow><mi>&#952;</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><mn>2</mn><msub><mrow><mi>&#952;</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>180</mn><mi mathvariant=\"normal\"></mi></math> &hellip;. (1)<br /><math><mn>0</mn><mo>&#215;</mo><msub><mrow><mi>&#952;</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><mn>1</mn><mo>&#215;</mo><msub><mrow><mi>&#952;</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><mn>2</mn><mo>&#215;</mo><msub><mrow><mi>&#952;</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>=</mo><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mn>2</mn></mrow></mfenced><mn>30</mn></math><br /><math><msub><mrow><mi>&#952;</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><mn>2</mn><msub><mrow><mi>&#952;</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>=</mo><mn>90</mn><mi mathvariant=\"normal\"></mi></math> &hellip;&hellip; (2)<br /><math><mn>2</mn><mo>&#215;</mo><msub><mrow><mi>&#952;</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><mn>0</mn><mo>&#215;</mo><msub><mrow><mi>&#952;</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><mn>1</mn><mo>&#215;</mo><msub><mrow><mi>&#952;</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>=</mo><mfenced separators=\"|\"><mrow><mn>2</mn><mo>+</mo><mn>1</mn></mrow></mfenced><mn>60</mn></math><br /><math><mn>2</mn><msub><mrow><mi>&#952;</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>&#952;</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>=</mo><mn>180</mn><mi mathvariant=\"normal\"></mi></math> &hellip;. (3)<br />and <math><msub><mrow><mi>&#952;</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>&#952;</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><msub><mrow><mi>&#952;</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>=</mo><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mn>1</mn><mo>+</mo><mn>1</mn></mrow></mfenced><mi>&#952;</mi></math><br />from (1)+(2)+(3)<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><msub><mi>&#952;</mi><mn>1</mn></msub><mo>+</mo><mn>3</mn><msub><mi>&#952;</mi><mn>2</mn></msub><mo>+</mo><mn>3</mn><msub><mi>&#952;</mi><mn>3</mn></msub><mo>=</mo><mn>450</mn><mo>&#10233;</mo><msub><mi>&#952;</mi><mn>1</mn></msub><mo>+</mo><msub><mi>&#952;</mi><mn>2</mn></msub><mo>+</mo><msub><mi>&#952;</mi><mn>3</mn></msub><mo>=</mo><mn>150</mn></math><br />from (4) equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>150</mn><mo>=</mo><mn>3</mn><mi>&#952;</mi><mo>&#10233;</mo><mi>&#952;</mi><mo>=</mo><mn>50</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86390f275a5758d2093", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "107", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Ice starts forming in a lake where the water is at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> and the ambient temperature is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>1</mn><mn>0</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. If the time taken for <math><mn>1</mn><mi>&nbsp;</mi><mn>c</mn><mn>m</mn></math> of ice to be formed is&nbsp;<math><mi>7 hours</mi></math>, then the time taken for the thickness of ice to change from <math><mn>1</mn><mi>&nbsp;</mi><mn>c</mn><mn>m</mn></math> to <math><mn>2</mn><mi>&nbsp;</mi><mn>c</mn><mn>m</mn></math> is", "image": null}, "options": [{"id": "IBj8D", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>&#xA0;</mo><mi>hours</mi></math>", "image": null, "isCorrect": false}, {"id": "Yqvzb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>14</mn><mo>&#xA0;</mo><mi>hours</mi></math>", "image": null, "isCorrect": false}, {"id": "jrmDx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10.5</mn><mo>&#xA0;</mo><mi>hours</mi></math>", "image": null, "isCorrect": false}, {"id": "79UUo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>21</mn><mo>&#xA0;</mo><mi>hours</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>If at some time&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">t</mi></math>,&nbsp;the thickness of ice is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi></math>&nbsp;and at time&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">t</mi><mo>+</mo><mi>dt</mi></math>, the thickeness is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi><mo>+</mo><mi>dx</mi></math>, then</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>&#961;Adx</mi></mfenced><msub><mi mathvariant=\"normal\">L</mi><mi>fusion</mi></msub><mo>=</mo><mfrac><mrow><mi>kA</mi><mfenced><mrow><mn>0</mn><mo>-</mo><mfenced><mrow><mo>-</mo><mn>10</mn></mrow></mfenced></mrow></mfenced></mrow><mi mathvariant=\"normal\">x</mi></mfrac><mi>dt</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#8710;</mo><mi mathvariant=\"normal\">t</mi><mo>=</mo><mfrac><mrow><mi>&#961;</mi><msub><mi mathvariant=\"normal\">L</mi><mi>fusion</mi></msub></mrow><mrow><mn>20</mn><mi mathvariant=\"normal\">k</mi></mrow></mfrac><mfenced><mrow><msubsup><mi mathvariant=\"normal\">x</mi><mn>2</mn><mn>2</mn></msubsup><mo>-</mo><msubsup><mi mathvariant=\"normal\">x</mi><mn>1</mn><mn>2</mn></msubsup></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#8710;</mo><mi mathvariant=\"normal\">t</mi><mo>&#8733;</mo><mo>(</mo><msubsup><mi mathvariant=\"normal\">x</mi><mn>2</mn><mn>2</mn></msubsup><mo>-</mo><msubsup><mi mathvariant=\"normal\">x</mi><mn>1</mn><mn>2</mn></msubsup><mo>)</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><mo>&#8710;</mo><mi mathvariant=\"normal\">t</mi></mrow><mrow><mo>&#8710;</mo><mi mathvariant=\"normal\">t</mi><mo>'</mo></mrow></mfrac><mo>=</mo><mfrac><mrow><msubsup><mi mathvariant=\"normal\">x</mi><mn>2</mn><mn>2</mn></msubsup><mo>-</mo><msubsup><mi mathvariant=\"normal\">x</mi><mn>1</mn><mn>2</mn></msubsup></mrow><mrow><msup><mfenced><mrow><mi mathvariant=\"normal\">x</mi> >A</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&nbsp;are maintained at temperatures <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>, respectively. A point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math>&nbsp;of this rod is connected to a box <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">D</mi></math>, containing ice at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>, through a highly conducting wire of negligible heat capacity. The rate at which ice melts in the box is (assume latent heat of fusion for ice <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mi>f</mi></msub><mo>=</mo><mn>80</mn><mo>&nbsp;</mo><mi>cal</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">g</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>)<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029825_Question.jpg\" style=\"width: 249px; height: 123px;\" />", "image": null}, "options": [{"id": "6UUiN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>84</mn><mo>&nbsp;</mo><mi>mg</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "m4CxM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>84</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">g</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "9tbBz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&n mtext> </mrow> </mfrac> </mrow> </math><br /><br />undefined<br /><br />&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>3</mn> <mn>4</mn> <mn>4</mn> <mn>0</mn> </mrow> <mrow> <mn>1</mn> <msup> <mn>0</mn> <mn>3</mn> </msup> </mrow> </mfrac> <mo>=</mo> <mtext>13.44 W</mtext> </mrow> </math><br /><br />Rate of melting of ice<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mtext>H</mtext><msub><mtext>L</mtext><mtext>f</mtext></msub></mfrac><mo>=</mo><mfrac><mtext>13.44/4.2</mtext><mrow><mn>8</mn><mn>0</mn></mrow></mfrac><mo>&nbsp;</mo><msup><mtext>g&nbsp;s</mtext><mtext>-1</mtext></msup><mo>=</mo><mn>4</mn><mn>0</mn><mo>&nbsp;</mo><mi>mg</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86368cd47081447a3e4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "19", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Ice starts forming in a lake where the water is at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> and the ambient temperature is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>1</mn><mn>0</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. If the time taken for <math><mn>1</mn><mi>&nbsp;</mi><mn>c</mn><mn>m</mn></math> of ice to be formed is&nbsp;<math><mi>7 hours</mi></math>, then the time taken for the thickness of ice to change from <math><mn>1</mn><mi>&nbsp;</mi><mn>c</mn><mn>m</mn></math> to <math><mn>2</mn><mi>&nbsp;</mi><mn>c</mn><mn>m</mn></math> is", "image": null}, "options": [{"id": "YEjhI", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>&#xA0;</mo><mi>hours</mi></math>", "image": null, "isCorrect": false}, {"id": "jNEL2", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>14</mn><mo>&#xA0;</mo><mi>hours</mi></math>", "image": null, "isCorrect": false}, {"id": "TDlEu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10.5</mn><mo>&#xA0;</mo><mi>hours</mi></math>", "image": null, "isCorrect": false}, {"id": "woEdL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>21</mn><mo>&#xA0;</mo><mi>hours</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>If at some time&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">t</mi></math>,&nbsp;the thickness of ice is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi></math>&nbsp;and at time&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">t</mi><mo>+</mo><mi>dt</mi></math>, the thickeness is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi><mo>+</mo><mi>dx</mi></math>, then</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>&#961;Adx</mi></mfenced><msub><mi mathvariant=\"normal\">L</mi><mi>fusion</mi></msub><mo>=</mo><mfrac><mrow><mi>kA</mi><mfenced><mrow><mn>0</mn><mo>-</mo><mfenced><mrow><mo>-</mo><mn>10</mn></mrow></mfenced></mrow></mfenced></mrow><mi mathvariant=\"normal\">x</mi></mfrac><mi>dt</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#8710;</mo><mi mathvariant=\"normal\">t</mi><mo>=</mo><mfrac><mrow><mi>&#961;</mi><msub><mi mathvariant=\"normal\">L</mi><mi>fusion</mi></msub></mrow><mrow><mn>20</mn><mi mathvariant=\"normal\">k</mi></mrow></mfrac><mfenced><mrow><msubsup><mi mathvariant=\"normal\">x</mi><mn>2</mn><mn>2</m estionLabels": [{"title": "NTA Abhyas Paper", "value": "64", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In a motor, the electrical power input is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>500</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">W</mi></math> and the mechanical power output is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>54</mn></math> horse power. The heat developed in the motor in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math> hour is&nbsp; (assuming that all the electric energy which is not converted to mechanical energy is converted to heat) is", "image": null}, "options": [{"id": "1FeQS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>.</mo><mn>18</mn><mo>&#xD7;</mo><msup><mn>10</mn><mn>4</mn></msup><mo>&#xA0;</mo><mi>cal</mi></math>", "image": null, "isCorrect": false}, {"id": "o1viG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>.</mo><mn>6</mn><mo>&#xD7;</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&#xA0;</mo><mi>cal</mi></math>", "image": null, "isCorrect": false}, {"id": "mFd0E", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>.</mo><mn>6</mn><mo>&#xD7;</mo><msup><mn>10</mn><mn>4</mn></msup><mo>&#xA0;</mo><mi>cal</mi></math>", "image": null, "isCorrect": true}, {"id": "pbocm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>28</mn><mo>&#xD7;</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&#xA0;</mo><mi>cal</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math> <mrow> <mtext>Efficiency</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>0.54</mtext> <mo>&#215;</mo> <mn>7</mn> <mn>4</mn> <mn>6</mn> </mrow> <mrow> <mn>5</mn> <mn>0</mn> <mn>0</mn> </mrow> </mfrac> <m e": null}, "options": [{"id": "eQRgM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>80</mn><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": true}, {"id": "c7R8c", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}, {"id": "nLUny", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>70</mn><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}, {"id": "Y90Lc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>85</mn><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Heat loss will always be equal to heat gain.</p><p>As per <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>1</mn><mrow><mi>s</mi><mi>t</mi></mrow></msup></math>condition,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&#215;</mo><msub><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">A</mi></msub><mo>&#215;</mo><mo>(</mo><mn>100</mn><mo>-</mo><mn>90</mn><mo>)</mo><mo>=</mo><mn>50</mn><mo>&#215;</mo><msub><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">B</mi></msub><mo>&#215;</mo><mo>(</mo><mn>90</mn><mo>-</mo><mn>75</mn><mo>)</mo><mo>&#160;</mo><mi>___</mi><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo></math></p><p>As per&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>2</mn><mrow><mi>n</mi><mi>d</mi></mrow></msup></math> condition,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&#215;</mo><msub><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">A</mi></msub><mo>(</mo><mn>100</mn><mo>-</mo><mi mathvariant=\"normal\">&#952;</mi><mo>)</mo><mo>=</mo><mn>50</mn><mo>&#215;</mo><msub><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">B</mi></msub><mo>(</mo><mi mathvariant=\"normal\">&#952;</mi><mo>-</mo><mn>50</mn><mo>)</mo><mo>&#160;</mo><mi>___</mi><mo>(</mo><mi>ii</mi><mo>)</mo></math><br /><br />Dividing <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>ii</mi><mo>)</mo></math> by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo></math>, we get<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>100</mn><mo>-</mo><mi mathvariant=\"normal\">&#952;</mi></mrow><mrow><mn>100</mn><mo>-</mo><mn>90</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">&#952;</mi><mo>-</mo><mn>50</mn></mrow><mrow><mn>90</mn><mo>-</mo><mn>75</mn></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>-</mo><mn>3</mn><mi mathvariant=\"normal\">&#952;</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#952;</mi><mo>-</mo><mn>100</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#952;</mi><mo>=</mo><mn>80</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "6aa3ab79aa8dc1ff681780a8", "title": "Conduction", "totalQuestions": 33, "questions": [{"_id": "6151e863fa7530473b26bcaf", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "84", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> long wire of resistance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&nbsp;</mo><mi>ohm</mi></math> and diameter <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>64</mn><mo>&nbsp;</mo><mi>mm</mi></math> is coated with plastic insulation of thickness <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>06</mn><mo>&nbsp;</mo><mi>mm</mi></math>. When a current of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&nbsp;</mo></math>ampere flows through the wire, find the temperature difference across the insulation in steady-state if <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">K</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>0</mn><mo>.</mo><mn>16</mn><mo>&nbsp;</mo><mo>×</mo><mo>&nbsp;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>&nbsp;</mo><mi>cal</mi><mo>&nbsp;</mo><msup><mi>cm</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&nbsp;</mo><mo>°</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>.", "image": null}, "options": [{"id": "FHxFk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 60px; top: 41px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "BEcux", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 60px; top: 41px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "p4WEO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 60px; top: 41px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "ysz8v", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 60px; top: 41px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Consider a coaxial cylindrical shell of radius r and thickness dr as shown in diagram. The radial rate of flow of heat through this shell in steady state will be<br /><br /><strong><u><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013994_AnsExp2_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 250px; height: 147px;\" /></u></strong><br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>H</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>d</mtext> <mtext>Q</mtext> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> <mo>=</mo> <mo>-</mo> <mtext>K</mtext> <mtext>A</mtext> <mfrac> <mrow> <mtext>d</mtext> <mtext>θ</mtext> </mrow> <mrow> <mtext>dr</mtext> </mrow> </mfrac> </mrow> </math><br /><br />[Negative sign is used as with increase in r, θ decreases.] Now as for cylindrical shell A = 2πrL,<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>H</mtext> <mo>=</mo> <mo>-</mo> <mn>2</mn> <mtext>π</mtext> <mtext>r</mtext> <mtext>L</mtext> <mtext>K</mtext> <mfrac> <mrow> <mtext>d</mtext> <mtext>θ</mtext> </mrow> <mrow> <mtext>dr</mtext> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mtext>or</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <msubsup> <mo>∫</mo> <mi>a</mi> <mi>b</mi> </msubsup> <mfrac> <mrow> <mtext>dr</mtext> </mrow> <mrow> <mtext>r</mtext> </mrow> </mfrac> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <mn>2</mn> <mtext>π</mtext> <mtext>LK</mtext> </mrow> <mrow> <mtext>H</mtext> </mrow> </mfrac> <msubsup> <mo>∫</mo> <msub> <mtext>θ</mtext> <mn>1</mn> </msub> <msub> <mtext>θ</mtext> <mn>2</mn> </msub> </msubsup> <mtext>d</mtext> <mtext>θ</mtext> </mrow> </math><br /><br />which on integration and simplification gives:<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>H</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>d</mtext> <mtext>Q</mtext> </mrow> <mrow> <mtext>d</mtext> <mtext>t</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> <mtext>π</mtext> <mtext>KL</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>θ</mtext> <mn>1</mn> </msub> <mo>-</mo> <msub> <mtext>θ</mtext> <mn>2</mn> </msub> </mrow> </mfenced> </mrow> <mrow> <msub> <mtext>log</mtext> <mtext>e</mtext> </msub> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi>b</mi> <mo>/</mo> <mi>a</mi> </mrow> </mfenced> </mrow> </mfrac> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>....(i)</mtext> </mrow> </math><br /><br /><math> <mrow> <mtext>Here</mtext> <mspace width=\"0.5em\"></mspace> <mtext>H</mtext> <mo>=</mo> <mfrac> <mrow> <msup> <mtext>I</mtext> <mn>2</mn> </msup> <mtext>R</mtext> </mrow> <mrow> <mtext>4.2</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>5</mn> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> <mo>×</mo> <mn>4</mn> </mrow> <mrow> <mtext>4.2</mtext> </mrow> </mfrac> <mo>=</mo> <mtext>24 cal/s,</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>L</mtext> <mo>=</mo> <mtext>2 m</mtext> <mo>=</mo> <mtext>200 cm</mtext> </mrow> </math><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; r<sub>1</sub> = (0.64/2) mm = 0.032 cm<br /><br />and &nbsp; &nbsp;r<sub>2</sub> = r<sub>1</sub> + d = 0.032 + 0.006 = 0.038 cm<br /><br /><math> <mrow> <mtext>So</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>θ</mtext> <mn>1</mn> </msub> <mo>-</mo> <msub> <mtext>θ</mtext> <mn>2</mn> </msub> </mrow> </mfenced> <mo>=</mo> <mfrac> <mrow> <mtext>24</mtext> <mo>×</mo> <msub> <mtext>log</mtext> <mtext>e</mtext> </msub> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>38</mtext> <mo>/</mo> <mtext>32</mtext> </mrow> </mfenced> </mrow> <mrow> <mtext>2</mtext> <mo>×</mo> <mtext>3.14</mtext> <mo>×</mo> <mtext>200</mtext> <mo>×</mo> <mtext>0.16</mtext> <mo>×</mo> <msup> <mtext>10</mtext> <mrow> <mo>-</mo> <mn>2</mn> </mrow> </msup> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mo>=</mo> <mfrac> <mrow> <mtext>24</mtext> <mo>×</mo> <mtext>2.3026</mtext> <mo>[</mo> <msub> <mtext>log</mtext> <mtext>10</mtext> </msub> <mtext>38</mtext> <mo>-</mo> <msub> <mtext>log</mtext> <mtext>10</mtext> </msub> <mtext>32</mtext> <mo>]</mo> </mrow> <mrow> <mtext>3.14</mtext> <mo>×</mo> <mtext>0.64</mtext> </mrow> </mfrac> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>or</mtext><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mfenced><mrow><msub> ement and brick are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>125</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">W</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup><mo>&nbsp;</mo><mo>°</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">W</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>&nbsp;</mo><mo>°</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">W</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>&nbsp;</mo><mo>°</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> respectively)<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/425561q.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 282px; height: 80px;\" />", "image": null}, "options": [{"id": "ZKP7T", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9000</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">W</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 76px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "FoCke", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8500</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">W</mi></math>", "image": null, "isCorrect": false}, {"id": "BhBqB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8800</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">W</mi></math>", "image": null, "isCorrect": false}, {"id": "eE9fw", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9400</mn>
