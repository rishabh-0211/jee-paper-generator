ousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863de34a5950e52b8d8", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "59", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Three rods <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BC</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BD</mi></math> of same length <math> <mrow> <mi>l</mi><mo>⁡</mo> </mrow> </math>&nbsp;and cross section <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> are arranged as shown. The end <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">D</mi></math> is immersed in ice whose mass is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>440</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">g</mi></math> and is at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. The end C is maintained at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. Heat is supplied at a constant rate of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>&nbsp;</mo><mi>cal</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. Thermal conductivities of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math> , <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BC</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BD</mi></math> are <math><mi>K</mi></math>, <math><mn>2</mn></math><math><mi>K</mi></math> and <math><mrow><mi>K</mi><mo>/</mo><mn>2</mn></mrow></math> , respectively. Time after which whole ice will melt is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>×</mo><msup><mn>10</mn><mn>2</mn></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">s</mi></math>. What is the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>?&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>K</mi><mo>=</mo><mn>100</mn><mtext> </mtext><msup><mtext>cal&nbsp;m</mtext><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mtext>s</mtext><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>°</mo><msup><mtext>C</mtext><mrow><mo>-</mo><mn>1</mn></mrow></msup><mtext>,&nbsp;A</mtext><mo>=</mo><mn>10</mn><mtext> </mtext><msup><mtext>cm</mtext><mn>2</mn></msup><mo>,</mo><mtext> </mtext><mi>l</mi><mo>=</mo><mn>1</mn><mtext> </mtext><mtext>m</mtext><mo>)</mo></math><br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0030680_Question.jpg\" style=\"width: 180px; height: 156px;\" />", "image": null}, "options": [], "correctValue": "8", "solution": {"text": "<p>Let <math> <mrow> <mi>&#952;</mi> </mrow> </math>&nbsp;be the temperature of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>, then</p><p><math> <mrow> <mfrac> <mrow> <mn>2</mn> <mtext>KA</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi>&#952;</mi> <mo>-</mo> <mn>1</mn> <mn>0</mn> <mn>0</mn> </mrow> </mfenced> </mrow> <mrow> <mi>l</mi><mo>&#8289;</mo> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>K</mtext> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </mfenced> <mtext>A</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi>&#952;</mi> <mo>-</mo> <mn>0</mn> </mrow> </mfenced> </mrow> <mrow> <mi>l</mi><mo>&#8289;</mo> </mrow> </mfrac> <mo>=</mo> <mn>2</mn> <mn>0</mn> <mn>0</mn> </mrow> </math></p><p>Substituting the values we obtain,</p><p><math x e": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d71461c74e917c67", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "55", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The end <math><mi>A</mi></math> of a rod <math><mi>A</mi><mi>B</mi></math> of length&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> is maintained at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> and the end <math><mi>B</mi><mi>&nbsp;</mi></math>at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. What is the temperature (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>) at a distance of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>&nbsp;</mo><mi>cm</mi></math> from the end <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>?", "image": null}, "options": [], "correctValue": "64", "solution": {"text": "The situation is given in the figure. Let <math><mi mathvariant=\"normal\">θ</mi></math> be the temperature at point C.<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029196_Ans.jpg\" style=\"width: 280px; height: 86px;\" /><br /><br />We know that the rate flow of heat<br /><br /><math><mfrac><mrow><mi>Q</mi></mrow><mrow><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>K</mi><mi>A</mi><mo>(</mo><msub><mrow><mi mathvariant=\"normal\">θ</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">θ</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>)</mo></mrow><mrow><mi>d</mi></mrow></mfrac></math><br /><br />Here, K = coefficient of thermal conductivity<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; A = area of cross-section<br /><br /><math><mo>⇒&nbsp;&nbsp;&nbsp;</mo><mfrac><mrow><mi>K</mi><mi>A</mi><mo>(</mo><mn>100</mn><mo>-</mo><mi mathvariant=\"normal\">θ</mi><mo>)</mo></mrow><mrow><mn>40</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>K</mi><mi>A</mi><mo>(</mo><mi mathvariant=\"normal\">θ</mi><mo>-</mo><mn>10</mn><mo>)</mo></mrow><mrow><mn>60</mn></mrow></mfrac></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math><mfrac><mrow><mn>100</mn><mo>-</mo><mi mathvariant=\"normal\">θ</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">θ</mi><mo>-</mo><mn>10</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math><mn>300</mn><mo>-</mo><mn>3</mn><mi mathvariant=\"normal\">θ</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">θ</mi><mo>-</mo><mn>20</mn></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math><mn>5</mn><mi mathvariant=\"normal\">θ</mi><mo>=</mo><mn>320</mn></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math><mi mathvariant=\"normal\">θ</mi><mo>=</mo><mfrac><mrow><mn>320</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math><mi mathvariant=\"normal\">θ</mi><mo>=</mo><mn>64</mn><mi>℃</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863cb9d9435f7d9963d", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "69", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform copper rod of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi>cm</mi></math> length is insulated on the sides and has its ends exposed to ice and steam respectively. If there is a layer of water <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi>mm</mi></math> thick at each end, the temperature gradient <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mi>in</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>°</mo><mi mathvariant=\"normal\">C</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced></math> in the bar is (assume that the thermal conductivity of copper is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&nbsp;</mi><mn>400</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">W</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> and water is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.4</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">W</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> )", "image": null}, "options": [], "correctValue": "40", "solution": {"text": "Given, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mi>c</mi></msub><mo>=</mo><mn>400</mn><mo>&#160;</mo><mi mathvariant=\"normal\">W</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>,</mo></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mi>w</mi></msub><mo>=</mo><mn>0.4</mn><mi>&#160;</mi><mi mathvariant=\"normal\">W</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#952;</mi><mn>1</mn></msub><mo>=</mo><mn>100</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi><mo>,</mo><mi>&#160;</mi><msub><mi>&#952;</mi><mn>2</mn></msub><mo>=</mo><mn>0</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math><br /><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/vlodighxbrxobblyeramypvarsemmleadqospslggwwczomjcg.jpeg\" /><br /><br />In steady-state, the flow of heat will be the same throughout the whole system<br /><br /><math><mfrac><mrow><msub><mrow><mi>K</mi></mrow><mrow><mi>w</mi></mrow></msub><mi>A</mi><mfenced separators=\"|\"><mrow><mn>100</mn><mo>-</mo><mi>&#952;</mi></mrow></mfenced></mrow><mrow><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi>K</mi></mrow><mrow><mi>c</mi></mrow></msub><mi>A</mi><mfenced separators=\"|\"><mrow><mi>&#952;</mi><mo>-</mo><mi>&#952;</mi><mi>&#8242;</mi></mrow></mfenced></mrow><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>50</mn></mrow><mrow><mn>100</mn></mrow></mfrac></mrow></mfenced></mrow></mfrac></math><br /><br />Or <math><mfenced separators=\"|\"><mrow><mn>100</mn><mo>-</mo><mi>&#952;</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><msub><mrow><mi>K</mi></mrow><mrow><mi>c</mi></mrow></msub></mrow><mrow><msub><mrow><mi>K</mi></mrow><mrow><mi>w</mi></mrow></msub></mrow></mfrac><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>&#215;</mo><mfrac><mrow><mfenced separators=\"|\"><mrow><mi>&#952;</mi><mo>-</mo><msup><mrow><mi>&#952;</mi></mrow><mrow><mi>&#8242;</mi></mrow></msup></mrow></mfenced></mrow><mrow><mn>0.5</mn></mrow></mfrac></math><br /><br /><math><mo>=</mo><mfrac><mrow><mn>400</mn></mrow><mrow><mn>0.4</mn></mrow></mfrac><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>&#215;</mo><mfrac><mrow><mfenced separators=\"|\"><mrow><mi>&#952;</mi><mo>-</mo><mi>&#952;</mi><mi>&#8242;</mi></mrow></mfenced></mrow><mrow><mn>0.5</mn></mrow></mfrac></math><br /><br /><math><mfenced separators=\"|\"><mrow><mn>100</mn><mo>-</mo><mi>&#952;</mi></mrow></mfenced><mo>=</mo><mn>2</mn><mfenced separators=\"|\"><mrow><mi>&#952;</mi><mo>-</mo><mi>&#952;</mi><mi>&#8242;</mi></mrow></mfenced></math><br /><br /><math> <mrow> <mfrac> <mrow> <mo stretchy=\"false\">(</mo><mn>100</mn><mo>&#8722;</mo><mi>&#952;</mi><mo stretchy=\"false\">)</mo><msub> <mi>K</mi> <mi>w</mi> </msub> <mi>A</mi></mrow> <mrow> <msup> <mrow> <mn>10</mn></mrow> <mrow> <mo>&#8722;</mo><mn>3</mn></mrow> </msup> </mrow> </mfrac> <mo>=</mo><mfrac> <mrow> <mo stretchy=\"false\">(</mo><msup> <mi>&#952;</mi> <mo>&#8242;</mo> </msup> <mo>&#8722;</mo><mn>0</mn><mo stretchy=\"false\">)</mo><msub> <mi>K</mi> <mi>w</mi> </msub> <mi>A</mi></mrow> <mrow> <msup> <mrow> <mn>10</mn></mrow> <mrow> <mo>&#8722;</mo><mn>3</mn></mrow> </msup> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mn>100</mn><mo>&#8722;</mo><mi>&#952;</mi><mo>=</mo><msup> <mi>&#952;</mi> <mo>&#8242;</mo> </msup> </math><br /><br />Or <math><mfenced separators=\"|\"><mrow><mn>100</mn><mo>-</mo><mi>&#952;</mi></mrow></mfenced><mo>=</mo><mn>4</mn><mi>&#952;</mi><mo>-</mo><mn>200</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mn>5</mn><mi>&#952;</mi><mo>=</mo><mn>300</mn><mo>&#8658;</mo><mi>&#952;</mi><mo>=</mo><mn>60</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><msup><mi>&#952;</mi><mi>&#8242;</mi></msup><mo>=</mo><mn>100</mn><mo>-</mo><mi>&#952;</mi><mo>=</mo><mn>100</mn><mo>-</mo><mn>60</mn><mo>=</mo><mn>40</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math><br /><br />Hence, the temperature gradient along the bar<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mi>&#952;</mi><mo>-</mo><mi>&#952;</mi><mi>&#8242;</mi></mrow><mn>0.5</mn></mfrac><mo>=</mo><mfrac><mrow><mn>60</mn><mo>-</mo><mn>40</mn></mrow><mn>0.5</mn></mfrac><mo>=</mo><mi>&#160;</mi><mn>40</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c0399f63becac8fc", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "06", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>One end of a copper rod of uniform cross-section and of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>&nbsp;is kept in contact with ice at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>&nbsp;and the other end with water at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. If the whole system is insulated from its&nbsp;surroundings,&nbsp;then at what&nbsp;distance from the end of the rod which is in contact with the steam, the temperature&nbsp;should be&nbsp;maintained at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>, so that in steady-state the rate of melting of ice be equal to the rate of production of steam? <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>[</mo><msub><mi>L</mi><mi>fusion</mi></msub><mo>=</mo><mn>80</mn><mo>&nbsp;</mo><mi>cal</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">g</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mi>vaporization</mi></msub><mo>=</mo><mn>540</mn><mo>&nbsp;</mo><mi>cal</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">g</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>]</mo></math></p>\r", "image": null}, "options": [{"id": "P3KEW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>.</mo><mn>34</mn><mo>&#xA0;</mo><mi>cm</mi></math>", "image": null, "isCorrect": true}, {"id": "1LYU0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>16</mn><mo>.</mo><mn>48</mn><mo>&#xA0;</mo><mi>cm</mi></math>", "image": null, "isCorrect": false}, {"id": "Z3vme", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>21</mn><mo>.</mo><mn>68</mn><mo>&#xA0;</mo><mi>cm</mi></math>", "image": null, "isCorrect": false}, {"id": "h3Doy", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>27</mn><mo>.</mo><mn>87</mn><mo>&#xA0;</mo><mi>cm</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If the point is at a distance x from water at 100<sup>o</sup>C, heat conducted to ice in time t,<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <msub> <mtext>Q</mtext> <mtext>ice</mtext> </msub> <mo>=</mo> <mtext>KA</mtext> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>200</mtext> <mo>-</mo> <mn>0</mn> </mrow> </mfenced> </mrow> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>1.5</mtext> <mo>-</mo> <mi>x</mi> </mrow> </mfenced> </mrow> </mfrac> <mo>×</mo> <mtext>t</mtext> </mrow> </math><br /><br /><strong><u><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013985_AnsExp1_1.jpg\" /></u></strong><br /><br />So ice melted by this heat<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <msub> <mtext>m</mtext> <mtext>ice</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>Q</mtext> <mtext>ice</mtext> </msub> </mrow> <mrow> <msub> <mtext>L</mtext> <mtext>F</mtext> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>KA</mtext> </mrow> <mrow> <mtext>80</mtext> </mrow> </mfrac> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>200</mtext> <mo>-</mo> <mn>0</mn> </mrow> </mfenced> </mrow> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>1.5</mtext> <mo>-</mo> <mi>x</mi> </mrow> </mfenced> </mrow> </mfrac> <mo>×</mo> <mtext>t</mtext> </mrow> </math><br /><br />Similarly heat conducted by the rod to the water at 100<sup>o</sup>C in time t,<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <msub> <mtext>Q</mtext> <mtext>water</mtext> </msub> <mo>=</mo> <mtext>KA</mtext> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>200</mtext> <mo>-</mo> <mtext>100</mtext> </mrow> </mfenced> </mrow> <mrow> <mi>x</mi> </mrow> </mfrac> <mtext>t</mtext> </mrow> </math><br /><br />So steam formed by this heat<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <msub> <mtext>m</mtext> <mtext>steam</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>Q</mtext> <mtext>water</mtext> </msub> </mrow> <mrow> <msub> <mtext>L</mtext> <mtext>V</mtext> </msub> </mrow> </mfrac> <mo>=</mo> <mtext>KA</mtext> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>200</mtext> <mo>-</mo> <mtext>100</mtext> </mrow> </mfenced> </mrow> <mrow> <mtext>540</mtext> <mo>×</mo> <mi>x</mi> </mrow> </mfrac> <mtext>t</mtext> </mrow> </math><br /><br />According to given problem m<sub>ice</sub> = m<sub>steam</sub>, i.e.,<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mfrac> <mrow> <mtext>200</mtext> </mrow> <mrow> <mtext>80</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>1.5</mtext> <mo>-</mo> <mi>x</mi> </mrow> </mfenced> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>100</mtext> </mrow> <mrow> <mtext>540</mtext> <mo>×</mo> <mi>x</mi> </mrow> </mfrac> <mspace width=\"0.5em\"></mspace> <mtext>or</mtext> <mspace width=\"0.5em\"></mspace> <mi>x</mi> <mo>=</mo> <mfrac> <mrow> <mn>6</mn> </mrow> <mrow> <mtext>58</mtext> </mrow> </mfrac> <mtext>m</mtext> <mo>=</mo> <mtext>10.34 cm</mtext> </mrow> </math><br /><br />i.e., 200<sup>o</sup>C temperature must be maintained at a distance 10.34 cm from water at 100<sup>o</sup>C.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a637b13b7f6ef779", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "01", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A partition wall has two layers of different materials <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> in contact with each other. They have the same thickness but the thermal conductivity of layer <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> is twice that of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>. At steady state, if the temperature difference across the layer <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math>, then the corresponding temperature difference across the layer <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> is", "image": null}, "options": [{"id": "5yyxJ", "text": "<math> <mrow>  <mtext>50&#x00A0;K</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "egkBt", "text": "<math> <mrow>  <mtext>12</mtext><mtext>.5&#x00A0;K</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "jHhTL", "text": "<math> <mrow> <mtext>25&nbsp;K</mtext></mrow> </math>", "image": null, "isCorrect": true}, {"id": "agy3I", "text": "<math> <mrow>  <mtext>60&#x00A0;K</mtext></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/edshupqdgrjllnyhjlvhhtkxdfiimnspyxpxfgbrgzsyxpybus.jpeg\" /><br /><br />Let <math><mi>T</mi></math> be the junction temperature<br /><br />Here, <math><msub><mrow><mi>K</mi></mrow><mrow><mi>A</mi></mrow></msub><mo>=</mo><mn>2</mn><msub><mrow><mi>K</mi></mrow><mrow><mi>B</mi></mrow></msub><mo>,</mo><mi>&nbsp;</mi><mi>T</mi><mo>-</mo><msub><mrow><mi>T</mi></mrow><mrow><mi>B</mi></mrow></msub><mo>=</mo><mn>50</mn><mi>K</mi></math><br /><br />At the steady state <math><msub><mrow><mi>H</mi></mrow><mrow><mi>A</mi></mrow></msub><mo>=</mo><msub><mrow><mi>H</mi></mrow><mrow><mi>B</mi></mrow></msub></math><br /><br /><math> <mrow>  <mo>&#x21D2;</mo><mo>&#x00A0;</mo><mo>&#x00A0;</mo><mo>&#x00A0;</mo><mo>&#x00A0;</mo><mo>&#x00A0;</mo><mfrac>   <mrow>    <msub>     <mi>K</mi>     <mi>A</mi>    </msub>    <mi>A</mi><mfenced>     <mrow>      <msub>       <mi>T</mi>       <mi>A</mi>      </msub>      <mo>&#x2212;</mo><mi>T</mi></mrow>    </mfenced></mrow>   <mrow>    <mfrac>     <mi>L</mi>     <mn>2</mn>    </mfrac>    </mrow>  </mfrac>  <mo>=</mo><mfrac>   <mrow>    <msub>     <mi>K</mi>     <mi>B</mi>    </msub>    <mi>A</mi><mo>&#x00A0;</mo><mfenced>     <mrow>      <mi>T</mi><mo>&#x2212;</mo><msub>       <mi>T</mi>       <mi>B</mi>      </msub>      </mrow>    </mfenced></mrow>   <mrow>    <mfrac>     <mi>L</mi>     <mn>2</mn>    </mfrac>    </mrow>  </mfrac>  </mrow></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mn>2</mn><msub><mrow><mi>K</mi></mrow><mrow><mi>B</mi></mrow></msub><mi>&nbsp;</mi><mfenced separators=\"|\"><mrow><msub><mrow><mi>T</mi></mrow><mrow><mi>A</mi></mrow></msub><mo>-</mo><mi>T</mi></mrow></mfenced><mo>=</mo><msub><mrow><mi>K</mi></mrow><mrow><mi>B</mi></mrow></msub><mi>&nbsp;</mi><mfenced separators=\"|\"><mrow><mi>T</mi><mo>-</mo><msub><mrow><mi>T</mi></mrow><mrow><mi>B</mi></mrow></msub></mrow></mfenced></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>T</mi></mrow><mrow><mi>A</mi></mrow></msub><mo>-</mo><mi>T</mi><mo>=</mo><mfrac><mrow><mi>T</mi><mo>-</mo><msub><mrow><mi>T</mi></mrow><mrow><mi>B</mi></mrow></msub></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>50</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mn>25</mn><mi>&nbsp;</mi><mi>K</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86394fe6a185f23bb93", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "101", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Three rods made of the same material and having the same cross-section are joined as shown in the figure. Each rod is of the same length. What is the temperature at the junction of the three rods (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>)?<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0034219_Questiona..jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 218px; height: 143px;\" />", "image": null}, "options": [], "correctValue": "60", "solution": {"text": "Let the temperature of function be <math><mi mathvariant=\"normal\">θ</mi></math>, then<br /><br /><math><mi>H</mi><mo>=</mo><msub><mrow><mi>H</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>H</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br /><math><mo>⇒&nbsp;&nbsp;&nbsp;</mo></math> <math><mfrac><mrow><mi>K</mi><mi>A</mi><mo>(</mo><mi mathvariant=\"normal\">θ</mi><mo>-</mo><mn>0</mn><mo>)</mo></mrow><mrow><mi>L</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>K</mi><mi>A</mi><mo>(</mo><mn>90</mn><mo>-</mo><mi mathvariant=\"normal\">θ</mi><mo>)</mo></mrow><mrow><mi>L</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>K</mi><mi>A</mi><mo>(</mo><mn>90</mn><mo>-</mo><mi mathvariant=\"normal\">θ</mi><mo>)</mo></mrow><mrow><mi>L</mi></mrow></mfrac></math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-08-27_at_2.54.59_PM.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 200px; height: 147px;\" /><br /><br />Or <math><mi mathvariant=\"normal\">θ</mi><mo>=</mo><mn>90</mn><mo>-</mo><mi mathvariant=\"normal\">θ</mi><mo>+</mo><mn>90</mn><mo>-</mo><mi mathvariant=\"normal\">θ</mi></math><br /><br />Or <math><mi mathvariant=\"normal\">θ</mi><mo>=</mo><mn>180</mn><mo>-</mo><mn>2</mn><mi mathvariant=\"normal\">θ</mi></math><br /><br />Or <math><mn>3</mn><mi mathvariant=\"normal\">θ</mi><mo>=</mo><mn>180</mn></math><br /><br />Or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">θ</mi><mo>=</mo><mn>60</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">℃</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86390f275a5758d2093", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "107", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Ice starts forming in a lake where the water is at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> and the ambient temperature is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>1</mn><mn>0</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. If the time taken for <math><mn>1</mn><mi>&nbsp;</mi><mn>c</mn><mn>m</mn></math> of ice to be formed is&nbsp;<math><mi>7 hours</mi></math>, then the time taken for the thickness of ice to change from <math><mn>1</mn><mi>&nbsp;</mi><mn>c</mn><mn>m</mn></math> to <math><mn>2</mn><mi>&nbsp;</mi><mn>c</mn><mn>m</mn></math> is", "image": null}, "options": [{"id": "IBj8D", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>&#xA0;</mo><mi>hours</mi></math>", "image": null, "isCorrect": false}, {"id": "Yqvzb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>14</mn><mo>&#xA0;</mo><mi>hours</mi></math>", "image": null, "isCorrect": false}, {"id": "jrmDx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10.5</mn><mo>&#xA0;</mo><mi>hours</mi></math>", "image": null, "isCorrect": false}, {"id": "79UUo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>21</mn><mo>&#xA0;</mo><mi>hours</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>If at some time&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">t</mi></math>,&nbsp;the thickness of ice is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi></math>&nbsp;and at time&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">t</mi><mo>+</mo><mi>dt</mi></math>, the thickeness is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi><mo>+</mo><mi>dx</mi></math>, then</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>&#961;Adx</mi></mfenced><msub><mi mathvariant=\"normal\">L</mi><mi>fusion</mi></msub><mo>=</mo><mfrac><mrow><mi>kA</mi><mfenced><mrow><mn>0</mn><mo>-</mo><mfenced><mrow><mo>-</mo><mn>10</mn></mrow></mfenced></mrow></mfenced></mrow><mi mathvariant=\"normal\">x</mi></mfrac><mi>dt</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#8710;</mo><mi mathvariant=\"normal\">t</mi><mo>=</mo><mfrac><mrow><mi>&#961;</mi><msub><mi mathvariant=\"normal\">L</mi><mi>fusion</mi></msub></mrow><mrow><mn <mtext>C</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "O44rO", "text": "<math> <mrow>  <msup>   <mrow>    <mtext>40</mtext></mrow>   <mo>&#x2218;</mo>  </msup>  <mtext>&#x2009;</mtext><mtext>C</mtext></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Treating the given network of rods in terms of thermal resistance R<sub>x</sub> and R<sub>y</sub> with<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <msub> <mtext>R</mtext> <mtext>x</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mtext>L</mtext> </mrow> <mrow> <mtext>A</mtext> <mo>×</mo> <mtext>0.92</mtext> </mrow> </mfrac> <mspace width=\"0.5em\"></mspace> <mtext>and</mtext> <mspace width=\"0.5em\"></mspace> <msub> <mtext>R</mtext> <mtext>y</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mtext>L</mtext> </mrow> <mrow> <mtext>A</mtext> <mo>×</mo> <mtext>0.46</mtext> </mrow> </mfrac> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mtext>as R</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>L</mtext> </mrow> <mrow> <mtext>AK</mtext> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math><br /><br />so that if &nbsp; R<sub>x</sub> = R, &nbsp;R<sub>y</sub> = 2R<sub>x</sub> = 2R<br /><br />Now as in this bridge [(P/Q) = (R/S)], so the bridge is balanced, i.e., the temperature at junctions C and D is equal and the rod CD becomes ineffective as no heat will flow through it.<br /><br />Now as the thermal resistance of the bridge between junctions B and E is<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <msub> <mtext>R</mtext> <mtext>BE</mtext> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>R</mtext> <mo>+</mo> <mtext>R</mtext> </mrow> </mfenced> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>2R</mtext> <mo>+</mo> <mtext>2R</mtext> </mrow> </mfenced> </mrow> </mfrac> <mtext>,</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>i.e.,</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <msub> <mtext>R</mtext> <mtext>BE</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mn>4</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> <mtext>R</mtext> </mrow> </math><br /><br />The total resistance of bridge between A and E will be<br /><br />&nbsp; &nbsp; &nbsp; R<sub>eq</sub> = R<sub>AB</sub> + R<sub>BE</sub> = 2R + (4/3) R = (10/3) R<br /><br />So the net rate of flow of heat through the bridge will be<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mfrac> <mrow> <mtext>dQ</mtext> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>Δ</mtext> <mtext>θ</mtext> </mrow> <mrow> <msub> <mtext>R</mtext> <mtext>eq</mtext> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>60</mtext> <mo>-</mo> <mtext>10</mtext> </mrow> </mfenced> </mrow> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>10/3</mtext> </mrow> </mfenced> <mtext>R</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>15</mtext> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </math><br /><br />Now if T<sub>B</sub> is the temperature at B,<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mo>[</mo> <mfrac> <mrow> <mtext>dQ</mtext> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> <msub> <mo>]</mo> <mtext>AB</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mtext> m\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mfrac> <mrow> <mtext>15</mtext> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>30</mtext> <mo>-</mo> <msub> <mtext>T</mtext> <mtext>C</mtext> </msub> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <mtext>30</mtext> <mo>-</mo> <msub> <mtext>T</mtext> <mtext>D</mtext> </msub> </mrow> <mrow> <mtext>2R</mtext> </mrow> </mfrac> </mrow> </math><br /><br />and as &nbsp; &nbsp;&nbsp;T<sub>C</sub> = T<sub>D</sub> = T, &nbsp; &nbsp;30 = 3 (30 - T),<br /><br />i.e., &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;T<sub>C</sub> = T<sub>D</sub> = T = 20<sup>o</sup> C", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86381b683b14a9b763f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "67", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Which of the following cylindrical rods will conduct maximum heat, when their ends are maintained at the same temperature difference?", "image": null}, "options": [{"id": "r5Je4", "text": "<math><mi>l</mi><mo>=</mo><mn>1&nbsp;</mn><mi mathvariant=\"normal\">m</mi><mo>,</mo><mi>&nbsp;</mi><mi>r</mi><mo>=</mo><mn>0.2&nbsp;</mn><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "t0iW2", "text": "<math><mi>l</mi><mo>=</mo><mn>1&nbsp;</mn><mi mathvariant=\"normal\">m</mi><mo>,</mo><mi>&nbsp;</mi><mi>r</mi><mo>=</mo><mn>0.1&nbsp;</mn><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "SQBol", "text": "<math><mi>l</mi><mo>=</mo><mn>10&nbsp;</mn><mi mathvariant= //www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&nbsp;</mo><mi>cm</mi></math>&nbsp;and area of cross section <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>0</mn><mo>&nbsp;</mo><msup><mi>cm</mi><mn>2</mn></msup></math>&nbsp;and thermal conductivity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>336</mn><mo>&nbsp;</mo><mi>SI</mi><mo>&nbsp;</mo><mi>units</mi></math>. The ends <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&nbsp;are maintained at temperatures <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>, respectively. A point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math>&nbsp;of this rod is connected to a box <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">D</mi></math>, containing ice at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>, through a highly conducting wire of negligible heat capacity. The rate at which ice melts in the box is (assume latent heat of fusion for ice <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mi>f</mi></msub><mo>=</mo><mn>80</mn><mo>&nbsp;</mo><mi>cal</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">g</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>)<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029825_Question.jpg\" style=\"width: 249px; height: 123px;\" />", "image": null}, "options": [{"id": "6UUiN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>84</mn><mo>&nbsp;</mo><mi>mg</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "m4CxM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>84</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">g</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "9tbBz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mi>mg</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "hiWmp", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>&nbsp;</mo><mi>mg</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Thermal resistance of <math> <mrow> <mtext>AC</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>L</mtext> </mrow> <mrow> <mtext>KA</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>0.1</mtext> </mrow> <mrow> <mn>3</mn> <mn>3</mn> <mn>6</mn> <mo>×</mo> <mn>1</mn> <msup> <mn>0</mn> <mrow> <mo>-</mo> <mn>4</mn> </mrow> </msup> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <msup> <mn>0</mn> <mn>3</mn> </msup> </mrow> <mrow> <mn>3</mn> <mn>3</mn> <mn>6</mn> </mrow> </mfrac> <mo>=</mo> <mtext>R</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>let</mtext> </mrow> </mfenced> </mrow> </math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029825_Ans.jpg\" style=\"width: 243px; height: 130px;\" /><br /><br />Thermal resistance of <math> <mrow> <mtext>BC</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>0.2</mtext> </mrow> <mrow> <mn>3</mn> <mn>3</mn> <mn>6</mn> <mo>×</mo> <mn>1</mn> <msup> <mn>0</mn> <mrow> <mo>-</mo> <mn>4</mn> </mrow> </msup> </mrow> </mfrac> <mo>=</mo> <mn>2</mn> <mtext>R</mtext> </mrow> </math><br /><br />Heat flow rates are<br /><br /><math> <mrow> <msub> <mtext>H</mtext> <mn>1</mn> </msub> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> <mn>0</mn> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> <mtext>;&nbsp;&nbsp;</mtext> <msub> <mtext>H</mtext> <mn>2</mn> </msub> <mo>=</mo> <mfrac> <mrow> <mn>4</mn> <mn>0</mn> </mrow> <mrow> <mn>2</mn> <mtext>R</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> <mn>0</mn> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </math><br /><br />undefined<br /><br />&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>3</mn> <mn>4</mn> <mn>4</mn> <mn>0</mn> </mrow> <mrow> <mn>1</mn> <msup> <mn>0</mn> <mn>3</mn> </msup> </mrow> </mfrac> <mo>=</mo> <mtext>13.44 W</mtext> </mrow> </math><br /><br />Rate of melting of ice<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mtext>H</mtext><msub><mtext>L</mtext><mtext>f</mtext></msub></mfrac><mo>=</mo><mfrac><mtext>13.44/4.2</mtext><mrow><mn>8</mn><mn>0</mn></mrow></mfrac><mo>&nbsp;</mo><msup><mtext>g&nbsp;s</mtext><mtext>-1</mtext></msup><mo>=</mo><mn>4</mn><mn>0</mn><mo>&nbsp;</mo><mi>mg</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863734d25abd0f7ea2d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "42", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A point source of heat of power <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> is placed at the centre of a thin spherical shell of mean radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>. The material of the shell has thermal conductivity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi></math>. Calculate the thickness&nbsp;of the shell if the temperature difference between the outer and inner surfaces of the shell in steady-state is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math>.", "image": null}, "options": [{"id": "Zhviu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>4</mn><mi>&#960;</mi><msup><mtext mathvariant=\"italic\">R</mtext><mn>2</mn></msup><mtext mathvariant=\"italic\">KT</mtext></mrow><mrow><mtext>2</mtext><mtext mathvariant=\"italic\">P</mtext></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "z4pCy", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><mi>&#960;</mi><msup><mtext mathvariant=\"italic\">R</mtext><mn>4</mn></msup><mtext mathvariant=\"italic\">KT</mtext></mrow><mtext mathvariant=\"italic\">P</mtext></mfrac></math>", "image": null, "isCorrect": false}, {"id": "GrCr6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>4</mn><mi>&#960;</mi><msup><mtext mathvariant=\"italic\">R</mtext><mn>2</mn></msup><mtext mathvariant=\"italic\">KT</mtext></mrow><mtext mathvariant=\"italic\">P</mtext></mfrac></math>", "image": null, "isCorrect": true}, {"id": "tmTeN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mi>&#960;</mi><msup><mtext mathvariant=\"italic\">R</mtext><mn>2</mn></msup><mtext mathvariant=\"italic\">KT</mtext></mrow><mrow><mtext>3</mtext><mtext mathvariant=\"italic\">P</mtext></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Consider a concentric spherical shell of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>&nbsp;and thickness <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">d</mi><mi>r</mi></math> as shown in diagram. The radial rate of flow of heat through this shell in steady state will be,<br /><br /><strong><u><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013992_AnsExp3_1.jpg\" style=\"width: 200px; height: 197px;\" /></u></strong><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">H</mtext><mo>=</mo><mfrac><mrow><mtext>d</mtext><mtext mathvariant=\"italic\">Q</mtext></mrow><mrow><mtext>d</mtext><mtext mathvariant=\"italic\">t</mtext></mrow></mfrac><mo>=</mo><mo>-</mo><mtext mathvariant=\"italic\">KA</mtext><mfrac><mrow><mtext>d</mtext><mtext mathvariant=\"italic\">&#952;</mtext></mrow><mrow><mtext>d</mtext><mtext mathvariant=\"italic\">r</mtext></mrow></mfrac></math><br /><br />[Negative sign is used because, with an increase in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi></math>&nbsp;decreases.]<br /><br />Now as for spherical shell <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mn>4</mn><mi>&#960;</mi><msup><mi>r</mi><mn>2</mn></msup></math><br /><br />So<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mspace width=\"0.5em\"/><mtext mathvariant=\"italic\">H</mtext><mo>=</mo><mo>-</mo><mn>4</mn><mtext>&#960;</mtext><msup><mtext mathvariant=\"italic\">r</mtext><mn>2</mn></msup><mtext mathvariant=\"italic\">K</mtext><mfrac><mrow><mtext>d</mtext><mtext mathvariant=\"italic\">&#952;</mtext></mrow><mrow><mtext>d</mtext><mtext mathvariant=\"italic\">r</mtext></mrow></mfrac><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mtext>or</mtext><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><msubsup><mo>&#8747;</mo><mi>a</mi><mi>b</mi></msubsup><mfrac><mrow><mtext>d</mtext><mtext mathvariant=\"italic\">r</mtext></mrow><msup><mtext mathvariant=\"italic\">r</mtext><mn>2</mn></msup></mfrac><mo>=</mo><mo>-</mo><mfrac><mrow><mn>4</mn><mtext>&#960;</mtext><mtext mathvariant=\"italic\">K</mtext></mrow><mtext mathvariant=\"italic\">H</mtext></mfrac><msubsup><mo>&#8747;</mo><msub><mtext mathvariant=\"italic\">&#952;</mtext><mn>1</mn></msub><msub><mtext mathvariant=\"italic\">&#952;</mtext><mn>2</mn></msub></msubsup><mtext>d</mtext><mtext mathvariant=\"italic\">&#952;</mtext></math><br /><br />which on integration and simplification gives<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">H</mtext><mo>=</mo><mfrac><mrow><mtext>d</mtext><mtext mathvariant=\"italic\">Q</mtext></mrow><mrow><mtext>d</mtext><mtext mathvariant=\"italic\">t</mtext></mrow></mfrac><mo>=</mo><mtext mathvariant=\"italic\">K</mtext><mfrac><mrow><mn>4</mn><mtext>&#960;</mtext><mi>a</mi><mi>b</mi><mfenced><mrow><msub><mtext mathvariant=\"italic\">&#952;</mtext><mn>1</mn></msub><mo>-</mo><msub><mtext mathvariant=\"italic\">&#952;</mtext><mn>2</mn></msub></mrow></mfenced></mrow><mfenced><mrow><mi>b</mi><mo>-</mo><mi>a</mi></mrow></mfenced></mfrac><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mtext>...(i)</mtext></math><br /><br />Now in steady state, as no heat is absorbed, the rate of loss of heat by conduction is equal to that of supply, i.e., <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>H</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mi>P</mi></math>, and here<br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#952;</mi><mn>1</mn></msub><mo>-</mo><msub><mi>&#952;</mi><mn>2</mn></msub><mo>=</mo><mi>T</mi></math> &nbsp; and &nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">a</mtext><mo>&#8771;</mo><mtext mathvariant=\"italic\">b</mtext><mo>=</mo><mtext mathvariant=\"italic\">R</mtext></math><br /><br />So Equation (i) becomes,<br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">P</mtext><mo>=</mo><mfrac><mrow><mn>4</mn><mi>&#960;</mi><msup><mtext mathvariant=\"italic\">R</mtext><mn>2</mn></msup><mtext mathvariant=\"italic\">KT</mtext></mrow><mfenced><mrow><mtext mathvariant=\"italic\">b</mtext><mo>-</mo><mtext mathvariant=\"italic\">a</mtext></mrow></mfenced></mfrac></math><br /><br />i.e thickness of shell is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>b</mi><mo>-</mo><mi>a</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>4</mn><mi>&#960;</mi><msup><mtext mathvariant=\"italic\">R</mtext><mn>2</mn></msup><mtext mathvariant=\"italic\">KT</mtext></mrow><mtext mathvariant=\"italic\">P</mtext></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86368cd47081447a3e4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "19", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Ice starts forming in a lake where the water is at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> and the ambient temperature is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>1</mn><mn>0</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. If the time taken for <math><mn>1</mn><mi>&nbsp;</mi><mn>c</mn><mn>m</mn></math> of ice to be formed is&nbsp;<math><mi>7 hours</mi></math>, then the time taken for the thickness of ice to change from <math><mn>1</mn><mi>&nbsp;</mi><mn>c</mn><mn>m</mn></math> to <math><mn>2</mn><mi>&nbsp;</mi><mn>c</mn><mn>m</mn></math> is", "image": null}, "options": [{"id": "YEjhI", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>&#xA0;</mo><mi>hours</mi></math>", "image": null, "isCorrect": false}, {"id": "jNEL2", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>14</mn><mo>&#xA0;</mo><mi>hours</mi></math>", "image": null, "isCorrect": false}, {"id": "TDlEu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10.5</mn><mo>&#xA0;</mo><mi>hours</mi></math>", "image": null, "isCorrect": false}, {"id": "woEdL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>21</mn><mo>&#xA0;</mo><mi>hours</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>If at some time&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">t</mi></math>,&nbsp;the thickness of ice is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi></math>&nbsp;and at time&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">t</mi><mo>+</mo><mi>dt</mi></math>, the thickeness is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi><mo>+</mo><mi>dx</mi></math>, then</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>&#961;Adx</mi></mfenced><msub><mi mathvariant=\"normal\">L</mi><mi>fusion</mi></msub><mo>=</mo><mfrac><mrow><mi>kA</mi><mfenced><mrow><mn>0</mn><mo>-</mo><mfenced><mrow><mo>-</mo><mn>10</mn></mrow></mfenced></mrow></mfenced></mrow><mi mathvariant=\"normal\">x</mi></mfrac><mi>dt</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#8710;</mo><mi mathvariant=\"normal\">t</mi><mo>=</mo><mfrac><mrow><mi>&#961;</mi><msub><mi mathvariant=\"normal\">L</mi><mi>fusion</mi></msub></mrow><mrow><mn>20</mn><mi mathvariant=\"normal\">k</mi></mrow></mfrac><mfenced><mrow><msubsup><mi mathvariant=\"normal\">x</mi><mn>2</mn><mn>2</mn></msubsup><mo>-</mo><msubsup><mi mathvariant=\"normal\">x</mi><mn>1</mn><mn>2</mn></msubsup></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#8710;</mo><mi mathvariant=\"normal\">t</mi><mo>&#8733;</mo><mo>(</mo><msubsup><mi mathvariant=\"normal\">x</mi><mn>2</mn><mn>2</mn></msubsup><mo>-</mo><msubsup><mi mathvariant=\"normal\">x</mi><mn>1</mn><mn>2</mn></msubsup><mo>)</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><mo>&#8710;</mo><mi mathvariant=\"normal\">t</mi></mrow><mrow><mo>&#8710;</mo><mi mathvariant=\"normal\">t</mi><mo>'</mo></mrow></mfrac><mo>=</mo><mfrac><mrow><msubsup><mi mathvariant=\"normal\">x</mi><mn>2</mn><mn>2</mn></msubsup><mo>-</mo><msubsup><mi mathvariant=\"normal\">x</mi><mn>1</mn><mn>2</mn></msubsup></mrow><mrow><msup><mfenced><mrow><mi mathvariant=\"normal\">x</mi><msub><mo>'</mo><mn>2</mn></msub></mrow></mfenced><mn>2</mn></msup><mo>-</mo><msup><mfenced><mrow><mi mathvariant=\"normal\">x</mi><msub><mo>'</mo><mn>1</mn></msub></mrow></mfenced><mn>2</mn></msup></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mn>7</mn><mrow><mo>&#8710;</mo><mi mathvariant=\"normal\">t</mi><mo>'</mo></mrow></mfrac><mo>=</mo><mfrac><mrow><mo>(</mo><msup><mn>1</mn><mn>2</mn></msup><mo>-</mo><msup><mn>0</mn><mn>2</mn></msup><mo>)</mo></mrow><mrow><mo>(</mo><msup><mn>2</mn><mn>2</mn></msup><mo>-</mo><msup><mn>1</mn><mn>2</mn></msup><mo>)</mo></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#8710;</mo><mi mathvariant=\"normal\">t</mi><mo>'</mo><mo>=</mo><mn>21</mn><mo>&#160;</mo><mi>hours</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863668160e419ae09aa", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "38", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Four rods, of different radii <math><mi>r</mi></math> and length <math><mi>l</mi></math>, are used to connect two reservoirs of heat at different temperatures. The rod that will conduct the heat fastest will be", "image": null}, "options": [{"id": "etvMX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><mn>2</mn><mo>&nbsp;</mo><mi>cm</mi><mo>,</mo><mo>&nbsp;</mo><mi>l</mi><mo>=</mo><mtext>0.5</mtext><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": true}, {"id": "cuY0C", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><mn>1</mn><mo>&#xA0;</mo><mi>cm</mi><mo>,</mo><mo>&#xA0;</mo><mi>l</mi><mo>=</mo><mtext>0.5</mtext><mo>&#xA0;</mo><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "Qpg6L", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><mn>2</mn><mo>&#xA0;</mo><mi>cm</mi><mo>,</mo><mo>&#xA0;</mo><mi>l</mi><mo>=</mo><mtext>2</mtext><mo>&#xA0;</mo><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "9pOiQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><mn>1</mn><mo>&#xA0;</mo><mi>cm</mi><mo>,</mo><mo>&#xA0;</mo><mi>l</mi><mo>=</mo><mtext>1</mtext><mo>&#xA0;</mo><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mfrac><mrow><mo>∆</mo><mi>T</mi></mrow><mrow><mo>∆</mo><mi>t</mi></mrow></mfrac><mo>=</mo><mi>K</mi><mi>A</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mo>∆</mo><mi>T</mi></mrow><mrow><mo>∆</mo><mi>x</mi></mrow></mfrac></mrow></mfenced><mo>=</mo><mi>&nbsp;</mi><mi>K</mi><mfenced separators=\"|\"><mrow><mi>π</mi><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced><mfrac><mrow><mo>∆</mo><mi>T</mi></mrow><mrow><mfenced separators=\"|\"><mrow><mi>l</mi></mrow></mfenced></mrow></mfrac></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mo>∆</mo><mi>Q</mi></mrow><mrow><mo>∆</mo><mi>t</mi></mrow></mfrac></mrow></mfenced><mi>&nbsp;</mi><mo>∝</mo><mfrac><mrow><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>l</mi></mrow></mfrac><mi>&nbsp;</mi></math>, which is maximum in this case.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863660853a8ec3aafa1", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "35", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two rods of the same length and material transfer a given amount of heat in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">s</mi></math>, when they are joined end to end, i.e. in series. When they are joined in parallel, they will transfer the same heat under the same conditions in", "image": null}, "options": [{"id": "xTj0Y", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>24</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "H0XUa", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": true}, {"id": "reAUD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>48</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "VvdUc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1.5</mn><mo>&#xA0;</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi mathvariant=\"normal\">t</mi><mo>=</mo><mfrac><mrow><mo>&#8710;</mo><mi mathvariant=\"normal\">Q</mi><mfenced separators=\"|\"><mrow><mo>&#8710;</mo><mi mathvariant=\"normal\">x</mi></mrow></mfenced></mrow><mrow><mi>KA</mi><mfenced separators=\"|\"><mrow><mo>&#8710;</mo><mi mathvariant=\"normal\">T</mi></mrow></mfenced></mrow></mfrac></math><br /><br />When two rods of same length are joined in parallel,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">&#160;</mi><mo>&#8594;</mo><mn>2</mn><mi mathvariant=\"normal\">&#160;</mi><mi>and</mi><mi mathvariant=\"normal\">&#160;</mi><mfenced separators=\"|\"><mrow><mo>&#8710;</mo><mi mathvariant=\"normal\">x</mi></mrow></mfenced><mo>&#8594;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi mathvariant=\"normal\">&#160;</mi><mi>times</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi mathvariant=\"normal\">&#160;</mi><mo>&#8710;</mo><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">&#160;</mi><mi>becomes</mi><mfrac><mn>1</mn><mn>4</mn></mfrac><mi mathvariant=\"normal\">&#160;</mi><mi>times</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">i</mi><mo>.</mo><mi mathvariant=\"normal\">e</mi><mo>.</mo><mo>,</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>&#215;</mo><mn>12</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi><mo>=</mo><mn>3</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636276cb42a4229382", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "58", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A rod of length&nbsp;<math><mrow><mtext mathvariant=\"italic\">l</mtext></mrow></math> (laterally thermally insulated) of the uniform cross-sectional area <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;consists of a material whose thermal conductivity varies with temperature as <math> <mrow> <mtext mathvariant=\"italic\">K</mtext> <mo>=</mo> <mfrac> <mrow> <msub> <mtext mathvariant=\"italic\">K</mtext> <mn>0</mn> </msub> </mrow> <mrow> <mtext mathvariant=\"italic\">a</mtext> <mo>+</mo> <mtext mathvariant=\"italic\">bT</mtext></mrow></mfrac></mrow></math>, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mn>0</mn></msub></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>b</mi></math>&nbsp;are constants. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>2</mn></msub></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>&lt;</mo><mo>&nbsp;</mo><msub><mi>T</mi><mn>1</mn></msub></mrow></mfenced></math> are the temperatures of two ends of the rod. Then, the rate of flow of heat across the rod is</p>\r", "image": null}, "options": [{"id": "8WWeJ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>A</mi><msub><mi>K</mi><mn>0</mn></msub></mrow><mrow><mi>b</mi><mi>l</mi></mrow></mfrac><mfenced><mfrac><mrow><mi>a</mi><mo>+</mo><mi>b</mi><msub><mi>T</mi><mn>1</mn></msub></mrow><mrow><mi>a</mi><mo>+</mo><mi>b</mi><msub><mi>T</mi><mn>2</mn></msub></mrow></mfrac></mfenced></math>", "image": null, "isCorrect": false}, {"id": "2JC7L", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mtext mathvariant=\"italic\">AK</mtext><mn>0</mn></msub><mrow><mi>b</mi><mi>l</mi></mrow></mfrac><mfenced><mfrac><mrow><mi>a</mi><mo>+</mo><mi>b</mi><msub><mi>T</mi><mn>2</mn></msub></mrow><mrow><mi>a</mi><mo>+</mo><mi>b</mi><msub><mi>T</mi><mn>1</mn></msub></mrow></mfrac></mfenced></math>", "image": null, "isCorrect": false}, {"id": "yGAsm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mtext mathvariant=\"italic\">K</mtext><mn>0</mn></msub><mtext mathvariant=\"italic\">A</mtext></mrow><mrow><mtext mathvariant=\"italic\">b</mtext><mi>l</mi><mo>&#8289;</mo></mrow></mfrac><mtext>ln</mtext><mfenced open=\"[\" close=\"]\"><mfrac><mrow><mtext mathvariant=\"italic\">a</mtext><mo>+</mo><msub><mtext mathvariant=\"italic\">bT</mtext><mn>1</mn></msub></mrow><mrow><mtext mathvariant=\"italic\">a</mtext><mo>+</mo><msub><mtext mathvariant=\"italic\">bT</mtext><mn>2</mn></msub></mrow></mfrac></mfenced></math>", "image": null, "isCorrect": true}, {"id": "so0kh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mtext mathvariant=\"italic\">AK</mtext><mn>0</mn></msub><mrow><mi>b</mi><mi>l</mi></mrow></mfrac><mtext>ln</mtext><mfenced open=\"[\" close=\"]\"><mfrac><mrow><mi>a</mi><mo>+</mo><mi>b</mi><msub><mi>T</mi><mn>2</mn></msub></mrow><mrow><mi>a</mi><mo>+</mo><mi>b</mi><msub><mi>T</mi><mn>1</mn></msub></mrow></mfrac></mfenced></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As, we know that,<br /><br /><math> <mrow> <mo>⇒&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</mo> <mfrac> <mrow> <mtext mathvariant=\"italic\">dQ</mtext> </mrow> <mrow> <mtext mathvariant=\"italic\">dt</mtext> </mrow> </mfrac> <mo>=</mo> <mo>-</mo> <mtext mathvariant=\"italic\">KA</mtext> <mfrac> <mrow> <mtext mathvariant=\"italic\">dT</mtext> </mrow> <mrow> <mtext mathvariant=\"italic\">dx</mtext> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>⇒&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</mo> <mfrac> <mrow> <mtext mathvariant=\"italic\">dQ</mtext> </mrow> <mrow> <mtext mathvariant=\"italic\">dt</mtext> </mrow> </mfrac> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <msub> <mtext mathvariant=\"italic\">K</mtext> <mn>0</mn> </msub> <mtext mathvariant=\"italic\">A</mtext> </mrow> <mrow> <mtext mathvariant=\"italic\">a</mtext> <mo>+</mo> <mtext mathvariant=\"italic\">bT</mtext> </mrow> </mfrac> <mfrac> <mrow> <mtext mathvariant=\"italic\">dT</mtext> </mrow> <mrow> <mtext mathvariant=\"italic\">dx</mtext> </mrow> </mfrac> </mrow> </math><br /><br />On integrating both sides within the proper limits.<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mtext mathvariant=\"italic\">dQ</mtext><mtext mathvariant=\"italic\">dt</mtext></mfrac><msubsup><mo>∫</mo><mn>0</mn><mrow><mi>l</mi><mo>⁡</mo></mrow></msubsup><mtext mathvariant=\"italic\">dx</mtext><mo>=</mo><mo>-</mo><msub><mtext mathvariant=\"italic\">K</mtext><mn>0</mn></msub><mtext mathvariant=\"italic\">A</mtext><msubsup><mo>∫</mo><msub><mtext mathvariant=\"italic\">T</mtext><mn>1</mn></msub><msub><mtext mathvariant=\"italic\">T</mtext><mn>2</mn></msub></msubsup><mfrac><mtext mathvariant=\"italic\">dT</mtext><mrow><mtext mathvariant=\"italic\">a</mtext><mo>+</mo><mtext mathvariant=\"italic\">bT</mtext></mrow></mfrac></math><br /><br />This gives,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mtext mathvariant=\"italic\">dQ</mtext><mtext mathvariant=\"italic\">dt</mtext></mfrac><mo>=</mo><mfrac><mrow><msub><mtext mathvariant=\"italic\">K</mtext><mn mathvariant=\"italic\">0</mn></msub><mtext mathvariant=\"italic\">A</mtext></mrow><mrow><mtext mathvariant=\"italic\">b</mtext><mi>l</mi><mo>⁡</mo></mrow></mfrac><mtext>ln</mtext><mfenced close=\"]\" open=\"[\"><mfrac><mrow><mtext mathvariant=\"italic\">a</mtext><mo>+</mo><msub><mtext mathvariant=\"italic\">bT</mtext><mn>1</mn></msub></mrow><mrow><mtext mathvariant=\"italic\">a</mtext><mo>+</mo><msub><mtext mathvariant=\"italic\">bT</mtext><mn>2</mn></msub></mrow></mfrac></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86349ab4fb859543a6f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "75", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Three rods of identical cross-sectional area and made from the same metal form the sides of an isosceles triangle <em><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ABC</mi></math></em> right angled at <em><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math></em>. The points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&nbsp;are maintained at temperatures <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>2</mn></msqrt><mi>T</mi></math>, respectively, in the steady-state. Assuming that only heat conduction takes place, the temperature of the point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math> is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0026604_question.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 144px; height: 123px;\" />", "image": null}, "options": [{"id": "JTi78", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><mi>T</mi></mrow><mrow><msqrt><mn>2</mn></msqrt><mo>+</mo><mn>1</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "jCaqY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>T</mi><mrow><msqrt><mn>2</mn></msqrt><mo>+</mo><mn>1</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "Kybp9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>T</mi><mrow><mn>3</mn><mfenced><mrow><msqrt><mn>2</mn></msqrt><mo>-</mo><mn>1</mn></mrow></mfenced></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "B1jOZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>T</mi><mrow><msqrt><mn>2</mn></msqrt><mo>-</mo><mn>1</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As T<sub>B</sub> &gt; T<sub>A</sub>, heat flows from <em>B</em> to <em>A</em> through both paths <em>BA</em> and <em>BCA</em>.<br />Rate of heat flow in BC = Rate of heat flow in CA<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>K</mi><mi>A</mi><mfenced><mrow><msqrt><mn>2</mn></msqrt><mi>T</mi><mo>-</mo><msub><mi>T</mi><mtext>c</mtext></msub></mrow></mfenced></mrow><mi>l</mi></mfrac><mo>=</mo><mfrac><mrow><mtext mathvariant=\"italic\">KA</mtext><mfenced><mrow><msub><mtext mathvariant=\"italic\">T</mtext><mtext>c</mtext></msub><mo>-</mo><mtext mathvariant=\"italic\">T</mtext></mrow></mfenced></mrow><mrow><msqrt><mn>2</mn></msqrt><mi>l</mi></mrow></mfrac></math><br /><br />Solving this, we get&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mtext>c</mtext></msub><mo>=</mo><mfrac><mrow><mn>3</mn><mi>T</mi></mrow><mrow><msqrt><mn>2</mn></msqrt><mo>+</mo><mn>1</mn></mrow></mfrac></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0026604_Ans.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 154px; height: 164px;\" /></strong></u>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634870ad97c76c6d75", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "74", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A metal rod of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> has cross-sectional areas <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>A</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> as shown in the figure. The ends are maintained at temperatures <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>70</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. The temperature at middle point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math>&nbsp;(in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>) is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Q_33.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 300px; height: 131px;\" />", "image": null}, "options": [], "correctValue": "90", "solution": {"text": "Let <math> <mrow> <mi>θ</mi> </mrow> </math> be temperature of the middle point C and in the series, rate of heat flow is the same.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒ &nbsp; &nbsp;</mo><mi>K</mi><mfenced><mrow><mn>2</mn><mi>A</mi></mrow></mfenced><mfenced><mrow><mn>1</mn><mn>0</mn><msup><mn>0</mn><mo>∘</mo></msup><mo>-</mo><mi>θ</mi></mrow></mfenced><mo>=</mo><mi>K</mi><mi>A</mi><mfenced><mrow><mi>θ</mi><mo>-</mo><mn>7</mn><msup><mn>0</mn><mo>∘</mo></msup></mrow></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒ &nbsp;</mo><mn>2</mn><mn>0</mn><mn>0</mn><mo>-</mo><mn>2</mn><mi>θ</mi><mo>=</mo><mi>θ</mi><mo>-</mo><mn>7</mn><mn>0</mn><mo>⇒</mo><mn>3</mn><mi>θ</mi><mo>=</mo><mn>2</mn><mn>7</mn><mn>0</mn><mo>⇒</mo><mi>θ</mi><mo>=</mo><mn>90</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634705276be5b71f16", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "98", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>56</mn><mo>×</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi></math>&nbsp;of heat is conducted through is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math> wall of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>&nbsp;</mo><mi>cm</mi></math> thick in one hour. The temperature difference between the two sides of the wall is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">℃</mi></math>. What is the thermal conductivity of the material of the wall (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">W</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn><mi mathvariant=\"normal\">&nbsp;</mi></mrow></msup><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>)?", "image": null}, "options": [], "correctValue": "0.13", "solution": {"text": "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>Q</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>K</mi><mi>A</mi><mo>&#8710;</mo><mi>T</mi></mrow><mi>x</mi></mfrac></math><br /><br /><math><mfrac><mrow><mn>1.56</mn><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>5</mn></mrow></msup></mrow><mrow><mn>3600</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>K</mi><mo>&#215;</mo><mn>2</mn><mo>&#215;</mo><mn>20</mn></mrow><mrow><mn>12</mn><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfrac></math><br /><br /><math><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>K</mi><mo>=</mo><mfrac><mrow><mn>1.56</mn><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>5</mn></mrow></msup><mo>&#215;</mo><mn>12</mn><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow><mrow><mn>3600</mn><mo>&#215;</mo><mn>2</mn><mo>&#215;</mo><mn>10</mn></mrow></mfrac></math><br /><br /><math><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mo>=</mo><mfrac><mro
