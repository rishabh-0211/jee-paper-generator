020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two rectangular blocks <math><mi mathvariant=\"normal\">A</mi></math> and <math><mi mathvariant=\"normal\">B</mi></math> of different metals have the same length and the same area of cross-section. They are kept with their lengths aligned and their cross-sections in contact. The temperature at one end of <math><mi mathvariant=\"normal\">A</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> and that of at the other end&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0&nbsp;</mn><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. If the ratio of their thermal conductivity is <math><mn>1</mn><mo>:</mo><mn>3</mn></math>, then under steady-state, what will be the temperature (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>) of the junction?", "image": null}, "options": [], "correctValue": "25", "solution": {"text": "it is given that <math><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>&#8658;</mo><msub><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mi mathvariant=\"normal\">K</mi></math>&nbsp; then <math><msub><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>3</mn><mi mathvariant=\"normal\">K</mi></math><br />The temperature of the junction in contact<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi><mo>=</mo><mfrac><mrow><msub><mi>K</mi><mn>1</mn></msub><msub><mi>&#952;</mi><mn>1</mn></msub><mo>+</mo><msub><mi>K</mi><mn>2</mn></msub><msub><mi>&#952;</mi><mn>2</mn></msub></mrow><mrow><msub><mi>K</mi><mn>1</mn></msub><mo>+</mo><msub><mi>K</mi><mn>2</mn></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn><mo>&#215;</mo><mn>100</mn><mo>+</mo><mn>3</mn><mo>&#215;</mo><mn>0</mn></mrow><mrow><mn>1</mn><mo>+</mo><mn>3</mn></mrow></mfrac><mo>=</mo><mfrac><mn>100</mn><mn>4</mn></mfrac><mo>=</mo><mn>25</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/c016bdde-d918-46df-8ac3-6da6d957f419.png\" style=\"width:2.51389in;height:1.46667in\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633cdf1158fe9a7548", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "43", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A rod of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi></math> with thermally insulated lateral surface consists of material whose heat conductivity coefficient varies with temperature as <math><mi>K</mi><mfenced separators=\"|\"><mrow><mi>x</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mi>α</mi></mrow><mrow><mi>T</mi></mrow></mfrac></math> (here <math><mi mathvariant=\"normal\">α</mi></math> is a positive constant). The ends of the rod are kept at temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>2</mn></msub></math> (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>1</mn></msub><mo>&gt;</mo><msub><mi>T</mi><mn>2 mn></mrow></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>182.12</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">W</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e808fff45531c1f7", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "68", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The rates of heat radiation from two patches of skin each of area&nbsp;<math><mi>A</mi></math>,&nbsp;on a patient&#39;s chest differ by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>%</mo></math>. If the patch of the lower temperature is at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math> and emissivity of both the patches is assumed to be unity, then what is the approximate temperature (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">K</mi></math>) of the other patch? [Ignore all the higher-order terms in approximation]", "image": null}, "options": [], "correctValue": "301.5", "solution": {"text": "According to Stefan's law.<br /><br /><math><msub><mrow><mi>E</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mi>σ</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">d</mi><mi>&nbsp;</mi><msub><mrow><mi>E</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mi>σ</mi><msup><mrow><mfenced separators=\"|\"><mrow><mi>T</mi><mo>+</mo><mo>∆</mo><mi>T</mi></mrow></mfenced></mrow><mrow><mn>4</mn></mrow></msup></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><msub><mrow><mi>E</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>-</mo><msub><mrow><mi>E</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>E</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mi>&nbsp;</mi><mfrac><mrow><mi>σ</mi><msup><mrow><mo>[</mo><mfenced separators=\"|\"><mrow><mi>T</mi><mo>+</mo><mo>∆</mo><mi>T</mi></mrow></mfenced></mrow><mrow><mn>4</mn></mrow></msup><mo>-</mo><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup><mo>]</mo></mrow><mrow><mi>σ</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup></mrow></mfrac><mo>=</mo><mn>4</mn><mfrac><mrow><mo>∆</mo><mi>T</mi></mrow><mrow><mi>T</mi></mrow></mfrac></math><br /><br />Now, <math><mfrac><mrow><msub><mrow><mi>E</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>-</mo><msub><mrow><mi>E</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>E</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>100</mn></mrow></mfrac><mo>=</mo><mn>4</mn><mfrac><mrow><mo>∆</mo><mi>T</mi></mrow><mrow><mn>300</mn></mrow></mfrac><mi>&nbsp;</mi></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mo>∆</mo><mi>T</mi><mo>=</mo><mi>&nbsp;</mi><mfrac><mrow><mn>300</mn><mo>×</mo><mn>2</mn></mrow><mrow><mn>4</mn><mo>×</mo><mn>100</mn></mrow></mfrac><mo>=</mo><mn>1.5</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">K</mi></math><br /><br /><math><mo>∴</mo></math> Temperature of other patch = <math><mi>T</mi><mo>+</mo><mo>∆</mo><mi>T</mi></math><br /><br />= 300 +1.5 = 301.5 K", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d1f59937a0748b8f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "63", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A black body of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>34</mn><mo>.</mo><mn>38</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">g</mi></math> and surface area <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>19</mn><mo>.</mo><mn>2</mn><mo>&nbsp;</mo><msup><mi>cm</mi><mn>2</mn></msup></math> is at an initial temperature of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>400</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math>. It is allowed to cool inside an evacuated enclosure kept at constant temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math>. The rate of cooling is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>04</mn><mo>&nbsp;</mo></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>°</mo><mi mathvariant=\"normal\">C</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. The specific heat of the body in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">J</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><msup><mi mathvariant=\"normal\">g</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> is<br />\r(Stefan's constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>σ</mi><mo>=</mo><mn>5.73</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>8</mn></mrow></msup><mi>&nbsp;</mi><mi mathvariant=\"normal\">W</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>4</mn></mrow></msup></math>)", "image": null}, "options": [{"id": "5tzKl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2800</mn></math>", "image": null, "isCorrect": false}, {"id": "AeqXd", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2100</mn></math>", "image": null, "isCorrect": false}, {"id": "WBd0O", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1400</mn></math>", "image": null, "isCorrect": true}, {"id": "0CfhC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1200</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Newtons's law of cooling<br /><br /><math><mfrac><mrow><mi>d</mi><mi mathvariant=\"normal\">θ</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>σ</mi><mi>A</mi><mo>(</mo><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup><mo>-</mo><msubsup><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>4</mn></mrow></msubsup><mo>)</mo></mrow><mrow><mi>m</mi><mi>s</mi></mrow></mfrac></math><br /><br /><math><mo>∴</mo></math> Specific heat <math><mi>s</mi><mo>⁡</mo> <mo>=</mo><mfrac><mrow><mi>σ</mi><mi>A</mi><mo>(</mo><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup><mo>-</mo><msubsup><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>4</mn></mrow></msubsup><mo>)</mo></mrow><mrow><mi>m</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>d</mi><mi mathvariant=\"normal\">θ</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mrow></mfenced></mrow></mfrac></math><br /><br />Substituting the values<br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>s</mi><mo>=</mo><mfrac><mrow><mfenced separators=\"|\"><mrow><mn>5.73</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>8</mn></mrow></msup></mrow></mfenced><mfenced separators=\"|\"><mrow><mn>19.2</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>4</mn></mrow></msup></mrow></mfenced><mo>[</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>4</mn></mrow></mfenced></mrow><mrow><mn>4</mn></mrow></msup><mo>-</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>3</mn></mrow></mfenced></mrow><mrow><mn>4</mn></mrow></msup><mo>]</mo><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>8</mn></mrow></msup></mrow><mrow><mfenced separators=\"|\"><mrow><mn>34.38</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></mrow></mfenced><mo>(</mo><mn>4</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>)&nbsp; &nbsp; &nbsp;</mo></mrow></mfrac><mo>=</mo><mn>1400</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c1bc8c94e49249be", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "77", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The radiation emitted by the surface of the Sun emits maximum power at a wavelength of about <math><mn>500</mn></math> <math><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">m</mi></math>. Assuming the Sun to be a blackbody emitter. If its surface temperature <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">K</mi></mrow></mfenced></math> is given by <math><mi mathvariant=\"normal\">α</mi><mo>∙</mo><mi mathvariant=\"normal\">β</mi><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mi mathvariant=\"normal\">γ</mi></mrow></msup></math> then fill the value of <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">α</mi><mo>+</mo><mi mathvariant=\"normal\">β</mi><mo>+</mo><mi mathvariant=\"normal\">γ</mi></mrow></mfenced></math>. (Wien’s constant is given by <math><mn>2.898</mn></math> <math><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">m&nbsp;</mi><mi mathvariant=\"normal\">K</mi></math> )", "image": null}, "options": [], "correctValue": "16", "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi><mo>=</mo><mn>500</mn></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>nm</mi></math>, <math><mi mathvariant=\"italic\">T</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"italic\">b</mi></mrow><mrow><mi mathvariant=\"italic\">&#955;</mi></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mo>.898</mo><mo>&#160;</mo><mi>mm</mi></mrow><mrow><mn>500</mn><mo>&#160;</mo><mi>nm</mi></mrow></mfrac><mo>=</mo><mn>5</mn><mo>.8</mo><mo>&#215;</mo><msup><mn>10</mn><mn>3</mn></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863bcdcaf52cf3a3172", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "40", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The power radiated by a black-body is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>0</mn></msub></math>&nbsp;and it radiates maximum energy around the wavelength <math><msub><mrow><mi>λ</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>.</mo></math> If the temperature of the black-body is now changed so that it radiates maximum energy around a wavelength <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac bevelled=\"true\"><mrow><mn>3</mn><msub><mi>λ</mi><mn>0</mn></msub></mrow><mn>4</mn></mfrac></math>, then the power radiated by it will be", "image": null}, "options": [{"id": "k9556", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>3</mn></mfrac><msub><mi>P</mi><mn>0</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "fQ2OW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>16</mn><mn>9</mn></mfrac><msub><mi>P</mi><mn>0</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "XKH1h", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>64</mn><mn>27</mn></mfrac><msub><mi>P</mi><mn>0</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "V7IUj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>256</mn><mn>81</mn></mfrac><msub><mi>P</mi><mn>0</mn></msub></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let <math><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub></math> be the initial temperature of the black body<br /><br /><math><mo>&#8756;</mo><mi>&#160;</mi><msub><mrow><mi>&#955;</mi></mrow><mrow><mn>0</mn></mrow></msub><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mi>b</mi><mi>&#160;</mi></math>(Wien&#39;s law)<br /><br />Power radiated, <math><msub><mrow><mi>P</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mi>C</mi><msubsup><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>4</mn></mrow></msubsup><mo>,</mo><mi>&#160;</mi></math> where, <math><mi>C</mi></math> is constant.<br /><br />If <math><mi>T</mi></math> is new temperature of black body, then<br /><br /><math><mfrac><mrow><mn>3</mn><msub><mrow><mi>&#955;</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>4</mn></mrow></mfrac><mi>T</mi><mo>=</mo><mi>b</mi><mo>=</mo><msub><mrow><mi>&#955;</mi></mrow><mrow><mn>0</mn></mrow></msub><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>&#160;</mi><mi>&#160;</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">&#160;</mi><mi>&#160;</mi><mi>T</mi><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi>&#160;</mi><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub></math><br /><br />Power radiated, <math><mi>P</mi><mo>=</mo><mi>C</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup><mo>=</mo><mi>C</mi><msubsup><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>4</mn></mrow></msubsup><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>4</mn></mrow></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mfrac><mn>256</mn><mn>81</mn></mfrac><msub><mi>P</mi><mn>0</mn></msub></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b7dd8975740bc6ae", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "104", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two identical beakers <math><mi mathvariant=\"normal\">A</mi></math> and <math><mi mathvariant=\"normal\">B</mi></math> contain equal volumes of two different liquids at <math><mn>60</mn><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> each and left to cool down. Liquid in <math><mi mathvariant=\"normal\">A</mi></math> has density of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>×</mo><msup><mn>10</mn><mn>2</mn></msup><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>3</mn></mrow></msup></math> and specific heat of <math><mn>2000</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">J</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><msup><mrow><mi mathvariant=\"normal\">g</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> while the liquid in <math><mi mathvariant=\"normal\">B</mi></math> has density <math><msup><mrow><mn>10</mn></mrow><mrow><mn>3</mn></mrow></msup><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi><msup><mrow><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></math> and specific heat of <math><mn>4000</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">J</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><msup><mrow><mi mathvariant=\"normal\">g</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. Which of the following best describes their temperature versus time graph schematically? (assume the emissivity of both the beakers to be the same)", "image": null}, "options": [{"id": "YMi8f", "text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/e6b5b80a-2f63-4e90-8717-2435ee3bb647-image5.png\" style=\"max-width:100%; object-fit:contain\">", "image": null, "isCorrect": false}, {"id": "zSmuU", "text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/17b2d5e0-5783-4726-8093-2212b6481d31-image6.png\" style=\"max-width:100%; object-fit:contain\">", "image": null, "isCorrect": true}, {"id": "xETI2", "text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/daee7038-45f0-4861-976f-2f8b285c150c-image7.png\" style=\"max-width:100%; object-fit:contain\">", "image": null, "isCorrect": false}, {"id": "phhkB", "text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/16f00de1-cf23-4dd3-8fa2-6feba135ba0f-image8.png\" style=\"max-width:100%; object-fit:contain\">", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From Newton's law of cooling, <br/>Rate of cooling: <math><mfenced separators=\"|\"><mrow><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">T</mi></mrow><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">t</mi></mrow></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>4</mn><mi mathvariant=\"normal\">σ</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">A</mi><msubsup><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>3</mn></mrow></msubsup><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">T</mi><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfenced></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">s</mi></mrow></mfrac></math>  <br/><math><mo>∴</mo><msub><mrow><mi mathvariant=\"normal\">ρ</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow></msub><mo>&lt;</mo><msub><mrow><mi mathvariant=\"normal\">ρ</mi></mrow><mrow><mi mathvariant=\"normal\">B</mi></mrow></msub></math>  <br/><math><msub><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow></msub><mo>&lt;</mo><msub><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mi mathvariant=\"normal\">B</mi></mrow></msub></math>  <br/>And <math><msub><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow></msub><mo>&lt;</mo><msub><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mi mathvariant=\"normal\">B</mi></mrow></msub></math>  <br/><math><msub><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow></msub><msub><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow></msub><mo>&lt;</mo><msub><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mi mathvariant=\"normal\">B</mi></mrow></msub><msub><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mi mathvariant=\"normal\">B</mi></mrow></msub></math>  <br/>At <math><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">t</mi><mo>=</mo><mn>0</mn><mo>,</mo><msub><mrow><mfenced separators=\"|\"><mrow><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">T</mi></mrow><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">t</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow></msub><mo>&gt;</mo><msub><mrow><mfenced separators=\"|\"><mrow><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">T</mi></mrow><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">t</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mi mathvariant=\"normal\">B</mi></mrow></msub></math>  <br/>Initially, the rate of cooling for <math><mi mathvariant=\"normal\">A</mi></math> will be higher than <math><mi mathvariant=\"normal\">B</mi></math> and temperature <math><mo>(</mo><mi mathvariant=\"normal\">T</mi><mo>)</mo><mi mathvariant=\"normal\"> </mi></math> vs time <math><mo>(</mo><mi mathvariant=\"normal\">t</mi><mo>)</mo></math> graph will be a curve.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863af68ff4f2a0863a8", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "07", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two uniform solid spheres made of copper have radii&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>&#160;</mo><mi>cm</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&#160;</mo><mi>cm</mi></math> respectively. Both of them are heated to a temperature of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>70</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>&nbsp;and then placed in a region of ambient temperature equal to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>45</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>. What will be the ratio of the initial rates of cooling of both the spheres?", "image": null}, "options": [], "correctValue": "01.33", "solution": {"text": "<p>For two bodies made up of same material, rate of loss of heat will depend only on their surface area for same temperature change.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><mfrac><msub><mfenced><mfrac><mrow><mi>d</mi><mi>Q</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mfenced><mn>1</mn></msub><msub><mfenced><mfrac><mrow><mi>d</mi><mi>Q</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mfenced><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><msub><mi>A</mi><mn>1</mn></msub><msub><mi>A</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><msubsup><mi>r</mi><mn>1</mn><mn>2</mn></msubsup><msubsup><mi>r</mi><mn>2</mn><mn>2</mn></msubsup></mfrac><mo>&#160;</mo><mo>&#160;</mo><mo>&#8230;</mo><mo>&#8230;</mo><mfenced><mi mathvariant=\"normal\">i</mi></mfenced></math></p><p>Ratio of initial rates of cooling<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><msub><mfenced><mfrac><mrow><mi>d</mi><mi>&#952;</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mfenced><mn>1</mn></msub><msub><mfenced><mfrac><mrow><mi>d</mi><mi>&#952;</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mfenced><mn>2</mn></msub></mfrac></math></p><p>As,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>dQ</mi><mi>dt</mi></mfrac><mo>=</mo><mi>mc</mi><mfrac><mrow><mi mathvariant=\"normal\">d</mi><mi>&#952;</mi></mrow><mi>dt</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><mfrac><mrow><msub><mi mathvariant=\"normal\">m</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">c</mi><mn>1</mn></msub><mo>(</mo><mi mathvariant=\"normal\">d</mi><mi>&#952;</mi><mo>/</mo><mi>dt</mi><msub><mo>)</mo><mn>1</mn></msub></mrow><mrow><msub><mi mathvariant=\"normal\">m</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">c</mi><mn>2</mn></msub><mo>(</mo><mi mathvariant=\"normal\">d</mi><mi>&#952;</mi><mo>/</mo><mi>dt</mi><msub><mo>)</mo><mn>2</mn></msub></mrow></mfrac><mo>=</mo><mfrac><msubsup><mi mathvariant=\"normal\">r</mi><mn>1</mn><mn>2</mn></msubsup><msubsup><mi mathvariant=\"normal\">r</mi><mn>2</mn><mn>2</mn></msubsup></mfrac></math>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; ...[from (i)]</p><p>since, both the spheres are made up of copper,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>c</mi><mn>1</mn></msub><mo>=</mo><msub><mi>c</mi><mn>2</mn></msub><mo>=</mo><mi>c</mi></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><mfrac><msub><mfenced><mfrac><mrow><mi>d</mi><mi>&#952;</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mfenced><mn>1</mn></msub><msub><mfenced><mfrac><mrow><mi>d</mi><mi>&#952;</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mfenced><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><mrow><msubsup><mi>r</mi><mn>1</mn><mn>2</mn></msubsup><mo>&#215;</mo><msub><mi>m</mi><mn>2</mn></msub></mrow><mrow><msubsup><mi>r</mi><mn>2</mn><mn>2</mn></msubsup><mo>&#215;</mo><msub><mi>m</mi><mn>1</mn></msub></mrow></mfrac></math></p><p>As, spheres have same densities,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi mathvariant=\"normal\">m</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">m</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">V</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">V</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><msubsup><mi mathvariant=\"normal\">r</mi><mn>1</mn><mn>3</mn></msubsup><msubsup><mi mathvariant=\"normal\">r</mi><mn>2</mn><mn>3</mn></msubsup></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><mfrac><mrow><mo>(</mo><mi>d</mi><mi>&#952;</mi><mo>/</mo><mi>d</mi><mi>t</mi><msub><mo>)</mo><mn>1</mn></msub></mrow><mrow><mo>(</mo><mi>d</mi><mi>&#952;</mi><mo>/</mo><mi>d</mi><mi>t</mi><msub><mo>)</mo><mn>2</mn></msub></mrow></mfrac><mo>=</mo><mfrac><msubsup><mi>r</mi><mn>1</mn><mn>2</mn></msubsup><msubsup><mi>r</mi><mn>2</mn><mn>2</mn></msubsup></mfrac><mo>&#215;</mo><mfrac><msubsup><mi>r</mi><mn>2</mn><mn>3</mn></msubsup><msubsup><mi>r</mi><mn>1</mn><mn>3</mn></msubsup></mfrac><mo>=</mo><mfrac><msub><mi>r</mi><mn>2</mn></msub><msub><mi>r</mi><mn>1</mn></msub></mfrac><mo>=</mo><mfrac><mn>20</mn><mn>15</mn></mfrac><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><mo>=</mo><mn>1</mn><mo>.</mo><mn>33</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a76dd7a26be1d291", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "85", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Assuming the sun to be a spherical body of radius <math><mi>R</mi><mi>&nbsp;</mi></math>at a temperature of <math><mi>T</mi><mi>&nbsp;</mi><mn>K</mn></math>, evaluate the total radiant power, incident on earth, at a distance <math><mi>r</mi></math> from the sun. (<math><msub><mrow><mi>r</mi></mrow><mrow><mn>0</mn></mrow></msub></math> is the radius of the earth and <math><mi>σ</mi></math> is Stefan's constant)", "image": null}, "options": [{"id": "u25p6", "text": "<math><mrow><mrow><mn>4</mn><mi>π</mi><msubsup><mrow><mi>r</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>σ</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup></mrow><mo>/</mo><mrow><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "P5ZGP", "text": "<math><mrow><mrow><mi>π</mi><msubsup><mrow><mi>r</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>σ</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup></mrow><mo>/</mo><mrow><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mrow></math>", "image": null, "isCorrect": true}, {"id": "37dIz", "text": "<math><mrow><mrow><msubsup><mrow><mi>r</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>σ</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup></mrow><mo>/</mo><mrow><mn>4</mn><mi>π</mi><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "nqpRs", "text": "<math><mrow><mrow><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>σ</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup></mrow><mo>/</mo><mrow><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From Stefan's law, the rate at which energy is radiated by sun at its surface is&nbsp;<math><mi>P</mi><mo>=</mo><mi>σ</mi><mo>×</mo><mn>4</mn><mi>π</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup></math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/52658qs.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 278px; height: 209px;\" /><br /><br />[Sun is a perfect black body as it emits radiations of all wavelengths and so for it <math><mi>e</mi></math>=1]<br /><br />The intensity of this power at earth's surface&nbsp;is<br /><br /><math> <mrow> <mi>I</mi><mo>=</mo><mfrac> <mi>P</mi> <mrow> <mn>4</mn><mi>π</mi><msup> <mi>r</mi> <mn>2</mn> </msup> </mrow> </mfrac> <mo>=</mo><mfrac> <mrow> <mi>σ</mi><mo>×</mo><mn>4</mn><mi>π</mi><msup> <mi>R</mi> <mn>2</mn> </msup> <msup> <mi>T</mi> <mn>4</mn> </msup> </mrow> <mrow> <mn>4</mn><mi>π</mi><msup> <mi>r</mi> <mn>2</mn> </msup> </mrow> </mfrac> <mo>=</mo><mfrac> <mrow> <mi>σ</mi><msup> <mi>R</mi> <mn>2</mn> </msup> <msup> <mi>T</mi> <mn>4</mn> </msup> </mrow> <mrow> <msup> <mi>r</mi> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </math><br /><br />The area of earth which receives this energy is only one-half of total surface area of earth, whose projection would be <math><mi>π</mi><msubsup><mrow><mi>r</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup></math>.<br /><br /><math><mo>∴</mo></math> Total radiant power as received by earth<br /><br /><math><mo>=</mo><mi>&nbsp;</mi><mi>π</mi><msubsup><mrow><mi>r</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>×</mo><mi>I</mi></math><br /><br />= <math><mfrac><mrow><mi>π</mi><msubsup><mrow><mi>r</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>×</mo><mi>σ</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup></mrow><mrow><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>π</mi><msubsup><mrow><mi>r</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>σ</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup></mrow><mrow><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a4e0018adc852beb", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "81", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two spheres of radii <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>&nbsp;</mo><mi>cm</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi>cm</mi></math> are cooling. Their temperatures are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>127</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">℃</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>527</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">℃</mi></math> respectively. The ratio of energy radiated by them in the same amount of time is", "image": null}, "options": [{"id": "izAhi", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>06</mn></math>", "image": null, "isCorrect": false}, {"id": "0m19p", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>5</mn></math>", "image": null, "isCorrect": false}, {"id": "Bfwbr", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>", "image": null, "isCorrect": true}, {"id": "bTcrt", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Total energy radiated from a body<br /><br /><math><mi>Q</mi><mo>=</mo><mi>A</mi><mi>ε</mi><mi>σ</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup><mi>t</mi></math><br /><br />or <math><mfrac><mrow><mi>Q</mi></mrow><mrow><mi>t</mi></mrow></mfrac><mi>&nbsp;</mi><mo>∝</mo><mi>A</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></ h/MathML\"><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> and temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4000</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2000</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math> respectively. The ratio of the energy radiated per second by the first sphere to that by the second is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>p</mi><mi>q</mi></mfrac></math>&nbsp;(where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi></math>&nbsp;are least positive integers). The value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>+</mo><mi>q</mi></math>&nbsp;is", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "Energy radiated<br /><br /><math> <mrow> <mtext mathvariant=\"italic\">E</mtext> <mo>=</mo> <mi>σ</mi> <msup> <mtext mathvariant=\"italic\">T</mtext> <mn>4</mn> </msup> <mo>×</mo> <mfenced close=\")\" open=\"(\" separators=\",\"><mrow>&nbsp;<mn>4</mn> <mi>π</mi> <msup> <mtext mathvariant=\"italic\">R</mtext> <mn>2</mn> </msup> </mrow> </mfenced> <mo>×</mo> <mtext>time</mtext> <mo>×</mo> <mtext mathvariant=\"italic\">e</mtext> </mrow> </math><br /><br /><math> <mrow> <mfrac> <mrow> <msub> <mtext mathvariant=\"italic\">E</mtext> <mn>1</mn> </msub> </mrow> <mrow> <msub> <mtext mathvariant=\"italic\">E</mtext> <mn>2</mn> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>4000</mtext> </mrow> </mfenced> </mrow> <mn>4</mn> </msup> <mo>×</mo> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>1</mn> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> <mo>×</mo> <mn>1</mn> <mo>×</mo> <mn>4</mn> <mi>π</mi> <mi>σ</mi> <mtext mathvariant=\"italic\">e</mtext> </mrow> <mrow> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>2000</mtext> </mrow> </mfenced> </mrow> <mn>4</mn> </msup> <mo>×</mo> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>4</mn> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> <mo>×</mo> <mn>1</mn> <mo>×</mo> <mn>4</mn> <mi>π</mi> <mi>σ</mi> <mtext mathvariant=\"italic\">e</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>1</mn> </mrow> </mfrac> </mrow> </math>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86398dd08a7482be04d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "34", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The graph shown in the adjacent diagram represents the variation of temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">T</mi><mo>)</mo></math> of two bodies&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">y</mi></math> having the same surface area, with time (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">t</mi></math>). Both of these bodies lose heat only due to the emission of radiation. Find the correct relation between the emissive and absorptive power of the two bodies.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/29201_que.png\" style=\"width: 160px; height: 162px;\" />", "image": null}, "options": [{"id": "FGdRu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub ": [{"id": "wSOB7", "text": "<math><mfrac><mrow><mn>4</mn><mi>E</mi></mrow><mrow><mn>9</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "fNCUW", "text": "<math><mfrac><mrow><mn>7</mn><mi>E</mi></mrow><mrow><mn>9</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "au2TM", "text": "<math><mfrac><mrow><mn>10</mn><mi>E</mi></mrow><mrow><mn>9</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "xnHEb", "text": "<math><mfrac><mrow><mn>16</mn><mi>E</mi></mrow><mrow><mn>9</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math><mi>E</mi><mo>=</mo><mi>e</mi><mi>σ</mi><mo>.</mo><mi>A</mi><mfenced separators=\"|\"><mrow><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup><mo>-</mo><msubsup><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>4</mn></mrow></msubsup></mrow></mfenced><mi>&nbsp;</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">d</mi><mi>&nbsp;</mi><mi>A</mi><mo>=</mo><mi>l</mi><mi>b</mi><mi>&nbsp;</mi></math><br /><br />When <math><mi>l</mi></math> and b changes to <math><mfrac><mrow><mi>l</mi></mrow><mrow><mn>3</mn></mrow></mfrac></math>&nbsp;and <math><mfrac><mrow><mi>b</mi></mrow><mrow><mn>3</mn></mrow></mfrac></math><br /><br /><math><mi>A</mi><mo>→</mo><mfrac><mrow><mi>A</mi></mrow><mrow><mn>9</mn></mrow></mfrac></math><br /><br /><math><mfrac><mrow><msup><mrow><mi>E</mi></mrow><mrow><mi>′</mi></mrow></msup></mrow><mrow><mi>E</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><msup><mrow><mi>A</mi></mrow><mrow><mi>′</mi></mrow></msup></mrow><mrow><mi>A</mi></mrow></mfrac><mfrac><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mn>327</mn><mo>+</mo><mn>273</mn></mrow></mfenced></mrow><mrow><mn>4</mn></mrow></msup></mrow><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mn>27</mn><mo>+</mo><mn>273</mn></mrow></mfenced></mrow><mrow><mn>4</mn></mrow></msup></mrow></mfrac></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><msup><mrow><mi>E</mi></mrow><mrow><mi>′</mi></mrow></msup></mrow><mrow><mi>E</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>9</mn></mrow></mfrac><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>600</mn></mrow><mrow><mn>300</mn></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>4</mn></mrow></msup></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><msup><mrow><mi>E</mi></mrow><mrow><mi>′</mi></mrow></msup><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>9</mn></mrow></mfrac><mo>×</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>2</mn></mrow></mfenced></mrow><mrow><mn>4</mn></mrow></msup><mo>×</mo><mi>E</mi></math><br /><br /><math><msup><mrow><mi>E</mi></mrow><mrow><mi>′</mi></mrow></msup><mo>=</mo><mfrac><mrow><mn>16</mn><mi>E</mi></mrow><mrow><mn>9</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86373635d9ea761f6a9", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "89", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A polished metal plate with a rough black spot on it is heated to about <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1400</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math> and quickly taken to a dark room. The spot will appear\r", "image": null}, "options": [{"id": "hVO5d", "text": "Darker than plate", "image": null, "isCorrect": false}, {"id": "k11Am", "text": "Brighter than plate", "image": null, "isCorrect": true}, {"id": "PYHJj", "text": "Equally bright", "image": null, "isCorrect": false}, {"id": "NwLN5", "text": "Equally dark", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "On heating, black spot absorbs maximum radiation. Therefore, when plate is taken to a dark room the spot will emit more radiations than the rest of the plate. Hence, it will appear brighter than the plate.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636e943a8f92172cdd", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "45", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If the filament of a <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">W</mi></math>&nbsp;bulb has an area <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>25</mn><mo>&nbsp;</mo><msup><mi>cm</mi><mn>2</mn></msup></math>&nbsp;and behaves as a perfect black body, find the wavelength corresponding to the maximum in its energy distribution. [Given&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>σ</mi><mo>=</mo><mn>5.67</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>-</mo><mn>8</mn></mrow></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi><mo>&nbsp;</mo><msup><mtext>m</mtext><mrow><mo>-</mo><mn>2</mn></mrow></msup><mtext>&nbsp;</mtext><mo>s</mo><mo>&nbsp;</mo><msup><mtext>K</mtext><mrow><mo>-</mo><mn>4</mn></mrow></msup></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>b</mi><mo>=</mo><mn>2</mn><mo>.</mo><mn>89</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math>]", "image": null}, "options": [{"id": "tTUHC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8751</mn><mo>.</mo><mn>23</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Å</mi></math>", "image": null, "isCorrect": false}, {"id": "xCT63", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2898</mn><mo>.</mo><mn>14</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Å</mi></math>", "image": null, "isCorrect": false}, {"id": "szou1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9971</mn><mo>.</mo><mn>9</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Å</mi></math>", "image": null, "isCorrect": true}, {"id": "xOhgu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7055</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">Å</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In the bulb filament given, energy radiated per second per m<sup>2</sup> of its surface area is given as<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>E</mtext><mo>=</mo><mfrac><mtext>P</mtext><mtext>A</mtext></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn><mn>0</mn><mn>0</mn></mrow><mrow><mtext>0.25</mtext><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup></mrow></mfrac><mo>=</mo><mn>4</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mn>6</mn></msup><mo>J</mo><mo>&nbsp;</mo><msup><mtext>s</mtext><mtext>-1</mtext></msup><msup><mtext>&nbsp;m</mtext><mrow><mo>-</mo><mn>2</mn></mrow></msup></math><br /><br />If T is the temperature of the filament then according to Stefan's law, we have<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext>E</mtext> <mo>=</mo> <mi>σ</mi> <msup> <mtext>T</mtext> <mn>4</mn> </msup> </mrow> </math><br /><br />or&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mn>4</mn> <mo>×</mo> <mn>1</mn> <msup> <mn>0</mn> <mn>6</mn> </msup> <mo>=</mo> <mtext>5.67</mtext> <mo>×</mo> <mn>1</mn> <msup> <mn>0</mn> <mrow> <mo>-</mo> <mn>8</mn> </mrow> </msup> <mo>×</mo> <msup> <mtext>T</mtext> <mn>4</mn> </msup> </mrow> </math><br /><br />or&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msup> <mtext>T</mtext> <mn>4</mn> </msup> <mo>=</mo> <mfrac> <mrow> <mn>4</mn> <mo>×</mo> <mn>1</mn> <msup> <mn>0</mn> <mn>6</mn> </msup> </mrow> <mrow> <mtext>5.67</mtext> <mo>×</mo> <mn>1</mn> <msup> <mn>0</mn> <mrow> <mo>-</mo> <mn>8</mn> </mrow> </msup> </mrow> </mfrac> <mo>=</mo> <mtext>7.055</mtext> <mo>×</mo> <mn>1</mn> <msup> <mn>0</mn> <mrow> <mn>1</mn> <mn>3</mn> </mrow> </msup> </mrow> </math><br /><br />or&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext>T</mtext> <mo>=</mo> <msup> <mrow> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mtext>7.055</mtext> <mo>×</mo> <mn>1</mn> <msup> <mn>0</mn> <mrow> <mn>1</mn> <mn>3</mn> </mrow> </msup> </mrow> </mfenced> </mrow> <mrow> <mn>1</mn> <mo>/</mo> <mn>4</mn> </mrow> </msup> <mo>=</mo> <mtext>2898.14 K</mtext> </mrow> </math><br /><br />If the filament radiates the maximum energy at a wavelength <math> <mrow> <msub> <mi>λ</mi> <mtext>m</mtext> </msub> </mrow> </math>, from Wein's displacement law, we have<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mi>λ</mi> <mtext>m</mtext> </msub> <mo>T</mo> <mo>=</mo> <mtext>b</mtext> </mrow> </math><br /><br />or&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mi>λ</mi> <mtext>m</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mtext>b</mtext> </mrow> <mrow> <mtext>T</mtext> </mrow> </mfrac> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mtext>2.89</mtext><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup></mrow><mtext>2898.14</mtext></mfrac><mo>=</mo><mo>9971.9</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">Å</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636d8b5e34757261fa", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "65", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A black body emits radiation at the rate&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> when its temperature is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math>. At this temperature the wavelength at which the radiation has a maximum intensity is&nbsp;<math><mrow><msub><mi>λ</mi> <mn>0</mn></msub></mrow></math>. If at another temperature&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>'</mo></math> the power radiated is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>'</mo></math> and wavelength at maximum intensity is <math> <mrow> <msub> <mi>λ</mi> <mn>0</mn> </msub> <mo>/</mo> <mn>2</mn> </mrow> </math>&nbsp;then", "image": null}, "options": [{"id": "jfkFd", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mtext mathvariant=\"italic\">P</mtext><mo>'</mo></msup><msup><mtext mathvariant=\"italic\">T</mtext><mo>'</mo></msup><mo>=</mo><mn>3</mn><mn>2</mn><mo mathvariant=\"italic\">PT</mo></math>", "image": null, "isCorrect": true}, {"id": "gJZht", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mtext mathvariant=\"italic\">P</mtext><mo>'</mo></msup><msup><mtext mathvariant=\"italic\">T</mtext><mo>'</mo></msup><mo>=</mo><mn>1</mn><mn>6</mn><mo mathvariant=\"italic\">PT</mo></math>", "image": null, "isCorrect": false}, {"id": "qGzrf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mtext mathvariant=\"italic\">P</mtext><mo>'</mo></msup><msup><mtext mathvariant=\"italic\">T</mtext><mo>'</mo></msup><mo>=</mo><mn></mn><mn>8</mn><mo mathvariant=\"italic\">PT</mo></math>", "image": null, "isCorrect": false}, {"id": "MtKuS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mtext mathvariant=\"italic\">P</mtext><mo>'</mo></msup><msup><mtext mathvariant=\"italic\">T</mtext><mo>'</mo></msup><mo>=</mo><mn></mn><mn>4</mn><mo mathvariant=\"italic\">PT</mo></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a black body, wavelength for maximum intensity :<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi><mo>&#8733;</mo><mfrac><mn>1</mn><mtext mathvariant=\"italic\">T</mtext></mfrac></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">P</mtext><mo>&#8733;</mo><msup><mtext mathvariant=\"italic\">T</mtext><mn>4</mn></msup><mo>&#160;&#160;&#8658;&#160;</mo><mtext mathvariant=\"italic\">P</mtext><mo>&#8733;</mo><mfrac><mn>1</mn><msup><mi>&#955;</mi><mn>4</mn></msup></mfrac></math><br /><br />&nbsp; &nbsp; &nbsp; &nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mtext mathvariant=\"italic\">P</mtext><mo mathvariant=\"italic\">'</mo></msup><mo>=</mo><mn>1</mn><mn>6</mn><mo mathvariant=\"italic\">P</mo></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;&#160;&#160;&#160;&#160;</mo><msup><mtext mathvariant=\"italic\">P</mtext><mo mathvariant=\"italic\">'</mo></msup><msup><mtext mathvariant=\"italic\">T</mtext><mo>'</mo></msup><mo>=</mo><mn>3</mn><mn>2</mn><mo mathvariant=\"italic\">PT</mo></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863628ffbed061aa885", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "72", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A body cools from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math> minutes. Its temperature comes down to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>33</mn><mo>.</mo><mn>33</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> in the next <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math> minutes. The temperature of the surroundings is", "image": null}, "options": [{"id": "muLQD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>&#xA0;</mo><mo>&#xB0;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}, {"id": "ctxBa", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": true}, {"id": "kpfSM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>25</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}, {"id": "cjKLG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#xA0;</mo><mo>&#xB0;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#952;</mi><mn>0</mn></msub></math>&nbsp;= temperature of surrounding,</p><p>Using Newton&#39;s law of cooling,<br /><br />log<math><mi>&#160;</mi><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">&#952;</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">&#952;</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">&#952;</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">&#952;</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac><mo>=</mo><mo>-</mo><mi>K</mi><mi>t</mi></math><br /><br />log <math><mfrac><mrow><mn>40</mn><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">&#952;</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>50</mn><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">&#952;</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac><mo>=</mo><mi>&#160;</mi><mo>-</mo><mi>K</mi><mo>&#215;</mo><mn>5</mn></math> .....(i)<br /><br />log <math><mfrac><mrow><mn>33.33</mn><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">&#952;</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>40</mn><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">&#952;</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac><mi>&#160;</mi><mo>=</mo><mi>&#160;</mi><mo>-</mo><mi>K</mi><mo>&#215;</mo><mn>5</mn></math> .....(ii)<br /><br />From Eqs.(i) and (ii),<br /><br /><math><mfrac><mrow><mn>40</mn><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">&#952;</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>50</mn><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">&#952;</mi></mrow><mrow><mn>0</mn></mrow></msub><mi mathvariant=\"normal\">&#160;</mi></mrow></mfrac><mi>&#160;</mi><mo>=</mo><mi>&#160;</mi><mfrac><mrow><mn>33.33</mn><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">&#952;</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>40</mn><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">&#952;</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac></math><br /><br />On solving, we get<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#952;</mi><mn>0</mn></msub><mo>=</mo><mn>19</mn><mo>.95</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi><mo>&#160;</mo><mo>&#8776;</mo><mn>20</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635f7d5204f909a1c5", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "61", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A point source of light of power <math><msub><mrow><mi>P</mi></mrow><mrow><mn>0</mn></mrow></msub></math> is placed at a distance of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> from the centre of a thin hemispherical shell as shown in the figure, The shell has a radius of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> and it behaves like a perfect black body.&nbsp;If the temperature of the hemisphere is related to the power of the source as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>T</mi><mn>4</mn></msup><mo>=</mo><mfrac><msub><mi>P</mi><mn>0</mn></msub><mrow><mi>n</mi><mi>π</mi><mi>σ</mi></mrow></mfrac></math>' where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>σ</mi></math>&nbsp;is the Stefan's constant, then find the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>n</mi><mn>10</mn></mfrac></math>.&nbsp;\r\r<p>&nbsp;</p>\r", "image": null}, "options": [], "correctValue": "27", "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/0416ef2b-3ad9-4bf1-814a-dc47b5859518-image19.png\" style=\"height: 167px; width: 170px;\" /><br /><br />Total power emitted by shell due to radiation<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mi>out</mi></msub><mo>=</mo><mi>&#963;</mi><mfenced separators=\"|\"><mrow><mn>2</mn><mi>&#960;</mi><msup><mi>R</mi><mn>2</mn></msup><mo>+</mo><mi>&#960;</mi><msup><mi>R</mi><mn>2</mn></msup></mrow></mfenced><msup><mi>T</mi><mn>4</mn></msup><mo>=</mo><mn>3</mn><mi>&#960;</mi><msup><mi>R</mi><mn>2</mn></msup><mi>&#963;</mi><msup><mi>T</mi><mn>4</mn></msup></math><br />Power gained by the shell from <math><msub><mrow><mi>P</mi></mrow><mrow><mn>0</mn></mrow></msub></math> :<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mi>in</mi></msub><mo>=</mo><msub><mi>P</mi><mn>0</mn></msub><mfrac><mrow><mn>2</mn><mi>&#960;</mi><msup><mi>r</mi><mn>2</mn></msup><mo>(</mo><mn>1</mn><mo>-</mo><mi>cos</mi><mo>&#8289;</mo><mn>37</mn><mo>&#176;</mo><mo>)</mo></mrow><mrow><mn>4</mn><mi>&#960;</mi><msup><mi>r</mi><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mfrac><msub><mi>P</mi><mn>0</mn></msub><mn>10</mn></mfrac></math><br />Equating: <math><mfrac><mrow><msub><mrow><mi>P</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>10</mn></mrow></mfrac><mo>=</mo><mn>3</mn><mi>&#960;</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>&#963;</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup></math><br />Gives <math><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup><mo>=</mo><mfrac><mrow><msub><mrow><mi>P</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>270</mn><mi>&#960;</mi><mi>&#963;</mi></mrow></mfrac></math></p><p>&nbsp; &nbsp; &nbsp; &nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>=</mo><mfrac><mn>270</mn><mn>10</mn></mfrac><mo>=</mo><mn>27</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635a8fcc4d4e559161", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "16", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The temperature of a body falls from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>36</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&nbsp;</mo><mi>minutes</mi></math>, when placed in a constant ambient temperature of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. The time it takes for the temperature to fall from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>36</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>32</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> in the same ambient temperature is", "image": null}, "options": [{"id": "xeKse", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>.</mo><mn>1</mn><mo>&nbsp;</mo><mi>min</mi></math>", "image": null, "isCorrect": true}, {"id": "yGPLV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>.</mo><mn>8</mn><mo>&nbsp;</mo><mi>min</mi></math>", "image": null, "isCorrect": false}, {"id": "N3qLn", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>9&nbsp;</mo><mi>min</mi></math>", "image": null, "isCorrect": false}, {"id": "A8kWh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>7.2</mo><mo>&nbsp;</mo><mi>min</mi></math>", "image": null, "isCorrect": false}], "c ath>. Treating sun as a block body, it follows from the above data that its surface temperature is", "image": null}, "options": [{"id": "q1SGK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5801</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 73px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "GOPdD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>10</mn><mn>6</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 117px; top: 41px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "Yb4pq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>.</mo><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 111px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "lmrwy", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5801</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 11px; top: 41px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Stefan&#39;s law,<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>Q</mi></mrow><mrow><mi>d</mi><mi>T</mi></mrow></mfrac><mo>=</mo><mi>&#963;</mi><msup><mtext>T</mtext><mn>4</mn></msup></math><br /><br />The total surface area of the sun <math> <mrow> <mo>=</mo> <mn>4</mn> <mi>&#960;</mi> <msubsup> <mtext>R</mtext> <mtext>s</mtext> <mn>2</mn> </msubsup> </mrow> </math><br /><br />Therefore, the total energy radiated per second by the sun per unit solid angle<br /><br /><math> <mrow> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <mi>&#963;</mi> <msup> <mtext>T</mtext> <mn>4</mn> </msup> <mo>&#215;</mo> <mn>4</mn> <mi>&#960;</mi> <msubsup> <mtext>R</mtext> <mtext>s</mtext> <mn>2</mn> </msubsup> </mrow> <mrow> <mn>4</mn> <mi>&#960;</mi> </mrow> </mfrac> <mo>=</mo> <mi>&#963;</mi> <msup> <mtext>T</mtext> <mn>4</mn> </msup> <msubsup> <mtext>R</mtext> <mtext>s</mtext> <mn>2</mn> </msubsup> </mrow> </math><br /><br />Let R<sub>es</sub> be the distance of the earth from the sun. Hence, the intensity of radiation of the earth<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mi></mi><mi>l</mi><mo>&#8289;</mo> <mo>=</mo> <mi>&#963;</mi> <msup> <mtext>T</mtext> <mn>4</mn> </msup> <msubsup> <mtext>R</mtext> <mtext>s</mtext> <mn>2</mn> </msubsup> <mo>/</mo> <msubsup> <mtext>R</mtext> <mtext>es</mtext> <mn>2</mn> </msubsup> </mrow> </math><br /><br /><math> <mrow> <mo>&#8756;&#160;&#160;&#160;</mo> <mn>1</mn> <mn>4</mn> <mn>0</mn> <mn>0</mn> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>5.6</mtext> <mo>&#215;</mo> <mn>1</mn> <msup> <mn>0</mn> <mrow> <mo>-</mo> <mn>8</mn> </mrow> </msup> </mrow> </mfenced> <msup> <mtext>T</mtext> <mn>4</mn> </msup> <msup> <mrow> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>7.0</mtext> <mo>&#215;</mo> <mn>1</mn> <msup> <mn>0</mn> <mn>8</mn> </msup> </mrow> <mrow> <mtext>1.5</mtext> <mo>&#215;</mo> <mn>1</mn> <msup> <mn>0</mn> <mrow> <mn>1</mn> <mn>1</mn> </mrow> </msup> </mrow> </mfrac> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>5801</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863359818362886ae3a", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "41", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A metal is heated in a furnace where a sensor is kept above the metal surface to read the power radiated (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>) by the metal. The sensor has a scale that displays <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>log</mi><mn>2</mn></msub><mo>⁡</mo><mfenced separators=\"|\"><mfrac><mi>P</mi><msub><mi>P</mi><mn>0</mn></msub></mfrac></mfenced><mi>&nbsp;</mi></math>, where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>0</mn></msub></math>&nbsp;is a constant. When the metal surface is at a temperature of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>487</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>,&nbsp;the sensor shows a value <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>. Assume that the emissivity of the metallic surface remains constant. What is the value displayed by the sensor when the temperature of the metal surface is raised to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2767</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>?", "image": null}, "options": [], "correctValue": "9", "solution": {"text": "<math><mi>P</mi><mo>=</mo><mi>e</mi><mi>A</mi><mi>σ</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup></math> where <math><mi>T</mi></math> is in kelvin<br /><br /><math><mrow><mrow><msub><mrow><mi mathvariant=\"normal\">log</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mo>⁡</mo><mrow><mfrac><mrow><mi>e</mi><mi>A</mi><mi>σ</mi><msup><mrow><mfenced separators=\"|\"><mrow><mn>487</mn><mo>+</mo><mn>273</mn></mrow></mfenced></mrow><mrow><mn>4</mn></mrow></msup></mrow><mrow><msub><mrow><mi>P</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac></mrow></mrow><mo>=</mo><mn>1</mn></math> .....(i)<br /><br /><math><mrow><mrow><msub><mrow><mi mathvariant=\"normal\">log</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mo>⁡</mo><mrow><mfrac><mrow><mi>e</mi><mi>A</mi><mi>σ</mi><msup><mrow><mfenced separators=\"|\"><mrow><mn>2767</mn><mo>+</mo><mn>273</mn></mrow></mfenced></mrow><mrow><mn>4</mn></mrow></msup></mrow><mrow><msub><mrow><mi>P</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac></mrow></mrow><mo>=</mo><mi>x</mi></math> ......(ii)<br /><br />(ii) - (i)<br /><br /><math><mrow><mrow><msub><mrow><mi mathvariant=\"normal\">log</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mo>⁡</mo><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>3040</mn></mrow><mrow><mn>760</mn></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>4</mn></mrow></msup></mrow></mrow><mo>=</mo><mi>x</mi><mo>-</mo><mn>1</mn></math><br /><br /><math><mo>∴</mo></math> <math><mi>x</mi><mo>=</mo><mn>9</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86334ff35ac38a9bc4b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "109", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A cup of tea cools from <math><msup><mrow><mn>65.5</mn></mrow><mrow><mn>&nbsp;o</mn></mrow></msup><mn>C</mn></math> to <math><msup><mrow><mn>62.5</mn></mrow><mrow><mn>&nbsp;o</mn></mrow></msup><mn>C</mn></math> in <math> <mrow> <mn>1</mn><mtext> </mtext><mtext>min</mtext> </mrow> </math> in a room at <math><msup><mrow><mn>22.5</mn></mrow><mrow><mn>&nbsp;o</mn></mrow></msup><mn>C</mn></math>. How long will it take to cool from <math><msup><mrow><mn>46.5</mn></mrow><mrow><mn>&nbsp;o</mn></mrow></msup><mn>C</mn></math> to <math><msup><mrow><mn>40.5</mn></mrow><mrow><mn>&nbsp;o</mn></mrow></msup><mn>C</mn></math> in the same room?", "image": null}, "options": [{"id": "zxT4a", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#160;</mo><mi>min</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 147px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div><div id=\"gtx-trans\" style=\"position: absolute; left: 147px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "Y5p2C", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi>min</mi></math>", "image": null, "isCorrect": false}, {"id": "MfgdG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi>min</mi></math>", "image": null, "isCorrect": false}, {"id": "deDCH", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&nbsp;</mo><mi>min</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Newton's law of cooling,<br /><br /><math><mfrac><mrow><msub><mrow><mi>θ</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi>θ</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mi>t</mi></mrow></mfrac><mo>=</mo><mi>α</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><msub><mrow><mi>θ</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>θ</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced><mo>-</mo><msub><mrow><mi>θ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfenced></math><br /><br /><math><mfenced separators=\"|\"><mrow><mo>∵</mo><mi>α</mi><mo>=</mo><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">t</mi></mrow></mfenced></math><br /><br /><math><mfrac><mrow><mn>65.5</mn><mo>-</mo><mn>62.5</mn></mrow><mrow><mn>1</mn></mrow></mfrac><mo>=</mo><mi>α</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>65.5</mn><mo>+</mo><mn>62.5</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>-</mo><mn>22.5</mn></mrow></mfenced></math> .....(i)<br /><br /><math><mfrac><mrow><mn>46.5</mn><mo>-</mo><mn>40.5</mn></mrow><mrow><mi>t</mi></mrow></mfrac><mo>=</mo><mi>α</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mfenced separators=\"|\"><mrow><mn>46.5</mn><mo>+</mo><mn>40.5</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></mfrac><mo>-</mo><mn>22.5</mn></mrow></mfenced></math> .....(ii)<br /><br />Solving Equations. (i) and (ii),<br /><br />we get <math><mi>t</mi><mo>=</mo><mn>4</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86333c7782f3a0f8985", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "79", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020" .w3.org/1998/Math/MathML\"><mi>u</mi><mo>&#8733;</mo><msup><mi>T</mi><mn>4</mn></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>u</mi><mn>2</mn></msub><msub><mi>u</mi><mn>1</mn></msub></mfrac><mo>=</mo><msup><mfenced><mfrac><msub><mi>T</mi><mn>2</mn></msub><msub><mi>T</mi><mn>1</mn></msub></mfrac></mfenced><mn>4</mn></msup><mo>=</mo><msup><mfenced><mfrac><mrow><mn>9</mn><mn>0</mn><mn>0</mn></mrow><mrow><mn>3</mn><mn>0</mn><mn>0</mn></mrow></mfrac></mfenced><mn>4</mn></msup></math>&nbsp;&nbsp;(Temperature should be in kelvin)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;&#160;&#160;&#160;</mo><mfrac><msub><mi>u</mi><mn>2</mn></msub><msub><mi>u</mi><mn>1</mn></msub></mfrac><mo>=</mo><mn>8</mn><mn>1</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;&#160;&#160;&#160;</mo><msub><mi>u</mi><mn>2</mn></msub><mo>=</mo><mn>8</mn><mn>1</mn><msub><mi>u</mi><mn>1</mn></msub><mo>=</mo><mtext>24.3&#160;W</mtext></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86326bcbceac139f64d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "49", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The spectral emissive power <math> <mrow> <msub> <mtext>E</mtext> <mi>λ</mi> </msub> </mrow> </math>&nbsp;for a body at temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>1</mn></msub></math>&nbsp;is plotted against the wavelength (see figure) and area under the curve is found to be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>. At a different temperature <math xmlns=\"http:
