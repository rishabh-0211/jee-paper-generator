"isCorrect": false}, {"id": "oFhOW", "text": "<math><mfrac><mrow><msub><mrow><mi>f</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>f</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>f</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi>f</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "tXd3Y", "text": "<math><mfrac><mrow><msub><mrow><mi>f</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>f</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>f</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi>f</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let <math><mi>V</mi></math> be the volume of solid ; <math><mi>d</mi></math> be its density and <math><mi>m</mi></math> be its mass; if γ&nbsp;is the coefficient of volume expansion of the liquid, then<br /><br />Density at temperature <math><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub><mi>&nbsp;</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">s</mi><mo>,</mo><mi>&nbsp;</mi><msub><mrow><mi>d</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfrac><mrow><msub><mrow><mi>d</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>1</mn><mo>+</mo><mi>γ</mi><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></math><br /><br />Density at temperature <math><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub><mi>&nbsp;</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">s</mi><mo>,</mo><mi>&nbsp;</mi><msub><mrow><mi>d</mi></mrow><mrow><mn>2</mn></mrow></msub></math> = <math><mfrac><mrow><msub><mrow><mi>d</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>1</mn><mo>+</mo><mi>γ</mi><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math><br /><br />According to Archimede's principle,<br /><br /><math><msub><mrow><mi>f</mi></mrow><mrow><mn>1</mn></mrow></msub><mi>V</mi><mi>&nbsp;</mi><msub><mrow><mi>d</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mi>m</mi><mo>=</mo><msub><mrow><mi>f</mi></mrow><mrow><mn>2</mn></mrow></msub><mi>&nbsp;</mi><mi>V</mi><msub><mrow><mi>d</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br />Or <math><mfrac><mrow><msub><mrow><mi>d</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>d</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mi>&nbsp;</mi><mo>=</mo><mfrac><mrow><msub><mrow><mi>f</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>f</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mi>&nbsp;</mi><mfrac><mrow><msub><mrow><mi>d</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mi>γ</mi><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfenced></mrow></mfrac><mfrac><mrow><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mi>γ</mi><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></mrow><mrow><msub><mrow><mi>d</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac></math><br /><br />Or <math><msub><mrow><mi>f</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>f</mi></mrow><mrow><mn>1</mn></mrow></msub><mi>γ</mi><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><msub><mrow><mi>f</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><msub><mrow><mi>f</mi></mrow><mrow><mn>2</mn></mrow></msub><mi>&nbsp;</mi><mi>γ</mi><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub></math><br /><br /><math><msub><mrow><mi>f</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi>f</mi></mrow><mrow><mn>2</mn></mrow></msub><mi>&nbsp;</mi><mo>=</mo><mi>&nbsp;</mi><mi>γ</mi><mfenced separators=\"|\"><mrow><msub><mrow><mi>f</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi>f</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></math><br /><br /><math><mi>γ</mi><mi>&nbsp;</mi><mo>=</mo><mi>&nbsp;</mi><mfrac><mrow><mo>(</mo><msub><mrow><mi>f</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi>f</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>)</mo></mrow><mrow><msub><mrow><mi>f</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi>f</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863eed1fed55d0e45bb", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "04", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A wire,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> in length and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi>mm</mi></math> in diameter at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> is kept in low temperature at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>170</mn><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> and is stretched by hanging a weight of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi>kg</mi></math> at one end. The change in length of the wire is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>[</mo><mi>Y</mi><mo>=</mo><mn>2</mn><mo>×</mo><msup><mn>10</mn><mn>11</mn></msup></math> <math><msup><mrow><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">m</mi></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mo>=</mo><mn>10</mn><mo>&nbsp;</mo><msup><mi>ms</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">α</mi><mo>=</mo><mn>1.2</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>/</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi><mo>]</mo></math>", "image": null}, "options": [{"id": "bLtN8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>.</mo><mn>2</mn><mo>&#xA0;</mo><mi>mm</mi></math>", "image": null, "isCorrect": true}, {"id": "43ZOv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>5</mn><mo>&#xA0;</mo><mi>mm</mi></math>", "image": null, "isCorrect": false}, {"id": "vCkMU", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>.</mo><mn>2</mn><mo>&#xA0;</mo><mi>mm</mi></math>", "image": null, "isCorrect": false}, {"id": "HWYmd", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>.</mo><mn>5</mn><mo>&#xA0;</mo><mi>mm</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The change in length of the wire due to change in temperature</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi mathvariant=\"normal\">&#945;</mi><mi>L</mi><mi>T</mi><mo>=</mo><mn>1.2</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>&#215;</mo><mn>3</mn><mo>&#215;</mo><mfenced><mrow><mo>-</mo><mn>170</mn><mo>-</mo><mn>30</mn></mrow></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mn>7.2</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mi mathvariant=\"normal\">m</mi></math><br /><br />The change in the length of the wire due to the stretching force<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mi>F</mi><mi>&#160;</mi><mi>L</mi></mrow><mrow><mi>A</mi><mi>&#160;</mi><mi>Y</mi></mrow></mfrac><mo>=</mo><mi>&#160;</mi><mfrac><mrow><mn>10</mn><mo>&#215;</mo><mn>10</mn><mo>&#215;</mo><mn>3</mn></mrow><mrow><mn>0</mn><mo>.75</mo><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup><mo>&#215;</mo><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mn>11</mn></msup></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math><br /><br />The total change in the length of the wire<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mn>7.2</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>+</mo><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mn>5.2</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>=</mo><mo>-</mo><mn>5</mn><mo>.</mo><mn>2</mn><mo>&#160;</mo><mi>mm</mi></math></p><p>The negative sign indicates contraction of the wire</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e0d6baa22b80648b", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "48", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A planar frame is made of thin uniform rods. The length of section AB and EF is <math><msub><mi>l</mi><mn>1</mn></msub></math>&nbsp;and its coefficient of linear expansion is <math><msub><mi>&#945;</mi><mn>1</mn></msub></math>. The length of section CD is <math><msub><mi>l</mi><mn>2</mn></msub></math>&nbsp;and its coefficient of linear expansion is <math><msub><mi>&#945;</mi><mn>2</mn></msub></math>. CB and DE are of the same length having coefficient of linear expansion <math><msub><mi>&#945;</mi><mn>2</mn></msub></math>. Points A, B, E and F reside on same line, that is, sections AB and EF overlap. Then the ratio <math><mfrac><mrow><msub><mi>l</mi><mn>1</mn></msub></mrow><mrow><msub><mi>l</mi><mn>2</mn></msub></mrow></mfrac></math>&nbsp;for which the distance between end A and end F remains the same at all temperatures is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>&#945;</mi><mn>2</mn></msub><mrow><mi>n</mi><msub><mi>&#945;</mi><mn>1</mn></msub></mrow></mfrac></math> then find the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>.</p>\r\r<p><br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/lcqvmxglmfgexnzyvdbjfvmpdzblhfirripzeygyriktlxqbfx.jpeg\" /></p>\r", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "<p>For distance between A and F to remain constant, extension in CD = extension in AB + extension in EF<br /><br /><math><mo>&#8756;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi mathvariant=\"normal\">&#916;</mi><msub><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#916;</mi><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub><mi>&#160;</mi><mi>&#160;</mi><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><msub><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>&#945;</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">&#916;</mi><msub><mrow><mi>&#952;</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>2</mn><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>&#945;</mi></mrow><mrow><mn>1</mn></mrow></msub><mi mathvariant=\"normal\">&#916;</mi><mi>&#952;</mi></math><br /><br />Or <math><mfrac><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi>&#945;</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>2</mn><msub><mrow><mi>&#945;</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>=</mo><mn>2</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d215f07c2ec8f1df", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "82", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two rods <math><mi>A</mi></math> and <math><mi>B</mi></math> of identical dimensions are at a temperature of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. If <math><mi>A</mi></math> is heated upto <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>180</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> and <math><mi>B</mi></math>&nbsp;up to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math>&nbsp;(measured in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>)&nbsp;then the new lengths are the same. If the ratio of the coefficients of linear expansion of <math><mi>A</mi></math> and <math><mi>B</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>:</mo><mn>3</mn></math>, then the value of <math><mi>T</mi></math> is", "image": null}, "options": [{"id": "citL9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>230</mn><mo>&#xA0;</mo><mo>&#xB0;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": true}, {"id": "i9J6o", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>&#xA0;</mo><mo>&#xB0;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}, {"id": "UaQD1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>270</mn><mo>&#xA0;</mo><mo>&#xB0;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}, {"id": "hiqQ5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>250</mn><mo>&#xA0;</mo><mo>&#xB0;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mo>&#8710;</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mo>&#8710;</mo><msub><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br /><math><mi>L</mi><msub><mrow><mi>&#945;</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>&#215;</mo><mn>150</mn><mo>=</mo><mi>L</mi><msub><mrow><mi>&#945;</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>&#215;</mo><mo>&#8710;</mo><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mo>&#8710;</mo><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mfrac><msub><mi>&#945;</mi><mn>1</mn></msub><msub><mi>&#945;</mi><mn>2</mn></msub></mfrac><mo>&#215;</mo><mn>150</mn><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><mo>&#215;</mo><mn>150</mn><mo>=</mo><mn>200</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>200</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi><mo>+</mo><mn>30</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi><mo>=</mo><mn>230</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c5099534e7d3a094", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "44", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The figure below shows an isosceles triangular frame <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ABC</mi></math>&nbsp;made out of two different materials and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">D</mi></math>&nbsp;is the midpoint of the side <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math>. The coefficient of thermal expansion of the rod <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ADB</mi></math> is <math><msub><mrow><mi>&#945;</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and for the rods&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AC</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BC</mi></math> is <math><msub><mrow><mi>&#945;</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>.</mo></math> End <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math> is fixed and the whole system is placed on a smooth horizontal surface. When&nbsp;the temperature of the system increases, it is found that the distance remains&nbsp;fixed, then<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/tpznuihytttlgnbhjbeccqbmqroagfvhuljefreagvoyhtihpo.png\" />", "image": null}, "options": [{"id": "C3Qud", "text": "<math><mfrac><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mn>2</mn><msqrt><mfrac><mrow><msub><mrow><mi>α</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>α</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "oj6Hj", "text": "<math><mfrac><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mn>2</mn><msqrt><mfrac><mrow><msub><mrow><mi>α</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>α</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "E3nOf", "text": "<math><mfrac><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><msqrt><mfrac><mrow><msub><mrow><mi>α</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>α</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "rafJL", "text": "<math><mfrac><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><msqrt><mfrac><mrow><msub><mrow><mi>α</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>α</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/abs/mngibspfznfboabzdznujpobgnrlncrwdpotcaqampanwfanun.png\" /> <br/><br/>According to condition of the problem, height of the isosceles triangle  <math><mi>A</mi><mi>B</mi><mi>C</mi></math>  is unchanged. The dotted lines show configuration<br/><br/>After a temperature rise. Increase in length of rod  <math><mi>A</mi><mi>B</mi><mo>,</mo></math> <br/><br/> <math><mo>∆</mo><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>α</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>∆</mo><mi>T</mi></math> <br/><br/>Thus  <math><mi>A</mi><msup><mrow><mi>A</mi></mrow><mrow><mi>&prime;</mi></mrow></msup><mo>=</mo><mrow><mrow><mn>1</mn></mrow><mo>/</mo><mrow><mn>2</mn></mrow></mrow><mi> </mi><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>α</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>∆</mo><mi>T</mi></math> <br/><br/>We draw a normal from  <math><mi>A</mi></math>  to  <math><mi>A</mi><mi>&prime;</mi><mi>C</mi></math>  (the final length of  <math><mi>A</mi><mi>C</mi></math> ). Increase in length of  <math><mi>A</mi><mi>C</mi></math>  is  <math><mi>A</mi><mi>&prime;</mi><mi>N</mi></math> <br/><br/> <math><msup><mrow><mi>A</mi></mrow><mrow><mi>&prime;</mi></mrow></msup><mi>N</mi><mo>=</mo><msub><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>α</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>∆</mo><mi>T</mi></math> <br/><br/>Considering increase in angle  <math><mi>θ</mi></math>  to be very small.<br/><br/> <math><msup><mrow><mi>A</mi></mrow><mrow><mi>&prime;</mi></mrow></msup><mi>N</mi><mo>≃</mo><mi>A</mi><msup><mrow><mi>A</mi></mrow><mrow><mi>&prime;</mi></mrow></msup><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></math> <br/><br/>Where  <math><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi><mo>=</mo><mfrac><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><mn>2</mn><msub><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></mrow></mrow></math> <br/><br/>Thus, we have  <math><msub><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>α</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>∆</mo><mi>T</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>α</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>∆</mo><mi>T</mi></mrow></mfenced><mfenced separators=\"|\"><mrow><mfrac><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><mn>2</mn><msub><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></mrow></mfenced></math> <br/><br/>Hence  <math><mfrac><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mn>2</mn><msqrt><mfrac><mrow><msub><mrow><mi>α</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>α</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c293ff98e51f42ff", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "07", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>Consider two&nbsp;spheres&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> of the same size and made of the same material. The sphere&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;is hollow while&nbsp;the&nbsp;sphere&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>&nbsp;is solid. If both the spheres are heated to the same temperature, then</p>\r", "image": null}, "options": [{"id": "AuhzT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;expands more than&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>", "image": null, "isCorrect": false}, {"id": "K3s1y", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;expands less than&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>", "image": null, "isCorrect": false}, {"id": "tgHvo", "text": "both the spheres expand equally", "image": null, "isCorrect": true}, {"id": "jj7jC", "text": "data is insufficient.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A cavity in a material expands in exactly the same way as if the cavity were filled with material. Thus, both spheres will expand by the same amount.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c1436a0492eaf15d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "71", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "What should be the lengths of a steel and copper rod at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn> ><mo>.</mo><mn>34</mn><mo>&#160;</mo><mi>cm</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">l</mi></mrow></mfenced><mo>=</mo><mi>&#160;</mi><mn>1.1</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">&#8451;</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">r</mi></mrow></mfenced><mo>=</mo><mn>1.7</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">&#8451;</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br /><math><mfrac><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>0</mn></mrow></msub><mfenced separators=\"|\"><mrow><mi>s</mi></mrow></mfenced></mrow><mrow><msub><mrow><mi>l</mi></mrow><mrow><mn>0</mn></mrow></msub><mfenced separators=\"|\"><mrow><mi>c</mi></mrow></mfenced></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>&#945;</mi><mfenced separators=\"|\"><mrow><mi>c</mi></mrow></mfenced></mrow><mrow><mi>&#945;</mi><mfenced separators=\"|\"><mrow><mi>s</mi></mrow></mfenced></mrow></mfrac><mo>=</mo><mi>&#160;</mi><mfrac><mrow><mn>1.7</mn><mi>&#160;</mi><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>5</mn></mrow></msup></mrow><mrow><mn>1.1</mn><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>5</mn></mrow></msup></mrow></mfrac><mo>=</mo><mn>1.545</mn></math><br /><br /><math><mo>&#8756;</mo><mi>&#160;</mi><msub><mrow><mi>l</mi></mrow><mrow><mn>0</mn></mrow></msub><mfenced separators=\"|\"><mrow><mi>s</mi></mrow></mfenced><mo>=</mo><mn>1.545</mn><msub><mrow><mi>l</mi></mrow><mrow><mn>0</mn></mrow></msub><mfenced separators=\"|\"><mrow><mi>c</mi></mrow></mfenced></math><br /><br />Also, <math><msub><mrow><mi>l</mi></mrow><mrow><mn>0</mn></mrow></msub><mfenced separators=\"|\"><mrow><mi>s</mi></mrow></mfenced><mo>-</mo><msub><mrow><mi>l</mi></mrow><mrow><mn>0</mn></mrow></msub><mfenced separators=\"|\"><mrow><mi>c</mi></mrow></mfenced><mo>=</mo><mn>5</mn></math><br /><br />0.545<math><msub><mrow><mi>l</mi></mrow><mrow><mn>0</mn></mrow></msub><mfenced separators=\"|\"><mrow><mi>c</mi></mrow></mfenced><mo>=</mo><mn>5</mn><mi>&#160;</mi></math><br /><br /><math><msub><mrow><mi>l</mi></mrow><mrow><mn>0</mn></mrow></msub><mfenced separators=\"|\"><mrow><mi>c</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>0.545</mn></mrow></mfrac><mo>=</mo><mn>9.17</mn><mi>&#160;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math><br /><br />And <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>l</mi><mn>0</mn></msub><mfenced separators=\"|\"><mi>s</mi></mfenced><mo>=</mo><mn>1.545</mn><mo>&#215;</mo><mn>9.17</mn><mi>&#160;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">&#160;</mi><mo>=</mo><mn>14.17</mn><mi>&#160;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863be78a1e2199db07f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "55", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>The apparent coefficients of volume expansion of a &nbsp;liquid filled in vessel A and B of identical volumes are found to be&nbsp;<math><mrow><msub><mi>γ</mi> <mn>1</mn> </msub> </mrow> </math>&nbsp;and&nbsp;<math><mrow><msub><mi>γ</mi> <mn>2</mn></msub></mrow></math>, respectively. If <math> <mrow> <msub> <mi>α</mi> <mn>1</mn> </msub> </mrow> </math>&nbsp;be the coefficient of&nbsp; linear expansion of A then&nbsp;the coefficient of&nbsp; linear expansion&nbsp;of B will be</p>\r", "image": null}, "options": [{"id": "WwYJ7", "text": "<math> <mrow> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mi>&gamma;</mi> <mn>1</mn> </msub> <mo>-</mo> <msub> <mi>&gamma;</mi> <mn>2</mn> </msub> </mrow> </mfenced> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> <mo>-</mo> <msub> <mi>&alpha;</mi> <mn>1</mn> </msub> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "vHGtf", "text": "<math> <mrow> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mi>γ</mi> <mn>2</mn> </msub> <mo>-</mo> <msub> <mi>γ</mi> <mn>1</mn> </msub> </mrow> </mfenced> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> <mo>+</mo> <msub> <mi>α</mi> <mn>1</mn> </msub> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "rG9tt", "text": "<math> <mrow> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mi>&gamma;</mi> <mn>2</mn> </msub> <mo>-</mo> <msub> <mi>&gamma;</mi> <mn>1</mn> </msub> </mrow> </mfenced> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> <mo>-</mo> <msub> <mi>&alpha;</mi> <mn>1</mn> </msub> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "HMtNd", "text": "<math> <mrow> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mi>&gamma;</mi> <mn>1</mn> </msub> <mo>-</mo> <msub> <mi>&gamma;</mi> <mn>2</mn> </msub> </mrow> </mfenced> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> <mo>+</mo> <msub> <mi>&alpha;</mi> <mn>1</mn> </msub> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let V be the volume of the liquid and <math> <mrow> <mo>&#916;</mo> <mtext>T</mtext> </mrow> </math>&nbsp;the rise in temperature. Since apparent expansion = true expansion - expansion of vessel<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;&#160;&#160;&#160;</mo><mtext>V</mtext><msub><mi>&#947;</mi><mn>1</mn></msub><mo>&#916;</mo><mtext>T</mtext><mo>=</mo><mtext>V</mtext><mi>&#947;</mi><mo>&#916;</mo><mtext>T-V</mtext><mfenced><mrow><mn>3</mn><msub><mi>&#945;</mi><mn>1</mn></msub></mrow></mfenced><mo>&#916;</mo><mtext>T</mtext></math><br /><br />or,&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mi>&#947;</mi> <mn>1</mn> </msub> <mo>=</mo> <mi>&#947;</mi> <mo>+</mo> <mn>3</mn> <msub> <mi>&#945;</mi> <mn>1</mn> </msub> </mrow> </math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(i)<br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(for vessel A)<br /><br />and&nbsp;<math> <mrow> <msub> <mi>&#947;</mi> <mn>2</mn> </msub> <mo>=</mo> <mi>&#947;</mi> <mo>+</mo> <mn>3</mn> <msub> <mi>&#945;</mi> <mn>2</mn> </msub> </mrow> </math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(ii)<br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(for vessel B)<br /><br />where <math> <mrow> <mi>&#947;</mi> </mrow> </math>&nbsp;is the coefficient of real expansion of the liquid.<br />Subtracting Eq. (ii) from Eq. (i),<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mi>&#947;</mi> <mn>1</mn> </msub> <mo>-</mo> <msub> <mi>&#947;</mi> <mn>2</mn> </msub> <mo>=</mo> <mn>3</mn> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mi>&#945;</mi> <mn>1</mn> </msub> <mo>-</mo> <msub> <mi>&#945;</mi> <mn>2</mn> </msub> </mrow> </mfenced> </mrow> </math><br /><br />or,&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mi>&#945;</mi> <mn>1</mn> </msub> <mo>-</mo> <msub> <mi>&#945;</mi> <mn>2</mn> </msub> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mi>&#947;</mi> <mn>1</mn> </msub> <mo>-</mo> <msub> <mi>&#947;</mi> <mn>2</mn> </msub> </mrow> </mfenced> <mo>/</mo> <mn>3</mn> </mrow> </math><br /><br />or,&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#945;</mi><mn>2</mn></msub><mo>=&#160;</mo><mfenced open=\"[\" close=\"]\"><mrow><mfenced><mrow><msub><mi>&#947;</mi><mn>2</mn></msub><mo>-</mo><msub><mi>&#947;</mi><mn>1</mn></msub></mrow></mfenced><mo>/</mo><mn>3</mn></mrow></mfenced><mo>+</mo><msub><mi>&#945;</mi><mn>1</mn></msub></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863bb2283c1aa496075", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "99", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The coefficient of linear expansion of an inhomogeneous rod changes linearly from <math> <mrow> <msub> <mi>α</mi> <mn>1</mn> </msub> </mrow> </math>&nbsp;to <math> <mrow> <msub> <mi>α</mi> <mn>2</mn> </msub> </mrow> </math>&nbsp;from one end to the other end of the rod. the effective coefficient of linear expansion of rod is", "image": null}, "options": [{"id": "0w2Su", "text": "<math> <mrow> <msub> <mi>&alpha;</mi> <mn>1</mn> </msub> <mo>+</mo> <msub> <mi>&alpha;</mi> <mn>2</mn> </msub> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "I7sm5", "text": "<math> <mrow> <mfrac> <mrow> <msub> <mi>α</mi> <mn>1</mn> </msub> <mo>+</mo> <msub> <mi>α</mi> <mn>2</mn> </msub> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "39hjq", "text": "<math> <mrow> <msqrt> <msub> <mi>&alpha;</mi> <mn>1</mn> </msub> <msub> <mi>&alpha;</mi> <mn>2</mn> </msub> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "oz5nc", "text": "<math> <mrow> <msub> <mi>&alpha;</mi> <mn>1</mn> </msub> <mo>-</mo> <msub> <mi>&alpha;</mi> <mn>2</mn> </msub> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The value of <math> <mrow> <mi>&#945;</mi> </mrow> </math>&nbsp;at a distance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math> from the left end is</p><p><math> <mrow> <msub> <mi>&#945;</mi> <mtext>x</mtext> </msub> <mo>=</mo> <msub> <mi>&#945;</mi> <mn>1</mn> </msub> <mo>+</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <msub> <mi>&#945;</mi> <mn>2</mn> </msub> <mo>-</mo> <msub> <mi>&#945;</mi> <mn>1</mn> </msub> </mrow> <mrow> <mtext>L</mtext> </mrow> </mfrac> </mrow> </mfenced> <mtext>x</mtext> </mrow> </math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>&#916;</mo><mtext>L</mtext></mrow><mrow><mo>&#916;</mo><mi mathvariant=\"normal\">T</mi></mrow></mfrac><mo>=</mo><munderover><mo>&#8747;</mo><mn>0</mn><mtext>L</mtext></munderover><msub><mi>&#945;</mi><mtext>x</mtext></msub><mtext>dx</mtext></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>&#8710;</mo><mi mathvariant=\"normal\">L</mi></mrow><mrow><mo>&#8710;</mo><mi mathvariant=\"normal\">T</mi></mrow></mfrac><mo>=</mo><msub><mi mathvariant=\"normal\">&#945;</mi><mn>1</mn></msub><mi mathvariant=\"normal\">L</mi><mo>+</mo><mfrac><mrow><msub><mi mathvariant=\"normal\">&#945;</mi><mn>2</mn></msub><mo>-</mo><msub><mi mathvariant=\"normal\">&#945;</mi><mn>1</mn></msub></mrow><mi mathvariant=\"normal\">L</mi></mfrac><mfenced><mfrac><msup><mi mathvariant=\"normal\">L</mi><mn>2</mn></ms gory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b35bb17e6d294e33", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "64", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A steel rod is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>.</mo><mn>000</mn><mo>&#160;</mo><mi>cm</mi></math> in diameter at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> . A brass ring has an interior diameter of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>.</mo><mn>992</mn><mo>&#160;</mo><mi>cm</mi></math> at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> . In order that the ring just slides onto the steel rod, the common temperature of the two should be<br />\r<br />\r<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><msub><mi mathvariant=\"normal\">&#945;</mi><mi>steel</mi></msub><mo>=</mo><mn>11</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup><mo>/</mo><mi>&#160;</mi><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">&#160;</mi><msub><mi mathvariant=\"normal\">&#945;</mi><mi>brass</mi></msub><mo>=</mo><mn>19</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup><mo>/</mo><mi>&#160;</mi><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></mrow></mfenced></math>", "image": null}, "options": [{"id": "8j30N", "text": "<math xmlns=\"http:// eviousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Determine the lengths of an iron rod and a copper ruler at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> if the difference in their lengths at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>450</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> is the same and is equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi>cm</mi></math>. The coefficient of linear expansion of iron = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> and that of copper = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>17</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>.", "image": null}, "options": [{"id": "RNoHP", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>.</mo><mn>06</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>,</mo><mo>&#160;</mo><mn>20</mn><mo>.</mo><mn>08</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 112px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "OCO5J", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>21</mn><mo>.</mo><mn>0</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>,</mo><mo>&#160;</mo><mn>7</mn><mo>.</mo><mn>00</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 100px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div><div id=\"gtx-trans\" style=\"position: absolute; left: 100px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "ln68y", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>.</mo><mn>30</mn><mo>&#160;</mo><mi>cm</mi><mo>,</mo><mo>&#160;</mo><mn>10</mn><mo>.</mo><mn>10</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 166px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "uMGFY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>11</mn><mo>.</mo><mn>09</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>,</mo><mo>&#160;</mo><mn>15</mn><mo>.</mo><mn>10</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let x be the length of the iron rod at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>, y that of the copper rod at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>, and I the difference in lengths at t<sub>1</sub> and t<sub>2</sub> <sup>o</sup>C.<br /><br />Then&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi><mo>=</mo><mtext>x</mtext><mfenced><mrow><mn>1</mn><mo>+</mo><msub><mi>&#945;</mi><mn>1</mn></msub><msub><mtext>t</mtext><mn>1</mn></msub></mrow></mfenced><mo>-</mo><mtext>y</mtext><mfenced><mrow><mn>1</mn><mo>+</mo><msub><mi>&#945;</mi><mn>2</mn></msub><msub><mtext>t</mtext><mn>1</mn></msub></mrow></mfenced></math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ...(i)<br /><br />and&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#177;</mo><mi>l</mi><mo>=</mo><mtext>x</mtext><mfenced><mrow><mn>1</mn><mo>+</mo><msub><mi>&#945;</mi><mn>1</mn></msub><msub><mtext>t</mtext><mn>2</mn></msub></mrow></mfenced><mo>-</mo><mtext>y</mtext><mfenced><mrow><mn>1</mn><mo>+</mo><msub><mi>&#945;</mi><mn>2</mn></msub><msub><mtext>t</mtext><mn>2</mn></msub></mrow></mfenced></math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ...(ii)<br /><br />Taking + 1<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi><mo>=</mo><mtext>x</mtext><mfenced><mrow><mn>1</mn><mo>+</mo><msub><mi>&#945;</mi><mn>1</mn></msub><msub><mtext>t</mtext><mn>2</mn></msub></mrow></mfenced><mo>-</mo><mtext>y</mtext><mfenced><mrow><mn>1</mn><mo>+</mo><msub><mi>&#945;</mi><mn>2</mn></msub><msub><mtext>t</mtext><mn>2</mn></msub></mrow></mfenced></math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ...(iii)<br /><br />from Eqs. (i) and (iii), we get<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext>x</mtext> <msub> <mi>&#945;</mi> <mn>1</mn> </msub> <mo>=</mo> <mtext>y</mtext> <msub> <mi>&#945;</mi> <mn>2</mn> </msub> </mrow> </math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(iv)<br /><br />from Eqs. (i) and (iv), we get<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext>y</mtext> <mo>=</mo> <mfrac> <mrow> <mi>l</mi><mo>&#8289;</mo> <msub> <mi>&#945;</mi> <mn>1</mn> </msub> </mrow> <mrow> <msub> <mi>&#945;</mi> <mn>2</mn> </msub> <mo>-</mo> <msub> <mi>&#945;</mi> <mn>1</mn> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> <mo>&#215;</mo> <mn>1</mn> <mn>2</mn> <mo>&#215;</mo> <mn>1</mn> <msup> <mn>0</mn> <mrow> <mo>-</mo> <mn>6</mn> </mrow> </msup> </mrow> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>1</mn> <mn>7</mn> <mo>-</mo> <mn>1</mn> <mn>2</mn> </mrow> </mfenced> <mo>&#215;</mo> <mn>1</mn> <msup> <mn>0</mn> <mrow> <mo>-</mo> <mn>6</mn> </mrow> </msup> </mrow> </mfrac> <mo>=</mo> <mtext>4.8</mtext> <mo>cm</mo> </mrow> </math><br /><br />and&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext>x</mtext> <mo>=</mo> <mfrac> <mrow> <mi>l</mi><mo>&#8289;</mo> <msub> <mi>&#945;</mi> <mn>2</mn> </msub> </mrow> <mrow> <msub> <mi>&#945;</mi> <mn>2</mn> </msub> <mo>-</mo> <msub> <mi>&#945;</mi> <mn>1</mn> </msub> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>&#8658;&#160;&#160;&#160;</mo> <mtext>x</mtext> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> <mo>&#215;</mo> <mn>1</mn> <mn>7</mn> <mo>&#215;</mo> <mn>1</mn> <msup> <mn>0</mn> <mrow> <mo>-</mo> <mn>6</mn> </mrow> </msup> </mrow> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>1</mn> <mn>7</mn> <mo>-</mo> <mn>1</mn> <mn>2</mn> </mrow> </mfenced> <mo>&#215;</mo> <mn>1</mn> <msup> <mn>0</mn> <mrow> <mo>-</mo> <mn>6</mn> </mrow> </msup> </mrow> </mfrac> <mtext>cm</mtext> <mo>=</mo> <mtext>6.8</mtext> <mo>cm</mo> </mrow> </math><br /><br />Taking - 1<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>y</mtext><mo>=</mo><mfrac><mrow><mn>2</mn><mi>l</mi><mo>+</mo><mi>l</mi><msub><mi>&#945;</mi><mn>1</mn></msub><mfenced><mrow><msub><mtext>t</mtext><mn>1</mn></msub><mo>+</mo><msub><mtext>t</mtext><mn>2</mn></msub></mrow></mfenced></mrow><mrow><mfenced><mrow><msub><mtext>t</mtext><mn>2</mn></msub><mo>-</mo><msub><mtext>t</mtext><mn>1</mn></msub></mrow></mfenced><mfenced><mrow><msub><mi>&#945;</mi><mn>2</mn></msub><mo>-</mo><msub><mi>&#945;</mi><mn>1</mn></msub></mrow></mfenced></mrow></mfrac><mtext>;</mtext><mtext>x</mtext><mo>=</mo><mfrac><mrow><mn>2</mn><mi>l</mi><mo>+</mo><mi>l</mi><msub><mi>&#945;</mi><mn>2</mn></msub><mfenced><mrow><msub><mtext>t</mtext><mn>1</mn></msub><mo>+</mo><msub><mtext>t</mtext><mn>2</mn></msub></mrow></mfenced></mrow><mrow><mfenced><mrow><msub><mtext>t</mtext><mn>2</mn></msub><mo>-</mo><msub><mtext>t</mtext><mn>1</mn></msub></mrow></mfenced><mfenced><mrow><msub><mi>&#945;</mi><mn>2</mn></msub><mo>-</mo><msub><mi>&#945;</mi><mn>1</mn></msub></mrow></mfenced></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;&#160;&#160;&#160;</mo><mtext>y</mtext><mo>=</mo><mfrac><mrow><mn>2</mn><mo>&#215;</mo><mn>2</mn><mo>+</mo><mn>2</mn><mo>&#215;</mo><mn>1</mn><mn>2</mn><mo>&#215;</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup><mfenced><mrow><mn>4</mn><mn>5</mn><mn>0</mn><mo>+</mo><mn>5</mn><mn>0</mn></mrow></mfenced></mrow><mrow><mfenced><mrow><mn>4</mn><mn>5</mn><mn>0</mn><mo>-</mo><mn>5</mn><mn>0</mn></mrow></mfenced><mfenced><mrow><mn>1</mn><mn>7</mn><mo>-</mo><mn>1</mn><mn>2</mn></mrow></mfenced><mo>&#215;</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup></mrow></mfrac><mtext>cm</mtext><mo>=</mo><mn>2</mn><mn>0</mn><mn>0</mn><mn>6</mn><mo>cm</mo><mo>=</mo><mo>20.06</mo><mo>&#160;</mo><mtext>m</mtext></math><br /><br />&nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>x</mtext><mo>=</mo><mfrac><mrow><mn>2</mn><mo>&#215;</mo><mn>2</mn><mo>+</mo><mn>2</mn><mo>&#215;</mo><mn>1</mn><mn>2</mn><mo>&#215;</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup><mfenced><mrow><mn>4</mn><mn>5</mn><mn>0</mn><mo>+</mo><mn>5</mn><mn>0</mn></mrow></mfenced></mrow><mrow><mfenced><mrow><mn>4</mn><mn>5</mn><mn>0</mn><mo>-</mo><mn>5</mn><mn>0</mn></mrow></mfenced><mfenced><mrow><mn>1</mn><mn>7</mn><mo>-</mo><mn>1</mn><mn>2</mn></mrow></mfenced><mo>&#215;</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup></mrow></mfrac><mtext>cm</mtext><mo>=</mo><mo>2008.5</mo><mo>cm</mo><mo>=</mo><mo>20.08</mo><mo>&#160;</mo><mtext>m</mtext></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a10b4f243b1126f5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "102", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two uniform brass rods A and B of lengths <math><mi>l</mi></math> and <math><mn>2</mn><mi>l</mi></math> and radii <math><mn>2</mn><mi>r</mi><mi>&nbsp;</mi></math>and <math><mi>r</mi></math> respectively are heated to the same temperature. The ratio of the increase in the volumes of A to that of B is", "image": null}, "options": [{"id": "3KiHR", "text": "<math><mn>1</mn><mo>:</mo><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "FiL0T", "text": "<math><mn>1</mn><mo>:</mo><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "w9H69", "text": "<math><mn>2</mn><mo>:</mo><mn>1</mn></math>", "image": null, "isCorrect": true}, {"id": "42vtD", "text": "<math><mn>1</mn><mo>:</mo><mn>4</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For brass rod A<br /><br />Volume <math><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub></math>= <math><mi>&pi;</mi><msup><mrow><mfenced separators=\"|\"><mrow><mn>2</mn><mi>r</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mi>&nbsp;</mi><mo>&times;</mo><mi>l</mi></math> ...(i)<br /><br />For volume expansion<br /><br /><math><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><msubsup> <mtext>V</mtext> <mn>1</mn> <mo>&prime;</mo> </msubsup><mo>=</mo><mi>&nbsp;</mi><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>(</mo><mn>1</mn><mo>+</mo><mi>&gamma;</mi><mo>∆</mo><mi>t</mi><mo>)</mo></math><br /><br /><math><mo>&rArr;&nbsp;&nbsp;&nbsp;</mo><msubsup> <mtext>V</mtext> <mn>1</mn> <mo>&prime;</mo> </msubsup><mrow></mrow><mi>&nbsp;</mi><mo>-</mo><mi>&nbsp;</mi><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn><mi>&nbsp;</mi><mi>&nbsp;</mi></mrow></msub><mo>&prop;</mo><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub></math><br /><br />Or <math><mo>∆</mo><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi></mrow></msub><mo>&prop;</mo><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub></math> ...(ii)<br /><br />Similarly, for brass rod B<br /><br />Volume <math><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mi mathvariant=\"normal\">&pi;</mi><msup><mrow><mo>(</mo><mi>r</mi><mo>)</mo></mrow><mrow><mn>2</mn></mrow></msup><mo>&times;</mo><mn>2</mn><mi>l</mi></math> ...(iii)<br /><br />and <math><mi>&nbsp;</mi><mo>∆</mo><msub><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msub><mi>&nbsp;</mi><mo>&prop;</mo><msub><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msub></math> ...(iv)<br /><br />Dividing Eq. (i) by Eq. (ii), we get<br /><br /><math><mfrac><mrow><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>&pi;</mi><mn>4</mn><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>l</mi></mrow><mrow><mi>&pi;</mi><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup><mn>2</mn><mi>l</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>1</mn></mrow></mfrac></math><br /><br />From eqs. (ii) and (iv),<br /><br /><math><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><mo>∆</mo><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><mo>∆</mo><msub><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>1</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863957fda8753dce253", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "01", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A <math> <mrow> <mtext>1&nbsp;L</mtext></mrow> </math> glass flask contains some mercury. It is found that at different temperatures the volume of air inside the flask remains the same. What is the volume of mercury in this flask if coefficient of linear expansion of glass is <math> <mrow> <mtext>9</mtext><mo>×</mo><msup> <mrow> <mtext>10</mtext></mrow> <mrow> <mo>−</mo><mn>6</mn></mrow> </msup> <mo>/</mo><mmultiscripts> <mtext>C</mtext> <mprescripts></mprescripts> <none></none> <mo>∘</mo> </mmultiscripts> </mrow> </math> while of volume expansion of mercury is <math> <mrow> <mtext>1</mtext><mtext>.8</mtext><mo>×</mo><msup> <mrow> <mtext>10</mtext></mrow> <mrow> <mo>−</mo><mn>4</mn></mrow> </msup> <mo>/</mo><mmultiscripts> <mtext>C</mtext> <mprescripts></mprescripts> <none></none> <mtext>o</mtext> </mmultiscripts> </mrow> </math>?", "image": null}, "options": [{"id": "F3YfP", "text": "<math > <mrow>  <mtext>50&#x00A0;cc</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "YIr1q", "text": "<math> <mrow>  <mtext>100&#x00A0;cc</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "zbzcc", "text": "<math> <mrow>  <mtext>150&#x00A0;cc</mtext></mrow></math>", "image": null, "isCorrect": true}, {"id": "9Ifwn", "text": "<math> <mrow>  <mtext>200&#x00A0;cc</mtext></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "It is given that the volume of air in the flask remains the same. This means that the expansion in the volume of the vessel is exactly equal to the volume expansion of mercury.<br /><br />i.e.,&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>Δ</mo> <msub> <mtext>V</mtext> <mtext>G</mtext> </msub> <mo>=</mo> <mo>Δ</mo> <msub> <mtext>V</mtext> <mtext>L</mtext> </msub> </mrow> </math><br /><br />or&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mtext>V</mtext> <mtext>G</mtext> </msub> <msub> <mi>γ</mi> <mtext>G</mtext> </msub> <mo>Δ</mo> <mi>θ</mi> <mo>=</mo> <msub> <mtext>V</mtext> <mtext>L</mtext> </msub> <msub> <mi>γ</mi> <mtext>L</mtext> </msub> <mo>Δ</mo> <mi>θ</mi> </mrow> </math><br /><br /><math> <mrow> <mo>∴&nbsp;&nbsp;&nbsp;&nbsp;</mo> <msub> <mtext>V</mtext> <mtext>L</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>V</mtext> <mtext>G</mtext> </msub> <msub> <mi>γ</mi> <mtext>G</mtext> </msub> </mrow> <mrow> <msub> <mi>γ</mi> <mtext>L</mtext> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>0</mn> <mn>0</mn> <mn>0</mn> <mo>×</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>3</mn> <mo>×</mo> <mn>9</mn> <mo>×</mo> <mn>1</mn> <msup> <mn>0</mn> <mrow> <mo>-</mo> <mn>6</mn> </mrow> </msup> </mrow> </mfenced> </mrow> <mrow> <mtext>1.8</mtext> <mo>×</mo> <mn>1</mn> <msup> <mn>0</mn> <mrow> <mo>-</mo> <mn>4</mn> </mrow> </msup> </mrow> </mfrac> <mo>=</mo> <mn>1</mn> <mn>5</mn> <mn>0</mn> <mo>cc</mo> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639270ce0b18b9e781", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "104", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A piece of metal floats in mercury. The coefficients of volume expansion of the metal and mercury are <math> <mrow> <msub> <mi>γ</mi> <mn>1</mn> </msub> </mrow> </math>&nbsp;and <math> <mrow> <msub> <mi>γ</mi> <mn>2</mn> </msub> </mrow> </math>, respectively. If the temperatures of both mercury and the metal are increased by <math> <mrow> <mo>Δ</mo> <mtext>T</mtext> </mrow> </math>, the fraction of the volume of the metal submerged in mercury changes by the factor of", "image": null}, "options": [{"id": "au42F", "text": "<math> <mrow> <mfrac> <mrow> <mn>1</mn> <mo>+</mo> <msub> <mi>&gamma;</mi> <mn>2</mn> </msub> <mo>&Delta;</mo> <mtext>T</mtext> </mrow> <mrow> <mn>1</mn> <mo>+</mo> <msub> <mi>&gamma;</mi> <mn>1</mn> </msub> <mo>&Delta;</mo> <mtext>T</mtext> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "O1GjC", "text": "<math> <mrow> <mn>1</mn> <mo>+</mo> <msub> <mi>&gamma;</mi> <mn>2</mn> </msub> <mo>&Delta;</mo> <mtext>T</mtext> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "b4vD3", "text": "<math> <mrow> <mn>1</mn> <mo>+</mo> <msub> <mi>&gamma;</mi> <mn>1</mn> </msub> <mo>&Delta;</mo> <mtext>T</mtext> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "euAlZ", "text": "<math> <mrow> <mfrac> <mrow> <mn>1</mn> <mo>+</mo> <msub> <mi>&gamma;</mi> <mn>2</mn> </msub> <mo>&Delta;</mo> <mtext>T</mtext> </mrow> <mrow> <mn>1</mn> <mo>-</mo> <msub> <mi>&gamma;</mi> <mn>1</mn> </msub> <mo>&Delta;</mo> <mtext>T</mtext> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As,&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mi>&gamma;</mi> <mn>1</mn> </msub> <mo>=</mo> <mfrac> <mrow> <mo>&Delta;</mo> <msub> <mtext>V</mtext> <mn>1</mn> </msub> </mrow> <mrow> <msub> <mtext>V</mtext> <mn>1</mn> </msub> <mo>&Delta;</mo> <mtext>T</mtext> </mrow> </mfrac> </mrow> </math>&nbsp;and&nbsp;<math> <mrow> <msub> <mi>&gamma;</mi> <mn>2</mn> </msub> <mo>=</mo> <mfrac> <mrow> <mo>&Delta;</mo> <msub> <mtext>V</mtext> <mn>2</mn> </msub> </mrow> <mrow> <msub> <mtext>V</mtext> <mn>2</mn> </msub> <mo>&Delta;</mo> <mtext>T</mtext> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>&rArr;&nbsp;&nbsp;&nbsp;</mo> <mo>&Delta;</mo> <msub> <mtext>V</mtext> <mn>1</mn> </msub> <mo>=</mo> <msub> <mi>&gamma;</mi> <mn>1</mn> </msub> <msub> <mtext>V</mtext> <mn>1</mn> </msub> <mo>&Delta;</mo> <mtext>T</mtext> </mrow> </math><br /><br />and&nbsp;&nbsp;<math> <mrow> <mo>&Delta;</mo> <msub> <mtext>V</mtext> <mn>2</mn> </msub> <mo>=</mo> <msub> <mi>&gamma;</mi> <mn>2</mn> </msub> <msub> <mtext>V</mtext> <mn>2</mn> </msub> <mo>&Delta;</mo> <mtext>T</mtext> </mrow> </math><br /><br />Fraction of volume submerged before temperature is raised is given by <math> <mrow> <mi>f</mi><mo>⁡</mo> <mo>=</mo> <msub> <mi>&rho;</mi> <mn>1</mn> </msub> <mo>/</mo> <msub> <mi>&rho;</mi> <mn>2</mn> </msub> </mrow> </math>.<br />Fraction of volume submerged after the temperature is raised is given by <math> <mrow> <msup> <mrow> <mi>f</mi><mo>⁡</mo> </mrow> <mo>&prime;</mo> </msup> <mo>=</mo> <msubsup> <mi>&rho;</mi> <mn>1</mn> <mo>&prime;</mo> </msubsup> <mo>/</mo> <msubsup> <mi>&rho;</mi> <mn>2</mn> <mo>&prime;</mo> </msubsup> </mrow> </math>.<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&n .org/1998/Math/MathML\"><mn>30</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. At what temperature does it give the correct time? (take time interval = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>24</mn><mo>&nbsp;</mo><mi>hours</mi></math>)", "image": null}, "options": [{"id": "PMBPW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>18</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 20px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "NV0q6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>22</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 17px; top: 41px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "zCP8a", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 37px; top: 41px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "rKgVt", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>25</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 50px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math> <mrow> <mo>Δ</mo> <mtext>t</mtext> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>α</mtext> <mo>Δ</mo> <mtext>T</mtext> <mo>×</mo> <mtext>t</mtext> </mrow> </math></p><p><math> <mrow> <mo>∴</mo> <mn>5</mn> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>α</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>T</mtext> <mo>-</mo> <mn>1</mn> <mn>5</mn> </mrow> </mfenced> <mo>×</mo> <mn>8</mn> <mn>6</mn> <mn>4</mn> <mn>0</mn> <mn>0</mn> </mrow> </math>&nbsp;.........(i)</p><p>And <math> <mrow> <mn>1</mn> <mn>0</mn> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>α</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>3</mn> <mn>0</mn> <mo>-</mo> <mtext>T</mtext> </mrow> </mfenced> <mo>×</mo> <mn>8</mn> <mn>6</mn> <mn>4</mn> <mn>0</mn> <mn>0</mn> </mrow> </math>&nbsp;........(ii)</p><p>Dividing both equations,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>=</mo><mfrac><mfenced><mrow><mi>T</mi><mo>-</mo><mn>15</mn></mrow></mfenced><mfenced><mrow><mn>30</mn><mo>-</mo><mi>T</mi></mrow></mfenced></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mo>&nbsp;</mo><mn>30</mn><mo>-</mo><mi>T</mi><mo>=</mo><mn>2</mn><mi>T</mi><mo>-</mo><mn>30</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mo>&nbsp;</mo><mn>3</mn><mi>T</mi><mo>=</mo><mn>60</mn><mspace linebreak=\"newline\"></mspace><mo>⇒</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mi>T</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>20</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638144870328f18e25", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "97", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "What will be the stress at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>20</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> , if a steel rod with a cross-sectional area of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>150</mn><mi mathvariant=\"normal\">&nbsp;</mi><msup><mi>mm</mi><mn>2</mn></msup></math> is stretched between two fixed points? The tensile load at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5000</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi></math>. (Assume <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>α</mi><mo>=</mo><mn>11.7</mn><mi>&nbsp;</mi><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup><mo>&nbsp;</mo><mo>°</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Y</mi><mo>=</mo><mn>200</mn><mi mathvariant=\"normal\">&nbsp;</mi><mo>×</mo><msup><mn>10</mn><mn>11</mn></msup><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math> )", "image": null}, "options": [{"id": "G8udj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>.7</mo><mi mathvariant=\"normal\">&#160;</mi><mo>&#215;</mo><msup><mn>10</mn><mn>6</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "Gl9HR", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>84</mn><mo>.2</mo><mi mathvariant=\"normal\">&nbsp;</mi><mo>×</mo><msup><mn>10</mn><mn>6</mn></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "OjxuN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>7</mo><mi mathvariant=\"normal\">&nbsp;</mi><mo>×</mo><msup><mn>10</mn><mn>6</mn></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "1OsJv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.842</mo><mi mathvariant=\"normal\">&nbsp;</mi><mo>×</mo><msup><mn>10</mn><mn>6</mn></msup><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let L = free length at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math><br /><br /><math><msub><mrow><mi>L</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo></math> final stretched length in each case.<br /><br /><math><msub><mrow><mi>L</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msub></math> are free length at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>+</mo><mn>20</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mi mathvariant=\"normal\">&#160;</mi><mn>20</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> respectively.<br /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image5-0c49fb53-0d74-4262-bcd4-1a799c87782c.jpg\" style=\"max-width:100%; object-fit:contain\" /><br /><br />We know <math><msub><mrow><mi>s</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><msub><mrow><mi>s</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><mn>2</mn><mi>&#945;</mi><mi>L</mi><mi mathvariant=\"normal\">&#916;</mi><mi>T</mi></math><br /><br />Here, <math><msub><mrow><mi>s</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi>s</mi></mrow><mrow><mn>2</mn></mrow></msub></math> are load deformation.<br /><br /><math><mfrac><mrow><msub><mrow><mi>F</mi></mrow><mrow><mn>2</mn></mrow></msub><mi>L</mi></mrow><mrow><mi>A</mi><mi>Y</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi>F</mi></mrow><mrow><mn>1</mn></mrow></msub><mi>L</mi></mrow><mrow><mi>A</mi><mi>Y</mi></mrow></mfrac><mo>+</mo><mn>2</mn><mi>&#945;</mi><mi>L</mi><mi mathvariant=\"normal\">&#916;</mi><mi>T</mi></math><br /><br /><math><msub><mrow><mi>&#963;</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><msub><mrow><mi>F</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mi>A</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi>F</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><mi>A</mi></mrow></mfrac><mo>+</mo><mn>2</mn><mi>&#945;</mi><mi mathvariant=\"normal\">&#916;</mi><mi>T</mi><mi>Y</mi><mo>=</mo><mfrac><mrow><mn>5000</mn></mrow><mrow><mn>150</mn><mi>&#160;</mi><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup></mrow></mfrac><mo>+</mo><mfenced separators=\"|\"><mrow><mn>2</mn></mrow></mfenced><mi>&#160;</mi><mfenced separators=\"|\"><mrow><mn>11.7</mn><mi>&#160;</mi><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup></mrow></mfenced><mi>&#160;</mi><mfenced separators=\"|\"><mrow><mn>20</mn></mrow></mfenced><mi>&#160;</mi><mfenced separators=\"|\"><mrow><mn>2</mn><mi>&#160;</mi><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>11</mn></mrow></msup></mrow></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>127</mn><mi mathvariant=\"normal\">&#160;</mi><mo>&#215;</mo><msup><mn>10</mn><mn>6</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86380e2458ac6f3a555", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "106", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Calculate the compressional force required to prevent the metallic rod of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi></math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>cm</mi></math> and cross-sectional area <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>&nbsp;</mo><msup><mi>cm</mi><mn>2</mn></msup><mo>&nbsp;</mo></math>when heated through <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>, from expanding lengthwise. Young's modulus of elasticity of the metal is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi></math> and mean coefficient of linear expansion is <math> <mrow> <mi>α</mi> </mrow> </math>&nbsp;per degree celsius.", "image": null}, "options": [{"id": "CdObb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">EA</mtext><mi>&#x3B1;</mi><mtext mathvariant=\"italic\">t</mtext></math>", "image": null, "isCorrect": false}, {"id": "YkWBf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mtext mathvariant=\"italic\">EA</mtext><mi mathvariant=\"italic\">&#x3B1;</mi><mtext mathvariant=\"italic\">t</mtext></mrow><mfenced><mrow><mn mathvariant=\"italic\">1</mn><mo mathvariant=\"italic\">+</mo><mi mathvariant=\"italic\">&#x3B1;</mi><mtext mathvariant=\"italic\">t</mtext></mrow></mfenced></mfrac></math>", "image": null, "isCorrect": true}, {"id": "fiNbm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mstyle displaystyle=\"true\"><mtext mathvariant=\"italic\">EA</mtext><mi mathvariant=\"italic\">&#x3B1;</mi><mtext mathvariant=\"italic\">t</mtext></mstyle><mfenced><mrow><mn mathvariant=\"italic\">1</mn><mo mathvariant=\"italic\">-</mo><mi mathvariant=\"italic\">&#x3B1;</mi><mtext mathvariant=\"italic\">t</mtext></mrow></mfenced></mfrac></math>", "image": null, "isCorrect": false}, {"id": "HRgf9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">E</mtext><mi>l</mi><mo mathvariant=\"italic\">&#x2061;</mo><mi>&#x3B1;</mi><mtext mathvariant=\"italic\">t</mtext></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The change in natural length <math> <mrow> <mo>=</mo> <mo>Δ</mo> <msub> <mrow> <mi>l</mi><mo>⁡</mo> </mrow> <mtext>t</mtext> </msub> <mo>=</mo> <mi>l</mi><mo>⁡</mo> <mi>α</mi> <mtext>t</mtext> </mrow> </math><br />The natural length of rod at temperature <math> <mrow> <msup> <mtext>t</mtext> <mo>∘</mo> </msup> <mtext>C</mtext> <mo>=</mo> <mi>l</mi><mo>⁡</mo> <mo>+</mo> <mi>l</mi><mo>⁡</mo> <mi>α</mi> <mtext>t</mtext> </mrow> </math><br />The decrease in natural length due to developed stress <math> <mrow> <mo>=</mo> <mo>Δ</mo> <mi>l</mi><mo>⁡</mo> </mrow> </math><br />But the length of rod remains constant.<br /><br /><math> <mrow> <mo>∴&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</mo> <mo>Δ</mo> <msub> <mrow> <mi>l</mi><mo>⁡</mo> </mrow> <mtext>t</mtext> </msub> <mo>-</mo> <mo>Δ</mo> <mi>l</mi><mo>⁡</mo> <mo>=</mo> <mn>0</mn> </mrow> </math><br /><br /><math> <mrow> <mo>∴&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</mo> <mo>Δ</mo> <mrow> <mi>l</mi><mo>⁡</mo> </mrow> <mo>=</mo> <mo>Δ</mo> <msub> <mrow> <mi>l</mi><mo>⁡</mo> </mrow> <mtext>t</mtext> </msub> <mo>=</mo> <mi>l</mi><mo>⁡</mo> <mi>α</mi> <mtext>t</mtext> </mrow> </math><br /><br /><math> <mrow> <mo>∴&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</mo> <mtext>E</mtext> <m
