 to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>35</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></math>. Given specific heats of water and liquid are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4200</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi><mo>&nbsp;</mo><mi mathvariant=\"normal\">k</mi><msup><mi mathvariant=\"normal\">g</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&nbsp;</mo><mo>°</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2100</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi><mo>&nbsp;</mo><mi mathvariant=\"normal\">k</mi><msup><mi mathvariant=\"normal\">g</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&nbsp;</mo><mo>°</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> respectively. Find the density of liquid give the answer in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>kg</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>3</mn></mrow></msup></math>. [Assume Newton law of cooling is applicable]", "image": null}, "options": [], "correctValue": "8", "solution": {"text": "<math><mo>-</mo><mfrac><mrow><mi>d</mi><mi>T</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>K</mi></mrow><mrow><mn>100</mn><mo>×</mo><msub><mrow><mi>S</mi></mrow><mrow><mi>w</mi></mrow></msub></mrow></mfrac><mfenced separators=\"|\"><mrow><mi>T</mi><mo>-</mo><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfenced></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <munderover> <mstyle mathsize=\"140%\"><mo>∫</mo></mstyle> <mrow> <mn>40</mn></mrow> <mrow> <mn>35</mn></mrow> </munderover> <mfrac> <mrow> <mo>−    </msup>    </mrow>  </mfrac>  <mo>=</mo><mfrac>   <mn>4</mn>   <mn>5</mn>  </mfrac>  <mo>&#x00D7;</mo><msup>   <mrow>    <mn>10</mn></mrow>   <mn>3</mn>  </msup>  </mrow></math><br /><math xmlns='http://www.w3.org/1998/Math/MathML'> <mrow>  <mo>=</mo><mfrac>   <mrow>    <mn>40</mn></mrow>   <mn>5</mn>  </mfrac>  <mo>&#x00D7;</mo><msup>   <mrow>    <mn>10</mn></mrow>   <mn>2</mn>  </msup>  <mo>=</mo><mn>800</mn><mtext>&#x2004;</mtext><mtext>kg</mtext><mo>/</mo><msup>   <mtext>m</mtext>   <mn>3</mn>  </msup>  </mrow></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631f24ef6d4639097f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "13", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A body cools from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math> minutes. Its temperature comes down to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>33</mn><mo>.</mo><mn>33</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> in the next <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math> minutes. The temperature of the surroundings is", "image": null}, "options": [{"id": "qZ2C4", "text": "<math><mi>15 ℃</mi></math>", "image": null, "isCorrect": false}, {"id": "u182X", "text": "<math><mi>20 ℃</mi></math>", "image": null, "isCorrect": true}, {"id": "s12ax", "text": "<math><mi>25 ℃</mi></math>", "image": null, "isCorrect": false}, {"id": "r27Is", "text": "<math><mi>10 ℃</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using Newton's law of cooling,<br /><br />log<math><mi>&nbsp;</mi><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">θ</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">θ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">θ</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">θ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac><mo>=</mo><mo>-</mo><mi>K</mi><mi>t</mi></math><br /><br />log <math><mfrac><mrow><mn>40</mn><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">θ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>50</mn><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">θ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac><mo>=</mo><mi>&nbsp;</mi><mo>-</mo><mi>K</mi><mo>×</mo><mn>5</mn></math> .....(i)<br /><br />log <math><mfrac><mrow><mn>33.33</mn><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">θ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>40</mn><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">θ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac><mi>&nbsp;</mi><mo>=</mo><mi>&nbsp;</mi><mo>-</mo><mi>K</mi><mo>×</mo><mn>5</mn></math> .....(ii)<br /><br />From Eqs.(i) and (ii),<br /><br /><math><mfrac><mrow><mn>40</mn><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">θ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>50</mn><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">θ</mi></mrow><mrow><mn>0</mn></mrow></msub><mi mathvariant=\"normal\">&nbsp;</mi></mrow></mfrac><mi>&nbsp;</mi><mo>=</mo><mi>&nbsp;</mi><mfrac><mrow><mn>33.33</mn><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">θ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>40</mn><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">θ</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac></math><br /><br />On solving, we get<br /><br /><math><msub><mrow><mi mathvariant=\"normal\">θ</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mn>19.95</mn><mi mathvariant=\"normal\">℃</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>≈</mo><mn>20</mn><mi>℃</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631b0cf0ff6f275b89", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "100", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If the rates of cooling of two different liquids put in exactly similar calorimeters and kept in identical surroundings are the same, then which among the following is most suitable option?", "image": null}, "options": [{"id": "t2X36", "text": "Equal masses of the liquids at the same temperature are taken", "image": null, "isCorrect": false}, {"id": "3Z5qJ", "text": "Equal volumes of the liquids at the same temperature are taken", "image": null, "isCorrect": true}, {"id": "HtESh", "text": "Both 1 and 2", "image": null, "isCorrect": false}, {"id": "FhrzR", "text": "Insufficient information", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <mfrac> <mrow> <mtext>d</mtext> <mi>θ</mi> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mi>σ</mi> <mtext>A</mtext> </mrow> <mrow> <mtext>mc</mtext> </mrow> </mfrac> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msup> <mtext>T</mtext> <mn>4</mn> </msup> <mo>-</mo> <msubsup> <mtext>T</mtext> <mn>0</mn> <mn>4</mn> </msubsup> </mrow> </mfenced> </mrow> </math>. If the liquids put in exactly similar calorimeters and identical surrounding then we can consider T<sub>0</sub> and A constant then <math> <mrow> <mfrac> <mrow> <mtext>d</mtext> <mi>θ</mi> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> <mo>∝</mo> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msup> <mtext>T</mtext> <mn>4</mn> </msup> <mo>-</mo> <msubsup> <mtext>T</mtext> <mn>0</mn> <mn>4</mn> </msubsup> </mrow> </mfenced> </mrow> <mrow> <mtext>mc</mtext> </mrow> </mfrac> </mrow> </math><br /><br />If we consider that equal masses of liquid (m) are taken at the same temperature then <math> <mrow> <mfrac> <mrow> <mtext>d</mtext> <mi>θ</mi> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> <mo>∝</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>c</mtext> </mrow> </mfrac> </mrow> </math><br /><br />So for same rate of cooling c should be equal which is not possible because liquids are of different nature. Again from equation (i)<br /><br /><math> <mrow> <mfrac> <mrow> <mtext>d</mtext> <mi>θ</mi> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> <mo>∝</mo> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msup> <mtext>T</mtext> <mn>4</mn> </msup> <mo>-</mo> <msubsup> <mtext>T</mtext> <mn>0</mn> <mn>4</mn> </msubsup> </mrow> </mfenced> </mrow> <mrow> <mtext>mc</mtext> </mrow> </mfrac> <mo>⇒</mo> <mfrac> <mrow> <mtext>d</mtext> <mi>θ</mi> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> <mo>∝</mo> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msup> <mtext>T</mtext> <mn>4</mn> </msup> <mo>-</mo> <msubsup> <mtext>T</mtext> <mn>0</mn> <mn>4</mn> </msubsup> </mrow> </mfenced> </mrow> <mrow> <mtext>V</mtext> <mi>ρ</mi> <mtext>c</mtext> </mrow> </mfrac> </mrow> </math><br /><br />Now if we consider that equal volume of liquid (V) are taken at the same temperature then <math> <mrow> <mfrac> <mrow> <mtext>d</mtext> <mi>θ</mi> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> <mo>∝</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mi>ρ</mi> <mtext>c</mtext> </mrow> </mfrac> </mrow> </math><br /><br />So for same rate of cooling multiplication of <math> <mrow> <mi>ρ</mi> <mo>×</mo> <mtext>c</mtext> </mrow> </math> for two liquid of different nature can be possible", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863190640853470ebc9", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "94", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two identical containers of the same emissivity contain liquid <math><mi>A</mi></math> and <math><mi>B</mi></math> at same initial temperature <math> <mrow> <mn>60</mn><msup> <mtext> </mtext> <mtext>o</mtext> </msup> <mtext>C</mtext></mrow> </math> and densities <math><msub><mrow><mi>ρ</mi></mrow><mrow><mi>A</mi></mrow></msub></math> &amp;<math><mi>&nbsp;</mi><msub><mrow><mi>ρ</mi></mrow><mrow><mi>B</mi></mrow></msub><mfenced separators=\"|\"><mrow><msub><mrow><mi>ρ</mi></mrow><mrow><mi>A</mi></mrow></msub><mo>&lt;</mo><msub><mrow><mi>ρ</mi></mrow><mrow><mi>B</mi></mrow></msub></mrow></mfenced><mo>.</mo></math> Which of the following plot best represents the temperature variation of both with time? (Given <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>S</mi><mi>A</mi></msub><mo>=</mo><mn>1000</mn><mi>&nbsp;</mi><mn>J</mn><mo>&nbsp;</mo><mn>k</mn><msup><mn>g</mn><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&nbsp;</mo><msup><mn>K</mn><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> &amp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&nbsp;</mi><msub><mi>S</mi><mi>B</mi></msub><mo>=</mo><mn>2000</mn><mi>&nbsp;</mi><mn>J</mn><mo>&nbsp;</mo><mn>k</mn><msup><mn>g</mn><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&nbsp;</mo><msup><mn>K</mn><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>)", "image": null}, "options": [{"id": "qp73E", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/451437a.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 230px; height: 136px;\" />", "image": null, "isCorrect": false}, {"id": "0KwDc", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/451437b.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 230px; height: 133px;\" />", "image": null, "isCorrect": true}, {"id": "Yv28d", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/451437c.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 230px; height: 134px;\" />", "image": null, "isCorrect": false}, {"id": "CNvql", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/451437d.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 230px; height: 136px;\" />", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From Newton's law of cooling,&nbsp;rate of cooling: <math><mfenced separators=\"|\"><mrow><mo>-</mo><mfrac><mrow><mi>d</mi><mi>T</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>4</mn><mi>σ</mi><mi>e</mi><mi>A</mi><msubsup><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>3</mn></mrow></msubsup><mfenced separators=\"|\"><mrow><mi>T</mi><mo>-</mo><msub><mrow><mi>T</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfenced></mrow><mrow><mi>m</mi><mi>s</mi></mrow></mfrac></math><br /><math><mo>∵</mo><msub><mrow><mi>ρ</mi></mrow><mrow><mi>A</mi></mrow></msub><mo>&lt;</mo><msub><mrow><mi>ρ</mi></mrow><mrow><mi>B</mi></mrow></msub></math><br /><math><msub><mrow><mi>m</mi></mrow><mrow><mi>A</mi></mrow></msub><mo>&lt;</mo><msub><mrow><mi>m</mi></mrow><mrow><mi>B</mi></mrow></msub></math><br />And <math><msub><mrow><mi>s</mi></mrow><mrow><mi>A</mi></mrow></msub><mo>&lt;</mo><msub><mrow><mi>s</mi></mrow><mrow><mi>B</mi></mrow></msub></math><br /><math><mo>∴</mo><msub><mrow><mi>m</mi></mrow><mrow><mi>A</mi></mrow></msub><msub><mrow><mi>s</mi></mrow><mrow><mi>A</mi></mrow></msub><mo>&lt;</mo><msub><mrow><mi>m</mi></mrow><mrow><mi>B</mi></mrow></msub><msub><mrow><mi>s</mi></mrow><mrow><mi>B</mi></mrow></msub></math><br />At <math><mi>&nbsp;</mi><mi>t</mi><mo>=</mo><mn>0,</mn></math><br /><math><msub><mrow><mfenced separators=\"|\"><mrow><mo>-</mo><mfrac><mrow><mi>d</mi><mi>T</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mi>A</mi></mrow></msub><mo>&gt;</mo><msub><mrow><mfenced separators=\"|\"><mrow><mo>-</mo><mfrac><mrow><mi>d</mi><mi>T</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mi>B</mi></mrow></msub></math><br />Initially, the rate of cooling for <math><mi>A</mi></math> will be higher than <math><mi>B</mi></math> and temperature <math><mo>(</mo><mi>T</mi><mo>)</mo><mi>&nbsp;</mi></math> vs time <math><mo>(</mo><mi>t</mi><mo>)</mo></math> graph will be a curve.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86317d024c673988bfb", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "63", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Heat energy is incident on the surface of a material at the rate of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1000</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi><mo>&nbsp;</mo><msup><mi>min</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. If the coefficient of absorption is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>8</mn></math> and the coefficient of reflection is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>1</mn></math>, then the amount of heat energy transmitted through the material in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&nbsp;</mo><mi>minutes</mi></math> is", "image": null}, "options": [{"id": "P8cu5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 76px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "Rt4kh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>500</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": true}, {"id": "fGPyx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>700</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "PJiqs", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>900</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <msub> <mi>Q</mi> <mi>i</mi> </msub> <mo>=</mo><mn>1000</mn><mn>&#160;J</mn><mo>/</mo><mn>m</mn></mrow> </math><br /><br /><math> <mrow> <mi>I</mi><mo>=</mo><mi>r</mi><mo>+</mo><mi>a</mi><mo>+</mo><mi>t</mi></mrow> </math><br /><br /><math> <mrow> <mi>t</mi><mo>=</mo><mn>1</mn><mo>&#8722;</mo><mn>0.1</mn><mo>&#8722;</mo><mn>0.8</mn><mo>=</mo><mn>0.1</mn></mrow> </math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">s</mi></math><br /><br /><math> <mrow> <msub> <mi>Q</mi> <mi>t</mi> </msub> <mo>=</mo><mn>0.1</mn><mo>&#215;</mo><mn>1000</mn><mo>&#215;</mo><mn>5</mn></mrow> </math><br /><br /><math> <mrow> <mo>=</mo><mn>500</mn><mn>&#160;J</mn></mrow> </math><br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86317563214b3ee05ca", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "88", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two solid spheres <math><mi>A</mi><mi>&nbsp;</mi></math>and <math><mi>B</mi></math> made of the same material have radii <math><msub><mrow><mi>r</mi></mrow><mrow><mi>A</mi></mrow></msub><mi>&nbsp;</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">d</mi><mi>&nbsp;</mi><msub><mrow><mi>r</mi></mrow><mrow><mi>B</mi></mrow></msub></math>respectively. Both the spheres are cooled from the same temperature under the conditions valid for Newton's law of cooling. The ratio of the rate of change of temperature of <math><mi>A</mi></math> and <math><mi>B</mi></math> is", "image": null}, "options": [{"id": "yJzZp", "text": "<math><mfrac><mrow><msub><mrow><mi>r</mi></mrow><mrow><mi>A</mi></mrow></msub></mrow><mrow><msub><mrow><mi>r</mi></mrow><mrow><mi>B</mi></mrow></msub></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "NnVWV", "text": "<math><mfrac><mrow><msub><mrow><mi>r</mi></mrow><mrow><mi>B</mi></mrow></msub></mrow><mrow><msub><mrow><mi>r</mi></mrow><mrow><mi>A</mi></mrow></msub></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "JcvDs", "text": "<math><mfrac><mrow><msubsup><mrow><mi>r</mi></mrow><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><msubsup><mrow><mi>r</mi></mrow><mrow><mi>B</mi></mrow><mrow><mn>2</mn></mrow></msubsup></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "0UnHJ", i>B</mi></mrow></msub></mrow><mrow><msub><mrow><mi>r</mi></mrow><mrow><mi>A</mi></mrow></msub></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86315b8a79a3ef3b5a6", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "18", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two electric lamps <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> radiate the same power. Their filaments have the same dimensions and have emissivities <math> <mrow> <msub> <mi>e</mi> <mi>A</mi> </msub> </mrow> </math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>e</mi><mi>B</mi></msub></math>&nbsp;respectively. Their surface temperatures are <math> <mrow> <msub> <mi>T</mi> <mi>A</mi> </msub> </mrow> </math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mi>B</mi></msub></math>. The ratio <math> <mrow> <mfrac> <mrow> <msub> <mi>T</mi> <mi>A</mi> </msub> </mrow> <mrow> <msub> <mi>T</mi> <mi>B</mi> </msub> </mrow> </mfrac> </mrow> </math> will be equal to", "image": null}, "options": [{"id": "jeghv", "text": "<math> <mrow> <msup> <mrow> <mrow><mo>(</mo> <mrow> <mfrac> <mrow> <msub> <mi>e</mi> <mi>B</mi> </msub> </mrow> <mrow> <msub> <mi>e</mi> <mi>A</mi> </msub> </mrow> </mfrac> </mrow> <mo>)</mo></mrow> </mrow> <mrow> <mn>1</mn><mo>/</mo><mn>4</mn> </mrow> </msup> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "Mymyz", "text": "<math > <mrow>  <msup>   <mrow>    <mrow><mo>(</mo>     <mrow>      <mfrac>       <mrow>        <ms > <msubsup> <mi>T</mi> <mi>A</mi> <mn>4</mn> </msubsup> <mo>=</mo> <msub> <mi>e</mi> <mi>B</mi> </msub> <msubsup> <mo>T</mo> <mi>B</mi> <mn>4</mn> </msubsup> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630abed3eecfe1b923", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "87", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "When the temperature of a black body increases, it is observed that the wavelength corresponding of maximum energy changes from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>26</mn><mo>&nbsp;</mo><mi>μm</mi></math>&nbsp;to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>13</mn><mo>&nbsp;</mo><mi>μm</mi></math><span style=\"line-height: 20.7999992370605px;\">. The ratio of emissive powers of the body at the respective </span>temperature <span style=\"line-height: 20.7999992370605px;\">is</span>", "image": null}, "options": [{"id": "T5aTi", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>16</mn><mn>1</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "HQRTl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>1</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "5LtDK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>4</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "IX20u", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>16</mn></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The body would appear red     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
