/MathML\"><mi>α</mi><mo>∆</mo><mi>T</mi><mo>≪</mo><mn>1</mn></math>]&nbsp;</p>\r", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "<p>Let us assume that the volume of the liquid in the vessel is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>0</mn></msub></math>&nbsp;and the area of cross-section of the vessel is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>A</mi><mn>0</mn></msub></math>, then</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>l</mi><mn>0</mn></msub><mo>=</mo><mfrac><msub><mi>V</mi><mn>0</mn></msub><msub><mi>A</mi><mn>0</mn></msub></mfrac></math></p><p>Similarly,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi><mo>=</mo><mfrac><mi>V</mi><mi>A</mi></mfrac><mo>=</mo><mfrac><mrow><msub><mi>V</mi><mn>0</mn></msub><mfenced><mrow><mn>1</mn><mo>+</mo><mi>γ</mi><mo>∆</mo><mi>T</mi></mrow></mfenced></mrow><mrow><msub><mi>A</mi><mn>0</mn></msub><mfenced><mrow><mn>1</mn><mo>+</mo><mn>2</mn><mi>α</mi><mo>∆</mo><mi>T</mi></mrow></mfenced></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>l</mi><mo>=</mo><msub><mi>l</mi><mn>0</mn></msub><mfenced><mrow><mn>1</mn><mo>+</mo><mi>γ</mi><mo>∆</mo><mi>T</mi></mrow></mfenced><msup><mfenced><mrow><mn>1</mn><mo>+</mo><mn>2</mn><mi>α</mi><mo>∆</mo><mi>T</mi></mrow></mfenced><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p><p>Using binomial approximation, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi><mo>=</mo><msub><mi>l</mi><mn>0</mn></msub><mfenced><mrow><mn>1</mn><mo>+</mo><mi>γ</mi><mo>∆</mo><mi>T</mi></mrow></mfenced><mfenced><mrow><mn>1</mn><mo>-</mo><mn>2</mn><mi>α</mi><mo>∆</mo><mi>T</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>l</mi><mo>=</mo><msub><mi>l</mi><mn>0</mn></msub><mfenced close=\"]\" open=\"[\"><mrow><mn>1</mn><mo>+</mo><mfenced><mrow><mi>γ</mi><mo>-</mo><mn>2</mn><mi>α</mi></mrow></mfenced><mo>∆</mo><mi>T</mi><mo>-</mo><mn>2</mn><mi>α</mi><mi>γ</mi><msup><mfenced><mrow><mo>∆</mo><mi>T</mi></mrow></mfenced><mn>2</mn></msup></mrow></mfenced></math></p><p>Neglecting&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>α</mi><mi>γ</mi><msup><mfenced><mrow><mo>∆</mo><mi>T</mi></mrow></mfenced><mn>2</mn></msup></math>, since it is insignificant as compared to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>γ</mi><mo>-</mo><mn>2</mn><mi>α</mi></mrow></mfenced><mo>∆</mo><mi>T</mi></math>,&nbsp;we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi><mo>≈</mo><msub><mi>l</mi><mn>0</mn></msub><mfenced close=\"]\" open=\"[\"><mrow><mn>1</mn><mo>+</mo><mfenced><mrow><mi>γ</mi><mo>-</mo><mn>2</mn><mi>α</mi></mrow></mfenced><mo>∆</mo><mi>T</mi></mrow></mfenced><mspace linebreak=\"newline\"></mspace><mo>⇒</mo><mi>l</mi><mo>≈</mo><msub><mi>l</mi><mn>0</mn></msub><mfenced close=\"]\" open=\"[\"><mrow><mn>1</mn><mo>+</mo><mfenced><mrow><mn>5</mn><mi>α</mi><mo>-</mo><mn>2</mn><mi>α</mi></mrow></mfenced><mo>∆</mo><mi>T</mi></mrow></mfenced><mspace linebreak=\"newline\"></mspace><mo>⇒</mo><mi>l</mi><mo>≈</mo><msub><mi>l</mi><mn>0</mn></msub><mfenced close=\"]\" open=\"[\"><mrow><mn>1</mn><mo>+</mo><mn>3</mn><mi>α</mi><mo>∆</mo><mi>T</mi></mrow></mfenced></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>=</mo><mn>3</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636ca74ef984a834f4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "71", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A fluid having a thermal coefficient of volume expansion <math><mi mathvariant=\"normal\">γ</mi></math>&nbsp;is filled in a cylindrical vessel up to a height <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>h</mi><mn>0</mn></msub></math>. The coefficient of linear thermal expansion of the material of the vessel is <math><mi mathvariant=\"normal\">α</mi></math>. If the fluid is heated with the vessel, then find the level of liquid when the temperature increases by <math><mi mathvariant=\"normal\">Δ</mi><mi mathvariant=\"normal\">θ</mi></math>.", "image": null}, "options": [{"id": "edTwF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>h</mi><mn>0</mn></msub><mo>(</mo><mn>1</mn><mo>+</mo><mi>&#947;&#916;&#952;</mi><mo>)</mo></mrow><mrow><mo>(</mo><mn>1</mn><mo>+</mo><mn>2</mn><mi>&#945;&#916;&#952;</mi><mo>)</mo></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "oIquI", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>h</mi><mn>0</mn></msub><mo>(</mo><mn>1</mn><mo>+</mo><mi>&#947;&#916;&#952;</mi><mo>)</mo></mrow><mrow><mo>(</mo><mn>1</mn><mo>+</mo><mn>3</mn><mi>&#945;&#916;&#952;</mi><mo>)</mo></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "VgTec", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>h</mi><mn>0</mn></msub><mo>(</mo><mn>1</mn><mo>+</mo><mi>&#947;&#916;&#952;</mi><mo>)</mo></mrow><mrow><mo>(</mo><mn>1</mn><mo>+</mo><mi>&#945;&#916;&#952;</mi><mo>)</mo></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "gzGp7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>h</mi><mn>0</mn></msub><mrow><mo>(</mo><mn>1</mn><mo>+</mo><mi>&#947;&#916;&#952;</mi><mo>)</mo></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>A</mi><mi>base</mi></msub><mo>=</mo><msub><mi>A</mi><mn>0</mn></msub><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mi>&#946;&#916;</mi><mi>T</mi></mrow></mfenced><mo>=</mo><msub><mi>A</mi><mn>0</mn></msub><mo>(</mo><mn>1</mn><mo>+</mo><mn>2</mn><mi>&#945;&#916;&#952;</mi><mi mathvariant=\"normal\">&#160;</mi><mo>)</mo></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mi>fluid</mi></msub><mo>=</mo><msub><mi>V</mi><mn>0</mn></msub><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mi>&#947;&#916;</mi><mi>T</mi></mrow></mfenced><mo>=</mo><msub><mi>A</mi><mn>0</mn></msub><msub><mi>h</mi><mn>0</mn></msub><mo>(</mo><mn>1</mn><mo>+</mo><mi>&#947;&#916;&#952;</mi><mo>)</mo></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>h</mi><mo>=</mo><msub><mi>A</mi><mn>0</mn></msub><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mn>2</mn><mi>&#945;&#916;&#952;</mi></mrow></mfenced><mi>h</mi><mo>=</mo><msub><mi>A</mi><mn>0</mn></msub><msub><mi>h</mi><mn>0</mn></msub><mo>(</mo><mn>1</mn><mo>+</mo><mi>&#947;&#916;&#952;</mi><mo>)</mo></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><mo>=</mo><mfrac><mrow><msub><mi>h</mi><mn>0</mn></msub><mo>(</mo><mn>1</mn><mo>+</mo><mi>&#947;&#916;&#952;</mi><mo>)</mo></mrow><mrow><mo>(</mo><mn>1</mn><mo>+</mo><mn>2</mn><mi>&#945;&#916;&#952;</mi><mo>)</mo></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636524bf46659f101a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "46", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A steel tape measures the length of a copper rod as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>90</mn><mo>.</mo><mn>0</mn><mo>&nbsp;</mo><mi>cm</mi></math>&nbsp;when both are at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>, the calibration temperature for the tape. What would be the tape reading for the length of the rod when both are at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. Given, <math><mi>α</mi><mi>&nbsp;</mi></math>for steel<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&nbsp;</mi><mn>1.2</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>&nbsp;</mo><mo>°</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mi>&nbsp;</mi></math>and<math><mi>&nbsp;</mi><mi>α</mi><mi>&nbsp;</mi></math>for copper is<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&nbsp;</mi><mn>1.7</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>&nbsp;</mo><mo>°</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>.</mo></math>", "image": null}, "options": [{"id": "38bbX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>90</mn><mo>.</mo><mn>01</mn><mo>&nbsp;</mo><mi>cm</mi></math>", "image": null, "isCorrect": true}, {"id": "aD9B5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>89</mn><mo>.</mo><mn>90</mn><mo>&nbsp;</mo><mi>cm</mi></math>", "image": null, "isCorrect": false}, {"id": "JbYDv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>90</mn><mo>.</mo><mn>22</mn><mo>&nbsp;</mo><mi>cm</mi></math>", "image": null, "isCorrect": false}, {"id": "aR0JT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>89</mn><mo>.</mo><mn>80</mn><mo>&nbsp;</mo><mi>cm</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As the steel tape is calibrated at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>, therefore, adjacent centimeter marks on the steel tape will be separated by a distance of<br /><br /><math><msub><mrow><mi>l</mi></mrow><mrow><mi>t</mi></mrow></msub><mo>=</mo><msub><mrow><mi>l</mi></mrow><mrow><mn>10</mn></mrow></msub><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mi>&nbsp;</mi><msub><mrow><mi>α</mi></mrow><mrow><mi>s</mi></mrow></msub><mo>∆</mo><mi>T</mi></mrow></mfenced><mo>=</mo><mo>(</mo><mn>1</mn><mo>+</mo><msub><mrow><mi>α</mi></mrow><mrow><mi>s</mi></mrow></msub><mn>20</mn><mo>)</mo></math> cm<br /><br />Length of copper rod at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math><br /><br />= <math><mn>90</mn><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><msub><mrow><mi>α</mi></mrow><mrow><mi>c</mi></mrow></msub><mn>20</mn></mrow></mfenced></math>cm<br /><br />Therefore, number of centimeters read on the tape will be<br /><br />= <math><mfrac><mrow><mn>90</mn><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><msub><mrow><mi>α</mi></mrow><mrow><mi>c</mi></mrow></msub><mn>20</mn></mrow></mfenced></mrow><mrow><mn>1</mn><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><msub><mrow><mi>α</mi></mrow><mrow><mi>s</mi></mrow></msub><mn>20</mn></mrow></mfenced></mrow></mfrac><mo>=</mo><mi>&nbsp;</mi><mfrac><mrow><mn>90</mn><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mn>1.7</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>×</mo><mn>20</mn></mrow></mfenced></mrow><mrow><mn>1</mn><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mn>1.2</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>×</mo><mn>20</mn></mrow></mfenced></mrow></mfrac></math><br /><br />= <math><mfrac><mrow><mn>90</mn><mo>×</mo><mn>1.00034</mn></mrow><mrow><mn>1.00024</mn></mrow></mfrac><mo>=</mo><mn>90.01</mn></math> cm", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635d23361861416d37", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "38", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The coefficient of volume expansion of glycerine is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>49</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. The fractional change in its density for a <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> rise in temperature will be", "image": null}, "options": [{"id": "jBxFM", "text": "<math><mn>1.45</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "UNf8F", "text": "<math><mn>2</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>4</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "iPFi2", "text": "<math><mn>3.5</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "q2RsD", "text": "<math><mn>2.5</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let <math><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></math> be the initial volume of glycerine, i.e, at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> (dry). If <math><msub><mrow><mi>V</mi></mrow><mrow><mi>t</mi></mrow></msub></math> be its volume at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math><br /><br />Then <math><msub><mrow><mi>V</mi></mrow><mrow><mi>t</mi></mrow></msub><mo>=</mo><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mi>v</mi><mo>&#8710;</mo><mi>t</mi></mrow></mfenced></math><br /><br /><math><mo>=</mo><mi>&#160;</mi><mi>&#160;</mi><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mn>49</mn><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>&#215;</mo><mn>30</mn></mrow></mfenced><mi>&#160;</mi></math><br /><br /><math><msub><mrow><mi>V</mi></mrow><mrow><mi>t</mi></mrow></msub><mo>=</mo><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mn>0.01470</mn></mrow></mfenced><mo>=</mo><mn>1.0147070</mn><mi>&#160;</mi><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></math><br /><br /><math><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mfrac><mrow><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><msub><mrow><mi>V</mi></mrow><mrow><mi>t</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>1.01470</mn></mrow></mfrac></math><br /><br />Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#961;</mi><mi>o</mi></msub></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#961;</mi><mi>t</mi></msub></math> be the initial and final densities of glycertine then initial density, <math><msub><mrow><mi>&#961;</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mfrac><mrow><mi>m</mi></mrow><mrow><msub><mrow><mi>v</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac></math> and final density, <math><msub><mrow><mi>&#961;</mi></mrow><mrow><mi>t</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>m</mi></mrow><mrow><msub><mrow><mi>V</mi></mrow><mrow><mi>t</mi></mrow></msub></mrow></mfrac></math><br /><br />Where, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>=</mo></math>mass of glycertine<br /><br /><math><mfrac><mrow><mo>&#8710;</mo><mi>&#961;</mi></mrow><mrow><msub><mrow><mi>&#961;</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac><mo>=</mo></math> fractional change in the density<br /><br /><math><mfrac><mrow><msub><mrow><mi>&#961;</mi></mrow><mrow><mi>t</mi></mrow></msub><mo>-</mo><msub><mrow><mi>&#961;</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><msub><mrow><mi>&#961;</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>m</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>V</mi></mrow><mrow><mi>t</mi></mrow></msub></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac></mrow></mfenced></mrow><mrow><mfrac><mrow><mi>m</mi></mrow><mrow><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac></mrow></mfrac><mo>=</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><msub><mrow><mi>V</mi></mrow><mrow><mi>t</mi></mrow></msub></mrow></mfrac><mo>-</mo><mn>1</mn></mrow></mfenced></math><br /><br /><math><mfrac><mrow><mo>&#8710;</mo><mi>&#961;</mi></mrow><mrow><msub><mrow><mi>&#961;</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>1.01470</mn></mrow></mfrac><mo>-</mo><mn>1</mn></mrow></mfenced><mo>=</mo><mo>-</mo><mn>0.0145</mn></math><br /><br />Here, negative sign shows that density decreases with rise in temperature<br /><br /><math><mfrac><mrow><mo>&#8710;</mo><mi>&#961;</mi></mrow><mrow><msub><mrow><mi>&#961;</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac><mo>=</mo><mn>0.0145</mn><mo>=</mo><mn>1.45</mn><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></math><br /><br /><math><mfrac><mrow><mo>&#8710;</mo><mi>&#961;</mi></mrow><mrow><msub><mrow><mi>&#961;</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac><mo>=</mo><mn>1.45</mn><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635cf789f56b986115", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "03", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A block of wood is floating in water at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. The temperature of water is slowly raised from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. With the rise in temperature, the volume of block <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi></math> above water level will", "image": null}, "options": [{"id": "8q1Fo", "text": "increase", "image": null, "isCorrect": true}, {"id": "ubPzV", "text": "decrease", "image": null, "isCorrect": false}, {"id": "EVSWT", "text": "first increase and then decrease", "image": null, "isCorrect": false}, {"id": "oSiqQ", "text": "first decrease and then increase", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "null", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863524b80c6b270eae5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "53", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two metal rods of the same lengths and area of cross-sections are fixed end to end between rigid supports. The materials of the rods have Young's moduli&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Y</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Y</mi><mn>2</mn></msub></math> and coefficients of linear expansion are&nbsp;&nbsp;<math mrow=\"\"> <msub> <mi>α</mi> <mn>1</mn> </msub> <mtext>&nbsp;&nbsp;and&nbsp;&nbsp;</mtext> <msub> <mi>α</mi> <mn>2</mn> </msub> </math>. The junction between the rods does not shift if the rods are cooled. Then", "image": null}, "options": [{"id": "bwv4S", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Y</mi><mn>1</mn></msub><msub><mi>&#x3B1;</mi><mn>1</mn></msub><mo>=</mo><msub><mi>Y</mi><mn>2</mn></msub><msub><mi>&#x3B1;</mi><mn>2</mn></msub></math>", "image": null, "isCorrect": true}, {"id": "0xhKf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Y</mi><mn>1</mn></msub><msub><mi>&#x3B1;</mi><mn>2</mn></msub><mo>=</mo><msub><mi>Y</mi><mn>2</mn></msub><msub><mi>&#x3B1;</mi><mn>1</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "WpwvG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Y</mi><mn>1</mn></msub><msubsup><mi>&#x3B1;</mi><mn>1</mn><mn>2</mn></msubsup><mo>=</mo><msub><mi>Y</mi><mn>2</mn></msub><msubsup><mi>&#x3B1;</mi><mn>2</mn><mn>2</mn></msubsup></math>", "image": null, "isCorrect": false}, {"id": "26i79", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi>Y</mi><mn>1</mn><mn>2</mn></msubsup><msub><mi>&#x3B1;</mi><mn>1</mn></msub><mo>=</mo><msubsup><mi>Y</mi><mn>2</mn><mn>2</mn></msubsup><msub><mi>&#x3B1;</mi><mn>2</mn></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Y</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Y</mi><mn>2</mn></msub></math> are Young&#39;s moduli of the material of the rods and <math> <mrow> <msub> <mi>&#945;</mi> <mn>1</mn> </msub> <mtext>&#160;and&#160;</mtext> <msub> <mi>&#945;</mi> <mn>2</mn> </msub> </mrow> </math> are the coefficients of thermal expansion. Using <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Y</mi><mo>=</mo><mfrac><mi>stress</mi><mi>strain</mi></mfrac></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mi>Y</mi><mi>A</mi><mi>&#945;</mi><mi>t</mi></math>, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>&#160;</mo></math>is the temperature. Tension must be the same in both the rods for their junction to be in equilibrium.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;&#160;&#160;&#160;&#160;</mo><msub><mi>Y</mi><mn>1</mn></msub><mi>A</mi><msub><mi mathvariant=\"normal\">&#945;</mi><mn>1</mn></msub><mi>t</mi><mo>=</mo><msub><mi>Y</mi><mn mathvariant=\"italic\">2</mn></msub><mi>A</mi><msub><mi mathvariant=\"normal\">&#945;</mi><mn>2</mn></msub><mi>t</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86352467bd9012252db", "type": "singleCorrect
