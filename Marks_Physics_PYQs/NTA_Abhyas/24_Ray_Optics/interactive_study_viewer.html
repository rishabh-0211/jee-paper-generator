row> <mn>4</mn> <mn>0</mn> </mrow> </mfrac> </mrow> </mfenced> <mo>=</mo> <mtext>2.5</mtext> <mo>cm</mo> </mrow> </math><br /><br /> <img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029963_Ans_3.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 276px; height: 93px;\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630ceda8f3c30df88f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "81", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A thin plano-convex lens acts like a concave mirror of focal length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>, when silvered on its plane surface. The refractive index of the material of the lens is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>5</mn></math>. The radius of curvature of the convex surface of the lens will be", "image": null}, "options": [{"id": "jCkj7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 70px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "88B56", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 70px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "61biF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 70px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "rK6SN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>8</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 70px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><mo>-</mo><mtext>0.2</mtext><mo>m</mo></math>,<math> <mrow> <msub> <mi>f</mi> <mi>m</mi> </msub> <mo>=</mo><mi>∞</mi></mrow> </math><br /><br /><math> <mrow> <mi>μ</mi> <mo>=</mo> <mtext>1.5</mtext> </mrow> </math>&nbsp;&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>f</mi><mtext>l</mtext></msub><mo>=</mo><mfrac><mi>R</mi><mfenced><mrow><mi>μ</mi><mo>-</mo><mn>1</mn></mrow></mfenced></mfrac><mtext>,&nbsp;&nbsp;</mtext><mfrac><mn>1</mn><msub><mtext mathvariant=\"italic\">f</mtext><mtext>F</mtext></msub></mfrac><mo>=</mo><mfrac><mn>1</mn><msub><mi>f</mi><mtext>m</mtext></msub></mfrac><mo>-</mo><mfrac><mn>2</mn><msub><mi>f</mi><mrow><mi>l</mi><mo>⁡</mo></mrow></msub></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒&nbsp;&nbsp;&nbsp;</mo><mi>F</mi><mo>=</mo><mfrac><mrow><mo>-</mo><msub><mi>f</mi><mrow><mi>l</mi><mo>⁡</mo></mrow></msub></mrow><mn>2</mn></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>F</mi><mo>=</mo><mo>-</mo><mfrac><mi>R</mi><mrow><mn>2</mn><mfenced><mrow><mi>μ</mi><mo>-</mo><mn>1</mn></mrow></mfenced></mrow></mfrac></math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0033051.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 120px; height: 136px;\" /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴&nbsp;&nbsp;&nbsp;</mo><mo>-</mo><mtext>0.2</mtext><mo>=</mo><mo>-</mo><mfrac><mi>R</mi><mrow><mn>2</mn><mfenced><mrow><mtext>1.5</mtext><mo>-</mo><mn>1</mn></mrow></mfenced></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴&nbsp;&nbsp;&nbsp;</mo><mtext>0.2</mtext><mo>=</mo><mfrac><mi>R</mi><mn>1</mn></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴&nbsp;&nbsp;&nbsp;</mo><mi>R</mi><mo>=</mo><mtext>0.2 m</mtext></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630c1f940fb118b9a6", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "76", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "When the gap between two identical concave thin lenses&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mi>μ</mi><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mo>,</mo><mi>f</mi><mo>=</mo><mn>10</mn><mi>&nbsp;</mi><mi>cm</mi></mrow></mfenced></math> placed in contact is filled with certain liquid, the image of an object placed at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>&nbsp;</mo><mi>cm</mi></math> from lens combination shifts away from the lens by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac bevelled=\"true\"><mn>5</mn><mn>4</mn></mfrac><mo>&nbsp;</mo><mi>cm</mi></math>. If the refractive index of the liquid is <math><mi>μ</mi></math>, then write <math><mn>3</mn><mi>μ</mi></math> as your answer.", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "In case (i) (without liquid)<br /><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/a3688d4a-a10e-474c-87ec-56190eeb65a0-image22.png\" style=\"max-width:100%; object-fit:contain\" style=\"height: 168px; width: 140px;\" /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>v</mi></mfrac><mo>-</mo><mfrac><mn>1</mn><mfenced separators=\"|\"><mrow><mo>-</mo><mn>15</mn></mrow></mfenced></mfrac><mo>=</mo><mfrac><mn>2</mn><mi>f</mi></mfrac></math><br /><math><mo>&#8658;</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>v</mi></mfrac><mo>=</mo><mo>-</mo><mfrac><mn>1</mn><mn>5</mn></mfrac><mo>-</mo><mfrac><mn>1</mn><mn>15</mn></mfrac><mo>=</mo><mo>-</mo><mfrac><mn>4</mn><mn>15</mn></mfrac></math><br /><math><mo>&#8658;</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mo>-</mo><mn>3.75</mn><mi mathvariant=\"normal\">&#160;</mi><mi>cm</mi></math><br />When the gap is filled with liquid<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>v</mi><mi>'</mi></msup><mo>=</mo><mo>-</mo><mn>3.75</mn><mo>-</mo><mn>1.25</mn><mo>=</mo><mo>-</mo><mn>5</mn><mi mathvariant=\"normal\">&#160;</mi><mi>cm</mi></math><br /><math><mo>&#8658;</mo></math> <math><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mfenced separators=\"|\"><mrow><mo>-</mo><mn>15</mn></mrow></mfenced></mrow></mfrac><mo>=</mo><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mo>+</mo><mo>(</mo><msub><mrow><mi>&#956;</mi></mrow><mrow><mi>l</mi></mrow></msub><mo>-</mo><mn>1</mn><mo>)</mo><mo>(</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mi>R</mi></mrow></mfrac><mo>)</mo></math><br />Here, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>10</mn></mfrac><mo>=</mo><mfenced separators=\"|\"><mrow><mfrac><mn>3</mn><mn>2</mn></mfrac><mo>-</mo><mn>1</mn></mrow></mfenced><mfenced separators=\"|\"><mfrac><mn>2</mn><mi>R</mi></mfrac></mfenced><mi mathvariant=\"normal\">&#160;</mi><mo>&#8658;</mo><mi>R</mi><mo>=</mo><mn>10</mn><mi mathvariant=\"normal\">&#160;</mi><mi>cm</mi></math><br />Hence, <math><mo>-</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>15</mn></mrow></mfrac><mo>=</mo><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>&#956;</mi></mrow><mrow><mi>l</mi></mrow></msub><mo>-</mo><mn>1</mn></mrow></mfenced></mrow><mrow><mn>5</mn></mrow></mfrac></math><br /><math><mo>&#8658;</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#956;</mi><mi>l</mi></msub><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630aa55e96135ddaf2", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "79", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A symmetric double convex lens is cut in two equal parts by a plane perpendicular to the principal axis. If the power of the original lens is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">D</mi></math>, the power of a cut lens will be</p>\r", "image": null}, "options": [{"id": "XLYuq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">D</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 26px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "n3Uvf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&#160;</mo><mi mathvariant=\"normal\">D</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 26px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "sESL7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">D</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 26px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "V9RyU", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#160;</mo><mi mathvariant=\"normal\">D</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 26px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Biconvex lens is cut perpendicularly to the principle axis, it will become a plano-convex lens.<br /><br />Focal length of biconvex lens<br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mi>f</mi></mrow></mfrac><mo>=</mo><mfenced separators=\"|\"><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mi>R</mi><mo>&#8321;</mo></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>R</mi><mo>&#8322;</mo></mrow></mfrac></mrow></mfenced></math><br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mi>f</mi></mrow></mfrac><mo>=</mo><mfenced separators=\"|\"><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mfrac><mrow><mn>2</mn></mrow><mrow><mi>R</mi></mrow></mfrac><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mo>(</mo><mo>&#8757;</mo><msub><mrow><mi>R</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mi>R</mi><mo>,</mo><msub><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mo>-</mo><mi>R</mi><mo>)</mo></math><br /><br /><math><mo>&#10233;</mo><mi>f</mi><mo>=</mo><mfrac><mrow><mi>R</mi></mrow><mrow><mn>2</mn><mfenced separators=\"|\"><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></mfenced></mrow></mfrac><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mo>&#8230;</mo><mo>.</mo><mo>&#8230;</mo><mo>(</mo><mi>i</mi><mo>)</mo></math><br /><br />For plano-convex lens<br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mi>f</mi><mo>&#8321;</mo></mrow></mfrac><mo>=</mo><mfenced separators=\"|\"><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mi>R</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>&#8734;</mi></mrow></mfrac></mrow></mfenced></math><br /><br /><math><msup><mrow><mi>f</mi></mrow><mrow><mn>1</mn></mrow></msup><mo>=</mo><mfrac><mrow><mi>R</mi></mrow><mrow><mfenced separators=\"|\"><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></mfenced></mrow></mfrac><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mo>&#8230;</mo><mo>&#8230;</mo><mo>&#8230;</mo><mo>&#8230;</mo><mo>.</mo><mo>(</mo><mi>i</mi><mi>i</mi><mo>)</mo></math><br /><br />Comparing Eqs. (i) and (ii), we see that focal length becomes double.<br /><br />Power of lens P <math><mo>&#8733;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>f</mi><mi>o</mi><mi>c</mi><mi>a</mi><mi>l</mi><mi>&#160;</mi><mi>l</mi><mi>e</mi><mi>n</mi><mi>g</mi><mi>t</mi><mi>h</mi></mrow></mfrac></math><br /><br />Hence, power will become half.<br /><br />New power = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>2</mn></mfrac><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">D</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86306124f4d0699a825", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "87", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If two <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>+</mo><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">D</mi></math>, lenses are mounted at some distance apart, the equivalent power will always be negative, if the distance is", "image": null}, "options": [{"id": "fMZmW", "text": "Greater than <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>&#160;</mo><mi>cm</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 133px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "Tgl5D", "text": "Equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#160;</mo><mi>cm</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 61px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "akPyb", "text": "Greater than 8<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&nbsp;</mo><mi>cm</mi></math>", "image": null, "isCorrect": false}, {"id": "0Of82", "text": "Less than <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#160;</mo><mi>cm</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 68px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When two lenses are separated by some distance <math><mi>x</mi></math>, then equivalent power<br /><br /><math><mi>P</mi><mo>=</mo><mi>P</mi><mo>&#8321;</mo><mo>+</mo><mi>P</mi><mo>&#8322;</mo><mo>-</mo><mi>x</mi><mi>P</mi><mo>&#8321;</mo><mi>P</mi><mo>&#8322;</mo></math><br /><br /><math><mo>&#8756;</mo><mi>P</mi><mo>=</mo><mn>5</mn><mo>+</mo><mn>5</mn><mo>-</mo><mi>x</mi><mo>&#215;</mo><mn>5</mn><mo>&#215;</mo><mn>5</mn></math><br /><br /><math><mi>o</mi><mi>r</mi><mi>&#160;</mi><mi>P</mi><mo>=</mo><mn>10</mn><mo>-</mo><mn>25</mn><mi>x</mi></math><br /><br />Power <math><mi>P</mi></math> will be negative if 10-25x will be negative<br /><br /><math><mi>i</mi><mi>e</mi><mo>,</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mn>25</mn><mi>x</mi><mo>&#62;</mo><mn>10</mn></math><br /><br /><math><mi>o</mi><mi>r</mi><mi>&#160;</mi><mi>&#160;</mi><mi>x</mi><mo>&#62;</mo><mfrac><mrow><mn>10</mn></mrow><mrow><mn>25</mn></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>o</mi><mi>r</mi><mi>&#160;</mi><mi>&#160;</mi><mi>x</mi><mo>&#62;</mo><mfrac><mn>10</mn><mn>25</mn></mfrac><mo>&#215;</mo><mn>100</mn><mi>&#160;</mi><mi>cm</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>o</mi><mi>r</mi><mi>&#160;</mi><mi>&#160;</mi><mi>x</mi><mo>&#62;</mo><mn>40</mn><mi mathvariant=\"normal\">&#160;</mi><mi>cm</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "6aa3ab79aa8dc1ff68178092", "title": "Combination of Lens and Mirrors", "totalQuestions": 8, "questions": [{"_id": "6151e863fccaa94f6e4c37a2", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "109", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An object is placed at a distance of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>&nbsp;</mo><mi>cm</mi></math> from a convex lens of focal length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi>cm</mi></math>. On the other side of the lens, a convex mirror is placed at its focus such that the image by the combination coincides with the object itself. What is the focal length (in cm) of the convex mirror?<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/KT0000339_Question_1_.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 250px; height: 137px;\" />", "image": null}, "options": [], "correctValue": "10", "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/KT0000339_AnsExp_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 270px; height: 137px;\" />​<br /><br />The retrace of the path after reflection from mirror rays after refraction from lens must incident towards the centre of curvature of the mirror<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>Image by lense&#160;</mtext><mspace linebreak=\"newline\"/><mo>&#160;</mo><mfrac><mn>1</mn><mtext>v</mtext></mfrac><mo>-</mo><mfrac><mn>1</mn><mtext>u</mtext></mfrac><mo>=</mo><mfrac><mn>1</mn><mtext>f</mtext></mfrac><mspace width=\"0.5em\"/><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mspace width=\"0.5em\"/><mfrac><mn>1</mn><mrow><mn>1</mn><mn>0</mn><mo>+</mo><mn>2</mn><msub><mtext>f</mtext><mtext>m</mtext></msub></mrow></mfrac><mo>-</mo><mfrac><mn>1</mn><mrow><mo>-</mo><mn>1</mn><mn>5</mn></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><mrow><mn>1</mn><mn>0</mn></mrow></mfrac></math><br /><br /><math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>1</mn> <mn>0</mn> <mo>+</mo> <mn>2</mn> <msub> <mtext>f</mtext> <mtext>m</mtext> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>1</mn> <mn>0</mn> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>1</mn> <mn>5</mn> </mrow> </mfrac> <mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace><mo>&#8658;</mo> <mspace width=\"0.5em\"></mspace> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>1</mn> <mn>0</mn> <mo>+</mo> <mn>2</mn> <msub> <mtext>f</mtext> <mtext>m</mtext> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>3</mn> <mo>-</mo> <mn>2</mn> </mrow> <mrow> <mn>3</mn> <mn>0</mn> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mn>1</mn> <mn>0</mn> <mo>+</mo> <mn>2</mn> <msub> <mtext>f</mtext> <mtext>m</mtext> </msub> <mo>=</mo> <mn>3</mn> <mn>0</mn> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mo>&#8658;</mo> <mspace width=\"0.5em\"></mspace> <msub> <mtext>f</mtext> <mtext>m</mtext> </msub> <mo>=</mo> <mn>1</mn> <mn>0</mn> <mspace width=\"0.5em\"></mspace> <mtext>cm</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d2dca285d9d746d6", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "09", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An object is placed at a distance of <math> <mrow> <mtext>40&nbsp;cm</mtext></mrow> </math> from a convex lens of focal length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>20&nbsp;cm</mtext></math>.&nbsp;On the far side of the lens, a concave mirror of focal length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>10&nbsp;cm</mtext></math> is placed such that the distance of the object from the concave mirror is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>100&nbsp;cm</mtext></math>. Then the final image which is formed after refraction from the lens, reflection from the mirror and again refraction from the lens, will be", "image": null}, "options": [{"id": "6uqly", "text": "at a distance of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>&#160;</mo><mi>cm</mi></math> from the lens and of the same size of the object", "image": null, "isCorrect": true}, {"id": "7ikcb", "text": "at a distance of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&#160;</mo><mi>cm</mi></math> from the lens and of the same size of the object", "image": null, "isCorrect": false}, {"id": "8Qdvw", "text": "at a distance of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&#160;</mo><mi>cm</mi></math> from the lens and of half the size of the object", "image": null, "isCorrect": false}, {"id": "zIlza", "text": "at a distance of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>&#160;</mo><mi>cm</mi></math> from the lens and of half the size of the object", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Q_13.jpg\" style=\"width: 358px; height: 184px;\" /></p><p>Image is same size, inverted, real and coinciding with object.<br />&nbsp;</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c17c1999111103bd", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "47", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A thin convex lens <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">L</mi></math> (refractive index <math><mo>=</mo><mn>1.5</mn></math> ) is placed on a plane mirror <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi></math>. When a pin is placed at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>, such that <math><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">A</mi><mo>=</mo><mn>18</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi><mo>,</mo></math> its real inverted image is formed at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> itself, as shown in figure. When liquid of refractive index <math><msub><mrow><mi>μ</mi></mrow><mrow><mi>l</mi></mrow></msub></math> is put between the lens and the mirror, the pin has to be moved to <math><msup><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mi>'</mi></mrow></msup><mo>,</mo></math> such that <math><mi mathvariant=\"normal\">O</mi><msup><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mi mathvariant=\"normal\">'</mi></mrow></msup><mo>=</mo><mn>27</mn><mtext> </mtext><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi><mo>,</mo></math> to get its inverted real image at <math><mi mathvariant=\"normal\">A</mi><mi>'</mi></math> itself. The value of <math><msub><mrow><mi>μ</mi></mrow><mrow><mi>l</mi></mrow></msub></math> will be<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-07-04_at_1.13.24_PM.jpeg\" style=\"width: 200px; height: 167px;\" />", "image": null}, "options": [{"id": "Trw95", "text": "<math><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "5vCv1", "text": "<math><msqrt><mn>3</mn></msqrt></math>", "image": null, "isCorrect": false}, {"id": "aZjzt", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "oCi0R", "text": "<math><msqrt><mn>2</mn></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>f</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>×</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>18</mn></mrow></mfrac></math>  <br/><math><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>f</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>μ</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><mn>1</mn></mrow></mfenced></mrow><mrow><mo>-</mo><mn>18</mn></mrow></mfrac></math>  <br/>When <math><msub><mrow><mi>μ</mi></mrow><mrow><mn>1</mn></mrow></msub></math> is filled between lens and mirror, <br/><math><mi>P</mi><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>18</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>18</mn></mrow></mfrac><mfenced separators=\"|\"><mrow><msub><mrow><mi>μ</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><mn>1</mn></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>2</mn><mo>-</mo><mn>2</mn><msub><mrow><mi>μ</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><mn>2</mn></mrow><mrow><mn>18</mn></mrow></mfrac></math>  <br/><math><mo>⇒</mo><msub><mrow><mi>F</mi></mrow><mrow><mi>m</mi></mrow></msub><mo>=</mo><mo>-</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>18</mn></mrow><mrow><mn>2</mn><mo>-</mo><msub><mrow><mi>μ</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></mrow></mfenced></math>  <br/><math><mn>2</mn><mo>=</mo><mn>6</mn><mo>-</mo><mn>3</mn><msub><mrow><mi>μ</mi></mrow><mrow><mn>1</mn></mrow></msub></math>  <br/><math><mn>3</mn><msub><mrow><mi>μ</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>4</mn></math>  <br/><math><msub><mrow><mi>μ</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ba3e90e4b9e1c84b", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "19", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A thin biconvex lens of refractive index <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>2</mn></mfrac></math>&nbsp;is placed on a horizontal plane mirror as shown in the figure. The space between the lens and the mirror is then filled with water of refractive index <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>3</mn></mfrac></math>. It is found that when a point object is placed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>&nbsp;</mo><mi>cm</mi></math>&nbsp;above the lens on its principal&nbsp;axis, the object coincides with its own image. On repeating with another liquid, the object and the image again coincide at a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>25</mn><mo>&nbsp;</mo><mi>cm</mi></math>&nbsp;from the lens. Calculate the refractive index of the liquid.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0006836_Ques1_1.jpg\" style=\"width: 303px; height: 81px;\" /></p>\r", "image": null}, "options": [], "correctValue": "1.6", "solution": {"text": "Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> be the radius of curvature of both the surfaces of the equiconvex lens. In the first case<br /><br />Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">f</mi><mn>1</mn></msub></math>&nbsp;be the focal length of planoconcave lens of index <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">&#956;</mi><mn>1</mn></msub></math>. The focal length of the combined lens system will be given by<br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>F</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <msub> <mtext>f</mtext> <mn>1</mn> </msub> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <msub> <mtext>f</mtext> <mn>2</mn> </msub> </mrow> </mfrac> </mrow> </math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0006836_AnsExp1_1.jpg\" /><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math> <mrow> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mi>&#956;</mi> <mn>1</mn> </msub> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mo>-</mo> <mtext>R</mtext> </mrow> </mfrac> </mrow> </mfenced> <mo>+</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mi>&#956;</mi> <mn>2</mn> </msub> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mo>-</mo> <mtext>R</mtext> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mo>&#8734;</mo> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math><mrow> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>2</mn> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </mfenced> <mo>+</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>4</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mtext>R</mtext></mfrac><mo>-</mo><mfrac><mn>1</mn><mrow><mn>3</mn><mtext>R</mtext></mrow></mfrac><mo>=</mo><mfrac><mn>2</mn><mrow><mn>3</mn><mtext>R</mtext></mrow></mfrac></math>&nbsp;or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mtext>F</mtext><mo>=</mo><mfrac><mrow><mn>3</mn><mtext>R</mtext></mrow><mn>2</mn></mfrac></math><br /><br /><br />Now, image coincides with the object when ray of light retraces its path or it falls normally on the plane mirror. This is possible only when object is at focus of the lens system.<br /><br />Hence,&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">F</mi><mo>=</mo><mn>15</mn><mo>&#160;</mo><mi>cm</mi></math>&nbsp; &nbsp; &nbsp; ( Distance of object = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>&#160;</mo><mi>cm</mi></math>).<br /><br />or &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><mtext>R</mtext></mrow><mn>2</mn></mfrac><mo>=</mo><mn>1</mn><mn>5</mn><mo>&#160;</mo><mtext>cm</mtext><mtext>&#160;or&#160;</mtext><mtext>R</mtext><mo>=</mo><mn>1</mn><mn>0</mn><mo>&#160;</mo><mtext>cm</mtext></math><br /><br />In the second case, let <math> <mrow> <mi>&#956;</mi> </mrow> </math>be the refractive index of the liquid-filled between lens and mirror and let F&#39; be the focal length of new lens system. Then,<br /><br /><u><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0006836_AnsExp1_2.jpg\" style=\"width: 267px; height: 100px;\" /></u><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mtext>F</mtext><mo>'</mo></msup></mfrac><mo>=</mo><mfenced><mrow><msub><mi mathvariant=\"normal\">&#956;</mi><mn>1</mn></msub><mo>-</mo><mn>1</mn></mrow></mfenced><mfenced><mrow><mfrac><mn>1</mn><mtext>R</mtext></mfrac><mo>-</mo><mfrac><mn>1</mn><mtext>-R</mtext></mfrac></mrow></mfenced><mo>+</mo><mfenced><mrow><mi mathvariant=\"normal\">&#956;</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mfenced><mrow><mfrac><mn>1</mn><mrow><mo>-</mo><mo>R</mo></mrow></mfrac><mo>-</mo><mfrac><mn>1</mn><mo>&#8734;</mo></mfrac></mrow></mfenced></math><br /><br />or, &nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mtext>F</mtext><mo>'</mo></msup></mfrac><mo>=</mo><mfenced><mrow><mfrac><mn>3</mn><mn>2</mn></mfrac><mo>-</mo><mn>1</mn></mrow></mfenced><mfenced><mfrac><mn>2</mn><mtext>R</mtext></mfrac></mfenced><mo>-</mo><mfrac><mfenced><mrow><mi mathvariant=\"normal\">&#956;</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mtext>R</mtext></mfrac></math><br /><br />or, &nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mrow><mi mathvariant=\"normal\">F</mi><mo>'</mo></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><mtext>R</mtext></mfrac><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">&#956;</mi><mo>-</mo><mn>1</mn></mrow><mtext>R</mtext></mfrac><mo>=</mo><mfrac><mfenced><mrow><mn>2</mn><mo>-</mo><mi mathvariant=\"normal\">&#956;</mi></mrow></mfenced><mtext>R</mtext></mfrac></math><br /><br />&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mtext>F</mtext><mo>'</mo></msup><mo>=</mo><mfrac><mtext>R</mtext><mrow><mn>2</mn><mo>-</mo><mi mathvariant=\"normal\">&#956;</mi></mrow></mfrac><mo>=</mo><mfrac><mn>10</mn><mrow><mn>2</mn><mo>-</mo><mi mathvariant=\"normal\">&#956;</mi></mrow></mfrac><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mfenced><mrow><mtext>R</mtext><mo>=</mo><mn>10</mn><mo>&#160;</mo><mtext>cm</mtext></mrow></mfenced></math><br /><br /><br />Now, the image coincides with object when it is placed at 25 cm distance.<br /><br />Hence, &nbsp;<math> <mrow> <msup> <mtext>F</mtext> <mo>&#8242;</mo> </msup> <mo>=</mo> <mn>2</mn> <mn>5</mn> </mrow> </math><br /><br />or, &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>10</mn><mrow><mn>2</mn><mo>-</mo><mi mathvariant=\"normal\">&#956;</mi></mrow></mfrac><mo>=</mo><mn>25</mn><mtext>&#160; or &#160;&#160;</mtext><mn>50</mn><mo>-</mo><mn>25</mn><mi mathvariant=\"normal\">&#956;</mi><mo>=</mo><mn>10</mn><mtext>&#160;or&#160;</mtext><mn>25</mn><mi mathvariant=\"normal\">&#956;</mi><mo>=</mo><mn>40</mn></math><br /><br />&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160; &#8756;&#160;</mo><mi mathvariant=\"normal\">&#956;</mi><mo>=</mo><mfrac><mn>40</mn><mn>25</mn></mfrac><mo>=</mo><mn>1</mn><mo>&#183;</mo><mn>6</mn><mtext>&#160;&#160; or &#160; &#160;</mtext><mi mathvariant=\"normal\">&#956;</mi><mo>=</mo><mn>1</mn><mo>&#183;</mo><mn>6</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b7936f286cf0d8ab", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "36", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A cylindrical tube filled with water <math><mfenced separators=\"|\"><mrow><msub><mrow><mi>μ</mi></mrow><mrow><mn>w</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></mfenced></math> is closed at its both ends by two thin, silvered plano-convex lenses, as shown in the figure. Refractive index of lenses <math><msub><mrow><mi>L</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msub></math> are <math><mn>2.0</mn></math> and <math><mn>1.5</mn></math>, while their radii of curvatures are <math><mn>5</mn><mi>&nbsp;cm</mi></math>&nbsp;and <math><mn>9</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>, respectively. A point object is placed somewhere at a point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">O</mi></math> on the axis of the cylindrical tube. If it is found that all the images formed by multiple refractions and reflections coincide with the object, then the distance between both the lenses is</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-06-23_at_2.48.35_PM.jpeg\" style=\"width: 250px; height: 140px;\" /></p>\r", "image": null}, "options": [{"id": "a9FMV", "text": "<math><mn>8</mn><mi> </mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "DB5hf", "text": "<math><mn>18</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": true}, {"id": "2rWdj", "text": "<math><mn>10</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "6yTp3", "text": "<math><mn>14</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>For the lens <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>1</mn></msub></math>,&nbsp;the ray must move parallel to the axis after refraction, for the image to coincide with the object.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>&#956;</mi><mn>1</mn></msub><mi>&#8734;</mi></mfrac><mo>+</mo><mfrac><msub><mi>&#956;</mi><mi>w</mi></msub><mi>x</mi></mfrac><mo>=</mo><mfrac><mrow><msub><mi>&#956;</mi><mrow><mn>1</mn><mi>&#160;</mi></mrow></msub><mo>-</mo><msub><mi>&#956;</mi><mi>w</mi></msub></mrow><msub><mi>R</mi><mn>1</mn></msub></mfrac></math>, where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>&nbsp;is the distance of the object from the lens&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>1</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mstyle displaystyle=\"true\"><mfrac bevelled=\"true\"><mn>4</mn><mn>3</mn></mfrac></mstyle><mi>x</mi></mfrac><mo>=</mo><mfrac><mstyle displaystyle=\"true\"><mn>2</mn><mo>-</mo><mfrac bevelled=\"true\"><mn>4</mn><mn>3</mn></mfrac></mstyle><mn>5</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mn>10</mn><mo>&#160;</mo><mi>cm</mi></math></p><p>For the lens&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>2</mn></msub></math>, the ray must appear to come from the centre of curvature after refraction, for the image to coincide with the object.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>&#956;</mi><mn>2</mn></msub><mrow><mo>-</mo><msub><mi>R</mi><mn>2</mn></msub></mrow></mfrac><mo>+</mo><mfrac><msub><mi>&#956;</mi><mi>w</mi></msub><mi>y</mi></mfrac><mo>=</mo><mfrac><mrow><msub><mi>&#956;</mi><mrow><mn>1</mn><mi>&#160;</mi></mrow></msub><mo>-</mo><msub><mi>&#956;</mi><mi>w</mi></msub></mrow><mo>&#8734;</mo></mfrac></math>, where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math>&nbsp;is the distance of the object from the lens&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>2</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><msub><mi>R</mi><mn>2</mn></msub><mfrac><mstyle displaystyle=\"true\"><mfrac bevelled=\"true\"><mn>4</mn><mn>3</mn></mfrac></mstyle><mstyle displaystyle=\"true\"><mfrac bevelled=\"true\"><mn>3</mn><mn>2</mn></mfrac></mstyle></mfrac><mo>=</mo><mn>8</mn><mo>&#160;</mo><mi>cm</mi></math></p><p>Distance between the two lenses =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#160;</mo><mi>cm</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>8</mn><mo>&#160;</mo><mi>cm</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>18</mn><mo>&#160;</mo><mi>cm</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638506484a1abeee0f", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "73", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A concave mirror of focal length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mi>cm</mi></math> and a convex lens of focal length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi>cm</mi></math> are kept with their optic axes parallel but separated by<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mn>0</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi>cm</mi></math> as shown in the figure. The distance between the lens and mirror is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi>cm</mi></math>. An object of height <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&nbsp;</mo><mi>mm</mi></math> is placed on the optic axis of lens at a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>&nbsp;</mo><mi>cm</mi></math> from the lens. Find the length of the image formed by the mirror in<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mi>mm</mi></math>.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/545106q.png\" style=\"max-width:\"100%\"; object-fit:contain\" style=\"width: 350px; height: 147px;\" />", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "<p>For image formed by the lens<br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>v</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mo>-</mo><mn>15</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mo>+</mo><mn>10</mn></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>v</mi><mn>1</mn></msub><mo>=</mo><mo>+</mo><mn>30</mn><mo>&#160;</mo><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math></p><p><br />i.e. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&#160;</mo><mi>cm</mi></math> behind mirror<br />For mirror<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msub><mi>v</mi><mn>2</mn></msub></mfrac><mo>+</mo><mfrac><mn>1</mn><mn>20</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mrow><mo>-</mo><mn>20</mn></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>v</mi><mn>2</mn></msub><mo>=</mo><mo>-</mo><mn>10</mn><mo>&#160;</mo><mi>cm</mi></math></p><p>Overall magnification = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mfrac><mn>30</mn><mrow><mo>-</mo><mn>15</mn></mrow></mfrac></mfenced><mo>&#215;</mo><mfenced separators=\"|\"><mfrac><mn>10</mn><mn>20</mn></mfrac></mfenced><mo>=</mo><mo>-</mo><mn>1</mn></math><br />Length of image <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>&#160;</mo><mn>1</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>3</mn><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>3</mn><mo>&#160;</mo><mi>mm</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86380f6df99dec40df9", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "45", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A converging lens of focal length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>&nbsp;</mo><mi>cm</mi></math>&nbsp;and a converging mirror of focal length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mi>cm</mi></math>&nbsp;are placed with their principal axes coinciding. A point source&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi></math> is placed on the principal axis at a distance of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>&nbsp;</mo><mi>cm</mi></math>&nbsp;from the lens, as shown in figure. It is found that the final beam comes out parallel to the principal axis. Let the separation between the mirror and the lens be <math> <mrow> <mn>1</mn> <mn>0</mn> <mo>×</mo> <mi mathvariant=\"normal\">k</mi> </mrow> </math>. Find <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">k</mi></math>.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013261_Ques1_1.jpg\" style=\"height: 102px; width: 230px;\" />", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "Let us first locate the image of S formed by the lens L. Here u = 12 cm and f = 15 cm. We have,<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mi></mi><mi>v</mi><mo>⁡</mo> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mi></mi><mi>u</mi><mo>⁡</mo> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mi>f</mi> </mrow> </mfrac> </mrow> </math><br /><br />or, &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mi></mi><mi>v</mi><mo>⁡</mo> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mi></mi><mi>f</mi><mo>⁡</mo> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mi></mi><mi>u</mi><mo>⁡</mo> </mrow> </mfrac> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>1</mn> <mn>5</mn> <mtext>&nbsp;cm</mtext> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>1</mn> <mn>2</mn> <mtext>&nbsp;cm</mtext> </mrow> </mfrac> </mrow> </math><br /><br />or, &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mi></mi><mi>v</mi><mo>⁡</mo> <mo>=</mo> <mo>-</mo> <mn>6</mn> <mn>0</mn> <mtext>&nbsp;cm.</mtext> </mrow> </math><br /><br />The negative sign shows that the image is formed to the left of the lens as suggested in the figure. The image I<sub>1</sub> acts as the source for the mirror. The mirror forms an image I<sub>2</sub> of the source I<sub>1</sub>. This image I<sub>2</sub> then acts as the source for the lens and the final beam comes out parallel to the principal axis. Clearly I<sub>2</sub> must be at the focus of the lens. We have,<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; I<sub>1</sub> I<sub>2</sub> = I<sub>1</sub>L + LI<sub>2</sub> = 60 cm + 15 cm = 75 cm.<br /><br />Suppose the distance of the mirror from I<sub>2</sub> is x cm. For the reflection from the mirror,<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; u = MI<sub>1</sub> = - (75 + x)cm, v = - x cm and f = - 20 cm.<br /><br />Using &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mi></mi><mi>v</mi><mo>⁡</mo> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mi></mi><mi>u</mi><mo>⁡</mo> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mi>f</mi> </mrow> </mfrac> </mrow> </math>,<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>x</mtext> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>7</mn> <mn>5</mn> <mo>+</mo> <mtext>x</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mn>0</mn> </mrow> </mfrac> </mrow> </math><br /><br />or, &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <mn>7</mn> <mn>5</mn> <mo>+</mo> <mn>2</mn> <mtext>x</mtext> </mrow> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>7</mn> <mn>5</mn> <mo>+</mo> <mtext>x</mtext> </mrow> </mfenced> <mtext>x</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mn>0</mn> </mrow> </mfrac> </mrow> </math><br /><br />or, &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msup> <mtext>x</mtext> <mn>2</mn> </msup> <mo>+</mo> <mn>3</mn> <mn>5</mn> <mtext>x</mtext> <mo>-</mo> <mn>1</mn> <mn>5</mn> <mn>0</mn> <mn>0</mn> <mo>=</mo> <mn>0</mn> </mrow> </math><br /><br />or, &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext>x</mtext> <mo>=</mo> <mfrac> <mrow> <mo>-</mo> <mn>3</mn> <mn>5</mn> <mo>±</mo> <msqrt> <mn>3</mn> <mn>5</mn> <mo>×</mo> <mn>3</mn> <mn>5</mn> <mo>+</mo> <mn>4</mn> <mo>×</mo> <mn>1</mn> <mn>5</mn> <mn>0</mn> <mn>0</mn> </msqrt> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math>.<br /><br />This gives x = 25 or - 60.<br /><br />As the negative sign has no physical meaning, only positive sign should be taken. Taking x = 25, the separation between the lens and the mirror is (15 + 25) cm = 40 cm.<br /><br />Hence k = 4", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632fc40c206195be10", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "108", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A thin biconvex lens of refractive index 3/2 is placed on a horizontal plane mirror as shown in the figure. The space between the lens and the mirror is then filled with water of refractive index 4/3. It is found that when a point object is placed 15 cm above the lens on its principle axis, the object coincides with its own image. On repeating with another liquid, the object and the image again coincide at a distance 25 cm from the lens. Calculate the refractive index of the liquid.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0006836_Ques1_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 303px; height: 81px;\" /></p>\r", "image": null}, "options": [{"id": "0FhZ3", "text": "<math> <mrow> <mn>1</mn> <mo>&middot;</mo> <mn>6</mn> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "0A82T", "text": "3.2", "image": null, "isCorrect": false}, {"id": "TrpBy", "text": "0.8", "image": null, "isCorrect": false}, {"id": "WYiSR", "text": "2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let R be the radius of curvature of both the surfaces of the equi-convex lens. In the first case:<br />Let f<sub>1</sub> be the focal length of planoconcave lens of index <math> <mrow> <msub> <mi>&mu;</mi> <mn>1</mn> </msub> </mrow> </math>. The focal length of the combined lens system will be given by:<br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>F</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <msub> <mtext>f</mtext> <mn>1</mn> </msub> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <msub> <mtext>f</mtext> <mn>2</mn> </msub> </mrow> </mfrac> </mrow> </math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0006836_AnsExp1_1.jpg\" style=\"max-width:100%; object-fit:contain\" /><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math> <mrow> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mi>&mu;</mi> <mn>1</mn> </msub> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mo>-</mo> <mtext>R</mtext> </mrow> </mfrac> </mrow> </mfenced> <mo>+</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mi>&mu;</mi> <mn>2</mn> </msub> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mo>-</mo> <mtext>R</mtext> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mo>&infin;</mo> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math><mrow> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>2</mn> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </mfenced> <mo>+</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>4</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math> <mrow> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>3</mn> <mtext>R</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> </mrow> <mrow> <mn>3</mn> <mtext>R</mtext> </mrow> </mfrac>&nbsp; <mtext>&nbsp;of&nbsp;</mtext> <mtext>F</mtext> <mo>=</mo> <mfrac> <mrow> <mn>3</mn> <mtext>R</mtext> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math><br /><br /><br />Now, image coincides with the object when ray of light retraces its path or it falls normally on the plane mirror. This is possible only when object is at focus of the lens system.<br /><br />Hence,&nbsp; F 15 cm &nbsp; &nbsp;&nbsp; ( Distance of object = 15 cm).<br /><br />or &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <mn>3</mn> <mtext>R</mtext> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>=</mo> <mn>1</mn> <mn>5</mn>&nbsp; <mtext>cm</mtext> <mtext>&nbsp;or&nbsp;</mtext> <mtext>R</mtext> <mo>=</mo> <mn>1</mn> <mn>0</mn> <mtext>cm</mtext> </mr
