ges/llxuiihljmadrfgssxcolhnkcqncxqcansgvlqnmgqrfvintke.png\" /></p><p>The above diagram represents the angular positions of possible images that can be formed in the given case. Since, images further than <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>180</mn><mo>°</mo></math>&nbsp;will not be visible, we obtain the maximum number&nbsp;of visible images as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math>.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86397c8e8fb06a177c4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "33", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The figure shows an overhead view of a corridor with a plane mirror <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>MN</mi></math> mounted at one end. A burglar <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> sneaks along the corridor directly towards the centre of the mirror. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">d</mi><mo>=</mo><mn>3</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>, how far from the mirror will the burglar be when the security guard <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi></math> can first see him in the mirror?<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/253142.JPG\" style=\"width: 300px; height: 281px;\" />", "image": null}, "options": [{"id": "74Gqw", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>3.0</mtext><mo>&#xA0;</mo><mi mathvariant=\"normal\">m</mi , "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86348d738451b83a490", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "37", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A point object is moving with a speed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math> in front of an arrangement of two mirrors as shown in the figure. The magnitude of velocity of the image in mirror <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">M</mi><mn>1</mn></msub></math> with respect to the image in mirror <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">M</mi><mn>2</mn></msub></math> is</p>\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/13253_que.JPG\" style=\"width: 250px; height: 105px;\" />", "image": null}, "options": [{"id": "zAQgE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>v</mi><mi>sin</mi><mi>θ</mi></math>", "image": null, "isCorrect": true}, {"id": "8n8pS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mi>sin</mi><mi>&#x3B8;</mi></math>", "image": null, "isCorrect": false}, {"id": "zWPE3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>v</mi><mi>sin</mi><mi>&#x3B8;</mi></math>", "image": null, "isCorrect": false}, {"id": "1nHz8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi>v</mi><mi>sin</mi><mi>&#x3B8;</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Angle between <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><msub><mi mathvariant=\"normal\">I</mi><mn>1</mn></msub></msub></mat  with velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>0</mn></msub></math> as shown in the figure. A point object&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> is also moving with same speed&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>0</mn></msub></math> in the direction shown in the figure. Determine the magnitude of the velocity of the image of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">M</mi><mn>1</mn></msub></math> wrt image of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">M</mi><mn>2</mn></msub></math>?<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/oka_anu.PNG\" style=\"width: 450px; height: 252px;\" />", "image": null}, "options": [{"id": "J2WiN", "text": "<math><msub><mrow><mi>v</mi></mrow><mrow><mn>0</mn></mrow></msub><msqrt><mn>3</mn></msqrt></math>", "image": null, "isCorrect": false}, {"id": "J4uGY", "text": "<math><msub><mrow><mi>v</mi></mrow><mrow><mn>0</mn></mrow></msub><msqrt><mn>6</mn></msqrt></math>", "image": null, "isCorrect": true}, {"id": "nDrdZ", "text": "<math><mfrac><mrow><msub><mrow><mi>v</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "1bMTv", "text": "<math><mfenced separators=\"|\"><mrow><mfrac><mrow><msub><mrow><mi>v</mi></mrow><mrow><mn>0</mn></mrow></msub><msqrt><mn>3</mn></msqrt></mrow><mrow><mn>2</mn></mrow></mfrac><mo>+</mo><msub><mrow><mi>v</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfenced></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/remort.PNG\" style=\"width: 450px; height: 254px;\" /><br />Velocity of image of of the point in the first mirror with respect to the image of the point in the second mirror is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mfenced><msub><mover><mi>V</mi><mo>&#8594;</mo></mover><msub><mi mathvariant=\"normal\">I</mi><mn>1</mn></msub></msub></mfenced><msub><mi mathvariant=\"normal\">I</mi><mn>2</mn></msub></msub><mo>=</mo><mo>-</mo><msub><mi>V</mi><mn>0</mn></msub><msqrt><mn>3</mn></msqrt><mover><mi>i</mi><mo>^</mo></mover><mo>-</mo><msub><mi>V</mi><mn>0</mn></msub><msqrt><mn>3</mn></msqrt><mover><mi>j</mi><mo>^</mo></mover></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"|\" close=\"|\"><msub><mfenced><msub><mover><mi>V</mi><mo>&#8594;</mo></mover><msub><mi mathvariant=\"normal\">I</mi><mn>1</mn></msub></msub></mfenced><msub><mi mathvariant=\"normal\">I</mi><mn>2</mn></msub></msub></mfenced><mo>=</mo><msub><mi>V</mi><mn>0</mn></msub><msqrt><mn>6</mn></msqrt></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863324f7db82bee8070", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "02", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A point object is moving with a speed <math> <mtext>v</mtext> </math> in front of an arrangement of two mirrors as shown in figure. If the velocity of image in mirror <math> <mrow> <msub> <mtext>M</mtext> <mn>1</mn> </msub> </mrow> </math> with respect to image in mirror <math> <mrow> <msub> <mtext>M</mtext> <mn>2</mn> </msub> </mrow> </math> is&nbsp;<math><mrow><mtext>n(v&nbsp;sin</mtext><mtext> </mtext><mi>θ</mi><mo stretchy=\"false\">),</mo></mrow>&nbsp;&nbsp;</math> find <math> <mtext>n</mtext> </math><br />\r<br />\r<br />\r&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013253_Ques1_1.jpg\" /></p>\r", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "Angle between <math> <mrow> <msub> <mrow> <mi></mi><mi>v</mi><mo>⁡</mo> </mrow> <msub> <mtext>I</mtext> <mn>1</mn> </msub> </msub> <mo>&amp;</mo> <msub> <mrow> <mi></mi><mi>v</mi><mo>⁡</mo> </mrow> <msub> <mtext>I</mtext> <mn>2</mn> </msub> </msub> <mtext>&nbsp;is</mtext> <mn>&nbsp;2</mn> <mi>θ</mi> </mrow> </math>. Their magnitudes is <em>v</em>.<br /><br /><br /><u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013253_AnsExp1_1.jpg\" style=\"width: 660px; height: 243px;\" /></strong></u><br /><br /><br /><math> <mrow> <mo>∴</mo><msub> <mi>v</mi> <mrow> <msub> <mi>I</mi> <mn>1</mn> </msub> </mrow> </msub> <msub> <mi>v</mi> <mrow> <msub> <mi>I</mi> <mn>2</mn> </msub> </mrow> </msub> <mo>=</mo><mrow><mo>|</mo> <mrow> <msub> <mover accent=\"true\"> <mi>v</mi> <mo>→</mo> </mover> <mrow> <msub> <mi>I</mi> <mn>1</mn> </msub> </mrow> </msub> <mo>−</mo><msub> <mover accent=\"true\"> <mi>v</mi> <mo>→</mo> </mover> <mrow> <msub> <mi>I</mi> <mn>2</mn> </msub> </mrow> </msub> </mrow> <mo>|</mo></mrow><mo>=</mo><msqrt> <mrow> <msup> <mi>v</mi> <mn>2</mn> </msup> <mo>+</mo><msup> <mi>v</mi> <mn>2</mn> </msup> <mo>−</mo><mn>2</mn><mi>v</mi><mtext> </mtext><mtext> </mtext><mi>v</mi><mi>cos</mi><mn>2</mn><mi>θ</mi></mrow> </msqrt> </mrow> </math><br /><br /><math> <mrow> <mo>=</mo> <mn>2</mn> <mi></mi><mi>v</mi><mo>⁡</mo> <mtext>&nbsp;sin</mtext> <mi>θ</mi> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630e3bd38a9206fed0", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "50", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two large plane mirrors&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>PM</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>PN</mi></math> are arrange as shown. The length of the part of large screen <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>SS</mi><mo>'</mo></math> in which two images of the object placed at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> can be seen is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math> (in m). Find the value <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt><mi>x.</mi></math><br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/vey.PNG\" style=\"width: 215px; height: 200px;\" />", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/mohamatam.PNG\" style=\"width: 350px; height: 340px;\" /></p><p>The normals for the mirror PM is PS&#39; and the normal to the mirror PN is PS. From the geometry of the figure it can be seen that&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>SS</mi><mo>'</mo></msup><mo>=</mo><mi>x</mi><mo>=</mo><mfrac><mn>2</mn><msqrt><mn>3</mn></msqrt></mfrac></math>.</p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt><mi>x</mi><mo>=</mo><mn>2</mn></math>&nbsp;</p><p>&nbsp;</p>", "image": null}, "videoSolution": null, "sy i><mo>&lt;</mo><mtext>f</mtext></math>", "image": null, "isCorrect": false}, {"id": "i1BVx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>f</mtext><mo>&lt;</mo><mi mathvariant=\"normal\">x</mi><mo>&lt;</mo><mn>2</mn><mtext>f</mtext></math>", "image": null, "isCorrect": true}, {"id": "donDQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi><mo>=</mo><mn>2</mn><mtext>f</mtext></math>", "image": null, "isCorrect": false}, {"id": "ORriX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi><mo>&gt;</mo><mn>2</mn><mtext>f</mtext></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since object and image move in opposite directions, the positioning should be as shown in the figure. Object lies between focus and centre of curvature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>f</mtext><mo>&lt;</mo><mi mathvariant=\"normal\">x</mi><mo>&lt;</mo><mn>2</mn><mtext>f</mtext></math>.<br /><br />&nbsp;<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0006759_AnsExp2_1.jpg\" /><br /><br />&nbsp;<math> <mrow> <mo>&nbsp;∴&nbsp;</mo> </mrow> </math> Correct option is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">b</mi><mo>)</mo></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ae202686e06969a3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "98", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Image of an object approaching a convex mirror of radius of curvature <math xmln  mirror are approaching each other with velocities <math><mn>10 m/s</mn></math> and <math><mn>5 m/s</mn></math> as shown in figure. The velocity of image of object at the instant shown in figure is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/136234q.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 230px; height: 200px;\" />", "image": null}, "options": [{"id": "T3Eef", "text": "<math><mn>65 m/s</mn><mi mathvariant=\"normal\">&nbsp;</mi></math> <math><mover accent=\"true\"><mrow><mi mathvariant=\"normal\">i</mi></mrow><mo>^</mo></mover></math>", "image": null, "isCorrect": false}, {"id": "bMj0K", "text": "<math><mn>65 m/s</mn></math> <math><mfenced separators=\"|\"><mrow><mo>-</mo><mover accent=\"true\"><mrow><mi mathvariant=\"normal\">i</mi></mrow><mo>^</mo></mover></mrow></mfenced></math>", "image": null, "isCorrect": true}, {"id": "WKDKR", "text": "<math><mn>40 m/s</mn></math> <math><mover accent=\"true\"><mrow><mi mathvariant=\"normal\">i</mi></mrow><mo>^</mo></mover></math>", "image": null, "isCorrect": false}, {"id": "Gt89c", "text": "<math><mn>40 m/s</mn></math> <math><mfenced separators=\"|\"><mrow><mo>-</mo><mover accent=\"true\"><mrow><mi mathvariant=\"normal\">i</mi></mrow><mo>^</mo></mover></mrow></mfenced></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The formula for velocity of image is given by :<br /><br /><math><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">m</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">f</mi></mrow><mrow><mi mathvariant=\"normal\">f</mi><mo>-</mo><mi mathvariant=\"normal\">u</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mo>-</mo><mn>10</mn></mrow><mrow><mo>-</mo><mn>10</mn><mo>+</mo><mn>15</mn></mrow></mfrac><mo>=</mo><mo>-</mo><mn>2</mn></math><br /><br /><math><mo>∴</mo><msub><mrow><mi mathvariant=\"normal\">V</mi>< angles to the principal axis of a mirror of radius of curvature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>&nbsp;</mo><mi>cm</mi></math> such that its image is virtual, erect and has a length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&nbsp;</mo><mi>cm</mi></math>. What kind of mirror it is and also determine the position of the object?", "image": null}, "options": [{"id": "h4pA7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8211;</mo><mo>&#160;</mo><mn>20</mn><mo>&#160;</mo><mi>cm</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 69px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div><div id=\"gtx-trans\" style=\"position: absolute; left: 69px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "1raJV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&#160;</mo><mi>cm</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 101px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "vV3cY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8211;</mo><mo>&#160;</mo><mn>30</mn><mo>&#160;</mo><mi>cm</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 68px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "AwnAT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&#160;</mo><mi>cm</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 78px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since the image is virtual, erect and of a smaller<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014130_AnsExp_1_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 258px; height: 115px;\" /><br /><br />size, the given mirror is 'convex' (concave mirror does not form an image with the said description).<br /><br />Given&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;R = + 60 cm<br /><br />∴&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi>f</mi><mo>⁡</mo> <mo>=</mo> <mfrac> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi>R</mi><mo>⁡</mo> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>=</mo> <mn>3</mn> <mn>0</mn> <mspace width=\"0.5em\"></mspace> <mtext>cm</mtext> </mrow> </math><br /><br />Transverse magnification,<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mi>m</mi><mo>⁡</mo> <mo>=</mo> <mfrac> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi>I</mi><mo>⁡</mo> </mrow> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi>O</mi><mo>⁡</mo> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>6</mn> </mrow> <mrow> <mn>1</mn> <mn>0</mn> </mrow> </mfrac> <mo>=</mo> <mo>+</mo> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>5</mn> </mrow> </mfrac> </mrow> </math><br /><br />Further&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mi>m</mi><mo>⁡</mo> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <mi></mi><mi></mi><mi>v</mi><mo>⁡</mo> </mrow> <mrow> <mi></mi><mi></mi><mi>u</mi><mo>⁡</mo> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>5</mn> </mrow> </mfrac> </mrow> </math><br /><br />∴&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi>v</mi><mo>⁡</mo> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <mn>3</mn> <mi></mi><mi></mi><mi></mi><mi></mi><mi>u</mi><mo>⁡</mo> </mrow> <mrow> <mn>5</mn> </mrow> </mfrac> </mrow> </math><br /><br />Using&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;& i></math> and a convex lens of focal length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi>cm</mi></math> are kept with their optic axes parallel but separated by<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mn>0</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi>cm</mi></math> as shown in the figure. The distance between the lens and mirror is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi>cm</mi></math>. An object of height <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&nbsp;</mo><mi>mm</mi></math> is placed on the optic axis of lens at a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>&nbsp;</mo><mi>cm</mi></math> from the lens. Find the length of the image formed by the mirror in<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mi>mm</mi></math>.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/545106q.png\" style=\"max-width:\"100%\"; object-fit:contain\" style=\"width: 350px; height: 147px;\" />", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "<p>For image formed by the lens<br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>v</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mo>-</mo><mn>15</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mo>+</mo><mn>10</mn></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>v</mi><mn>1</mn></msub><mo>=</mo><mo>+</mo><mn>30</mn><mo>&#160;</mo><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math></p><p><br />i.e. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&#160;</mo><mi>cm</mi></math> behind mirror<br />For mirror<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msub><mi>v</mi><mn>2</mn></msub></mfrac><mo>+</mo><mfrac><mn>1</mn><mn>20</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mrow><mo>-</mo><mn>20</mn></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>v</mi><mn>2</mn></msub><mo>=</mo><mo>-</mo><mn>10</mn><mo>&#160;</mo><mi>cm</mi></math></p><p>Overall magnification = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mfrac><mn>30</mn><mrow><mo>-</mo><mn>15</mn></mrow></mfrac></mfenced><mo>&#215;</mo><mfenced separators=\"|\"><mfrac><mn>10</mn><mn>20</mn></mfrac></mfenced><mo>=</mo><mo>-</mo><mn>1</mn></math><br />Length of image <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>&#160;</mo><mn>1</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>3</mn><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>3</mn><mo>&#160;</mo><mi>mm</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637de8ecd942466523", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "34", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A spherical mirror is placed&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi>cm</mi></math> below the level of water. A point object is placed in air&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&nbsp;</mo><mi>cm</mi></math> above the water surface on the axis of the mirror such that two images seen by an observer above the water surface coincide. The images are formed by partial reflection at the water surface and due to emerging light after reflection from the mirror. Find the focal length of the mirror. (&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">μ</mi><mtext>water</mtext></msub><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac></math>&nbsp;)", "image": null}, "options": [{"id": "I6HJB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>1</mn><mn>0</mn><mn>0</mn></mrow><mn>3</mn></mfrac><mo>&#160;</mo><mtext>cm</mtext></math>", "image": null, "isCorrect": false}, {"id": "QWfu7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>75</mn><mo>&nbsp;</mo><mi>cm</mi></math>", "image": null, "isCorrect": true}, {"id": "TYEeW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>1</mn><mn>1</mn><mn>0</mn></mrow><mn>8</mn></mfrac><mo>&#160;</mo><mtext>cm</mtext></math>", "image": null, "isCorrect": false}, {"id": "0Ip0A", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&#160;</mo><mi>cm</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/260423_qrghudfafasf.png\" style=\"width: 180px; height: 193px;\" /><br /><br />For partial reflection, the final image should be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&nbsp;</mo><mi>cm</mi></math> below water surface i.e.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mi>cm</mi></math> below the mirror.<p>For the image&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&nbsp;</mo><mi>cm</mi></math> below surface, its actual depth should be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>h</mtext><mo>=</mo><mn>3</mn><mn>0</mn><mfenced><mfrac><mn>4</mn><mn>3</mn></mfrac></mfenced><mo>=</mo><mn>4</mn><mn>0</mn><mo>cm</mo></math>&nbsp;below surface i.e. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&nbsp;</mo><mi>cm</mi></math>&nbsp;below the mirror<br /><br />For mirror,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>u</mtext><mo>=</mo><mo>-</mo><mfenced><mrow><mn>1</mn><mn>0</mn><mo>+</mo><mn>3</mn><mn>0</mn><mfenced><mfrac><mn>4</mn><mn>3</mn></mfrac></mfenced></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi mathvariant=\"normal\">u</mi><mo>=</mo><mo>-</mo><mn>50</mn><mo>&nbsp;</mo><mi>cm</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">v</mi><mo>=</mo><mn>30</mn><mo>&nbsp;</mo><mi>cm</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi mathvariant=\"normal\">f</mi></mfrac><mo>=</mo><mo>-</mo><mfrac><mn>1</mn><mn>50</mn></mfrac><mo>+</mo><mfrac><mn>1</mn><mn>30</mn></mfrac><mo>=</mo><mfrac><mrow><mn>-</mn><mn>3</mn><mo>+</mo><mn>5</mn></mrow><mn>10</mn></mfrac><mo>=</mo><mfrac><mn>2</mn><mn>150</mn></mfrac></math></p><p>or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">f</mi><mo>=</mo><mn>75</mn><mo>cm</mo></math>&nbsp;</p><p>convex mirror of focal length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>75</mn><mo>&nbsp;</mo><mi>cm</mi></math>.<br />&nbsp;</p><p>(diagram drawn was just for reference actually it should be a convex mirror but it was not known so we assumed concave but at final calculation, we found focal length +ve so it must be a convex mirror)</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86367dd9b19b8fea575", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "51", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A candle flame <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi>cm</mi></math> high is kept between a wall and a concave mirror of focal length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> such that its image <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi>cm</mi><mo>&nbsp;</mo></math>high is formed on the wall. Find the distance of candle from the wall and also the distance between the wall and the mirror.", "image": null}, "options": [{"id": "7lhfC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>,<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mn>6&nbsp;</mn><mi mathvariant=\"normal\">m</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 63px; top: -4px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "6vr5S", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 67px; top: -4px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "dszyE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 67px; top: -4px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "wxaW2", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Image of the flame formed by the concave mirror on the wall will be real and inverted, hence magnification<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014132_AnsExp_1_1.jpg\" style=\"width: 256px; height: 163px;\" /><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mi>m</mi><mo>⁡</mo> <mo>=</mo> <mfrac> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>I</mi><mo>⁡</mo> </mrow> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>O</mi><mo>⁡</mo> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mo>-</mo> <mn>1</mn> <mtext>.</mtext> <mn>5</mn> </mrow> <mrow> <mn>0</mn> <mo>·</mo> <mn>5</mn> </mrow> </mfrac> <mo>=</mo> <mo>-</mo> <mn>3</mn> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mi>m</mi><mo>⁡</mo> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>v</mi><mo>⁡</mo> </mrow> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>u</mi><mo>⁡</mo> </mrow> </mfrac> <mo>=</mo> <mo>-</mo> <mn>3</mn> </mrow> </math><br /><br />∴&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mi>v</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>3</mn><mi>u</mi></math><br /><br />Using&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>v</mi><mo>⁡</mo> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>u</mi><mo>⁡</mo> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>f</mi><mo>⁡</mo> </mrow> </mfrac> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>3</mn> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>u</mi><mo>⁡</mo> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>u</mi><mo>⁡</mo> </mrow> </mfrac> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>1</mn> <mtext>.</mtext> <mn>5</mn> </mrow> </mfrac> </mrow> </math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>f</mi><mo>⁡</mo> <mo>=</mo> <mo>-</mo> <mn>1</mn> <mtext>.</mtext> <mn>5</mn> <mtext>m</mtext> </mrow> </mfenced> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <mn>4</mn> </mrow> <mrow> <mn>3</mn> <mi></mi><mi>u</mi><mo>⁡</mo> </mrow> </mfrac> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>1</mn> <mtext>.</mtext> <mn>5</mn> </mrow> </mfrac> </mrow> </math><br /><br />∴&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>u</mi><mo>⁡</mo> <mo>=</mo> <mfrac> <mrow> <mo>-</mo> <mn>4</mn> <mo>×</mo> <mn>1</mn> <mtext>.</mtext> <mn>5</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> <mo>=</mo> <mo>-</mo> <mn>2</mn> <mtext>m</mtext> </mrow> </math><br /><br />Thus the flame is at distance&nbsp;2m from the mirror and &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mi>v</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mn>3</mn><mi>u</mi><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mo>–</mo><mn>6</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math><br /><br />Hence the distance between wall and mirror is 6 m. It implies that the distance between the flame and the wall will be 4m.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636609dbc5295892bc", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "69", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The distance between the virtual image from its real object is <math><mn>60</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math> in case of a concave mirror and the image formed is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math> times magnified. What is the magnitude of focal length (in <math><mtext>cm</mtext></math>) of the mirror?", "image": null}, "options": [], "correctValue": "22.5", "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0068527.jpg\" style=\"width: 297px; height: 125px;\" /><br /><br /><math><mi> x</mi><mi>&#160;</mi><mo>+</mo><mi>&#160;</mi><mn>3</mn><mi>x</mi><mo>=</mo><mn>60</mn><mi>&#160;</mi><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mn>15</mn><mi>&#160;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>u</mi><mo>=</mo><mo>-</mo><mn>15</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>=</mo><mo>+</mo><mi mathvariant=\"normal\">&#160;</mi><mn>3</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>&#160;</mi><mi>m</mi><mo>=</mo><mfrac><mi>f</mi><mrow><mi>f</mi><mo>-</mo><mi>u</mi></mrow></mfrac><mo>&#8658;</mo><mi mathvariant=\"normal\">&#160;</mi><mo>+</mo><mi mathvariant=\"normal\">&#160;</mi><mn>3</mn><mo>=</mo><mfrac><mi>f</mi><mrow><mi>f</mi><mo>-</mo><mo>(</mo><mo>-</mo><mn>15</mn><mo>)</mo></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>&#160;</mi><mn>3</mn><mi>f</mi><mo>+</mo><mi mathvariant=\"normal\">&#160;</mi><mn>45</mn><mo>=</mo><mi>f</mi><mi mathvariant=\"normal\">&#160;</mi><mo>&#8658;</mo><mi>f</mi><mo>=</mo><mo>-</mo><mi mathvariant=\"normal\">&#160;</mi><mn>22.5</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"|\" close=\"|\"><mi>f</mi></mfenced><mo>=</mo><mn>22</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi>cm</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636433f3500f2041d3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "90", "i 04b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A linear object is placed along the axis of a mirror as shown in the figure. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">f</mi></math> is the focal length of the mirror, then the length of the image is<br />\r<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image11-75d04bee-4637-42df-b1f8-eb3dd4f89052.png\" />", "image": null}, "options": [{"id": "85WlD", "text": "<math><mfrac><mrow><mfenced separators=\"|\"><mrow><mn>2</mn><mi mathvariant=\"normal\">f</mi></mrow></mfenced></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "T0m79", "text": "<math><mi mathvariant=\"normal\">f</mi></math>", "image": null, "isCorrect": true}, {"id": "gVrJ7", "text": "<math><mfrac><mrow><mi mathvariant=\"normal\">f</mi></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "VOC8t", "text": "none", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The image of object at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">f</mi></math> will be formed at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">f</mi></math>. So the object and image will coincide at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">f</mi></math>.<br /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image12-9037ddd6-5608-4cc7-a8a7-1f7ca438e2be.png\" /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi mathvariant=\"normal\">v</mi></mfrac><mo>-</mo><mfrac><mn>1</mn><mi mathvariant=\"normal\">u</mi></mfrac><mo>=</mo><mfrac><mn>1</mn><mi mathvariant=\"normal\">f</m >=</mo><mn>1.414</mn></math><br /><br />Since <math><mi mathvariant=\"normal\">μ</mi></math> of green and violet are greater than 1.414 so they will total internal refrected. But red colour will be vetracted.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c18eb41749ddefc6", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "03", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Consider the situation shown in the figure. Here&nbsp;<math><mrow><mi>θ </mi> </mrow> </math> is the maximum angle for which the light suffers total internal reflection at the vertical surface. Then&nbsp;<math><mrow><mi>sin</mi><mi>θ </mi></mrow></math> will be:-<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013259_AnsExp1_1.jpg\" style=\"width: 180px; height: 230px;\" />", "image": null}, "options": [], "correctValue": "00.75", "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013259_AnsExp1_1.jpg\" style=\"width: 180px; height: 230px;\" /><br />The critical angle for this case is<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msup> <mi>θ</mi> <mo>″</mo> </msup> <mo>=</mo>&nbsp; <msup> <mtext>sin</mtext> <mn>-1</mn> </msup> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>1</mn> <mtext>.</mtext> <mn>2</mn> <mn>5</mn> </mrow> </mfrac> <mo>=</mo> <msup> <mtext>sin</mtext> <mn>-1&nbsp;</mn> </msup> <mfrac> <mrow> <mn>4</mn> </mrow> <mrow> <mn>5</mn> </mrow> </mfrac> </mrow> </math><br /><br />or,&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext>sin</mtext> <msup> <mi>θ</mi> <mo>″</mo> </msup> <mo>=</mo> <mfrac> <mrow> <mn>4</mn> </mrow> <mrow> <mn>5</mn> </mrow> </mfrac> </mrow> </math><br /><br />Since&nbsp;&nbsp; <math> <mrow> <msup> <mi>θ</mi> <mo>″</mo> </msup> <mo>=</mo> <mfrac> <mrow> <mi>π</mi> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>-</mo> <msup> <mi>θ</mi> <mo>′</mo> </msup> <mtext>,</mtext> </mrow> </math>&nbsp; we have <math> <mrow> <mtext>sin</mtext> <msup> <mi>θ</mi> <mo>′</mo> </msup> <mo>=</mo> <mtext>cos</mtext> <msup> <mi>θ</mi> <mo>″</mo> </msup> <mo>=</mo> <mn>3</mn> <mo>/</mo> <mn>5</mn> <mtext>.</mtext> </mrow> </math> From Snell's law,<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math> <mrow> <mfrac> <mrow> <mtext>sin&nbsp;</mtext> <mi>θ</mi> </mrow> <mrow> <mtext>sin&nbsp;</mtext> <msup> <mi>θ</mi> <mo>′</mo> </msup> </mrow> </mfrac> <mo>=</mo> <mn>1</mn> <mtext>.</mtext> <mn>2</mn> <mn>5</mn> </mrow> </math><br /><br />or,&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext>sin</mtext> <mi>θ</mi> <mo>=</mo> <mn>1</mn> <mtext>.</mtext> <mn>2</mn> <mn>5</mn> <mo>×</mo> <mtext>sin</mtext> <msup> <mi>θ</mi> <mo>′</mo> </msup> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mn>1</mn> <mtext>.</mtext> <mn>2</mn> <mn>5</mn> <mo>×</mo> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>5</mn> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> </mrow> </math><br /><br />or,&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math> <mrow> <mi>θ</mi> <mo>=</mo> <msup> <mtext>sin</mtext> <mn>-1</mn> </msup> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> </mrow> </math>.<br /><br />If <math> <mrow> <msup> <mi>θ</mi> <mo>″</mo> </msup> </mrow> </math> is greater than the critical angle, <math> <mrow> <mi>θ</mi> </mrow> </math> will be smaller than this value. Thus, the maximum value of <math> <mrow> <mi>θ</mi> </mrow> </math>, for which total reflection takes place at the vertical surface, is <math> <mrow> <msup> <mrow> <mi>sin</mi> </mrow> <mrow> <mo>−</mo><mn>1</mn> </mrow> </msup> <mo stretchy=\"false\">(</mo><mn>3</mn><mo>/</mo><mn>4</mn><mo stretchy=\"false\">)</mo></mrow></math>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ad77225ea62ee3b0", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "63", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A fish looking upwards through the water seeing the outside world contained in a circular horizon. If the refractive index of water is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac bevelled=\"true\"><mn>4</mn><mn>3</mn></mfrac></math> and the fish is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>&nbsp;</mo><mi>cm</mi></math> below the surface, the radius of this circle in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>cm</mi></math> is\r<p style=\"margin-bottom: 0cm\"><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/2927.png\" style=\"width: 250px; height: 265px;\" /></p>\r\r<p style=\"margin-bottom: 0cm\">&nbsp;</p>\r<style type=\"text/css\"><!--\r\t\t@page { margin: 2cm }\r\t\tP { margin-bottom: 0.21cm }\r\t-->\r</style>\r", "image": null}, "options": [{"id": "5wT
