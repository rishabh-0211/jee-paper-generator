"normal\">s</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">b</mi><mi mathvariant=\"normal\">&nbsp;</mi><mfenced separators=\"|\"><mrow><mi>t</mi></mrow></mfenced></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math><br /><br />Lateral shift <math><mi>d</mi><mo>=</mo><mfrac><mrow><mi>t</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">δ</mi></mrow></mrow></mrow><mrow><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>r</mi></mrow></mrow></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>t</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mo>(</mo><mi>i</mi><mo>-</mo><mi>r</mi><mo>)</mo></mrow></mrow></mrow><mrow><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>r</mi></mrow></mrow></mrow></mfrac></math><br /><br /><math><mo>⇒</mo><mfrac><mrow><mi>d</mi></mrow><mrow><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mo>⁡</mo><mo>(</mo><mi>i</mi><mo>-</mo><mi>r</mi><mo>)</mo></mrow><mrow><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>r</mi></mrow></mrow></mrow></mfrac></math><br /><br />or <math><mfrac><mrow><mi>d</mi></mrow><mrow><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>i</mi></mrow></mrow><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>r</mi></mrow></mrow><mo>-</mo><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>i</mi></mrow></mrow><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>r</mi></mrow></mrow></mrow><mrow><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>r</mi></mrow></mrow></mrow></mfrac></math><br /><br />or <math><mfrac><mrow><mi>d</mi></mrow><mrow><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mn>45</mn><mo>°</mo></mrow></mrow><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>r</mi></mrow></mrow><mo>-</mo><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mn>45</mn><mo>°</mo></mrow></mrow><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>r</mi></mrow></mrow></mrow><mrow><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>r</mi></mrow></mrow></mrow></mfrac><mo>=</mo><mfrac><mrow><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>r</mi></mrow></mrow><mo>-</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>r</mi></mrow></mrow></mrow><mrow><msqrt><mn>2</mn></msqrt><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>r</mi></mrow></mrow></mrow></mfrac></math><br /><br />or <math><mfrac><mrow><mi>d</mi></mrow><mrow><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mi>r</mi></mrow></mrow></mrow></mfenced></math><br /><br />or <math><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mi>r</mi></mrow></mrow></mrow></mfenced></math><br /><br />or <math><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mi>r</mi><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><mrow><msqrt><mn>2</mn></msqrt></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></mrow></mrow></math><br /><br />or <math><mi>r</mi><mo>=</mo><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mfrac><mrow><msqrt><mn>2</mn></msqrt></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></mrow></mfenced></mrow></mrow></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636185bebe104b82ed", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "70", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the figure given below, for an angle of incidence <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>45</mn><mo>°</mo></math> at the top surface, what is the minimum refractive index needed for total internal reflection at the vertical face?<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/650025_soludad_1.png\" style=\"width: 180px; height: 147px;\" />", "image": null}, "options": [{"id": "jPO1E", "text": "<math><mfrac><mrow><msqrt><mn>2</mn></msqrt><mo>+</mo><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "3vBAm", "text": "<math><msqrt><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "MyLe5", "text": "<math><msqrt><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "0u9eG", "text": "<math><msqrt><mn>2</mn></msqrt><mo>+</mo><mn>1</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "At point <math><mi>A</mi></math> , by Snell's law<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-07-27_at_3.08.19_PM.jpeg\" style=\"width: 200px; height: 160px;\" /><br /><br /><math><mi>μ</mi><mo>=</mo><mfrac><mrow><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><msup><mrow><mn>45</mn></mrow><mrow><mi>o</mi></mrow></msup></mrow></mrow></mrow><mrow><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>r</mi></mrow></mrow></mrow></mfrac><mo>⇒</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>r</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>μ</mi><msqrt><mn>2</mn></msqrt></mrow></mfrac></math> ... (i)<br /><br />At point <math><mi>B</mi></math> , total internal reflection with <math><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><msub><mrow><mi>i</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mrow><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>μ</mi></mrow></mfrac></math><br /><br />From figure, <math><msub><mrow><mi>i</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msup><mrow><mn>90</mn></mrow><mrow><mi>o</mi></mrow></msup><mo>-</mo><mi>r</mi></math> .... (ii)<br /><br /><math><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><msup><mrow><mn>90</mn></mrow><mrow><mi>o</mi></mrow></msup><mo>-</mo><mi>r</mi></mrow></mfenced></mrow></mrow><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>μ</mi></mrow></mfrac><mo>⇒</mo><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>r</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>μ</mi></mrow></mfrac></math> .... (iii)<br /><br />Now, <math><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>r</mi></mrow></mrow><mo>=</mo><msqrt><mn>1</mn><mo>-</mo><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>r</mi></mrow></mrow></msqrt><mo>=</mo><msqrt><mn>1</mn><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><msup><mrow><mi>μ</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></msqrt><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><msup><mrow><mi>μ</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>1</mn></mrow><mrow><msup><mrow><mi>μ</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></msqrt></math><br /><br />From equation (ii) and (iii), <math><mfrac><mrow><mn>1</mn></mrow><mrow><mi>μ</mi></mrow></mfrac><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><msup><mrow><mi>μ</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>1</mn></mrow><mrow><mn>2</mn><msup><mrow><mi>μ</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></msqrt></math><br /><br />Squaring both sides and then solving, we get<br /><br /><math><mi>μ</mi><mo>=</mo><msqrt><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635d0eada2383617a2", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "43", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<div>\r<p><span style=\"\rcolor:black\">A rectangular glass slab <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ABCD</mi></math></span><span>, of refractive index, &nbsp;<math> <mrow> <msub> <mi>n</mi> <mn>1</mn> </msub> <mo>,</mo> </mrow> </math> &nbsp;is immersed in water of refractive index &nbsp;<math> <mrow> <msub> <mi>n</mi> <mn>2</mn> </msub> <mo stretchy=\"false\">(</mo><msub> <mi>n</mi> <mn>1</mn> </msub> <mo>&gt;</mo><msub> <mi>n</mi> <mn>2</mn> </msub> <mo stretchy=\"false\">)</mo><mo>.</mo> </mrow> </math> &nbsp;A ray of light is incident at the surface <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math>&nbsp;of the slab, as shown. The maximum value of the angle of incidence &nbsp;<math> <mrow> <msub> <mi>α</mi> <mrow> <mi>max</mi> </mrow> </msub> <mo>,</mo> </mrow> </math> such that the ray comes out only from the other surface <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CD</mi></math>,&nbsp;is given by</span></p>\r\r<p align=\"left\" style=\"text-align:left;\"><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-06-30_at_6.54.17_PM.jpeg\" style=\"width: 230px; height: 122px;\" /><br />\r&nbsp;</p>\r</div>\r", "image": null}, "options": [{"id": "txLja", "text": "<div><p align=\"left\" style=\"text-align:left;\"><span style=\"position:relative;top:0.0pt\">&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>sin</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mrow><mo>[</mo><mfrac><msub><mi>n</mi><mn>1</mn></msub><msub><mi>n</mi><mn>2</mn></msub></mfrac><mi>cos</mi><mtext> </mtext><mrow><mo>(</mo><msup><mi>sin</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mtext> </mtext><mfrac><msub><mi>n</mi><mn>2</mn></msub><msub><mi>n</mi><mn>1</mn></msub></mfrac><mo>)</mo></mrow><mo>]</mo></mrow></math> </span></p></div>", "image": null, "isCorrect": true}, {"id": "mAxhh", "text": "<div><p align=\"left\" style=\"text-align:left;\"><span style=\"position:relative;top:0.0pt\">&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>sin</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mrow><mo>[</mo><msub><mi>n</mi><mn>1</mn></msub><mi>cos</mi><mtext> </mtext><mtext> </mtext><mrow><mo>(</mo><msup><mi>sin</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mfrac><mn>1</mn><msub><mi>n</mi><mn>2</mn></msub></mfrac><mo>)</mo></mrow><mo>]</mo></mrow></math> </span></p></div>", "image": null, "isCorrect": false}, {"id": "2CrvR", "text": "<div><p align=\"left\" style=\"text-align:left;\"><span style=\"position:relative;top:0.0pt\">&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>sin</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mrow><mo>(</mo><mfrac><msub><mi>n</mi><mn>1</mn></msub><msub><mi>n</mi><mn>2</mn></msub></mfrac><mo>)</mo></mrow></math> </span></p></div>", "image": null, "isCorrect": false}, {"id": "eeUJs", "text": "<div><p align=\"left\" style=\"text-align:left;\"><span style=\"position:relative;top:0.0pt\">&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>sin</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mrow><mo>(</mo><mfrac><msub><mi>n</mi><mn>2</mn></msub><msub><mi>n</mi><mn>1</mn></msub></mfrac><mo>)</mo></mrow></math> </span></p></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<div><p><span style=\"color:black\">Consider the figure. The ray will come out from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CD</mi></math>&nbsp;if it suffers a total internal reflection at surface <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AD</mi></math>, i.e., it strikes the surface <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AD</mi></math>&nbsp;at critical angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math>&nbsp;(the limiting case).</span></p><p align=\"center\" style=\"text-align:center;\"><img alt=\"\" height=\"128\" id=\"Picture 2\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/IL0000644_sol_1_1.png\" width=\"214\" /></p><p><span style=\"color:black\">Applying Snell’s law at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math>, we get</span></p><p><span style=\"color:black;position:relative;top:0.0pt\">&nbsp;<math> <mrow> <msub> <mi>n</mi> <mn>1</mn> </msub> <mtext> </mtext><mtext> </mtext><mi>sin</mi><mi>C</mi><mo>=</mo><msub> <mi>n</mi> <mn>2</mn> </msub> <mtext> </mtext><mtext> </mtext><mi>or</mi><mtext> </mtext><mtext> </mtext><mi>sin</mi><mtext> </mtext><mtext> </mtext><mi> text><mn>6</mn><mo>&nbsp;</mo><mtext>m</mtext></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"|\" open=\"|\"><mrow><mi>u</mi><msup><mo>⁡</mo><mo>'</mo></msup></mrow></mfenced><mo>=</mo><mn>5</mn><mtext>.</mtext><mn>6</mn><mo>&nbsp;</mo><mtext>m</mtext></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86331db01034af1e8e3", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "12", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A prism of refractive index <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mn>3</mn><mn>2</mn></mfrac></msqrt></math> and refracting angle is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>45</mn><mo>&#176;</mo></math>&nbsp;is placed in air. One of the two refracting surfaces of the prism is&nbsp;silvered and&nbsp;a&nbsp;ray&nbsp;of monochromatic light enters&nbsp;the prism from the other face at an angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi></math>.&nbsp;If the ray retraces its path, then what is the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi></math>(in degree)?</p>\r", "image": null}, "options": [], "correctValue": "60", "solution": {"text": "<p>The monochromatic ray of light will retrace its path if it strikes the mirror perpendicularly.</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/abs/739986ae-26a0-436b-8b7f-282cfd3e76cb-62.JPG\" style=\"width: 150px; height: 114px;\" /></p><p>Using Snell&#39;s law of refraction,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#215;</mo><mi>sin</mi><mi>&#952;</mi><mo>=</mo><mi>&#956;</mi><mo>&#215;</mo><mi>sin</mi><mn>45</mn><mo>&#176;</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>sin</mi><mi>&#952;</mi><mo>=</mo><msqrt><mfrac><mn>3</mn><mn>2</mn></mfrac></msqrt><mo>&#215;</mo><mi>sin</mi><mn>45</mn><mo>&#176;</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>sin</mi><mi>&#952;</mi><mo>=</mo><msqrt><mfrac><mn>3</mn><mn>2</mn></mfrac></msqrt><mo>&#215;</mo><mfrac><mn>1</mn><msqrt><mn>2</mn></msqrt></mfrac><mo>=</mo><mfrac><msqrt><mn>3</mn></msqrt><mn>2</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#952;</mi><mo>=</mo><mn>60</mn><mo>&#176;</mo></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86314444ca3b7cfa5cc", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "58", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A light ray is incident on the lower medium boundary at an angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>°</mo></math> with the normal. Which of the following statements is true?<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029938_Question.jpg\" style=\"width: 170px; height: 131px;\" />", "image": null}, "options": [{"id": "RpfgU", "text": "If <math> <mrow> <msub> <mi>μ</mi> <mn>2</mn> </msub> <mo>&gt;</mo> <mn>2</mn> </mrow> </math>&nbsp;,then total deviation is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>°</mo></math>", "image": null, "isCorrect": true}, {"id": "Gfqwv", "tex [{"id": "5BuyZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>0.4</mtext></math>", "image": null, "isCorrect": false}, {"id": "pRI0v", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>0.2</mtext></math>", "image": null, "isCorrect": false}, {"id": "M6Bzq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>0.9</mtext></math>", "image": null, "isCorrect": false}, {"id": "K7N6w", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>0.8</mtext></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">&#956;</mi><mn>1</mn></msub><mo>:</mo></math> refractive index of rarer medium<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">&#956;</mi><mn>2</mn></msub><mo>:</mo></math> retractive index of denser medium<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>sin&#952;</mi><mi mathvariant=\"normal\">C</mi></msub><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">&#956;</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">&#956;</mi><mn>2</mn></msub></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>tan&#952;</mi><mi mathvariant=\"normal\">B</mi></msub><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">&#956;</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">&#956;</mi><mn>2</mn></msub></mfrac></math><br /><br /><math> <mrow> <mi>sin</mi><msub> <mi>&#952;</mi> <mi>C</mi> </msub> <mo>=</mo><mi>tan</mi><msub> <mi>&#952;</mi> <mi>B</mi> </msub> </mrow> </math><br /><br /><math> <mrow> <mfrac> <mrow> <mi>sin</mi><msub> <mi>&#952;</mi> <mi>C</mi> </msub> </mrow> <mrow> <mi>sin</mi><msub> <mi>&#952;</mi> <mi>B</mi> </msub> </mrow> </mfrac> <mo>=</mo><mfrac> <mrow> <mi>tan</mi><msub> <mi>&#952;</mi> <mi>B</mi> </msub> </mrow> <mrow> <mi>sin</mi><msub> <mi>&#952;</mi> <mi>B</mi> </msub> </mrow>  [], "correctValue": "1.25", "solution": {"text": "<p><u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/KT0000325_AnsExp1_1.jpg\" style=\"width: 256px; height: 327px;\" /></strong></u><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/KT0000325_AnsExp1_2.jpg\" style=\"width: 250px; height: 324px;\" /><br />Due to the pseudo force, the free surface of the liquid will become inclined. If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi></math>&nbsp;is the angle made by the free surface of the liquid with the horizontal, then</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>tan</mi><mi>&#952;</mi><mo>=</mo><mfrac><mi>a</mi><mi>g</mi></mfrac><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>sin</mi><mi>&#952;</mi><mo>=</mo><mfrac><mn>4</mn><mn>5</mn></mfrac></math></p><p>Using snell&#39;s law we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#956;</mi><mo>&#160;</mo><mi>sin</mi><mi>&#952;</mi><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#956;</mi><mo>=</mo><mfrac><mn>1</mn><mrow><mi>sin</mi><mi>&#952;</mi></mrow></mfrac><mo>=</mo><mfrac><mn>5</mn><mn>4</mn></mfrac><mo>=</mo><mn>1</mn><mo>.</mo><mn>25</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86307d72796a1f4225b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "46", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A ray of light travelling in a denser medium strikes the mo><mfrac><mrow><mn>0.03</mn><mo>×</mo><mn>2</mn></mrow><mrow><mn>1.63</mn><mo>×</mo><mn>15</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mo>.0</mo><mn>6</mn></mrow><mrow><mn>1.63</mn><mo>×</mo><mn>15</mn></mrow></mfrac></math><br /><br /><math><mi>s</mi><mi>o</mi><mo>,</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>f</mi></mrow><mrow><mi>w</mi></mrow></msub><mo>=</mo><mi>&nbsp;</mi><mo>-</mo><mfrac><mrow><mn>815</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><br /><math><mo>=</mo><mo>-</mo><mn>407.5</mn><mi>&nbsp;</mi><mi>cm</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863da7f0a3be4570d3b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "35", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A thin Plano-convex glass lens <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">μ</mi><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>1</mn><mo>.5</mo><mo>)</mo></math> has its plane surface silvered and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> is the radius of curvature of curved part, then which of the following ray diagram is true for an object placed at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">O</mi></math>?<br />\r(<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">O</mi></math> is at a distance of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">R</mi></math> from the lens)", "image": null}, "options": [{"id": "j4cB7", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app : "A plano-convex lens has diameter&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#160;</mo><mi>cm</mi></math>&nbsp;and its thickness at the centre is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>25</mn><mo>&#160;</mo><mi>cm</mi></math>. If the speed of light inside the lens is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mn>8</mn></msup><mo>&#160;</mo><msup><mi>ms</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>, then what is&nbsp;the focal length (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>cm</mi></math>) of the lens?", "image": null}, "options": [], "correctValue": "25.25", "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/abs/f9f52475-fbbc-4784-a749-dc2934bf6889-57.JPG\" style=\"width: 150px; height: 167px;\" /></p><p>R. I. of lens,</p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#956;</mi><mo>=</mo><mfrac><mi>c</mi><mi>v</mi></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn><mo>&#215;</mo><msup><mn>10</mn><mn>8</mn></msup></mrow><mrow><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mn>8</mn></msup></mrow></mfrac><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac></math><p>From <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;ACO</mi><mo>,</mo></math> radius of curvature of lens is,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">R</mi><mn>2</mn></msup><mo>=</mo><msubsup><mi mathvariant=\"normal\">R</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><mo>(</mo><mi mathvariant=\"normal\">R</mi><mo>-</mo><mn>0</mn><mo>.</mo><mn>25</mn><msup><mo>)</mo><mn>2</mn></msup></math></p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><msup><mi mathvariant=\"normal\">R</mi><mn>2</mn></msup><mo>=</mo><mo>(</mo><mn>2</mn><mo>.</mo><mn>5</mn><msup><mo>)</mo><mn>2</mn></msup><mo>+</mo><mo>(</mo><mi mathvariant=\"normal\">R</mi><mo>-</mo><mn>0</mn><mo>.</mo><mn>25</mn><msup><mo>)</mo><mn>2</mn></msup></math><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><msup><mi mathvariant=\"normal\">R</mi><mn>2</mn></msup><mo>=</mo><mn>6</mn><mo>.</mo><mn>25</mn><mo>+</mo><msup><mi mathvariant=\"normal\">R</mi><mn>2</mn></msup><mo>+</mo><mn>0</mn><mo>.</mo><mn>0625</mn><mo>-</mo><mn>0</mn><mo>.</mo><mn>5</mn><mi mathvariant=\"normal\">R</mi></math></p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><mn>0</mn><mo>.</mo><mn>5</mn><mi mathvariant=\"normal\">R</mi><mo>=</mo><mn>6</mn><mo>.</mo><mn>3125</mn></math><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><mi mathvariant=\"normal\">R</mi><mo>=</mo><mn>12</mn><mo>.</mo><mn>625</mn><mi>cm</mi></math></p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">F</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">R</mi><mrow><mi>&#956;</mi><mo>-</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>12</mn><mo>.</mo><mn>625</mn></mrow><mrow><mfrac><mn>3</mn><mn>2</mn></mfrac><mo>-</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mn>25</mn><mo>.</mo><mn>25</mn><mo>&#160;</mo><mi>cm</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d4813b43f9745081", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "101", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A thin plano-convex lens fits exactly into a plano-concave lens with their plane surface parallel to each other as shown&nbsp;in the figure. The radius of curvature of the curved surface <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>30</mn><mo>&nbsp;</mo><mi>cm</mi></math>. The lens&nbsp;is&nbsp;made of a different material having refractive index <math> <mrow> <msub> <mtext>μ</mtext> <mn>1</mn> </msub> <mo>=</mo> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>&nbsp;and&nbsp;</mtext> <msub> <mtext>μ</mtext> <mn>2</mn> </msub> <mo>=</mo> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> </mrow> </math> as shown in the figure.&nbsp;<br />\rIf the plane surface of the plano-convex lens is silvered, then calculate the equivalent focal length of this system in cm.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/KT0000244_Ques1_1.jpg\" style=\"max-width:100%; object-fit:contain\" />\r", "image": null}, "options": [], "correctValue": "60", "solution": {"text": "<u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/KT0000244_AnsExp1_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 199px; height: 278px;\" /></strong></u><br /><br />(i) P<sub>eq</sub>&nbsp;= 2 P<sub>ℓ1</sub><sub>&nbsp;</sub>+ 2 P​<sub>ℓ2</sub> + P<sub>m</sub> &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;...(1)<br /><br />For plano-convex lens :&nbsp;<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <msub> <mtext>f</mtext> <mrow> <mi>&#8467;</mi> <mn>1</mn> </mrow> </msub> </mrow> </mfrac> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mo>&#8734;</mo> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>3</mn> <mn>0</mn> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math><br /><br /><math> <mrow> <msub> <mtext>f</mtext> <mrow> <mi>&#8467;</mi> <mn>1</mn> </mrow> </msub> <mo>=</mo> <mo>-</mo> <mn>6</mn> <mn>0</mn> <mtext>cm</mtext> <mo>&#8658;</mo> <mspace width=\"0.5em\"></mspace> <msub> <mtext>P</mtext> <mrow> <mi>&#8467;</mi> <mn>1</mn> </mrow> </msub> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>0</mn> <mn>0</mn> </mrow> <mrow> <msub> <mtext>f</mtext> <mrow> <mi>&#8467;</mi> <mn>1</mn> </mrow> </msub> </mrow> </mfrac> <mspace width=\"0.5em\"></mspace> <mo>&#8658;</mo> <mspace width=\"0.5em\"></mspace> <msub> <mtext>P</mtext> <mrow> <mi>&#8467;</mi> <mn>1</mn> </mrow> </msub> <mo>=</mo> <mo>-</mo><mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> <mtext>D</mtext> </mrow> </math><br /><br />For plano-convex lens : ​<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <msub> <mtext>f</mtext> <mrow> <mi>&#8467;</mi> <mn>2</mn> </mrow> </msub> </mrow> </mfrac> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mo>30</mo> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>&#8734;</mn> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math><math> <mrow> <mn>&#160;&#160;&#8658;&#160;&#160;</mn></mrow></math>&nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <msub> <mtext>f</mtext> <mrow> <mi>&#8467;</mi> <mn>2</mn> </mrow> </msub> </mrow> </mfrac><mo>=</mo><mfrac> <mrow> <mn>1</mn> </mrow><mrow><mn>120</mn></mrow></mfrac></mrow><mrow></mrow></math><br /><br /><math> <mrow> <msub> <mtext>f</mtext> <mrow> <mi>&#8467;</mi> <mn>2</mn> </mrow> </msub> <mo>=</mo> <mn>1</mn> <mn>2</mn> <mn>0</mn> <mtext>cm</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace><mo>&#8658;</mo><msub> <mtext>P</mtext> <mrow> <mi>&#8467;</mi> <mn>2</mn> </mrow> </msub> <mo>=</mo><mfrac><mrow><mn>100</mn></mrow><mrow><msub> <mtext>f</mtext> <mrow> <mi>&#8467;</mi> <mn>2</mn> </mrow> </msub></mrow></mfrac><mo>&#8658;</mo> <mspace width=\"0.5em\"></mspace> <msub> <mtext>P</mtext> <mrow> <mi>&#8467;</mi> <mn>2</mn> </mrow> </msub> <mo>=</mo> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>6</mn> </mrow> </mfrac> <mtext>D</mtext> </mrow> </math><br /><br />For plane mirror :&nbsp;<math> <mrow> <msub> <mtext>P</mtext> <mtext>m</mtext> </msub> <mo>=</mo> <mn>0</mn> <mspace width=\"0.5em\"></mspace> <mtext>since</mtext> <mspace width=\"0.5em\"></mspace> <msub> <mtext>f</mtext> <mtext>m</mtext> </msub> <mo>=</mo> <mo>&#8734;</mo> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mo>&#8658;</mo> <mspace width=\"0.5em\"></mspace> <msub> <mtext>P</mtext> <mtext>eq</mtext> </msub> <mo>=</mo> <mn>2</mn> <msub> <mtext>P</mtext> <mrow> <mi>&#8467;</mi> <mn>1</mn> </mrow> </msub> <mo>+</mo> <mn>2</mn> <msub> <mtext>P</mtext> <mrow> <mi>&#8467;</mi> <mn>2</mn> </mrow> </msub> <mo>+</mo> <msub> <mtext>P</mtext> <mtext>m</mtext> </msub> </mrow> </math><br /><br /><math> <mrow> <msub> <mtext>P</mtext> <mtext>eq</mtext> </msub> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> <mn>0</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> <mn>0</mn> </mrow> <mrow> <mn>6</mn> </mrow> </mfrac> <mo>+</mo> <mn>0</mn> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> </mrow></math><br /><br /><math><mo>&#8658;</mo> <mspace width=\"0.5em\"></mspace> <msub> <mtext>P</mtext> <mtext>eq</mtext> </msub> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> <mn>0</mn> </mrow> <mrow> <mn>6</mn> </mrow> </mfrac> <mtext>D</mtext> </math> &nbsp; &nbsp; &nbsp; <math><mo>&#8757;</mo><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mi mathvariant=\"normal\">eq</mi></mrow></msub><mo>=</mo><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">F</mi></mrow><mrow><mi mathvariant=\"normal\">eq</mi></mrow></msub></mrow></mfrac></math><br /><br />&rArr; &nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mrow><mi>e</mi><mi>q</mi></mrow></msub><mo>=</mo><mn>60</mn><mo>&#160;</mo><mi>cm</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 30px; top: 780.941px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d3bece78b60841c5", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "66", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "For a certain lens, the magnification of an object when placed at a distance of <math><mi>0.15 m</mi></math> is twice of the magnification produced, when the distance was <math><mi>0.2 m</mi></math>. If in both the situations a real image is formed, then what is the focal length (in <math><mi>cm</mi></math>) of the lens?", "image": null}, "options": [], "correctValue": "10", "solution": {"text": "Let as shown, 1 and 2 are positions of objects and images in two different situations.<br /><br />Object<br /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image8-44a5a68a-b643-402a-8fc5-710502ce0e74.jpg\" style=\"width: 464px; height: 224px;\" /><br /><br />It is given<br /><br /><math><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mfrac><mrow><mi>v</mi><mo>₁</mo></mrow><mrow><mi>u</mi><mo>₁</mo></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>2</mn><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mfrac><mrow><mi>v</mi><mo>₂</mo></mrow><mrow><mi>u</mi><mo>₂</mo></mrow></mfrac></mrow></mfenced></math><br /><br />Here, <math><mi>u</mi><mo>₁</mo><mo>=</mo><mi>&nbsp;</mi><mo>-</mo><mn>15</mn><mi>&nbsp;</mi><mi>cm</mi><mi></mi><mo>,</mo><mi>&nbsp;</mi><mi>u</mi><mo>₂</mo><mo>=</mo><mi>&nbsp;</mi><mo>-</mo><mn>20</mn><mi>&nbsp;</mi><mi>cm</mi><mi></mi></math><br /><br /><math><mo>∴</mo><mi>v</mi><mo>₁</mo><mo>=</mo><mn>2</mn><mi>v</mi><mo>₂</mo><mi>&nbsp;</mi><mo>×</mo><mfrac><mrow><mi>u</mi><mo>₁</mo></mrow><mrow><mi>u</mi><mo>₂</mo></mrow></mfrac><mo>=</mo><mn>2</mn><mi>v</mi><mo>₂</mo><mi>&nbsp;</mi><mo>×</mo><mfrac><mrow><mn>15</mn></mrow><mrow><mn>20</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>v</mi><mo>₂</mo></math><br /><br /><math><mi>n</mi><mi>o</mi><mi>w</mi><mo>,</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><mn>1</mn></mrow><mrow><mi>f</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>v</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>u</mi></mrow></mfrac></math><br /><br /><math><mo>∴</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>f</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>v</mi><mo>₁</mo></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>u</mi><mo>₁</mo></mrow></mfrac><mi>&nbsp;</mi><mi>a</mi><mi>n</mi><mi>d</mi><mfrac><mrow><mn>1</mn></mrow><mrow><mi>f</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>v</mi><mo>₂</mo></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>u</mi><mo>₂</mo></mrow></mfrac></math><br /><br /><math><mi>s</mi><mi>o</mi><mo>,</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>v</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>u</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>u</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math><br /><br /><math><mo>⟹</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>2</mn><mi>v</mi><mo>₂</mo></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>15</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>v</mi><mo>₂</mo></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>20</mn></mrow></mfrac></math><br /><br /><math><mo>⟹</mo><mi>v</mi><mo>=</mo><mn>20</mn><mi>&nbsp;</mi><mi>cm</mi><mi></mi></math><br /><br /><math><mo>∴</mo><mfrac><mrow><mi>v</mi><mo>₁</mo></mrow><mrow><mi>u</mi><mo>₁</mo></mrow></mfrac><mo>=</mo><mn>2</mn><mfrac><mrow><mi>v</mi><mo>₂</mo></mrow><mrow><mi>u</mi><mo>₂</mo></mrow></mfrac><mo>=</mo><mn>2</mn><mi>&nbsp;</mi><mo>×</mo><mfrac><mrow><mn>20</mn></mrow><mrow><mn>20</mn></mrow></mfrac><mo>=</mo><mn>2</mn></math><br /><br /><math><mo>⟹</mo><mi>v</mi><mo>₁</mo><mo>=</mo><mn>2</mn><mi>u</mi><mo>₁</mo><mo>=</mo><mn>2</mn><mo>×</mo><mn>15</mn><mo>=</mo><mn>30</mn><mi>&nbsp;</mi><mi>cm</mi><mi></mi></math><br /><br />Therefore,<math><mfrac><mrow><mn>1</mn></mrow><mrow><mi>f</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>v</mi><mo>₁</mo></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>u</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>15</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>30</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>30</mn></mrow></mfrac></math><br /><br /><math><mo>∴</mo><mi>f</mi><mo>=</mo><mn>10&nbsp;</mn><mi></mi><mi>cm</mi><mi></mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d2dca285d9d746d6", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "09", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An object is placed at a distance of <math> <mrow> <mtext>40&nbsp;cm</mtext></mrow> </math> from a convex lens of focal length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>20&nbsp;cm</mtext></math>.&nbsp;On the far side of the lens, a concave mirror of focal length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>10&nbsp;cm</mtext></math> is placed such that the distance of the object from the concave mirror is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>100&nbsp;cm</mtext></math>. Then the final image which is formed after refraction from the lens, reflection from the mirror and again refraction from the lens, will be", "image": null}, "options": [{"id": "6uqly", "text": "at a distance of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>&#160;</mo><mi>cm</mi></math> from the lens and of the same size of the object", "image": null, "isCorrect": true}, {"id": "7ikcb", "text": "at a distance of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&#160;</mo><mi>cm</mi></math> from the lens and of the same size of the object", "image": null, "isCorrect": false}, {"id": "8Qdvw", "text": "at a distance of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&#160;</mo><mi>cm</mi></math> from the lens and of half the size of the object", "image": null, "isCorrect": false}, {"id": "zIlza", "text": "at a distance of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>&#160;</mo><mi>cm</mi></math> from the lens and of half the size of the object", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Q_13.jpg\" style=\"width: 358px; height: 184px;\" /></p><p>Image is same size, inverted, real and coinciding with object.<br />&nbsp;</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863cff1aa794ee37032", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "17", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A plano-convex lens <math><mfenced separators=\"|\"><mrow><mi>μ</mi><mi>&nbsp;</mi><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></math> has a radius of curvature <math><mi mathvariant=\"normal\">R</mi><mo>=</mo><mn>15</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>&nbsp;and is placed at a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>z</mi></math> from a concave lens of focal length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mi>cm</mi></math> as shown. At what distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>x</mi><mn>0</mn></msub></math>&nbsp;should a point object be placed from the plano-convex lens, so that position of the final image is independent of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>z</mi></math>?<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/D-2_ques.png\" style=\"width: 200px; height: 111px;\" />", "image": null}, "options": [{"id": "48Q5L", "text": "<math><mn>20</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "Nxyvf", "text": "<math><mn>30</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": true}, {"id": "vxJdt", "text": "<math><mn>40</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "IX1eF", "text": "<math><mn>60</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The position of the final image will be independent of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>z</mi></math>,&nbsp;only if the rays of light are incident on the concave lens as a beam parallel to the principal axis. This will be possible only when the object is kept at focus of&nbsp; the plano-convex lens.<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mfrac><mn>1</mn><msub><mi>x</mi><mn>0</mn></msub></mfrac><mo>=</mo><mfrac><mn>1</mn><msub><mi>f</mi><mn>1</mn></msub></mfrac><mo>=</mo><mo>(</mo><mi>μ</mi><mo>-</mo><mn>1</mn><mo>)</mo><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mn>1</mn><msub><mi>R</mi><mn>1</mn></msub></mfrac><mo>-</mo><mfrac><mn>1</mn><msub><mi>R</mi><mn>2</mn></msub></mfrac></mrow></mfenced><mo>=</mo><mfenced separators=\"|\"><mrow><mfrac><mn>3</mn><mn>2</mn></mfrac><mo>-</mo><mn>1</mn></mrow></mfenced><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mn>1</mn><mn>15</mn></mfrac><mo>-</mo><mfrac><mn>1</mn><mi>∞</mi></mfrac></mrow></mfenced></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msub><mi>x</mi><mn>0</mn></msub><mo>=</mo><mn>30</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c25f3a3d8ea2ee2c", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "07", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A lens forms a real image of an object at a distance of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>. It is observed that on placing another identical lens in contact with it, the image gets shifted by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math> towards the combination. The power of the lens is", "image": null}, "options": [{"id": "Lg21C", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mi>&#xA0;</mi><mi mathvariant=\"normal\">D</mi></math>", "image": null, "isCorrect": true}, {"id": "1RgTN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2.5</mn><mi>&#xA0;</mi><mi mathvariant=\"normal\">D</mi></math>", "image": null, "isCorrect": false}, {"id": "xzkzO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mi>&#xA0;</mi><mi mathvariant=\"normal\">D</mi></math>", "image": null, "isCorrect": false}, {"id": "RcuzM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>&#xA0;</mi><mi mathvariant=\"normal\">D</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As image formed is real therefore lens must be convex, <math><mi>v</mi><mo>=</mo><mn>20</mn><mi>&#160;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>.&nbsp;Let <math><msub><mrow><mi>&#160;</mi><mi>f</mi></mrow><mrow><mn>1</mn></mrow></msub></math>, be focal length for this lens.<br /><math><mo>&#8756;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>f</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>v</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>u</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>20</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>u</mi></mrow></mfrac></math><br />After placing it in contact with another lens, the image is shifted&nbsp;<math><mn>10</mn><mi>&#160;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math> towards the combination.<br /><math><mi>i</mi><mo>.</mo><mi>e</mi><mo>,</mo><mo>.</mo><mi>&#160;</mi><mi>v</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>20</mn><mo>-</mo><mn>10</mn></mrow></mfenced><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi><mo>=</mo><mn>10</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math><br /><math><mo>&#8756;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>10</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>u</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>f</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>f</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>20</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>u</mi></mrow></mfrac></mrow></mfenced><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>f</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>&#8658;</mo><msub><mrow><mi>f</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>20</mn><mi>&#160;</mi><mi>c</mi><mi>m</mi></math><br /><math><mo>&#8756;</mo><mi>&#160;</mi><mi>P</mi><mo>=</mo><mfrac><mrow><mn>100</mn></mrow><mrow><mn>20</mn></mrow></mfrac><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo><mn>5</mn><mi mathvariant=\"normal\">D</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c17c1999111103bd", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "47", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A thin convex lens <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">L</mi></math> (refractive index <math><mo>=</mo><mn>1.5</mn></math> ) is placed on a plane mirror <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi></math>. When a pin is placed at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>, such that <math><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">A</mi><mo>=</mo><mn>18</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi><mo>,</mo></math> its real inverted image is formed at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> itself, as shown in figure. When liquid of refractive index <math><msub><mrow><mi>μ</mi></mrow><mrow><mi>l</mi></mrow></msub></math> is put between the lens and the mirror, the pin has to be moved to <math><msup><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mi>'</mi></mrow></msup><mo>,</mo></math> such that <math><mi mathvariant=\"normal\">O</mi><msup><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mi mathvariant=\"normal\">'</mi></mrow></msup><mo>=</mo><mn>27</mn><mtext> </mtext><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi><mo>,</mo></math> to get its inverted real image at <math><mi mathvariant=\"normal\">A</mi><mi>'</mi></math> itself. The value of <math><msub><mrow><mi>μ</mi></mrow><mrow><mi>l</mi></mrow></msub></math> will be<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-07-04_at_1.13.24_PM.jpeg\" style=\"width: 200px; height: 167px;\" />", "image": null}, "options": [{"id": "Trw95", "text": "<math><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "5vCv1", "text": "<math><msqrt><mn>3</mn></msqrt></math>", "image": null, "isCorrect": false}, {"id": "aZjzt", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "oCi0R", "text": "<math><msqrt><mn>2</mn></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>f</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>×</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>18</mn></mrow></mfrac></math>  <br/><math><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>f</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>μ</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><mn>1</mn></mrow></mfenced></mrow><mrow><mo>-</mo><mn>18</mn></mrow></mfrac></math>  <br/>When <math><msub><mrow><mi>μ</mi></mrow><mrow><mn>1</mn></mrow></msub></math> is filled between lens and mirror, <br/><math><mi>P</mi><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>18</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>18</mn></mrow></mfrac><mfenced separators=\"|\"><mrow><msub><mrow><mi>μ</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><mn>1</mn></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>2</mn><mo>-</mo><mn>2</mn><msub><mrow><mi>μ</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><mn>2</mn></mrow><mrow><mn>18</mn></mrow></mfrac></math>  <br/><math><mo>⇒</mo><msub><mrow><mi>F</mi></mrow><mrow><mi>m</mi></mrow></msub><mo>=</mo><mo>-</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>18</mn></mrow><mrow><mn>2</mn><mo>-</mo><msub><mrow><mi>μ</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></mrow></mfenced></math>  <br/><math><mn>2</mn><mo>=</mo><mn>6</mn><mo>-</mo><mn>3</mn><msub><mrow><mi>μ</mi></mrow><mrow><mn>1</mn></mrow></msub></math>  <br/><math><mn>3</mn><msub><mrow><mi>μ</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>4</mn></math>  <br/><math><msub><mrow><mi>μ</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863be7da806fdbcd3e0", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "40", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A point object is placed as shown. The two pieces are of the same lens of focal length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#160;</mo><mi>cm</mi></math>. Find the distance (in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>cm</mi></math>) between the two images formed by two pieces of the lens.<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ydacdjejdufqhethotjofnqfiaptjgvgnpfxozpdfuxwmsyjra.jpeg\" />", "image": null}, "options": [], "correctValue": "6", "solution": {"text": "<p>The distance of image formed by each piece can be calculated by</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>f</mi></mfrac><mo>=</mo><mfrac><mn>1</mn><mi>v</mi></mfrac><mo>-</mo><mfrac><mn>1</mn><mi>u</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>10</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mi>v</mi></mfrac><mo>-</mo><mfrac><mn>1</mn><mrow><mo>-</mo><mn>15</mn></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>v</mi><mo>=</mo><mn>30</mn><mo>&#160;</mo><mi>cm</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"|\" close=\"|\"><mi>m</mi></mfenced><mo>=</mo><mfrac><mn>30</mn><mn>15</mn></mfrac><mo>=</mo><mn>2</mn></math></p><p><br /><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ocforhfoqgdtgweigsinqegmdszseuyiynaotpaettollzmfxb.jpeg\" /></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ba3e90e4b9e1c84b", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "19", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A thin biconvex lens of refractive index <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>2</mn></mfrac></math>&nbsp;is placed on a horizontal plane mirror as shown in the figure. The space between the lens and the mirror is then filled with water of refractive index <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>3</mn></mfrac></math>. It is found that when a point object is placed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>&nbsp;</mo><mi>cm</mi></math>&nbsp;above the lens on its principal&nbsp;axis, the object coincides with its own image. On repeating with another liquid, the object and the image again coincide at a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>25</mn><mo>&nbsp;</mo><mi>cm</mi></math>&nbsp;from the lens. Calculate the refractive index of the liquid.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0006836_Ques1_1.jpg\" style=\"width: 303px; height: 81px;\" /></p>\r", "image": null}, "options": [], "correctValue": "1.6", "solution": {"text": "Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> be the radius of curvature of both the surfaces of the equiconvex lens. In the first case<br /><br />Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">f</mi><mn>1</mn></msub></math>&nbsp;be the focal length of planoconcave lens of index <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">&#956;</mi><mn>1</mn></msub></math>. The focal length of the combined lens system will be given by<br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>F</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <msub> <mtext>f</mtext> <mn>1</mn> </msub> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <msub> <mtext>f</mtext> <mn>2</mn> </msub> </mrow> </mfrac> </mrow> </math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0006836_AnsExp1_1.jpg\" /><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math> <mrow> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mi>&#956;</mi> <mn>1</mn> </msub> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mo>-</mo> <mtext>R</mtext> </mrow> </mfrac> </mrow> </mfenced> <mo>+</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mi>&#956;</mi> <mn>2</mn> </msub> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mo>-</mo> <mtext>R</mtext> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mo>&#8734;</mo> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math><mrow> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>2</mn> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </mfenced> <mo>+</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>4</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mtext>R</mtext></mfrac><mo>-</mo><mfrac><mn>1</mn><mrow><mn>3</mn><mtext>R</mtext></mrow></mfrac><mo>=</mo><mfrac><mn>2</mn><mrow><mn>3</mn><mtext>R</mtext></mrow></mfrac></math>&nbsp;or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mtext>F</mtext><mo>=</mo><mfrac><mrow><mn>3</mn><mtext>R</mtext></mrow><mn>2</mn></mfrac></math><br /><br /><br />Now, image coincides with the object when ray of light retraces its path or it falls normally on the plane mirror. This is possible only when object is at focus of the lens system.<br /><br />Hence,&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">F</mi><mo>=</mo><mn>15</mn><mo>&#160;</mo><mi>cm</mi></math>&nbsp; &nbsp; &nbsp; ( Distance of object = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>&#160;</mo><mi>cm</mi></math>).<br /><br />or &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><mtext>R</mtext></mrow><mn>2</mn></mfrac><mo>=</mo><mn>1</mn><mn>5</mn><mo>&#160;</mo><mtext>cm</mtext><mtext>&#160;or&#160;</mtext><mtext>R</mtext><mo>=</mo><mn>1</mn><mn>0</mn><mo>&#160;</mo><mtext>cm</mtext></math><br /><br />In the second case, let <math> <mrow> <mi>&#956;</mi> </mrow> </math>be the refractive index of the liquid-filled between lens and mirror and let F&#39; be the focal length of new lens system. Then,<br /><br /><u><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0006836_AnsExp1_2.jpg\" style=\"width: 267px; height: 100px;\" /></u><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mtext>F</mtext><mo>'</mo></msup></mfrac><mo>=</mo><mfenced><mrow><msub><mi mathvariant=\"normal\">&#956;</mi><mn>1</mn></msub><mo>-</mo><mn>1</mn></mrow></mfenced><mfenced><mrow><mfrac><mn>1</mn><mtext>R</mtext></mfrac><mo>-</mo><mfrac><mn>1</mn><mtext>-R</mtext></mfrac></mrow></mfenced><mo>+</mo><mfenced><mrow><mi mathvariant=\"normal\">&#956;</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mfenced><mrow><mfrac><mn>1</mn><mrow><mo>-</mo><mo>R</mo></mrow></mfrac><mo>-</mo><mfrac><mn>1</mn><mo>&#8734;</mo></mfrac></mrow></mfenced></math><br /><br />or, &nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mtext>F</mtext><mo>'</mo></msup></mfrac><mo>=</mo><mfenced><mrow><mfrac><mn>3</mn><mn>2</mn></mfrac><mo>-</mo><mn>1</mn></mrow></mfenced><mfenced><mfrac><mn>2</mn><mtext>R</mtext></mfrac></mfenced><mo>-</mo><mfrac><mfenced><mrow><mi mathvariant=\"normal\">&#956;</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mtext>R</mtext></mfrac></math><br /><br />or, &nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mrow><mi mathvariant=\"normal\">F</mi><mo>'</mo></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><mtext>R</mtext></mfrac><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">&#956;</mi><mo>-</mo><mn>1</mn></mrow><mtext>R</mtext></mfrac><mo>=</mo><mfrac><mfenced><mrow><mn>2</mn><mo>-</mo><mi mathvariant=\"normal\">&#956;</mi></mrow></mfenced><mtext>R</mtext></mfrac></math><br /><br />&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mtext>F</mtext><mo>'</mo></msup><mo>=</mo><mfrac><mtext>R</mtext><mrow><mn>2</mn><mo>-</mo><mi mathvariant=\"normal\">&#956;</mi></mrow></mfrac><mo>=</mo><mfrac><mn>10</mn><mrow><mn>2</mn><mo>-</mo><mi mathvariant=\"normal\">&#956;</mi></mrow></mfrac><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mfenced><mrow><mtext>R</mtext><mo>=</mo><mn>10</mn><mo>&#160;</mo><mtext>cm</mtext></mrow></mfenced></math><br /><br /><br />Now, the image coincides with object when it is placed at 25 cm distance.<br /><br />Hence, &nbsp;<math> <mrow> <msup> <mtext>F</mtext> <mo>&#8242;</mo> </msup> <mo>=</mo> <mn>2</mn> <mn>5</mn> </mrow> </math><br /><br />or, &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>10</mn><mrow><mn>2</mn><mo>-</mo><mi mathvariant=\"normal\">&#956;</mi></mrow></mfrac><mo>=</mo><mn>25</mn><mtext>&#160; or &#160;&#160;</mtext><mn>50</mn><mo>-</mo><mn>25</mn><mi mathvariant=\"normal\">&#956;</mi><mo>=</mo><mn>10</mn><mtext>&#160;or&#160;</mtext><mn>25</mn><mi mathvariant=\"normal\">&#956;</mi><mo>=</mo><mn>40</mn></math><br /><br />&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160; &#8756;&#160;</mo><mi mathvariant=\"normal\">&#956;</mi><mo>=</mo><mfrac><mn>40</mn><mn>25</mn></mfrac><mo>=</mo><mn>1</mn><mo>&#183;</mo><mn>6</mn><mtext>&#160;&#160; or &#160; &#160;</mtext><mi mathvariant=\"normal\">&#956;</mi><mo>=</mo><mn>1</mn><mo>&#183;</mo><mn>6</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b7936f286cf0d8ab", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "36", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A cylindrical tube filled with water <math><mfenced separators=\"|\"><mrow><msub><mrow><mi>μ</mi></mrow><mrow><mn>w</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></mfenced></math> is closed at its both ends by two thin, silvered plano-convex lenses, as shown in the figure. Refractive index of lenses <math><msub><mrow><mi>L</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msub></math> are <math><mn>2.0</mn></math> and <math><mn>1.5</mn></math>, while their radii of curvatures are <math><mn>5</mn><mi>&nbsp;cm</mi></math>&nbsp;and <math><mn>9</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>, respectively. A point object is placed somewhere at a point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">O</mi></math> on the axis of the cylindrical tube. If it is found that all the images formed by multiple refractions and reflections coincide with the object, then the distance between both the lenses is</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-06-23_at_2.48.35_PM.jpeg\" style=\"width: 250px; height: 140px;\" /></p>\r", "image": null}, "options": [{"id": "a9FMV", "text": "<math><mn>8</mn><mi> </mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "DB5hf", "text": "<math><mn>18</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": true}, {"id": "2rWdj", "text": "<math><mn>10</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "6yTp3", "text": "<math><mn>14</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>For the lens <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>1</mn></msub></math>,&nbsp;the ray must move parallel to the axis after refraction, for the image to coincide with the object.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>&#956;</mi><mn>1</mn></msub><mi>&#8734;</mi></mfrac><mo>+</mo><mfrac><msub><mi>&#956;</mi><mi>w</mi></msub><mi>x</mi></mfrac><mo>=</mo><mfrac><mrow><msub><mi>&#956;</mi><mrow><mn>1</mn><mi>&#160;</mi></mrow></msub><mo>-</mo><msub><mi>&#956;</mi><mi>w</mi></msub></mrow><msub><mi>R</mi><mn>1</mn></msub></mfrac></math>, where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>&nbsp;is the distance of the object from the lens&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>1</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mstyle displaystyle=\"true\"><mfrac bevelled=\"true\"><mn>4</mn><mn>3</mn></mfrac></mstyle><mi>x</mi></mfrac><mo>=</mo><mfrac><mstyle displaystyle=\"true\"><mn>2</mn><mo>-</mo><mfrac bevelled=\"true\"><mn>4</mn><mn>3</mn></mfrac></mstyle><mn>5</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mn>10</mn><mo>&#160;</mo><mi>cm</mi></math></p><p>For the lens&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>2</mn></msub></math>, the ray must appear to come from the centre of curvature after refraction, for the image to coincide with the object.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>&#956;</mi><mn>2</mn></msub><mrow><mo>-</mo><msub><mi>R</mi><mn>2</mn></msub></mrow></mfrac><mo>+</mo><mfrac><msub><mi>&#956;</mi><mi>w</mi></msub><mi>y</mi></mfrac><mo>=</mo><mfrac><mrow><msub><mi>&#956;</mi><mrow><mn>1</mn><mi>&#160;</mi></mrow></msub><mo>-</mo><msub><mi>&#956;</mi><mi>w</mi></msub></mrow><mo>&#8734;</mo></mfrac></math>, where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math>&nbsp;is the distance of the object from the lens&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>2</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><msub><mi>R</mi><mn>2</mn></msub><mfrac><mstyle displaystyle=\"true\"><mfrac bevelled=\"true\"><mn>4</mn><mn>3</mn></mfrac></mstyle><mstyle displaystyle=\"true\"><mfrac bevelled=\"true\"><mn>3</mn><mn>2</mn></mfrac></mstyle></mfrac><mo>=</mo><mn>8</mn><mo>&#160;</mo><mi>cm</mi></math></p><p>Distance between the two lenses =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#160;</mo><mi>cm</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>8</mn><mo>&#160;</mo><mi>cm</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>18</mn><mo>&#160;</mo><mi>cm</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b0bb5f9d0b5ea081", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "103", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A diminished image of an object is to be obtained on a screen 1.0 m away from it. This can be achieved by approximately placing", "image": null}, "options": [{"id": "zU4bB", "text": "A convex mirror of suitable focal length", "image": null, "isCorrect": false}, {"id": "ZThOh", "text": "A concave mirror of suitable focal length", "image": null, "isCorrect": false}, {"id": "eqKOL", "text": "A convex lens of focal length less than 0.25 m", "image": null, "isCorrect": true}, {"id": "zY5bW", "text": "A concave lens of suitable focal length", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Image can be formed on the screen if it is real. Real image of reduced size can be formed by a concave mirror or a convex lens<br/><br/>Let<math><mi> </mi><mi>u</mi><mo>=</mo><mn>2</mn><mi>f</mi><mo>+</mo><mi>x</mi></math>, then<br/><br/><math><mfrac><mrow><mn>1</mn></mrow><mrow><mi>u</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>v</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>f</mi></mrow></mfrac></math><br/><br/><math><mo>⇒</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><mi>f</mi><mo>+</mo><mi>x</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>v</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>f</mi></mrow></mfrac></math><br/><br/><math><mo>⇒</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>v</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>f</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><mi>f</mi><mo>+</mo><mi>x</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>f</mi><mo>+</mo><mi>x</mi></mrow><mrow><mi>f</mi><mo>(</mo><mn>2</mn><mi>f</mi><mo>+</mo><mi>x</mi><mo>)</mo></mrow></mfrac></math><br/><br/><math><mo>⇒</mo><mi>v</mi><mo>=</mo><mfrac><mrow><mi>f</mi><mo>(</mo><mn>2</mn><mi>f</mi><mo>+</mo><mi>x</mi><mo>)</mo></mrow><mrow><mi>f</mi><mo>+</mo><mi>x</mi></mrow></mfrac></math><br/><br/>It is given that <math><mi>u</mi><mo>+</mo> mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mfenced separators=\"|\"><mrow><mo>&#8757;</mo><msub><mrow><mi>f</mi></mrow><mrow><mi>a</mi></mrow></msub><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>p</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mi>m</mi></mrow></mfenced></math><br /><br /><math><mo>=</mo><mn>1.6</mn><mi>&#160;</mi><mi>m</mi></math><br /><br /><math><mo>&#8756;</mo><msub><mrow><mi>P</mi></mrow><mrow><mi>m</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>&#956;</mi></mrow><mrow><msub><mrow><mi>f</mi></mrow><mrow><mi>m</mi></mrow></msub></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>1</mn><mo>.6</mo></mrow><mrow><mn>1</mn><mo>.6</mo></mrow></mfrac><mo>=</mo><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">D</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863958c0f60c4e1cf63", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "102", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An object is kept at a distance of 16 cm from a thin lens and the image formed is real. If the object is kept at a distance of 6 cm from the same lens, the image formed is virtual. If the sizes of the images formed are equal the focal length of the lens will be", "image": null}, "options": [{"id": "WVkHn", "text": "21 cm", "image": null, "isCorrect": false}, {"id": "0kXcQ", "text": "11 cm", "image": null, "isCorrect": true}, {"id": "x95t9", "text": "15 cm", "image": null, "isCorrect": false}, {"id": "6dK7O", "text": "17 cm", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As a convex lens alone can form a real images as well as a virtual images, therefore, the lens in the present question is a convex lens. Let <math><mi>f</mi></math> be the focal length of the lens and <math><mi>m</mi></math> be the magnification produced<br/><br/>In the first case, when image is real,<br/><br/><math><mi>u</mi><mo>=</mo><mo>-</mo><mn>16</mn><mi> </mi></math>cm,<math><mi> </mi><mi>v</mi><mo>=</mo><mo>(</mo><mi>m</mi><mo>×</mo><mn>16</mn><mo>)</mo></math>cm<br/><br/>As  <math><mfrac><mrow><mn>1</mn></mrow><mrow><mi>v</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>u</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>f</mi></mrow></mfrac></math><br/><br/><math><mo>∴</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>16</mn><mi>m</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>16</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>f</mi></mrow></mfrac><mi> </mi><mi> </mi></math>or<math><mi> </mi><mn>1</mn><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>m</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>16</mn></mrow><mrow><mi>f</mi></mrow></mfrac><mi> </mi><mi> </mi></math>...(i)<br/><br/>In the second case, when image is virtual<br/><br/><math><mi>u</mi><mo>=</mo><mo>-</mo><mn>6</mn><mi> </mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi><mo>,</mo><mi>v</mi><mo>=</mo><mo>(</mo><mo>-</mo><mn>6</mn><mi> </mi></math>m)cm<br/><br/>From  <math><mfrac><mrow><mn>1</mn></mrow><mrow><mi>v</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>u</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>f</mi></mrow></mfrac></math><br/><br/><math><mfrac><mrow><mn>1</mn></mrow><mrow><mo>-</mo><mn>6</mn><mi>m</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>6</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>f</mi></mrow></mfrac><mi> </mi><mi> </mi></math>or<math><mi> </mi><mi> </mi><mn>1</mn><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>m</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>6</mn></mrow><mrow><mi>f</mi></mrow></mfrac></math>,  ...(ii)<br/><br/>Add Eq.(i) and Eq.(ii) we have<br/><br/><math><mn>2</mn><mo>=</mo><mfrac><mrow><mn>22</mn></mrow><mrow><mi>f</mi></mrow></mfrac><mi> </mi><mi> </mi></math>or<math><mi> </mi><mi> </mi><mi>f</mi><mo>=</mo><mfrac><mrow><mn>22</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mn>11</mn><mi> </mi></math>cm", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863877f415a4b905a52", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "61", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "the curvature radii of a concavo-convex glass lens are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mi>cm</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>&nbsp;</mo><mi>cm</mi></math>. The convex surface of the lens is silvered. With the lens horizontal, the concave surface is filled with water. The focal length of the effective mirror is (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>μ</mi></math> of glass = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>5</mn></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>μ</mi></math> of water = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>3</mn></mfrac></math>)", "image": null}, "options": [{"id": "4XHm3", "text": "<math> <mrow> <mfrac> <mrow> <mn>9</mn> <mn>0</mn> </mrow> <mrow> <mn>1</mn> <mn>3</mn> </mrow> </mfrac> <mtext>cm</mtext> </mrow> </math>", "image": null, "isCorrect": true}
