>+</mo><mo>&#160;</mo><msub><mi mathvariant=\"normal\">P</mi><mn>3</mn></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mrow><mo>-</mo><msub><mtext>f</mtext><mtext>eq</mtext></msub></mrow></mfrac><mo>=</mo><mfrac><mn>2</mn><msub><mtext>f</mtext><mn>1</mn></msub></mfrac><mo>+</mo><mfrac><mn>2</mn><msub><mtext>f</mtext><mn>2</mn></msub></mfrac><mo>-</mo><mfrac><mn>1</mn><msub><mtext>f</mtext><mn>3</mn></msub></mfrac><mn>&#160; &#160; &#160; &#160; &#160; &#160; &#160; &#160; &#160; &#160; &#160; &#160;....(1)</mn></math><br /><br />for the lens of water<br /><br /><math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <msub> <mtext>f</mtext> <mn>1</mn> </msub> </mrow> </mfrac> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>4</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mo>&#8734;</mo> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mo>-</mo> <mn>6</mn> <mn>0</mn> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math><br /><br /><math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <msub> <mtext>f</mtext> <mn>1</mn> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>1</mn> <mn>8</mn> <mn>0</mn> </mrow> </mfrac> </mrow> </math><br /><br />for glass lens<br /><br /><math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <msub> <mtext>f</mtext> <mn>2</mn> </msub> </mrow> </mfrac> <mo>=</mo> <mo>(</mo> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>-</mo> <mn>1</mn> <mo>)</mo> <mo>(</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mo>-</mo> <mn>6</mn> <mn>0</mn> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mo>-</mo> <mn>2</mn> <mn>0</mn> </mrow> </mfrac> <mo>)</mo> </mrow> </math><br /><br /><math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <msub> <mtext>f</mtext> <mn>2</mn> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>6</mn> <mn>0</mn> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mtext>For concave mirror</mtext> <mspace width=\"0.5em\"></mspace> <msub> <mtext>f</mtext> <mn>3</mn> </msub> <mo>=</mo> <mfrac> <mrow> <mtext>R</mtext> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">f</mi><mn>3</mn></msub><mo>=</mo><mo>-</mo><mn>10</mn><mo>&#160;</mo><mi>cm</mi></math><br /><br /><math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mo>-</mo> <msub> <mtext>f</mtext> <mtext>eq</mtext> </msub> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> </mrow> <mrow> <mtext>180</mtext> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <mn>2</mn> </mrow> <mrow> <mtext>60</mtext> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mo>-</mo> <mtext>10</mtext> </mrow> </mfrac> </mrow> </math></p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mrow><mo>-</mo><msub><mtext>f</mtext><mtext>eq</mtext></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mtext>6</mtext></mrow><mtext>180</mtext></mfrac><mspace width=\"0.5em\"></mspace><mo>&#8658;</mo><mspace width=\"0.5em\"></mspace><msub><mtext>f</mtext><mtext>eq</mtext></msub><mo>=</mo><mfrac><mrow><mo>-</mo><mtext>90</mtext></mrow><mtext>13</mtext></mfrac><mtext>cm</mtext></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638480edfe4b8864d1", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "30", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Diameter or aperture of a plano-convex lens is <math><mn>6</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math> and its thickness at the centre is <math><mn>3</mn><mi>&nbsp;mm.</mi></math>&nbsp;The image of an object formed is real and twice the size of the object. If the speed of light in the material of the lens is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>×</mo><msup><mn>10</mn><mn>8</mn></msup><mi mathvariant=\"normal\">&nbsp;</mi><msup><mtext>m&nbsp;s</mtext><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>.&nbsp;The distance where the object is placed from the plano-convex lens is <math><mo>…</mo><mo>…</mo><mo>…</mo><mo>×</mo><mn>15</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>.", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/cb3cf33c-42df-4569-accc-15dc9c19c912-image4.png\" /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">R</mi><mo>-</mo><mi mathvariant=\"normal\">y</mi></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mi mathvariant=\"normal\">r</mi><mn>2</mn></msup><mo>=</mo><msup><mi mathvariant=\"normal\">R</mi><mn>2</mn></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi><mo>=</mo><mfrac><msup><mi mathvariant=\"normal\">r</mi><mn>2</mn></msup><mrow><mn>2</mn><mi mathvariant=\"normal\">y</mi></mrow></mfrac><mo>=</mo><mfrac><msup><mfenced separators=\"|\"><mfrac><mn>6</mn><mn>2</mn></mfrac></mfenced><mn>2</mn></msup><mrow><mn>2</mn><mo>&#215;</mo><mn>0</mn><mo>.3</mo></mrow></mfrac><mo>=</mo><mn>15</mn><mi mathvariant=\"normal\">&#160;</mi><mi>cm</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi mathvariant=\"normal\">f</mi></mfrac><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">&#956;</mi><mo>-</mo><mn>1</mn></mrow><mi mathvariant=\"normal\">R</mi></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#956;</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">V</mi></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn><mo>.0</mo><mo>&#215;</mo><msup><mn>10</mn><mn>8</mn></msup></mrow><mrow><mn>2</mn><mo>.0</mo><mo>&#215;</mo><msup><mn>10</mn><mn>8</mn></msup></mrow></mfrac><mo>=</mo><mn>1</mn><mo>.5</mo></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi mathvariant=\"normal\">f</mi><mo>=</mo><mn>30</mn><mi mathvariant=\"normal\">&#160;</mi><mi>cm</mi></math> converging<br /><br />Now&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">f</mi><mo>=</mo><mn>30</mn><mi mathvariant=\"normal\">&#160;</mi><mi>cm</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi mathvariant=\"normal\">f</mi></mfrac><mo>=</mo><mfrac><mn>1</mn><mi mathvariant=\"normal\">v</mi></mfrac><mo>-</mo><mfrac><mn>1</mn><mi mathvariant=\"normal\">u</mi></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>30</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mi mathvariant=\"normal\">v</mi></mfrac><mo>-</mo><mfrac><mn>1</mn><mi mathvariant=\"normal\">u</mi></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">u</mi></mfrac><mo>=</mo><mo>-</mo><mn>2</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">v</mi><mo>=</mo><mo>-</mo><mn>2</mn><mi mathvariant=\"normal\">u</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>30</mn></mfrac><mo>=</mo><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">u</mi></mrow></mfrac><mo>-</mo><mfrac><mn>1</mn><mi mathvariant=\"normal\">u</mi></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>30</mn></mfrac><mo>=</mo><mo>-</mo><mfrac><mn>3</mn><mrow><mn>2</mn><mi mathvariant=\"normal\">u</mi></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">u</mi><mo>=</mo><mo>-</mo><mn>45</mn><mi mathvariant=\"normal\">&#160;</mi><mi>cm</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86380f6df99dec40df9", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "45", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A converging lens of focal length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>&nbsp;</mo><mi>cm</mi></math>&nbsp;and a converging mirror of focal length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mi>cm</mi></math>&nbsp;are placed with their principal axes coinciding. A point source&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi></math> is placed on the principal axis at a distance of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>&nbsp;</mo><mi>cm</mi></math>&nbsp;from the lens, as shown in figure. It is found that the final beam comes out parallel to the principal axis. Let the separation between the mirror and the lens be <math> <mrow> <mn>1</mn> <mn>0</mn> <mo>×</mo> <mi mathvariant=\"normal\">k</mi> </mrow> </math>. Find <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">k</mi></math>.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013261_Ques1_1.jpg\" style=\"height: 102px; width: 230px;\" />", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "Let us first locate the image of S formed by the lens L. Here u = 12 cm and f = 15 cm. We have,<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mi></mi><mi>v</mi><mo>⁡</mo> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mi></mi><mi>u</mi><mo>⁡</mo> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mi>f</mi> </mrow> </mfrac> </mrow> </math><br /><br />or, &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mi></mi><mi>v</mi><mo>⁡</mo> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mi></mi><mi>f</mi><mo>⁡</mo> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mi></mi><mi>u</mi><mo>⁡</mo> </mrow> </mfrac> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>1</mn> <mn>5</mn> <mtext>&nbsp;cm</mtext> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>1</mn> <mn>2</mn> <mtext>&nbsp;cm</mtext> </mrow> </mfrac> </mrow> </math><br /><br />or, &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mi></mi><mi>v</mi><mo>⁡</mo> <mo>=</mo> <mo>-</mo> <mn>6</mn> <mn>0</mn> <mtext>&nbsp;cm.</mtext> </mrow> </math><br /><br />The negative sign shows that the image is formed to the left of the lens as suggested in the figure. The image I<sub>1</sub> acts as the source for the mirror. The mirror forms an image I<sub>2</sub> of the source I<sub>1</sub>. This image I<sub>2</sub> then acts as the source for the lens and the final beam comes out parallel to the principal axis. Clearly I<sub>2</sub> must be at the focus of the lens. We have,<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; I<sub>1</sub> I<sub>2</sub> = I<sub>1</sub>L + LI<sub>2</sub> = 60 cm + 15 cm = 75 cm.<br /><br />Suppose the distance of the mirror from I<sub>2</sub> is x cm. For the reflection from the mirror,<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; u = MI<sub>1</sub> = - (75 + x)cm, v = - x cm and f = - 20 cm.<br /><br />Using &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mi></mi><mi>v</mi><mo>⁡</mo> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mi></mi><mi>u</mi><mo>⁡</mo> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mi>f</mi> </mrow> </mfrac> </mrow> </math>,<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>x</mtext> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>7</mn> <mn>5</mn> <mo>+</mo> <mtext>x</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mn>0</mn> </mrow> </mfrac> </mrow> </math><br /><br />or, &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <mn>7</mn> <mn>5</mn> <mo>+</mo> <mn>2</mn> <mtext>x</mtext> </mrow> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>7</mn> <mn>5</mn> <mo>+</mo> <mtext>x</mtext> </mrow> </mfenced> <mtext>x</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mn>0</mn> </mrow> </mfrac> </mrow> </math><br /><br />or, &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msup> <mtext>x</mtext> <mn>2</mn> </msup> <mo>+</mo> <mn>3</mn> <mn>5</mn> <mtext>x</mtext> <mo>-</mo> <mn>1</mn> <mn>5</mn> <mn>0</mn> <mn>0</mn> <mo>=</mo> <mn>0</mn> </mrow> </math><br /><br />or, &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext>x</mtext> <mo>=</mo> <mfrac> <mrow> <mo>-</mo> <mn>3</mn> <mn>5</mn> <mo>±</mo> <msqrt> <mn>3</mn> <mn>5</mn> <mo>×</mo> <mn>3</mn> <mn>5</mn> <mo>+</mo> <mn>4</mn> <mo>×</mo> <mn>1</mn> <mn>5</mn> <mn>0</mn> <mn>0</mn> </msqrt> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math>.<br /><br />This gives x = 25 or - 60.<br /><br />As the negative sign has no physical meaning, only positive sign should be taken. Taking x = 25, the separation between the lens and the mirror is (15 + 25) cm = 40 cm.<br /><br />Hence k = 4", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637fa3765032e963f9", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "10", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A plano-convex lens has a radius of curvature of the curved surface equal to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&#160;</mo><mi>cm</mi></math> and a refractive index equal to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>5</mn></math>,&nbsp; then what is the focal length (in <math> <mrow> <mtext>cm</mtext></mrow> </math>) of the lens?", "image": null}, "options": [], "correctValue": "60.00", "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi mathvariant=\"normal\">f</mi></mfrac><mo>=</mo><mo>(</mo><mi mathvariant=\"normal\">μ</mi><mo>-</mo><mn>1</mn><mo>)</mo><mfenced><mrow><mfrac><mn>1</mn><msub><mi mathvariant=\"normal\">R</mi><mn>1</mn></msub></mfrac><mo>-</mo><mfrac><mn>1</mn><msub><mi mathvariant=\"normal\">R</mi><mn>2</mn></msub></mfrac></mrow></mfenced><mspace linebreak=\"newline\"></mspace><msub><mi mathvariant=\"normal\">R</mi><mn>1</mn></msub><mo>=</mo><mo>∝</mo><mspace linebreak=\"newline\"></mspace><msub><mi mathvariant=\"normal\">R</mi><mn>2</mn></msub><mo>=</mo><mo>-</mo><mn>30</mn><mi>cm</mi><mspace linebreak=\"newline\"></mspace><mfrac><mn>1</mn><mi mathvariant=\"normal\">f</mi></mfrac><mo>=</mo><mo>(</mo><mn>1</mn><mo>.</mo><mn>5</mn><mo>-</mo><mn>1</mn><mo>)</mo><mfenced><mrow><mfrac><mn>1</mn><mo>∞</mo></mfrac><mo>-</mo><mfrac><mn>1</mn><mrow><mo>-</mo><mn>30</mn></mrow></mfrac></mrow></mfenced><mspace linebreak=\"newline\"></mspace><mfrac><mn>1</mn><mi mathvariant=\"normal\">f</mi></mfrac><mo>=</mo><mfrac><mrow><mn>0</mn><mo>.</mo><mn>5</mn></mrow><mn>30</mn></mfrac><mspace linebreak=\"newline\"></mspace><mi mathvariant=\"normal\">f</mi><mo>=</mo><mn>60</mn><mi>cm</mi><mspace linebreak=\"newline\"></mspace><mspace linebreak=\"newline\"></mspace><mspace linebreak=\"newline\"></mspace></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637f241e5ce544b71b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "37", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>The graph shows how the magnification <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> produced by a thin lens varies with image distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math>. The focal length of the lens used is</p>\r\r<p><br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/0458714_que.JPG\" style=\"width: 180px; height: 166px;\" /></p>\r", "image": null}, "options": [{"id": "UTbIK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>b</mi><mi>c</mi></mfrac></math>", "image": null, "isCorrect": true}, {"id": "4rtkW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>a</mi><mi>c</mi></mfrac></math>", "image": null, "isCorrect": false}, {"id": "8xz65", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msup><mi>b</mi><mn>2</mn></msup><mi>c</mi></mrow><mi>a</mi></mfrac></math>", "image": null, "isCorrect": false}, {"id": "rFwX5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>b</mi><mn>2</mn></msup><mrow><mi>a</mi><mi>c</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a thin lens,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"|\" open=\"|\" separators=\"|\"><mi>m</mi></mfenced><mo>=</mo><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mfrac><mi>v</mi><mi>f</mi></mfrac></mrow></mfenced></math><br />From the graph, slope of the line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>=</mo><mfrac><mn>1</mn><mi>f</mi></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>c</mi><mi>b</mi></mfrac><mo>=</mo><mfrac><mn>1</mn><mi>f</mi></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mo>=</mo><mfrac><mi>b</mi><mi>c</mi></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637dcf08a57c4b59bc", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "71", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A real image is formed by a convex lens. If we put a concave lens in contact with it, the combination again forms a real image. The new image", "image": null}, "options": [{"id": "IxzWk", "text": "is closer to the lens system", "image": null, "isCorrect": false}, {"id": "iZ0mz", "text": "is farther from the lens system", "image": null, "isCorrect": true}, {"id": "b3Daq", "text": "is at the original position", "image": null, "isCorrect": false}, {"id": "llyVx", "text": "may be anywhere depending on the focal length of the concave lens.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When concave lens is put in contact with convex lens, real/image is formed i.e., equivalent lens is convex. The focal length of equivalent lens F is greater than focal length of convex lens.<br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mi>v</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mo>-</mo><mi>u</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>f</mi></mrow></mfrac></math><br /><br /><math><mo>⇒</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>v</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>f</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>u</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>u</mi><mo>-</mo><mi>f</mi></mrow><mrow><mi>f</mi><mi>u</mi></mrow></mfrac></math><br /><br /><math><mi>v</mi><mo>=</mo><mfrac><mrow><mi>u</mi><mi>f</mi></mrow><mrow><mi>u</mi><mo>-</mo><mi>f</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>u</mi></mrow><mrow><mfrac><mrow><mi>u</mi></mrow><mrow><mi>f</mi></mrow></mfrac><mo>-</mo><mn>1</mn></mrow></mfrac></math><br /><br />As f increases, <math><mfrac><mrow><mi>u</mi></mrow><mrow><mi>f</mi></mrow></mfrac></math> decreases<br /><br /><math><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>u</mi></mrow><mrow><mi>f</mi></mrow></mfrac><mo>-</mo><mn>1</mn></mrow></mfenced></math> also decreases<br /><br />Thus, v increases.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863781c1b14400b033f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "105", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The image of a small electric bulb fixed on the wall of a room is to be obtained on the opposite wall 4 m away by means of a large convex lens. The maximum possible focal length of the lens required for this purpose will be", "image": null}, "options": [{"id": "zVAUq", "text": "0.5 m", "image": null, "isCorrect": false}, {"id": "7w28y", "text": "1.0 m", "image": null, "isCorrect": true}, {"id": "QocyX", "text": "1.5 m", "image": null, "isCorrect": false}, {"id": "46V2U", "text": "2.0 m", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let a large convex lens is placed between two walls at a distance <math><mi>x</mi></math> from the wall on which an electric bulb is fixed.<br /><br />Using<br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mi>f</mi></mrow></mfrac><mo>=</mo><m "isCorrect": false}, {"id": "T1h02", "text": "Real and inverted", "image": null, "isCorrect": true}, {"id": "6PBEc", "text": "Virtual and inverted", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From lens equation,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>v</mi></mfrac><mo>-</mo><mfrac><mn>1</mn><mfenced separators=\"|\"><mrow><mo>-</mo><mn>20</mn></mrow></mfenced></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>10</mn></mfrac><mi>&nbsp;</mi><mi>&nbsp;</mi><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>v</mi><mo>=</mo><mo>+</mo><mn>20</mn><mo>&nbsp;</mo><mi>cm</mi></math><br /><br />Magnification, <math><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfrac><mrow><mi>v</mi></mrow><mrow><mi>u</mi></mrow></mfrac><mo>=</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mo>+</mo><mn>20</mn></mrow><mrow><mo>-</mo><mn>20</mn></mrow></mfrac><mi>&nbsp;</mi></mrow></mfenced><mo>=</mo><mo>-</mo><mn>1</mn></math><br /><br />Image is real, inverted, and same size as object.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863397c366241003695", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "16", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>Figure shows two spherical surface of radii <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>R</mi></math> separating three transparent media of refractive index <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>μ</mi><mo>=</mo><mn>4</mn></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>μ</mi><mo>=</mo><mn>2</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>μ</mi><mo>=</mo><mn>1</mn></math>. A ray of light travelling in a medium <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>μ</mi><mo>=</mo><mn>1</mn></math> is incident on outer sphere tangentially. The net deviation suffered by light ray will be<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ane.JPG\" style=\"width: 230px; height: 177px;\" /></p>\r", "image": null}, "options": [{"id": "XhAqu", "text": "<math><mn>0</mn><mo>°</mo></math>", "image": null, "isCorrect": false}, {"id": "N04jp", "text": "<math><mn>90</mn><mo>°</mo></math>", "image": null, "isCorrect": false}, {"id": "RJGtj", "text": "<math><mn>240</mn><mo>°</mo></math>", "image": null, "isCorrect": true}, {"id": "db6sw", "text": "<math><mn>280</mn><mo>°</mo></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Path of light ray for minimum deviation will be<br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/vvvvvvvv.JPG\" style=\"width: 280px; height: 323px;\" /><br /><math><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mn>90</mn><mo>°</mo></mrow></mrow><mo>=</mo><mn>2</mn><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>θ</mi><mo>=</mo><mn>30</mn><mo>°</mo></math><br />Deviation<math><mo>=</mo><mn>60</mn><mo>°</mo></math><br />There are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math> such deviations therefore total deviation<math><mo>=</mo><mn>240</mn><mo>°</mo></math>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86331d07ecb1dc73e51", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "22", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A thin converging lens of focal length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">f</mi><mo>=</mo><mn>25</mn><mo>&nbsp;</mo><mi>cm</mi></math> forms the image of an object on a screen placed at a distance of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>75</mn><mo>&nbsp;</mo><mi>cm</mi></math> from the lens. Now the screen is moved closer to the lens by a distance of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>25</mn><mo>&nbsp;</mo><mi>cm</mi></math>. The distance through which the object has to be shifted so that its image on the screen is sharp again is", "image": null}, "options": [{"id": "DGGvb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>37</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi>cm</mi></math>", "image": null, "isCorrect": false}, {"id": "h0xy2", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>16</mn><mo>.</mo><mn>25</mn><mo>&nbsp;</mo><mi>cm</mi></math>", "image": null, "isCorrect": false}, {"id": "9xt84", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi>cm</mi></math>", "image": null, "isCorrect": true}, {"id": "dLzfw", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>13</mn><mo>.</mo><mn>5</mn><mo>&nbsp;</mo><mi>cm</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the first condition<br /><br /><img alt=\"\" height=\"142\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/3_solu_cet.jpg\" width=\"272\" /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">f</mi><mo>=</mo><mn>25</mn><mo>&nbsp;</mo><mi>cm</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">V</mi><mo>=</mo><mn>75</mn><mo>&nbsp;</mo><mi>cm</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi mathvariant=\"normal\">f</mi></mfrac><mo>=</mo><mfrac><mn>1</mn><mi mathvariant=\"normal\">v</mi></mfrac><mo>-</mo><mfrac><mn>1</mn><mi mathvariant=\"normal\">u</mi></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>25</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>75</mn></mfrac><mo>-</mo><mfrac><mn>1</mn><mi mathvariant=\"normal\">u</mi></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi mathvariant=\"normal\">u</mi></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>75</mn></mfrac><mo>-</mo><mfrac><mn>1</mn><mn>25</mn></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi mathvariant=\"normal\">u</mi></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn><mo>-</mo><mn>3</mn></mrow><mn>75</mn></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">u</mi><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><mo>-</mo><mfrac><mn>75</mn><mn>2</mn></mfrac><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><mo>-</mo><mn>37</mn><mo>.5</mo><mo>&nbsp;</mo><mi>cm</mi></math><br /><br />According to the second condition<br /><br /><img alt=\"\" height=\"141\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/3_solu_cet_1.jpg\" width=\"304\" /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">v</mi><mn>1</mn></msub><mo>=</mo><mn>50</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi>cm</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">f</mi><mo>=</mo><mn>25</mn><mo>&nbsp;</mo><mi>cm</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi mathvariant=\"normal\">f</mi></mfrac><mo>=</mo><mfrac><mn>1</mn><msub><mi mathvariant=\"normal\">v</mi><mn>1</mn></msub></mfrac><mo>-</mo><mfrac><mn>1</mn><msub><mi mathvariant=\"normal\">u</mi><mn>1</mn></msub></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>25</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>50</mn></mfrac><mo>-</mo><mfrac><mn>1</mn><msub><mi mathvariant=\"normal\">u</mi><mn>1</mn></msub></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msub><mi mathvariant=\"normal\">u</mi><mn>1</mn></msub></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>50</mn></mfrac><mo>-</mo><mfrac><mn>1</mn><mn>25</mn></mfrac></math><br /><br /><math><mo>⇒</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msub><mi mathvariant=\"normal\">u</mi><mn>1</mn></msub></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn><mo>-</mo><mn>2</mn></mrow><mn>50</mn></mfrac></math><br /><br /><math><mo>⇒</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">u</mi><mn>1</mn></msub><mo>=</mo><mi mathvariant=\"normal\">&nbsp;</mi><mo>-</mo><mn>50</mn><mo>&nbsp;</mo><mi>cm</mi></math><br /><br />So, the image is sharp again for,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Δu</mi><mo>=</mo><msub><mi mathvariant=\"normal\">u</mi><mn>1</mn></msub><mo>-</mo><mi mathvariant=\"normal\">u</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>50</mn><mo>-</mo><mn>37</mn><mo>.5</mo></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>12</mn><mo>.5</mo><mo>&nbsp;</mo><mi>cm</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632fc40c206195be10", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "108", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A thin biconvex lens of refractive index 3/2 is placed on a horizontal plane mirror as shown in the figure. The space between the lens and the mirror is then filled with water of refractive index 4/3. It is found that when a point object is placed 15 cm above the lens on its principle axis, the object coincides with its own image. On repeating with another liquid, the object and the image again coincide at a distance 25 cm from the lens. Calculate the refractive index of the liquid.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0006836_Ques1_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 303px; height: 81px;\" /></p>\r", "image": null}, "options": [{"id": "0FhZ3", "text": "<math> <mrow> <mn>1</mn> <mo>&middot;</mo> <mn>6</mn> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "0A82T", "text": "3.2", "image": null, "isCorrect": false}, {"id": "TrpBy", "text": "0.8", "image": null, "isCorrect": false}, {"id": "WYiSR", "text": "2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let R be the radius of curvature of both the surfaces of the equi-convex lens. In the first case:<br />Let f<sub>1</sub> be the focal length of planoconcave lens of index <math> <mrow> <msub> <mi>&mu;</mi> <mn>1</mn> </msub> </mrow> </math>. The focal length of the combined lens system will be given by:<br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>F</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <msub> <mtext>f</mtext> <mn>1</mn> </msub> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <msub> <mtext>f</mtext> <mn>2</mn> </msub> </mrow> </mfrac> </mrow> </math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0006836_AnsExp1_1.jpg\" style=\"max-width:100%; object-fit:contain\" /><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math> <mrow> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mi>&mu;</mi> <mn>1</mn> </msub> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mo>-</mo> <mtext>R</mtext> </mrow> </mfrac> </mrow> </mfenced> <mo>+</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mi>&mu;</mi> <mn>2</mn> </msub> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mo>-</mo> <mtext>R</mtext> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mo>&infin;</mo> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math><mrow> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>2</mn> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </mfenced> <mo>+</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>4</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math> <mrow> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>3</mn> <mtext>R</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> </mrow> <mrow> <mn>3</mn> <mtext>R</mtext> </mrow> </mfrac>&nbsp; <mtext>&nbsp;of&nbsp;</mtext> <mtext>F</mtext> <mo>=</mo> <mfrac> <mrow> <mn>3</mn> <mtext>R</mtext> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math><br /><br /><br />Now, image coincides with the object when ray of light retraces its path or it falls normally on the plane mirror. This is possible only when object is at focus of the lens system.<br /><br />Hence,&nbsp; F 15 cm &nbsp; &nbsp;&nbsp; ( Distance of object = 15 cm).<br /><br />or &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <mn>3</mn> <mtext>R</mtext> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>=</mo> <mn>1</mn> <mn>5</mn>&nbsp; <mtext>cm</mtext> <mtext>&nbsp;or&nbsp;</mtext> <mtext>R</mtext> <mo>=</mo> <mn>1</mn> <mn>0</mn> <mtext>cm</mtext> </mrow> </math><br /><br />In the second case, let <math> <mrow> <mi>&mu;</mi> </mrow> </math>be the refractive index of the liquid filled between lens and mirror and let F&#39; be the focal length of new lens system. Then,<br /><br /><u><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0006836_AnsExp1_2.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 267px; height: 100px;\" /></u><br /><br /><math> <mrow> <mfrac> <mrow> <mn>1</mn>&nbsp;&nbsp; </mrow> <mrow> <msup> <mtext>F</mtext> <mo>&prime;</mo> </msup> </mrow> </mfrac> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mi>&mu;</mi> <mn>1</mn> </msub> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>R</mtext> <mo>-</mo> </mrow> </mfrac> </mrow> </mfenced> <mo>+</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi>&mu;</mi> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mo>-</mo> <mo>R</mo> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mo>&infin;</mo> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math><br /><br />or, &nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <msup> <mtext>F</mtext> <mo>&prime;</mo> </msup> </mrow> </mfrac> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>2</mn> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </mfenced> <mo>-</mo> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi>&mu;</mi> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </math><br /><br />or, &nbsp;&nbsp;<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> <mo>-</mo> <mfrac> <mrow> <mi>&mu;</mi> <mo>-</mo> <mn>1</mn> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>2</mn> <mo>-</mo> <mi>&mu;</mi> </mrow> </mfenced> </mrow> <mrow> <mtext>R</mtext> </mrow> </mfrac> </mrow> </math><br /><br />&nbsp;<math> <mrow> <msup> <mtext>F</mtext> <mo>&prime;</mo> </msup> <mo>=</mo> <mfrac> <mrow> <mtext>R</mtext> </mrow> <mrow> <mn>2</mn> <mo>-</mo> <mi>&mu;</mi> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>0</mn> </mrow> <mrow> <mn>2</mn> <mo>-</mo> <mi>&mu;</mi> </mrow> </mfrac> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>R</mtext> <mo>=</mo> <mn>1</mn> <mn>0</mn>&nbsp; <mtext>cm</mtext> </mrow> </mfenced> </mrow> </math><br /><br /> hyas/jee_main/images/nbvrpvpswhzcgrzvmexudqcshgluooiujnkoyzkfjvxovhxxkb.jpeg\" width=\"205\" />", "image": null}, "options": [{"id": "ZluJp", "text": "Real image will form if  <math><msub><mrow><mi>μ</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>&gt;</mo><msub><mrow><mi>μ</mi></mrow><mrow><mn>2</mn></mrow></msub></math>  and for all values of  <math><mi>u</mi></math>", "image": null, "isCorrect": false}, {"id": "KMcBw", "text": "Real image for some values of  <math><mi>u</mi></math>  if  <math><msub><mrow><mi>μ</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>&gt;</mo><msub><mrow><mi>μ</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "1GBvi", "text": "Virtual image will form if <math><msub><mrow><mi>μ</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>&gt;</mo><msub><mrow><mi>μ</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": true}, {"id": "ctEh4", "text": "Virtual image will form if <math><msub><mrow><mi>μ</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>&lt;</mo><msub><mrow><mi>μ</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>&#956;</mi><mn>2</mn></msub><mi>v</mi></mfrac><mo>-</mo><mfrac><msub><mi>&#956;</mi><mn>1</mn></msub><mrow><mo>-</mo><mi>u</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mi>&#956;</mi><mn>2</mn></msub><mo>-</mo><msub><mi>&#956;</mi><mn>1</mn></msub></mrow><mi>R</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>v</mi><mo>=</mo><mfrac><mrow><mi>u</mi><mi>R</mi><msub><mi>&#956;</mi><mn>2</mn></msub></mrow><mrow><mi>u</mi><mfenced><mrow><msub><mi>&#956;</mi><mn>2</mn></msub><mo>-</mo><msub><mi>&#956;</mi><mn>1</mn></msub></mrow></mfenced><mo>-</mo><mi>R</mi><msub><mi>&#956;</mi><mn>1</mn></msub></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>v</mi><mo>=</mo><mfrac><mrow><mi>u</mi><mi>R</mi><msub><mi>&#956;</mi><mn>2</mn></msub></mrow><mrow><mi>u</mi><msub><mi>&#956;</mi><mn>2</mn></msub><mo>-</mo><msub><mi>&#956;</mi><mn>1</mn></msub><mfenced><mrow><mi>u</mi><mo>+</mo><mi>R</mi></mrow></mfenced></mrow></mfrac></math></p><p>We can see that&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#956;</mi><mn>1</mn></msub><mo>&#62;</mo><msub><mi>&#956;</mi><mn>2</mn></msub></math>&nbsp;then image distance is negative which means virtual image</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86316428c9257136ee7", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "62", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A point object is kept just beyond the first focus of a convex lens. If the lens starts moving towards the right with a constant velocity, the image will<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/KT0000351_Question_1_.jpg\" style=\"width: 200px; height: 145px;\" />", "image": null}, "options": [{"id": "eOxgv", "text": "always move towards right", "image": null, "isCorrect": false}, {"id": "C5QEy", "text": "always move towards left", "image": null, "isCorrect": false}, {"id": "Hys9z", "text": "first move towards right and then towards left", "image": null, "isCorrect": false}, {"id": "qyU7w", "text": "first move towards left and then towards right", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math> <mrow> <mfrac> <mrow> <mtext>dv</mtext> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> <mo>=</mo> <msup> <mrow> <mfenced c 00f393a", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "98", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An astronomical telescope has objective and eyepiece of focal lengths <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>&nbsp;</mo><mi>cm</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&nbsp;</mo><mi>cm</mi></math> respectively. To view an object <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>&nbsp;</mo><mi>cm</mi></math> away from the objective, at what distance the lenses must be separated (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>cm</mi></math>)?", "image": null}, "options": [], "correctValue": "54", "solution": {"text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">V</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mo>-</mo><mn>200</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>40</mn></mrow></mfrac></math><br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">V</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mfrac><mrow><mn>1</mn></mrow><mrow><mn>40</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>200</mn></mrow></mfrac></math><br /><br /><math><mo>=</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>200</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>200</mn></mrow></mfrac></math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/AIPMT_paper_A_Physics_Q_32_sol.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 460px; height: 175px;\" /><br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">V</mi></mrow><
