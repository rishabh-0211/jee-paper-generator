rue, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A beam of light consisting of red, green and blue colours is incident on a right-angled prism. The refractive index of the material of the prism for the above red, green and blue wavelengths are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>39</mn></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>44</mn><mo>&nbsp;</mo></math>and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>47</mn></math> respectively.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image1-3e023ecd-c17a-4715-9ad7-0fe81c2d6542.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"height: 94px; width: 150px;\" /><br />\r<br />\rThe prism will:", "image": null}, "options": [{"id": "ysMqr", "text": "Separate all the three colours from one another", "image": null, "isCorrect": false}, {"id": "OphQY", "text": "Not separate the three colours at all", "image": null, "isCorrect": false}, {"id": "E0btz", "text": "Separate the red colour part from the green and blue colours", "image": null, "isCorrect": true}, {"id": "ZVPJs", "text": "Separate the blue colour part from the red and green colours", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/111598.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 211px; height: 162px;\" />​<br /><br />For TIR <math><mi mathvariant=\"normal\">I</mi><mo>&gt;</mo><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mi mathvariant=\"normal\">c</mi></mrow></msub></math><br />so,&nbsp;<math><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">i</mi><mo>&gt;</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mi mathvariant=\"normal\">c</mi></mrow></msub></mrow></mrow></math><br /><br /><math><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">&nbsp;</mi><msup><mrow><mn>45</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mo>&gt;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">μ</mi></mrow></mfrac><mo>⇒</mo><mi mathvariant=\"normal\">μ</mi><msqrt><mn>2</mn></msqrt><mo>⇒</mo><mi mathvariant=\"normal\">μ</mi><mo>=</mo><mn>1.414</mn></math><br /><br />Since <math><mi mathvariant=\"normal\">μ</mi></math> of green and violet are greater than 1.414 so they will total internal refrected. But red colour will be vetracted.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c6b9ebebf40ee70c", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "20", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<div>\r<p align=\"left\" style=\"text-align:left;\"><span style=\"color:black\">A ray of light is incident normally on one of the faces of a prism of apex angle&nbsp;<math> <mrow> <mn>30</mn><mo>°</mo> </mrow> </math>&nbsp;and refractive index&nbsp;<math> <mrow> <msqrt> <mn>2</mn> </msqrt> <mo>.</mo> </mrow> </math> </span><span>&nbsp;The angle of deviation of the ray is</span></p>\r</div>\r", "image": null}, "options": [{"id": "KfPmG", "text": "<div><p align=\"left\" style=\"text-align:left;\"><span style=\"position:relative;top:0.0pt\">&nbsp;<math>  <mrow>   <mn>30</mn><mo>&deg;</mo>  </mrow> </math>  </span></p></div>", "image": null, "isCorrect": false}, {"id": "Bxiso", "text": "<div><p align=\"left\" style=\"text-align:left;\"><span style=\"position:relative;top:0.0pt\">&nbsp;<math>  <mrow>   <mn>45</mn><mo>&deg;</mo>  </mrow> </math>  </span></p></div>", "image": null, "isCorrect": false}, {"id": "NC3Rv", "text": "<div><p align=\"left\" style=\"text-align:left;\"><span style=\"position:relative;top:0.0pt\">&nbsp;<math> <mrow> <mn>15</mn><mo>°</mo> </mrow> </math> </span></p></div>", "image": null, "isCorrect": true}, {"id": "D0OKj", "text": "none of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><span>Using Snell’s law for the refraction at AC, we get</span></p><p><span style=\"position:relative;top:0.0pt\">&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">μ</mi><mtext>  </mtext><mi>sini</mi><mo>=</mo><mo>(</mo><mn>1</mn><mo>)</mo><mtext>  </mtext><mi>sinr</mi></math> </span></p><p><span style=\"position:relative;top:0.0pt\">&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>2</mn></msqrt><mi>sin</mi><mn>30</mn><mo>°</mo><mo>=</mo><mi>sinr</mi></math> </span></p><p><span style=\"position:relative;top:0.0pt\">&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>sinr</mi><mo>=</mo><mfrac><mn>1</mn><msqrt><mn>2</mn></msqrt></mfrac></math> </span></p><p><span style=\"position:relative;top:0.0pt\">&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mtext>     </mtext><mi mathvariant=\"normal\">r</mi><mo>=</mo><mn>45</mn><mo>°</mo></math> </span></p><p><span style=\"position:relative;top:0.0pt\">&nbsp;<math> <mo>∴</mo> </math> </span><span>&nbsp;&nbsp;&nbsp;Angle of deviation &nbsp;<math> <mrow> <mo>=</mo><mn>45</mn><mo>°</mo><mo>−</mo><mn>30</mn><mo>°</mo><mo>=</mo><mn>15</mn><mo>°</mo><mo>.</mo> </mrow> </math> </span></p><p align=\"left\" style=\"text-align:left;\"><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-05-28_at_6.59.09_PM.jpeg\" style=\"width: 200px; height: 177px;\" /></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639780551b8efd21bd", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "68", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A prism is made up of material of refractive index <math><msqrt><mn>2</mn></msqrt><mo>.</mo></math> The angle of the prism is <math><mi>A</mi></math> . If the angle of minimum deviation is equal to the angle of the prism, the value of <math><mi>A</mi></math> is", "image": null}, "options": [{"id": "HV2rj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&#xB0;</mo></math>", "image": null, "isCorrect": false}, {"id": "AwxRP", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>45</mn><mo>&#xB0;</mo></math>", "image": null, "isCorrect": false}, {"id": "GuOAD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>&#xB0;</mo></math>", "image": null, "isCorrect": false}, {"id": "xyuuN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>90</mn><mo>&#xB0;</mo></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math><mo>&#8757;</mo><mi>&#160;</mi><mi>&#956;</mi><mo>=</mo><mfrac><mrow><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mfenced separators=\"|\"><mrow><mi>A</mi><mo>+</mo><msub><mrow><mi>&#948;</mi></mrow><mrow><mi>m</mi></mrow></msub></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></mrow></mrow></mrow><mrow><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></mrow></mrow></mrow></mfrac></math><br /><br />Here, <math><mi>&#956;</mi></math> is refractive index <math><msub><mrow><mi>&#948;</mi></mrow><mrow><mi>m</mi></mrow></msub></math> is minimum deviation angle, <math><mi>A</mi></math> is angle of prism.<br /><br /><math><mo>&#8756;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><msqrt><mn>2</mn></msqrt><mo>=</mo><mfrac><mrow><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mi>A</mi><mo>+</mo><mi>A</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></mrow></mrow></mrow><mrow><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mfrac><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mrow></mrow></mfrac></math><br /><br /><math><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><msqrt><mn>2</mn></msqrt><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mfrac><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mi>A</mi></mrow></mrow></mrow></mrow></math><br /><br />Hence, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mn>90</mn><mo>&#176;</mo></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86360ac2eb54d30000e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "41", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>Light is incident normally on the face&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math> of a prism as shown in the figure. A layer of liquid of refractive index <math><mi>μ</mi></math> is applied on the face&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AC</mi></math> of the prism. If the prism is made of glass of refractive index <math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>, then&nbsp;the limit of <math><mi>μ</mi></math> for which total internal reflection takes place on face&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AC</mi></math> is</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/321225_que.JPG\" style=\"width: 180px; height: 157px;\" /></p>\r", "image": null}, "options": [{"id": "eBmPT", "text": "<math><mi>μ</mi><mo>&lt;</mo><mfrac><mrow><mn>3</mn><msqrt><mn>3</mn></msqrt></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "w9oMF", "text": "<math><mi>μ</mi><mo>&gt;</mo><msqrt><mfrac><mrow><mn>5</mn></mrow><mrow><mn>2</mn></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "hVvdm", "text": "<math><mi>μ</mi><mo>&gt;</mo><msqrt><mn>2</mn></msqrt></math>", "image": null, "isCorrect": false}, {"id": "x4Fn7", "text": "<math><mi>μ</mi><mo>&lt;</mo><msqrt><mn>3</mn></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/0321225_sol.JPG\" style=\"width: 200px; height: 143px;\" /></p><p>For critical angle at&nbsp;the glass-liquid interface we have</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&nbsp;</mi><msub><mi>μ</mi><mn>1</mn></msub><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi>C</mi><mo>=</mo><msub><mi>μ</mi><mn>2</mn></msub><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mn>90</mn><mo>°</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi>C</mi><mo>=</mo><mi>μ</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi>C</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>μ</mi></mrow><mn>3</mn></mfrac></math></p><p>For total internal reflection</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>°</mo><mo>&gt;</mo><mi>C</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mn>60</mn><mo>°</mo><mo>&gt;</mo><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi>C</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><msqrt><mn>3</mn></msqrt><mn>2</mn></mfrac><mo>&gt;</mo><mfrac><mrow><mn>2</mn><mi>μ</mi></mrow><mn>3</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>μ</mi><mo>&lt;</mo><mfrac><mrow><mn>3</mn><msqrt><mn>3</mn></msqrt></mrow><mn>4</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86355b9c5d6ffbc2527", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "59", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p align=\"left\" style=\"text-align:left;\"><span style=\"color:black\">A ray of light is incident normally on one of the faces of a prism of apex angle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>°</mo></math>and refractive index&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>2</mn></msqrt></math>.</span><span>&nbsp;The angle of deviation of the ray is</span></p>\r", "image": null}, "options": [{"id": "4WNlj", "text": "<div><p align=\"left\" style=\"text-align:left;\"><span style=\"position:relative;top:0.0pt\">&nbsp;<math>  <mrow>   <mn>30</mn><mo>&deg;</mo>  </mrow> </math>  </span></p></div>", "image": null, "isCorrect": false}, {"id": "IsUQD", "text": "<div><p align=\"left\" style=\"text-align:left;\"><span style=\"position:relative;top:0.0pt\">&nbsp;<math>  <mrow>   <mn>45</mn><mo>&deg;</mo>  </mrow> </math>  </span></p></div>", "image": null, "isCorrect": false}, {"id": "A0IqC", "text": "<div><p align=\"left\" style=\"text-align:left;\"><span style=\"position:relative;top:0.0pt\">&nbsp;<math> <mrow> <mn>15</mn><mo>°</mo> </mrow> </math> </span></p></div>", "image": null, "isCorrect": true}, {"id": "LwMVt", "text": "none of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><span>Using Snell&rsquo;s law for the refraction at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AC</mi></math>, we get</span></p><p><span style=\"position:relative;top:0.0pt\">&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#956;</mi><mtext>&#8201;&#8201;</mtext><mi>sini</mi><mo>=</mo><mo>(</mo><mn>1</mn><mo>)</mo><mtext>&#8201;&#8201;</mtext><mi>sinr</mi></math> </span></p><p><span style=\"position:relative;top:0.0pt\">&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>2</mn></msqrt><mi>sin</mi><mn>30</mn><mo>&#176;</mo><mo>=</mo><mi>sinr</mi></math> </span></p><p><span style=\"position:relative;top:0.0pt\">&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>sinr</mi><mo>=</mo><mfrac><mn>1</mn><msqrt><mn>2</mn></msqrt></mfrac></math> </span></p><p><span style=\"position:relative;top:0.0pt\">&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mtext>&#8201;&#8201;&#8201;&#8201;&#8201;</mtext><mi mathvariant=\"normal\">r</mi><mo>=</mo><mn>45</mn><mo>&#176;</mo></math> </span></p><p><span style=\"position:relative;top:0.0pt\">&nbsp;<math> <mo>&#8756;</mo> </math> </span><span>&nbsp;&nbsp;&nbsp;Angle of deviation &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>45</mn><mo>&#176;</mo><mo>&#8722;</mo><mn>30</mn><mo>&#176;</mo><mo>=</mo><mn>15</mn><mo>&#176;</mo></math> </span></p><p align=\"left\" style=\"text-align:left;\"><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-05-28_at_6.59.09_PM.jpeg\" style=\"width: 200px; height: 177px;\" /></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86337c5f91b5435c6cb", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "67", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The maximum refractive index of a prism which permits the passage of light through it is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mi>n</mi></msqrt></math>. If the refracting angle of the prism is <math><mn>90</mn><mo>°</mo><mo>,</mo></math> then what is the value of <math><mi>n</mi></math>?", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "For passing the ray from the prism,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#956;</mi><mo>&#60;</mo><mi>cosec</mi><mfrac><mi>A</mi><mn>2</mn></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#956;</mi><mo>&#60;</mo><mi>cosec</mi><mfenced separators=\"|\"><mfrac><mrow><mn>90</mn><mo>&#176;</mo></mrow><mn>2</mn></mfrac></mfenced></math><br /><br /><math><mi mathvariant=\"normal\">&#956;</mi><mo>&#60;</mo><msqrt><mn>2</mn></msqrt></math><br /><br /><math><mrow><mrow><msub><mrow><mi mathvariant=\"normal\">&#956;</mi></mrow><mrow><mi mathvariant=\"normal\">max</mi></mrow></msub></mrow><mo>&#8289;</mo><mrow><mo>=</mo><msqrt><mn>2</mn></msqrt></mrow></mrow></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86331db01034af1e8e3", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "12", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A prism of refractive index <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mn>3</mn><mn>2</mn></mfrac></msqrt></math> and refracting angle is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>45</mn><mo>&#176;</mo></math>&nbsp;is placed in air. One of the two refracting surfaces of the prism is&nbsp;silvered and&nbsp;a&nbsp;ray&nbsp;of monochromatic light enters&nbsp;the prism from the other face at an angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi></math>.&nbsp;If the ray retraces its path, then what is the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi></math>(in degree)?</p>\r", "image": null}, "options": [], "correctValue": "60", "solution": {"text": "<p>The monochromatic ray of light will retrace its path if it strikes the mirror perpendicularly.</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/abs/739986ae-26a0-436b-8b7f-282cfd3e76cb-62.JPG\" style=\"width: 150px; height: 114px;\" /></p><p>Using Snell&#39;s law of refraction,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#215;</mo><mi>sin</mi><mi>&#952;</mi><mo>=</mo><mi>&#956;</mi><mo>&#215;</mo><mi>sin</mi><mn>45</mn><mo>&#176;</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>sin</mi><mi>&#952;</mi><mo>=</mo><msqrt><mfrac><mn>3</mn><mn>2</mn></mfrac></msqrt><mo>&#215;</mo><mi>sin</mi><mn>45</mn><mo>&#176;</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>sin</mi><mi>&#952;</mi><mo>=</mo><msqrt><mfrac><mn>3</mn><mn>2</mn></mfrac></msqrt><mo>&#215;</mo><mfrac><mn>1</mn><msqrt><mn>2</mn></msqrt></mfrac><mo>=</mo><mfrac><msqrt><mn>3</mn></msqrt><mn>2</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#952;</mi><mo>=</mo><mn>60</mn><mo>&#176;</mo></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632773444148e1658f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "75", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "What is the required condition, if the light incident on one face of a prism, does not emerge from the other face?", "image": null}, "options": [{"id": "bkTxn", "text": "<math><mi>n</mi><mo>&lt;</mo><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">c</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "ixJYO", "text": "<math><mi>n</mi><mo>&lt;</mo><mrow><mrow><mi mathvariant=\"normal\">sec</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "vTvgU", "text": "<math><mi>n</mi><mo>&gt;</mo><mrow><mrow><mi mathvariant=\"normal\">sec</mi></mrow><mo>⁡</mo><mrow><mi>A</mi></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "9m3FT", "text": "<math><mi>n</mi><mo>&gt;</mo><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">c</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Consider the situation shown in figure.<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/374716.PNG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 213px; height: 157px;\" /><br /><br />Light rays <math> <mrow>  <mi>P</mi><mi>Q</mi></mrow></math> is incident on the face <math> <mrow>  <mi>A</mi><mi>B</mi></mrow></math>. It goes along <math> <mrow>  <mi>Q</mi><mi>R</mi></mrow></math> and then along <math> <mrow>  <mi>R</mi><mi>S</mi></mrow></math>.<br /><br />Here,<br /><br /><math><mi>i</mi><mo>=</mo></math> angle of incidence at the face <math><mi>A</mi><mi>B</mi></math><br /><br /><math><msub><mrow><mi>r</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo></math> angle of refraction through <math><mi>A</mi><mi>B</mi></math><br /><br /><math><msub><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo></math> angle of incidence at <math><mi>A</mi><mi>C</mi></math><br /><br /><math><mi>n</mi><mo>=</mo></math> refractive index of the material of the prims.<br /><br />For the prism, we have<br /><br /><math><msub><mrow><mi>r</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mi>A</mi></math> .....(i)<br /><br />Now for light not to emerge from the face <math><mi>A</mi><mi>C</mi><mo>,</mo></math><br /><br /><math><msub><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>&gt;</mo><mi>C</mi></math><br /><br />Similarly for no emergence from the face <math><mi>A</mi><mi>B</mi><mo>,</mo></math><br /><br /><math><msub><mrow><mi>r</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>&gt;</mo><mi>C</mi></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>r</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>&gt;</mo><mn>2</mn><mi>C</mi></math><br /><br />Here, <math><mi>C</mi></math> is critical angle.<br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>A</mi><mo>&gt;</mo><mn>2</mn><mi>C</mi></math> <math><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mo>∵</mo><mi>&nbsp;</mi><msub><mrow><mi>r</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mi>A</mi></mrow></mfenced></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>&gt;</mo><mi>C</mi></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mfrac><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mrow><mo>&gt;</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>C</mi></mrow></mrow></math><br /><br /><math><mo>⇒</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mfrac><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mrow><mo>&gt;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>n</mi></mrow></mfrac></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>n</mi><mo>&gt;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mfrac><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mrow></mrow></mfrac></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>n</mi><mo>&gt;</mo><mi>cosec</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86322ba8d8960fa3f6c", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "27", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A thin prism of angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>°</mo></math> is placed at a distance of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi>cm</mi></math> from the object. The distance of the image from the object is (given <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">μ</mi></math> of prism<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mtext>1.5</mtext></math>)", "image": null}, "options": [{"id": "s45rD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mtext>&#x3C0;</mtext><mn>8</mn></mfrac><mo>&#xA0;</mo><mi>cm</mi></math>", "image": null, "isCorrect": false}, {"id": "jfZPP", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mtext>&#x3C0;</mtext><mn>12</mn></mfrac><mo>&#xA0;</mo><mi>cm</mi></math>", "image": null, "isCorrect": false}, {"id": "nxz1k", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mtext>5π</mtext><mn>36</mn></mfrac><mo>&nbsp;</mo><mi>cm</mi></math>", "image": null, "isCorrect": true}, {"id": "R5xl1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mtext>&#x3C0;</mtext><mn>7</mn></mfrac><mo>&#xA0;</mo><mi>cm</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#948;</mi><mo>=</mo><mfenced><mrow><mi mathvariant=\"normal\">&#956;</mi><mo>-1</mo></mrow></mfenced><mi mathvariant=\"normal\">A</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#948;</mi><mo>=</mo><mfenced><mrow><mtext>1.5</mtext><mo>-1</mo></mrow></mfenced><mo>&#215;</mo><mn>5</mn><mo>&#176;</mo><mo>=</mo><mtext>2.5&#176;</mtext></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mtext>2.5</mtext><mo>&#215;</mo><mfrac><mtext>&#960;</mtext><mrow><mn>1</mn><mn>8</mn><mn>0</mn></mrow></mfrac><mo>=</mo><mfrac><mtext>&#960;</mtext><mn>72</mn></mfrac></math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/KT0000380_AnsExp_1.jpg\" style=\"width: 280px; height: 170px;\" /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>&#948;&#8776;tan</mtext><mspace width=\"0.5em\"/><mtext>&#948;</mtext><mo>=</mo><mfrac><mtext>d</mtext><mtext>10</mtext></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mtext>&#960;</mtext><mn>72</mn></mfrac><mo>=</mo><mfrac><mtext>d</mtext><mtext>10</mtext></mfrac><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mo>&#8658;</mo><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mtext>d</mtext><mo>=</mo><mfrac><mrow><mn>5</mn><mtext>&#960;</mtext></mrow><mn>36</mn></mfrac><mo>&#160;</mo><mi>cm</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631ba73581566ec977", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "19", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A thin prism of angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#176;</mo></math>&nbsp;made of glass of refractive index <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">&#956;</mi><mn>1</mn></msub><mo>=</mo><mn>1</mn><mo>.</mo><mn>5</mn></math>&nbsp;is combined with another prism of glass of refractive index <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">&#956;</mi><mn>2</mn></msub><mo>=</mo><mn>1</mn><mo>.</mo><mn>75</mn></math>. The combination of the prisms produces dispersion without deviation. The angle of the second prism should be</p>\r", "image": null}, "options": [{"id": "1DxTB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#176;</mo></math>", "image": null, "isCorrect": false}, {"id": "9BxRG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>&#176;</mo></math>", "image": null, "isCorrect": false}, {"id": "59qaa", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>10</mn><mo>&#xB0;</mo></mrow><mn>3</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "VTjZ6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1.2</mn><mo>&#176;</mo></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>For dispersion without deviation</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">&#948;</mi><mn>1</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">&#948;</mi><mn>2</mn></msub><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi mathvariant=\"normal\">&#956;</mi><mn>1</mn></msub><mo>-</mo><mn>1</mn></mrow></mfenced><mi mathvariant=\"normal\">A</mi><msub><mo>&#8289;</mo><mn>1</mn></msub><mo>+</mo><mfenced><mrow><msub><mi mathvariant=\"normal\">&#956;</mi><mn>2</mn></msub><mo>-</mo><mn>1</mn></mrow></mfenced><mi mathvariant=\"normal\">A</mi><msub><mo>&#8289;</mo><mn>2</mn></msub><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><msub><mo>&#8289;</mo><mn>2</mn></msub><mo>=</mo><mo>-</mo><mfrac><mrow><mfenced><mrow><msub><mi mathvariant=\"normal\">&#956;</mi><mn>1</mn></msub><mo>-</mo><mn>1</mn></mrow></mfenced><mi mathvariant=\"normal\">A</mi><msub><mo>&#8289;</mo><mn>1</mn></msub></mrow><mfenced><mrow><msub><mi mathvariant=\"normal\">&#956;</mi><mn>2</mn></msub><mo>-</mo><mn>1</mn></mrow></mfenced></mfrac></math></p><p>Substituting the given values, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><msub><mo>&#8289;</mo><mn>2</mn></msub><mo>=</mo><mo>-</mo><mfrac><mrow><mfenced><mrow><mn>1</mn><mo>&#183;</mo><mn>5</mn><mo>-</mo><mn>1</mn></mrow></mfenced><mn>5</mn><mo>&#176;</mo></mrow><mfenced><mrow><mn>1</mn><mo>&#183;</mo><mn>75</mn><mo>-</mo><mn>1</mn></mrow></mfenced></mfrac><mo>=</mo><mo>-</mo><mfrac><mrow><mn>10</mn><mo>&#176;</mo></mrow><mn>3</mn></mfrac></math></p><p>The negative sign shows that the two prisms must be joined in opposition.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630e11c1ef8f7fb743", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "88", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Secondary rainbow in the atmosphere is", "image": null}, "options": [{"id": "lCbII", "text": "the result of polarization and dispersion of light", "image": null, "isCorrect": false}, {"id": "y2hDa", "text": "brighter than the primary rainbow", "image": null, "isCorrect": false}, {"id": "1JEUp", "text": "due to the phenomenon of double refraction", "image": null, "isCorrect": false}, {"id": "UFuYW", "text": "formed due to two reflections in the rain drop", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Secondary rainbow in the atmosphere is formed due to two or double reflection in rain drops, suspended in clouds.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 8, "topicId": "6aa3ab79aa8dc1ff68178096", "title": "Optical Instruments", "totalQuestions": 6, "questions": [{"_id": "6151e863cf355bdedc9a76ed", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "57", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In a compound microscope, the objective lens and eyepiece have a focal length of <math><mn>0.95&nbsp;</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math> and <math><mn>5&nbsp;</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math> respectively and are kept at a distance of <math><mn>20&nbsp;</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>. If the last image is formed at a distance of <math><mn>25&nbsp;</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math> from the eyepiece, calculate magnifying power.", "image": null}, "options": [{"id": "J56CE", "text": "<math><mn>94</mn></math>", "image": null, "isCorrect": true}, {"id": "trvYi", "text": "<math><mn>84</mn></math>", "image": null, "isCorrect": false}, {"id": "PIGOc", "text": "<math><mn>75</mn></math>", "image": null, "isCorrect": false}, {"id": "6qiWu", "text": "<math><mn>88</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>f</mi><mn>0</mn></msub><mo>=</mo><mn>0.95</mn><mo>&#8195;</mo><mi>m</mi><mo>=</mo><mfrac><msub><mi>V</mi><mn>0</mn></msub><msub><mi>u</mi><mn>0</mn></msub></mfrac><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mfrac><mi>D</mi><msub><mi>f</mi><mi mathvariant=\"normal\">e</mi></msub></mfrac></mrow></mfenced></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>f</mi><mi mathvariant=\"normal\">e</mi></msub><mo>=</mo><mn>5</mn><mo>&#160;</mo><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi><mo>&#8195;</mo><msub><mi>u</mi><mi mathvariant=\"normal\">e</mi></msub><mo>=</mo><mfrac><mn>25</mn><mn>6</mn></mfrac></math><br />For eyepiece<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>+</mo><mfrac><mi>D</mi><msub><mi>f</mi><mi mathvariant=\"normal\">e</mi></msub></mfrac><mo>=</mo><mfrac><msub><mi>V</mi><mi mathvariant=\"normal\">e</mi></msub><msub><mi>U</mi><mi mathvariant=\"normal\">e</mi></msub></mfrac><mo>&#8195;</mo><mi>u</mi><mo>=</mo><mfrac><msub><mi>V</mi><mi mathvariant=\"normal\">e</mi></msub><mn>6</mn></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>0</mn></msub><mo>=</mo><mn>20</mn><mo>-</mo><mfrac><mn>25</mn><mn>6</mn></mfrac><mo>=</mo><mfrac><mn>95</mn><mn>6</mn></mfrac><msub><m /1998/Math/MathML\"><mn>25</mn></math>", "image": null, "isCorrect": false}, {"id": "kw2G3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>125</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a compound microscope,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>=</mo><mfrac><mi>L</mi><msub><mi>f</mi><mn>0</mn></msub></mfrac><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mfrac><mi>D</mi><msub><mi>f</mi><mi>e</mi></msub></mfrac></mrow></mfenced></math><br />(Where length of tube <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi><mo>=</mo><mn>30</mn><mo>&nbsp;</mo><mi>cm</mi></math>, focal length of objective lens <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>f</mi><mn>0</mn></msub><mo>=</mo><mn>1</mn><mi>&nbsp;</mi><mi>cm</mi></math>, focal length of eye-piece <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>f</mi><mi>e</mi></msub><mo>=</mo><mn>6</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi>cm</mi><mo>,</mo><mi>&nbsp;</mi><mi>D</mi><mo>=</mo><mn>25</mn><mi>&nbsp;</mi><mi>cm</mi></math>)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>m</mi><mo>=</mo><mfrac><mn>30</mn><mn>1</mn></mfrac><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mfrac><mn>25</mn><mn>6</mn></mfrac></mrow></mfenced><mo>=</mo><mn>30</mn><mo>×</mo><mfrac><mfenced separators=\"|\"><mrow><mn>6</mn><mo>+</mo><mn>25</mn></mrow></mfenced><mn>6</mn></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>m</mi><mo>=</mo><mn>5</mn><mo>×</mo><mn>31</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>m</mi><mo>=</mo><mn>155</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863666123492304759e", "type": "singleCorrect", "level": 1,     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
