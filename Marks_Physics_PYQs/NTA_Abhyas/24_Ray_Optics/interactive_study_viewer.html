ub><mi mathvariant=\"normal\">i</mi><mn>2</mn></msub><mo>=</mo><mn>90</mn><mo>°</mo></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;∴&nbsp;</mo><msub><mi mathvariant=\"normal\">μ</mi><mi mathvariant=\"normal\">g</mi></msub><mi>sin</mi><mfenced><mi mathvariant=\"normal\">i</mi></mfenced><mo>=</mo><mn>1</mn><mo>×</mo><mi>sin</mi><mn>90</mn><mo>°</mo></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴ &nbsp;&nbsp;</mo><msub><mi mathvariant=\"normal\">μ</mi><mtext>g</mtext></msub><mo>=</mo><mfrac><mn>1</mn><mrow><mi>sin</mi><mfenced><mi mathvariant=\"normal\">i</mi></mfenced></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638068fe7a0e51c84d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "39", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A transparent cube of side <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi></math>, made of a material of refractive index <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>μ</mi><mn>2</mn></msub></math>, is immersed in a liquid of refractive index <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>μ</mi><mn>1</mn></msub><mo>&nbsp;</mo><mo>(</mo><mo>&nbsp;</mo><msub><mi>μ</mi><mn>1</mn></msub><mo>&lt;</mo><msub><mi>μ</mi><mn>2</mn></msub><mo>)</mo></math>. A ray is incident on the face <math><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">B</mi></math> at an angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>θ</mi></math> (shown in the figure). Total internal reflection takes place at the point <math><mi mathvariant=\"normal\">E</mi></math> on the face <math><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">C</mi><mo>.</mo></math><br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/0459979_que.jpg\" style=\"width: 160px; height: 143px;\" /><br />\r<br />\rThen,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>θ</mi></math> must satisfy", "image": null}, "options": [{"id": "O1IPi", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>θ</mi><mo mathvariant=\"italic\">&lt;</mo><msup><mi>sin</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msqrt><mfrac><msubsup><mi>μ</mi><mn>2</mn><mn>2</mn></msubsup><msubsup><mi>μ</mi><mn>1</mn><mn>2</mn></msubsup></mfrac><mo>-</mo><mn>1</mn></msqrt></math>", "image": null, "isCorrect": true}, {"id": "GYoU9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi><mo mathvariant=\"italic\">&#62;</mo><msup><mi>sin</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfrac><msub><mi>&#956;</mi><mn>1</mn></msub><msub><mi>&#956;</mi><mn>2</mn></msub></mfrac></math>", "image": null, "isCorrect": false}, {"id": "NDSJK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi><mo mathvariant=\"italic\">&#60;</mo><msup><mi>sin</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfrac><msub><mi>&#956;</mi><mn>1</mn></msub><msub><mi>&#956;</mi><mn>2</mn></msub></mfrac></math>", "image": null, "isCorrect": false}, {"id": "aqs33", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi><mo mathvariant=\"italic\">&#62;</mo><msup><mi>sin</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msqrt><mfrac><msubsup><mi>&#956;</mi><mn>2</mn><mn>2</mn></msubsup><msubsup><mi>&#956;</mi><mn>1</mn><mn>2</mn></msubsup></mfrac><mo>-</mo><mn>1</mn></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/0459979_sol.JPG\" style=\"width: 180px; height: 170px;\" /></p><p>At surface (1)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>μ</mi><mn>1</mn></msub><mi>sin</mi><mi>θ</mi><mo>=</mo><msub><mi>μ</mi><mn>2</mn></msub><mi>sin</mi><mi>r</mi><mi>&nbsp;</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>…</mo><mfenced separators=\"|\"><mn>1</mn></mfenced></math><br /><br />At surface (2)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>μ</mi><mn>1</mn></msub><mo>=</mo><msub><mi>μ</mi><mn>2</mn></msub><mi>sin</mi><mfenced separators=\"|\"><mrow><mn>90</mn><mo>-</mo><mi>r</mi></mrow></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>μ</mi><mn>1</mn></msub><mo>=</mo><msub><mi>μ</mi><mn>2</mn></msub><mi>cos</mi><mi>r</mi><mo>&nbsp;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mn>2</mn><mo>)</mo></math><br /><br />From equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>1</mn><mo>)</mo></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>2</mn><mo>)</mo></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo mathvariant=\"italic\">⇒</mo><mi>sin</mi><mo mathvariant=\"italic\">⁡</mo><mi>θ</mi><mo mathvariant=\"italic\">=</mo><mfrac><mrow><mi>sin</mi><mo>⁡</mo><mi>r</mi></mrow><mrow><mi>cos</mi><mo mathvariant=\"italic\">⁡</mo><mi>r</mi></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>sin</mi><mi>θ</mi><mo>=</mo><mfrac><mfrac><mfenced separators=\"|\"><msqrt><msubsup><mi>μ</mi><mn>2</mn><mn>2</mn></msubsup><mo>-</mo><msubsup><mi>μ</mi><mn>1</mn><mn>2</mn></msubsup></msqrt></mfenced><msub><mi>μ</mi><mn>2</mn></msub></mfrac><mfenced separators=\"|\"><mfrac><msub><mi>μ</mi><mn>1</mn></msub><msub><mi>μ</mi><mn>2</mn></msub></mfrac></mfenced></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>sin</mi><mi>θ</mi><mo>=</mo><msqrt><mfrac><msubsup><mi>μ</mi><mn>2</mn><mn>2</mn></msubsup><msubsup><mi>μ</mi><mn>1</mn><mn>2</mn></msubsup></mfrac><mo>-</mo><mn>1</mn><mi mathvariant=\"normal\">&nbsp;</mi></msqrt></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>θ</mi></math>&nbsp;must satisfy,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>θ</mi><mo mathvariant=\"italic\">&lt;</mo><msup><mi>sin</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced separators=\"|\"><msqrt><mfrac><msubsup><mi>μ</mi><mn>2</mn><mn>2</mn></msubsup><msubsup><mi>μ</mi><mn>1</mn><mn>2</mn></msubsup></mfrac><mo>-</mo><mn>1</mn></msqrt></mfenced></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637913fdef662816b6", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "94", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A glass rod of rectangular cross-section is bent into the shape shown in the figure below. A parallel beam of light falls perpendicularly on the flat surface <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>. Determine the minimum value of the ratio&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac bevelled=\"true\"><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">d</mi></mfrac></math> for which all light entering the glass through surface&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> will emerge from the glass through the surface <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>. The index of refraction of the glass is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>5</mn></math>.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Q_8412.jpg\" style=\"max-width:100%; object-fit:contain\" />", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "Consider the representative rays shown in diagram (b). A ray entering the glass through surface A and passing along the inner side of the rod will be reflected by the outer side with the smallest angle <math> <mrow> <mi>α</mi> </mrow> </math>, at which the reflected ray is tangent to the inner side. We have to consider the conditions under which the ray will undergo total internal reflection before reaching B.<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Q_84_soln.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 200px; height: 211px;\" /><br /><br />If <math> <mrow> <mi>α</mi> <mo>&gt;</mo> <msub> <mi>θ</mi> <mtext>c</mtext> </msub> </mrow> </math>, the critical angle, at which total internal reflection occurs, all the incident beam will emerge through the surface B. Hence we require<br /><br /><math> <mrow> <mtext>sin</mtext> <mi>α</mi> <mo>&gt;</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>n</mtext> </mrow> </mfrac> </mrow> </math><br /><br />The geometry gives <math> <mrow> <mtext>sin</mtext> <mi>α</mi> <mo>=</mo> <mfrac> <mrow> <mtext>R</mtext> </mrow> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>R</mtext> <mo>+</mo> <mtext>d</mtext> </mrow> </mfenced> </mrow> </mfrac> </mrow> </math><br /><br />Therefore <math> <mrow> <mfrac> <mrow> <mtext>R</mtext> </mrow> <mrow> <mtext>R</mtext> <mo>+</mo> <mtext>d</mtext> </mrow> </mfrac> <mo>≥</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>n</mtext> </mrow> </mfrac> </mrow> </math>,<br /><br />or <math> <mrow> <msub> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>R</mtext> </mrow> <mrow> <mtext>d</mtext> </mrow> </mfrac> </mrow> </mfenced> </mrow> <mtext>min</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>n</mtext> <mo>-</mo> <mn>1</mn> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>1.5</mtext> <mo>-</mo> <mn>1</mn> </mrow> </mfrac> <mo>=</mo> <mn>2</mn> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863743cf7e62f272ba1", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "06", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A point source of light is placed at a distance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math> below the surface of a large deep lake. Neglecting the partial reflection of light during refraction, the percentage of light energy that escapes from the water surface is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>[</mo><msub><mi>μ</mi><mi>water</mi></msub><mo>=</mo><mfrac bevelled=\"true\"><mn>4</mn><mn>3</mn></mfrac><mo>]</mo></math>", "image": null}, "options": [{"id": "CtvsY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <mn>50</mn><mo>%</mo></mrow> </math>", "image": null, "isCorrect": false}, {"id": "w0Yfs", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <mn>25</mn><mo>%</mo></mrow> </math>", "image": null, "isCorrect": false}, {"id": "IOjHc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <mn>20</mn><mo>%</mo></mrow> </math>", "image": null, "isCorrect": false}, {"id": "Z6xlQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <mn>17</mn><mo>%</mo></mrow> </math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Solid angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <mfenced> <mi>&#981;</mi> </mfenced><mo>=</mo><mn>2</mn><mi>&#960;</mi><mfenced> <mrow> <mn>1</mn><mo>&#8722;</mo><mi>cos</mi><mi>&#952;</mi></mrow> </mfenced></mrow> </math><br /><br />where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <mi>&#952;</mi><mo>=</mo></mrow> </math> plane angle<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/KT0000323_AnsExp4_1.jpg\" /><br /><br /><math> <mrow> <mtext>escape energy</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>total energy</mtext> </mrow> <mrow> <mn>4</mn> <mtext>&#960;</mtext> </mrow> </mfrac> <mo>&#215;</mo> <mtext>solid angle</mtext> </mrow> </math><br /><br /><math> <mrow> <mfrac> <mrow> <mtext>escape energy</mtext> </mrow> <mrow> <mtext>total energy</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>4</mn> <mtext>&#960;</mtext> </mrow> </mfrac> <mo>&#215;</mo> <mn>2</mn> <mtext>&#960;</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>1</mn> <mo>-</mo> <mtext>cosC</mtext> </mrow> </mfenced> </mrow> </math><br /><br /><math> <mrow> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>1</mn> <mo>-</mo> <mtext>cosC</mtext> </mrow> </mfenced><mn> &#160; &#160; &#160; &#160; &#160; ....(1)</mn> </mrow> </math><br /><br />from law of refraction<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <msub> <mi>&#956;</mi> <mi>w</mi> </msub> <mi>sin</mi><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mi>i</mi><mo>=</mo><msub> <mi>&#956;</mi> <mi>a</mi> </msub> <mtext>&#8201;</mtext><mi>sin</mi><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mi>r</mi></mrow> </math><br /><br /><math> <mrow> <mfrac> <mrow> <mn>4</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> <mo>&#215;</mo> <mtext>sin C</mtext> <mo>=</mo> <mn>1</mn> <mo>&#215;</mo> <msup> <mtext>sin 90</mtext> <mtext>o</mtext> </msup> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>sin C</mtext><mo>=</mo><mfrac><mn>3</mn><mn>4</mn></mfrac><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mo>&#8658;</mo><mspace width=\"0.5em\"/><mtext>cos C</mtext><mo>=</mo><msqrt><mn>1</mn><mo>-</mo><msup><mtext>sin</mtext><mn>2</mn></msup><mtext>C</mtext></msqrt><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mo>&#8658;</mo><mspace width=\"0.5em\"/><mtext>cos C</mtext><mo>=</mo><mfrac><msqrt><mn>7</mn></msqrt><mn>4</mn></mfrac><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mtext>....</mtext><mfenced><mn>2</mn></mfenced></math><br /><br />from (1) and (2)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <msub> <mi>&#956;</mi> <mi>w</mi> </msub> <mi>sin</mi><mtext>&#8201;</mtext><mi>i</mi><mo>=</mo><msub> <mi>&#956;</mi> <mi>a</mi> </msub> <mi>sin</mi><mtext>&#8201;</mtext><mi>r</mi></mrow> </math><br /><br /><math> <mrow> <mfrac> <mrow> <mtext>escaped energy</mtext> </mrow> <mrow> <mtext>total energy</mtext> </mrow> </mfrac> <mo>=</mo> <mtext>0.17</mtext> </mrow> </math><br /><br />total <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mo>%</mo> </math> energy enscaped <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <mo>=</mo><mn>17</mn><mo>%</mo></mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636185bebe104b82ed", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "70", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the figure given below, for an angle of incidence <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>45</mn><mo>°</mo></math> at the top surface, what is the minimum refractive index needed for total internal reflection at the vertical face?<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/650025_soludad_1.png\" style=\"width: 180px; height: 147px;\" />", "image": null}, "options": [{"id": "jPO1E", "text": "<math><mfrac><mrow><msqrt><mn>2</mn></msqrt><mo>+</mo><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "3vBAm", "text": "<math><msqrt><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "MyLe5", "text": "<math><msqrt><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "0u9eG", "text": "<math><msqrt><mn>2</mn></msqrt><mo>+</mo><mn>1</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "At point <math><mi>A</mi></math> , by Snell's law<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-07-27_at_3.08.19_PM.jpeg\" style=\"width: 200px; height: 160px;\" /><br /><br /><math><mi>μ</mi><mo>=</mo><mfrac><mrow><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><msup><mrow><mn>45</mn></mrow><mrow><mi>o</mi></mrow></msup></mrow></mrow></mrow><mrow><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>r</mi></mrow></mrow></mrow></mfrac><mo>⇒</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>r</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>μ</mi><msqrt><mn>2</mn></msqrt></mrow></mfrac></math> ... (i)<br /><br />At point <math><mi>B</mi></math> , total internal reflection with <math><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><msub><mrow><mi>i</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mrow><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>μ</mi></mrow></mfrac></math><br /><br />From figure, <math><msub><mrow><mi>i</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msup><mrow><mn>90</mn></mrow><mrow><mi>o</mi></mrow></msup><mo>-</mo><mi>r</mi></math> .... (ii)<br /><br /><math><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><msup><mrow><mn>90</mn></mrow><mrow><mi>o</mi></mrow></msup><mo>-</mo><mi>r</mi></mrow></mfenced></mrow></mrow><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>μ</mi></mrow></mfrac><mo>⇒</mo><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>r</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>μ</mi></mrow></mfrac></math> .... (iii)<br /><br />Now, <math><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>r</mi></mrow></mrow><mo>=</mo><msqrt><mn>1</mn><mo>-</mo><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>r</mi></mrow></mrow></msqrt><mo>=</mo><msqrt><mn>1</mn><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><msup><mrow><mi>μ</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></msqrt><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><msup><mrow><mi>μ</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>1</mn></mrow><mrow><msup><mrow><mi>μ</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></msqrt></math><br /><br />From equation (ii) and (iii), <math><mfrac><mrow><mn>1</mn></mrow><mrow><mi>μ</mi></mrow></mfrac><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><msup><mrow><mi>μ</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>1</mn></mrow><mrow><mn>2</mn><msup><mrow><mi>μ</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></msqrt></math><br /><br />Squaring both sides and then solving, we get<br /><br /><math><mi>μ</mi><mo>=</mo><msqrt><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86360ac2eb54d30000e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "41", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>Light is incident normally on the face&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math> of a prism as shown in the figure. A layer of liquid of refractive index <math><mi>μ</mi></math> is applied on the face&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AC</mi></math> of the prism. If the prism is made of glass of refractive index <math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>, then&nbsp;the limit of <math><mi>μ</mi></math> for which total internal reflection takes place on face&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AC</mi></math> is</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/321225_que.JPG\" style=\"width: 180px; height: 157px;\" /></p>\r", "image": null}, "options": [{"id": "eBmPT", "text": "<math><mi>μ</mi><mo>&lt;</mo><mfrac><mrow><mn>3</mn><msqrt><mn>3</mn></msqrt></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "w9oMF", "text": "<math><mi>μ</mi><mo>&gt;</mo><msqrt><mfrac><mrow><mn>5</mn></mrow><mrow><mn>2</mn></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "hVvdm", "text": "<math><mi>μ</mi><mo>&gt;</mo><msqrt><mn>2</mn></msqrt></math>", "image": null, "isCorrect": false}, {"id": "x4Fn7", "text": "<math><mi>μ</mi><mo>&lt;</mo><msqrt><mn>3</mn></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/0321225_sol.JPG\" style=\"width: 200px; height: 143px;\" /></p><p>For critical angle at&nbsp;the glass-liquid interface we have</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&nbsp;</mi><msub><mi>μ</mi><mn>1</mn></msub><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi>C</mi><mo>=</mo><msub><mi>μ</mi><mn>2</mn></msub><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mn>90</mn><mo>°</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi>C</mi><mo>=</mo><mi>μ</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi>C</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>μ</mi></mrow><mn>3</mn></mfrac></math></p><p>For total internal reflection</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>°</mo><mo>&gt;</mo><mi>C</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mn>60</mn><mo>°</mo><mo>&gt;</mo><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi>C</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><msqrt><mn>3</mn></msqrt><mn>2</mn></mfrac><mo>&gt;</mo><mfrac><mrow><mn>2</mn><mi>μ</mi></mrow><mn>3</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>μ</mi><mo>&lt;</mo><mfrac><mrow><mn>3</mn><msqrt><mn>3</mn></msqrt></mrow><mn>4</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635d0eada2383617a2", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "43", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<div>\r<p><span style=\"\rcolor:black\">A rectangular glass slab <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ABCD</mi></math></span><span>, of refractive index, &nbsp;<math> <mrow> <msub> <mi>n</mi> <mn>1</mn> </msub> <mo>,</mo> </mrow> </math> &nbsp;is immersed in water of refractive index &nbsp;<math> <mrow> <msub> <mi>n</mi> <mn>2</mn> </msub> <mo stretchy=\"false\">(</mo><msub> <mi>n</mi> <mn>1</mn> </msub> <mo>&gt;</mo><msub> <mi>n</mi> <mn>2</mn> </msub> <mo stretchy=\"false\">)</mo><mo>.</mo> </mrow> </math> &nbsp;A ray of light is incident at the surface <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math>&nbsp;of the slab, as shown. The maximum value of the angle of incidence &nbsp;<math> <mrow> <msub> <mi>α</mi> <mrow> <mi>max</mi> </mrow> </msub> <mo>,</mo> </mrow> </math> such that the ray comes out only from the other surface <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CD</mi></math>,&nbsp;is given by</span></p>\r\r<p align=\"left\" style=\"text-align:left;\"><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-06-30_at_6.54.17_PM.jpeg\" style=\"width: 230px; height: 122px;\" /><br />\r&nbsp;</p>\r</div>\r", "image": null}, "options": [{"id": "txLja", "text": "<div><p align=\"left\" style=\"text-align:left;\"><span style=\"position:relative;top:0.0pt\">&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>sin</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mrow><mo>[</mo><mfrac><msub><mi>n</mi><mn>1</mn></msub><msub><mi>n</mi><mn>2</mn></msub></mfrac><mi>cos</mi><mtext> </mtext><mrow><mo>(</mo><msup><mi>sin</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mtext> </mtext><mfrac><msub><mi>n</mi><mn>2</mn></msub><msub><mi>n</mi><mn>1</mn></msub></mfrac><mo>)</mo></mrow><mo>]</mo></mrow></math> </span></p></div>", "image": null, "isCorrect": true}, {"id": "mAxhh", "text": "<div><p align=\"left\" style=\"text-align:left;\"><span style=\"position:relative;top:0.0pt\">&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>sin</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mrow><mo>[</mo><msub><mi>n</mi><mn>1</mn></msub><mi>cos</mi><mtext> </mtext><mtext> </mtext><mrow><mo>(</mo><msup><mi>sin</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mfrac><mn>1</mn><msub><mi>n</mi><mn>2</mn></msub></mfrac><mo>)</mo></mrow><mo>]</mo></mrow></math> </span></p></div>", "image": null, "isCorrect": false}, {"id": "2CrvR", "text": "<div><p align=\"left\" style=\"text-align:left;\"><span style=\"position:relative;top:0.0pt\">&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>sin</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mrow><mo>(</mo><mfrac><msub><mi>n</mi><mn>1</mn></msub><msub><mi>n</mi><mn>2</mn></msub></mfrac><mo>)</mo></mrow></math> </span></p></div>", "image": null, "isCorrect": false}, {"id": "eeUJs", "text": "<div><p align=\"left\" style=\"text-align:left;\"><span style=\"position:relative;top:0.0pt\">&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>sin</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mrow><mo>(</mo><mfrac><msub><mi>n</mi><mn>2</mn></msub><msub><mi>n</mi><mn>1</mn></msub></mfrac><mo>)</mo></mrow></math> </span></p></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<div><p><span style=\"color:black\">Consider the figure. The ray will come out from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CD</mi></math>&nbsp;if it suffers a total internal reflection at surface <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AD</mi></math>, i.e., it strikes the surface <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AD</mi></math>&nbsp;at critical angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math>&nbsp;(the limiting case).</span></p><p align=\"center\" style=\"text-align:center;\"><img alt=\"\" height=\"128\" id=\"Picture 2\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/IL0000644_sol_1_1.png\" width=\"214\" /></p><p><span style=\"color:black\">Applying Snell’s law at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math>, we get</span></p><p><span style=\"color:black;position:relative;top:0.0pt\">&nbsp;<math> <mrow> <msub> <mi>n</mi> <mn>1</mn> </msub> <mtext> </mtext><mtext> </mtext><mi>sin</mi><mi>C</mi><mo>=</mo><msub> <mi>n</mi> <mn>2</mn> </msub> <mtext> </mtext><mtext> </mtext><mi>or</mi><mtext> </mtext><mtext> </mtext><mi>sin</mi><mtext> </mtext><mtext> </mtext><mi>C</mi><mo>=</mo><mfrac> <mrow> <msub> <mi>n</mi> <mn>2</mn> </msub> </mrow> <mrow> <msub> <mi>n</mi> <mn>1</mn> </msub> </mrow> </mfrac> </mrow> </math> </span></p><p><span style=\"color:black\">Applying snell’s law at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Q</mi></math>, we get</span></p><p><span style=\"color:black;position:relative;top:0.0pt\">&nbsp;<math> <mrow> <msub> <mi>n</mi> <mn>2</mn> </msub> <mtext> </mtext><mtext> </mtext><mi>sin</mi><mi>α</mi><mo>=</mo><msub> <mi>n</mi> <mn>1</mn> </msub> <mi>cos</mi><mi>C</mi><mo>;</mo><mtext> </mtext> </mrow> </math> </span></p><p><span style=\"color:black;position:relative;top:0.0pt\">&nbsp;<math> <mrow> <mo>⇒</mo><mtext> </mtext><mtext> </mtext><mtext> </mtext><mtext> </mtext><mtext> </mtext><mi>sin</mi><mi>α</mi><mo>=</mo><mfrac> <mrow> <msub> <mi>n</mi> <mn>1</mn> </msub> </mrow> <mrow> <msub> <mi>n</mi> <mn>2</mn> </msub> </mrow> </mfrac> <mi>cos</mi><mrow><mo>{</mo> <mrow> <msup> <mrow> <mi>sin</mi> </mrow> <mrow> <mo>−</mo><mn>1</mn> </mrow> </msup> <mrow><mo>(</mo> <mrow> <mfrac> <mrow> <msub> <mi>n</mi> <mn>2</mn> </msub> </mrow> <mrow> <msub> <mi>n</mi> <mn>1</mn> </msub> </mrow> </mfrac> </mrow> <mo>)</mo></mrow> </mrow> <mo>}</mo></mrow> </mrow> </math> </span></p><p align=\"left\" style=\"text-align:left;\"><span style=\"color:black\">or&nbsp; &nbsp;<math> <mrow> <mi>α</mi><mtext> </mtext><mtext> </mtext><mo>=</mo><mtext> </mtext><mtext> </mtext><msup> <mrow> <mi>sin</mi> </mrow> <mrow> <mo>−</mo><mn>1</mn> </mrow> </msup> <mtext> </mtext><mrow><mo>[</mo> <mrow> <mfrac> <mrow> <msub> <mi>n</mi> <mn>1</mn> </msub> </mrow> <mrow> <msub> <mi>n</mi> <mn>2</mn> </msub> </mrow> </mfrac> <mtext> </mtext><mi>cos</mi><mtext> </mtext><mrow><mo>{</mo> <mrow> <msup> <mrow> <mi>sin</mi> </mrow> <mrow> <mo>−</mo><mn>1</mn> </mrow> </msup> <mtext> </mtext><mrow><mo>(</mo> <mrow> <mfrac> <mrow> <msub> <mi>n</mi> <mn>2</mn> </msub> </mrow> <mrow> <msub> <mi>n</mi> <mn>1</mn> </msub> </mrow> </mfrac> </mrow> <mo>)</mo></mrow> </mrow> <mo>}</mo></mrow> </mrow> <mo>]</mo></mrow> </mrow> </math> </span></p></div>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863548d0ce4c0b91aa5", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "13", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A point source <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi></math>&nbsp;is placed at the bottom of a&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12&nbsp;</mn><mtext>mm</mtext></math>&nbsp;high transparent block of diamond(refractive index =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2.4</mn></math>). The block is immersed in an optically rarer liquid&nbsp;as shown in the figure. It is found that the light emerging from the block to the liquid forms a circular bright spot of diameter <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>18</mn><mo>&nbsp;</mo><mi>mm</mi></math>&nbsp;on the top of the block. What is the refractive index of the liquid?</p>\r\r<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Question_0000.jpg\" style=\"width: 250px; height: 114px;\" /></p>\r", "image": null}, "options": [], "correctValue": "01.80", "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Question_01111.jpg\" style=\"width: 170px; height: 121px;\" /></p><p>As the light is passing from optically denser medium to rarer medium, let us assume&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi></math>&nbsp;is the critical angle.</p><p>From Pythagoras theorem,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>SB</mi><mo>=</mo><msqrt><msup><mi>SO</mi><mn>2</mn></msup><mo>+</mo><msup><mi>OB</mi><mn>2</mn></msup></msqrt><mo>=</mo><msqrt><msup><mn>12</mn><mn>2</mn></msup><mo>+</mo><msup><mn>9</mn><mn>2</mn></msup></msqrt><mo>=</mo><mn>15</mn><mo>&#160;</mo><mi>mm</mi></math></p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mi>sin</mi><mi>&#952;</mi><mo>=</mo><mfrac><mi>OB</mi><mi>SB</mi></mfrac><mo>=</mo><mfrac><mn>9</mn><mn>12</mn></mfrac><mo>=</mo><mfrac><mn>3</mn><mn>4</mn></mfrac></math><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>sin</mi><mi>&#952;</mi><mo>=</mo><mfrac><msub><mi>&#956;</mi><mn>2</mn></msub><msub><mi>&#956;</mi><mn>1</mn></msub></mfrac><mo>=</mo><mfrac><mi>&#956;</mi><mrow><mn>2</mn><mo>.</mo><mn>4</mn></mrow></mfrac></math></p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><mfrac><mn>3</mn><mn>4</mn></mfrac><mo>=</mo><mfrac><mi>&#956;</mi><mrow><mn>2</mn><mo>.</mo><mn>4</mn></mrow></mfrac></math><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;&#160;</mo><mo>&#8658;</mo><mi>&#956;</mi><mo>=</mo><mn>1</mn><mo>.</mo><mn>8</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863397c366241003695", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "16", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>Figure shows two spherical surface of radii <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>R</mi></math> separating three transparent media of refractive index <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>μ</mi><mo>=</mo><mn>4</mn></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>μ</mi><mo>=</mo><mn>2</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>μ</mi><mo>=</mo><mn>1</mn></math>. A ray of light travelling in a medium <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>μ</mi><mo>=</mo><mn>1</mn></math> is incident on outer sphere tangentially. The net deviation suffered by light ray will be<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ane.JPG\" style=\"width: 230px; height: 177px;\" /></p>\r", "image": null}, "options": [{"id": "XhAqu", "text": "<math><mn>0</mn><mo>°</mo></math>", "image": null, "isCorrect": false}, {"id": "N04jp", "text": "<math><mn>90</mn><mo>°</mo></math>", "image": null, "isCorrect": false}, {"id": "RJGtj", "text": "<math><mn>240</mn><mo>°</mo></math>", "image": null, "isCorrect": true}, {"id": "db6sw", "text": "<math><mn>280</mn><mo>°</mo></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Path of light ray for minimum deviation will be<br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/vvvvvvvv.JPG\" style=\"width: 280px; height: 323px;\" /><br /><math><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mn>90</mn><mo>°</mo></mrow></mrow><mo>=</mo><mn>2</mn><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>θ</mi><mo>=</mo><mn>30</mn><mo>°</mo></math><br />Deviation<math><mo>=</mo><mn>60</mn><mo>°</mo></math><br />There are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math> such deviations therefore total deviation<math><mo>=</mo><mn>240</mn><mo>°</mo></math>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863325e50bc42484d7c", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "78", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If light travels a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math> in time <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>t</mi><mn>1</mn></msub></math>&nbsp;in air and <math><mn>10</mn><mi>x</mi></math> distance in time <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>t</mi><mn>2</mn></msub></math> in a certain medium, then find the critical angle for total internal reflection, of the medium.", "image": null}, "options": [{"id": "wIN0D", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><msup><mi mathvariant=\"normal\">n</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced separators=\"|\"><mfrac><mrow><mn>20</mn><msub><mi>t</mi><mn>1</mn></msub></mrow><msub><mi>t</mi><mn>2</mn></msub></mfrac></mfenced></math>", "image": null, "isCorrect": false}, {"id": "3s2jd", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><msup><mi mathvariant=\"normal\">n</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced separators=\"|\"><mfrac><mrow><mn>10</mn><msub><mi>t</mi><mn>1</mn></msub></mrow><msub><mi>t</mi><mn>2</mn></msub></mfrac></mfenced></math>", "image": null, "isCorrect": true}, {"id": "Km9M7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><msup><mi mathvariant=\"normal\">n</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced separators=\"|\"><mfrac><msub><mi>t</mi><mn>1</mn></msub><msub><mi>t</mi><mn>2</mn></msub></mfrac></mfenced></math>", "image": null, "isCorrect": false}, {"id": "S125V", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><msup><mi mathvariant=\"normal\">n</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced separators=\"|\"><mfrac><msub><mi>t</mi><mn>2</mn></msub><mrow><mn>10</mn><msub><mi>t</mi><mn>1</mn></msub></mrow></mfrac></mfenced></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#956;</mi><mo>=</mo><mfrac><mfrac><mi>x</mi><msub><mi>t</mi><mn>1</mn></msub></mfrac><mfrac><mrow><mn>10</mn><mi>x</mi></mrow><msub><mi>t</mi><mn>2</mn></msub></mfrac></mfrac><mo>=</mo><mfrac><msub><mi>t</mi><mn>2</mn></msub><mrow><mn>10</mn><msub><mi>t</mi><mn>1</mn></msub></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>sin</mi><mo>&#8289;</mo><msub><mi mathvariant=\"normal\">&#952;</mi><mi mathvariant=\"normal\">c</mi></msub><mo>=</mo><mfrac><mn>1</mn><mrow><msub><mi>t</mi><mn>2</mn></msub><mo>/</mo><mn>10</mn><msub><mi>t</mi><mn>1</mn></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>10</mn><msub><mi>t</mi><mn>1</mn></msub></mrow><msub><mi>t</mi><mn>2</mn></msub></mfrac><mo>&#8658;</mo><msub><mi mathvariant=\"normal\">&#952;</mi><mi mathvariant=\"normal\">c</mi></msub><mo>=</mo><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><msup><mi mathvariant=\"normal\">n</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced separators=\"|\"><mfrac><mrow><mn>10</mn><msub><mi>t</mi><mn>1</mn></msub></mrow><msub><mi>t</mi><mn>2</mn></msub></mfrac></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632773444148e1658f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "75", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "What is the required condition, if the light incident on one face of a prism, does not emerge from the other face?", "image": null}, "options": [{"id": "bkTxn", "text": "<math><mi>n</mi><mo>&lt;</mo><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">c</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "ixJYO", "text": "<math><mi>n</mi><mo>&lt;</mo><mrow><mrow><mi mathvariant=\"normal\">sec</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "vTvgU", "text": "<math><mi>n</mi><mo>&gt;</mo><mrow><mrow><mi mathvariant=\"normal\">sec</mi></mrow><mo>⁡</mo><mrow><mi>A</mi></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "9m3FT", "text": "<math><mi>n</mi><mo>&gt;</mo><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">c</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Consider the situation shown in figure.<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/374716.PNG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 213px; height: 157px;\" /><br /><br />Light rays <math> <mrow>  <mi>P</mi><mi>Q</mi></mrow></math> is incident on the face <math> <mrow>  <mi>A</mi><mi>B</mi></mrow></math>. It goes along <math> <mrow>  <mi>Q</mi><mi>R</mi></mrow></math> and then along <math> <mrow>  <mi>R</mi><mi>S</mi></mrow></math>.<br /><br />Here,<br /><br /><math><mi>i</mi><mo>=</mo></math> angle of incidence at the face <math><mi>A</mi><mi>B</mi></math><br /><br /><math><msub><mrow><mi>r</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo></math> angle of refraction through <math><mi>A</mi><mi>B</mi></math><br /><br /><math><msub><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo></math> angle of incidence at <math><mi>A</mi><mi>C</mi></math><br /><br /><math><mi>n</mi><mo>=</mo></math> refractive index of the material of the prims.<br /><br />For the prism, we have<br /><br /><math><msub><mrow><mi>r</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mi>A</mi></math> .....(i)<br /><br />Now for light not to emerge from the face <math><mi>A</mi><mi>C</mi><mo>,</mo></math><br /><br /><math><msub><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>&gt;</mo><mi>C</mi></math><br /><br />Similarly for no emergence from the face <math><mi>A</mi><mi>B</mi><mo>,</mo></math><br /><br /><math><msub><mrow><mi>r</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>&gt;</mo><mi>C</mi></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>r</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>&gt;</mo><mn>2</mn><mi>C</mi></math><br /><br />Here, <math><mi>C</mi></math> is critical angle.<br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>A</mi><mo>&gt;</mo><mn>2</mn><mi>C</mi></math> <math><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mo>∵</mo><mi>&nbsp;</mi><msub><mrow><mi>r</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mi>A</mi></mrow></mfenced></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>&gt;</mo><mi>C</mi></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mfrac><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mrow><mo>&gt;</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>C</mi></mrow></mrow></math><br /><br /><math><mo>⇒</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mfrac><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mrow><mo>&gt;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>n</mi></mrow></mfrac></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>n</mi><mo>&gt;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mfrac><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mrow></mrow></mfrac></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>n</mi><mo>&gt;</mo><mi>cosec</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863275ec7cd4ac9649f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "14", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A glass prism is immeresed in water as shown in the figure. When a&nbsp;beam of light incident is incident normally on&nbsp;the face <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ab</mi></math>, it is internally reflected at the face <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ad</mi></math>. If the&nbsp;refractive index of glass is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>5</mn></math>&nbsp;and that of water&nbsp;is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac bevelled=\"true\"><mn>4</mn><mn>3</mn></mfrac></math>, then<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0629608.jpg\" style=\"width: 186px; height: 140px;\" /></p>", "image": null}, "options": [{"id": "MmHVz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>sin</mi><mi>&#952;</mi><mo>&#60;</mo><mo>(</mo><mn>2</mn><mo>/</mo><mn>3</mn><mo>)</mo></math>", "image": null, "isCorrect": false}, {"id": "0Hnkl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>sin</mi><mi>&#952;</mi><mo>&#62;</mo><mo>(</mo><mn>8</mn><mo>/</mo><mn>9</mn><mo>)</mo></math>", "image": null, "isCorrect": true}, {"id": "jqL6L", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>2</mn><mo>/</mo><mn>3</mn><mo>)</mo><mo>&#60;</mo><mi>sin</mi><mi>&#952;</mi><mo>&#60;</mo><mo>(</mo><mn>8</mn><mo>/</mo><mn>9</mn><mo>)</mo></math>", "image": null, "isCorrect": false}, {"id": "Z19OS", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi><mo>&#62;</mo><msub><mi>&#952;</mi><mi>c</mi></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>sin</mi><mi>&#952;</mi><mo>&#62;</mo><mi>sin</mi><msub><mi>&#952;</mi><mi>c</mi></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>sin</mi><mi>&#952;</mi><mo>&#62;</mo><mfrac><mn>8</mn><mn>9</mn></mfrac><mo>.</mo></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86314444ca3b7cfa5cc", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "58", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A light ray is incident on the lower medium boundary at an angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>°</mo></math> with the normal. Which of the following statements is true?<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029938_Question.jpg\" style=\"width: 170px; height: 131px;\" />", "image": null}, "options": [{"id": "RpfgU", "text": "If <math> <mrow> <msub> <mi>μ</mi> <mn>2</mn> </msub> <mo>&gt;</mo> <mn>2</mn> </mrow> </math>&nbsp;,then total deviation is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>°</mo></math>", "image": null, "isCorrect": true}, {"id": "Gfqwv", "text": "If <math> <mrow> <msub> <mi>&#956;</mi> <mn>2</mn> </msub> <mo>&#60;</mo> <mn>2</mn> </mrow> </math>&nbsp;, then total deviation is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&#176;</mo></math>", "image": null, "isCorrect": false}, {"id": "1W57i", "text": "If <math> <mrow> <msub> <mi>&#956;</mi> <mn>2</mn> </msub> <mo>&#62;</mo> <mn>2</mn> </mrow> </math>&nbsp;,then total deviation is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>120</mn><mo>&#176;</mo></math>", "image": null, "isCorrect": false}, {"id": "WWi71", "text": "If <math> <mrow> <msub> <mi>&#956;</mi> <mn>2</mn> </msub> <mo>&#60;</mo> <mn>2</mn> </mrow> </math>&nbsp;,then total deviation is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>180</mn><mo>&#176;</mo></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For&nbsp;&nbsp;&nbsp; T.I.R. at A<br /><br /><math> <mrow> <mn>4</mn> <mo>sin</mo> <mn>3</mn> <msup> <mn>0</mn> <mo>∘</mo> </msup> <mo>=</mo> <msub> <mi>μ</mi> <mn>2</mn> </msub> <mo>sin</mo> <mn>9</mn> <msup> <mn>0</mn> <mo>∘</mo> </msup> </mrow> </math><br /><br /><math> <mrow> <msub> <mi>μ</mi> <mn>2</mn> </msub> <mo>=</mo> <mn>2</mn> </mrow> </math><br /><br /><strong>Case -I</strong><br /><br />If <math> <mrow> <msub> <mi>μ</mi> <mn>2</mn> </msub> <mo>&lt;</mo> <mn>2</mn> </mrow> </math>, then always T.I.R. takes place and in this situation angle of deviation is 120<sup>o</sup>.<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029938_Ans_1.jpg\" style=\"width: 190px; height: 149px;\" /><br /><br /><strong>Case-II</strong><br /><br /><math> <mrow> <msub> <mi>μ</mi> <mn>2</mn> </msub> <mo>&gt;</mo> <mn>2</mn> </mrow> </math>, then for the given angle of incidence no. T.I.R takes place at A, so light strikes on interface B for T.I.R.<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0029938_Ans_2.jpg\" style=\"width: 206px; height: 180px;\" /><br /><br /><math> <mrow> <msub> <mi>μ</mi> <mn>2</mn> </msub> <mo>sin</mo> <mi>α</mi> <mo>=</mo> <mn>2</mn> <mo>sin</mo> <mn>9</mn> <msup> <mn>0</mn> <mo>∘</mo> </msup> </mrow> </math><br /><br />or&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msub> <mi>μ</mi> <mn>2</mn> </msub> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> </mrow> <mrow> <mo>sin</mo> <mi>α</mi> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>sin</mo> <mi>α</mi> <mo>&lt;</mo> <mn>1</mn> </mrow> </math><br /><br /><math> <mrow> <msub> <mi>μ</mi> <mn>2</mn> </msub> <mo>&gt;</mo> <mn>2</mn> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863106fedefdcd17bef", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "24", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A ray of light is incident from a denser to a rarer medium. The critical angle for total internal reflection is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">θ</mi><mtext>iC</mtext></msub></math>&nbsp;and Brewster's angle of incidence is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">θ</mi><mtext>iB</mtext></msub></math>,&nbsp;such that <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mtext>sin</mtext><msub><mi mathvariant=\"normal\">θ</mi><mtext>iC</mtext></msub></mrow><mrow><mtext>sin</mtext><msub><mi mathvariant=\"normal\">θ</mi><mtext>iB</mtext></msub></mrow></mfrac><mo>=</mo><mi mathvariant=\"normal\">η</mi><mo>=</mo><mn>1</mn><mtext>.</mtext><mn>28</mn></math>.&nbsp;The relative refractive index of the two media is", "image": null}, "options": [{"id": "5BuyZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>0.4</mtext></math>", "image": null, "isCorrect": false}, {"id": "pRI0v", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>0.2</mtext></math>", "image": null, "isCorrect": false}, {"id": "M6Bzq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>0.9</mtext></math>", "image": null, "isCorrect": false}, {"id": "K7N6w", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>0.8</mtext></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">&#956;</mi><mn>1</mn></msub><mo>:</mo></math> refractive index of rarer medium<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">&#956;</mi><mn>2</mn></msub><mo>:</mo></math> retractive index of denser medium<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>sin&#952;</mi><mi mathvariant=\"normal\">C</mi></msub><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">&#956;</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">&#956;</mi><mn>2</mn></msub></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>tan&#952;</mi><mi mathvariant=\"normal\">B</mi></msub><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">&#956;</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">&#956;</mi><mn>2</mn></msub></mfrac></math><br /><br /><math> <mrow> <mi>sin</mi><msub> <mi>&#952;</mi> <mi>C</mi> </msub> <mo>=</mo><mi>tan</mi><msub> <mi>&#952;</mi> <mi>B</mi> </msub> </mrow> </math><br /><br /><math> <mrow> <mfrac> <mrow> <mi>sin</mi><msub> <mi>&#952;</mi> <mi>C</mi> </msub> </mrow> <mrow> <mi>sin</mi><msub> <mi>&#952;</mi> <mi>B</mi> </msub> </mrow> </mfrac> <mo>=</mo><mfrac> <mrow> <mi>tan</mi><msub> <mi>&#952;</mi> <mi>B</mi> </msub> </mrow> <mrow> <mi>sin</mi><msub> <mi>&#952;</mi> <mi>B</mi> </msub> </mrow> </mfrac> <mo>=</mo><mfrac> <mn>1</mn> <mrow> <mi>cos</mi><msub> <mi>&#952;</mi> <mi>B</mi> </msub> </mrow> </mfrac> <mo>=</mo><mn>1.28</mn></mrow> </math><br /><br /><math> <mrow> <mi>tan</mi><msub> <mi>&#952;</mi> <mi>B</mi> </msub> <mo>=</mo><mfrac> <mrow> <msub> <mi>&#956;</mi> <mn>1</mn> </msub> </mrow> <mrow> <msub> <mi>&#956;</mi> <mn>2</mn> </msub> </mrow> </mfrac> <mo>=</mo><mfrac> <mrow> <msqrt> <mrow> <mn>1</mn><mo>&#8722;</mo><msup> <mrow> <mrow><mo>(</mo> <mrow> <mfrac> <mn>1</mn> <mrow> <mn>1.28</mn></mrow> </mfrac> </mrow> <mo>)</mo></mrow></mrow> <mn>2</mn> </msup> </mrow> </msqrt> </mrow> <mrow> <mrow><mo>(</mo> <mrow> <mfrac> <mn>1</mn> <mrow> <mn>1.28</mn></mrow> </mfrac> </mrow> <mo>)</mo></mrow></mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>=</mo><mn>0.8</mn></mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630e11c1ef8f7fb743", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "88", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Secondary rainbow in the atmosphere is", "image": null}, "options": [{"id": "lCbII", "text": "the result of polarization and dispersion of light", "image": null, "isCorrect": false}, {"id": "y2hDa", "text": "brighter than the primary rainbow", "image": null, "isCorrect": false}, {"id": "1JEUp", "text": "due to the phenomenon of double refraction", "image": null, "isCorrect": false}, {"id": "UFuYW", "text": "formed due to two reflections in the rain drop", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Secondary rainbow in the atmosphere is formed due to two or double reflection in rain drops, suspended in clouds.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630baa81eb08f4107a", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "53", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A rectangular tank filled with some liquid is accelerated along a horizontal surface at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>40</mn><mn>3</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>. Inside the liquid, a laser pointer is fixed a the centre of the tank which shoots a thin laser beam in the vertically upward direction. If after refraction from the liquid surface, the laser beam moves along the surface of the liquid, then what is the refractive index of the liquid?", "image": null}, "options": [], "correctValue": "1.25", "solution": {"text": "<p><u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/KT0000325_AnsExp1_1.jpg\" style=\"width: 256px; height: 327px;\" /></strong></u><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/KT0000325_AnsExp1_2.jpg\" style=\"width: 250px; height: 324px;\" /><br />Due to the pseudo force, the free surface of the liquid will become inclined. If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi></math>&nbsp;is the angle made by the free surface of the liquid with the horizontal, then</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>tan</mi><mi>&#952;</mi><mo>=</mo><mfrac><mi>a</mi><mi>g</mi></mfrac><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>sin</mi><mi>&#952;</mi><mo>=</mo><mfrac><mn>4</mn><mn>5</mn></mfrac></math></p><p>Using snell&#39;s law we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#956;</mi><mo>&#160;</mo><mi>sin</mi><mi>&#952;</mi><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#956;</mi><mo>=</mo><mfrac><mn>1</mn><mrow><mi>sin</mi><mi>&#952;</mi></mrow></mfrac><mo>=</mo><mfrac><mn>5</mn><mn>4</mn></mfrac><mo>=</mo><mn>1</mn><mo>.</mo><mn>25</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86307d72796a1f4225b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "46", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A ray of light travelling in a denser medium strikes the boundary of a rarer medium. The ray gets partially reflected and refracted. The angle of reflection is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math> and that of refraction is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>r</mi><mo>'</mo></msup></math>. If the reflected and refracted rays make an angle of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>90</mn><mo>°</mo></math>&nbsp;with each other then the critical&nbsp;angle for the pair of media is", "image": null}, "options": [{"id": "QJCag", "text": "sin<sup>-1</sup> (tan r)", "image": null, "isCorrect": true}, {"id": "C0XpC", "text": "tan<sup>-1</sup> i mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">h</mi></mrow><mrow><mi>μ</mi></mrow></mfrac></math><br /><br />But, <math><mi>μ</mi><mo>∝</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>λ</mi></mrow></mfrac><mi>&nbsp;</mi><mi>&nbsp;</mi><mo>∵</mo><msub><mrow><mi>λ</mi></mrow><mrow><mi>v</mi></mrow></msub><mo>&lt;</mo><msub><mrow><mi>λ</mi></mrow><mrow><mi>g</mi></mrow></msub><mo>&lt;</mo><msub><mrow><mi>λ</mi></mrow><mrow><mi>y</mi></mrow></msub><mo>&lt;</mo><msub><mrow><mi>λ</mi></mrow><mrow><mi>r</mi></mrow></msub></math><br /><br />Thus, <math><msub><mrow><mi>μ</mi></mrow><mrow><mi>v</mi></mrow></msub></math> is greater to all of them<br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi></math> Apparent depth is minimum for violet.<br /><br />It means that the violet letter appear raised more.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c18eb41749ddefc6", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "03", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Consider the situation shown in the figure. Here&nbsp;<math><mrow><mi>θ </mi> </mrow> </math> is the maximum angle for which the light suffers total internal reflection at the vertical surface. Then&nbsp;<math><mrow><mi>sin</mi><mi>θ </mi></mrow></math> will be:-<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013259_AnsExp1_1.jpg\" style=\"width: 180px; height: 230px;\" />", "image": null}, "options": [], "correctValue": "00.75", "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0013259_AnsExp1_1.jpg\" style=\"width: 180px; height: 230px;\" /><br />The critical angle for this case is<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msup> <mi>θ</mi> <mo>″</mo> </msup> <mo>=</mo>&nbsp; <msup> <mtext>sin</mtext> <mn>-1</mn> </msup> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>1</mn> <mtext>.</mtext> <mn>2</mn> <mn>5</mn> </mrow> </mfrac> <mo>=</mo> <msup> <mtext>sin</mtext> <mn>-1&nbsp;</mn> </msup> <mfrac> <mrow> <mn>4</mn> </mrow> <mrow> <mn>5</mn> </mrow> </mfrac> </mrow> </math><br /><br />or,&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext>sin</mtext> <msup> <mi>θ</mi> <mo>″</mo> </msup> <mo>=</mo> <mfrac> <mrow> <mn>4</mn> </mrow> <mrow> <mn>5</mn> </mrow> </mfrac> </mrow> </math><br /><br />Since&nbsp;&nbsp; <math> <mrow> <msup> <mi>θ</mi> <mo>″</mo> </msup> <mo>=</mo> <mfrac> <mrow> <mi>π</mi> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>-</mo> <msup> <mi>θ</mi> <mo>′</mo> </msup> <mtext>,</mtext> </mrow> </math>&nbsp; we have <math> <mrow> <mtext>sin</mtext> <msup> <mi>θ</mi> <mo>′</mo> </msup> <mo>=</mo> <mtext>cos</mtext> <msup> <mi>θ</mi> <mo>″</mo> </msup> <mo>=</mo> <mn>3</mn> <mo>/</mo> <mn>5</mn> <mtext>.</mtext> </mrow> </math> From Snell's law,<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math> <mrow> <mfrac> <mrow> <mtext>sin&nbsp;</mtext> <mi>θ</mi> </mrow> <mrow> <mtext>sin&nbsp;</mtext> <msup> <mi>θ</mi> <mo>′</mo> </msup> </mrow> </mfrac> <mo>=</mo> <mn>1</mn> <mtext>.</mtext> <mn>2</mn> <mn>5</mn> </mrow> </math><br /><br />or,&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext>sin</mtext> <mi>θ</mi> <mo>=</mo> <mn>1</mn> <mtext>.</mtext> <mn>2</mn> <mn>5</mn> <mo>×</mo> <mtext>sin</mtext> <msup> <mi>θ</mi> <mo>′</mo> </msup> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;& s=\"http://www.w3.org/1998/Math/MathML\"><mi>θ</mi><mo mathvariant=\"italic\">&lt;</mo><msup><mi>sin</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msqrt><mfrac><msubsup><mi>μ</mi><mn>2</mn><mn>2</mn></msubsup><msubsup><mi>μ</mi><mn>1</mn><mn>2</mn></msubsup></mfrac><mo>-</mo><mn>1</mn></msqrt></math>", "image": null, "isCorrect": true}, {"id": "GYoU9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi><mo mathvariant=\"italic\">&#62;</mo><msup><mi>sin</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfrac><msub><mi>&#956;</mi><mn>1</mn></msub><msub><mi>&#956;</mi><mn>2</mn></msub></mfrac></math>", "image": null, "isCorrect": false}, {"id": "NDSJK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi><mo mathvariant=\"italic\">&#60;</mo><msup><mi>sin</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfrac><msub><mi>&#956;</mi><mn>1</mn></msub><msub><mi>&#956;</mi><mn>2</mn></msub></mfrac></math>", "image": null, "isCorrect": false}, {"id": "aqs33", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi><mo mathvariant=\"italic\">&#62;</mo><msup><mi>sin</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msqrt><mfrac><msubsup><mi>&#956;</mi><mn>2</mn><mn>2</mn></msubsup><msubsup><mi>&#956;</mi><mn>1</mn><mn>2</mn></msubsup></mfrac><mo>-</mo><mn>1</mn></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/0459979_sol.JPG\" style=\"width: 180px; height: 170px;\" /></p><p>At surface (1)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>μ</mi><mn>1</mn></msub><mi>sin</mi><mi>θ</mi><mo>=</mo><msub><mi>μ</mi><mn>2</mn></msub><mi>sin</mi><mi>r</mi><mi>&nbsp;</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>…</mo><mfenced separators=\"|\"><mn>1</mn></mfenced></math><br /><br />At surface (2)<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>μ</mi><mn>1</mn></msub><mo>=</mo><msub><mi>μ</mi><mn>2</mn></msub><mi>sin</mi><mfenced separators=\"|\"><mrow><mn>90</mn><mo>-</mo><mi>r</mi></mrow></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>μ</mi><mn>1</mn></msub><mo>=</mo><msub><mi>μ</mi><mn>2</mn></msub><mi>cos</mi><mi>r</mi><mo>&nbsp;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mn>2</mn><mo>)</mo></math><br /><br />From equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>1</mn><mo>)</mo></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>2</mn><mo>)</mo></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo mathvariant=\"italic\">⇒</mo><mi>sin</mi><mo mathvariant=\"italic\">⁡</mo><mi>θ</mi><mo mathvariant=\"italic\">=</mo><mfrac><mrow><mi>sin</mi><mo>⁡</mo><mi>r</mi></mrow><mrow><mi>cos</mi><mo mathvariant=\"italic\">⁡</mo><mi>r</mi></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>sin</mi><mi>θ</mi><mo>=</mo><mfrac><mfrac><mfenced separators=\"|\"><msqrt><msubsup><mi>μ</mi><mn>2</mn><mn>2</mn></msubsup><mo>-</mo><msubsup><mi>μ</mi><mn>1</mn><mn>2</mn></msubsup></msqrt></mfenced><msub><mi>μ</mi><mn>2</mn></msub></mfrac><mfenced separators=\"|\"><mfrac><msub><mi>μ</mi><mn>1</mn></msub><msub><mi>μ</mi><mn>2</mn></msub></mfrac></mfenced></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>sin</mi><mi>θ</mi><mo>=</mo><msqrt><mfrac><msubsup><mi>μ</mi><mn>2</mn><mn>2</mn></msubsup><msubsup><mi>μ</mi><mn>1</mn><mn>2</mn></msubsup></mfrac><mo>-</mo><mn>1</mn><mi mathvariant=\"normal\">&nbsp;</mi></msqrt></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>θ</mi></math>&nbsp;must satisfy,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>θ</mi><mo mathvariant=\"italic\">&lt;</mo><msup><mi>sin</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced separators=\"|\"><msqrt><mfrac><msubsup><mi>μ</mi><mn>2</mn><mn>2</mn></msubsup><msubsup><mi>μ</mi><mn>1</mn><mn>2</mn></msubsup></mfrac><mo>-</mo><mn>1</mn></msqrt></mfenced></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637de8ecd942466523", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "34", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A spherical mirror is placed&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi>cm</mi></math> below the level of water. A point object is placed in air&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&nbsp;</mo><mi>cm</mi></math> above the water surface on the axis of the mirror such that two images seen by an observer above the water surface coincide. The images are formed by partial reflection at the water surface and due to emerging light after reflection from the mirror. Find the focal length of the mirror. (&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">μ</mi><mtext>water</mtext></msub><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac></math>&nbsp;)", "image": null}, "options": [{"id": "I6HJB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>1</mn><mn>0</mn><mn>0</mn></mrow><mn>3</mn></mfrac><mo>&#160;</mo><mtext>cm</mtext></math>", "image": null, "isCorrect": false}, {"id": "QWfu7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>75</mn><mo>&nbsp;</mo><mi>cm</mi></math>", "image": null, "isCorrect": true}, {"id": "TYEeW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>1</mn><mn>1</mn><mn>0</mn></mrow><mn>8</mn></mfrac><mo>&#160;</mo><mtext>cm</mtext></math>", "image": null, "isCorrect": false}, {"id": "0Ip0A", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&#160;</mo><mi>cm</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/260423_qrghudfafasf.png\" style=\"width: 180px; height: 193px;\" /><br /><br />For partial reflection, the final image should be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&nbsp;</mo><mi>cm</mi></math> below water surface i.e.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mi>cm</mi></math> below the mirror.<p>For the image&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&nbsp;</mo><mi>cm</mi></math> below surface, its actual depth should be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>h</mtext><mo>=</mo><mn>3</mn><mn>0</mn><mfenced><mfrac><mn>4</mn><mn>3</mn></mfrac></mfenced><mo>=</mo><mn>4</mn><mn>0</mn><mo>cm</mo></math>&nbsp;below surface i.e. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&nbsp;</mo><mi>cm</mi></math>&nbsp;below the mirror<br /><br />For mirror,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>u</mtext><mo>=</mo><mo>-</mo><mfenced><mrow><mn>1</mn><mn>0</mn><mo>+</mo><mn>3</mn><mn>0</mn><mfenced><mfrac><mn>4</mn><mn>3</mn></mfrac></mfenced></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi mathvariant=\"normal\">u</mi><mo>=</mo><mo>-</mo><mn>50</mn><mo>&nbsp;</mo><mi>cm</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">v</mi><mo>=</mo><mn>30</mn><mo>&nbsp;</mo><mi>cm</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi mathvariant=\"normal\">f</mi></mfrac><mo>=</mo><mo>-</mo><mfrac><mn>1</mn><mn>50</mn></mfrac><mo>+</mo><mfrac><mn>1</mn><mn>30</mn></mfrac><mo>=</mo><mfrac><mrow><mn>-</mn><mn>3</mn><mo>+</mo><mn>5</mn></mrow><mn>10</mn></mfrac><mo>=</mo><mfrac><mn>2</mn><mn>150</mn></mfrac></math></p><p>or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">f</mi><mo>=</mo><mn>75</mn><mo>cm</mo></math>&nbsp;</p><p>convex mirror of focal length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>75</mn><mo>&nbsp;</mo><mi>cm</mi></math>.<br />&nbsp;</p><p>(diagram drawn was just for reference actually it should be a convex mirror but it was not known so we assumed concave but at final calculation, we found focal length +ve so it must be a convex mirror)</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863743cf7e62f272ba1", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "06", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A point source of light is placed at a distance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math> below the surface of a large deep lake. Neglecting the partial reflection of light during refraction, the percentage of light energy that escapes from the water surface is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>[</mo><msub><mi>μ</mi><mi>water</mi></msub><mo>=</mo><mfrac bevelled=\"true\"><mn>4</mn><mn>3</mn></mfrac><mo>]</mo></math>", "image": null}, "options": [{"id": "CtvsY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <mn>50</mn><mo>%</mo></mrow> </math>", "image": null, "isCorrect": false}, {"id": "w0Yfs", "text": "<ma
