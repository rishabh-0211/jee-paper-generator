i>θ</mi></mrow></mrow><mi> </mi><mi> </mi><mi> </mi><mi>a</mi><mi>n</mi><mi>d</mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi>b</mi><mo>=</mo><mi>r</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></math><br/><br/><math><mi>y</mi><mo>=</mo><mi>r</mi><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>ω</mi><mi>t</mi></mrow></mrow><mo>+</mo><mi>r</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>ω</mi><mi>t</mi></mrow></mrow></math><br/><br/><math><mo>=</mo><mi>r</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mo>(</mo><mi>ω</mi><mi>t</mi><mo>+</mo><mi>θ</mi><mo>)</mo></mrow></mrow></math><br/><br/><math><mo>∴</mo><mi> </mi><mi> </mi><mi> </mi><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup><mfenced separators=\"|\"><mrow><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>θ</mi><mo>+</mo><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></mrow></mrow></mrow></mfenced><mo>=</mo><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br/><br/>or   <math><mi>r</mi><mo>=</mo><msqrt><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636dadb4ccdccf6bb2", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "23", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The spring block system lies on a smooth horizontal surface. The free end of the spring is being pulled towards the right with constant speed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub><mo>=</mo><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. At <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">t</mi><mo>=</mo><mn>0</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">s</mi></math>, the spring of constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">k</mi><mo>=</mo><mn>100</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><mi mathvariant=\"normal\">c</mi><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> is unstretched and the block has a speed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> to left. The maximum extension of the spring will be<br />\r<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image39-eb366023-ff68-46ed-9dc2-2a9b1845126e.jpg\" />", "image": null}, "options": [{"id": "LGlEu", "text": "<math><mn>2&nbsp;</mn><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "RkWm6", "text": "<math><mn>4</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "jbpma", "text": "<math><mn>6</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": true}, {"id": "kFOKO", "text": "<math><mn>8</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In the frame (inertial w.r.t. earth) of the free end of spring, the initial velocity of the block is <math><mn>3&nbsp;</mn><mrow><mrow><mi mathvariant=\"normal\">m</mi></mrow><mo>/</mo><mrow><mi mathvariant=\"normal\">s</mi></mrow></mrow></math> to left and the spring is unstretched.<br /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image40-bbd67ba3-e913-4af6-ab83-564b57876558.jpg\" /><br /><br />Applying conservation of energy between initial and maximum extension state,<br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">m</mi><msup><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">k</mi><msup><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br /><math><mi mathvariant=\"normal\">A</mi><mo>=</mo><msqrt><mfrac><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mi mathvariant=\"normal\">k</mi></mrow></mfrac></msqrt><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">V</mi><mo>=</mo><msqrt><mfrac><mrow><mn>4</mn></mrow><mrow><mn>10000</mn></mrow></mfrac></msqrt><mo>×</mo><mn>3</mn><mo>=</mo><mn>6</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86360c784d6f46ef04d", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "93", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A simple harmonic wave of amplitude 8 unit travels along positive x-axis. At a given instant of time, for a particle at a distance of 10 cm from the origin, the displacement is + 6 unit and for a particle at a distance of 25 cm from the origin, the displacement is + 4 unit. What is the wavelength (in metre) of the wave?", "image": null}, "options": [], "correctValue": "0.25", "solution": {"text": "<math><mi>Y</mi><mo>=</mo><mi>A</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mfrac><mrow><mn>2</mn><mi>π</mi></mrow><mrow><mi>λ</mi></mrow></mfrac></mrow></mrow><mfenced separators=\"|\"><mrow><mi>v</mi><mi>t</mi><mo>-</mo><mi>x</mi></mrow></mfenced></math><br /><br /><math><mfrac><mrow><mi>Y</mi></mrow><mrow><mi>A</mi></mrow></mfrac><mo>=</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mn>2</mn><mi>π</mi></mrow></mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>t</mi></mrow><mrow><mi>T</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mi>x</mi></mrow><mrow><mi>λ</mi></mrow></mfrac></mrow></mfenced></math><br /><br />In first case, <math><mfrac><mrow><msub><mrow><mi>Y</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><mi>A</mi></mrow></mfrac><mo>=</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mn>2</mn><mi>π</mi></mrow></mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>t</mi></mrow><mrow><mi>T</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><msub><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><mi>λ</mi></mrow></mfrac></mrow></mfenced></math><br /><br />Here, <math><msub><mrow><mi>Y</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mo>+</mo><mi>&nbsp;</mi><mn>6</mn><mo>,</mo><mi>A</mi><mo>=</mo><mn>8</mn><mo>,</mo><msub><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>10</mn><mi>&nbsp;</mi><mi>c</mi><mi>m</mi></math><br /><br /><math><mfrac><mrow><mn>6</mn></mrow><mrow><mn>8</mn></mrow></mfrac><mo>=</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mn>2</mn><mi>π</mi></mrow></mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>t</mi></mrow><mrow><mi>T</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>10</mn></mrow><mrow><mi>λ</mi></mrow></mfrac></mrow></mfenced></math> .... (i)<br /><br />Similarly in the second case,<br /><br /><math><mfrac><mrow><mn>4</mn></mrow><mrow><mn>8</mn></mrow></mfrac><mo>=</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mn>2</mn><mi>π</mi></mrow></mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>t</mi></mrow><mrow><mi>T</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>25</mn></mrow><mrow><mi>λ</mi></mrow></mfrac></mrow></mfenced></math> ... (ii)<br /><br />From equation (i),<br /><br /><math><mi>2π​&nbsp;</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>t</mi></mrow><mrow><mi>T</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>10</mn></mrow><mrow><mi>λ</mi></mrow></mfrac></mrow></mfenced><mo>=</mo><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>6</mn></mrow><mrow><mn>8</mn></mrow></mfrac></mrow></mfenced></mrow></mrow><mo>=</mo><mn>0.85</mn><mi>&nbsp;</mi><mi>r</mi><mi>a</mi><mi>d</mi></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi></math> <math><mfrac><mrow><mi>t</mi></mrow><mrow><mi>T</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>10</mn></mrow><mrow><mi>λ</mi></mrow></mfrac><mo>=</mo><mn>0.14</mn></math> .... (iii)<br /><br />Similarly from equation (ii),<br /><br /><math><mn>2</mn><mi>π</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>t</mi></mrow><mrow><mi>T</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>25</mn></mrow><mrow><mi>λ</mi></mrow></mfrac></mrow></mfenced><mo>=</mo><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>4</mn></mrow><mrow><mn>8</mn></mrow></mfrac></mrow></mfenced></mrow></mrow><mo>=</mo><mfrac><mrow><mi>π</mi></mrow><mrow><mn>6</mn></mrow></mfrac><mi>&nbsp;</mi><mi>r</mi><mi>a</mi><mi>d</mi></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><mi>t</mi></mrow><mrow><mi>T</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>25</mn></mrow><mrow><mi>λ</mi></mrow></mfrac><mo>+​</mo><mn>0.08</mn></math> .... (iv)<br /><br />Subtracting equation (iv) from equation (iii), we get<br /><br /><math><mi>&nbsp;</mi><mi>&nbsp;</mi><mfrac><mrow><mn>15</mn></mrow><mrow><mi>λ</mi></mrow></mfrac><mo>=</mo><mn>0.06</mn></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>λ</mi><mo>=</mo><mn>0.25</mn><mi>&nbsp;</mi><mtext>m</mtext></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634bb05f9d47d562f9", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "24", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A spring of force constant&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> has a block of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi>kg</mi></math> hanging at its one end and the other end of the spring is attached to the ceiling of an elevator. The elevator is rising upwards with an acceleration of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">g</mi><mn>4</mn></mfrac></math>&nbsp;and the block is in equilibrium with respect to the elevator. When the acceleration of the elevator suddenly ceases, the block starts oscillating. What is the amplitude (in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math>) of these oscillations?", "image": null}, "options": [], "correctValue": "0.125", "solution": {"text": "When elevator is moving up, using NLM,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>−</mo><mi>mg</mi><mo>=</mo><mfrac><mi>mg</mi><mn>4</mn></mfrac><mo>⇒</mo><mi mathvariant=\"normal\">T</mi><mo>=</mo><mfrac><mrow><mn>5</mn><mi>mg</mi></mrow><mn>4</mn></mfrac></math><br />This tension elongates the spring by x,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>=</mo><mi>kx</mi><mo>⇒</mo><mtext>  </mtext><mi mathvariant=\"normal\">x</mi><mo>=</mo><mfrac><mrow><mn>5</mn><mi>mg</mi></mrow><mrow><mn>4</mn><mi mathvariant=\"normal\">k</mi></mrow></mfrac></math><br />The equilibrium position of the block is,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">x</mi><mn>0</mn></msub><mo>=</mo><mfrac><mi>mg</mi><mi mathvariant=\"normal\">k</mi></mfrac></math><br />So the amplitude is,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>=</mo><mi mathvariant=\"normal\">x</mi><mo>−</mo><msub><mi mathvariant=\"normal\">x</mi><mn>0</mn></msub><mo>=</mo><mfrac><mrow><mn>5</mn><mi>mg</mi></mrow><mrow><mn>4</mn><mi mathvariant=\"normal\">k</mi></mrow></mfrac><mo>−</mo><mfrac><mi>mg</mi><mi mathvariant=\"normal\">k</mi></mfrac><mo>=</mo><mfrac><mi>mg</mi><mn>4</mn></mfrac><mo>=</mo><mn>0</mn><mo>.125</mo><mtext>  </mtext><mi mathvariant=\"normal\">m</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634a363f8a00a39390", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "68", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The position and velocity of a particle executing simple harmonic motion at <math><mi>t</mi><mo>=</mo><mn>0</mn></math> are given by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3&nbsp;</mn><mi>cm</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8&nbsp;</mn><mi>cm</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> respectively. If the angular frequency of the particle is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi>rad</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>, then the amplitude of oscillation (in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>cm</mi></math>) &nbsp;is", "image": null}, "options": [{"id": "lOBPM", "text": "<math><mn>3</mn></math>", "image": null, "isCorrect": false}, {"id": "hIMdc", "text": "<math><mn>4</mn></math>", "image": null, "isCorrect": false}, {"id": "NFKC3", "text": "<math><mn>5</mn></math>", "image": null, "isCorrect": true}, {"id": "9Absc", "text": "<math><mn>6</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, the position and velocity of the particle executing <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>SHM</mi></math> .<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mn>3</mn><mi mathvariant=\"normal\">&#160;</mi><mi>cm</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mn>8</mn><mi>&#160;</mi><mi>cm</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br />Angular frequency, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#969;</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#160;</mi><mi>rad</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br />The velocity,<br /><br /><math><mi>v</mi><mo>=</mo><mi>&#969;</mi><msqrt><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup></msqrt></math><br /><br /><math><mn>8</mn><mo>=</mo><mn>2</mn><msqrt><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>3</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></msqrt></math><br /><br /><math><mn>4</mn><mo>=</mo><msqrt><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>3</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></msqrt></math><br /><br /><math><mn>16</mn><mo>=</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>9</mn></math><br /><br /><math><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>25</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mn>5</mn><mi mathvariant=\"normal\">&#160;</mi><mi>cm</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634508da32e9e96e70", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "96", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The figure shows a block of mass m resting on a horizontal smooth floor at a distance <math><mi>l</mi></math> from a rigid wall. Block is pushed toward the right by a distance <math><mfrac><mrow><mn>3</mn><mi>l</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math> and released from rest. When block passes from its mean position, another block of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mn>1</mn></msub></math> is gently placed on it which sticks to it due to friction. The value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mn>1</mn></msub></math> so that the combined block just touches the left wall is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>η</mi><mn>4</mn></mfrac><mi>m</mi></math>. Find the value of <math><mi mathvariant=\"normal\">η</mi></math>.<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/4e3c6699-d22f-409c-822c-3259e1a329a4-image17.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"height: 116px; width: 250px;\" />", "image": null}, "options": [], "correctValue": "5", "solution": {"text": "When block P is released from rest from a distance <math><mfrac><mrow><mn>3</mn><mi>l</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math> toward right from mean position, this will be the amplitude of oscillation so velocity of block when passing from its mean position is given as<br /><math><mi>v</mi><mo>=</mo><mi>A</mi><mi>ω</mi><mo>=</mo><mfrac><mrow><mn>3</mn><mi>l</mi></mrow><mrow><mn>2</mn></mrow></mfrac><msqrt><mfrac><mrow><mi>k</mi></mrow><mrow><mi>m</mi></mrow></mfrac></msqrt></math><br />If mass m<sub>1</sub> is added to it and just after if velocity of combined block becomes v<sub>1</sub>, from momentum conservation, we have<br />mv = (m + m<sub>1</sub>)v<sub>1</sub><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>v</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfrac><mrow><mi>m</mi></mrow><mrow><mi>m</mi><mo>+</mo><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>⋅</mo><mfrac><mrow><mn>3</mn><mi>l</mi></mrow><mrow><mn>2</mn></mrow></mfrac><msqrt><mfrac><mrow><mi>k</mi></mrow><mrow><mi>m</mi></mrow></mfrac></msqrt></math><br />If this is the velocity of combined block at mean position, it is given as<br /><math><msub><mrow><mi>v</mi></mrow><mrow><mn>1</mn></mrow></msub><mi>&nbsp;</mi><mo>=</mo><msub><mrow><mi>A</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">ω</mi></mrow><mrow><mn>1</mn></mrow></msub></math> where <math><msub><mrow><mi>ω</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msqrt><mfrac><mrow><mi>k</mi></mrow><mrow><mi>m</mi><mo>+</mo><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></msqrt></math><br />where A<sub>1</sub> and <math><msub><mrow><mi mathvariant=\"normal\">ω</mi></mrow><mrow><mn>1</mn></mrow></msub></math> are the new amplitude and angular frequency of SHM of the block.<br />It is given that combined block just reaches the left wall.<br />Thus, the new amplitude of oscillation must be <math><mi>l</mi></math> . So, we have,<br /><math><mfrac><mrow><mi>m</mi></mrow><mrow><mi>m</mi><mo>+</mo><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>⋅</mo><mfrac><mrow><mn>3</mn><mi>l</mi></mrow><mrow><mn>2</mn></mrow></mfrac><msqrt><mfrac><mrow><mi>k</mi></mrow><mrow><mi>m</mi></mrow></mfrac></msqrt><mo>=</mo><mi>l</mi><msqrt><mfrac><mrow><mi>k</mi></mrow><mrow><mi>m</mi><mo>+</mo><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></msqrt></math><br />On solving, we get<br /><math><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mi>m</mi></math><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>n</mi><mo>=</mo><mn>5</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863413010c915c990dc", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "94", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A particle performing S.H.M. starts from the equilibrium position and its time period is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>16</mn></math> seconds. After <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math> seconds its velocity is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">π</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>.</mo></math> Amplitude of oscillation is <math><mfenced separators=\"|\"><mrow><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><msup><mrow><mn>45</mn></mrow><mrow><mi>o</mi></mrow></msup><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mo>√</mo><mn>2</mn></mrow></mfrac></mrow></mrow><mi></mi><mi></mi></mrow></mfenced></math>", "image": null}, "options": [{"id": "7VvBw", "text": "<math><mn>2</mn><msqrt><mn>2&nbsp;</mn></msqrt><mo>m</mo></math>", "image": null, "isCorrect": false}, {"id": "rzj3g", "text": "<math><mi></mi><mn>4</mn><msqrt><mn>2&nbsp;</mn></msqrt><mo>m</mo></math>", "image": null, "isCorrect": false}, {"id": "Bv5Wb", "text": "<math><mn>6</mn><msqrt><mn>2&nbsp;</mn></msqrt><mo>m</mo></math>", "image": null, "isCorrect": false}, {"id": "7E76O", "text": "<math><mi>&nbsp;</mi><mn>8</mn><msqrt><mn>2&nbsp;</mn></msqrt><mo>m</mo></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Displacement of the particle <math><mo>=</mo><mi>x</mi><mo>=</mo><mi>A</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>ω</mi><mi>t</mi></mrow></mrow></math><br /><br />The velocity of the particle <math><mo>=</mo><mi>v</mi><mo>=</mo><mfrac><mrow><mi>d</mi><mi>x</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mi>A</mi><mi>ω</mi><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>ω</mi><mi>t</mi></mrow></mrow></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mi>π</mi><mi>&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>,</mo><mi>&nbsp;</mi><mi>T</mi><mo>=</mo><mn>16</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">s</mi><mo>,</mo><mi>&nbsp;</mi><mi>ω</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>π</mi></mrow><mi>T</mi></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>π</mi></mrow><mn>16</mn></mfrac><mo>=</mo><mfrac><mi>π</mi><mn>8</mn></mfrac><mi mathvariant=\"normal\">&nbsp;</mi><mi>rad</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>π</mi><mo>=</mo><mi>A</mi><mo>×</mo><mfrac><mrow><mi>π</mi></mrow><mrow><mn>8</mn></mrow></mfrac><mo>×</mo><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mfrac><mrow><mi>π</mi></mrow><mrow><mn>8</mn></mrow></mfrac></mrow></mrow><mo>×</mo><mn>2</mn></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mn>1</mn><mo>=</mo><mfrac><mrow><mi>A</mi></mrow><mrow><mn>8</mn></mrow></mfrac><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mfrac><mrow><mi>π</mi></mrow><mrow><mn>4</mn></mrow></mfrac></mrow></mrow><mo>=</mo><mfrac><mrow><mi>A</mi></mrow><mrow><mn>8</mn></mrow></mfrac><mo>.</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mo>√</mo><mn>2</mn></mrow></mfrac></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>A</mi><mo>=</mo><mn>8</mn><msqrt><mn>2</mn><mi>&nbsp;</mi></msqrt><mo>m</mo></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633aab6923114434c4", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "11", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A wooden cylinder of mass <math> <mrow> <mtext>20&nbsp;g</mtext></mrow> </math> and area of cross-section <math> <mrow> <mtext>1</mtext><mtext> </mtext><msup> <mrow> <mtext>cm</mtext></mrow> <mn>2</mn> </msup> </mrow> </math>, having a piece of lead of mass <math> <mrow> <mn>60</mn><mtext> </mtext><mtext>g</mtext></mrow> </math> attached to its bottom, floats&nbsp;in water. The cylinder is depressed and then released. The frequency of oscillations is&nbsp;<!-- MathType@Translator@5@5@MathML2 (namespace attr).tdl@MathML 2.0 (namespace attr)@ --> <math> <mrow> <mfrac> <mtext>N</mtext> <mtext>π</mtext> </mfrac> <msup> <mn>s</mn> <mrow> <mo>−</mo><mn>1</mn></mrow></msup></mrow></math>. Find the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi></math>. [Neglect the volume of water displaced by the lead piece, take <!-- MathType@Translator@5@5@MathML2 (namespace attr).tdl@MathML 2.0 (namespace attr)@ --> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mo>=</mo><mn>9.8</mn><mtext> </mtext><msup><mtext>m/s</mtext><mtext>2</mtext></msup></math>, density of water&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>ρ</mi><mi mathvariant=\"normal\">w</mi></msub><mo>=</mo><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">g</mi><mo>&nbsp;</mo><msup><mi>cm</mi><mrow><mo>-</mo><mn>3</mn></mrow></msup></math>]<!-- MathType@End@5@5@ -->", "image": null}, "options": [], "correctValue": "1.75", "solution": {"text": "<p>Suppose that the loaded wooden block sinks upto a height h. Then,<br /><br />weight of water displaced by the block<br /><br />= weight of the block with lead<br /><br />If a is area of cross-section of the block and σ, the density of water, then<br /><br /><math> <mrow> <mi>a</mi> <mspace width=\"0.5em\"></mspace> <mi>h</mi><mo>⁡</mo> <mspace width=\"0.5em\"></mspace> <mi>σ</mi> <mspace width=\"0.5em\"></mspace> <mtext>g</mtext> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>M</mtext> <mo>+</mo> <mtext>m</mtext> </mrow> </mfenced> <mtext>g</mtext> </mrow> </math><br /><br /><math> <mrow> <mtext>or</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mi>h</mi><mo>⁡</mo> <mo>=</mo> <mfrac> <mrow> <mtext>M</mtext> <mo>+</mo> <mtext>m</mtext> </mrow> <mrow> <mi>a</mi> <mspace width=\"0.5em\"></mspace> <mi>σ</mi> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> <mn>0</mn> <mo>+</mo> <mn>6</mn> <mn>0</mn> </mrow> <mrow> <mn>1</mn> <mo>×</mo> <mn>1</mn> </mrow> </mfrac> <mo>=</mo> <mn>8</mn> <mn>0</mn> <mspace width=\"0.5em\"></mspace> <mtext>cm</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mo>∵</mo> <mtext>density of water</mtext> <mo>=</mo> <mn>1</mn><mtext>g</mtext><msup><mtext>cm</mtext> <mrow> <mo>-</mo> <mn>3</mn> </mrow> </msup> </mrow> </mfenced> </mrow> </math><br /><br />Now for small displacement '<math> <mi>x</mi></math>' from equilibrium<br /><br /><math> <mrow> <mi>σ</mi><mi>g</mi><mi>a</mi><mrow><mo>(</mo> <mrow> <mi>x</mi><mo>+</mo><mi>h</mi></mrow> <mo>)</mo></mrow><mo>−</mo><mrow><mo>(</mo> <mrow> <mi>M</mi><mo>+</mo><mi>m</mi></mrow> <mo>)</mo></mrow><mi>g</mi><mo>=</mo><mrow><mo>-(</mo> <mrow> <mi>M</mi><mo>+</mo><mi>m</mi></mrow> <mo>)</mo></mrow><mi>A</mi></mrow> </math><br /><br /><math> <mrow> <mi>σ</mi><mi>g</mi><mi>a</mi><mi>x</mi><mo>=</mo><mrow><mo>-(</mo> <mrow> <mi>M</mi><mo>+</mo><mi>m</mi></mrow> <mo>)</mo></mrow><mi>A</mi></mrow> </math><br /><br /><math> <mrow> <mi>A=-</mi><mfrac>&nbsp;<mrow><mi>σ</mi><mi>g</mi><mi>a</mi></mrow> <mrow> <mi>M</mi><mo>+</mo><mi>m</mi></mrow> </mfrac> <mi>x</mi></mrow> </math><br /><br /><math> <mi>f</mi><mo>=</mo><mfrac> <mn>1</mn> <mrow> <mn>2</mn><mi>π</mi></mrow> </mfrac> <msqrt> <mrow> <mfrac> <mi>g</mi> <mi>h</mi> </mfrac></mrow></msqrt></math><br /><br /><math> <mtext> </mtext><mtext> </mtext><mo>=</mo><mfrac> <mn>1</mn> <mrow> <mn>2</mn><mi>π</mi></mrow> </mfrac> <msqrt> <mrow> <mfrac> <mrow> <mn>980</mn></mrow> <mrow> <mn>80</mn></mrow> </mfrac></mrow></msqrt></math>&nbsp;<!-- MathType@Translator@5@5@MathML2 (namespace attr).tdl@MathML 2.0 (namespace attr)@ --> <math> <mrow> <mo>=</mo><mfrac> <mrow> <mn>1.75</mn></mrow> <mi>π</mi> </mfrac> <msup> <mtext>s</mtext> <mrow> <mo>−</mo><mn>1</mn></mrow> </msup> </mrow> </math> <!-- MathType@End@5@5@ --><br />&nbsp;</p><br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalSta /math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If a force&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi></math> is applied to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math>, say to the right, let A be the distance moved by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math>. If the system is released, it executes simple harmonic motion of amplitude <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>A</mi><mn>1</mn></msub></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>A</mi><mn>2</mn></msub></math> ae the extensions in springs <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>k</mi><mn>1</mn></msub></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>k</mi><mn>2</mn></msub></math>&nbsp;then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mo>(</mo><msub><mi>A</mi><mn>1</mn></msub><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><msub><mi>A</mi><mn>2</mn></msub><mo>)</mo></math> and<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><msub><mi>k</mi><mn>1</mn></msub><msub><mi>A</mi><mn>1</mn></msub><mo>=</mo><msub><mi>k</mi><mn>2</mn></msub><msub><mi>A</mi><mn>2</mn></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;&#160;&#160;&#160;&#160;&#160;&#160;</mo><msub><mi>A</mi><mn>1</mn></msub><mo>=</mo><mfrac><mi>F</mi><msub><mi>k</mi><mn>1</mn></msub></mfrac><msub><mtext>&#160;&#160;&#160;&#160;and&#160;&#160;&#160;&#160;A</mtext><mn>2</mn></msub><mo>=</mo><mfrac><mi>F</mi><msub><mi>k</mi><mn>2</mn></msub></mfrac></math>&nbsp;<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</mo><mi>A</mi><mo>=</mo><msub><mi>A</mi><mn>1</mn></msub><mo>+</mo><msub><mi>A</mi><mn>2</mn></msub> <mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>2</mn></mrow></msub></math> are performing SHM along the same line about the same mean position. Initially, they are at their positive extreme position. If the time period of each particle is 12 s and the difference of their amplitudes is 12 cm then find the minimum time (in seconds) after which the separation between the particles become 6 cm.", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "The <math> <mtext>x</mtext> </math> coordinates of the particles are<br /><br /><math><msub><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mn>1</mn></mrow></msub><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">ω</mi><mi mathvariant=\"normal\">t</mi><mo>,</mo><mi mathvariant=\"normal\">&nbsp;</mi><msub><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mrow><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">ω</mi><mi mathvariant=\"normal\">t</mi></mrow></mrow></math><br /><br />Separation <math><msub><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfenced separators=\"|\"><mrow><msub><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">ω</mi><mi mathvariant=\"normal\">t</mi></mrow></mrow><mo>=</mo><mn>12</mn><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">ω</mi><mi mathvariant=\"normal\">t</mi></mrow></mrow></math><br /><br />Now <math><msub><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>6</mn><mo>=</mo><mn>12</mn><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">ω</mi><mi mathvariant=\"normal\">t</mi></mrow></mrow></math><br /><br /><math><mo>⇒</mo><mi mathvariant=\"normal\">ω</mi><mi mathvariant=\"normal\">t</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">π</mi></mrow><mrow><mn>3</mn></mrow></mfrac><mo>⇒</mo><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">π</mi></mrow><mrow><mn>12</mn></mrow></mfrac> <mo>×</mo><mi mathvariant=\"normal\">t</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">π</mi></mrow><mrow><mn>3</mn></mrow></mfrac></math><br /><br /><math><mo>⇒</mo><mi mathvariant=\"normal\">t</mi><mo>=</mo><mn>2&nbsp;</mn><mi mathvariant=\"normal\">s</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631cece64c7dd641ca", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "56", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A cylinder of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><mo>=</mo><mn>2</mn><mo>&nbsp;</mo><mi>kg&nbsp;</mi></math>and radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>12</mn><mo>&nbsp;</mo><mi>cm</mi></math> lies on a plank of the same mass as shown in the figure. The surface between plank and ground is smooth but there is friction between cylinder and plank mrow><mrow><mi>g</mi></mrow></mfrac></msqrt></mrow></mfenced></math><br /><br /><math><mo>&#8658;</mo><msub><mrow><mi>N</mi></mrow><mrow><mi>S</mi></mrow></msub><mo>=</mo><mn>2</mn><msub><mrow><mi>N</mi></mrow><mrow><mi>L</mi></mrow></msub></math> i.e. if <math><mo>&#8658;</mo><msub><mrow><mi>N</mi></mrow><mrow><mi>L</mi></mrow></msub><mo>=</mo><mn>1</mn></math> <math><msub><mrow><mi>N</mi></mrow><mrow><mi>S</mi></mrow></msub><mo>=</mo><mn>2</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863175dc73018c23979", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "67", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mn>1</mn></msub><mo>=</mo><mn>1</mn><mo>&nbsp;</mo><mi>kg</mi></math> connected to a horizontal spring performs S.H.M. with amplitude <math><mi>A</mi></math>.&nbsp;While mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mn>1</mn></msub></math>&nbsp;is passing through mean position another mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mn>2</mn></msub><mo>=</mo><mn>3</mn><mo>&nbsp;</mo><mi>kg</mi></math> is placed on it so that both the masses move together with amplitude <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>A</mi><mn>1</mn></msub></math>. The ratio of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>A</mi><mn>1</mn></msub><mi>A</mi></mfrac></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mfrac><mi>p</mi><mi>q</mi></mfrac></mfenced><mfrac bevelled=\"true\"><mn>1</mn><mn>2</mn></mfrac>< <mi>s</mi></mrow></mfrac><mo>.</mo><mfrac><mrow><mi>d</mi><mi>s</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mi>v</mi><mo>×</mo><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>s</mi></mrow></mfrac></math> ... (ii)<br /><br />[by chain rule]<br /><br />Which in light of Equation. (i) i.e. <math><mi>v</mi><mo>=</mo><mi>s</mi><msqrt><mfrac><mrow><mn>2</mn><mi>a</mi></mrow><mrow><mi>m</mi></mrow></mfrac></msqrt></math> yields<br /><br /><math><msub><mrow><mi>a</mi></mrow><mrow><mi>t</mi></mrow></msub><mo>=</mo><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi>s</mi><msqrt><mfrac><mrow><mn>2</mn><mi>a</mi></mrow><mrow><mi>m</mi></mrow></mfrac></msqrt></mrow></mfenced><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><msqrt><mfrac><mrow><mn>2</mn><mi>a</mi></mrow><mrow><mi>m</mi></mrow></mfrac></msqrt></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>2</mn><mi>a</mi><mi>s</mi></mrow><mrow><mi>m</mi></mrow></mfrac></math> ... (iii)<br /><br />So that <math><mi>a</mi><mo>=</mo><msqrt><msubsup><mrow><mi>a</mi></mrow><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msubsup><mo>+</mo><msubsup><mrow><mi>a</mi></mrow><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msubsup></msqrt></math><br /><br /><math><mo>=</mo><msqrt><msup><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>2</mn><mi>a</mi><msup><mrow><mi>s</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>m</mi><mi>R</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>2</mn><mtext> </mtext><mi>a</mi><mi>s</mi></mrow><mrow><mi>m</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></msqrt><mi>&nbsp;</mi><mi>&nbsp;</mi></math><br /><br />Hence, <math><mi>a</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>a</mi><mi>s</mi></mrow><mrow><mi>m</mi></mrow></mfrac><msqrt><mn>1</mn><mo>+</mo><msup><mrow><mfenced close=\"]\" open=\"[\" sepa ow> <mn>4</mn> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e07cfb0c1a37f356", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "09", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two large insulating plates having surface charge densities <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>+</mo><mi>σ</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mi>σ</mi></math>&nbsp;are fixed some distance&nbsp;apart in a gravity-free region and two ideal insulating springs of force constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi></math>&nbsp;are connected to the plates as shown in the figure. A particle of charge <math> <mi>q</mi> </math>&nbsp;and mass <math> <mi>m</mi> </math>&nbsp;which is attached to the junction of the springs is released from rest, then the particle will cross its equilibrium position with a speed<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Q_12.jpg\" style=\"width: 255px; height: 198px;\" /><br />\r&nbsp;", "image": null}, "options": [{"id": "ip2MI", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mfrac><mrow><mi>q</mi><mi>&#x3C3;</mi></mrow><msub><mi>&#x3B5;</mi><mi>o</mi></msub></mfrac><msqrt><mfrac><mi>k</mi><mi>m</mi></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "GTpG5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mfrac><mrow><mi>q</mi><mi>σ</mi></mrow><msub><mi>ε</mi><mn>0</mn></msub></mfrac><msqrt><mfrac><mi>k</mi><mrow><mn>2</mn><mi>m</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "fLrKu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mfrac><mrow><mi>q</mi><mi>&#x3C3;</mi></mrow><msub><mi>&#x3B5;</mi><mn>0</mn></msub></mfrac><msqrt><mfrac><mrow><mn>2</mn><mi>k</mi></mrow><mi>m</mi></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "I5xHY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mfrac><mrow><mi>q</mi><mi>&#x3C3;</mi></mrow><mrow><mn>2</mn><msub><mi>&#x3B5;</mi><mn>0</mn></msub></mrow></mfrac><msqrt><mfrac><mi>k</mi><mi>m</mi></mfrac></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The electric field between plates is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mo>=</mo><mfrac><mi>σ</mi><msub><mi>ε</mi><mn>0</mn></msub></mfrac></math>&nbsp;(Constant)</p><p>The angular frequency of SHM doesn't&nbsp;change by a constant force, only the equilibrium position will be affected.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ω</mi><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mi>k</mi></mrow><mi>m</mi></mfrac></msqrt></math></p><p>The amplitude of SHM can be calculated by finding the distance of the equilibrium position from the rest position (starting position) of the particle.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>k</mi><mi>A</mi><mo>=</mo><mfrac><mrow><mi>q</mi><mi>σ</mi></mrow><msub><mi>ε</mi><mn>0</mn></msub></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>A</mi><mo>=</mo><mfrac><mrow><mi>q</mi><mi>σ</mi></mrow><mrow><mn>2</mn><mi>k</mi><msub><mi>ε</mi><mn>0</mn></msub></mrow></mfrac></math></p><p>So the particle will cross its equilibrium position with a speed</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mfrac><mrow><mi>q</mi><mi>σ</mi></mrow><msub><mi>ε</mi><mn>0</mn></msub></mfrac><msqrt><mfrac><mi>k</mi><mrow><mn>2</mn><mi>m</mi></mrow></mfrac></msqrt></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ceab70720b45784b", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "102", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A block of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi></math> is placed on a smooth horizontal surface and it is pulled by a light spring as shown in the diagram. If the ends A and B of the spring are moving with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> respectively and the rate at which spring energy is increasing is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. then what is the value of spring force (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">N</mi></math>)?<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0024635_Question_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 287px; height: 103px;\" />", "image": null}, "options": [], "correctValue": "10", "solution": {"text": "Let, distance moved by A and B in any time interval as measured from natural length of spring are xA and xB respectively. Let, <math> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>l</mi><mo>&#8289;</mo> </mrow> </math> is the natural length of spring, then elongation in spring at any instant is<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>x</mtext><mo>=</mo><mfenced><mrow><msub><mtext>x</mtext><mi mathvariant=\"normal\">A</mi></msub><mo>-</mo><msub><mtext>x</mtext><mi mathvariant=\"normal\">B</mi></msub><mo>-</mo><mi>l</mi><mo>&#8289;</mo></mrow></mfenced></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext>U</mtext> <mo>=</mo> <mfrac> <mrow> <msup> <mtext>kx</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow><mfrac><mrow><mtext>dU</mtext> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> <mo>=</mo> <mtext>P</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>k</mtext> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>&#215;</mo> <mn>2</mn> <mtext>x</mtext> <mfrac> <mrow> <mtext>dx</mtext> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>&#8658;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</mo> <mn>2</mn> <mn>0</mn> <mo>=</mo> <mtext>kx&#160;</mtext> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <msub> <mtext>v</mtext> <mtext>A</mtext> </msub> <mo>-</mo> <msub> <mtext>v</mtext> <mtext>B</mtext> </msub> </mrow> </mfenced> </mrow> </math><br /><br /><math> <mrow> <mo>&#8658;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</mo> <mtext>kx</mtext> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> <mn>0</mn> </mrow> <mrow> <mn>4</mn> <mo>-</mo> <mn>2</mn> </mrow> </mfrac> <mo>=</mo> <mn>1</mn> <mn>0&#160;</mn> <mtext>N</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c1c9563e95462815", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "03", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The displacement of a particle of mass <math> <mrow> <mtext>3&nbsp;g</mtext> </mrow> </math> executing simple harmonic motion is given by <math><mi>Y</mi><mo>=</mo><mn>3</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">sin</mi><mi mathvariant=\"normal\"></mi><mo>⁡</mo><mo>(</mo><mn>0.2</mn><mi>t</mi><mo>)</mo></math> in SI units. The <math> <mrow> <mtext>KE</mtext> </mrow> </math> of the particle at a point which is at a distance equal to <math> <mrow> <mtext>1/3</mtext> </mrow> </math> of its amplitude from its mean position is", "image": null}, "options": [{"id": "T9NIf", "text": "<math><mn>12</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><mi> </mi><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "P2lWi", "text": "<math><mn>25</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><mi> </mi><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "uxW8V", "text": "<math><mn>0.48</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><mi>&nbsp;</mi><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": true}, {"id": "arPAu", "text": "<math><mn>0.24</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><mi> </mi><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Displacement of particle in the case of SHM<br /><br /><math><mi>y</mi><mo>=</mo><mi>A</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mo>(</mo><mi>ω</mi><mi>t</mi><mo>)</mo></mrow></mrow></math> ...(i)<br /><br /><math><mi>y</mi><mo>=</mo><mn>3</mn><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mo>(</mo><mn>0.2</mn><mi>&nbsp;</mi><mi>t</mi><mo>)</mo></mrow></mrow></math> ...(ii)(given)<br /><br />Comparing Eqs. (i) and (ii), we get<br /><br /><math><mi>A</mi><mo>=</mo><mn>3</mn><mo>,</mo><mi>&nbsp;</mi><mi>ω</mi><mo>=</mo><mn>0.2</mn></math><br /><br />Now, particle distance <math><mi>x</mi><mo>=</mo><mfrac><mrow><mi>A</mi></mrow><mrow><mn>3</mn></mrow></mfrac><mo>=</mo><mn>1</mn></math><br /><br />Kinetic energy in SHM<br /><br />= <math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>m</mi><msup><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>(</mo><msup><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>)</mo></math><br /><br />= <math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>×</mo><mn>3</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><msup><mrow><mfenced separators=\"|\"><mrow><mn>0.2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>[</mo><msup><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msup><mo>]</mo></math><br /><br /><math><mo>=</mo><mn>0.48</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></math> J", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863bd3df041bd2f29bb", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "39", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An object of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi>kg</mi></math> executes simple harmonic oscillations along the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi></math>-axis, with a frequency of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mi>π</mi></mfrac><mo>&nbsp;</mo><mi mathvariant=\"normal\">H</mi><mi mathvariant=\"normal\">z</mi></math>. At the position <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>, the object has a kinetic energy of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>24</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi></math>. The amplitude of the oscillation is&nbsp;", "image": null}, "options": [{"id": "X4B4E", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>2</mn></mfrac><mo>&#xA0;</mo><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "QFy9b", "text": "<math><mn>2</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": true}, {"id": "c1Wvc", "text": "<math><mn>4</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "KPzml", "text": "<math><mn>8</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi><mo mathvariant=\"italic\">.</mo><mi>E</mi><mo mathvariant=\"italic\">.</mo><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><msup><mi>ω</mi><mn>2</mn></msup><mfenced separators=\"|\"><mrow><msup><mi>A</mi><mn>2</mn></msup><mo>-</mo><msup><mi>x</mi><mn>2</mn></msup></mrow></mfenced><mo>=</mo><mn>24</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">J</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>×</mo><mn>1</mn><mo>×</mo><mn>16</mn><mfenced separators=\"|\"><mrow><msup><mi>A</mi><mn>2</mn></msup><mo>-</mo><mn>1</mn></mrow></mfenced><mo>=</mo><mn>24</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639ea4eba68d8b988f", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "32", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>Two blocks <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Q</mi></math> of masses <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>0.3</mtext><mo>&nbsp;</mo><mi>kg</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>0.4</mtext><mo>&nbsp;</mo><mi>kg</mi></math> respectively are stuck to each other by some weak glue as shown in the figure. They hang together at the end of a spring with a spring constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">k</mi><mo>=</mo><mn>200</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">N< <mn>2</mn><mi>cos</mi><mi>&#969;</mi><msub><mi>t</mi><mn>0</mn></msub></math><br /><br /><math><mi>&#969;</mi><mo>=</mo><mi>&#160;</mi><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>t</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>&#8289;</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>a</mi><mo>+</mo><mi>c</mi></mrow><mrow><mn>2</mn><mi>b</mi></mrow></mfrac></mrow></mfenced><mi>&#160;</mi><mo>&#8658;</mo><mi>f</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><mi>&#960;</mi><msub><mrow><mi>t</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>&#8289;</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>a</mi><mo>+</mo><mi>c</mi></mrow><mrow><mn>2</mn><mi>b</mi></mrow></mfrac></mrow></mfenced></mrow></mrow></mrow></mrow></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863f42ea046b5df8010", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "42", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "As shown in the figure, a particle of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>=</mo><mn>100</mn><mo>&#160;</mo><mi>gm</mi></math>&nbsp;is attached with four identical springs, each of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi><mo>=</mo><mn>10</mn><mi>&#160;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>. Initial tension in each spring is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mn>0</mn></msub><mo>=</mo><mn>25</mn><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi></math>.&nbsp;Neglecting gravity, calculate the angular frequency (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>rad</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>) of small oscillations of the particle&nbsp;along a line perpendicular to the plane of the figure.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ph-28.png\" style=\"width: 200px; height: 160px;\" />", "image": null}, "options": [], "correctValue": "100", "solution": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ph-28-1.png\" style=\"width: 247px; height: 120px;\" /></p><p>For small&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>&nbsp;we can assume the tension in each spring to remain constant</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><mo>-</mo><mn>4</mn><msub><mi>F</mi><mn>0</mn></msub><mi>sin</mi><mo>&#8289;</mo><mi mathvariant=\"normal\">&#952;</mi><mo>&#8776;</mo><mo>-</mo><mfrac><mrow><mn>4</mn><msub><mi>F</mi><mn>0</mn></msub><mi>x</mi></mrow><mi>l</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mo>-</mo><mfrac><mrow><mn>4</mn><msub><mi>F</mi><mn>0</mn></msub></mrow><mrow><mi>m</mi><mi>l</mi></mrow></mfrac><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#969;</mi><mo>=</mo><msqrt><mfrac><mrow><mn>4</mn><msub><mi>F</mi><mn>0</mn></msub></mrow><mrow><mi>m</mi><mi>l</mi></mrow></mfrac></msqrt><mo>=</mo><mn>100</mn><mo>&#160;</mo><mi>rad</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br />&nbsp;</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863f30cf8d573e77a81", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "109", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Consider one dimensional motion of a particle of mass <math> <mi>m</mi> </math>. It has potential energy <math><mi>U</mi><mo>=</mo><mi>a</mi><mo>+</mo><mi>b</mi><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup></math>, where <math> <mi>a</mi> </math> and <math> <mi>b</mi> </math> are positive constants. At origin <math><mo>(</mo><mi>x</mi><mo>=</mo><mn>0</mn><mo>)</mo></math> it has initial velocity <math> <mrow> <msub> <mi>V</mi> <mn>0 </mn> </msub> </mrow> </math>. It performs simple harmonic oscillations. The frequency of the simple harmonic motion depends on", "image": null}, "options": [{"id": "SC9IZ", "text": "<math><mi>b</mi></math> and <math><mi>m</mi></math> alone", "image": null, "isCorrect": true}, {"id": "jWNQ5", "text": "<math><mi>b</mi><mo>,</mo><mi> </mi><mi>a</mi></math>  and  <math><mi>m</mi></math>  alone", "image": null, "isCorrect": false}, {"id": "wbiDH", "text": "<math><mi>b</mi></math>  alone", "image": null, "isCorrect": false}, {"id": "KfM3i", "text": "<math><mi>b</mi></math>  and  <math><mi>a</mi></math>  alone", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given,<br /><br />Potential energy, <math><mi>U</mi><mo>=</mo><mi>a</mi><mo>+</mo><mi>b</mi><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br />Force, <math><mi>F</mi><mo>=</mo><mo>-</mo><mfrac><mrow><mi>d</mi><mi>U</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac></math><br /><br /><math><mo>=</mo><mo>-</mo><mfrac><mrow><mi>d</mi><mo>.</mo><mo>(</mo><mi>a</mi><mo>+</mo><mi>b</mi><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>)</mo></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac></math><br /><br /><math><mo>=</mo><mo>-</mo><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mi>d</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mfenced separators=\"|\"><mrow><mi>a</mi></mrow></mfenced><mo>+</mo><mfrac><mrow><mi>d</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mo>(</mo><mi>b</mi><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>)</mo></mrow></mfenced></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>F</mi><mo>=</mo><mn>0</mn><mo>-</mo><mi>b</mi><mo>.</mo><mfrac><mrow><mi>d</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mo>(</mo><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>)</mo></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>F</mi><mo>=</mo><mn>0</mn><mo>-</mo><mi>b</mi><mo>.</mo><mn>2</mn><mi>x</mi><mo>=</mo><mo>-</mo><mn>2</mn><mi>b</mi><mi>x</mi></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>a</mi><mo>=</mo><mfrac><mrow><mi>F</mi></mrow><mrow><mi>m</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mfrac><mrow><mn>2</mn><mi>b</mi></mrow><mrow><mi>m</mi></mrow></mfrac><mi>x</mi></math> .......(i)<br /><br />Compare equation. (i) with the standard relation of displacement in case of simple harmonic motion.<br /><br />i.e., <math><mi>a</mi><mo>=</mo><mfrac><mrow><mi>F</mi></mrow><mrow><mn>2</mn><mi>m</mi></mrow></mfrac><mo>=</mo><mo>-</mo><msup><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>x</mi></math><br /><br />i.e., <math><msup><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>2</mn><mi>b</mi></mrow><mrow><mi>m</mi></mrow></mfrac></math><br /><br /><math><mi>ω</mi><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mi>b</mi></mrow><mrow><mi>m</mi></mrow></mfrac></msqrt></math><br /><br />i.e., the frequency of the simple harmonic motion depends on <math><mi>b</mi></math> and <math><mi>m</mi></math> alone.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863dea0a5cd12c374c5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "51", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A particle executes simple harmonic motion with a time period of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>16</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">s</mi></math>&nbsp;along the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>&nbsp;- axis.&nbsp;At time <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">s</mi></math>, the particle crosses the mean position while at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">s</mi></math>, the&nbsp;velocity of the particle is&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>+</mo><mo>&nbsp;</mo><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. The amplitude of motion (in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math>) is", "image": null}, "options": [{"id": "TSGJ2", "text": "<math><msqrt><mn>2</mn></msqrt><mi>π</mi></math>", "image": null, "isCorrect": false}, {"id": "rwnfn", "text": "<math><mn>16</mn><msqrt><mn>2</mn></msqrt><mi>π</mi></math>", "image": null, "isCorrect": false}, {"id": "vvjMc", "text": "<math><mn>24</mn><msqrt><mn>2</mn></msqrt><mi>π</mi></math>", "image": null, "isCorrect": false}, {"id": "wus2b", "text": "<math><mfrac><mrow><mn>32</mn><msqrt><mn>2</mn></msqrt></mrow><mrow><mi>π</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>The general equation of SHM is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mi>A</mi><mi>sin</mi><mfenced open=\"[\" close=\"]\"><mrow><mi>&#969;</mi><mi>t</mi><mo>+</mo><mi>&#981;</mi></mrow></mfenced></math>, here</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#969;</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>&#960;</mi></mrow><mn>16</mn></mfrac><mo>=</mo><mfrac><mi>&#960;</mi><mn>8</mn></mfrac><mo>&#160;</mo><mi>rad</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p><p>At&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>,&nbsp;the particle is at the mean position. Hence,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>=</mo><mi>A</mi><mi>sin</mi><mfenced open=\"[\" close=\"]\"><mrow><mfrac><mi>&#960;</mi><mn>8</mn></mfrac><mo>&#215;</mo><mn>2</mn><mo>+</mo><mi>&#981;</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#981;</mi><mo>=</mo><mo>-</mo><mfrac><mi>&#960;</mi><mn>4</mn></mfrac></math></p><p>So the equation of SHM will become</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mi>A</mi><mi>sin</mi><mfenced open=\"[\" close=\"]\"><mrow><mfrac><mi>&#960;</mi><mn>8</mn></mfrac><mi>t</mi><mo>-</mo><mfrac><mi>&#960;</mi><mn>4</mn></mfrac></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mfrac><mrow><mi>&#960;</mi><mi>A</mi></mrow><mn>8</mn></mfrac><mi>cos</mi><mfenced open=\"[\" close=\"]\"><mrow><mfrac><mi>&#960;</mi><mn>8</mn></mfrac><mi>t</mi><mo>-</mo><mfrac><mi>&#960;</mi><mn>4</mn></mfrac></mrow></mfenced></math></p><p>At&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mo>&#160;</mo><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>=</mo><mfrac><mrow><mi>&#960;</mi><mi>A</mi></mrow><mn>8</mn></mfrac><mi>cos</mi><mfenced open=\"[\" close=\"]\"><mrow><mfrac><mi>&#960;</mi><mn>8</mn></mfrac><mo>&#215;</mo><mn>4</mn><mo>-</mo><mfrac><mi>&#960;</mi><mn>4</mn></mfrac></mrow></mfenced><mspace linebreak=\"newline\"/></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>=</mo><mfrac><mrow><mi>&#960;</mi><mi>A</mi></mrow><mn>8</mn></mfrac><mi>cos</mi><mfenced open=\"[\" close=\"]\"><mfrac><mi>&#960;</mi><mn>4</mn></mfrac></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>A</mi><mo>=</mo><mfrac><mrow><mn>32</mn><msqrt><mn>2</mn></msqrt></mrow><mi>&#960;</mi></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mspace linebreak=\"newline\"/></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863de4e733893f216c3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "31", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The length of a simple pendulum executing simple harmonic motion is increased by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>21</mn><mo>%</mo></math>. The percentage increase in the time period of the pendulum of increased length is", "image": null}, "options": [{"id": "525U7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>11</mn><mo>%</mo></math>", "image": null, "isCorrect": false}, {"id": "P50LR", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>21</mn><mo>%</mo></math>", "image": null, "isCorrect": false}, {"id": "j45RW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>42</mn><mo>%</mo></math>", "image": null, "isCorrect": false}, {"id": "hr1TF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>%</mo></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>Let the lengths of the pendulum be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mtext>100</mtext><mtext mathvariant=\"italic\">l</mtext><mtext>)</mtext></math>&nbsp;&nbsp;and &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mtext>121</mtext><mtext mathvariant=\"italic\">l</mtext><mo>)</mo></math></p><p>Since we know the time period of a simple pendulum is given by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi><msqrt><mfrac><mi>l</mi><mi mathvariant=\"normal\">g</mi></mfrac></msqrt></math><br /><br /><math> <mrow> <mo>&#8756;</mo> </mrow> </math>&nbsp; &nbsp; &nbsp; &nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mtext>T</mtext><mo>'</mo></msup><mtext>T</mtext></mfrac><mo>=</mo><msqrt><mfrac><mn>121</mn><mtext>100</mtext></mfrac></msqrt><mo>=</mo><mfrac><mn>11</mn><mn>10</mn></mfrac></math><br /><br /><math> <mrow> <mo>&#8756;</mo> </mrow> </math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp; Fractional change = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msup><mtext>T</mtext><mo>'</mo></msup><mo>-</mo><mtext>T</mtext></mrow><mtext>T</mtext></mfrac><mo>=</mo><mfrac><mrow><mn>11</mn><mo>-</mo><mn>10</mn></mrow><mn>10</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>10</mn></mfrac></math><br /><br /><math> <mrow> <mo>&#8756;</mo> </mrow> </math>&nbsp; &nbsp; &nbsp; &nbsp; Percentage change =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>%</mo></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863dd8d22bc55562457", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "37", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A horizontal platform, with an object placed on it, is executing SHM in the vertical direction. The amplitude of oscillation is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2.5</mn><mo>&nbsp;</mo><mi>cm</mi></math>. Let the least period of these oscillations, so that the object is not detached, be equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>π</mi><mrow><mn>2</mn><mi>a</mi></mrow></mfrac></math>. Then, the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math>&nbsp;is (Given: <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mo>=</mo><mn>10</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>)", "image": null}, "options": [], "correctValue": "5", "solution": {"text": "The object would not leave the platform when <br/><math><msub><mrow><mi>a</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">x</mi></mrow></msub><mo>&lt;</mo><mi>g</mi></math>  <br/><math><mo>∴</mo><mi> </mi><mi> </mi><msup><mrow><mi>w</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>A</mi><mo>&lt;</mo><mi>g</mi></math>  <br/><math><mo>∴</mo><mi> </mi><mi> </mi><mi>w</mi><mo>&lt;</mo><msqrt><mfrac><mrow><mn>10</mn></mrow><mrow><mn>2.5</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfrac></msqrt><mo>=</mo><msqrt><mfrac><mrow><msup><mrow><mn>10</mn></mrow><mrow><mn>4</mn></mrow></msup></mrow><mrow><mn>25</mn></mrow></mfrac></msqrt><mo>=</mo><mfrac><mrow><mn>100</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mo>=</mo><mn>20</mn></math>  <br/><math><mo>∴</mo><mi> </mi><mi> </mi><mfrac><mrow><mn>2</mn><mi>π</mi></mrow><mrow><mi>T</mi></mrow></mfrac><mo>&lt;</mo><mn>20</mn><mi> </mi><mi> </mi><mo>⇒</mo><mi>T</mi><mo>&gt;</mo><mfrac><mrow><mi>π</mi></mrow><mrow><mn>10</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863dc6078098631679c", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "40", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform solid cylinder can roll without sliding on a horizontal surface as shown in the figure. The mass of cylinder is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi>kg</mi></math> and the spring constant for both the ideal springs is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. What is the angular frequency (in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>rad</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>) of small oscillations of the centre of the cylinder?<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Phys_22.JPG\" style=\"width: 250px; height: 129px;\" />", "image": null}, "options": [], "correctValue": "10", "solution": {"text": "<p>The total energy of the system is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mo>=</mo><mfrac><mn>3</mn><mn>4</mn></mfrac><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>5</mn><mn>2</mn></mfrac><mi>k</mi><msup><mi>x</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>E</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>m</mi><mi>a</mi><mo>+</mo><mn>5</mn><mi>k</mi><mi>x</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mo>-</mo><mfrac><mrow><mn>10</mn><mi>k</mi></mrow><mrow><mn>3</mn><mi>m</mi></mrow></mfrac><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#969;</mi><mo>=</mo><msqrt><mfrac><mrow><mn>10</mn><mi>k</mi></mrow><mrow><mn>3</mn><mi>m</mi></mrow></mfrac></msqrt><mo>=</mo><mn>10</mn><mo>&#160;</mo><mi>rad</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863cee1e5558413c487", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "64", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The system shown in the adjacent figure is in equilibrium. The mass of the container with liquid is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math>, the density of the liquid in the container is <math><mi>ρ</mi></m
