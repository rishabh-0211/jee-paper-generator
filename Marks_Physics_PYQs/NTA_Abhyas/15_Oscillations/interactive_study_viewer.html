ll, "isCorrect": false}, {"id": "eCGId", "text": "<math><msqrt><mfrac><mrow><mi mathvariant=\"normal\">g</mi></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">R</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "q7j8B", "text": "<math><mn>2</mn><msqrt><mfrac><mrow><mi mathvariant=\"normal\">g</mi></mrow><mrow><mi mathvariant=\"normal\">R</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "QZzbZ", "text": "<math><msqrt><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">g</mi></mrow><mrow><mi mathvariant=\"normal\">R</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Restoring torque on small displacement  <math><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">θ</mi></math> <br/><br/> <math><mi mathvariant=\"normal\">τ</mi><mo>=</mo><mi mathvariant=\"normal\">K</mi><msup><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>2</mn></mrow></msup><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">θ</mi><mo>+</mo><mfrac><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">θ</mi></math> <br/><br/> <math><mo>⇒</mo><mi mathvariant=\"normal\">α</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">τ</mi></mrow><mrow><mi mathvariant=\"normal\">l</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">K</mi><msup><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mfrac><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">R</mi></mrow></mfenced><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">θ</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><msup><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math> <br/><br/> <math><mo>=</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mi mathvariant=\"normal\">g</mi></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">R</mi></mrow></mfrac></mrow></mfenced><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">θ</mi><mo>=</mo><msup><mrow><mi mathvariant=\"normal\">ω</mi></mrow><mrow><mn>2</mn></mrow></msup><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">θ</mi></math> <br/><br/> <math><mo>⇒</mo><mi mathvariant=\"normal\">ω</mi><mo>=</mo><msqrt><mfrac><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mi mathvariant=\"normal\">g</mi></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">R</mi></mrow></mfrac></msqrt><mo>=</mo><mn>2</mn><msqrt><mfrac><mrow><mi mathvariant=\"normal\">g</mi></mrow><mrow><mi mathvariant=\"normal\">R</mi></mrow></mfrac></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863bdd6e783d76272d9", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "10", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "What will be the time period of the pendulum&nbsp;of length l suspended from the ceiling of a cart which is sliding without friction on an inclined plane of inclination <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">θ</mi></math> ?", "image": null}, "options": [{"id": "qpCk5", "text": "<math> <mrow> <mn>2</mn> <mtext>&#960;</mtext> <msqrt> <mfrac> <mrow> <mi></mi><mi></mi><mi></mi><mi>l</mi><mo>&#8289;</mo> </mrow> <mrow> <mtext>g</mtext> <mtext>cos</mtext> <mtext>&#952;</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "eeqBD", "text": "<math><mrow>&nbsp;<mn>2</mn> <mtext>π</mtext> <msqrt> <mfrac> <mrow><mn>3</mn> <mi>l</mi><mo>⁡</mo> </mrow> <mrow> <mtext>g</mtext> <mtext>cos</mtext> <mtext>θ</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "KvHuP", "text": "<math> <mrow> <mn>4</mn> <mtext>&#960;</mtext> <msqrt> <mfrac> <mrow><mn>2</mn> <mi>l</mi><mo>&#8289;</mo> </mrow> <mrow> <mtext>g</mtext> <mtext>cos</mtext> <mtext>&#952;</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "8BFF3", "text": "<math><mrow>&nbsp;<mn>3</mn> <mtext>π</mtext> <msqrt> <mfrac> <mrow><mn>4</mn> <mi>l</mi><mo>⁡</mo> </mrow> <mrow> <mtext>2g</mtext> <mtext>cos</mtext> <mtext>θ</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here, point of suspension has an acceleration. <math> <mrow> <mover accent=\"true\"> <mtext>a</mtext> <mo>&#8594;</mo> </mover> </mrow> </math> = g sin&nbsp; &theta; (down the plane). Further, <math> <mrow> <mover accent=\"true\"> <mtext>g</mtext> <mo>&#8594;</mo> </mover> </mrow> </math> can be resolved into two components g sin&nbsp; &theta; (along the plane) and g cos&nbsp; &theta; (perpendicular to plane).<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014074_AnsExp1_1.jpg\" /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014074_AnsExp1_2.jpg\" /><br /><math><mrow><msub><mrow><mover accent=\"true\"><mtext>g</mtext> <mo>&#8594;</mo> </mover> </mrow> <mtext>eff</mtext> </msub> <mo>=</mo> <mover accent=\"true\"> <mtext>g</mtext> <mo>&#8594;</mo> </mover> <mo>-</mo> <mover accent=\"true\"> <mtext>a</mtext> <mo>&#8594;</mo> </mover> </mrow> </math><br /><br />= g cos&theta; (perpendicular to plane)<br /><br /><math><mrow><mtext>T</mtext> <mo>=</mo> <mn>2</mn> <mtext>&#960;</mtext> <msqrt> <mfrac> <mrow> <mi></mi><mi></mi><mi></mi><mi>l</mi><mo>&#8289;</mo> </mrow> <mrow> <mo>|</mo> <msub> <mrow> <mover accent=\"true\"> <mtext>g</mtext> <mo>&#8594;</mo> </mover> </mrow> <mtext>eff</mtext> </msub> <mo>|</mo> </mrow> </mfrac> </msqrt> </mrow> </math><br /><br />&nbsp; &nbsp; <math>&#160;<mrow><mo>=</mo> <mn>2</mn> <mtext>&#960;</mtext> <msqrt> <mfrac> <mrow> <mi></mi><mi></mi><mi>l</mi><mo>&#8289;</mo> </mrow> <mrow> <mtext>g</mtext> <mtext>cos</mtext><mtext>&#952;</mtext> </mrow> </mfrac> </msqrt> </mrow> </math><br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863bd3444ad6b347853", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "70", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A block is hanged from spring in a cage. Elongation in spring is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>x</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>x</mi><mn>2</mn></msub></math>&nbsp;when the cage moves up and down respectively with the same acceleration. The expansion in spring when the cage move horizontally with the same acceleration -", "image": null}, "options": [{"id": "kdftJ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>+</mo><msub><mi>x</mi><mn>2</mn></msub></mrow><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "9YWhC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mrow><msubsup><mi>x</mi><mn>1</mn><mn>2</mn></msubsup><mo>-</mo><msubsup><mi>x</mi><mn>2</mn><mn>2</mn></msubsup></mrow><mn>2</mn></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "J2W2W", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mrow><msubsup><mi>x</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi>x</mi><mn>2</mn><mn>2</mn></msubsup></mrow><mn>2</mn></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "FIxjO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><msub><mi>x</mi><mn>1</mn></msub><msub><mi>x</mi><mn>2</mn></msub></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Elongation in spring is given by <math> <mrow> <mi>x</mi><mo>=</mo><mfrac> <mi>m</mi> <mi>k</mi> </mfrac> <mrow><mo>(</mo> <mrow> <msub> <mi>g</mi> <mrow> <mi>e</mi><mi>f</mi><mi>f</mi> </mrow> </msub> </mrow> <mo>)</mo></mrow> </mrow> </math><br /><br />When the cage is moving up by acceleration&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math><br /><br /><math><msub><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfrac><mrow><mi>m</mi></mrow><mrow><mi>k</mi></mrow></mfrac><mo>(</mo><mi>g</mi><mo>+</mo><mi>a</mi><mo>)</mo></math><br /><br />When the cage is moving down with acceleration&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>x</mi><mn>2</mn></msub><mo>=</mo><mfrac><mi>m</mi><mi>k</mi></mfrac><mfenced separators=\"|\"><mrow><mi>g</mi><mo>-</mo><mi>a</mi></mrow></mfenced></math><br /><br />When the cage is moving with acceleration&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math> horizontally<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>x</mi><mn>3</mn></msub><mo>=</mo><mfrac><mi>m</mi><mi>k</mi></mfrac><msqrt><msup><mi>g</mi><mn>2</mn></msup><mo>+</mo><msup><mi>a</mi><mn>2</mn></msup></msqrt></math><br /><br /><math><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi mathvariant=\"normal\">m</mi><mo>=</mo><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">k</mi><mo>=</mo><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">t</mi></mrow></mfenced></math><br /><br /><math><mi>u</mi><mi>s</mi><mi>i</mi><mi>n</mi><mi>g</mi><mi>&#160;</mi><msup><mrow><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br /><math><mo>&#8756;</mo><msubsup><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>+</mo><msubsup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>=</mo><mfrac><mrow><msup><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><msup><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>.</mo><mn>2</mn><mo>(</mo><msup><mrow><mi>g</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>)</mo><mo>=</mo><mn>2</mn><msubsup><mrow><mi>x</mi></mrow><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></msubsup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">&#160;</mi><msub><mi>x</mi><mn>3</mn></msub><mo>=</mo><msqrt><mfrac><mrow><msubsup><mi>x</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi>x</mi><mn>2</mn><mn>2</mn></msubsup></mrow><mn>2</mn></mfrac></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b9c9df6f0b50413d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "08", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "At a certain place, the acceleration due to gravity is determined using a simple pendulum. The length of the pendulum is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>25</mn><mo>.</mo><mn>0</mn><mo>&#160;</mo><mi>cm</mi></math> and a stopwatch with least count of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>&nbsp;measures the time taken by the pendulum for&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn></math> oscillations to be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>. The accuracy in the measurement of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi></math>&nbsp;is", "image": null}, "options": [{"id": "uoldz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>.</mo><mn>40</mn><mo>%</mo></math>", "image": null, "isCorrect": true}, {"id": "Fnhch", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>.</mo><mn>40</mn><mo>%</mo></math>", "image": null, "isCorrect": false}, {"id": "B4JfG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>40</mn><mo>%</mo></math>", "image": null, "isCorrect": false}, {"id": "VPIjj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>.</mo><mn>40</mn><mo>%</mo></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>&#916;T</mi><mi mathvariant=\"normal\">T</mi></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mrow><mfrac><mi>&#916;g</mi><mi mathvariant=\"normal\">g</mi></mfrac><mo>+</mo><mfrac><mi>&#916;L</mi><mi mathvariant=\"normal\">L</mi></mfrac></mrow></mfenced><mspace linebreak=\"newline\"></mspace><mfrac><mi>&#916;g</mi><mi mathvariant=\"normal\">g</mi></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>&#916;T</mi></mrow><mi mathvariant=\"normal\">T</mi></mfrac><mo>+</mo><mfrac><mi>&#916;L</mi><mi mathvariant=\"normal\">L</mi></mfrac><mo>;</mo><mo>&#160;&#160;</mo><mo>=</mo><mn>2</mn><mfenced><mfrac><mn>1</mn><mn>50</mn></mfrac></mfenced><mo>+</mo><mfrac><mrow><mn>0</mn><mo>.</mo><mn>1</mn></mrow><mrow><mn>25</mn><mo>.</mo><mn>0</mn></mrow></mfrac><mspace linebreak=\"newline\"></mspace><mo>=</mo><mn>4</mn><mo>.</mo><mn>4</mn><mo>%</mo><mspace linebreak=\"newline\"></mspace><mspace linebreak=\"newline\"></mspace></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b30a867933756e0b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "100", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two identical balls&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>, each of mass<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mn>0</mn><mo>.</mo><mn>1</mn><mo>&nbsp;</mo><mi>kg</mi></math>, are attached to two identical massless springs. The spring-mass system is constrained to move inside a rigid smooth pipe bent in the form of a circle as shown in the figure. The pipe is fixed in a horizontal plane. The centres of the balls can move in a circle of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>06</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>. Each spring has a natural length of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>06</mn><mi mathvariant=\"normal\">π</mi><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> and spring constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>, Initially, both the balls are displaced by an angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>θ</mi><mo>&nbsp;</mo><mo>=</mo><mfrac><mi>π</mi><mn>6</mn></mfrac><mo>&nbsp;</mo><mi>rad</mi></math> with respect to the diameter<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mi>PQ</mi><mo>&nbsp;</mo></math>of the circle (as shown in the figure) and released from rest.<br />\rThe frequency of oscillation of balls is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0007521_Ques1_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"height: 171px; width: 250px;\" />", "image": null}, "options": [{"id": "HV6Nq", "text": "<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mi>&pi;</mi> </mrow> </mfrac> <mtext>&nbsp;Hz</mtext></mrow> </math>", "image": null, "isCorrect": false}, {"id": "xCOMf", "text": "<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>3</mn> <mi>&pi;</mi> </mrow> </mfrac> <mtext>&nbsp;Hz</mtext></mrow> </math>", "image": null, "isCorrect": false}, {"id": "CB2ae", "text": "<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mi>π</mi> </mrow> </mfrac> <mtext>&nbsp;Hz</mtext> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "UaTN1", "text": "<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>4</mn> <mi>&pi;</mi> </mrow> </mfrac> <mtext>&nbsp;Hz</mtext> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, Mass of each block A and B, m = 0.1 kg<br /><br />Radius of circle, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>06</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Ques_7521_1_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 250px; height: 199px;\" /><br /><br />The natural length of spring <math> <mrow> <msub> <mtext mathvariant=\"italic\">l</mtext> <mn>0</mn> </msub> <mo>=</mo> <mtext>0.06</mtext> <mi>π</mi> <mo>=</mo> <mi>π</mi> <mtext>R</mtext> </mrow> </math>&nbsp;(Half circle) and spring constant,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">k</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br />In the stretched position elongation in each spring<br /><br /><math> <mrow> <mtext>x</mtext> <mo>=</mo> <mtext>R</mtext> <mi>θ</mi> </mrow> </math><br /><br />Let us draw FBD of A<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Ques_7521_1_2.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 250px; height: 220px;\" /><br /><br />Spring in lower side is stretched by 2x and on upper side compressed by 2x. Therefore, a force 2kx on each block would be exerted by each spring.<br /><br />Hence, a restoring force, F = 4kx will act on A in the direction shown in figure.<br /><br />Restoring torque of this force about origin<br /><br /><math> <mrow> <mi>τ</mi> <mo>=</mo> <mo>-</mo> <mtext>F. R</mtext> <mo>=</mo> <mo>-</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>4</mn> <mtext>kx</mtext> </mrow> </mfenced> <mtext>R</mtext> <mo>=</mo> <mo>-</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>4</mn> <mtext>kR</mtext> <mi>θ</mi> </mrow> </mfenced> <mtext>R</mtext> </mrow> </math><br /><br />or&nbsp;<math> <mrow> <mi>τ</mi> <mo>=</mo> <mo>-</mo> <mn>4</mn> <msup> <mtext>kR</mtext> <mn>2</mn> </msup> <mo>·</mo> <mi>θ</mi> </mrow> </math>&nbsp;&nbsp; ..... (i)<br /><br />Since, <math> <mrow> <mi>τ</mi> <mo>∝</mo> <mo>-</mo> <mi>θ</mi> </mrow> </math>, each ball executes angular SHM about origin O.<br /><br />Equation. (i) can be written as<br /><br /><math> <mrow> <mtext>I</mtext> <mi>α</mi> <mo>=</mo> <mo>-</mo> <mn>4</mn> <msup> <mtext>kR</mtext> <mn>2</mn> </msup> <mi>θ</mi> </mrow> </math><br /><br />or &nbsp;&nbsp;<math> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msup> <mtext>mR</mtext> <mn>2</mn> </msup> </mrow> </mfenced> <mi>α</mi> <mo>=</mo> <mo>-</mo> <mn>4</mn> <msup> <mtext>kR</mtext> <mn>2</mn> </msup> <mi>θ</mi> </mrow> </math><br /><br />or <math> <mrow> <mi>α</mi> <mo>=</mo> <mo>-</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>4</mn> <mtext>k</mtext> </mrow> <mrow> <mtext>m</mtext> </mrow> </mfrac> </mrow> </mfenced> <mi>θ</mi> </mrow> </math><br /><br />Frequency of oscillation, <math> <mrow> <mtext>f</mtext> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> <msqrt> <mfenced close=\"|\" open=\"|\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>acceleration</mtext> </mrow> <mrow> <mtext>displacement</mtext> </mrow> </mfrac> </mrow> </mfenced> </msqrt> </mrow> </math><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math> <mrow> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> <msqrt> <mfenced close=\"|\" open=\"|\" separators=\",\"> <mrow> <mfrac> <mrow> <mi>α</mi> </mrow> <mrow> <mi>θ</mi> </mrow> </mfrac> </mrow> </mfenced> </msqrt> </mrow> </math><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math> <mrow> <mtext>f</mtext> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> <msqrt> <mfrac> <mrow> <mn>4</mn> <mtext>k</mtext> </mrow> <mrow> <mtext>m</mtext> </mrow> </mfrac> </msqrt> </mrow> </math><br /><br />Substituting the values, we have<br /><br /><math> <mrow> <mtext>f</mtext> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> <msqrt> <mfrac> <mrow> <mn>4</mn> <mo>×</mo> <mtext>0.1</mtext> </mrow> <mrow> <mtext>0.1</mtext> </mrow> </mfrac> </msqrt> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mi>π</mi> </mrow> </mfrac> <mtext>&nbsp;Hz</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ae80f488e2f7e654", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "58", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A disc of radius <math><mi>R</mi></math> and mass <math><mi>M</mi></math> is pivoted at the rim and is set for small oscillations. If simple pendulum has to have the same period as that of the disc, the length of the simple pendulum should be", "image": null}, "options": [{"id": "7RWB9", "text": "<math><mfrac><mrow><mn>5</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mi>R</mi></math>", "image": null, "isCorrect": false}, {"id": "C3zIS", "text": "<math><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi>R</mi></math>", "image": null, "isCorrect": false}, {"id": "9gci6", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mi>R</mi></math>", "image": null, "isCorrect": false}, {"id": "yZEKC", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>R</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/sgqpftcbdecrivlqfudfjonmslxjzlgqieahkgezmavnxebdtv.png\" /><br /><br /><math><mi>τ</mi><mo>=</mo><mo>-</mo><mi>m</mi><mi>g</mi><mi>R</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi><mo>=</mo><mo>-</mo><mi>m</mi><mi>g</mi><mi>R</mi><mi>θ</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mo>∵</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi><mo>≃</mo><mi>θ</mi></mrow></mrow></mrow></mfenced></mrow></mrow></math><br /><br /><math> <mrow> <mi>I</mi><mi>α</mi></mrow> </msub><mo>=</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>m</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mi>m</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced><mi>α</mi><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>m</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>α</mi></math><br /><br />But <math><mi>τ</mi><mo>=</mo><msub> <mrow> <mi>I</mi><mi>α</mi></mrow> </msub></math><br /><br /><math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>m</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>α</mi><mo>=</mo><mo>-</mo><mi>m</mi><mi>g</mi><mi>R</mi><mi>θ</mi></math><br /><br /><math><mi>α</mi><mo>=</mo><mo>-</mo><mfrac><mrow><mn>2</mn><mi>g</mi></mrow><mrow><mn>3</mn><mi>R</mi></mrow></mfrac><mi>θ</mi><mo>=</mo><msup><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>θ</mi></math><br /><br />Time period&nbsp;<math><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mn>3</mn><mi>R</mi></mrow><mrow><mn>2</mn><mi>g</mi></mrow></mfrac></msqrt></math><br /><br />For simple pendulum, <math><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>l</mi></mrow><mrow><mi>g</mi></mrow></mfrac></msqrt></math><br /><br /><math><mi>l</mi><mo>=</mo><mfrac><mrow><mn>3</mn><mi>R</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a3d3427daf79ad33", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "80", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two blocks with masses <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mn>1</mn></msub><mo>=</mo><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">&nbsp;</mi><msub><mi>m</mi><mn>2</mn></msub><mo>=</mo><mn>2</mn><mo>&nbsp;</mo><mi>kg</mi></math>&nbsp;are connected by a spring constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi><mo>=</mo><mn>24</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> and placed on a frictionless horizontal surface. The block <math><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub></math> is imparted an initial velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>0</mn></msub><mo>=</mo><mn>12</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mi mathvariant=\"normal\">&nbsp;</mi><mo>-</mo><mn>1</mn></mrow></msup></math> to the right, the value of amplitude of oscillation (in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>cm</mi></math>) of the block with respect to other is", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "The amplitude of oscillations will be the maximum compression in the spring. At the time of maximum compression velocities of both the blocks are equal say <math><mi>v</mi></math>, then using law of conservation of momentum,<br /><br /><math><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>v</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mfenced separators=\"|\"><mrow><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced><mi>v</mi></math><br /><br />or <math><mn>1</mn><mo>×</mo><mn>12</mn><mo>=</mo><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mn>2</mn></mrow></mfenced><mi>v</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>v</mi><mo>=</mo><mn>4</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br />Using law of conservation of energy, we have<br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub><msubsup><mrow><mi>v</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>k</mi><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mfenced separators=\"|\"><mrow><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br />Putting the value and solving we get <math><mi>x</mi><mo>=</mo><mn>2</mn></math> cm", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639ea4eba68d8b988f", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "32", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>Two blocks <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Q</mi></math> of masses <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>0.3</mtext><mo>&nbsp;</mo><mi>kg</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>0.4</mtext><mo>&nbsp;</mo><mi>kg</mi></math> respectively are stuck to each other by some weak glue as shown in the figure. They hang together at the end of a spring with a spring constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">k</mi><mo>=</mo><mn>200</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. The block <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Q</mi></math> suddenly falls free due to failure of glue, then find the maximum kinetic energy of the block <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> during subsequent motion (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>mJ</mi></math>).</p>\r\r<p><br />\r<img alt=\"Picture 104\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/544770.PNG\" style=\"width: 100px; height: 163px;\" /></p>\r", "image": null}, "options": [], "correctValue": "40", "solution": {"text": "Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;be the amplitude, then we have<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>kA</mi><mo>=</mo><mi>mg</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#8658;</mo><mi mathvariant=\"normal\">A</mi><mo>=</mo><mfrac><mi>mg</mi><mi mathvariant=\"normal\">k</mi></mfrac></math><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>=</mo><mfrac><mrow><mtext>0.4</mtext><mo>&#215;</mo><mi mathvariant=\"normal\">g</mi></mrow><mn>200</mn></mfrac></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mo>&#160;</mo><mi>cm</mi></math><br /><br />Motion starts from the lower extreme.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>KE</mi><mi>max</mi></msub><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mi>m&#969;</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">A</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mtext>0.3</mtext><mo>&#215;</mo><mfrac><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">m</mi></mfrac><mo>&#215;</mo><msup><mi mathvariant=\"normal\">A</mi><mn>2</mn></msup></math><br /><br /><math><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>&#215;</mo><mn>0.3</mn><mo>&#215;</mo><mfrac><mrow><mn>200</mn></mrow><mrow><mn>0.3</mn></mrow></mfrac><mo>&#215;</mo><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>2</mn></mrow><mrow><mn>100</mn></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mtext>0.04</mtext><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>40</mn><mo>&#160;</mo><mi>mJ</mi></math>&nbsp;</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86397e3a05060757378", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "92", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">U</mi></math> tube of the uniform bore of cross-sectional area&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> is set up vertically with open ends. A liquid of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> and density&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi></math> is poured into it. The liquid column will oscillate with a period", "image": null}, "options": [{"id": "LFkkB", "text": "<math><mrow>  <mn>2</mn>  <mi>&pi;</mi>  <msqrt>    <mfrac>      <mrow>        <mtext>M</mtext>      </mrow>      <mrow>        <mtext>g</mtext>      </mrow>    </mfrac>  </msqrt></mrow></math>", "image": null, "isCorrect": false}, {"id": "ysjz5", "text": "<math><mrow>  <mn>2</mn>  <mi>&pi;</mi>  <msqrt>    <mfrac>      <mrow>        <mtext>M</mtext>        <mtext>A</mtext>      </mrow>      <mrow>        <mtext>d</mtext>        <mtext>g</mtext>      </mrow>    </mfrac>  </msqrt></mrow></math>", "image": null, "isCorrect": false}, {"id": "5nrmz", "text": "<math><mrow>  <mn>2</mn>  <mi>&pi;</mi>  <msqrt>    <mfrac>      <mrow>        <mtext>M</mtext>      </mrow>      <mrow>        <mtext>A</mtext>        <mtext>d</mtext>        <mtext>g</mtext>      </mrow>    </mfrac>  </msqrt></mrow></math>", "image": null, "isCorrect": false}, {"id": "VYaku", "text": "<math> <mrow> <mn>2</mn> <mi>π</mi> <msqrt> <mfrac> <mrow> <mtext>M</mtext> </mrow> <mrow> <mn>2</mn> <mtext>A</mtext> <mtext>d</mtext> <mtext>g</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math> <mrow> <mtext>T</mtext> <mo>=</mo> <mn>2</mn> <mi>π</mi> <msqrt> <mfrac> <mrow> <mtext>L</mtext> </mrow> <mrow> <mtext>g</mtext> </mrow> </mfrac> </msqrt> </mrow> </math><br /><br />Where L is the length of the liquid is one of the limbs. However, if L is taken to be the length of the liquid column, then the length of liquid in each limb is <math> <mrow> <mfrac> <mrow> <mtext>L</mtext> </mrow> <mrow> <mn>2</mn></mrow></mfrac></mrow></math>.<br /><br /><math> <mrow> <mo>⇒&nbsp;&nbsp;&nbsp;</mo> <mtext>T</mtext> <mo>=</mo> <mn>2</mn> <mi>π</mi> <msqrt> <mfrac> <mrow> <mtext>L</mtext> </mrow> <mrow> <mn>2</mn> <mtext>g</mtext> </mrow> </mfrac> </msqrt> </mrow> </math><br /><br /><math> <mrow> <mo>⇒&nbsp;&nbsp;&nbsp;</mo> <mtext>M</mtext> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>AL</mtext> </mrow> </mfenced> <mtext>d</mtext> <mo>&nbsp;&nbsp;⇒&nbsp;&nbsp;</mo> <mtext>L</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>M</mtext> </mrow> <mrow> <mtext>Ad</mtext> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>⇒&nbsp;&nbsp;&nbsp;</mo> <mtext>T</mtext> <mo>=</mo> <mn>2</mn> <mi>π</mi> <msqrt> <mfrac> <mrow> <mtext>M</mtext> </mrow> <mrow> <mn>2</mn> <mtext>Adg</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863913c805ba0958f1e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "12", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A block of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math> is placed on the top of a <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&nbsp;</mo><mi>kg</mi></math> cart such that the time period of the system is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>0.75</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">s</mi></math> assuming there is no slipping. &nbsp;If the cart is displaced by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&nbsp;</mo><mi>mm</mi></math> from its&nbsp;equilibrium position&nbsp;and&nbsp;released, then the&nbsp;coefficient of static friction&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">μ</mi><mi mathvariant=\"normal\">s</mi></msub></math>&nbsp;between block and cart is just sufficient to prevent the block&nbsp;from sliding.&nbsp;The value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">μ</mi><mi mathvariant=\"normal\">s</mi></msub></math>&nbsp;respectively are&nbsp;(Take <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">g</mi><mo>=</mo><mn>9</mn><mo>.8</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>/</mo><msup><mi mathvariant=\"normal\">s</mi><mn>2</mn></msup></math>)<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014077_Ques1_1_.jpg\" style=\"width: 288px; height: 121px;\" /></p>\r", "image": null}, "options": [{"id": "jiPVm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>1.63</mo><mi>kg</mi><mo>;</mo><mo>&#160;</mo><mo>0.251</mo></math>", "image": null, "isCorrect": false}, {"id": "zZhYY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>2.55</mo><mi>kg</mi><mo>;</mo><mo>&#160;</mo><mo>0.385</mo></math>", "image": null, "isCorrect": true}, {"id": "51R1a", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>3.42</mo><mi>kg</mi><mo>;</mo><mo>&#160;</mo><mo>0.632</mo></math>", "image": null, "isCorrect": false}, {"id": "XKAm5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>4.28</mo><mi>kg</mi><mo>;</mo><mo>&#160;</mo><mo>0.876</mo></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>T</mtext> <mo>=</mo> <mn>2</mn> <mtext>π</mtext> <msqrt> <mfrac> <mrow> <mtext>m</mtext> <mo>+</mo> <mn>6</mn> </mrow> <mrow> <mtext>600</mtext> </mrow> </mfrac> </msqrt> <mn>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; </mn> <mo>(</mo> <mtext>T</mtext> <mo>=</mo> <mn>2</mn> <mtext>π</mtext> <msqrt> <mfrac> <mrow> <mtext>m</mtext> </mrow> <mrow> <mtext>k</mtext> </mrow> </mfrac> </msqrt> <mo>)</mo> </mrow> </math><br /><br /><math> <mrow> <mtext>or</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>0.75</mtext> <mo>=</mo> <mn>2</mn> <mtext>π</mtext> <msqrt> <mfrac> <mrow> <mtext>m</mtext> <mo>+</mo> <mn>6</mn> </mrow> <mrow> <mtext>600</mtext> </mrow> </mfrac> </msqrt> </mrow> </math><br /><br /><math> <mrow> <mo>∴</mo> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>m</mtext> <mo>=</mo> <mfrac> <mrow> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>0.75</mtext> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> <mo>×</mo> <mtext>600</mtext> </mrow> <mrow> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>2</mn> <mtext>π</mtext> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> </mrow> </mfrac> <mo>-</mo> <mn>6</mn> </mrow> </math><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; = 2.55 kg<br /><br />Maximum acceleration of SHM is,<br /><br />a<sub>max</sub> = ω<sup>2</sup>A&nbsp; &nbsp;(A = amplitude)<br /><br />i.e., maximum force on mass 'm' is m ω<sup>2</sup> A which is being provided by the force of friction between the mass and the cart. Therefore,<br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; μ<sub>s</sub>mg &nbsp;≥ &nbsp;mω<sup>2</sup> A<br /><br /><math> <mrow><mn>or &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; </mn> <msub> <mtext>μ</mtext> <mtext>s</mtext> </msub> <mo>≥</mo> <mfrac> <mrow> <msup> <mtext>ω</mtext> <mn>2</mn> </msup> <mtext>A</mtext> </mrow> <mrow> <mtext>g</mtext> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow><mn>or &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; </mn> <msub> <mtext>μ</mtext> <mtext>s</mtext> </msub> <mo>≥</mo> <mo>(</mo> <mfrac> <mrow> <mn>2</mn> <mtext>π</mtext> </mrow> <mrow> <mtext>T</mtext> </mrow> </mfrac> <msup> <mo>)</mo> <mn>2</mn> </msup> <mo>·</mo> <mfrac> <mrow> <mtext>A</mtext> </mrow> <mrow> <mtext>g</mtext> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow><mn>or &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; </mn> <msub> <mtext>μ</mtext> <mtext>s</mtext> </msub> <mo>≥</mo> <mo>(</mo> <mfrac> <mrow> <mn>2</mn> <mtext>π</mtext> </mrow> <mrow> <mtext>0.75</mtext> </mrow> </mfrac> <msup> <mo>)</mo> <mn>2</mn> </msup> <mo>(</mo> <mfrac> <mrow> <mtext>0.05</mtext> </mrow> <mrow> <mtext>9.8</mtext> </mrow> </mfrac> <mo>)</mo> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>A = 50 mm</mtext> </mrow> </mfenced> </mrow> </math><br /><br />or &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; μ<sub>s</sub> &nbsp; ≥ &nbsp;0.358<br /><br />Thus, the minimum value of&nbsp; μ<sub>s</sub> should be 0.358.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863872f88d53d08c955", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "86", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In an Experiment to find the loss of energy with respect to time in case of swinging simple pendulum, the graph between square of amplitude&nbsp;and time is best represented by", "image": null}, "options": [{"id": "5VQSm", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-08-12_at_2.00.26_PM.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 120px; height: 88px;\" />", "image": null, "isCorrect": true}, {"id": "eqTkl", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image16-24ce2903-a3c5-45ab-bfc9-4d3fcc659e1a.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"height: 121px; width: 120px;\" />", "image": null, "isCorrect": false}, {"id": "Yemju", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image17-1d6141b2-f09a-42d4-a221-ef6760a93ca3.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"height: 114px; width: 120px;\" />", "image": null, "isCorrect": false}, {"id": "2vTMp", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image18-974b0c10-700b-4d5b-86b5-1219ebf382b7.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"height: 121px; width: 120px;\" />", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Energy <math> <mrow> <mo>=</mo><mfrac> <mn>1</mn> <mn>2</mn> </mfrac> <mi>K</mi><msup> <mi>A</mi> <mn>2</mn> </msup> </mrow> </math><br /><br />For a damped harmonic oscillation<br /><br /><math> <mrow> <mi>A</mi><mo>=</mo><msub> <mi>A</mi> <mi>o</mi> </msub> <msup> <mi>e</mi> <mrow> <mo>−</mo><mfrac> <mrow> <mi>b</mi><mi>t</mi></mrow> <mrow> <mn>2</mn><mi>m</mi></mrow> </mfrac> </mrow> </msup> <mi>sin</mi><mrow><mo>(</mo> <mrow> <mi>w</mi><mo>'</mo><mi>t</mi><mo>+</mo><mi>δ</mi></mrow> <mo>)</mo></mrow></mrow> </math><br /><br />amplitude can be written as <math> <mrow> <mi>A</mi><mo>=</mo><msub> <mi>A</mi> <mn>0</mn> </msub> <msup> <mi>e</mi> <mrow> <mo>−</mo><mfrac> <mrow> <mi>b</mi><mi>t</mi></mrow> <mrow> <mn>2</mn><mi>m</mi></mrow> </mfrac> </mrow> </msup> </mrow> </math><br /><br />So curve between <math> <mrow> <msup> <mi>A</mi> <mn>2</mn> </msup> <mtext> </mtext><mi>v</mi><mi>s</mi><mtext> </mtext><mi>t</mi></mrow> </math><br /><br />will be an exponential decay<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/2332435.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 150px; height: 129px;\" /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/23454654.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 150px; height: 79px;\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638724d3f479f67abb", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "26", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Consider a pair of identical pendulums, which oscillate with equal amplitude independently such that when one pendulum is at its extreme position making an angle of 2<sup>o</sup> to the right with the vertical, the other pendulum makes an angle of 1<sup>o</sup> to the left of the vertical. What is the phase difference (in degree) between the pendulums?", "image": null}, "options": [], "correctValue": "120", "solution": {"text": "Assuming the two pendulums follow the following functions of their displacement :<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&theta;<sub>1</sub> = &theta;<sub>0</sub> sin (&omega;t + &#x03D5;<sub>1</sub>)&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;..(i)<br /><br />and&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&theta;<sub>2</sub> = &theta;<sub>0</sub> sin (&omega;t + &#x03D5;<sub>2</sub>)&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;..(ii)<br /><br />As it is given that amplitude and time period being equal but phases being different.<br /><br />Now, for first pendulum at any time t<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&theta;<sub>1</sub> = &theta;<sub>0</sub>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(Right extreme)<br /><br />From Eq. (i), we get <br /><br />&rArr;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&theta;<sub>0</sub> = &theta;<sub>0</sub> sin (&omega;t + &#x03D5;<sub>1</sub>)<br /><br />or&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;1 = sin (&omega;t + &#x03D5;<sub>1</sub>)<br /><br />or&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math><mrow>  <mfenced open=\"(\" close=\")\" separators=\",\">    <mrow>      <mi>&omega;</mi>      <mi>t</mi>      <mo>+</mo>      <msub>              <mi>&#x03D5;</mi>            <mn>1</mn>      </msub>    </mrow>  </mfenced>  <mo>=</mo>  <mfrac>    <mrow>      <mi>&pi;</mi>    </mrow>    <mrow>      <mn>2</mn>    </mrow>  </mfrac>  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mo>&hellip;</mo>  <mfenced open=\"(\" close=\")\" separators=\",\">    <mrow>      <mtext>iii</mtext>    </mrow>  </mfenced></mrow></math><br /><br />Similarly, at the same instant t for pendulum second, we have <br /><br /><math><mrow>  <msub>          <mi>&theta;</mi>        <mn>2</mn>  </msub>  <mo>=</mo>  <mo>-</mo>  <mfrac>    <mrow>      <msub>              <mi>&theta;</mi>            <mn>0</mn>      </msub>    </mrow>    <mrow>      <mn>2</mn>    </mrow>  </mfrac></mrow></math><br /><br /><b>Note</b> &theta;<sub>0</sub> = 2<sup>o</sup> is the angular amplitude for the second pendulum the angular displacement is one degree therefore, <math><mrow>  <msub>          <mi>&theta;</mi>        <mn>2</mn>  </msub>  <mo>=</mo>  <mfrac>    <mrow>      <msub>              <mi>&theta;</mi>            <mn>0</mn>      </msub>    </mrow>    <mrow>      <mn>2</mn>    </mrow>  </mfrac></mrow></math>&nbsp;and negative sign is taken to show for being left to mean position <br /><br />From Eq. (ii), then<br /><br /><math><mrow>  <mo>-</mo>  <mfrac>    <mrow>      <msub>              <mi>&theta;</mi>            <mn>0</mn>      </msub>    </mrow>    <mrow>      <mn>2</mn>    </mrow>  </mfrac>  <mo>=</mo>  <msub>          <mi>&theta;</mi>        <mn>0</mn>  </msub>  <mspace width=\"0.5em\" />  <mtext>sin</mtext>  <mfenced open=\"(\" close=\")\" separators=\",\">    <mrow>      <mi>&omega;</mi>      <mi>t</mi>      <mo>+</mo>      <msub>              <mi>&#x03D5;</mi>            <mn>2</mn>      </msub>    </mrow>  </mfenced></mrow></math><br /><br /><math><mrow>  <mo>&rArr;</mo>  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mtext>sin</mtext>  <mfenced open=\"(\" close=\")\" separators=\",\">    <mrow>      <mi>&omega;</mi>      <mi>t</mi>      <mo>+</mo>      <msub>              <mi>&#x03D5;</mi>            <mn>2</mn>      </msub>    </mrow>  </mfenced>  <mo>=</mo>  <mo>-</mo>  <mfrac>    <mrow>      <mn>1</mn>    </mrow>    <mrow>      <mn>2</mn>    </mrow>  </mfrac></mrow></math><br /><br /><math><mrow>  <mo>&rArr;</mo>  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mfenced open=\"(\" close=\")\" separators=\",\">    <mrow>      <mi>&omega;</mi>      <mi>t</mi>      <mo>+</mo>      <msub>              <mi>&#x03D5;</mi>            <mn>2</mn>      </msub>    </mrow>  </mfenced>  <mo>=</mo>  <mo>-</mo>  <mfrac>    <mrow>      <mi>&pi;</mi>    </mrow>    <mrow>      <mn>6</mn>    </mrow>  </mfrac>  <mtext>or</mtext>  <mfrac>    <mrow>      <mn>7</mn>      <mi>&pi;</mi>    </mrow>    <mrow>      <mn>6</mn>    </mrow>  </mfrac></mrow></math><br /><br /><math><mrow>  <mtext>or</mtext>  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mfenced open=\"(\" close=\")\" separators=\",\">    <mrow>      <mi>&omega;</mi>      <mi>t</mi>      <mo>+</mo>      <msub>              <mi>&#x03D5;</mi>            <mn>2</mn>      </msub>    </mrow>  </mfenced>  <mo>=</mo>  <mo>-</mo>  <mfrac>    <mrow>      <mi>&pi;</mi>    </mrow>    <mrow>      <mn>6</mn>    </mrow>  </mfrac>  <mtext>or</mtext>  <mfrac>    <mrow>      <mn>7</mn>      <mi>&pi;</mi>    </mrow>    <mrow>      <mn>6</mn>    </mrow>  </mfrac>  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mo>&hellip;</mo>  <mfenced open=\"(\" close=\")\" separators=\",\">    <mrow>      <mtext>iv</mtext>    </mrow>  </mfenced></mrow></math><br /><br />From Eqs. (iv) and (iii), the difference in phases<br /><br /><math><mrow>  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mfenced open=\"(\" close=\")\" separators=\",\">    <mrow>      <mi>&omega;</mi>      <mi>t</mi>      <mo>+</mo>      <msub>              <mi>&#x03D5;</mi>            <mn>2</mn>      </msub>    </mrow>  </mfenced>  <mo>-</mo>  <mfenced open=\"(\" close=\")\" separators=\",\">    <mrow>      <mi>&omega;</mi>      <mi>t</mi>      <mo>+</mo>      <msub>              <mi>&#x03D5;</mi>            <mn>1</mn>      </msub>    </mrow>  </mfenced>  <mo>=</mo>  <mo>-</mo>  <mfrac>    <mrow>      <mn>7</mn>      <mi>&pi;</mi>    </mrow>    <mrow>      <mn>6</mn>    </mrow>  </mfrac>  <mtext>or</mtext>  <mfrac>    <mrow>      <mi>&pi;</mi>    </mrow>    <mrow>      <mn>2</mn>    </mrow>  </mfrac>  <mo>=</mo>  <mfrac>    <mrow>      <mn>7</mn>      <mi>&pi;</mi>      <mo>-</mo>      <mn>3</mn>      <mi>&pi;</mi>    </mrow>    <mrow>      <mn>6</mn>    </mrow>  </mfrac>  <mo>=</mo>  <mfrac>    <mrow>      <mn>4</mn>      <mi>&pi;</mi>    </mrow>    <mrow>      <mn>6</mn>    </mrow>  </mfrac></mrow></math><br /><br /><math><mrow>  <mtext>or</mtext>  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mfenced open=\"(\" close=\")\" separators=\",\">    <mrow>      <msub>              <mi>&#x03D5;</mi>            <mn>2</mn>      </msub>      <mo>-</mo>      <msub>              <mi>&#x03D5;</mi>            <mn>1</mn>      </msub>    </mrow>  </mfenced>  <mo>=</mo>  <mfrac>    <mrow>      <mn>4</mn>      <mi>&pi;</mi>    </mrow>    <mrow>      <mn>6</mn>    </mrow>  </mfrac>  <mo>=</mo>  <mfrac>    <mrow>      <mn>2</mn>      <mi>&pi;</mi>    </mrow>    <mrow>      <mn>3</mn>    </mrow>  </mfrac>  <mo>=</mo>  <mn>1</mn>  <mn>2</mn>  <msup>          <mn>0</mn>        <mi>&omicron;</mi>  </msup></mrow></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863868685af7220d615", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "30", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A block of mass <em><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math></em> is attached to a cart of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi mathvariant=\"normal\">m</mi></math> through spring of spring constant <em><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">k</mi></math></em> as shown in the figure. Friction is absent everywhere. The time period of oscillations of the system, when spring is compressed and then released, is<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/caa732af-6003-4417-a055-3f7cce6c4811-image2.jpeg\" />", "image": null}, "options": [{"id": "D5cBg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#x3C0;</mi><msqrt><mfrac><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">k</mi></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "jJplz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">&#x3C0;</mi><msqrt><mfrac><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">k</mi></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "KrfvY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">&#x3C0;</mi><msqrt><mfrac><mrow><mn>5</mn><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">k</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "pEUlb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi mathvariant=\"normal\">&#x3C0;</mi><msqrt><mfrac><mi mathvariant=\"normal\">m</mi><mrow><mn>5</mn><mi mathvariant=\"normal\">k</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "It is equivalent to a system as shown below,<br /><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/3e2087a7-d7ed-4127-80df-7e09dd5be30e-image3.jpeg\" /><br /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mi mathvariant=\"normal\">T</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi><msqrt><mfrac><msub><mi mathvariant=\"normal\">m</mi><mi>reduced</mi></msub><mi mathvariant=\"normal\">k</mi></mfrac></msqrt></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mi mathvariant=\"normal\">T</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi><msqrt><mfrac><mfenced separators=\"|\"><mfrac><mrow><mi mathvariant=\"normal\">m</mi><mo>&#215;</mo><mn>4</mn><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>5</mn><mi mathvariant=\"normal\">m</mi></mrow></mfrac></mfenced><mi mathvariant=\"normal\">k</mi></mfrac></msqrt></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>&#160;&#160;</mo><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi><msqrt><mfrac><mrow><mn>4</mn><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>5</mn><mi mathvariant=\"normal\">k</mi></mrow></mfrac></msqrt><mo>&#160;&#160;</mo><mo>=</mo><mo>&#160;&#160;</mo><mn>4</mn><mi mathvariant=\"normal\">&#960;</mi><msqrt><mfrac><mi mathvariant=\"normal\">m</mi><mrow><mn>5</mn><mi mathvariant=\"normal\">k</mi></mrow></mfrac></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863785246ee865a843f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "20", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A block of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">M</mi><mn>1</mn></msub></math>&nbsp;is constrained to move along with a moveable pulley of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">M</mi><mn>2</mn></msub></math>&nbsp;which is connected to a spring of force constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">k</mi></math>,&nbsp;as shown in the figure. If the mass of the fixed pulley is negligible and friction is absent everywhere, then the period of small oscillations of the system is<br />\r<u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014752_Ques1_1.jpg\" style=\"width: 203px; height: 257px;\" /></strong></u></p>\r", "image": null}, "options": [{"id": "2wA0M", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">π</mi><msqrt><mfrac><mrow><mn>4</mn><msub><mtext>M</mtext><mn>1</mn></msub><mo>+</mo><msub><mtext>M</mtext><mn>2</mn></msub></mrow><mi mathvariant=\"normal\">k</mi></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "YLTNE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">π</mi><msqrt><mfrac><mrow><mn>4</mn><msub><mtext>M</mtext><mn>2</mn></msub><mo>+</mo><msub><mtext>M</mtext><mn>1</mn></msub></mrow><mtext>k</mtext></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "TlyxA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi mathvariant=\"normal\">π</mi><msqrt><mfrac><mrow><mn>2</mn><msub><mtext>M</mtext><mn>1</mn></msub><mo>+</mo><msub><mtext>M</mtext><mn>2</mn></msub></mrow><mi mathvariant=\"normal\">k</mi></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "iEg8o", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">π</mi><msqrt><mfrac><mrow><mn>4</mn><msub><mtext>M</mtext><mn>1</mn></msub><mo>-</mo><msub><mtext>M</mtext><mn>2</mn></msub></mrow><mi mathvariant=\"normal\">k</mi></mfrac></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If the mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">M</mi><mn>1</mn></msub></math>&nbsp;is displaced by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi></math> and has speed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">v</mi></math>, spring will extend by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi><mo>/</mo><mn>2</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">M</mi><mn>2</mn></msub></math>&nbsp;will have speed&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">v</mi><mo>/</mo><mn>2</mn></math>. Energy of this system can be written as<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><msub><mtext>M</mtext><mn>1</mn></msub><mtext>gx</mtext><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msub><mtext>M</mtext><mn>1</mn></msub><msup><mtext>v</mtext><mn>2</mn></msup><mo>+</mo><msub><mtext>M</mtext><mn>2</mn></msub><mtext>g</mtext><mfrac><mtext>x</mtext><mn>2</mn></mfrac><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msub><mtext>M</mtext><mn>2</mn></msub><msup><mfenced><mfrac><mrow><mtext>v</mtext><mo>⁡</mo></mrow><mn>2</mn></mfrac></mfenced><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi mathvariant=\"normal\">k</mi><msup><mfenced><mfrac><mtext>x</mtext><mn>2</mn></mfrac></mfenced><mn>2</mn></msup><mo>=</mo><mtext>const.</mtext></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><msub><mtext>M</mtext><mn>1</mn></msub><mtext>gx</mtext><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msub><mtext>M</mtext><mn>1</mn></msub><msup><mtext>v</mtext><mn>2</mn></msup><mo>+</mo><mfrac><msub><mtext>M</mtext><mn>2</mn></msub><mn>2</mn></mfrac><mtext>gx</mtext><mo>+</mo><mfrac><mn>1</mn><mn>8</mn></mfrac><msub><mtext>M</mtext><mn>2</mn></msub><msup><mtext>v</mtext><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><mn>8</mn></mfrac><mi mathvariant=\"normal\">k</mi><msup><mtext>x</mtext><mn>2</mn></msup><mo>=</mo><mtext>const.</mtext></math><br /><br />Differentiate wrt time<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><msub><mtext>M</mtext><mn>1</mn></msub><mtext>gv</mtext><mo>+</mo><msub><mtext>M</mtext><mn>1</mn></msub><mtext>v</mtext><mfrac><mtext>dv</mtext><mtext>dt</mtext></mfrac><mo>+</mo><mfrac><mrow><msub><mtext>M</mtext><mn>2</mn></msub><mtext>g</mtext></mrow><mn>2</mn></mfrac><mtext>v</mtext><mo>+</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><msub><mtext>M</mtext><mn>2</mn></msub><mtext>v</mtext><mfrac><mtext>dv</mtext><mtext>dt</mtext></mfrac><mo>+</mo><mfrac><mn>1</mn><mn>8</mn></mfrac><mi mathvariant=\"normal\">k</mi><mtext>x.v</mtext><mo>=</mo><mn>0</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mo>-</mo><msub><mtext>M</mtext><mn>1</mn></msub><mtext>g</mtext><mo>+</mo><msub><mtext>M</mtext><mn>1</mn></msub><mfrac><mtext>dv</mtext><mtext>dt</mtext></mfrac><mo>+</mo><mfrac><mrow><msub><mtext>M</mtext><mn>2</mn></msub><mtext>g</mtext></mrow><mn>2</mn></mfrac><mo>+</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><msub><mtext>M</mtext><mn>2</mn></msub><mfrac><mtext>dv</mtext><mtext>dt</mtext></mfrac><mo>+</mo><mfrac><mn>1</mn><mn>8</mn></mfrac><mi mathvariant=\"normal\">k</mi><mtext>x</mtext><mo>=</mo><mn>0</mn></math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014752_AnsExp1_1.jpg\" /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mtext>M</mtext><mn>1</mn></msub><mo>+</mo><mfrac><msub><mtext>M</mtext><mn>2</mn></msub><mn>4</mn></mfrac></mrow></mfenced><mfrac><mtext>dv</mtext><mtext>dt</mtext></mfrac><mo>=</mo><mo>-</mo><mfrac><mi mathvariant=\"normal\">k</mi><mn>4</mn></mfrac><mtext>x</mtext><mo>+</mo><msub><mtext>M</mtext><mn>1</mn></msub><mtext>g</mtext><mo>-</mo><mfrac><mrow><msub><mtext>M</mtext><mn>2</mn></msub><mtext>g</mtext></mrow><mn>2</mn></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">a</mi><mo>=</mo><mfrac><mtext>dv</mtext><mtext>dt</mtext></mfrac><mo>=</mo><mo>-</mo><mfenced><mfrac><mi mathvariant=\"normal\">k</mi><mrow><mn>4</mn><msub><mtext>M</mtext><mn>1</mn></msub><mo>+</mo><msub><mtext>M</mtext><mn>2</mn></msub></mrow></mfrac></mfenced><mtext>x</mtext><mo>+</mo><mfrac><mrow><mn>2</mn><mfenced><mrow><mn>2</mn><msub><mtext>M</mtext><mn>1</mn></msub><mo>-</mo><msub><mtext>M</mtext><mn>2</mn></msub></mrow></mfenced><mtext>g</mtext></mrow><mrow><mn>4</mn><msub><mtext>M</mtext><mn>1</mn></msub><mo>+</mo><msub><mtext>M</mtext><mn>2</mn></msub></mrow></mfrac></math><br /><br />Here,<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><msup><mi mathvariant=\"normal\">ω</mi><mn>2</mn></msup><mo>=</mo><mfrac><mi mathvariant=\"normal\">k</mi><mrow><mn>4</mn><msub><mtext>M</mtext><mn>1</mn></msub><mo>+</mo><msub><mtext>M</mtext><mn>2</mn></msub></mrow></mfrac><mspace width=\"0.5em\"></mspace><mo>⇒</mo><mspace width=\"0.5em\"></mspace><mspace width=\"0.5em\"></mspace><mtext>T</mtext><mo>=</mo><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">π</mi></mrow><mi mathvariant=\"normal\">ω</mi></mfrac><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">π</mi><msqrt><mfrac><mrow><mn>4</mn><msub><mtext>M</mtext><mn>1</mn></msub><mo>+</mo><msub><mtext>M</mtext><mn>2</mn></msub></mrow><mi mathvariant=\"normal\">k</mi></mfrac></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637829b330e1007a7d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "79", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A simple pendulum is taken to<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mn>64</mn><mo>&nbsp;</mo><mi>km</mi></math> above the earth's surface. It's time period will :", "image": null}, "options": [{"id": "5j1kU", "text": "Increase by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>%</mo></math>", "image": null, "isCorrect": true}, {"id": "Hyc6g", "text": "Decrease by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>%</mo></math>", "image": null, "isCorrect": false}, {"id": "wUkZn", "text": "Increase by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>%</mo></math>", "image": null, "isCorrect": false}, {"id": "ZkaQD", "text": "Decrease by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>%</mo></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><mi>l</mi><mi>g</mi></mfra
