<mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mn>2</mn><mi mathvariant=\"script\">l</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></mrow><mrow><mi>x</mi><mi>g</mi></mrow></mfrac></msqrt></math>. Find <math><mi>x</mi><mo>.</mo></math><br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/642358_ques.png\" style=\"width: 200px; height: 104px;\" />", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "Consider a small angular displacement <math><mi>β</mi></math><br /><br />Torque about the rotational axis<br /><br /><math><mi>τ</mi><mo>=</mo><mo>-</mo><mfenced separators=\"|\"><mrow><mi>m</mi><mi>g</mi><mfrac><mrow><mi mathvariant=\"script\">l</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></mrow></mfenced><mi>&nbsp;</mi><mfenced separators=\"|\"><mrow><mi>β</mi></mrow></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>τ</mi><mo>=</mo><mi>I</mi><mi>α</mi></math><br /><br /><math><mn>1</mn><mo>=</mo><mi>m</mi><mfrac><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"script\">l</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>3</mn></mrow></mfrac><mo>=</mo><mi>m</mi><mfrac><mrow><msup><mrow><mi mathvariant=\"script\">l</mi></mrow><mrow><mn>2</mn></mrow></msup><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></mrow><mrow><mn>3</mn></mrow></mfrac></math><br /><br /><math><mo>-</mo><mfenced separators=\"|\"><mrow><mi>m</mi><mi>g</mi><mfrac><mrow><mi mathvariant=\"script\">l</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></mrow></mfenced><mi>&nbsp;</mi><mfenced separators=\"|\"><mrow><mi>β</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mi>m</mi><mi mathvariant=\"script\">l</mi><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></mrow><mrow><mn>3</mn></mrow></mfrac><mi>&nbsp;</mi><mi>α</mi></math><br /><br /><math><mi>α</mi><mo>=</mo><mo>-</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>3</mn><mi>g</mi></mrow><mrow><mn>2</mn><mi mathvariant=\"script\">l</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></mrow></mfrac></mrow></mfenced><mi>β</mi></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mn>2</mn><mi mathvariant=\"script\">l</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></mrow><mrow><mn>3</mn><mi>g</mi></mrow></mfrac></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863880c7601f44eb24d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "14", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A body executes simple harmonic motion under the action of a force,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mn>1</mn></msub></math> with a time period <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>5</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>. If the force is changed to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mn>2</mn></msub></math>, it executes SHM with time period <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>5</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>. If both the forces <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mn>2</mn></msub></math>&nbsp;act simultaneously in the same direction on the body, its time period (in seconds) is", "image": null}, "options": [{"id": "N9Hn2", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>12</mn><mn>25</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "0zR7x", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>24</mn><mn>25</mn></mfrac></math>&nbsp;", "image": null, "isCorrect": false}, {"id": "fjbOe", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>35</mn><mn>24</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "7H3B6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>25</mn><mn>12</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mn>1</mn></msub><mo>=</mo><mo>-</mo><msub><mi>k</mi><mn>1</mn></msub><mi>x</mi><mo>;</mo><mo>&#160;</mo><msub><mi>F</mi><mn>2</mn></msub><mo>=</mo><mo>-</mo><msub><mi>k</mi><mn>2</mn></msub><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>a</mi><mn>1</mn></msub><mo>=</mo><mo>-</mo><mfenced><mfrac><msub><mi>k</mi><mn>1</mn></msub><mi>m</mi></mfrac></mfenced><mi>x</mi><mo>;</mo><mo>&#160;</mo><msub><mi>a</mi><mn>2</mn></msub><mo>=</mo><mo>-</mo><mfenced><mfrac><msub><mi>k</mi><mn>2</mn></msub><mi>m</mi></mfrac></mfenced><mi>x</mi></math></p><p>Also,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>a</mi><mn>1</mn></msub><mo>=</mo><mo>-</mo><msubsup><mi>&#969;</mi><mn>1</mn><mn>2</mn></msubsup><mi>x</mi><mo>;</mo><mo>&#160;</mo><msub><mi>a</mi><mn>2</mn></msub><mo>=</mo><mo>-</mo><msubsup><mi>&#969;</mi><mn>2</mn><mn>2</mn></msubsup><mi>x</mi></math></p><p>Now, resultant force <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><msub><mi>F</mi><mn>1</mn></msub><mo>+</mo><msub><mi>F</mi><mn>2</mn></msub><mo>=</mo><mo>-</mo><msub><mi>k</mi><mn>1</mn></msub><mi>x</mi><mo>-</mo><msub><mi>k</mi><mn>2</mn></msub><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mi>k</mi><mi>x</mi><mo>=</mo><mo>-</mo><msub><mi>k</mi><mn>1</mn></msub><mi>x</mi><mo>-</mo><msub><mi>k</mi><mn>2</mn></msub><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi><mo>=</mo><msub><mi>k</mi><mn>1</mn></msub><mo>+</mo><msub><mi>k</mi><mn>2</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><msup><mi>&#969;</mi><mn>2</mn></msup><mo>=</mo><mi>m</mi><msubsup><mi>&#969;</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><mi>m</mi><msubsup><mi>&#969;</mi><mn>2</mn><mn>2</mn></msubsup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>&#969;</mi><mn>2</mn></msup><mo>=</mo><msubsup><mi>&#969;</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi>&#969;</mi><mn>2</mn><mn>2</mn></msubsup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mfrac><mrow><mn>2</mn><mi>&#960;</mi></mrow><mi>T</mi></mfrac></mfenced><mn>2</mn></msup><mo>=</mo><msup><mfenced><mfrac><mrow><mn>2</mn><mi>&#960;</mi></mrow><msub><mi>T</mi><mn>1</mn></msub></mfrac></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mfrac><mrow><mn>2</mn><mi>&#960;</mi></mrow><msub><mi>T</mi><mn>2</mn></msub></mfrac></mfenced><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msup><mi>T</mi><mn>2</mn></msup></mfrac><mo>=</mo><mfrac><mn>1</mn><msubsup><mi>T</mi><mn>1</mn><mn>2</mn></msubsup></mfrac><mo>+</mo><mfrac><mn>1</mn><msubsup><mi>T</mi><mn>2</mn><mn>2</mn></msubsup></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>T</mi><mo>=</mo><mfrac><mrow><msub><mi>T</mi><mn>1</mn></msub><msub><mi>T</mi><mn>2</mn></msub></mrow><msqrt><msubsup><mi>T</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi>T</mi><mn>2</mn><mn>2</mn></msubsup></msqrt></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>T</mi><mo>=</mo><mfrac><mrow><mfrac><mn>4</mn><mn>5</mn></mfrac><mo>&#215;</mo><mfrac><mn>3</mn><mn>5</mn></mfrac></mrow><msqrt><msup><mfenced><mfrac><mn>4</mn><mn>5</mn></mfrac></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mfrac><mn>3</mn><mn>5</mn></mfrac></mfenced><mn>2</mn></msup></msqrt></mfrac><mo>=</mo><mfrac><mn>12</mn><mn>25</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863868685af7220d615", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "30", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A block of mass <em><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math></em> is attached to a cart of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi mathvariant=\"normal\">m</mi></math> through spring of spring constant <em><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">k</mi></math></em> as shown in the figure. Friction is absent everywhere. The time period of oscillations of the system, when spring is compressed and then released, is<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/caa732af-6003-4417-a055-3f7cce6c4811-image2.jpeg\" />", "image": null}, "options": [{"id": "D5cBg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#x3C0;</mi><msqrt><mfrac><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">k</mi></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "jJplz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">&#x3C0;</mi><msqrt><mfrac><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">k</mi></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "KrfvY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">&#x3C0;</mi><msqrt><mfrac><mrow><mn>5</mn><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">k</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "pEUlb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi mathvariant=\"normal\">&#x3C0;</mi><msqrt><mfrac><mi mathvariant=\"normal\">m</mi><mrow><mn>5</mn><mi mathvariant=\"normal\">k</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "It is equivalent to a system as shown below,<br /><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/3e2087a7-d7ed-4127-80df-7e09dd5be30e-image3.jpeg\" /><br /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mi mathvariant=\"normal\">T</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi><msqrt><mfrac><msub><mi mathvariant=\"normal\">m</mi><mi>reduced</mi></msub><mi mathvariant=\"normal\">k</mi></mfrac></msqrt></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mi mathvariant=\"normal\">T</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi><msqrt><mfrac><mfenced separators=\"|\"><mfrac><mrow><mi mathvariant=\"normal\">m</mi><mo>&#215;</mo><mn>4</mn><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>5</mn><mi mathvariant=\"normal\">m</mi></mrow></mfrac></mfenced><mi mathvariant=\"normal\">k</mi></mfrac></msqrt></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>&#160;&#160;</mo><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi><msqrt><mfrac><mrow><mn>4</mn><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>5</mn><mi mathvariant=\"normal\">k</mi></mrow></mfrac></msqrt><mo>&#160;&#160;</mo><mo>=</mo><mo>&#160;&#160;</mo><mn>4</mn><mi mathvariant=\"normal\">&#960;</mi><msqrt><mfrac><mi mathvariant=\"normal\">m</mi><mrow><mn>5</mn><mi mathvariant=\"normal\">k</mi></mrow></mfrac></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863829b38271d2a7929", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "41", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A weightless rigid rod with a small iron bob at the end is hinged at point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;by a ball and socket joint to the wall so that it can rotate in all directions. The rod is kept in the horizontal position by a vertical inextensible string of length<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mn>20</mn><mo>&nbsp;</mo><mi>cm</mi></math>, fixed at its midpoint. The bob is displaced slightly, perpendicular to the plane of the figure. If the period of small oscillations of the system is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>x</mi><mi>π</mi></mrow><mn>10</mn></mfrac><mo>&nbsp;</mo><mi mathvariant=\"normal\">s</mi></math>, then what is the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>?&nbsp;[Take&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mo>=</mo><mn>10</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>]<br />\r<img alt=\"Picture 171\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/544826.PNG\" style=\"width: 200px; height: 90px;\" />", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "<p>The small oscillation of the bob occur relative to a stationary axis passing through <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math>.&nbsp;The line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CD</mi></math>&nbsp;is perpendicular to the axis&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math>.&nbsp;The bob behaves as a simple pendulum of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CD</mi></math>&nbsp;oscillating due to component of its weight <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mi>g</mi><mi>cos</mi><mi>&#952;</mi></math>.</p><p><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/image21.jpg\" style=\"width: 220px; height: 144px;\" /></p><p>If the length&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AD</mi></math>&nbsp;is equal to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math>, then the length&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CD</mi><mo>=</mo><mi>L</mi><mi>sin</mi><mi>&#952;</mi></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><mrow><mi>L</mi><mi>sin</mi><mi>&#952;</mi></mrow><mrow><mi>g</mi><mi>&#160;</mi><mi>c</mi><mi>o</mi><mi>s</mi><mi>&#952;</mi></mrow></mfrac></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><mrow><mi>L</mi><mi>tan</mi><mi>&#952;</mi></mrow><mi>g</mi></mfrac></msqrt><mi>&#160;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><mrow><mn>2</mn><mi>l</mi></mrow><mi>g</mi></mfrac><mi>&#160;</mi></msqrt><mo>=</mo><mfrac><mrow><mn>2</mn><mi>&#960;</mi></mrow><mn>5</mn></mfrac><mo>=</mo><mfrac><mrow><mn>4</mn><mi>&#960;</mi></mrow><mn>10</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mn>4</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863799e783518f8cb6b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "105", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A particle of mass <math><mi>m</mi></math> is performing the linear simple harmonic motion. Its equilibrium is at <math><mi>x</mi><mo>=</mo><mn>0</mn></math>, force constant is <math><mi mathvariant=\"normal\">K</mi></math> and amplitude of SHM is <math><mi mathvariant=\"normal\">A.</mi></math>&nbsp;The maximum power supplied by the restoring force to the particle during SHM will be:", "image": null}, "options": [{"id": "TKF7x", "text": "<math><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup><msup><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><msqrt><mi>m</mi></msqrt></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "MnUhE", "text": "<math><mfrac><mrow><mn>2</mn><msup><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup><msup><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><msqrt><mi>m</mi></msqrt></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "X0uLv", "text": "<math><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup><msup><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>3</mn><msqrt><mi>m</mi></msqrt></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "N8qpg", "text": "<math><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup><msup><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><msqrt><mi>m</mi></msqrt></mrow></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Power supplied by the restoring force <math><mfenced separators=\"|\"><mrow><mi>F</mi><mo>=</mo><mi>K</mi><mi>x</mi></mrow></mfenced></math> is:<br /><math><mi>P</mi><mo>=</mo><mi>F</mi><mi>V</mi></math><br /><math><mi>P</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mi>K</mi><mi>x</mi></mrow></mfenced><msub><mrow><mi>w</mi></mrow></msub><msqrt><msup><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup></msqrt></math><br /><math><mi>P</mi><mo>=</mo><mi>K</mi><msqrt><mfrac><mrow><mi>K</mi></mrow><mrow><mi>m</mi></mrow></mfrac></msqrt><msqrt><msup><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>x</mi></mrow><mrow><mn>4</mn></mrow></msup><mi></mi></msqrt></math><br /><math><mi>P</mi></math> <em>will be max when</em> <math><mfrac><mrow><mi>d</mi><mi>p</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mo>=</mo><mn>0</mn></math><br /><math><mo>⇒</mo><msup><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></msup><mfenced separators=\"|\"><mrow><mn>2</mn><mi>x</mi></mrow></mfenced><mo>-</mo><mn>4</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>3</mn></mrow></msup><mo>=</mo><mn>0</mn></math><br /><math><mi>x</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac></math><br /><math><msub><mrow><mi>P</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">x</mi></mrow></msub><mo>=</mo><mi>P</mi><msub><mrow><mo>|</mo></mrow><mrow><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">t</mi><mi></mi><mi>x</mi><mo>=</mo><mfrac><mrow><mi>A</mi></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac></mrow></msub><mo>=</mo><mi>K</mi><msqrt><mfrac><mrow><mi>K</mi></mrow><mrow><mi>m</mi></mrow></mfrac></msqrt><msqrt><msup><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>A</mi></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>A</mi></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>4</mn></mrow></msup></msqrt></math><br /><math><msub><mrow><mi>P</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">x</mi></mrow></msub><mo>=</mo><mfrac><mrow><msup><mrow><mi>K</mi></mrow><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup><msup><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><msqrt><mi>m</mi></msqrt></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863785246ee865a843f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "20", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A block of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">M</mi><mn>1</mn></msub></math>&nbsp;is constrained to move along with a moveable pulley of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">M</mi><mn>2</mn></msub></math>&nbsp;which is connected to a spring of force constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">k</mi></math>,&nbsp;as shown in the figure. If the mass of the fixed pulley is negligible and friction is absent everywhere, then the period of small oscillations of the system is<br />\r<u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014752_Ques1_1.jpg\" style=\"width: 203px; height: 257px;\" /></strong></u></p>\r", "image": null}, "options": [{"id": "2wA0M", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">π</mi><msqrt><mfrac><mrow><mn>4</mn><msub><mtext>M</mtext><mn>1</mn></msub><mo>+</mo><msub><mtext>M</mtext><mn>2</mn></msub></mrow><mi mathvariant=\"normal\">k</mi></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "YLTNE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">π</mi><msqrt><mfrac><mrow><mn>4</mn><msub><mtext>M</mtext><mn>2</mn></msub><mo>+</mo><msub><mtext>M</mtext><mn>1</mn></msub></mrow><mtext>k</mtext></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "TlyxA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi mathvariant=\"normal\">π</mi><msqrt><mfrac><mrow><mn>2</mn><msub><mtext>M</mtext><mn>1</mn></msub><mo>+</mo><msub><mtext>M</mtext><mn>2</mn></msub></mrow><mi mathvariant=\"normal\">k</mi></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "iEg8o", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">π</mi><msqrt><mfrac><mrow><mn>4</mn><msub><mtext>M</mtext><mn>1</mn></msub><mo>-</mo><msub><mtext>M</mtext><mn>2</mn></msub></mrow><mi mathvariant=\"normal\">k</mi></mfrac></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If the mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">M</mi><mn>1</mn></msub></math>&nbsp;is displaced by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi></math> and has speed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">v</mi></math>, spring will extend by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi><mo>/</mo><mn>2</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">M</mi><mn>2</mn></msub></math>&nbsp;will have speed&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">v</mi><mo>/</mo><mn>2</mn></math>. Energy of this system can be written as<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><msub><mtext>M</mtext><mn>1</mn></msub><mtext>gx</mtext><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msub><mtext>M</mtext><mn>1</mn></msub><msup><mtext>v</mtext><mn>2</mn></msup><mo>+</mo><msub><mtext>M</mtext><mn>2</mn></msub><mtext>g</mtext><mfrac><mtext>x</mtext><mn>2</mn></mfrac><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msub><mtext>M</mtext><mn>2</mn></msub><msup><mfenced><mfrac><mrow><mtex ><mi mathvariant=\"normal\">k</mi><mrow><mi>l</mi><mo>&#8289;</mo></mrow></mfrac></math>&nbsp;( where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">k</mi></math>&nbsp;is a constant )<br /><br />Here,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>l</mi><mn>1</mn></msub><mo>=</mo><mfrac><mi mathvariant=\"normal\">k</mi><msub><mi mathvariant=\"normal\">&#957;</mi><mn>1</mn></msub></mfrac></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>l</mi><mn>2</mn></msub><mo>=</mo><mfrac><mi mathvariant=\"normal\">k</mi><msub><mi mathvariant=\"normal\">&#957;</mi><mn>2</mn></msub></mfrac></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>l</mi><mn>3</mn></msub><mo>=</mo><mfrac><mi mathvariant=\"normal\">k</mi><msub><mi mathvariant=\"normal\">&#957;</mi><mn>3</mn></msub></mfrac></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">&#957;</mi></mfrac></math><br /><br />But&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">l</mtext><mo>=</mo><msub><mtext mathvariant=\"italic\">l</mtext><mn>1</mn></msub><mo>+</mo><msub><mtext mathvariant=\"italic\">l</mtext><mn>2</mn></msub><mo>+</mo><msub><mtext mathvariant=\"italic\">l</mtext><mn>3</mn></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mfrac><mn>1</mn><mi mathvariant=\"normal\">&#957;</mi></mfrac><mo>=</mo><mfrac><mn>1</mn><msub><mi mathvariant=\"normal\">&#957;</mi><mn>1</mn></msub></mfrac><mo>+</mo><mfrac><mn>1</mn><msub><mi mathvariant=\"normal\">&#957;</mi><mn>2</mn></msub></mfrac><mo>+</mo><mfrac><mn>1</mn><msub><mi mathvariant=\"normal\">&#957;</mi><mn>3</mn></msub></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863635db83dd1a3faad", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "19", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The time period of oscillations of a block attached to a spring is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">t</mi><mn>1</mn></msub></math>. When the spring is replaced by another spring, the time period of the block is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">t</mi><mn>2</mn></msub></math>. If both the springs are connected in series and the block is made to oscillate using the combination, then the time period of the block is", "image": null}, "options": [{"id": "xd5FY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>T</mtext><mo>=</mo><msub><mi mathvariant=\"normal\">t</mi><mn>1</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">t</mi><mn>2</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "CWgnR", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mtext>T</mtext><mn>2</mn></msup><mo>=</mo><msubsup><mi mathvariant=\"normal\">t</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi mathvariant=\"normal\">t</mi><mn>2</mn><mn>2</mn></msubsup></math>", "image": null, "isCorrect": true}, {"id": "BAZRD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mtext>T</mtext><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo><msubsup><mi mathvariant=\"normal\">t</mi><mn>1</mn><mrow><mo>-</mo><mn>1</mn></mrow></msubsup><mo>+</mo><msubsup><mi mathvariant=\"normal\">t</mi><mn>2</mn><mrow><mo>-</mo><mn>1</mn></mrow></msubsup></math>", "image": null, "isCorrect": false}, {"id": "iVV2y", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mtext>T</mtext><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>=</mo><msubsup><mi mathvariant=\"normal\">t</mi><mn>1</mn><mrow><mo>-</mo><mn>2</mn></mrow></msubsup><mo>+</mo><msubsup><mi mathvariant=\"normal\">t</mi><mn>2</mn><mrow><mo>-</mo><mn>2</mn></mrow></msubsup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When springs are in series, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">k</mi><mo>=</mo><mfrac><mrow><msub><mi mathvariant=\"normal\">k</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">k</mi><mn>2</mn></msub></mrow><mrow><msub><mi mathvariant=\"normal\">k</mi><mn>1</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">k</mi><mn>2</mn></msub></mrow></mfrac></math>&nbsp;<br /><br />For&nbsp; first&nbsp; spring, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">t</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">π</mi><msqrt><mfrac><mtext>m</mtext><msub><mi mathvariant=\"normal\">k</mi><mn>1</mn></msub></mfrac></msqrt></math><br /><br />For&nbsp; Second&nbsp; spring, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">t</mi><mn>2</mn></msub><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">π</mi><msqrt><mfrac><mtext>m</mtext><msub><mi mathvariant=\"normal\">k</mi><mn>2</mn></msub></mfrac></msqrt></math><br /><br /><math> <mrow> <mo>∴</mo> </mrow> </math>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi mathvariant=\"normal\">t</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi mathvariant=\"normal\">t</mi><mn>2</mn><mn>2</mn></msubsup><mo>=</mo><mfrac><mrow><mn>4</mn><msup><mi mathvariant=\"normal\">π</mi><mn>2</mn></msup><mtext>m</mtext></mrow><msub><mi mathvariant=\"normal\">k</mi><mn>1</mn></msub></mfrac><mo>+</mo><mfrac><mrow><mn>4</mn><msup><mi mathvariant=\"normal\">π</mi><mn>2</mn></msup><mtext>m</mtext></mrow><msub><mi mathvariant=\"normal\">k</mi><mn>2</mn></msub></mfrac><mo>=</mo><mn>4</mn><msup><mi mathvariant=\"normal\">π</mi><mn>2</mn></msup><mtext>m</mtext><mfenced><mfrac><mrow><msub><mi mathvariant=\"normal\">k</mi><mn>1</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">k</mi><mn>2</mn></msub></mrow><mrow><msub><mi mathvariant=\"normal\">k</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">k</mi><mn>2</mn></msub></mrow></mfrac></mfenced></math><br /><br />or&nbsp; &nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi mathvariant=\"normal\">t</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi mathvariant=\"normal\">t</mi><mn>2</mn><mn>2</mn></msubsup><mo>=</mo><msup><mfenced close=\"]\" open=\"[\"><mrow><mn>2</mn><mi mathvariant=\"normal\">π</mi><msqrt><mfrac><mrow><mtext>m</mtext><mfenced><mrow><msub><mi mathvariant=\"normal\">k</mi><mn>1</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">k</mi><mn>2</mn></msub></mrow></mfenced></mrow><mrow><msub><mi mathvariant=\"normal\">k</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">k</mi><mn>2</mn></msub></mrow></mfrac></msqrt></mrow></mfenced><mn>2</mn></msup></math><br /><br />or&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi mathvariant=\"normal\">t</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi mathvariant=\"normal\">t</mi><mn>2</mn><mn>2</mn></msubsup><mo>=</mo><msup><mtext>T</mtext><mn>2</mn></msup></math> .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86362e992b3a0494556", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "57", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A cylindrical piston of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> slides smoothly inside a long cylinder closed at one end, enclosing a certain mass of gas. The cylinder is kept with its axis horizontal. If the piston is disturbed from its equilibrium position, it oscillates simple harmonically. The period of oscillation will be (Assume isothermal process)<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/944a85e3-f42b-4cda-9c32-1e4291230961.png\" style=\"width:1.76042in;height:1.26042in\" />", "image": null}, "options": [{"id": "6cNaV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">π</mi><msqrt><mfenced separators=\"|\"><mfrac><mrow><mi>M</mi><mi>h</mi></mrow><mrow><mi>P</mi><mi>A</mi></mrow></mfrac></mfenced></msqrt></math>", "image": null, "isCorrect": true}, {"id": "09Nbq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi><msqrt><mfenced separators=\"|\"><mfrac><mrow><mi>M</mi><mi>A</mi></mrow><mrow><mi>P</mi><mi>h</mi></mrow></mfrac></mfenced></msqrt></math>", "image": null, "isCorrect": false}, {"id": "r6TGH", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi><msqrt><mfenced separators=\"|\"><mfrac><mi>M</mi><mrow><mi>P</mi><mi>A</mi><mi>h</mi></mrow></mfrac></mfenced></msqrt></math>", "image": null, "isCorrect": false}, {"id": "MkwYo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi><msqrt><mi>M</mi><mi>P</mi><mi>h</mi><mi>A</mi></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Let the piston be displaced through distance <math><mi mathvariant=\"normal\">x</mi></math> towards left, then volume decreases, pressure increases. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Δ</mi><mi>P</mi></math> is an increase in pressure and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Δ</mi><mi>V</mi></math> is a decrease in volume, then considering the process to take place slowly (i.e. Isothermal)<br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/431645e3-9228-4c63-9009-27c9d485201e.png\" style=\"width:1.68681in;height:1.34028in\" /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub><mo>=</mo><msub><mi>P</mi><mn>2</mn></msub><msub><mi>V</mi><mn>2</mn></msub><mo>⇒</mo><mi>P</mi><mi>V</mi><mo>=</mo><mo>(</mo><mi>P</mi><mo>+</mo><mi mathvariant=\"normal\">Δ</mi><mi>P</mi><mo>)</mo><mo>(</mo><mi>V</mi><mo>-</mo><mi>ΔV</mi><mo>)</mo></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>P</mi><mi>V</mi><mo>=</mo><mi>P</mi><mi>V</mi><mo>+</mo><mi mathvariant=\"normal\">Δ</mi><mi>P</mi><mi>V</mi><mo>-</mo><mi>P</mi><mi mathvariant=\"normal\">Δ</mi><mi>V</mi><mo>-</mo><mi mathvariant=\"normal\">Δ</mi><mi>P</mi><mi mathvariant=\"normal\">Δ</mi><mi>V</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi mathvariant=\"normal\">Δ</mi><mi>P</mi><mo>.</mo><mi>V</mi><mo>-</mo><mi>P</mi><mo>.</mo><mi mathvariant=\"normal\">Δ</mi><mi>V</mi><mo>=</mo><mn>0</mn><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>(</mo><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">g</mi><mo>&nbsp;</mo><mi mathvariant=\"normal\">Δ</mi><mi>P</mi><mo>.</mo><mi mathvariant=\"normal\">Δ</mi><mi>V</mi><mo>)</mo></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Δ</mi><mi>P</mi><mo>(</mo><mi>A</mi><mi>h</mi><mo>)</mo><mo>=</mo><mi>P</mi><mo>(</mo><mi>A</mi><mi>x</mi><mo>)</mo><mo>⇒</mo><mi mathvariant=\"normal\">Δ</mi><mi>P</mi><mo>=</mo><mfrac><mrow><mi>P</mi><mo>⋅</mo><mi>x</mi></mrow><mi>h</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><mo>-</mo><mfrac><mrow><mi>P</mi><mi>A</mi></mrow><mi>h</mi></mfrac><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ω</mi><mo>=</mo><msqrt><mfrac><mrow><mi>P</mi><mi>A</mi></mrow><mrow><mi>M</mi><mi>h</mi></mrow></mfrac></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>M</mi><mi>h</mi></mrow><mrow><mi>P</mi><mi>A</mi></mrow></mfrac></msqrt></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635f40f1a0e91630f5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "21", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A cylinder of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi></math> and radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> lies on a plank of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi></math> as shown. The surface between plank and ground is smooth, and between cylinder and plank is rough. Assuming no slipping between cylinder and plank, the time period of oscillations (when displaced from equilibrium) of the sys
