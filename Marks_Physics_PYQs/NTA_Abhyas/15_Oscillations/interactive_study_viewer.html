><mi>t</mi></math>&nbsp;graph of a particle undergoing simple harmonic motion is shown below. The acceleration of the particle at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><mo>&nbsp;</mo><mi mathvariant=\"normal\">s</mi></math>&nbsp;is:<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/654228_que.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 200px; height: 142px;\" />", "image": null}, "options": [{"id": "QqQZU", "text": "<math><mfrac><mrow><msqrt><mn>3</mn></msqrt></mrow><mrow><mn>32</mn></mrow></mfrac><msup><mrow><mi mathvariant=\"normal\">&#960;</mi></mrow><mrow><mn>2</mn></mrow></msup></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "t3Jqy", "text": "<math><mfrac><mrow><mo>-</mo><msup><mrow><mi mathvariant=\"normal\">&#960;</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>32</mn></mrow></mfrac></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "IItzk", "text": "<math><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">&#960;</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>32</mn></mrow></mfrac></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "KNVQF", "text": "<math><mo>-</mo><mfrac><mrow><msqrt><mn>3</mn></msqrt></mrow><mrow><mn>32</mn></mrow></mfrac><msup><mrow><mi mathvariant=\"normal\">&#960;</mi></mrow><mrow><mn>2</mn></mrow></msup></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mi>sin</mi><mo>&#8289;</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi></mrow><mn>8</mn></mfrac><mi>t</mi></mrow></mfenced></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mo>-</mo><msup><mi mathvariant=\"normal\">&#969;</mi><mn>2</mn></msup><mi>x</mi><mo>=</mo><mo>-</mo><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi></mrow><mn>8</mn></mfrac><mo>&#215;</mo><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi></mrow><mn>8</mn></mfrac><mo>&#215;</mo><mi>sin</mi><mo>&#8289;</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi></mrow><mn>8</mn></mfrac><mo>&#215;</mo><mfrac><mn>4</mn><mn>3</mn></mfrac></mrow></mfenced></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>a</mi><mo>=</mo><mfrac><msup><mi mathvariant=\"normal\">&#960;</mi><mn>2</mn></msup><mn>16</mn></mfrac><mo>&#215;</mo><mfrac><msqrt><mn>3</mn></msqrt><mn>2</mn></mfrac><mo>=</mo><mfrac><mrow><mo>-</mo><msqrt><mn>3</mn></msqrt><msup><mi mathvariant=\"normal\">&#960;</mi><mn>2</mn></msup></mrow><mn>32</mn></mfrac></math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>cm</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c5173e781c2c94bc", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "90", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "When a wave travels in a medium, the particle displacement is given by the equation <math><mi>Y</mi><mo>=</mo><mi>a</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mn>2</mn><mi>π</mi><mfenced separators=\"|\"><mrow><mi>b</mi><mi>t</mi><mo>-</mo><mi>c</mi><mi>x</mi></mrow></mfenced></mrow></mrow></math> where, <math><mi>a</mi><mo>,</mo><mi>&nbsp;</mi><mi>b</mi></math> and <math><mi>c</mi></math> are constant. The maximum particle velocity will be twice the wave velocity, if", "image": null}, "options": [{"id": "57brb", "text": "<math><mi>a</mi><mi>c</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>π</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "Ipcee", "text": "<math><mi>a</mi><mi>c</mi><mo>=</mo><mi>π</mi></math>", "image": null, "isCorrect": false}, {"id": "kWNB8", "text": "<math><mi>b</mi><mo>=</mo><mi>a</mi><mi>c</mi></math>", "image": null, "isCorrect": false}, {"id": "8c7rd", "text": "<math><mi>b</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>a</mi><mi>c</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, <math><mi>Y</mi><mo>=</mo><mi>a</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mn>2</mn><mi>π</mi><mfenced separators=\"|\"><mrow><mi>b</mi><mi>t</mi><mo>-</mo><mi>c</mi><mi>x</mi></mrow></mfenced></mrow></mrow></math>    ...(i)<br/><br/>and standard form <math><mi>Y</mi><mo>=</mo><mi>A</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mi>ω</mi><mi>t</mi><mo>-</mo><mi>k</mi><mi>x</mi></mrow></mfenced></mrow></mrow></math> <br/><br/>Thus, we have <br/><br/> <math><mi>ω</mi><mo>=</mo><mn>2</mn><mi>π</mi><mi>b</mi></math>  and  <math><mi>K</mi><mo>=</mo><mn>2</mn><mi>π</mi><mi>c</mi></math> <br/><br/>or <math><mfrac><mrow><mn>2</mn><mi>π</mi></mrow><mrow><mi>λ</mi></mrow></mfrac><mo>=</mo><mn>2</mn><mi>π</mi><mi>c</mi><mo>⇒</mo><mi>c</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>λ</mi></mrow></mfrac></math> <br/><br/> <math><mo>∴</mo><mi> </mi></math> Speed of wave,<br/><br/> <math><mi>v</mi><mo>=</mo><mfrac><mrow><mi>ω</mi></mrow><mrow><mi>K</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>π</mi><mi>b</mi></mrow><mrow><mn>2</mn><mi>π</mi><mi>c</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>b</mi></mrow><mrow><mi>c</mi></mrow></mfrac></math> <br/><br/>Differentiating Equation (i) w.r.t.t, we get<br/><br/> <math><mfrac><mrow><mi>d</mi><mi>Y</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo></math>  Speed of particle,<br/><br/> <math><msub><mrow><mi>v</mi></mrow><mrow><mi>p</mi></mrow></msub><mo>=</mo><mi>a</mi><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mn>2</mn><mi>π</mi><mfenced separators=\"|\"><mrow><mi>b</mi><mi>t</mi><mo>-</mo><mi>c</mi><mi>x</mi></mrow></mfenced><mo>&sdot;</mo><mn>2</mn><mi>π</mi><mi>b</mi></mrow></mrow></math> <br/><br/> <math><msub><mrow><mi>v</mi></mrow><mrow><mi>p</mi></mrow></msub><mo>=</mo><mn>2</mn><mi>π</mi><mi>a</mi><mi>b</mi><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mn>2</mn><mi>π</mi><mfenced separators=\"|\"><mrow><mi>b</mi><mi>t</mi><mo>-</mo><mi>c</mi><mi>x</mi></mrow></mfenced></mrow></mrow></math> <br/><br/>For <math><msub><mrow><mi>v</mi></mrow><mrow><msub><mrow><mi>p</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">x</mi></mrow></msub></mrow></msub><mo>=</mo><mn>2</mn><mi>π</mi><mi>a</mi><mi>b</mi></math> <br/><br/>According to the question's condition,<br/><br/> <math><msub><mrow><mi>v</mi></mrow><mrow><msub><mrow><mi>p</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">x</mi></mrow></msub></mrow></msub><mo>=</mo><mn>2</mn><mi>v</mi></math> <br/><br/> <math><mo>⇒</mo><mn>2</mn><mi>π</mi><mi>a</mi><mi>b</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mo>&sdot;</mo><mi>b</mi></mrow><mrow><mi>c</mi></mrow></mfrac></math>   (Putting values)<br/><br/> <math><mo>⇒</mo><mi>π</mi><mi>a</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>c</mi></mrow></mfrac></math>  or  <math><mi>a</mi><mi>c</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>π</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c1c9563e95462815", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "03", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The displacement of a particle of mass <math> <mrow> <mtext>3&nbsp;g</mtext> </mrow> </math> executing simple harmonic motion is given by <math><mi>Y</mi><mo>=</mo><mn>3</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">sin</mi><mi mathvariant=\"normal\"></mi><mo>⁡</mo><mo>(</mo><mn>0.2</mn><mi>t</mi><mo>)</mo></math> in SI units. The <math> <mrow> <mtext>KE</mtext> </mrow> </math> of the particle at a point which is at a distance equal to <math> <mrow> <mtext>1/3</mtext> </mrow> </math> of its amplitude from its mean position is", "image": null}, "options": [{"id": "T9NIf", "text": "<math><mn>12</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><mi> </mi><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "P2lWi", "text": "<math><mn>25</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><mi> </mi><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "uxW8V", "text": "<math><mn>0.48</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><mi>&nbsp;</mi><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": true}, {"id": "arPAu", "text": "<math><mn>0.24</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><mi> </mi><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Displacement of particle in the case of SHM<br /><br /><math><mi>y</mi><mo>=</mo><mi>A</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mo>(</mo><mi>ω</mi><mi>t</mi><mo>)</mo></mrow></mrow></math> ...(i)<br /><br /><math><mi>y</mi><mo>=</mo><mn>3</mn><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mo>(</mo><mn>0.2</mn><mi>&nbsp;</mi><mi>t</mi><mo>)</mo></mrow></mrow></math> ...(ii)(given)<br /><br />Comparing Eqs. (i) and (ii), we get<br /><br /><math><mi>A</mi><mo>=</mo><mn>3</mn><mo>,</mo><mi>&nbsp;</mi><mi>ω</mi><mo>=</mo><mn>0.2</mn></math><br /><br />Now, particle distance <math><mi>x</mi><mo>=</mo><mfrac><mrow><mi>A</mi></mrow><mrow><mn>3</mn></mrow></mfrac><mo>=</mo><mn>1</mn></math><br /><br />Kinetic energy in SHM<br /><br />= <math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>m</mi><msup><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>(</mo><msup><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>)</mo></math><br /><br />= <math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>×</mo><mn>3</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup><msup><mrow><mfenced separators=\"|\"><mrow><mn>0.2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>[</mo><msup><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msup><mo>]</mo></math><br /><br /><math><mo>=</mo><mn>0.48</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></math> J", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863bd3df041bd2f29bb", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "39", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An object of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi>kg</mi></math> executes simple harmonic oscillations along the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi></math>-axis, with a frequency of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mi>π</mi></mfrac><mo>&nbsp;</mo><mi mathvariant=\"normal\">H</mi><mi mathvariant=\"normal\">z</mi></math>. At the position <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>, the object has a kinetic energy of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>24</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi></math>. The amplitude of the oscillation is&nbsp;", "image": null}, "options": [{"id": "X4B4E", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>2</mn></mfrac><mo>&#xA0;</mo><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "QFy9b", "text": "<math><mn>2</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": true}, {"id": "c1Wvc", "text": "<math><mn>4</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "KPzml", "text": "<math><mn>8</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi><mo mathvariant=\"italic\">.</mo><mi>E</mi><mo mathvariant=\"italic\">.</mo><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><msup><mi>ω</mi><mn>2</mn></msup><mfenced separators=\"|\"><mrow><msup><mi>A</mi><mn>2</mn></msup><mo>-</mo><msup><mi>x</mi><mn>2</mn></msup></mrow></mfenced><mo>=</mo><mn>24</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">J</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>×</mo><mn>1</mn><mo>×</mo><mn>16</mn><mfenced separators=\"|\"><mrow><msup><mi>A</mi><mn>2</mn></msup><mo>-</mo><mn>1</mn></mrow></mfenced><mo>=</mo><mn>24</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b61670e1a9f920b8", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "87", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A highly rigid cubical block <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> of small mass <math><mi>M</mi></math> and side <math><mi>L</mi></math> is fixed rigidly on to another cubical block <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> of the same dimensions and of low modulus of rigidity <math><mi>η</mi></math> such that the lower face of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> completely covers the upper face of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>. The lower face of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> is rigidly held on a horizontal surface. A small force <math><mi>F</mi></math> is applied perpendicular to one of the side faces of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>. After the force is withdrawn, block&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> executes small oscillations, the time period of which is given by&nbsp;", "image": null}, "options": [{"id": "aM6f4", "text": "<math><mrow><mn>2</mn><mi>π</mi><msqrt><mrow><mi>M</mi><mi>η</mi><mi>L</mi></mrow></msqrt></mrow></math>", "image": null, "isCorrect": false}, {"id": "iT7MT", "text": "<math><mrow><mn>2</mn><mi>π</mi><msqrt><mrow><mfrac linethickness=\"1\"><mrow><mi>M</mi><mi>η</mi></mrow><mi>L</mi></mfrac></mrow></msqrt></mrow></math>", "image": null, "isCorrect": false}, {"id": "XHs1q", "text": "<math><mrow><mn>2</mn><mi>π</mi><msqrt><mrow><mfrac linethickness=\"1\"><mrow><mi>M</mi><mi>L</mi></mrow><mi>η</mi></mfrac></mrow></msqrt></mrow></math>", "image": null, "isCorrect": false}, {"id": "z0T5L", "text": "<math><mrow><mn>2</mn><mi>π</mi><msqrt><mrow><mfrac linethickness=\"1\"><mi>M</mi><mrow><mi>η</mi><mi>L</mi></mrow></mfrac></mrow></msqrt></mrow></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Modulus of rigidity,<math> <mrow> <mi>η</mi><mo>=</mo><mfrac> <mi>F</mi> <mrow> <mi>A</mi><mo>.</mo><mtext> </mtext><mi>θ</mi></mrow> </mfrac> </mrow> </math> Here, <math> <mrow> <mi>A</mi><mo>=</mo><msup> <mi>L</mi> <mn>2</mn> </msup> </mrow> </math><br /><br />And<br /><br /><math> <mrow> <mi>θ</mi> <mo>=</mo> <mfrac> <mrow> <mtext>x</mtext> </mrow> <mrow> <mi>L</mi> </mrow> </mfrac> </mrow> </math><br />&nbsp;<br />Therefore, restoring force is <math> <mrow> <mi>F</mi><mo>=</mo><mo>−</mo><mi>η</mi><mtext> </mtext><mi>A</mi><mi>θ</mi><mo>=</mo><mo>−</mo><mi>η</mi><mi>L</mi><mi>x</mi></mrow> </math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0007491_Ques4_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 290px; height: 218px;\" /><br />&nbsp;<br />Or acceleration, <math> <mrow> <mi>a</mi><mo>=</mo><mfrac> <mi>F</mi> <mi>M</mi> </mfrac> <mo>=</mo><mo>−</mo><mfrac> <mrow> <mi>η</mi><mi>L</mi></mrow> <mi>M</mi> </mfrac> <mi>x</mi></mrow> </math><br /><br />Since, <math> <mrow> <mi>a</mi><mo>∝</mo><mi>x</mi> </mrow> </math>, oscillations are simaple harmonic in nature, time period of which is given by<br /><br /><math> <mrow> <mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt> <mrow> <mrow><mo>|</mo> <mrow> <mfrac> <mrow> <mi>d</mi><mi>i</mi><mi>s</mi><mi>p</mi><mi>l</mi><mi>a</mi><mi>c</mi><mi>e</mi><mi>m</mi><mi>e</mi><mi>n</mi><mi>t</mi></mrow> <mrow> <mi>a</mi><mi>c</mi><mi>c</mi><mi>e</mi><mi>l</mi><mi>e</mi><mi>r</mi><mi>a</mi><mi>t</mi><mi>i</mi><mi>o</mi><mi>n</mi></mrow> </mfrac> </mrow> <mo>|</mo></mrow></mrow> </msqrt> <mo>=</mo><mn>2</mn><mi>π</mi><msqrt> <mrow> <mrow><mo>|</mo> <mrow> <mfrac> <mi>x</mi> <mi>a</mi> </mfrac> </mrow> <mo>|</mo></mrow></mrow> </msqrt> <mo>=</mo><mn>2</mn><mi>π</mi><msqrt> <mrow> <mfrac> <mi>M</mi> <mrow> <mi>η</mi><mi>L</mi></mrow> </mfrac> </mrow> </msqrt> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863adf214ad14fefb4b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "81", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "There is a cylindrical bottle of negligible mass and radius <math><mn>2.5</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math> floating in the water of density <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>10</mn><mn>3</mn></msup><mo>&nbsp;</mo><mi>kg</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>3</mn></mrow></msup></math> filled with <math><mn>310</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">l</mi></math> of water inside it. Now the bottle is slightly dipped into water and released. The frequency of oscillation is", "image": null}, "options": [{"id": "3n01r", "text": "<math><mn>3.75&nbsp;</mn><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>&nbsp;</mi></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "DMQLo", "text": "<math><mn>1.25&nbsp;</mn><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>&nbsp;</mi></mrow></mrow></math>", "image": null, "isCorrect": true}, {"id": "WUTZr", "text": "<math><mn>2.75&nbsp;</mn><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>&nbsp;</mi></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "7ZXRq", "text": "<math><mn>3.00&nbsp;</mn><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>&nbsp;</mi></mrow></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let at equilibrium, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math> length of the bottle is immersed in water:-<br /><br />So, <math><mi>m</mi><mi>g</mi><mo>=</mo><msub><mrow><mi>f</mi></mrow><mrow><mi>b</mi><mi>u</mi><mi>o</mi></mrow></msub></math><br /><br /><math><mi>m</mi><mi>g</mi><mo>=</mo><mi>&#961;</mi><mfenced separators=\"|\"><mrow><mi>A</mi><mi>y</mi></mrow></mfenced><mi>g</mi></math> ..... <math><mo>(</mo><mn>1</mn><mo>)</mo></math> [Equilibrium Condition]<br /><br />Now it is further pushed by distance <math><mi>&#8242;</mi><mi>x</mi><mi>&#8242;</mi></math><br /><br /><math><msub><mrow><mi>F</mi></mrow><mrow><mi>r</mi><mi>e</mi><mi>s</mi><mi>t</mi><mi>o</mi><mi>r</mi><mi>i</mi><mi>n</mi><mi>g</mi></mrow></msub><mo>=</mo><mi>&#961;</mi><mo>[</mo><mi>A</mi><mfenced close=\"]\" separators=\"|\"><mrow><mi>x</mi><mo>+</mo><mi>y</mi><mo>)</mo></mrow></mfenced><mi>g</mi><mo>-</mo><mi>m</mi><mi>g</mi></math><br /><br /><math><mi>m</mi><msup><mrow><mi>&#969;</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>x</mi><mo>=</mo><mi>&#961;</mi><mi>A</mi><mi>x</mi><mi>g</mi><mo>+</mo><mi>&#961;</mi><mi>A</mi><mi>y</mi><mi>g</mi><mo>-</mo><mi>m</mi><mi>g</mi></math><br /><br /><math><mi>&#969;</mi><mo>=</mo><msqrt><mfrac><mrow><mi>&#961;</mi><mi>A</mi><mi>g</mi></mrow><mrow><mi>m</mi></mrow></mfrac></msqrt><mo>=</mo><msqrt><mfrac><mrow><mi>&#961;</mi><mi>A</mi><mi>g</mi></mrow><mrow><mi>&#961;</mi><mi>V</mi></mrow></mfrac></msqrt><mo>=</mo><msqrt><mfrac><mrow><mi>&#960;</mi><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>g</mi></mrow><mrow><mi>V</mi></mrow></mfrac></msqrt><mo>=</mo><mn>2</mn><mi>&#960;</mi><mi>f</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>f</mi><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mi>&#960;</mi></mrow></mfrac><msqrt><mfrac><mrow><mi>&#960;</mi><msup><mi>r</mi><mn>2</mn></msup><mi>g</mi></mrow><mi>V</mi></mfrac></msqrt><mo>=</mo><mn>1</mn><mo>.25</mo><mi mathvariant=\"normal\">&#160;</mi><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mi mathvariant=\"normal\">&#160;</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a3d3427daf79ad33", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "80", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two blocks with masses <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mn>1</mn></msub><mo>=</mo><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">&nbsp;</mi><msub><mi>m</mi><mn>2</mn></msub><mo>=</mo><mn>2</mn><mo>&nbsp;</mo><mi>kg</mi></math>&nbsp;are connected by a spring constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi><mo>=</mo><mn>24</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> and placed on a frictionless horizontal surface. The block <math><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub></math> is imparted an initial velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mn>0</mn></msub><mo>=</mo><mn>12</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mi mathvariant=\"normal\">&nbsp;</mi><mo>-</mo><mn>1</mn></mrow></msup></math> to the right, the value of amplitude of oscillation (in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>cm</mi></math>) of the block with respect to other is", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "The amplitude of oscillations will be the maximum compression in the spring. At the time of maximum compression velocities of both the blocks are equal say <math><mi>v</mi></math>, then using law of conservation of momentum,<br /><br /><math><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>v</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mfenced separators=\"|\"><mrow><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced><mi>v</mi></math><br /><br />or <math><mn>1</mn><mo>×</mo><mn>12</mn><mo>=</mo><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mn>2</mn></mrow></mfenced><mi>v</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>v</mi><mo>=</mo><mn>4</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br />Using law of conservation of energy, we have<br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub><msubsup><mrow><mi>v</mi></mrow><mrow><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>k</mi><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mfenced separators=\"|\"><mrow><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br />Putting the value and solving we get <math><mi>x</mi><mo>=</mo><mn>2</mn></math> cm", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a0937112c8a2eb32", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "104", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A simple harmonic wave of amplitude<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mn>8</mn><mo>&nbsp;</mo></math>unit travels along the positive x-axis. At given instant of time, for a particle at a distance of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi>cm</mi></math> from the origin, the displacement is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>+</mo><mn>6</mn></math> unit and for a particle at a distance of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>25</mn><mo>&nbsp;</mo><mi>cm</mi></math> from the origin, the displacement is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>+</mo><mn>4</mn><mo>&nbsp;</mo></math>unit. Calculate the wavelength.", "image": null}, "options": [{"id": "90HWZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>&#160;</mo><mi>cm</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 106px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "XrS9S", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>230</mn><mo>&#160;</mo><mi>cm</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 106px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "JzNcM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>210</mn><mo>&#160;</mo><mi>cm</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 106px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "D98x0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>250</mn><mo>&#160;</mo><mi>cm</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 106px; top: 37.6667px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math><mi>Y</mi><mo>=</mo><mi>A</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mfrac><mrow><mn>2</mn><mi>&#960;</mi></mrow><mrow><mi>&#955;</mi></mrow></mfrac></mrow></mrow><mfenced separators=\"|\"><mrow><mi>v</mi><mi>t</mi><mo>-</mo><mi>x</mi></mrow></mfenced></math><br /><br /><math><mfrac><mrow><mi>Y</mi></mrow><mrow><mi>A</mi></mrow></mfrac><mo>=</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mn>2</mn><mi>&#960;</mi></mrow></mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>t</mi></mrow><mrow><mi>T</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mi>x</mi></mrow><mrow><mi>&#955;</mi></mrow></mfrac></mrow></mfenced></math><br /><br />In first case, <math><mfrac><mrow><msub><mrow><mi>Y</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><mi>A</mi></mrow></mfrac><mo>=</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mn>2</mn><mi>&#960;</mi></mrow></mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>t</mi></mrow><mrow><mi>T</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><msub><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><mi>&#955;</mi></mrow></mfrac></mrow></mfenced></math><br /><br />Here, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Y</mi><mn>1</mn></msub><mo>=</mo><mo>+</mo><mi>&#160;</mi><mn>6</mn><mo>,</mo><mi>A</mi><mo>=</mo><mn>8</mn><mo>,</mo><msub><mi>x</mi><mn>1</mn></msub><mo>=</mo><mn>10</mn><mi mathvariant=\"normal\">&#160;</mi><mi>cm</mi></math><br /><br /><math><mfrac><mrow><mn>6</mn></mrow><mrow><mn>8</mn></mrow></mfrac><mo>=</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mn>2</mn><mi>&#960;</mi></mrow></mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>t</mi></mrow><mrow><mi>T</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>10</mn></mrow><mrow><mi>&#955;</mi></mrow></mfrac></mrow></mfenced></math> .... (i)<br /><br />Similarly in the second case,<br /><br /><math><mfrac><mrow><mn>4</mn></mrow><mrow><mn>8</mn></mrow></mfrac><mo>=</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mn>2</mn><mi>&#960;</mi></mrow></mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>t</mi></mrow><mrow><mi>T</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>25</mn></mrow><mrow><mi>&#955;</mi></mrow></mfrac></mrow></mfenced></math> ... (ii)<br /><br />From equation (i),<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>2&#960;&#8203;&#160;</mi><mfenced separators=\"|\"><mrow><mfrac><mi>t</mi><mi>T</mi></mfrac><mo>-</mo><mfrac><mn>10</mn><mi>&#955;</mi></mfrac></mrow></mfenced><mo>=</mo><msup><mi>sin</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#8289;</mo><mfenced separators=\"|\"><mfrac><mn>6</mn><mn>8</mn></mfrac></mfenced><mo>=</mo><mn>0.85</mn><mi mathvariant=\"normal\">&#160;</mi><mi>rad</mi></math><br /><br /><math><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi></math> <math><mfrac><mrow><mi>t</mi></mrow><mrow><mi>T</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>10</mn></mrow><mrow><mi>&#955;</mi></mrow></mfrac><mo>=</mo><mn>0.14</mn></math> .... (iii)<br /><br />Similarly from equation (ii),<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>&#960;</mi><mfenced separators=\"|\"><mrow><mfrac><mi>t</mi><mi>T</mi></mfrac><mo>-</mo><mfrac><mn>25</mn><mi>&#955;</mi></mfrac></mrow></mfenced><mo>=</mo><msup><mi>sin</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#8289;</mo><mfenced separators=\"|\"><mfrac><mn>4</mn><mn>8</mn></mfrac></mfenced><mo>=</mo><mfrac><mi>&#960;</mi><mn>6</mn></mfrac><mi mathvariant=\"normal\">&#160;</mi><mi>rad</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mfrac><mi>t</mi><mi>T</mi></mfrac><mo>=</mo><mfrac><mn>25</mn><mi>&#955;</mi></mfrac><mo>+&#8203;</mo><mn>0.08</mn></math> .... (iv)<br /><br />Subtracting equation (iv) from equation (iii), we get<br /><br /><math><mi>&#160;</mi><mi>&#160;</mi><mfrac><mrow><mn>15</mn></mrow><mrow><mi>&#955;</mi></mrow></mfrac><mo>=</mo><mn>0.06</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mi>&#955;</mi><mo>=</mo><mn>250</mn><mi mathvariant=\"normal\">&#160;</mi><mi>cm</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639bcf7d57aa33a7ee", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "15", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If the displacement <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>x</mi><mo>)</mo></math> and velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>v</mi><mo>)</mo></math> of a particle executing SHM are related through the expression <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><msup><mi>v</mi><mn>2</mn></msup><mo>=</mo><mn>30</mn><mo>-</mo><msup><mi>x</mi><mn>2</mn></msup></math>. If the time period of the particle is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mi mathvariant=\"normal\">π</mi><msqrt><mi>n</mi></msqrt></math>, then what is the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>?&nbsp;", "image": null}, "options": [], "correctValue": "12.00", "solution": {"text": "<p>Given equation,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><msup><mi>v</mi><mn>2</mn></msup><mo>=</mo><mn>30</mn><mo>-</mo><msup><mi>x</mi><mn>2</mn></msup></math><br />Differentiating both sides, we get<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mi mathvariant=\"normal\">v</mi><mfrac><mi>dv</mi><mi>dx</mi></mfrac><mo>=</mo><mo>-</mo><mn>2</mn><mi mathvariant=\"normal\">x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">v</mi><mfrac><mi>dv</mi><mi>dx</mi></mfrac><mo>=</mo><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><mn>3</mn></mfrac><mi mathvariant=\"normal\">x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mi>a</mi><mi>x</mi></mfrac><mo>=</mo><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><mn>3</mn></mfrac><mo>&#160;&#160;</mo><mo>&#8230;</mo><mfenced close=\"]\" open=\"[\"><mrow><mo>&#8757;</mo><mi>a</mi><mo>=</mo><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mfrac><mrow><mi>d</mi><mi>x</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mi>v</mi><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>&#960;</mi></mrow><msqrt><mfenced open=\"|\" close=\"|\"><mfrac><mtext>&#160;acceleration&#160;</mtext><mtext>&#160;displacement&#160;</mtext></mfrac></mfenced></msqrt></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>&#960;</mi></mrow><msqrt><mfenced open=\"|\" close=\"|\"><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><mn>3</mn></mfrac></mfenced></msqrt></mfrac><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mn>3</mn></msqrt><mo>=</mo><mi>&#960;</mi><msqrt><mn>12</mn></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>=</mo><mn>12</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"/></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639b96322a2715d845", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "101", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An ideal gas is enclosed in a vertical cylindrical container and supports a freely moving piston of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math>. The piston and the cylinder have an equal cross-sectional area <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>. Atmospheric pressure is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>p</mi><mn>0</mn></msub></math>&nbsp;and when the piston is in equilibrium, the volume of the gas is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>0</mn></msub></math>. The piston is now displaced slightly from its equilibrium position. Assuming that the system, is completely isolated from, its surroundings, &nbsp;what is the frequency of oscillation. An ideal gas is enclosed in a vertical cylindrical container and supports a freely moving piston of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math>. The piston and the cylinder have an equal cross-sectional area <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>. Atmospheric pressure is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>p</mi><mn>0</mn></msub></math>&nbsp;and when the piston is in equilibrium, the volume of the gas is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>0</mn></msub></math>. The piston is now displaced slightly from its equilibrium position. Assuming that the system, is completely isolated from, its surroundings, &nbsp;what is the frequency of oscillation.", "image": null}, "options": [{"id": "bENxi", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mi>&#960;</mi></mrow></mfrac><msqrt><mfrac><mrow><mi>&#947;&#160;</mi><mfenced><mrow><msub><mtext>p</mtext><mn>0</mn></msub><msup><mtext>A</mtext><mn>2</mn></msup><mo>+</mo><mtext>MgA</mtext></mrow></mfenced></mrow><mrow><msub><mtext>V</mtext><mn>0</mn></msub><mtext>M</mtext></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "Vpoyp", "text": "<math> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>f</mi><mo>⁡</mo> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mi>&pi;</mi> </mrow> </mfrac> <msqrt> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mi>&gamma;</mi> </mrow> </mfrac> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>p</mtext> <mn>0</mn> </msub> <msup> <mtext>A</mtext> <mn>2</mn> </msup> <mo>+</mo> <mtext>Mg</mtext> <mtext>A</mtext> </mrow> </mfenced> </mrow> <mrow> <msub> <mtext>V</mtext> <mn>0</mn> </msub> <mtext>M</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "MB2hn", "text": "<math> <mrow> <mi></mi><mi>f</mi><mo>⁡</mo> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mi>&pi;</mi> </mrow> </mfrac> <msqrt> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>p</mtext> <mn>0</mn> </msub> <msup> <mtext>A</mtext> <mn>2</mn> </msup> <mo>+</mo> <mtext>Mg</mtext> <mtext>A</mtext> </mrow> </mfenced> </mrow> <mrow> <msub> <mtext>V</mtext> <mn>0</mn> </msub> <mtext>M</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "FnFsW", "text": "<math> <mrow> <mi></mi><mi>f</mi><mo>⁡</mo> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mi>&pi;</mi> </mrow> </mfrac> <msqrt> <mfrac> <mrow> <mtext>A</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>p</mtext> <mn>0</mn> </msub> <mtext>A</mtext> <mo>+</mo> <mtext>Mg</mtext> <mtext>A</mtext> </mrow> </mfenced> </mrow> <mrow> <msub> <mtext>V</mtext> <mn>0</mn> </msub> <mtext>M</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "&nbsp;In equilibrium, pressure inside the cylinder = pressure just outside it<br /><br />or &nbsp; <math> <mrow> <mtext>p</mtext> <mo>=</mo> <msub> <mtext>p</mtext> <mn>0</mn> </msub> <mo>+</mo> <mfrac> <mrow> <mtext>Mg</mtext> </mrow> <mrow> <mtext>A</mtext> </mrow> </mfrac> </mrow> </math><br /><br />When piston is displaced slightly by an amount x, change in volume,<br /><br />&nbsp; <math> <mrow> <mtext>dV</mtext> <mo>=</mo> <mo>-</mo> <mtext>Ax</mtext> </mrow> </math><br /><br />Since, the cylinder is isolated from the surroundings, nature of the process is adiabatic. In adiabatic process,<br /><br />&nbsp; <math> <mrow> <mfrac> <mrow> <mtext>dp</mtext> </mrow> <mrow> <mtext>dV</mtext> </mrow> </mfrac> <mo>=</mo> <mo>-</mo> <mi>γ</mi> <mfrac> <mrow> <mtext>p</mtext> </mrow> <mrow> <mtext>V</mtext> </mrow> </mfrac> </mrow> </math><br /><br /><br /><span class=\"Bodytext2BookAntiqua\"><span style=\"font-size: 8.5pt; color: black;\"><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0007517_AnsExp1_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 187px; height: 241px;\" /></span></span><br /><br />or increase in pressure inside the cylinder,<br />&nbsp;<br /><math> <mrow> <mtext>dp</mtext> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi>γ</mi> <mtext>p</mtext> </mrow> </mfenced> </mrow> <mrow> <mtext>V</mtext> </mrow> </mfrac> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>dV</mtext> </mrow> </mfenced> <mo>=</mo> <mi>γ</mi> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <msub> <mtext>p</mtext> <mn>0</mn> </msub> <mo>+</mo> <mfrac> <mrow> <mtext>Mg</mtext> </mrow> <mrow> <mtext>A</mtext> </mrow> </mfrac> </mrow> <mrow> <msub> <mtext>V</mtext> <mn>0</mn> </msub> </mrow> </mfrac> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>Ax</mtext> </mrow> </mfenced> </mrow> </math> ​<br /><br />This increase in pressure when multiplied with area of cross-section A will give a net upward force (or the restoring force). Hence,<br /><br /><math> <mrow> <mtext>F</mtext> <mo>=</mo> <mo>-</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>dp</mtext> </mrow> </mfenced> <mtext>A</mtext> <mo>=</mo> <mo>-</mo> <mi>γ</mi> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <msub> <mtext>p</mtext> <mn>0</mn> </msub> <msup> <mtext>A</mtext> <mn>2</mn> </msup> <mo>+</mo> <mtext>MgA</mtext> </mrow> <mrow> <msub> <mtext>V</mtext> <mn>0</mn> </msub> </mrow> </mfrac> </mrow> </mfenced> <mtext>x</mtext> </mrow> </math><br /><br />Or&nbsp;<math> <mrow> <mtext>a</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>F</mtext> </mrow> <mrow> <mtext>M</mtext> </mrow> </mfrac> <mo>=</mo> <mo>-</mo> <mi>γ</mi> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <msub> <mtext>p</mtext> <mn>0</mn> </msub> <msup> <mtext>A</mtext> <mn>2</mn> </msup> <mo>+</mo> <mtext>MgA</mtext> </mrow> <mrow> <msub> <mtext>V</mtext> <mn>0</mn> </msub> <mtext>M</mtext> </mrow> </mfrac> </mrow> </mfenced> <mtext>x</mtext> </mrow> </math><br /><br />Since, <math> <mrow> <mtext>a</mtext> <mo>∝</mo> <mo>-</mo> <mtext>x</mtext> </mrow> </math>, motion of the piston is simple harmonic in nature. Frequency of this oscillation is given by<br /><br /><math> <mrow> <mtext>f</mtext> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> <msqrt> <mfenced close=\"|\" open=\"|\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>a</mtext> </mrow> <mrow> <mtext>x</mtext> </mrow> </mfrac> </mrow> </mfenced> </msqrt> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> <msqrt> <mfrac> <mrow> <mi>γ&nbsp;</mi> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>p</mtext> <mn>0</mn> </msub> <msup> <mtext>A</mtext> <mn>2</mn> </msup> <mo>+</mo> <mtext>MgA</mtext> </mrow> </mfenced> </mrow> <mrow> <msub> <mtext>V</mtext> <mn>0</mn> </msub> <mtext>M</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86391489b2628247dcd", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "01", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A particle executes simple harmonic motion and it is located at <math><mi>x</mi><mo>=</mo><mi>a</mi><mo>,</mo><mi>&nbsp;</mi><mi>b</mi></math> and <math><mi>c</mi></math> at time&nbsp;<math><msub><mrow><mi>t</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>,</mo><mi>&nbsp;</mi><mn>2</mn><msub><mrow><mi>t</mi></mrow><mrow><mn>0</mn></mrow></msub><mi>&nbsp;</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">d</mi ", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "37", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A particle performs SHM with an amplitude of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>. If at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>, the magnitude of velocity and acceleration are equal, then the time period of SHM (in seconds) is", "image": null}, "options": [{"id": "00zGi", "text": "<math><mfrac><mrow><mn>2</mn><mi>π</mi></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "j7OhR", "text": "<math><mfrac><mrow><mn>4</mn><mi>π</mi></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "2h1EI", "text": "<math><mfrac><mrow><mn>8</mn><mi>π</mi></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "nO2y4", "text": "<math><mfrac><mrow><mn>6</mn><mi>π</mi></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi>v</mi><mo>=</mo><mi>&#969;</mi><msqrt><msup><mrow><mn>5</mn></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mn>4</mn></mrow><mrow><mn>2</mn></mrow></msup></msqrt><mo>=</mo><mn>3</mn><mi>&#969;</mi></math><br /><br /><math><mi>a</mi><mo>=</mo><msup><mrow><mi>&#969;</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>&#215;</mo><mn>4</mn></math><br /><br /><math><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi>a</mi></mrow></mfenced><mo>=</mo><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi>v</mi></mrow></mfenced></math><br /><br /><math><mn>4</mn><msup><mrow><mi>&#969;</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>3</mn><mi>&#969;</mi></math><br /><br /><math><mi>&#969;</mi><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>&#960;</mi></mrow><mrow><mi>T</mi></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mfrac><mrow><mn>8</mn><mi>&#960;</mi></mrow><mn>3</mn></mfrac><mi>&#160;</mi><mi mathvariant=\"normal\">s</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638724d3f479f67abb", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "26", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Consider a pair of identical pendulums, which oscillate with equal amplitude independently such that when one pendulum is at its extreme position making an angle of 2<sup>o</sup> to the right with the vertical, the other pendulum makes an angle of 1<sup>o</sup> to the left of the vertical. What is the phase difference (in degree) between the pendulums?", "image": null}, "options": [], "correctValue": "120", "solution": {"text": "Assuming the two pendulums follow the following functions of their displacement :<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&theta;<sub>1</sub> = &theta;<sub>0</sub> sin (&omega;t + &#x03D5;<sub>1</sub>)&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;..(i)<br /><br />and&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&theta;<sub>2</sub> = &theta;<sub>0</sub> sin (&omega;t + &#x03D5;<sub>2</sub>)&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;..(ii)<br /><br />As it is given that amplitude and time period being equal but phases being different.<br /><br />Now, for first pendulum at any time t<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&theta;<sub>1</sub> = &theta;<sub>0</sub>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(Right extreme)<br /><br />From Eq. (i), we get <br /><br />&rArr;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&theta;<sub>0</sub> = &theta;<sub>0</sub> sin (&omega;t + &#x03D5;<sub>1</sub>)<br /><br />or&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;1 = sin (&omega;t + &#x03D5;<sub>1</sub>)<br /><br />or&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math><mrow>  <mfenced open=\"(\" close=\")\" separators=\",\">    <mrow>      <mi>&omega;</mi>      <mi>t</mi>      <mo>+</mo>      <msub>              <mi>&#x03D5;</mi>            <mn>1</mn>      </msub>    </mrow>  </mfenced>  <mo>=</mo>  <mfrac>    <mrow>      <mi>&pi;</mi>    </mrow>    <mrow>      <mn>2</mn>    </mrow>  </mfrac>  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mo>&hellip;</mo>  <mfenced open=\"(\" close=\")\" separators=\",\">    <mrow>      <mtext>iii</mtext>    </mrow>  </mfenced></mrow></math><br /><br />Similarly, at the same instant t for pendulum second, we have <br /><br /><math><mrow>  <msub>          <mi>&theta;</mi>        <mn>2</mn>  </msub>  <mo>=</mo>  <mo>-</mo>  <mfrac>    <mrow>      <msub>              <mi>&theta;</mi>            <mn>0</mn>      </msub>    </mrow>    <mrow>      <mn>2</mn>    </mrow>  </mfrac></mrow></math><br /><br /><b>Note</b> &theta;<sub>0</sub> = 2<sup>o</sup> is the angular amplitude for the second pendulum the angular displacement is one degree therefore, <math><mrow>  <msub>          <mi>&theta;</mi>        <mn>2</mn>  </msub>  <mo>=</mo>  <mfrac>    <mrow>      <msub>              <mi>&theta;</mi>            <mn>0</mn>      </msub>    </mrow>    <mrow>      <mn>2</mn>    </mrow>  </mfrac></mrow></math>&nbsp;and negative sign is taken to show for being left to mean position <br /><br />From Eq. (ii), then<br /><br /><math><mrow>  <mo>-</mo>  <mfrac>    <mrow>      <msub>              <mi>&theta;</mi>            <mn>0</mn>      </msub>    </mrow>    <mrow>      <mn>2</mn>    </mrow>  </mfrac>  <mo>=</mo>  <msub>          <mi>&theta;</mi>        <mn>0</mn>  </msub>  <mspace width=\"0.5em\" />  <mtext>sin</mtext>  <mfenced open=\"(\" close=\")\" separators=\",\">    <mrow>      <mi>&omega;</mi>      <mi>t</mi>      <mo>+</mo>      <msub>              <mi>&#x03D5;</mi>            <mn>2</mn>      </msub>    </mrow>  </mfenced></mrow></math><br /><br /><math><mrow>  <mo>&rArr;</mo>  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mtext>sin</mtext>  <mfenced open=\"(\" close=\")\" separators=\",\">    <mrow>      <mi>&omega;</mi>      <mi>t</mi>      <mo>+</mo>      <msub>              <mi>&#x03D5;</mi>            <mn>2</mn>      </msub>    </mrow>  </mfenced>  <mo>=</mo>  <mo>-</mo>  <mfrac>    <mrow>      <mn>1</mn>    </mrow>    <mrow>      <mn>2</mn>    </mrow>  </mfrac></mrow></math><br /><br /><math><mrow>  <mo>&rArr;</mo>  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mfenced open=\"(\" close=\")\" separators=\",\">    <mrow>      <mi>&omega;</mi>      <mi>t</mi>      <mo>+</mo>      <msub>              <mi>&#x03D5;</mi>            <mn>2</mn>      </msub>    </mrow>  </mfenced>  <mo>=</mo>  <mo>-</mo>  <mfrac>    <mrow>      <mi>&pi;</mi>    </mrow>    <mrow>      <mn>6</mn>    </mrow>  </mfrac>  <mtext>or</mtext>  <mfrac>    <mrow>      <mn>7</mn>      <mi>&pi;</mi>    </mrow>    <mrow>      <mn>6</mn>    </mrow>  </mfrac></mrow></math><br /><br /><math><mrow>  <mtext>or</mtext>  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mfenced open=\"(\" close=\")\" separators=\",\">    <mrow>      <mi>&omega;</mi>      <mi>t</mi>      <mo>+</mo>      <msub>              <mi>&#x03D5;</mi>            <mn>2</mn>      </msub>    </mrow>  </mfenced>  <mo>=</mo>  <mo>-</mo>  <mfrac>    <mrow>      <mi>&pi;</mi>    </mrow>    <mrow>      <mn>6</mn>    </mrow>  </mfrac>  <mtext>or</mtext>  <mfrac>    <mrow>      <mn>7</mn>      <mi>&pi;</mi>    </mrow>    <mrow>      <mn>6</mn>    </mrow>  </mfrac>  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mo>&hellip;</mo>  <mfenced open=\"(\" close=\")\" separators=\",\">    <mrow>      <mtext>iv</mtext>    </mrow>  </mfenced></mrow></math><br /><br />From Eqs. (iv) and (iii), the difference in phases<br /><br /><math><mrow>  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mspace width=\"0.5em\" />  <mfenced open=\"(\" close=\")\" separators=\",\">    <mrow>      <mi <msup><mrow><mfenced separators=\"|\"><mrow><mrow><mo stretchy=\"false\">&#8721;</mo><mrow><msub><mrow><mi>A</mi></mrow><mrow><mi>y</mi></mrow></msub></mrow></mrow></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></msqrt></math><br /><br /><math><mo>=</mo><mi>&#160;</mi><mi>&#160;</mi><msqrt><msup><mrow><mfenced separators=\"|\"><mrow><mn>8.46</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>7.2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></msqrt><mo>=</mo><mn>11.25</mn></math><br /><br />And <math><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>&#8289;</mo><mrow><mi>&#981;</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mrow><mo stretchy=\"false\">&#8721;</mo><mrow><msub><mrow><mi>A</mi></mrow><mrow><mi>y</mi></mrow></msub></mrow></mrow></mrow><mrow><mrow><mo stretchy=\"false\">&#8721;</mo><mrow><msub><mrow><mi>A</mi></mrow><mrow><mi>x</mi></mrow></msub></mrow></mrow></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>7.2</mn></mrow><mrow><mn>8.46</mn></mrow></mfrac><mo>=</mo><mn>0.85</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#981;</mi><mo>=</mo><msup><mi>tan</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#8289;</mo><mfenced separators=\"|\"><mn>0.85</mn></mfenced><mo>=</mo><mn>40.4</mn><mo>&#176;</mo></math><br /><br />Thus, the displacement equation of combined motion is<br /><br /><math><mi>x</mi><mo>=</mo><mn>11.25</mn><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mfenced separators=\"|\"><mrow><mi>&#969;</mi><mi>t</mi><mo>+</mo><mi>&#981;</mi></mrow></mfenced></mrow></mrow></math><br /><br />Where, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#981;</mi><mo>=</mo><mn>40.4</mn><mo>&#176;</mo></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "la
