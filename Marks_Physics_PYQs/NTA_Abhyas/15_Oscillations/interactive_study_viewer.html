w3.org/1998/Math/MathML\"><msup><msub><mi>t</mi><mn>1</mn></msub><mn>2</mn></msup><mo>+</mo><msup><msub><mi>t</mi><mn>2</mn></msub><mn>2</mn></msup><mo>=</mo><mn>4</mn><msup><mi mathvariant=\"normal\">&#960;</mi><mn>2</mn></msup><mfrac><mi>m</mi><msub><mi>k</mi><mn>1</mn></msub></mfrac><mo>+</mo><mn>4</mn><msup><mi mathvariant=\"normal\">&#960;</mi><mn>2</mn></msup><mfrac><mi>m</mi><msub><mi>k</mi><mn>2</mn></msub></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>4</mn><msup><mi mathvariant=\"normal\">&#960;</mi><mn>2</mn></msup><mi>m</mi><mi mathvariant=\"normal\">&#160;</mi><mfenced separators=\"|\"><mfrac><mrow><msub><mi>k</mi><mn>1</mn></msub><mo>+</mo><msub><mi>k</mi><mn>2</mn></msub></mrow><mrow><msub><mi>k</mi><mn>1</mn></msub><msub><mi>k</mi><mn>2</mn></msub></mrow></mfrac></mfenced></math> or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><msub><mi>t</mi><mn>1</mn></msub><mn>2</mn></msup><mo>+</mo><msup><msub><mi>t</mi><mn>2</mn></msub><mn>2</mn></msup><mo>=</mo><msup><mi>T</mi><mn>2</mn></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634d5d132fb5552230", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "29", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A particle of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math> is attached to three identical springs <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math> each of force constant&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">k</mi></math> a shown in figure. If the particle of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math> is pushed slightly against the spring&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and released then the time period of oscillations is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/103705.JPG\" style=\"width: 150px; height: 164px;\" />", "image": null}, "options": [{"id": "vaQro", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">π</mi><msqrt><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">m</mi></mrow><mi mathvariant=\"normal\">k</mi></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "anN6B", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">π</mi><msqrt><mfrac><mi mathvariant=\"normal\">m</mi><mrow><mn>2</mn><mi mathvariant=\"normal\">k</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "ktygm", "text": "<math><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>m</mi></mrow><mrow><mi>k</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "Nvpa3", "text": "<math><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>m</mi></mrow><mrow><mn>3</mn><mi>k</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/103705-1.JPG\" style=\"width: 150px; height: 162px;\" /><br /><br />When the particle of mass <math><mi mathvariant=\"normal\">m</mi></math>&nbsp;at O is pushed by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">y</mi></math> in the direction of A, the spring A will be compressed by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">y</mi></math> while spring B and C will be stretched by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">y</mi><mi mathvariant=\"normal\">′</mi><mo>=</mo><mi>ycos</mi><mn>45</mn><mo>°</mo></math>. So that the total restoring force on the mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math> along OA.<br /><br /><math><msub><mi mathvariant=\"normal\">F</mi><mi>net</mi></msub><mo>=</mo><msub><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\">A</mi></msub><mo>+</mo><msub><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\">B</mi></msub><mi>cos</mi><mn>45</mn><mo>°</mo><mo>+</mo><msub><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\">C</mi></msub><mi>cos</mi><mn>45</mn><mo>°</mo><mo>=</mo><mi>ky</mi><mo>+</mo><mn>2</mn><mi>ky</mi><mi mathvariant=\"normal\">′</mi><mi>cos</mi><mn>45</mn><mo>°</mo><mo>=</mo><mi>ky</mi><mo>+</mo><mn>2</mn><mi mathvariant=\"normal\">k</mi><mfenced separators=\"|\"><mrow><mi>ycos</mi><mn>45</mn><mo>°</mo></mrow></mfenced><mi>cos</mi><mn>45</mn><mo>°</mo><mo>=</mo><mn>2</mn><mi>ky</mi></math><br /><br />Also <math><msub><mi mathvariant=\"normal\">F</mi><mi>net</mi></msub><mo>=</mo><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">′</mi><mi mathvariant=\"normal\">y</mi></math><p><math><mo>⇒</mo><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">′</mi><mi mathvariant=\"normal\">y</mi><mo>=</mo><mn>2</mn><mi>ky</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">′</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">k</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">π</mi><msqrt><mfrac><mi mathvariant=\"normal\">m</mi><mrow><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">′</mi></mrow></mfrac></msqrt><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">π</mi><msqrt><mfrac><mi mathvariant=\"normal\">m</mi><mrow><mn>2</mn><mi mathvariant=\"normal\">k</mi></mrow></mfrac></msqrt></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863468932cf3a812b0c", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "02", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform rod of length <math> <mtext>L</mtext> </math> and mass <math> <mtext>M</mtext> </math> is pivoted at the centre. Its two ends are attached to two springs of equal spring constant <math> <mtext>k</mtext></math>. The rod is gently pushed through a small angle <math> <mrow> <mi>θ</mi> </mrow> </math>&nbsp;in one direction and released. The frequency of oscillation is (the springs are fixed to the walls)<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/23827.PNG\" style=\"width: 168px; height: 147px;\" />", "image": null}, "options": [{"id": "bTCs2", "text": "<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mi>&pi;</mi> </mrow> </mfrac> <msqrt> <mfrac> <mrow> <mtext>k</mtext> </mrow> <mrow> <mtext>M</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "OokkN", "text": "<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mi>&pi;</mi> </mrow> </mfrac> <msqrt> <mfrac> <mrow> <mn>2</mn> <mtext>k</mtext> </mrow> <mrow> <mtext>M</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "1VZjc", "text": "<math> <mrow>  <mfrac>   <mn>1</mn>   <mrow>    <mn>2</mn><mi>&#x03C0;</mi></mrow>  </mfrac>  <msqrt>   <mrow>    <mfrac>     <mrow>      <mn>3</mn><mtext>k</mtext></mrow>     <mtext>M</mtext>    </mfrac>    </mrow>  </msqrt>  </mrow></math>", "image": null, "isCorrect": false}, {"id": "roIzQ", "text": "<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> <msqrt> <mfrac> <mrow> <mn>6</mn> <mtext>k</mtext> </mrow> <mrow> <mtext>M</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Consider the situation below<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/23827-S.PNG\" style=\"width: 200px; height: 202px;\" /><br /><br />From the above diagram<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mi>θ</mi> <mo>=</mo> <mfrac> <mrow> <mtext>x</mtext> </mrow> <mrow> <mi></mi><mi></mi><mi>l</mi><mo>⁡</mo> <mo>/</mo> <mn>2</mn> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>⇒&nbsp;&nbsp;&nbsp;&nbsp;</mo> <mtext>x</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>L</mtext> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mi>θ</mi> </mrow> </math><br /><br />In the above diagram the rod is displaced through an angle <math> <mrow> <mi>θ</mi> </mrow> </math>&nbsp;as in above diagram<br /><br />Restoring torque <math> <mrow> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mo>-</mo> <mn>2</mn> <mtext>kx</mtext> </mrow> </mfenced> <mo>×</mo> <mfrac> <mrow> <mtext>L</mtext> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>=</mo> <mo>-</mo> <mtext>kxL</mtext></mrow></math><br />angular acceleration,&nbsp;<br /><math><mrow><mo>⇒</mo><math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <mi>a</mi><mo>=</mo><mfrac> <mrow> <mo>−</mo><mi>k</mi><mo>×</mo><mfrac> <mi>L</mi> <mn>2</mn> </mfrac> <mi>θ</mi><mo>×</mo><mi>L</mi></mrow> <mi>Ι</mi> </mfrac> </mrow> </math> <math> <mo>=</mo><mfenced> <mrow> <mfrac> <mrow> <mo>−</mo><mn>6</mn><mtext>k</mtext></mrow> <mtext>M</mtext> </mfrac> </mrow> </mfenced><mi>θ</mi> </math></mrow></math><br /><br /><math> <mrow> <mo>=</mo><mo>−</mo><msup> <mi>ω</mi> <mn>2</mn> </msup> <mi>θ</mi></mrow> </math><br /><br /><math> <mi>ω</mi><mo>=</mo><msqrt> <mrow> <mfrac> <mrow> <mn>6</mn><mi>K</mi></mrow> <mi>M</mi> </mfrac> </mrow> </msqrt> </math><br /><br /><math> <mi>f</mi><mo>=</mo><mfrac> <mn>1</mn> <mrow> <mn>2</mn><mi>π</mi></mrow> </mfrac> <msqrt> <mrow> <mfrac> <mrow> <mn>6</mn><mi>K</mi></mrow> <mi>M</mi> </mfrac> </mrow> </msqrt> </math><br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633aab6923114434c4", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "11", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A wooden cylinder of mass <math> <mrow> <mtext>20&nbsp;g</mtext></mrow> </math> and area of cross-section <math> <mrow> <mtext>1</mtext><mtext> </mtext><msup> <mrow> <mtext>cm</mtext></mrow> <mn>2</mn> </msup> </mrow> </math>, having a piece of lead of mass <math> <mrow> <mn>60</mn><mtext> </mtext><mtext>g</mtext></mrow> </math> attached to its bottom, floats&nbsp;in water. The cylinder is depressed and then released. The frequency of oscillations is&nbsp;<!-- MathType@Translator@5@5@MathML2 (namespace attr).tdl@MathML 2.0 (namespace attr)@ --> <math> <mrow> <mfrac> <mtext>N</mtext> <mtext>π</mtext> </mfrac> <msup> <mn>s</mn> <mrow> <mo>−</mo><mn>1</mn></mrow></msup></mrow></math>. Find the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi></math>. [Neglect the volume of water displaced by the lead piece, take <!-- MathType@Translator@5@5@MathML2 (namespace attr).tdl@MathML 2.0 (namespace attr)@ --> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mo>=</mo><mn>9.8</mn><mtext> </mtext><msup><mtext>m/s</mtext><mtext>2</mtext></msup></math>, density of water&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>ρ</mi><mi mathvariant=\"normal\">w</mi></msub><mo>=</mo><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">g</mi><mo>&nbsp;</mo><msup><mi>cm</mi><mrow><mo>-</mo><mn>3</mn></mrow></msup></math>]<!-- MathType@End@5@5@ -->", "image": null}, "options": [], "correctValue": "1.75", "solution": {"text": "<p>Suppose that the loaded wooden block sinks upto a height h. Then,<br /><br />weight of water displaced by the block<br /><br />= weight of the block with lead<br /><br />If a is area of cross-section of the block and σ, the density of water, then<br /><br /><math> <mrow> <mi>a</mi> <mspace width=\"0.5em\"></mspace> <mi>h</mi><mo>⁡</mo> <mspace width=\"0.5em\"></mspace> <mi>σ</mi> <mspace width=\"0.5em\"></mspace> <mtext>g</mtext> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>M</mtext> <mo>+</mo> <mtext>m</mtext> </mrow> </mfenced> <mtext>g</mtext> </mrow> </math><br /><br /><math> <mrow> <mtext>or</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mi>h</mi><mo>⁡</mo> <mo>=</mo> <mfrac> <mrow> <mtext>M</mtext> <mo>+</mo> <mtext>m</mtext> </mrow> <mrow> <mi>a</mi> <mspace width=\"0.5em\"></mspace> <mi>σ</mi> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> <mn>0</mn> <mo>+</mo> <mn>6</mn> <mn>0</mn> </mrow> <mrow> <mn>1</mn> <mo>×</mo> <mn>1</mn> </mrow> </mfrac> <mo>=</mo> <mn>8</mn> <mn>0</mn> <mspace width=\"0.5em\"></mspace> <mtext>cm</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mo>∵</mo> <mtext>density of water</mtext> <mo>=</mo> <mn>1</mn><mtext>g</mtext><msup><mtext>cm</mtext> <mrow> <mo>-</mo> <mn>3</mn> </mrow> </msup> </mrow> </mfenced> </mrow> </math><br /><br />Now for small displacement '<math> <mi>x</mi></math>' from equilibrium<br /><br /><math> <mrow> <mi>σ</mi><mi>g</mi><mi>a</mi><mrow><mo>(</mo> <mrow> <mi>x</mi><mo>+</mo><mi>h</mi></mrow> <mo>)</mo></mrow><mo>−</mo><mrow><mo>(</mo> <mrow> <mi>M</mi><mo>+</mo><mi>m</mi></mrow> <mo>)</mo></mrow><mi>g</mi><mo>=</mo><mrow><mo>-(</mo> <mrow> <mi>M</mi><mo>+</mo><mi>m</mi></mrow> <mo>)</mo></mrow><mi>A</mi></mrow> </math><br /><br /><math> <mrow> <mi>σ</mi><mi>g</mi><mi>a</mi><mi>x</mi><mo>=</mo><mrow><mo>-(</mo> <mrow> <mi>M</mi><mo>+</mo><mi>m</mi></mrow> <mo>)</mo></mrow><mi>A</mi></mrow> </math><br /><br /><math> <mrow> <mi>A=-</mi><mfrac>&nbsp;<mrow><mi>σ</mi><mi>g</mi><mi>a</mi></mrow> <mrow> <mi>M</mi><mo>+</mo><mi>m</mi></mrow> </mfrac> <mi>x</mi></mrow> </math><br /><br /><math> <mi>f</mi><mo>=</mo><mfrac> <mn>1</mn> <mrow> <mn>2</mn><mi>π</mi></mrow> </mfrac> <msqrt> <mrow> <mfrac> <mi>g</mi> <mi>h</mi> </mfrac></mrow></msqrt></math><br /><br /><math> <mtext> </mtext><mtext> </mtext><mo>=</mo><mfrac> <mn>1</mn> <mrow> <mn>2</mn><mi>π</mi></mrow> </mfrac> <msqrt> <mrow> <mfrac> <mrow> <mn>980</mn></mrow> <mrow> <mn>80</mn></mrow> </mfrac></mrow></msqrt></math>&nbsp;<!-- MathType@Translator@5@5@MathML2 (namespace attr).tdl@MathML 2.0 (namespace attr)@ --> <math> <mrow> <mo>=</mo><mfrac> <mrow> <mn>1.75</mn></mrow> <mi>π</mi> </mfrac> <msup> <mtext>s</mtext> <mrow> <mo>−</mo><mn>1</mn></mrow> </msup> </mrow> </math> <!-- MathType@End@5@5@ --><br />&nbsp;</p><br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863345de8dcc96d0942", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "25", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform cylinder of length&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">L</mi></math> and mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi></math> having cross-sectional area&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> is suspended, with its length vertical from a fixed point by a massless spring such that it is half-submerged in a liquid of density&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">ρ</mi></math> at the equilibrium position. When the cylinder is given a small downward push and released it starts oscillating vertically with a small amplitude. If the force constant of the spring is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">k</mi></math>, the frequency of oscillation of the cylinder is<br />\r<br />\r<u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0007490_AnsExp2_1.jpg\" style=\"height: 220px; width: 141px;\" /></strong></u>", "image": null}, "options": [{"id": "8HMXR", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac linethickness=\"1\"><mn>1</mn><mrow><mn>2</mn><mi mathvariant=\"normal\">π</mi></mrow></mfrac><msup><mrow><mo>(</mo><mfrac linethickness=\"1\"><mrow><mi mathvariant=\"normal\">k</mi><mo>-</mo><mi>Aρg</mi></mrow><mi mathvariant=\"normal\">M</mi></mfrac><mo>)</mo></mrow><mrow><mn>1</mn><mo>/</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "WWGgy", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mrow><mn>2</mn><mi>&#960;</mi></mrow></mfrac><msup><mfenced><mfrac><mrow><mtext>k</mtext><mo>+</mo><mtext>A</mtext><mi>&#961;</mi><mtext>g</mtext></mrow><mtext>M</mtext></mfrac></mfenced><mrow><mn>1</mn><mo>/</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "9eacN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac linethickness=\"1\"><mn>1</mn><mrow><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi></mrow></mfrac><msup><mrow><mo>(</mo><mfrac linethickness=\"1\"><mrow><mi mathvariant=\"normal\">k</mi><mo>+</mo><msup><mi>&#961;gL</mi><mn>2</mn></msup></mrow><mi mathvariant=\"normal\">M</mi></mfrac><mo>)</mo></mrow><mrow><mn>1</mn><mo>/</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "yMmy6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac linethickness=\"1\"><mn>1</mn><mrow><mn>2</mn><mi mathvariant=\"normal\">π</mi></mrow></mfrac><msup><mrow><mo>(</mo><mfrac linethickness=\"1\"><mrow><mi mathvariant=\"normal\">k</mi><mo>+</mo><mi>Aρg</mi></mrow><mi>Aρg</mi></mfrac><mo>)</mo></mrow><mrow><mn>1</mn><mo>/</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When cylinder is displaced by an amount x from its meanposition, spring force and upthrust both will increase. Hence,<br />Net restoring force = extra spring force + extra upthrust &nbsp;<br /><br />Or&nbsp;&nbsp; <math><mrow> <mtext>F</mtext> <mo>=</mo> <mo>-</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>kx</mtext> <mo>+</mo> <mtext>Ax</mtext> <mi>ρ</mi> <mtext>g</mtext> </mrow> </mfenced> </mrow> </math><br />&nbsp;<br />Or <math> <mrow> <mtext>a</mtext> <mo>=</mo> <mo>-</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>k</mtext> <mo>+</mo> <mi>ρ</mi> <mtext>Ag</mtext> </mrow> <mrow> <mtext>M</mtext> </mrow> </mfrac> </mrow> </mfenced> <mtext>x</mtext> </mrow> </math><br /><br />Now,&nbsp;<math> <mrow> <mtext>f</mtext> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> <msqrt> <mfenced close=\"|\" open=\"|\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>a</mtext> </mrow> <mrow> <mtext>x</mtext> </mrow> </mfrac> </mrow> </mfenced> </msqrt> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math><mrow> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> <msqrt> <mfrac> <mrow> <mtext>k</mtext> <mo>+</mo> <mi>ρ</mi> <mtext>Ag</mtext> </mrow> <mrow> <mtext>M</mtext> </mrow> </mfrac> </msqrt> </mrow> </math><br /><br /><u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0007490_AnsExp2_1.jpg\" /></strong></u>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633001e37988e4bd62", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "95", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Time period of a spring-mass system is <math><mi>T</mi></math>. If this spring is cut into two parts whose lengths are in the ratio 1:3 and the same mass is attached to the longer part, the new time period will be", "image": null}, "options": [{"id": "kqRy5", "text": "<math><msqrt><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></msqrt><mi> </mi><mi>T</mi></math>", "image": null, "isCorrect": false}, {"id": "GSTvV", "text": "<math><mfrac><mrow><mi>T</mi></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "RW5LP", "text": "<math><mfrac><mrow><msqrt><mn>3</mn></msqrt><mi>T</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "uoRb8", "text": "<math><msqrt><mn>3</mn></msqrt><mi>T</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <mtext>T</mtext> <mo>=</mo> <mn>2</mn> <mi>&#960;</mi> <msqrt> <mfrac> <mrow> <mtext>m</mtext> </mrow> <mrow> <mtext>k</mtext> </mrow> </mfrac> </msqrt> </mrow> </math><br /><br />When spring is cut in the ratio 1 : 3, the force constant of the longer part is <math> <mrow> <mfrac> <mrow> <mn>4</mn> <mtext>k</mtext> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> </mrow> </math>.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;&#160;&#160;&#160;</mo><mtext>T'</mtext><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><mrow><mn>3</mn><mtext>m</mtext></mrow><mrow><mn>4</mn><mtext>k</mtext></mrow></mfrac></msqrt><mo>=</mo><mfrac><msqrt><mn>3</mn></msqrt><mn>2</mn></mfrac><mtext>T</mtext></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631fc613577804d060", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "89", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A mass <math><mi>M</mi></math> is suspended from a spring of negligible mass. The spring is pulled a little and then released so that the mass executes SHM of time period <math><mi>T</mi></math>. If the mass is increased by <math><mi>m</mi></math>, the time period become <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>5</mn><mi>T</mi></mrow><mn>3</mn></mfrac></math>. Then the ratio of <math><mfrac><mrow><mi>m</mi></mrow><mrow><mi>M</mi></mrow></mfrac></math> is", "image": null}, "options": [{"id": "MTjUJ", "text": "<math><mrow><mrow><mn>3</mn></mrow><mo>/</mo><mrow><mn>5</mn></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "bKkEX", "text": "<math><mrow><mrow><mn>25</mn></mrow><mo>/</mo><mrow><mn>9</mn></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "JfHPu", "text": "<math><mrow><mrow><mn>16</mn></mrow><mo>/</mo><mrow><mn>9</mn></mrow></mrow></math>", "image": null, "isCorrect": true}, {"id": "Bmxuh", "text": "<math><mrow><mrow><mn>5</mn></mrow><mo>/</mo><mrow><mn>3</mn></mrow></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>M</mi></mrow><mrow><mi>k</mi></mrow></mfrac></msqrt></math> when mass is increased by <math><mi>m</mi></math> then                               ...(i)<br/><br/>                          <math><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>M</mi><mo>+</mo><mi>m</mi></mrow><mrow><mi>k</mi></mrow></mfrac></msqrt></math><br/><br/><math><mo>⇒</mo></math>                          <math><mfrac><mrow><mn>5</mn><mi>T</mi></mrow><mrow><mn>3</mn></mrow></mfrac><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>M</mi><mo>+</mo><mi>m</mi></mrow><mrow><mi>k</mi></mrow></mfrac></msqrt></math>                                                               ...(ii)<br/><br/>Dividing Eq. (i) by Eq. (ii), we get<br/><br/>                               <math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mo>=</mo><msqrt><mfrac><mrow><mi>M</mi></mrow><mrow><mi>M</mi><mo>+</mo><mi>m</mi></mrow></mfrac></msqrt></math><br/><br/>                               <math><mfrac><mrow><mn>9</mn></mrow><mrow><mn>25</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>M</mi></mrow><mrow><mi>M</mi><mo>+</mo><mi>m</mi></mrow></mfrac></math><br/><br/><math><mo>⇒</mo></math>             <math><mn>9</mn><mi>M</mi><mo>+</mo><mn>9</mn><mi>m</mi><mo>=</mo><mn>25</mn><mi>M</mi></math><br/><br/><math><mo>⇒</mo></math>                       <math><mn>16</mn><mi>M</mi><mo>=</mo><mn>9</mn><mi>m</mi></math><br/><br/>                                 <math><mfrac><mrow><mi>m</mi></mrow><mrow><mi>M</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>16</mn></mrow><mrow><mn>9</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631a7d3610adb63eae", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "69", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two identical springs (spring constant =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi></math>) are connected to two light rigid rods in parallel combination and then a third spring (identical to the other two) is connected to this combination in series. The combined system is fixed to the ceiling and a block of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>&nbsp;is attached as shown in the figure. If the mass is slightly displaced and then let go, then the system shall oscillate with a time period of<br />\r<br />\r<img height=\"187\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/mapmcmwwumaczgnltvxiloczzlvmwmhsbsymzfhidhnzxtpnga.jpeg\" width=\"195\" />", "image": null}, "options": [{"id": "Q3FGg", "text": "<math><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>m</mi></mrow><mrow><mn>3</mn><mi>k</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "ty2fL", "text": "<math><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mn>3</mn><mi>m</mi></mrow><mrow><mn>2</mn><mi>k</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "b0LnB", "text": "<math><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mn>2</mn><mi>m</mi></mrow><mrow><mn>3</mn><mi>k</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "4Fu4c", "text": "<math><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mn>3</mn><mi>k</mi></mrow><mrow><mi>m</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Consider the system as shown in figure below.<br/><br/> <img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/wgaslkgdeufiitvkvrlyycltlfsffibivwhzxtkcehlpyubhxb.jpeg\"/> <br/><br/>Here, <math><msub><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msub></math>  and  <math><msub><mrow><mi>k</mi></mrow><mrow><mn>3</mn></mrow></msub></math>  are in parallel.  <math><msub><mrow><mi>k</mi></mrow><mrow><mn>1</mn></mrow></msub></math>  is in series with parallel combination of  <math><msub><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msub></math>  and  <math><msub><mrow><mi>k</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>.</mo></math> <br/><br/>Effective spring constant of the combination is <br/><br/> <math><msub><mrow><mi>k</mi></mrow><mrow><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">f</mi></mrow></msub><mo>=</mo><mfrac><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><msub><mrow><mi>k</mi></mrow><mrow><mn>3</mn></mrow></msub></mrow></mfenced><msub><mrow><mi>k</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>k</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><msub><mrow><mi>k</mi></mrow><mrow><mn>3</mn></mrow></msub></mrow></mfrac></math> <br/><br/> <math><mo>=</mo><mfrac><mrow><mn>2</mn><mi>k</mi><mo>×</mo><mi>k</mi></mrow><mrow><mn>3</mn><mi>k</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi>k</mi></math> <br/><br/> <math><mo>∴</mo></math>  Time period of oscillation<br/><br/> <math><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>m</mi></mrow><mrow><msub><mrow><mi>k</mi></mrow><mrow><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">f</mi></mrow></msub></mrow></mfrac></msqrt></math> <br/><br/> <math><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>m</mi></mrow><mrow><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi>k</mi></mrow></mfrac></msqrt></math> <br/><br/> <math><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mn>3</mn><mi>m</mi></mrow><mrow><mn>2</mn><mi>k</mi></mrow></mfrac></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86318ee50b36eac6cc2", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "27", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A block of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi>kg</mi></math>&nbsp;is connected with a smooth plank of the same mass is performing oscillations. The value of the spring constant is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. The block and the plank are free to move and there is no friction anywhere. The angular frequency of the oscillation is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">ω</mi><mo>&nbsp;</mo><mi>rad</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. Find the value of <math><mi mathvariant=\"normal\">ω</mi></math>.", "image": null}, "options": [], "correctValue": "20", "solution": {"text": "<p>Using the concept of reduced mass, we obtain:-<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#969;</mi><mo>=</mo><msqrt><mfrac><mi mathvariant=\"normal\">k</mi><msub><mi mathvariant=\"normal\">m</mi><mi>reduced</mi></msub></mfrac></msqrt><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">k</mi></mrow><mi mathvariant=\"normal\">m</mi></mfrac></msqrt><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mfenced><mrow><mo>&#8757;</mo><msub><mi mathvariant=\"normal\">m</mi><mi>reduced</mi></msub><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">m</mi><mo>&#215;</mo><mi mathvariant=\"normal\">m</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mo>+</mo><mi mathvariant=\"normal\">m</mi></mrow></mfrac><mo>=</mo><mfrac><mi mathvariant=\"normal\">m</mi><mn>2</mn></mfrac></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">&#969;</mi><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mo>&#215;</mo><mn>200</mn></mrow><mn>1</mn></mfrac></msqrt><mo>=</mo><mn>20</mn><mo>&#160;</mo><mi>rad</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>&nbsp;</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631899f3b7bc1ccf44", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "13", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Friction is absent everywhere and the threads, spring and pulleys are massless. If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mi mathvariant=\"normal\">A</mi></msub><mo>=</mo><msub><mi>m</mi><mi mathvariant=\"normal\">B</mi></msub><mo>=</mo><mi>m</mi></math>, then the angular frequency of the system for small oscillations will be<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0629487.jpg\" style=\"width: 250px; height: 165px;\" />", "image": null}, "options": [{"id": "hE2SW", "text": "<math><mrow><msqrt><mfrac><mrow><mtext>2k</mtext> </mrow> <mrow> <mtext>4m</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "Vn6X0", "text": "<math> <mrow> <msqrt> <mfrac> <mrow> <mtext>4k</mtext> </mrow> <mrow> <mtext>5m</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "PQcoQ", "text": "<math><mrow><msqrt><mfrac><mrow><mtext>6k</mtext> </mrow> <mrow> <mtext>7m</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "8669D", "text": "<math> <mrow> <msqrt> <mfrac> <mrow> <mtext>8k</mtext> </mrow> <mrow> <mtext>5m</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let x<sub>0</sub>&nbsp;be the extension in the spring in equilibrium. Then equilibrium of A and B give,<br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;T = kx<sub>0</sub> + mg sin &theta; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; ...(i)<br /><br />and &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;2T = mg &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; ...(ii)<br /><br />Here, T is the tension in the string. Now, suppose A is further displaced by a distance x from its mean position and v be its speed at this moment. Then B lowers by <math> <mrow> <mfrac> <mrow> <mi>x</mi> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math> and speed of B at this instant will be <math> <mrow> <mfrac> <mrow> <mi>v</mi> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math> Total energy of the system in this position will be,<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>E</mtext> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>k</mtext> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi>x</mi> <mo>+</mo> <msub> <mi>x</mi> <mn>0</mn> </msub> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msub> <mtext>m</mtext> <mtext>A</mtext> </msub> <msup> <mtext>v</mtext> <mn>2</mn> </msup> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msub> <mtext>m</mtext> <mtext>B</mtext> </msub> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>v</mtext> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> <mo>+</mo> <msub> <mtext>m</mtext> <mtext>A</mtext> </msub> <msub> <mtext>gh</mtext> <mtext>A</mtext> </msub> <mo>-</mo> <msub> <mtext>m</mtext> <mtext>B</mtext> </msub> <msub> <mtext>gh</mtext> <mtext>B</mtext> </msub> </mrow> </math><br /><br /><math> <mrow> <mtext>or</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>E</mtext> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>k</mtext> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi>x</mi> <mo>+</mo> <msub> <mi>x</mi> <mn>0</mn> </msub> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>m</mtext> <msup> <mtext>v</mtext> <mn>2</mn> </msup><mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>8</mn> </mrow> </mfrac> <msup> <mtext>mv</mtext> <mn>2</mn> </msup> <mo>+</mo> <mtext>mgx sin</mtext> <mtext>&#952;</mtext> <mo>-</mo> <mtext>mg</mtext> <mfrac> <mrow> <mi>x</mi> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mtext>or</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>E</mtext> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>k</mtext> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi>x</mi> <mo>+</mo> <msub> <mi>x</mi> <mn>0</mn> </msub> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> <mo>+</mo> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>8</mn> </mrow> </mfrac> <mtext>m</mtext> <msup> <mtext>v</mtext> <mn>2</mn> </msup> <mo>+</mo> <mtext>mgx sin</mtext> <mtext>&#952;</mtext> <mo>-</mo> <mtext>mg</mtext> <mfrac> <mrow> <mi>x</mi> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math><br /><br />Since, E is constant,<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mfrac> <mrow> <mtext>dE</mtext> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> <mo>=</mo> <mn>0</mn> </mrow> </math><br /><br /><math> <mrow> <mtext>or</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mn>0</mn> <mo>=</mo> <mtext>k</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi>x</mi> <mo>+</mo> <msub> <mi>x</mi> <mn>0</mn> </msub> </mrow> </mfenced> <mfrac> <mrow> <mtext>d</mtext> <mi>x</mi> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> <mo>+</mo> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> <mtext>mv</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>dv</mtext> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> </mrow> </mfenced> <mo>+</mo> <mtext>mg</mtext> <mspace width=\"0.5em\"></mspace> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>sin</mtext> <mspace width=\"0.5em\"></mspace> <mtext>&#952;</mtext> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>d</mtext> <mi>x</mi> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> </mrow> </mfenced> <mo>-</mo> <mfrac> <mrow> <mtext>mg</mtext> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>d</mtext> <mi>x</mi> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math><br /><br /><math> <mrow> <mtext>Substituting,</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mfrac> <mrow> <mtext>d</mtext> <mi>x</mi> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> <mo>=</mo> <mtext>v</mtext> </mrow> </math><br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mfrac> <mrow> <mtext>d</mtext> <mtext>v</mtext> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> <mo>=</mo> <mi>a</mi> </mrow> </math><br /><br /><math> <mrow> <mtext>and</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></m ><mn>5</mn><mi>π</mi><mi> </mi><mn>s</mn></math>", "image": null, "isCorrect": false}, {"id": "iHlQC", "text": "<math><mn>4</mn><mi>π</mi><mi> </mi><mn>s</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, Length of simple pendulum, <math><mi>l</mi><mo>=</mo><msqrt><mn>5</mn></msqrt><mi>&nbsp;</mi><mn>m</mn></math><br /><br />Acceleration of car <math><mfenced separators=\"|\"><mrow><mi>a</mi></mrow></mfenced><mo>=</mo><mn>5</mn><mi>&nbsp;</mi><mn>m&nbsp;</mn><msup><mrow><mn>s</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></math><br /><br />Now <math><msub><mrow><mi>g</mi></mrow><mrow><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">e</mi></mrow></msub><mo>=</mo><msqrt><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>g</mi></mrow><mrow><mn>2</mn></mrow></msup></msqrt></math><br /><br /><math><mo>=</mo><msqrt><msup><mrow><mfenced separators=\"|\"><mrow><mn>5</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>10</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></msqrt></math><br /><br /><math><mo>=</mo><msqrt><mn>125</mn></msqrt><mo>=</mo><mn>5</mn><msqrt><mn>5</mn></msqrt></math><br /><br /><math><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>l</mi></mrow><mrow><msub><mrow><mi>g</mi></mrow><mrow><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">e</mi></mrow></msub></mrow></mfrac></msqrt></math><br /><br /><math><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><msqrt><mn>5</mn></msqrt></mrow><mrow><mn>5</mn><msqrt><mn>5</mn></msqrt></mrow></mfrac></msqrt></math><br /><br /><math><mi>T</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>π</mi></mrow><mrow><msqrt><mn>5</mn></msqrt></mrow></mfrac><mi>&nbsp;</mi><mn>s</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86307cea85e1f08e319", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "43", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the arrangement shown in the diagram, pulleys are small and springs are ideal.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>k</mi><mn>1</mn></msub><mo>=</mo><msub><mi>k</mi><mn>2</mn></msub><mo>=</mo><msub><mi>k</mi><mn>3</mn></msub><mo>=</mo><msub><mi>k</mi><mn>4</mn></msub><mo>=</mo><mn>10</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>are force constants of the springs and mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>=</mo><mn>10</mn><mo>&nbsp;</mo><mi>kg</mi></math>. If the time period of small vertical oscillations of the block of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> is given by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>π</mi><mtext>x&nbsp;seconds</mtext></math>,&nbsp;then find the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi></math>.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0024376_Question_1.j null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630777fa893adfe79a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "04", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A particle of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> is allowed to oscillate near the point of minima of a vertical parabolic path having the equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>a</mi><mi>y</mi></math>, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>-</mo><mi>a</mi><mi>x</mi><mi>i</mi><mi>s</mi></math>&nbsp;is along the horizontal direction and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>-</mo><mi>a</mi><mi>x</mi><mi>i</mi><mi>s</mi></math>&nbsp;is along the vertical direction. The angular frequency of small oscillations of the particle is</p>\r", "image": null}, "options": [{"id": "rpfht", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mrow><mn>8</mn><mi>g</mi></mrow><mi>a</mi></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "VZPR0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mrow><mn>2</mn><mi>g</mi></mrow><mi>a</mi></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "ijLWp", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mi>g</mi><mi>a</mi></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "WjDB3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mi>g</mi><mrow><mn>2</mn><mi>a</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-05-22_at_7.16.29_PM.jpeg\" style=\"width: 230px; height: 153px;\" /><br /><br /><math> <mrow> <mtext>ma</mtext> <mo>=</mo> <mo>-</mo> <mtext>mg</mtext> <mo>sin</mo> <mi>θ</mi> </mrow> </math><br /><br /><math> <mrow> <mtext>a</mtext> <mo>=</mo> <mo>-</mo> <mo>g sin</mo> <mi>θ</mi> </mrow> </math>&nbsp;&nbsp;or&nbsp;&nbsp;<math> <mrow> <mtext>a</mtext> <mo>=</mo> <mo>-</mo> <mo>g tan</mo> <mi>θ</mi> </mrow> </math>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;...(i)<br /><br />(as <math> <mrow> <mi>θ</mi> </mrow> </math> is small)<br /><br />Now,&nbsp;<math><mrow><msup><mtext>x</mtext> <mn>2</mn> </msup> <mo>=</mo> <mn>4</mn> <mtext>ay</mtext> </mrow> </math><br /><br /><math> <mrow> <mo>∴&nbsp;&nbsp;&nbsp;</mo> <mfrac> <mrow> <mtext>dy</mtext> </mrow> <mrow> <mtext>dx</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>x</mtext> </mrow> <mrow> <mn>2</mn> <mtext>a</mtext> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>∴&nbsp;&nbsp;&nbsp;</mo> <mtext>a</mtext> <mo>=</mo> <mo>-</mo> <mtext>g</mtext> <mfrac> <mrow> <mtext>x</mtext> </mrow> <mrow> <mn>2</mn> <mtext>a</mtext> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>-</mo> <msup> <mi>ω</mi> <mn>2</mn> </msup> <mtext>x</mtext> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <mtext>gx</mtext> </mrow> <mrow> <mn>2</mn> <mtext>a</mtext> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mi>ω</mi> <mo>=</mo> <msqrt> <mfrac> <mrow> <mtext>g</mtext> </mrow> <mrow> <mn>2</mn> <mtext>a</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863057efca73bdf838a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "06", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The time period of a simple pendulum is&nbsp;<math><msub><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow></msub></math>&nbsp;when its point of suspension is at rest with respect to the ground. When the point of suspension moves vertically upwards according to the law&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>k</mi><msup><mi>t</mi><mn>2</mn></msup></math>&nbsp;where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi><mo>=</mo><mn>1</mn><mo>&#160;</mo><msup><mi>ms</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>, its new time period is <math><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub></math>, then the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msubsup><mi>T</mi><mn>1</mn><mn>2</mn></msubsup><msubsup><mi>T</mi><mn>2</mn><mn>2</mn></msubsup></mfrac></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>[</mo></math>Take&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mo>=</mo><mn>10</mn><mo>&#160;</mo><msup><mi>ms</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>]</mo></math>", "image": null}, "options": [{"id": "M7J9z", "text": "<math><mfrac><mrow><mn>4</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "JbvJi", "text": "<math><mfrac><mrow><mn>6</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "Y2XKQ", "text": "<math><mfrac><mrow><mn>5</mn></mrow><mrow><mn>6</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "4eUvp", "text": "<math><mn>1</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Acceleration of the point of suspension<br /><br /><math><mi>a</mi><mo>=</mo><mfrac><mrow><msup><mrow><mi>d</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>y</mi></mrow><mrow><mi>d</mi><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>=</mo><mn>2</mn><mi>k</mi><mo>=</mo><mn>2</mn><mrow><mrow><mi>m</mi></mrow><mo>/</mo><mrow><msup><mrow><mi>s</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mrow></math><br /><br /><math><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>L</mi></mrow><mrow><msub><mrow><mi>g</mi></mrow><mrow><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">f</mi></mrow></msub></mrow></mfrac></msqrt><mi>&nbsp;</mi><mo>⇒</mo><msub><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>L</mi></mrow><mrow><mtext>g</mtext></mrow></mfrac></msqrt><mi>&nbsp;</mi><mi>&nbsp;</mi></math><br /><br /><math><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>L</mi></mrow><mrow><mi>g</mi><mo>+</mo><mn>2</mn></mrow></mfrac></msqrt></math><br /><br /><math ><mfrac><mrow><msubsup><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><msubsup><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>g</mi><mo>+</mo><mn>2</mn></mrow><mrow><mi>g</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>10</mn><mo>+</mo><mn>2</mn></mrow><mrow><mn>10</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>6</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math><br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863040bf1d124c018e1", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "01", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A mass <math> <mtext>M</mtext> </math> attached to a spring oscillates with a period of <math> <mrow> <mtext>2&nbsp;s</mtext></mrow> </math>. If the mass is increased by <math> <mrow> <mtext>2&nbsp;kg</mtext></mrow> </math> the period increases by one sec. Find the initial mass <math> <mtext>M</mtext> </math> (In <math> <mrow> <mtext>kg</mtext></mrow> </math>) assuming that Hooke’s Law is obeyed.", "image": null}, "options": [], "correctValue": "1.6", "solution": {"text": "<math> <mrow> <mtext>T</mtext> <mo>=</mo> <mn>2</mn> <mi>π</mi> <msqrt> <mfrac> <mrow> <mtext>M</mtext> </mrow> <mrow> <mtext>K</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>&nbsp; or &nbsp;<math> <mrow> <mtext>T</mtext> <mo>∝</mo> <msqrt> <mtext>M</mtext> </msqrt> <mtext>,&nbsp;&nbsp;</mtext> <mfrac> <mrow> <msub> <mtext>T</mtext> <mn>2</mn> </msub> </mrow> <mrow> <msub> <mtext>T</mtext> <mn>1</mn> </msub> </mrow> </mfrac> <mo>=</mo> <msqrt> <mfrac> <mrow> <msub> <mtext>M</mtext> <mn>2</mn> </msub> </mrow> <mrow> <msub> <mtext>M</mtext> <mn>1</mn> </msub> </mrow> </mfrac> </msqrt> </mrow> </math><br /><br /><math> <mrow> <mo>∴&nbsp;&nbsp;&nbsp;</mo> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>=</mo> <msqrt> <mfrac> <mrow> <mtext>M</mtext> <mo>+</mo> <mn>2</mn> </mrow> <mrow> <mtext>M</mtext> </mrow> </mfrac> </msqrt> </mrow> </math><br /><br />Solving this equation we get, <math> <mrow> <mtext>M</mtext> <mo>&nbsp;=&nbsp;</mo> <mtext>1.6 kg</mtext> </mrow> </math>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863027fe5a146f45eda", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "108", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Calculate the angular frequency of the system shown in figure. Friction is absent everywhere and the threads, spring and pulleys are massless. Given that m<sub>A</sub> = m<sub>B</sub> = m.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014080_Ques1_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"height: 131px; width: 200px;\" />", "image": null}, "options": [{"id": "DAnVp", "text": "<math><mrow>&nbsp;<msqrt><mfrac><mrow><mtext>2k</mtext> </mrow> <mrow> <mtext>4m</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "FawmV", "text": "<math> <mrow> <msqrt> <mfrac> <mrow> <mtext>4k</mtext> </mrow> <mrow> <mtext>5m</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "rELeZ", "text": "<math><mrow>&nbsp;<msqrt><mfrac><mrow><mtext>6k</mtext> </mrow> <mrow> <mtext>7m</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "AcCIb", "text": "<math><mrow>  <msqrt>    <mfrac>      <mrow>        <mtext>8k</mtext>      </mrow>      <mrow>        <mtext>5m</mtext>      </mrow>    </mfrac>  </msqrt></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let x<sub>0</sub>&nbsp;be the extension in the spring in equilibrium. Then equilibrium of A and B give,<br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;T = kx<sub>0</sub> + mg sin &theta; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; ...(i)<br /><br />and &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;2T = mg &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; ...(ii)<br /><br />Here, T is the tension in t sp;</mo> <msup> <mi>&theta;</mi> <mo>&prime;</mo> </msup> <mo>=</mo> <msup> <mtext>cos</mtext> <mn>-1</mn> </msup> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>1</mn> <mo>+</mo> <mtext>cos&nbsp;</mtext> <mi>&theta;</mi> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msup> <mi>&theta;</mi> <mo>&prime;</mo> </msup> <mo>=</mo> <msup> <mtext>cos</mtext> <mn>-1</mn> </msup> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>1</mn> <mo>+</mo> <mtext>cos</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi>&pi;</mi> <mo>/</mo> <mn>3</mn> </mrow> </mfenced> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <msup> <mtext>cos</mtext> <mn>-1</mn> </msup> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>1</mn> <mo>+</mo> <mn>1</mn> <mo>/</mo> <mn>2</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </mfenced> <mo>=</mo> <msup> <mtext>cos</mtext> <mn>-1</mn> </msup> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863de4e733893f216c3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "31", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The length of a simple pendulum executing simple harmonic motion is increased by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>21</mn><mo>%</mo></math>. The percentage increase in the time period of the pendulum of increased length is", "image": null}, "options": [{"id": "525U7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>11</mn><mo>%</mo></math>", "image": null, "isCorrect": false}, {"id": "P50LR", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>21</mn><mo>%</mo></math>", "image": null, "isCorrect": false}, {"id": "j45RW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>42</mn><mo>%</mo></math>", "image": null, "isCorrect": false}, {"id": "hr1TF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>%</mo></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>Let the lengths of the pendulum be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mtext>100</mtext><mtext mathvariant=\"italic\">l</mtext><mtext>)</mtext></math>&nbsp;&nbsp;and &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mtext>121</mtext><mtext mathvariant=\"italic\">l</mtext><mo>)</mo></math></p><p>Since we know the time period of a simple pendulum is given by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi><msqrt><mfrac><mi>l</mi><mi mathvariant=\"normal\">g</mi></mfrac></msqrt></math><br /><br /><math> <mrow> <mo>&#8756;</mo> </mrow> </math>&nbsp; &nbsp; &nbsp; &nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mtext>T</mtext><mo>'</mo></msup><mtext>T</mtext></mfrac><mo>=</mo><msqrt><mfrac><mn>121</mn><mtext>100</mtext></mfrac></msqrt><mo>=</mo><mfrac><mn>11</mn><mn>10</mn></mfrac></math><br /><br /><math> <mrow> <mo>&#8756;</mo> </mrow> </math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp; Fractional change = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msup><mtext>T</mtext><mo>'</mo></msup><mo>-</mo><mtext>T</mtext></mrow><mtext>T</mtext></mfrac><mo>=</mo><mfrac><mrow><mn>11</mn><mo>-</mo><mn>10</mn></mrow><mn>10</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>10</mn></mfrac></math><br /><br /><math> <mrow> <mo>&#8756;</mo> </mrow> </math>&nbsp; &nbsp; &nbsp; &nbsp; Percentage change =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>%</mo></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863dc6078098631679c", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "40", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform solid cylinder can roll without sliding on a horizontal surface as shown in the figure. The mass of cylinder is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi>kg</mi></math> and the spring constant for both the ideal springs is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. What is the angular frequency (in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>rad</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>) of small oscillations of the centre of the cylinder?<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Phys_22.JPG\" style=\"width: 250px; height: 129px;\" />", "image": null}, "options": [], "correctValue": "10", "solution": {"text": "<p>The total energy of the system is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mo>=</mo><mfrac><mn>3</mn><mn>4</mn></mfrac><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>5</mn><mn>2</mn></mfrac><mi>k</mi><msup><mi>x</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>E</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>m</mi><mi>a</mi><mo>+</mo><mn>5</mn><mi>k</mi><mi>x</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mo>-</mo><mfrac><mrow><mn>10</mn><mi>k</mi></mrow><mrow><mn>3</mn><mi>m</mi></mrow></mfrac><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#969;</mi><mo>=</mo><msqrt><mfrac><mrow><mn>10</mn><mi>k</mi></mrow><mrow><mn>3</mn><mi>m</mi></mrow></mfrac></msqrt><mo>=</mo><mn>10</mn><mo>&#160;</mo><mi>rad</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863cee1e5558413c487", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "64", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The system shown in the adjacent figure is in equilibrium. The mass of the container with liquid is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math>, the density of the liquid in the container is <math><mi>ρ</mi></math> and volume of the block is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi></math>. If the container is now displaced downwards through a distance <math><msub><mrow><mi>x</mi></mrow><mrow><mn>0</mn></mrow></msub></math> and released such that block remains well inside the liquid, during subsequent motion (ignore viscosity)<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/lyhbzfrsipsldkyjfbjvvqpsypdobbqfsetidyqjxnpnzcijng.jpeg\" style=\"height: 224px; width: 150px;\" />", "image": null}, "options": [{"id": "z4eiA", "text": "Time period of SHM of the container will be <math><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mfenced separators=\"|\"><mrow><mi>M</mi><mo>+2</mo><mi>ρ</mi><mi>v</mi></mrow></mfenced></mrow><mrow><mi>k</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "maRH6", "text": "Time period of SHM of the container will be <math><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mfenced separators=\"|\"><mrow><mi>M</mi><mo>+</mo><mi>ρ</mi><mi>v</mi></mrow></mfenced></mrow><mrow><mi>k</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "FBEbZ", "text": "The amplitude of SHM of the container will be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>x</mi><mn>0</mn></msub><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "GUE9u", "text": "Container will not perform SHM", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi>M</mi><mi>g</mi><mo>-</mo><mi>k</mi><mfenced separators=\"|\"><mrow><mi>x</mi><mo>+</mo><mi mathvariant=\"normal\">Δ</mi><mi>x</mi></mrow></mfenced><mo>+</mo><mi>ρ</mi><mfenced separators=\"|\"><mrow><mi>V</mi></mrow></mfenced><mi>&nbsp;</mi><mfenced separators=\"|\"><mrow><mi>g</mi><mo>-</mo><mi>a</mi></mrow></mfenced><mo>=</mo><mi>M</mi><mi>a</mi></math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-07-21_at_3.07.43_PM.jpeg\" style=\"width: 200px; height: 210px;\" /><br /><br />Where <math><mi>M</mi><mi>g</mi><mo>+</mo><mi>ρ</mi><mi>V</mi><mi>g</mi><mo>=</mo><mi>K</mi><mi mathvariant=\"normal\">Δ</mi><mi>x</mi></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mfenced separators=\"|\"><mrow><mi>M</mi><mo>+</mo><mi>ρ</mi><mi>V</mi></mrow></mfenced><mi>a</mi><mo>=</mo><mo>-</mo><mi>K</mi><mi>x</mi></math><br /><br />Or <math><mi>a</mi><mo>-</mo><mfrac><mrow><mi>k</mi><mi>x</mi></mrow><mrow><mfenced separators=\"|\"><mrow><mi>M</mi><mo>+</mo><mi>ρ</mi><mi>V</mi></mrow></mfenced></mrow></mfrac></math> or <math><mi>ω</mi><mo>=</mo><mi>&nbsp;</mi><mo>-</mo><msqrt><mfrac><mrow><mi>k</mi></mrow><mrow><mi>M</mi><mo>+</mo><mi>ρ</mi><mi>V</mi></mrow></mfrac></msqrt></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mfenced separators=\"|\"><mrow><mi>M</mi><mo>+</mo><mi>ρ</mi><mi>V</mi></mrow></mfenced></mrow><mrow><mi>K</mi></mrow></mfrac></msqrt></math><br /><br />The amplitude of SHM will be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>x</mi><mn>0</mn></msub></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ceab70720b45784b", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "102", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A block of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi></math> is placed on a smooth horizontal surface and it is pulled by a light spring as shown in the diagram. If the ends A and B of the spring are moving with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> respectively and the rate at which spring energy is increasing is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">J</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. then what is the value of spring force (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">N</mi></math>)?<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0024635_Question_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 287px; height: 103px;\" />", "image": null}, "options": [], "correctValue": "10", "solution": {"text": "Let, distance moved by A and B in any time interval as measured from natural length of spring are xA and xB respectively. Let, <math> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>l</mi><mo>&#8289;</mo> </mrow> </math> is the natural length of spring, then elongation in spring at any instant is<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>x</mtext><mo>=</mo><mfenced><mrow><msub><mtext>x</mtext><mi mathvariant=\"normal\">A</mi></msub><mo>-</mo><msub><mtext>x</mtext><mi mathvariant=\"normal\">B</mi></msub><mo>-</mo><mi>l</mi><mo>&#8289;</mo></mrow></mfenced></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext>U</mtext> <mo>=</mo> <mfrac> <mrow> <msup> <mtext>kx</mtext> <mn>2</mn> </msup> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow><mfrac><mrow><mtext>dU</mtext> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> <mo>=</mo> <mtext>P</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>k</mtext> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>&#215;</mo> <mn>2</mn> <mtext>x</mtext> <mfrac> <mrow> <mtext>dx</mtext> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>&#8658;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</mo> <mn>2</mn> <mn>0</mn> <mo>=</mo> <mtext>kx&#160;</mtext> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <msub> <mtext>v</mtext> <mtext>A</mtext> </msub> <mo>-</mo> <msub> <mtext>v</mtext> <mtext>B</mtext> </msub> </mrow> </mfenced> </mrow> </math><br /><br /><math> <mrow> <mo>&#8658;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</mo> <mtext>kx</mtext> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> <mn>0</mn> </mrow> <mrow> <mn>4</mn> <mo>-</mo> <mn>2</mn> </mrow> </mfrac> <mo>=</mo> <mn>1</mn> <mn>0&#160;</mn> <mtext>N</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c8c9d13e32187ef5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "18", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The length of the second's pendulum on the surface of the earth is <math><mn>1&nbsp;</mn><mi mathvariant=\"normal\">m</mi></math>. If the acceleration due to gravity on the surface of the moon is one-sixth of the acceleration due to gravity of the earth, then the length of the second's pendulum on the surface of the moon will be", "image": null}, "options": [{"id": "pzeWu", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>6&nbsp;</mn></mrow></mfrac><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": true}, {"id": "fXhbc", "text": "<math><mn>6&nbsp;</mn><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "UTTRx", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>36&nbsp;</mn></mrow></mfrac><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "H0IVy", "text": "<math><mn>36&nbsp;</mn><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Seconds pendulum is a special pendulum having a time period of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">s</mi></math>.<br /><br />Using the formula <math> <mrow> <mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt> <mrow> <mfrac> <mi>L</mi> <mi>g</mi></mfrac></mrow></msqrt></mrow></math><br /><br />If the time period remains the same and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi></math> is reduced by a factor of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn></math>.<br />L should be reduced by a factor of 6.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>L</mi><mo>=</mo><mfrac><mn>1</mn><mn>6</mn></mfrac><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> on moon.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c89dc5439bad53b3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "36", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The time period of a spring-mass system is <math><mi>T</mi></math>. If this spring is cut into two parts, whose lengths are in the ratio&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>:</mo><mn>2</mn></math>, and the same mass is attached to the longer part, the new time period will be", "image": null}, "options": [{"id": "4vyzJ", "text": "<math><msqrt><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac></msqrt><mi> </mi><mi>T</mi></math>", "image": null, "isCorrect": false}, {"id": "mfTUg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mn>2</mn><mn>3</mn></mfrac></msqrt><mi>T</mi></math>", "image": null, "isCorrect": true}, {"id": "35DSu", "text": "<math><mfrac><mrow><msqrt><mn>3</mn></msqrt><mi>T</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "Uw3zt", "text": "<math><msqrt><mn>3</mn></msqrt><mi>T</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The spring-mass system oscillates in SHM. Its time period is given by</p><p><math><mi>T</mi><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><mrow><mi>m</mi></mrow><mrow><mi>k</mi></mrow></mfrac></msqrt></math></p><p>When spring is cut in ratio <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>:</mo><mn>2</mn></math>, the new spring constant is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi><mo>'</mo><mo>=</mo><mn>3</mn><mi>k</mi><mo>&#8203;/2</mo></math>&nbsp;(for the longer part)</p><p><math><mo>&#8756;</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>T</mi><mrow><mi>T</mi><mo>'</mo></mrow></mfrac><mo>=</mo><msqrt><mfrac><mstyle displaystyle=\"true\"><mfrac bevelled=\"true\"><mrow><mn>3</mn><mi>k</mi></mrow><mn>2</mn></mfrac></mstyle><mi>k</mi></mfrac></msqrt></math></p><p><math><mo>&#8658;</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>'</mo><mo>=</mo><msqrt><mfrac><mn>2</mn><mn>3</mn></mfrac></msqrt><mi>T</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c248de4a1da594a1", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "22", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Consider the figure here. A particle of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math>&nbsp;is constrained to move inside a smooth vertical groove of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> and is connected to a light spring of spring constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">K</mi></math>&nbsp;in equilibrium. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">O</mi></math> is centre of the groove. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">y</mi></math> are horizontal and vertical axes respectively. Different physical parameters are related as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>KR</mi><mo>=</mo><mn>7</mn><mi>mg</mi></math>. Angular frequency of the oscillations, if the particle is slightly displaced from the shown equilibrium position is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/137114-2.JPG\" style=\"width: 230px; height: 419px;\" />", "image": null}, "options": [{"id": "vP6fK", "text": "<math><msqrt><mfrac><mrow><mi mathvariant=\"normal\">g</mi></mrow><mrow><mi mathvariant=\"normal\">R</mi></mrow></mfrac></msqrt></math>", "image": nu
