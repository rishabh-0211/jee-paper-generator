noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630c7f60ba9af2d889", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "88", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The time-period of a simple pendulum of length <math><msqrt><mn>5</mn></msqrt><mi>&nbsp;</mi><mn>m</mn></math> suspended in a car moving with uniform acceleration of <math><mn>5</mn><mi>&nbsp;</mi><mn>m&nbsp;</mn><msup><mrow><mn>s</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></math> in a horizontal straight road is <math><mfenced separators=\"|\"><mrow><mi>g</mi><mo>=</mo><mn>10</mn><mi>&nbsp;</mi><mn>m&nbsp;</mn><msup><mrow><mn>s</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced></math>", "image": null}, "options": [{"id": "igv4s", "text": "<math><mfrac><mrow><mn>2</mn><mi>π</mi></mrow><mrow><msqrt><mn>5</mn></msqrt></mrow></mfrac><mi>&nbsp;</mi><mn>s</mn></math>", "image": null, "isCorrect": true}, {"id": "RvPbq", "text": "<math><mfrac><mrow><mi>π</mi></mrow><mrow><msqrt><mn>5</mn></msqrt></mrow></mfrac><mi> </mi><mn>s</mn></math>", "image": null, "isCorrect": false}, {"id": "D2DWH", "text": "<math><mn>5</mn><mi>π</mi><mi> </mi><mn>s</mn></math>", "image": null, "isCorrect": false}, {"id": "iHlQC", "text": "<math><mn>4</mn><mi>π</mi><mi> </mi><mn>s</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, Length of simple pendulum, <math><mi>l</mi><mo>=</mo><msqrt><mn>5</mn></msqrt><mi>&nbsp;</mi><mn>m</mn></math><br /><br />Acceleration of car <math><mfenced separators=\"|\"><mrow><mi>a</mi></mrow></mfenced><mo>=</mo><mn>5</mn><mi>&nbsp;</mi><mn>m&nbsp;</mn><msup><mrow><mn>s</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></math><br /><br />Now <math><msub><mrow><mi>g</mi></mrow><mrow><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">e</mi></mrow></msub><mo>=</mo><msqrt><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>g</mi></mrow><mrow><mn>2</mn></mrow></msup></msqrt></math><br /><br /><math><mo>=</mo><msqrt><msup><mrow><mfenced separators=\"|\"><mrow><mn>5</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>10</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></msqrt></math><br /><br /><math><mo>=</mo><msqrt><mn>125</mn></msqrt><mo>=</mo><mn>5</mn><msqrt><mn>5</mn></msqrt></math><br /><br /><math><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>l</mi></mrow><mrow><msub><mrow><mi>g</mi></mrow><mrow><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">e</mi></mrow></msub></mrow></mfrac></msqrt></math><br /><br /><math><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><msqrt><mn>5</mn></msqrt></mrow><mrow><mn>5</mn><msqrt><mn>5</mn></msqrt></mrow></mfrac></msqrt></math><br /><br /><math><mi>T</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>π</mi></mrow><mrow><msqrt><mn>5</mn></msqrt></mrow></mfrac><mi>&nbsp;</mi><mn>s</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86307cea85e1f08e319", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "43", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the arrangement shown in the diagram, pulleys are small and springs are ideal.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>k</mi><mn>1</mn></msub><mo>=</mo><msub><mi>k</mi><mn>2</mn></msub><mo>=</mo><msub><mi>k</mi><mn>3</mn></msub><mo>=</mo><msub><mi>k</mi><mn>4</mn></msub><mo>=</mo><mn>10</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>are force constants of the springs and mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>=</mo><mn>10</mn><mo>&nbsp;</mo><mi>kg</mi></math>. If the time period of small vertical oscillations of the block of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> is given by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>π</mi><mtext>x&nbsp;seconds</mtext></math>,&nbsp;then find the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi></math>.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0024376_Question_1.jpg\" style=\"width: 200px; height: 228px;\" />", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">T</mtext><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mtext mathvariant=\"italic\">m</mtext><msub><mtext mathvariant=\"italic\">K</mtext><mtext>eq</mtext></msub></mfrac></msqrt></math><br /><br />where&nbsp;&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">K</mtext><mtext>eq</mtext></msub><mo>=</mo><mfrac><mn>1</mn><mrow><mn>4&nbsp;</mn><mfenced close=\"]\" open=\"[\"><mrow><mfrac><mn>1</mn><msub><mtext mathvariant=\"italic\">k</mtext><mn>1</mn></msub></mfrac><mo>+</mo><mfrac><mn>1</mn><msub><mtext mathvariant=\"italic\">k</mtext><mn>2</mn></msub></mfrac><mo>+</mo><mfrac><mn>1</mn><msub><mtext mathvariant=\"italic\">k</mtext><mn>3</mn></msub></mfrac><mo>+</mo><mfrac><mn>1</mn><msub><mtext mathvariant=\"italic\">k</mtext><mn>4</mn></msub></mfrac></mrow></mfenced></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn><mn>0</mn></mrow><mrow><mn>1</mn><mn>6</mn></mrow></mfrac></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">T</mtext><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mtext mathvariant=\"italic\">m</mtext><msub><mtext mathvariant=\"italic\">K</mtext><mtext>eq</mtext></msub></mfrac></msqrt><mo>=</mo><mn>2</mn><mi>π</mi><mtext>x</mtext></math><br /><br />So,&nbsp;&nbsp;&nbsp; <math> <mrow> <mtext>x</mtext> <mo>=</mo> <msqrt> <mfrac> <mrow> <mn>1</mn> <mn>0</mn> </mrow> <mrow> <mn>1</mn> <mn>0</mn> <mo>/</mo> <mn>1</mn> <mn>6</mn> </mrow> </mfrac> </msqrt> <mo>=</mo> <mn>4</mn> <mtext>,&nbsp;</mtext> <mtext>x</mtext> <mo>=</mo> <mn>4</mn> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86307b644290aaa5220", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "84", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The spring block system lies on a smooth horizontal surface. The free end of the spring is being pulled towards the right with constant speed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub><mo>=</mo><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. At <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">t</mi><mo>=</mo><mn>0</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">s</mi></math>, the spring of constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">k</mi><mo>=</mo><mn>100</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><mi mathvariant=\"normal\">c</mi><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> is unstretched and the block has a speed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> to left. The maximum extension of the spring will be<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image39-eb366023-ff68-46ed-9dc2-2a9b1845126e.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 200px; height: 55px;\" />", "image": null}, "options": [{"id": "UsdJc", "text": "<math><mn>2&nbsp;</mn><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "j8Dh4", "text": "<math><mn>4</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "tZLLg", "text": "<math><mn>6</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": true}, {"id": "piok9", "text": "<math><mn>8</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In the frame (inertial w.r.t. earth) of the free end of spring, the initial velocity of the block is <math><mn>3&nbsp;</mn><mrow><mrow><mi mathvariant=\"normal\">m</mi></mrow><mo>/</mo><mrow><mi mathvariant=\"normal\">s</mi></mrow></mrow></math> to left and the spring is unstretched.<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image40-bbd67ba3-e913-4af6-ab83-564b57876558.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"height: 135px; width: 280px;\" /><br /><br />Applying conservation of energy between initial and maximum extension state,<br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">m</mi><msup><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">k</mi><msup><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br /><math><mi mathvariant=\"normal\">A</mi><mo>=</mo><msqrt><mfrac><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mi mathvariant=\"normal\">k</mi></mrow></mfrac></msqrt><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">V</mi><mo>=</mo><msqrt><mfrac><mrow><mn>4</mn></mrow><mrow><mn>10000</mn></mrow></mfrac></msqrt><mo>×</mo><mn>3</mn><mo>=</mo><mn>6</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863057efca73bdf838a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "06", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The time period of a simple pendulum is&nbsp;<math><msub><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow></msub></math>&nbsp;when its point of suspension is at rest with respect to the ground. When the point of suspension moves vertically upwards according to the law&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>k</mi><msup><mi>t</mi><mn>2</mn></msup></math>&nbsp;where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi><mo>=</mo><mn>1</mn><mo>&#160;</mo><msup><mi>ms</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>, its new time period is <math><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub></math>, then the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msubsup><mi>T</mi><mn>1</mn><mn>2</mn></msubsup><msubsup><mi>T</mi><mn>2</mn><mn>2</mn></msubsup></mfrac></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>[</mo></math>Take&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mo>=</mo><mn>10</mn><mo>&#160;</mo><msup><mi>ms</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>]</mo></math>", "image": null}, "options": [{"id": "M7J9z", "text": "<math><mfrac><mrow><mn>4</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "JbvJi", "text": "<math><mfrac><mrow><mn>6</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "Y2XKQ", "text": "<math><mfrac><mrow><mn>5</mn></mrow><mrow><mn>6</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "4eUvp", "text": "<math><mn>1</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Acceleration of the point of suspension<br /><br /><math><mi>a</mi><mo>=</mo><mfrac><mrow><msup><mrow><mi>d</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>y</mi></mrow><mrow><mi>d</mi><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>=</mo><mn>2</mn><mi>k</mi><mo>=</mo><mn>2</mn><mrow><mrow><mi>m</mi></mrow><mo>/</mo><mrow><msup><mrow><mi>s</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mrow></math><br /><br /><math><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>L</mi></mrow><mrow><msub><mrow><mi>g</mi></mrow><mrow><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">f</mi></mrow></msub></mrow></mfrac></msqrt><mi>&nbsp;</mi><mo>⇒</mo><msub><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>L</mi></mrow><mrow><mtext>g</mtext></mrow></mfrac></msqrt><mi>&nbsp;</mi><mi>&nbsp;</mi></math><br /><br /><math><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>L</mi></mrow><mrow><mi>g</mi><mo>+</mo><mn>2</mn></mrow></mfrac></msqrt></math><br /><br /><math ><mfrac><mrow><msubsup><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><msubsup><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>g</mi><mo>+</mo><mn>2</mn></mrow><mrow><mi>g</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>10</mn><mo>+</mo><mn>2</mn></mrow><mrow><mn>10</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>6</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math><br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863040bf1d124c018e1", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "01", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A mass <math> <mtext>M</mtext> </math> attached to a spring oscillates with a period of <math> <mrow> <mtext>2&nbsp;s</mtext></mrow> </math>. If the mass is increased by <math> <mrow> <mtext>2&nbsp;kg</mtext></mrow> </math> the period increases by one sec. Find the initial mass <math> <mtext>M</mtext> </math> (In <math> <mrow> <mtext>kg</mtext></mrow> </math>) assuming that Hooke’s Law is obeyed.", "image": null}, "options": [], "correctValue": "1.6", "solution": {"text": "<math> <mrow> <mtext>T</mtext> <mo>=</mo> <mn>2</mn> <mi>π</mi> <msqrt> <mfrac> <mrow> <mtext>M</mtext> </mrow> <mrow> <mtext>K</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>&nbsp; or &nbsp;<math> <mrow> <mtext>T</mtext> <mo>∝</mo> <msqrt> <mtext>M</mtext> </msqrt> <mtext>,&nbsp;&nbsp;</mtext> <mfrac> <mrow> <msub> <mtext>T</mtext> <mn>2</mn> </msub> </mrow> <mrow> <msub> <mtext>T</mtext> <mn>1</mn> </msub> </mrow> </mfrac> <mo>=</mo> <msqrt> <mfrac> <mrow> <msub> <mtext>M</mtext> <mn>2</mn> </msub> </mrow> <mrow> <msub> <mtext>M</mtext> <mn>1</mn> </msub> </mrow> </mfrac> </msqrt> </mrow> </math><br /><br /><math> <mrow> <mo>∴&nbsp;&nbsp;&nbsp;</mo> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>=</mo> <msqrt> <mfrac> <mrow> <mtext>M</mtext> <mo>+</mo> <mn>2</mn> </mrow> <mrow> <mtext>M</mtext> </mrow> </mfrac> </msqrt> </mrow> </math><br /><br />Solving this equation we get, <math> <mrow> <mtext>M</mtext> <mo>&nbsp;=&nbsp;</mo> <mtext>1.6 kg</mtext> </mrow> </math>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863027fe5a146f45eda", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "108", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Calculate the angular frequency of the system shown in figure. Friction is absent everywhere and the threads, spring and pulleys are massless. Given that m<sub>A</sub> = m<sub>B</sub> = m.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014080_Ques1_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"height: 131px; width: 200px;\" />", "image": null}, "options": [{"id": "DAnVp", "text": "<math><mrow>&nbsp;<msqrt><mfrac><mrow><mtext>2k</mtext> </mrow> <mrow> <mtext>4m</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "FawmV", "text": "<math> <mrow> <msqrt> <mfrac> <mrow> <mtext>4k</mtext> </mrow> <mrow> <mtext>5m</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "rELeZ", "text": "<math><mrow>&nbsp;<msqrt><mfrac><mrow><mtext>6k</mtext> </mrow> <mrow> <mtext>7m</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "AcCIb", "text": "<math><mrow>  <msqrt>    <mfrac>      <mrow>        <mtext>8k</mtext>      </mrow>      <mrow>        <mtext>5m</mtext>      </mrow>    </mfrac>  </msqrt></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let x<sub>0</sub>&nbsp;be the extension in the spring in equilibrium. Then equilibrium of A and B give,<br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;T = kx<sub>0</sub> + mg sin &theta; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; ...(i)<br /><br />and &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;2T = mg &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; ...(ii)<br /><br />Here, T is the tension in the string. Now, suppose A is further displaced by a distance x from its mean position and v be its speed at this moment. Then B lowers by <math> <mrow> <mfrac> <mrow> <mi>x</mi> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math> and speed of B at this instant will be <math> <mrow> <mfrac> <mrow> <mi>v</mi> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math> Total energy of the system in this position will be,<br /><br /><math> <mrow> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>E</mtext> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>k</mtext> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi>x</mi> <mo>+</mo> <msub> <mi>x</mi> <mn>0</mn> </msub> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msub> <mtext>m</mtext> <mtext>A</mtext> </msub> <msup> <mtext>v</mtext> <mn>2</mn> </msup> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msub> <mtext>m</mtext> <mtext>B</mtext> </msub> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>v</mtext> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> <mo>+</mo> <msub> <mtext>m</mtext> <mtext>A</mtext> </msub> <msub> <mtext>gh</mtext> <mtext>A</mtext> </msub> <mo>-</mo> <msub> <mtext>m</mtext> <mtext>B</mtext> </msub> <msub> <mtext>gh</mtext> <mtext>B</mtext> </msub> </mrow> </math><br /><br /><math> <mrow> <mtext>or</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>E</mtext> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>k</mtext> <msup> <mrow> <mfenced cl retchy=\"false\">&#8721;</mo><mrow><msub><mrow><mi>A</mi></mrow><mrow><mi>x</mi></mrow></msub></mrow></mrow></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>7.2</mn></mrow><mrow><mn>8.46</mn></mrow></mfrac><mo>=</mo><mn>0.85</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#981;</mi><mo>=</mo><msup><mi>tan</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#8289;</mo><mfenced separators=\"|\"><mn>0.85</mn></mfenced><mo>=</mo><mn>40.4</mn><mo>&#176;</mo></math><br /><br />Thus, the displacement equation of combined motion is<br /><br /><math><mi>x</mi><mo>=</mo><mn>11.25</mn><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mfenced separators=\"|\"><mrow><mi>&#969;</mi><mi>t</mi><mo>+</mo><mi>&#981;</mi></mrow></mfenced></mrow></mrow></math><br /><br />Where, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#981;</mi><mo>=</mo><mn>40.4</mn><mo>&#176;</mo></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863723d994d27116dd4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "47", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The motion of a particle varies with time according to the relation <math><mi>y</mi><mo>=</mo><mi>a</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>ω</mi><mi>t</mi><mo>+</mo><mi>b</mi><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>ω</mi><mi>t</mi></mrow></mrow></mrow></mrow></math>", "image": null}, "options": [{"id": "haRIK", "text": "The motion is oscillatory but not SHM", "image": null, "isCorrect": false}, {"id": "DLAkV", "text": "The motion is SHM with amplitude&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>&nbsp;</mo><mo>+</mo><mo>&nbsp;</mo><mi>b</mi></math>", "image": null, "isCorrect": false}, {"id": "25JCF", "text": "The motion is SHM with amplitude <math><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "sO940", "text": "The motion is SHM with amplitude <math><msqrt><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup></msqrt></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math><mi>y</mi><mo>=</mo><mi>a</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>ω</mi><mi>t</mi><mo>+</mo></mrow></mrow><mi>b</mi><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>ω</mi><mi>t</mi></mrow></mrow></math><br/><br/>Let   <math><mi>a</mi><mo>=</mo><mi>r</mi><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mi> </mi><mi> </mi><mi> </mi><mi>a</mi><mi>n</mi><mi>d</mi><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mi>b</mi><mo>=</mo><mi>r</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></math><br/><br/><math><mi>y</mi><mo>=</mo><mi>r</mi><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>ω</mi><mi>t</mi></mrow></mrow><mo>+</mo><mi>r</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>ω</mi><mi>t</mi></mrow></mrow></math><br/><br/><math><mo>=</mo><mi>r</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mo>(</mo><mi>ω</mi><mi>t</mi><mo>+</mo><mi>θ</mi><mo>)</mo></mrow></mrow></math><br/><br/><math><mo>∴</mo><mi> </mi><mi> </mi><mi> </mi><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup><mfenced separators=\"|\"><mrow><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>θ</mi><mo>+</mo><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></mrow></mrow></mrow></mfenced><mo>=</mo><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br/><br/>or   <math><mi>r</mi><mo>=</mo><msqrt><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86335cff83acd218061", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "59", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The equation of the resultant motion of the number of simple harmonic motions is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mi>c</mi></msub><mo>(</mo><mn>1</mn><mo>+</mo><mi>K</mi><mi>sin</mi><mo>⁡</mo><mrow><msub><mi mathvariant=\"normal\">ω</mi><mn>2</mn></msub><mi mathvariant=\"normal\">t</mi><mo>)</mo><mi>sin</mi></mrow><msub><mi>ω</mi><mn>1</mn></msub><mi>t</mi></math>. The number of simple harmonic components is/are", "image": null}, "options": [{"id": "lcBWp", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "FekOg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "Q78ia", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>", "image": null, "isCorrect": true}, {"id": "S2x8L", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Y</mi><mo>=</mo><msub><mi>E</mi><mi>c</mi></msub><mo>(</mo><mn>1</mn><mo>+</mo><mi>K</mi><mi>sin</mi><mo>⁡</mo><mrow><msub><mi>ω</mi><mn>2</mn></msub><mi>t</mi><mo>)</mo><mi>sin</mi></mrow><mi>&nbsp;</mi><msub><mi>ω</mi><mn>1</mn></msub><mi>t</mi></math><br /><br /><math><mi>Y</mi><mo>=</mo><msub><mrow><mi>E</mi></mrow><mrow><mi>c</mi></mrow></msub><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><msub><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mrow><mi>t</mi><mo>+</mo><msub><mrow><mi>E</mi></mrow><mrow><mi>c</mi></mrow></msub><mi>&nbsp;</mi><mi>k</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><msub><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mrow><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><msub><mrow><mi>ω</mi></mrow><mrow><mn>1</mn></mrow></msub><mi>t</mi></mrow></mrow></math><br /><br /><math><mi>Y</mi><mo>=</mo><msub><mrow><mi>E</mi></mrow><mrow><mi>c</mi></mrow></msub><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><msub><mrow><mi>ω</mi></mrow><mrow><mn>1</mn></mrow></msub><mi>t</mi></mrow></mrow><mo>+</mo><mfrac><mrow><msub><mrow><mi>E</mi></mrow><mrow><mi>c</mi></mrow></msub><mi>K</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><msub><mrow><mi>ω</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfenced><mi>t</mi></mrow></mrow><mfrac><mrow><msub><mrow><mi>E</mi></mrow><mrow><mi>c</mi></mrow></msub><mi>K</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mfenced separators=\"|\"><mrow><msub><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>-</mo><msub><mrow><mi>ω</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfenced><mi>t</mi></math><br />Thus there are three simple harmonic waves of frequency <math><msub><mrow><mi>ω</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>,</mo><mi>&nbsp;</mi><mfenced separators=\"|\"><mrow><msub><mrow><mi>ω</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></math> and <math><mfenced separators=\"|\"><mrow><msub><mrow><mi>ω</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86322f8a4df60cd9348", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "75", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The displacement <math><mi>y</mi></math> of a particle, if given by <math><mi>y</mi><mo>=</mo><mn>4</mn><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mn>1000</mn><mi>&nbsp;</mi><mi>t</mi></mrow></mfenced></mrow></mrow></mrow></mrow><mo>.</mo></math> This expression may be considered to be a result of the superposition of how many simple harmonic motions?", "image": null}, "options": [{"id": "WKk4w", "text": "<math><mn>4</mn></math>", "image": null, "isCorrect": false}, {"id": "CTJGw", "text": "<math><mn>3</mn></math>", "image": null, "isCorrect": true}, {"id": "yfMut", "text": "<math><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "OGbKL", "text": "<math><mn>5</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mo>∵</mo></math> Equation of displacement of particle is<br /><br /><math><mi>y</mi><mo>=</mo><mn>4</mn><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mn>1000</mn><mi>t</mi></mrow></mfenced></mrow></mrow></mrow></mrow></math> .....(i)<br /><br />Or <math><mi>y</mi><mo>=</mo><mn>4</mn><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn><mo>+</mo><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mi>t</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mn>1000</mn><mi>t</mi></mrow></mfenced></math><br /><br /><math><mfenced separators=\"|\"><mrow><mo>∵</mo><mi>&nbsp;</mi><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>x</mi><mo>=</mo><mfrac><mrow><mn>1</mn><mo>+</mo><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mn>2</mn><mi>x</mi></mrow></mrow></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mrow></mrow></mfenced></math><br /><br />Or <math><mi>y</mi><mo>=</mo><mn>2</mn><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mn>1000</mn><mi>t</mi><mo>+</mo><mn>2</mn><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mi>t</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mn>1000</mn><mi>t</mi></mrow></mrow></math><br /><br />Or <math><mi>y</mi><mo>=</mo><mn>2</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mn>1000</mn><mi>t</mi><mo>+</mo><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mn>1001</mn><mi>t</mi><mo>+</mo><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi>t</mi><mi>&nbsp;</mi><mn>999</mn><mi>t</mi></math><br /><br /><math><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mn>2</mn><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>A</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mi>B</mi></mrow></mrow><mo>=</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mi>A</mi><mo>+</mo><mi>B</mi></mrow></mfenced><mo>+</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mi>A</mi><mo>-</mo><mi>B</mi></mrow></mfenced></mrow></mrow></mrow></mrow></mrow></mfenced></math><br /><br />Hence, equation (i) is the result of the superposition of three simple harmonic motion.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863026b12c2ef5bac24", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "63", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A particle is subjected simultaneously to two SHMs, one along the <math><mi>x</mi></math>-axis and the other along the <math><mi>y</mi></math>-axis. The two vibrations are in phase and have unequal amplitudes. The particle will execute", "image": null}, "options": [{"id": "bUPQt", "text": "Straight line motion", "image": null, "isCorrect": true}, {"id": "cLyoc", "text": "Circular motion", "image": null, "isCorrect": false}, {"id": "OmqVE", "text": "Elliptic motion", "image": null, "isCorrect": false}, {"id": "Q5WSt", "text": "Parabolic motion", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Let the equations of the two mutually perpendicular SHM&#39;s of the same frequency and same phase be<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><msub><mi>a</mi><mn>1</mn></msub><mi>&#160;sin&#160;</mi><mo>&#8289;</mo><mi>&#969;</mi><mi>t</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><msub><mi>a</mi><mn>2</mn></msub><mo>&#160;</mo><mi>sin</mi><mo>&#160;</mo><mo>&#8289;</mo><mi>&#969;</mi><mi>t</mi></math></p><p>Then,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>y</mi><mi>x</mi></mfrac><mo>=</mo><mfrac><mrow><msub><mi>a</mi><mn>2</mn></msub><mi>sin</mi><mi>&#969;</mi><mi>t</mi></mrow><mrow><msub><mi>a</mi><mn>1</mn></msub><mi>sin</mi><mi>&#969;</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><msub><mi>a</mi><mn>2</mn></msub><msub><mi>a</mi><mn>1</mn></msub></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mfrac><msub><mi>a</mi><mn>2</mn></msub><msub><mi>a</mi><mn>1</mn></msub></mfrac><mi>x</mi></math>, which is the equation of a straight line</p>", "image": null}, "videoSolution": null, "syllabusCateg ><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mn>2</mn><mi mathvariant=\"script\">l</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></mrow><mrow><mn>3</mn><mi>g</mi></mrow></mfrac></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863829b38271d2a7929", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "41", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A weightless rigid rod with a small iron bob at the end is hinged at point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;by a ball and socket joint to the wall so that it can rotate in all directions. The rod is kept in the horizontal position by a vertical inextensible string of length<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mn>20</mn><mo>&nbsp;</mo><mi>cm</mi></math>, fixed at its midpoint. The bob is displaced slightly, perpendicular to the plane of the figure. If the period of small oscillations of the system is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>x</mi><mi>π</mi></mrow><mn>10</mn></mfrac><mo>&nbsp;</mo><mi mathvariant=\"normal\">s</mi></math>, then what is the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>?&nbsp;[Take&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mo>=</mo><mn>10</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>]<br />\r<img alt=\"Picture 171\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/544826.PNG\" style=\"width: 200px; height: 90px;\" />", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "<p>The small oscillation of the bob occur relative to a stationary axis passing through <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math>.&nbsp;The line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CD</mi></math>&nbsp;is perpendicular to the axis&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math>.&nbsp;The bob behaves as a simple pendulum of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CD</mi></math>&nbsp;oscillating due to component of its weight <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mi>g</mi><mi>cos</mi><mi>&#952;</mi></math>.</p><p><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/image21.jpg\" style=\"width: 220px; height: 144px;\" /></p><p>If the length&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AD</mi></math>&nbsp;is equal to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math>, then the length&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CD</mi><mo>=</mo><mi>L</mi><mi>sin</mi><mi>&#952;</mi></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><mrow><mi>L</mi><mi>sin</mi><mi>&#952;</mi></mrow><mrow><mi>g</mi><mi>&#160;</mi><mi>c</mi><mi>o</mi><mi>s</mi><mi>&#952;</mi></mrow></mfrac></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><mrow><mi>L</mi><mi>tan</mi><mi>&#952;</mi></mrow><mi>g</mi></mfrac></msqrt><mi>&#160;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><mrow><mn>2</mn><mi>l</mi></mrow><mi>g</mi></mfrac><mi>&#160;</mi></msqrt><mo>=</mo><mfrac><mrow><mn>2</mn><mi>&#960;</mi></mrow><mn>5</mn></mfrac><mo>=</mo><mfrac><mrow><mn>4</mn><mi>&#960;</mi></mrow><mn>10</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mn>4</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863748417e7983de58d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "45", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The time period of a physical pendulum about some pivot point is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math>. When we take another pivot point, opposite of the first one such that the centre of mass of the physical pendulum lies on the line joining these two pivot points, we obtain the same time period. If the two points are separated by a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math>,&nbsp;then the time period&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math>&nbsp;is", "image": null}, "options": [{"id": "HtrEx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>&#x3C0;</mi><msqrt><mfrac><mi>L</mi><mi>g</mi></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "D55yP", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#x3C0;</mi><msqrt><mfrac><mi>L</mi><mi>g</mi></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "xlFfj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>&#x3C0;</mi><msqrt><mfrac><mi>L</mi><mrow><mn>2</mn><mi>g</mi></mrow></mfrac></msqrt></math>", "image": null, " n></mrow></msup><mo>+</mo><msup><mrow><mi>m</mi><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>m</mi><mi>g</mi><mi>x</mi></mrow></mfrac></msqrt><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><mrow><mi>L</mi></mrow><mrow><mi>g</mi></mrow></mfrac></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863529954dfe65083cc", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "37", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A rod of mass <math> <mi>M</mi> </math> and length <math> <mrow> <mn>2</mn><mi>L</mi></mrow> </math> is suspended at its middle by a wire. It exhibits torsional oscillations. If two masses, each of mass&nbsp;<math><mi>m</mi></math>, are attached at a distance <math> <mrow> <mi>L</mi><mo>/</mo><mn>2</mn></mrow> </math> from its centre on both sides, it reduces the oscillation frequency by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>%</mo></math>. The value of ratio <math><mrow><mrow><mi>m</mi></mrow><mo>/</mo><mrow><mi>M</mi></mrow></mrow></math> is close to", "image": null}, "options": [{"id": "Wl87U", "text": "<math><mn>0.17</mn></math>", "image": null, "isCorrect": false}, {"id": "V2K8L", "text": "<math><mn>0.77</mn></math>", "image": null, "isCorrect": false}, {"id": "dBy1Z", "text": "<math><mn>0.57</mn></math>", "image": null, "isCorrect": false}, {"id": "XUKJe", "text": "<math><mn>0.37</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let <math><mi>C</mi></math> be the torsional constant of the wire.<br /><br /><math><mi>f</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><mi>π</mi></mrow></mfrac><msqrt><mfrac><mrow><mi>C</mi></mrow><mrow><mfrac><mrow><mi>M</mi><msup><mrow><mfenced separators=\"|\"><mrow><mn>2</mn><mi>L</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>12</mn></mrow></mfrac></mrow></mfrac></msqrt><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><mi>π</mi></mrow></mfrac><msqrt><mfrac><mrow><mn>3</mn><mi>C</mi></mrow><mrow><mi>M</mi><mo>.</mo><mi>&nbsp;</mi><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></msqrt></math><br /><br />After masses are attached,<br /><br /><math><msup><mrow><mi>f</mi></mrow><mrow><mi>′</mi></mrow></msup><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><mi>π</mi></mrow></mfrac><mi>&nbsp;</mi><msqrt><mfrac><mrow><mi>C</mi></mrow><mrow><mfrac><mrow><mi>M</mi><mo>.</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>2</mn><mi>L</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>12</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>m</mi><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>4</mn></mrow></mfrac><mo>×</mo><mn>2</mn></mrow></mfrac></msqrt></math><br /><br /><math><mo>⇒</mo><mn>0.8</mn><mi>f</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><mi>π</mi></mrow></mfrac><mi>&nbsp;</mi><msqrt><mfrac><mrow><mi>C</mi></mrow><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>M</mi></mrow><mrow><mn>3</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced><msup><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></msqrt></math><br /><br /><math><mo>⇒</mo><mn>0.64</mn><mo>×</mo><mfrac><mrow><mn>3</mn><mi>C</mi></mrow><mrow><mi>M</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>C</mi></mrow><mrow><mfrac><mrow><mi>M</mi></mrow><mrow><mn>3</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfrac></math><br /><br /><math><mfenced separators=\"|\"><mrow><mn>0.64</mn></mrow></mfe ow>  <mfrac>   <mn>1</mn>   <mrow>    <mn>2</mn><mi>&#x03C0;</mi></mrow>  </mfrac>  <msqrt>   <mrow>    <mfrac>     <mrow>      <mn>3</mn><mtext>k</mtext></mrow>     <mtext>M</mtext>    </mfrac>    </mrow>  </msqrt>  </mrow></math>", "image": null, "isCorrect": false}, {"id": "roIzQ", "text": "<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> <msqrt> <mfrac> <mrow> <mn>6</mn> <mtext>k</mtext> </mrow> <mrow> <mtext>M</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Consider the situation below<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/23827-S.PNG\" style=\"width: 200px; height: 202px;\" /><br /><br />From the above diagram<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mi>θ</mi> <mo>=</mo> <mfrac> <mrow> <mtext>x</mtext> </mrow> <mrow> <mi></mi><mi></mi><mi>l</mi><mo>⁡</mo> <mo>/</mo> <mn>2</mn> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>⇒&nbsp;&nbsp;&nbsp;&nbsp;</mo> <mtext>x</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>L</mtext> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mi>θ</mi> </mrow> </math><br /><br />In the above diagram the rod is displaced through an angle <math> <mrow> <mi>θ</mi> </mrow> </math>&nbsp;as in above diagram<br /><br />Restoring torque <math> <mrow> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mo>-</mo> <mn>2</mn> <mtext>kx</mtext> </mrow> </mfenced> <mo>×</mo> <mfrac> <mrow> <mtext>L</mtext> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>=</mo> <mo>-</mo> <mtext>kxL</mtext></mrow></math><br />angular acceleration,&nbsp;<br /><math><mrow><mo>⇒</mo><math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <mi>a</mi><mo>=</mo><mfrac> <mrow> <mo>−</mo><mi>k</mi><mo>×</mo><mfrac> <mi>L</mi> <mn>2</mn> </mfrac> <mi>θ</mi><mo>×</mo><mi>L</mi></mrow> <mi>Ι</mi> </mfrac> </mrow> </math> <math> <mo>=</mo><mfenced> <mrow> <mfrac> <mrow> <mo>−</mo><mn>6</mn><mtext>k</mtext></mrow> <mtext>M</mtext> </mfrac> </mrow> </mfenced><mi>θ</mi> </math></mrow></math><br /><br /><math> <mrow> <mo>=</mo><mo>−</mo><msup> <mi>ω</mi> <mn>2</mn> </msup> <mi>θ</mi></mrow> </math><br /><br /><math> <mi>ω</mi><mo>=</mo><msqrt> <mrow> <mfrac> <mrow> <mn>6</mn><mi>K</mi></mrow> <mi>M</mi> </mfrac> </mrow> </msqrt> </math><br /><br /><math> <mi>f</mi><mo>=</mo><mfrac> <mn>1</mn> <mrow> <mn>2</mn><mi>π</mi></mrow> </mfrac> <msqrt> <mrow> <mfrac> <mrow> <mn>6</mn><mi>K</mi></mrow> <mi>M</mi> </mfrac> </mrow> </msqrt> </math><br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630b85367e6b9f107f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "05", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform rod of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2.0</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi></math> is suspended through its endpoint about which it performs small angular oscillations in the vertical plane. Its time period is nearly", "image": null}, "options": [{"id": "m72n0", "text": "<math><mn>1.6</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "qO0Og", "text": "<math><mn>1.8</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "TAlfP", "text": "<math><mn>2.0</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "lIAOX", "text": "<math><mn>2.3</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image64-ade3e0d7-7ece-46c7-bf9e-5a600ef0ef45.jpg\" /><br /><br />It is a physical pendulum, and its time period <math> <mrow> <mi>T</mi><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt> <mrow> <mfrac> <mi>I</mi> <mrow> <mi>m</mi><mi>g</mi><mi>x</mi> </mrow> </mfrac> </mrow> </msqrt> </mrow> </math><br /><br />here I = moment of inertia of the pendulum about point of suspension<br /><br /><math> <mrow> <mi>I</mi><mo>=</mo><mfrac> <mrow> <mi>M</mi><msup> <mi>L</mi> <mn>2</mn> </msup> </mrow> <mrow> <mn>12</mn> </mrow> </mfrac> <mo>+</mo><mfrac> <mrow> <mi>M</mi><msup> <mi>L</mi> <mn>2</mn> </msup> </mrow> <mn>4</mn> </mfrac> <mo>=</mo><mfrac> <mrow> <mi>M</mi><msup> <mi>L</mi> <mn>2</mn> </msup> </mrow> <mn>3</mn> </mfrac> </mrow> </math><br /><br />and x = distance of point of suspension from its COM.<br /><br />x = L/2<br /><br /><math> <mrow> <mo>&#8658;</mo><mtext> </mtext><mi>T</mi><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt> <mrow> <mfrac> <mrow> <mi>M</mi><msup> <mi>L</mi> <mn>2</mn> </msup> <mo>/</mo><mn>3</mn> </mrow> <mrow> <mi>m</mi><mi>g</mi><mi>L</mi><mo>/</mo><mn>2</mn> </mrow> </mfrac> </mrow> </msqrt> <mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt> <mrow> <mfrac> <mrow> <mn>2</mn><mi>L</mi> </mrow> <mrow> <mn>3</mn><mi>g</mi> </mrow> </mfrac> </mrow> </msqrt> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>T</mi><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><mrow><mn>2</mn><mo>&#215;</mo><mn>2</mn></mrow><mrow><mn>3</mn><mo>&#215;</mo><mn>10</mn></mrow></mfrac></msqrt><mo>=</mo><mn>2.</mn><mn>3</mn><mtext>&#160;sec</mtext><mtext>.</mtext></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
