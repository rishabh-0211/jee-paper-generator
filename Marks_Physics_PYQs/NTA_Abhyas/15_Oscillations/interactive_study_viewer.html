ath> and volume of the block is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi></math>. If the container is now displaced downwards through a distance <math><msub><mrow><mi>x</mi></mrow><mrow><mn>0</mn></mrow></msub></math> and released such that block remains well inside the liquid, during subsequent motion (ignore viscosity)<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/lyhbzfrsipsldkyjfbjvvqpsypdobbqfsetidyqjxnpnzcijng.jpeg\" style=\"height: 224px; width: 150px;\" />", "image": null}, "options": [{"id": "z4eiA", "text": "Time period of SHM of the container will be <math><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mfenced separators=\"|\"><mrow><mi>M</mi><mo>+2</mo><mi>ρ</mi><mi>v</mi></mrow></mfenced></mrow><mrow><mi>k</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "maRH6", "text": "Time period of SHM of the container will be <math><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mfenced separators=\"|\"><mrow><mi>M</mi><mo>+</mo><mi>ρ</mi><mi>v</mi></mrow></mfenced></mrow><mrow><mi>k</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "FBEbZ", "text": "The amplitude of SHM of the container will be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>x</mi><mn>0</mn></msub><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "GUE9u", "text": "Container will not perform SHM", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi>M</mi><mi>g</mi><mo>-</mo><mi>k</mi><mfenced separators=\"|\"><mrow><mi>x</mi><mo>+</mo><mi mathvariant=\"normal\">Δ</mi><mi>x</mi></mrow></mfenced><mo>+</mo><mi>ρ</mi><mfenced separators=\"|\"><mrow><mi>V</mi></mrow></mfenced><mi>&nbsp;</mi><mfenced separators=\"|\"><mrow><mi>g</mi><mo>-</mo><mi>a</mi></mrow></mfenced><mo>=</mo><mi>M</mi><mi>a</mi></math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-07-21_at_3.07.43_PM.jpeg\" style=\"width: 200px; height: 210px;\" /><br /><br />Where <math><mi>M</mi><mi>g</mi><mo>+</mo><mi>ρ</mi><mi>V</mi><mi>g</mi><mo>=</mo><mi>K</mi><mi mathvariant=\"normal\">Δ</mi><mi>x</mi></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mfenced separators=\"|\"><mrow><mi>M</mi><mo>+</mo><mi>ρ</mi><mi>V</mi></mrow></mfenced><mi>a</mi><mo>=</mo><mo>-</mo><mi>K</mi><mi>x</mi></math><br /><br />Or <math><mi>a</mi><mo>-</mo><mfrac><mrow><mi>k</mi><mi>x</mi></mrow><mrow><mfenced separators=\"|\"><mrow><mi>M</mi><mo>+</mo><mi>ρ</mi><mi>V</mi></mrow></mfenced></mrow></mfrac></math> or <math><mi>ω</mi><mo>=</mo><mi>&nbsp;</mi><mo>-</mo><msqrt><mfrac><mrow><mi>k</mi></mrow><mrow><mi>M</mi><mo>+</mo><mi>ρ</mi><mi>V</mi></mrow></mfrac></msqrt></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mfenced separators=\"|\"><mrow><mi>M</mi><mo>+</mo><mi>ρ</mi><mi>V</mi></mrow></mfenced></mrow><mrow><mi>K</mi></mrow></mfrac></msqrt></math><br /><br />The amplitude of SHM will be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>x</mi><mn>0</mn></msub></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c961168b56ddfdd2", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "91", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A rod of mass M and length L is hinged at its one end and carries a block of mass m at its lower end. A spring of force constant k<sub>1</sub> is installed at distance a from the hinge and another of force constant k<sub>2</sub> at a distance b as shown in the figure. If the whole arrangement rests on a smooth horizontal table top, find the frequency of vibration.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/fdhgdfhdghdofil.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 280px; height: 182px;\" />", "image": null}, "options": [{"id": "V2VwQ", "text": "<math> <mrow>  <mfrac>   <mn>1</mn>   <mrow>    <mn>2</mn><mi>&#x03C0;</mi></mrow>  </mfrac>  <msqrt>   <mrow>    <mfrac>     <mrow>      <msub>       <mi>k</mi>       <mn>1</mn>      </msub>      <msup>       <mi>a</mi>       <mn>2</mn>      </msup>      <mo>+</mo><msub>       <mi>k</mi>       <mn>2</mn>      </msub>      <msup>       <mi>b</mi>       <mn>2</mn>      </msup>      </mrow>     <mrow>      <msup>       <mi>L</mi>       <mn>2</mn>      </msup>      <mrow><mo>(</mo>       <mrow>        <mi>m</mi><mo>+</mo><mfrac>         <mi>M</mi>         <mn>3</mn>        </mfrac>        </mrow>      <mo>)</mo></mrow></mrow>    </mfrac>    </mrow>  </msqrt>  </mrow></math>", "image": null, "isCorrect": true}, {"id": "EsTBx", "text": "<math> <mrow>  <mfrac>   <mn>1</mn>   <mrow>    <mn>2</mn><mi>&#x03C0;</mi></mrow>  </mfrac>  <msqrt>   <mrow>    <mfrac>     <mrow>      <msub>       <mi>k</mi>       <mn>1</mn>      </msub>      <msup>       <mi>a</mi>       <mn>2</mn>      </msup>      <mo>+</mo><msub>       <mi>k</mi>       <mn>2</mn>      </msub>      <msup>       <mi>b</mi>       <mn>2</mn>      </msup>      </mrow>     <mrow>      <msup>       <mi>L</mi>       <mn>2</mn>      </msup>      <mrow><mo>(</mo>       <mrow>        <mi>m</mi><mo>&#x2212;</mo><mfrac>         <mi>M</mi>         <mn>3</mn>        </mfrac>        </mrow>      <mo>)</mo></mrow></mrow>    </mfrac>    </mrow>  </msqrt>  </mrow></math>", "image": null, "isCorrect": false}, {"id": "m0ZpO", "text": "<math> <mrow>  <mfrac>   <mn>1</mn>   <mrow>    <mn>2</mn><mi>&#x03C0;</mi></mrow>  </mfrac>  <msqrt>   <mrow>    <mfrac>     <mrow>      <msub>       <mi>k</mi>       <mn>1</mn>      </msub>      <msup>       <mi>a</mi>       <mn>2</mn>      </msup>      <mo>&#x2212;</mo><msub>       <mi>k</mi>       <mn>2</mn>      </msub>      <msup>       <mi>b</mi>       <mn>2</mn>      </msup>      </mrow>     <mrow>      <msup>       <mi>L</mi>       <mn>2</mn>      </msup>      <mrow><mo>(</mo>       <mrow>        <mi>m</mi><mo>+</mo><mfrac>         <mi>M</mi>         <mn>3</mn>        </mfrac>        </mrow>      <mo>)</mo></mrow></mrow>    </mfrac>    </mrow>  </msqrt>  </mrow></math>", "image": null, "isCorrect": false}, {"id": "Hm9wT", "text": "<math> <mrow>  <mfrac>   <mn>1</mn>   <mrow>    <mn>4</mn><mi>&#x03C0;</mi></mrow>  </mfrac>  <msqrt>   <mrow>    <mfrac>     <mrow>      <msub>       <mi>k</mi>       <mn>1</mn>      </msub>      <msup>       <mi>a</mi>       <mn>2</mn>      </msup>      <mo>+</mo><msub>       <mi>k</mi>       <mn>2</mn>      </msub>      <msup>       <mi>b</mi>       <mn>2</mn>      </msup>      </mrow>     <mrow>      <msup>       <mi>L</mi>       <mn>2</mn>      </msup>      <mrow><mo>(</mo>       <mrow>        <mi>m</mi><mo>&#x2212;</mo><mfrac>         <mi>M</mi>         <mn>3</mn>        </mfrac>        </mrow>      <mo>)</mo></mrow></mrow>    </mfrac>    </mrow>  </msqrt>  </mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For small angular displacement θ, net torque towards mean position is<br /><br /><math> <mrow> <mi>τ</mi> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>k</mtext> <mn>1</mn> </msub> <mtext>a</mtext> <mi>θ</mi> </mrow> </mfenced> <mtext>a</mtext> <mo>+</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>k</mtext> <mn>2</mn> </msub> <mtext>b</mtext> <mi>θ</mi> </mrow> </mfenced> <mtext>b</mtext> </mrow> </math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;or&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mtext>I</mtext> <mi>α</mi> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>k</mtext> <mn>1</mn> </msub> <msup> <mtext>a</mtext> <mn>2</mn> </msup> <mo>+</mo> <msub> <mtext>k</mtext> <mn>2</mn> </msub> <msup> <mtext>b</mtext> <mn>2</mn> </msup> </mrow> </mfenced> <mi>θ</mi> </mrow> </math><br /><br />or&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msup> <mtext>mL</mtext> <mn>2</mn> </msup> <mo>+</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> <msup> <mtext>ML</mtext> <mn>2</mn> </msup> </mrow> </mfenced> <mi>α</mi> <mo>=</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>k</mtext> <mn>1</mn> </msub> <msup> <mtext>a</mtext> <mn>2</mn> </msup> <mo>+</mo> <msub> <mtext>k</mtext> <mn>2</mn> </msub> <msup> <mtext>b</mtext> <mn>2</mn> </msup> </mrow> </mfenced> <mi>θ</mi> </mrow> </math><br /><br />or&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mi>α</mi> <mo>=</mo> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>k</mtext><mn>1</mn> </msub> <msup> <mtext>a</mtext> <mn>2</mn> </msup> <mo>+</mo> <msub> <mtext>k</mtext> <mn>2</mn> </msub> <msup> <mtext>b</mtext> <mn>2</mn> </msup> </mrow> </mfenced> <mi>θ</mi> </mrow> <mrow> <msup> <mtext>L</mtext> <mn>2</mn> </msup> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>m</mtext> <mo>+</mo> <mfrac> <mrow> <mtext>M</mtext> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> </mrow> </mfenced> </mrow> </mfrac> </mrow> </math><br /><br />∴&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <msup> <mi>ω</mi> <mn>2</mn> </msup> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>k</mtext> <mn>1</mn> </msub> <msup> <mtext>a</mtext> <mn>2</mn> </msup> <mo>+</mo> <msub> <mtext>k</mtext> <mn>2</mn> </msub> <msup> <mtext>b</mtext> <mn>2</mn> </msup> </mrow> <mrow> <msup> <mtext>L</mtext> <mn>2</mn> </msup> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>m</mtext> <mo>+</mo> <mfrac> <mrow> <mtext>M</mtext> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> </mrow> </mfenced> </mrow> </mfrac> </mrow> </math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014754_AnsExp1_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 381px; height: 272px;\" /><br /><br />Hence, frequency<br /><br /><math> <mrow> <mtext>f</mtext> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> </mrow> <mrow> <mi>π</mi> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> <msqrt> <mfrac> <mrow> <msub> <mtext>k</mtext> <mn>1</mn> </msub> <msup> <mtext>a</mtext> <mn>2</mn> </msup> <mo>+</mo> <msub> <mtext>k</mtext><mn>2</mn> </msub> <msup> <mtext>b</mtext> <mn>2</mn> </msup> </mrow> <mrow> <msup> <mtext>L</mtext> <mn>2</mn> </msup> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>m</mtext> <mo>+</mo> <mfrac> <mrow> <mtext>M</mtext> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> </mrow> </mfenced> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c8c9d13e32187ef5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "18", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The length of the second's pendulum on the surface of the earth is <math><mn>1&nbsp;</mn><mi mathvariant=\"normal\">m</mi></math>. If the acceleration due to gravity on the surface of the moon is one-sixth of the acceleration due to gravity of the earth, then the length of the second's pendulum on the surface of the moon will be", "image": null}, "options": [{"id": "pzeWu", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>6&nbsp;</mn></mrow></mfrac><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": true}, {"id": "fXhbc", "text": "<math><mn>6&nbsp;</mn><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "UTTRx", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>36&nbsp;</mn></mrow></mfrac><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "H0IVy", "text": "<math><mn>36&nbsp;</mn><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Seconds pendulum is a special pendulum having a time period of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">s</mi></math>.<br /><br />Using the formula <math> <mrow> <mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt> <mrow> <mfrac> <mi>L</mi> <mi>g</mi></mfrac></mrow></msqrt></mrow></math><br /><br />If the time period remains the same and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi></math> is reduced by a factor of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn></math>.<br />L should be reduced by a factor of 6.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>L</mi><mo>=</mo><mfrac><mn>1</mn><mn>6</mn></mfrac><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> on moon.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c89dc5439bad53b3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "36", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The time period of a spring-mass system is <math><mi>T</mi></math>. If this spring is cut into two parts, whose lengths are in the ratio&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>:</mo><mn>2</mn></math>, and the same mass is attached to the longer part, the new time period will be", "image": null}, "options": [{"id": "4vyzJ", "text": "<math><msqrt><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac></msqrt><mi> </mi><mi>T</mi></math>", "image": null, "isCorrect": false}, {"id": "mfTUg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mn>2</mn><mn>3</mn></mfrac></msqrt><mi>T</mi></math>", "image": null, "isCorrect": true}, {"id": "35DSu", "text": "<math><mfrac><mrow><msqrt><mn>3</mn></msqrt><mi>T</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "Uw3zt", "text": "<math><msqrt><mn>3</mn></msqrt><mi>T</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The spring-mass system oscillates in SHM. Its time period is given by</p><p><math><mi>T</mi><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><mrow><mi>m</mi></mrow><mrow><mi>k</mi></mrow></mfrac></msqrt></math></p><p>When spring is cut in ratio <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>:</mo><mn>2</mn></math>, the new spring constant is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi><mo>'</mo><mo>=</mo><mn>3</mn><mi>k</mi><mo>&#8203;/2</mo></math>&nbsp;(for the longer part)</p><p><math><mo>&#8756;</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>T</mi><mrow><mi>T</mi><mo>'</mo></mrow></mfrac><mo>=</mo><msqrt><mfrac><mstyle displaystyle=\"true\"><mfrac bevelled=\"true\"><mrow><mn>3</mn><mi>k</mi></mrow><mn>2</mn></mfrac></mstyle><mi>k</mi></mfrac></msqrt></math></p><p><math><mo>&#8658;</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>'</mo><mo>=</mo><msqrt><mfrac><mn>2</mn><mn>3</mn></mfrac></msqrt><mi>T</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c248de4a1da594a1", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "22", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Consider the figure here. A particle of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math>&nbsp;is constrained to move inside a smooth vertical groove of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> and is connected to a light spring of spring constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">K</mi></math>&nbsp;in equilibrium. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">O</mi></math> is centre of the groove. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">y</mi></math> are horizontal and vertical axes respectively. Different physical parameters are related as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>KR</mi><mo>=</mo><mn>7</mn><mi>mg</mi></math>. Angular frequency of the oscillations, if the particle is slightly displaced from the shown equilibrium position is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/137114-2.JPG\" style=\"width: 230px; height: 419px;\" />", "image": null}, "options": [{"id": "vP6fK", "text": "<math><msqrt><mfrac><mrow><mi mathvariant=\"normal\">g</mi></mrow><mrow><mi mathvariant=\"normal\">R</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "eCGId", "text": "<math><msqrt><mfrac><mrow><mi mathvariant=\"normal\">g</mi></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">R</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "q7j8B", "text": "<math><mn>2</mn><msqrt><mfrac><mrow><mi mathvariant=\"normal\">g</mi></mrow><mrow><mi mathvariant=\"normal\">R</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "QZzbZ", "text": "<math><msqrt><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">g</mi></mrow><mrow><mi mathvariant=\"normal\">R</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Restoring torque on small displacement  <math><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">θ</mi></math> <br/><br/> <math><mi mathvariant=\"normal\">τ</mi><mo>=</mo><mi mathvariant=\"normal\">K</mi><msup><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>2</mn></mrow></msup><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">θ</mi><mo>+</mo><mfrac><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">θ</mi></math> <br/><br/> <math><mo>⇒</mo><mi mathvariant=\"normal\">α</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">τ</mi></mrow><mrow><mi mathvariant=\"normal\">l</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">K</mi><msup><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mfrac><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">R</mi></mrow></mfenced><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">θ</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><msup><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math> <br/><br/> <math><mo>=</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mi mathvariant=\"normal\">g</mi></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">R</mi></mrow></mfrac></mrow></mfenced><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">θ</mi><mo>=</mo><msup><mrow><mi mathvariant=\"normal\">ω</mi></mrow><mrow><mn>2</mn></mrow></msup><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">θ</mi></math> <br/><br/> <math><mo>⇒</mo><mi mathvariant=\"normal\">ω</mi><mo>=</mo><msqrt><mfrac><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mi mathvariant=\"normal\">g</mi></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">R</mi></mrow></mfrac></msqrt><mo>=</mo><mn>2</mn><msqrt><mfrac><mrow><mi mathvariant=\"normal\">g</mi></mrow><mrow><mi mathvariant=\"normal\">R</mi></mrow></mfrac></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863bdd6e783d76272d9", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "10", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "What will be the time period of the pendulum&nbsp;of length l suspended from the ceiling of a cart which is sliding without friction on an inclined plane of inclination <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">θ</mi></math> ?", "image": null}, "options": [{"id": "qpCk5", "text": "<math> <mrow> <mn>2</mn> <mtext>&#960;</mtext> <msqrt> <mfrac> <mrow> <mi></mi><mi></mi><mi></mi><mi>l</mi><mo>&#8289;</mo> </mrow> <mrow> <mtext>g</mtext> <mtext>cos</mtext> <mtext>&#952;</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "eeqBD", "text": "<math><mrow>&nbsp;<mn>2</mn> <mtext>π</mtext> <msqrt> <mfrac> <mrow><mn>3</mn> <mi>l</mi><mo>⁡</mo> </mrow> <mrow> <mtext>g</mtext> <mtext>cos</mtext> <mtext>θ</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "KvHuP", "text": "<math> <mrow> <mn>4</mn> <mtext>&#960;</mtext> <msqrt> <mfrac> <mrow><mn>2</mn> <mi>l</mi><mo>&#8289;</mo> </mrow> <mrow> <mtext>g</mtext> <mtext>cos</mtext> <mtext>&#952;</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "8BFF3", "text": "<math><mrow>&nbsp;<mn>3</mn> <mtext>π</mtext> <msqrt> <mfrac> <mrow><mn>4</mn> <mi>l</mi><mo>⁡</mo> </mrow> <mrow> <mtext>2g</mtext> <mtext>cos</mtext> <mtext>θ</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here, point of suspension has an acceleration. <math> <mrow> <mover accent=\"true\"> <mtext>a</mtext> <mo>&#8594;</mo> </mover> </mrow> </math> = g sin&nbsp; &theta; (down the plane). Further, <math> <mrow> <mover accent=\"true\"> <mtext>g</mtext> <mo>&#8594;</mo> </mover> </mrow> </math> can be resolved into two components g sin&nbsp; &theta; (along the plane) and g cos&nbsp; &theta; (perpendicular to plane).<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014074_AnsExp1_1.jpg\" /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014074_AnsExp1_2.jpg\" /><br /><math><mrow><msub><mrow><mover accent=\"true\"><mtext>g</mtext> <mo>&#8594;</mo> </mover> </mrow> <mtext>eff</mtext> </msub> <mo>=</mo> <mover accent=\"true\"> <mtext>g</mtext> <mo>&#8594;</mo> </mover> <mo>-</mo> <mover accent=\"true\"> <mtext>a</mtext> <mo>&#8594;</mo> </mover> </mrow> </math><br /><br />= g cos&theta; (perpendicular to plane)<br /><br /><math><mrow><mtext>T</mtext> <mo>=</mo> <mn>2</mn> <mtext>&#960;</mtext> <msqrt> <mfrac> <mrow> <mi></mi><mi></mi><mi></mi><mi>l</mi><mo>&#8289;</mo> </mrow> <mrow> <mo>|</mo> <msub> <mrow> <mover accent=\"true\"> <mtext>g</mtext> <mo>&#8594;</mo> </mover> </mrow> <mtext>eff</mtext> </msub> <mo>|</mo> </mrow> </mfrac> </msqrt> </mrow> </math><br /><br />&nbsp; &nbsp; <math>&#160;<mrow><mo>=</mo> <mn>2</mn> <mtext>&#960;</mtext> <msqrt> <mfrac> <mrow> <mi></mi><mi></mi><mi>l</mi><mo>&#8289;</mo> </mrow> <mrow> <mtext>g</mtext> <mtext>cos</mtext><mtext>&#952;</mtext> </mrow> </mfrac> </msqrt> </mrow> </math><br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b9c9df6f0b50413d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "08", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "At a certain place, the acceleration due to gravity is determined using a simple pendulum. The length of the pendulum is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>25</mn><mo>.</mo><mn>0</mn><mo>&#160;</mo><mi>cm</mi></math> and a stopwatch with least count of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>&nbsp;measures the time taken by the pendulum for&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn></math> oscillations to be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>. The accuracy in the measurement of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi></math>&nbsp;is", "image": null}, "options": [{"id": "uoldz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>.</mo><mn>40</mn><mo>%</mo></math>", "image": null, "isCorrect": true}, {"id": "Fnhch", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>.</mo><mn>40</mn><mo>%</mo></math>", "image": null, "isCorrect": false}, {"id": "B4JfG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>40</mn><mo>%</mo></math>", "image": null, "isCorrect": false}, {"id": "VPIjj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>.</mo><mn>40</mn><mo>%</mo></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>&#916;T</mi><mi mathvariant=\"normal\">T</mi></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mrow><mfrac><mi>&#916;g</mi><mi mathvariant=\"normal\">g</mi></mfrac><mo>+</mo><mfrac><mi>&#916;L</mi><mi mathvariant=\"normal\">L</mi></mfrac></mrow></mfenced><mspace linebreak=\"newline\"></mspace><mfrac><mi>&#916;g</mi><mi mathvariant=\"normal\">g</mi></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>&#916;T</mi></mrow><mi mathvariant=\"normal\">T</mi></mfrac><mo>+</mo><mfrac><mi>&#916;L</mi><mi mathvariant=\"normal\">L</mi></mfrac><mo>;</mo><mo>&#160;&#160;</mo><mo>=</mo><mn>2</mn><mfenced><mfrac><mn>1</mn><mn>50</mn></mfrac></mfenced><mo>+</mo><mfrac><mrow><mn>0</mn><mo>.</mo><mn>1</mn></mrow><mrow><mn>25</mn><mo>.</mo><mn>0</mn></mrow></mfrac><mspace linebreak=\"newline\"></mspace><mo>=</mo><mn>4</mn><mo>.</mo><mn>4</mn><mo>%</mo><mspace linebreak=\"newline\"></mspace><mspace linebreak=\"newline\"></mspace></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b61670e1a9f920b8", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "87", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A highly rigid cubical block <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> of small mass <math><mi>M</mi></math> and side <math><mi>L</mi></math> is fixed rigidly on to another cubical block <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> of the same dimensions and of low modulus of rigidity <math><mi>η</mi></math> such that the lower face of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> completely covers the upper face of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>. The lower face of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> is rigidly held on a horizontal surface. A small force <math><mi>F</mi></math> is applied perpendicular to one of the side faces of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>. After the force is withdrawn, block&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> executes small oscillations, the time period of which is given by&nbsp;", "image": null}, "options": [{"id": "aM6f4", "text": "<math><mrow><mn>2</mn><mi>π</mi><msqrt><mrow><mi>M</mi><mi>η</mi><mi>L</mi></mrow></msqrt></mrow></math>", "image": null, "isCorrect": false}, {"id": "iT7MT", "text": "<math><mrow><mn>2</mn><mi>π</mi><msqrt><mrow><mfrac linethickness=\"1\"><mrow><mi>M</mi><mi>η</mi></mrow><mi>L</mi></mfrac></mrow></msqrt></mrow></math>", "image": null, "isCorrect": false}, {"id": "XHs1q", "text": "<math><mrow><mn>2</mn><mi>π</mi><msqrt><mrow><mfrac linethickness=\"1\"><mrow><mi>M</mi><mi>L</mi></mrow><mi>η</mi></mfrac></mrow></msqrt></mrow></math>", "image": null, "isCorrect": false}, {"id": "z0T5L", "text": "<math><mrow><mn>2</mn><mi>π</mi><msqrt><mrow><mfrac linethickness=\"1\"><mi>M</mi><mrow><mi>η</mi><mi>L</mi></mrow></mfrac></mrow></msqrt></mrow></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Modulus of rigidity,<math> <mrow> <mi>η</mi><mo>=</mo><mfrac> <mi>F</mi> <mrow> <mi>A</mi><mo>.</mo><mtext> </mtext><mi>θ</mi></mrow> </mfrac> </mrow> </math> Here, <math> <mrow> <mi>A</mi><mo>=</mo><msup> <mi>L</mi> <mn>2</mn> </msup> </mrow> </math><br /><br />And<br /><br /><math> <mrow> <mi>θ</mi> <mo>=</mo> <mfrac> <mrow> <mtext>x</mtext> </mrow> <mrow> <mi>L</mi> </mrow> </mfrac> </mrow> </math><br />&nbsp;<br />Therefore, restoring force is <math> <mrow> <mi>F</mi><mo>=</mo><mo>−</mo><mi>η</mi><mtext> </mtext><mi>A</mi><mi>θ</mi><mo>=</mo><mo>−</mo><mi>η</mi><mi>L</mi><mi>x</mi></mrow> </math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0007491_Ques4_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 290px; height: 218px;\" /><br />&nbsp;<br />Or acceleration, <math> <mrow> <mi>a</mi><mo>=</mo><mfrac> <mi>F</mi> <mi>M</mi> </mfrac> <mo>=</mo><mo>−</mo><mfrac> <mrow> <mi>η</mi><mi>L</mi></mrow> <mi>M</mi> </mfrac> <mi>x</mi></mrow> </math><br /><br />Since, <math> <mrow> <mi>a</mi><mo>∝</mo><mi>x</mi> </mrow> </math>, oscillations are simaple harmonic in nature, time period of which is given by<br /><br /><math> <mrow> <mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt> <mrow> <mrow><mo>|</mo> <mrow> <mfrac> <mrow> <mi>d</mi><mi>i</mi><mi>s</mi><mi>p</mi><mi>l</mi><mi>a</mi><mi>c</mi><mi>e</mi><mi>m</mi><mi>e</mi><mi>n</mi><mi>t</mi></mrow> <mrow> <mi>a</mi><mi>c</mi><mi>c</mi><mi>e</mi><mi>l</mi><mi>e</mi><mi>r</mi><mi>a</mi><mi>t</mi><mi>i</mi><mi>o</mi><mi>n</mi></mrow> </mfrac> </mrow> <mo>|</mo></mrow></mrow> </msqrt> <mo>=</mo><mn>2</mn><mi>π</mi><msqrt> <mrow> <mrow><mo>|</mo> <mrow> <mfrac> <mi>x</mi> <mi>a</mi> </mfrac> </mrow> <mo>|</mo></mrow></mrow> </msqrt> <mo>=</mo><mn>2</mn><mi>π</mi><msqrt> <mrow> <mfrac> <mi>M</mi> <mrow> <mi>η</mi><mi>L</mi></mrow> </mfrac> </mrow> </msqrt> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b30a867933756e0b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "100", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two identical balls&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>, each of mass<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mn>0</mn><mo>.</mo><mn>1</mn><mo>&nbsp;</mo><mi>kg</mi></math>, are attached to two identical massless springs. The spring-mass system is constrained to move inside a rigid smooth pipe bent in the form of a circle as shown in the figure. The pipe is fixed in a horizontal plane. The centres of the balls can move in a circle of radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>06</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>. Each spring has a natural length of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>06</mn><mi mathvariant=\"normal\">π</mi><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> and spring constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>, Initially, both the balls are displaced by an angle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>θ</mi><mo>&nbsp;</mo><mo>=</mo><mfrac><mi>π</mi><mn>6</mn></mfrac><mo>&nbsp;</mo><mi>rad</mi></math> with respect to the diameter<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mi>PQ</mi><mo>&nbsp;</mo></math>of the circle (as shown in the figure) and released from rest.<br />\rThe frequency of oscillation of balls is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0007521_Ques1_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"height: 171px; width: 250px;\" />", "image": null}, "options": [{"id": "HV6Nq", "text": "<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mi>&pi;</mi> </mrow> </mfrac> <mtext>&nbsp;Hz</mtext></mrow> </math>", "image": null, "isCorrect": false}, {"id": "xCOMf", "text": "<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>3</mn> <mi>&pi;</mi> </mrow> </mfrac> <mtext>&nbsp;Hz</mtext></mrow> </math>", "image": null, "isCorrect": false}, {"id": "CB2ae", "text": "<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mi>π</mi> </mrow> </mfrac> <mtext>&nbsp;Hz</mtext> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "UaTN1", "text": "<math> <mrow> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>4</mn> <mi>&pi;</mi> </mrow> </mfrac> <mtext>&nbsp;Hz</mtext> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, Mass of each block A and B, m = 0.1 kg<br /><br />Radius of circle, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>06</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Ques_7521_1_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 250px; height: 199px;\" /><br /><br />The natural length of spring <math> <mrow> <msub> <mtext mathvariant=\"italic\">l</mtext> <mn>0</mn> </msub> <mo>=</mo> <mtext>0.06</mtext> <mi>π</mi> <mo>=</mo> <mi>π</mi> <mtext>R</mtext> </mrow> </math>&nbsp;(Half circle) and spring constant,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">k</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>1</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br />In the stretched position elongation in each spring<br /><br /><math> <mrow> <mtext>x</mtext> <mo>=</mo> <mtext>R</mtext> <mi>θ</mi> </mrow> </math><br /><br />Let us draw FBD of A<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Ques_7521_1_2.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 250px; height: 220px;\" /><br /><br />Spring in lower side is stretched by 2x and on upper side compressed by 2x. Therefore, a force 2kx on each block would be exerted by each spring.<br /><br />Hence, a restoring force, F = 4kx will act on A in the direction shown in figure.<br /><br />Restoring torque of this force about origin<br /><br /><math> <mrow> <mi>τ</mi> <mo>=</mo> <mo>-</mo> <mtext>F. R</mtext> <mo>=</mo> <mo>-</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>4</mn> <mtext>kx</mtext> </mrow> </mfenced> <mtext>R</mtext> <mo>=</mo> <mo>-</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>4</mn> <mtext>kR</mtext> <mi>θ</mi> </mrow> </mfenced> <mtext>R</mtext> </mrow> </math><br /><br />or&nbsp;<math> <mrow> <mi>τ</mi> <mo>=</mo> <mo>-</mo> <mn>4</mn> <msup> <mtext>kR</mtext> <mn>2</mn> </msup> <mo>·</mo> <mi>θ</mi> </mrow> </math>&nbsp;&nbsp; ..... (i)<br /><br />Since, <math> <mrow> <mi>τ</mi> <mo>∝</mo> <mo>-</mo> <mi>θ</mi> </mrow> </math>, each ball executes angular SHM about origin O.<br /><br />Equation. (i) can be written as<br /><br /><math> <mrow> <mtext>I</mtext> <mi>α</mi> <mo>=</mo> <mo>-</mo> <mn>4</mn> <msup> <mtext>kR</mtext> <mn>2</mn> </msup> <mi>θ</mi> </mrow> </math><br /><br />or &nbsp;&nbsp;<math> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msup> <mtext>mR</mtext> <mn>2</mn> </msup> </mrow> </mfenced> <mi>α</mi> <mo>=</mo> <mo>-</mo> <mn>4</mn> <msup> <mtext>kR</mtext> <mn>2</mn> </msup> <mi>θ</mi> </mrow> </math><br /><br />or <math> <mrow> <mi>α</mi> <mo>=</mo> <mo>-</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>4</mn> <mtext>k</mtext> </mrow> <mrow> <mtext>m</mtext> </mrow> </mfrac> </mrow> </mfenced> <mi>θ</mi> </mrow> </math><br /><br />Frequency of oscillation, <math> <mrow> <mtext>f</mtext> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> <msqrt> <mfenced close=\"|\" open=\"|\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>acceleration</mtext> </mrow> <mrow> <mtext>displacement</mtext> </mrow> </mfrac> </mrow> </mfenced> </msqrt> </mrow> </math><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math> <mrow> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> <msqrt> <mfenced close=\"|\" open=\"|\" separators=\",\"> <mrow> <mfrac> <mrow> <mi>α</mi> </mrow> <mrow> <mi>θ</mi> </mrow> </mfrac> </mrow> </mfenced> </msqrt> </mrow> </math><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math> <mrow> <mtext>f</mtext> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> <msqrt> <mfrac> <mrow> <mn>4</mn> <mtext>k</mtext> </mrow> <mrow> <mtext>m</mtext> </mrow> </mfrac> </msqrt> </mrow> </math><br /><br />Substituting the values, we have<br /><br /><math> <mrow> <mtext>f</mtext> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> <msqrt> <mfrac> <mrow> <mn>4</mn> <mo>×</mo> <mtext>0.1</mtext> </mrow> <mrow> <mtext>0.1</mtext> </mrow> </mfrac> </msqrt> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mi>π</mi> </mrow> </mfrac> <mtext>&nbsp;Hz</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b04022253a63687d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "38", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A rod of mass <math><mi>M</mi></math> and length <math><mn>2</mn><mi>L</mi></math> is performing SHM as torsional pendulum in the horizontal plane. Two blocks, each of mass <math><mi>m</mi></math>, are put at distance <math><mfrac><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math> from the centre. The frequency after putting blocks of mass <math><mi>m</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mi mathvariant=\"normal\">%</mi></math> of initial frequency. Then, the ratio of <math><mfrac><mrow><mi>m</mi></mrow><mrow><mi>M</mi></mrow></mfrac></math> will be<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-06-24_at_6.49.53_PM.jpeg\" style=\"width: 180px; height: 170px;\" />", "image": null}, "options": [{"id": "pk4s8", "text": "<math><mn>12</mn></math>", "image": null, "isCorrect": false}, {"id": "PgH7a", "text": "<math><mn>14</mn></math>", "image": null, "isCorrect": false}, {"id": "WcJ9W", "text": "<math><mn>16</mn></math>", "image": null, "isCorrect": true}, {"id": "DqJiF", "text": "<math><mn>18</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi>T</mi><mo>=</mo><mn>2</mn><mi>&#960;</mi><mi>&#160;</mi><msqrt><mfrac><mrow><mi>I</mi></mrow><mrow><mi>C</mi></mrow></mfrac></msqrt></math><br /><br /><math><mi>f</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><mi>&#960;</mi></mrow></mfrac><mi>&#160;</mi><msqrt><mfrac><mrow><mi>C</mi></mrow><mrow><mi>I</mi></mrow></mfrac></msqrt></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>f</mi><mrow><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">l</mi></mrow></msub><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mi>&#960;</mi></mrow></mfrac><mi>&#160;</mi><msqrt><mfrac><mrow><mn>3</mn><mi>C</mi></mrow><mrow><mi>M</mi><msup><mi>L</mi><mn>2</mn></msup></mrow></mfrac></msqrt></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>f</mi><mrow><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">l</mi></mrow></msub><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mi>&#960;</mi></mrow></mfrac><msqrt><mfrac><mi>C</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>M</mi><msup><mi>L</mi><mn>2</mn></msup></mrow><mn>3</mn></mfrac><mo>+</mo><mn>2</mn><mi>m</mi><mfrac><msup><mi>L</mi><mn>2</mn></msup><mn>4</mn></mfrac></mrow></mfenced></mfrac></msqrt></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0.2</mn><mi>&#160;</mi><mfrac><mn>1</mn><mrow><mn>2</mn><mi>&#960;</mi></mrow></mfrac><mi>&#160;</mi><msqrt><mfrac><mrow><mn>3</mn><mi>C</mi></mrow><mrow><mi>M</mi><msup><mi>L</mi><mn>2</mn></msup></mrow></mfrac></msqrt><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mi>&#960;</mi></mrow></mfrac><msqrt><mfrac><mi>C</mi><mrow><mfrac><mrow><mi>M</mi><msup><mi>L</mi><mn>2</mn></msup></mrow><mn>3</mn></mfrac><mo>+</mo><mfrac><mrow><mn>2</mn><mi>M</mi><msup><mi>L</mi><mn>2</mn></msup></mrow><mn>4</mn></mfrac></mrow></mfrac></msqrt><mi>&#160;</mi></math><br /><br /><math><mo>=</mo><mn>0.04</mn><mfrac><mrow><mn>3</mn></mrow><mrow><mi>M</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>12</mn></mrow><mrow><mn>4</mn><mi>M</mi><mo>+</mo><mn>6</mn><mi>M</mi></mrow></mfrac></math><br /><br /><math><mn>4</mn><mi>M</mi><mo>=</mo><mn>0.16</mn><mi>M</mi><mo>+</mo><mn>0.24</mn><mi>&#160;</mi><mi>M</mi></math><br /><br /><math><mfrac><mrow><mi>m</mi></mrow><mrow><mi>M</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3.84</mn></mrow><mrow><mn>0.24</mn></mrow></mfrac><mo>=</mo><mn>16</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863adf214ad14fefb4b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "81", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "There is a cylindrical bottle of negligible mass and radius <math><mn>2.5</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math> floating in the water of density <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>10</mn><mn>3</mn></msup><mo>&nbsp;</mo><mi>kg</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>3</mn></mrow></msup></math> filled with <math><mn>310</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">l</mi></math> of water inside it. Now the bottle is slightly dipped into water and released. The frequency of oscillation is", "image": null}, "options": [{"id": "3n01r", "text": "<math><mn>3.75&nbsp;</mn><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>&nbsp;</mi></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "DMQLo", "text": "<math><mn>1.25&nbsp;</mn><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>&nbsp;</mi></mrow></mrow></math>", "image": null, "isCorrect": true}, {"id": "WUTZr", "text": "<math><mn>2.75&nbsp;</mn><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>&nbsp;</mi></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "7ZXRq", "text": "<math><mn>3.00&nbsp;</mn><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>&nbsp;</mi></mrow></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let at equilibrium, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math> length of the bottle is immersed in water:-<br /><br />So, <math><mi>m</mi><mi>g</mi><mo>=</mo><msub><mrow><mi>f</mi></mrow><mrow><mi>b</mi><mi>u</mi><mi>o</mi></mrow></msub></math><br /><br /><math><mi>m</mi><mi>g</mi><mo>=</mo><mi>&#961;</mi><mfenced separators=\"|\"><mrow><mi>A</mi><mi>y</mi></mrow></mfenced><mi>g</mi></math> ..... <math><mo>(</mo><mn>1</mn><mo>)</mo></math> [Equilibrium Condition]<br /><br />Now it is further pushed by distance <math><mi>&#8242;</mi><mi>x</mi><mi>&#8242;</mi></math><br /><br /><math><msub><mrow><mi>F</mi></mrow><mrow><mi>r</mi><mi>e</mi><mi>s</mi><mi>t</mi><mi>o</mi><mi>r</mi><mi>i</mi><mi>n</mi><mi>g</mi></mrow></msub><mo>=</mo><mi>&#961;</mi><mo>[</mo><mi>A</mi><mfenced close=\"]\" separators=\"|\"><mrow><mi>x</mi><mo>+</mo><mi>y</mi><mo>)</mo></mrow></mfenced><mi>g</mi><mo>-</mo><mi>m</mi><mi>g</mi></math><br /><br /><math><mi>m</mi><msup><mrow><mi>&#969;</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>x</mi><mo>=</mo><mi>&#961;</mi><mi>A</mi><mi>x</mi><mi>g</mi><mo>+</mo><mi>&#961;</mi><mi>A</mi><mi>y</mi><mi>g</mi><mo>-</mo><mi>m</mi><mi>g</mi></math><br /><br /><math><mi>&#969;</mi><mo>=</mo><msqrt><mfrac><mrow><mi>&#961;</mi><mi>A</mi><mi>g</mi></mrow><mrow><mi>m</mi></mrow></mfrac></msqrt><mo>=</mo><msqrt><mfrac><mrow><mi>&#961;</mi><mi>A</mi><mi>g</mi></mrow><mrow><mi>&#961;</mi><mi>V</mi></mrow></mfrac></msqrt><mo>=</mo><msqrt><mfrac><mrow><mi>&#960;</mi><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>g</mi></mrow><mrow><mi>V</mi></mrow></mfrac></msqrt><mo>=</mo><mn>2</mn><mi>&#960;</mi><mi>f</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>f</mi><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mi>&#960;</mi></mrow></mfrac><msqrt><mfrac><mrow><mi>&#960;</mi><msup><mi>r</mi><mn>2</mn></msup><mi>g</mi></mrow><mi>V</mi></mfrac></msqrt><mo>=</mo><mn>1</mn><mo>.25</mo><mi mathvariant=\"normal\">&#160;</mi><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mi mathvariant=\"normal\">&#160;</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639bcf7d57aa33a7ee", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "15", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If the displacement <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>x</mi><mo>)</mo></math> and velocity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>v</mi><mo>)</mo></math> of a particle executing SHM are related through the expression <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><msup><mi>v</mi><mn>2</mn></msup><mo>=</mo><mn>30</mn><mo>-</mo><msup><mi>x</mi><mn>2</mn></msup></math>. If the time period of the particle is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mi mathvariant=\"normal\">π</mi><msqrt><mi>n</mi></msqrt></math>, then what is the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>?&nbsp;", "image": null}, "options": [], "correctValue": "12.00", "solution": {"text": "<p>Given equation,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><msup><mi>v</mi><mn>2</mn></msup><mo>=</mo><mn>30</mn><mo>-</mo><msup><mi>x</mi><mn>2</mn></msup></math><br />Differentiating both sides, we get<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mi mathvariant=\"normal\">v</mi><mfrac><mi>dv</mi><mi>dx</mi></mfrac><mo>=</mo><mo>-</mo><mn>2</mn><mi mathvariant=\"normal\">x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">v</mi><mfrac><mi>dv</mi><mi>dx</mi></mfrac><mo>=</mo><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><mn>3</mn></mfrac><mi mathvariant=\"normal\">x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mi>a</mi><mi>x</mi></mfrac><mo>=</mo><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><mn>3</mn></mfrac><mo>&#160;&#160;</mo><mo>&#8230;</mo><mfenced close=\"]\" open=\"[\"><mrow><mo>&#8757;</mo><mi>a</mi><mo>=</mo><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mfrac><mrow><mi>d</mi><mi>x</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mi>v</mi><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>&#960;</mi></mrow><msqrt><mfenced open=\"|\" close=\"|\"><mfrac><mtext>&#160;acceleration&#160;</mtext><mtext>&#160;displacement&#160;</mtext></mfrac></mfenced></msqrt></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>&#960;</mi></mrow><msqrt><mfenced open=\"|\" close=\"|\"><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><mn>3</mn></mfrac></mfenced></msqrt></mfrac><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mn>3</mn></msqrt><mo>=</mo><mi>&#960;</mi><msqrt><mn>12</mn></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>=</mo><mn>12</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"/></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639b96322a2715d845", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "101", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An ideal gas is enclosed in a vertical cylindrical container and supports a freely moving piston of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math>. The piston and the cylinder have an equal cross-sectional area <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>. Atmospheric pressure is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>p</mi><mn>0</mn></msub></math>&nbsp;and when the piston is in equilibrium, the volume of the gas is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>0</mn></msub></math>. The piston is now displaced slightly from its equilibrium position. Assuming that the system, is completely isolated from, its surroundings, &nbsp;what is the frequency of oscillation. An ideal gas is enclosed in a vertical cylindrical container and supports a freely moving piston of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math>. The piston and the cylinder have an equal cross-sectional area <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>. Atmospheric pressure is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>p</mi><mn>0</mn></msub></math>&nbsp;and when the piston is in equilibrium, the volume of the gas is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>0</mn></msub></math>. The piston is now displaced slightly from its equilibrium position. Assuming that the system, is completely isolated from, its surroundings, &nbsp;what is the frequency of oscillation.", "image": null}, "options": [{"id": "bENxi", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mi>&#960;</mi></mrow></mfrac><msqrt><mfrac><mrow><mi>&#947;&#160;</mi><mfenced><mrow><msub><mtext>p</mtext><mn>0</mn></msub><msup><mtext>A</mtext><mn>2</mn></msup><mo>+</mo><mtext>MgA</mtext></mrow></mfenced></mrow><mrow><msub><mtext>V</mtext><mn>0</mn></msub><mtext>M</mtext></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "Vpoyp", "text": "<math> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>f</mi><mo>⁡</mo> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mi>&pi;</mi> </mrow> </mfrac> <msqrt> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mi>&gamma;</mi> </mrow> </mfrac> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>p</mtext> <mn>0</mn> </msub> <msup> <mtext>A</mtext> <mn>2</mn> </msup> <mo>+</mo> <mtext>Mg</mtext> <mtext>A</mtext> </mrow> </mfenced> </mrow> <mrow> <msub> <mtext>V</mtext> <mn>0</mn> </msub> <mtext>M</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "MB2hn", "text": "<math> <mrow> <mi></mi><mi>f</mi><mo>⁡</mo> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mi>&pi;</mi> </mrow> </mfrac> <msqrt> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>p</mtext> <mn>0</mn> </msub> <msup> <mtext>A</mtext> <mn>2</mn> </msup> <mo>+</mo> <mtext>Mg</mtext> <mtext>A</mtext> </mrow> </mfenced> </mrow> <mrow> <msub> <mtext>V</mtext> <mn>0</mn> </msub> <mtext>M</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "FnFsW", "text": "<math> <mrow> <mi></mi><mi>f</mi><mo>⁡</mo> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mi>&pi;</mi> </mrow> </mfrac> <msqrt> <mfrac> <mrow> <mtext>A</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>p</mtext> <mn>0</mn> </msub> <mtext>A</mtext> <mo>+</mo> <mtext>Mg</mtext> <mtext>A</mtext> </mrow> </mfenced> </mrow> <mrow> <msub> <mtext>V</mtext> <mn>0</mn> </msub> <mtext>M</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "&nbsp;In equilibrium, pressure inside the cylinder = pressure just outside it<br /><br />or &nbsp; <math> <mrow> <mtext>p</mtext> <mo>=</mo> <msub> <mtext>p</mtext> <mn>0</mn> </msub> <mo>+</mo> <mfrac> <mrow> <mtext>Mg</mtext> </mrow> <mrow> <mtext>A</mtext> </mrow> </mfrac> </mrow> </math><br /><br />When piston is displaced slightly by an amount x, change in volume,<br /><br />&nbsp; <math> <mrow> <mtext>dV</mtext> <mo>=</mo> <mo>-</mo> <mtext>Ax</mtext> </mrow> </math><br /><br />Since, the cylinder is isolated from the surroundings, nature of the process is adiabatic. In adiabatic process,<br /><br />&nbsp; <math> <mrow> <mfrac> <mrow> <mtext>dp</mtext> </mrow> <mrow> <mtext>dV</mtext> </mrow> </mfrac> <mo>=</mo> <mo>-</mo> <mi>γ</mi> <mfrac> <mrow> <mtext>p</mtext> </mrow> <mrow> <mtext>V</mtext> </mrow> </mfrac> </mrow> </math><br /><br /><br /><span class=\"Bodytext2BookAntiqua\"><span style=\"font-size: 8.5pt; color: black;\"><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0007517_AnsExp1_1.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 187px; height: 241px;\" /></span></span><br /><br />or increase in pressure inside the cylinder,<br />&nbsp;<br /><math> <mrow> <mtext>dp</mtext> <mo>=</mo> <mo>-</mo> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi>γ</mi> <mtext>p</mtext> </mrow> </mfenced> </mrow> <mrow> <mtext>V</mtext> </mrow> </mfrac> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>dV</mtext> </mrow> </mfenced> <mo>=</mo> <mi>γ</mi> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <msub> <mtext>p</mtext> <mn>0</mn> </msub> <mo>+</mo> <mfrac> <mrow> <mtext>Mg</mtext> </mrow> <mrow> <mtext>A</mtext> </mrow> </mfrac> </mrow> <mrow> <msub> <mtext>V</mtext> <mn>0</mn> </msub> </mrow> </mfrac> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>Ax</mtext> </mrow> </mfenced> </mrow> </math> ​<br /><br />This increase in pressure when multiplied with area of cross-section A will give a net upward force (or the restoring force). Hence,<br /><br /><math> <mrow> <mtext>F</mtext> <mo>=</mo> <mo>-</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>dp</mtext> </mrow> </mfenced> <mtext>A</mtext> <mo>=</mo> <mo>-</mo> <mi>γ</mi> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <msub> <mtext>p</mtext> <mn>0</mn> </msub> <msup> <mtext>A</mtext> <mn>2</mn> </msup> <mo>+</mo> <mtext>MgA</mtext> </mrow> <mrow> <msub> <mtext>V</mtext> <mn>0</mn> </msub> </mrow> </mfrac> </mrow> </mfenced> <mtext>x</mtext> </mrow> </math><br /><br />Or&nbsp;<math> <mrow> <mtext>a</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>F</mtext> </mrow> <mrow> <mtext>M</mtext> </mrow> </mfrac> <mo>=</mo> <mo>-</mo> <mi>γ</mi> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <msub> <mtext>p</mtext> <mn>0</mn> </msub> <msup> <mtext>A</mtext> <mn>2</mn> </msup> <mo>+</mo> <mtext>MgA</mtext> </mrow> <mrow> <msub> <mtext>V</mtext> <mn>0</mn> </msub> <mtext>M</mtext> </mrow> </mfrac> </mrow> </mfenced> <mtext>x</mtext> </mrow> </math><br /><br />Since, <math> <mrow> <mtext>a</mtext> <mo>∝</mo> <mo>-</mo> <mtext>x</mtext> </mrow> </math>, motion of the piston is simple harmonic in nature. Frequency of this oscillation is given by<br /><br /><math> <mrow> <mtext>f</mtext> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> <msqrt> <mfenced close=\"|\" open=\"|\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>a</mtext> </mrow> <mrow> <mtext>x</mtext> </mrow> </mfrac> </mrow> </mfenced> </msqrt> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> <msqrt> <mfrac> <mrow> <mi>γ&nbsp;</mi> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>p</mtext> <mn>0</mn> </msub> <msup> <mtext>A</mtext> <mn>2</mn> </msup> <mo>+</mo> <mtext>MgA</mtext> </mrow> </mfenced> </mrow> <mrow> <msub> <mtext>V</mtext> <mn>0</mn> </msub> <mtext>M</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86397e3a05060757378", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "92", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">U</mi></math> tube of the uniform bore of cross-sectional area&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> is set up vertically with open ends. A liquid of mass&nbsp;<math xmlns=\"http://www.
