o>-</mo><mn>1</mn></mrow><mn>3</mn></mfrac><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mi>a</mi><mi>x</mi></mfrac><mo>=</mo><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><mn>3</mn></mfrac><mo>&#160;&#160;</mo><mo>&#8230;</mo><mfenced close=\"]\" open=\"[\"><mrow><mo>&#8757;</mo><mi>a</mi><mo>=</mo><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mfrac><mrow><mi>d</mi><mi>x</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mi>v</mi><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>&#960;</mi></mrow><msqrt><mfenced close=\"|\" open=\"|\"><mfrac><mtext>&#160;acceleration&#160;</mtext><mtext>&#160;displacement&#160;</mtext></mfrac></mfenced></msqrt></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>&#960;</mi></mrow><msqrt><mfenced close=\"|\" open=\"|\"><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><mn>3</mn></mfrac></mfenced></msqrt></mfrac><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mn>3</mn></msqrt><mo>=</mo><mi>&#960;</mi><msqrt><mn>12</mn></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>=</mo><mn>12</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863f4e051183551960c", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "49", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:0 variant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mi>&#969;</mi><msub><mrow><mi>t</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mrow><mo>+</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mn>3</mn></mrow></mrow><mi>&#969;</mi><msub><mrow><mi>t</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfenced><mo>=</mo><mn>2</mn><mi>A</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mn>2</mn></mrow></mrow><mi>&#969;</mi><msub><mrow><mi>t</mi></mrow><mrow><mn>0</mn></mrow></msub><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>&#8289;</mo><mrow><mi>&#969;</mi><msub><mrow><mi>t</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mrow></math>...<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>4</mn><mo>)</mo></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8757;</mo><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mi>sin</mi><mi>C</mi><mo>+</mo><mi>sin</mi><mi>D</mi><mo>=</mo><mtext>&#8201;&#8201;</mtext><mn>2</mn><mi>sin</mi><mfrac><mrow><mi>C</mi><mo>+</mo><mi>D</mi></mrow><mn>2</mn></mfrac><mi>cos</mi><mfrac><mrow><mi>C</mi><mo>&#8722;</mo><mi>D</mi></mrow><mn>2</mn></mfrac></math></p><p>from equation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>2</mn><mo>)</mo></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>4</mn><mo>)</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>a</mi><mo>+</mo><mi>c</mi></mrow><mi>b</mi></mfrac><mo>=</mo><mn>2</mn><mi>cos</mi><mi>&#969;</mi><msub><mi>t</mi><mn>0</mn></msub></math><br /><br /><math><mi>&#969;</mi><mo>=</mo><mi>&#160;</mi><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>t</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>&#8289;</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>a</mi><mo>+</mo><mi>c</mi></mrow><mrow><mn>2</mn><mi>b</mi></mrow></mfrac></mrow></mfenced><mi>&#160;</mi><mo>&#8658;</mo><mi>f</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><mi>&#960;</mi><msub><mrow><mi>t</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>&#8289;</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>a</mi><mo>+</mo><mi>c</mi></mrow><mrow><mn>2</mn><mi>b</mi></mrow></mfrac></mrow></mfenced></mrow></mrow></mrow></mrow></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ebae6f9743809b7c", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "55", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two particles are executing simple harmonic motion of the same amplitude <math><mi>A</mi></math> and frequency <math><mi>ω</mi></math> along the <math><mi>x</mi></math>-axis. Their mean positions are separated by distance <math><msub><mrow><mi>x</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>(</mo><msub><mrow><mi>x</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>&gt;</mo><mi>A</mi><mo>)</mo></math>. If the maximum separation between them is <math><mo>(</mo><msub><mrow><mi>x</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>+</mo><mi>A</mi><mo>)</mo></math>, the phase difference between their motions is", "image": null}, "options": [{"id": "pCjIC", "text": "<math><mfrac><mrow><mi>2π</mi></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "mXy7y", "text": "<math><mfrac><mrow><mi>π</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "zml9t", "text": "<math><mfrac><mrow><mi>π</mi></mrow><mrow><mn>6</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "yDJfo", "text": "<math><mfrac><mrow><mi>π</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>When the distance between the particles is maximum, their relative velocity will be zero. This means the particles are at the same distance from from their respective mean positions. Since the maximum distance is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>x</mi><mn>0</mn></msub><mo>+</mo><mi>A</mi></math>, it means the particles are at half the amplitude position. Also, if one of the particles is left of its mean position, then the other one would be to the right of the mean position.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>x</mi><mn>1</mn></msub><mo>=</mo><mi>A</mi><mi>sin</mi><mo>&#8289;</mo><mrow><mo>(</mo><mi>&#969;</mi><mi>t</mi><mo>+</mo><msub><mi>&#981;</mi><mn>1</mn></msub><mo>)</mo></mrow></math></p><p>At&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>0</mn></math>, let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>x</mi><mn>1</mn></msub><mo>=</mo><mfrac><mi>A</mi><mn>2</mn></mfrac></math>, then</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#969;</mi><mi>t</mi><mo>+</mo><msub><mi>&#981;</mi><mn>1</mn></msub><mo>=</mo><mfrac><mi>&#960;</mi><mn>6</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>x</mi><mn>2</mn></msub><mo>=</mo><mi>A</mi><mi>sin</mi><mo>&#8289;</mo><mrow><mo>(</mo><mi>&#969;</mi><mi>t</mi><mo>+</mo><msub><mi>&#981;</mi><mn>2</mn></msub><mo>)</mo></mrow></math></p><p>At&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>0</mn></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>x</mi><mn>2</mn></msub><mo>=</mo><mfrac><mrow><mo>-</mo><mi>A</mi></mrow><mn>2</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#969;</mi><mi>t</mi><mo>+</mo><msub><mi>&#981;</mi><mn>2</mn></msub><mo>=</mo><mn>2</mn><mi>&#960;</mi><mo>-</mo><mfrac><mi>&#960;</mi><mn>3</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>&#981;</mi><mn>2</mn></msub><mo>-</mo><msub><mi>&#981;</mi><mn>1</mn></msub><mo>=</mo><mfrac><mrow><mn>2</mn><mi>&#960;</mi></mrow><mn>3</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e96df1fb1f6bdcb8", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "60", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A particle performs linear SHM. At a particular instant, the velocity of the particle is <math><mi>u </mi></math> and acceleration is <math><mi>α</mi></math>&nbsp;(both having the same direction). At another instant velocity is <math><mi>v</mi></math> and acceleration is <math><msup><mrow><mi>&nbsp;</mi></mrow></msup><msup><mrow><mi>β&nbsp;</mi></mrow></msup><mfenced separators=\"|\"><mrow><mn>0</mn><mo>&lt;</mo><mi>α</mi><mo>&lt;</mo><mi>β</mi></mrow></mfenced></math>&nbsp;(both in opposite direction to each other).The distance between the two positions is", "image": null}, "options": [{"id": "yjRJE", "text": "<math><mfrac><mrow><msup><mrow><mi>u</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>α</mi><mo>+</mo><mi>β</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "YLnqy", "text": "<math><mi> </mi><mfrac><mrow><msup><mrow><mi>u</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>α</mi><mo>+</mo><mi>β</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "PgJLy", "text": "<math><mfrac><mrow><msup><mrow><mi>u</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>α</mi><mo>-</mo><mi>β</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "x0ptt", "text": "<math><mi> </mi><mfrac><mrow><msup><mrow><mi>u</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>α</mi><mo>-</mo><mi>β</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let distance be <math><msub><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow></msub></math> when velocity is u and acceleration <math><mi>α</mi><mo>.</mo></math><br /><br />Let distance be <math><msub><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msub></math> when velocity is v and acceleration <math><mi>β</mi><mo>.</mo></math><br /><br />If <math><mi>ω</mi></math> is the angular frequency then<br /><br /><math><mi>α</mi><mo>=</mo><mi>&nbsp;</mi><msup><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>&nbsp;</mi><msub><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow></msub></math><br /><br />And <math><mi>β</mi><mo>=</mo><msup><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>&nbsp;</mi><msub><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>α</mi><mo>+</mo><mi>β</mi><mo>=</mo><msup><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>(</mo><msub><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>)</mo></math> ....... (i)<br /><br />Also <math><msup><mrow><mi>u</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msup><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msup><msubsup><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup></math><br /><br />And <math><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msup><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>&nbsp;</mi><msup><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>&nbsp;</mi><msubsup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup></math><br /><br /><math><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>u</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msup><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>(</mo><msubsup><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>-</mo><msubsup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>)</mo></math><br /><br /><math><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>u</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msup><mrow><mi>ω</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>(</mo><msub><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>)</mo><mo>(</mo><msub><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>)</mo></math> ........... (ii)<br /><br />By Equation. (i) we get <math><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>u</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mo>(</mo><msub><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>)</mo><mo>(</mo><mi>α</mi><mo>+</mo><mi>β</mi><mo>)</mo></math><br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>u</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>α</mi><mo>+</mo><mi>β</mi></mrow></mfrac></math><br /><br />Or <math><msub><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>-</mo><msub><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfrac><mrow><msup><mrow><mi>u</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>α</mi><mo>+</mo><mi>β</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e5242b6949579455", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "16", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mn>1</mn></msub></math>&nbsp;connected to a horizontal spring performs S.H.M. with amplitude <math><mi>A</mi></math>.&nbsp;While mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mn>1</mn></msub></math>&nbsp;is passing through mean position another mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mn>2</mn></msub></math>&nbsp;is placed on it so that both the masses move together with amplitude <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><m , "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e4214ba4f54d892d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "103", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The kinetic energy <math><mi>K</mi></math> of a particle moving along a circle of radius <math><mi>R</mi></math> depends on the distance covered s, as <math><mi>K</mi><mo>=</mo><mi>a</mi><msup><mrow><mi>s</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>,</mo></math> where, a is constant. Then the force acting on the particle is", "image": null}, "options": [{"id": "3v7j6", "text": "<math><mn>2</mn><mi>a</mi><mfrac><mrow><msup><mrow><mi>s</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "KJgkz", "text": "<math><mn>2</mn><mi>a</mi><mi>s</mi><msup><mrow><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mfrac><mrow><msup><mrow><mi>s</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced></mrow><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "z34Mn", "text": "<math><mn>2</mn><mi>a</mi><mi>s</mi></math>", "image": null, "isCorrect": false}, {"id": "VzgRO", "text": "<math><mn>2</mn><mi>a</mi><mfrac><mrow><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>s</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to given problem, <math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>m</mi><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mi>a</mi><msup><mrow><mi>s</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br /><math><mo>⇒</mo><mi>v</mi><mo>=</mo><mi>s</mi><msqrt><mfrac><mrow><mn>2</mn><mi>a</mi></mrow><mrow><mi>m</mi></mrow></mfrac></msqrt></math><br /><br />So, <math><msub><mrow><mi>a</mi></mrow><mrow><mi>c</mi></mrow></msub><mo>=</mo><mfrac><mrow><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>R</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>a</mi><msup><mrow><mi>s</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>m</mi><mi>R</mi></mrow></mfrac></math> ... (i)<br /><br />Further more as<br /><br /><math><msub><mrow><mi>a</mi></mrow><mrow><mi>t</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>s</mi></mrow></mfrac><mo>.</mo><mfrac><mrow><mi>d</mi><mi>s</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mi>v</mi><mo>×</mo><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>s</mi></mrow></mfrac></math> ... (ii)<br /><br />[by chain rule]<br /><br />Which in light of Equation. (i) i.e. <math><mi>v</mi><mo>=</mo><mi>s</mi><msqrt><mfrac><mrow><mn>2</mn><mi>a</mi></mrow><mrow><mi>m</mi></mrow></mfrac></msqrt></math> yields<br /><br /><math><msub><mrow><mi>a</mi></mrow><mrow><mi>t</mi></mrow></msub><mo>=</mo><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi>s</mi><msqrt><mfrac><mrow><mn>2</mn><mi>a</mi></mrow><mrow><mi>m</mi></mrow></mfrac></msqrt></mrow></mfenced><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><msqrt><mfrac><mrow><mn>2</mn><mi>a</mi></mrow><mrow><mi>m</mi></mrow></mfrac></msqrt></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>2</mn><mi>a</mi><mi>s</mi></mrow><mrow><mi>m</mi></mrow></mfrac></math> ... (iii)<br /><br />So that <math><mi>a</mi><mo>=</mo><msqrt><msubsup><mrow><mi>a</mi></mrow><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msubsup><mo>+</mo><msubsup><mrow><mi>a</mi></mrow><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msubsup></msqrt></math><br /><br /><math><mo>=</mo><msqrt><msup><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>2</mn><mi>a</mi><msup><mrow><mi>s</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>m</mi><mi>R</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>2</mn><mtext> </mtext><mi>a</mi><mi>s</mi></mrow><mrow><mi>m</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></msqrt><mi>&nbsp;</mi><mi>&nbsp;</mi></math><br /><br />Hence, <math><mi>a</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>a</mi><mi>s</mi></mrow><mrow><mi>m</mi></mrow></mfrac><msqrt><mn>1</mn><mo>+</mo><msup><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mi>s</mi></mrow><mrow><mi>R</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></msqrt></math><br /><br /><math><mo>∴</mo></math> Force acting on the particle <math><mi>F</mi><mo>=</mo><mi>m</mi><mi>a</mi><mo>=</mo><mn>2</mn><mi>a</mi><mi>s</mi><msqrt><mn>1</mn><mo>+</mo><msup><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mi>s</mi></mrow><mrow><mi>R</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e08f9a74149da433", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "82", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The displacement <math><mo>(</mo><mi>x</mi><mo>)</mo></math> is plotted with time <math><mo>(</mo><mi>t</mi><mo>)</mo></math> for a particle executing SHM as shown below. The correct equation of SHM is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/WhatsApp_Image_2020-08-08_at_5.15.31_PM.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 200px; height: 164px;\" />", "image": null}, "options": [{"id": "rz9xp", "text": "<math><mi>x</mi><mo>=</mo><mn>4</mn><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>π</mi><mi>t</mi></mrow><mrow><mn>6</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>π</mi></mrow><mrow><mn>6</mn></mrow></mfrac></mrow></mfenced></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "5VbuB", "text": "<math><mi>x</mi><mo>=</mo><mn>4</mn><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>π</mi><mi>t</mi></mrow><mrow><mn>6</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mi>π</mi></mrow><mrow><mn>6</mn></mrow></mfrac></mrow></mfenced></mrow></mrow></math>", "image": null, "isCorrect": true}, {"id": "Hr6qv", "text": "<math><mi>x</mi><mo>=</mo><mn>2</mn><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>2</mn><mi>π</mi></mrow><mrow><mn>6</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>π</mi></mrow><mrow><mn>6</mn></mrow></mfrac></mrow></mfenced></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "P5fqp", "text": "<math><mi>x</mi><mo>=</mo><mn>2</mn><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>π</mi><mi>t</mi></mrow><mrow><mn>6</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mi>π</mi></mrow><mrow><mn>6</mn></mrow></mfrac></mrow></mfenced></mrow></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi>x</mi><mo>=</mo><mn>4</mn><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mo>(</mo><mi>ω</mi><mi>t</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>+</mo><mi>ϕ</mi><mo>)</mo></mrow></mrow></math><br /><br /><math><mi>ω</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>π</mi></mrow><mrow><mi mathvariant=\"normal\">T</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>π</mi></mrow><mrow><mn>12</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>π</mi></mrow><mrow><mn>6</mn></mrow></mfrac></math><br /><br /><math><mi>x</mi><mo>=</mo><mn>4</mn><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>π</mi><mi>t</mi></mrow><mrow><mn>6</mn></mrow></mfrac><mo>+</mo><mi>ϕ</mi></mrow></mfenced></mrow></mrow></math><br /><br /><math><mo>-</mo><mn>2</mn><mo>=</mo><mn>4</mn><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>ϕ</mi></mrow></mrow></math><br /><br /><math><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>ϕ</mi></mrow></mrow></math><br /><br /><math><mi>ϕ</mi><mo>=</mo><mo>-</mo><mfrac><mrow><mi>π</mi></mrow><mrow><mn>6</mn></mrow></mfrac></math><br /><br /><math><mi>x</mi><mo>=</mo><mn>4</mn><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>π</mi><mi>t</mi></mrow><mrow><mn>6</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mi>π</mi></mrow><mrow><mn>6</mn></mrow></mfrac></mrow></mfenced></mrow></mrow></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e07cfb0c1a37f356", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "09", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two large insulating plates having surface charge densities <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>+</mo><mi>σ</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mi>σ</mi></math>&nbsp;are fixed some distance&nbsp;apart in a gravity-free region and two ideal insulating springs of force constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi></math>&nbsp;are connected to the plates as shown in the figure. A particle of charge <math> <mi>q</mi> </math>&nbsp;and mass <math> <mi>m</mi> </math>&nbsp;which is attached to the junction of the springs is released from rest, then the particle will cross its equilibrium position with a speed<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/Q_12.jpg\" style=\"width: 255px; height: 198px;\" /><br />\r&nbsp;", "image": null}, "options": [{"id": "ip2MI", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mfrac><mrow><mi>q</mi><mi>&#x3C3;</mi></mrow><msub><mi>&#x3B5;</mi><mi>o</mi></msub></mfrac><msqrt><mfrac><mi>k</mi><mi>m</mi></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "GTpG5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mfrac><mrow><mi>q</mi><mi>σ</mi></mrow><msub><mi>ε</mi><mn>0</mn></msub></mfrac><msqrt><mfrac><mi>k</mi><mrow><mn>2</mn><mi>m</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "fLrKu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mfrac><mrow><mi>q</mi><mi>&#x3C3;</mi></mrow><msub><mi>&#x3B5;</mi><mn>0</mn></msub></mfrac><msqrt><mfrac><mrow><mn>2</mn><mi>k</mi></mrow><mi>m</mi></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "I5xHY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mfrac><mrow><mi>q</mi><mi>&#x3C3;</mi></mrow><mrow><mn>2</mn><msub><mi>&#x3B5;</mi><mn>0</mn></msub></mrow></mfrac><msqrt><mfrac><mi>k</mi><mi>m</mi></mfrac></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The electric field between plates is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mo>=</mo><mfrac><mi>σ</mi><msub><mi>ε</mi><mn>0</mn></msub></mfrac></math>&nbsp;(Constant)</p><p>The angular frequency of SHM doesn't&nbsp;change by a constant force, only the equilibrium position will be affected.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ω</mi><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mi>k</mi></mrow><mi>m</mi></mfrac></msqrt></math></p><p>The amplitude of SHM can be calculated by finding the distance of the equilibrium position from the rest position (starting position) of the particle.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>k</mi><mi>A</mi><mo>=</mo><mfrac><mrow><mi>q</mi><mi>σ</mi></mrow><msub><mi>ε</mi><mn>0</mn></msub></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>A</mi><mo>=</mo><mfrac><mrow><mi>q</mi><mi>σ</mi></mrow><mrow><mn>2</mn><mi>k</mi><msub><mi>ε</mi><mn>0</mn></msub></mrow></mfrac></math></p><p>So the particle will cross its equilibrium position with a speed</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mfrac><mrow><mi>q</mi><mi>σ</mi></mrow><msub><mi>ε</mi><mn>0</mn></msub></mfrac><msqrt><mfrac><mi>k</mi><mrow><mn>2</mn><mi>m</mi></mrow></mfrac></msqrt></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863dea0a5cd12c374c5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "51", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A particle executes simple harmonic motion with a time period of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>16</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">s</mi></math>&nbsp;along the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>&nbsp;- axis.&nbsp;At time <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">s</mi></math>, the particle crosses the mean position while at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">s</mi></math>, the&nbsp;velocity of the particle is&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>+</mo><mo>&nbsp;</mo><mn>4</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. The amplitude of motion (in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math>) is", "image": null}, "options": [{"id": "TSGJ2", "text": "<math><msqrt><mn>2</mn></msqrt><mi>π</mi></math>", "image": null, "isCorrect": false}, {"id": "rwnfn", "text": "<math><mn>16</mn><msqrt><mn>2</mn></msqrt><mi>π</mi></math>", "image": null, "isCorrect": false}, {"id": "vvjMc", "text": "<math><mn>24</mn><msqrt><mn>2</mn></msqrt><mi>π</mi></math>", "image": null, "isCorrect": false}, {"id": "wus2b", "text": "<math><mfrac><mrow><mn>32</mn><msqrt><mn>2</mn></msqrt></mrow><mrow><mi>π</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>The general equation of SHM is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mi>A</mi><mi>sin</mi><mfenced open=\"[\" close=\"]\"><mrow><mi>&#969;</mi><mi>t</mi><mo>+</mo><mi>&#981;</mi></mrow></mfenced></math>, here</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#969;</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>&#960;</mi></mrow><mn>16</mn></mfrac><mo>=</mo><mfrac><mi>&#960;</mi><mn>8</mn></mfrac><mo>&#160;</mo><mi>rad</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p><p>At&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>,&nbsp;the particle is at the mean position. Hence,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>=</mo><mi>A</mi><mi>sin</mi><mfenced open=\"[\" close=\"]\"><mrow><mfrac><mi>&#960;</mi><mn>8</mn></mfrac><mo>&#215;</mo><mn>2</mn><mo>+</mo><mi>&#981;</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#981;</mi><mo>=</mo><mo>-</mo><mfrac><mi>&#960;</mi><mn>4</mn></mfrac></math></p><p>So the equation of SHM will become</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mi>A</mi><mi>sin</mi><mfenced open=\"[\" close=\"]\"><mrow><mfrac><mi>&#960;</mi><mn>8</mn></mfrac><mi>t</mi><mo>-</mo><mfrac><mi>&#960;</mi><mn>4</mn></mfrac></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi><mo>=</mo><mfrac><mrow><mi>&#960;</mi><mi>A</mi></mrow><mn>8</mn></mfrac><mi>cos</mi><mfenced open=\"[\" close=\"]\"><mrow><mfrac><mi>&#960;</mi><mn>8</mn></mfrac><mi>t</mi><mo>-</mo><mfrac><mi>&#960;</mi><mn>4</mn></mfrac></mrow></mfenced></math></p><p>At&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mo>&#160;</mo><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>=</mo><mfrac><mrow><mi>&#960;</mi><mi>A</mi></mrow><mn>8</mn></mfrac><mi>cos</mi><mfenced open=\"[\" close=\"]\"><mrow><mfrac><mi>&#960;</mi><mn>8</mn></mfrac><mo>&#215;</mo><mn>4</mn><mo>-</mo><mfrac><mi>&#960;</mi><mn>4</mn></mfrac></mrow></mfenced><mspace linebreak=\"newline\"/></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>=</mo><mfrac><mrow><mi>&#960;</mi><mi>A</mi></mrow><mn>8</mn></mfrac><mi>cos</mi><mfenced open=\"[\" close=\"]\"><mfrac><mi>&#960;</mi><mn>4</mn></mfrac></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>A</mi><mo>=</mo><mfrac><mrow><mn>32</mn><msqrt><mn>2</mn></msqrt></mrow><mi>&#960;</mi></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mspace linebreak=\"newline\"/></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863dd8d22bc55562457", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "37", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A horizontal platform, with an object placed on it, is executing SHM in the vertical direction. The amplitude of oscillation is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2.5</mn><mo>&nbsp;</mo><mi>cm</mi></math>. Let the least period of these oscillations, so that the object is not detached, be equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>π</mi><mrow><mn>2</mn><mi>a</mi></mrow></mfrac></math>. Then, the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math>&nbsp;is (Given: <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mo>=</mo><mn>10</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>)", "image": null}, "options": [], "correctValue": "5", "solution": {"text": "The object would not leave the platform when <br/><math><msub><mrow><mi>a</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">x</mi></mrow></msub><mo>&lt;</mo><mi>g</mi></math>  <br/><math><mo>∴</mo><mi> </mi><mi> </mi><msup><mrow><mi>w</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>A</mi><mo>&lt;</mo><mi>g</mi></math>  <br/><math><mo>∴</mo><mi> </mi><mi> </mi><mi>w</mi><mo>&lt;</mo><msqrt><mfrac><mrow><mn>10</mn></mrow><mrow><mn>2.5</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfrac></msqrt><mo>=</mo><msqrt><mfrac><mrow><msup><mrow><mn>10</mn></mrow><mrow><mn>4</mn></mrow></msup></mrow><mrow><mn>25</mn></mrow></mfrac></msqrt><mo>=</mo><mfrac><mrow><mn>100</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mo>=</mo><mn>20</mn></math>  <br/><math><mo>∴</mo><mi> </mi><mi> </mi><mfrac><mrow><mn>2</mn><mi>π</mi></mrow><mrow><mi>T</mi></mrow></mfrac><mo>&lt;</mo><mn>20</mn><mi> </mi><mi> </mi><mo>⇒</mo><mi>T</mi><mo>&gt;</mo><mfrac><mrow><mi>π</mi></mrow><mrow><mn>10</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d2e5e97c0f60b9e3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "98", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A body executes S.H.M. of period <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo></math>seconds. Its velocity is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&nbsp;</mo><mi>cm</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>,<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mn>2</mn></math> seconds after it has passed the mean position. Find the amplitude of the bob</p>\r\r<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>cos</mi><mn>36</mn><mo>°</mo><mo>=</mo><mn>0</mn><mo>.</mo><mn>809</mn></mrow></mfenced></math></p>\r", "image": null}, "options": [{"id": "QOt5X", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>21</mn><mo>.</mo><mn>45</mn><mo>&#160;</mo><mi>cm</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 100px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "lIlhu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>16</mn><mo>.</mo><mn>56</mn><mo>&#160;</mo><mi>cm</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 99px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}, {"id": "NVfLD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>19</mn><mo>.</mo><mn>67</mn><mo>&#160;</mo><mi>cm</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 143px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": true}, {"id": "mseFw", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>.</mo><mn>34</mn><mo>&#160;</mo><mi>cm</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 131px; top: -5.77778px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here,<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mi>T</mi><mo>=</mo><mn>20</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math><br /><br />Also, when <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi><mo>,</mo><mo>&#160;</mo><mi>v</mi><mo>=</mo><mn>5</mn><mo>&#160;</mo><mi>cm</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Now,</mi><mo>&#160;</mo><mo mathvariant=\"italic\">v</mo><mo>=</mo><mi>A</mi><mo mathvariant=\"italic\">&#969;</mo><mo>cos &#969;t</mo><mo>=</mo><mtext mathvariant=\"italic\">A</mtext><mo>&#215;</mo><mfrac><mrow><mn>2</mn><mtext>&#960;</mtext></mrow><mtext mathvariant=\"italic\">T</mtext></mfrac><mtext>cos</mtext><mfrac><mrow><mn>2</mn><mtext>&#960;</mtext></mrow><mtext mathvariant=\"italic\">T</mtext></mfrac><mtext mathvariant=\"italic\">t</mtext></math><br /><br /><math> <mrow> <mo>&#8756;</mo> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mn>5</mn> <mo>=</mo> <mtext>A</mtext> <mo>&#215;</mo> <mfrac> <mrow> <mn>2</mn> <mtext>&#960;</mtext> </mrow> <mrow> <mn>2</mn> <mn>0</mn> </mrow> </mfrac> <mtext>cos</mtext> <mfrac> <mrow> <mn>2</mn> <mtext>&#960;</mtext> </mrow> <mrow> <mn>2</mn> <mn>0</mn> </mrow> </mfrac> <mo>&#215;</mo> <mn>2</mn> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mtext>or</mtext> <mspace width=\"0.5em\"></mspace> <mspace width=\"0.5em\"></mspace> <mfrac> <mrow><mtext>A</mtext> <mtext>&#960;</mtext> </mrow> <mrow> <mn>1</mn> <mn>0</mn> </mrow> </mfrac> <mtext>cos</mtext> <mfrac> <mrow> <mtext>&#960;</mtext> </mrow> <mrow> <mn>5</mn> </mrow> </mfrac> <mo>=</mo> <mn>5</mn> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>or&#160;&#160;</mn><mfrac><mrow><mtext>&#960;</mtext><mtext mathvariant=\"italic\">A</mtext></mrow><mrow><mn>1</mn><mn>0</mn></mrow></mfrac><mtext>cos&#160;</mtext><mtext>36&#176;</mtext><mo>=</mo><mn>5</mn><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mtext>or</mtext><mspace width=\"0.5em\"/><mspace width=\"0.5em\"/><mfrac><mrow><mtext>&#960;</mtext><mtext mathvariant=\"italic\">A</mtext></mrow><mrow><mn>1</mn><mn>0</mn></mrow></mfrac><mo>&#215;</mo><mn>0</mn><mtext>.</mtext><mn>8</mn><mn>0</mn><mn>9</mn><mn>0</mn><mo>=</mo><mn>5</mn></math><br /><br />or&nbsp;&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mn>19</mn><mo>.</mo><mn>67</mn><mo>&#160;</mo><mi>cm</mi></math><div id=\"gtx-trans\" style=\"position: absolute; left: 31px; top: 266.323px;\"><div class=\"gtx-trans-icon\">&nbsp;</div></div>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d17feb273e83c733", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "08", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The displacement of a damped harmonic oscillator is given by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mfenced><mi>t</mi></mfenced><mo>=</mo><msup><mi mathvariant=\"normal\">e</mi><mrow><mo>-</mo><mn>0</mn><mo>.</mo><mn>1</mn><mi>t</mi></mrow></msup><mo>&#160;</mo><mi>cos</mi><mfenced><mrow><mn>10</mn><mi mathvariant=\"normal\">&#960;</mi><mi>t</mi><mo>+</mo><mi>&#966;</mi></mrow></mfenced></math>,&nbsp;where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi></math>&nbsp;is the time in seconds. The time taken for the amplitude of the oscillator to drop to half of its initial value is close to", "image": null}, "options": [{"id": "kPe0p", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>13</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "hivhR", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7&nbsp;</mn><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": true}, {"id": "khutJ", "text": "<math xmlns=\"http://www.w3.o
