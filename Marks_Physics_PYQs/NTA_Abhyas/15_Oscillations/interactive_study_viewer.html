e. The free end of the spring is being pulled towards the right with constant speed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">V</mi><mn>0</mn></msub><mo>=</mo><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. At <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">t</mi><mo>=</mo><mn>0</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">s</mi></math>, the spring of constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">k</mi><mo>=</mo><mn>100</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><mi mathvariant=\"normal\">c</mi><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> is unstretched and the block has a speed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> to left. The maximum extension of the spring will be<br />\r<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image39-eb366023-ff68-46ed-9dc2-2a9b1845126e.jpg\" />", "image": null}, "options": [{"id": "LGlEu", "text": "<math><mn>2&nbsp;</mn><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "RkWm6", "text": "<math><mn>4</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "jbpma", "text": "<math><mn>6</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": true}, {"id": "kFOKO", "text": "<math><mn>8</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In the frame (inertial w.r.t. earth) of the free end of spring, the initial velocity of the block is <math><mn>3&nbsp;</mn><mrow><mrow><mi mathvariant=\"normal\">m</mi></mrow><mo>/</mo><mrow><mi mathvariant=\"normal\">s</mi></mrow></mrow></math> to left and the spring is unstretched.<br /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image40-bbd67ba3-e913-4af6-ab83-564b57876558.jpg\" /><br /><br />Applying conservation of energy between initial and maximum extension state,<br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">m</mi><msup><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">k</mi><msup><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br /><math><mi mathvariant=\"normal\">A</mi><mo>=</mo><msqrt><mfrac><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mi mathvariant=\"normal\">k</mi></mrow></mfrac></msqrt><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">V</mi><mo>=</mo><msqrt><mfrac><mrow><mn>4</mn></mrow><mrow><mn>10000</mn></mrow></mfrac></msqrt><mo>×</mo><mn>3</mn><mo>=</mo><mn>6</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">m</mi></math>&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636c1c70fb96862ba6", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "66", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An elastic string has a force constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi></math> and mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>. The string hangs vertically and a block of unknown mass is attached to its bottom end. It is known that the mass of the block is much greater than that of the string. The hanging block stretches the string the twice it's the relaxed length. How long <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mi>t</mi></mfenced></math> would it take for a low amplitude transverse pulse to travel the length of the string stretched by the hanging block? (Assume that the string follows Hook's law)", "image": null}, "options": [{"id": "XJMcD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mrow><mn>2</mn><mi>m</mi></mrow><mi>k</mi></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "th69P", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mi>m</mi><mi>k</mi></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "MYgTb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mi>m</mi><mrow><mn>2</mn><mi>k</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "0E5yc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mfrac><mrow><mn>2</mn><mi>m</mi></mrow><mrow><mn>3</mn><mi>k</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since the mass of the string is small compared to the mass <math><mi mathvariant=\"normal\">m</mi></math> , the tension force is approximately constant<br /><br /><math><mo>&#8756;</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">T</mi><mo>=</mo><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">x</mi><mo>=</mo><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">x</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi></mrow><mi mathvariant=\"normal\">k</mi></mfrac></math><br /><br /><math><mi mathvariant=\"normal\">x</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">L</mi></math> given<br /><br />Where <math><mi mathvariant=\"normal\">L</mi><mo>-</mo></math> Relaxed length.<br /><br /><math><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">w</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">h</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">L</mi></math><br /><br /><math><mo>=</mo><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi></mrow><mrow><mi mathvariant=\"normal\">k</mi></mrow></mfrac></math><br /><br /><math><mo>&#8756;</mo></math> mass per unit length<br /><br /><math><mi mathvariant=\"normal\">&#181;</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">k</mi></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">k</mi></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">g</mi></mrow></mfrac></math><br /><br />Speed of wave <math><mi mathvariant=\"normal\">V</mi><mo>=</mo><msqrt><mfrac><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mi mathvariant=\"normal\">&#956;</mi></mrow></mfrac></msqrt></math><br /><br /><math><mo>=</mo><msqrt><mfrac><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi><mo>&#215;</mo><mn>2</mn><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">k</mi></mrow></mfrac></msqrt></math><br /><br /><math><mi mathvariant=\"normal\">V</mi><mo>=</mo><mi mathvariant=\"normal\">g</mi><msqrt><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">m</mi></mrow><mrow><mi mathvariant=\"normal\">k</mi></mrow></mfrac></msqrt></math><br /><br /><math><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">L</mi></mrow><mrow><mi mathvariant=\"normal\">V</mi></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>2</mn><mi>mg</mi></mrow><mi mathvariant=\"normal\">k</mi></mfrac><mo>&#215;</mo><mfrac><mn>1</mn><mi>g</mi></mfrac><msqrt><mfrac><mi>k</mi><mrow><mn>2</mn><mi>m</mi></mrow></mfrac></msqrt></math><br /><br /><math><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">m</mi></mrow><mrow><mi mathvariant=\"normal\">k</mi></mrow></mfrac></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863635db83dd1a3faad", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "19", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The time period of oscillations of a block attached to a spring is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">t</mi><mn>1</mn></msub></math>. When the spring is replaced by another spring, the time period of the block is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">t</mi><mn>2</mn></msub></math>. If both the springs are connected in series and the block is made to oscillate using the combination, then the time period of the block is", "image": null}, "options": [{"id": "xd5FY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>T</mtext><mo>=</mo><msub><mi mathvariant=\"normal\">t</mi><mn>1</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">t</mi><mn>2</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "CWgnR", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mtext>T</mtext><mn>2</mn></msup><mo>=</mo><msubsup><mi mathvariant=\"normal\">t</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi mathvariant=\"normal\">t</mi><mn>2</mn><mn>2</mn></msubsup></math>", "image": null, "isCorrect": true}, {"id": "BAZRD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mtext>T</mtext><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo><msubsup><mi mathvariant=\"normal\">t</mi><mn>1</mn><mrow><mo>-</mo><mn>1</mn></mrow></msubsup><mo>+</mo><msubsup><mi mathvariant=\"normal\">t</mi><mn>2</mn><mrow><mo>-</mo><mn>1</mn></mrow></msubsup></math>", "image": null, "isCorrect": false}, {"id": "iVV2y", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mtext>T</mtext><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>=</mo><msubsup><mi mathvariant=\"normal\">t</mi><mn>1</mn><mrow><mo>-</mo><mn>2</mn></mrow></msubsup><mo>+</mo><msubsup><mi mathvariant=\"normal\">t</mi><mn>2</mn><mrow><mo>-</mo><mn>2</mn></mrow></msubsup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When springs are in series, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">k</mi><mo>=</mo><mfrac><mrow><msub><mi mathvariant=\"normal\">k</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">k</mi><mn>2</mn></msub></mrow><mrow><msub><mi mathvariant=\"normal\">k</mi><mn>1</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">k</mi><mn>2</mn></msub></mrow></mfrac></math>&nbsp;<br /><br />For&nbsp; first&nbsp; spring, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">t</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">π</mi><msqrt><mfrac><mtext>m</mtext><msub><mi mathvariant=\"normal\">k</mi><mn>1</mn></msub></mfrac></msqrt></math><br /><br />For&nbsp; Second&nbsp; spring, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">t</mi><mn>2</mn></msub><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">π</mi><msqrt><mfrac><mtext>m</mtext><msub><mi mathvariant=\"normal\">k</mi><mn>2</mn></msub></mfrac></msqrt></math><br /><br /><math> <mrow> <mo>∴</mo> </mrow> </math>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi mathvariant=\"normal\">t</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi mathvariant=\"normal\">t</mi><mn>2</mn><mn>2</mn></msubsup><mo>=</mo><mfrac><mrow><mn>4</mn><msup><mi mathvariant=\"normal\">π</mi><mn>2</mn></msup><mtext>m</mtext></mrow><msub><mi mathvariant=\"normal\">k</mi><mn>1</mn></msub></mfrac><mo>+</mo><mfrac><mrow><mn>4</mn><msup><mi mathvariant=\"normal\">π</mi><mn>2</mn></msup><mtext>m</mtext></mrow><msub><mi mathvariant=\"normal\">k</mi><mn>2</mn></msub></mfrac><mo>=</mo><mn>4</mn><msup><mi mathvariant=\"normal\">π</mi><mn>2</mn></msup><mtext>m</mtext><mfenced><mfrac><mrow><msub><mi mathvariant=\"normal\">k</mi><mn>1</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">k</mi><mn>2</mn></msub></mrow><mrow><msub><mi mathvariant=\"normal\">k</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">k</mi><mn>2</mn></msub></mrow></mfrac></mfenced></math><br /><br />or&nbsp; &nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<mat /jee_main/images/944a85e3-f42b-4cda-9c32-1e4291230961.png\" style=\"width:1.76042in;height:1.26042in\" />", "image": null}, "options": [{"id": "6cNaV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">π</mi><msqrt><mfenced separators=\"|\"><mfrac><mrow><mi>M</mi><mi>h</mi></mrow><mrow><mi>P</mi><mi>A</mi></mrow></mfrac></mfenced></msqrt></math>", "image": null, "isCorrect": true}, {"id": "09Nbq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi><msqrt><mfenced separators=\"|\"><mfrac><mrow><mi>M</mi><mi>A</mi></mrow><mrow><mi>P</mi><mi>h</mi></mrow></mfrac></mfenced></msqrt></math>", "image": null, "isCorrect": false}, {"id": "r6TGH", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi><msqrt><mfenced separators=\"|\"><mfrac><mi>M</mi><mrow><mi>P</mi><mi>A</mi><mi>h</mi></mrow></mfrac></mfenced></msqrt></math>", "image": null, "isCorrect": false}, {"id": "MkwYo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi><msqrt><mi>M</mi><mi>P</mi><mi>h</mi><mi>A</mi></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Let the piston be displaced through distance <math><mi mathvariant=\"normal\">x</mi></math> towards left, then volume decreases, pressure increases. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Δ</mi><mi>P</mi></math> is an increase in pressure and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Δ</mi><mi>V</mi></math> is a decrease in volume, then considering the process to take place slowly (i.e. Isothermal)<br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/431645e3-9228-4c63-9009-27c9d485201e.png\" style=\"width:1.68681in;height:1.34028in\" /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub><mo>=</mo><msub><mi>P</mi><mn>2</mn></msub><msub><mi>V</mi><mn>2</mn></msub><mo>⇒</mo><mi>P</mi><mi>V</mi><mo>=</mo><mo>(</mo><mi>P</mi><mo>+</mo><mi mathvariant=\"normal\">Δ</mi><mi>P</mi><mo>)</mo><mo>(</mo><mi>V</mi><mo>-</mo><mi>ΔV</mi><mo>)</mo></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>P</mi><mi>V</mi><mo>=</mo><mi>P</mi><mi>V</mi><mo>+</mo><mi mathvariant=\"normal\">Δ</mi><mi>P</mi><mi>V</mi><mo>-</mo><mi>P</mi><mi mathvariant=\"normal\">Δ</mi><mi>V</mi><mo>-</mo><mi mathvariant=\"normal\">Δ</mi><mi>P</mi><mi mathvariant=\"normal\">Δ</mi><mi>V</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi mathvariant=\"normal\">Δ</mi><mi>P</mi><mo>.</mo><mi>V</mi><mo>-</mo><mi>P</mi><mo>.</mo><mi mathvariant=\"normal\">Δ</mi><mi>V</mi><mo>=</mo><mn>0</mn><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>(</mo><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">g</mi><mo>&nbsp;</mo><mi mathvariant=\"normal\">Δ</mi><mi>P</mi><mo>.</mo><mi mathvariant=\"normal\">Δ</mi><mi>V</mi><mo>)</mo></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Δ</mi><mi>P</mi><mo>(</mo><mi>A</mi><mi>h</mi><mo>)</mo><mo>=</mo><mi>P</mi><mo>(</mo><mi>A</mi><mi>x</mi><mo>)</mo><mo>⇒</mo><mi mathvariant=\"normal\">Δ</mi><mi>P</mi><mo>=</mo><mfrac><mrow><mi>P</mi><mo>⋅</mo><mi>x</mi></mrow><mi>h</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><mo>-</mo><mfrac><mrow><mi>P</mi><mi>A</mi></mrow><mi>h</mi></mfrac><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ω</mi><mo>=</mo><msqrt><mfrac><mrow><mi>P</mi><mi>A</mi></mrow><mrow><mi>M</mi><mi>h</mi></mrow></mfrac></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>M</mi><mi>h</mi></mrow><mrow><mi>P</mi><mi>A</mi></mrow></mfrac></msqrt></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635f40f1a0e91630f5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "21", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A cylinder of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi></math> and radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> lies on a plank of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi></math> as shown. The surface between plank and ground is smooth, and between cylinder and plank is rough. Assuming no slipping between cylinder and plank, the time period of oscillations (when displaced from equilibrium) of the system is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image12-b4017cbc-1092-4d2b-8145-3ecb37b3ab4e.png\" style=\"height: 96px; width: 250px;\" />", "image": null}, "options": [{"id": "d3ahu", "text": "<math><mn>2</mn><mi mathvariant=\"normal\">π</mi><msqrt><mfrac><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>3</mn><mi mathvariant=\"normal\">k</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "Wf96o", "text": "<mat cillations is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/103705.JPG\" style=\"width: 150px; height: 164px;\" />", "image": null}, "options": [{"id": "vaQro", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">π</mi><msqrt><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">m</mi></mrow><mi mathvariant=\"normal\">k</mi></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "anN6B", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">π</mi><msqrt><mfrac><mi mathvariant=\"normal\">m</mi><mrow><mn>2</mn><mi mathvariant=\"normal\">k</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "ktygm", "text": "<math><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>m</mi></mrow><mrow><mi>k</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "Nvpa3", "text": "<math><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>m</mi></mrow><mrow><mn>3</mn><mi>k</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/103705-1.JPG\" style=\"width: 150px; height: 162px;\" /><br /><br />When the particle of mass <math><mi mathvariant=\"normal\">m</mi></math>&nbsp;at O is pushed by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">y</mi></math> in the direction of A, the spring A will be compressed by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">y</mi></math> while spring B and C will be stretched by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">y</mi><mi mathvariant=\"normal\">′</mi><mo>=</mo><mi>ycos</mi><mn>45</mn><mo>°</mo></math>. So that the total restoring force on the mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math> along OA.<br /><br /><math><msub><mi mathvariant=\"normal\">F</mi><mi>net</mi></msub><mo>=</mo><msub><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\">A</mi></msub><mo>+</mo><msub><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\">B</mi></msub><mi>cos</mi><mn>45</mn><mo>°</mo><mo>+</mo><msub><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\">C</mi></msub><mi>cos</mi><mn>45</mn><mo>°</mo><mo>=</mo><mi>ky</mi><mo>+</mo><mn>2</mn><mi>ky</mi><mi mathvariant=\"normal\">′</mi><mi>cos</mi><mn>45</mn><mo>°</mo><mo>=</mo><mi>ky</mi><mo>+</mo><mn>2</mn><mi mathvariant=\"normal\">k</mi><mfenced separators=\"|\"><mrow><mi>ycos</mi><mn>45</mn><mo>°</mo></mrow></mfenced><mi>cos</mi><mn>45</mn><mo>°</mo><mo>=</mo><mn>2</mn><mi>ky</mi></math><br /><br />Also <math><msub><mi mathvariant=\"normal\">F</mi><mi>net</mi></msub><mo>=</mo><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">′</mi><mi mathvariant=\"normal\">y</mi></math><p><math><mo>⇒</mo><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">′</mi><mi mathvariant=\"normal\">y</mi><mo>=</mo><mn>2</mn><mi>ky</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">′</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">k</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">π</mi><msqrt><mfrac><mi mathvariant=\"normal\">m</mi><mrow><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">′</mi></mrow></mfrac></msqrt><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">π</mi><msqrt><mfrac><mi mathvariant=\"normal\">m</mi><mrow><mn>2</mn><mi mathvariant=\"normal\">k</mi></mrow></mfrac></msqrt></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634bb05f9d47d562f9", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "24", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A spring of force constant&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> has a block of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&nbsp;</mo><mi>kg</mi></math> hanging at its one end and the other end of the spring is attached to the ceiling of an elevator. The elevator is rising upwards with an acceleration of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">g</mi><mn>4</mn></mfrac></math>&nbsp;and the block is in equilibrium with respect to the elevator. When the acceleration of the elevator suddenly ceases, the block starts oscillating. What is the amplitude (in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math>) of these oscillations?", "image": null}, "options": [], "correctValue": "0.125", "solution": {"text": "When elevator is moving up, using NLM,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>−</mo><mi>mg</mi><mo>=</mo><mfrac><mi>mg</mi><mn>4</mn></mfrac><mo>⇒</mo><mi mathvariant=\"normal\">T</mi><mo>=</mo><mfrac><mrow><mn>5</mn><mi>mg</mi></mrow><mn>4</mn></mfrac></math><br />This tension elongates the spring by x,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>=</mo><mi>kx</mi><mo>⇒</mo><mtext>  </mtext><mi mathvariant=\"normal\">x</mi><mo>=</mo><mfrac><mrow><mn>5</mn><mi>mg</mi></mrow><mrow><mn>4</mn><mi mathvariant=\"normal\">k</mi></mrow></mfrac></math><br />The equilibrium position of the block is,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">x</mi><mn>0</mn></msub><mo>=</mo><mfrac><mi>mg</mi><mi mathvariant=\"normal\">k</mi></mfrac></math><br />So the amplitude is,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>=</mo><mi mathvariant=\"normal\">x</mi><mo>−</mo><msub><mi mathvariant=\"normal\">x</mi><mn>0</mn></msub><mo>=</mo><mfrac><mrow><mn>5</mn><mi>mg</mi></mrow><mrow><mn>4</mn><mi mathvariant=\"normal\">k</mi></mrow></mfrac><mo>−</mo><mfrac><mi>mg</mi><mi mathvariant=\"normal\">k</mi></mfrac><mo>=</mo><mfrac><mi>mg</mi><mn>4</mn></mfrac><mo>=</mo><mn>0</mn><mo>.125</mo><mtext>  </mtext><mi mathvariant=\"normal\">m</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634508da32e9e96e70", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "96", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The figure shows a block of mass m resting on a horizontal smooth floor at a distance <math><mi>l</mi></math> from a rigid wall. Block is pushed toward the right by a distance <math><mfrac><mrow><mn>3</mn><mi>l</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math> and released from rest. When block passes from its mean position, another block of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mn>1</mn></msub></math> is gently placed on it which sticks to it due to friction. The value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mn>1</mn></msub></math> so that the combined block just touches the left wall is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>η</mi><mn>4</mn></mfrac><mi>m</mi></math>. Find the value of <math><mi mathvariant=\"normal\">η</mi></math>.<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/4e3c6699-d22f-409c-822c-3259e1a329a4-image17.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"height: 116px; width: 250px;\" />", "image": null}, "options": [], "correctValue": "5", "solution": {"text": "When block P is released from rest from a distance <math><mfrac><mrow><mn>3</mn><mi>l</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math> toward right from mean position, this will be the amplitude of oscillation so velocity of block when passing from its mean position is given as<br /><math><mi>v</mi><mo>=</mo><mi>A</mi><mi>ω</mi><mo>=</mo><mfrac><mrow><mn>3</mn><mi>l</mi></mrow><mrow><mn>2</mn></mrow></mfrac><msqrt><mfrac><mrow><mi>k</mi></mrow><mrow><mi>m</mi></mrow></mfrac></msqrt></math><br />If mass m<sub>1</sub> is added to it and just after if velocity of combined block becomes v<sub>1</sub>, from momentum conservation, we have<br />mv = (m + m<sub>1</sub>)v<sub>1</sub><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>v</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfrac><mrow><mi>m</mi></mrow><mrow><mi>m</mi><mo>+</mo><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>⋅</mo><mfrac><mrow><mn>3</mn><mi>l</mi></mrow><mrow><mn>2</mn></mrow></mfrac><msqrt><mfrac><mrow><mi>k</mi></mrow><mrow><mi>m</mi></mrow></mfrac></msqrt></math><br />If this is the velocity of combined block at mean position, it is given as<br /><math><msub><mrow><mi>v</mi></mrow><mrow><mn>1</mn></mrow></msub><mi>&nbsp;</mi><mo>=</mo><msub><mrow><mi>A</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">ω</mi></mrow><mrow><mn>1</mn></mrow></msub></math> where <math><msub><mrow><mi>ω</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msqrt><mfrac><mrow><mi>k</mi></mrow><mrow><mi>m</mi><mo>+</mo><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></msqrt></math><br />where A<sub>1</sub> and <math><msub><mrow><mi mathvariant=\"normal\">ω</mi></mrow><mrow><mn>1</mn></mrow></msub></math> are the new amplitude and angular frequency of SHM of the block.<br />It is given that combined block just reaches the left wall.<br />Thus, the new amplitude of oscillation must be <math><mi>l</mi></math> . So, we have,<br /><math><mfrac><mrow><mi>m</mi></mrow><mrow><mi>m</mi><mo>+</mo><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>⋅</mo><mfrac><mrow><mn>3</mn><mi>l</mi></mrow><mrow><mn>2</mn></mrow></mfrac><msqrt><mfrac><mrow><mi>k</mi></mrow><mrow><mi>m</mi></mrow></mfrac></msqrt><mo>=</mo><mi>l</mi><msqrt><mfrac><mrow><mi>k</mi></mrow><mrow><mi>m</mi><mo>+</mo><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></msqrt></math><br />On solving, we get<br /><math><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mi>m</mi></math><br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>n</mi><mo>=</mo><mn>5</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86334a05f1fe5fc8338", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "106", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A block of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi>kg</mi></math> is dropped on a spring-mass system as shown in the figure. The block travels <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn></math> meters in the air before striking the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&nbsp;</mo><mi>kg</mi></math> mass. Calculate maximum compression in the spring, if both the blocks move together after the collision. Spring constant of the string <math><mi>k</mi><mo>=</mo><mn>1.25</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>6</mn></mrow></msup><mo>.</mo></math><br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ekmynxtchphbbkwcijvkprnjegwohlmevbggnxsumtrbuvliaa.png\" style=\"max-width:100%; object-fit:contain\" />", "image": null}, "options": [{"id": "J8yoo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">&#160;</mi><mi>cm</mi></math>", "image": null, "isCorrect": true}, {"id": "K2yEC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi mathvariant=\"normal\">&#xA0;</mi><mi>cm</mi></math>", "image": null, "isCorrect": false}, {"id": "4QidG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mi mathvariant=\"normal\">&#xA0;</mi><mi>cm</mi><mi mathvariant=\"normal\">&#xA0;</mi></math>", "image": null, "isCorrect": false}, {"id": "xiItv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>16</mn><mo>&#xA0;</mo><mi>cm</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The velocity of <math><mn>1</mn><mi>&#160;</mi><mi>k</mi><mi>g</mi></math> block just before striking<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi><mo>=</mo><msqrt><mn>2</mn><mo>&#215;</mo><mn>10</mn><mo>&#215;</mo><mn>100</mn></msqrt><mo>=</mo><mn>20</mn><msqrt><mn>5</mn></msqrt><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br />Applying conservation of momentum, the blocks stick after the collision and move with velocity <math><mi>v</mi></math><br /><br />Or <math><mn>1</mn><mo>&#215;</mo><mn>20</mn><msqrt><mn>5</mn></msqrt><mo>=</mo><mn>4</mn><mi>v</mi></math><br /><br />Final velocity<math><mi>&#160;</mi><mi>v</mi><mo>=</mo><mn>5</mn><msqrt><mn>5</mn></msqrt></math> ,<br /><br />Using energy conservation<br /><br /><math><mi>K</mi><mi>E</mi><mo>+</mo><mi>P</mi><mi>E</mi><mo>=</mo></math> const<br /><br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>&#215;</mo><mn>4</mn><mo>&#215;</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>5</mn><msqrt><mn>5</mn></msqrt></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>k</mi><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>3</mn><mi>g</mi></mrow><mrow><mi>k</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br /><math><mo>=</mo><mn>0</mn><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>k</mi><mo>.</mo><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br /><math><mo>&#8756;</mo><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>4</mn><mo>&#215;</mo><mn>25</mn><mo>&#215;</mo><mn>5</mn></mrow><mrow><mn>1.25</mn><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>6</mn></mrow></msup></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>30</mn><mo>&#215;</mo><mn>30</mn></mrow><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mn>1.25</mn><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>6</mn></mrow></msup></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mfrac><mn>20</mn><mn>1000</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>=</mo><mn>2</mn><mo>&#160;</mo><mi>cm</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863345de8dcc96d0942", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "25", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A uniform cylinder of length&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">L</mi></math> and mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi></math> having cross-sectional area&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> is suspended, with its length vertical from a fixed point by a massless spring such that it is half-submerged in a liquid of density&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">ρ</mi></math> at the equilibrium position. When the cylinder is given a small downward push and released it starts oscillating vertically with a small amplitude. If the force constant of the spring is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">k</mi></math>, the frequency of oscillation of the cylinder is<br />\r<br />\r<u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0007490_AnsExp2_1.jpg\" style=\"height: 220px; width: 141px;\" /></strong></u>", "image": null}, "options": [{"id": "8HMXR", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac linethickness=\"1\"><mn>1</mn><mrow><mn>2</mn><mi mathvariant=\"normal\">π</mi></mrow></mfrac><msup><mrow><mo>(</mo><mfrac linethickness=\"1\"><mrow><mi mathvariant=\"normal\">k</mi><mo>-</mo><mi>Aρg</mi></mrow><mi mathvariant=\"normal\">M</mi></mfrac><mo>)</mo></mrow><mrow><mn>1</mn><mo>/</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "WWGgy", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mrow><mn>2</mn><mi>&#960;</mi></mrow></mfrac><msup><mfenced><mfrac><mrow><mtext>k</mtext><mo>+</mo><mtext>A</mtext><mi>&#961;</mi><mtext>g</mtext></mrow><mtext>M</mtext></mfrac></mfenced><mrow><mn>1</mn><mo>/</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "9eacN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac linethickness=\"1\"><mn>1</mn><mrow><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi></mrow></mfrac><msup><mrow><mo>(</mo><mfrac linethickness=\"1\"><mrow><mi mathvariant=\"normal\">k</mi><mo>+</mo><msup><mi>&#961;gL</mi><mn>2</mn></msup></mrow><mi mathvariant=\"normal\">M</mi></mfrac><mo>)</mo></mrow><mrow><mn>1</mn><mo>/</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "yMmy6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac linethickness=\"1\"><mn>1</mn><mrow><mn>2</mn><mi mathvariant=\"normal\">π</mi></mrow></mfrac><msup><mrow><mo>(</mo><mfrac linethickness=\"1\"><mrow><mi mathvariant=\"normal\">k</mi><mo>+</mo><mi>Aρg</mi></mrow><mi>Aρg</mi></mfrac><mo>)</mo></mrow><mrow><mn>1</mn><mo>/</mo><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When cylinder is displaced by an amount x from its meanposition, spring force and upthrust both will increase. Hence,<br />Net restoring force = extra spring force + extra upthrust &nbsp;<br /><br />Or&nbsp;&nbsp; <math><mrow> <mtext>F</mtext> <mo>=</mo> <mo>-</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>kx</mtext> <mo>+</mo> <mtext>Ax</mtext> <mi>ρ</mi> <mtext>g</mtext> </mrow> </mfenced> </mrow> </math><br />&nbsp;<br />Or <math> <mrow> <mtext>a</mtext> <mo>=</mo> <mo>-</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>k</mtext> <mo>+</mo> <mi>ρ</mi> <mtext>Ag</mtext> </mrow> <mrow> <mtext>M</mtext> </mrow> </mfrac> </mrow> </mfenced> <mtext>x</mtext> </mrow> </math><br /><br />Now,&nbsp;<math> <mrow> <mtext>f</mtext> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> <msqrt> <mfenced close=\"|\" open=\"|\" separators=\",\"> <mrow> <mfrac> <mrow> <mtext>a</mtext> </mrow> <mrow> <mtext>x</mtext> </mrow> </mfrac> </mrow> </mfenced> </msqrt> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math><mrow> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>2</mn> <mi>π</mi> </mrow> </mfrac> <msqrt> <mfrac> <mrow> <mtext>k</mtext> <mo>+</mo> <mi>ρ</mi> <mtext>Ag</mtext> </mrow> <mrow> <mtext>M</mtext> </mrow> </mfrac> </msqrt> </mrow> </math><br /><br /><u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0007490_AnsExp2_1.jpg\" /></strong></u>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633001e37988e4bd62", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "95", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Time period of a spring-mass system is <math><mi>T</mi></math>. If this spring is cut into two parts whose lengths are in the ratio 1:3 and the same mass is attached to the longer part, the new time period will be", "image": null}, "options": [{"id": "kqRy5", "text": "<math><msqrt><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></msqrt><mi> </mi><mi>T</mi></math>", "image": null, "isCorrect": false}, {"id": "GSTvV", "text": "<math><mfrac><mrow><mi>T</mi></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "RW5LP", "text": "<math><mfrac><mrow><msqrt><mn>3</mn></msqrt><mi>T</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "uoRb8", "text": "<math><msqrt><mn>3</mn></msqrt><mi>T</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <mtext>T</mtext> <mo>=</mo> <mn>2</mn> <mi>&#960;</mi> <msqrt> <mfrac> <mrow> <mtext>m</mtext> </mrow> <mrow> <mtext>k</mtext> </mrow> </mfrac> </msqrt> </mrow> </math><br /><br />When spring is cut in the ratio 1 : 3, the force constant of the longer part is <math> <mrow> <mfrac> <mrow> <mn>4</mn> <mtext>k</mtext> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> </mrow> </math>.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;&#160;&#160;&#160;</mo><mtext>T'</mtext><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><mrow><mn>3</mn><mtext>m</mtext></mrow><mrow><mn>4</mn><mtext>k</mtext></mrow></mfrac></msqrt><mo>=</mo><mfrac><msqrt><mn>3</mn></msqrt><mn>2</mn></mfrac><mtext>T</mtext></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632e599d2e9e7ae6d0", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "76", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "&nbsp;The mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> shown in figure oscillates in simple harmonic motion with amplitude <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>. The amplitude of the point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> is &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<br />\r&nbsp;<br />\r<img alt=\"\" height=\"66\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0007503_Ques1_1.jpg\" style=\"max-width:100%; object-fit:contain\" width=\"294\" />", "image": null}, "options": [{"id": "pb4Eh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>k</mi><mn>1</mn></msub><mi>A</mi></mrow><msub><mi>k</mi><mn>2</mn></msub></mfrac></math>", "image": null, "isCorrect": false}, {"id": "YVovr", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>k</mi><mn>2</mn></msub><mi>A</mi></mrow><mrow><msub><mi>k</mi><mn>2</mn></msub><mo>-</mo><msub><mi>k</mi><mn>1</mn></msub></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "HMnHu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>k</mi><mn>2</mn></msub><mi>A</mi></mrow><mrow><msub><mi>k</mi><mn>1</mn></msub><mo>+</mo><msub><mi>k</mi><mn>2</mn></msub></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "m0Dj8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>k</mi><mn>2</mn></msub><mi>A</mi></mrow><msub><mi>k</mi><mn>1</mn></msub></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If a force&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi></math> is applied to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math>, say to the right, let A be the distance moved by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math>. If the system is released, it executes simple harmonic motion of amplitude <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>A</mi><mn>1</mn></msub></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>A</mi><mn>2</mn></msub></math> ae the extensions in springs <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>k</mi><mn>1</mn></msub></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>k</mi><mn>2</mn></msub></math>&nbsp;then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mo>(</mo><msub><mi>A</mi><mn>1</mn></msub><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><msub><mi>A</mi><mn>2</mn></msub><mo>)</mo></math> and<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><msub><mi>k</mi><mn>1</mn></msub><msub><mi>A</mi><mn>1</mn></msub><mo>=</mo><msub><mi>k</mi><mn>2</mn></msub><msub><mi>A</mi><mn>2</mn></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;&#160;&#160;&#160;&#160;&#160;&#160;</mo><msub><mi>A</mi><mn>1</mn></msub><mo>=</mo><mfrac><mi>F</mi><msub><mi>k</mi><mn>1</mn></msub></mfrac><msub><mtext>&#160;&#160;&#160;&#160;and&#160;&#160;&#160;&#160;A</mtext><mn>2</mn></msub><mo>=</mo><mfrac><mi>F</mi><msub><mi>k</mi><mn>2</mn></msub></mfrac></math>&nbsp;<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</mo><mi>A</mi><mo>=</mo><msub><mi>A</mi><mn>1</mn></msub><mo>+</mo><msub><mi>A</mi><mn>2</mn></msub><mo>=</mo><mi>F</mi><mfenced><mrow><mfrac><mn>1</mn><msub><mi>k</mi><mn>1</mn></msub></mfrac><mo>+</mo><mfrac><mn>1</mn><msub><mi>k</mi><mn>2</mn></msub></mfrac></mrow></mfenced></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mi>F</mi><mfenced><mrow><msub><mi>k</mi><mn>1</mn></msub><mo>+</mo><msub><mi>k</mi><mn>2</mn></msub></mrow></mfenced></mrow><mrow><msub><mi>k</mi><mn>1</mn></msub><msub><mi>k</mi><mn>2</mn></msub></mrow></mfrac></math><br /><br />&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;&#160;&#160;</mo><mi>F</mi><mo>=</mo><mfrac><mrow><msub><mi>k</mi><mn>1</mn></msub><msub><mi>k</mi><mn>2</mn></msub><mi>A</mi></mrow><mfenced><mrow><msub><mi>k</mi><mn>1</mn></msub><mo>+</mo><msub><mi>k</mi><mn>2</mn></msub></mrow></mfenced></mfrac></math><br /><br />The amplitude of point P = amplitude of oscillation of spring k<sub>1</sub> which is<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>A</mi><mn>1</mn></msub><mo>=</mo><mfrac><mi>F</mi><msub><mi>k</mi><mn>1</mn></msub></mfrac><mo>=</mo><mfrac><mrow><msub><mi>k</mi><mn>2</mn></msub><mi>A</mi></mrow><mfenced><mrow><msub><mi>k</mi><mn>1</mn></msub><mo>+</mo><msub><mi>k</mi><mn>2</mn></msub></mrow></mfenced></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631fc613577804d060", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "89", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A mass <math><mi>M</mi></math> is suspended from a spring of negligible mass. The spring is pulled a little and then released so that the mass executes SHM of time period <math><mi>T</mi></math>. If the mass is increased by <math><mi>m</mi></math>, the time period become <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>5</mn><mi>T</mi></mrow><mn>3</mn></mfrac></math>. Then the ratio of <math><mfrac><mrow><mi>m</mi></mrow><mrow><mi>M</mi></mrow></mfrac></math> is", "image": null}, "options": [{"id": "MTjUJ", "text": "<math><mrow><mrow><mn>3</mn></mrow><mo>/</mo><mrow><mn>5</mn></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "bKkEX", "text": "<math><mrow><mrow><mn>25</mn></mrow><mo>/</mo><mrow><mn>9</mn></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "JfHPu", "text": "<math><mrow><mrow><mn>16</mn></mrow><mo>/</mo><mrow><mn>9</mn></mrow></mrow></math>", "image": null, "isCorrect": true}, {"id": "Bmxuh", "text": "<math><mrow><mrow><mn>5</mn></mrow><mo>/</mo><mrow><mn>3</mn></mrow></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>M</mi></mrow><mrow><mi>k</mi></mrow></mfrac></msqrt></math> when mass is increased by <math><mi>m</mi></math> then                               ...(i)<br/><br/>                          <math><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>M</mi><mo>+</mo><mi>m</mi></mrow><mrow><mi>k</mi></mrow></mfrac></msqrt></math><br/><br/><math><mo>⇒</mo></math>                          <math><mfrac><mrow><mn>5</mn><mi>T</mi></mrow><mrow><mn>3</mn></mrow></mfrac><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>M</mi><mo>+</mo><mi>m</mi></mrow><mrow><mi>k</mi></mrow></mfrac></msqrt></math>                                                               ...(ii)<br/><br/>Dividing Eq. (i) by Eq. (ii), we get<br/><br/>                               <math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mo>=</mo><msqrt><mfrac><mrow><mi>M</mi></mrow><mrow><mi>M</mi><mo>+</mo><mi>m</mi></mrow></mfrac></msqrt></math><br/><br/>                               <math><mfrac><mrow><mn>9</mn></mrow><mrow><mn>25</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>M</mi></mrow><mrow><mi>M</mi><mo>+</mo><mi>m</mi></mrow></mfrac></math><br/><br/><math><mo>⇒</mo></math>             <math><mn>9</mn><mi>M</mi><mo>+</mo><mn>9</mn><mi>m</mi><mo>=</mo><mn>25</mn><mi>M</mi></math><br/><br/><math><mo>⇒</mo></math>                       <math><mn>16</mn><mi>M</mi><mo>=</mo><mn>9</mn><mi>m</mi></math><br/><br/>                                 <math><mfrac><mrow><mi>m</mi></mrow><mrow><mi>M</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>16</mn></mrow><mrow><mn>9</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631cece64c7dd641ca", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "56", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A cylinder of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><mo>=</mo><mn>2</mn><mo>&nbsp;</mo><mi>kg&nbsp;</mi></math>and radius&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>12</mn><mo>&nbsp;</mo><mi>cm</mi></math> lies on a plank of the same mass as shown in the figure. The surface between plank and ground is smooth but there is friction between cylinder and plank. If the coefficient of friction between the cylinder and the plank is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>μ</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>4</mn></math>, then what maximum initial compression (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>cm</mi></math>) can be given to the spring such that the cylinder moves without slipping with respect to the plank? [Given,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi><mo>=</mo><mn>200</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>]<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image12-b4017cbc-1092-4d2b-8145-3ecb37b3ab4e.png\" style=\"height: 96px; width: 250px;\" />", "image": null}, "options": [], "correctValue": "16", "solution": {"text": "<p>Using no Slipping condition:<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image13-95128195-ed98-4a82-a850-9c4a65989d0e.jpg\" style=\"height: 127px; width: 250px;\" /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">c</mi></msub><mo>+</mo><mi>&#945;R</mi><mo>=</mo><msub><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">p</mi></msub></math><br /><br /><math><mfrac><mrow><mi mathvariant=\"normal\">f</mi></mrow><mrow><mi mathvariant=\"normal\">M</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">R</mi></mrow><mrow><mi mathvariant=\"normal\">M</mi><msup><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mi mathvariant=\"normal\">R</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">x</mi><mo>-</mo><mi mathvariant=\"normal\">f</mi></mrow><mrow><mi mathvariant=\"normal\">M</mi></mrow></mfrac></math><br /><br /><math><mo>&#8658;</mo><mn>4</mn><mi mathvariant=\"normal\">f</mi><mo>=</mo><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">x</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">x</mi><mi>max</mi></msub><mo>=</mo><mfrac><mrow><mn>4</mn><mi>&#956;Mg</mi></mrow><mi mathvariant=\"normal\">k</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi mathvariant=\"normal\">x</mi><mi>max</mi></msub><mo>=</mo><mfrac><mrow><mn>4</mn><mo>&#215;</mo><mn>0</mn><mo>.</mo><mn>4</mn><mo>&#215;</mo><mn>2</mn><mo>&#215;</mo><mn>10</mn></mrow><mn>200</mn></mfrac><mo>=</mo><mn>0</mn><mo>.</mo><mn>16</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>=</mo><mn>16</mn><mo>&#160;</mo><mi>cm</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631c73a54ec17df11a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "07", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two simple pendulums of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>&nbsp;are given small displacements in the same direction at the same time. The minimum number of oscillations, the shorter pendulum has completed, when the phase difference between them becomes zero again, is", "image": null}, "options": [{"id": "xt257", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>", "image": null, "isCorrect": false}, {"id": "MiKIS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>", "image": null, "isCorrect": false}, {"id": "mqcVz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>", "image": null, "isCorrect": true}, {"id": "CHFxK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math><msub><mrow><mi>N</mi></mrow><mrow><mi>S</mi></mrow></msub></math> = Number of oscillations made by shorter length pendulum with time period <math><msub><mrow><mi>T</mi></mrow><mrow><mi>S</mi></mrow></msub></math>.<br /><br /><math><msub><mrow><mi>N</mi></mrow><mrow><mi>L</mi></mrow></msub></math> = Number of oscillations made by longer length pendulum with time period <math><msub><mrow><mi>T</mi></mrow><mrow><mi>L</mi></mrow></msub></math>.</p><p>If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi></math>&nbsp;is the time after which the pendulums are back in sync, then<br /><br />Then <math><mi>t</mi><mo>=</mo><msub><mrow><mi>N</mi></mrow><mrow><mi>S</mi></mrow></msub><msub><mrow><mi>T</mi></mrow><mrow><mi>S</mi></mrow></msub><mo>=</mo><msub><mrow><mi>N</mi></mrow><mrow><mi>L</mi></mrow></msub><msub><mrow><mi>T</mi></mrow><mrow><mi>L</mi></mrow></msub></math><br /><br /><math><mo>&#8658;</mo></math> <math><msub><mrow><mi>N</mi></mrow><mrow><mi>S</mi></mrow></msub><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><mrow><mn>5</mn></mrow><mrow><mi>g</mi></mrow></mfrac></msqrt><mo>=</mo><msub><mrow><mi>N</mi></mrow><mrow><mi>L</mi></mrow></msub><mo>&#215;</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><mrow><mn>20</mn></mrow><mrow><mi>g</mi></mrow></mfrac></msqrt></math> <math><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mo>&#8757;</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#160;</mi><mi>T</mi><mo>=</mo><mn>2</mn><mi>&#960;</mi><msqrt><mfrac><mrow><mi mathvariant=\"script\">l</mi></mrow><mrow><mi>g</mi></mrow></mfrac></msqrt></mrow></mfenced></math><br /><br /><math><mo>&#8658;</mo><msub><mrow><mi>N</mi></mrow><mrow><mi>S</mi></mrow></msub><mo>=</mo><mn>2</mn><msub><mrow><mi>N</mi></mrow><mrow><mi>L</mi></mrow></msub></math> i.e. if <math><mo>&#8658;</mo><msub><mrow><mi>N</mi></mrow><mrow><mi>L</mi></mrow></msub><mo>=</mo><mn>1</mn></math> <math><msub><mrow><mi>N</mi></mrow><mrow><mi>S</mi></mrow></msub><mo>=</mo><mn>2</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631a7d3610adb63eae", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "69", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two identical springs (spring constant =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi></math>) are connected to two light rigid rods in parallel combination and then a third spring (identical to the other two) is connected to this combination in series. The combined system is fixed to the ceiling and a block of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>&nbsp;is attached as shown in the figure. If the mass is slightly displaced and then let go, then the system shall oscillate with a time period of<br />\r<br />\r<img height=\"187\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/mapmcmwwumaczgnltvxiloczzlvmwmhsbsymzfhidhnzxtpnga.jpeg\" width=\"195\" />", "image": null}, "options": [{"id": "Q3FGg", "text": "<math><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>m</mi></mrow><mrow><mn>3</mn><mi>k</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "ty2fL", "text": "<math><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mn>3</mn><mi>m</mi></mrow><mrow><mn>2</mn><mi>k</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": true}, {"id": "b0LnB", "text": "<math><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mn>2</mn><mi>m</mi></mrow><mrow><mn>3</mn><mi>k</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}, {"id": "4Fu4c", "text": "<math><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mn>3</mn><mi>k</mi></mrow><mrow><mi>m</mi></mrow></mfrac></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Consider the system as shown in figure below.<br/><br/> <img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/wgaslkgdeufiitvkvrlyycltlfsffibivwhzxtkcehlpyubhxb.jpeg\"/> <br/><br/>Here, <math><msub><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msub></math>  and  <math><msub><mrow><mi>k</mi></mrow><mrow><mn>3</mn></mrow></msub></math>  are in parallel.  <math><msub><mrow><mi>k</mi></mrow><mrow><mn>1</mn></mrow></msub></math>  is in series with parallel combination of  <math><msub><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msub></math>  and  <math><msub><mrow><mi>k</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>.</mo></math> <br/><br/>Effective spring constant of the combination is <br/><br/> <math><msub><mrow><mi>k</mi></mrow><mrow><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">f</mi></mrow></msub><mo>=</mo><mfrac><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><msub><mrow><mi>k</mi></mrow><mrow><mn>3</mn></mrow></msub></mrow></mfenced><msub><mrow><mi>k</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi>k</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><msub><mrow><mi>k</mi></mrow><mrow><mn>3</mn></mrow></msub></mrow></mfrac></math> <br/><br/> <math><mo>=</mo><mfrac><mrow><mn>2</mn><mi>k</mi><mo>×</mo><mi>k</mi></mrow><mrow><mn>3</mn><mi>k</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi>k</mi></math> <br/><br/> <math><mo>∴</mo></math>  Time period of oscillation<br/><br/> <math><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>m</mi></mrow><mrow><msub><mrow><mi>k</mi></mrow><mrow><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">f</mi></mrow></msub></mrow></mfrac></msqrt></math> <br/><br/> <math><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mi>m</mi></mrow><mrow><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi>k</mi></mrow></mfrac></msqrt></math> <br/><br/> <math><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mrow><mn>3</mn><mi>m</mi></mrow><mrow><mn>2</mn><mi>k</mi></mrow></mfrac></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863195b958de53f1235", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "46", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Infinite springs with force constants <math><mi>k</mi><mo>,</mo><mn>2</mn><mi>k</mi><mo>,</mo><mn>4</mn><mi>k</mi><mi>&nbsp;</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">d</mi><mi>&nbsp;</mi><mn>8</mn><mi>k</mi><mo>…</mo><mo>.</mo><mo>.</mo></math> respectively are connected in series. The effective force constant of the spring will be", "image": null}, "options": [{"id": "9fjao", "text": "<math><mn>2</mn><mi>k</mi></math>", "image": null, "isCorrect": false}, {"id": "JWXXd", "text": "<math><mi>k</mi></math>", "image": null, "isCorrect": false}, {"id": "iMj5S", "text": "<math><mrow><mrow><mi>k</mi></mrow><mo>/</mo><mrow><mn>2</mn></mrow></mrow></math>", "image": null, "isCorrect": true}, {"id": "kPazw", "text": "<math><mrow><mrow><mi>k</mi></mrow><mo>/</mo><mrow><mn>4</mn></mrow></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Effective force constant is equal to the reciprocal of the sum of individual force constant, hence<br/><br/>                  <math><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>k</mi></mrow><mrow><mi>e</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>k</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>k</mi></mrow><mrow><mn>3</mn></mrow></msub></mrow></mfrac><mo>+</mo><mo>…</mo></math><br/><br/>Given,      <math><msub><mrow><mi>k</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mi>k</mi><mo>,</mo><mi> </mi><msub><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>2</mn><mi>k</mi><mo>,</mo><mi> </mi><msub><mrow><mi>k</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>=</mo><mn>3</mn><mi>k</mi><mo>,</mo><mo>…</mo><mo>.</mo><mo>.</mo></math><br/><br/><math><mo>∴</mo></math>              <math><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>k</mi></mrow><mrow><mi>e</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>k</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><mi>k</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn><mi>k</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>8</mn><mi>k</mi></mrow></mfrac><mo>+</mo><mo>…</mo></math><br/><br/>The given series a geometric progression series, hence sum is<br/><br/>                <math><msub><mrow><mi>S</mi></mrow><mrow><mi>∞</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>a</mi></mrow><mrow><mn>1</mn><mo>-</mo><mi>r</mi></mrow></mfrac></math><br/><br/>where <math><mi>a</mi></math> is first term of series and <math><mi>r</mi></math> the common difference.<br/><br/><math><mo>⇒</mo></math>           <math><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>k</mi></mrow><mrow><mi>e</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>k</mi></mrow></mfrac><mo>×</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mi>k</mi></mrow></mfrac><mo>⇒</mo><msub><mrow><mi>k</mi></mrow><mrow><mi>e</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86318ee50b36eac6cc2", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "27", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A block of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mi>kg</mi></math>&nbsp;is connected with a smooth plank of the same mass is performing oscillations. The value of the spring constant is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">N</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. The block and the plank are free to move and there is no friction anywhere. The angular frequency of the oscillation is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">ω</mi><mo>&nbsp;</mo><mi>rad</mi><mo>&nbsp;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. Find the value of <math><mi mathvariant=\"normal\">ω</mi></math>.", "image": null}, "options": [], "correctValue": "20", "solution": {"text": "<p>Using the concept of reduced mass, we obtain:-<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#969;</mi><mo>=</mo><msqrt><mfrac><mi mathvariant=\"normal\">k</mi><msub><mi mathvariant=\"normal\">m</mi><mi>reduced</mi></msub></mfrac></msqrt><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">k</mi></mrow><mi mathvariant=\"normal\">m</mi></mfrac></msqrt><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mfenced><mrow><mo>&#8757;</mo><msub><mi mathvariant=\"normal\">m</mi><mi>reduced</mi></msub><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">m</mi><mo>&#215;</mo><mi mathvariant=\"normal\">m</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mo>+</mo><mi mathvariant=\"normal\">m</mi></mrow></mfrac><mo>=</mo><mfrac><mi mathvariant=\"normal\">m</mi><mn>2</mn></mfrac></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">&#969;</mi><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mo>&#215;</mo><mn>200</mn></mrow><mn>1</mn></mfrac></msqrt><mo>=</mo><mn>20</mn><mo>&#160;</mo><mi>rad</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>&nbsp;</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631899f3b7bc1ccf44", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "13", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Friction is absent everywhere and the threads, spring and pulleys are massless. If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mi mathvariant=\"normal\">A</mi></msub><mo>=</mo><msub><mi>m</mi><mi mathvariant=\"normal\">B</mi></msub><mo>=</mo><mi>m</mi></math>, then the angular frequency of the system for small oscillations will be<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0629487.jpg\" style=\"width: 250px; height: 165px;\" />", "image": null}, "options": [{"id": "hE2SW", "text": "<math><mrow><msqrt><mfrac><mrow><mtext>2k</mtext> </mrow> <mrow> <mtext>4m</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "Vn6X0", "text": "<math> <mrow> <msqrt> <mfrac> <mrow> <mtext>4k</mtext> </mrow> <mrow> <mtext>5m</mtext> </mrow> </mfrac> </msqrt> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "PQcoQ", "tex ll}, {"_id": "6151e863175dc73018c23979", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "67", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mn>1</mn></msub><mo>=</mo><mn>1</mn><mo>&nbsp;</mo><mi>kg</mi></math> connected to a horizontal spring performs S.H.M. with amplitude <math><mi>A</mi></math>.&nbsp;While mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mn>1</mn></msub></math>&nbsp;is passing through mean position another mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mn>2</mn></msub><mo>=</mo><mn>3</mn><mo>&nbsp;</mo><mi>kg</mi></math> is placed on it so that both the masses move together with amplitude <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>A</mi><mn>1</mn></msub></math>. The ratio of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>A</mi><mn>1</mn></msub><mi>A</mi></mfrac></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mfrac><mi>p</mi><mi>q</mi></mfrac></mfenced><mfrac bevelled=\"true\"><mn>1</mn><mn>2</mn></mfrac></msup></math>, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi></math>&nbsp;are the smallest integers. Then what is the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>+</mo><mi>q</mi></math>?", "image": null}, "options": [], "correctValue": "5", "solution": {"text": "P.E of the oscillating mass is given by<br /><br />&nbsp; <math> <mrow> <mi>E</mi><mo>=</mo><mfrac> <mn>1</mn> <mn>2</mn> </mfrac> <mi>m</mi><mi>ω</mi><msup> <mi>x</mi> <mn>2</mn> </msup> <mo>=</mo><mfrac> <mn>1</mn> <mn>2</mn> </mfrac> <mi>k<
