ight] \\\\ & =\\left[\\mathrm{MLT}^{-2} \\mathrm{~A}^{-2}\\right]\\end{aligned}$", "image": null}, "videoSolution": null, "questionStructure": ["MATCH_THE_LIST"], "syllabusCategory": "noChange", "previousYear": {"_id": "664466ee278297dee60eda6c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2024 (06 Apr Shift 1)", "title": "JEE Main 2024 (06 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66446720970e6e9ab542d073", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "664466ee278297dee60eda6b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-05T14:00:00.000Z", "isVisible": true, "shortName": "2024 (05 Apr Shift 2)", "title": "JEE Main 2024 (05 Apr Shift 2)"}], "question": {"text": "What is the dimensional formula of $a b^{-1}$ in the equation $\\left(\\mathrm{P}+\\frac{\\mathrm{a}}{\\mathrm{V}^2}\\right)(\\mathrm{V}-\\mathrm{b})=\\mathrm{RT}$, where letters have their usual meaning.", "image": null}, "options": [{"id": "K1HDI", "text": "$\\left[\\mathrm{M}^{-1} \\mathrm{~L}^5 \\mathrm{~T}^3\\right]$", "image": null, "isCorrect": false}, {"id": "A7YDt", "text": "$\\left[\\mathrm{M}^6 \\mathrm{~L}^7 \\mathrm{~T}^4\\right]$", "image": null, "isCorrect": false}, {"id": "3e7Pc", "text": "$\\left[\\mathrm{ML}^2 \\mathrm{~T}^{-2}\\right]$", "image": null, "isCorrect": true}, {"id": "ipCfd", "text": "$\\left[\\mathrm{M}^0 \\mathrm{~L}^3 \\mathrm{~T}^{-2}\\right]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\because[\\mathrm{V}]=[\\mathrm{b}]$\n$\\therefore$ Dimension of $b=\\left[\\mathrm{L}^3\\right]$\n$\\begin{aligned}\n& \\&[\\mathrm{P}]=\\left[\\frac{\\mathrm{a}}{\\mathrm{V}^2}\\right] \\\\\n& {[\\mathrm{a}]=\\left[\\mathrm{PV}^2\\right]=\\left[\\mathrm{ML}^{-1} \\mathrm{~T}^{-2}\\right]\\left[\\mathrm{L}^6\\right]}\n\\end{aligned}$\nDimension of $\\mathrm{a}=\\left[\\mathrm{ML}^5 \\mathrm{~T}^{-2}\\right]$\n$\\therefore \\mathrm{ab}^{-1}=\\frac{\\left[\\mathrm{ML}^5 \\mathrm{~T}^{-2}\\right]}{\\left[\\mathrm{L}^3\\right]}=\\left[\\mathrm{ML}^2 \\mathrm{~T}^{-2}\\right]$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ee278297dee60eda6b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-05T14:00:00.000Z", "isVisible": true, "shortName": "2024 (05 Apr Shift 2)", "title": "JEE Main 2024 (05 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66446715970e6e9ab542d00b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "664466ee278297dee60eda6a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-05T09:00:00.000Z", "isVisible": true, "shortName": "2024 (05 Apr Shift 1)", "title": "JEE Main 2024 (05 Apr Shift 1)"}], "question": {"text": "If $\\mathrm{G}$ be the gravitational constant and $\\mathrm{u}$ be the energy density then which of the following quantity have the dimensions as that of the $\\sqrt{\\mathrm{uG}}$ :", "image": null}, "options": [{"id": "XwFfJ", "text": "pressure gradient per unit mass", "image": null, "isCorrect": false}, {"id": "Mxdgb", "text": "Gravitational potential", "image": null, "isCorrect": false}, {"id": "BXqiJ", "text": "Energy per unit mass", "image": null, "isCorrect": false}, {"id": "J0Qbp", "text": "Force per unit mass", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n& {[\\mathrm{uG}]=\\left[\\left(\\mathrm{M}^1 \\mathrm{~L}^{-1} \\mathrm{~T}^{-2}\\right)\\left(\\mathrm{M}^{-1} \\mathrm{~L}^3 \\mathrm{~T}^{-2}\\right)\\right]} \\\\\n& {[\\mathrm{uG}]=\\left[\\mathrm{M}^0 \\mathrm{~L}^2 \\mathrm{~T}^{-4}\\right]} \\\\\n& {[\\sqrt{\\mathrm{uG}}]=\\left[\\mathrm{L}^1 \\mathrm{~T}^{-2}\\right]}\n\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "91889c261f1840eeb591c36eced272fb", "provider": "vdo \\mathrm{T}^2\\right]=\\frac{\\left[\\mathrm{L}^3\\right]}{\\left[\\mathrm{M}^{-1} \\mathrm{~L}^3 \\mathrm{~T}^{-2}\\right][\\mathrm{M}]}}\n\\end{aligned}$\n(Dimension of $\\mathrm{G}$ is $\\left[\\mathrm{M}^{-1} \\mathrm{~L}^3 \\mathrm{~T}^{-2}\\right]$ )\n$\\left[\\mathrm{T}^2\\right]=\\frac{\\left[\\mathrm{L}^3\\right]}{\\left[\\mathrm{L}^3 \\mathrm{~T}^{-2}\\right]}=\\left[\\mathrm{T}^2\\right]$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ee278297dee60eda69", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 Apr Shift 2)", "title": "JEE Main 2024 (04 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66446702970e6e9ab542cf5f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "664466ee278297dee60eda68", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 Apr Shift 1)", "title": "JEE Main 2024 (04 Apr Shift 1)"}], "question": {"text": "The equation of stationary wave is :\n$y=2 a \\sin \\left(\\frac{2 \\pi n t}{\\lambda}\\right) \\cos \\left(\\frac{2 \\pi x}{\\lambda}\\right) \\text {. }$\nWhich of the following is NOT correct :", "image": null}, "options": [{"id": "ed7Du", "text": "The dimensions of $n / \\lambda$ is [T]", "image": null, "isCorrect": true}, {"id": "AWHqO", "text": "The dimensions of $\\mathrm{n}$ is $\\left[\\mathrm{LT}^{-1}\\right]$", "image": null, "isCorrect": false}, {"id": "t6Lks", "text": "The dimensions of $x$ is [L]", "image": null, "isCorrect": false}, {"id": "86YbQ", "text": "The dimensions of $\\mathrm{nt}$ is [L]", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Comparing the given equation with standard equation of standing $\\frac{2 \\pi n}{\\lambda}=\\omega \\& \\frac{2 \\pi}{\\lambda}=k$\n$\\begin{aligned}\n& {\\left[\\frac{\\mathrm{n}}{\\lambda}\\right]=[\\omega]=\\mathrm{T}^{-1}} \\\\\n& {[\\mathrm{nt}]=[\\lambda]=\\mathrm{L}} \\\\\n& {[\\mathrm{n}]=[\\lambda \\omega]=\\mathrm{LT}^{-1}} \\\\\n& {[\\mathrm{x}]=[\\lambda]=\\mathrm{L}}\n\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "938ecdc94b264fe48fd515b6c9b3df8b", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/XhUPFd6ikw25h.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/XhUPFd6ikw25h.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ee278297dee60eda68", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 Apr Shift 1)", "title": "JEE Main 2024 (04 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd61ba0e94a3c4025c48", "type": "singleCorrect", "level": 1, "questionLabels": [], "question": {"text": "The dimensional formula of angular impulse is :", "image": null}, "options": [{"id": "ERDCU", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>[</mo><mi mathvariant=\"normal\">M</mi><mo> </mo><msup><mi mathvariant=\"normal\">L</mi><mrow><mo>–</mo><mn>2</mn></mrow></msup><msup><mi mathvariant=\"normal\">T</mi><mrow><mo> </mo><mo>–</mo><mn>1</mn></mrow></msup><mo>]</mo></math>", "image": null, "isCorrect": false}, {"id": "sg4Oc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>[</mo><mi mathvariant=\"normal\">M</mi><mo> </mo><msup><mi mathvariant=\"normal\">L</mi><mn>2</mn></msup><mo> </mo><mi mathvariant=\"normal\">T</mi><msup><mo> </mo><mrow><mo>–</mo><mn>2</mn></mrow></msup><mo> </mo><mo>]</mo></math>", "image": null, "isCorrect": false}, {"id": "wDvjE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>[</mo><mi mathvariant=\"normal\">M</mi><mo> </mo><mi mathvariant=\"normal\">L</mi><mo> </mo><mi mathvariant=\"normal\">T</mi><msup><mo> </mo><mrow><mo>–</mo><mn>1</mn></mrow></msup><mo>]</mo></math>", "image": null, "isCorrect": false}, {"id": "1LnhU", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>[</mo><mi mathvariant=\"normal\">M</mi><mo> </mo><msup><mi mathvariant=\"normal\">L</mi><mn>2</mn></msup><mo> </mo><mi mathvariant=\"normal\">T</mi><msup><mo> </mo><mrow><mo>–</mo><mn>1</mn></mrow></msup><mo> </mo><mo>]</mo></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>Angular impulse = change in angular momentum.</p><p>[Angular impulse] = [Angular momentum] <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>[</mo><mi>m</mi><mi>v</mi><mi>r</mi><mo>]</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>[</mo><mi mathvariant=\"normal\">M</mi><mo> </mo><msup><mi mathvariant=\"normal\">L</mi><mn>2</mn></msup><mo> </mo><mi mathvariant=\"normal\">T</mi><msup><mo> </mo><mrow><mo>–</mo><mn>1</mn></mrow></msup><mo> </mo><mo>]</mo></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb06", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-02-01T09:00:00.000Z", "isVisible": true, "shortName": "2024 (01 Feb Shift 1)", "title": "JEE Main 2024 (01 Feb Shift 1)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb06", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-02-01T09:00:00.000Z", "isVisible": true, "shortName": "2024 (01 Feb Shift 1)", "title": "JEE Main 2024 (01 Feb Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd62ba0e94a3c4025c4d", "type": "singleCorrect", "level": 1, "questionLabels": [], "question": {"text": "Consider two physical quantities <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> related to each other as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mo>=</mo><mfrac><mrow><mi>B</mi><mo>−</mo><msup><mi>x</mi><mn>2</mn></msup></mrow><mrow><mi>A</mi><mi>t</mi></mrow></mfrac></math> where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mo>,</mo><mo> </mo><mi>x</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi></math> have dimensions of energy, length and time respectively. The dimension of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math> is", "image": null}, "options": [{"id": "xRMCL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>L</mi><mrow><mo>−</mo><mn>2</mn></mrow></msup><msup><mi>M</mi><mn>1</mn></msup><msup><mi>T</mi><mn>0</mn></msup></math>", "image": null, "isCorrect": false}, {"id": "9FK3D", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>L</mi><mn>2</mn></msup><msup><mi>M</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi>T</mi><mn>1</mn></msup></math>", "image": null, "isCorrect": true}, {"id": "NM8vT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>L</mi><mrow><mo>−</mo><mn>2</mn></mrow></msup><msup><mi>M</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi>T</mi><mn>1</mn></msup></math>", "image": null, "isCorrect": false}, {"id": "F9u3V", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>L</mi><mn>0</mn></msup><msup><mi>M</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi>T</mi><mn>1</mn></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>From the dimensional checking of the equation, we can say the dimensions of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mi>B</mi></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\"><msup><mi>x</mi><mn>2</mn></msup></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\"><msup><mi>L</mi><mn>2</mn></msup></mfenced></math></p><p>And dimensions of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mi>A</mi></mfenced><mo>=</mo><mfrac><mfenced close=\"]\" open=\"[\"><msup><mi>x</mi><mn>2</mn></msup></mfenced><mfenced close=\"]\" open=\"[\"><mrow><mi>t</mi><mi>E</mi></mrow></mfenced></mfrac><mo>=</mo><mfrac><mfenced close=\"]\" open=\"[\"><msup><mi>L</mi><mn>2</mn></msup></mfenced><mrow><mfenced close=\"]\" open=\"[\"><mi>T</mi></mfenced><mfenced close=\"]\" open=\"[\"><mrow><mi>M</mi><msup><mi>L</mi><mn>2</mn></msup><msup><mi>T</mi><mrow><mo>−</mo><mn>2</mn></mrow></msup></mrow></mfenced></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><mfenced close=\"]\" open=\"[\"><mrow><mi>M</mi><msup><mi>T</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup></mrow></mfenced></mfrac></math></p><p>Hence, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mi>A</mi></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>M</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mi>T</mi></mrow></mfenced></math></p><p>Required value, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mrow><mi>A</mi><mi>B</mi></mrow></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>L</mi><mn>2</mn></msup><msup><mi>M</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><msup><mi>T</mi><mn>1</mn></msup></mrow></mfenced></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb05", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Jan Shift 2)", "title": "JEE Main 2024 (31 Jan Shift 2)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb05", "examId": "615d76b2c52ffa msup><mi>L</mi><mn>2</mn></msup><msup><mi>T</mi><mrow><mo>-</mo><mn>5</mn></mrow></msup></mrow></mfenced><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>M</mi><mn>1</mn></msup><msup><mi>L</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi>T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced></mfrac><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>M</mi><mn>1</mn></msup><msup><mi>L</mi><mn>3</mn></msup><msup><mi>T</mi><mrow><mo>-</mo><mn>3</mn></mrow></msup></mrow></mfenced></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb04", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T09:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Jan Shift 1)", "title": "JEE Main 2024 (31 Jan Shift 1)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb04", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T09:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Jan Shift 1)", "title": "JEE Main 2024 (31 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd62ba0e94a3c4025c4b", "type": "singleCorrect", "level": 1, "questionLabels": [], "question": {"text": "If mass is written as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>=</mo><mi>k</mi><msup><mi>c</mi><mi>P</mi></msup><msup><mi>G</mi><mrow><mo>-</mo><mn>1</mn><mo>/</mo><mn>2</mn></mrow></msup><mo> </mo><msup><mi>h</mi><mrow><mn>1</mn><mo>/</mo><mn>2</mn></mrow></msup></math>, then the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> will be : (Constants have their usual meaning with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi></math> a dimensionless constant)", "image": null}, "options": [{"id": "uhlbT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "yjYcl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "GRUsP", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "qZl88", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mfrac><mn>1</mn><mn>3</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>Given:</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo mathvariant=\"italic\">=</mo><mi>k</mi><msup><mi>c</mi><mi>P</mi></msup><msup><mi>G</mi><mrow><mo>-</mo><mn>1</mn><mo>/</mo><mn>2</mn></mrow></msup><mo mathvariant=\"italic\"> </mo><msup><mi>h</mi><mrow><mn>1</mn><mo>/</mo><mn>2</mn></mrow></msup></math></p><p>Writing dimensions on both sides, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mrow><msup><mi mathvariant=\"normal\">M</mi><mn>1</mn></msup><mo> </mo><msup><mi mathvariant=\"normal\">L</mi><mn>0</mn></msup><mo> </mo><msup><mi mathvariant=\"normal\">T</mi><mn>0</mn></msup></mrow></mfenced><mo>=</mo><msup><mfenced close=\"]\" open=\"[\"><msup><mi>LT</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mfenced><mi mathvariant=\"normal\">P</mi></msup><msup><mfenced close=\"]\" open=\"[\"><mrow><msup><mi mathvariant=\"normal\">M</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo> </mo><msup><mi mathvariant=\"normal\">L</mi><mn>3</mn></msup><mo> </mo><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced><mrow><mo>-</mo><mn>1</mn><mo>/</mo><mn>2</mn></mrow></msup><msup><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>ML</mi><mn>2</mn></msup><mo> </mo><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced><mrow><mn>1</mn><mo>/</mo><mn>2</mn></mrow></msup></math></p><p>By comparing exponent of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">L</mi></math> on both the sides, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>=</mo><mi>P</mi><mo>-</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mo>+</mo><mn>1</mn><mspace linebreak=\"newline\"></mspace><mo>⇒</mo><mi>P</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math></p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb03", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (30 Jan Shift 2)", "title": "JEE Main 2024 (30 Jan Shift 2)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb03", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (30 Jan Shift 2)", "title": "JEE Main 2024 (30 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd61ba0e94a3c4025c4a", "type": "singleCorrect", "level": 1, "questionLabels": [], "question": {"text": "<p>Match List-I with List-II. </p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable columnalign=\"center left center left\" columnlines=\"solid\" frame=\"solid\" rowlines=\"solid\"><mtr><mtd></mtd><mtd><mtext> List-I </mtext></mtd><mtd></mtd><mtd><mtext> List-II </mtext></mtd></mtr><mtr><mtd><mtext> A. </mtext></mtd><mtd><mtext> Coefficient of viscosity </mtext></mtd><mtd><mtext> I. </mtext></mtd><mtd><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>ML</mi><mn>2</mn></msup><mo> </mo><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced></mtd></mtr><mtr><mtd><mtext> B. </mtext></mtd><mtd><mtext> Surface Tension </mtext></mtd><mtd><mtext> II. </mtext></mtd><mtd><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>ML</mi><mn>2</mn></msup><mo> </mo><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced></mtd></mtr><mtr><mtd><mtext> C. </mtext></mtd><mtd><mtext> Angular momentum </mtext></mtd><mtd><mtext> III. </mtext></mtd><mtd><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>ML</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo> </mo><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced></mtd></mtr><mtr><mtd><mtext> D. </mtext></mtd><mtd><mtext> Rotational kinetic energy </mtext></mtd><mtd><mtext> IV. </mtext></mtd><mtd><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>ML</mi><mn>0</mn></msup><mo> </mo><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced></mtd></mtr></mtable></math></p>", "image": null}, "options": [{"id": "5REhk", "text": "A-II, B-I, C-IV, D-III", "image": null, "isCorrect": false}, {"id": "NEBEo", "text": "A-I, B-II, C-III, D-IV", "image": null, "isCorrect": false}, {"id": "TjgIE", "text": "A-III, B-IV, C-II, D-I", "image": null, "isCorrect": true}, {"id": "p9NbG", "text": "A-IV, B-III, C-II, D-I", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Viscous force is given by, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><mi>η</mi><mi>A</mi><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>y</mi></mrow></mfrac></math>.</p><p>Hence, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><msup><mi>MLT</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mfenced><mo>=</mo><mi>η</mi><mfenced close=\"]\" open=\"[\"><msup><mi mathvariant=\"normal\">L</mi><mn>2</mn></msup></mfenced><mfenced close=\"]\" open=\"[\"><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>η</mi><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>ML</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced></math></p><p>Surface tension is given by, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mi>T</mi><mo>=</mo><mfrac><mi>F</mi><mi>ℓ</mi></mfrac></math>.</p><p>Hence, dimension will be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mfenced close=\"]\" open=\"[\"><msup><mi>MLT</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mfenced><mrow><mo>[</mo><mi mathvariant=\"normal\">L</mi><mo>]</mo></mrow></mfrac><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>ML</mi><mn>0</mn></msup><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced></math></p><p>Angular momentum, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi><mo>=</mo><mi>m</mi><mi>v</mi><mi>r</mi><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>ML</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced></math></p><p>Rotational kinetic energy, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi><mo>.</mo><mi>E</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>I</mi><msup><mi>ω</mi><mn>2</mn></msup><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>ML</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced></math></p>", "image": null}, "videoSolution": {"videoId": "8b81fdf10b484e3eacf814d429fe7fde", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/9wI5KzZ5bgLkK.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/9wI5KzZ5bgLkK.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb02", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-30T09:00:00.000Z", "isVisible": true, "shortName": "2024 (30 Jan Shift 1)", "title": "JEE Main 2024 (30 Jan Shift 1)"}], "questionStructure": ["MATCH_THE_LIST"], "previousYear": {"_id": "65c4c0c11d30997d3436bb02", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-30T09:00:00.000Z", "isVisible": true, "shortName": "2024 (30 Jan Shift 1)", "title": "JEE Main 2024 (30 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd61ba0e94a3c4025c47", "type": "singleCorrect", "level": 1, "questionLabels": [], "question": {"text": "The equation of state of a real gas is given by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>P</mi><mo>+</mo><mfrac><mi>a</mi><msup><mi>V</mi><mn>2</mn></msup></mfrac></mrow></mfenced><mo>(</mo><mi>V</mi><mo>-</mo><mi>b</mi><mo>)</mo><mo>=</mo><mi>R</mi><mi>T</mi></math>, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>,</mo><mo> </mo><mi>V</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> are pressure, volume and temperature respectively and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> is the universal gas constant. The dimensions of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">a</mi><msup><mi mathvariant=\"normal\">b</mi><mn>2</mn></msup></mfrac></math> is similar to that of :", "image": null}, "options": [{"id": "QJ9hR", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>V</mi></math>", "image": null, "isCorrect": false}, {"id": "iuq2G", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>", "image": null, "isCorrect": true}, {"id": "wdwfD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mi>T</mi></math>", "image": null, "isCorrect": false}, {"id": "jVBFs", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mpadded><mi>R</mi></mpadded></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>From the dimensional analysis, it follows that</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>[</mo><mi mathvariant=\"normal\">P</mi><mo>]</mo><mo>=</mo><mfenced close=\"]\" open=\"[\"><mfrac><mi mathvariant=\"normal\">a</mi><msup><mi mathvariant=\"normal\">V</mi><mn>2</mn></msup></mfrac></mfenced><mspace linebreak=\"newline\"></mspace><mo>⇒</mo><mo>[</mo><mi mathvariant=\"normal\">a</mi><mo>]</mo><mo>=</mo><mfenced close=\"]\" open=\"[\"><msup><mi>PV</mi><mn>2</mn></msup></mfenced><mo> </mo><mo> </mo><mo> </mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>1</mn></mfenced></math></p><p>And,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>[</mo><mi mathvariant=\"normal\">V</mi><mo>]</mo><mo>=</mo><mo>[</mo><mi mathvariant=\"normal\">b</mi><mo>]</mo></math></p><p>Hence,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable columnalign=\"right center left\" columnspacing=\"0px\"><mtr><mtd><mfenced close=\"]\" open=\"[\"><mfrac><mi mathvariant=\"normal\">a</mi><msup><mi mathvariant=\"normal\">b</mi><mn>2</mn></msup></mfrac></mfenced></mtd><mtd><mo>=</mo></mtd><mtd><mfrac><mfenced close=\"]\" open=\"[\"><msup><mi>PV</mi><mn>2</mn></msup></mfenced><mfenced close=\"]\" open=\"[\"><msup><mi mathvariant=\"normal\">V</mi><mn>2</mn></msup></mfenced></mfrac></mtd></mtr><mtr><mtd></mtd><mtd><mo>=</mo></mtd><mtd><mrow><mo>[</mo><mi mathvariant=\"normal\">P</mi><mo>]</mo></mrow></mtd></mtr></mtable></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c01d30997d3436baff", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-27T14:00:00.000Z", "isVisible": true, "shortName": "2024 (27 Jan Shift 2)", "title": "JEE Main 2024 (27 Jan Shift 2)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c01d30997d3436baff", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-27T14:00:00.000Z", "isVisib ><mtd><mfenced close=\"]\" open=\"[\"><msup><mi>MLT</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mfenced><mfenced close=\"]\" open=\"[\"><mi mathvariant=\"normal\">L</mi></mfenced></mtd></mtr><mtr><mtd></mtd><mtd><mo>=</mo></mtd><mtd><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>ML</mi><mn>2</mn></msup><mo> </mo><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced></mtd></mtr></mtable></math></p><p>where, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math>  is Planck's constant, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math> is angular momentum, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math> is linear momentum and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>τ</mi></math> is moment of force.</p><p>From the above analysis, it can be concluded that Statement I is true, but statement II is false.</p>", "image": null}, "videoSolution": {"videoId": "f2ad9900609b4f778b83ce2bc59dc2fb", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/xJ6aaWD1XxVDs.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/xJ6aaWD1XxVDs.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c01d30997d3436bafe", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-27T09:00:00.000Z", "isVisible": true, "shortName": "2024 (27 Jan Shift 1)", "title": "JEE Main 2024 (27 Jan Shift 1)"}], "questionStructure": ["TWO_STATEMENT_BASED"], "previousYear": {"_id": "65c4c0c01d30997d3436bafe", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-27T09:00:00.000Z", "isVisible": true, "shortName": "2024 (27 Jan Shift 1)", "title": "JEE Main 2024 (27 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a71417cc3fb48d68715", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6497", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (15 Apr Shift 1)", "title": "JEE Main 2023 (15 Apr Shift 1)"}], "question": {"text": "The speed of a wave produced in water is given by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#957;</mi><mo>=</mo><msup><mi>&#955;</mi><mi>a</mi></msup><msup><mi>g</mi><mi>b</mi></msup><msup><mi>&#961;</mi><mi>c</mi></msup></math>. Where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi><mo>,</mo><mo>&#160;</mo><mi>g</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#961;</mi></math> are wavelength of wave, acceleration due to gravity and density of water respectively. The values of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>,</mo><mo>&#160;</mo><mi>b</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>c</mi></math> respectively, are", "image": null}, "options": [{"id": "kL52N", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>,</mo><mo>&#160;</mo><mo>-</mo><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "E5Zto", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>,</mo><mo>&#160;</mo><mn>0</mn><mo>,</mo><mo>&#160;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "Hx7uE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "id5qB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>,</mo><mo>&#160;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>,</mo><mo>&#160;</mo><mn>0</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<blockquote><p>The dimensional form of velocity can be written as</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mi>v</mi></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>&#955;</mi><mi>a</mi></msup><msup><mi>g</mi><mi>b</mi></msup><msup><mi>&#961;</mi><mi>c</mi></msup></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>M</mi><mn>0</mn></msup><mi>L</mi><msup><mi>T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced><mo>=</mo><msup><mfenced close=\"]\" open=\"[\"><mi>L</mi></mfenced><mi>a</mi></msup><msup><mfenced close=\"]\" open=\"[\"><mrow><mi>L</mi><msup><mi>T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced><mi>b</mi></msup><msup><mfenced close=\"]\" open=\"[\"><mrow><mi>M</mi><msup><mi>L</mi><mrow><mo>-</mo><mn>3</mn></mrow></msup></mrow></mfenced><mi>c</mi></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"></math>Comparing the exponents for&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><mo>,</mo><mi>L</mi><mo>,</mo><mi>T</mi></math>,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>For</mi><mo>&#160;</mo><mi>M</mi><mo>,</mo><mo>&#160;</mo><mspace linebreak=\"newline\"></mspace><msup><mi>M</mi><mi>c</mi></msup><mo>=</mo><msup><mi>M</mi><mn>0</mn></msup><mspace linebreak=\"newline\"></mspace><mi>For</mi><mo>&#160;</mo><mi>L</mi><mo>,</mo><mspace linebreak=\"newline\"></mspace><msup><mi>L</mi><mrow><mi>a</mi><mo>+</mo><mi>b</mi><mo>-</mo><mn>3</mn><mi>c</mi></mrow></msup><mo>=</mo><msup><mi>L</mi><mn>1</mn></msup><mspace linebreak=\"newline\"></mspace><mi>For</mi><mo>&#160;</mo><mi>T</mi><mo>,</mo><mspace linebreak=\"newline\"></mspace><msup><mi>T</mi><mrow><mo>-</mo><mn>2</mn><mi>b</mi></mrow></msup><mo>=</mo><msup><mi>T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p><p>So,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>c</mi><mo>=</mo><mn>0</mn><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mi>i</mi><mo>)</mo><mspace linebreak=\"newline\"></mspace><mi>a</mi><mo>+</mo><mi>b</mi><mo>-</mo><mn>3</mn><mi>c</mi><mo>=</mo><mn>1</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mi>i</mi><mi>i</mi><mo>)</mo><mspace linebreak=\"newline\"></mspace><mo>-</mo><mn>2</mn><mi>b</mi><mo>=</mo><mo>-</mo><mn>1</mn><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mi>i</mi><mi>i</mi><mi>i</mi><mo>)</mo></math></p><p>From equations (i),(ii),(iii),</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>,</mo><mo>&#160;</mo><mi>b</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>,</mo><mi>c</mi><mo>=</mo><mn>0</mn></math></p><p>&nbsp;</p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6497", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (15 Apr Shift 1)", "title": "JEE Main 2023 (15 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a71417cc3fb48d686b5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6495", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 Apr Shift 2)", "title": "JEE Main 2023 (13 Apr Shift 2)"}], "question": {"text": "<p>In the equation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><mrow><mi>X</mi><mo>+</mo><mfrac><mi>a</mi><msup><mi>Y</mi><mn>2</mn></msup></mfrac></mrow></mfenced><mo>[</mo><mi>Y</mi><mo>-</mo><mi>b</mi><mo>]</mo><mo>=</mo><mi>R</mi><mi>T</mi><mo>,</mo><mo>&#160;</mo><mi>X</mi></math>&nbsp;is&nbsp;pressure, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Y</mi></math>&nbsp;is volume, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> is universal gas constant and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> is temperature. The physical quantity equivalent&nbsp;to the ratio&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>a</mi><mi>b</mi></mfrac></math>&nbsp;is:</p><p>&nbsp;</p>", "image": null}, "options": [{"id": "x8Dk4", "text": "Pressure gradient", "image": null, "isCorrect": false}, {"id": "RlS9V", "text": "Energy", "image": null, "isCorrect": true}, {"id": "UDjYv", "text": "Impulse", "image": null, "isCorrect": false}, {"id": "KxDhV", "text": "Coefficient of viscosity", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>X</mi><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfrac><mi>a</mi><msup><mi>Y</mi><mn>2</mn></msup></mfrac></math>&nbsp;have the same dimensions.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Y</mi><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mi>b</mi></math>&nbsp;also have the same dimensions.</p><p>Therefore,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>a</mi><msup><mi>Y</mi><mn>2</mn></msup></mfrac><mo>=</mo><mi>M</mi><msup><mi>L</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi>T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><mi>a</mi><mo>=</mo><mi>M</mi><msup><mi>L</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi>T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>&#215;</mo><msup><mi>L</mi><mn>6</mn></msup><mo>=</mo><mi>M</mi><msup><mi>L</mi><mn>5</mn></msup><msup><mi>T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math></p><p>and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>b</mi><mo>=</mo><msup><mi>L</mi><mn>3</mn></msup></math>.</p><p>So, the dimensions of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>a</mi><mi>b</mi></mfrac></math>&nbsp;is,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>a</mi><mi>b</mi></mfrac><mo>=</mo><mfrac><mrow><mi>M</mi><msup><mi>L</mi><mn>5</mn></msup><msup><mi>T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow><msup><mi>L</mi><mn>3</mn></msup></mfrac><mo>=</mo><mi>M</mi><msup><mi>L</mi><mn>2</mn></msup><msup><mi>T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>.</p><p>This is the dimensional form of energy. Hence, this is the right option.</p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6495", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 Apr Shift 2)", "title": "JEE Main 2023 (13 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a71417cc3fb48d685ff", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6496", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 Apr Shift 1)", "title": "JEE Main 2023 (12 Apr Shift 1)"}], "question": {"text": "<p>Match List I with List II</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 500px;\">\t<tbody>\t\t<tr>\t\t\t<td style=\"text-align: center;\">&nbsp;</td>\t\t\t<td style=\"text-align: center;\">List-I</td>\t\t\t<td style=\"text-align: center;\">&nbsp;</td>\t\t\t<td style=\"text-align: center;\">List-II</td>\t\t</tr>\t\t<tr>\t\t\t<td style=\"text-align: center;\">A</td>\t\t\t<td style=\"text-align: center;\">Spring constant</td>\t\t\t<td style=\"text-align: center;\">I</td>\t\t\t<td style=\"text-align: center;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>[</mo><msup><mi>T</mi><mrow><mo>&#8211;</mo><mn>1</mn></mrow></msup><mo>]</mo></math></td>\t\t</tr>\t\t<tr>\t\t\t<td style=\"text-align: center;\">B</td>\t\t\t<td style=\"text-align: center;\">Angular speed</td>\t\t\t<td style=\"text-align: center;\">II</td>\t\t\t<td style=\"text-align: center;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>[</mo><mi>M</mi><msup><mi>T</mi><mrow><mo>&#8211;</mo><mn>2</mn></mrow></msup><mo>]</mo></math></td>\t\t</tr>\t\t<tr>\t\t\t<td style=\"text-align: center;\">C</td>\t\t\t<td style=\"text-align: center;\">Angular momentum</td>\t\t\t<td style=\"text-align: center;\">III</td>\t\t\t<td style=\"text-align: center;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>[</mo><mi>M</mi><msup><mi>L</mi><mn>2</mn></msup><mo>]</mo></math></td>\t\t</tr>\t\t<tr>\t\t\t<td style=\"text-align: center;\">D</td>\t\t\t<td style=\"text-align: center;\">Moment of Inertia</td>\t\t\t<td style=\"text-align: center;\">IV</td>\t\t\t<td style=\"text-align: center;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>[</mo><mi>M</mi><msup><mi>L</mi><mn>2</mn></msup><msup><mi>T</mi><mrow><mo>&#8211;</mo><mn>1</mn></mrow></msup><mo>]</mo><mo>&#160;</mo></math></td>\t\t</tr>\t</tbody></table><p>Choose the correct answer from the options given below:</p>", "image": null}, "options": [{"id": "u9nco", "text": "A-I, B-III, C-II, D-IV", "image": null, "isCorrect": false}, {"id": "MRkOH", "text": "A-IV, B-I, C-III, D-II", "image": null, "isCorrect": false}, {"id": "1H9b6", "text": "A-II, B-I, C-IV, D-III", "image": null, "isCorrect": true}, {"id": "JEMrV", "text": "A-II, B-III, C-I, D-IV", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>The formula to calculate the spring constant is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><mi>k</mi><mi>x</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>1</mn></mfenced></math></p><p>The formula to calculate the angular speed is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#969;</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>&#960;</mi></mrow><mi>T</mi></mfrac><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>2</mn></mfenced></math></p><p>The formula to calculate the angular momentum is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi><mo>=</mo><mi>m</mi><mi>v</mi><mi>r</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mn>3</mn><mo>)</mo></math></p><p>The formula to calculate the moment of inertia is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>4</mn></mfenced></math></p><p>Use the method of dimensional analysis to obtain the dimensions of the required quantities. From above relations, we can write</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable columnalign=\"right center left\" columnspacing=\"0px\"><mtr><mtd><mfenced close=\"]\" open=\"[\"><mrow><mi>M</mi><mi>L</mi><msup><mi>T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced></mtd><mtd><mo>=</mo></mtd><mtd><mfenced close=\"]\" open=\"[\"><mi>k</mi></mfenced><mfenced close=\"]\" open=\"[\"><mi>L</mi></mfenced></mtd></mtr><mtr><mtd></mtd><mtd><mo>&#8658;</mo></mtd><mtd><mfenced close=\"]\" open=\"[\"><mi>k</mi></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><mi>M</mi><msup><mi>T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced></mtd></mtr><mtr><mtd></mtd><mtd></mtd><mtd></mtd></mtr><mtr><mtd><mfenced close=\"]\" open=\"[\"><mi>&#969;</mi></mfenced></mtd><mtd><mo>=</mo></mtd><mtd><mfrac><mn>1</mn><mfenced close=\"]\" open=\"[\"><mi>T</mi></mfenced></mfrac></mtd></mtr><mtr><mtd></mtd><mtd><mo>=</mo></mtd><mtd><mfenced close=\"]\" open=\"[\"><msup><mi>T</mi>  true, "image": null}], "correctValue": null, "solution": {"text": "<p>If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi></math>&nbsp;is energy, then</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mi>E</mi></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\"><mfrac><mrow><mi>G</mi><msub><mi>m</mi><mn>1</mn></msub><msub><mi>m</mi><mn>2</mn></msub></mrow><mi>r</mi></mfrac></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mi>E</mi></mfenced><mfenced close=\"]\" open=\"[\"><mi>r</mi></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><mi>G</mi><msub><mi>m</mi><mn>1</mn></msub><msub><mi>m</mi><mn>2</mn></msub></mrow></mfenced></math></p><p>Since&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mo>=</mo><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mi>&#955;</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mi>&#955;</mi></mfrac></mfenced><mfenced close=\"]\" open=\"[\"><mi>r</mi></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><mi>G</mi><msub><mi>m</mi><mn>1</mn></msub><msub><mi>m</mi><mn>2</mn></msub></mrow></mfenced><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><mfrac><mfenced close=\"]\" open=\"[\"><mrow><mi>h</mi><mi>c</mi></mrow></mfenced><mfenced close=\"]\" open=\"[\"><mi>L</mi></mfenced></mfrac><mfenced close=\"]\" open=\"[\"><mi>L</mi></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\"><mi>G</mi></mfenced><mfenced close=\"]\" open=\"[\"><msup><mi>M</mi><mn>2</mn></msup></mfenced></math></p><p>(both&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>&nbsp;have dimensions of length)</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mfenced close=\"]\" open=\"[\"><msqrt><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mi>G</mi></mfrac></msqrt></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\"><mi>M</mi></mfenced></math></p>", "image": null}, "videoSolution": {"videoId": "4500ab8910a8475294dce03b8989f28a", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/tAe9nR2sMnAlX.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/tAe9nR2sMnAlX.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499891d196b49d9cd6b14", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T14:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 2)", "title": "JEE Main 2023 (01 Feb Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67ef7", "previousYearPapers": [{"_id": "63f499881d196b49d9cd6b13", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T09:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 1)", "title": "JEE Main 2023 (01 Feb Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>P</mi><mo>+</mo><mfrac><mi>a</mi><msup><mi>V</mi><mn>2</mn></msup></mfrac></mrow></mfenced><mfenced><mrow><mi>V</mi><mo>-</mo><mi>b</mi></mrow></mfenced><mo>=</mo><mi>R</mi><mi>T</mi></math> represents the equation of state of some gases. Where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> is the pressure, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi></math> is the volume, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> is the temperature and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>,</mo><mo>&#160;</mo><mi>b</mi><mo>,</mo><mo>&#160;</mo><mi>R</mi></math> are the constants. The physical quantity, which has dimensional formula as that of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>b</mi><mn>2</mn></msup><mi>a</mi></mfrac></math>&nbsp;, will be :", "image": null}, "options": [{"id": "TgqG5", "text": "Bulk modulus", "isCorrect": false, "image": null}, {"id": "Vxw8u", "text": "Modulus of rigidity", "isCorrect": false, "image": null}, {"id": "iqgRg", "text": "Compressibility", "isCorrect": true, "image": null}, {"id": "32YnP", "text": "Energy density", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>According to the principle of dimensional homogeneity, the dimensions of each &nbsp;terms of a dimensional equation on both sides are the same.</p><p>So,&nbsp;dimension of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>b</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi></math>&nbsp;will be same,&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mi>b</mi></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\"><mi>V</mi></mfenced></math>&nbsp;</p><p>And dimension of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>a</mi><msup><mi>V</mi><mn>2</mn></msup></mfrac></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>&nbsp;will be same,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mfrac><mi>a</mi><msup><mi>V</mi><mn>2</mn></msup></mfrac></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\"><mi>P</mi></mfenced></math></p><p>From above two relations, we have&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mfrac><mi>a</mi><msup><mi>b</mi><mn>2</mn></msup></mfrac></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\"><mi>P</mi></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mfenced close=\"]\" open=\"[\"><mfrac><msup><mi>b</mi><mn>2</mn></msup><mi>a</mi></mfrac></mfenced><mo>=</mo><mfrac><mn>1</mn><mfenced close=\"]\" open=\"[\"><mi>P</mi></mfenced></mfrac><mo>=</mo><msup><mfenced close=\"]\" open=\"[\"><mrow><mi>M</mi><msup><mi>L</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi>T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p><p>Thus,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>M</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi>L</mi><mn>1</mn></msup><msup><mi>T</mi><mn>2</mn></msup></mrow></mfenced></math>&nbsp;&nbsp;is the dimension of compressibility.</p>", "image": null}, "videoSolution": {"videoId": "18b4df15be5344aaa250f199cdb7ffa8", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/UfavG4zj9LjUh.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/UfavG4zj9LjUh.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499881d196b49d9cd6b13", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T09:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 1)", "title": "JEE Main 2023 (01 Feb Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d682cf", "previousYearPapers": [{"_id": "63f499871d196b49d9cd6b12", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 2)", "title": "JEE Main 2023 (31 Jan Shift 2)"}], "type": "singleCorrect", "level": 1, "question":  "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>As we know, angular momentum is given by,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>L</mi><mo>&#8594;</mo></mover><mo>=</mo><mover><mi>r</mi><mo>&#8594;</mo></mover><mo>&#215;</mo><mover><mi>p</mi><mo>&#8594;</mo></mover><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mfenced open=\"[\" close=\"]\"><mi mathvariant=\"normal\">L</mi></mfenced><mo>=</mo><mfenced open=\"[\" close=\"]\"><mrow><msup><mi mathvariant=\"normal\">M</mi><mn>0</mn></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">L</mi><mn>1</mn></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">T</mi><mn>0</mn></msup></mrow></mfenced><mfenced open=\"[\" close=\"]\"><mrow><msup><mi mathvariant=\"normal\">M</mi><mn>1</mn></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">L</mi><mn>1</mn></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><msup><mi mathvariant=\"normal\">M</mi><mn>1</mn></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">L</mi><mn>2</mn></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced></math></p><p>Torque is given by,&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>&#964;</mi><mo>&#8594;</mo></mover><mo>=</mo><mover><mi>r</mi><mo>&#8594;</mo></mover><mo>&#215;</mo><mover><mi>F</mi><mo>&#8594;</mo></mover><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mfenced open=\"[\" close=\"]\"><mi>&#964;</mi></mfenced><mo>=</mo><mfenced open=\"[\" close=\"]\"><msup><mi>L</mi><mn>1</mn></msup></mfenced><mfenced open=\"[\" close=\"]\"><msup><mi>MLT</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>ML</mi><mn>2</mn></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced></math></p><p>Also, Stress <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8801;</mo></math> Pressure <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mi>F</mi><mi>A</mi></mfrac></math></p><p>Hence, [Stress]&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>ML</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced></math></p><p>Pressure Gradient&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mi>d</mi><mi>P</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac></math>&nbsp;</p><p>Therefore, [Pressure Gradient]<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>ML</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["MATCH_THE_LIST"], "syllabusCategory": "noChange", "previousYear": {"_id": "63f499871d196b49d9cd6b12", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 2)", "title": "JEE Main 2023 (31 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d6827c", "previousYearPapers": [{"_id": "63f499871d196b49d9cd6b11", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T09:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 1)", "title": "JEE Main 2023 (31 Jan Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>,</mo><mo>&#160;</mo><msub><mi>X</mi><mi>L</mi></msub><mo>&#160;</mo><mtext>and</mtext><mo>&#160;</mo><msub><mi>X</mi><mi>C</mi></msub></math> represent resistance, inductive reactance and capacitive reactance. Then which of the following is dimensionless:", "image": null}, "options": [{"id": "emM12", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>&#160;</mo><msub><mi>X</mi><mi>L</mi></msub><mo>&#160;</mo><msub><mi>X</mi><mi>C</mi></msub><mo>&#160;</mo><mo>&#160;</mo></math>", "isCorrect": false, "image": null}, {"id": "cHd0O", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>R</mi><msqrt><msub><mi>X</mi><mi>L</mi></msub><msub><mi>X</mi><mi>c</mi></msub></msqrt></mfrac></math>", "isCorrect": true, "image": null}, {"id": "EnOqw", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>R</mi><mrow><msub><mi>X</mi><mi>L</mi></msub><msub><mi>X</mi><mi>c</mi></msub></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "frGHE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mfrac><msub><mi>X</mi><mi>L</mi></msub><msub><mi>X</mi><mi>c</mi></msub></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>As resistance, inductive reactance and capacitive reactance have same unit&nbsp;ohm. So, all three have same dimension.</p><p>Thus,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>R</mi><msqrt><msub><mi>X</mi><mi>L</mi></msub><msub><mi>X</mi><mi>C</mi></msub></msqrt></mfrac></math>&nbsp;is dimensionless.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499871d196b49d9cd6b11", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T09:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 1)", "title": "JEE Main 2023 (31 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d68168", "previousYearPapers": [{"_id": "63f499861d196b49d9cd6b0e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 2)", "title": "JEE Main 2023 (29 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>The equation of a circle is given by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><msup><mi>a</mi><mn>2</mn></msup></math>, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math> is the radius. If the equation is modified to change the origin other than <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>0</mn><mo>,</mo><mo>&#160;</mo><mn>0</mn><mo>)</mo></math>, then find out the correct dimensions of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> in a new&nbsp;equation :</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mi>A</mi><mi>t</mi></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mi>y</mi><mo>-</mo><mfrac><mi>t</mi><mi>B</mi></mfrac></mrow></mfenced><mn>2</mn></msup><mo>=</mo><msup><mi>a</mi><mn>2</mn></msup></math></p><p>The dimensions of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi></math> is given as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mfenced></math></p>", "image": null}, "options": [{"id": "rag7F", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mo>[</mo><msup><mi mathvariant=\"normal\">L</mi><mrow><mo>&#8211;</mo><mn>1</mn></mrow></msup><mi mathvariant=\"normal\">T</mi><mo>]</mo><mo>,</mo><mo>&#160;</mo><mi>B</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mo>[</mo><msup><mi>LT</mi><mrow><mo>&#8211;</mo><mn>1</mn></mrow></msup><mo>]</mo></math>", "isCorrect": false, "image": null}, {"id": "h8tui", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mfenced open=\"[\" close=\"]\"><mi>LT</mi></mfenced><mo>,</mo><mo>&#160;</mo><mi>B</mi><mo>=</mo><mo>[</mo><msup><mi mathvariant=\"normal\">L</mi><mrow><mo>&#8211;</mo><mn>1</mn></mrow></msup><mi mathvariant=\"normal\">T</mi><msup><mo>&#160;</mo><mrow><mo>&#8211;</mo><mn>1</mn></mrow></msup><mo>]</mo></math>", "isCorrect": true, "image": null}, {"id": "GMZap", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mo>[</mo><msup><mi mathvariant=\"normal\">L</mi><mrow><mo>&#8211;</mo><mn>1</mn></mrow></msup><mi mathvariant=\"normal\">T</mi><msup><mo>&#160;</mo><mrow><mo>&#8211;</mo><mn>1</mn></mrow></msup><mo>&#160;</mo><mo>]</mo><mo>,</mo><mo>&#160;</mo><mi>B</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mo>[</mo><msup><mi>LT</mi><mrow><mo>&#8211;</mo><mn>1</mn></mrow></msup><mo>]</mo><mo>&#160;</mo></math>", "isCorrect": false, "image": null}, {"id": "0WLlU", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mo>[</mo><msup><mi mathvariant=\"normal\">L</mi><mrow><mo>&#8211;</mo><mn>1</mn></mrow></msup><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>&#160;</mo><mo>&#8211;</mo><mn>1</mn></mrow></msup><mo>]</mo><mo>,</mo><mo>&#160;</mo><mi>B</mi><mo>=</mo><mo>[</mo><mi>LT</mi><mo>]</mo><mo>&#160;</mo></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Principle of Homogeneity states that dimensions of each of the terms of a dimensional equation on both sides should be the same. Then,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mi>A</mi><mi>t</mi></mrow></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced><mrow><mi>y</mi><mo>-</mo><mfrac><mi>t</mi><mi>B</mi></mfrac></mrow></mfenced><mn>2</mn></msup><mo>=</mo><msup><mi>a</mi><mn>2</mn></msup></math></p><p>For first term,&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><mrow><mi>A</mi><mi>t</mi></mrow></mfenced><mo>=</mo><mfenced open=\"[\" close=\"]\"><mi>x</mi></mfenced><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mi>A</mi><mo>&#215;</mo><mfrac><mn>1</mn><mi>T</mi></mfrac><mo>=</mo><mi>L</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mfenced open=\"[\" close=\"]\"><mi>A</mi></mfenced><mo>=</mo><msup><mi mathvariant=\"normal\">T</mi><mn>1</mn></msup><msup><mi mathvariant=\"normal\">L</mi><mn>1</mn></msup></math></p><p>For the second term,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><mfrac><mi>t</mi><mi>B</mi></mfrac></mfenced><mo>=</mo><mfenced open=\"[\" close=\"]\"><mi>y</mi></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mn>1</mn><mrow><mi>T</mi><mfenced open=\"[\" close=\"]\"><mi>B</mi></mfenced></mrow></mfrac><mo>=</mo><mi>L</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced open=\"[\" close=\"]\"><mi>B</mi></mfenced><mo>=</mo><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi mathvariant=\"normal\">L</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499861d196b49d9cd6b0e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 2)", "title": "JEE Main 2023 (29 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d68119", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 1)", "title": "JEE Main 2023 (29 Jan Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Match List I with List II :</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 500px;\">\t<tbody>\t\t<tr>\t\t\t<td>&nbsp;</td>\t\t\t<td><strong>List-I (Physical Quantity)</strong></td>\t\t\t<td>&nbsp;</td>\t\t\t<td><strong>List-II (Dimensional Formula)</strong></td>\t\t</tr>\t\t<tr>\t\t\t<td>A</td>\t\t\t<td>Pressure gradient</td>\t\t\t<td>I</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><mrow><msup><mi mathvariant=\"normal\">M</mi><mn>0</mn></msup><msup><mi mathvariant=\"normal\">L</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>B</td>\t\t\t<td>Energy density</td>\t\t\t<td>II</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><mrow><msup><mi mathvariant=\"normal\">M</mi><mn>1</mn></msup><msup><mi mathvariant=\"normal\">L</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>C</td>\t\t\t<td>Electric Field</td>\t\t\t<td>III</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><mrow><msup><mi mathvariant=\"normal\">M</mi><mn>1</mn></msup><msup><mi mathvariant=\"normal\">L</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>D</td>\t\t\t<td>Latent heat</td>\t\t\t<td>IV</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><mrow><msup><mi mathvariant=\"normal\">M</mi><mn>1</mn></msup><msup><mi mathvariant=\"normal\">L</mi><mn>1</mn></msup><msup><mi mathvariant=\"normal\">T</mi
