=\"]\" open=\"[\"><mrow><msup><mi mathvariant=\"normal\">M</mi><mn>1</mn></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">L</mi><mn>2</mn></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced></math></td>\t\t</tr>\t\t<tr>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo>.</mo></math></td>\t\t\t<td>Stopping potential <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><msub><mi>V</mi><mi>s</mi></msub></mfenced></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>II</mi><mo>.</mo></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mrow><msup><mi mathvariant=\"normal\">M</mi><mn>1</mn></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">L</mi><mn>1</mn></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced></math></td>\t\t</tr>\t\t<tr>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi><mo>.</mo></math></td>\t\t\t<td>Work function <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>&#981;</mi></mfenced></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>III</mi><mo>.</mo></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mrow><msup><mi mathvariant=\"normal\">M</mi><mn>1</mn></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">L</mi><mn>2</mn></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced></math></td>\t\t</tr>\t\t<tr>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">D</mi><mo>.</mo></math></td>\t\t\t<td>Momentum <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>p</mi></mfenced></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>IV</mi><mo>.</mo></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mrow><msup><mi mathvariant=\"normal\">M</mi><mn>1</mn></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">L</mi><mn>2</mn></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">A</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced></math></td>\t\t</tr>\t</tbody></table><p>&nbsp;</p>", "image": null}, "options": [{"id": "3C0bs", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi>III</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi>II</mi><mo>,</mo><mi mathvariant=\"normal\">D</mi><mo>-</mo><mi>IV</mi></math>", "isCorrect": false, "image": null}, {"id": "cPgAQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi>III</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi>IV</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi><mo>,</mo><mi mathvariant=\"normal\">D</mi><mo>-</mo><mi>II</mi></math>", "isCorrect": true, "image": null}, {"id": "GWJK9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi>II</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi>IV</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi>III</mi><mo>,</mo><mi mathvariant=\"normal\">D</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi></math>", "isCorrect": false, "image": null}, {"id": "rqb9Y", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi>III</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi>IV</mi><mo>,</mo><mi mathvariant=\"normal\">D</mi><mo>-</mo><mi>II</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The dimension of momentum is,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><msup><mi mathvariant=\"normal\">M</mi><mn>1</mn></msup><msup><mi mathvariant=\"normal\">L</mi><mn>1</mn></msup><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced></math></p><p>From de&nbsp;Broglie equation,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>h</mi><mi>p</mi></mfrac><mo>=</mo><mi>&#955;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>[</mo><mi>h</mi><mo>]</mo><mo>=</mo><mo>[</mo><mi>p</mi><mo>]</mo><mfenced close=\"]\" open=\"[\"><mi>&#955;</mi></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><mi>M</mi><msup><mi>L</mi><mn>2</mn></msup><msup><mi>T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced></math></p><p>The stopping potential is related to maximum kinetic energy of emitted electron as</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mi>s</mi></msub><mo>=</mo><mfrac><mrow><mi>K</mi><msub><mi>E</mi><mrow><mi>m</mi><mi>a</mi><mi>x</mi></mrow></msub></mrow><mi>e</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>ML</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced><mfenced close=\"]\" open=\"[\"><mi>AT</mi></mfenced></mfrac><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>ML</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>3</mn></mrow></msup><msup><mi mathvariant=\"normal\">A</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced></math></p><p>From Einstein&#39;s photoelectric equation, the work function&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#981;</mi></math>&nbsp;has dimensions of energy&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mi>&#981;</mi></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>ML</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced></math></p>", "image": null}, "videoSolution": {"videoId": "d4e15fa247b24a57999e77122eb2aa3b", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/cIoysfZtHVcJr.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/cIoysfZtHVcJr.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "questionStructure": ["MATCH_THE_LIST"], "syllabusCategory": "noChange", "previousYear": {"_id": "63f499801d196b49d9cd6b09", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T09:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 1)", "title": "JEE Main 2023 (24 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67d87", "previousYearPapers": [{"_id": "63134c746e7bc9b332483707", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-29T09:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jul Shift 1)", "title": "JEE Main 2022 (29 Jul Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Given below are two statements: One is labelled as Assertion (A) and other is labelled as Reason (R)</p><p><strong>Assertion (A) :</strong> Time period of oscillation of a liquid drop depends on surface tension <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>S</mi></mfenced></math>, if density of the liquid is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#961;</mi></math> and radius of the drop is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mi>K</mi><msqrt><mfrac><mrow><mi>&#961;</mi><msup><mi>r</mi><mn>3</mn></msup></mrow><msup><mi>S</mi><mstyle displaystyle=\"true\"><mfrac><mn>3</mn><mn>2</mn></mfrac></mstyle></msup></mfrac></msqrt></math> is dimensionally correct, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi></math> is dimensionless.</p><p><strong>Reason (R) :</strong> Using dimensional analysis we get R.H.S. having different dimension than that of time period. In the light of above statements, choose the correct answer from the options given below.</p>", "image": null}, "options": [{"id": "wEST1", "text": "Both (A) and (R) are true and (R) is the correct explanation of (A)", "isCorrect": false, "image": null}, {"id": "wyFXk", "text": "Both (A) and (R) are true but (R) is not the correct explanation of (A)", "isCorrect": false, "image": null}, {"id": "Sz3cd", "text": "(A) is true but (R)&nbsp;is false", "isCorrect": false, "image": null}, {"id": "LgDCn", "text": "(A) is false but (R) is true", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Using dimensional analysis for the given equation,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mi>K</mi><msqrt><mfrac><mrow><mi>&#961;</mi><msup><mi>r</mi><mn>3</mn></msup></mrow><msup><mi>S</mi><mstyle displaystyle=\"true\"><mfrac><mn>3</mn><mn>2</mn></mfrac></mstyle></msup></mfrac></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced close=\"]\" open=\"[\"><mi>K</mi></mfenced><mo>=</mo><mfrac><mrow><mfenced close=\"]\" open=\"[\"><mi>T</mi></mfenced><mfenced close=\"]\" open=\"[\"><msup><mi>S</mi><mstyle displaystyle=\"true\"><mfrac><mn>3</mn><mn>4</mn></mfrac></mstyle></msup></mfenced></mrow><mrow><mfenced close=\"]\" open=\"[\"><msup><mi>&#961;</mi><mstyle displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></msup></mfenced><mfenced close=\"]\" open=\"[\"><msup><mi>r</mi><mstyle displaystyle=\"true\"><mfrac><mn>3</mn><mn>2</mn></mfrac></mstyle></msup></mfenced></mrow></mfrac><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><mfenced close=\"]\" open=\"[\"><mi>K</mi></mfenced><mo>=</mo><mfrac><mrow><mfenced close=\"]\" open=\"[\"><mi mathvariant=\"normal\">T</mi></mfenced><mfenced close=\"]\" open=\"[\"><mrow><msup><mi mathvariant=\"normal\">M</mi><mstyle displaystyle=\"true\"><mfrac><mn>3</mn><mn>4</mn></mfrac></mstyle></msup><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mstyle displaystyle=\"true\"><mfrac><mn>3</mn><mn>2</mn></mfrac></mstyle></mrow></msup></mrow></mfenced></mrow><mrow><mfenced close=\"]\" open=\"[\"><mrow><msup><mi mathvariant=\"normal\">M</mi><mstyle displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></msup><msup><mi mathvariant=\"normal\">L</mi><mrow><mo>-</mo><mstyle displaystyle=\"true\"><mfrac><mn>3</mn><mn>2</mn></mfrac></mstyle></mrow></msup></mrow></mfenced><mfenced close=\"]\" open=\"[\"><msup><mi mathvariant=\"normal\">L</mi><mstyle displaystyle=\"true\"><mfrac><mn>3</mn><mn>2</mn></mfrac></mstyle></msup></mfenced></mrow></mfrac><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><mfenced close=\"]\" open=\"[\"><mi>K</mi></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><msup><mi mathvariant=\"normal\">M</mi><mfrac><mn>1</mn><mn>4</mn></mfrac></msup><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></msup></mrow></mfenced></math></p><p>Therefore,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi></math>&nbsp;is not dimensionless. Hence, Assertion is false.</p><p>For dimensional validity of the given equation,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi></math>&nbsp;can not be dimensionless. If it is dimensionless then</p><p>Dimensions of L.H.S <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8800;</mo></math> Dimensions of R.H.S</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math>&nbsp;Option (D) is correct.</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["ASSERTION_REASON"], "syllabusCategory": "noChange", "previousYear": {"_id": "63134c746e7bc9b332483707", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-29T09:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jul Shift 1)", "title": "JEE Main 2022 (29 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67c79", "previousYearPapers": [{"_id": "63134c746e7bc9b33248370b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-28T14:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jul Shift 2)", "title": "JEE Main 2022 (28 Jul Shift 2)"}], "type": "singleCorrect", "level": 3, "question": {"text": "Consider the efficiency of Carnot&#39;s engine is given by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>=</mo><mfrac><mrow><mi>&#945;</mi><mi>&#946;</mi></mrow><mrow><mi>sin</mi><mi>&#952;</mi></mrow></mfrac><msub><mi>log</mi><mi mathvariant=\"normal\">e</mi></msub><mfrac><mrow><mi>&#946;</mi><mi>x</mi></mrow><mrow><mi>k</mi><mi>T</mi></mrow></mfrac></math>, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#946;</mi></math> are constants. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> is temperature, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi></math> is Boltzman constant, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi></math> is angular displacement and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math> has the dimensions of length. Then, choose the incorrect option.", "image": null}, "options": [{"id": "H7nuA", "text": "Dimensions of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#946;</mi></math> is same as that of force.", "isCorrect": false, "image": null}, {"id": "WUEkI", "text": "Dimensions of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>&#945;</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mi>x</mi></math> is same as that of energy.", "isCorrect": false, "image": null}, {"id": "aJe5b", "text": "Dimensions of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>&#951;</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mi>sin</mi><mi>&#952;</mi></math> is same as that of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mi>&#946;</mi></math>", "isCorrect": false, "image": null}, {"id": "Cmpde", "text": "Dimensions of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi></math> is same as that of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#946;</mi></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Given that,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>=</mo><mfrac><mrow><mi>&#945;</mi><mi>&#946;</mi></mrow><mrow><mi>sin</mi><mi>&#952;</mi></mrow></mfrac><mi>log</mi><mfenced><mfrac><mrow><mi>&#946;</mi><mi>x</mi></mrow><mrow><mi>k</mi><mi>T</mi></mrow></mfrac></mfenced></math>.&nbsp;Since expression inside the logarithm is dimensionless</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mrow><mi>&#946;</mi><mi>x</mi></mrow></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><mi>k</mi><mi>T</mi></mrow></mfenced></math></p><p>Since the dimensions of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi><mi>T</mi></math>&nbsp;are equivalent to that of energy,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mi>&#946;</mi></mfenced><mo>=</mo><mfrac><mfenced close=\"]\" open=\"[\"  1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d677e7", "previousYearPapers": [{"_id": "63134c746e7bc9b332483703", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T09:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jul Shift 1)", "title": "JEE Main 2022 (25 Jul Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "If momentum <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><mi>P</mi></mfenced></math>, area <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><mi>A</mi></mfenced></math> and time <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><mi>T</mi></mfenced></math> are taken as fundamental quantities, then the dimensional formula for coefficient of viscosity is", "image": null}, "options": [{"id": "qfqvk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><mrow><msup><mi>PA</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi mathvariant=\"normal\">T</mi><mn>0</mn></msup></mrow></mfenced></math>", "isCorrect": true, "image": null}, {"id": "OJW7E", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><msup><mi>PAT</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mfenced></math>", "isCorrect": false, "image": null}, {"id": "9vY9w", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><mrow><msup><mi>PA</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mi mathvariant=\"normal\">T</mi></mrow></mfenced></math>", "isCorrect": false, "image": null}, {"id": "nfcUX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><mrow><msup><mi>PA</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>We know, Viscosity<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo></math>Pascal<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8208;</mo></math>second</p><p>Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><mi>&#951;</mi></mfenced><mo>=</mo></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>P</mi><mi>x</mi></msup><msup><mi>A</mi><mi>y</mi></msup><msup><mi>T</mi><mi>z</mi></msup><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><msup><mi mathvariant=\"normal\">M</mi><mn>1</mn></msup><msup><mi mathvariant=\"normal\">L</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mfenced open=\"[\" close=\"]\"><mrow><msup><mi mathvariant=\"normal\">M</mi><mn>1</mn></msup><msup><mi mathvariant=\"normal\">L</mi><mrow><mo>+</mo><mn>1</mn></mrow></msup><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced><mi mathvariant=\"normal\">x</mi></msup><msup><mfenced open=\"[\" close=\"]\"><msup><mi mathvariant=\"normal\">L</mi><mn>2</mn></msup></mfenced><mi>y</mi></msup><msup><mfenced open=\"[\" close=\"]\"><msup><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">T</mi></mrow><mn>1</mn></msup></mfenced><mi>z</mi></msup><mo>=</mo><msup><mi mathvariant=\"normal\">M</mi><mn>1</mn></msup><msup><mi mathvariant=\"normal\">L</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">x</mi></msup><msup><mi mathvariant=\"normal\">L</mi><mrow><mo>+</mo><mi mathvariant=\"normal\">x</mi><mo>+</mo><mn>2</mn><mi mathvariant=\"normal\">y</mi></mrow></msup><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mi mathvariant=\"normal\">x</mi><mo>+</mo><mi>z</mi></mrow></msup><mo>=</mo><msup><mi mathvariant=\"normal\">M</mi><mn>1</mn></msup><msup><mi mathvariant=\"normal\">L</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p><p>From above, we have&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>1</mn><mo>&#160;&#160;</mo><mspace linebreak=\"newline\"/><mi>x</mi><mo>+</mo><mn>2</mn><mi>y</mi><mo>=</mo><mo>-</mo><mn>1</mn><mo>&#160;&#160;</mo><mspace linebreak=\"newline\"/><mo>-</mo><mi>x</mi><mo>+</mo><mi>z</mi><mo>=</mo><mo>-</mo><mn>1</mn></math></p><p>Solving above three equations, we get&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mo>-</mo><mn>1</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">z</mi><mo>=</mo><mn>0</mn></math></p><p>So, Viscosity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced open=\"[\" close=\"]\"><mrow><msup><mi mathvariant=\"normal\">P</mi><mn>1</mn></msup><msup><mi mathvariant=\"normal\">A</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi mathvariant=\"normal\">T</mi><mn>0</mn></msup></mrow></mfenced></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "bd7552ec952246fd945bd214c96a92ca", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/XI5UkXx8OeZrE.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/XI5UkXx8OeZrE.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483703", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T09:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jul Shift 1)", "title": "JEE Main 2022 (25 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67e46", "previousYearPapers": [{"_id": "62c481f101514d218a7934db", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-29T09:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jun Shift 1)", "title": "JEE Main 2022 (29 Jun Shift 1)"}], "type": "singleCorrect", "level": 3, "question": {"text": "In van dar Wall equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><mrow><mi>P</mi><mo>+</mo><mfrac><mi>a</mi><msup><mi>V</mi><mn>2</mn></msup></mfrac></mrow></mfenced><mfenced open=\"[\" close=\"]\"><mrow><mi>V</mi><mo>-</mo><mi>b</mi></mrow></mfenced><mo>=</mo><mi>R</mi><mi>T</mi><mo>;</mo><mo>&#160;</mo><mi>P</mi></math> is pressure, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi></math> is volume, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> is universal gas constant and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> is temperature. The ratio of constants <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>a</mi><mi>b</mi></mfrac></math>&nbsp;is dimensionally equal to :", "image": null}, "options": [{"id": "ThYpn", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>P</mi><mi>V</mi></mfrac></math>", "isCorrect": false, "image": null}, {"id": "epEuJ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>V</mi><mi>P</mi></mfrac></math>", "isCorrect": false, "image": null}, {"id": "W2sr9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>V</mi></math>", "isCorrect": true, "image": null}, {"id": "MIxZW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mi>V</mi><mn>3</mn></msup></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>P</mi><mo>+</mo><mfrac><mi>a</mi><msup><mi>V</mi><mn>2</mn></msup></mfrac></mrow></mfenced><mfenced><mrow><mi>V</mi><mo>-</mo><mi>b</mi></mrow></mfenced><mo>=</mo><mi>n</mi><mi>R</mi><mi>T</mi></math></p><p>Dimensions of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>b</mi></math>&nbsp;should be equal to dimensions of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi></math>. Similarly, dimensions of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math>&nbsp;will be equal to dimensions of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mi>V</mi><mn>2</mn></msup></math>.</p><p>Therefore, dimensions of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mfrac><mi>a</mi><mi>b</mi></mfrac></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\"><mfrac><mrow><mi>P</mi><msup><mi>V</mi><mn>2</mn></msup></mrow><mi>V</mi></mfrac></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><mi>P</mi><mi>V</mi></mrow></mfenced></math>.&nbsp;</p>", "image": null}, "videoSolution": {"videoId": "31adaf069b984c3b8c2486cf1fe05637", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/LjLIkwN8o0fOv.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/LjLIkwN8o0fOv.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934db", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-29T09:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jun Shift 1)", "title": "JEE Main 2022 (29 Jun Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67cd3", "previousYearPapers": [{"_id": "62c481f101514d218a7934d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-28T09:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jun Shift 1)", "title": "JEE Main 2022 (28 Jun Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p><strong>Assertion A:</strong> Product of Pressure <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>P</mi></mfenced></math>&nbsp;and time <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>t</mi></mfenced></math> has the same dimension as that of coefficient of viscosity.</p><p><strong>Reason:</strong> Coefficient of viscosity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mo>&#160;</mo><mi>Force</mi><mo>&#160;</mo></mrow><mrow><mo>&#160;</mo><mi>Velocity</mi><mo>&#160;</mo><mi>gradient</mi><mo>&#160;</mo></mrow></mfrac></math></p>", "image": null}, "options": [{"id": "cvVeR", "text": "Both A&nbsp;and R&nbsp;true, and R&nbsp;is correct explanation of A.", "isCorrect": false, "image": null}, {"id": "oZJZx", "text": "Both A&nbsp;and R&nbsp;are true but R&nbsp;is NOT the correct explanation of A.", "isCorrect": false, "image": null}, {"id": "nalfo", "text": "A is true but R&nbsp;is false.", "isCorrect": true, "image": null}, {"id": "WLsFF", "text": "A is false but R&nbsp;is true.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Viscous force is given by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><mi>&#951;</mi><mi>A</mi><mfenced><mfrac><mrow><mo>d</mo><mi>v</mi></mrow><mrow><mo>d</mo><mi>t</mi></mrow></mfrac></mfenced></math>, here,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;is area and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>d</mo><mi>v</mi></mrow><mrow><mo>d</mo><mi>t</mi></mrow></mfrac></math>&nbsp;is velocity gradient.</p><p>Thus,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>=</mo><mfrac><mi>F</mi><mrow><mi>A</mi><mfenced><mstyle displaystyle=\"true\"><mfrac><mrow><mo>d</mo><mi>v</mi></mrow><mrow><mo>d</mo><mi>t</mi></mrow></mfrac></mstyle></mfenced></mrow></mfrac></math>.</p><p>Now,&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>t</mi><mo>=</mo><mfrac><mi>F</mi><mi>A</mi></mfrac><mi>t</mi><mo>=</mo><mi>&#951;</mi><mfenced><mfrac><mrow><mo>d</mo><mi>v</mi></mrow><mrow><mo>d</mo><mi>t</mi></mrow></mfrac></mfenced><mi>t</mi></math></p><p>Then,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mrow><mi>P</mi><mi>t</mi></mrow></mfenced><mo>=</mo><mi>M</mi><msup><mi>L</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi>T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo><mfenced close=\"]\" open=\"[\"><mi>&#951;</mi></mfenced></math></p><p>Thus, assertion is true but reason is false.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["ASSERTION_REASON"], "syllabusCategory": "noChange", "previousYear": {"_id": "62c481f101514d218a7934d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-28T09:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jun Shift 1)", "title": "JEE Main 2022 (28 Jun Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67bd2", "previousYearPapers": [{"_id": "62c481f101514d218a7934d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-27T14:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jun Shift 2)", "title": "JEE Main 2022 (27 Jun Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi><mo>,</mo><mi>C</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> are the self inductance, capacitance and resistance respectively, which of the following does not have the dimension of time?", "image": null}, "options": [{"id": "TVlX4", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mi>L</mi><mi>C</mi></msqrt></math>", "isCorrect": false, "image": null}, {"id": "4VIOQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>L</mi><mi>R</mi></mfrac></math>", "isCorrect": false, "image": null}, {"id": "HOC01", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mi>R</mi></math>", "isCorrect": false, "image": null}, {"id": "09ZGK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>L</mi><mi>C</mi></mfrac></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Dimensions of L is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mrow><mi>M</mi><msup><mi>L</mi><mn>2</mn></msup><msup><mi>T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><msup><mi>A</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced></math></p><p>Dimensions of C is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>M</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi>L</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><msup><mi>T</mi><mn>4</mn></msup><msup><mi>A</mi><mn>2</mn></msup></mrow></mfenced></math></p><p>And dimensions of R is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mrow><mi>M</mi><msup><mi>L</mi><mn>2</mn></msup><msup><mi>T</mi><mrow><mo>-</mo><mn>3</mn></mrow></msup><msup><mi>A</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced></math></p><p>Clearly, dimensions of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mi>L</mi><mi>C</mi></msqrt><mo>=</mo><mfenced close=\"]\" open=\"[\"><mi>T</mi></mfenced></math>,</p><p>Dimensions&nbsp;of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>L</mi><mi>R</mi></mfrac><mo>=</mo><mfenced close=\"]\" open=\"[\"><mi>T</mi></mfenced></math>,</p><p>Dimensions of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mi>R</mi><mo>=</mo><mfenced close=\"]\" open=\"[\"><mi>T</mi></mfenced></math>&nbsp;and</p><p>Dimensions of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>L</mi><mi>C</mi></mfrac><mo>=</mo><mfrac><mfenced open=\"[\" close=\"]\"><mrow><mi>M</mi><msup><mi>L</mi><mn>2</mn></msup><msup><mi>T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><msup><mi>A</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced><mfenced open=\"[\" close=\"]\"><mrow><msup><mi>M</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi>L</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><msup><mi>T</mi><mn>4</mn></msup><msup><mi>A</mi><mn>2</mn></msup></mrow></mfenced></mfrac><mo>=</mo><mfenced open=\"[\" close=\"]\"><mrow><msup><mi>M</mi><mn>2</mn></msup><msup><mi>L</mi><mn>4</mn></msup><msup><mi>T</mi><mrow><mo>-</mo><mn>6</mn></mrow></msup><msup><mi>A</mi><mrow><mo>-</mo><mn>4</mn></mrow></msup></mrow></mfenced><mo>=</mo><msup><mi>R</mi><mn>2</mn></msup></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["ODD_ONE_OUT"], "syllabusCategory": "noChange", "previousYear": {"_id": "62c481f101514d218a7934d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-27T14:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jun Shift 2)", "title": "JEE Main 2022 (27 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67bc5", "previousYearPapers": [{"_id": "62c481f101514d218a7934d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-27T14:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jun Shift 2)", "title": "JEE Main 2022 (27 Jun Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "The SI&nbsp;unit of a physical quantity is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Pascal</mi><mo>&#8208;</mo><mi>sec</mi></math>.&nbsp;The dimensional formula of this quantity will be&nbsp;", "image": null}, "options": [{"id": "UrLyS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><msup><mi>L</mi><mn>2</mn></msup><msup><mi>T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "isCorrect": false, "image": null}, {"id": "BcaWK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>M</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi>L</mi><mn>3</mn></msup><msup><mi>T</mi><mn>0</mn></msup></math>", "isCorrect": false, "image": null}, {"id": "zN8D2", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><msup><mi>L</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi>T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "isCorrect": true, "image": null}, {"id": "sVkDr", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><msup><mi>L</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi>T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Unit of Pascal is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>.</p><p>So, dimension of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Pascal</mi><mo>&#8208;</mo><mi>sec</mi></math>&nbsp;is&nbsp;</p><p>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mrow><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced><mfenced close=\"]\" open=\"[\"><mi mathvariant=\"normal\">s</mi></mfenced></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mi>M</mi><mi>L</mi><msup><mi>T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow><msup><mi>L</mi><mn>2</mn></msup></mfrac><mo>&#215;</mo><mi>T</mi><mo>=</mo><mi>M</mi><msup><mi>L</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi>T</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>&nbsp;</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-27T14:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jun Shift 2)", "title": "JEE Main 2022 (27 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67a5d", "previousYearPapers": [{"_id": "62c481f101514d218a7934d6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-26T14:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jun Shift 2)", "title": "JEE Main 2022 (26 Jun Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "The dimension of mutual inductance is", "image": null}, "options": [{"id": "kzG59", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>ML</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><msup><mi mathvariant=\"normal\">A</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "isCorrect": false, "image": null}, {"id": "OPvCu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>ML</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><msup><mi mathvariant=\"normal\">A</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "isCorrect": true, "image": null}, {"id": "LYI4P", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>ML</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>3</mn></mrow></msup><msup><mi mathvariant=\"normal\">A</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "isCorrect": false, "image": null}, {"id": "Gh8Mw", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>ML</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>3</mn></mrow></msup><msup><mi mathvariant=\"normal\">A</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The formula for mutual inductance is given by, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#949;</mi><mo>=</mo><mi>M</mi><mfrac><mrow><mi>d</mi><mi>I</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>&#160;</mo><mo>&#8658;</mo><mi>M</mi><mo>=</mo><mfrac><mi>&#949;</mi><mfenced><mstyle displaystyle=\"true\"><mfrac><mrow><mi>d</mi><mi>I</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mstyle></mfenced></mfrac></math></p><p>Dimension of&nbsp;emf or voltage is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mrow><mi mathvariant=\"normal\">M</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">L</mi><mn>2</mn></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">A</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced></math>,<br />Dimension of&nbsp;current is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mi mathvariant=\"normal\">A</mi></mfenced></math>,<br />Dimension of time&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mi mathvariant=\"normal\">T</mi></mfenced></math>.</p><p>Therefore, the dimension of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> is<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><mo>=</mo><mfrac><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>ML</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>3</mn></mrow></msup><msup><mi mathvariant=\"normal\">A</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced><mrow><mfenced close=\"]\" open=\"[\"><mi mathvariant=\"normal\">A</mi></mfenced><msup><mfenced close=\"]\" open=\"[\"><mi mathvariant=\"normal\">T</mi></mfenced><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><msup><mi>ML</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><msup><mi mathvariant=\"normal\">A</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow></mfenced></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934d6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-26T14:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jun Shift 2)", "title": "JEE Main 2022 (26 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67a03", "previousYearPapers": [{"_id": "62c481f001514d218a7934d5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-26T09:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jun Shift 1)", "title": "JEE Main 2022 (26 Jun Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "An expression for a dimensionless quantity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> is given by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mfrac><mi>&#945;</mi><mi>&#946;</mi></mfrac><msub><mi>log</mi><mi>e</mi></msub><mfenced><mfrac><mrow><mi>k</mi><mi>T</mi></mrow><mrow><mi>&#946;</mi><mi>x</mi></mrow></mfrac></mfenced></math>; where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#946;</mi></math> are constants, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math> is distance; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi></math> is Boltzmann constant and <math xmlns=\"http ttp://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced close=\"]\" open=\"[\"><mi>&#946;</mi></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\"><mfrac><mrow><mi>k</mi><mi>T</mi></mrow><mi>x</mi></mfrac></mfenced><mo>=</mo><msup><mi>ML</mi><mn>2</mn></msup><msup><mi mathvariant=\"normal\">T</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#215;</mo><mi mathvariant=\"normal\">K</mi><mo>&#215;</mo><msup><mi mathvariant=\"normal\">L</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo><msup><mi>MLT</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math></p><p>Since&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math>&nbsp;is dimensionless&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mfenced close=\"]\" open=\"[\"><mi>p</mi></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\"><mfrac><mi>&#945;</mi><mi>&#946;</mi></mfrac></mfenced><mo>=</mo><msup><mi mathvariant=\"normal\">M</mi><mn>0</mn></msup><msup><mi mathvariant=\"normal\">L</mi><mn>0</mn></msup><msup><mi mathvariant=\"normal\">T</mi><mn>0</mn></msup></math>&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced close=\"]\" open=\"[\"><mi>&#945;</mi></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\"><mi>&#946;</mi></mfenced></math>&nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced close=\"]\" open=\"[\"><mi>&#945;</mi></mfenced><mo>=</mo><msup><mi>MLT</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "62c481f001514d218a7934d5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-26T09:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jun Shift 1)", "title": "JEE Main 2022 (26 Jun Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": mId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T14:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 2)", "title": "JEE Main 2019 (11 Jan Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "If speed (V), acceleration (A) and force (F) are considered\r\n\r\nas fundamental units, the dimension of Young's modulus\r\n\r\nwill be :", "image": null}, "options": [{"id": "hffJy", "text": "$\\mathrm{V}^{-2} \\mathrm{~A}^{2} \\mathrm{~F}^{-2}$", "isCorrect": false, "image": null}, {"id": "TkWcC", "text": "$\\mathrm{V}^{-2} \\mathrm{~A}^{2} \\mathrm{~F}^{2}$", "isCorrect": false, "image": null}, {"id": "AbC4I", "text": "$\\mathrm{V}^{-4} \\mathrm{~A}^{-2} \\mathrm{~F}$", "isCorrect": false, "image": null}, {"id": "x15nn", "text": "$\\mathrm{V}^{-4} \\mathrm{~A}^{2} \\mathrm{~F}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let [Y] = [V] $^{a}[\\mathrm{~F}]^{\\mathrm{b}}[\\mathrm{A}]^{\\mathrm{c}}$\r\n\r\n$\\left[\\mathrm{ML}^{-1} \\mathrm{~T}^{-2}\\right]=\\left[\\mathrm{LT}^{-1}\\right]^{\\mathrm{a}}\\left[\\mathrm{MLT}^{-2}\\right]^{\\mathrm{b}}\\left[\\mathrm{LT}^{-2}\\right]^{\\mathrm{c}}$\r\n\r\n$\\left[\\mathrm{ML}^{-1} \\mathrm{~T}^{-2}\\right]=\\left[\\mathrm{M}^{b} \\mathrm{~L}^{\\mathrm{a}+b+\\mathrm{c}} \\mathrm{T}^{-\\mathrm{a}-2 \\mathrm{~b}-2 \\mathrm{c}}\\right]$\r\n\r\nComparing power both side of similar terms we get,\r\n\r\n$b=1, a+b+c=-1,-a-2 b-2 c=-2$\r\n\r\nsolving above equations we get\r\n\r\n$a=-4, b=1, c=2$\r\n\r\nso $[\\mathrm{Y}]=\\left[\\mathrm{V}^{-4} \\mathrm{FA}^{2}\\right]=\\left[\\mathrm{V}^{-4} \\mathrm{~A}^{2} \\mathrm{~F}\\right]$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ed", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T14:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 2)", "title": "JEE Main 2019 (11 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d66743", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7ec", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T09:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 1)", "title": "JEE Main 2019 (11 Jan Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "The force of interaction between two atoms is given by $F=\\alpha \\beta \\exp \\left(-\\frac{x^{2}}{\\alpha k T}\\right) ;$ where $x$ is the distance, $\\mathrm{k}$ is the\r\n\r\nBoltzmann constant and T is temperature and $\\alpha$ and $\\beta$ are two constants. The dimensions of $\\beta$ is:", "image": null}, "options": [{"id": "ZpwWJ", "text": "$\\mathrm{M}^{0} \\mathrm{~L}^{2} \\mathrm{~T}^{-4}$", "isCorrect": false, "image": null}, {"id": "CNf59", "text": "$\\mathrm{M}^{2} \\mathrm{LT}^{-4}$", "isCorrect": true, "image": null}, {"id": "Gx0tN", "text": "$\\mathrm{MLT}^{-2}$", "isCorrect": false, "image": null}, {"id": "cpS9M", "text": "$\\mathrm{M}^{2} \\mathrm{~L}^{2} \\mathrm{~T}^{-2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Force of interaction between two atoms,\r\n\r\n$\\mathrm{F}=\\alpha \\beta \\mathrm{e}^{\\left(\\frac{-\\mathrm{x}^{2}}{\\alpha \\mathrm{kT}}\\right)}$\r\n\r\nSince exponential terms are dimensionless $\\therefore\\left[\\frac{\\mathrm{x}^{2}}{\\alpha \\mathrm{k} \\mathrm{T}}\\right]=\\mathrm{M}^{0} \\mathrm{~L}^{0} \\mathrm{~T}^{0}$\r\n\r\n$\\Rightarrow \\frac{\\mathrm{L}^{2}}{[\\alpha] \\mathrm{ML}^{2} \\mathrm{~T}^{-2}}=\\mathrm{M}^{0} \\mathrm{~L}^{0} \\mathrm{~T}^{0}$\r\n\r\n$\\Rightarrow[\\alpha]=\\mathrm{M}^{-1} \\mathrm{~T}^{2}$\r\n\r\n$[\\mathrm{F}]=[\\alpha][\\beta]$\r\n\r\n$\\mathrm{MLT}^{-2}=\\mathrm{M}^{-1} \\mathrm{~T}^{2}[\\beta]$\r\n\r\n$\\Rightarrow[\\beta]=M^{2} L T^{-4}$", "image": null}, "videoSolution": {"videoId": "e762e66943f44c5798dd09bf850ac40e", "provider": "vdocipher", " n": "2014-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2014 (12 Apr Online)", "title": "JEE Main 2014 (12 Apr Online)"}], "question": {"text": "From the following combinations of physical constants (expressed through their usual symbols) the only combination, that would have the same value in different systems of units, is:", "image": null}, "options": [{"id": "khR8e", "text": "\n$\\frac{\\mathrm{ch}}{2 \\pi \\varepsilon_{\\mathrm{o}}^2}$\n", "image": null, "isCorrect": false}, {"id": "Y1nPm", "text": "\n$\\frac{\\mathrm{e}^2}{2 \\pi \\varepsilon_{\\mathrm{o}} \\mathrm{Gm}_{\\mathrm{e}}^2}$\n", "image": null, "isCorrect": true}, {"id": "eoDzy", "text": "\n$\\frac{\\mu_{\\mathrm{o}} \\varepsilon_{\\mathrm{o}}}{\\mathrm{c}^2} \\frac{\\mathrm{G}}{\\mathrm{he}^2}$\n", "image": null, "isCorrect": false}, {"id": "ip5vk", "text": "\n$\\frac{2 \\pi \\sqrt{\\mu_{\\mathrm{o}} \\varepsilon_{\\mathrm{o}}}}{\\mathrm{ce}^2} \\frac{\\mathrm{h}}{\\mathrm{G}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The dimensional formulae of\n$$\n\\begin{aligned}\n&\\mathrm{e}=\\left[\\mathrm{M}^0 \\mathrm{~L}^0 \\mathrm{~T}^1 \\mathrm{~A}^1\\right] \\\\\n&\\varepsilon_0=\\left[\\mathrm{M}^{-1} \\mathrm{~L}^3 \\mathrm{~T}^4 \\mathrm{~A}^2\\right] \\\\\n&\\mathrm{G}=\\left[\\mathrm{M}^{-1} \\mathrm{~L}^3 \\mathrm{~T}^{-2}\\right] \\\\\n&\\text { and } \\mathrm{m}_{\\mathrm{e}}=\\left[\\mathrm{M}^1 \\mathrm{~L}^0 \\mathrm{~T}^0\\right] \\\\\n&\\text { Now, } \\frac{\\mathrm{e}^2}{2 \\pi \\varepsilon_0 \\mathrm{Gm}_{\\mathrm{e}}^2} \\\\\n&=\\frac{\\left[\\mathrm{M}^0 \\mathrm{~L}^0 \\mathrm{~T}^1 \\mathrm{~A}^1\\right]^2}{2 \\pi\\left[\\mathrm{M}^{-1} \\mathrm{~L}^{-3} \\mathrm{~T}^4 \\mathrm{~A}^2\\right]\\left[\\mathrm{M}^{-1} \\mathrm{~L}^3 \\mathrm{~T}^{-2}\\right]\\left[\\mathrm{M}^1 \\mathrm{~L}^0 \\mathrm{~T}^0\\right]^2}\n\\end{aligned}\n$$\n\n$$\n\\begin{aligned}\n&=\\frac{\\left[\\mathrm{T}^2 \\mathrm{~A}^2\\right]}{2 \\pi\\left[\\mathrm{M}^{-1-1+2} \\mathrm{~L}^{-3+3} \\mathrm{~T}^{4-2} \\mathrm{~A}^2\\right]} \\\\\n&=\\frac{\\left[\\mathrm{T}^2 \\mathrm{~A}^2\\right]}{2 \\pi\\left[\\mathrm{M}^0 \\mathrm{~L}^0 \\mathrm{~T}^2 \\mathrm{~A}^2\\right]}=\\frac{1}{2 \\pi}\n\\end{aligned}\n$$\n$\\because \\frac{1}{2 \\pi}$ is dimensionless thus the combination\n\n$\\frac{\\mathrm{e}^2}{2 \\pi \\varepsilon_0 \\mathrm{Gm}_{\\mathrm{e}}^2}$ would have the same value in different systems of units.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2014 (12 Apr Online)", "title": "JEE Main 2014 (12 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65dc5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2014 (11 Apr Online)", "title": "JEE Main 2014 (11 Apr Online)"}], "question": {"text": "In terms of resistance $R$ and time $T$, the dimensions of ratio $\\frac{\\mu}{\\varepsilon}$ of the permeability $\\mu$ and permittivity $\\varepsilon$ is:", "image": null}, "options": [{"id": "yoU7R", "text": "\n$\\left[\\mathrm{RT}^{-2}\\right]$\n", "image": null, "isCorrect": false}, {"id": "mycXQ", "text": "\n$\\left[\\mathrm{R}^2 \\mathrm{~T}^{-1}\\right]$\n", "image": null, "isCorrect": false}, {"id": "Xq5KU", "text": "\n$\\left[\\mathrm{R}^2\\right]$\n", "image": null, "isCorrect": true}, {"id": "uQC69", "text": "\n$\\left[\\mathrm{R}^2 \\mathrm{~T}^2\\right]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Dimensions of $\\mu=\\left[\\right.$ MLT $\\left.^{-2} \\mathrm{~A}^{-2}\\right]$\nDimensions of $\\in=\\left[\\mathrm{M}^{-1} \\mathrm{~L}^{-3} \\mathrm{~T}^4 \\mathrm{~A}^2\\right]$\nDimensions of $\\mathrm{R}=\\left[\\mathrm{ML}^2 \\mathrm{~T}^{-3} \\mathrm{~A}^{-2}\\right]$\n$$\n\\begin{aligned}\n&\\therefore \\frac{\\text { Dimensions of } \\mu}{\\text { Dimensions of } e}=\\frac{\\left[\\mathrm{MLT}^{-2} \\mathrm{~A}^{-2}\\right]}{\\left[\\mathrm{M}^{-1} \\mathrm{~L}^{-3} \\mathrm{~T}^4 \\mathrm{~A}^2\\right]} \\\\\n&=\\left[\\mathrm{M}^2 \\mathrm{~L}^4 \\mathrm{~T}^{-6} \\mathrm{~A}^{-4}\\right]=\\left[\\mathrm{R}^2\\right]\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2014 (11 Apr Online)", "title": "JEE Main 2014 (11 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65c72", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-23T09:00:00.000Z", "isVisible": true, "shortName": "2013 (23 Apr Online)", "title": "JEE Main 2013 (23 Apr Online)"}], "question": {"text": "If the time period $t$ of the oscillation of a drop of liquid of density $d$, radius $r$, vibrating under surface tension $s$ is given by the formula $t=\\sqrt{r^{2 b} s^c d^{a / 2}}$. It is observed that the time period is directly proportional to $\\sqrt{\\frac{d}{s}}$. The value of $b$ should therefore be :", "image": null}, "options": [{"id": "uyH8J", "text": "\n$\\frac{3}{4}$\n", "image": null, "isCorrect": false}, {"id": "1DCP4", "text": "\n$\\sqrt{3}$\n", "image": null, "isCorrect": false}, {"id": "u0jDI", "text": "\n$\\frac{3}{2}$\n", "image": null, "isCorrect": true}, {"id": "xt4XF", "text": "\n$\\frac{2}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution Available", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-23T09:00:00.000Z", "isVisible": true, "shortName": "2013 (23 Apr Online)", "title": "JEE Main 2013 (23 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65c0c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-22T09:00:00.000Z", "isVisible": true, "shortName": "2013 (22 Apr Online)", "title": "JEE Main 2013 (22 Apr Online)"}], "question": {"text": "The dimensions of angular momentum, latent heat and capacitance are, respectively.", "image": null}, "options": [{"id": "XpsPr", "text": "\n$\\mathrm{ML}^2 \\mathrm{~T}^1 \\mathrm{~A}^2, \\mathrm{~L}^2 \\mathrm{~T}^{-2}, \\mathrm{M}^{-1} \\mathrm{~L}^{-2} \\mathrm{~T}^2$\n", "image": null, "isCorrect": false}, {"id": "VITHN", "text": "\n$\\mathrm{ML}^2 \\mathrm{~T}^{-2}, \\mathrm{~L}^2 \\mathrm{~T}^2, \\mathrm{M}^{-1} \\mathrm{~L}^{-2} \\mathrm{~T}^4 \\mathrm{~A}^2$\n", "image": null, "isCorrect": false}, {"id": "hoby4", "text": "\n$\\mathrm{ML}^2 \\mathrm{~T}^{-1}, \\mathrm{~L}^2 \\mathrm{~T}^{-2}, \\mathrm{ML}^2 \\mathrm{TA}^2$\n", "image": null, "isCorrect": false}, {"id": "XEwAp", "text": "\n$\\mathrm{ML}^2 \\mathrm{~T}^{-1}, \\mathrm{~L}^2 \\mathrm{~T}^{-2}, \\mathrm{M}^{-1} \\mathrm{~L}^{-2} \\mathrm{~T}^4 \\mathrm{~A}^2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Angular momentum $=\\mathrm{m} \\times \\mathrm{v} \\times \\mathrm{r}$\n$$\n=\\mathrm{ML}^2 \\mathrm{~T}^{-1}\n$$\nLatent heat $\\mathrm{L}=\\frac{\\mathrm{Q}}{\\mathrm{m}}=\\frac{\\mathrm{ML}^2 \\mathrm{~T}^{-2}}{\\mathrm{M}}=\\mathrm{L}^2 \\mathrm{~T}^{-2}$\nCapacitance $\\mathrm{C}=\\frac{\\text { Charge }}{\\text { P.d. }}=\\mathrm{M}^{-1} \\mathrm{~L}^{-2} \\mathrm{~T}^4 \\mathrm{~A}^2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-22T09:00:00.000Z", "isVisible": true, "shortName": "2013 (22 Apr Online)", "title": "JEE Main 2013 (22 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65bc1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2013 (09 Apr Online)", "title": "JEE Main 2013 (09 Apr Online)"}], "question": {"text": "From the following, the quantity (constructed from the basic constants of nature), that has the dimensions, as well as correct order of magnitude, vis-a-vis typical atomic size, is:", "image": null}, "options": [{"id": "55h8h", "text": "\n$\\frac{e^2}{4 \\pi \\varepsilon_0 m c^2}$\n", "image": null, "isCorrect": true}, {"id": "P8fvE", "text": "\n$\\frac{4 \\pi \\varepsilon_0 e^2}{m e^2}$\n", "image": null, "isCorrect": false}, {"id": "BEBJy", "text": "\n$\\frac{m e^2}{4 \\pi \\varepsilon_0 b^2}$\n", "image": null, "isCorrect": false}, {"id": "j1Rgb", "text": "\n$\\frac{4 \\pi \\varepsilon_0 m c^2}{e^2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As $\\mathrm{E}=\\mathrm{mc}^2$\nalso $\\mathrm{E}=\\mathrm{F} \\cdot \\mathrm{s}=\\frac{\\mathrm{kq} \\cdot \\mathrm{q}}{\\mathrm{r}^2} \\cdot \\mathrm{r}$\nTherefore dimensionally\n$\\begin{aligned}\n& \\mathrm{mc}^2=\\frac{1}{4 \\pi \\epsilon_0} \\frac{\\mathrm{q}^2}{\\mathrm{r}} \\\\\n& \\Rightarrow \\mathrm{r}=\\frac{\\mathrm{e}^2}{4 \\pi \\epsilon_0 \\mathrm{mc}^2}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": o>&isin;</mo> <mn>0</mn> </msub> </mrow> </mfenced> <mo>=</mo> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <msup> <mtext>M</mtext> <mn>-1</mn> </msup> <msup> <mtext>&nbsp;L</mtext> <mrow> <mo>-</mo> <mn>3</mn> </mrow> </msup> <msup> <mtext>&nbsp;T</mtext> <mn>2</mn> </msup> <mtext>&nbsp;A</mtext> </mrow> </mfenced> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "CciI8", "text": "<math> <mrow> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <msub> <mo>&isin;</mo> <mn>0</mn> </msub> </mrow> </mfenced> <mo>=</mo> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <msup> <mtext>M</mtext> <mn>-1</mn> </msup> <msup> <mtext>&nbsp;L</mtext> <mrow> <mo>-</mo> <mn>3</mn> </mrow> </msup> <msup> <mtext>&nbsp;T</mtext> <mn>4</mn> </msup> <msup> <mtext>&nbsp;A</mtext> <mn>2</mn> </msup> </mrow> </mfenced> </mrow> </math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math> <mrow> <mtext>F</mtext> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>4</mn> <mi>&pi;</mi> <msub> <mi>&epsilon;</mi> <mn>0</mn> </msub> </mrow> </mfrac> <mfrac> <mrow> <msub> <mtext>q</mtext> <mn>1</mn> </msub> <msub> <mtext>q</mtext> <mn>2</mn> </msub> </mrow> <mrow> <msup> <mtext>R</mtext> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <msub> <mi>&epsilon;</mi> <mn>0</mn> </msub> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>q</mtext> <mn>1</mn> </msub> <msub> <mtext>q</mtext> <mn>2</mn> </msub> </mrow> <mrow> <mn>4</mn> <mi>&pi;</mi> <msup> <mtext>FR</mtext> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </math><br /><br />Hence, <math> <mrow> <msub> <mi>&epsilon;</mi> <mn>0</mn> </msub> <mo>=</mo> <mfrac> <mrow> <msup> <mtext>C</mtext> <mn>2</mn> </msup> </mrow> <mrow> <msup> <mtext>N . m</mtext> <mn>2</mn> </msup> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <msup> <mrow> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mtext>AT</mtext> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> </mrow> <mrow> <mtext>ML</mtext><msup> <mtext>T</mtext><mrow> <mo>-</mo> <mn>2</mn> </mrow> </msup> <msup> <mtext>. L</mtext> <mn>2</mn> </msup> </mrow> </mfrac> <mo>=</mo> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <msup> <mtext>M</mtext> <mn>-1</mn> </msup> <msup> <mtext>&nbsp;L</mtext> <mrow> <mo>-</mo> <mn>3</mn> </mrow> </msup> <msup> <mtext>&nbsp;T</mtext> <mn>4</mn> </msup> <msup> <mtext>&nbsp;A</mtext> <mn>2</mn> </msup> </mrow> </mfenced> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6485", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2013 (07 Apr)", "title": "JEE Main 2013 (07 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65aa4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-26T09:00:00.000Z", "isVisible": true, "shortName": "2012 (26 May Online)", "title": "JEE Main 2012 (26 May Online)"}], "question": {"text": "The electrical resistance $R$ of a conductor of length $l$ and area of cross section $a$ is given by $R=\\frac{\\rho l}{a}$ where ' $\\rho$ ' is the electrical resistivity. What is the dimensional formula for electrical conductivity ' $\\sigma$ ' which is reciprocal of resistivity?", "image": null}, "options": [{"id": "nxjB0", "text": "\n$\\left[M^{-1} L^{-3} T^3 A^2\\right]$\n", "image": null, "isCorrect": true}, {"id": "KxegJ", "text": "\n$\\left[M L^{-3} T^{-3} A^2\\right]$\n", "image": null, "isCorrect": false}, {"id": "fNFBS", "text": "\n$\\left[M L^3 T^{-3} A^{-2}\\right]$\n", "image": null, "isCorrect": false}, {"id": "uR9ag", "text": "\n$\\left[M^{-2} L^3 T^2 A^{-1}\\right]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Dimensional formula for electrical resistivity, $\\rho=\\left[\\mathrm{ML}^3 \\mathrm{~T}^{-3} \\mathrm{~A}^{-2}\\right]$ Dimensional formula for electrical conductivity, $\\sigma=\\frac{1}{\\rho}$ is $\\left[\\mathrm{M}^{-1} \\mathrm{~L}^{-3} \\mathrm{~T}^3 \\mathrm{~A}^2\\right]$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-26T09:00:00.000Z", "isVisible": true, "shortName": "2012 (26 May Online)", "title": "JEE Main 2012 (26 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d6599d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-07T09:00:00.000Z", "isVisible": true, "shortName": "2012 (07 May Online)", "title": "JEE Main 2012 (07 May Online)"}], "question": {"text": "Given that $K=$ energy, $V=$ velocity, $T=$ time. If they are chosen as the fundamental units, then what is dimensional formula for surface tension?", "image": null}, "options": [{"id": "AuBac", "text": "\n$\\left[K V^{-2} \\mathrm{~T}^{-2}\\right]$\n", "image": null, "isCorrect": true}, {"id": "YfCLH", "text": "\n$\\left[K^2 V^2 T^{-2}\\right]$\n", "image": null, "isCorrect": false}, {"id": "wCYrI", "text": "\n$\\left[K^2 V^{-2} T^{-2}\\right]$\n", "image": null, "isCorrect": false}, {"id": "qMsNK", "text": "\n$\\left[K V^2 T^2\\right]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Surface tension $=\\frac{F}{\\ell}=\\frac{F}{\\ell} \\cdot \\frac{\\ell}{\\ell} \\cdot \\frac{T^2}{T^2}$ (As, $F . \\ell=K\\left(\\right.$ energy) $; \\frac{T^2}{\\ell^2}=V^{-2}$ ) Therefore, surface tension $=\\left[K V^{-2} T^{-2}\\right]$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615 id": "69d806e28b80d82dea5b7dda", "title": "JEE Main 2026 (06 April Shift 2)", "shortName": "2026 (06 April Shift 2)", "isVisible": true, "heldOn": "2026-04-06T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Main';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
