, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5ca6d4514bf2d9760b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-23T14:00:00.000Z", "isVisible": true, "shortName": "2025 (23 Jan Shift 2)", "title": "JEE Main 2025 (23 Jan Shift 2)"}], "question": {"text": "Match List - I with List - II.\n$$\n\\begin{array}{llll} \n& \\text { List - I } & & \\text { List - II } \\\\\n\\text { (A) } & \\text { Permeability of free space } & \\text { (I) }\\left[\\mathrm{M} \\mathrm{~L}^2 \\mathrm{~T}^{-2}\\right] \\\\\n\\text { (B) } & \\text { Magnetic field } & \\text { (II) }\\left[\\mathrm{M} \\mathrm{~T}^{-2} \\mathrm{~A}^{-1}\\right] \\\\\n\\text { (C) } & \\text { Magnetic moment } & \\text { (III) }\\left[\\mathrm{M} \\mathrm{~L} \\mathrm{~T}^{-2} \\mathrm{~A}^{-2}\\right] \\\\\n\\text { (D) } & \\text { Torsional constant } & \\text { (IV) }\\left[\\mathrm{L}^2 \\mathrm{~A}\\right]\n\\end{array}\n$$\n\nChoose the correct answer from the options given below :", "image": null}, "options": [{"id": "cSf1z", "text": "(A)-(IV), (B)-(III), (C)-(I), (D)-(II)", "image": null, "isCorrect": false}, {"id": "3uZuv", "text": "(A)-(III), (B)-(II), (C)-(IV), (D)-(I)", "image": null, "isCorrect": true}, {"id": "4Sn42", "text": "(A)-(I), (B)-(IV), (C)-(II), (D)-(III)", "image": null, "isCorrect": false}, {"id": "E1gBZ", "text": "(A)-(II), (B)-(I), (C)-(III), (D)-(IV)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(A) $B=\\frac{\\mu_0 i}{2 \\pi r} \\& q v B=F$\n$\\mu_0 \\equiv \\frac{B r}{i} \\equiv \\frac{F r}{q v i} \\equiv \\frac{\\mathrm{MLT}^{-2} \\times L}{\\mathrm{~A}^2 \\mathrm{TLT}^{-1}} \\equiv \\mathrm{MLT}^{-2} A^{-2}$\n(B) $B \\equiv \\frac{F}{q V} \\equiv \\frac{\\mathrm{MLT}^{-2}}{\\mathrm{ATLT}^{-1}}=\\mathrm{MT}^{-2} \\mathrm{~A}^{-1}$\n(C) $M=i A \\equiv \\mathrm{AL}^2$\n(D) $\\tau=C \\theta \\Rightarrow C \\equiv \\mathrm{ML}^2 \\mathrm{~T}^{-2}$", "image": null}, "videoSolution": {"videoId": "4be2d05a26eb498087ae28d4a9173d59", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/hUUZB65qKL6SM.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/hUUZB65qKL6SM.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionStructure": ["MATCH_THE_LIST"], "syllabusCategory": "noChange", "previousYear": {"_id": "67a2eb5ca6d4514bf2d9760b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-23T14:00:00.000Z", "isVisible": true, "shortName": "2025 (23 Jan Shift 2)", "title": "JEE Main 2025 (23 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d68556", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6492", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 Apr Shift 1)", "title": "JEE Main 2023 (11 Apr Shift 1)"}], "question": {"text": "Given below are two statements :<br /><strong>Statement I :</strong> Astronomical unit (Au), Parsec (Pc) and Light year (ly) are units for measuring astronomical distances.<br /><strong>Statement II :</strong> Au &lt; Parsec (Pc) &lt; ly<br />In the light of the above statements, choose the most appropriate answer from the options given below:", "image": null}, "options": [{"id": "PXu6P", "text": "Both Statements I and Statements II are incorrect", "image": null, "isCorrect": false}, {"id": "MQzh7", "text": "Statements I is correct but Statements II is incorrect", "image": null, "isCorrect": true}, {"id": "x1v5G", "text": "Both Statements I and Statements II are correct", "image": null, "isCorrect": false}, {"id": "kr8Zh", "text": "Statements I is incorrect but Statements II is correct", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Astronomical unit denotes&nbsp;roughly the distance from Earth to the Sun. Parsec is a unit of length used to measure the large distances to astronomical objects outside the Solar System.&nbsp;A light-year&nbsp;is another large unit of length used to express astronomical distances.</p><p>The relation between these units are as follows:</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mtext>&#160;Parsec&#160;</mtext><mo>=</mo><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&#160;</mo><mi>Au</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mi>Au</mi><mo>=</mo><mn>1</mn><mo>.58</mo><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>&#8722;</mo><mn>5</mn></mrow></msup><mo>&#160;</mo><mi>ly</mi></math></p><p>Thus,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mi>Au</mi><mo>&#60;</mo><mtext>&#160;ly&#160;</mtext><mo>&#60;</mo><mtext>&#160;Parsec&#160;</mtext></math>.</p><p>Hence,&nbsp;Statements I is true but Statements II is false.</p>", "image": null}, "videoSolution": {"videoId": "50d0dcc364804cb8a4e0af35716fa383", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/PXdVStR2yiwlR.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/PXdVStR2yiwlR.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionStructure": ["TWO_STATEMENT_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "648b5a3a0d9d0b909f7b6492", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 Apr Shift 1)", "title": "JEE Main 2023 (11 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d68227", "previousYearPapers": [{"_id": "63f499871d196b49d9cd6b10", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 2)", "title": "JEE Main 2023 (30 Jan Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Match List I with List II</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 500px;\">\t<tbody>\t\t<tr>\t\t\t<td>&nbsp;</td>\t\t\t<td><strong>List I</strong></td>\t\t\t<td>&nbsp;</td>\t\t\t<td><strong>List II</strong></td>\t\t</tr>\t\t<tr>\t\t\t<td>A</td>\t\t\t<td>Torque</td>\t\t\t<td>I</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>kg</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>&#8211;</mo><mn>1</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>&#8211;</mo><mn>2</mn></mrow></msup></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>B</td>\t\t\t<td>Energy density</td>\t\t\t<td>II</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>kg</mi><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>&#8211;</mo><mn>1</mn></mrow></msup></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>C</td>\t\t\t<td>Pressure gradient</td>\t\t\t<td>III</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>kg</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>&#8211;</mo><mn>2</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>&#8211;</mo><mn>2</mn></mrow></msup></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>D</td>\t\t\t<td>Impulse</td>\t\t\t<td>IV</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>kg</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>&#8211;</mo><mn>2</mn></mrow></msup></math></td>\t\t</tr>\t</tbody></table><p>Choose the correct answer from the options given below :</p>", "image": null}, "options": [{"id": "e4EBU", "text": "A-IV, B-III, C-I, D-II", "isCorrect": false, "image": null}, {"id": "X2j6e", "text": "A-I, B-IV, C-III, D-II", "isCorrect": false, "image": null}, {"id": "P480E", "text": "A-IV, B-I, C-II, D-III", "isCorrect": false, "image": null}, {"id": "y7aI9", "text": "A-IV, B-I, C-III, D-II", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Unit of force is written as,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>kg</mi><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>.</p><p>Now, torque can be written as,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#964;</mi><mo>=</mo><mi>F</mi><mi>s</mi></math>&nbsp;therefore its unit can be written as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>kg</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>&#8211;</mo><mn>2</mn></mrow></msup></math>.</p><p>Pressure is given by,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mfrac><mi>F</mi><mi>A</mi></mfrac></math>, therefore unit of pressure will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>kg</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>.</p><p>Now, pressure gradient is given by ratio of pressure and distance, so its unit will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>kg</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>.</p><p>Impulse is given by product of force and time, so its unit will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>kg</mi><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>.</p><p>As we know unit of torque and energy is the same, therefore energy density can written as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mtext>energy</mtext><mtext>volume</mtext></mfrac><mo>=</mo><mi>kg</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>&#8211;</mo><mn>2</mn></mrow></msup></math>.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["MATCH_THE_LIST"], "syllabusCategory": "noChange", "previousYear": {"_id": "63f499871d196b49d9cd6b10", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 2)", "title": "JEE Main 2023 (30 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d681cb", "previousYearPapers": [{"_id": "63f499861d196b49d9cd6b0f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 1)", "title": "JEE Main 2023 (30 Jan Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Electric field in a certain region is given by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>E</mi><mo>&#8594;</mo></mover><mo>=</mo><mfenced><mrow><mfrac><mi>A</mi><msup><mi>x</mi><mn>2</mn></msup></mfrac><mover><mi mathvariant=\"normal\">i</mi><mo>^</mo></mover><mo>+</mo><mfrac><mi>B</mi><msup><mi>y</mi><mn>3</mn></msup></mfrac><mover><mi mathvariant=\"normal\">j</mi><mo>^</mo></mover></mrow></mfenced></math>. The SI unit of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> are :", "image": null}, "options": [{"id": "fzgOr", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>3</mn></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "isCorrect": false, "image": null}, {"id": "w8CWR", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>3</mn></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "isCorrect": true, "image": null}, {"id": "1JR0z", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>3</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">C</mi><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">C</mi></math>", "isCorrect": false, "image": null}, {"id": "8WDel", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">C</mi><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>3</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">C</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>E</mi><mo>&#8594;</mo></mover><mo>=</mo><mfrac><mi>A</mi><msup><mi>x</mi><mn>2</mn></msup></mfrac><mover><mi>i</mi><mo>^</mo></mover><mo>+</mo><mfrac><mi>B</mi><msup><mi>y</mi><mn>3</mn></msup></mfrac><mover><mi>j</mi><mo>^</mo></mover></math></p><p>Here, the units of &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>A</mi><msup><mi>x</mi><mn>2</mn></msup></mfrac></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>B</mi><msup><mi>y</mi><mn>3</mn></msup></mfrac></math>&nbsp;is equal to unit of electric field.</p><p>The unit of electric field is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>.</p><p>So, the SI unit of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> is&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mfrac><mi>A</mi><msup><mi>x</mi><mn>2</mn></msup></mfrac></mfenced><mo>=</mo><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#8658;</mo><mfenced close=\"]\" open=\"[\"><mi>A</mi></mfenced><mo>=</mo><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p><p>And&nbsp;the SI unit of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mfrac><mi>B</mi><msup><mi>y</mi><mn>3</mn></msup></mfrac></mfenced><mo>=</mo><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo>< rrect answer is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi>III</mi><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi>IV</mi><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi>II</mi><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">D</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi></math>.</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["MATCH_THE_LIST"], "syllabusCategory": "noChange", "previousYear": {"_id": "63134c746e7bc9b33248370c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-29T14:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jul Shift 2)", "title": "JEE Main 2022 (29 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d6757c", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf81e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-27T14:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Aug Shift 2)", "title": "JEE Main 2021 (27 Aug Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Match List-<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">I</mi></mfenced></math> with List-<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>II</mi></mfenced></math>.</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 500px;\">\t<tbody>\t\t<tr>\t\t\t<td>&nbsp;</td>\t\t\t<td>List-<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">I</mi></mfenced></math></td>\t\t\t<td>&nbsp;</td>\t\t\t<td>List-<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>II</mi></mfenced></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>a</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">H</mi></msub></math>&nbsp;(Rydberg constant)</td>\t\t\t<td>i</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>kg</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>b</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math>&nbsp;(Planck&#39;s constant)</td>\t\t\t<td>ii</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>kg</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup><msup><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>c</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#956;</mi><mi mathvariant=\"normal\">B</mi></msub></math> (Magnetic field energy density)</td>\t\t\t<td>iii</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>d</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi></math> (coefficient of viscosity)</td>\t\t\t<td>iv</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>kg</mi><mo>&#160;</mo><msup><mtext>m</mtext><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup></math></td>\t\t</tr>\t</tbody></table><p>Choose the most appropriate answer from the options given below:</p>", "image": null}, "options": [{"id": "WzCZp", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">a</mi><mo>)</mo><mo>-(</mo><mi>iv</mi><mo>),</mo><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">b</mi><mo>)-(</mo><mi>ii</mi><mo>),</mo><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">c</mi><mo>)-(</mo><mi mathvariant=\"normal\">i</mi><mo>),</mo><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">d</mi><mo>)-(</mo><mi>iii</mi><mo>)</mo></math>", "isCorrect": false, "image": null}, {"id": "HYhmz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">a</mi><mo>)</mo><mo>-</mo><mo>(</mo><mi>ii</mi><mo>)</mo><mo>,</mo><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">b</mi><mo>)</mo><mo>-</mo><mo>(</mo><mi>iii</mi><mo>)</mo><mo>,</mo><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">c</mi><mo>)</mo><mo>-</mo><mo>(</mo><mi>iv</mi><mo>)</mo><mo>,</mo><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">d</mi><mo>)</mo><mo>-</mo><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo></math>", "isCorrect": false, "image": null}, {"id": "6Ie2z", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">a</mi><mo>)</mo><mo>-</mo><mo>(</mo><mi>iii</mi><mo>)</mo><mo>,</mo><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">b</mi><mo>)</mo><mo>-</mo><mo>(</mo><mi>ii</mi><mo>)</mo><mo>,</mo><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">c</mi><mo>)</mo><mo>-</mo><mo>(</mo><mi>iv</mi><mo>)</mo><mo>,</mo><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">d</mi><mo>)</mo><mo>-</mo><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo></math>", "isCorrect": true, "image": null}, {"id": "A9ZYh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">a</mi><mo>)</mo><mo>-</mo><mo>(</mo><mi>iii</mi><mo>)</mo><mo>,</mo><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">b</mi><mo>)</mo><mo>-</mo><mo>(</mo><mi>ii</mi><mo>)</mo><mo>,</mo><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">c</mi><mo>)</mo><mo>-</mo><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo><mo>,</mo><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">d</mi><mo>)</mo><mo>-</mo><mo>(</mo><mi>iv</mi><mo>)</mo></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The relation between wavelength and the principal quantum number is,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>&#955;</mi></mfrac><mo>=</mo><mi>R</mi><mfenced><mrow><mfrac><mn>1</mn><msup><mfenced><msub><mi>n</mi><mn>1</mn></msub></mfenced><mn>2</mn></msup></mfrac><mo>-</mo><mfrac><mn>1</mn><msup><mfenced><msub><mi>n</mi><mn>2</mn></msub></mfenced><mn>2</mn></msup></mfrac></mrow></mfenced></math>, for hydrogen-like atom, so the unit to Rydberg constant is,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>.</p><p>Now recall the formula of energy of a photon in terms of frequency,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mo>=</mo><mi>h</mi><mi>&#957;</mi></math>, it means,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><mo>=</mo><mfrac><mi>E</mi><mi>&#957;</mi></mfrac><mo>=</mo><mfrac><mrow><mi>kg</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mfrac><mo>=</mo><mi>kg</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>.</p><p>The coefficient of viscosity,<br />&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>=</mo><mfrac><mi>F</mi><mrow><mi>A</mi><mo>&#215;</mo><mstyle displaystyle=\"true\"><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>z</mi></mrow></mfrac></mstyle></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>kg</mi><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></mrow><mrow><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup><mo>&#215;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfrac><mo>=</mo><mi>kg</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>.</mo></math>&nbsp;</p><p>Energy density is defined as,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>E</mi><mi>V</mi></mfrac><mo>=</mo><mfrac><mrow><mi>kg</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></mrow><msup><mi mathvariant=\"normal\">m</mi><mn>3</mn></msup></mfrac><mo>=</mo><mi>kg</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["MATCH_THE_LIST"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92edde3d91842a5cf81e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-27T14:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Aug Shift 2)", "title": "JEE Main 2021 (27 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d6751a", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf81d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-27T09:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Aug Shift 1)", "title": "JEE Main 2021 (27 Aug Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>H</mi></math> represents the intensity of electric field and magnetizing&nbsp;field respectively, then the unit of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>E</mi><mi>H</mi></mfrac></math> will be:</p>", "image": null}, "options": [{"id": "WwB9v", "text": "joule", "isCorrect": false, "image": null}, {"id": "NsRZo", "text": "ohm", "isCorrect": true, "image": null}, {"id": "ciSOI", "text": "newton", "isCorrect": false, "image": null}, {"id": "gOAfs", "text": "mho", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The unit of,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>E</mi><mi>H</mi></mfrac><mo>=</mo><mfrac><mfrac><mi>F</mi><mi>q</mi></mfrac><mfrac><mi>I</mi><mi>r</mi></mfrac></mfrac><mo>=</mo><mfrac><mrow><mi>F</mi><mi>r</mi></mrow><mrow><msup><mi>I</mi><mn>2</mn></msup><mi>t</mi></mrow></mfrac><mo>,</mo></math>&nbsp;here the units are,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><mi mathvariant=\"normal\">N</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi><mo>=</mo><mi mathvariant=\"normal\">m</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mi mathvariant=\"normal\">A</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mi mathvariant=\"normal\">s</mi></math>&nbsp;then the net unit of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>E</mi><mi>H</mi></mfrac></math>,is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mtext>J&#160;s</mtext><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#160;</mo><msup><mtext>A</mtext><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>, which is equivalent to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#937;</mi></math>.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf81d", "examId": "615d76b2c52ffa3c944600df", "heldOn mrow><mfrac><mrow><msub><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>L</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>3</mn></mrow></msup></math> <br/><br/> <math><mi> </mi><mo>=</mo><mn>128</mn><mo>×</mo><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>1000</mn></mrow><mrow><mn>50</mn></mrow></mfrac></mrow></mfenced><mo>×</mo><msup><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>25</mn></mrow><mrow><mn>100</mn></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>3</mn></mrow></msup></math> <br/><br/> <math><mo>=</mo><mn>128</mn><mo>×</mo><mn>20</mn><mo>×</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>64</mn></mrow></mfrac></math> <br/><br/> <math><mo>=</mo><mn>40</mn></math>", "image": null}, "videoSolution": {"videoId": "51f4254a8c4444c595cba27e707da3cb", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/7UEzKxMLOhNAm.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/7UEzKxMLOhNAm.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ea", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-10T09:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Jan Shift 1)", "title": "JEE Main 2019 (10 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d659ee", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7ce", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2012 (12 May Online)", "title": "JEE Main 2012 (12 May Online)"}], "question": {"text": "A student measured the diameter of a wire using a screw gauge with the least count $0.001 \\mathrm{~cm}$ and listed the measurements. The measured value should be recorded as", "image": null}, "options": [{"id": "ZgQOh", "text": "\n$5.3200 \\mathrm{~cm}$\n", "image": null, "isCorrect": false}, {"id": "67Pzg", "text": "\n$5.3 \\mathrm{~cm}$\n", "image": null, "isCorrect": false}, {"id": "XHimK", "text": "\n$5.32 \\mathrm{~cm}$\n", "image": null, "isCorrect": false}, {"id": "tsgC2", "text": "\n$5.320 \\mathrm{~cm}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The least count (L.C.) of a screw guage is the smallest length which can be measured accurately with it.\nAs least count is $0.001 \\mathrm{~cm}=\\frac{1}{1000} \\mathrm{~cm}$\nHence measured value should be recorded upto 3 decimal places i.e., $5.320 \\mathrm{~cm}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7ce", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2012 (12 May Online)", "title": "JEE Main 2012 (12 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "648b5a73417cc3fb48d69226", "title": "Dimensions", "totalQuestions": 131, "questions": [{"_id": "69d8073881239f6567c4f336", "type": "singleCorrect", "question": {"text": "Consider the equation $H = \\dfrac{x^p \\epsilon^q E^r}{t^s}$, where $H=$ magnetic field; $E=$ electric field, $\\epsilon=$ permittivity, $x=$ distance, $t=$ time. The values of $p, q, r$ and $s$ respectively are:", "image": null}, "options": [{"id": "XWc4n", "text": "$1, 1, 1, 1$", "isCorrect": true, "image": null}, {"id": "pstKC", "text": "$-1, 1, 2, 1$", "isCorrect": false, "image": null}, {"id": "Twvi1", "text": "$1, -1, -2, 1$", "isCorrect": false, "image": null}, {"id": "ZLQ9X", "text": "$-1, -2, -2, 1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The dimensional formulas for the given physical quantities are:<br><br>Magnetic field intensity $[H] = [M^0 L^{-1} T^0 A^1]$<br><br>Distance $[x] = [M^0 L^1 T^0 A^0]$<br><br>Permittivity $[\\epsilon] = [M^{-1} L^{-3} T^4 A^2]$<br><br>Electric field $[E] = [M^1 L^1 T^{-3} A^{-1}]$<br><br>Time $[t] = [M^0 L^0 T^1 A^0]$<br><br>Given the equation $H = \\dfrac{x^p \\epsilon^q E^r}{t^s}$, we can write it in terms of dimensions as:<br><br>$[M^0 L^{-1} T^0 A^1] = [L]^p [M^{-1} L^{-3} T^4 A^2]^q [M L T^{-3} A^{-1}]^r [T]^{-s}$<br><br>Combining the powers of $M, L, T$, and $A$ on the right side:<br><br>$[M^0 L^{-1} T^0 A^1] = [M^{-q+r} L^{p-3q+r} T^{4q-3r-s} A^{2q-r}]$<br><br>Equating the powers of corresponding fundamental quantities from both sides:<br><br>For $M$: $0 = -q + r \\implies q = r$<br><br>For $A$: $1 = 2q - r$<br><br>Substituting $r = q$ into the equation for $A$:<br><br>$1 = 2q - q \\implies q = 1$<br><br>Since $q = r$, we get $r = 1$.<br><br>For $L$: $-1 = p - 3q + r$<br><br>Substituting $q = 1$ and $r = 1$:<br><br>$-1 = p - 3(1) + 1 \\implies -1 = p - 2 \\implies p = 1$<br><br>For $T$: $0 = 4q - 3r - s$<br><br>Substituting $q = 1$ and $r = 1$:<br><br>$0 = 4(1) - 3(1) - s \\implies 0 = 1 - s \\implies s = 1$<br><br>Thus, the values are $p = 1$, $q = 1$, $r = 1$, and $s = 1$.<br><br>Answer: $1, 1, 1, 1$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7ddb", "title": "JEE Main 2026 (08 April Shift 2)", "shortName": "2026 (08 April Shift 2)", "isVisible": true, "heldOn": "2026-04-08T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "122df22bec5c46f8a0e8f76e439696d7", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/6NfoKPcYcNKD3.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/6NfoKPcYcNKD3.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7ddb", "title": "JEE Main 2026 (08 April Shift 2)", "shortName": "2026 (08 April Shift 2)", "isVisible": true, "heldOn": "2026-04-08T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8073f81239f6567c4f381", "type": "singleCorrect", "question": {"text": "Match List - I with List - II.<table style=\"border: 1px solid black; border-collapse: collapse; width: auto;\"><tr><th style=\"border: 1px solid black; padding: 5px;\">List - I</th><th style=\"border: 1px solid black; padding: 5px;\">List - II</th></tr><tr><td style=\"border: 1px solid black; padding: 5px;\">A. Boltzmann constant</td><td style=\"border: 1px solid black; padding: 5px;\">I. $[M^{-1}L^3T^{-2}]$</td></tr><tr><td style=\"border: 1px solid black; padding: 5px;\">B. Stefan's constant</td><td style=\"border: 1px solid black; padding: 5px;\">II. $[ML^2T^{-1}]$</td></tr><tr><td style=\"border: 1px solid black; padding: 5px;\">C. Planck's constant</td><td style=\"border: 1px solid black; padding: 5px;\">III. $[ML^2T^{-2}K^{-1}]$</td></tr><tr><td style=\"border: 1px solid black; padding: 5px;\">D. Gravitational constant</td><td style=\"border: 1px solid black; padding: 5px;\">IV. $[ML^0T^{-3}K^{-4}]$</td></tr></table>Choose the correct answer from the options given below :", "image": null}, "options": [{"id": "l6ePA", "text": "A-I, B-II, C-III, D-IV", "isCorrect": false, "image": null}, {"id": "qvU4X", "text": "A-IV, B-III, C-II, D-I", "isCorrect": false, "image": null}, {"id": "iFMtX", "text": "A-III, B-IV, C-II, D-I", "isCorrect": true, "image": null}, {"id": "By45Q", "text": "A-II, B-I, C-IV, D-III", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Boltzmann constant $k$: $E = k T \\Rightarrow [k] = \\dfrac{[ML^2T^{-2}]}{[K]} = [ML^2T^{-2}K^{-1}]$<br><br>Stefan's constant $\\sigma$: $\\dfrac{E}{At} = \\sigma T^4 \\Rightarrow [\\sigma] = \\dfrac{[ML^2T^{-2}]}{[L^2][T][K^4]} = [ML^0T^{-3}K^{-4}]$<br><br>Planck's constant $h$: $E = h\\nu \\Rightarrow [h] = \\dfrac{[ML^2T^{-2}]}{[T^{-1}]} = [ML^2T^{-1}]$<br><br>Gravitational constant $G$: $F = \\dfrac{Gm_1m_2}{r^2} \\Rightarrow [G] = \\dfrac{[MLT^{-2}][L^2]}{[M^2]} = [M^{-1}L^3T^{-2}]$<br><br>Thus, A-III, B-IV, C-II, D-I.<br><br>Answer: A-III, B-IV, C-II, D-I", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dda", "title": "JEE Main 2026 (06 April Shift 2)", "shortName": "2026 (06 April Shift 2)", "isVisible": true, "heldOn": "2026-04-06T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "73d17d1d3dbd41e9abca4a226d90d4c0", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/OJyq2JXw8Y1ny.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/OJyq2JXw8Y1ny.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionStructure": ["MATCH_THE_LIST"], "syllabusCategory": "noChange", "previousYear": {"_id": "69d806e28b80d82dea5b7dda", "title": "JEE Main 2026 (06 April Shift 2)", "shortName": "2026 (06 April Shift 2)", "isVisible": true, "heldOn": "2026-04-06T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8074c81239f6567c4f417", "type": "singleCorrect", "question": {"text": "The potential energy of a particle changes with distance $x$ from a fixed origin as $V = \\dfrac{A\\sqrt{x}}{x + B}$, where $A$ and $B$ are constant with appropriate dimensions. The dimensions of $AB$ are _______.", "image": null}, "options": [{"id": "tCG1u", "text": "$[M^1 L^{5/2} T^{-2}]$", "isCorrect": false, "image": null}, {"id": "byiTg", "text": "$[M^{3/2} L^{5/2} T^{-2}]$", "isCorrect": false, "image": null}, {"id": "JvnQD", "text": "$[M^1 L^2 T^{-2}]$", "isCorrect": false, "image": null}, {"id": "FPf0F", "text": "$[M^1 L^{7/2} T^{-2}]$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "By the principle of dimensional homogeneity, quantities added or subtracted must have the same dimensions. In the denominator, $B$ is added to $x$ (distance).<br><br>$[B] = [x] = [L]$<br><br>The dimensions of potential energy $V$ are $[M^1 L^2 T^{-2}]$.<br><br>From the given equation $V = \\dfrac{A\\sqrt{x}}{x + B}$, we can write the dimensional formula as:<br><br>$[V] = \\dfrac{[A][x]^{1/2}}{[x + B]}$<br><br>$[M^1 L^2 T^{-2}] = \\dfrac{[A][L]^{1/2}}{[L]}$<br><br>$[M^1 L^2 T^{-2}] = [A][L]^{-1/2}$<br><br>$[A] = [M^1 L^2 T^{-2}][L]^{1/2} = [M^1 L^{5/2} T^{-2}]$<br><br>Now, the dimensions of $AB$ are:<br><br>$[AB] = [A][B] = [M^1 L^{5/2} T^{-2}][L] = [M^1 L^{7/2} T^{-2}]$<br><br>Answer: $[M^1 L^{7/2} T^{-2}]$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd9", "title": "JEE Main 2026 (06 April Shift 1)", "shortName": "2026 (06 April Shift 1)", "isVisible": true, "heldOn": "2026-04-06T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "cef323d87cad41988c7b4ac360a4bb0d", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/h2kgHJyBLXwbp.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/h2kgHJyBLXwbp.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd9", "title": "JEE Main 2026 (06 April Shift 1)", "shortName": "2026 (06 April Shift 1)", "isVisible": true, "heldOn": "2026-04-06T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8075f81239f6567c4f4f7", "type": "singleCorrect", "question": {"text": "Match List-I with List-II.<br><table style=\"border: 1px solid black; border-collapse: collapse; width: auto;\"><tr><th style=\"border: 1px solid black; padding: 5px;\">List-I</th><th style=\"border: 1px solid black; padding: 5px;\">List-II</th></tr><tr><td style=\"border: 1px solid black; padding: 5px;\">A. Meter (L)</td><td style=\"border: 1px solid black; padding: 5px;\">I. $\\sqrt{\\dfrac{hc}{G}}$</td></tr><tr><td style=\"border: 1px solid black; padding: 5px;\">B. Second (S)</td><td style=\"border: 1px solid black; padding: 5px;\">II. $\\sqrt{\\dfrac{Gh}{c^5}}$</td></tr><tr><td style=\"border: 1px solid black; padding: 5px;\">C. Kilogram (M)</td><td style=\"border: 1px solid black; padding: 5px;\">III. $\\sqrt{\\dfrac{K^2L^2c^3}{Gh}}$</td></tr><tr><td style=\"border: 1px solid black; padding: 5px;\">D. Kelvin (K)</td><td style=\"border: 1px solid black; padding: 5px;\">IV. $\\sqrt{\\dfrac{Gh}{c^3}}$</td></tr></table><br>where $h$ (Planck's constant), $G$ (gravitational constant) and $c$ (speed of light in vacuum) as fundamental units.<br>Choose the correct answer from the options given below :", "image": null}, "options": [{"id": "Kj77o", "text": "A-II, B-IV, C-I, D-III", "isCorrect": false, "image": null}, {"id": "BwoKW", "text": "A-IV, B-II, C-I, D-III", "isCorrect": true, "image": null}, {"id": "BDmTk", "text": "A-IV, B-I, C-II, D-III", "isCorrect": false, "image": null}, {"id": "ZW8bV", "text": "A-III, B-I, C-II, D-IV", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The dimensional formulas for the given fundamental constants are:<br>$[h] = M L^2 T^{-1}$<br>$[c] = L T^{-1}$<br>$[G] = M^{-1} L^3 T^{-2}$<br><br>Evaluating the dimensions of the expressions in List-II:<br><br>For I: $\\sqrt{\\dfrac{hc}{G}} = \\sqrt{\\dfrac{(M L^2 T^{-1})(L T^{-1})}{M^{-1} L^3 T^{-2}}} = \\sqrt{M^2} = M$ (Kilogram).<br>Thus, C $\\rightarrow$ I.<br><br>For II: $\\sqrt{\\dfrac{Gh}{c^5}} = \\sqrt{\\dfrac{(M^{-1} L^3 T^{-2})(M L^2 T^{-1})}{(L T^{-1})^5}} = \\sqrt{\\dfrac{L^5 T^{-3}}{L^5 T^{-5}}} = \\sqrt{T^2} = T$ (Second).<br>Thus, B $\\rightarrow$ II.<br><br>For IV: $\\sqrt{\\dfrac{Gh}{c^3}} = \\sqrt{\\dfrac{(M^{-1} L^3 T^{-2})(M L^2 T^{-1})}{(L T^{-1})^3}} = \\sqrt{\\dfrac{L^5 T^{-3}}{L^3 T^{-3}}} = \\sqrt{L^2} = L$ (Meter).<br>Thus, A $\\rightarrow$ IV.<br><br>For III: Substituting $L^2 = \\dfrac{Gh}{c^3}$ from IV into the expression gives $\\sqrt{\\dfrac{K^2 L^2 c^3}{Gh}} = \\sqrt{K^2 \\left(\\dfrac{Gh}{c^3}\\right) \\dfrac{c^3}{Gh}} = \\sqrt{K^2} = K$ (Kelvin).<br>Thus, D $\\rightarrow$ III.<br><br>The correct matching is A-IV, B-II, C-I, D-III.<br><br>Answer: A-IV, B-II, C-I, D-III", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd8", "title": "JEE Main 2026 (05 April Shift 2)", "shortName": "2026 (05 April Shift 2)", "isVisible": true, "heldOn": "2026-04-05T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "87dde5e8d57c4a448de94e0036fb4c2a", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/yXHOBile2kHeA.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/yXHOBile2kHeA.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionStructure": ["MATCH_THE_LIST"], "syllabusCategory": "noChange", "previousYear": {"_id": "69d806e28b80d82dea5b7dd8", "title": "JEE Main 2026 (05 April Shift 2)", "shortName": "2026 (05 April Shift 2)", "isVisible": true, "heldOn": "2026-04-05T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8073281239f6567c4f2eb", "type": "singleCorrect", "question": {"text": "$L$, $C$ and $R$ represents physical quantities inductance, capacitance and resistance respectively. The dimensional formula $ML^2 T^{-4} A^{-2}$ corresponds to __________.", "image": null}, "options": [{"id": "6DZ2b", "text": "$\\dfrac{R}{\\sqrt{LC}}$", "isCorrect": true, "image": null}, {"id": "eRvKP", "text": "$\\dfrac{R}{LC}$", "isCorrect": false, "image": null}, {"id": "sstnD", "text": "$\\dfrac{C}{\\sqrt{LR}}$", "isCorrect": false, "image": null}, {"id": "xRBuA", "text": "$\\dfrac{1}{R}\\sqrt{\\dfrac{L}{C}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Dimensional formula of inductance $L$ is obtained from $E = \\dfrac{1}{2}LI^2$:<br><br>$[L] = \\dfrac{[E]}{[I]^2} = \\dfrac{ML^2T^{-2}}{A^2} = ML^2T^{-2}A^{-2}$<br><br>Dimensional formula of capacitance $C$ is obtained from $E = \\dfrac{1}{2}\\dfrac{Q^2}{C}$:<br><br>$[C] = \\dfrac{[Q]^2}{[E]} = \\dfrac{A^2T^2}{ML^2T^{-2}} = M^{-1}L^{-2}T^4A^2$<br><br>Dimensional formula of resistance $R$ is obtained from $P = I^2R$:<br><br>$[R] = \\dfrac{[P]}{[I]^2} = \\dfrac{ML^2T^{-3}}{A^2} = ML^2T^{-3}A^{-2}$<br><br>The dimensional formula of $\\sqrt{LC}$ is:<br><br>$[\\sqrt{LC}] = \\sqrt{(ML^2T^{-2}A^{-2})(M^{-1}L^{-2}T^4A^2)} = \\sqrt{T^2} = T$<br><br>Evaluating the dimensional formula of $\\dfrac{R}{\\sqrt{LC}}$:<br><br>$\\left[\\dfrac{R}{\\sqrt{LC}}\\right] = \\dfrac{ML^2T^{-3}A^{-2}}{T} = ML^2T^{-4}A^{-2}$<br><br>This matches the given dimensional formula.<br><br>Answer: $\\dfrac{R}{\\sqrt{LC}}$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd7", "title": "JEE Main 2026 (05 April Shift 1)", "shortName": "2026 (05 April Shift 1)", "isVisible": true, "heldOn": "2026-04-05T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "10df8f7de06d45b68534579c6b74e2c7", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/d23lwZI9xfSPs.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/d23lwZI9xfSPs.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd7", "title": "JEE Main 2026 (05 April Shift 1)", "shortName": "2026 (05 April Shift 1)", "isVisible": true, "heldOn": "2026-04-05T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8072b81239f6567c4f29f", "type": "singleCorrect", "question": {"text": "Dimensions of universal gravitational constant $(G)$ in terms of Planck's constant $(h)$, distance $(L)$, mass $(M)$ and time $(T)$ are _______.", "image": null}, "options": [{"id": "90Wwg", "text": "$[hTLM^{-2}]$", "isCorrect": false, "image": null}, {"id": "q8yUN", "text": "$[hT^{-1}LM^{-2}]$", "isCorrect": true, "image": null}, {"id": "boXD4", "text": "$[hTL^2 M^{-2}]$", "isCorrect": false, "image": null}, {"id": "UF2SZ", "text": "$[h^{-1}T^{-1}LM^{-2}]$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The dimensional formula of the universal gravitational constant $G$ is obtained from Newton's law of gravitation $F = \\dfrac{G m_1 m_2}{r^2}$.<br><br>$[G] = \\dfrac{[F][r^2]}{[m_1 m_2]} = \\dfrac{[MLT^{-2}][L^2]}{[M^2]} = [M^{-1}L^3T^{-2}]$<br><br>The dimensional formula of Planck's constant $h$ is obtained from the energy of a photon $E = h\\nu$.<br><br>$[h] = \\dfrac{[E]}{[\\nu]} = \\dfrac{[ML^2T^{-2}]}{[T^{-1}]} = [ML^2T^{-1}]$<br><br>Let the dimensions of $G$ be expressed as $[G] = [h]^a [L]^b [M]^c [T]^d$.<br><br>Substituting the dimensions, we get:<br><br>$[M^{-1}L^3T^{-2}] = [ML^2T^{-1}]^a [L]^b [M]^c [T]^d$<br><br>$[M^{-1}L^3T^{-2}] = [M^{a+c} L^{2a+b} T^{-a+d}]$<br><br>Equating the powers of $M$, $L$, and $T$ on both sides:<br><br>$a + c = -1$<br><br>$2a + b = 3$<br><br>$-a + d = -2$<br><br>Assuming $a = 1$ (as per the given options), we get:<br><br>$c = -1 - 1 = -2$<br><br>$b = 3 - 2(1) = 1$<br><br>$d = -2 + 1 = -1$<br><br>Therefore, the dimensions of $G$ are $[h^1 L^1 M^{-2} T^{-1}]$, which can be written as $[hT^{-1}LM^{-2}]$.<br><br>Answer: $[hT^{-1}LM^{-2}]$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd4", "title": "JEE Main 2026 (02 April Shift 2)", "shortName": "2026 (02 April Shift 2)", "isVisible": true, "heldOn": "2026-04-02T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "e26c6e8b55f845e6a502787131789795", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/NDkkjiOXbnCoM.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/NDkkjiOXbnCoM.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd4", "title": "JEE Main 2026 (02 April Shift 2)", "shortName": "2026 (02 April Shift 2)", "isVisible": true, "heldOn": "2026-04-02T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1b18bfdbb24356397ed", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f4a", "title": "JEE Main 2026 (28 January Shift 2)", "shortName": "2026 (28 January Shift 2)", "isVisible": true, "heldOn": "2026-01-28T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Match List - I with List - II. <br> \\(\\begin{array}{llll} & \\text{List - I} & & \\text{List - II} \\\\ A. & \\text{Coefficient of viscosity} & I. & [M L^{-1} T^{-1}] \\\\ B. & \\text{Surface tension} & II. & [M L^{0} T^{-2}] \\\\ C. & \\text{Pressure} & III. & [M L^{-1} T^{-2}] \\\\ D. & \\text{Surface energy} & IV. & [M L^{2} T^{-2}] \\end{array}\\) <br> Choose the correct answer from the options given below :", "image": null}, "options": [{"id": "jj7Ki", "text": "A-I, B-II, C-IV, D-III", "isCorrect": false, "image": null}, {"id": "vHQfF", "text": "A-IV, B-I, C-II, D-III", "isCorrect": false, "image": null}, {"id": "D6PUt", "text": "A-I, B-II, C-III, D-IV", "isCorrect": true, "image": null}, {"id": "L3Cct", "text": "A-I, B-III, C-II, D-IV", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "(A) Coefficient of viscosity:<br>$\\eta = \\frac{F \\cdot dr}{A \\cdot dv} = \\frac{[MLT^{-2}][L]}{[L^2][LT^{-1}]} = [ML^{-1}T^{-1}]$ → I<br>(B) Surface tension:<br>$S = \\frac{F}{L} = \\frac{[MLT^{-2}]}{[L]} = [MT^{-2}] = [ML^0T^{-2}]$ → II<br>(C) Pressure:<br>$P = \\frac{F}{A} = \\frac{[MLT^{-2}]}{[L^2]} = [ML^{-1}T^{-2}]$ → III<br>(D) Surface energy:<br>$E = S \\times A = [MT^{-2}][L^2] = [ML^2T^{-2}]$ → IV<br>Hence, A-I, B-II, C-III, D-IV.", "image": null}, "videoSolution": {"videoId": "59d274ae36f044658cfb783f77c41577", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/lNb3LoRq7QBfc.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/lNb3LoRq7QBfc.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "questionStructure": ["MATCH_THE_LIST"], "syllabusCategory": "noChange", "previousYear": {"_id": "6983c0cb2f90f45c755e5f4a", "title": "JEE Main 2026 (28 January Shift 2)", "shortName": "2026 (28 January Shift 2)", "isVisible": true, "heldOn": "2026-01-28T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1a08bfdbb2435639715", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f47", "title": "JEE Main 2026 (24 January Shift 1)", "shortName": "2026 (24 January Shift 1)", "isVisible": true, "heldOn": "2026-01-24T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Match the LIST-I with LIST-II <br> \\(\\begin{array}{||c|l||c|l||} \\hline & \\text{List-I} & & \\text{List-II} \\\\ \\hline \\text{A.} & \\text{Magnetic induction} & \\text{I.} & \\mathrm{M\\,L\\,T^{-2}\\,A^{-2}} \\\\ \\hline \\text{B.} & \\text{Magnetic flux} & \\text{II.} & \\mathrm{M\\,L^{2}\\,T^{-2}\\,A^{-2}} \\\\ \\hline \\text{C.} & \\text{Magnetic permeability} & \\text{III.} & \\mathrm{M\\,L^{0}\\,T^{-2}\\,A^{-1}} \\\\ \\hline \\text{D.} & \\text{Self inductance} & \\text{IV.} & \\mathrm{M\\,L^{2}\\,T^{-2}\\,A^{-1}} \\\\ \\hline \\end{array}\\) <br> Choose the correct answer from the options given below:", "image": null}, "options": [{"id": "3XCYW", "text": "A-III, B-IV, C-II, D-I", "isCorrect": false, "image": null}, {"id": "86WGX", "text": "A-III, B-IV, C-I, D-II", "isCorrect": true, "image": null}, {"id": "UZeix", "text": "A-IV, B-III, C-I, D-II", "isCorrect": false, "image": null}, {"id": "2Utqe", "text": "A-I, B-III, C-IV, D-II", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Match physical quantities with dimensional formulas using fundamental principles.<br>Magnetic Induction (A): From $F = qvB$, $[B] = \\frac{MLT^{-2}}{AT \\cdot LT^{-1}} = MT^{-2}A^{-1} = $ III<br>Magnetic Flux (B): $\\Phi = BA$, $[\\Phi] = MT^{-2}A^{-1} \\cdot L^2 = ML^2T^{-2}A^{-1} = $ IV<br>Magnetic Permeability (C): From $B = \\mu H$ with $[H] = ALT^{-1}$, $[\\mu] = \\frac{MT^{-2}A^{-1}}{AL^{-1}T^{-1}} = MLT^{-2}A^{-2} = $ I<br>Self Inductance (D): From $\\varepsilon = L\\frac{dI}{dt}$, $[L] = \\frac{ML^2T^{-3}A^{-1}}{AT^{-1}} = ML^2T^{-2}A^{-2} = $ II<br>Correct matching: A-III, B-IV, C-I, D-II", "image": null}, "videoSolution": {"videoId": "3ed864a366254dd8be99b10f05b8de43", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/q27WpJhiKOqTC.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/q27WpJhiKOqTC.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "questionStructure": ["MATCH_THE_LIST"], "syllabusCategory": "noChange", "previousYear": {"_id": "6983c0cb2f90f45c755e5f47", "title": "JEE Main 2026 (24 January Shift 1)", "shortName": "2026 (24 January Shift 1)", "isVisible": true, "heldOn": "2026-01-24T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c19b8bfdbb24356396d7", "type": "numerical", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f46", "title": "JEE Main 2026 (23 January Shift 2)", "shortName": "2026 (23 January Shift 2)", "isVisible": true, "heldOn": "2026-01-23T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "A ball of radius $r$ and density $\\rho$ dropped through a viscous liquid of density $\\sigma$ and viscosity $\\eta$ attains its terminal velocity at time $t$, given by $t=A \\rho^{a} r^{b} \\eta^{\\mathrm{c}} \\sigma^{d}$, where $A$ is a constant and $a, b, c$ and $d$ are integers. The value of $\\frac{b+c}{a+d}$ is $\\_\\_\\_\\_$.", "image": null}, "options": [], "correctValue": 1, "solution": {"text": "Using dimensional analysis on $t = A\\rho^a r^b \\eta^c \\sigma^d$:<br>the dimensions are [T] = $[M L^{-3}]^a [L]^b [M L^{-1} T^{-1}]^c [M L^{-3}]^d$.<br>Expanding: [T] = $M^{a+c+d} L^{-3a+b-c-3d} T^{-c}$.<br>Comparing powers: For T: $1 = -c$, giving $c = -1$.<br>For M: $0 = a + c + d$, so $a + d = 1$.<br>For L: $0 = -3a + b - c - 3d = -3a + b + 1 - 3d$, giving $b = 3(a+d) - 1 = 3(1) - 1 = 2$.<br>Therefore $(b+c)/(a+d) = (2-1)/1 = 1$.", "image": null}, "videoSolution": {"videoId": "f1b96a5d00ec48b0b17d92bd5dcf0092", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/HpEzlDVHrTMz3.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/HpEzlDVHrTMz3.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f46", "title": "JEE Main 2026 (23 January Shift 2)", "shortName": "2026 (23 January Shift 2)", "isVisible": true, "heldOn": "2026-01-23T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c18f8bfdbb243563963e", "type": "singleCorrect", "level": 1, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f44", "title": "JEE Main 2026 (22 January Shift 2)", "shortName": "2026 (22 January Shift 2)", "isVisible": true, "heldOn": "2026-01-22T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "If $\\epsilon, E$ and $t$ represent the free space permittivity, electric field and time respectively, then the unit of $\\frac{\\epsilon E}{t}$ will be :", "image": null}, "options": [{"id": "gRteN", "text": "$\\mathrm{Am}^{2}$", "isCorrect": false, "image": null}, {"id": "WotMO", "text": "Am", "isCorrect": false, "image": null}, {"id": "vTkqc", "text": "$\\mathrm{A} / \\mathrm{m}^{2}$", "isCorrect": true, "image": null}, {"id": "KSjRp", "text": "A/m", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "We need to find the unit of $\\frac{\\epsilon E}{t}$.<br>From Maxwell's equations, the displacement current density is given by $J_d = \\epsilon \\frac{\\partial E}{\\partial t}$.<br>The term $\\frac{\\epsilon E}{t}$ has the same dimensions as displacement current density $J_d$.<br>Current density $J$ is defined as current per unit area, $J = \\frac{I}{A}$.<br>The SI unit of current $I$ is Ampere (A) and the SI unit of area $A$ is $m^2$.<br>Therefore, the unit of current density is $A/m^2$.<br>Alternatively, using dimensions:<br>$[\\epsilon] = M^{-1}L^{-3}T^4A^2$<br>$[E] = MLT^{-3}A^{-1}$<br>$[t] = T$<br>Dimension of $\\frac{\\epsilon E}{t} = \\frac{(M^{-1}L^{-3}T^4A^2)(MLT^{-3}A^{-1})}{T} = L^{-2}A$.<br>This corresponds to the unit $A/m^2$.", "image": null}, "videoSolution": {"videoId": "909574bc39d549399202fbe58fcba3a8", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/n5TulZ9UQEocl.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/n5TulZ9UQEocl.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f44", "title": "JEE Main 2026 (22 January Shift 2)", "shortName": "2026 (22 January Shift 2)", "isVisible": true, "heldOn": "2026-01-22T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1888bfdbb24356395ec", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f43", "title": "JEE Main 2026 (22 January Shift 1)", "shortName": "2026 (22 January Shift 1)", "isVisible": true, "heldOn": "2026-01-22T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Match the LIST-I with LIST-II <br> \\(\\begin{array}{||c|l||c||l||} \\hline & \\textbf{List-I} & & \\textbf{List-II} \\\\ \\hline A. & \\text{Spring constant} & I. & \\mathrm{M L^{2} T^{-2} K^{-1}} \\\\ \\hline B. & \\text{Thermal conductivity} & II. & \\mathrm{M L^{0} T^{-2}} \\\\ \\hline C. & \\text{Boltzmann constant} & III. & \\mathrm{M L^{2} T^{-3} A^{-2}} \\\\ \\hline D. & \\text{Inductive reactance} & IV. & \\mathrm{M L T^{-3} K^{-1}} \\\\ \\hline \\end{array}\\) <br> Choose the correct answer from the options given below:", "image": null}, "options": [{"id": "t2qyy", "text": "A-II, B-IV, C-I, D-III", "isCorrect": true, "image": null}, {"id": "JMjN8", "text": "A-I, B-IV, C-II, D-III", "isCorrect": false, "image": null}, {"id": "N19p7", "text": "A-II, B-I, C-IV, D-III", "isCorrect": false, "image": null}, {"id": "zDZSL", "text": "A-III, B-II, C-IV, D-I", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "A. Spring constant: $F = kx \\Rightarrow [k] = MLT^{-2}/L = ML^0T^{-2}$ $\\rightarrow$ II<br>B. Thermal conductivity: $Q/t = KA(dT/dx) \\Rightarrow [K] = ML^2T^{-3}/(L^2 \\cdot K/L) = MLT^{-3}K^{-1}$ $\\rightarrow$ IV<br>C. Boltzmann constant: $E = k_BT \\Rightarrow [k_B] = ML^2T^{-2}K^{-1}$ $\\rightarrow$ I<br>D. Inductive reactance: same dimension as resistance $= ML^2T^{-3}A^{-2}$ $\\rightarrow$ III<br>Matching: A-II, B-IV, C-I, D-III.", "image": null}, "videoSolution": {"videoId": "8abc909295224527af0c0771ba039054", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/epUbjgkvBP6ma.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/epUbjgkvBP6ma.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "questionStructure": ["MATCH_THE_LIST"], "syllabusCategory": "noChange", "previousYear": {"_id": "6983c0cb2f90f45c755e5f43", "title": "JEE Main 2026 (22 January Shift 1)", "shortName": "2026 (22 January Shift 1)", "isVisible": true, "heldOn": "2026-01-22T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c17c8bfdbb243563955d", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f41", "title": "JEE Main 2026 (21 January Shift 1)", "shortName": "2026 (21 January Shift 1)", "isVisible": true, "heldOn": "2026-01-21T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Consider a modified Bernoulli equation. <br> $\\left(\\mathrm{P}+\\frac{A}{B t^{2}}\\right)+\\rho g(h+B t)+\\frac{1}{2} \\rho V^{2}=$ constant <br> If $t$ has the dimension of time then the dimensions of $A$ and $B$ are $\\_\\_\\_\\_$, $\\_\\_\\_\\_$ respectively.", "image": null}, "options": [{"id": "NueRQ", "text": "$\\left[\\mathrm{ML}^{0} \\mathrm{~T}^{-2}\\right]$ and $\\left[\\mathrm{M}^{0} \\mathrm{LT}^{-2}\\right]$", "isCorrect": false, "image": null}, {"id": "hLQoG", "text": "$\\left[\\mathrm{ML}^{0} \\mathrm{~T}^{-2}\\right]$ and $\\left[\\mathrm{M}^{0} \\mathrm{LT}^{-1}\\right]$", "isCorrect": false, "image": null}, {"id": "8GVL4", "text": "$\\left[\\mathrm{ML}^{0} \\mathrm{~T}^{-1}\\right]$ and $\\left[\\mathrm{M}^{0} \\mathrm{LT}\\right]$", "isCorrect": false, "image": null}, {"id": "G90eh", "text": "$\\left[\\mathrm{ML}^{0} \\mathrm{~T}^{-1}\\right]$ and $\\left[\\mathrm{M}^{0} \\mathrm{LT}^{-1}\\right]$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "All terms must have dimension of pressure $[ML^{-1}T^{-2}]$.<br>For $(h + Bt)$: Since $\\rho gh$ has dimension of pressure, $[h] = [L]$.<br>For dimensional consistency: $[Bt] = [L]$, so $[B] = [LT^{-1}] = [M^0LT^{-1}]$<br>For $\\frac{A}{Bt^2}$: $\\frac{[A]}{[B][T^2]} = [ML^{-1}T^{-2}]$<br>$[A] = [B][T^2][ML^{-1}T^{-2}] = [LT^{-1}][T^2][ML^{-1}T^{-2}] = [ML^0T^{-1}]$<br>$[A] = [ML^0T^{-1}]$ and $[B] = [M^0LT^{-1}]$", "image": null}, "videoSolution": {"videoId": "53e5d76bca214505a66ad8ccf19abe1a", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/DWOuHgiiM0n4h.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/DWOuHgiiM0n4h.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f41", "title": "JEE Main 2026 (21 January Shift 1)", "shortName": "2026 (21 January Shift 1)", "isVisible": true, "heldOn": "2026-01-21T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542c6c7c09d044e4c1a1e7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2ff9d87935e0d809789", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-07T14:00:00.000Z", "isVisible": true, "shortName": "2025 (7 Apr Shift 2)", "title": "JEE Main 2025 (7 Apr Shift 2)"}], "question": {"text": "Match List-I with List-II.<br/>$\\begin{array}{|l|l|l|l|} \\hline & \\text{List-I} & & \\text{List-II} \\\\ \\hline \\text{(A)} & \\text{Mass density} & \\text{(I)} & {\\left[\\mathrm{ML}^2 \\mathrm{~T}^{-3}\\right]} \\\\ \\hline \\text{(B)} & \\text{Impulse} & \\text{(II)} & {\\left[\\mathrm{MLT}^{-1}\\right]} \\\\ \\hline \\text{(C)} & \\text{Power} & \\text{(III)} & {\\left[\\mathrm{ML}^2 \\mathrm{~T}^0\\right]} \\\\ \\hline \\text{(D)} & \\text{Moment of inertia} & \\text{(IV)} & {\\left[\\mathrm{ML}^{-3} \\mathrm{~T}^0\\right]} \\\\ \\hline\\end{array}$<br/>Choose the correct answer from the options given below :", "image": null}, "options": [{"id": "p1C7s", "text": "(A)-(IV), (B)-(II), (C)-(III), (D)-(I)", "image": null, "isCorrect": false}, {"id": "FSHBS", "text": "(A)-(I), (B)-(III), (C)-(IV), (D)-(II)", "image": null, "isCorrect": false}, {"id": "LExfU", "text": "(A)-(IV), (B)-(II), (C)-(I), (D)-(III)", "image": null, "isCorrect": true}, {"id": "8zTZr", "text": "(A)-(II), (B)-(III), (C)-(IV), (D)-(I)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(A) Mass density $=\\frac{M}{V}=M^1 L^{-3}$...(iv)<br/>(B) Impulse $=\\mathrm{M} \\times \\mathrm{u}=\\mathrm{M}^1 \\mathrm{~L}^1 \\mathrm{~T}^{-1}$....(ii)<br/>(C) Power $=\\mathrm{F}. \\mathrm{V}=\\mathrm{M}^1 \\mathrm{~L}^2 \\mathrm{~T}^{-3}$....(i)<br/>(D) Moment of inertia $=\\mathrm{Mr}^2=\\mathrm{M}^1 \\mathrm{~L}^2$...(iii)", "image": null}, "videoSolution": {"videoId": "f4c25b565fae47809135c88ba3f3dc15", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Sb5mqt2aMyoTL.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Sb5mqt2aMyoTL.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionStructure": ["MATCH_THE_LIST"], "syllabusCategory": "noChange", "previousYear": {"_id": "6852f2ff9d87935e0d809789", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-07T14:00:00.000Z", "isVisible": true, "shortName": "2025 (7 Apr Shift 2)", "title": "JEE Main 2025 (7 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542c6c7c09d044e4c1a1e6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2ff9d87935e0d809789", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-07T14:00:00.000Z", "isVisible": true, "shortName": "2025 (7 Apr Shift 2)", "title": "JEE Main 2025 (7 Apr Shift 2)"}], "question": {"text": "The dimension of $\\sqrt{\\frac{\\mu_0}{\\epsilon_0}}$ is equal to that of :<br/>( $\\mu_0=$ Vacuum permeability and $\\epsilon_0=$ Vacuum permittivity)", "image": null}, "options": [{"id": "2q04o", "text": "Voltage", "image": null, "isCorrect": false}, {"id": "CpwQe", "text": "Capacitance", "image": null, "isCorrect": false}, {"id": "a14hF", "text": "Inductance", "image": null, "isCorrect": false}, {"id": "Smn6X", "text": "Resistance", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & L=\\frac{\\mu_0 N A}{\\ell} \\\\ & C=\\frac{A \\epsilon_0}{d} \\\\ & \\frac{L}{C} \\propto \\frac{\\mu_0}{\\epsilon_0} \\\\ & \\sqrt{\\frac{\\mu_0}{\\epsilon_0}} \\propto \\sqrt{\\frac{L}{C}} \\\\ & \\frac{L}{C}=\\frac{\\tau R}{(\\tau / R)}=R^2 \\\\ & \\sqrt{\\frac{\\mu_0}{\\epsilon_0}}=R\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "ecaa13af836b405e92e7a990d89e065c", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/pc7mf5Ui5r7FK.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/pc7mf5Ui5r7FK.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6852f2ff9d87935e0d809789", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-07T14:00:00.000Z", "isVisible": true, "shortName": "2025 (7 Apr Shift 2)", "title": "JEE Main 2025 (7 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542c6a7c09d044e4c1a1dc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2fe9d87935e0d809788", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2025 (7 Apr Shift 1)", "title": "JEE Main 2025 (7 Apr Shift 1)"}], "question": {"text": "If $\\epsilon_0$ denotes the permittivity of free space and $\\Phi_{\\mathrm{E}}$ is the flux of the electric field through the area bounded by the closed surface, then dimension of $\\left(\\epsilon_0 \\frac{\\mathrm{~d} \\phi_{\\mathrm{E}}}{\\mathrm{dt}}\\right)$ are that of :", "image": null}, "options": [{"id": "olxwz", "text": "Electric field", "image": null, "isCorrect": false}, {"id": "FThOG", "text": "Electric potential", "image": null, "isCorrect": false}, {"id": "QAibD", "text": "Electric charge", "image": null, "isCorrect": false}, {"id": "TcL3C", "text": "Electric current", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "We know that formula for displacement current is given by<br/>$\\mathrm{id}=\\varepsilon_0 \\frac{\\mathrm{~d} \\phi_{\\varepsilon}}{\\mathrm{dt}}$", "image": null}, "videoSolution": {"videoId": "671fed5736f148faa6356bd4d92b5e40", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/0PlWRHOoK8kgl.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/0PlWRHOoK8kgl.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6852f2fe9d87935e0d809788", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2025 (7 Apr Shift 1)", "title": "JEE Main 2025 (7 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542c6c7c09d044e4c1a1e5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2ff9d87935e0d80978a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-04T14:00:00.000Z", "isVisible": true, "shortName": "2025 (4 Apr Shift 2)", "title": "JEE Main 2025 (4 Apr Shift 2)"}], "question": {"text": "In an electromagnetic system, a quantity defined as the ratio of electric dipole moment and magnetic dipole moment has dimension of $\\left[M^P L^{\\circ} \\mathrm{T}^{\\mathrm{R}} \\mathrm{A}^{\\mathrm{S}}\\right]$. The value of P and Q are :", "image": null}, "options": [{"id": "amEuv", "text": "$-1,0$", "image": null, "isCorrect": false}, {"id": "8MLce", "text": "$-1,1$", "image": null, "isCorrect": false}, {"id": "4fkfa", "text": "$1,-1$", "image": null, "isCorrect": false}, {"id": "GffZO", "text": "$0,-1$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Electric dipole moment $(\\overrightarrow{\\mathrm{P}})=\\mathrm{q} \\times 2 \\ell$<br/>Magnetic dipole moment $(\\overrightarrow{\\mathrm{M}})=\\mathrm{IA}$<br/>$\\left[\\frac{\\mathrm{P}}{\\mathrm{M}}\\right]=\\left[\\frac{\\mathrm{LTA}}{\\mathrm{~L}^2 \\mathrm{~A}}\\right]=\\mathrm{L}^{-1} \\mathrm{~T}=\\mathrm{M}^0 \\mathrm{~L}^{-1} \\mathrm{~T}^1 \\mathrm{~A}^0$<br/>After compering values of $\\mathrm{P} \\& \\mathrm{Q}$ are $0,-1$ Correct Answer : Option 4", "image": null}, "videoSolution": {"videoId": "ac0332e394f34edca475a109cdac7e65", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/ZfSUo4voisTry.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/ZfSUo4voisTry.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6852f2ff9d87935e0d80978a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-04T14:00:00.000Z", "isVisible": true, "shortName": "2025 (4 Apr Shift 2)", "title": "JEE Main 2025 (4 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542c6b7c09d044e4c1a1e4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2ff9d87935e0d80978a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-04T14:00:00.000Z", "isVisible": true, "shortName": "2025 (4 Apr Shift 2)", "title": "JEE Main 2025 (4 Apr Shift 2)"}], "question": {"text": "Given below are two statements :<br/>Statement (I) : The dimensions of Planck's constant and angular momentum are same.<br/>Statement (II) : In Bohr's model electron revolve around the nucleus only in those orbits for which angular momentum is integral multiple of Planck's constant.<br/>In the light of the above statements, choose the most appropriate answer from the options given below :", "image": null}, "options": [{"id": "OD93K", "text": "Both Statement I and Statement II are correct", "image": null, "isCorrect": false}, {"id": "paxdm", "text": "Statement I is incorrect but Statement II is correct", "image": null, "isCorrect": false}, {"id": "XZe2T", "text": "Statement I is correct but Statement II is incorrect", "image": null, "isCorrect": true}, {"id": "kL6lW", "text": "Both Statement I and Statement II are incorrect", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}<br/>& \\mathrm{E}=\\mathrm{hf} \\\\\n& \\mathrm{ML}^2 \\mathrm{~T}^{-2}=[\\mathrm{h}] \\times\\left[\\mathrm{T}^{-1}\\right] \\\\\n& {[\\mathrm{h}]=\\left[\\mathrm{ML}^2 \\mathrm{~T}^{-1}\\right]} \\\\\n& \\mathrm{L}=[\\mathrm{MVR}]=\\left[ hrm{L}^{-1} \\mathrm{~T}^{-2}\\right]$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{E}=\\frac{\\mathrm{KQ}}{\\mathrm{R}^2} \\\\ & \\mathrm{E}=\\frac{\\mathrm{Q}}{4 \\pi \\varepsilon_0 \\mathrm{R}^2} \\\\ & \\varepsilon_0=\\frac{\\mathrm{Q}}{4 \\pi \\mathrm{R}^2 \\mathrm{E}} \\\\ & \\text { Now, } \\varepsilon_0 \\mathrm{E}^2=\\frac{\\mathrm{Q}}{4 \\pi \\mathrm{R}^2 \\mathrm{E}} \\cdot \\mathrm{E}^2=\\frac{\\mathrm{Q}}{4 \\pi \\mathrm{R}^2} \\cdot \\mathrm{E} \\\\ & {\\left[\\varepsilon_0 \\mathrm{E}^2\\right]=\\left[\\frac{\\mathrm{QE}}{\\mathrm{R}^2}\\right]=\\frac{[\\mathrm{Q}][\\mathrm{E}]}{\\left[\\mathrm{R}^2\\right]}=\\frac{[\\mathrm{Q}]}{\\left[\\mathrm{R}^2\\right]} \\frac{[\\mathrm{W}]}{[\\mathrm{Q}][\\mathrm{R}]}} \\\\ & =\\frac{[\\mathrm{W}]}{\\left[\\mathrm{R}^3\\right]}=\\frac{\\mathrm{ML}^2 \\mathrm{~T}^{-2}}{\\mathrm{~L}^3}=\\mathrm{ML}^{-1} \\mathrm{~T}^{-2}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ef278297dee60eda6f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2024 (08 Apr Shift 2)", "title": "JEE Main 2024 (08 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66446732970e6e9ab542d117", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "664466ef278297dee60eda6d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-06T14:00:00.000Z", "isVisible": true, "shortName": "2024 (06 Apr Shift 2)", "title": "JEE Main 2024 (06 Apr Shift 2)"}], "question": {"text": "Given below are two statements :\nStatement (I) : Dimensions of specific heat is $\\left[\\mathrm{L}^2 \\mathrm{~T}^{-2} \\mathrm{~K}^{-1}\\right]$.\nStatement (II) : Dimensions of gas constant is $\\left[\\mathrm{M} \\mathrm{L}^2 \\mathrm{~T}^{-1} \\mathrm{~K}^{-1}\\right]$.\nIn the lig
