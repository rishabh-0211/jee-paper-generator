alue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/8d810774-fb4a-49e3-8761-94a69a79128f-image7.png\" style=\"height: 68px; width: 280px;\" /><br /><br />Let the temperature of the junction <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> .</p><p>Rate of heat flow in Rod <math><mn>1</mn></math> = rate of heat flow in Rod <math><mn>2</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><mi>kA</mi></mrow><mi mathvariant=\"normal\">d</mi></mfrac><mfenced separators=\"|\"><mrow><msub><mi mathvariant=\"normal\">θ</mi><mn>2</mn></msub><mo>-</mo><mi mathvariant=\"normal\">T</mi></mrow></mfenced><mo>=</mo><mfrac><mi>kA</mi><mrow><mn>3</mn><mi mathvariant=\"normal\">d</mi></mrow></mfrac><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">T</mi><mo>-</mo><msub><mi mathvariant=\"normal\">θ</mi><mn>1</mn></msub></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>9</mn><mfenced separators=\"|\"><mrow><msub><mi mathvariant=\"normal\">θ</mi><mn>2</mn></msub><mo>-</mo><mi mathvariant=\"normal\">T</mi></mrow></mfenced><mo>=</mo><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">T</mi><mo>-</mo><msub><mi mathvariant=\"normal\">θ</mi><mn>1</mn></msub></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>10</mn><mi mathvariant=\"normal\">T</mi><mo>=</mo><mn>9</mn><msub><mi mathvariant=\"normal\">θ</mi><mn>2</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">θ</mi><mn>1</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi mathvariant=\"normal\">T</mi><mo>=</mo><mfrac><mrow><mn>9</mn><msub><mi mathvariant=\"normal\">θ</mi><mn>2</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">θ</mi><mn>1</mn></msub></mrow><mn>10</mn></mfrac><mo>=</mo><mfrac><msub><mi>θ</mi><mn>1</mn></msub><mn>10</mn></mfrac><mo>+</mo><mfrac><mrow><mn>9</mn><msub><mi>θ</mi><mn>2</mn></msub></mrow><mn>10</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["DIAGRAM_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92ecde3d91842a5cf7f3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-09T14:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Apr Shift 2)", "title": "JEE Main 2019 (09 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d668bb", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7ee", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-12T09:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Jan Shift 1)", "title": "JEE Main 2019 (12 Jan Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "A cylinder of radius <math><mi>R</mi></math> is surrounded by a cylindrical shell of inner radius <math><mi>R</mi></math> and outer radius <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>R</mi></math>. The thermal conductivity of the material of the inner cylinder is <math><msub><mrow><mi>K</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and that of the outer cylinder is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mn>2</mn></msub></math>.&nbsp;Assuming no loss of heat, the effective thermal conductivity of the system for heat flowing along the&nbsp;length of the cylinder is:", "image": null}, "options": [{"id": "Po03l", "text": "<math><mfrac><mrow><mn>2</mn><msub><mrow><mi>K</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><mn>3</mn><msub><mrow><mi>K</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>5</mn></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "3Axl1", "text": "<math><mfrac><mrow><msub><mrow><mi>K</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>K</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "07022", "text": "<math><msub><mrow><mi>K</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>K</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "isCorrect": false, "image": null}, {"id": "sx6w4", "text": "<math><mfrac><mrow><msub><mrow><mi>K</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><mn>3</mn><msub><mrow><mi>K</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Let <math><msub><mrow><mi>q</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi>q</mi></mrow><mrow><mn>2</mn></mrow></msub></math> be the rate of flow of heat through inner part from outer part respecting net flow of heat<br /><br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/bcc4c1bc-ab9f-460a-8904-04eb2ba2e6c6-image.png\" style=\"width: 393px; height: 156px;\" /><br /><math><mi>q</mi><mo>=</mo><msub><mrow><mi>q</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>q</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br /><math><mo>=</mo><mfrac><mrow><msub><mrow><mi>K</mi></mrow><mrow><mn>1</mn></mrow></msub><mi>&#960;</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>l</mi></mrow></mfrac><mo>.</mo><mi mathvariant=\"normal\">&#916;</mi><mi>T</mi><mo>+</mo><mfrac><mrow><msub><mrow><mi>K</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>.</mo><mi>&#960;</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mn>2</mn><mi>R</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced></mrow><mrow><mi>l</mi></mrow></mfrac><mo>.</mo><mi mathvariant=\"normal\">&#916;</mi><mi>T</mi></math><br /><br /><math><mo>=</mo><mfrac><mrow><mi>&#960;</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>l</mi></mrow></mfrac><mi mathvariant=\"normal\">&#916;</mi><mi>T</mi><mfenced separators=\"|\"><mrow><msub><mrow><mi>K</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><mn>3</mn><msub><mrow><mi>K</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></math><br /><br />If the cylinder is replaced by a single material of thermal conductivity <math><mi>K</mi></math> then<br /><br /><math><mi>q</mi><mo>=</mo><mfrac><mrow><mi>K</mi><mo>.</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>2</mn><mi>R</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>l</mi></mrow></mfrac><mo>.</mo><mi mathvariant=\"normal\">&#916;</mi><mi>T</mi></math><br /><br />On comparison,<br /><br /><math><mi>K</mi><mo>=</mo><mfrac><mrow><msub><mrow><mi>K</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><mn>3</mn><msub><mrow><mi>K</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>4</mn></mrow></mfrac></math>.</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ee", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-12T09:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Jan Shift 1)", "title": "JEE Main 2019 (12 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d66692", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7ea", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-10T09:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Jan Shift 1)", "title": "JEE Main 2019 (10 Jan Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "A heat source at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><msup><mn>10</mn><mn>3</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math> is connected to another heat reservoir at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><msup><mn>10</mn><mn>2</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math> by a copper slab which is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">m</mi></math> thick. Given that the thermal conductivity of copper is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.1</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">W</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mi mathvariant=\"normal\">&#160;</mi><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>, the energy flux through it in the steady-state is:", "image": null}, "options": [{"id": "U5L3q", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>65</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">W</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "isCorrect": false, "image": null}, {"id": "ycwwc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>120</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">W</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "isCorrect": false, "image": null}, {"id": "yQa4R", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>90</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">W</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "isCorrect": true, "image": null}, {"id": "gjHHp", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">W</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Given,</p><p>Temperature of heat source,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mi mathvariant=\"normal\">H</mi></msub><mo>=</mo><msup><mn>10</mn><mn>3</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math>,</p><p>Temperature of heat reservoir,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mi mathvariant=\"normal\">L</mi></msub><mo>=</mo><msup><mn>10</mn><mn>2</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math>,</p><p>Conductivity of copper&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">W</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p><p>From the equation of steady-state heat flow,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>d</mo><mi>Q</mi></mrow><mrow><mo>d</mo><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>K</mi><mi>A</mi><mo>&#8710;</mo><mi>T</mi></mrow><mi>L</mi></mfrac></math></p><p>Heat energy flux&nbsp;can be defined as the rate of heat energy transfer through a given surface.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>A</mi></mfrac><mfenced><mfrac><mrow><mo>d</mo><mi>Q</mi></mrow><mrow><mo>d</mo><mi>t</mi></mrow></mfrac></mfenced><mo>=</mo><mi>K</mi><mo>&#215;</mo><mfrac><mrow><mn>1000</mn><mo>-</mo><mn>100</mn></mrow><mn>1</mn></mfrac><mo>=</mo><mn>90</mn><mo>&#160;</mo><mi mathvariant=\"normal\">W</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "4164ddebe3f84070890c9e9afa6df223", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/IAVBsNiizxyHG.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/IAVBsNiizxyHG.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ea", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-10T09:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Jan Shift 1)", "title": "JEE Main 2019 (10 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d66534", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-09T09:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Jan Shift 1)", "title": "JEE Main 2019 (09 Jan Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Temperature difference of <math><msup><mrow><mn>120</mn></mrow><mrow><mi>o</mi></mrow></msup><mi>C</mi></math> is maintained between two ends of a uniform rod <math><mi>A</mi><mi>B</mi></math> of length <math><mn>2</mn><mi>L</mi><mo>.</mo></math> Another bent rod <math><mi>P</mi><mi>Q</mi><mo>,</mo></math> of same cross-section as <math><mi>A</mi><mi>B</mi></math> and length <math><mfrac><mrow><mn>3</mn><mi>L</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo></math> is connected across <math><mi>A</mi><mi>B</mi></math> (See figure). In steady state, temperature difference between <math><mi>P</mi></math> and <math><mi>Q</mi></math> will be close to:<br /><img height=\"139\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f4a72c42-4915-42fe-835c-5022aa111e48-image.png\" width=\"379\" /></p>", "image": null}, "options": [{"id": "wNvTf", "text": "<math><msup><mrow><mn>45</mn></mrow><mrow><mi>o</mi></mrow></msup><mi>C</mi></math>", "isCorrect": true, "image": null}, {"id": "FdDGI", "text": "<math><msup><mrow><mn>35</mn></mrow><mrow><mi>o</mi></mrow></msup><mi>C</mi></math>", "isCorrect": false, "image": null}, {"id": "d0xBj", "text": "<math><msup><mrow><mn>60</mn></mrow><mrow><mi>o</mi></mrow></msup><mi>C</mi></math>", "isCorrect": false, "image": null}, {"id": "vIquU", "text": "<math><msup><mrow><mn>75</mn></mrow><mrow><mi>o</mi></mrow></msup><mi>C</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><math><msub><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><msup><mrow><mn>120</mn></mrow><mrow><mi>o</mi></mrow></msup><mi>C</mi></math><br /><br />We define thermal resistance<br /><br /><math><mi>R</mi><mo>=</mo><mfrac><mrow><mi>L</mi></mrow><mrow><mi>K</mi><mi>A</mi></mrow></mfrac></math><br /><br />Given circuit can be reduced to<br /><br /><img height=\"194\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/20a06099-0d57-4864-9075-89597cda2163-image.png\" width=\"329\" /></p><p>Equivalent resistance <math><msub><mrow><mi>R</mi></mrow><mrow><mi>e</mi><mi>q</mi></mrow></msub><mo>=</mo><mfrac><mrow><mn>8</mn><mi>R</mi></mrow><mrow><mn>5</mn></mrow></mfrac></math><br /><br />Thermal current <math><mi>i</mi><mo>=</mo><mfrac><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mfrac><mrow><mn>8</mn><mi>R</mi></mrow><mrow><mn>5</mn></mrow></mfrac></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mi>P</mi></msub><mo>-</mo><msub><mi>T</mi><mi>Q</mi></msub><mo>=</mo><mfrac><mrow><msub><mi>T</mi><mn>1</mn></msub><mo>-</mo><msub><mi>T</mi><mn>2</mn></msub></mrow><mrow><mfenced separators=\"|\"><mfrac><mrow><mn>8</mn><mi>R</mi></mrow><mn>5</mn></mfrac></mfenced><mi>&#160;</mi></mrow></mfrac><mfenced separators=\"|\"><mfrac><mrow><mn>3</mn><mi>R</mi></mrow><mn>5</mn></mfrac></mfenced></math><br /><br /><math><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>8</mn></mrow></mfrac><mo>&#215;</mo><mn>120</mn><mo>=</mo><mn>45</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["DIAGRAM_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92ebde3d91842a5cf7e8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-09T09:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Jan Shift 1)", "title": "JEE Main 2019 (09 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65d1b", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6486", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2014 (06 Apr)", "title": "JEE Main 2014 (06 Apr)"}], "question": {"text": "Three rods of Copper, Brass and Steel are welded together to form a Y-shaped structure. Area of cross-section of each rod is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#160;</mo><msup><mi>cm</mi><mn>2</mn></msup></math>. End of copper rod is maintained at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>. Where as ends of brass and steel are kept at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>. Lengths of the copper, brass and steel rods are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>46</mn><mo>,</mo><mo>&#160;</mo><mn>13</mn><mo>&#160;</mo></math>and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>&#160;</mo><mi>cms</mi></math> respectively. The rods are thermally insulated from surroundings except at ends. Thermal conductivities of copper, brass and steel are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>92</mn><mo>,</mo><mo>&#160;</mo><mn>0</mn><mo>.</mo><mn>26</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>12</mn></math>&nbsp;CGS units respectively. Rate of heat flow through copper rod is :", "image": null}, "options": [{"id": "v5fx0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>2</mn><mo>&#160;</mo><mi>Cal</mi><mo>/</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "J4N64", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>4</mn><mo>&#160;</mo><mi>Cal</mi><mo>/</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "tsYvK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>.</mo><mn>8</mn><mo>&#160;</mo><mi>Cal</mi><mo>/</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": true}, {"id": "Q4GmD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>.</mo><mn>0</mn><mo>&#160;</mo><mi>Cal</mi><mo>/</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mrow><mi>C</mi><mi>u</mi></mrow></msub><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>46</mn><mo>&#160;</mo><mi>cm</mi><mo>;</mo><mo>&#160;</mo><msub><mi>L</mi><mi>B</mi></msub><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>13</mn><mo>&#160;</mo><mi>cm</mi><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><msub><mi>L</mi><mi>S</mi></msub><mo>=</mo><mn>12</mn><mo>&#160;</mo><mi>cm</mi></math>.<br /><br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/589e9e31-9ddb-4884-8c61-b300b334aff9-image.png\" style=\"width: 220px; height: 178px;\" /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable><mtr><mtd><msub><mi>K</mi><mrow><mi>C</mi><mi>u</mi></mrow></msub><mo>=</mo><mn>0</mn><mo>.92</mo></mtd></mtr><mtr><mtd><msub><mi>K</mi><mi>B</mi></msub><mo>=</mo><mn>0</mn><mo>.26</mo></mtd></mtr><mtr><mtd><msub><mi>K</mi><mi>S</mi></msub><mo>=</mo><mn>0</mn><mo>.12</mo></mtd></mtr></mtable><mo>}</mo><mi>C</mi><mi>G</mi><mi>S</mi><mo>unit</mo></math><br /><br />We know that&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mfrac><mi>L</mi><mrow><mi>K</mi><mi>A</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mrow><mi>C</mi><mi>u</mi></mrow></msub><mo>=</mo><mfrac><mn>46</mn><mrow><mn>0</mn><mo>.92</mo><mo>&#215;</mo><mn>4</mn></mrow></mfrac><mo>=</mo><mn>12</mn><mo>.5</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mi>B</mi></msub><mo>=</mo><mfrac><mi>13</mi><mrow><mn>0</mn><mo>.26</mo><mo>&#215;</mo><mn>4</mn></mrow></mfrac><mo>=</mo><mn>12</mn><mo>.5</mo></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mi>S</mi></msub><mo>=</mo><mfrac><mn>12</mn><mrow><mn>0</mn><mo>.12</mo><mo>&#215;</mo><mn>4</mn></mrow></mfrac><mo>=</mo><mi>25</mi></math></p></blockquote><blockquote><p>Now, if <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> is temperature of junction then<br /><br />&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>100</mi><mo>-</mo><mi>T</mi></mrow><msub><mi>R</mi><mrow><mi>C</mi><mi>u</mi></mrow></msub></mfrac><mo>=</mo><mfrac><mrow><mi>T</mi><mo>-</mo><mn>0</mn></mrow><msub><mi>R</mi><mi>B</mi></msub></mfrac><mo>+</mo><mfrac><mrow><mi>T</mi><mo>-</mo><mn>0</mn></mrow><msub><mi>R</mi><mi>S</mi></msub></mfrac></math><br /><br />&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>100</mi><mo>-</mo><mi>T</mi></mrow><mrow><mn>12</mn><mo>.5</mo></mrow></mfrac><mo>=</mo><mfrac><mi>T</mi><mrow><mn>12</mn><mo>.5</mo></mrow></mfrac><mo>+</mo><mfrac><mi>T</mi><mi>25</mi></mfrac></math><br /><br />&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>&#8756;</mtext><mfrac><mrow><mi>100</mi><mo>-</mo><mi>T</mi></mrow><mrow><mn>12</mn><mo>.5</mo></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn><mi>T</mi></mrow><mi>25</mi></mfrac></math><br /><br />&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>=</mo><mn>5</mn><mi>T</mi></math><br /><br />&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>T</mi><msup><mo>=40</mo><mo>&#8728;</mo></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>Q</mi><mrow><mi>C</mi><mi>u</mi></mrow></msub><mo>=</mo><mfrac><mrow><mn>100</mn><mo>-</mo><mi>T</mi></mrow><msub><mi>R</mi><mrow><mi>C</mi><mi>u</mi></mrow></msub></mfrac></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>=</mtext><mfrac><mrow><mn>100</mn><mo>-</mo><mn>40</mn></mrow><mrow><mn>12</mn><mo>.5</mo></mrow></mfrac></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>=</mtext><mfrac><mn>60</mn><mrow><mn>12</mn><mo>.5</mo></mrow></mfrac></math><br /><br />&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>Q</mi><mrow><mi>C</mi><mi>u</mi></mrow></msub><mo>=</mo><mn>4</mn><mo>.8&#160;</mo><mi>Cal</mi><mo>/</mo><mi mathvariant=\"normal\">s</mi></math></p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6486", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2014 (06 Apr)", "title": "JEE Main 2014 (06 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65a49", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cf", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-19T09:00:00.000Z", "isVisible": true, "shortName": "2012 (19 May Online)", "title": "JEE Main 2012 (19 May Online)"}], "question": {"text": "A large cylindrical rod of length $L$ is made by joining two identical rods of copper and steel of length $\\left(\\frac{L}{2}\\right)$ each. The rods are completely insulated from the surroundings. If the free end of copper rod is maintained at $100^{\\circ} \\mathrm{C}$ and that of steel at $0^{\\circ} \\mathrm{C}$ then the temperature of junction is (Thermal conductivity of copper is 9 times that of steel)", "image": null}, "options": [{"id": "fD4uF", "text": "\n$90^{\\circ} \\mathrm{C}$\n", "image": null, "isCorrect": true}, {"id": "Oy0bQ", "text": "\n$50^{\\circ} \\mathrm{C}$\n", "image": null, "isCorrect": false}, {"id": "Fc4W0", "text": "\n$10^{\\circ} \\mathrm{C}$\n", "image": null, "isCorrect": false}, {"id": "5VxY1", "text": "\n$67^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/EpEPTLevK9sZJJQ3JQ-fnVW026Kq4MQaBDs4v86My-0.original.fullsize.png\"><br>\n\n\nLet conductivity of steel $K_{\\text {steel }}=k$ then from question\nConductivity of copper $K_{\\text {copper }}=9 k$\n$$\n\\begin{aligned}\n& \\theta_{\\text {copper }}=100^{\\circ} \\mathrm{C} \\\\\n& \\theta_{\\text {steel }}=0^{\\circ} \\mathrm{C} \\\\\n& l_{\\text {steel }}=l_{\\text {copper }}=\\frac{L}{2}\n\\end{aligned}\n$$\nFrom formula temperature of junction;\n$$\n\\begin{aligned}\n\\theta & =\\frac{K_{\\text {copper }} \\theta_{\\text {copper }} l_{\\text {steel }}+K_{\\text {steel }} \\theta_{\\text {steel }} l_{\\text {copper }}}{K_{\\text {copper }} l_{\\text {steel }}+K_{\\text {steel }} l_{\\text {copper }}} \\\\\n& =\\frac{9 k \\times 100 \\times \\frac{L}{2}+k \\times 0 \\times \\frac{L}{2}}{9 k \\times \\frac{L}{2}+k \\times \\frac{L}{2}} \\\\\n& =\\frac{\\frac{900}{2} k L}{\\frac{10 k L}{2}}=90^{\\circ} \\mathrm{C}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7cf", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-19T09:00:00.000Z", "isVisible": true, "shortName": "2012 (19 May Online)", "title": "JEE Main 2012 (19 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d658ee", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7ca", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "JEE Main 2010"}], "question": {"text": "Two conductors have the same resistance at $0^{\\circ} \\mathrm{C}$ but their temperature coefficients of resistance are $\\alpha_1$ and $\\alpha_2$. The respective temperature coefficients of their series and parallel combinations are nearly", "image": null}, "options": [{"id": "wHLs2", "text": "\n$\\frac{\\alpha_1+\\alpha_2}{2}, \\alpha_1+\\alpha_2$\n", "image": null, "isCorrect": false}, {"id": "QEQ9e", "text": "\n$\\alpha_1+\\alpha_2, \\frac{\\alpha_1+\\alpha_2}{2}$\n", "image": null, "isCorrect": false}, {"id": "WIg7r", "text": "\n$\\alpha_1+\\alpha_2, \\frac{\\alpha_1 \\alpha_2}{\\alpha_1+\\alpha_2}$\n", "image": null, "isCorrect": false}, {"id": "f5lyo", "text": "\n$\\frac{\\alpha_1+\\alpha_2}{2}, \\frac{\\alpha_1+\\alpha_2}{2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $R_0$ be the initial resistance of both conductors $\\therefore \\quad$ At temperature $\\theta$ their resistance will be, $R_1=R_0\\left(1+\\alpha_1 \\theta\\right)$ and $R_2=R_0\\left(1+\\alpha_2 \\theta\\right)$\nfor, series combination, $\\mathrm{R}_{\\mathrm{s}}=\\mathrm{R}_1+\\mathrm{R}_2$ $R_{s 0}\\left(1+\\alpha_s \\theta\\right)=R_0\\left(1+\\alpha_1 \\theta\\right)+R_0\\left(1+\\alpha_2 \\theta\\right)$\nwhere $\\mathrm{R}_{\\mathrm{s} 0}=\\mathrm{R}_0+\\mathrm{R}_0=2 \\mathrm{R}_0$\n$\\therefore \\quad 2 \\mathrm{R}_0\\left(1+\\alpha_s \\theta\\right)=2 \\mathrm{R}_0+\\mathrm{R}_0 \\theta\\left(\\alpha_1+\\alpha_2\\right)$\nor $\\quad \\alpha_s=\\frac{\\alpha_1+\\alpha_2}{2}$\nfor parallel combination,\n$$\nR_p=\\frac{R_1 R_2}{R_1+R_2}\n$$\nwhere, $R_{p 0}=\\frac{R_0 R_0}{R_0+R_0}=\\frac{R_0}{2}$\n$\\therefore \\quad \\frac{\\mathrm{R}_0}{2}\\left(1+\\alpha_{\\mathrm{p}} \\theta\\right)=\\frac{\\mathrm{R}_0^2\\left(1+\\alpha_1 \\theta+\\alpha_2 \\theta+\\alpha_1 \\alpha_2 \\theta\\right)}{\\mathrm{R}_0\\left(2+\\alpha_1 \\theta+\\alpha_2 \\theta\\right)}$\nas $\\alpha_1$ and $\\alpha_2$ are small quantities\n$\\therefore \\quad \\alpha_1 \\alpha_2$ is negligible\nor $\\quad \\alpha_{\\mathrm{p}}=\\frac{\\alpha_1+\\alpha_2}{2+\\left(\\alpha_1+\\alpha_2\\right) \\theta}=\\frac{\\alpha_1+\\alpha_2}{2}\\left[1-\\left(\\alpha_1+\\alpha_2\\right) \\theta\\right]$\nas $\\left(\\alpha_1+\\alpha_2\\right)^2$ is negligible\n$\\therefore \\quad \\alpha_p=\\frac{\\alpha_1+\\alpha_2}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7ca", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "JEE Main 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65893", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "JEE Main 2009"}], "question": {"text": "A long metallic bar is carrying heat from one of its ends to the other end under steady-state. The variation of temperature $\\theta$ along the length $x$ of the bar from its hot end is best described by which of the following figure.", "image": null}, "options": [{"id": "rIl3E", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/e4HDANxbgbefays3Y24TWkhk3pJps5PSZkQ5JV_bj8M.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "mKXZC", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/JEPjvj3TZYzP0q-z1lt6I5dCrC9oGiZBxayZVvtoCi4.original.fullsize.png\"><br>", "image": null, "isCorrect": true}, {"id": "fghef", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/tIQKCxiqVRApkI4wdBPUx0LRofvePWCj7gvq5M27700.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "iM56k", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/_k4sklVdy7pJ_CT9rsgTmbgaSJKJzJBqNeH3U7Ijfeg.original.fullsize.png\"><br>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We know that $\\frac{\\mathrm{dQ}}{\\mathrm{dt}}=\\mathrm{KA} \\frac{\\mathrm{d} \\theta}{\\mathrm{dx}}$\nIn steady state flow of heat\n$$\n\\begin{aligned}\n& \\mathrm{d} \\theta=\\frac{\\mathrm{dQ}}{\\mathrm{dt}} \\cdot \\frac{1}{\\mathrm{kA}} \\cdot \\mathrm{dx} \\\\\n& \\Rightarrow \\theta_{\\mathrm{H}}-\\theta=\\mathrm{k}^{\\prime} \\mathrm{x} \\Rightarrow \\theta=\\theta_{\\mathrm{H}}-\\mathrm{k}^{\\prime} \\mathrm{x}\n\\end{aligned}\n$$\nEquation $\\theta=\\theta_H-k^{\\prime} x$ represents a straight line.", "image": null}, "videoSolution": null, "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92eade3d91842a5cf7c9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "JEE Main 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d657b5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "JEE Main 2007"}], "question": {"text": "One end of a thermally insulated rod is kept at a temperature $T_1$ and the other at $T_2$. The rod is composed of two sections of lengths $\\ell_1$ and $\\ell_2$ and thermal conductivities $k_1$ and $k_2$ respectively. The temperature at the interface of the two sections is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/lU9yqQM8slE1vxvQecwJkZrAP09Em5caLBNH6_NK9NQ.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "32USN", "text": "\n$\\left(\\mathrm{k}_2 \\ell_2 \\mathrm{T}_1+\\mathrm{k}_1 \\ell_1 \\mathrm{T}_2\\right) /\\left(\\mathrm{k}_1 \\ell_1+\\mathrm{k}_2 \\ell_2\\right)$\n", "image": null, "isCorrect": false}, {"id": "okTcO", "text": "\n$\\left(\\mathrm{k}_2 \\ell_1 \\mathrm{T}_1+\\mathrm{k}_1 \\ell_1 \\mathrm{T}_2\\right) /\\left(\\mathrm{k}_2 \\ell_1+\\mathrm{k}_1 \\ell_2\\right)$\n", "image": null, "isCorrect": false}, {"id": "qmBDF", "text": "\n$\\left(\\mathrm{k}_1 \\ell_2 \\mathrm{T}_1+\\mathrm{k}_2 \\ell_1 \\mathrm{T}_2\\right) /\\left(\\mathrm{k}_1 \\ell_2+\\mathrm{k}_2 \\ell_1\\right)$\n", "image": null, "isCorrect": true}, {"id": "B9a48", "text": "\n$\\left(\\mathrm{k}_1 \\ell_1 \\mathrm{T}_1+\\mathrm{k}_2 \\ell_2 \\mathrm{T}_2\\right) /\\left(\\mathrm{k}_1 \\ell_1+\\mathrm{k}_2 \\ell_2\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\frac{\\left(\\mathrm{T}_1-\\mathrm{T}\\right) \\mathrm{k}_1}{\\ell_1}=\\frac{\\left(\\mathrm{T}-\\mathrm{T}_2\\right) \\mathrm{k}_2}{\\ell_2}$\n$\\mathrm{~T}=\\frac{\\mathrm{T}_1 \\mathrm{k}_1 \\ell_2+\\mathrm{T}_2 \\mathrm{k}_2 \\ell_1}{\\mathrm{k}_1 \\ell_2+\\mathrm{k}_2 \\ell_1}$", "image": null}, "videoSolution": null, "questionStructure": ["DIAGRAM_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92eade3d91842a5cf7c7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "JEE Main 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65648", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}], "question": {"text": "The figure shows a system of two concentric spheres of radii $r_1$ and $r_2$ and kept at temperatures $T_1$ and $T_2$ respectively. The radial rate of flow of heat in a substance between the two concentric sphere is proportional to\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ycFlqotxBQRj2YkqnJHZrvJVsEPsx28hjVxd9dkJ4F4.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "IPNB6", "text": "\n$\\frac{r_2-r_1}{r_1 r_2}$\n", "image": null, "isCorrect": false}, {"id": "h4McS", "text": "\n$\\ln \\left(\\frac{r_2}{r_1}\\right)$\n", "image": null, "isCorrect": false}, {"id": "cZXJg", "text": "\n$\\frac{r_1 r_2}{r_2-r_1}$\n", "image": null, "isCorrect": true}, {"id": "VUi78", "text": "\n$\\ln \\left(r_2-r_1\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\left(\\frac{\\mathrm{dQ}}{\\mathrm{dt}}\\right)=\\left(\\mathrm{T}_1-\\mathrm{T}_2\\right) \\frac{4 \\pi \\mathrm{r}_1 \\mathrm{r}_2 \\mathrm{~K}}{\\left(\\mathrm{r}_2-\\mathrm{r}_1\\right)}$", "image": null}, "videoSolution": null, "questionStructure": ["DIAGRAM_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65579", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}], "question": {"text": "The thermo emf of a thermocouple varies with the temperature $\\theta$ of the hot junction as $\\mathrm{E}=\\mathrm{a} \\theta+\\mathrm{b} \\theta^2$ in volts where the ratio $\\mathrm{a} / \\mathrm{b}$ is $700^{\\circ} \\mathrm{C}$. If the cold junction is kept at $0^{\\circ} \\mathrm{C}$, then the neutral temperature is", "image": null}, "options": [{"id": "e65Ho", "text": "\n$700^{\\circ} \\mathrm{C}$\n", "image": null, "isCorrect": false}, {"id": "MKR4j", "text": "\n$350^{\\circ} \\mathrm{C}$\n", "image": null, "isCorrect": false}, {"id": "OAM20", "text": "\n$1400^{\\circ} \\mathrm{C}$\n", "image": null, "isCorrect": false}, {"id": "rXkdx", "text": "\nno neutral temperature is possible for this thermocouple.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$E=a \\theta+b \\theta^2$\nAt neutral temperature $\\mathrm{dE} / \\mathrm{d} \\theta=0$\n$\\therefore \\frac{\\mathrm{dE}}{\\mathrm{d} \\theta}=\\mathrm{a}+2 \\mathrm{~b} \\theta_{\\mathrm{n}}=0 ; \\theta_{\\mathrm{n}}=-\\frac{\\mathrm{a}}{2 \\mathrm{~b}}$\nNow $\\frac{a}{b}=700^{\\circ} \\mathrm{C}$ (given)\n$\\theta_n=-700 / 2=-350^{\\circ} \\mathrm{C}$\nNow $\\theta_c=0^{\\circ} \\mathrm{C}$.\nSo, $\\theta_n>0^{\\circ} \\mathrm{C}$\nBut mathematically $\\theta_{\\mathrm{n}} < 0^{\\circ} \\mathrm{C}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65577", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}], "question": {"text": "The thermistors are usually made of", "image": null}, "options": [{"id": "4FmrO", "text": "\nmetals with low temperature coefficient of resistivity\n", "image": null, "isCorrect": false}, {"id": "5s8hA", "text": "\nmetals with high temperature coefficient of resistivity\n", "image": null, "isCorrect": false}, {"id": "ZdqHc", "text": "\nmetal oxides with high temperature coefficient of resistivity \"\n", "image": null, "isCorrect": true}, {"id": "ZMAqa", "text": "\nsemiconducting materials having low temperature coefficient of resistivity.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "These are devices whose resistance varies quite markedly with temperature mean having high-temperature coefficient of resistivity. [Their name are derived from thermal resistors]. Depending on their composition they can have either negative temperature coefficient or positive temperature coefficient or positive temperature coefficient or positive temperature coefficient characteristics.\nThe negative temperature coefficient type consists of a mixture of oxides of iron, nickel, and cobalt with small amounts of other substances. The positive temperature coefficient types are based on barium titanate.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65569", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}], "question": {"text": "The temperature of two outer surfaces of a composite slab, consisting of two materials having coefficients of thermal conductivity $K$ and $2 K$ and thickness $x$ and $4 x$, respectively are $T_2$ and $T_1\\left(T_2>T_1\\right)$. The rate of heat transfer through the slab, in a steady state is $\\left(\\frac{A\\left(T_2-T_1\\right) K}{x}\\right) f$, with $f$ equal to\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/hqP8B6rNJuy4jVRR4908Y8vPLIJLljqlXSe9P5NSw8M.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "NpxAD", "text": "\n1\n", "image": null, "isCorrect": false}, {"id": "A8uYS", "text": "\n$1 / 2$\n", "image": null, "isCorrect": false}, {"id": "2Jalt", "text": "\n$2 / 3$\n", "image": null, "isCorrect": false}, {"id": "t1LKs", "text": "\n$1 / 3$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\Delta \\mathrm{q}=\\frac{\\mathrm{kA}}{\\mathrm{x}}\\left[\\mathrm{T}_2-\\frac{2 \\mathrm{~T}_2-\\mathrm{T}_1}{3}\\right]$\n$=\\frac{\\mathrm{kA}}{3 \\mathrm{x}}\\left[\\mathrm{T}_2-\\mathrm{T}_1\\right]$", "image": null}, "videoSolution": null, "questionStructure": ["DIAGRAM_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d653ce", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}], "question": {"text": "If $\\theta_i$, is the inversion temperature, $\\theta_n$ is the neutral temperature, $\\theta_c$ is the temperature of the cold junction, then", "image": null}, "options": [{"id": "hyCw7", "text": "\n$\\theta_i+\\theta_c=\\theta_n$\n", "image": null, "isCorrect": false}, {"id": "LSg38", "text": "\n$\\theta_{\\mathrm{i}}-\\theta_c=2 \\theta_n$\n", "image": null, "isCorrect": false}, {"id": "BjZAx", "text": "\n$\\frac{\\theta_i+\\theta_c}{2}=\\theta_n$\n", "image": null, "isCorrect": true}, {"id": "7DGde", "text": "\n$\\theta_c-\\theta_i=2 \\theta_n$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution Available", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "648b5a73417cc3fb48d691f1", "title": "Radiation", "totalQuestions": 25, "questions": [{"_id": "68542c667c09d044e4c1a1cc", "type": "numerical", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2fe9d87935e0d809788", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2025 (7 Apr Shift 1)", "title": "JEE Main 2025 (7 Apr Shift 1)"}], "question": {"text": "A wire of length 10 cm and diameter 0.5 mm is used in a bulb. The temperature of the wire is $1727^{\\circ} \\mathrm{C}$ and power radiated by the wire is 94.2 W. Its emissivity is $\\frac{x}{8}$ where $x=$_______<br/>(Given $\\sigma=6.0 \\times 10^{-8} \\mathrm{~W} \\mathrm{~m}^{-2} \\mathrm{~K}^{-4}, \\pi=3.14$ and assume that the emissivity of wire material is same at all wavelength.)", "image": null}, "options": [], "correctValue": "5", "solution": {"text": "$\\mathrm{L}=10 \\mathrm{~cm}, \\mathrm{~d}=0.5 \\mathrm{~mm}, \\mathrm{~T}=1727^{\\circ} \\mathrm{C}=2000 \\mathrm{~K}$<br/>Power, $\\mathrm{P}=94.2 \\mathrm{~W}$<br/>$\\mathrm{P}=\\varepsilon \\sigma \\mathrm{AT}^4$<br/>$94.2=\\varepsilon \\times\\left(6 \\times 10^{-8}\\right)(\\pi \\mathrm{dL})(2000)^4$<br/>$94.2=\\varepsilon \\times\\left(6 \\times 10^{-8}\\right)(3.14)(0.5)\\left(10^{-3}\\right)$<br/>$\\left(10 \\times 10^{-2}\\right)(2000)^4$<br/>$\\varepsilon=\\frac{94.2}{(94.2)(16)}=\\frac{5}{8}$", "image": null}, "videoSolution": {"videoId": "8e4986c733e4414ca0f7eae4b964f61d", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/IFHVArQoGluHa.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/IFHVArQoGluHa.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6852f2fe9d87935e0d809788", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2025 (7 Apr Shift 1)", "title": "JEE Main 2025 (7 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2eed7c8b73881fdaea35a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5da6d4514bf2d97611", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2025 (29 Jan Shift 2)", "title": "JEE Main 2025 (29 Jan Shift 2)"}], "question": {"text": "A cup of coffee cools from $90^{\\circ} \\mathrm{C}$ to $80^{\\circ} \\mathrm{C}$ in t minutes when the room temperature is $20^{\\circ} \\mathrm{C}$. The time taken by the similar cup of coffee to cool from $80^{\\circ} \\mathrm{C}$ to $60^{\\circ} \\mathrm{C}$ at the same room temperature is :", "image": null}, "options": [{"id": "thgME", "text": "$\\frac{13}{10} \\mathrm{t}$", "image": null, "isCorrect": false}, {"id": "ve2mI", "text": "$\\frac{10}{13} \\mathrm{t}$", "image": null, "isCorrect": false}, {"id": "epSNX", "text": "$\\frac{5}{13} \\mathrm{t}$", "image": null, "isCorrect": false}, {"id": "4mGeA", "text": "$\\frac{13}{5} \\mathrm{t}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "By using average form of Newton's law of cooling\n$\\begin{aligned}\n& \\frac{90-80}{\\mathrm{t}}=\\mathrm{k}\\left(\\frac{90+80}{2}-20\\right) \\\\\n& \\frac{80-60}{\\mathrm{t}^{\\prime}}=\\mathrm{k}\\left(\\frac{80+60}{2}-20\\right)\n\\end{aligned}$\n$\\begin{aligned}\n& \\text { (i)/(ii) } \\\\\n& \\frac{10 \\times \\mathrm{t}^{\\prime}}{\\mathrm{t} \\times 20}=\\frac{65}{50} \\\\\n& \\mathrm{t}^{\\prime}=\\frac{65}{50} \\times 2 \\mathrm{t}=\\frac{65}{25} \\mathrm{t}=\\frac{13}{5} \\mathrm{t}\n\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "9b9608964dd4422ab0fb01994b693fb6", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/N1AbExiU4i0Ny.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/N1AbExiU4i0Ny.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67a2eb5da6d4514bf2d97611", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2025 (29 Jan Shift 2)", "title": "JEE Main 2025 (29 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2ee88c8b73881fdaea0b8", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5ca6d4514bf2d97608", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-22T09:00:00.000Z", "isVisible": true, "shortName": "2025 (22 Jan Shift 1)", "title": "JEE Main 2025 (22 Jan Shift 1)"}], "question": {"text": "Two spherical bodies of same materials having radii 0.2 m and 0.8 m are placed in same atmosphere. The temperature of the smaller body is 800 K and temperature of the bigger body is 400 K . If the energy radiated from the smaller body is E, the energy radiated from the bigger body is (assume, effect of the surrounding temperature to be negligible),", "image": null}, "options": [{"id": "1XHmz", "text": "16 E", "image": null, "isCorrect": false}, {"id": "Hqkpv", "text": "E", "image": null, "isCorrect": true}, {"id": "YCdmf", "text": "64 E", "image": null, "isCorrect": false}, {"id": "cZ5J3", "text": "256 E", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\frac{\\mathrm{d} \\theta}{\\mathrm{dt}}=\\sigma \\mathrm{eAT}^4 \\Rightarrow \\mathrm{P} \\propto \\mathrm{AT}^4 \\\\ & \\frac{\\mathrm{P}_{\\text {smaller }}}{\\mathrm{P}_{\\text {larger }}}=\\frac{(0.2)^2 \\times 800^4}{(0.8)^2 \\times 400^4} \\\\ & \\frac{1}{16} \\times 16=1 \\\\ & \\therefore \\mathrm{P}_{\\text {larger }}=\\mathrm{P}_{\\text {smaller }}\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "eecaba7fb27b45ec9fc5af0285e60356", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/mVuaBeNfdQxuQ.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/mVuaBeNfdQxuQ.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67a2eb5ca6d4514bf2d97608", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-22T09:00:00.000Z", "isVisible": true, "shortName": "2025 (22 Jan Shift 1)", "title": "JEE Main 2025 (22 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a71417cc3fb48d685fe", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6496", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 Apr Shift 1)", "title": "JEE Main 2023 (12 Apr Shift 1)"}], "question": {"text": "<p>A body cools from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>80</mn><mi mathvariant=\"normal\">o</mi></msup><mi mathvariant=\"normal\">C</mi></math>&nbsp;to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>60</mn><mi mathvariant=\"normal\">o</mi></msup></math> in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math> minutes. The temperature for the surrounding is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>20</mn><mi mathvariant=\"normal\">o</mi></msup><mi mathvariant=\"normal\">C</mi></math>. The time it takes to cool from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>60</mn><mi mathvariant=\"normal\">o</mi></msup><mi mathvariant=\"normal\">C</mi></math>&nbsp;to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>40</mn><mi mathvariant=\"normal\">o</mi></msup><mi mathvariant=\"normal\">C</mi></math>&nbsp;is</p>", "image": null}, "options": [{"id": "nMClI", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>450</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "aw25S", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>420</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "8MKn4", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>500</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": true}, {"id": "bPKAE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>25</mn><mn>3</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>The formula to calculate the rate of cooling of the object is given by</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>T</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mi>K</mi><mfenced close=\"]\" open=\"[\"><mrow><mfrac><mrow><msub><mi>T</mi><mi>f</mi></msub><mo>+</mo><msub><mi>T</mi><mi>i</mi></msub></mrow><mn>2</mn></mfrac><mo>-</mo><msub><mi>T</mi><mn>0</mn></msub></mrow></mfenced><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>1</mn></mfenced></math></p><p>For the first case, it can be written, using equation (1) that</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable columnalign=\"right center left\" columnspacing=\"0px\"><mtr><mtd><mfrac><mrow><mn>80</mn><mo>-</mo><mn>60</mn></mrow><mn>5</mn></mfrac></mtd><mtd><mo>=</mo></mtd><mtd><mi>K</mi><mfenced close=\"]\" open=\"[\"><mrow><mfrac><mrow><mn>80</mn><mo>+</mo><mn>60</mn></mrow><mn>2</mn></mfrac><mo>-</mo><mn>20</mn></mrow></mfenced></mtd></mtr><mtr><mtd><mn>4</mn></mtd><mtd><mo>=</mo></mtd><mtd><mn>50</mn><mi>K</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>2</mn></mfenced></mtd></mtr></mtable></math></p><p>If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi></math>&nbsp;is the required time for the second case, from equation (1), it can be written that</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable columnalign=\"right center left\" columnspacing=\"0px\"><mtr><mtd><mfrac><mrow><mn>60</mn><mo>-</mo><mn>40</mn></mrow><mi>t</mi></mfrac></mtd><mtd><mo>=</mo></mtd><mtd><mi>K</mi><mfenced close=\"]\" open=\"[\"><mrow><mfrac><mrow><mn>60</mn><mo>+</mo><mn>40</mn></mrow><mn>2</mn></mfrac><mo>-</mo><mn>20</mn></mrow></mfence n>70</mn></mfenced><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>1</mn></mfenced></math></p><p>Case&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>:</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>m</mi><mi>s</mi><mo>&#215;</mo><mn>6</mn></mrow><mrow><mi>&#916;</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mi>K</mi><mfenced><mrow><mfrac><mrow><mn>75</mn><mo>+</mo><mn>69</mn></mrow><mn>2</mn></mfrac><mo>-</mo><mn>22</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>6</mn><mrow><mi>&#916;</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mfrac><mi>K</mi><mrow><mi>m</mi><mi>s</mi></mrow></mfrac><mo>(</mo><mn>50</mn><mo>)</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>2</mn></mfenced></math></p><p>Dividing (2) by (1), we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mn>6</mn><mrow><mi>&#916;</mi><mi>t</mi><mo>(</mo><mn>6</mn><mo>)</mo></mrow></mfrac><mo>=</mo><mfrac><mn>50</mn><mn>70</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#916;</mi><mi>t</mi><mo>=</mo><mfrac><mn>7</mn><mn>5</mn></mfrac><mo>=</mo><mn>1</mn><mo>.</mo><mn>4</mn><mo>&#160;</mo><mi>min</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499841d196b49d9cd6b0b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T09:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 1)", "title": "JEE Main 2023 (25 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67df6", "previousYearPapers": [{"_id": "63134c746e7bc9b33248370c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-29T14:00:00.000Z", "isVisible": true, "shor ;If the temperature of the surroundings is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi><mo>,</mo></math>&nbsp;the time taken by the body to cool from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>51</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>49</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> is:", "image": null}, "options": [{"id": "lIX9X", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#160;</mo><mi>min</mi><mo>.</mo></math>", "isCorrect": false, "image": null}, {"id": "cPmrb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&#160;</mo><mi>min</mi><mo>.</mo></math>", "isCorrect": false, "image": null}, {"id": "KnVsT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>&#160;</mo><mi>min</mi><mo>.</mo></math>", "isCorrect": false, "image": null}, {"id": "PaX5i", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&#160;</mo><mi>min</mi><mo>.</mo></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>&#916;</mi><mi>T</mi></mrow><mrow><mi>&#916;</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mi>K</mi><mfenced><mrow><msub><mi>T</mi><mi>t</mi></msub><mo>-</mo><msub><mi>T</mi><mi>S</mi></msub></mrow></mfenced><mo>&#160;</mo><msub><mi>T</mi><mi>t</mi></msub><mo>=</mo></math> average temperature</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mi mathvariant=\"italic\">S</mi></msub><mo mathvariant=\"italic\">=</mo></math> surrounding temperature</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>61</mn><mo>-</mo><mn>59</mn></mrow><mn>4</mn></mfrac><mo>=</mo><mi>K</mi><mfenced><mrow><mfrac><mrow><mn>61</mn><mo>+</mo><mn>59</mn></mrow><mn>2</mn></mfrac><mo>-</mo><mn>30</mn>< 3d91842a5cf801", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-03T14:00:00.000Z", "isVisible": true, "shortName": "2020 (03 Sep Shift 2)", "title": "JEE Main 2020 (03 Sep Shift 2)"}], "type": "singleCorrect", "level": 3, "question": {"text": "A metallic sphere cools from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>. If atmospheric temperature around is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>, then the sphere&#39;s temperature after the nest&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math>&nbsp;minutes will be close to:", "image": null}, "options": [{"id": "2vcn5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>31</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "isCorrect": false, "image": null}, {"id": "BaDmT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>33</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "isCorrect": true, "image": null}, {"id": "74jSt", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>28</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "isCorrect": false, "image": null}, {"id": "cJMpS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>35</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Using Newton&#39;s Law of cooling</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>50</mn><mo>-</mo><mn>40</mn></m utOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf801", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-03T14:00:00.000Z", "isVisible": true, "shortName": "2020 (03 Sep Shift 2)", "title": "JEE Main 2020 (03 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d662c9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr Shift 2 Online)", "title": "JEE Main 2018 (15 Apr Shift 2 Online)"}], "question": {"text": "A body takes 10 minutes to cool from $60^{\\circ} \\mathrm{C}$ to $50^{\\circ} \\mathrm{C}$. The temperature of surroundings is constant at $25^{\\circ} \\mathrm{C}$. Then, the temperature of the body after next 10 minutes will be approximately", "image": null}, "options": [{"id": "MQ59c", "text": "\n$43^{\\circ} \\mathrm{C}$\n", "image": null, "isCorrect": true}, {"id": "tF0Gt", "text": "\n$47^{\\circ} \\mathrm{C}$\n", "image": null, "isCorrect": false}, {"id": "iEjHi", "text": "\n$41^{\\circ} \\mathrm{C}$\n", "image": null, "isCorrect": false}, {"id": "KULo2", "text": "\n$45^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Newton's law of cooling,\n$$\n\\begin{aligned}\n&\\left(\\frac{\\theta_1-\\theta_2}{t}\\right)=K\\left(\\frac{\\theta_1+\\theta_2}{2}-\\theta_0\\right) \\\\\n&\\left(\\frac{60-50}{10}\\right)=K\\left(\\frac{60+50}{2}-25\\right) \\\\\n&\\text { and, }\\left(\\frac{50-\\theta}{10}\\right)=K\\left(\\frac{50+\\theta}{2}-25\\right)\n\\end{aligned}\n$$\nDividing eq. (i) by (ii),\n$$\n\\frac{10}{(50-\\theta)}=\\frac{60}{\\theta} \\Rightarrow \\theta=42.85^{\\circ} \\mathrm{C} \\cong 43^{\\circ} \\mathrm{C}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionSt i>e</mi></mrow></mfrac><mi>ln</mi><mfenced><mfrac><mrow><mn>15</mn><msubsup><mi>T</mi><mn>0</mn><mn>4</mn></msubsup></mrow><mrow><mn>80</mn><msubsup><mi>T</mi><mn>0</mn><mn>4</mn></msubsup></mrow></mfrac></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mfrac><mrow><mi>&#945;</mi><mi>M</mi></mrow><mrow><mn>4</mn><mi>&#963;</mi><mi>A</mi><mi>e</mi></mrow></mfrac><mi>ln</mi><mfenced><mfrac><mn>3</mn><mn>16</mn></mfrac></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mfrac><mrow><mi>&#945;</mi><mi>M</mi></mrow><mrow><mn>4</mn><mi>&#963;</mi><mfenced separators=\"|\"><mrow><mn>4</mn><mi mathvariant=\"normal\">&#960;</mi><msup><mi>R</mi><mn>2</mn></msup></mrow></mfenced><mi>e</mi></mrow></mfrac><mi>ln</mi><mfenced><mfrac><mn>3</mn><mn>16</mn></mfrac></mfenced></math>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>e</mi><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mfrac><mrow><mi>&#945;</mi><mi>M</mi></mrow><mrow><mn>16</mn><mi mathvariant=\"normal\">&#960;</mi><mi>&#963;</mi><msup><mi>R</mi><mn>2</mn></msup></mrow></mfrac><mi>ln</mi><mfenced><mfrac><mn>16</mn><mn>3</mn></mfrac></mfenced></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7da", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-19T09:00:00.000Z", "isVisible": true, "shortName": "2014 (19 Apr Online)", "title": "JEE Main 2014 (19 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65e29", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2014 (12 Apr Online)", "title": "JEE Main 2014 (12 Apr Online)"}], "question": {"text": "Hot water cools from $60^{\\circ} \\mathrm{C}$ to $50^{\\circ} \\mathrm{C}$ in the first 10 minutes and to $42^{\\circ} \\mathrm{C}$ in the next 10 minutes. The temperature of the surroundings is:", "image": null}, "options": [{"id": "EX1o6", "text": "\n$25^{\\circ} \\mathrm{C}$\n", "image": null, "isCorrect": false}, {"id": "vB7CB", "text": "\n$10^{\\circ} \\mathrm{C}$\n", "image": null, "isCorrect": true}, {"id": "3rDvx", "text": "\n$15^{\\circ} \\mathrm{C}$\n", "image": null, "isCorrect": false}, {"id": "QOiOU", "text": "\n$20^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "By Newton's law of cooling\n$$\n\\frac{\\theta_1-\\theta_2}{\\mathrm{t}}=-\\mathrm{K}\\left[\\frac{\\theta_1+\\theta_2}{2}-\\theta_0\\right]\n$$\nwhere $\\theta_0$ is the temperature of surrounding. Now, hot water cools from $60^{\\circ} \\mathrm{C}$ to $50^{\\circ} \\mathrm{C}$ in 10 minutes,\n$$\n\\frac{60-50}{10}=-K\\left[\\frac{60+50}{2}-\\theta_0\\right]\n$$\nAgain, it cools from $50^{\\circ} \\mathrm{C}$ to $42^{\\circ} \\mathrm{C}$ in next 10 minutes.\n$$\n\\frac{50-42}{10}=-\\mathrm{K}\\left[\\frac{50+42}{2}-\\theta_0\\right]\n$$\nDividing equations (i) by (ii) we get\n\n$$\n\\begin{aligned}\n&\\frac{1}{0.8}=\\frac{55-\\theta_0}{46-\\theta_0} \\\\\n&\\frac{10}{8}=\\frac{55-\\theta_0}{46-\\theta_0} \\\\\n&460-10 \\theta_0=440-8 \\theta_0 \\\\\n&2 \\theta_0=20 \\\\\n&\\theta_0=10^{\\circ} \\mathrm{c}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2014 (12 Apr Online)", "title": "JEE Main 2014 (12 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65dcf", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2014 (11 Apr Online)", "title": "JEE Main 2014 (11 Apr Online)"}], "question": {"text": "A hot body, obeying Newton's law of cooling is cooling down from its peak value $80^{\\circ} \\mathrm{C}$ to an ambient temperature of $30^{\\circ} \\mathrm{C}$. It takes 5 minutes in cooling down from $80^{\\circ} \\mathrm{C}$ to $40^{\\circ} \\mathrm{C}$. How much time will it take to cool down from $62^{\\circ} \\mathrm{C}$ to $32^{\\circ} \\mathrm{C}$ ? (Given $\\operatorname{In} 2=0.693$, In $5=1.609$ )", "image": null}, "options": [{"id": "E2aBX", "text": "\n$3.75$ minutes\n", "image": null, "isCorrect": false}, {"id": "o5svV", "text": "\n$8.6$ minutes\n", "image": null, "isCorrect": true}, {"id": "22AL3", "text": "\n$9.6$ minutes\n", "image": null, "isCorrect": false}, {"id": "u6BKU", "text": "\n$6.5$ minutes", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From Newton's law of cooling,\n$$\nt=\\frac{1}{k} \\log _e\\left(\\frac{\\theta_2-\\theta_0}{\\theta_1-\\theta_0}\\right)\n$$\nFrom question and above equation,\n$$\n5=\\frac{1}{k} \\log _e \\frac{(40-30)}{(80-30)}\n$$\nAnd, $t=\\frac{1}{k} \\log _e \\frac{(32-30)}{(62-30)}$\nDividing equation (2) by (1),\n$$\n\\frac{t}{5}=\\frac{\\frac{1}{k} \\log _e \\frac{(32-30)}{(62-30)}}{\\frac{1}{k} \\log _e \\frac{(40-30)}{(80-30)}}\n$$\nOn solving we get, time taken to cool down from $62^{\\circ} \\mathrm{C}$ to $32^{\\circ} \\mathrm{C}$, $t=8.6$ minutes.", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2014 (11 Apr Online)", "title": "JEE Main 2014 (11 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65b66", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6485", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2013 (07 Apr)", "title": "JEE Main 2013 (07 Apr)"}], "question": {"text": "If a piece of metal is heated to temperature<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mi>&#952;</mi></math> and then allowed to cool in a room which is at temperature<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><msub><mi>&#952;</mi><mn>0</mn></msub></math>, the graph between the temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> of the metal and time <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi></math> will be closest to :", "image": null}, "options": [{"id": "amiSo", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/d6136764-24fb-4684-bcc4-57969c07087c-image.png\" style=\"width: 197px; height: 188px;\" />", "image": null, "isCorrect": true}, {"id": "AdqJu", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/7d29d07a-4612-498a-b5e8-f309d6cf772e-image.png\" style=\"width: 189px; height: 191px;\" />", "image": null, "isCorrect": false}, {"id": "gq1lp", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/4bdb0764-9c6d-4194-8c31-e4edf57e31fa-image.png\" style=\"width: 200px; height: 197px;\" />", "image": null, "isCorrect": false}, {"id": "YyTUx", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/15a20626-f58f-44c6-ab02-5083eac00827-image.png\" style=\"width: 190px; height: 190px;\" />", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>According to Newton&#39;s cooling law, rate of cooling is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>d</mo><mi>&#952;</mi></mrow><mrow><mo>d</mo><mi>t</mi></mrow></mfrac><mo>&#8733;</mo><mfenced><mrow><mi>&#952;</mi><mo>-</mo><msub><mi>&#952;</mi><mn>0</mn></msub></mrow></mfenced></math></p><p>Here,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi><mo>=</mo></math>the&nbsp;temperature of the body</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#952;</mi><mn>0</mn></msub><mo>=</mo></math>Room temperature(constant)</p><p>Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi></math>&nbsp;be the proportionality constant and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#952;</mi><mi mathvariant=\"normal\">i</mi></msub></math>&nbsp;be the initial temperature.<br />Therefore,&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>d</mo><mi>&#952;</mi></mrow><mrow><mo>d</mo><mi>t</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mi>k</mi><mfenced><mrow><mi>&#952;</mi><mo>-</mo><msub><mi>&#952;</mi><mn>0</mn></msub></mrow></mfenced><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mo>&#8747;</mo><mfrac><mrow><mo>d</mo><mi>&#952;</mi></mrow><mfenced><mrow><mi>&#952;</mi><mo>-</mo><msub><mi>&#952;</mi><mn>0</mn></msub></mrow></mfenced></mfrac><mo>=</mo><mo>-</mo><mi>k</mi><mo>&#8747;</mo><mo>d</mo><mi>t</mi><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mi>ln</mi><mfenced><mrow><mi>&#952;</mi><mo>-</mo><msub><mi>&#952;</mi><mn>0</mn></msub></mrow></mfenced><mo>=</mo><mo>-</mo><mi>k</mi><mi>t</mi><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mi>&#952;</mi><mo>=</mo><msub><mi>&#952;</mi><mn>0</mn></msub><mo>+</mo><mfenced><mrow><mi>&#952;</mi><mo>-</mo><msub><mi>&#952;</mi><mn>0</mn></msub></mrow></mfenced><msup><mi>e</mi><mrow><mo>-</mo><mi>k</mi><mi>t</mi></mrow></msup></math></p><p>Hence, the graph is exponential.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["GRAPH_BASED"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6485", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2013 (07 Apr)", "title": "JEE Main 2013 (07 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65992", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-07T09:00:00.000Z", "isVisible": true, "shortName": "2012 (07 May Online)", "title": "JEE Main 2012 (07 May Online)"}], "question": {"text": "The heat radiated per unit area in 1 hour by a furnace whose temperature is $3000 \\mathrm{~K}$ is $(\\sigma=5.7 \\times$ $10^{-8} \\mathrm{~W} \\mathrm{~m}^{-2} \\mathrm{~K}^{-4}$ )", "image": null}, "options": [{"id": "cDJ5Z", "text": "\n$1.7 \\times 10^{10} \\mathrm{~J}$\n", "image": null, "isCorrect": true}, {"id": "ZbLPB", "text": "\n$1.1 \\times 10^{12} \\mathrm{~J}$\n", "image": null, "isCorrect": false}, {"id": "779xD", "text": "\n$2.8 \\times 10^8 \\mathrm{~J}$\n", "image": null, "isCorrect": false}, {"id": "zmsyL", "text": "\n$4.6 \\times 10^6 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Stefan's law\n$$\nE=\\sigma T^4\n$$\nHeat radiated per unit area in 1 hour ( $3600 \\mathrm{~s})$ is\n$$\n=5.7 \\times 10^{-8} \\times(300)^4 \\times 3600=1.7 \\times 10^{10} \\mathrm{~J}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7cd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-07T09:00:00.000Z", "isVisible": true, "shortName": "2012 (07 May Online)", "title": "JEE Main 2012 (07 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65aff", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Offline)", "title": "JEE Main 2012 (Offline)"}], "question": {"text": "A liquid in a beaker has temperature $\\theta(t)$ at time $t$ and $\\theta_0$ is temperature of surroundings, then according to Newton's law of cooling the correct graph between $\\log _e\\left(\\theta-\\theta_0\\right)$ and $t$ is", "image": null}, "options": [{"id": "HGRCh", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/TWbm9oY09hboOoAsvrrC2wqZePePGV4hyL1bSBB6X_I.original.fullsize.png\"><br>", "image": null, "isCorrect": true}, {"id": "2yN9J", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/9Oxl-OiZQBAxNXKl5Q8t8eRwy802r-jRDyUgncOI6ig.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "tGIlw", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/k7wMhUxknetiBjh4gks-utf_kMRmhl6Z8DAxJ3rV3n0.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "adRpY", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/hS3YhPUfCS3qMYiw86foI1TUQsg7fZcD-9tXQMJdNw8.original.fullsize.png\"><br>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Newtons law of cooling.\n$\\frac{\\mathrm{d} \\theta}{\\mathrm{dt}} \\propto-\\left(\\theta-\\theta_0\\right)$\n$\\Rightarrow \\quad \\frac{\\mathrm{d} \\theta}{\\mathrm{dt}}=-\\mathrm{k}\\left(\\theta-\\theta_0\\right)$\n$\\int \\frac{d \\theta}{\\theta-\\theta_0}=\\int-k d t$\n$\\Rightarrow \\quad \\ln \\left(\\theta-\\theta_0\\right)=-k t+c$\nHence the plot of $\\ln \\left(\\theta-\\theta_0\\right)$ vs $t$ should be a straight line with negative slope.", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["GRAPH_BASED"], "previousYear": {"_id": "615d92eade3d91842a5cf7cc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Off
