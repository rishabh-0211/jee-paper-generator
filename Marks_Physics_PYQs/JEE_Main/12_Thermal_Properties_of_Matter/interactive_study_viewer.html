>3</mn></mrow></msup></math> and specific heat of <math><mn>2000</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">J</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><msup><mrow><mi mathvariant=\"normal\">g</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> while the liquid in <math><mi mathvariant=\"normal\">B</mi></math> has density <math><msup><mrow><mn>10</mn></mrow><mrow><mn>3</mn></mrow></msup><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">g</mi><msup><mrow><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></math> and specific heat of <math><mn>4000</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">J</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">k</mi><msup><mrow><mi mathvariant=\"normal\">g</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. Which of the following best describes their temperature versus time graph schematically? (assume the emissivity of both the beakers to be the same)", "image": null}, "options": [{"id": "Vxd94", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/1056596a-2baf-4776-81bc-6605a7e323cb-image.png\" style=\"width: 248px; height: 170px;\" /></p>", "isCorrect": false, "image": null}, {"id": "DgnMk", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/5764dc96-d3da-425e-981d-d385df80676f-image.png\" style=\"width: 246px; height: 170px;\" /></p>", "isCorrect": true, "image": null}, {"id": "mwscB", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/51f4931e-05d9-4c01-a3e0-4c9a98ad08e6-image.png\" style=\"width: 246px; height: 170px;\" /></p>", "isCorrect": false, "image": null}, {"id": "zAlyE", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/395b1383-1f49-4826-bafb-a77981501295-image.png\" style=\"width: 251px; height: 170px;\" /></p>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "From Newton&#39;s law of cooling,<br />Rate of cooling: <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">T</mi></mrow><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">t</mi></mrow></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>4</mn><mi mathvariant=\"normal\">&#963;</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">A</mi><msubsup><mi mathvariant=\"normal\">T</mi><mn>0</mn><mn>3</mn></msubsup><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">T</mi><mo>-</mo><msub><mi mathvariant=\"normal\">T</mi><mn>0</mn></msub></mrow></mfenced></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">s</mi></mrow></mfrac><mo>&#160;</mo></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8733;</mo><mfrac><mn>1</mn><mrow><mi>m</mi><mi>s</mi></mrow></mfrac></math><strong>&nbsp;&nbsp;</strong><br /><math><mo>&#8756;</mo><msub><mrow><mi mathvariant=\"normal\">&#961;</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow></msub><mo>&#60;</mo><msub><mrow><mi mathvariant=\"normal\">&#961;</mi></mrow><mrow><mi mathvariant=\"normal\">B</mi></mrow></msub></math><br /><math><msub><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow></msub><mo>&#60;</mo><msub><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mi mathvariant=\"normal\">B</mi></mrow></msub></math><br />And <math><msub><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow></msub><mo>&#60;</mo><msub><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mi mathvariant=\"normal\">B</mi></mrow></msub></math><br /><math><msub><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow></msub><msub><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow></msub><mo>&#60;</mo><msub><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mi mathvariant=\"normal\">B</mi></mrow></msub><msub><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mi mathvariant=\"normal\">B</mi></mrow></msub></math><br />At <math><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">t</mi><mo>=</mo><mn>0</mn><mo>,</mo><msub><mrow><mfenced separators=\"|\"><mrow><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">T</mi></mrow><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">t</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow></msub><mo>&#62;</mo><msub><mrow><mfenced separators=\"|\"><mrow><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">T</mi></mrow><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">t</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mi mathvariant=\"normal\">B</mi></mrow></msub></math><br />Initially, the rate of cooling for <math><mi mathvariant=\"normal\">A</mi></math> will be higher than <math><mi mathvariant=\"normal\">B</mi></math> and temperature <math><mo>(</mo><mi mathvariant=\"normal\">T</mi><mo>)</mo><mi mathvariant=\"normal\">&#160;</mi></math> vs time <math><mo>(</mo><mi mathvariant=\"normal\">t</mi><mo>)</mo></math> graph will be a curve.", "image": null}, "videoSolution": {"videoId": "1f913f8e51df4b66bc223169709798cc", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/oz32ogXHOklr7.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/oz32ogXHOklr7.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92ecde3d91842a5cf7f0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2019 (08 Apr Shift 1)", "title": "JEE Main 2019 (08 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d663c0", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2019 (08 Apr Shift 1)", "title": "JEE Main 2019 (08 Apr Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "A thermally insulated vessel contains <math><mn>150</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">g</mi></math> of water at <math><mn>0</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> . Then the air from the vessel is pumped out adiabatically. A fraction of water turns into ice and the rest evaporates at <math><mn>0</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> itself. The mass of evaporated water will be closest to: (Latent heat of vaporization of water <math><mo>=</mo><mn>2.10</mn><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>6</mn></mrow></msup><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">J</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">k</mi><msup><mrow><mi mathvariant=\"normal\">g</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> and Latent heat of Fusion of water <math><mo>=</mo><mn>3.36</mn><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>5</mn></mrow></msup><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">J</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">k</mi><msup><mrow><mi mathvariant=\"normal\">g</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> )", "image": null}, "options": [{"id": "YGMdF", "text": "<math><mn>35</mn><mi> </mi><mi mathvariant=\"normal\">g</mi></math>", "isCorrect": false, "image": null}, {"id": "HvlPd", "text": "<math><mn>20</mn><mi> </mi><mi mathvariant=\"normal\">g</mi></math>", "isCorrect": true, "image": null}, {"id": "LHpGS", "text": "<math><mn>130</mn><mi> </mi><mi mathvariant=\"normal\">g</mi></math>", "isCorrect": false, "image": null}, {"id": "Asoak", "text": "<math><mn>150</mn><mi> </mi><mi mathvariant=\"normal\">g</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Suppose <math><mi mathvariant=\"normal\">m</mi></math> grams of water evaporate. Then, heat required <br/><math><mi mathvariant=\"normal\">Δ</mi><msub><mrow><mi mathvariant=\"normal\">Q</mi></mrow><mrow><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">q</mi></mrow></msub><mo>=</mo><mi mathvariant=\"normal\">m</mi><msub><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><mi mathvariant=\"normal\">v</mi></mrow></msub></math>  <br/>Mass that converts into ice <math><mo>=</mo><mfenced separators=\"|\"><mrow><mn>150</mn><mo>-</mo><mi mathvariant=\"normal\">m</mi></mrow></mfenced></math>  <br/>Heat released in the process, <br/><math><mi mathvariant=\"normal\">Δ</mi><msub><mrow><mi mathvariant=\"normal\">Q</mi></mrow><mrow><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">l</mi></mrow></msub><mo>=</mo><mfenced separators=\"|\"><mrow><mn>150</mn><mo>-</mo><mi mathvariant=\"normal\">m</mi></mrow></mfenced><msub><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><mi mathvariant=\"normal\">f</mi></mrow></msub></math>  <br/>Now, <math><mi mathvariant=\"normal\">Δ</mi><msub><mrow><mi mathvariant=\"normal\">Q</mi></mrow><mrow><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">l</mi></mrow></msub><mo>=</mo><mi mathvariant=\"normal\">Δ</mi><msub><mrow><mi mathvariant=\"normal\">Q</mi></mrow><mrow><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">q</mi></mrow></msub></math>  <br/><math><mfenced separators=\"|\"><mrow><mn>150</mn><mo>-</mo><mi mathvariant=\"normal\">m</mi></mrow></mfenced><msub><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><mi mathvariant=\"normal\">f</mi></mrow></msub><mo>=</mo><mi mathvariant=\"normal\">m</mi><msub><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><mi mathvariant=\"normal\">v</mi></mrow></msub></math>  <br/><math><mi mathvariant=\"normal\">m</mi><mfenced separators=\"|\"><mrow><msub><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><mi mathvariant=\"normal\">f</mi></mrow></msub><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><mi mathvariant=\"normal\">v</mi></mrow></msub></mrow></mfenced><mo>=</mo><mn>150</mn><mtext> </mtext><msub><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><mi mathvariant=\"normal\">f</mi></mrow></msub></math>  <br/><math><mi mathvariant=\"normal\">m</mi><mo>=</mo><mfrac><mrow><mn>150</mn><msub><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><mi mathvariant=\"normal\">f</mi></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><mi mathvariant=\"normal\">f</mi></mrow></msub><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><mi mathvariant=\"normal\">v</mi></mrow></msub></mrow></mfrac></math>  <br/><math><mi mathvariant=\"normal\">m</mi><mo>=</mo><mn>20</mn><mtext> </mtext><mi mathvariant=\"normal\">g</mi></math>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2019 (08 Apr Shift 1)", "title": "JEE Main 2019 (08 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d66744", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7ec", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T09:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 1)", "title": "JEE Main 2019 (11 Jan Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Ice at $-20^{\\circ} \\mathrm{C}$ is added to $50 \\mathrm{~g}$ of water at $40^{\\circ} \\mathrm{C}$, When the temperature of the mixture reaches $0^{\\circ} \\mathrm{C},$ it is found that 20 $\\mathrm{g}$ of ice is still unmelted. The amount of ice added to the\r\n\r\nwater was close to (Specific heat of water $=4.2 \\mathrm{~J} / \\mathrm{g} /{ }^{\\circ} \\mathrm{C}$\r\n\r\nSpecific heat of Ice $=2.1 \\mathrm{~J} / \\mathrm{g} /{ }^{\\circ} \\mathrm{C}$\r\n\r\nHeat of fusion of water at $\\left.0^{\\circ} \\mathrm{C}=334 \\mathrm{~J} / \\mathrm{g}\\right)$", "image": null}, "options": [{"id": "wrFtF", "text": "$50 \\mathrm{~g}$", "isCorrect": false, "image": null}, {"id": "qFa5v", "text": "$100 \\mathrm{~g}$", "isCorrect": false, "image": null}, {"id": "cRMlp", "text": "$60 \\mathrm{~g}$", "isCorrect": false, "image": null}, {"id": "xLLuf", "text": "$40 \\mathrm{~g}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let m gram of ice is added. From principal of calorimeter heat gained (by ice) $=$ heat lost (by water)\r\n\r\n$\\begin{array}{l}\r\n\r\n\\therefore 20 \\times 2.1 \\times \\mathrm{m}+(\\mathrm{m}-20) \\times 334 \\\\\r\n\r\n=50 \\times 4.2 \\times 40 \\\\\r\n\r\n376 \\mathrm{~m}=8400+6680 \\\\\r\n\r\n\\mathrm{~m}=40.1\r\n\r\n\\end{array}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ec", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T09:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 1)", "title": "JEE Main 2019 (11 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d6615b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2017-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2017 (08 Apr Online)", "title": "JEE Main 2017 (08 Apr Online)"}], "question": {"text": "In an experiment, a sphere of aluminium of mass&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>20</mn><mo>&#160;</mo><mi>kg</mi></math> is heated up to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>150</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> . Immediately, it is put into water of volume <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>150</mn><mo>&#160;</mo><mi>cc</mi><mo>&#160;</mo></math>at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>27</mn><mi mathvariant=\"normal\">o</mi></msup><mi mathvariant=\"normal\">C</mi></math> kept in a calorimeter of water equivalent to<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mn>0</mn><mo>.</mo><mn>025</mn><mo>&#160;</mo><mi>kg</mi></math> .&nbsp;The final temperature of the system is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>40</mn><mi mathvariant=\"normal\">o</mi></msup><mi mathvariant=\"normal\">C</mi></math> . The specific heat of the aluminium is(take&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>.</mo><mn>2</mn><mo>&#160;</mo><mi>Joule</mi><mo>=</mo><mn>1</mn><mo>&#160;</mo><mi>calorie</mi></math> )", "image": null}, "options": [{"id": "yEoZh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>434&#160;</mn><msup><mtext>J&#160;kg</mtext><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mtext>&#160;</mtext><mi mathvariant=\"normal\">o</mi></msup><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": true}, {"id": "0hHoc", "text": "<math xmlns=\"h ith <math> <mrow> <mn>170</mn><mtext>&#8201;</mtext><mtext>g</mtext></mrow> </math> of water at room temperature. Subsequently, the temperature of the system is found to be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>75</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>. <math><mi>T</mi></math> is given by:<br />(Given: room temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>30</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>, specific heat of copper <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>0.1</mn><mi mathvariant=\"normal\">&#8201;</mi><mi>cal</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">g</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mi>&#160;</mi><mo>&#176;</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>)", "image": null}, "options": [{"id": "EKql3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>825</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}, {"id": "Xcs47", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>800</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}, {"id": "XUjIp", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>885</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": true}, {"id": "QajsT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1250</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable><mtr><mtd><msub><mi>m</mi><mrow><mi>c</mi><mi>b</mi></mrow></msub><mo>=</mo><mn>100</mn><mi>&#160;</mi><mi>g</mi><mo>,</mo></mtd><mtd><mi>&#160;</mi></mtd><mtd><mfenced separators=\"|\"><mrow><msup><mi>T</mi><mi mathvariant=\"normal\">o</mi></msup><mi mathvariant=\"normal\">C</mi></mrow></ i>cal</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">g</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "nwLz1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>560</mn><mo>&#160;</mo><mi>cal</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">g</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the constant state of supply of heat per unit time <math><mo>=</mo><mi>&#955;</mi></math>. So according to the first condition.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi><msub><mi>t</mi><mn>1</mn></msub><mo>=</mo><mi>m</mi><mi>c</mi><mo>&#215;</mo><mn>100</mn><mi>&#160;</mi><mo>&#8658;</mo><mfrac><mi>&#955;</mi><mi>m</mi></mfrac><mo>=</mo><mfrac><mrow><mn>100</mn><mi>C</mi></mrow><msub><mi>t</mi><mn>1</mn></msub></mfrac><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo></math>, and according to the second condition,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi><msub><mi>t</mi><mn>2</mn></msub><mo>=</mo><mi>m</mi><msub><mi>L</mi><mi>f</mi></msub><mo>&#8658;</mo><mfrac><mi>&#955;</mi><mi>m</mi></mfrac><mo>=</mo><mfrac><msub><mi>L</mi><mi>f</mi></msub><msub><mi>t</mi><mn>2</mn></msub></mfrac><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mi>ii</mi><mo>)</mo></math>. By <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>ii</mi><mo>)</mo></math> <math><mfrac><mrow><mn>100</mn><mi>C</mi></mrow><mrow><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi>L</mi></mrow><mrow><mi>f</mi></mrow></msub></mrow><mrow><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><mn>1</mn><mi>cal</mi><mo>&#215;</mo><mn>100</mn></mrow><mn>10</mn></mfrac><mo>=</mo><mfrac><msub><mi>L</mi><mi>f</mi></msub><mn>55</mn></mfrac><mo>&#8658;</mo><msub><mi>L</mi><mi>f</mi></msub><mo>=</mo><mn>550</mn><mi>&#160;</mi><mi>cal</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">g</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7dd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2015 (11 Apr Online)", "title": "JEE Main 2015 (11 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65d77", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2014 (09 Apr Online)", "title": "JEE Main 2014 (09 Apr Online)"}], "question": {"text": "Water of volume 2 L in a closed container is heated with a coil of 1 kW. While water is heated, the container loses energy at a rate of 160 J/s. In how much time will the temperature of water rise from 27<sup>o</sup>C to 77<sup>o</sup>C ? (Specific heat of water is 4.2 kJ/kg and that of the container is negligible).", "image": null}, "options": [{"id": "WAumR", "text": "8 min 20 s", "image": null, "isCorrect": true}, {"id": "aXFZg", "text": "7 min", "image": null, "isCorrect": false}, {"id": "ZzwXW", "text": "14 min", "image": null, "isCorrect": false}, {"id": "oIEec", "text": "6 min 2 s", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <mtext>P</mtext> <mo>=</mo> <mn>1</mn> <mn>0</mn> <mn>0</mn> <mn>0</mn> <mtext>&#160;watt</mtext> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;&#160;&#160;&#160;</mo><msub><mtext>P</mtext><mtext>in</mtext></msub><mo>=</mo><mfenced><mrow><mn>1</mn><mn>0</mn><mn>0</mn><mn>0</mn><mo>-</mo><mn>1</mn><mn>6</mn><mn>0</mn></mrow></mfenced><mo>&#160;</mo><mtext>J/s</mtext><mo>=</mo><mn>8</mn><mn>4</mn><mn>0</mn><mtext>&#160;J/s</mtext></math><br /><br />Now, &nbsp;<math> <mrow> <mfrac> <mrow> <mtext>d</mtext> <mtext>Q</mtext> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> <mo>=</mo> <mtext>ms</mtext> <mfrac> <mrow> <mtext>dT</mtext> </mrow> <mrow> <mtext>dt</mtext> </mrow> </mfrac> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;&#160;&#160;&#160;&#160;</mo><mn>8</mn><mn>4</mn><mn>0</mn><mo>=</mo><mtext>ms</mtext><mfrac><mtext>dT</mtext><mtext>dt</mtext></mfrac></math><br /><br /><math> <mrow> <mo>&#8756;&#160;&#160;&#160;</mo> <mtext>dt</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>ms</mtext> </mrow> <mrow> <mn>8</mn> <mn>4</mn> <mn>0</mn> </mrow> </mfrac> <mtext>dT</mtext> </mrow> </math><br /><br />Integrating both sides we have;<br /><br /><math> <mrow> <mtext>t</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>ms</mtext> </mrow> <mrow> <mn>8</mn> <mn>4</mn> <mn>0</mn> </mrow> </mfrac> <mo>&#8747;</mo> <mtext>dT</mtext> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mfrac> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>2</mn> <mo>&#215;</mo> <mn>1</mn> <mn>0</mn> <mn>0</mn> <mn>0</mn> <mo>&#215;</mo> <mn>1</mn> <msup> <mn>0</mn> <mrow> <mo>-</mo> <mn>6</mn> </mrow> </msup> <mo>&#215;</mo> <mn>1</mn> <mn>0</mn> <mn>0</mn> <mn>0</mn> </mrow> </mfenced> <mo>&#215;</mo> <mtext>4.2</mtext> <mo>&#215;</mo> <mn>1</mn> <mn>0</mn> <mn>0</mn> <mn>0</mn> </mrow> <mrow> <mn>8</mn> <mn>4</mn> <mn>0</mn> </mrow> </mfrac> <mo>&#215;</mo> <mn>5</mn> <mn>0</mn> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mn>5</mn> <mn>0</mn> <mn>0</mn> <mo>sec</mo> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mn>8&#160;</mn> <mo>min</mo> <mn>2</mn> <mn>0</mn> <mo>sec</mo> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7d7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2014 (09 Apr Online)", "title": "JEE Main 2014 (09 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65cb7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-25T09:00:00.000Z", "isVisible": true, "shortName": "2013 (25 Apr Online)", "title": "JEE Main 2013 (25 Apr Online)"}], "question": {"text": "A mass of $50 \\mathrm{~g}$ of water in a closed vessel, with surroundings at a constant temperature takes 2 minutes to cool from $30^{\\circ} \\mathrm{C}$ to $25^{\\circ} \\mathrm{C}$. A mass of $100 \\mathrm{~g}$ of another liquid in an identical vessel with identical surroundings takes the same time to cool from $30^{\\circ} \\mathrm{C}$ to $25^{\\circ} \\mathrm{C}$. The specific heat of the liquid is :\n(The water equivalent of the vessel is $30 \\mathrm{~g}$.)", "image": null}, "options": [{"id": "x7qcr", "text": "\n$2.0 \\mathrm{kcal} / \\mathrm{kg}$\n", "image": null, "isCorrect": false}, {"id": "7Q2Va", "text": "\n $7 \\mathrm{kcal} / \\mathrm{kg}$\n", "image": null, "isCorrect": false}, {"id": "D5EvR", "text": "\n $3 \\mathrm{kcal} / \\mathrm{kg}$\n", "image": null, "isCorrect": false}, {"id": "CwS1q", "text": "\n $0.5 \\mathrm{kcal} / \\mathrm{kg}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "As the surrounding is identical, vessel is identical time taken to cool both water and liquid (from $30^{\\circ} \\mathrm{C}$ to $25^{\\circ} \\mathrm{C}$ ) is same 2 minutes, therefore\n$$\n\\left(\\frac{\\mathrm{dQ}}{\\mathrm{dt}}\\right)_{\\text {water }}=\\left(\\frac{\\mathrm{dQ}}{\\mathrm{dt}}\\right)_{\\text {liquid }}\n$$\nor, $\\frac{\\left(\\mathrm{m}_{\\mathrm{W}} \\mathrm{C}_{\\mathrm{W}}+\\mathrm{W}\\right) \\Delta \\mathrm{T}}{\\mathrm{t}}=\\frac{\\left(\\mathrm{m}_{\\ell} \\mathrm{C}_{\\ell}+\\mathrm{W}\\right) \\Delta \\mathrm{T}}{\\mathrm{t}}$\n$(\\mathrm{W}=$ water equivalent of the vessel $)$\nor, $\\mathrm{m}_{\\mathrm{w}} \\mathrm{C}_{\\mathrm{w}}=\\mathrm{m}_{\\ell} \\mathrm{C}_{\\ell}$\n$\\therefore$ Specific heat of liquid, $\\mathrm{C}_{\\ell}=\\frac{\\mathrm{m}_{\\mathrm{W}} \\mathrm{C}_{\\mathrm{W}}}{\\mathrm{m}_{\\ell}}$\n$$\n=\\frac{50 \\times 1}{100}=0.5 \\mathrm{kcal} / \\mathrm{kg}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7d5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-25T09:00:00.000Z", "isVisible": true, "shortName": "2013 (25 Apr Online)", "title": "JEE Main 2013 (25 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65c69", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-23T09:00:00.000Z", "isVisible": true, "shortName": "2013 (23 Apr Online)", "title": "JEE Main 2013 (23 Apr Online)"}], "question": {"text": "$500 \\mathrm{~g}$ of water and $100 \\mathrm{~g}$ of ice at $0^{\\circ} \\mathrm{C}$ are in a calorimeter whose water equivalent is $40 \\mathrm{~g} .10 \\mathrm{~g}$ of steam at $100^{\\circ} \\mathrm{C}$ is added to it. Then water in the calorimeter is : (Latent heat of ice $=80 \\mathrm{cal} / \\mathrm{g}$, Latent heat of steam $=540 \\mathrm{cal} / \\mathrm{g}$ )", "image": null}, "options": [{"id": "rySMY", "text": "\n$580 \\mathrm{~g}$\n", "image": null, "isCorrect": false}, {"id": "DPDPx", "text": "\n$590 \\mathrm{~g}$\n", "image": null, "isCorrect": true}, {"id": "psFuU", "text": "\n$600 \\mathrm{~g}$\n", "image": null, "isCorrect": false}, {"id": "d4tBj", "text": "\n$610 \\mathrm{~g}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As $1 \\mathrm{~g}$ of steam at $100^{\\circ} \\mathrm{C}$ melts $8 \\mathrm{~g}$ of ice at $0^{\\circ} \\mathrm{C}$.\n$10 \\mathrm{~g}$ of steam will melt $8 \\times 10 \\mathrm{~g}$ of ice at $0^{\\circ} \\mathrm{C}$ Water in calorimeter $=500+80+10 \\mathrm{~g}=590 \\mathrm{~g}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-23T09:00:00.000Z", "isVisible": true, "shortName": "2013 (23 Apr Online)", "title": "JEE Main 2013 (23 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65c20", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-22T09:00:00.000Z", "isVisible": true, "shortName": "2013 (22 Apr Online)", "title": "JEE Main 2013 (22 Apr Online)"}], "question": {"text": "Given that $1 \\mathrm{~g}$ of water in liquid phase has volume $1 \\mathrm{~cm}^3$ and in vapour phase $1671 \\mathrm{~cm}^3$ at atmospheric pressure and the latent heat of vaporization of water is $2256 \\mathrm{~J} / \\mathrm{g}$; the change in the internal energy in joules for $1 \\mathrm{~g}$ of water at $373 \\mathrm{~K}$ when it changes from liquid phase to vapour phase at the same temperature is :", "image": null}, "options": [{"id": "d9vKy", "text": "\n2256\n", "image": null, "isCorrect": false}, {"id": "HdzHv", "text": "\n167\n", "image": null, "isCorrect": false}, {"id": "di6iL", "text": "\n2089\n", "image": null, "isCorrect": true}, {"id": "hcVfy", "text": "\n1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution Available", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-22T09:00:00.000Z", "isVisible": true, "shortName": "2013 (22 Apr Online)", "title": "JEE Main 2013 (22 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d6594e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cb", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "JEE Main 2011"}], "question": {"text": "$100 \\mathrm{~g}$ of water is heated from $30^{\\circ} \\mathrm{C}$ to $50^{\\circ} \\mathrm{C}$. Ignoring the slight expansion of the water, the change in its internal energy is (specific heat of water is $4148 \\mathrm{~J} / \\mathrm{kg} / \\mathrm{K}$ ):", "image": null}, "options": [{"id": "0AVNa", "text": "\n$8.4 \\mathrm{~kJ}$\n", "image": null, "isCorrect": true}, {"id": "3UqST", "text": "\n$84 \\mathrm{~kJ}$\n", "image": null, "isCorrect": false}, {"id": "k1eaC", "text": "\n$2.1 \\mathrm{~kJ}$\n", "image": null, "isCorrect": false}, {"id": "VtKfq", "text": "\n$4.2 \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\Delta \\mathrm{Q}=\\Delta \\mathrm{U}+\\Delta \\mathrm{W}$ (ignoring expansion)\n$\\Delta \\mathrm{U}=\\mathrm{ms} \\Delta \\mathrm{T}=0.1 \\times 4.184 \\times 20=8.368 \\mathrm{~kJ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7cb", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "JEE Main 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d6539a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}], "question": {"text": "Heat given to a body which raises its temperature by $1^{\\circ} \\mathrm{C}$ is", "image": null}, "options": [{"id": "m4gtk", "text": "\nwater equivalent\n", "image": null, "isCorrect": false}, {"id": "wzBeL", "text": "\nthermal capacity\n", "image": null, "isCorrect": true}, {"id": "nJqT5", "text": "\nspecific heat\n", "image": null, "isCorrect": false}, {"id": "2f6Xz", "text": "\ntemperature gradient", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution Available", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "648b5a73417cc3fb48d691f2", "title": "Conduction", "totalQuestions": 27, "questions": [{"_id": "6983c1888bfdbb24356395ee", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f43", "title": "JEE Main 2026 (22 January Shift 1)", "shortName": "2026 (22 January Shift 1)", "isVisible": true, "heldOn": "2026-01-22T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Rods $x$ and $y$ of equal dimensions but of different materials are joined as shown in figure. Temperatures of end points $A$ and $F$ are maintained at $100^{\\circ} \\mathrm{C}$ and $40^{\\circ} \\mathrm{C}$ respectively. Given the thermal conductivity of $\\operatorname{rod} x$ is three times of that of $\\operatorname{rod} y$, the temperature at junction points $B$ and $E$ are (close to): <br> <img style=\"width:350px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_watermark_improved/22S1_q_40_1.png\">", "image": null}, "options": [{"id": "msQnp", "text": "$80^{\\circ} \\mathrm{C}$ and $70^{\\circ} \\mathrm{C}$ respectively", "isCorrect": false, "image": null}, {"id": "iozYJ", "text": "$80^{\\circ} \\mathrm{C}$ and $60^{\\circ} \\mathrm{C}$ respectively", "isCorrect": false, "image": null}, {"id": "CLrdg", "text": "$60^{\\circ} \\mathrm{C}$ and $45^{\\circ} \\mathrm{C}$ respectively", "isCorrect": false, "image": null}, {"id": "s2oup", "text": "$89^{\\circ} \\mathrm{C}$ and $73^{\\circ} \\mathrm{C}$ respectively", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let $\\left[ R = \\dfrac{\\ell}{3KA} \\right]$ <br> <img style=\"width:400px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_watermark_improved/22S1_s_40_1.png\"><br>$\\left[ H = \\dfrac{100 - 40}{\\dfrac{11R}{2}} \\right]$ ...(1)<br>$H = \\dfrac{100 - T_B}{R}$ .....(2)<br>$H = \\dfrac{T_E - 40}{3R}$ .....(3)<br>using (1) and (2)<br>$120 = 1100 - 11T_A$<br>$T_B = 89°C$<br>using (1) and (3)<br>$T_E = 73°C$", "image": null}, "videoSolution": {"videoId": "3e1721ce35b7433db437972a9425b28b", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/1BrqhesAXaBVK.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/1BrqhesAXaBVK.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "questionStructure": ["DIAGRAM_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "6983c0cb2f90f45c755e5f43", "title": "JEE Main 2026 (22 January Shift 1)", "shortName": "2026 (22 January Shift 1)", "isVisible": true, "heldOn": "2026-01-22T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542c677c09d044e4c1a1cd", "type": "numerical", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2ff9d87935e0d809789", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-07T14:00:00.000Z", "isVisible": true, "shortName": "2025 (7 Apr Shift 2)", "title": "JEE Main 2025 (7 Apr Shift 2)"}], "question": {"text": "Two cylindrical rods A and B made of different materials, are joined in a straight line. The ratio of lengths, radii and thermal conductivities of these rods are :<br/>$\\frac{\\mathrm{L}_{\\mathrm{A}}}{\\mathrm{L}_{\\mathrm{B}}}=\\frac{1}{2}, \\frac{\\mathrm{r}_{\\mathrm{A}}}{\\mathrm{r}_{\\mathrm{B}}}=2$ and $\\frac{\\mathrm{K}_{\\mathrm{A}}}{\\mathrm{K}_{\\mathrm{B}}}=\\frac{1}{2}$. The free ends of rods A and B are maintained at $400 \\mathrm{~K}, 200 \\mathrm{~K}$, respectively. The temperature of rods interface is ________ K, when equilibrium is established.", "image": null}, "options": [], "correctValue": "360", "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/XBS6t4461F0Vwhx7V9SQpJlcSsoWGpNMo0B9q_Hfpdc.original.fullsize.png\"/><br/>$\\begin{aligned} & \\mathrm{R}_1=\\frac{\\ell_1}{\\mathrm{~K}_1 \\mathrm{~A}_1}, \\mathrm{R}_2=\\frac{\\ell_2}{\\mathrm{~K}_2 \\mathrm{~A}_2} \\\\ & \\frac{\\mathrm{dQ}}{\\mathrm{dt}}=\\frac{\\Delta \\mathrm{T}}{\\mathrm{R}} \\\\ & \\left(\\frac{\\mathrm{dQ}}{\\mathrm{dt}}\\right)_1=\\left(\\frac{\\mathrm{dQ}}{\\mu}\\right)_2 \\\\ & \\frac{400-\\mathrm{T}}{\\mathrm{R}_1}=\\frac{\\mathrm{T}-200}{\\mathrm{R}_2} \\\\ & \\frac{400-\\mathrm{T}}{\\mathrm{T}-200}=\\frac{\\mathrm{R}_1}{\\mathrm{R}_2}=\\left(\\frac{\\ell_1}{\\ell_2}\\right)\\left(\\frac{\\mathrm{r}_2}{\\mathrm{r}_1}\\right)^2 \\times \\frac{\\mathrm{K}_2}{\\mathrm{~K}_1} \\\\ & =\\frac{1}{2} \\times\\left(\\frac{1}{2}\\right)^2 \\times 2 \\\\ & =\\left(\\frac{1}{4}\\right) \\\\ & \\frac{400-\\mathrm{T}}{\\mathrm{T}-200}=\\frac{1}{4} \\\\ & 1600-4 \\mathrm{~T}=\\mathrm{T}-200 \\\\ & 5 \\mathrm{~T}=1800 \\\\ & \\mathrm{~T}=360 \\mathrm{~K}\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "3dc4f15d96e049629e64686842f58377", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/w6yTuYeRYCwE0.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/w6yTuYeRYCwE0.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6852f2ff9d87935e0d809789", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-07T14:00:00.000Z", "isVisible": true, "shortName": "2025 (7 Apr Shift 2)", "title": "JEE Main 2025 (7 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2ee89c8b73881fdaea0c0", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5ca6d4514bf2d97608", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-22T09:00:00.000Z", "isVisible": true, "shortName": "2025 (22 Jan Shift 1)", "title": "JEE Main 2025 (22 Jan Shift 1)"}], "question": {"text": "Three conductors of same length having thermal conductivity $\\mathrm{k}_1, \\mathrm{k}_2$ and $\\mathrm{k}_3$ are connected as shown in figure.\n\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/8cFw6o1hSl0e8HAwQ1b0JbnuH7yOn9LqRVhtIk_FYTQ.original.fullsize.png\"/><br/>\n\nArea of cross sections of $1^{\\text {st }}$ and $2^{\\text {nd }}$ conductor are same and for $3^{\\text {rd }}$ conductor it is double of the $1^{\\text {st }}$ conductor. The temperatures are given in the figure. In steady state condition, the value of $\\theta$ is\n_______ ${ }^{\\circ} \\mathrm{C}$.\n(Given : $\\mathrm{k}_1=60 \\mathrm{Js}^{-1} \\mathrm{~m}^{-1} \\mathrm{~K}^{-1}, \\mathrm{k}_2=120 \\mathrm{Js}^{-1} \\mathrm{~m}^{-1} \\mathrm{~K}^{-1}, \\mathrm{k}_3=135 \\mathrm{Js}^{-1} \\mathrm{~m}^{-1} \\mathrm{~K}^{-1}$ )", "image": null}, "options": [], "correctValue": "40", "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/tNasaT40DEhUZqJ-YbdIoyHZ68FkDRHeVGwNT3SK9eo.original.fullsize.png\"><br>\n\n$\\begin{aligned} & \\mathrm{R}_1=\\frac{2 \\mathrm{~L}}{\\mathrm{~K}_1 \\mathrm{~A}} \\\\ & \\mathrm{R}_2=\\frac{2 \\mathrm{~L}}{\\mathrm{~K}_2 \\mathrm{~A}} \\\\ & \\mathrm{R}_3=\\frac{\\mathrm{L}}{\\mathrm{K}_3 \\mathrm{~A}} \\\\ & \\frac{\\theta-100}{\\frac{\\mathrm{R}_1 \\mathrm{R}_2}{\\mathrm{R}_1+\\mathrm{R}_2}}+\\frac{\\theta-0}{\\mathrm{R}_3}=0 \\\\ & \\theta=40\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "d95f766075114f83a9876be13ea3a946", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/xj2HXQksups5h.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/xj2HXQksups5h.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionStructure": ["DIAGRAM_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "67a2eb5ca6d4514bf2d97608", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-22T09:00:00.000Z", "isVisible": true, "shortName": "2025 (22 Jan Shift 1)", "title": "JEE Main 2025 (22 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd70ba0e94a3c4025ca7", "type": "singleCorrect", "level": 2, "questionLabels": [], "question": {"text": "<p>Two conductors have the same resistances at <math xmlns=\"http://www.w3.org/1998/Ma >C</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/572e7ceb-6371-484d-b66e-6adc5de967a3-image.png\" style=\"width: 350px; height: 85px;\" /></p><p>At steady state, the&nbsp;heat conducted by both the rods will be the same.</p><p>The rate&nbsp;of heat conduction is given by,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>d</mo><mi>Q</mi></mrow><mrow><mo>d</mo><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>K</mi><mi>A</mi></mrow><mi>l</mi></mfrac><mo>&#8710;</mo><mi>T</mi></math>. Therefore, if the temperature of the junction is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math>,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>K</mi><mn>1</mn></msub><mo>&#160;</mo><msub><mi>A</mi><mn>1</mn></msub></mrow><msub><mi>l</mi><mn>1</mn></msub></mfrac><mfenced><mrow><msub><mi>T</mi><mn>1</mn></msub><mo>-</mo><mi>T</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><msub><mi>K</mi><mn>2</mn></msub><mo>&#160;</mo><msub><mi>A</mi><mn>2</mn></msub></mrow><msub><mi>l</mi><mn>2</mn></msub></mfrac><mfenced><mrow><mi>T</mi><mo>-</mo><msub><mi>T</mi><mn>2</mn></msub></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><mn>450</mn><mo>-</mo><mi>T</mi></mrow><mrow><mi>T</mi><mo>-</mo><mn>0</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mi>K</mi><mn>2</mn></msub><msub><mrow><mo>&#160;</mo><mi>A</mi></mrow><mn>2</mn></msub><msub><mi>l</mi><mn>1</mn></msub></mrow><mrow><msub><mrow><mo>&#160;</mo><mi>K</mi></mrow><mn>1</mn></msub><msub><mrow><mo>&#160;</mo><mi>A</mi></mrow><mn>1</mn></msub><msub><mi>l</mi><mn>2</mn></msub></mrow></mfrac><mo>=</mo><mn>9</mn><mo>&#215;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mn>2</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>450</mn><mo>-</mo><mi>T</mi><mo>=</mo><mn>9</mn><mo>&#160;</mo><mi>T</mi><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><mi>T</mi><mo>=</mo><mn>45</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "a877be375569435b83c42a709d5dabb8", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/mztgCNNqOPEI4.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/mztgCNNqOPEI4.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "questionStructure": ["DIAGRAM_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "63134c746e7bc9b332483705", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-27T09:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jul Shift 1)", "title": "JEE Main 2022 (27 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67e51", "previousYearPapers": [{"_id": "62c481f101514d218a7934db", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-29T09:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jun Shift 1)", "title": "JEE Main 2022 (29 Jun Shift 1)"}], "type": "numerical", "level": 3, "question": {"text": "<p>As per the given figure, two plates <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> of thermal conductivity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>K</mi></math> are joined together to form a compound plate. The thickness of plates are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>.</mo><mn>0</mn><mo>&#160;</mo><mi>cm</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi>cm</mi></math> respectively and the area of cross-section is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>120</mn><msup><mrow><mo>&#160;</mo><mi>cm</mi></mrow><mn>2</mn></msup></math> for each plate. The equivalent thermal conductivity of the compound plate is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>+</mo><mfrac><mn>5</mn><mi>&#945;</mi></mfrac></mrow></mfenced><mi>K</mi></math>, then the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi></math> will be _____ .</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/4394bc9a-2780-463a-b292-aaea790ecc50-image.png\" style=\"width: 300px; height: 86px;\" /></p>", "image": null}, "options": [], "correctValue": "21", "solution": {"text": "<p>The thermal resistance of rod 1 will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>1</mn></msub><mo>=</mo><mfrac><msub><mi>l</mi><mn>1</mn></msub><mrow><mi>K</mi><mi>A</mi></mrow></mfrac><mo>=</mo><mfrac><mn>4</mn><mrow><mi>K</mi><mi>A</mi></mrow></mfrac></math>&nbsp;and rod 2 will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>2</mn></msub><mo>=</mo><mfrac><msub><mi>l</mi><mn>2</mn></msub><mrow><mn>2</mn><mi>K</mi><mi>A</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mo>.</mo><mn>5</mn></mrow><mrow><mn>2</mn><mi>K</mi><mi>A</mi></mrow></mfrac></math>.</p><p>Since they are connected in series,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mrow><mi>e</mi><mi>q</mi></mrow></msub><mo>=</mo><msub><mi>R</mi><mn>1</mn></msub><mo>+</mo><msub><mi>R</mi><mn>2</mn></msub><mo>=</mo><mfrac><mrow><mn>10</mn><mo>.</mo><mn>5</mn></mrow><mrow><mn>2</mn><mi>K</mi><mi>A</mi></mrow></mfrac></math>.</p><p>If equivalent thermal conductivity is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mrow><mi>e</mi><mi>q</mi></mrow></msub></math>, then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mrow><mi>e</mi><mi>q</mi></mrow></msub><mo>=</mo><mfrac><mrow><msub><mi>l</mi><mn>1</mn></msub><mo>+</mo><msub><mi>l</mi><mn>2</mn></msub></mrow><mrow><msub><mi>K</mi><mrow><mi>e</mi><mi>q</mi></mrow></msub><mi>A</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>6</mn><mo>.</mo><mn>5</mn></mrow><mrow><msub><mi>K</mi><mrow><mi>e</mi><mi>q</mi></mrow></msub><mi>A</mi></mrow></mfrac></math>. Therefore,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>10</mn><mo>.</mo><mn>5</mn></mrow><mrow><mn>2</mn><mi>K</mi><mi>A</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>6</mn><mo>.</mo><mn>5</mn></mrow><mrow><msub><mi>K</mi><mrow><mi>e</mi><mi>q</mi></mrow></msub><mi>A</mi></mrow></mfrac><mo>&#8658;</mo><msub><mi>K</mi><mrow><mi>e</mi><mi>q</mi></mrow></msub><mo>=</mo><mfrac><mn>26</mn><mn>21</mn></mfrac><mi>K</mi><mo>=</mo><mfenced><mrow><mn>1</mn><mo>+</mo><mfrac><mn>5</mn><mn>21</mn></mfrac></mrow></mfenced><mi>K</mi></math></p><p>Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>=</mo><mn>21</mn></math>.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["DIAGRAM_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "62c481f101514d218a7934db", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-29T09:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jun Shift 1)", "title": "JEE Main 2022 (29 Jun Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67d37", "previousYearPapers": [{"_id": "62c481f101514d218a7934da", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-28T14:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jun Shift 2)", "title": "JEE Main 2022 (28 Jun Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Resistance of the wire is measured as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#937;</mi></math> at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> respectively. Temperature coefficient of resistance of the material of the wire is", "image": null}, "options": [{"id": "s5mBe", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>033</mn><msup><mmultiscripts><mi mathvariant=\"normal\">C</mi><mprescripts/><none/><mo>&#8728;</mo></mmultiscripts><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "isCorrect": true, "image": null}, {"id": "jQnbR", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>0</mn><mo>.</mo><mn>033</mn><msup><mmultiscripts><mi mathvariant=\"normal\">C</mi><mprescripts/><none/><mo>&#8728;</mo></mmultiscripts><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "isCorrect": false, "image": null}, {"id": "kUroo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>011</mn><msup><mmultiscripts><mi mathvariant=\"normal\">C</mi><mprescripts/><none/><mo>&#8728;</mo></mmultiscripts><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "isCorrect": false, "image": null}, {"id": "pxLVX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>055</mn><mo>&#176;</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Resistance of a material is related to temperature by expression&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><msub><mi>R</mi><mn>0</mn></msub><mfenced><mrow><mn>1</mn><mo>+</mo><mi>&#945;</mi><mi>&#916;</mi><mi>T</mi></mrow></mfenced></math></p><p>Here, at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>, we have&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>=</mo><msub><mi>R</mi><mn>0</mn></msub><mfenced><mrow><mn>1</mn><mo>+</mo><mn>10</mn><mi>&#945;</mi></mrow></mfenced><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mi>i</mi></mfenced></math></p><p>And at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>, we have&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>=</mo><msub><mi>R</mi><mn>0</mn></msub><mfenced><mrow><mn>1</mn><mo>+</mo><mn>30</mn><mi>&#945;</mi></mrow></mfenced><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mrow><mi>i</mi><mi>i</mi></mrow></mfenced></math></p><p>From equation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>i</mi></mfenced></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R</mi><mn>0</mn></msub><mo>=</mo><mfrac><mn>2</mn><mfenced><mrow><mn>1</mn><mo>+</mo><mn>10</mn><mi>&#945;</mi></mrow></mfenced></mfrac><mo>&#160;</mo></math></p><p>Putting this value in equation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>i</mi><mi>i</mi></mrow></mfenced></math>,&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>=</mo><mfrac><mn>2</mn><mrow><mn>1</mn><mo>+</mo><mn>10</mn><mi>&#945;</mi></mrow></mfrac><mfenced><mrow><mn>1</mn><mo>+</mo><mn>30</mn><mi>&#945;</mi></mrow></mfenced><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><mn>3</mn><mo>+</mo><mn>30</mn><mi>&#945;</mi><mo>=</mo><mn>2</mn><mo>+</mo><mn>60</mn><mi>&#945;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>1</mn><mo>=</mo><mn>30</mn><mi>&#945;</mi></math></p><p>Hence, temperature coefficient of the material of wire is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>=</mo><mfrac><mn>1</mn><mn>30</mn></mfrac><mo>=</mo><mn>0</mn><mo>.</mo><mn>033</mn><mo>&#176;</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934da", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-28T14:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jun Shift 2)", "title": "JEE Main 2022 (28 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d67746", "previousYearPapers": [{"_id": "62c481f001514d218a7934d1", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-24T09:00:00.000Z", "isVisible": true, "shortName": "2022 (24 Jun Shift 1)", "title": "JEE Main 2022 (24 Jun Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Two metallic blocks <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>M</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>M</mi><mn>2</mn></msub></math> of same area of cross-section are connected to each other (as shown in figure). If the thermal conductivity of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>M</mi><mn>2</mn></msub></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi></math> then the thermal conductivity of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>M</mi><mn>1</mn></msub></math> will be : [Assume steady state heat conduction]</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/03fb5558-a997-4a49-b59e-ab8291a73a2f-image.png\" style=\"width: 280px; height: 88px;\" /></p>", "image": null}, "options": [{"id": "n9aNR", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mi>K</mi></math>", "isCorrect": false, "image": null}, {"id": "ThlYc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mi>K</mi></math>", "isCorrect": true, "image": null}, {"id": "bmVlX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>.</mo><mn>5</mn><mi>K</mi></math>", "isCorrect": false, "image": null}, {"id": "MhKu7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>K</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Let thermal conductivity of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>M</mi><mn>1</mn></msub></math>&nbsp;be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi><mo>&#39;</mo></math>.</p><p>Using heat current relation for steady state conduction,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>K</mi><mo>&#39;</mo><mi>A</mi><mfenced><mrow><mn>100</mn><mo>-</mo><mn>80</mn></mrow></mfenced></mrow><mn>16</mn></mfrac><mo>=</mo><mfrac><mrow><mi>K</mi><mi>A</mi><mfenced><mrow><mn>80</mn><mo>-</mo><mn>0</mn></mrow></mfenced></mrow><mn>8</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><mi>K</mi><mo>&#39;</mo><mo>&#215;</mo><mn>20</mn></mrow><mn>16</mn></mfrac><mo>=</mo><mfrac><mrow><mi>K</mi><mo>&#215;</mo><mn>80</mn></mrow><mn>8</mn></mfrac><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><mi>K</mi><mo>&#39;</mo><mo>=</mo><mn>8</mn><mi>K</mi></math></p>", "image": null}, "videoSolution": {"videoId": "5c16dd2138bd4aa081ef411a98c7d63e", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/AfRwB22wGgwKz.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/AfRwB22wGgwKz.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFre
