11 Apr Shift 1)", "title": "JEE Main 2023 (11 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d6822d", "previousYearPapers": [{"_id": "63f499871d196b49d9cd6b10", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 2)", "title": "JEE Main 2023 (30 Jan Shift 2)"}], "type": "numerical", "level": 3, "question": {"text": "A faulty thermometer reads <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>&nbsp;in melting ice and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>95</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>&nbsp;in steam. The correct temperature on absolute scale will be ______ <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">K</mi></math> when the faulty thermometer reads&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>41</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>.", "image": null}, "options": [], "correctValue": "313", "solution": {"text": "<p>As per&nbsp;working of thermometers,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>X</mi><mo>-</mo><mi>L</mi><mi>F</mi><mi>P</mi></mrow><mrow><mi>U</mi><mi>F</mi><mi>P</mi><mo>-</mo><mi>L</mi><mi>F</mi><mi>P</mi></mrow></mfrac><mo>=</mo><mtext>constant</mtext></math>.</p><p>Therefore, we can write</p><p>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>41</mn><mo>&#176;</mo><mo>-</mo><mn>5</mn><mo>&#176;</mo></mrow><mrow><mn>95</mn><mo>&#176;</mo><mo>-</mo><mn>5</mn><mo>&#176;</mo></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>C</mi><mo>-</mo><mn>0</mn><mo>&#176;</mo></mrow><mrow><mn>100</mn><mo>&#176;</mo><mo>-</mo><mn>0</mn><mo>&#176;</mo></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>C</mi><mo>=</mo><mfrac><mn>36</mn><mn>90</mn></mfrac><mo>&#215;</mo><mn>100</mn><mspace linebreak=\"newline\"/><mo>=</mo><mn>40</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi><mspace linebreak=\"newline\"/><mo>=</mo><mn>40</mn><mo>+</mo><mn>273</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi><mspace linebreak=\"newline\"/><mo>=</mo><mn>313</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499871d196b49d9cd6b10", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 2)", "title": "JEE Main 2023 (30 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d680c3", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T14:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 2)", "title": "JEE Main 2023 (25 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>The graph between two temperature scales <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math> is shown in the figure. Between upper fixed point and lower fixed point there are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>150</mn></math> equal divisions of scale <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn></math> divisions on scale <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math>. The relationship for conversion between the two scales is given by :</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/fed11c89-6c38-4d03-ac2c-5e6a689da0b5-9894157.png\" style=\"width: 300px; height: 283px;\" />.</p>", "image": null}, "options": [{"id": "ekqMk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>t</mi><mi>Q</mi></msub><mn>150</mn></mfrac><mo>=</mo><mfrac><mstyle displaystyle=\"true\"><msub><mi>t</mi><mi>P</mi></msub><mo>-</mo><mn>180</mn></mstyle><mn>100</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "i9o4L", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>t</mi><mi>Q</mi></msub><mn>100</mn></mfrac><mo>=</mo><mfrac><mstyle displaystyle=\"true\"><msub><mi>t</mi><mi>P</mi></msub><mo>-</mo><mn>30</mn></mstyle><mn>150</mn></mfrac></math>", "isCorrect": true, "image": null}, {"id": "GhS15", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>t</mi><mi>P</mi></msub><mn>180</mn></mfrac><mo>=</mo><mfrac><mstyle displaystyle=\"true\"><msub><mi>t</mi><mi>Q</mi></msub><mo>-</mo><mn>40</mn></mstyle><mn>100</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "YF7LT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>t</mi><mi>Q</mi></msub><mn>100</mn></mfrac><mo>=</mo><mfrac><mstyle displaystyle=\"true\"><msub><mi>t</mi><mi>P</mi></msub><mo>-</mo><mn>180</mn></mstyle><mn>150</mn></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>From the graph</p><p>For scale <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>,<br />Lower fixed point<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>180</mn><mo>-</mo><mn>150</mn><mo>=</mo><mn>30</mn><mo>&#176;</mo><mi mathvariant=\"normal\">P</mi></math></p><p>Upper fixed point<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>180</mn><mo>&#176;</mo><mi mathvariant=\"normal\">P</mi></math></p><p>For scale <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math>,<br />Lower fixed point<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>0</mn><mo>&#176;</mo><mi mathvariant=\"normal\">Q</mi></math></p><p>Upper fixed point<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>100</mn><mo>&#176;</mo><mi mathvariant=\"normal\">Q</mi></math></p><p>Thus, the relationship between the two scales <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math> is given by</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>t</mi><mi>P</mi></msub><mo>-</mo><mn>30</mn></mrow><mrow><mn>180</mn><mo>-</mo><mn>30</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mi>t</mi><mi>Q</mi></msub><mo>-</mo><mn>0</mn></mrow><mrow><mn>100</mn><mo>-</mo><mn>0</mn></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mstyle displaystyle=\"true\"><msub><mi>t</mi><mi>P</mi></msub><mo>-</mo><mn>30</mn></mstyle><mstyle displaystyle=\"true\"><mn>150</mn></mstyle></mfrac><mo>=</mo><mfrac><msub><mi>t</mi><mi>Q</mi></msub><mn>100</mn></mfrac></math></p>", "image": null}, "videoSolution": {"videoId": "532b95958a8c422c941948c3a7914b62", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/J6MtinHSgzMyI.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/J6MtinHSgzMyI.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "63f499841d196b49d9cd6b0c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T14:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 2)", "title": "JEE Main 2023 (25 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6a417cc3fb48d67309", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf817", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-25T09:00:00.000Z", "isVisible": true, "shortName": "2021 (25 Jul Shift 1)", "title": "JEE Main 2021 (25 Jul Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Two different metal bodies <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> of equal mass are heated at a uniform rate under similar conditions. The variation of temperature of the bodies is graphically represented as shown in the figure. The ratio of specific heat capacities is:</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/b572a661-b87a-42f8-af37-181f394ee0a0-image.png\" style=\"width: 345px; height: 221px;\" /></p>", "image": null}, "options": [{"id": "aUhCG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>8</mn><mn>3</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "nTXe6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>8</mn></mfrac></math>", "isCorrect": true, "image": null}, {"id": "sH5aM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>4</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "ADCTD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>3</mn></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mfenced><mfrac><mrow><mi mathvariant=\"normal\">&#916;</mi><mi>Q</mi></mrow><mrow><mi mathvariant=\"normal\">&#916;</mi><mi>t</mi></mrow></mfrac></mfenced><mi>A</mi></msub><mo>=</mo><msub><mfenced><mfrac><mrow><mi mathvariant=\"normal\">&#916;</mi><mi>Q</mi></mrow><mrow><mi mathvariant=\"normal\">&#916;</mi><mi>t</mi></mrow></mfrac></mfenced><mi>B</mi></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><msub><mi>S</mi><mi mathvariant=\"normal\">A</mi></msub><msub><mfenced><mfrac><mrow><mi mathvariant=\"normal\">&#916;</mi><mi>T</mi></mrow><mrow><mi mathvariant=\"normal\">&#916;</mi><mi>t</mi></mrow></mfrac></mfenced><mi mathvariant=\"normal\">A</mi></msub><mo>=</mo><mi>m</mi><msub><mi>S</mi><mi mathvariant=\"normal\">B</mi></msub><msub><mfenced><mfrac><mrow><mi mathvariant=\"normal\">&#916;</mi><mi>T</mi></mrow><mrow><mi mathvariant=\"normal\">&#916;</mi><mi>t</mi></mrow></mfrac></mfenced><mi mathvariant=\"normal\">B</mi></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>S</mi><mi mathvariant=\"normal\">A</mi></msub><msub><mi>S</mi><mi mathvariant=\"normal\">B</mi></msub></mfrac><mo>=</mo><mfrac><msub><mfenced><mfrac><mrow><mi mathvariant=\"normal\">&#916;</mi><mi>T</mi></mrow><mrow><mi mathvariant=\"normal\">&#916;</mi><mi>t</mi></mrow></mfrac></mfenced><mi mathvariant=\"normal\">A</mi></msub><msub><mfenced><mfrac><mrow><mi mathvariant=\"normal\">&#916;</mi><mi>T</mi></mrow><mrow><mi mathvariant=\"normal\">&#916;</mi><mi>t</mi></mrow></mfrac></mfenced><mi mathvariant=\"normal\">B</mi></msub></mfrac><mo>=</mo><mfrac><mrow><mn>90</mn><mo>/</mo><mn>6</mn></mrow><mrow><mn>120</mn><mo>/</mo><mn>3</mn></mrow></mfrac><mo>=</mo><mfrac><mn>15</mn><mn>40</mn></mfrac><mo>=</mo><mfrac><mn>3</mn><mn>8</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92edde3d91842a5cf817", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-25T09:00:00.000Z", "isVisible": true, "shortName": "2021 (25 Jul Shift 1)", "title": "JEE Main 2021 (25 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d6679f", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7ed", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T14:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 2)", "title": "JEE Main 2019 (11 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "A thermometer graduated according to a linear scale reads a value $x_{0}$ when in contact with boiling water, and $x_{0} / 3$ when in contact with ice. What is the temperature of an object in ${ }^{\\circ} \\mathrm{C}$, if this thermometer in the contact with the object reads $x_{0} / 2 ?$", "image": null}, "options": [{"id": "8zu08", "text": "25", "isCorrect": true, "image": null}, {"id": "gaoHE", "text": "60", "isCorrect": false, "image": null}, {"id": "aSU45", "text": "40", "isCorrect": false, "image": null}, {"id": "yK2lv", "text": "35", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let required temperature $=\\mathrm{T}^{\\circ} \\mathrm{C}$\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/K59zd9T1NaSvNWIln9FpJ9pVHg697GmZALA-kdMhUr0.original.fullsize.png\"><br>\r\n\r\n$\\Rightarrow \\mathrm{T}^{\\circ} \\mathrm{C}=\\frac{\\mathrm{x}_{0}}{2}-\\frac{\\mathrm{x}_{0}}{3}=\\frac{\\mathrm{x}_{0}}{6}$\r\n\r\n$\\&\\left(\\mathrm{x}_{0}-\\frac{\\mathrm{x}_{0}}{3}\\right)=\\left(100-0^{\\circ} \\mathrm{C}\\right)$\r\n\r\n$\\Rightarrow \\frac{2 \\mathrm{x}_{0}}{3}=100 \\Rightarrow \\mathrm{x}_{0}=\\frac{300}{2}$\r\n\r\n$\\Rightarrow \\mathrm{T}^{\\circ} \\mathrm{C}=\\frac{\\mathrm{x}_{0}}{6}=\\frac{150}{6}=25^{\\circ} \\mathrm{C}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ed", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T14:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 2)", "title": "JEE Main 2019 (11 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65baf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2013 (09 Apr Online)", "title": "JEE Main 2013 (09 Apr Online)"}], "question": {"text": "On a linear temperature scale $\\mathrm{Y}$, water freezes at $-160^{\\circ} \\mathrm{Y}$ and boils at $-50^{\\circ} \\mathrm{Y}$. On this $\\mathrm{Y}$ scale, a temperature of $340 \\mathrm{~K}$ would be read as : (water freezes at $273 \\mathrm{~K}$ and boils at $373 \\mathrm{~K}$ )", "image": null}, "options": [{"id": "vtHzf", "text": "\n$-73.7^{\\circ} \\mathrm{Y}$\n", "image": null, "isCorrect": false}, {"id": "w3Mwb", "text": "\n$-233.7^{\\circ} \\mathrm{Y}$\n", "image": null, "isCorrect": false}, {"id": "Ept3e", "text": "\n$-86.3^{\\circ} \\mathrm{Y}$\n", "image": null, "isCorrect": true}, {"id": "G9Tj7", "text": "\n$-106.3^{\\circ} \\mathrm{Y}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Reading on any scale - LFP\nUFP - LFP\n$=$ constant for all scales\n$\\frac{340-273}{373-273}=\\frac{{ }^{\\circ} \\mathrm{y}-(-160)}{-50-(-160)}$\n$\\Rightarrow \\frac{67}{100}=\\frac{\\mathrm{y}+160}{110}$\n$\\therefore \\quad y=-86.3^{\\circ} \\mathrm{y}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2013 (09 Apr Online)", "title": "JEE Main 2013 (09 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65578", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}], "question": {"text": "Time taken by a $836 \\mathrm{~W}$ heater to heat one litre of water from $10^{\\circ} \\mathrm{C}$ to $40^{\\circ} \\mathrm{C}$ is", "image": null}, "options": [{"id": "6kl6j", "text": "\n$50 \\mathrm{~s}$\n", "image": null, "isCorrect": false}, {"id": "QS9hP", "text": "\n$100 \\mathrm{~s}$\n", "image": null, "isCorrect": false}, {"id": "8eehp", "text": "\n$150 \\mathrm{~s}$\n", "image": null, "isCorrect": true}, {"id": "0X1PX", "text": "\n$200 \\mathrm{~s}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $\\mathrm{t}$ be the time taken, then\n$$\n\\begin{aligned}\n& \\frac{836 \\times t}{4.2}=1000 \\times 1 \\times(40-10)[\\text { using } Q=m s t] \\\\\n& \\Rightarrow t=150 \\text { sec. }\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "648b5a73417cc3fb48d691f4", "title": "Thermal Expansion", "totalQuestions": 35, "questions": [{"_id": "69d8074681239f6567c4f3d3", "type": "singleCorrect", "question": {"text": "The temperature of a metal strip having coefficient of linear expansion $\\alpha$ is increased from $T_1$ to $T_2$ resulting in increase of its length by $\\Delta L_1$. The temperature is further increased from $T_2$ to $T_3$ such that the increase in its length is $\\Delta L_2$. Given $T_3+T_1=2T_2$ and $T_2-T_1=\\Delta T$, the value of $\\Delta L_2$ is ______.", "image": null}, "options": [{"id": "KC2as", "text": "$\\Delta L_1[1+2\\alpha^2(\\Delta T)^2]$", "isCorrect": false, "image": null}, {"id": "Rfx4i", "text": "$\\Delta L_1[1+\\alpha^2(\\Delta T)^2]$", "isCorrect": false, "image": null}, {"id": "rgYRc", "text": "$\\Delta L_1[1+2\\alpha\\Delta T]$", "isCorrect": false, "image": null}, {"id": "AjINb", "text": "$\\Delta L_1[1+\\alpha\\Delta T]$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let the length of the metal strip at temperature $T_1$ be $L_1$.<br><br>When the temperature is increased from $T_1$ to $T_2$, the new length $L_2$ is given by:<br><br>$L_2 = L_1(1 + \\alpha \\Delta T)$<br><br>where $\\Delta T = T_2 - T_1$.<br><br>The increase in length is:<br><br>$\\Delta L_1 = L_2 - L_1 = L_1 \\alpha \\Delta T$<br><br>When the temperature is further increased from $T_2$ to $T_3$, the new length $L_3$ is:<br><br>$L_3 = L_2(1 + \\alpha \\Delta T')$<br><br>where $\\Delta T' = T_3 - T_2$.<br><br>Given $T_3 + T_1 = 2T_2$, we have $T_3 - T_2 = T_2 - T_1 = \\Delta T$.<br><br>Thus, $\\Delta T' = \\Delta T$.<br><br>The increase in length for this second temperature change is:<br><br>$\\Delta L_2 = L_3 - L_2 = L_2 \\alpha \\Delta T$<br><br>Substituting $L_2 = L_1(1 + \\alpha \\Delta T)$ into the equation for $\\Delta L_2$:<br><br>$\\Delta L_2 = L_1(1 + \\alpha \\Delta T) \\alpha \\Delta T$<br><br>$\\Delta L_2 = (L_1 \\alpha \\Delta T)(1 + \\alpha \\Delta T)$<br><br>Since $\\Delta L_1 = L_1 \\alpha \\Delta T$, substituting this gives:<br><br>$\\Delta L_2 = \\Delta L_1(1 + \\alpha \\Delta T)$<br><br>Answer: $\\Delta L_1[1+\\alpha\\Delta T]$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd6", "title": "JEE Main 2026 (04 April Shift 2)", "shortName": "2026 (04 April Shift 2)", "isVisible": true, "heldOn": "2026-04-04T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "cf3341c0c45348fab5b3597ab94db1af", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/YIPf44JZbcaZt.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/YIPf44JZbcaZt.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd6", "title": "JEE Main 2026 (04 April Shift 2)", "shortName": "2026 (04 April Shift 2)", "isVisible": true, "heldOn": "2026-04-04T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1a08bfdbb243563971e", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f47", "title": "JEE Main 2026 (24 January Shift 1)", "shortName": "2026 (24 January Shift 1)", "isVisible": true, "heldOn": "2026-01-24T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "A brass wire of length 2 m and radius 1 mm at $27^{\\circ} \\mathrm{C}$ is held taut between two rigid supports. Initially it was cooled to a temperature of $-43^{\\circ} \\mathrm{C}$ creating a tension $T$ in the wire. The temperature to which the wire has to be cooled in order to increase the tension in it to $1.4 T$, is $\\_\\_\\_\\_$ ${ }^{\\circ} \\mathrm{C}$.", "image": null}, "options": [{"id": "hpd2T", "text": "-86", "isCorrect": false, "image": null}, {"id": "6EZat", "text": "-65", "isCorrect": false, "image": null}, {"id": "HWT8S", "text": "-71", "isCorrect": true, "image": null}, {"id": "Pf93a", "text": "-80", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Thermal stress in the wire is caused by contraction.<br>At -43°C, the temperature drop from 27°C is $\\Delta T_1 = 70°C$<br> It creates tension $T = YA\\alpha\\Delta T_1$ where $Y$ is Young's modulus and $\\alpha$ is linear expansion coefficient. <br>For tension to increase to $1.4T$, the new temperature drop must be: $\\Delta T_2 = 1.4 \\times 70 = 98°C$. <br>Required temperature: $T_3 = 27 - 98 = -71°C$", "image": null}, "videoSolution": {"videoId": "6386954038524fb48a11a93b796d2f37", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/R4mmPuf3hiv2A.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/R4mmPuf3hiv2A.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f47", "title": "JEE Main 2026 (24 January Shift 1)", "shortName": "2026 (24 January Shift 1)", "isVisible": true, "heldOn": "2026-01-24T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c17b8bfdbb2435639555", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f41", "title": "JEE Main 2026 (21 January Shift 1)", "shortName": "2026 (21 January Shift 1)", "isVisible": true, "heldOn": "2026-01-21T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "An aluminium and steel rods having same lengths and cross-sections are joined to make total length of 120 cm at $30^{\\circ} \\mathrm{C}$. The coefficient of linear expansion of aluminium and steel are $24 \\times 10^{-6} /{ }^{\\circ} \\mathrm{C}$ and $1.2 \\times 10^{-5} /{ }^{\\circ} \\mathrm{C}$, respectively. The length of this composite rod when its temperature is raised to $100^{\\circ} \\mathrm{C}$, is $\\_\\_\\_\\_$ cm.", "image": null}, "options": [{"id": "VEg4Q", "text": "120.20", "isCorrect": false, "image": null}, {"id": "jLfE3", "text": "120.15", "isCorrect": true, "image": null}, {"id": "Ejywj", "text": "120.06", "isCorrect": false, "image": null}, {"id": "Mv9FW", "text": "120.03", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Total length at 30°C = 120 cm, each rod = 60 cm<br>$\\alpha_{Al} = 24 \\times 10^{-6}$/°C, $\\alpha_{Steel} = 1.2 \\times 10^{-5}$/°C<br>$\\Delta T = 100 - 30 = 70$°C<br>$\\Delta L_{Al} = 60 \\times 24 \\times 10^{-6} \\times 70 = 0.1008$ cm<br>$\\Delta L_{Steel} = 60 \\times 1.2 \\times 10^{-5} \\times 70 = 0.0504$ cm<br>Total expansion $= 0.1008 + 0.0504 = 0.1512$ cm<br>Final length $= 120 + 0.1512 = 120.15$ cm", "image": null}, "videoSolution": {"videoId": "411681ec1694441994eb9e60e8938691", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/PjiGMzw8kbSg0.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/PjiGMzw8kbSg0.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f41", "title": "JEE Main 2026 (21 January Shift 1)", "shortName": "2026 (21 January Shift 1)", "isVisible": true, "heldOn": "2026-01-21T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542c667c09d044e4c1a1ca", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2ff9d87935e0d80978a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-04T14:00:00.000Z", "isVisible": true, "shortName": "2025 (4 Apr Shift 2)", "title": "JEE Main 2025 (4 Apr Shift 2)"}], "question": {"text": "Consider a rectangular sheet of solid material of length $\\ell=9 \\mathrm{~cm}$ and width $\\mathrm{d}=4 \\mathrm{~cm}$. The coefficient of linear expansion is $\\alpha=3.1 \\times 10^{-5} \\mathrm{~K}^{-1}$ at room temperature and one atmospheric pressure. The mass of sheet $\\mathrm{m}=0.1 \\mathrm{~kg}$ and the specific heat capacity $\\mathrm{C}_{\\mathrm{v}}=900 \\mathrm{~J} \\mathrm{~kg}^{-1} \\mathrm{~K}^{-1}$. If the amount of heat supplied to the material is $8.1 \\times 10^2 \\mathrm{~J}$ then change in area of the rectangular sheet is :-", "image": null}, "options": [{"id": "kLKG5", "text": "$2.0 \\times 10^{-6} \\mathrm{~m}^2$", "image": null, "isCorrect": true}, {"id": "W3AZ9", "text": "$3.0 \\times 10^{-7} \\mathrm{~m}^2$", "image": null, "isCorrect": false}, {"id": "UCy1Q", "text": "$6.0 \\times 10^{-7} \\mathrm{~m}^2$", "image": null, "isCorrect": false}, {"id": "S8WYo", "text": "$4.0 \\times 10^{-7} \\mathrm{~m}^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\Delta \\mathrm{Q}=\\mathrm{ms} \\Delta \\mathrm{T} \\\\ & 8.1 \\times 10^2=0.1 \\times 900 \\times \\Delta \\mathrm{T} \\\\ & \\Delta \\mathrm{A}=\\mathrm{A}_0 2 \\alpha \\Delta \\mathrm{~T}=2.0 \\times 10^{-6} \\mathrm{~m}^2\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "46e250d3775243a89b7b0b3955fa14f6", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/33r0MApKfORQI.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/33r0MApKfORQI.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6852f2ff9d87935e0d80978a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-04T14:00:00.000Z", "isVisible": true, "shortName": "2025 (4 Apr Shift 2)", "title": "JEE Main 2025 (4 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6644675b970e6e9ab542d294", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "664466ef278297dee60eda71", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 Apr Shift 2)", "title": "JEE Main 2024 (09 Apr Shift 2)"}], "question": {"text": "At room temperature $\\left(27^{\\circ} \\mathrm{C}\\right)$, the resistance of a heating element is $50 \\Omega$. The temperature coefficient of the material is $2.4 \\times 10^{-4}{ }^{\\circ} \\mathrm{C}^{-1}$. The temperature of the element, when its resistance is $62 \\Omega$, is _____ ${ }^{\\circ} \\mathrm{C}$.", "image": null}, "options": [], "correctValue": "1027", "solution": {"text": "$\\begin{aligned} & \\mathrm{R}=\\mathrm{R}_0(1+\\alpha \\Delta \\mathrm{T}) \\\\ & 62=50\\left[1+2.4 \\times 10^{-4} \\Delta \\mathrm{T}\\right] \\\\ & \\Delta \\mathrm{T}=1000^{\\circ} \\mathrm{C} \\\\ & \\Rightarrow \\mathrm{T}-27^{\\circ}=1000^{\\circ} \\mathrm{C} \\\\ & \\mathrm{T}=1027^{\\circ} \\mathrm{C}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ef278297dee60eda71", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 Apr Shift 2)", "title": "JEE Main 2024 (09 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66446703970e6e9ab542cf64", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "664466ee278297dee60eda68", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 Apr Shift 1)", "title": "JEE Main 2024 (04 Apr Shift 1)"}], "question": {"text": "The resistances of the platinum wire of a platinum resistance thermometer at the ice point and steam point are $8 \\Omega$ and $10 \\Omega$ respectively. After inserting in a hot bath of temperature $400^{\\circ} \\mathrm{C}$, the resistance of platinum wire is :", "image": null}, "options": [{"id": "WgWeB", "text": "$10 \\Omega$", "image": null, "isCorrect": false}, {"id": "kVOaL", "text": "$8 \\Omega$", "image": null, "isCorrect": false}, {"id": "u6h9X", "text": "$16 \\Omega$", "image": null, "isCorrect": true}, {"id": "KeIuW", "text": "$2 \\Omega$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $R_0=8 \\Omega, R_{100}=10 \\Omega$\n$\\therefore \\mathrm{R}_{100}=\\mathrm{R}_0(1+\\alpha \\Delta \\mathrm{T})$<br />Also, $R_{400}=R_0\\left(1+\\alpha \\Delta \\mathrm{T}^1\\right)$\n$\\begin{aligned}\n& \\therefore 10=8(1+\\alpha \\times 100) \\Rightarrow 100 \\alpha=\\frac{1}{4} \\\\\n& \\therefore \\mathrm{R}_{400}=8(1+400 \\alpha)=8(1+1)=16 \\Omega\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ee278297dee60eda68", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 Apr Shift 1)", "title": "JEE Main 2024 (04 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d68450", "type": "numerical", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 2)", "title": "JEE Main 2023 (08 Apr Shift 2)"}], "question": {"text": "A steel rod of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math> and cross-sectional area <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math>&nbsp;is heated from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> without being allowed to extend or bend. The compressive tension produced in the rod is _____<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#215;</mo><msup><mn>10</mn><mn>4</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi></math>. (Given Young&#39;s modulus of steel <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mn>11</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>, coefficient of linear expansion <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> )", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "<blockquote><p>The formula to calculate the Young&#39;s modulus of the material of the wire is given by</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Y</mi><mo>=</mo><mfrac><mrow><mi>F</mi><mi>L</mi></mrow><mrow><mi>A</mi><mo>&#8710;</mo><mi>L</mi></mrow></mfrac><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>1</mn></mfenced></math></p><p>The increase in length of the wire due to increase in temperature is given by</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>L</mi><mo>=</mo><mi>L</mi><mi>&#945;</mi><mfenced><mrow><msub><mi>T</mi><mn>2</mn></msub><mo>-</mo><msub><mi>T</mi><mn>1</mn></msub></mrow></mfenced><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>2</mn></mfenced></math></p><p>Substitute the expression for the extension in length from equation (2) into equation (1) and simplify to obtain the required compressive tension.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable columnalign=\"right center left\" columnspacing=\"0px\"><mtr><mtd><mi>Y</mi></mtd><mtd><mo>=</mo></mtd><mtd><mfrac><mrow><mi>F</mi><mi>L</mi></mrow><mrow><mi>A</mi><mi>L</mi><mi>&#945;</mi><mfenced><mrow><msub><mi>T</mi><mn>2</mn></msub><mo>-</mo><msub><mi>T</mi><mn>1</mn></msub></mrow></mfenced></mrow></mfrac></mtd></mtr><mtr><mtd></mtd><mtd><mo>&#8658;</mo></mtd><mtd><mi>F</mi><mo>=</mo><mi>A</mi><mi>&#945;</mi><mi>Y</mi><mfenced><mrow><msub><mi>T</mi><mn>2</mn></msub><mo>-</mo><msub><mi>T</mi><mn>1</mn></msub></mrow></mfenced><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>3</mn></mfenced></mtd></mtr></mtable></math></p><p>Substitute the values of the known parameters into equation (3) to calculate the required compressive tension in the wire.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable columnalign=\"right center left\" columnspacing=\"0px\"><mtr><mtd><mi>F</mi></mtd><mtd><mo>=</mo></mtd><mtd><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup><mo>&#160;</mo><msup><mi>m</mi><mn>2</mn></msup><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#215;</mo><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mn>11</mn></msup><mo>&#160;</mo><msup><mi>Nm</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>&#215;</mo><mfenced><mrow><mn>200</mn><mo>&#176;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mn>0</mn><mo>&#176;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">C</mi></mrow></mfenced></mtd></mtr><mtr><mtd></mtd><mtd><mo>=</mo></mtd><mtd><mo>&#160;</mo><mn>4</mn><mo>&#215;</mo><msup><mn>10</mn><mn>4</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi></mtd></mtr></mtable></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "e65096f3048742159b25f3a04a4a5366", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/LOszdwgxGwSCg.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/LOszdwgxGwSCg.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b648f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 2)", "title": "JEE Main 2023 (08 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d6828e", "previousYearPapers": [{"_id": "63f499871d196b49d9cd6b11", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T09:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 1)", "title": "JEE Main 2023 (31 Jan Shift 1)"}], "type": "numerical", "level": 1, "question": {"text": "A thin rod having a length of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math>&nbsp;and area of cross-section <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math> is suspended vertically from one end. The rod is cooled from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>210</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>&nbsp;to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>160</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>. After cooling, a mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> is attached at the lower end of the rod such that the length of rod again becomes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math>. Young&#39;s modulus and coefficient of linear expansion of the rod are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mn>11</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>, respectively. The value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> is ______ <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>kg</mi></math>. (Take&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mo>=</mo><mn>10</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math>)", "image": null}, "options": [], "correctValue": "60", "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ac071181-aa95-4681-b132-a1129be3c273-1ae73fd0-3f28-4ce4-b8f4-3e94e4c5b6b5-image.png\" style=\"width: 150px; height: 344px;\" /></p><p>Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>l</mi></math>&nbsp;be the decease in length of rod due to decease in temperature</p><p>Then,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>l</mi><mo>=</mo><mi>l</mi><mi>&#945;</mi><mi>&#916;</mi><mi>T</mi></math>, here, coefficient of linear expansion is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>=</mo><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#916;</mi><mi>T</mi><mo>=</mo><mo>(</mo><mn>483</mn><mo>-</mo><mn>433</mn><mo>)</mo><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>50</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p><p>Thus,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>l</mi><mo>=</mo><mn>1</mn><mo>&#215;</mo><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>&#215;</mo><mn>50</mn><mo>=</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math></p><p>Young&#39;s modulus is stated as&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Y</mi><mo>=</mo><mfrac><mstyle displaystyle=\"true\"><mfrac><mstyle displaystyle=\"true\"><mi>F</mi></mstyle><mi>A</mi></mfrac></mstyle><mstyle displaystyle=\"true\"><mfrac><mrow><mi>&#916;</mi><mstyle displaystyle=\"true\"><mi>l</mi></mstyle></mrow><mi>l</mi></mfrac></mstyle></mfrac></math>, here,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi><mo>=</mo><mi>M</mi><mi>g</mi></math>.</p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mn>11</mn></msup><mo>=</mo><mfrac><mrow><mi>M</mi><mi>g</mi><mo>&#215;</mo><mn>1</mn></mrow><mrow><mn>3</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>M</mi><mi>g</mi><mo>=</mo><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mn>11</mn></msup><mo>&#215;</mo><mn>3</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>9</mn></mrow></msup><mo>=</mo><mn>6</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>2</mn></mrow></msup></math></p><p>Thus,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><mo>=</mo><mn>60</mn><mo>&#160;</mo><mi>kg</mi></math></p>", "image": null}, "videoSolution": {"videoId": "fe2e5b29fd9045cf8576cc6ca487f9ae", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/dAjgiNVoJisHo.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/dAjgiNVoJisHo.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499871d196b49d9cd6b11", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T09:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 1)", "title": "JEE Main 2023 (31 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d67fc0", "previousYearPapers": [{"_id": "63f499801d196b49d9cd6b09", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T09:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 1)", "title": "JEE Main 2023 (24 Jan Shift 1)"}], "type": "numerical", "level": 3, "question": {"text": "A hole is drilled in a metal sheet. At <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>27</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>, the diameter of hole is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#160;</mo><mi>cm</mi></math>. When the sheet is heated to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>177</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>, the change in the diameter of hole is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>&#160;</mo><mi>cm</mi></math> . The value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi></math> will be _____, if coefficient of linear expansion of the metal is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>6</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>/</mo><mmultiscripts><mi mathvariant=\"normal\">C</mi><mprescripts></mprescripts><none></none><mo>&#8728;</mo></mmultiscripts></math>&nbsp;", "image": null}, "options": [], "correctValue": "12", "solution": {"text": "<p>Expansion of hole will be similar to that of an imaginary disc.</p><p>Let diameter be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>d</mi><mn>0</mn></msub></math>&nbsp;at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>27</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>d</mi><mo>&#39;</mo></msup></math>&nbsp;at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>177</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>. Therefore, we can write</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>d</mi><mo>&#39;</mo></msup><mo>=</mo><msub><mi>d</mi><mn>0</mn></msub><mfenced><mrow><mn>1</mn><mo>+</mo><mi>&#945;</mi><mi>&#916;</mi><mi>T</mi></mrow></mfenced></math></p><p>Therefore, change in diameter will be</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>d</mi><mo>&#39;</mo></msup><mo>-</mo><msub><mi>d</mi><mn>0</mn></msub><mo>=</mo><mfenced><mn>5</mn></mfenced><mo>&#215;</mo><mfenced><mrow><mn>1</mn><mo>.</mo><mn>6</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup></mrow></mfenced><mo>&#215;</mo><mfenced><mrow><mn>177</mn><mo>-</mo><mn>27</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>12</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>&#160;</mo><mi>cm</mi></math></p><p>Hence, required value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi><mo>=</mo><mn>12</mn></math>.</p>", "image": null}, "videoSolution": {"videoId": "8db470c9ad3045b6a0c4c3b88a33ca17", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/wjV4D3uyu8Fen.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/wjV4D3uyu8Fen.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499801d196b49d9cd6b09", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T09:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 1)", "title": "JEE Main 2023 (24 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d677fe", "previousYearPapers": [{"_id": "63134c746e7bc9b332483703", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T09:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jul Shift 1)", "title": "JEE Main 2022 (25 Jul Shift 1)"}], "type": "numerical", "level": 3, "question": {"text": "<p>A unit scale is to be prepared whose length does not change with temperature and remains <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&#160;</mo><mi>cm</mi></math>, using a bimetallic strip made of brass and iron each of different length. The length of both components would change in such a way that difference between their lengths remains constant. If length of brass is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>&#160;</mo><mi>cm</mi></math> and length of iron will be _____&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>cm</mi></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"\"><mrow><msub><mi>&#945;</mi><mrow><mi>iron</mi><mo>&#160;</mo></mrow></msub><mo>=</mo><mn>1</mn><mo>.</mo><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><msup><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"\"><mrow><msub><mi>&#945;</mi><mrow><mi>brass</mi><mo>&#160;</mo></mrow></msub><mo>=</mo><mn>1</mn><mo>.</mo><mn>8</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><msup><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced></math>.</p>", "image": null}, "options": [], "correctValue": "60", "solution": {"text": "<blockquote><p>Linear expansion of solid with temperature is given by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mi>f</mi></msub><mo>=</mo><msub><mi>L</mi><mn>0</mn></msub><mfenced><mrow><mn>1</mn><mo>+</mo><mi>&#945;</mi><mo>&#8710;</mo><mi>T</mi></mrow></mfenced></math></p><p>Here,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>l</mi><mi mathvariant=\"normal\">B</mi></msub><mfenced><mrow><mn>1</mn><mo>+</mo><msub><mi>&#945;</mi><mi mathvariant=\"normal\">B</mi></msub><mi>&#916;</mi><mi mathvariant=\"normal\">T</mi></mrow></mfenced><mo>-</mo><msub><mi>l</mi><mi mathvariant=\"normal\">i</mi></msub><mfenced><mrow><mn>1</mn><mo>+</mo><msub><mi>&#945;</mi><mi mathvariant=\"normal\">i</mi></msub><mi>&#916;</mi><mi mathvariant=\"normal\">T</mi></mrow></mfenced><mo>=</mo><msub><mi>l</mi><mi mathvariant=\"normal\">B</mi></msub><mo>-</mo><msub><mi>l</mi><mi mathvariant=\"normal\">i</mi></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>&#945;</mi><mi mathvariant=\"normal\">B</mi></msub><msub><mi>l</mi><mi mathvariant=\"normal\">B</mi></msub><mo>=</mo><msub><mi>l</mi><mi mathvariant=\"normal\">i</mi></msub><msub><mi>&#945;</mi><mi mathvariant=\"normal\">i</mi></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>1</mn><mo>.</mo><mn>8</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn>< ><msup><mrow><mo>&#160;</mo><mi>cm</mi></mrow><mn>3</mn></msup></math>", "isCorrect": true, "image": null}, {"id": "ngMBa", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&#215;</mo><msup><mn>10</mn><mn>4</mn></msup><msup><mrow><mo>&#160;</mo><mi>cm</mi></mrow><mn>3</mn></msup></math>", "isCorrect": false, "image": null}, {"id": "YxYrg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>.</mo><mn>8</mn><mo>&#215;</mo><msup><mn>10</mn><mn>5</mn></msup><msup><mrow><mo>&#160;</mo><mi>cm</mi></mrow><mn>3</mn></msup></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Total surface area of a cube is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><msup><mi>a</mi><mn>2</mn></msup><mo>=</mo><mn>24</mn><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>a</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn></math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>a</mi><mo>=</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math></p><p>Volume of a cube&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi><mo>=</mo><msup><mi>a</mi><mn>3</mn></msup><mo>=</mo><mn>8</mn><msup><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></mrow><mn>3</mn></msup></math></p><p>Change in volume is given by,&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>V</mi><mo>=</mo><msub><mi>V</mi><mn>0</mn></msub><mi>&#947;</mi><mi>&#916;</mi><mi>T</mi></math>,&nbsp;where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#947;</mi><mo>=</mo><mn>3</mn><mi>&#945;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>V</mi><mo>=</mo><mfenced close=\"]\" open=\"[\"><mn>8</mn></mfenced><mo>&#215;</mo><mfenced close=\"]\" open=\"[\"><mrow><mn>1</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup></mrow></mfenced><mo>&#215;</mo><mfenced close=\"]\" open=\"[\"><mn>10</mn></mfenced><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>3</mn></msup></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#916;</mi><mi>V</mi><mo>=</mo><mn>1</mn><mo>.</mo><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mn>5</mn></msup><msup><mrow><mo>&#160;</mo><mi>cm</mi></mrow><mn>3</mn></msup></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "62c481f001514d218a7934d4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-25T14:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jun Shift 2)", "title": "JEE Main 2022 (25 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a69417cc3fb48d66e23", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf821", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-09-01T14:00:00.000Z", "isVisible": true, "shortName": "2021 (01 Sep Shift 2)", "title": "JEE Main 2021 (01 Sep Shift 2)"}], "type": "numerical", "level": 1, "question": {"text": "A <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi>kg</mi></math> steel rod of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>6</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math> is clamped on a table vertically at its lower end and is free to rotate in the vertical plane. The upper end is pushed so that the rod falls under gravity. Ignoring the friction due to clamping at its lower end, the speed of the free end of the rod when it passes through its lowest position is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>_</mi><mi>_</mi><mi>_</mi><mi>_</mi><mi>_</mi><mi>_</mi><mi>_m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>.</mo></math><br />(Take <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mo>=</mo><mn>10</mn><msup><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>&#160;</mo><mo>)</mo></math>", "image": null}, "options": [], "correctValue": "6", "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/442a8941-0f33-49d2-a16b-9ee83f470426-image.png\" style=\"width: 153px; height: 347px;\" /></p><p>In the above case the torque due to weight of the rod, here use the concept of translation work done and rotational kinetic energy,&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>W</mi><mo>=</mo><mi>K</mi><mo>.</mo><mi>E</mi><mo>.</mo><mo>&#8658;</mo><mi>m</mi><mi>g</mi><mi>l</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>I</mi><msup><mi>&#969;</mi><mn>2</mn></msup></math>, now the moment of inertia of the rod when the axis of rotation passes through one end of the rod,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I</mi><mo>=</mo><mfrac><mrow><mn>1</mn><mo>&#215;</mo><mi>m</mi><msup><mi>l</mi><mn>2</mn></msup></mrow><mn>3</mn></mfrac></math>,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>m</mi><mi>g</mi><mi>l</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mfrac><mrow><mi>m</mi><msup><mi>l</mi><mn>2</mn></msup></mrow><mn>3</mn></mfrac><msup><mi>&#969;</mi><mn>2</mn></msup></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#969;</mi><mo>=</mo><msqrt><mfrac><mrow><mn>6</mn><mi mathvariant=\"normal\">g</mi></mrow><mi>l</mi></mfrac></msqrt></math>, now use the relation between linear velocity and angular velocity,&nbsp;<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>v</mi><mo>=</mo><mi>l</mi><mi>&#969;</mi><mo>=</mo><msqrt><mn>3</mn><mo>.</mo><mn>6</mn><mi>g</mi></msqrt><mo>=</mo><mn>6</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf821", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-09-01T14:00:00.000Z", "isVisible": true, "shortName": "2021 (01 Sep Shift 2)", "title": "JEE Main 2021 (01 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d676dc", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf820", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-31T14:00:00.000Z", "isVisible": true, "shortName": "2021 (31 Aug Shift 2)", "title": "JEE Main 2021 (31 Aug Shift 2)"}], "type": "singleCorrect", "level": 3, "question": {"text": "Two thin metallic spherical shells of radii <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>r</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>r</mi><mn>2</mn></msub><mfenced><mrow><msub><mi>r</mi><mn>1</mn></msub><mo>&#60;</mo><msub><mi>r</mi><mn>2</mn></msub></mrow></mfenced></math> are placed with their centres coinciding. A material of thermal conductivity <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi></math> is filled in the space between the shells. The inner shell is maintained at temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#952;</mi><mn>1</mn></msub></math> and the outer shell at temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#952;</mi><mn>2</mn></msub><mfenced><mrow><msub><mi>&#952;</mi><mn>1</mn></msub><mo>&#60;</mo><msub><mi>&#952;</mi><mn>2</mn></msub></mrow></mfenced><mo>.</mo></math>&nbsp;The rate at which heat flows radially through the material is :", "image": null}, "options": [{"id": "GtXDT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathM >&#160;</mo><mi>V</mi></mrow></mfenced><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>V</mi></mrow><mrow><mi>d</mi><mi>T</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>4</mn><msup><mi>T</mi><mn>3</mn></msup><mo>/</mo><mi>V</mi></mrow><mrow><msup><mi>T</mi><mn>4</mn></msup><mo>/</mo><msup><mi>V</mi><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>4</mn><mi>V</mi></mrow><mi>T</mi></mfrac><mo>&#160;&#160;</mo><mo>&#8756;</mo><mi>&#947;</mi><mo>=</mo><mfrac><mn>4</mn><mi>T</mi></mfrac></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf81d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-27T09:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Aug Shift 1)", "title": "JEE Main 2021 (27 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a69417cc3fb48d66ecf", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf80f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-16T14:00:00.000Z", "isVisible": true, "shortName": "2021 (16 Mar Shift 2)", "title": "JEE Main 2021 (16 Mar Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>A bimetallic strip consists of metals <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>. It is mounted rigidly as shown. The metal <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> has higher coefficient of expansion compared to that of metal&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>. When the bimetallic strip is placed in a cold both, it will :</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ecce5b85-b144-42b5-98ea-dd478f391dd1-image.png\" style=\"width: 166px; height: 127px;\" /></p>", "image": null}, "options": [{"id": "JrEG3", "text": "Bend towards the right", "isCorrect": false, "image": null}, {"id": "yogNi", "text": "Not bend but shrink", "isCorrect": false, "image": null}, {"id": "GEIxE", "text": "Neither bend nor shrink", "isCorrect": false, "image": null}, {"id": "qQJBK", "text": "Bend towards the left", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#945;</mi><mi>A</mi></msub><mo>&#62;</mo><msub><mi>&#945;</mi><mi>B</mi></msub></math></p><p>Length of both strips will decrease <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#916;</mi><msub><mi>L</mi><mi>A</mi></msub><mo>&#62;</mo><mi mathvariant=\"normal\">&#916;</mi><msub><mi>L</mi><mi>B</mi></msub></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/66a64360-93df-4647-958b-6b8b325e7ce4-image.png\" style=\"width: 200px; height: 133px;\" /></p>", "image": null}, "videoSolution": {"videoId": "403c670677ea4692a2963b67fd7a0339", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/x4rEa3OYRtb1h.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/x4rEa3OYRtb1h.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "questionStructure": ["DIAGRAM_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92edde3d91842a5cf80f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-16T14:00:00.000Z", "isVisible": true, "shortName": "2021 (16 Mar Shift 2)", "title": "JEE Main 2021 (16 Mar Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6a417cc3fb48d67248", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf80a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-25T09:00:00.000Z", "isVisible": true, "shortName": "2021 (25 Feb Shift 1)", "title": "JEE Main 2021 (25 Feb Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Given below are two statements: one is labelled as Assertion <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;and the other is labelled as Reason <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>.</p><p>Assertion <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;: When a rod lying freely is heated, no thermal stress is developed in it.</p><p>Reason <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;:&nbsp;On heating, the length of the rod increases.</p><p>In the light of the above statements, choose the correct answer from the options given below:</p>", "image": null}, "options": [{"id": "t9Irf", "text": "Both&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> are true and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;is the correct explanation of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>", "isCorrect": false, "image": null}, {"id": "JvQo3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;is false but&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> is true", "isCorrect": false, "image": null}, {"id": "SjqiF", "text": "Both <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;are true but <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;is NOT&nbsp;the correct explanation of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>", "isCorrect": true, "image": null}, {"id": "4Uz8r", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;is true but&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> is false", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Thermal stress is mechanical stress created by any change in temperature of a material. When the body is under some constraints, thermal stress is generated. But if it is lying freely, no thermal stress is developed.</p><p>The increase in length of a body with&nbsp;temperature is given by</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>L</mi><mo>=</mo><mi>L</mi><mi>&#945;</mi><mo>&#8710;</mo><mi>T</mi></math></p><p>So, with the increase in temperature, the length of the rod increases.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;are true but <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;is not the correct explanation of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["ASSERTION_REASON"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92edde3d91842a5cf80a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-25T09:00:00.000Z", "isVisible": true, "shortName": "2021 (25 Feb Shift 1)", "title": "JEE Main 2021 (25 Feb Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6a417cc3fb48d671a6", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf808", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Feb Shift 1)", "title": "JEE Main 2021 (24 Feb Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Each side of a box made of metal sheet in cubic shape is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math>&nbsp;at room temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math>, the coefficient of linear expansion of the metal sheet is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi></math>.&nbsp;The metal sheet is heated uniformly, by a small temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>T</mi></math>, so that its new temperature is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>+</mo><mi>&#916;</mi><mi>T</mi></math>. Calculate the increase in the volume of the metal box.", "image": null}, "options": [{"id": "mRZb9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><msup><mi>a</mi><mn>3</mn></msup><mi>&#945;</mi><mi>&#916;</mi><mi>T</mi></math>", "isCorrect": false, "image": null}, {"id": "S2K3y", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><msup><mi>a</mi><mn>3</mn></msup><mi>&#945;</mi><mi>&#916;</mi><mi>T</mi></math>", "isCorrect": true, "image": null}, {"id": "OSQme", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi>&#960;</mi><msup><mi>a</mi><mn>3</mn></msup><mi>&#945;</mi><mi>&#916;</mi><mi>T</mi></math>", "isCorrect": false, "image": null}, {"id": "TR4qL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>3</mn></mfrac><mi>&#960;</mi><msup><mi>a</mi><mn>3</mn></msup><mi>&#945;</mi><mi>&#916;</mi><mi>T</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>V</mi><mo>=</mo><mi>V</mi><mi>&#947;</mi><mi>&#916;</mi><mi>T</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>V</mi><mo>=</mo><mn>3</mn><msup><mi>a</mi><mn>3</mn></msup><mi>&#945;</mi><mi>&#916;</mi><mi>T</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf808", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Feb Shift 1)", "title": "JEE Main 2021 (24 Feb Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a68417cc3fb48d66c04", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf807", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-06T14:00:00.000Z", "isVisible": true, "shortName": "2020 (06 Sep Shift 2)", "title": "JEE Main 2020 (06 Sep Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Three&nbsp;rods of identical cross-section and length are made of three different materials of thermal conductivity&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>K</mi><mn>2</mn></msub></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mn>3</mn></msub></math>, respectively. They are joined together at their ends to make a long rod (see figure). One end of&nbsp;the long rod is maintained at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>&nbsp;and the other at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>&nbsp;(see figure). If the joints of the rod are at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>70</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>&nbsp;in steady and there is no loss of energy from the surface of the rod, the correct relationship between&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mn>1</mn></msub><mo mathvariant=\"italic\">,</mo><mo mathvariant=\"italic\">&#160;</mo><msub><mi>K</mi><mn mathvariant=\"italic\">2</mn></msub></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mn>3</mn></msub></math>&nbsp;is :</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/27b8354c-3133-42dc-9f19-fb14ddccfb58-image.png\" style=\"width: 589px; height: 145px;\" />&nbsp;&nbsp;&nbsp;</p>", "image": null}, "options": [{"id": "6DL3U", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mn>1</mn></msub><mo>:</mo><msub><mi>K</mi><mn>3</mn></msub><mo>=</mo><mn>2</mn><mo>:</mo><mn>3</mn></math>,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mn>2</mn></msub><mo>:</mo><msub><mi>K</mi><mn>3</mn></msub><mo>=</mo><mn>2</mn><mo>:</mo><mn>5</mn></math>", "isCorrect": true, "image": null}, {"id": "rlGGP", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mn>1</mn></msub><mo>&#60;</mo><msub><mi>K</mi><mn>2</mn></msub><mo>&#60;</mo><msub><mi>K</mi><mn>3</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "FKERD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mn>1</mn></msub><mo>:</mo><msub><mi>K</mi><mn>2</mn></msub><mo>=</mo><mn>5</mn><mo>:</mo><mn>2</mn></math>,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mn>1</mn></msub><mo>:</mo><msub><mi>K</mi><mn>3</mn></msub><mo>=</mo><mn>3</mn><mo>:</mo><mn>5</mn></math>", "isCorrect": false, "image": null}, {"id": "YMoHa", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mn>1</mn></msub><mo>&#62;</mo><msub><mi>K</mi><mn>2</mn></msub><mo>&#62;</mo><msub><mi>K</mi><mn>3</mn></msub></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">K</mi><mn>1</mn></msub><mo>(</mo><mn>100</mn><mo>-</mo><mn>70</mn><mo>)</mo><mo>=</mo><msub><mi mathvariant=\"normal\">K</mi><mn>2</mn></msub><mo>(</mo><mn>70</mn><mo>-</mo><mn>20</mn><mo>)</mo><mo>=</mo><msub><mi mathvariant=\"normal\">K</mi><mn>3</mn></msub><mo>(</mo><mn>20</mn><mo>-</mo><mn>0</mn><mo>)</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">K</mi><mn>1</mn></msub><mn>30</mn><mo>=</mo><msub><mi mathvariant=\"normal\">K</mi><mn>2</mn></msub><mo>(</mo><mn>50</mn><mo>)</mo><mo>=</mo><msub><mi mathvariant=\"normal\">K</mi><mn>3</mn></msub><mo>(</mo><mn>20</mn><mo>)</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi mathvariant=\"normal\">K</mi><mn>1</mn></msub><mo>:</mo><msub><mi mathvariant=\"normal\">K</mi><mn>2</mn></msub><mo>:</mo><msub><mi mathvariant=\"normal\">K</mi><mn>3</mn></msub><mo>=</mo><mn>10</mn><mo>:</mo><mn>6</mn><mo>:</mo><mn>15</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">K</mi><mn>1</mn></msub><mo>:</mo><msub><mi mathvariant=\"normal\">K</mi><mn>3</mn></msub><mo>=</mo><mn>2</mn><mo>:</mo><mn>3</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["DIAGRAM_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92edde3d91842a5cf807", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-06T14:00:00.000Z", "isVisible": true, "shortName": "2020 (06 Sep Shift 2)", "title": "JEE Main 2020 (06 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a68417cc3fb48d66b73", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf805", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-05T14:00:00.000Z", "isVisible": true, "shortName": "2020 (05 Sep Shift 2)", "title": "JEE Main 2020 (05 Sep Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Two different wires having lengths <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>2</mn></msub></math> and respective temperature coeffi <mi mathvariant=\"normal\">g</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>π</mi><mo>×</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>0.001</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mn>11</mn></mrow></msup><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>×</mo><mn>20</mn></mrow><mrow><mn>10</mn></mrow></mfrac><mo>=</mo><mn>2</mn><mi>π</mi></math>  <br/>Closest value of <math><mi mathvariant=\"normal\">M</mi></math> is 9 kg.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Apr Shift 1)", "title": "JEE Main 2019 (12 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d6679e", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7ed", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T14:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 2)", "title": "JEE Main 2019 (11 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Two rods $A$ and $B$ of identical dimensions are at temperature $30^{\\circ} \\mathrm{C}$. If $\\mathrm{A}$ is heated upto $180^{\\circ} \\mathrm{C}$ and $\\mathrm{B}$ upto $\\mathrm{T}^{\\circ} \\mathrm{C},$ then the new lengths are the same. If the ratio of the coefficients of linear expansion of $\\mathrm{A}$ and $\\mathrm{B}$ is $4: 3,$ then the value of $T$ is", "image": null}, "options": [{"id": "2uB0J", "text": "$230^{\\circ} \\mathrm{C}$", "isCorrect": true, "image": null}, {"id": "NpCTO", "text": "$270^{\\circ} \\mathrm{C}$", "isCorrect": false, "image": null}, {"id": "CLpTb", "text": "$200^{\\circ} \\mathrm{C}$", "isCorrect": false, "image": null}, {"id": "DYaTi", "text": "$250^{\\circ} \\mathrm{C}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Change in length in both rods are same i.e.\r\n\r\n$\\Delta \\ell_{1}=\\Delta \\ell_{2}$\r\n\r\n$\\ell \\alpha_{1} \\Delta \\theta_{1}=\\ell \\alpha_{2} \\Delta \\theta_{2}$\r\n\r\n$\\begin{array}{l}\r\n\r\n\\frac{\\alpha_{1}}{\\alpha_{2}}=\\frac{\\Delta \\theta_{2}}{\\Delta \\theta_{1}} \\quad\\left[\\because \\frac{\\alpha_{1}}{\\alpha_{2}}=\\frac{4}{3}\\right] \\\\\r\n\r\n\\frac{4}{3}=\\frac{\\theta-30}{180-30}\r\n\r\n\\end{array}$\r\n\r\n$\\theta=230^{\\circ} \\mathrm{C}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ed", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T14:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 2)", "title": "JEE Main 2019 (11 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d661a7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2017-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2017 (09 Apr Online)", "title": "JEE Main 2017 (09 Apr Online)"}], "question": {"text": "A steel rail of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math> and area of cross section <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mi>&#160;</mi><msup><mi>cm</mi><mn>2</mn></msup></math> is prevented from expanding along its length while the temperature rises by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> . If coefficient of linear expansion and Young&#39;s modulus of steel are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1.2</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mr
